  - id: vax_evt_billing
    subject: [vax_dose_administered, vax_course_billing_updated]
    rule: >-
      Each dose is paid by exactly one route, chosen in this order. A child no older than vfc_max_age_years who is
      uninsured or on Medicaid receives Vaccines for Children stock where vfc_program_available is true, billing_route
      no_cost_program, paying vfc_admin_fee_usd. A patient whose primary coverage is a Medicare class is billed to
      Medicare Part B where medicare_part_b_billable is true, or to the Part D plan on file where
      medicare_part_d_billable is true, billing_route medical_benefit or pharmacy_benefit respectively. Any other patient
      with an active coverage record is billed to it, billing_route pharmacy_benefit. Where insured_zero_cost_share is
      true and the patient meets the vaccine's recommendation, an insured dose costs the patient 0.00. Every other dose is
      paid in cash at cash_price_usd, less the savings program's vaccine discount where the patient holds an active
      Kestrel Rx Savings Club membership, rounded to the cent half up. A course's billing route is updated only for doses
      not yet given; a dose already given keeps the route it was paid by.
    eligibility: []
    params:
      per_tier:
        Seasonal Influenza Standard-Dose Vaccination: {cash_price_usd: =cash_price_usd, medicare_part_b_billable: =medicare_part_b_billable, medicare_part_d_billable: =medicare_part_d_billable, insured_zero_cost_share: =insured_zero_cost_share, vfc_program_available: =vfc_program_available, vfc_max_age_years: =vfc_max_age_years, vfc_admin_fee_usd: =vfc_admin_fee_usd}
        Seasonal Influenza High-Dose Vaccination: {cash_price_usd: =cash_price_usd, medicare_part_b_billable: =medicare_part_b_billable, medicare_part_d_billable: =medicare_part_d_billable, insured_zero_cost_share: =insured_zero_cost_share, vfc_program_available: =vfc_program_available, vfc_max_age_years: =vfc_max_age_years, vfc_admin_fee_usd: =vfc_admin_fee_usd}
        COVID-19 Updated Vaccination: {cash_price_usd: =cash_price_usd, medicare_part_b_billable: =medicare_part_b_billable, medicare_part_d_billable: =medicare_part_d_billable, insured_zero_cost_share: =insured_zero_cost_share, vfc_program_available: =vfc_program_available, vfc_max_age_years: =vfc_max_age_years, vfc_admin_fee_usd: =vfc_admin_fee_usd}
        RSV Older Adult Vaccination: {cash_price_usd: =cash_price_usd, medicare_part_b_billable: =medicare_part_b_billable, medicare_part_d_billable: =medicare_part_d_billable, insured_zero_cost_share: =insured_zero_cost_share, vfc_program_available: =vfc_program_available, vfc_max_age_years: =vfc_max_age_years, vfc_admin_fee_usd: =vfc_admin_fee_usd}
        Pneumococcal Conjugate Vaccination: {cash_price_usd: =cash_price_usd, medicare_part_b_billable: =medicare_part_b_billable, medicare_part_d_billable: =medicare_part_d_billable, insured_zero_cost_share: =insured_zero_cost_share, vfc_program_available: =vfc_program_available, vfc_max_age_years: =vfc_max_age_years, vfc_admin_fee_usd: =vfc_admin_fee_usd}
        Recombinant Zoster Two-Dose Series: {cash_price_usd: =cash_price_usd, medicare_part_b_billable: =medicare_part_b_billable, medicare_part_d_billable: =medicare_part_d_billable, insured_zero_cost_share: =insured_zero_cost_share, vfc_program_available: =vfc_program_available, vfc_max_age_years: =vfc_max_age_years, vfc_admin_fee_usd: =vfc_admin_fee_usd}
        Hepatitis B Three-Dose Series: {cash_price_usd: =cash_price_usd, medicare_part_b_billable: =medicare_part_b_billable, medicare_part_d_billable: =medicare_part_d_billable, insured_zero_cost_share: =insured_zero_cost_share, vfc_program_available: =vfc_program_available, vfc_max_age_years: =vfc_max_age_years, vfc_admin_fee_usd: =vfc_admin_fee_usd}
  - id: vax_evt_invalid_dose
    subject: [vax_dose_invalidated, vax_course_reopened]
    rule: >-
      A dose is invalid when it was given earlier than its minimum interval less grace_period_days, or when the patient
      was below min_age_years on the dose date. An invalid dose does not count toward the course: the course needs one
      more dose, which is given no earlier than the invalid dose's date plus the same minimum interval, and if the
      invalid dose had completed the course the course returns to in_progress. A dose is invalidated at most once. The
      patient is not charged for the repeat dose where the invalid dose was given early by Kestrel; a dose given too early
      elsewhere and recorded as an outside dose is simply not counted.
    eligibility:
      - id: invalidate_once
        applies_to: [vax_dose_invalidated]
        kind: dedup
        condition: A dose is invalidated at most once.
        evidence_fields: [vax_events.source_event_id, vax_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vax_events.source_event_id]
          action_bindings:
            vax_events.source_event_id: source_event_id
        dedup_contract:
          table: vax_events
          mode: separate_record
          object_bindings: {source_event_id: source_event_id}
          duplicate_filters: {event_type: [vax_dose_invalidated]}
          distinct_fields: []
    params:
      per_tier:
        Seasonal Influenza Standard-Dose Vaccination: {grace_period_days: =grace_period_days, min_age_years: =min_age_years}
        Seasonal Influenza High-Dose Vaccination: {grace_period_days: =grace_period_days, min_age_years: =min_age_years}
        COVID-19 Updated Vaccination: {grace_period_days: =grace_period_days, min_age_years: =min_age_years}
        RSV Older Adult Vaccination: {grace_period_days: =grace_period_days, min_age_years: =min_age_years}
        Pneumococcal Conjugate Vaccination: {grace_period_days: =grace_period_days, min_age_years: =min_age_years}
        Recombinant Zoster Two-Dose Series: {grace_period_days: =grace_period_days, min_age_years: =min_age_years}
        Hepatitis B Three-Dose Series: {grace_period_days: =grace_period_days, min_age_years: =min_age_years}
  - id: vax_course_closure
    subject: [vax_series_started, vax_course_completed, vax_course_cancelled]
    rule: >-
      A course starts when its first dose of a multi-dose series is given and completes when the dose recorded as
      is_final_dose true is given. A course is cancelled only at the patient's own request, which the patient confirms
      themselves; cancelling ends any open appointment of the course, keeps every dose already given on record, and a
      later wish to finish the series opens a new course in which outside and earlier doses count where
      outside_record_accepted is true. When the vaccine the patient booked is out of stock, the listed
      substitute_variant_if_unavailable may be given instead by opening a course of that vaccination; where the listed
      value is none the appointment is rebooked.
    eligibility: []
    params:
      per_tier:
        Seasonal Influenza Standard-Dose Vaccination: {substitute_variant_if_unavailable: =substitute_variant_if_unavailable, outside_record_accepted: =outside_record_accepted}
        Seasonal Influenza High-Dose Vaccination: {substitute_variant_if_unavailable: =substitute_variant_if_unavailable, outside_record_accepted: =outside_record_accepted}
        COVID-19 Updated Vaccination: {substitute_variant_if_unavailable: =substitute_variant_if_unavailable, outside_record_accepted: =outside_record_accepted}
        RSV Older Adult Vaccination: {substitute_variant_if_unavailable: =substitute_variant_if_unavailable, outside_record_accepted: =outside_record_accepted}
        Pneumococcal Conjugate Vaccination: {substitute_variant_if_unavailable: =substitute_variant_if_unavailable, outside_record_accepted: =outside_record_accepted}
        Recombinant Zoster Two-Dose Series: {substitute_variant_if_unavailable: =substitute_variant_if_unavailable, outside_record_accepted: =outside_record_accepted}
        Hepatitis B Three-Dose Series: {substitute_variant_if_unavailable: =substitute_variant_if_unavailable, outside_record_accepted: =outside_record_accepted}
  - id: vax_evt_registry_reporting
    subject: [vax_registry_reported]
    rule: >-
      Every dose given at Kestrel is reported to the state immunization registry of the store's state. A dose is reported
      no later than the date the dose was given plus the registry report deadline days, counted in calendar days with
      the dose date as day 0. Each dose is reported once; a dose later invalidated stays reported and the invalidation is
      noted by the pharmacist directly with the registry.
    eligibility:
      - id: report_deadline
        applies_to: [vax_registry_reported]
        kind: time
        condition: A dose is reported no later than the date the dose was given plus the registry report deadline days, counted in calendar days with the dose date as day 0.
        evidence_fields: [vax_events.event_date, vax_events.vax_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [vax_events.vax_event_id]
          action_bindings:
            vax_events.vax_event_id: source_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the dose was given
          anchor_source: vax_events.event_date
          relation: not_after
          duration_source: params.registry_report_deadline_days
          unit: calendar_days
          counting_rule: counted in calendar days with the dose date as day 0
          boundary: inclusive
    params:
      per_tier:
        Seasonal Influenza Standard-Dose Vaccination: {registry_report_deadline_days: =registry_report_deadline_days}
        Seasonal Influenza High-Dose Vaccination: {registry_report_deadline_days: =registry_report_deadline_days}
        COVID-19 Updated Vaccination: {registry_report_deadline_days: =registry_report_deadline_days}
        RSV Older Adult Vaccination: {registry_report_deadline_days: =registry_report_deadline_days}
        Pneumococcal Conjugate Vaccination: {registry_report_deadline_days: =registry_report_deadline_days}
        Recombinant Zoster Two-Dose Series: {registry_report_deadline_days: =registry_report_deadline_days}
        Hepatitis B Three-Dose Series: {registry_report_deadline_days: =registry_report_deadline_days}

extended_policies:
  - id: vax_ext_dose_invalidation_balance
    base_policy_refs:
    - vax_evt_invalid_dose
    - vax_evt_dose_administration
    overwrite:
    - base_policy: vax_evt_invalid_dose
      superseded_clause: 'An invalid dose does not count toward the course: the course needs one more dose'
      replaced_by: Where the dose history holds more dose entries than the course's required doses less its doses
        still needed and the course is closed, the count is rebuilt as the valid doses the course requires less the
        dose entries that stand once registry copies, the dose found not to count, the dose 1 entries set aside and
        the entries set aside after closing are taken off.
    trigger: state_due
    subject:
    - vax_dose_invalidated
    - vax_course_reopened
    computes: doses_remaining
    target_tool: invalidate_series_dose_51b39017
    params:
      found_entries_outside: 1
      found_entries_kestrel: 2
      after_close_set_aside_documented: 0
    rule: When a dose on a course is found not to count, the invalidation entry restates the valid doses the course
      still needs. The restated count is the course's valid doses still needed as the course shows them before the
      entry, plus the one dose the entry takes off, and it is never below zero nor above the valid doses the course
      requires. The restatement is made in one of three ways, according to whether the course's dose history holds
      more dose entries than its valid doses still needed account for. Where the dose history holds more dose entries
      than the course's required doses less its doses still needed and the course is closed, the count is rebuilt
      as the valid doses the course requires less the dose entries that stand once registry copies, the dose found
      not to count, the dose 1 entries set aside and the entries set aside after closing are taken off. Where the
      dose history holds more such entries and the course is open, the count is rebuilt the same way from the counted
      entries less registry copies and the dose found not to count. Where the dose history holds no more dose entries
      than that, the count is the course's valid doses still needed before the entry plus one. The dose entries a
      rebuild counts from are chosen as follows. For a closed course with a dose Kestrel reported to the state registry,
      every dose entry on the course is counted. For an open course with a dose Kestrel reported, only the dose entries
      that carry a lot number are counted. For a course with no dose Kestrel reported, only the doses Kestrel reported
      are counted. Registry copies are identified as follows. Where the dose history holds a dose entry recorded from
      another provider that is billed to a pharmacy benefit and Kestrel reported a dose of the course, each such entry
      is a registry copy of Kestrel's own report. Where it holds such an entry and Kestrel reported no dose of the
      course, every entry recorded from another provider is treated as unverified and set aside as a copy. Where it
      holds no such entry, no entry is a copy. The dose found not to count is taken off as follows. Where the latest
      dose on record came too early, meaning dose 2 less than the dose 2 minimum interval less the grace period days
      after dose 1, or dose 3 less than the dose 3 minimum interval from dose 2 less the grace period days after dose
      2 or less than the dose 3 minimum interval from dose 1 less the grace period days after dose 1, and it was recorded
      from another provider, found_entries_outside entries are taken off. Where the latest dose came too early and
      Kestrel gave it at one of its stores, found_entries_kestrel entries are taken off, the dose and the registry
      copy of Kestrel's report of it. Where the latest dose did not come too early, no entry is taken off as found.
      Dose 1 entries recorded from another provider are handled as follows. Where every such entry carries a lot number
      and Kestrel gave a later dose of the course at one of its stores, they all stand. Where at least one such entry
      carries no lot number and Kestrel gave a later dose of the course at one of its stores, only the entries without
      a lot number are set aside. In every other case every dose 1 entry recorded from another provider is set aside.
      Dose entries dated after a course closed are handled as follows, counting as such the entries dated within the
      whole calendar months since the closing date. Where every such entry carries a lot number and Kestrel gave a
      dose of the course at one of its stores, after_close_set_aside_documented of them are set aside, since a closed
      series is resumed and not restarted. Where every such entry carries a lot number and Kestrel gave no dose of
      the course, all but one of them are set aside. In every other case, including where any such entry carries no
      lot number, every entry dated after the closing date is set aside.
    prerequisite: []
    cross_category: []
    compute:
    - required_doses: F('doses_required')
    - shown_needed: F('doses_remaining')
    - dose_entries: COUNT('vax_events', event_type='vax_dose_administered')
    - reported_doses: COUNT('vax_events', event_type='vax_registry_reported')
    - closed_days: DAYS(F('closed_date'), NOW) if F('closed_date') else -1
    - lotted_entries: dose_entries - COUNT('vax_events', event_type='vax_dose_administered', lot_number=None)
    - counted_entries: dose_entries if (closed_days >= 0 and reported_doses >= 1) else (lotted_entries if (closed_days
        < 0 and reported_doses >= 1) else reported_doses)
    - plan_billed_outside: COUNT('vax_events', event_type='vax_dose_administered', store_id=None, billing_route='pharmacy_benefit')
    - outside_entries: COUNT('vax_events', event_type='vax_dose_administered', store_id=None)
    - registry_copies: plan_billed_outside if (plan_billed_outside >= 1 and reported_doses >= 1) else (outside_entries
        if (plan_billed_outside >= 1 and reported_doses == 0) else 0)
    - first_dose_on: LATEST('vax_events', 'event_date', event_type='vax_dose_administered', dose_number=1)
    - second_dose_on: LATEST('vax_events', 'event_date', event_type='vax_dose_administered', dose_number=2)
    - latest_dose_on: LATEST('vax_events', 'event_date', event_type='vax_dose_administered')
    - latest_dose_number: LATEST('vax_events', 'dose_number', event_type='vax_dose_administered')
    - latest_dose_store: LATEST('vax_events', 'store_id', event_type='vax_dose_administered')
    - latest_too_early: (latest_dose_number == 2 and DAYS(first_dose_on, latest_dose_on) < P('dose2_min_interval_days')
        - P('grace_period_days')) or (latest_dose_number == 3 and (DAYS(second_dose_on, latest_dose_on) < P('dose3_min_interval_days_from_dose2')
        - P('grace_period_days') or DAYS(first_dose_on, latest_dose_on) < P('dose3_min_interval_days_from_dose1')
        - P('grace_period_days')))
    - found_taken_off: K('found_entries_outside') if (latest_too_early and latest_dose_store == None) else (K('found_entries_kestrel')
        if (latest_too_early and latest_dose_store != None) else 0)
    - outside_first: COUNT('vax_events', event_type='vax_dose_administered', dose_number=1, store_id=None)
    - outside_first_unlotted: COUNT('vax_events', event_type='vax_dose_administered', dose_number=1, store_id=None,
        lot_number=None)
    - kestrel_later_doses: (COUNT('vax_events', event_type='vax_dose_administered', dose_number=2) - COUNT('vax_events',
        event_type='vax_dose_administered', dose_number=2, store_id=None)) + (COUNT('vax_events', event_type='vax_dose_administered',
        dose_number=3) - COUNT('vax_events', event_type='vax_dose_administered', dose_number=3, store_id=None))
    - first_set_aside: 0 if (outside_first_unlotted == 0 and kestrel_later_doses >= 1) else (outside_first_unlotted
        if (outside_first_unlotted >= 1 and kestrel_later_doses >= 1) else outside_first)
    - after_close_entries: COUNT('vax_events', within_months=MONTHS(F('closed_date'), NOW), event_type='vax_dose_administered')
        if F('closed_date') else 0
    - after_close_unlotted: COUNT('vax_events', within_months=MONTHS(F('closed_date'), NOW), event_type='vax_dose_administered',
        lot_number=None) if F('closed_date') else 0
    - after_close_set_aside: K('after_close_set_aside_documented') if (after_close_entries >= 1 and after_close_unlotted
        == 0 and dose_entries - outside_entries >= 1) else ((after_close_entries - 1) if (after_close_entries >= 1
        and after_close_unlotted == 0 and dose_entries - outside_entries == 0) else after_close_entries)
    - account_gap: dose_entries - (required_doses - shown_needed)
    - restated_needed: (required_doses - (counted_entries - registry_copies - found_taken_off - first_set_aside -
        after_close_set_aside)) if (account_gap >= 1 and closed_days >= 0) else ((required_doses - (counted_entries
        - registry_copies - found_taken_off)) if (account_gap >= 1 and closed_days < 0) else (shown_needed + 1))
    - result: MX(0, MN(required_doses, restated_needed))
    compute_basis:
      required_doses: The restated count is the course's valid doses still needed as the course shows them before
        the entry, plus the one dose the entry takes off, and it is never below zero nor above the valid doses the
        course requires.
      shown_needed: The restated count is the course's valid doses still needed as the course shows them before the
        entry, plus the one dose the entry takes off, and it is never below zero nor above the valid doses the course
        requires.
      dose_entries: Where the dose history holds more dose entries than the course's required doses less its doses
        still needed and the course is closed, the count is rebuilt as the valid doses the course requires less the
        dose entries that stand once registry copies, the dose found not to count, the dose 1 entries set aside and
        the entries set aside after closing are taken off.
      reported_doses: For a closed course with a dose Kestrel reported to the state registry, every dose entry on
        the course is counted.
      closed_days: Where the dose history holds more dose entries than the course's required doses less its doses
        still needed and the course is closed, the count is rebuilt as the valid doses the course requires less the
        dose entries that stand once registry copies, the dose found not to count, the dose 1 entries set aside and
        the entries set aside after closing are taken off. Where the dose history holds more such entries and the
        course is open, the count is rebuilt the same way from the counted entries less registry copies and the dose
        found not to count.
      lotted_entries: For an open course with a dose Kestrel reported, only the dose entries that carry a lot number
        are counted.
      counted_entries: For a closed course with a dose Kestrel reported to the state registry, every dose entry on
        the course is counted. For an open course with a dose Kestrel reported, only the dose entries that carry a
        lot number are counted. For a course with no dose Kestrel reported, only the doses Kestrel reported are counted.
      plan_billed_outside: Where the dose history holds a dose entry recorded from another provider that is billed
        to a pharmacy benefit and Kestrel reported a dose of the course, each such entry is a registry copy of Kestrel's
        own report.
      outside_entries: Where it holds such an entry and Kestrel reported no dose of the course, every entry recorded
        from another provider is treated as unverified and set aside as a copy.
      registry_copies: Where the dose history holds a dose entry recorded from another provider that is billed to
        a pharmacy benefit and Kestrel reported a dose of the course, each such entry is a registry copy of Kestrel's
        own report. Where it holds such an entry and Kestrel reported no dose of the course, every entry recorded
        from another provider is treated as unverified and set aside as a copy. Where it holds no such entry, no entry
        is a copy.
      first_dose_on: Where the latest dose on record came too early, meaning dose 2 less than the dose 2 minimum interval
        less the grace period days after dose 1, or dose 3 less than the dose 3 minimum interval from dose 2 less
        the grace period days after dose 2 or less than the dose 3 minimum interval from dose 1 less the grace period
        days after dose 1, and it was recorded from another provider, found_entries_outside entries are taken off.
      second_dose_on: Where the latest dose on record came too early, meaning dose 2 less than the dose 2 minimum
        interval less the grace period days after dose 1, or dose 3 less than the dose 3 minimum interval from dose
        2 less the grace period days after dose 2 or less than the dose 3 minimum interval from dose 1 less the grace
        period days after dose 1, and it was recorded from another provider, found_entries_outside entries are taken
        off.
      latest_dose_on: Where the latest dose on record came too early, meaning dose 2 less than the dose 2 minimum
        interval less the grace period days after dose 1, or dose 3 less than the dose 3 minimum interval from dose
        2 less the grace period days after dose 2 or less than the dose 3 minimum interval from dose 1 less the grace
        period days after dose 1, and it was recorded from another provider, found_entries_outside entries are taken
        off.
      latest_dose_number: Where the latest dose on record came too early, meaning dose 2 less than the dose 2 minimum
        interval less the grace period days after dose 1, or dose 3 less than the dose 3 minimum interval from dose
        2 less the grace period days after dose 2 or less than the dose 3 minimum interval from dose 1 less the grace
        period days after dose 1, and it was recorded from another provider, found_entries_outside entries are taken
        off.
      latest_dose_store: Where the latest dose on record came too early, meaning dose 2 less than the dose 2 minimum
        interval less the grace period days after dose 1, or dose 3 less than the dose 3 minimum interval from dose
        2 less the grace period days after dose 2 or less than the dose 3 minimum interval from dose 1 less the grace
        period days after dose 1, and it was recorded from another provider, found_entries_outside entries are taken
        off. Where the latest dose came too early and Kestrel gave it at one of its stores, found_entries_kestrel
        entries are taken off, the dose and the registry copy of Kestrel's report of it.
      latest_too_early: Where the latest dose on record came too early, meaning dose 2 less than the dose 2 minimum
        interval less the grace period days after dose 1, or dose 3 less than the dose 3 minimum interval from dose
        2 less the grace period days after dose 2 or less than the dose 3 minimum interval from dose 1 less the grace
        period days after dose 1, and it was recorded from another provider, found_entries_outside entries are taken
        off.
      found_taken_off: Where the latest dose on record came too early, meaning dose 2 less than the dose 2 minimum
        interval less the grace period days after dose 1, or dose 3 less than the dose 3 minimum interval from dose
        2 less the grace period days after dose 2 or less than the dose 3 minimum interval from dose 1 less the grace
        period days after dose 1, and it was recorded from another provider, found_entries_outside entries are taken
        off. Where the latest dose came too early and Kestrel gave it at one of its stores, found_entries_kestrel
        entries are taken off, the dose and the registry copy of Kestrel's report of it. Where the latest dose did
        not come too early, no entry is taken off as found.
      outside_first: In every other case every dose 1 entry recorded from another provider is set aside.
      outside_first_unlotted: Where at least one such entry carries no lot number and Kestrel gave a later dose of
        the course at one of its stores, only the entries without a lot number are set aside.
      kestrel_later_doses: Where every such entry carries a lot number and Kestrel gave a later dose of the course
        at one of its stores, they all stand. Where at least one such entry carries no lot number and Kestrel gave
        a later dose of the course at one of its stores, only the entries without a lot number are set aside.
      first_set_aside: Where every such entry carries a lot number and Kestrel gave a later dose of the course at
        one of its stores, they all stand. Where at least one such entry carries no lot number and Kestrel gave a
        later dose of the course at one of its stores, only the entries without a lot number are set aside. In every
        other case every dose 1 entry recorded from another provider is set aside.
      after_close_entries: Dose entries dated after a course closed are handled as follows, counting as such the entries
        dated within the whole calendar months since the closing date.
      after_close_unlotted: In every other case, including where any such entry carries no lot number, every entry
        dated after the closing date is set aside.
      after_close_set_aside: Where every such entry carries a lot number and Kestrel gave a dose of the course at
        one of its stores, after_close_set_aside_documented of them are set aside, since a closed series is resumed
        and not restarted. Where every such entry carries a lot number and Kestrel gave no dose of the course, all
        but one of them are set aside. In every other case, including where any such entry carries no lot number,
        every entry dated after the closing date is set aside.
      account_gap: Where the dose history holds more dose entries than the course's required doses less its doses
        still needed and the course is closed, the count is rebuilt as the valid doses the course requires less the
        dose entries that stand once registry copies, the dose found not to count, the dose 1 entries set aside and
        the entries set aside after closing are taken off. Where the dose history holds no more dose entries than
        that, the count is the course's valid doses still needed before the entry plus one.
      restated_needed: Where the dose history holds more dose entries than the course's required doses less its doses
        still needed and the course is closed, the count is rebuilt as the valid doses the course requires less the
        dose entries that stand once registry copies, the dose found not to count, the dose 1 entries set aside and
        the entries set aside after closing are taken off. Where the dose history holds more such entries and the
        course is open, the count is rebuilt the same way from the counted entries less registry copies and the dose
        found not to count. Where the dose history holds no more dose entries than that, the count is the course's
        valid doses still needed before the entry plus one.
      result: The restated count is the course's valid doses still needed as the course shows them before the entry,
        plus the one dose the entry takes off, and it is never below zero nor above the valid doses the course requires.
    factors:
    - id: counted_history
      effect: method
      decides: counted_entries
      bindings:
      - lotted_entries
      - counted_entries
      ladder:
      - when: the course is closed and Kestrel reported a dose of it to the registry
        method: every dose entry on the course is counted
      - when: the course is open and Kestrel reported a dose of it
        method: only the dose entries that carry a lot number are counted
      - when: otherwise
        method: only the doses Kestrel reported are counted
      baseline:
        counted_entries: reported_doses
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: registry_copy
      effect: method
      decides: registry_copies
      bindings:
      - plan_billed_outside
      - outside_entries
      - registry_copies
      ladder:
      - when: an entry recorded from another provider is billed to a pharmacy benefit and Kestrel reported a dose
          of the course
        method: each such entry is a registry copy and is taken off
      - when: such an entry exists and Kestrel reported no dose of the course
        method: every entry recorded from another provider is set aside as unverified
      - when: otherwise
        method: no entry is a copy
      baseline:
        registry_copies: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: found_dose
      effect: parameter
      decides: found_taken_off
      bindings:
      - first_dose_on
      - second_dose_on
      - latest_dose_on
      - latest_dose_number
      - latest_dose_store
      - latest_too_early
      - found_taken_off
      ladder:
      - when: the latest dose came too early and was recorded from another provider
        value: K('found_entries_outside')
      - when: the latest dose came too early and Kestrel gave it at one of its stores
        value: K('found_entries_kestrel')
      - when: otherwise
        value: '0'
      baseline:
        found_taken_off: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: outside_first_dose
      effect: method
      decides: first_set_aside
      bindings:
      - outside_first
      - outside_first_unlotted
      - kestrel_later_doses
      - first_set_aside
      ladder:
      - when: every dose 1 entry recorded from another provider carries a lot number and Kestrel gave a later dose
          of the course at one of its stores
        method: they all stand
      - when: at least one such entry carries no lot number and Kestrel gave a later dose at one of its stores
        method: only the entries without a lot number are set aside
      - when: otherwise
        method: every dose 1 entry recorded from another provider is set aside
      baseline:
        first_set_aside: outside_first
      evidence:
      - history
      cross_difficulty: null
    - id: after_closing
      effect: parameter
      decides: after_close_set_aside
      bindings:
      - after_close_entries
      - after_close_unlotted
      - after_close_set_aside
      ladder:
      - when: every entry dated after the course closed carries a lot number and Kestrel gave a dose of the course
          at one of its stores
        value: K('after_close_set_aside_documented')
      - when: every such entry carries a lot number and Kestrel gave no dose of the course
        value: after_close_entries - 1
      - when: otherwise, including where any such entry carries no lot number
        value: after_close_entries
      baseline:
        after_close_set_aside: after_close_entries
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: restatement_way
      effect: method
      decides: restated_needed
      bindings:
      - closed_days
      - account_gap
      - restated_needed
      ladder:
      - when: the dose history holds more dose entries than the required doses less the doses still needed and the
          course is closed
        method: rebuild from the dose history, taking off copies, the found dose, set-aside dose 1 entries and set-aside
          entries after closing
      - when: the dose history holds more such entries and the course is open
        method: rebuild from the counted entries less copies and the found dose
      - when: otherwise
        method: the doses still needed before the entry plus one
      baseline:
        restated_needed: shown_needed + 1
      evidence:
      - history
      - date
      cross_difficulty: null
    baseline:
      params: []
      rule: The restated count is the course's valid doses still needed as the course shows them before the entry,
        plus the one dose the entry takes off, and it is never below zero nor above the valid doses the course requires.
    inputs:
      history:
      - table: vax_events
        aggregate: count
        field: vax_event_id
        filters:
          event_type: vax_dose_administered
      - table: vax_events
        aggregate: count
        field: vax_event_id
        filters:
          event_type: vax_registry_reported
      - table: vax_events
        aggregate: latest
        field: event_date
        filters:
          event_type: vax_dose_administered
      cross_category: []
  - id: vax_ext_resumed_course_opening
    base_policy_refs:
    - vax_agg_multi_holding
    - vax_agg_visit_and_season
    - vax_course_eligibility
    - vax_course_closure
    overwrite:
    - base_policy: vax_course_eligibility
      superseded_clause: Below risk_condition_required_below_age a course is opened only when the patient attests
        a qualifying risk condition, recorded as risk_condition_attested true; Kestrel records the attestation and
        never asks for medical records.
      replaced_by: A resumed course takes the patient's risk condition attestation as recorded on the earlier course
        of the vaccination, and below the risk-condition age it is opened only when that earlier course records the
        attestation.
    - base_policy: vax_course_closure
      superseded_clause: a later wish to finish the series opens a new course in which outside and earlier doses count
        where outside_record_accepted is true
      replaced_by: 'A resumed course credits earlier doses only as set out here: by when the earlier course closed,
        within a credit window, and under the credit rules for Kestrel''s doses, documented outside doses, plan-billed
        outside entries and undocumented outside entries.'
    trigger: on_request
    subject:
    - vax_course_opened
    computes: doses_remaining
    target_tool: open_resumed_course_fd79a681
    params:
      credit_months_short_series: 120
      credit_months_long_series: 240
      credit_for_unmatched_copies: 1
      credit_for_lone_undocumented: 1
    rule: 'When a patient resumes a series on a new course of a vaccination whose earlier course was closed, the new
      course opens with the valid doses it still needs. A new course opens with its valid doses still needed equal
      to the doses in the series of the vaccination. A resumed course credits earlier doses only as set out here:
      by when the earlier course closed, within a credit window, and under the credit rules for Kestrel''s doses,
      documented outside doses, plan-billed outside entries and undocumented outside entries. Where earlier doses
      are credited, the doses still needed are the doses in the series less the credited doses, never below zero.
      Which earlier doses are carried depends on when the earlier course closed. Where the earlier course closed 365
      days ago or less, every earlier dose credited under the rules below is carried. Where it closed more than 365
      days ago, only Kestrel''s own doses are carried, until the outside records are confirmed again. Where the earlier
      course is not closed, nothing is carried and the new course opens as a first course. Earlier doses are looked
      for within a credit window counted back from today in whole calendar months. The credit window is credit_months_long_series
      months where the earlier course''s doses from dose 1 to the latest dose span more than 365 days, credit_months_short_series
      months where they span 365 days or less, and zero months where the earlier course holds no dose 1. Kestrel''s
      own doses are credited as follows, counting the doses Kestrel reported to the state registry within the credit
      window. Where Kestrel reported at least one dose and the patient''s insurance plans show at least as many paid
      claims as reported doses, every reported dose is credited. Where Kestrel reported at least one dose and the
      plans show fewer paid claims than reported doses, only as many reported doses as there are paid claims are credited.
      Where Kestrel reported no dose, no Kestrel dose is credited. Doses documented by another provider are credited
      as follows, counting the cash-paid entries recorded from another provider that carry a lot number within the
      credit window. Where such documented entries exist and the earlier course carries an invalidation entry, the
      documented entries less the invalidation entries are credited. Where such documented entries exist and the earlier
      course carries no invalidation entry, every documented entry is credited. Where no such documented entry exists,
      no outside dose is credited. Entries recorded from another provider that are billed to a pharmacy benefit are
      credited as follows. Where Kestrel reported a dose of the earlier course, they are registry copies of Kestrel''s
      reports and none of them is credited. Where Kestrel reported no dose and the patient''s plans show a paid claim,
      at most credit_for_unmatched_copies of them is credited. Where Kestrel reported no dose and the plans show no
      paid claim, each of them is credited. Cash-paid entries recorded from another provider without a lot number
      are credited as follows. Where a documented outside entry also exists, none of them is credited. Where no documented
      outside entry exists and Kestrel reported a dose of the earlier course, at most credit_for_lone_undocumented
      of them is credited. Where no documented outside entry exists and Kestrel reported no dose, each of them is
      credited. A resumed course takes the patient''s risk condition attestation as recorded on the earlier course
      of the vaccination, and below the risk-condition age it is opened only when that earlier course records the
      attestation. A resumed course''s opening doses still needed are fixed only after every dose found too early
      on the earlier course carries its invalidation entry and the earlier course''s valid doses still needed are
      restated.'
    prerequisite:
    - problem: vax_ext_dose_invalidation_balance
      kind: value_input
      gate: outside_credit
      form: state
      policy_source: A resumed course's opening doses still needed are fixed only after every dose found too early
        on the earlier course carries its invalidation entry and the earlier course's valid doses still needed are
        restated.
      condition: Every dose on the earlier course given before its minimum interval less the grace period carries
        a dose invalidation entry, and the earlier course's valid doses still needed show the restated count.
      resolved_by: invalidate_series_dose_51b39017
      effect: Once the invalidation entry stands on the earlier course, the documented outside doses credited drop
        by the invalidated dose, so the new course's opening doses still needed rise by one.
    cross_category:
    - category: coverage
      as: history
      reads:
      - coverage_claims.event_type
      note: The Kestrel-dose credit counts the patient's paid insurance claims against the doses Kestrel reported.
    compute:
    - series_doses: P('doses_in_series')
    - closed_days_ago: DAYS(F('closed_date'), NOW) if F('closed_date') else -1
    - carry_mode: 2 if (closed_days_ago >= 0 and closed_days_ago <= 365) else (1 if closed_days_ago > 365 else 0)
    - series_first_on: LATEST('vax_events', 'event_date', event_type='vax_dose_administered', dose_number=1)
    - series_latest_on: LATEST('vax_events', 'event_date', event_type='vax_dose_administered')
    - credit_window_months: K('credit_months_long_series') if (series_first_on != None and DAYS(series_first_on, series_latest_on)
        > 365) else (K('credit_months_short_series') if (series_first_on != None and DAYS(series_first_on, series_latest_on)
        <= 365) else 0)
    - kestrel_reported: COUNT('vax_events', within_months=credit_window_months, event_type='vax_registry_reported')
    - plan_paid_claims: XCOUNT('coverage', 'coverage_claims', event_type='coverage_claim_paid')
    - kestrel_credit: kestrel_reported if (kestrel_reported >= 1 and plan_paid_claims >= kestrel_reported) else (plan_paid_claims
        if (kestrel_reported >= 1 and plan_paid_claims < kestrel_reported) else 0)
    - cash_outside: COUNT('vax_events', within_months=credit_window_months, event_type='vax_dose_administered', store_id=None,
        billing_route='cash')
    - cash_outside_unlotted: COUNT('vax_events', within_months=credit_window_months, event_type='vax_dose_administered',
        store_id=None, billing_route='cash', lot_number=None)
    - invalidation_entries: COUNT('vax_events', event_type='vax_dose_invalidated')
    - outside_credit: (cash_outside - cash_outside_unlotted - invalidation_entries) if (cash_outside - cash_outside_unlotted
        >= 1 and invalidation_entries >= 1) else ((cash_outside - cash_outside_unlotted) if (cash_outside - cash_outside_unlotted
        >= 1 and invalidation_entries == 0) else 0)
    - plan_billed_copies: COUNT('vax_events', within_months=credit_window_months, event_type='vax_dose_administered',
        store_id=None, billing_route='pharmacy_benefit')
    - copy_credit: 0 if kestrel_reported >= 1 else (MN(plan_billed_copies, K('credit_for_unmatched_copies')) if plan_paid_claims
        >= 1 else plan_billed_copies)
    - unlotted_credit: 0 if cash_outside - cash_outside_unlotted >= 1 else (MN(cash_outside_unlotted, K('credit_for_lone_undocumented'))
        if kestrel_reported >= 1 else cash_outside_unlotted)
    - credited_doses: (kestrel_credit + outside_credit + copy_credit + unlotted_credit) if carry_mode == 2 else (kestrel_credit
        if carry_mode == 1 else 0)
    - result: MX(0, series_doses - credited_doses)
    compute_basis:
      series_doses: A new course opens with its valid doses still needed equal to the doses in the series of the vaccination.
      closed_days_ago: Where the earlier course closed 365 days ago or less, every earlier dose credited under the
        rules below is carried. Where it closed more than 365 days ago, only Kestrel's own doses are carried, until
        the outside records are confirmed again.
      carry_mode: Where the earlier course closed 365 days ago or less, every earlier dose credited under the rules
        below is carried. Where it closed more than 365 days ago, only Kestrel's own doses are carried, until the
        outside records are confirmed again. Where the earlier course is not closed, nothing is carried and the new
        course opens as a first course.
      series_first_on: The credit window is credit_months_long_series months where the earlier course's doses from
        dose 1 to the latest dose span more than 365 days, credit_months_short_series months where they span 365 days
        or less, and zero months where the earlier course holds no dose 1.
      series_latest_on: The credit window is credit_months_long_series months where the earlier course's doses from
        dose 1 to the latest dose span more than 365 days, credit_months_short_series months where they span 365 days
        or less, and zero months where the earlier course holds no dose 1.
      credit_window_months: Earlier doses are looked for within a credit window counted back from today in whole calendar
        months. The credit window is credit_months_long_series months where the earlier course's doses from dose 1
        to the latest dose span more than 365 days, credit_months_short_series months where they span 365 days or
        less, and zero months where the earlier course holds no dose 1.
      kestrel_reported: Kestrel's own doses are credited as follows, counting the doses Kestrel reported to the state
        registry within the credit window.
      plan_paid_claims: Where Kestrel reported at least one dose and the patient's insurance plans show at least as
        many paid claims as reported doses, every reported dose is credited. Where Kestrel reported at least one dose
        and the plans show fewer paid claims than reported doses, only as many reported doses as there are paid claims
        are credited. Where Kestrel reported no dose and the patient's plans show a paid claim, at most credit_for_unmatched_copies
        of them is credited.
      kestrel_credit: Where Kestrel reported at least one dose and the patient's insurance plans show at least as
        many paid claims as reported doses, every reported dose is credited. Where Kestrel reported at least one dose
        and the plans show fewer paid claims than reported doses, only as many reported doses as there are paid claims
        are credited. Where Kestrel reported no dose, no Kestrel dose is credited.
      cash_outside: Doses documented by another provider are credited as follows, counting the cash-paid entries recorded
        from another provider that carry a lot number within the credit window.
      cash_outside_unlotted: Cash-paid entries recorded from another provider without a lot number are credited as
        follows.
      invalidation_entries: Where such documented entries exist and the earlier course carries an invalidation entry,
        the documented entries less the invalidation entries are credited.
      outside_credit: Where such documented entries exist and the earlier course carries an invalidation entry, the
        documented entries less the invalidation entries are credited. Where such documented entries exist and the
        earlier course carries no invalidation entry, every documented entry is credited. Where no such documented
        entry exists, no outside dose is credited.
      plan_billed_copies: Entries recorded from another provider that are billed to a pharmacy benefit are credited
        as follows.
      copy_credit: Where Kestrel reported a dose of the earlier course, they are registry copies of Kestrel's reports
        and none of them is credited. Where Kestrel reported no dose and the patient's plans show a paid claim, at
        most credit_for_unmatched_copies of them is credited. Where Kestrel reported no dose and the plans show no
        paid claim, each of them is credited.
      unlotted_credit: Where a documented outside entry also exists, none of them is credited. Where no documented
        outside entry exists and Kestrel reported a dose of the earlier course, at most credit_for_lone_undocumented
        of them is credited. Where no documented outside entry exists and Kestrel reported no dose, each of them is
        credited.
      credited_doses: 'A resumed course credits earlier doses only as set out here: by when the earlier course closed,
        within a credit window, and under the credit rules for Kestrel''s doses, documented outside doses, plan-billed
        outside entries and undocumented outside entries. Where the earlier course closed 365 days ago or less, every
        earlier dose credited under the rules below is carried. Where it closed more than 365 days ago, only Kestrel''s
        own doses are carried, until the outside records are confirmed again. Where the earlier course is not closed,
        nothing is carried and the new course opens as a first course.'
      result: Where earlier doses are credited, the doses still needed are the doses in the series less the credited
        doses, never below zero.
    factors:
    - id: carry_scope
      effect: method
      decides: carry_mode
      bindings:
      - closed_days_ago
      - carry_mode
      ladder:
      - when: the earlier course closed 365 days ago or less
        method: every earlier dose credited under the credit rules is carried
      - when: the earlier course closed more than 365 days ago
        method: only Kestrel's own doses are carried until the outside records are confirmed again
      - when: otherwise
        method: nothing is carried; the new course opens as a first course
      baseline:
        carry_mode: '0'
      evidence:
      - date
      cross_difficulty: null
    - id: credit_window
      effect: parameter
      decides: credit_window_months
      bindings:
      - series_first_on
      - series_latest_on
      - credit_window_months
      ladder:
      - when: the earlier course's doses span more than 365 days from dose 1 to the latest dose
        value: K('credit_months_long_series')
      - when: they span 365 days or less
        value: K('credit_months_short_series')
      - when: otherwise (no dose 1 on the earlier course)
        value: '0'
      baseline:
        credit_window_months: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: kestrel_dose_credit
      effect: method
      decides: kestrel_credit
      bindings:
      - kestrel_reported
      - plan_paid_claims
      - kestrel_credit
      ladder:
      - when: Kestrel reported at least one dose and the plans show at least as many paid claims
        method: every reported dose is credited
      - when: Kestrel reported at least one dose and the plans show fewer paid claims
        method: only as many reported doses as paid claims are credited
      - when: otherwise
        method: no Kestrel dose is credited
      baseline:
        kestrel_credit: '0'
      evidence:
      - history
      - cross_category
      cross_difficulty: coverage
    - id: outside_dose_credit
      effect: method
      decides: outside_credit
      bindings:
      - cash_outside
      - invalidation_entries
      - outside_credit
      ladder:
      - when: documented outside entries exist and the earlier course carries an invalidation entry
        method: the documented entries less the invalidation entries are credited
      - when: documented outside entries exist and there is no invalidation entry
        method: every documented entry is credited
      - when: otherwise
        method: no outside dose is credited
