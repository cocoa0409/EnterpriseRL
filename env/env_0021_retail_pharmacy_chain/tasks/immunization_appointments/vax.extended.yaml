      - when: Kestrel reported a dose of the earlier course
        value: '0'
      - when: Kestrel reported no dose and the patient's plans show a paid claim
        value: MN(plan_billed_copies, K('credit_for_unmatched_copies'))
      - when: otherwise (no Kestrel report and no paid claim)
