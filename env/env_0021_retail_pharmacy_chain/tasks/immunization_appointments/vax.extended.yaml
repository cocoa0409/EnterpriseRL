  - id: vax_ext_resumed_dose_consent
    base_policy_refs:
    - vax_evt_dose_administration
    overwrite: []
    trigger: on_request
    subject:
    - vax_consent_signed
    computes: dose_number
    target_tool: sign_dose_consent_2c77f168
    params:
      copy_positions_matched: 0
      copy_positions_unmatched: 1
      unlotted_positions_with_documented: 0
      unlotted_positions_alone: 1
    rule: A screening and consent form names the dose of the course it covers. On a newly opened course the form covers
      dose 1. Where the series continues an earlier course of the same vaccination, the numbering continues it as
      follows. Where the earlier course is closed and carries an invalidation entry, the form's dose number is counted
      from the earlier course's dose entries that hold a position. Where the earlier course is closed and carries
      no invalidation entry, the form covers the dose after the doses Kestrel reported on it. Where the earlier course
      is not closed, the numbering starts afresh. A dose entry holds a position unless it carries an invalidation
      entry, is a plan-billed entry recorded from another provider, or is a cash-paid entry recorded from another
      provider without a lot number; such entries hold positions only as set out below. Where the dose number is counted
      from positions, it is formed as follows. Where the earlier course carries an invalidation entry for a dose given
      too early, the form covers the dose after the positions held, which repeats the invalidated dose. Where it carries
      an invalidation entry for a dose given below the minimum age, the form covers the number of the latest dose
      on record. Otherwise the form covers the highest dose number on record plus one. Entries recorded from another
      provider and billed to a pharmacy benefit hold positions as follows. Where Kestrel reported a dose of the earlier
      course they are registry copies and each holds copy_positions_matched positions. Where Kestrel reported no dose
      and a documented cash-paid outside entry exists, together they hold copy_positions_unmatched position. Where
      Kestrel reported no dose and no documented outside entry exists, each of them holds a position. Cash-paid entries
      recorded from another provider without a lot number hold positions as follows. Where a documented outside entry
      also exists, each holds unlotted_positions_with_documented positions. Where no documented outside entry exists
      and Kestrel reported a dose, together they hold unlotted_positions_alone position. Where no documented outside
      entry exists and Kestrel reported no dose, each of them holds a position. The dose number a form covers is set
      only once the resumed course of the vaccination stands open on the patient's profile with its opening doses
      still needed.
    prerequisite:
    - problem: vax_ext_resumed_course_opening
      kind: state_gate
      gate: vax_evt_dose_administration.dose_on_open_course
      form: state
      policy_source: The dose number a form covers is set only once the resumed course of the vaccination stands open
        on the patient's profile with its opening doses still needed.
      condition: A course of the vaccination in scheduled or in_progress status stands on the patient's profile, carrying
        the valid doses still needed it opened with.
      resolved_by: open_resumed_course_fd79a681
      effect: Once the resumed course stands open, the form can be recorded on it; the dose number it covers is counted
        from the earlier course's history.
    cross_category: []
    compute:
    - closed_for_days: DAYS(F('closed_date'), NOW) if F('closed_date') else -1
    - invalidations_on_record: COUNT('vax_events', event_type='vax_dose_invalidated')
    - continue_mode: 2 if (closed_for_days >= 0 and invalidations_on_record >= 1) else (1 if (closed_for_days >= 0
        and invalidations_on_record == 0) else 0)
    - entries_on_record: COUNT('vax_events', event_type='vax_dose_administered')
    - reported_on_record: COUNT('vax_events', event_type='vax_registry_reported')
    - billed_outside_entries: COUNT('vax_events', event_type='vax_dose_administered', store_id=None, billing_route='pharmacy_benefit')
    - unlotted_entries: COUNT('vax_events', event_type='vax_dose_administered', store_id=None, billing_route='cash',
        lot_number=None)
    - lotted_outside_entries: COUNT('vax_events', event_type='vax_dose_administered', store_id=None, billing_route='cash')
        - unlotted_entries
    - copy_positions: (billed_outside_entries * K('copy_positions_matched')) if reported_on_record >= 1 else (MN(billed_outside_entries,
        K('copy_positions_unmatched')) if lotted_outside_entries >= 1 else billed_outside_entries)
    - unlotted_positions: (unlotted_entries * K('unlotted_positions_with_documented')) if lotted_outside_entries >=
        1 else (MN(unlotted_entries, K('unlotted_positions_alone')) if reported_on_record >= 1 else unlotted_entries)
    - positions_held: entries_on_record - billed_outside_entries - unlotted_entries - invalidations_on_record + copy_positions
        + unlotted_positions
    - early_invalidations: COUNT('vax_events', event_type='vax_dose_invalidated', invalid_reason='interval_too_short')
    - age_invalidations: COUNT('vax_events', event_type='vax_dose_invalidated', invalid_reason='below_minimum_age')
    - numbered_dose: (positions_held + 1) if early_invalidations >= 1 else (LATEST('vax_events', 'dose_number', event_type='vax_dose_administered')
        if age_invalidations >= 1 else MAX('vax_events', 'dose_number', event_type='vax_dose_administered') + 1)
    - result: numbered_dose if continue_mode == 2 else ((reported_on_record + 1) if continue_mode == 1 else 1)
    compute_basis:
      closed_for_days: Where the earlier course is closed and carries an invalidation entry, the form's dose number
        is counted from the earlier course's dose entries that hold a position. Where the earlier course is closed
        and carries no invalidation entry, the form covers the dose after the doses Kestrel reported on it.
      invalidations_on_record: Where the earlier course is closed and carries an invalidation entry, the form's dose
        number is counted from the earlier course's dose entries that hold a position. A dose entry holds a position
        unless it carries an invalidation entry, is a plan-billed entry recorded from another provider, or is a cash-paid
        entry recorded from another provider without a lot number; such entries hold positions only as set out below.
      continue_mode: Where the earlier course is closed and carries an invalidation entry, the form's dose number
        is counted from the earlier course's dose entries that hold a position. Where the earlier course is closed
        and carries no invalidation entry, the form covers the dose after the doses Kestrel reported on it. Where
        the earlier course is not closed, the numbering starts afresh.
      entries_on_record: A dose entry holds a position unless it carries an invalidation entry, is a plan-billed entry
        recorded from another provider, or is a cash-paid entry recorded from another provider without a lot number;
        such entries hold positions only as set out below.
      reported_on_record: Where the earlier course is closed and carries no invalidation entry, the form covers the
        dose after the doses Kestrel reported on it. Where Kestrel reported a dose of the earlier course they are
        registry copies and each holds copy_positions_matched positions.
      billed_outside_entries: Entries recorded from another provider and billed to a pharmacy benefit hold positions
        as follows.
      unlotted_entries: Cash-paid entries recorded from another provider without a lot number hold positions as follows.
      lotted_outside_entries: Where Kestrel reported no dose and a documented cash-paid outside entry exists, together
        they hold copy_positions_unmatched position. Where a documented outside entry also exists, each holds unlotted_positions_with_documented
        positions.
      copy_positions: Where Kestrel reported a dose of the earlier course they are registry copies and each holds
        copy_positions_matched positions. Where Kestrel reported no dose and a documented cash-paid outside entry
        exists, together they hold copy_positions_unmatched position. Where Kestrel reported no dose and no documented
        outside entry exists, each of them holds a position.
      unlotted_positions: Where a documented outside entry also exists, each holds unlotted_positions_with_documented
        positions. Where no documented outside entry exists and Kestrel reported a dose, together they hold unlotted_positions_alone
        position. Where no documented outside entry exists and Kestrel reported no dose, each of them holds a position.
      positions_held: A dose entry holds a position unless it carries an invalidation entry, is a plan-billed entry
        recorded from another provider, or is a cash-paid entry recorded from another provider without a lot number;
        such entries hold positions only as set out below. Where the earlier course is closed and carries an invalidation
        entry, the form's dose number is counted from the earlier course's dose entries that hold a position.
      early_invalidations: Where the earlier course carries an invalidation entry for a dose given too early, the
        form covers the dose after the positions held, which repeats the invalidated dose.
      age_invalidations: Where it carries an invalidation entry for a dose given below the minimum age, the form covers
        the number of the latest dose on record.
      numbered_dose: Where the dose number is counted from positions, it is formed as follows. Where the earlier course
        carries an invalidation entry for a dose given too early, the form covers the dose after the positions held,
        which repeats the invalidated dose. Where it carries an invalidation entry for a dose given below the minimum
        age, the form covers the number of the latest dose on record. Otherwise the form covers the highest dose number
        on record plus one.
      result: On a newly opened course the form covers dose 1. Where the earlier course is closed and carries no invalidation
        entry, the form covers the dose after the doses Kestrel reported on it. Where the earlier course is not closed,
        the numbering starts afresh.
    factors:
    - id: numbering_continuation
      effect: method
      decides: continue_mode
      bindings:
      - closed_for_days
      - invalidations_on_record
      - continue_mode
      ladder:
      - when: the earlier course is closed and carries an invalidation entry
        method: count the dose number from the earlier course's entries that hold a position
      - when: the earlier course is closed and carries no invalidation entry
        method: the dose after the doses Kestrel reported on it
      - when: otherwise
        method: start the numbering afresh at dose 1
      baseline:
        continue_mode: '0'
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: repeat_numbering
      effect: method
      decides: numbered_dose
      bindings:
      - early_invalidations
      - age_invalidations
      - numbered_dose
      ladder:
      - when: an invalidation entry for a dose given too early is on record
        method: the dose after the positions held
      - when: an invalidation entry for a dose given below the minimum age is on record
        method: the number of the latest dose on record
      - when: otherwise
        method: the highest dose number on record plus one
      baseline:
        numbered_dose: MAX('vax_events', 'dose_number', event_type='vax_dose_administered') + 1
      evidence:
      - history
      cross_difficulty: null
    - id: copy_positions_rule
      effect: parameter
      decides: copy_positions
      bindings:
      - billed_outside_entries
      - copy_positions
      ladder:
      - when: Kestrel reported a dose of the earlier course
        value: K('copy_positions_matched')
      - when: Kestrel reported no dose and a documented cash-paid outside entry exists
        value: K('copy_positions_unmatched')
      - when: otherwise (no Kestrel report and no documented outside entry)
        value: billed_outside_entries
      baseline:
        copy_positions: billed_outside_entries
      evidence:
      - history
      cross_difficulty: null
    - id: unlotted_positions_rule
      effect: parameter
      decides: unlotted_positions
      bindings:
      - unlotted_entries
      - lotted_outside_entries
      - unlotted_positions
      ladder:
      - when: a documented outside entry also exists
        value: K('unlotted_positions_with_documented')
      - when: no documented outside entry exists and Kestrel reported a dose
        value: K('unlotted_positions_alone')
      - when: otherwise (no documented outside entry and no Kestrel report)
        value: unlotted_entries
      baseline:
        unlotted_positions: unlotted_entries
      evidence:
      - history
      cross_difficulty: null
    baseline:
      params: []
      rule: On a newly opened course the form covers dose 1.
    inputs:
      history:
      - table: vax_events
        aggregate: count
        field: vax_event_id
        filters:
