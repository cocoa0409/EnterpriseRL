category: coverage
display_name: Prescription Insurance on File

binding:
  holding_table: coverage_plans
  event_tables: [coverage_claims, coverage_prior_auths]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [pending_verification, active, terminated, removed]
  transitions:
    - {from: pending_verification, to: active, by: agent, means: The plan's eligibility response or a paid test claim confirms the patient is covered.}
    - {from: pending_verification, to: removed, by: agent, means: Eligibility could not be confirmed within the verification window and the plan is taken off the profile.}
    - {from: active, to: terminated, by: system, means: The payer's termination date has passed.}
    - {from: active, to: removed, by: user, means: The patient asks Kestrel to stop billing this plan and take it off the profile.}

accounts:
  - key: patient_cost_share
    unit: USD
    meaning: Patient-pay amounts the plan assigned to the patient on paid claims; credited by each paid claim, debited when a paid claim is reversed.

parameter_schema:
  government_program: Whether the plan class is a federal or state health care program, boolean.
  manufacturer_copay_card_allowed: Whether a manufacturer copay card may be applied as secondary to this plan class, boolean.
  rx_rewards_points_allowed: Whether prescriptions billed to this plan class may earn rewards points, boolean.
  discount_card_in_lieu_allowed: Whether the patient may choose to pay with a discount program instead of billing this plan, boolean.
  pa_standard_decision_hours: Hours from prior authorization submission to the plan's standard decision deadline, integer hours.
  pa_expedited_decision_hours: Hours from submission to the decision deadline of an expedited prior authorization, integer hours.
  pa_emergency_supply_days: Days supply the plan pays for while a prior authorization is pending, integer days; 0 means none.
  transition_fill_allowed: Whether a non-formulary drug may be paid as a transition fill for a new enrollee, boolean.
  transition_fill_days_supply: Largest days supply of a transition fill, integer days.
  transition_window_days: Calendar days from the plan effective date during which transition fills are paid, integer days.
  first_fill_before_acceptance_days: Days supply paid on a first fill before the injury claim is accepted, integer days; 0 means not applicable.
  plan_early_refill_threshold_pct: Percent of the previous paid claim's days supply that must elapse before the plan pays the next routine claim, integer percent.
  vacation_override_per_plan_year: Vacation-supply overrides the plan pays per prescription per plan year, integer.
  lost_stolen_override_per_plan_year: Lost-or-stolen overrides the plan pays per prescription per plan year, integer.
  therapy_change_override_allowed: Whether a therapy-change override is paid when the dose changed, boolean.
  refill_too_soon_override_codes: List of submission clarification codes the plan class accepts on an early claim, list of enum values.
  max_days_supply_per_claim: Largest days supply one claim may bill, integer days.
  maintenance_90_day_mandate: Whether maintenance drugs must move to a 90-day supply after the courtesy fills, boolean.
  courtesy_30_day_fills: Paid fills of 34 days or less allowed per prescription per plan year before the 90-day mandate applies, integer.
  claim_reversal_deadline_days: Calendar days from the date of service by which an unpicked paid claim must be reversed, integer days.
  timely_filing_days: Calendar days from the date of service within which a claim may be submitted, integer days.
  appeal_filing_window_days: Calendar days from a prior authorization denial within which an appeal may be filed, integer days.
  appeal_decision_standard_days: Calendar days the plan has to decide a standard appeal, integer days.
  appeal_decision_expedited_hours: Hours the plan has to decide an expedited appeal, integer hours.
  pa_approval_default_months: Calendar months an approved prior authorization lasts unless the plan states otherwise, integer months.
  pa_renewal_lead_days: Calendar days before an approval ends from which a renewal prior authorization may be started, integer days.
  pa_submission_channel: How Kestrel submits a prior authorization for this class, enum electronic_pa | adjuster_review.
  cob_secondary_allowed: Whether this plan class may be billed as the secondary payer, boolean.
  payer_of_last_resort: Whether this plan class is always billed after every other coverage, boolean.
  secondary_billing_window_days: Calendar days after the primary claim within which the secondary claim may be billed, integer days.
  claim_number_required: Whether the employer's injury claim number must be on file before billing, boolean.
  injury_related_drugs_only: Whether only drugs for the accepted injury are billable, boolean.
  patient_pay_cap_applies: Whether a per-claim patient-pay cap applies, boolean.
  patient_pay_cap_usd: Per-claim patient-pay cap where it applies, USD.
  dispense_if_copay_unpaid: Whether a covered fill must be dispensed even when the patient cannot pay the copay, boolean.
  oop_cap_applies: Whether an annual out-of-pocket cap on covered drugs applies, boolean.
  annual_oop_cap_usd: Annual out-of-pocket cap on covered drugs where it applies, USD.
  m3p_available: Whether the Medicare Prescription Payment Plan is offered through this plan class, boolean.
  m3p_notice_threshold_usd: Patient pay on a single paid claim at or above which Kestrel gives the payment plan notice, USD.
  deductible_phase_applies: Whether claims may be subject to a pharmacy deductible, boolean.
  preventive_drug_deductible_waiver: Whether drugs on the plan's preventive list bypass the deductible, boolean.
  dur_override_allowed_at_pharmacy: Whether the pharmacist may resubmit a drug utilization review rejection with an override, boolean.
  brand_dispense_penalty_applies: Whether the patient pays the brand-generic cost difference when a brand is dispensed at patient request, boolean.
  brand_requires_pa_when_generic_available: Whether a brand with an available generic needs prior authorization, boolean.
  kestrel_specialty_in_network: Whether Kestrel's specialty pharmacy is in the plan's specialty network, boolean.
  eligibility_verification_days: Calendar days from adding a plan within which its eligibility must be confirmed, integer days.
  plan_year_basis: What starts the plan year, enum calendar_year | effective_date_anniversary.
  cash_rebill_window_days: Calendar days after a cash fill within which it may be re-billed to a newly added plan, integer days.
  dependents_covered: Whether dependents may be covered under the cardholder, boolean.
  dependent_max_age_years: Highest age in whole years at which a dependent remains covered, integer years; 0 when dependents are not covered.
  reject_resolution_map: Per reject code, the pharmacy-side resolution route for this class, mapping reject_code -> route.

