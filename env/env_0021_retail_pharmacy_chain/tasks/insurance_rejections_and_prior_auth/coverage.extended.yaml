      history:
        - {table: coverage_claims, aggregate: count, field: claim_id, filters: {event_type: coverage_claim_paid, claim_basis: retro_rebill}}
        - {table: coverage_claims, aggregate: latest, field: patient_pay_usd, filters: {event_type: coverage_claim_paid, claim_basis: retro_rebill}}
        - {table: coverage_claims, aggregate: count, field: claim_id, filters: {event_type: coverage_claim_paid}}
        - {table: coverage_claims, aggregate: count, field: claim_id, filters: {event_type: coverage_claim_reversed}}
        - {category: rx, table: rx_fills, aggregate: latest, field: days_supply_dispensed, filters: {payment_basis: cash}}
        - {category: rx, table: rx_fills, aggregate: count, field: fill_id, within_months: 3, filters: {payment_basis: cash}}
      cross_category: [rx]
