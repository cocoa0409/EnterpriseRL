        - {table: coverage_claims, aggregate: latest, field: days_supply_billed, filters: {event_type: coverage_claim_paid, claim_basis: pa_approved}}
        - {table: coverage_claims, aggregate: count, field: claim_id, filters: {event_type: coverage_claim_paid, claim_basis: pa_approved}}
        - {table: coverage_prior_auths, aggregate: latest, field: approval_end_date, filters: {event_type: coverage_pa_approved}}
        - {table: coverage_prior_auths, aggregate: latest, field: denial_reason, filters: {event_type: coverage_pa_denied}}
        - {table: coverage_prior_auths, aggregate: latest, field: event_date, filters: {event_type: coverage_pa_denied}}
      cross_category: []
  - id: coverage_ext_continuation_supply_days
    base_policy_refs: [coverage_agg_coordination_of_benefits, coverage_evt_claim_billing, coverage_evt_refill_too_soon, coverage_evt_prior_authorization, coverage_evt_transition_fill, coverage_evt_claim_reversal, coverage_program_restrictions]
    overwrite:
      - base_policy: coverage_evt_prior_authorization
        superseded_clause: >-
          A denial ends the request; the patient may then pay cash, use a discount program where allowed, or appeal under
          coverage_evt_appeal.
        replaced_by: >-
          A denial ends the request; the patient may then pay cash, use a discount program where allowed, or appeal. When
          the plan denies the renewal of a prior authorization it had approved, it also pays a continuation supply of that
          drug, as one claim on the coverage with claim_basis emergency_pa_supply that carries no patient pay until the
          denial is finally resolved.
    trigger: on_request
    subject: [coverage_claim_paid]
    computes: days_supply_billed
    target_tool: bill_continuation_supply_837ca024
    params:
      delivery_recency_months: 6
      courier_lead_days: 1
      late_renewal_window_days: 7
      short_renewal_window_days: 14
      late_renewal_days: 3
      short_renewal_days: 1
      recent_titration_months: 3
      earlier_titration_months: 6
      recent_titration_days: 7
      earlier_titration_days: 3
      step_therapy_buffer_days: 7
      records_buffer_days: 3
    rule: >-
      A denial ends the request; the patient may then pay cash, use a discount program where allowed, or appeal. When
      the plan denies the renewal of a prior authorization it had approved, it also pays a continuation supply of that
      drug, as one claim on the coverage with claim_basis emergency_pa_supply that carries no patient pay until the
      denial is finally resolved. A continuation supply is not the emergency supply a waiting request earns and is not
      limited to pa_emergency_supply_days. The days supply of a continuation supply is fixed only after the
      prior-authorization ledger carries an appeal filed against the plan's most recent denial on the coverage. The
      continued drug is the prescription the most recent denial on the coverage concerns. The continuation days supply is
      the number of calendar days from the claim's date of service to the decision due date of the most recent appeal on
      the coverage, counting the decision due date and not the date of service, and never more than the class's
      max_days_supply_per_claim. When no appeal is on the coverage, the days to a decision due date are 0. Where the
      patient holds an active Kestrel Mail Delivery plan and a delivery to the patient was completed less than
      delivery_recency_months whole months before the date of service, that plan's mail_transit_business_days are added
      as mail lead, each counted as one calendar day of supply; where the patient holds any other active delivery plan
      and such a delivery was completed, courier_lead_days are added; otherwise no delivery lead is added. Where the
      continued drug's own active automated refill enrollment is Kestrel Med Sync with Adherence Packaging, that
      program's refill_lead_days plus its packaging_prep_days are added; where the continued drug has any other active
      automated refill enrollment, that program's refill_lead_days are added; where the continued drug has no active
      automated refill enrollment, no refill-program lead is added, whatever the patient's other prescriptions are
      enrolled in. The continuation starts when the patient's current cover runs out. The approved supply remaining on
      the date of service is the days supply billed on the most recent claim paid for the continued drug under a prior
      authorization approval less the calendar days from that claim's date of service to the continuation's date of
      service, never less than 0. While the most recent approval on the coverage still runs past the date of service,
      the count starts the day after its approval_end_date, so the calendar days from the date of service to that
      approval_end_date are taken off; once that approval has run out but approved supply remains on the date of
      service, the count starts the day after that supply runs out, so the days of approved supply remaining are taken
      off; otherwise the count starts on the date of service and nothing is taken off. When the most recent request on
      the coverage was started at least one but fewer than late_renewal_window_days calendar days before the
      approval_end_date of the most recent approval, late_renewal_days are added; when it was started at least
      late_renewal_window_days but fewer than short_renewal_window_days days before, short_renewal_days are added;
      otherwise, including a request started on or after that approval_end_date, no renewal courtesy is added. When a
      refill of the continued drug was dispensed for a dosage change less than recent_titration_months whole months
      before the date of service, recent_titration_days are added for the dose overlap; when the most recent such refill
      of the continued drug was dispensed at least recent_titration_months but less than earlier_titration_months whole
      months before, earlier_titration_days are added; otherwise no titration days are added, and a dosage change of
      another prescription adds nothing. When the denial being appealed gave step_therapy_required as its reason,
      step_therapy_buffer_days are added so that a step drug can be started if the denial is upheld; when it gave
      missing_information, records_buffer_days are added; a denial for any other reason adds no decision buffer. The
      continuation days supply is the days to the appeal's decision due date, plus the delivery lead, plus the
      refill-program lead, less the days taken off at the start, plus the renewal courtesy, plus the titration days,
      plus the decision buffer; it is never less than 1 day and, after that, never more than the class's
      max_days_supply_per_claim.
    prerequisite:
      - problem: coverage_ext_appeal_decision_window
        kind: value_input
        gate: days_to_decision
        form: state
        policy_source: >-
          The days supply of a continuation supply is fixed only after the prior-authorization ledger carries an appeal
          filed against the plan's most recent denial on the coverage.
        condition: >-
          coverage_prior_auths carries, on the coverage, a coverage_appeal_filed row whose source_pa_id is the coverage's
          most recent coverage_pa_denied row, with its decision_due_date recorded.
        resolved_by: file_coverage_appeal_f21a07b8
        effect: >-
          Once the appeal row stands, days_to_decision changes from 0 to the calendar days from the date of service to the
          appeal's decision due date, which the appeal's own rule sets as the filing date plus its decision window.
    cross_category:
      - category: delivery
        as: branch
        reads: [variant_name, status, delivery_orders.event_type, delivery_orders.event_date, mail_transit_business_days]
        note: the delivery lead tier is decided from the patient's active delivery plan and its completed deliveries.
      - category: refill
        as: branch
        reads: [variant_name, status, prescription_id, refill_lead_days, packaging_prep_days]
        note: the refill-program lead tier is decided from the continued drug's own active automated refill enrollment.
      - category: rx
        as: history
        reads: [rx_fills.fill_reason, rx_fills.event_type, rx_fills.prescription_id, rx_fills.event_date]
        note: the titration tier is decided from the continued drug's dosage-change refills in the fill ledger.
    compute:
      - appeals_on_coverage: "COUNT('coverage_prior_auths', event_type='coverage_appeal_filed')"
      - appeal_decision_due: "LATEST('coverage_prior_auths', 'decision_due_date', event_type='coverage_appeal_filed')"
      - days_to_decision: "DAYS(NOW, appeal_decision_due) if appeals_on_coverage >= 1 else 0"
      - continued_prescription: "LATEST('coverage_prior_auths', 'prescription_id', event_type='coverage_pa_denied')"
      - delivery_plan_kind: "CFIELD('delivery', 'variant_name', status='active')"
      - recent_completed_deliveries: "XCOUNT('delivery', 'delivery_orders', within_months=K('delivery_recency_months'), event_type='delivery_completed')"
      - delivery_lead: "CPARAM('delivery', 'mail_transit_business_days', status='active') if (delivery_plan_kind == 'Kestrel Mail Delivery' and recent_completed_deliveries >= 1) else (K('courier_lead_days') if (delivery_plan_kind != None and recent_completed_deliveries >= 1) else 0)"
      - continued_drug_refill_program: "CFIELD('refill', 'variant_name', status='active', prescription_id=continued_prescription)"
      - refill_program_lead: "(CPARAM('refill', 'refill_lead_days', status='active', prescription_id=continued_prescription) + CPARAM('refill', 'packaging_prep_days', status='active', prescription_id=continued_prescription)) if continued_drug_refill_program == 'Kestrel Med Sync with Adherence Packaging' else (CPARAM('refill', 'refill_lead_days', status='active', prescription_id=continued_prescription) if continued_drug_refill_program != None else 0)"
      - approved_claim_date: "LATEST('coverage_claims', 'event_date', event_type='coverage_claim_paid', claim_basis='pa_approved', prescription_id=continued_prescription)"
      - approved_claim_days: "LATEST('coverage_claims', 'days_supply_billed', event_type='coverage_claim_paid', claim_basis='pa_approved', prescription_id=continued_prescription)"
      - approved_supply_remaining: "MX(0, approved_claim_days - DAYS(approved_claim_date, NOW))"
      - latest_approval_end: "LATEST('coverage_prior_auths', 'approval_end_date', event_type='coverage_pa_approved')"
      - days_to_approval_end: "DAYS(NOW, latest_approval_end)"
      - start_days_off: "days_to_approval_end if days_to_approval_end >= 1 else (approved_supply_remaining if approved_supply_remaining >= 1 else 0)"
      - latest_request_started: "LATEST('coverage_prior_auths', 'event_date', event_type='coverage_pa_initiated')"
      - request_lead_before_end: "DAYS(latest_request_started, latest_approval_end)"
      - renewal_courtesy: "K('late_renewal_days') if (request_lead_before_end >= 1 and request_lead_before_end < K('late_renewal_window_days')) else (K('short_renewal_days') if (request_lead_before_end >= K('late_renewal_window_days') and request_lead_before_end < K('short_renewal_window_days')) else 0)"
      - recent_dose_change_refills: "XCOUNT('rx', 'rx_fills', within_months=K('recent_titration_months'), event_type='rx_refill', fill_reason='dosage_change', prescription_id=continued_prescription)"
      - earlier_dose_change_refills: "XCOUNT('rx', 'rx_fills', within_months=K('earlier_titration_months'), event_type='rx_refill', fill_reason='dosage_change', prescription_id=continued_prescription)"
      - titration_days: "K('recent_titration_days') if recent_dose_change_refills >= 1 else (K('earlier_titration_days') if earlier_dose_change_refills >= 1 else 0)"
      - appealed_denial_reason: "LATEST('coverage_prior_auths', 'denial_reason', event_type='coverage_pa_denied')"
      - decision_buffer: "K('step_therapy_buffer_days') if appealed_denial_reason == 'step_therapy_required' else (K('records_buffer_days') if appealed_denial_reason == 'missing_information' else 0)"
      - continuation_days_raw: "days_to_decision + delivery_lead + refill_program_lead - start_days_off + renewal_courtesy + titration_days + decision_buffer"
      - result: "MN(P('max_days_supply_per_claim'), MX(1, continuation_days_raw))"
    compute_basis:
      appeals_on_coverage: "When no appeal is on the coverage, the days to a decision due date are 0."
      appeal_decision_due: "The continuation days supply is the number of calendar days from the claim's date of service to the decision due date of the most recent appeal on the coverage, counting the decision due date and not the date of service, and never more than the class's max_days_supply_per_claim."
      days_to_decision: "The continuation days supply is the number of calendar days from the claim's date of service to the decision due date of the most recent appeal on the coverage, counting the decision due date and not the date of service, and never more than the class's max_days_supply_per_claim. When no appeal is on the coverage, the days to a decision due date are 0."
      continued_prescription: "The continued drug is the prescription the most recent denial on the coverage concerns."
      delivery_plan_kind: "Where the patient holds an active Kestrel Mail Delivery plan and a delivery to the patient was completed less than delivery_recency_months whole months before the date of service,"
      recent_completed_deliveries: "Where the patient holds an active Kestrel Mail Delivery plan and a delivery to the patient was completed less than delivery_recency_months whole months before the date of service,"
      delivery_lead: "Where the patient holds an active Kestrel Mail Delivery plan and a delivery to the patient was completed less than delivery_recency_months whole months before the date of service, that plan's mail_transit_business_days are added as mail lead, each counted as one calendar day of supply; where the patient holds any other active delivery plan and such a delivery was completed, courier_lead_days are added; otherwise no delivery lead is added."
      continued_drug_refill_program: "Where the continued drug's own active automated refill enrollment is Kestrel Med Sync with Adherence Packaging,"
      refill_program_lead: "Where the continued drug's own active automated refill enrollment is Kestrel Med Sync with Adherence Packaging, that program's refill_lead_days plus its packaging_prep_days are added; where the continued drug has any other active automated refill enrollment, that program's refill_lead_days are added; where the continued drug has no active automated refill enrollment, no refill-program lead is added, whatever the patient's other prescriptions are enrolled in."
      approved_claim_date: "The approved supply remaining on the date of service is the days supply billed on the most recent claim paid for the continued drug under a prior authorization approval less the calendar days from that claim's date of service to the continuation's date of service, never less than 0."
      approved_claim_days: "The approved supply remaining on the date of service is the days supply billed on the most recent claim paid for the continued drug under a prior authorization approval less the calendar days from that claim's date of service to the continuation's date of service, never less than 0."
      approved_supply_remaining: "The approved supply remaining on the date of service is the days supply billed on the most recent claim paid for the continued drug under a prior authorization approval less the calendar days from that claim's date of service to the continuation's date of service, never less than 0."
      latest_approval_end: "While the most recent approval on the coverage still runs past the date of service, the count starts the day after its approval_end_date,"
      days_to_approval_end: "While the most recent approval on the coverage still runs past the date of service, the count starts the day after its approval_end_date, so the calendar days from the date of service to that approval_end_date are taken off;"
      start_days_off: "While the most recent approval on the coverage still runs past the date of service, the count starts the day after its approval_end_date, so the calendar days from the date of service to that approval_end_date are taken off; once that approval has run out but approved supply remains on the date of service, the count starts the day after that supply runs out, so the days of approved supply remaining are taken off; otherwise the count starts on the date of service and nothing is taken off."
      latest_request_started: "When the most recent request on the coverage was started at least one but fewer than late_renewal_window_days calendar days before the approval_end_date of the most recent approval, late_renewal_days are added;"
      request_lead_before_end: "When the most recent request on the coverage was started at least one but fewer than late_renewal_window_days calendar days before the approval_end_date of the most recent approval, late_renewal_days are added;"
      renewal_courtesy: "When the most recent request on the coverage was started at least one but fewer than late_renewal_window_days calendar days before the approval_end_date of the most recent approval, late_renewal_days are added; when it was started at least late_renewal_window_days but fewer than short_renewal_window_days days before, short_renewal_days are added; otherwise, including a request started on or after that approval_end_date, no renewal courtesy is added."
      recent_dose_change_refills: "When a refill of the continued drug was dispensed for a dosage change less than recent_titration_months whole months before the date of service, recent_titration_days are added for the dose overlap;"
      earlier_dose_change_refills: "when the most recent such refill of the continued drug was dispensed at least recent_titration_months but less than earlier_titration_months whole months before, earlier_titration_days are added;"
      titration_days: "When a refill of the continued drug was dispensed for a dosage change less than recent_titration_months whole months before the date of service, recent_titration_days are added for the dose overlap; when the most recent such refill of the continued drug was dispensed at least recent_titration_months but less than earlier_titration_months whole months before, earlier_titration_days are added; otherwise no titration days are added, and a dosage change of another prescription adds nothing."
      appealed_denial_reason: "When the denial being appealed gave step_therapy_required as its reason, step_therapy_buffer_days are added so that a step drug can be started if the denial is upheld;"
      decision_buffer: "When the denial being appealed gave step_therapy_required as its reason, step_therapy_buffer_days are added so that a step drug can be started if the denial is upheld; when it gave missing_information, records_buffer_days are added; a denial for any other reason adds no decision buffer."
      continuation_days_raw: "The continuation days supply is the days to the appeal's decision due date, plus the delivery lead, plus the refill-program lead, less the days taken off at the start, plus the renewal courtesy, plus the titration days, plus the decision buffer;"
      result: "it is never less than 1 day and, after that, never more than the class's max_days_supply_per_claim."
    factors:
      - id: delivery_lead_tier
        effect: parameter
        decides: delivery_lead
        bindings: [delivery_plan_kind, recent_completed_deliveries, delivery_lead]
        ladder:
          - when: "an active Kestrel Mail Delivery plan and a delivery completed less than delivery_recency_months whole months before the date of service"
            value: "CPARAM('delivery', 'mail_transit_business_days', status='active')"
          - when: "any other active delivery plan and a delivery completed less than delivery_recency_months whole months before the date of service"
            value: "K('courier_lead_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          delivery_lead: "0"
        evidence: [cross_category, history]
        cross_difficulty: delivery
      - id: refill_program_lead_tier
        effect: parameter
        decides: refill_program_lead
        bindings: [continued_drug_refill_program, refill_program_lead]
        ladder:
          - when: "the continued drug's own active automated refill enrollment is Kestrel Med Sync with Adherence Packaging"
            value: "CPARAM('refill', 'refill_lead_days', status='active', prescription_id=continued_prescription) + CPARAM('refill', 'packaging_prep_days', status='active', prescription_id=continued_prescription)"
          - when: "the continued drug has any other active automated refill enrollment"
            value: "CPARAM('refill', 'refill_lead_days', status='active', prescription_id=continued_prescription)"
          - when: "otherwise, the continued drug having no active automated refill enrollment"
            value: "0"
        baseline:
          refill_program_lead: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: continuation_start
        effect: method
        decides: start_days_off
        bindings: [approved_claim_date, approved_claim_days, approved_supply_remaining, days_to_approval_end, start_days_off]
        ladder:
          - when: "the most recent approval on the coverage still runs past the date of service"
            method: "the count starts the day after the approval_end_date: the calendar days from the date of service to that date are taken off"
          - when: "that approval has run out and approved supply of the continued drug remains on the date of service"
            method: "the count starts the day after the approved supply runs out: the days of approved supply remaining are taken off"
          - when: "otherwise"
            method: "the count starts on the date of service: nothing is taken off"
        baseline:
          start_days_off: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: renewal_courtesy_tier
        effect: parameter
        decides: renewal_courtesy
        bindings: [latest_request_started, request_lead_before_end, renewal_courtesy]
        ladder:
          - when: "the most recent request was started at least one but fewer than late_renewal_window_days days before the approval_end_date"
            value: "K('late_renewal_days')"
          - when: "it was started at least late_renewal_window_days but fewer than short_renewal_window_days days before"
            value: "K('short_renewal_days')"
          - when: "otherwise, including a request started on or after the approval_end_date"
            value: "0"
        baseline:
          renewal_courtesy: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: titration_overlap
        effect: parameter
        decides: titration_days
        bindings: [recent_dose_change_refills, earlier_dose_change_refills, titration_days]
        ladder:
          - when: "a refill of the continued drug dispensed for a dosage change less than recent_titration_months whole months before the date of service"
            value: "K('recent_titration_days')"
          - when: "the most recent such refill of the continued drug dispensed at least recent_titration_months but less than earlier_titration_months whole months before"
            value: "K('earlier_titration_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          titration_days: "0"
        evidence: [cross_category, history]
        cross_difficulty: rx
      - id: decision_buffer_tier
        effect: parameter
        decides: decision_buffer
        bindings: [appealed_denial_reason, decision_buffer]
        ladder:
          - when: "the denial being appealed gave step_therapy_required as its reason"
            value: "K('step_therapy_buffer_days')"
          - when: "the denial being appealed gave missing_information as its reason"
            value: "K('records_buffer_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          decision_buffer: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The continuation days supply is the number of calendar days from the claim's date of service to the decision due
        date of the most recent appeal on the coverage, counting the decision due date and not the date of service, and
        never more than the class's max_days_supply_per_claim. When no appeal is on the coverage, the days to a decision
        due date are 0.
      params: [max_days_supply_per_claim]
    inputs:
      history:
        - {table: coverage_prior_auths, aggregate: count, field: pa_id, filters: {event_type: coverage_appeal_filed}}
        - {table: coverage_prior_auths, aggregate: latest, field: decision_due_date, filters: {event_type: coverage_appeal_filed}}
        - {table: coverage_prior_auths, aggregate: latest, field: prescription_id, filters: {event_type: coverage_pa_denied}}
        - {table: coverage_prior_auths, aggregate: latest, field: approval_end_date, filters: {event_type: coverage_pa_approved}}
        - {table: coverage_prior_auths, aggregate: latest, field: event_date, filters: {event_type: coverage_pa_initiated}}
        - {table: coverage_prior_auths, aggregate: latest, field: denial_reason, filters: {event_type: coverage_pa_denied}}
        - {table: coverage_claims, aggregate: latest, field: event_date, filters: {event_type: coverage_claim_paid, claim_basis: pa_approved}}
        - {table: coverage_claims, aggregate: latest, field: days_supply_billed, filters: {event_type: coverage_claim_paid, claim_basis: pa_approved}}
        - {category: delivery, table: delivery_orders, aggregate: count, field: order_id, within_months: 6, filters: {event_type: delivery_completed}}
        - {category: rx, table: rx_fills, aggregate: count, field: fill_id, within_months: 6, filters: {event_type: rx_refill, fill_reason: dosage_change}}
      cross_category: [delivery, refill, rx]
  - id: coverage_ext_corrected_rebill_patient_pay
    base_policy_refs: [coverage_agg_coordination_of_benefits, coverage_evt_claim_billing, coverage_evt_refill_too_soon, coverage_evt_prior_authorization, coverage_evt_transition_fill, coverage_evt_claim_reversal, coverage_program_restrictions]
    overwrite: []
    trigger: state_due
    subject: [coverage_claim_paid]
    computes: patient_pay_usd
    target_tool: rebill_corrected_claim_b015fa67
    params:
      standard_copay: 25.00
      generic_copay: 15.00
      maintenance_generic_copay: 10.00
      generic_adherence_refills: 3
      adherence_window_months: 3
      standard_month_days: 30
      month_min_days: 28
      month_max_days: 34
      ninety_day_min_days: 84
      ninety_day_multiple: 2.5
      correction_short_wait_days: 3
      correction_long_wait_days: 7
      short_wait_share: 0.75
      long_wait_share: 0.5
      new_member_share: 0.9
      early_member_share: 0.95
      early_member_months: 2
      mail_service_share: 0.8
      courier_service_share: 0.9
      override_window_months: 1
      override_courtesy_share: 0.8
      therapy_courtesy_share: 0.9
    rule: >-
      A claim the plan paid and that was then reversed to correct a billing mistake is owed a corrected claim: it is
      re-billed with claim_basis retro_rebill on the original date of service, for the fill the reversed claim paid
      for, and the corrected claim names the reversed claim. The corrected claim is made for the most recent reversal on the coverage made for a billing correction. The fill a corrected claim is for is the refill of the prescription the reversed claim billed that carries the fill number the reversed claim billed. The patient pay of a corrected claim is the plan's standard copay,
      standard_copay, for each standard_month_days days of the corrected fill's supply, prorated per day, rounded to the
      cent. The copay tier of a corrected claim is set by the product dispensed and the patient's generic refill
      history: when the corrected fill is a generic and at least generic_adherence_refills generic refills of the same prescription settled through insurance were dispensed less than adherence_window_months whole months before the day the corrected claim is made, the maintenance generic copay maintenance_generic_copay applies; when the corrected
      fill is a generic and fewer such refills were dispensed, generic_copay applies; otherwise the standard copay
      applies. The supply basis of a corrected claim is set by the corrected fill's days supply: a supply of
      ninety_day_min_days days or more is charged ninety_day_multiple copays whatever its exact length; a supply of
      month_min_days to month_max_days days is charged one copay whatever its exact length; any other supply is charged
      the copay prorated per day over standard_month_days days. A corrected claim made after the patient has waited on
      the correction earns a waiting share: when the most recent reversal on the coverage made for a billing correction
      is more than correction_long_wait_days days before the day the corrected claim is made, the charge is multiplied
      by long_wait_share; when it is correction_short_wait_days to correction_long_wait_days days before, by
      short_wait_share; otherwise by 1. A new member of the plan earns a member share: when the corrected claim is made
      less than one whole month after the coverage's effective_date, the charge is multiplied by new_member_share; when
      it is made one to early_member_months whole months after, by early_member_share; otherwise by 1. A fill delivered by mail earns the plan's mail-service rate: when the corrected fill was released to the patient by home delivery and the patient holds an active Kestrel Mail Delivery plan, the charge is multiplied by mail_service_share; when the corrected fill was released by home delivery under any other active delivery plan, by courier_service_share; otherwise, including a fill collected in person, by 1. A mistaken override earns an
      override share: when a claim paid on the coverage less than override_window_months whole months before the day
      the corrected claim is made carried the vacation_supply or the lost_or_stolen code, whether or not it was later
      reversed, the charge is multiplied by override_courtesy_share; when none did but such a claim carried the
      therapy_change code, by therapy_courtesy_share; otherwise by 1. The patient pay of a corrected claim is the tier
      copay times the supply basis, multiplied once by the waiting share, the member share, the mail-service rate and
      the override share together, and rounded to the cent only at the end.
    prerequisite: []
    cross_category:
      - category: rx
        as: history
        reads: [rx_fills.fill_id, rx_fills.days_supply_dispensed, rx_fills.product_dispensed, rx_fills.event_type, rx_fills.payment_basis, rx_fills.event_date, rx_fills.pickup_channel]
        note: the copay tier, the supply basis and the fill's release channel are decided from the fill ledger of the corrected prescription.
      - category: delivery
        as: branch
        reads: [variant_name, status]
        note: the mail-service rate is decided from the patient's active delivery plan together with the corrected fill's release by home delivery.
    compute:
      - corrected_source_claim: "LATEST('coverage_claims', 'source_claim_id', event_type='coverage_claim_reversed', reversal_reason='billing_correction')"
      - corrected_prescription: "LATEST('coverage_claims', 'prescription_id', claim_id=corrected_source_claim)"
      - corrected_fill_number: "LATEST('coverage_claims', 'fill_number', claim_id=corrected_source_claim)"
      - corrected_fill_id: "XLATEST('rx', 'rx_fills', 'fill_id', event_type='rx_refill', prescription_id=corrected_prescription, fill_number=corrected_fill_number)"
      - corrected_fill_days: "XLATEST('rx', 'rx_fills', 'days_supply_dispensed', event_type='rx_refill', prescription_id=corrected_prescription, fill_number=corrected_fill_number)"
      - corrected_fill_product: "XLATEST('rx', 'rx_fills', 'product_dispensed', event_type='rx_refill', prescription_id=corrected_prescription, fill_number=corrected_fill_number)"
      - generic_refills_recent: "XCOUNT('rx', 'rx_fills', within_months=K('adherence_window_months'), event_type='rx_refill', product_dispensed='generic', payment_basis='insurance', prescription_id=corrected_prescription)"
      - tier_copay: "K('maintenance_generic_copay') if (corrected_fill_product == 'generic' and generic_refills_recent >= K('generic_adherence_refills')) else (K('generic_copay') if (corrected_fill_product == 'generic' and generic_refills_recent < K('generic_adherence_refills')) else K('standard_copay'))"
      - supply_multiple: "K('ninety_day_multiple') if corrected_fill_days >= K('ninety_day_min_days') else (1 if (corrected_fill_days >= K('month_min_days') and corrected_fill_days <= K('month_max_days')) else corrected_fill_days / K('standard_month_days'))"
      - correction_reversal_date: "LATEST('coverage_claims', 'event_date', event_type='coverage_claim_reversed', reversal_reason='billing_correction')"
      - days_since_correction: "DAYS(correction_reversal_date, NOW)"
      - waiting_share: "K('long_wait_share') if days_since_correction > K('correction_long_wait_days') else (K('short_wait_share') if days_since_correction >= K('correction_short_wait_days') else 1)"
      - months_on_plan: "MONTHS(F('effective_date'), NOW)"
      - member_share: "K('new_member_share') if months_on_plan < 1 else (K('early_member_share') if months_on_plan <= K('early_member_months') else 1)"
      - delivery_plan_held: "CFIELD('delivery', 'variant_name', status='active')"
      - corrected_fill_release: "XLATEST('rx', 'rx_fills', 'pickup_channel', event_type='rx_pickup', source_fill_id=corrected_fill_id)"
      - mail_service_rate: "K('mail_service_share') if (corrected_fill_release == 'home_delivery' and delivery_plan_held == 'Kestrel Mail Delivery') else (K('courier_service_share') if (corrected_fill_release == 'home_delivery' and delivery_plan_held != None) else 1)"
      - override_coded_claims: "COUNT('coverage_claims', within_months=K('override_window_months'), event_type='coverage_claim_paid', submission_clarification_code='vacation_supply') + COUNT('coverage_claims', within_months=K('override_window_months'), event_type='coverage_claim_paid', submission_clarification_code='lost_or_stolen')"
      - therapy_coded_claims: "COUNT('coverage_claims', within_months=K('override_window_months'), event_type='coverage_claim_paid', submission_clarification_code='therapy_change')"
      - override_share: "K('override_courtesy_share') if override_coded_claims >= 1 else (K('therapy_courtesy_share') if therapy_coded_claims >= 1 else 1)"
      - result: "RND(tier_copay * supply_multiple * waiting_share * member_share * mail_service_rate * override_share, 2)"
    compute_basis:
      corrected_source_claim: "The corrected claim is made for the most recent reversal on the coverage made for a billing correction."
      corrected_prescription: "The fill a corrected claim is for is the refill of the prescription the reversed claim billed that carries the fill number the reversed claim billed."
      corrected_fill_number: "The fill a corrected claim is for is the refill of the prescription the reversed claim billed that carries the fill number the reversed claim billed."
      corrected_fill_id: "The fill a corrected claim is for is the refill of the prescription the reversed claim billed that carries the fill number the reversed claim billed."
      corrected_fill_days: "The fill a corrected claim is for is the refill of the prescription the reversed claim billed that carries the fill number the reversed claim billed."
      corrected_fill_product: "The fill a corrected claim is for is the refill of the prescription the reversed claim billed that carries the fill number the reversed claim billed."
      generic_refills_recent: "when the corrected fill is a generic and at least generic_adherence_refills generic refills of the same prescription settled through insurance were dispensed less than adherence_window_months whole months before the day the corrected claim is made,"
      tier_copay: "when the corrected fill is a generic and at least generic_adherence_refills generic refills of the same prescription settled through insurance were dispensed less than adherence_window_months whole months before the day the corrected claim is made, the maintenance generic copay maintenance_generic_copay applies; when the corrected fill is a generic and fewer such refills were dispensed, generic_copay applies; otherwise the standard copay applies."
      supply_multiple: "a supply of ninety_day_min_days days or more is charged ninety_day_multiple copays whatever its exact length; a supply of month_min_days to month_max_days days is charged one copay whatever its exact length; any other supply is charged the copay prorated per day over standard_month_days days."
      correction_reversal_date: "when the most recent reversal on the coverage made for a billing correction is more than correction_long_wait_days days before the day the corrected claim is made, the charge is multiplied by long_wait_share;"
      days_since_correction: "when the most recent reversal on the coverage made for a billing correction is more than correction_long_wait_days days before the day the corrected claim is made, the charge is multiplied by long_wait_share;"
      waiting_share: "when the most recent reversal on the coverage made for a billing correction is more than correction_long_wait_days days before the day the corrected claim is made, the charge is multiplied by long_wait_share; when it is correction_short_wait_days to correction_long_wait_days days before, by short_wait_share; otherwise by 1."
      months_on_plan: "when the corrected claim is made less than one whole month after the coverage's effective_date, the charge is multiplied by new_member_share;"
      member_share: "when the corrected claim is made less than one whole month after the coverage's effective_date, the charge is multiplied by new_member_share; when it is made one to early_member_months whole months after, by early_member_share; otherwise by 1."
      delivery_plan_held: "when the corrected fill was released to the patient by home delivery and the patient holds an active Kestrel Mail Delivery plan, the charge is multiplied by mail_service_share;"
      corrected_fill_release: "when the corrected fill was released to the patient by home delivery and the patient holds an active Kestrel Mail Delivery plan, the charge is multiplied by mail_service_share;"
      mail_service_rate: "when the corrected fill was released to the patient by home delivery and the patient holds an active Kestrel Mail Delivery plan, the charge is multiplied by mail_service_share; when the corrected fill was released by home delivery under any other active delivery plan, by courier_service_share; otherwise, including a fill collected in person, by 1."
      override_coded_claims: "when a claim paid on the coverage less than override_window_months whole months before the day the corrected claim is made carried the vacation_supply or the lost_or_stolen code, whether or not it was later reversed,"
      therapy_coded_claims: "when none did but such a claim carried the therapy_change code, by therapy_courtesy_share;"
      override_share: "when a claim paid on the coverage less than override_window_months whole months before the day the corrected claim is made carried the vacation_supply or the lost_or_stolen code, whether or not it was later reversed, the charge is multiplied by override_courtesy_share; when none did but such a claim carried the therapy_change code, by therapy_courtesy_share; otherwise by 1."
      result: "The patient pay of a corrected claim is the tier copay times the supply basis, multiplied once by the waiting share, the member share, the mail-service rate and the override share together, and rounded to the cent only at the end."
    factors:
      - id: corrected_copay_tier
        effect: parameter
        decides: tier_copay
        bindings: [corrected_fill_product, generic_refills_recent, tier_copay]
        ladder:
          - when: "the corrected fill is a generic and at least generic_adherence_refills generic refills of the same prescription settled through insurance were dispensed less than adherence_window_months whole months before"
            value: "K('maintenance_generic_copay')"
          - when: "the corrected fill is a generic and fewer such refills were dispensed"
            value: "K('generic_copay')"
          - when: "otherwise"
            value: "K('standard_copay')"
        baseline:
          tier_copay: "K('standard_copay')"
        evidence: [cross_category, history]
        cross_difficulty: rx
      - id: corrected_supply_basis
        effect: method
        decides: supply_multiple
        bindings: [corrected_fill_days, supply_multiple]
        ladder:
          - when: "the corrected fill's supply is ninety_day_min_days days or more"
            method: "charged ninety_day_multiple copays, whatever the exact length"
          - when: "the corrected fill's supply is month_min_days to month_max_days days"
            method: "charged one copay, whatever the exact length"
          - when: "otherwise"
            method: "charged the copay prorated per day over standard_month_days days"
        baseline:
          supply_multiple: "corrected_fill_days / K('standard_month_days')"
        evidence: [cross_category, history]
        cross_difficulty: rx
      - id: correction_waiting_share
        effect: parameter
        decides: waiting_share
        bindings: [correction_reversal_date, days_since_correction, waiting_share]
        ladder:
          - when: "the most recent billing-correction reversal on the coverage is more than correction_long_wait_days days before"
            value: "K('long_wait_share')"
          - when: "it is correction_short_wait_days to correction_long_wait_days days before"
            value: "K('short_wait_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          waiting_share: "1"
        evidence: [history, date]
        cross_difficulty: null
      - id: new_member_share_tier
        effect: parameter
        decides: member_share
        bindings: [months_on_plan, member_share]
        ladder:
          - when: "the corrected claim is made less than one whole month after the coverage's effective_date"
            value: "K('new_member_share')"
          - when: "it is made one to early_member_months whole months after"
            value: "K('early_member_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          member_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: mail_service_rate_tier
        effect: parameter
        decides: mail_service_rate
        bindings: [delivery_plan_held, corrected_fill_release, mail_service_rate]
        ladder:
          - when: "the corrected fill was released by home delivery and the patient holds an active Kestrel Mail Delivery plan"
            value: "K('mail_service_share')"
          - when: "the corrected fill was released by home delivery under any other active delivery plan"
            value: "K('courier_service_share')"
          - when: "otherwise, including a fill collected in person"
            value: "1"
        baseline:
          mail_service_rate: "1"
        evidence: [cross_category, history]
        cross_difficulty: delivery
      - id: override_courtesy_tier
        effect: parameter
        decides: override_share
        bindings: [override_coded_claims, therapy_coded_claims, override_share]
        ladder:
          - when: "a claim paid on the coverage less than override_window_months whole months before carried the vacation_supply or the lost_or_stolen code, reversed or not"
            value: "K('override_courtesy_share')"
          - when: "none did but such a claim carried the therapy_change code"
            value: "K('therapy_courtesy_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          override_share: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The corrected claim is made for the most recent reversal on the coverage made for a billing correction. The fill a
        corrected claim is for is the refill of the prescription the reversed claim billed that carries the fill number the
        reversed claim billed. The patient pay of a corrected claim is the plan's standard copay, standard_copay, for each standard_month_days days of the
        corrected fill's supply, prorated per day, rounded to the cent.
      params: [standard_copay, standard_month_days]
    inputs:
      history:
        - {table: coverage_claims, aggregate: latest, field: event_date, filters: {event_type: coverage_claim_reversed, reversal_reason: billing_correction}}
        - {table: coverage_claims, aggregate: count, field: claim_id, within_months: 1, filters: {event_type: coverage_claim_paid, submission_clarification_code: vacation_supply}}
        - {table: coverage_claims, aggregate: count, field: claim_id, within_months: 1, filters: {event_type: coverage_claim_paid, submission_clarification_code: lost_or_stolen}}
        - {table: coverage_claims, aggregate: count, field: claim_id, within_months: 1, filters: {event_type: coverage_claim_paid, submission_clarification_code: therapy_change}}
        - {table: coverage_claims, aggregate: latest, field: source_claim_id, filters: {event_type: coverage_claim_reversed, reversal_reason: billing_correction}}
        - {category: rx, table: rx_fills, aggregate: latest, field: days_supply_dispensed, filters: {event_type: rx_refill}}
        - {category: rx, table: rx_fills, aggregate: count, field: fill_id, within_months: 3, filters: {event_type: rx_refill, product_dispensed: generic, payment_basis: insurance}}
        - {category: rx, table: rx_fills, aggregate: latest, field: pickup_channel, filters: {event_type: rx_pickup}}
      cross_category: [rx, delivery]
  - id: coverage_ext_cash_rebill_patient_pay
    base_policy_refs: [coverage_agg_coordination_of_benefits, coverage_evt_claim_billing, coverage_evt_refill_too_soon, coverage_evt_prior_authorization, coverage_evt_transition_fill, coverage_evt_claim_reversal, coverage_program_restrictions]
    overwrite: []
    trigger: on_request
    subject: [coverage_claim_paid]
    computes: patient_pay_usd
    target_tool: submit_cash_fill_rebill_483f3c39
    params:
      standard_month_days: 30
      month_min_days: 28
      month_max_days: 34
      ninety_day_min_days: 84
      ninety_day_rebill_days: 75
      late_listing_long_days: 14
      late_listing_long_share: 0.5
      late_listing_short_share: 0.75
      wait_short_days: 4
      wait_long_days: 10
      wait_short_share: 0.95
      wait_long_share: 0.9
      maintenance_rebill_share: 0.9
      acute_rebill_share: 0.95
      established_claims: 3
      established_share: 0.8
      settling_share: 0.9
      gap_window_months: 3
      frequent_gap_fills: 3
      frequent_gap_share: 0.8
      repeat_gap_share: 0.9
    rule: >-
      A fill the patient paid for in cash is re-billed to a coverage record added afterwards by the patient's own
      submission, as a claim with claim_basis retro_rebill dated on the fill's date of service, and the patient is
      refunded the difference between the cash paid and the re-billed patient pay by the original payment method. The
      patient pay of a re-billed cash fill is not fixed until every claim on the coverage reversed for a billing
      correction is named by a re-billed claim on the claim ledger. The re-billed cash fill is the patient's most recent
      fill paid in cash. The re-bill rate is the patient pay per day of the most recent claim re-billed on the coverage,
      that is its patient pay divided by its days supply; when no claim has been re-billed on the coverage the re-bill
      rate is 0. The patient pay of a re-billed cash fill is the re-bill rate times the days the cash fill supplied,
      rounded to the cent, and never more than the cash the patient paid for the fill. The days charged depend on the
      length of the cash fill: a cash fill of month_min_days to month_max_days days is charged for a standard month of
      standard_month_days days; a cash fill of ninety_day_min_days days or more is charged for ninety_day_rebill_days
      days; any other cash fill is charged for the days it supplied. A coverage the patient listed late earns a listing
      share: when the coverage record was added to the profile late_listing_long_days or more days after its
      effective_date, the charge is multiplied by late_listing_long_share; when it was added one to fewer than
      late_listing_long_days days after, by late_listing_short_share; otherwise by 1. A patient kept out of pocket earns
      an out-of-pocket share: when the cash fill was dispensed more than wait_long_days days before the day of the
      re-bill, the charge is multiplied by wait_long_share; when it was dispensed wait_short_days to wait_long_days days
      before, by wait_short_share; otherwise by 1. A drug the plan lists by handling class earns a class share, read from the re-billed fill's own prescription: when that prescription is a Non-Controlled Maintenance Prescription, the charge is multiplied by maintenance_rebill_share; when it is a Non-Controlled Acute Prescription, by acute_rebill_share; for any other class by 1. An established member earns a member share counted on the net paid claims of the coverage, its
      paid claims less its reversals: with established_claims or more net paid claims the charge is multiplied by
      established_share, with one to fewer than established_claims by settling_share, and with none by 1. A patient
      with repeated gap purchases earns a gap share: when the patient paid in cash for frequent_gap_fills or more fills
      dispensed less than gap_window_months whole months before the day of the re-bill, the charge is multiplied by
      frequent_gap_share; when for exactly two such fills, by repeat_gap_share; otherwise by 1. The charge is the re-bill
      rate times the days charged, multiplied once by the listing share, the out-of-pocket share, the class share, the member share and the gap share together, rounded to the cent only at the end, and the patient pay is that charge
      but never more than the cash the patient paid for the fill.
    prerequisite:
      - problem: coverage_ext_corrected_rebill_patient_pay
        kind: value_input
        gate: rebill_rate
        form: state
        policy_source: >-
          The patient pay of a re-billed cash fill is not fixed until every claim on the coverage reversed for a billing
          correction is named by a re-billed claim on the claim ledger.
        condition: >-
          every coverage_claim_reversed row on the coverage with reversal_reason billing_correction has its reversed claim
          named, as source_claim_id, by a coverage_claim_paid row with claim_basis retro_rebill on the same coverage.
        resolved_by: rebill_corrected_claim_b015fa67
        effect: >-
          Once the corrected claim stands, the most recent re-billed claim on the coverage exists, so rebill_rate changes
          from 0 to that claim's patient pay per day, and the net paid claims of the coverage rise by one.
    cross_category:
      - category: rx
        as: history
        reads: [rx_fills.days_supply_dispensed, rx_fills.patient_pay_usd, rx_fills.event_date, rx_fills.payment_basis, rx_fills.prescription_id, variant_name]
        note: the days charged, the out-of-pocket share and the gap share are decided from the patient's cash fills in the fill ledger, and the class share from the re-billed fill's own prescription.
    compute:
      - rebills_on_coverage: "COUNT('coverage_claims', event_type='coverage_claim_paid', claim_basis='retro_rebill')"
      - latest_rebill_pay: "LATEST('coverage_claims', 'patient_pay_usd', event_type='coverage_claim_paid', claim_basis='retro_rebill')"
      - latest_rebill_days: "LATEST('coverage_claims', 'days_supply_billed', event_type='coverage_claim_paid', claim_basis='retro_rebill')"
      - rebill_rate: "latest_rebill_pay / latest_rebill_days if rebills_on_coverage >= 1 else 0"
      - cash_fill_days: "XLATEST('rx', 'rx_fills', 'days_supply_dispensed', payment_basis='cash')"
      - cash_fill_paid: "XLATEST('rx', 'rx_fills', 'patient_pay_usd', payment_basis='cash')"
      - days_charged: "K('standard_month_days') if (cash_fill_days >= K('month_min_days') and cash_fill_days <= K('month_max_days')) else (K('ninety_day_rebill_days') if cash_fill_days >= K('ninety_day_min_days') else cash_fill_days)"
      - listing_delay_days: "DAYS(F('effective_date'), F('opened_date'))"
      - listing_share: "K('late_listing_long_share') if listing_delay_days >= K('late_listing_long_days') else (K('late_listing_short_share') if listing_delay_days >= 1 else 1)"
      - cash_fill_date: "XLATEST('rx', 'rx_fills', 'event_date', payment_basis='cash')"
      - days_out_of_pocket: "DAYS(cash_fill_date, NOW)"
      - out_of_pocket_share: "K('wait_long_share') if days_out_of_pocket > K('wait_long_days') else (K('wait_short_share') if days_out_of_pocket >= K('wait_short_days') else 1)"
      - cash_fill_prescription: "XLATEST('rx', 'rx_fills', 'prescription_id', payment_basis='cash')"
      - rebilled_drug_class: "CFIELD('rx', 'variant_name', prescription_id=cash_fill_prescription)"
      - class_share: "K('maintenance_rebill_share') if rebilled_drug_class == 'Non-Controlled Maintenance Prescription' else (K('acute_rebill_share') if rebilled_drug_class == 'Non-Controlled Acute Prescription' else 1)"
      - paid_claims_on_coverage: "COUNT('coverage_claims', event_type='coverage_claim_paid')"
      - reversals_on_coverage: "COUNT('coverage_claims', event_type='coverage_claim_reversed')"
      - net_paid_claims: "paid_claims_on_coverage - reversals_on_coverage"
      - member_share: "K('established_share') if net_paid_claims >= K('established_claims') else (K('settling_share') if net_paid_claims >= 1 else 1)"
      - gap_cash_fills: "XCOUNT('rx', 'rx_fills', within_months=K('gap_window_months'), payment_basis='cash')"
      - gap_share: "K('frequent_gap_share') if gap_cash_fills >= K('frequent_gap_fills') else (K('repeat_gap_share') if gap_cash_fills == 2 else 1)"
      - rebill_charge: "RND(rebill_rate * days_charged * listing_share * out_of_pocket_share * class_share * member_share * gap_share, 2)"
      - result: "MN(cash_fill_paid, rebill_charge)"
    compute_basis:
      rebills_on_coverage: "when no claim has been re-billed on the coverage the re-bill rate is 0."
      latest_rebill_pay: "The re-bill rate is the patient pay per day of the most recent claim re-billed on the coverage, that is its patient pay divided by its days supply;"
      latest_rebill_days: "The re-bill rate is the patient pay per day of the most recent claim re-billed on the coverage, that is its patient pay divided by its days supply;"
      rebill_rate: "The re-bill rate is the patient pay per day of the most recent claim re-billed on the coverage, that is its patient pay divided by its days supply; when no claim has been re-billed on the coverage the re-bill rate is 0."
      cash_fill_days: "The re-billed cash fill is the patient's most recent fill paid in cash."
      cash_fill_paid: "The patient pay of a re-billed cash fill is the re-bill rate times the days the cash fill supplied, rounded to the cent, and never more than the cash the patient paid for the fill."
      days_charged: "a cash fill of month_min_days to month_max_days days is charged for a standard month of standard_month_days days; a cash fill of ninety_day_min_days days or more is charged for ninety_day_rebill_days days; any other cash fill is charged for the days it supplied."
      listing_delay_days: "when the coverage record was added to the profile late_listing_long_days or more days after its effective_date, the charge is multiplied by late_listing_long_share;"
      listing_share: "when the coverage record was added to the profile late_listing_long_days or more days after its effective_date, the charge is multiplied by late_listing_long_share; when it was added one to fewer than late_listing_long_days days after, by late_listing_short_share; otherwise by 1."
      cash_fill_date: "when the cash fill was dispensed more than wait_long_days days before the day of the re-bill, the charge is multiplied by wait_long_share;"
      days_out_of_pocket: "when the cash fill was dispensed more than wait_long_days days before the day of the re-bill, the charge is multiplied by wait_long_share;"
      out_of_pocket_share: "when the cash fill was dispensed more than wait_long_days days before the day of the re-bill, the charge is multiplied by wait_long_share; when it was dispensed wait_short_days to wait_long_days days before, by wait_short_share; otherwise by 1."
      cash_fill_prescription: "A drug the plan lists by handling class earns a class share, read from the re-billed fill's own prescription:"
      rebilled_drug_class: "A drug the plan lists by handling class earns a class share, read from the re-billed fill's own prescription:"
      class_share: "when that prescription is a Non-Controlled Maintenance Prescription, the charge is multiplied by maintenance_rebill_share; when it is a Non-Controlled Acute Prescription, by acute_rebill_share; for any other class by 1."
      paid_claims_on_coverage: "An established member earns a member share counted on the net paid claims of the coverage, its paid claims less its reversals:"
      reversals_on_coverage: "An established member earns a member share counted on the net paid claims of the coverage, its paid claims less its reversals:"
      net_paid_claims: "An established member earns a member share counted on the net paid claims of the coverage, its paid claims less its reversals:"
      member_share: "with established_claims or more net paid claims the charge is multiplied by established_share, with one to fewer than established_claims by settling_share, and with none by 1."
      gap_cash_fills: "when the patient paid in cash for frequent_gap_fills or more fills dispensed less than gap_window_months whole months before the day of the re-bill, the charge is multiplied by frequent_gap_share;"
      gap_share: "when the patient paid in cash for frequent_gap_fills or more fills dispensed less than gap_window_months whole months before the day of the re-bill, the charge is multiplied by frequent_gap_share; when for exactly two such fills, by repeat_gap_share; otherwise by 1."
      rebill_charge: "The charge is the re-bill rate times the days charged, multiplied once by the listing share, the out-of-pocket share, the class share, the member share and the gap share together, rounded to the cent only at the end,"
      result: "and the patient pay is that charge but never more than the cash the patient paid for the fill."
    factors:
      - id: cash_fill_days_charged
        effect: method
        decides: days_charged
        bindings: [cash_fill_days, days_charged]
        ladder:
          - when: "the cash fill supplied month_min_days to month_max_days days"
            method: "charged for a standard month of standard_month_days days"
          - when: "the cash fill supplied ninety_day_min_days days or more"
            method: "charged for ninety_day_rebill_days days"
          - when: "otherwise"
            method: "charged for the days the cash fill supplied"
        baseline:
          days_charged: "cash_fill_days"
        evidence: [cross_category, history]
        cross_difficulty: rx
      - id: late_listing_share
        effect: parameter
        decides: listing_share
        bindings: [listing_delay_days, listing_share]
        ladder:
          - when: "the coverage record was added late_listing_long_days or more days after its effective_date"
            value: "K('late_listing_long_share')"
          - when: "it was added one to fewer than late_listing_long_days days after"
            value: "K('late_listing_short_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          listing_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: out_of_pocket_wait_share
        effect: parameter
        decides: out_of_pocket_share
        bindings: [cash_fill_date, days_out_of_pocket, out_of_pocket_share]
        ladder:
          - when: "the cash fill was dispensed more than wait_long_days days before the re-bill"
            value: "K('wait_long_share')"
          - when: "it was dispensed wait_short_days to wait_long_days days before"
            value: "K('wait_short_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          out_of_pocket_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: rx
      - id: class_share_tier
        effect: parameter
        decides: class_share
        bindings: [cash_fill_prescription, rebilled_drug_class, class_share]
        ladder:
          - when: "the re-billed fill's prescription is a Non-Controlled Maintenance Prescription"
            value: "K('maintenance_rebill_share')"
          - when: "it is a Non-Controlled Acute Prescription"
            value: "K('acute_rebill_share')"
          - when: "any other class"
            value: "1"
        baseline:
          class_share: "1"
        evidence: [cross_category]
        cross_difficulty: rx
      - id: established_member_share
        effect: parameter
        decides: member_share
        bindings: [paid_claims_on_coverage, reversals_on_coverage, net_paid_claims, member_share]
        ladder:
          - when: "established_claims or more net paid claims on the coverage"
            value: "K('established_share')"
          - when: "one to fewer than established_claims net paid claims"
            value: "K('settling_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          member_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: gap_purchase_share
        effect: parameter
        decides: gap_share
        bindings: [gap_cash_fills, gap_share]
        ladder:
          - when: "frequent_gap_fills or more cash-paid fills dispensed less than gap_window_months whole months before"
            value: "K('frequent_gap_share')"
          - when: "exactly two such fills"
            value: "K('repeat_gap_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          gap_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: rx
