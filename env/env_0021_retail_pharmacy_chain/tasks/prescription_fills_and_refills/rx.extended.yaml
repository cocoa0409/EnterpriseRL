events:
  - type: rx_prescription_received
    target: rx_prescriptions
    mutation: create
    meaning: A new prescription from a prescriber is entered on the patient's profile.
    grain: one row per prescription entered
    fields:
      prescription_id: the new prescription record's id
      customer_id: the patient the prescription is written for
      variant_name: the handling class of the prescription
      status: received
      rx_number: the Kestrel prescription number assigned at entry
      drug_name: drug name as written
      drug_strength: strength as written
      ndc: product NDC selected at entry
      quantity_prescribed: quantity per fill as written
      days_supply: days supply per fill as written
      refills_authorized: refills written by the prescriber
      refills_remaining: refills recorded at entry (capped at max_refills_allowed)
      owed_quantity: 0 at entry
      written_date: date the prescriber wrote the prescription
      expiration_date: written_date plus rx_validity_days
      prescriber_id: writing prescriber
      store_id: Kestrel store holding the prescription
      origin: how the prescription arrived
      prior_transfer_count: 0 for a prescription received directly from a prescriber
      opened_date: date of entry
    account: refills
    direction: in
    triggers: []
  - type: rx_prescription_transferred_in
    target: rx_prescriptions
    mutation: create
    meaning: A prescription with remaining refills is transferred in from a pharmacy outside Kestrel.
    grain: one row per prescription transferred in
    fields:
      prescription_id: the new prescription record's id
      customer_id: the patient
      variant_name: the handling class
      status: received
      rx_number: the Kestrel prescription number assigned at transfer
      drug_name: drug name as on the transferred prescription
      drug_strength: strength as on the transferred prescription
      ndc: product NDC selected at entry
      quantity_prescribed: quantity per fill
      days_supply: days supply per fill
      refills_authorized: refills originally written
      refills_remaining: refills remaining as reported by the transferring pharmacy
      owed_quantity: 0 at entry
      written_date: original written date
      expiration_date: written_date plus rx_validity_days
      prescriber_id: writing prescriber
      store_id: receiving Kestrel store
      origin: transfer_in
      prior_transfer_count: transfers the prescription had before this one, plus one
      opened_date: date of entry
    account: refills
    direction: in
    triggers: []
  - type: rx_activated
    target: rx_prescriptions
    mutation: {transition: {from: received, to: active}}
    meaning: The prescription becomes active because its original fill was dispensed.
    grain: one row per transaction
    fields:
      prescription_id: the prescription activated
      status: active
    triggers: []
  - type: rx_returned_to_hold
    target: rx_prescriptions
    mutation: {transition: {from: active, to: received}}
    meaning: The prescription returns to received because its only dispensed fill was returned to stock.
    grain: one row per transaction
    fields:
      prescription_id: the prescription reverted
      status: received
    triggers: []
  - type: rx_expired
    target: rx_prescriptions
    mutation: {transition: [{from: received, to: expired}, {from: active, to: expired}]}
    meaning: The prescription passes its expiration date and can no longer be filled.
    grain: one row per transaction
    fields:
      prescription_id: the prescription expired
      status: expired
      closed_date: the day after the expiration date
    triggers:
      - event: refill:refill_auto_unenrolled
        map: {prescription_id: prescription_id, closed_date: closed_date, unenroll_reason: prescription_closed}
  - type: rx_transferred_out
    target: rx_prescriptions
    mutation: {transition: [{from: received, to: transferred_out}, {from: active, to: transferred_out}]}
    meaning: The prescription's remaining refills are transferred to a pharmacy outside Kestrel.
    grain: one row per transaction
    fields:
      prescription_id: the prescription transferred
      status: transferred_out
      refills_remaining: 0 after the transfer
      transfer_destination: receiving pharmacy name and phone number as stated by the patient
      closed_date: date of the transfer
    account: refills
    direction: out
    triggers:
      - event: refill:refill_auto_unenrolled
        map: {prescription_id: prescription_id, closed_date: closed_date, unenroll_reason: prescription_closed}
  - type: rx_discontinued
    target: rx_prescriptions
    mutation: {transition: [{from: received, to: discontinued}, {from: active, to: discontinued}]}
    meaning: The prescription is inactivated and can no longer be filled.
    grain: one row per transaction
    fields:
      prescription_id: the prescription inactivated
      status: discontinued
      closed_date: date of inactivation
    triggers:
      - event: refill:refill_auto_unenrolled
        map: {prescription_id: prescription_id, closed_date: closed_date, unenroll_reason: prescription_closed}
  - type: rx_store_changed
    target: rx_prescriptions
    mutation: update
    meaning: The prescription is moved to another Kestrel store, which shares the same prescription system.
    grain: one row per transaction
    fields:
      prescription_id: the prescription moved
      store_id: the Kestrel store now holding the prescription
    triggers: []
  - type: rx_new_fill
    target: rx_fills
    meaning: The original fill of a prescription is dispensed and placed in will-call or sent for delivery.
    grain: one row per original fill dispensed
    distinguish_by: [event_date]
    fields:
      fill_id: id of this fill
      prescription_id: the prescription filled
      customer_id: the patient
      event_date: date the fill was dispensed
      fill_number: 0 for the original fill
      quantity_dispensed: units dispensed
      days_supply_dispensed: days supply dispensed
      fill_completeness: complete or partial
      product_dispensed: generic or brand
      payment_basis: how the patient's share was settled
      patient_pay_usd: amount the patient pays for this fill
      refills_remaining_after: refills remaining after this fill
      ready_date: date the fill is ready for pickup
      store_id: dispensing store
    triggers:
      - event: rx:rx_activated
        map: {prescription_id: prescription_id}
      - event: rx:rx_partial_fill
        when: {fill_completeness: partial}
        map: {prescription_id: prescription_id, customer_id: customer_id, source_fill_id: fill_id, event_date: event_date}
  - type: rx_refill
    target: rx_fills
    meaning: A refill of an active prescription is dispensed, consuming the authorized refills it uses.
    grain: one row per refill dispensed
    distinguish_by: [event_date, fill_number]
    fields:
      fill_id: id of this fill
      prescription_id: the prescription refilled
      customer_id: the patient
      event_date: date the refill was dispensed
      fill_number: sequence number of this refill on the prescription
      quantity_dispensed: units dispensed
      days_supply_dispensed: days supply dispensed
      fill_completeness: complete or partial
      fill_reason: routine, vacation_override, lost_or_stolen_replacement or dosage_change
      refills_used: refills consumed by this refill
      product_dispensed: generic or brand
      payment_basis: how the patient's share was settled
      patient_pay_usd: amount the patient pays for this fill
      refills_remaining_after: refills remaining after this refill
      police_report_number: police report number for a lost_or_stolen_replacement where required, else empty
      ready_date: date the refill is ready for pickup
      store_id: dispensing store
    account: refills
    direction: out
    triggers:
      - event: rx:rx_partial_fill
        when: {fill_completeness: partial}
        map: {prescription_id: prescription_id, customer_id: customer_id, source_fill_id: fill_id, event_date: event_date}
  - type: rx_partial_fill
    target: rx_fills
    meaning: The owed balance created when a fill is dispensed short of the prescribed quantity.
    grain: one row per short fill
    distinguish_by: [source_fill_id]
    fields:
      fill_id: id of this owed-balance record
      prescription_id: the prescription
      customer_id: the patient
      event_date: date of the short fill
      owed_units: units still owed to the patient
      source_fill_id: the original fill or refill that was dispensed short
    account: owed_units
    direction: in
    triggers: []
  - type: rx_balance_completion
    target: rx_fills
    meaning: The owed balance of a short fill is dispensed.
    grain: one row per balance dispensed
    distinguish_by: [source_fill_id, event_date]
    fields:
      fill_id: id of this completion
      prescription_id: the prescription
      customer_id: the patient
      event_date: date the balance was dispensed
      owed_units: units of owed balance settled
      quantity_dispensed: units dispensed (equal to owed_units)
      source_fill_id: the owed-balance record being settled
      ready_date: date the balance is ready for pickup
      store_id: dispensing store
    account: owed_units
    direction: out
    triggers: []
  - type: rx_balance_cancelled
    target: rx_fills
    meaning: An owed balance is cancelled because its completion window ended or the patient declined it.
    grain: one row per owed balance cancelled
    distinguish_by: [source_fill_id]
    fields:
      fill_id: id of this cancellation
      prescription_id: the prescription
      customer_id: the patient
      event_date: date of cancellation
      owed_units: units of owed balance cancelled
      source_fill_id: the owed-balance record being cancelled
    account: owed_units
    direction: out
    triggers: []
  - type: rx_return_to_stock
    target: rx_fills
    meaning: A fill left unpicked in will-call is reversed and returned to stock.
    grain: one row per fill returned to stock
    distinguish_by: [source_fill_id]
    fields:
      fill_id: id of this reversal
      prescription_id: the prescription
      customer_id: the patient
      event_date: date of the return to stock
      source_fill_id: the fill returned to stock
      source_fill_number: fill_number of the fill returned (0 for the original fill)
      refills_restored: refills_used of the fill returned when it was a refill, 0 when it was the original fill
      payment_basis: payment basis of the fill returned
    account: refills
    direction: in
    triggers:
      - event: rx:rx_returned_to_hold
        when: {source_fill_number: 0}
        map: {prescription_id: prescription_id}
      - event: coverage:coverage_claim_reversed
        when: {payment_basis: insurance}
        map: {customer_id: customer_id, event_date: event_date, reversal_reason: return_to_stock}
  - type: rx_pickup
    target: rx_fills
    meaning: A dispensed fill is released to the patient or their caregiver.
    grain: one row per fill released
    distinguish_by: [source_fill_id]
    fields:
      fill_id: id of this release
      prescription_id: the prescription
      customer_id: the patient
      event_date: date of release
      source_fill_id: the fill released
      pickup_channel: counter, drive_thru, pickup_locker or home_delivery
      picked_up_by: patient or caregiver
      id_verified: whether photo ID was checked at release
    triggers: []
  - type: rx_emergency_supply
    target: rx_fills
    meaning: The pharmacist dispenses an emergency supply of a maintenance medication when no refill is available.
    grain: one row per emergency supply
    distinguish_by: [event_date]
    fields:
      fill_id: id of this emergency supply
      prescription_id: the prescription the supply is based on
      customer_id: the patient
      event_date: date dispensed
      quantity_dispensed: units dispensed
      days_supply_dispensed: days supply dispensed
      payment_basis: how the patient's share was settled
      patient_pay_usd: amount the patient pays
      store_id: dispensing store
    triggers: []
  - type: rx_error_return
    target: rx_fills
    meaning: The patient returns a fill confirmed as a dispensing error and the amount they paid for it is refunded.
    grain: one row per erroneous fill returned
    distinguish_by: [source_fill_id]
    fields:
      fill_id: id of this return
      prescription_id: the prescription
      customer_id: the patient
      event_date: date of the return
      source_fill_id: the erroneous fill
      error_report_id: the confirmed error report
      refund_usd: amount refunded to the patient
      payment_basis: payment basis of the erroneous fill
    triggers:
      - event: rewards:rewards_goodwill_credit
        map: {customer_id: customer_id, source_ref_id: fill_id, event_date: event_date, credit_reason: dispensing_error}
      - event: coverage:coverage_claim_reversed
        when: {payment_basis: insurance}
        map: {customer_id: customer_id, event_date: event_date, reversal_reason: dispensing_error}
  - type: rx_error_remake
    target: rx_fills
    meaning: The correct medication is dispensed at no charge to replace a fill confirmed as a dispensing error.
    grain: one row per corrected remake
    distinguish_by: [source_fill_id]
    fields:
      fill_id: id of this remake
      prescription_id: the prescription
      customer_id: the patient
      event_date: date the remake was dispensed
      source_fill_id: the erroneous fill being replaced
      error_report_id: the confirmed error report
      quantity_dispensed: units dispensed
      days_supply_dispensed: days supply dispensed
      product_dispensed: generic or brand
      patient_pay_usd: 0.00
      ready_date: date the remake is ready
      store_id: dispensing store
    triggers: []
  - type: rx_renewal_requested
    target: rx_prescriber_requests
    meaning: Kestrel sends the prescriber a request to authorize a new prescription to continue therapy.
    grain: one row per request sent
    distinguish_by: [event_date]
    fields:
      request_id: id of this request
      prescription_id: the prescription to be renewed
      customer_id: the patient
      prescriber_id: prescriber the request is sent to
      event_date: date sent
      request_reason: no_refills_remaining or expiring_soon
      request_channel: electronic or fax
    triggers: []
  - type: rx_renewal_denied
    target: rx_prescriber_requests
    meaning: The prescriber declines a renewal request.
    grain: one row per request declined
    distinguish_by: [source_request_id]
    fields:
      request_id: id of this reply
      prescription_id: the prescription
      customer_id: the patient
      prescriber_id: prescriber who replied
      event_date: date of the reply
      source_request_id: the renewal request declined
      denial_reason: reason code given by the prescriber
    triggers: []

measures:
  - id: rx_msr_vacation_overrides_365d
    window: rolling 365 calendar days ending on today, inclusive
    measure: count of rx_refill rows on the prescription with fill_reason vacation_override and event_date in the window
  - id: rx_msr_lost_replacements_365d
    window: rolling 365 calendar days ending on today, inclusive
    measure: count of rx_refill rows on the prescription with fill_reason lost_or_stolen_replacement and event_date in the window
  - id: rx_msr_emergency_supplies_365d
    window: rolling 365 calendar days ending on today, inclusive
    measure: count of rx_emergency_supply rows on the prescription with event_date in the window
  - id: rx_msr_renewal_requests_30d
    window: rolling 30 calendar days ending on today, inclusive
    measure: count of rx_renewal_requested rows on the prescription with event_date in the window
  - id: rx_msr_open_owed_balances
    window: all history of the prescription
    measure: count of rx_partial_fill rows on the prescription whose fill_id is not the source_fill_id of any rx_balance_completion or rx_balance_cancelled row

policies:
  - id: rx_agg_multi_holding
    subject: [rx_prescription_received, rx_prescription_transferred_in]
    rule: >-
      A patient may hold any number of prescription records. Each record is one written order for one drug and strength
      from one prescriber and is entered as its own record with its own Kestrel prescription number; two orders are
      never merged into one record, and how records for the same drug and strength interact is decided by
      rx_agg_same_drug.
    eligibility: []
    params:
      max_per_customer: null
  - id: rx_agg_same_drug
    subject: [rx_prescription_received, rx_new_fill, rx_discontinued]
    rule: >-
      Prescriptions of one patient for the same drug_name and drug_strength are aggregated. When a newer prescription
      for the same drug and strength is entered while an older one is in received or active status, the newer one
      replaces it: the older prescription is discontinued on the date the newer one's original fill is dispensed, and
      the two are never filled side by side. Supply on hand is counted across both records. The original fill of a
      prescription that replaces another prescription for the same drug and strength is dispensed no earlier than the
      most recent dispensed fill of that drug and strength plus the refill-eligibility days. The refill-eligibility
      days are the days supply of that most recent fill multiplied by the early_refill_threshold_pct of the newer
      prescription's class and divided by 100, with any fraction of a day dropped; the fill date is day 0 and
      calendar days are counted. A different strength of the same drug is a dosage change and is not aggregated here.
    eligibility:
      - id: replacement_supply_on_hand
        applies_to: [rx_new_fill]
        kind: time
        condition: The original fill of a prescription that replaces another prescription for the same drug and strength is dispensed no earlier than the most recent dispensed fill of that drug and strength plus the refill-eligibility days.
        evidence_fields: [rx_fills.event_date, rx_fills.days_supply_dispensed, rx_fills.prescription_id, rx_prescriptions.prescription_id, rx_prescriptions.drug_name, rx_prescriptions.drug_strength]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_prescriptions.prescription_id]
          action_bindings:
            rx_prescriptions.prescription_id: prescription_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the most recent dispensed fill of that drug and strength
          anchor_source: rx_fills.event_date
          relation: not_before
          duration_source: variants.early_refill_threshold_pct
          unit: calendar_days
          counting_rule: The refill-eligibility days are the days supply of that most recent fill multiplied by the early_refill_threshold_pct of the newer prescription's class and divided by 100, with any fraction of a day dropped; the fill date is day 0 and calendar days are counted.
          boundary: inclusive
    formula:
      refill_eligible_days: days_supply_dispensed * early_refill_threshold_pct / 100
  - id: rx_prescription_intake
    subject: [rx_prescription_received, rx_prescription_transferred_in]
    rule: >-
      A prescription is classed by its controlled-substance schedule and therapy type per the class entry gates, and
      the class is fixed for the life of the record. The expiration_date is set to the written date plus the class's
      rx_validity_days, the written date being day 0 and calendar days counted. A prescription is entered only on or
      before the date the prescriber wrote the prescription plus the prescription validity days; a prescription
      presented later is refused and the patient is referred back to the prescriber. Refills are recorded as written
      but never above the class's max_refills_allowed, and the excess is not recorded. A transfer in is accepted only
      where the class's transfer_in_allowed is true, the remaining refills recorded are those the transferring
      pharmacy reports, and prior_transfer_count records the transfers before this one plus this one. A Schedule II
      Controlled Prescription is transferred in only when it is an electronic prescription that has never been
      dispensed. The class's auto_refill_eligible, med_sync_eligible and adherence_packaging_eligible switches decide
      which automated refill programs the prescription may join under the refill charter, and a class whose switch is
      false never joins that kind of program.
    eligibility:
      - id: within_validity_at_entry
        applies_to: [rx_prescription_received, rx_prescription_transferred_in]
        kind: time
        condition: A prescription is entered only on or before the date the prescriber wrote the prescription plus the prescription validity days; a prescription presented later is refused and the patient is referred back to the prescriber.
        evidence_fields: [rx_prescriptions.written_date, rx_prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_prescriptions.prescription_id]
          action_bindings:
            rx_prescriptions.prescription_id: prescription_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the prescriber wrote the prescription
          anchor_source: rx_prescriptions.written_date
          relation: not_after
          duration_source: variants.rx_validity_days
          unit: calendar_days
          counting_rule: The expiration_date is set to the written date plus the class's rx_validity_days, the written date being day 0 and calendar days counted.
          boundary: inclusive
    formula:
      refills_remaining: min(refills_authorized, max_refills_allowed)
  - id: rx_new_fill_rules
    subject: [rx_new_fill]
    rule: >-
      The original fill is dispensed only while the prescription is in received status. The original fill is dispensed
      no later than the date the prescriber wrote the prescription plus the prescription validity days, counted in
      calendar days with the written date as day 0. Its days supply is at least min_days_supply_per_fill and at most
      max_days_supply_per_fill for the class, and a 90-day supply is dispensed only where ninety_day_supply_allowed is
      true. Where first_fill_split_days is above 0, each of the first split_fill_count fills is dispensed with that days
      supply and the patient pays the plan's prorated share. An A-rated generic is dispensed where
      generic_substitution_default is true unless the prescriber wrote dispense-as-written. The ready_date is the
      booking date plus standard_ready_days, and a patient-chosen pickup date may be no more than
      refill_booking_max_advance_days after today.
    eligibility:
      - id: new_fill_only_when_received
        applies_to: [rx_new_fill]
        kind: state
        condition: The original fill is dispensed only while the prescription is in received status.
        evidence_fields: [rx_prescriptions.status, rx_prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_prescriptions.prescription_id]
          action_bindings:
            rx_prescriptions.prescription_id: prescription_id
        state_contract:
          field: rx_prescriptions.status
          allowed: [received]
      - id: new_fill_within_validity
        applies_to: [rx_new_fill]
        kind: time
        condition: The original fill is dispensed no later than the date the prescriber wrote the prescription plus the prescription validity days, counted in calendar days with the written date as day 0.
        evidence_fields: [rx_prescriptions.written_date, rx_prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_prescriptions.prescription_id]
          action_bindings:
            rx_prescriptions.prescription_id: prescription_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the prescriber wrote the prescription
          anchor_source: rx_prescriptions.written_date
          relation: not_after
          duration_source: variants.rx_validity_days
          unit: calendar_days
          counting_rule: counted in calendar days with the written date as day 0
          boundary: inclusive
  - id: rx_evt_refill_authorization
    subject: [rx_refill]
    rule: >-
      A refill is dispensed only while the prescription is in active status. A refill is dispensed only when the
      prescription's refills_remaining is at least 1. A refill is dispensed no later than the date the prescriber wrote
      the prescription plus the prescription validity days, counted in calendar days with the written date as day 0.
      A refill consumes refills_used refills, which is its days_supply_dispensed divided by the prescription's
      days_supply and rounded up to a whole number; a refill larger than the written days supply is dispensed only
      where ninety_day_supply_allowed is true and refills_remaining is at least that number. When refills_remaining is 0 or the prescription has expired the patient is offered a renewal request
      under rx_evt_renewal_request instead.
    eligibility:
      - id: refill_only_when_active
        applies_to: [rx_refill]
        kind: state
        condition: A refill is dispensed only while the prescription is in active status.
        evidence_fields: [rx_prescriptions.status, rx_prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_prescriptions.prescription_id]
          action_bindings:
            rx_prescriptions.prescription_id: prescription_id
        state_contract:
          field: rx_prescriptions.status
          allowed: [active]
      - id: refill_available
        applies_to: [rx_refill]
        kind: authorization
        condition: A refill is dispensed only when the prescription's refills_remaining is at least 1.
        evidence_fields: [rx_prescriptions.refills_remaining, rx_prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_prescriptions.prescription_id]
          action_bindings:
            rx_prescriptions.prescription_id: prescription_id
      - id: refill_within_validity
        applies_to: [rx_refill]
        kind: time
        condition: A refill is dispensed no later than the date the prescriber wrote the prescription plus the prescription validity days, counted in calendar days with the written date as day 0.
        evidence_fields: [rx_prescriptions.written_date, rx_prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_prescriptions.prescription_id]
          action_bindings:
            rx_prescriptions.prescription_id: prescription_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the prescriber wrote the prescription
          anchor_source: rx_prescriptions.written_date
          relation: not_after
          duration_source: variants.rx_validity_days
          unit: calendar_days
          counting_rule: counted in calendar days with the written date as day 0
          boundary: inclusive
  - id: rx_evt_refill_timing
    subject: [rx_refill]
    rule: >-
      A routine refill is dispensed no earlier than the refill-eligible date, which is the most recent dispensed fill of
      this prescription plus the refill-eligibility days. The refill-eligibility days are the days_supply_dispensed of
      that most recent fill multiplied by the class's early_refill_threshold_pct and divided by 100, with any fraction
      of a day dropped; the fill date is day 0 and calendar days are counted. The most recent dispensed fill is the
      latest rx_new_fill, rx_refill, rx_emergency_supply or rx_error_remake row of the prescription that has not been
      returned to stock. A refill booked for a later pickup date is dispensed on its booked date, never before the
      refill-eligible date. Only fill_reason routine is subject to this date; early refills for vacation, loss or a
      dose change are decided by rx_evt_early_fill_exceptions and nothing else.
    eligibility:
      - id: refill_not_too_soon
        applies_to: [rx_refill]
        kind: time
        condition: A routine refill is dispensed no earlier than the refill-eligible date, which is the most recent dispensed fill of this prescription plus the refill-eligibility days.
        evidence_fields: [rx_fills.event_date, rx_fills.days_supply_dispensed, rx_fills.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_fills.prescription_id]
          action_bindings:
            rx_fills.prescription_id: prescription_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the most recent dispensed fill of this prescription
          anchor_source: rx_fills.event_date
          relation: not_before
          duration_source: params.early_refill_threshold_pct
          unit: calendar_days
          counting_rule: The refill-eligibility days are the days_supply_dispensed of that most recent fill multiplied by the class's early_refill_threshold_pct and divided by 100, with any fraction of a day dropped; the fill date is day 0 and calendar days are counted.
          boundary: inclusive
    params:
      per_tier:
        Non-Controlled Acute Prescription: {early_refill_threshold_pct: =early_refill_threshold_pct}
        Non-Controlled Maintenance Prescription: {early_refill_threshold_pct: =early_refill_threshold_pct}
        Schedule V Controlled Prescription: {early_refill_threshold_pct: =early_refill_threshold_pct}
        Schedule III-IV Controlled Prescription: {early_refill_threshold_pct: =early_refill_threshold_pct}
        Schedule II Controlled Prescription: {early_refill_threshold_pct: =early_refill_threshold_pct}
        Specialty Limited-Distribution Prescription: {early_refill_threshold_pct: =early_refill_threshold_pct}
    formula:
      refill_eligible_days: days_supply_dispensed * early_refill_threshold_pct / 100
  - id: rx_evt_early_fill_exceptions
    subject: [rx_refill]
    rule: >-
      A refill dispensed before the refill-eligible date carries a fill_reason other than routine and is allowed only
      as follows. A vacation_override refill is dispensed only where the class's vacation_override_allowed is true,
      when rx_msr_vacation_overrides_365d is below vacation_override_max_per_365_days, and with a days supply no larger
      than vacation_override_max_days. A lost_or_stolen_replacement refill is dispensed only where
      lost_stolen_replacement_allowed is true and rx_msr_lost_replacements_365d is below lost_stolen_max_per_365_days;
      where lost_stolen_police_report_required is true it is dispensed only when the patient states the police report
      number, which is recorded verbatim. A dosage_change refill is dispensed only where dosage_change_early_fill_allowed
      is true and a newer prescription record or prescriber instruction shows the changed dose. Every early refill
      still consumes one refill and still needs the prescription active with a refill remaining. Whether the patient's
      insurance pays for an early refill is decided by the coverage charter; where the plan refuses, the patient may
      pay cash for the early refill. Where the class does not allow the reason, the refill waits for the
      refill-eligible date and no override is available at the Patient Care Desk.
    eligibility:
      - id: police_report_stated
        applies_to: [rx_refill]
        kind: caller_fact
        condition: where lost_stolen_police_report_required is true it is dispensed only when the patient states the police report number, which is recorded verbatim.
        evidence_fields: [rx_fills.police_report_number, rx_fills.prescription_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [rx_fills.prescription_id]
          action_bindings:
            rx_fills.prescription_id: prescription_id
    params:
      per_tier:
        Non-Controlled Acute Prescription: {vacation_override_allowed: =vacation_override_allowed, vacation_override_max_per_365_days: =vacation_override_max_per_365_days, vacation_override_max_days: =vacation_override_max_days, lost_stolen_replacement_allowed: =lost_stolen_replacement_allowed, lost_stolen_max_per_365_days: =lost_stolen_max_per_365_days, lost_stolen_police_report_required: =lost_stolen_police_report_required, dosage_change_early_fill_allowed: =dosage_change_early_fill_allowed}
        Non-Controlled Maintenance Prescription: {vacation_override_allowed: =vacation_override_allowed, vacation_override_max_per_365_days: =vacation_override_max_per_365_days, vacation_override_max_days: =vacation_override_max_days, lost_stolen_replacement_allowed: =lost_stolen_replacement_allowed, lost_stolen_max_per_365_days: =lost_stolen_max_per_365_days, lost_stolen_police_report_required: =lost_stolen_police_report_required, dosage_change_early_fill_allowed: =dosage_change_early_fill_allowed}
        Schedule V Controlled Prescription: {vacation_override_allowed: =vacation_override_allowed, vacation_override_max_per_365_days: =vacation_override_max_per_365_days, vacation_override_max_days: =vacation_override_max_days, lost_stolen_replacement_allowed: =lost_stolen_replacement_allowed, lost_stolen_max_per_365_days: =lost_stolen_max_per_365_days, lost_stolen_police_report_required: =lost_stolen_police_report_required, dosage_change_early_fill_allowed: =dosage_change_early_fill_allowed}
        Schedule III-IV Controlled Prescription: {vacation_override_allowed: =vacation_override_allowed, vacation_override_max_per_365_days: =vacation_override_max_per_365_days, vacation_override_max_days: =vacation_override_max_days, lost_stolen_replacement_allowed: =lost_stolen_replacement_allowed, lost_stolen_max_per_365_days: =lost_stolen_max_per_365_days, lost_stolen_police_report_required: =lost_stolen_police_report_required, dosage_change_early_fill_allowed: =dosage_change_early_fill_allowed}
        Schedule II Controlled Prescription: {vacation_override_allowed: =vacation_override_allowed, vacation_override_max_per_365_days: =vacation_override_max_per_365_days, vacation_override_max_days: =vacation_override_max_days, lost_stolen_replacement_allowed: =lost_stolen_replacement_allowed, lost_stolen_max_per_365_days: =lost_stolen_max_per_365_days, lost_stolen_police_report_required: =lost_stolen_police_report_required, dosage_change_early_fill_allowed: =dosage_change_early_fill_allowed}
        Specialty Limited-Distribution Prescription: {vacation_override_allowed: =vacation_override_allowed, vacation_override_max_per_365_days: =vacation_override_max_per_365_days, vacation_override_max_days: =vacation_override_max_days, lost_stolen_replacement_allowed: =lost_stolen_replacement_allowed, lost_stolen_max_per_365_days: =lost_stolen_max_per_365_days, lost_stolen_police_report_required: =lost_stolen_police_report_required, dosage_change_early_fill_allowed: =dosage_change_early_fill_allowed}
    measures: [rx_msr_vacation_overrides_365d, rx_msr_lost_replacements_365d]
  - id: rx_evt_partial_fill
    subject: [rx_partial_fill, rx_balance_completion, rx_balance_cancelled]
    rule: >-
      A fill is dispensed short only where the class's partial_fill_allowed is true and rx_msr_open_owed_balances is
      below max_open_owed_balances; the shortfall is booked as an owed balance at no additional charge, the fill's
      patient pay already covering the full prescribed quantity. For a Schedule II Controlled Prescription, the balance
      is completed no later than the date the prescriber wrote the prescription plus the partial-fill completion days.
      For every other class, the balance is completed no later than the date the fill was dispensed short plus the
      partial-fill completion days. Days are calendar days with the anchor date as day 0. The anchor of
      each class is the date its partial_fill_completion_anchor names. A balance completion
      dispenses exactly the owed units of the one owed-balance record it names and never more. An owed balance not
      completed by its last day, or declined by the patient, is cancelled for its full owed units; a cancelled Schedule
      II balance is void and needs a new prescription, while for every other class the cancelled units are not
      re-dispensed and the next fill follows the ordinary refill rules.
    eligibility:
      - id: c2_balance_window
        applies_to: [rx_balance_completion]
        kind: time
        condition: For a Schedule II Controlled Prescription, the balance is completed no later than the date the prescriber wrote the prescription plus the partial-fill completion days.
        evidence_fields: [rx_prescriptions.written_date, rx_prescriptions.variant_name, rx_fills.source_fill_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_fills.source_fill_id]
          action_bindings:
            rx_fills.source_fill_id: source_fill_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the prescriber wrote the prescription
          anchor_source: rx_prescriptions.written_date
          relation: not_after
          duration_source: params.partial_fill_completion_days
          unit: calendar_days
          counting_rule: Days are calendar days with the anchor date as day 0.
          boundary: inclusive
      - id: other_balance_window
        applies_to: [rx_balance_completion]
        kind: time
        condition: For every other class, the balance is completed no later than the date the fill was dispensed short plus the partial-fill completion days.
        evidence_fields: [rx_fills.event_date, rx_fills.source_fill_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_fills.source_fill_id]
          action_bindings:
            rx_fills.source_fill_id: source_fill_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the fill was dispensed short
          anchor_source: rx_fills.event_date
          relation: not_after
          duration_source: params.partial_fill_completion_days
          unit: calendar_days
          counting_rule: Days are calendar days with the anchor date as day 0.
          boundary: inclusive
      - id: one_settlement_per_balance
        applies_to: [rx_balance_completion, rx_balance_cancelled]
        kind: dedup
        condition: A balance completion dispenses exactly the owed units of the one owed-balance record it names and never more.
        evidence_fields: [rx_fills.source_fill_id, rx_fills.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_fills.source_fill_id]
          action_bindings:
            rx_fills.source_fill_id: source_fill_id
        dedup_contract:
          table: rx_fills
          mode: separate_record
          object_bindings: {source_fill_id: source_fill_id}
          duplicate_filters: {event_type: [rx_balance_completion, rx_balance_cancelled]}
          distinct_fields: []
    params:
      per_tier:
        Non-Controlled Acute Prescription: {partial_fill_allowed: =partial_fill_allowed, partial_fill_completion_days: =partial_fill_completion_days, partial_fill_completion_anchor: =partial_fill_completion_anchor, max_open_owed_balances: =max_open_owed_balances}
        Non-Controlled Maintenance Prescription: {partial_fill_allowed: =partial_fill_allowed, partial_fill_completion_days: =partial_fill_completion_days, partial_fill_completion_anchor: =partial_fill_completion_anchor, max_open_owed_balances: =max_open_owed_balances}
        Schedule V Controlled Prescription: {partial_fill_allowed: =partial_fill_allowed, partial_fill_completion_days: =partial_fill_completion_days, partial_fill_completion_anchor: =partial_fill_completion_anchor, max_open_owed_balances: =max_open_owed_balances}
        Schedule III-IV Controlled Prescription: {partial_fill_allowed: =partial_fill_allowed, partial_fill_completion_days: =partial_fill_completion_days, partial_fill_completion_anchor: =partial_fill_completion_anchor, max_open_owed_balances: =max_open_owed_balances}
        Schedule II Controlled Prescription: {partial_fill_allowed: =partial_fill_allowed, partial_fill_completion_days: =partial_fill_completion_days, partial_fill_completion_anchor: =partial_fill_completion_anchor, max_open_owed_balances: =max_open_owed_balances}
        Specialty Limited-Distribution Prescription: {partial_fill_allowed: =partial_fill_allowed, partial_fill_completion_days: =partial_fill_completion_days, partial_fill_completion_anchor: =partial_fill_completion_anchor, max_open_owed_balances: =max_open_owed_balances}
    measures: [rx_msr_open_owed_balances]
  - id: rx_evt_will_call
    subject: [rx_return_to_stock]
    rule: >-
      A fill waiting in will-call is held from its ready date for the class's will_call_hold_days. A fill is returned to
      stock no earlier than the ready date of that fill plus the will-call hold days, counted in calendar days with the
      ready date as day 0, and only when no rx_pickup row names it. The return reverses the fill: a returned refill
      restores the refills it used, a returned original fill restores none and puts the prescription back in received status,
      and an insurance-billed fill has its claim reversed under the coverage charter. A fill out for home delivery is
      not returned to stock while its delivery order is open; once the delivery charter returns the order to the store,
      the fill is returned to stock no earlier than the later of the will-call hold's end and the end of that charter's
      returned-order hold. The hold is never extended at a patient's request; a patient who cannot collect in time has
      the fill returned to stock and books a new fill when ready.
    eligibility:
      - id: hold_period_elapsed
        applies_to: [rx_return_to_stock]
        kind: time
        condition: A fill is returned to stock no earlier than the ready date of that fill plus the will-call hold days, counted in calendar days with the ready date as day 0, and only when no rx_pickup row names it.
        evidence_fields: [rx_fills.ready_date, rx_fills.fill_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_fills.fill_id]
          action_bindings:
            rx_fills.fill_id: source_fill_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the ready date of that fill
          anchor_source: rx_fills.ready_date
          relation: not_before
          duration_source: params.will_call_hold_days
          unit: calendar_days
          counting_rule: counted in calendar days with the ready date as day 0
          boundary: inclusive
    params:
      per_tier:
        Non-Controlled Acute Prescription: {will_call_hold_days: =will_call_hold_days}
        Non-Controlled Maintenance Prescription: {will_call_hold_days: =will_call_hold_days}
        Schedule V Controlled Prescription: {will_call_hold_days: =will_call_hold_days}
        Schedule III-IV Controlled Prescription: {will_call_hold_days: =will_call_hold_days}
        Schedule II Controlled Prescription: {will_call_hold_days: =will_call_hold_days}
        Specialty Limited-Distribution Prescription: {will_call_hold_days: =will_call_hold_days}
  - id: rx_evt_pickup_release
    subject: [rx_pickup]
    rule: >-
      A fill is released once, to the patient or, where caregiver_pickup_allowed is true, to a caregiver the patient
      names. The person collecting must be at least minimum_pickup_age_years old. Photo ID is checked and recorded as
      id_verified true when the patient collects and id_required_at_pickup is true, or when a caregiver collects and
      caregiver_id_required is true. The pickup_locker channel is used only where locker_pickup_allowed is true and the
      store has a pickup locker, and drive_thru only where drive_thru_pickup_allowed is true and the store has a
      drive-thru. The home_delivery channel is used only where delivery_eligible is true and the patient holds a delivery
      plan in enrolled, active or past_due status; a delivered fill of a class whose delivery_signature_required is true is
      handed over only against an adult signature under the delivery charter. A fill that has been returned to stock
      cannot be released; it must be filled again.
    eligibility:
      - id: release_once
        applies_to: [rx_pickup]
        kind: dedup
        condition: A fill is released once, to the patient or, where caregiver_pickup_allowed is true, to a caregiver the patient names.
        evidence_fields: [rx_fills.source_fill_id, rx_fills.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_fills.source_fill_id]
          action_bindings:
            rx_fills.source_fill_id: source_fill_id
        dedup_contract:
          table: rx_fills
          mode: separate_record
          object_bindings: {source_fill_id: source_fill_id}
          duplicate_filters: {event_type: [rx_pickup, rx_return_to_stock]}
          distinct_fields: []
      - id: delivery_plan_held
        applies_to: [rx_pickup]
        kind: state
        condition: The home_delivery channel is used only where delivery_eligible is true and the patient holds a delivery plan in enrolled, active or past_due status; a delivered fill of a class whose delivery_signature_required is true is handed over only against an adult signature under the delivery charter.
        evidence_fields: [delivery_plans.status, delivery_plans.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_plans.customer_id]
          action_bindings:
            delivery_plans.customer_id: customer_id
        state_contract:
          field: delivery_plans.status
          allowed: [enrolled, active, past_due]
    params:
      per_tier:
        Non-Controlled Acute Prescription: {id_required_at_pickup: =id_required_at_pickup, caregiver_pickup_allowed: =caregiver_pickup_allowed, caregiver_id_required: =caregiver_id_required, minimum_pickup_age_years: =minimum_pickup_age_years, locker_pickup_allowed: =locker_pickup_allowed, drive_thru_pickup_allowed: =drive_thru_pickup_allowed, delivery_eligible: =delivery_eligible, delivery_signature_required: =delivery_signature_required}
        Non-Controlled Maintenance Prescription: {id_required_at_pickup: =id_required_at_pickup, caregiver_pickup_allowed: =caregiver_pickup_allowed, caregiver_id_required: =caregiver_id_required, minimum_pickup_age_years: =minimum_pickup_age_years, locker_pickup_allowed: =locker_pickup_allowed, drive_thru_pickup_allowed: =drive_thru_pickup_allowed, delivery_eligible: =delivery_eligible, delivery_signature_required: =delivery_signature_required}
        Schedule V Controlled Prescription: {id_required_at_pickup: =id_required_at_pickup, caregiver_pickup_allowed: =caregiver_pickup_allowed, caregiver_id_required: =caregiver_id_required, minimum_pickup_age_years: =minimum_pickup_age_years, locker_pickup_allowed: =locker_pickup_allowed, drive_thru_pickup_allowed: =drive_thru_pickup_allowed, delivery_eligible: =delivery_eligible, delivery_signature_required: =delivery_signature_required}
        Schedule III-IV Controlled Prescription: {id_required_at_pickup: =id_required_at_pickup, caregiver_pickup_allowed: =caregiver_pickup_allowed, caregiver_id_required: =caregiver_id_required, minimum_pickup_age_years: =minimum_pickup_age_years, locker_pickup_allowed: =locker_pickup_allowed, drive_thru_pickup_allowed: =drive_thru_pickup_allowed, delivery_eligible: =delivery_eligible, delivery_signature_required: =delivery_signature_required}
        Schedule II Controlled Prescription: {id_required_at_pickup: =id_required_at_pickup, caregiver_pickup_allowed: =caregiver_pickup_allowed, caregiver_id_required: =caregiver_id_required, minimum_pickup_age_years: =minimum_pickup_age_years, locker_pickup_allowed: =locker_pickup_allowed, drive_thru_pickup_allowed: =drive_thru_pickup_allowed, delivery_eligible: =delivery_eligible, delivery_signature_required: =delivery_signature_required}
        Specialty Limited-Distribution Prescription: {id_required_at_pickup: =id_required_at_pickup, caregiver_pickup_allowed: =caregiver_pickup_allowed, caregiver_id_required: =caregiver_id_required, minimum_pickup_age_years: =minimum_pickup_age_years, locker_pickup_allowed: =locker_pickup_allowed, drive_thru_pickup_allowed: =drive_thru_pickup_allowed, delivery_eligible: =delivery_eligible, delivery_signature_required: =delivery_signature_required}
  - id: rx_evt_dispensing_error
    subject: [rx_error_return, rx_error_remake]
    rule: >-
      Kestrel accepts back dispensed medication only for a dispensing error; a fill that was dispensed correctly is
      never taken back or refunded, whatever the reason the patient gives. A dispensing-error return or remake is
      processed only when the patient's error report for that fill has review_outcome confirmed. For an error of type
      wrong_quantity_short, the return is processed no later than the date the patient picked up the fill plus the
      short-count report window days. For every other error type, the return is processed no later than the date the
      patient picked up the fill plus the error report window days. Days are calendar days with the pickup date as day
      0. The refund equals the patient_pay_usd of the erroneous fill, returned by the original payment method, and an
      insurance-billed fill has its claim reversed. The erroneous fill is returned at most once. The remake dispenses
      the correct medication at no charge, consumes no refill, carries a ready_date no later than error_remake_ready_days
      after the return, and is not subject to the refill-eligible date. Where error_goodwill_eligible is true the patient
      also receives the rewards goodwill credit under the rewards charter. A report that is still pending_review or was
      not_confirmed gives no refund and no remake.
    eligibility:
      - id: error_confirmed
        applies_to: [rx_error_return, rx_error_remake]
        kind: state
        condition: A dispensing-error return or remake is processed only when the patient's error report for that fill has review_outcome confirmed.
        evidence_fields: [rx_error_reports.review_outcome, rx_error_reports.error_report_id, rx_error_reports.fill_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_error_reports.error_report_id]
          action_bindings:
            rx_error_reports.error_report_id: error_report_id
        state_contract:
          field: rx_error_reports.review_outcome
          allowed: [confirmed]
      - id: short_count_window
        applies_to: [rx_error_return]
        kind: time
        condition: For an error of type wrong_quantity_short, the return is processed no later than the date the patient picked up the fill plus the short-count report window days.
        evidence_fields: [rx_fills.event_date, rx_fills.source_fill_id, rx_error_reports.error_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_fills.source_fill_id]
          action_bindings:
            rx_fills.source_fill_id: source_fill_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the patient picked up the fill
          anchor_source: rx_fills.event_date
          relation: not_after
          duration_source: params.short_count_report_window_days
          unit: calendar_days
          counting_rule: Days are calendar days with the pickup date as day 0.
          boundary: inclusive
      - id: error_report_window
        applies_to: [rx_error_return]
        kind: time
        condition: For every other error type, the return is processed no later than the date the patient picked up the fill plus the error report window days.
        evidence_fields: [rx_fills.event_date, rx_fills.source_fill_id, rx_error_reports.error_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_fills.source_fill_id]
          action_bindings:
            rx_fills.source_fill_id: source_fill_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the patient picked up the fill
          anchor_source: rx_fills.event_date
          relation: not_after
          duration_source: params.error_report_window_days
          unit: calendar_days
          counting_rule: Days are calendar days with the pickup date as day 0.
          boundary: inclusive
      - id: one_return_per_fill
        applies_to: [rx_error_return]
        kind: dedup
        condition: The erroneous fill is returned at most once.
        evidence_fields: [rx_fills.source_fill_id, rx_fills.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_fills.source_fill_id]
          action_bindings:
            rx_fills.source_fill_id: source_fill_id
        dedup_contract:
          table: rx_fills
          mode: separate_record
          object_bindings: {source_fill_id: source_fill_id}
          duplicate_filters: {event_type: [rx_error_return]}
          distinct_fields: []
    params:
      per_tier:
        Non-Controlled Acute Prescription: {short_count_report_window_days: =short_count_report_window_days, error_report_window_days: =error_report_window_days, error_remake_ready_days: =error_remake_ready_days, error_goodwill_eligible: =error_goodwill_eligible}
        Non-Controlled Maintenance Prescription: {short_count_report_window_days: =short_count_report_window_days, error_report_window_days: =error_report_window_days, error_remake_ready_days: =error_remake_ready_days, error_goodwill_eligible: =error_goodwill_eligible}
        Schedule V Controlled Prescription: {short_count_report_window_days: =short_count_report_window_days, error_report_window_days: =error_report_window_days, error_remake_ready_days: =error_remake_ready_days, error_goodwill_eligible: =error_goodwill_eligible}
        Schedule III-IV Controlled Prescription: {short_count_report_window_days: =short_count_report_window_days, error_report_window_days: =error_report_window_days, error_remake_ready_days: =error_remake_ready_days, error_goodwill_eligible: =error_goodwill_eligible}
        Schedule II Controlled Prescription: {short_count_report_window_days: =short_count_report_window_days, error_report_window_days: =error_report_window_days, error_remake_ready_days: =error_remake_ready_days, error_goodwill_eligible: =error_goodwill_eligible}
        Specialty Limited-Distribution Prescription: {short_count_report_window_days: =short_count_report_window_days, error_report_window_days: =error_report_window_days, error_remake_ready_days: =error_remake_ready_days, error_goodwill_eligible: =error_goodwill_eligible}
    formula:
      refund_usd: patient_pay_usd
  - id: rx_evt_emergency_supply
    subject: [rx_emergency_supply]
    rule: >-
      An emergency supply is dispensed only for a prescription in active or expired status whose class has
      emergency_supply_allowed true, when the prescription has no refill available or has expired, and when a renewal
      request sent to the prescriber has had no reply for at least renewal_request_resend_business_days business days.
      Its days supply is the smaller of emergency_supply_max_days and the prescription's days_supply, and
      rx_msr_emergency_supplies_365d must be below emergency_supply_max_per_365_days. It consumes no refill and does not
      reactivate an expired prescription. Controlled and specialty classes never receive an emergency supply at Kestrel;
      the patient is referred to the prescriber.
    eligibility:
      - id: emergency_on_active_or_expired
        applies_to: [rx_emergency_supply]
        kind: state
        condition: An emergency supply is dispensed only for a prescription in active or expired status whose class has emergency_supply_allowed true, when the prescription has no refill available or has expired, and when a renewal request sent to the prescriber has had no reply for at least renewal_request_resend_business_days business days.
        evidence_fields: [rx_prescriptions.status, rx_prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_prescriptions.prescription_id]
          action_bindings:
            rx_prescriptions.prescription_id: prescription_id
        state_contract:
          field: rx_prescriptions.status
          allowed: [active, expired]
    params:
      per_tier:
        Non-Controlled Acute Prescription: {emergency_supply_allowed: =emergency_supply_allowed, emergency_supply_max_days: =emergency_supply_max_days, emergency_supply_max_per_365_days: =emergency_supply_max_per_365_days}
        Non-Controlled Maintenance Prescription: {emergency_supply_allowed: =emergency_supply_allowed, emergency_supply_max_days: =emergency_supply_max_days, emergency_supply_max_per_365_days: =emergency_supply_max_per_365_days}
        Schedule V Controlled Prescription: {emergency_supply_allowed: =emergency_supply_allowed, emergency_supply_max_days: =emergency_supply_max_days, emergency_supply_max_per_365_days: =emergency_supply_max_per_365_days}
        Schedule III-IV Controlled Prescription: {emergency_supply_allowed: =emergency_supply_allowed, emergency_supply_max_days: =emergency_supply_max_days, emergency_supply_max_per_365_days: =emergency_supply_max_per_365_days}
        Schedule II Controlled Prescription: {emergency_supply_allowed: =emergency_supply_allowed, emergency_supply_max_days: =emergency_supply_max_days, emergency_supply_max_per_365_days: =emergency_supply_max_per_365_days}
        Specialty Limited-Distribution Prescription: {emergency_supply_allowed: =emergency_supply_allowed, emergency_supply_max_days: =emergency_supply_max_days, emergency_supply_max_per_365_days: =emergency_supply_max_per_365_days}
    formula:
      days_supply_dispensed: min(emergency_supply_max_days, days_supply)
    measures: [rx_msr_emergency_supplies_365d]
  - id: rx_evt_renewal_request
    subject: [rx_renewal_requested, rx_renewal_denied]
    rule: >-
      A renewal request is sent only where the class's renewal_request_allowed is true and the prescription is in
      received, active or expired status, with request_reason no_refills_remaining when refills_remaining is 0 and
      expiring_soon when refills remain but today is within renewal_request_window_days before the expiration date. A
      renewal request is sent no earlier than the previous request for this prescription plus the resend business days,
      counted in business days Monday to Friday excluding Kestrel's published holidays, the send date being day 0. The
      request goes electronically when the prescriber's record shows epcs_enabled true or the class is non-controlled;
      it goes by fax only where the class's renewal_fax_permitted is true and the prescriber cannot receive it
      electronically, and otherwise no request is recorded and the patient is asked to contact the prescriber. No more
      than renewal_requests_max_per_30_days requests are sent per prescription in rolling 30 days, measured by
      rx_msr_renewal_requests_30d. An approval arrives as a new prescription entered under rx_prescription_intake and is
      never recorded as a reply here; a denial is recorded against the request it answers and ends that request.
    eligibility:
      - id: resend_spacing
        applies_to: [rx_renewal_requested]
        kind: time
        condition: A renewal request is sent no earlier than the previous request for this prescription plus the resend business days, counted in business days Monday to Friday excluding Kestrel's published holidays, the send date being day 0.
        evidence_fields: [rx_prescriber_requests.event_date, rx_prescriber_requests.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_prescriber_requests.prescription_id]
          action_bindings:
            rx_prescriber_requests.prescription_id: prescription_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the previous request for this prescription
          anchor_source: rx_prescriber_requests.event_date
          relation: not_before
          duration_source: params.renewal_request_resend_business_days
          unit: business_days
          counting_rule: counted in business days Monday to Friday excluding Kestrel's published holidays, the send date being day 0
          boundary: inclusive
      - id: renewal_state
        applies_to: [rx_renewal_requested]
        kind: state
        condition: A renewal request is sent only where the class's renewal_request_allowed is true and the prescription is in received, active or expired status, with request_reason no_refills_remaining when refills_remaining is 0 and expiring_soon when refills remain but today is within renewal_request_window_days before the expiration date.
        evidence_fields: [rx_prescriptions.status, rx_prescriptions.refills_remaining, rx_prescriptions.expiration_date, rx_prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_prescriptions.prescription_id]
          action_bindings:
            rx_prescriptions.prescription_id: prescription_id
        state_contract:
          field: rx_prescriptions.status
          allowed: [received, active, expired]
    params:
      per_tier:
        Non-Controlled Acute Prescription: {renewal_request_allowed: =renewal_request_allowed, renewal_request_window_days: =renewal_request_window_days, renewal_fax_permitted: =renewal_fax_permitted, renewal_request_resend_business_days: =renewal_request_resend_business_days, renewal_requests_max_per_30_days: =renewal_requests_max_per_30_days}
        Non-Controlled Maintenance Prescription: {renewal_request_allowed: =renewal_request_allowed, renewal_request_window_days: =renewal_request_window_days, renewal_fax_permitted: =renewal_fax_permitted, renewal_request_resend_business_days: =renewal_request_resend_business_days, renewal_requests_max_per_30_days: =renewal_requests_max_per_30_days}
        Schedule V Controlled Prescription: {renewal_request_allowed: =renewal_request_allowed, renewal_request_window_days: =renewal_request_window_days, renewal_fax_permitted: =renewal_fax_permitted, renewal_request_resend_business_days: =renewal_request_resend_business_days, renewal_requests_max_per_30_days: =renewal_requests_max_per_30_days}
        Schedule III-IV Controlled Prescription: {renewal_request_allowed: =renewal_request_allowed, renewal_request_window_days: =renewal_request_window_days, renewal_fax_permitted: =renewal_fax_permitted, renewal_request_resend_business_days: =renewal_request_resend_business_days, renewal_requests_max_per_30_days: =renewal_requests_max_per_30_days}
        Schedule II Controlled Prescription: {renewal_request_allowed: =renewal_request_allowed, renewal_request_window_days: =renewal_request_window_days, renewal_fax_permitted: =renewal_fax_permitted, renewal_request_resend_business_days: =renewal_request_resend_business_days, renewal_requests_max_per_30_days: =renewal_requests_max_per_30_days}
        Specialty Limited-Distribution Prescription: {renewal_request_allowed: =renewal_request_allowed, renewal_request_window_days: =renewal_request_window_days, renewal_fax_permitted: =renewal_fax_permitted, renewal_request_resend_business_days: =renewal_request_resend_business_days, renewal_requests_max_per_30_days: =renewal_requests_max_per_30_days}
    measures: [rx_msr_renewal_requests_30d]
  - id: rx_transfer_and_move
    subject: [rx_transferred_out, rx_store_changed]
    rule: >-
      A move between Kestrel stores changes only the holding store and is allowed where store_move_allowed is true; where
      store_move_before_first_fill_only is true the move is allowed only while the prescription is in received status.
      A transfer to a pharmacy outside Kestrel is allowed only where external_transfer_out_allowed is true and the
      prescription is in received or active status; where transfer_out_requires_no_prior_transfer is true it is allowed
      only when prior_transfer_count is 0; where transfer_out_requires_unfilled is true only while the prescription is
      in received status; and where transfer_out_requires_electronic_origin is true only when origin is e_prescription.
      A prescription with an open owed balance is not transferred out or moved until that balance is completed or
      cancelled. A prescription with a fill still in will-call is not transferred out until that fill is picked up or
      returned to stock. On transfer out every remaining refill leaves with the prescription and the destination
      pharmacy's name and phone number are recorded exactly as the patient states them.
    eligibility:
      - id: no_open_owed_balance
        applies_to: [rx_transferred_out, rx_store_changed]
        kind: authorization
        condition: A prescription with an open owed balance is not transferred out or moved until that balance is completed or cancelled.
        evidence_fields: [rx_prescriptions.owed_quantity, rx_prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rx_prescriptions.prescription_id]
          action_bindings:
            rx_prescriptions.prescription_id: prescription_id
      - id: destination_stated
        applies_to: [rx_transferred_out]
        kind: caller_fact
        condition: On transfer out every remaining refill leaves with the prescription and the destination pharmacy's name and phone number are recorded exactly as the patient states them.
        evidence_fields: [rx_prescriptions.transfer_destination, rx_prescriptions.prescription_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [rx_prescriptions.prescription_id]
          action_bindings:
            rx_prescriptions.prescription_id: prescription_id
    params:
      per_tier:
        Non-Controlled Acute Prescription: {store_move_allowed: =store_move_allowed, store_move_before_first_fill_only: =store_move_before_first_fill_only, external_transfer_out_allowed: =external_transfer_out_allowed, transfer_out_requires_no_prior_transfer: =transfer_out_requires_no_prior_transfer, transfer_out_requires_unfilled: =transfer_out_requires_unfilled, transfer_out_requires_electronic_origin: =transfer_out_requires_electronic_origin}
        Non-Controlled Maintenance Prescription: {store_move_allowed: =store_move_allowed, store_move_before_first_fill_only: =store_move_before_first_fill_only, external_transfer_out_allowed: =external_transfer_out_allowed, transfer_out_requires_no_prior_transfer: =transfer_out_requires_no_prior_transfer, transfer_out_requires_unfilled: =transfer_out_requires_unfilled, transfer_out_requires_electronic_origin: =transfer_out_requires_electronic_origin}
        Schedule V Controlled Prescription: {store_move_allowed: =store_move_allowed, store_move_before_first_fill_only: =store_move_before_first_fill_only, external_transfer_out_allowed: =external_transfer_out_allowed, transfer_out_requires_no_prior_transfer: =transfer_out_requires_no_prior_transfer, transfer_out_requires_unfilled: =transfer_out_requires_unfilled, transfer_out_requires_electronic_origin: =transfer_out_requires_electronic_origin}
        Schedule III-IV Controlled Prescription: {store_move_allowed: =store_move_allowed, store_move_before_first_fill_only: =store_move_before_first_fill_only, external_transfer_out_allowed: =external_transfer_out_allowed, transfer_out_requires_no_prior_transfer: =transfer_out_requires_no_prior_transfer, transfer_out_requires_unfilled: =transfer_out_requires_unfilled, transfer_out_requires_electronic_origin: =transfer_out_requires_electronic_origin}
        Schedule II Controlled Prescription: {store_move_allowed: =store_move_allowed, store_move_before_first_fill_only: =store_move_before_first_fill_only, external_transfer_out_allowed: =external_transfer_out_allowed, transfer_out_requires_no_prior_transfer: =transfer_out_requires_no_prior_transfer, transfer_out_requires_unfilled: =transfer_out_requires_unfilled, transfer_out_requires_electronic_origin: =transfer_out_requires_electronic_origin}
        Specialty Limited-Distribution Prescription: {store_move_allowed: =store_move_allowed, store_move_before_first_fill_only: =store_move_before_first_fill_only, external_transfer_out_allowed: =external_transfer_out_allowed, transfer_out_requires_no_prior_transfer: =transfer_out_requires_no_prior_transfer, transfer_out_requires_unfilled: =transfer_out_requires_unfilled, transfer_out_requires_electronic_origin: =transfer_out_requires_electronic_origin}
  - id: rx_lifecycle_closure
    subject: [rx_activated, rx_returned_to_hold, rx_expired, rx_discontinued]
    rule: >-
      A prescription becomes active when its original fill is dispensed and returns to received only when that original
      fill is returned to stock. It expires on the day after its expiration_date whether or not refills remain; an
      expired prescription is never refilled and the patient is offered a renewal request. It is discontinued when the
      prescriber sends a cancellation, when the patient asks Kestrel to stop filling it, or when a newer prescription for
      the same drug and strength replaces it under rx_agg_same_drug. A prescription with a fill still in
      will-call is not discontinued until that fill is picked up or returned to stock. Expiry, discontinuation and transfer out each end any refill-program
      enrollment on the prescription under the refill charter. None of these closures refunds a fill already picked up.
    eligibility: []

# ============================================================================
# extended_policies: the multi-factor calculation policies this difficulty adds on top of the base policies
# ============================================================================
extended_policies:
  # ---------------------------------------------------------------- claimed by task 0
  - id: rx_ext_strength_error_remake_units
    base_policy_refs: [rx_evt_dispensing_error]
    overwrite: []
    trigger: state_due
    subject: [rx_error_remake]
    computes: quantity_dispensed
    target_tool: dispense_strength_error_remake_b4449648
    params:
      late_report_days: 3
      slow_review_days: 3
      long_delay_days: 3
      short_delay_days: 1
      short_major_days: 3
      short_minor_days: 1
      strength_no_refill_days: 5
      strength_last_refill_days: 3
      strength_long_pause_days: 30
      strength_long_pause_add_days: 5
      strength_short_pause_add_days: 2
    rule: >-
      This rule settles the strength-error remake quantity, the units of correct-strength medication dispensed at no
      charge on a remake that answers a confirmed wrong_strength dispensing-error report; it refines the remake of
      rx_evt_dispensing_error and changes none of its conditions. The remake answers the most recently reported
      wrong_strength report on the prescription whose review_outcome is confirmed, and the fill that report names is
      the wrong-strength fill. The strength-error remake quantity is the quantity dispensed on the wrong-strength fill.
      The prescribed daily units are the prescription's quantity_prescribed divided by its days_supply. The replaced
      strength units are settled as follows, the wrong-strength pickup date being the event date of the pickup entry
      that names the wrong-strength fill and every span being counted in calendar days from its first date as day 0:
      when the report was made late_report_days or more days after the wrong-strength pickup date, the replaced
      strength units are the prescribed daily units multiplied by the wrong-strength fill's days_supply_dispensed less
      the days from the wrong-strength pickup date to the report date, never below zero; when the report was made
      fewer than late_report_days days after that pickup date and the pharmacist's review came slow_review_days or
      more days after the report date, the replaced strength units are the prescribed daily units multiplied by the
      wrong-strength fill's days_supply_dispensed less the days from the wrong-strength pickup date to the review date,
      never below zero; otherwise the replaced strength units are the quantity dispensed on the wrong-strength fill.
      The strength-error waiting allowance counts the calendar days from the review date of the answered report to
      today: long_delay_days or more days give that same number of days, one day up to fewer than long_delay_days days
      gives short_delay_days days, and a remake on the review date gives no days. The strength-error short-fill
      allowance looks at the owed-balance entry booked for the wrong-strength fill: owed units booked at least equal to
      the units dispensed on that fill give short_major_days days, fewer owed units booked but more than zero give
      short_minor_days days, and a wrong-strength fill dispensed complete gives no days. The strength-error continuity
      allowance looks at the refills left on the prescription, being refills_authorized less the refills used by its
      refills plus the refills restored by returns to stock: no refill left gives strength_no_refill_days days,
      exactly one refill left gives strength_last_refill_days days, and more refills left give no days. The
      strength-error pause allowance looks at an automated refill enrollment on the prescription that is paused: a
      pause ending strength_long_pause_days or more days after today gives strength_long_pause_add_days days, a pause
      ending one day up to fewer than strength_long_pause_days days after today gives strength_short_pause_add_days
      days, and no paused enrollment gives no days. The strength-error remake quantity is then the replaced strength
      units plus the prescribed daily units multiplied by the sum of the strength-error waiting, short-fill,
      continuity and pause allowances, the whole taken down to a whole number of units.
    prerequisite: []
    cross_category:
      - category: refill
        as: branch
        reads: [status, prescription_id, pause_until_date]
        note: A paused automated refill enrollment on the prescription decides the strength-error pause allowance.
    compute:
      - strength_fill: "LATEST('rx_error_reports', 'fill_id', date_field='reported_date', review_outcome='confirmed', error_type='wrong_strength')"
      - strength_reported: "LATEST('rx_error_reports', 'reported_date', date_field='reported_date', review_outcome='confirmed', error_type='wrong_strength')"
      - strength_reviewed: "LATEST('rx_error_reports', 'reviewed_date', date_field='reported_date', review_outcome='confirmed', error_type='wrong_strength')"
      - wrong_units: "LATEST('rx_fills', 'quantity_dispensed', fill_id=strength_fill)"
      - wrong_days: "LATEST('rx_fills', 'days_supply_dispensed', fill_id=strength_fill)"
      - wrong_pickup: "LATEST('rx_fills', 'event_date', event_type='rx_pickup', source_fill_id=strength_fill)"
      - daily_units: "F('quantity_prescribed') / F('days_supply')"
      - replaced_units: "MX(0, daily_units * (wrong_days - DAYS(wrong_pickup, strength_reported))) if DAYS(wrong_pickup, strength_reported) >= K('late_report_days') else (MX(0, daily_units * (wrong_days - DAYS(wrong_pickup, strength_reviewed))) if (DAYS(wrong_pickup, strength_reported) < K('late_report_days') and DAYS(strength_reported, strength_reviewed) >= K('slow_review_days')) else wrong_units)"
      - days_since_review: "DAYS(strength_reviewed, NOW)"
      - waiting_days: "days_since_review if days_since_review >= K('long_delay_days') else (K('short_delay_days') if days_since_review >= 1 else 0)"
      - owed_booked: "LATEST('rx_fills', 'owed_units', event_type='rx_partial_fill', source_fill_id=strength_fill) or 0"
      - short_fill_days: "K('short_major_days') if owed_booked >= wrong_units else (K('short_minor_days') if owed_booked > 0 else 0)"
      - strength_refills_left: "F('refills_authorized') - SUM('rx_fills', 'refills_used', event_type='rx_refill') + SUM('rx_fills', 'refills_restored', event_type='rx_return_to_stock')"
      - continuity_days: "K('strength_no_refill_days') if strength_refills_left <= 0 else (K('strength_last_refill_days') if strength_refills_left == 1 else 0)"
      - strength_pause_end: "CFIELD('refill', 'pause_until_date', status='paused', prescription_id=HID) or NOW"
      - pause_days: "K('strength_long_pause_add_days') if DAYS(NOW, strength_pause_end) >= K('strength_long_pause_days') else (K('strength_short_pause_add_days') if DAYS(NOW, strength_pause_end) >= 1 else 0)"
      - result: "int(replaced_units + daily_units * (waiting_days + short_fill_days + continuity_days + pause_days))"
    compute_basis:
      strength_fill: "The remake answers the most recently reported wrong_strength report on the prescription whose review_outcome is confirmed, and the fill that report names is the wrong-strength fill."
      strength_reported: "when the report was made late_report_days or more days after the wrong-strength pickup date"
      strength_reviewed: "the pharmacist's review came slow_review_days or more days after the report date"
      wrong_units: "The strength-error remake quantity is the quantity dispensed on the wrong-strength fill."
      wrong_days: "the prescribed daily units multiplied by the wrong-strength fill's days_supply_dispensed less the days from the wrong-strength pickup date to the report date, never below zero"
      wrong_pickup: "the wrong-strength pickup date being the event date of the pickup entry that names the wrong-strength fill and every span being counted in calendar days from its first date as day 0"
      daily_units: "The prescribed daily units are the prescription's quantity_prescribed divided by its days_supply."
      replaced_units: "when the report was made late_report_days or more days after the wrong-strength pickup date, the replaced strength units are the prescribed daily units multiplied by the wrong-strength fill's days_supply_dispensed less the days from the wrong-strength pickup date to the report date, never below zero; when the report was made fewer than late_report_days days after that pickup date and the pharmacist's review came slow_review_days or more days after the report date, the replaced strength units are the prescribed daily units multiplied by the wrong-strength fill's days_supply_dispensed less the days from the wrong-strength pickup date to the review date, never below zero; otherwise the replaced strength units are the quantity dispensed on the wrong-strength fill."
      days_since_review: "The strength-error waiting allowance counts the calendar days from the review date of the answered report to today"
      waiting_days: "long_delay_days or more days give that same number of days, one day up to fewer than long_delay_days days gives short_delay_days days, and a remake on the review date gives no days."
      owed_booked: "The strength-error short-fill allowance looks at the owed-balance entry booked for the wrong-strength fill"
      short_fill_days: "owed units booked at least equal to the units dispensed on that fill give short_major_days days, fewer owed units booked but more than zero give short_minor_days days, and a wrong-strength fill dispensed complete gives no days."
      strength_refills_left: "being refills_authorized less the refills used by its refills plus the refills restored by returns to stock"
      continuity_days: "no refill left gives strength_no_refill_days days, exactly one refill left gives strength_last_refill_days days, and more refills left give no days."
      strength_pause_end: "The strength-error pause allowance looks at an automated refill enrollment on the prescription that is paused"
      pause_days: "a pause ending strength_long_pause_days or more days after today gives strength_long_pause_add_days days, a pause ending one day up to fewer than strength_long_pause_days days after today gives strength_short_pause_add_days days, and no paused enrollment gives no days."
      result: "The strength-error remake quantity is then the replaced strength units plus the prescribed daily units multiplied by the sum of the strength-error waiting, short-fill, continuity and pause allowances, the whole taken down to a whole number of units."
    factors:
      - id: replaced_units_basis
        effect: method
        decides: replaced_units
        bindings: [replaced_units]
        ladder:
          - when: "the wrong-strength report was made late_report_days or more days after the wrong-strength pickup date"
            method: "the prescribed daily units times the fill's days_supply_dispensed less the days from pickup to the report date, never below zero"
          - when: "the report came fewer than late_report_days days after pickup and the review came slow_review_days or more days after the report"
            method: "the prescribed daily units times the fill's days_supply_dispensed less the days from pickup to the review date, never below zero"
          - when: "otherwise"
            method: "the quantity dispensed on the wrong-strength fill"
        baseline:
          replaced_units: "wrong_units"
        evidence: [history, date]
        cross_difficulty: null
      - id: remake_waiting_allowance
        effect: parameter
        decides: waiting_days
        bindings: [days_since_review, waiting_days]
        ladder:
          - when: "long_delay_days or more calendar days from the review date to today"
            value: "the number of those days"
          - when: "one day up to fewer than long_delay_days days from the review date to today"
            value: "K('short_delay_days')"
          - when: "otherwise (the remake is made on the review date)"
            value: "0"
        baseline:
          waiting_days: "0"
        evidence: [date]
        cross_difficulty: null
      - id: short_fill_allowance
        effect: parameter
        decides: short_fill_days
        bindings: [owed_booked, short_fill_days]
        ladder:
          - when: "the owed units booked for the wrong-strength fill are at least the units dispensed on it"
            value: "K('short_major_days')"
          - when: "owed units were booked for it but fewer than the units dispensed"
            value: "K('short_minor_days')"
          - when: "otherwise (the wrong-strength fill was dispensed complete)"
            value: "0"
        baseline:
          short_fill_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: strength_continuity_allowance
        effect: parameter
        decides: continuity_days
        bindings: [strength_refills_left, continuity_days]
        ladder:
          - when: "no refill left on the prescription"
            value: "K('strength_no_refill_days')"
          - when: "exactly one refill left"
            value: "K('strength_last_refill_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          continuity_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: strength_pause_allowance
        effect: parameter
        decides: pause_days
        bindings: [strength_pause_end, pause_days]
        ladder:
          - when: "an automated refill enrollment on the prescription is paused until strength_long_pause_days or more days after today"
            value: "K('strength_long_pause_add_days')"
          - when: "it is paused until one day up to fewer than strength_long_pause_days days after today"
            value: "K('strength_short_pause_add_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          pause_days: "0"
        evidence: [cross_category, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The strength-error remake quantity is the quantity dispensed on the wrong-strength fill.
      params: []
    inputs:
      history:
        - {table: rx_error_reports, aggregate: latest, field: fill_id, filters: {review_outcome: confirmed, error_type: wrong_strength}}
        - {table: rx_fills, aggregate: latest, field: quantity_dispensed, filters: {fill_id: wrong-strength fill}}
        - {table: rx_fills, aggregate: latest, field: owed_units, filters: {event_type: rx_partial_fill}}
        - {table: rx_fills, aggregate: sum, field: refills_used, filters: {event_type: rx_refill}}
      cross_category: [refill]
  - id: rx_ext_open_balance_decline_credit
    base_policy_refs: [rx_evt_partial_fill, rx_evt_dispensing_error]
    overwrite:
      - base_policy: rx_evt_dispensing_error
        superseded_clause: >-
          a fill that was dispensed correctly is never taken back or refunded, whatever the reason the patient gives.
        replaced_by: >-
          Apart from this credit, a fill of these classes that was dispensed correctly is never taken back or refunded, whatever the reason the patient gives.
    trigger: on_request
    subject: [rx_balance_cancelled]
    computes: refund_usd
    target_tool: decline_owed_balance_20c85924
    params:
      club_block_days: 30
      copay_week_days: 7
      reorder_days: 4
      handling_after_reorder_usd: 1.00
      handling_before_reorder_usd: 0.50
      recovery_repeated_usd: 2.00
      recovery_second_usd: 1.00
      tenure_long_usd: 0.25
      tenure_mid_usd: 0.10
      error_confirmed_usd: 1.00
      error_pending_usd: 0.50
    rule: >-
      This rule settles the non-controlled decline credit, the amount returned by the original payment method when the
      patient declines the open owed balance of a prescription in the Non-Controlled Acute Prescription, Non-Controlled
      Maintenance Prescription or Specialty Limited-Distribution Prescription class; the balance itself is cancelled
      for its full owed units exactly as rx_evt_partial_fill provides, and the credit is recorded on the cancellation
      entry. A short fill's patient pay covers the full prescribed quantity, so the part of it that paid for units
      never dispensed is credited when the patient declines them. Apart from this credit, a fill of these classes
      that was dispensed correctly is never taken back or refunded, whatever the reason the patient gives. The declined
      balance is the prescription's most recent owed-balance entry, and the short fill is the fill that entry names.
      The non-controlled decline credit is the short fill's patient pay multiplied by the owed units being declined
      and divided by the units the short fill was meant to carry, being its units dispensed plus the owed units, and it
      is rounded to the nearest cent. The non-controlled undelivered value is worked out by one of three methods: when
      the short fill was settled under a discount program and the patient holds an active Kestrel Rx Savings Club
      Individual or Kestrel Rx Savings Club Family membership, it is the short fill's patient pay less that
      membership's value-list 30-day price for every started club_block_days days of the short fill's
      days_supply_dispensed; when the short fill was billed to insurance and the patient's active coverage is a
      Commercial Copay Plan, whose flat copay is reset by whole weeks of therapy, it is the short fill's patient pay
      multiplied by copay_week_days for every whole week of therapy the owed units carry, the owed units being turned
      into days at the prescription's days_supply per quantity_prescribed, and divided by the prescription's
      days_supply; otherwise it is the short fill's patient pay multiplied by the owed units and divided by the units
      dispensed plus the owed units. The
      non-controlled handling amount counts the calendar days from the short fill's dispensing date, as day 0, to
      today: reorder_days or more days keep handling_after_reorder_usd, one day up to fewer than reorder_days days
      keep handling_before_reorder_usd, and a decline on the dispensing date keeps nothing. The non-controlled
      recovery amount counts the owed-balance entries booked on the prescription in the last 12 months: three or more
      add recovery_repeated_usd, exactly two add recovery_second_usd, and one adds nothing. The non-controlled
      tenure amount counts the original fills and refills dispensed on the prescription in the last 12 months: four
      or more add tenure_long_usd, two or three add tenure_mid_usd, and fewer add nothing. The non-controlled error
      amount looks at the dispensing-error reports that name the short fill: a confirmed report adds
      error_confirmed_usd, a report still pending_review with none confirmed adds error_pending_usd, and no such
      report adds nothing. The non-controlled decline credit is then the non-controlled undelivered value less the
      non-controlled handling amount, never below zero, plus the non-controlled recovery amount, tenure amount and
      error amount, the total rounded to the nearest cent once at the end.
    prerequisite: []
    cross_category:
      - category: copay
        as: branch
        reads: [status, variant_name, value_generic_30_day_price_usd]
        note: The Savings Club membership decides whether the undelivered value is re-priced on the club value list, and its 30-day list price is the price used.
      - category: coverage
        as: branch
        reads: [status, variant_name]
        note: A Commercial Copay Plan on file selects the whole-week method of the non-controlled undelivered value.
    compute:
      - short_fill: "LATEST('rx_fills', 'source_fill_id', event_type='rx_partial_fill')"
      - owed_units: "LATEST('rx_fills', 'owed_units', event_type='rx_partial_fill')"
      - short_pay: "LATEST('rx_fills', 'patient_pay_usd', fill_id=short_fill)"
      - short_units: "LATEST('rx_fills', 'quantity_dispensed', fill_id=short_fill)"
      - short_days: "LATEST('rx_fills', 'days_supply_dispensed', fill_id=short_fill)"
      - short_date: "LATEST('rx_fills', 'event_date', fill_id=short_fill)"
      - short_basis: "LATEST('rx_fills', 'payment_basis', fill_id=short_fill)"
      - club_member: "EXISTS('copay', status='active', variant_name='Kestrel Rx Savings Club Individual') or EXISTS('copay', status='active', variant_name='Kestrel Rx Savings Club Family')"
      - club_price: "CPARAM('copay', 'value_generic_30_day_price_usd', status='active', variant_name='Kestrel Rx Savings Club Individual') or CPARAM('copay', 'value_generic_30_day_price_usd', status='active', variant_name='Kestrel Rx Savings Club Family') or 0"
      - copay_plan_held: "EXISTS('coverage', status='active', variant_name='Commercial Copay Plan')"
      - undelivered_value: "(short_pay - club_price * (-(-short_days // K('club_block_days')))) if (short_basis == 'discount_program' and club_member) else ((short_pay * K('copay_week_days') * ((owed_units * F('days_supply') / F('quantity_prescribed')) // K('copay_week_days')) / F('days_supply')) if (short_basis == 'insurance' and copay_plan_held) else (short_pay * owed_units / (short_units + owed_units)))"
      - days_standing: "DAYS(short_date, NOW)"
      - handling_kept: "K('handling_after_reorder_usd') if days_standing >= K('reorder_days') else (K('handling_before_reorder_usd') if days_standing >= 1 else 0)"
      - short_fills_12m: "COUNT('rx_fills', within_months=12, event_type='rx_partial_fill')"
      - recovery_amount: "K('recovery_repeated_usd') if short_fills_12m >= 3 else (K('recovery_second_usd') if short_fills_12m == 2 else 0)"
      - fills_12m: "COUNT('rx_fills', within_months=12, event_type='rx_refill') + COUNT('rx_fills', within_months=12, event_type='rx_new_fill')"
      - tenure_amount: "K('tenure_long_usd') if fills_12m >= 4 else (K('tenure_mid_usd') if fills_12m >= 2 else 0)"
      - confirmed_on_short: "COUNT('rx_error_reports', date_field='reported_date', fill_id=short_fill, review_outcome='confirmed')"
      - pending_on_short: "COUNT('rx_error_reports', date_field='reported_date', fill_id=short_fill, review_outcome='pending_review')"
      - error_amount: "K('error_confirmed_usd') if confirmed_on_short >= 1 else (K('error_pending_usd') if pending_on_short >= 1 else 0)"
      - result: "RND(MX(0, undelivered_value - handling_kept) + recovery_amount + tenure_amount + error_amount, 2)"
    compute_basis:
      short_fill: "The declined balance is the prescription's most recent owed-balance entry, and the short fill is the fill that entry names."
      owed_units: "multiplied by the owed units being declined"
      short_pay: "The non-controlled decline credit is the short fill's patient pay multiplied by the owed units being declined and divided by the units the short fill was meant to carry, being its units dispensed plus the owed units, and it is rounded to the nearest cent."
      short_units: "being its units dispensed plus the owed units"
      short_days: "for every started club_block_days days of the short fill's days_supply_dispensed"
      short_date: "The non-controlled handling amount counts the calendar days from the short fill's dispensing date, as day 0, to today"
      short_basis: "when the short fill was settled under a discount program"
      club_member: "the patient holds an active Kestrel Rx Savings Club Individual or Kestrel Rx Savings Club Family membership"
      club_price: "that membership's value-list 30-day price"
      copay_plan_held: "the patient's active coverage is a Commercial Copay Plan"
      undelivered_value: "when the short fill was settled under a discount program and the patient holds an active Kestrel Rx Savings Club Individual or Kestrel Rx Savings Club Family membership, it is the short fill's patient pay less that membership's value-list 30-day price for every started club_block_days days of the short fill's days_supply_dispensed; when the short fill was billed to insurance and the patient's active coverage is a Commercial Copay Plan, whose flat copay is reset by whole weeks of therapy, it is the short fill's patient pay multiplied by copay_week_days for every whole week of therapy the owed units carry, the owed units being turned into days at the prescription's days_supply per quantity_prescribed, and divided by the prescription's days_supply; otherwise it is the short fill's patient pay multiplied by the owed units and divided by the units dispensed plus the owed units."
      days_standing: "The non-controlled handling amount counts the calendar days from the short fill's dispensing date, as day 0, to today"
      handling_kept: "reorder_days or more days keep handling_after_reorder_usd, one day up to fewer than reorder_days days keep handling_before_reorder_usd, and a decline on the dispensing date keeps nothing."
      short_fills_12m: "The non-controlled recovery amount counts the owed-balance entries booked on the prescription in the last 12 months"
      recovery_amount: "three or more add recovery_repeated_usd, exactly two add recovery_second_usd, and one adds nothing."
      fills_12m: "The non-controlled tenure amount counts the original fills and refills dispensed on the prescription in the last 12 months"
      tenure_amount: "four or more add tenure_long_usd, two or three add tenure_mid_usd, and fewer add nothing."
      confirmed_on_short: "The non-controlled error amount looks at the dispensing-error reports that name the short fill"
      pending_on_short: "a report still pending_review with none confirmed adds error_pending_usd"
      error_amount: "a confirmed report adds error_confirmed_usd, a report still pending_review with none confirmed adds error_pending_usd, and no such report adds nothing."
      result: "The non-controlled decline credit is then the non-controlled undelivered value less the non-controlled handling amount, never below zero, plus the non-controlled recovery amount, tenure amount and error amount, the total rounded to the nearest cent once at the end."
    factors:
      - id: undelivered_value_method
        effect: method
        decides: undelivered_value
        bindings: [club_member, club_price, copay_plan_held, undelivered_value]
        ladder:
          - when: "the short fill was settled under a discount program and the patient holds an active Kestrel Rx Savings Club membership"
            method: "the short fill's patient pay less the club's value-list 30-day price for every started club_block_days days dispensed"
          - when: "the short fill was billed to insurance and the patient's active coverage is a Commercial Copay Plan"
            method: "the patient pay times copay_week_days for every whole week of therapy in the owed units, divided by the written days supply"
          - when: "otherwise"
            method: "the patient pay times the owed units divided by the units dispensed plus the owed units"
        baseline:
          undelivered_value: "short_pay * owed_units / (short_units + owed_units)"
        evidence: [history, cross_category]
        cross_difficulty: copay
      - id: handling_amount
        effect: parameter
        decides: handling_kept
        bindings: [days_standing, handling_kept]
        ladder:
          - when: "reorder_days or more calendar days from the short fill's dispensing date to today"
            value: "K('handling_after_reorder_usd')"
          - when: "one day up to fewer than reorder_days days"
            value: "K('handling_before_reorder_usd')"
          - when: "otherwise (declined on the dispensing date)"
            value: "0"
        baseline:
          handling_kept: "0"
        evidence: [date]
        cross_difficulty: null
      - id: repeat_short_recovery
        effect: parameter
        decides: recovery_amount
        bindings: [short_fills_12m, recovery_amount]
        ladder:
          - when: "three or more owed-balance entries booked on the prescription in the last 12 months"
            value: "K('recovery_repeated_usd')"
          - when: "exactly two owed-balance entries in the last 12 months"
            value: "K('recovery_second_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          recovery_amount: "0"
        evidence: [history]
        cross_difficulty: null
      - id: tenure_amount
        effect: parameter
        decides: tenure_amount
        bindings: [fills_12m, tenure_amount]
        ladder:
          - when: "four or more original fills and refills dispensed on the prescription in the last 12 months"
            value: "K('tenure_long_usd')"
          - when: "two or three of them"
            value: "K('tenure_mid_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_amount: "0"
        evidence: [history]
        cross_difficulty: null
      - id: short_fill_error_amount
        effect: parameter
        decides: error_amount
        bindings: [confirmed_on_short, pending_on_short, error_amount]
        ladder:
          - when: "a confirmed dispensing-error report names the short fill"
            value: "K('error_confirmed_usd')"
          - when: "a report naming the short fill is still pending_review and none is confirmed"
            value: "K('error_pending_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          error_amount: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The non-controlled decline credit is the short fill's patient pay multiplied by the owed units being declined
        and divided by the units the short fill was meant to carry, being its units dispensed plus the owed units, and it
        is rounded to the nearest cent.
      params: []
    inputs:
      history:
        - {table: rx_fills, aggregate: latest, field: source_fill_id, filters: {event_type: rx_partial_fill}}
        - {table: rx_fills, aggregate: count, field: fill_id, within_months: 12, filters: {event_type: rx_partial_fill}}
        - {table: rx_fills, aggregate: count, field: fill_id, within_months: 12, filters: {event_type: rx_refill}}
        - {table: rx_error_reports, aggregate: count, field: error_report_id, filters: {review_outcome: confirmed}}
      cross_category: [copay, coverage]
  - id: rx_ext_vacation_override_days
    base_policy_refs: [rx_evt_refill_authorization, rx_evt_refill_timing, rx_evt_early_fill_exceptions]
    overwrite: []
    trigger: on_request
    subject: [rx_refill]
    computes: days_supply_dispensed
    target_tool: record_vacation_override_refill_9f5a083e
    params:
      single_allowance_ceiling_days: 60
      full_claim_days: 90
      repeat_two_reduction_days: 30
      repeat_one_reduction_days: 15
      grace_established_days: 7
      grace_recent_days: 3
      long_pause_days: 30
      pause_long_buffer_days: 7
      pause_short_buffer_days: 3
      courier_buffer_days: 1
    rule: >-
      This rule settles the vacation override days supply, the days supply of a refill with fill_reason
      vacation_override dispensed before the refill-eligible date for a patient who is travelling; every condition of
      rx_evt_early_fill_exceptions, rx_evt_refill_authorization and rx_evt_refill_timing continues to apply, the refill
      consumes one refill, and the result never exceeds the class's vacation_override_max_days. A vacation override
      refill is not dispensed until each confirmed dispensing-error report on the prescription has a corrected remake
      booked against it on the fill ledger. The vacation override days supply is fixed only after the prescription's
      fill ledger shows no owed balance still open, every short fill's owed units having been completed or cancelled.
      The prescribed daily units are the prescription's quantity_prescribed divided by its days_supply. The vacation
      override days supply is the class's vacation_override_max_days less the days of medication still on hand from
      the most recent refill, which are that refill's days_supply_dispensed less the calendar days from its dispensing
      date, as day 0, to today, never below zero; any owed units still standing on the prescription, divided by the
      prescribed daily units, are deducted as well, and the result is never below zero and is taken down to whole days.
      The vacation override ceiling follows the patient's active prescription coverage: a plan that allows exactly one
      vacation override a plan year and pays claims of full_claim_days days or more gives
      single_allowance_ceiling_days days; a plan that allows no vacation override, or pays claims of fewer than
      full_claim_days days, gives that plan's claim day limit; any other plan, or no active plan, gives the class's
      vacation_override_max_days. The vacation override repeat reduction counts the earlier vacation_override refills
      on the prescription in the last 12 months: two or more take off repeat_two_reduction_days days, exactly one takes
      off repeat_one_reduction_days days, and none takes off nothing. The vacation override on-hand days are counted
      from the pickup when the most recent refill was picked up on a later day than it was dispensed, being its
      days_supply_dispensed less the calendar days from that pickup date to today, never below zero; when the most
      recent refill has not been picked up, its whole days_supply_dispensed counts as on hand; otherwise they are
      counted from the dispensing date as stated above. The vacation override grace days count the refills dispensed
      on the prescription in the last 12 months: three or more give grace_established_days days, one or two give
      grace_recent_days days, and none gives no days; the grace days are taken off the on-hand days, never below zero.
      The vacation override pause buffer looks at an automated refill enrollment on the prescription that is paused:
      a pause ending long_pause_days or more days after today adds pause_long_buffer_days days, a pause ending one day
      up to fewer than long_pause_days days after today adds pause_short_buffer_days days, and no paused enrollment adds
      nothing. The vacation override transit buffer looks at the patient's delivery plan: an active Kestrel Mail
      Delivery plan adds that plan's mail_transit_business_days, any other active delivery plan adds
      courier_buffer_days days, and no active delivery plan adds nothing. The vacation override days supply is then
      the vacation override ceiling less the repeat reduction, less the on-hand days after the grace days, less the
      owed days, never below zero, plus the pause buffer and the transit buffer, taken down to whole days, and the
      total is held to no more than the class's vacation_override_max_days.
    prerequisite:
      - problem: rx_ext_open_balance_decline_credit
        kind: value_input
        gate: owed_days
        form: state
        policy_source: >-
          The vacation override days supply is fixed only after the prescription's fill ledger shows no owed balance still open, every short fill's owed units having been completed or cancelled.
        condition: >-
          Every owed-balance entry on the prescription is named as source by a balance completion or balance
          cancellation entry, so the owed units summed over the prescription's fill ledger are zero.
        resolved_by: decline_owed_balance_20c85924
        effect: >-
          Once the open owed balance is cancelled, owed_days falls from the owed units divided by the prescribed daily
          units to zero, so the vacation override days supply no longer deducts units that will never be dispensed.
      - problem: rx_ext_strength_error_remake_units
        kind: state_gate
        gate: rx_fills.error_report_id
        form: state
        policy_source: >-
          A vacation override refill is not dispensed until each confirmed dispensing-error report on the prescription has a corrected remake booked against it on the fill ledger.
        condition: >-
          For every dispensing-error report on the prescription whose review_outcome is confirmed, the fill ledger holds
          a remake entry whose error_report_id names that report.
        resolved_by: dispense_strength_error_remake_b4449648
        effect: >-
          Once the corrected remake is booked against the confirmed wrong-strength report, no confirmed report on the
          prescription stands unanswered and the vacation override refill may be dispensed.
    cross_category:
      - category: coverage
        as: branch
        reads: [status, vacation_override_per_plan_year, max_days_supply_per_claim]
        note: The active plan's vacation override allowance and claim day limit decide the vacation override ceiling.
      - category: delivery
        as: branch
        reads: [status, variant_name, mail_transit_business_days]
        note: The patient's active delivery plan decides the transit buffer.
      - category: refill
        as: branch
        reads: [status, prescription_id, pause_until_date]
        note: A paused automated refill enrollment on the prescription decides the pause buffer.
    compute:
      - daily_units: "F('quantity_prescribed') / F('days_supply')"
      - plan_allowance: "CPARAM('coverage', 'vacation_override_per_plan_year', status='active')"
      - plan_claim_limit: "CPARAM('coverage', 'max_days_supply_per_claim', status='active')"
      - override_ceiling: "K('single_allowance_ceiling_days') if (plan_allowance == 1 and (plan_claim_limit or 0) >= K('full_claim_days')) else ((plan_claim_limit or 0) if (plan_allowance == 0 or (plan_claim_limit or K('full_claim_days')) < K('full_claim_days')) else P('vacation_override_max_days'))"
      - prior_overrides: "COUNT('rx_fills', within_months=12, event_type='rx_refill', fill_reason='vacation_override')"
      - repeat_reduction: "K('repeat_two_reduction_days') if prior_overrides >= 2 else (K('repeat_one_reduction_days') if prior_overrides == 1 else 0)"
      - last_refill_date: "LATEST('rx_fills', 'event_date', event_type='rx_refill')"
      - last_refill_days: "LATEST('rx_fills', 'days_supply_dispensed', event_type='rx_refill')"
      - last_refill_fill: "LATEST('rx_fills', 'fill_id', event_type='rx_refill')"
      - last_pickup_date: "LATEST('rx_fills', 'event_date', event_type='rx_pickup', source_fill_id=last_refill_fill) or ''"
      - on_hand_days: "MX(0, last_refill_days - DAYS(last_pickup_date, NOW)) if last_pickup_date > last_refill_date else (last_refill_days if last_pickup_date < last_refill_date else MX(0, last_refill_days - DAYS(last_refill_date, NOW)))"
      - refills_12m: "COUNT('rx_fills', within_months=12, event_type='rx_refill')"
      - grace_days: "K('grace_established_days') if refills_12m >= 3 else (K('grace_recent_days') if refills_12m >= 1 else 0)"
      - owed_units: "SUM('rx_fills', 'owed_units', event_type='rx_partial_fill') - SUM('rx_fills', 'owed_units', event_type='rx_balance_completion') - SUM('rx_fills', 'owed_units', event_type='rx_balance_cancelled')"
      - owed_days: "owed_units / daily_units"
      - pause_end: "CFIELD('refill', 'pause_until_date', status='paused', prescription_id=HID) or NOW"
      - pause_buffer: "K('pause_long_buffer_days') if DAYS(NOW, pause_end) >= K('long_pause_days') else (K('pause_short_buffer_days') if DAYS(NOW, pause_end) >= 1 else 0)"
      - mail_transit: "CPARAM('delivery', 'mail_transit_business_days', status='active', variant_name='Kestrel Mail Delivery')"
      - transit_buffer: "(mail_transit or 0) if EXISTS('delivery', status='active', variant_name='Kestrel Mail Delivery') else (K('courier_buffer_days') if EXISTS('delivery', status='active') else 0)"
      - result: "MN(P('vacation_override_max_days'), int(MX(0, override_ceiling - repeat_reduction - MX(0, on_hand_days - grace_days) - owed_days) + pause_buffer + transit_buffer))"
    compute_basis:
      daily_units: "The prescribed daily units are the prescription's quantity_prescribed divided by its days_supply."
      plan_allowance: "a plan that allows exactly one vacation override a plan year"
      plan_claim_limit: "pays claims of full_claim_days days or more"
      override_ceiling: "a plan that allows exactly one vacation override a plan year and pays claims of full_claim_days days or more gives single_allowance_ceiling_days days; a plan that allows no vacation override, or pays claims of fewer than full_claim_days days, gives that plan's claim day limit; any other plan, or no active plan, gives the class's vacation_override_max_days."
      prior_overrides: "The vacation override repeat reduction counts the earlier vacation_override refills on the prescription in the last 12 months"
      repeat_reduction: "two or more take off repeat_two_reduction_days days, exactly one takes off repeat_one_reduction_days days, and none takes off nothing."
      last_refill_date: "the days of medication still on hand from the most recent refill, which are that refill's days_supply_dispensed less the calendar days from its dispensing date, as day 0, to today, never below zero"
      last_refill_days: "that refill's days_supply_dispensed"
      last_refill_fill: "the days of medication still on hand from the most recent refill"
      last_pickup_date: "when the most recent refill was picked up on a later day than it was dispensed"
      on_hand_days: "The vacation override on-hand days are counted from the pickup when the most recent refill was picked up on a later day than it was dispensed, being its days_supply_dispensed less the calendar days from that pickup date to today, never below zero; when the most recent refill has not been picked up, its whole days_supply_dispensed counts as on hand; otherwise they are counted from the dispensing date as stated above."
      refills_12m: "The vacation override grace days count the refills dispensed on the prescription in the last 12 months"
      grace_days: "three or more give grace_established_days days, one or two give grace_recent_days days, and none gives no days; the grace days are taken off the on-hand days, never below zero."
      owed_units: "any owed units still standing on the prescription"
      owed_days: "any owed units still standing on the prescription, divided by the prescribed daily units, are deducted as well"
      pause_end: "The vacation override pause buffer looks at an automated refill enrollment on the prescription that is paused"
      pause_buffer: "a pause ending long_pause_days or more days after today adds pause_long_buffer_days days, a pause ending one day up to fewer than long_pause_days days after today adds pause_short_buffer_days days, and no paused enrollment adds nothing."
      mail_transit: "an active Kestrel Mail Delivery plan adds that plan's mail_transit_business_days"
      transit_buffer: "an active Kestrel Mail Delivery plan adds that plan's mail_transit_business_days, any other active delivery plan adds courier_buffer_days days, and no active delivery plan adds nothing."
      result: "The vacation override days supply is then the vacation override ceiling less the repeat reduction, less the on-hand days after the grace days, less the owed days, never below zero, plus the pause buffer and the transit buffer, taken down to whole days, and the total is held to no more than the class's vacation_override_max_days."
    factors:
      - id: vacation_ceiling
        effect: parameter
        decides: override_ceiling
        bindings: [plan_allowance, plan_claim_limit, override_ceiling]
        ladder:
          - when: "the active plan allows exactly one vacation override a plan year and pays claims of full_claim_days days or more"
            value: "K('single_allowance_ceiling_days')"
          - when: "the active plan allows no vacation override or pays claims of fewer than full_claim_days days"
            value: "CPARAM('coverage', 'max_days_supply_per_claim')"
          - when: "otherwise (any other plan, or no active plan)"
            value: "P('vacation_override_max_days')"
        baseline:
          override_ceiling: "P('vacation_override_max_days')"
        evidence: [cross_category, tier_param]
        cross_difficulty: coverage
      - id: repeat_override_reduction
        effect: parameter
        decides: repeat_reduction
        bindings: [prior_overrides, repeat_reduction]
        ladder:
          - when: "two or more earlier vacation_override refills on the prescription in the last 12 months"
            value: "K('repeat_two_reduction_days')"
          - when: "exactly one earlier vacation_override refill in the last 12 months"
            value: "K('repeat_one_reduction_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          repeat_reduction: "0"
        evidence: [history]
        cross_difficulty: null
      - id: on_hand_anchor
        effect: method
        decides: on_hand_days
        bindings: [last_pickup_date, on_hand_days]
        ladder:
          - when: "the most recent refill was picked up on a later day than it was dispensed"
            method: "its days_supply_dispensed less the calendar days from the pickup date to today, never below zero"
          - when: "the most recent refill has not been picked up"
            method: "its whole days_supply_dispensed counts as on hand"
          - when: "otherwise"
            method: "its days_supply_dispensed less the calendar days from the dispensing date to today, never below zero"
        baseline:
          on_hand_days: "MX(0, last_refill_days - DAYS(last_refill_date, NOW))"
        evidence: [history, date]
        cross_difficulty: null
      - id: adherence_grace
        effect: parameter
        decides: grace_days
        bindings: [refills_12m, grace_days]
        ladder:
          - when: "three or more refills dispensed on the prescription in the last 12 months"
            value: "K('grace_established_days')"
          - when: "one or two refills in the last 12 months"
            value: "K('grace_recent_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          grace_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: paused_refill_buffer
        effect: parameter
        decides: pause_buffer
        bindings: [pause_end, pause_buffer]
        ladder:
          - when: "an automated refill enrollment on the prescription is paused until long_pause_days or more days after today"
            value: "K('pause_long_buffer_days')"
          - when: "it is paused until one day up to fewer than long_pause_days days after today"
            value: "K('pause_short_buffer_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          pause_buffer: "0"
        evidence: [cross_category, date]
        cross_difficulty: null
      - id: delivery_transit_buffer
        effect: parameter
        decides: transit_buffer
        bindings: [mail_transit, transit_buffer]
        ladder:
          - when: "the patient holds an active Kestrel Mail Delivery plan"
            value: "CPARAM('delivery', 'mail_transit_business_days')"
          - when: "the patient holds another active delivery plan"
            value: "K('courier_buffer_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          transit_buffer: "0"
        evidence: [cross_category]
        cross_difficulty: delivery
    baseline:
      rule: >-
        The prescribed daily units are the prescription's quantity_prescribed divided by its days_supply. The vacation
        override days supply is the class's vacation_override_max_days less the days of medication still on hand from
        the most recent refill, which are that refill's days_supply_dispensed less the calendar days from its dispensing
        date, as day 0, to today, never below zero; any owed units still standing on the prescription, divided by the
        prescribed daily units, are deducted as well, and the result is never below zero and is taken down to whole days.
      params: [vacation_override_max_days]
    inputs:
      history:
        - {table: rx_fills, aggregate: count, field: fill_id, within_months: 12, filters: {event_type: rx_refill, fill_reason: vacation_override}}
        - {table: rx_fills, aggregate: latest, field: days_supply_dispensed, filters: {event_type: rx_refill}}
        - {table: rx_fills, aggregate: latest, field: event_date, filters: {event_type: rx_pickup}}
        - {table: rx_fills, aggregate: sum, field: owed_units, filters: {event_type: rx_partial_fill}}
      cross_category: [coverage, delivery, refill]
  # ---------------------------------------------------------------- claimed by task 1
  - id: rx_ext_theft_replacement_days
    base_policy_refs: [rx_evt_refill_authorization, rx_evt_refill_timing, rx_evt_early_fill_exceptions]
    overwrite:
      - base_policy: rx_evt_early_fill_exceptions
        superseded_clause: >-
          where lost_stolen_police_report_required is true it is dispensed only when the patient states the police report number, which is recorded verbatim.
        replaced_by: >-
          A lost_or_stolen_replacement refill is dispensed only when the patient states the police report number, which is recorded verbatim on the replacement, wherever the class's lost_stolen_police_report_required is true and also, in any class, wherever the replacement carries 30 or more days of supply.
    trigger: on_request
    subject: [rx_refill]
    computes: days_supply_dispensed
    target_tool: record_theft_replacement_refill_fbe8d6a8
    params:
      restraint_repeat_days: 7
      restraint_once_days: 3
      plan_bridge_established_days: 3
      plan_bridge_new_days: 1
      renewal_last_days: 5
      renewal_two_days: 2
      courier_handover_days: 2
      store_collection_days: 1
    rule: >-
      This rule settles the theft replacement days supply, the days supply of a refill with fill_reason
      lost_or_stolen_replacement dispensed before the refill-eligible date because the patient's medication was lost
      or stolen; every condition of rx_evt_early_fill_exceptions, rx_evt_refill_authorization and
      rx_evt_refill_timing continues to apply except the police-report sentence replaced here, and the replacement
      consumes one refill. A lost_or_stolen_replacement refill is dispensed only when the patient states the police
      report number, which is recorded verbatim on the replacement, wherever the class's
      lost_stolen_police_report_required is true and also, in any class, wherever the replacement carries 30 or more
      days of supply. A lost-or-stolen replacement refill is not dispensed until the fill it replaces carries no open
      owed balance, its owed units having been completed or cancelled on the ledger. The theft replacement days supply
      is fixed only after every confirmed mislabeled-directions report on the prescription is matched by a corrected
      remake on the ledger. The replacement never brings back owed units that were cancelled: a cancelled balance
      stays undispensed. The fill replaced is the prescription's most recent refill, and the prescribed daily units
      are the prescription's quantity_prescribed divided by its days_supply. The theft replacement days supply is the
      days the replaced refill still had to run, being its days_supply_dispensed less the calendar days from its
      dispensing date, as day 0, to today, never below zero; the units of the most recent corrected remake on the
      prescription, when it was dispensed on or after the replaced refill's dispensing date, are medication the
      patient holds, and they are taken off after dividing them by the prescribed daily units; the result is never
      below zero and is taken down to whole days. The theft replacement lost days are counted from the pickup when the
      replaced refill was picked up on a later day than it was dispensed, being its days_supply_dispensed less the
      calendar days from that pickup date to today, never below zero; when the replaced refill was never picked up its
      whole days_supply_dispensed counts; otherwise they are counted from the dispensing date as stated above. The
      theft replacement restraint counts the refills on the prescription in the last 12 months whose fill_reason is
      vacation_override, lost_or_stolen_replacement or dosage_change: two or more take off restraint_repeat_days days,
      exactly one takes off restraint_once_days days, and none takes off nothing; the lost days after the restraint are
      never below zero. The theft replacement plan bridge looks at the patient's active prescription coverage and its
      paid claims: a plan allowing at least one lost-or-stolen override a plan year that has paid three or more claims
      for the prescription in the last 12 months adds plan_bridge_established_days days, such a plan with one or two
      paid claims for it adds plan_bridge_new_days days, and any other case adds nothing. The theft replacement renewal
      bridge looks at the refills left on the prescription, being refills_authorized less the refills used by its
      refills plus the refills restored by returns to stock: exactly one refill left adds renewal_last_days days,
      exactly two add renewal_two_days days, and any other number adds nothing. The theft replacement handover buffer
      looks at the patient's delivery plan: an active plan whose carrier may deliver controlled substances adds
      courier_handover_days days for the signed handover, an active plan whose carrier may not adds
      store_collection_days days for collection at the store, and no active delivery plan adds nothing. The theft
      replacement days supply is then the lost days less the restraint, never below zero, plus the plan bridge, the
      renewal bridge and the handover buffer, less the remake days, the total never below zero and taken down to whole
      days.
    prerequisite:
      - problem: rx_ext_label_error_remake_units
        kind: value_input
        gate: remake_on_hand_days
        form: state
        policy_source: >-
          The theft replacement days supply is fixed only after every confirmed mislabeled-directions report on the prescription is matched by a corrected remake on the ledger.
        condition: >-
          For every wrong_directions_label report on the prescription whose review_outcome is confirmed, the fill
          ledger holds a remake entry whose error_report_id names that report.
        resolved_by: dispense_label_error_remake_88d3ae78
        effect: >-
          Once the relabel remake is booked on or after the replaced refill's dispensing date, remake_on_hand_days rises
          from zero to the remake units divided by the prescribed daily units, and the theft replacement days supply is
          reduced by them.
      - problem: rx_ext_controlled_balance_decline_credit
        kind: state_gate
        gate: rx_fills.source_fill_id
        form: state
        policy_source: >-
          A lost-or-stolen replacement refill is not dispensed until the fill it replaces carries no open owed balance, its owed units having been completed or cancelled on the ledger.
        condition: >-
          The owed-balance entry booked for the replaced refill is named as source by a balance completion or balance
          cancellation entry.
        resolved_by: decline_controlled_owed_balance_a6435942
        effect: >-
          Once the controlled owed balance of the replaced refill is cancelled, no owed balance stays open on the
          replaced fill and the replacement refill may be dispensed; the cancelled units are not added back.
    cross_category:
      - category: coverage
        as: history
        reads: [status, lost_stolen_override_per_plan_year, coverage_claims.event_type, coverage_claims.prescription_id]
        note: The active plan's lost-or-stolen allowance and its paid claims for the prescription decide the plan bridge.
      - category: delivery
        as: branch
        reads: [status, controlled_substance_delivery_allowed]
        note: The active delivery plan and whether its carrier may deliver controlled substances decide the handover buffer.
    compute:
      - daily_units: "F('quantity_prescribed') / F('days_supply')"
      - replaced_fill: "LATEST('rx_fills', 'fill_id', event_type='rx_refill')"
      - replaced_date: "LATEST('rx_fills', 'event_date', event_type='rx_refill')"
      - replaced_days: "LATEST('rx_fills', 'days_supply_dispensed', event_type='rx_refill')"
      - replaced_pickup: "LATEST('rx_fills', 'event_date', event_type='rx_pickup', source_fill_id=replaced_fill) or ''"
      - lost_days: "MX(0, replaced_days - DAYS(replaced_pickup, NOW)) if replaced_pickup > replaced_date else (replaced_days if replaced_pickup < replaced_date else MX(0, replaced_days - DAYS(replaced_date, NOW)))"
      - early_refills_12m: "COUNT('rx_fills', within_months=12, event_type='rx_refill', fill_reason='vacation_override') + COUNT('rx_fills', within_months=12, event_type='rx_refill', fill_reason='lost_or_stolen_replacement') + COUNT('rx_fills', within_months=12, event_type='rx_refill', fill_reason='dosage_change')"
      - restraint_days: "K('restraint_repeat_days') if early_refills_12m >= 2 else (K('restraint_once_days') if early_refills_12m == 1 else 0)"
      - plan_lost_allowance: "CPARAM('coverage', 'lost_stolen_override_per_plan_year', status='active')"
      - plan_paid_claims: "XCOUNT('coverage', 'coverage_claims', within_months=12, event_type='coverage_claim_paid', prescription_id=HID)"
      - plan_bridge: "K('plan_bridge_established_days') if ((plan_lost_allowance or 0) >= 1 and plan_paid_claims >= 3) else (K('plan_bridge_new_days') if ((plan_lost_allowance or 0) >= 1 and plan_paid_claims >= 1) else 0)"
      - refills_left: "F('refills_authorized') - SUM('rx_fills', 'refills_used', event_type='rx_refill') + SUM('rx_fills', 'refills_restored', event_type='rx_return_to_stock')"
      - renewal_days: "K('renewal_last_days') if refills_left == 1 else (K('renewal_two_days') if refills_left == 2 else 0)"
      - delivery_controlled_ok: "CPARAM('delivery', 'controlled_substance_delivery_allowed', status='active')"
      - handover_days: "K('courier_handover_days') if (EXISTS('delivery', status='active') and delivery_controlled_ok == True) else (K('store_collection_days') if EXISTS('delivery', status='active') else 0)"
      - latest_remake_date: "LATEST('rx_fills', 'event_date', event_type='rx_error_remake') or ''"
      - remake_units: "(LATEST('rx_fills', 'quantity_dispensed', event_type='rx_error_remake') or 0) if latest_remake_date >= replaced_date else 0"
      - remake_on_hand_days: "remake_units / daily_units"
      - result: "int(MX(0, MX(0, lost_days - restraint_days) + plan_bridge + renewal_days + handover_days - remake_on_hand_days))"
    compute_basis:
      daily_units: "the prescribed daily units are the prescription's quantity_prescribed divided by its days_supply"
      replaced_fill: "The fill replaced is the prescription's most recent refill"
      replaced_date: "less the calendar days from its dispensing date, as day 0, to today, never below zero"
      replaced_days: "The theft replacement days supply is the days the replaced refill still had to run, being its days_supply_dispensed less the calendar days from its dispensing date, as day 0, to today, never below zero"
      replaced_pickup: "when the replaced refill was picked up on a later day than it was dispensed"
      lost_days: "The theft replacement lost days are counted from the pickup when the replaced refill was picked up on a later day than it was dispensed, being its days_supply_dispensed less the calendar days from that pickup date to today, never below zero; when the replaced refill was never picked up its whole days_supply_dispensed counts; otherwise they are counted from the dispensing date as stated above."
      early_refills_12m: "The theft replacement restraint counts the refills on the prescription in the last 12 months whose fill_reason is vacation_override, lost_or_stolen_replacement or dosage_change"
      restraint_days: "two or more take off restraint_repeat_days days, exactly one takes off restraint_once_days days, and none takes off nothing; the lost days after the restraint are never below zero."
      plan_lost_allowance: "a plan allowing at least one lost-or-stolen override a plan year"
      plan_paid_claims: "that has paid three or more claims for the prescription in the last 12 months"
      plan_bridge: "a plan allowing at least one lost-or-stolen override a plan year that has paid three or more claims for the prescription in the last 12 months adds plan_bridge_established_days days, such a plan with one or two paid claims for it adds plan_bridge_new_days days, and any other case adds nothing."
      refills_left: "being refills_authorized less the refills used by its refills plus the refills restored by returns to stock"
      renewal_days: "exactly one refill left adds renewal_last_days days, exactly two add renewal_two_days days, and any other number adds nothing."
      delivery_controlled_ok: "an active plan whose carrier may deliver controlled substances"
      handover_days: "an active plan whose carrier may deliver controlled substances adds courier_handover_days days for the signed handover, an active plan whose carrier may not adds store_collection_days days for collection at the store, and no active delivery plan adds nothing."
      latest_remake_date: "when it was dispensed on or after the replaced refill's dispensing date"
      remake_units: "the units of the most recent corrected remake on the prescription, when it was dispensed on or after the replaced refill's dispensing date, are medication the patient holds"
      remake_on_hand_days: "they are taken off after dividing them by the prescribed daily units"
      result: "The theft replacement days supply is then the lost days less the restraint, never below zero, plus the plan bridge, the renewal bridge and the handover buffer, less the remake days, the total never below zero and taken down to whole days."
    factors:
      - id: lost_days_anchor
        effect: method
        decides: lost_days
        bindings: [replaced_pickup, lost_days]
        ladder:
          - when: "the replaced refill was picked up on a later day than it was dispensed"
            method: "its days_supply_dispensed less the calendar days from the pickup date to today, never below zero"
          - when: "the replaced refill was never picked up"
            method: "its whole days_supply_dispensed counts"
          - when: "otherwise"
            method: "its days_supply_dispensed less the calendar days from the dispensing date to today, never below zero"
        baseline:
          lost_days: "MX(0, replaced_days - DAYS(replaced_date, NOW))"
        evidence: [history, date]
        cross_difficulty: null
      - id: early_refill_restraint
        effect: parameter
        decides: restraint_days
        bindings: [early_refills_12m, restraint_days]
        ladder:
          - when: "two or more vacation_override, lost_or_stolen_replacement or dosage_change refills on the prescription in the last 12 months"
            value: "K('restraint_repeat_days')"
          - when: "exactly one such refill in the last 12 months"
            value: "K('restraint_once_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          restraint_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: plan_bridge
        effect: parameter
        decides: plan_bridge
        bindings: [plan_lost_allowance, plan_paid_claims, plan_bridge]
        ladder:
          - when: "the active plan allows at least one lost-or-stolen override a plan year and has paid three or more claims for the prescription in the last 12 months"
            value: "K('plan_bridge_established_days')"
          - when: "the active plan allows at least one lost-or-stolen override a plan year and has paid one or two claims for the prescription in the last 12 months"
            value: "K('plan_bridge_new_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          plan_bridge: "0"
        evidence: [cross_category, history]
        cross_difficulty: coverage
      - id: renewal_bridge
        effect: parameter
        decides: renewal_days
        bindings: [refills_left, renewal_days]
        ladder:
          - when: "exactly one refill left on the prescription"
            value: "K('renewal_last_days')"
          - when: "exactly two refills left"
            value: "K('renewal_two_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          renewal_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: handover_buffer
        effect: parameter
        decides: handover_days
        bindings: [delivery_controlled_ok, handover_days]
        ladder:
          - when: "the patient holds an active delivery plan whose carrier may deliver controlled substances"
            value: "K('courier_handover_days')"
          - when: "the patient holds an active delivery plan whose carrier may not deliver controlled substances"
            value: "K('store_collection_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          handover_days: "0"
        evidence: [cross_category]
        cross_difficulty: delivery
    baseline:
      rule: >-
        The fill replaced is the prescription's most recent refill, and the prescribed daily units are the
        prescription's quantity_prescribed divided by its days_supply. The theft replacement days supply is the days the
        replaced refill still had to run, being its days_supply_dispensed less the calendar days from its dispensing
        date, as day 0, to today, never below zero; the units of the most recent corrected remake on the prescription,
        when it was dispensed on or after the replaced refill's dispensing date, are medication the patient holds, and
        they are taken off after dividing them by the prescribed daily units; the result is never below zero and is
        taken down to whole days.
      params: []
    inputs:
      history:
        - {table: rx_fills, aggregate: latest, field: days_supply_dispensed, filters: {event_type: rx_refill}}
        - {table: rx_fills, aggregate: count, field: fill_id, within_months: 12, filters: {event_type: rx_refill, fill_reason: vacation_override}}
        - {table: rx_fills, aggregate: sum, field: refills_used, filters: {event_type: rx_refill}}
        - {table: rx_fills, aggregate: latest, field: quantity_dispensed, filters: {event_type: rx_error_remake}}
        - {category: coverage, table: coverage_claims, aggregate: count, field: claim_id, within_months: 12, filters: {event_type: coverage_claim_paid}}
      cross_category: [coverage, delivery]
  - id: rx_ext_controlled_balance_decline_credit
    base_policy_refs: [rx_evt_partial_fill, rx_evt_dispensing_error]
    overwrite:
      - base_policy: rx_evt_dispensing_error
        superseded_clause: >-
          a fill that was dispensed correctly is never taken back or refunded, whatever the reason the patient gives.
        replaced_by: >-
          Except for this credit, a controlled fill that was dispensed correctly is never taken back or refunded, whatever the reason the patient gives.
    trigger: on_request
    subject: [rx_balance_cancelled]
    computes: refund_usd
    target_tool: decline_controlled_owed_balance_a6435942
    params:
      week_days: 7
      controlled_block_days: 30
      hold_long_days: 7
      hold_long_usd: 1.50
      hold_short_usd: 0.75
      late_rebill_usd: 0.75
      rebill_usd: 0.25
      repeat_three_usd: 2.00
      repeat_two_usd: 1.00
      history_long_usd: 0.25
      history_mid_usd: 0.10
      count_confirmed_usd: 1.00
      count_pending_usd: 0.50
    rule: >-
      This rule settles the controlled decline credit, the amount returned by the original payment method when the
      patient declines the open owed balance of a prescription in the Schedule V Controlled Prescription, Schedule
      III-IV Controlled Prescription or Schedule II Controlled Prescription class; the balance itself is cancelled for
      its full owed units exactly as rx_evt_partial_fill provides, a cancelled Schedule II balance staying void, the
      cancelled units are never dispensed afterwards, and the credit is recorded on the cancellation entry. The
      patient pay of a controlled short fill covers the full prescribed quantity, so the part of it that paid for units
      that will now never be dispensed is credited. Except for this credit, a controlled fill that was dispensed
      correctly is never taken back or refunded, whatever the reason the patient gives. The controlled short fill is
      the fill named by the prescription's most recent owed-balance entry, and the owed units are the units that entry
      booked. The controlled decline credit is the controlled short fill's patient pay multiplied by the owed units and
      divided by the controlled short fill's units dispensed plus the owed units, rounded to the nearest cent. The
      controlled unpaid value is worked out by one of three methods: when the controlled short fill was billed to
      insurance and the patient's active coverage is a Commercial Copay Plan, whose flat copay is reset by whole weeks
      of therapy, it is the patient pay multiplied by week_days for every whole week of therapy in the owed units, the
      owed units being turned into days at the prescription's days_supply per quantity_prescribed, and divided by the
      prescription's days_supply; when the controlled short fill was settled under a discount program and the patient
      holds an active Kestrel Rx Savings Club Individual or Kestrel Rx Savings Club Family membership, it is the patient
      pay less that membership's value-list 30-day price for every started controlled_block_days days of the short
      fill's days_supply_dispensed; otherwise it is the patient pay multiplied by the owed units and divided by the
      units dispensed plus the owed units. The controlled count hold counts the calendar days from the controlled short
      fill's dispensing date, as day 0, to today: hold_long_days or more days keep hold_long_usd, one day up to fewer
      than hold_long_days days keep hold_short_usd, and a decline on the dispensing date keeps nothing. The controlled
      rebill amount looks at how the plan's claim for the controlled short fill is corrected: an insurance-billed short
      fill declined more than the active plan's claim_reversal_deadline_days after its dispensing date keeps
      late_rebill_usd, an insurance-billed short fill declined within that many days keeps rebill_usd, and any other
      short fill keeps nothing. The controlled repeat amount counts the owed-balance entries booked on the prescription
      in the last 12 months: three or more add repeat_three_usd, exactly two add repeat_two_usd, and one adds nothing.
      The controlled history amount counts the original fills and refills dispensed on the prescription in the last 12
      months: four or more add history_long_usd, two or three add history_mid_usd, and fewer add nothing. The
      controlled count amount looks at the dispensing-error reports that name the controlled short fill: a confirmed
      report adds count_confirmed_usd, a report still pending_review with none confirmed adds count_pending_usd, and no
      such report adds nothing. The controlled decline credit is then the controlled unpaid value less the controlled
      count hold and the controlled rebill amount, never below zero, plus the controlled repeat, history and count
      amounts, the total rounded to the nearest cent once at the end.
    prerequisite: []
    cross_category:
      - category: coverage
        as: branch
        reads: [status, variant_name, claim_reversal_deadline_days]
        note: A Commercial Copay Plan on file selects the whole-week method, and the active plan's claim reversal deadline decides the rebill amount.
      - category: copay
        as: branch
        reads: [status, variant_name, value_generic_30_day_price_usd]
        note: An active Savings Club membership selects the value-list method and supplies its 30-day list price.
    compute:
      - c_short_fill: "LATEST('rx_fills', 'source_fill_id', event_type='rx_partial_fill')"
      - c_owed_units: "LATEST('rx_fills', 'owed_units', event_type='rx_partial_fill')"
      - c_pay: "LATEST('rx_fills', 'patient_pay_usd', fill_id=c_short_fill)"
      - c_units: "LATEST('rx_fills', 'quantity_dispensed', fill_id=c_short_fill)"
      - c_days: "LATEST('rx_fills', 'days_supply_dispensed', fill_id=c_short_fill)"
      - c_date: "LATEST('rx_fills', 'event_date', fill_id=c_short_fill)"
      - c_basis: "LATEST('rx_fills', 'payment_basis', fill_id=c_short_fill)"
      - copay_plan: "EXISTS('coverage', status='active', variant_name='Commercial Copay Plan')"
      - c_club: "EXISTS('copay', status='active', variant_name='Kestrel Rx Savings Club Individual') or EXISTS('copay', status='active', variant_name='Kestrel Rx Savings Club Family')"
      - c_club_price: "CPARAM('copay', 'value_generic_30_day_price_usd', status='active', variant_name='Kestrel Rx Savings Club Individual') or CPARAM('copay', 'value_generic_30_day_price_usd', status='active', variant_name='Kestrel Rx Savings Club Family') or 0"
      - c_unpaid_value: "(c_pay * K('week_days') * ((c_owed_units * F('days_supply') / F('quantity_prescribed')) // K('week_days')) / F('days_supply')) if (c_basis == 'insurance' and copay_plan) else ((c_pay - c_club_price * (-(-c_days // K('controlled_block_days')))) if (c_basis == 'discount_program' and c_club) else (c_pay * c_owed_units / (c_units + c_owed_units)))"
      - c_days_standing: "DAYS(c_date, NOW)"
      - count_hold: "K('hold_long_usd') if c_days_standing >= K('hold_long_days') else (K('hold_short_usd') if c_days_standing >= 1 else 0)"
      - reversal_deadline: "CPARAM('coverage', 'claim_reversal_deadline_days', status='active') or 0"
      - rebill_amount: "K('late_rebill_usd') if (c_basis == 'insurance' and c_days_standing > reversal_deadline) else (K('rebill_usd') if (c_basis == 'insurance' and c_days_standing <= reversal_deadline) else 0)"
      - c_short_fills_12m: "COUNT('rx_fills', within_months=12, event_type='rx_partial_fill')"
      - repeat_amount: "K('repeat_three_usd') if c_short_fills_12m >= 3 else (K('repeat_two_usd') if c_short_fills_12m == 2 else 0)"
      - c_fills_12m: "COUNT('rx_fills', within_months=12, event_type='rx_refill') + COUNT('rx_fills', within_months=12, event_type='rx_new_fill')"
      - history_amount: "K('history_long_usd') if c_fills_12m >= 4 else (K('history_mid_usd') if c_fills_12m >= 2 else 0)"
      - c_confirmed_reports: "COUNT('rx_error_reports', date_field='reported_date', fill_id=c_short_fill, review_outcome='confirmed')"
      - c_pending_reports: "COUNT('rx_error_reports', date_field='reported_date', fill_id=c_short_fill, review_outcome='pending_review')"
      - count_amount: "K('count_confirmed_usd') if c_confirmed_reports >= 1 else (K('count_pending_usd') if c_pending_reports >= 1 else 0)"
      - result: "RND(MX(0, c_unpaid_value - count_hold - rebill_amount) + repeat_amount + history_amount + count_amount, 2)"
    compute_basis:
      c_short_fill: "The controlled short fill is the fill named by the prescription's most recent owed-balance entry, and the owed units are the units that entry booked."
      c_owed_units: "the owed units are the units that entry booked"
      c_pay: "The controlled decline credit is the controlled short fill's patient pay multiplied by the owed units and divided by the controlled short fill's units dispensed plus the owed units, rounded to the nearest cent."
      c_units: "divided by the controlled short fill's units dispensed plus the owed units"
      c_days: "for every started controlled_block_days days of the short fill's days_supply_dispensed"
      c_date: "The controlled count hold counts the calendar days from the controlled short fill's dispensing date, as day 0, to today"
      c_basis: "when the controlled short fill was billed to insurance"
      copay_plan: "the patient's active coverage is a Commercial Copay Plan"
      c_club: "the patient holds an active Kestrel Rx Savings Club Individual or Kestrel Rx Savings Club Family membership"
      c_club_price: "that membership's value-list 30-day price"
      c_unpaid_value: "when the controlled short fill was billed to insurance and the patient's active coverage is a Commercial Copay Plan, whose flat copay is reset by whole weeks of therapy, it is the patient pay multiplied by week_days for every whole week of therapy in the owed units, the owed units being turned into days at the prescription's days_supply per quantity_prescribed, and divided by the prescription's days_supply; when the controlled short fill was settled under a discount program and the patient holds an active Kestrel Rx Savings Club Individual or Kestrel Rx Savings Club Family membership, it is the patient pay less that membership's value-list 30-day price for every started controlled_block_days days of the short fill's days_supply_dispensed; otherwise it is the patient pay multiplied by the owed units and divided by the units dispensed plus the owed units."
      c_days_standing: "The controlled count hold counts the calendar days from the controlled short fill's dispensing date, as day 0, to today"
      count_hold: "hold_long_days or more days keep hold_long_usd, one day up to fewer than hold_long_days days keep hold_short_usd, and a decline on the dispensing date keeps nothing."
      reversal_deadline: "the active plan's claim_reversal_deadline_days"
      rebill_amount: "an insurance-billed short fill declined more than the active plan's claim_reversal_deadline_days after its dispensing date keeps late_rebill_usd, an insurance-billed short fill declined within that many days keeps rebill_usd, and any other short fill keeps nothing."
      c_short_fills_12m: "The controlled repeat amount counts the owed-balance entries booked on the prescription in the last 12 months"
      repeat_amount: "three or more add repeat_three_usd, exactly two add repeat_two_usd, and one adds nothing."
      c_fills_12m: "The controlled history amount counts the original fills and refills dispensed on the prescription in the last 12 months"
      history_amount: "four or more add history_long_usd, two or three add history_mid_usd, and fewer add nothing."
      c_confirmed_reports: "The controlled count amount looks at the dispensing-error reports that name the controlled short fill"
      c_pending_reports: "a report still pending_review with none confirmed adds count_pending_usd"
      count_amount: "a confirmed report adds count_confirmed_usd, a report still pending_review with none confirmed adds count_pending_usd, and no such report adds nothing."
      result: "The controlled decline credit is then the controlled unpaid value less the controlled count hold and the controlled rebill amount, never below zero, plus the controlled repeat, history and count amounts, the total rounded to the nearest cent once at the end."
    factors:
      - id: controlled_unpaid_method
        effect: method
        decides: c_unpaid_value
        bindings: [copay_plan, c_club, c_club_price, c_unpaid_value]
        ladder:
          - when: "the controlled short fill was billed to insurance and the active coverage is a Commercial Copay Plan"
            method: "the patient pay times week_days for every whole week of therapy in the owed units, divided by the written days supply"
          - when: "the controlled short fill was settled under a discount program and the patient holds an active Savings Club membership"
            method: "the patient pay less the club's value-list 30-day price for every started controlled_block_days days dispensed"
          - when: "otherwise"
            method: "the patient pay times the owed units divided by the units dispensed plus the owed units"
        baseline:
          c_unpaid_value: "c_pay * c_owed_units / (c_units + c_owed_units)"
        evidence: [history, cross_category]
        cross_difficulty: coverage
      - id: controlled_count_hold
        effect: parameter
        decides: count_hold
        bindings: [c_days_standing, count_hold]
        ladder:
          - when: "hold_long_days or more calendar days from the controlled short fill's dispensing date to today"
            value: "K('hold_long_usd')"
          - when: "one day up to fewer than hold_long_days days"
            value: "K('hold_short_usd')"
          - when: "otherwise (declined on the dispensing date)"
            value: "0"
        baseline:
          count_hold: "0"
        evidence: [date]
        cross_difficulty: null
      - id: controlled_rebill_amount
        effect: parameter
        decides: rebill_amount
        bindings: [reversal_deadline, rebill_amount]
        ladder:
          - when: "the controlled short fill was billed to insurance and is declined more than the active plan's claim_reversal_deadline_days after its dispensing date"
            value: "K('late_rebill_usd')"
          - when: "the controlled short fill was billed to insurance and is declined within that many days"
            value: "K('rebill_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          rebill_amount: "0"
        evidence: [history, cross_category, date]
        cross_difficulty: coverage
      - id: controlled_repeat_amount
        effect: parameter
        decides: repeat_amount
        bindings: [c_short_fills_12m, repeat_amount]
        ladder:
          - when: "three or more owed-balance entries on the controlled prescription in the last 12 months"
            value: "K('repeat_three_usd')"
          - when: "exactly two such entries"
            value: "K('repeat_two_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          repeat_amount: "0"
        evidence: [history]
        cross_difficulty: null
      - id: controlled_history_amount
        effect: parameter
        decides: history_amount
        bindings: [c_fills_12m, history_amount]
        ladder:
          - when: "four or more original fills and refills of the controlled prescription in the last 12 months"
            value: "K('history_long_usd')"
          - when: "two or three of them"
            value: "K('history_mid_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          history_amount: "0"
        evidence: [history]
        cross_difficulty: null
      - id: controlled_count_amount
        effect: parameter
        decides: count_amount
        bindings: [c_confirmed_reports, c_pending_reports, count_amount]
        ladder:
          - when: "a confirmed dispensing-error report names the controlled short fill"
            value: "K('count_confirmed_usd')"
          - when: "a report naming it is still pending_review and none is confirmed"
            value: "K('count_pending_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          count_amount: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The controlled decline credit is the controlled short fill's patient pay multiplied by the owed units and divided
        by the controlled short fill's units dispensed plus the owed units, rounded to the nearest cent.
      params: []
    inputs:
      history:
        - {table: rx_fills, aggregate: latest, field: source_fill_id, filters: {event_type: rx_partial_fill}}
        - {table: rx_fills, aggregate: count, field: fill_id, within_months: 12, filters: {event_type: rx_partial_fill}}
        - {table: rx_fills, aggregate: count, field: fill_id, within_months: 12, filters: {event_type: rx_refill}}
        - {table: rx_error_reports, aggregate: count, field: error_report_id, filters: {review_outcome: pending_review}}
      cross_category: [coverage, copay]
  - id: rx_ext_label_error_remake_units
    base_policy_refs: [rx_evt_dispensing_error]
    overwrite: []
    trigger: state_due
    subject: [rx_error_remake]
    computes: quantity_dispensed
    target_tool: dispense_label_error_remake_88d3ae78
    params:
      stale_report_days: 14
      long_wait_days: 7
      long_wait_add_days: 2
      short_wait_add_days: 1
      relabel_no_refill_days: 2
      relabel_last_refill_days: 1
      relabel_major_short_days: 2
      relabel_minor_short_days: 1
    rule: >-
      This rule settles the relabel remake quantity, the units of correctly labelled medication dispensed at no charge
      on a remake that answers a confirmed wrong_directions_label dispensing-error report; it refines the remake of
      rx_evt_dispensing_error and changes none of its conditions. The remake answers the most recently reported
      wrong_directions_label report on the prescription whose review_outcome is confirmed, and the fill that report
      names is the mislabeled fill. The relabel remake quantity is the quantity dispensed on the mislabeled fill. The
      prescribed daily units are the prescription's quantity_prescribed divided by its days_supply, and the mislabeled
      pickup date is the event date of the pickup entry that names the mislabeled fill, spans being counted in calendar
      days from their first date as day 0. The relabel units still held are settled as follows: when the report was
      made more than stale_report_days days after the mislabeled pickup date, they are the quantity dispensed on the
      mislabeled fill less the prescribed daily units multiplied by the days from that pickup date to the report date,
      never below zero; when the report was made one day up to stale_report_days days after that pickup date, they are
      the quantity dispensed less the prescribed daily units multiplied by the days from that pickup date to the review
      date, never below zero; otherwise they are the quantity dispensed on the mislabeled fill. The relabel waiting
      allowance counts the calendar days from the review date of the answered report to today: long_wait_days or more
      days give long_wait_add_days days, one day up to fewer than long_wait_days days gives short_wait_add_days days,
      and a remake on the review date gives no days. The relabel continuity allowance looks at the refills left on the
      prescription, being refills_authorized less the refills used by its refills plus the refills restored by returns
      to stock: no refill left gives relabel_no_refill_days days, exactly one refill left gives
      relabel_last_refill_days days, and more refills left give no days. The relabel short-fill allowance looks at the
      owed-balance entry booked for the mislabeled fill: owed units booked at least equal to the units dispensed on it
      give relabel_major_short_days days, fewer owed units booked but more than zero give relabel_minor_short_days
      days, and a mislabeled fill dispensed complete gives no days. The relabel remake quantity is then the relabel
      units still held plus the prescribed daily units multiplied by the sum of the relabel waiting, continuity and
      short-fill allowances, the whole taken down to a whole number of units.
    prerequisite: []
    cross_category: []
    compute:
      - label_fill: "LATEST('rx_error_reports', 'fill_id', date_field='reported_date', review_outcome='confirmed', error_type='wrong_directions_label')"
      - label_reported: "LATEST('rx_error_reports', 'reported_date', date_field='reported_date', review_outcome='confirmed', error_type='wrong_directions_label')"
      - label_reviewed: "LATEST('rx_error_reports', 'reviewed_date', date_field='reported_date', review_outcome='confirmed', error_type='wrong_directions_label')"
      - label_units: "LATEST('rx_fills', 'quantity_dispensed', fill_id=label_fill)"
      - label_pickup: "LATEST('rx_fills', 'event_date', event_type='rx_pickup', source_fill_id=label_fill)"
      - label_daily: "F('quantity_prescribed') / F('days_supply')"
      - held_units: "MX(0, label_units - label_daily * DAYS(label_pickup, label_reported)) if DAYS(label_pickup, label_reported) > K('stale_report_days') else (MX(0, label_units - label_daily * DAYS(label_pickup, label_reviewed)) if DAYS(label_pickup, label_reported) >= 1 else label_units)"
      - label_wait: "DAYS(label_reviewed, NOW)"
      - wait_days: "K('long_wait_add_days') if label_wait >= K('long_wait_days') else (K('short_wait_add_days') if label_wait >= 1 else 0)"
      - label_refills_left: "F('refills_authorized') - SUM('rx_fills', 'refills_used', event_type='rx_refill') + SUM('rx_fills', 'refills_restored', event_type='rx_return_to_stock')"
      - relabel_continuity_days: "K('relabel_no_refill_days') if label_refills_left <= 0 else (K('relabel_last_refill_days') if label_refills_left == 1 else 0)"
      - label_owed_booked: "LATEST('rx_fills', 'owed_units', event_type='rx_partial_fill', source_fill_id=label_fill) or 0"
      - relabel_short_days: "K('relabel_major_short_days') if label_owed_booked >= label_units else (K('relabel_minor_short_days') if label_owed_booked > 0 else 0)"
      - result: "int(held_units + label_daily * (wait_days + relabel_continuity_days + relabel_short_days))"
    compute_basis:
      label_fill: "The remake answers the most recently reported wrong_directions_label report on the prescription whose review_outcome is confirmed, and the fill that report names is the mislabeled fill."
      label_reported: "when the report was made more than stale_report_days days after the mislabeled pickup date"
      label_reviewed: "the days from that pickup date to the review date"
      label_units: "The relabel remake quantity is the quantity dispensed on the mislabeled fill."
      label_pickup: "the mislabeled pickup date is the event date of the pickup entry that names the mislabeled fill, spans being counted in calendar days from their first date as day 0"
      label_daily: "The prescribed daily units are the prescription's quantity_prescribed divided by its days_supply"
      held_units: "when the report was made more than stale_report_days days after the mislabeled pickup date, they are the quantity dispensed on the mislabeled fill less the prescribed daily units multiplied by the days from that pickup date to the report date, never below zero; when the report was made one day up to stale_report_days days after that pickup date, they are the quantity dispensed less the prescribed daily units multiplied by the days from that pickup date to the review date, never below zero; otherwise they are the quantity dispensed on the mislabeled fill."
      label_wait: "The relabel waiting allowance counts the calendar days from the review date of the answered report to today"
      wait_days: "long_wait_days or more days give long_wait_add_days days, one day up to fewer than long_wait_days days gives short_wait_add_days days, and a remake on the review date gives no days."
      label_refills_left: "being refills_authorized less the refills used by its refills plus the refills restored by returns to stock"
      relabel_continuity_days: "no refill left gives relabel_no_refill_days days, exactly one refill left gives relabel_last_refill_days days, and more refills left give no days."
      label_owed_booked: "The relabel short-fill allowance looks at the owed-balance entry booked for the mislabeled fill"
      relabel_short_days: "owed units booked at least equal to the units dispensed on it give relabel_major_short_days days, fewer owed units booked but more than zero give relabel_minor_short_days days, and a mislabeled fill dispensed complete gives no days."
      result: "The relabel remake quantity is then the relabel units still held plus the prescribed daily units multiplied by the sum of the relabel waiting, continuity and short-fill allowances, the whole taken down to a whole number of units."
    factors:
      - id: held_units_basis
        effect: method
        decides: held_units
        bindings: [held_units]
        ladder:
          - when: "the report was made more than stale_report_days days after the mislabeled pickup date"
            method: "the quantity dispensed less the prescribed daily units times the days from pickup to the report date, never below zero"
          - when: "the report was made one day up to stale_report_days days after the pickup date"
            method: "the quantity dispensed less the prescribed daily units times the days from pickup to the review date, never below zero"
          - when: "otherwise"
            method: "the quantity dispensed on the mislabeled fill"
        baseline:
          held_units: "label_units"
        evidence: [history, date]
        cross_difficulty: null
      - id: relabel_waiting_allowance
        effect: parameter
        decides: wait_days
        bindings: [label_wait, wait_days]
        ladder:
          - when: "long_wait_days or more calendar days from the review date to today"
            value: "K('long_wait_add_days')"
          - when: "one day up to fewer than long_wait_days days"
            value: "K('short_wait_add_days')"
          - when: "otherwise (remake on the review date)"
            value: "0"
        baseline:
          wait_days: "0"
        evidence: [date]
        cross_difficulty: null
      - id: relabel_continuity_allowance
        effect: parameter
        decides: relabel_continuity_days
        bindings: [label_refills_left, relabel_continuity_days]
        ladder:
          - when: "no refill left on the prescription"
            value: "K('relabel_no_refill_days')"
          - when: "exactly one refill left"
            value: "K('relabel_last_refill_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          relabel_continuity_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: relabel_short_fill_allowance
        effect: parameter
        decides: relabel_short_days
        bindings: [label_owed_booked, relabel_short_days]
        ladder:
          - when: "the owed units booked for the mislabeled fill are at least the units dispensed on it"
            value: "K('relabel_major_short_days')"
          - when: "owed units were booked for it but fewer than the units dispensed"
            value: "K('relabel_minor_short_days')"
          - when: "otherwise (the mislabeled fill was dispensed complete)"
            value: "0"
        baseline:
          relabel_short_days: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The relabel remake quantity is the quantity dispensed on the mislabeled fill.
      params: []
    inputs:
      history:
        - {table: rx_error_reports, aggregate: latest, field: fill_id, filters: {review_outcome: confirmed, error_type: wrong_directions_label}}
        - {table: rx_fills, aggregate: latest, field: owed_units, filters: {event_type: rx_partial_fill}}
        - {table: rx_fills, aggregate: sum, field: refills_used, filters: {event_type: rx_refill}}
      cross_category: []
