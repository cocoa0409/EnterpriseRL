# The blueprint of env_0022_medicaid_managed_care_organization. Output of the erl-scenario-blueprint skill.

name: env_0022_medicaid_managed_care_organization
company: Prairie Ridge Health Plan

background: |
  Prairie Ridge Health Plan is a nonprofit Medicaid managed care organization that holds a contract with the state Medicaid agency to arrange and pay for the health care of about 412,000 members across 38 urban and rural counties. Its member services center answers calls from members, parents and authorized representatives in English and Spanish, with interpreters for other languages, in a plain and patient tone. Every member holds a Medicaid Managed Care Membership in exactly one eligibility category assigned by the state: Prairie Ridge Expansion Adult, Prairie Ridge Family Care, Prairie Ridge CHIP Kids, Prairie Ridge Children's Medicaid, Prairie Ridge Pregnancy Care, Prairie Ridge ABD Care or Prairie Ridge Dual Complete. A membership opens from the state enrollment file, renews once a year through redetermination, and books every adjudicated medical claim with its member copay, every CHIP family premium bill, payment and waiver, and every renewal notice and ID card mailed. Each member is assigned a Primary Care Provider Assignment of one practice type — Standard Primary Care Provider, Pediatric Primary Care Provider, OB/GYN Primary Care Provider, Federally Qualified Health Center Home, Patient-Centered Medical Home Practice, Specialist Serving as PCP or Health Home Lead Provider — which records change requests, referrals, outreach and visits. Prior Authorization requests are held one by one in seven classes — Advanced Imaging Authorization, Outpatient Rehabilitation Therapy Authorization, Durable Medical Equipment Authorization, Home Health Services Authorization, Behavioral Health Intensive Services Authorization, Elective Inpatient and Surgical Authorization and Out-of-Network Services Authorization — each carrying a ledger of units granted, used and released. The Pharmacy Benefit is held as one of PrairieRx Dual Wrap, PrairieRx Expansion Adult, PrairieRx Adult, PrairieRx Children, PrairieRx Maternity, PrairieRx Complex Care or PrairieRx Long-Term Care, and books pharmacy fills and rejections, formulary exception and prior authorization requests, early refill overrides and a quarterly over-the-counter allowance. Non-Emergency Medical Transportation is held at one level of service — RideLink Transit Pass, RideLink Mileage Reimbursement, RideLink Ambulatory Sedan, RideLink Door-to-Door Assist, RideLink Wheelchair Van or RideLink Stretcher Van — and books trip legs, cancellations, no-shows, standing orders, value-added trip allotments and member reimbursement claims. Care Management episodes run in the tiers Healthy Living Support, Care Coordination Level 1, Care Coordination Level 2, Maternal Care Management, Complex Case Management, Health Home Services and LTSS Service Coordination, booking outreach, assessments, care plans, contacts and, for long-term services, personal care hours delivered under electronic visit verification. Appeals and Grievances are held as cases of the types Member Grievance, Quality of Care Grievance, Standard Appeal, Expedited Appeal, State Fair Hearing and External Medical Review, with their letters, evidence and any cost of services continued while a case is pending. Callers are mostly parents of enrolled children, working adults in the expansion group, pregnant and postpartum members, older and disabled members and their caregivers, and people who are also on Medicare. A typical caller holds one membership, one primary care assignment, one pharmacy plan and one transportation benefit at the same time, and often a care management episode, several authorizations and an open appeal as well. They bring months of history with them: claims with copays, premium bills paid or missed, renewal letters, pharmacy fills that were rejected at the counter, trips that ran late or were missed, and letters about decisions they want to understand or challenge.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: member_cost_sharing_and_renewal
    claim:
      categories: [plan]
      event_types: [plan_claim_adjusted, plan_cost_share_refund, plan_premium_paid, plan_premium_waived, plan_renewal_notice, plan_id_card_issue, plan_notice_preference_update, plan_reinstate]
    summary: >
      Members, parents of CHIP children and authorized representatives call about what their Prairie Ridge membership is costing them and whether it will continue: copays on explanation-of-benefits statements they believe are wrong, copays they paid after they think they reached their cap, CHIP premium bills that are past due, renewal letters, coverage that ended while they say they sent the renewal back, lost ID cards, where their notices are sent, and new addresses or incomes they want to report. The settings vary across the seven eligibility categories, the membership status (pending, active, renewal_due, reconsideration, suspended, terminated), the income on the state file and its changes, American Indian or Alaska Native status, an active LTSS Service Coordination care episode, and a history of claims, pharmacy fills, premium bills, payments, waivers, renewal notices and replacement cards. The governing rules sit on plan_memberships, plan_claims, plan_premiums and plan_notices together with rx_fills and care_enrollments: per-category copays and exemptions (plan_evt_copay), an aggregate cap computed per category cap period from household income that also counts pharmacy copays and refunds only the claims that crossed it once (plan_evt_cost_share_cap), adjustments that point back to one paid original claim inside its window (plan_evt_claim_adjustment), a premium ladder, oldest-month-first payment allocation, grace and continuous eligibility protection (plan_evt_premium, plan_continuous_eligibility), hardship and AI/AN waivers that exclude payment for the same month (plan_evt_premium_waiver), renewal notice timing and channels (plan_renewal_cycle, plan_notice_preferences), address and income reports forwarded to the state rather than applied (plan_change_reporting), reinstatement inside the reconsideration window (plan_reconsideration) and a rolling replacement limit for ID cards (plan_evt_id_card); in the domain, a claim is booked before any adjustment or refund of it, and a bill before its payment or waiver. Booking refunds, adjustments, payments, waivers, notices, cards and preference changes and recording change reports are agent service actions on a verified member, while a hardship statement is a fact only the parent or guardian can give and a plan change or voluntary disenrollment is the member's own request, recorded as a plan change request for the enrollment broker. Requests no policy decides, such as waiving a copay on a paid claim for a reason outside the listed exemptions, changing the eligibility category or income the state reported, or refunding a provider's own billing to the member, are handed off as POLICY_NOT_COVERED.

  - name: prior_authorization_services
    claim:
      categories: [auth]
      event_types: [auth_submit, auth_void, auth_withdraw, auth_provider_update, auth_extend, auth_expedite_request, auth_extension_request, auth_timeline_extension, auth_units_released, auth_notice]
    summary: >
      Members and caregivers call about prior authorizations: new members whose treatment was approved by their previous health plan, members waiting on a decision who say it is urgent, members moving therapy or equipment to another provider, members who no longer need an approved service, and members whose visits are running out. The settings vary across the seven authorization classes, the authorization status (submitted, pended_info, approved, denied, expired, voided, withdrawn), the member's age and plan coverage start date, review type, network status of the servicing provider, and a history of units granted, used and released, extensions, pends and notices across several authorizations for the same member. The governing rules sit on auth_authorizations, auth_units and auth_actions together with plan_memberships and customers: decision deadlines and one deadline extension taken before the deadline (auth_turnaround), expedite requests only on undecided requests (auth_expedited_review), per-class validity, unit caps and weekly frequency caps (auth_validity_units), annual unit limits counted across all of a member's authorizations of the same class and discipline with an under-21 exemption (auth_agg_annual_limit), extension counts, unit caps and a late-request grace counted from the end date (auth_extension), transition-of-care honoring within a window counted from the plan coverage start date (auth_transition_of_care), duplicate detection by service code and overlapping dates (auth_agg_duplicate_request), provider changes per class (auth_provider_change) and unit release on void (auth_void_withdraw); in the domain a request is received before it is decided and units are granted before they are used. Recording transition-of-care requests, expedite and extension requests, deadline extensions, provider changes and voids are agent service actions, while withdrawing an undecided request is the member's own decision and is carried out by the member. Requests no policy decides, such as asking the agent to approve or deny a request on medical grounds, to add units beyond a class cap without an extension, or to back-date an approval, are handed off as POLICY_NOT_COVERED.

  - name: pharmacy_coverage_and_exceptions
    claim:
      categories: [rx]
      event_types: [rx_exception_request, rx_refill_override, rx_emergency_supply, rx_lock_in_pharmacy_change, rx_lock_in_change_log, rx_otc_purchase, rx_fill_reversal]
    summary: >
      Members and caregivers call when a prescription was rejected at the pharmacy, when a drug is not on the formulary, when they need an early refill before a trip or after a lost or stolen supply, when they are locked in to one pharmacy and want to change it, and when they want to use their over-the-counter allowance. The settings vary across the seven pharmacy benefit plans and their link to the plan eligibility category or a nursing facility LTSS episode, coverage status (pending, active, restricted, terminated), Medicare Part D primacy for dual members, the member's fill history in the month and in the last year, pending or decided exception requests, prior overrides and lock-in changes, and the quarter's OTC balance and order count. The governing rules sit on rx_coverages, rx_fills, rx_exceptions and rx_otc_ledger together with plan_memberships and care_enrollments: per-plan copays and exempt classes that count toward the plan cap (rx_evt_copay), monthly fill caps by scope (rx_monthly_limit), early refill thresholds and per-drug override counts with a police report for controlled substances (rx_refill_timing), exception completeness, step therapy trials, one open request per drug and type, and approval durations (rx_exception_review), emergency supplies bridging a pending request (rx_emergency_supply_rule), lock-in rules and change limits (rx_lock_in), OTC loading, order limits and forfeiture (rx_otc_allowance), transition fills (rx_transition_fill), Part D primacy (rx_dual_wrap), opioid limits (rx_opioid_safety) and reversals within a window (rx_fill_reversal_rule); in the domain a rejection or a request precedes its decision and a load precedes spending. Starting an exception request, granting an override, recording a lock-in pharmacy change and booking an OTC order are agent service actions, while the police report number and the choice of a new lock-in pharmacy are facts the member states. Requests no policy decides, such as paying for a drug Part D covers for a dual member, approving an exception without the prescriber's statement, or refunding an OTC purchase to cash, are handed off as POLICY_NOT_COVERED.

  - name: medical_transportation_benefits
    claim:
      categories: [ride]
      event_types: [ride_trip_booked, ride_trip_cancelled, ride_standing_order_set, ride_transit_pass_issue, ride_mileage_approved, ride_mileage_denied]
    summary: >
      Members, parents and caregivers call to book rides to appointments, cancel rides, set up recurring rides for dialysis or treatment, ask for a transit pass, claim mileage, lodging or an alternative ride after a late pickup, and ask why their rides were suspended. The settings vary across the six levels of service, benefit status (pending_assessment, active, suspended, closed), assessment and physician certification dates, a wheelchair documented through a durable medical equipment authorization, the member's age and escorts, distances and destinations, the year's value-added trip balance, and a history of booked, completed, cancelled, late and no-show legs and earlier reimbursement claims. The governing rules sit on ride_benefits, ride_trips and ride_ledger together with plan_claims and auth_authorizations: level of service and reassessment (ride_level_of_service), booking channels, advance notice in business days, urgent and discharge trips and service hours (ride_booking_rules), no-show counting and suspension with exempt treatments (ride_no_show_policy), late pickups and alternative ride reimbursement (ride_late_pickup_policy), mileage at a per-mile rate with attendance proven by a paid claim, a filing window from the trip date and one claim per leg and type (ride_mileage_reimbursement), long-distance approval with lodging and meals (ride_long_distance), value-added allotments and their expiry (ride_value_added), standing orders (ride_standing_orders), monthly transit passes (ride_transit_pass) and escorts and pharmacy stops (ride_escorts_and_stops); in the domain a leg is booked before it is completed, cancelled or missed, and a claim is approved before it is paid. Booking, cancelling, setting up standing orders, issuing passes and approving or denying reimbursement claims are agent service actions, while the appointment date and time, the destination and the receipted amount are facts the member states. Requests no policy decides, such as a ride to a non-covered destination outside the value-added list, reimbursement for a ride the member arranged without a late pickup on record, or a level of service the assessment did not set, are handed off as POLICY_NOT_COVERED.

  - name: primary_care_assignment
    claim:
      categories: [pcp]
      event_types: [pcp_assign, pcp_end, pcp_change_log, pcp_location_update]
    summary: >
      Members and parents call to change their primary care provider, to find out when a change takes effect, to cancel a change they made, and to understand what happens when their doctor leaves the network, dismisses them, or no longer sees patients of their age. The settings vary across the seven practice types and their age, sex and care-enrollment prerequisites, assignment status (pending_effective, active, ended), how the current assignment was made, panel counts at the chosen provider, distance and county type, the plan membership's status and enrollment date, an active Complex Case Management or Health Home Services care episode, and a history of change requests, exit and dismissal notices within the last year. The governing rules sit on pcp_assignments and pcp_events together with plan_memberships, care_enrollments and customers: at most one active and one pending assignment with supersession of earlier pending changes (pcp_agg_multi_holding, pcp_agg_single_active), practice-type eligibility including the care enrollment prerequisite (pcp_practice_match), panel capacity with a family exception (pcp_panel_capacity), distance standards (pcp_distance_standard), a rolling limit on member-preference changes that exempts listed reasons (pcp_change_limit), the effective date set by the request day against the monthly cutoff or the next day for cause (pcp_change_effective_date), auto-assignment after the choice period (pcp_auto_assignment), provider exits and dismissals (pcp_provider_exit, pcp_dismissal) and access standards (pcp_access_standards); in the domain a change request is recorded with the new pending assignment, and the old assignment ends only when the new one takes effect. Recording the change request, creating the pending assignment, withdrawing a pending one and updating distance after a move are agent service actions, while the choice of provider and the reason for the change are the member's own statements. Requests no policy decides, such as assigning a provider outside the network, back-dating a change so a past visit counts, or overriding a full panel without the family exception, are handed off as POLICY_NOT_COVERED.
