- id: appeal_resolution_timeframe
  subject:
  - appeal_resolve
  - appeal_extend
  rule: >-
    A case is resolved within resolution_period in resolution_basis units of filed_date, and written notice
    is mailed within resolution_notice_business_days, with oral notice as well where oral_resolution_notice.
    The due date may be extended once by up to extension_days_max when the member asks or the plan shows
    the extension is in the member's interest, with written notice within extension_notice_days and notice
    of the right to grieve the extension. An extension is taken no later than extension_cutoff_days_after_due
    days after the case's current due date. The cutoff is counted in calendar days from the due date,
    so an extension on the due date itself still qualifies. A case already extended once is never extended
    again.
  eligibility:
  - id: extend_before_due
    applies_to:
    - appeal_extend
    kind: time
    condition: >-
      An extension is taken no later than extension_cutoff_days_after_due days after the case's current
      due date.
    evidence_fields:
    - appeal_cases.appeal_case_id
    - appeal_cases.due_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - appeal_cases.appeal_case_id
      action_bindings:
        appeal_cases.appeal_case_id: appeal_case_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the case's current due date
      anchor_source: appeal_cases.due_date
      relation: not_after
      duration_source: params.extension_cutoff_days_after_due
      unit: calendar_days
      counting_rule: >-
        The cutoff is counted in calendar days from the due date, so an extension on the due date itself
        still qualifies.
      boundary: inclusive
  params:
    extension_cutoff_days_after_due: 0
    per_tier:
      Member Grievance:
        basis: =resolution_basis
        period: =resolution_period
        extension_max: =extension_days_max
        extension_notice: =extension_notice_days
        notice_days: =resolution_notice_business_days
        oral: =oral_resolution_notice
      Quality of Care Grievance:
        basis: =resolution_basis
        period: =resolution_period
        extension_max: =extension_days_max
        extension_notice: =extension_notice_days
        notice_days: =resolution_notice_business_days
        oral: =oral_resolution_notice
      Standard Appeal:
        basis: =resolution_basis
        period: =resolution_period
        extension_max: =extension_days_max
        extension_notice: =extension_notice_days
        notice_days: =resolution_notice_business_days
        oral: =oral_resolution_notice
      Expedited Appeal:
        basis: =resolution_basis
        period: =resolution_period
        extension_max: =extension_days_max
        extension_notice: =extension_notice_days
        notice_days: =resolution_notice_business_days
        oral: =oral_resolution_notice
      State Fair Hearing:
