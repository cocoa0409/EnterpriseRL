- id: appeal_exhaustion
  subject:
  - appeal_file
  rule: >-
    A State Fair Hearing or External Medical Review may be requested only after the plan's own Standard
    or Expedited Appeal of the same decision was resolved upheld or partially_overturned, or, where deemed_exhaustion_applies,
    when that appeal was not resolved by its due date. An escalated case is opened only when the prior
    plan appeal named in prior_case_number is resolved upheld or partially_overturned, or is past its
    due date unresolved where deemed exhaustion applies. The plan sends its case summary within plan_summary_to_state_days
    of filing, and the hearing office or review organization decides; its decision binds the plan.
  eligibility:
  - id: plan_appeal_done
    applies_to:
    - appeal_file
    kind: authorization
    condition: >-
      An escalated case is opened only when the prior plan appeal named in prior_case_number is resolved
      upheld or partially_overturned, or is past its due date unresolved where deemed exhaustion applies.
    evidence_fields:
    - appeal_cases.case_number
    - appeal_cases.status
    - appeal_cases.resolution
    - appeal_cases.due_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - appeal_cases.case_number
      action_bindings:
        appeal_cases.case_number: prior_case_number
  params:
    per_tier:
      Member Grievance:
        exhaustion: =exhaustion_required
        deemed: =deemed_exhaustion_applies
        summary_days: =plan_summary_to_state_days
        binding: =decision_binding_on_plan
        decider: =external_reviewer
      Quality of Care Grievance:
        exhaustion: =exhaustion_required
        deemed: =deemed_exhaustion_applies
        summary_days: =plan_summary_to_state_days
        binding: =decision_binding_on_plan
        decider: =external_reviewer
      Standard Appeal:
        exhaustion: =exhaustion_required
        deemed: =deemed_exhaustion_applies
        summary_days: =plan_summary_to_state_days
        binding: =decision_binding_on_plan
        decider: =external_reviewer
      Expedited Appeal:
