- id: appeal_continuation
  subject:
  - appeal_continuation_service
  - appeal_continuation_waived
  - appeal_continuation_recovered
  - appeal_file
  rule: >-
    Where continuation_available, previously authorized services that the decision ends, suspends or reduces
    continue while the case is pending, only up to the units and period of the original authorization.
    Continuation applies only when the member asks for it no later than continuation_request_days after
    the date on the notice being appealed or before the action's effective date, whichever is later. The
    continuation days are counted in calendar days from the day after the notice date, and a request on
    the last day is in time. Continued services are booked only while the case is in filed, acknowledged
    or under_review status. When the case is overturned the whole continuation balance is waived; when
    it is upheld the balance may be recovered where continuation_recovery_allowed, except a balance at
    or below recovery_min_usd and except where the member states a financial hardship and recovery_hardship_waiver
    applies.
  eligibility:
  - id: continuation_in_time
    applies_to:
    - appeal_file
    kind: time
    condition: >-
      Continuation applies only when the member asks for it no later than continuation_request_days after
      the date on the notice being appealed or before the action's effective date, whichever is later.
    evidence_fields:
    - appeal_cases.notice_date
    - appeal_cases.related_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - appeal_cases.related_reference
      action_bindings:
        appeal_cases.related_reference: related_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the date on the notice being appealed
      anchor_source: appeal_cases.notice_date
      relation: not_after
      duration_source: variants.continuation_request_days
      unit: calendar_days
      counting_rule: >-
        The continuation days are counted in calendar days from the day after the notice date, and a request
        on the last day is in time.
      boundary: inclusive
  - id: continue_on_open_case
    applies_to:
    - appeal_continuation_service
    kind: state
    condition: >-
      Continued services are booked only while the case is in filed, acknowledged or under_review status.
    evidence_fields:
    - appeal_cases.appeal_case_id
    - appeal_cases.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - appeal_cases.appeal_case_id
      action_bindings:
        appeal_cases.appeal_case_id: appeal_case_id
    state_contract:
      field: appeal_cases.status
      allowed: *id002
  params:
    per_tier:
      Member Grievance:
        available: =continuation_available
        days: =continuation_request_days
        scope: =continuation_scope
        recovery: =continuation_recovery_allowed
        recovery_min: =recovery_min_usd
        hardship: =recovery_hardship_waiver
      Quality of Care Grievance:
        available: =continuation_available
