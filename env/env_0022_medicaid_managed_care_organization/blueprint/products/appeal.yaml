- id: appeal_filing_deadline
  subject:
  - appeal_file
  rule: >-
    A grievance may be filed at any time; an appeal, hearing request or external review must be filed
    within its deadline, and the notice date is always taken from the decision's own notice record (auth_actions,
    rx_exceptions or plan_claims) or the plan appeal's resolution notice, never from the member's recollection.
    An appeal, hearing request or external review is accepted only when filed no later than filing_deadline_days
    after the date on the notice being appealed. The filing days are counted in calendar days from the
    day after the notice date, and a case filed on the last day is in time. A late appeal is not accepted;
    the member may file a grievance about the matter instead. Filing is free, may be made orally through
    any channel in filing_channels, and never needs a written follow-up.
  eligibility:
  - id: filed_in_time
    applies_to:
    - appeal_file
    kind: time
    condition: >-
      An appeal, hearing request or external review is accepted only when filed no later than filing_deadline_days
      after the date on the notice being appealed.
    evidence_fields:
    - appeal_cases.notice_date
    - appeal_cases.related_reference
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - appeal_cases.related_reference
      action_bindings:
        appeal_cases.related_reference: related_reference
    temporal_basis:
      clock: frozen_time
      anchor_event: the date on the notice being appealed
      anchor_source: appeal_cases.notice_date
      relation: not_after
      duration_source: variants.filing_deadline_days
      unit: calendar_days
      counting_rule: >-
        The filing days are counted in calendar days from the day after the notice date, and a case filed
        on the last day is in time.
      boundary: inclusive
  params:
    per_tier:
      Member Grievance:
        applies: =filing_deadline_applies
        days: =filing_deadline_days
        anchor: =filing_anchor
        oral: =oral_filing_allowed
        channels: =filing_channels
        written_confirmation: =written_confirmation_required
        fee: =filing_fee_usd
      Quality of Care Grievance:
        applies: =filing_deadline_applies
        days: =filing_deadline_days
        anchor: =filing_anchor
        oral: =oral_filing_allowed
        channels: =filing_channels
        written_confirmation: =written_confirmation_required
        fee: =filing_fee_usd
      Standard Appeal:
        applies: =filing_deadline_applies
        days: =filing_deadline_days
        anchor: =filing_anchor
        oral: =oral_filing_allowed
        channels: =filing_channels
        written_confirmation: =written_confirmation_required
        fee: =filing_fee_usd
      Expedited Appeal:
        applies: =filing_deadline_applies
        days: =filing_deadline_days
        anchor: =filing_anchor
        oral: =oral_filing_allowed
        channels: =filing_channels
        written_confirmation: =written_confirmation_required
        fee: =filing_fee_usd
      State Fair Hearing:
