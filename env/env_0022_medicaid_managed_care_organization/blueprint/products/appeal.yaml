# Product charter: Appeals and Grievances. Output of erl-scenario-blueprint.
category: appeal
display_name: Appeals and Grievances
binding:
  holding_table: appeal_cases
  event_tables:
  - appeal_actions
  - appeal_continuation
  status_field: status
  variant_field: variant_name
  quantity_fields:
    continuation_balance: continuation_liability
lifecycle:
  states:
  - filed
  - acknowledged
  - under_review
  - resolved
  - withdrawn
  transitions:
  - from: filed
    to: acknowledged
    by: system
    means: The written or oral acknowledgment is sent.
  - from: acknowledged
    to: under_review
    by: system
    means: The case is assigned to a reviewer not involved in the original decision.
  - from: filed
    to: under_review
    by: system
    means: A case the state acknowledges itself goes straight to review.
  - from: under_review
    to: resolved
    by: system
    means: The reviewer resolves the case.
  - from: filed
    to: withdrawn
    by: user
    means: The member withdraws the case.
  - from: acknowledged
    to: withdrawn
    by: user
    means: The member withdraws the case.
  - from: under_review
    to: withdrawn
    by: user
    means: The member withdraws the case.
accounts:
- key: continuation_liability
  unit: USD
  meaning: >-
    Cost of services continued during a pending appeal that the member may have to repay if the decision
    is upheld; the integral view is appeal_cases.continuation_balance.
parameter_schema:
  filing_deadline_applies: Whether the case must be filed within a deadline (boolean).
  filing_deadline_days: >-
    Calendar days after the anchor notice date within which the case must be filed (integer days; 0 where
    no deadline applies).
  filing_anchor: Notice whose date starts the filing clock (enum string).
  oral_filing_allowed: Whether the case may be filed by phone (boolean).
  written_confirmation_required: Whether an oral filing must be followed by a signed written request (boolean).
  filing_channels: Channels through which the case may be filed (list).
  filing_fee_usd: Fee to file (USD, 2 decimals).
  acknowledgment_days: >-
    Calendar days after filed_date within which the written acknowledgment is sent (integer days; 0 where
    the state, not the plan, acknowledges).
  resolution_basis: Unit of resolution_period (enum string).
  resolution_period: >-
    Time after filed_date within which the case is resolved, in resolution_basis units (integer).
  extension_days_max: >-
    Most calendar days the resolution due date may be extended, once (integer days; 0 where no extension
    is allowed).
  extension_notice_days: >-
    Calendar days after deciding an extension within which written notice is sent (integer days).
  expedite_available: Whether the case can be handled on an expedited timeframe (boolean).
  expedite_denial_converts_to_standard: Whether a refused expedite request continues on the standard timeframe
    (boolean).
  expedite_denial_written_days: >-
    Calendar days after refusing an expedite request within which written notice follows prompt oral notice
    (integer days).
  continuation_available: Whether previously authorized services may continue while the case is pending
    (boolean).
  continuation_request_days: >-
    Calendar days after the notice date within which continuation must be requested, or before the action's
    effective date if later (integer days; 0 where not available).
  continuation_scope: What continues (enum string).
  continuation_recovery_allowed: >-
    Whether the plan may recover the cost of continued services when the decision is upheld (boolean).
  recovery_min_usd: Continued-service cost at or below which nothing is recovered (USD, 2 decimals).
  recovery_hardship_waiver: Whether recovery is waived for a member who states financial hardship (boolean).
  case_file_free_copy: Whether the member may have the case file and evidence free of charge (boolean).
  case_file_days: Calendar days after the request within which the case file is sent (integer days).
  member_testimony_allowed: Whether the member may present evidence and testimony in person or in writing
    (boolean).
  representative_form_required: >-
    Whether a signed authorized representative form is needed when someone else files for the member (boolean).
  provider_may_file_with_consent: >-
    Whether a provider may file on the member's behalf with the member's written consent (boolean).
  reviewer_not_involved_before: Whether the reviewer must not have taken part in the original decision
    (boolean).
  reviewer_clinical_expertise_required: Whether the reviewer must have clinical expertise in the member's
    condition (boolean).
  resolution_notice_business_days: Business days after resolution within which written notice is mailed
    (integer days).
  oral_resolution_notice: Whether the resolution is also given orally (boolean).
  exhaustion_required: Whether a resolved plan appeal is required before filing (boolean).
  deemed_exhaustion_applies: Whether a plan appeal not resolved by its due date counts as exhausted (boolean).
  plan_summary_to_state_days: >-
    Calendar days after filed_date by which the plan sends its case summary to the hearing office or review
    organization (integer days; 0 where not applicable).
  decision_binding_on_plan: Whether a decision against the plan binds it (boolean).
  effectuation_hours: >-
    Hours after an overturn within which the plan authorizes or provides the service (integer hours; 0
    where not applicable).
  max_open_cases_same_decision: Most open cases of the same tier for the same related reference (integer).
  withdrawal_oral_allowed: Whether a case may be withdrawn by phone (boolean).
  refile_within_original_deadline: >-
    Whether a withdrawn case may be filed again while the original deadline still runs (boolean).
  qoc_committee_referral: Whether the case is referred to the quality improvement committee (boolean).
  qoc_provider_response_days: >-
    Calendar days the provider has to respond to a quality inquiry (integer days; 0 where not applicable).
  peer_review_confidential: Whether peer review findings are withheld from the member (boolean).
  grievance_subjects: Subjects handled under the tier (list).
  accessible_formats_available: Whether notices are available in large print, braille and audio (boolean).
  interpreter_at_no_cost: Whether an interpreter is provided at no cost throughout (boolean).
  ack_letter_channel: Channel of the acknowledgment (enum string).
  retaliation_prohibited: Whether any action against the member for filing is prohibited (boolean).
  evidence_accepted_until: Latest point new evidence is accepted (enum string).
  external_reviewer: Body that decides (enum string).
