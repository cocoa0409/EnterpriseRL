events:
- type: appeal_file
  target: appeal_cases
  mutation: create
  meaning: A grievance, appeal, hearing request or external review is filed.
  grain: One row per case.
  fields:
    membership_id: Plan membership.
    variant_name: Case type.
    case_number: Case number.
    filed_date: Date filed.
    filed_by: Who filed.
    filing_channel: Channel.
    subject_category: Subject.
    related_reference: Decision or trip reference.
    notice_date: Date of the notice being appealed.
    prior_case_number: Plan appeal escalated from.
    due_date: Resolution due date.
    continuation_requested: Whether continuation was requested.
  triggers: []
- type: appeal_acknowledge
  target: appeal_cases
  mutation:
    transition:
      from: filed
      to: acknowledged
  meaning: The case is acknowledged.
  grain: One transition per case.
  fields:
    acknowledged_date: Date acknowledged.
  triggers:
  - event: appeal:appeal_letter
    map:
      letter_type: acknowledgment
      action_date: acknowledged_date
- type: appeal_start_review
  target: appeal_cases
  mutation:
    transition:
    - from: acknowledged
      to: under_review
    - from: filed
      to: under_review
  meaning: A reviewer takes the case.
  grain: One transition per case.
  fields:
    acknowledged_date: Unchanged.
  triggers: []
- type: appeal_resolve
  target: appeal_cases
  mutation:
    transition:
      from: under_review
      to: resolved
  meaning: The case is resolved.
  grain: One transition per case.
  fields:
    resolved_date: Date resolved.
    resolution: Outcome.
    subject_category: Carried unchanged.
  triggers:
  - event: appeal:appeal_letter
    map:
      letter_type: resolution_notice
      action_date: resolved_date
  - event: auth:auth_approve
    when:
      resolution:
      - overturned
      - partially_overturned
      subject_category: prior_authorization_denial
    map:
      decision_date: resolved_date
      request_origin: provider_request
  - event: rx:rx_exception_approved
    when:
      resolution:
      - overturned
      - partially_overturned
      subject_category: pharmacy_exception_denial
    map:
      event_date: resolved_date
  - event: appeal:appeal_continuation_waived
    when:
      resolution:
      - overturned
      - partially_overturned
    map:
      waiver_reason: appeal_overturned
      posted_date: resolved_date
- type: appeal_withdraw
  target: appeal_cases
  mutation:
    transition:
    - from: filed
      to: withdrawn
    - from: acknowledged
      to: withdrawn
    - from: under_review
      to: withdrawn
  meaning: The member withdraws the case.
  grain: One transition per case.
  fields:
    resolved_date: Date withdrawn.
    resolution: Always withdrawn.
  triggers: []
- type: appeal_extend
  target: appeal_cases
  mutation: update
  meaning: The resolution due date is extended.
  grain: One update per extension.
  fields:
    due_date: New due date.
    extension_reason: Why.
  triggers:
  - event: appeal:appeal_letter
    map:
      letter_type: extension_notice
- type: appeal_type_change
  target: appeal_cases
  mutation: update
  meaning: A refused expedite request moves the case to the standard timeframe.
  grain: One update per conversion.
  fields:
    variant_name: Standard Appeal.
    due_date: Standard due date.
  triggers:
  - event: appeal:appeal_letter
    map:
      letter_type: expedite_denial_notice
- type: appeal_letter
  target: appeal_actions
  meaning: A letter or oral notice about the case is sent.
  grain: One row per letter per channel.
  distinguish_by:
  - letter_type
  - action_date
  - delivery_channel
  fields:
    action_date: Date sent.
    letter_type: Which letter.
    delivery_channel: Channel.
  triggers: []
- type: appeal_evidence_submitted
  target: appeal_actions
  meaning: The member or representative submits evidence.
  grain: One row per submission.
  distinguish_by:
  - action_date
  - submitted_by
  fields:
    action_date: Date received.
    submitted_by: Who submitted.
    document_count: Documents received.
  triggers: []
- type: appeal_state_summary
  target: appeal_actions
  meaning: The plan sends its case summary to the hearing office or review organization.
  grain: One row per summary.
  distinguish_by:
  - action_date
  fields:
    action_date: Date sent.
    delivery_channel: Channel.
  triggers: []
- type: appeal_continuation_service
  target: appeal_continuation
  meaning: A service continued during a pending case is paid.
  grain: One row per continued service claim.
  distinguish_by:
  - service_reference
  - service_date
  fields:
    service_date: Service date.
    service_reference: Claim number of the continued service.
    amount: Plan cost.
    posted_date: Date posted.
  account: continuation_liability
  direction: in
  triggers: []
- type: appeal_continuation_waived
  target: appeal_continuation
  meaning: Continued-service cost is waived.
  grain: One row per waiver.
  distinguish_by:
  - waiver_reason
  - posted_date
  fields:
    waiver_reason: Why waived.
    amount: Amount waived.
    posted_date: Date posted.
  account: continuation_liability
  direction: out
  triggers: []
- type: appeal_continuation_recovered
  target: appeal_continuation
  meaning: The member repays continued-service cost.
  grain: One row per repayment.
  distinguish_by:
  - payment_reference
  fields:
    amount: Amount repaid.
    payment_reference: Payment confirmation.
    posted_date: Date posted.
  account: continuation_liability
  direction: out
  triggers: []
measures:
- id: appeal_msr_open_same_decision
  window: 'Point in time: the handling date.'
  measure: >-
    Count of appeal_cases rows of the member with the same variant_name and related_reference in filed,
    acknowledged or under_review status.
policies:
- id: appeal_agg_multi_holding
  subject:
  - appeal_file
  rule: A member may have any number of cases open at once, one per decision or concern.
  eligibility: []
  params:
    max_per_customer: null
- id: appeal_agg_one_per_decision
  subject:
  - appeal_file
  rule: >-
    Cases are combined per decision: one decision or concern is handled in one case per tier (appeal_msr_open_same_decision).
    A new case is not opened when the member already has a case of the same tier for the same related
    reference in filed, acknowledged or under_review status. New information about an open case is added
    to it as evidence instead.
  eligibility:
  - id: no_duplicate_case
    applies_to:
    - appeal_file
    kind: dedup
    condition: >-
      A new case is not opened when the member already has a case of the same tier for the same related
      reference in filed, acknowledged or under_review status.
    evidence_fields:
    - appeal_cases.customer_id
    - appeal_cases.related_reference
    - appeal_cases.variant_name
    - appeal_cases.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - appeal_cases.customer_id
        - appeal_cases.related_reference
        - appeal_cases.variant_name
      action_bindings:
        appeal_cases.customer_id: customer_id
        appeal_cases.related_reference: related_reference
        appeal_cases.variant_name: variant_name
    dedup_contract:
      table: appeal_cases
