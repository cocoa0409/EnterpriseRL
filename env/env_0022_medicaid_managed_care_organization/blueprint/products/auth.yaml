- id: auth_provider_change
  subject:
  - auth_provider_update
  - auth_void
  rule: >-
    Where servicing_provider_change_allowed, the member may move an approved authorization to another
    in-network servicing provider for the same service; the units left and the end_date carry over unchanged.
    The servicing provider is changed only on an authorization in approved status. In a class that does
    not allow the change, or to an out-of-network provider, the member may have the approval voided and
    the new provider submits a new request.
  eligibility:
  - id: change_on_approved
    applies_to:
    - auth_provider_update
    kind: state
    condition: The servicing provider is changed only on an authorization in approved status.
    evidence_fields:
    - auth_authorizations.authorization_id
    - auth_authorizations.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auth_authorizations.authorization_id
      action_bindings:
        auth_authorizations.authorization_id: authorization_id
    state_contract:
      field: auth_authorizations.status
      allowed:
      - approved
  params:
    per_tier:
      Advanced Imaging Authorization:
        change_allowed: =servicing_provider_change_allowed
        in_network_only: =provider_change_requires_in_network
      Outpatient Rehabilitation Therapy Authorization:
        change_allowed: =servicing_provider_change_allowed
        in_network_only: =provider_change_requires_in_network
      Durable Medical Equipment Authorization:
        change_allowed: =servicing_provider_change_allowed
        in_network_only: =provider_change_requires_in_network
      Home Health Services Authorization:
        change_allowed: =servicing_provider_change_allowed
        in_network_only: =provider_change_requires_in_network
      Behavioral Health Intensive Services Authorization:
        change_allowed: =servicing_provider_change_allowed
        in_network_only: =provider_change_requires_in_network
      Elective Inpatient and Surgical Authorization:
        change_allowed: =servicing_provider_change_allowed
        in_network_only: =provider_change_requires_in_network
      Out-of-Network Services Authorization:
        change_allowed: =servicing_provider_change_allowed
        in_network_only: =provider_change_requires_in_network
- id: auth_void_withdraw
  subject:
  - auth_void
  - auth_withdraw
  - auth_units_released
  rule: >-
    The member may have an approval voided when the service will not be used; the units left are released
    the same day where void_releases_units is true, and units already used are never reversed by a void.
    The member may withdraw an undecided request at any time before the decision; a withdrawn request
    has no decision and gives no appeal rights. A voided or withdrawn authorization is never reopened;
    a later need is a new request.
  eligibility: []
  params:
    per_tier:
      Advanced Imaging Authorization:
        releases: =void_releases_units
      Outpatient Rehabilitation Therapy Authorization:
        releases: =void_releases_units
      Durable Medical Equipment Authorization:
        releases: =void_releases_units
      Home Health Services Authorization:
        releases: =void_releases_units
      Behavioral Health Intensive Services Authorization:
        releases: =void_releases_units
      Elective Inpatient and Surgical Authorization:
        releases: =void_releases_units
      Out-of-Network Services Authorization:
        releases: =void_releases_units
- id: auth_out_of_network
  subject:
  - auth_submit
  - auth_approve
  rule: >-
    An out-of-network service is approved only when no in-network provider can deliver it within oon_access_distance_miles
    or within oon_access_wait_days, and, where oon_single_case_agreement_required, only after the provider
    signs a single case agreement before start_date. An authorized out-of-network service costs the member
    nothing beyond the in-network copay (oon_member_cost_share_usd). Emergency services never need authorization
    in or out of network.
  eligibility: []
  params:
    per_tier:
      Advanced Imaging Authorization:
        requires_unavailable: =oon_requires_no_in_network_available
        miles: =oon_access_distance_miles
        wait_days: =oon_access_wait_days
        sca: =oon_single_case_agreement_required
        member_cost: =oon_member_cost_share_usd
      Outpatient Rehabilitation Therapy Authorization:
        requires_unavailable: =oon_requires_no_in_network_available
        miles: =oon_access_distance_miles
        wait_days: =oon_access_wait_days
        sca: =oon_single_case_agreement_required
        member_cost: =oon_member_cost_share_usd
      Durable Medical Equipment Authorization:
        requires_unavailable: =oon_requires_no_in_network_available
        miles: =oon_access_distance_miles
        wait_days: =oon_access_wait_days
        sca: =oon_single_case_agreement_required
        member_cost: =oon_member_cost_share_usd
      Home Health Services Authorization:
        requires_unavailable: =oon_requires_no_in_network_available
        miles: =oon_access_distance_miles
        wait_days: =oon_access_wait_days
        sca: =oon_single_case_agreement_required
        member_cost: =oon_member_cost_share_usd
      Behavioral Health Intensive Services Authorization:
