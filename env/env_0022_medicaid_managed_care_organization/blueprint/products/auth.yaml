- id: auth_service_scope
  subject:
  - auth_submit
  rule: >-
    An authorization is needed only for services in the class's scope: any rental or any DME item priced
    above dme_pa_threshold_usd, therapy treatment after the initial evaluation where therapy_eval_without_auth
    is true, and home health within one certification period of home_health_cert_period_days. A retro
    request for a service already delivered is accepted only within retro_request_days of the first service
    date, and an unscheduled admission must be notified within inpatient_notification_hours. Rented equipment
    becomes the member's after dme_rental_to_purchase_months and the same item is not replaced within
    dme_replacement_years unless the member's condition changed.
  eligibility: []
  params:
    per_tier:
      Advanced Imaging Authorization:
        dme_threshold: =dme_pa_threshold_usd
        eval_free: =therapy_eval_without_auth
        cert_days: =home_health_cert_period_days
        retro_days: =retro_request_days
        notify_hours: =inpatient_notification_hours
        rent_to_own: =dme_rental_to_purchase_months
        replace_years: =dme_replacement_years
