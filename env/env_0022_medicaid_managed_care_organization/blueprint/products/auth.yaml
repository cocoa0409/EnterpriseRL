      Out-of-Network Services Authorization:
        reviewer: =denial_reviewer_specialty
        mail_days: =decision_notice_mail_business_days
        p2p_days: =peer_to_peer_window_business_days
- id: auth_pend_info
  subject:
  - auth_pend
  - auth_info_received
  - auth_deny
  rule: >-
    A request may be pended for clinical information at most pend_max_times (auth_msr_pends); the provider
    has pend_info_response_days to answer, and pending never extends the decision deadline beyond the
    one extension allowed. Without an answer by the response deadline the request is decided on the record
    as it stands, and a denial for that reason uses denial_reason insufficient_information.
  eligibility: []
  params:
    per_tier:
      Advanced Imaging Authorization:
        max_pends: =pend_max_times
        response_days: =pend_info_response_days
      Outpatient Rehabilitation Therapy Authorization:
        max_pends: =pend_max_times
        response_days: =pend_info_response_days
      Durable Medical Equipment Authorization:
        max_pends: =pend_max_times
        response_days: =pend_info_response_days
