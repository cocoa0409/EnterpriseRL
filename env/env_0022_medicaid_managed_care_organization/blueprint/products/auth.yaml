- id: auth_adverse_determination
  subject:
  - auth_deny
  - auth_notice
  - auth_approve
  rule: >-
    A denial, or an approval of fewer units or a shorter period than requested, is an adverse benefit
    determination made only by a physician of denial_reviewer_specialty, and its written notice is mailed
    within decision_notice_mail_business_days and states the reason, the criteria used and the member's
    appeal rights. The requesting provider may ask for a peer-to-peer discussion within peer_to_peer_window_business_days
    of the denial; the discussion never pauses the member's appeal deadline. A denial overturned on appeal,
    state fair hearing or external review is approved with start_date no later than the overturn decision
    date.
  eligibility: []
  params:
    per_tier:
      Advanced Imaging Authorization:
        reviewer: =denial_reviewer_specialty
        mail_days: =decision_notice_mail_business_days
        p2p_days: =peer_to_peer_window_business_days
      Outpatient Rehabilitation Therapy Authorization:
        reviewer: =denial_reviewer_specialty
        mail_days: =decision_notice_mail_business_days
        p2p_days: =peer_to_peer_window_business_days
      Durable Medical Equipment Authorization:
        reviewer: =denial_reviewer_specialty
        mail_days: =decision_notice_mail_business_days
        p2p_days: =peer_to_peer_window_business_days
      Home Health Services Authorization:
        reviewer: =denial_reviewer_specialty
        mail_days: =decision_notice_mail_business_days
        p2p_days: =peer_to_peer_window_business_days
      Behavioral Health Intensive Services Authorization:
        reviewer: =denial_reviewer_specialty
        mail_days: =decision_notice_mail_business_days
        p2p_days: =peer_to_peer_window_business_days
      Elective Inpatient and Surgical Authorization:
