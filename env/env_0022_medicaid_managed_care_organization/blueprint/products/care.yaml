- id: care_consent_rule
  subject:
  - care_consent
  rule: >-
    Care management is voluntary: an episode becomes active only on the member's own consent, which only
    the member or the member's authorized representative can give. The episode is activated only when
    the member or the authorized representative on file states consent during the contact. A member who
    declines is closed with closure_reason member_declined and may self-refer again after reenroll_wait_days.
  eligibility:
  - id: member_consent
    applies_to:
    - care_consent
    kind: caller_fact
    condition: >-
      The episode is activated only when the member or the authorized representative on file states consent
      during the contact.
    evidence_fields:
    - care_enrollments.care_enrollment_id
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
