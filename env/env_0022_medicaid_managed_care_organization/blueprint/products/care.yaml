events:
- type: care_refer
  target: care_enrollments
  mutation: create
  meaning: A member is referred to care management.
  grain: One row per care management episode.
  fields:
    membership_id: Plan membership.
    variant_name: Tier the member is placed in.
    referral_source: Where the referral came from.
    referral_date: Date referred.
    risk_score: Predictive risk score at referral.
    setting: Living setting.
  triggers: []
- type: care_outreach_start
  target: care_enrollments
  mutation:
    transition:
      from: referred
      to: outreach
  meaning: Outreach to the member begins.
  grain: One transition per episode.
  fields:
    care_manager_name: Care team lead assigned for outreach.
  triggers: []
- type: care_consent
  target: care_enrollments
  mutation:
    transition:
      from: outreach
      to: active
  meaning: The member consents to take part.
  grain: One transition per episode.
  fields:
    enrollment_date: Date of consent.
  triggers: []
- type: care_hold
  target: care_enrollments
  mutation:
    transition:
      from: active
      to: on_hold
  meaning: Care management is put on hold.
  grain: One transition per hold.
  fields:
    hold_start_date: First day on hold.
  triggers: []
- type: care_resume
  target: care_enrollments
  mutation:
    transition:
      from: on_hold
      to: active
  meaning: Care management resumes after a hold.
  grain: One transition per hold.
  fields:
    hold_start_date: Cleared when resumed.
  triggers: []
- type: care_close
  target: care_enrollments
  mutation:
    transition:
    - from: referred
      to: closed
    - from: outreach
      to: closed
    - from: active
      to: closed
    - from: on_hold
      to: closed
  meaning: The episode closes.
  grain: One transition per episode.
  fields:
    closure_date: Closure date.
    closure_reason: Controlled reason.
  triggers:
  - event: care:care_hours_expired
    map:
      posted_date: closure_date
- type: care_level_change
  target: care_enrollments
  mutation: update
  meaning: The member is re-stratified to another tier.
  grain: One update per re-stratification.
  fields:
    variant_name: New tier.
    risk_score: Risk score at re-stratification.
  triggers: []
- type: care_manager_assign
  target: care_enrollments
  mutation: update
  meaning: A different care team lead is assigned.
  grain: One update per change.
  fields:
    care_manager_name: New care team lead.
  triggers:
  - event: care:care_manager_change_log
    map:
      care_manager_name: care_manager_name
- type: care_outreach_attempt
  target: care_activities
  meaning: An outreach attempt is made.
  grain: One row per attempt.
  distinguish_by:
  - activity_date
  - contact_mode
  fields:
    activity_date: Date.
    contact_mode: Mode.
    attempt_outcome: Outcome.
  triggers: []
- type: care_assessment
  target: care_activities
  meaning: An assessment is completed.
  grain: One row per assessment.
  distinguish_by:
  - activity_date
  - assessment_type
  fields:
    activity_date: Date.
    assessment_type: Kind.
    contact_mode: Mode.
  triggers: []
- type: care_plan_update
  target: care_activities
  meaning: A care plan version is completed or reviewed.
  grain: One row per plan version.
  distinguish_by:
  - plan_version
  fields:
    activity_date: Date.
    plan_version: Version number.
    member_signed: Whether the member signed.
  triggers: []
- type: care_contact
  target: care_activities
  meaning: A care team contact with the member.
  grain: One row per contact.
  distinguish_by:
  - activity_date
  - contact_mode
  fields:
    activity_date: Date.
    contact_mode: Mode.
    attempt_outcome: Always reached.
  triggers: []
- type: care_transition_followup
  target: care_activities
  meaning: A follow-up after a hospital discharge.
  grain: One row per discharge followed up.
  distinguish_by:
  - discharge_date
  - facility_name
  fields:
    activity_date: Date.
    contact_mode: Mode.
    discharge_date: Discharge date.
    facility_name: Hospital.
  triggers: []
- type: care_manager_change_log
  target: care_activities
  meaning: A change of care team lead is logged.
  grain: One row per change.
  distinguish_by:
  - activity_date
  - care_manager_name
  fields:
