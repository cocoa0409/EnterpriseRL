# Product charter: Care Management. Output of erl-scenario-blueprint.
category: care
display_name: Care Management
binding:
  holding_table: care_enrollments
  event_tables:
  - care_activities
  - care_hours
  status_field: status
  variant_field: variant_name
  quantity_fields:
    hours_balance: personal_care_hours
lifecycle:
  states:
  - referred
  - outreach
  - active
  - on_hold
  - closed
  transitions:
  - from: referred
    to: outreach
    by: system
    means: The care team starts outreach to the referred member.
  - from: outreach
    to: active
    by: user
    means: The member consents to take part in care management.
  - from: referred
    to: closed
    by: system
    means: The referral closes before outreach (not eligible or membership ended).
  - from: outreach
    to: closed
    by: system
    means: Outreach ends unable to reach or the member declines.
  - from: active
    to: on_hold
    by: system
    means: Care management pauses during a hospital, facility or correctional stay.
  - from: on_hold
    to: active
    by: system
    means: The member returns home and care management resumes.
  - from: active
    to: closed
    by: system
    means: The member graduates, opts out, the maternal period ends or the membership ends.
  - from: on_hold
    to: closed
    by: system
    means: The hold lasts beyond its maximum or the membership ends.
accounts:
- key: personal_care_hours
  unit: hours
  meaning: >-
    Personal care and respite hours authorized for the current period and not yet delivered or expired;
    the integral view is care_enrollments.hours_balance.
parameter_schema:
  min_risk_score: Lowest predictive risk score admitted to the tier (decimal, 2 places).
  max_risk_score: >-
    Highest predictive risk score admitted to the tier (decimal, 2 places; 99.99 where there is no upper
    bound).
  chronic_conditions_min: Fewest chronic conditions on claims in the last 12 months for the tier (integer).
  pregnancy_required: Whether a pregnancy or postpartum status is required (boolean).
  health_home_conditions: Qualifying Health Home conditions (list; empty where not applicable).
  nf_level_of_care_required: Whether a nursing facility level-of-care determination is required (boolean).
  placement_precedence: Placement order when several tiers fit; the lower number wins (integer).
  ed_visits_trigger_6m: >-
    Emergency department visits within 6 months that trigger re-stratification to the next tier (integer;
    0 where not applicable).
  inpatient_trigger_12m: >-
    Inpatient admissions within 12 months that trigger re-stratification (integer; 0 where not applicable).
  digital_program_only: Whether the tier is delivered only through digital coaching (boolean).
  care_team_lead: Role that leads the member's care team (enum string).
  max_caseload: Most members one care team lead carries (integer members).
  member_can_self_refer: Whether the member may refer themself (boolean).
  enrollment_outreach_days: >-
    Calendar days after referral_date by which the first outreach attempt is made (integer days).
  outreach_attempts_before_unable_to_reach: >-
    Unsuccessful outreach attempts on different days before the referral closes as unable to reach (integer).
  outreach_window_days: Calendar days after referral_date during which outreach continues (integer days).
  initial_assessment_days: Calendar days after consent by which the initial assessment is completed (integer
    days).
  reassessment_months: Months between reassessments (integer months).
  care_plan_days: >-
    Calendar days after the initial assessment by which the care plan is completed (integer days; 0 where
    no care plan is written).
  care_plan_review_days: Calendar days between care plan reviews (integer days; 0 where no care plan).
  care_plan_signature_required: Whether the member must sign the care plan before it takes effect (boolean).
  care_plan_copy_days: Calendar days after signature within which the member receives a copy (integer
    days).
  min_contacts_per_month: Fewest successful care team contacts per calendar month (integer).
  min_face_to_face_per_quarter: Fewest in-person or home visits per calendar quarter (integer).
  contact_modes_counted: Contact modes that count toward the monthly minimum (list).
  post_discharge_followup_days: >-
    Calendar days after a hospital discharge within which the care team follows up (integer days).
  followup_mode_required: Contact mode required for the post-discharge follow-up (enum string).
  medication_reconciliation_days: >-
    Calendar days after discharge by which medications are reconciled (integer days; 0 where not done).
  social_needs_screening_required: Whether a social needs screening is part of the assessment (boolean).
  community_referral_followup_days: >-
    Calendar days after a community resource referral by which the team confirms the connection (integer
    days; 0 where not applicable).
  remote_monitoring_eligible: Whether remote monitoring devices may be supplied (boolean).
  graduation_stable_months: >-
    Consecutive months meeting care plan goals with no ED visit or admission after which the member graduates
    (integer; 0 where graduation does not apply).
  closure_after_postpartum_days: >-
    Calendar days after the pregnancy end date on which maternal care management closes (integer days;
    0 where not applicable).
  reenroll_wait_days: >-
    Calendar days after a member_declined closure before a self-referral reopens the tier (integer days).
  hold_max_days: Most calendar days an enrollment may stay on hold (integer days).
  care_manager_change_per_365_days: Member-requested care team lead changes within a rolling 365 days
    (integer).
  personal_care_hours_weekly_max: Most personal care hours that may be authorized per week (hours, 2 decimals).
  max_hours_per_day: Most personal care hours delivered in one day (hours, 2 decimals).
  hours_authorization_period_days: >-
    Length of one hours authorization period (integer days; 7 = a Monday-Sunday week; 0 where not applicable).
  hours_rollover: Whether unused authorized hours carry into the next period (boolean).
  hours_unit_increment_minutes: Billing increment for delivered hours (integer minutes; 0 where not applicable).
  respite_hours_per_year: Respite hours available per calendar year (hours, 2 decimals).
  consumer_direction_allowed: Whether the member may direct their own attendant (boolean).
  family_attendant_allowed: >-
    Whether a relative who is not legally responsible for the member may be paid as attendant (boolean).
  evv_required: Whether delivered hours must be confirmed by electronic visit verification (boolean).
  evv_correction_days: >-
    Calendar days after the visit date within which a missing EVV record may be corrected (integer days).
  missed_visit_report_hours: Hours within which an agency reports a missed personal care visit (integer
    hours).
  backup_plan_required: Whether a documented backup attendant plan is required (boolean).
  caregiver_training_hours: Training hours offered to an unpaid family caregiver per year (hours, 2 decimals).
  hours_reduction_notice_days: >-
    Calendar days of advance written notice before authorized hours are reduced (integer days).
