  triggers: []
- type: care_hours_authorized
  target: care_hours
  meaning: Personal care or respite hours are authorized for a period.
  grain: One row per service type per week.
  distinguish_by:
  - service_week
  - service_type
  fields:
    service_week: Week start.
    service_type: Service.
    hours: Hours authorized.
    posted_date: Date posted.
  account: personal_care_hours
  direction: in
  triggers: []
- type: care_hours_delivered
  target: care_hours
  meaning: An EVV-confirmed visit delivers hours.
  grain: One row per visit.
  distinguish_by:
  - evv_confirmation
  fields:
    service_week: Week.
    service_type: Service.
    hours: Hours delivered.
    visit_date: Visit date.
    attendant_number: Attendant.
    evv_confirmation: EVV confirmation.
    posted_date: Date posted.
  account: personal_care_hours
  direction: out
  triggers: []
- type: care_hours_expired
  target: care_hours
  meaning: Undelivered hours lapse at period end or closure.
  grain: One row per service type per lapsed week.
  distinguish_by:
  - service_week
  - service_type
  fields:
    service_week: Week.
    service_type: Service.
    hours: Hours lapsed.
    posted_date: Date posted.
  account: personal_care_hours
  direction: out
  triggers: []
measures:
- id: care_msr_contacts_month
  window: Calendar month.
  measure: >-
    Count of care_contact rows on the enrollment in the month whose contact_mode is in contact_modes_counted.
- id: care_msr_outreach_attempts
  window: From referral_date through referral_date plus outreach_window_days.
  measure: >-
    Count of care_outreach_attempt rows on the enrollment with attempt_outcome other than reached, counting
    at most one per calendar day.
- id: care_msr_week_hours
  window: The Monday-Sunday service week.
  measure: >-
    Sum of care_hours.hours over care_hours_delivered rows on the enrollment for the service_week and
    service_type.
- id: care_msr_manager_changes_365d
  window: Rolling 365 calendar days ending on the request date, inclusive.
  measure: >-
    Count of care_manager_change_log rows on the enrollment with change_reason = member_request in the
    window.
policies:
- id: care_agg_multi_holding
  subject:
  - care_refer
  rule: >-
    A member holds one care management episode at a time. A new referral opens an episode only when the
    member has no episode in referred, outreach, active or on_hold status.
  eligibility:
  - id: one_open_episode
    applies_to:
    - care_refer
    kind: dedup
    condition: >-
      A new referral opens an episode only when the member has no episode in referred, outreach, active
      or on_hold status.
    evidence_fields:
    - care_enrollments.customer_id
    - care_enrollments.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - care_enrollments.customer_id
      action_bindings:
        care_enrollments.customer_id: customer_id
    dedup_contract:
      table: care_enrollments
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - referred
        - outreach
        - active
        - on_hold
      distinct_fields:
      - referral_date
  params:
    max_per_customer: 1
- id: care_placement
  subject:
  - care_refer
  - care_level_change
  rule: >-
    A member is placed in the tier with the lowest placement_precedence whose conditions the member meets:
    nursing facility level of care, a Health Home qualifying condition, pregnancy or the postpartum year,
    then the risk score band with the chronic condition minimum. A member reaching ed_visits_trigger_6m
    emergency visits within 6 months or inpatient_trigger_12m admissions within 12 months is re-stratified
    to the next higher risk tier, and a member who meets graduation_stable_months steps down one tier.
    A re-stratification keeps the episode, its care plan and its contact history.
  eligibility: []
  params:
    per_tier:
      Healthy Living Support:
        min_risk: =min_risk_score
        max_risk: =max_risk_score
        conditions: =chronic_conditions_min
        precedence: =placement_precedence
        ed_trigger: =ed_visits_trigger_6m
        ip_trigger: =inpatient_trigger_12m
        pregnancy: =pregnancy_required
        hh_conditions: =health_home_conditions
        nf_loc: =nf_level_of_care_required
      Care Coordination Level 1:
        min_risk: =min_risk_score
        max_risk: =max_risk_score
        conditions: =chronic_conditions_min
        precedence: =placement_precedence
