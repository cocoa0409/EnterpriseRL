    respite up to respite_hours_per_year per calendar year, and unused hours lapse at period end where
    hours_rollover is false. Hours are delivered only with an EVV confirmation where evv_required, in
    hours_unit_increment_minutes increments, never more than max_hours_per_day in one day and never more
    than the week's authorization (care_msr_week_hours); a missing EVV record may be corrected within
    evv_correction_days of the visit date. Hours are authorized and delivered only on an episode in active
    status. A reduction of authorized hours takes effect only after hours_reduction_notice_days of written
    notice with appeal rights, and the member may direct their own attendant, including a relative who
    is not legally responsible for them, where allowed.
