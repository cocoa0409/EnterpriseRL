  - care_outreach_attempt
  - care_close
  rule: >-
    The first outreach attempt is made within enrollment_outreach_days of referral_date and outreach continues
    through outreach_window_days. After outreach_attempts_before_unable_to_reach unsuccessful attempts
    on different days (care_msr_outreach_attempts) the episode closes with closure_reason unable_to_reach,
    and a later self-referral opens a new episode. Outreach attempts are recorded only while the episode
    is in outreach status.
