        notice_days: =hours_reduction_notice_days
        self_direct: =consumer_direction_allowed
        family: =family_attendant_allowed
        missed_hours: =missed_visit_report_hours
        backup: =backup_plan_required
        training: =caregiver_training_hours
  measures:
  - care_msr_week_hours
- id: care_hold_rule
  subject:
  - care_hold
  - care_resume
  - care_close
  rule: >-
    An episode goes on hold during a hospital, facility or correctional stay and resumes on return home.
    An episode on hold closes with closure_reason hold_expired only after hold_max_days have fully passed
    since the hold start date. The hold days are counted in calendar days with the hold start date as
    day 1, and closure is allowed only on a day strictly after the last hold day.
  eligibility:
  - id: hold_limit
    applies_to:
    - care_close
    kind: time
    condition: >-
      An episode on hold closes with closure_reason hold_expired only after hold_max_days have fully passed
      since the hold start date.
    evidence_fields:
    - care_enrollments.care_enrollment_id
    - care_enrollments.hold_start_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - care_enrollments.care_enrollment_id
      action_bindings:
        care_enrollments.care_enrollment_id: care_enrollment_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the hold start date
      anchor_source: care_enrollments.hold_start_date
      relation: not_before
      duration_source: variants.hold_max_days
      unit: calendar_days
      counting_rule: >-
        The hold days are counted in calendar days with the hold start date as day 1, and closure is allowed
        only on a day strictly after the last hold day.
      boundary: exclusive
  params:
    per_tier:
      Healthy Living Support:
        hold_max: =hold_max_days
      Care Coordination Level 1:
        hold_max: =hold_max_days
      Care Coordination Level 2:
        hold_max: =hold_max_days
      Maternal Care Management:
        hold_max: =hold_max_days
      Complex Case Management:
        hold_max: =hold_max_days
      Health Home Services:
        hold_max: =hold_max_days
      LTSS Service Coordination:
        hold_max: =hold_max_days
- id: care_closure
  subject:
  - care_close
  rule: >-
    An episode closes when the member graduates after graduation_stable_months, when Maternal Care Management
    reaches closure_after_postpartum_days after the pregnancy end date, when the member declines or cannot
    be reached, when a hold expires, or when the membership ends. Closure ends every authorization of
    hours the same day.
  eligibility: []
  params:
    per_tier:
      Healthy Living Support:
        graduation: =graduation_stable_months
        postpartum: =closure_after_postpartum_days
      Care Coordination Level 1:
        graduation: =graduation_stable_months
        postpartum: =closure_after_postpartum_days
      Care Coordination Level 2:
        graduation: =graduation_stable_months
        postpartum: =closure_after_postpartum_days
      Maternal Care Management:
        graduation: =graduation_stable_months
        postpartum: =closure_after_postpartum_days
      Complex Case Management:
        graduation: =graduation_stable_months
        postpartum: =closure_after_postpartum_days
      Health Home Services:
        graduation: =graduation_stable_months
        postpartum: =closure_after_postpartum_days
      LTSS Service Coordination:
        graduation: =graduation_stable_months
        postpartum: =closure_after_postpartum_days
- id: care_manager_change
  subject:
  - care_manager_assign
  - care_manager_change_log
  rule: >-
    A member may ask for a different care team lead up to care_manager_change_per_365_days times (care_msr_manager_changes_365d);
    changes for caseload rebalancing or a lead leaving never count.
  eligibility: []
  params:
    per_tier:
      Healthy Living Support:
        changes: =care_manager_change_per_365_days
      Care Coordination Level 1:
        changes: =care_manager_change_per_365_days
      Care Coordination Level 2:
        changes: =care_manager_change_per_365_days
      Maternal Care Management:
        changes: =care_manager_change_per_365_days
      Complex Case Management:
        changes: =care_manager_change_per_365_days
      Health Home Services:
        changes: =care_manager_change_per_365_days
      LTSS Service Coordination:
        changes: =care_manager_change_per_365_days
  measures:
  - care_msr_manager_changes_365d
