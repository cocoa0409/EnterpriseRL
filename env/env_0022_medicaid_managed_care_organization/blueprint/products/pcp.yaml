- id: pcp_auto_assignment
  subject:
  - pcp_assign
  rule: >-
    A new member who has not chosen a PCP is auto-assigned to a practice type whose auto_assign_eligible
    is true, choosing first a provider the member saw within auto_assign_lookback_months, then the PCP
    of a household member, then the nearest open panel matching the member's age. Auto-assignment happens
    only after auto_assign_after_days have fully passed since the plan membership's enrollment date. The
    choice period is counted in calendar days from the day after the enrollment date, and auto-assignment
    may run only on a day strictly after the last day of the period. An auto-assigned member may change
    once for member_preference without the change counting toward the limit when the change is requested
    within auto_assign_after_days of the auto-assignment effective_date.
  eligibility:
  - id: choice_period
    applies_to:
    - pcp_assign
    kind: time
    condition: >-
      Auto-assignment happens only after auto_assign_after_days have fully passed since the plan membership's
      enrollment date.
    evidence_fields:
    - plan_memberships.membership_id
    - plan_memberships.enrollment_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - plan_memberships.membership_id
      action_bindings:
        plan_memberships.membership_id: membership_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the plan membership's enrollment date
      anchor_source: plan_memberships.enrollment_date
      relation: not_before
      duration_source: variants.auto_assign_after_days
      unit: calendar_days
      counting_rule: >-
        The choice period is counted in calendar days from the day after the enrollment date, and auto-assignment
        may run only on a day strictly after the last day of the period.
      boundary: exclusive
