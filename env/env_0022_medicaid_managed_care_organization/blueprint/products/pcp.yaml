events:
- type: pcp_assign
  target: pcp_assignments
  mutation: create
  meaning: >-
    A PCP assignment is created for the member, by member selection, auto-assignment or plan reassignment.
  grain: One row per assignment.
  fields:
    membership_id: Plan membership the assignment belongs to.
    variant_name: Practice type, as the official name.
    provider_npi: NPI of the assigned provider.
    provider_name: Provider name.
    practice_name: Practice name.
    effective_date: Date the assignment takes effect.
    assignment_method: How the assignment was made.
    distance_miles: Straight-line miles from residence to practice.
  triggers: []
- type: pcp_activate
  target: pcp_assignments
  mutation:
    transition:
      from: pending_effective
      to: active
  meaning: A pending assignment reaches its effective date.
  grain: One transition per assignment.
  fields:
    effective_date: Effective date, unchanged.
    assignment_method: Carried unchanged from the assignment.
  triggers:
  - event: plan:plan_id_card_issue
    when:
      assignment_method:
      - member_selected
      - reassigned_by_plan
    map:
      card_reason: pcp_change
      delivery_channel: mail
- type: pcp_end
  target: pcp_assignments
  mutation:
    transition:
    - from: pending_effective
      to: ended
    - from: active
      to: ended
  meaning: An assignment ends or a pending one is withdrawn.
  grain: One transition per assignment.
  fields:
    end_date: Last day of the assignment.
    end_reason: Controlled reason the assignment ended.
  triggers: []
- type: pcp_location_update
  target: pcp_assignments
  mutation: update
  meaning: The member's residence changes and the distance to the practice is recomputed.
  grain: One update per reported move.
  fields:
    distance_miles: Recomputed straight-line miles.
  triggers: []
- type: pcp_change_log
  target: pcp_events
  meaning: A member-initiated PCP change request is recorded against the new assignment it created.
  grain: One row per change request.
  distinguish_by:
  - event_date
  - requested_provider_npi
  fields:
    event_date: Date the member asked for the change.
    change_reason: Controlled reason for the change.
    request_channel: Channel of the request.
    requested_provider_npi: NPI of the provider the member chose.
  triggers: []
- type: pcp_provider_notice
  target: pcp_events
  meaning: A member is notified that the assigned provider is leaving the network.
  grain: One row per exit notice to one assigned member.
  distinguish_by:
  - notice_reason
  - effective_date
  fields:
    event_date: Date the notice was sent.
    notice_reason: Always provider_network_exit.
    effective_date: Provider's network exit date.
  triggers: []
- type: pcp_dismissal_notice
  target: pcp_events
  meaning: A practice's dismissal of the member is recorded.
  grain: One row per dismissal notice.
  distinguish_by:
  - event_date
  - notice_reason
  fields:
    event_date: Date the practice's written notice was sent.
    notice_reason: Controlled dismissal reason.
    effective_date: Date the dismissal ends the assignment.
  triggers: []
- type: pcp_referral_issue
  target: pcp_events
  meaning: The PCP issues a specialist referral for the member.
  grain: One row per referral.
  distinguish_by:
  - referral_number
  fields:
    event_date: Referral issue date.
    referral_number: Referral number.
    specialist_npi: NPI of the specialist referred to.
    referral_type: single or standing.
    referral_visits: Visits covered by the referral.
  triggers: []
- type: pcp_outreach_attempt
  target: pcp_events
  meaning: An outreach attempt to schedule the initial health appointment is logged.
  grain: One row per attempt.
  distinguish_by:
  - event_date
  - outreach_method
  fields:
    event_date: Date of the attempt.
    outreach_method: Method used.
  triggers: []
- type: pcp_visit
  target: pcp_visits
  meaning: A visit with the assigned PCP is recorded from a paid claim.
  grain: One row per visit.
  distinguish_by:
  - visit_date
  - visit_type
  - claim_number
  fields:
    visit_date: Date of the visit.
    visit_type: Kind of visit.
    visit_mode: in_person or telehealth.
    claim_number: Claim number of the visit claim.
  triggers: []
measures:
- id: pcp_msr_changes_365d
  window: Rolling 365 calendar days ending on the request date, both ends inclusive.
  measure: >-
    Count of pcp_change_log rows of the member with change_reason = member_preference and event_date inside
    the window, not counting any change whose resulting assignment was withdrawn before it took effect.
- id: pcp_msr_panel_count
  window: 'Point in time: the handling date.'
  measure: >-
    Count of pcp_assignments rows with the provider_npi in question and status pending_effective or active,
    across all members.
- id: pcp_msr_iha_outreach
  window: From the assignment effective_date through the handling date, inclusive.
  measure: >-
    Count of pcp_outreach_attempt rows on the assignment whose event_date is at least iha_outreach_min_days_apart
    after the previous counted attempt (the first attempt always counts).
policies:
- id: pcp_agg_multi_holding
  subject:
  - pcp_assign
  rule: >-
    A member may hold at most two open PCP assignments: the current active one and one pending_effective
    assignment that will replace it. Assignments are never shared between members; each household member
    holds their own.
  eligibility: []
  params:
    max_per_customer: 2
- id: pcp_agg_single_active
  subject:
  - pcp_assign
  - pcp_activate
  - pcp_end
  rule: >-
    At any date a member has exactly one active PCP; when a pending assignment becomes active, the previously
    active assignment ends the day before with end_reason superseded. A new change request made while
    another assignment is still pending_effective withdraws the earlier pending assignment (end_reason
    superseded) instead of stacking a third open assignment, and the withdrawn change does not count toward
    the change limit. A PCP assignment is created only while the member's plan membership is in pending,
    active, renewal_due or reconsideration status.
  eligibility:
  - id: membership_open
    applies_to:
    - pcp_assign
    kind: state
    condition: >-
      A PCP assignment is created only while the member's plan membership is in pending, active, renewal_due
      or reconsideration status.
    evidence_fields:
    - plan_memberships.membership_id
    - plan_memberships.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - plan_memberships.membership_id
      action_bindings:
        plan_memberships.membership_id: membership_id
    state_contract:
      field: plan_memberships.status
      allowed:
      - pending
      - active
      - renewal_due
      - reconsideration
  params:
    per_tier:
      Standard Primary Care Provider:
        max_open: =max_open_assignments
      Pediatric Primary Care Provider:
        max_open: =max_open_assignments
      OB/GYN Primary Care Provider:
        max_open: =max_open_assignments
      Federally Qualified Health Center Home:
        max_open: =max_open_assignments
      Patient-Centered Medical Home Practice:
        max_open: =max_open_assignments
      Specialist Serving as PCP:
        max_open: =max_open_assignments
      Health Home Lead Provider:
        max_open: =max_open_assignments
- id: pcp_practice_match
  subject:
  - pcp_assign
  rule: >-
    A member may be assigned only to a practice type whose age range contains the member's age in completed
    years on the effective_date, and to an OB/GYN Primary Care Provider only when the member is recorded
    as female. Holding a care enrollment changes which practice types are open to the member: Specialist
    Serving as PCP and Health Home Lead Provider are available only to a member who holds an active care
    enrollment in one of the tiers listed in care_enrollment_prerequisite. For a practice type with a
    care enrollment prerequisite, the member's care enrollment in a listed tier must be in active status
    on the request date. A member who reaches the practice type's maximum age is told age_out_notice_days
    before the birthday and, without a choice, is reassigned by the plan effective the first day of the
    month after the birthday.
  eligibility:
  - id: care_prerequisite
    applies_to:
    - pcp_assign
    kind: state
    condition: >-
      For a practice type with a care enrollment prerequisite, the member's care enrollment in a listed
      tier must be in active status on the request date.
    evidence_fields:
    - care_enrollments.care_enrollment_id
    - care_enrollments.variant_name
    - care_enrollments.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - care_enrollments.care_enrollment_id
      action_bindings:
        care_enrollments.care_enrollment_id: care_enrollment_id
    state_contract:
      field: care_enrollments.status
      allowed:
      - active
  params:
    per_tier:
      Standard Primary Care Provider:
        min_age: =min_member_age_years
        max_age: =max_member_age_years
        female_only: =female_members_only
        care_prereq: =care_enrollment_prerequisite
        age_out_notice_days: =age_out_notice_days
      Pediatric Primary Care Provider:
        min_age: =min_member_age_years
        max_age: =max_member_age_years
        female_only: =female_members_only
        care_prereq: =care_enrollment_prerequisite
        age_out_notice_days: =age_out_notice_days
