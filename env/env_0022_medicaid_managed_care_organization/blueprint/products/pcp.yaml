  - pcp_referral_issue
  rule: >-
    Where referral_required_for_specialist is true, an in-network specialist visit needs a referral from
    the active PCP; a referral is valid for referral_validity_days from its issue date and covers up to
    referral_max_visits, or standing_referral_max_visits for a standing referral where standing referrals
    are allowed. Services listed in self_referral_services never need a referral, and a referral never
    replaces a prior authorization where one is required. A referral is issued only on an assignment in
    active status. A referral issued by a PCP whose assignment has since ended stays valid until its own
    expiry.
  eligibility:
  - id: referral_from_active_pcp
    applies_to:
    - pcp_referral_issue
    kind: state
    condition: A referral is issued only on an assignment in active status.
    evidence_fields:
    - pcp_assignments.pcp_assignment_id
    - pcp_assignments.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - pcp_assignments.pcp_assignment_id
      action_bindings:
        pcp_assignments.pcp_assignment_id: pcp_assignment_id
    state_contract:
      field: pcp_assignments.status
      allowed:
      - active
  params:
    per_tier:
      Standard Primary Care Provider:
        required: =referral_required_for_specialist
        validity_days: =referral_validity_days
        max_visits: =referral_max_visits
        standing_allowed: =standing_referral_allowed
        standing_max: =standing_referral_max_visits
        self_referral: =self_referral_services
      Pediatric Primary Care Provider:
        required: =referral_required_for_specialist
        validity_days: =referral_validity_days
        max_visits: =referral_max_visits
        standing_allowed: =standing_referral_allowed
        standing_max: =standing_referral_max_visits
        self_referral: =self_referral_services
      OB/GYN Primary Care Provider:
        required: =referral_required_for_specialist
        validity_days: =referral_validity_days
        max_visits: =referral_max_visits
        standing_allowed: =standing_referral_allowed
        standing_max: =standing_referral_max_visits
        self_referral: =self_referral_services
      Federally Qualified Health Center Home:
        required: =referral_required_for_specialist
        validity_days: =referral_validity_days
        max_visits: =referral_max_visits
        standing_allowed: =standing_referral_allowed
        standing_max: =standing_referral_max_visits
        self_referral: =self_referral_services
      Patient-Centered Medical Home Practice:
