# Product charter: Primary Care Provider Assignment. Output of erl-scenario-blueprint.
category: pcp
display_name: Primary Care Provider Assignment
binding:
  holding_table: pcp_assignments
  event_tables:
  - pcp_events
  - pcp_visits
  status_field: status
  variant_field: variant_name
lifecycle:
  states:
  - pending_effective
  - active
  - ended
  transitions:
  - from: pending_effective
    to: active
    by: system
    means: The assignment's effective_date arrives and the provider becomes the member's PCP.
  - from: pending_effective
    to: ended
    by: agent
    means: >-
      A pending assignment is withdrawn at the member's request or superseded by a later request before
      it takes effect.
  - from: active
    to: ended
    by: system
    means: >-
      The assignment is superseded by a newly effective one, the provider leaves the network or dismisses
      the member, the member ages out, or the membership ends.
accounts: []
parameter_schema:
  min_member_age_years: Youngest member age in completed years the practice type may be assigned (integer
    years).
  max_member_age_years: >-
    Oldest member age in completed years the practice type may be assigned; a member older than this ages
    out (integer years; 120 where there is no upper limit).
  female_members_only: Whether only members recorded as female may be assigned (boolean).
  care_enrollment_prerequisite: >-
    Care management tiers of which the member must hold an active care enrollment to be assigned (list
    of official care tier names; empty list means none required).
  max_panel_size: >-
    Most members that may hold a pending or active assignment to one provider NPI at the same time (integer
    members).
  family_panel_exception: >-
    Whether a member may join a full panel when a household member is already assigned to the same provider
    (boolean).
  max_distance_miles_urban: >-
    Longest straight-line distance in miles from residence to practice for auto-assignment in an urban
    county (miles, 1 decimal).
  max_distance_miles_rural: >-
    Longest straight-line distance in miles from residence to practice for auto-assignment in a rural
    county (miles, 1 decimal).
  max_drive_minutes_urban: >-
    Longest typical drive time in minutes for auto-assignment in an urban county (integer minutes).
  max_drive_minutes_rural: >-
    Longest typical drive time in minutes for auto-assignment in a rural county (integer minutes).
  member_changes_per_365_days: Member-preference PCP changes allowed within a rolling 365-day window (integer
    changes).
  change_cutoff_day: >-
    Day of month on or before which a routine change request takes effect the first day of the next month;
    later requests take effect the first day of the month after next (integer day).
  for_cause_effective_next_day: >-
    Whether a change for provider_left_network, provider_dismissal or access_problem takes effect the
    calendar day after the request (boolean).
  retro_change_allowed_days: Calendar days a PCP change may be back-dated before the request date (integer
    days).
  auto_assign_after_days: >-
    Calendar days after plan enrollment_date a new member has to choose a PCP before auto-assignment (integer
    days).
  auto_assign_lookback_months: >-
    Months of claims history searched for a prior PCP relationship during auto-assignment (integer months).
  auto_assign_eligible: Whether the practice type can receive auto-assigned members (boolean).
  iha_due_days: >-
    Calendar days after the assignment effective_date within which the initial health appointment must
    be completed for a new member (integer days).
  iha_outreach_attempts_required: >-
    Documented outreach attempts required before a missed initial health appointment is excused (integer
    attempts).
  iha_outreach_min_days_apart: Minimum calendar days between counted outreach attempts (integer days).
  telehealth_counts_for_iha: Whether a telehealth visit satisfies the initial health appointment (boolean).
  routine_appointment_days: Calendar days within which a routine appointment must be offered (integer
    days).
  urgent_appointment_hours: Hours within which an urgent appointment must be offered (integer hours).
  same_day_sick_visit_required: Whether the practice must offer a same-day sick visit (boolean).
  after_hours_line_required: Whether the practice must have a 24/7 clinician line (boolean).
  after_hours_callback_minutes: Minutes within which an after-hours clinician returns a call (integer
    minutes).
  extended_hours_per_week: Clinic hours per week offered outside 8am-5pm weekdays (integer hours).
  behavioral_health_integrated: Whether behavioral health care is integrated on site (boolean).
  care_team_contact_days: >-
    Calendar days between required care-team contacts with the member (integer days; 0 where no contact
    cadence applies).
  referral_required_for_specialist: Whether an in-network specialist visit requires a referral from this
    PCP (boolean).
  referral_validity_days: Calendar days from issue_date during which a referral may be used (integer days).
  referral_max_visits: Most specialist visits one single referral covers (integer visits).
  standing_referral_allowed: Whether the PCP may issue a standing referral for an ongoing condition (boolean).
  standing_referral_max_visits: >-
    Most visits a standing referral covers within its validity (integer visits; 0 where standing referrals
    are not allowed).
  self_referral_services: Services the member may use without a referral in every practice type (list).
  dismissal_notice_days: >-
    Calendar days of written notice a practice must give before a dismissal ends the assignment (integer
    days).
  dismissal_urgent_care_days: >-
    Calendar days after the dismissal notice during which the practice must still see the member for urgent
    needs (integer days).
  prohibited_dismissal_reasons: Reasons for which a practice may never dismiss a member (list).
  provider_exit_notice_lead_days: >-
    Calendar days before a provider's network exit date by which assigned members are notified (integer
    days).
  provider_exit_notice_after_receipt_days: >-
    Calendar days after Prairie Ridge receives a provider's exit notice within which members are notified,
    whichever date is later (integer days).
  continuity_of_care_days: >-
    Calendar days after a provider's network exit during which a member in active treatment may keep seeing
    that provider (integer days).
  continuity_of_care_pregnancy_through_postpartum: >-
    Whether a pregnant member may keep the exiting provider through the postpartum period (boolean).
  age_out_notice_days: >-
    Calendar days before the member reaches the practice type's maximum age by which the member is told
    to choose a new PCP (integer days; 0 where the practice type has no age limit).
  max_open_assignments: Most open assignments (pending_effective plus active) a member may hold at once
    (integer).
  change_channels: Channels through which a member-initiated change is accepted (list).
  second_opinion_allowed: >-
    Whether the member may obtain a second opinion from another in-network provider at no cost (boolean).
  interpreter_required_languages: Languages for which the practice must arrange a qualified interpreter
    at no cost (list).
  pcp_on_id_card: >-
    Whether the assigned PCP is printed on the member ID card, so a change triggers a new card (boolean).
