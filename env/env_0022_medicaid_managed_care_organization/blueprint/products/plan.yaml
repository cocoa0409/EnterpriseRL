# Product charter: Medicaid Managed Care Membership. Output of erl-scenario-blueprint.
category: plan
display_name: Medicaid Managed Care Membership
binding:
  holding_table: plan_memberships
  event_tables:
  - plan_claims
  - plan_premiums
  - plan_notices
  intake_tables:
  - plan_change_requests
  status_field: status
  variant_field: variant_name
  quantity_fields:
    premium_balance: premium_due
lifecycle:
  states:
  - pending
  - active
  - renewal_due
  - reconsideration
  - suspended
  - terminated
  transitions:
  - from: pending
    to: active
    by: system
    means: >-
      The coverage start date on the state enrollment file is reached and the membership becomes effective.
  - from: pending
    to: terminated
    by: system
    means: The state cancels the enrollment before the coverage start date.
  - from: active
    to: renewal_due
    by: system
    means: The renewal packet is issued and the annual redetermination window opens.
  - from: renewal_due
    to: active
    by: system
    means: The state approves the renewal and a new eligibility period begins.
  - from: renewal_due
    to: reconsideration
    by: system
    means: >-
      Coverage ends for a procedural reason (no renewal returned) and the reconsideration period starts.
  - from: reconsideration
    to: active
    by: system
    means: >-
      A renewal returned within the reconsideration period reinstates coverage back to the coverage end
      date.
  - from: reconsideration
    to: terminated
    by: system
    means: The reconsideration period lapses without a returned renewal.
  - from: renewal_due
    to: terminated
    by: system
    means: The state finds the member no longer eligible at renewal.
  - from: active
    to: suspended
    by: system
    means: The state reports the member incarcerated and suspends the membership.
  - from: suspended
    to: active
    by: system
    means: The state reports release and the suspension is lifted.
  - from: suspended
    to: terminated
    by: system
    means: Eligibility ends while suspended.
  - from: active
    to: terminated
    by: user
    means: >-
      The member's plan change or voluntary disenrollment, requested by the member through the enrollment
      broker, takes effect.
accounts:
- key: premium_due
  unit: USD
  meaning: >-
    CHIP family premium billed and not yet paid or waived; the integral view is plan_memberships.premium_balance.
- key: cost_share
  unit: USD
  meaning: >-
    Member cost sharing (copays) assessed on medical claims, net of adjustments and over-cap refunds.
parameter_schema:
  min_age_years: >-
    Lowest age in completed years on the coverage start date admitted to the category (integer years).
  max_age_years: >-
    Highest age in completed years on the coverage start date admitted to the category (integer years;
    120 is written where the category has no upper age limit).
  income_limit_pct_fpl: >-
    Upper household income limit as a whole percent of the federal poverty level, compared against plan_memberships.income_pct_fpl
    (integer percent).
  income_floor_pct_fpl: >-
    Lower household income bound as a whole percent of the federal poverty level below which the member
    belongs to a different category (integer percent; 0 means no floor).
  medicare_entitlement_required: Whether Medicare Part A and Part B entitlement is a condition of the
    category (boolean).
  disability_determination_required: >-
    Whether an SSI or state disability determination (or age 65 or older) is a condition of the category
    (boolean).
  asset_test_applies: Whether countable household assets are tested at application and renewal (boolean).
  asset_limit_usd: >-
    Countable asset limit for a single applicant where the asset test applies (USD, 2 decimals; 0.00 where
    no asset test applies).
  category_precedence: >-
    Placement precedence when a person meets more than one category's entry gate; the lower number wins
    (integer).
  premium_ladder: >-
    Monthly family premium ladder by income band, a list of {from_pct_fpl, to_pct_fpl, monthly_usd} rows
    matched on plan_memberships.income_pct_fpl (both ends inclusive); an empty list means the category
    never bills a premium.
  premium_due_day_of_month: >-
    Calendar day of the month preceding the coverage month by which that month's premium is due (integer
    day; 0 where no premium is billed).
  premium_grace_days: >-
    Calendar days after the due date during which an unpaid premium does not yet end coverage (integer
    days; 0 where no premium is billed).
  premium_lockout_days: >-
    Calendar days after a premium non-payment termination during which the family cannot re-enroll in
    the category unless the past-due premium is paid (integer days; 0 where not applicable).
  premium_prepay_max_months: >-
    Most future coverage months a family may prepay in one payment (integer months; 0 where no premium
    is billed).
  premium_hardship_waiver_max_months: >-
    Most coverage months that may be waived for financial hardship within a rolling 12-month period (integer
    months; 0 where no premium is billed).
  premium_ai_an_exempt: >-
    Whether members recorded as American Indian or Alaska Native are exempt from premiums (boolean).
  premium_nonpayment_disenrolls: Whether an unpaid premium past the grace period ends coverage (boolean).
  copay_pcp_visit_usd: Member copay per primary care office visit claim (USD, 2 decimals).
  copay_specialist_visit_usd: Member copay per specialist office visit claim (USD, 2 decimals).
  copay_behavioral_health_visit_usd: Member copay per outpatient behavioral health visit claim (USD, 2
    decimals).
  copay_nonemergency_er_usd: Member copay for a non-emergency visit to a hospital emergency room (USD,
    2 decimals).
  copay_inpatient_stay_usd: Member copay per inpatient hospital stay, charged once per admission (USD,
    2 decimals).
  copay_outpatient_hospital_usd: Member copay per outpatient hospital or ambulatory surgery claim (USD,
    2 decimals).
  copay_lab_xray_usd: Member copay per laboratory or plain X-ray claim (USD, 2 decimals).
  copay_ambulance_usd: Member copay per ground ambulance transport claim (USD, 2 decimals).
  copay_exempt_preventive: Whether preventive and well-child claims carry no copay (boolean).
  copay_exempt_family_planning: Whether family planning claims carry no copay (boolean).
  copay_exempt_emergency: Whether emergency room claims coded as a true emergency carry no copay (boolean).
  copay_exempt_institutional: >-
    Whether a member with an active LTSS Service Coordination care enrollment on the service date pays
    no copay (boolean).
  nonemergency_er_screening_required: >-
    Whether the non-emergency ER copay may be charged only when the hospital screening found no emergency
    and offered an alternative provider (boolean).
  cost_share_cap_pct_income: >-
    Aggregate member cost-sharing cap as a percent of household income for the cap period (percent, 2
    decimals).
  cost_share_cap_period_months: >-
    Length of the cost-sharing cap period in calendar months: 3 means calendar quarters beginning January,
    April, July and October; 12 means the calendar year (integer months).
  cost_share_cap_includes_rx: Whether pharmacy copays recorded on rx_fills count toward the cap (boolean).
  cost_share_refund_days: >-
    Calendar days after the claim that crossed the cap is booked within which the over-cap refund is issued
    (integer days).
  claim_adjustment_window_days: >-
    Calendar days after an original claim's booked date within which its member cost share may be adjusted
    (integer days).
  redetermination_period_months: Length of one eligibility period between renewals (integer calendar months).
  renewal_packet_lead_days: >-
    Calendar days before renewal_due_date on which the renewal packet is issued and the membership enters
    renewal (integer days).
  renewal_reminder_first_lead_days: >-
    Calendar days before renewal_due_date on which the first renewal reminder is sent (integer days).
  renewal_reminder_second_lead_days: >-
    Calendar days before renewal_due_date on which the second renewal reminder is sent (integer days).
  ex_parte_renewal_eligible: >-
    Whether the state may renew the category from data sources without a returned packet (boolean).
  reconsideration_period_days: >-
    Calendar days after a procedural coverage end date during which a returned renewal reinstates coverage
    without a new application (integer days).
  continuous_eligibility_months: >-
    Months from the coverage start date or the latest renewal during which coverage cannot end for income
    or procedural reasons (integer months; 0 means none).
  postpartum_coverage_months: >-
    Months of coverage guaranteed after the month the pregnancy ends (integer months; 0 where not applicable).
  retro_coverage_months: >-
    Calendar months before the application month that coverage may reach back to (integer months).
  change_report_days: >-
    Calendar days within which a member must report an address, income or household change (integer days).
  member_reimbursement_filing_days: >-
    Calendar days after the service date within which a member may ask to be reimbursed for a covered
    service paid out of pocket during retroactive coverage (integer days; 0 where the category has no
    retroactive coverage).
  mco_change_window_days: >-
    Calendar days after enrollment_date during which the member may change health plans without cause
    (integer days).
  open_enrollment_days: >-
    Length in calendar days of the annual open enrollment window that opens renewal_packet_lead_days before
    renewal_due_date (integer days).
  for_cause_change_allowed: Whether a documented cause allows a plan change at any time (boolean).
  id_card_free_replacements_per_12_months: >-
    Physical ID card replacements for loss, theft or damage issued within a rolling 365-day window (integer
    cards).
  id_card_mail_business_days: >-
    Business days (Monday-Friday excluding state holidays) for a mailed ID card to be produced and posted
    (integer days).
  digital_id_card_available: Whether a digital ID card is available in the member portal and app (boolean).
  temporary_id_letter_available: >-
    Whether a temporary proof-of-coverage letter can be issued while a physical card is in the mail (boolean).
  incarceration_suspension_allowed: >-
    Whether membership is suspended rather than ended while the member is incarcerated (boolean).
  suspension_inpatient_min_hours: >-
    Minimum length in hours of an inpatient stay outside the correctional facility that remains covered
    during suspension (integer hours).
  welcome_call_days: >-
    Calendar days after coverage_start_date within which the welcome call is placed (integer days).
  health_risk_assessment_days: >-
    Calendar days after coverage_start_date within which the health risk assessment is offered (integer
    days).
