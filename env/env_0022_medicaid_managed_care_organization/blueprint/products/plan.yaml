events:
- type: plan_enroll
  target: plan_memberships
  mutation: create
  meaning: >-
    The state enrollment file enrolls a person in Prairie Ridge under one eligibility category.
  grain: One row per enrollment spell.
  fields:
    enrollment_date: Date the state enrollment file assigned the member to Prairie Ridge.
    coverage_start_date: First day of coverage.
    variant_name: Eligibility category assigned by the state, as the official category name.
    assignment_type: Whether the member chose the plan or was auto-assigned.
    income_pct_fpl: Household income as a percent of the federal poverty level on the enrollment file.
    household_income_monthly: Monthly household income on the enrollment file.
    renewal_due_date: Date the first eligibility period ends and renewal is due.
    ai_an_status: Whether the state file records the member as American Indian or Alaska Native.
    notice_channel: Member's preferred additional channel for notices.
  triggers:
  - event: plan:plan_id_card_issue
    map:
      card_reason: new_enrollment
      delivery_channel: mail
- type: plan_activate
  target: plan_memberships
  mutation:
    transition:
      from: pending
      to: active
  meaning: The coverage start date arrives and the membership becomes effective.
  grain: One transition per enrollment spell.
  fields:
    coverage_start_date: First day of coverage, unchanged from enrollment.
  triggers: []
- type: plan_renewal_open
  target: plan_memberships
  mutation:
    transition:
      from: active
      to: renewal_due
  meaning: The annual redetermination window opens and the renewal packet is issued.
  grain: One transition per renewal cycle.
  fields:
    renewal_due_date: Date the current eligibility period ends.
  triggers:
  - event: plan:plan_renewal_notice
    map:
      notice_type: renewal_packet
      renewal_cycle_date: renewal_due_date
      delivery_channel: mail
- type: plan_renewal_approve
  target: plan_memberships
  mutation:
    transition:
      from: renewal_due
      to: active
  meaning: The state approves the renewal and a new eligibility period starts.
  grain: One transition per approved renewal.
  fields:
    renewal_due_date: >-
      Date the new eligibility period ends (the prior renewal_due_date plus the redetermination period).
  triggers: []
- type: plan_procedural_close
  target: plan_memberships
  mutation:
    transition:
      from: renewal_due
      to: reconsideration
  meaning: >-
    Coverage ends at renewal because no renewal was returned; the reconsideration period starts.
  grain: One transition per lapsed renewal.
  fields:
    termination_date: Coverage end date (the renewal_due_date of the cycle).
    termination_reason: Always procedural_no_response for this transition.
  triggers:
  - event: plan:plan_renewal_notice
    map:
      notice_type: procedural_closure_notice
      renewal_cycle_date: termination_date
      delivery_channel: mail
- type: plan_reinstate
  target: plan_memberships
  mutation:
    transition:
      from: reconsideration
      to: active
  meaning: A renewal returned within the reconsideration period reinstates coverage with no gap.
  grain: One transition per reinstatement.
  fields:
    renewal_due_date: End of the new eligibility period.
    termination_date: Cleared to empty on reinstatement.
    termination_reason: Reset to not_applicable on reinstatement.
  triggers: []
- type: plan_terminate
  target: plan_memberships
  mutation:
    transition:
    - from: pending
      to: terminated
    - from: renewal_due
      to: terminated
    - from: reconsideration
      to: terminated
    - from: suspended
      to: terminated
    - from: active
      to: terminated
  meaning: >-
    The membership ends: loss of eligibility, plan change, voluntary disenrollment, move, death or premium
    non-payment.
  grain: One transition per ended enrollment spell.
  fields:
    termination_date: Last day of coverage.
    termination_reason: Controlled reason the membership ended.
  triggers:
  - event: pcp:pcp_end
    map:
      end_date: termination_date
      end_reason: membership_ended
  - event: rx:rx_terminate
    map:
      end_date: termination_date
      end_reason: membership_ended
  - event: ride:ride_close
    map:
      end_date: termination_date
      close_reason: membership_ended
  - event: care:care_close
    map:
      closure_date: termination_date
      closure_reason: membership_ended
- type: plan_suspend
  target: plan_memberships
  mutation:
    transition:
      from: active
      to: suspended
  meaning: The state suspends the membership during incarceration.
  grain: One transition per suspension.
  fields:
    suspension_start_date: First day of the suspension.
  triggers: []
- type: plan_resume
  target: plan_memberships
  mutation:
    transition:
      from: suspended
      to: active
  meaning: The state lifts the suspension on release.
  grain: One transition per lifted suspension.
  fields:
    suspension_start_date: Cleared to empty when the suspension is lifted.
  triggers: []
- type: plan_notice_preference_update
  target: plan_memberships
  mutation: update
  meaning: The member changes the additional channel used for renewal and plan notices.
  grain: One update per preference change.
  fields:
    notice_channel: New preferred additional channel.
  triggers: []
- type: plan_income_update
  target: plan_memberships
  mutation: update
  meaning: The state enrollment file reports a changed household income for the member.
  grain: One update per reported income change.
  fields:
    income_pct_fpl: New income as a percent of FPL.
    household_income_monthly: New monthly household income.
  triggers: []
- type: plan_claim_booked
  target: plan_claims
  meaning: A medical claim for the member is adjudicated and its member cost share is booked.
  grain: One row per adjudicated claim.
  distinguish_by:
  - claim_number
  fields:
    claim_number: Claim number printed on the explanation of benefits.
    service_date: First date of service.
    service_category: Copay category of the claim.
    provider_npi: Billing provider NPI.
    billed_amount: Amount billed by the provider.
    plan_paid_amount: Amount Prairie Ridge paid.
    member_cost_share: Copay assessed to the member (positive).
    adjudication_status: paid or denied.
    denial_code: Reason for denial, none when paid.
    cost_share_period: Cap period the service date falls in.
    booked_date: Date the claim was booked.
  account: cost_share
  direction: in
  triggers: []
- type: plan_claim_adjusted
  target: plan_claims
  meaning: A booked claim is adjusted and its member cost share is reversed.
  grain: One row per adjustment of one original claim.
  distinguish_by:
  - claim_number
  - related_claim_number
  fields:
    claim_number: Adjustment claim number.
    related_claim_number: Claim number of the original claim being adjusted.
    service_date: Service date of the original claim.
    service_category: Copay category of the original claim.
    member_cost_share: Negative of the cost share reversed.
    adjudication_status: Always adjusted.
    denial_code: Reason the original claim is reversed.
    cost_share_period: Cap period of the original service date.
    booked_date: Date the adjustment was booked.
  account: cost_share
  direction: out
  triggers: []
- type: plan_cost_share_refund
  target: plan_claims
  meaning: Copays assessed above the member's aggregate cap are refunded.
  grain: One row per refunded claim.
  distinguish_by:
  - related_claim_number
  - cost_share_period
  fields:
    related_claim_number: Claim number of the claim whose copay crossed the cap.
    member_cost_share: Negative of the refunded amount.
    adjudication_status: Always refunded.
    cost_share_period: Cap period the refund belongs to.
    booked_date: Date the refund was booked.
  account: cost_share
  direction: out
  triggers: []
- type: plan_premium_billed
  target: plan_premiums
  meaning: A CHIP family premium is billed for one coverage month.
  grain: One row per billed coverage month.
  distinguish_by:
  - coverage_month
  fields:
    coverage_month: Coverage month billed.
    amount: Premium billed.
    posted_date: Date billed.
  account: premium_due
  direction: in
  triggers: []
- type: plan_premium_paid
  target: plan_premiums
  meaning: A premium payment is applied to one coverage month.
  grain: One row per payment applied to one coverage month.
  distinguish_by:
  - coverage_month
  - payment_reference
  fields:
    coverage_month: Coverage month the payment is applied to.
    amount: Amount applied.
    payment_method: How the family paid.
    payment_reference: Payment confirmation number.
    posted_date: Date posted.
  account: premium_due
  direction: out
  triggers: []
- type: plan_premium_waived
  target: plan_premiums
  meaning: A billed premium month is waived.
  grain: One row per waived coverage month.
  distinguish_by:
  - coverage_month
  fields:
    coverage_month: Coverage month waived.
    amount: Amount waived.
    waiver_reason: Controlled waiver reason.
    posted_date: Date the waiver posted.
  account: premium_due
  direction: out
  triggers: []
- type: plan_renewal_notice
  target: plan_notices
  meaning: A renewal packet, renewal reminder or procedural closure notice is sent.
  grain: One row per notice per channel per renewal cycle.
  distinguish_by:
  - notice_type
  - renewal_cycle_date
  - delivery_channel
  fields:
    notice_type: Which renewal notice.
    renewal_cycle_date: renewal_due_date of the cycle the notice belongs to.
    delivery_channel: Channel used.
    sent_date: Date sent.
  triggers: []
- type: plan_id_card_issue
  target: plan_notices
  meaning: >-
    A member ID card is produced and mailed, or a digital card is issued in place of a physical one.
  grain: One row per card issued.
  distinguish_by:
  - card_reason
  - delivery_channel
  - sent_date
  fields:
    card_reason: Why the card was issued.
    delivery_channel: mail for a physical card, member_portal for a digital-only card.
    sent_date: Date issued.
  triggers: []
measures:
- id: plan_msr_period_cost_share
  window: >-
    The member's current cost-sharing cap period containing the service date: the calendar quarter (Jan-Mar,
    Apr-Jun, Jul-Sep, Oct-Dec) where cost_share_cap_period_months is 3, the calendar year where it is
    12.
  measure: >-
    Sum of plan_claims.member_cost_share over plan_claim_booked, plan_claim_adjusted and plan_cost_share_refund
    rows whose cost_share_period is that period, plus, where cost_share_cap_includes_rx is true, the sum
    of rx_fills.member_copay over rx_fill and rx_fill_reversal rows whose fill_date falls in that period.
- id: plan_msr_id_replacements_365d
  window: >-
    Rolling 365 calendar days ending on the handling date (frozen_time date), both ends inclusive.
  measure: >-
    Count of plan_id_card_issue rows on the membership with card_reason in (lost, stolen, damaged) and
    delivery_channel = mail and sent_date inside the window.
- id: plan_msr_hardship_waivers_12m
  window: The 12 coverage months ending with the coverage month being waived, inclusive.
  measure: >-
    Count of plan_premium_waived rows on the membership with waiver_reason = financial_hardship whose
    coverage_month is inside the window.
policies:
- id: plan_agg_multi_holding
  subject:
  - plan_enroll
  rule: >-
    A person holds at most one Prairie Ridge membership at a time; a second enrollment is never opened
    alongside an open one, and the state enrollment file is the only source that opens a membership. A
    new membership is created only when the person has no other membership in pending, active, renewal_due,
    reconsideration or suspended status. A terminated membership does not block a new enrollment spell,
    which is opened as a new membership rather than by reopening the old one.
  eligibility:
  - id: one_open_membership
    applies_to:
    - plan_enroll
    kind: dedup
    condition: >-
      A new membership is created only when the person has no other membership in pending, active, renewal_due,
      reconsideration or suspended status.
    evidence_fields:
    - plan_memberships.customer_id
    - plan_memberships.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - plan_memberships.customer_id
      action_bindings:
        plan_memberships.customer_id: customer_id
    dedup_contract:
      table: plan_memberships
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - pending
        - active
        - renewal_due
        - reconsideration
        - suspended
      distinct_fields:
      - enrollment_date
  params:
    max_per_customer: 1
- id: plan_category_placement
  subject:
  - plan_enroll
  - plan_income_update
  rule: >-
    The eligibility category recorded on a membership is the one whose entry gate the member meets on
    the coverage start date, judged on age in completed years, plan_memberships.income_pct_fpl against
    the category's income floor and limit, Medicare entitlement, disability determination and, where the
    asset test applies, countable assets. When a member meets more than one category's gate, the category
    with the lowest category_precedence is recorded. An income change reported on the state file never
    moves a member out of a category while that category's continuous eligibility period is running; outside
    that period the new income is applied at the next renewal, not mid-period. Income is compared as the
    whole percent printed on the state file, with no rounding by Prairie Ridge.
  eligibility: []
  params:
    per_tier:
      Prairie Ridge Expansion Adult:
        min_age: =min_age_years
        max_age: =max_age_years
        income_floor: =income_floor_pct_fpl
        income_limit: =income_limit_pct_fpl
        precedence: =category_precedence
      Prairie Ridge Family Care:
        min_age: =min_age_years
        max_age: =max_age_years
        income_floor: =income_floor_pct_fpl
        income_limit: =income_limit_pct_fpl
        precedence: =category_precedence
      Prairie Ridge CHIP Kids:
        min_age: =min_age_years
        max_age: =max_age_years
        income_floor: =income_floor_pct_fpl
        income_limit: =income_limit_pct_fpl
        precedence: =category_precedence
      Prairie Ridge Children's Medicaid:
        min_age: =min_age_years
        max_age: =max_age_years
        income_floor: =income_floor_pct_fpl
        income_limit: =income_limit_pct_fpl
        precedence: =category_precedence
      Prairie Ridge Pregnancy Care:
        min_age: =min_age_years
        max_age: =max_age_years
        income_floor: =income_floor_pct_fpl
        income_limit: =income_limit_pct_fpl
        precedence: =category_precedence
      Prairie Ridge ABD Care:
        min_age: =min_age_years
        max_age: =max_age_years
        income_floor: =income_floor_pct_fpl
        income_limit: =income_limit_pct_fpl
        precedence: =category_precedence
      Prairie Ridge Dual Complete:
        min_age: =min_age_years
        max_age: =max_age_years
        income_floor: =income_floor_pct_fpl
        income_limit: =income_limit_pct_fpl
        precedence: =category_precedence
- id: plan_evt_copay
  subject:
  - plan_claim_booked
  rule: >-
    Each paid claim is assessed the copay the member's category sets for the claim's service_category,
    once per claim, with no copay on denied claims. Preventive, family planning and true-emergency claims
    carry no copay in any category. A non-emergency emergency-room copay is assessed only where the hospital
    screening found no emergency and the hospital offered an alternative provider before treatment; otherwise
    the claim is treated as an emergency and carries no copay. No copay is assessed to a member whose
    membership records ai_an_status as true. No copay is assessed on a claim whose service date falls
    inside an active LTSS Service Coordination care enrollment, because holding that enrollment changes
    the member's cost sharing to institutional status. The copay assessed is never larger than the plan_paid_amount
    of the same claim and never larger than the room left under the member's aggregate cap (plan_evt_cost_share_cap);
    where several exemptions apply at once the claim simply carries no copay.
  eligibility: []
  params:
    per_tier:
      Prairie Ridge Expansion Adult:
        pcp_visit: =copay_pcp_visit_usd
        specialist_visit: =copay_specialist_visit_usd
        behavioral_health_visit: =copay_behavioral_health_visit_usd
        emergency_room_nonemergency: =copay_nonemergency_er_usd
        inpatient_stay: =copay_inpatient_stay_usd
        outpatient_hospital: =copay_outpatient_hospital_usd
        lab_xray: =copay_lab_xray_usd
        ambulance: =copay_ambulance_usd
      Prairie Ridge Family Care:
        pcp_visit: =copay_pcp_visit_usd
        specialist_visit: =copay_specialist_visit_usd
        behavioral_health_visit: =copay_behavioral_health_visit_usd
        emergency_room_nonemergency: =copay_nonemergency_er_usd
        inpatient_stay: =copay_inpatient_stay_usd
        outpatient_hospital: =copay_outpatient_hospital_usd
        lab_xray: =copay_lab_xray_usd
        ambulance: =copay_ambulance_usd
      Prairie Ridge CHIP Kids:
        pcp_visit: =copay_pcp_visit_usd
        specialist_visit: =copay_specialist_visit_usd
        behavioral_health_visit: =copay_behavioral_health_visit_usd
        emergency_room_nonemergency: =copay_nonemergency_er_usd
        inpatient_stay: =copay_inpatient_stay_usd
        outpatient_hospital: =copay_outpatient_hospital_usd
        lab_xray: =copay_lab_xray_usd
        ambulance: =copay_ambulance_usd
      Prairie Ridge Children's Medicaid:
        pcp_visit: =copay_pcp_visit_usd
        specialist_visit: =copay_specialist_visit_usd
        behavioral_health_visit: =copay_behavioral_health_visit_usd
        emergency_room_nonemergency: =copay_nonemergency_er_usd
        inpatient_stay: =copay_inpatient_stay_usd
        outpatient_hospital: =copay_outpatient_hospital_usd
        lab_xray: =copay_lab_xray_usd
        ambulance: =copay_ambulance_usd
      Prairie Ridge Pregnancy Care:
        pcp_visit: =copay_pcp_visit_usd
        specialist_visit: =copay_specialist_visit_usd
        behavioral_health_visit: =copay_behavioral_health_visit_usd
        emergency_room_nonemergency: =copay_nonemergency_er_usd
        inpatient_stay: =copay_inpatient_stay_usd
        outpatient_hospital: =copay_outpatient_hospital_usd
        lab_xray: =copay_lab_xray_usd
        ambulance: =copay_ambulance_usd
      Prairie Ridge ABD Care:
        pcp_visit: =copay_pcp_visit_usd
        specialist_visit: =copay_specialist_visit_usd
        behavioral_health_visit: =copay_behavioral_health_visit_usd
        emergency_room_nonemergency: =copay_nonemergency_er_usd
        inpatient_stay: =copay_inpatient_stay_usd
        outpatient_hospital: =copay_outpatient_hospital_usd
        lab_xray: =copay_lab_xray_usd
        ambulance: =copay_ambulance_usd
      Prairie Ridge Dual Complete:
        pcp_visit: =copay_pcp_visit_usd
        specialist_visit: =copay_specialist_visit_usd
        behavioral_health_visit: =copay_behavioral_health_visit_usd
        emergency_room_nonemergency: =copay_nonemergency_er_usd
        inpatient_stay: =copay_inpatient_stay_usd
        outpatient_hospital: =copay_outpatient_hospital_usd
        lab_xray: =copay_lab_xray_usd
        ambulance: =copay_ambulance_usd
  formula:
    when_not: >-
      adjudication_status == "denied" or service_category in ("preventive", "family_planning", "emergency_room_emergency")
    scheduled_copay: >-
      copay_pcp_visit_usd if service_category == "pcp_visit" else (copay_specialist_visit_usd if service_category
      == "specialist_visit" else (copay_behavioral_health_visit_usd if service_category == "behavioral_health_visit"
      else (copay_nonemergency_er_usd if service_category == "emergency_room_nonemergency" else (copay_inpatient_stay_usd
      if service_category == "inpatient_stay" else (copay_outpatient_hospital_usd if service_category
      == "outpatient_hospital" else (copay_lab_xray_usd if service_category == "lab_xray" else copay_ambulance_usd))))))
    member_cost_share: min(scheduled_copay, plan_paid_amount)
- id: plan_evt_cost_share_cap
  subject:
  - plan_claim_booked
  - plan_cost_share_refund
  rule: >-
    Total member cost sharing in one cap period may not exceed the category's cap percent of household
    income for that period, where the period income is plan_memberships.household_income_monthly times
    cost_share_cap_period_months as on file on the first day of the period, rounded to the cent. Cost
    sharing counted toward the cap is plan_msr_period_cost_share, which includes pharmacy copays where
    the category counts them. Once the cap is reached, later claims in the same period are booked with
    no copay. Where a claim's copay was booked while other copays not yet counted (for example pharmacy
    copays posted later) already reached the cap, the part of that claim's copay above the cap is refunded
    as one plan_cost_share_refund row referencing that claim's claim_number, and claims are examined in
    booked_date order so that only the claims that crossed the cap are refunded. A claim is refunded at
    most once per cap period and only if no plan_cost_share_refund row already references its claim number.
    The refund is due within cost_share_refund_days of the booked_date of the claim that crossed the cap,
    and the cap never carries over from one period to the next.
  eligibility:
  - id: refund_once_per_claim
    applies_to:
    - plan_cost_share_refund
    kind: dedup
    condition: >-
      A claim is refunded at most once per cap period and only if no plan_cost_share_refund row already
      references its claim number.
    evidence_fields:
    - plan_claims.related_claim_number
    - plan_claims.cost_share_period
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - plan_claims.related_claim_number
        - plan_claims.cost_share_period
      action_bindings:
        plan_claims.related_claim_number: related_claim_number
        plan_claims.cost_share_period: cost_share_period
    dedup_contract:
      table: plan_claims
      mode: separate_record
      object_bindings:
        related_claim_number: related_claim_number
        cost_share_period: cost_share_period
      duplicate_filters:
        event_type:
