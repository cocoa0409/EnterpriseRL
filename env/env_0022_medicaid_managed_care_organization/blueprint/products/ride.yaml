- id: ride_level_of_service
  subject:
  - ride_activate
  - ride_level_change
  rule: >-
    The level of service is the lowest tier whose mobility level meets the member's assessed need; a member
    able to use fixed-route transit within transit_max_walk_miles is placed on RideLink Transit Pass,
    and a member with a household vehicle and driver may choose RideLink Mileage Reimbursement instead
    of a sedan. Holding an approved or expired Durable Medical Equipment Authorization for a wheelchair
    documents wheelchair use, so such a member qualifies for RideLink Wheelchair Van on that record without
    a separate wheelchair assessment. RideLink Stretcher Van needs a physician certification no older
    than physician_cert_valid_days on each trip date. Each level is reassessed within level_reassessment_months
    of mobility_assessment_date, and a reassessment request is completed within mobility_assessment_business_days;
    the old level stays in force until the reassessment is recorded.
