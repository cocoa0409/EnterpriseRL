- id: ride_msr_no_shows_90d
  window: Rolling 90 calendar days ending on the trip date of the latest no-show, inclusive.
  measure: >-
    Count of ride_no_show rows with no_show_party = member plus ride_trip_cancelled rows with cancelled_by
    = member and notice_hours below cancellation_notice_hours, counting each leg once.
- id: ride_msr_month_appointments
  window: Calendar month of the pass.
  measure: >-
    Count of distinct appointment_date values on ride_trip_booked rows with trip_purpose not in value_added_purposes
    in the month, plus covered appointments the member shows on plan_claims with service_date in the month.
