events:
- type: ride_enroll
  target: ride_benefits
  mutation: create
  meaning: The member's transportation benefit is opened with the plan membership.
  grain: One row per benefit spell.
  fields:
    membership_id: Plan membership.
    variant_name: Level of service requested or defaulted.
    effective_date: First day.
  triggers: []
- type: ride_activate
  target: ride_benefits
  mutation:
    transition:
      from: pending_assessment
      to: active
  meaning: The mobility assessment sets the level of service and the benefit becomes usable.
  grain: One transition per spell.
  fields:
    variant_name: Assessed level of service.
    mobility_assessment_date: Assessment date.
    physician_certification_date: Certification date for stretcher service.
  triggers:
  - event: ride:ride_trip_allotment
    map: {}
- type: ride_level_change
  target: ride_benefits
  mutation: update
  meaning: A reassessment changes the level of service.
  grain: One update per reassessment.
  fields:
    variant_name: New level.
    mobility_assessment_date: Reassessment date.
    physician_certification_date: New certification date if any.
  triggers: []
- type: ride_suspend
  target: ride_benefits
  mutation:
    transition:
      from: active
      to: suspended
  meaning: No-shows suspend trips.
  grain: One transition per suspension.
  fields:
    suspension_start_date: First suspended day.
  triggers: []
- type: ride_resume
  target: ride_benefits
  mutation:
    transition:
      from: suspended
      to: active
  meaning: The suspension ends.
  grain: One transition per suspension.
  fields:
    suspension_start_date: Cleared when lifted.
  triggers: []
- type: ride_close
  target: ride_benefits
  mutation:
    transition:
    - from: pending_assessment
      to: closed
    - from: active
      to: closed
    - from: suspended
      to: closed
  meaning: The benefit ends.
  grain: One transition per spell.
  fields:
    end_date: Last day.
    close_reason: Controlled reason.
  triggers:
  - event: ride:ride_allotment_expire
    map:
      posted_date: end_date
- type: ride_trip_booked
  target: ride_trips
  meaning: A one-way trip leg is booked.
  grain: One row per booked leg.
  distinguish_by:
  - trip_number
  - leg
  fields:
    trip_number: Reservation number.
    leg: outbound or return.
    appointment_date: Appointment date.
    appointment_time: Appointment time.
    pickup_time: Scheduled pickup time.
    trip_purpose: Purpose.
    destination_name: Destination.
    destination_npi: Destination provider NPI.
    one_way_miles: One-way miles.
    escort_count: Escorts riding.
    booking_channel: Channel.
    event_date: Date booked.
    standing_order_number: Standing order the trip belongs to, if any.
  triggers: []
- type: ride_trip_completed
  target: ride_trips
  meaning: The transportation provider reports a leg completed.
  grain: One row per completed leg.
  distinguish_by:
  - trip_number
  - leg
  fields:
    trip_number: Reservation number.
    leg: Leg.
    trip_purpose: Purpose.
    one_way_miles: Miles driven.
    event_date: Trip date.
    minutes_late: Minutes past the pickup window, 0 if on time.
  triggers:
  - event: ride:ride_allotment_debit
    when:
      trip_purpose: *id001
    map:
      trips: 1
      trip_number: trip_number
      leg: leg
      posted_date: event_date
- type: ride_trip_cancelled
  target: ride_trips
  meaning: A booked leg is cancelled.
  grain: One row per cancelled leg.
  distinguish_by:
  - trip_number
  - leg
  fields:
    trip_number: Reservation number.
    leg: Leg.
    event_date: Date cancelled.
    cancelled_by: Who cancelled.
    notice_hours: Whole hours between the cancellation and the scheduled pickup.
  triggers: []
- type: ride_no_show
  target: ride_trips
  meaning: A leg is recorded as a no-show.
  grain: One row per no-show leg.
  distinguish_by:
  - trip_number
  - leg
  fields:
    trip_number: Reservation number.
    leg: Leg.
    event_date: Trip date.
    no_show_party: member or provider.
  triggers: []
- type: ride_late_pickup
  target: ride_trips
  meaning: A pickup is later than the late threshold.
  grain: One row per late leg.
  distinguish_by:
  - trip_number
  - leg
  fields:
    trip_number: Reservation number.
    leg: Leg.
    event_date: Trip date.
    minutes_late: Minutes past the pickup window.
  triggers: []
