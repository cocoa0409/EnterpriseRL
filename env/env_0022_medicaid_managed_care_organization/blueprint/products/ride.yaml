        out_of_state: =out_of_state_requires_approval
      RideLink Wheelchair Van:
        max_miles: =max_one_way_miles_standard
        lead_days: =long_distance_approval_lead_business_days
        lodging_miles: =lodging_threshold_miles
        lodging: =lodging_per_night_usd
        meals: =meals_per_day_usd
        out_of_state: =out_of_state_requires_approval
      RideLink Stretcher Van:
        max_miles: =max_one_way_miles_standard
        lead_days: =long_distance_approval_lead_business_days
        lodging_miles: =lodging_threshold_miles
        lodging: =lodging_per_night_usd
        meals: =meals_per_day_usd
        out_of_state: =out_of_state_requires_approval
- id: ride_value_added
  subject:
  - ride_trip_allotment
  - ride_allotment_debit
  - ride_allotment_expire
  - ride_trip_booked
  rule: >-
    value_added_trips_per_year one-way trips to value_added_purposes destinations within value_added_trip_max_miles
    are loaded on January 1, or on activation for a benefit activated during the year, prorated where
    allotment_prorated as value_added_trips_per_year times the whole calendar months left in the year
    including the activation month, divided by 12 and rounded down to a whole trip. Each completed value-added
    leg uses one trip; a value-added trip is booked only while trips_remaining is at least the number
    of legs booked, and unused trips expire on December 31 or when the benefit closes. A value-added trip
    never displaces a medical trip, and a level without value-added trips cannot book one.
  eligibility: []
  params:
    per_tier:
      RideLink Transit Pass:
        per_year: =value_added_trips_per_year
        purposes: =value_added_purposes
        max_miles: =value_added_trip_max_miles
        prorated: =allotment_prorated
      RideLink Mileage Reimbursement:
        per_year: =value_added_trips_per_year
        purposes: =value_added_purposes
        max_miles: =value_added_trip_max_miles
        prorated: =allotment_prorated
      RideLink Ambulatory Sedan:
        per_year: =value_added_trips_per_year
        purposes: =value_added_purposes
        max_miles: =value_added_trip_max_miles
        prorated: =allotment_prorated
      RideLink Door-to-Door Assist:
        per_year: =value_added_trips_per_year
        purposes: =value_added_purposes
        max_miles: =value_added_trip_max_miles
        prorated: =allotment_prorated
      RideLink Wheelchair Van:
        per_year: =value_added_trips_per_year
        purposes: =value_added_purposes
        max_miles: =value_added_trip_max_miles
        prorated: =allotment_prorated
      RideLink Stretcher Van:
        per_year: =value_added_trips_per_year
        purposes: =value_added_purposes
        max_miles: =value_added_trip_max_miles
        prorated: =allotment_prorated
- id: ride_standing_orders
  subject:
  - ride_standing_order_set
  - ride_trip_booked
  rule: >-
    Where standing_order_allowed, recurring trips for a treatment in standing_order_purposes are set up
    once as a standing order lasting at most standing_order_max_months, and each leg is booked automatically
    with booking_channel standing_order. The treatment schedule is confirmed by the treating provider
    before the order is set, and the order ends early when the benefit is suspended for a non-exempt purpose
    or closed.
  eligibility: []
  params:
    per_tier:
      RideLink Transit Pass:
        allowed: =standing_order_allowed
        max_months: =standing_order_max_months
        purposes: =standing_order_purposes
      RideLink Mileage Reimbursement:
        allowed: =standing_order_allowed
        max_months: =standing_order_max_months
        purposes: =standing_order_purposes
      RideLink Ambulatory Sedan:
        allowed: =standing_order_allowed
        max_months: =standing_order_max_months
        purposes: =standing_order_purposes
      RideLink Door-to-Door Assist:
        allowed: =standing_order_allowed
        max_months: =standing_order_max_months
        purposes: =standing_order_purposes
      RideLink Wheelchair Van:
        allowed: =standing_order_allowed
        max_months: =standing_order_max_months
        purposes: =standing_order_purposes
      RideLink Stretcher Van:
        allowed: =standing_order_allowed
        max_months: =standing_order_max_months
        purposes: =standing_order_purposes
- id: ride_transit_pass
  subject:
  - ride_transit_pass_issue
  rule: >-
    On RideLink Transit Pass, one pass of transit_pass_type is issued for a calendar month in which the
    member has at least transit_min_appointments_per_month covered appointments (ride_msr_month_appointments);
    otherwise single-ride tickets are mailed per appointment. A pass is never issued for a month already
    issued.
  eligibility: []
  params:
    per_tier:
      RideLink Transit Pass:
        pass: =transit_pass_type
        per_month: =transit_pass_per_month
        min_appts: =transit_min_appointments_per_month
        walk: =transit_max_walk_miles
      RideLink Mileage Reimbursement:
        pass: =transit_pass_type
        per_month: =transit_pass_per_month
        min_appts: =transit_min_appointments_per_month
        walk: =transit_max_walk_miles
      RideLink Ambulatory Sedan:
        pass: =transit_pass_type
        per_month: =transit_pass_per_month
        min_appts: =transit_min_appointments_per_month
        walk: =transit_max_walk_miles
      RideLink Door-to-Door Assist:
        pass: =transit_pass_type
        per_month: =transit_pass_per_month
        min_appts: =transit_min_appointments_per_month
        walk: =transit_max_walk_miles
      RideLink Wheelchair Van:
        pass: =transit_pass_type
        per_month: =transit_pass_per_month
        min_appts: =transit_min_appointments_per_month
        walk: =transit_max_walk_miles
      RideLink Stretcher Van:
        pass: =transit_pass_type
        per_month: =transit_pass_per_month
        min_appts: =transit_min_appointments_per_month
        walk: =transit_max_walk_miles
  measures:
  - ride_msr_month_appointments
- id: ride_escorts_and_stops
  subject:
  - ride_trip_booked
  rule: >-
    Up to escort_max escorts ride free; a member younger than escort_required_under_age must travel with
    an adult escort, and a trip for such a member without one is not booked. Where pharmacy_stop_allowed,
    one pharmacy stop of at most stop_max_minutes may be added to the return leg of a medical trip without
    using a value-added trip.
  eligibility: []
  params:
    per_tier:
      RideLink Transit Pass:
        escort_max: =escort_max
        escort_age: =escort_required_under_age
        stop: =pharmacy_stop_allowed
        stop_minutes: =stop_max_minutes
      RideLink Mileage Reimbursement:
        escort_max: =escort_max
        escort_age: =escort_required_under_age
        stop: =pharmacy_stop_allowed
        stop_minutes: =stop_max_minutes
      RideLink Ambulatory Sedan:
        escort_max: =escort_max
        escort_age: =escort_required_under_age
        stop: =pharmacy_stop_allowed
        stop_minutes: =stop_max_minutes
      RideLink Door-to-Door Assist:
        escort_max: =escort_max
        escort_age: =escort_required_under_age
        stop: =pharmacy_stop_allowed
        stop_minutes: =stop_max_minutes
      RideLink Wheelchair Van:
        escort_max: =escort_max
        escort_age: =escort_required_under_age
        stop: =pharmacy_stop_allowed
        stop_minutes: =stop_max_minutes
      RideLink Stretcher Van:
        escort_max: =escort_max
        escort_age: =escort_required_under_age
        stop: =pharmacy_stop_allowed
        stop_minutes: =stop_max_minutes
- id: ride_benefit_lifecycle
  subject:
  - ride_enroll
  - ride_close
  - ride_trip_completed
  rule: >-
    The benefit opens with the plan membership and closes on the membership's termination date; trips
    booked for dates after closure are cancelled by the broker and never count as no-shows. A leg is completed
    only on the provider's report, and a completed value-added leg uses one value-added trip.
  eligibility: []
