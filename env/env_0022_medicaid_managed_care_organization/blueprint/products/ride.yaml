- id: ride_no_show_policy
  subject:
  - ride_no_show
  - ride_trip_cancelled
  - ride_suspend
  - ride_resume
  rule: >-
    A member no-show is recorded when the member is not at the pickup point after the driver waited driver_wait_minutes
    within the pickup window, and a member cancellation made less than cancellation_notice_hours before
    the scheduled pickup counts as a no-show. No-shows caused by the provider, cancellations by the provider
    or the broker, and cancellations because the appointment was cancelled by the treating provider never
    count. Where no_show_suspension_applies, reaching no_show_limit_90_days member no-shows (ride_msr_no_shows_90d)
    suspends trips for no_show_suspension_days, except trips for dialysis, chemotherapy, radiation and
    hospital discharge, which are always booked. Trips resume only when no_show_suspension_days have passed
    since the suspension start date. The suspension days are counted in calendar days with the suspension
    start date as day 1, and trips resume on the day after the last suspended day.
  eligibility:
  - id: suspension_served
    applies_to:
    - ride_resume
    kind: time
    condition: >-
      Trips resume only when no_show_suspension_days have passed since the suspension start date.
    evidence_fields:
    - ride_benefits.ride_benefit_id
    - ride_benefits.suspension_start_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ride_benefits.ride_benefit_id
      action_bindings:
        ride_benefits.ride_benefit_id: ride_benefit_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the suspension start date
      anchor_source: ride_benefits.suspension_start_date
      relation: not_before
      duration_source: variants.no_show_suspension_days
      unit: calendar_days
      counting_rule: >-
        The suspension days are counted in calendar days with the suspension start date as day 1, and
        trips resume on the day after the last suspended day.
      boundary: inclusive
  params:
    per_tier:
      RideLink Transit Pass:
        wait: =driver_wait_minutes
        cancel_hours: =cancellation_notice_hours
        limit: =no_show_limit_90_days
        applies: =no_show_suspension_applies
        days: =no_show_suspension_days
      RideLink Mileage Reimbursement:
        wait: =driver_wait_minutes
        cancel_hours: =cancellation_notice_hours
        limit: =no_show_limit_90_days
        applies: =no_show_suspension_applies
        days: =no_show_suspension_days
      RideLink Ambulatory Sedan:
        wait: =driver_wait_minutes
        cancel_hours: =cancellation_notice_hours
        limit: =no_show_limit_90_days
        applies: =no_show_suspension_applies
        days: =no_show_suspension_days
      RideLink Door-to-Door Assist:
        wait: =driver_wait_minutes
        cancel_hours: =cancellation_notice_hours
        limit: =no_show_limit_90_days
        applies: =no_show_suspension_applies
        days: =no_show_suspension_days
      RideLink Wheelchair Van:
        wait: =driver_wait_minutes
        cancel_hours: =cancellation_notice_hours
        limit: =no_show_limit_90_days
        applies: =no_show_suspension_applies
        days: =no_show_suspension_days
      RideLink Stretcher Van:
        wait: =driver_wait_minutes
        cancel_hours: =cancellation_notice_hours
        limit: =no_show_limit_90_days
        applies: =no_show_suspension_applies
        days: =no_show_suspension_days
  measures:
  - ride_msr_no_shows_90d
- id: ride_late_pickup_policy
  subject:
  - ride_late_pickup
  - ride_mileage_approved
  rule: >-
    A pickup more than late_threshold_minutes after the end of the pickup window is a late pickup, and
    the member may then take an alternative ride and be reimbursed its receipted cost up to late_pickup_alt_reimbursement_max_usd
    as a late_pickup_alternative reimbursement. The alternative ride is reimbursed only where a ride_late_pickup
    row exists for the same trip number and leg; a member who left before the late threshold was reached
    is not reimbursed.
  eligibility: []
  params:
    per_tier:
      RideLink Transit Pass:
        threshold: =late_threshold_minutes
        alt_max: =late_pickup_alt_reimbursement_max_usd
      RideLink Mileage Reimbursement:
        threshold: =late_threshold_minutes
        alt_max: =late_pickup_alt_reimbursement_max_usd
      RideLink Ambulatory Sedan:
        threshold: =late_threshold_minutes
        alt_max: =late_pickup_alt_reimbursement_max_usd
      RideLink Door-to-Door Assist:
        threshold: =late_threshold_minutes
        alt_max: =late_pickup_alt_reimbursement_max_usd
      RideLink Wheelchair Van:
        threshold: =late_threshold_minutes
        alt_max: =late_pickup_alt_reimbursement_max_usd
      RideLink Stretcher Van:
        threshold: =late_threshold_minutes
        alt_max: =late_pickup_alt_reimbursement_max_usd
- id: ride_mileage_reimbursement
  subject:
  - ride_mileage_approved
  - ride_mileage_denied
  - ride_mileage_paid
  rule: >-
    Mileage is reimbursed only on RideLink Mileage Reimbursement, for a trip registered with a trip number
    before the appointment where mileage_trip_preapproval_required, at mileage_rate_usd per approved mile
    measured by mileage_distance_basis for the round trip. Attendance is proven by a paid claim on plan_claims
    for the member with the trip's appointment date and destination provider; without one the claim is
    denied with denial_reason no_attended_appointment. A reimbursement claim is considered only when received
    no later than mileage_claim_filing_days after the trip date. The filing days are counted in calendar
    days from the day after the trip date, and a claim received on the last day still qualifies. One trip
    leg is reimbursed at most once for each reimbursement type. A claim received late is denied with denial_reason
    filed_late, and an approved amount is paid within mileage_payment_days by the member's chosen payment
    method.
  eligibility:
  - id: filing_window
    applies_to:
    - ride_mileage_approved
    - ride_mileage_denied
    kind: time
    condition: >-
      A reimbursement claim is considered only when received no later than mileage_claim_filing_days after
      the trip date.
    evidence_fields:
    - ride_trips.trip_number
    - ride_trips.appointment_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ride_trips.trip_number
      action_bindings:
        ride_trips.trip_number: trip_number
    temporal_basis:
      clock: frozen_time
      anchor_event: the trip date
      anchor_source: ride_trips.appointment_date
      relation: not_after
      duration_source: variants.mileage_claim_filing_days
      unit: calendar_days
      counting_rule: >-
        The filing days are counted in calendar days from the day after the trip date, and a claim received
        on the last day still qualifies.
      boundary: inclusive
  - id: one_claim_per_leg
    applies_to:
    - ride_mileage_approved
    kind: dedup
    condition: One trip leg is reimbursed at most once for each reimbursement type.
    evidence_fields:
    - ride_ledger.trip_number
    - ride_ledger.leg
    - ride_ledger.reimbursement_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ride_ledger.trip_number
        - ride_ledger.leg
        - ride_ledger.reimbursement_type
      action_bindings:
        ride_ledger.trip_number: trip_number
        ride_ledger.leg: leg
        ride_ledger.reimbursement_type: reimbursement_type
    dedup_contract:
      table: ride_ledger
      mode: separate_record
      object_bindings:
        trip_number: trip_number
        leg: leg
        reimbursement_type: reimbursement_type
      duplicate_filters:
        event_type:
        - ride_mileage_approved
      distinct_fields:
      - posted_date
  params:
    per_tier:
      RideLink Transit Pass:
        rate: =mileage_rate_usd
        basis: =mileage_distance_basis
        preapproval: =mileage_trip_preapproval_required
        filing_days: =mileage_claim_filing_days
        payment_days: =mileage_payment_days
      RideLink Mileage Reimbursement:
        rate: =mileage_rate_usd
        basis: =mileage_distance_basis
        preapproval: =mileage_trip_preapproval_required
        filing_days: =mileage_claim_filing_days
        payment_days: =mileage_payment_days
      RideLink Ambulatory Sedan:
        rate: =mileage_rate_usd
        basis: =mileage_distance_basis
        preapproval: =mileage_trip_preapproval_required
        filing_days: =mileage_claim_filing_days
        payment_days: =mileage_payment_days
      RideLink Door-to-Door Assist:
        rate: =mileage_rate_usd
        basis: =mileage_distance_basis
        preapproval: =mileage_trip_preapproval_required
        filing_days: =mileage_claim_filing_days
        payment_days: =mileage_payment_days
      RideLink Wheelchair Van:
        rate: =mileage_rate_usd
        basis: =mileage_distance_basis
        preapproval: =mileage_trip_preapproval_required
        filing_days: =mileage_claim_filing_days
        payment_days: =mileage_payment_days
      RideLink Stretcher Van:
        rate: =mileage_rate_usd
        basis: =mileage_distance_basis
        preapproval: =mileage_trip_preapproval_required
        filing_days: =mileage_claim_filing_days
        payment_days: =mileage_payment_days
  formula:
    mileage_amount: round(approved_miles * mileage_rate_usd, 2)
    amount: mileage_amount + lodging_nights * lodging_per_night_usd + meal_days * meals_per_day_usd
- id: ride_long_distance
  subject:
  - ride_trip_booked
  - ride_mileage_approved
  rule: >-
    A trip whose one-way miles exceed max_one_way_miles_standard is long distance and is booked only when
    requested at least long_distance_approval_lead_business_days before the appointment and the treating
    provider confirms that no qualified provider is nearer; an out-of-state trip also needs plan approval
    where out_of_state_requires_approval. For an approved long-distance trip of at least lodging_threshold_miles
    one way, lodging up to lodging_per_night_usd per night and meals up to meals_per_day_usd per travel
    day are reimbursed as a lodging_meals reimbursement.
  eligibility: []
  params:
    per_tier:
      RideLink Transit Pass:
        max_miles: =max_one_way_miles_standard
        lead_days: =long_distance_approval_lead_business_days
        lodging_miles: =lodging_threshold_miles
        lodging: =lodging_per_night_usd
        meals: =meals_per_day_usd
        out_of_state: =out_of_state_requires_approval
      RideLink Mileage Reimbursement:
        max_miles: =max_one_way_miles_standard
        lead_days: =long_distance_approval_lead_business_days
        lodging_miles: =lodging_threshold_miles
        lodging: =lodging_per_night_usd
        meals: =meals_per_day_usd
        out_of_state: =out_of_state_requires_approval
      RideLink Ambulatory Sedan:
        max_miles: =max_one_way_miles_standard
        lead_days: =long_distance_approval_lead_business_days
        lodging_miles: =lodging_threshold_miles
        lodging: =lodging_per_night_usd
        meals: =meals_per_day_usd
        out_of_state: =out_of_state_requires_approval
      RideLink Door-to-Door Assist:
        max_miles: =max_one_way_miles_standard
        lead_days: =long_distance_approval_lead_business_days
        lodging_miles: =lodging_threshold_miles
        lodging: =lodging_per_night_usd
