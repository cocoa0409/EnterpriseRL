# Product charter: Non-Emergency Medical Transportation. Output of erl-scenario-blueprint.
category: ride
display_name: Non-Emergency Medical Transportation
binding:
  holding_table: ride_benefits
  event_tables:
  - ride_trips
  - ride_ledger
  status_field: status
  variant_field: variant_name
  quantity_fields:
    trips_remaining: value_added_trips
    reimbursement_owed: mileage_reimbursement
lifecycle:
  states:
  - pending_assessment
  - active
  - suspended
  - closed
  transitions:
  - from: pending_assessment
    to: active
    by: system
    means: The mobility assessment sets the level of service and the benefit becomes usable.
  - from: pending_assessment
    to: closed
    by: system
    means: The benefit is closed before assessment (membership ended or request withdrawn).
  - from: active
    to: suspended
    by: system
    means: Member no-shows reach the limit and trips are suspended.
  - from: suspended
    to: active
    by: system
    means: The suspension period ends.
  - from: active
    to: closed
    by: system
    means: The benefit ends with the membership.
  - from: suspended
    to: closed
    by: system
    means: The benefit ends during a suspension.
accounts:
- key: value_added_trips
  unit: one-way trips
  meaning: >-
    Value-added trips loaded for the benefit year and not yet used or expired; the integral view is ride_benefits.trips_remaining.
- key: mileage_reimbursement
  unit: USD
  meaning: >-
    Reimbursements approved and not yet paid to the member; the integral view is ride_benefits.reimbursement_owed.
parameter_schema:
  vehicle_type: Vehicle or mode used for trips (enum string).
  driver_assist_level: Assistance the driver gives (enum string).
  booking_channels: Channels through which trips are booked (list).
  advance_booking_business_days: >-
    Business days (Monday-Friday excluding state holidays) between the booking date and a routine appointment
    date (integer days).
  max_advance_booking_days: >-
    Calendar days ahead of the appointment date that a trip may be booked at most (integer days).
  same_day_urgent_allowed: >-
    Whether an urgent same-day trip may be booked when the treating provider confirms the urgent appointment
    (boolean).
  urgent_pickup_hours: Hours within which an urgent trip is picked up (integer hours; 0 where not allowed).
  hospital_discharge_pickup_hours: >-
    Hours within which a hospital discharge trip is picked up (integer hours; 0 where not applicable).
  pickup_window_minutes: >-
    Minutes before or after the scheduled pickup time within which a pickup is on time (integer minutes).
  max_early_arrival_minutes: Most minutes before the appointment time the member may be dropped off (integer
    minutes).
  will_call_return_pickup_minutes: >-
    Minutes after the member calls for a will-call return within which pickup happens (integer minutes).
  driver_wait_minutes: >-
    Minutes the driver waits after arriving within the pickup window before recording a member no-show
    (integer minutes).
  late_threshold_minutes: Minutes past the end of the pickup window after which a pickup is late (integer
    minutes).
  late_pickup_alt_reimbursement_max_usd: >-
    Most reimbursed for an alternative ride the member takes after a late pickup (USD, 2 decimals; 0.00
    where not offered).
  cancellation_notice_hours: >-
    Hours before the scheduled pickup time by which a member cancellation is on time; a later cancellation
    counts as a no-show (integer hours).
  no_show_limit_90_days: >-
    Member no-shows within a rolling 90 days that trigger a suspension (integer; 0 where suspensions do
    not apply).
  no_show_suspension_applies: Whether member no-shows can suspend the benefit (boolean).
  no_show_suspension_days: Calendar days a no-show suspension lasts (integer days; 0 where suspensions
    do not apply).
  escort_max: Most escorts or attendants who ride free with the member (integer).
  escort_required_under_age: >-
    Members younger than this age in completed years must travel with an adult escort (integer years).
  max_one_way_miles_standard: >-
    One-way miles above which a trip is long distance and needs advance approval (integer miles).
  long_distance_approval_lead_business_days: >-
    Business days before the appointment by which a long-distance trip must be requested (integer days).
  mileage_rate_usd: Reimbursement per approved mile (USD per mile, 3 decimals).
  mileage_distance_basis: How approved miles are measured (enum string).
  mileage_trip_preapproval_required: >-
    Whether a mileage trip must be registered with a trip number before the appointment (boolean).
  mileage_claim_filing_days: >-
    Calendar days after the trip date within which a mileage claim must be received (integer days; 0 where
    not applicable).
  mileage_payment_days: >-
    Calendar days after approval within which an approved reimbursement is paid (integer days).
  lodging_threshold_miles: >-
    One-way miles at or above which lodging and meals may be reimbursed for an approved long-distance
    trip (integer miles).
  lodging_per_night_usd: Most reimbursed per lodging night (USD, 2 decimals).
  meals_per_day_usd: Most reimbursed per travel day for meals (USD, 2 decimals).
  transit_pass_type: Transit pass issued (enum string).
  transit_pass_per_month: Transit passes issued per calendar month (integer).
  transit_min_appointments_per_month: Covered appointments in the month needed for a monthly pass (integer).
  transit_max_walk_miles: Longest walk to a fixed-route stop for the transit tier (miles, 2 decimals).
  value_added_trips_per_year: >-
    One-way value-added trips to non-medical destinations loaded per benefit year (integer trips).
  value_added_purposes: Destinations that value-added trips may serve (list).
  value_added_trip_max_miles: Longest one-way distance of a value-added trip (integer miles).
  allotment_prorated: >-
    Whether a benefit activated after January is loaded with the allotment prorated by whole months left
    in the year (boolean).
  standing_order_allowed: Whether recurring trips may be set up as a standing order (boolean).
  standing_order_max_months: Most months one standing order lasts before renewal (integer months).
  standing_order_purposes: Treatments that qualify for a standing order (list).
  level_reassessment_months: >-
    Months after mobility_assessment_date by which the level of service must be reassessed (integer months).
  physician_certification_required: Whether a physician certification of medical need is required (boolean).
  physician_cert_valid_days: Calendar days a physician certification stays valid (integer days; 0 where
    not required).
  mobility_assessment_business_days: >-
    Business days after a request within which the mobility assessment is completed (integer days).
  pharmacy_stop_allowed: Whether one pharmacy stop on the return leg of a medical trip is allowed (boolean).
  stop_max_minutes: Longest pharmacy stop (integer minutes; 0 where not allowed).
  out_of_state_requires_approval: Whether trips to an out-of-state provider need plan approval (boolean).
  trip_service_hours: Hours during which trips run (string HH:MM-HH:MM).
  max_onboard_minutes: Longest time the member rides on a shared trip (integer minutes; 0 where not applicable).
  shared_ride_allowed: Whether trips may be shared with other members (boolean).
