- id: rx_emergency_supply_rule
  subject:
  - rx_emergency_supply
  rule: >-
    When a covered drug rejects for prior authorization or non-formulary status and the request is pending,
    the pharmacy dispenses an emergency supply of emergency_supply_days, at most emergency_supply_per_request
    per pending request per drug, with no copay. An emergency supply is dispensed only on a coverage in
    active or restricted status. A drug Part D covers for a PrairieRx Dual Wrap member never gets a Medicaid
    emergency supply.
  eligibility:
  - id: coverage_in_force
    applies_to:
    - rx_emergency_supply
    kind: state
    condition: An emergency supply is dispensed only on a coverage in active or restricted status.
    evidence_fields:
    - rx_coverages.rx_coverage_id
    - rx_coverages.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_coverages.rx_coverage_id
      action_bindings:
        rx_coverages.rx_coverage_id: rx_coverage_id
    state_contract:
      field: rx_coverages.status
      allowed:
      - active
      - restricted
  params:
    per_tier:
      PrairieRx Dual Wrap:
        days: =emergency_supply_days
        per_request: =emergency_supply_per_request
      PrairieRx Expansion Adult:
        days: =emergency_supply_days
        per_request: =emergency_supply_per_request
      PrairieRx Adult:
        days: =emergency_supply_days
        per_request: =emergency_supply_per_request
      PrairieRx Children:
        days: =emergency_supply_days
        per_request: =emergency_supply_per_request
      PrairieRx Maternity:
        days: =emergency_supply_days
        per_request: =emergency_supply_per_request
      PrairieRx Complex Care:
        days: =emergency_supply_days
        per_request: =emergency_supply_per_request
      PrairieRx Long-Term Care:
        days: =emergency_supply_days
        per_request: =emergency_supply_per_request
- id: rx_lock_in
  subject:
  - rx_lock_in_start
  - rx_lock_in_end
  - rx_lock_in_pharmacy_change
  - rx_lock_in_change_log
  - rx_fill_rejected
  rule: >-
    A member of a lock_in_eligible plan who used at least lock_in_trigger_prescribers_90d prescribers
    or lock_in_trigger_pharmacies_90d pharmacies for controlled substances within 90 days may be locked
    in to one pharmacy and one prescriber for lock_in_duration_months after lock_in_notice_days of written
    notice. During lock-in any fill at another pharmacy rejects with lock_in_pharmacy_mismatch and a controlled
    substance from another prescriber rejects with lock_in_prescriber_mismatch, except an emergency fill
    where lock_in_emergency_override_allowed and the lock-in pharmacy is closed or out of stock. The member
    may change the lock-in pharmacy for member_preference only while rx_msr_lock_in_changes_365d is below
    lock_in_pharmacy_change_per_12_months; a change because the member moved or the pharmacy closed is
    always allowed and is logged with that reason. A lock-in ends on lock_in_end_date and is never extended
    without a new review and notice.
  eligibility:
  - id: pharmacy_change_limit
    applies_to:
    - rx_lock_in_pharmacy_change
    kind: authorization
    condition: >-
      The member may change the lock-in pharmacy for member_preference only while rx_msr_lock_in_changes_365d
      is below lock_in_pharmacy_change_per_12_months; a change because the member moved or the pharmacy
      closed is always allowed and is logged with that reason.
    evidence_fields:
    - rx_coverages.rx_coverage_id
    - rx_coverages.lock_in_pharmacy_npi
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_coverages.rx_coverage_id
      action_bindings:
        rx_coverages.rx_coverage_id: rx_coverage_id
  params:
    per_tier:
      PrairieRx Dual Wrap:
        eligible: =lock_in_eligible
        months: =lock_in_duration_months
        prescribers: =lock_in_trigger_prescribers_90d
        pharmacies: =lock_in_trigger_pharmacies_90d
        notice_days: =lock_in_notice_days
        changes: =lock_in_pharmacy_change_per_12_months
        emergency: =lock_in_emergency_override_allowed
      PrairieRx Expansion Adult:
        eligible: =lock_in_eligible
        months: =lock_in_duration_months
        prescribers: =lock_in_trigger_prescribers_90d
        pharmacies: =lock_in_trigger_pharmacies_90d
        notice_days: =lock_in_notice_days
        changes: =lock_in_pharmacy_change_per_12_months
        emergency: =lock_in_emergency_override_allowed
      PrairieRx Adult:
        eligible: =lock_in_eligible
        months: =lock_in_duration_months
        prescribers: =lock_in_trigger_prescribers_90d
        pharmacies: =lock_in_trigger_pharmacies_90d
        notice_days: =lock_in_notice_days
        changes: =lock_in_pharmacy_change_per_12_months
        emergency: =lock_in_emergency_override_allowed
      PrairieRx Children:
        eligible: =lock_in_eligible
        months: =lock_in_duration_months
        prescribers: =lock_in_trigger_prescribers_90d
        pharmacies: =lock_in_trigger_pharmacies_90d
        notice_days: =lock_in_notice_days
        changes: =lock_in_pharmacy_change_per_12_months
        emergency: =lock_in_emergency_override_allowed
      PrairieRx Maternity:
        eligible: =lock_in_eligible
        months: =lock_in_duration_months
        prescribers: =lock_in_trigger_prescribers_90d
        pharmacies: =lock_in_trigger_pharmacies_90d
        notice_days: =lock_in_notice_days
        changes: =lock_in_pharmacy_change_per_12_months
        emergency: =lock_in_emergency_override_allowed
      PrairieRx Complex Care:
        eligible: =lock_in_eligible
        months: =lock_in_duration_months
        prescribers: =lock_in_trigger_prescribers_90d
        pharmacies: =lock_in_trigger_pharmacies_90d
        notice_days: =lock_in_notice_days
        changes: =lock_in_pharmacy_change_per_12_months
        emergency: =lock_in_emergency_override_allowed
      PrairieRx Long-Term Care:
        eligible: =lock_in_eligible
        months: =lock_in_duration_months
        prescribers: =lock_in_trigger_prescribers_90d
