- id: rx_otc_allowance
  subject:
  - rx_otc_load
  - rx_otc_purchase
  - rx_otc_forfeit
  rule: >-
    The OTC allowance is loaded on the first day of each calendar quarter and spent only on catalog items
    through otc_channels; a purchase never exceeds otc_balance and the member pays the difference at the
    register. Mail catalog and online orders are limited to otc_mail_orders_per_quarter per quarter (rx_msr_otc_orders_quarter);
    retail purchases are not limited in number. The allowance is loaded and spent only on a coverage in
    active or restricted status. Unused allowance is forfeited on the last day of the quarter or on the
    coverage end date, whichever comes first, and never rolls over where otc_rollover is false.
  eligibility:
  - id: otc_on_open_coverage
    applies_to:
    - rx_otc_purchase
    - rx_otc_load
    kind: state
    condition: The allowance is loaded and spent only on a coverage in active or restricted status.
    evidence_fields:
    - rx_coverages.rx_coverage_id
    - rx_coverages.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_coverages.rx_coverage_id
      action_bindings:
        rx_coverages.rx_coverage_id: rx_coverage_id
    state_contract:
      field: rx_coverages.status
      allowed:
      - active
      - restricted
  params:
    per_tier:
      PrairieRx Dual Wrap:
        quarterly: =otc_quarterly_allowance_usd
        rollover: =otc_rollover
        channels: =otc_channels
        mail_orders: =otc_mail_orders_per_quarter
      PrairieRx Expansion Adult:
        quarterly: =otc_quarterly_allowance_usd
        rollover: =otc_rollover
        channels: =otc_channels
        mail_orders: =otc_mail_orders_per_quarter
      PrairieRx Adult:
        quarterly: =otc_quarterly_allowance_usd
        rollover: =otc_rollover
        channels: =otc_channels
        mail_orders: =otc_mail_orders_per_quarter
      PrairieRx Children:
        quarterly: =otc_quarterly_allowance_usd
        rollover: =otc_rollover
        channels: =otc_channels
        mail_orders: =otc_mail_orders_per_quarter
      PrairieRx Maternity:
        quarterly: =otc_quarterly_allowance_usd
        rollover: =otc_rollover
        channels: =otc_channels
        mail_orders: =otc_mail_orders_per_quarter
      PrairieRx Complex Care:
        quarterly: =otc_quarterly_allowance_usd
        rollover: =otc_rollover
        channels: =otc_channels
        mail_orders: =otc_mail_orders_per_quarter
      PrairieRx Long-Term Care:
        quarterly: =otc_quarterly_allowance_usd
        rollover: =otc_rollover
        channels: =otc_channels
        mail_orders: =otc_mail_orders_per_quarter
  formula:
    forfeit_amount: otc_balance
  measures:
  - rx_msr_otc_orders_quarter
- id: rx_transition_fill
  subject:
  - rx_fill
  rule: >-
    A new member already taking a non-formulary drug receives one transition fill of up to transition_fill_days_supply
    within transition_fill_window_days after the rx coverage effective_date, recorded with fill_type transition_fill,
    while an exception is requested. A second transition fill for the same drug is never paid.
  eligibility: []
  params:
    per_tier:
      PrairieRx Dual Wrap:
        window_days: =transition_fill_window_days
        days_supply: =transition_fill_days_supply
      PrairieRx Expansion Adult:
        window_days: =transition_fill_window_days
        days_supply: =transition_fill_days_supply
      PrairieRx Adult:
        window_days: =transition_fill_window_days
        days_supply: =transition_fill_days_supply
      PrairieRx Children:
        window_days: =transition_fill_window_days
        days_supply: =transition_fill_days_supply
      PrairieRx Maternity:
        window_days: =transition_fill_window_days
        days_supply: =transition_fill_days_supply
      PrairieRx Complex Care:
        window_days: =transition_fill_window_days
        days_supply: =transition_fill_days_supply
      PrairieRx Long-Term Care:
        window_days: =transition_fill_window_days
        days_supply: =transition_fill_days_supply
- id: rx_dual_wrap
  subject:
  - rx_fill
  - rx_fill_rejected
  rule: >-
    For a PrairieRx Dual Wrap member Medicare Part D pays first: a drug Part D covers is rejected with
    reject_code not_covered_medicare_part_d, and only drugs Part D excludes, such as covered OTC drugs
    and prescription vitamins, are paid by Medicaid. Part D premiums and copays are never paid from the
    pharmacy benefit.
  eligibility: []
  params:
    per_tier:
      PrairieRx Dual Wrap:
        part_d_primary: =part_d_primary
      PrairieRx Expansion Adult:
        part_d_primary: =part_d_primary
      PrairieRx Adult:
        part_d_primary: =part_d_primary
      PrairieRx Children:
        part_d_primary: =part_d_primary
      PrairieRx Maternity:
        part_d_primary: =part_d_primary
      PrairieRx Complex Care:
        part_d_primary: =part_d_primary
      PrairieRx Long-Term Care:
        part_d_primary: =part_d_primary
- id: rx_opioid_safety
  subject:
  - rx_fill
  - rx_fill_rejected
  rule: >-
    An opioid fill whose daily MME exceeds mme_daily_limit, or a first opioid fill beyond opioid_naive_initial_days_supply
    for a member with no opioid fill in the prior 90 days, rejects with reject_code prior_authorization_required
    until approved. Members in hospice or with an active cancer diagnosis on the prescription are exempt;
    naloxone always pays with no copay. Specialty drugs are filled only at the designated specialty pharmacy
    where specialty_pharmacy_required.
  eligibility: []
  params:
    per_tier:
      PrairieRx Dual Wrap:
        mme: =mme_daily_limit
        naive_days: =opioid_naive_initial_days_supply
        specialty: =specialty_pharmacy_required
      PrairieRx Expansion Adult:
        mme: =mme_daily_limit
        naive_days: =opioid_naive_initial_days_supply
        specialty: =specialty_pharmacy_required
      PrairieRx Adult:
        mme: =mme_daily_limit
        naive_days: =opioid_naive_initial_days_supply
        specialty: =specialty_pharmacy_required
      PrairieRx Children:
        mme: =mme_daily_limit
        naive_days: =opioid_naive_initial_days_supply
        specialty: =specialty_pharmacy_required
      PrairieRx Maternity:
        mme: =mme_daily_limit
        naive_days: =opioid_naive_initial_days_supply
        specialty: =specialty_pharmacy_required
      PrairieRx Complex Care:
        mme: =mme_daily_limit
        naive_days: =opioid_naive_initial_days_supply
        specialty: =specialty_pharmacy_required
      PrairieRx Long-Term Care:
        mme: =mme_daily_limit
        naive_days: =opioid_naive_initial_days_supply
        specialty: =specialty_pharmacy_required
- id: rx_fill_reversal_rule
  subject:
  - rx_fill_reversal
  rule: >-
    A pharmacy may reverse a paid fill identified by its rx_number and fill_date, and the reversal returns
    the fill's copay and removes the fill from the monthly count. A reversal is accepted no later than
    reversal_window_days after the original fill date. The reversal days are counted in calendar days
    from the day after the fill date, and a reversal on the last day still qualifies. A fill is reversed
    at most once.
  eligibility:
  - id: reversal_window
    applies_to:
    - rx_fill_reversal
    kind: time
    condition: A reversal is accepted no later than reversal_window_days after the original fill date.
    evidence_fields:
    - rx_fills.rx_number
    - rx_fills.fill_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_fills.rx_number
        - rx_fills.fill_date
      action_bindings:
        rx_fills.rx_number: rx_number
        rx_fills.fill_date: fill_date
    temporal_basis:
      clock: frozen_time
      anchor_event: the original fill date
      anchor_source: rx_fills.fill_date
      relation: not_after
      duration_source: variants.reversal_window_days
      unit: calendar_days
      counting_rule: >-
        The reversal days are counted in calendar days from the day after the fill date, and a reversal
        on the last day still qualifies.
      boundary: inclusive
  params:
    per_tier:
      PrairieRx Dual Wrap:
        window: =reversal_window_days
      PrairieRx Expansion Adult:
        window: =reversal_window_days
      PrairieRx Adult:
        window: =reversal_window_days
      PrairieRx Children:
        window: =reversal_window_days
      PrairieRx Maternity:
        window: =reversal_window_days
      PrairieRx Complex Care:
        window: =reversal_window_days
      PrairieRx Long-Term Care:
        window: =reversal_window_days
- id: rx_coverage_lifecycle
  subject:
  - rx_activate
  - rx_terminate
  rule: >-
    Pharmacy coverage becomes effective on the plan membership's coverage start date and ends on the membership's
    termination date or the day before a new pharmacy plan starts after a category change. When coverage
    ends, the unused OTC allowance is forfeited the same day and approved exceptions end with the coverage.
  eligibility: []
