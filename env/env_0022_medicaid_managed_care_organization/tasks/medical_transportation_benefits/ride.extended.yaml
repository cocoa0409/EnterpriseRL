      - when: exactly one of those two holds
        value: K('partial_late_allowance')
      - when: otherwise
        value: 0 (no allowance)
      baseline:
        allowance_tier: '0'
      evidence:
      - cross_category
      cross_difficulty: plan
    baseline:
      rule: >-
        A trip settlement releases every approved reimbursement entry the ledger carries for the trip, found by the
