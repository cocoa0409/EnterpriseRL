        The lodging part is the tapered lodging pay; the meals part is the meal days times the sum of the daily meals
        allowance and the meal supplement, and that product is then raised by the attendant share; the amount is the
        lodging part plus the meals part, rounded to the nearest cent once, on the final amount only.
    factors:
    - id: stay_nights_counted
      effect: parameter
      decides: stay_nights
      bindings:
      - first_start
      - last_start
      - stay_nights
      ladder:
      - when: >-
          the outbound leg's appointment starts before the early-start time and the return leg's appointment starts
          at or after the late-finish time
        value: the nights between the two appointment dates plus two added nights
      - when: >-
          exactly one of: the outbound leg's appointment starts before the early-start time; the return leg's appointment
          starts at or after the late-finish time
        value: the nights between the two appointment dates plus one added night
      - when: otherwise
        value: the nights between the two appointment dates, no added night
      baseline:
        stay_nights: base_nights
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: stay_length_lodging_taper
      effect: method
      decides: lodging_part
      bindings:
      - base_nights
      - lodging_part
      ladder:
      - when: the nights between the two appointment dates are at least the monthly-stay nights
        method: >-
          three-band taper: the first weekly-stay nights at the level's standard nightly allowance, the nights up
          to the monthly-stay nights at the weekly-stay rate, every later night at the monthly-stay rate
      - when: they are at least the weekly-stay nights and fewer than the monthly-stay nights
        method: >-
          two-band taper: the first weekly-stay nights at the standard nightly allowance, every later night at the
          weekly-stay rate
      - when: otherwise
        method: 'flat: every lodging night at the standard nightly allowance'
      baseline:
        lodging_part: stay_nights * P('lodging_per_night_usd')
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: drive_length_edge_day_share
      effect: parameter
      decides: edge_day_share
      bindings:
      - one_way
      - edge_day_share
      ladder:
      - when: the longest registered one-way miles among the trip's legs are under the mid-drive miles
        value: K('short_drive_edge_share')
      - when: those miles are at least the mid-drive miles and under the full-day-drive miles
        value: K('mid_drive_edge_share')
      - when: otherwise
        value: 1 (the edge days count in full)
      baseline:
        edge_day_share: '1'
      evidence:
      - history
      cross_difficulty: null
    - id: treatment_course_meals_rate
      effect: parameter
      decides: meals_rate
      bindings:
      - purpose
      - course_claims
      - meals_rate
      ladder:
      - when: >-
          the outbound leg's trip purpose is radiation or chemotherapy and the member has at least the course claim
          count of paid outpatient hospital claims with service dates in the last three months
        value: K('course_meals_rate')
      - when: exactly one of those two holds
        value: K('treatment_meals_rate')
      - when: otherwise
        value: P('meals_per_day_usd')
      baseline:
        meals_rate: P('meals_per_day_usd')
      evidence:
      - history
      - cross_category
      cross_difficulty: plan
    - id: income_meal_supplement
      effect: parameter
      decides: meal_supplement
      bindings:
      - income_pct
      - meal_supplement
      ladder:
      - when: >-
          the active plan membership records household income at or below the deep-poverty percent of the federal
          poverty level
        value: K('deep_poverty_supplement')
      - when: the recorded household income is above the deep-poverty percent and at or below the poverty percent
        value: K('poverty_supplement')
      - when: otherwise
        value: 0 (no supplement)
      baseline:
        meal_supplement: '0'
      evidence:
      - cross_category
      cross_difficulty: plan
    - id: attendant_meals_share
      effect: parameter
      decides: attendant_share
      bindings:
      - wheelchair_status
      - plan_category
      - attendant_share
      ladder:
      - when: >-
          an approved or expired standard manual wheelchair (K0001) equipment authorization is on record and the active
          plan membership is in Prairie Ridge ABD Care or Prairie Ridge Dual Complete
        value: K('attendant_full_share')
      - when: exactly one of those two holds
        value: K('attendant_half_share')
      - when: otherwise
        value: 0 (no attendant share)
      baseline:
        attendant_share: '0'
      evidence:
      - cross_category
      cross_difficulty: auth
    baseline:
      rule: >-
        The lodging nights are the nights between the outbound leg's appointment date and the return leg's appointment
        date. Each lodging night is paid at the level's standard nightly lodging allowance. The travel days are the
        lodging nights plus one, and each travel day is paid the level's standard daily meals allowance in full. The
        entry's amount is the lodging part plus the meals part, rounded to the nearest cent.
      params:
      - lodging_per_night_usd
      - meals_per_day_usd
    inputs:
      history:
      - table: ride_trips
        aggregate: latest
        field: appointment_date
        filters:
          event_type: ride_trip_booked
      - table: ride_trips
        aggregate: latest
        field: appointment_time
        filters:
          event_type: ride_trip_booked
      - table: ride_trips
        aggregate: max
        field: one_way_miles
        filters:
          event_type: ride_trip_booked
      - category: plan
        table: plan_claims
        aggregate: count
        field: service_date
        within_months: 3
        filters:
          event_type: plan_claim_booked
          service_category: outpatient_hospital
          adjudication_status: paid
      cross_category:
      - plan
      - auth
  - id: ride_ext_trip_mileage
    base_policy_refs:
    - ride_late_pickup_policy
    - ride_mileage_reimbursement
    - ride_long_distance
    overwrite:
    - base_policy: ride_mileage_reimbursement
      superseded_clause: >-
        Mileage is reimbursed only on RideLink Mileage Reimbursement, for a trip registered with a trip number before
        the appointment where mileage_trip_preapproval_required, at mileage_rate_usd per approved mile measured by
        mileage_distance_basis for the round trip.
      replaced_by: >-
        Mileage is reimbursed only on RideLink Mileage Reimbursement, for a trip registered with a trip number before
        the appointment, on the approved miles and at the per-mile rate and taper this rule sets out.
    trigger: state_due
    subject:
    - ride_mileage_approved
    computes: amount
    target_tool: approve_trip_mileage_f67ba186
    params:
      treatment_chair_rate: 0.32
      chair_or_treatment_rate: 0.26
      course_day_minimum: 5
      metro_trip_miles: 200
      regional_trip_miles: 150
      metro_local_miles: 14.0
      regional_local_miles: 8.0
      taper_start_miles: 500
      deep_taper_miles: 1000
      taper_share: 0.8
      deep_taper_share: 0.6
    rule: >-
      A trip's mileage entry is worked out from its registered outbound leg, which is the member's latest registered
      outbound leg, and it records the trip's reservation number, the round trip as its leg, the outbound leg's appointment
      date as its trip date and the approved miles. Mileage is reimbursed only on RideLink Mileage Reimbursement,
      for a trip registered with a trip number before the appointment, on the approved miles and at the per-mile rate
      and taper this rule sets out. The standard approved miles are the round trip: the registered one-way miles of
      the trip's outbound and return legs added together, each measured by the shortest driving route. Every approved
      mile is paid at the level's standard mileage rate, and the amount is rounded to the nearest cent. For a trip
      whose return leg falls on a later date than its outbound leg and whose one-way miles reach the level's lodging
      threshold, the mileage entry is fixed only after the ledger carries the approved lodging and meals entry for
      that trip. The per-mile rate follows the member's equipment and the trip's purpose: when the member holds an
      approved or expired Durable Medical Equipment Authorization for a standard manual wheelchair, service code K0001,
      and the outbound leg's trip purpose is radiation, chemotherapy or dialysis, every approved mile is paid the
      treatment chair rate; when exactly one of those two holds, every approved mile is paid the chair or treatment
      rate; when neither holds, every approved mile is paid the level's standard mileage rate. A trip with an overnight
      stay adds local round trips between the lodging and the facility, counted from the latest lodging and meals
      entry on the ledger: when that entry's trip date is the outbound leg's appointment date and the member has at
      least the course day minimum of paid outpatient hospital claims with service dates in the last three months,
      one local round trip for each of those claims; when that entry's trip date is the outbound leg's appointment
      date but the member has fewer such claims, one local round trip for each lodging night recorded on that entry;
      when the latest lodging and meals entry carries another trip date, or there is none, no local round trips. Each
      local round trip adds miles set by the outbound leg's registered one-way miles: at or above the metro trip miles
      it adds the metro local miles; at or above the regional trip miles but under the metro trip miles it adds the
      regional local miles; under the regional trip miles it adds none. The approved miles are the round trip plus
      the local round trips times the miles each adds. Approved miles are paid on a taper set by their total: when
      the approved miles are at or under the taper start miles, every mile is paid at the full per-mile rate; when
      they are over the taper start miles and at or under the deep taper miles, the miles up to the taper start are
      paid at the full rate and the miles above it at the taper share of the rate; when they are over the deep taper
      miles, the miles up to the taper start are paid at the full rate, the miles from the taper start to the deep
      taper miles at the taper share and the miles above the deep taper miles at the deep taper share. The amount
      is the tapered miles times the per-mile rate, rounded to the nearest cent once, on the final amount only.
    prerequisite:
    - problem: ride_ext_stay_lodging_meals
      kind: value_input
      gate: local_trips
      form: state
      policy_source: >-
        For a trip whose return leg falls on a later date than its outbound leg and whose one-way miles reach the
        level's lodging threshold, the mileage entry is fixed only after the ledger carries the approved lodging and
        meals entry for that trip.
      condition: >-
        For a multi-day trip at or above the lodging threshold, the ledger's latest approved lodging and meals entry
        carries the trip's outbound appointment date as its trip date.
      resolved_by: approve_stay_lodging_meals_3bb3a021
      effect: >-
        Once the lodging and meals entry for the trip stands, local_trips moves from no local round trips to the course-day
        count (or the lodging nights on the entry), which raises the approved miles and therefore the tapered miles
        and the amount.
    cross_category:
    - category: auth
      as: branch
      reads:
      - status
      - variant_name
      - service_code
      note: >-
        The per-mile rate reads whether an approved or expired wheelchair (K0001) equipment authorization documents
        wheelchair use.
    - category: plan
      as: history
      reads:
      - plan_claims.service_date
      - plan_claims.service_category
      - plan_claims.adjudication_status
      note: >-
        The local round trips of a treatment course count the member's paid outpatient hospital claims of the last
        three months.
    compute:
    - out_date: >-
        LATEST('ride_trips', 'appointment_date', date_field='appointment_date', event_type='ride_trip_booked', leg='outbound')
    - purpose: >-
        LATEST('ride_trips', 'trip_purpose', date_field='appointment_date', event_type='ride_trip_booked', leg='outbound')
    - wheelchair_status: >-
        CFIELD('auth', 'status', variant_name='Durable Medical Equipment Authorization', service_code='K0001')
    - mile_rate: >-
        K('treatment_chair_rate') if ((wheelchair_status == 'approved' or wheelchair_status == 'expired') and (purpose
        == 'radiation' or purpose == 'chemotherapy' or purpose == 'dialysis')) else (K('chair_or_treatment_rate')
        if ((wheelchair_status == 'approved' or wheelchair_status == 'expired') or (purpose == 'radiation' or purpose
        == 'chemotherapy' or purpose == 'dialysis')) else P('mileage_rate_usd'))
    - stay_entry_date: >-
        LATEST('ride_ledger', 'claim_trip_date', date_field='posted_date', event_type='ride_mileage_approved', reimbursement_type='lodging_meals')
    - stay_entry_nights: >-
        LATEST('ride_ledger', 'lodging_nights', date_field='posted_date', event_type='ride_mileage_approved', reimbursement_type='lodging_meals')
    - course_claims: >-
        XCOUNT('plan', 'plan_claims', within_months=3, date_field='service_date', event_type='plan_claim_booked',
        service_category='outpatient_hospital', adjudication_status='paid')
    - local_trips: >-
        course_claims if (stay_entry_date == out_date and course_claims >= K('course_day_minimum')) else (stay_entry_nights
        if stay_entry_date == out_date else 0)
    - one_way: >-
        LATEST('ride_trips', 'one_way_miles', date_field='appointment_date', event_type='ride_trip_booked', leg='outbound')
    - local_rt_miles: >-
        K('metro_local_miles') if one_way >= K('metro_trip_miles') else (K('regional_local_miles') if one_way >= K('regional_trip_miles')
        else 0)
    - trip_no: >-
        LATEST('ride_trips', 'trip_number', date_field='appointment_date', event_type='ride_trip_booked', leg='outbound')
    - route_miles: SUM('ride_trips', 'one_way_miles', event_type='ride_trip_booked', trip_number=trip_no)
    - approved_miles: route_miles + local_trips * local_rt_miles
    - tapered_miles: >-
        approved_miles if approved_miles <= K('taper_start_miles') else (K('taper_start_miles') + K('taper_share')
        * (approved_miles - K('taper_start_miles')) if approved_miles <= K('deep_taper_miles') else K('taper_start_miles')
        + K('taper_share') * (K('deep_taper_miles') - K('taper_start_miles')) + K('deep_taper_share') * (approved_miles
        - K('deep_taper_miles')))
    - result: RND(tapered_miles * mile_rate, 2)
    compute_basis:
      out_date: >-
        A trip's mileage entry is worked out from its registered outbound leg, which is the member's latest registered
        outbound leg, and it records the trip's reservation number, the round trip as its leg, the outbound leg's
        appointment date as its trip date and the approved miles.
      purpose: >-
        The per-mile rate follows the member's equipment and the trip's purpose: when the member holds an approved
        or expired Durable Medical Equipment Authorization for a standard manual wheelchair, service code K0001, and
        the outbound leg's trip purpose is radiation, chemotherapy or dialysis, every approved mile is paid the treatment
        chair rate; when exactly one of those two holds, every approved mile is paid the chair or treatment rate;
        when neither holds, every approved mile is paid the level's standard mileage rate.
      wheelchair_status: >-
        The per-mile rate follows the member's equipment and the trip's purpose: when the member holds an approved
        or expired Durable Medical Equipment Authorization for a standard manual wheelchair, service code K0001, and
        the outbound leg's trip purpose is radiation, chemotherapy or dialysis, every approved mile is paid the treatment
        chair rate; when exactly one of those two holds, every approved mile is paid the chair or treatment rate;
        when neither holds, every approved mile is paid the level's standard mileage rate.
      mile_rate: >-
        The per-mile rate follows the member's equipment and the trip's purpose: when the member holds an approved
        or expired Durable Medical Equipment Authorization for a standard manual wheelchair, service code K0001, and
        the outbound leg's trip purpose is radiation, chemotherapy or dialysis, every approved mile is paid the treatment
        chair rate; when exactly one of those two holds, every approved mile is paid the chair or treatment rate;
        when neither holds, every approved mile is paid the level's standard mileage rate.
      stay_entry_date: >-
        A trip with an overnight stay adds local round trips between the lodging and the facility, counted from the
        latest lodging and meals entry on the ledger: when that entry's trip date is the outbound leg's appointment
        date and the member has at least the course day minimum of paid outpatient hospital claims with service dates
        in the last three months, one local round trip for each of those claims; when that entry's trip date is the
        outbound leg's appointment date but the member has fewer such claims, one local round trip for each lodging
        night recorded on that entry; when the latest lodging and meals entry carries another trip date, or there
        is none, no local round trips.
      stay_entry_nights: >-
        A trip with an overnight stay adds local round trips between the lodging and the facility, counted from the
        latest lodging and meals entry on the ledger: when that entry's trip date is the outbound leg's appointment
        date and the member has at least the course day minimum of paid outpatient hospital claims with service dates
        in the last three months, one local round trip for each of those claims; when that entry's trip date is the
        outbound leg's appointment date but the member has fewer such claims, one local round trip for each lodging
        night recorded on that entry; when the latest lodging and meals entry carries another trip date, or there
        is none, no local round trips.
      course_claims: >-
        A trip with an overnight stay adds local round trips between the lodging and the facility, counted from the
        latest lodging and meals entry on the ledger: when that entry's trip date is the outbound leg's appointment
        date and the member has at least the course day minimum of paid outpatient hospital claims with service dates
        in the last three months, one local round trip for each of those claims; when that entry's trip date is the
        outbound leg's appointment date but the member has fewer such claims, one local round trip for each lodging
        night recorded on that entry; when the latest lodging and meals entry carries another trip date, or there
        is none, no local round trips.
      local_trips: >-
        A trip with an overnight stay adds local round trips between the lodging and the facility, counted from the
        latest lodging and meals entry on the ledger: when that entry's trip date is the outbound leg's appointment
        date and the member has at least the course day minimum of paid outpatient hospital claims with service dates
        in the last three months, one local round trip for each of those claims; when that entry's trip date is the
        outbound leg's appointment date but the member has fewer such claims, one local round trip for each lodging
        night recorded on that entry; when the latest lodging and meals entry carries another trip date, or there
        is none, no local round trips.
      one_way: >-
        Each local round trip adds miles set by the outbound leg's registered one-way miles: at or above the metro
        trip miles it adds the metro local miles; at or above the regional trip miles but under the metro trip miles
        it adds the regional local miles; under the regional trip miles it adds none.
      local_rt_miles: >-
        Each local round trip adds miles set by the outbound leg's registered one-way miles: at or above the metro
        trip miles it adds the metro local miles; at or above the regional trip miles but under the metro trip miles
        it adds the regional local miles; under the regional trip miles it adds none.
      trip_no: >-
        A trip's mileage entry is worked out from its registered outbound leg, which is the member's latest registered
        outbound leg, and it records the trip's reservation number, the round trip as its leg, the outbound leg's
        appointment date as its trip date and the approved miles.
      route_miles: >-
        The standard approved miles are the round trip: the registered one-way miles of the trip's outbound and return
        legs added together, each measured by the shortest driving route.
      approved_miles: The approved miles are the round trip plus the local round trips times the miles each adds.
      tapered_miles: >-
        Approved miles are paid on a taper set by their total: when the approved miles are at or under the taper start
        miles, every mile is paid at the full per-mile rate; when they are over the taper start miles and at or under
        the deep taper miles, the miles up to the taper start are paid at the full rate and the miles above it at
        the taper share of the rate; when they are over the deep taper miles, the miles up to the taper start are
        paid at the full rate, the miles from the taper start to the deep taper miles at the taper share and the miles
        above the deep taper miles at the deep taper share.
      result: >-
        The amount is the tapered miles times the per-mile rate, rounded to the nearest cent once, on the final amount
        only.
    factors:
    - id: chair_treatment_mile_rate
      effect: parameter
      decides: mile_rate
      bindings:
      - purpose
      - wheelchair_status
      - mile_rate
      ladder:
      - when: >-
          an approved or expired standard manual wheelchair (K0001) equipment authorization is on record and the outbound
          leg's trip purpose is radiation, chemotherapy or dialysis
        value: K('treatment_chair_rate')
      - when: exactly one of those two holds
        value: K('chair_or_treatment_rate')
      - when: otherwise
        value: P('mileage_rate_usd')
      baseline:
        mile_rate: P('mileage_rate_usd')
      evidence:
      - history
      - cross_category
      cross_difficulty: auth
    - id: stay_local_round_trips
      effect: method
      decides: local_trips
      bindings:
      - stay_entry_date
      - stay_entry_nights
      - course_claims
      - local_trips
      ladder:
      - when: >-
          the latest lodging and meals entry on the ledger is dated to the outbound appointment date and the member
          has at least the course day minimum of paid outpatient hospital claims in the last three months
        method: count one local round trip per paid outpatient hospital claim of the last three months
      - when: >-
          that latest lodging and meals entry is dated to the outbound appointment date and the member has fewer such
          claims
        method: count one local round trip per lodging night recorded on that entry
      - when: otherwise
        method: count no local round trips
      baseline:
        local_trips: '0'
