      evidence:
      - history
      - date
      - cross_category
      cross_difficulty: plan
    - id: stay_length_credit_scale
      effect: parameter
      decides: credit_scale
      bindings:
      - stay_entry_nights
      - credit_scale
      ladder:
      - when: >-
          the latest lodging and meals entry, carrying the trip's date, records at least the extended-stay nights
        value: K('extended_stay_credit_factor')
      - when: it records at least the long-stay nights and fewer than the extended-stay nights
        value: K('long_stay_credit_factor')
      - when: otherwise, including no such entry
        value: 1 (unscaled)
      baseline:
