- id: ride_booking_rules
  subject:
  - ride_trip_booked
  rule: >-
    A trip is booked for a covered medical, dental, behavioral health or pharmacy appointment with an
    enrolled Medicaid provider, or for a value-added purpose, through a channel in booking_channels, no
    more than max_advance_booking_days ahead. Trips are booked only on a benefit in active status. A routine
    trip is booked only when the appointment date the member gives is at least advance_booking_business_days
    business days after the booking date. Business days exclude Saturdays, Sundays and state holidays,
    and the booking date itself is not counted. Where same_day_urgent_allowed, an urgent trip confirmed
    by the treating provider and a hospital discharge trip are booked without advance notice and picked
    up within urgent_pickup_hours or hospital_discharge_pickup_hours. Trips run within trip_service_hours,
    may be shared where shared_ride_allowed with at most max_onboard_minutes on board, drop the member
    no earlier than max_early_arrival_minutes before the appointment, and pick up a will-call return within
    will_call_return_pickup_minutes.
  eligibility:
  - id: benefit_active
    applies_to:
    - ride_trip_booked
    kind: state
    condition: Trips are booked only on a benefit in active status.
    evidence_fields:
    - ride_benefits.ride_benefit_id
    - ride_benefits.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ride_benefits.ride_benefit_id
      action_bindings:
        ride_benefits.ride_benefit_id: ride_benefit_id
    state_contract:
      field: ride_benefits.status
      allowed:
      - active
  - id: advance_notice
    applies_to:
    - ride_trip_booked
    kind: caller_fact
    condition: >-
      A routine trip is booked only when the appointment date the member gives is at least advance_booking_business_days
      business days after the booking date.
    evidence_fields:
    - ride_trips.appointment_date
    - ride_trips.trip_number
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - ride_trips.trip_number
      action_bindings:
        ride_trips.trip_number: trip_number
  params:
    per_tier:
      RideLink Transit Pass:
        channels: =booking_channels
        advance_days: =advance_booking_business_days
        max_ahead: =max_advance_booking_days
        urgent: =same_day_urgent_allowed
        urgent_hours: =urgent_pickup_hours
        discharge_hours: =hospital_discharge_pickup_hours
        hours: =trip_service_hours
        shared: =shared_ride_allowed
        onboard: =max_onboard_minutes
        early_arrival: =max_early_arrival_minutes
        will_call: =will_call_return_pickup_minutes
        pickup_window: =pickup_window_minutes
      RideLink Mileage Reimbursement:
        channels: =booking_channels
        advance_days: =advance_booking_business_days
        max_ahead: =max_advance_booking_days
        urgent: =same_day_urgent_allowed
        urgent_hours: =urgent_pickup_hours
        discharge_hours: =hospital_discharge_pickup_hours
        hours: =trip_service_hours
        shared: =shared_ride_allowed
        onboard: =max_onboard_minutes
        early_arrival: =max_early_arrival_minutes
        will_call: =will_call_return_pickup_minutes
        pickup_window: =pickup_window_minutes
      RideLink Ambulatory Sedan:
        channels: =booking_channels
        advance_days: =advance_booking_business_days
        max_ahead: =max_advance_booking_days
        urgent: =same_day_urgent_allowed
        urgent_hours: =urgent_pickup_hours
        discharge_hours: =hospital_discharge_pickup_hours
        hours: =trip_service_hours
        shared: =shared_ride_allowed
        onboard: =max_onboard_minutes
        early_arrival: =max_early_arrival_minutes
        will_call: =will_call_return_pickup_minutes
        pickup_window: =pickup_window_minutes
      RideLink Door-to-Door Assist:
        channels: =booking_channels
        advance_days: =advance_booking_business_days
        max_ahead: =max_advance_booking_days
        urgent: =same_day_urgent_allowed
