    only when the member has no benefit in pending_assessment, active or suspended status.
  eligibility:
  - id: one_open_benefit
    applies_to:
    - ride_enroll
    kind: dedup
    condition: >-
      A new benefit is opened only when the member has no benefit in pending_assessment, active or suspended
      status.
    evidence_fields:
    - ride_benefits.customer_id
    - ride_benefits.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - ride_benefits.customer_id
      action_bindings:
        ride_benefits.customer_id: customer_id
    dedup_contract:
      table: ride_benefits
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
