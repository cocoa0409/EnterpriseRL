  - id: ride_ext_year_end_expiry
    base_policy_refs:
    - ride_value_added
    overwrite:
    - base_policy: ride_value_added
      superseded_clause: unused trips expire on December 31 or when the benefit closes
      replaced_by: >-
        At the close of a benefit year its unused trips expire on December 31, except the trips carried into the next
        year as this rule sets out, and all unused trips expire when the benefit closes.
    trigger: state_due
    subject:
    - ride_allotment_expire
    computes: trips
    target_tool: expire_year_trips_0d38b23b
    params:
      full_carry_use: 12
      half_carry_use: 6
      half_carry_share: 0.5
      prenatal_carry_cap: 6
      family_carry_cap: 3
      engaged_visits: 3
      engaged_cap_bonus: 2
      seen_cap_bonus: 1
    rule: >-
      The year-end expiry entry is booked once for the benefit year before the current one, which is the previous
      benefit year, and records that year and the trips that expire. At the close of a benefit year its unused trips
      expire on December 31, except the trips carried into the next year as this rule sets out, and all unused trips
      expire when the benefit closes. At the close of a benefit year, the unused trips of that year are the trips
      its allotment load entries carried less the trips its debit entries used, and never fewer than none. The standard
      year-end expiry lets every unused trip of the year expire, so the expiry entry carries all of them. The year's
      use is measured against the months the benefit had trips that year, counted from the month the year's allotment
      load was posted through December: a benefit that had trips for six months or fewer has its debited trips annualized,
      multiplied by twelve and divided by those months; a benefit that had trips for seven to eleven months has one
      trip added to its debited trips for each month without trips; a benefit that had trips all twelve months has
      its use counted as debited. The share of the unused trips that may be carried follows that measured use: a use
      of at least the full-carry use lets all of them be carried, a use of at least the half-carry use but under the
      full-carry use lets the half-carry share of them be carried, rounded down to a whole trip, and a lower use lets
      none be carried. The most trips a member may carry follows the eligibility category of the active plan membership:
      Prairie Ridge Pregnancy Care carries up to the prenatal carry cap; Prairie Ridge Family Care, Prairie Ridge
      Children's Medicaid and Prairie Ridge CHIP Kids carry up to the family carry cap; every other category carries
      none. A member who keeps up with primary care may carry more: at least the engaged visit count of primary care
      visits in the last twelve months adds the engaged cap bonus to the most trips carried, one or more visits but
      fewer than that adds the seen cap bonus, and no visit adds nothing. The trips carried are the smaller of the
      most trips the member may carry and the carried share of the unused trips; the expiry entry carries the unused
      trips less the trips carried, and the carried trips stay on the benefit for the next year.
    prerequisite: []
    cross_category:
    - category: plan
      as: branch
      reads:
      - variant_name
      note: The most trips carried follows the eligibility category of the active plan membership.
    - category: pcp
      as: history
      reads:
      - pcp_visits.visit_date
      note: The carry bonus counts the member's primary care visits of the last twelve months.
    compute:
    - current_year: MONTHS('2000-01-01', NOW) // 12 + 2000
    - prior_year: current_year - 1
    - loaded: SUM('ride_ledger', 'trips', event_type='ride_trip_allotment', benefit_year=prior_year)
    - used: SUM('ride_ledger', 'trips', event_type='ride_allotment_debit', benefit_year=prior_year)
    - unused: MX(0, loaded - used)
    - load_posted: >-
        LATEST('ride_ledger', 'posted_date', date_field='posted_date', event_type='ride_trip_allotment', benefit_year=prior_year)
    - months_with_trips: 12 - (MONTHS('2000-01-01', load_posted) - 12 * (prior_year - 2000))
    - measured_use: >-
        used * 12 / months_with_trips if months_with_trips <= 6 else (used + (12 - months_with_trips) if months_with_trips
        < 12 else used)
    - carry_share: >-
        1 if measured_use >= K('full_carry_use') else (K('half_carry_share') if measured_use >= K('half_carry_use')
        else 0)
    - plan_category: CFIELD('plan', 'variant_name', status='active')
    - carry_cap: >-
        K('prenatal_carry_cap') if plan_category == 'Prairie Ridge Pregnancy Care' else (K('family_carry_cap') if
        (plan_category == 'Prairie Ridge Family Care' or plan_category == "Prairie Ridge Children's Medicaid" or plan_category
        == 'Prairie Ridge CHIP Kids') else 0)
    - pcp_visit_count: XCOUNT('pcp', 'pcp_visits', within_months=12, date_field='visit_date', event_type='pcp_visit')
    - cap_bonus: >-
        K('engaged_cap_bonus') if pcp_visit_count >= K('engaged_visits') else (K('seen_cap_bonus') if pcp_visit_count
        >= 1 else 0)
    - carried: MN(carry_cap + cap_bonus, int(unused * carry_share))
    - result: unused - carried
    compute_basis:
      current_year: >-
        The year-end expiry entry is booked once for the benefit year before the current one, which is the previous
        benefit year, and records that year and the trips that expire.
      prior_year: >-
        The year-end expiry entry is booked once for the benefit year before the current one, which is the previous
        benefit year, and records that year and the trips that expire.
      loaded: >-
        At the close of a benefit year, the unused trips of that year are the trips its allotment load entries carried
        less the trips its debit entries used, and never fewer than none.
      used: >-
        At the close of a benefit year, the unused trips of that year are the trips its allotment load entries carried
        less the trips its debit entries used, and never fewer than none.
      unused: >-
        At the close of a benefit year, the unused trips of that year are the trips its allotment load entries carried
        less the trips its debit entries used, and never fewer than none.
      load_posted: >-
        The year's use is measured against the months the benefit had trips that year, counted from the month the
        year's allotment load was posted through December: a benefit that had trips for six months or fewer has its
        debited trips annualized, multiplied by twelve and divided by those months; a benefit that had trips for seven
        to eleven months has one trip added to its debited trips for each month without trips; a benefit that had
        trips all twelve months has its use counted as debited.
      months_with_trips: >-
        The year's use is measured against the months the benefit had trips that year, counted from the month the
        year's allotment load was posted through December: a benefit that had trips for six months or fewer has its
        debited trips annualized, multiplied by twelve and divided by those months; a benefit that had trips for seven
        to eleven months has one trip added to its debited trips for each month without trips; a benefit that had
