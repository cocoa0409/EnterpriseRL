        the clock starts on the return leg's appointment date.
      return_registered_on: >-
        The settlement clock starts on a date set by the records that show when the trip could first be settled: when
        the member's paid outpatient hospital claim with the latest service date was booked after the return leg's
        appointment date, the clock starts on that claim's booked date; when no such claim was booked after the return
        leg's appointment date but the return leg was registered after the outbound leg's appointment date, because
        the stay was extended while the member was away, the clock starts on the return leg's registration date; otherwise
        the clock starts on the return leg's appointment date.
      clock_start: >-
        The settlement clock starts on a date set by the records that show when the trip could first be settled: when
        the member's paid outpatient hospital claim with the latest service date was booked after the return leg's
        appointment date, the clock starts on that claim's booked date; when no such claim was booked after the return
        leg's appointment date but the return leg was registered after the outbound leg's appointment date, because
        the stay was extended while the member was away, the clock starts on the return leg's registration date; otherwise
        the clock starts on the return leg's appointment date.
      late_days: >-
        The late-settlement credit rate follows the days from the start of the settlement clock to the settlement
        date: more than the long-late days earns the long-late credit rate; more than the level's reimbursement payment
        days but no more than the long-late days earns the late credit rate; no more than the payment days earns no
        credit.
      credit_rate: >-
        The late-settlement credit rate follows the days from the start of the settlement clock to the settlement
        date: more than the long-late days earns the long-late credit rate; more than the level's reimbursement payment
        days but no more than the long-late days earns the late credit rate; no more than the payment days earns no
        credit.
      stay_entry_nights: >-
        The credit rate is scaled by the lodging nights recorded on the latest lodging and meals entry on the ledger
        when that entry carries the trip's trip date: at least the extended-stay nights scales it by the extended-stay
        credit factor, at least the long-stay nights but fewer than the extended-stay nights by the long-stay credit
        factor, and fewer nights, or a latest lodging and meals entry for another trip date, or none, leaves it unscaled.
      credit_scale: >-
        The credit rate is scaled by the lodging nights recorded on the latest lodging and meals entry on the ledger
        when that entry carries the trip's trip date: at least the extended-stay nights scales it by the extended-stay
        credit factor, at least the long-stay nights but fewer than the extended-stay nights by the long-stay credit
        factor, and fewer nights, or a latest lodging and meals entry for another trip date, or none, leaves it unscaled.
      plan_category: >-
        A settlement that is late carries a flat late-settlement allowance set by the member's active plan membership:
        the full late allowance when the membership is in Prairie Ridge ABD Care or Prairie Ridge Dual Complete and
        records household income at or below the poverty percent of the federal poverty level, the partial late allowance
        when exactly one of those two holds, and no allowance when neither holds; a settlement that is not late carries
        no allowance.
      income_pct: >-
        A settlement that is late carries a flat late-settlement allowance set by the member's active plan membership:
        the full late allowance when the membership is in Prairie Ridge ABD Care or Prairie Ridge Dual Complete and
        records household income at or below the poverty percent of the federal poverty level, the partial late allowance
        when exactly one of those two holds, and no allowance when neither holds; a settlement that is not late carries
        no allowance.
      allowance_tier: >-
        A settlement that is late carries a flat late-settlement allowance set by the member's active plan membership:
        the full late allowance when the membership is in Prairie Ridge ABD Care or Prairie Ridge Dual Complete and
        records household income at or below the poverty percent of the federal poverty level, the partial late allowance
        when exactly one of those two holds, and no allowance when neither holds; a settlement that is not late carries
        no allowance.
      allowance: >-
        A settlement that is late carries a flat late-settlement allowance set by the member's active plan membership:
        the full late allowance when the membership is in Prairie Ridge ABD Care or Prairie Ridge Dual Complete and
        records household income at or below the poverty percent of the federal poverty level, the partial late allowance
        when exactly one of those two holds, and no allowance when neither holds; a settlement that is not late carries
        no allowance.
      result: >-
        The settlement amount is the approved amounts, plus the approved amounts times the scaled credit rate, plus
        the allowance, rounded to the nearest cent once, on the final amount only.
    factors:
    - id: late_settlement_credit_rate
      effect: parameter
      decides: credit_rate
      bindings:
      - late_days
      - credit_rate
      ladder:
      - when: more than the long-late days have passed since the settlement clock started
        value: K('long_late_credit_rate')
      - when: more than the level's reimbursement payment days but no more than the long-late days have passed
        value: K('late_credit_rate')
      - when: otherwise
        value: 0 (no credit)
      baseline:
        credit_rate: '0'
      evidence:
      - date
      cross_difficulty: null
    - id: settlement_clock_start
      effect: method
      decides: clock_start
      bindings:
      - course_booked
      - return_registered_on
      - clock_start
      ladder:
      - when: >-
          the member's paid outpatient hospital claim with the latest service date was booked after the return leg's
          appointment date
        method: start the clock on that claim's booked date
      - when: >-
          no such claim was booked after the return leg's appointment date and the return leg was registered after
          the outbound leg's appointment date (the stay was extended while away)
        method: start the clock on the return leg's registration date
      - when: otherwise
