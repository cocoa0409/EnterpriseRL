  - id: ride_ext_trip_settlement
    base_policy_refs:
    - ride_mileage_reimbursement
    overwrite:
    - base_policy: ride_mileage_reimbursement
      superseded_clause: an approved amount is paid within mileage_payment_days by the member's chosen payment method
      replaced_by: >-
        A trip settlement pays the approved amounts together with any late-settlement credit and allowance this rule
        sets out, to the payment method the member chooses.
    trigger: on_request
    subject:
    - ride_mileage_paid
    computes: amount
    target_tool: collect_trip_settlement_816cec94
    params:
      long_late_days: 60
      late_credit_rate: 0.01
      long_late_credit_rate: 0.02
      long_stay_nights: 7
      extended_stay_nights: 14
      long_stay_credit_factor: 1.5
      extended_stay_credit_factor: 2.0
      poverty_pct: 100
      full_late_allowance: 15.0
      partial_late_allowance: 10.0
    rule: >-
      A trip settlement releases every approved reimbursement entry the ledger carries for the trip, found by the
      trip date of the trip's mileage entry, which is the latest approved mileage entry on the ledger, in one payment
      recorded under the trip's mileage claim number. The standard settlement is the sum of those approved amounts,
      paid in full to the payment method the member chooses and rounded to the nearest cent. A trip settlement pays
      the approved amounts together with any late-settlement credit and allowance this rule sets out, to the payment
      method the member chooses. A trip settlement is not released until the ledger carries the approved mileage entry
      for that trip. The settlement clock starts on a date set by the records that show when the trip could first
      be settled: when the member's paid outpatient hospital claim with the latest service date was booked after the
      return leg's appointment date, the clock starts on that claim's booked date; when no such claim was booked after
      the return leg's appointment date but the return leg was registered after the outbound leg's appointment date,
      because the stay was extended while the member was away, the clock starts on the return leg's registration date;
      otherwise the clock starts on the return leg's appointment date. The late-settlement credit rate follows the
      days from the start of the settlement clock to the settlement date: more than the long-late days earns the long-late
      credit rate; more than the level's reimbursement payment days but no more than the long-late days earns the
      late credit rate; no more than the payment days earns no credit. The credit rate is scaled by the lodging nights
      recorded on the latest lodging and meals entry on the ledger when that entry carries the trip's trip date: at
      least the extended-stay nights scales it by the extended-stay credit factor, at least the long-stay nights but
      fewer than the extended-stay nights by the long-stay credit factor, and fewer nights, or a latest lodging and
      meals entry for another trip date, or none, leaves it unscaled. A settlement that is late carries a flat late-settlement
      allowance set by the member's active plan membership: the full late allowance when the membership is in Prairie
      Ridge ABD Care or Prairie Ridge Dual Complete and records household income at or below the poverty percent of
      the federal poverty level, the partial late allowance when exactly one of those two holds, and no allowance
      when neither holds; a settlement that is not late carries no allowance. The settlement amount is the approved
      amounts, plus the approved amounts times the scaled credit rate, plus the allowance, rounded to the nearest
      cent once, on the final amount only.
    prerequisite:
    - problem: ride_ext_trip_mileage
      kind: value_input
      gate: entries
      form: state
      policy_source: A trip settlement is not released until the ledger carries the approved mileage entry for that
        trip.
      condition: >-
        The ledger carries an approved mileage entry for the trip whose trip date is the trip's outbound appointment
        date, and it is the latest approved mileage entry.
      resolved_by: approve_trip_mileage_f67ba186
      effect: >-
        Once the trip's mileage entry stands, entries takes its amount instead of an earlier trip's mileage amount,
        and through its trip date pairs it with the trip's lodging and meals entry, so the settlement, its credit
        and the total change.
    cross_category:
    - category: plan
      as: branch
      reads:
      - variant_name
      - income_pct_fpl
      - plan_claims.booked_date
      - plan_claims.service_date
      - plan_claims.service_category
      - plan_claims.adjudication_status
      note: >-
        The settlement clock reads the booked date of the latest-service paid outpatient hospital claim, and the late
