      - category: pcp
        table: pcp_visits
        aggregate: count
        field: visit_date
        within_months: 12
        filters:
          event_type: pcp_visit
      cross_category:
      - plan
      - pcp
  - id: ride_ext_year_allotment_load
    base_policy_refs:
    - ride_value_added
    overwrite:
    - base_policy: ride_value_added
      superseded_clause: >-
        value_added_trips_per_year one-way trips to value_added_purposes destinations within value_added_trip_max_miles
        are loaded on January 1
      replaced_by: >-
        On January 1 each benefit year's value-added allotment of one-way trips to the level's value-added destinations,
        within the level's value-added trip distance, is loaded as the level's yearly value-added trips plus the bonus
        trips, over the coverage months, that this rule sets out.
    trigger: state_due
    subject:
    - ride_trip_allotment
    computes: trips
    target_tool: load_year_allotment_a6239ac8
    params:
      full_wic_bonus: 8
      half_wic_bonus: 4
      deep_poverty_pct: 50
      poverty_pct: 100
      deep_poverty_food_bonus: 6
      poverty_food_bonus: 3
      frequent_fill_count: 12
      regular_fill_count: 6
      frequent_pharmacy_bonus: 4
      regular_pharmacy_bonus: 2
      intensive_class_bonus: 4
      standard_class_bonus: 2
    rule: >-
      The allotment load entry of a benefit year is booked once, for the current benefit year, and records that year
      and the trips loaded. On January 1 each benefit year's value-added allotment of one-way trips to the level's
      value-added destinations, within the level's value-added trip distance, is loaded as the level's yearly value-added
      trips plus the bonus trips, over the coverage months, that this rule sets out. A benefit year's value-added
      allotment is not loaded until the ledger carries the expiry entry for the previous benefit year's unused trips,
      whenever that year leaves trips to expire. The standard January load is the level's yearly value-added trips,
      loaded in full for the whole year. WIC and parenting-class bonus trips follow maternity care: when the active
      plan membership is in Prairie Ridge Pregnancy Care and the member has at least one paid preventive claim with
      a service date in the last three months, the full WIC bonus is added; when exactly one of those two holds, the
      half WIC bonus is added; when neither holds, none is added. Food-bank bonus trips follow the household income
      the active plan membership records: at or below the deep-poverty percent of the federal poverty level the deep-poverty
      food bonus is added, above that and at or below the poverty percent the poverty food bonus is added, and above
      the poverty percent none is added. Pharmacy bonus trips follow the member's pharmacy fill entries in the last
      six months, where a fill later reversed still counts because the pharmacy visit was made and a rejected fill
      is not a fill: at least the frequent-fill count adds the frequent pharmacy bonus, at least the regular-fill
      count but fewer than the frequent-fill count adds the regular pharmacy bonus, and fewer adds none. Community
      health class bonus trips follow care management: an active Maternal Care Management or Complex Case Management
      episode adds the intensive class bonus, any other active care management episode adds the standard class bonus,
      and no active episode adds none. The load covers the months of coverage expected in the year: when the active
      plan membership is in Prairie Ridge Pregnancy Care, records no termination date and has its renewal due date
      within the benefit year, the load covers the whole months from January through the renewal due month; when the
      membership records a termination date within the benefit year, it covers the whole months from January through
      the termination month; otherwise it covers all twelve months. The trips loaded are the level's yearly value-added
      trips plus the four bonuses, times the covered months, divided by twelve and rounded down to a whole trip.
    prerequisite:
    - problem: ride_ext_year_end_expiry
      kind: state_gate
      gate: ride_ledger.benefit_year
      form: state
      policy_source: >-
        A benefit year's value-added allotment is not loaded until the ledger carries the expiry entry for the previous
        benefit year's unused trips, whenever that year leaves trips to expire.
      condition: >-
        When the previous benefit year leaves trips to expire, the ledger carries an allotment expiry entry whose
        benefit year is the previous benefit year.
      resolved_by: expire_year_trips_0d38b23b
      effect: >-
        Once the previous year's expiry entry stands, the gate on the new year's load holds and the load entry may
        be booked; the number of trips loaded does not read the expiry entry.
    cross_category:
    - category: plan
      as: branch
      reads:
      - variant_name
      - income_pct_fpl
      - renewal_due_date
      - termination_date
      - plan_claims.service_date
      - plan_claims.service_category
      - plan_claims.adjudication_status
      note: >-
        The WIC bonus reads the category and paid preventive claims, the food bonus the recorded income, and the covered
        months the renewal due and termination dates.
    - category: rx
      as: history
      reads:
      - rx_fills.fill_date
      - rx_fills.event_type
      note: The pharmacy bonus counts the member's paid fills of the last six months.
    - category: care
      as: branch
      reads:
      - variant_name
      - status
      note: The class bonus reads the tier of the member's active care management episode.
    compute:
    - current_year: MONTHS('2000-01-01', NOW) // 12 + 2000
    - plan_category: CFIELD('plan', 'variant_name', status='active')
    - preventive_claims: >-
        XCOUNT('plan', 'plan_claims', within_months=3, date_field='service_date', event_type='plan_claim_booked',
        service_category='preventive', adjudication_status='paid')
    - wic_bonus: >-
        K('full_wic_bonus') if (plan_category == 'Prairie Ridge Pregnancy Care' and preventive_claims >= 1) else (K('half_wic_bonus')
        if (plan_category == 'Prairie Ridge Pregnancy Care' or preventive_claims >= 1) else 0)
    - income_pct: CFIELD('plan', 'income_pct_fpl', status='active')
    - food_bonus: >-
        K('deep_poverty_food_bonus') if income_pct <= K('deep_poverty_pct') else (K('poverty_food_bonus') if income_pct
        <= K('poverty_pct') else 0)
    - fills_6m: XCOUNT('rx', 'rx_fills', within_months=6, date_field='fill_date', event_type='rx_fill')
    - pharmacy_bonus: >-
        K('frequent_pharmacy_bonus') if fills_6m >= K('frequent_fill_count') else (K('regular_pharmacy_bonus') if
        fills_6m >= K('regular_fill_count') else 0)
    - care_tier: CFIELD('care', 'variant_name', status='active')
    - class_bonus: >-
        K('intensive_class_bonus') if (care_tier == 'Maternal Care Management' or care_tier == 'Complex Case Management')
        else (K('standard_class_bonus') if care_tier else 0)
    - renewal_due: CFIELD('plan', 'renewal_due_date', status='active')
    - termination: CFIELD('plan', 'termination_date', status='active')
    - covered_months: >-
        (MONTHS('2000-01-01', renewal_due) - 12 * (current_year - 2000) + 1) if (plan_category == 'Prairie Ridge Pregnancy
        Care' and not termination and (MONTHS('2000-01-01', renewal_due) // 12 + 2000) == current_year) else ((MONTHS('2000-01-01',
        termination) - 12 * (current_year - 2000) + 1) if (termination and (MONTHS('2000-01-01', termination) // 12
        + 2000) == current_year) else 12)
    - result: >-
        int((P('value_added_trips_per_year') + wic_bonus + food_bonus + pharmacy_bonus + class_bonus) * covered_months
        / 12)
    compute_basis:
      current_year: >-
        The allotment load entry of a benefit year is booked once, for the current benefit year, and records that
        year and the trips loaded.
      plan_category: >-
        WIC and parenting-class bonus trips follow maternity care: when the active plan membership is in Prairie Ridge
        Pregnancy Care and the member has at least one paid preventive claim with a service date in the last three
        months, the full WIC bonus is added; when exactly one of those two holds, the half WIC bonus is added; when
        neither holds, none is added.
      preventive_claims: >-
        WIC and parenting-class bonus trips follow maternity care: when the active plan membership is in Prairie Ridge
        Pregnancy Care and the member has at least one paid preventive claim with a service date in the last three
        months, the full WIC bonus is added; when exactly one of those two holds, the half WIC bonus is added; when
        neither holds, none is added.
      wic_bonus: >-
        WIC and parenting-class bonus trips follow maternity care: when the active plan membership is in Prairie Ridge
        Pregnancy Care and the member has at least one paid preventive claim with a service date in the last three
        months, the full WIC bonus is added; when exactly one of those two holds, the half WIC bonus is added; when
        neither holds, none is added.
      income_pct: >-
        Food-bank bonus trips follow the household income the active plan membership records: at or below the deep-poverty
        percent of the federal poverty level the deep-poverty food bonus is added, above that and at or below the
        poverty percent the poverty food bonus is added, and above the poverty percent none is added.
      food_bonus: >-
        Food-bank bonus trips follow the household income the active plan membership records: at or below the deep-poverty
        percent of the federal poverty level the deep-poverty food bonus is added, above that and at or below the
        poverty percent the poverty food bonus is added, and above the poverty percent none is added.
      fills_6m: >-
        Pharmacy bonus trips follow the member's pharmacy fill entries in the last six months, where a fill later
        reversed still counts because the pharmacy visit was made and a rejected fill is not a fill: at least the
        frequent-fill count adds the frequent pharmacy bonus, at least the regular-fill count but fewer than the frequent-fill
        count adds the regular pharmacy bonus, and fewer adds none.
      pharmacy_bonus: >-
        Pharmacy bonus trips follow the member's pharmacy fill entries in the last six months, where a fill later
        reversed still counts because the pharmacy visit was made and a rejected fill is not a fill: at least the
        frequent-fill count adds the frequent pharmacy bonus, at least the regular-fill count but fewer than the frequent-fill
        count adds the regular pharmacy bonus, and fewer adds none.
      care_tier: >-
        Community health class bonus trips follow care management: an active Maternal Care Management or Complex Case
        Management episode adds the intensive class bonus, any other active care management episode adds the standard
        class bonus, and no active episode adds none.
      class_bonus: >-
        Community health class bonus trips follow care management: an active Maternal Care Management or Complex Case
        Management episode adds the intensive class bonus, any other active care management episode adds the standard
        class bonus, and no active episode adds none.
      renewal_due: >-
        The load covers the months of coverage expected in the year: when the active plan membership is in Prairie
        Ridge Pregnancy Care, records no termination date and has its renewal due date within the benefit year, the
        load covers the whole months from January through the renewal due month; when the membership records a termination
        date within the benefit year, it covers the whole months from January through the termination month; otherwise
        it covers all twelve months.
      termination: >-
        The load covers the months of coverage expected in the year: when the active plan membership is in Prairie
        Ridge Pregnancy Care, records no termination date and has its renewal due date within the benefit year, the
        load covers the whole months from January through the renewal due month; when the membership records a termination
        date within the benefit year, it covers the whole months from January through the termination month; otherwise
        it covers all twelve months.
      covered_months: >-
        The load covers the months of coverage expected in the year: when the active plan membership is in Prairie
        Ridge Pregnancy Care, records no termination date and has its renewal due date within the benefit year, the
        load covers the whole months from January through the renewal due month; when the membership records a termination
        date within the benefit year, it covers the whole months from January through the termination month; otherwise
        it covers all twelve months.
      result: >-
        The trips loaded are the level's yearly value-added trips plus the four bonuses, times the covered months,
        divided by twelve and rounded down to a whole trip.
    factors:
    - id: maternity_wic_bonus
      effect: parameter
      decides: wic_bonus
      bindings:
      - plan_category
      - preventive_claims
      - wic_bonus
      ladder:
      - when: >-
          the active plan membership is in Prairie Ridge Pregnancy Care and the member has at least one paid preventive
          claim with a service date in the last three months
        value: K('full_wic_bonus')
      - when: exactly one of those two holds
        value: K('half_wic_bonus')
      - when: otherwise
        value: '0'
      baseline:
        wic_bonus: '0'
      evidence:
      - cross_category
      cross_difficulty: plan
    - id: income_food_bonus
      effect: parameter
      decides: food_bonus
      bindings:
      - income_pct
      - food_bonus
      ladder:
      - when: the recorded household income is at or below the deep-poverty percent of the federal poverty level
        value: K('deep_poverty_food_bonus')
      - when: it is above the deep-poverty percent and at or below the poverty percent
        value: K('poverty_food_bonus')
      - when: otherwise
        value: '0'
      baseline:
        food_bonus: '0'
      evidence:
      - cross_category
      cross_difficulty: plan
    - id: pharmacy_fill_bonus
      effect: parameter
      decides: pharmacy_bonus
      bindings:
      - fills_6m
      - pharmacy_bonus
      ladder:
      - when: at least the frequent-fill count of paid pharmacy fills in the last six months
        value: K('frequent_pharmacy_bonus')
      - when: at least the regular-fill count but fewer than the frequent-fill count
        value: K('regular_pharmacy_bonus')
      - when: otherwise
        value: '0'
      baseline:
        pharmacy_bonus: '0'
      evidence:
      - cross_category
      cross_difficulty: rx
    - id: care_management_class_bonus
      effect: parameter
      decides: class_bonus
      bindings:
      - care_tier
      - class_bonus
      ladder:
      - when: an active Maternal Care Management or Complex Case Management episode
        value: K('intensive_class_bonus')
      - when: any other active care management episode
        value: K('standard_class_bonus')
      - when: otherwise (no active episode)
        value: '0'
      baseline:
        class_bonus: '0'
      evidence:
      - cross_category
      cross_difficulty: care
    - id: coverage_months_counted
      effect: method
      decides: covered_months
      bindings:
      - renewal_due
      - termination
      - covered_months
      ladder:
      - when: >-
          the active membership is in Prairie Ridge Pregnancy Care, records no termination date, and its renewal due
          date falls within the benefit year
        method: cover the whole months from January through the renewal due month
      - when: the membership records a termination date within the benefit year
        method: cover the whole months from January through the termination month
      - when: otherwise
        method: cover all twelve months
      baseline:
        covered_months: '12'
      evidence:
      - cross_category
      - date
      cross_difficulty: plan
    baseline:
      rule: >-
        The standard January load is the level's yearly value-added trips, loaded in full for the whole year.
      params:
      - value_added_trips_per_year
    inputs:
      history:
      - category: plan
        table: plan_claims
        aggregate: count
        field: service_date
        within_months: 3
        filters:
          event_type: plan_claim_booked
          service_category: preventive
          adjudication_status: paid
      - category: rx
        table: rx_fills
        aggregate: count
        field: fill_date
        within_months: 6
        filters:
          event_type: rx_fill
      cross_category:
      - plan
      - rx
      - care
  - id: ride_ext_alt_ride_allowance
    base_policy_refs:
    - ride_late_pickup_policy
    - ride_mileage_reimbursement
    - ride_long_distance
    overwrite:
    - base_policy: ride_late_pickup_policy
      superseded_clause: >-
        the member may then take an alternative ride and be reimbursed its receipted cost up to late_pickup_alt_reimbursement_max_usd
        as a late_pickup_alternative reimbursement
      replaced_by: >-
        After a late pickup the member may take an alternative ride and be reimbursed the alternative-ride allowance
        this rule sets out as an alternative-ride reimbursement, whatever the receipt shows.
    - base_policy: ride_mileage_reimbursement
      superseded_clause: >-
        Attendance is proven by a paid claim on plan_claims for the member with the trip's appointment date and destination
        provider; without one the claim is denied with denial_reason no_attended_appointment.
      replaced_by: >-
        An alternative-ride claim rests on the late pickup record of its leg and needs no paid claim to prove attendance.
    trigger: on_request
    subject:
    - ride_mileage_approved
    computes: amount
    target_tool: file_alternative_ride_claim_fa98ae6a
    params:
      accessible_fare_base: 12.0
      assisted_fare_base: 6.5
      standard_fare_base: 3.5
      night_fare_time: '19:00'
      evening_fare_time: '17:00'
      night_mile_fare: 3.2
      evening_mile_fare: 2.75
      standard_mile_fare: 2.4
      family_escort_fare: 5.5
      single_escort_fare: 2.75
      wait_minute_fare: 0.45
      flat_strand_charge: 8.0
      covered_va_share: 0.9
      uncovered_va_share: 0.5
      maternity_return_cap: 75.0
      return_cap: 60.0
    rule: >-
      An alternative-ride claim is worked out for the member's latest recorded late pickup, from that late leg and
      the registered legs of the same trip, and it records the trip's reservation number, the late leg, the late leg's
      date as its trip date and the amount. After a late pickup the member may take an alternative ride and be reimbursed
      the alternative-ride allowance this rule sets out as an alternative-ride reimbursement, whatever the receipt
      shows. An alternative-ride claim rests on the late pickup record of its leg and needs no paid claim to prove
      attendance. The standard alternative-ride allowance is the standard fare base plus the standard mile fare for
      each of the longest registered one-way miles among the trip's legs, plus the flat stranding charge for the wait.
      The standard allowance is paid up to the level's alternative-ride maximum and rounded to the nearest cent. For
      a late value-added leg in the current benefit year, the alternative-ride allowance is fixed only after the ledger
      carries the allotment load for the benefit year of that leg's trip date. The fare base follows the help the
      member needs: a member who holds an approved or expired Durable Medical Equipment Authorization for a standard
      manual wheelchair, service code K0001, gets the accessible fare base; a member without one whose level gives
      door-to-door or door-through-door driver assistance gets the assisted fare base; any other member gets the standard
      fare base. The mile fare follows the late leg's scheduled pickup time: a pickup at or after the night-fare time
      gets the night mile fare, a pickup at or after the evening-fare time but before the night-fare time gets the
      evening mile fare, and an earlier pickup gets the standard mile fare. Escorts who rode add an escort fare, the
      escorts being counted as persons, the most recorded on any one of the trip's registered legs: two or more escorts
      add the family escort fare, one escort adds the single escort fare, and no escort adds none. The waiting charge
      is worked out by how late the pickup ran, every late pickup being more than the level's late threshold past
      the pickup window: when the minutes late are at least three times the late threshold, the charge is the wait
      minute fare for every minute past the pickup window; when they are at least twice the late threshold but under
      three times it, the charge is the wait minute fare for every minute beyond the late threshold; when they are
      under twice the late threshold, the charge is the flat stranding charge. The share of the fare paid follows
      the kind of leg: a value-added leg of a benefit year whose allotment load entries carried more trips than its
      debit entries used is paid the covered value-added share; any other value-added leg is paid the uncovered value-added
      share; a medical leg is paid in full. The allowance is capped per late leg: a late return leg of a member whose
      active plan membership is in Prairie Ridge Pregnancy Care is capped at the maternity return cap; a claim where
      exactly one of those two holds is capped at the return cap; any other claim is capped at the level's alternative-ride
      maximum. A level whose alternative-ride maximum is zero offers no alternative-ride reimbursement, and every
      claim on it is capped at zero. The fare is the fare base plus the mile fare times those miles plus the escort
      fare plus the waiting charge; it is multiplied by the leg's share, and the smaller of that fare and the cap
      is the amount, rounded to the nearest cent once, on the final amount only.
    prerequisite:
    - problem: ride_ext_year_allotment_load
      kind: value_input
      gate: leg_share
      form: state
      policy_source: >-
        For a late value-added leg in the current benefit year, the alternative-ride allowance is fixed only after
        the ledger carries the allotment load for the benefit year of that leg's trip date.
      condition: >-
        The ledger carries an allotment load entry whose benefit year is the year of the late leg's trip date.
      resolved_by: load_year_allotment_a6239ac8
      effect: >-
        Once the leg year's allotment load stands, that year's loaded trips exceed its debited trips and leg_share
        moves from the uncovered to the covered value-added share, raising the fare and the amount.
    cross_category:
    - category: auth
      as: branch
      reads:
      - status
      - variant_name
      - service_code
      note: >-
        The fare base reads whether an approved or expired wheelchair (K0001) equipment authorization documents wheelchair
        use.
    - category: plan
      as: branch
      reads:
      - variant_name
      note: The cap reads whether the active plan membership is in Prairie Ridge Pregnancy Care.
    compute:
    - late_trip: LATEST('ride_trips', 'trip_number', date_field='event_date', event_type='ride_late_pickup')
    - late_leg: LATEST('ride_trips', 'leg', date_field='event_date', event_type='ride_late_pickup')
    - late_date: LATEST('ride_trips', 'event_date', date_field='event_date', event_type='ride_late_pickup')
    - miles: MAX('ride_trips', 'one_way_miles', event_type='ride_trip_booked', trip_number=late_trip)
    - wheelchair_status: >-
        CFIELD('auth', 'status', variant_name='Durable Medical Equipment Authorization', service_code='K0001')
    - fare_base: >-
        K('accessible_fare_base') if (wheelchair_status == 'approved' or wheelchair_status == 'expired') else (K('assisted_fare_base')
        if (P('driver_assist_level') == 'door_to_door' or P('driver_assist_level') == 'door_through_door') else K('standard_fare_base'))
    - pickup_at: >-
        LATEST('ride_trips', 'pickup_time', date_field='appointment_date', event_type='ride_trip_booked', trip_number=late_trip,
        leg=late_leg)
    - mile_fare: >-
        K('night_mile_fare') if pickup_at >= K('night_fare_time') else (K('evening_mile_fare') if pickup_at >= K('evening_fare_time')
        else K('standard_mile_fare'))
    - escorts: MAX('ride_trips', 'escort_count', event_type='ride_trip_booked', trip_number=late_trip)
    - escort_fare: K('family_escort_fare') if escorts >= 2 else (K('single_escort_fare') if escorts >= 1 else 0)
    - minutes_late: LATEST('ride_trips', 'minutes_late', date_field='event_date', event_type='ride_late_pickup')
    - waiting_charge: >-
        minutes_late * K('wait_minute_fare') if minutes_late >= 3 * P('late_threshold_minutes') else ((minutes_late
        - P('late_threshold_minutes')) * K('wait_minute_fare') if minutes_late >= 2 * P('late_threshold_minutes')
        else K('flat_strand_charge'))
    - purpose: >-
        LATEST('ride_trips', 'trip_purpose', date_field='appointment_date', event_type='ride_trip_booked', trip_number=late_trip,
        leg=late_leg)
    - leg_year: MONTHS('2000-01-01', late_date) // 12 + 2000
    - year_loaded: SUM('ride_ledger', 'trips', event_type='ride_trip_allotment', benefit_year=leg_year)
    - year_used: SUM('ride_ledger', 'trips', event_type='ride_allotment_debit', benefit_year=leg_year)
    - leg_share: >-
        K('covered_va_share') if ((purpose == 'pharmacy' or purpose == 'wic' or purpose == 'food_bank' or purpose
        == 'community_health_class') and year_loaded > year_used) else (K('uncovered_va_share') if (purpose == 'pharmacy'
        or purpose == 'wic' or purpose == 'food_bank' or purpose == 'community_health_class') else 1)
    - plan_category: CFIELD('plan', 'variant_name', status='active')
    - cap: >-
        K('maternity_return_cap') if (late_leg == 'return' and plan_category == 'Prairie Ridge Pregnancy Care') else
        (K('return_cap') if (late_leg == 'return' or plan_category == 'Prairie Ridge Pregnancy Care') else P('late_pickup_alt_reimbursement_max_usd'))
    - offered_cap: cap if P('late_pickup_alt_reimbursement_max_usd') > 0 else 0
    - fare: (fare_base + mile_fare * miles + escort_fare + waiting_charge) * leg_share
    - result: RND(MN(offered_cap, fare), 2)
    compute_basis:
      late_trip: >-
        An alternative-ride claim is worked out for the member's latest recorded late pickup, from that late leg and
        the registered legs of the same trip, and it records the trip's reservation number, the late leg, the late
        leg's date as its trip date and the amount.
      late_leg: >-
        An alternative-ride claim is worked out for the member's latest recorded late pickup, from that late leg and
        the registered legs of the same trip, and it records the trip's reservation number, the late leg, the late
        leg's date as its trip date and the amount.
      late_date: >-
        An alternative-ride claim is worked out for the member's latest recorded late pickup, from that late leg and
        the registered legs of the same trip, and it records the trip's reservation number, the late leg, the late
        leg's date as its trip date and the amount.
      miles: >-
        The standard alternative-ride allowance is the standard fare base plus the standard mile fare for each of
        the longest registered one-way miles among the trip's legs, plus the flat stranding charge for the wait.
      wheelchair_status: >-
        The fare base follows the help the member needs: a member who holds an approved or expired Durable Medical
        Equipment Authorization for a standard manual wheelchair, service code K0001, gets the accessible fare base;
        a member without one whose level gives door-to-door or door-through-door driver assistance gets the assisted
        fare base; any other member gets the standard fare base.
      fare_base: >-
        The fare base follows the help the member needs: a member who holds an approved or expired Durable Medical
        Equipment Authorization for a standard manual wheelchair, service code K0001, gets the accessible fare base;
        a member without one whose level gives door-to-door or door-through-door driver assistance gets the assisted
        fare base; any other member gets the standard fare base.
      pickup_at: >-
        The mile fare follows the late leg's scheduled pickup time: a pickup at or after the night-fare time gets
        the night mile fare, a pickup at or after the evening-fare time but before the night-fare time gets the evening
        mile fare, and an earlier pickup gets the standard mile fare.
      mile_fare: >-
        The mile fare follows the late leg's scheduled pickup time: a pickup at or after the night-fare time gets
        the night mile fare, a pickup at or after the evening-fare time but before the night-fare time gets the evening
        mile fare, and an earlier pickup gets the standard mile fare.
      escorts: >-
        Escorts who rode add an escort fare, the escorts being counted as persons, the most recorded on any one of
        the trip's registered legs: two or more escorts add the family escort fare, one escort adds the single escort
        fare, and no escort adds none.
      escort_fare: >-
        Escorts who rode add an escort fare, the escorts being counted as persons, the most recorded on any one of
        the trip's registered legs: two or more escorts add the family escort fare, one escort adds the single escort
        fare, and no escort adds none.
      minutes_late: >-
        The waiting charge is worked out by how late the pickup ran, every late pickup being more than the level's
        late threshold past the pickup window: when the minutes late are at least three times the late threshold,
        the charge is the wait minute fare for every minute past the pickup window; when they are at least twice the
        late threshold but under three times it, the charge is the wait minute fare for every minute beyond the late
        threshold; when they are under twice the late threshold, the charge is the flat stranding charge.
      waiting_charge: >-
        The waiting charge is worked out by how late the pickup ran, every late pickup being more than the level's
        late threshold past the pickup window: when the minutes late are at least three times the late threshold,
        the charge is the wait minute fare for every minute past the pickup window; when they are at least twice the
        late threshold but under three times it, the charge is the wait minute fare for every minute beyond the late
        threshold; when they are under twice the late threshold, the charge is the flat stranding charge.
      purpose: >-
        The share of the fare paid follows the kind of leg: a value-added leg of a benefit year whose allotment load
        entries carried more trips than its debit entries used is paid the covered value-added share; any other value-added
        leg is paid the uncovered value-added share; a medical leg is paid in full.
      leg_year: >-
        The share of the fare paid follows the kind of leg: a value-added leg of a benefit year whose allotment load
        entries carried more trips than its debit entries used is paid the covered value-added share; any other value-added
        leg is paid the uncovered value-added share; a medical leg is paid in full.
      year_loaded: >-
        The share of the fare paid follows the kind of leg: a value-added leg of a benefit year whose allotment load
        entries carried more trips than its debit entries used is paid the covered value-added share; any other value-added
        leg is paid the uncovered value-added share; a medical leg is paid in full.
      year_used: >-
        The share of the fare paid follows the kind of leg: a value-added leg of a benefit year whose allotment load
        entries carried more trips than its debit entries used is paid the covered value-added share; any other value-added
        leg is paid the uncovered value-added share; a medical leg is paid in full.
      leg_share: >-
        The share of the fare paid follows the kind of leg: a value-added leg of a benefit year whose allotment load
        entries carried more trips than its debit entries used is paid the covered value-added share; any other value-added
        leg is paid the uncovered value-added share; a medical leg is paid in full.
      plan_category: >-
        The allowance is capped per late leg: a late return leg of a member whose active plan membership is in Prairie
        Ridge Pregnancy Care is capped at the maternity return cap; a claim where exactly one of those two holds is
        capped at the return cap; any other claim is capped at the level's alternative-ride maximum.
      cap: >-
        The allowance is capped per late leg: a late return leg of a member whose active plan membership is in Prairie
        Ridge Pregnancy Care is capped at the maternity return cap; a claim where exactly one of those two holds is
        capped at the return cap; any other claim is capped at the level's alternative-ride maximum.
      offered_cap: >-
        A level whose alternative-ride maximum is zero offers no alternative-ride reimbursement, and every claim on
        it is capped at zero.
      fare: >-
        The fare is the fare base plus the mile fare times those miles plus the escort fare plus the waiting charge;
        it is multiplied by the leg's share, and the smaller of that fare and the cap is the amount, rounded to the
        nearest cent once, on the final amount only.
      result: >-
        The fare is the fare base plus the mile fare times those miles plus the escort fare plus the waiting charge;
        it is multiplied by the leg's share, and the smaller of that fare and the cap is the amount, rounded to the
        nearest cent once, on the final amount only.
    factors:
    - id: assistance_fare_base
      effect: parameter
      decides: fare_base
      bindings:
      - wheelchair_status
      - fare_base
      ladder:
      - when: an approved or expired standard manual wheelchair (K0001) equipment authorization is on record
        value: K('accessible_fare_base')
      - when: no such authorization and the level gives door-to-door or door-through-door driver assistance
        value: K('assisted_fare_base')
      - when: otherwise
        value: K('standard_fare_base')
      baseline:
        fare_base: K('standard_fare_base')
      evidence:
      - cross_category
      - tier_param
      cross_difficulty: auth
    - id: pickup_hour_mile_fare
      effect: parameter
      decides: mile_fare
      bindings:
      - pickup_at
      - mile_fare
      ladder:
      - when: the late leg's scheduled pickup is at or after the night-fare time
        value: K('night_mile_fare')
      - when: it is at or after the evening-fare time and before the night-fare time
        value: K('evening_mile_fare')
      - when: otherwise
        value: K('standard_mile_fare')
      baseline:
        mile_fare: K('standard_mile_fare')
      evidence:
      - history
      cross_difficulty: null
    - id: escort_fare_add
      effect: parameter
      decides: escort_fare
      bindings:
      - escorts
      - escort_fare
      ladder:
      - when: two or more escorts rode on the trip's registered legs
        value: K('family_escort_fare')
      - when: one escort rode
        value: K('single_escort_fare')
      - when: otherwise
        value: '0'
      baseline:
        escort_fare: '0'
      evidence:
      - history
      cross_difficulty: null
    - id: stranded_waiting_charge
      effect: method
      decides: waiting_charge
      bindings:
      - minutes_late
      - waiting_charge
      ladder:
      - when: the minutes late are at least three times the level's late threshold
        method: 'metered from the end of the pickup window: the wait minute fare times every minute late'
      - when: they are at least twice the late threshold and under three times it
        method: 'metered from the late threshold: the wait minute fare times the minutes beyond the late threshold'
      - when: otherwise (late, but under twice the late threshold)
        method: 'flat: the fixed stranding charge, whatever the minutes'
      baseline:
        waiting_charge: K('flat_strand_charge')
      evidence:
      - history
      cross_difficulty: null
    - id: leg_kind_share
      effect: parameter
      decides: leg_share
      bindings:
      - purpose
      - leg_year
      - year_loaded
      - year_used
      - leg_share
      ladder:
      - when: >-
          a value-added leg of a benefit year whose allotment load entries carried more trips than its debit entries
          used
        value: K('covered_va_share')
      - when: any other value-added leg
        value: K('uncovered_va_share')
      - when: otherwise (a medical leg)
        value: 1 (paid in full)
      baseline:
        leg_share: '1'
      evidence:
      - history
      cross_difficulty: null
    - id: return_leg_cap
      effect: parameter
      decides: cap
      bindings:
      - plan_category
      - cap
      ladder:
      - when: a late return leg of a member whose active plan membership is in Prairie Ridge Pregnancy Care
        value: K('maternity_return_cap')
      - when: exactly one of those two holds
        value: K('return_cap')
      - when: otherwise
        value: P('late_pickup_alt_reimbursement_max_usd')
      baseline:
        cap: P('late_pickup_alt_reimbursement_max_usd')
      evidence:
      - history
      - cross_category
      cross_difficulty: plan
    baseline:
      rule: >-
        The standard alternative-ride allowance is the standard fare base plus the standard mile fare for each of
        the longest registered one-way miles among the trip's legs, plus the flat stranding charge for the wait. The
        standard allowance is paid up to the level's alternative-ride maximum and rounded to the nearest cent.
      params:
      - standard_fare_base
      - standard_mile_fare
      - flat_strand_charge
      - late_pickup_alt_reimbursement_max_usd
    inputs:
      history:
      - table: ride_trips
        aggregate: latest
        field: minutes_late
        filters:
          event_type: ride_late_pickup
      - table: ride_trips
        aggregate: max
        field: one_way_miles
        filters:
          event_type: ride_trip_booked
      - table: ride_ledger
        aggregate: sum
        field: trips
        filters:
          event_type: ride_trip_allotment
      - table: ride_ledger
        aggregate: sum
        field: trips
        filters:
          event_type: ride_allotment_debit
      cross_category:
      - auth
      - plan
