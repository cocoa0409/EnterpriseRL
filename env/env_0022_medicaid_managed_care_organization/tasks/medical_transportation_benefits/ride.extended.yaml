    are loaded on January 1, or on activation for a benefit activated during the year, prorated where
    allotment_prorated as value_added_trips_per_year times the whole calendar months left in the year
    including the activation month, divided by 12 and rounded down to a whole trip. Each completed value-added
    leg uses one trip; a value-added trip is booked only while trips_remaining is at least the number
