    compute:
    - mileage_trip_date: >-
        LATEST('ride_ledger', 'claim_trip_date', date_field='posted_date', event_type='ride_mileage_approved', reimbursement_type='mileage')
    - stay_entry_date: >-
        LATEST('ride_ledger', 'claim_trip_date', date_field='posted_date', event_type='ride_mileage_approved', reimbursement_type='lodging_meals')
    - entries: SUM('ride_ledger', 'amount', event_type='ride_mileage_approved', claim_trip_date=mileage_trip_date)
    - out_date: >-
        LATEST('ride_trips', 'appointment_date', date_field='appointment_date', event_type='ride_trip_booked', leg='outbound')
    - ret_date: >-
        LATEST('ride_trips', 'appointment_date', date_field='appointment_date', event_type='ride_trip_booked', leg='return')
    - course_booked: >-
        XLATEST('plan', 'plan_claims', 'booked_date', date_field='service_date', event_type='plan_claim_booked', service_category='outpatient_hospital',
        adjudication_status='paid')
    - return_registered_on: >-
        LATEST('ride_trips', 'event_date', date_field='appointment_date', event_type='ride_trip_booked', leg='return')
    - clock_start: >-
        course_booked if (course_booked or '') > ret_date else (return_registered_on if return_registered_on > out_date
        else ret_date)
    - late_days: DAYS(clock_start, NOW)
    - credit_rate: >-
        K('long_late_credit_rate') if late_days > K('long_late_days') else (K('late_credit_rate') if late_days > P('mileage_payment_days')
        else 0)
    - stay_entry_nights: >-
        LATEST('ride_ledger', 'lodging_nights', date_field='posted_date', event_type='ride_mileage_approved', reimbursement_type='lodging_meals')
    - credit_scale: >-
        K('extended_stay_credit_factor') if (stay_entry_nights if stay_entry_date == mileage_trip_date else 0) >=
        K('extended_stay_nights') else (K('long_stay_credit_factor') if (stay_entry_nights if stay_entry_date == mileage_trip_date
        else 0) >= K('long_stay_nights') else 1)
    - plan_category: CFIELD('plan', 'variant_name', status='active')
    - income_pct: CFIELD('plan', 'income_pct_fpl', status='active')
    - allowance_tier: >-
        K('full_late_allowance') if ((plan_category == 'Prairie Ridge ABD Care' or plan_category == 'Prairie Ridge
        Dual Complete') and income_pct <= K('poverty_pct')) else (K('partial_late_allowance') if ((plan_category ==
        'Prairie Ridge ABD Care' or plan_category == 'Prairie Ridge Dual Complete') or income_pct <= K('poverty_pct'))
        else 0)
    - allowance: allowance_tier if late_days > P('mileage_payment_days') else 0
    - result: RND(entries + entries * credit_rate * credit_scale + allowance, 2)
    compute_basis:
      mileage_trip_date: >-
        A trip settlement releases every approved reimbursement entry the ledger carries for the trip, found by the
        trip date of the trip's mileage entry, which is the latest approved mileage entry on the ledger, in one payment
        recorded under the trip's mileage claim number.
      stay_entry_date: >-
        The credit rate is scaled by the lodging nights recorded on the latest lodging and meals entry on the ledger
        when that entry carries the trip's trip date: at least the extended-stay nights scales it by the extended-stay
        credit factor, at least the long-stay nights but fewer than the extended-stay nights by the long-stay credit
        factor, and fewer nights, or a latest lodging and meals entry for another trip date, or none, leaves it unscaled.
      entries: >-
        A trip settlement releases every approved reimbursement entry the ledger carries for the trip, found by the
        trip date of the trip's mileage entry, which is the latest approved mileage entry on the ledger, in one payment
        recorded under the trip's mileage claim number.
      out_date: >-
        The settlement clock starts on a date set by the records that show when the trip could first be settled: when
        the member's paid outpatient hospital claim with the latest service date was booked after the return leg's
        appointment date, the clock starts on that claim's booked date; when no such claim was booked after the return
        leg's appointment date but the return leg was registered after the outbound leg's appointment date, because
        the stay was extended while the member was away, the clock starts on the return leg's registration date; otherwise
        the clock starts on the return leg's appointment date.
      ret_date: >-
        The settlement clock starts on a date set by the records that show when the trip could first be settled: when
        the member's paid outpatient hospital claim with the latest service date was booked after the return leg's
        appointment date, the clock starts on that claim's booked date; when no such claim was booked after the return
        leg's appointment date but the return leg was registered after the outbound leg's appointment date, because
        the stay was extended while the member was away, the clock starts on the return leg's registration date; otherwise
        the clock starts on the return leg's appointment date.
      course_booked: >-
        The settlement clock starts on a date set by the records that show when the trip could first be settled: when
        the member's paid outpatient hospital claim with the latest service date was booked after the return leg's
        appointment date, the clock starts on that claim's booked date; when no such claim was booked after the return
