    - id: approved_miles_taper
      effect: method
      decides: tapered_miles
      bindings:
      - route_miles
      - tapered_miles
      ladder:
      - when: the approved miles are over the deep taper miles
        method: >-
          pay miles to the taper start in full, miles from the taper start to the deep taper miles at the taper share
          and the rest at the deep taper share
      - when: the approved miles are over the taper start miles and at or under the deep taper miles
        method: pay miles to the taper start in full and the rest at the taper share
      - when: otherwise
        method: pay every approved mile in full
      baseline:
        tapered_miles: approved_miles
      evidence:
      - history
      cross_difficulty: null
    baseline:
      rule: >-
        The standard approved miles are the round trip: the registered one-way miles of the trip's outbound and return
        legs added together, each measured by the shortest driving route. Every approved mile is paid at the level's
        standard mileage rate, and the amount is rounded to the nearest cent.
      params:
      - mileage_rate_usd
    inputs:
