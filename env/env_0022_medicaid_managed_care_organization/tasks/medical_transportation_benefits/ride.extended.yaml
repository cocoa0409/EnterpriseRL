extended_policies:
  - id: ride_ext_stay_lodging_meals
    base_policy_refs:
    - ride_late_pickup_policy
    - ride_mileage_reimbursement
    - ride_long_distance
    overwrite:
    - base_policy: ride_long_distance
      superseded_clause: >-
        For an approved long-distance trip of at least lodging_threshold_miles one way, lodging up to lodging_per_night_usd
        per night and meals up to meals_per_day_usd per travel day are reimbursed as a lodging_meals reimbursement.
      replaced_by: >-
        Lodging and meals on such a stay are paid as the allowances this rule sets out, whatever the receipts show.
    trigger: state_due
    subject:
    - ride_mileage_approved
    computes: amount
    target_tool: approve_stay_lodging_meals_3bb3a021
    params:
      early_start_time: 09:00
      late_finish_time: '15:00'
      weekly_stay_nights: 7
      monthly_stay_nights: 28
      weekly_stay_rate: 72.0
      monthly_stay_rate: 58.0
      mid_drive_miles: 150
      full_day_drive_miles: 300
      short_drive_edge_share: 0.5
      mid_drive_edge_share: 0.75
      course_claim_count: 8
      course_meals_rate: 31.0
      treatment_meals_rate: 28.0
      deep_poverty_pct: 50
      poverty_pct: 100
      deep_poverty_supplement: 6.5
      poverty_supplement: 3.25
      attendant_full_share: 1.0
      attendant_half_share: 0.5
    rule: >-
      A lodging and meals entry is booked for a registered long-distance trip whose one-way miles are at least the
      level's lodging threshold and whose stay includes at least one lodging night, and it is worked out from that
      trip's registered outbound and return legs, which are the member's latest registered legs of each kind. Lodging
      and meals on such a stay are paid as the allowances this rule sets out, whatever the receipts show. The lodging
      nights are the nights between the outbound leg's appointment date and the return leg's appointment date. Each
      lodging night is paid at the level's standard nightly lodging allowance. The travel days are the lodging nights
      plus one, and each travel day is paid the level's standard daily meals allowance in full. The entry's amount
      is the lodging part plus the meals part, rounded to the nearest cent. The lodging nights also take in the nights
      the appointment times need: when the outbound leg's appointment starts before the early-start time and the return
      leg's appointment starts at or after the late-finish time, the night before the first appointment and the night
      after the last are added to the nights between the two appointment dates; when exactly one of those two holds,
      the one night it needs is added; when neither holds, only the nights between the two appointment dates count.
      The lodging nights are paid on a taper set by how many nights lie between the two appointment dates: when those
      are at least the monthly-stay nights, the first weekly-stay nights of the stay are paid the level's standard
      nightly lodging allowance, the following nights up to the monthly-stay nights the weekly-stay nightly rate,
      and every later night the monthly-stay nightly rate; when they are at least the weekly-stay nights but fewer
      than the monthly-stay nights, the first weekly-stay nights are paid the standard nightly allowance and every
      later night the weekly-stay nightly rate; when they are fewer than the weekly-stay nights, every lodging night
      is paid the standard nightly allowance. The first and last travel days of a stay count toward meals at a share
      set by the longest registered one-way miles among the trip's legs: under the mid-drive miles each of the two
      counts at the short-drive share; from the mid-drive miles up to but not including the full-day-drive miles each
      counts at the mid-drive share; at or above the full-day-drive miles each counts in full; every travel day between
      them counts in full, so the meal days are the travel days less twice the part of an edge day that is not counted.
      The daily meals allowance follows the treatment course: when the outbound leg's trip purpose is radiation or
      chemotherapy and the member has at least the course claim count of paid outpatient hospital claims with service
      dates in the last three months, it is the treatment-course meals rate; when exactly one of those two holds,
      it is the treatment meals rate; when neither holds, it is the level's standard daily meals allowance. A meal
      supplement is added to each meal day's allowance by the household income the member's active plan membership
      records: at or below the deep-poverty percent of the federal poverty level the deep-poverty meal supplement,
      above that and at or below the poverty percent the poverty meal supplement, and above the poverty percent no
      supplement. The attendant who travels with the member is paid meals as a share of the member's meals: the full
      attendant share when the member holds an approved or expired Durable Medical Equipment Authorization for a standard
      manual wheelchair, service code K0001, and the active plan membership is in Prairie Ridge ABD Care or Prairie
      Ridge Dual Complete; the half attendant share when exactly one of those two holds; and no attendant share when
      neither holds. The lodging part is the tapered lodging pay; the meals part is the meal days times the sum of
      the daily meals allowance and the meal supplement, and that product is then raised by the attendant share; the
      amount is the lodging part plus the meals part, rounded to the nearest cent once, on the final amount only.
      The entry records the trip's reservation number, the round trip as its leg, the outbound leg's appointment date
      as its trip date, the lodging nights and the travel days.
    prerequisite: []
    cross_category:
    - category: plan
      as: branch
      reads:
      - variant_name
      - income_pct_fpl
      - plan_claims.service_date
      - plan_claims.service_category
      - plan_claims.adjudication_status
      note: >-
        The treatment-course meals rate counts paid outpatient hospital claims, the meal supplement reads the recorded
        household income, and the attendant share reads the eligibility category.
    - category: auth
      as: branch
      reads:
      - status
      - variant_name
      - service_code
      note: >-
        The attendant share reads whether an approved or expired wheelchair (K0001) equipment authorization documents
        wheelchair use.
    compute:
    - out_date: >-
        LATEST('ride_trips', 'appointment_date', date_field='appointment_date', event_type='ride_trip_booked', leg='outbound')
    - ret_date: >-
        LATEST('ride_trips', 'appointment_date', date_field='appointment_date', event_type='ride_trip_booked', leg='return')
    - base_nights: DAYS(out_date, ret_date)
    - first_start: >-
        LATEST('ride_trips', 'appointment_time', date_field='appointment_date', event_type='ride_trip_booked', leg='outbound')
    - last_start: >-
        LATEST('ride_trips', 'appointment_time', date_field='appointment_date', event_type='ride_trip_booked', leg='return')
    - stay_nights: >-
        base_nights + 2 if (first_start < K('early_start_time') and last_start >= K('late_finish_time')) else (base_nights
        + 1 if (first_start < K('early_start_time') or last_start >= K('late_finish_time')) else base_nights)
    - lodging_part: >-
        (K('weekly_stay_nights') * P('lodging_per_night_usd') + (K('monthly_stay_nights') - K('weekly_stay_nights'))
        * K('weekly_stay_rate') + (stay_nights - K('monthly_stay_nights')) * K('monthly_stay_rate')) if base_nights
        >= K('monthly_stay_nights') else ((K('weekly_stay_nights') * P('lodging_per_night_usd') + (stay_nights - K('weekly_stay_nights'))
        * K('weekly_stay_rate')) if base_nights >= K('weekly_stay_nights') else stay_nights * P('lodging_per_night_usd'))
    - trip_no: >-
        LATEST('ride_trips', 'trip_number', date_field='appointment_date', event_type='ride_trip_booked', leg='outbound')
    - one_way: MAX('ride_trips', 'one_way_miles', event_type='ride_trip_booked', trip_number=trip_no)
    - edge_day_share: >-
        K('short_drive_edge_share') if one_way < K('mid_drive_miles') else (K('mid_drive_edge_share') if one_way <
        K('full_day_drive_miles') else 1)
    - travel_days: stay_nights + 1
    - meal_days: travel_days - 2 * (1 - edge_day_share)
    - purpose: >-
        LATEST('ride_trips', 'trip_purpose', date_field='appointment_date', event_type='ride_trip_booked', leg='outbound')
    - course_claims: >-
        XCOUNT('plan', 'plan_claims', within_months=3, date_field='service_date', event_type='plan_claim_booked',
        service_category='outpatient_hospital', adjudication_status='paid')
    - meals_rate: >-
        K('course_meals_rate') if ((purpose == 'radiation' or purpose == 'chemotherapy') and course_claims >= K('course_claim_count'))
        else (K('treatment_meals_rate') if ((purpose == 'radiation' or purpose == 'chemotherapy') or course_claims
        >= K('course_claim_count')) else P('meals_per_day_usd'))
    - income_pct: CFIELD('plan', 'income_pct_fpl', status='active')
    - meal_supplement: >-
        K('deep_poverty_supplement') if income_pct <= K('deep_poverty_pct') else (K('poverty_supplement') if income_pct
        <= K('poverty_pct') else 0)
    - wheelchair_status: >-
        CFIELD('auth', 'status', variant_name='Durable Medical Equipment Authorization', service_code='K0001')
    - plan_category: CFIELD('plan', 'variant_name', status='active')
    - attendant_share: >-
        K('attendant_full_share') if ((wheelchair_status == 'approved' or wheelchair_status == 'expired') and (plan_category
        == 'Prairie Ridge ABD Care' or plan_category == 'Prairie Ridge Dual Complete')) else (K('attendant_half_share')
        if ((wheelchair_status == 'approved' or wheelchair_status == 'expired') or (plan_category == 'Prairie Ridge
        ABD Care' or plan_category == 'Prairie Ridge Dual Complete')) else 0)
    - meals_part: meal_days * (meals_rate + meal_supplement) * (1 + attendant_share)
    - result: RND(lodging_part + meals_part, 2)
    compute_basis:
      out_date: >-
        A lodging and meals entry is booked for a registered long-distance trip whose one-way miles are at least the
        level's lodging threshold and whose stay includes at least one lodging night, and it is worked out from that
        trip's registered outbound and return legs, which are the member's latest registered legs of each kind.
