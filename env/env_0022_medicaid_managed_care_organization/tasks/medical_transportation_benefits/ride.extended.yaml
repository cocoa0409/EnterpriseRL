        debited trips annualized, multiplied by twelve and divided by those months; a benefit that had trips for seven
        to eleven months has one trip added to its debited trips for each month without trips; a benefit that had
        trips all twelve months has its use counted as debited.
      carry_share: >-
        The share of the unused trips that may be carried follows that measured use: a use of at least the full-carry
        use lets all of them be carried, a use of at least the half-carry use but under the full-carry use lets the
        half-carry share of them be carried, rounded down to a whole trip, and a lower use lets none be carried.
      plan_category: >-
        The most trips a member may carry follows the eligibility category of the active plan membership: Prairie
        Ridge Pregnancy Care carries up to the prenatal carry cap; Prairie Ridge Family Care, Prairie Ridge Children's
        Medicaid and Prairie Ridge CHIP Kids carry up to the family carry cap; every other category carries none.
      carry_cap: >-
        The most trips a member may carry follows the eligibility category of the active plan membership: Prairie
        Ridge Pregnancy Care carries up to the prenatal carry cap; Prairie Ridge Family Care, Prairie Ridge Children's
        Medicaid and Prairie Ridge CHIP Kids carry up to the family carry cap; every other category carries none.
      pcp_visit_count: >-
        A member who keeps up with primary care may carry more: at least the engaged visit count of primary care visits
        in the last twelve months adds the engaged cap bonus to the most trips carried, one or more visits but fewer
        than that adds the seen cap bonus, and no visit adds nothing.
      cap_bonus: >-
        A member who keeps up with primary care may carry more: at least the engaged visit count of primary care visits
        in the last twelve months adds the engaged cap bonus to the most trips carried, one or more visits but fewer
        than that adds the seen cap bonus, and no visit adds nothing.
      carried: >-
        The trips carried are the smaller of the most trips the member may carry and the carried share of the unused
        trips; the expiry entry carries the unused trips less the trips carried, and the carried trips stay on the
        benefit for the next year.
      result: >-
        The trips carried are the smaller of the most trips the member may carry and the carried share of the unused
        trips; the expiry entry carries the unused trips less the trips carried, and the carried trips stay on the
        benefit for the next year.
    factors:
    - id: partial_year_use_measure
      effect: method
      decides: measured_use
      bindings:
      - load_posted
      - months_with_trips
      - measured_use
      ladder:
      - when: >-
          the benefit had trips in the year for six months or fewer (counted from the month the year's allotment load
          posted through December)
        method: 'annualize the debited trips: times twelve, divided by the months with trips'
      - when: the benefit had trips for seven to eleven months
        method: add one trip to the debited trips for each month without trips
      - when: otherwise (trips all twelve months)
        method: count the debited trips as they stand
      baseline:
        measured_use: used
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: use_carry_share
      effect: parameter
      decides: carry_share
      bindings:
      - used
      - carry_share
      ladder:
      - when: the measured use is at least the full-carry use
        value: 1 (all unused trips)
      - when: the measured use is at least the half-carry use and under the full-carry use
        value: K('half_carry_share')
      - when: otherwise
