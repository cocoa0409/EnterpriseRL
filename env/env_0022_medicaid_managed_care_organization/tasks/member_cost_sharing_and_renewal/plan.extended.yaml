- id: plan_ext_lockout_balance_payment
  base_policy_refs:
  - plan_evt_premium
  - plan_evt_cost_share_cap
  overwrite:
  - base_policy: plan_evt_premium
    superseded_clause: A payment is applied first to the oldest billed coverage month that is not yet paid or waived,
      and a payment that exceeds all billed months is applied to future months up to premium_prepay_max_months,
      with any remainder returned to the payer.
    replaced_by: The lockout balance is what the family pays, in one payment against the coverage month in which
      the membership ended, to re-enroll in the category while the lockout runs, and that payment settles every
      billed month of the ended membership.
  - base_policy: plan_evt_premium
    superseded_clause: After a premium_nonpayment termination the family may re-enroll in the category within premium_lockout_days
      only by paying the past-due balance in full.
    replaced_by: The lockout balance is the owed months times the month rate, less the offsets and reliefs that
      apply, never below zero and rounded half up to the cent.
  trigger: on_request
  subject:
  - plan_premium_paid
  computes: payment_amount
  target_tool: pay_lockout_premium_balance_44198c5a
  params:
    band_one_top_pct: 185
    band_one_monthly_usd: 20.0
    band_two_top_pct: 210
    band_two_monthly_usd: 35.0
    medical_need_relief_full_usd: 35.0
    medical_need_relief_partial_usd: 17.5
    history_months: 18
    steady_history_min_payments: 8
    first_default_relief_full_usd: 10.0
    first_default_relief_partial_usd: 5.0
    half_up_guard: 1.0e-06
  rule: 'The lockout balance is what the family pays, in one payment against the coverage month in which the membership
    ended, to re-enroll in the category while the lockout runs, and that payment settles every billed month of the
    ended membership. The lockout balance is the owed months times the month rate, less the offsets and reliefs
    that apply, never below zero and rounded half up to the cent. The owed months are the billed coverage months
    that carry no payment or waiver, and the month rate is the amount of the most recent bill. Which bills are owed
    follows the bills issued around the end of coverage: where the most recent bill is for a coverage month that
    began after the termination date and was posted before the termination date, that bill alone is void; where
    the most recent bill is for a coverage month that began after the termination date and was posted on or after
    the termination date, every bill posted on or after the termination date is void; otherwise every unsettled
    month is owed. The month rate follows the premium band the household income on file sets: a household at or
    below the first band top percent of the federal poverty level owes the first band monthly amount for each owed
    month, a household above it and at or below the second band top percent owes the second band monthly amount,
    and any other household owes the amount of the most recent bill. Credits the plan owes the family are offset
    against the lockout balance when the plan corrected the family''s copays: where copay reversals and an over-cap
    refund were both booked in the counting window, the copay reversals and the over-cap refunds booked in the counting
    window are both offset; where copay reversals were booked in the counting window and no over-cap refund was,
    only those copay reversals are offset; otherwise nothing is offset, and an over-cap refund booked on its own
    is paid out as a refund. The counting window is the number of months in the category''s cap period counted back
    from the review date, a date counting when it lies fewer than that many whole months before the review date.
    The medical-need relief follows ongoing care: where the member has a rehabilitation therapy or home health authorization
    approved on a request received in the counting window, whether still approved or since expired, and enrolled
    in a care management episode in the counting window, the relief is the full medical-need relief; where the member
    has such an authorization and no such enrollment, the relief is the partial medical-need relief; otherwise there
    is no medical-need relief. The first-default relief follows the family''s payment history: where at least the
    steady-history minimum of premium payments posted in the history months before the review date and no financial
    hardship waiver posted in that time, the relief is the full first-default relief; where at least that many payments
    posted and a financial hardship waiver also posted in that time, the relief is the partial first-default relief;
    otherwise there is no first-default relief. The lockout balance is not accepted until the visits of the member''s
    approved therapy course carry their course re-rating adjustment entry. The lockout balance is fixed only after
    the ambulance claims under review carry their ambulance re-rating adjustment entry.'
  prerequisite:
  - problem: plan_ext_therapy_course_rerating
    kind: value_input
    gate: credit_offset
    form: state
    policy_source: The lockout balance is not accepted until the visits of the member's approved therapy course
      carry their course re-rating adjustment entry.
    condition: The claim ledger holds an adjustment entry, booked against the most recently serviced visit of the
      approved therapy course, that returns the course copay excess.
    resolved_by: book_therapy_course_rerating_7ffa3e71
    effect: The course re-rating entry is a copay reversal booked in the counting window, so the reversals offset
      against the lockout balance grow by the course reversal.
  - problem: plan_ext_ambulance_transport_rerating
    kind: value_input
    gate: credit_offset
    form: state
    policy_source: The lockout balance is fixed only after the ambulance claims under review carry their ambulance
      re-rating adjustment entry.
    condition: The claim ledger holds an adjustment entry, booked against the most recently serviced ambulance claim
      under review, that returns the transport copay excess.
    resolved_by: book_ambulance_transport_rerating_8b982fa6
    effect: The ambulance re-rating entry is a copay reversal booked in the counting window, so the reversals offset
      against the lockout balance grow by the ambulance reversal.
  cross_category:
  - category: auth
    as: branch
    reads:
    - auth_authorizations.status
    - auth_authorizations.variant_name
    - auth_authorizations.received_date
    note: The medical-need relief counts rehabilitation therapy and home health authorizations approved in the counting
      window.
  - category: care
    as: existence
    reads:
    - status
    note: The medical-need relief reads whether an active care management episode is held.
  compute:
  - win: P('cost_share_cap_period_months')
  - billed_count: COUNT('plan_premiums', event_type='plan_premium_billed')
  - settled_count: COUNT('plan_premiums', event_type='plan_premium_paid') + COUNT('plan_premiums', event_type='plan_premium_waived')
  - open_months: billed_count - settled_count
  - latest_cm: LATEST('plan_premiums', 'coverage_month', date_field='posted_date', event_type='plan_premium_billed')
  - latest_amt: LATEST('plan_premiums', 'amount', date_field='posted_date', event_type='plan_premium_billed')
  - posted_after_end: COUNT('plan_premiums', within_months=MONTHS(F('termination_date'), NOW), date_field='posted_date',
      event_type='plan_premium_billed')
  - latest_posted: LATEST('plan_premiums', 'posted_date', date_field='posted_date', event_type='plan_premium_billed')
  - owed_months: (open_months - 1 if latest_cm > F('termination_date') and latest_posted < F('termination_date')
      else ((open_months - posted_after_end) if latest_cm > F('termination_date') and latest_posted >= F('termination_date')
      else open_months))
  - month_rate: (K('band_one_monthly_usd') if F('income_pct_fpl') <= K('band_one_top_pct') else (K('band_two_monthly_usd')
      if F('income_pct_fpl') <= K('band_two_top_pct') else latest_amt))
  - owed_total: owed_months * month_rate
  - reversals_booked: 0 - SUM('plan_claims', 'member_cost_share', within_months=win, date_field='booked_date', event_type='plan_claim_adjusted')
  - refunds_booked: 0 - SUM('plan_claims', 'member_cost_share', within_months=win, date_field='booked_date', event_type='plan_cost_share_refund')
  - credit_offset: ((reversals_booked + refunds_booked) if reversals_booked > 0 and refunds_booked > 0 else (reversals_booked
      if reversals_booked > 0 and refunds_booked == 0 else 0))
  - ongoing_care_auths: XCOUNT('auth', 'auth_authorizations', within_months=win, date_field='received_date', status='approved',
      variant_name='Outpatient Rehabilitation Therapy Authorization') + XCOUNT('auth', 'auth_authorizations', within_months=win,
      date_field='received_date', status='expired', variant_name='Outpatient Rehabilitation Therapy Authorization')
      + XCOUNT('auth', 'auth_authorizations', within_months=win, date_field='received_date', status='approved',
      variant_name='Home Health Services Authorization') + XCOUNT('auth', 'auth_authorizations', within_months=win,
      date_field='received_date', status='expired', variant_name='Home Health Services Authorization')
  - episode_enrolled: XCOUNT('care', 'care_enrollments', within_months=win, date_field='enrollment_date') >= 1
  - need_relief: (K('medical_need_relief_full_usd') if ongoing_care_auths >= 1 and episode_enrolled else (K('medical_need_relief_partial_usd')
      if ongoing_care_auths >= 1 and not episode_enrolled else 0))
  - history_payments: COUNT('plan_premiums', within_months=K('history_months'), date_field='posted_date', event_type='plan_premium_paid')
  - hardship_waivers: COUNT('plan_premiums', within_months=K('history_months'), date_field='posted_date', event_type='plan_premium_waived',
      waiver_reason='financial_hardship')
  - first_default_relief: (K('first_default_relief_full_usd') if history_payments >= K('steady_history_min_payments')
      and hardship_waivers == 0 else (K('first_default_relief_partial_usd') if history_payments >= K('steady_history_min_payments')
      and hardship_waivers >= 1 else 0))
  - result: RND(MX(0, owed_total - credit_offset - need_relief - first_default_relief) + K('half_up_guard'), 2)
  compute_basis:
    win: The counting window is the number of months in the category's cap period counted back from the review date,
      a date counting when it lies fewer than that many whole months before the review date.
    billed_count: The owed months are the billed coverage months that carry no payment or waiver, and the month
      rate is the amount of the most recent bill.
    settled_count: The owed months are the billed coverage months that carry no payment or waiver, and the month
      rate is the amount of the most recent bill.
    open_months: The owed months are the billed coverage months that carry no payment or waiver, and the month rate
      is the amount of the most recent bill.
    latest_cm: where the most recent bill is for a coverage month that began after the termination date and was
      posted before the termination date, that bill alone is void
    latest_posted: and was posted on or after the termination date, every bill posted on or after the termination
      date is void
    latest_amt: The owed months are the billed coverage months that carry no payment or waiver, and the month rate
      is the amount of the most recent bill.
    posted_after_end: every bill posted on or after the termination date is void
    owed_months: 'Which bills are owed follows the bills issued around the end of coverage: where the most recent
      bill is for a coverage month that began after the termination date and was posted before the termination date,
      that bill alone is void; where the most recent bill is for a coverage month that began after the termination
      date and was posted on or after the termination date, every bill posted on or after the termination date is
      void; otherwise every unsettled month is owed.'
    month_rate: 'The month rate follows the premium band the household income on file sets: a household at or below
      the first band top percent of the federal poverty level owes the first band monthly amount for each owed month,
      a household above it and at or below the second band top percent owes the second band monthly amount, and
      any other household owes the amount of the most recent bill.'
    owed_total: The lockout balance is the owed months times the month rate, less the offsets and reliefs that apply,
      never below zero and rounded half up to the cent.
    reversals_booked: only those copay reversals are offset
    refunds_booked: the copay reversals and the over-cap refunds booked in the counting window are both offset
    credit_offset: 'Credits the plan owes the family are offset against the lockout balance when the plan corrected
      the family''s copays: where copay reversals and an over-cap refund were both booked in the counting window,
      the copay reversals and the over-cap refunds booked in the counting window are both offset; where copay reversals
      were booked in the counting window and no over-cap refund was, only those copay reversals are offset; otherwise
      nothing is offset, and an over-cap refund booked on its own is paid out as a refund.'
    ongoing_care_auths: where the member has a rehabilitation therapy or home health authorization approved on a
      request received in the counting window, whether still approved or since expired
    episode_enrolled: and enrolled in a care management episode in the counting window
    need_relief: 'The medical-need relief follows ongoing care: where the member has a rehabilitation therapy or
      home health authorization approved on a request received in the counting window, whether still approved or
      since expired, and enrolled in a care management episode in the counting window, the relief is the full medical-need
      relief; where the member has such an authorization and no such enrollment, the relief is the partial medical-need
      relief; otherwise there is no medical-need relief.'
    history_payments: where at least the steady-history minimum of premium payments posted in the history months
      before the review date
    hardship_waivers: and no financial hardship waiver posted in that time
    first_default_relief: 'The first-default relief follows the family''s payment history: where at least the steady-history
      minimum of premium payments posted in the history months before the review date and no financial hardship
      waiver posted in that time, the relief is the full first-default relief; where at least that many payments
      posted and a financial hardship waiver also posted in that time, the relief is the partial first-default relief;
      otherwise there is no first-default relief.'
    result: The lockout balance is the owed months times the month rate, less the offsets and reliefs that apply,
      never below zero and rounded half up to the cent.
  factors:
  - id: void_bill_by_termination
    effect: method
    decides: owed_months
    bindings:
    - latest_cm
    - latest_posted
    - posted_after_end
    - owed_months
    ladder:
    - when: most recent bill for a coverage month beginning after the termination date AND posted before the termination
        date
      method: that bill alone is void; the other unsettled months are owed
    - when: most recent bill for a coverage month beginning after the termination date AND posted on or after the
        termination date
      method: every bill posted on or after the termination date is void; the other unsettled months are owed
    - when: otherwise
      method: every unsettled month is owed
    baseline:
      owed_months: open_months
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: lockout_month_rate_by_income_band
    effect: parameter
    decides: month_rate
    bindings:
    - latest_amt
    - month_rate
    ladder:
    - when: household income on file at or below the first band top percent of FPL
      value: K('band_one_monthly_usd')
    - when: above the first band top and at or below the second band top percent
      value: K('band_two_monthly_usd')
    - when: otherwise
      value: the amount of the most recent bill
    baseline:
      month_rate: latest_amt
    evidence:
    - history
    cross_difficulty: null
  - id: credit_offset_on_lockout
    effect: method
    decides: credit_offset
    bindings:
    - reversals_booked
    - refunds_booked
    - credit_offset
    ladder:
    - when: copay reversals booked in the counting window AND an over-cap refund booked in the window
      method: offset the copay reversals and over-cap refunds booked in the window
    - when: copay reversals booked in the window AND no over-cap refund booked in it
      method: offset only the copay reversals booked in the window
    - when: otherwise (no copay reversal booked in the window)
      method: offset nothing; an over-cap refund booked on its own is paid out as a refund
    baseline:
      credit_offset: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: medical_need_relief
    effect: parameter
    decides: need_relief
    bindings:
    - ongoing_care_auths
    - episode_enrolled
    - need_relief
    ladder:
    - when: a rehabilitation therapy or home health authorization approved (still approved or since expired) on
        a request received in the counting window AND a care management episode enrolled in the window
      value: K('medical_need_relief_full_usd')
    - when: such an authorization AND no episode enrolled in the window
      value: K('medical_need_relief_partial_usd')
    - when: otherwise
      value: '0'
    baseline:
      need_relief: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: auth
  - id: first_default_relief
    effect: parameter
    decides: first_default_relief
    bindings:
    - history_payments
    - hardship_waivers
    - first_default_relief
    ladder:
    - when: at least the steady-history minimum of payments in the history months AND no financial hardship waiver
        in that time
      value: K('first_default_relief_full_usd')
    - when: that many payments AND a financial hardship waiver in that time
      value: K('first_default_relief_partial_usd')
    - when: otherwise
      value: '0'
    baseline:
      first_default_relief: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: The lockout balance is what the family pays, in one payment against the coverage month in which the membership
      ended, to re-enroll in the category while the lockout runs, and that payment settles every billed month of
      the ended membership. The lockout balance is the owed months times the month rate, less the offsets and reliefs
      that apply, never below zero and rounded half up to the cent. The owed months are the billed coverage months
      that carry no payment or waiver, and the month rate is the amount of the most recent bill.
    params:
    - cost_share_cap_period_months
  inputs:
    history:
    - table: plan_premiums
      aggregate: count
      field: plan_premium_id
      filters:
        event_type: plan_premium_billed
    - table: plan_claims
      aggregate: sum
      field: member_cost_share
      within_months: 12
      filters:
        event_type: plan_claim_adjusted
    - category: auth
      table: auth_authorizations
      aggregate: count
      field: authorization_id
      within_months: 12
      filters:
        status: approved
    cross_category:
    - auth
    - care
- id: plan_ext_therapy_course_rerating
  base_policy_refs:
  - plan_evt_claim_adjustment
  - plan_evt_copay
  overwrite:
  - base_policy: plan_evt_claim_adjustment
    superseded_clause: An adjustment reverses the whole member cost share of one original claim identified by its
      claim number and is booked with a new adjustment claim number whose related_claim_number is the original claim
      number.
    replaced_by: The course re-rating is booked as one adjustment entry that names the most recently serviced claim
      of the course batch as its original claim and carries the course reversal as a negative member cost share.
  - base_policy: plan_evt_claim_adjustment
    superseded_clause: 'Valid adjustment reasons are recorded in denial_code: not_eligible_on_service_date when
      coverage is found not to have been in force on the service date, duplicate_claim when the same service was
      booked twice, and not_covered when the service is reclassified as non-covered; a reason outside these is not
      an adjustment and cannot be booked.'
    replaced_by: A course re-rating reverses part of the course copays and no service, so it carries the reason
      code none.
  - base_policy: plan_evt_copay
    superseded_clause: Each paid claim is assessed the copay the member's category sets for the claim's service_category,
      once per claim, with no copay on denied claims.
    replaced_by: A re-rated course visit carries the re-rated copay this rule sets in place of the copay the category
      schedule sets for its service category.
  trigger: state_due
  subject:
  - plan_claim_adjusted
  computes: reversal_amount
  target_tool: book_therapy_course_rerating_7ffa3e71
  params:
    therapy_window_months: 12
    rehab_visit_copay_usd: 2.0
    speech_visit_copay_usd: 1.0
    intake_visits_in_network: 1
    intake_visits_out_of_network: 2
    coordinated_extension_copay_usd: 0.0
    uncoordinated_extension_copay_usd: 1.0
    transported_course_min_trips: 3
    transported_course_credit_usd: 1.0
    occasional_transport_credit_usd: 0.5
    signed_care_plan_credit_usd: 0.5
    unsigned_care_plan_credit_usd: 0.25
    half_up_guard: 1.0e-06
  rule: 'A course of outpatient therapy under an approved rehabilitation therapy authorization is rated as one course
    rather than visit by visit. The therapy window is the therapy window months counted back from the review date,
    a date counting when it lies fewer than that many whole months before the review date. The course batch is every
    paid outpatient hospital claim whose service date falls in the therapy window and whose billing provider is
    the servicing provider of the member''s rehabilitation therapy authorization approved on a request received
    in the therapy window, whether it is still approved or has since expired. The course reversal is the copays
    booked on the course batch less the re-rated copays, rounded half up to the cent, and each course visit is re-rated
    at the category''s outpatient hospital copay. Which visits belong to the course follows the authorization''s
    dates: where the course start date falls inside the therapy window and the authorization end date has already
    passed, the course holds the visits dated within one more than the whole months elapsed since the course start
    date, less those dated within the whole months elapsed since the end date; where the course start date falls
    inside the window and the end date has not passed, the course holds the visits dated within one more than the
    whole months elapsed since the course start date; otherwise the course holds every visit of the servicing provider
    in the window. The re-rated copay of a course visit follows the therapy discipline of the authorization: physical
    therapy and occupational therapy re-rate at the rehabilitation visit copay, speech therapy re-rates at the speech
    visit copay, and any other discipline keeps the category''s outpatient hospital copay. The course keeps intake
    visits at the copay booked on them: a course a provider requested from an in-network servicing provider keeps
    the in-network intake visit count, a course a provider requested from an out-of-network servicing provider keeps
    the out-of-network intake visit count, and any other course, such as one carried over from a previous plan or
    approved on a retroactive request, keeps no intake visit; no more intake visits are kept than the course holds.
    Course visits beyond the units the authorization originally requested are extension visits: where the authorization
    approved more units than were requested and the member enrolled in a care management episode during the therapy
    window, extension visits re-rate at the coordinated extension copay; where more units were approved than requested
    and no such enrollment exists, extension visits re-rate at the uncoordinated extension copay; otherwise extension
    visits re-rate like every other course visit. The re-rated copay of the course visits that are neither intake
    nor extension visits is lowered by the transport credit and the care plan credit, never below zero. The transport
    credit follows how the child reaches therapy: where the member''s transportation level of service is RideLink
    Wheelchair Van or RideLink Stretcher Van and at least the transported course minimum of completed trips reached
    the therapy provider in the window, the credit is the transported course credit; where that level of service
    holds with fewer such trips, the credit is the occasional transport credit; otherwise there is no transport
    credit. The care plan credit follows care management: where the member enrolled in a care management episode
    during the therapy window and signed a care plan version in the window, the credit is the signed care plan credit;
    where the member enrolled in such an episode without signing a care plan version in the window, the credit is
    the unsigned care plan credit; otherwise there is no care plan credit. The course re-rating is booked as one
    adjustment entry that names the most recently serviced claim of the course batch as its original claim and carries
    the course reversal as a negative member cost share. A course re-rating reverses part of the course copays and
    no service, so it carries the reason code none. A re-rated course visit carries the re-rated copay this rule
    sets in place of the copay the category schedule sets for its service category.'
  prerequisite: []
  cross_category:
  - category: auth
    as: branch
    reads:
    - servicing_provider_npi
    - start_date
    - end_date
    - therapy_discipline
    - network_status
    - units_requested
    - units_approved
    - status
    - variant_name
    note: The course scope, discipline, intake and extension factors read the approved rehabilitation therapy authorization.
  - category: ride
    as: history
    reads:
    - variant_name
    - ride_trips.destination_npi
    - ride_trips.appointment_date
    note: The transport credit reads the level of service and counts completed trips to the therapy provider.
  - category: care
    as: history
    reads:
    - status
    - care_activities.event_type
    - care_activities.member_signed
    note: The care plan credit and the extension factor read the active episode and signed care plan versions.
  compute:
  - twin: K('therapy_window_months')
  - course_approved: XCOUNT('auth', 'auth_authorizations', within_months=twin, date_field='received_date', status='approved',
      variant_name='Outpatient Rehabilitation Therapy Authorization') + XCOUNT('auth', 'auth_authorizations', within_months=twin,
      date_field='received_date', status='expired', variant_name='Outpatient Rehabilitation Therapy Authorization')
      >= 1
  - ther_npi: (CFIELD('auth', 'servicing_provider_npi', variant_name='Outpatient Rehabilitation Therapy Authorization')
      if course_approved else 'none')
  - all_visits: COUNT('plan_claims', within_months=twin, date_field='service_date', event_type='plan_claim_booked',
      adjudication_status='paid', service_category='outpatient_hospital', provider_npi=ther_npi)
  - all_copays: SUM('plan_claims', 'member_cost_share', within_months=twin, date_field='service_date', event_type='plan_claim_booked',
      adjudication_status='paid', service_category='outpatient_hospital', provider_npi=ther_npi)
  - start_back: (MONTHS(CFIELD('auth', 'start_date', variant_name='Outpatient Rehabilitation Therapy Authorization'),
      NOW) + 1 if course_approved else twin)
  - end_back: (MONTHS(CFIELD('auth', 'end_date', variant_name='Outpatient Rehabilitation Therapy Authorization'),
      NOW) if course_approved else 0)
  - end_passed: (DAYS(CFIELD('auth', 'end_date', variant_name='Outpatient Rehabilitation Therapy Authorization'),
      NOW) > 0 if course_approved else False)
  - from_start_visits: COUNT('plan_claims', within_months=start_back, date_field='service_date', event_type='plan_claim_booked',
      adjudication_status='paid', service_category='outpatient_hospital', provider_npi=ther_npi)
  - from_start_copays: SUM('plan_claims', 'member_cost_share', within_months=start_back, date_field='service_date',
      event_type='plan_claim_booked', adjudication_status='paid', service_category='outpatient_hospital', provider_npi=ther_npi)
  - after_end_visits: COUNT('plan_claims', within_months=end_back, date_field='service_date', event_type='plan_claim_booked',
      adjudication_status='paid', service_category='outpatient_hospital', provider_npi=ther_npi)
  - after_end_copays: SUM('plan_claims', 'member_cost_share', within_months=end_back, date_field='service_date',
      event_type='plan_claim_booked', adjudication_status='paid', service_category='outpatient_hospital', provider_npi=ther_npi)
  - course_visits: ((from_start_visits - after_end_visits) if start_back < twin and end_passed else (from_start_visits
      if start_back < twin and not end_passed else all_visits))
  - course_copays: ((from_start_copays - after_end_copays) if start_back < twin and end_passed else (from_start_copays
      if start_back < twin and not end_passed else all_copays))
  - discipline_copay: (K('rehab_visit_copay_usd') if course_approved and (EXISTS('auth', variant_name='Outpatient
      Rehabilitation Therapy Authorization', therapy_discipline='physical_therapy') or EXISTS('auth', variant_name='Outpatient
      Rehabilitation Therapy Authorization', therapy_discipline='occupational_therapy')) else (K('speech_visit_copay_usd')
      if course_approved and EXISTS('auth', variant_name='Outpatient Rehabilitation Therapy Authorization', therapy_discipline='speech_therapy')
      else P('copay_outpatient_hospital_usd')))
  - intake_visits: (K('intake_visits_in_network') if course_approved and EXISTS('auth', variant_name='Outpatient
      Rehabilitation Therapy Authorization', network_status='in_network', request_origin='provider_request') else
      (K('intake_visits_out_of_network') if course_approved and EXISTS('auth', variant_name='Outpatient Rehabilitation
      Therapy Authorization', network_status='out_of_network', request_origin='provider_request') else 0))
  - intake_kept: MN(intake_visits, course_visits)
  - units_requested: (CFIELD('auth', 'units_requested', variant_name='Outpatient Rehabilitation Therapy Authorization')
      if course_approved else 0)
  - units_approved: (CFIELD('auth', 'units_approved', variant_name='Outpatient Rehabilitation Therapy Authorization')
      if course_approved else 0)
  - extension_visits: MX(0, course_visits - units_requested)
  - therapy_trips: XCOUNT('ride', 'ride_trips', within_months=twin, date_field='appointment_date', event_type='ride_trip_completed',
      destination_npi=ther_npi)
  - transport_credit: (K('transported_course_credit_usd') if (EXISTS('ride', variant_name='RideLink Wheelchair Van')
      or EXISTS('ride', variant_name='RideLink Stretcher Van')) and therapy_trips >= K('transported_course_min_trips')
      else (K('occasional_transport_credit_usd') if (EXISTS('ride', variant_name='RideLink Wheelchair Van') or EXISTS('ride',
      variant_name='RideLink Stretcher Van')) and therapy_trips < K('transported_course_min_trips') else 0))
  - episode_in_window: XCOUNT('care', 'care_enrollments', within_months=twin, date_field='enrollment_date') >= 1
  - signed_plans: XCOUNT('care', 'care_activities', within_months=twin, date_field='activity_date', event_type='care_plan_update',
      member_signed=True)
  - care_plan_credit: (K('signed_care_plan_credit_usd') if episode_in_window and signed_plans >= 1 else (K('unsigned_care_plan_credit_usd')
      if episode_in_window and signed_plans == 0 else 0))
  - regular_copay: MX(0, discipline_copay - transport_credit - care_plan_credit)
  - extension_copay: (K('coordinated_extension_copay_usd') if units_approved > units_requested and episode_in_window
      else (K('uncoordinated_extension_copay_usd') if units_approved > units_requested and not episode_in_window
      else regular_copay))
  - rerated_total: intake_kept * P('copay_outpatient_hospital_usd') + extension_visits * extension_copay + (course_visits
      - intake_kept - extension_visits) * regular_copay
  - result: RND(course_copays - rerated_total + K('half_up_guard'), 2)
  compute_basis:
    twin: The therapy window is the therapy window months counted back from the review date, a date counting when
      it lies fewer than that many whole months before the review date.
    ther_npi: whose billing provider is the servicing provider of the member's rehabilitation therapy authorization
      approved on a request received in the therapy window, whether it is still approved or has since expired
    all_visits: The course batch is every paid outpatient hospital claim whose service date falls in the therapy
      window and whose billing provider is the servicing provider of the member's rehabilitation therapy authorization
      approved on a request received in the therapy window, whether it is still approved or has since expired.
    all_copays: The course batch is every paid outpatient hospital claim whose service date falls in the therapy
      window and whose billing provider is the servicing provider of the member's rehabilitation therapy authorization
      approved on a request received in the therapy window, whether it is still approved or has since expired.
    start_back: the course holds the visits dated within one more than the whole months elapsed since the course
      start date, less those dated within the whole months elapsed since the end date
    end_back: the course holds the visits dated within one more than the whole months elapsed since the course start
      date, less those dated within the whole months elapsed since the end date
    end_passed: where the course start date falls inside the therapy window and the authorization end date has already
      passed
    from_start_visits: the course holds the visits dated within one more than the whole months elapsed since the
      course start date
    from_start_copays: the course holds the visits dated within one more than the whole months elapsed since the
      course start date
    after_end_visits: the course holds the visits dated within one more than the whole months elapsed since the
      course start date, less those dated within the whole months elapsed since the end date
    after_end_copays: the course holds the visits dated within one more than the whole months elapsed since the
      course start date, less those dated within the whole months elapsed since the end date
    course_visits: 'Which visits belong to the course follows the authorization''s dates: where the course start
      date falls inside the therapy window and the authorization end date has already passed, the course holds the
      visits dated within one more than the whole months elapsed since the course start date, less those dated within
      the whole months elapsed since the end date; where the course start date falls inside the window and the end
      date has not passed, the course holds the visits dated within one more than the whole months elapsed since
      the course start date; otherwise the course holds every visit of the servicing provider in the window.'
    course_copays: 'Which visits belong to the course follows the authorization''s dates: where the course start
      date falls inside the therapy window and the authorization end date has already passed, the course holds the
      visits dated within one more than the whole months elapsed since the course start date, less those dated within
      the whole months elapsed since the end date; where the course start date falls inside the window and the end
      date has not passed, the course holds the visits dated within one more than the whole months elapsed since
      the course start date; otherwise the course holds every visit of the servicing provider in the window.'
    discipline_copay: 'The re-rated copay of a course visit follows the therapy discipline of the authorization:
      physical therapy and occupational therapy re-rate at the rehabilitation visit copay, speech therapy re-rates
      at the speech visit copay, and any other discipline keeps the category''s outpatient hospital copay.'
    intake_visits: 'The course keeps intake visits at the copay booked on them: a course a provider requested from
      an in-network servicing provider keeps the in-network intake visit count, a course a provider requested from
      an out-of-network servicing provider keeps the out-of-network intake visit count, and any other course, such
      as one carried over from a previous plan or approved on a retroactive request, keeps no intake visit; no more
      intake visits are kept than the course holds.'
    units_requested: 'Course visits beyond the units the authorization originally requested are extension visits:'
    units_approved: where the authorization approved more units than were requested
    extension_visits: 'Course visits beyond the units the authorization originally requested are extension visits:'
    therapy_trips: at least the transported course minimum of completed trips reached the therapy provider in the
      window
    transport_credit: 'The transport credit follows how the child reaches therapy: where the member''s transportation
      level of service is RideLink Wheelchair Van or RideLink Stretcher Van and at least the transported course
      minimum of completed trips reached the therapy provider in the window, the credit is the transported course
      credit; where that level of service holds with fewer such trips, the credit is the occasional transport credit;
      otherwise there is no transport credit.'
    signed_plans: signed a care plan version in the window
    care_plan_credit: 'The care plan credit follows care management: where the member enrolled in a care management
      episode during the therapy window and signed a care plan version in the window, the credit is the signed care
      plan credit; where the member enrolled in such an episode without signing a care plan version in the window,
      the credit is the unsigned care plan credit; otherwise there is no care plan credit.'
    regular_copay: The re-rated copay of the course visits that are neither intake nor extension visits is lowered
      by the transport credit and the care plan credit, never below zero.
    extension_copay: 'Course visits beyond the units the authorization originally requested are extension visits:
      where the authorization approved more units than were requested and the member enrolled in a care management
      episode during the therapy window, extension visits re-rate at the coordinated extension copay; where more
      units were approved than requested and no such enrollment exists, extension visits re-rate at the uncoordinated
      extension copay; otherwise extension visits re-rate like every other course visit.'
    rerated_total: The course reversal is the copays booked on the course batch less the re-rated copays, rounded
      half up to the cent, and each course visit is re-rated at the category's outpatient hospital copay.
    result: The course reversal is the copays booked on the course batch less the re-rated copays, rounded half
      up to the cent, and each course visit is re-rated at the category's outpatient hospital copay.
    course_approved: approved on a request received in the therapy window, whether it is still approved or has since
      expired
    intake_kept: no more intake visits are kept than the course holds
    episode_in_window: the member enrolled in a care management episode during the therapy window
  factors:
  - id: course_scope_by_authorization_dates
    effect: method
    decides: course_copays
    bindings:
    - start_back
    - end_back
    - end_passed
    - from_start_visits
    - from_start_copays
    - after_end_visits
    - after_end_copays
    - course_visits
    - course_copays
    ladder:
    - when: course start date inside the therapy window AND authorization end date already passed
      method: course = visits dated within one more than the whole months elapsed since the course start date, less
        those dated within the whole months elapsed since the end date
    - when: course start date inside the window AND end date not yet passed
      method: course = visits dated within one more than the whole months elapsed since the course start date
    - when: otherwise
      method: course = every visit of the servicing provider in the window
    baseline:
      course_visits: all_visits
      course_copays: all_copays
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: auth
  - id: course_visit_copay_by_discipline
    effect: parameter
    decides: discipline_copay
    bindings:
    - discipline_copay
    ladder:
    - when: approved authorization for physical therapy or occupational therapy
      value: K('rehab_visit_copay_usd')
    - when: approved authorization for speech therapy
      value: K('speech_visit_copay_usd')
    - when: otherwise
      value: P('copay_outpatient_hospital_usd')
    baseline:
      discipline_copay: P('copay_outpatient_hospital_usd')
    evidence:
    - cross_category
    cross_difficulty: auth
  - id: course_intake_visits
    effect: parameter
    decides: intake_visits
    bindings:
    - intake_visits
    ladder:
    - when: course requested by a provider from an in-network servicing provider
      value: K('intake_visits_in_network')
    - when: course requested by a provider from an out-of-network servicing provider
      value: K('intake_visits_out_of_network')
    - when: otherwise (course carried over by transition of care, or approved on a retroactive request)
      value: '0'
    baseline:
      intake_visits: '0'
    evidence:
    - cross_category
    cross_difficulty: auth
  - id: extension_visit_copay
    effect: parameter
    decides: extension_copay
    bindings:
    - units_requested
    - units_approved
    - extension_visits
    - extension_copay
    ladder:
    - when: more units approved than requested AND a care management episode enrolled during the therapy window
      value: K('coordinated_extension_copay_usd')
    - when: more units approved than requested AND no such enrollment
      value: K('uncoordinated_extension_copay_usd')
    - when: otherwise
      value: regular_copay (extension visits re-rate like any course visit)
    baseline:
      extension_copay: regular_copay
    evidence:
    - cross_category
    cross_difficulty: auth
  - id: therapy_transport_credit
    effect: parameter
    decides: transport_credit
    bindings:
    - therapy_trips
    - transport_credit
    ladder:
    - when: level of service RideLink Wheelchair Van or Stretcher Van AND at least the transported course minimum
        of completed trips to the therapy provider
      value: K('transported_course_credit_usd')
    - when: that level of service AND fewer such trips
      value: K('occasional_transport_credit_usd')
    - when: otherwise
      value: '0'
    baseline:
      transport_credit: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: ride
  - id: therapy_care_plan_credit
    effect: parameter
    decides: care_plan_credit
    bindings:
    - episode_in_window
    - signed_plans
    - care_plan_credit
    ladder:
    - when: a care management episode enrolled during the therapy window AND a care plan version signed by the member
        in the window
      value: K('signed_care_plan_credit_usd')
    - when: such an episode enrolled AND no signed care plan version in the window
      value: K('unsigned_care_plan_credit_usd')
    - when: otherwise
      value: '0'
    baseline:
      care_plan_credit: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: null
  baseline:
    rule: The therapy window is the therapy window months counted back from the review date, a date counting when
      it lies fewer than that many whole months before the review date. The course batch is every paid outpatient
