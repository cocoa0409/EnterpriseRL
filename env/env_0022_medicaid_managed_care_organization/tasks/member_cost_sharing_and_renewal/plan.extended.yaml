  formula:
    period_cap: >-
      round(household_income_monthly * cost_share_cap_period_months * cost_share_cap_pct_income / 100,
      2)
    remaining_cap: max(0, period_cap - plan_msr_period_cost_share)
    over_cap_refund: max(0, plan_msr_period_cost_share - period_cap)
  measures:
  - plan_msr_period_cost_share
- id: plan_evt_claim_adjustment
  subject:
  - plan_claim_adjusted
  rule: >-
    An adjustment reverses the whole member cost share of one original claim identified by its claim number
    and is booked with a new adjustment claim number whose related_claim_number is the original claim
    number. Only an original claim whose adjudication_status is paid can be adjusted. The adjustment is
    booked no later than claim_adjustment_window_days after the original claim's booked date. The window
    is counted in calendar days from the day after the booked date, and the last day of the window still
    qualifies. An original claim is adjusted at most once, so no adjustment is booked when a plan_claim_adjusted
    row already references its claim number. Valid adjustment reasons are recorded in denial_code: not_eligible_on_service_date
    when coverage is found not to have been in force on the service date, duplicate_claim when the same
    service was booked twice, and not_covered when the service is reclassified as non-covered; a reason
    outside these is not an adjustment and cannot be booked. An adjusted claim's cost share leaves the
    period accumulator of the original service date, never the current one.
  eligibility:
  - id: original_is_paid
    applies_to:
    - plan_claim_adjusted
    kind: state
    condition: Only an original claim whose adjudication_status is paid can be adjusted.
    evidence_fields:
    - plan_claims.claim_number
    - plan_claims.adjudication_status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - plan_claims.claim_number
      action_bindings:
        plan_claims.claim_number: related_claim_number
    state_contract:
      field: plan_claims.adjudication_status
      allowed:
      - paid
  - id: adjust_window
    applies_to:
    - plan_claim_adjusted
    kind: time
    condition: >-
      The adjustment is booked no later than claim_adjustment_window_days after the original claim's booked
      date.
    evidence_fields:
    - plan_claims.claim_number
    - plan_claims.booked_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - plan_claims.claim_number
      action_bindings:
        plan_claims.claim_number: related_claim_number
    temporal_basis:
      clock: frozen_time
      anchor_event: the original claim's booked date
      anchor_source: plan_claims.booked_date
      relation: not_after
      duration_source: variants.claim_adjustment_window_days
      unit: calendar_days
      counting_rule: >-
        The window is counted in calendar days from the day after the booked date, and the last day of
        the window still qualifies.
      boundary: inclusive
  - id: adjust_once
    applies_to:
    - plan_claim_adjusted
    kind: dedup
    condition: >-
      An original claim is adjusted at most once, so no adjustment is booked when a plan_claim_adjusted
      row already references its claim number.
    evidence_fields:
    - plan_claims.related_claim_number
    - plan_claims.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - plan_claims.related_claim_number
      action_bindings:
        plan_claims.related_claim_number: related_claim_number
    dedup_contract:
      table: plan_claims
      mode: separate_record
      object_bindings:
        related_claim_number: related_claim_number
      duplicate_filters:
        event_type:
        - plan_claim_adjusted
      distinct_fields:
      - booked_date
- id: plan_evt_premium
  subject:
  - plan_premium_billed
  - plan_premium_paid
  - plan_terminate
  rule: >-
    A premium is billed only in a category whose premium_ladder is not empty, once per coverage month,
    at the ladder row whose income band contains plan_memberships.income_pct_fpl on the billing date;
    the premium is per family, so it is billed on one membership of the family (the membership of the
    oldest child) and never on siblings. The premium for a coverage month is due on premium_due_day_of_month
    of the preceding month. A payment is applied first to the oldest billed coverage month that is not
    yet paid or waived, and a payment that exceeds all billed months is applied to future months up to
    premium_prepay_max_months, with any remainder returned to the payer. A membership can be terminated
    for premium_nonpayment only after premium_grace_days have fully passed since the due date of the oldest
    unpaid coverage month. The grace days are counted in calendar days from the day after the due date,
    and termination is allowed only on a day strictly after the last grace day. A membership whose continuous
    eligibility period is running is never terminated for premium non-payment; the unpaid premium stays
    on premium_balance instead. After a premium_nonpayment termination the family may re-enroll in the
    category within premium_lockout_days only by paying the past-due balance in full.
  eligibility:
  - id: nonpayment_grace
    applies_to:
    - plan_terminate
    kind: time
    condition: >-
      A membership can be terminated for premium_nonpayment only after premium_grace_days have fully passed
      since the due date of the oldest unpaid coverage month.
    evidence_fields:
    - plan_premiums.coverage_month
    - plan_premiums.event_type
    - plan_memberships.membership_id
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - plan_memberships.membership_id
      action_bindings:
        plan_memberships.membership_id: membership_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the due date of the oldest unpaid coverage month
      anchor_source: plan_premiums.coverage_month
      relation: not_before
      duration_source: variants.premium_grace_days
      unit: calendar_days
      counting_rule: >-
        The grace days are counted in calendar days from the day after the due date, and termination is
        allowed only on a day strictly after the last grace day.
      boundary: exclusive
  params:
    per_tier:
      Prairie Ridge Expansion Adult:
        ladder: =premium_ladder
        due_day: =premium_due_day_of_month
        grace_days: =premium_grace_days
        lockout_days: =premium_lockout_days
        prepay_max: =premium_prepay_max_months
      Prairie Ridge Family Care:
        ladder: =premium_ladder
        due_day: =premium_due_day_of_month
        grace_days: =premium_grace_days
        lockout_days: =premium_lockout_days
        prepay_max: =premium_prepay_max_months
      Prairie Ridge CHIP Kids:
        ladder: =premium_ladder
        due_day: =premium_due_day_of_month
        grace_days: =premium_grace_days
        lockout_days: =premium_lockout_days
        prepay_max: =premium_prepay_max_months
      Prairie Ridge Children's Medicaid:
        ladder: =premium_ladder
        due_day: =premium_due_day_of_month
        grace_days: =premium_grace_days
        lockout_days: =premium_lockout_days
        prepay_max: =premium_prepay_max_months
      Prairie Ridge Pregnancy Care:
        ladder: =premium_ladder
        due_day: =premium_due_day_of_month
        grace_days: =premium_grace_days
        lockout_days: =premium_lockout_days
        prepay_max: =premium_prepay_max_months
      Prairie Ridge ABD Care:
        ladder: =premium_ladder
        due_day: =premium_due_day_of_month
        grace_days: =premium_grace_days
        lockout_days: =premium_lockout_days
        prepay_max: =premium_prepay_max_months
      Prairie Ridge Dual Complete:
        ladder: =premium_ladder
        due_day: =premium_due_day_of_month
        grace_days: =premium_grace_days
        lockout_days: =premium_lockout_days
        prepay_max: =premium_prepay_max_months
- id: plan_evt_premium_waiver
  subject:
  - plan_premium_waived
  - plan_premium_billed
  rule: >-
    Members whose membership records ai_an_status as true are never billed a premium; a month billed in
    error is waived in full with waiver_reason american_indian_alaska_native. A family facing a financial
    hardship may have billed months waived with waiver_reason financial_hardship. A hardship waiver requires
    the parent or guardian to state a qualifying hardship during the call: loss of employment, a drop
    in household income of at least hardship_income_drop_pct percent, or unreimbursed medical expenses
    in the household. Hardship waivers are limited to premium_hardship_waiver_max_months within plan_msr_hardship_waivers_12m;
    a month beyond the limit is not waived and stays due. Waiver and payment are mutually exclusive for
    one coverage month: a month already paid in full is not waived, and a waived month does not accept
    a payment. A waiver always covers the whole billed amount of the month, never part of it.
  eligibility:
  - id: hardship_statement
    applies_to:
    - plan_premium_waived
    kind: caller_fact
    condition: >-
      A hardship waiver requires the parent or guardian to state a qualifying hardship during the call:
      loss of employment, a drop in household income of at least hardship_income_drop_pct percent, or
      unreimbursed medical expenses in the household.
    evidence_fields:
    - plan_memberships.membership_id
    - plan_premiums.coverage_month
    evidence_contract:
      authority: caller_statement
      timing: pre_action
      correlation_keys:
      - - plan_memberships.membership_id
        - plan_premiums.coverage_month
      action_bindings:
        plan_memberships.membership_id: membership_id
        plan_premiums.coverage_month: coverage_month
  params:
    hardship_income_drop_pct: 20
    per_tier:
      Prairie Ridge Expansion Adult:
        max_waived_months: =premium_hardship_waiver_max_months
      Prairie Ridge Family Care:
        max_waived_months: =premium_hardship_waiver_max_months
      Prairie Ridge CHIP Kids:
        max_waived_months: =premium_hardship_waiver_max_months
      Prairie Ridge Children's Medicaid:
        max_waived_months: =premium_hardship_waiver_max_months
      Prairie Ridge Pregnancy Care:
        max_waived_months: =premium_hardship_waiver_max_months
      Prairie Ridge ABD Care:
        max_waived_months: =premium_hardship_waiver_max_months
      Prairie Ridge Dual Complete:
        max_waived_months: =premium_hardship_waiver_max_months
  measures:
  - plan_msr_hardship_waivers_12m
- id: plan_renewal_cycle
  subject:
  - plan_renewal_open
  - plan_renewal_notice
  - plan_renewal_approve
  rule: >-
    Each membership renews once per redetermination period; the renewal packet is issued renewal_packet_lead_days
    before renewal_due_date and the membership enters renewal_due on that day. The first reminder is sent
    renewal_reminder_first_lead_days and the second reminder renewal_reminder_second_lead_days before
    renewal_due_date, and each reminder is skipped if the state has already approved the renewal. Every
    renewal notice is mailed, and is additionally sent by the member's notice_channel when that channel
    is text or email. Renewal reminders are sent only while the membership is in renewal_due status, and
    a procedural closure notice only while it is in reconsideration status. A renewal approval sets the
    new renewal_due_date to the prior renewal_due_date plus redetermination_period_months, and never to
    a date counted from the approval day; where the category allows ex parte renewal the state may approve
    without a returned packet.
  eligibility:
  - id: reminder_in_renewal
    applies_to:
    - plan_renewal_notice
    kind: state
    condition: >-
      Renewal reminders are sent only while the membership is in renewal_due status, and a procedural
      closure notice only while it is in reconsideration status.
    evidence_fields:
    - plan_memberships.membership_id
    - plan_memberships.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - plan_memberships.membership_id
      action_bindings:
        plan_memberships.membership_id: membership_id
    state_contract:
      field: plan_memberships.status
      allowed:
      - renewal_due
      - reconsideration
  params:
    per_tier:
      Prairie Ridge Expansion Adult:
        packet_lead_days: =renewal_packet_lead_days
        reminder_first: =renewal_reminder_first_lead_days
        reminder_second: =renewal_reminder_second_lead_days
        ex_parte: =ex_parte_renewal_eligible
      Prairie Ridge Family Care:
        packet_lead_days: =renewal_packet_lead_days
        reminder_first: =renewal_reminder_first_lead_days
        reminder_second: =renewal_reminder_second_lead_days
        ex_parte: =ex_parte_renewal_eligible
      Prairie Ridge CHIP Kids:
        packet_lead_days: =renewal_packet_lead_days
        reminder_first: =renewal_reminder_first_lead_days
        reminder_second: =renewal_reminder_second_lead_days
        ex_parte: =ex_parte_renewal_eligible
      Prairie Ridge Children's Medicaid:
        packet_lead_days: =renewal_packet_lead_days
        reminder_first: =renewal_reminder_first_lead_days
        reminder_second: =renewal_reminder_second_lead_days
        ex_parte: =ex_parte_renewal_eligible
      Prairie Ridge Pregnancy Care:
        packet_lead_days: =renewal_packet_lead_days
        reminder_first: =renewal_reminder_first_lead_days
        reminder_second: =renewal_reminder_second_lead_days
        ex_parte: =ex_parte_renewal_eligible
      Prairie Ridge ABD Care:
        packet_lead_days: =renewal_packet_lead_days
        reminder_first: =renewal_reminder_first_lead_days
        reminder_second: =renewal_reminder_second_lead_days
        ex_parte: =ex_parte_renewal_eligible
      Prairie Ridge Dual Complete:
        packet_lead_days: =renewal_packet_lead_days
        reminder_first: =renewal_reminder_first_lead_days
        reminder_second: =renewal_reminder_second_lead_days
        ex_parte: =ex_parte_renewal_eligible
- id: plan_reconsideration
  subject:
  - plan_procedural_close
  - plan_reinstate
  rule: >-
    A membership whose renewal is not returned by renewal_due_date ends for procedural reasons on that
    date and enters the reconsideration period. Coverage is reinstated only when the completed renewal
    is received no later than reconsideration_period_days after the coverage end date recorded at procedural
    closure. The reconsideration days are counted in calendar days from the day after the coverage end
    date, and a renewal received on the last day still qualifies. Reinstatement is retroactive to the
    coverage end date so that no gap in coverage remains, and claims denied as not_eligible_on_service_date
    inside the gap are reprocessed. A renewal received after the reconsideration period cannot reinstate
    coverage and requires a new application with the state.
  eligibility:
  - id: reconsideration_window
    applies_to:
    - plan_reinstate
    kind: time
    condition: >-
      Coverage is reinstated only when the completed renewal is received no later than reconsideration_period_days
      after the coverage end date recorded at procedural closure.
    evidence_fields:
    - plan_memberships.membership_id
    - plan_memberships.termination_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - plan_memberships.membership_id
      action_bindings:
        plan_memberships.membership_id: membership_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the coverage end date recorded at procedural closure
      anchor_source: plan_memberships.termination_date
      relation: not_after
      duration_source: variants.reconsideration_period_days
      unit: calendar_days
      counting_rule: >-
        The reconsideration days are counted in calendar days from the day after the coverage end date,
        and a renewal received on the last day still qualifies.
      boundary: inclusive
  params:
    per_tier:
      Prairie Ridge Expansion Adult:
        reconsideration_days: =reconsideration_period_days
      Prairie Ridge Family Care:
        reconsideration_days: =reconsideration_period_days
      Prairie Ridge CHIP Kids:
        reconsideration_days: =reconsideration_period_days
      Prairie Ridge Children's Medicaid:
        reconsideration_days: =reconsideration_period_days
      Prairie Ridge Pregnancy Care:
        reconsideration_days: =reconsideration_period_days
      Prairie Ridge ABD Care:
        reconsideration_days: =reconsideration_period_days
      Prairie Ridge Dual Complete:
        reconsideration_days: =reconsideration_period_days
- id: plan_continuous_eligibility
  subject:
  - plan_terminate
  rule: >-
    In a category with continuous eligibility, coverage cannot end for ineligible_income, procedural_no_response
    or premium_nonpayment before continuous_eligibility_months have passed from the coverage start date
    or the latest renewal approval, whichever is later. In Prairie Ridge Pregnancy Care coverage continues
    through postpartum_coverage_months after the month the pregnancy ends regardless of income changes.
    Termination for moved_out_of_state, deceased, voluntary_disenrollment or plan_change is allowed at
    any time in every category.
  eligibility: []
  params:
    per_tier:
      Prairie Ridge Expansion Adult:
        ce_months: =continuous_eligibility_months
        postpartum_months: =postpartum_coverage_months
      Prairie Ridge Family Care:
        ce_months: =continuous_eligibility_months
        postpartum_months: =postpartum_coverage_months
      Prairie Ridge CHIP Kids:
        ce_months: =continuous_eligibility_months
        postpartum_months: =postpartum_coverage_months
      Prairie Ridge Children's Medicaid:
        ce_months: =continuous_eligibility_months
        postpartum_months: =postpartum_coverage_months
      Prairie Ridge Pregnancy Care:
        ce_months: =continuous_eligibility_months
        postpartum_months: =postpartum_coverage_months
      Prairie Ridge ABD Care:
        ce_months: =continuous_eligibility_months
        postpartum_months: =postpartum_coverage_months
      Prairie Ridge Dual Complete:
        ce_months: =continuous_eligibility_months
        postpartum_months: =postpartum_coverage_months
- id: plan_mco_change
  subject:
  - plan_terminate
  rule: >-
    A member may change to another health plan without cause during the first mco_change_window_days after
    enrollment_date and during the annual open enrollment window; with a documented cause (provider_not_in_network,
    continuity_of_care, poor_quality_of_care, lack_of_access_to_services, moved_out_of_service_area) the
    change may be requested at any time. Prairie Ridge never ends the membership itself on a change request;
    the request is recorded as a plan change request and forwarded to the state enrollment broker, and
    the membership ends with termination_reason plan_change only when the broker makes the change effective.
    A plan change without cause is forwarded only when the request is made no later than mco_change_window_days
    after the membership's enrollment date, unless the request falls inside the open enrollment window.
    The change window is counted in calendar days from the day after the enrollment date, and a request
    on the last day still qualifies. A request without cause outside both windows is recorded but not
    forwarded.
  eligibility:
  - id: without_cause_window
    applies_to:
    - plan_terminate
    kind: time
    condition: >-
      A plan change without cause is forwarded only when the request is made no later than mco_change_window_days
      after the membership's enrollment date, unless the request falls inside the open enrollment window.
    evidence_fields:
    - plan_memberships.membership_id
    - plan_memberships.enrollment_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - plan_memberships.membership_id
      action_bindings:
        plan_memberships.membership_id: membership_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the membership's enrollment date
      anchor_source: plan_memberships.enrollment_date
      relation: not_after
      duration_source: variants.mco_change_window_days
      unit: calendar_days
      counting_rule: >-
        The change window is counted in calendar days from the day after the enrollment date, and a request
        on the last day still qualifies.
      boundary: inclusive
  params:
    per_tier:
      Prairie Ridge Expansion Adult:
        window_days: =mco_change_window_days
        open_enrollment_days: =open_enrollment_days
      Prairie Ridge Family Care:
        window_days: =mco_change_window_days
        open_enrollment_days: =open_enrollment_days
      Prairie Ridge CHIP Kids:
        window_days: =mco_change_window_days
        open_enrollment_days: =open_enrollment_days
      Prairie Ridge Children's Medicaid:
        window_days: =mco_change_window_days
        open_enrollment_days: =open_enrollment_days
      Prairie Ridge Pregnancy Care:
        window_days: =mco_change_window_days
        open_enrollment_days: =open_enrollment_days
      Prairie Ridge ABD Care:
        window_days: =mco_change_window_days
        open_enrollment_days: =open_enrollment_days
      Prairie Ridge Dual Complete:
        window_days: =mco_change_window_days
        open_enrollment_days: =open_enrollment_days
- id: plan_evt_id_card
  subject:
  - plan_id_card_issue
  rule: >-
    A physical ID card is mailed on every new enrollment, on a name change, on an eligibility category
    change and when the assigned primary care provider changes, and none of these count toward the replacement
    limit. A card reported lost, stolen or damaged is replaced by mail while plan_msr_id_replacements_365d
    is below id_card_free_replacements_per_12_months; once the limit is reached the replacement is issued
    as a digital card in the member portal only, recorded with delivery_channel member_portal. An ID card
    is issued only for a membership in pending, active, renewal_due or reconsideration status. There is
    never a fee for any card, and a temporary proof-of-coverage letter may be offered while a mailed card
    is in production.
  eligibility:
  - id: card_on_open_membership
    applies_to:
