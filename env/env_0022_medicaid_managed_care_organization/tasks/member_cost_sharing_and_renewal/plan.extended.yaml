- id: plan_suspension
  subject:
  - plan_suspend
  - plan_resume
  - plan_claim_booked
  rule: >-
    While a membership is suspended for incarceration, only inpatient stays outside the correctional facility
    of at least suspension_inpatient_min_hours are paid; every other claim with a service date inside
    the suspension is denied with denial_code not_eligible_on_service_date. Premiums are not billed for
    coverage months that fall entirely inside a suspension. The suspension is lifted on the release date
    reported by the state and ordinary coverage resumes that day.
  eligibility: []
  params:
    per_tier:
      Prairie Ridge Expansion Adult:
        inpatient_min_hours: =suspension_inpatient_min_hours
      Prairie Ridge Family Care:
        inpatient_min_hours: =suspension_inpatient_min_hours
      Prairie Ridge CHIP Kids:
        inpatient_min_hours: =suspension_inpatient_min_hours
      Prairie Ridge Children's Medicaid:
        inpatient_min_hours: =suspension_inpatient_min_hours
      Prairie Ridge Pregnancy Care:
        inpatient_min_hours: =suspension_inpatient_min_hours
      Prairie Ridge ABD Care:
        inpatient_min_hours: =suspension_inpatient_min_hours
      Prairie Ridge Dual Complete:
        inpatient_min_hours: =suspension_inpatient_min_hours
- id: plan_onboarding
  subject:
  - plan_enroll
  - plan_activate
  rule: >-
    A membership opens in pending status on the enrollment date and becomes active on coverage_start_date,
    which the state may set up to retro_coverage_months calendar months before the application month (never
    in a category whose retro_coverage_months is 0). Prairie Ridge places the welcome call within welcome_call_days
    and offers the health risk assessment within health_risk_assessment_days, both counted in calendar
    days from coverage_start_date, or from the activation day when coverage_start_date lies in the past.
    A member who paid a provider out of pocket for a covered service with a service date inside retroactive
    coverage may ask for reimbursement within member_reimbursement_filing_days after the service date;
    such reimbursements are handled by the claims unit and are not booked as member cost share.
  eligibility: []
  params:
    per_tier:
      Prairie Ridge Expansion Adult:
        retro_months: =retro_coverage_months
        welcome_call_days: =welcome_call_days
        hra_days: =health_risk_assessment_days
        reimbursement_days: =member_reimbursement_filing_days
      Prairie Ridge Family Care:
        retro_months: =retro_coverage_months
        welcome_call_days: =welcome_call_days
        hra_days: =health_risk_assessment_days
        reimbursement_days: =member_reimbursement_filing_days
      Prairie Ridge CHIP Kids:
        retro_months: =retro_coverage_months
        welcome_call_days: =welcome_call_days
        hra_days: =health_risk_assessment_days
        reimbursement_days: =member_reimbursement_filing_days
      Prairie Ridge Children's Medicaid:
        retro_months: =retro_coverage_months
        welcome_call_days: =welcome_call_days
        hra_days: =health_risk_assessment_days
        reimbursement_days: =member_reimbursement_filing_days
      Prairie Ridge Pregnancy Care:
        retro_months: =retro_coverage_months
        welcome_call_days: =welcome_call_days
        hra_days: =health_risk_assessment_days
        reimbursement_days: =member_reimbursement_filing_days
      Prairie Ridge ABD Care:
        retro_months: =retro_coverage_months
        welcome_call_days: =welcome_call_days
        hra_days: =health_risk_assessment_days
        reimbursement_days: =member_reimbursement_filing_days
      Prairie Ridge Dual Complete:
        retro_months: =retro_coverage_months
        welcome_call_days: =welcome_call_days
        hra_days: =health_risk_assessment_days
        reimbursement_days: =member_reimbursement_filing_days
- id: plan_change_reporting
  subject:
  - plan_income_update
  - plan_notice_preference_update
  rule: >-
    The state eligibility system is the only source of a member's address, income and household; when
    a member reports a new address, income or household change, Prairie Ridge records it as a plan change
    request of type address_change_report or income_change_report with request_status forwarded_to_state_eligibility
    and does not change the profile or the membership itself. The reported change reaches the membership
    only through a later state file (plan_income_update), and the member is reminded that the report must
    reach the state within change_report_days of the change. A notice channel preference is not a reportable
    change and is updated directly on the membership.
  eligibility: []
  params:
    per_tier:
      Prairie Ridge Expansion Adult:
        report_days: =change_report_days
      Prairie Ridge Family Care:
        report_days: =change_report_days
      Prairie Ridge CHIP Kids:
        report_days: =change_report_days
      Prairie Ridge Children's Medicaid:
        report_days: =change_report_days
      Prairie Ridge Pregnancy Care:
        report_days: =change_report_days
      Prairie Ridge ABD Care:
        report_days: =change_report_days
      Prairie Ridge Dual Complete:
        report_days: =change_report_days
- id: plan_notice_preferences
  subject:
  - plan_notice_preference_update
  - plan_renewal_notice
  rule: >-
    The member may choose text, email or mail as the additional notice channel; mail is always used for
    legally required notices whatever the choice. A preference change applies to notices sent after the
    change and never re-sends a notice already sent. A text preference requires the phone number on the
    member profile and an email preference requires the email address on the member profile; without it
    the preference stays unchanged.
  eligibility: []
- id: plan_evt_income_change
  subject:
  - plan_income_update
  - plan_premium_billed
  rule: >-
    A new income on the state file sets the premium band from the first coverage month billed after the
    update and sets the cost-sharing cap from the first cap period that starts after the update; periods
    and months already started keep the income on file at their start. While a continuous eligibility
    period is running, a new income may move the premium to a lower band but never to a higher one; a
    higher band waits until the next renewal approval. Members must report income changes within change_report_days,
    but a late report never creates a retroactive premium or copay charge.
  eligibility: []
  params:
    per_tier:
      Prairie Ridge Expansion Adult:
        report_days: =change_report_days
      Prairie Ridge Family Care:
        report_days: =change_report_days
      Prairie Ridge CHIP Kids:
        report_days: =change_report_days
      Prairie Ridge Children's Medicaid:
        report_days: =change_report_days
      Prairie Ridge Pregnancy Care:
        report_days: =change_report_days
      Prairie Ridge ABD Care:
        report_days: =change_report_days
      Prairie Ridge Dual Complete:
        report_days: =change_report_days

extended_policies:
- id: plan_ext_over_cap_refund
  base_policy_refs:
  - plan_evt_cost_share_cap
  - plan_evt_copay
  - plan_evt_premium
  overwrite:
  - base_policy: plan_evt_cost_share_cap
    superseded_clause: Cost sharing counted toward the cap is plan_msr_period_cost_share, which includes pharmacy
      copays where the category counts them.
    replaced_by: The counting window is the number of months in the category's cap period counted back from the
      review date, a date counting when it lies fewer than that many whole months before the review date.
  - base_policy: plan_evt_cost_share_cap
    superseded_clause: Total member cost sharing in one cap period may not exceed the category's cap percent of
      household income for that period, where the period income is plan_memberships.household_income_monthly times
      cost_share_cap_period_months as on file on the first day of the period, rounded to the cent.
    replaced_by: The member's cap is the monthly household income on file times the category's cap-period months
      times the category's cap percent, divided by one hundred and rounded half up to the cent.
  - base_policy: plan_evt_cost_share_cap
    superseded_clause: Where a claim's copay was booked while other copays not yet counted (for example pharmacy
      copays posted later) already reached the cap, the part of that claim's copay above the cap is refunded as
      one plan_cost_share_refund row referencing that claim's claim_number, and claims are examined in booked_date
      order so that only the claims that crossed the cap are refunded.
    replaced_by: The refund is booked as one refund entry against the most recently booked medical claim that carries
      a copay in the counting window, carrying that claim's cost-sharing period.
  - base_policy: plan_evt_cost_share_cap
    superseded_clause: The refund is due within cost_share_refund_days of the booked_date of the claim that crossed
      the cap, and the cap never carries over from one period to the next.
    replaced_by: The refund is due within the category's refund days of the booked date of the claim it is booked
      against, and cost sharing dated outside the counting window never counts toward the cap.
  trigger: state_due
  subject:
  - plan_cost_share_refund
  computes: refund_amount
  target_tool: book_over_cap_refund_b068d625
  params:
    low_income_band_top_pct: 185
    cap_pct_low_income_ongoing_care: 2.5
    cap_pct_low_income: 4.0
    admission_relief_min_stays: 3
    admission_relief_managed_usd: 150.0
    admission_relief_unmanaged_usd: 75.0
    medication_relief_min_refills: 5
    medication_relief_steady_usd: 60.0
    medication_relief_interrupted_usd: 30.0
    travel_relief_min_trips: 6
    travel_relief_family_driven_usd: 50.0
    travel_relief_arranged_usd: 25.0
    half_up_guard: 1.0e-06
  rule: 'The over-cap refund returns to the member the cost sharing counted in the counting window above the member''s
    cap. The counting window is the number of months in the category''s cap period counted back from the review
    date, a date counting when it lies fewer than that many whole months before the review date. The counted total
    is the member copays on medical claims whose service date falls in the counting window, net of any adjustment
    entries against those claims, plus the over-cap refunds already booked in the counting window and the pharmacy
    copays on fills and fill reversals dated in the counting window. The member''s cap is the monthly household
    income on file times the category''s cap-period months times the category''s cap percent, divided by one hundred
    and rounded half up to the cent. The over-cap refund is the counted total less the cap, never below zero, rounded
    half up to the cent. A membership in a category that bills a premium adds its counted premium to the counted
    total: with a premium balance of zero the counted premium is the premiums paid in the counting window, and while
    a premium balance above zero stands the counted premium is the premiums paid in the counting window less that
    outstanding balance; in a category that bills no premium no premium is counted. The cap percent follows household
    income and ongoing authorized care: a household at or below the low-income band top percent of the federal poverty
    level whose member holds at least one authorization approved on a request received in the counting window takes
    the low-income ongoing-care cap percent, a household at or below that band top whose member holds no such approved
    authorization takes the low-income cap percent, and any other household keeps the category''s cap percent. The
    cap months follow how much of the counting window the membership covered: where the coverage start date falls
    fewer than the cap-period months before the review month, the cap months are one more than the whole months
    elapsed from the coverage start date to the review date; where the membership has ended and its termination
    date falls inside the counting window, the cap months are the cap-period months less the whole months from the
    termination date to the review date; otherwise the cap months are the category''s cap-period months. The cap
    is lowered by the admission relief credit: where the counting window holds at least the admission relief minimum
    of paid inpatient stay claims and the member holds an active care coordination or case management episode, the
    credit is the managed admission relief amount; where the window holds that many paid inpatient stays and the
    member holds no such episode, the credit is the unmanaged admission relief amount; otherwise there is no admission
    relief. The cap is also lowered by the medication relief credit: where the pharmacy benefit shows at least the
    medication relief minimum of paid refills dated in the counting window and no rejected fill in that window,
    the credit is the steady medication relief amount; where it shows that many paid refills and at least one rejected
    fill in the window, the credit is the interrupted medication relief amount; otherwise there is no medication
    relief. The cap is also lowered by the travel relief credit: where the transportation benefit shows at least
    the travel relief minimum of completed trips with appointment dates in the counting window and the member''s
    transportation level of service is RideLink Mileage Reimbursement, so that the family drove the child itself,
    the credit is the family-driven travel relief amount; where it shows that many completed trips under any other
    level of service, the credit is the arranged-ride travel relief amount; otherwise there is no travel relief.
    The refund is booked as one refund entry against the most recently booked medical claim that carries a copay
    in the counting window, carrying that claim''s cost-sharing period. The refund is due within the category''s
    refund days of the booked date of the claim it is booked against, and cost sharing dated outside the counting
    window never counts toward the cap. On a membership that is still open, the over-cap refund is fixed only after
    the premium balance on the membership stands at zero. The over-cap refund is fixed only after the visits the
    member''s own primary care provider billed under the specialist visit copay in the counting window carry their
    re-rating adjustment entry. The over-cap refund is not worked out until the office visits the member''s primary
    care providers billed under the primary care visit copay in the counting window carry their preventive re-rating
    adjustment entry.'
  prerequisite:
  - problem: plan_ext_past_due_premium_payment
    kind: value_input
    gate: premium_counted
    form: state
    policy_source: On a membership that is still open, the over-cap refund is fixed only after the premium balance
      on the membership stands at zero.
    condition: 'The open membership''s premium balance is 0.00: every billed coverage month on it carries a payment
      or a waiver that settled it.'
    resolved_by: pay_past_due_premium_fdc43b6b
    effect: The family's payment settles the past-due month, so the premium balance falls to zero and the counted
      premium moves from the premiums paid less the outstanding balance to the premiums paid, which now include
      that payment.
  - problem: plan_ext_own_pcp_visit_rerating
    kind: value_input
    gate: medical_net
    form: state
    policy_source: The over-cap refund is fixed only after the visits the member's own primary care provider billed
      under the specialist visit copay in the counting window carry their re-rating adjustment entry.
    condition: The claim ledger holds an adjustment entry, booked against the most recently serviced of those specialist-rated
      primary care visits, that returns the specialist-rate copay excess.
    resolved_by: book_own_pcp_visit_rerating_ea94b99c
    effect: The re-rating adjustment carries a negative member cost share dated to the original service date, so
      the net medical copays in the counting window fall by the re-rating reversal.
  - problem: plan_ext_office_visit_preventive_rerating
    kind: value_input
    gate: medical_net
    form: state
    policy_source: The over-cap refund is not worked out until the office visits the member's primary care providers
      billed under the primary care visit copay in the counting window carry their preventive re-rating adjustment
      entry.
    condition: The claim ledger holds an adjustment entry, booked against the most recently serviced office visit
      of the member's primary care providers, that returns the copays of the office visits the visit log shows as
      preventive.
    resolved_by: book_office_visit_rerating_0e97c2c0
    effect: The preventive re-rating adjustment carries a negative member cost share dated to the original service
      date, so the net medical copays in the counting window fall by the office-visit reversal.
  cross_category:
  - category: auth
    as: branch
    reads:
    - auth_authorizations.status
    - auth_authorizations.received_date
    note: The cap-percent factor counts authorizations approved on requests received in the counting window.
  - category: care
    as: existence
    reads:
    - status
    - variant_name
    note: The admission relief factor reads whether an active care coordination or case management episode is held.
  - category: rx
    as: history
    reads:
    - rx_fills.member_copay
    - rx_fills.event_type
    - rx_fills.fill_type
    - rx_fills.fill_date
    note: Pharmacy copays enter the counted total; the medication relief factor counts paid refills and rejected
      fills.
  - category: ride
    as: history
    reads:
    - status
    - variant_name
    - ride_trips.event_type
    - ride_trips.appointment_date
    note: The travel relief factor counts completed trips and reads the level of service.
  compute:
  - win: P('cost_share_cap_period_months')
  - medical_net: SUM('plan_claims', 'member_cost_share', within_months=win, date_field='service_date')
  - refunds_booked: SUM('plan_claims', 'member_cost_share', within_months=win, date_field='booked_date', event_type='plan_cost_share_refund')
  - pharmacy_net: XSUM('rx', 'rx_fills', 'member_copay', within_months=win, date_field='fill_date')
  - premiums_paid: SUM('plan_premiums', 'amount', within_months=win, date_field='posted_date', event_type='plan_premium_paid')
  - premium_counted: (premiums_paid if P('premium_due_day_of_month') > 0 and F('premium_balance') == 0 else ((premiums_paid
      - F('premium_balance')) if P('premium_due_day_of_month') > 0 and F('premium_balance') > 0 else 0))
  - counted_total: medical_net + refunds_booked + pharmacy_net + premium_counted
  - approved_auths: XCOUNT('auth', 'auth_authorizations', within_months=win, date_field='received_date', status='approved')
  - cap_pct: (K('cap_pct_low_income_ongoing_care') if F('income_pct_fpl') <= K('low_income_band_top_pct') and approved_auths
      >= 1 else (K('cap_pct_low_income') if F('income_pct_fpl') <= K('low_income_band_top_pct') and approved_auths
      == 0 else P('cost_share_cap_pct_income')))
  - months_since_start: MONTHS(F('coverage_start_date'), NOW) + 1
  - cap_months: (months_since_start if months_since_start < win else ((win - MONTHS(F('termination_date'), NOW))
      if F('status') == 'terminated' and MONTHS(F('termination_date'), NOW) < win else win))
  - inpatient_stays: COUNT('plan_claims', within_months=win, date_field='service_date', event_type='plan_claim_booked',
      service_category='inpatient_stay', adjudication_status='paid')
  - managed_episode: EXISTS('care', status='active', variant_name='Care Coordination Level 1') or EXISTS('care',
      status='active', variant_name='Care Coordination Level 2') or EXISTS('care', status='active', variant_name='Complex
      Case Management')
  - admission_credit: (K('admission_relief_managed_usd') if inpatient_stays >= K('admission_relief_min_stays') and
      managed_episode else (K('admission_relief_unmanaged_usd') if inpatient_stays >= K('admission_relief_min_stays')
      and not managed_episode else 0))
  - maintenance_fills: XCOUNT('rx', 'rx_fills', within_months=win, date_field='fill_date', event_type='rx_fill',
      fill_type='refill')
  - rejected_fills: XCOUNT('rx', 'rx_fills', within_months=win, date_field='fill_date', event_type='rx_fill_rejected')
  - medication_credit: (K('medication_relief_steady_usd') if maintenance_fills >= K('medication_relief_min_refills')
      and rejected_fills == 0 else (K('medication_relief_interrupted_usd') if maintenance_fills >= K('medication_relief_min_refills')
      and rejected_fills >= 1 else 0))
  - treatment_rides: XCOUNT('ride', 'ride_trips', within_months=win, date_field='appointment_date', event_type='ride_trip_completed')
  - travel_credit: (K('travel_relief_family_driven_usd') if treatment_rides >= K('travel_relief_min_trips') and
      EXISTS('ride', status='active', variant_name='RideLink Mileage Reimbursement') else (K('travel_relief_arranged_usd')
      if treatment_rides >= K('travel_relief_min_trips') and not EXISTS('ride', status='active', variant_name='RideLink
      Mileage Reimbursement') else 0))
  - cap: RND(F('household_income_monthly') * cap_months * cap_pct / 100 + K('half_up_guard'), 2) - admission_credit
      - medication_credit - travel_credit
  - result: RND(MX(0, counted_total - cap) + K('half_up_guard'), 2)
  compute_basis:
    win: The counting window is the number of months in the category's cap period counted back from the review date,
      a date counting when it lies fewer than that many whole months before the review date.
    medical_net: The counted total is the member copays on medical claims whose service date falls in the counting
      window, net of any adjustment entries against those claims,
    refunds_booked: plus the over-cap refunds already booked in the counting window
    pharmacy_net: and the pharmacy copays on fills and fill reversals dated in the counting window.
    premiums_paid: with a premium balance of zero the counted premium is the premiums paid in the counting window
    premium_counted: 'A membership in a category that bills a premium adds its counted premium to the counted total:
      with a premium balance of zero the counted premium is the premiums paid in the counting window, and while
      a premium balance above zero stands the counted premium is the premiums paid in the counting window less that
      outstanding balance; in a category that bills no premium no premium is counted.'
    approved_auths: whose member holds at least one authorization approved on a request received in the counting
      window
    cap_pct: 'The cap percent follows household income and ongoing authorized care: a household at or below the
      low-income band top percent of the federal poverty level whose member holds at least one authorization approved
      on a request received in the counting window takes the low-income ongoing-care cap percent, a household at
      or below that band top whose member holds no such approved authorization takes the low-income cap percent,
      and any other household keeps the category''s cap percent.'
    months_since_start: the cap months are one more than the whole months elapsed from the coverage start date to
      the review date
    cap_months: 'The cap months follow how much of the counting window the membership covered: where the coverage
      start date falls fewer than the cap-period months before the review month, the cap months are one more than
      the whole months elapsed from the coverage start date to the review date; where the membership has ended and
      its termination date falls inside the counting window, the cap months are the cap-period months less the whole
      months from the termination date to the review date; otherwise the cap months are the category''s cap-period
      months.'
    inpatient_stays: where the counting window holds at least the admission relief minimum of paid inpatient stay
      claims
    managed_episode: and the member holds an active care coordination or case management episode
    admission_credit: 'The cap is lowered by the admission relief credit: where the counting window holds at least
      the admission relief minimum of paid inpatient stay claims and the member holds an active care coordination
      or case management episode, the credit is the managed admission relief amount; where the window holds that
      many paid inpatient stays and the member holds no such episode, the credit is the unmanaged admission relief
      amount; otherwise there is no admission relief.'
    maintenance_fills: where the pharmacy benefit shows at least the medication relief minimum of paid refills dated
      in the counting window
    rejected_fills: and no rejected fill in that window
    medication_credit: 'The cap is also lowered by the medication relief credit: where the pharmacy benefit shows
      at least the medication relief minimum of paid refills dated in the counting window and no rejected fill in
      that window, the credit is the steady medication relief amount; where it shows that many paid refills and
      at least one rejected fill in the window, the credit is the interrupted medication relief amount; otherwise
      there is no medication relief.'
    treatment_rides: where the transportation benefit shows at least the travel relief minimum of completed trips
      with appointment dates in the counting window
    travel_credit: 'The cap is also lowered by the travel relief credit: where the transportation benefit shows
      at least the travel relief minimum of completed trips with appointment dates in the counting window and the
      member''s transportation level of service is RideLink Mileage Reimbursement, so that the family drove the
      child itself, the credit is the family-driven travel relief amount; where it shows that many completed trips
      under any other level of service, the credit is the arranged-ride travel relief amount; otherwise there is
      no travel relief.'
    cap: The member's cap is the monthly household income on file times the category's cap-period months times the
      category's cap percent, divided by one hundred and rounded half up to the cent.
    result: The over-cap refund is the counted total less the cap, never below zero, rounded half up to the cent.
  factors:
  - id: cap_percent_by_income_and_authorized_care
    effect: parameter
    decides: cap_pct
    bindings:
    - approved_auths
    - cap_pct
    ladder:
    - when: household income on file at or below the low-income band top percent of FPL AND at least one authorization
        approved on a request received in the counting window
      value: K('cap_pct_low_income_ongoing_care')
    - when: household income on file at or below the low-income band top percent of FPL AND no authorization approved
        on a request received in the counting window
      value: K('cap_pct_low_income')
    - when: otherwise
      value: P('cost_share_cap_pct_income')
    baseline:
      cap_pct: P('cost_share_cap_pct_income')
    evidence:
    - cross_category
    - history
    cross_difficulty: auth
  - id: cap_months_by_coverage_span
    effect: method
    decides: cap_months
    bindings:
    - months_since_start
    - cap_months
    ladder:
    - when: coverage start date fewer than the cap-period months before the review month
      method: cap months = whole months from the coverage start month through the review month, both counted
    - when: membership ended with its termination date inside the counting window
      method: cap months = cap-period months less the whole months from the termination date to the review date
    - when: otherwise
      method: cap months = the category's cap-period months
    baseline:
      cap_months: win
    evidence:
    - date
    cross_difficulty: null
  - id: counted_premium_by_premium_standing
    effect: method
    decides: premium_counted
    bindings:
    - premiums_paid
    - premium_counted
    ladder:
    - when: category bills a premium AND premium balance of zero
      method: counted premium = premiums paid in the counting window
    - when: category bills a premium AND premium balance above zero
      method: counted premium = premiums paid in the counting window less the outstanding balance
    - when: otherwise (category bills no premium)
      method: no premium counted
    baseline:
      premium_counted: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: admission_relief_credit
    effect: parameter
    decides: admission_credit
    bindings:
    - inpatient_stays
    - managed_episode
    - admission_credit
    ladder:
    - when: at least the admission relief minimum of paid inpatient stays in the counting window AND an active care
        coordination or case management episode
      value: K('admission_relief_managed_usd')
    - when: at least that many paid inpatient stays AND no such active episode
      value: K('admission_relief_unmanaged_usd')
    - when: otherwise
      value: '0'
    baseline:
      admission_credit: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: null
  - id: medication_relief_credit
    effect: parameter
    decides: medication_credit
    bindings:
    - maintenance_fills
    - rejected_fills
    - medication_credit
    ladder:
    - when: at least the medication relief minimum of paid refills in the counting window AND no rejected fill in
        the window
      value: K('medication_relief_steady_usd')
    - when: at least that many paid refills AND at least one rejected fill in the window
      value: K('medication_relief_interrupted_usd')
    - when: otherwise
      value: '0'
    baseline:
      medication_credit: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: rx
  - id: travel_relief_credit
    effect: parameter
    decides: travel_credit
    bindings:
    - treatment_rides
    - travel_credit
    ladder:
    - when: at least the travel relief minimum of completed trips in the counting window AND level of service RideLink
        Mileage Reimbursement
      value: K('travel_relief_family_driven_usd')
    - when: at least that many completed trips AND any other level of service
