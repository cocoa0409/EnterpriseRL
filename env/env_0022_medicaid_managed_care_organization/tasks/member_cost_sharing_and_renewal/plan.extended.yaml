    cross_category:
    - auth
    - ride
    - care
- id: plan_ext_ambulance_transport_rerating
  base_policy_refs:
  - plan_evt_claim_adjustment
  - plan_evt_copay
  overwrite:
  - base_policy: plan_evt_claim_adjustment
    superseded_clause: An adjustment reverses the whole member cost share of one original claim identified by its
      claim number and is booked with a new adjustment claim number whose related_claim_number is the original claim
      number.
    replaced_by: The ambulance re-rating is booked as one adjustment entry that names the most recently serviced
      ambulance claim of the batch as its original claim and carries the ambulance reversal as a negative member
      cost share.
  - base_policy: plan_evt_claim_adjustment
    superseded_clause: 'Valid adjustment reasons are recorded in denial_code: not_eligible_on_service_date when
      coverage is found not to have been in force on the service date, duplicate_claim when the same service was
      booked twice, and not_covered when the service is reclassified as non-covered; a reason outside these is not
      an adjustment and cannot be booked.'
    replaced_by: An ambulance re-rating reverses part of the transport copays and no service, so it carries the
      reason code none.
  - base_policy: plan_evt_copay
    superseded_clause: Each paid claim is assessed the copay the member's category sets for the claim's service_category,
      once per claim, with no copay on denied claims.
    replaced_by: A re-rated ambulance transport carries the re-rated copay this rule sets in place of the copay
      the category schedule sets for its service category.
  trigger: state_due
  subject:
  - plan_claim_adjusted
  computes: reversal_amount
  target_tool: book_ambulance_transport_rerating_8b982fa6
  params:
    base_review_months: 3
    transport_review_months: 6
    equipment_review_months: 12
    stretcher_transport_copay_usd: 0.0
    wheelchair_transport_copay_usd: 5.0
    coordinated_discharge_credit_usd: 2.5
    uncoordinated_discharge_credit_usd: 1.0
    far_trip_miles: 50
    mid_trip_miles: 25
    far_trip_credit_usd: 1.0
    mid_trip_credit_usd: 0.5
    high_tier_care_credit_usd: 1.0
    base_tier_care_credit_usd: 0.5
    half_up_guard: 1.0e-06
  rule: 'Ambulance transports of a child who depends on scheduled wheelchair or stretcher transport are re-rated.
    The ambulance batch is every paid ambulance claim whose service date falls in the ambulance review window, which
    is the review months counted back from the review date, a date counting when it lies fewer than that many whole
    months before the review date. The ambulance reversal is the copays booked on the batch less the re-rated copays,
    rounded half up to the cent; with a review of the base review months, each batch transport keeps the category''s
    ambulance copay. How far back the review reaches follows the child''s transport needs: where the member''s transportation
    level of service is RideLink Wheelchair Van or RideLink Stretcher Van and the member holds an approved durable
    medical equipment authorization, the review reaches back the equipment-dependent review months; where that level
    of service holds without such an authorization, it reaches back the transport-dependent review months; otherwise
    it reaches back the base review months. The re-rated ambulance copay follows the level of service: RideLink
    Stretcher Van re-rates at the stretcher transport copay, RideLink Wheelchair Van re-rates at the wheelchair
    transport copay, and any other level of service keeps the category''s ambulance copay. The re-rated ambulance
    copay is lowered by the discharge credit, the long-distance credit and the care tier credit, never below zero.
    The discharge credit follows hospital discharges: where the transportation benefit shows at least one completed
    hospital discharge trip in the twelve months before the review date and the member enrolled in a care management
    episode in those twelve months, the credit is the coordinated discharge credit; where it shows such a trip and
    no such enrollment exists, the credit is the uncoordinated discharge credit; otherwise there is no discharge
    credit. The long-distance credit follows the longest one-way trip the transportation benefit shows: at least
    the far-trip miles earns the far-trip credit, at least the mid-trip miles earns the mid-trip credit, and a shorter
    longest trip earns no long-distance credit. The care tier credit follows the care management tier: a Care Coordination
    Level 2 or Complex Case Management episode enrolled in the twelve months before the review date earns the high-tier
    care credit, any other episode enrolled in those months earns the base-tier care credit, and no episode enrolled
    in those months earns no care tier credit. The ambulance re-rating is booked as one adjustment entry that names
    the most recently serviced ambulance claim of the batch as its original claim and carries the ambulance reversal
    as a negative member cost share. An ambulance re-rating reverses part of the transport copays and no service,
    so it carries the reason code none. A re-rated ambulance transport carries the re-rated copay this rule sets
    in place of the copay the category schedule sets for its service category.'
  prerequisite: []
  cross_category:
  - category: ride
    as: history
    reads:
    - variant_name
    - ride_trips.trip_purpose
    - ride_trips.one_way_miles
    - ride_trips.appointment_date
    note: The review reach, level-of-service copay, discharge and long-distance credits read the transportation
      benefit and its trips.
  - category: auth
    as: existence
    reads:
    - status
    - variant_name
    note: The review reach reads whether an approved durable medical equipment authorization is held.
  - category: care
    as: branch
    reads:
    - status
    - variant_name
    note: The discharge and care tier credits read the active care management episode.
  compute:
  - amb_copay: P('copay_ambulance_usd')
  - review_months: (K('equipment_review_months') if (EXISTS('ride', variant_name='RideLink Wheelchair Van') or EXISTS('ride',
      variant_name='RideLink Stretcher Van')) and EXISTS('auth', status='approved', variant_name='Durable Medical
      Equipment Authorization') else (K('transport_review_months') if (EXISTS('ride', variant_name='RideLink Wheelchair
      Van') or EXISTS('ride', variant_name='RideLink Stretcher Van')) and not EXISTS('auth', status='approved',
      variant_name='Durable Medical Equipment Authorization') else K('base_review_months')))
  - batch_transports: COUNT('plan_claims', within_months=review_months, date_field='service_date', event_type='plan_claim_booked',
      adjudication_status='paid', service_category='ambulance')
  - batch_copays: SUM('plan_claims', 'member_cost_share', within_months=review_months, date_field='service_date',
      event_type='plan_claim_booked', adjudication_status='paid', service_category='ambulance')
  - level_copay: (K('stretcher_transport_copay_usd') if EXISTS('ride', variant_name='RideLink Stretcher Van') else
      (K('wheelchair_transport_copay_usd') if EXISTS('ride', variant_name='RideLink Wheelchair Van') else amb_copay))
  - discharge_trips: XCOUNT('ride', 'ride_trips', within_months=12, date_field='appointment_date', event_type='ride_trip_completed',
      trip_purpose='hospital_discharge')
  - discharge_credit: (K('coordinated_discharge_credit_usd') if discharge_trips >= 1 and XCOUNT('care', 'care_enrollments',
      within_months=12, date_field='enrollment_date') >= 1 else (K('uncoordinated_discharge_credit_usd') if discharge_trips
      >= 1 and XCOUNT('care', 'care_enrollments', within_months=12, date_field='enrollment_date') == 0 else 0))
  - longest_trip: XMAX('ride', 'ride_trips', 'one_way_miles')
  - distance_credit: (K('far_trip_credit_usd') if longest_trip >= K('far_trip_miles') else (K('mid_trip_credit_usd')
      if longest_trip >= K('mid_trip_miles') else 0))
  - care_tier_credit: (K('high_tier_care_credit_usd') if XCOUNT('care', 'care_enrollments', within_months=12, date_field='enrollment_date',
      variant_name='Care Coordination Level 2') + XCOUNT('care', 'care_enrollments', within_months=12, date_field='enrollment_date',
      variant_name='Complex Case Management') >= 1 else (K('base_tier_care_credit_usd') if XCOUNT('care', 'care_enrollments',
      within_months=12, date_field='enrollment_date') >= 1 else 0))
  - rerated_copay: MX(0, level_copay - discharge_credit - distance_credit - care_tier_credit)
  - result: RND(batch_copays - batch_transports * rerated_copay + K('half_up_guard'), 2)
  compute_basis:
    amb_copay: with a review of the base review months, each batch transport keeps the category's ambulance copay
    review_months: 'How far back the review reaches follows the child''s transport needs: where the member''s transportation
      level of service is RideLink Wheelchair Van or RideLink Stretcher Van and the member holds an approved durable
      medical equipment authorization, the review reaches back the equipment-dependent review months; where that
      level of service holds without such an authorization, it reaches back the transport-dependent review months;
      otherwise it reaches back the base review months.'
    batch_transports: The ambulance batch is every paid ambulance claim whose service date falls in the ambulance
      review window, which is the review months counted back from the review date, a date counting when it lies
      fewer than that many whole months before the review date.
    batch_copays: The ambulance batch is every paid ambulance claim whose service date falls in the ambulance review
      window, which is the review months counted back from the review date, a date counting when it lies fewer than
      that many whole months before the review date.
    level_copay: 'The re-rated ambulance copay follows the level of service: RideLink Stretcher Van re-rates at
      the stretcher transport copay, RideLink Wheelchair Van re-rates at the wheelchair transport copay, and any
      other level of service keeps the category''s ambulance copay.'
    discharge_trips: where the transportation benefit shows at least one completed hospital discharge trip in the
      twelve months before the review date
    discharge_credit: 'The discharge credit follows hospital discharges: where the transportation benefit shows
      at least one completed hospital discharge trip in the twelve months before the review date and the member
      enrolled in a care management episode in those twelve months, the credit is the coordinated discharge credit;
      where it shows such a trip and no such enrollment exists, the credit is the uncoordinated discharge credit;
      otherwise there is no discharge credit.'
    longest_trip: 'The long-distance credit follows the longest one-way trip the transportation benefit shows:'
    distance_credit: 'The long-distance credit follows the longest one-way trip the transportation benefit shows:
      at least the far-trip miles earns the far-trip credit, at least the mid-trip miles earns the mid-trip credit,
      and a shorter longest trip earns no long-distance credit.'
    care_tier_credit: 'The care tier credit follows the care management tier: a Care Coordination Level 2 or Complex
      Case Management episode enrolled in the twelve months before the review date earns the high-tier care credit,
      any other episode enrolled in those months earns the base-tier care credit, and no episode enrolled in those
      months earns no care tier credit.'
    rerated_copay: The re-rated ambulance copay is lowered by the discharge credit, the long-distance credit and
      the care tier credit, never below zero.
    result: The ambulance reversal is the copays booked on the batch less the re-rated copays, rounded half up to
      the cent; with a review of the base review months, each batch transport keeps the category's ambulance copay.
  factors:
  - id: ambulance_review_reach
    effect: method
    decides: review_months
    bindings:
    - review_months
    - batch_transports
    - batch_copays
    ladder:
    - when: level of service RideLink Wheelchair Van or Stretcher Van AND an approved durable medical equipment
        authorization
      method: review the ambulance claims of the equipment-dependent review months
    - when: that level of service AND no such authorization
      method: review the ambulance claims of the transport-dependent review months
    - when: otherwise
      method: review the ambulance claims of the base review months
    baseline:
      review_months: K('base_review_months')
    evidence:
    - cross_category
    - history
    cross_difficulty: ride
  - id: ambulance_copay_by_level_of_service
    effect: parameter
    decides: level_copay
    bindings:
    - level_copay
    ladder:
    - when: level of service RideLink Stretcher Van
      value: K('stretcher_transport_copay_usd')
    - when: level of service RideLink Wheelchair Van
      value: K('wheelchair_transport_copay_usd')
    - when: otherwise
      value: amb_copay
    baseline:
      level_copay: amb_copay
    evidence:
    - cross_category
    cross_difficulty: ride
  - id: discharge_transport_credit
    effect: parameter
    decides: discharge_credit
    bindings:
    - discharge_trips
    - discharge_credit
    ladder:
    - when: at least one completed hospital discharge trip in twelve months AND a care management episode enrolled
        in those months
      value: K('coordinated_discharge_credit_usd')
    - when: such a trip AND no episode enrolled in those months
      value: K('uncoordinated_discharge_credit_usd')
    - when: otherwise
      value: '0'
    baseline:
      discharge_credit: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: ride
  - id: long_distance_transport_credit
    effect: parameter
    decides: distance_credit
    bindings:
    - longest_trip
    - distance_credit
    ladder:
    - when: longest one-way trip at least the far-trip miles
      value: K('far_trip_credit_usd')
    - when: longest one-way trip at least the mid-trip miles and below the far-trip miles
      value: K('mid_trip_credit_usd')
    - when: otherwise
      value: '0'
    baseline:
      distance_credit: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: ride
  - id: care_tier_transport_credit
    effect: parameter
    decides: care_tier_credit
    bindings:
    - care_tier_credit
    ladder:
    - when: a Care Coordination Level 2 or Complex Case Management episode enrolled in the twelve months before
        review
      value: K('high_tier_care_credit_usd')
    - when: any other care management episode enrolled in those months
      value: K('base_tier_care_credit_usd')
    - when: otherwise
      value: '0'
    baseline:
      care_tier_credit: '0'
    evidence:
    - cross_category
    cross_difficulty: null
  baseline:
    rule: The ambulance batch is every paid ambulance claim whose service date falls in the ambulance review window,
      which is the review months counted back from the review date, a date counting when it lies fewer than that
      many whole months before the review date. The ambulance reversal is the copays booked on the batch less the
      re-rated copays, rounded half up to the cent; with a review of the base review months, each batch transport
      keeps the category's ambulance copay.
    params:
    - base_review_months
    - copay_ambulance_usd
  inputs:
    history:
    - table: plan_claims
      aggregate: sum
      field: member_cost_share
      within_months: 12
      filters:
        service_category: ambulance
    - category: ride
      table: ride_trips
      aggregate: count
      field: ride_trip_id
      within_months: 12
      filters:
        trip_purpose: hospital_discharge
    cross_category:
    - ride
    - auth
    - care
