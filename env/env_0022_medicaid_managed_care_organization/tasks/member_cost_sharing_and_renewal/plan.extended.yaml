- id: plan_ext_past_due_premium_payment
  base_policy_refs:
  - plan_evt_premium
  - plan_continuous_eligibility
  overwrite:
  - base_policy: plan_evt_premium
    superseded_clause: A payment is applied first to the oldest billed coverage month that is not yet paid or waived,
      and a payment that exceeds all billed months is applied to future months up to premium_prepay_max_months,
      with any remainder returned to the payer.
    replaced_by: The family's phone payment is made for the most recently billed coverage month once that month's
      due date has passed, and it settles that month alone.
  trigger: on_request
  subject:
  - plan_premium_paid
  computes: payment_amount
  target_tool: pay_past_due_premium_fdc43b6b
  params:
    band_one_top_pct: 185
    band_one_monthly_usd: 20.0
    reward_lookback_months: 12
    well_child_reward_min_visits: 2
    well_child_reward_medical_home_usd: 3.0
    well_child_reward_other_usd: 2.0
    refill_reward_window_months: 6
    refill_reward_min_fills: 3
    refill_reward_steady_usd: 2.0
    refill_reward_interrupted_usd: 1.0
    care_reward_contact_window_months: 3
    care_reward_engaged_usd: 2.5
    care_reward_enrolled_usd: 1.0
    steady_payer_min_payments: 6
    steady_payer_reward_usd: 1.5
    steady_payer_reward_phone_usd: 0.75
    half_up_guard: 1.0e-06
  rule: 'The family''s phone payment is made for the most recently billed coverage month once that month''s due
    date has passed, and it settles that month alone. The payment amount is the month rate less the Healthy Kids
    reward total, never below zero and rounded half up to the cent. The month rate is the amount billed for the
    month. With no Healthy Kids reward earned, the reward total is zero. The month rate is set aside for a month
    billed above the monthly amount of the family''s most recent paid month: while continuous eligibility is still
    running, that is while the months it has run, counted as the whole months elapsed since the coverage start date
    or since the start of the current eligibility period, whichever is fewer, stay below the category''s continuous
    eligibility months, the current eligibility period being the redetermination months that end on the renewal
    due date, the month rate is that most recent paid amount, because a higher premium band never applies while
    continuous eligibility runs; once that continuous eligibility has ended, a household at or below the first band
    top percent of the federal poverty level is rated at the first band monthly amount; otherwise the month keeps
    the amount billed. The Healthy Kids well-child reward follows the child''s well-child care: where the primary
    care visit record logs at least the well-child reward minimum of well-child visits in the reward look-back months
    before the review date and the current primary care practice is a Patient-Centered Medical Home Practice or
    Federally Qualified Health Center Home, the reward is the medical-home well-child amount; where that many well-child
    visits are logged and the practice is of any other type, the reward is the other-practice well-child amount;
    otherwise there is no well-child reward. The Healthy Kids refill reward follows the child''s maintenance medication:
    where the pharmacy benefit shows at least the refill reward minimum of paid fills in the refill window months
    before the review date and no rejected fill in that window, the reward is the steady-refill amount; where it
    shows that many paid fills and at least one rejected fill in the window, the reward is the interrupted-refill
    amount; otherwise there is no refill reward. The Healthy Kids care reward follows care management: where the
    member holds an active care management episode and the care team recorded at least one reached contact in the
    care contact window months before the review date, the reward is the engaged-care amount; where the member holds
    an active episode with no reached contact in that window, the reward is the enrolled-care amount; otherwise
    there is no care reward. The Healthy Kids steady-payer reward follows how the family paid its premiums: where
    at least the steady-payer minimum of premium payments were posted in the reward look-back months through the
    member portal and the phone line together, with portal payments at least as many as phone payments, the reward
    is the portal steady-payer amount; where that many were posted through those two channels with phone payments
    outnumbering portal payments, the reward is the phone steady-payer amount; otherwise there is no steady-payer
    reward. The Healthy Kids rewards stack by how the child''s care is organised: where the current practice is
    a medical-home practice and the member holds an active care management episode, the well-child and care rewards
    are averaged into one amount and the refill and steady-payer rewards are added to it; where the member holds
    an active episode and the practice is not a medical-home practice, the well-child, care and refill rewards are
    added and no steady-payer reward is taken; otherwise every reward earned is added. The Healthy Kids reward total
    is a credit the plan applies to the month the family pays; it is not a waiver, and the payment settles the month.'
  prerequisite: []
  cross_category:
  - category: pcp
    as: branch
    reads:
    - variant_name
    - status
    - pcp_visits.visit_type
    - pcp_visits.visit_date
    note: The well-child reward and the stacking factor read the PCP visit log and the practice type of the current
      assignment.
  - category: rx
    as: history
    reads:
    - rx_fills.event_type
    - rx_fills.fill_date
    note: The refill reward counts paid and rejected fills in the refill window.
  - category: care
    as: branch
    reads:
    - status
    - care_activities.attempt_outcome
    - care_activities.activity_date
    note: The care reward and the stacking factor read the active episode and its reached contacts.
  compute:
  - month_cm: LATEST('plan_premiums', 'coverage_month', date_field='posted_date', event_type='plan_premium_billed')
  - month_bill: LATEST('plan_premiums', 'amount', date_field='posted_date', event_type='plan_premium_billed')
  - last_paid: LATEST('plan_premiums', 'amount', date_field='posted_date', event_type='plan_premium_paid')
  - ce_months_run: MN(MONTHS(F('coverage_start_date'), NOW), P('redetermination_period_months') - 1 - MONTHS(NOW,
      F('renewal_due_date')))
  - month_rate: (last_paid if ce_months_run < P('continuous_eligibility_months') and month_bill > last_paid else
      (K('band_one_monthly_usd') if ce_months_run >= P('continuous_eligibility_months') and month_bill > last_paid
      and F('income_pct_fpl') <= K('band_one_top_pct') else month_bill))
  - well_visits: XCOUNT('pcp', 'pcp_visits', within_months=K('reward_lookback_months'), date_field='visit_date',
      visit_type='well_visit')
  - medical_home: EXISTS('pcp', status='active', variant_name='Patient-Centered Medical Home Practice') or EXISTS('pcp',
      status='active', variant_name='Federally Qualified Health Center Home')
  - well_reward: (K('well_child_reward_medical_home_usd') if well_visits >= K('well_child_reward_min_visits') and
      medical_home else (K('well_child_reward_other_usd') if well_visits >= K('well_child_reward_min_visits') and
      not medical_home else 0))
  - paid_fills: XCOUNT('rx', 'rx_fills', within_months=K('refill_reward_window_months'), date_field='fill_date',
      event_type='rx_fill')
  - rejected_refills: XCOUNT('rx', 'rx_fills', within_months=K('refill_reward_window_months'), date_field='fill_date',
      event_type='rx_fill_rejected')
  - refill_reward: (K('refill_reward_steady_usd') if paid_fills >= K('refill_reward_min_fills') and rejected_refills
      == 0 else (K('refill_reward_interrupted_usd') if paid_fills >= K('refill_reward_min_fills') and rejected_refills
      >= 1 else 0))
  - reached_contacts: XCOUNT('care', 'care_activities', within_months=K('care_reward_contact_window_months'), date_field='activity_date',
      attempt_outcome='reached')
  - care_reward: (K('care_reward_engaged_usd') if EXISTS('care', status='active') and reached_contacts >= 1 else
      (K('care_reward_enrolled_usd') if EXISTS('care', status='active') and reached_contacts == 0 else 0))
  - portal_payments: COUNT('plan_premiums', within_months=K('reward_lookback_months'), date_field='posted_date',
      event_type='plan_premium_paid', payment_method='online_portal')
  - phone_payments: COUNT('plan_premiums', within_months=K('reward_lookback_months'), date_field='posted_date',
      event_type='plan_premium_paid', payment_method='phone_ivr')
  - steady_reward: (K('steady_payer_reward_usd') if portal_payments + phone_payments >= K('steady_payer_min_payments')
      and portal_payments >= phone_payments else (K('steady_payer_reward_phone_usd') if portal_payments + phone_payments
      >= K('steady_payer_min_payments') and portal_payments < phone_payments else 0))
  - reward_total: ((well_reward + care_reward) / 2 + refill_reward + steady_reward if medical_home and EXISTS('care',
      status='active') else ((well_reward + care_reward + refill_reward) if EXISTS('care', status='active') and
      not medical_home else (well_reward + refill_reward + care_reward + steady_reward)))
  - result: RND(MX(0, month_rate - reward_total) + K('half_up_guard'), 2)
  compute_basis:
    month_cm: The family's phone payment is made for the most recently billed coverage month once that month's due
      date has passed, and it settles that month alone.
    month_bill: The month rate is the amount billed for the month.
    last_paid: 'The month rate is set aside for a month billed above the monthly amount of the family''s most recent
      paid month:'
    ce_months_run: while continuous eligibility is still running, that is while the months it has run, counted as
      the whole months elapsed since the coverage start date or since the start of the current eligibility period,
      whichever is fewer, stay below the category's continuous eligibility months, the current eligibility period
      being the redetermination months that end on the renewal due date
    month_rate: 'The month rate is set aside for a month billed above the monthly amount of the family''s most recent
      paid month: while continuous eligibility is still running, that is while the months it has run, counted as
      the whole months elapsed since the coverage start date or since the start of the current eligibility period,
      whichever is fewer, stay below the category''s continuous eligibility months, the current eligibility period
      being the redetermination months that end on the renewal due date, the month rate is that most recent paid
      amount, because a higher premium band never applies while continuous eligibility runs; once that continuous
      eligibility has ended, a household at or below the first band top percent of the federal poverty level is
      rated at the first band monthly amount; otherwise the month keeps the amount billed.'
    well_visits: where the primary care visit record logs at least the well-child reward minimum of well-child visits
      in the reward look-back months before the review date
    medical_home: the current primary care practice is a Patient-Centered Medical Home Practice or Federally Qualified
      Health Center Home
    well_reward: 'The Healthy Kids well-child reward follows the child''s well-child care: where the primary care
      visit record logs at least the well-child reward minimum of well-child visits in the reward look-back months
      before the review date and the current primary care practice is a Patient-Centered Medical Home Practice or
      Federally Qualified Health Center Home, the reward is the medical-home well-child amount; where that many
      well-child visits are logged and the practice is of any other type, the reward is the other-practice well-child
      amount; otherwise there is no well-child reward.'
    paid_fills: where the pharmacy benefit shows at least the refill reward minimum of paid fills in the refill
      window months before the review date
    rejected_refills: and no rejected fill in that window
    refill_reward: 'The Healthy Kids refill reward follows the child''s maintenance medication: where the pharmacy
      benefit shows at least the refill reward minimum of paid fills in the refill window months before the review
      date and no rejected fill in that window, the reward is the steady-refill amount; where it shows that many
      paid fills and at least one rejected fill in the window, the reward is the interrupted-refill amount; otherwise
      there is no refill reward.'
    reached_contacts: the care team recorded at least one reached contact in the care contact window months before
      the review date
    care_reward: 'The Healthy Kids care reward follows care management: where the member holds an active care management
      episode and the care team recorded at least one reached contact in the care contact window months before the
      review date, the reward is the engaged-care amount; where the member holds an active episode with no reached
      contact in that window, the reward is the enrolled-care amount; otherwise there is no care reward.'
    portal_payments: posted in the reward look-back months through the member portal and the phone line together
    phone_payments: posted in the reward look-back months through the member portal and the phone line together
    steady_reward: 'The Healthy Kids steady-payer reward follows how the family paid its premiums: where at least
      the steady-payer minimum of premium payments were posted in the reward look-back months through the member
      portal and the phone line together, with portal payments at least as many as phone payments, the reward is
      the portal steady-payer amount; where that many were posted through those two channels with phone payments
      outnumbering portal payments, the reward is the phone steady-payer amount; otherwise there is no steady-payer
      reward.'
    reward_total: 'The Healthy Kids rewards stack by how the child''s care is organised: where the current practice
      is a medical-home practice and the member holds an active care management episode, the well-child and care
      rewards are averaged into one amount and the refill and steady-payer rewards are added to it; where the member
      holds an active episode and the practice is not a medical-home practice, the well-child, care and refill rewards
      are added and no steady-payer reward is taken; otherwise every reward earned is added.'
    result: The payment amount is the month rate less the Healthy Kids reward total, never below zero and rounded
      half up to the cent.
  factors:
  - id: month_rate_under_continuous_eligibility
    effect: method
    decides: month_rate
    bindings:
    - last_paid
    - ce_months_run
    - month_rate
    ladder:
    - when: continuous eligibility still running (months run below the category's continuous eligibility months)
        AND the month billed above the most recent paid monthly amount
      method: month rate = the most recent paid monthly amount
    - when: continuous eligibility ended AND the month billed above the most recent paid amount AND household income
        at or below the first band top percent
      method: month rate = the first band monthly amount
    - when: otherwise
      method: month rate = the amount billed for the month
    baseline:
      month_rate: month_bill
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: well_child_reward
    effect: parameter
    decides: well_reward
    bindings:
    - well_visits
    - medical_home
    - well_reward
    ladder:
    - when: at least the well-child reward minimum of logged well-child visits in the look-back AND current practice
        a medical-home practice
      value: K('well_child_reward_medical_home_usd')
    - when: that many logged well-child visits AND any other practice type
      value: K('well_child_reward_other_usd')
    - when: otherwise
      value: '0'
    baseline:
      well_reward: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: pcp
  - id: refill_reward
    effect: parameter
    decides: refill_reward
    bindings:
    - paid_fills
    - rejected_refills
    - refill_reward
    ladder:
    - when: at least the refill reward minimum of paid fills in the refill window AND no rejected fill in it
      value: K('refill_reward_steady_usd')
    - when: that many paid fills AND at least one rejected fill in the window
      value: K('refill_reward_interrupted_usd')
    - when: otherwise
      value: '0'
    baseline:
      refill_reward: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: rx
  - id: care_reward
    effect: parameter
    decides: care_reward
    bindings:
    - reached_contacts
    - care_reward
    ladder:
    - when: active care management episode AND at least one reached contact in the care contact window
      value: K('care_reward_engaged_usd')
    - when: active episode AND no reached contact in that window
      value: K('care_reward_enrolled_usd')
    - when: otherwise
      value: '0'
    baseline:
      care_reward: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: null
  - id: steady_payer_reward
    effect: parameter
    decides: steady_reward
    bindings:
    - portal_payments
    - phone_payments
    - steady_reward
    ladder:
    - when: at least the steady-payer minimum of portal and phone payments in the look-back AND portal payments
        at least as many as phone payments
      value: K('steady_payer_reward_usd')
    - when: that many portal and phone payments AND phone payments outnumbering portal payments
      value: K('steady_payer_reward_phone_usd')
    - when: otherwise
      value: '0'
    baseline:
      steady_reward: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: reward_stacking
    effect: method
    decides: reward_total
    bindings:
    - reward_total
    ladder:
    - when: current practice a medical-home practice AND an active care management episode
      method: reward total = the average of the well-child and care rewards, plus the refill and steady-payer rewards
    - when: an active care management episode AND a practice that is not a medical-home practice
      method: reward total = well-child plus care plus refill rewards, no steady-payer reward
    - when: otherwise
      method: reward total = every reward earned added together
    baseline:
      reward_total: well_reward + refill_reward + care_reward + steady_reward
    evidence:
    - cross_category
    cross_difficulty: null
  baseline:
    rule: The family's phone payment is made for the most recently billed coverage month once that month's due date
      has passed, and it settles that month alone. The payment amount is the month rate less the Healthy Kids reward
      total, never below zero and rounded half up to the cent. The month rate is the amount billed for the month.
      With no Healthy Kids reward earned, the reward total is zero.
    params: []
  inputs:
    history:
    - table: plan_premiums
      aggregate: latest
      field: amount
      filters:
        event_type: plan_premium_billed
    - table: plan_premiums
      aggregate: latest
      field: amount
      filters:
        event_type: plan_premium_paid
    - table: plan_premiums
      aggregate: count
      field: plan_premium_id
      within_months: 12
      filters:
        event_type: plan_premium_paid
    - category: pcp
      table: pcp_visits
      aggregate: count
      field: pcp_visit_id
      within_months: 12
      filters:
        visit_type: well_visit
    - category: rx
      table: rx_fills
      aggregate: count
      field: rx_fill_id
      within_months: 6
      filters: {}
    - category: care
      table: care_activities
      aggregate: count
      field: care_activity_id
      within_months: 3
      filters:
        attempt_outcome: reached
    cross_category:
    - pcp
    - rx
    - care
- id: plan_ext_own_pcp_visit_rerating
  base_policy_refs:
  - plan_evt_claim_adjustment
  - plan_evt_copay
  overwrite:
  - base_policy: plan_evt_claim_adjustment
    superseded_clause: An adjustment reverses the whole member cost share of one original claim identified by its
      claim number and is booked with a new adjustment claim number whose related_claim_number is the original claim
      number.
    replaced_by: The re-rating is booked as one adjustment entry that names the most recently serviced claim of
      the batch as its original claim and carries the batch reversal as a negative member cost share.
  - base_policy: plan_evt_claim_adjustment
    superseded_clause: 'Valid adjustment reasons are recorded in denial_code: not_eligible_on_service_date when
      coverage is found not to have been in force on the service date, duplicate_claim when the same service was
      booked twice, and not_covered when the service is reclassified as non-covered; a reason outside these is not
      an adjustment and cannot be booked.'
    replaced_by: A re-rating adjustment reverses part of a copay rather than the service itself, so it carries the
      reason code none.
  - base_policy: plan_evt_copay
    superseded_clause: Each paid claim is assessed the copay the member's category sets for the claim's service_category,
      once per claim, with no copay on denied claims.
    replaced_by: A re-rated batch visit carries the re-rated copay this rule sets in place of the copay the category
      schedule sets for its service category.
  trigger: state_due
  subject:
  - plan_claim_adjusted
  computes: reversal_amount
  target_tool: book_own_pcp_visit_rerating_ea94b99c
  params:
    medical_home_visit_copay_usd: 2.0
    health_home_visit_copay_usd: 0.5
    telehealth_followup_copay_usd: 0.0
    telehealth_followup_other_copay_usd: 1.0
    initial_appointment_copay_usd: 0.0
    late_initial_appointment_copay_usd: 1.0
    initial_appointment_days: 90
    rerating_window_months: 12
    half_up_guard: 1.0e-06
  rule: 'A visit the member''s own primary care provider bills under the specialist visit copay category is a primary
    care visit, and its copay is re-rated. The re-rating window is the re-rating window months counted back from
    the review date, a date counting when it lies fewer than that many whole months before the review date. The
    re-rating batch is every paid specialist visit claim whose service date falls in the re-rating window and whose
    billing provider is the member''s current primary care provider. The batch reversal is the copays booked on
    the batch claims less the re-rated copays, rounded half up to the cent, and each batch visit is re-rated at
    the category''s primary care visit copay. Which visits the batch holds follows the member''s assignment history:
    where a previous assignment ended because a newer one superseded it and the current assignment was selected
    by the member, the batch holds the visits the current provider billed dated within one more than the whole months
    elapsed since its assignment''s effective date together with the previous provider''s visits in the window;
    where the current assignment took effect inside the window and no superseded assignment exists, the batch holds
    only the current provider''s visits dated within one more than the whole months elapsed since its effective
    date; otherwise the batch holds the current provider''s visits over the whole window. The re-rated copay follows
    the current practice type: a Patient-Centered Medical Home Practice or Federally Qualified Health Center Home
    re-rates at the medical-home visit copay, a Health Home Lead Provider re-rates at the health-home visit copay,
    and any other practice keeps the category''s primary care visit copay. For each telehealth follow-up the current
    assignment''s visit log records in the window, one batch visit re-rates at the medical-home telehealth follow-up
    copay when the current practice is a medical-home practice and at the other-practice telehealth follow-up copay
    when it is not; with no telehealth follow-up logged in the window, no visit re-rates under this rule. For each
    initial health appointment the current assignment''s visit log records in the window, one batch visit re-rates
    at the initial-appointment copay when the appointment took place within the initial appointment days of the
    current assignment''s effective date, and at the late initial-appointment copay when it took place later; with
    no initial health appointment logged in the window, no visit re-rates under this rule. The re-rating is booked
    as one adjustment entry that names the most recently serviced claim of the batch as its original claim and carries
    the batch reversal as a negative member cost share. A re-rating adjustment reverses part of a copay rather than
    the service itself, so it carries the reason code none. A re-rated batch visit carries the re-rated copay this
    rule sets in place of the copay the category schedule sets for its service category.'
  prerequisite: []
  cross_category:
  - category: pcp
    as: branch
    reads:
    - provider_npi
    - status
    - end_reason
    - assignment_method
    - effective_date
    - variant_name
    - pcp_visits.visit_type
    - pcp_visits.visit_mode
    - pcp_visits.visit_date
    note: The scope, practice-type, telehealth and initial-appointment factors read the member's PCP assignments
      and visit log.
  compute:
  - rwin: K('rerating_window_months')
  - cur_aid: CFIELD('pcp', 'pcp_assignment_id', status='active')
  - cur_npi: CFIELD('pcp', 'provider_npi', status='active')
  - prev_npi: CFIELD('pcp', 'provider_npi', status='ended', end_reason='superseded')
  - cur_visits: COUNT('plan_claims', within_months=rwin, date_field='service_date', event_type='plan_claim_booked',
      adjudication_status='paid', service_category='specialist_visit', provider_npi=cur_npi)
  - cur_copays: SUM('plan_claims', 'member_cost_share', within_months=rwin, date_field='service_date', event_type='plan_claim_booked',
      adjudication_status='paid', service_category='specialist_visit', provider_npi=cur_npi)
  - prev_visits: COUNT('plan_claims', within_months=rwin, date_field='service_date', event_type='plan_claim_booked',
      adjudication_status='paid', service_category='specialist_visit', provider_npi=prev_npi)
  - prev_copays: SUM('plan_claims', 'member_cost_share', within_months=rwin, date_field='service_date', event_type='plan_claim_booked',
      adjudication_status='paid', service_category='specialist_visit', provider_npi=prev_npi)
  - cur_since_effective: (MONTHS(CFIELD('pcp', 'effective_date', status='active'), NOW) + 1 if EXISTS('pcp', status='active')
      else rwin)
  - cur_from_visits: COUNT('plan_claims', within_months=cur_since_effective, date_field='service_date', event_type='plan_claim_booked',
      adjudication_status='paid', service_category='specialist_visit', provider_npi=cur_npi)
  - cur_from_copays: SUM('plan_claims', 'member_cost_share', within_months=cur_since_effective, date_field='service_date',
      event_type='plan_claim_booked', adjudication_status='paid', service_category='specialist_visit', provider_npi=cur_npi)
  - scoped_visits: (cur_from_visits + prev_visits if EXISTS('pcp', status='ended', end_reason='superseded') and
      EXISTS('pcp', status='active', assignment_method='member_selected') else (cur_from_visits if cur_since_effective
      < rwin and not EXISTS('pcp', status='ended', end_reason='superseded') else cur_visits))
  - scoped_copays: (cur_from_copays + prev_copays if EXISTS('pcp', status='ended', end_reason='superseded') and
      EXISTS('pcp', status='active', assignment_method='member_selected') else (cur_from_copays if cur_since_effective
      < rwin and not EXISTS('pcp', status='ended', end_reason='superseded') else cur_copays))
  - practice_copay: (K('medical_home_visit_copay_usd') if EXISTS('pcp', status='active', variant_name='Patient-Centered
      Medical Home Practice') or EXISTS('pcp', status='active', variant_name='Federally Qualified Health Center
      Home') else (K('health_home_visit_copay_usd') if EXISTS('pcp', status='active', variant_name='Health Home
      Lead Provider') else P('copay_pcp_visit_usd')))
  - tele_visits: XCOUNT('pcp', 'pcp_visits', within_months=rwin, date_field='visit_date', visit_type='follow_up',
      visit_mode='telehealth', pcp_assignment_id=cur_aid)
  - tele_copay: (K('telehealth_followup_copay_usd') if tele_visits >= 1 and (EXISTS('pcp', status='active', variant_name='Patient-Centered
      Medical Home Practice') or EXISTS('pcp', status='active', variant_name='Federally Qualified Health Center
      Home')) else (K('telehealth_followup_other_copay_usd') if tele_visits >= 1 and not (EXISTS('pcp', status='active',
      variant_name='Patient-Centered Medical Home Practice') or EXISTS('pcp', status='active', variant_name='Federally
      Qualified Health Center Home')) else practice_copay))
  - iha_visits: XCOUNT('pcp', 'pcp_visits', within_months=rwin, date_field='visit_date', visit_type='initial_health_appointment',
      pcp_assignment_id=cur_aid)
  - iha_gap_days: (DAYS(CFIELD('pcp', 'effective_date', status='active'), XLATEST('pcp', 'pcp_visits', 'visit_date',
      date_field='visit_date', visit_type='initial_health_appointment')) if iha_visits >= 1 and EXISTS('pcp', status='active')
      else 0)
  - iha_copay: (K('initial_appointment_copay_usd') if iha_visits >= 1 and iha_gap_days <= K('initial_appointment_days')
      else (K('late_initial_appointment_copay_usd') if iha_visits >= 1 and iha_gap_days > K('initial_appointment_days')
      else practice_copay))
  - rerated_total: (scoped_visits - tele_visits - iha_visits) * practice_copay + tele_visits * tele_copay + iha_visits
      * iha_copay
  - result: RND(scoped_copays - rerated_total + K('half_up_guard'), 2)
  compute_basis:
    rwin: The re-rating window is the re-rating window months counted back from the review date, a date counting
      when it lies fewer than that many whole months before the review date.
    cur_npi: whose billing provider is the member's current primary care provider
    prev_npi: together with the previous provider's visits in the window
    cur_visits: The re-rating batch is every paid specialist visit claim whose service date falls in the re-rating
      window and whose billing provider is the member's current primary care provider.
    cur_copays: The batch reversal is the copays booked on the batch claims less the re-rated copays, rounded half
      up to the cent, and each batch visit is re-rated at the category's primary care visit copay.
    prev_visits: together with the previous provider's visits in the window
    prev_copays: together with the previous provider's visits in the window
    cur_since_effective: the batch holds only the current provider's visits dated within one more than the whole
      months elapsed since its effective date
    cur_from_visits: the batch holds the visits the current provider billed dated within one more than the whole
      months elapsed since its assignment's effective date
    cur_from_copays: the batch holds the visits the current provider billed dated within one more than the whole
      months elapsed since its assignment's effective date
    scoped_visits: 'Which visits the batch holds follows the member''s assignment history: where a previous assignment
      ended because a newer one superseded it and the current assignment was selected by the member, the batch holds
      the visits the current provider billed dated within one more than the whole months elapsed since its assignment''s
      effective date together with the previous provider''s visits in the window; where the current assignment took
      effect inside the window and no superseded assignment exists, the batch holds only the current provider''s
      visits dated within one more than the whole months elapsed since its effective date; otherwise the batch holds
      the current provider''s visits over the whole window.'
    scoped_copays: 'Which visits the batch holds follows the member''s assignment history: where a previous assignment
      ended because a newer one superseded it and the current assignment was selected by the member, the batch holds
      the visits the current provider billed dated within one more than the whole months elapsed since its assignment''s
      effective date together with the previous provider''s visits in the window; where the current assignment took
      effect inside the window and no superseded assignment exists, the batch holds only the current provider''s
      visits dated within one more than the whole months elapsed since its effective date; otherwise the batch holds
      the current provider''s visits over the whole window.'
    practice_copay: 'The re-rated copay follows the current practice type: a Patient-Centered Medical Home Practice
      or Federally Qualified Health Center Home re-rates at the medical-home visit copay, a Health Home Lead Provider
      re-rates at the health-home visit copay, and any other practice keeps the category''s primary care visit copay.'
    tele_visits: For each telehealth follow-up the current assignment's visit log records in the window
    tele_copay: For each telehealth follow-up the current assignment's visit log records in the window, one batch
      visit re-rates at the medical-home telehealth follow-up copay when the current practice is a medical-home
      practice and at the other-practice telehealth follow-up copay when it is not; with no telehealth follow-up
      logged in the window, no visit re-rates under this rule.
    iha_visits: For each initial health appointment the current assignment's visit log records in the window
    iha_gap_days: when the appointment took place within the initial appointment days of the current assignment's
      effective date
    iha_copay: For each initial health appointment the current assignment's visit log records in the window, one
      batch visit re-rates at the initial-appointment copay when the appointment took place within the initial appointment
      days of the current assignment's effective date, and at the late initial-appointment copay when it took place
      later; with no initial health appointment logged in the window, no visit re-rates under this rule.
    rerated_total: The batch reversal is the copays booked on the batch claims less the re-rated copays, rounded
      half up to the cent, and each batch visit is re-rated at the category's primary care visit copay.
    result: The batch reversal is the copays booked on the batch claims less the re-rated copays, rounded half up
      to the cent, and each batch visit is re-rated at the category's primary care visit copay.
    cur_aid: For each telehealth follow-up the current assignment's visit log records in the window
  factors:
  - id: batch_scope_by_assignment_history
    effect: method
    decides: scoped_copays
    bindings:
    - prev_visits
    - prev_copays
    - cur_since_effective
    - cur_from_visits
    - cur_from_copays
    - scoped_visits
    - scoped_copays
    ladder:
    - when: a previous assignment superseded by a newer one AND the current assignment selected by the member
      method: batch = the current provider's visits dated within one more than the whole months elapsed since its
        effective date plus the previous provider's visits in the window
    - when: the current assignment took effect inside the window AND no superseded assignment exists
      method: batch = the current provider's visits dated within one more than the whole months elapsed since its
        effective date only
    - when: otherwise
      method: batch = the current provider's visits over the whole window
    baseline:
      scoped_visits: cur_visits
      scoped_copays: cur_copays
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: pcp
  - id: rerated_copay_by_practice_type
    effect: parameter
    decides: practice_copay
    bindings:
    - practice_copay
    ladder:
    - when: current practice a Patient-Centered Medical Home Practice or Federally Qualified Health Center Home
      value: K('medical_home_visit_copay_usd')
    - when: current practice a Health Home Lead Provider
      value: K('health_home_visit_copay_usd')
    - when: otherwise
      value: P('copay_pcp_visit_usd')
    baseline:
      practice_copay: P('copay_pcp_visit_usd')
    evidence:
    - cross_category
    cross_difficulty: pcp
  - id: telehealth_followup_copay
    effect: parameter
    decides: tele_copay
    bindings:
    - tele_visits
    - tele_copay
    ladder:
    - when: a telehealth follow-up logged in the window AND a medical-home current practice
      value: K('telehealth_followup_copay_usd')
    - when: a telehealth follow-up logged in the window AND a current practice that is not a medical home
      value: K('telehealth_followup_other_copay_usd')
    - when: otherwise
      value: practice_copay (no visit re-rated under this rule)
    baseline:
      tele_copay: practice_copay
    evidence:
    - cross_category
    - history
    cross_difficulty: pcp
  - id: initial_appointment_copay
    effect: parameter
    decides: iha_copay
    bindings:
    - iha_visits
    - iha_gap_days
    - iha_copay
    ladder:
    - when: an initial health appointment logged in the window AND held within the initial appointment days of the
        assignment's effective date
      value: K('initial_appointment_copay_usd')
    - when: an initial health appointment logged in the window AND held later than that
      value: K('late_initial_appointment_copay_usd')
    - when: otherwise
      value: practice_copay (no visit re-rated under this rule)
    baseline:
      iha_copay: practice_copay
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: pcp
  baseline:
    rule: The re-rating window is the re-rating window months counted back from the review date, a date counting
      when it lies fewer than that many whole months before the review date. The re-rating batch is every paid specialist
      visit claim whose service date falls in the re-rating window and whose billing provider is the member's current
      primary care provider. The batch reversal is the copays booked on the batch claims less the re-rated copays,
      rounded half up to the cent, and each batch visit is re-rated at the category's primary care visit copay.
    params:
    - rerating_window_months
    - copay_pcp_visit_usd
    - copay_specialist_visit_usd
  inputs:
    history:
    - table: plan_claims
      aggregate: sum
      field: member_cost_share
      within_months: 12
      filters:
        service_category: specialist_visit
    - category: pcp
      table: pcp_visits
      aggregate: count
      field: pcp_visit_id
      within_months: 12
      filters:
        visit_mode: telehealth
    cross_category:
    - pcp
- id: plan_ext_office_visit_preventive_rerating
  base_policy_refs:
  - plan_evt_claim_adjustment
  - plan_evt_copay
  overwrite:
  - base_policy: plan_evt_claim_adjustment
    superseded_clause: An adjustment reverses the whole member cost share of one original claim identified by its
      claim number and is booked with a new adjustment claim number whose related_claim_number is the original claim
      number.
    replaced_by: The office-visit re-rating is booked as one adjustment entry that names the most recently serviced
      office-visit claim of the member's primary care providers as its original claim and carries the office-visit
      reversal as a negative member cost share.
  - base_policy: plan_evt_claim_adjustment
    superseded_clause: 'Valid adjustment reasons are recorded in denial_code: not_eligible_on_service_date when
      coverage is found not to have been in force on the service date, duplicate_claim when the same service was
      booked twice, and not_covered when the service is reclassified as non-covered; a reason outside these is not
      an adjustment and cannot be booked.'
    replaced_by: A re-rating adjustment of office visits carries the reason code none, because it lowers copays
      and reverses no service.
  - base_policy: plan_evt_copay
    superseded_clause: Each paid claim is assessed the copay the member's category sets for the claim's service_category,
      once per claim, with no copay on denied claims.
    replaced_by: A re-rated sick or follow-up visit carries the re-rated copay this rule sets in place of the copay
      the category schedule sets for its service category.
  trigger: state_due
  subject:
  - plan_claim_adjusted
  computes: reversal_amount
  target_tool: book_office_visit_rerating_0e97c2c0
  params:
    office_rerating_window_months: 12
    telehealth_sick_medical_home_usd: 1.0
    telehealth_sick_other_usd: 2.5
    same_day_sick_medical_home_usd: 0.0
    same_day_sick_other_usd: 2.5
    vaccine_day_medical_home_usd: 0.0
    vaccine_day_other_usd: 1.5
    medication_check_medical_home_usd: 1.0
    medication_check_other_usd: 3.0
    coordinated_followup_reached_usd: 0.0
    coordinated_followup_unreached_usd: 1.0
    half_up_guard: 1.0e-06
  rule: 'Office visits the member''s primary care providers bill under the primary care visit copay category are
    re-rated when the primary care visit record shows them to be preventive or coordinated care. The office re-rating
    window is the office re-rating window months counted back from the review date, a date counting when it lies
    fewer than that many whole months before the review date. The office-visit reversal returns the category''s
    primary care visit copay booked on every well-child visit any of the member''s primary care visit logs records
    in the window, because well-child care is preventive care and carries no copay, and adds for each other re-rated
    visit that copay less its re-rated copay; the reversal is rounded half up to the cent. An office visit that
    is not a well-child visit keeps the copay booked on it unless a rule below re-rates it. Whose visit logs the
    telehealth sick-visit rule reads follows the assignment history: where a previous assignment ended because a
    newer one superseded it, the logs of both the current and the superseded assignment are read over the whole
    window; where a previous assignment ended for any other reason, only the current assignment''s log is read,
    dated within one more than the whole months elapsed since its effective date; otherwise only the current assignment''s
    log is read over the whole window. A sick visit a log that is read records as a telehealth visit re-rates at
    the medical-home telehealth sick-visit copay when the current practice is a Patient-Centered Medical Home Practice
    or Federally Qualified Health Center Home, and at the other-practice telehealth sick-visit copay when it is
    not; with no such telehealth sick visit, nothing is re-rated under this rule. A sick visit the log records on
    the same day as the latest logged well-child visit folds into it and re-rates at the medical-home same-day copay
    or at the other-practice same-day copay by the current practice type; where no sick visit shares that day, nothing
    is re-rated under this rule. A sick visit the log records on the day of the latest vaccine the pharmacy benefit
    dispensed re-rates at the medical-home vaccine-day copay or at the other-practice vaccine-day copay by the current
    practice type; where no sick visit falls on that day, nothing is re-rated under this rule. A sick visit the
    log records on the day of the latest maintenance refill the pharmacy benefit dispensed is a medication check
    and re-rates at the medical-home medication-check copay or at the other-practice medication-check copay by the
    current practice type; where no sick visit falls on that day, nothing is re-rated under this rule. An in-person
    follow-up office visit re-rates at the reached coordinated follow-up copay where the care team recorded a reached
    transition follow-up call in the window, and at the unreached coordinated follow-up copay where it recorded
    none; with no in-person follow-up logged, nothing is re-rated under this rule. The office-visit re-rating is
    booked as one adjustment entry that names the most recently serviced office-visit claim of the member''s primary
    care providers as its original claim and carries the office-visit reversal as a negative member cost share.
    A re-rating adjustment of office visits carries the reason code none, because it lowers copays and reverses
    no service. A re-rated sick or follow-up visit carries the re-rated copay this rule sets in place of the copay
    the category schedule sets for its service category.'
  prerequisite: []
  cross_category:
  - category: pcp
    as: branch
    reads:
    - pcp_assignment_id
    - status
    - end_reason
    - effective_date
    - variant_name
    - pcp_visits.visit_type
    - pcp_visits.visit_mode
    - pcp_visits.visit_date
    note: The log-scope, telehealth, same-day and medication-check factors read the PCP assignments and visit logs.
  - category: rx
    as: history
    reads:
    - rx_fills.copay_exempt_class
    - rx_fills.fill_type
    - rx_fills.fill_date
    note: The vaccine-day and medication-check factors read the latest vaccine and maintenance refill dates.
  - category: care
    as: history
    reads:
    - care_activities.event_type
    - care_activities.attempt_outcome
    note: The coordinated follow-up factor counts reached transition follow-up calls.
  compute:
  - owin: K('office_rerating_window_months')
  - office_copay: P('copay_pcp_visit_usd')
  - well_visits: XCOUNT('pcp', 'pcp_visits', within_months=owin, date_field='visit_date', visit_type='well_visit')
  - medical_home_practice: (EXISTS('pcp', status='active', variant_name='Patient-Centered Medical Home Practice')
      or EXISTS('pcp', status='active', variant_name='Federally Qualified Health Center Home'))
  - cur_aid: CFIELD('pcp', 'pcp_assignment_id', status='active')
  - sup_aid: CFIELD('pcp', 'pcp_assignment_id', status='ended', end_reason='superseded')
  - cur_tele_sick: XCOUNT('pcp', 'pcp_visits', within_months=owin, date_field='visit_date', visit_type='sick_visit',
      visit_mode='telehealth', pcp_assignment_id=cur_aid)
  - sup_tele_sick: XCOUNT('pcp', 'pcp_visits', within_months=owin, date_field='visit_date', visit_type='sick_visit',
      visit_mode='telehealth', pcp_assignment_id=sup_aid)
  - cur_from: (MONTHS(CFIELD('pcp', 'effective_date', status='active'), NOW) + 1 if EXISTS('pcp', status='active')
      else owin)
  - tele_sick: (cur_tele_sick + sup_tele_sick if EXISTS('pcp', status='ended', end_reason='superseded') else (XCOUNT('pcp',
      'pcp_visits', within_months=cur_from, date_field='visit_date', visit_type='sick_visit', visit_mode='telehealth',
      pcp_assignment_id=cur_aid) if EXISTS('pcp', status='ended') and not EXISTS('pcp', status='ended', end_reason='superseded')
      else cur_tele_sick))
  - tele_sick_copay: (K('telehealth_sick_medical_home_usd') if tele_sick >= 1 and medical_home_practice else (K('telehealth_sick_other_usd')
      if tele_sick >= 1 and not medical_home_practice else office_copay))
  - latest_well_day: XLATEST('pcp', 'pcp_visits', 'visit_date', date_field='visit_date', visit_type='well_visit')
  - same_day_sick: XCOUNT('pcp', 'pcp_visits', visit_type='sick_visit', visit_date=latest_well_day)
  - same_day_copay: (K('same_day_sick_medical_home_usd') if same_day_sick >= 1 and medical_home_practice else (K('same_day_sick_other_usd')
      if same_day_sick >= 1 and not medical_home_practice else office_copay))
  - latest_vaccine_day: XLATEST('rx', 'rx_fills', 'fill_date', date_field='fill_date', event_type='rx_fill', copay_exempt_class='vaccines')
  - vaccine_day_sick: XCOUNT('pcp', 'pcp_visits', visit_type='sick_visit', visit_date=latest_vaccine_day)
  - vaccine_day_copay: (K('vaccine_day_medical_home_usd') if vaccine_day_sick >= 1 and medical_home_practice else
      (K('vaccine_day_other_usd') if vaccine_day_sick >= 1 and not medical_home_practice else office_copay))
  - latest_refill_day: XLATEST('rx', 'rx_fills', 'fill_date', date_field='fill_date', event_type='rx_fill', fill_type='refill')
  - refill_day_sick: XCOUNT('pcp', 'pcp_visits', visit_type='sick_visit', visit_date=latest_refill_day)
  - refill_day_copay: (K('medication_check_medical_home_usd') if refill_day_sick >= 1 and medical_home_practice
      else (K('medication_check_other_usd') if refill_day_sick >= 1 and not medical_home_practice else office_copay))
  - office_followups: XCOUNT('pcp', 'pcp_visits', within_months=owin, date_field='visit_date', visit_type='follow_up',
      visit_mode='in_person')
  - reached_transition_calls: XCOUNT('care', 'care_activities', within_months=owin, date_field='activity_date',
      event_type='care_transition_followup', attempt_outcome='reached')
  - followup_copay: (K('coordinated_followup_reached_usd') if office_followups >= 1 and reached_transition_calls
      >= 1 else (K('coordinated_followup_unreached_usd') if office_followups >= 1 and reached_transition_calls ==
      0 else office_copay))
  - result: RND(well_visits * office_copay + tele_sick * (office_copay - tele_sick_copay) + same_day_sick * (office_copay
      - same_day_copay) + vaccine_day_sick * (office_copay - vaccine_day_copay) + refill_day_sick * (office_copay
      - refill_day_copay) + office_followups * (office_copay - followup_copay) + K('half_up_guard'), 2)
  compute_basis:
    owin: The office re-rating window is the office re-rating window months counted back from the review date, a
      date counting when it lies fewer than that many whole months before the review date.
    office_copay: The office-visit reversal returns the category's primary care visit copay booked on every well-child
      visit any of the member's primary care visit logs records in the window, because well-child care is preventive
      care and carries no copay, and adds for each other re-rated visit that copay less its re-rated copay; the
      reversal is rounded half up to the cent.
    well_visits: The office-visit reversal returns the category's primary care visit copay booked on every well-child
      visit any of the member's primary care visit logs records in the window, because well-child care is preventive
      care and carries no copay, and adds for each other re-rated visit that copay less its re-rated copay; the
      reversal is rounded half up to the cent.
    medical_home_practice: when the current practice is a Patient-Centered Medical Home Practice or Federally Qualified
      Health Center Home
    cur_aid: only the current assignment's log is read over the whole window
    sup_aid: the logs of both the current and the superseded assignment are read over the whole window
    cur_tele_sick: only the current assignment's log is read over the whole window
    sup_tele_sick: the logs of both the current and the superseded assignment are read over the whole window
    cur_from: only the current assignment's log is read, dated within one more than the whole months elapsed since
      its effective date
    tele_sick: 'Whose visit logs the telehealth sick-visit rule reads follows the assignment history: where a previous
      assignment ended because a newer one superseded it, the logs of both the current and the superseded assignment
      are read over the whole window; where a previous assignment ended for any other reason, only the current assignment''s
      log is read, dated within one more than the whole months elapsed since its effective date; otherwise only
      the current assignment''s log is read over the whole window.'
    tele_sick_copay: A sick visit a log that is read records as a telehealth visit re-rates at the medical-home
      telehealth sick-visit copay when the current practice is a Patient-Centered Medical Home Practice or Federally
      Qualified Health Center Home, and at the other-practice telehealth sick-visit copay when it is not; with no
      such telehealth sick visit, nothing is re-rated under this rule.
    latest_well_day: on the same day as the latest logged well-child visit
    same_day_sick: A sick visit the log records on the same day as the latest logged well-child visit folds into
      it
    same_day_copay: A sick visit the log records on the same day as the latest logged well-child visit folds into
      it and re-rates at the medical-home same-day copay or at the other-practice same-day copay by the current
      practice type; where no sick visit shares that day, nothing is re-rated under this rule.
    latest_vaccine_day: on the day of the latest vaccine the pharmacy benefit dispensed
    vaccine_day_sick: A sick visit the log records on the day of the latest vaccine the pharmacy benefit dispensed
    vaccine_day_copay: A sick visit the log records on the day of the latest vaccine the pharmacy benefit dispensed
      re-rates at the medical-home vaccine-day copay or at the other-practice vaccine-day copay by the current practice
      type; where no sick visit falls on that day, nothing is re-rated under this rule.
    latest_refill_day: on the day of the latest maintenance refill the pharmacy benefit dispensed
    refill_day_sick: A sick visit the log records on the day of the latest maintenance refill the pharmacy benefit
      dispensed is a medication check
    refill_day_copay: A sick visit the log records on the day of the latest maintenance refill the pharmacy benefit
      dispensed is a medication check and re-rates at the medical-home medication-check copay or at the other-practice
      medication-check copay by the current practice type; where no sick visit falls on that day, nothing is re-rated
      under this rule.
    office_followups: An in-person follow-up office visit
    reached_transition_calls: where the care team recorded a reached transition follow-up call in the window
    followup_copay: An in-person follow-up office visit re-rates at the reached coordinated follow-up copay where
      the care team recorded a reached transition follow-up call in the window, and at the unreached coordinated
      follow-up copay where it recorded none; with no in-person follow-up logged, nothing is re-rated under this
      rule.
    result: The office-visit reversal returns the category's primary care visit copay booked on every well-child
      visit any of the member's primary care visit logs records in the window, because well-child care is preventive
      care and carries no copay, and adds for each other re-rated visit that copay less its re-rated copay; the
      reversal is rounded half up to the cent.
  factors:
