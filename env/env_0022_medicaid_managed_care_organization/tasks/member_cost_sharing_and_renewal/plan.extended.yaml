      field: amount
      within_months: 12
      filters:
        event_type: plan_premium_paid
    - table: plan_claims
      aggregate: count
      field: plan_claim_id
      within_months: 12
      filters:
        service_category: inpatient_stay
    - category: rx
      table: rx_fills
