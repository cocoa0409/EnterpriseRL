      date counting when it lies fewer than that many whole months before the review date. The office-visit reversal
      returns the category's primary care visit copay booked on every well-child visit any of the member's primary
      care visit logs records in the window, because well-child care is preventive care and carries no copay, and
      adds for each other re-rated visit that copay less its re-rated copay; the reversal is rounded half up to
      the cent. An office visit that is not a well-child visit keeps the copay booked on it unless a rule below
