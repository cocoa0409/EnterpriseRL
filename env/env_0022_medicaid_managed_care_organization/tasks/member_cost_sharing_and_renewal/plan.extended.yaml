    - when: otherwise
      value: '0'
    baseline:
      travel_credit: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: ride
  baseline:
    rule: The counting window is the number of months in the category's cap period counted back from the review
      date, a date counting when it lies fewer than that many whole months before the review date. The counted total
      is the member copays on medical claims whose service date falls in the counting window, net of any adjustment
      entries against those claims, plus the over-cap refunds already booked in the counting window and the pharmacy
      copays on fills and fill reversals dated in the counting window. The member's cap is the monthly household
      income on file times the category's cap-period months times the category's cap percent, divided by one hundred
      and rounded half up to the cent. The over-cap refund is the counted total less the cap, never below zero,
      rounded half up to the cent.
    params:
    - cost_share_cap_period_months
    - cost_share_cap_pct_income
  inputs:
    history:
    - table: plan_claims
      aggregate: sum
