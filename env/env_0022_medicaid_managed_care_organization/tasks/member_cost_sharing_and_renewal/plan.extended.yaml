  params:
    per_tier:
      Prairie Ridge Expansion Adult:
        cap_pct: =cost_share_cap_pct_income
        period_months: =cost_share_cap_period_months
        refund_days: =cost_share_refund_days
        includes_rx: =cost_share_cap_includes_rx
      Prairie Ridge Family Care:
        cap_pct: =cost_share_cap_pct_income
        period_months: =cost_share_cap_period_months
        refund_days: =cost_share_refund_days
        includes_rx: =cost_share_cap_includes_rx
      Prairie Ridge CHIP Kids:
        cap_pct: =cost_share_cap_pct_income
        period_months: =cost_share_cap_period_months
        refund_days: =cost_share_refund_days
        includes_rx: =cost_share_cap_includes_rx
      Prairie Ridge Children's Medicaid:
        cap_pct: =cost_share_cap_pct_income
        period_months: =cost_share_cap_period_months
        refund_days: =cost_share_refund_days
        includes_rx: =cost_share_cap_includes_rx
      Prairie Ridge Pregnancy Care:
        cap_pct: =cost_share_cap_pct_income
        period_months: =cost_share_cap_period_months
        refund_days: =cost_share_refund_days
        includes_rx: =cost_share_cap_includes_rx
      Prairie Ridge ABD Care:
        cap_pct: =cost_share_cap_pct_income
        period_months: =cost_share_cap_period_months
        refund_days: =cost_share_refund_days
