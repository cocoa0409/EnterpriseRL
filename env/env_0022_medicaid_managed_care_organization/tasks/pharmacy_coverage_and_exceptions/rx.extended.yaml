- id: rx_exception_review
  subject:
  - rx_exception_request
  - rx_exception_approved
  - rx_exception_denied
  rule: >-
    A prior authorization, formulary exception, quantity limit exception, step therapy exception or brand-medically-necessary
    request is decided within pa_decision_hours of receipt of the complete request, and the member may
    start one by phone where member_can_initiate_exception. A request is complete only when the prescriber's
    supporting statement has been received, and a brand-medically-necessary request also needs a submitted
    FDA MedWatch form. A step therapy exception is approved only when step_therapy_trials_required preferred
    alternatives were filled within step_therapy_lookback_days and failed or are contraindicated. A new
    request is not opened for a drug while the member has an undecided request of the same request_type
    for the same drug. An approval lasts exception_approval_months (quantity_limit_exception_months for
    a quantity limit) from the decision date, and a denial is mailed within exception_denial_notice_business_days
    with the member's appeal rights.
  eligibility:
  - id: one_open_request
    applies_to:
    - rx_exception_request
    kind: dedup
    condition: >-
      A new request is not opened for a drug while the member has an undecided request of the same request_type
      for the same drug.
    evidence_fields:
    - rx_exceptions.drug_name
    - rx_exceptions.request_type
    - rx_exceptions.event_type
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_exceptions.drug_name
        - rx_exceptions.request_type
      action_bindings:
        rx_exceptions.drug_name: drug_name
        rx_exceptions.request_type: request_type
    dedup_contract:
      table: rx_exceptions
      mode: separate_record
      object_bindings:
        drug_name: drug_name
        request_type: request_type
      duplicate_filters:
