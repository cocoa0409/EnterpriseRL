- id: rx_dual_wrap
  subject:
  - rx_fill
  - rx_fill_rejected
  rule: >-
    For a PrairieRx Dual Wrap member Medicare Part D pays first: a drug Part D covers is rejected with
    reject_code not_covered_medicare_part_d, and only drugs Part D excludes, such as covered OTC drugs
    and prescription vitamins, are paid by Medicaid. Part D premiums and copays are never paid from the
    pharmacy benefit.
  eligibility: []
  params:
    per_tier:
      PrairieRx Dual Wrap:
        part_d_primary: =part_d_primary
      PrairieRx Expansion Adult:
        part_d_primary: =part_d_primary
      PrairieRx Adult:
        part_d_primary: =part_d_primary
      PrairieRx Children:
        part_d_primary: =part_d_primary
      PrairieRx Maternity:
        part_d_primary: =part_d_primary
      PrairieRx Complex Care:
        part_d_primary: =part_d_primary
      PrairieRx Long-Term Care:
        part_d_primary: =part_d_primary
- id: rx_opioid_safety
  subject:
  - rx_fill
  - rx_fill_rejected
  rule: >-
    An opioid fill whose daily MME exceeds mme_daily_limit, or a first opioid fill beyond opioid_naive_initial_days_supply
    for a member with no opioid fill in the prior 90 days, rejects with reject_code prior_authorization_required
    until approved. Members in hospice or with an active cancer diagnosis on the prescription are exempt;
    naloxone always pays with no copay. Specialty drugs are filled only at the designated specialty pharmacy
    where specialty_pharmacy_required.
