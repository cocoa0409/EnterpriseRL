events:
- type: rx_enroll
  target: rx_coverages
  mutation: create
  meaning: The member's pharmacy benefit plan is opened with the plan membership.
  grain: One row per pharmacy coverage spell.
  fields:
    membership_id: Plan membership.
    variant_name: Pharmacy benefit plan.
    effective_date: First day of pharmacy coverage.
  triggers: []
- type: rx_activate
  target: rx_coverages
  mutation:
    transition:
      from: pending
      to: active
  meaning: The pharmacy coverage becomes effective.
  grain: One transition per spell.
  fields:
    effective_date: Effective date.
  triggers: []
- type: rx_lock_in_start
  target: rx_coverages
  mutation:
    transition:
      from: active
      to: restricted
  meaning: The member is locked in to one pharmacy and one prescriber.
  grain: One transition per lock-in.
  fields:
    lock_in_pharmacy_npi: Lock-in pharmacy.
    lock_in_prescriber_npi: Lock-in prescriber of controlled substances.
    lock_in_start_date: First lock-in day.
    lock_in_end_date: Last lock-in day.
  triggers: []
- type: rx_lock_in_end
  target: rx_coverages
  mutation:
    transition:
      from: restricted
      to: active
  meaning: The lock-in ends.
  grain: One transition per lock-in.
  fields:
    lock_in_end_date: Actual last lock-in day.
  triggers: []
- type: rx_lock_in_pharmacy_change
  target: rx_coverages
  mutation: update
  meaning: The member's lock-in pharmacy is changed.
  grain: One update per change.
  fields:
    lock_in_pharmacy_npi: New lock-in pharmacy.
  triggers:
  - event: rx:rx_lock_in_change_log
    map:
      request_type: lock_in_pharmacy_change
- type: rx_terminate
  target: rx_coverages
  mutation:
    transition:
    - from: pending
      to: terminated
    - from: active
      to: terminated
    - from: restricted
      to: terminated
  meaning: The pharmacy coverage ends.
  grain: One transition per spell.
  fields:
    end_date: Last day of coverage.
    end_reason: Controlled reason.
  triggers:
  - event: rx:rx_otc_forfeit
    map:
      order_channel: not_applicable
      posted_date: end_date
- type: rx_fill
  target: rx_fills
  meaning: A pharmacy claim pays and the member's copay is assessed.
  grain: One row per paid fill.
  distinguish_by:
  - rx_number
  - fill_date
  fields:
    rx_number: Prescription number.
    fill_date: Date filled.
    ndc: NDC dispensed.
    drug_name: Drug name and strength.
    controlled_schedule: DEA schedule.
    formulary_status: Formulary status.
    days_supply: Days supply.
    quantity: Quantity dispensed.
    pharmacy_npi: Dispensing pharmacy.
    prescriber_npi: Prescriber.
    fill_type: Kind of fill.
    member_copay: Copay assessed.
    plan_paid_amount: Amount paid.
    copay_exempt_class: Exempt drug class if any.
    exception_number: Exception the fill was paid under, if any.
  account: rx_cost_share
  direction: in
  triggers: []
- type: rx_fill_reversal
  target: rx_fills
  meaning: The pharmacy reverses a paid fill and the copay is reversed.
  grain: One row per reversed fill.
  distinguish_by:
  - rx_number
  - fill_date
  fields:
    rx_number: Prescription number of the reversed fill.
    fill_date: Fill date of the reversed fill.
    member_copay: Negative of the copay reversed.
    reversal_date: Date reversed.
  account: rx_cost_share
  direction: out
  triggers: []
- type: rx_fill_rejected
  target: rx_fills
  meaning: A pharmacy claim is rejected at the counter.
  grain: One row per rejection.
  distinguish_by:
  - rx_number
  - fill_date
  - reject_code
  fields:
    rx_number: Prescription number.
    fill_date: Date attempted.
    ndc: NDC.
    drug_name: Drug.
    pharmacy_npi: Pharmacy.
    prescriber_npi: Prescriber.
    reject_code: Controlled reject reason.
  triggers: []
- type: rx_emergency_supply
  target: rx_fills
  meaning: An emergency supply is dispensed while a request is pending.
  grain: One row per emergency supply.
  distinguish_by:
  - rx_number
  - fill_date
  fields:
    rx_number: Prescription number.
    fill_date: Date dispensed.
    ndc: NDC.
    drug_name: Drug.
    days_supply: Days supply.
    pharmacy_npi: Pharmacy.
    exception_number: Pending request it bridges.
  triggers: []
- type: rx_exception_request
  target: rx_exceptions
  meaning: A prior authorization or formulary exception request is received.
  grain: One row per request.
  distinguish_by:
  - exception_number
  fields:
    exception_number: Request number.
    request_type: Kind of request.
    drug_name: Drug.
    ndc: NDC.
    requested_by: Who started it.
    prescriber_statement_received: Whether the prescriber statement is in.
    event_date: Date received.
  triggers: []
- type: rx_exception_approved
  target: rx_exceptions
  meaning: An exception or prior authorization is approved.
  grain: One row per approval.
  distinguish_by:
  - exception_number
  fields:
    exception_number: Request number.
    request_type: Kind of request.
    event_date: Decision date.
    approved_through: Last day the approval lasts.
  triggers: []
- type: rx_exception_denied
  target: rx_exceptions
  meaning: An exception or prior authorization is denied.
  grain: One row per denial.
  distinguish_by:
  - exception_number
  fields:
    exception_number: Request number.
    request_type: Kind of request.
    event_date: Decision date.
    denial_reason: Controlled denial reason.
  triggers: []
- type: rx_refill_override
  target: rx_exceptions
  meaning: An early refill override is granted for vacation or a lost or stolen supply.
  grain: One row per override.
  distinguish_by:
  - request_type
  - rx_number
  - event_date
  fields:
    request_type: vacation_override or lost_stolen_override.
    rx_number: Prescription number.
    drug_name: Drug.
    event_date: Date granted.
    police_report_number: Police report number for a controlled substance.
  triggers: []
- type: rx_lock_in_change_log
  target: rx_exceptions
  meaning: A change of lock-in pharmacy is logged with its reason.
  grain: One row per lock-in pharmacy change.
  distinguish_by:
  - event_date
  - lock_in_change_reason
  fields:
    request_type: Always lock_in_pharmacy_change.
    event_date: Date of the change.
    lock_in_change_reason: Why the pharmacy was changed.
    requested_by: Who asked.
  triggers: []
- type: rx_otc_load
  target: rx_otc_ledger
  meaning: The quarterly OTC allowance is loaded.
  grain: One row per quarter.
  distinguish_by:
  - benefit_quarter
  fields:
    benefit_quarter: Quarter loaded.
    amount: Amount loaded.
    posted_date: Date loaded.
  account: otc_allowance
  direction: in
  triggers: []
- type: rx_otc_purchase
  target: rx_otc_ledger
  meaning: OTC items are bought with the allowance.
  grain: One row per order.
  distinguish_by:
  - order_number
  fields:
    benefit_quarter: Quarter charged.
    amount: Amount spent.
    order_channel: Where bought.
    order_number: Order or receipt number.
    posted_date: Date posted.
  account: otc_allowance
  direction: out
  triggers: []
- type: rx_otc_forfeit
  target: rx_otc_ledger
  meaning: Unused allowance is forfeited at quarter end or when coverage ends.
  grain: One row per forfeited quarter.
  distinguish_by:
  - benefit_quarter
  fields:
    benefit_quarter: Quarter forfeited.
    amount: Amount forfeited.
    order_channel: Always not_applicable.
    posted_date: Date forfeited.
  account: otc_allowance
  direction: out
  triggers: []
measures:
- id: rx_msr_month_fills
  window: Calendar month of the fill date.
  measure: >-
    Count of rx_fill rows on the coverage in the month, minus reversed fills, excluding fills with a copay_exempt_class
    other than none and, where monthly_limit_scope is brand_only, excluding preferred_generic fills.
- id: rx_msr_overrides_365d
  window: Rolling 365 calendar days ending on the request date, inclusive.
  measure: >-
    Count of rx_refill_override rows on the coverage for the same drug_name and the same request_type
    in the window.
- id: rx_msr_otc_orders_quarter
  window: Calendar quarter of the order.
  measure: >-
    Count of rx_otc_purchase rows on the coverage in the quarter with order_channel mail_catalog or online.
- id: rx_msr_lock_in_changes_365d
  window: Rolling 365 calendar days ending on the request date, inclusive.
  measure: >-
    Count of rx_lock_in_change_log rows on the coverage with lock_in_change_reason = member_preference
    and event_date in the window.
policies:
- id: rx_agg_multi_holding
  subject:
  - rx_enroll
  rule: >-
    A member holds one pharmacy benefit plan at a time. A new pharmacy coverage is opened only when the
    member has no other coverage in pending, active or restricted status. A change of plan eligibility
    category ends the old pharmacy coverage the day before and opens the new one the same day.
  eligibility:
  - id: one_open_rx
    applies_to:
    - rx_enroll
    kind: dedup
    condition: >-
      A new pharmacy coverage is opened only when the member has no other coverage in pending, active
      or restricted status.
    evidence_fields:
    - rx_coverages.customer_id
    - rx_coverages.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_coverages.customer_id
      action_bindings:
        rx_coverages.customer_id: customer_id
    dedup_contract:
      table: rx_coverages
      mode: separate_record
      object_bindings:
        customer_id: customer_id
      duplicate_filters:
        status:
        - pending
        - active
        - restricted
      distinct_fields:
      - effective_date
  params:
    max_per_customer: 1
- id: rx_benefit_plan_match
  subject:
  - rx_enroll
  rule: >-
    The pharmacy benefit plan follows the member's plan eligibility category through plan_category_map.
    Holding an active LTSS Service Coordination care enrollment with a nursing facility residence overrides
    the map: such a member holds PrairieRx Long-Term Care, except that a Prairie Ridge Dual Complete member
    always holds PrairieRx Dual Wrap because Part D pays first. Holding PrairieRx Dual Wrap and any other
    pharmacy plan at the same time is impossible; the two are mutually exclusive.
  eligibility: []
  params:
    per_tier:
      PrairieRx Dual Wrap:
        categories: =plan_category_map
        part_d_primary: =part_d_primary
      PrairieRx Expansion Adult:
        categories: =plan_category_map
        part_d_primary: =part_d_primary
      PrairieRx Adult:
        categories: =plan_category_map
        part_d_primary: =part_d_primary
      PrairieRx Children:
        categories: =plan_category_map
        part_d_primary: =part_d_primary
      PrairieRx Maternity:
        categories: =plan_category_map
        part_d_primary: =part_d_primary
      PrairieRx Complex Care:
        categories: =plan_category_map
        part_d_primary: =part_d_primary
      PrairieRx Long-Term Care:
        categories: =plan_category_map
        part_d_primary: =part_d_primary
- id: rx_evt_copay
  subject:
  - rx_fill
  - rx_fill_reversal
  rule: >-
    Each paid fill carries the copay the pharmacy plan sets for its formulary_status, once per fill, and
    nothing on a fill whose copay_exempt_class is not none. An emergency supply and a transition fill
    carry no copay. The copay is never larger than the plan_paid_amount, it counts toward the member's
    aggregate cost-sharing cap under plan_evt_cost_share_cap, and once the cap is reached pharmacy fills
    in the same period carry no copay. A reversal returns exactly the copay of the fill it reverses.
  eligibility: []
  params:
    per_tier:
      PrairieRx Dual Wrap:
        generic: =copay_generic_usd
        preferred_brand: =copay_preferred_brand_usd
        non_preferred: =copay_nonpreferred_usd
        specialty: =copay_specialty_usd
        otc_covered: =copay_otc_covered_usd
        exempt: =copay_exempt_drug_classes
      PrairieRx Expansion Adult:
        generic: =copay_generic_usd
        preferred_brand: =copay_preferred_brand_usd
        non_preferred: =copay_nonpreferred_usd
        specialty: =copay_specialty_usd
        otc_covered: =copay_otc_covered_usd
        exempt: =copay_exempt_drug_classes
      PrairieRx Adult:
        generic: =copay_generic_usd
        preferred_brand: =copay_preferred_brand_usd
        non_preferred: =copay_nonpreferred_usd
        specialty: =copay_specialty_usd
        otc_covered: =copay_otc_covered_usd
        exempt: =copay_exempt_drug_classes
      PrairieRx Children:
        generic: =copay_generic_usd
        preferred_brand: =copay_preferred_brand_usd
        non_preferred: =copay_nonpreferred_usd
        specialty: =copay_specialty_usd
        otc_covered: =copay_otc_covered_usd
        exempt: =copay_exempt_drug_classes
      PrairieRx Maternity:
        generic: =copay_generic_usd
        preferred_brand: =copay_preferred_brand_usd
        non_preferred: =copay_nonpreferred_usd
        specialty: =copay_specialty_usd
        otc_covered: =copay_otc_covered_usd
        exempt: =copay_exempt_drug_classes
      PrairieRx Complex Care:
        generic: =copay_generic_usd
        preferred_brand: =copay_preferred_brand_usd
        non_preferred: =copay_nonpreferred_usd
        specialty: =copay_specialty_usd
        otc_covered: =copay_otc_covered_usd
        exempt: =copay_exempt_drug_classes
      PrairieRx Long-Term Care:
        generic: =copay_generic_usd
        preferred_brand: =copay_preferred_brand_usd
        non_preferred: =copay_nonpreferred_usd
        specialty: =copay_specialty_usd
        otc_covered: =copay_otc_covered_usd
        exempt: =copay_exempt_drug_classes
  formula:
    when_not: copay_exempt_class != "none" or fill_type in ("emergency_supply", "transition_fill")
    scheduled_copay: >-
      copay_generic_usd if formulary_status == "preferred_generic" else (copay_preferred_brand_usd if
      formulary_status == "preferred_brand" else (copay_specialty_usd if formulary_status == "specialty"
      else (copay_otc_covered_usd if formulary_status == "otc_covered" else copay_nonpreferred_usd)))
    member_copay: min(scheduled_copay, plan_paid_amount)
- id: rx_monthly_limit
  subject:
  - rx_fill
  - rx_fill_rejected
  rule: >-
    Where monthly_rx_limit_applies, a fill beyond monthly_rx_limit paid fills in the calendar month (rx_msr_month_fills)
    is rejected with reject_code monthly_limit_reached. Fills of exempt classes never count, and where
    monthly_limit_scope is brand_only generic fills never count. A fill approved through a quantity_limit_exception
    for the monthly cap pays beyond the cap for the drug named in the exception until its approved_through
    date.
