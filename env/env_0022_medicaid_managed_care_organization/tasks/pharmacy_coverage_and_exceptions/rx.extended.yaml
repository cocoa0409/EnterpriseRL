  params:
    per_tier:
      PrairieRx Dual Wrap:
        mme: =mme_daily_limit
        naive_days: =opioid_naive_initial_days_supply
        specialty: =specialty_pharmacy_required
      PrairieRx Expansion Adult:
        mme: =mme_daily_limit
        naive_days: =opioid_naive_initial_days_supply
        specialty: =specialty_pharmacy_required
      PrairieRx Adult:
        mme: =mme_daily_limit
        naive_days: =opioid_naive_initial_days_supply
        specialty: =specialty_pharmacy_required
      PrairieRx Children:
