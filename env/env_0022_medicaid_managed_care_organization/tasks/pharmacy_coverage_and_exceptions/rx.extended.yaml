- id: rx_fill_reversal_rule
  subject:
  - rx_fill_reversal
  rule: >-
    A pharmacy may reverse a paid fill identified by its rx_number and fill_date, and the reversal returns
    the fill's copay and removes the fill from the monthly count. A reversal is accepted no later than
    reversal_window_days after the original fill date. The reversal days are counted in calendar days
    from the day after the fill date, and a reversal on the last day still qualifies. A fill is reversed
    at most once.
  eligibility:
  - id: reversal_window
    applies_to:
    - rx_fill_reversal
    kind: time
    condition: A reversal is accepted no later than reversal_window_days after the original fill date.
    evidence_fields:
    - rx_fills.rx_number
    - rx_fills.fill_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - rx_fills.rx_number
        - rx_fills.fill_date
      action_bindings:
        rx_fills.rx_number: rx_number
        rx_fills.fill_date: fill_date
    temporal_basis:
      clock: frozen_time
      anchor_event: the original fill date
      anchor_source: rx_fills.fill_date
      relation: not_after
      duration_source: variants.reversal_window_days
      unit: calendar_days
      counting_rule: >-
        The reversal days are counted in calendar days from the day after the fill date, and a reversal
        on the last day still qualifies.
      boundary: inclusive
  params:
    per_tier:
      PrairieRx Dual Wrap:
        window: =reversal_window_days
      PrairieRx Expansion Adult:
        window: =reversal_window_days
      PrairieRx Adult:
        window: =reversal_window_days
      PrairieRx Children:
        window: =reversal_window_days
      PrairieRx Maternity:
        window: =reversal_window_days
      PrairieRx Complex Care:
        window: =reversal_window_days
      PrairieRx Long-Term Care:
        window: =reversal_window_days
- id: rx_coverage_lifecycle
  subject:
  - rx_activate
  - rx_terminate
  rule: >-
    Pharmacy coverage becomes effective on the plan membership's coverage start date and ends on the membership's
    termination date or the day before a new pharmacy plan starts after a category change. When coverage
    ends, the unused OTC allowance is forfeited the same day and approved exceptions end with the coverage.
  eligibility: []
extended_policies:
  - id: rx_ext_otc_quarter_forfeit
    base_policy_refs: [rx_otc_allowance]
    overwrite:
    - base_policy: rx_otc_allowance
      superseded_clause: >-
        Unused allowance is forfeited on the last day of the quarter or on the coverage end date, whichever
        comes first, and never rolls over where otc_rollover is false.
      replaced_by: >-
        The closed-quarter forfeiture is the quarter's unused allowance less the retained carry-over, and
        the retained carry-over stays on the allowance balance into the next quarter.
    trigger: state_due
    subject: [rx_otc_forfeit]
    computes: forfeit_amount
    target_tool: forfeit_otc_quarter_0e0fa26e
    params:
      share_engaged: 0.5
      share_partial: 0.25
      visits_engaged: 4
      visits_partial: 2
      usage_full: 0.75
      usage_part: 0.5
      multiplier_part: 0.5
      ceiling_long: 6.0
      ceiling_short: 3.0
      months_long: 6
      months_short: 3
    rule: >-
      Once a benefit quarter has closed, its unused over-the-counter allowance is settled by one forfeiture
      entry tagged to that quarter. The closed quarter is the benefit quarter of the latest allowance load
      on the coverage. The quarter's unused allowance is the amount loaded for the closed quarter less every
      purchase tagged to the closed quarter, never below zero. The standard closed-quarter forfeiture is the
      whole unused allowance of the closed quarter, and nothing of it is carried into the next quarter.
      The closed-quarter forfeiture is the quarter's unused allowance less the retained carry-over, and the
      retained carry-over stays on the allowance balance into the next quarter. The retained carry-over is
      the carry-over share times the carry-over base times the carry-over usage multiplier, limited first to
      the quarter's unused allowance and then to the carry-over ceiling, and only the closed-quarter
      forfeiture is rounded to the cent. The carry-over share is one half for a member whose active plan
      membership is Prairie Ridge Pregnancy Care and who has at least four paid preventive claims with a
      service date in the six months before the forfeiture is booked; one quarter for a Prairie Ridge
      Pregnancy Care member with at least two but fewer than four such claims; and nothing for any other
      member. The carry-over usage multiplier is one where the purchases tagged to the closed quarter reached
      at least three quarters of the amount loaded for it, one half where they reached at least one half
      but less than three quarters of it, and zero where they reached less than one half of it. The
      carry-over ceiling is six dollars for a coverage whose effective date is six or more whole months
      before the forfeiture is booked, three dollars for a coverage effective at least three but fewer than
      six whole months before, and nothing for a coverage effective fewer than three whole months before.
      The carry-over base is the full amount loaded for the closed quarter where the closed quarter carries
      at least one mail catalog or online order and the coverage is effective six or more whole months
      before the forfeiture is booked; the purchases tagged to the closed quarter where the closed quarter
      carries at least one mail catalog or online order and the coverage is effective fewer than six whole
      months before; and the quarter's unused allowance where the closed quarter carries no mail catalog or
      online order.
    prerequisite: []
    cross_category:
    - category: plan
      as: branch
      reads: [variant_name, status, plan_claims.service_category, plan_claims.service_date, plan_claims.adjudication_status]
      note: The carry-over share reads the member's active eligibility category and her paid preventive claims of the last six months.
    compute:
    - closed_quarter: "LATEST('rx_otc_ledger', 'benefit_quarter', date_field='posted_date', event_type='rx_otc_load')"
    - quarter_loaded: "SUM('rx_otc_ledger', 'amount', event_type='rx_otc_load', benefit_quarter=closed_quarter)"
    - quarter_spent: "SUM('rx_otc_ledger', 'amount', event_type='rx_otc_purchase', benefit_quarter=closed_quarter)"
    - unused_allowance: "MX(0, quarter_loaded - quarter_spent)"
    - plan_category: "CFIELD('plan', 'variant_name', status='active')"
    - preventive_claims: "XCOUNT('plan', 'plan_claims', within_months=6, date_field='service_date', event_type='plan_claim_booked', service_category='preventive', adjudication_status='paid')"
    - carryover_share: "K('share_engaged') if (plan_category == 'Prairie Ridge Pregnancy Care' and preventive_claims >= K('visits_engaged')) else (K('share_partial') if (plan_category == 'Prairie Ridge Pregnancy Care' and preventive_claims >= K('visits_partial') and preventive_claims < K('visits_engaged')) else 0)"
    - usage_ratio: "SUM('rx_otc_ledger', 'amount', event_type='rx_otc_purchase', benefit_quarter=closed_quarter) / quarter_loaded if quarter_loaded > 0 else 0"
    - usage_multiplier: "1 if usage_ratio >= K('usage_full') else (K('multiplier_part') if usage_ratio >= K('usage_part') else 0)"
    - months_effective: "MONTHS(F('effective_date'), NOW)"
    - carryover_ceiling: "K('ceiling_long') if months_effective >= K('months_long') else (K('ceiling_short') if months_effective >= K('months_short') else 0)"
    - remote_orders: "COUNT('rx_otc_ledger', event_type='rx_otc_purchase', benefit_quarter=closed_quarter, order_channel='mail_catalog') + COUNT('rx_otc_ledger', event_type='rx_otc_purchase', benefit_quarter=closed_quarter, order_channel='online')"
    - carryover_base: "quarter_loaded if (remote_orders >= 1 and months_effective >= K('months_long')) else (quarter_spent if (remote_orders >= 1 and months_effective < K('months_long')) else unused_allowance)"
    - retained_carryover: "MN(carryover_ceiling, MN(unused_allowance, carryover_share * carryover_base * usage_multiplier))"
    - result: "RND(unused_allowance - retained_carryover, 2)"
    compute_basis:
      closed_quarter: "The closed quarter is the benefit quarter of the latest allowance load on the coverage."
      quarter_loaded: "The quarter's unused allowance is the amount loaded for the closed quarter less every purchase tagged to the closed quarter, never below zero."
      quarter_spent: "The quarter's unused allowance is the amount loaded for the closed quarter less every purchase tagged to the closed quarter, never below zero."
      unused_allowance: "The quarter's unused allowance is the amount loaded for the closed quarter less every purchase tagged to the closed quarter, never below zero."
      plan_category: "The carry-over share is one half for a member whose active plan membership is Prairie Ridge Pregnancy Care"
      preventive_claims: "who has at least four paid preventive claims with a service date in the six months before the forfeiture is booked"
      carryover_share: "The carry-over share is one half for a member whose active plan membership is Prairie Ridge Pregnancy Care and who has at least four paid preventive claims with a service date in the six months before the forfeiture is booked; one quarter for a Prairie Ridge Pregnancy Care member with at least two but fewer than four such claims; and nothing for any other member."
      usage_ratio: "The carry-over usage multiplier is one where the purchases tagged to the closed quarter reached at least three quarters of the amount loaded for it"
      usage_multiplier: "The carry-over usage multiplier is one where the purchases tagged to the closed quarter reached at least three quarters of the amount loaded for it, one half where they reached at least one half but less than three quarters of it, and zero where they reached less than one half of it."
      months_effective: "The carry-over ceiling is six dollars for a coverage whose effective date is six or more whole months before the forfeiture is booked"
      carryover_ceiling: "The carry-over ceiling is six dollars for a coverage whose effective date is six or more whole months before the forfeiture is booked, three dollars for a coverage effective at least three but fewer than six whole months before, and nothing for a coverage effective fewer than three whole months before."
      remote_orders: "where the closed quarter carries at least one mail catalog or online order"
      carryover_base: "The carry-over base is the full amount loaded for the closed quarter where the closed quarter carries at least one mail catalog or online order and the coverage is effective six or more whole months before the forfeiture is booked; the purchases tagged to the closed quarter where the closed quarter carries at least one mail catalog or online order and the coverage is effective fewer than six whole months before; and the quarter's unused allowance where the closed quarter carries no mail catalog or online order."
      retained_carryover: "The retained carry-over is the carry-over share times the carry-over base times the carry-over usage multiplier, limited first to the quarter's unused allowance and then to the carry-over ceiling, and only the closed-quarter forfeiture is rounded to the cent."
      result: "The closed-quarter forfeiture is the quarter's unused allowance less the retained carry-over, and the retained carry-over stays on the allowance balance into the next quarter."
    factors:
    - id: carryover_share
      effect: parameter
      decides: carryover_share
      bindings: [plan_category, preventive_claims, carryover_share]
      ladder:
      - when: "active plan membership is Prairie Ridge Pregnancy Care and at least four paid preventive claims with a service date in the last six months"
        value: "K('share_engaged') (one half)"
      - when: "active plan membership is Prairie Ridge Pregnancy Care and two or three such claims"
        value: "K('share_partial') (one quarter)"
      - when: "otherwise"
        value: "0 (nothing is carried)"
      baseline:
        carryover_share: "0"
      evidence: [cross_category, history]
      cross_difficulty: plan
    - id: carryover_usage
      effect: parameter
      decides: usage_multiplier
      bindings: [usage_ratio, usage_multiplier]
      ladder:
      - when: "purchases tagged to the closed quarter reached at least three quarters of its load"
        value: "1"
      - when: "they reached at least one half but less than three quarters of it"
        value: "K('multiplier_part') (one half)"
      - when: "otherwise (less than one half)"
        value: "0"
      baseline:
        usage_multiplier: "0"
      evidence: [history]
      cross_difficulty: null
    - id: carryover_ceiling
      effect: parameter
      decides: carryover_ceiling
      bindings: [months_effective, carryover_ceiling]
      ladder:
      - when: "coverage effective six or more whole months before the forfeiture is booked"
        value: "K('ceiling_long') (six dollars)"
      - when: "coverage effective at least three but fewer than six whole months before"
        value: "K('ceiling_short') (three dollars)"
      - when: "otherwise"
        value: "0"
      baseline:
        carryover_ceiling: "0"
      evidence: [date]
      cross_difficulty: null
    - id: carryover_base
      effect: method
      decides: carryover_base
      bindings: [remote_orders, carryover_base]
      ladder:
      - when: "the closed quarter carries at least one mail catalog or online order and the coverage is effective six or more whole months before"
        method: "the share acts on the full amount loaded for the closed quarter"
      - when: "the closed quarter carries at least one mail catalog or online order and the coverage is effective fewer than six whole months before"
        method: "the share acts on the purchases tagged to the closed quarter"
      - when: "otherwise (no mail catalog or online order in the closed quarter)"
        method: "the share acts on the quarter's unused allowance"
      baseline:
        carryover_base: "unused_allowance"
      evidence: [history, date]
      cross_difficulty: null
    baseline:
      rule: >-
        The quarter's unused allowance is the amount loaded for the closed quarter less every purchase
        tagged to the closed quarter, never below zero. The standard closed-quarter forfeiture is the whole
        unused allowance of the closed quarter, and nothing of it is carried into the next quarter.
      params: [otc_quarterly_allowance_usd]
    inputs:
      history:
      - {table: rx_otc_ledger, aggregate: latest, field: benefit_quarter, filters: {event_type: rx_otc_load}}
      - {table: rx_otc_ledger, aggregate: sum, field: amount, filters: {event_type: rx_otc_load}}
      - {table: rx_otc_ledger, aggregate: sum, field: amount, filters: {event_type: rx_otc_purchase}}
      - {table: rx_otc_ledger, aggregate: count, field: rx_otc_id, filters: {event_type: rx_otc_purchase}}
      - {category: plan, table: plan_claims, aggregate: count, field: plan_claim_id, within_months: 6, filters: {event_type: plan_claim_booked, service_category: preventive, adjudication_status: paid}}
      cross_category: [plan]
  - id: rx_ext_otc_quarter_load
    base_policy_refs: [rx_otc_allowance]
    overwrite:
    - base_policy: rx_otc_allowance
      superseded_clause: >-
        The OTC allowance is loaded on the first day of each calendar quarter
      replaced_by: >-
        The quarter load is the plan's quarterly allowance plus the pregnancy supply credit, the income
        supplement, the catalog shipping credit, the late-load credit, the care program credit and the
        closeout credit, and only the quarter load is rounded to the cent.
    trigger: state_due
    subject: [rx_otc_load]
    computes: load_amount
    target_tool: load_otc_quarter_30ec28e6
    params:
      pregnancy_credit_high: 10.0
      pregnancy_credit_low: 5.0
      visits_high: 4
      visits_low: 2
      income_low_pct: 138
      income_mid_pct: 185
      income_credit_low: 7.5
      income_credit_mid: 5.0
      shipping_credit_two: 4.95
      shipping_credit_one: 2.5
      late_days_long: 120
      late_days_short: 92
      late_grace_days: 90
      late_period_days: 15
      late_rate: 0.75
      late_flat: 1.5
      care_credit_maternal: 4.0
      care_credit_healthy: 2.0
      closeout_low_limit: 5.0
      closeout_credit_low: 2.0
      closeout_credit_high: 1.0
    rule: >-
      Each calendar quarter's over-the-counter allowance is booked on the coverage as one load entry tagged
      to that quarter. The quarter load is fixed only after the ledger carries a forfeiture entry for the
      latest quarter loaded before it. The standard quarter load is the plan's quarterly allowance and
      nothing else. The quarter load is the plan's quarterly allowance plus the pregnancy supply credit, the
      income supplement, the catalog shipping credit, the late-load credit, the care program credit and the
      closeout credit, and only the quarter load is rounded to the cent. The pregnancy supply credit is ten
      dollars for a member whose active plan membership is Prairie Ridge Pregnancy Care and who has at least
      four paid preventive claims with a service date in the six months before the load is booked, five
      dollars for a Prairie Ridge Pregnancy Care member with at least two but fewer than four such claims,
      and nothing for any other member. The income supplement is seven dollars fifty for a member whose
      active plan membership records household income at or below 138 percent of the federal poverty level,
      five dollars for income above 138 and at or below 185 percent, and nothing above 185 percent. The
      catalog shipping credit counts the mail catalog and online orders tagged to the previous loaded
      quarter: four dollars ninety-five for two or more such orders, two dollars fifty for exactly one, and
      nothing for none. The late-load credit looks at the calendar days from the posting date of the
      previous load to the day the new load is booked: at 120 days or more the credit accrues seventy-five
      cents for every whole 15 days beyond the first 90 days; from 92 through 119 days it is a flat one
      dollar fifty; below 92 days there is no credit. The care program credit is four dollars for a member
      with an active Maternal Care Management care episode, two dollars for a member with an active Healthy
      Living Support care episode, and nothing otherwise. The closeout credit is two dollars where the
      previous loaded quarter carries a forfeiture entry of at most five dollars, one dollar where it
      carries a forfeiture entry of more than five dollars, and nothing where it carries no forfeiture
      entry.
    prerequisite:
    - problem: rx_ext_otc_quarter_forfeit
      kind: value_input
      gate: closeout_credit
      form: state
      policy_source: >-
        The quarter load is fixed only after the ledger carries a forfeiture entry for the latest quarter
        loaded before it.
      condition: >-
        rx_otc_ledger holds an rx_otc_forfeit row whose benefit_quarter equals the benefit_quarter of the
        latest rx_otc_load row on the coverage.
      resolved_by: forfeit_otc_quarter_0e0fa26e
      effect: >-
        The forfeiture entry of the previous loaded quarter decides the closeout credit tier; without it
        the closeout credit is nothing, with a forfeiture of at most five dollars it is two dollars.
    cross_category:
    - category: plan
      as: branch
      reads: [variant_name, status, income_pct_fpl, plan_claims.service_category, plan_claims.service_date, plan_claims.adjudication_status]
      note: The pregnancy supply credit and the income supplement are decided from the member's plan membership and paid preventive claims.
    - category: care
      as: branch
      reads: [variant_name, status]
      note: The care program credit reads the member's active care management tier.
    compute:
    - previous_quarter: "LATEST('rx_otc_ledger', 'benefit_quarter', date_field='posted_date', event_type='rx_otc_load')"
    - quarterly_allowance: "P('otc_quarterly_allowance_usd')"
    - membership_category: "CFIELD('plan', 'variant_name', status='active')"
    - paid_preventive_claims: "XCOUNT('plan', 'plan_claims', within_months=6, date_field='service_date', event_type='plan_claim_booked', service_category='preventive', adjudication_status='paid')"
    - pregnancy_credit: "K('pregnancy_credit_high') if (membership_category == 'Prairie Ridge Pregnancy Care' and paid_preventive_claims >= K('visits_high')) else (K('pregnancy_credit_low') if (membership_category == 'Prairie Ridge Pregnancy Care' and paid_preventive_claims >= K('visits_low') and paid_preventive_claims < K('visits_high')) else 0)"
    - income_pct: "CFIELD('plan', 'income_pct_fpl', status='active')"
    - income_supplement: "K('income_credit_low') if income_pct <= K('income_low_pct') else (K('income_credit_mid') if income_pct <= K('income_mid_pct') else 0)"
    - previous_remote_orders: "COUNT('rx_otc_ledger', event_type='rx_otc_purchase', benefit_quarter=previous_quarter, order_channel='mail_catalog') + COUNT('rx_otc_ledger', event_type='rx_otc_purchase', benefit_quarter=previous_quarter, order_channel='online')"
    - shipping_credit: "K('shipping_credit_two') if previous_remote_orders >= 2 else (K('shipping_credit_one') if previous_remote_orders == 1 else 0)"
    - days_since_load: "DAYS(LATEST('rx_otc_ledger', 'posted_date', date_field='posted_date', event_type='rx_otc_load'), NOW)"
    - late_load_credit: "K('late_rate') * int((days_since_load - K('late_grace_days')) / K('late_period_days')) if days_since_load >= K('late_days_long') else (K('late_flat') if days_since_load >= K('late_days_short') else 0)"
    - care_tier: "CFIELD('care', 'variant_name', status='active')"
    - care_program_credit: "K('care_credit_maternal') if care_tier == 'Maternal Care Management' else (K('care_credit_healthy') if care_tier == 'Healthy Living Support' else 0)"
    - previous_forfeit_entries: "COUNT('rx_otc_ledger', event_type='rx_otc_forfeit', benefit_quarter=previous_quarter)"
    - previous_forfeit_amount: "SUM('rx_otc_ledger', 'amount', event_type='rx_otc_forfeit', benefit_quarter=previous_quarter)"
    - closeout_credit: "K('closeout_credit_low') if (previous_forfeit_entries >= 1 and previous_forfeit_amount <= K('closeout_low_limit')) else (K('closeout_credit_high') if (previous_forfeit_entries >= 1 and previous_forfeit_amount > K('closeout_low_limit')) else 0)"
    - result: "RND(quarterly_allowance + pregnancy_credit + income_supplement + shipping_credit + late_load_credit + care_program_credit + closeout_credit, 2)"
    compute_basis:
      previous_quarter: "The quarter load is fixed only after the ledger carries a forfeiture entry for the latest quarter loaded before it."
      quarterly_allowance: "The standard quarter load is the plan's quarterly allowance and nothing else."
      membership_category: "The pregnancy supply credit is ten dollars for a member whose active plan membership is Prairie Ridge Pregnancy Care"
      paid_preventive_claims: "who has at least four paid preventive claims with a service date in the six months before the load is booked"
      pregnancy_credit: "The pregnancy supply credit is ten dollars for a member whose active plan membership is Prairie Ridge Pregnancy Care and who has at least four paid preventive claims with a service date in the six months before the load is booked, five dollars for a Prairie Ridge Pregnancy Care member with at least two but fewer than four such claims, and nothing for any other member."
      income_pct: "a member whose active plan membership records household income at or below 138 percent of the federal poverty level"
      income_supplement: "The income supplement is seven dollars fifty for a member whose active plan membership records household income at or below 138 percent of the federal poverty level, five dollars for income above 138 and at or below 185 percent, and nothing above 185 percent."
      previous_remote_orders: "The catalog shipping credit counts the mail catalog and online orders tagged to the previous loaded quarter"
      shipping_credit: "four dollars ninety-five for two or more such orders, two dollars fifty for exactly one, and nothing for none."
      days_since_load: "The late-load credit looks at the calendar days from the posting date of the previous load to the day the new load is booked"
      late_load_credit: "at 120 days or more the credit accrues seventy-five cents for every whole 15 days beyond the first 90 days; from 92 through 119 days it is a flat one dollar fifty; below 92 days there is no credit."
      care_tier: "The care program credit is four dollars for a member with an active Maternal Care Management care episode"
      care_program_credit: "The care program credit is four dollars for a member with an active Maternal Care Management care episode, two dollars for a member with an active Healthy Living Support care episode, and nothing otherwise."
      previous_forfeit_entries: "where the previous loaded quarter carries a forfeiture entry"
      previous_forfeit_amount: "a forfeiture entry of at most five dollars"
      closeout_credit: "The closeout credit is two dollars where the previous loaded quarter carries a forfeiture entry of at most five dollars, one dollar where it carries a forfeiture entry of more than five dollars, and nothing where it carries no forfeiture entry."
      result: "The quarter load is the plan's quarterly allowance plus the pregnancy supply credit, the income supplement, the catalog shipping credit, the late-load credit, the care program credit and the closeout credit, and only the quarter load is rounded to the cent."
    factors:
    - id: pregnancy_supply_credit
      effect: parameter
      decides: pregnancy_credit
      bindings: [membership_category, paid_preventive_claims, pregnancy_credit]
      ladder:
      - when: "active plan membership is Prairie Ridge Pregnancy Care and at least four paid preventive claims in the last six months"
        value: "K('pregnancy_credit_high') (ten dollars)"
      - when: "active plan membership is Prairie Ridge Pregnancy Care and two or three such claims"
        value: "K('pregnancy_credit_low') (five dollars)"
      - when: "otherwise"
        value: "0"
      baseline:
        pregnancy_credit: "0"
      evidence: [cross_category, history]
      cross_difficulty: plan
    - id: income_supplement
      effect: parameter
      decides: income_supplement
      bindings: [income_pct, income_supplement]
      ladder:
      - when: "household income on the active membership at or below 138 percent FPL"
        value: "K('income_credit_low') (seven dollars fifty)"
      - when: "above 138 and at or below 185 percent FPL"
        value: "K('income_credit_mid') (five dollars)"
      - when: "otherwise (above 185 percent)"
        value: "0"
      baseline:
        income_supplement: "0"
      evidence: [cross_category]
      cross_difficulty: plan
    - id: catalog_shipping_credit
      effect: parameter
      decides: shipping_credit
      bindings: [previous_remote_orders, shipping_credit]
      ladder:
      - when: "two or more mail catalog or online orders tagged to the previous loaded quarter"
        value: "K('shipping_credit_two') (four dollars ninety-five)"
      - when: "exactly one such order"
        value: "K('shipping_credit_one') (two dollars fifty)"
      - when: "otherwise (none)"
        value: "0"
      baseline:
        shipping_credit: "0"
      evidence: [history]
      cross_difficulty: null
    - id: late_load_credit
      effect: method
      decides: late_load_credit
      bindings: [days_since_load, late_load_credit]
      ladder:
      - when: "120 or more calendar days since the previous load was posted"
        method: "seventy-five cents accrue for every whole 15 days beyond the first 90 days"
      - when: "92 through 119 calendar days"
        method: "a flat one dollar fifty"
      - when: "otherwise (below 92 days)"
        method: "no credit accrues"
      baseline:
        late_load_credit: "0"
      evidence: [date, history]
      cross_difficulty: null
    - id: care_program_credit
      effect: parameter
      decides: care_program_credit
      bindings: [care_tier, care_program_credit]
      ladder:
      - when: "an active Maternal Care Management care episode"
        value: "K('care_credit_maternal') (four dollars)"
      - when: "an active Healthy Living Support care episode"
        value: "K('care_credit_healthy') (two dollars)"
      - when: "otherwise"
        value: "0"
      baseline:
        care_program_credit: "0"
      evidence: [cross_category]
      cross_difficulty: null
    - id: closeout_credit
      effect: parameter
      decides: closeout_credit
      bindings: [previous_forfeit_entries, previous_forfeit_amount, closeout_credit]
      ladder:
      - when: "the previous loaded quarter carries a forfeiture entry of at most five dollars"
        value: "K('closeout_credit_low') (two dollars)"
      - when: "it carries a forfeiture entry of more than five dollars"
        value: "K('closeout_credit_high') (one dollar)"
      - when: "otherwise (no forfeiture entry)"
        value: "0"
      baseline:
        closeout_credit: "0"
      evidence: [history]
      cross_difficulty: null
    baseline:
      rule: >-
        The standard quarter load is the plan's quarterly allowance and nothing else.
      params: [otc_quarterly_allowance_usd]
    inputs:
      history:
      - {table: rx_otc_ledger, aggregate: latest, field: posted_date, filters: {event_type: rx_otc_load}}
      - {table: rx_otc_ledger, aggregate: count, field: rx_otc_id, filters: {event_type: rx_otc_purchase}}
      - {table: rx_otc_ledger, aggregate: sum, field: amount, filters: {event_type: rx_otc_forfeit}}
      - {category: plan, table: plan_claims, aggregate: count, field: plan_claim_id, within_months: 6, filters: {event_type: plan_claim_booked, service_category: preventive, adjudication_status: paid}}
      cross_category: [plan, care]
  - id: rx_ext_otc_receipt_posting
    base_policy_refs: [rx_otc_allowance]
    overwrite: []
    trigger: state_due
    subject: [rx_otc_purchase]
    computes: allowance_charged
    target_tool: post_otc_receipt_a5c098d1
    params:
      share_full: 1.0
      share_mid: 0.95
      share_standard: 0.9
      visits_high: 4
      visits_low: 2
      adjust_high: 0.05
      adjust_low: 0.02
      receipts_high: 3
      split_threshold: 75.0
      split_rate: 0.5
      cofund_maternal: 0.2
      cofund_healthy: 0.1
      income_low_pct: 138
      income_mid_pct: 185
      relief_low: 0.1
      relief_mid: 0.05
    rule: >-
      A retail pharmacy register receipt transmitted against the over-the-counter allowance and not yet
      posted is posted once, and the receipt allowance charge is recorded on it; where several transmitted
      receipts await posting, the one with the largest register total is posted first. A transmitted retail
      receipt is not posted until the ledger carries the load of the benefit quarter the receipt is tagged
      to. The standard receipt allowance charge is nine tenths of the register total of the transmitted
      receipt, the remaining tenth being treated as sales tax and non-catalog items, and it never exceeds the
      allowance balance at posting. The receipt allowance charge starts from the register total as the
      large-receipt rule counts it, which is multiplied by the eligible share of the register total, then by
      one minus the register price adjustment, then by one minus the care program co-funding share, then by
      one minus the low-income relief share, and the product is limited to the allowance balance at posting;
      only the receipt allowance charge is rounded to the cent. A date falls in the last six whole months when fewer than six whole calendar months have passed from
      that date to today, a month counting as whole only once today's day of the month has reached that
      date's day of the month. The eligible share of the register total is
      the whole of it for a member whose active plan membership is Prairie Ridge Pregnancy Care with at least
      four paid preventive claims with a service date in the last six whole months, ninety-five percent for a
      Prairie Ridge Pregnancy Care member with at least two but fewer than four such claims, and ninety
      percent for any other member. The register price adjustment is five percent where three or more retail
      receipts were posted on the coverage in the last six whole months, two percent where one or two were, and
      nothing where none were. The large-receipt rule counts a register total above seventy-five dollars as
      seventy-five dollars plus one half of the part above seventy-five dollars where at least one retail
      receipt was posted on the coverage in the last six whole months, as seventy-five dollars only where a
      register total above seventy-five dollars comes with no retail receipt posted in the last six whole months,
      and as the full register total where the register total is seventy-five dollars or less. The care
      program co-funding share is twenty percent for a member with an active Maternal Care Management care
      episode, ten percent for a member with an active Healthy Living Support care episode, and nothing
      otherwise. The low-income relief share is ten percent where the active plan membership records
      household income at or below 138 percent of the federal poverty level, five percent above 138 and at or
      below 185 percent, and nothing above 185 percent.
    prerequisite:
    - problem: rx_ext_otc_quarter_load
      kind: value_input
      gate: posting_balance
      form: state
      policy_source: >-
        A transmitted retail receipt is not posted until the ledger carries the load of the benefit quarter
        the receipt is tagged to.
      condition: >-
        rx_otc_ledger holds an rx_otc_load row whose benefit_quarter equals the benefit_quarter of the
        transmitted retail rx_otc_purchase row that has an empty posted_date.
      resolved_by: load_otc_quarter_30ec28e6
      effect: >-
        The quarter's load raises the allowance balance at posting, which limits the receipt allowance
        charge; without the load the charge is held to the smaller balance.
    cross_category:
    - category: plan
      as: branch
      reads: [variant_name, status, income_pct_fpl, plan_claims.service_category, plan_claims.service_date, plan_claims.adjudication_status]
      note: The eligible share and the low-income relief share are decided from the plan membership and paid preventive claims.
    - category: care
      as: branch
      reads: [variant_name, status]
      note: The care program co-funding share reads the active care management tier.
    compute:
    - register_total: "MAX('rx_otc_ledger', 'amount', event_type='rx_otc_purchase', order_channel='retail_pharmacy', posted_date='')"
    - posting_balance: "F('otc_balance')"
    - receipt_category: "CFIELD('plan', 'variant_name', status='active')"
    - receipt_preventive_claims: "XCOUNT('plan', 'plan_claims', within_months=6, date_field='service_date', event_type='plan_claim_booked', service_category='preventive', adjudication_status='paid')"
    - eligible_share: "K('share_full') if (receipt_category == 'Prairie Ridge Pregnancy Care' and receipt_preventive_claims >= K('visits_high')) else (K('share_mid') if (receipt_category == 'Prairie Ridge Pregnancy Care' and receipt_preventive_claims >= K('visits_low') and receipt_preventive_claims < K('visits_high')) else K('share_standard'))"
    - posted_retail_receipts: "COUNT('rx_otc_ledger', within_months=6, date_field='posted_date', event_type='rx_otc_purchase', order_channel='retail_pharmacy')"
    - price_adjustment: "K('adjust_high') if posted_retail_receipts >= K('receipts_high') else (K('adjust_low') if posted_retail_receipts >= 1 else 0)"
    - counted_total: "K('split_threshold') + K('split_rate') * (register_total - K('split_threshold')) if (register_total > K('split_threshold') and posted_retail_receipts >= 1) else (K('split_threshold') if (register_total > K('split_threshold') and posted_retail_receipts < 1) else register_total)"
    - receipt_care_tier: "CFIELD('care', 'variant_name', status='active')"
    - cofunding_share: "K('cofund_maternal') if receipt_care_tier == 'Maternal Care Management' else (K('cofund_healthy') if receipt_care_tier == 'Healthy Living Support' else 0)"
    - receipt_income_pct: "CFIELD('plan', 'income_pct_fpl', status='active')"
    - relief_share: "K('relief_low') if receipt_income_pct <= K('income_low_pct') else (K('relief_mid') if receipt_income_pct <= K('income_mid_pct') else 0)"
    - charge_before_limit: "counted_total * eligible_share * (1 - price_adjustment) * (1 - cofunding_share) * (1 - relief_share)"
    - result: "RND(MN(charge_before_limit, posting_balance), 2)"
    compute_basis:
      register_total: "where several transmitted receipts await posting, the one with the largest register total is posted first."
      posting_balance: "and the product is limited to the allowance balance at posting"
      receipt_category: "for a member whose active plan membership is Prairie Ridge Pregnancy Care"
      receipt_preventive_claims: "with at least four paid preventive claims with a service date in the last six whole months"
      eligible_share: "The eligible share of the register total is the whole of it for a member whose active plan membership is Prairie Ridge Pregnancy Care with at least four paid preventive claims with a service date in the last six whole months, ninety-five percent for a Prairie Ridge Pregnancy Care member with at least two but fewer than four such claims, and ninety percent for any other member."
      posted_retail_receipts: "A date falls in the last six whole months when fewer than six whole calendar months have passed from that date to today, a month counting as whole only once today's day of the month has reached that date's day of the month."
      price_adjustment: "The register price adjustment is five percent where three or more retail receipts were posted on the coverage in the last six whole months, two percent where one or two were, and nothing where none were."
      counted_total: "The large-receipt rule counts a register total above seventy-five dollars as seventy-five dollars plus one half of the part above seventy-five dollars where at least one retail receipt was posted on the coverage in the last six whole months, as seventy-five dollars only where a register total above seventy-five dollars comes with no retail receipt posted in the last six whole months, and as the full register total where the register total is seventy-five dollars or less."
      receipt_care_tier: "for a member with an active Maternal Care Management care episode"
      cofunding_share: "The care program co-funding share is twenty percent for a member with an active Maternal Care Management care episode, ten percent for a member with an active Healthy Living Support care episode, and nothing otherwise."
      receipt_income_pct: "where the active plan membership records household income at or below 138 percent of the federal poverty level"
      relief_share: "The low-income relief share is ten percent where the active plan membership records household income at or below 138 percent of the federal poverty level, five percent above 138 and at or below 185 percent, and nothing above 185 percent."
      charge_before_limit: "The receipt allowance charge starts from the register total as the large-receipt rule counts it, which is multiplied by the eligible share of the register total, then by one minus the register price adjustment, then by one minus the care program co-funding share, then by one minus the low-income relief share"
      result: "and the product is limited to the allowance balance at posting; only the receipt allowance charge is rounded to the cent."
    factors:
    - id: eligible_share
      effect: parameter
      decides: eligible_share
      bindings: [receipt_category, receipt_preventive_claims, eligible_share]
      ladder:
      - when: "active plan membership is Prairie Ridge Pregnancy Care and at least four paid preventive claims in the last six whole months"
        value: "K('share_full') (the whole register total)"
      - when: "Prairie Ridge Pregnancy Care and two or three such claims"
        value: "K('share_mid') (ninety-five percent)"
      - when: "otherwise"
        value: "K('share_standard') (ninety percent)"
      baseline:
        eligible_share: "K('share_standard')"
      evidence: [cross_category, history]
      cross_difficulty: plan
    - id: register_price_adjustment
      effect: parameter
      decides: price_adjustment
      bindings: [posted_retail_receipts, price_adjustment]
      ladder:
      - when: "three or more retail receipts posted in the last six whole months"
        value: "K('adjust_high') (five percent)"
      - when: "one or two retail receipts posted in the last six whole months"
        value: "K('adjust_low') (two percent)"
      - when: "otherwise (none)"
        value: "0"
      baseline:
        price_adjustment: "0"
      evidence: [history]
      cross_difficulty: null
    - id: large_receipt_rule
      effect: method
      decides: counted_total
      bindings: [register_total, counted_total]
      ladder:
      - when: "register total above seventy-five dollars and at least one retail receipt posted in the last six whole months"
        method: "seventy-five dollars plus one half of the part above seventy-five dollars"
      - when: "register total above seventy-five dollars and no retail receipt posted in the last six whole months"
        method: "seventy-five dollars only"
      - when: "otherwise (register total of seventy-five dollars or less)"
        method: "the full register total"
      baseline:
        counted_total: "register_total"
      evidence: [history]
      cross_difficulty: null
    - id: care_cofunding
      effect: parameter
      decides: cofunding_share
      bindings: [receipt_care_tier, cofunding_share]
      ladder:
      - when: "an active Maternal Care Management care episode"
        value: "K('cofund_maternal') (twenty percent)"
      - when: "an active Healthy Living Support care episode"
        value: "K('cofund_healthy') (ten percent)"
      - when: "otherwise"
        value: "0"
      baseline:
        cofunding_share: "0"
      evidence: [cross_category]
      cross_difficulty: null
    - id: low_income_relief
      effect: parameter
      decides: relief_share
      bindings: [receipt_income_pct, relief_share]
      ladder:
      - when: "household income on the active membership at or below 138 percent FPL"
        value: "K('relief_low') (ten percent)"
      - when: "above 138 and at or below 185 percent FPL"
        value: "K('relief_mid') (five percent)"
      - when: "otherwise"
        value: "0"
      baseline:
        relief_share: "0"
      evidence: [cross_category]
      cross_difficulty: plan
    baseline:
      rule: >-
        The standard receipt allowance charge is nine tenths of the register total of the transmitted
        receipt, the remaining tenth being treated as sales tax and non-catalog items, and it never exceeds
        the allowance balance at posting.
      params: [share_standard]
    inputs:
      history:
      - {table: rx_otc_ledger, aggregate: max, field: amount, filters: {event_type: rx_otc_purchase, order_channel: retail_pharmacy}}
      - {table: rx_otc_ledger, aggregate: count, field: rx_otc_id, within_months: 6, filters: {event_type: rx_otc_purchase, order_channel: retail_pharmacy}}
      - {category: plan, table: plan_claims, aggregate: count, field: plan_claim_id, within_months: 6, filters: {event_type: plan_claim_booked, service_category: preventive, adjudication_status: paid}}
      cross_category: [plan, care]
  - id: rx_ext_otc_catalog_order
    base_policy_refs: [rx_otc_allowance]
    overwrite: []
    trigger: on_request
    subject: [rx_otc_purchase]
    computes: allowance_amount
    target_tool: place_otc_catalog_order_ca6274ae
    params:
      share_heavy_use: 0.6
      share_light_use: 0.8
      heavy_use_ratio: 0.75
      shipping_standard: 4.95
      shipping_partial: 2.5
      visits_high: 4
      visits_low: 2
      keep_per_receipt: 5.0
      keep_cap: 10.0
      remote_plan_orders: 2
      withheld_half: 0.5
    rule: >-
      When a member asks to put her over-the-counter allowance toward a mail catalog order, the catalog
      order allowance is the part of the allowance balance the order may use. The current quarter is the
      calendar quarter that contains today. The allowance applied to a catalog order is fixed only after
      every retail receipt transmitted for the current quarter carries a posting date. The standard catalog
      order allowance is the whole allowance balance less the register keep-back and less the standard
      shipping fee of four dollars ninety-five, never below zero, where the standard register keep-back is
      five dollars for each retail receipt tagged to the current quarter that carries a posting date, at
      most ten dollars. The catalog order allowance is worked out in this order: first the withheld
      carry-over is subtracted from the allowance balance, then the register keep-back is subtracted, then
      the result is multiplied by the order share, then the shipping fee is subtracted, the figure is never
      below zero, and only the catalog order allowance is rounded to the cent. The carry-over is the amount
      loaded for the latest forfeited quarter less its purchases and less its forfeiture entry, never below
      zero. The withheld carry-over is the whole carry-over where at least one retail receipt tagged to the
      current quarter carries a posting date and two or more mail catalog or online orders are still open to
      the member in the current quarter; one half of the carry-over where at least one such receipt carries a
      posting date and fewer than two such orders are still open; and nothing where no retail receipt tagged
      to the current quarter carries a posting date. The orders still open are the plan's mail catalog and
      online orders allowed per quarter less those already tagged to the current quarter. The order share is
      six tenths where two or more such orders are still open and the purchases tagged to the latest
      forfeited quarter reached at least three quarters of the amount loaded for it; eight tenths where two
      or more such orders are still open and those purchases reached less than three quarters of it; and the
      whole where fewer than two such orders are still open. The register keep-back is five dollars for each
      retail receipt counted, at most ten dollars, and the receipts counted depend on the plan and on the
      latest forfeited quarter: where the plan allows two or more mail catalog or online orders per quarter
      and the latest forfeited quarter carries at least one mail catalog or online order, the retail
      receipts posted in the last two whole months are counted; where the plan allows two or more such
      orders per quarter and the latest forfeited quarter carries none, the retail receipts posted in the
      last whole month are counted; and otherwise the retail receipts tagged to the current quarter that
      carry a posting date are counted. The shipping fee is nothing for a member whose active plan
      membership is Prairie Ridge Pregnancy Care with at least four paid preventive claims with a service
      date in the last six months, two dollars fifty for a Prairie Ridge Pregnancy Care member with at least
      two but fewer than four such claims, and four dollars ninety-five for any other member.
    prerequisite:
    - problem: rx_ext_otc_receipt_posting
      kind: value_input
      gate: order_balance
      form: state
      policy_source: >-
        The allowance applied to a catalog order is fixed only after every retail receipt transmitted for
        the current quarter carries a posting date.
      condition: >-
        No rx_otc_purchase row with order_channel retail_pharmacy tagged to the calendar quarter containing
        today has an empty posted_date.
      resolved_by: post_otc_receipt_a5c098d1
      effect: >-
        Posting the transmitted receipt lowers the allowance balance by its charge and adds a posted retail
        receipt, which enters the register keep-back count and the withheld carry-over condition; each
        changes the catalog order allowance.
    cross_category:
    - category: plan
      as: branch
      reads: [variant_name, status, plan_claims.service_category, plan_claims.service_date, plan_claims.adjudication_status]
      note: The shipping fee tier reads the member's active category and paid preventive claims.
    compute:
    - current_quarter: "LATEST('rx_otc_ledger', 'benefit_quarter', date_field='benefit_quarter')"
    - order_balance: "F('otc_balance')"
    - forfeited_quarter: "LATEST('rx_otc_ledger', 'benefit_quarter', date_field='posted_date', event_type='rx_otc_forfeit')"
    - open_orders: "P('otc_mail_orders_per_quarter') - COUNT('rx_otc_ledger', event_type='rx_otc_purchase', benefit_quarter=current_quarter, order_channel='mail_catalog') - COUNT('rx_otc_ledger', event_type='rx_otc_purchase', benefit_quarter=current_quarter, order_channel='online')"
    - posted_quarter_receipts: "COUNT('rx_otc_ledger', event_type='rx_otc_purchase', order_channel='retail_pharmacy', benefit_quarter=current_quarter) - COUNT('rx_otc_ledger', event_type='rx_otc_purchase', order_channel='retail_pharmacy', benefit_quarter=current_quarter, posted_date='')"
    - carry_over: "MX(0, SUM('rx_otc_ledger', 'amount', event_type='rx_otc_load', benefit_quarter=forfeited_quarter) - SUM('rx_otc_ledger', 'amount', event_type='rx_otc_purchase', benefit_quarter=forfeited_quarter) - SUM('rx_otc_ledger', 'amount', event_type='rx_otc_forfeit', benefit_quarter=forfeited_quarter))"
    - withheld_share: "1 if (posted_quarter_receipts >= 1 and open_orders >= 2) else (K('withheld_half') if (posted_quarter_receipts >= 1 and open_orders < 2) else 0)"
    - forfeited_usage: "SUM('rx_otc_ledger', 'amount', event_type='rx_otc_purchase', benefit_quarter=forfeited_quarter) / SUM('rx_otc_ledger', 'amount', event_type='rx_otc_load', benefit_quarter=forfeited_quarter) if SUM('rx_otc_ledger', 'amount', event_type='rx_otc_load', benefit_quarter=forfeited_quarter) > 0 else 0"
    - order_share: "K('share_heavy_use') if (open_orders >= 2 and forfeited_usage >= K('heavy_use_ratio')) else (K('share_light_use') if (open_orders >= 2 and forfeited_usage < K('heavy_use_ratio')) else 1)"
    - forfeited_remote_orders: "COUNT('rx_otc_ledger', event_type='rx_otc_purchase', benefit_quarter=forfeited_quarter, order_channel='mail_catalog') + COUNT('rx_otc_ledger', event_type='rx_otc_purchase', benefit_quarter=forfeited_quarter, order_channel='online')"
    - receipts_two_months: "COUNT('rx_otc_ledger', within_months=2, date_field='posted_date', event_type='rx_otc_purchase', order_channel='retail_pharmacy')"
    - receipts_one_month: "COUNT('rx_otc_ledger', within_months=1, date_field='posted_date', event_type='rx_otc_purchase', order_channel='retail_pharmacy')"
    - counted_receipts: "receipts_two_months if (P('otc_mail_orders_per_quarter') >= K('remote_plan_orders') and forfeited_remote_orders >= 1) else (receipts_one_month if (P('otc_mail_orders_per_quarter') >= K('remote_plan_orders') and forfeited_remote_orders < 1) else posted_quarter_receipts)"
    - register_keep_back: "MN(K('keep_cap'), K('keep_per_receipt') * counted_receipts)"
    - order_category: "CFIELD('plan', 'variant_name', status='active')"
    - order_preventive_claims: "XCOUNT('plan', 'plan_claims', within_months=6, date_field='service_date', event_type='plan_claim_booked', service_category='preventive', adjudication_status='paid')"
    - shipping_fee: "0 if (order_category == 'Prairie Ridge Pregnancy Care' and order_preventive_claims >= K('visits_high')) else (K('shipping_partial') if (order_category == 'Prairie Ridge Pregnancy Care' and order_preventive_claims >= K('visits_low') and order_preventive_claims < K('visits_high')) else K('shipping_standard'))"
    - result: "RND(MX(0, (order_balance - withheld_share * carry_over - register_keep_back) * order_share - shipping_fee), 2)"
    compute_basis:
      current_quarter: "The current quarter is the calendar quarter that contains today."
      order_balance: "the catalog order allowance is the part of the allowance balance the order may use."
      forfeited_quarter: "The carry-over is the amount loaded for the latest forfeited quarter less its purchases and less its forfeiture entry, never below zero."
      open_orders: "The orders still open are the plan's mail catalog and online orders allowed per quarter less those already tagged to the current quarter."
      posted_quarter_receipts: "otherwise the retail receipts tagged to the current quarter that carry a posting date are counted."
      carry_over: "The carry-over is the amount loaded for the latest forfeited quarter less its purchases and less its forfeiture entry, never below zero."
      withheld_share: "The withheld carry-over is the whole carry-over where at least one retail receipt tagged to the current quarter carries a posting date and two or more mail catalog or online orders are still open to the member in the current quarter; one half of the carry-over where at least one such receipt carries a posting date and fewer than two such orders are still open; and nothing where no retail receipt tagged to the current quarter carries a posting date."
      forfeited_usage: "the purchases tagged to the latest forfeited quarter reached at least three quarters of the amount loaded for it"
      order_share: "The order share is six tenths where two or more such orders are still open and the purchases tagged to the latest forfeited quarter reached at least three quarters of the amount loaded for it; eight tenths where two or more such orders are still open and those purchases reached less than three quarters of it; and the whole where fewer than two such orders are still open."
      forfeited_remote_orders: "the latest forfeited quarter carries at least one mail catalog or online order"
      receipts_two_months: "the retail receipts posted in the last two whole months are counted"
      receipts_one_month: "the retail receipts posted in the last whole month are counted"
      counted_receipts: "where the plan allows two or more mail catalog or online orders per quarter and the latest forfeited quarter carries at least one mail catalog or online order, the retail receipts posted in the last two whole months are counted; where the plan allows two or more such orders per quarter and the latest forfeited quarter carries none, the retail receipts posted in the last whole month are counted; and otherwise the retail receipts tagged to the current quarter that carry a posting date are counted."
      register_keep_back: "The register keep-back is five dollars for each retail receipt counted, at most ten dollars"
      order_category: "for a member whose active plan membership is Prairie Ridge Pregnancy Care"
      order_preventive_claims: "with at least four paid preventive claims with a service date in the last six months"
      shipping_fee: "The shipping fee is nothing for a member whose active plan membership is Prairie Ridge Pregnancy Care with at least four paid preventive claims with a service date in the last six months, two dollars fifty for a Prairie Ridge Pregnancy Care member with at least two but fewer than four such claims, and four dollars ninety-five for any other member."
      result: "first the withheld carry-over is subtracted from the allowance balance, then the register keep-back is subtracted, then the result is multiplied by the order share, then the shipping fee is subtracted, the figure is never below zero, and only the catalog order allowance is rounded to the cent."
    factors:
    - id: withheld_carryover
      effect: parameter
      decides: withheld_share
      bindings: [forfeited_quarter, carry_over, withheld_share]
      ladder:
      - when: "a retail receipt tagged to the current quarter carries a posting date and two or more mail catalog or online orders are still open"
        value: "1 (the whole carry-over is withheld)"
      - when: "such a receipt carries a posting date and fewer than two such orders are still open"
        value: "K('withheld_half') (one half of the carry-over is withheld)"
      - when: "otherwise (no retail receipt of the current quarter carries a posting date)"
        value: "0 (nothing is withheld)"
      baseline:
        withheld_share: "0"
      evidence: [history, tier_param]
      cross_difficulty: null
    - id: order_share
      effect: parameter
      decides: order_share
      bindings: [open_orders, forfeited_usage, order_share]
      ladder:
      - when: "two or more mail catalog or online orders still open and the latest forfeited quarter's purchases reached at least three quarters of its load"
        value: "K('share_heavy_use') (six tenths)"
      - when: "two or more still open and those purchases reached less than three quarters of its load"
        value: "K('share_light_use') (eight tenths)"
      - when: "otherwise (fewer than two still open)"
        value: "1 (the whole)"
      baseline:
        order_share: "1"
      evidence: [history, tier_param]
      cross_difficulty: null
    - id: keep_back_count_window
      effect: method
      decides: counted_receipts
      bindings: [posted_quarter_receipts, forfeited_remote_orders, receipts_two_months, receipts_one_month, counted_receipts]
      ladder:
      - when: "the plan allows two or more mail catalog or online orders per quarter and the latest forfeited quarter carries at least one such order"
        method: "count the retail receipts posted in the last two whole months (rolling window)"
      - when: "the plan allows two or more such orders per quarter and the latest forfeited quarter carries none"
        method: "count the retail receipts posted in the last whole month (shorter rolling window)"
      - when: "otherwise"
        method: "count the retail receipts tagged to the current quarter that carry a posting date (calendar-quarter window)"
      baseline:
        counted_receipts: "posted_quarter_receipts"
      evidence: [history, tier_param]
      cross_difficulty: null
    - id: shipping_fee
      effect: parameter
      decides: shipping_fee
      bindings: [order_category, order_preventive_claims, shipping_fee]
      ladder:
      - when: "active plan membership is Prairie Ridge Pregnancy Care and at least four paid preventive claims in the last six months"
        value: "0 (no shipping fee)"
      - when: "Prairie Ridge Pregnancy Care and two or three such claims"
        value: "K('shipping_partial') (two dollars fifty)"
      - when: "otherwise"
        value: "K('shipping_standard') (four dollars ninety-five)"
      baseline:
        shipping_fee: "K('shipping_standard')"
      evidence: [cross_category, history]
      cross_difficulty: plan
    baseline:
      rule: >-
        The standard catalog order allowance is the whole allowance balance less the register keep-back and
        less the standard shipping fee of four dollars ninety-five, never below zero, where the standard
        register keep-back is five dollars for each retail receipt tagged to the current quarter that carries
        a posting date, at most ten dollars.
      params: [shipping_standard, keep_per_receipt, keep_cap]
    inputs:
      history:
      - {table: rx_otc_ledger, aggregate: sum, field: amount, filters: {event_type: rx_otc_load}}
      - {table: rx_otc_ledger, aggregate: count, field: rx_otc_id, filters: {event_type: rx_otc_purchase}}
      - {table: rx_otc_ledger, aggregate: count, field: rx_otc_id, within_months: 2, filters: {event_type: rx_otc_purchase, order_channel: retail_pharmacy}}
      - {category: plan, table: plan_claims, aggregate: count, field: plan_claim_id, within_months: 6, filters: {event_type: plan_claim_booked, service_category: preventive, adjudication_status: paid}}
      cross_category: [plan]
  - id: rx_ext_emergency_supply_days
    base_policy_refs: [rx_emergency_supply_rule]
    overwrite:
    - base_policy: rx_emergency_supply_rule
      superseded_clause: >-
        the pharmacy dispenses an emergency supply of emergency_supply_days, at most emergency_supply_per_request
        per pending request per drug, with no copay.
      replaced_by: >-
        The emergency supply days are the request days plus the repeat-supply adjustment plus the urgent-care
        addition, never fewer than one day, turned into dispensed days by the day-count convention; the supply
        carries no copay.
    trigger: state_due
    subject: [rx_emergency_supply]
    computes: days_supply
    target_tool: record_emergency_supply_c348acc4
    params:
      days_no_statement: 9
      days_overdue: 5
      repeat_one: -3
      repeat_two: -5
      urgent_inhaler: 5
      urgent_other: 1
      sunday_anchor: '2026-01-04'
      monday_anchor: '2026-01-05'
      last_weekday: 4
      business_week: 5
      roll_saturday: 2
      roll_sunday: 1
    rule: >-
      A drug turned away at the pharmacy counter for prior authorization is owed one emergency supply while
      the latest prior authorization or exception request for that drug is undecided. The drug is the one
      named on the latest counter rejection for prior authorization on the coverage. The standard emergency
      supply is the plan's emergency supply days, counted in calendar days from today and dispensed with no
      copay. The emergency supply days are the request days plus the repeat-supply adjustment plus the
      urgent-care addition, never fewer than one day, turned into dispensed days by the day-count convention;
      the supply carries no copay. The request days are nine where the
      latest request for the drug has no prescriber statement received, five where the prescriber statement
      has been received and the request was received two or more calendar days before today, and the plan's
      emergency supply days otherwise. The repeat-supply adjustment looks at emergency supplies of the same
      drug dispensed in the last three months: minus five days for two or more, minus three days for exactly
      one, and nothing for none. The urgent-care addition is five days where the member has a paid
      emergency-room emergency claim with a service date in the last month and the drug is an inhaler, one
      day where the member has such a claim and the drug is not an inhaler, and nothing where the member has
      no such claim. The day-count convention follows who started the latest request for the drug. Where the
      member started it, the counted days are business days with today as the first day, so the dispensed
      days are the counted days plus two days for every Saturday and Sunday pair that falls before the
      counted business days run out. Where the pharmacy started it, the counted days are calendar days with
      today as the first day, and a supply whose last calendar day falls on a Saturday runs two more days to
      the Monday while one whose last day falls on a Sunday runs one more day to the Monday. Where the
      prescriber started it, the counted days are calendar days and are dispensed as counted.
    prerequisite: []
    cross_category:
    - category: plan
      as: branch
      reads: [plan_claims.service_category, plan_claims.service_date, plan_claims.adjudication_status]
      note: The urgent-care addition reads the member's paid emergency-room emergency claims of the last month.
    compute:
    - supply_drug: "LATEST('rx_fills', 'drug_name', date_field='fill_date', event_type='rx_fill_rejected', reject_code='prior_authorization_required')"
    - request_statement: "LATEST('rx_exceptions', 'prescriber_statement_received', date_field='event_date', event_type='rx_exception_request', drug_name=supply_drug)"
    - request_received: "LATEST('rx_exceptions', 'event_date', date_field='event_date', event_type='rx_exception_request', drug_name=supply_drug)"
    - request_days: "K('days_no_statement') if not request_statement else (K('days_overdue') if DAYS(request_received, NOW) >= 2 else P('emergency_supply_days'))"
    - prior_emergency_supplies: "COUNT('rx_fills', within_months=3, date_field='fill_date', event_type='rx_emergency_supply', drug_name=supply_drug)"
    - repeat_adjustment: "K('repeat_two') if prior_emergency_supplies >= 2 else (K('repeat_one') if prior_emergency_supplies == 1 else 0)"
    - er_claims: "XCOUNT('plan', 'plan_claims', within_months=1, date_field='service_date', event_type='plan_claim_booked', service_category='emergency_room_emergency', adjudication_status='paid')"
    - urgent_addition: "K('urgent_inhaler') if (er_claims >= 1 and 'inhaler' in supply_drug) else (K('urgent_other') if (er_claims >= 1 and 'inhaler' not in supply_drug) else 0)"
    - counted_days: "MX(1, request_days + repeat_adjustment + urgent_addition)"
    - request_starter: "LATEST('rx_exceptions', 'requested_by', date_field='event_date', event_type='rx_exception_request', drug_name=supply_drug)"
    - start_weekday: "DAYS(K('monday_anchor'), NOW) % 7"
    - last_day_index: "(DAYS(K('sunday_anchor'), NOW) + counted_days - 1) % 7"
    - dispensed_days: "counted_days + 2 * int((MN(start_weekday, K('last_weekday')) + counted_days - 1) / K('business_week')) if request_starter == 'member' else ((counted_days + (K('roll_saturday') if last_day_index == 6 else (K('roll_sunday') if last_day_index == 0 else 0))) if request_starter == 'pharmacy' else counted_days)"
    - result: "dispensed_days"
    compute_basis:
      supply_drug: "The drug is the one named on the latest counter rejection for prior authorization on the coverage."
      request_statement: "The request days are nine where the latest request for the drug has no prescriber statement received"
      request_received: "the request was received two or more calendar days before today"
      request_days: "The request days are nine where the latest request for the drug has no prescriber statement received, five where the prescriber statement has been received and the request was received two or more calendar days before today, and the plan's emergency supply days otherwise."
      prior_emergency_supplies: "The repeat-supply adjustment looks at emergency supplies of the same drug dispensed in the last three months"
      repeat_adjustment: "minus five days for two or more, minus three days for exactly one, and nothing for none."
      er_claims: "where the member has a paid emergency-room emergency claim with a service date in the last month"
      urgent_addition: "The urgent-care addition is five days where the member has a paid emergency-room emergency claim with a service date in the last month and the drug is an inhaler, one day where the member has such a claim and the drug is not an inhaler, and nothing where the member has no such claim."
      counted_days: "The emergency supply days are the request days plus the repeat-supply adjustment plus the urgent-care addition, never fewer than one day, turned into dispensed days by the day-count convention; the supply carries no copay."
      request_starter: "The day-count convention follows who started the latest request for the drug."
      start_weekday: "the counted days are business days with today as the first day, so the dispensed days are the counted days plus two days for every Saturday and Sunday pair that falls before the counted business days run out."
      last_day_index: "a supply whose last calendar day falls on a Saturday runs two more days to the Monday while one whose last day falls on a Sunday runs one more day to the Monday."
      dispensed_days: "Where the member started it, the counted days are business days with today as the first day, so the dispensed days are the counted days plus two days for every Saturday and Sunday pair that falls before the counted business days run out. Where the pharmacy started it, the counted days are calendar days with today as the first day, and a supply whose last calendar day falls on a Saturday runs two more days to the Monday while one whose last day falls on a Sunday runs one more day to the Monday. Where the prescriber started it, the counted days are calendar days and are dispensed as counted."
      result: "The emergency supply days are the request days plus the repeat-supply adjustment plus the urgent-care addition, never fewer than one day, turned into dispensed days by the day-count convention; the supply carries no copay."
    factors:
    - id: request_days
      effect: parameter
      decides: request_days
      bindings: [supply_drug, request_statement, request_received, request_days]
      ladder:
      - when: "the latest request for the drug has no prescriber statement received"
        value: "K('days_no_statement') (nine days)"
      - when: "the prescriber statement is received and the request was received two or more days before today"
        value: "K('days_overdue') (five days)"
      - when: "otherwise"
        value: "P('emergency_supply_days')"
      baseline:
        request_days: "P('emergency_supply_days')"
      evidence: [history, date]
      cross_difficulty: null
    - id: repeat_supply_adjustment
      effect: parameter
      decides: repeat_adjustment
      bindings: [prior_emergency_supplies, repeat_adjustment]
      ladder:
      - when: "two or more emergency supplies of the drug in the last three months"
        value: "K('repeat_two') (minus five days)"
      - when: "exactly one"
        value: "K('repeat_one') (minus three days)"
      - when: "otherwise (none)"
        value: "0"
      baseline:
        repeat_adjustment: "0"
      evidence: [history]
      cross_difficulty: null
    - id: urgent_care_addition
      effect: parameter
      decides: urgent_addition
      bindings: [er_claims, urgent_addition]
      ladder:
      - when: "a paid emergency-room emergency claim in the last month and the drug is an inhaler"
        value: "K('urgent_inhaler') (five days)"
      - when: "such a claim and the drug is not an inhaler"
        value: "K('urgent_other') (one day)"
      - when: "otherwise (no such claim)"
        value: "0"
      baseline:
        urgent_addition: "0"
      evidence: [cross_category, history]
      cross_difficulty: plan
    - id: day_count_convention
      effect: method
      decides: dispensed_days
      bindings: [request_starter, start_weekday, last_day_index, dispensed_days]
      ladder:
      - when: "the member started the latest request for the drug"
        method: "the counted days are business days from today; each Saturday and Sunday pair falling inside the span is added"
      - when: "the pharmacy started it"
        method: "calendar days from today, with a last day on a Saturday or Sunday rolled forward to the Monday"
      - when: "otherwise (the prescriber started it)"
        method: "calendar days from today, dispensed as counted"
      baseline:
        dispensed_days: "counted_days"
      evidence: [history, date]
      cross_difficulty: null
    baseline:
      rule: >-
        The standard emergency supply is the plan's emergency supply days, counted in calendar days from
        today and dispensed with no copay.
      params: [emergency_supply_days]
    inputs:
      history:
      - {table: rx_fills, aggregate: latest, field: drug_name, filters: {event_type: rx_fill_rejected, reject_code: prior_authorization_required}}
      - {table: rx_exceptions, aggregate: latest, field: prescriber_statement_received, filters: {event_type: rx_exception_request}}
      - {table: rx_fills, aggregate: count, field: rx_fill_id, within_months: 3, filters: {event_type: rx_emergency_supply}}
      - {category: plan, table: plan_claims, aggregate: count, field: plan_claim_id, within_months: 1, filters: {event_type: plan_claim_booked, service_category: emergency_room_emergency, adjudication_status: paid}}
      cross_category: [plan]
  - id: rx_ext_transition_fill_days
    base_policy_refs: [rx_evt_copay, rx_monthly_limit, rx_refill_timing, rx_transition_fill, rx_dual_wrap, rx_opioid_safety]
    overwrite:
    - base_policy: rx_transition_fill
      superseded_clause: >-
        A new member already taking a non-formulary drug receives one transition fill of up to transition_fill_days_supply
        within transition_fill_window_days after the rx coverage effective_date, recorded with fill_type transition_fill,
        while an exception is requested.
      replaced_by: >-
        The transition fill days are the window days plus the behavioral health continuity days, the repeat
        rejection days, the refill alignment days and the established prescriber days, and the total never
        exceeds the plan's most days supply of one fill.
    trigger: state_due
    subject: [rx_fill]
    computes: days_supply
    target_tool: book_transition_fill_6c1f1c97
    params:
      window_floor_days: 14
      bh_two: 10
      bh_one: 5
      reject_three: 4
      reject_two: 2
      align_near_days: 7
      align_far_days: 14
      align_near: 3
      align_far: 1
      prescriber_two: 2
      prescriber_one: 1
    rule: >-
      A member whose pharmacy coverage became effective within the plan's transition window and whose refill
      of a non-formulary drug was turned away at the counter is owed one transition fill of that drug, with
      no copay; a second transition fill for the same drug is never paid. The drug is the one named on the
      latest counter rejection for non-formulary status on the coverage, and the transition fill answers that
      latest rejection. The standard transition fill is the
      plan's transition fill days supply. The transition fill days are the window days plus the behavioral
      health continuity days, the repeat rejection days, the refill alignment days and the established
      prescriber days, and the total never exceeds the plan's most days supply of one fill. The window days
      count the calendar days left in the transition window, which is the plan's transition window days
      less the days from the coverage effective date to today: where fewer than fourteen days are left the
      window days are fourteen, where fourteen or more days are left but fewer than the plan's transition
      fill days supply the window days are the days left, and otherwise the window days are the plan's
      transition fill days supply. The behavioral health continuity days are ten where the member has two or
      more paid behavioral health visit claims with a service date in the last two months, five where the
      member has exactly one, and nothing where the member has none. The repeat rejection days are four where
      the drug was turned away as non-formulary three or more times in the last month, two where it was
      turned away exactly twice, and nothing otherwise. The refill alignment days are three where the
      member's latest paid refill of any drug was filled within the last seven days, one where it was filled
      eight to fourteen days ago, and nothing otherwise. The established prescriber days are two where the
      prescriber on the rejection wrote two or more of the member's paid refills in the last three months,
      one where the prescriber wrote exactly one, and nothing otherwise.
    prerequisite: []
    cross_category:
    - category: plan
      as: branch
      reads: [plan_claims.service_category, plan_claims.service_date, plan_claims.adjudication_status]
      note: The behavioral health continuity days read the member's paid behavioral health visits of the last two months.
    compute:
    - transition_drug: "LATEST('rx_fills', 'drug_name', date_field='fill_date', event_type='rx_fill_rejected', reject_code='non_formulary')"
    - window_left: "P('transition_fill_window_days') - DAYS(F('effective_date'), NOW)"
    - window_days: "K('window_floor_days') if window_left < K('window_floor_days') else (window_left if window_left < P('transition_fill_days_supply') else P('transition_fill_days_supply'))"
    - bh_visits: "XCOUNT('plan', 'plan_claims', within_months=2, date_field='service_date', event_type='plan_claim_booked', service_category='behavioral_health_visit', adjudication_status='paid')"
    - continuity_days: "K('bh_two') if bh_visits >= 2 else (K('bh_one') if bh_visits == 1 else 0)"
    - repeat_rejections: "COUNT('rx_fills', within_months=1, date_field='fill_date', event_type='rx_fill_rejected', reject_code='non_formulary', drug_name=transition_drug)"
    - rejection_days: "K('reject_three') if repeat_rejections >= 3 else (K('reject_two') if repeat_rejections == 2 else 0)"
    - days_since_refill: "DAYS(LATEST('rx_fills', 'fill_date', date_field='fill_date', event_type='rx_fill', fill_type='refill'), NOW)"
    - alignment_days: "K('align_near') if days_since_refill <= K('align_near_days') else (K('align_far') if days_since_refill <= K('align_far_days') else 0)"
    - rejection_prescriber: "LATEST('rx_fills', 'prescriber_npi', date_field='fill_date', event_type='rx_fill_rejected', reject_code='non_formulary')"
    - prescriber_refills: "COUNT('rx_fills', within_months=3, date_field='fill_date', event_type='rx_fill', fill_type='refill', prescriber_npi=rejection_prescriber)"
    - prescriber_days: "K('prescriber_two') if prescriber_refills >= 2 else (K('prescriber_one') if prescriber_refills == 1 else 0)"
    - result: "MN(P('max_days_supply'), window_days + continuity_days + rejection_days + alignment_days + prescriber_days)"
    compute_basis:
      transition_drug: "The drug is the one named on the latest counter rejection for non-formulary status on the coverage, and the transition fill answers that latest rejection."
      window_left: "The window days count the calendar days left in the transition window, which is the plan's transition window days less the days from the coverage effective date to today"
      window_days: "where fewer than fourteen days are left the window days are fourteen, where fourteen or more days are left but fewer than the plan's transition fill days supply the window days are the days left, and otherwise the window days are the plan's transition fill days supply."
      bh_visits: "where the member has two or more paid behavioral health visit claims with a service date in the last two months"
      continuity_days: "The behavioral health continuity days are ten where the member has two or more paid behavioral health visit claims with a service date in the last two months, five where the member has exactly one, and nothing where the member has none."
      repeat_rejections: "where the drug was turned away as non-formulary three or more times in the last month"
      rejection_days: "The repeat rejection days are four where the drug was turned away as non-formulary three or more times in the last month, two where it was turned away exactly twice, and nothing otherwise."
      days_since_refill: "where the member's latest paid refill of any drug was filled within the last seven days"
      alignment_days: "The refill alignment days are three where the member's latest paid refill of any drug was filled within the last seven days, one where it was filled eight to fourteen days ago, and nothing otherwise."
      rejection_prescriber: "where the prescriber on the rejection wrote two or more of the member's paid refills in the last three months"
      prescriber_refills: "where the prescriber on the rejection wrote two or more of the member's paid refills in the last three months"
      prescriber_days: "The established prescriber days are two where the prescriber on the rejection wrote two or more of the member's paid refills in the last three months, one where the prescriber wrote exactly one, and nothing otherwise."
      result: "The transition fill days are the window days plus the behavioral health continuity days, the repeat rejection days, the refill alignment days and the established prescriber days, and the total never exceeds the plan's most days supply of one fill."
    factors:
    - id: transition_window_days
      effect: method
      decides: window_days
      bindings: [window_left, window_days]
      ladder:
      - when: "fewer than fourteen days left in the transition window"
        method: "a fixed fourteen days"
      - when: "fourteen or more days left but fewer than the plan's transition fill days supply"
        method: "the calendar days left in the window"
      - when: "otherwise"
        method: "the plan's transition fill days supply"
      baseline:
        window_days: "P('transition_fill_days_supply')"
      evidence: [date, tier_param]
      cross_difficulty: null
    - id: behavioral_health_continuity
      effect: parameter
      decides: continuity_days
      bindings: [bh_visits, continuity_days]
      ladder:
      - when: "two or more paid behavioral health visit claims in the last two months"
        value: "K('bh_two') (ten days)"
      - when: "exactly one"
        value: "K('bh_one') (five days)"
      - when: "otherwise (none)"
        value: "0"
      baseline:
        continuity_days: "0"
      evidence: [cross_category, history]
      cross_difficulty: plan
    - id: repeat_rejection_days
      effect: parameter
      decides: rejection_days
      bindings: [transition_drug, repeat_rejections, rejection_days]
      ladder:
      - when: "turned away as non-formulary three or more times in the last month"
        value: "K('reject_three') (four days)"
      - when: "exactly twice"
        value: "K('reject_two') (two days)"
      - when: "otherwise"
        value: "0"
      baseline:
        rejection_days: "0"
      evidence: [history]
      cross_difficulty: null
    - id: refill_alignment_days
      effect: parameter
      decides: alignment_days
      bindings: [days_since_refill, alignment_days]
      ladder:
      - when: "latest paid refill of any drug within the last seven days"
        value: "K('align_near') (three days)"
      - when: "eight to fourteen days ago"
        value: "K('align_far') (one day)"
      - when: "otherwise"
        value: "0"
      baseline:
        alignment_days: "0"
      evidence: [history, date]
      cross_difficulty: null
    - id: established_prescriber_days
      effect: parameter
      decides: prescriber_days
      bindings: [rejection_prescriber, prescriber_refills, prescriber_days]
      ladder:
      - when: "the rejection's prescriber wrote two or more paid refills in the last three months"
        value: "K('prescriber_two') (two days)"
      - when: "exactly one"
        value: "K('prescriber_one') (one day)"
      - when: "otherwise"
        value: "0"
      baseline:
        prescriber_days: "0"
      evidence: [history]
      cross_difficulty: null
    baseline:
      rule: >-
        The standard transition fill is the plan's transition fill days supply.
      params: [transition_fill_days_supply]
    inputs:
      history:
      - {table: rx_fills, aggregate: latest, field: drug_name, filters: {event_type: rx_fill_rejected, reject_code: non_formulary}}
      - {table: rx_fills, aggregate: count, field: rx_fill_id, within_months: 1, filters: {event_type: rx_fill_rejected, reject_code: non_formulary}}
      - {table: rx_fills, aggregate: count, field: rx_fill_id, within_months: 3, filters: {event_type: rx_fill, fill_type: refill}}
      - {category: plan, table: plan_claims, aggregate: count, field: plan_claim_id, within_months: 2, filters: {event_type: plan_claim_booked, service_category: behavioral_health_visit, adjudication_status: paid}}
      cross_category: [plan]
  - id: rx_ext_vacation_supply_release
    base_policy_refs: [rx_evt_copay, rx_monthly_limit, rx_refill_timing, rx_transition_fill, rx_dual_wrap, rx_opioid_safety]
    overwrite: []
    trigger: state_due
    subject: [rx_fill]
    computes: days_supply
    target_tool: release_vacation_supply_4890f9e9
    params:
      maintenance_supply: 28
      maintenance_days_two: 7
      maintenance_days_one: 3
      refills_many: 6
      refills_some: 3
      refill_days_many: 3
      refill_days_some: 2
      overrides_many: 3
      overrides_two: 2
      override_adjust_many: -5
      override_adjust_two: -3
    rule: >-
      A vacation override granted for a prescription is owed one released vacation fill of that
      prescription. The drug is the one named on the latest vacation override granted on the coverage, and
      its supply is measured from the latest paid refill of that drug. The standard vacation release is the
      plan's most extra days supply one vacation override releases less the days still on hand from the
      latest paid refill of the drug, which are that refill's days supply less the calendar days since it was
      filled, never below zero, and the release is never fewer than one day. The vacation release days are the plan's most extra days supply less the
      days on hand as the on-hand measure counts them, never below zero, plus the maintenance days, the
      refill count days and the override history adjustment; the total is never fewer than one day and never
      exceeds the plan's most extra days supply one vacation override releases. The on-hand measure counts,
      for a controlled substance, the days from today to the ordinary controlled refill date, which is the
      whole number of days, fractions dropped, in the plan's controlled refill percent of the latest refill's
      days supply less the calendar days since it was filled; for a drug that is not controlled and whose
      latest refill was for twenty-eight or more days, the same count at the plan's ordinary refill percent;
      and otherwise the refill's days supply less the calendar days since it was filled; each count is never
      below zero. The maintenance days are seven where the same drug has two or more paid refills in the last
      three months, three where it has exactly one, and nothing otherwise. The refill count days are three
      where the coverage carries six or more paid refills of any drug in the last three months, two where it
      carries three to five, and nothing otherwise. The override history adjustment counts the vacation
      overrides granted on the coverage for any drug in the last twelve months, the current one included:
      minus five days for three or more, minus three days for exactly two, and nothing for one.
    prerequisite: []
    cross_category: []
    compute:
    - override_drug: "LATEST('rx_exceptions', 'drug_name', date_field='event_date', event_type='rx_refill_override', request_type='vacation_override')"
    - refill_days: "LATEST('rx_fills', 'days_supply', date_field='fill_date', event_type='rx_fill', fill_type='refill', drug_name=override_drug)"
    - refill_elapsed: "DAYS(LATEST('rx_fills', 'fill_date', date_field='fill_date', event_type='rx_fill', fill_type='refill', drug_name=override_drug), NOW)"
    - refill_schedule: "LATEST('rx_fills', 'controlled_schedule', date_field='fill_date', event_type='rx_fill', fill_type='refill', drug_name=override_drug)"
    - on_hand_days: "MX(0, int(refill_days * P('early_refill_pct_controlled') / 100) - refill_elapsed) if refill_schedule != 'none' else (MX(0, int(refill_days * P('early_refill_pct') / 100) - refill_elapsed) if (refill_schedule == 'none' and refill_days >= K('maintenance_supply')) else MX(0, refill_days - refill_elapsed))"
    - maintenance_refills: "COUNT('rx_fills', within_months=3, date_field='fill_date', event_type='rx_fill', fill_type='refill', drug_name=override_drug)"
    - maintenance_days: "K('maintenance_days_two') if maintenance_refills >= 2 else (K('maintenance_days_one') if maintenance_refills == 1 else 0)"
    - coverage_refills: "COUNT('rx_fills', within_months=3, date_field='fill_date', event_type='rx_fill', fill_type='refill')"
    - refill_count_days: "K('refill_days_many') if coverage_refills >= K('refills_many') else (K('refill_days_some') if coverage_refills >= K('refills_some') else 0)"
    - vacation_overrides: "COUNT('rx_exceptions', within_months=12, date_field='event_date', event_type='rx_refill_override', request_type='vacation_override')"
    - override_adjustment: "K('override_adjust_many') if vacation_overrides >= K('overrides_many') else (K('override_adjust_two') if vacation_overrides == K('overrides_two') else 0)"
    - result: "int(MN(P('vacation_override_max_days'), MX(1, MX(0, P('vacation_override_max_days') - on_hand_days) + maintenance_days + refill_count_days + override_adjustment)))"
    compute_basis:
      override_drug: "The drug is the one named on the latest vacation override granted on the coverage, and its supply is measured from the latest paid refill of that drug."
      refill_days: "its supply is measured from the latest paid refill of that drug."
      refill_elapsed: "less the calendar days since it was filled"
      refill_schedule: "for a controlled substance, the days from today to the ordinary controlled refill date"
      on_hand_days: "The on-hand measure counts, for a controlled substance, the days from today to the ordinary controlled refill date, which is the whole number of days, fractions dropped, in the plan's controlled refill percent of the latest refill's days supply less the calendar days since it was filled; for a drug that is not controlled and whose latest refill was for twenty-eight or more days, the same count at the plan's ordinary refill percent; and otherwise the refill's days supply less the calendar days since it was filled; each count is never below zero."
      maintenance_refills: "where the same drug has two or more paid refills in the last three months"
      maintenance_days: "The maintenance days are seven where the same drug has two or more paid refills in the last three months, three where it has exactly one, and nothing otherwise."
      coverage_refills: "where the coverage carries six or more paid refills of any drug in the last three months"
      refill_count_days: "The refill count days are three where the coverage carries six or more paid refills of any drug in the last three months, two where it carries three to five, and nothing otherwise."
      vacation_overrides: "The override history adjustment counts the vacation overrides granted on the coverage for any drug in the last twelve months, the current one included"
      override_adjustment: "minus five days for three or more, minus three days for exactly two, and nothing for one."
      result: "The vacation release days are the plan's most extra days supply less the days on hand as the on-hand measure counts them, never below zero, plus the maintenance days, the refill count days and the override history adjustment; the total is never fewer than one day and never exceeds the plan's most extra days supply one vacation override releases."
    factors:
    - id: on_hand_measure
      effect: method
      decides: on_hand_days
      bindings: [override_drug, refill_days, refill_elapsed, refill_schedule, on_hand_days]
      ladder:
      - when: "the drug is a controlled substance (schedule CII to CV)"
        method: "days to the ordinary controlled refill date: whole days of the controlled refill percent of the latest refill's days supply, less the days since it was filled"
      - when: "the drug is not controlled and its latest refill was for twenty-eight or more days"
        method: "days to the ordinary refill date at the plan's ordinary refill percent"
      - when: "otherwise"
        method: "the refill's days supply less the days since it was filled"
      baseline:
        on_hand_days: "MX(0, refill_days - refill_elapsed)"
      evidence: [history, date, tier_param]
      cross_difficulty: null
    - id: maintenance_days
      effect: parameter
      decides: maintenance_days
      bindings: [maintenance_refills, maintenance_days]
      ladder:
      - when: "two or more paid refills of the drug in three months"
        value: "K('maintenance_days_two') (seven days)"
      - when: "exactly one"
        value: "K('maintenance_days_one') (three days)"
      - when: "otherwise"
        value: "0"
      baseline:
        maintenance_days: "0"
      evidence: [history]
      cross_difficulty: null
    - id: refill_count_days
      effect: parameter
      decides: refill_count_days
      bindings: [coverage_refills, refill_count_days]
      ladder:
      - when: "six or more paid refills of any drug on the coverage in three months"
        value: "K('refill_days_many') (three days)"
      - when: "three to five"
        value: "K('refill_days_some') (two days)"
      - when: "otherwise"
        value: "0"
      baseline:
        refill_count_days: "0"
      evidence: [history]
      cross_difficulty: null
    - id: override_history_adjustment
      effect: parameter
      decides: override_adjustment
      bindings: [vacation_overrides, override_adjustment]
      ladder:
      - when: "three or more vacation overrides on the coverage in twelve months, the current one included"
        value: "K('override_adjust_many') (minus five days)"
      - when: "exactly two"
        value: "K('override_adjust_two') (minus three days)"
      - when: "otherwise (only the current one)"
        value: "0"
      baseline:
        override_adjustment: "0"
      evidence: [history]
      cross_difficulty: null
    baseline:
      rule: >-
        The standard vacation release is the plan's most extra days supply one vacation override releases
        less the days still on hand from the latest paid refill of the drug, which are that refill's days
        supply less the calendar days since it was filled, never below zero, and the release is never fewer
        than one day.
      params: [vacation_override_max_days]
    inputs:
      history:
      - {table: rx_exceptions, aggregate: latest, field: drug_name, filters: {event_type: rx_refill_override, request_type: vacation_override}}
      - {table: rx_fills, aggregate: latest, field: days_supply, filters: {event_type: rx_fill, fill_type: refill}}
      - {table: rx_fills, aggregate: count, field: rx_fill_id, within_months: 3, filters: {event_type: rx_fill, fill_type: refill}}
      - {table: rx_exceptions, aggregate: count, field: rx_exception_id, within_months: 12, filters: {event_type: rx_refill_override, request_type: vacation_override}}
      cross_category: []
  - id: rx_ext_lost_stolen_replacement
    base_policy_refs: [rx_evt_copay, rx_monthly_limit, rx_refill_timing, rx_transition_fill, rx_dual_wrap, rx_opioid_safety]
    overwrite: []
    trigger: on_request
    subject: [rx_refill_override, rx_fill]
    computes: days_supply
    target_tool: request_replacement_fill_14de4074
    params:
      offcycle_many: 3
      offcycle_adjust_many: -4
      offcycle_adjust_some: -2
      continuity_two: 6
      continuity_one: 4
      prior_two: -3
      prior_one: -2
      stable_three: 3
      stable_two: 1
      sunday_anchor: '2026-01-04'
      roll_saturday: 2
      roll_sunday: 1
    rule: >-
      When a member reports a prescription supply lost or stolen, the replacement fill of that
      prescription is paid as a lost or stolen override, within the plan's per-drug limit and, for a
      controlled substance, only with the police report number the member gives. The drug is the one named
      on the latest counter rejection for refill too soon on the coverage, and its supply is measured from
      the latest paid refill of that drug. The replacement days are fixed only after every counter
      rejection for prior authorization whose drug has an undecided request carries an emergency supply of
      that drug. The replacement days are not fixed until every non-formulary refill rejection of a member
      inside the transition window carries a transition fill of that drug. The replacement days are fixed
      only after every vacation override granted in the last thirty days carries a released vacation fill.
      The standard replacement is the days still on hand from the latest paid refill, which are that
      refill's days supply less the calendar days since it was filled, never fewer than one day. The
      replacement days are the replacement base days plus the off-cycle adjustment, the continuity days,
      the prior-replacement adjustment and the stable-therapy days, never fewer than one day, and then the
      weekend roll is added. The replacement base days are, for a controlled substance, the days from today
      to the ordinary controlled refill date, which is the whole number of days in the plan's controlled
      refill percent of the latest refill's days supply less the calendar days since it was filled; for a
      drug that is not controlled and has two or more paid refills in the last three months, the same count
      at the plan's ordinary refill percent; and otherwise the days still on hand, never fewer than one day.
      The off-cycle adjustment
      counts the emergency supplies, transition fills and vacation fills dispensed on the coverage in the
      last month: minus four days for three or more, minus two days for one or two, and nothing for none.
      The continuity days are six where the drug is a controlled substance and the member has two or more
      paid behavioral health visit claims with a service date in the last two months, four where the drug is
      a controlled substance and the member has exactly one such claim, and nothing otherwise. The
      prior-replacement adjustment counts the lost or stolen overrides granted on the coverage for any drug
      in the last twelve months: minus three days for two or more, minus two days for exactly one, and
      nothing for none. The stable-therapy days are three where the drug has three or more paid refills in
      the last three months, one where it has exactly two, and nothing otherwise. The replacement's last day
      is today plus the replacement days less one day; the weekend roll adds two days to a last day that
      falls on a Saturday, one day to a last day that falls on a Sunday, and nothing to a last day on a
      weekday.
    prerequisite:
    - problem: rx_ext_emergency_supply_days
      kind: value_input
      gate: offcycle_adjustment
      form: state
      policy_source: >-
        The replacement days are fixed only after every counter rejection for prior authorization whose drug
        has an undecided request carries an emergency supply of that drug.
      condition: >-
        For every rx_fill_rejected row with reject_code prior_authorization_required whose drug has an
        undecided rx_exception_request, an rx_emergency_supply row of that drug is dated on or after that
        rejection.
      resolved_by: record_emergency_supply_c348acc4
      effect: >-
        The emergency supply is an off-cycle dispensing in the last month and moves the off-cycle
        adjustment to a higher count tier.
    - problem: rx_ext_transition_fill_days
      kind: value_input
      gate: offcycle_adjustment
      form: state
      policy_source: >-
        The replacement days are not fixed until every non-formulary refill rejection of a member inside the
        transition window carries a transition fill of that drug.
      condition: >-
        For every rx_fill_rejected row with reject_code non_formulary and fill_type refill on a coverage whose
        effective date is within the transition window, an rx_fill row with fill_type transition_fill of that
        rejection's drug exists.
      resolved_by: book_transition_fill_6c1f1c97
      effect: >-
        The transition fill is an off-cycle dispensing in the last month and moves the off-cycle adjustment
        to a higher count tier.
    - problem: rx_ext_vacation_supply_release
      kind: value_input
      gate: offcycle_adjustment
      form: state
      policy_source: >-
        The replacement days are fixed only after every vacation override granted in the last thirty days
        carries a released vacation fill.
      condition: >-
        For every rx_refill_override row with request_type vacation_override dated in the last thirty days,
        an rx_fill row with fill_type vacation_override of that prescription exists.
      resolved_by: release_vacation_supply_4890f9e9
      effect: >-
        The released vacation fill is an off-cycle dispensing in the last month and moves the off-cycle
        adjustment to a higher count tier.
    cross_category:
    - category: plan
      as: branch
      reads: [plan_claims.service_category, plan_claims.service_date, plan_claims.adjudication_status]
      note: The continuity days read the member's paid behavioral health visits of the last two months.
    compute:
    - replaced_drug: "LATEST('rx_fills', 'drug_name', date_field='fill_date', event_type='rx_fill_rejected', reject_code='refill_too_soon')"
    - refill_supply: "LATEST('rx_fills', 'days_supply', date_field='fill_date', event_type='rx_fill', fill_type='refill', drug_name=replaced_drug)"
    - refill_elapsed: "DAYS(LATEST('rx_fills', 'fill_date', date_field='fill_date', event_type='rx_fill', fill_type='refill', drug_name=replaced_drug), NOW)"
    - refill_schedule: "LATEST('rx_fills', 'controlled_schedule', date_field='fill_date', event_type='rx_fill', fill_type='refill', drug_name=replaced_drug)"
    - drug_refills: "COUNT('rx_fills', within_months=3, date_field='fill_date', event_type='rx_fill', fill_type='refill', drug_name=replaced_drug)"
    - base_days: "int(refill_supply * P('early_refill_pct_controlled') / 100) - refill_elapsed if refill_schedule != 'none' else (int(refill_supply * P('early_refill_pct') / 100) - refill_elapsed if (refill_schedule == 'none' and drug_refills >= 2) else MX(1, refill_supply - refill_elapsed))"
    - offcycle_count: "COUNT('rx_fills', within_months=1, date_field='fill_date', event_type='rx_emergency_supply') + COUNT('rx_fills', within_months=1, date_field='fill_date', event_type='rx_fill', fill_type='transition_fill') + COUNT('rx_fills', within_months=1, date_field='fill_date', event_type='rx_fill', fill_type='vacation_override')"
    - offcycle_adjustment: "K('offcycle_adjust_many') if offcycle_count >= K('offcycle_many') else (K('offcycle_adjust_some') if offcycle_count >= 1 else 0)"
    - bh_claims: "XCOUNT('plan', 'plan_claims', within_months=2, date_field='service_date', event_type='plan_claim_booked', service_category='behavioral_health_visit', adjudication_status='paid')"
    - continuity_days: "K('continuity_two') if (refill_schedule != 'none' and bh_claims >= 2) else (K('continuity_one') if (refill_schedule != 'none' and bh_claims == 1) else 0)"
    - prior_replacements: "COUNT('rx_exceptions', within_months=12, date_field='event_date', event_type='rx_refill_override', request_type='lost_stolen_override')"
    - prior_adjustment: "K('prior_two') if prior_replacements >= 2 else (K('prior_one') if prior_replacements == 1 else 0)"
    - stable_days: "K('stable_three') if drug_refills >= 3 else (K('stable_two') if drug_refills == 2 else 0)"
    - counted_days: "MX(1, base_days + offcycle_adjustment + continuity_days + prior_adjustment + stable_days)"
    - replacement_last_index: "(DAYS(K('sunday_anchor'), NOW) + counted_days - 1) % 7"
    - replacement_roll: "K('roll_saturday') if replacement_last_index == 6 else (K('roll_sunday') if replacement_last_index == 0 else 0)"
    - result: "counted_days + replacement_roll"
    compute_basis:
      replaced_drug: "The drug is the one named on the latest counter rejection for refill too soon on the coverage, and its supply is measured from the latest paid refill of that drug."
      refill_supply: "its supply is measured from the latest paid refill of that drug."
      refill_elapsed: "less the calendar days since it was filled"
      refill_schedule: "The replacement base days are, for a controlled substance, the days from today to the ordinary controlled refill date"
      drug_refills: "for a drug that is not controlled and has two or more paid refills in the last three months"
      base_days: "The replacement base days are, for a controlled substance, the days from today to the ordinary controlled refill date, which is the whole number of days in the plan's controlled refill percent of the latest refill's days supply less the calendar days since it was filled; for a drug that is not controlled and has two or more paid refills in the last three months, the same count at the plan's ordinary refill percent; and otherwise the days still on hand, never fewer than one day."
      offcycle_count: "The off-cycle adjustment counts the emergency supplies, transition fills and vacation fills dispensed on the coverage in the last month"
      offcycle_adjustment: "minus four days for three or more, minus two days for one or two, and nothing for none."
      bh_claims: "the member has two or more paid behavioral health visit claims with a service date in the last two months"
      continuity_days: "The continuity days are six where the drug is a controlled substance and the member has two or more paid behavioral health visit claims with a service date in the last two months, four where the drug is a controlled substance and the member has exactly one such claim, and nothing otherwise."
      prior_replacements: "The prior-replacement adjustment counts the lost or stolen overrides granted on the coverage for any drug in the last twelve months"
      prior_adjustment: "minus three days for two or more, minus two days for exactly one, and nothing for none."
      stable_days: "The stable-therapy days are three where the drug has three or more paid refills in the last three months, one where it has exactly two, and nothing otherwise."
      counted_days: "The replacement days are the replacement base days plus the off-cycle adjustment, the continuity days, the prior-replacement adjustment and the stable-therapy days, never fewer than one day, and then the weekend roll is added."
      replacement_last_index: "The replacement's last day is today plus the replacement days less one day"
      replacement_roll: "the weekend roll adds two days to a last day that falls on a Saturday, one day to a last day that falls on a Sunday, and nothing to a last day on a weekday."
      result: "The replacement days are the replacement base days plus the off-cycle adjustment, the continuity days, the prior-replacement adjustment and the stable-therapy days, never fewer than one day, and then the weekend roll is added."
    factors:
    - id: replacement_base_days
      effect: method
      decides: base_days
      bindings: [replaced_drug, refill_supply, refill_elapsed, refill_schedule, base_days]
      ladder:
      - when: "the drug is a controlled substance (schedule CII to CV)"
        method: "days to the ordinary controlled refill date: whole days of the controlled refill percent of the latest refill's days supply, less the days since it was filled"
      - when: "the drug is not controlled and has two or more paid refills in the last three months"
        method: "the same count at the ordinary refill percent"
      - when: "otherwise"
        method: "the days still on hand (days supply less days since the fill)"
      baseline:
        base_days: "MX(1, refill_supply - refill_elapsed)"
      evidence: [history, date, tier_param]
      cross_difficulty: null
    - id: offcycle_adjustment
      effect: parameter
      decides: offcycle_adjustment
      bindings: [offcycle_count, offcycle_adjustment]
      ladder:
      - when: "three or more emergency supplies, transition fills and vacation fills on the coverage in the last month"
        value: "K('offcycle_adjust_many') (minus four days)"
      - when: "one or two"
        value: "K('offcycle_adjust_some') (minus two days)"
      - when: "otherwise (none)"
        value: "0"
      baseline:
        offcycle_adjustment: "0"
      evidence: [history]
      cross_difficulty: null
    - id: continuity_days
      effect: parameter
      decides: continuity_days
      bindings: [bh_claims, continuity_days]
      ladder:
      - when: "controlled substance and two or more paid behavioral health visits in the last two months"
        value: "K('continuity_two') (six days)"
      - when: "controlled substance and exactly one such visit"
        value: "K('continuity_one') (four days)"
      - when: "otherwise"
        value: "0"
      baseline:
        continuity_days: "0"
      evidence: [cross_category, history]
      cross_difficulty: plan
    - id: prior_replacement_adjustment
      effect: parameter
      decides: prior_adjustment
      bindings: [prior_replacements, prior_adjustment]
      ladder:
      - when: "two or more lost or stolen overrides on the coverage in twelve months"
        value: "K('prior_two') (minus three days)"
      - when: "exactly one"
        value: "K('prior_one') (minus two days)"
      - when: "otherwise (none)"
        value: "0"
      baseline:
        prior_adjustment: "0"
      evidence: [history]
      cross_difficulty: null
    - id: stable_therapy_days
      effect: parameter
      decides: stable_days
      bindings: [drug_refills, stable_days]
      ladder:
      - when: "three or more paid refills of the drug in the last three months"
        value: "K('stable_three') (three days)"
      - when: "exactly two"
        value: "K('stable_two') (one day)"
      - when: "otherwise"
        value: "0"
      baseline:
        stable_days: "0"
      evidence: [history]
      cross_difficulty: null
    - id: replacement_weekend_roll
      effect: parameter
      decides: replacement_roll
      bindings: [replacement_last_index, replacement_roll]
      ladder:
      - when: "the replacement's last day falls on a Saturday"
        value: "K('roll_saturday') (two days added)"
      - when: "the replacement's last day falls on a Sunday"
        value: "K('roll_sunday') (one day added)"
      - when: "otherwise (a weekday)"
        value: "0"
      baseline:
        replacement_roll: "0"
      evidence: [date]
      cross_difficulty: null
    baseline:
      rule: >-
        The standard replacement is the days still on hand from the latest paid refill, which are that
        refill's days supply less the calendar days since it was filled, never fewer than one day.
      params: [max_days_supply]
    inputs:
      history:
      - {table: rx_fills, aggregate: latest, field: days_supply, filters: {event_type: rx_fill, fill_type: refill}}
      - {table: rx_fills, aggregate: count, field: rx_fill_id, within_months: 1, filters: {event_type: rx_emergency_supply}}
      - {table: rx_exceptions, aggregate: count, field: rx_exception_id, within_months: 12, filters: {event_type: rx_refill_override, request_type: lost_stolen_override}}
      - {category: plan, table: plan_claims, aggregate: count, field: plan_claim_id, within_months: 2, filters: {event_type: plan_claim_booked, service_category: behavioral_health_visit, adjudication_status: paid}}
      cross_category: [plan]
