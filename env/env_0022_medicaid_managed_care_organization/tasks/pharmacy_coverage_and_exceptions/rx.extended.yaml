# Product charter: Pharmacy Benefit. Output of erl-scenario-blueprint.
category: rx
display_name: Pharmacy Benefit
binding:
  holding_table: rx_coverages
  event_tables:
  - rx_fills
  - rx_exceptions
  - rx_otc_ledger
  status_field: status
  variant_field: variant_name
  quantity_fields:
    otc_balance: otc_allowance
lifecycle:
  states:
  - pending
  - active
  - restricted
  - terminated
  transitions:
  - from: pending
    to: active
    by: system
    means: The pharmacy benefit becomes effective with the plan membership.
  - from: pending
    to: terminated
    by: system
    means: The membership is cancelled before it starts.
  - from: active
    to: restricted
    by: system
    means: The member is placed in the restricted recipient (lock-in) program after notice.
  - from: restricted
    to: active
    by: system
    means: The lock-in period ends or the lock-in is reversed.
  - from: active
    to: terminated
    by: system
    means: The pharmacy benefit ends with the membership or a change of plan category.
  - from: restricted
    to: terminated
    by: system
    means: The pharmacy benefit ends during a lock-in.
accounts:
- key: otc_allowance
  unit: USD
  meaning: >-
    Over-the-counter allowance loaded for the quarter and not yet spent or forfeited; the integral view
    is rx_coverages.otc_balance.
- key: rx_cost_share
  unit: USD
  meaning: >-
    Pharmacy copays assessed on paid fills net of reversals; counted toward the plan's aggregate cost-sharing
    cap.
parameter_schema:
  plan_category_map: >-
    Plan eligibility categories whose members hold this pharmacy benefit plan (list of official plan category
    names; empty where assignment rests on nursing facility residence instead).
  copay_generic_usd: Member copay per paid fill of a preferred generic drug (USD, 2 decimals).
  copay_preferred_brand_usd: Member copay per paid fill of a preferred brand drug (USD, 2 decimals).
  copay_nonpreferred_usd: >-
    Member copay per paid fill of a non-preferred drug approved by exception (USD, 2 decimals).
  copay_specialty_usd: Member copay per paid fill of a specialty drug (USD, 2 decimals).
  copay_otc_covered_usd: >-
    Member copay per paid fill of a covered over-the-counter drug with a prescription (USD, 2 decimals).
  copay_exempt_drug_classes: Drug classes that never carry a copay (list).
  monthly_rx_limit_applies: Whether paid fills per calendar month are capped (boolean).
  monthly_rx_limit: >-
    Most paid fills in one calendar month within monthly_limit_scope (integer fills; 0 where no cap applies).
  monthly_limit_scope: Which fills count toward the monthly cap (enum string).
  max_days_supply: Most days supply of one fill of a non-maintenance drug (integer days).
  maintenance_90_day_allowed: Whether a maintenance drug may be filled for 90 days after two 34-day fills
    (boolean).
  early_refill_pct: >-
    Percent of the prior fill's days supply that must have elapsed before a refill pays (integer percent).
  early_refill_pct_controlled: Same threshold for controlled substances CII-CV (integer percent).
  vacation_override_per_12_months: Vacation early-refill overrides per drug within a rolling 365 days
    (integer).
  vacation_override_max_days: Most extra days supply one vacation override releases (integer days).
  lost_stolen_override_per_12_months: Lost or stolen early-refill overrides per drug within a rolling
    365 days (integer).
  lost_stolen_controlled_requires_police_report: >-
    Whether a lost or stolen override for a controlled substance needs a police report number (boolean).
  emergency_supply_days: >-
    Days supply dispensed as an emergency supply while a prior authorization or exception is pending (integer
    days).
  emergency_supply_per_request: Emergency supplies per pending request per drug (integer).
  pa_decision_hours: >-
    Hours after receipt within which a prior authorization or exception request is decided (integer hours).
  exception_approval_months: Calendar months an approved exception lasts from the approval date (integer
    months).
  step_therapy_trials_required: >-
    Preferred alternatives that must have been tried and failed before a step therapy exception is approved
    (integer trials).
  step_therapy_lookback_days: Calendar days of fill history searched for the required trials (integer
    days).
  quantity_limit_exception_months: Calendar months an approved quantity limit exception lasts (integer
    months).
  brand_medically_necessary_requires_medwatch: Whether a brand-medically-necessary request needs a submitted
    FDA MedWatch form (boolean).
  member_can_initiate_exception: >-
    Whether the member may start an exception request, completed by the prescriber's statement (boolean).
  prescriber_statement_required: >-
    Whether a prescriber supporting statement is needed before an exception is decided (boolean).
  exception_denial_notice_business_days: Business days after a denial within which written notice is mailed
    (integer days).
  otc_quarterly_allowance_usd: >-
    Over-the-counter allowance loaded on the first day of each calendar quarter (USD, 2 decimals).
  otc_rollover: Whether unused OTC allowance carries into the next quarter (boolean).
  otc_channels: Channels where the OTC allowance may be spent (list).
  otc_mail_orders_per_quarter: Mail catalog and online orders allowed per quarter (integer orders).
  lock_in_eligible: Whether the member can be placed in the restricted recipient (lock-in) program (boolean).
  lock_in_duration_months: Calendar months a lock-in lasts from lock_in start (integer months; 0 where
    not eligible).
  lock_in_trigger_prescribers_90d: >-
    Distinct prescribers of controlled substances within 90 days that trigger lock-in review (integer;
    0 where not eligible).
  lock_in_trigger_pharmacies_90d: >-
    Distinct pharmacies filling controlled substances within 90 days that trigger lock-in review (integer;
    0 where not eligible).
  lock_in_notice_days: >-
    Calendar days of advance notice before a lock-in starts (integer days; 0 where not eligible).
  lock_in_pharmacy_change_per_12_months: >-
    Member-requested changes of lock-in pharmacy within a rolling 365 days (integer; 0 where not eligible).
  lock_in_emergency_override_allowed: >-
    Whether an emergency fill at another pharmacy is allowed during lock-in when the lock-in pharmacy
    is closed or out of stock (boolean).
  mme_daily_limit: >-
    Highest daily morphine milligram equivalent that pays without prior authorization (integer MME).
  opioid_naive_initial_days_supply: >-
    Most days supply of a first opioid fill for a member with no opioid fill in the prior 90 days (integer
    days).
  controlled_substance_refills_max: Most refills on one CIII-CV prescription (integer).
  specialty_pharmacy_required: Whether specialty drugs must be filled at the designated specialty pharmacy
    (boolean).
  mail_order_available: Whether maintenance drugs may be filled by mail (boolean).
  generic_substitution_mandatory: >-
    Whether an A-rated generic must be dispensed unless brand medically necessary is approved (boolean).
  part_d_primary: >-
    Whether Medicare Part D pays first and Medicaid covers only drugs Part D excludes (boolean).
  reversal_window_days: >-
    Calendar days after the fill date within which a pharmacy may reverse a paid fill (integer days).
  transition_fill_window_days: >-
    Calendar days after the rx coverage effective_date during which a non-formulary drug the member was
    already taking pays once as a transition fill (integer days; 0 where not applicable).
  transition_fill_days_supply: Most days supply of the one transition fill (integer days).
