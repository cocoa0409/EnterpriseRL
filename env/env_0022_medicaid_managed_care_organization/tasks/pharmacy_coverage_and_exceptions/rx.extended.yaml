  rule: >-
    A refill pays only after early_refill_pct of the prior fill's days supply has elapsed, or early_refill_pct_controlled
    for a controlled substance, and is otherwise rejected with reject_code refill_too_soon. An early refill
    override may be granted per drug for vacation up to vacation_override_per_12_months and for a lost
