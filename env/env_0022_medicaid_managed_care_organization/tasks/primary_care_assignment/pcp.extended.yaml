- id: pcp_ext_continuity_of_care
  base_policy_refs:
  - pcp_referrals
  - pcp_provider_exit
  overwrite:
  - base_policy: pcp_provider_exit
    superseded_clause: A member in active treatment may keep seeing the exiting provider for continuity_of_care_days after the exit date
    replaced_by: 'For the continuity visits recorded on a continuity-of-care referral, the period after the exit date during which the member may keep seeing the exiting provider is the continuity window set out here, in place of a fixed continuity-of-care period for every member in active treatment. The continuity window depends on the member''s eligibility category and recent treatment: a member whose plan membership is in the Prairie Ridge ABD Care or Prairie Ridge Dual Complete category and who had at least the active-treatment count of visits with the assigned provider in the last quarter receives the extended continuity window; a member who meets exactly one of those two conditions receives the intermediate continuity window; a member who meets neither receives the practice type''s continuity-of-care days.'
  trigger: on_request
  subject:
  - pcp_referral_issue
  computes: referral_visits
  target_tool: elect_continuity_of_care_ec21b6d4
  params:
    recent_use_window_months: 6
    frequent_use_visits: 4
    quarter_months: 3
    half_year_months: 6
    active_treatment_visits: 3
    extended_window_days: 135
    intermediate_window_days: 105
    standard_rate: 2
    maintenance_rate: 1
    rate_period_days: 90
    monitoring_window_months: 3
    comanage_large: 2
    comanage_small: 1
    many_er: 2
    er_large: 2
    er_small: 1
    minimum_visits: 1
  rule: 'When the provider of a member''s active assignment is leaving the network, a member in active treatment may elect to keep seeing that provider after the network exit date; the election is recorded as a continuity-of-care referral to the exiting provider on the active assignment, and it records the visits the member may have with that provider in the continuity window that begins on the exit date. A member is in active treatment with the exiting provider when the member had at least one visit with that provider in the last year; the visits in the last half-year then set the continuity rate as described below, and a member whose visits all fall earlier than the last half-year is still in active treatment. For a member with at least the frequent-use count of paid specialist-visit claims in the recent-use window, the visits of a continuity-of-care referral are not fixed until the active assignment carries a standing referral. The continuity window is the practice type''s continuity-of-care days, and the member is expected to see the provider at the standard continuity rate of visits per ninety-day period. The window visits are the rate multiplied by the window days and divided by the ninety-day period, rounded up to a whole visit, and the visits recorded are never fewer than one and never more than the practice type''s single-referral visit ceiling. For the continuity visits recorded on a continuity-of-care referral, the period after the exit date during which the member may keep seeing the exiting provider is the continuity window set out here, in place of a fixed continuity-of-care period for every member in active treatment. The continuity window depends on the member''s eligibility category and recent treatment: a member whose plan membership is in the Prairie Ridge ABD Care or Prairie Ridge Dual Complete category and who had at least the active-treatment count of visits with the assigned provider in the last quarter receives the extended continuity window; a member who meets exactly one of those two conditions receives the intermediate continuity window; a member who meets neither receives the practice type''s continuity-of-care days. The continuity rate is set by how often the member has been seeing the assigned provider in the last half-year: a member with at least the active-treatment count of visits in the last half-year keeps the current cadence, so the rate is the number of visits with the assigned provider in the last quarter; a member with one visit, or more but fewer than the active-treatment count, in the last half-year is set at the maintenance continuity rate; a member with no visit in the last half-year is set at the standard continuity rate. A co-management reduction is taken for care shared with a specialist: a member whose active assignment carries a standing referral and who also has a paid specialty-tier pharmacy fill in the monitoring window takes the larger co-management reduction; a member who meets exactly one of those two conditions takes the smaller co-management reduction; a member who meets neither takes no reduction. Emergency follow-up visits are added, counted as the member''s paid emergency-room claims for emergencies with a service date in the recent-use window: two or more add the larger follow-up allowance, exactly one adds the smaller follow-up allowance, and none adds nothing. The continuity visits are worked out in this order: first the window visits are taken from the rate and the window and rounded up; then the co-management reduction is subtracted from that figure and the emergency follow-up visits are added; then the floor of one visit and the ceiling are applied to the result. The last quarter, the last half-year and the last year are trailing periods of three, six and twelve whole months counted back from the handling date, not calendar quarters, halves or years; every look-back window named in this rule is a trailing period counted back from the handling date in whole months: a record is inside a window of a given number of months when fewer than that number of whole months separate its date from the handling date, so a record dated exactly that number of months back is outside it.'
  prerequisite:
  - problem: pcp_ext_standing_referral
    kind: value_input
    gate: comanagement_reduction
    form: state
    policy_source: For a member with at least the frequent-use count of paid specialist-visit claims in the recent-use window, the visits of a continuity-of-care referral are not fixed until the active assignment carries a standing referral.
    condition: When the member has at least four paid plan_claims rows with service_category specialist_visit in the last six months, the active pcp_assignments row carries a pcp_referral_issue row with referral_type standing.
    resolved_by: issue_standing_referral_d300bbad
    effect: Once the standing referral is on the active assignment, standing_on_record becomes at least one, so for a member with a specialty-tier fill the co-management reduction moves from the smaller to the larger reduction and the continuity visits fall by one.
  cross_category:
  - category: plan
    as: history
    reads:
    - variant_name
    - plan_claims.service_date
    - plan_claims.service_category
    - plan_claims.adjudication_status
    note: continuity window (category) and emergency follow-up visits (emergency-room claims).
  - category: rx
    as: history
    reads:
    - rx_fills.fill_date
    - rx_fills.event_type
    - rx_fills.formulary_status
    note: co-management reduction reads specialty-tier fills.
  compute:
  - visits_last_quarter: COUNT('pcp_visits', within_months=K('quarter_months'), date_field='visit_date')
  - complex_category: CFIELD('plan','variant_name') == 'Prairie Ridge ABD Care' or CFIELD('plan','variant_name') == 'Prairie Ridge Dual Complete'
  - window_days: K('extended_window_days') if (complex_category and visits_last_quarter >= K('active_treatment_visits')) else (K('intermediate_window_days') if (complex_category or visits_last_quarter >= K('active_treatment_visits')) else P('continuity_of_care_days'))
  - visits_last_half_year: COUNT('pcp_visits', within_months=K('half_year_months'), date_field='visit_date')
  - continuity_rate: visits_last_quarter if visits_last_half_year >= K('active_treatment_visits') else (K('maintenance_rate') if visits_last_half_year >= 1 else K('standard_rate'))
  - window_visits: (continuity_rate * window_days + K('rate_period_days') - 1) // K('rate_period_days')
  - standing_on_record: COUNT('pcp_events', event_type='pcp_referral_issue', referral_type='standing')
  - specialty_fills: XCOUNT('rx','rx_fills', within_months=K('monitoring_window_months'), date_field='fill_date', event_type='rx_fill', formulary_status='specialty')
  - comanagement_reduction: K('comanage_large') if (standing_on_record >= 1 and specialty_fills >= 1) else (K('comanage_small') if (standing_on_record >= 1 or specialty_fills >= 1) else 0)
  - emergency_claims: XCOUNT('plan','plan_claims', within_months=K('recent_use_window_months'), date_field='service_date', service_category='emergency_room_emergency', adjudication_status='paid')
  - emergency_followup: K('er_large') if emergency_claims >= K('many_er') else (K('er_small') if emergency_claims >= 1 else 0)
  - result: MN(P('referral_max_visits'), MX(K('minimum_visits'), window_visits - comanagement_reduction + emergency_followup))
  compute_basis:
    visits_last_quarter: 'For the continuity visits recorded on a continuity-of-care referral, the period after the exit date during which the member may keep seeing the exiting provider is the continuity window set out here, in place of a fixed continuity-of-care period for every member in active treatment. The continuity window depends on the member''s eligibility category and recent treatment: a member whose plan membership is in the Prairie Ridge ABD Care or Prairie Ridge Dual Complete category and who had at least the active-treatment count of visits with the assigned provider in the last quarter receives the extended continuity window; a member who meets exactly one of those two conditions receives the intermediate continuity window; a member who meets neither receives the practice type''s continuity-of-care days. The last quarter, the last half-year and the last year are trailing periods of three, six and twelve whole months counted back from the handling date, not calendar quarters, halves or years; every look-back window named in this rule is a trailing period counted back from the handling date in whole months: a record is inside a window of a given number of months when fewer than that number of whole months separate its date from the handling date, so a record dated exactly that number of months back is outside it.'
    complex_category: 'For the continuity visits recorded on a continuity-of-care referral, the period after the exit date during which the member may keep seeing the exiting provider is the continuity window set out here, in place of a fixed continuity-of-care period for every member in active treatment. The continuity window depends on the member''s eligibility category and recent treatment: a member whose plan membership is in the Prairie Ridge ABD Care or Prairie Ridge Dual Complete category and who had at least the active-treatment count of visits with the assigned provider in the last quarter receives the extended continuity window; a member who meets exactly one of those two conditions receives the intermediate continuity window; a member who meets neither receives the practice type''s continuity-of-care days.'
    window_days: 'For the continuity visits recorded on a continuity-of-care referral, the period after the exit date during which the member may keep seeing the exiting provider is the continuity window set out here, in place of a fixed continuity-of-care period for every member in active treatment. The continuity window depends on the member''s eligibility category and recent treatment: a member whose plan membership is in the Prairie Ridge ABD Care or Prairie Ridge Dual Complete category and who had at least the active-treatment count of visits with the assigned provider in the last quarter receives the extended continuity window; a member who meets exactly one of those two conditions receives the intermediate continuity window; a member who meets neither receives the practice type''s continuity-of-care days.'
    visits_last_half_year: 'The continuity rate is set by how often the member has been seeing the assigned provider in the last half-year: a member with at least the active-treatment count of visits in the last half-year keeps the current cadence, so the rate is the number of visits with the assigned provider in the last quarter; a member with one visit, or more but fewer than the active-treatment count, in the last half-year is set at the maintenance continuity rate; a member with no visit in the last half-year is set at the standard continuity rate. The last quarter, the last half-year and the last year are trailing periods of three, six and twelve whole months counted back from the handling date, not calendar quarters, halves or years; every look-back window named in this rule is a trailing period counted back from the handling date in whole months: a record is inside a window of a given number of months when fewer than that number of whole months separate its date from the handling date, so a record dated exactly that number of months back is outside it.'
    continuity_rate: 'The continuity rate is set by how often the member has been seeing the assigned provider in the last half-year: a member with at least the active-treatment count of visits in the last half-year keeps the current cadence, so the rate is the number of visits with the assigned provider in the last quarter; a member with one visit, or more but fewer than the active-treatment count, in the last half-year is set at the maintenance continuity rate; a member with no visit in the last half-year is set at the standard continuity rate.'
    window_visits: The window visits are the rate multiplied by the window days and divided by the ninety-day period, rounded up to a whole visit, and the visits recorded are never fewer than one and never more than the practice type's single-referral visit ceiling.
    standing_on_record: 'A co-management reduction is taken for care shared with a specialist: a member whose active assignment carries a standing referral and who also has a paid specialty-tier pharmacy fill in the monitoring window takes the larger co-management reduction; a member who meets exactly one of those two conditions takes the smaller co-management reduction; a member who meets neither takes no reduction.'
    specialty_fills: 'A co-management reduction is taken for care shared with a specialist: a member whose active assignment carries a standing referral and who also has a paid specialty-tier pharmacy fill in the monitoring window takes the larger co-management reduction; a member who meets exactly one of those two conditions takes the smaller co-management reduction; a member who meets neither takes no reduction.'
    comanagement_reduction: 'A co-management reduction is taken for care shared with a specialist: a member whose active assignment carries a standing referral and who also has a paid specialty-tier pharmacy fill in the monitoring window takes the larger co-management reduction; a member who meets exactly one of those two conditions takes the smaller co-management reduction; a member who meets neither takes no reduction.'
    emergency_claims: 'Emergency follow-up visits are added, counted as the member''s paid emergency-room claims for emergencies with a service date in the recent-use window: two or more add the larger follow-up allowance, exactly one adds the smaller follow-up allowance, and none adds nothing.'
    emergency_followup: 'Emergency follow-up visits are added, counted as the member''s paid emergency-room claims for emergencies with a service date in the recent-use window: two or more add the larger follow-up allowance, exactly one adds the smaller follow-up allowance, and none adds nothing.'
    result: 'The continuity visits are worked out in this order: first the window visits are taken from the rate and the window and rounded up; then the co-management reduction is subtracted from that figure and the emergency follow-up visits are added; then the floor of one visit and the ceiling are applied to the result. The window visits are the rate multiplied by the window days and divided by the ninety-day period, rounded up to a whole visit, and the visits recorded are never fewer than one and never more than the practice type''s single-referral visit ceiling.'
  factors:
  - id: continuity_window
    effect: parameter
    decides: window_days
    bindings:
    - visits_last_quarter
    - complex_category
    - window_days
    ladder:
    - when: plan membership in Prairie Ridge ABD Care or Prairie Ridge Dual Complete AND at least the active-treatment count of visits with the assigned provider in the last quarter
      value: K('extended_window_days')
    - when: exactly one of those two conditions
      value: K('intermediate_window_days')
    - when: otherwise
      value: P('continuity_of_care_days')
    baseline:
      window_days: P('continuity_of_care_days')
    evidence:
    - history
    - cross_category
    cross_difficulty: plan
  - id: continuity_rate
    effect: method
    decides: continuity_rate
    bindings:
    - visits_last_half_year
    - continuity_rate
    ladder:
    - when: at least the active-treatment count of visits with the assigned provider in the last half-year
      method: 'take the rate from the current cadence: the number of visits with the assigned provider in the last quarter'
    - when: one visit, or more but fewer than the active-treatment count, in the last half-year
      method: use the fixed maintenance continuity rate
    - when: otherwise (no visit in the last half-year)
      method: use the standard continuity rate
    baseline:
      continuity_rate: K('standard_rate')
    evidence:
    - history
    cross_difficulty: null
  - id: co_management
    effect: parameter
    decides: comanagement_reduction
    bindings:
    - standing_on_record
    - specialty_fills
    - comanagement_reduction
    ladder:
    - when: the active assignment carries a standing referral AND a paid specialty-tier fill in the monitoring window
      value: K('comanage_large')
    - when: exactly one of those two conditions
      value: K('comanage_small')
    - when: otherwise
      value: '0'
    baseline:
      comanagement_reduction: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: rx
  - id: emergency_followup
    effect: parameter
    decides: emergency_followup
    bindings:
    - emergency_claims
    - emergency_followup
    ladder:
    - when: two or more paid emergency-room claims for emergencies in the recent-use window
      value: K('er_large')
    - when: exactly one such claim
      value: K('er_small')
    - when: otherwise (none)
      value: '0'
    baseline:
      emergency_followup: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: plan
  baseline:
    rule: The continuity window is the practice type's continuity-of-care days, and the member is expected to see the provider at the standard continuity rate of visits per ninety-day period. The window visits are the rate multiplied by the window days and divided by the ninety-day period, rounded up to a whole visit, and the visits recorded are never fewer than one and never more than the practice type's single-referral visit ceiling.
    params:
    - continuity_of_care_days
    - standard_rate
    - rate_period_days
    - minimum_visits
    - referral_max_visits
  inputs:
    history:
    - table: pcp_visits
      aggregate: count
      field: pcp_visit_id
      within_months: 3
      filters: {}
    - table: pcp_visits
      aggregate: count
      field: pcp_visit_id
      within_months: 6
      filters: {}
    - table: pcp_events
      aggregate: count
      field: pcp_event_id
      filters:
        event_type: pcp_referral_issue
        referral_type: standing
    - category: rx
      table: rx_fills
      aggregate: count
      field: rx_fill_id
      within_months: 3
      filters:
        event_type: rx_fill
        formulary_status: specialty
    - category: plan
      table: plan_claims
      aggregate: count
      field: plan_claim_id
      within_months: 6
      filters:
        service_category: emergency_room_emergency
        adjudication_status: paid
    cross_category:
    - plan
    - rx
- id: pcp_ext_specialist_referral
  base_policy_refs:
  - pcp_referrals
  overwrite: []
  trigger: on_request
  subject:
  - pcp_referral_issue
  computes: referral_visits
  target_tool: issue_specialist_referral_96d4855f
  params:
    specialist_window_months: 12
    active_use_visits: 2
    surgical_care_visits: 8
    active_care_visits: 6
    standard_visits: 4
    review_two: 2
    review_one: 1
    far_miles: 30.0
    middle_miles: 15.0
    travel_two: 2
    travel_one: 1
    medication_window_months: 3
    medication_two: 2
    medication_one: 1
    emergency_window_months: 6
    many_emergencies: 2
    followup_two: 2
    followup_one: 1
    months_per_year: 12
  rule: 'A single specialist referral is issued by the member''s active assignment to one named in-network specialist, and it records the number of visits the referral covers during its validity. A single referral covers the standard referral visits. The visits covered never exceed the practice type''s single-referral visit ceiling. The core visits depend on the member''s specialist use and on surgical planning: a member with at least the active-use count of paid specialist-visit claims with a service date in the specialist look-back window and who also has an Elective Inpatient and Surgical Authorization request on file in submitted, pended-for-information or approved status receives the surgical-care visits; a member who meets exactly one of those two conditions receives the active-care visits; a member who meets neither receives the standard referral visits. Result-review visits are added for completed work-up: a member who holds an approved Advanced Imaging Authorization and also an approved Outpatient Rehabilitation Therapy Authorization receives the two-visit review allowance; a member who holds exactly one of the two receives the one-visit review allowance; a member who holds neither receives no review visit. Travel visits are added for members who travel far for care, measured as the longest one-way distance of the member''s completed medical-appointment transportation legs on record: at least the far distance adds the two-visit travel allowance, at least the middle distance but less than the far distance adds the one-visit travel allowance, and anything shorter, or no such leg, adds nothing. Medication-review visits are added according to the member''s paid pharmacy fills with a fill date in the medication window: a member with a specialty-tier fill adds the two-visit medication allowance; a member with no specialty-tier fill but with a preferred-brand or non-preferred fill adds the one-visit medication allowance; any other member adds nothing. Emergency follow-up visits are added, counted as the member''s paid emergency-room claims for emergencies with a service date in the emergency look-back window: two or more add the two-visit follow-up allowance, exactly one adds the one-visit follow-up allowance, and none adds nothing. The visit total is aligned to the member''s eligibility period: while the plan membership is in renewal-due status the visit total is multiplied by the calendar days from the handling date to the renewal due date and divided by the practice type''s referral validity days; while the plan membership is active and its renewal due date is fewer than twelve whole months after the handling date, the visit total is multiplied by those whole months and divided by twelve; in every other case the visit total is not aligned. The referral visits are worked out in this order: first the core visits and the review, travel, medication and emergency follow-up visits are added into the visit total; then the eligibility alignment is applied to that total and the product is rounded down to a whole visit; then the ceiling is applied to the rounded figure. Every look-back window named in this rule is a trailing period counted back from the handling date in whole months: a record is inside a window of a given number of months when fewer than that number of whole months separate its date from the handling date, so a record dated exactly that number of months back is outside it.'
  prerequisite: []
  cross_category:
  - category: plan
    as: history
    reads:
    - status
    - renewal_due_date
    - plan_claims.service_date
    - plan_claims.service_category
    - plan_claims.adjudication_status
    note: core visits (specialist claims), emergency follow-up (emergency claims) and eligibility alignment (status, renewal due date).
  - category: auth
    as: branch
    reads:
    - variant_name
    - status
    note: core visits read the surgical authorization request; review visits read approved imaging and rehabilitation authorizations.
  - category: ride
    as: history
    reads:
    - ride_trips.one_way_miles
    - ride_trips.event_type
    - ride_trips.trip_purpose
    note: travel visits read the longest completed medical-appointment leg.
  - category: rx
    as: history
    reads:
    - rx_fills.fill_date
    - rx_fills.event_type
    - rx_fills.formulary_status
    note: medication-review visits read specialty-tier and brand fills.
  compute:
  - specialist_claims: XCOUNT('plan','plan_claims', within_months=K('specialist_window_months'), date_field='service_date', service_category='specialist_visit', adjudication_status='paid')
  - surgical_request: EXISTS('auth', variant_name='Elective Inpatient and Surgical Authorization', status='submitted') or EXISTS('auth', variant_name='Elective Inpatient and Surgical Authorization', status='pended_info') or EXISTS('auth', variant_name='Elective Inpatient and Surgical Authorization', status='approved')
  - core_visits: K('surgical_care_visits') if (specialist_claims >= K('active_use_visits') and surgical_request) else (K('active_care_visits') if (specialist_claims >= K('active_use_visits') or surgical_request) else K('standard_visits'))
  - imaging_approved: EXISTS('auth', variant_name='Advanced Imaging Authorization', status='approved')
  - rehab_approved: EXISTS('auth', variant_name='Outpatient Rehabilitation Therapy Authorization', status='approved')
  - review_visits: K('review_two') if (imaging_approved and rehab_approved) else (K('review_one') if (imaging_approved or rehab_approved) else 0)
  - longest_leg_miles: XMAX('ride','ride_trips','one_way_miles', event_type='ride_trip_completed', trip_purpose='medical_appointment')
  - travel_visits: K('travel_two') if longest_leg_miles >= K('far_miles') else (K('travel_one') if longest_leg_miles >= K('middle_miles') else 0)
  - specialty_fills: XCOUNT('rx','rx_fills', within_months=K('medication_window_months'), date_field='fill_date', event_type='rx_fill', formulary_status='specialty')
  - brand_fills: XCOUNT('rx','rx_fills', within_months=K('medication_window_months'), date_field='fill_date', event_type='rx_fill', formulary_status='preferred_brand') + XCOUNT('rx','rx_fills', within_months=K('medication_window_months'), date_field='fill_date', event_type='rx_fill', formulary_status='non_preferred')
  - medication_visits: K('medication_two') if specialty_fills >= 1 else (K('medication_one') if brand_fills >= 1 else 0)
  - emergency_claims: XCOUNT('plan','plan_claims', within_months=K('emergency_window_months'), date_field='service_date', service_category='emergency_room_emergency', adjudication_status='paid')
  - followup_visits: K('followup_two') if emergency_claims >= K('many_emergencies') else (K('followup_one') if emergency_claims >= 1 else 0)
  - visit_total: core_visits + review_visits + travel_visits + medication_visits + followup_visits
  - membership_status: CFIELD('plan','status')
  - renewal_due: CFIELD('plan','renewal_due_date')
  - eligibility_share: (DAYS(NOW, renewal_due) / P('referral_validity_days')) if membership_status == 'renewal_due' else ((MONTHS(NOW, renewal_due) / K('months_per_year')) if (membership_status == 'active' and MONTHS(NOW, renewal_due) < K('months_per_year')) else 1)
  - aligned_total: int(RND(visit_total * eligibility_share, 6))
  - result: MN(P('referral_max_visits'), aligned_total)
  compute_basis:
