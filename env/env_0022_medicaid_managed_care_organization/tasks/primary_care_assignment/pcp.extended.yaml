  - pcp_assign
  rule: >-
    Changes made for member_preference are limited per rolling 365 days by the change limit of the practice
    type the member is leaving. A member_preference change is accepted only when pcp_msr_changes_365d
    is below member_changes_per_365_days of the currently active assignment. Changes for provider_left_network,
    provider_dismissal, moved_residence, access_problem, age_out and family_alignment never count toward
    the limit and are allowed at any time. A request is accepted only through a channel listed in change_channels,
    and the member's own statement of the reason is recorded; provider_left_network and provider_dismissal
    must match a notice already on the member's record.
