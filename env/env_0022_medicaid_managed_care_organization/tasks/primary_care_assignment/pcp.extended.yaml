  factors:
  - id: core_visits
    effect: parameter
    decides: core_visits
    bindings:
    - specialist_claims
    - surgical_request
    - core_visits
    ladder:
    - when: at least the active-use count of paid specialist-visit claims in the specialist look-back window AND an Elective Inpatient and Surgical Authorization request in submitted, pended-for-information or approved status
      value: K('surgical_care_visits')
    - when: exactly one of those two conditions
      value: K('active_care_visits')
    - when: otherwise
      value: K('standard_visits')
    baseline:
      core_visits: K('standard_visits')
    evidence:
    - history
    - cross_category
    cross_difficulty: auth
  - id: result_review
    effect: parameter
    decides: review_visits
    bindings:
    - imaging_approved
    - rehab_approved
    - review_visits
    ladder:
    - when: an approved Advanced Imaging Authorization AND an approved Outpatient Rehabilitation Therapy Authorization
      value: K('review_two')
    - when: exactly one of the two
      value: K('review_one')
    - when: otherwise
      value: '0'
    baseline:
      review_visits: '0'
    evidence:
    - cross_category
    cross_difficulty: auth
  - id: travel_distance
    effect: parameter
    decides: travel_visits
    bindings:
    - longest_leg_miles
    - travel_visits
    ladder:
    - when: longest completed medical-appointment leg at least the far distance
      value: K('travel_two')
    - when: at least the middle distance but less than the far distance
      value: K('travel_one')
    - when: otherwise (shorter, or no such leg)
      value: '0'
    baseline:
      travel_visits: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: ride
  - id: medication_review
    effect: parameter
    decides: medication_visits
    bindings:
    - specialty_fills
    - brand_fills
    - medication_visits
    ladder:
    - when: a paid specialty-tier fill in the medication window
      value: K('medication_two')
    - when: no specialty-tier fill but a paid preferred-brand or non-preferred fill in the medication window
      value: K('medication_one')
    - when: otherwise
      value: '0'
    baseline:
      medication_visits: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: rx
  - id: emergency_followup
    effect: parameter
    decides: followup_visits
    bindings:
    - emergency_claims
    - followup_visits
    ladder:
    - when: two or more paid emergency-room claims for emergencies in the emergency look-back window
      value: K('followup_two')
    - when: exactly one such claim
      value: K('followup_one')
    - when: otherwise (none)
      value: '0'
    baseline:
      followup_visits: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: plan
  - id: eligibility_alignment
    effect: method
    decides: eligibility_share
    bindings:
    - membership_status
    - renewal_due
    - eligibility_share
    ladder:
    - when: plan membership in renewal-due status
      method: multiply the visit total by the calendar days to the renewal due date over the practice type's referral validity days
    - when: plan membership active AND renewal due date fewer than twelve whole months away
      method: multiply the visit total by the whole months to the renewal due date over twelve
    - when: otherwise
      method: leave the visit total unaligned
    baseline:
      eligibility_share: '1'
    evidence:
    - cross_category
    - date
    cross_difficulty: plan
  baseline:
