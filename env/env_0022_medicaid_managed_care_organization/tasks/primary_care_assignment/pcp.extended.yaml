    surgical_request: 'The core visits depend on the member''s specialist use and on surgical planning: a member with at least the active-use count of paid specialist-visit claims with a service date in the specialist look-back window and who also has an Elective Inpatient and Surgical Authorization request on file in submitted, pended-for-information or approved status receives the surgical-care visits; a member who meets exactly one of those two conditions receives the active-care visits; a member who meets neither receives the standard referral visits.'
    core_visits: 'The core visits depend on the member''s specialist use and on surgical planning: a member with at least the active-use count of paid specialist-visit claims with a service date in the specialist look-back window and who also has an Elective Inpatient and Surgical Authorization request on file in submitted, pended-for-information or approved status receives the surgical-care visits; a member who meets exactly one of those two conditions receives the active-care visits; a member who meets neither receives the standard referral visits.'
    imaging_approved: 'Result-review visits are added for completed work-up: a member who holds an approved Advanced Imaging Authorization and also an approved Outpatient Rehabilitation Therapy Authorization receives the two-visit review allowance; a member who holds exactly one of the two receives the one-visit review allowance; a member who holds neither receives no review visit.'
    rehab_approved: 'Result-review visits are added for completed work-up: a member who holds an approved Advanced Imaging Authorization and also an approved Outpatient Rehabilitation Therapy Authorization receives the two-visit review allowance; a member who holds exactly one of the two receives the one-visit review allowance; a member who holds neither receives no review visit.'
    review_visits: 'Result-review visits are added for completed work-up: a member who holds an approved Advanced Imaging Authorization and also an approved Outpatient Rehabilitation Therapy Authorization receives the two-visit review allowance; a member who holds exactly one of the two receives the one-visit review allowance; a member who holds neither receives no review visit.'
    longest_leg_miles: 'Travel visits are added for members who travel far for care, measured as the longest one-way distance of the member''s completed medical-appointment transportation legs on record: at least the far distance adds the two-visit travel allowance, at least the middle distance but less than the far distance adds the one-visit travel allowance, and anything shorter, or no such leg, adds nothing.'
    travel_visits: 'Travel visits are added for members who travel far for care, measured as the longest one-way distance of the member''s completed medical-appointment transportation legs on record: at least the far distance adds the two-visit travel allowance, at least the middle distance but less than the far distance adds the one-visit travel allowance, and anything shorter, or no such leg, adds nothing.'
    specialty_fills: 'Medication-review visits are added according to the member''s paid pharmacy fills with a fill date in the medication window: a member with a specialty-tier fill adds the two-visit medication allowance; a member with no specialty-tier fill but with a preferred-brand or non-preferred fill adds the one-visit medication allowance; any other member adds nothing.'
    brand_fills: 'Medication-review visits are added according to the member''s paid pharmacy fills with a fill date in the medication window: a member with a specialty-tier fill adds the two-visit medication allowance; a member with no specialty-tier fill but with a preferred-brand or non-preferred fill adds the one-visit medication allowance; any other member adds nothing.'
    medication_visits: 'Medication-review visits are added according to the member''s paid pharmacy fills with a fill date in the medication window: a member with a specialty-tier fill adds the two-visit medication allowance; a member with no specialty-tier fill but with a preferred-brand or non-preferred fill adds the one-visit medication allowance; any other member adds nothing.'
    emergency_claims: 'Emergency follow-up visits are added, counted as the member''s paid emergency-room claims for emergencies with a service date in the emergency look-back window: two or more add the two-visit follow-up allowance, exactly one adds the one-visit follow-up allowance, and none adds nothing.'
