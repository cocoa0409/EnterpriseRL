extended_policies:
- id: pcp_ext_referral_carryover
  base_policy_refs:
  - pcp_referrals
  overwrite: []
  trigger: on_request
  subject:
  - pcp_referral_issue
  computes: referral_visits
  target_tool: carry_over_referral_de0684af
  params:
    recent_window_months: 3
    middle_window_months: 6
    standard_window_months: 12
    bridge_two: 2
    bridge_one: 1
    relationship_window_months: 12
    repeat_many: 3
    repeat_some: 2
    relationship_two: 2
    relationship_one: 1
    rides_many: 4
    rides_some: 1
    legs_per_visit: 2
    travel_one: 1
  rule: 'A single referral that one of the member''s earlier primary care assignments issued, and that is still within its validity, is carried onto the member''s current active assignment under its original referral number and its original issue date, so that it keeps its own expiry, and the carried entry records the visits the referral still covers. The referral carried is the most recent single referral that the earlier assignment issued, and the referred specialist is the specialist named on that referral. The visits carried start from the visits recorded on the carried referral less the visits already used, where the visits already used are the member''s paid specialist-visit claims billed by the referred specialist with a service date in the standard look-back window, and a difference below zero counts as zero. The visits carried never exceed the single-referral visit ceiling of the practice type of the earlier assignment that issued the referral. Which paid claims count as already used depends on the age of the carried referral in whole months from its issue date to the handling date: a referral younger than the recent window counts only the claims with a service date in the recent window; a referral at least as old as the recent window but younger than the middle window counts only the claims in the middle window; any older referral counts the claims in the standard look-back window. Bridge visits are added for members with complex needs: a member whose plan membership is in the Prairie Ridge ABD Care or Prairie Ridge Dual Complete category and who also holds an approved Home Health Services Authorization receives the two-visit bridge; a member who meets exactly one of those two conditions receives the one-visit bridge; a member who meets neither receives no bridge visit. Relationship visits are added for an established specialist relationship, counted as the referrals the earlier assignment issued to the referred specialist with an issue date in the relationship window: three or more such referrals add the two-visit relationship allowance, exactly two add the one-visit relationship allowance, and fewer than two add nothing. Travel visits are added for members who ride to the specialist, based on the member''s completed outbound transportation legs to the referred specialist''s NPI with an appointment date in the middle window: for a member with four or more such legs the travel visits are worked out from the legs themselves, one visit for every two legs, rounded down; a member with one to three legs receives the flat one-visit travel allowance; a member with no leg receives no travel visit. The carried visits are worked out in this order: first the visits left are taken as the recorded visits less the visits already used, not below zero; then the bridge, relationship and travel visits are added to that figure; then the sum is compared with the ceiling and the lower of the two is carried; every figure is a whole number of visits, so no rounding arises. Every look-back window named in this rule is a trailing period counted back from the handling date in whole months: a record is inside a window of a given number of months when fewer than that number of whole months separate its date from the handling date, so a record dated exactly that number of months back is outside it.'
  prerequisite: []
  cross_category:
  - category: plan
    as: history
    reads:
    - variant_name
    - plan_claims.service_date
    - plan_claims.service_category
    - plan_claims.adjudication_status
    - plan_claims.provider_npi
    note: used-visit window (paid specialist claims by the referred specialist) and the complex-needs bridge (membership category).
  - category: auth
    as: existence
    reads:
    - variant_name
    - status
    note: the complex-needs bridge reads whether an approved Home Health Services Authorization is held.
  - category: ride
    as: history
    reads:
    - ride_trips.event_type
    - ride_trips.leg
    - ride_trips.destination_npi
    - ride_trips.appointment_date
    note: travel visits count completed outbound legs to the referred specialist.
  compute:
  - carried_specialist: LATEST('pcp_events','specialist_npi', event_type='pcp_referral_issue', referral_type='single')
  - carried_recorded_visits: LATEST('pcp_events','referral_visits', event_type='pcp_referral_issue', referral_type='single')
  - carried_issue_date: LATEST('pcp_events','event_date', event_type='pcp_referral_issue', referral_type='single')
  - carried_age_months: MONTHS(carried_issue_date, NOW)
  - used_recent: XCOUNT('plan','plan_claims', within_months=K('recent_window_months'), date_field='service_date', service_category='specialist_visit', adjudication_status='paid', provider_npi=carried_specialist)
  - used_middle: XCOUNT('plan','plan_claims', within_months=K('middle_window_months'), date_field='service_date', service_category='specialist_visit', adjudication_status='paid', provider_npi=carried_specialist)
  - used_standard: XCOUNT('plan','plan_claims', within_months=K('standard_window_months'), date_field='service_date', service_category='specialist_visit', adjudication_status='paid', provider_npi=carried_specialist)
  - used_visits: used_recent if carried_age_months < K('recent_window_months') else (used_middle if carried_age_months < K('middle_window_months') else used_standard)
  - visits_left: MX(0, carried_recorded_visits - used_visits)
  - complex_category: CFIELD('plan','variant_name') == 'Prairie Ridge ABD Care' or CFIELD('plan','variant_name') == 'Prairie Ridge Dual Complete'
  - home_health_approved: EXISTS('auth', variant_name='Home Health Services Authorization', status='approved')
  - bridge_visits: K('bridge_two') if (complex_category and home_health_approved) else (K('bridge_one') if (complex_category or home_health_approved) else 0)
  - repeat_referrals: COUNT('pcp_events', within_months=K('relationship_window_months'), event_type='pcp_referral_issue', specialist_npi=carried_specialist)
  - relationship_visits: K('relationship_two') if repeat_referrals >= K('repeat_many') else (K('relationship_one') if repeat_referrals >= K('repeat_some') else 0)
  - outbound_legs: XCOUNT('ride','ride_trips', within_months=K('middle_window_months'), date_field='appointment_date', event_type='ride_trip_completed', leg='outbound', destination_npi=carried_specialist)
  - travel_visits: (outbound_legs // K('legs_per_visit')) if outbound_legs >= K('rides_many') else (K('travel_one') if outbound_legs >= K('rides_some') else 0)
  - result: MN(P('referral_max_visits'), visits_left + bridge_visits + relationship_visits + travel_visits)
  compute_basis:
    carried_specialist: The referral carried is the most recent single referral that the earlier assignment issued, and the referred specialist is the specialist named on that referral.
    carried_recorded_visits: The referral carried is the most recent single referral that the earlier assignment issued, and the referred specialist is the specialist named on that referral.
    carried_issue_date: 'Which paid claims count as already used depends on the age of the carried referral in whole months from its issue date to the handling date: a referral younger than the recent window counts only the claims with a service date in the recent window; a referral at least as old as the recent window but younger than the middle window counts only the claims in the middle window; any older referral counts the claims in the standard look-back window.'
    carried_age_months: 'Which paid claims count as already used depends on the age of the carried referral in whole months from its issue date to the handling date: a referral younger than the recent window counts only the claims with a service date in the recent window; a referral at least as old as the recent window but younger than the middle window counts only the claims in the middle window; any older referral counts the claims in the standard look-back window.'
    used_recent: 'Which paid claims count as already used depends on the age of the carried referral in whole months from its issue date to the handling date: a referral younger than the recent window counts only the claims with a service date in the recent window; a referral at least as old as the recent window but younger than the middle window counts only the claims in the middle window; any older referral counts the claims in the standard look-back window. Every look-back window named in this rule is a trailing period counted back from the handling date in whole months: a record is inside a window of a given number of months when fewer than that number of whole months separate its date from the handling date, so a record dated exactly that number of months back is outside it.'
    used_middle: 'Which paid claims count as already used depends on the age of the carried referral in whole months from its issue date to the handling date: a referral younger than the recent window counts only the claims with a service date in the recent window; a referral at least as old as the recent window but younger than the middle window counts only the claims in the middle window; any older referral counts the claims in the standard look-back window. Every look-back window named in this rule is a trailing period counted back from the handling date in whole months: a record is inside a window of a given number of months when fewer than that number of whole months separate its date from the handling date, so a record dated exactly that number of months back is outside it.'
    used_standard: 'The visits carried start from the visits recorded on the carried referral less the visits already used, where the visits already used are the member''s paid specialist-visit claims billed by the referred specialist with a service date in the standard look-back window, and a difference below zero counts as zero. Every look-back window named in this rule is a trailing period counted back from the handling date in whole months: a record is inside a window of a given number of months when fewer than that number of whole months separate its date from the handling date, so a record dated exactly that number of months back is outside it.'
    used_visits: 'Which paid claims count as already used depends on the age of the carried referral in whole months from its issue date to the handling date: a referral younger than the recent window counts only the claims with a service date in the recent window; a referral at least as old as the recent window but younger than the middle window counts only the claims in the middle window; any older referral counts the claims in the standard look-back window.'
    visits_left: 'The carried visits are worked out in this order: first the visits left are taken as the recorded visits less the visits already used, not below zero; then the bridge, relationship and travel visits are added to that figure; then the sum is compared with the ceiling and the lower of the two is carried; every figure is a whole number of visits, so no rounding arises.'
    complex_category: 'Bridge visits are added for members with complex needs: a member whose plan membership is in the Prairie Ridge ABD Care or Prairie Ridge Dual Complete category and who also holds an approved Home Health Services Authorization receives the two-visit bridge; a member who meets exactly one of those two conditions receives the one-visit bridge; a member who meets neither receives no bridge visit.'
    home_health_approved: 'Bridge visits are added for members with complex needs: a member whose plan membership is in the Prairie Ridge ABD Care or Prairie Ridge Dual Complete category and who also holds an approved Home Health Services Authorization receives the two-visit bridge; a member who meets exactly one of those two conditions receives the one-visit bridge; a member who meets neither receives no bridge visit.'
    bridge_visits: 'Bridge visits are added for members with complex needs: a member whose plan membership is in the Prairie Ridge ABD Care or Prairie Ridge Dual Complete category and who also holds an approved Home Health Services Authorization receives the two-visit bridge; a member who meets exactly one of those two conditions receives the one-visit bridge; a member who meets neither receives no bridge visit.'
    repeat_referrals: 'Relationship visits are added for an established specialist relationship, counted as the referrals the earlier assignment issued to the referred specialist with an issue date in the relationship window: three or more such referrals add the two-visit relationship allowance, exactly two add the one-visit relationship allowance, and fewer than two add nothing.'
    relationship_visits: 'Relationship visits are added for an established specialist relationship, counted as the referrals the earlier assignment issued to the referred specialist with an issue date in the relationship window: three or more such referrals add the two-visit relationship allowance, exactly two add the one-visit relationship allowance, and fewer than two add nothing.'
    outbound_legs: 'Travel visits are added for members who ride to the specialist, based on the member''s completed outbound transportation legs to the referred specialist''s NPI with an appointment date in the middle window: for a member with four or more such legs the travel visits are worked out from the legs themselves, one visit for every two legs, rounded down; a member with one to three legs receives the flat one-visit travel allowance; a member with no leg receives no travel visit.'
    travel_visits: 'Travel visits are added for members who ride to the specialist, based on the member''s completed outbound transportation legs to the referred specialist''s NPI with an appointment date in the middle window: for a member with four or more such legs the travel visits are worked out from the legs themselves, one visit for every two legs, rounded down; a member with one to three legs receives the flat one-visit travel allowance; a member with no leg receives no travel visit.'
    result: 'The carried visits are worked out in this order: first the visits left are taken as the recorded visits less the visits already used, not below zero; then the bridge, relationship and travel visits are added to that figure; then the sum is compared with the ceiling and the lower of the two is carried; every figure is a whole number of visits, so no rounding arises. The visits carried never exceed the single-referral visit ceiling of the practice type of the earlier assignment that issued the referral.'
  factors:
  - id: used_visit_window
    effect: parameter
    decides: used_visits
    bindings:
    - carried_issue_date
    - carried_age_months
    - used_recent
    - used_middle
    - used_standard
    - used_visits
    ladder:
    - when: the carried referral is younger than the recent window (whole months from its issue date)
      value: look-back of K('recent_window_months') months for the referred specialist's paid specialist-visit claims
    - when: the carried referral is at least as old as the recent window but younger than the middle window
      value: look-back of K('middle_window_months') months for the referred specialist's paid specialist-visit claims
    - when: otherwise
      value: look-back of K('standard_window_months') months for the referred specialist's paid specialist-visit claims
    baseline:
      used_visits: used_standard
    evidence:
    - date
    - history
    - cross_category
    cross_difficulty: plan
  - id: complex_needs_bridge
    effect: parameter
    decides: bridge_visits
    bindings:
    - complex_category
    - home_health_approved
    - bridge_visits
    ladder:
    - when: plan membership in Prairie Ridge ABD Care or Prairie Ridge Dual Complete AND an approved Home Health Services Authorization
      value: K('bridge_two')
    - when: exactly one of those two conditions
      value: K('bridge_one')
    - when: otherwise
      value: '0'
    baseline:
      bridge_visits: '0'
    evidence:
    - cross_category
    cross_difficulty: plan
  - id: specialist_relationship
    effect: parameter
    decides: relationship_visits
    bindings:
    - repeat_referrals
    - relationship_visits
    ladder:
    - when: three or more referrals from the earlier assignment to the referred specialist in the relationship window
      value: K('relationship_two')
    - when: exactly two such referrals
      value: K('relationship_one')
    - when: otherwise (fewer than two)
      value: '0'
    baseline:
      relationship_visits: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: specialist_travel
    effect: method
    decides: travel_visits
    bindings:
    - outbound_legs
    - travel_visits
    ladder:
    - when: four or more completed outbound transportation legs to the referred specialist's NPI in the middle window
      method: 'work the travel visits out from the legs: one visit for every two legs, rounded down'
    - when: one to three such legs
      method: take the flat one-visit travel allowance
    - when: otherwise (no leg)
      method: add no travel visit
    baseline:
      travel_visits: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: ride
  baseline:
    rule: The visits carried start from the visits recorded on the carried referral less the visits already used, where the visits already used are the member's paid specialist-visit claims billed by the referred specialist with a service date in the standard look-back window, and a difference below zero counts as zero. The visits carried never exceed the single-referral visit ceiling of the practice type of the earlier assignment that issued the referral.
    params:
    - standard_window_months
    - referral_max_visits
  inputs:
    history:
    - table: pcp_events
      aggregate: latest
      field: referral_visits
      filters:
        event_type: pcp_referral_issue
        referral_type: single
    - table: pcp_events
      aggregate: count
      field: pcp_event_id
      within_months: 12
      filters:
        event_type: pcp_referral_issue
    - category: plan
      table: plan_claims
      aggregate: count
      field: plan_claim_id
      within_months: 12
      filters:
        service_category: specialist_visit
        adjudication_status: paid
    - category: ride
      table: ride_trips
      aggregate: count
      field: ride_trip_id
      within_months: 6
      filters:
        event_type: ride_trip_completed
        leg: outbound
    cross_category:
    - plan
    - auth
    - ride
- id: pcp_ext_standing_referral
  base_policy_refs:
  - pcp_referrals
  overwrite: []
  trigger: on_request
  subject:
  - pcp_referral_issue
  computes: referral_visits
  target_tool: issue_standing_referral_d300bbad
  params:
    recent_use_window_months: 6
    frequent_use_visits: 4
    intermediate_allowance: 18
    standard_allowance: 12
    monitoring_window_months: 3
    many_fills: 3
    monitoring_large: 4
    monitoring_small: 2
    hospital_window_months: 12
    many_stays: 2
    post_hospital_large: 4
    post_hospital_small: 2
    far_miles: 30.0
    middle_miles: 15.0
    travel_large: 4
    travel_small: 2
    many_labs: 3
    lab_large: 4
    lab_small: 2
    months_per_year: 12
  rule: 'A standing referral lets a member with an ongoing condition see one specialist repeatedly during the referral''s validity; it is written on the member''s active assignment where the practice type allows standing referrals, and it records the visits it covers. The visits of a standing referral are fixed only after every single referral that an earlier assignment of the member issued and that is still within its validity is carried on the current assignment under its original referral number. The specialist of the standing referral is the specialist named on the most recent single referral that the current assignment carries. A standing referral starts from the standard standing allowance of visits. The allowance is capped at the practice type''s standing-referral visit ceiling, and the visits still recorded on the single referrals to the same specialist that the current assignment carries are then deducted from the capped figure, a result below zero counting as zero. The allowance depends on the member''s specialist use and eligibility category: a member with at least the frequent-use count of paid specialist-visit claims with a service date in the recent-use window and whose plan membership is in the Prairie Ridge ABD Care or Prairie Ridge Dual Complete category receives the practice type''s standing-referral visit ceiling as the allowance; a member who meets exactly one of those two conditions receives the intermediate standing allowance; a member who meets neither receives the standard standing allowance. Monitoring visits are added for specialty drug therapy, counted as the member''s paid specialty-tier pharmacy fills with a fill date in the monitoring window: at least the many-fills count adds the larger monitoring allowance, at least one fill but fewer than the many-fills count adds the smaller monitoring allowance, and no such fill adds nothing. Post-hospital visits are added for recent inpatient care, counted as the member''s paid inpatient-stay claims with a service date in the hospital look-back window: two or more stays add the larger post-hospital allowance, exactly one stay adds the smaller post-hospital allowance, and no stay adds nothing. Travel visits are added for members who travel far for care, measured as the longest one-way distance of the member''s completed medical-appointment transportation legs on record: at least the far distance adds the larger travel allowance, at least the middle distance but less than the far distance adds the smaller travel allowance, and anything shorter, or no such leg, adds nothing. Laboratory review visits are added, counted as the member''s paid lab and x-ray claims with a service date in the monitoring window: three or more claims add the larger laboratory allowance, one or two claims add the smaller laboratory allowance, and no claim adds nothing. The allowance total is aligned to the member''s eligibility period: while the plan membership is in renewal-due status the allowance total is multiplied by the calendar days from the handling date to the renewal due date and divided by the practice type''s referral validity days; while the plan membership is active and its renewal due date is fewer than twelve whole months after the handling date, the allowance total is multiplied by those whole months and divided by twelve; in every other case the allowance total is not aligned. The standing visits are worked out in this order: first the allowance and the monitoring, post-hospital, travel and laboratory visits are added into the allowance total; then the eligibility alignment is applied to that total and the product is rounded down to a whole visit; then the cap is applied to the rounded figure; then the carried single-referral visits are deducted, not below zero. Every look-back window named in this rule is a trailing period counted back from the handling date in whole months: a record is inside a window of a given number of months when fewer than that number of whole months separate its date from the handling date, so a record dated exactly that number of months back is outside it.'
  prerequisite:
  - problem: pcp_ext_referral_carryover
    kind: value_input
    gate: carried_open_visits
    form: state
    policy_source: The visits of a standing referral are fixed only after every single referral that an earlier assignment of the member issued and that is still within its validity is carried on the current assignment under its original referral number.
    condition: For every pcp_referral_issue row (referral_type single) on an ended earlier pcp_assignments row of the member whose issue date is within that practice type's referral validity days of the handling date, a pcp_referral_issue row with the same referral_number exists on the member's active assignment.
    resolved_by: carry_over_referral_de0684af
    effect: Once the unexpired earlier referral is carried, the carried single referral becomes the most recent single referral on the current assignment, so carried_specialist names its specialist and carried_open_visits takes the carried visits instead of zero, lowering the standing visits by that amount.
  cross_category:
  - category: plan
    as: history
    reads:
    - variant_name
    - status
    - renewal_due_date
    - plan_claims.service_date
    - plan_claims.service_category
    - plan_claims.adjudication_status
