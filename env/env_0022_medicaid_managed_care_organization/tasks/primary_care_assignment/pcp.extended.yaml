    renewal_due: 'The visit total is aligned to the member''s eligibility period: while the plan membership is in renewal-due status the visit total is multiplied by the calendar days from the handling date to the renewal due date and divided by the practice type''s referral validity days; while the plan membership is active and its renewal due date is fewer than twelve whole months after the handling date, the visit total is multiplied by those whole months and divided by twelve; in every other case the visit total is not aligned.'
