    - ride_trips.trip_purpose
    note: travel visits read the longest completed medical-appointment leg.
  compute:
  - specialist_claims_recent: XCOUNT('plan','plan_claims', within_months=K('recent_use_window_months'), date_field='service_date', service_category='specialist_visit', adjudication_status='paid')
  - complex_category: CFIELD('plan','variant_name') == 'Prairie Ridge ABD Care' or CFIELD('plan','variant_name') == 'Prairie Ridge Dual Complete'
  - standing_allowance: P('standing_referral_max_visits') if (specialist_claims_recent >= K('frequent_use_visits') and complex_category) else (K('intermediate_allowance') if (specialist_claims_recent >= K('frequent_use_visits') or complex_category) else K('standard_allowance'))
  - specialty_fills: XCOUNT('rx','rx_fills', within_months=K('monitoring_window_months'), date_field='fill_date', event_type='rx_fill', formulary_status='specialty')
  - monitoring_visits: K('monitoring_large') if specialty_fills >= K('many_fills') else (K('monitoring_small') if specialty_fills >= 1 else 0)
  - inpatient_stays: XCOUNT('plan','plan_claims', within_months=K('hospital_window_months'), date_field='service_date', service_category='inpatient_stay', adjudication_status='paid')
  - post_hospital_visits: K('post_hospital_large') if inpatient_stays >= K('many_stays') else (K('post_hospital_small') if inpatient_stays >= 1 else 0)
  - longest_leg_miles: XMAX('ride','ride_trips','one_way_miles', event_type='ride_trip_completed', trip_purpose='medical_appointment')
  - travel_visits: K('travel_large') if longest_leg_miles >= K('far_miles') else (K('travel_small') if longest_leg_miles >= K('middle_miles') else 0)
  - lab_claims: XCOUNT('plan','plan_claims', within_months=K('monitoring_window_months'), date_field='service_date', service_category='lab_xray', adjudication_status='paid')
  - lab_visits: K('lab_large') if lab_claims >= K('many_labs') else (K('lab_small') if lab_claims >= 1 else 0)
  - allowance_total: standing_allowance + monitoring_visits + post_hospital_visits + travel_visits + lab_visits
  - membership_status: CFIELD('plan','status')
  - renewal_due: CFIELD('plan','renewal_due_date')
  - eligibility_share: (DAYS(NOW, renewal_due) / P('referral_validity_days')) if membership_status == 'renewal_due' else ((MONTHS(NOW, renewal_due) / K('months_per_year')) if (membership_status == 'active' and MONTHS(NOW, renewal_due) < K('months_per_year')) else 1)
  - aligned_total: int(RND(allowance_total * eligibility_share, 6))
  - capped_total: MN(P('standing_referral_max_visits'), aligned_total)
  - carried_specialist: LATEST('pcp_events','specialist_npi', event_type='pcp_referral_issue', referral_type='single')
  - carried_open_visits: SUM('pcp_events','referral_visits', event_type='pcp_referral_issue', referral_type='single', specialist_npi=carried_specialist)
  - result: MX(0, capped_total - carried_open_visits)
