  subject:
  - pcp_referral_issue
  computes: referral_visits
  target_tool: request_second_opinion_76735634
  params:
    consultation_visits: 1
    visits_per_review: 4
    flat_review: 1
    workup_window_months: 3
    many_claims: 2
    imaging_two: 2
    imaging_one: 1
    many_fills: 2
    medication_two: 2
    medication_one: 1
    mobility_two: 2
    mobility_one: 1
  rule: 'A member may obtain a second opinion from another in-network specialist at no cost; the member''s own request is recorded as a second-opinion referral from the member''s active assignment to the specialist the member chose, and it records the visits the second opinion covers. A second-opinion referral is recorded only after the current assignment carries a single referral, dated on or after the assignment''s effective date, to the specialist whose recommendation is being reviewed. Where the recommendation under review is a surgery, the specialist whose recommendation is being reviewed is the requesting provider on the member''s Elective Inpatient and Surgical Authorization request. A second-opinion referral covers the consultation visit. The visits covered never exceed the practice type''s single-referral visit ceiling. Review visits are added for the recommendation under review, according to the member''s Elective Inpatient and Surgical Authorization request: while that request is in submitted or pended-for-information status, the review visits are the visits recorded on the current assignment''s single referrals to the requesting provider, divided by the visits-per-review count and rounded down; while it is approved, the review visits are the flat single review visit; with no such request in any of those statuses, no review visit is added. Imaging review visits are added, counted as the member''s paid lab and x-ray claims with a service date in the work-up window: two or more claims add the two-visit imaging allowance, exactly one adds the one-visit imaging allowance, and none adds nothing. Medication review visits are added for controlled pain medicine, counted as the member''s paid pharmacy fills of a Schedule II, III or IV controlled substance with a fill date in the work-up window: two or more fills add the two-visit medication allowance, exactly one adds the one-visit medication allowance, and none adds nothing. Mobility visits are added according to the member''s active transportation benefit: RideLink Wheelchair Van or RideLink Stretcher Van adds the two-visit mobility allowance, RideLink Door-to-Door Assist or RideLink Ambulatory Sedan adds the one-visit mobility allowance, and any other level, or no active benefit, adds nothing. The second-opinion visits are the consultation visit plus the review, imaging review, medication review and mobility visits, and the ceiling is then applied to that sum; every figure is a whole number of visits. Every look-back window named in this rule is a trailing period counted back from the handling date in whole months: a record is inside a window of a given number of months when fewer than that number of whole months separate its date from the handling date, so a record dated exactly that number of months back is outside it.'
  prerequisite:
  - problem: pcp_ext_specialist_referral
    kind: value_input
    gate: treating_visits
    form: state
    policy_source: A second-opinion referral is recorded only after the current assignment carries a single referral, dated on or after the assignment's effective date, to the specialist whose recommendation is being reviewed.
    condition: The active pcp_assignments row carries a pcp_referral_issue row with referral_type single, event_date on or after the assignment's effective_date, and specialist_npi equal to the requesting_provider_npi of the member's Elective Inpatient and Surgical Authorization request.
    resolved_by: issue_specialist_referral_96d4855f
    effect: Once the single referral to the requesting provider is on the current assignment, treating_visits becomes that referral's visits instead of zero, so for a submitted surgical request the review visits become those visits divided by the visits-per-review count, rounded down.
  cross_category:
  - category: auth
    as: branch
    reads:
    - variant_name
    - status
    - requesting_provider_npi
    note: review visits branch on the surgical authorization request status and read its requesting provider.
  - category: plan
    as: history
    reads:
    - plan_claims.service_date
    - plan_claims.service_category
    - plan_claims.adjudication_status
    note: imaging review visits count lab and x-ray claims.
  - category: rx
    as: history
    reads:
    - rx_fills.fill_date
    - rx_fills.event_type
    - rx_fills.controlled_schedule
    note: medication review visits count controlled-substance fills.
  - category: ride
    as: branch
    reads:
    - variant_name
    - status
    note: mobility visits read the level of the active transportation benefit.
  compute:
  - requesting_provider: CFIELD('auth','requesting_provider_npi', variant_name='Elective Inpatient and Surgical Authorization')
  - treating_visits: SUM('pcp_events','referral_visits', event_type='pcp_referral_issue', referral_type='single', specialist_npi=requesting_provider)
  - surgical_pending: EXISTS('auth', variant_name='Elective Inpatient and Surgical Authorization', status='submitted') or EXISTS('auth', variant_name='Elective Inpatient and Surgical Authorization', status='pended_info')
  - surgical_approved: EXISTS('auth', variant_name='Elective Inpatient and Surgical Authorization', status='approved')
  - review_visits: (treating_visits // K('visits_per_review')) if surgical_pending else (K('flat_review') if surgical_approved else 0)
  - workup_claims: XCOUNT('plan','plan_claims', within_months=K('workup_window_months'), date_field='service_date', service_category='lab_xray', adjudication_status='paid')
  - imaging_visits: K('imaging_two') if workup_claims >= K('many_claims') else (K('imaging_one') if workup_claims >= 1 else 0)
  - controlled_fills: XCOUNT('rx','rx_fills', within_months=K('workup_window_months'), date_field='fill_date', event_type='rx_fill', controlled_schedule='CII') + XCOUNT('rx','rx_fills', within_months=K('workup_window_months'), date_field='fill_date', event_type='rx_fill', controlled_schedule='CIII') + XCOUNT('rx','rx_fills', within_months=K('workup_window_months'), date_field='fill_date', event_type='rx_fill', controlled_schedule='CIV')
  - medication_visits: K('medication_two') if controlled_fills >= K('many_fills') else (K('medication_one') if controlled_fills >= 1 else 0)
  - ride_level: CFIELD('ride','variant_name', status='active')
  - mobility_visits: K('mobility_two') if (ride_level == 'RideLink Wheelchair Van' or ride_level == 'RideLink Stretcher Van') else (K('mobility_one') if (ride_level == 'RideLink Door-to-Door Assist' or ride_level == 'RideLink Ambulatory Sedan') else 0)
  - result: MN(P('referral_max_visits'), K('consultation_visits') + review_visits + imaging_visits + medication_visits + mobility_visits)
  compute_basis:
    requesting_provider: Where the recommendation under review is a surgery, the specialist whose recommendation is being reviewed is the requesting provider on the member's Elective Inpatient and Surgical Authorization request.
    treating_visits: 'Review visits are added for the recommendation under review, according to the member''s Elective Inpatient and Surgical Authorization request: while that request is in submitted or pended-for-information status, the review visits are the visits recorded on the current assignment''s single referrals to the requesting provider, divided by the visits-per-review count and rounded down; while it is approved, the review visits are the flat single review visit; with no such request in any of those statuses, no review visit is added.'
    surgical_pending: 'Review visits are added for the recommendation under review, according to the member''s Elective Inpatient and Surgical Authorization request: while that request is in submitted or pended-for-information status, the review visits are the visits recorded on the current assignment''s single referrals to the requesting provider, divided by the visits-per-review count and rounded down; while it is approved, the review visits are the flat single review visit; with no such request in any of those statuses, no review visit is added.'
    surgical_approved: 'Review visits are added for the recommendation under review, according to the member''s Elective Inpatient and Surgical Authorization request: while that request is in submitted or pended-for-information status, the review visits are the visits recorded on the current assignment''s single referrals to the requesting provider, divided by the visits-per-review count and rounded down; while it is approved, the review visits are the flat single review visit; with no such request in any of those statuses, no review visit is added.'
    review_visits: 'Review visits are added for the recommendation under review, according to the member''s Elective Inpatient and Surgical Authorization request: while that request is in submitted or pended-for-information status, the review visits are the visits recorded on the current assignment''s single referrals to the requesting provider, divided by the visits-per-review count and rounded down; while it is approved, the review visits are the flat single review visit; with no such request in any of those statuses, no review visit is added.'
    workup_claims: 'Imaging review visits are added, counted as the member''s paid lab and x-ray claims with a service date in the work-up window: two or more claims add the two-visit imaging allowance, exactly one adds the one-visit imaging allowance, and none adds nothing.'
    imaging_visits: 'Imaging review visits are added, counted as the member''s paid lab and x-ray claims with a service date in the work-up window: two or more claims add the two-visit imaging allowance, exactly one adds the one-visit imaging allowance, and none adds nothing.'
    controlled_fills: 'Medication review visits are added for controlled pain medicine, counted as the member''s paid pharmacy fills of a Schedule II, III or IV controlled substance with a fill date in the work-up window: two or more fills add the two-visit medication allowance, exactly one adds the one-visit medication allowance, and none adds nothing.'
    medication_visits: 'Medication review visits are added for controlled pain medicine, counted as the member''s paid pharmacy fills of a Schedule II, III or IV controlled substance with a fill date in the work-up window: two or more fills add the two-visit medication allowance, exactly one adds the one-visit medication allowance, and none adds nothing.'
    ride_level: 'Mobility visits are added according to the member''s active transportation benefit: RideLink Wheelchair Van or RideLink Stretcher Van adds the two-visit mobility allowance, RideLink Door-to-Door Assist or RideLink Ambulatory Sedan adds the one-visit mobility allowance, and any other level, or no active benefit, adds nothing.'
    mobility_visits: 'Mobility visits are added according to the member''s active transportation benefit: RideLink Wheelchair Van or RideLink Stretcher Van adds the two-visit mobility allowance, RideLink Door-to-Door Assist or RideLink Ambulatory Sedan adds the one-visit mobility allowance, and any other level, or no active benefit, adds nothing.'
    result: The second-opinion visits are the consultation visit plus the review, imaging review, medication review and mobility visits, and the ceiling is then applied to that sum; every figure is a whole number of visits. A second-opinion referral covers the consultation visit. The visits covered never exceed the practice type's single-referral visit ceiling.
  factors:
  - id: recommendation_review
    effect: method
    decides: review_visits
    bindings:
    - surgical_pending
    - surgical_approved
    - review_visits
    ladder:
    - when: Elective Inpatient and Surgical Authorization request in submitted or pended-for-information status
      method: divide the visits recorded on the current assignment's single referrals to the requesting provider by the visits-per-review count, rounded down
    - when: that request approved
      method: add the flat single review visit
    - when: otherwise
      method: add no review visit
    baseline:
      review_visits: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: auth
  - id: imaging_review
    effect: parameter
    decides: imaging_visits
    bindings:
    - workup_claims
    - imaging_visits
    ladder:
    - when: two or more paid lab and x-ray claims in the work-up window
      value: K('imaging_two')
    - when: exactly one such claim
      value: K('imaging_one')
    - when: otherwise (none)
      value: '0'
    baseline:
      imaging_visits: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: plan
  - id: controlled_medication
    effect: parameter
    decides: medication_visits
    bindings:
    - controlled_fills
    - medication_visits
    ladder:
    - when: two or more paid Schedule II, III or IV fills in the work-up window
      value: K('medication_two')
    - when: exactly one such fill
      value: K('medication_one')
    - when: otherwise (none)
      value: '0'
    baseline:
      medication_visits: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: rx
  - id: mobility_level
    effect: parameter
    decides: mobility_visits
    bindings:
    - ride_level
    - mobility_visits
    ladder:
    - when: active transportation benefit at RideLink Wheelchair Van or RideLink Stretcher Van
      value: K('mobility_two')
    - when: active transportation benefit at RideLink Door-to-Door Assist or RideLink Ambulatory Sedan
      value: K('mobility_one')
    - when: otherwise (another level, or no active benefit)
      value: '0'
    baseline:
      mobility_visits: '0'
    evidence:
    - cross_category
    cross_difficulty: ride
  baseline:
    rule: A second-opinion referral covers the consultation visit. The visits covered never exceed the practice type's single-referral visit ceiling.
    params:
    - consultation_visits
    - referral_max_visits
  inputs:
    history:
    - table: pcp_events
      aggregate: sum
      field: referral_visits
      filters:
        event_type: pcp_referral_issue
        referral_type: single
    - category: plan
      table: plan_claims
      aggregate: count
      field: plan_claim_id
      within_months: 3
      filters:
        service_category: lab_xray
        adjudication_status: paid
    - category: rx
      table: rx_fills
      aggregate: count
      field: rx_fill_id
      within_months: 3
      filters:
        event_type: rx_fill
    cross_category:
    - auth
    - plan
    - rx
    - ride
