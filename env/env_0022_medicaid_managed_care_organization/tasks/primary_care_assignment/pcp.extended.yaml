  factors:
  - id: standing_allowance_tier
    effect: parameter
    decides: standing_allowance
    bindings:
    - specialist_claims_recent
    - complex_category
    - standing_allowance
    ladder:
    - when: at least the frequent-use count of paid specialist-visit claims in the recent-use window AND plan membership in Prairie Ridge ABD Care or Prairie Ridge Dual Complete
      value: P('standing_referral_max_visits')
    - when: exactly one of those two conditions
      value: K('intermediate_allowance')
    - when: otherwise
      value: K('standard_allowance')
    baseline:
      standing_allowance: K('standard_allowance')
    evidence:
    - history
    - cross_category
    cross_difficulty: plan
  - id: specialty_monitoring
    effect: parameter
    decides: monitoring_visits
    bindings:
    - specialty_fills
    - monitoring_visits
    ladder:
    - when: at least the many-fills count of paid specialty-tier fills in the monitoring window
      value: K('monitoring_large')
    - when: at least one but fewer than the many-fills count
      value: K('monitoring_small')
    - when: otherwise (no specialty-tier fill)
      value: '0'
    baseline:
      monitoring_visits: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: rx
  - id: eligibility_alignment
    effect: method
    decides: eligibility_share
    bindings:
    - membership_status
    - renewal_due
    - eligibility_share
    ladder:
    - when: plan membership in renewal-due status
      method: multiply the allowance total by the calendar days to the renewal due date over the practice type's referral validity days
    - when: plan membership active AND renewal due date fewer than twelve whole months away
      method: multiply the allowance total by the whole months to the renewal due date over twelve
    - when: otherwise
      method: leave the allowance total unaligned
    baseline:
      eligibility_share: '1'
    evidence:
    - cross_category
    - date
    cross_difficulty: plan
  - id: post_hospital
    effect: parameter
    decides: post_hospital_visits
    bindings:
