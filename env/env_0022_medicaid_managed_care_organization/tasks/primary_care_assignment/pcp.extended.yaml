    visit_total: 'The referral visits are worked out in this order: first the core visits and the review, travel, medication and emergency follow-up visits are added into the visit total; then the eligibility alignment is applied to that total and the product is rounded down to a whole visit; then the ceiling is applied to the rounded figure.'
