  - id: auth_ext_provider_carryover
    base_policy_refs: [auth_provider_change]
    overwrite:
      - base_policy: auth_provider_change
        superseded_clause: >-
          the units left and the end_date carry over unchanged
        replaced_by: >-
          When the member moves an approved authorization to another in-network servicing provider for the same service, the end date carries over unchanged and the authorization's units remaining become the units the provider change carries over, worked out as set out below.
    trigger: on_request
    subject: [auth_provider_update]
    computes: units_carried
    target_tool: change_servicing_provider_0d360835
    params:
      recent_contact_days: 7
      unposted_hold_one: 1
      unposted_hold_many: 2
      reeval_short_days: 7
      reeval_long_days: 30
      reeval_hold_mid: 1
      reeval_hold_long: 2
      attendance_cut_mid: 1
      attendance_cut_low: 2
    rule: >-
      When the member moves an approved authorization to another in-network servicing provider for the same service, the end date carries over unchanged and the authorization's units remaining become the units the provider change carries over, worked out as set out below.
      As the standard method, the units a provider change carries over are the units left on the approval (the units granted less the units posted as used and less any units released), limited to the units the new provider can deliver before the end date, which are the whole weeks from the day of the change to the end date (the days between them divided by seven and rounded down) multiplied by the class's weekly frequency cap.
      From the smaller of those two figures three reductions are taken, each a whole number of units and each taken once, and the units carried over are never below zero.
      The delivery weeks of a provider change follow the member's care coordination: where a care plan update was recorded in the month before the day of the change and the latest care contact was no more than seven days before that day, the weeks counted are the weeks started between the day of the change and the end date (the days divided by seven and rounded up); where such a care plan update was recorded but the latest care contact is older than seven days or there is none, the new provider's capacity is counted day by day, as the days to the end date multiplied by the weekly frequency cap and divided by seven, rounded down; otherwise the standard whole weeks are used.
      The unposted-visit reduction of a provider change compares the member's paid specialist visit claims with service dates in the month before the day of the change with the uses posted on the approval with service dates in that month: where the paid claims exceed the posted uses by two or more, two units are taken off; where they exceed them by exactly one, one unit is taken off; otherwise nothing is taken off.
      The re-evaluation reduction of a provider change counts the days from the latest use posted on the approval (or from the approval's start date where no use is posted) to the day of the change: more than thirty days takes off two units for the new provider's re-evaluation; eight to thirty days takes off one unit; seven days or fewer takes off nothing.
      The attendance reduction of a provider change counts the uses posted on the approval with service dates in the two months before the day of the change: fewer than twice the weekly frequency cap takes off two units; at least twice but fewer than four times the weekly frequency cap takes off one unit; four times the weekly frequency cap or more takes off nothing.
    prerequisite: []
    cross_category:
      - category: care
        as: branch
        reads: [care_activities.event_type, care_activities.activity_date]
        note: The delivery weeks follow the care plan updates and the latest care contact.
      - category: plan
        as: history
        reads: [plan_claims.service_category, plan_claims.adjudication_status, plan_claims.service_date]
        note: The unposted-visit reduction counts paid specialist visit claims of the last month.
    compute:
      - pc_granted: "SUM('auth_units','units', event_type='auth_units_granted')"
      - pc_used: "SUM('auth_units','units', event_type='auth_units_used')"
      - pc_released: "SUM('auth_units','units', event_type='auth_units_released')"
      - pc_left: "MX(0, pc_granted - pc_used - pc_released)"
      - pc_days_to_end: "DAYS(NOW, F('end_date'))"
      - pc_plan_updates: "XCOUNT('care','care_activities', within_months=1, date_field='activity_date', event_type='care_plan_update')"
      - pc_last_contact: "XLATEST('care','care_activities','activity_date', date_field='activity_date', event_type='care_contact')"
      - pc_contact_gap: "DAYS(pc_last_contact, NOW) if pc_last_contact != None else 9999"
      - pc_capacity: "((pc_days_to_end + 6) // 7) * P('weekly_frequency_cap') if (pc_plan_updates >= 1 and pc_contact_gap <= K('recent_contact_days')) else (int(pc_days_to_end * P('weekly_frequency_cap') / 7) if (pc_plan_updates >= 1 and pc_contact_gap > K('recent_contact_days')) else (pc_days_to_end // 7) * P('weekly_frequency_cap'))"
      - pc_paid_claims: "XCOUNT('plan','plan_claims', within_months=1, date_field='service_date', service_category='specialist_visit', adjudication_status='paid')"
      - pc_posted_month: "SUM('auth_units','units', within_months=1, date_field='service_date', event_type='auth_units_used')"
      - pc_unposted_hold: "K('unposted_hold_many') if pc_paid_claims - pc_posted_month >= 2 else (K('unposted_hold_one') if pc_paid_claims - pc_posted_month == 1 else 0)"
      - pc_last_use: "LATEST('auth_units','service_date', date_field='service_date', event_type='auth_units_used')"
      - pc_use_gap: "DAYS(pc_last_use, NOW) if pc_last_use != None else DAYS(F('start_date'), NOW)"
      - pc_reeval_hold: "K('reeval_hold_long') if pc_use_gap > K('reeval_long_days') else (K('reeval_hold_mid') if pc_use_gap > K('reeval_short_days') else 0)"
      - pc_used_two_months: "SUM('auth_units','units', within_months=2, date_field='service_date', event_type='auth_units_used')"
      - pc_attendance_cut: "K('attendance_cut_low') if pc_used_two_months < 2 * P('weekly_frequency_cap') else (K('attendance_cut_mid') if pc_used_two_months < 4 * P('weekly_frequency_cap') else 0)"
      - result: "MX(0, MN(pc_left, pc_capacity) - pc_unposted_hold - pc_reeval_hold - pc_attendance_cut)"
    compute_basis:
      pc_granted: "the units left on the approval (the units granted less the units posted as used and less any units released)"
      pc_used: "the units left on the approval (the units granted less the units posted as used and less any units released)"
      pc_released: "the units left on the approval (the units granted less the units posted as used and less any units released)"
      pc_left: "the units left on the approval (the units granted less the units posted as used and less any units released)"
      pc_days_to_end: "which are the whole weeks from the day of the change to the end date (the days between them divided by seven and rounded down) multiplied by the class's weekly frequency cap."
      pc_plan_updates: "where a care plan update was recorded in the month before the day of the change"
      pc_last_contact: "and the latest care contact was no more than seven days before that day"
      pc_contact_gap: "and the latest care contact was no more than seven days before that day"
      pc_capacity: "the weeks counted are the weeks started between the day of the change and the end date (the days divided by seven and rounded up); where such a care plan update was recorded but the latest care contact is older than seven days or there is none, the new provider's capacity is counted day by day, as the days to the end date multiplied by the weekly frequency cap and divided by seven, rounded down; otherwise the standard whole weeks are used."
      pc_paid_claims: "The unposted-visit reduction of a provider change compares the member's paid specialist visit claims with service dates in the month before the day of the change"
      pc_posted_month: "with the uses posted on the approval with service dates in that month"
      pc_unposted_hold: "where the paid claims exceed the posted uses by two or more, two units are taken off; where they exceed them by exactly one, one unit is taken off; otherwise nothing is taken off."
      pc_last_use: "The re-evaluation reduction of a provider change counts the days from the latest use posted on the approval (or from the approval's start date where no use is posted) to the day of the change"
      pc_use_gap: "The re-evaluation reduction of a provider change counts the days from the latest use posted on the approval (or from the approval's start date where no use is posted) to the day of the change"
      pc_reeval_hold: "more than thirty days takes off two units for the new provider's re-evaluation; eight to thirty days takes off one unit; seven days or fewer takes off nothing."
      pc_used_two_months: "The attendance reduction of a provider change counts the uses posted on the approval with service dates in the two months before the day of the change"
      pc_attendance_cut: "fewer than twice the weekly frequency cap takes off two units; at least twice but fewer than four times the weekly frequency cap takes off one unit; four times the weekly frequency cap or more takes off nothing."
      result: "From the smaller of those two figures three reductions are taken, each a whole number of units and each taken once, and the units carried over are never below zero."
    factors:
      - id: delivery_weeks
        effect: method
        decides: pc_capacity
        bindings: [pc_plan_updates, pc_capacity]
        ladder:
          - when: "a care plan update in the month before the change AND the latest care contact no more than seven days before it"
            method: "count the weeks started to the end date (days divided by seven, rounded up) times the weekly frequency cap"
          - when: "a care plan update in that month AND the latest care contact older than seven days or none"
            method: "count day by day: days to the end date times the weekly frequency cap divided by seven, rounded down"
          - when: "otherwise"
            method: "count whole weeks to the end date (days divided by seven, rounded down) times the weekly frequency cap"
        baseline:
          pc_capacity: "(pc_days_to_end // 7) * P('weekly_frequency_cap')"
        evidence: [cross_category, history, date]
        cross_difficulty: null
      - id: unposted_visit_reduction
        effect: parameter
        decides: pc_unposted_hold
        bindings: [pc_paid_claims, pc_posted_month, pc_unposted_hold]
        ladder:
          - when: "paid specialist visit claims of the last month exceed the posted uses of that month by two or more"
            value: "K('unposted_hold_many')"
          - when: "they exceed them by exactly one"
            value: "K('unposted_hold_one')"
          - when: "otherwise"
            value: "0"
        baseline:
          pc_unposted_hold: "0"
        evidence: [cross_category, history]
        cross_difficulty: plan
      - id: re_evaluation_reduction
        effect: parameter
        decides: pc_reeval_hold
        bindings: [pc_last_use, pc_use_gap, pc_reeval_hold]
        ladder:
          - when: "more than thirty days since the latest posted use"
            value: "K('reeval_hold_long')"
          - when: "eight to thirty days since the latest posted use"
            value: "K('reeval_hold_mid')"
          - when: "otherwise (seven days or fewer)"
            value: "0"
        baseline:
          pc_reeval_hold: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: attendance_reduction
        effect: parameter
        decides: pc_attendance_cut
        bindings: [pc_used_two_months, pc_attendance_cut]
        ladder:
          - when: "fewer than twice the weekly frequency cap of uses posted in the two months before the change"
            value: "K('attendance_cut_low')"
          - when: "at least twice but fewer than four times the weekly frequency cap"
            value: "K('attendance_cut_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          pc_attendance_cut: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
    baseline:
      rule: >-
        As the standard method, the units a provider change carries over are the units left on the approval (the units granted less the units posted as used and less any units released), limited to the units the new provider can deliver before the end date, which are the whole weeks from the day of the change to the end date (the days between them divided by seven and rounded down) multiplied by the class's weekly frequency cap.
      params: [weekly_frequency_cap]
    inputs:
      history:
        - {table: auth_units, aggregate: sum, field: units, filters: {event_type: auth_units_granted}}
        - {table: auth_units, aggregate: sum, field: units, filters: {event_type: auth_units_used}}
        - {table: auth_units, aggregate: sum, field: units, within_months: 2, filters: {event_type: auth_units_used}}
        - {category: care, table: care_activities, aggregate: latest, field: activity_date, filters: {event_type: care_contact}}
        - {category: plan, table: plan_claims, aggregate: count, field: plan_claim_id, within_months: 1, filters: {service_category: specialist_visit, adjudication_status: paid}}
      cross_category: [care, plan]
  - id: auth_ext_member_extension_request
    base_policy_refs: [auth_extension]
    overwrite: []
    trigger: on_request
    subject: [auth_extension_request]
    computes: requested_units
    target_tool: file_extension_request_1d826295
    params:
      rate_restart: 2
      rate_low: 1
      near_end_days: 14
      missed_add_one: 1
      missed_add_many: 2
      category_add_disability: 2
      category_add_child: 4
      risk_high: 3.0
      risk_mid: 2.0
      risk_add_mid: 1
      risk_add_high: 2
      deduct_halves_single: 1
      deduct_halves_all: 2
      halves: 2
    rule: >-
      A member who needs an approved authorization to continue past its end date may file the extension request in person, stating the additional units asked for and the end date asked for; the end date asked for is the current end date moved forward by the class's extension days, and the units asked for are worked out as set out below.
      The units an extension request asks for are worked out only once the authorization names, as its servicing provider, the provider who will deliver the extended units.
      As the standard method, the units an extension request asks for are the class's weekly frequency cap multiplied by the whole weeks of the class's extension days (the extension days divided by seven and rounded down), less the units remaining on the authorization, never below zero.
      In a class that sets no weekly frequency cap, the units an extension request asks for are the class's extension allotment.
      The weekly rate and the weeks of that standard method are replaced as set out below, the share of the units remaining that is deducted is set as below, the deduction being the units remaining multiplied by that share's halves and divided by two, rounded down,, and three additions are made, each once, before the floor of zero is applied.
      The weekly rate of an extension request follows the member's recent attendance and care plan: where at least one but fewer than twice the weekly frequency cap of uses were posted on the authorization with service dates in the two months before the day of the request and a care plan update was recorded in the month before that day, the rate is two units a week; where no use was posted in those two months, or fewer than twice the cap were posted and no such care plan update was recorded, the rate is one unit a week; otherwise the rate is the weekly frequency cap.
      The weeks of an extension request follow how close the authorization is to its end date and what is left on it: where the end date is no more than fourteen days after the day of the request and the units remaining are no more than the weekly frequency cap, the weeks are counted from the day of the request to the end date asked for (the days to the current end date plus the extension days, divided by seven and rounded down); where the end date is no more than fourteen days away but the units remaining exceed the weekly frequency cap, the weeks are the whole weeks of the extension days less one week, which the remaining units cover; otherwise the weeks are the whole weeks of the extension days.
      The deducted share of the units remaining in an extension request follows the referrals of the member's primary care provider issued in the six months before the day of the request: where a standing referral was issued, the share is no halves, so nothing is deducted; where only a single referral was issued, the share is one half; otherwise the share is two halves, so all of the units remaining are deducted.
      The make-up addition of an extension request counts the ride legs of the member that were picked up late or at which the ride did not show, in the two months before the day of the request: two or more such legs add two units, exactly one adds one unit, none adds nothing.
      The population addition of an extension request follows the member's eligibility category: Prairie Ridge Children's Medicaid or Prairie Ridge CHIP Kids adds four units; Prairie Ridge ABD Care or Prairie Ridge Dual Complete adds two units; any other category adds nothing.
      The risk addition of an extension request follows the risk score on the member's active care management episode: 3.00 or more adds two units; 2.00 up to 2.99 adds one unit; a lower score or no active episode adds nothing.
    prerequisite:
      - problem: auth_ext_provider_carryover
        kind: value_input
        gate: xr_remaining
        form: state
        policy_source: >-
          The units an extension request asks for are worked out only once the authorization names, as its servicing provider, the provider who will deliver the extended units.
        condition: >-
          The authorization's servicing_provider_npi is the provider who will deliver the extended units (the in-network provider the member now attends), with units_remaining set by that provider change.
        resolved_by: change_servicing_provider_0d360835
        effect: >-
          Once the servicing provider on the authorization is the provider who will deliver the extended units, the units remaining on it are the units carried over to that provider; the weeks and the deducted share of the units remaining in the extension request are worked out on that balance.
    cross_category:
      - category: care
        as: branch
        reads: [risk_score, status, care_activities.event_type, care_activities.activity_date]
        note: The weekly rate reads the care plan updates and the risk addition reads the risk score.
      - category: pcp
        as: history
        reads: [pcp_events.event_type, pcp_events.referral_type, pcp_events.event_date]
        note: The deducted share of the units remaining follows the primary care provider's referrals of the last six months.
      - category: ride
        as: history
        reads: [ride_trips.event_type, ride_trips.no_show_party, ride_trips.event_date]
        note: The make-up addition counts late pickups and ride no-shows.
      - category: plan
        as: branch
        reads: [variant_name]
        note: The population addition follows the eligibility category.
    compute:
      - xr_remaining: "F('units_remaining')"
      - xr_days_to_end: "DAYS(NOW, F('end_date'))"
      - xr_used_two_months: "SUM('auth_units','units', within_months=2, date_field='service_date', event_type='auth_units_used')"
      - xr_plan_updates: "XCOUNT('care','care_activities', within_months=1, date_field='activity_date', event_type='care_plan_update')"
      - xr_rate: "K('rate_restart') if (xr_used_two_months >= 1 and xr_used_two_months < 2 * P('weekly_frequency_cap') and xr_plan_updates >= 1) else (K('rate_low') if (xr_used_two_months == 0 or (xr_used_two_months < 2 * P('weekly_frequency_cap') and xr_plan_updates == 0)) else P('weekly_frequency_cap'))"
      - xr_weeks: "(xr_days_to_end + P('extension_days')) // 7 if (xr_days_to_end <= K('near_end_days') and xr_remaining <= P('weekly_frequency_cap')) else (P('extension_days') // 7 - 1 if (xr_days_to_end <= K('near_end_days') and xr_remaining > P('weekly_frequency_cap')) else P('extension_days') // 7)"
      - xr_standing_refs: "XCOUNT('pcp','pcp_events', within_months=6, date_field='event_date', event_type='pcp_referral_issue', referral_type='standing')"
      - xr_single_refs: "XCOUNT('pcp','pcp_events', within_months=6, date_field='event_date', event_type='pcp_referral_issue', referral_type='single')"
      - xr_deduct_halves: "0 if xr_standing_refs >= 1 else (K('deduct_halves_single') if xr_single_refs >= 1 else K('deduct_halves_all'))"
      - xr_deduction: "xr_remaining * xr_deduct_halves // K('halves')"
      - xr_missed_legs: "XCOUNT('ride','ride_trips', within_months=2, date_field='event_date', event_type='ride_late_pickup') + XCOUNT('ride','ride_trips', within_months=2, date_field='event_date', event_type='ride_no_show', no_show_party='provider')"
      - xr_missed_add: "K('missed_add_many') if xr_missed_legs >= 2 else (K('missed_add_one') if xr_missed_legs == 1 else 0)"
      - xr_category: "CFIELD('plan','variant_name')"
      - xr_category_add: "K('category_add_child') if (xr_category == \"Prairie Ridge Children's Medicaid\" or xr_category == 'Prairie Ridge CHIP Kids') else (K('category_add_disability') if (xr_category == 'Prairie Ridge ABD Care' or xr_category == 'Prairie Ridge Dual Complete') else 0)"
      - xr_risk: "CFIELD('care','risk_score', status='active')"
      - xr_risk_add: "K('risk_add_high') if (xr_risk != None and xr_risk >= K('risk_high')) else (K('risk_add_mid') if (xr_risk != None and xr_risk >= K('risk_mid')) else 0)"
      - result: "P('extension_max_units') if P('weekly_frequency_cap') == 0 else MX(0, xr_rate * xr_weeks - xr_deduction + xr_missed_add + xr_category_add + xr_risk_add)"
    compute_basis:
      xr_remaining: "less the units remaining on the authorization, never below zero."
      xr_days_to_end: "where the end date is no more than fourteen days after the day of the request"
      xr_used_two_months: "where at least one but fewer than twice the weekly frequency cap of uses were posted on the authorization with service dates in the two months before the day of the request"
      xr_plan_updates: "and a care plan update was recorded in the month before that day"
      xr_rate: "the rate is two units a week; where no use was posted in those two months, or fewer than twice the cap were posted and no such care plan update was recorded, the rate is one unit a week; otherwise the rate is the weekly frequency cap."
      xr_weeks: "where the end date is no more than fourteen days after the day of the request and the units remaining are no more than the weekly frequency cap, the weeks are counted from the day of the request to the end date asked for (the days to the current end date plus the extension days, divided by seven and rounded down); where the end date is no more than fourteen days away but the units remaining exceed the weekly frequency cap, the weeks are the whole weeks of the extension days less one week, which the remaining units cover; otherwise the weeks are the whole weeks of the extension days."
      xr_standing_refs: "The deducted share of the units remaining in an extension request follows the referrals of the member's primary care provider issued in the six months before the day of the request"
      xr_single_refs: "The deducted share of the units remaining in an extension request follows the referrals of the member's primary care provider issued in the six months before the day of the request"
      xr_deduct_halves: "where a standing referral was issued, the share is no halves, so nothing is deducted; where only a single referral was issued, the share is one half; otherwise the share is two halves, so all of the units remaining are deducted."
      xr_deduction: "the deduction being the units remaining multiplied by that share's halves and divided by two, rounded down"
      xr_missed_legs: "The make-up addition of an extension request counts the ride legs of the member that were picked up late or at which the ride did not show, in the two months before the day of the request"
      xr_missed_add: "two or more such legs add two units, exactly one adds one unit, none adds nothing."
      xr_category: "The population addition of an extension request follows the member's eligibility category"
      xr_category_add: "Prairie Ridge Children's Medicaid or Prairie Ridge CHIP Kids adds four units; Prairie Ridge ABD Care or Prairie Ridge Dual Complete adds two units; any other category adds nothing."
      xr_risk: "The risk addition of an extension request follows the risk score on the member's active care management episode"
      xr_risk_add: "3.00 or more adds two units; 2.00 up to 2.99 adds one unit; a lower score or no active episode adds nothing."
      result: "In a class that sets no weekly frequency cap, the units an extension request asks for are the class's extension allotment. The weekly rate and the weeks of that standard method are replaced as set out below, the share of the units remaining that is deducted is set as below, the deduction being the units remaining multiplied by that share's halves and divided by two, rounded down,, and three additions are made, each once, before the floor of zero is applied."
    factors:
      - id: weekly_rate
        effect: parameter
        decides: xr_rate
        bindings: [xr_used_two_months, xr_plan_updates, xr_rate]
        ladder:
          - when: "at least one but fewer than twice the weekly frequency cap of uses posted in the two months before the request AND a care plan update in the month before it"
            value: "K('rate_restart')"
          - when: "no use posted in those two months, OR fewer than twice the cap posted AND no such care plan update"
            value: "K('rate_low')"
          - when: "otherwise"
            value: "P('weekly_frequency_cap')"
        baseline:
          xr_rate: "P('weekly_frequency_cap')"
        evidence: [history, cross_category, tier_param]
        cross_difficulty: null
      - id: request_weeks
        effect: method
        decides: xr_weeks
        bindings: [xr_days_to_end, xr_weeks]
        ladder:
          - when: "the end date is no more than fourteen days away AND the units remaining are no more than the weekly frequency cap"
            method: "weeks from the day of the request to the end date asked for: days to the current end date plus the extension days, divided by seven, rounded down"
          - when: "the end date is no more than fourteen days away AND the units remaining exceed the weekly frequency cap"
            method: "whole weeks of the extension days less one week"
          - when: "otherwise"
            method: "whole weeks of the extension days"
        baseline:
          xr_weeks: "P('extension_days') // 7"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: remaining_units_share
        effect: parameter
        decides: xr_deduct_halves
        bindings: [xr_standing_refs, xr_single_refs, xr_deduct_halves]
        ladder:
          - when: "a standing referral issued by the primary care provider in the six months before the request"
            value: "0 (no halves: nothing deducted)"
          - when: "only a single referral issued in those six months"
            value: "K('deduct_halves_single')"
          - when: "otherwise"
            value: "K('deduct_halves_all')"
        baseline:
          xr_deduct_halves: "K('deduct_halves_all')"
        evidence: [cross_category, history]
        cross_difficulty: pcp
      - id: make_up_addition
        effect: parameter
        decides: xr_missed_add
        bindings: [xr_missed_legs, xr_missed_add]
        ladder:
          - when: "two or more ride legs picked up late or not shown by the ride in the two months before the request"
            value: "K('missed_add_many')"
          - when: "exactly one such leg"
            value: "K('missed_add_one')"
          - when: "otherwise"
            value: "0"
        baseline:
          xr_missed_add: "0"
        evidence: [cross_category, history]
        cross_difficulty: ride
      - id: population_addition
        effect: parameter
        decides: xr_category_add
        bindings: [xr_category, xr_category_add]
        ladder:
          - when: "the eligibility category is Prairie Ridge Children's Medicaid or Prairie Ridge CHIP Kids"
            value: "K('category_add_child')"
          - when: "the eligibility category is Prairie Ridge ABD Care or Prairie Ridge Dual Complete"
            value: "K('category_add_disability')"
          - when: "otherwise"
            value: "0"
        baseline:
          xr_category_add: "0"
        evidence: [cross_category]
        cross_difficulty: plan
      - id: risk_addition
        effect: parameter
        decides: xr_risk_add
        bindings: [xr_risk, xr_risk_add]
        ladder:
          - when: "the active care episode's risk score is 3.00 or more"
            value: "K('risk_add_high')"
          - when: "the risk score is 2.00 up to 2.99"
            value: "K('risk_add_mid')"
          - when: "otherwise (lower, or no active episode)"
            value: "0"
        baseline:
          xr_risk_add: "0"
        evidence: [cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        As the standard method, the units an extension request asks for are the class's weekly frequency cap multiplied by the whole weeks of the class's extension days (the extension days divided by seven and rounded down), less the units remaining on the authorization, never below zero.
        In a class that sets no weekly frequency cap, the units an extension request asks for are the class's extension allotment.
      params: [weekly_frequency_cap, extension_days, extension_max_units]
    inputs:
      history:
        - {table: auth_units, aggregate: sum, field: units, within_months: 2, filters: {event_type: auth_units_used}}
        - {category: care, table: care_activities, aggregate: count, field: care_activity_id, within_months: 1, filters: {event_type: care_plan_update}}
        - {category: pcp, table: pcp_events, aggregate: count, field: pcp_event_id, within_months: 6, filters: {event_type: pcp_referral_issue}}
        - {category: ride, table: ride_trips, aggregate: count, field: ride_trip_id, within_months: 2, filters: {event_type: ride_late_pickup}}
      cross_category: [care, pcp, ride, plan]
  - id: auth_ext_extension_units
    base_policy_refs: [auth_agg_annual_limit, auth_extension]
    overwrite: []
    trigger: on_request
    subject: [auth_extend]
    computes: units_added
    target_tool: record_extension_d36e0acf
    params:
      share_low: 1
      share_mid: 2
      share_full: 3
      share_parts: 3
      referral_large_visits: 20
      referral_mid_visits: 10
      referral_add_mid: 1
      referral_add_large: 2
      grievance_add_member: 1
      grievance_add_quality: 2
      grant_cut_mid: 1
      grant_cut_full: 2
      grant_mid_units: 6
      grant_full_units: 12
      category_add_disability: 1
      category_add_child: 3
    rule: >-
      An extension of an approved authorization moves its end date forward by the class's extension days and adds units granted by extension, never more than the class's extension allotment in one extension.
      The units an extension adds are fixed only after the authorization carries the member's extension request stating the additional units asked for.
      The units an extension adds are not worked out before the authorization names, as its servicing provider, the in-network provider who will deliver them.
      The units an extension adds are not recorded until no other approval of the member in the same class and, for therapy, the same therapy discipline stands approved over dates that overlap the period the extension adds.
      As the standard method, the units an extension adds are the units asked for on the member's latest extension request, less the units remaining on the authorization, never below zero and never more than the class's extension allotment.
      The share of the units asked for and the deduction of the units remaining in that standard method are set as below, and four adjustments are added or subtracted, each once, before the floor of zero and the ceiling of the class's extension allotment are applied; the share is taken first, as the units asked for multiplied by the share's thirds and divided by three, rounded down to a whole unit.
      The share of an extension follows the uses posted on the authorization with service dates in the two months before the day of the extension: fewer than twice the class's weekly frequency cap gives one third of the units asked for; at least twice but fewer than four times the cap gives two thirds; otherwise the full units asked for.
      The remaining-units deduction of an extension follows the member's care plan and the units remaining: where a care plan update was recorded in the month before the day of the extension and the units remaining are no more than the weekly frequency cap, nothing is deducted; where such an update was recorded and the units remaining exceed the weekly frequency cap, only the units the weekly frequency cap cannot deliver before the current end date are deducted, which are the units remaining less the weekly frequency cap multiplied by the whole weeks from the day of the extension to the current end date (the days divided by seven and rounded down), never below zero; otherwise all of the units remaining are deducted.
      The referral addition of an extension follows the largest number of visits on any referral the member's primary care provider has issued: twenty or more adds two units; ten to nineteen adds one unit; fewer, or no referral, adds nothing.
      The grievance addition of an extension counts the member's grievances filed in the three months before the day of the extension: a Quality of Care Grievance adds two units; where there is none but a Member Grievance, one unit is added; otherwise nothing is added.
      The prior-grant cut of an extension follows the units already granted on the authorization: twelve or more takes off two units; six to eleven takes off one unit; fewer takes off nothing.
      The population addition of an extension follows the member's eligibility category: Prairie Ridge Children's Medicaid or Prairie Ridge CHIP Kids adds three units; Prairie Ridge ABD Care or Prairie Ridge Dual Complete adds one unit; any other category adds nothing.
    prerequisite:
      - problem: auth_ext_member_extension_request
        kind: value_input
        gate: ex_asked
        form: state
        policy_source: >-
          The units an extension adds are fixed only after the authorization carries the member's extension request stating the additional units asked for.
        condition: >-
          The authorization carries an auth_actions row with event_type auth_extension_request and requested_by member stating requested_units.
        resolved_by: file_extension_request_1d826295
        effect: >-
          Once the member's extension request is on the authorization, the units asked for that the share acts on are that request's units.
      - problem: auth_ext_provider_carryover
        kind: value_input
        gate: ex_remaining
        form: state
        policy_source: >-
          The units an extension adds are not worked out before the authorization names, as its servicing provider, the in-network provider who will deliver them.
        condition: >-
          The authorization's servicing_provider_npi is the in-network provider who will deliver the extended units, with units_remaining set by that provider change.
        resolved_by: change_servicing_provider_0d360835
        effect: >-
          Once the provider who will deliver the units is on the authorization, the units remaining are the units carried over to that provider, which the remaining-units deduction of the extension acts on.
      - problem: auth_ext_void_release
        kind: state_gate
        gate: auth_authorizations.status
        form: state
        policy_source: >-
          The units an extension adds are not recorded until no other approval of the member in the same class and, for therapy, the same therapy discipline stands approved over dates that overlap the period the extension adds.
        condition: >-
          No other auth_authorizations row of the member with the same variant_name and, for therapy, the same therapy_discipline has status approved and start_date..end_date overlapping the days after the current end_date through the new end date.
        resolved_by: void_authorization_7849b1e5
        effect: >-
          Once the overlapping approval is voided, no other approval for the discipline stands over the extended period, and the extension may be recorded.
    cross_category:
      - category: care
        as: branch
        reads: [care_activities.event_type, care_activities.activity_date]
        note: The remaining-units deduction reads the care plan updates of the last month.
      - category: pcp
        as: history
        reads: [pcp_events.event_type, pcp_events.referral_visits]
        note: The referral addition reads the largest referral visit count.
      - category: appeal
        as: history
        reads: [appeal_cases.variant_name, appeal_cases.filed_date]
        note: The grievance addition counts grievances of the last three months.
      - category: plan
        as: branch
        reads: [variant_name]
        note: The population addition follows the eligibility category.
    compute:
      - ex_asked: "LATEST('auth_actions','requested_units', date_field='action_date', event_type='auth_extension_request')"
      - ex_remaining: "F('units_remaining')"
      - ex_used_two_months: "SUM('auth_units','units', within_months=2, date_field='service_date', event_type='auth_units_used')"
      - ex_share: "K('share_low') if ex_used_two_months < 2 * P('weekly_frequency_cap') else (K('share_mid') if ex_used_two_months < 4 * P('weekly_frequency_cap') else K('share_full'))"
      - ex_shared_units: "ex_asked * ex_share // K('share_parts')"
      - ex_plan_updates: "XCOUNT('care','care_activities', within_months=1, date_field='activity_date', event_type='care_plan_update')"
      - ex_weeks_to_end: "DAYS(NOW, F('end_date')) // 7"
      - ex_deduction: "0 if (ex_plan_updates >= 1 and ex_remaining <= P('weekly_frequency_cap')) else (MX(0, ex_remaining - P('weekly_frequency_cap') * ex_weeks_to_end) if (ex_plan_updates >= 1 and ex_remaining > P('weekly_frequency_cap')) else ex_remaining)"
      - ex_referral_visits: "XMAX('pcp','pcp_events','referral_visits', event_type='pcp_referral_issue')"
      - ex_referral_add: "K('referral_add_large') if ex_referral_visits >= K('referral_large_visits') else (K('referral_add_mid') if ex_referral_visits >= K('referral_mid_visits') else 0)"
      - ex_quality_grievances: "XCOUNT('appeal','appeal_cases', within_months=3, date_field='filed_date', variant_name='Quality of Care Grievance')"
      - ex_member_grievances: "XCOUNT('appeal','appeal_cases', within_months=3, date_field='filed_date', variant_name='Member Grievance')"
      - ex_grievance_add: "K('grievance_add_quality') if ex_quality_grievances >= 1 else (K('grievance_add_member') if ex_member_grievances >= 1 else 0)"
      - ex_granted: "SUM('auth_units','units', event_type='auth_units_granted')"
      - ex_grant_cut: "K('grant_cut_full') if ex_granted >= K('grant_full_units') else (K('grant_cut_mid') if ex_granted >= K('grant_mid_units') else 0)"
      - ex_category: "CFIELD('plan','variant_name')"
      - ex_category_add: "K('category_add_child') if (ex_category == \"Prairie Ridge Children's Medicaid\" or ex_category == 'Prairie Ridge CHIP Kids') else (K('category_add_disability') if (ex_category == 'Prairie Ridge ABD Care' or ex_category == 'Prairie Ridge Dual Complete') else 0)"
      - result: "MX(0, MN(P('extension_max_units'), ex_shared_units - ex_deduction + ex_referral_add + ex_grievance_add - ex_grant_cut + ex_category_add))"
    compute_basis:
      ex_asked: "As the standard method, the units an extension adds are the units asked for on the member's latest extension request"
      ex_remaining: "less the units remaining on the authorization, never below zero and never more than the class's extension allotment."
      ex_used_two_months: "The share of an extension follows the uses posted on the authorization with service dates in the two months before the day of the extension"
      ex_share: "fewer than twice the class's weekly frequency cap gives one third of the units asked for; at least twice but fewer than four times the cap gives two thirds; otherwise the full units asked for."
      ex_shared_units: "the share is taken first, as the units asked for multiplied by the share's thirds and divided by three, rounded down to a whole unit."
      ex_plan_updates: "The remaining-units deduction of an extension follows the member's care plan and the units remaining"
      ex_weeks_to_end: "the whole weeks from the day of the extension to the current end date (the days divided by seven and rounded down)"
      ex_deduction: "where a care plan update was recorded in the month before the day of the extension and the units remaining are no more than the weekly frequency cap, nothing is deducted; where such an update was recorded and the units remaining exceed the weekly frequency cap, only the units the weekly frequency cap cannot deliver before the current end date are deducted, which are the units remaining less the weekly frequency cap multiplied by the whole weeks from the day of the extension to the current end date (the days divided by seven and rounded down), never below zero; otherwise all of the units remaining are deducted."
      ex_referral_visits: "The referral addition of an extension follows the largest number of visits on any referral the member's primary care provider has issued"
      ex_referral_add: "twenty or more adds two units; ten to nineteen adds one unit; fewer, or no referral, adds nothing."
      ex_quality_grievances: "The grievance addition of an extension counts the member's grievances filed in the three months before the day of the extension"
      ex_member_grievances: "The grievance addition of an extension counts the member's grievances filed in the three months before the day of the extension"
      ex_grievance_add: "a Quality of Care Grievance adds two units; where there is none but a Member Grievance, one unit is added; otherwise nothing is added."
      ex_granted: "The prior-grant cut of an extension follows the units already granted on the authorization"
      ex_grant_cut: "twelve or more takes off two units; six to eleven takes off one unit; fewer takes off nothing."
      ex_category: "The population addition of an extension follows the member's eligibility category"
      ex_category_add: "Prairie Ridge Children's Medicaid or Prairie Ridge CHIP Kids adds three units; Prairie Ridge ABD Care or Prairie Ridge Dual Complete adds one unit; any other category adds nothing."
      result: "four adjustments are added or subtracted, each once, before the floor of zero and the ceiling of the class's extension allotment are applied"
    factors:
      - id: asked_share
        effect: parameter
        decides: ex_share
        bindings: [ex_used_two_months, ex_share]
        ladder:
          - when: "fewer than twice the weekly frequency cap of uses posted in the two months before the extension"
            value: "K('share_low') thirds"
          - when: "at least twice but fewer than four times the cap"
            value: "K('share_mid') thirds"
          - when: "otherwise"
            value: "K('share_full') thirds (the full units asked for)"
        baseline:
          ex_share: "K('share_full')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: remaining_units_deduction
        effect: method
        decides: ex_deduction
        bindings: [ex_plan_updates, ex_weeks_to_end, ex_deduction]
        ladder:
          - when: "a care plan update in the month before the extension AND units remaining no more than the weekly frequency cap"
            method: "nothing is deducted"
          - when: "a care plan update in that month AND units remaining above the weekly frequency cap"
            method: "only the units the weekly frequency cap cannot deliver before the current end date are deducted: units remaining less the cap times the whole weeks to the current end date, never below zero"
          - when: "otherwise"
            method: "all of the units remaining are deducted"
        baseline:
          ex_deduction: "ex_remaining"
        evidence: [cross_category, history, date]
        cross_difficulty: null
      - id: referral_addition
        effect: parameter
        decides: ex_referral_add
        bindings: [ex_referral_visits, ex_referral_add]
        ladder:
          - when: "the largest referral issued by the primary care provider covers twenty or more visits"
            value: "K('referral_add_large')"
          - when: "it covers ten to nineteen visits"
            value: "K('referral_add_mid')"
          - when: "otherwise (fewer, or no referral)"
            value: "0"
        baseline:
          ex_referral_add: "0"
        evidence: [cross_category]
        cross_difficulty: pcp
      - id: grievance_addition
        effect: parameter
        decides: ex_grievance_add
        bindings: [ex_quality_grievances, ex_member_grievances, ex_grievance_add]
        ladder:
          - when: "a Quality of Care Grievance filed in the three months before the extension"
            value: "K('grievance_add_quality')"
          - when: "no such grievance but a Member Grievance filed in those months"
            value: "K('grievance_add_member')"
          - when: "otherwise"
            value: "0"
        baseline:
          ex_grievance_add: "0"
        evidence: [cross_category, history]
        cross_difficulty: null
      - id: prior_grant_cut
        effect: parameter
        decides: ex_grant_cut
        bindings: [ex_granted, ex_grant_cut]
        ladder:
          - when: "twelve or more units already granted on the authorization"
            value: "K('grant_cut_full')"
          - when: "six to eleven units already granted"
            value: "K('grant_cut_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          ex_grant_cut: "0"
        evidence: [history]
        cross_difficulty: null
      - id: population_addition
        effect: parameter
        decides: ex_category_add
        bindings: [ex_category, ex_category_add]
        ladder:
          - when: "the eligibility category is Prairie Ridge Children's Medicaid or Prairie Ridge CHIP Kids"
            value: "K('category_add_child')"
          - when: "the eligibility category is Prairie Ridge ABD Care or Prairie Ridge Dual Complete"
            value: "K('category_add_disability')"
          - when: "otherwise"
            value: "0"
        baseline:
          ex_category_add: "0"
        evidence: [cross_category]
        cross_difficulty: plan
    baseline:
      rule: >-
        As the standard method, the units an extension adds are the units asked for on the member's latest extension request, less the units remaining on the authorization, never below zero and never more than the class's extension allotment.
      params: [extension_max_units]
    inputs:
      history:
        - {table: auth_actions, aggregate: latest, field: requested_units, filters: {event_type: auth_extension_request}}
        - {table: auth_units, aggregate: sum, field: units, within_months: 2, filters: {event_type: auth_units_used}}
        - {table: auth_units, aggregate: sum, field: units, filters: {event_type: auth_units_granted}}
        - {category: care, table: care_activities, aggregate: count, field: care_activity_id, within_months: 1, filters: {event_type: care_plan_update}}
        - {category: pcp, table: pcp_events, aggregate: max, field: referral_visits, filters: {event_type: pcp_referral_issue}}
        - {category: appeal, table: appeal_cases, aggregate: count, field: appeal_case_id, within_months: 3, filters: {}}
      cross_category: [care, pcp, appeal, plan]
