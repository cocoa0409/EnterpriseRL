events:
- type: auth_submit
  target: auth_authorizations
  mutation: create
  meaning: A prior authorization request is received for the member.
  grain: One row per request.
  fields:
    membership_id: Plan membership.
    variant_name: Authorization class.
    auth_number: Authorization number.
    service_code: CPT/HCPCS code.
    therapy_discipline: Discipline for therapy requests.
    requesting_provider_npi: Requesting provider.
    servicing_provider_npi: Servicing provider.
    network_status: Servicing provider network status.
    review_type: standard or expedited.
    request_origin: How the request arose.
    prior_plan_auth_number: Prior plan's authorization number for transition of care.
    received_date: Date received.
    start_date: Requested first service date.
    units_requested: Units requested.
  triggers: []
- type: auth_pend
  target: auth_authorizations
  mutation:
    transition:
      from: submitted
      to: pended_info
  meaning: The reviewer pends the request for clinical information.
  grain: One transition per information request.
  fields:
    decision_date: Stays empty while pended.
  triggers:
  - event: auth:auth_notice
    map:
      notice_type: pend_request_for_information
      delivery_channel: provider_portal
- type: auth_info_received
  target: auth_authorizations
  mutation:
    transition:
      from: pended_info
      to: submitted
  meaning: Requested clinical information arrives.
  grain: One transition per information response.
  fields:
    decision_date: Stays empty until decided.
  triggers: []
- type: auth_approve
  target: auth_authorizations
  mutation:
    transition:
    - from: submitted
      to: approved
    - from: denied
      to: approved
  meaning: The request is approved in full or in part, or a denial is overturned.
  grain: One transition per approval.
  fields:
    decision_date: Decision date.
    start_date: First date units may be used.
    end_date: Last date units may be used.
    units_approved: Units approved.
    request_origin: Carried unchanged from the request.
  triggers:
  - event: auth:auth_units_granted
    when:
      request_origin:
      - provider_request
      - retro_request
    map:
      units: units_approved
      grant_type: initial_approval
  - event: auth:auth_units_granted
    when:
      request_origin: transition_of_care
    map:
      units: units_approved
      grant_type: transition_of_care
  - event: auth:auth_notice
    map:
      notice_type: approval
      delivery_channel: mail
- type: auth_deny
  target: auth_authorizations
  mutation:
    transition:
    - from: submitted
      to: denied
    - from: pended_info
      to: denied
  meaning: The request is denied.
  grain: One transition per denial.
  fields:
    decision_date: Decision date.
    denial_reason: Controlled denial reason.
  triggers:
  - event: auth:auth_notice
    map:
      notice_type: adverse_benefit_determination
      delivery_channel: mail
- type: auth_expire
  target: auth_authorizations
  mutation:
    transition:
      from: approved
      to: expired
  meaning: The approval's end_date passes.
  grain: One transition per approval.
  fields:
    closed_date: Day after end_date.
  triggers:
  - event: auth:auth_units_released
    map:
      release_reason: expired
      posted_date: closed_date
- type: auth_void
  target: auth_authorizations
  mutation:
    transition:
      from: approved
      to: voided
  meaning: An approval is voided at the member's request.
  grain: One transition per voided approval.
  fields:
    closed_date: Date voided.
  triggers:
  - event: auth:auth_units_released
    map:
      release_reason: voided
      posted_date: closed_date
- type: auth_withdraw
  target: auth_authorizations
  mutation:
    transition:
    - from: submitted
      to: withdrawn
    - from: pended_info
      to: withdrawn
  meaning: The member withdraws a request before a decision.
  grain: One transition per withdrawn request.
  fields:
    closed_date: Date withdrawn.
  triggers: []
- type: auth_provider_update
  target: auth_authorizations
  mutation: update
  meaning: The servicing provider on an approval changes.
  grain: One update per provider change.
  fields:
    servicing_provider_npi: New servicing provider.
    network_status: Network status of the new provider.
  triggers: []
- type: auth_extend
  target: auth_authorizations
  mutation: update
  meaning: An approved extension moves end_date and adds units.
  grain: One update per granted extension.
  fields:
    end_date: New end date.
    units_approved: Total units approved including extensions.
  triggers:
  - event: auth:auth_units_granted
    map:
      grant_type: extension
- type: auth_units_granted
  target: auth_units
  meaning: Units are granted on an authorization.
  grain: One row per grant.
  distinguish_by:
  - grant_type
  - posted_date
  fields:
    units: Units granted.
    grant_type: Why granted.
    posted_date: Date posted.
  account: authorized_units
  direction: in
  triggers: []
- type: auth_units_used
  target: auth_units
  meaning: A paid claim uses units of an authorization.
  grain: One row per claim line using units.
  distinguish_by:
  - claim_number
  - service_date
  fields:
    units: Units used.
    claim_number: Claim number of the claim that used them.
    service_date: Service date.
    posted_date: Date posted.
  account: authorized_units
  direction: out
  triggers: []
- type: auth_units_released
  target: auth_units
  meaning: Unused units are released at expiry or void.
  grain: One row per release.
  distinguish_by:
  - release_reason
  fields:
    units: Units released.
    release_reason: expired or voided.
    posted_date: Date posted.
  account: authorized_units
  direction: out
  triggers: []
- type: auth_expedite_request
  target: auth_actions
  meaning: The member or provider asks for expedited review.
  grain: One row per expedite request.
  distinguish_by:
  - action_date
  - requested_by
  fields:
    action_date: Date of the request.
    requested_by: Who asked.
    provider_certified_urgent: >-
      Whether the provider certified that the standard timeframe could seriously jeopardize health.
  triggers: []
- type: auth_extension_request
  target: auth_actions
  meaning: An extension of an approval is requested.
  grain: One row per extension request.
  distinguish_by:
  - action_date
  - requested_units
  fields:
    action_date: Date requested.
    requested_by: Who asked.
    requested_units: Additional units requested.
    requested_end_date: End date requested.
  triggers: []
- type: auth_timeline_extension
  target: auth_actions
  meaning: The decision deadline is extended.
  grain: One row per deadline extension.
  distinguish_by:
  - action_date
  fields:
    action_date: Date the extension was taken.
    requested_by: member or plan.
    extension_days: Days added.
  triggers:
  - event: auth:auth_notice
    map:
      notice_type: extension_of_review_time
      delivery_channel: mail
- type: auth_notice
  target: auth_actions
  meaning: A notice about the authorization is sent.
  grain: One row per notice per channel.
  distinguish_by:
  - notice_type
  - action_date
  - delivery_channel
  fields:
    action_date: Date sent.
    notice_type: Which notice.
    delivery_channel: Channel.
  triggers: []
measures:
- id: auth_msr_annual_units
  window: Calendar year (January 1 - December 31) of the requested start_date.
  measure: >-
    Sum of auth_units.units over auth_units_granted rows minus auth_units_released rows, across the member's
    authorizations of the same variant_name and the same annual_limit_basis value (therapy_discipline
    for therapy, the service type otherwise) whose start_date falls in the year.
- id: auth_msr_extensions
  window: Life of the authorization.
  measure: Count of auth_units_granted rows with grant_type = extension on the authorization.
- id: auth_msr_pends
  window: Life of the request.
  measure: >-
    Count of auth_notice rows with notice_type = pend_request_for_information on the authorization.
- id: auth_msr_week_units
  window: The Monday-Sunday week containing the service date.
  measure: >-
    Sum of auth_units.units over auth_units_used rows on the authorization with service_date in that week.
policies:
- id: auth_agg_multi_holding
  subject:
  - auth_submit
  rule: >-
    A member may hold any number of authorizations across classes and services; each request is its own
    authorization.
  eligibility: []
  params:
    max_per_customer: null
- id: auth_agg_duplicate_request
  subject:
  - auth_submit
  rule: >-
    Authorizations are combined per member and service_code: two open requests for the same service over
    overlapping dates are one request. A new request is not opened when the member already holds an authorization
    for the same service_code in submitted, pended_info or approved status whose dates overlap the requested
    dates. A request whose dates do not overlap any open authorization for the service, or whose earlier
    authorization is denied, expired, voided or withdrawn, is a new request.
  eligibility:
  - id: no_open_duplicate
    applies_to:
    - auth_submit
    kind: dedup
    condition: >-
      A new request is not opened when the member already holds an authorization for the same service_code
      in submitted, pended_info or approved status whose dates overlap the requested dates.
    evidence_fields:
    - auth_authorizations.customer_id
    - auth_authorizations.service_code
    - auth_authorizations.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auth_authorizations.customer_id
        - auth_authorizations.service_code
      action_bindings:
        auth_authorizations.customer_id: customer_id
        auth_authorizations.service_code: service_code
    dedup_contract:
      table: auth_authorizations
      mode: separate_record
      object_bindings:
        customer_id: customer_id
        service_code: service_code
      duplicate_filters:
        status:
        - submitted
        - pended_info
        - approved
      distinct_fields:
      - start_date
  params:
    per_tier:
      Advanced Imaging Authorization:
        max_open_same_service: =max_open_requests_same_service
      Outpatient Rehabilitation Therapy Authorization:
        max_open_same_service: =max_open_requests_same_service
      Durable Medical Equipment Authorization:
        max_open_same_service: =max_open_requests_same_service
      Home Health Services Authorization:
        max_open_same_service: =max_open_requests_same_service
      Behavioral Health Intensive Services Authorization:
        max_open_same_service: =max_open_requests_same_service
      Elective Inpatient and Surgical Authorization:
        max_open_same_service: =max_open_requests_same_service
      Out-of-Network Services Authorization:
        max_open_same_service: =max_open_requests_same_service
- id: auth_agg_annual_limit
  subject:
  - auth_approve
  - auth_extend
  - auth_units_granted
  rule: >-
    Where annual_limit_applies, the units granted to one member in a calendar year for the same class
    and annual_limit_basis may not exceed annual_unit_limit, counting every authorization of the member
    together (auth_msr_annual_units). An approval or extension that would pass the limit is granted only
    up to the units left, and a request with no units left is denied with denial_reason annual_limit_reached.
    Members under age 21 on the requested start_date are exempt from the annual limit and from max_units_per_auth
    where under_21_limit_exempt is true, and their units are granted as medically necessary.
  eligibility: []
  params:
    per_tier:
      Advanced Imaging Authorization:
        applies: =annual_limit_applies
        limit: =annual_unit_limit
        basis: =annual_limit_basis
        under_21_exempt: =under_21_limit_exempt
      Outpatient Rehabilitation Therapy Authorization:
        applies: =annual_limit_applies
        limit: =annual_unit_limit
        basis: =annual_limit_basis
        under_21_exempt: =under_21_limit_exempt
      Durable Medical Equipment Authorization:
        applies: =annual_limit_applies
        limit: =annual_unit_limit
        basis: =annual_limit_basis
        under_21_exempt: =under_21_limit_exempt
      Home Health Services Authorization:
        applies: =annual_limit_applies
        limit: =annual_unit_limit
        basis: =annual_limit_basis
        under_21_exempt: =under_21_limit_exempt
      Behavioral Health Intensive Services Authorization:
        applies: =annual_limit_applies
        limit: =annual_unit_limit
        basis: =annual_limit_basis
        under_21_exempt: =under_21_limit_exempt
      Elective Inpatient and Surgical Authorization:
        applies: =annual_limit_applies
        limit: =annual_unit_limit
        basis: =annual_limit_basis
        under_21_exempt: =under_21_limit_exempt
      Out-of-Network Services Authorization:
        applies: =annual_limit_applies
        limit: =annual_unit_limit
        basis: =annual_limit_basis
        under_21_exempt: =under_21_limit_exempt
  formula:
    units_left: max(0, annual_unit_limit - auth_msr_annual_units)
    units_grantable: min(units, units_left) if annual_limit_applies else units
  measures:
  - auth_msr_annual_units
- id: auth_turnaround
  subject:
  - auth_approve
  - auth_deny
  - auth_timeline_extension
  rule: >-
    A standard request is decided within standard_decision_days of received_date and an expedited request
    within expedited_decision_hours of receipt. The deadline may be extended once by up to review_extension_max_days
    when the member asks for it or when the plan needs information and the extension is in the member's
    interest; the member is sent written notice of the extension and of the right to file a grievance
    about it. A deadline extension is taken no later than standard_decision_days after the request's received
    date. The decision days are counted in calendar days from the day after the received date, and an
    extension taken on the last day still qualifies. A request not decided by its deadline is treated
    as denied on the deadline day for purposes of the member's appeal rights.
  eligibility:
  - id: extend_before_deadline
    applies_to:
    - auth_timeline_extension
    kind: time
    condition: >-
      A deadline extension is taken no later than standard_decision_days after the request's received
      date.
    evidence_fields:
    - auth_authorizations.authorization_id
    - auth_authorizations.received_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auth_authorizations.authorization_id
      action_bindings:
        auth_authorizations.authorization_id: authorization_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the request's received date
      anchor_source: auth_authorizations.received_date
      relation: not_after
      duration_source: variants.standard_decision_days
      unit: calendar_days
      counting_rule: >-
        The decision days are counted in calendar days from the day after the received date, and an extension
        taken on the last day still qualifies.
      boundary: inclusive
  params:
    per_tier:
      Advanced Imaging Authorization:
        standard_days: =standard_decision_days
        expedited_hours: =expedited_decision_hours
        extension_max_days: =review_extension_max_days
      Outpatient Rehabilitation Therapy Authorization:
        standard_days: =standard_decision_days
        expedited_hours: =expedited_decision_hours
        extension_max_days: =review_extension_max_days
      Durable Medical Equipment Authorization:
        standard_days: =standard_decision_days
        expedited_hours: =expedited_decision_hours
        extension_max_days: =review_extension_max_days
      Home Health Services Authorization:
        standard_days: =standard_decision_days
        expedited_hours: =expedited_decision_hours
        extension_max_days: =review_extension_max_days
      Behavioral Health Intensive Services Authorization:
        standard_days: =standard_decision_days
        expedited_hours: =expedited_decision_hours
        extension_max_days: =review_extension_max_days
      Elective Inpatient and Surgical Authorization:
        standard_days: =standard_decision_days
        expedited_hours: =expedited_decision_hours
        extension_max_days: =review_extension_max_days
      Out-of-Network Services Authorization:
        standard_days: =standard_decision_days
        expedited_hours: =expedited_decision_hours
        extension_max_days: =review_extension_max_days
- id: auth_expedited_review
  subject:
  - auth_expedite_request
  - auth_notice
  rule: >-
    Expedited review is mandatory when the requesting or servicing provider certifies that the standard
    timeframe could seriously jeopardize the member's life, health or ability to regain maximum function.
    A member's own expedite request, made through a channel in expedite_member_channels, is judged by
    the plan physician on the same standard; if refused, the request continues as a standard review, the
    member is told orally at once and written notice follows within expedite_denial_written_notice_days.
    An expedite request is recorded only while the authorization is in submitted or pended_info status.
    A request already decided cannot be expedited; the member's route is an appeal.
  eligibility:
  - id: expedite_open_request
    applies_to:
    - auth_expedite_request
    kind: state
    condition: >-
      An expedite request is recorded only while the authorization is in submitted or pended_info status.
    evidence_fields:
    - auth_authorizations.authorization_id
    - auth_authorizations.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auth_authorizations.authorization_id
      action_bindings:
        auth_authorizations.authorization_id: authorization_id
    state_contract:
      field: auth_authorizations.status
      allowed:
      - submitted
      - pended_info
  params:
    per_tier:
      Advanced Imaging Authorization:
        member_can_request: =member_can_request_expedited
        provider_binding: =provider_certification_binding
        converts: =expedite_denial_converts_to_standard
        written_days: =expedite_denial_written_notice_days
        channels: =expedite_member_channels
        oral_notice: =expedited_oral_notice_required
      Outpatient Rehabilitation Therapy Authorization:
        member_can_request: =member_can_request_expedited
        provider_binding: =provider_certification_binding
        converts: =expedite_denial_converts_to_standard
        written_days: =expedite_denial_written_notice_days
        channels: =expedite_member_channels
        oral_notice: =expedited_oral_notice_required
      Durable Medical Equipment Authorization:
        member_can_request: =member_can_request_expedited
        provider_binding: =provider_certification_binding
        converts: =expedite_denial_converts_to_standard
        written_days: =expedite_denial_written_notice_days
        channels: =expedite_member_channels
        oral_notice: =expedited_oral_notice_required
      Home Health Services Authorization:
        member_can_request: =member_can_request_expedited
        provider_binding: =provider_certification_binding
        converts: =expedite_denial_converts_to_standard
        written_days: =expedite_denial_written_notice_days
        channels: =expedite_member_channels
        oral_notice: =expedited_oral_notice_required
      Behavioral Health Intensive Services Authorization:
        member_can_request: =member_can_request_expedited
        provider_binding: =provider_certification_binding
        converts: =expedite_denial_converts_to_standard
        written_days: =expedite_denial_written_notice_days
        channels: =expedite_member_channels
        oral_notice: =expedited_oral_notice_required
      Elective Inpatient and Surgical Authorization:
        member_can_request: =member_can_request_expedited
        provider_binding: =provider_certification_binding
        converts: =expedite_denial_converts_to_standard
        written_days: =expedite_denial_written_notice_days
        channels: =expedite_member_channels
        oral_notice: =expedited_oral_notice_required
      Out-of-Network Services Authorization:
        member_can_request: =member_can_request_expedited
        provider_binding: =provider_certification_binding
        converts: =expedite_denial_converts_to_standard
        written_days: =expedite_denial_written_notice_days
        channels: =expedite_member_channels
        oral_notice: =expedited_oral_notice_required
- id: auth_validity_units
  subject:
  - auth_approve
  - auth_units_granted
  - auth_units_used
  - auth_expire
  rule: >-
    An approval runs from start_date through end_date, where end_date is start_date plus auth_validity_days
    minus one, and grants at most max_units_per_auth units of the class's unit_basis. Units are used only
    by paid claims with a service date from start_date through end_date and from the servicing provider
    on the authorization, and never more than weekly_frequency_cap in one Monday-Sunday week where a weekly
    cap applies (auth_msr_week_units). Units are used only on an authorization in approved or expired
    status whose dates contain the claim's service date. Units left on end_date are released the next
    day and cannot be used later where expired_units_forfeited is true.
  eligibility:
  - id: usage_window
    applies_to:
    - auth_units_used
    kind: state
    condition: >-
      Units are used only on an authorization in approved or expired status whose dates contain the claim's
      service date.
    evidence_fields:
    - auth_authorizations.authorization_id
    - auth_authorizations.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auth_authorizations.authorization_id
      action_bindings:
        auth_authorizations.authorization_id: authorization_id
    state_contract:
      field: auth_authorizations.status
      allowed:
      - approved
      - expired
  params:
    per_tier:
      Advanced Imaging Authorization:
        validity_days: =auth_validity_days
        max_units: =max_units_per_auth
        weekly_cap: =weekly_frequency_cap
        unit_basis: =unit_basis
        forfeit: =expired_units_forfeited
        criteria: =clinical_criteria_set
      Outpatient Rehabilitation Therapy Authorization:
        validity_days: =auth_validity_days
        max_units: =max_units_per_auth
        weekly_cap: =weekly_frequency_cap
        unit_basis: =unit_basis
        forfeit: =expired_units_forfeited
        criteria: =clinical_criteria_set
      Durable Medical Equipment Authorization:
        validity_days: =auth_validity_days
        max_units: =max_units_per_auth
        weekly_cap: =weekly_frequency_cap
        unit_basis: =unit_basis
        forfeit: =expired_units_forfeited
        criteria: =clinical_criteria_set
      Home Health Services Authorization:
        validity_days: =auth_validity_days
        max_units: =max_units_per_auth
        weekly_cap: =weekly_frequency_cap
        unit_basis: =unit_basis
        forfeit: =expired_units_forfeited
        criteria: =clinical_criteria_set
      Behavioral Health Intensive Services Authorization:
        validity_days: =auth_validity_days
        max_units: =max_units_per_auth
        weekly_cap: =weekly_frequency_cap
        unit_basis: =unit_basis
        forfeit: =expired_units_forfeited
        criteria: =clinical_criteria_set
      Elective Inpatient and Surgical Authorization:
        validity_days: =auth_validity_days
        max_units: =max_units_per_auth
        weekly_cap: =weekly_frequency_cap
        unit_basis: =unit_basis
        forfeit: =expired_units_forfeited
        criteria: =clinical_criteria_set
      Out-of-Network Services Authorization:
        validity_days: =auth_validity_days
        max_units: =max_units_per_auth
        weekly_cap: =weekly_frequency_cap
        unit_basis: =unit_basis
        forfeit: =expired_units_forfeited
        criteria: =clinical_criteria_set
  formula:
    units_granted: min(units_requested, max_units_per_auth)
  measures:
  - auth_msr_week_units
- id: auth_extension
  subject:
  - auth_extension_request
  - auth_extend
  - auth_units_granted
  rule: >-
    Where extension_allowed, an approval may be extended up to max_extensions_per_auth times (auth_msr_extensions),
    each adding at most extension_max_units and moving end_date forward by extension_days. An extension
    request is accepted as an extension only when it is received no later than extension_late_grace_days
    after the authorization's end date. The grace days are counted in calendar days from the day after
    the end date, and a request on the last grace day still qualifies. An extension is requested only
    on an authorization in approved or expired status. A request received later, or beyond the extension
    count, is handled as a new request with its own review.
  eligibility:
  - id: extension_timing
    applies_to:
    - auth_extension_request
    kind: time
    condition: >-
      An extension request is accepted as an extension only when it is received no later than extension_late_grace_days
      after the authorization's end date.
    evidence_fields:
    - auth_authorizations.authorization_id
    - auth_authorizations.end_date
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auth_authorizations.authorization_id
      action_bindings:
        auth_authorizations.authorization_id: authorization_id
    temporal_basis:
      clock: frozen_time
      anchor_event: the authorization's end date
      anchor_source: auth_authorizations.end_date
      relation: not_after
      duration_source: variants.extension_late_grace_days
      unit: calendar_days
      counting_rule: >-
        The grace days are counted in calendar days from the day after the end date, and a request on
        the last grace day still qualifies.
      boundary: inclusive
  - id: extension_on_approval
    applies_to:
    - auth_extension_request
    kind: state
    condition: An extension is requested only on an authorization in approved or expired status.
    evidence_fields:
    - auth_authorizations.authorization_id
    - auth_authorizations.status
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - - auth_authorizations.authorization_id
      action_bindings:
        auth_authorizations.authorization_id: authorization_id
    state_contract:
      field: auth_authorizations.status
      allowed:
      - approved
      - expired
  params:
    per_tier:
      Advanced Imaging Authorization:
        allowed: =extension_allowed
        max_extensions: =max_extensions_per_auth
        max_units: =extension_max_units
        days: =extension_days
        late_grace: =extension_late_grace_days
        concurrent_review: =concurrent_review_interval_days
      Outpatient Rehabilitation Therapy Authorization:
        allowed: =extension_allowed
        max_extensions: =max_extensions_per_auth
        max_units: =extension_max_units
        days: =extension_days
        late_grace: =extension_late_grace_days
        concurrent_review: =concurrent_review_interval_days
      Durable Medical Equipment Authorization:
        allowed: =extension_allowed
        max_extensions: =max_extensions_per_auth
        max_units: =extension_max_units
        days: =extension_days
        late_grace: =extension_late_grace_days
        concurrent_review: =concurrent_review_interval_days
      Home Health Services Authorization:
        allowed: =extension_allowed
        max_extensions: =max_extensions_per_auth
        max_units: =extension_max_units
        days: =extension_days
        late_grace: =extension_late_grace_days
        concurrent_review: =concurrent_review_interval_days
      Behavioral Health Intensive Services Authorization:
        allowed: =extension_allowed
        max_extensions: =max_extensions_per_auth
        max_units: =extension_max_units
        days: =extension_days
        late_grace: =extension_late_grace_days
        concurrent_review: =concurrent_review_interval_days
      Elective Inpatient and Surgical Authorization:
        allowed: =extension_allowed
        max_extensions: =max_extensions_per_auth
        max_units: =extension_max_units
        days: =extension_days
        late_grace: =extension_late_grace_days
        concurrent_review: =concurrent_review_interval_days
      Out-of-Network Services Authorization:
        allowed: =extension_allowed
        max_extensions: =max_extensions_per_auth
        max_units: =extension_max_units
        days: =extension_days
        late_grace: =extension_late_grace_days
        concurrent_review: =concurrent_review_interval_days
  measures:
  - auth_msr_extensions
- id: auth_transition_of_care
  subject:
  - auth_submit
  - auth_approve
  - auth_units_granted
  rule: >-
    A new member's authorization from the prior health plan is honored without a new medical necessity
    review for the units the prior authorization had left, from any provider including out-of-network
    ones where toc_out_of_network_honored is true. A transition-of-care request is accepted only when
    received no later than transition_of_care_days after the member's plan coverage start date. The transition
    days are counted in calendar days from the day after the coverage start date, and a request on the
    last day still qualifies. The honored authorization ends on the earlier of the prior authorization's
    end date and the last day of the transition period, and requires the prior plan's authorization number
    where toc_requires_prior_auth_number is true. After the transition period the service needs an ordinary
    request.
  eligibility:
  - id: toc_window
    applies_to:
    - auth_submit
    kind: time
    condition: >-
      A transition-of-care request is accepted only when received no later than transition_of_care_days
      after the member's plan coverage start date.
    evidence_fields:
    - plan_memberships.membership_id
    - plan_memberships.coverage_start_date
    evidence_contract:
      authority: system_record
      timing: pre_action
