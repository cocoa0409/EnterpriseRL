# ============================================================================
# extended_policies (erl-task-instantiate, difficulty prior_authorization_services)
# ============================================================================
extended_policies:
  - id: auth_ext_expiry_release
    base_policy_refs: [auth_void_withdraw, auth_validity_units]
    overwrite:
      - base_policy: auth_validity_units
        superseded_clause: >-
          Units left on end_date are released the next day and cannot be used later where expired_units_forfeited is true.
        replaced_by: >-
          Once an approval's end date has passed, the units it left unused are released less the hold-backs set out below, and the units held back stay on the ended approval only for claims whose service dates fall inside it.
    trigger: state_due
    subject: [auth_units_released]
    computes: units_released
    target_tool: release_expired_units_43b7942e
    params:
      lag_short_days: 14
      lag_long_days: 45
      reprocess_hold_one: 1
      reprocess_hold_many: 2
      appeal_hold_one: 1
      appeal_hold_many: 2
      session_hold_other: 1
      session_hold_complex: 2
    rule: >-
      Once an approval's end date has passed, the units it left unused are released less the hold-backs set out below, and the units held back stay on the ended approval only for claims whose service dates fall inside it.
      The release is owed as soon as the approval has ended, whether or not anyone asks for it, and it is booked as one expiry release entry dated the day it is booked.
      An approval whose end date has passed owes this expiry release whatever its status shows, including an approval whose expiry was recorded without a release entry; it is the expiry release, never a void, that returns the unused units of such an approval.
      The units an expiry release returns are the units granted on the ended approval, less the units posted as used on it, less any units already released from it, counted in whole units and never below zero.
      From that figure four hold-backs are subtracted, each a whole number of units, and the result is never below zero; every hold-back is subtracted from the same figure, so the order of subtraction does not change the result.
      The claims-lag hold-back of an expiry release is set by the days that have passed since the approval's end date, counted from the day after the end date through the day the release is booked, and by the approval's weekly pace, which is the units posted as used divided by the approval's whole weeks (its days from start date through end date counted inclusively, divided by seven and rounded down, and never fewer than one week).
      Where no more than fourteen days have passed since the end date, the expiry release holds back the weekly pace multiplied by the days passed and divided by seven, rounded down to a whole unit; where fifteen to forty-five days have passed, it holds back one week of the weekly pace, rounded down to a whole unit; where more than forty-five days have passed, it holds back nothing for claims lag.
      The reprocessing hold-back of an expiry release counts the member's claims denied for no prior authorization whose service dates fall within the two months before the day the release is booked (a date counts when fewer than two whole months separate it from that day): where there are two or more such claims, two units are held back; where there is exactly one, one unit is held back; where there are none, nothing is held back for reprocessing.
      The appeal hold-back of an expiry release counts the member's appeals about a claim denial that are still open, that is filed, acknowledged or under review: where two or more are open, two units are held back; where exactly one is open, one unit is held back; where none is open, nothing is held back for appeals.
      The discharge-session hold-back of an expiry release looks at the member's active care management episode and at the care-transition follow-ups its care team recorded within the two months before the day the release is booked: where the active episode is Complex Case Management or Health Home Services and at least one such follow-up is recorded, two units are held back for the program's discharge sessions; where the active episode is of any other care management tier and at least one such follow-up is recorded, one unit is held back; where there is no active episode or no such follow-up, nothing is held back for discharge sessions.
    prerequisite: []
    cross_category:
      - category: plan
        as: history
        reads: [plan_claims.adjudication_status, plan_claims.denial_code, plan_claims.service_date]
        note: The reprocessing hold-back counts the member's claims denied for no prior authorization in the plan's claim ledger.
      - category: appeal
        as: branch
        reads: [appeal_cases.subject_category, appeal_cases.status]
        note: The appeal hold-back counts the member's open appeals about a claim denial.
      - category: care
        as: branch
        reads: [variant_name, status, care_activities.event_type, care_activities.activity_date]
        note: The discharge-session hold-back reads the active care management tier and its recent care-transition follow-ups.
    compute:
      - rel_granted: "SUM('auth_units','units', event_type='auth_units_granted')"
      - rel_used: "SUM('auth_units','units', event_type='auth_units_used')"
      - rel_released_before: "SUM('auth_units','units', event_type='auth_units_released')"
      - rel_unused: "MX(0, rel_granted - rel_used - rel_released_before)"
      - rel_days_after_end: "DAYS(F('end_date'), NOW)"
      - rel_weeks: "MX(1, (DAYS(F('start_date'), F('end_date')) + 1) // 7)"
      - rel_lag_hold: "int(rel_used * rel_days_after_end / rel_weeks / 7) if rel_days_after_end <= K('lag_short_days') else (int(rel_used / rel_weeks) if rel_days_after_end <= K('lag_long_days') else 0)"
      - rel_noauth_denials: "XCOUNT('plan','plan_claims', within_months=2, date_field='service_date', adjudication_status='denied', denial_code='no_prior_authorization')"
      - rel_reprocess_hold: "K('reprocess_hold_many') if rel_noauth_denials >= 2 else (K('reprocess_hold_one') if rel_noauth_denials == 1 else 0)"
      - rel_open_appeals: "XCOUNT('appeal','appeal_cases', subject_category='claim_denial', status='filed') + XCOUNT('appeal','appeal_cases', subject_category='claim_denial', status='acknowledged') + XCOUNT('appeal','appeal_cases', subject_category='claim_denial', status='under_review')"
      - rel_appeal_hold: "K('appeal_hold_many') if rel_open_appeals >= 2 else (K('appeal_hold_one') if rel_open_appeals == 1 else 0)"
      - rel_care_tier: "CFIELD('care','variant_name', status='active')"
      - rel_followups: "XCOUNT('care','care_activities', within_months=2, date_field='activity_date', event_type='care_transition_followup')"
      - rel_session_hold: "K('session_hold_complex') if ((rel_care_tier == 'Complex Case Management' or rel_care_tier == 'Health Home Services') and rel_followups >= 1) else (K('session_hold_other') if (rel_care_tier != None and rel_followups >= 1) else 0)"
      - result: "MX(0, rel_unused - rel_lag_hold - rel_reprocess_hold - rel_appeal_hold - rel_session_hold)"
    compute_basis:
      rel_granted: "The units an expiry release returns are the units granted on the ended approval, less the units posted as used on it, less any units already released from it, counted in whole units and never below zero."
      rel_used: "The units an expiry release returns are the units granted on the ended approval, less the units posted as used on it, less any units already released from it, counted in whole units and never below zero."
      rel_released_before: "The units an expiry release returns are the units granted on the ended approval, less the units posted as used on it, less any units already released from it, counted in whole units and never below zero."
      rel_unused: "The units an expiry release returns are the units granted on the ended approval, less the units posted as used on it, less any units already released from it, counted in whole units and never below zero."
      rel_days_after_end: "The claims-lag hold-back of an expiry release is set by the days that have passed since the approval's end date, counted from the day after the end date through the day the release is booked"
      rel_weeks: "which is the units posted as used divided by the approval's whole weeks (its days from start date through end date counted inclusively, divided by seven and rounded down, and never fewer than one week)."
      rel_lag_hold: "Where no more than fourteen days have passed since the end date, the expiry release holds back the weekly pace multiplied by the days passed and divided by seven, rounded down to a whole unit; where fifteen to forty-five days have passed, it holds back one week of the weekly pace, rounded down to a whole unit; where more than forty-five days have passed, it holds back nothing for claims lag."
      rel_noauth_denials: "The reprocessing hold-back of an expiry release counts the member's claims denied for no prior authorization whose service dates fall within the two months before the day the release is booked (a date counts when fewer than two whole months separate it from that day)"
      rel_reprocess_hold: "where there are two or more such claims, two units are held back; where there is exactly one, one unit is held back; where there are none, nothing is held back for reprocessing."
      rel_open_appeals: "The appeal hold-back of an expiry release counts the member's appeals about a claim denial that are still open, that is filed, acknowledged or under review"
      rel_appeal_hold: "where two or more are open, two units are held back; where exactly one is open, one unit is held back; where none is open, nothing is held back for appeals."
      rel_care_tier: "The discharge-session hold-back of an expiry release looks at the member's active care management episode"
      rel_followups: "and at the care-transition follow-ups its care team recorded within the two months before the day the release is booked"
      rel_session_hold: "where the active episode is Complex Case Management or Health Home Services and at least one such follow-up is recorded, two units are held back for the program's discharge sessions; where the active episode is of any other care management tier and at least one such follow-up is recorded, one unit is held back; where there is no active episode or no such follow-up, nothing is held back for discharge sessions."
      result: "From that figure four hold-backs are subtracted, each a whole number of units, and the result is never below zero; every hold-back is subtracted from the same figure, so the order of subtraction does not change the result."
    factors:
      - id: claims_lag_holdback
        effect: method
        decides: rel_lag_hold
        bindings: [rel_days_after_end, rel_weeks, rel_lag_hold]
        ladder:
          - when: "no more than fourteen days have passed since the approval's end date"
            method: "hold back the weekly pace multiplied by the days passed and divided by seven, rounded down to a whole unit"
          - when: "fifteen to forty-five days have passed since the approval's end date"
            method: "hold back one week of the weekly pace, rounded down to a whole unit"
          - when: "otherwise (more than forty-five days have passed)"
            method: "hold back nothing for claims lag"
        baseline:
          rel_lag_hold: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: reprocessing_holdback
        effect: parameter
        decides: rel_reprocess_hold
        bindings: [rel_noauth_denials, rel_reprocess_hold]
        ladder:
          - when: "two or more of the member's claims denied for no prior authorization in the two months before the booking day"
            value: "K('reprocess_hold_many')"
          - when: "exactly one such claim"
            value: "K('reprocess_hold_one')"
          - when: "otherwise (no such claim)"
            value: "0"
        baseline:
          rel_reprocess_hold: "0"
        evidence: [cross_category, history]
        cross_difficulty: plan
      - id: appeal_holdback
        effect: parameter
        decides: rel_appeal_hold
        bindings: [rel_open_appeals, rel_appeal_hold]
        ladder:
          - when: "two or more of the member's appeals about a claim denial are filed, acknowledged or under review"
            value: "K('appeal_hold_many')"
          - when: "exactly one such appeal is open"
            value: "K('appeal_hold_one')"
          - when: "otherwise (none open)"
            value: "0"
        baseline:
          rel_appeal_hold: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: discharge_session_holdback
        effect: parameter
        decides: rel_session_hold
        bindings: [rel_care_tier, rel_followups, rel_session_hold]
        ladder:
          - when: "the active care episode is Complex Case Management or Health Home Services AND a care-transition follow-up was recorded in the two months before the booking day"
            value: "K('session_hold_complex')"
          - when: "the active care episode is of any other tier AND such a follow-up was recorded"
            value: "K('session_hold_other')"
          - when: "otherwise (no active episode, or no such follow-up)"
            value: "0"
        baseline:
          rel_session_hold: "0"
        evidence: [cross_category, history]
        cross_difficulty: null
    baseline:
      rule: >-
        The units an expiry release returns are the units granted on the ended approval, less the units posted as used on it, less any units already released from it, counted in whole units and never below zero.
      params: []
    inputs:
      history:
        - {table: auth_units, aggregate: sum, field: units, filters: {event_type: auth_units_granted}}
        - {table: auth_units, aggregate: sum, field: units, filters: {event_type: auth_units_used}}
        - {table: auth_units, aggregate: sum, field: units, filters: {event_type: auth_units_released}}
        - {category: plan, table: plan_claims, aggregate: count, field: plan_claim_id, within_months: 2, filters: {adjudication_status: denied, denial_code: no_prior_authorization}}
        - {category: appeal, table: appeal_cases, aggregate: count, field: appeal_case_id, filters: {subject_category: claim_denial}}
        - {category: care, table: care_activities, aggregate: count, field: care_activity_id, within_months: 2, filters: {event_type: care_transition_followup}}
      cross_category: [plan, appeal, care]
  - id: auth_ext_transition_units
    base_policy_refs: [auth_agg_multi_holding, auth_agg_duplicate_request, auth_transition_of_care, auth_out_of_network, auth_service_scope]
    overwrite:
      - base_policy: auth_transition_of_care
        superseded_clause: >-
          for the units the prior authorization had left
        replaced_by: >-
          As the standard method, the units a transition-of-care request asks for are the units requested on that earlier approval, less the units Prairie Ridge covered on it, which are the units granted on it less the units released from it, never below zero and never more than the class's most units per approval. Six adjustments are added to or subtracted from that standard figure, each once and all against the same standard figure, before the ceiling of the class's most units per approval is applied; the total is never below zero.
    trigger: on_request
    subject: [auth_submit]
    computes: units_requested
    target_tool: record_transition_of_care_request_bf098d50
    params:
      late_cut_middle: 2
      late_cut_final: 4
      late_middle_from_day: 46
      late_final_from_day: 76
      step_down_add_other: 1
      step_down_add_complex: 3
      population_add_disability: 2
      population_add_pregnancy: 6
      attendance_cut_mid: 1
      attendance_cut_low: 2
      referral_add_single: 1
      referral_add_standing: 2
    rule: >-
      A new member whose prior health plan authorized a service may ask, inside the transition period, for that authorization to be honored, and Prairie Ridge records a transition-of-care request built on the member's earlier Prairie Ridge approval for the same service code, whose units requested carried over the units the prior plan's authorization had left; the request takes that approval's class, providers and service code, is received and starts on the day it is recorded, and waits for the prior plan's authorization number where the class requires it.
      The units a transition-of-care request asks for are fixed only after every earlier approval of the member for the same service code whose end date has passed carries an expiry release entry.
      As the standard method, the units a transition-of-care request asks for are the units requested on that earlier approval, less the units Prairie Ridge covered on it, which are the units granted on it less the units released from it, never below zero and never more than the class's most units per approval.
      Six adjustments are added to or subtracted from that standard figure, each once and all against the same standard figure, before the ceiling of the class's most units per approval is applied; the total is never below zero.
      The hospital-stay credit of a transition-of-care request looks at the member's paid inpatient stay claims with service dates in the three months before the day the request is recorded and at the care-transition follow-ups the care team recorded in the two months before that day (a date counts when fewer whole months than stated separate it from that day): where at least one such inpatient stay and at least one such follow-up are on file, the credit is one full week of the class's weekly frequency cap; where at least one such inpatient stay is on file but no such follow-up, the credit is the earlier approval's weekly pace, which is the units posted as used on it divided by its whole weeks (its days from start date through end date counted inclusively, divided by seven and rounded down, never fewer than one), rounded down to a whole unit; where no such inpatient stay is on file, there is no hospital-stay credit.
      The late-request cut of a transition-of-care request counts the days from the member's plan coverage start date to the day the request is recorded: from the seventy-sixth day on, four units are cut; from the forty-sixth through the seventy-fifth day, two units are cut; through the forty-fifth day, nothing is cut.
      The step-down addition of a transition-of-care request looks at the member's active care management episode and at the care plan updates recorded in the month before the day the request is recorded: where the active episode is Complex Case Management or Health Home Services and at least one such care plan update is recorded, three units are added; where the active episode is of any other tier and at least one such update is recorded, one unit is added; otherwise nothing is added.
      The population addition of a transition-of-care request follows the member's eligibility category: Prairie Ridge Pregnancy Care adds six units; Prairie Ridge ABD Care or Prairie Ridge Dual Complete adds two units; any other category adds nothing.
      The attendance cut of a transition-of-care request compares the units posted as used on the earlier approval with the units granted on it: where fewer than half of the units granted were used, two units are cut; where at least half but fewer than three quarters were used, one unit is cut; where three quarters or more were used, nothing is cut.
      The referral addition of a transition-of-care request looks at the referrals the member's primary care provider issued in the two months before the day the request is recorded: where a standing referral was issued, two units are added; where only a single referral was issued, one unit is added; where no referral was issued, nothing is added.
    prerequisite:
      - problem: auth_ext_expiry_release
        kind: value_input
        gate: toc_released
        form: state
        policy_source: >-
          The units a transition-of-care request asks for are fixed only after every earlier approval of the member for the same service code whose end date has passed carries an expiry release entry.
        condition: >-
          Every earlier approval of the member for the same service code whose end_date is before the handling day carries an auth_units row with event_type auth_units_released and release_reason expired.
        resolved_by: release_expired_units_43b7942e
        effect: >-
          Once the expiry release entry is booked on the earlier approval, the units released from it rise from nothing to the released units, the units Prairie Ridge covered on it fall by the same amount, and the standard figure of the transition-of-care request rises accordingly.
    cross_category:
      - category: plan
        as: branch
        reads: [variant_name, coverage_start_date, plan_claims.service_category, plan_claims.adjudication_status, plan_claims.service_date]
        note: The hospital-stay credit counts paid inpatient claims, the late-request cut reads the coverage start date and the population addition reads the eligibility category.
      - category: care
        as: branch
        reads: [variant_name, status, care_activities.event_type, care_activities.activity_date]
        note: The hospital-stay credit and the step-down addition read the care team's follow-ups, care plan updates and the active tier.
      - category: pcp
        as: history
        reads: [pcp_events.event_type, pcp_events.referral_type, pcp_events.event_date]
        note: The referral addition counts the primary care provider's recent referrals.
    compute:
      - toc_prior_left: "F('units_requested')"
      - toc_granted: "SUM('auth_units','units', event_type='auth_units_granted')"
      - toc_released: "SUM('auth_units','units', event_type='auth_units_released')"
      - toc_standard: "MX(0, MN(P('max_units_per_auth'), toc_prior_left - (toc_granted - toc_released)))"
      - toc_attend_used: "SUM('auth_units','units', event_type='auth_units_used')"
      - toc_attendance_cut: "K('attendance_cut_low') if toc_attend_used * 2 < toc_granted else (K('attendance_cut_mid') if toc_attend_used * 4 < toc_granted * 3 else 0)"
      - toc_inpatient: "XCOUNT('plan','plan_claims', within_months=3, date_field='service_date', service_category='inpatient_stay', adjudication_status='paid')"
      - toc_followups: "XCOUNT('care','care_activities', within_months=2, date_field='activity_date', event_type='care_transition_followup')"
      - toc_weeks: "MX(1, (DAYS(F('start_date'), F('end_date')) + 1) // 7)"
      - toc_hospital_credit: "P('weekly_frequency_cap') if (toc_inpatient >= 1 and toc_followups >= 1) else (int(toc_attend_used / toc_weeks) if (toc_inpatient >= 1 and toc_followups == 0) else 0)"
      - toc_days_in_plan: "DAYS(CFIELD('plan','coverage_start_date'), NOW)"
      - toc_late_cut: "K('late_cut_final') if toc_days_in_plan >= K('late_final_from_day') else (K('late_cut_middle') if toc_days_in_plan >= K('late_middle_from_day') else 0)"
      - toc_care_tier: "CFIELD('care','variant_name', status='active')"
      - toc_plan_updates: "XCOUNT('care','care_activities', within_months=1, date_field='activity_date', event_type='care_plan_update')"
      - toc_step_down_add: "K('step_down_add_complex') if ((toc_care_tier == 'Complex Case Management' or toc_care_tier == 'Health Home Services') and toc_plan_updates >= 1) else (K('step_down_add_other') if (toc_care_tier != None and toc_plan_updates >= 1) else 0)"
      - toc_category: "CFIELD('plan','variant_name')"
      - toc_population_add: "K('population_add_pregnancy') if toc_category == 'Prairie Ridge Pregnancy Care' else (K('population_add_disability') if (toc_category == 'Prairie Ridge ABD Care' or toc_category == 'Prairie Ridge Dual Complete') else 0)"
      - toc_standing_refs: "XCOUNT('pcp','pcp_events', within_months=2, date_field='event_date', event_type='pcp_referral_issue', referral_type='standing')"
      - toc_single_refs: "XCOUNT('pcp','pcp_events', within_months=2, date_field='event_date', event_type='pcp_referral_issue', referral_type='single')"
      - toc_referral_add: "K('referral_add_standing') if toc_standing_refs >= 1 else (K('referral_add_single') if toc_single_refs >= 1 else 0)"
      - result: "MX(0, MN(P('max_units_per_auth'), toc_standard + toc_hospital_credit - toc_late_cut + toc_step_down_add + toc_population_add - toc_attendance_cut + toc_referral_add))"
    compute_basis:
      toc_prior_left: "As the standard method, the units a transition-of-care request asks for are the units requested on that earlier approval"
      toc_granted: "less the units Prairie Ridge covered on it, which are the units granted on it less the units released from it"
      toc_released: "less the units Prairie Ridge covered on it, which are the units granted on it less the units released from it"
      toc_standard: "As the standard method, the units a transition-of-care request asks for are the units requested on that earlier approval, less the units Prairie Ridge covered on it, which are the units granted on it less the units released from it, never below zero and never more than the class's most units per approval."
      toc_attend_used: "The attendance cut of a transition-of-care request compares the units posted as used on the earlier approval with the units granted on it"
      toc_attendance_cut: "where fewer than half of the units granted were used, two units are cut; where at least half but fewer than three quarters were used, one unit is cut; where three quarters or more were used, nothing is cut."
      toc_inpatient: "The hospital-stay credit of a transition-of-care request looks at the member's paid inpatient stay claims with service dates in the three months before the day the request is recorded"
      toc_followups: "and at the care-transition follow-ups the care team recorded in the two months before that day (a date counts when fewer whole months than stated separate it from that day)"
      toc_weeks: "which is the units posted as used on it divided by its whole weeks (its days from start date through end date counted inclusively, divided by seven and rounded down, never fewer than one), rounded down to a whole unit"
      toc_hospital_credit: "where at least one such inpatient stay and at least one such follow-up are on file, the credit is one full week of the class's weekly frequency cap; where at least one such inpatient stay is on file but no such follow-up, the credit is the earlier approval's weekly pace, which is the units posted as used on it divided by its whole weeks (its days from start date through end date counted inclusively, divided by seven and rounded down, never fewer than one), rounded down to a whole unit; where no such inpatient stay is on file, there is no hospital-stay credit."
      toc_days_in_plan: "The late-request cut of a transition-of-care request counts the days from the member's plan coverage start date to the day the request is recorded"
      toc_late_cut: "from the seventy-sixth day on, four units are cut; from the forty-sixth through the seventy-fifth day, two units are cut; through the forty-fifth day, nothing is cut."
      toc_care_tier: "The step-down addition of a transition-of-care request looks at the member's active care management episode"
      toc_plan_updates: "and at the care plan updates recorded in the month before the day the request is recorded"
      toc_step_down_add: "where the active episode is Complex Case Management or Health Home Services and at least one such care plan update is recorded, three units are added; where the active episode is of any other tier and at least one such update is recorded, one unit is added; otherwise nothing is added."
      toc_category: "The population addition of a transition-of-care request follows the member's eligibility category"
      toc_population_add: "Prairie Ridge Pregnancy Care adds six units; Prairie Ridge ABD Care or Prairie Ridge Dual Complete adds two units; any other category adds nothing."
      toc_standing_refs: "The referral addition of a transition-of-care request looks at the referrals the member's primary care provider issued in the two months before the day the request is recorded"
      toc_single_refs: "The referral addition of a transition-of-care request looks at the referrals the member's primary care provider issued in the two months before the day the request is recorded"
      toc_referral_add: "where a standing referral was issued, two units are added; where only a single referral was issued, one unit is added; where no referral was issued, nothing is added."
      result: "Six adjustments are added to or subtracted from that standard figure, each once and all against the same standard figure, before the ceiling of the class's most units per approval is applied; the total is never below zero."
    factors:
      - id: hospital_stay_credit
        effect: method
        decides: toc_hospital_credit
        bindings: [toc_inpatient, toc_followups, toc_weeks, toc_hospital_credit]
        ladder:
          - when: "a paid inpatient stay claim in the three months before the request day AND a care-transition follow-up in the two months before it"
            method: "credit one full week of the class's weekly frequency cap"
          - when: "a paid inpatient stay claim in the three months before the request day AND no care-transition follow-up in the two months before it"
            method: "credit the earlier approval's weekly pace: units posted as used divided by its whole weeks, rounded down"
          - when: "otherwise (no paid inpatient stay claim in the three months)"
            method: "no hospital-stay credit"
        baseline:
          toc_hospital_credit: "0"
        evidence: [cross_category, history, date]
        cross_difficulty: plan
      - id: late_request_cut
        effect: parameter
        decides: toc_late_cut
        bindings: [toc_days_in_plan, toc_late_cut]
        ladder:
          - when: "the request is recorded on or after the seventy-sixth day from the plan coverage start date"
            value: "K('late_cut_final')"
          - when: "the request is recorded on the forty-sixth through the seventy-fifth day"
            value: "K('late_cut_middle')"
          - when: "otherwise (through the forty-fifth day)"
            value: "0"
        baseline:
          toc_late_cut: "0"
        evidence: [cross_category, date]
        cross_difficulty: plan
      - id: step_down_addition
        effect: parameter
        decides: toc_step_down_add
        bindings: [toc_care_tier, toc_plan_updates, toc_step_down_add]
        ladder:
          - when: "the active care episode is Complex Case Management or Health Home Services AND a care plan update was recorded in the month before the request day"
            value: "K('step_down_add_complex')"
          - when: "the active care episode is of any other tier AND such an update was recorded"
            value: "K('step_down_add_other')"
          - when: "otherwise"
            value: "0"
        baseline:
          toc_step_down_add: "0"
        evidence: [cross_category, history]
        cross_difficulty: null
      - id: population_addition
        effect: parameter
        decides: toc_population_add
        bindings: [toc_category, toc_population_add]
        ladder:
          - when: "the member's eligibility category is Prairie Ridge Pregnancy Care"
            value: "K('population_add_pregnancy')"
          - when: "the member's eligibility category is Prairie Ridge ABD Care or Prairie Ridge Dual Complete"
            value: "K('population_add_disability')"
          - when: "otherwise (any other category)"
            value: "0"
        baseline:
          toc_population_add: "0"
        evidence: [cross_category]
        cross_difficulty: plan
      - id: attendance_cut
        effect: parameter
        decides: toc_attendance_cut
        bindings: [toc_attend_used, toc_attendance_cut]
        ladder:
          - when: "fewer than half of the units granted on the earlier approval were posted as used"
            value: "K('attendance_cut_low')"
          - when: "at least half but fewer than three quarters were used"
            value: "K('attendance_cut_mid')"
          - when: "otherwise (three quarters or more were used)"
            value: "0"
        baseline:
          toc_attendance_cut: "0"
        evidence: [history]
        cross_difficulty: null
      - id: referral_addition
        effect: parameter
        decides: toc_referral_add
        bindings: [toc_standing_refs, toc_single_refs, toc_referral_add]
        ladder:
          - when: "the primary care provider issued a standing referral in the two months before the request day"
            value: "K('referral_add_standing')"
          - when: "the primary care provider issued only a single referral in those two months"
            value: "K('referral_add_single')"
          - when: "otherwise (no referral in those two months)"
            value: "0"
        baseline:
          toc_referral_add: "0"
        evidence: [cross_category, history]
        cross_difficulty: pcp
    baseline:
      rule: >-
        As the standard method, the units a transition-of-care request asks for are the units requested on that earlier approval, less the units Prairie Ridge covered on it, which are the units granted on it less the units released from it, never below zero and never more than the class's most units per approval.
      params: [max_units_per_auth]
    inputs:
      history:
        - {table: auth_units, aggregate: sum, field: units, filters: {event_type: auth_units_granted}}
        - {table: auth_units, aggregate: sum, field: units, filters: {event_type: auth_units_released}}
        - {table: auth_units, aggregate: sum, field: units, filters: {event_type: auth_units_used}}
        - {category: plan, table: plan_claims, aggregate: count, field: plan_claim_id, within_months: 3, filters: {service_category: inpatient_stay, adjudication_status: paid}}
        - {category: care, table: care_activities, aggregate: count, field: care_activity_id, within_months: 2, filters: {event_type: care_transition_followup}}
        - {category: care, table: care_activities, aggregate: count, field: care_activity_id, within_months: 1, filters: {event_type: care_plan_update}}
        - {category: pcp, table: pcp_events, aggregate: count, field: pcp_event_id, within_months: 2, filters: {event_type: pcp_referral_issue}}
      cross_category: [plan, care, pcp]
  - id: auth_ext_member_review_extension
    base_policy_refs: [auth_turnaround]
    overwrite: []
    trigger: on_request
    subject: [auth_timeline_extension]
    computes: extension_days
    target_tool: request_review_time_extension_2522d00e
    params:
      gather_days_complex: 5
      gather_days_other: 7
      gather_days_standard: 10
      email_days: 1
      window_cut_middle: 1
      window_cut_final: 3
      window_middle_from_day: 46
      window_final_from_day: 76
      pcp_cut_single: 1
      pcp_cut_standing: 2
      appeal_add_claim: 1
      appeal_add_authorization: 2
      risk_high: 3.0
      risk_mid: 2.0
      risk_cut_mid: 1
      risk_cut_high: 2
    rule: >-
      A member whose transition-of-care request is waiting for the prior plan's papers may ask Prairie Ridge to take more time to decide it; the member makes that request in person and it is recorded as a deadline extension asked for by the member, with written notice of the extension of review time mailed the same day, and the decision deadline may be extended this way once.
      The days a member-requested deadline extension adds are not fixed until a transition-of-care request for the member stands on file undecided.
      As the standard method, the days a member-requested deadline extension adds are ten days for the member to obtain the prior plan's papers plus the class's decision-notice mailing business days counted as calendar days, never more than the class's most review-extension days and never fewer than one day.
      The gathering days and the mailing days of that standard method are replaced as set out below, and four further adjustments are added or subtracted, each once, before the limits of one day and of the class's most review-extension days are applied.
      The gathering days of a member-requested deadline extension follow the member's active care management episode and the care contacts its care team recorded in the month before the day of the request (a date counts when less than one whole month separates it from that day): where the active episode is Complex Case Management or Health Home Services and at least one such contact is recorded, the gathering days are five; where the active episode is of any other tier and at least one such contact is recorded, they are seven; otherwise they are ten.
      The mailing days of a member-requested deadline extension follow the notice channel on the member's plan membership: where notices go by mail, the class's decision-notice mailing business days are turned into calendar days by multiplying them by seven, dividing by five and rounding up to a whole day; where notices go by email, the mailing days are one day; where notices go by any other channel, the mailing business days are counted as calendar days.
      The transition-window cut of a member-requested deadline extension counts the days from the member's plan coverage start date to the day of the request: from the seventy-sixth day on, three days are cut; from the forty-sixth through the seventy-fifth day, one day is cut; through the forty-fifth day, nothing is cut.
      The referral cut of a member-requested deadline extension looks at the referrals the member's primary care provider issued in the two months before the day of the request: where a standing referral was issued, two days are cut; where only a single referral was issued, one day is cut; where none was issued, nothing is cut.
      The appeal addition of a member-requested deadline extension looks at the member's appeals that are filed, acknowledged or under review: where one is about a prior authorization denial, two days are added; where none is about a prior authorization denial but one is about a claim denial, one day is added; otherwise nothing is added.
      The risk cut of a member-requested deadline extension follows the risk score on the member's active care management episode: a score of 3.00 or more cuts two days; a score of 2.00 up to 2.99 cuts one day; a lower score, or no active episode, cuts nothing.
    prerequisite:
      - problem: auth_ext_transition_units
        kind: state_gate
        gate: auth_authorizations.request_origin
        form: state
        policy_source: >-
          The days a member-requested deadline extension adds are not fixed until a transition-of-care request for the member stands on file undecided.
        condition: >-
          An auth_authorizations row of the member with request_origin transition_of_care and status submitted or pended_info exists; it is the request the deadline extension is recorded on.
        resolved_by: record_transition_of_care_request_bf098d50
        effect: >-
          Once the transition-of-care request is on file undecided, there is a request whose decision deadline the member's extension can move, and the deadline extension is recorded on that request.
    cross_category:
      - category: care
        as: branch
        reads: [variant_name, status, risk_score, care_activities.event_type, care_activities.activity_date]
        note: The gathering days and the risk cut read the active care episode, its recent contacts and its risk score.
      - category: plan
        as: branch
        reads: [notice_channel, coverage_start_date]
        note: The mailing days follow the notice channel and the transition-window cut reads the coverage start date.
      - category: pcp
        as: history
        reads: [pcp_events.event_type, pcp_events.referral_type, pcp_events.event_date]
        note: The referral cut counts the primary care provider's recent referrals.
      - category: appeal
        as: branch
        reads: [appeal_cases.subject_category, appeal_cases.status]
        note: The appeal addition reads the member's open appeals by subject.
    compute:
      - rext_care_tier: "CFIELD('care','variant_name', status='active')"
      - rext_contacts: "XCOUNT('care','care_activities', within_months=1, date_field='activity_date', event_type='care_contact')"
      - rext_gather_days: "K('gather_days_complex') if ((rext_care_tier == 'Complex Case Management' or rext_care_tier == 'Health Home Services') and rext_contacts >= 1) else (K('gather_days_other') if (rext_care_tier != None and rext_contacts >= 1) else K('gather_days_standard'))"
      - rext_channel: "CFIELD('plan','notice_channel')"
      - rext_mail_days: "(P('decision_notice_mail_business_days') * 7 + 4) // 5 if rext_channel == 'mail' else (K('email_days') if rext_channel == 'email' else P('decision_notice_mail_business_days'))"
      - rext_days_in_plan: "DAYS(CFIELD('plan','coverage_start_date'), NOW)"
      - rext_window_cut: "K('window_cut_final') if rext_days_in_plan >= K('window_final_from_day') else (K('window_cut_middle') if rext_days_in_plan >= K('window_middle_from_day') else 0)"
      - rext_standing_refs: "XCOUNT('pcp','pcp_events', within_months=2, date_field='event_date', event_type='pcp_referral_issue', referral_type='standing')"
      - rext_single_refs: "XCOUNT('pcp','pcp_events', within_months=2, date_field='event_date', event_type='pcp_referral_issue', referral_type='single')"
      - rext_pcp_cut: "K('pcp_cut_standing') if rext_standing_refs >= 1 else (K('pcp_cut_single') if rext_single_refs >= 1 else 0)"
      - rext_auth_appeals: "XCOUNT('appeal','appeal_cases', subject_category='prior_authorization_denial', status='filed') + XCOUNT('appeal','appeal_cases', subject_category='prior_authorization_denial', status='acknowledged') + XCOUNT('appeal','appeal_cases', subject_category='prior_authorization_denial', status='under_review')"
      - rext_claim_appeals: "XCOUNT('appeal','appeal_cases', subject_category='claim_denial', status='filed') + XCOUNT('appeal','appeal_cases', subject_category='claim_denial', status='acknowledged') + XCOUNT('appeal','appeal_cases', subject_category='claim_denial', status='under_review')"
      - rext_appeal_add: "K('appeal_add_authorization') if rext_auth_appeals >= 1 else (K('appeal_add_claim') if rext_claim_appeals >= 1 else 0)"
      - rext_risk: "CFIELD('care','risk_score', status='active')"
      - rext_risk_cut: "K('risk_cut_high') if (rext_risk != None and rext_risk >= K('risk_high')) else (K('risk_cut_mid') if (rext_risk != None and rext_risk >= K('risk_mid')) else 0)"
      - result: "MX(1, MN(P('review_extension_max_days'), rext_gather_days + rext_mail_days - rext_window_cut - rext_pcp_cut + rext_appeal_add - rext_risk_cut))"
    compute_basis:
      rext_care_tier: "The gathering days of a member-requested deadline extension follow the member's active care management episode"
      rext_contacts: "and the care contacts its care team recorded in the month before the day of the request (a date counts when less than one whole month separates it from that day)"
      rext_gather_days: "where the active episode is Complex Case Management or Health Home Services and at least one such contact is recorded, the gathering days are five; where the active episode is of any other tier and at least one such contact is recorded, they are seven; otherwise they are ten."
      rext_channel: "The mailing days of a member-requested deadline extension follow the notice channel on the member's plan membership"
      rext_mail_days: "where notices go by mail, the class's decision-notice mailing business days are turned into calendar days by multiplying them by seven, dividing by five and rounding up to a whole day; where notices go by email, the mailing days are one day; where notices go by any other channel, the mailing business days are counted as calendar days."
      rext_days_in_plan: "The transition-window cut of a member-requested deadline extension counts the days from the member's plan coverage start date to the day of the request"
      rext_window_cut: "from the seventy-sixth day on, three days are cut; from the forty-sixth through the seventy-fifth day, one day is cut; through the forty-fifth day, nothing is cut."
      rext_standing_refs: "The referral cut of a member-requested deadline extension looks at the referrals the member's primary care provider issued in the two months before the day of the request"
      rext_single_refs: "The referral cut of a member-requested deadline extension looks at the referrals the member's primary care provider issued in the two months before the day of the request"
      rext_pcp_cut: "where a standing referral was issued, two days are cut; where only a single referral was issued, one day is cut; where none was issued, nothing is cut."
      rext_auth_appeals: "The appeal addition of a member-requested deadline extension looks at the member's appeals that are filed, acknowledged or under review"
      rext_claim_appeals: "The appeal addition of a member-requested deadline extension looks at the member's appeals that are filed, acknowledged or under review"
      rext_appeal_add: "where one is about a prior authorization denial, two days are added; where none is about a prior authorization denial but one is about a claim denial, one day is added; otherwise nothing is added."
      rext_risk: "The risk cut of a member-requested deadline extension follows the risk score on the member's active care management episode"
      rext_risk_cut: "a score of 3.00 or more cuts two days; a score of 2.00 up to 2.99 cuts one day; a lower score, or no active episode, cuts nothing."
      result: "The gathering days and the mailing days of that standard method are replaced as set out below, and four further adjustments are added or subtracted, each once, before the limits of one day and of the class's most review-extension days are applied."
    factors:
      - id: gathering_days
        effect: parameter
        decides: rext_gather_days
        bindings: [rext_care_tier, rext_contacts, rext_gather_days]
        ladder:
          - when: "the active care episode is Complex Case Management or Health Home Services AND a care contact was recorded in the month before the request"
            value: "K('gather_days_complex')"
          - when: "the active care episode is of any other tier AND such a contact was recorded"
            value: "K('gather_days_other')"
          - when: "otherwise"
            value: "K('gather_days_standard')"
        baseline:
          rext_gather_days: "K('gather_days_standard')"
        evidence: [cross_category, history]
        cross_difficulty: null
      - id: mailing_days
        effect: method
        decides: rext_mail_days
        bindings: [rext_channel, rext_mail_days]
        ladder:
          - when: "the member's plan notices go by mail"
            method: "the decision-notice mailing business days times seven, divided by five, rounded up to a whole day"
          - when: "the member's plan notices go by email"
            method: "one day"
          - when: "otherwise (any other notice channel)"
            method: "the decision-notice mailing business days counted as calendar days"
        baseline:
          rext_mail_days: "P('decision_notice_mail_business_days')"
        evidence: [cross_category, tier_param]
        cross_difficulty: plan
      - id: transition_window_cut
        effect: parameter
        decides: rext_window_cut
        bindings: [rext_days_in_plan, rext_window_cut]
        ladder:
          - when: "the request comes on or after the seventy-sixth day from the plan coverage start date"
            value: "K('window_cut_final')"
          - when: "the request comes on the forty-sixth through the seventy-fifth day"
            value: "K('window_cut_middle')"
          - when: "otherwise (through the forty-fifth day)"
            value: "0"
        baseline:
          rext_window_cut: "0"
        evidence: [cross_category, date]
        cross_difficulty: plan
      - id: referral_cut
        effect: parameter
        decides: rext_pcp_cut
        bindings: [rext_standing_refs, rext_single_refs, rext_pcp_cut]
        ladder:
          - when: "a standing referral was issued by the primary care provider in the two months before the request"
            value: "K('pcp_cut_standing')"
          - when: "only a single referral was issued in those two months"
            value: "K('pcp_cut_single')"
          - when: "otherwise"
            value: "0"
        baseline:
          rext_pcp_cut: "0"
        evidence: [cross_category, history]
        cross_difficulty: pcp
      - id: appeal_addition
        effect: parameter
        decides: rext_appeal_add
        bindings: [rext_auth_appeals, rext_claim_appeals, rext_appeal_add]
        ladder:
          - when: "an open appeal about a prior authorization denial"
            value: "K('appeal_add_authorization')"
          - when: "no such appeal, but an open appeal about a claim denial"
            value: "K('appeal_add_claim')"
          - when: "otherwise"
            value: "0"
        baseline:
          rext_appeal_add: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: risk_cut
        effect: parameter
        decides: rext_risk_cut
        bindings: [rext_risk, rext_risk_cut]
        ladder:
          - when: "the active care episode's risk score is 3.00 or more"
            value: "K('risk_cut_high')"
          - when: "the risk score is 2.00 up to 2.99"
            value: "K('risk_cut_mid')"
          - when: "otherwise (a lower score or no active episode)"
            value: "0"
        baseline:
          rext_risk_cut: "0"
        evidence: [cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        As the standard method, the days a member-requested deadline extension adds are ten days for the member to obtain the prior plan's papers plus the class's decision-notice mailing business days counted as calendar days, never more than the class's most review-extension days and never fewer than one day.
      params: [gather_days_standard, decision_notice_mail_business_days, review_extension_max_days]
    inputs:
      history:
        - {category: care, table: care_activities, aggregate: count, field: care_activity_id, within_months: 1, filters: {event_type: care_contact}}
        - {category: pcp, table: pcp_events, aggregate: count, field: pcp_event_id, within_months: 2, filters: {event_type: pcp_referral_issue}}
        - {category: appeal, table: appeal_cases, aggregate: count, field: appeal_case_id, filters: {}}
      cross_category: [care, plan, pcp, appeal]
  - id: auth_ext_void_release
    base_policy_refs: [auth_provider_change, auth_void_withdraw]
    overwrite:
      - base_policy: auth_void_withdraw
        superseded_clause: >-
          the units left are released the same day where void_releases_units is true
        replaced_by: >-
          When the member has an approval voided because the service will not be used, the approval closes the same day and the units it left unused are released that day less the hold-backs set out below, which stay on the voided approval only for claims whose service dates fall inside it.
    trigger: on_request
    subject: [auth_void, auth_units_released]
    computes: units_released
    target_tool: void_authorization_7849b1e5
    params:
      lag_short_days: 14
      lag_long_days: 45
      claim_hold_one: 1
      claim_hold_many: 2
      transfer_hold_other: 1
      transfer_hold_complex: 2
      ride_hold_one: 1
      ride_hold_many: 2
    rule: >-
      When the member has an approval voided because the service will not be used, the approval closes the same day and the units it left unused are released that day less the hold-backs set out below, which stay on the voided approval only for claims whose service dates fall inside it.
      A void applies only to an approval whose end date has not yet passed; the unused units of an approval whose end date has passed are returned by its expiry release instead.
      The units a void releases are the units granted on the voided approval, less the units posted as used on it, less any units already released from it, counted in whole units and never below zero.
      Four hold-backs are taken from that figure, each a whole number of units and each taken from the same figure, so their order does not matter, and what remains is never below zero.
      The late-billing hold-back of a void is set by the days from the service date of the latest use posted on the approval (or from its start date where no use is posted) to the day of the void, and by the approval's active pace, which is the units posted as used divided by the whole weeks from the start date through that latest use (counted inclusively, divided by seven and rounded down, never fewer than one week).
      Where no more than fourteen such days have passed, the void holds back the active pace multiplied by the days passed and divided by seven, rounded down to a whole unit; where fifteen to forty-five days have passed, it holds back one week of the active pace, rounded down to a whole unit; where more than forty-five days have passed, it holds back nothing for late billing.
      The rebilling hold-back of a void counts the member's claims denied for no prior authorization whose service dates fall within the two months before the day of the void (a date counts when fewer than two whole months separate it from that day): two or more such claims hold back two units, exactly one holds back one unit, and none holds back nothing.
      The hand-off hold-back of a void looks at the member's active care management episode and the care plan updates recorded in the month before the day of the void: where the active episode is Complex Case Management or Health Home Services and at least one such update is recorded, two units are held back for the provider's hand-off visits; where the active episode is of any other tier and at least one such update is recorded, one unit is held back; otherwise nothing is held back for hand-off.
      The booked-ride hold-back of a void counts the ride legs booked for the member in the month before the day of the void: two or more booked legs hold back two units, exactly one holds back one unit, and none holds back nothing.
    prerequisite: []
    cross_category:
      - category: plan
        as: history
        reads: [plan_claims.adjudication_status, plan_claims.denial_code, plan_claims.service_date]
        note: The rebilling hold-back counts the member's claims denied for no prior authorization.
      - category: care
        as: branch
        reads: [variant_name, status, care_activities.event_type, care_activities.activity_date]
        note: The hand-off hold-back reads the active care tier and its recent care plan updates.
      - category: ride
        as: history
        reads: [ride_trips.event_type, ride_trips.event_date]
        note: The booked-ride hold-back counts ride legs booked in the last month.
    compute:
      - vd_granted: "SUM('auth_units','units', event_type='auth_units_granted')"
      - vd_used: "SUM('auth_units','units', event_type='auth_units_used')"
      - vd_released_before: "SUM('auth_units','units', event_type='auth_units_released')"
      - vd_unused: "MX(0, vd_granted - vd_used - vd_released_before)"
      - vd_last_use: "LATEST('auth_units','service_date', date_field='service_date', event_type='auth_units_used')"
      - vd_days_since_use: "DAYS(vd_last_use, NOW) if vd_last_use != None else DAYS(F('start_date'), NOW)"
      - vd_active_weeks: "MX(1, (DAYS(F('start_date'), vd_last_use) + 1) // 7) if vd_last_use != None else 1"
      - vd_lag_hold: "int(vd_used * vd_days_since_use / vd_active_weeks / 7) if vd_days_since_use <= K('lag_short_days') else (int(vd_used / vd_active_weeks) if vd_days_since_use <= K('lag_long_days') else 0)"
      - vd_noauth_denials: "XCOUNT('plan','plan_claims', within_months=2, date_field='service_date', adjudication_status='denied', denial_code='no_prior_authorization')"
      - vd_claim_hold: "K('claim_hold_many') if vd_noauth_denials >= 2 else (K('claim_hold_one') if vd_noauth_denials == 1 else 0)"
      - vd_care_tier: "CFIELD('care','variant_name', status='active')"
      - vd_plan_updates: "XCOUNT('care','care_activities', within_months=1, date_field='activity_date', event_type='care_plan_update')"
      - vd_transfer_hold: "K('transfer_hold_complex') if ((vd_care_tier == 'Complex Case Management' or vd_care_tier == 'Health Home Services') and vd_plan_updates >= 1) else (K('transfer_hold_other') if (vd_care_tier != None and vd_plan_updates >= 1) else 0)"
      - vd_booked_legs: "XCOUNT('ride','ride_trips', within_months=1, date_field='event_date', event_type='ride_trip_booked')"
      - vd_ride_hold: "K('ride_hold_many') if vd_booked_legs >= 2 else (K('ride_hold_one') if vd_booked_legs == 1 else 0)"
      - result: "MX(0, vd_unused - vd_lag_hold - vd_claim_hold - vd_transfer_hold - vd_ride_hold)"
    compute_basis:
      vd_granted: "The units a void releases are the units granted on the voided approval, less the units posted as used on it, less any units already released from it, counted in whole units and never below zero."
      vd_used: "The units a void releases are the units granted on the voided approval, less the units posted as used on it, less any units already released from it, counted in whole units and never below zero."
      vd_released_before: "The units a void releases are the units granted on the voided approval, less the units posted as used on it, less any units already released from it, counted in whole units and never below zero."
      vd_unused: "The units a void releases are the units granted on the voided approval, less the units posted as used on it, less any units already released from it, counted in whole units and never below zero."
      vd_last_use: "The late-billing hold-back of a void is set by the days from the service date of the latest use posted on the approval (or from its start date where no use is posted) to the day of the void"
      vd_days_since_use: "The late-billing hold-back of a void is set by the days from the service date of the latest use posted on the approval (or from its start date where no use is posted) to the day of the void"
      vd_active_weeks: "and by the approval's active pace, which is the units posted as used divided by the whole weeks from the start date through that latest use (counted inclusively, divided by seven and rounded down, never fewer than one week)."
      vd_lag_hold: "Where no more than fourteen such days have passed, the void holds back the active pace multiplied by the days passed and divided by seven, rounded down to a whole unit; where fifteen to forty-five days have passed, it holds back one week of the active pace, rounded down to a whole unit; where more than forty-five days have passed, it holds back nothing for late billing."
      vd_noauth_denials: "The rebilling hold-back of a void counts the member's claims denied for no prior authorization whose service dates fall within the two months before the day of the void (a date counts when fewer than two whole months separate it from that day)"
      vd_claim_hold: "two or more such claims hold back two units, exactly one holds back one unit, and none holds back nothing."
      vd_care_tier: "The hand-off hold-back of a void looks at the member's active care management episode"
      vd_plan_updates: "and the care plan updates recorded in the month before the day of the void"
      vd_transfer_hold: "where the active episode is Complex Case Management or Health Home Services and at least one such update is recorded, two units are held back for the provider's hand-off visits; where the active episode is of any other tier and at least one such update is recorded, one unit is held back; otherwise nothing is held back for hand-off."
      vd_booked_legs: "The booked-ride hold-back of a void counts the ride legs booked for the member in the month before the day of the void"
      vd_ride_hold: "two or more booked legs hold back two units, exactly one holds back one unit, and none holds back nothing."
      result: "Four hold-backs are taken from that figure, each a whole number of units and each taken from the same figure, so their order does not matter, and what remains is never below zero."
    factors:
      - id: late_billing_holdback
        effect: method
        decides: vd_lag_hold
        bindings: [vd_last_use, vd_days_since_use, vd_active_weeks, vd_lag_hold]
        ladder:
          - when: "no more than fourteen days since the latest posted use (or the start date where none is posted)"
            method: "hold back the active pace multiplied by the days passed and divided by seven, rounded down"
          - when: "fifteen to forty-five days since then"
            method: "hold back one week of the active pace, rounded down"
          - when: "otherwise (more than forty-five days)"
            method: "hold back nothing for late billing"
        baseline:
          vd_lag_hold: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: rebilling_holdback
        effect: parameter
        decides: vd_claim_hold
        bindings: [vd_noauth_denials, vd_claim_hold]
        ladder:
          - when: "two or more of the member's claims denied for no prior authorization in the two months before the void"
            value: "K('claim_hold_many')"
          - when: "exactly one such claim"
            value: "K('claim_hold_one')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          vd_claim_hold: "0"
        evidence: [cross_category, history]
        cross_difficulty: plan
      - id: hand_off_holdback
        effect: parameter
        decides: vd_transfer_hold
        bindings: [vd_care_tier, vd_plan_updates, vd_transfer_hold]
        ladder:
          - when: "the active care episode is Complex Case Management or Health Home Services AND a care plan update was recorded in the month before the void"
            value: "K('transfer_hold_complex')"
          - when: "the active care episode is of any other tier AND such an update was recorded"
            value: "K('transfer_hold_other')"
          - when: "otherwise"
            value: "0"
        baseline:
          vd_transfer_hold: "0"
        evidence: [cross_category, history]
        cross_difficulty: null
