# Product charter: Prior Authorization. Output of erl-scenario-blueprint.
category: auth
display_name: Prior Authorization
binding:
  holding_table: auth_authorizations
  event_tables:
  - auth_units
  - auth_actions
  status_field: status
  variant_field: variant_name
  quantity_fields:
    units_remaining: authorized_units
lifecycle:
  states:
  - submitted
  - pended_info
  - approved
  - denied
  - expired
  - voided
  - withdrawn
  transitions:
  - from: submitted
    to: pended_info
    by: system
    means: The reviewer asks the requesting provider for clinical information.
  - from: pended_info
    to: submitted
    by: system
    means: The requested information arrives and review resumes.
  - from: submitted
    to: approved
    by: system
    means: Utilization management approves the request in full or in part.
  - from: submitted
    to: denied
    by: system
    means: Utilization management denies the request.
  - from: pended_info
    to: denied
    by: system
    means: The information deadline passes and the request is denied on the record as it stands.
  - from: denied
    to: approved
    by: system
    means: A denial is overturned on appeal, hearing or external review.
  - from: approved
    to: expired
    by: system
    means: The end_date passes.
  - from: approved
    to: voided
    by: agent
    means: An approval is voided at the member's request because the service will not be used.
  - from: submitted
    to: withdrawn
    by: user
    means: The member withdraws the request before a decision.
  - from: pended_info
    to: withdrawn
    by: user
    means: The member withdraws a pended request before a decision.
accounts:
- key: authorized_units
  unit: units of the tier's unit_basis
  meaning: >-
    Units granted on an authorization and not yet used or released; the integral view is auth_authorizations.units_remaining.
parameter_schema:
  unit_basis: What one authorized unit is (enum string).
  standard_decision_days: >-
    Calendar days after received_date within which a standard request is decided (integer days).
  expedited_decision_hours: Hours after receipt within which an expedited request is decided (integer
    hours).
  review_extension_max_days: Most calendar days the decision deadline may be extended, once (integer days).
  pend_info_response_days: >-
    Calendar days the requesting provider has to answer a request for clinical information before the
    request is decided on the record as it stands (integer days).
  pend_max_times: Most times one request may be pended for information (integer).
  auth_validity_days: >-
    Calendar days from start_date through end_date of an approval, counting start_date as day 1 (integer
    days).
  max_units_per_auth: Most units one approval may grant (integer units of unit_basis).
  weekly_frequency_cap: >-
    Most units that may be used in one Monday-Sunday week (integer units; 0 means no weekly cap).
  annual_limit_applies: Whether units granted are capped per member per calendar year (boolean).
  annual_unit_limit: >-
    Most units granted per member per calendar year per annual_limit_basis where the annual limit applies
    (integer units; 0 where it does not apply).
  annual_limit_basis: What the annual limit is counted per (enum string).
  under_21_limit_exempt: >-
    Whether members under age 21 on the service date are exempt from unit and annual limits under EPSDT
    (boolean).
  extension_allowed: Whether an approval may be extended (boolean).
  max_extensions_per_auth: >-
    Most extensions granted on one authorization (integer; 0 where extensions are not allowed).
  extension_max_units: Most units one extension may add (integer units).
  extension_days: Calendar days one extension adds to end_date (integer days).
  extension_late_grace_days: >-
    Calendar days after end_date during which an extension request is still accepted as an extension rather
    than a new request (integer days).
  retro_request_days: >-
    Calendar days after the first service date within which a provider may request authorization for a
    service already delivered (integer days).
  inpatient_notification_hours: >-
    Hours after an unscheduled admission by which the facility must notify the plan (integer hours; 0
    where not applicable).
  transition_of_care_days: >-
    Calendar days after the plan coverage_start_date during which a new member's prior-plan authorization
    is honored (integer days).
  toc_requires_prior_auth_number: Whether honoring a prior-plan authorization needs its authorization
    number (boolean).
  toc_out_of_network_honored: >-
    Whether a prior-plan authorization is honored even when the servicing provider is out of network (boolean).
  oon_requires_no_in_network_available: >-
    Whether approval requires that no in-network provider can deliver the service within the access standard
    (boolean).
  oon_access_distance_miles: >-
    Distance in miles beyond which the nearest in-network provider is considered unavailable (miles; 0
    where not applicable).
  oon_access_wait_days: >-
    Calendar days beyond which the earliest in-network appointment is considered unavailable (integer
    days; 0 where not applicable).
  oon_single_case_agreement_required: >-
    Whether the out-of-network provider must sign a single case agreement before start_date (boolean).
  oon_member_cost_share_usd: >-
    Member cost share for an authorized out-of-network service beyond the in-network copay (USD, 2 decimals).
  member_can_request_expedited: Whether the member may ask for expedited review (boolean).
  provider_certification_binding: >-
    Whether a provider's certification that the standard timeframe could seriously jeopardize the member's
    health makes expedited review mandatory (boolean).
  expedite_denial_converts_to_standard: Whether a refused expedite request continues as a standard review
    (boolean).
  expedite_denial_written_notice_days: >-
    Calendar days after refusing an expedite request within which written notice follows the oral notice
    (integer days).
  expedite_member_channels: Channels through which a member may ask for expedited review (list).
  expedited_oral_notice_required: Whether an expedited decision is also given orally (boolean).
  decision_notice_mail_business_days: Business days after the decision within which written notice is
    mailed (integer days).
  servicing_provider_change_allowed: Whether the servicing provider may be changed on an approved authorization
    (boolean).
  provider_change_requires_in_network: Whether a new servicing provider must be in network (boolean).
  concurrent_review_interval_days: >-
    Calendar days between concurrent reviews during an approval (integer days; 0 where not applicable).
  dme_rental_to_purchase_months: >-
    Rental months after which rented equipment becomes member-owned (integer months; 0 where not applicable).
  dme_replacement_years: >-
    Years before the same DME item may be replaced without a change in condition (integer years; 0 where
    not applicable).
  dme_pa_threshold_usd: >-
    Purchase price at or below which a DME item needs no authorization (USD, 2 decimals; 0.00 where not
    applicable).
  home_health_cert_period_days: >-
    Length of one home health plan-of-care certification period (integer days; 0 where not applicable).
  therapy_eval_without_auth: Whether the initial therapy evaluation is covered without authorization (boolean).
  clinical_criteria_set: Clinical criteria used for medical necessity review (string).
  denial_reviewer_specialty: Physician specialty that must make any denial (string).
  peer_to_peer_window_business_days: >-
    Business days after a denial during which the requesting provider may ask for a peer-to-peer discussion
    (integer days).
  max_open_requests_same_service: Most open authorizations for the same service_code and overlapping dates
    (integer).
  void_releases_units: Whether voiding an approval releases its unused units (boolean).
  expired_units_forfeited: Whether units unused at end_date are released and cannot be used later (boolean).
