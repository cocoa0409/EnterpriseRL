        effect: parameter
        decides: vd_ride_hold
        bindings: [vd_booked_legs, vd_ride_hold]
        ladder:
          - when: "two or more ride legs booked for the member in the month before the void"
            value: "K('ride_hold_many')"
          - when: "exactly one booked leg"
            value: "K('ride_hold_one')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          vd_ride_hold: "0"
        evidence: [cross_category, history]
        cross_difficulty: ride
    baseline:
      rule: >-
        The units a void releases are the units granted on the voided approval, less the units posted as used on it, less any units already released from it, counted in whole units and never below zero.
