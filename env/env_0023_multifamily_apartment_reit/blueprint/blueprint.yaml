name: env_0023_multifamily_apartment_reit
company: Larkspur Residential Trust

background: |
  Larkspur Residential Trust is a publicly traded apartment real estate investment trust that owns and operates
  professionally managed rental communities for households across the western and southern United States. Its
  centralized Resident Services Center, reached by phone, chat and the resident portal, serves the residents of the six
  communities on its current operating platform: Larkspur at Irvine Spectrum in California, Larkspur Bellevue Station in
  Washington, Larkspur Cherry Creek in Colorado, Larkspur on South Lamar in Texas, Larkspur Midtown Atlanta in Georgia and
  Larkspur Scottsdale Quarter in Arizona. The company speaks to residents in a warm, plain-spoken and precise voice, and
  relationship is the Apartment Home Lease, written on one of six floor plans: Studio Residence, One-Bedroom Residence,
  One-Bedroom Den Residence, Two-Bedroom Residence, Three-Bedroom Residence and Penthouse Residence. Each lease runs under
  a chain of Lease Term Agreements on one of six term programs — Month-to-Month Agreement, Short-Term Lease (3-5 Months),
  Flexible Lease (6-9 Months), Standard Lease (10-12 Months), Extended Lease (13-15 Months) and Long-Term Lease (16-24
  Months) — that renew, convert, transfer to another apartment home or end over the life of the tenancy. Rent, lease
  fees, late fees and returned payments are booked on the lease ledger, while term charges such as termination and
  transfer fees are booked on the term agreement's own account. Every apartment home also carries a Utility Services
  Program fixed by how it is metered — Essentials Utility Plan, Water-Sewer-Trash Allocation Plan, Submetered Water Plan,
  Submetered Water & Gas Plan, Submetered Water, Gas & Electric Plan or All-Inclusive Utility Package — whose billbacks,
  meter reads and adjustments post to a utility account. Each lease is secured by a Security Deposit Account on the
  Zero-Deposit Guarantee Plan, Reduced Deposit Plan, Standard Deposit Plan, Premier Residence Deposit Plan, Conditional
  Approval Deposit Plan or Enhanced Deposit Plan, which holds the deposit until the itemized final account statement at
  move-out. Households add Parking Licenses (Surface Unreserved Permit, Surface Reserved Space, Covered Carport Space,
  Structured Garage Space, EV Charging Reserved Space, Private Detached Garage), Storage Rentals (Bike Storage Locker,
  Small Storage Closet (4x4), Standard Storage Unit (5x5), Large Storage Unit (5x10), Climate-Controlled Storage Unit
  (5x10), Oversized Storage Suite (10x10)) and Pet Addenda (Assistance Animal Accommodation, Caged Pet Addendum, Cat
  Addendum, Small Dog Addendum (under 25 lb), Medium Dog Addendum (25-49 lb), Large Dog Addendum (50-90 lb)), each billed
  month by month on its own account. The callers are leaseholders and applicants: young professionals in studios and
  one-bedrooms, roommates and families in the larger floor plans, and long-tenured residents several renewals deep. A
  typical household holds a lease, its current term agreement, a utility account and a deposit account, and often one or
  two parking licenses, a storage unit or a pet. They arrive with months of history behind them — posted rent and fees,
  autopay and card payments, the occasional returned payment or late fee, renewal offers and rent changes, meter reads
  and billbacks, violation records and, at the end, a move-out inspection and final account statement.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: handoffs

difficulties:
  - name: rent_ledger_and_delinquency
    claim:
      categories: [lease]
      event_types: [lease_rent_charge, lease_fee_charge, lease_late_fee, lease_nsf_fee, lease_charge_credit, lease_payment, lease_payment_return, lease_certified_funds_restriction, lease_autopay_update, lease_insurance_update, lease_delinquency_notice, lease_default, lease_default_cure, lease_eviction_referral, lease_eviction_filing, lease_reinstatement]
    summary: >
      Leaseholders on every floor plan call about their lease ledger: a rent or fee line they do not recognise, a late fee
      they believe was assessed too early or too high, a payment that bounced and the returned payment fee and certified
      funds restriction that followed, a courtesy waiver they want, a move-in concession or discount that seems missing, or a
      delinquency notice, a payment plan and the fear of eviction. The setting varies with the floor plan whose parameters
      apply, the community's state (whose late fee timing and caps, returned payment caps, notice periods and payment
      allocation order override the company defaults), the lease status from active through in_default and eviction_filed,
      the term program that decides concession eligibility, and the payment and return history that drives the trailing
      twelve-month counts. The records involved are the lease, its charges, payments and returns, notices and payment plan
      requests; the governing rules are the rent posting and proration rule (lease_evt_rent_posting), the fee rule
      (lease_evt_fees), the late fee timing, amount and cap rule with its state overrides (lease_evt_late_fee), payment
      acceptance and allocation (lease_evt_payment_acceptance), returned payments (lease_evt_returned_payment), credits,
      concessions, discounts and courtesy waivers (lease_evt_credits_and_waivers), delinquency notices and cure
      (lease_delinquency_and_default), referral and reinstatement (lease_eviction_and_reinstatement) and payment plans
      (lease_payment_plan), each keyed to per-floor-plan values. In the natural course of a delinquency, rent posts, the grace
      period runs out, late fees accrue, a notice is served, the cure period runs and an uncured file may be referred; the
      agent verifies the caller, reads the ledger, and posts the credits, waivers, reversals, autopay and insurance updates
      that the rules support, while signing a payment plan is the resident's own act, handed over to the resident. Requests no
      rule decides — forgiving rent itself, stopping a filed eviction case on terms other than reinstatement, or disputing
      a court judgment — are outside the charter and call for a POLICY_NOT_COVERED handoff.

  - name: renewals_transfers_and_early_exit
    claim:
      categories: [term]
      event_types: [term_create, term_start, term_cancellation, term_renewal_offer, term_rent_change, term_notice_to_vacate, term_notice_withdrawal, term_move_out_date_update, term_early_termination, term_transfer, term_fee_assessment, term_fee_credit, term_payment]
    summary: >
      Residents call about the life of their lease term: whether and at what rent they can renew, why their renewal offer
      rose by what it did, what happens when the term ends without a renewal, how to give or withdraw notice to vacate, how
      much it costs to leave early or move to another apartment home, and whether military orders or other statutory grounds
      release them without fees. The setting varies with the term program of the current term (its offer lead time, renewal
      cap, notice period, early termination option, reletting fee, transfer eligibility and rescission window), the tenure
      accumulated across the whole chain of terms, the community's state (increase caps and notice periods), the lease's
      balance and status, the move-in concession still unearned, and how far into the term the resident is. The records are
      the term agreements of the lease, renewal offer lines, rent change records, term charges and change requests; the
      governing rules are term pricing and renewal acceptance (term_evt_term_pricing), offer issuance and caps
      (term_evt_renewal_offers), rent change notice (term_evt_rent_change_notice), notice to vacate (term_notice_to_vacate_rule),
      the early termination option and lease break (term_early_termination_rule), statutory release
      (term_statutory_release), transfers (term_transfer_rule), month-to-month conversion (term_mtm_conversion), term charges
      (term_evt_charges_credits_payments), rescission (term_renewal_rescission) and the tenancy-chain aggregation
      (term_agg_tenancy_chain). In the natural order an offer precedes its expiry, a signed renewal precedes the new term's
      start and its rent change, and notice or an early termination precedes move-out; the agent quotes, records notices,
      assesses and credits term charges, while signing a renewal, an early termination, a transfer or a rescission is the
      resident's own act and is handed over. Requests the charter does not decide — negotiating a rent below the offer
      outside any rule, breaking a lease for reasons outside the statutory grounds without the stated fees, or transferring
      to a different community — are outside policy and call for a POLICY_NOT_COVERED handoff.

  - name: utility_billbacks_and_disputes
    claim:
      categories: [utility]
      event_types: [utility_meter_read, utility_usage_billback, utility_allocation_billback, utility_flat_charge, utility_package_overage, utility_bill_adjustment, utility_payment, utility_plan_change, utility_occupancy_update, utility_final_billing]
    summary: >
      Households call about their utility billbacks: a water bill that doubled, a string of estimated reads, an allocation
      share that seems too large for the number of people living there, overage charges on the all-inclusive package, a
      setup or administration fee, a leak that was repaired, or a final bill after a move-out or transfer. The setting varies
      with the utility program fixed by the apartment home's metering (allocation, submeter or package, and which services
      are covered), the billed occupants and square footage, the read history and consecutive estimates, the timing of a
      dispute against the bill date, prior leak adjustments in the trailing year, and whether the account is active or in
      final billing. The records are the utility account, its bill lines, meter reads and disputes, together with the lease's
      occupants; the governing rules are submetered usage and estimates (utility_evt_submetered_usage), allocation
      (utility_evt_allocation), flat and package lines (utility_evt_flat_and_package), adjustments and disputes
      (utility_evt_adjustments_and_disputes), occupancy (utility_evt_occupancy), payments (utility_evt_payments), program and
      activation (utility_evt_enrollment_and_program), final billing (utility_final_bill_and_close) and the household
      balance aggregation (utility_agg_household_balance), with rates, allowances and windows per utility program. In the
      natural order a read precedes its usage line, a bill precedes a dispute against it, and a repair precedes a leak
      adjustment; the agent reads the account, applies the adjustment the rules allow, records payments and program or
      occupancy changes, while documenting a leak repair or a lease modification belongs to maintenance and the leasing
      office. Requests no rule decides — waiving a correctly billed usage line, refunding a vacant period the resident never
      held, or contesting the utility provider's own rate — are outside the charter and call for a POLICY_NOT_COVERED handoff.

  - name: move_out_deposit_accounting
    claim:
      categories: [deposit]
      event_types: [deposit_move_out_review, deposit_move_out_charge, deposit_charge_reversal, deposit_application, deposit_refund, deposit_balance_owed, deposit_balance_payment, deposit_guarantee_claim, deposit_balance_credit, deposit_disposition, deposit_disposition_reopen, deposit_collections_referral, deposit_forwarding_address_update, deposit_close]
    summary: >
      Former residents call after moving out about their security deposit: when the final account statement will come, why
      a carpet, paint or cleaning charge was taken, how much of the deposit went to unpaid rent, term charges, utilities or
      parking, where the refund is, whether they can dispute a line, and what happens to a balance they still owe. The setting
      varies with the deposit program (a cash deposit of a flat or rent-multiple amount, or the Zero-Deposit Guarantee Plan
      with its coverage and claim), the governing state's statement deadline and deposit cap, the move-out date and forwarding
      address, the itemized lines with their ages, replacement costs, labor and photos, and the balances left on every other
      ledger tied to the lease. The records are the deposit account, its transactions and disputes, the lease and every ledger
      whose balance enters final accounting; the governing rules are itemization and depreciation
      (deposit_move_out_itemization), the order in which the deposit is applied across ledgers and the late-statement
      forfeiture (deposit_agg_final_accounting), statement timing and forwarding addresses (deposit_disposition_timing),
      disputes and amendments (deposit_disputes_and_amendment), balance, guarantee claim and collections
      (deposit_balance_and_collections) and refunds (deposit_evt_refund_channel), with useful lives, labor rates and windows per
      deposit program. In the natural order possession ends, the inspection is itemized, the statement applies the deposit and
      refunds or bills the rest, and only then can a line be disputed; the agent computes and records itemization, application,
      refund, balance and dispute outcomes as the rules require, while submitting a dispute is the resident's own act. Requests
      no rule decides — waiving damage the inspection properly recorded, paying interest on the deposit, or reissuing a check
      already escheated as unclaimed property — are outside the charter and call for a POLICY_NOT_COVERED handoff.

  - name: parking_licenses_and_ev_charging
    claim:
      categories: [parking]
      event_types: [parking_license_request, parking_assignment, parking_fee_charge, parking_ev_session, parking_violation, parking_fine, parking_credit, parking_payment, parking_space_swap, parking_vehicle_update, parking_suspension, parking_reinstatement, parking_cancellation_notice, parking_notice_withdrawal]
    summary: >
      Residents call about parking: getting a space or garage and where they stand on the waitlist, a monthly fee or
      activation fee they question, a missing storage bundle discount, EV charging sessions billed at the wrong rate or with
      idle fees, warnings, fines and tows, guest vehicles, a new car, suspended privileges, or cancelling a space early. The
      setting varies with the parking product (reserved or not, covered, gated, EV-equipped, its fee, commitment and
      cancellation terms), how many licenses the household already holds against its caps, whether the lease is active and
      whether an active storage rental earns the bundle discount, the enforcement history per plate in the trailing year, and
      the past-due age of the parking balance. The records are the parking licenses of the lease, their charges and activity,
      the lease and its storage rentals; the governing rules are the household caps (parking_agg_multi_holding), household
      pricing and the bundle discount (parking_agg_household_pricing), assignment and vehicle rules (parking_evt_assignment),
      fees (parking_evt_fees), EV charging (parking_evt_ev_charging), enforcement (parking_evt_enforcement), guest passes
      (parking_evt_guest_passes), suspension (parking_suspension_rule), cancellation (parking_cancellation_rule) and payments
      and changes (parking_evt_payments_and_changes), with fees and limits per parking product. In the natural order a request
      waits on the waitlist before assignment, a warning precedes a fine and a fine precedes a tow, and a past-due balance
      precedes suspension; the agent assigns, bills, credits and records changes as the rules allow, while signing a
      cancellation notice or withdrawing a request is the resident's own act. Requests no rule decides — reversing a tow
      company's charges, reserving a space for a non-resident, or parking an oversized vehicle where the product forbids it —
      are outside the charter and call for a POLICY_NOT_COVERED handoff.
