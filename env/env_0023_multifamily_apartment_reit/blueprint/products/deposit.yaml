events:
  - type: deposit_account_open
    target: deposit_accounts
    mutation: create
    meaning: A deposit account is opened for a newly approved lease under the deposit program its screening assigns.
    grain: One row per account.
    fields:
      customer_id: Leaseholder.
      lease_id: Lease secured.
      variant_name: Deposit program assigned.
      governing_state: State of the lease's community.
      required_deposit_amount: Required cash deposit under the program and state cap.
      opened_date: Lease approval date.
      refund_method: Refund method on file (the program default until the resident chooses).
    triggers: []
  - type: deposit_funding
    target: deposit_transactions
    meaning: Cash deposit is received — the initial deposit, one installment of it, or an additional pet deposit.
    grain: One row per deposit payment received.
    distinguish_by: [line_category, transaction_date, payment_reference]
    fields:
      line_category: initial_deposit, installment_deposit or additional_pet_deposit.
      transaction_date: Date received.
      amount: Amount received.
      payment_method: Instrument used.
      payment_reference: Confirmation or instrument number.
    account: deposit_held_balance
    direction: in
    triggers: []
  - type: deposit_guarantee_premium
    target: deposit_transactions
    meaning: The non-refundable guarantee premium of the Zero-Deposit Guarantee Plan is paid for a lease term.
    grain: One row per premium payment.
    distinguish_by: [transaction_date, payment_reference]
    fields:
      line_category: guarantee_premium.
      transaction_date: Date paid.
      amount: Premium paid.
      payment_method: Instrument used.
      payment_reference: Confirmation number.
    triggers: []
  - type: deposit_funded
    target: deposit_accounts
    mutation: {transition: {from: pending_funding, to: held}}
    meaning: The account is funded (or the guarantee is bound) and the lease may proceed to move-in.
    grain: One row per transaction.
    fields:
      deposit_held: Cash deposit held after funding (read, not rewritten).
    triggers: []
  - type: deposit_move_out_review
    target: deposit_accounts
    mutation: {transition: {from: held, to: move_out_review}}
    meaning: Possession ended; the move-out inspection and itemization begin.
    grain: One row per transaction.
    fields:
      move_out_date: Date possession ended.
    triggers: []
  - type: deposit_move_out_charge
    target: deposit_transactions
    meaning: One move-out charge is itemized from the move-out inspection — cleaning, a depreciated replacement, damage repair, unreturned fobs or trash removal.
    grain: One row per charge category per room.
    distinguish_by: [line_category, item_location]
    fields:
      line_category: Charge category.
      item_location: Room of the item (whole_unit for cleaning and unit-wide items).
      transaction_date: Itemization date.
      amount: Charge after depreciation.
      item_age_months: Age of a depreciable item at move-out.
      replacement_cost: Full replacement cost of a depreciable item.
      labor_hours: Repair labor billed.
      quantity: Units billed for a per-unit charge.
      inspection_photo_on_file: Whether dated inspection photos are on file.
    triggers: []
  - type: deposit_charge_reversal
    target: deposit_transactions
    meaning: An itemized move-out line is withdrawn from the statement, in whole, after an accepted dispute or an itemization error.
    grain: One row per reversed line.
    distinguish_by: [source_transaction_id]
    fields:
      line_category: line_reversal.
      source_transaction_id: The itemized line withdrawn.
      transaction_date: Date withdrawn.
      amount: Amount withdrawn (the full amount of the line).
    triggers: []
  - type: deposit_application
    target: deposit_transactions
    meaning: Part of the deposit held is applied at final accounting to one ledger's unpaid balance or to the itemized move-out charges.
    grain: One row per ledger or charge group paid per statement date.
    distinguish_by: [line_category, transaction_date]
    fields:
      line_category: unpaid_lease_balance, move_out_charges, unpaid_term_balance, unpaid_utility_balance, unpaid_parking_balance, unpaid_storage_balance or unpaid_pet_balance.
      transaction_date: Statement date.
      amount: Deposit applied.
    account: deposit_held_balance
    direction: out
    triggers:
      - event: lease:lease_payment
        when: {line_category: unpaid_lease_balance}
        map: {amount: amount, payment_date: transaction_date, payment_method: deposit_application, payment_reference: transaction_id}
      - event: term:term_payment
        when: {line_category: unpaid_term_balance}
        map: {amount: amount, assessed_date: transaction_date, payment_method: deposit_application, payment_reference: transaction_id}
      - event: utility:utility_payment
        when: {line_category: unpaid_utility_balance}
        map: {amount: amount, bill_date: transaction_date, payment_method: deposit_application, payment_reference: transaction_id}
      - event: parking:parking_payment
        when: {line_category: unpaid_parking_balance}
        map: {amount: amount, payment_method: deposit_application, payment_reference: transaction_id}
      - event: storage:storage_payment
        when: {line_category: unpaid_storage_balance}
        map: {amount: amount, payment_method: deposit_application, payment_reference: transaction_id}
      - event: pet:pet_payment
        when: {line_category: unpaid_pet_balance}
        map: {amount: amount, payment_method: deposit_application, payment_reference: transaction_id}
  - type: deposit_refund
    target: deposit_transactions
    meaning: The deposit held that remains after final accounting (or all of it, when the lease was withdrawn before move-in) is refunded.
    grain: One row per refund issued.
    distinguish_by: [transaction_date, payment_reference]
    fields:
      line_category: deposit_refund.
      transaction_date: Date issued.
      amount: Amount refunded.
      payment_method: ach_direct_deposit or paper_check.
      payment_reference: ACH trace or check number.
    account: deposit_held_balance
    direction: out
    triggers: []
  - type: deposit_reduction_refund
    target: deposit_transactions
    meaning: The deposit held above the new required amount is refunded after a successful mid-lease reduction review.
    grain: One row per reduction.
    distinguish_by: [transaction_date]
    fields:
      line_category: reduction_refund.
      transaction_date: Date issued.
      amount: Excess deposit refunded.
      payment_method: ach_direct_deposit or paper_check.
      payment_reference: ACH trace or check number.
    account: deposit_held_balance
    direction: out
    triggers: []
  - type: deposit_balance_owed
    target: deposit_transactions
    meaning: Move-out charges not covered by the deposit are billed to the resident as a balance owed.
    grain: One row per statement.
    distinguish_by: [transaction_date]
    fields:
      line_category: balance_owed.
      transaction_date: Statement date.
      amount: Uncovered move-out charges.
    account: final_balance_owed
    direction: in
    triggers: []
  - type: deposit_balance_payment
    target: deposit_transactions
    meaning: A payment is received toward the balance owed.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      line_category: balance_payment.
      transaction_date: Date received.
      amount: Amount received.
      payment_method: Instrument used.
      payment_reference: Confirmation or instrument number.
    account: final_balance_owed
    direction: out
    triggers: []
  - type: deposit_guarantee_claim
    target: deposit_transactions
    meaning: The deposit guarantee pays a claim for the unpaid balance owed of a Zero-Deposit Guarantee Plan account.
    grain: One row per claim paid.
    distinguish_by: [payment_reference]
    fields:
      line_category: guarantee_claim.
      transaction_date: Date the claim was paid.
      amount: Claim paid.
      payment_reference: Guarantor claim number.
    account: final_balance_owed
    direction: out
    triggers: []
  - type: deposit_balance_credit
    target: deposit_transactions
    meaning: The balance owed is reduced without payment — an accepted dispute on a line already billed as balance owed, or a small-balance write-off.
    grain: One row per credited line or write-off.
    distinguish_by: [line_category, source_transaction_id]
    fields:
      line_category: dispute_credit or small_balance_write_off.
      source_transaction_id: The itemized line credited (empty for a write-off).
      transaction_date: Posting date.
      amount: Credit.
    account: final_balance_owed
    direction: out
    triggers: []
  - type: deposit_disposition
    target: deposit_accounts
    mutation: {transition: {from: move_out_review, to: disposition_issued}}
    meaning: The itemized final account statement is issued.
    grain: One row per transaction.
    fields:
      disposition_date: Statement date.
      balance_due_date: Due date of any balance owed (statement date plus balance_owed_due_days); empty when none is owed.
    triggers:
      - event: lease:lease_close
        map: {closed_date: disposition_date}
  - type: deposit_disposition_reopen
    target: deposit_accounts
    mutation: {transition: {from: disposition_issued, to: move_out_review}}
    meaning: An accepted dispute reopens the itemization so that an amended statement can be issued.
    grain: One row per transaction.
    fields:
      disposition_date: Date of the statement being amended (read, not rewritten).
    triggers: []
  - type: deposit_collections_referral
    target: deposit_accounts
    mutation: {transition: {from: disposition_issued, to: in_collections}}
    meaning: An unpaid balance owed is referred to the collection agency.
    grain: One row per transaction.
    fields:
      balance_owed: Balance referred (read, not rewritten).
    triggers: []
  - type: deposit_close
    target: deposit_accounts
    mutation: {transition: [{from: pending_funding, to: closed}, {from: held, to: closed}, {from: disposition_issued, to: closed}, {from: in_collections, to: closed}]}
    meaning: The account closes — never funded, refunded before move-in, settled after the statement, or resolved in collections.
    grain: One row per transaction.
    fields:
      closed_date: Date closed.
    triggers: []
  - type: deposit_forwarding_address_update
    target: deposit_accounts
    mutation: update
    meaning: The resident gives or changes the forwarding address or the refund method.
    grain: One row per transaction.
    fields:
      forwarding_address: Address given, verbatim.
      forwarding_address_date: Date recorded.
      refund_method: Refund method chosen.
    triggers: []
  - type: deposit_plan_change
    target: deposit_accounts
    mutation: update
    meaning: The deposit program of the account changes — a mid-lease reduction, a guarantee opt-out to a cash deposit, or a change of floor plan on transfer.
    grain: One row per transaction.
    fields:
      variant_name: New deposit program.
      required_deposit_amount: New required cash deposit.
    triggers: []

measures:
  - id: deposit_msr_itemized_total
    window: All deposit_move_out_charge rows of the account itemized since the move-out date.
    measure: Sum of amount over those rows, less the amount of every deposit_charge_reversal whose source_transaction_id is one of them.
  - id: deposit_msr_ledger_balances
    window: Balances as of the statement date, per ledger tied to the lease.
    measure: The balance_due of the lease, of every Lease Term Agreement of the lease, of every utility account of the lease, and of every parking, storage and pet holding of the lease, each read separately.
  - id: deposit_msr_late_fee_periods_review
    window: The reduction_review_min_months full months ending on the review date.
    measure: Count of distinct billing_period values among lease_late_fee rows on the lease in the window, plus the count of lease_payment_return rows in the window.

policies:
  - id: deposit_agg_multi_holding
    subject: [deposit_account_open]
    rule: >-
      One deposit account secures one lease, and a resident holds one open lease.
      A deposit account may be opened only when the lease has no other deposit account.
      An in-community transfer keeps the same deposit account (deposit_transfer_on_unit_transfer), and pet deposits are
      added to the same account rather than held in a separate one.
    eligibility:
      - id: one_account_per_lease
        applies_to: [deposit_account_open]
        kind: dedup
        condition: "A deposit account may be opened only when the lease has no other deposit account."
        evidence_fields: [deposit_accounts.lease_id, deposit_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.lease_id]
          action_bindings:
            deposit_accounts.lease_id: lease_id
        dedup_contract:
          table: deposit_accounts
          mode: separate_record
          object_bindings: {lease_id: lease_id}
          duplicate_filters: {status: [pending_funding, held, move_out_review, disposition_issued, in_collections, closed]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: deposit_plan_assignment
    subject: [deposit_account_open, deposit_plan_change]
    rule: >-
      The deposit program is assigned from the lease's screening record, never from what the applicant says about it, in this order of precedence.
      An approved_with_conditions result is assigned the Conditional Approval Deposit Plan when screening_credit_score is
      at or above its entry gate, otherwise the Enhanced Deposit Plan. An approved result on the Penthouse Residence floor
      plan is assigned the Premier Residence Deposit Plan. Any other approved result is assigned the Reduced Deposit Plan
      when screening_credit_score meets its entry gate and otherwise the Standard Deposit Plan, except that the applicant
      may instead elect the Zero-Deposit Guarantee Plan when screening_credit_score meets its entry gate. The required
      deposit is deposit_flat_amount on a flat basis, or deposit_rent_multiple times the lease's monthly_rent (not less
      than deposit_min_amount) on a rent_multiple basis, rounded half up to the cent; it is 0.00 on a guarantee basis. All
      cash deposits of the account, pet deposits included, may never exceed deposit_cap_rent_multiple_by_state times the
      monthly rent in a state that has a cap, and a required deposit above the cap is reduced to it. A program changes
      mid-lease only after a successful reduction review, when a guarantee household opts out to a cash deposit
      (guarantee_opt_out_allowed; it is assigned the Standard Deposit Plan and funds it within
      funding_due_days_after_approval of the election), or when a transfer to the Penthouse Residence floor plan requires the
      Premier Residence Deposit Plan, whose additional amount is funded before the transfer move date.
    eligibility:
      - id: screening_on_record
        applies_to: [deposit_account_open]
        kind: authorization
        condition: "The deposit program is assigned from the lease's screening record, never from what the applicant says about it, in this order of precedence."
        evidence_fields: [leases.lease_id, leases.screening_result, leases.screening_credit_score, leases.variant_name, leases.monthly_rent]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
    params:
      deposit_cap_rent_multiple_by_state: {CA: 1.0, AZ: 1.5}
      per_tier:
        Zero-Deposit Guarantee Plan: {deposit_basis: "=deposit_basis", deposit_flat_amount: "=deposit_flat_amount", deposit_rent_multiple: "=deposit_rent_multiple", deposit_min_amount: "=deposit_min_amount", guarantee_opt_out_allowed: "=guarantee_opt_out_allowed"}
        Reduced Deposit Plan: {deposit_basis: "=deposit_basis", deposit_flat_amount: "=deposit_flat_amount", deposit_rent_multiple: "=deposit_rent_multiple", deposit_min_amount: "=deposit_min_amount", guarantee_opt_out_allowed: "=guarantee_opt_out_allowed"}
        Standard Deposit Plan: {deposit_basis: "=deposit_basis", deposit_flat_amount: "=deposit_flat_amount", deposit_rent_multiple: "=deposit_rent_multiple", deposit_min_amount: "=deposit_min_amount", guarantee_opt_out_allowed: "=guarantee_opt_out_allowed"}
        Premier Residence Deposit Plan: {deposit_basis: "=deposit_basis", deposit_flat_amount: "=deposit_flat_amount", deposit_rent_multiple: "=deposit_rent_multiple", deposit_min_amount: "=deposit_min_amount", guarantee_opt_out_allowed: "=guarantee_opt_out_allowed"}
        Conditional Approval Deposit Plan: {deposit_basis: "=deposit_basis", deposit_flat_amount: "=deposit_flat_amount", deposit_rent_multiple: "=deposit_rent_multiple", deposit_min_amount: "=deposit_min_amount", guarantee_opt_out_allowed: "=guarantee_opt_out_allowed"}
        Enhanced Deposit Plan: {deposit_basis: "=deposit_basis", deposit_flat_amount: "=deposit_flat_amount", deposit_rent_multiple: "=deposit_rent_multiple", deposit_min_amount: "=deposit_min_amount", guarantee_opt_out_allowed: "=guarantee_opt_out_allowed"}

  - id: deposit_evt_funding
    subject: [deposit_funding, deposit_guarantee_premium, deposit_funded]
    rule: >-
      Deposit funds are received only while the account is pending_funding or held.
      The required deposit, or on the Zero-Deposit Guarantee Plan the guarantee premium, is due within
      funding_due_days_after_approval calendar days after lease approval and only in accepted_funding_methods. The
      guarantee premium is guarantee_premium_pct_of_coverage times the coverage (guarantee_coverage_rent_multiple times
      monthly_rent), rounded half up to the cent, paid again for each renewal term, and never refunded. When
      installment_funding_allowed is true the cash deposit may be split into at most installment_max_count equal
      installments (the last absorbing rounding), the first due as above and each later one installment_interval_days
      calendar days after the previous; the account reaches held when the first installment is received and the
      resident has signed the installment arrangement; an installment not received by its due date stays owed on the
      deposit account, is never posted to the lease ledger, and is simply not held at final accounting. Without installments the account reaches held only when the full required deposit (or the
      premium) is received. An additional pet deposit required by the pet addendum charter is received into the same
      account while it is held. Deposits bear no interest (interest_on_deposit).
    eligibility:
      - id: funding_status
        applies_to: [deposit_funding, deposit_guarantee_premium]
        kind: state
        condition: "Deposit funds are received only while the account is pending_funding or held."
        evidence_fields: [deposit_accounts.deposit_account_id, deposit_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_account_id]
          action_bindings:
            deposit_accounts.deposit_account_id: deposit_account_id
        state_contract:
          field: deposit_accounts.status
          allowed: [pending_funding, held]
    params:
      per_tier:
        Zero-Deposit Guarantee Plan: {funding_due_days_after_approval: "=funding_due_days_after_approval", funding_required_before_move_in: "=funding_required_before_move_in", installment_funding_allowed: "=installment_funding_allowed", installment_max_count: "=installment_max_count", installment_interval_days: "=installment_interval_days", accepted_funding_methods: "=accepted_funding_methods", guarantee_premium_pct_of_coverage: "=guarantee_premium_pct_of_coverage", guarantee_coverage_rent_multiple: "=guarantee_coverage_rent_multiple", interest_on_deposit: "=interest_on_deposit"}
        Reduced Deposit Plan: {funding_due_days_after_approval: "=funding_due_days_after_approval", funding_required_before_move_in: "=funding_required_before_move_in", installment_funding_allowed: "=installment_funding_allowed", installment_max_count: "=installment_max_count", installment_interval_days: "=installment_interval_days", accepted_funding_methods: "=accepted_funding_methods", guarantee_premium_pct_of_coverage: "=guarantee_premium_pct_of_coverage", guarantee_coverage_rent_multiple: "=guarantee_coverage_rent_multiple", interest_on_deposit: "=interest_on_deposit"}
        Standard Deposit Plan: {funding_due_days_after_approval: "=funding_due_days_after_approval", funding_required_before_move_in: "=funding_required_before_move_in", installment_funding_allowed: "=installment_funding_allowed", installment_max_count: "=installment_max_count", installment_interval_days: "=installment_interval_days", accepted_funding_methods: "=accepted_funding_methods", guarantee_premium_pct_of_coverage: "=guarantee_premium_pct_of_coverage", guarantee_coverage_rent_multiple: "=guarantee_coverage_rent_multiple", interest_on_deposit: "=interest_on_deposit"}
        Premier Residence Deposit Plan: {funding_due_days_after_approval: "=funding_due_days_after_approval", funding_required_before_move_in: "=funding_required_before_move_in", installment_funding_allowed: "=installment_funding_allowed", installment_max_count: "=installment_max_count", installment_interval_days: "=installment_interval_days", accepted_funding_methods: "=accepted_funding_methods", guarantee_premium_pct_of_coverage: "=guarantee_premium_pct_of_coverage", guarantee_coverage_rent_multiple: "=guarantee_coverage_rent_multiple", interest_on_deposit: "=interest_on_deposit"}
        Conditional Approval Deposit Plan: {funding_due_days_after_approval: "=funding_due_days_after_approval", funding_required_before_move_in: "=funding_required_before_move_in", installment_funding_allowed: "=installment_funding_allowed", installment_max_count: "=installment_max_count", installment_interval_days: "=installment_interval_days", accepted_funding_methods: "=accepted_funding_methods", guarantee_premium_pct_of_coverage: "=guarantee_premium_pct_of_coverage", guarantee_coverage_rent_multiple: "=guarantee_coverage_rent_multiple", interest_on_deposit: "=interest_on_deposit"}
        Enhanced Deposit Plan: {funding_due_days_after_approval: "=funding_due_days_after_approval", funding_required_before_move_in: "=funding_required_before_move_in", installment_funding_allowed: "=installment_funding_allowed", installment_max_count: "=installment_max_count", installment_interval_days: "=installment_interval_days", accepted_funding_methods: "=accepted_funding_methods", guarantee_premium_pct_of_coverage: "=guarantee_premium_pct_of_coverage", guarantee_coverage_rent_multiple: "=guarantee_coverage_rent_multiple", interest_on_deposit: "=interest_on_deposit"}

  - id: deposit_move_out_itemization
    subject: [deposit_move_out_review, deposit_move_out_charge]
    rule: >-
      Move-out charges are itemized only while the account is in move_out_review.
      Review starts on the lease's move-out date. Only damage beyond normal wear and tear, cleaning and the per-unit
      charges below may be itemized; normal wear and tear — paint faded or lightly scuffed by ordinary living, a few small
      nail holes, carpet worn along traffic paths, sun-faded blinds, loosened fixtures — is never charged. Cleaning is
      itemized once for the whole_unit, only when the inspection finds the apartment home not left as clean as at move-in,
      at cleaning_charge_by_floor_plan for the lease's floor plan, and never when the program's cleaning_waived is true;
      stains beyond normal cleaning add carpet_spot_cleaning_per_room per room. A carpet, paint, flooring, blinds or
      appliance replacement is charged at its replacement_cost times the remaining useful life (the item's useful life in
      months from the program's useful-life parameters less item_age_months, never below 0) divided by that useful life,
      rounded half up to the cent (depreciation_method straight_line_monthly); an item at or past its useful life is never
      charged. A damage_repair line is labor_hours, rounded up to min_labor_increment_hours, times
      repair_labor_rate_hourly, plus the parts cost recorded in replacement_cost. Unreturned fobs are quantity times
      unreturned_fob_charge and trash or abandoned-property removals quantity times trash_removal_charge.
      A line above photo_evidence_threshold may be itemized only when dated move-out inspection photos of the item are on file.
      An item listed at a pre-move-out inspection (offered pre_move_out_inspection_offer_days before the intended move-out
      date) that the resident corrected before moving out may not be charged. Only one line per charge category per room is itemized.
    eligibility:
      - id: itemize_in_review
        applies_to: [deposit_move_out_charge]
        kind: state
        condition: "Move-out charges are itemized only while the account is in move_out_review."
        evidence_fields: [deposit_accounts.deposit_account_id, deposit_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_account_id]
          action_bindings:
            deposit_accounts.deposit_account_id: deposit_account_id
        state_contract:
          field: deposit_accounts.status
          allowed: [move_out_review]
      - id: photos_for_large_lines
        applies_to: [deposit_move_out_charge]
        kind: authorization
        condition: "A line above photo_evidence_threshold may be itemized only when dated move-out inspection photos of the item are on file."
        evidence_fields: [deposit_transactions.deposit_account_id, deposit_transactions.line_category, deposit_transactions.item_location, deposit_transactions.inspection_photo_on_file, deposit_transactions.amount]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_transactions.deposit_account_id, deposit_transactions.line_category, deposit_transactions.item_location]
          action_bindings:
            deposit_transactions.deposit_account_id: deposit_account_id
            deposit_transactions.line_category: line_category
            deposit_transactions.item_location: item_location
      - id: one_line_per_category_room
        applies_to: [deposit_move_out_charge]
        kind: dedup
        condition: "Only one line per charge category per room is itemized."
        evidence_fields: [deposit_transactions.deposit_account_id, deposit_transactions.line_category, deposit_transactions.item_location]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_transactions.deposit_account_id, deposit_transactions.line_category, deposit_transactions.item_location]
          action_bindings:
            deposit_transactions.deposit_account_id: deposit_account_id
            deposit_transactions.line_category: line_category
            deposit_transactions.item_location: item_location
        dedup_contract:
          table: deposit_transactions
          mode: separate_record
          object_bindings: {deposit_account_id: deposit_account_id, line_category: line_category, item_location: item_location}
          duplicate_filters: {event_type: [deposit_move_out_charge]}
          distinct_fields: []
    params:
      cleaning_charge_by_floor_plan: {Studio Residence: 125.00, One-Bedroom Residence: 150.00, One-Bedroom Den Residence: 165.00, Two-Bedroom Residence: 195.00, Three-Bedroom Residence: 235.00, Penthouse Residence: 295.00}
      per_tier:
        Zero-Deposit Guarantee Plan: {cleaning_waived: "=cleaning_waived", carpet_useful_life_months: "=carpet_useful_life_months", paint_useful_life_months: "=paint_useful_life_months", flooring_useful_life_months: "=flooring_useful_life_months", blinds_useful_life_months: "=blinds_useful_life_months", appliance_useful_life_months: "=appliance_useful_life_months", depreciation_method: "=depreciation_method", repair_labor_rate_hourly: "=repair_labor_rate_hourly", min_labor_increment_hours: "=min_labor_increment_hours", unreturned_fob_charge: "=unreturned_fob_charge", trash_removal_charge: "=trash_removal_charge", carpet_spot_cleaning_per_room: "=carpet_spot_cleaning_per_room", photo_evidence_threshold: "=photo_evidence_threshold", pre_move_out_inspection_offer_days: "=pre_move_out_inspection_offer_days", itemization_rounding: "=itemization_rounding"}
        Reduced Deposit Plan: {cleaning_waived: "=cleaning_waived", carpet_useful_life_months: "=carpet_useful_life_months", paint_useful_life_months: "=paint_useful_life_months", flooring_useful_life_months: "=flooring_useful_life_months", blinds_useful_life_months: "=blinds_useful_life_months", appliance_useful_life_months: "=appliance_useful_life_months", depreciation_method: "=depreciation_method", repair_labor_rate_hourly: "=repair_labor_rate_hourly", min_labor_increment_hours: "=min_labor_increment_hours", unreturned_fob_charge: "=unreturned_fob_charge", trash_removal_charge: "=trash_removal_charge", carpet_spot_cleaning_per_room: "=carpet_spot_cleaning_per_room", photo_evidence_threshold: "=photo_evidence_threshold", pre_move_out_inspection_offer_days: "=pre_move_out_inspection_offer_days", itemization_rounding: "=itemization_rounding"}
        Standard Deposit Plan: {cleaning_waived: "=cleaning_waived", carpet_useful_life_months: "=carpet_useful_life_months", paint_useful_life_months: "=paint_useful_life_months", flooring_useful_life_months: "=flooring_useful_life_months", blinds_useful_life_months: "=blinds_useful_life_months", appliance_useful_life_months: "=appliance_useful_life_months", depreciation_method: "=depreciation_method", repair_labor_rate_hourly: "=repair_labor_rate_hourly", min_labor_increment_hours: "=min_labor_increment_hours", unreturned_fob_charge: "=unreturned_fob_charge", trash_removal_charge: "=trash_removal_charge", carpet_spot_cleaning_per_room: "=carpet_spot_cleaning_per_room", photo_evidence_threshold: "=photo_evidence_threshold", pre_move_out_inspection_offer_days: "=pre_move_out_inspection_offer_days", itemization_rounding: "=itemization_rounding"}
        Premier Residence Deposit Plan: {cleaning_waived: "=cleaning_waived", carpet_useful_life_months: "=carpet_useful_life_months", paint_useful_life_months: "=paint_useful_life_months", flooring_useful_life_months: "=flooring_useful_life_months", blinds_useful_life_months: "=blinds_useful_life_months", appliance_useful_life_months: "=appliance_useful_life_months", depreciation_method: "=depreciation_method", repair_labor_rate_hourly: "=repair_labor_rate_hourly", min_labor_increment_hours: "=min_labor_increment_hours", unreturned_fob_charge: "=unreturned_fob_charge", trash_removal_charge: "=trash_removal_charge", carpet_spot_cleaning_per_room: "=carpet_spot_cleaning_per_room", photo_evidence_threshold: "=photo_evidence_threshold", pre_move_out_inspection_offer_days: "=pre_move_out_inspection_offer_days", itemization_rounding: "=itemization_rounding"}
        Conditional Approval Deposit Plan: {cleaning_waived: "=cleaning_waived", carpet_useful_life_months: "=carpet_useful_life_months", paint_useful_life_months: "=paint_useful_life_months", flooring_useful_life_months: "=flooring_useful_life_months", blinds_useful_life_months: "=blinds_useful_life_months", appliance_useful_life_months: "=appliance_useful_life_months", depreciation_method: "=depreciation_method", repair_labor_rate_hourly: "=repair_labor_rate_hourly", min_labor_increment_hours: "=min_labor_increment_hours", unreturned_fob_charge: "=unreturned_fob_charge", trash_removal_charge: "=trash_removal_charge", carpet_spot_cleaning_per_room: "=carpet_spot_cleaning_per_room", photo_evidence_threshold: "=photo_evidence_threshold", pre_move_out_inspection_offer_days: "=pre_move_out_inspection_offer_days", itemization_rounding: "=itemization_rounding"}
        Enhanced Deposit Plan: {cleaning_waived: "=cleaning_waived", carpet_useful_life_months: "=carpet_useful_life_months", paint_useful_life_months: "=paint_useful_life_months", flooring_useful_life_months: "=flooring_useful_life_months", blinds_useful_life_months: "=blinds_useful_life_months", appliance_useful_life_months: "=appliance_useful_life_months", depreciation_method: "=depreciation_method", repair_labor_rate_hourly: "=repair_labor_rate_hourly", min_labor_increment_hours: "=min_labor_increment_hours", unreturned_fob_charge: "=unreturned_fob_charge", trash_removal_charge: "=trash_removal_charge", carpet_spot_cleaning_per_room: "=carpet_spot_cleaning_per_room", photo_evidence_threshold: "=photo_evidence_threshold", pre_move_out_inspection_offer_days: "=pre_move_out_inspection_offer_days", itemization_rounding: "=itemization_rounding"}
    formula:
      carpet_charge: round(replacement_cost * max(0, carpet_useful_life_months - item_age_months) / carpet_useful_life_months, 2)
      paint_charge: round(replacement_cost * max(0, paint_useful_life_months - item_age_months) / paint_useful_life_months, 2)
      repair_charge: round(labor_hours * repair_labor_rate_hourly + replacement_cost, 2)
      fob_charge: quantity * unreturned_fob_charge

  - id: deposit_agg_final_accounting
    subject: [deposit_application, deposit_refund, deposit_balance_owed]
    rule: >-
      Final accounting brings together every balance tied to the lease on the statement date: the itemized move-out charges
      (deposit_msr_itemized_total) and the unpaid balance of each ledger (deposit_msr_ledger_balances). The deposit held is
      applied in deposit_application_order, each group taking the smaller of its amount and the deposit still unapplied, one
      application line per group; a group of 0.00 takes no line.
      Deposit may be applied to charges only when the final account statement is issued no later than the move-out date plus the disposition deadline of the governing state.
      Deadline days are counted as calendar days starting the day after the move-out date, and the last counted day is included; in AZ only days that are not Saturdays, Sundays or Arizona legal holidays are counted, and in TX the count starts the day after the later of the move-out date and forwarding_address_date.
      When the statement is issued later, the deposit is forfeited to the resident for this purpose: nothing is applied,
      the whole deposit held is refunded, and the charges remain owed. Deposit left after application is refunded on the
      statement date by refund_method to all leaseholders jointly (joint_refund_payee_rule), a paper check going to the
      forwarding address or, when none was given, to the apartment home's address. Move-out charges not covered by the
      deposit are billed as one balance_owed line; ledger balances not covered stay on their own ledgers and are listed
      on the statement. A Zero-Deposit Guarantee Plan account has no deposit to apply, so its move-out charges become the
      balance owed in full. An account whose lease was withdrawn before move-in has no itemization: its whole deposit held
      is refunded and the account closes.
    eligibility:
      - id: statement_within_deadline
        applies_to: [deposit_application]
        kind: time
        condition: "Deposit may be applied to charges only when the final account statement is issued no later than the move-out date plus the disposition deadline of the governing state."
        evidence_fields: [deposit_accounts.deposit_account_id, deposit_accounts.move_out_date, deposit_accounts.governing_state, deposit_accounts.forwarding_address_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_account_id]
          action_bindings:
            deposit_accounts.deposit_account_id: deposit_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the move-out date
          anchor_source: deposit_accounts.move_out_date
          relation: not_after
          duration_source: params.disposition_deadline_days_by_state
          unit: calendar_days
          counting_rule: "Deadline days are counted as calendar days starting the day after the move-out date, and the last counted day is included; in AZ only days that are not Saturdays, Sundays or Arizona legal holidays are counted, and in TX the count starts the day after the later of the move-out date and forwarding_address_date."
          boundary: inclusive
    params:
      disposition_deadline_days_by_state: {CA: 21, WA: 30, CO: 30, TX: 30, GA: 30, AZ: 14}
      deposit_application_order: [unpaid_lease_balance, move_out_charges, unpaid_term_balance, unpaid_utility_balance, unpaid_parking_balance, unpaid_storage_balance, unpaid_pet_balance]
      per_tier:
        Zero-Deposit Guarantee Plan: {deposit_refundable: "=deposit_refundable", pet_deposit_refundable: "=pet_deposit_refundable", joint_refund_payee_rule: "=joint_refund_payee_rule", refund_method_default: "=refund_method_default"}
        Reduced Deposit Plan: {deposit_refundable: "=deposit_refundable", pet_deposit_refundable: "=pet_deposit_refundable", joint_refund_payee_rule: "=joint_refund_payee_rule", refund_method_default: "=refund_method_default"}
        Standard Deposit Plan: {deposit_refundable: "=deposit_refundable", pet_deposit_refundable: "=pet_deposit_refundable", joint_refund_payee_rule: "=joint_refund_payee_rule", refund_method_default: "=refund_method_default"}
        Premier Residence Deposit Plan: {deposit_refundable: "=deposit_refundable", pet_deposit_refundable: "=pet_deposit_refundable", joint_refund_payee_rule: "=joint_refund_payee_rule", refund_method_default: "=refund_method_default"}
        Conditional Approval Deposit Plan: {deposit_refundable: "=deposit_refundable", pet_deposit_refundable: "=pet_deposit_refundable", joint_refund_payee_rule: "=joint_refund_payee_rule", refund_method_default: "=refund_method_default"}
        Enhanced Deposit Plan: {deposit_refundable: "=deposit_refundable", pet_deposit_refundable: "=pet_deposit_refundable", joint_refund_payee_rule: "=joint_refund_payee_rule", refund_method_default: "=refund_method_default"}
    measures: [deposit_msr_itemized_total, deposit_msr_ledger_balances]

  - id: deposit_disposition_timing
    subject: [deposit_disposition, deposit_forwarding_address_update]
    rule: >-
      The final account statement is issued once, after itemization, as the resident's itemized record of every move-out
      charge (category, room, age, replacement cost, labor and amount), every ledger balance, each deposit application,
      the refund and the balance owed, and it is delivered by statement_delivery. Larkspur's service standard is to issue it
      within disposition_statement_days of the move-out date, and it must never be later than the statutory deadline of the
      final accounting rule. The resident is asked for a forwarding address with the notice to vacate and at move-out
      (forwarding_address_requested); a forwarding address or refund method may be recorded at any time before the refund is
      issued, and a change after a paper check was mailed does not reissue it until the check is returned or voided after
      unclaimed_refund_days. Issuing the statement closes the lease record under the lease charter.
    eligibility: []
    params:
      per_tier:
        Zero-Deposit Guarantee Plan: {disposition_statement_days: "=disposition_statement_days", statement_delivery: "=statement_delivery", forwarding_address_requested: "=forwarding_address_requested", unclaimed_refund_days: "=unclaimed_refund_days"}
        Reduced Deposit Plan: {disposition_statement_days: "=disposition_statement_days", statement_delivery: "=statement_delivery", forwarding_address_requested: "=forwarding_address_requested", unclaimed_refund_days: "=unclaimed_refund_days"}
        Standard Deposit Plan: {disposition_statement_days: "=disposition_statement_days", statement_delivery: "=statement_delivery", forwarding_address_requested: "=forwarding_address_requested", unclaimed_refund_days: "=unclaimed_refund_days"}
        Premier Residence Deposit Plan: {disposition_statement_days: "=disposition_statement_days", statement_delivery: "=statement_delivery", forwarding_address_requested: "=forwarding_address_requested", unclaimed_refund_days: "=unclaimed_refund_days"}
        Conditional Approval Deposit Plan: {disposition_statement_days: "=disposition_statement_days", statement_delivery: "=statement_delivery", forwarding_address_requested: "=forwarding_address_requested", unclaimed_refund_days: "=unclaimed_refund_days"}
        Enhanced Deposit Plan: {disposition_statement_days: "=disposition_statement_days", statement_delivery: "=statement_delivery", forwarding_address_requested: "=forwarding_address_requested", unclaimed_refund_days: "=unclaimed_refund_days"}

  - id: deposit_disputes_and_amendment
    subject: [deposit_disposition_reopen, deposit_charge_reversal, deposit_balance_credit]
    rule: >-
      An itemized move-out line may be disputed only through a dispute recorded against that line.
      A dispute may be accepted only when the frozen date is no later than the date of the final account statement plus dispute_window_days.
      Dispute days are counted as calendar days starting the day after the statement date, and the last counted day is included.
      A dispute is decided within dispute_response_days and accepted only when the line breaks the itemization rule — it
      charges normal wear and tear, lacks required photos, misapplies depreciation or labor, or charges an item corrected
      after the pre-move-out inspection. An accepted dispute reopens the account, withdraws the line in full, and a
      corrected statement follows: the amount that the withdrawn line had taken from the deposit is refunded, and the part
      that sat in the balance owed is credited by a dispute_credit. A line is withdrawn at most once. A dispute that is not
      accepted leaves the statement as issued; a disagreement about something other than an itemized line (a ledger
      balance, a fee of another charter) is decided under that charter, not here.
    eligibility:
      - id: dispute_window
        applies_to: [deposit_charge_reversal, deposit_disposition_reopen]
        kind: time
        condition: "A dispute may be accepted only when the frozen date is no later than the date of the final account statement plus dispute_window_days."
        evidence_fields: [deposit_accounts.deposit_account_id, deposit_accounts.disposition_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_account_id]
          action_bindings:
            deposit_accounts.deposit_account_id: deposit_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the final account statement
          anchor_source: deposit_accounts.disposition_date
          relation: not_after
          duration_source: variants.dispute_window_days
          unit: calendar_days
          counting_rule: "Dispute days are counted as calendar days starting the day after the statement date, and the last counted day is included."
          boundary: inclusive
      - id: dispute_on_line
        applies_to: [deposit_charge_reversal, deposit_disposition_reopen]
        kind: authorization
        condition: "An itemized move-out line may be disputed only through a dispute recorded against that line."
        evidence_fields: [deposit_disputes.dispute_id, deposit_disputes.transaction_id, deposit_disputes.dispute_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_disputes.transaction_id]
          action_bindings:
            deposit_disputes.transaction_id: source_transaction_id
      - id: withdraw_once
        applies_to: [deposit_charge_reversal]
        kind: dedup
        condition: "A line is withdrawn at most once."
        evidence_fields: [deposit_transactions.source_transaction_id, deposit_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_transactions.source_transaction_id]
          action_bindings:
            deposit_transactions.source_transaction_id: source_transaction_id
        dedup_contract:
          table: deposit_transactions
          mode: separate_record
          object_bindings: {source_transaction_id: source_transaction_id}
          duplicate_filters: {event_type: [deposit_charge_reversal]}
          distinct_fields: []
    params:
      per_tier:
        Zero-Deposit Guarantee Plan: {dispute_window_days: "=dispute_window_days", dispute_response_days: "=dispute_response_days"}
        Reduced Deposit Plan: {dispute_window_days: "=dispute_window_days", dispute_response_days: "=dispute_response_days"}
        Standard Deposit Plan: {dispute_window_days: "=dispute_window_days", dispute_response_days: "=dispute_response_days"}
        Premier Residence Deposit Plan: {dispute_window_days: "=dispute_window_days", dispute_response_days: "=dispute_response_days"}
        Conditional Approval Deposit Plan: {dispute_window_days: "=dispute_window_days", dispute_response_days: "=dispute_response_days"}
        Enhanced Deposit Plan: {dispute_window_days: "=dispute_window_days", dispute_response_days: "=dispute_response_days"}

  - id: deposit_balance_and_collections
    subject: [deposit_balance_payment, deposit_guarantee_claim, deposit_collections_referral, deposit_close, deposit_balance_credit]
    rule: >-
      A balance owed is due balance_owed_due_days calendar days after the statement date and may be paid by any lease
      instrument. On a Zero-Deposit Guarantee Plan account, a balance owed still unpaid guarantee_claim_waiting_days after
      its due date is claimed from the guarantee, which pays the smaller of the unpaid balance and the coverage
      (guarantee_coverage_rent_multiple times the monthly rent at move-in); whatever the claim does not cover stays owed.
      A balance owed at or below small_balance_write_off once due is written off by a small_balance_write_off credit.
      A balance may be referred to collections only after the balance owed due date plus collections_referral_days_after_due.
      Collections days are counted as calendar days starting the day after the due date, and the referral may be made from the last counted day.
      A referral takes the balance owed and, when collections_referral_includes_ledgers is true, the ledger balances left on
      the statement. The account closes when the deposit held and the balance owed are both 0.00 — after the refund, after
      payment, claim or write-off, or when the collection agency reports the balance resolved.
    eligibility:
      - id: referral_after_due
        applies_to: [deposit_collections_referral]
        kind: time
        condition: "A balance may be referred to collections only after the balance owed due date plus collections_referral_days_after_due."
        evidence_fields: [deposit_accounts.deposit_account_id, deposit_accounts.balance_due_date, deposit_accounts.balance_owed]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_account_id]
          action_bindings:
            deposit_accounts.deposit_account_id: deposit_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the balance owed due date
          anchor_source: deposit_accounts.balance_due_date
          relation: not_before
          duration_source: variants.collections_referral_days_after_due
          unit: calendar_days
          counting_rule: "Collections days are counted as calendar days starting the day after the due date, and the referral may be made from the last counted day."
          boundary: inclusive
    params:
      per_tier:
        Zero-Deposit Guarantee Plan: {balance_owed_due_days: "=balance_owed_due_days", guarantee_claim_waiting_days: "=guarantee_claim_waiting_days", guarantee_coverage_rent_multiple: "=guarantee_coverage_rent_multiple", small_balance_write_off: "=small_balance_write_off", collections_referral_days_after_due: "=collections_referral_days_after_due", collections_referral_includes_ledgers: "=collections_referral_includes_ledgers"}
        Reduced Deposit Plan: {balance_owed_due_days: "=balance_owed_due_days", guarantee_claim_waiting_days: "=guarantee_claim_waiting_days", guarantee_coverage_rent_multiple: "=guarantee_coverage_rent_multiple", small_balance_write_off: "=small_balance_write_off", collections_referral_days_after_due: "=collections_referral_days_after_due", collections_referral_includes_ledgers: "=collections_referral_includes_ledgers"}
        Standard Deposit Plan: {balance_owed_due_days: "=balance_owed_due_days", guarantee_claim_waiting_days: "=guarantee_claim_waiting_days", guarantee_coverage_rent_multiple: "=guarantee_coverage_rent_multiple", small_balance_write_off: "=small_balance_write_off", collections_referral_days_after_due: "=collections_referral_days_after_due", collections_referral_includes_ledgers: "=collections_referral_includes_ledgers"}
        Premier Residence Deposit Plan: {balance_owed_due_days: "=balance_owed_due_days", guarantee_claim_waiting_days: "=guarantee_claim_waiting_days", guarantee_coverage_rent_multiple: "=guarantee_coverage_rent_multiple", small_balance_write_off: "=small_balance_write_off", collections_referral_days_after_due: "=collections_referral_days_after_due", collections_referral_includes_ledgers: "=collections_referral_includes_ledgers"}
        Conditional Approval Deposit Plan: {balance_owed_due_days: "=balance_owed_due_days", guarantee_claim_waiting_days: "=guarantee_claim_waiting_days", guarantee_coverage_rent_multiple: "=guarantee_coverage_rent_multiple", small_balance_write_off: "=small_balance_write_off", collections_referral_days_after_due: "=collections_referral_days_after_due", collections_referral_includes_ledgers: "=collections_referral_includes_ledgers"}
        Enhanced Deposit Plan: {balance_owed_due_days: "=balance_owed_due_days", guarantee_claim_waiting_days: "=guarantee_claim_waiting_days", guarantee_coverage_rent_multiple: "=guarantee_coverage_rent_multiple", small_balance_write_off: "=small_balance_write_off", collections_referral_days_after_due: "=collections_referral_days_after_due", collections_referral_includes_ledgers: "=collections_referral_includes_ledgers"}

  - id: deposit_reduction_review
    subject: [deposit_plan_change, deposit_reduction_refund]
    rule: >-
      A program with reduction_review_eligible true is reviewed for a mid-lease reduction.
      A reduction may be granted only when the frozen date is on or after the lease's move-in date plus reduction_review_min_months.
      Review months are counted in calendar months from the move-in date to the same day number of a later month, falling back to the last day of that month when that day number does not exist.
      It further requires deposit_msr_late_fee_periods_review not above reduction_review_max_late_fees and the lease active
      (not in_default or eviction_filed). A granted reduction moves the account to reduction_target_plan, recomputes the
      required deposit under that program, and refunds the deposit held above the new required amount (pet deposits are not
      reduced) by refund_method. A reduction is granted at most once per lease, and a denied review may be requested again
      after the next full month.
    eligibility:
      - id: review_months
        applies_to: [deposit_plan_change, deposit_reduction_refund]
        kind: time
        condition: "A reduction may be granted only when the frozen date is on or after the lease's move-in date plus reduction_review_min_months."
        evidence_fields: [leases.lease_id, leases.move_in_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the lease's move-in date
          anchor_source: leases.move_in_date
          relation: not_before
          duration_source: variants.reduction_review_min_months
          unit: calendar_months
          counting_rule: "Review months are counted in calendar months from the move-in date to the same day number of a later month, falling back to the last day of that month when that day number does not exist."
          boundary: inclusive
    params:
      per_tier:
        Zero-Deposit Guarantee Plan: {reduction_review_eligible: "=reduction_review_eligible", reduction_review_min_months: "=reduction_review_min_months", reduction_review_max_late_fees: "=reduction_review_max_late_fees", reduction_target_plan: "=reduction_target_plan"}
        Reduced Deposit Plan: {reduction_review_eligible: "=reduction_review_eligible", reduction_review_min_months: "=reduction_review_min_months", reduction_review_max_late_fees: "=reduction_review_max_late_fees", reduction_target_plan: "=reduction_target_plan"}
        Standard Deposit Plan: {reduction_review_eligible: "=reduction_review_eligible", reduction_review_min_months: "=reduction_review_min_months", reduction_review_max_late_fees: "=reduction_review_max_late_fees", reduction_target_plan: "=reduction_target_plan"}
        Premier Residence Deposit Plan: {reduction_review_eligible: "=reduction_review_eligible", reduction_review_min_months: "=reduction_review_min_months", reduction_review_max_late_fees: "=reduction_review_max_late_fees", reduction_target_plan: "=reduction_target_plan"}
        Conditional Approval Deposit Plan: {reduction_review_eligible: "=reduction_review_eligible", reduction_review_min_months: "=reduction_review_min_months", reduction_review_max_late_fees: "=reduction_review_max_late_fees", reduction_target_plan: "=reduction_target_plan"}
        Enhanced Deposit Plan: {reduction_review_eligible: "=reduction_review_eligible", reduction_review_min_months: "=reduction_review_min_months", reduction_review_max_late_fees: "=reduction_review_max_late_fees", reduction_target_plan: "=reduction_target_plan"}
    measures: [deposit_msr_late_fee_periods_review]

  - id: deposit_evt_refund_channel
    subject: [deposit_refund, deposit_reduction_refund]
    rule: >-
      Refunds are issued only while the account is held, move_out_review or disposition_issued.
      A refund from a held account is made only for a lease withdrawn before move-in (the whole deposit) or after a granted
      reduction; a refund at final accounting is issued with the statement. A refund is paid by ach_direct_deposit only to an
      account the resident enrolled, otherwise by paper_check (refund_method_default); a check uncashed after
      unclaimed_refund_days is voided and handled as unclaimed property under state law, and is not reissued by resident
      services. The guarantee premium and any non-refundable amount are never refunded.
    eligibility:
      - id: refund_status
        applies_to: [deposit_refund, deposit_reduction_refund]
        kind: state
        condition: "Refunds are issued only while the account is held, move_out_review or disposition_issued."
        evidence_fields: [deposit_accounts.deposit_account_id, deposit_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.deposit_account_id]
          action_bindings:
            deposit_accounts.deposit_account_id: deposit_account_id
        state_contract:
          field: deposit_accounts.status
          allowed: [held, move_out_review, disposition_issued]
    params:
      per_tier:
        Zero-Deposit Guarantee Plan: {refund_method_default: "=refund_method_default", unclaimed_refund_days: "=unclaimed_refund_days", deposit_refundable: "=deposit_refundable"}
        Reduced Deposit Plan: {refund_method_default: "=refund_method_default", unclaimed_refund_days: "=unclaimed_refund_days", deposit_refundable: "=deposit_refundable"}
        Standard Deposit Plan: {refund_method_default: "=refund_method_default", unclaimed_refund_days: "=unclaimed_refund_days", deposit_refundable: "=deposit_refundable"}
        Premier Residence Deposit Plan: {refund_method_default: "=refund_method_default", unclaimed_refund_days: "=unclaimed_refund_days", deposit_refundable: "=deposit_refundable"}
        Conditional Approval Deposit Plan: {refund_method_default: "=refund_method_default", unclaimed_refund_days: "=unclaimed_refund_days", deposit_refundable: "=deposit_refundable"}
        Enhanced Deposit Plan: {refund_method_default: "=refund_method_default", unclaimed_refund_days: "=unclaimed_refund_days", deposit_refundable: "=deposit_refundable"}
