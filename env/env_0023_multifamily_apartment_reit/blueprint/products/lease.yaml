# Apartment Home Lease — the tenancy itself and its rent ledger.
# One holding = one lease of one apartment home at one Larkspur community, tiered by floor plan.
category: lease
display_name: Apartment Home Lease

binding:
  holding_table: leases
  event_tables: [lease_charges, lease_payments, lease_notices]
  intake_tables: [lease_payment_plan_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: rent_receivable}

lifecycle:
  states: [applied, approved, denied, cancelled, active, in_default, eviction_filed, vacated, closed]
  transitions:
    - {from: applied, to: approved, by: system, means: Resident screening returned approved or approved_with_conditions and the leasing office countersigned the lease.}
    - {from: applied, to: denied, by: system, means: Resident screening returned denied or the application failed a floor plan entry gate.}
    - {from: applied, to: cancelled, by: user, means: The applicant withdrew the application before a screening decision.}
    - {from: approved, to: cancelled, by: user, means: The approved applicant withdrew before move-in and forfeited what the withdrawal rule says is forfeited.}
    - {from: approved, to: active, by: agent, means: Move-in completed, keys issued and possession began.}
    - {from: active, to: in_default, by: agent, means: A delinquency notice for unpaid rent was served and the cure period is running.}
    - {from: in_default, to: active, by: agent, means: The resident paid the full amount demanded, or signed a payment plan with its down payment, by the cure deadline.}
    - {from: in_default, to: eviction_filed, by: system, means: Eviction counsel filed the eviction case after the file was referred.}
    - {from: eviction_filed, to: active, by: agent, means: The tenancy was reinstated after the resident paid the full reinstatement amount before judgment.}
    - {from: active, to: vacated, by: system, means: Possession ended by move-out with keys returned.}
    - {from: in_default, to: vacated, by: system, means: Possession ended by move-out or abandonment while a default was open.}
    - {from: eviction_filed, to: vacated, by: system, means: Possession ended by move-out or by execution of a writ of possession.}
    - {from: vacated, to: closed, by: system, means: The final account statement was issued under the security deposit charter and the lease record was closed.}

accounts:
  - key: rent_receivable
    unit: USD
    meaning: What the leaseholder owes on the lease ledger — rent, lease fees, late fees, returned payment fees and court costs, less payments and credits; the leases.balance_due view.

parameter_schema:
  bedrooms: Number of bedrooms in the floor plan (integer; a studio is 0).
  max_occupants: Maximum persons, adults and minors, who may occupy the floor plan (integer).
  min_income_multiple: Minimum combined gross monthly income of all adult applicants, as a multiple of the monthly rent (decimal).
  min_credit_score_full_approval: Lowest screening credit score that yields an approved result without conditions (integer).
  min_credit_score_conditional: Lowest screening credit score that yields approved_with_conditions; below it the application is denied (integer).
  max_adult_applicants: Maximum adult applicants who may sign the lease for the floor plan (integer).
  min_leaseholder_age: Minimum age in full years of every leaseholder on the application date (integer years).
  application_fee_per_adult: Non-refundable screening fee charged per adult applicant at application (USD).
  admin_fee: One-time lease administration fee charged when the application is approved (USD).
  rent_due_day: Day of the calendar month on which base rent is due and posted (integer day).
  grace_period_days: Calendar days after the rent due date during which rent may be paid without a late fee (integer days).
  late_fee_initial_flat: Flat component of the initial late fee (USD); the initial fee is the greater of this and late_fee_initial_pct of monthly rent.
  late_fee_initial_pct: Percentage component of the initial late fee, applied to the monthly rent (decimal fraction).
  late_fee_daily_amount: Additional late fee charged for each calendar day after the initial late fee day that rent remains unpaid (USD per day).
  late_fee_daily_max_days: Maximum number of daily late fees for one billing period (integer days).
  late_fee_cap_pct_of_rent: Company cap on all late fees for one billing period, as a fraction of the monthly rent (decimal fraction).
  returned_payment_fee: Company returned payment fee per dishonored payment before any state cap (USD).
  certified_funds_trigger_count: Number of returned payments within the trailing 365 days that places the lease on certified funds only (integer).
  certified_funds_months: Length of a certified-funds restriction in calendar months from the date of the triggering return (integer months).
  certified_funds_methods: Payment methods accepted while a certified-funds restriction is in force (list of payment_method values).
  move_in_funds_methods: Payment methods accepted for funds due at move-in (list of payment_method values).
  proration_method: How partial-month rent is prorated (enum; actual_days_in_month divides monthly rent by the actual days of that calendar month).
  second_month_collection_day: Move-in day of month on or after which the next full month's rent is also posted at move-in (integer day).
  amenity_fee_monthly: Monthly amenity fee posted with rent (USD; 0.00 means included in rent).
  trash_valet_fee_monthly: Monthly doorstep trash valet fee posted with rent (USD; 0.00 means included in rent).
  smart_home_fee_monthly: Monthly smart home package fee (smart lock, thermostat, leak sensors) posted with rent (USD; 0.00 means included in rent).
  key_fob_replacement_fee: Charge for each lost, damaged or additional access fob (USD per fob).
  fobs_issued_at_move_in: Access fobs issued without charge at move-in (integer).
  lockout_fee_business_hours: Charge for a lockout answered 8:00-18:00 local time, Monday-Saturday (USD).
  lockout_fee_after_hours: Charge for a lockout answered at any other time (USD).
  lockouts_free_per_12_months: Lockouts answered without charge within the trailing 365 days (integer).
  lease_modification_fee: Charge for adding or removing a leaseholder or occupant mid-term (USD).
  move_in_concession_weeks: Weeks of free base rent offered as a move-in concession on the floor plan (integer weeks; 0 means none).
  concession_min_term_months: Minimum months of the initial lease term required to receive the move-in concession (integer months).
  preferred_employer_discount_pct: Monthly base rent discount for the preferred_employer program (decimal fraction of monthly rent).
  military_discount_monthly: Monthly base rent discount for the active_military program (USD per month).
  payment_plan_max_installments: Maximum installments in a payment plan after the down payment (integer).
  payment_plan_min_down_pct: Minimum down payment as a fraction of the arrears covered (decimal fraction).
  payment_plan_max_arrears_rent_multiple: Maximum arrears a payment plan may cover, as a multiple of monthly rent (decimal).
  payment_plans_per_12_months: Payment plans that may be signed within the trailing 365 days (integer).
  payment_plan_installment_interval_days: Calendar days between installments (integer days).
  payment_plan_missed_installment_grace_days: Calendar days after an installment due date before the plan is treated as defaulted (integer days).
  courtesy_waivers_per_12_months: Courtesy late fee waivers available within the trailing 365 days (integer).
  courtesy_waiver_min_tenure_months: Minimum full calendar months since move-in before a courtesy waiver is available (integer months).
  courtesy_waiver_requires_autopay: Whether a courtesy waiver requires ACH autopay to be enrolled (boolean).
  eviction_referral_min_arrears_rent_multiple: Minimum past-due rent, as a multiple of monthly rent, for an expired delinquency notice to be referred to eviction counsel (decimal).
  partial_payment_after_notice_accepted: Whether a payment smaller than the full amount demanded is accepted once a delinquency notice has been served (boolean).
  reinstatement_after_filing_allowed: Whether a tenancy may be reinstated after an eviction case is filed (boolean).
  min_liability_coverage: Minimum personal liability limit of renter's insurance required on the floor plan (USD).
  liability_program_fee_monthly: Monthly charge for enrollment in the community liability program while no qualifying proof of insurance is on file (USD).
  guest_max_consecutive_nights: Consecutive nights a guest may stay before being treated as an unauthorized occupant (integer nights).

