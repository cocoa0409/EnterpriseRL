events:
  - type: parking_license_request
    target: parking_licenses
    mutation: create
    meaning: A leaseholder requests a parking product for one vehicle and joins its waitlist.
    grain: One row per request.
    fields:
      customer_id: Leaseholder.
      lease_id: Lease the license will attach to.
      variant_name: Parking product requested.
      vehicle_plate: Vehicle to be registered.
      waitlist_date: Date the request was received.
    triggers: []
  - type: parking_assignment
    target: parking_licenses
    mutation: {transition: {from: waitlisted, to: active}}
    meaning: A space or permit is assigned and the license starts.
    grain: One row per transaction.
    fields:
      space_number: Space, carport, garage or tag assigned.
      start_date: First licensed day.
      monthly_fee: Monthly fee in force.
    triggers:
      - event: parking:parking_fee_charge
        map: {charge_code: activation_fee, charge_date: start_date}
  - type: parking_waitlist_withdrawal
    target: parking_licenses
    mutation: {transition: {from: waitlisted, to: withdrawn}}
    meaning: The resident withdraws a waitlisted request.
    grain: One row per transaction.
    fields:
      closed_date: Date withdrawn.
    triggers: []
  - type: parking_fee_charge
    target: parking_charges
    meaning: A parking fee posts — the monthly license fee, the activation fee, or a remote, tag, space swap, early cancellation or reinstatement fee.
    grain: One row per fee per month per posting date.
    distinguish_by: [charge_code, billing_period, charge_date]
    fields:
      charge_code: Fee code.
      billing_period: Month billed.
      charge_date: Posting date.
      amount: Fee after proration.
      proration_days: Days billed for a monthly fee.
      days_in_period: Days of the month for a monthly fee.
    account: parking_receivable
    direction: in
    triggers: []
  - type: parking_ev_session
    target: parking_charges
    meaning: One EV charging session is billed — its energy at the applicable rate, and any idle fee as a second line of the same session.
    grain: One row per session per charge code and rate period.
    distinguish_by: [session_reference, charge_code, rate_period]
    fields:
      charge_code: ev_charging_energy or ev_idle_fee.
      session_reference: Charging network session id.
      rate_period: on_peak or off_peak for energy lines.
      billing_period: Month of the session.
      charge_date: Session date.
      energy_kwh: Energy delivered in the rate period.
      idle_minutes: Idle minutes after charging completed.
      amount: Amount billed.
    account: parking_receivable
    direction: in
    triggers: []
  - type: parking_violation
    target: parking_activity
    meaning: A parking rule violation by the licensed vehicle (or an unlicensed vehicle of the household) is recorded with the enforcement step taken.
    grain: One row per violation observed.
    distinguish_by: [activity_date, violation_code]
    fields:
      activity_date: Date observed.
      violation_code: Rule broken.
      violation_level: warning, fine or tow.
      vehicle_plate_observed: Plate observed.
    triggers:
      - event: parking:parking_fine
        when: {violation_level: fine}
        map: {source_activity_id: activity_id, charge_date: activity_date}
  - type: parking_fine
    target: parking_charges
    meaning: The fine for one violation is billed.
    grain: One row per fined violation.
    distinguish_by: [source_activity_id]
    fields:
      charge_code: violation_fine.
      source_activity_id: The violation fined.
      billing_period: Month of the violation.
      charge_date: Posting date.
      amount: Fine.
    account: parking_receivable
    direction: in
    triggers: []
  - type: parking_guest_pass
    target: parking_activity
    meaning: A guest pass is issued for a visitor's vehicle.
    grain: One row per pass.
    distinguish_by: [activity_date, vehicle_plate_observed]
    fields:
      activity_date: First night of the pass.
      vehicle_plate_observed: Guest vehicle plate.
      pass_nights: Nights covered.
    triggers: []
  - type: parking_credit
    target: parking_charges
    meaning: A parking charge is reduced — the storage bundle discount on a monthly fee, or the reversal of a charge posted in error.
    grain: One row per credited charge per credit code.
    distinguish_by: [charge_code, source_parking_charge_id]
    fields:
      charge_code: bundle_discount or charge_reversal.
      source_parking_charge_id: The charge credited.
      billing_period: Month credited.
      charge_date: Posting date.
      amount: Credit (positive).
    account: parking_receivable
    direction: out
    triggers: []
  - type: parking_payment
    target: parking_charges
    meaning: A payment toward the parking balance is received, including the application of the security deposit at final accounting.
    grain: One row per payment transaction.
    distinguish_by: [payment_reference]
    fields:
      charge_code: payment_received.
      billing_period: Month received.
      charge_date: Date received.
      amount: Amount received.
      payment_method: Instrument used.
      payment_reference: Confirmation or instrument number.
    account: parking_receivable
    direction: out
    triggers: []
  - type: parking_vehicle_update
    target: parking_licenses
    mutation: update
    meaning: The vehicle registered on the license is replaced.
    grain: One row per transaction.
    fields:
      vehicle_plate: New plate.
    triggers: []
  - type: parking_space_swap
    target: parking_licenses
    mutation: update
    meaning: The license moves to another space of the same product, or to another product when the resident changes product.
    grain: One row per transaction.
    fields:
      space_number: New space.
      variant_name: Product after the change.
      monthly_fee: Monthly fee after the change.
    triggers:
      - event: parking:parking_fee_charge
        map: {charge_code: space_swap_fee}
  - type: parking_suspension
    target: parking_licenses
    mutation: {transition: {from: active, to: suspended}}
    meaning: Parking privileges are suspended for a past-due parking balance.
    grain: One row per transaction.
    fields:
      balance_due: Past-due balance at suspension (read, not rewritten).
    triggers: []
  - type: parking_reinstatement
    target: parking_licenses
    mutation: {transition: {from: suspended, to: active}}
    meaning: Suspended privileges are restored.
    grain: One row per transaction.
    fields:
      balance_due: Balance after the reinstating payment (read, not rewritten).
    triggers:
      - event: parking:parking_fee_charge
        map: {charge_code: reinstatement_fee}
  - type: parking_cancellation_notice
    target: parking_licenses
    mutation: {transition: {from: active, to: notice_given}}
    meaning: The resident signs a cancellation notice with an end date.
    grain: One row per transaction.
    fields:
      end_date: Last licensed day.
    triggers: []
  - type: parking_notice_withdrawal
    target: parking_licenses
    mutation: {transition: {from: notice_given, to: active}}
    meaning: A cancellation notice is withdrawn before its end date.
    grain: One row per transaction.
    fields:
      end_date: Cleared.
    triggers: []
  - type: parking_termination
    target: parking_licenses
    mutation: {transition: {from: notice_given, to: terminated}}
    meaning: The license ends on its notice end date.
    grain: One row per transaction.
    fields:
      closed_date: End date reached.
    triggers: []
  - type: parking_move_out_termination
    target: parking_licenses
    mutation: {transition: [{from: active, to: terminated}, {from: suspended, to: terminated}, {from: notice_given, to: terminated}]}
    meaning: The license ends because possession of the apartment home ended.
    grain: One row per transaction.
    fields:
      end_date: The lease's move-out date.
      closed_date: Date terminated.
    triggers: []

measures:
  - id: parking_msr_open_licenses_on_lease
    window: Current state of every parking license of the lease.
    measure: Count of parking licenses of the lease in waitlisted, active, suspended or notice_given status, in total and per parking product.
  - id: parking_msr_enforcement_12m
    window: Trailing 365 calendar days ending on and including the date of the violation being decided.
    measure: Count of parking_violation rows on the license (and on any license of the same lease for the same plate) with violation_level warning, and separately with violation_level fine, dated in the window.
  - id: parking_msr_guest_passes_month
    window: The calendar month containing the first night of the requested pass.
    measure: Count of parking_guest_pass rows on the license whose activity_date falls in that month.
  - id: parking_msr_oldest_past_due_days
    window: As of the evaluation date.
    measure: Days since the charge_date of the oldest parking charge on the license that the license's payments and credits, applied oldest first, have not fully paid.

policies:
  - id: parking_agg_multi_holding
    subject: [parking_license_request]
    rule: >-
      A lease may hold several parking licenses, one vehicle each, up to max_per_customer across all parking products and
      up to each product's max_licenses_of_tier_per_lease.
      A parking request is accepted only when the lease's open licenses (parking_msr_open_licenses_on_lease) are below both the household cap and the product's own cap, and the household cap never exceeds the lease's adult applicants plus one.
      Waitlisted requests count toward the caps.
    eligibility:
      - id: household_vehicle_cap
        applies_to: [parking_license_request]
        kind: state
        condition: "A parking request is accepted only when the lease's open licenses (parking_msr_open_licenses_on_lease) are below both the household cap and the product's own cap, and the household cap never exceeds the lease's adult applicants plus one."
        evidence_fields: [parking_licenses.lease_id, parking_licenses.status, parking_licenses.variant_name, leases.adult_applicants_count]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [parking_licenses.lease_id]
          action_bindings:
            parking_licenses.lease_id: lease_id
        state_contract:
          field: parking_licenses.status
          allowed: [waitlisted, active, suspended, notice_given]
    params:
      max_per_customer: 3
      per_tier:
        Surface Unreserved Permit: {max_licenses_of_tier_per_lease: "=max_licenses_of_tier_per_lease"}
        Surface Reserved Space: {max_licenses_of_tier_per_lease: "=max_licenses_of_tier_per_lease"}
        Covered Carport Space: {max_licenses_of_tier_per_lease: "=max_licenses_of_tier_per_lease"}
        Structured Garage Space: {max_licenses_of_tier_per_lease: "=max_licenses_of_tier_per_lease"}
        EV Charging Reserved Space: {max_licenses_of_tier_per_lease: "=max_licenses_of_tier_per_lease"}
        Private Detached Garage: {max_licenses_of_tier_per_lease: "=max_licenses_of_tier_per_lease"}
    measures: [parking_msr_open_licenses_on_lease]

  - id: parking_agg_household_pricing
    subject: [parking_fee_charge, parking_credit]
    rule: >-
      Pricing across a household's licenses is decided over the whole lease. Only the earliest-started Surface Unreserved
      Permit of a lease is included without a monthly fee when first_permit_included is true; every other license pays its
      monthly_license_fee. While the lease also holds a storage rental in active status, each Covered Carport Space,
      Structured Garage Space, EV Charging Reserved Space and Private Detached Garage license of the lease receives a
      bundle_discount credit of bundle_discount_with_storage_pct times that month's posted fee, rounded half up to the cent,
      against the monthly fee line; the discount applies to monthly fees only and never to EV charging, fines or service
      fees. The bundle discount does not stack with any other parking discount and is not posted for a month in which the
      storage rental was not active on the fee charge day.
    eligibility:
      - id: storage_active_for_bundle
        applies_to: [parking_credit]
        kind: state
        condition: "While the lease also holds a storage rental in active status, each Covered Carport Space, Structured Garage Space, EV Charging Reserved Space and Private Detached Garage license of the lease receives a bundle_discount credit of bundle_discount_with_storage_pct times that month's posted fee, rounded half up to the cent, against the monthly fee line; the discount applies to monthly fees only and never to EV charging, fines or service fees."
        evidence_fields: [storage_rentals.lease_id, storage_rentals.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [storage_rentals.lease_id]
          action_bindings:
            storage_rentals.lease_id: lease_id
        state_contract:
          field: storage_rentals.status
          allowed: [active]
    params:
      per_tier:
        Surface Unreserved Permit: {first_permit_included: "=first_permit_included", monthly_license_fee: "=monthly_license_fee", bundle_discount_with_storage_pct: "=bundle_discount_with_storage_pct"}
        Surface Reserved Space: {first_permit_included: "=first_permit_included", monthly_license_fee: "=monthly_license_fee", bundle_discount_with_storage_pct: "=bundle_discount_with_storage_pct"}
        Covered Carport Space: {first_permit_included: "=first_permit_included", monthly_license_fee: "=monthly_license_fee", bundle_discount_with_storage_pct: "=bundle_discount_with_storage_pct"}
        Structured Garage Space: {first_permit_included: "=first_permit_included", monthly_license_fee: "=monthly_license_fee", bundle_discount_with_storage_pct: "=bundle_discount_with_storage_pct"}
        EV Charging Reserved Space: {first_permit_included: "=first_permit_included", monthly_license_fee: "=monthly_license_fee", bundle_discount_with_storage_pct: "=bundle_discount_with_storage_pct"}
        Private Detached Garage: {first_permit_included: "=first_permit_included", monthly_license_fee: "=monthly_license_fee", bundle_discount_with_storage_pct: "=bundle_discount_with_storage_pct"}
    formula:
      bundle_discount: round(bundle_discount_with_storage_pct * monthly_fee, 2)

  - id: parking_evt_assignment
    subject: [parking_assignment, parking_waitlist_withdrawal, parking_license_request]
    rule: >-
      A parking license is requested and assigned only while the lease is active.
      A lease in_default or eviction_filed receives no new license and no assignment. Requests are served in
      waitlist_priority_basis order per product; when a space frees up it is offered to the earliest request, the offer
      stays open waitlist_offer_valid_days, and an offer not accepted in time passes to the next request while the lapsed
      request keeps its place for the next space. The vehicle must carry a current state registration in the name of a
      leaseholder or approved occupant when vehicle_registration_required is true, fit max_vehicle_length_ft and
      max_vehicle_height_ft, be a plug-in electric vehicle when ev_space_requires_ev is true, and be of standard size unless
      oversize_vehicle_allowed is true; motorcycles are allowed where motorcycle_allowed is true. Each license registers
      max_vehicles_per_license vehicle. The license gives a numbered space only when reserved_space is true (otherwise any
      open unreserved space), covered parking only when covered is true, and gate access only when gate_remote_included is
      true. On assignment the activation_fee posts, remotes_issued remotes are handed over, and
      the monthly fee is locked for fee_lock_months. A waitlisted request may be withdrawn at any time without charge.
    eligibility:
      - id: lease_active_for_parking
        applies_to: [parking_license_request, parking_assignment]
        kind: state
        condition: "A parking license is requested and assigned only while the lease is active."
        evidence_fields: [leases.lease_id, leases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
        state_contract:
          field: leases.status
          allowed: [active]
    params:
      per_tier:
        Surface Unreserved Permit: {waitlist_priority_basis: "=waitlist_priority_basis", waitlist_offer_valid_days: "=waitlist_offer_valid_days", vehicle_registration_required: "=vehicle_registration_required", max_vehicle_length_ft: "=max_vehicle_length_ft", max_vehicle_height_ft: "=max_vehicle_height_ft", ev_space_requires_ev: "=ev_space_requires_ev", oversize_vehicle_allowed: "=oversize_vehicle_allowed", motorcycle_allowed: "=motorcycle_allowed", max_vehicles_per_license: "=max_vehicles_per_license", activation_fee: "=activation_fee", remotes_issued: "=remotes_issued", fee_lock_months: "=fee_lock_months", reserved_space: "=reserved_space", covered: "=covered", gate_remote_included: "=gate_remote_included"}
        Surface Reserved Space: {waitlist_priority_basis: "=waitlist_priority_basis", waitlist_offer_valid_days: "=waitlist_offer_valid_days", vehicle_registration_required: "=vehicle_registration_required", max_vehicle_length_ft: "=max_vehicle_length_ft", max_vehicle_height_ft: "=max_vehicle_height_ft", ev_space_requires_ev: "=ev_space_requires_ev", oversize_vehicle_allowed: "=oversize_vehicle_allowed", motorcycle_allowed: "=motorcycle_allowed", max_vehicles_per_license: "=max_vehicles_per_license", activation_fee: "=activation_fee", remotes_issued: "=remotes_issued", fee_lock_months: "=fee_lock_months", reserved_space: "=reserved_space", covered: "=covered", gate_remote_included: "=gate_remote_included"}
        Covered Carport Space: {waitlist_priority_basis: "=waitlist_priority_basis", waitlist_offer_valid_days: "=waitlist_offer_valid_days", vehicle_registration_required: "=vehicle_registration_required", max_vehicle_length_ft: "=max_vehicle_length_ft", max_vehicle_height_ft: "=max_vehicle_height_ft", ev_space_requires_ev: "=ev_space_requires_ev", oversize_vehicle_allowed: "=oversize_vehicle_allowed", motorcycle_allowed: "=motorcycle_allowed", max_vehicles_per_license: "=max_vehicles_per_license", activation_fee: "=activation_fee", remotes_issued: "=remotes_issued", fee_lock_months: "=fee_lock_months", reserved_space: "=reserved_space", covered: "=covered", gate_remote_included: "=gate_remote_included"}
        Structured Garage Space: {waitlist_priority_basis: "=waitlist_priority_basis", waitlist_offer_valid_days: "=waitlist_offer_valid_days", vehicle_registration_required: "=vehicle_registration_required", max_vehicle_length_ft: "=max_vehicle_length_ft", max_vehicle_height_ft: "=max_vehicle_height_ft", ev_space_requires_ev: "=ev_space_requires_ev", oversize_vehicle_allowed: "=oversize_vehicle_allowed", motorcycle_allowed: "=motorcycle_allowed", max_vehicles_per_license: "=max_vehicles_per_license", activation_fee: "=activation_fee", remotes_issued: "=remotes_issued", fee_lock_months: "=fee_lock_months", reserved_space: "=reserved_space", covered: "=covered", gate_remote_included: "=gate_remote_included"}
        EV Charging Reserved Space: {waitlist_priority_basis: "=waitlist_priority_basis", waitlist_offer_valid_days: "=waitlist_offer_valid_days", vehicle_registration_required: "=vehicle_registration_required", max_vehicle_length_ft: "=max_vehicle_length_ft", max_vehicle_height_ft: "=max_vehicle_height_ft", ev_space_requires_ev: "=ev_space_requires_ev", oversize_vehicle_allowed: "=oversize_vehicle_allowed", motorcycle_allowed: "=motorcycle_allowed", max_vehicles_per_license: "=max_vehicles_per_license", activation_fee: "=activation_fee", remotes_issued: "=remotes_issued", fee_lock_months: "=fee_lock_months", reserved_space: "=reserved_space", covered: "=covered", gate_remote_included: "=gate_remote_included"}
        Private Detached Garage: {waitlist_priority_basis: "=waitlist_priority_basis", waitlist_offer_valid_days: "=waitlist_offer_valid_days", vehicle_registration_required: "=vehicle_registration_required", max_vehicle_length_ft: "=max_vehicle_length_ft", max_vehicle_height_ft: "=max_vehicle_height_ft", ev_space_requires_ev: "=ev_space_requires_ev", oversize_vehicle_allowed: "=oversize_vehicle_allowed", motorcycle_allowed: "=motorcycle_allowed", max_vehicles_per_license: "=max_vehicles_per_license", activation_fee: "=activation_fee", remotes_issued: "=remotes_issued", fee_lock_months: "=fee_lock_months", reserved_space: "=reserved_space", covered: "=covered", gate_remote_included: "=gate_remote_included"}

  - id: parking_evt_fees
    subject: [parking_fee_charge]
    rule: >-
      Parking fees post only while the license is active, suspended or notice_given.
      The monthly fee posts on fee_charge_day for each month licensed; the first and last month are prorated by licensed
      days over the actual days of the month (proration_method), rounded half up to the cent. After fee_lock_months the
      monthly fee may rise only with rate_change_notice_days written notice. A lost or additional remote is billed at
      gate_remote_fee, a replacement tag at tag_replacement_fee, a move to another space at space_swap_fee, and restoring
      suspended privileges at reinstatement_fee. A monthly fee keeps posting while the license is suspended, because
      suspension withdraws the privilege, not the license.
    eligibility:
      - id: parking_fee_status
        applies_to: [parking_fee_charge]
        kind: state
        condition: "Parking fees post only while the license is active, suspended or notice_given."
        evidence_fields: [parking_licenses.parking_license_id, parking_licenses.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [parking_licenses.parking_license_id]
          action_bindings:
            parking_licenses.parking_license_id: parking_license_id
        state_contract:
          field: parking_licenses.status
          allowed: [active, suspended, notice_given]
    params:
      per_tier:
        Surface Unreserved Permit: {fee_charge_day: "=fee_charge_day", proration_method: "=proration_method", rate_change_notice_days: "=rate_change_notice_days", gate_remote_fee: "=gate_remote_fee", tag_replacement_fee: "=tag_replacement_fee", space_swap_fee: "=space_swap_fee", reinstatement_fee: "=reinstatement_fee"}
        Surface Reserved Space: {fee_charge_day: "=fee_charge_day", proration_method: "=proration_method", rate_change_notice_days: "=rate_change_notice_days", gate_remote_fee: "=gate_remote_fee", tag_replacement_fee: "=tag_replacement_fee", space_swap_fee: "=space_swap_fee", reinstatement_fee: "=reinstatement_fee"}
        Covered Carport Space: {fee_charge_day: "=fee_charge_day", proration_method: "=proration_method", rate_change_notice_days: "=rate_change_notice_days", gate_remote_fee: "=gate_remote_fee", tag_replacement_fee: "=tag_replacement_fee", space_swap_fee: "=space_swap_fee", reinstatement_fee: "=reinstatement_fee"}
        Structured Garage Space: {fee_charge_day: "=fee_charge_day", proration_method: "=proration_method", rate_change_notice_days: "=rate_change_notice_days", gate_remote_fee: "=gate_remote_fee", tag_replacement_fee: "=tag_replacement_fee", space_swap_fee: "=space_swap_fee", reinstatement_fee: "=reinstatement_fee"}
        EV Charging Reserved Space: {fee_charge_day: "=fee_charge_day", proration_method: "=proration_method", rate_change_notice_days: "=rate_change_notice_days", gate_remote_fee: "=gate_remote_fee", tag_replacement_fee: "=tag_replacement_fee", space_swap_fee: "=space_swap_fee", reinstatement_fee: "=reinstatement_fee"}
        Private Detached Garage: {fee_charge_day: "=fee_charge_day", proration_method: "=proration_method", rate_change_notice_days: "=rate_change_notice_days", gate_remote_fee: "=gate_remote_fee", tag_replacement_fee: "=tag_replacement_fee", space_swap_fee: "=space_swap_fee", reinstatement_fee: "=reinstatement_fee"}
    formula:
      prorated_fee: round(monthly_fee * proration_days / days_in_period, 2)

  - id: parking_evt_ev_charging
    subject: [parking_ev_session]
    rule: >-
      EV charging is billed only while the license is active or notice_given.
      On an EV Charging Reserved Space the dedicated charger bills energy at ev_rate_on_peak_per_kwh for energy delivered
      07:00-21:00 local time and ev_rate_off_peak_per_kwh otherwise, one line per rate period of the session. Any other
      licensee may use the community's shared chargers at shared_charger_rate_per_kwh with no time-of-use split, for at most
      ev_session_max_hours per session. When a vehicle stays plugged in more than ev_idle_grace_minutes after charging
      completes, an idle fee of ev_idle_fee_per_hour per started hour after the grace period is billed as a separate line;
      idle fees apply to shared and dedicated chargers alike. Energy amounts are rounded half up to the cent per line.
    eligibility:
      - id: ev_status
        applies_to: [parking_ev_session]
        kind: state
        condition: "EV charging is billed only while the license is active or notice_given."
        evidence_fields: [parking_licenses.parking_license_id, parking_licenses.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [parking_licenses.parking_license_id]
          action_bindings:
            parking_licenses.parking_license_id: parking_license_id
        state_contract:
          field: parking_licenses.status
          allowed: [active, notice_given]
    params:
      per_tier:
        Surface Unreserved Permit: {ev_charging_included: "=ev_charging_included", ev_rate_on_peak_per_kwh: "=ev_rate_on_peak_per_kwh", ev_rate_off_peak_per_kwh: "=ev_rate_off_peak_per_kwh", shared_charger_rate_per_kwh: "=shared_charger_rate_per_kwh", ev_idle_grace_minutes: "=ev_idle_grace_minutes", ev_idle_fee_per_hour: "=ev_idle_fee_per_hour", ev_session_max_hours: "=ev_session_max_hours"}
        Surface Reserved Space: {ev_charging_included: "=ev_charging_included", ev_rate_on_peak_per_kwh: "=ev_rate_on_peak_per_kwh", ev_rate_off_peak_per_kwh: "=ev_rate_off_peak_per_kwh", shared_charger_rate_per_kwh: "=shared_charger_rate_per_kwh", ev_idle_grace_minutes: "=ev_idle_grace_minutes", ev_idle_fee_per_hour: "=ev_idle_fee_per_hour", ev_session_max_hours: "=ev_session_max_hours"}
        Covered Carport Space: {ev_charging_included: "=ev_charging_included", ev_rate_on_peak_per_kwh: "=ev_rate_on_peak_per_kwh", ev_rate_off_peak_per_kwh: "=ev_rate_off_peak_per_kwh", shared_charger_rate_per_kwh: "=shared_charger_rate_per_kwh", ev_idle_grace_minutes: "=ev_idle_grace_minutes", ev_idle_fee_per_hour: "=ev_idle_fee_per_hour", ev_session_max_hours: "=ev_session_max_hours"}
        Structured Garage Space: {ev_charging_included: "=ev_charging_included", ev_rate_on_peak_per_kwh: "=ev_rate_on_peak_per_kwh", ev_rate_off_peak_per_kwh: "=ev_rate_off_peak_per_kwh", shared_charger_rate_per_kwh: "=shared_charger_rate_per_kwh", ev_idle_grace_minutes: "=ev_idle_grace_minutes", ev_idle_fee_per_hour: "=ev_idle_fee_per_hour", ev_session_max_hours: "=ev_session_max_hours"}
        EV Charging Reserved Space: {ev_charging_included: "=ev_charging_included", ev_rate_on_peak_per_kwh: "=ev_rate_on_peak_per_kwh", ev_rate_off_peak_per_kwh: "=ev_rate_off_peak_per_kwh", shared_charger_rate_per_kwh: "=shared_charger_rate_per_kwh", ev_idle_grace_minutes: "=ev_idle_grace_minutes", ev_idle_fee_per_hour: "=ev_idle_fee_per_hour", ev_session_max_hours: "=ev_session_max_hours"}
        Private Detached Garage: {ev_charging_included: "=ev_charging_included", ev_rate_on_peak_per_kwh: "=ev_rate_on_peak_per_kwh", ev_rate_off_peak_per_kwh: "=ev_rate_off_peak_per_kwh", shared_charger_rate_per_kwh: "=shared_charger_rate_per_kwh", ev_idle_grace_minutes: "=ev_idle_grace_minutes", ev_idle_fee_per_hour: "=ev_idle_fee_per_hour", ev_session_max_hours: "=ev_session_max_hours"}
    formula:
      on_peak_energy_charge: round(energy_kwh * ev_rate_on_peak_per_kwh, 2)
      off_peak_energy_charge: round(energy_kwh * ev_rate_off_peak_per_kwh, 2)

  - id: parking_evt_enforcement
    subject: [parking_violation, parking_fine]
    rule: >-
      Enforcement escalates per plate over the trailing 365 days (parking_msr_enforcement_12m). A violation whose code is in
      tow_immediate_codes is towed on its first occurrence. Any other violation is a warning while fewer than
      warnings_before_fine warnings are on record, then a fine of violation_fine_amount while fewer than fines_before_tow
      fines are on record, and then a tow. An inoperable or abandoned vehicle (unmoved for abandoned_vehicle_days) is towed
      only after a notice has been posted on it for tow_notice_hours. Storing household items in a space is a wrong_space
      violation unless storage_in_space_allowed is true. Tow and storage charges are billed by the towing company to the
      vehicle owner and never appear on a Larkspur ledger.
      Only one fine is billed for a given violation.
    eligibility:
      - id: one_fine_per_violation
        applies_to: [parking_fine]
        kind: dedup
        condition: "Only one fine is billed for a given violation."
        evidence_fields: [parking_charges.source_activity_id, parking_charges.charge_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [parking_charges.source_activity_id]
          action_bindings:
            parking_charges.source_activity_id: source_activity_id
        dedup_contract:
          table: parking_charges
          mode: separate_record
          object_bindings: {source_activity_id: source_activity_id}
          duplicate_filters: {charge_code: [violation_fine]}
          distinct_fields: []
    params:
      per_tier:
        Surface Unreserved Permit: {warnings_before_fine: "=warnings_before_fine", violation_fine_amount: "=violation_fine_amount", fines_before_tow: "=fines_before_tow", tow_immediate_codes: "=tow_immediate_codes", tow_notice_hours: "=tow_notice_hours", abandoned_vehicle_days: "=abandoned_vehicle_days", storage_in_space_allowed: "=storage_in_space_allowed"}
        Surface Reserved Space: {warnings_before_fine: "=warnings_before_fine", violation_fine_amount: "=violation_fine_amount", fines_before_tow: "=fines_before_tow", tow_immediate_codes: "=tow_immediate_codes", tow_notice_hours: "=tow_notice_hours", abandoned_vehicle_days: "=abandoned_vehicle_days", storage_in_space_allowed: "=storage_in_space_allowed"}
        Covered Carport Space: {warnings_before_fine: "=warnings_before_fine", violation_fine_amount: "=violation_fine_amount", fines_before_tow: "=fines_before_tow", tow_immediate_codes: "=tow_immediate_codes", tow_notice_hours: "=tow_notice_hours", abandoned_vehicle_days: "=abandoned_vehicle_days", storage_in_space_allowed: "=storage_in_space_allowed"}
        Structured Garage Space: {warnings_before_fine: "=warnings_before_fine", violation_fine_amount: "=violation_fine_amount", fines_before_tow: "=fines_before_tow", tow_immediate_codes: "=tow_immediate_codes", tow_notice_hours: "=tow_notice_hours", abandoned_vehicle_days: "=abandoned_vehicle_days", storage_in_space_allowed: "=storage_in_space_allowed"}
        EV Charging Reserved Space: {warnings_before_fine: "=warnings_before_fine", violation_fine_amount: "=violation_fine_amount", fines_before_tow: "=fines_before_tow", tow_immediate_codes: "=tow_immediate_codes", tow_notice_hours: "=tow_notice_hours", abandoned_vehicle_days: "=abandoned_vehicle_days", storage_in_space_allowed: "=storage_in_space_allowed"}
        Private Detached Garage: {warnings_before_fine: "=warnings_before_fine", violation_fine_amount: "=violation_fine_amount", fines_before_tow: "=fines_before_tow", tow_immediate_codes: "=tow_immediate_codes", tow_notice_hours: "=tow_notice_hours", abandoned_vehicle_days: "=abandoned_vehicle_days", storage_in_space_allowed: "=storage_in_space_allowed"}
    measures: [parking_msr_enforcement_12m]

  - id: parking_evt_guest_passes
    subject: [parking_guest_pass]
    rule: >-
      A guest pass is issued only to a license holder whose license is active.
      Passes are limited to guest_passes_per_month per license per calendar month (parking_msr_guest_passes_month), each
      covering at most guest_pass_max_consecutive_nights consecutive nights; unused passes do not carry over. A guest vehicle
      staying longer must be registered on a license of its own, and a guest who stays long enough to become an
      unauthorized occupant under the lease charter cannot be covered by passes.
    eligibility:
      - id: pass_license_active
        applies_to: [parking_guest_pass]
        kind: state
        condition: "A guest pass is issued only to a license holder whose license is active."
        evidence_fields: [parking_licenses.parking_license_id, parking_licenses.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [parking_licenses.parking_license_id]
          action_bindings:
            parking_licenses.parking_license_id: parking_license_id
        state_contract:
          field: parking_licenses.status
          allowed: [active]
    params:
      per_tier:
        Surface Unreserved Permit: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_max_consecutive_nights: "=guest_pass_max_consecutive_nights"}
        Surface Reserved Space: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_max_consecutive_nights: "=guest_pass_max_consecutive_nights"}
        Covered Carport Space: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_max_consecutive_nights: "=guest_pass_max_consecutive_nights"}
        Structured Garage Space: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_max_consecutive_nights: "=guest_pass_max_consecutive_nights"}
        EV Charging Reserved Space: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_max_consecutive_nights: "=guest_pass_max_consecutive_nights"}
        Private Detached Garage: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_max_consecutive_nights: "=guest_pass_max_consecutive_nights"}
    measures: [parking_msr_guest_passes_month]

  - id: parking_suspension_rule
    subject: [parking_suspension, parking_reinstatement]
    rule: >-
      Privileges are suspended when parking_msr_oldest_past_due_days exceeds suspension_delinquency_days; the vehicle may
      no longer use the space, remote or charger, and it is towed under the enforcement rule if it does. Privileges are
      restored only after the whole parking balance and the reinstatement_fee are paid. Suspension is limited to parking:
      it never touches the lease, and a lease delinquency never suspends parking by itself.
    eligibility: []
    params:
      per_tier:
        Surface Unreserved Permit: {suspension_delinquency_days: "=suspension_delinquency_days", reinstatement_fee: "=reinstatement_fee"}
        Surface Reserved Space: {suspension_delinquency_days: "=suspension_delinquency_days", reinstatement_fee: "=reinstatement_fee"}
        Covered Carport Space: {suspension_delinquency_days: "=suspension_delinquency_days", reinstatement_fee: "=reinstatement_fee"}
        Structured Garage Space: {suspension_delinquency_days: "=suspension_delinquency_days", reinstatement_fee: "=reinstatement_fee"}
        EV Charging Reserved Space: {suspension_delinquency_days: "=suspension_delinquency_days", reinstatement_fee: "=reinstatement_fee"}
        Private Detached Garage: {suspension_delinquency_days: "=suspension_delinquency_days", reinstatement_fee: "=reinstatement_fee"}
    measures: [parking_msr_oldest_past_due_days]

  - id: parking_cancellation_rule
    subject: [parking_cancellation_notice, parking_notice_withdrawal, parking_termination, parking_move_out_termination]
    rule: >-
      A resident cancels a license by signing a cancellation notice; the end date must be at least cancellation_notice_days
      calendar days after the notice date, and a Surface Unreserved Permit may end on any date. When the end date falls
      before start_date plus min_commitment_months, an early_cancellation_fee of early_cancellation_fee_months times the
      monthly fee is billed with the notice. A lease_coterminous license cannot be cancelled on its own before the lease
      term ends except on the same terms. A notice may be withdrawn until its end date while the space has not been
      offered to the waitlist. Every license ends on the lease's move-out date without notice or early cancellation fee,
      and a license carries over to the new apartment home on an in-community transfer when transfer_on_unit_transfer is
      true. The balance left on a terminated license is carried into the final account statement.
    eligibility: []
    params:
      per_tier:
        Surface Unreserved Permit: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_cancellation_fee_months: "=early_cancellation_fee_months", license_term_basis: "=license_term_basis", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
        Surface Reserved Space: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_cancellation_fee_months: "=early_cancellation_fee_months", license_term_basis: "=license_term_basis", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
        Covered Carport Space: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_cancellation_fee_months: "=early_cancellation_fee_months", license_term_basis: "=license_term_basis", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
        Structured Garage Space: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_cancellation_fee_months: "=early_cancellation_fee_months", license_term_basis: "=license_term_basis", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
        EV Charging Reserved Space: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_cancellation_fee_months: "=early_cancellation_fee_months", license_term_basis: "=license_term_basis", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
        Private Detached Garage: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_cancellation_fee_months: "=early_cancellation_fee_months", license_term_basis: "=license_term_basis", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
    formula:
      early_cancellation_fee: round(early_cancellation_fee_months * monthly_fee, 2)

  - id: parking_evt_payments_and_changes
    subject: [parking_payment, parking_vehicle_update, parking_space_swap]
    rule: >-
      Parking payments are accepted while the license is active, suspended, notice_given or terminated.
      A payment is applied to the oldest open parking charge first, and deposit_application is used only at final
      accounting. A replacement vehicle is registered only under the same vehicle rules as at assignment. A move to another
      space of the same product bills space_swap_fee; a change of product is a new request for that product, joining its
      waitlist, and the old license ends when the new one starts.
    eligibility:
      - id: parking_payment_status
        applies_to: [parking_payment]
        kind: state
        condition: "Parking payments are accepted while the license is active, suspended, notice_given or terminated."
        evidence_fields: [parking_licenses.parking_license_id, parking_licenses.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [parking_licenses.parking_license_id]
          action_bindings:
            parking_licenses.parking_license_id: parking_license_id
        state_contract:
          field: parking_licenses.status
          allowed: [active, suspended, notice_given, terminated]
    params:
      per_tier:
        Surface Unreserved Permit: {space_swap_fee: "=space_swap_fee"}
        Surface Reserved Space: {space_swap_fee: "=space_swap_fee"}
        Covered Carport Space: {space_swap_fee: "=space_swap_fee"}
        Structured Garage Space: {space_swap_fee: "=space_swap_fee"}
        EV Charging Reserved Space: {space_swap_fee: "=space_swap_fee"}
        Private Detached Garage: {space_swap_fee: "=space_swap_fee"}
