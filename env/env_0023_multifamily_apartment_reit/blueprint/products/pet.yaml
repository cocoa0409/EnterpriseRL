# Pet Addendum — the addendum under which a household keeps a pet, or the registration of an assistance animal
# approved as a reasonable accommodation. One holding = one animal.
category: pet
display_name: Pet Addendum

binding:
  holding_table: pet_addenda
  event_tables: [pet_charges, pet_incidents]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: pet_receivable}

lifecycle:
  states: [pending_approval, active, denied, ended]
  transitions:
    - {from: pending_approval, to: active, by: agent, means: The registration is approved on complete documents and the addendum is signed.}
    - {from: pending_approval, to: denied, by: agent, means: The animal does not meet the addendum's restrictions or the documents were not provided in time.}
    - {from: active, to: ended, by: user, means: The resident removes the animal from the apartment home permanently, voluntarily or after a removal notice.}
    - {from: active, to: ended, by: system, means: The addendum ends because possession of the apartment home ended.}

accounts:
  - key: pet_receivable
    unit: USD
    meaning: What the leaseholder owes on the pet addendum — pet fees, pet rent and pet fines, less credits and payments; the pet_addenda.balance_due view.

parameter_schema:
  fees_apply: Whether pet fees, pet deposit and pet rent apply at all (boolean; false for an assistance animal).
  pet_fee_one_time: Non-refundable pet fee charged at approval (USD).
  pet_deposit: Refundable pet deposit added to the security deposit account at approval (USD).
  monthly_pet_rent: Monthly pet rent (USD per month).
  pet_rent_charge_day: Day of the month pet rent posts (integer day).
  pet_rent_proration: Whether pet rent is prorated for a partial first or last month (boolean).
  pet_rent_lock_months: Months pet rent is held after approval (integer months).
  pet_rent_increase_notice_days: Calendar days of written notice before a pet rent increase after the lock (integer days).
  additional_pet_rent_discount_pct: Discount on the monthly pet rent of each pet after the first on the lease (decimal fraction).
  species_allowed: Species the addendum covers (list of species values).
  min_weight_lbs: Lowest adult weight in the weight class (pounds; 0 means no minimum).
  max_weight_lbs: Highest adult weight in the weight class (pounds; 0 means no limit).
  weight_verification: Evidence of weight (enum; vet_record_within_12_months or not_required).
  breed_restrictions_apply: Whether the restricted breed list applies (boolean).
  restricted_breeds: Breeds, and mixes predominantly of them, that are not accepted (list).
  max_pets_of_tier_per_lease: Animals of this addendum type one lease may register (integer; 0 means no cap).
  min_pet_age_months: Minimum age of the animal at registration (integer months).
  tank_max_gallons: Largest aquarium or terrarium accepted (gallons; 0 when not applicable).
  caged_animals_per_addendum: Caged animals one addendum covers when kept in one enclosure (integer).
  vaccination_required: Whether current vaccinations must be on file (boolean).
  rabies_certificate_required: Whether a current rabies certificate must be on file (boolean).
  local_license_required: Whether a city or county animal license must be on file (boolean).
  spay_neuter_required: Whether the animal must be spayed or neutered once older than six months (boolean).
  dna_registration_required: Whether a waste DNA sample must be registered (boolean).
  dna_registration_fee: One-time waste DNA registration fee (USD).
  animal_liability_coverage_required: Minimum liability coverage for animal-caused injury on the resident's renter's insurance (USD).
  pet_photo_required: Whether a current photo of the animal must be on file (boolean).
  documentation_basis: What documents establish eligibility (enum; veterinary_records or disability_related_need).
  approval_business_days: Business days within which a complete registration is decided (integer days).
  annual_document_renewal: Whether vaccination and license documents must be renewed on file before they expire (boolean).
  document_renewal_grace_days: Calendar days after a document expires before it is treated as missing (integer days).
  leash_required: Whether the animal must be leashed or carried in common areas (boolean).
  common_area_access: Whether the animal may use common areas other than dedicated pet areas (boolean).
  dog_park_access: Whether the community dog park may be used (boolean).
  pet_spa_access: Whether the pet wash station may be used (boolean).
  guest_pet_allowed: Whether a visiting animal of the same type may stay (boolean).
  guest_pet_max_days: Days a visiting animal may stay (integer days).
  waste_warnings_before_fine: Warnings for waste not collected before fines start, within the trailing 365 days (integer).
  waste_fine_amount: Fine per waste incident after the warnings (USD).
  off_leash_fine_amount: Fine per off-leash incident after the warnings (USD).
  noise_warnings_before_notice: Noise warnings within the trailing 365 days before a removal notice (integer).
  incidents_before_removal_notice: Fined incidents within the trailing 365 days after which a removal notice is issued (integer).
  aggressive_incident_immediate_removal: Whether a bite or aggressive incident leads directly to a removal notice (boolean).
  removal_notice_days: Calendar days a removal notice gives to remove the animal (integer days).
  unauthorized_pet_fee: One-time fee when an animal is found living in the apartment home without an approved addendum (USD).
  unauthorized_pet_cure_days: Calendar days to register or remove an unauthorized animal (integer days).
  move_out_flea_treatment_fee: Flea treatment charge at move-out for a household with a dog or cat (USD).
  pet_fee_refundable: Whether the one-time pet fee is refundable (boolean).
  transfer_on_unit_transfer: Whether the addendum carries over on an in-community transfer (boolean).

