  - id: pet_evt_payments_updates_end
    subject: [pet_payment, pet_credit, pet_record_update, pet_addendum_end]
    rule: >-
      Pet payments are accepted while the addendum is active or ended.
      A payment is applied to the oldest open pet charge first, and deposit_application is used only at final accounting. A
      charge_reversal credits a pet charge posted against this charter, once per charge. Where annual_document_renewal is
      true, renewed vaccination and license documents must be on file before the recorded expiry; a document missing more
      than document_renewal_grace_days after expiry is recorded as an incident warning and the dog park and pet spa privileges
      are withheld until it is on file. Every addendum ends on the lease's move-out date, and it carries over on an
      in-community transfer when transfer_on_unit_transfer is true.
    eligibility:
      - id: pet_payment_status
        applies_to: [pet_payment]
        kind: state
        condition: "Pet payments are accepted while the addendum is active or ended."
        evidence_fields: [pet_addenda.pet_addendum_id, pet_addenda.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pet_addenda.pet_addendum_id]
          action_bindings:
            pet_addenda.pet_addendum_id: pet_addendum_id
        state_contract:
          field: pet_addenda.status
          allowed: [active, ended]
    params:
      per_tier:
        Assistance Animal Accommodation: {annual_document_renewal: "=annual_document_renewal", document_renewal_grace_days: "=document_renewal_grace_days", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
        Caged Pet Addendum: {annual_document_renewal: "=annual_document_renewal", document_renewal_grace_days: "=document_renewal_grace_days", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
        Cat Addendum: {annual_document_renewal: "=annual_document_renewal", document_renewal_grace_days: "=document_renewal_grace_days", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
        Small Dog Addendum (under 25 lb): {annual_document_renewal: "=annual_document_renewal", document_renewal_grace_days: "=document_renewal_grace_days", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
        Medium Dog Addendum (25-49 lb): {annual_document_renewal: "=annual_document_renewal", document_renewal_grace_days: "=document_renewal_grace_days", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
        Large Dog Addendum (50-90 lb): {annual_document_renewal: "=annual_document_renewal", document_renewal_grace_days: "=document_renewal_grace_days", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
