  - id: pet_assistance_animal_accommodation
    subject: [pet_approval, pet_denial, pet_fee_charge, pet_rent_charge]
    rule: >-
      An assistance animal is registered under the Assistance Animal Accommodation as a reasonable accommodation, not as a
      pet. When the disability or the disability-related need is not obvious, reliable documentation of the need
      (documentation_basis) may be requested, but never a diagnosis, medical records or a certificate of training. No pet
      fee, pet deposit, pet rent, DNA fee, flea treatment, breed, weight, species or pet-count restriction applies
      (fees_apply is false). An accommodation may be denied only when the specific animal poses a direct threat to others
      that cannot be reduced by another accommodation, or would cause substantial physical damage to others' property; that
      decision is made by the community's fair housing coordinator. The resident remains responsible for damage the
      animal causes, charged at move-out under the security deposit charter, and for the leash and waste rules of the
      Assistance Animal Accommodation. Whether a request qualifies is decided only by the fair housing coordinator on the documents recorded; resident services never decides it.
    eligibility:
      - id: coordinator_decision
        applies_to: [pet_approval, pet_denial]
        kind: authorization
        condition: "Whether a request qualifies is decided only by the fair housing coordinator on the documents recorded; resident services never decides it."
        evidence_fields: [pet_addenda.pet_addendum_id, pet_addenda.animal_type, pet_addenda.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pet_addenda.pet_addendum_id]
          action_bindings:
            pet_addenda.pet_addendum_id: pet_addendum_id
    params:
      per_tier:
        Assistance Animal Accommodation: {fees_apply: "=fees_apply", documentation_basis: "=documentation_basis"}
        Caged Pet Addendum: {fees_apply: "=fees_apply", documentation_basis: "=documentation_basis"}
        Cat Addendum: {fees_apply: "=fees_apply", documentation_basis: "=documentation_basis"}
        Small Dog Addendum (under 25 lb): {fees_apply: "=fees_apply", documentation_basis: "=documentation_basis"}
        Medium Dog Addendum (25-49 lb): {fees_apply: "=fees_apply", documentation_basis: "=documentation_basis"}
        Large Dog Addendum (50-90 lb): {fees_apply: "=fees_apply", documentation_basis: "=documentation_basis"}

  - id: pet_evt_fees_and_rent
    subject: [pet_fee_charge, pet_rent_charge]
    rule: >-
      Pet charges post only while the addendum is active or ended.
      Only the move-out flea treatment and charges for days before the end date may post once the addendum has ended.
      At approval the pet_fee_one_time posts (it is never refundable, pet_fee_refundable) and the pet_deposit is added to the
      security deposit account as an additional pet deposit; the dna_registration_fee posts with the DNA sample where
      dna_registration_required is true. Pet rent posts on pet_rent_charge_day for each month the pet is approved; the
      approval month and the end month are prorated by days over the actual days of the month when pet_rent_proration is
      true, otherwise the approval month is free and the end month is billed in full. After pet_rent_lock_months pet rent may
      rise only with pet_rent_increase_notice_days written notice. When the addendum of a dog or cat ends at move-out, the
      move_out_flea_treatment_fee of its addendum type posts; a fee of 0.00 posts no line.
    eligibility:
      - id: pet_charge_status
        applies_to: [pet_fee_charge, pet_rent_charge]
        kind: state
        condition: "Pet charges post only while the addendum is active or ended."
        evidence_fields: [pet_addenda.pet_addendum_id, pet_addenda.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pet_addenda.pet_addendum_id]
          action_bindings:
            pet_addenda.pet_addendum_id: pet_addendum_id
        state_contract:
          field: pet_addenda.status
          allowed: [active, ended]
    params:
      per_tier:
        Assistance Animal Accommodation: {pet_fee_one_time: "=pet_fee_one_time", pet_deposit: "=pet_deposit", dna_registration_fee: "=dna_registration_fee", monthly_pet_rent: "=monthly_pet_rent", pet_rent_charge_day: "=pet_rent_charge_day", pet_rent_proration: "=pet_rent_proration", pet_rent_lock_months: "=pet_rent_lock_months", pet_rent_increase_notice_days: "=pet_rent_increase_notice_days", move_out_flea_treatment_fee: "=move_out_flea_treatment_fee", pet_fee_refundable: "=pet_fee_refundable"}
        Caged Pet Addendum: {pet_fee_one_time: "=pet_fee_one_time", pet_deposit: "=pet_deposit", dna_registration_fee: "=dna_registration_fee", monthly_pet_rent: "=monthly_pet_rent", pet_rent_charge_day: "=pet_rent_charge_day", pet_rent_proration: "=pet_rent_proration", pet_rent_lock_months: "=pet_rent_lock_months", pet_rent_increase_notice_days: "=pet_rent_increase_notice_days", move_out_flea_treatment_fee: "=move_out_flea_treatment_fee", pet_fee_refundable: "=pet_fee_refundable"}
        Cat Addendum: {pet_fee_one_time: "=pet_fee_one_time", pet_deposit: "=pet_deposit", dna_registration_fee: "=dna_registration_fee", monthly_pet_rent: "=monthly_pet_rent", pet_rent_charge_day: "=pet_rent_charge_day", pet_rent_proration: "=pet_rent_proration", pet_rent_lock_months: "=pet_rent_lock_months", pet_rent_increase_notice_days: "=pet_rent_increase_notice_days", move_out_flea_treatment_fee: "=move_out_flea_treatment_fee", pet_fee_refundable: "=pet_fee_refundable"}
        Small Dog Addendum (under 25 lb): {pet_fee_one_time: "=pet_fee_one_time", pet_deposit: "=pet_deposit", dna_registration_fee: "=dna_registration_fee", monthly_pet_rent: "=monthly_pet_rent", pet_rent_charge_day: "=pet_rent_charge_day", pet_rent_proration: "=pet_rent_proration", pet_rent_lock_months: "=pet_rent_lock_months", pet_rent_increase_notice_days: "=pet_rent_increase_notice_days", move_out_flea_treatment_fee: "=move_out_flea_treatment_fee", pet_fee_refundable: "=pet_fee_refundable"}
        Medium Dog Addendum (25-49 lb): {pet_fee_one_time: "=pet_fee_one_time", pet_deposit: "=pet_deposit", dna_registration_fee: "=dna_registration_fee", monthly_pet_rent: "=monthly_pet_rent", pet_rent_charge_day: "=pet_rent_charge_day", pet_rent_proration: "=pet_rent_proration", pet_rent_lock_months: "=pet_rent_lock_months", pet_rent_increase_notice_days: "=pet_rent_increase_notice_days", move_out_flea_treatment_fee: "=move_out_flea_treatment_fee", pet_fee_refundable: "=pet_fee_refundable"}
        Large Dog Addendum (50-90 lb): {pet_fee_one_time: "=pet_fee_one_time", pet_deposit: "=pet_deposit", dna_registration_fee: "=dna_registration_fee", monthly_pet_rent: "=monthly_pet_rent", pet_rent_charge_day: "=pet_rent_charge_day", pet_rent_proration: "=pet_rent_proration", pet_rent_lock_months: "=pet_rent_lock_months", pet_rent_increase_notice_days: "=pet_rent_increase_notice_days", move_out_flea_treatment_fee: "=move_out_flea_treatment_fee", pet_fee_refundable: "=pet_fee_refundable"}
    formula:
      prorated_pet_rent: round(monthly_pet_rent * proration_days / days_in_period, 2)

  - id: pet_evt_incidents
    subject: [pet_incident, pet_fine, pet_removal]
    rule: >-
      Incidents escalate per addendum over the trailing 365 days (pet_msr_incidents_12m). Waste not collected is a warning
      while fewer than waste_warnings_before_fine warnings are on record and a fine of waste_fine_amount afterwards;
      off-leash incidents follow the same warning count with off_leash_fine_amount. A fine amount of 0.00 means the incident
      is recorded as a warning only. Noise complaints lead to a removal notice once noise_warnings_before_notice warnings
      are on record; a removal notice also follows when incidents_before_removal_notice fined incidents are on record, and
      immediately after a bite or aggressive incident when aggressive_incident_immediate_removal is true. A removal notice
      gives removal_notice_days calendar days to remove the animal; the resident's removal ends the addendum and stops pet
      rent from the following charge day. For an assistance animal a removal notice issues only through the direct-threat
      decision of the fair housing coordinator. Only one fine is billed for a given incident.
    eligibility:
      - id: one_fine_per_incident
        applies_to: [pet_fine]
        kind: dedup
        condition: "Only one fine is billed for a given incident."
        evidence_fields: [pet_charges.source_incident_id, pet_charges.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pet_charges.source_incident_id]
          action_bindings:
            pet_charges.source_incident_id: source_incident_id
        dedup_contract:
          table: pet_charges
          mode: separate_record
          object_bindings: {source_incident_id: source_incident_id}
          duplicate_filters: {event_type: [pet_fine]}
          distinct_fields: []
    params:
      per_tier:
        Assistance Animal Accommodation: {waste_warnings_before_fine: "=waste_warnings_before_fine", waste_fine_amount: "=waste_fine_amount", off_leash_fine_amount: "=off_leash_fine_amount", noise_warnings_before_notice: "=noise_warnings_before_notice", incidents_before_removal_notice: "=incidents_before_removal_notice", aggressive_incident_immediate_removal: "=aggressive_incident_immediate_removal", removal_notice_days: "=removal_notice_days", leash_required: "=leash_required", common_area_access: "=common_area_access", dog_park_access: "=dog_park_access", pet_spa_access: "=pet_spa_access"}
        Caged Pet Addendum: {waste_warnings_before_fine: "=waste_warnings_before_fine", waste_fine_amount: "=waste_fine_amount", off_leash_fine_amount: "=off_leash_fine_amount", noise_warnings_before_notice: "=noise_warnings_before_notice", incidents_before_removal_notice: "=incidents_before_removal_notice", aggressive_incident_immediate_removal: "=aggressive_incident_immediate_removal", removal_notice_days: "=removal_notice_days", leash_required: "=leash_required", common_area_access: "=common_area_access", dog_park_access: "=dog_park_access", pet_spa_access: "=pet_spa_access"}
        Cat Addendum: {waste_warnings_before_fine: "=waste_warnings_before_fine", waste_fine_amount: "=waste_fine_amount", off_leash_fine_amount: "=off_leash_fine_amount", noise_warnings_before_notice: "=noise_warnings_before_notice", incidents_before_removal_notice: "=incidents_before_removal_notice", aggressive_incident_immediate_removal: "=aggressive_incident_immediate_removal", removal_notice_days: "=removal_notice_days", leash_required: "=leash_required", common_area_access: "=common_area_access", dog_park_access: "=dog_park_access", pet_spa_access: "=pet_spa_access"}
        Small Dog Addendum (under 25 lb): {waste_warnings_before_fine: "=waste_warnings_before_fine", waste_fine_amount: "=waste_fine_amount", off_leash_fine_amount: "=off_leash_fine_amount", noise_warnings_before_notice: "=noise_warnings_before_notice", incidents_before_removal_notice: "=incidents_before_removal_notice", aggressive_incident_immediate_removal: "=aggressive_incident_immediate_removal", removal_notice_days: "=removal_notice_days", leash_required: "=leash_required", common_area_access: "=common_area_access", dog_park_access: "=dog_park_access", pet_spa_access: "=pet_spa_access"}
        Medium Dog Addendum (25-49 lb): {waste_warnings_before_fine: "=waste_warnings_before_fine", waste_fine_amount: "=waste_fine_amount", off_leash_fine_amount: "=off_leash_fine_amount", noise_warnings_before_notice: "=noise_warnings_before_notice", incidents_before_removal_notice: "=incidents_before_removal_notice", aggressive_incident_immediate_removal: "=aggressive_incident_immediate_removal", removal_notice_days: "=removal_notice_days", leash_required: "=leash_required", common_area_access: "=common_area_access", dog_park_access: "=dog_park_access", pet_spa_access: "=pet_spa_access"}
        Large Dog Addendum (50-90 lb): {waste_warnings_before_fine: "=waste_warnings_before_fine", waste_fine_amount: "=waste_fine_amount", off_leash_fine_amount: "=off_leash_fine_amount", noise_warnings_before_notice: "=noise_warnings_before_notice", incidents_before_removal_notice: "=incidents_before_removal_notice", aggressive_incident_immediate_removal: "=aggressive_incident_immediate_removal", removal_notice_days: "=removal_notice_days", leash_required: "=leash_required", common_area_access: "=common_area_access", dog_park_access: "=dog_park_access", pet_spa_access: "=pet_spa_access"}
    measures: [pet_msr_incidents_12m]

  - id: pet_unauthorized_animal
    subject: [pet_fee_charge, pet_registration]
    rule: >-
      An animal found living in the apartment home without an approved addendum is recorded as an unregistered_animal
      incident; the resident has unauthorized_pet_cure_days calendar days to register it or remove it. The
      unauthorized_pet_fee of the addendum type the animal would fall under posts once per animal when the incident is
      recorded, and when it is then registered its pet rent is billed back to the incident date. A visiting animal is not
      unauthorized while guest_pet_allowed is true and it stays no more than guest_pet_max_days. An assistance animal is
      never charged an unauthorized pet fee; it is invited to register as an accommodation.
    eligibility: []
    params:
      per_tier:
        Assistance Animal Accommodation: {unauthorized_pet_fee: "=unauthorized_pet_fee", unauthorized_pet_cure_days: "=unauthorized_pet_cure_days", guest_pet_allowed: "=guest_pet_allowed", guest_pet_max_days: "=guest_pet_max_days"}
        Caged Pet Addendum: {unauthorized_pet_fee: "=unauthorized_pet_fee", unauthorized_pet_cure_days: "=unauthorized_pet_cure_days", guest_pet_allowed: "=guest_pet_allowed", guest_pet_max_days: "=guest_pet_max_days"}
        Cat Addendum: {unauthorized_pet_fee: "=unauthorized_pet_fee", unauthorized_pet_cure_days: "=unauthorized_pet_cure_days", guest_pet_allowed: "=guest_pet_allowed", guest_pet_max_days: "=guest_pet_max_days"}
        Small Dog Addendum (under 25 lb): {unauthorized_pet_fee: "=unauthorized_pet_fee", unauthorized_pet_cure_days: "=unauthorized_pet_cure_days", guest_pet_allowed: "=guest_pet_allowed", guest_pet_max_days: "=guest_pet_max_days"}
