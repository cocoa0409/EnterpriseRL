  - id: pet_agg_household_pet_rent
    subject: [pet_rent_charge, pet_credit]
    rule: >-
      Pet rent is set across the household. The pet approved earliest (by approval_date) pays the full monthly_pet_rent of
      its addendum type; every later pet of the lease receives an additional_pet_discount credit of
      additional_pet_rent_discount_pct of its own monthly pet rent, rounded half up to the cent, against each pet rent line.
      When the earliest pet's addendum ends, the next-earliest becomes the first pet from the following charge day. Assistance
      animals pay no pet rent and never count as the first pet.
    eligibility: []
    params:
      per_tier:
        Assistance Animal Accommodation: {monthly_pet_rent: "=monthly_pet_rent", additional_pet_rent_discount_pct: "=additional_pet_rent_discount_pct"}
        Caged Pet Addendum: {monthly_pet_rent: "=monthly_pet_rent", additional_pet_rent_discount_pct: "=additional_pet_rent_discount_pct"}
        Cat Addendum: {monthly_pet_rent: "=monthly_pet_rent", additional_pet_rent_discount_pct: "=additional_pet_rent_discount_pct"}
        Small Dog Addendum (under 25 lb): {monthly_pet_rent: "=monthly_pet_rent", additional_pet_rent_discount_pct: "=additional_pet_rent_discount_pct"}
        Medium Dog Addendum (25-49 lb): {monthly_pet_rent: "=monthly_pet_rent", additional_pet_rent_discount_pct: "=additional_pet_rent_discount_pct"}
        Large Dog Addendum (50-90 lb): {monthly_pet_rent: "=monthly_pet_rent", additional_pet_rent_discount_pct: "=additional_pet_rent_discount_pct"}
    formula:
      additional_pet_discount: round(additional_pet_rent_discount_pct * monthly_pet_rent, 2)
    measures: [pet_msr_pets_on_lease]

  - id: pet_evt_registration_approval
    subject: [pet_registration, pet_approval, pet_denial]
    rule: >-
      An animal is registered only on a lease that is approved or active.
      A pet is approved only on the documents recorded against its registration — the veterinary record for species, breed,
      weight and age, and the vaccination, rabies, license, spay or neuter and DNA records the addendum type requires — never
      on the resident's description.
      The species must be in species_allowed, the weight within min_weight_lbs and max_weight_lbs (verified per
      weight_verification), the age at least min_pet_age_months, and, where breed_restrictions_apply is true, the breed not in
      restricted_breeds nor predominantly a mix of them. A caged pet addendum covers up to caged_animals_per_addendum animals
      in one enclosure and aquariums up to tank_max_gallons. The resident's renter's insurance must carry
      animal_liability_coverage_required for dogs. A complete registration is decided within approval_business_days
      business days; one still incomplete after that is denied and may be submitted again. The addendum type follows the
      animal: a dog whose recorded weight moves into another weight class is moved to that addendum type at its next
      document renewal.
    eligibility:
      - id: pet_lease_status
        applies_to: [pet_registration]
        kind: state
        condition: "An animal is registered only on a lease that is approved or active."
        evidence_fields: [leases.lease_id, leases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
        state_contract:
          field: leases.status
          allowed: [approved, active]
      - id: pet_documents
        applies_to: [pet_approval, pet_denial]
        kind: authorization
        condition: "A pet is approved only on the documents recorded against its registration — the veterinary record for species, breed, weight and age, and the vaccination, rabies, license, spay or neuter and DNA records the addendum type requires — never on the resident's description."
        evidence_fields: [pet_addenda.pet_addendum_id, pet_addenda.species, pet_addenda.breed, pet_addenda.weight_lbs, pet_addenda.vaccination_expiry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [pet_addenda.pet_addendum_id]
          action_bindings:
            pet_addenda.pet_addendum_id: pet_addendum_id
    params:
      per_tier:
        Assistance Animal Accommodation: {species_allowed: "=species_allowed", min_weight_lbs: "=min_weight_lbs", max_weight_lbs: "=max_weight_lbs", weight_verification: "=weight_verification", breed_restrictions_apply: "=breed_restrictions_apply", restricted_breeds: "=restricted_breeds", min_pet_age_months: "=min_pet_age_months", caged_animals_per_addendum: "=caged_animals_per_addendum", tank_max_gallons: "=tank_max_gallons", vaccination_required: "=vaccination_required", rabies_certificate_required: "=rabies_certificate_required", local_license_required: "=local_license_required", spay_neuter_required: "=spay_neuter_required", dna_registration_required: "=dna_registration_required", animal_liability_coverage_required: "=animal_liability_coverage_required", pet_photo_required: "=pet_photo_required", approval_business_days: "=approval_business_days"}
        Caged Pet Addendum: {species_allowed: "=species_allowed", min_weight_lbs: "=min_weight_lbs", max_weight_lbs: "=max_weight_lbs", weight_verification: "=weight_verification", breed_restrictions_apply: "=breed_restrictions_apply", restricted_breeds: "=restricted_breeds", min_pet_age_months: "=min_pet_age_months", caged_animals_per_addendum: "=caged_animals_per_addendum", tank_max_gallons: "=tank_max_gallons", vaccination_required: "=vaccination_required", rabies_certificate_required: "=rabies_certificate_required", local_license_required: "=local_license_required", spay_neuter_required: "=spay_neuter_required", dna_registration_required: "=dna_registration_required", animal_liability_coverage_required: "=animal_liability_coverage_required", pet_photo_required: "=pet_photo_required", approval_business_days: "=approval_business_days"}
        Cat Addendum: {species_allowed: "=species_allowed", min_weight_lbs: "=min_weight_lbs", max_weight_lbs: "=max_weight_lbs", weight_verification: "=weight_verification", breed_restrictions_apply: "=breed_restrictions_apply", restricted_breeds: "=restricted_breeds", min_pet_age_months: "=min_pet_age_months", caged_animals_per_addendum: "=caged_animals_per_addendum", tank_max_gallons: "=tank_max_gallons", vaccination_required: "=vaccination_required", rabies_certificate_required: "=rabies_certificate_required", local_license_required: "=local_license_required", spay_neuter_required: "=spay_neuter_required", dna_registration_required: "=dna_registration_required", animal_liability_coverage_required: "=animal_liability_coverage_required", pet_photo_required: "=pet_photo_required", approval_business_days: "=approval_business_days"}
        Small Dog Addendum (under 25 lb): {species_allowed: "=species_allowed", min_weight_lbs: "=min_weight_lbs", max_weight_lbs: "=max_weight_lbs", weight_verification: "=weight_verification", breed_restrictions_apply: "=breed_restrictions_apply", restricted_breeds: "=restricted_breeds", min_pet_age_months: "=min_pet_age_months", caged_animals_per_addendum: "=caged_animals_per_addendum", tank_max_gallons: "=tank_max_gallons", vaccination_required: "=vaccination_required", rabies_certificate_required: "=rabies_certificate_required", local_license_required: "=local_license_required", spay_neuter_required: "=spay_neuter_required", dna_registration_required: "=dna_registration_required", animal_liability_coverage_required: "=animal_liability_coverage_required", pet_photo_required: "=pet_photo_required", approval_business_days: "=approval_business_days"}
        Medium Dog Addendum (25-49 lb): {species_allowed: "=species_allowed", min_weight_lbs: "=min_weight_lbs", max_weight_lbs: "=max_weight_lbs", weight_verification: "=weight_verification", breed_restrictions_apply: "=breed_restrictions_apply", restricted_breeds: "=restricted_breeds", min_pet_age_months: "=min_pet_age_months", caged_animals_per_addendum: "=caged_animals_per_addendum", tank_max_gallons: "=tank_max_gallons", vaccination_required: "=vaccination_required", rabies_certificate_required: "=rabies_certificate_required", local_license_required: "=local_license_required", spay_neuter_required: "=spay_neuter_required", dna_registration_required: "=dna_registration_required", animal_liability_coverage_required: "=animal_liability_coverage_required", pet_photo_required: "=pet_photo_required", approval_business_days: "=approval_business_days"}
