events:
  - type: pet_registration
    target: pet_addenda
    mutation: create
    meaning: A leaseholder registers an animal — a pet under a pet addendum, or an assistance animal as a reasonable accommodation request.
    grain: One row per animal.
    fields:
      customer_id: Leaseholder responsible.
      lease_id: Lease the animal lives under.
      variant_name: Addendum type.
      animal_type: pet or assistance_animal.
      pet_name: Animal's name.
      species: Species.
      breed: Breed from the veterinary record.
      weight_lbs: Adult weight from the veterinary record.
      vaccination_expiry_date: Expiry of the vaccination on file.
      registration_date: Date submitted.
    triggers: []
  - type: pet_approval
    target: pet_addenda
    mutation: {transition: {from: pending_approval, to: active}}
    meaning: The registration is approved and the addendum signed; the animal may live in the apartment home.
    grain: One row per transaction.
    fields:
      approval_date: Date approved.
      animal_type: Pet or assistance animal (read, not rewritten).
    triggers:
      - event: pet:pet_fee_charge
        when: {animal_type: pet}
        map: {charge_code: pet_fee, charge_date: approval_date}
      - event: deposit:deposit_funding
        when: {animal_type: pet}
        map: {line_category: additional_pet_deposit, transaction_date: approval_date}
  - type: pet_denial
    target: pet_addenda
    mutation: {transition: {from: pending_approval, to: denied}}
    meaning: The registration is denied.
    grain: One row per transaction.
    fields:
      closed_date: Date denied.
    triggers: []
  - type: pet_fee_charge
    target: pet_charges
    meaning: A pet fee posts — the one-time pet fee, the DNA registration fee, the unauthorized pet fee or the move-out flea treatment.
    grain: One row per fee code per addendum.
    distinguish_by: [charge_code, charge_date]
    fields:
      charge_code: Fee code.
      billing_period: Month of the fee.
      charge_date: Posting date.
      amount: Fee.
    account: pet_receivable
    direction: in
    triggers: []
  - type: pet_rent_charge
    target: pet_charges
    meaning: Monthly pet rent posts, in full or prorated.
    grain: One row per rent line per month.
    distinguish_by: [charge_code, billing_period]
    fields:
      charge_code: monthly_pet_rent or prorated_pet_rent.
      billing_period: Month billed.
      charge_date: Posting date.
      amount: Pet rent posted.
      proration_days: Days billed.
      days_in_period: Days of the month.
    account: pet_receivable
    direction: in
    triggers: []
  - type: pet_incident
    target: pet_incidents
    meaning: An incident involving the animal is recorded with the enforcement step taken.
    grain: One row per incident.
    distinguish_by: [incident_date, incident_type]
    fields:
      incident_date: Date observed.
      incident_type: What happened.
      incident_level: warning, fine or removal_notice.
    triggers:
      - event: pet:pet_fine
        when: {incident_level: fine}
        map: {source_incident_id: incident_id, charge_date: incident_date}
  - type: pet_fine
    target: pet_charges
    meaning: The fine for one pet incident is billed.
    grain: One row per fined incident.
    distinguish_by: [source_incident_id]
    fields:
      charge_code: waste_fine or off_leash_fine.
      source_incident_id: The incident fined.
      billing_period: Month of the incident.
      charge_date: Posting date.
      amount: Fine.
    account: pet_receivable
    direction: in
    triggers: []
  - type: pet_credit
    target: pet_charges
    meaning: A pet charge is reduced — the additional-pet rent discount or the reversal of a charge posted in error.
    grain: One row per credited charge per credit code.
    distinguish_by: [charge_code, source_pet_charge_id]
    fields:
      charge_code: additional_pet_discount or charge_reversal.
      source_pet_charge_id: The charge credited.
      billing_period: Month credited.
      charge_date: Posting date.
      amount: Credit (positive).
    account: pet_receivable
    direction: out
    triggers: []
  - type: pet_payment
    target: pet_charges
    meaning: A payment toward the pet balance is received, including the application of the security deposit at final accounting.
    grain: One row per payment transaction.
    distinguish_by: [payment_reference]
    fields:
      charge_code: payment_received.
      billing_period: Month received.
      charge_date: Date received.
      amount: Amount received.
      payment_method: Instrument used.
      payment_reference: Confirmation or instrument number.
    account: pet_receivable
    direction: out
    triggers: []
  - type: pet_record_update
    target: pet_addenda
    mutation: update
    meaning: Renewed vaccination documents or an updated veterinary weight are recorded.
    grain: One row per transaction.
    fields:
      vaccination_expiry_date: New vaccination expiry.
      weight_lbs: Updated adult weight.
    triggers: []
  - type: pet_removal
    target: pet_addenda
    mutation: {transition: {from: active, to: ended}}
    meaning: The resident permanently removes the animal from the apartment home.
    grain: One row per transaction.
    fields:
      end_date: Date the animal left.
      closed_date: Date recorded.
    triggers: []
  - type: pet_addendum_end
    target: pet_addenda
    mutation: {transition: {from: active, to: ended}}
    meaning: The addendum ends because possession of the apartment home ended.
    grain: One row per transaction.
    fields:
      end_date: The lease's move-out date.
      closed_date: Date ended.
    triggers:
      - event: pet:pet_fee_charge
        map: {charge_code: move_out_flea_treatment, charge_date: end_date}

measures:
  - id: pet_msr_pets_on_lease
    window: Current state of every pet addendum of the lease.
    measure: Count of addenda of the lease in pending_approval or active status with animal_type pet, in total and per addendum type, ordered by approval_date (earliest first).
  - id: pet_msr_incidents_12m
    window: Trailing 365 calendar days ending on and including the date of the incident being decided.
    measure: Count of pet_incident rows on the addendum per incident_type and incident_level dated in the window.

policies:
  - id: pet_agg_multi_holding
    subject: [pet_registration]
    rule: >-
      A household may keep at most max_per_customer pets across all pet addendum types, and no more of one type than its
      max_pets_of_tier_per_lease; pending registrations count (pet_msr_pets_on_lease).
      A pet is registered only when the lease's pets in pending_approval or active status are below the household cap and below the cap of the pet's addendum type.
      Assistance animals are not pets: they never count toward either cap and are never refused because of one.
    eligibility:
      - id: pet_caps
        applies_to: [pet_registration]
        kind: state
        condition: "A pet is registered only when the lease's pets in pending_approval or active status are below the household cap and below the cap of the pet's addendum type."
        evidence_fields: [pet_addenda.lease_id, pet_addenda.status, pet_addenda.variant_name, pet_addenda.animal_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
