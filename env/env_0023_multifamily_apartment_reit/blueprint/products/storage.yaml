# Storage Rental — an on-site bike locker, storage closet or storage unit rented month to month as an add-on
# to a lease. One holding = one storage rental.
category: storage
display_name: Storage Rental

binding:
  holding_table: storage_rentals
  event_tables: [storage_charges]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: storage_receivable}

lifecycle:
  states: [reserved, active, overlocked, notice_given, vacated, cancelled]
  transitions:
    - {from: reserved, to: active, by: agent, means: The resident signs the storage addendum at move-in to the unit and receives access.}
    - {from: reserved, to: cancelled, by: user, means: The resident cancels the reservation before move-in to the unit.}
    - {from: active, to: overlocked, by: agent, means: The unit is overlocked for a past-due storage balance.}
    - {from: overlocked, to: active, by: agent, means: The past-due balance and overlock fee are paid and the overlock is removed.}
    - {from: active, to: notice_given, by: user, means: The resident signs a notice to vacate the storage unit.}
    - {from: notice_given, to: active, by: agent, means: The storage notice is withdrawn before its end date.}
    - {from: notice_given, to: vacated, by: system, means: The storage unit is emptied and returned on the notice end date.}
    - {from: active, to: vacated, by: system, means: The rental ends because possession of the apartment home ended.}
    - {from: overlocked, to: vacated, by: system, means: An overlocked rental ends because possession of the apartment home ended.}

accounts:
  - key: storage_receivable
    unit: USD
    meaning: What the leaseholder owes on the storage rental — storage rent and storage fees, less credits and payments; the storage_rentals.balance_due view.

parameter_schema:
  monthly_rent: Standard monthly rent of the storage product (USD per month).
  unit_width_ft: Interior width of the unit (feet).
  unit_depth_ft: Interior depth of the unit (feet).
  square_feet: Floor area of the unit (square feet).
  ceiling_height_ft: Interior clear height of the unit (feet).
  climate_controlled: Whether temperature is held between 55 and 80 degrees Fahrenheit (boolean).
  interior_access: Whether the unit opens onto an interior corridor rather than a garage aisle or exterior (boolean).
  door_type: Door of the unit (enum; mesh_locker, swing_door, roll_up_door).
  floor_level: Where the unit is (enum; bike_room, garage_level, interior_corridor).
  electrical_outlet: Whether the unit has a 120-volt outlet (boolean).
  shelving_included: Whether fixed shelving is installed (boolean).
  bike_capacity: Bicycles the locker holds (integer; 0 when not a bike locker).
  max_floor_load_lbs_per_sqft: Maximum floor load (pounds per square foot).
  reservation_fee: Fee to reserve a unit (USD).
  reservation_hold_days: Calendar days a reserved unit is held for move-in (integer days).
  reservation_fee_credited: Whether the reservation fee is credited against the first month's rent at move-in (boolean).
  lock_provided: Whether Larkspur supplies the lock (boolean).
  lock_fee: Charge for a Larkspur-supplied disc lock (USD; 0.00 when none is sold).
  key_replacement_fee: Charge for a replacement key to a Larkspur-supplied lock (USD).
  access_hours: Hours the storage area is open (enum; 06:00-22:00 or 24_hours).
  access_card_included: Whether a storage access card is issued without charge (boolean).
  access_card_fee: Charge per lost or additional storage access card (USD).
  max_rentals_of_tier_per_lease: Maximum rentals of this product one lease may hold (integer).
  waitlist_allowed: Whether requests are waitlisted when no unit is free (boolean).
  min_rental_months: Minimum rented months before a notice may end the rental without an early termination fee (integer months).
  notice_days: Calendar days of written notice required to end the rental (integer days).
  early_termination_fee_months: Early termination fee in months of rent when the end date falls inside the minimum rental (decimal).
  prepay_months_for_discount: Months of rent that must be prepaid together to earn the prepay discount (integer months; 0 means no prepay discount).
  prepay_discount_pct: Discount on prepaid months (decimal fraction).
  first_month_promo_pct: Promotional discount on the first full month's rent (decimal fraction).
  promo_min_months: Minimum rental months committed to receive the first-month promotion (integer months).
  overlock_delinquency_days: Days a storage charge may stay past due before the unit is overlocked (integer days).
  overlock_fee: Fee for placing and removing an overlock (USD).
  cleanout_fee: Fee when the unit is not left empty and broom-clean at the end of the rental (USD).
  contents_removal_days_after_vacate: Calendar days after the end date that contents left behind are held before removal (integer days).
  unit_change_fee: Fee to move to a different storage unit or product (USD).
  proration_method: How first and last month rent is prorated (enum; actual_days_in_month).
  final_month_proration: Whether the last month's rent is prorated to the end date (boolean).
  rent_charge_day: Day of the month storage rent posts (integer day).
  rate_lock_months: Months the monthly rent is held after the rental starts (integer months).
  rate_change_notice_days: Calendar days of written notice before a rent increase after the rate lock (integer days).
  insurance_required: Whether contents must be covered by the resident's renter's insurance (boolean).
  min_contents_coverage: Minimum personal property coverage required for stored contents (USD).
  prohibited_items: Items that may never be stored (list).
  hazardous_materials_allowed: Whether fuel, propane or other hazardous materials may be stored (boolean).
  motorized_vehicle_allowed: Whether a motorcycle, scooter or other motorized vehicle may be stored (boolean).
  move_in_inspection_required: Whether a move-in condition check of the unit is signed (boolean).
  transfer_on_unit_transfer: Whether the rental carries over on an in-community transfer (boolean).

