events:
  - type: storage_reservation
    target: storage_rentals
    mutation: create
    meaning: A leaseholder reserves a specific storage unit or locker.
    grain: One row per reservation.
    fields:
      customer_id: Leaseholder.
      lease_id: Lease the rental attaches to.
      variant_name: Storage product.
      unit_label: Unit reserved.
      reserved_date: Date reserved.
      monthly_rent: Monthly rent quoted.
    triggers:
      - event: storage:storage_fee_charge
        map: {charge_code: reservation_fee, charge_date: reserved_date}
  - type: storage_move_in
    target: storage_rentals
    mutation: {transition: {from: reserved, to: active}}
    meaning: The resident signs the storage addendum and moves into the unit.
    grain: One row per transaction.
    fields:
      start_date: First rented day.
    triggers:
      - event: storage:storage_rent_charge
        map: {charge_code: prorated_rent, charge_date: start_date}
  - type: storage_reservation_cancel
    target: storage_rentals
    mutation: {transition: {from: reserved, to: cancelled}}
    meaning: A reservation is cancelled by the resident, or lapses after the hold period.
    grain: One row per transaction.
    fields:
      closed_date: Date cancelled.
    triggers: []
  - type: storage_rent_charge
    target: storage_charges
    meaning: Storage rent for one month posts, in full or prorated.
    grain: One row per rent line per month.
    distinguish_by: [charge_code, billing_period]
    fields:
      charge_code: monthly_rent or prorated_rent.
      billing_period: Month billed.
      charge_date: Posting date.
      amount: Rent posted.
      proration_days: Days billed.
      days_in_period: Days of the month.
    account: storage_receivable
    direction: in
    triggers: []
  - type: storage_fee_charge
    target: storage_charges
    meaning: A storage fee posts — reservation, lock, access card, key, overlock, cleanout, unit change or early termination.
    grain: One row per fee per posting date.
    distinguish_by: [charge_code, charge_date]
    fields:
      charge_code: Fee code.
      billing_period: Month of the fee.
      charge_date: Posting date.
      amount: Fee.
    account: storage_receivable
    direction: in
    triggers: []
  - type: storage_credit
    target: storage_charges
    meaning: A storage charge is reduced — the reservation fee credited at move-in, the first-month promotion, the prepay discount, or a reversal of a charge posted in error.
    grain: One row per credited charge per credit code.
    distinguish_by: [charge_code, source_storage_charge_id]
    fields:
      charge_code: reservation_credit, promotional_credit, prepay_discount or charge_reversal.
      source_storage_charge_id: The charge credited.
      billing_period: Month credited.
      charge_date: Posting date.
      amount: Credit (positive).
    account: storage_receivable
    direction: out
    triggers: []
  - type: storage_payment
    target: storage_charges
    meaning: A payment toward the storage balance is received, including the application of the security deposit at final accounting.
    grain: One row per payment transaction.
    distinguish_by: [payment_reference]
    fields:
      charge_code: payment_received.
      billing_period: Month received.
      charge_date: Date received.
      amount: Amount received.
      payment_method: Instrument used.
      payment_reference: Confirmation or instrument number.
    account: storage_receivable
    direction: out
    triggers: []
  - type: storage_overlock
    target: storage_rentals
    mutation: {transition: {from: active, to: overlocked}}
    meaning: The unit is overlocked for a past-due storage balance.
    grain: One row per transaction.
    fields:
      balance_due: Past-due balance at overlock (read, not rewritten).
    triggers:
      - event: storage:storage_fee_charge
        map: {charge_code: overlock_fee}
  - type: storage_overlock_release
    target: storage_rentals
    mutation: {transition: {from: overlocked, to: active}}
    meaning: The overlock is removed after the past-due balance and overlock fee are paid.
    grain: One row per transaction.
    fields:
      balance_due: Balance after payment (read, not rewritten).
    triggers: []
  - type: storage_notice
    target: storage_rentals
    mutation: {transition: {from: active, to: notice_given}}
    meaning: The resident signs a notice to vacate the storage unit.
    grain: One row per transaction.
    fields:
      end_date: Last rented day.
    triggers: []
  - type: storage_notice_withdrawal
    target: storage_rentals
    mutation: {transition: {from: notice_given, to: active}}
    meaning: A storage notice is withdrawn before its end date.
    grain: One row per transaction.
    fields:
      end_date: Cleared.
    triggers: []
  - type: storage_vacate
    target: storage_rentals
    mutation: {transition: {from: notice_given, to: vacated}}
    meaning: The unit is returned on the notice end date.
    grain: One row per transaction.
    fields:
      closed_date: Date returned.
    triggers: []
  - type: storage_move_out_termination
    target: storage_rentals
    mutation: {transition: [{from: active, to: vacated}, {from: overlocked, to: vacated}, {from: notice_given, to: vacated}]}
    meaning: The rental ends because possession of the apartment home ended.
    grain: One row per transaction.
    fields:
      end_date: The lease's move-out date.
      closed_date: Date ended.
    triggers: []
  - type: storage_unit_change
    target: storage_rentals
    mutation: update
    meaning: The rental moves to another storage unit or product.
    grain: One row per transaction.
    fields:
      unit_label: New unit.
      variant_name: Product after the change.
      monthly_rent: Rent after the change.
    triggers:
      - event: storage:storage_fee_charge
        map: {charge_code: unit_change_fee}

measures:
  - id: storage_msr_lease_square_feet
    window: Current state of every storage rental of the lease.
    measure: Sum of the product square_feet over the lease's storage rentals in reserved, active, overlocked or notice_given status, and their count per product.
  - id: storage_msr_oldest_past_due_days
    window: As of the evaluation date.
    measure: Days since the charge_date of the oldest storage charge on the rental not fully paid by its payments and credits applied oldest first.

policies:
  - id: storage_agg_multi_holding
    subject: [storage_reservation]
    rule: >-
      A lease may hold up to max_per_customer storage rentals across all storage products and up to each product's
      max_rentals_of_tier_per_lease, and their combined square_feet (storage_msr_lease_square_feet) may not exceed
      max_total_square_feet_per_lease. Reserved rentals count toward every cap.
      A storage reservation is made only while the lease is active.
    eligibility:
      - id: storage_lease_active
        applies_to: [storage_reservation]
        kind: state
        condition: "A storage reservation is made only while the lease is active."
        evidence_fields: [leases.lease_id, leases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
        state_contract:
          field: leases.status
          allowed: [active]
    params:
      max_per_customer: 2
      max_total_square_feet_per_lease: 125
      per_tier:
        Bike Storage Locker: {max_rentals_of_tier_per_lease: "=max_rentals_of_tier_per_lease", square_feet: "=square_feet"}
        Small Storage Closet (4x4): {max_rentals_of_tier_per_lease: "=max_rentals_of_tier_per_lease", square_feet: "=square_feet"}
        Standard Storage Unit (5x5): {max_rentals_of_tier_per_lease: "=max_rentals_of_tier_per_lease", square_feet: "=square_feet"}
        Large Storage Unit (5x10): {max_rentals_of_tier_per_lease: "=max_rentals_of_tier_per_lease", square_feet: "=square_feet"}
        Climate-Controlled Storage Unit (5x10): {max_rentals_of_tier_per_lease: "=max_rentals_of_tier_per_lease", square_feet: "=square_feet"}
        Oversized Storage Suite (10x10): {max_rentals_of_tier_per_lease: "=max_rentals_of_tier_per_lease", square_feet: "=square_feet"}
    measures: [storage_msr_lease_square_feet]

  - id: storage_agg_household_bundle
    subject: [storage_reservation, storage_move_in]
    rule: >-
      A storage rental is priced on its own, but an active storage rental on a lease earns the lease's covered and garage
      parking licenses the bundle discount set in the parking charter; ending or overlocking the last active storage rental
      ends that discount from the next parking fee charge day. The Oversized Storage Suite (10x10) is available only to a
      lease whose floor plan has at least two bedrooms (its entry gate).
    eligibility: []

  - id: storage_evt_reservation_and_move_in
    subject: [storage_reservation, storage_move_in, storage_reservation_cancel]
    rule: >-
      A reservation holds the unit for reservation_hold_days calendar days after the reserved date and posts the
      reservation_fee; a reservation not moved into by then lapses and is cancelled, and the fee is not refunded. At move-in
      the resident signs the storage addendum (and a move-in condition check when move_in_inspection_required is true), the
      first month posts prorated by rented days, and the reservation fee is credited against it when reservation_fee_credited
      is true. Where lock_provided is true Larkspur fits a lock (billing lock_fee when it is not 0.00); otherwise the resident
      supplies a disc lock. Contents must be insured for at least min_contents_coverage when insurance_required is true.
      Each product is rented as described by its catalogue — unit_width_ft by unit_depth_ft with ceiling_height_ft of clear
      height, climate_controlled or not, reached from an interior corridor when interior_access is true, behind its door_type
      at its floor_level, with an electrical_outlet and shelving only where the product says so, up to bike_capacity bicycles
      in a bike locker and no more than max_floor_load_lbs_per_sqft of floor load — and is open during access_hours with an
      access card issued when access_card_included is true. When no unit of the requested product is free the request is
      waitlisted where waitlist_allowed is true and otherwise declined.
    eligibility: []
    params:
      per_tier:
        Bike Storage Locker: {reservation_fee: "=reservation_fee", reservation_hold_days: "=reservation_hold_days", reservation_fee_credited: "=reservation_fee_credited", lock_provided: "=lock_provided", lock_fee: "=lock_fee", move_in_inspection_required: "=move_in_inspection_required", insurance_required: "=insurance_required", min_contents_coverage: "=min_contents_coverage", unit_width_ft: "=unit_width_ft", unit_depth_ft: "=unit_depth_ft", ceiling_height_ft: "=ceiling_height_ft", climate_controlled: "=climate_controlled", interior_access: "=interior_access", door_type: "=door_type", floor_level: "=floor_level", electrical_outlet: "=electrical_outlet", shelving_included: "=shelving_included", bike_capacity: "=bike_capacity", max_floor_load_lbs_per_sqft: "=max_floor_load_lbs_per_sqft", access_hours: "=access_hours", access_card_included: "=access_card_included", waitlist_allowed: "=waitlist_allowed"}
        Small Storage Closet (4x4): {reservation_fee: "=reservation_fee", reservation_hold_days: "=reservation_hold_days", reservation_fee_credited: "=reservation_fee_credited", lock_provided: "=lock_provided", lock_fee: "=lock_fee", move_in_inspection_required: "=move_in_inspection_required", insurance_required: "=insurance_required", min_contents_coverage: "=min_contents_coverage", unit_width_ft: "=unit_width_ft", unit_depth_ft: "=unit_depth_ft", ceiling_height_ft: "=ceiling_height_ft", climate_controlled: "=climate_controlled", interior_access: "=interior_access", door_type: "=door_type", floor_level: "=floor_level", electrical_outlet: "=electrical_outlet", shelving_included: "=shelving_included", bike_capacity: "=bike_capacity", max_floor_load_lbs_per_sqft: "=max_floor_load_lbs_per_sqft", access_hours: "=access_hours", access_card_included: "=access_card_included", waitlist_allowed: "=waitlist_allowed"}
        Standard Storage Unit (5x5): {reservation_fee: "=reservation_fee", reservation_hold_days: "=reservation_hold_days", reservation_fee_credited: "=reservation_fee_credited", lock_provided: "=lock_provided", lock_fee: "=lock_fee", move_in_inspection_required: "=move_in_inspection_required", insurance_required: "=insurance_required", min_contents_coverage: "=min_contents_coverage", unit_width_ft: "=unit_width_ft", unit_depth_ft: "=unit_depth_ft", ceiling_height_ft: "=ceiling_height_ft", climate_controlled: "=climate_controlled", interior_access: "=interior_access", door_type: "=door_type", floor_level: "=floor_level", electrical_outlet: "=electrical_outlet", shelving_included: "=shelving_included", bike_capacity: "=bike_capacity", max_floor_load_lbs_per_sqft: "=max_floor_load_lbs_per_sqft", access_hours: "=access_hours", access_card_included: "=access_card_included", waitlist_allowed: "=waitlist_allowed"}
        Large Storage Unit (5x10): {reservation_fee: "=reservation_fee", reservation_hold_days: "=reservation_hold_days", reservation_fee_credited: "=reservation_fee_credited", lock_provided: "=lock_provided", lock_fee: "=lock_fee", move_in_inspection_required: "=move_in_inspection_required", insurance_required: "=insurance_required", min_contents_coverage: "=min_contents_coverage", unit_width_ft: "=unit_width_ft", unit_depth_ft: "=unit_depth_ft", ceiling_height_ft: "=ceiling_height_ft", climate_controlled: "=climate_controlled", interior_access: "=interior_access", door_type: "=door_type", floor_level: "=floor_level", electrical_outlet: "=electrical_outlet", shelving_included: "=shelving_included", bike_capacity: "=bike_capacity", max_floor_load_lbs_per_sqft: "=max_floor_load_lbs_per_sqft", access_hours: "=access_hours", access_card_included: "=access_card_included", waitlist_allowed: "=waitlist_allowed"}
