  - id: storage_evt_rent
    subject: [storage_rent_charge]
    rule: >-
      Storage rent posts only while the rental is active, overlocked or notice_given.
      Rent posts on rent_charge_day for each month rented; the first month is prorated by rented days over the actual days
      of the month (proration_method), and the last month is prorated to the end date only when final_month_proration is
      true, otherwise billed in full. After rate_lock_months the rent may rise only with rate_change_notice_days written
      notice. An overlocked unit keeps accruing rent.
    eligibility:
      - id: storage_rent_status
        applies_to: [storage_rent_charge]
        kind: state
        condition: "Storage rent posts only while the rental is active, overlocked or notice_given."
        evidence_fields: [storage_rentals.storage_rental_id, storage_rentals.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [storage_rentals.storage_rental_id]
          action_bindings:
            storage_rentals.storage_rental_id: storage_rental_id
        state_contract:
          field: storage_rentals.status
          allowed: [active, overlocked, notice_given]
    params:
      per_tier:
        Bike Storage Locker: {monthly_rent: "=monthly_rent", rent_charge_day: "=rent_charge_day", proration_method: "=proration_method", final_month_proration: "=final_month_proration", rate_lock_months: "=rate_lock_months", rate_change_notice_days: "=rate_change_notice_days"}
        Small Storage Closet (4x4): {monthly_rent: "=monthly_rent", rent_charge_day: "=rent_charge_day", proration_method: "=proration_method", final_month_proration: "=final_month_proration", rate_lock_months: "=rate_lock_months", rate_change_notice_days: "=rate_change_notice_days"}
        Standard Storage Unit (5x5): {monthly_rent: "=monthly_rent", rent_charge_day: "=rent_charge_day", proration_method: "=proration_method", final_month_proration: "=final_month_proration", rate_lock_months: "=rate_lock_months", rate_change_notice_days: "=rate_change_notice_days"}
        Large Storage Unit (5x10): {monthly_rent: "=monthly_rent", rent_charge_day: "=rent_charge_day", proration_method: "=proration_method", final_month_proration: "=final_month_proration", rate_lock_months: "=rate_lock_months", rate_change_notice_days: "=rate_change_notice_days"}
        Climate-Controlled Storage Unit (5x10): {monthly_rent: "=monthly_rent", rent_charge_day: "=rent_charge_day", proration_method: "=proration_method", final_month_proration: "=final_month_proration", rate_lock_months: "=rate_lock_months", rate_change_notice_days: "=rate_change_notice_days"}
        Oversized Storage Suite (10x10): {monthly_rent: "=monthly_rent", rent_charge_day: "=rent_charge_day", proration_method: "=proration_method", final_month_proration: "=final_month_proration", rate_lock_months: "=rate_lock_months", rate_change_notice_days: "=rate_change_notice_days"}
    formula:
      prorated_rent: round(monthly_rent * proration_days / days_in_period, 2)

  - id: storage_evt_fees_and_credits
    subject: [storage_fee_charge, storage_credit]
    rule: >-
      A lost or additional access card is billed at access_card_fee and a replacement key at key_replacement_fee. The
      first-month promotion credits first_month_promo_pct of the first full month's rent when the resident commits to
      promo_min_months; the prepay discount credits prepay_discount_pct of each prepaid month when
      prepay_months_for_discount months are paid together in advance. The promotion and the prepay discount never apply to
      the same month — a prepaid month that received the promotion earns no prepay discount. A promotion is recaptured as an
      early termination fee only through the early termination rule, never separately. A charge_reversal credits a charge
      posted against this charter, once per charge.
    eligibility: []
    params:
      per_tier:
        Bike Storage Locker: {access_card_fee: "=access_card_fee", key_replacement_fee: "=key_replacement_fee", first_month_promo_pct: "=first_month_promo_pct", promo_min_months: "=promo_min_months", prepay_months_for_discount: "=prepay_months_for_discount", prepay_discount_pct: "=prepay_discount_pct"}
        Small Storage Closet (4x4): {access_card_fee: "=access_card_fee", key_replacement_fee: "=key_replacement_fee", first_month_promo_pct: "=first_month_promo_pct", promo_min_months: "=promo_min_months", prepay_months_for_discount: "=prepay_months_for_discount", prepay_discount_pct: "=prepay_discount_pct"}
        Standard Storage Unit (5x5): {access_card_fee: "=access_card_fee", key_replacement_fee: "=key_replacement_fee", first_month_promo_pct: "=first_month_promo_pct", promo_min_months: "=promo_min_months", prepay_months_for_discount: "=prepay_months_for_discount", prepay_discount_pct: "=prepay_discount_pct"}
        Large Storage Unit (5x10): {access_card_fee: "=access_card_fee", key_replacement_fee: "=key_replacement_fee", first_month_promo_pct: "=first_month_promo_pct", promo_min_months: "=promo_min_months", prepay_months_for_discount: "=prepay_months_for_discount", prepay_discount_pct: "=prepay_discount_pct"}
        Climate-Controlled Storage Unit (5x10): {access_card_fee: "=access_card_fee", key_replacement_fee: "=key_replacement_fee", first_month_promo_pct: "=first_month_promo_pct", promo_min_months: "=promo_min_months", prepay_months_for_discount: "=prepay_months_for_discount", prepay_discount_pct: "=prepay_discount_pct"}
        Oversized Storage Suite (10x10): {access_card_fee: "=access_card_fee", key_replacement_fee: "=key_replacement_fee", first_month_promo_pct: "=first_month_promo_pct", promo_min_months: "=promo_min_months", prepay_months_for_discount: "=prepay_months_for_discount", prepay_discount_pct: "=prepay_discount_pct"}
    formula:
      promo_credit: round(first_month_promo_pct * monthly_rent, 2)
      prepay_credit: round(prepay_discount_pct * monthly_rent, 2)

  - id: storage_overlock_rule
    subject: [storage_overlock, storage_overlock_release]
    rule: >-
      A unit is overlocked when storage_msr_oldest_past_due_days exceeds overlock_delinquency_days, and the overlock_fee
      posts. The overlock is removed only after the whole storage balance, the overlock fee included, is paid. Larkspur never
      sells or disposes of stored contents for non-payment while the lease is in possession; an overlock restricts only the
      storage unit and never access to the apartment home, parking or amenities.
    eligibility: []
    params:
      per_tier:
        Bike Storage Locker: {overlock_delinquency_days: "=overlock_delinquency_days", overlock_fee: "=overlock_fee"}
        Small Storage Closet (4x4): {overlock_delinquency_days: "=overlock_delinquency_days", overlock_fee: "=overlock_fee"}
        Standard Storage Unit (5x5): {overlock_delinquency_days: "=overlock_delinquency_days", overlock_fee: "=overlock_fee"}
        Large Storage Unit (5x10): {overlock_delinquency_days: "=overlock_delinquency_days", overlock_fee: "=overlock_fee"}
        Climate-Controlled Storage Unit (5x10): {overlock_delinquency_days: "=overlock_delinquency_days", overlock_fee: "=overlock_fee"}
        Oversized Storage Suite (10x10): {overlock_delinquency_days: "=overlock_delinquency_days", overlock_fee: "=overlock_fee"}
    measures: [storage_msr_oldest_past_due_days]

  - id: storage_termination_rule
    subject: [storage_notice, storage_notice_withdrawal, storage_vacate, storage_move_out_termination, storage_unit_change]
    rule: >-
      A resident ends a rental by signing a notice whose end date is at least notice_days calendar days after the notice
      date. When the end date falls before start_date plus min_rental_months, an early_termination_fee of
      early_termination_fee_months times monthly rent is billed with the notice. A notice may be withdrawn until its end
      date. On the end date the unit must be empty and broom-clean, otherwise cleanout_fee is billed; contents left behind
      are held contents_removal_days_after_vacate calendar days before removal. Every rental ends on the lease's move-out date
      without notice or early termination fee, and it carries over on an in-community transfer when
      transfer_on_unit_transfer is true. A move to another unit or product bills unit_change_fee and restarts neither the rate
      lock nor the minimum rental. Stored items must respect prohibited_items, hazardous_materials_allowed and
      motorized_vehicle_allowed.
    eligibility: []
    params:
      per_tier:
        Bike Storage Locker: {notice_days: "=notice_days", min_rental_months: "=min_rental_months", early_termination_fee_months: "=early_termination_fee_months", cleanout_fee: "=cleanout_fee", contents_removal_days_after_vacate: "=contents_removal_days_after_vacate", transfer_on_unit_transfer: "=transfer_on_unit_transfer", unit_change_fee: "=unit_change_fee", prohibited_items: "=prohibited_items", hazardous_materials_allowed: "=hazardous_materials_allowed", motorized_vehicle_allowed: "=motorized_vehicle_allowed"}
        Small Storage Closet (4x4): {notice_days: "=notice_days", min_rental_months: "=min_rental_months", early_termination_fee_months: "=early_termination_fee_months", cleanout_fee: "=cleanout_fee", contents_removal_days_after_vacate: "=contents_removal_days_after_vacate", transfer_on_unit_transfer: "=transfer_on_unit_transfer", unit_change_fee: "=unit_change_fee", prohibited_items: "=prohibited_items", hazardous_materials_allowed: "=hazardous_materials_allowed", motorized_vehicle_allowed: "=motorized_vehicle_allowed"}
        Standard Storage Unit (5x5): {notice_days: "=notice_days", min_rental_months: "=min_rental_months", early_termination_fee_months: "=early_termination_fee_months", cleanout_fee: "=cleanout_fee", contents_removal_days_after_vacate: "=contents_removal_days_after_vacate", transfer_on_unit_transfer: "=transfer_on_unit_transfer", unit_change_fee: "=unit_change_fee", prohibited_items: "=prohibited_items", hazardous_materials_allowed: "=hazardous_materials_allowed", motorized_vehicle_allowed: "=motorized_vehicle_allowed"}
        Large Storage Unit (5x10): {notice_days: "=notice_days", min_rental_months: "=min_rental_months", early_termination_fee_months: "=early_termination_fee_months", cleanout_fee: "=cleanout_fee", contents_removal_days_after_vacate: "=contents_removal_days_after_vacate", transfer_on_unit_transfer: "=transfer_on_unit_transfer", unit_change_fee: "=unit_change_fee", prohibited_items: "=prohibited_items", hazardous_materials_allowed: "=hazardous_materials_allowed", motorized_vehicle_allowed: "=motorized_vehicle_allowed"}
        Climate-Controlled Storage Unit (5x10): {notice_days: "=notice_days", min_rental_months: "=min_rental_months", early_termination_fee_months: "=early_termination_fee_months", cleanout_fee: "=cleanout_fee", contents_removal_days_after_vacate: "=contents_removal_days_after_vacate", transfer_on_unit_transfer: "=transfer_on_unit_transfer", unit_change_fee: "=unit_change_fee", prohibited_items: "=prohibited_items", hazardous_materials_allowed: "=hazardous_materials_allowed", motorized_vehicle_allowed: "=motorized_vehicle_allowed"}
        Oversized Storage Suite (10x10): {notice_days: "=notice_days", min_rental_months: "=min_rental_months", early_termination_fee_months: "=early_termination_fee_months", cleanout_fee: "=cleanout_fee", contents_removal_days_after_vacate: "=contents_removal_days_after_vacate", transfer_on_unit_transfer: "=transfer_on_unit_transfer", unit_change_fee: "=unit_change_fee", prohibited_items: "=prohibited_items", hazardous_materials_allowed: "=hazardous_materials_allowed", motorized_vehicle_allowed: "=motorized_vehicle_allowed"}

  - id: storage_evt_payments
    subject: [storage_payment]
    rule: >-
      Storage payments are accepted while the rental is active, overlocked, notice_given or vacated.
      A payment is applied to the oldest open storage charge first, and deposit_application is used only at final accounting.
    eligibility:
      - id: storage_payment_status
        applies_to: [storage_payment]
        kind: state
        condition: "Storage payments are accepted while the rental is active, overlocked, notice_given or vacated."
        evidence_fields: [storage_rentals.storage_rental_id, storage_rentals.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [storage_rentals.storage_rental_id]
          action_bindings:
            storage_rentals.storage_rental_id: storage_rental_id
        state_contract:
          field: storage_rentals.status
          allowed: [active, overlocked, notice_given, vacated]
