# Lease Term Agreement — the term program a lease runs under: its length, its rent, how it renews,
# converts to month-to-month, is transferred to another apartment home or ends early.
# One holding = one term agreement on one lease; a lease accumulates a chain of terms over its life.
category: term
display_name: Lease Term Agreement

binding:
  holding_table: lease_terms
  event_tables: [term_offers, term_rent_changes, term_charges]
  intake_tables: [term_change_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: term_receivable}

lifecycle:
  states: [pending, current, notice_given, superseded, completed, terminated_early, transferred, cancelled]
  transitions:
    - {from: pending, to: current, by: system, means: The term start date arrives (for a new lease, move-in happens) and the term takes effect.}
    - {from: pending, to: cancelled, by: user, means: The resident rescinds a signed renewal within the rescission window, or withdraws the application before a new-lease term starts.}
    - {from: current, to: notice_given, by: agent, means: The resident's written notice to vacate is recorded.}
    - {from: notice_given, to: current, by: agent, means: The resident's withdrawal of a notice to vacate is accepted.}
    - {from: current, to: superseded, by: system, means: A renewal term or a month-to-month conversion term starts and replaces this term.}
    - {from: notice_given, to: completed, by: system, means: The resident moves out at or after the end of the term following notice.}
    - {from: current, to: completed, by: system, means: Possession ends without a notice on file (abandonment or executed writ), ending the term.}
    - {from: current, to: terminated_early, by: user, means: The resident signs an early termination, lease break or statutory release agreement.}
    - {from: notice_given, to: terminated_early, by: user, means: A resident already on notice signs an agreement to leave before the term ends.}
    - {from: current, to: transferred, by: user, means: The resident signs a transfer to another apartment home; a new transfer term replaces this one.}

accounts:
  - key: term_receivable
    unit: USD
    meaning: What the leaseholder owes on the Lease Term Agreement — early termination fees, reletting fees, concession recapture, lease-break rent, insufficient-notice charges, transfer fees and holdover rent, less credits and payments; the lease_terms.balance_due view.

parameter_schema:
  min_term_months: Shortest term length, in months, the term program may be written for (integer months).
  max_term_months: Longest term length, in months, the term program may be written for (integer months).
  rent_adjustment_pct: Premium (positive) or discount (negative) applied to the 12-month rate of the apartment home to price this term program (decimal fraction).
  rent_adjustment_min_amount: Minimum monthly premium in dollars when rent_adjustment_pct is positive (USD per month).
  notice_to_vacate_days: Calendar days of written notice required before the intended move-out date (integer days).
  notice_withdrawal_allowed: Whether a notice to vacate may be withdrawn (boolean).
  notice_withdrawal_window_days: Calendar days after a notice to vacate is received during which it may be withdrawn (integer days).
  notice_delivery_methods: Channels through which a notice to vacate, early termination or transfer request is accepted (list).
  renewal_offer_lead_days: Calendar days before term_end_date on which renewal offers are delivered (integer days; 0 means no offer is issued).
  renewal_offer_valid_days: Calendar days a renewal offer stays open from its offer date (integer days).
  renewal_offer_options: Term programs offered at renewal from this term program (list of official term tier names).
  renewal_term_start_rule: How the start date of a renewal term is fixed (enum; day_after_current_end).
  renewal_increase_cap_pct: Company cap on the increase of the 12-month-equivalent renewal rent over the in-place contracted rent (decimal fraction).
  loyalty_min_tenure_months: Continuous tenancy on the lease, in months, from which the loyalty reduction of the renewal cap applies (integer months).
  loyalty_increase_cap_reduction_pct: Reduction of renewal_increase_cap_pct for residents who meet loyalty_min_tenure_months (decimal fraction).
  min_increase_notice_days: Company minimum calendar days of written notice before a rent increase takes effect (integer days).
  mid_term_rent_change_allowed: Whether the rent may change during the term (boolean; only month-to-month agreements).
  early_renewal_window_days: A renewal signed at least this many calendar days before term_end_date earns the early renewal discount (integer days; 0 means no early renewal discount).
  early_renewal_discount_monthly: Monthly reduction of the offered rent for an early renewal (USD per month).
  renewal_requires_current_balance: Whether renewal offers are issued and accepted only while the lease has no past-due balance (boolean).
  renewal_rescission_days: Calendar days after signing a renewal during which the resident may rescind it without charge (integer days).
  mtm_conversion_automatic: Whether a term that ends with no renewal and no notice converts automatically to month-to-month (boolean).
  term_end_rule: How term_end_date is fixed from the start date (enum; day_before_anniversary).
  new_lease_start_window_days: Maximum calendar days between lease approval and the start of a new-lease term (integer days).
  etf_option_available: Whether the Early Termination Option may be exercised under this term program (boolean).
  etf_rent_multiple: Early termination fee as a multiple of the contracted monthly rent (decimal).
  etf_min_notice_days: Minimum calendar days between the signed early termination request and the termination date (integer days).
  etf_min_months_into_term: Months of the term that must have elapsed before the Early Termination Option may be exercised (integer months).
  etf_requires_current_balance: Whether the Early Termination Option requires the lease to have no past-due balance when signed (boolean).
  etf_payment_due_days: Calendar days after signing within which the early termination fee must be paid (integer days).
  etf_quote_valid_days: Calendar days an early termination or transfer quote stays valid for signature (integer days).
  job_relocation_clause: Whether a documented job relocation reduces the early termination fee (boolean).
  job_relocation_min_distance_miles: Minimum distance of the new workplace from the community for the job relocation clause (integer miles).
  job_relocation_etf_multiple: Early termination fee multiple that replaces etf_rent_multiple under the job relocation clause (decimal).
  home_purchase_clause: Whether a documented home purchase closing reduces the early termination fee (boolean).
  home_purchase_etf_multiple: Early termination fee multiple that replaces etf_rent_multiple under the home purchase clause (decimal).
  reletting_fee_pct: Reletting fee for a lease break, as a fraction of the contracted monthly rent (decimal fraction).
  lease_break_rent_liability: Whether a resident who breaks the lease stays liable for rent until the apartment home is re-leased or the term ends (boolean).
  reletting_credit_applies: Whether rent billed for days a replacement resident also pays for is credited back (boolean).
  concession_recapture: Whether the unearned part of a move-in concession is recaptured when the term ends early (boolean).
  insufficient_notice_charge_basis: How the insufficient notice charge is computed (enum; daily_contracted_rent charges one day of rent per day of notice short).
  holdover_rent_pct: Daily holdover rent for days of possession after the notice move-out date or termination date, as a multiple of daily contracted rent (decimal).
  transfer_allowed: Whether an in-community transfer may be requested under this term program (boolean).
  transfer_min_months_into_term: Months of the term that must have elapsed before a transfer may be signed (integer months).
  transfer_fee: Fee for an in-community transfer (USD).
  transfer_fee_waived_for_upsize: Whether the transfer fee is waived when the destination floor plan ranks above the current one (boolean).
  transfer_new_term_min_months: Minimum length of the new term signed with a transfer (integer months).
  transfer_notice_days: Minimum calendar days between the transfer request and the transfer move date (integer days).
  transfers_per_12_months: Transfers that may be signed on the lease within the trailing 365 days (integer).
  transfer_requires_current_balance: Whether a transfer requires the lease to have no past-due balance (boolean).

