events:
  - type: term_create
    target: lease_terms
    mutation: create
    meaning: A Lease Term Agreement is written — the first term of a new lease, a signed renewal, the new term of a signed transfer, or an automatic month-to-month conversion.
    grain: One row per term agreement.
    fields:
      customer_id: Leaseholder.
      lease_id: Lease the term belongs to.
      variant_name: Term program, official term tier name.
      term_origin: new_lease, renewal, transfer or month_to_month_conversion.
      term_start_date: First day of the term.
      term_end_date: Last day of the term.
      term_months: Term length in months.
      contracted_rent: Monthly base rent agreed for the term.
      signed_date: Date signed (or conversion recorded).
    triggers: []
  - type: term_start
    target: lease_terms
    mutation: {transition: {from: pending, to: current}}
    meaning: The term takes effect on its start date.
    grain: One row per transaction.
    fields:
      term_start_date: Start date reached (read, not rewritten).
      term_origin: Origin of the starting term (read, not rewritten).
      contracted_rent: Rent of the starting term (read, not rewritten).
    triggers:
      - event: term:term_rent_change
        when: {term_origin: [renewal, month_to_month_conversion, transfer]}
        map: {new_rent: contracted_rent, effective_date: term_start_date}
      - event: term:term_supersession
        when: {term_origin: [renewal, month_to_month_conversion]}
  - type: term_cancellation
    target: lease_terms
    mutation: {transition: {from: pending, to: cancelled}}
    meaning: A term that has not started is cancelled — a renewal rescinded within its window or a new-lease term whose application was withdrawn.
    grain: One row per transaction.
    fields:
      closed_date: Date of cancellation.
    triggers: []
  - type: term_supersession
    target: lease_terms
    mutation: {transition: {from: current, to: superseded}}
    meaning: The current term is replaced by a renewal or month-to-month conversion term that has started.
    grain: One row per transaction.
    fields:
      closed_date: Last day of the superseded term.
    triggers: []
  - type: term_notice_to_vacate
    target: lease_terms
    mutation: {transition: {from: current, to: notice_given}}
    meaning: The resident's written notice to vacate is recorded against the term.
    grain: One row per transaction.
    fields:
      notice_to_vacate_date: Date the written notice was received.
      intended_move_out_date: Move-out date stated in the notice.
    triggers: []
  - type: term_notice_withdrawal
    target: lease_terms
    mutation: {transition: {from: notice_given, to: current}}
    meaning: The resident's withdrawal of a notice to vacate is accepted and the term continues.
    grain: One row per transaction.
    fields:
      notice_to_vacate_date: Cleared.
      intended_move_out_date: Cleared.
    triggers: []
  - type: term_move_out_date_update
    target: lease_terms
    mutation: update
    meaning: A resident on notice changes the intended move-out date.
    grain: One row per transaction.
    fields:
      intended_move_out_date: New intended move-out date.
    triggers: []
  - type: term_early_termination
    target: lease_terms
    mutation: {transition: [{from: current, to: terminated_early}, {from: notice_given, to: terminated_early}]}
    meaning: The resident signs an Early Termination Option agreement, a lease break or a statutory release, ending the term before term_end_date.
    grain: One row per transaction.
    fields:
      intended_move_out_date: Termination date agreed.
      closed_date: Date the agreement was signed.
    triggers: []
  - type: term_transfer
    target: lease_terms
    mutation: {transition: {from: current, to: transferred}}
    meaning: The resident signs a transfer to another apartment home in the same community.
    grain: One row per transaction.
    fields:
      intended_move_out_date: Transfer move date.
      closed_date: Date the transfer was signed.
    triggers:
      - event: term:term_create
        map: {term_origin: transfer}
      - event: lease:lease_unit_transfer
  - type: term_completion
    target: lease_terms
    mutation: {transition: [{from: notice_given, to: completed}, {from: current, to: completed}]}
    meaning: The term ends because possession of the apartment home ended.
    grain: One row per transaction.
    fields:
      closed_date: Move-out date.
    triggers: []
  - type: term_renewal_offer
    target: term_offers
    meaning: A renewal offer line for one term length is delivered to the resident on an expiring term.
    grain: One row per offered term program per offer date.
    distinguish_by: [offered_variant, offer_date]
    fields:
      offered_variant: Term program offered.
      offered_term_months: Term length offered.
      offered_rent: Monthly rent offered before any early renewal discount.
      offer_date: Delivery date.
      offer_expiration_date: Last acceptance date.
    triggers: []
  - type: term_rent_change
    target: term_rent_changes
    meaning: A new monthly base rent is recorded with its effective date and the date its notice was delivered.
    grain: One row per rent change per effective date.
    distinguish_by: [effective_date, change_reason]
    fields:
      lease_id: Lease whose rent changes.
      previous_rent: Rent before.
      new_rent: Rent after.
      effective_date: First date of the new rent.
      notice_date: Date the notice of the new rent was delivered.
      change_reason: renewal, month_to_month_conversion, transfer or month_to_month_adjustment.
    triggers:
      - event: lease:lease_rent_update
        map: {monthly_rent: new_rent}
  - type: term_fee_assessment
    target: term_charges
    meaning: A term charge is assessed — early termination fee, reletting fee, concession recapture, lease-break rent, insufficient notice charge, transfer fee or holdover rent.
    grain: One row per charge code per request or per billing period.
    distinguish_by: [fee_code, request_id, billing_period]
    fields:
      fee_code: Charge code.
      amount: Amount assessed.
      assessed_date: Posting date.
      billing_period: Month covered (posting month for one-time charges).
      days_charged: Days billed for a day-based charge.
      request_id: Request the charge arises from, when any.
    account: term_receivable
    direction: in
    triggers: []
  - type: term_fee_credit
    target: term_charges
    meaning: A term charge is reduced — a reletting credit for days a replacement resident pays for, or the reversal of a charge posted in error or voided by a rescinded agreement.
    grain: One row per credited charge.
    distinguish_by: [fee_code, source_term_charge_id]
    fields:
      fee_code: reletting_credit or charge_reversal.
      amount: Credit amount (positive).
      assessed_date: Posting date.
      billing_period: Month credited.
      days_charged: Days credited for a reletting credit.
      source_term_charge_id: The charge credited.
    account: term_receivable
    direction: out
    triggers: []
  - type: term_payment
    target: term_charges
    meaning: A payment toward term charges is received, including the application of the security deposit at final accounting.
    grain: One row per payment transaction.
    distinguish_by: [payment_reference]
    fields:
      fee_code: payment_received.
      amount: Amount received.
      assessed_date: Date received.
      payment_method: Instrument used.
      payment_reference: Confirmation or instrument number.
    account: term_receivable
    direction: out
    triggers: []

measures:
  - id: term_msr_tenure_months
    window: From the move_in_date of the lease to the evaluation date.
    measure: Full calendar months of continuous tenancy on the lease, counted across the whole chain of its terms (new_lease, renewal, transfer and month_to_month_conversion terms alike), same day number to same day number with month-end fallback.
  - id: term_msr_transfers_12m
    window: Trailing 365 calendar days ending on and including the evaluation date.
    measure: Count of term_change_requests rows of request_type unit_transfer and request_status signed on any term of the lease whose created_at date falls in the window.
  - id: term_msr_unearned_concession
    window: From the day after the termination date through term_end_date of the terminating term.
    measure: Total rent_concession credits posted on the lease ledger for the lease's new-lease term, times the full months from the termination date to term_end_date, divided by term_months, rounded half up to the cent.

policies:
  - id: term_agg_multi_holding
    subject: [term_create]
    rule: >-
      A lease carries a chain of Lease Term Agreements, and at any moment a leaseholder holds at most one term that is
      current or notice_given and at most one pending term that will follow it.
      A new term may be written only when the lease has no other term in pending status.
      Terms that are superseded, completed, terminated_early, transferred or cancelled stay on file as history and do
      not count. Because a resident holds only one open lease, the per-customer cap below equals that pair.
    eligibility:
      - id: one_pending_term
        applies_to: [term_create]
        kind: dedup
        condition: "A new term may be written only when the lease has no other term in pending status."
        evidence_fields: [lease_terms.lease_id, lease_terms.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_terms.lease_id]
          action_bindings:
            lease_terms.lease_id: lease_id
        dedup_contract:
          table: lease_terms
          mode: separate_record
          object_bindings: {lease_id: lease_id}
          duplicate_filters: {status: [pending]}
          distinct_fields: []
    params:
      max_per_customer: 2

  - id: term_agg_tenancy_chain
    subject: [term_renewal_offer, term_create, term_transfer]
    rule: >-
      Tenure, transfer counts and concession recapture are measured across the whole chain of terms on a lease, never
      on a single term. Continuous tenancy (term_msr_tenure_months) runs from the lease's move-in date through every
      renewal, transfer and month-to-month conversion term; it resets only when a new lease is signed after the previous
      lease closed. The loyalty reduction of the renewal increase cap applies when term_msr_tenure_months on the offer
      date is at least the expiring term program's loyalty_min_tenure_months. Transfers are counted with
      term_msr_transfers_12m over all terms of the lease. The unearned concession recaptured on an early exit is computed
      from the concession of the lease's new-lease term (term_msr_unearned_concession), even when the exit happens under
      a later term; a concession is never recaptured once the new-lease term has run to its term_end_date.
    eligibility: []
    params:
      per_tier:
        Month-to-Month Agreement: {loyalty_min_tenure_months: "=loyalty_min_tenure_months", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct", transfers_per_12_months: "=transfers_per_12_months"}
        Short-Term Lease (3-5 Months): {loyalty_min_tenure_months: "=loyalty_min_tenure_months", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct", transfers_per_12_months: "=transfers_per_12_months"}
        Flexible Lease (6-9 Months): {loyalty_min_tenure_months: "=loyalty_min_tenure_months", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct", transfers_per_12_months: "=transfers_per_12_months"}
        Standard Lease (10-12 Months): {loyalty_min_tenure_months: "=loyalty_min_tenure_months", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct", transfers_per_12_months: "=transfers_per_12_months"}
        Extended Lease (13-15 Months): {loyalty_min_tenure_months: "=loyalty_min_tenure_months", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct", transfers_per_12_months: "=transfers_per_12_months"}
        Long-Term Lease (16-24 Months): {loyalty_min_tenure_months: "=loyalty_min_tenure_months", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct", transfers_per_12_months: "=transfers_per_12_months"}
    measures: [term_msr_tenure_months, term_msr_transfers_12m, term_msr_unearned_concession]

  - id: term_evt_term_pricing
    subject: [term_create, term_start]
    rule: >-
      A term is written for a whole number of months between the term program's min_term_months and max_term_months
      (a month-to-month agreement runs one month at a time), and its term_end_date follows term_end_rule: the day before
      the same day number term_months months after term_start_date, falling back to the last day of the month when that
      day number does not exist. A new-lease term starts on the move-in date, which must fall within
      new_lease_start_window_days calendar days after the lease approval, and its contracted_rent is the quoted 12-month
      monthly rent of the apartment home adjusted by the term program's rent_adjustment_pct, rounded half up to the cent;
      when rent_adjustment_pct is positive the premium is at least rent_adjustment_min_amount. A renewal term starts on
      the day after the expiring term's term_end_date (renewal_term_start_rule) and is written only from a renewal offer
      line of the expiring term.
      A renewal may be signed only when the frozen date is no later than the offer date plus the offer's validity days.
      Offer validity days are counted as calendar days starting the day after the offer date, and the offer can be accepted through the last counted day.
      Its contracted_rent is the offered_rent of the accepted line, less the early_renewal_discount_monthly of the
      accepted term program when the resident signs at least that program's early_renewal_window_days before the
      expiring term_end_date. A renewal is not signed while the lease has a past-due balance when the expiring program's
      renewal_requires_current_balance is true. A term moves from pending to current on its start date, and for a
      new-lease term only once move-in is recorded.
    eligibility:
      - id: offer_still_open
        applies_to: [term_create]
        kind: time
        condition: "A renewal may be signed only when the frozen date is no later than the offer date plus the offer's validity days."
        evidence_fields: [term_offers.offer_id, term_offers.offer_date, term_offers.offer_expiration_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [term_offers.offer_id]
          action_bindings:
            term_offers.offer_id: offer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the offer date
          anchor_source: term_offers.offer_date
          relation: not_after
          duration_source: variants.renewal_offer_valid_days
          unit: calendar_days
          counting_rule: "Offer validity days are counted as calendar days starting the day after the offer date, and the offer can be accepted through the last counted day."
          boundary: inclusive
    params:
      per_tier:
        Month-to-Month Agreement: {min_term_months: "=min_term_months", max_term_months: "=max_term_months", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount", early_renewal_window_days: "=early_renewal_window_days", early_renewal_discount_monthly: "=early_renewal_discount_monthly", renewal_requires_current_balance: "=renewal_requires_current_balance", new_lease_start_window_days: "=new_lease_start_window_days", term_end_rule: "=term_end_rule"}
        Short-Term Lease (3-5 Months): {min_term_months: "=min_term_months", max_term_months: "=max_term_months", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount", early_renewal_window_days: "=early_renewal_window_days", early_renewal_discount_monthly: "=early_renewal_discount_monthly", renewal_requires_current_balance: "=renewal_requires_current_balance", new_lease_start_window_days: "=new_lease_start_window_days", term_end_rule: "=term_end_rule"}
        Flexible Lease (6-9 Months): {min_term_months: "=min_term_months", max_term_months: "=max_term_months", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount", early_renewal_window_days: "=early_renewal_window_days", early_renewal_discount_monthly: "=early_renewal_discount_monthly", renewal_requires_current_balance: "=renewal_requires_current_balance", new_lease_start_window_days: "=new_lease_start_window_days", term_end_rule: "=term_end_rule"}
        Standard Lease (10-12 Months): {min_term_months: "=min_term_months", max_term_months: "=max_term_months", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount", early_renewal_window_days: "=early_renewal_window_days", early_renewal_discount_monthly: "=early_renewal_discount_monthly", renewal_requires_current_balance: "=renewal_requires_current_balance", new_lease_start_window_days: "=new_lease_start_window_days", term_end_rule: "=term_end_rule"}
        Extended Lease (13-15 Months): {min_term_months: "=min_term_months", max_term_months: "=max_term_months", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount", early_renewal_window_days: "=early_renewal_window_days", early_renewal_discount_monthly: "=early_renewal_discount_monthly", renewal_requires_current_balance: "=renewal_requires_current_balance", new_lease_start_window_days: "=new_lease_start_window_days", term_end_rule: "=term_end_rule"}
        Long-Term Lease (16-24 Months): {min_term_months: "=min_term_months", max_term_months: "=max_term_months", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount", early_renewal_window_days: "=early_renewal_window_days", early_renewal_discount_monthly: "=early_renewal_discount_monthly", renewal_requires_current_balance: "=renewal_requires_current_balance", new_lease_start_window_days: "=new_lease_start_window_days", term_end_rule: "=term_end_rule"}
    formula:
      early_renewal_rent: offered_rent - early_renewal_discount_monthly

  - id: term_evt_renewal_offers
    subject: [term_renewal_offer]
    rule: >-
      Renewal offers are delivered only on a term that is current.
      They are delivered renewal_offer_lead_days calendar days before term_end_date, one line for each term program in
      the expiring program's renewal_offer_options, each open for renewal_offer_valid_days; a program whose
      renewal_offer_lead_days is 0 receives no offers. No offer is delivered while a notice to vacate is on file, while the
      lease is in_default or eviction_filed, or, when renewal_requires_current_balance is true, while the lease has a
      past-due balance; such a term converts to month-to-month at its end unless the resident gives notice. The
      12-month-equivalent renewal rent may exceed the in-place contracted_rent by no more than the effective cap: the
      expiring program's renewal_increase_cap_pct, less loyalty_increase_cap_reduction_pct when the loyalty tenure is met,
      and never more than statutory_increase_cap_by_state for the community's state where one exists. Each offer line's
      offered_rent is that 12-month-equivalent rent adjusted by the offered program's rent_adjustment_pct (with its
      rent_adjustment_min_amount floor), rounded half up to the cent. Revenue management may offer less than the cap; an
      offer above the cap is an offer posted in error and is corrected before acceptance.
    eligibility:
      - id: offer_on_current_term
        applies_to: [term_renewal_offer]
        kind: state
        condition: "Renewal offers are delivered only on a term that is current."
        evidence_fields: [lease_terms.term_id, lease_terms.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_terms.term_id]
          action_bindings:
            lease_terms.term_id: term_id
        state_contract:
          field: lease_terms.status
          allowed: [current]
    params:
      statutory_increase_cap_by_state: {CA: 0.088, WA: 0.0968}
      per_tier:
        Month-to-Month Agreement: {renewal_offer_lead_days: "=renewal_offer_lead_days", renewal_offer_valid_days: "=renewal_offer_valid_days", renewal_offer_options: "=renewal_offer_options", renewal_increase_cap_pct: "=renewal_increase_cap_pct", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct"}
        Short-Term Lease (3-5 Months): {renewal_offer_lead_days: "=renewal_offer_lead_days", renewal_offer_valid_days: "=renewal_offer_valid_days", renewal_offer_options: "=renewal_offer_options", renewal_increase_cap_pct: "=renewal_increase_cap_pct", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct"}
        Flexible Lease (6-9 Months): {renewal_offer_lead_days: "=renewal_offer_lead_days", renewal_offer_valid_days: "=renewal_offer_valid_days", renewal_offer_options: "=renewal_offer_options", renewal_increase_cap_pct: "=renewal_increase_cap_pct", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct"}
        Standard Lease (10-12 Months): {renewal_offer_lead_days: "=renewal_offer_lead_days", renewal_offer_valid_days: "=renewal_offer_valid_days", renewal_offer_options: "=renewal_offer_options", renewal_increase_cap_pct: "=renewal_increase_cap_pct", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct"}
        Extended Lease (13-15 Months): {renewal_offer_lead_days: "=renewal_offer_lead_days", renewal_offer_valid_days: "=renewal_offer_valid_days", renewal_offer_options: "=renewal_offer_options", renewal_increase_cap_pct: "=renewal_increase_cap_pct", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct"}
        Long-Term Lease (16-24 Months): {renewal_offer_lead_days: "=renewal_offer_lead_days", renewal_offer_valid_days: "=renewal_offer_valid_days", renewal_offer_options: "=renewal_offer_options", renewal_increase_cap_pct: "=renewal_increase_cap_pct", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct"}
    formula:
      max_renewal_rent: round(contracted_rent * (1 + renewal_increase_cap_pct), 2)
      max_renewal_rent_loyal: round(contracted_rent * (1 + renewal_increase_cap_pct - loyalty_increase_cap_reduction_pct), 2)
    measures: [term_msr_tenure_months]

  - id: term_evt_rent_change_notice
    subject: [term_rent_change]
    rule: >-
      A rent change is recorded when a renewal, transfer or month-to-month conversion term starts, and when the rent of a
      month-to-month agreement is adjusted; the rent of a fixed term never changes mid-term (mid_term_rent_change_allowed).
      A signed renewal or transfer is the resident's agreement to its rent and needs no advance notice. For a
      month-to-month conversion or adjustment that raises the rent, the required notice is the longer of the
      min_increase_notice_days of the Month-to-Month Agreement and rent_increase_notice_days_by_state for the community's
      state, where the CA figure for an increase above ten percent over the prior twelve months is the over_threshold one.
      For a month-to-month conversion or adjustment, a new rent may take effect only when the frozen date is later than the date the rent change notice was delivered plus the required notice days.
      Notice days are counted as calendar days starting the day after delivery, and the new rent may take effect on the day after the last notice day at the earliest.
      When the notice given was shorter, the previous rent continues and the rent change takes effect on the first day
      the notice allows. No increase may make the rent exceed the previous rent by more than the
      statutory_increase_cap_by_state of the renewal offer rule over any twelve months in a state that has one.
    eligibility:
      - id: increase_notice_matured
        applies_to: [term_rent_change]
        kind: time
        condition: "For a month-to-month conversion or adjustment, a new rent may take effect only when the frozen date is later than the date the rent change notice was delivered plus the required notice days."
        evidence_fields: [term_rent_changes.rent_change_id, term_rent_changes.notice_date, term_rent_changes.change_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [term_rent_changes.rent_change_id]
          action_bindings:
            term_rent_changes.rent_change_id: rent_change_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the rent change notice was delivered
          anchor_source: term_rent_changes.notice_date
          relation: not_before
          duration_source: variants.min_increase_notice_days
          unit: calendar_days
          counting_rule: "Notice days are counted as calendar days starting the day after delivery, and the new rent may take effect on the day after the last notice day at the earliest."
          boundary: exclusive
    params:
      rent_increase_notice_days_by_state:
        CA: {standard: 30, over_threshold: 90}
        WA: {standard: 90, over_threshold: 90}
        CO: {standard: 60, over_threshold: 60}
        TX: {standard: 0, over_threshold: 0}
        GA: {standard: 0, over_threshold: 0}
        AZ: {standard: 0, over_threshold: 0}
      per_tier:
        Month-to-Month Agreement: {min_increase_notice_days: "=min_increase_notice_days", mid_term_rent_change_allowed: "=mid_term_rent_change_allowed"}
        Short-Term Lease (3-5 Months): {min_increase_notice_days: "=min_increase_notice_days", mid_term_rent_change_allowed: "=mid_term_rent_change_allowed"}
        Flexible Lease (6-9 Months): {min_increase_notice_days: "=min_increase_notice_days", mid_term_rent_change_allowed: "=mid_term_rent_change_allowed"}
        Standard Lease (10-12 Months): {min_increase_notice_days: "=min_increase_notice_days", mid_term_rent_change_allowed: "=mid_term_rent_change_allowed"}
        Extended Lease (13-15 Months): {min_increase_notice_days: "=min_increase_notice_days", mid_term_rent_change_allowed: "=mid_term_rent_change_allowed"}
        Long-Term Lease (16-24 Months): {min_increase_notice_days: "=min_increase_notice_days", mid_term_rent_change_allowed: "=mid_term_rent_change_allowed"}

  - id: term_notice_to_vacate_rule
    subject: [term_notice_to_vacate, term_notice_withdrawal, term_move_out_date_update, term_completion]
    rule: >-
      A notice to vacate is recorded only from the resident's own written notice through a channel in notice_delivery_methods; a verbal statement of plans is not notice.
      On a fixed term the intended move-out date must be on or after term_end_date — an earlier date is an early
      termination or lease break, never a notice. On a month-to-month agreement any date may be given. When the intended
      move-out date is earlier than the notice date plus notice_to_vacate_days, the notice is still recorded and an
      insufficient_notice_charge is assessed for the days short (insufficient_notice_charge_basis daily_contracted_rent:
      contracted_rent times 12 divided by 365, rounded half up to the cent per day, times the days short); the resident may
      instead move the date out to avoid it. A resident on notice may move the intended date later only up to the day
      before any new lease on the same apartment home starts, and earlier only if the new date still satisfies the rules
      above.
      A notice may be withdrawn only when the frozen date is no later than the date the notice to vacate was received plus notice_withdrawal_window_days.
      Withdrawal days are counted as calendar days starting the day after the notice was received, and the last counted day is included.
      Withdrawal also requires notice_withdrawal_allowed and that no other lease has been applied for or approved on the
      same apartment home; withdrawing removes any insufficient_notice_charge by a charge_reversal. The term completes when
      possession ends; a resident who stays beyond the intended move-out date owes holdover rent under the term charge rule.
    eligibility:
      - id: written_notice
        applies_to: [term_notice_to_vacate]
        kind: caller_fact
        condition: "A notice to vacate is recorded only from the resident's own written notice through a channel in notice_delivery_methods; a verbal statement of plans is not notice."
        evidence_fields: [lease_terms.term_id, lease_terms.term_end_date]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [lease_terms.term_id]
          action_bindings:
            lease_terms.term_id: term_id
      - id: withdrawal_window
        applies_to: [term_notice_withdrawal]
        kind: time
        condition: "A notice may be withdrawn only when the frozen date is no later than the date the notice to vacate was received plus notice_withdrawal_window_days."
        evidence_fields: [lease_terms.term_id, lease_terms.notice_to_vacate_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_terms.term_id]
          action_bindings:
            lease_terms.term_id: term_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the notice to vacate was received
          anchor_source: lease_terms.notice_to_vacate_date
          relation: not_after
          duration_source: variants.notice_withdrawal_window_days
          unit: calendar_days
          counting_rule: "Withdrawal days are counted as calendar days starting the day after the notice was received, and the last counted day is included."
          boundary: inclusive
    params:
      per_tier:
        Month-to-Month Agreement: {notice_to_vacate_days: "=notice_to_vacate_days", notice_withdrawal_allowed: "=notice_withdrawal_allowed", notice_withdrawal_window_days: "=notice_withdrawal_window_days", notice_delivery_methods: "=notice_delivery_methods", insufficient_notice_charge_basis: "=insufficient_notice_charge_basis"}
        Short-Term Lease (3-5 Months): {notice_to_vacate_days: "=notice_to_vacate_days", notice_withdrawal_allowed: "=notice_withdrawal_allowed", notice_withdrawal_window_days: "=notice_withdrawal_window_days", notice_delivery_methods: "=notice_delivery_methods", insufficient_notice_charge_basis: "=insufficient_notice_charge_basis"}
        Flexible Lease (6-9 Months): {notice_to_vacate_days: "=notice_to_vacate_days", notice_withdrawal_allowed: "=notice_withdrawal_allowed", notice_withdrawal_window_days: "=notice_withdrawal_window_days", notice_delivery_methods: "=notice_delivery_methods", insufficient_notice_charge_basis: "=insufficient_notice_charge_basis"}
        Standard Lease (10-12 Months): {notice_to_vacate_days: "=notice_to_vacate_days", notice_withdrawal_allowed: "=notice_withdrawal_allowed", notice_withdrawal_window_days: "=notice_withdrawal_window_days", notice_delivery_methods: "=notice_delivery_methods", insufficient_notice_charge_basis: "=insufficient_notice_charge_basis"}
        Extended Lease (13-15 Months): {notice_to_vacate_days: "=notice_to_vacate_days", notice_withdrawal_allowed: "=notice_withdrawal_allowed", notice_withdrawal_window_days: "=notice_withdrawal_window_days", notice_delivery_methods: "=notice_delivery_methods", insufficient_notice_charge_basis: "=insufficient_notice_charge_basis"}
        Long-Term Lease (16-24 Months): {notice_to_vacate_days: "=notice_to_vacate_days", notice_withdrawal_allowed: "=notice_withdrawal_allowed", notice_withdrawal_window_days: "=notice_withdrawal_window_days", notice_delivery_methods: "=notice_delivery_methods", insufficient_notice_charge_basis: "=insufficient_notice_charge_basis"}
    formula:
      daily_rent: round(contracted_rent * 12 / 365, 2)

  - id: term_early_termination_rule
    subject: [term_early_termination, term_fee_assessment]
    rule: >-
      A resident who must leave before term_end_date has exactly three routes, decided in this order: a statutory
      release under the statutory release rule, the Early Termination Option, or a lease break. Each is requested through
      an early termination request, quoted, and takes effect only when the resident signs it; signing is the resident's own act.
      The Early Termination Option may be exercised only when the frozen date is on or after the term start date plus etf_min_months_into_term.
      Months into the term are counted in calendar months from term_start_date to the same day number of a later month, falling back to the last day of that month when that day number does not exist.
      It further requires etf_option_available, a termination date at least etf_min_notice_days calendar days after the
      request's created_at date, and, when etf_requires_current_balance is true, no past-due balance on the lease. Its
      early_termination_fee is etf_rent_multiple times contracted_rent, rounded half up to the cent; the multiple is
      replaced by job_relocation_etf_multiple when job_relocation_clause is true and the resident documents a new workplace
      at least job_relocation_min_distance_miles away, or by home_purchase_etf_multiple when home_purchase_clause is true
      and the resident documents a home purchase closing, and when both are documented the lower multiple applies. The fee
      is due within etf_payment_due_days of signing, and rent continues to post under the lease charter through the
      termination date. When the option is not available, the exit is a lease break: a reletting_fee of reletting_fee_pct
      times contracted_rent is assessed, and when lease_break_rent_liability is true lease_break_rent accrues under the
      term charge rule from the day after move-out until the day before a replacement resident's lease starts on the
      apartment home or term_end_date, whichever comes first. On either route, when concession_recapture is true a
      concession_recapture of term_msr_unearned_concession is assessed; the job relocation and home purchase clauses do
      not waive it. A quote is valid for etf_quote_valid_days; an expired quote must be requoted.
      Only one early termination fee, reletting fee and concession recapture is assessed per early termination request.
      A month-to-month agreement is ended by notice alone and has no early termination.
    eligibility:
      - id: etf_months_into_term
        applies_to: [term_early_termination]
        kind: time
        condition: "The Early Termination Option may be exercised only when the frozen date is on or after the term start date plus etf_min_months_into_term."
        evidence_fields: [lease_terms.term_id, lease_terms.term_start_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_terms.term_id]
          action_bindings:
            lease_terms.term_id: term_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the term start date
          anchor_source: lease_terms.term_start_date
          relation: not_before
          duration_source: variants.etf_min_months_into_term
          unit: calendar_months
          counting_rule: "Months into the term are counted in calendar months from term_start_date to the same day number of a later month, falling back to the last day of that month when that day number does not exist."
          boundary: inclusive
      - id: signed_agreement
        applies_to: [term_early_termination]
        kind: authorization
        condition: "Each is requested through an early termination request, quoted, and takes effect only when the resident signs it; signing is the resident's own act."
        evidence_fields: [term_change_requests.request_id, term_change_requests.request_status, term_change_requests.request_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [term_change_requests.request_id]
          action_bindings:
            term_change_requests.request_id: request_id
      - id: one_fee_set_per_request
        applies_to: [term_fee_assessment]
        kind: dedup
        condition: "Only one early termination fee, reletting fee and concession recapture is assessed per early termination request."
        evidence_fields: [term_charges.request_id, term_charges.fee_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [term_charges.request_id]
          action_bindings:
            term_charges.request_id: request_id
        dedup_contract:
          table: term_charges
          mode: separate_record
          object_bindings: {request_id: request_id}
          duplicate_filters: {fee_code: [early_termination_fee, reletting_fee, concession_recapture]}
          distinct_fields: [fee_code]
    params:
      per_tier:
        Month-to-Month Agreement: {etf_option_available: "=etf_option_available", etf_rent_multiple: "=etf_rent_multiple", etf_min_notice_days: "=etf_min_notice_days", etf_min_months_into_term: "=etf_min_months_into_term", etf_requires_current_balance: "=etf_requires_current_balance", etf_payment_due_days: "=etf_payment_due_days", etf_quote_valid_days: "=etf_quote_valid_days", job_relocation_clause: "=job_relocation_clause", job_relocation_min_distance_miles: "=job_relocation_min_distance_miles", job_relocation_etf_multiple: "=job_relocation_etf_multiple", home_purchase_clause: "=home_purchase_clause", home_purchase_etf_multiple: "=home_purchase_etf_multiple", reletting_fee_pct: "=reletting_fee_pct", lease_break_rent_liability: "=lease_break_rent_liability", concession_recapture: "=concession_recapture"}
        Short-Term Lease (3-5 Months): {etf_option_available: "=etf_option_available", etf_rent_multiple: "=etf_rent_multiple", etf_min_notice_days: "=etf_min_notice_days", etf_min_months_into_term: "=etf_min_months_into_term", etf_requires_current_balance: "=etf_requires_current_balance", etf_payment_due_days: "=etf_payment_due_days", etf_quote_valid_days: "=etf_quote_valid_days", job_relocation_clause: "=job_relocation_clause", job_relocation_min_distance_miles: "=job_relocation_min_distance_miles", job_relocation_etf_multiple: "=job_relocation_etf_multiple", home_purchase_clause: "=home_purchase_clause", home_purchase_etf_multiple: "=home_purchase_etf_multiple", reletting_fee_pct: "=reletting_fee_pct", lease_break_rent_liability: "=lease_break_rent_liability", concession_recapture: "=concession_recapture"}
        Flexible Lease (6-9 Months): {etf_option_available: "=etf_option_available", etf_rent_multiple: "=etf_rent_multiple", etf_min_notice_days: "=etf_min_notice_days", etf_min_months_into_term: "=etf_min_months_into_term", etf_requires_current_balance: "=etf_requires_current_balance", etf_payment_due_days: "=etf_payment_due_days", etf_quote_valid_days: "=etf_quote_valid_days", job_relocation_clause: "=job_relocation_clause", job_relocation_min_distance_miles: "=job_relocation_min_distance_miles", job_relocation_etf_multiple: "=job_relocation_etf_multiple", home_purchase_clause: "=home_purchase_clause", home_purchase_etf_multiple: "=home_purchase_etf_multiple", reletting_fee_pct: "=reletting_fee_pct", lease_break_rent_liability: "=lease_break_rent_liability", concession_recapture: "=concession_recapture"}
        Standard Lease (10-12 Months): {etf_option_available: "=etf_option_available", etf_rent_multiple: "=etf_rent_multiple", etf_min_notice_days: "=etf_min_notice_days", etf_min_months_into_term: "=etf_min_months_into_term", etf_requires_current_balance: "=etf_requires_current_balance", etf_payment_due_days: "=etf_payment_due_days", etf_quote_valid_days: "=etf_quote_valid_days", job_relocation_clause: "=job_relocation_clause", job_relocation_min_distance_miles: "=job_relocation_min_distance_miles", job_relocation_etf_multiple: "=job_relocation_etf_multiple", home_purchase_clause: "=home_purchase_clause", home_purchase_etf_multiple: "=home_purchase_etf_multiple", reletting_fee_pct: "=reletting_fee_pct", lease_break_rent_liability: "=lease_break_rent_liability", concession_recapture: "=concession_recapture"}
        Extended Lease (13-15 Months): {etf_option_available: "=etf_option_available", etf_rent_multiple: "=etf_rent_multiple", etf_min_notice_days: "=etf_min_notice_days", etf_min_months_into_term: "=etf_min_months_into_term", etf_requires_current_balance: "=etf_requires_current_balance", etf_payment_due_days: "=etf_payment_due_days", etf_quote_valid_days: "=etf_quote_valid_days", job_relocation_clause: "=job_relocation_clause", job_relocation_min_distance_miles: "=job_relocation_min_distance_miles", job_relocation_etf_multiple: "=job_relocation_etf_multiple", home_purchase_clause: "=home_purchase_clause", home_purchase_etf_multiple: "=home_purchase_etf_multiple", reletting_fee_pct: "=reletting_fee_pct", lease_break_rent_liability: "=lease_break_rent_liability", concession_recapture: "=concession_recapture"}
        Long-Term Lease (16-24 Months): {etf_option_available: "=etf_option_available", etf_rent_multiple: "=etf_rent_multiple", etf_min_notice_days: "=etf_min_notice_days", etf_min_months_into_term: "=etf_min_months_into_term", etf_requires_current_balance: "=etf_requires_current_balance", etf_payment_due_days: "=etf_payment_due_days", etf_quote_valid_days: "=etf_quote_valid_days", job_relocation_clause: "=job_relocation_clause", job_relocation_min_distance_miles: "=job_relocation_min_distance_miles", job_relocation_etf_multiple: "=job_relocation_etf_multiple", home_purchase_clause: "=home_purchase_clause", home_purchase_etf_multiple: "=home_purchase_etf_multiple", reletting_fee_pct: "=reletting_fee_pct", lease_break_rent_liability: "=lease_break_rent_liability", concession_recapture: "=concession_recapture"}
    formula:
      early_termination_fee: round(etf_rent_multiple * contracted_rent, 2)
      reletting_fee: round(reletting_fee_pct * contracted_rent, 2)
    measures: [term_msr_unearned_concession]

  - id: term_statutory_release
    subject: [term_early_termination, term_fee_assessment]
    rule: >-
      A statutory release ends a fixed term early without any early termination fee, reletting fee, concession
      recapture or lease-break rent. It is available for military_orders (the resident or spouse enters military
      service or receives permanent change of station or deployment orders of ninety days or more), for
      domestic_violence (the resident or a household member is a victim and provides the qualifying court order or
      report of the community's state), and for death_of_sole_leaseholder (requested by the estate).
      A statutory release is granted only when the community manager has recorded the qualifying document against the request; the resident's statement alone never grants it.
      For military_orders the release takes effect military_release_days_after_next_due calendar days after the first rent
      due date following delivery of the written notice with the orders. For domestic_violence it takes effect
      domestic_violence_release_days_by_state calendar days after delivery of the notice. For death_of_sole_leaseholder it
      takes effect death_release_days calendar days after the estate's written notice. Rent keeps posting under the lease
      charter through the release date, and the security deposit is accounted for under its own charter as on any
      move-out. A release that is not documented is handled as an Early Termination Option or a lease break.
    eligibility:
      - id: release_documented
        applies_to: [term_early_termination, term_fee_assessment]
        kind: authorization
        condition: "A statutory release is granted only when the community manager has recorded the qualifying document against the request; the resident's statement alone never grants it."
        evidence_fields: [term_change_requests.request_id, term_change_requests.request_type, term_change_requests.statutory_release_basis]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [term_change_requests.request_id]
          action_bindings:
            term_change_requests.request_id: request_id
    params:
      military_release_days_after_next_due: 30
      domestic_violence_release_days_by_state: {CA: 14, WA: 30, CO: 30, TX: 30, GA: 30, AZ: 30}
      death_release_days: 30

  - id: term_transfer_rule
    subject: [term_transfer, term_create, term_fee_assessment]
    rule: >-
      A resident may move to another available apartment home in the same community by a transfer, which the resident signs.
      A transfer may be signed only when the frozen date is on or after the term start date plus transfer_min_months_into_term.
      Months into the term are counted in calendar months from term_start_date to the same day number of a later month, falling back to the last day of that month when that day number does not exist.
      It further requires transfer_allowed, a transfer move date at least transfer_notice_days calendar days after the
      request's created_at date, term_msr_transfers_12m below transfers_per_12_months, no past-due balance on the lease
      when transfer_requires_current_balance is true, and a destination floor plan that admits the household under the
      lease charter. The current term ends as transferred on signing and a new transfer term starts on the move date at the
      destination's quoted 12-month rent adjusted for the chosen term program, for at least transfer_new_term_min_months.
      The transfer_fee is assessed on signing, except that it is waived when transfer_fee_waived_for_upsize is true and
      the destination floor plan ranks above the current one. A transfer never triggers concession recapture, a reletting
      fee or an early termination fee, the security deposit carries over unchanged, and the move-out charges of the
      apartment home left behind are itemized under the security deposit charter at the final move-out. Rent for the
      overlapping days is not charged twice: the old apartment home's rent stops the day before the move date.
    eligibility:
      - id: transfer_months_into_term
        applies_to: [term_transfer]
        kind: time
        condition: "A transfer may be signed only when the frozen date is on or after the term start date plus transfer_min_months_into_term."
        evidence_fields: [lease_terms.term_id, lease_terms.term_start_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_terms.term_id]
          action_bindings:
            lease_terms.term_id: term_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the term start date
          anchor_source: lease_terms.term_start_date
          relation: not_before
          duration_source: variants.transfer_min_months_into_term
          unit: calendar_months
          counting_rule: "Months into the term are counted in calendar months from term_start_date to the same day number of a later month, falling back to the last day of that month when that day number does not exist."
          boundary: inclusive
    params:
      per_tier:
        Month-to-Month Agreement: {transfer_allowed: "=transfer_allowed", transfer_min_months_into_term: "=transfer_min_months_into_term", transfer_fee: "=transfer_fee", transfer_fee_waived_for_upsize: "=transfer_fee_waived_for_upsize", transfer_new_term_min_months: "=transfer_new_term_min_months", transfer_notice_days: "=transfer_notice_days", transfers_per_12_months: "=transfers_per_12_months", transfer_requires_current_balance: "=transfer_requires_current_balance"}
        Short-Term Lease (3-5 Months): {transfer_allowed: "=transfer_allowed", transfer_min_months_into_term: "=transfer_min_months_into_term", transfer_fee: "=transfer_fee", transfer_fee_waived_for_upsize: "=transfer_fee_waived_for_upsize", transfer_new_term_min_months: "=transfer_new_term_min_months", transfer_notice_days: "=transfer_notice_days", transfers_per_12_months: "=transfers_per_12_months", transfer_requires_current_balance: "=transfer_requires_current_balance"}
        Flexible Lease (6-9 Months): {transfer_allowed: "=transfer_allowed", transfer_min_months_into_term: "=transfer_min_months_into_term", transfer_fee: "=transfer_fee", transfer_fee_waived_for_upsize: "=transfer_fee_waived_for_upsize", transfer_new_term_min_months: "=transfer_new_term_min_months", transfer_notice_days: "=transfer_notice_days", transfers_per_12_months: "=transfers_per_12_months", transfer_requires_current_balance: "=transfer_requires_current_balance"}
        Standard Lease (10-12 Months): {transfer_allowed: "=transfer_allowed", transfer_min_months_into_term: "=transfer_min_months_into_term", transfer_fee: "=transfer_fee", transfer_fee_waived_for_upsize: "=transfer_fee_waived_for_upsize", transfer_new_term_min_months: "=transfer_new_term_min_months", transfer_notice_days: "=transfer_notice_days", transfers_per_12_months: "=transfers_per_12_months", transfer_requires_current_balance: "=transfer_requires_current_balance"}
        Extended Lease (13-15 Months): {transfer_allowed: "=transfer_allowed", transfer_min_months_into_term: "=transfer_min_months_into_term", transfer_fee: "=transfer_fee", transfer_fee_waived_for_upsize: "=transfer_fee_waived_for_upsize", transfer_new_term_min_months: "=transfer_new_term_min_months", transfer_notice_days: "=transfer_notice_days", transfers_per_12_months: "=transfers_per_12_months", transfer_requires_current_balance: "=transfer_requires_current_balance"}
        Long-Term Lease (16-24 Months): {transfer_allowed: "=transfer_allowed", transfer_min_months_into_term: "=transfer_min_months_into_term", transfer_fee: "=transfer_fee", transfer_fee_waived_for_upsize: "=transfer_fee_waived_for_upsize", transfer_new_term_min_months: "=transfer_new_term_min_months", transfer_notice_days: "=transfer_notice_days", transfers_per_12_months: "=transfers_per_12_months", transfer_requires_current_balance: "=transfer_requires_current_balance"}
    measures: [term_msr_transfers_12m]

  - id: term_mtm_conversion
    subject: [term_create, term_supersession]
    rule: >-
      When a fixed term reaches its term_end_date with no signed renewal and no notice to vacate on file, and the
      expiring program's mtm_conversion_automatic is true, a Month-to-Month Agreement term is written starting the day
      after term_end_date, and the expiring term is superseded when it starts. Its contracted_rent is the in-place
      contracted_rent adjusted by the Month-to-Month Agreement's rent_adjustment_pct with its rent_adjustment_min_amount
      floor, rounded half up to the cent, but the increase takes effect only as the rent change notice rule allows;
      until then the in-place rent continues. A month-to-month agreement renews itself each month on the same terms until
      a notice to vacate is given, a fixed-term renewal is signed from an offer, or the rent is adjusted with notice. A
      resident on notice whose term ends before the intended move-out date does not convert; the days after term_end_date
      are billed as holdover rent.
    eligibility: []
    params:
      per_tier:
        Month-to-Month Agreement: {mtm_conversion_automatic: "=mtm_conversion_automatic", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount"}
        Short-Term Lease (3-5 Months): {mtm_conversion_automatic: "=mtm_conversion_automatic", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount"}
        Flexible Lease (6-9 Months): {mtm_conversion_automatic: "=mtm_conversion_automatic", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount"}
        Standard Lease (10-12 Months): {mtm_conversion_automatic: "=mtm_conversion_automatic", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount"}
        Extended Lease (13-15 Months): {mtm_conversion_automatic: "=mtm_conversion_automatic", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount"}
        Long-Term Lease (16-24 Months): {mtm_conversion_automatic: "=mtm_conversion_automatic", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount"}

  - id: term_evt_charges_credits_payments
    subject: [term_fee_assessment, term_fee_credit, term_payment]
    rule: >-
      Term charges post only while the term is current, notice_given, terminated_early, transferred or completed.
      Every term charge is billed on the Lease Term Agreement account, separately from the lease ledger, and is payable
      by any accepted instrument or by the security deposit at final accounting. Lease-break rent posts one line per
      calendar month on the first day of the month (or on the day after move-out for the first month), prorated by
      days_charged over the actual days of the month at the contracted_rent. When reletting_credit_applies is true and a
      replacement resident's lease starts before the end of a month already billed, a reletting_credit for the days from
      that start through month end is posted against that month's lease_break_rent line. Holdover rent is owed for each
      day of possession after the intended move-out date or termination date at holdover_rent_pct times the daily
      contracted rent (contracted_rent times 12 divided by 365, rounded half up to the cent per day), posted as one line per
      calendar month with the days of that month in days_charged. A charge_reversal credits a charge
      posted against this charter or voided by a rescinded or withdrawn agreement, once per charge. A payment is applied
      to the oldest open term charge first.
    eligibility:
      - id: term_charge_status
        applies_to: [term_fee_assessment]
        kind: state
        condition: "Term charges post only while the term is current, notice_given, terminated_early, transferred or completed."
        evidence_fields: [lease_terms.term_id, lease_terms.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_terms.term_id]
          action_bindings:
            lease_terms.term_id: term_id
        state_contract:
          field: lease_terms.status
          allowed: [current, notice_given, terminated_early, transferred, completed]
    params:
      per_tier:
        Month-to-Month Agreement: {holdover_rent_pct: "=holdover_rent_pct", reletting_credit_applies: "=reletting_credit_applies", lease_break_rent_liability: "=lease_break_rent_liability"}
        Short-Term Lease (3-5 Months): {holdover_rent_pct: "=holdover_rent_pct", reletting_credit_applies: "=reletting_credit_applies", lease_break_rent_liability: "=lease_break_rent_liability"}
        Flexible Lease (6-9 Months): {holdover_rent_pct: "=holdover_rent_pct", reletting_credit_applies: "=reletting_credit_applies", lease_break_rent_liability: "=lease_break_rent_liability"}
        Standard Lease (10-12 Months): {holdover_rent_pct: "=holdover_rent_pct", reletting_credit_applies: "=reletting_credit_applies", lease_break_rent_liability: "=lease_break_rent_liability"}
        Extended Lease (13-15 Months): {holdover_rent_pct: "=holdover_rent_pct", reletting_credit_applies: "=reletting_credit_applies", lease_break_rent_liability: "=lease_break_rent_liability"}
        Long-Term Lease (16-24 Months): {holdover_rent_pct: "=holdover_rent_pct", reletting_credit_applies: "=reletting_credit_applies", lease_break_rent_liability: "=lease_break_rent_liability"}
    formula:
      holdover_daily: round(holdover_rent_pct * round(contracted_rent * 12 / 365, 2), 2)

  - id: term_renewal_rescission
    subject: [term_cancellation]
    rule: >-
      A signed renewal may be rescinded by the resident without charge before it starts.
      A renewal may be rescinded only when the frozen date is no later than the renewal's signed date plus renewal_rescission_days.
      Rescission days are counted as calendar days starting the day after the renewal was signed, and the last counted day is included.
      A rescinded renewal leaves the expiring term as it was: without a notice to vacate it converts to month-to-month at
      its end, and new renewal offers are not issued again for it. A term program with renewal_rescission_days of 0 has
      no rescission. A pending new-lease term is cancelled only together with the withdrawal of its lease application.
    eligibility:
      - id: rescission_window
        applies_to: [term_cancellation]
        kind: time
        condition: "A renewal may be rescinded only when the frozen date is no later than the renewal's signed date plus renewal_rescission_days."
        evidence_fields: [lease_terms.term_id, lease_terms.signed_date, lease_terms.term_origin]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_terms.term_id]
          action_bindings:
            lease_terms.term_id: term_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the renewal's signed date
          anchor_source: lease_terms.signed_date
          relation: not_after
          duration_source: variants.renewal_rescission_days
          unit: calendar_days
          counting_rule: "Rescission days are counted as calendar days starting the day after the renewal was signed, and the last counted day is included."
          boundary: inclusive
    params:
      per_tier:
        Month-to-Month Agreement: {renewal_rescission_days: "=renewal_rescission_days"}
        Short-Term Lease (3-5 Months): {renewal_rescission_days: "=renewal_rescission_days"}
        Flexible Lease (6-9 Months): {renewal_rescission_days: "=renewal_rescission_days"}
        Standard Lease (10-12 Months): {renewal_rescission_days: "=renewal_rescission_days"}
        Extended Lease (13-15 Months): {renewal_rescission_days: "=renewal_rescission_days"}
        Long-Term Lease (16-24 Months): {renewal_rescission_days: "=renewal_rescission_days"}
