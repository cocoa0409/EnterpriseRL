# Utility Services Program — how the water, sewer, trash, pest, stormwater, gas and electric service of an
# apartment home is billed back to the household. One holding = one utility account for one apartment home
# under one lease; the program is fixed by how the apartment home is metered.
category: utility
display_name: Utility Services Program

binding:
  holding_table: utility_accounts
  event_tables: [utility_meter_reads, utility_bills]
  intake_tables: [utility_disputes]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: utility_receivable}

lifecycle:
  states: [pending, active, final_billing, closed]
  transitions:
    - {from: pending, to: active, by: system, means: Billing responsibility starts on the move-in or transfer move date.}
    - {from: pending, to: closed, by: agent, means: The lease application is withdrawn before move-in and the account never bills.}
    - {from: active, to: final_billing, by: system, means: Billing responsibility ends on the move-out or transfer move date and the final bill is prepared.}
    - {from: final_billing, to: closed, by: system, means: The final bill has been issued and its balance settled or carried into the final account statement.}

accounts:
  - key: utility_receivable
    unit: USD
    meaning: What the household owes for utility billbacks, flat utility charges, package fees and overages, less adjustments and payments; the utility_accounts.balance_due view.

parameter_schema:
  covers_water_sewer: Whether water and sewer service are billed through the program (boolean; false means the resident contracts with the city directly).
  covers_trash: Whether trash collection is billed through the program (boolean).
  covers_pest: Whether pest control is billed through the program (boolean).
  covers_stormwater: Whether the stormwater drainage fee is billed through the program (boolean).
  covers_gas: Whether natural gas is billed through the program (boolean).
  covers_electric: Whether electricity is billed through the program (boolean).
  water_billing_method: How water and sewer are billed (enum; none, allocation, submeter, package).
  billing_admin_fee_monthly: Monthly utility billing administration fee (USD; 0.00 means none).
  move_in_setup_fee: One-time utility account setup fee at activation (USD).
  trash_flat_monthly: Monthly flat trash charge (USD; 0.00 when not billed separately).
  pest_flat_monthly: Monthly flat pest control charge (USD; 0.00 when not billed separately).
  stormwater_flat_monthly: Monthly flat stormwater charge (USD; 0.00 when not billed separately).
  water_rate_per_kgal: Submetered water rate (USD per thousand gallons).
  sewer_rate_per_kgal: Submetered sewer rate applied to metered water usage (USD per thousand gallons).
  water_base_charge_monthly: Monthly fixed water service charge on submetered plans (USD).
  sewer_base_charge_monthly: Monthly fixed sewer service charge on submetered plans (USD).
  sewer_billing_basis: What sewer usage is measured by (enum; metered_water or not_applicable).
  gas_rate_per_therm: Submetered natural gas rate (USD per therm).
  gas_base_charge_monthly: Monthly fixed gas service charge on gas-submetered plans (USD).
  electric_rate_per_kwh: Submetered electricity rate (USD per kWh).
  electric_base_charge_monthly: Monthly fixed electric service charge on electric-submetered plans (USD).
  rubs_common_area_deduction_pct: Share of the community water and sewer bill deducted for common areas before allocation (decimal fraction).
  rubs_occupant_weight: Weight of the occupant factor in the allocation formula (decimal fraction; with rubs_sqft_weight sums to 1).
  rubs_sqft_weight: Weight of square footage in the allocation formula (decimal fraction).
  rubs_occupant_factors: Occupant factor by billed occupants (mapping of occupant count to factor; 5 applies to five or more).
  rubs_max_monthly: Cap on one month's water and sewer allocation for one apartment home (USD).
  package_monthly_fee: Monthly all-inclusive utility package fee (USD).
  package_water_allowance_kgal: Water usage included in the package per month (thousand gallons).
  package_gas_allowance_therms: Gas usage included in the package per month (therms).
  package_electric_allowance_kwh: Electricity usage included in the package per month (kWh).
  package_overage_rate_multiplier: Multiplier applied to the submetered rates for usage above the package allowances (decimal).
  estimated_read_max_consecutive: Maximum consecutive estimated reads before an actual read must be obtained (integer).
  estimate_history_periods: Number of prior actual reads averaged to estimate usage (integer).
  true_up_on_actual_read: Whether the first actual read after estimates trues up the estimated usage (boolean).
  leak_adjustments_per_12_months: Leak adjustments available within the trailing 365 days (integer).
  leak_adjustment_credit_pct: Share of the excess usage charge credited by a leak adjustment (decimal fraction).
  leak_usage_threshold_multiple: Usage must reach this multiple of the average usage to qualify as a leak (decimal).
  leak_repair_proof_days: Calendar days after the disputed bill date within which the leak must have been repaired by work order (integer days).
  dispute_window_days: Calendar days after a bill line's bill date within which it may be disputed (integer days).
  dispute_response_business_days: Business days within which a dispute is decided (integer days).
  proration_method: How flat charges and allowances are prorated for partial months (enum; actual_days_in_month).
  final_bill_days_after_move_out: Calendar days after the service end date within which the final utility bill is issued (integer days).
  bill_issue_day: Day of the month on which the previous month's utility lines are issued (integer day).
  occupancy_change_effective: When a change in billed occupants takes effect (enum; next_billing_period).
  transfer_setup_fee_waived: Whether the setup fee is waived on the account opened for an in-community transfer (boolean).
  meter_test_fee: Fee for a resident-requested meter test that finds the meter within tolerance (USD).
  meter_accuracy_tolerance_pct: Maximum over-registration of a tested meter still treated as accurate (decimal fraction).
  billing_period_basis: What a billing period is (enum; calendar_month).
  occupant_count_basis: Who counts as a billed occupant (enum; persons_on_lease counts every approved occupant on the lease).

