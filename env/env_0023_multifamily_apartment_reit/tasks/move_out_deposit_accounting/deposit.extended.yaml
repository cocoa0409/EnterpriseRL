      corrected_cleaning: "So the corrected cleaning charge is the whole-unit cleaning charge less the cleaning courtesy taken on that same whole-unit cleaning charge, plus the spot-cleaning rate for each spot-cleaned room, plus the heavy-use cleaning charge, less the notice cleaning discount, rounded half up to the cent once, at the end."
