# Security Deposit Account — the deposit program that secures a lease, from funding at approval through the
# move-out inspection, the itemized final account statement, refund or balance owed, disputes and collections.
# One holding = one deposit account per lease.
category: deposit
display_name: Security Deposit Account

binding:
  holding_table: deposit_accounts
  event_tables: [deposit_transactions]
  intake_tables: [deposit_disputes]
  status_field: status
  variant_field: variant_name
  quantity_fields: {deposit_held: deposit_held_balance, balance_owed: final_balance_owed}

lifecycle:
  states: [pending_funding, held, move_out_review, disposition_issued, in_collections, closed]
  transitions:
    - {from: pending_funding, to: held, by: system, means: The required deposit (or its first installment under a signed installment arrangement, or the guarantee premium) is received.}
    - {from: pending_funding, to: closed, by: agent, means: The lease application is withdrawn or denied before any deposit is received.}
    - {from: held, to: closed, by: agent, means: The lease application is withdrawn before move-in and the deposit held is refunded in full.}
    - {from: held, to: move_out_review, by: system, means: Possession of the apartment home ends and the move-out inspection and itemization begin.}
    - {from: move_out_review, to: disposition_issued, by: agent, means: The itemized final account statement is issued and the deposit is applied, refunded or billed.}
    - {from: disposition_issued, to: move_out_review, by: agent, means: An accepted dispute reopens the itemization for an amended statement.}
    - {from: disposition_issued, to: in_collections, by: system, means: A balance owed remains unpaid past its due date and is referred to the collection agency.}
    - {from: disposition_issued, to: closed, by: system, means: The refund is paid or the balance owed is settled, and the account closes.}
    - {from: in_collections, to: closed, by: system, means: The collection agency reports the balance paid, settled or written off.}

accounts:
  - key: deposit_held_balance
    unit: USD
    meaning: Cash deposit held for the lease — initial and installment deposits and additional pet deposits, less deposit applied at final accounting and refunds; the deposit_accounts.deposit_held view.
  - key: final_balance_owed
    unit: USD
    meaning: Move-out charges left unpaid after the deposit was applied, less payments, guarantee claim proceeds and credits; the deposit_accounts.balance_owed view.

parameter_schema:
  deposit_basis: How the required cash deposit is set (enum; guarantee means no cash deposit, flat, or rent_multiple).
  deposit_flat_amount: Required cash deposit when deposit_basis is flat (USD).
  deposit_rent_multiple: Required cash deposit as a multiple of monthly rent when deposit_basis is rent_multiple (decimal).
  deposit_min_amount: Floor of the required cash deposit on a rent_multiple basis (USD).
  guarantee_premium_pct_of_coverage: Non-refundable guarantee premium per lease term, as a fraction of the guarantee coverage (decimal fraction).
  guarantee_coverage_rent_multiple: Guarantee coverage available for unpaid move-out charges, as a multiple of monthly rent at move-in (decimal).
  guarantee_claim_waiting_days: Calendar days after a balance owed falls due before a guarantee claim is filed (integer days).
  funding_due_days_after_approval: Calendar days after lease approval by which the deposit (or first installment, or premium) must be received (integer days).
  funding_required_before_move_in: Whether the account must reach held before move-in (boolean).
  installment_funding_allowed: Whether the cash deposit may be paid in installments (boolean).
  installment_max_count: Maximum installments, the first included (integer).
  installment_interval_days: Calendar days between deposit installments (integer days).
  accepted_funding_methods: Payment methods accepted for deposit funding (list of payment_method values).
  deposit_refundable: Whether amounts received under the program are refundable deposit (boolean; the guarantee premium is not).
  reduction_review_eligible: Whether the program is reviewed for a mid-lease deposit reduction (boolean).
  reduction_review_min_months: Full months since move-in after which the reduction review applies (integer months).
  reduction_review_max_late_fees: Late fee billing periods tolerated within the review window (integer).
  reduction_target_plan: Deposit program the account moves to after a successful reduction review (official deposit tier name, or not_applicable).
  disposition_statement_days: Larkspur service standard, in calendar days after move-out, for issuing the final account statement (integer days).
  refund_method_default: Refund method used when the resident has not chosen one (enum; ach_direct_deposit or paper_check).
  dispute_window_days: Calendar days after the final account statement within which an itemized line may be disputed (integer days).
  dispute_response_days: Calendar days within which a deposit dispute is decided (integer days).
  balance_owed_due_days: Calendar days after the final account statement by which a balance owed must be paid (integer days).
  collections_referral_days_after_due: Calendar days after the balance owed due date before referral to collections (integer days).
  collections_referral_includes_ledgers: Whether ledger balances left unpaid after final accounting are referred to collections together with the balance owed (boolean).
  small_balance_write_off: Balance owed at or below which the balance is written off instead of referred (USD).
  pre_move_out_inspection_offer_days: Calendar days before the intended move-out date by which a pre-move-out inspection is offered (integer days).
  photo_evidence_threshold: Itemized lines above this amount require dated move-out inspection photos on file (USD).
  cleaning_waived: Whether the move-out cleaning charge is waived under the program (boolean).
  carpet_useful_life_months: Useful life of carpet for depreciation (integer months).
  paint_useful_life_months: Useful life of interior paint for depreciation (integer months).
  flooring_useful_life_months: Useful life of vinyl plank and hard flooring for depreciation (integer months).
  blinds_useful_life_months: Useful life of window blinds for depreciation (integer months).
  appliance_useful_life_months: Useful life of kitchen and laundry appliances for depreciation (integer months).
  depreciation_method: How replacement charges are depreciated (enum; straight_line_monthly).
  repair_labor_rate_hourly: Maintenance labor rate for damage repair (USD per hour).
  min_labor_increment_hours: Labor is billed in increments of this many hours, rounded up (decimal hours).
  unreturned_fob_charge: Charge per access fob not returned at move-out (USD per fob).
  trash_removal_charge: Charge per trash or abandoned-property removal from the apartment home (USD per removal).
  carpet_spot_cleaning_per_room: Charge per room for carpet stain treatment beyond normal cleaning (USD per room).
  deposit_transfer_on_unit_transfer: Whether the deposit carries over unchanged to the apartment home of an in-community transfer (boolean).
  forwarding_address_requested: Whether the resident is asked for a forwarding address at notice and at move-out (boolean).
  unclaimed_refund_days: Calendar days after issue after which an uncashed refund check is voided and handled as unclaimed property (integer days).
  joint_refund_payee_rule: Payee of a refund when several leaseholders signed (enum; all_leaseholders pays one refund to all named leaseholders).
  pet_deposit_refundable: Whether additional pet deposits are refundable on the same basis as the deposit (boolean).
  guarantee_opt_out_allowed: Whether a household on the guarantee may switch to a cash deposit mid-lease (boolean).
  statement_delivery: How the final account statement is delivered (enum; email_and_mail).
  itemization_rounding: Rounding of every itemized amount (enum; half_up_to_cent).
  interest_on_deposit: Whether interest accrues on deposits held (boolean; none of the six states requires it).

