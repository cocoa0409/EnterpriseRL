  - id: deposit_ext_settlement_payment
    base_policy_refs: [deposit_balance_and_collections, deposit_disposition_timing]
    overwrite: []
    trigger: on_request
    subject: [deposit_balance_payment]
    computes: amount
    target_tool: pay_settlement_balance_cadbabf4
    params:
      settle_rate_top: 0.03
      settle_rate_mid: 0.02
      settle_rate_standard: 0.01
      step_closed: 0.01
      step_final: 0.005
      early_days: 14
      mid_days: 7
      settle_cap_mid: 15.00
      settle_cap_late: 10.00
    rule: >
      A former resident of an account that held a cash deposit may settle the balance owed standing on the account
      before its due date with one settlement payment the resident makes themself, through the resident portal.
      A settlement payment is taken only after every cleaning line under an accepted dispute carries its dispute
      credit on the account.
      The balance owed standing is every balance owed billed on the account less every payment received against it
      and every credit posted against it.
      The settlement payment is the balance owed standing less the settlement allowance, rounded half up to the cent.
      The settlement allowance is the settlement rate applied to the balance owed standing, rounded half up to the
      cent, and never more than settle_cap_late.
      The settlement rate is settle_rate_standard.
      The settlement rate follows the lease's late-fee record in the twenty-four full months before the handling
      date: settle_rate_top when no late fee was posted on the lease in that time and recurring autopay is enrolled on the
      lease, settle_rate_mid when exactly one late fee was posted on the lease in that time and recurring autopay is
      enrolled on the lease, and settle_rate_standard in every other case.
      A household that has squared its utility account adds a step to the settlement rate: step_closed when the
      household's utility account is closed with a zero balance, step_final when that account is in final billing
      with a zero balance, and no step when it carries a balance or is still active.
      The ceiling on the settlement allowance follows how early the payment is made: the program's
      small_balance_write_off when the payment is made at least early_days calendar days before the balance owed due
      date, settle_cap_mid when it is made at least mid_days but fewer than early_days calendar days before that date, and
      settle_cap_late when it is made fewer than mid_days calendar days before that date or later.
      The settlement rate acts on a settlement base that follows the account's dispute history: the balance owed as
      first billed, before any payment or credit, when a dispute against the statement was accepted and the
      statement was issued more than the program's disposition_statement_days after the move-out date; the balance
      owed as billed less the credits posted against it, before any payment, when a dispute against the statement
      was accepted and the statement was issued within disposition_statement_days of the move-out date; and the
      balance owed standing when no dispute against the statement was accepted.
      So the settlement allowance is the settlement rate plus its step, applied to the settlement base, rounded half
      up to the cent, and then held to its ceiling; because the ceiling never exceeds small_balance_write_off, what
      the allowance leaves unpaid is written off by a small-balance write-off credit once the balance owed falls due.
    prerequisite:
      - problem: deposit_ext_cleaning_correction_credit
        kind: value_input
        gate: credited
        form: state
        policy_source: >-
          A settlement payment is taken only after every cleaning line under an accepted dispute carries its dispute
          credit on the account.
        condition: >-
          For every deposit dispute with status accepted that is recorded against a cleaning line of the account, the
          account's transactions include a dispute credit whose source line is that cleaning line.
        resolved_by: post_cleaning_correction_credit_249da733
        effect: >-
          The dispute credit lowers the balance owed standing (the credited binding rises by the credit), so the
          settlement payment falls by the same amount; the settlement base is unchanged only when the statement was
          issued late.
    cross_category:
      - category: lease
        as: history
        reads: [autopay_enrolled, lease_charges.charge_date, lease_charges.event_type]
        note: The settlement rate takes its tier from the late fees posted on the lease in the last twenty-four months and from whether autopay is enrolled on the lease.
      - category: utility
        as: branch
        reads: [status, balance_due]
        note: The settlement-rate step takes its tier from the status and balance of the household's utility account.
    compute:
      - billed: "SUM('deposit_transactions','amount', event_type='deposit_balance_owed')"
      - paid: "SUM('deposit_transactions','amount', event_type='deposit_balance_payment')"
      - credited: "SUM('deposit_transactions','amount', event_type='deposit_balance_credit')"
      - standing: "RND(billed - paid - credited, 2)"
      - late_fees_24m: "XCOUNT('lease','lease_charges', within_months=24, date_field='charge_date', event_type='lease_late_fee')"
      - autopay: "CFIELD('lease','autopay_enrolled')"
      - settlement_rate: "K('settle_rate_top') if late_fees_24m == 0 and autopay == True else (K('settle_rate_mid') if late_fees_24m == 1 and autopay == True else K('settle_rate_standard'))"
      - utility_status: "CFIELD('utility','status')"
      - utility_balance: "CFIELD('utility','balance_due')"
      - rate_step: "K('step_closed') if utility_status == 'closed' and utility_balance == 0 else (K('step_final') if utility_status == 'final_billing' and utility_balance == 0 else 0)"
      - days_before_due: "DAYS(NOW, F('balance_due_date'))"
      - allowance_ceiling: "P('small_balance_write_off') if days_before_due >= K('early_days') else (K('settle_cap_mid') if days_before_due >= K('mid_days') else K('settle_cap_late'))"
      - accepted_disputes: "COUNT('deposit_disputes', dispute_status='accepted')"
      - statement_days: "DAYS(F('move_out_date'), F('disposition_date'))"
      - settlement_base: "billed if accepted_disputes > 0 and statement_days > P('disposition_statement_days') else (RND(billed - credited, 2) if accepted_disputes > 0 and statement_days <= P('disposition_statement_days') else standing)"
      - settlement_allowance: "MN(allowance_ceiling, RND(settlement_base * (settlement_rate + rate_step), 2))"
      - result: "RND(standing - settlement_allowance, 2)"
    compute_basis:
      billed: "The balance owed standing is every balance owed billed on the account less every payment received against it and every credit posted against it."
      paid: "The balance owed standing is every balance owed billed on the account less every payment received against it and every credit posted against it."
      credited: "The balance owed standing is every balance owed billed on the account less every payment received against it and every credit posted against it."
      standing: "The balance owed standing is every balance owed billed on the account less every payment received against it and every credit posted against it."
      late_fees_24m: "The settlement rate follows the lease's late-fee record in the twenty-four full months before the handling date"
      autopay: "recurring autopay is enrolled on the lease"
      settlement_rate: "settle_rate_top when no late fee was posted on the lease in that time and recurring autopay is enrolled on the lease, settle_rate_mid when exactly one late fee was posted on the lease in that time and recurring autopay is enrolled on the lease, and settle_rate_standard in every other case."
      utility_status: "step_closed when the household's utility account is closed with a zero balance"
      utility_balance: "step_closed when the household's utility account is closed with a zero balance"
      rate_step: "A household that has squared its utility account adds a step to the settlement rate: step_closed when the household's utility account is closed with a zero balance, step_final when that account is in final billing with a zero balance, and no step when it carries a balance or is still active."
      days_before_due: "The ceiling on the settlement allowance follows how early the payment is made"
      allowance_ceiling: "the program's small_balance_write_off when the payment is made at least early_days calendar days before the balance owed due date, settle_cap_mid when it is made at least mid_days but fewer than early_days calendar days before that date, and settle_cap_late when it is made fewer than mid_days calendar days before that date or later."
      accepted_disputes: "when a dispute against the statement was accepted"
      statement_days: "the statement was issued more than the program's disposition_statement_days after the move-out date"
      settlement_base: "The settlement rate acts on a settlement base that follows the account's dispute history: the balance owed as first billed, before any payment or credit, when a dispute against the statement was accepted and the statement was issued more than the program's disposition_statement_days after the move-out date; the balance owed as billed less the credits posted against it, before any payment, when a dispute against the statement was accepted and the statement was issued within disposition_statement_days of the move-out date; and the balance owed standing when no dispute against the statement was accepted."
      settlement_allowance: "So the settlement allowance is the settlement rate plus its step, applied to the settlement base, rounded half up to the cent, and then held to its ceiling"
      result: "The settlement payment is the balance owed standing less the settlement allowance, rounded half up to the cent."
    factors:
      - id: late_fee_record_rate
        effect: parameter
        decides: settlement_rate
        bindings: [late_fees_24m, autopay, settlement_rate]
        ladder:
          - {when: "no late fee posted on the lease in the twenty-four full months before the handling date and recurring autopay enrolled on the lease", value: "K('settle_rate_top')"}
          - {when: "exactly one late fee posted on the lease in those twenty-four months and recurring autopay enrolled on the lease", value: "K('settle_rate_mid')"}
          - {when: "any other late-fee record or no autopay", value: "K('settle_rate_standard')"}
        baseline: {settlement_rate: "K('settle_rate_standard')"}
        evidence: [cross_category, history, date]
        cross_difficulty: lease
      - id: squared_utility_step
        effect: parameter
        decides: rate_step
        bindings: [utility_status, utility_balance, rate_step]
        ladder:
          - {when: "the household's utility account is closed with a zero balance", value: "K('step_closed')"}
          - {when: "the household's utility account is in final billing with a zero balance", value: "K('step_final')"}
          - {when: "the household's utility account carries a balance or is still active", value: "0"}
        baseline: {rate_step: "0"}
        evidence: [cross_category]
        cross_difficulty: utility
      - id: early_payment_ceiling
        effect: parameter
        decides: allowance_ceiling
        bindings: [days_before_due, allowance_ceiling]
        ladder:
          - {when: "the payment is made at least early_days calendar days before the balance owed due date", value: "P('small_balance_write_off')"}
          - {when: "the payment is made at least mid_days but fewer than early_days calendar days before that date", value: "K('settle_cap_mid')"}
          - {when: "the payment is made fewer than mid_days calendar days before that date, or later", value: "K('settle_cap_late')"}
        baseline: {allowance_ceiling: "K('settle_cap_late')"}
        evidence: [date]
        cross_difficulty: null
      - id: dispute_history_base
        effect: method
        decides: settlement_base
        bindings: [accepted_disputes, statement_days, settlement_base]
        ladder:
          - {when: "a dispute against the statement was accepted and the statement was issued more than disposition_statement_days after the move-out date", method: "the rate acts on the balance owed as first billed, before any payment or credit"}
          - {when: "a dispute against the statement was accepted and the statement was issued within disposition_statement_days of the move-out date", method: "the rate acts on the balance owed as billed less the credits posted against it, before any payment"}
          - {when: "no dispute against the statement was accepted", method: "the rate acts on the balance owed standing"}
        baseline: {settlement_base: "standing"}
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The balance owed standing is every balance owed billed on the account less every payment received against it
        and every credit posted against it. The settlement payment is the balance owed standing less the settlement
        allowance, rounded half up to the cent. The settlement allowance is the settlement rate applied to the balance
        owed standing, rounded half up to the cent, and never more than settle_cap_late. The settlement rate is settle_rate_standard.
      params: [settle_rate_standard, settle_cap_late]
    inputs:
      history:
        - {table: deposit_transactions, aggregate: sum, field: amount, filters: {event_type: deposit_balance_owed}}
        - {table: deposit_transactions, aggregate: sum, field: amount, filters: {event_type: deposit_balance_payment}}
        - {table: deposit_transactions, aggregate: sum, field: amount, filters: {event_type: deposit_balance_credit}}
        - {table: deposit_disputes, aggregate: count, field: dispute_id, filters: {dispute_status: accepted}}
        - {category: lease, table: lease_charges, aggregate: count, field: charge_id, within_months: 24, filters: {event_type: lease_late_fee}}
      cross_category: [lease, utility]

  - id: deposit_ext_carpet_depreciation_credit
    base_policy_refs: [deposit_disputes_and_amendment, deposit_balance_and_collections, deposit_move_out_itemization]
    overwrite:
      - base_policy: deposit_disputes_and_amendment
        superseded_clause: >-
          withdraws the line in full
        replaced_by: >-
          A carpet replacement line under a dispute accepted because its depreciation was misapplied is not withdrawn:
          it stays on the statement at its corrected carpet charge, and the excess of the carpet charged over the
          corrected carpet charge is credited against the balance owed by one dispute credit posted against the
          disputed carpet line.
      - base_policy: deposit_move_out_itemization
        superseded_clause: >-
          A carpet, paint, flooring, blinds or appliance replacement is charged at its replacement_cost times the
          remaining useful life (the item's useful life in months from the program's useful-life parameters less
          item_age_months, never below 0) divided by that useful life, rounded half up to the cent (depreciation_method
          straight_line_monthly)
        replaced_by: >-
          So the corrected carpet charge is the carpet cost basis times the carpet's remaining share under its
          age-band convention, multiplied by the room-traffic share, then reduced by the wear allowance, rounded half
          up to the cent once, at the end.
    trigger: state_due
    subject: [deposit_balance_credit]
    computes: amount
    target_tool: post_depreciation_correction_credit_f675d6ed
    params:
      crowded_occupants: 4
      shared_occupants: 3
      life_crowded: 48
      life_shared: 54
      dog_life_cut: 6
      cat_life_cut: 3
      late_band_share: 0.75
      mid_band_share: 0.50
      age_year_months: 12
      allow_tenure_months: 48
      allow_clean: 0.12
      allow_one: 0.08
      cost_cap_compact: 1050.00
      cost_cap_mid: 1250.00
      traffic_heavy: 0.88
      traffic_moderate: 0.92
    rule: >
      A carpet replacement line under a dispute accepted because its depreciation was misapplied is not withdrawn:
      it stays on the statement at its corrected carpet charge, and the excess of the carpet charged over the
      corrected carpet charge is credited against the balance owed by one dispute credit posted against the
      disputed carpet line.
      The carpet charged is the amount of the carpet replacement line itemized on the account.
      The corrected carpet charge is the carpet cost basis times the carpet's remaining share, rounded half up to
      the cent.
      The carpet cost basis is the replacement cost recorded on the carpet line.
      The carpet's remaining share is the carpet life less the carpet's age in months recorded on the line, never
      below 0, divided by the carpet life.
      The carpet life is the program's carpet_useful_life_months.
      The carpet credit is the carpet charged less the corrected carpet charge, rounded half up to the cent.
      The carpet life follows how many people lived in the home: life_crowded months when the lease's approved
      occupants number crowded_occupants or more, life_shared months when they number exactly shared_occupants,
      and the program's carpet_useful_life_months when they number fewer than shared_occupants.
      An animal in the home shortens the carpet life further: by dog_life_cut months when a dog was registered on
      the lease, as a pet or as an assistance animal, by cat_life_cut months when a cat was registered and no dog
      was, and by nothing when neither was.
      The carpet's age band sets the depreciation convention of its remaining share: a carpet whose recorded age is
      at least late_band_share of the carpet life is depreciated on the declining convention, its remaining share
      being the straight-line remaining share multiplied by itself; a carpet whose age is at least mid_band_share
      but less than late_band_share of that life is depreciated on the whole-year convention, its age being rounded up to a whole multiple of age_year_months months, an age already on a whole multiple staying as it is, before the straight-line remaining share is taken;
      a younger carpet keeps its straight-line remaining share on its recorded age in months.
      A long tenancy earns a wear allowance, a share of the corrected carpet charge that is not charged: allow_clean
      for a tenancy of at least allow_tenure_months full months from the lease's move-in date to its move-out date
      with no late fee posted on the lease fewer than twenty-four full months before the handling date, allow_one
      for a tenancy of at least allow_tenure_months full months with exactly one late fee posted in those
      twenty-four months, and none for any other tenancy.
      The carpet cost basis is held to a like-for-like cost for the floor plan: at most cost_cap_compact for the
      Studio Residence or the One-Bedroom Residence, at most cost_cap_mid for the One-Bedroom Den Residence or the
      Two-Bedroom Residence, and the recorded replacement cost for the Three-Bedroom Residence or the Penthouse
      Residence.
      The room the carpet lay in sets a room-traffic share: traffic_heavy for a carpet in the living_room, the
      dining_area or the entry, traffic_moderate for a carpet in the den, and 1 (the charge in full) for a carpet in
      any other room.
      So the corrected carpet charge is the carpet cost basis times the carpet's remaining share under its age-band
      convention, multiplied by the room-traffic share, then reduced by the wear allowance, rounded half up to the
      cent once, at the end.
    prerequisite: []
    cross_category:
      - category: lease
        as: history
        reads: [occupants_count, move_in_date, variant_name, lease_charges.charge_date, lease_charges.event_type]
        note: The carpet life, the wear allowance and the like-for-like cost take their tiers from the lease's approved occupants, its tenancy months and late fees, and its floor plan.
      - category: pet
        as: existence
        reads: [species]
        note: The animal cut to the carpet life takes its tier from whether a dog or a cat was registered on the lease.
    compute:
      - carpet_charged: "SUM('deposit_transactions','amount', event_type='deposit_move_out_charge', line_category='carpet_replacement')"
      - carpet_cost: "SUM('deposit_transactions','replacement_cost', event_type='deposit_move_out_charge', line_category='carpet_replacement')"
      - occupants: "CFIELD('lease','occupants_count')"
      - occupancy_life: "K('life_crowded') if occupants >= K('crowded_occupants') else (K('life_shared') if occupants == K('shared_occupants') else P('carpet_useful_life_months'))"
      - carpet_dog: "EXISTS('pet', species='dog')"
      - carpet_cat: "EXISTS('pet', species='cat')"
      - pet_life_cut: "K('dog_life_cut') if carpet_dog else (K('cat_life_cut') if carpet_cat and not carpet_dog else 0)"
      - life_used: "occupancy_life - pet_life_cut"
      - carpet_age: "SUM('deposit_transactions','item_age_months', event_type='deposit_move_out_charge', line_category='carpet_replacement')"
      - worn_share: "carpet_age / life_used"
      - remaining_share: "(MX(0, life_used - carpet_age) / life_used) * (MX(0, life_used - carpet_age) / life_used) if worn_share >= K('late_band_share') else (MX(0, life_used - ((carpet_age + K('age_year_months') - 1) // K('age_year_months')) * K('age_year_months')) / life_used if worn_share >= K('mid_band_share') else MX(0, life_used - carpet_age) / life_used)"
      - tenure_months: "MONTHS(CFIELD('lease','move_in_date'), F('move_out_date'))"
      - late_fees_24m: "XCOUNT('lease','lease_charges', within_months=24, date_field='charge_date', event_type='lease_late_fee')"
      - wear_allowance: "K('allow_clean') if tenure_months >= K('allow_tenure_months') and late_fees_24m == 0 else (K('allow_one') if tenure_months >= K('allow_tenure_months') and late_fees_24m == 1 else 0)"
      - floor_plan: "CFIELD('lease','variant_name')"
      - cost_basis: "MN(carpet_cost, K('cost_cap_compact')) if floor_plan == 'Studio Residence' or floor_plan == 'One-Bedroom Residence' else (MN(carpet_cost, K('cost_cap_mid')) if floor_plan == 'One-Bedroom Den Residence' or floor_plan == 'Two-Bedroom Residence' else carpet_cost)"
      - carpet_room: "LATEST('deposit_transactions','item_location', date_field='transaction_date', event_type='deposit_move_out_charge', line_category='carpet_replacement')"
      - traffic_share: "K('traffic_heavy') if carpet_room == 'living_room' or carpet_room == 'dining_area' or carpet_room == 'entry' else (K('traffic_moderate') if carpet_room == 'den' else 1)"
      - corrected_carpet: "RND(cost_basis * remaining_share * traffic_share * (1 - wear_allowance), 2)"
      - result: "RND(carpet_charged - corrected_carpet, 2)"
    compute_basis:
      carpet_charged: "The carpet charged is the amount of the carpet replacement line itemized on the account."
      carpet_cost: "The carpet cost basis is the replacement cost recorded on the carpet line."
      occupants: "when the lease's approved occupants number crowded_occupants or more"
      occupancy_life: "The carpet life follows how many people lived in the home: life_crowded months when the lease's approved occupants number crowded_occupants or more, life_shared months when they number exactly shared_occupants, and the program's carpet_useful_life_months when they number fewer than shared_occupants."
      carpet_dog: "by dog_life_cut months when a dog was registered on the lease, as a pet or as an assistance animal"
      carpet_cat: "by cat_life_cut months when a cat was registered and no dog was"
      pet_life_cut: "An animal in the home shortens the carpet life further: by dog_life_cut months when a dog was registered on the lease, as a pet or as an assistance animal, by cat_life_cut months when a cat was registered and no dog was, and by nothing when neither was."
      life_used: "An animal in the home shortens the carpet life further"
      carpet_age: "The carpet's remaining share is the carpet life less the carpet's age in months recorded on the line, never below 0, divided by the carpet life."
      worn_share: "a carpet whose recorded age is at least late_band_share of the carpet life"
      remaining_share: "The carpet's age band sets the depreciation convention of its remaining share: a carpet whose recorded age is at least late_band_share of the carpet life is depreciated on the declining convention, its remaining share being the straight-line remaining share multiplied by itself; a carpet whose age is at least mid_band_share but less than late_band_share of that life is depreciated on the whole-year convention, its age being rounded up to a whole multiple of age_year_months months, an age already on a whole multiple staying as it is, before the straight-line remaining share is taken; a younger carpet keeps its straight-line remaining share on its recorded age in months."
      tenure_months: "a tenancy of at least allow_tenure_months full months from the lease's move-in date to its move-out date"
      late_fees_24m: "with no late fee posted on the lease fewer than twenty-four full months before the handling date"
      wear_allowance: "A long tenancy earns a wear allowance, a share of the corrected carpet charge that is not charged: allow_clean for a tenancy of at least allow_tenure_months full months from the lease's move-in date to its move-out date with no late fee posted on the lease fewer than twenty-four full months before the handling date, allow_one for a tenancy of at least allow_tenure_months full months with exactly one late fee posted in those twenty-four months, and none for any other tenancy."
      floor_plan: "The carpet cost basis is held to a like-for-like cost for the floor plan"
      cost_basis: "The carpet cost basis is held to a like-for-like cost for the floor plan: at most cost_cap_compact for the Studio Residence or the One-Bedroom Residence, at most cost_cap_mid for the One-Bedroom Den Residence or the Two-Bedroom Residence, and the recorded replacement cost for the Three-Bedroom Residence or the Penthouse Residence."
      carpet_room: "The room the carpet lay in sets a room-traffic share"
      traffic_share: "The room the carpet lay in sets a room-traffic share: traffic_heavy for a carpet in the living_room, the dining_area or the entry, traffic_moderate for a carpet in the den, and 1 (the charge in full) for a carpet in any other room."
      corrected_carpet: "So the corrected carpet charge is the carpet cost basis times the carpet's remaining share under its age-band convention, multiplied by the room-traffic share, then reduced by the wear allowance, rounded half up to the cent once, at the end."
      result: "The carpet credit is the carpet charged less the corrected carpet charge, rounded half up to the cent."
    factors:
      - id: occupancy_carpet_life
        effect: parameter
        decides: occupancy_life
        bindings: [occupants, occupancy_life]
        ladder:
          - {when: "the lease's approved occupants number crowded_occupants or more", value: "K('life_crowded')"}
          - {when: "the lease's approved occupants number exactly shared_occupants", value: "K('life_shared')"}
          - {when: "the lease's approved occupants number fewer than shared_occupants", value: "P('carpet_useful_life_months')"}
        baseline: {occupancy_life: "P('carpet_useful_life_months')"}
        evidence: [cross_category]
        cross_difficulty: lease
      - id: animal_carpet_life_cut
        effect: parameter
        decides: pet_life_cut
        bindings: [carpet_dog, carpet_cat, pet_life_cut]
        ladder:
          - {when: "a dog was registered on the lease, as a pet or as an assistance animal", value: "K('dog_life_cut')"}
          - {when: "a cat was registered on the lease and no dog was", value: "K('cat_life_cut')"}
          - {when: "neither a dog nor a cat was registered on the lease", value: "0"}
        baseline: {pet_life_cut: "0"}
        evidence: [cross_category]
        cross_difficulty: pet
      - id: carpet_age_band
        effect: method
        decides: remaining_share
        bindings: [carpet_age, worn_share, remaining_share]
        ladder:
          - {when: "the carpet's recorded age is at least late_band_share of the carpet life", method: "declining convention: the straight-line remaining share multiplied by itself"}
          - {when: "the carpet's recorded age is at least mid_band_share but less than late_band_share of the carpet life", method: "whole-year convention: the age rounded up to a whole multiple of age_year_months months (an age already on one stays as it is), then the straight-line remaining share"}
          - {when: "the carpet's recorded age is less than mid_band_share of the carpet life", method: "straight-line remaining share on the recorded age in months"}
        baseline: {remaining_share: "MX(0, life_used - carpet_age) / life_used"}
        evidence: [history]
        cross_difficulty: null
      - id: tenancy_carpet_wear_allowance
        effect: parameter
        decides: wear_allowance
        bindings: [tenure_months, late_fees_24m, wear_allowance]
        ladder:
          - {when: "a tenancy of at least allow_tenure_months full months and no late fee on the lease in the twenty-four months before the handling date", value: "K('allow_clean')"}
          - {when: "a tenancy of at least allow_tenure_months full months and exactly one late fee on the lease in those twenty-four months", value: "K('allow_one')"}
          - {when: "any other tenancy", value: "0"}
        baseline: {wear_allowance: "0"}
        evidence: [cross_category, date, history]
        cross_difficulty: lease
      - id: like_for_like_carpet_cost
        effect: parameter
        decides: cost_basis
        bindings: [floor_plan, cost_basis]
        ladder:
          - {when: "the lease's floor plan is the Studio Residence or the One-Bedroom Residence", value: "at most K('cost_cap_compact')"}
          - {when: "the lease's floor plan is the One-Bedroom Den Residence or the Two-Bedroom Residence", value: "at most K('cost_cap_mid')"}
          - {when: "the lease's floor plan is the Three-Bedroom Residence or the Penthouse Residence", value: "the recorded replacement cost"}
        baseline: {cost_basis: "carpet_cost"}
        evidence: [cross_category]
        cross_difficulty: lease
      - id: carpet_room_traffic
        effect: parameter
        decides: traffic_share
        bindings: [carpet_room, traffic_share]
        ladder:
          - {when: "the carpet lay in the living_room, the dining_area or the entry", value: "K('traffic_heavy')"}
          - {when: "the carpet lay in the den", value: "K('traffic_moderate')"}
          - {when: "the carpet lay in any other room", value: "1"}
        baseline: {traffic_share: "1"}
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The carpet charged is the amount of the carpet replacement line itemized on the account. The corrected carpet
        charge is the carpet cost basis times the carpet's remaining share, rounded half up to the cent. The carpet cost
        basis is the replacement cost recorded on the carpet line. The carpet's remaining share is the carpet life less
        the carpet's age in months recorded on the line, never below 0, divided by the carpet life. The carpet life is
        the program's carpet_useful_life_months. The carpet credit is the carpet charged less the corrected carpet
        charge, rounded half up to the cent.
      params: [carpet_useful_life_months]
    inputs:
      history:
        - {table: deposit_transactions, aggregate: sum, field: amount, filters: {event_type: deposit_move_out_charge, line_category: carpet_replacement}}
        - {table: deposit_transactions, aggregate: sum, field: replacement_cost, filters: {event_type: deposit_move_out_charge, line_category: carpet_replacement}}
        - {table: deposit_transactions, aggregate: sum, field: item_age_months, filters: {event_type: deposit_move_out_charge, line_category: carpet_replacement}}
        - {table: deposit_transactions, aggregate: latest, field: item_location, filters: {event_type: deposit_move_out_charge, line_category: carpet_replacement}}
        - {category: lease, table: lease_charges, aggregate: count, field: charge_id, within_months: 24, filters: {event_type: lease_late_fee}}
      cross_category: [lease, pet]

  - id: deposit_ext_repair_labor_credit
    base_policy_refs: [deposit_disputes_and_amendment, deposit_balance_and_collections, deposit_move_out_itemization]
    overwrite:
      - base_policy: deposit_disputes_and_amendment
        superseded_clause: >-
          withdraws the line in full
        replaced_by: >-
          A damage repair line under a dispute accepted because its labor was misapplied is not withdrawn: it stays on
          the statement at its corrected repair charge, and the excess of the repair charged over the corrected repair
          charge, together with any dispute goodwill, is credited against the balance owed by one dispute credit posted
          against the disputed repair line.
      - base_policy: deposit_move_out_itemization
        superseded_clause: >-
          A damage_repair line is labor_hours, rounded up to min_labor_increment_hours, times repair_labor_rate_hourly,
          plus the parts cost recorded in replacement_cost.
        replaced_by: >-
          So the corrected repair charge is the billable hours times the labor rate, reduced by the notice discount,
          plus the parts cost times the parts share, rounded half up to the cent once, at the end
    trigger: state_due
    subject: [deposit_balance_credit]
    computes: amount
    target_tool: post_repair_labor_credit_05a989cb
    params:
      loyal_tenure_months: 48
      rate_loyal: 52.00
      rate_steady: 58.50
      late_itemization_days: 14
      unphotographed_hours_cap: 2.0
      parts_wet: 0.80
      parts_living: 0.90
      long_notice_days: 60
      short_notice_days: 30
      notice_long_discount: 0.10
      notice_short_discount: 0.05
      prompt_dispute_days: 7
      timely_dispute_days: 14
      goodwill_prompt: 20.00
      goodwill_timely: 10.00
    rule: >
      A damage repair line under a dispute accepted because its labor was misapplied is not withdrawn: it stays on
      the statement at its corrected repair charge, and the excess of the repair charged over the corrected repair
      charge, together with any dispute goodwill, is credited against the balance owed by one dispute credit posted
      against the disputed repair line.
      The repair charged is the amount of the damage repair line itemized on the account.
      The corrected repair charge is the labor hours recorded on the repair line times the labor rate, plus the
      parts cost recorded on the line, rounded half up to the cent.
      The labor rate is the program's repair_labor_rate_hourly.
      The repair credit is the repair charged less the corrected repair charge, rounded half up to the cent.
      The labor rate follows the tenancy and its payment record: rate_loyal for a tenancy of at least
      loyal_tenure_months full months from the lease's move-in date to its move-out date with no returned payment
      dated on the lease fewer than twelve full months before the handling date, rate_steady for a tenancy of at
      least loyal_tenure_months full months with exactly one returned payment dated in those twelve months, and the
      program's repair_labor_rate_hourly for any other tenancy.
      The billable hours follow when and how the repair was documented: a repair line itemized more than
      late_itemization_days calendar days after the move-out date with dated photos on file is billed for its
      recorded hours rounded down to a whole hour; a repair line itemized more than late_itemization_days calendar
      days after the move-out date without dated photos is billed for its recorded hours but never more than
      unphotographed_hours_cap hours; a repair line itemized within late_itemization_days calendar days of the
      move-out date is billed for its recorded hours.
      The parts cost is charged at a parts share that follows the room repaired: parts_wet for a repair in the
      kitchen, bathroom_1 or bathroom_2, parts_living for a repair in the living_room, the dining_area, the den or
      the entry, and 1 (the parts cost in full) for a repair in any other room.
      Notice given earns a notice discount on the labor: notice_long_discount when the resident's written notice to
      vacate on the lease's completed last term was received at least long_notice_days calendar days before the move-out
      date, notice_short_discount when it was received at least short_notice_days but fewer than long_notice_days
      calendar days before it, and none when it was received later or no notice is on file.
      A prompt dispute earns dispute goodwill added to the repair credit: goodwill_prompt when the latest dispute
      recorded against the statement was submitted no more than prompt_dispute_days calendar days after the
      statement date, goodwill_timely when it was submitted more than prompt_dispute_days but no more than
      timely_dispute_days calendar days after it, and none when it was submitted later.
      So the corrected repair charge is the billable hours times the labor rate, reduced by the notice discount,
      plus the parts cost times the parts share, rounded half up to the cent once, at the end; and the repair
      credit is the repair charged less the corrected repair charge, plus the dispute goodwill, rounded half up to
      the cent.
    prerequisite: []
    cross_category:
      - category: lease
        as: history
        reads: [move_in_date, lease_payments.payment_date, lease_payments.event_type]
        note: The labor rate takes its tier from the tenancy months and the returned payments on the lease in the last twelve months.
      - category: term
        as: branch
        reads: [notice_to_vacate_date, status]
        note: The notice discount takes its tier from the date the written notice to vacate on the last term was received.
    compute:
      - repair_charged: "SUM('deposit_transactions','amount', event_type='deposit_move_out_charge', line_category='damage_repair')"
      - repair_hours: "SUM('deposit_transactions','labor_hours', event_type='deposit_move_out_charge', line_category='damage_repair')"
      - repair_parts: "SUM('deposit_transactions','replacement_cost', event_type='deposit_move_out_charge', line_category='damage_repair')"
      - repair_tenure_months: "MONTHS(CFIELD('lease','move_in_date'), F('move_out_date'))"
      - repair_returns_12m: "XCOUNT('lease','lease_payments', within_months=12, date_field='payment_date', event_type='lease_payment_return')"
      - labor_rate: "K('rate_loyal') if repair_tenure_months >= K('loyal_tenure_months') and repair_returns_12m == 0 else (K('rate_steady') if repair_tenure_months >= K('loyal_tenure_months') and repair_returns_12m == 1 else P('repair_labor_rate_hourly'))"
      - repair_itemized_on: "LATEST('deposit_transactions','transaction_date', date_field='transaction_date', event_type='deposit_move_out_charge', line_category='damage_repair')"
      - repair_itemized_days: "DAYS(F('move_out_date'), repair_itemized_on)"
      - repair_photos: "SUM('deposit_transactions','inspection_photo_on_file', event_type='deposit_move_out_charge', line_category='damage_repair')"
      - billable_hours: "int(repair_hours) if repair_itemized_days > K('late_itemization_days') and repair_photos > 0 else (MN(repair_hours, K('unphotographed_hours_cap')) if repair_itemized_days > K('late_itemization_days') and repair_photos == 0 else repair_hours)"
      - repair_room: "LATEST('deposit_transactions','item_location', date_field='transaction_date', event_type='deposit_move_out_charge', line_category='damage_repair')"
      - parts_share: "K('parts_wet') if repair_room == 'kitchen' or repair_room == 'bathroom_1' or repair_room == 'bathroom_2' else (K('parts_living') if repair_room == 'living_room' or repair_room == 'dining_area' or repair_room == 'den' or repair_room == 'entry' else 1)"
      - notice_received: "CFIELD('term','notice_to_vacate_date', status='completed')"
      - notice_days: "DAYS(notice_received, F('move_out_date')) if notice_received else 0"
      - notice_discount: "K('notice_long_discount') if notice_days >= K('long_notice_days') else (K('notice_short_discount') if notice_days >= K('short_notice_days') else 0)"
      - last_dispute_at: "LATEST('deposit_disputes','created_at', date_field='created_at')"
      - dispute_lag_days: "DAYS(F('disposition_date'), last_dispute_at)"
      - dispute_goodwill: "K('goodwill_prompt') if dispute_lag_days <= K('prompt_dispute_days') else (K('goodwill_timely') if dispute_lag_days <= K('timely_dispute_days') else 0)"
      - corrected_repair: "RND(billable_hours * labor_rate * (1 - notice_discount) + repair_parts * parts_share, 2)"
      - result: "RND(repair_charged - corrected_repair + dispute_goodwill, 2)"
    compute_basis:
      repair_charged: "The repair charged is the amount of the damage repair line itemized on the account."
      repair_hours: "The corrected repair charge is the labor hours recorded on the repair line times the labor rate, plus the parts cost recorded on the line, rounded half up to the cent."
      repair_parts: "The corrected repair charge is the labor hours recorded on the repair line times the labor rate, plus the parts cost recorded on the line, rounded half up to the cent."
      repair_tenure_months: "a tenancy of at least loyal_tenure_months full months from the lease's move-in date to its move-out date"
      repair_returns_12m: "with no returned payment dated on the lease fewer than twelve full months before the handling date"
      labor_rate: "The labor rate follows the tenancy and its payment record: rate_loyal for a tenancy of at least loyal_tenure_months full months from the lease's move-in date to its move-out date with no returned payment dated on the lease fewer than twelve full months before the handling date, rate_steady for a tenancy of at least loyal_tenure_months full months with exactly one returned payment dated in those twelve months, and the program's repair_labor_rate_hourly for any other tenancy."
      repair_itemized_on: "a repair line itemized more than late_itemization_days calendar days after the move-out date"
      repair_itemized_days: "a repair line itemized more than late_itemization_days calendar days after the move-out date"
      repair_photos: "with dated photos on file"
      billable_hours: "The billable hours follow when and how the repair was documented: a repair line itemized more than late_itemization_days calendar days after the move-out date with dated photos on file is billed for its recorded hours rounded down to a whole hour; a repair line itemized more than late_itemization_days calendar days after the move-out date without dated photos is billed for its recorded hours but never more than unphotographed_hours_cap hours; a repair line itemized within late_itemization_days calendar days of the move-out date is billed for its recorded hours."
      repair_room: "The parts cost is charged at a parts share that follows the room repaired"
      parts_share: "The parts cost is charged at a parts share that follows the room repaired: parts_wet for a repair in the kitchen, bathroom_1 or bathroom_2, parts_living for a repair in the living_room, the dining_area, the den or the entry, and 1 (the parts cost in full) for a repair in any other room."
      notice_received: "the resident's written notice to vacate on the lease's completed last term was received"
      notice_days: "at least long_notice_days calendar days before the move-out date"
      notice_discount: "Notice given earns a notice discount on the labor: notice_long_discount when the resident's written notice to vacate on the lease's completed last term was received at least long_notice_days calendar days before the move-out date, notice_short_discount when it was received at least short_notice_days but fewer than long_notice_days calendar days before it, and none when it was received later or no notice is on file."
      last_dispute_at: "the latest dispute recorded against the statement was submitted"
      dispute_lag_days: "no more than prompt_dispute_days calendar days after the statement date"
      dispute_goodwill: "A prompt dispute earns dispute goodwill added to the repair credit: goodwill_prompt when the latest dispute recorded against the statement was submitted no more than prompt_dispute_days calendar days after the statement date, goodwill_timely when it was submitted more than prompt_dispute_days but no more than timely_dispute_days calendar days after it, and none when it was submitted later."
      corrected_repair: "So the corrected repair charge is the billable hours times the labor rate, reduced by the notice discount, plus the parts cost times the parts share, rounded half up to the cent once, at the end"
      result: "and the repair credit is the repair charged less the corrected repair charge, plus the dispute goodwill, rounded half up to the cent."
    factors:
      - id: tenancy_labor_rate
        effect: parameter
        decides: labor_rate
        bindings: [repair_tenure_months, repair_returns_12m, labor_rate]
        ladder:
          - {when: "a tenancy of at least loyal_tenure_months full months and no returned payment on the lease in the twelve months before the handling date", value: "K('rate_loyal')"}
          - {when: "a tenancy of at least loyal_tenure_months full months and exactly one returned payment on the lease in those twelve months", value: "K('rate_steady')"}
          - {when: "any other tenancy", value: "P('repair_labor_rate_hourly')"}
        baseline: {labor_rate: "P('repair_labor_rate_hourly')"}
        evidence: [cross_category, date, history]
        cross_difficulty: lease
      - id: documented_billable_hours
        effect: method
        decides: billable_hours
        bindings: [repair_itemized_on, repair_itemized_days, repair_photos, billable_hours]
        ladder:
          - {when: "the repair line was itemized more than late_itemization_days calendar days after the move-out date with dated photos on file", method: "the recorded hours are rounded down to a whole hour"}
          - {when: "the repair line was itemized more than late_itemization_days calendar days after the move-out date without dated photos", method: "the recorded hours are billed but never more than unphotographed_hours_cap hours"}
          - {when: "the repair line was itemized within late_itemization_days calendar days of the move-out date", method: "the recorded hours are billed as recorded"}
        baseline: {billable_hours: "repair_hours"}
        evidence: [history, date]
        cross_difficulty: null
      - id: repaired_room_parts_share
        effect: parameter
        decides: parts_share
        bindings: [repair_room, parts_share]
        ladder:
          - {when: "the repair was in the kitchen, bathroom_1 or bathroom_2", value: "K('parts_wet')"}
          - {when: "the repair was in the living_room, the dining_area, the den or the entry", value: "K('parts_living')"}
          - {when: "the repair was in any other room", value: "1"}
        baseline: {parts_share: "1"}
        evidence: [history]
        cross_difficulty: null
      - id: notice_labor_discount
        effect: parameter
        decides: notice_discount
        bindings: [notice_received, notice_days, notice_discount]
        ladder:
          - {when: "the written notice to vacate on the last term was received at least long_notice_days calendar days before the move-out date", value: "K('notice_long_discount')"}
          - {when: "it was received at least short_notice_days but fewer than long_notice_days calendar days before the move-out date", value: "K('notice_short_discount')"}
          - {when: "it was received later, or no notice is on file", value: "0"}
        baseline: {notice_discount: "0"}
        evidence: [cross_category, date]
        cross_difficulty: term
      - id: prompt_dispute_goodwill
        effect: parameter
        decides: dispute_goodwill
        bindings: [last_dispute_at, dispute_lag_days, dispute_goodwill]
        ladder:
          - {when: "the latest dispute against the statement was submitted no more than prompt_dispute_days calendar days after the statement date", value: "K('goodwill_prompt')"}
          - {when: "it was submitted more than prompt_dispute_days but no more than timely_dispute_days calendar days after the statement date", value: "K('goodwill_timely')"}
          - {when: "it was submitted later", value: "0"}
        baseline: {dispute_goodwill: "0"}
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The repair charged is the amount of the damage repair line itemized on the account. The corrected repair charge
        is the labor hours recorded on the repair line times the labor rate, plus the parts cost recorded on the line,
        rounded half up to the cent. The labor rate is the program's repair_labor_rate_hourly. The repair credit is the
        repair charged less the corrected repair charge, rounded half up to the cent.
      params: [repair_labor_rate_hourly]
    inputs:
      history:
        - {table: deposit_transactions, aggregate: sum, field: amount, filters: {event_type: deposit_move_out_charge, line_category: damage_repair}}
        - {table: deposit_transactions, aggregate: sum, field: labor_hours, filters: {event_type: deposit_move_out_charge, line_category: damage_repair}}
        - {table: deposit_transactions, aggregate: sum, field: replacement_cost, filters: {event_type: deposit_move_out_charge, line_category: damage_repair}}
        - {table: deposit_disputes, aggregate: latest, field: created_at, filters: {}}
        - {category: lease, table: lease_payments, aggregate: count, field: payment_id, within_months: 12, filters: {event_type: lease_payment_return}}
      cross_category: [lease, term]

  - id: deposit_ext_fob_count_credit
    base_policy_refs: [deposit_disputes_and_amendment, deposit_balance_and_collections, deposit_move_out_itemization]
    overwrite:
      - base_policy: deposit_disputes_and_amendment
        superseded_clause: >-
          withdraws the line in full
        replaced_by: >-
          An unreturned-fob line under a dispute accepted because its fob charge was misapplied is not withdrawn: it
          stays on the statement at its corrected fob charge, and the excess of the fob charge over the corrected fob
          charge is credited against the balance owed by one dispute credit posted against the disputed fob line.
      - base_policy: deposit_move_out_itemization
        superseded_clause: >-
          Unreturned fobs are quantity times unreturned_fob_charge
        replaced_by: >-
          So the corrected fob charge is the reckoned fobs less the forgiven fobs, times the per-fob charge, less the
          fob courtesy, never below 0, rounded half up to the cent once, at the end.
    trigger: state_due
    subject: [deposit_balance_credit]
    computes: amount
    target_tool: post_fob_count_credit_b88884f4
    params:
      garage_fob_rate: 95.00
      ev_fob_rate: 85.00
      courtesy_both: 55.00
      courtesy_either: 25.00
      late_statement_days: 25
      gate_fobs_with_license: 1
      forgiveness_long_months: 48
      forgiveness_mid_months: 24
      forgiven_fobs_long: 1
      forgiven_fobs_mid: 0.5
    rule: >
      An unreturned-fob line under a dispute accepted because its fob charge was misapplied is not withdrawn: it
      stays on the statement at its corrected fob charge, and the excess of the fob charge over the corrected fob
      charge is credited against the balance owed by one dispute credit posted against the disputed fob line.
      The fob charge is the amount of the unreturned-fob line itemized on the account.
      The corrected fob charge is the countable fobs times the per-fob charge, rounded half up to the cent.
      The countable fobs are the fob count recorded on the line, never more than the fobs the household held.
      The fobs the household held are the floor plan's fobs issued at move-in, plus the fobs bought on the lease
      ledger during the tenancy, the fobs bought being the key fob fees billed on the lease ledger divided by the
      floor plan's key_fob_replacement_fee, plus gate_fobs_with_license gate fob issued with a parking license when
      the household held one.
      The per-fob charge is the program's unreturned_fob_charge.
      The fob credit is the fob charge less the corrected fob charge, rounded half up to the cent.
      A long tenancy forgives unreturned fobs, taken off the reckoned fobs: forgiven_fobs_long fob for a tenancy of
      at least forgiveness_long_months full months from the lease's move-in date to its move-out date,
      forgiven_fobs_mid of a fob for a tenancy of at least forgiveness_mid_months but fewer than
      forgiveness_long_months full months, and none for a shorter tenancy.
      The per-fob charge follows the parking the fob opened: garage_fob_rate when the household held a Structured
      Garage Space or a Private Detached Garage license, ev_fob_rate when it held an EV Charging Reserved Space
      license, and the program's unreturned_fob_charge otherwise.
      A household that kept its lease in good order earns a fob courtesy taken off the fob charge: courtesy_both when
      recurring autopay is enrolled on the lease and renter's insurance is on file, courtesy_either when exactly one
      of the two holds, and none when neither does.
      A late statement changes how the countable fobs are reckoned: when the statement was issued more than
      late_statement_days calendar days after the move-out date, the countable fobs are halved and rounded down to a
      whole fob; when it was issued more than the program's disposition_statement_days but no more than
      late_statement_days calendar days after the move-out date, one fob fewer than the countable fobs is charged,
      never fewer than none; when it was issued within disposition_statement_days, the countable fobs are charged as
      counted.
      So the corrected fob charge is the reckoned fobs less the forgiven fobs, times the per-fob charge, less the
      fob courtesy, never below 0, rounded half up to the cent once, at the end.
    prerequisite: []
    cross_category:
      - category: lease
        as: history
        reads: [fobs_issued_at_move_in, key_fob_replacement_fee, move_in_date, autopay_enrolled, insurance_on_file, lease_charges.amount, lease_charges.charge_code]
        note: The forgiven fobs take their tier from the tenancy months; the fob courtesy reads autopay and renter's insurance on the lease; the fobs held read the floor plan's fobs issued at move-in and the key fob fees billed on the lease ledger.
      - category: parking
        as: branch
        reads: [variant_name]
        note: The per-fob charge takes its tier from the parking product licensed; a held parking license adds its gate fob to the fobs held.
    compute:
      - fob_charged: "SUM('deposit_transactions','amount', event_type='deposit_move_out_charge', line_category='unreturned_fob')"
      - fob_count: "SUM('deposit_transactions','quantity', event_type='deposit_move_out_charge', line_category='unreturned_fob')"
      - fobs_issued: "CPARAM('lease','fobs_issued_at_move_in')"
      - fob_fees_billed: "XSUM('lease','lease_charges','amount', charge_code='key_fob_replacement_fee')"
      - fobs_bought: "int(RND(fob_fees_billed / CPARAM('lease','key_fob_replacement_fee'), 0))"
      - holds_parking_license: "EXISTS('parking')"
      - fob_allotment: "fobs_issued + fobs_bought + (K('gate_fobs_with_license') if holds_parking_license else 0)"
      - countable_fobs: "MN(fob_count, fob_allotment)"
      - parking_product: "CFIELD('parking','variant_name')"
      - fob_rate: "K('garage_fob_rate') if parking_product == 'Structured Garage Space' or parking_product == 'Private Detached Garage' else (K('ev_fob_rate') if parking_product == 'EV Charging Reserved Space' else P('unreturned_fob_charge'))"
      - fob_autopay: "CFIELD('lease','autopay_enrolled')"
      - fob_insurance: "CFIELD('lease','insurance_on_file')"
      - fob_courtesy: "K('courtesy_both') if fob_autopay == True and fob_insurance == True else (K('courtesy_either') if fob_autopay == True or fob_insurance == True else 0)"
      - statement_lag_days: "DAYS(F('move_out_date'), F('disposition_date'))"
      - reckoned_fobs: "countable_fobs // 2 if statement_lag_days > K('late_statement_days') else (MX(0, countable_fobs - 1) if statement_lag_days > P('disposition_statement_days') else countable_fobs)"
      - fob_tenure_months: "MONTHS(CFIELD('lease','move_in_date'), F('move_out_date'))"
      - forgiven_fobs: "K('forgiven_fobs_long') if fob_tenure_months >= K('forgiveness_long_months') else (K('forgiven_fobs_mid') if fob_tenure_months >= K('forgiveness_mid_months') else 0)"
      - corrected_fob: "RND(MX(0, (reckoned_fobs - forgiven_fobs) * fob_rate - fob_courtesy), 2)"
      - result: "RND(fob_charged - corrected_fob, 2)"
    compute_basis:
      fob_charged: "The fob charge is the amount of the unreturned-fob line itemized on the account."
      fob_count: "The countable fobs are the fob count recorded on the line, never more than the fobs the household held."
      fobs_issued: "The fobs the household held are the floor plan's fobs issued at move-in"
      fob_fees_billed: "the fobs bought being the key fob fees billed on the lease ledger divided by the floor plan's key_fob_replacement_fee"
      fobs_bought: "the fobs bought being the key fob fees billed on the lease ledger divided by the floor plan's key_fob_replacement_fee"
      holds_parking_license: "plus gate_fobs_with_license gate fob issued with a parking license when the household held one"
      fob_allotment: "The fobs the household held are the floor plan's fobs issued at move-in, plus the fobs bought on the lease ledger during the tenancy, the fobs bought being the key fob fees billed on the lease ledger divided by the floor plan's key_fob_replacement_fee, plus gate_fobs_with_license gate fob issued with a parking license when the household held one."
      fob_tenure_months: "a tenancy of at least forgiveness_long_months full months from the lease's move-in date to its move-out date"
      forgiven_fobs: "A long tenancy forgives unreturned fobs, taken off the reckoned fobs: forgiven_fobs_long fob for a tenancy of at least forgiveness_long_months full months from the lease's move-in date to its move-out date, forgiven_fobs_mid of a fob for a tenancy of at least forgiveness_mid_months but fewer than forgiveness_long_months full months, and none for a shorter tenancy."
      countable_fobs: "The countable fobs are the fob count recorded on the line, never more than the fobs the household held."
      parking_product: "The per-fob charge follows the parking the fob opened"
      fob_rate: "The per-fob charge follows the parking the fob opened: garage_fob_rate when the household held a Structured Garage Space or a Private Detached Garage license, ev_fob_rate when it held an EV Charging Reserved Space license, and the program's unreturned_fob_charge otherwise."
      fob_autopay: "recurring autopay is enrolled on the lease"
      fob_insurance: "renter's insurance is on file"
      fob_courtesy: "A household that kept its lease in good order earns a fob courtesy taken off the fob charge: courtesy_both when recurring autopay is enrolled on the lease and renter's insurance is on file, courtesy_either when exactly one of the two holds, and none when neither does."
      statement_lag_days: "when the statement was issued more than late_statement_days calendar days after the move-out date"
      reckoned_fobs: "A late statement changes how the countable fobs are reckoned: when the statement was issued more than late_statement_days calendar days after the move-out date, the countable fobs are halved and rounded down to a whole fob; when it was issued more than the program's disposition_statement_days but no more than late_statement_days calendar days after the move-out date, one fob fewer than the countable fobs is charged, never fewer than none; when it was issued within disposition_statement_days, the countable fobs are charged as counted."
      corrected_fob: "So the corrected fob charge is the reckoned fobs less the forgiven fobs, times the per-fob charge, less the fob courtesy, never below 0, rounded half up to the cent once, at the end."
      result: "The fob credit is the fob charge less the corrected fob charge, rounded half up to the cent."
    factors:
      - id: tenancy_fob_forgiveness
        effect: parameter
        decides: forgiven_fobs
        bindings: [fob_tenure_months, forgiven_fobs]
        ladder:
          - {when: "a tenancy of at least forgiveness_long_months full months from move-in to move-out", value: "K('forgiven_fobs_long')"}
          - {when: "a tenancy of at least forgiveness_mid_months but fewer than forgiveness_long_months full months", value: "K('forgiven_fobs_mid')"}
          - {when: "a tenancy of fewer than forgiveness_mid_months full months", value: "0"}
        baseline: {forgiven_fobs: "0"}
        evidence: [cross_category, date]
        cross_difficulty: lease
      - id: parking_access_fob_charge
        effect: parameter
        decides: fob_rate
        bindings: [parking_product, fob_rate]
        ladder:
          - {when: "the household held a Structured Garage Space or a Private Detached Garage license", value: "K('garage_fob_rate')"}
          - {when: "the household held an EV Charging Reserved Space license", value: "K('ev_fob_rate')"}
          - {when: "the household held any other parking license or none", value: "P('unreturned_fob_charge')"}
        baseline: {fob_rate: "P('unreturned_fob_charge')"}
        evidence: [cross_category]
        cross_difficulty: parking
      - id: good_order_fob_courtesy
        effect: parameter
        decides: fob_courtesy
        bindings: [fob_autopay, fob_insurance, fob_courtesy]
        ladder:
          - {when: "recurring autopay is enrolled on the lease and renter's insurance is on file", value: "K('courtesy_both')"}
          - {when: "exactly one of autopay enrolled and renter's insurance on file holds", value: "K('courtesy_either')"}
          - {when: "neither holds", value: "0"}
        baseline: {fob_courtesy: "0"}
        evidence: [cross_category]
        cross_difficulty: lease
      - id: statement_timing_fob_reckoning
        effect: method
        decides: reckoned_fobs
        bindings: [statement_lag_days, reckoned_fobs]
        ladder:
          - {when: "the statement was issued more than late_statement_days calendar days after the move-out date", method: "the countable fobs are halved and rounded down to a whole fob"}
          - {when: "the statement was issued more than disposition_statement_days but no more than late_statement_days calendar days after the move-out date", method: "one fob fewer than the countable fobs is charged, never fewer than none"}
          - {when: "the statement was issued within disposition_statement_days of the move-out date", method: "the countable fobs are charged as counted"}
        baseline: {reckoned_fobs: "countable_fobs"}
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The fob charge is the amount of the unreturned-fob line itemized on the account. The corrected fob charge is the
        countable fobs times the per-fob charge, rounded half up to the cent. The countable fobs are the fob count
        recorded on the line, never more than the fobs the household held. The fobs the household held are the floor
        plan's fobs issued at move-in, plus the fobs bought on the lease ledger during the tenancy, the fobs bought
        being the key fob fees billed on the lease ledger divided by the floor plan's key_fob_replacement_fee, plus
        gate_fobs_with_license gate fob issued with a parking license when the household held one. The per-fob charge
        is the program's unreturned_fob_charge. The fob credit is the fob charge less the corrected fob charge, rounded
        half up to the cent.
      params: [unreturned_fob_charge, gate_fobs_with_license]
    inputs:
      history:
        - {table: deposit_transactions, aggregate: sum, field: amount, filters: {event_type: deposit_move_out_charge, line_category: unreturned_fob}}
        - {table: deposit_transactions, aggregate: sum, field: quantity, filters: {event_type: deposit_move_out_charge, line_category: unreturned_fob}}
        - {category: lease, table: lease_charges, aggregate: sum, field: amount, filters: {charge_code: key_fob_replacement_fee}}
      cross_category: [lease, parking]

  - id: deposit_ext_guarantee_gap_payment
    base_policy_refs: [deposit_balance_and_collections, deposit_evt_funding]
    overwrite:
      - base_policy: deposit_balance_and_collections
        superseded_clause: >-
          which pays the smaller of the unpaid balance and the coverage (guarantee_coverage_rent_multiple times the
          monthly rent at move-in)
        replaced_by: >-
          So the guarantee coverage is the coverage multiple plus the co-leaseholder step, times the coverage rent,
          times the premium-continuity share, less the shared ledger balance, rounded half up to the cent; and the
          guarantee gap payment is the balance owed standing less that coverage, never below 0, rounded half up to the
          cent.
    trigger: on_request
    subject: [deposit_balance_payment]
    computes: amount
    target_tool: pay_guarantee_gap_4e6273ca
    params:
      long_premium_terms: 4
      mid_premium_terms: 2
      multiple_long: 2.00
      multiple_mid: 1.75
      step_three_adults: 0.25
      step_two_adults: 0.10
      lapse_full_months: 24
      lapse_half_months: 12
      lapsed_share: 0.50
    rule: >
      A former resident of a Zero-Deposit Guarantee Plan account may pay themself, through the resident portal and before the guarantee is claimed,
      the part of the balance owed standing that the guarantee will not cover; the guarantee claim later pays the
      rest up to the coverage.
      The guarantee gap payment is taken only after every carpet replacement line under an accepted dispute carries
      its dispute credit on the account.
      The guarantee gap payment is not taken until every damage repair line under an accepted dispute carries its
      dispute credit on the account.
      Before the guarantee gap payment is taken, every unreturned-fob line under an accepted dispute must carry its
      dispute credit on the account.
      The balance owed standing is every balance owed billed on the account less every payment received against it
      and every credit posted against it.
      The guarantee gap payment is the balance owed standing less the guarantee coverage, never below 0, rounded half
      up to the cent.
      The guarantee coverage is the coverage multiple times the coverage rent, rounded half up to the cent.
      The coverage multiple is the program's guarantee_coverage_rent_multiple, and the coverage rent is the monthly
      rent at move-in, the contracted rent of the lease's first term.
      The coverage multiple grows with the premiums the account has paid: multiple_long when the account carries
      guarantee premiums for long_premium_terms or more lease terms, multiple_mid when it carries them for at least
      mid_premium_terms but fewer than long_premium_terms terms, and the program's guarantee_coverage_rent_multiple
      when it carries fewer than mid_premium_terms.
      Co-leaseholders add a step to the coverage multiple: step_three_adults when three or more adults signed the
      lease, step_two_adults when exactly two did, and no step when one did.
      The coverage rent follows how the tenancy ended: the lease's monthly rent, without the month-to-month premium,
      when the lease's completed last term was a month-to-month conversion; the contracted rent of the transfer term when
      the last term came from a transfer; and the monthly rent at move-in when the last term was a new lease or a
      signed renewal.
      A lapse in premiums scales the coverage by a premium-continuity share: 0 when the last guarantee premium was
      paid lapse_full_months or more full months before the move-out date, lapsed_share when it was paid at least
      lapse_half_months but fewer than lapse_full_months full months before it, and 1 (the coverage in full) when it
      was paid fewer than lapse_half_months full months before it.
      The coverage is shared with the ledger balances the statement lists: when the household's utility account
      carries a balance, the coverage is reduced by that utility balance; when the utility account carries none and
      the household's parking license carries a balance, it is reduced by that parking balance; when neither carries
      a balance, the coverage stands in full.
      So the guarantee coverage is the coverage multiple plus the co-leaseholder step, times the coverage rent,
      times the premium-continuity share, less the shared ledger balance, rounded half up to the cent; and the
      guarantee gap payment is the balance owed standing less that coverage, never below 0, rounded half up to the
      cent.
    prerequisite:
      - problem: deposit_ext_carpet_depreciation_credit
        kind: value_input
        gate: gap_credited
        form: state
        policy_source: >-
          The guarantee gap payment is taken only after every carpet replacement line under an accepted dispute
          carries its dispute credit on the account.
        condition: >-
          For every deposit dispute with status accepted that is recorded against a carpet replacement line of the
          account, the account's transactions include a dispute credit whose source line is that carpet line.
        resolved_by: post_depreciation_correction_credit_f675d6ed
        effect: >-
          The carpet dispute credit raises the credited total of the account, lowering the balance owed standing and
          the guarantee gap payment by the same amount while the gap stays above 0.
      - problem: deposit_ext_repair_labor_credit
        kind: value_input
        gate: gap_credited
        form: state
        policy_source: >-
          The guarantee gap payment is not taken until every damage repair line under an accepted dispute carries its
          dispute credit on the account.
        condition: >-
          For every deposit dispute with status accepted that is recorded against a damage repair line of the account,
          the account's transactions include a dispute credit whose source line is that repair line.
        resolved_by: post_repair_labor_credit_05a989cb
        effect: >-
          The repair dispute credit raises the credited total of the account, lowering the balance owed standing and
          the guarantee gap payment by the same amount while the gap stays above 0.
      - problem: deposit_ext_fob_count_credit
        kind: value_input
        gate: gap_credited
        form: state
        policy_source: >-
          Before the guarantee gap payment is taken, every unreturned-fob line under an accepted dispute must carry its
          dispute credit on the account.
        condition: >-
          For every deposit dispute with status accepted that is recorded against an unreturned-fob line of the
          account, the account's transactions include a dispute credit whose source line is that fob line.
        resolved_by: post_fob_count_credit_b88884f4
        effect: >-
          The fob dispute credit raises the credited total of the account, lowering the balance owed standing and the
          guarantee gap payment by the same amount while the gap stays above 0.
    cross_category:
      - category: lease
        as: branch
        reads: [adult_applicants_count, monthly_rent]
        note: The co-leaseholder step reads the adults who signed the lease; the coverage rent of a month-to-month tenancy reads the lease's monthly rent.
      - category: term
        as: branch
        reads: [term_origin, status, contracted_rent]
        note: The coverage rent takes its tier from how the lease's completed last term came about and reads the contracted rent of the first or transfer term.
      - category: utility
        as: branch
        reads: [balance_due]
        note: The shared ledger balance takes its tier and amount from the utility account's balance.
      - category: parking
        as: branch
        reads: [balance_due]
        note: The shared ledger balance falls back on the parking license's balance when the utility account carries none.
    compute:
      - gap_billed: "SUM('deposit_transactions','amount', event_type='deposit_balance_owed')"
      - gap_paid: "SUM('deposit_transactions','amount', event_type='deposit_balance_payment')"
      - gap_credited: "SUM('deposit_transactions','amount', event_type='deposit_balance_credit')"
      - gap_standing: "RND(gap_billed - gap_paid - gap_credited, 2)"
      - premiums_paid: "COUNT('deposit_transactions', event_type='deposit_guarantee_premium')"
      - coverage_multiple: "K('multiple_long') if premiums_paid >= K('long_premium_terms') else (K('multiple_mid') if premiums_paid >= K('mid_premium_terms') else P('guarantee_coverage_rent_multiple'))"
      - adults_signed: "CFIELD('lease','adult_applicants_count')"
      - adult_step: "K('step_three_adults') if adults_signed >= 3 else (K('step_two_adults') if adults_signed == 2 else 0)"
      - last_term_origin: "CFIELD('term','term_origin', status='completed')"
      - move_in_rent: "CFIELD('term','contracted_rent', term_origin='new_lease')"
      - coverage_rent: "CFIELD('lease','monthly_rent') if last_term_origin == 'month_to_month_conversion' else (CFIELD('term','contracted_rent', term_origin='transfer') if last_term_origin == 'transfer' else move_in_rent)"
      - last_premium_on: "LATEST('deposit_transactions','transaction_date', date_field='transaction_date', event_type='deposit_guarantee_premium')"
      - premium_lapse_months: "MONTHS(last_premium_on, F('move_out_date'))"
      - continuity_share: "0 if premium_lapse_months >= K('lapse_full_months') else (K('lapsed_share') if premium_lapse_months >= K('lapse_half_months') else 1)"
      - utility_left: "CFIELD('utility','balance_due')"
      - parking_left: "CFIELD('parking','balance_due')"
      - shared_limit: "utility_left if utility_left != None and utility_left > 0 else (parking_left if parking_left != None and parking_left > 0 else 0)"
      - guarantee_coverage: "RND((coverage_multiple + adult_step) * coverage_rent * continuity_share - shared_limit, 2)"
      - result: "RND(MX(0, gap_standing - guarantee_coverage), 2)"
    compute_basis:
      gap_billed: "The balance owed standing is every balance owed billed on the account less every payment received against it and every credit posted against it."
      gap_paid: "The balance owed standing is every balance owed billed on the account less every payment received against it and every credit posted against it."
      gap_credited: "The balance owed standing is every balance owed billed on the account less every payment received against it and every credit posted against it."
      gap_standing: "The balance owed standing is every balance owed billed on the account less every payment received against it and every credit posted against it."
      premiums_paid: "when the account carries guarantee premiums for long_premium_terms or more lease terms"
      coverage_multiple: "The coverage multiple grows with the premiums the account has paid: multiple_long when the account carries guarantee premiums for long_premium_terms or more lease terms, multiple_mid when it carries them for at least mid_premium_terms but fewer than long_premium_terms terms, and the program's guarantee_coverage_rent_multiple when it carries fewer than mid_premium_terms."
      adults_signed: "when three or more adults signed the lease"
      adult_step: "Co-leaseholders add a step to the coverage multiple: step_three_adults when three or more adults signed the lease, step_two_adults when exactly two did, and no step when one did."
      last_term_origin: "The coverage rent follows how the tenancy ended"
      move_in_rent: "the monthly rent at move-in, the contracted rent of the lease's first term"
      coverage_rent: "The coverage rent follows how the tenancy ended: the lease's monthly rent, without the month-to-month premium, when the lease's completed last term was a month-to-month conversion; the contracted rent of the transfer term when the last term came from a transfer; and the monthly rent at move-in when the last term was a new lease or a signed renewal."
      last_premium_on: "when the last guarantee premium was paid lapse_full_months or more full months before the move-out date"
      premium_lapse_months: "when the last guarantee premium was paid lapse_full_months or more full months before the move-out date"
      continuity_share: "A lapse in premiums scales the coverage by a premium-continuity share: 0 when the last guarantee premium was paid lapse_full_months or more full months before the move-out date, lapsed_share when it was paid at least lapse_half_months but fewer than lapse_full_months full months before it, and 1 (the coverage in full) when it was paid fewer than lapse_half_months full months before it."
      utility_left: "when the household's utility account carries a balance, the coverage is reduced by that utility balance"
      parking_left: "the household's parking license carries a balance, it is reduced by that parking balance"
      shared_limit: "The coverage is shared with the ledger balances the statement lists: when the household's utility account carries a balance, the coverage is reduced by that utility balance; when the utility account carries none and the household's parking license carries a balance, it is reduced by that parking balance; when neither carries a balance, the coverage stands in full."
      guarantee_coverage: "So the guarantee coverage is the coverage multiple plus the co-leaseholder step, times the coverage rent, times the premium-continuity share, less the shared ledger balance, rounded half up to the cent"
      result: "and the guarantee gap payment is the balance owed standing less that coverage, never below 0, rounded half up to the cent."
    factors:
      - id: premium_terms_multiple
        effect: parameter
        decides: coverage_multiple
        bindings: [premiums_paid, coverage_multiple]
        ladder:
          - {when: "the account carries guarantee premiums for long_premium_terms or more lease terms", value: "K('multiple_long')"}
          - {when: "the account carries guarantee premiums for at least mid_premium_terms but fewer than long_premium_terms terms", value: "K('multiple_mid')"}
          - {when: "the account carries guarantee premiums for fewer than mid_premium_terms terms", value: "P('guarantee_coverage_rent_multiple')"}
        baseline: {coverage_multiple: "P('guarantee_coverage_rent_multiple')"}
        evidence: [history]
        cross_difficulty: null
      - id: co_leaseholder_step
        effect: parameter
        decides: adult_step
        bindings: [adults_signed, adult_step]
        ladder:
          - {when: "three or more adults signed the lease", value: "K('step_three_adults')"}
          - {when: "exactly two adults signed the lease", value: "K('step_two_adults')"}
          - {when: "one adult signed the lease", value: "0"}
        baseline: {adult_step: "0"}
        evidence: [cross_category]
        cross_difficulty: lease
      - id: tenancy_end_coverage_rent
        effect: method
        decides: coverage_rent
        bindings: [last_term_origin, move_in_rent, coverage_rent]
        ladder:
          - {when: "the lease's completed last term was a month-to-month conversion", method: "the coverage rent is the lease's monthly rent, without the month-to-month premium"}
          - {when: "the lease's completed last term came from a transfer", method: "the coverage rent is the contracted rent of the transfer term"}
          - {when: "the lease's completed last term was a new lease or a signed renewal", method: "the coverage rent is the monthly rent at move-in"}
        baseline: {coverage_rent: "move_in_rent"}
        evidence: [cross_category]
        cross_difficulty: term
      - id: premium_continuity_share
        effect: parameter
        decides: continuity_share
        bindings: [last_premium_on, premium_lapse_months, continuity_share]
        ladder:
          - {when: "the last guarantee premium was paid lapse_full_months or more full months before the move-out date", value: "0"}
          - {when: "it was paid at least lapse_half_months but fewer than lapse_full_months full months before the move-out date", value: "K('lapsed_share')"}
          - {when: "it was paid fewer than lapse_half_months full months before the move-out date", value: "1"}
        baseline: {continuity_share: "1"}
        evidence: [history, date]
        cross_difficulty: null
      - id: shared_ledger_limit
        effect: method
        decides: shared_limit
        bindings: [utility_left, parking_left, shared_limit]
        ladder:
          - {when: "the household's utility account carries a balance", method: "the coverage is reduced by that utility balance"}
          - {when: "the utility account carries no balance and the household's parking license carries a balance", method: "the coverage is reduced by that parking balance"}
          - {when: "neither carries a balance", method: "the coverage stands in full"}
        baseline: {shared_limit: "0"}
        evidence: [cross_category]
        cross_difficulty: utility
    baseline:
      rule: >-
        The balance owed standing is every balance owed billed on the account less every payment received against it
        and every credit posted against it. The guarantee gap payment is the balance owed standing less the guarantee
        coverage, never below 0, rounded half up to the cent. The guarantee coverage is the coverage multiple times the
        coverage rent, rounded half up to the cent. The coverage multiple is the program's
        guarantee_coverage_rent_multiple, and the coverage rent is the monthly rent at move-in, the contracted rent of
        the lease's first term.
      params: [guarantee_coverage_rent_multiple]
    inputs:
      history:
        - {table: deposit_transactions, aggregate: sum, field: amount, filters: {event_type: deposit_balance_owed}}
        - {table: deposit_transactions, aggregate: sum, field: amount, filters: {event_type: deposit_balance_payment}}
        - {table: deposit_transactions, aggregate: sum, field: amount, filters: {event_type: deposit_balance_credit}}
        - {table: deposit_transactions, aggregate: count, field: transaction_id, filters: {event_type: deposit_guarantee_premium}}
        - {table: deposit_transactions, aggregate: latest, field: transaction_date, filters: {event_type: deposit_guarantee_premium}}
      cross_category: [lease, term, utility, parking]
