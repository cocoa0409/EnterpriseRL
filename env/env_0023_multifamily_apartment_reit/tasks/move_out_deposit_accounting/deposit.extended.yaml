      - cleaning_line_count: "COUNT('deposit_transactions', event_type='deposit_move_out_charge', line_category='cleaning')"
      - whole_unit_lines: "COUNT('deposit_transactions', event_type='deposit_move_out_charge', line_category='cleaning', item_location='whole_unit')"
      - spot_rooms: "cleaning_line_count - whole_unit_lines"
      - floor_plan: "CFIELD('lease','variant_name')"
      - plan_rate: "K('rate_studio') if floor_plan == 'Studio Residence' else (K('rate_one_bedroom') if floor_plan == 'One-Bedroom Residence' else (K('rate_one_bedroom_den') if floor_plan == 'One-Bedroom Den Residence' else (K('rate_two_bedroom') if floor_plan == 'Two-Bedroom Residence' else (K('rate_three_bedroom') if floor_plan == 'Three-Bedroom Residence' else K('rate_penthouse')))))"
      - smaller_plan_rate: "K('rate_studio') if floor_plan == 'Studio Residence' or floor_plan == 'One-Bedroom Residence' else (K('rate_one_bedroom') if floor_plan == 'One-Bedroom Den Residence' else (K('rate_one_bedroom_den') if floor_plan == 'Two-Bedroom Residence' else (K('rate_two_bedroom') if floor_plan == 'Three-Bedroom Residence' else K('rate_three_bedroom'))))"
      - carpet_lines: "COUNT('deposit_transactions', event_type='deposit_move_out_charge', line_category='carpet_replacement')"
      - paint_lines: "COUNT('deposit_transactions', event_type='deposit_move_out_charge', line_category='paint')"
      - whole_unit_charge: "smaller_plan_rate if carpet_lines > 0 and paint_lines > 0 else ((plan_rate + smaller_plan_rate) / 2 if carpet_lines > 0 or paint_lines > 0 else plan_rate)"
      - has_dog: "EXISTS('pet', species='dog')"
      - has_cat: "EXISTS('pet', species='cat')"
      - spot_rate: "K('spot_rate_dog') if has_dog else (K('spot_rate_cat') if has_cat and not has_dog else P('carpet_spot_cleaning_per_room'))"
      - tenure_months: "MONTHS(CFIELD('lease','move_in_date'), F('move_out_date'))"
      - returns_12m: "XCOUNT('lease','lease_payments', within_months=12, date_field='payment_date', event_type='lease_payment_return')"
      - cleaning_courtesy: "K('courtesy_long') if tenure_months >= K('tenure_courtesy_months') and returns_12m == 0 else (K('courtesy_mid') if tenure_months >= K('tenure_courtesy_months') and returns_12m == 1 else 0)"
      - occupants: "CFIELD('lease','occupants_count')"
      - bedrooms: "CPARAM('lease','bedrooms')"
      - heavy_use_charge: "K('addon_heavy') if occupants >= bedrooms + 2 else (K('addon_moderate') if occupants == bedrooms + 1 else 0)"
