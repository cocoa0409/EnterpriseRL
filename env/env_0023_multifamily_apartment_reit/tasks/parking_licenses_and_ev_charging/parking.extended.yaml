# Parking License — a monthly license for a permit, space, carport, garage or EV charging space at the
# community, held as an add-on to a lease. One holding = one license for one vehicle.
category: parking
display_name: Parking License

binding:
  holding_table: parking_licenses
  event_tables: [parking_charges, parking_activity]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: parking_receivable}

lifecycle:
  states: [waitlisted, active, suspended, notice_given, terminated, withdrawn]
  transitions:
    - {from: waitlisted, to: active, by: agent, means: A space of the requested product is assigned after the resident accepts the offer, and the license starts.}
    - {from: waitlisted, to: withdrawn, by: user, means: The resident withdraws the parking request before a space is assigned.}
    - {from: active, to: suspended, by: agent, means: Parking privileges are suspended for a past-due parking balance.}
    - {from: suspended, to: active, by: agent, means: The past-due balance and reinstatement fee are paid and privileges are restored.}
    - {from: active, to: notice_given, by: user, means: The resident signs a cancellation notice for the license.}
    - {from: notice_given, to: active, by: agent, means: The resident withdraws the cancellation notice before its end date.}
    - {from: notice_given, to: terminated, by: system, means: The license ends on the end date of the cancellation notice.}
    - {from: active, to: terminated, by: system, means: The license ends because possession of the apartment home ended.}
    - {from: suspended, to: terminated, by: system, means: A suspended license ends because possession of the apartment home ended.}

accounts:
  - key: parking_receivable
    unit: USD
    meaning: What the leaseholder owes on the parking license — license fees, EV charging, violation fines and parking service fees, less credits and payments; the parking_licenses.balance_due view.

parameter_schema:
  monthly_license_fee: Monthly license fee of the parking product (USD per month).
  first_permit_included: Whether the first license of this product on a lease carries no monthly fee (boolean).
  activation_fee: One-time fee when the license starts (USD).
  max_licenses_of_tier_per_lease: Maximum licenses of this product one lease may hold (integer).
  reserved_space: Whether a specific numbered space is assigned (boolean).
  covered: Whether the space is covered (boolean).
  gate_remote_included: Whether garage gate access is issued with the license (boolean).
  remotes_issued: Gate remotes issued without charge at start (integer).
  gate_remote_fee: Charge per lost or additional gate remote (USD).
  tag_replacement_fee: Charge per replacement permit hang tag or decal (USD).
  space_swap_fee: Charge for moving the license to another space of the same product (USD).
  ev_charging_included: Whether a dedicated Level 2 charger comes with the space (boolean).
  ev_space_requires_ev: Whether the space may only be licensed for a plug-in electric vehicle (boolean).
  ev_rate_on_peak_per_kwh: Dedicated-charger energy rate from 07:00 to 21:00 local time (USD per kWh).
  ev_rate_off_peak_per_kwh: Dedicated-charger energy rate from 21:00 to 07:00 local time (USD per kWh).
  shared_charger_rate_per_kwh: Energy rate at the community's shared chargers for licensees without a dedicated charger (USD per kWh).
  ev_idle_grace_minutes: Minutes a vehicle may remain plugged in after charging completes before idle fees start (integer minutes).
  ev_idle_fee_per_hour: Idle fee per started hour after the grace period (USD per hour).
  ev_session_max_hours: Maximum length of one session at a shared charger (integer hours).
  min_commitment_months: Minimum licensed months before a cancellation takes effect without an early cancellation fee (integer months).
  cancellation_notice_days: Calendar days of written notice required to cancel the license (integer days).
  early_cancellation_fee_months: Early cancellation fee, in months of the monthly fee, when the end date falls inside the minimum commitment (decimal).
  license_term_basis: Whether the license renews month to month or runs with the lease (enum; month_to_month or lease_coterminous).
  fee_lock_months: Months the monthly fee is held after the license starts (integer months).
  rate_change_notice_days: Calendar days of written notice before a monthly fee increase after the fee lock (integer days).
  guest_passes_per_month: Guest passes available per calendar month to the license holder (integer).
  guest_pass_max_consecutive_nights: Consecutive nights one guest pass may cover (integer nights).
  warnings_before_fine: Warnings issued for a non-emergency violation before fines start, within the trailing 365 days (integer).
  violation_fine_amount: Fine per non-emergency violation after the warnings (USD).
  fines_before_tow: Fines within the trailing 365 days after which the next non-emergency violation is towed (integer).
  tow_immediate_codes: Violation codes towed on the first occurrence (list of violation_code values).
  tow_notice_hours: Hours a notice must be posted on an inoperable or abandoned vehicle before towing (integer hours).
  abandoned_vehicle_days: Days a vehicle may stay unmoved before it is treated as abandoned (integer days).
  oversize_vehicle_allowed: Whether vehicles over standard size (dual-rear-wheel trucks, trailers, RVs) are allowed (boolean).
  motorcycle_allowed: Whether a motorcycle may use the license (boolean).
  max_vehicle_length_ft: Maximum vehicle length (feet).
  max_vehicle_height_ft: Clearance limit of the space (feet).
  storage_in_space_allowed: Whether household items may be stored in the space (boolean).
  vehicle_registration_required: Whether a current state registration in a household member's name is required (boolean).
  max_vehicles_per_license: Vehicles that may be registered on one license (integer).
  waitlist_priority_basis: How waitlisted requests are ordered (enum; waitlist_date).
  waitlist_offer_valid_days: Calendar days a waitlist offer of a space stays open (integer days).
  suspension_delinquency_days: Days a parking charge may stay past due before privileges are suspended (integer days).
  reinstatement_fee: Fee to restore suspended privileges (USD).
  proration_method: How the first and last month's fee is prorated (enum; actual_days_in_month).
  fee_charge_day: Day of the month the monthly fee posts (integer day).
  bundle_discount_with_storage_pct: Discount on the monthly fee while the lease also holds an active storage rental (decimal fraction).
  transfer_on_unit_transfer: Whether the license carries over on an in-community transfer (boolean).

