events:
  - type: parking_license_request
    target: parking_licenses
    mutation: create
    meaning: A leaseholder requests a parking product for one vehicle and joins its waitlist.
    grain: One row per request.
    fields:
      customer_id: Leaseholder.
      lease_id: Lease the license will attach to.
      variant_name: Parking product requested.
      vehicle_plate: Vehicle to be registered.
      waitlist_date: Date the request was received.
    triggers: []
  - type: parking_assignment
    target: parking_licenses
    mutation: {transition: {from: waitlisted, to: active}}
    meaning: A space or permit is assigned and the license starts.
    grain: One row per transaction.
    fields:
      space_number: Space, carport, garage or tag assigned.
      start_date: First licensed day.
      monthly_fee: Monthly fee in force.
    triggers:
      - event: parking:parking_fee_charge
        map: {charge_code: activation_fee, charge_date: start_date}
  - type: parking_waitlist_withdrawal
    target: parking_licenses
    mutation: {transition: {from: waitlisted, to: withdrawn}}
    meaning: The resident withdraws a waitlisted request.
    grain: One row per transaction.
    fields:
      closed_date: Date withdrawn.
    triggers: []
  - type: parking_fee_charge
    target: parking_charges
    meaning: A parking fee posts — the monthly license fee, the activation fee, or a remote, tag, space swap, early cancellation or reinstatement fee.
    grain: One row per fee per month per posting date.
    distinguish_by: [charge_code, billing_period, charge_date]
    fields:
      charge_code: Fee code.
      billing_period: Month billed.
      charge_date: Posting date.
      amount: Fee after proration.
      proration_days: Days billed for a monthly fee.
      days_in_period: Days of the month for a monthly fee.
    account: parking_receivable
    direction: in
    triggers: []
  - type: parking_ev_session
    target: parking_charges
    meaning: One EV charging session is billed — its energy at the applicable rate, and any idle fee as a second line of the same session.
    grain: One row per session per charge code and rate period.
    distinguish_by: [session_reference, charge_code, rate_period]
    fields:
      charge_code: ev_charging_energy or ev_idle_fee.
      session_reference: Charging network session id.
      rate_period: on_peak or off_peak for energy lines.
      billing_period: Month of the session.
      charge_date: Session date.
      energy_kwh: Energy delivered in the rate period.
      idle_minutes: Idle minutes after charging completed.
      amount: Amount billed.
    account: parking_receivable
    direction: in
    triggers: []
  - type: parking_violation
    target: parking_activity
    meaning: A parking rule violation by the licensed vehicle (or an unlicensed vehicle of the household) is recorded with the enforcement step taken.
    grain: One row per violation observed.
    distinguish_by: [activity_date, violation_code]
    fields:
      activity_date: Date observed.
      violation_code: Rule broken.
      violation_level: warning, fine or tow.
      vehicle_plate_observed: Plate observed.
    triggers:
      - event: parking:parking_fine
        when: {violation_level: fine}
        map: {source_activity_id: activity_id, charge_date: activity_date}
  - type: parking_fine
    target: parking_charges
    meaning: The fine for one violation is billed.
    grain: One row per fined violation.
    distinguish_by: [source_activity_id]
    fields:
      charge_code: violation_fine.
      source_activity_id: The violation fined.
      billing_period: Month of the violation.
      charge_date: Posting date.
      amount: Fine.
    account: parking_receivable
    direction: in
    triggers: []
  - type: parking_guest_pass
    target: parking_activity
    meaning: A guest pass is issued for a visitor's vehicle.
    grain: One row per pass.
    distinguish_by: [activity_date, vehicle_plate_observed]
    fields:
      activity_date: First night of the pass.
      vehicle_plate_observed: Guest vehicle plate.
      pass_nights: Nights covered.
    triggers: []
  - type: parking_credit
    target: parking_charges
    meaning: A parking charge is reduced — the storage bundle discount on a monthly fee, or the reversal of a charge posted in error.
    grain: One row per credited charge per credit code.
    distinguish_by: [charge_code, source_parking_charge_id]
    fields:
      charge_code: bundle_discount or charge_reversal.
      source_parking_charge_id: The charge credited.
      billing_period: Month credited.
      charge_date: Posting date.
      amount: Credit (positive).
    account: parking_receivable
    direction: out
    triggers: []
  - type: parking_payment
    target: parking_charges
    meaning: A payment toward the parking balance is received, including the application of the security deposit at final accounting.
    grain: One row per payment transaction.
    distinguish_by: [payment_reference]
    fields:
      charge_code: payment_received.
      billing_period: Month received.
      charge_date: Date received.
      amount: Amount received.
      payment_method: Instrument used.
      payment_reference: Confirmation or instrument number.
    account: parking_receivable
    direction: out
    triggers: []
  - type: parking_vehicle_update
    target: parking_licenses
    mutation: update
    meaning: The vehicle registered on the license is replaced.
    grain: One row per transaction.
    fields:
      vehicle_plate: New plate.
    triggers: []
  - type: parking_space_swap
    target: parking_licenses
    mutation: update
    meaning: The license moves to another space of the same product, or to another product when the resident changes product.
    grain: One row per transaction.
    fields:
      space_number: New space.
      variant_name: Product after the change.
      monthly_fee: Monthly fee after the change.
    triggers:
      - event: parking:parking_fee_charge
        map: {charge_code: space_swap_fee}
  - type: parking_suspension
    target: parking_licenses
    mutation: {transition: {from: active, to: suspended}}
    meaning: Parking privileges are suspended for a past-due parking balance.
    grain: One row per transaction.
    fields:
      balance_due: Past-due balance at suspension (read, not rewritten).
    triggers: []
  - type: parking_reinstatement
    target: parking_licenses
    mutation: {transition: {from: suspended, to: active}}
    meaning: Suspended privileges are restored.
    grain: One row per transaction.
    fields:
      balance_due: Balance after the reinstating payment (read, not rewritten).
    triggers:
      - event: parking:parking_fee_charge
        map: {charge_code: reinstatement_fee}
  - type: parking_cancellation_notice
    target: parking_licenses
    mutation: {transition: {from: active, to: notice_given}}
    meaning: The resident signs a cancellation notice with an end date.
    grain: One row per transaction.
    fields:
      end_date: Last licensed day.
    triggers: []
  - type: parking_notice_withdrawal
    target: parking_licenses
    mutation: {transition: {from: notice_given, to: active}}
    meaning: A cancellation notice is withdrawn before its end date.
    grain: One row per transaction.
    fields:
      end_date: Cleared.
    triggers: []
  - type: parking_termination
    target: parking_licenses
    mutation: {transition: {from: notice_given, to: terminated}}
    meaning: The license ends on its notice end date.
    grain: One row per transaction.
    fields:
      closed_date: End date reached.
    triggers: []
  - type: parking_move_out_termination
    target: parking_licenses
    mutation: {transition: [{from: active, to: terminated}, {from: suspended, to: terminated}, {from: notice_given, to: terminated}]}
    meaning: The license ends because possession of the apartment home ended.
    grain: One row per transaction.
    fields:
      end_date: The lease's move-out date.
      closed_date: Date terminated.
    triggers: []

measures:
  - id: parking_msr_open_licenses_on_lease
    window: Current state of every parking license of the lease.
    measure: Count of parking licenses of the lease in waitlisted, active, suspended or notice_given status, in total and per parking product.
  - id: parking_msr_enforcement_12m
    window: Trailing 365 calendar days ending on and including the date of the violation being decided.
    measure: Count of parking_violation rows on the license (and on any license of the same lease for the same plate) with violation_level warning, and separately with violation_level fine, dated in the window.
  - id: parking_msr_guest_passes_month
    window: The calendar month containing the first night of the requested pass.
    measure: Count of parking_guest_pass rows on the license whose activity_date falls in that month.
  - id: parking_msr_oldest_past_due_days
    window: As of the evaluation date.
    measure: Days since the charge_date of the oldest parking charge on the license that the license's payments and credits, applied oldest first, have not fully paid.

policies:
  - id: parking_agg_multi_holding
    subject: [parking_license_request]
    rule: >-
      A lease may hold several parking licenses, one vehicle each, up to max_per_customer across all parking products and
      up to each product's max_licenses_of_tier_per_lease.
      A parking request is accepted only when the lease's open licenses (parking_msr_open_licenses_on_lease) are below both the household cap and the product's own cap, and the household cap never exceeds the lease's adult applicants plus one.
      Waitlisted requests count toward the caps.
    eligibility:
      - id: household_vehicle_cap
        applies_to: [parking_license_request]
        kind: state
        condition: "A parking request is accepted only when the lease's open licenses (parking_msr_open_licenses_on_lease) are below both the household cap and the product's own cap, and the household cap never exceeds the lease's adult applicants plus one."
        evidence_fields: [parking_licenses.lease_id, parking_licenses.status, parking_licenses.variant_name, leases.adult_applicants_count]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [parking_licenses.lease_id]
          action_bindings:
            parking_licenses.lease_id: lease_id
        state_contract:
          field: parking_licenses.status
          allowed: [waitlisted, active, suspended, notice_given]
    params:
      max_per_customer: 3
      per_tier:
        Surface Unreserved Permit: {max_licenses_of_tier_per_lease: "=max_licenses_of_tier_per_lease"}
        Surface Reserved Space: {max_licenses_of_tier_per_lease: "=max_licenses_of_tier_per_lease"}
        Covered Carport Space: {max_licenses_of_tier_per_lease: "=max_licenses_of_tier_per_lease"}
        Structured Garage Space: {max_licenses_of_tier_per_lease: "=max_licenses_of_tier_per_lease"}
        EV Charging Reserved Space: {max_licenses_of_tier_per_lease: "=max_licenses_of_tier_per_lease"}
        Private Detached Garage: {max_licenses_of_tier_per_lease: "=max_licenses_of_tier_per_lease"}
    measures: [parking_msr_open_licenses_on_lease]

  - id: parking_agg_household_pricing
    subject: [parking_fee_charge, parking_credit]
    rule: >-
      Pricing across a household's licenses is decided over the whole lease. Only the earliest-started Surface Unreserved
      Permit of a lease is included without a monthly fee when first_permit_included is true; every other license pays its
      monthly_license_fee. While the lease also holds a storage rental in active status, each Covered Carport Space,
      Structured Garage Space, EV Charging Reserved Space and Private Detached Garage license of the lease receives a
      bundle_discount credit of bundle_discount_with_storage_pct times that month's posted fee, rounded half up to the cent,
      against the monthly fee line; the discount applies to monthly fees only and never to EV charging, fines or service
      fees. The bundle discount does not stack with any other parking discount and is not posted for a month in which the
      storage rental was not active on the fee charge day.
    eligibility:
      - id: storage_active_for_bundle
        applies_to: [parking_credit]
        kind: state
        condition: "While the lease also holds a storage rental in active status, each Covered Carport Space, Structured Garage Space, EV Charging Reserved Space and Private Detached Garage license of the lease receives a bundle_discount credit of bundle_discount_with_storage_pct times that month's posted fee, rounded half up to the cent, against the monthly fee line; the discount applies to monthly fees only and never to EV charging, fines or service fees."
        evidence_fields: [storage_rentals.lease_id, storage_rentals.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [storage_rentals.lease_id]
          action_bindings:
            storage_rentals.lease_id: lease_id
        state_contract:
          field: storage_rentals.status
          allowed: [active]
    params:
      per_tier:
        Surface Unreserved Permit: {first_permit_included: "=first_permit_included", monthly_license_fee: "=monthly_license_fee", bundle_discount_with_storage_pct: "=bundle_discount_with_storage_pct"}
        Surface Reserved Space: {first_permit_included: "=first_permit_included", monthly_license_fee: "=monthly_license_fee", bundle_discount_with_storage_pct: "=bundle_discount_with_storage_pct"}
        Covered Carport Space: {first_permit_included: "=first_permit_included", monthly_license_fee: "=monthly_license_fee", bundle_discount_with_storage_pct: "=bundle_discount_with_storage_pct"}
        Structured Garage Space: {first_permit_included: "=first_permit_included", monthly_license_fee: "=monthly_license_fee", bundle_discount_with_storage_pct: "=bundle_discount_with_storage_pct"}
        EV Charging Reserved Space: {first_permit_included: "=first_permit_included", monthly_license_fee: "=monthly_license_fee", bundle_discount_with_storage_pct: "=bundle_discount_with_storage_pct"}
        Private Detached Garage: {first_permit_included: "=first_permit_included", monthly_license_fee: "=monthly_license_fee", bundle_discount_with_storage_pct: "=bundle_discount_with_storage_pct"}
    formula:
      bundle_discount: round(bundle_discount_with_storage_pct * monthly_fee, 2)

  - id: parking_evt_assignment
    subject: [parking_assignment, parking_waitlist_withdrawal, parking_license_request]
    rule: >-
      A parking license is requested and assigned only while the lease is active.
      A lease in_default or eviction_filed receives no new license and no assignment. Requests are served in
      waitlist_priority_basis order per product; when a space frees up it is offered to the earliest request, the offer
      stays open waitlist_offer_valid_days, and an offer not accepted in time passes to the next request while the lapsed
      request keeps its place for the next space. The vehicle must carry a current state registration in the name of a
      leaseholder or approved occupant when vehicle_registration_required is true, fit max_vehicle_length_ft and
      max_vehicle_height_ft, be a plug-in electric vehicle when ev_space_requires_ev is true, and be of standard size unless
      oversize_vehicle_allowed is true; motorcycles are allowed where motorcycle_allowed is true. Each license registers
      max_vehicles_per_license vehicle. The license gives a numbered space only when reserved_space is true (otherwise any
      open unreserved space), covered parking only when covered is true, and gate access only when gate_remote_included is
      true. On assignment the activation_fee posts, remotes_issued remotes are handed over, and
      the monthly fee is locked for fee_lock_months. A waitlisted request may be withdrawn at any time without charge.
    eligibility:
      - id: lease_active_for_parking
        applies_to: [parking_license_request, parking_assignment]
        kind: state
        condition: "A parking license is requested and assigned only while the lease is active."
        evidence_fields: [leases.lease_id, leases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
        state_contract:
          field: leases.status
          allowed: [active]
    params:
      per_tier:
        Surface Unreserved Permit: {waitlist_priority_basis: "=waitlist_priority_basis", waitlist_offer_valid_days: "=waitlist_offer_valid_days", vehicle_registration_required: "=vehicle_registration_required", max_vehicle_length_ft: "=max_vehicle_length_ft", max_vehicle_height_ft: "=max_vehicle_height_ft", ev_space_requires_ev: "=ev_space_requires_ev", oversize_vehicle_allowed: "=oversize_vehicle_allowed", motorcycle_allowed: "=motorcycle_allowed", max_vehicles_per_license: "=max_vehicles_per_license", activation_fee: "=activation_fee", remotes_issued: "=remotes_issued", fee_lock_months: "=fee_lock_months", reserved_space: "=reserved_space", covered: "=covered", gate_remote_included: "=gate_remote_included"}
        Surface Reserved Space: {waitlist_priority_basis: "=waitlist_priority_basis", waitlist_offer_valid_days: "=waitlist_offer_valid_days", vehicle_registration_required: "=vehicle_registration_required", max_vehicle_length_ft: "=max_vehicle_length_ft", max_vehicle_height_ft: "=max_vehicle_height_ft", ev_space_requires_ev: "=ev_space_requires_ev", oversize_vehicle_allowed: "=oversize_vehicle_allowed", motorcycle_allowed: "=motorcycle_allowed", max_vehicles_per_license: "=max_vehicles_per_license", activation_fee: "=activation_fee", remotes_issued: "=remotes_issued", fee_lock_months: "=fee_lock_months", reserved_space: "=reserved_space", covered: "=covered", gate_remote_included: "=gate_remote_included"}
        Covered Carport Space: {waitlist_priority_basis: "=waitlist_priority_basis", waitlist_offer_valid_days: "=waitlist_offer_valid_days", vehicle_registration_required: "=vehicle_registration_required", max_vehicle_length_ft: "=max_vehicle_length_ft", max_vehicle_height_ft: "=max_vehicle_height_ft", ev_space_requires_ev: "=ev_space_requires_ev", oversize_vehicle_allowed: "=oversize_vehicle_allowed", motorcycle_allowed: "=motorcycle_allowed", max_vehicles_per_license: "=max_vehicles_per_license", activation_fee: "=activation_fee", remotes_issued: "=remotes_issued", fee_lock_months: "=fee_lock_months", reserved_space: "=reserved_space", covered: "=covered", gate_remote_included: "=gate_remote_included"}
        Structured Garage Space: {waitlist_priority_basis: "=waitlist_priority_basis", waitlist_offer_valid_days: "=waitlist_offer_valid_days", vehicle_registration_required: "=vehicle_registration_required", max_vehicle_length_ft: "=max_vehicle_length_ft", max_vehicle_height_ft: "=max_vehicle_height_ft", ev_space_requires_ev: "=ev_space_requires_ev", oversize_vehicle_allowed: "=oversize_vehicle_allowed", motorcycle_allowed: "=motorcycle_allowed", max_vehicles_per_license: "=max_vehicles_per_license", activation_fee: "=activation_fee", remotes_issued: "=remotes_issued", fee_lock_months: "=fee_lock_months", reserved_space: "=reserved_space", covered: "=covered", gate_remote_included: "=gate_remote_included"}
        EV Charging Reserved Space: {waitlist_priority_basis: "=waitlist_priority_basis", waitlist_offer_valid_days: "=waitlist_offer_valid_days", vehicle_registration_required: "=vehicle_registration_required", max_vehicle_length_ft: "=max_vehicle_length_ft", max_vehicle_height_ft: "=max_vehicle_height_ft", ev_space_requires_ev: "=ev_space_requires_ev", oversize_vehicle_allowed: "=oversize_vehicle_allowed", motorcycle_allowed: "=motorcycle_allowed", max_vehicles_per_license: "=max_vehicles_per_license", activation_fee: "=activation_fee", remotes_issued: "=remotes_issued", fee_lock_months: "=fee_lock_months", reserved_space: "=reserved_space", covered: "=covered", gate_remote_included: "=gate_remote_included"}
        Private Detached Garage: {waitlist_priority_basis: "=waitlist_priority_basis", waitlist_offer_valid_days: "=waitlist_offer_valid_days", vehicle_registration_required: "=vehicle_registration_required", max_vehicle_length_ft: "=max_vehicle_length_ft", max_vehicle_height_ft: "=max_vehicle_height_ft", ev_space_requires_ev: "=ev_space_requires_ev", oversize_vehicle_allowed: "=oversize_vehicle_allowed", motorcycle_allowed: "=motorcycle_allowed", max_vehicles_per_license: "=max_vehicles_per_license", activation_fee: "=activation_fee", remotes_issued: "=remotes_issued", fee_lock_months: "=fee_lock_months", reserved_space: "=reserved_space", covered: "=covered", gate_remote_included: "=gate_remote_included"}

  - id: parking_evt_fees
    subject: [parking_fee_charge]
    rule: >-
      Parking fees post only while the license is active, suspended or notice_given.
      The monthly fee posts on fee_charge_day for each month licensed; the first and last month are prorated by licensed
      days over the actual days of the month (proration_method), rounded half up to the cent. After fee_lock_months the
      monthly fee may rise only with rate_change_notice_days written notice. A lost or additional remote is billed at
      gate_remote_fee, a replacement tag at tag_replacement_fee, a move to another space at space_swap_fee, and restoring
      suspended privileges at reinstatement_fee. A monthly fee keeps posting while the license is suspended, because
      suspension withdraws the privilege, not the license.
    eligibility:
      - id: parking_fee_status
        applies_to: [parking_fee_charge]
        kind: state
        condition: "Parking fees post only while the license is active, suspended or notice_given."
        evidence_fields: [parking_licenses.parking_license_id, parking_licenses.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [parking_licenses.parking_license_id]
          action_bindings:
            parking_licenses.parking_license_id: parking_license_id
        state_contract:
          field: parking_licenses.status
          allowed: [active, suspended, notice_given]
    params:
      per_tier:
        Surface Unreserved Permit: {fee_charge_day: "=fee_charge_day", proration_method: "=proration_method", rate_change_notice_days: "=rate_change_notice_days", gate_remote_fee: "=gate_remote_fee", tag_replacement_fee: "=tag_replacement_fee", space_swap_fee: "=space_swap_fee", reinstatement_fee: "=reinstatement_fee"}
        Surface Reserved Space: {fee_charge_day: "=fee_charge_day", proration_method: "=proration_method", rate_change_notice_days: "=rate_change_notice_days", gate_remote_fee: "=gate_remote_fee", tag_replacement_fee: "=tag_replacement_fee", space_swap_fee: "=space_swap_fee", reinstatement_fee: "=reinstatement_fee"}
        Covered Carport Space: {fee_charge_day: "=fee_charge_day", proration_method: "=proration_method", rate_change_notice_days: "=rate_change_notice_days", gate_remote_fee: "=gate_remote_fee", tag_replacement_fee: "=tag_replacement_fee", space_swap_fee: "=space_swap_fee", reinstatement_fee: "=reinstatement_fee"}
        Structured Garage Space: {fee_charge_day: "=fee_charge_day", proration_method: "=proration_method", rate_change_notice_days: "=rate_change_notice_days", gate_remote_fee: "=gate_remote_fee", tag_replacement_fee: "=tag_replacement_fee", space_swap_fee: "=space_swap_fee", reinstatement_fee: "=reinstatement_fee"}
        EV Charging Reserved Space: {fee_charge_day: "=fee_charge_day", proration_method: "=proration_method", rate_change_notice_days: "=rate_change_notice_days", gate_remote_fee: "=gate_remote_fee", tag_replacement_fee: "=tag_replacement_fee", space_swap_fee: "=space_swap_fee", reinstatement_fee: "=reinstatement_fee"}
        Private Detached Garage: {fee_charge_day: "=fee_charge_day", proration_method: "=proration_method", rate_change_notice_days: "=rate_change_notice_days", gate_remote_fee: "=gate_remote_fee", tag_replacement_fee: "=tag_replacement_fee", space_swap_fee: "=space_swap_fee", reinstatement_fee: "=reinstatement_fee"}
    formula:
      prorated_fee: round(monthly_fee * proration_days / days_in_period, 2)

  - id: parking_evt_ev_charging
    subject: [parking_ev_session]
    rule: >-
      EV charging is billed only while the license is active or notice_given.
      On an EV Charging Reserved Space the dedicated charger bills energy at ev_rate_on_peak_per_kwh for energy delivered
      07:00-21:00 local time and ev_rate_off_peak_per_kwh otherwise, one line per rate period of the session. Any other
      licensee may use the community's shared chargers at shared_charger_rate_per_kwh with no time-of-use split, for at most
      ev_session_max_hours per session. When a vehicle stays plugged in more than ev_idle_grace_minutes after charging
      completes, an idle fee of ev_idle_fee_per_hour per started hour after the grace period is billed as a separate line;
      idle fees apply to shared and dedicated chargers alike. Energy amounts are rounded half up to the cent per line.
    eligibility:
      - id: ev_status
        applies_to: [parking_ev_session]
        kind: state
        condition: "EV charging is billed only while the license is active or notice_given."
        evidence_fields: [parking_licenses.parking_license_id, parking_licenses.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [parking_licenses.parking_license_id]
          action_bindings:
            parking_licenses.parking_license_id: parking_license_id
        state_contract:
          field: parking_licenses.status
          allowed: [active, notice_given]
    params:
      per_tier:
        Surface Unreserved Permit: {ev_charging_included: "=ev_charging_included", ev_rate_on_peak_per_kwh: "=ev_rate_on_peak_per_kwh", ev_rate_off_peak_per_kwh: "=ev_rate_off_peak_per_kwh", shared_charger_rate_per_kwh: "=shared_charger_rate_per_kwh", ev_idle_grace_minutes: "=ev_idle_grace_minutes", ev_idle_fee_per_hour: "=ev_idle_fee_per_hour", ev_session_max_hours: "=ev_session_max_hours"}
        Surface Reserved Space: {ev_charging_included: "=ev_charging_included", ev_rate_on_peak_per_kwh: "=ev_rate_on_peak_per_kwh", ev_rate_off_peak_per_kwh: "=ev_rate_off_peak_per_kwh", shared_charger_rate_per_kwh: "=shared_charger_rate_per_kwh", ev_idle_grace_minutes: "=ev_idle_grace_minutes", ev_idle_fee_per_hour: "=ev_idle_fee_per_hour", ev_session_max_hours: "=ev_session_max_hours"}
        Covered Carport Space: {ev_charging_included: "=ev_charging_included", ev_rate_on_peak_per_kwh: "=ev_rate_on_peak_per_kwh", ev_rate_off_peak_per_kwh: "=ev_rate_off_peak_per_kwh", shared_charger_rate_per_kwh: "=shared_charger_rate_per_kwh", ev_idle_grace_minutes: "=ev_idle_grace_minutes", ev_idle_fee_per_hour: "=ev_idle_fee_per_hour", ev_session_max_hours: "=ev_session_max_hours"}
        Structured Garage Space: {ev_charging_included: "=ev_charging_included", ev_rate_on_peak_per_kwh: "=ev_rate_on_peak_per_kwh", ev_rate_off_peak_per_kwh: "=ev_rate_off_peak_per_kwh", shared_charger_rate_per_kwh: "=shared_charger_rate_per_kwh", ev_idle_grace_minutes: "=ev_idle_grace_minutes", ev_idle_fee_per_hour: "=ev_idle_fee_per_hour", ev_session_max_hours: "=ev_session_max_hours"}
        EV Charging Reserved Space: {ev_charging_included: "=ev_charging_included", ev_rate_on_peak_per_kwh: "=ev_rate_on_peak_per_kwh", ev_rate_off_peak_per_kwh: "=ev_rate_off_peak_per_kwh", shared_charger_rate_per_kwh: "=shared_charger_rate_per_kwh", ev_idle_grace_minutes: "=ev_idle_grace_minutes", ev_idle_fee_per_hour: "=ev_idle_fee_per_hour", ev_session_max_hours: "=ev_session_max_hours"}
        Private Detached Garage: {ev_charging_included: "=ev_charging_included", ev_rate_on_peak_per_kwh: "=ev_rate_on_peak_per_kwh", ev_rate_off_peak_per_kwh: "=ev_rate_off_peak_per_kwh", shared_charger_rate_per_kwh: "=shared_charger_rate_per_kwh", ev_idle_grace_minutes: "=ev_idle_grace_minutes", ev_idle_fee_per_hour: "=ev_idle_fee_per_hour", ev_session_max_hours: "=ev_session_max_hours"}
    formula:
      on_peak_energy_charge: round(energy_kwh * ev_rate_on_peak_per_kwh, 2)
      off_peak_energy_charge: round(energy_kwh * ev_rate_off_peak_per_kwh, 2)

  - id: parking_evt_enforcement
    subject: [parking_violation, parking_fine]
    rule: >-
      Enforcement escalates per plate over the trailing 365 days (parking_msr_enforcement_12m). A violation whose code is in
      tow_immediate_codes is towed on its first occurrence. Any other violation is a warning while fewer than
      warnings_before_fine warnings are on record, then a fine of violation_fine_amount while fewer than fines_before_tow
      fines are on record, and then a tow. An inoperable or abandoned vehicle (unmoved for abandoned_vehicle_days) is towed
      only after a notice has been posted on it for tow_notice_hours. Storing household items in a space is a wrong_space
      violation unless storage_in_space_allowed is true. Tow and storage charges are billed by the towing company to the
      vehicle owner and never appear on a Larkspur ledger.
      Only one fine is billed for a given violation.
    eligibility:
      - id: one_fine_per_violation
        applies_to: [parking_fine]
        kind: dedup
        condition: "Only one fine is billed for a given violation."
        evidence_fields: [parking_charges.source_activity_id, parking_charges.charge_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [parking_charges.source_activity_id]
          action_bindings:
            parking_charges.source_activity_id: source_activity_id
        dedup_contract:
          table: parking_charges
          mode: separate_record
          object_bindings: {source_activity_id: source_activity_id}
          duplicate_filters: {charge_code: [violation_fine]}
          distinct_fields: []
    params:
      per_tier:
        Surface Unreserved Permit: {warnings_before_fine: "=warnings_before_fine", violation_fine_amount: "=violation_fine_amount", fines_before_tow: "=fines_before_tow", tow_immediate_codes: "=tow_immediate_codes", tow_notice_hours: "=tow_notice_hours", abandoned_vehicle_days: "=abandoned_vehicle_days", storage_in_space_allowed: "=storage_in_space_allowed"}
        Surface Reserved Space: {warnings_before_fine: "=warnings_before_fine", violation_fine_amount: "=violation_fine_amount", fines_before_tow: "=fines_before_tow", tow_immediate_codes: "=tow_immediate_codes", tow_notice_hours: "=tow_notice_hours", abandoned_vehicle_days: "=abandoned_vehicle_days", storage_in_space_allowed: "=storage_in_space_allowed"}
        Covered Carport Space: {warnings_before_fine: "=warnings_before_fine", violation_fine_amount: "=violation_fine_amount", fines_before_tow: "=fines_before_tow", tow_immediate_codes: "=tow_immediate_codes", tow_notice_hours: "=tow_notice_hours", abandoned_vehicle_days: "=abandoned_vehicle_days", storage_in_space_allowed: "=storage_in_space_allowed"}
        Structured Garage Space: {warnings_before_fine: "=warnings_before_fine", violation_fine_amount: "=violation_fine_amount", fines_before_tow: "=fines_before_tow", tow_immediate_codes: "=tow_immediate_codes", tow_notice_hours: "=tow_notice_hours", abandoned_vehicle_days: "=abandoned_vehicle_days", storage_in_space_allowed: "=storage_in_space_allowed"}
        EV Charging Reserved Space: {warnings_before_fine: "=warnings_before_fine", violation_fine_amount: "=violation_fine_amount", fines_before_tow: "=fines_before_tow", tow_immediate_codes: "=tow_immediate_codes", tow_notice_hours: "=tow_notice_hours", abandoned_vehicle_days: "=abandoned_vehicle_days", storage_in_space_allowed: "=storage_in_space_allowed"}
        Private Detached Garage: {warnings_before_fine: "=warnings_before_fine", violation_fine_amount: "=violation_fine_amount", fines_before_tow: "=fines_before_tow", tow_immediate_codes: "=tow_immediate_codes", tow_notice_hours: "=tow_notice_hours", abandoned_vehicle_days: "=abandoned_vehicle_days", storage_in_space_allowed: "=storage_in_space_allowed"}
    measures: [parking_msr_enforcement_12m]

  - id: parking_evt_guest_passes
    subject: [parking_guest_pass]
    rule: >-
      A guest pass is issued only to a license holder whose license is active.
      Passes are limited to guest_passes_per_month per license per calendar month (parking_msr_guest_passes_month), each
      covering at most guest_pass_max_consecutive_nights consecutive nights; unused passes do not carry over. A guest vehicle
      staying longer must be registered on a license of its own, and a guest who stays long enough to become an
      unauthorized occupant under the lease charter cannot be covered by passes.
    eligibility:
      - id: pass_license_active
        applies_to: [parking_guest_pass]
        kind: state
        condition: "A guest pass is issued only to a license holder whose license is active."
        evidence_fields: [parking_licenses.parking_license_id, parking_licenses.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [parking_licenses.parking_license_id]
          action_bindings:
            parking_licenses.parking_license_id: parking_license_id
        state_contract:
          field: parking_licenses.status
          allowed: [active]
    params:
      per_tier:
        Surface Unreserved Permit: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_max_consecutive_nights: "=guest_pass_max_consecutive_nights"}
        Surface Reserved Space: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_max_consecutive_nights: "=guest_pass_max_consecutive_nights"}
        Covered Carport Space: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_max_consecutive_nights: "=guest_pass_max_consecutive_nights"}
        Structured Garage Space: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_max_consecutive_nights: "=guest_pass_max_consecutive_nights"}
        EV Charging Reserved Space: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_max_consecutive_nights: "=guest_pass_max_consecutive_nights"}
        Private Detached Garage: {guest_passes_per_month: "=guest_passes_per_month", guest_pass_max_consecutive_nights: "=guest_pass_max_consecutive_nights"}
    measures: [parking_msr_guest_passes_month]

  - id: parking_suspension_rule
    subject: [parking_suspension, parking_reinstatement]
    rule: >-
      Privileges are suspended when parking_msr_oldest_past_due_days exceeds suspension_delinquency_days; the vehicle may
      no longer use the space, remote or charger, and it is towed under the enforcement rule if it does. Privileges are
      restored only after the whole parking balance and the reinstatement_fee are paid. Suspension is limited to parking:
      it never touches the lease, and a lease delinquency never suspends parking by itself.
    eligibility: []
    params:
      per_tier:
        Surface Unreserved Permit: {suspension_delinquency_days: "=suspension_delinquency_days", reinstatement_fee: "=reinstatement_fee"}
        Surface Reserved Space: {suspension_delinquency_days: "=suspension_delinquency_days", reinstatement_fee: "=reinstatement_fee"}
        Covered Carport Space: {suspension_delinquency_days: "=suspension_delinquency_days", reinstatement_fee: "=reinstatement_fee"}
        Structured Garage Space: {suspension_delinquency_days: "=suspension_delinquency_days", reinstatement_fee: "=reinstatement_fee"}
        EV Charging Reserved Space: {suspension_delinquency_days: "=suspension_delinquency_days", reinstatement_fee: "=reinstatement_fee"}
        Private Detached Garage: {suspension_delinquency_days: "=suspension_delinquency_days", reinstatement_fee: "=reinstatement_fee"}
    measures: [parking_msr_oldest_past_due_days]

  - id: parking_cancellation_rule
    subject: [parking_cancellation_notice, parking_notice_withdrawal, parking_termination, parking_move_out_termination]
    rule: >-
      A resident cancels a license by signing a cancellation notice; the end date must be at least cancellation_notice_days
      calendar days after the notice date, and a Surface Unreserved Permit may end on any date. When the end date falls
      before start_date plus min_commitment_months, an early_cancellation_fee of early_cancellation_fee_months times the
      monthly fee is billed with the notice. A lease_coterminous license cannot be cancelled on its own before the lease
      term ends except on the same terms. A notice may be withdrawn until its end date while the space has not been
      offered to the waitlist. Every license ends on the lease's move-out date without notice or early cancellation fee,
      and a license carries over to the new apartment home on an in-community transfer when transfer_on_unit_transfer is
      true. The balance left on a terminated license is carried into the final account statement.
    eligibility: []
    params:
      per_tier:
        Surface Unreserved Permit: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_cancellation_fee_months: "=early_cancellation_fee_months", license_term_basis: "=license_term_basis", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
        Surface Reserved Space: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_cancellation_fee_months: "=early_cancellation_fee_months", license_term_basis: "=license_term_basis", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
        Covered Carport Space: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_cancellation_fee_months: "=early_cancellation_fee_months", license_term_basis: "=license_term_basis", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
        Structured Garage Space: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_cancellation_fee_months: "=early_cancellation_fee_months", license_term_basis: "=license_term_basis", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
        EV Charging Reserved Space: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_cancellation_fee_months: "=early_cancellation_fee_months", license_term_basis: "=license_term_basis", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
        Private Detached Garage: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_cancellation_fee_months: "=early_cancellation_fee_months", license_term_basis: "=license_term_basis", transfer_on_unit_transfer: "=transfer_on_unit_transfer"}
    formula:
      early_cancellation_fee: round(early_cancellation_fee_months * monthly_fee, 2)

  - id: parking_evt_payments_and_changes
    subject: [parking_payment, parking_vehicle_update, parking_space_swap]
    rule: >-
      Parking payments are accepted while the license is active, suspended, notice_given or terminated.
      A payment is applied to the oldest open parking charge first, and deposit_application is used only at final
      accounting. A replacement vehicle is registered only under the same vehicle rules as at assignment. A move to another
      space of the same product bills space_swap_fee; a change of product is a new request for that product, joining its
      waitlist, and the old license ends when the new one starts.
    eligibility:
      - id: parking_payment_status
        applies_to: [parking_payment]
        kind: state
        condition: "Parking payments are accepted while the license is active, suspended, notice_given or terminated."
        evidence_fields: [parking_licenses.parking_license_id, parking_licenses.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [parking_licenses.parking_license_id]
          action_bindings:
            parking_licenses.parking_license_id: parking_license_id
        state_contract:
          field: parking_licenses.status
          allowed: [active, suspended, notice_given, terminated]
    params:
      per_tier:
        Surface Unreserved Permit: {space_swap_fee: "=space_swap_fee"}
        Surface Reserved Space: {space_swap_fee: "=space_swap_fee"}
        Covered Carport Space: {space_swap_fee: "=space_swap_fee"}
        Structured Garage Space: {space_swap_fee: "=space_swap_fee"}
        EV Charging Reserved Space: {space_swap_fee: "=space_swap_fee"}
        Private Detached Garage: {space_swap_fee: "=space_swap_fee"}

extended_policies:
  - id: parking_ext_idle_fee_schedule
    base_policy_refs: [parking_evt_ev_charging]
    overwrite:
      - base_policy: parking_evt_ev_charging
        superseded_clause: >-
          When a vehicle stays plugged in more than ev_idle_grace_minutes after charging completes, an idle fee of
          ev_idle_fee_per_hour per started hour after the grace period is billed as a separate line; idle fees apply to
          shared and dedicated chargers alike.
        replaced_by: >-
          The idle fee schedule re-rates the idle fee lines of a parking license, and an idle fee line stands at the
          scheduled idle fee this schedule sets.
    trigger: state_due
    subject: [parking_ev_session]
    computes: credit_amount
    target_tool: credit_idle_fee_rerate_1959dfce
    params:
      review_window_months: 3
      lookback_months_for_repeat: 6
      grace_first_dedicated: 60
      grace_second_dedicated: 45
      charger_tenure_days: 365
      lease_tenure_long_days: 1461
      lease_tenure_mid_days: 365
      standing_rate_long: 8.00
      standing_rate_mid: 10.00
      volume_high_kwh: 300
      volume_mid_kwh: 150
      volume_reduction_high: 2.00
      volume_reduction_mid: 1.00
      escalation_after_hours: 2
      escalation_repeat_many: 1.5
      escalation_repeat_one: 1.25
      offpeak_multiplier: 0.5
      mixed_multiplier: 0.75
    rule: >
      The idle fee schedule re-rates the idle fee lines of a parking license, and an idle fee line stands at the
      scheduled idle fee this schedule sets. The idle fee line under review is the most recent idle fee line posted on
      the license within review_window_months months before the handling date; idle fee lines posted earlier stand as
      billed. Its billable idle minutes are the idle minutes recorded on the line less the grace period, never below
      zero. The grace period is the product's ev_idle_grace_minutes. The billable minutes are counted in started hours.
      Every billed hour is charged at the hourly idle rate, and the hourly idle rate is the product's
      ev_idle_fee_per_hour. The scheduled idle fee is the billed hours times the hourly idle rate, rounded half up to
      the cent. The correction credited against the line is the amount billed on the line less the scheduled idle fee,
      rounded half up to the cent.
      At a dedicated charger, when no other idle fee line was posted on the license in the lookback_months_for_repeat
      months before the handling date, the grace period is grace_first_dedicated minutes; at a dedicated charger, when
      exactly one other idle fee line was posted on the license in those months, the grace period is
      grace_second_dedicated minutes; in every other case the grace period is the product's ev_idle_grace_minutes.
      At a dedicated charger on a license held at least charger_tenure_days days, the billable minutes are counted in
      completed hours and a part hour is not billed; at a dedicated charger on a license held fewer than
      charger_tenure_days days, the billable minutes are counted in started half hours and each half hour is billed as
      half an hour; in every other case the billable minutes are counted in started hours.
      When the lease the license belongs to is enrolled in autopay and its move-in date is at least
      lease_tenure_long_days days before the handling date, the standing idle rate is standing_rate_long per hour; when
      that lease is enrolled in autopay and its move-in date is at least lease_tenure_mid_days but fewer than
      lease_tenure_long_days days before the handling date, the standing idle rate is standing_rate_mid per hour; in
      every other case the standing idle rate is the product's ev_idle_fee_per_hour.
      When the energy billed on the license in the review_window_months months before the handling date totals at
      least volume_high_kwh kWh, the volume reduction is volume_reduction_high per hour; when it totals at least
      volume_mid_kwh but less than volume_high_kwh kWh, the volume reduction is volume_reduction_mid per hour; in every
      other case there is no volume reduction. The hourly idle rate is the standing idle rate less the volume
      reduction.
      When two or more other idle fee lines were posted on the license in the lookback_months_for_repeat months before
      the handling date, every billed hour beyond the first escalation_after_hours hours is charged at
      escalation_repeat_many times the hourly idle rate; when exactly one other idle fee line was posted on the license
      in those months, every billed hour beyond the first escalation_after_hours hours is charged at
      escalation_repeat_one times the hourly idle rate; in every other case every billed hour is charged at the hourly
      idle rate. The hourly charges are the billed hours up to escalation_after_hours at the hourly idle rate plus the
      billed hours beyond escalation_after_hours at the escalated rate.
      At a dedicated charger, when the charging session of the reviewed line delivered no on-peak energy, the scheduled
      idle fee is offpeak_multiplier times the hourly charges; at a dedicated charger, when that session delivered some
      on-peak energy, the scheduled idle fee is mixed_multiplier times the hourly charges; in every other case the
      scheduled idle fee is the hourly charges themselves. The session multiplier applies to the hourly charges as a
      whole, and the scheduled idle fee is rounded half up to the cent only once, after the multiplier.
    prerequisite: []
    cross_category:
      - category: lease
        as: branch
        reads: [autopay_enrolled, move_in_date]
        note: The standing idle rate factor takes its tier from the lease's autopay enrollment and move-in date.
    compute:
      - reviewed_in_window: "COUNT('parking_charges', within_months=K('review_window_months'), date_field='charge_date', charge_code='ev_idle_fee')"
      - reviewed_idle_minutes: "LATEST('parking_charges', 'idle_minutes', date_field='charge_date', charge_code='ev_idle_fee')"
      - reviewed_idle_billed: "LATEST('parking_charges', 'amount', date_field='charge_date', charge_code='ev_idle_fee')"
      - dedicated_charger: "P('ev_charging_included')"
      - other_idle_lines_for_grace: "COUNT('parking_charges', within_months=K('lookback_months_for_repeat'), date_field='charge_date', charge_code='ev_idle_fee') - 1"
      - grace_minutes: "K('grace_first_dedicated') if dedicated_charger and other_idle_lines_for_grace == 0 else (K('grace_second_dedicated') if dedicated_charger and other_idle_lines_for_grace == 1 else P('ev_idle_grace_minutes'))"
      - billable_minutes: "MX(0, reviewed_idle_minutes - grace_minutes)"
      - license_held_days: "DAYS(F('start_date'), NOW)"
      - billed_hours: "(billable_minutes // 60) if dedicated_charger and license_held_days >= K('charger_tenure_days') else ((-(-billable_minutes // 30)) / 2 if dedicated_charger and license_held_days < K('charger_tenure_days') else -(-billable_minutes // 60))"
      - lease_autopay: "CFIELD('lease', 'autopay_enrolled', lease_id=F('lease_id'))"
      - lease_tenure_days: "DAYS(CFIELD('lease', 'move_in_date', lease_id=F('lease_id')), NOW)"
      - standing_rate: "K('standing_rate_long') if lease_autopay == True and lease_tenure_days >= K('lease_tenure_long_days') else (K('standing_rate_mid') if lease_autopay == True and lease_tenure_days >= K('lease_tenure_mid_days') else P('ev_idle_fee_per_hour'))"
      - energy_kwh_window: "SUM('parking_charges', 'energy_kwh', within_months=K('review_window_months'), date_field='charge_date', charge_code='ev_charging_energy')"
      - volume_reduction: "K('volume_reduction_high') if energy_kwh_window >= K('volume_high_kwh') else (K('volume_reduction_mid') if energy_kwh_window >= K('volume_mid_kwh') else 0)"
      - hourly_rate: "standing_rate - volume_reduction"
      - other_idle_lines_for_escalation: "COUNT('parking_charges', within_months=K('lookback_months_for_repeat'), date_field='charge_date', charge_code='ev_idle_fee') - 1"
      - escalation_multiplier: "K('escalation_repeat_many') if other_idle_lines_for_escalation >= 2 else (K('escalation_repeat_one') if other_idle_lines_for_escalation == 1 else 1)"
      - base_hours: "MN(billed_hours, K('escalation_after_hours'))"
      - escalated_hours: "MX(0, billed_hours - K('escalation_after_hours'))"
      - hourly_charges: "base_hours * hourly_rate + escalated_hours * hourly_rate * escalation_multiplier"
      - reviewed_session: "LATEST('parking_charges', 'session_reference', date_field='charge_date', charge_code='ev_idle_fee')"
      - session_onpeak_lines: "COUNT('parking_charges', charge_code='ev_charging_energy', rate_period='on_peak', session_reference=reviewed_session)"
      - session_multiplier: "K('offpeak_multiplier') if dedicated_charger and session_onpeak_lines == 0 else (K('mixed_multiplier') if dedicated_charger and session_onpeak_lines >= 1 else 1)"
      - scheduled_idle_fee: "RND(hourly_charges * session_multiplier, 2)"
      - result: "RND(reviewed_idle_billed - scheduled_idle_fee, 2) if reviewed_in_window >= 1 else 0"
    compute_basis:
      reviewed_in_window: "The idle fee line under review is the most recent idle fee line posted on the license within review_window_months months before the handling date; idle fee lines posted earlier stand as billed."
      reviewed_idle_minutes: "Its billable idle minutes are the idle minutes recorded on the line less the grace period, never below zero."
      reviewed_idle_billed: "The correction credited against the line is the amount billed on the line less the scheduled idle fee, rounded half up to the cent."
      other_idle_lines_for_grace: "At a dedicated charger, when no other idle fee line was posted on the license in the lookback_months_for_repeat months before the handling date, the grace period is grace_first_dedicated minutes"
      grace_minutes: "At a dedicated charger, when no other idle fee line was posted on the license in the lookback_months_for_repeat months before the handling date, the grace period is grace_first_dedicated minutes; at a dedicated charger, when exactly one other idle fee line was posted on the license in those months, the grace period is grace_second_dedicated minutes; in every other case the grace period is the product's ev_idle_grace_minutes."
      billable_minutes: "Its billable idle minutes are the idle minutes recorded on the line less the grace period, never below zero."
      license_held_days: "At a dedicated charger on a license held at least charger_tenure_days days, the billable minutes are counted in completed hours and a part hour is not billed"
      billed_hours: "At a dedicated charger on a license held at least charger_tenure_days days, the billable minutes are counted in completed hours and a part hour is not billed; at a dedicated charger on a license held fewer than charger_tenure_days days, the billable minutes are counted in started half hours and each half hour is billed as half an hour; in every other case the billable minutes are counted in started hours."
      lease_autopay: "When the lease the license belongs to is enrolled in autopay and its move-in date is at least lease_tenure_long_days days before the handling date, the standing idle rate is standing_rate_long per hour"
      lease_tenure_days: "When the lease the license belongs to is enrolled in autopay and its move-in date is at least lease_tenure_long_days days before the handling date, the standing idle rate is standing_rate_long per hour"
      standing_rate: "When the lease the license belongs to is enrolled in autopay and its move-in date is at least lease_tenure_long_days days before the handling date, the standing idle rate is standing_rate_long per hour; when that lease is enrolled in autopay and its move-in date is at least lease_tenure_mid_days but fewer than lease_tenure_long_days days before the handling date, the standing idle rate is standing_rate_mid per hour; in every other case the standing idle rate is the product's ev_idle_fee_per_hour."
      energy_kwh_window: "When the energy billed on the license in the review_window_months months before the handling date totals at least volume_high_kwh kWh, the volume reduction is volume_reduction_high per hour"
      volume_reduction: "When the energy billed on the license in the review_window_months months before the handling date totals at least volume_high_kwh kWh, the volume reduction is volume_reduction_high per hour; when it totals at least volume_mid_kwh but less than volume_high_kwh kWh, the volume reduction is volume_reduction_mid per hour; in every other case there is no volume reduction."
      hourly_rate: "The hourly idle rate is the standing idle rate less the volume reduction."
      other_idle_lines_for_escalation: "When two or more other idle fee lines were posted on the license in the lookback_months_for_repeat months before the handling date, every billed hour beyond the first escalation_after_hours hours is charged at escalation_repeat_many times the hourly idle rate"
      escalation_multiplier: "When two or more other idle fee lines were posted on the license in the lookback_months_for_repeat months before the handling date, every billed hour beyond the first escalation_after_hours hours is charged at escalation_repeat_many times the hourly idle rate; when exactly one other idle fee line was posted on the license in those months, every billed hour beyond the first escalation_after_hours hours is charged at escalation_repeat_one times the hourly idle rate; in every other case every billed hour is charged at the hourly idle rate."
      base_hours: "The hourly charges are the billed hours up to escalation_after_hours at the hourly idle rate plus the billed hours beyond escalation_after_hours at the escalated rate."
      escalated_hours: "The hourly charges are the billed hours up to escalation_after_hours at the hourly idle rate plus the billed hours beyond escalation_after_hours at the escalated rate."
      reviewed_session: "At a dedicated charger, when the charging session of the reviewed line delivered no on-peak energy, the scheduled idle fee is offpeak_multiplier times the hourly charges"
      session_onpeak_lines: "At a dedicated charger, when the charging session of the reviewed line delivered no on-peak energy, the scheduled idle fee is offpeak_multiplier times the hourly charges"
      session_multiplier: "At a dedicated charger, when the charging session of the reviewed line delivered no on-peak energy, the scheduled idle fee is offpeak_multiplier times the hourly charges; at a dedicated charger, when that session delivered some on-peak energy, the scheduled idle fee is mixed_multiplier times the hourly charges; in every other case the scheduled idle fee is the hourly charges themselves."
      scheduled_idle_fee: "The session multiplier applies to the hourly charges as a whole, and the scheduled idle fee is rounded half up to the cent only once, after the multiplier."
      result: "The correction credited against the line is the amount billed on the line less the scheduled idle fee, rounded half up to the cent."
    factors:
      - id: idle_grace_period
        effect: parameter
        decides: grace_minutes
        bindings: [other_idle_lines_for_grace, grace_minutes]
        ladder:
          - when: "the product carries a dedicated charger and no other idle fee line was posted on the license in the lookback_months_for_repeat months before the handling date"
            value: "K('grace_first_dedicated')"
          - when: "the product carries a dedicated charger and exactly one other idle fee line was posted on the license in those months"
            value: "K('grace_second_dedicated')"
          - when: "otherwise"
            value: "P('ev_idle_grace_minutes')"
        baseline:
          grace_minutes: "P('ev_idle_grace_minutes')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: idle_hour_counting
        effect: method
        decides: billed_hours
        bindings: [license_held_days, billed_hours]
        ladder:
          - when: "the product carries a dedicated charger and the license has been held at least charger_tenure_days days"
            method: "the billable minutes are counted in completed hours; a part hour is not billed"
          - when: "the product carries a dedicated charger and the license has been held fewer than charger_tenure_days days"
            method: "the billable minutes are counted in started half hours, each half hour billed as half an hour"
          - when: "otherwise"
            method: "the billable minutes are counted in started hours"
        baseline:
          billed_hours: "-(-billable_minutes // 60)"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: idle_standing_rate
        effect: parameter
        decides: standing_rate
        bindings: [lease_autopay, lease_tenure_days, standing_rate]
        ladder:
          - when: "the lease is enrolled in autopay and its move-in date is at least lease_tenure_long_days days before the handling date"
            value: "K('standing_rate_long')"
          - when: "the lease is enrolled in autopay and its move-in date is at least lease_tenure_mid_days but fewer than lease_tenure_long_days days before the handling date"
            value: "K('standing_rate_mid')"
          - when: "otherwise"
            value: "P('ev_idle_fee_per_hour')"
        baseline:
          standing_rate: "P('ev_idle_fee_per_hour')"
        evidence: [cross_category, date]
        cross_difficulty: lease
      - id: idle_volume_reduction
        effect: parameter
        decides: volume_reduction
        bindings: [energy_kwh_window, volume_reduction]
        ladder:
          - when: "the energy billed on the license in the review_window_months months before the handling date totals at least volume_high_kwh kWh"
            value: "K('volume_reduction_high')"
          - when: "that energy totals at least volume_mid_kwh but less than volume_high_kwh kWh"
            value: "K('volume_reduction_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          volume_reduction: "0"
        evidence: [history]
        cross_difficulty: null
      - id: idle_repeat_escalation
        effect: parameter
        decides: escalation_multiplier
        bindings: [other_idle_lines_for_escalation, escalation_multiplier]
        ladder:
          - when: "two or more other idle fee lines were posted on the license in the lookback_months_for_repeat months before the handling date"
            value: "K('escalation_repeat_many')"
          - when: "exactly one other idle fee line was posted on the license in those months"
            value: "K('escalation_repeat_one')"
          - when: "otherwise"
            value: "1"
        baseline:
          escalation_multiplier: "1"
        evidence: [history]
        cross_difficulty: null
      - id: idle_session_multiplier
        effect: parameter
        decides: session_multiplier
        bindings: [reviewed_session, session_onpeak_lines, session_multiplier]
        ladder:
          - when: "the product carries a dedicated charger and the charging session of the reviewed line delivered no on-peak energy"
            value: "K('offpeak_multiplier')"
          - when: "the product carries a dedicated charger and that session delivered some on-peak energy"
            value: "K('mixed_multiplier')"
          - when: "otherwise"
            value: "1"
        baseline:
          session_multiplier: "1"
        evidence: [history, tier_param]
        cross_difficulty: null
    baseline:
      rule: >-
        The idle fee line under review is the most recent idle fee line posted on the license within
        review_window_months months before the handling date; idle fee lines posted earlier stand as billed. Its
        billable idle minutes are the idle minutes recorded on the line less the grace period, never below zero. The
        grace period is the product's ev_idle_grace_minutes. The billable minutes are counted in started hours. Every
        billed hour is charged at the hourly idle rate, and the hourly idle rate is the product's ev_idle_fee_per_hour.
        The scheduled idle fee is the billed hours times the hourly idle rate, rounded half up to the cent. The
        correction credited against the line is the amount billed on the line less the scheduled idle fee, rounded half
        up to the cent.
      params: [review_window_months, ev_idle_grace_minutes, ev_idle_fee_per_hour]
    inputs:
      history:
        - {table: parking_charges, aggregate: latest, field: idle_minutes, filters: {charge_code: ev_idle_fee}}
        - {table: parking_charges, aggregate: count, field: parking_charge_id, within_months: 6, filters: {charge_code: ev_idle_fee}}
        - {table: parking_charges, aggregate: sum, field: energy_kwh, within_months: 3, filters: {charge_code: ev_charging_energy}}
        - {table: parking_charges, aggregate: count, field: parking_charge_id, filters: {charge_code: ev_charging_energy, rate_period: on_peak}}
      cross_category: [lease]

  - id: parking_ext_early_cancellation_fee
    base_policy_refs: [parking_cancellation_rule]
    overwrite:
      - base_policy: parking_cancellation_rule
        superseded_clause: >-
          When the end date falls before start_date plus min_commitment_months, an early_cancellation_fee of
          early_cancellation_fee_months times the monthly fee is billed with the notice.
        replaced_by: >-
          When, at the notice date, the whole months from the license's start date are fewer than the commitment months, an early cancellation fee is billed with the notice; when they are not, no early cancellation fee is billed.
    trigger: on_request
    subject: [parking_cancellation_notice]
    computes: early_cancellation_fee
    target_tool: sign_parking_cancellation_notice_d2378b15
    params:
      fee_base_window_months: 3
      violation_lookback_months: 12
      standing_tenure_days: 90
      fee_months_established: 0.75
      fee_months_new: 0.9
      long_term_months: 13
      standard_term_months: 10
      long_term_reduction_months: 2
      standard_term_reduction_months: 1
      proration_floor: 0.5
      military_share: 0
      preferred_employer_share: 0.8
      activation_credit_full_days: 120
      activation_credit_half_days: 60
      activation_credit_half_share: 0.5
    rule: >
      A resident cancels a license by signing a cancellation notice, and the end date must be at least the product's
      cancellation_notice_days calendar days after the notice date. When, at the notice date, the whole months from the license's start date are fewer than the commitment months, an early cancellation fee is billed with the notice; when they are not, no early cancellation fee is billed. The commitment months are the product's min_commitment_months. The early cancellation fee is the fee months times the fee base, rounded half up
      to the cent. The fee months are the product's early_cancellation_fee_months. The fee base is the monthly fee in
      force on the license.
      The early cancellation fee is fixed only after every idle fee line posted on the license in the three months
      before the notice date stands at the amount the idle fee schedule sets.
      When the product carries a dedicated charger and energy was billed on the license in the fee_base_window_months
      months before the notice date, the fee base is the average monthly net billing of that window: the monthly
      license fee lines, energy lines and idle fee lines posted on the license in the window, less the charge reversal
      and bundle discount credits posted on the license in the window, divided by fee_base_window_months; when the
      product carries no dedicated charger and a bundle discount credit was posted on the license in that window, the
      fee base is the monthly license fee lines posted in the window less the bundle discount credits posted in the
      window, divided by the number of monthly license fee lines posted in the window; in every other case the fee base
      is the monthly fee in force on the license.
      When no violation of any level was recorded on the license in the violation_lookback_months months before the
      notice date and the license has been held at least standing_tenure_days days, the fee months are
      fee_months_established; when no violation was recorded on the license in those months and the license has been
      held fewer than standing_tenure_days days, the fee months are fee_months_new; in every other case the fee months
      are the product's early_cancellation_fee_months.
      When the current lease term agreement of the lease runs long_term_months months or more, the commitment months are
      the product's min_commitment_months less long_term_reduction_months, never below zero; when it runs at least
      standard_term_months but fewer than long_term_months months, the commitment months are the product's
      min_commitment_months less standard_term_reduction_months, never below zero; in every other case the commitment
      months are the product's min_commitment_months.
      The held months are the whole months from the license's start date to the notice date, and the unexpired months
      are the commitment months less the held months, never below zero. When the held months are at least half the
      commitment months, the proration factor is the unexpired months divided by the commitment months; when the held
      months are at least one but less than half the commitment months, the proration factor is the unexpired months
      divided by the commitment months but no less than proration_floor; in every other case the proration factor is
      one and the fee is not prorated.
      When the lease is enrolled in the active military rent discount program, the program share is military_share;
      when the lease is enrolled in the preferred employer rent discount program, the program share is
      preferred_employer_share; in every other case the program share is one.
      When the license has been held at least activation_credit_full_days days, the activation credit is the activation
      fees posted on the license; when it has been held at least activation_credit_half_days but fewer than
      activation_credit_full_days days, the activation credit is activation_credit_half_share of the activation fees
      posted on the license; in every other case there is no activation credit.
      The fee months times the fee base is multiplied by the program share and then by the proration factor, the
      activation credit is subtracted from that product, the result is never below zero, and it is rounded half up to
      the cent only at the end.
    prerequisite:
      - problem: parking_ext_idle_fee_schedule
        kind: value_input
        gate: fee_base_amount
        form: state
        policy_source: >-
          The early cancellation fee is fixed only after every idle fee line posted on the license in the three months
          before the notice date stands at the amount the idle fee schedule sets.
        condition: >-
          Every idle fee line posted on the license in the three months before the notice date stands at its scheduled idle fee, net of any charge reversal credit pointing at it, so any correction such a line needed is among the credits of the fee base window.
        resolved_by: credit_idle_fee_rerate_1959dfce
        effect: >-
          The idle correction credit is posted on the license inside the fee base window, so the average monthly net
          billing that the fee base takes for a dedicated-charger license falls by one third of that credit.
    cross_category:
      - category: lease
        as: branch
        reads: [rent_discount_program]
        note: The program share factor takes its tier from the rent discount program the lease is enrolled in.
      - category: term
        as: branch
        reads: [term_months, status]
        note: The commitment months factor takes its tier from the length of the lease's current term agreement.
    compute:
      - dedicated_charger: "P('ev_charging_included')"
      - energy_lines_window: "COUNT('parking_charges', within_months=K('fee_base_window_months'), date_field='charge_date', charge_code='ev_charging_energy')"
      - bundle_lines_window: "COUNT('parking_charges', within_months=K('fee_base_window_months'), date_field='charge_date', charge_code='bundle_discount')"
      - fee_lines_window_count: "COUNT('parking_charges', within_months=K('fee_base_window_months'), date_field='charge_date', charge_code='monthly_license_fee')"
      - fee_lines_window_total: "SUM('parking_charges', 'amount', within_months=K('fee_base_window_months'), date_field='charge_date', charge_code='monthly_license_fee')"
      - energy_window_total: "SUM('parking_charges', 'amount', within_months=K('fee_base_window_months'), date_field='charge_date', charge_code='ev_charging_energy')"
      - idle_window_total: "SUM('parking_charges', 'amount', within_months=K('fee_base_window_months'), date_field='charge_date', charge_code='ev_idle_fee')"
      - reversal_window_total: "SUM('parking_charges', 'amount', within_months=K('fee_base_window_months'), date_field='charge_date', charge_code='charge_reversal')"
      - bundle_window_total: "SUM('parking_charges', 'amount', within_months=K('fee_base_window_months'), date_field='charge_date', charge_code='bundle_discount')"
      - fee_base_amount: "((fee_lines_window_total + energy_window_total + idle_window_total - reversal_window_total - bundle_window_total) / K('fee_base_window_months')) if dedicated_charger and energy_lines_window >= 1 else (((fee_lines_window_total - bundle_window_total) / fee_lines_window_count) if (not dedicated_charger) and bundle_lines_window >= 1 else F('monthly_fee'))"
      - violations_window: "COUNT('parking_activity', within_months=K('violation_lookback_months'), date_field='activity_date', event_type='parking_violation')"
      - held_days_for_standing: "DAYS(F('start_date'), NOW)"
      - fee_months: "K('fee_months_established') if violations_window == 0 and held_days_for_standing >= K('standing_tenure_days') else (K('fee_months_new') if violations_window == 0 and held_days_for_standing < K('standing_tenure_days') else P('early_cancellation_fee_months'))"
      - current_term_months: "CFIELD('term', 'term_months', lease_id=F('lease_id'), status='current') or 0"
      - commitment_months: "MX(0, P('min_commitment_months') - K('long_term_reduction_months')) if current_term_months >= K('long_term_months') else (MX(0, P('min_commitment_months') - K('standard_term_reduction_months')) if current_term_months >= K('standard_term_months') else P('min_commitment_months'))"
      - held_months: "MONTHS(F('start_date'), NOW)"
      - unexpired_months: "MX(0, commitment_months - held_months)"
      - proration_factor: "(unexpired_months / commitment_months) if commitment_months > 0 and held_months * 2 >= commitment_months else (MX(K('proration_floor'), unexpired_months / commitment_months) if commitment_months > 0 and held_months >= 1 else 1)"
      - lease_program: "CFIELD('lease', 'rent_discount_program', lease_id=F('lease_id'))"
      - program_share: "K('military_share') if lease_program == 'active_military' else (K('preferred_employer_share') if lease_program == 'preferred_employer' else 1)"
      - activation_fees_posted: "SUM('parking_charges', 'amount', charge_code='activation_fee')"
      - held_days_for_activation: "DAYS(F('start_date'), NOW)"
      - activation_credit: "activation_fees_posted if held_days_for_activation >= K('activation_credit_full_days') else (activation_fees_posted * K('activation_credit_half_share') if held_days_for_activation >= K('activation_credit_half_days') else 0)"
      - fee_before_credit: "fee_months * fee_base_amount * program_share * proration_factor"
      - fee_applies: "held_months < commitment_months"
      - result: "RND(MX(0, fee_before_credit - activation_credit), 2) if fee_applies else 0"
    compute_basis:
      energy_lines_window: "When the product carries a dedicated charger and energy was billed on the license in the fee_base_window_months months before the notice date, the fee base is the average monthly net billing of that window"
      bundle_lines_window: "when the product carries no dedicated charger and a bundle discount credit was posted on the license in that window"
      fee_lines_window_count: "the fee base is the monthly license fee lines posted in the window less the bundle discount credits posted in the window, divided by the number of monthly license fee lines posted in the window"
      fee_lines_window_total: "the monthly license fee lines, energy lines and idle fee lines posted on the license in the window, less the charge reversal and bundle discount credits posted on the license in the window, divided by fee_base_window_months"
      energy_window_total: "the monthly license fee lines, energy lines and idle fee lines posted on the license in the window, less the charge reversal and bundle discount credits posted on the license in the window, divided by fee_base_window_months"
      idle_window_total: "the monthly license fee lines, energy lines and idle fee lines posted on the license in the window, less the charge reversal and bundle discount credits posted on the license in the window, divided by fee_base_window_months"
      reversal_window_total: "the monthly license fee lines, energy lines and idle fee lines posted on the license in the window, less the charge reversal and bundle discount credits posted on the license in the window, divided by fee_base_window_months"
      bundle_window_total: "the monthly license fee lines, energy lines and idle fee lines posted on the license in the window, less the charge reversal and bundle discount credits posted on the license in the window, divided by fee_base_window_months"
      fee_base_amount: "When the product carries a dedicated charger and energy was billed on the license in the fee_base_window_months months before the notice date, the fee base is the average monthly net billing of that window: the monthly license fee lines, energy lines and idle fee lines posted on the license in the window, less the charge reversal and bundle discount credits posted on the license in the window, divided by fee_base_window_months; when the product carries no dedicated charger and a bundle discount credit was posted on the license in that window, the fee base is the monthly license fee lines posted in the window less the bundle discount credits posted in the window, divided by the number of monthly license fee lines posted in the window; in every other case the fee base is the monthly fee in force on the license."
      violations_window: "When no violation of any level was recorded on the license in the violation_lookback_months months before the notice date and the license has been held at least standing_tenure_days days, the fee months are fee_months_established"
      held_days_for_standing: "When no violation of any level was recorded on the license in the violation_lookback_months months before the notice date and the license has been held at least standing_tenure_days days, the fee months are fee_months_established"
      fee_months: "When no violation of any level was recorded on the license in the violation_lookback_months months before the notice date and the license has been held at least standing_tenure_days days, the fee months are fee_months_established; when no violation was recorded on the license in those months and the license has been held fewer than standing_tenure_days days, the fee months are fee_months_new; in every other case the fee months are the product's early_cancellation_fee_months."
      current_term_months: "When the current lease term agreement of the lease runs long_term_months months or more, the commitment months are the product's min_commitment_months less long_term_reduction_months, never below zero"
      commitment_months: "When the current lease term agreement of the lease runs long_term_months months or more, the commitment months are the product's min_commitment_months less long_term_reduction_months, never below zero; when it runs at least standard_term_months but fewer than long_term_months months, the commitment months are the product's min_commitment_months less standard_term_reduction_months, never below zero; in every other case the commitment months are the product's min_commitment_months."
      held_months: "The held months are the whole months from the license's start date to the notice date, and the unexpired months are the commitment months less the held months, never below zero."
      unexpired_months: "The held months are the whole months from the license's start date to the notice date, and the unexpired months are the commitment months less the held months, never below zero."
      proration_factor: "When the held months are at least half the commitment months, the proration factor is the unexpired months divided by the commitment months; when the held months are at least one but less than half the commitment months, the proration factor is the unexpired months divided by the commitment months but no less than proration_floor; in every other case the proration factor is one and the fee is not prorated."
      lease_program: "When the lease is enrolled in the active military rent discount program, the program share is military_share"
      program_share: "When the lease is enrolled in the active military rent discount program, the program share is military_share; when the lease is enrolled in the preferred employer rent discount program, the program share is preferred_employer_share; in every other case the program share is one."
      activation_fees_posted: "When the license has been held at least activation_credit_full_days days, the activation credit is the activation fees posted on the license"
      held_days_for_activation: "When the license has been held at least activation_credit_full_days days, the activation credit is the activation fees posted on the license"
      activation_credit: "When the license has been held at least activation_credit_full_days days, the activation credit is the activation fees posted on the license; when it has been held at least activation_credit_half_days but fewer than activation_credit_full_days days, the activation credit is activation_credit_half_share of the activation fees posted on the license; in every other case there is no activation credit."
      fee_applies: "When, at the notice date, the whole months from the license's start date are fewer than the commitment months, an early cancellation fee is billed with the notice; when they are not, no early cancellation fee is billed."
      fee_before_credit: "The fee months times the fee base is multiplied by the program share and then by the proration factor, the activation credit is subtracted from that product, the result is never below zero, and it is rounded half up to the cent only at the end."
      result: "The fee months times the fee base is multiplied by the program share and then by the proration factor, the activation credit is subtracted from that product, the result is never below zero, and it is rounded half up to the cent only at the end."
    factors:
      - id: fee_base_method
        effect: method
        decides: fee_base_amount
        bindings: [energy_lines_window, bundle_lines_window, fee_lines_window_count, fee_lines_window_total, energy_window_total, idle_window_total, reversal_window_total, bundle_window_total, fee_base_amount]
        ladder:
          - when: "the product carries a dedicated charger and energy was billed on the license in the fee_base_window_months months before the notice date"
            method: "the fee base is the average monthly net billing of the window: monthly license fee, energy and idle fee lines less charge reversal and bundle discount credits, divided by fee_base_window_months"
          - when: "the product carries no dedicated charger and a bundle discount credit was posted on the license in that window"
            method: "the fee base is the monthly license fee lines of the window less the bundle discount credits of the window, divided by the number of monthly license fee lines of the window"
          - when: "otherwise"
            method: "the fee base is the monthly fee in force on the license"
        baseline:
          fee_base_amount: "F('monthly_fee')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: fee_months_standing
        effect: parameter
        decides: fee_months
        bindings: [violations_window, held_days_for_standing, fee_months]
        ladder:
          - when: "no violation of any level was recorded on the license in the violation_lookback_months months before the notice date and the license has been held at least standing_tenure_days days"
            value: "K('fee_months_established')"
          - when: "no violation was recorded on the license in those months and the license has been held fewer than standing_tenure_days days"
            value: "K('fee_months_new')"
          - when: "otherwise"
            value: "P('early_cancellation_fee_months')"
        baseline:
          fee_months: "P('early_cancellation_fee_months')"
        evidence: [history, date]
        cross_difficulty: null
      - id: commitment_by_lease_term
        effect: parameter
        decides: commitment_months
        bindings: [current_term_months, commitment_months]
        ladder:
          - when: "the current lease term agreement of the lease runs long_term_months months or more"
            value: "MX(0, P('min_commitment_months') - K('long_term_reduction_months'))"
          - when: "the current lease term agreement runs at least standard_term_months but fewer than long_term_months months"
            value: "MX(0, P('min_commitment_months') - K('standard_term_reduction_months'))"
          - when: "otherwise"
            value: "P('min_commitment_months')"
        baseline:
          commitment_months: "P('min_commitment_months')"
        evidence: [cross_category]
        cross_difficulty: term
      - id: commitment_proration
        effect: method
        decides: proration_factor
        bindings: [held_months, unexpired_months, proration_factor]
        ladder:
          - when: "the held months are at least half the commitment months"
            method: "the fee is prorated by the unexpired months divided by the commitment months"
          - when: "the held months are at least one but less than half the commitment months"
            method: "the fee is prorated by the unexpired months divided by the commitment months, but by no less than proration_floor"
          - when: "otherwise"
            method: "the fee is not prorated"
        baseline:
          proration_factor: "1"
        evidence: [date]
        cross_difficulty: null
      - id: rent_program_share
        effect: parameter
        decides: program_share
        bindings: [lease_program, program_share]
        ladder:
          - when: "the lease is enrolled in the active military rent discount program"
            value: "K('military_share')"
          - when: "the lease is enrolled in the preferred employer rent discount program"
            value: "K('preferred_employer_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          program_share: "1"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: activation_credit_tier
        effect: parameter
        decides: activation_credit
        bindings: [activation_fees_posted, held_days_for_activation, activation_credit]
        ladder:
          - when: "the license has been held at least activation_credit_full_days days"
            value: "the activation fees posted on the license"
          - when: "the license has been held at least activation_credit_half_days but fewer than activation_credit_full_days days"
            value: "K('activation_credit_half_share') times the activation fees posted on the license"
          - when: "otherwise"
            value: "0"
        baseline:
          activation_credit: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        When, at the notice date, the whole months from the license's start date are fewer than the commitment months, an early cancellation fee is billed with the notice; when they are not, no early cancellation fee is billed. The commitment months are the product's min_commitment_months. The early cancellation fee
        is the fee months times the fee base, rounded half up to the cent. The fee months are the product's
        early_cancellation_fee_months. The fee base is the monthly fee in force on the license.
      params: [min_commitment_months, early_cancellation_fee_months, cancellation_notice_days]
    inputs:
      history:
        - {table: parking_charges, aggregate: sum, field: amount, within_months: 3, filters: {charge_code: monthly_license_fee}}
        - {table: parking_charges, aggregate: sum, field: amount, within_months: 3, filters: {charge_code: ev_charging_energy}}
        - {table: parking_charges, aggregate: sum, field: amount, within_months: 3, filters: {charge_code: ev_idle_fee}}
        - {table: parking_charges, aggregate: sum, field: amount, within_months: 3, filters: {charge_code: charge_reversal}}
        - {table: parking_charges, aggregate: sum, field: amount, filters: {charge_code: activation_fee}}
        - {table: parking_activity, aggregate: count, field: activity_id, within_months: 12, filters: {event_type: parking_violation}}
      cross_category: [lease, term]

  - id: parking_ext_violation_fine_schedule
    base_policy_refs: [parking_evt_enforcement]
    overwrite:
      - base_policy: parking_evt_enforcement
        superseded_clause: >-
          Any other violation is a warning while fewer than warnings_before_fine warnings are on record, then a fine of
          violation_fine_amount while fewer than fines_before_tow fines are on record, and then a tow.
        replaced_by: >-
          Any other violation is a warning while fewer than warnings_before_fine warnings are on record, then a fine
          while fewer than fines_before_tow fines are on record, and then a tow, and a fine stands at the scheduled fine
          this violation fine schedule sets.
    trigger: state_due
    subject: [parking_fine]
    computes: credit_amount
    target_tool: credit_violation_fine_rerate_f29c2916
    params:
      review_window_months: 3
      default_window_months: 12
      paperwork_own_plate_fine: 25.00
      paperwork_other_plate_fine: 40.00
      suspension_lookback_months: 24
      window_after_suspension_months: 24
      window_new_license_months: 6
      new_license_days: 365
      repeat_step_per_fine: 10.00
      repeat_step_single: 15.00
      standing_tenure_long_days: 1461
      standing_tenure_mid_days: 365
      standing_reduction_long: 10.00
      standing_reduction_mid: 5.00
      warning_lookback_months: 12
      warning_surcharge_many: 10.00
      warning_surcharge_one: 5.00
    rule: >
      Any other violation is a warning while fewer than warnings_before_fine warnings are on record, then a fine while
      fewer than fines_before_tow fines are on record, and then a tow, and a fine stands at the scheduled fine this
      violation fine schedule sets. The fine under review is the most recent fine billed on the license within
      review_window_months months before the handling date; fines billed earlier stand as billed. Other fines of the license are counted over the default_window_months months before the handling date. The class amount is the
      product's violation_fine_amount, and the scheduled fine is the class amount. The correction credited against the
      fine is the amount billed for it less the scheduled fine, never below zero, rounded half up to the cent.
      When the fined violation is an expired tag or unregistered vehicle violation observed on the plate registered on
      the license, the class amount is paperwork_own_plate_fine; when it is an expired tag or unregistered vehicle
      violation observed on any other plate, the class amount is paperwork_other_plate_fine; in every other case the
      class amount is the product's violation_fine_amount.
      When a reinstatement fee was billed on the license in the suspension_lookback_months months before the handling
      date, other fines are counted over a window of window_after_suspension_months months; when no reinstatement fee
      was billed in those months and the license has been held fewer than new_license_days days, other fines are
      counted over a window of window_new_license_months months; in every other case other fines are counted over the
      default_window_months months.
      When two or more other fines were billed on the license within that counting window before the handling date, the repeat step-up accrues per fine, repeat_step_per_fine for each of those other fines; when exactly one other fine was billed within the counting window, the repeat step-up is a single flat repeat_step_single; in every other case there is no repeat step-up.
      When two or more warnings were recorded on the license in the warning_lookback_months months before the handling
      date, the warning surcharge is warning_surcharge_many; when exactly one warning was recorded in those months, the
      warning surcharge is warning_surcharge_one; in every other case there is no warning surcharge.
      When the lease the license belongs to is enrolled in autopay and its move-in date is at least
      standing_tenure_long_days days before the handling date, the fine standing reduction is standing_reduction_long; when
      that lease is enrolled in autopay and its move-in date is at least standing_tenure_mid_days but fewer than
      standing_tenure_long_days days before the handling date, the fine standing reduction is standing_reduction_mid; in
      every other case there is no fine standing reduction.
      The scheduled fine is the class amount plus the repeat step-up plus the warning surcharge, less the fine standing
      reduction, and never below zero.
    prerequisite: []
    cross_category:
      - category: lease
        as: branch
        reads: [autopay_enrolled, move_in_date]
        note: The fine standing reduction factor takes its tier from the lease's autopay enrollment and move-in date.
    compute:
      - fines_in_review_window: "COUNT('parking_charges', within_months=K('review_window_months'), date_field='charge_date', charge_code='violation_fine')"
      - reviewed_fine_billed: "LATEST('parking_charges', 'amount', date_field='charge_date', charge_code='violation_fine')"
      - reviewed_violation: "LATEST('parking_charges', 'source_activity_id', date_field='charge_date', charge_code='violation_fine')"
      - reviewed_code: "LATEST('parking_activity', 'violation_code', date_field='activity_date', activity_id=reviewed_violation)"
      - reviewed_plate: "LATEST('parking_activity', 'vehicle_plate_observed', date_field='activity_date', activity_id=reviewed_violation)"
      - class_amount: "K('paperwork_own_plate_fine') if (reviewed_code == 'expired_tag' or reviewed_code == 'unregistered_vehicle') and reviewed_plate == F('vehicle_plate') else (K('paperwork_other_plate_fine') if (reviewed_code == 'expired_tag' or reviewed_code == 'unregistered_vehicle') and reviewed_plate != F('vehicle_plate') else P('violation_fine_amount'))"
      - reinstatement_fees_lookback: "COUNT('parking_charges', within_months=K('suspension_lookback_months'), date_field='charge_date', charge_code='reinstatement_fee')"
      - license_held_days: "DAYS(F('start_date'), NOW)"
      - counting_window_months: "K('window_after_suspension_months') if reinstatement_fees_lookback >= 1 else (K('window_new_license_months') if license_held_days < K('new_license_days') else K('default_window_months'))"
      - other_fines_in_window: "COUNT('parking_charges', within_months=counting_window_months, date_field='charge_date', charge_code='violation_fine') - 1"
      - repeat_step_up: "K('repeat_step_per_fine') * other_fines_in_window if other_fines_in_window >= 2 else (K('repeat_step_single') if other_fines_in_window == 1 else 0)"
      - warnings_in_lookback: "COUNT('parking_activity', within_months=K('warning_lookback_months'), date_field='activity_date', event_type='parking_violation', violation_level='warning')"
      - warning_surcharge: "K('warning_surcharge_many') if warnings_in_lookback >= 2 else (K('warning_surcharge_one') if warnings_in_lookback == 1 else 0)"
      - lease_autopay: "CFIELD('lease', 'autopay_enrolled', lease_id=F('lease_id'))"
      - lease_tenure_days: "DAYS(CFIELD('lease', 'move_in_date', lease_id=F('lease_id')), NOW)"
      - standing_reduction: "K('standing_reduction_long') if lease_autopay == True and lease_tenure_days >= K('standing_tenure_long_days') else (K('standing_reduction_mid') if lease_autopay == True and lease_tenure_days >= K('standing_tenure_mid_days') else 0)"
      - scheduled_fine: "MX(0, class_amount + repeat_step_up + warning_surcharge - standing_reduction)"
      - result: "RND(MX(0, reviewed_fine_billed - scheduled_fine), 2) if fines_in_review_window >= 1 else 0"
    compute_basis:
      fines_in_review_window: "The fine under review is the most recent fine billed on the license within review_window_months months before the handling date; fines billed earlier stand as billed."
      reviewed_fine_billed: "The correction credited against the fine is the amount billed for it less the scheduled fine, never below zero, rounded half up to the cent."
      reviewed_violation: "When the fined violation is an expired tag or unregistered vehicle violation observed on the plate registered on the license, the class amount is paperwork_own_plate_fine"
      reviewed_code: "When the fined violation is an expired tag or unregistered vehicle violation observed on the plate registered on the license, the class amount is paperwork_own_plate_fine"
      reviewed_plate: "when it is an expired tag or unregistered vehicle violation observed on any other plate, the class amount is paperwork_other_plate_fine"
      class_amount: "When the fined violation is an expired tag or unregistered vehicle violation observed on the plate registered on the license, the class amount is paperwork_own_plate_fine; when it is an expired tag or unregistered vehicle violation observed on any other plate, the class amount is paperwork_other_plate_fine; in every other case the class amount is the product's violation_fine_amount."
      reinstatement_fees_lookback: "When a reinstatement fee was billed on the license in the suspension_lookback_months months before the handling date, other fines are counted over a window of window_after_suspension_months months"
      license_held_days: "when no reinstatement fee was billed in those months and the license has been held fewer than new_license_days days, other fines are counted over a window of window_new_license_months months"
      counting_window_months: "When a reinstatement fee was billed on the license in the suspension_lookback_months months before the handling date, other fines are counted over a window of window_after_suspension_months months; when no reinstatement fee was billed in those months and the license has been held fewer than new_license_days days, other fines are counted over a window of window_new_license_months months; in every other case other fines are counted over the default_window_months months."
      other_fines_in_window: "When two or more other fines were billed on the license within that counting window before the handling date, the repeat step-up accrues per fine, repeat_step_per_fine for each of those other fines"
      repeat_step_up: "When two or more other fines were billed on the license within that counting window before the handling date, the repeat step-up accrues per fine, repeat_step_per_fine for each of those other fines; when exactly one other fine was billed within the counting window, the repeat step-up is a single flat repeat_step_single; in every other case there is no repeat step-up."
      warnings_in_lookback: "When two or more warnings were recorded on the license in the warning_lookback_months months before the handling date, the warning surcharge is warning_surcharge_many"
      warning_surcharge: "When two or more warnings were recorded on the license in the warning_lookback_months months before the handling date, the warning surcharge is warning_surcharge_many; when exactly one warning was recorded in those months, the warning surcharge is warning_surcharge_one; in every other case there is no warning surcharge."
      lease_autopay: "When the lease the license belongs to is enrolled in autopay and its move-in date is at least standing_tenure_long_days days before the handling date, the fine standing reduction is standing_reduction_long"
      lease_tenure_days: "When the lease the license belongs to is enrolled in autopay and its move-in date is at least standing_tenure_long_days days before the handling date, the fine standing reduction is standing_reduction_long"
      standing_reduction: "When the lease the license belongs to is enrolled in autopay and its move-in date is at least standing_tenure_long_days days before the handling date, the fine standing reduction is standing_reduction_long; when that lease is enrolled in autopay and its move-in date is at least standing_tenure_mid_days but fewer than standing_tenure_long_days days before the handling date, the fine standing reduction is standing_reduction_mid; in every other case there is no fine standing reduction."
      scheduled_fine: "The scheduled fine is the class amount plus the repeat step-up plus the warning surcharge, less the fine standing reduction, and never below zero."
      result: "The correction credited against the fine is the amount billed for it less the scheduled fine, never below zero, rounded half up to the cent."
    factors:
      - id: fine_class_amount
        effect: parameter
        decides: class_amount
        bindings: [reviewed_violation, reviewed_code, reviewed_plate, class_amount]
        ladder:
          - when: "the fined violation is an expired tag or unregistered vehicle violation observed on the plate registered on the license"
            value: "K('paperwork_own_plate_fine')"
          - when: "the fined violation is an expired tag or unregistered vehicle violation observed on any other plate"
            value: "K('paperwork_other_plate_fine')"
          - when: "otherwise"
            value: "P('violation_fine_amount')"
        baseline:
          class_amount: "P('violation_fine_amount')"
        evidence: [history]
        cross_difficulty: null
      - id: fine_counting_window
        effect: parameter
        decides: counting_window_months
        bindings: [reinstatement_fees_lookback, license_held_days, counting_window_months]
        ladder:
          - when: "a reinstatement fee was billed on the license in the suspension_lookback_months months before the handling date"
            value: "K('window_after_suspension_months')"
          - when: "no reinstatement fee was billed in those months and the license has been held fewer than new_license_days days"
            value: "K('window_new_license_months')"
          - when: "otherwise"
            value: "K('default_window_months')"
        baseline:
          counting_window_months: "K('default_window_months')"
        evidence: [history, date]
        cross_difficulty: null
      - id: fine_repeat_step_up
        effect: method
        decides: repeat_step_up
        bindings: [other_fines_in_window, repeat_step_up]
        ladder:
          - when: "two or more other fines were billed on the license within the counting window"
            method: "the repeat step-up accrues per fine: repeat_step_per_fine times the number of other fines in the counting window"
          - when: "exactly one other fine was billed on the license within the counting window"
            method: "the repeat step-up is a single flat repeat_step_single, whatever the fine"
          - when: "otherwise"
            method: "there is no repeat step-up"
        baseline:
          repeat_step_up: "0"
        evidence: [history]
        cross_difficulty: null
      - id: fine_warning_surcharge
        effect: parameter
        decides: warning_surcharge
        bindings: [warnings_in_lookback, warning_surcharge]
        ladder:
          - when: "two or more warnings were recorded on the license in the warning_lookback_months months before the handling date"
            value: "K('warning_surcharge_many')"
          - when: "exactly one warning was recorded on the license in those months"
            value: "K('warning_surcharge_one')"
          - when: "otherwise"
            value: "0"
        baseline:
          warning_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: fine_standing_reduction
        effect: parameter
        decides: standing_reduction
        bindings: [lease_autopay, lease_tenure_days, standing_reduction]
        ladder:
          - when: "the lease is enrolled in autopay and its move-in date is at least standing_tenure_long_days days before the handling date"
            value: "K('standing_reduction_long')"
          - when: "the lease is enrolled in autopay and its move-in date is at least standing_tenure_mid_days but fewer than standing_tenure_long_days days before the handling date"
            value: "K('standing_reduction_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          standing_reduction: "0"
        evidence: [cross_category, date]
        cross_difficulty: lease
    baseline:
      rule: >-
        The fine under review is the most recent fine billed on the license within review_window_months months before
        the handling date; fines billed earlier stand as billed. Other fines of the license are counted over the default_window_months months before the handling date. The class amount is the product's violation_fine_amount,
        and the scheduled fine is the class amount. The correction credited against the fine is the amount billed for it
        less the scheduled fine, never below zero, rounded half up to the cent.
      params: [review_window_months, default_window_months, violation_fine_amount]
    inputs:
      history:
        - {table: parking_charges, aggregate: latest, field: amount, filters: {charge_code: violation_fine}}
        - {table: parking_charges, aggregate: count, field: parking_charge_id, within_months: 24, filters: {charge_code: violation_fine}}
        - {table: parking_charges, aggregate: count, field: parking_charge_id, within_months: 24, filters: {charge_code: reinstatement_fee}}
        - {table: parking_activity, aggregate: latest, field: violation_code, filters: {event_type: parking_violation}}
        - {table: parking_activity, aggregate: count, field: activity_id, within_months: 12, filters: {violation_level: warning}}
      cross_category: [lease]

  - id: parking_ext_storage_bundle_discount
    base_policy_refs: [parking_agg_household_pricing]
    overwrite:
      - base_policy: parking_agg_household_pricing
        superseded_clause: >-
          While the lease also holds a storage rental in active status, each Covered Carport Space, Structured Garage
          Space, EV Charging Reserved Space and Private Detached Garage license of the lease receives a bundle_discount
          credit of bundle_discount_with_storage_pct times that month's posted fee, rounded half up to the cent, against
          the monthly fee line; the discount applies to monthly fees only and never to EV charging, fines or service
          fees.
        replaced_by: >-
          While the lease also holds a storage rental in active status, each Covered Carport Space, Structured Garage
          Space, EV Charging Reserved Space and Private Detached Garage license of the lease receives a storage bundle
          discount credit against its monthly fee line at the rate this storage bundle program sets; the discount applies
          to monthly fees only and never to EV charging, fines or service fees.
      - base_policy: parking_agg_household_pricing
        superseded_clause: >-
          The bundle discount does not stack with any other parking discount and is not posted for a month in which the
          storage rental was not active on the fee charge day.
        replaced_by: >-
          The storage bundle discount does not stack with any other parking discount, and no credit is posted against the
          fee line of a month in which the storage rental was not active on the fee charge day; the welcome catch-up for
          the storage-active days before the first covered fee line is carried on that first covered line.
    trigger: state_due
    subject: [parking_credit]
    computes: discount_amount
    target_tool: credit_bundle_discount_a8c94fb6
    params:
      bundle_rent_high: 100.00
      bundle_rent_mid: 75.00
      bundle_premium_high: 0.05
      bundle_premium_mid: 0.02
      loyalty_tenure_long_days: 1461
      loyalty_tenure_mid_days: 730
      loyalty_uplift_long: 0.03
      loyalty_uplift_mid: 0.02
      parking_tenure_long_days: 730
      parking_tenure_mid_days: 365
      parking_uplift_long: 0.02
      parking_uplift_mid: 0.01
      fine_lookback_months: 12
      clawback_many: 0.04
      clawback_one: 0.02
      welcome_days: 60
      catchup_month_days: 30
      catchup_full_months: 1
    rule: >
      While the lease also holds a storage rental in active status, each Covered Carport Space, Structured Garage Space,
      EV Charging Reserved Space and Private Detached Garage license of the lease receives a storage bundle discount
      credit against its monthly fee line at the rate this storage bundle program sets; the discount applies to monthly
      fees only and never to EV charging, fines or service fees. The fee line credited is the most recent monthly fee
      line of the license; it earns the credit only when the storage rental is active and its start date falls on or
      before the fee line's posting date, and a fee line posted before the storage rental started earns none. The bundle
      rate is the product's bundle_discount_with_storage_pct. The storage bundle discount credit is the bundle rate times
      the posted amount of the fee line, rounded half up to the cent.
      When the storage rental's monthly rent is at least bundle_rent_high, the program rate is the product's bundle_discount_with_storage_pct plus bundle_premium_high; when it is at least bundle_rent_mid but less than bundle_rent_high, the program rate is the product's bundle_discount_with_storage_pct plus bundle_premium_mid; in every other case the program rate is the product's bundle_discount_with_storage_pct.
      When the lease is enrolled in autopay and its move-in date is at least loyalty_tenure_long_days days before the
      handling date, the lease loyalty uplift is loyalty_uplift_long; when the lease is enrolled in autopay and its
      move-in date is at least loyalty_tenure_mid_days but fewer than loyalty_tenure_long_days days before the handling
      date, the lease loyalty uplift is loyalty_uplift_mid; in every other case there is no lease loyalty uplift.
      When the license has been held at least parking_tenure_long_days days, the parking tenure uplift is
      parking_uplift_long; when it has been held at least parking_tenure_mid_days but fewer than
      parking_tenure_long_days days, the parking tenure uplift is parking_uplift_mid; in every other case there is no
      parking tenure uplift.
      When two or more fines were billed on the license in the fine_lookback_months months before the handling date,
      the enforcement clawback is clawback_many; when exactly one fine was billed on the license in those months, the
      enforcement clawback is clawback_one; in every other case there is no enforcement clawback.
      The bundle rate is the program rate plus the lease loyalty uplift plus the parking tenure uplift, less the
      enforcement clawback, and never below zero.
      When no storage bundle discount credit has ever been posted on the license and the storage rental started fewer than welcome_days days before the handling date, the credit carries a prorated welcome catch-up: the bundle rate times the posted fee is multiplied by one plus the days the storage rental was active before the fee line's posting date divided by catchup_month_days, and the catch-up never exceeds one whole month; when no storage bundle discount credit has ever been posted on the license and the storage rental started welcome_days days or more before the handling date, the credit carries a flat catch-up of catchup_full_months whole month, so the bundle rate times the posted fee is multiplied by one plus catchup_full_months; in every other case there is no catch-up. The catch-up acts on the product of the bundle rate and the posted fee, and the credit is rounded half up to the cent only once, at the end. The storage bundle discount does not stack with any other parking discount, and no credit is posted against the fee line of a month in which the storage rental was not active on the fee charge day; the welcome catch-up for the storage-active days before the first covered fee line is carried on that first covered line.
    prerequisite: []
    cross_category:
      - category: storage
        as: branch
        reads: [status, start_date, monthly_rent]
        note: The program rate factor reads the active storage rental's monthly rent and the welcome catch-up reads its start date.
      - category: lease
        as: branch
        reads: [autopay_enrolled, move_in_date]
        note: The lease loyalty uplift factor takes its tier from the lease's autopay enrollment and move-in date.
    compute:
      - fee_line_amount: "LATEST('parking_charges', 'amount', date_field='charge_date', charge_code='monthly_license_fee')"
      - fee_line_date: "LATEST('parking_charges', 'charge_date', date_field='charge_date', charge_code='monthly_license_fee')"
      - storage_active: "EXISTS('storage', lease_id=F('lease_id'), status='active')"
      - storage_start: "CFIELD('storage', 'start_date', lease_id=F('lease_id'), status='active')"
      - fee_line_covered: "storage_active and DAYS(storage_start, fee_line_date) >= 0"
      - storage_rent: "CFIELD('storage', 'monthly_rent', lease_id=F('lease_id'), status='active') or 0"
      - program_rate: "P('bundle_discount_with_storage_pct') + K('bundle_premium_high') if storage_rent >= K('bundle_rent_high') else (P('bundle_discount_with_storage_pct') + K('bundle_premium_mid') if storage_rent >= K('bundle_rent_mid') else P('bundle_discount_with_storage_pct'))"
      - lease_autopay: "CFIELD('lease', 'autopay_enrolled', lease_id=F('lease_id'))"
      - lease_tenure_days: "DAYS(CFIELD('lease', 'move_in_date', lease_id=F('lease_id')), NOW)"
      - loyalty_uplift: "K('loyalty_uplift_long') if lease_autopay == True and lease_tenure_days >= K('loyalty_tenure_long_days') else (K('loyalty_uplift_mid') if lease_autopay == True and lease_tenure_days >= K('loyalty_tenure_mid_days') else 0)"
      - license_held_days: "DAYS(F('start_date'), NOW)"
      - parking_uplift: "K('parking_uplift_long') if license_held_days >= K('parking_tenure_long_days') else (K('parking_uplift_mid') if license_held_days >= K('parking_tenure_mid_days') else 0)"
      - fines_in_lookback: "COUNT('parking_charges', within_months=K('fine_lookback_months'), date_field='charge_date', charge_code='violation_fine')"
      - enforcement_clawback: "K('clawback_many') if fines_in_lookback >= 2 else (K('clawback_one') if fines_in_lookback == 1 else 0)"
      - bundle_rate: "MX(0, program_rate + loyalty_uplift + parking_uplift - enforcement_clawback)"
      - bundle_credits_ever: "COUNT('parking_charges', charge_code='bundle_discount')"
      - storage_days: "DAYS(storage_start or NOW, NOW)"
      - storage_days_before_fee: "DAYS(storage_start or fee_line_date, fee_line_date)"
      - catchup_factor: "1 + MN(1, storage_days_before_fee / K('catchup_month_days')) if bundle_credits_ever == 0 and storage_days < K('welcome_days') else (1 + K('catchup_full_months') if bundle_credits_ever == 0 and storage_days >= K('welcome_days') else 1)"
      - result: "RND(catchup_factor * bundle_rate * fee_line_amount, 2) if fee_line_covered else 0"
    compute_basis:
      fee_line_amount: "The storage bundle discount credit is the bundle rate times the posted amount of the fee line, rounded half up to the cent."
      fee_line_date: "The fee line credited is the most recent monthly fee line of the license; it earns the credit only when the storage rental is active and its start date falls on or before the fee line's posting date, and a fee line posted before the storage rental started earns none."
      storage_active: "it earns the credit only when the storage rental is active and its start date falls on or before the fee line's posting date"
      storage_start: "it earns the credit only when the storage rental is active and its start date falls on or before the fee line's posting date"
      fee_line_covered: "The fee line credited is the most recent monthly fee line of the license; it earns the credit only when the storage rental is active and its start date falls on or before the fee line's posting date, and a fee line posted before the storage rental started earns none."
      storage_rent: "When the storage rental's monthly rent is at least bundle_rent_high, the program rate is the product's bundle_discount_with_storage_pct plus bundle_premium_high"
      program_rate: "When the storage rental's monthly rent is at least bundle_rent_high, the program rate is the product's bundle_discount_with_storage_pct plus bundle_premium_high; when it is at least bundle_rent_mid but less than bundle_rent_high, the program rate is the product's bundle_discount_with_storage_pct plus bundle_premium_mid; in every other case the program rate is the product's bundle_discount_with_storage_pct."
      lease_autopay: "When the lease is enrolled in autopay and its move-in date is at least loyalty_tenure_long_days days before the handling date, the lease loyalty uplift is loyalty_uplift_long"
      lease_tenure_days: "When the lease is enrolled in autopay and its move-in date is at least loyalty_tenure_long_days days before the handling date, the lease loyalty uplift is loyalty_uplift_long"
      loyalty_uplift: "When the lease is enrolled in autopay and its move-in date is at least loyalty_tenure_long_days days before the handling date, the lease loyalty uplift is loyalty_uplift_long; when the lease is enrolled in autopay and its move-in date is at least loyalty_tenure_mid_days but fewer than loyalty_tenure_long_days days before the handling date, the lease loyalty uplift is loyalty_uplift_mid; in every other case there is no lease loyalty uplift."
      license_held_days: "When the license has been held at least parking_tenure_long_days days, the parking tenure uplift is parking_uplift_long"
      parking_uplift: "When the license has been held at least parking_tenure_long_days days, the parking tenure uplift is parking_uplift_long; when it has been held at least parking_tenure_mid_days but fewer than parking_tenure_long_days days, the parking tenure uplift is parking_uplift_mid; in every other case there is no parking tenure uplift."
      fines_in_lookback: "When two or more fines were billed on the license in the fine_lookback_months months before the handling date, the enforcement clawback is clawback_many"
      enforcement_clawback: "When two or more fines were billed on the license in the fine_lookback_months months before the handling date, the enforcement clawback is clawback_many; when exactly one fine was billed on the license in those months, the enforcement clawback is clawback_one; in every other case there is no enforcement clawback."
      bundle_rate: "The bundle rate is the program rate plus the lease loyalty uplift plus the parking tenure uplift, less the enforcement clawback, and never below zero."
      bundle_credits_ever: "When no storage bundle discount credit has ever been posted on the license and the storage rental started fewer than welcome_days days before the handling date, the credit carries a prorated welcome catch-up"
      storage_days: "When no storage bundle discount credit has ever been posted on the license and the storage rental started fewer than welcome_days days before the handling date, the credit carries a prorated welcome catch-up"
      storage_days_before_fee: "the bundle rate times the posted fee is multiplied by one plus the days the storage rental was active before the fee line's posting date divided by catchup_month_days, and the catch-up never exceeds one whole month"
      catchup_factor: "When no storage bundle discount credit has ever been posted on the license and the storage rental started fewer than welcome_days days before the handling date, the credit carries a prorated welcome catch-up: the bundle rate times the posted fee is multiplied by one plus the days the storage rental was active before the fee line's posting date divided by catchup_month_days, and the catch-up never exceeds one whole month; when no storage bundle discount credit has ever been posted on the license and the storage rental started welcome_days days or more before the handling date, the credit carries a flat catch-up of catchup_full_months whole month, so the bundle rate times the posted fee is multiplied by one plus catchup_full_months; in every other case there is no catch-up."
      result: "The catch-up acts on the product of the bundle rate and the posted fee, and the credit is rounded half up to the cent only once, at the end. The storage bundle discount does not stack with any other parking discount, and no credit is posted against the fee line of a month in which the storage rental was not active on the fee charge day; the welcome catch-up for the storage-active days before the first covered fee line is carried on that first covered line."
    factors:
      - id: bundle_program_rate
        effect: parameter
        decides: program_rate
        bindings: [storage_rent, program_rate]
        ladder:
          - when: "the active storage rental's monthly rent is at least bundle_rent_high"
            value: "P('bundle_discount_with_storage_pct') + K('bundle_premium_high')"
          - when: "the active storage rental's monthly rent is at least bundle_rent_mid but less than bundle_rent_high"
            value: "P('bundle_discount_with_storage_pct') + K('bundle_premium_mid')"
          - when: "otherwise"
            value: "P('bundle_discount_with_storage_pct')"
        baseline:
          program_rate: "P('bundle_discount_with_storage_pct')"
        evidence: [cross_category]
        cross_difficulty: null
      - id: bundle_lease_loyalty
        effect: parameter
        decides: loyalty_uplift
        bindings: [lease_autopay, lease_tenure_days, loyalty_uplift]
        ladder:
          - when: "the lease is enrolled in autopay and its move-in date is at least loyalty_tenure_long_days days before the handling date"
            value: "K('loyalty_uplift_long')"
          - when: "the lease is enrolled in autopay and its move-in date is at least loyalty_tenure_mid_days but fewer than loyalty_tenure_long_days days before the handling date"
            value: "K('loyalty_uplift_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          loyalty_uplift: "0"
        evidence: [cross_category, date]
        cross_difficulty: lease
      - id: bundle_parking_tenure
        effect: parameter
        decides: parking_uplift
        bindings: [license_held_days, parking_uplift]
        ladder:
          - when: "the license has been held at least parking_tenure_long_days days"
            value: "K('parking_uplift_long')"
          - when: "the license has been held at least parking_tenure_mid_days but fewer than parking_tenure_long_days days"
            value: "K('parking_uplift_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          parking_uplift: "0"
        evidence: [date]
        cross_difficulty: null
      - id: bundle_enforcement_clawback
        effect: parameter
        decides: enforcement_clawback
        bindings: [fines_in_lookback, enforcement_clawback]
        ladder:
          - when: "two or more fines were billed on the license in the fine_lookback_months months before the handling date"
            value: "K('clawback_many')"
          - when: "exactly one fine was billed on the license in those months"
            value: "K('clawback_one')"
          - when: "otherwise"
            value: "0"
        baseline:
          enforcement_clawback: "0"
        evidence: [history]
        cross_difficulty: null
      - id: bundle_welcome_catchup
        effect: method
        decides: catchup_factor
        bindings: [bundle_credits_ever, storage_days, storage_days_before_fee, catchup_factor]
        ladder:
          - when: "no storage bundle discount credit has ever been posted on the license and the storage rental started fewer than welcome_days days before the handling date"
            method: "a prorated catch-up: the bundle rate times the posted fee is multiplied by one plus the storage-active days before the fee line's posting date over catchup_month_days, never more than one whole month"
          - when: "no storage bundle discount credit has ever been posted on the license and the storage rental started welcome_days days or more before the handling date"
            method: "a flat catch-up of catchup_full_months whole month: the bundle rate times the posted fee is multiplied by one plus catchup_full_months"
          - when: "otherwise"
            method: "no catch-up: the credit is the bundle rate times the posted fee"
        baseline:
          catchup_factor: "1"
        evidence: [history, cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        The fee line credited is the most recent monthly fee line of the license; it earns the credit only when the
        storage rental is active and its start date falls on or before the fee line's posting date, and a fee line
        posted before the storage rental started earns none. The bundle rate is the product's
        bundle_discount_with_storage_pct. The storage bundle discount credit is the bundle rate times the posted amount of
        the fee line, rounded half up to the cent.
      params: [bundle_discount_with_storage_pct]
    inputs:
      history:
        - {table: parking_charges, aggregate: latest, field: amount, filters: {charge_code: monthly_license_fee}}
        - {table: parking_charges, aggregate: count, field: parking_charge_id, within_months: 12, filters: {charge_code: violation_fine}}
        - {table: parking_charges, aggregate: count, field: parking_charge_id, filters: {charge_code: bundle_discount}}
      cross_category: [storage, lease]

  - id: parking_ext_suspension_cure_payment
    base_policy_refs: [parking_evt_payments_and_changes, parking_suspension_rule]
    overwrite:
      - base_policy: parking_suspension_rule
        superseded_clause: >-
          Privileges are restored only after the whole parking balance and the reinstatement_fee are paid.
        replaced_by: >-
          The cure amount is what a resident pays toward a suspended license so that its privileges can be restored.
    trigger: on_request
    subject: [parking_payment]
    computes: payment_amount
    target_tool: pay_parking_balance_59b25ecc
    params:
      scope_tenure_days: 730
      scope_window_months: 1
      prepay_lookback_months: 24
      prepay_months_many: 1.0
      prepay_months_one: 0.75
      standing_tenure_long_days: 1461
      standing_tenure_mid_days: 365
      prepay_reduction_long: 0.2
      prepay_reduction_mid: 0.1
      net_fee_window_months: 1
      new_license_days: 365
    rule: >
      The cure amount is what a resident pays toward a suspended license so that its privileges can be restored. A
      payment is applied to the oldest open parking charge first, and the credits and payments already posted on the
      license always count in full. The cure amount is the whole parking balance of the license, rounded half up to the
      cent.
      The cure amount is worked out only after every fine billed on the license in the three months before the handling
      date stands at the amount the violation fine schedule sets.
      The cure amount is not worked out until the most recent monthly fee line of the license, when it was posted on or after the start date of the lease's active storage rental, carries the storage bundle discount credit owed on it.
      When the license has been held at least scope_tenure_days days and the lease is enrolled in autopay, the charges
      posted on the license within scope_window_months month before the handling date are left out of the cure amount;
      when the license has been held at least scope_tenure_days days and the lease is not enrolled in autopay, only the
      monthly fee lines posted within scope_window_months month before the handling date are left out; in every other
      case nothing is left out.
      When two or more reinstatement fees were billed on the license in the prepay_lookback_months months before the
      handling date, the security prepayment months are prepay_months_many; when exactly one reinstatement fee was billed
      in those months, the security prepayment months are prepay_months_one; in every other case there is no security
      prepayment.
      When the lease's move-in date is at least standing_tenure_long_days days before the handling date, the security
      prepayment months are reduced by prepay_reduction_long; when it is at least standing_tenure_mid_days but fewer than
      standing_tenure_long_days days before the handling date, they are reduced by prepay_reduction_mid; in every other
      case they are not reduced. The security prepayment months never fall below zero.
      When a storage bundle discount credit was posted on the license within net_fee_window_months month before the
      handling date and the lease holds an active storage rental, the prepayment fee is the most recent monthly fee line
      less the most recent storage bundle discount credit; when that is not the case and the license has been held fewer
      than new_license_days days, the prepayment fee is the product's monthly_license_fee; in every other case the
      prepayment fee is the monthly fee in force on the license.
      The cure amount is the whole parking balance less the charges left out, plus the security prepayment months times
      the prepayment fee, rounded half up to the cent once at the end.
    prerequisite:
      - problem: parking_ext_violation_fine_schedule
        kind: value_input
        gate: whole_balance
        form: state
        policy_source: >-
          The cure amount is worked out only after every fine billed on the license in the three months before the
          handling date stands at the amount the violation fine schedule sets.
        condition: >-
          Every fine billed on the license in the three months before the handling date carries the charge reversal
          credit that brings it down to its scheduled fine, so that credit is already inside the parking balance.
        resolved_by: credit_violation_fine_rerate_f29c2916
        effect: >-
          The fine correction credit lowers the license's parking balance by the amount credited, and the whole balance
          the cure amount starts from falls by the same amount.
      - problem: parking_ext_storage_bundle_discount
        kind: value_input
        gate: prepay_fee
        form: state
        policy_source: >-
          The cure amount is not worked out until the most recent monthly fee line of the license, when it was posted on or after the start date of the lease's active storage rental, carries the storage bundle discount credit owed on it.
        condition: >-
          The most recent monthly fee line of the license, when posted on or after the start date of the lease's active storage rental, carries its storage bundle discount credit on the license.
        resolved_by: credit_bundle_discount_a8c94fb6
        effect: >-
          The bundle credit lowers the parking balance and, once posted within the month, makes the prepayment fee the
          most recent monthly fee line less that credit instead of the monthly fee in force.
    cross_category:
      - category: lease
        as: branch
        reads: [autopay_enrolled, move_in_date]
        note: The cure scope factor reads the lease's autopay enrollment and the prepayment reduction factor its move-in date.
      - category: storage
        as: existence
        reads: [status]
        note: The prepayment fee factor checks that the lease holds an active storage rental.
    compute:
      - whole_balance: "F('balance_due')"
      - held_days_for_scope: "DAYS(F('start_date'), NOW)"
      - lease_autopay: "CFIELD('lease', 'autopay_enrolled', lease_id=F('lease_id'))"
      - recent_fee_lines: "SUM('parking_charges', 'amount', within_months=K('scope_window_months'), date_field='charge_date', charge_code='monthly_license_fee')"
      - recent_charges: "SUM('parking_charges', 'amount', within_months=K('scope_window_months'), date_field='charge_date', event_type='parking_fee_charge') + SUM('parking_charges', 'amount', within_months=K('scope_window_months'), date_field='charge_date', event_type='parking_ev_session') + SUM('parking_charges', 'amount', within_months=K('scope_window_months'), date_field='charge_date', event_type='parking_fine')"
      - left_out: "recent_charges if held_days_for_scope >= K('scope_tenure_days') and lease_autopay == True else (recent_fee_lines if held_days_for_scope >= K('scope_tenure_days') and lease_autopay != True else 0)"
      - reinstatement_fees_lookback: "COUNT('parking_charges', within_months=K('prepay_lookback_months'), date_field='charge_date', charge_code='reinstatement_fee')"
      - base_prepay_months: "K('prepay_months_many') if reinstatement_fees_lookback >= 2 else (K('prepay_months_one') if reinstatement_fees_lookback == 1 else 0)"
      - lease_tenure_days: "DAYS(CFIELD('lease', 'move_in_date', lease_id=F('lease_id')), NOW)"
      - prepay_reduction: "K('prepay_reduction_long') if lease_tenure_days >= K('standing_tenure_long_days') else (K('prepay_reduction_mid') if lease_tenure_days >= K('standing_tenure_mid_days') else 0)"
      - prepay_months: "MX(0, base_prepay_months - prepay_reduction)"
      - recent_bundle_credits: "COUNT('parking_charges', within_months=K('net_fee_window_months'), date_field='charge_date', charge_code='bundle_discount')"
      - storage_active: "EXISTS('storage', lease_id=F('lease_id'), status='active')"
      - latest_fee_line: "LATEST('parking_charges', 'amount', date_field='charge_date', charge_code='monthly_license_fee')"
      - latest_bundle_credit: "LATEST('parking_charges', 'amount', date_field='charge_date', charge_code='bundle_discount') or 0"
      - held_days_for_fee: "DAYS(F('start_date'), NOW)"
      - prepay_fee: "(latest_fee_line - latest_bundle_credit) if recent_bundle_credits >= 1 and storage_active else (P('monthly_license_fee') if held_days_for_fee < K('new_license_days') else F('monthly_fee'))"
      - result: "RND(whole_balance - left_out + prepay_months * prepay_fee, 2)"
    compute_basis:
      whole_balance: "The cure amount is the whole parking balance of the license, rounded half up to the cent."
      held_days_for_scope: "When the license has been held at least scope_tenure_days days and the lease is enrolled in autopay, the charges posted on the license within scope_window_months month before the handling date are left out of the cure amount"
      lease_autopay: "When the license has been held at least scope_tenure_days days and the lease is enrolled in autopay, the charges posted on the license within scope_window_months month before the handling date are left out of the cure amount"
      recent_fee_lines: "when the license has been held at least scope_tenure_days days and the lease is not enrolled in autopay, only the monthly fee lines posted within scope_window_months month before the handling date are left out"
      recent_charges: "When the license has been held at least scope_tenure_days days and the lease is enrolled in autopay, the charges posted on the license within scope_window_months month before the handling date are left out of the cure amount"
      left_out: "When the license has been held at least scope_tenure_days days and the lease is enrolled in autopay, the charges posted on the license within scope_window_months month before the handling date are left out of the cure amount; when the license has been held at least scope_tenure_days days and the lease is not enrolled in autopay, only the monthly fee lines posted within scope_window_months month before the handling date are left out; in every other case nothing is left out."
      reinstatement_fees_lookback: "When two or more reinstatement fees were billed on the license in the prepay_lookback_months months before the handling date, the security prepayment months are prepay_months_many"
      base_prepay_months: "When two or more reinstatement fees were billed on the license in the prepay_lookback_months months before the handling date, the security prepayment months are prepay_months_many; when exactly one reinstatement fee was billed in those months, the security prepayment months are prepay_months_one; in every other case there is no security prepayment."
      lease_tenure_days: "When the lease's move-in date is at least standing_tenure_long_days days before the handling date, the security prepayment months are reduced by prepay_reduction_long"
      prepay_reduction: "When the lease's move-in date is at least standing_tenure_long_days days before the handling date, the security prepayment months are reduced by prepay_reduction_long; when it is at least standing_tenure_mid_days but fewer than standing_tenure_long_days days before the handling date, they are reduced by prepay_reduction_mid; in every other case they are not reduced."
      prepay_months: "The security prepayment months never fall below zero."
      recent_bundle_credits: "When a storage bundle discount credit was posted on the license within net_fee_window_months month before the handling date and the lease holds an active storage rental, the prepayment fee is the most recent monthly fee line less the most recent storage bundle discount credit"
      storage_active: "When a storage bundle discount credit was posted on the license within net_fee_window_months month before the handling date and the lease holds an active storage rental, the prepayment fee is the most recent monthly fee line less the most recent storage bundle discount credit"
      latest_fee_line: "the prepayment fee is the most recent monthly fee line less the most recent storage bundle discount credit"
      latest_bundle_credit: "the prepayment fee is the most recent monthly fee line less the most recent storage bundle discount credit"
      held_days_for_fee: "when that is not the case and the license has been held fewer than new_license_days days, the prepayment fee is the product's monthly_license_fee"
      prepay_fee: "When a storage bundle discount credit was posted on the license within net_fee_window_months month before the handling date and the lease holds an active storage rental, the prepayment fee is the most recent monthly fee line less the most recent storage bundle discount credit; when that is not the case and the license has been held fewer than new_license_days days, the prepayment fee is the product's monthly_license_fee; in every other case the prepayment fee is the monthly fee in force on the license."
      result: "The cure amount is the whole parking balance less the charges left out, plus the security prepayment months times the prepayment fee, rounded half up to the cent once at the end."
    factors:
      - id: cure_scope
        effect: method
        decides: left_out
        bindings: [held_days_for_scope, lease_autopay, recent_fee_lines, recent_charges, left_out]
        ladder:
          - when: "the license has been held at least scope_tenure_days days and the lease is enrolled in autopay"
            method: "the charges posted on the license within scope_window_months month before the handling date are left out of the cure amount"
          - when: "the license has been held at least scope_tenure_days days and the lease is not enrolled in autopay"
            method: "only the monthly fee lines posted within scope_window_months month before the handling date are left out"
          - when: "otherwise"
            method: "nothing is left out; the cure amount starts from the whole parking balance"
        baseline:
          left_out: "0"
        evidence: [history, date, cross_category]
        cross_difficulty: lease
      - id: cure_prepay_months
        effect: parameter
        decides: base_prepay_months
        bindings: [reinstatement_fees_lookback, base_prepay_months]
        ladder:
          - when: "two or more reinstatement fees were billed on the license in the prepay_lookback_months months before the handling date"
            value: "K('prepay_months_many')"
          - when: "exactly one reinstatement fee was billed on the license in those months"
            value: "K('prepay_months_one')"
          - when: "otherwise"
            value: "0"
        baseline:
          base_prepay_months: "0"
        evidence: [history]
        cross_difficulty: null
      - id: cure_prepay_reduction
        effect: parameter
        decides: prepay_reduction
        bindings: [lease_tenure_days, prepay_reduction]
        ladder:
          - when: "the lease's move-in date is at least standing_tenure_long_days days before the handling date"
            value: "K('prepay_reduction_long')"
          - when: "the lease's move-in date is at least standing_tenure_mid_days but fewer than standing_tenure_long_days days before the handling date"
            value: "K('prepay_reduction_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          prepay_reduction: "0"
        evidence: [cross_category, date]
        cross_difficulty: lease
      - id: cure_prepay_fee
        effect: method
        decides: prepay_fee
        bindings: [recent_bundle_credits, storage_active, latest_fee_line, latest_bundle_credit, held_days_for_fee, prepay_fee]
        ladder:
          - when: "a storage bundle discount credit was posted on the license within net_fee_window_months month before the handling date and the lease holds an active storage rental"
            method: "the prepayment fee is the most recent monthly fee line less the most recent storage bundle discount credit"
          - when: "that is not the case and the license has been held fewer than new_license_days days"
            method: "the prepayment fee is the product's monthly_license_fee"
          - when: "otherwise"
            method: "the prepayment fee is the monthly fee in force on the license"
        baseline:
          prepay_fee: "F('monthly_fee')"
        evidence: [history, cross_category, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The cure amount is what a resident pays toward a suspended license so that its privileges can be restored. A
        payment is applied to the oldest open parking charge first, and the credits and payments already posted on the
        license always count in full. The cure amount is the whole parking balance of the license, rounded half up to the
        cent.
      params: [monthly_license_fee]
    inputs:
      history:
        - {table: parking_charges, aggregate: sum, field: amount, within_months: 1, filters: {event_type: parking_fee_charge}}
        - {table: parking_charges, aggregate: count, field: parking_charge_id, within_months: 24, filters: {charge_code: reinstatement_fee}}
        - {table: parking_charges, aggregate: latest, field: amount, filters: {charge_code: bundle_discount}}
      cross_category: [lease, storage]

  - id: parking_ext_privilege_restoration
    base_policy_refs: [parking_suspension_rule, parking_evt_fees]
    overwrite:
      - base_policy: parking_suspension_rule
        superseded_clause: >-
          Privileges are restored only after the whole parking balance and the reinstatement_fee are paid.
        replaced_by: >-
          Privileges are not restored until a payment covering the cure amount stands received on the license.
      - base_policy: parking_evt_fees
        superseded_clause: >-
          A lost or additional remote is billed at gate_remote_fee, a replacement tag at tag_replacement_fee, a move to
          another space at space_swap_fee, and restoring suspended privileges at reinstatement_fee.
        replaced_by: >-
          A lost or additional remote is billed at gate_remote_fee, a replacement tag at tag_replacement_fee and a move to
          another space at space_swap_fee, and restoring suspended privileges is billed at the reinstatement fee this
          restoration rule sets.
    trigger: on_request
    subject: [parking_reinstatement]
    computes: reinstatement_fee
    target_tool: restore_parking_privileges_f55d0d0b
    params:
      prior_lookback_months: 36
      reinstatement_fee_second: 50.00
      reinstatement_fee_third: 75.00
      remote_reactivation_each: 7.50
      remote_reactivation_single: 10.00
      violation_lookback_months: 12
      violation_many_count: 3
      violation_surcharge_many: 15.00
      violation_surcharge_some: 10.00
      standing_reduction_full: 10.00
      standing_reduction_partial: 5.00
      storage_tenure_days: 365
      storage_relief_long: 10.00
      storage_relief_short: 5.00
      cure_multiple_high: 2
      cure_multiple_mid: 1
      cure_share_high: 0.05
      cure_share_mid: 0.03
    rule: >
      Restoring suspended privileges sets the license back to active and bills the reinstatement fee with the
      restoration; the reinstatement fee falls due with the next monthly fee and is not part of the cure amount. A lost
      or additional remote is billed at gate_remote_fee, a replacement tag at tag_replacement_fee and a move to another
      space at space_swap_fee, and restoring suspended privileges is billed at the reinstatement fee this restoration
      rule sets. Privileges are not restored until a payment covering the cure amount stands received on the license.
      The reinstatement fee is the product's reinstatement_fee, rounded half up to the cent.
      When two or more reinstatement fees were billed on the license in the prior_lookback_months months before the
      handling date, the graduated fee is reinstatement_fee_third; when exactly one reinstatement fee was billed in those
      months, the graduated fee is reinstatement_fee_second; in every other case the graduated fee is the product's
      reinstatement_fee.
      The remotes on the license are the product's remotes_issued plus the lost or additional remotes billed on the
      license. When there are two or more remotes on the license, the gate reactivation charge accrues per remote, remote_reactivation_each for each remote on the license; when there is exactly one, the gate reactivation charge is a single flat remote_reactivation_single; in every other case there is no gate reactivation charge.
      When violation_many_count or more violations of any level were recorded on the license in the
      violation_lookback_months months before the handling date, the enforcement surcharge is violation_surcharge_many;
      when at least one but fewer than violation_many_count violations were recorded in those months, the enforcement
      surcharge is violation_surcharge_some; in every other case there is no enforcement surcharge.
      When the lease is not restricted to certified funds and proof of renter's insurance is on file, the reinstatement standing
      reduction is standing_reduction_full; when the lease is not restricted to certified funds and no proof of renter's
      insurance is on file, the reinstatement standing reduction is standing_reduction_partial; in every other case there is no
      reinstatement standing reduction.
      When the lease holds an active storage rental that started at least storage_tenure_days days before the handling
      date, the bundle household relief is storage_relief_long; when the lease holds an active storage rental that
      started fewer than storage_tenure_days days before the handling date, the bundle household relief is
      storage_relief_short; in every other case there is no bundle household relief.
      When the most recent payment received on the license is at least cure_multiple_high times the monthly fee in force,
      the fee carries a handling share of cure_share_high times that payment; when it is at least cure_multiple_mid times
      but less than cure_multiple_high times the monthly fee in force, the handling share is cure_share_mid times that
      payment; in every other case there is no handling share.
      The reinstatement fee is the graduated fee plus the gate reactivation charge plus the enforcement surcharge plus
      the handling share, less the reinstatement standing reduction and the bundle household relief, never below zero, and rounded
      half up to the cent once at the end.
    prerequisite:
      - problem: parking_ext_suspension_cure_payment
        kind: value_input
        gate: latest_payment
        form: state
        policy_source: >-
          Privileges are not restored until a payment covering the cure amount stands received on the license.
        condition: >-
          A payment covering the cure amount stands received on the license, and it is the most recent payment on the license.
        resolved_by: pay_parking_balance_59b25ecc
        effect: >-
          The cure payment becomes the most recent payment on the license, which is the payment the handling share of
          the reinstatement fee is measured on.
    cross_category:
      - category: lease
        as: branch
        reads: [certified_funds_only, insurance_on_file]
        note: The reinstatement standing reduction factor takes its tier from the lease's certified-funds restriction and proof of insurance.
      - category: storage
        as: branch
        reads: [status, start_date]
        note: The bundle household relief factor reads whether the lease holds an active storage rental and when it started.
    compute:
      - prior_reinstatement_fees: "COUNT('parking_charges', within_months=K('prior_lookback_months'), date_field='charge_date', charge_code='reinstatement_fee')"
      - graduated_fee: "K('reinstatement_fee_third') if prior_reinstatement_fees >= 2 else (K('reinstatement_fee_second') if prior_reinstatement_fees == 1 else P('reinstatement_fee'))"
      - extra_remotes_billed: "COUNT('parking_charges', charge_code='gate_remote_fee')"
      - remotes_on_license: "P('remotes_issued') + extra_remotes_billed"
      - gate_reactivation: "K('remote_reactivation_each') * remotes_on_license if remotes_on_license >= 2 else (K('remote_reactivation_single') if remotes_on_license == 1 else 0)"
      - violations_recent: "COUNT('parking_activity', within_months=K('violation_lookback_months'), date_field='activity_date', event_type='parking_violation')"
      - enforcement_surcharge: "K('violation_surcharge_many') if violations_recent >= K('violation_many_count') else (K('violation_surcharge_some') if violations_recent >= 1 else 0)"
      - lease_certified_only: "CFIELD('lease', 'certified_funds_only', lease_id=F('lease_id'))"
      - lease_insurance: "CFIELD('lease', 'insurance_on_file', lease_id=F('lease_id'))"
      - standing_reduction: "K('standing_reduction_full') if lease_certified_only == False and lease_insurance == True else (K('standing_reduction_partial') if lease_certified_only == False and lease_insurance != True else 0)"
      - storage_active: "EXISTS('storage', lease_id=F('lease_id'), status='active')"
      - storage_days: "DAYS(CFIELD('storage', 'start_date', lease_id=F('lease_id'), status='active') or NOW, NOW)"
      - household_relief: "K('storage_relief_long') if storage_active and storage_days >= K('storage_tenure_days') else (K('storage_relief_short') if storage_active and storage_days < K('storage_tenure_days') else 0)"
      - latest_payment: "LATEST('parking_charges', 'amount', date_field='charge_date', charge_code='payment_received') or 0"
      - handling_share: "latest_payment * K('cure_share_high') if latest_payment >= K('cure_multiple_high') * F('monthly_fee') else (latest_payment * K('cure_share_mid') if latest_payment >= K('cure_multiple_mid') * F('monthly_fee') else 0)"
      - result: "RND(MX(0, graduated_fee + gate_reactivation + enforcement_surcharge + handling_share - standing_reduction - household_relief), 2)"
    compute_basis:
      prior_reinstatement_fees: "When two or more reinstatement fees were billed on the license in the prior_lookback_months months before the handling date, the graduated fee is reinstatement_fee_third"
      graduated_fee: "When two or more reinstatement fees were billed on the license in the prior_lookback_months months before the handling date, the graduated fee is reinstatement_fee_third; when exactly one reinstatement fee was billed in those months, the graduated fee is reinstatement_fee_second; in every other case the graduated fee is the product's reinstatement_fee."
      extra_remotes_billed: "The remotes on the license are the product's remotes_issued plus the lost or additional remotes billed on the license."
      remotes_on_license: "The remotes on the license are the product's remotes_issued plus the lost or additional remotes billed on the license."
      gate_reactivation: "When there are two or more remotes on the license, the gate reactivation charge accrues per remote, remote_reactivation_each for each remote on the license; when there is exactly one, the gate reactivation charge is a single flat remote_reactivation_single; in every other case there is no gate reactivation charge."
      violations_recent: "When violation_many_count or more violations of any level were recorded on the license in the violation_lookback_months months before the handling date, the enforcement surcharge is violation_surcharge_many"
      enforcement_surcharge: "When violation_many_count or more violations of any level were recorded on the license in the violation_lookback_months months before the handling date, the enforcement surcharge is violation_surcharge_many; when at least one but fewer than violation_many_count violations were recorded in those months, the enforcement surcharge is violation_surcharge_some; in every other case there is no enforcement surcharge."
      lease_certified_only: "When the lease is not restricted to certified funds and proof of renter's insurance is on file, the reinstatement standing reduction is standing_reduction_full"
      lease_insurance: "When the lease is not restricted to certified funds and proof of renter's insurance is on file, the reinstatement standing reduction is standing_reduction_full"
      standing_reduction: "When the lease is not restricted to certified funds and proof of renter's insurance is on file, the reinstatement standing reduction is standing_reduction_full; when the lease is not restricted to certified funds and no proof of renter's insurance is on file, the reinstatement standing reduction is standing_reduction_partial; in every other case there is no reinstatement standing reduction."
      storage_active: "When the lease holds an active storage rental that started at least storage_tenure_days days before the handling date, the bundle household relief is storage_relief_long"
      storage_days: "When the lease holds an active storage rental that started at least storage_tenure_days days before the handling date, the bundle household relief is storage_relief_long"
      household_relief: "When the lease holds an active storage rental that started at least storage_tenure_days days before the handling date, the bundle household relief is storage_relief_long; when the lease holds an active storage rental that started fewer than storage_tenure_days days before the handling date, the bundle household relief is storage_relief_short; in every other case there is no bundle household relief."
      latest_payment: "When the most recent payment received on the license is at least cure_multiple_high times the monthly fee in force, the fee carries a handling share of cure_share_high times that payment"
      handling_share: "When the most recent payment received on the license is at least cure_multiple_high times the monthly fee in force, the fee carries a handling share of cure_share_high times that payment; when it is at least cure_multiple_mid times but less than cure_multiple_high times the monthly fee in force, the handling share is cure_share_mid times that payment; in every other case there is no handling share."
      result: "The reinstatement fee is the graduated fee plus the gate reactivation charge plus the enforcement surcharge plus the handling share, less the reinstatement standing reduction and the bundle household relief, never below zero, and rounded half up to the cent once at the end."
    factors:
      - id: restoration_graduated_fee
        effect: parameter
        decides: graduated_fee
        bindings: [prior_reinstatement_fees, graduated_fee]
        ladder:
          - when: "two or more reinstatement fees were billed on the license in the prior_lookback_months months before the handling date"
            value: "K('reinstatement_fee_third')"
          - when: "exactly one reinstatement fee was billed on the license in those months"
            value: "K('reinstatement_fee_second')"
          - when: "otherwise"
            value: "P('reinstatement_fee')"
        baseline:
          graduated_fee: "P('reinstatement_fee')"
        evidence: [history]
        cross_difficulty: null
      - id: restoration_gate_reactivation
        effect: method
        decides: gate_reactivation
        bindings: [extra_remotes_billed, remotes_on_license, gate_reactivation]
        ladder:
          - when: "the product's remotes_issued plus the lost or additional remotes billed on the license come to two or more"
            method: "the charge accrues per remote: remote_reactivation_each times the remotes on the license"
          - when: "they come to exactly one"
            method: "the charge is a single flat remote_reactivation_single"
          - when: "otherwise"
            method: "there is no gate reactivation charge"
        baseline:
          gate_reactivation: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: restoration_enforcement_surcharge
        effect: parameter
        decides: enforcement_surcharge
        bindings: [violations_recent, enforcement_surcharge]
        ladder:
          - when: "violation_many_count or more violations of any level were recorded on the license in the violation_lookback_months months before the handling date"
            value: "K('violation_surcharge_many')"
          - when: "at least one but fewer than violation_many_count violations were recorded in those months"
            value: "K('violation_surcharge_some')"
          - when: "otherwise"
            value: "0"
        baseline:
          enforcement_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: restoration_standing_reduction
        effect: parameter
        decides: standing_reduction
        bindings: [lease_certified_only, lease_insurance, standing_reduction]
        ladder:
          - when: "the lease is not restricted to certified funds and proof of renter's insurance is on file"
            value: "K('standing_reduction_full')"
          - when: "the lease is not restricted to certified funds and no proof of renter's insurance is on file"
            value: "K('standing_reduction_partial')"
          - when: "otherwise"
            value: "0"
        baseline:
          standing_reduction: "0"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: restoration_household_relief
        effect: parameter
        decides: household_relief
        bindings: [storage_active, storage_days, household_relief]
        ladder:
          - when: "the lease holds an active storage rental that started at least storage_tenure_days days before the handling date"
            value: "K('storage_relief_long')"
          - when: "the lease holds an active storage rental that started fewer than storage_tenure_days days before the handling date"
            value: "K('storage_relief_short')"
          - when: "otherwise"
            value: "0"
        baseline:
          household_relief: "0"
        evidence: [cross_category, date]
        cross_difficulty: null
      - id: restoration_handling_share
        effect: parameter
        decides: handling_share
        bindings: [latest_payment, handling_share]
        ladder:
          - when: "the most recent payment received on the license is at least cure_multiple_high times the monthly fee in force"
            value: "latest_payment * K('cure_share_high')"
          - when: "the most recent payment is at least cure_multiple_mid times but less than cure_multiple_high times the monthly fee in force"
            value: "latest_payment * K('cure_share_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          handling_share: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        Restoring suspended privileges sets the license back to active and bills the reinstatement fee with the
        restoration; the reinstatement fee falls due with the next monthly fee and is not part of the cure amount. The
        reinstatement fee is the product's reinstatement_fee, rounded half up to the cent.
      params: [reinstatement_fee]
    inputs:
      history:
        - {table: parking_charges, aggregate: count, field: parking_charge_id, within_months: 36, filters: {charge_code: reinstatement_fee}}
        - {table: parking_charges, aggregate: count, field: parking_charge_id, filters: {charge_code: gate_remote_fee}}
        - {table: parking_activity, aggregate: count, field: activity_id, within_months: 12, filters: {event_type: parking_violation}}
        - {table: parking_charges, aggregate: latest, field: amount, filters: {charge_code: payment_received}}
      cross_category: [lease, storage]
