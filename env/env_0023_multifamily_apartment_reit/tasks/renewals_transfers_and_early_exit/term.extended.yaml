events:
  - type: term_create
    target: lease_terms
    mutation: create
    meaning: A Lease Term Agreement is written — the first term of a new lease, a signed renewal, the new term of a signed transfer, or an automatic month-to-month conversion.
    grain: One row per term agreement.
    fields:
      customer_id: Leaseholder.
      lease_id: Lease the term belongs to.
      variant_name: Term program, official term tier name.
      term_origin: new_lease, renewal, transfer or month_to_month_conversion.
      term_start_date: First day of the term.
      term_end_date: Last day of the term.
      term_months: Term length in months.
      contracted_rent: Monthly base rent agreed for the term.
      signed_date: Date signed (or conversion recorded).
    triggers: []
  - type: term_start
    target: lease_terms
    mutation: {transition: {from: pending, to: current}}
    meaning: The term takes effect on its start date.
    grain: One row per transaction.
    fields:
      term_start_date: Start date reached (read, not rewritten).
      term_origin: Origin of the starting term (read, not rewritten).
      contracted_rent: Rent of the starting term (read, not rewritten).
    triggers:
      - event: term:term_rent_change
        when: {term_origin: [renewal, month_to_month_conversion, transfer]}
        map: {new_rent: contracted_rent, effective_date: term_start_date}
      - event: term:term_supersession
        when: {term_origin: [renewal, month_to_month_conversion]}
  - type: term_cancellation
    target: lease_terms
    mutation: {transition: {from: pending, to: cancelled}}
    meaning: A term that has not started is cancelled — a renewal rescinded within its window or a new-lease term whose application was withdrawn.
    grain: One row per transaction.
    fields:
      closed_date: Date of cancellation.
    triggers: []
  - type: term_supersession
    target: lease_terms
    mutation: {transition: {from: current, to: superseded}}
    meaning: The current term is replaced by a renewal or month-to-month conversion term that has started.
    grain: One row per transaction.
    fields:
      closed_date: Last day of the superseded term.
    triggers: []
  - type: term_notice_to_vacate
    target: lease_terms
    mutation: {transition: {from: current, to: notice_given}}
    meaning: The resident's written notice to vacate is recorded against the term.
    grain: One row per transaction.
    fields:
      notice_to_vacate_date: Date the written notice was received.
      intended_move_out_date: Move-out date stated in the notice.
    triggers: []
  - type: term_notice_withdrawal
    target: lease_terms
    mutation: {transition: {from: notice_given, to: current}}
    meaning: The resident's withdrawal of a notice to vacate is accepted and the term continues.
    grain: One row per transaction.
    fields:
      notice_to_vacate_date: Cleared.
      intended_move_out_date: Cleared.
    triggers: []
  - type: term_move_out_date_update
    target: lease_terms
    mutation: update
    meaning: A resident on notice changes the intended move-out date.
    grain: One row per transaction.
    fields:
      intended_move_out_date: New intended move-out date.
    triggers: []
  - type: term_early_termination
    target: lease_terms
    mutation: {transition: [{from: current, to: terminated_early}, {from: notice_given, to: terminated_early}]}
    meaning: The resident signs an Early Termination Option agreement, a lease break or a statutory release, ending the term before term_end_date.
    grain: One row per transaction.
    fields:
      intended_move_out_date: Termination date agreed.
      closed_date: Date the agreement was signed.
    triggers: []
  - type: term_transfer
    target: lease_terms
    mutation: {transition: {from: current, to: transferred}}
    meaning: The resident signs a transfer to another apartment home in the same community.
    grain: One row per transaction.
    fields:
      intended_move_out_date: Transfer move date.
      closed_date: Date the transfer was signed.
    triggers:
      - event: term:term_create
        map: {term_origin: transfer}
      - event: lease:lease_unit_transfer
  - type: term_completion
    target: lease_terms
    mutation: {transition: [{from: notice_given, to: completed}, {from: current, to: completed}]}
    meaning: The term ends because possession of the apartment home ended.
    grain: One row per transaction.
    fields:
      closed_date: Move-out date.
    triggers: []
  - type: term_renewal_offer
    target: term_offers
    meaning: A renewal offer line for one term length is delivered to the resident on an expiring term.
    grain: One row per offered term program per offer date.
    distinguish_by: [offered_variant, offer_date]
    fields:
      offered_variant: Term program offered.
      offered_term_months: Term length offered.
      offered_rent: Monthly rent offered before any early renewal discount.
      offer_date: Delivery date.
      offer_expiration_date: Last acceptance date.
    triggers: []
  - type: term_rent_change
    target: term_rent_changes
    meaning: A new monthly base rent is recorded with its effective date and the date its notice was delivered.
    grain: One row per rent change per effective date.
    distinguish_by: [effective_date, change_reason]
    fields:
      lease_id: Lease whose rent changes.
      previous_rent: Rent before.
      new_rent: Rent after.
      effective_date: First date of the new rent.
      notice_date: Date the notice of the new rent was delivered.
      change_reason: renewal, month_to_month_conversion, transfer or month_to_month_adjustment.
    triggers:
      - event: lease:lease_rent_update
        map: {monthly_rent: new_rent}
  - type: term_fee_assessment
    target: term_charges
    meaning: A term charge is assessed — early termination fee, reletting fee, concession recapture, lease-break rent, insufficient notice charge, transfer fee or holdover rent.
    grain: One row per charge code per request or per billing period.
    distinguish_by: [fee_code, request_id, billing_period]
    fields:
      fee_code: Charge code.
      amount: Amount assessed.
      assessed_date: Posting date.
      billing_period: Month covered (posting month for one-time charges).
      days_charged: Days billed for a day-based charge.
      request_id: Request the charge arises from, when any.
    account: term_receivable
    direction: in
    triggers: []
  - type: term_fee_credit
    target: term_charges
    meaning: A term charge is reduced — a reletting credit for days a replacement resident pays for, or the reversal of a charge posted in error or voided by a rescinded agreement.
    grain: One row per credited charge.
    distinguish_by: [fee_code, source_term_charge_id]
    fields:
      fee_code: reletting_credit or charge_reversal.
      amount: Credit amount (positive).
      assessed_date: Posting date.
      billing_period: Month credited.
      days_charged: Days credited for a reletting credit.
      source_term_charge_id: The charge credited.
    account: term_receivable
    direction: out
    triggers: []
  - type: term_payment
    target: term_charges
    meaning: A payment toward term charges is received, including the application of the security deposit at final accounting.
    grain: One row per payment transaction.
    distinguish_by: [payment_reference]
    fields:
      fee_code: payment_received.
      amount: Amount received.
      assessed_date: Date received.
      payment_method: Instrument used.
      payment_reference: Confirmation or instrument number.
    account: term_receivable
    direction: out
    triggers: []

measures:
  - id: term_msr_tenure_months
    window: From the move_in_date of the lease to the evaluation date.
    measure: Full calendar months of continuous tenancy on the lease, counted across the whole chain of its terms (new_lease, renewal, transfer and month_to_month_conversion terms alike), same day number to same day number with month-end fallback.
  - id: term_msr_transfers_12m
    window: Trailing 365 calendar days ending on and including the evaluation date.
    measure: Count of term_change_requests rows of request_type unit_transfer and request_status signed on any term of the lease whose created_at date falls in the window.
  - id: term_msr_unearned_concession
    window: From the day after the termination date through term_end_date of the terminating term.
    measure: Total rent_concession credits posted on the lease ledger for the lease's new-lease term, times the full months from the termination date to term_end_date, divided by term_months, rounded half up to the cent.

policies:
  - id: term_agg_multi_holding
    subject: [term_create]
    rule: >-
      A lease carries a chain of Lease Term Agreements, and at any moment a leaseholder holds at most one term that is
      current or notice_given and at most one pending term that will follow it.
      A new term may be written only when the lease has no other term in pending status.
      Terms that are superseded, completed, terminated_early, transferred or cancelled stay on file as history and do
      not count. Because a resident holds only one open lease, the per-customer cap below equals that pair.
    eligibility:
      - id: one_pending_term
        applies_to: [term_create]
        kind: dedup
        condition: "A new term may be written only when the lease has no other term in pending status."
        evidence_fields: [lease_terms.lease_id, lease_terms.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_terms.lease_id]
          action_bindings:
            lease_terms.lease_id: lease_id
        dedup_contract:
          table: lease_terms
          mode: separate_record
          object_bindings: {lease_id: lease_id}
          duplicate_filters: {status: [pending]}
          distinct_fields: []
    params:
      max_per_customer: 2

  - id: term_agg_tenancy_chain
    subject: [term_renewal_offer, term_create, term_transfer]
    rule: >-
      Tenure, transfer counts and concession recapture are measured across the whole chain of terms on a lease, never
      on a single term. Continuous tenancy (term_msr_tenure_months) runs from the lease's move-in date through every
      renewal, transfer and month-to-month conversion term; it resets only when a new lease is signed after the previous
      lease closed. The loyalty reduction of the renewal increase cap applies when term_msr_tenure_months on the offer
      date is at least the expiring term program's loyalty_min_tenure_months. Transfers are counted with
      term_msr_transfers_12m over all terms of the lease. The unearned concession recaptured on an early exit is computed
      from the concession of the lease's new-lease term (term_msr_unearned_concession), even when the exit happens under
      a later term; a concession is never recaptured once the new-lease term has run to its term_end_date.
    eligibility: []
    params:
      per_tier:
        Month-to-Month Agreement: {loyalty_min_tenure_months: "=loyalty_min_tenure_months", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct", transfers_per_12_months: "=transfers_per_12_months"}
        Short-Term Lease (3-5 Months): {loyalty_min_tenure_months: "=loyalty_min_tenure_months", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct", transfers_per_12_months: "=transfers_per_12_months"}
        Flexible Lease (6-9 Months): {loyalty_min_tenure_months: "=loyalty_min_tenure_months", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct", transfers_per_12_months: "=transfers_per_12_months"}
        Standard Lease (10-12 Months): {loyalty_min_tenure_months: "=loyalty_min_tenure_months", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct", transfers_per_12_months: "=transfers_per_12_months"}
        Extended Lease (13-15 Months): {loyalty_min_tenure_months: "=loyalty_min_tenure_months", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct", transfers_per_12_months: "=transfers_per_12_months"}
        Long-Term Lease (16-24 Months): {loyalty_min_tenure_months: "=loyalty_min_tenure_months", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct", transfers_per_12_months: "=transfers_per_12_months"}
    measures: [term_msr_tenure_months, term_msr_transfers_12m, term_msr_unearned_concession]

  - id: term_evt_term_pricing
    subject: [term_create, term_start]
    rule: >-
      A term is written for a whole number of months between the term program's min_term_months and max_term_months
      (a month-to-month agreement runs one month at a time), and its term_end_date follows term_end_rule: the day before
      the same day number term_months months after term_start_date, falling back to the last day of the month when that
      day number does not exist. A new-lease term starts on the move-in date, which must fall within
      new_lease_start_window_days calendar days after the lease approval, and its contracted_rent is the quoted 12-month
      monthly rent of the apartment home adjusted by the term program's rent_adjustment_pct, rounded half up to the cent;
      when rent_adjustment_pct is positive the premium is at least rent_adjustment_min_amount. A renewal term starts on
      the day after the expiring term's term_end_date (renewal_term_start_rule) and is written only from a renewal offer
      line of the expiring term.
      A renewal may be signed only when the frozen date is no later than the offer date plus the offer's validity days.
      Offer validity days are counted as calendar days starting the day after the offer date, and the offer can be accepted through the last counted day.
      Its contracted_rent is the offered_rent of the accepted line, less the early_renewal_discount_monthly of the
      accepted term program when the resident signs at least that program's early_renewal_window_days before the
      expiring term_end_date. A renewal is not signed while the lease has a past-due balance when the expiring program's
      renewal_requires_current_balance is true. A term moves from pending to current on its start date, and for a
      new-lease term only once move-in is recorded.
    eligibility:
      - id: offer_still_open
        applies_to: [term_create]
        kind: time
        condition: "A renewal may be signed only when the frozen date is no later than the offer date plus the offer's validity days."
        evidence_fields: [term_offers.offer_id, term_offers.offer_date, term_offers.offer_expiration_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [term_offers.offer_id]
          action_bindings:
            term_offers.offer_id: offer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the offer date
          anchor_source: term_offers.offer_date
          relation: not_after
          duration_source: variants.renewal_offer_valid_days
          unit: calendar_days
          counting_rule: "Offer validity days are counted as calendar days starting the day after the offer date, and the offer can be accepted through the last counted day."
          boundary: inclusive
    params:
      per_tier:
        Month-to-Month Agreement: {min_term_months: "=min_term_months", max_term_months: "=max_term_months", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount", early_renewal_window_days: "=early_renewal_window_days", early_renewal_discount_monthly: "=early_renewal_discount_monthly", renewal_requires_current_balance: "=renewal_requires_current_balance", new_lease_start_window_days: "=new_lease_start_window_days", term_end_rule: "=term_end_rule"}
        Short-Term Lease (3-5 Months): {min_term_months: "=min_term_months", max_term_months: "=max_term_months", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount", early_renewal_window_days: "=early_renewal_window_days", early_renewal_discount_monthly: "=early_renewal_discount_monthly", renewal_requires_current_balance: "=renewal_requires_current_balance", new_lease_start_window_days: "=new_lease_start_window_days", term_end_rule: "=term_end_rule"}
        Flexible Lease (6-9 Months): {min_term_months: "=min_term_months", max_term_months: "=max_term_months", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount", early_renewal_window_days: "=early_renewal_window_days", early_renewal_discount_monthly: "=early_renewal_discount_monthly", renewal_requires_current_balance: "=renewal_requires_current_balance", new_lease_start_window_days: "=new_lease_start_window_days", term_end_rule: "=term_end_rule"}
        Standard Lease (10-12 Months): {min_term_months: "=min_term_months", max_term_months: "=max_term_months", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount", early_renewal_window_days: "=early_renewal_window_days", early_renewal_discount_monthly: "=early_renewal_discount_monthly", renewal_requires_current_balance: "=renewal_requires_current_balance", new_lease_start_window_days: "=new_lease_start_window_days", term_end_rule: "=term_end_rule"}
        Extended Lease (13-15 Months): {min_term_months: "=min_term_months", max_term_months: "=max_term_months", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount", early_renewal_window_days: "=early_renewal_window_days", early_renewal_discount_monthly: "=early_renewal_discount_monthly", renewal_requires_current_balance: "=renewal_requires_current_balance", new_lease_start_window_days: "=new_lease_start_window_days", term_end_rule: "=term_end_rule"}
        Long-Term Lease (16-24 Months): {min_term_months: "=min_term_months", max_term_months: "=max_term_months", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount", early_renewal_window_days: "=early_renewal_window_days", early_renewal_discount_monthly: "=early_renewal_discount_monthly", renewal_requires_current_balance: "=renewal_requires_current_balance", new_lease_start_window_days: "=new_lease_start_window_days", term_end_rule: "=term_end_rule"}
    formula:
      early_renewal_rent: offered_rent - early_renewal_discount_monthly

  - id: term_evt_renewal_offers
    subject: [term_renewal_offer]
    rule: >-
      Renewal offers are delivered only on a term that is current.
      They are delivered renewal_offer_lead_days calendar days before term_end_date, one line for each term program in
      the expiring program's renewal_offer_options, each open for renewal_offer_valid_days; a program whose
      renewal_offer_lead_days is 0 receives no offers. No offer is delivered while a notice to vacate is on file, while the
      lease is in_default or eviction_filed, or, when renewal_requires_current_balance is true, while the lease has a
      past-due balance; such a term converts to month-to-month at its end unless the resident gives notice. The
      12-month-equivalent renewal rent may exceed the in-place contracted_rent by no more than the effective cap: the
      expiring program's renewal_increase_cap_pct, less loyalty_increase_cap_reduction_pct when the loyalty tenure is met,
      and never more than statutory_increase_cap_by_state for the community's state where one exists. Each offer line's
      offered_rent is that 12-month-equivalent rent adjusted by the offered program's rent_adjustment_pct (with its
      rent_adjustment_min_amount floor), rounded half up to the cent. Revenue management may offer less than the cap; an
      offer above the cap is an offer posted in error and is corrected before acceptance.
    eligibility:
      - id: offer_on_current_term
        applies_to: [term_renewal_offer]
        kind: state
        condition: "Renewal offers are delivered only on a term that is current."
        evidence_fields: [lease_terms.term_id, lease_terms.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_terms.term_id]
          action_bindings:
            lease_terms.term_id: term_id
        state_contract:
          field: lease_terms.status
          allowed: [current]
    params:
      statutory_increase_cap_by_state: {CA: 0.088, WA: 0.0968}
      per_tier:
        Month-to-Month Agreement: {renewal_offer_lead_days: "=renewal_offer_lead_days", renewal_offer_valid_days: "=renewal_offer_valid_days", renewal_offer_options: "=renewal_offer_options", renewal_increase_cap_pct: "=renewal_increase_cap_pct", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct"}
        Short-Term Lease (3-5 Months): {renewal_offer_lead_days: "=renewal_offer_lead_days", renewal_offer_valid_days: "=renewal_offer_valid_days", renewal_offer_options: "=renewal_offer_options", renewal_increase_cap_pct: "=renewal_increase_cap_pct", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct"}
        Flexible Lease (6-9 Months): {renewal_offer_lead_days: "=renewal_offer_lead_days", renewal_offer_valid_days: "=renewal_offer_valid_days", renewal_offer_options: "=renewal_offer_options", renewal_increase_cap_pct: "=renewal_increase_cap_pct", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct"}
        Standard Lease (10-12 Months): {renewal_offer_lead_days: "=renewal_offer_lead_days", renewal_offer_valid_days: "=renewal_offer_valid_days", renewal_offer_options: "=renewal_offer_options", renewal_increase_cap_pct: "=renewal_increase_cap_pct", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct"}
        Extended Lease (13-15 Months): {renewal_offer_lead_days: "=renewal_offer_lead_days", renewal_offer_valid_days: "=renewal_offer_valid_days", renewal_offer_options: "=renewal_offer_options", renewal_increase_cap_pct: "=renewal_increase_cap_pct", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct"}
        Long-Term Lease (16-24 Months): {renewal_offer_lead_days: "=renewal_offer_lead_days", renewal_offer_valid_days: "=renewal_offer_valid_days", renewal_offer_options: "=renewal_offer_options", renewal_increase_cap_pct: "=renewal_increase_cap_pct", loyalty_increase_cap_reduction_pct: "=loyalty_increase_cap_reduction_pct"}
    formula:
      max_renewal_rent: round(contracted_rent * (1 + renewal_increase_cap_pct), 2)
      max_renewal_rent_loyal: round(contracted_rent * (1 + renewal_increase_cap_pct - loyalty_increase_cap_reduction_pct), 2)
    measures: [term_msr_tenure_months]

  - id: term_evt_rent_change_notice
    subject: [term_rent_change]
    rule: >-
      A rent change is recorded when a renewal, transfer or month-to-month conversion term starts, and when the rent of a
      month-to-month agreement is adjusted; the rent of a fixed term never changes mid-term (mid_term_rent_change_allowed).
      A signed renewal or transfer is the resident's agreement to its rent and needs no advance notice. For a
      month-to-month conversion or adjustment that raises the rent, the required notice is the longer of the
      min_increase_notice_days of the Month-to-Month Agreement and rent_increase_notice_days_by_state for the community's
      state, where the CA figure for an increase above ten percent over the prior twelve months is the over_threshold one.
      For a month-to-month conversion or adjustment, a new rent may take effect only when the frozen date is later than the date the rent change notice was delivered plus the required notice days.
      Notice days are counted as calendar days starting the day after delivery, and the new rent may take effect on the day after the last notice day at the earliest.
      When the notice given was shorter, the previous rent continues and the rent change takes effect on the first day
      the notice allows. No increase may make the rent exceed the previous rent by more than the
      statutory_increase_cap_by_state of the renewal offer rule over any twelve months in a state that has one.
    eligibility:
      - id: increase_notice_matured
        applies_to: [term_rent_change]
        kind: time
        condition: "For a month-to-month conversion or adjustment, a new rent may take effect only when the frozen date is later than the date the rent change notice was delivered plus the required notice days."
        evidence_fields: [term_rent_changes.rent_change_id, term_rent_changes.notice_date, term_rent_changes.change_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [term_rent_changes.rent_change_id]
          action_bindings:
            term_rent_changes.rent_change_id: rent_change_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the rent change notice was delivered
          anchor_source: term_rent_changes.notice_date
          relation: not_before
          duration_source: variants.min_increase_notice_days
          unit: calendar_days
          counting_rule: "Notice days are counted as calendar days starting the day after delivery, and the new rent may take effect on the day after the last notice day at the earliest."
          boundary: exclusive
    params:
      rent_increase_notice_days_by_state:
        CA: {standard: 30, over_threshold: 90}
        WA: {standard: 90, over_threshold: 90}
        CO: {standard: 60, over_threshold: 60}
        TX: {standard: 0, over_threshold: 0}
        GA: {standard: 0, over_threshold: 0}
        AZ: {standard: 0, over_threshold: 0}
      per_tier:
        Month-to-Month Agreement: {min_increase_notice_days: "=min_increase_notice_days", mid_term_rent_change_allowed: "=mid_term_rent_change_allowed"}
        Short-Term Lease (3-5 Months): {min_increase_notice_days: "=min_increase_notice_days", mid_term_rent_change_allowed: "=mid_term_rent_change_allowed"}
        Flexible Lease (6-9 Months): {min_increase_notice_days: "=min_increase_notice_days", mid_term_rent_change_allowed: "=mid_term_rent_change_allowed"}
        Standard Lease (10-12 Months): {min_increase_notice_days: "=min_increase_notice_days", mid_term_rent_change_allowed: "=mid_term_rent_change_allowed"}
        Extended Lease (13-15 Months): {min_increase_notice_days: "=min_increase_notice_days", mid_term_rent_change_allowed: "=mid_term_rent_change_allowed"}
        Long-Term Lease (16-24 Months): {min_increase_notice_days: "=min_increase_notice_days", mid_term_rent_change_allowed: "=mid_term_rent_change_allowed"}

  - id: term_notice_to_vacate_rule
    subject: [term_notice_to_vacate, term_notice_withdrawal, term_move_out_date_update, term_completion]
    rule: >-
      A notice to vacate is recorded only from the resident's own written notice through a channel in notice_delivery_methods; a verbal statement of plans is not notice.
      On a fixed term the intended move-out date must be on or after term_end_date — an earlier date is an early
      termination or lease break, never a notice. On a month-to-month agreement any date may be given. When the intended
      move-out date is earlier than the notice date plus notice_to_vacate_days, the notice is still recorded and an
      insufficient_notice_charge is assessed for the days short (insufficient_notice_charge_basis daily_contracted_rent:
      contracted_rent times 12 divided by 365, rounded half up to the cent per day, times the days short); the resident may
      instead move the date out to avoid it. A resident on notice may move the intended date later only up to the day
      before any new lease on the same apartment home starts, and earlier only if the new date still satisfies the rules
      above.
      A notice may be withdrawn only when the frozen date is no later than the date the notice to vacate was received plus notice_withdrawal_window_days.
      Withdrawal days are counted as calendar days starting the day after the notice was received, and the last counted day is included.
      Withdrawal also requires notice_withdrawal_allowed and that no other lease has been applied for or approved on the
      same apartment home; withdrawing removes any insufficient_notice_charge by a charge_reversal. The term completes when
      possession ends; a resident who stays beyond the intended move-out date owes holdover rent under the term charge rule.
    eligibility:
      - id: written_notice
        applies_to: [term_notice_to_vacate]
        kind: caller_fact
        condition: "A notice to vacate is recorded only from the resident's own written notice through a channel in notice_delivery_methods; a verbal statement of plans is not notice."
        evidence_fields: [lease_terms.term_id, lease_terms.term_end_date]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [lease_terms.term_id]
          action_bindings:
            lease_terms.term_id: term_id
      - id: withdrawal_window
        applies_to: [term_notice_withdrawal]
        kind: time
        condition: "A notice may be withdrawn only when the frozen date is no later than the date the notice to vacate was received plus notice_withdrawal_window_days."
        evidence_fields: [lease_terms.term_id, lease_terms.notice_to_vacate_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_terms.term_id]
          action_bindings:
            lease_terms.term_id: term_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the notice to vacate was received
          anchor_source: lease_terms.notice_to_vacate_date
          relation: not_after
          duration_source: variants.notice_withdrawal_window_days
          unit: calendar_days
          counting_rule: "Withdrawal days are counted as calendar days starting the day after the notice was received, and the last counted day is included."
          boundary: inclusive
    params:
      per_tier:
        Month-to-Month Agreement: {notice_to_vacate_days: "=notice_to_vacate_days", notice_withdrawal_allowed: "=notice_withdrawal_allowed", notice_withdrawal_window_days: "=notice_withdrawal_window_days", notice_delivery_methods: "=notice_delivery_methods", insufficient_notice_charge_basis: "=insufficient_notice_charge_basis"}
        Short-Term Lease (3-5 Months): {notice_to_vacate_days: "=notice_to_vacate_days", notice_withdrawal_allowed: "=notice_withdrawal_allowed", notice_withdrawal_window_days: "=notice_withdrawal_window_days", notice_delivery_methods: "=notice_delivery_methods", insufficient_notice_charge_basis: "=insufficient_notice_charge_basis"}
        Flexible Lease (6-9 Months): {notice_to_vacate_days: "=notice_to_vacate_days", notice_withdrawal_allowed: "=notice_withdrawal_allowed", notice_withdrawal_window_days: "=notice_withdrawal_window_days", notice_delivery_methods: "=notice_delivery_methods", insufficient_notice_charge_basis: "=insufficient_notice_charge_basis"}
        Standard Lease (10-12 Months): {notice_to_vacate_days: "=notice_to_vacate_days", notice_withdrawal_allowed: "=notice_withdrawal_allowed", notice_withdrawal_window_days: "=notice_withdrawal_window_days", notice_delivery_methods: "=notice_delivery_methods", insufficient_notice_charge_basis: "=insufficient_notice_charge_basis"}
        Extended Lease (13-15 Months): {notice_to_vacate_days: "=notice_to_vacate_days", notice_withdrawal_allowed: "=notice_withdrawal_allowed", notice_withdrawal_window_days: "=notice_withdrawal_window_days", notice_delivery_methods: "=notice_delivery_methods", insufficient_notice_charge_basis: "=insufficient_notice_charge_basis"}
        Long-Term Lease (16-24 Months): {notice_to_vacate_days: "=notice_to_vacate_days", notice_withdrawal_allowed: "=notice_withdrawal_allowed", notice_withdrawal_window_days: "=notice_withdrawal_window_days", notice_delivery_methods: "=notice_delivery_methods", insufficient_notice_charge_basis: "=insufficient_notice_charge_basis"}
    formula:
      daily_rent: round(contracted_rent * 12 / 365, 2)

  - id: term_early_termination_rule
    subject: [term_early_termination, term_fee_assessment]
    rule: >-
      A resident who must leave before term_end_date has exactly three routes, decided in this order: a statutory
      release under the statutory release rule, the Early Termination Option, or a lease break. Each is requested through
      an early termination request, quoted, and takes effect only when the resident signs it; signing is the resident's own act.
      The Early Termination Option may be exercised only when the frozen date is on or after the term start date plus etf_min_months_into_term.
      Months into the term are counted in calendar months from term_start_date to the same day number of a later month, falling back to the last day of that month when that day number does not exist.
      It further requires etf_option_available, a termination date at least etf_min_notice_days calendar days after the
      request's created_at date, and, when etf_requires_current_balance is true, no past-due balance on the lease. Its
      early_termination_fee is etf_rent_multiple times contracted_rent, rounded half up to the cent; the multiple is
      replaced by job_relocation_etf_multiple when job_relocation_clause is true and the resident documents a new workplace
      at least job_relocation_min_distance_miles away, or by home_purchase_etf_multiple when home_purchase_clause is true
      and the resident documents a home purchase closing, and when both are documented the lower multiple applies. The fee
      is due within etf_payment_due_days of signing, and rent continues to post under the lease charter through the
      termination date. When the option is not available, the exit is a lease break: a reletting_fee of reletting_fee_pct
      times contracted_rent is assessed, and when lease_break_rent_liability is true lease_break_rent accrues under the
      term charge rule from the day after move-out until the day before a replacement resident's lease starts on the
      apartment home or term_end_date, whichever comes first. On either route, when concession_recapture is true a
      concession_recapture of term_msr_unearned_concession is assessed; the job relocation and home purchase clauses do
      not waive it. A quote is valid for etf_quote_valid_days; an expired quote must be requoted.
      Only one early termination fee, reletting fee and concession recapture is assessed per early termination request.
      A month-to-month agreement is ended by notice alone and has no early termination.
    eligibility:
      - id: etf_months_into_term
        applies_to: [term_early_termination]
        kind: time
        condition: "The Early Termination Option may be exercised only when the frozen date is on or after the term start date plus etf_min_months_into_term."
        evidence_fields: [lease_terms.term_id, lease_terms.term_start_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_terms.term_id]
          action_bindings:
            lease_terms.term_id: term_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the term start date
          anchor_source: lease_terms.term_start_date
          relation: not_before
          duration_source: variants.etf_min_months_into_term
          unit: calendar_months
          counting_rule: "Months into the term are counted in calendar months from term_start_date to the same day number of a later month, falling back to the last day of that month when that day number does not exist."
          boundary: inclusive
      - id: signed_agreement
        applies_to: [term_early_termination]
        kind: authorization
        condition: "Each is requested through an early termination request, quoted, and takes effect only when the resident signs it; signing is the resident's own act."
        evidence_fields: [term_change_requests.request_id, term_change_requests.request_status, term_change_requests.request_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [term_change_requests.request_id]
          action_bindings:
            term_change_requests.request_id: request_id
      - id: one_fee_set_per_request
        applies_to: [term_fee_assessment]
        kind: dedup
        condition: "Only one early termination fee, reletting fee and concession recapture is assessed per early termination request."
        evidence_fields: [term_charges.request_id, term_charges.fee_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [term_charges.request_id]
          action_bindings:
            term_charges.request_id: request_id
        dedup_contract:
          table: term_charges
          mode: separate_record
          object_bindings: {request_id: request_id}
          duplicate_filters: {fee_code: [early_termination_fee, reletting_fee, concession_recapture]}
          distinct_fields: [fee_code]
    params:
      per_tier:
        Month-to-Month Agreement: {etf_option_available: "=etf_option_available", etf_rent_multiple: "=etf_rent_multiple", etf_min_notice_days: "=etf_min_notice_days", etf_min_months_into_term: "=etf_min_months_into_term", etf_requires_current_balance: "=etf_requires_current_balance", etf_payment_due_days: "=etf_payment_due_days", etf_quote_valid_days: "=etf_quote_valid_days", job_relocation_clause: "=job_relocation_clause", job_relocation_min_distance_miles: "=job_relocation_min_distance_miles", job_relocation_etf_multiple: "=job_relocation_etf_multiple", home_purchase_clause: "=home_purchase_clause", home_purchase_etf_multiple: "=home_purchase_etf_multiple", reletting_fee_pct: "=reletting_fee_pct", lease_break_rent_liability: "=lease_break_rent_liability", concession_recapture: "=concession_recapture"}
        Short-Term Lease (3-5 Months): {etf_option_available: "=etf_option_available", etf_rent_multiple: "=etf_rent_multiple", etf_min_notice_days: "=etf_min_notice_days", etf_min_months_into_term: "=etf_min_months_into_term", etf_requires_current_balance: "=etf_requires_current_balance", etf_payment_due_days: "=etf_payment_due_days", etf_quote_valid_days: "=etf_quote_valid_days", job_relocation_clause: "=job_relocation_clause", job_relocation_min_distance_miles: "=job_relocation_min_distance_miles", job_relocation_etf_multiple: "=job_relocation_etf_multiple", home_purchase_clause: "=home_purchase_clause", home_purchase_etf_multiple: "=home_purchase_etf_multiple", reletting_fee_pct: "=reletting_fee_pct", lease_break_rent_liability: "=lease_break_rent_liability", concession_recapture: "=concession_recapture"}
        Flexible Lease (6-9 Months): {etf_option_available: "=etf_option_available", etf_rent_multiple: "=etf_rent_multiple", etf_min_notice_days: "=etf_min_notice_days", etf_min_months_into_term: "=etf_min_months_into_term", etf_requires_current_balance: "=etf_requires_current_balance", etf_payment_due_days: "=etf_payment_due_days", etf_quote_valid_days: "=etf_quote_valid_days", job_relocation_clause: "=job_relocation_clause", job_relocation_min_distance_miles: "=job_relocation_min_distance_miles", job_relocation_etf_multiple: "=job_relocation_etf_multiple", home_purchase_clause: "=home_purchase_clause", home_purchase_etf_multiple: "=home_purchase_etf_multiple", reletting_fee_pct: "=reletting_fee_pct", lease_break_rent_liability: "=lease_break_rent_liability", concession_recapture: "=concession_recapture"}
        Standard Lease (10-12 Months): {etf_option_available: "=etf_option_available", etf_rent_multiple: "=etf_rent_multiple", etf_min_notice_days: "=etf_min_notice_days", etf_min_months_into_term: "=etf_min_months_into_term", etf_requires_current_balance: "=etf_requires_current_balance", etf_payment_due_days: "=etf_payment_due_days", etf_quote_valid_days: "=etf_quote_valid_days", job_relocation_clause: "=job_relocation_clause", job_relocation_min_distance_miles: "=job_relocation_min_distance_miles", job_relocation_etf_multiple: "=job_relocation_etf_multiple", home_purchase_clause: "=home_purchase_clause", home_purchase_etf_multiple: "=home_purchase_etf_multiple", reletting_fee_pct: "=reletting_fee_pct", lease_break_rent_liability: "=lease_break_rent_liability", concession_recapture: "=concession_recapture"}
        Extended Lease (13-15 Months): {etf_option_available: "=etf_option_available", etf_rent_multiple: "=etf_rent_multiple", etf_min_notice_days: "=etf_min_notice_days", etf_min_months_into_term: "=etf_min_months_into_term", etf_requires_current_balance: "=etf_requires_current_balance", etf_payment_due_days: "=etf_payment_due_days", etf_quote_valid_days: "=etf_quote_valid_days", job_relocation_clause: "=job_relocation_clause", job_relocation_min_distance_miles: "=job_relocation_min_distance_miles", job_relocation_etf_multiple: "=job_relocation_etf_multiple", home_purchase_clause: "=home_purchase_clause", home_purchase_etf_multiple: "=home_purchase_etf_multiple", reletting_fee_pct: "=reletting_fee_pct", lease_break_rent_liability: "=lease_break_rent_liability", concession_recapture: "=concession_recapture"}
        Long-Term Lease (16-24 Months): {etf_option_available: "=etf_option_available", etf_rent_multiple: "=etf_rent_multiple", etf_min_notice_days: "=etf_min_notice_days", etf_min_months_into_term: "=etf_min_months_into_term", etf_requires_current_balance: "=etf_requires_current_balance", etf_payment_due_days: "=etf_payment_due_days", etf_quote_valid_days: "=etf_quote_valid_days", job_relocation_clause: "=job_relocation_clause", job_relocation_min_distance_miles: "=job_relocation_min_distance_miles", job_relocation_etf_multiple: "=job_relocation_etf_multiple", home_purchase_clause: "=home_purchase_clause", home_purchase_etf_multiple: "=home_purchase_etf_multiple", reletting_fee_pct: "=reletting_fee_pct", lease_break_rent_liability: "=lease_break_rent_liability", concession_recapture: "=concession_recapture"}
    formula:
      early_termination_fee: round(etf_rent_multiple * contracted_rent, 2)
      reletting_fee: round(reletting_fee_pct * contracted_rent, 2)
    measures: [term_msr_unearned_concession]

  - id: term_statutory_release
    subject: [term_early_termination, term_fee_assessment]
    rule: >-
      A statutory release ends a fixed term early without any early termination fee, reletting fee, concession
      recapture or lease-break rent. It is available for military_orders (the resident or spouse enters military
      service or receives permanent change of station or deployment orders of ninety days or more), for
      domestic_violence (the resident or a household member is a victim and provides the qualifying court order or
      report of the community's state), and for death_of_sole_leaseholder (requested by the estate).
      A statutory release is granted only when the community manager has recorded the qualifying document against the request; the resident's statement alone never grants it.
      For military_orders the release takes effect military_release_days_after_next_due calendar days after the first rent
      due date following delivery of the written notice with the orders. For domestic_violence it takes effect
      domestic_violence_release_days_by_state calendar days after delivery of the notice. For death_of_sole_leaseholder it
      takes effect death_release_days calendar days after the estate's written notice. Rent keeps posting under the lease
      charter through the release date, and the security deposit is accounted for under its own charter as on any
      move-out. A release that is not documented is handled as an Early Termination Option or a lease break.
    eligibility:
      - id: release_documented
        applies_to: [term_early_termination, term_fee_assessment]
        kind: authorization
        condition: "A statutory release is granted only when the community manager has recorded the qualifying document against the request; the resident's statement alone never grants it."
        evidence_fields: [term_change_requests.request_id, term_change_requests.request_type, term_change_requests.statutory_release_basis]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [term_change_requests.request_id]
          action_bindings:
            term_change_requests.request_id: request_id
    params:
      military_release_days_after_next_due: 30
      domestic_violence_release_days_by_state: {CA: 14, WA: 30, CO: 30, TX: 30, GA: 30, AZ: 30}
      death_release_days: 30

  - id: term_transfer_rule
    subject: [term_transfer, term_create, term_fee_assessment]
    rule: >-
      A resident may move to another available apartment home in the same community by a transfer, which the resident signs.
      A transfer may be signed only when the frozen date is on or after the term start date plus transfer_min_months_into_term.
      Months into the term are counted in calendar months from term_start_date to the same day number of a later month, falling back to the last day of that month when that day number does not exist.
      It further requires transfer_allowed, a transfer move date at least transfer_notice_days calendar days after the
      request's created_at date, term_msr_transfers_12m below transfers_per_12_months, no past-due balance on the lease
      when transfer_requires_current_balance is true, and a destination floor plan that admits the household under the
      lease charter. The current term ends as transferred on signing and a new transfer term starts on the move date at the
      destination's quoted 12-month rent adjusted for the chosen term program, for at least transfer_new_term_min_months.
      The transfer_fee is assessed on signing, except that it is waived when transfer_fee_waived_for_upsize is true and
      the destination floor plan ranks above the current one. A transfer never triggers concession recapture, a reletting
      fee or an early termination fee, the security deposit carries over unchanged, and the move-out charges of the
      apartment home left behind are itemized under the security deposit charter at the final move-out. Rent for the
      overlapping days is not charged twice: the old apartment home's rent stops the day before the move date.
    eligibility:
      - id: transfer_months_into_term
        applies_to: [term_transfer]
        kind: time
        condition: "A transfer may be signed only when the frozen date is on or after the term start date plus transfer_min_months_into_term."
        evidence_fields: [lease_terms.term_id, lease_terms.term_start_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_terms.term_id]
          action_bindings:
            lease_terms.term_id: term_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the term start date
          anchor_source: lease_terms.term_start_date
          relation: not_before
          duration_source: variants.transfer_min_months_into_term
          unit: calendar_months
          counting_rule: "Months into the term are counted in calendar months from term_start_date to the same day number of a later month, falling back to the last day of that month when that day number does not exist."
          boundary: inclusive
    params:
      per_tier:
        Month-to-Month Agreement: {transfer_allowed: "=transfer_allowed", transfer_min_months_into_term: "=transfer_min_months_into_term", transfer_fee: "=transfer_fee", transfer_fee_waived_for_upsize: "=transfer_fee_waived_for_upsize", transfer_new_term_min_months: "=transfer_new_term_min_months", transfer_notice_days: "=transfer_notice_days", transfers_per_12_months: "=transfers_per_12_months", transfer_requires_current_balance: "=transfer_requires_current_balance"}
        Short-Term Lease (3-5 Months): {transfer_allowed: "=transfer_allowed", transfer_min_months_into_term: "=transfer_min_months_into_term", transfer_fee: "=transfer_fee", transfer_fee_waived_for_upsize: "=transfer_fee_waived_for_upsize", transfer_new_term_min_months: "=transfer_new_term_min_months", transfer_notice_days: "=transfer_notice_days", transfers_per_12_months: "=transfers_per_12_months", transfer_requires_current_balance: "=transfer_requires_current_balance"}
        Flexible Lease (6-9 Months): {transfer_allowed: "=transfer_allowed", transfer_min_months_into_term: "=transfer_min_months_into_term", transfer_fee: "=transfer_fee", transfer_fee_waived_for_upsize: "=transfer_fee_waived_for_upsize", transfer_new_term_min_months: "=transfer_new_term_min_months", transfer_notice_days: "=transfer_notice_days", transfers_per_12_months: "=transfers_per_12_months", transfer_requires_current_balance: "=transfer_requires_current_balance"}
        Standard Lease (10-12 Months): {transfer_allowed: "=transfer_allowed", transfer_min_months_into_term: "=transfer_min_months_into_term", transfer_fee: "=transfer_fee", transfer_fee_waived_for_upsize: "=transfer_fee_waived_for_upsize", transfer_new_term_min_months: "=transfer_new_term_min_months", transfer_notice_days: "=transfer_notice_days", transfers_per_12_months: "=transfers_per_12_months", transfer_requires_current_balance: "=transfer_requires_current_balance"}
        Extended Lease (13-15 Months): {transfer_allowed: "=transfer_allowed", transfer_min_months_into_term: "=transfer_min_months_into_term", transfer_fee: "=transfer_fee", transfer_fee_waived_for_upsize: "=transfer_fee_waived_for_upsize", transfer_new_term_min_months: "=transfer_new_term_min_months", transfer_notice_days: "=transfer_notice_days", transfers_per_12_months: "=transfers_per_12_months", transfer_requires_current_balance: "=transfer_requires_current_balance"}
        Long-Term Lease (16-24 Months): {transfer_allowed: "=transfer_allowed", transfer_min_months_into_term: "=transfer_min_months_into_term", transfer_fee: "=transfer_fee", transfer_fee_waived_for_upsize: "=transfer_fee_waived_for_upsize", transfer_new_term_min_months: "=transfer_new_term_min_months", transfer_notice_days: "=transfer_notice_days", transfers_per_12_months: "=transfers_per_12_months", transfer_requires_current_balance: "=transfer_requires_current_balance"}
    measures: [term_msr_transfers_12m]

  - id: term_mtm_conversion
    subject: [term_create, term_supersession]
    rule: >-
      When a fixed term reaches its term_end_date with no signed renewal and no notice to vacate on file, and the
      expiring program's mtm_conversion_automatic is true, a Month-to-Month Agreement term is written starting the day
      after term_end_date, and the expiring term is superseded when it starts. Its contracted_rent is the in-place
      contracted_rent adjusted by the Month-to-Month Agreement's rent_adjustment_pct with its rent_adjustment_min_amount
      floor, rounded half up to the cent, but the increase takes effect only as the rent change notice rule allows;
      until then the in-place rent continues. A month-to-month agreement renews itself each month on the same terms until
      a notice to vacate is given, a fixed-term renewal is signed from an offer, or the rent is adjusted with notice. A
      resident on notice whose term ends before the intended move-out date does not convert; the days after term_end_date
      are billed as holdover rent.
    eligibility: []
    params:
      per_tier:
        Month-to-Month Agreement: {mtm_conversion_automatic: "=mtm_conversion_automatic", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount"}
        Short-Term Lease (3-5 Months): {mtm_conversion_automatic: "=mtm_conversion_automatic", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount"}
        Flexible Lease (6-9 Months): {mtm_conversion_automatic: "=mtm_conversion_automatic", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount"}
        Standard Lease (10-12 Months): {mtm_conversion_automatic: "=mtm_conversion_automatic", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount"}
        Extended Lease (13-15 Months): {mtm_conversion_automatic: "=mtm_conversion_automatic", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount"}
        Long-Term Lease (16-24 Months): {mtm_conversion_automatic: "=mtm_conversion_automatic", rent_adjustment_pct: "=rent_adjustment_pct", rent_adjustment_min_amount: "=rent_adjustment_min_amount"}

  - id: term_evt_charges_credits_payments
    subject: [term_fee_assessment, term_fee_credit, term_payment]
    rule: >-
      Term charges post only while the term is current, notice_given, terminated_early, transferred or completed.
      Every term charge is billed on the Lease Term Agreement account, separately from the lease ledger, and is payable
      by any accepted instrument or by the security deposit at final accounting. Lease-break rent posts one line per
      calendar month on the first day of the month (or on the day after move-out for the first month), prorated by
      days_charged over the actual days of the month at the contracted_rent. When reletting_credit_applies is true and a
      replacement resident's lease starts before the end of a month already billed, a reletting_credit for the days from
      that start through month end is posted against that month's lease_break_rent line. Holdover rent is owed for each
      day of possession after the intended move-out date or termination date at holdover_rent_pct times the daily
      contracted rent (contracted_rent times 12 divided by 365, rounded half up to the cent per day), posted as one line per
      calendar month with the days of that month in days_charged. A charge_reversal credits a charge
      posted against this charter or voided by a rescinded or withdrawn agreement, once per charge. A payment is applied
      to the oldest open term charge first.
    eligibility:
      - id: term_charge_status
        applies_to: [term_fee_assessment]
        kind: state
        condition: "Term charges post only while the term is current, notice_given, terminated_early, transferred or completed."
        evidence_fields: [lease_terms.term_id, lease_terms.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_terms.term_id]
          action_bindings:
            lease_terms.term_id: term_id
        state_contract:
          field: lease_terms.status
          allowed: [current, notice_given, terminated_early, transferred, completed]
    params:
      per_tier:
        Month-to-Month Agreement: {holdover_rent_pct: "=holdover_rent_pct", reletting_credit_applies: "=reletting_credit_applies", lease_break_rent_liability: "=lease_break_rent_liability"}
        Short-Term Lease (3-5 Months): {holdover_rent_pct: "=holdover_rent_pct", reletting_credit_applies: "=reletting_credit_applies", lease_break_rent_liability: "=lease_break_rent_liability"}
        Flexible Lease (6-9 Months): {holdover_rent_pct: "=holdover_rent_pct", reletting_credit_applies: "=reletting_credit_applies", lease_break_rent_liability: "=lease_break_rent_liability"}
        Standard Lease (10-12 Months): {holdover_rent_pct: "=holdover_rent_pct", reletting_credit_applies: "=reletting_credit_applies", lease_break_rent_liability: "=lease_break_rent_liability"}
        Extended Lease (13-15 Months): {holdover_rent_pct: "=holdover_rent_pct", reletting_credit_applies: "=reletting_credit_applies", lease_break_rent_liability: "=lease_break_rent_liability"}
        Long-Term Lease (16-24 Months): {holdover_rent_pct: "=holdover_rent_pct", reletting_credit_applies: "=reletting_credit_applies", lease_break_rent_liability: "=lease_break_rent_liability"}
    formula:
      holdover_daily: round(holdover_rent_pct * round(contracted_rent * 12 / 365, 2), 2)

  - id: term_renewal_rescission
    subject: [term_cancellation]
    rule: >-
      A signed renewal may be rescinded by the resident without charge before it starts.
      A renewal may be rescinded only when the frozen date is no later than the renewal's signed date plus renewal_rescission_days.
      Rescission days are counted as calendar days starting the day after the renewal was signed, and the last counted day is included.
      A rescinded renewal leaves the expiring term as it was: without a notice to vacate it converts to month-to-month at
      its end, and new renewal offers are not issued again for it. A term program with renewal_rescission_days of 0 has
      no rescission. A pending new-lease term is cancelled only together with the withdrawal of its lease application.
    eligibility:
      - id: rescission_window
        applies_to: [term_cancellation]
        kind: time
        condition: "A renewal may be rescinded only when the frozen date is no later than the renewal's signed date plus renewal_rescission_days."
        evidence_fields: [lease_terms.term_id, lease_terms.signed_date, lease_terms.term_origin]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_terms.term_id]
          action_bindings:
            lease_terms.term_id: term_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the renewal's signed date
          anchor_source: lease_terms.signed_date
          relation: not_after
          duration_source: variants.renewal_rescission_days
          unit: calendar_days
          counting_rule: "Rescission days are counted as calendar days starting the day after the renewal was signed, and the last counted day is included."
          boundary: inclusive
    params:
      per_tier:
        Month-to-Month Agreement: {renewal_rescission_days: "=renewal_rescission_days"}
        Short-Term Lease (3-5 Months): {renewal_rescission_days: "=renewal_rescission_days"}
        Flexible Lease (6-9 Months): {renewal_rescission_days: "=renewal_rescission_days"}
        Standard Lease (10-12 Months): {renewal_rescission_days: "=renewal_rescission_days"}
        Extended Lease (13-15 Months): {renewal_rescission_days: "=renewal_rescission_days"}
        Long-Term Lease (16-24 Months): {renewal_rescission_days: "=renewal_rescission_days"}

# ============================================================================
# extended_policies (renewals_transfers_and_early_exit)
# ============================================================================
extended_policies:
  - id: term_ext_offer_line_correction
    base_policy_refs: [term_agg_tenancy_chain, term_evt_renewal_offers]
    overwrite:
      - base_policy: term_evt_renewal_offers
        superseded_clause: >-
          The 12-month-equivalent renewal rent may exceed the in-place contracted_rent by no more than the effective
          cap: the expiring program's renewal_increase_cap_pct, less loyalty_increase_cap_reduction_pct when the
          loyalty tenure is met, and never more than statutory_increase_cap_by_state for the community's state where
          one exists.
        replaced_by: >-
          Four cap reductions are subtracted together from the expiring term program's renewal increase cap, and the
          difference, never below zero, is the company cap.
      - base_policy: term_agg_tenancy_chain
        superseded_clause: >-
          The loyalty reduction of the renewal increase cap applies when term_msr_tenure_months on the offer date is
          at least the expiring term program's loyalty_min_tenure_months.
        replaced_by: >-
          The loyalty cap reduction is set by the full calendar months of continuous tenancy counted across the whole
          chain of terms from the lease's move-in date to the delivery date of the line in error: 48 months or more
          reduce the cap by 2.5 percentage points; 24 to 47 months reduce it by the expiring term program's loyalty
          reduction of the renewal increase cap; fewer than 24 months reduce it by nothing.
    trigger: state_due
    subject: [term_renewal_offer]
    computes: offered_rent
    target_tool: reissue_renewal_offer_line_9239b766
    params:
      senior_loyalty_months: 48
      senior_loyalty_reduction: 0.025
      autopay_standing_reduction: 0.005
      manual_standing_reduction: 0.0025
      off_season_reduction: 0.005
      shoulder_reduction: 0.0025
      steep_increase: 0.06
      steep_relief: 0.0075
      moderate_increase: 0.03
      moderate_relief: 0.0025
      days_per_year: 365
      flat_period_days: 730
      ca_statutory_cap: 0.088
      wa_statutory_cap: 0.0968
      half_up_guard: 0.000001
    rule: >-
      This rule applies to a current term on the Flexible, Standard, Extended or Long-Term Lease program, the
      programs whose loyalty reduction of the renewal increase cap and early renewal discount are above zero; a line
      on a Short-Term Lease term is priced as the renewal offer rule states.
      When the renewal offer line delivered on such a term for that term's own term program carries a monthly rent
      above the corrected offer rent, the line was posted in error and is re-issued as a new line for the same term
      program and term length at the corrected offer rent, dated the handling date and open for the program's renewal
      offer validity days counted from that date like any offer line; the line posted in error stays on file as
      history, and lines for other term programs are not re-priced by this rule.
      The corrected offer rent of a like-program line is the capped 12-month-equivalent rent, the in-place contracted
      rent of the expiring term raised by the effective cap, adjusted by the term program's rent adjustment: a program
      with a premium adds the larger of its rent adjustment percentage of the capped 12-month-equivalent rent and its
      minimum monthly premium, a program with a discount subtracts its rent adjustment percentage of that rent, and a
      program with no adjustment adds nothing; the result is rounded half up to the cent.
      The effective cap is the expiring term program's renewal increase cap, limited to the statutory increase cap
      of the community's state where one exists (8.8 percent in California and 9.68 percent in Washington).
      Four cap reductions are subtracted together from the expiring term program's renewal increase cap, and the
      difference, never below zero, is the company cap.
      The loyalty cap reduction is set by the full calendar months of continuous tenancy counted across the whole
      chain of terms from the lease's move-in date to the delivery date of the line in error: 48 months or more
      reduce the cap by 2.5 percentage points; 24 to 47 months reduce it by the expiring term program's loyalty
      reduction of the renewal increase cap; fewer than 24 months reduce it by nothing.
      The standing cap reduction is set by the lease's payment record: a lease with no returned payment dated fewer
      than 12 full calendar months before the handling date and with ACH autopay enrolled reduces the cap by 0.5
      percentage points; a lease with no such returned payment and without autopay enrolled reduces it by 0.25
      percentage points; a lease with such a returned payment receives no standing reduction.
      The expiry-season cap reduction is set by the calendar month in which the expiring term ends: a term ending in
      November, December, January or February reduces the cap by 0.5 percentage points; a term ending in March,
      April, September or October reduces it by 0.25 percentage points; a term ending in May, June, July or August
      receives no season reduction.
      The increase-relief cap reduction is set by the last rent change recorded on the expiring term, measured as its
      new rent less its previous rent, divided by its previous rent: an increase of 6 percent or more reduces the cap
      by 0.75 percentage points; an increase of 3 percent or more but under 6 percent reduces it by 0.25 percentage
      points; an increase under 3 percent, or a term with no rent change recorded, receives no relief reduction.
      The company cap is then fitted to the rent period, the days the in-place rent will have been in force at the
      end of the expiring term, counted from the effective date of the last rent change recorded on the term (or
      from the term start date when none is recorded) through the term end date, both days included: when the rent
      period is shorter than 365 days the company cap is prorated by the rent period's days over 365; when the rent
      period is 730 days or longer the company cap is compounded over two years, one plus the company cap, squared,
      less one; otherwise the company cap applies as it stands.
      The lower of the rent-period cap and the statutory increase cap of the community's state is the effective cap;
      no intermediate figure is rounded, and only the corrected offer rent is rounded, half up to the cent.
    prerequisite: []
    cross_category:
      - category: lease
        as: history
        reads: [move_in_date, autopay_enrolled, community_state, lease_payments.event_type, lease_payments.payment_date]
        note: The loyalty cap reduction reads the lease's move-in date, the standing cap reduction reads the lease's returned payments and autopay enrollment, and the statutory limit reads the community's state.
    compute:
      - offer_line_date: "LATEST('term_offers','offer_date', date_field='offer_date', offered_variant=F('variant_name'))"
      - tenure_at_offer: "MONTHS(CFIELD('lease','move_in_date'), offer_line_date)"
      - loyalty_cap_reduction: "K('senior_loyalty_reduction') if tenure_at_offer >= K('senior_loyalty_months') else (P('loyalty_increase_cap_reduction_pct') if tenure_at_offer >= P('loyalty_min_tenure_months') else 0.0)"
      - returned_payments_12m: "XCOUNT('lease','lease_payments', within_months=12, date_field='payment_date', event_type='lease_payment_return')"
      - autopay_on_file: "CFIELD('lease','autopay_enrolled')"
      - standing_cap_reduction: "K('autopay_standing_reduction') if (returned_payments_12m == 0 and autopay_on_file == True) else (K('manual_standing_reduction') if (returned_payments_12m == 0 and autopay_on_file == False) else 0.0)"
      - expiry_month: "MONTHS('2000-01-01', F('term_end_date')) % 12 + 1"
      - season_cap_reduction: "K('off_season_reduction') if (expiry_month >= 11 or expiry_month <= 2) else (K('shoulder_reduction') if (expiry_month == 3 or expiry_month == 4 or expiry_month == 9 or expiry_month == 10) else 0.0)"
      - rent_changes_on_term: "COUNT('term_rent_changes')"
      - last_change_increase: "((LATEST('term_rent_changes','new_rent', date_field='effective_date') - LATEST('term_rent_changes','previous_rent', date_field='effective_date')) / LATEST('term_rent_changes','previous_rent', date_field='effective_date')) if rent_changes_on_term > 0 else 0.0"
      - relief_cap_reduction: "K('steep_relief') if last_change_increase >= K('steep_increase') else (K('moderate_relief') if last_change_increase >= K('moderate_increase') else 0.0)"
      - company_cap: "MX(0.0, P('renewal_increase_cap_pct') - (loyalty_cap_reduction + standing_cap_reduction + season_cap_reduction + relief_cap_reduction))"
      - last_change_date: "LATEST('term_rent_changes','effective_date', date_field='effective_date') if rent_changes_on_term > 0 else F('term_start_date')"
      - rent_days_in_force: "DAYS(last_change_date, F('term_end_date')) + 1"
      - period_cap: "(company_cap * rent_days_in_force / K('days_per_year')) if rent_days_in_force < K('days_per_year') else (((1 + company_cap) * (1 + company_cap) - 1) if rent_days_in_force >= K('flat_period_days') else company_cap)"
      - community_state: "CFIELD('lease','community_state')"
      - statutory_cap: "K('ca_statutory_cap') if community_state == 'CA' else (K('wa_statutory_cap') if community_state == 'WA' else period_cap)"
      - effective_cap: "MN(period_cap, statutory_cap)"
      - capped_equivalent_rent: "F('contracted_rent') * (1 + effective_cap)"
      - program_rent_adjustment: "MX(capped_equivalent_rent * P('rent_adjustment_pct'), P('rent_adjustment_min_amount')) if P('rent_adjustment_pct') > 0 else capped_equivalent_rent * P('rent_adjustment_pct')"
      - result: "RND(capped_equivalent_rent + program_rent_adjustment + K('half_up_guard'), 2)"
    compute_basis:
      offer_line_date: "The loyalty cap reduction is set by the full calendar months of continuous tenancy counted across the whole chain of terms from the lease's move-in date to the delivery date of the line in error"
      tenure_at_offer: "the full calendar months of continuous tenancy counted across the whole chain of terms from the lease's move-in date to the delivery date of the line in error"
      loyalty_cap_reduction: "48 months or more reduce the cap by 2.5 percentage points; 24 to 47 months reduce it by the expiring term program's loyalty reduction of the renewal increase cap; fewer than 24 months reduce it by nothing."
      returned_payments_12m: "a lease with no returned payment dated fewer than 12 full calendar months before the handling date"
      autopay_on_file: "with ACH autopay enrolled"
      standing_cap_reduction: "a lease with no returned payment dated fewer than 12 full calendar months before the handling date and with ACH autopay enrolled reduces the cap by 0.5 percentage points; a lease with no such returned payment and without autopay enrolled reduces it by 0.25 percentage points; a lease with such a returned payment receives no standing reduction."
      expiry_month: "The expiry-season cap reduction is set by the calendar month in which the expiring term ends"
      season_cap_reduction: "a term ending in November, December, January or February reduces the cap by 0.5 percentage points; a term ending in March, April, September or October reduces it by 0.25 percentage points; a term ending in May, June, July or August receives no season reduction."
      rent_changes_on_term: "or a term with no rent change recorded, receives no relief reduction"
      last_change_increase: "The increase-relief cap reduction is set by the last rent change recorded on the expiring term, measured as its new rent less its previous rent, divided by its previous rent"
      relief_cap_reduction: "an increase of 6 percent or more reduces the cap by 0.75 percentage points; an increase of 3 percent or more but under 6 percent reduces it by 0.25 percentage points; an increase under 3 percent, or a term with no rent change recorded, receives no relief reduction."
      company_cap: "Four cap reductions are subtracted together from the expiring term program's renewal increase cap, and the difference, never below zero, is the company cap."
      last_change_date: "counted from the effective date of the last rent change recorded on the term (or from the term start date when none is recorded) through the term end date, both days included"
      rent_days_in_force: "the days the in-place rent will have been in force at the end of the expiring term, counted from the effective date of the last rent change recorded on the term (or from the term start date when none is recorded) through the term end date, both days included"
      period_cap: "when the rent period is shorter than 365 days the company cap is prorated by the rent period's days over 365; when the rent period is 730 days or longer the company cap is compounded over two years, one plus the company cap, squared, less one; otherwise the company cap applies as it stands."
      community_state: "limited to the statutory increase cap of the community's state where one exists (8.8 percent in California and 9.68 percent in Washington)"
      statutory_cap: "limited to the statutory increase cap of the community's state where one exists (8.8 percent in California and 9.68 percent in Washington)"
      effective_cap: "The lower of the rent-period cap and the statutory increase cap of the community's state is the effective cap"
      capped_equivalent_rent: "the capped 12-month-equivalent rent, the in-place contracted rent of the expiring term raised by the effective cap"
      program_rent_adjustment: "adjusted by the term program's rent adjustment: a program with a premium adds the larger of its rent adjustment percentage of the capped 12-month-equivalent rent and its minimum monthly premium, a program with a discount subtracts its rent adjustment percentage of that rent, and a program with no adjustment adds nothing"
      result: "the result is rounded half up to the cent."
    factors:
      - id: loyalty_cap_reduction
        effect: parameter
        decides: loyalty_cap_reduction
        bindings: [offer_line_date, tenure_at_offer, loyalty_cap_reduction]
        ladder:
          - when: "48 or more full calendar months of continuous tenancy from the lease's move-in date to the delivery date of the line in error"
            value: "K('senior_loyalty_reduction') — 2.5 percentage points"
          - when: "24 to 47 such months"
            value: "P('loyalty_increase_cap_reduction_pct') — the expiring term program's loyalty reduction"
          - when: "fewer than 24 such months"
            value: "0 — no loyalty reduction"
        baseline:
          loyalty_cap_reduction: "0.0"
        evidence: [cross_category, date]
        cross_difficulty: lease
      - id: standing_cap_reduction
        effect: parameter
        decides: standing_cap_reduction
        bindings: [returned_payments_12m, autopay_on_file, standing_cap_reduction]
        ladder:
          - when: "no returned payment on the lease dated fewer than 12 full calendar months before the handling date AND ACH autopay enrolled"
            value: "K('autopay_standing_reduction') — 0.5 percentage points"
          - when: "no such returned payment AND autopay not enrolled"
            value: "K('manual_standing_reduction') — 0.25 percentage points"
          - when: "a returned payment dated fewer than 12 full calendar months before the handling date"
            value: "0 — no standing reduction"
        baseline:
          standing_cap_reduction: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: lease
      - id: expiry_season_cap_reduction
        effect: parameter
        decides: season_cap_reduction
        bindings: [expiry_month, season_cap_reduction]
        ladder:
          - when: "the expiring term ends in November, December, January or February"
            value: "K('off_season_reduction') — 0.5 percentage points"
          - when: "the expiring term ends in March, April, September or October"
            value: "K('shoulder_reduction') — 0.25 percentage points"
          - when: "the expiring term ends in May, June, July or August"
            value: "0 — no season reduction"
        baseline:
          season_cap_reduction: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: increase_relief_cap_reduction
        effect: parameter
        decides: relief_cap_reduction
        bindings: [rent_changes_on_term, last_change_increase, relief_cap_reduction]
        ladder:
          - when: "the last rent change recorded on the expiring term raised the rent by 6 percent or more"
            value: "K('steep_relief') — 0.75 percentage points"
          - when: "it raised the rent by 3 percent or more but under 6 percent"
            value: "K('moderate_relief') — 0.25 percentage points"
          - when: "it raised the rent by under 3 percent, or no rent change is recorded on the term"
            value: "0 — no relief reduction"
        baseline:
          relief_cap_reduction: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: rent_period_cap_fitting
        effect: method
        decides: period_cap
        bindings: [last_change_date, rent_days_in_force, period_cap]
        ladder:
          - when: "the rent period (days from the effective date of the last recorded rent change through the term end date, both included) is shorter than 365 days"
            method: "the company cap is prorated: company cap times the rent period's days divided by 365"
          - when: "the rent period is 730 days or longer"
            method: "the company cap is compounded over two years: one plus the company cap, squared, less one"
          - when: "the rent period is 365 to 729 days"
            method: "the company cap applies as it stands"
        baseline:
          period_cap: "company_cap"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The corrected offer rent of a like-program line is the capped 12-month-equivalent rent, the in-place
        contracted rent of the expiring term raised by the effective cap, adjusted by the term program's rent
        adjustment: a program with a premium adds the larger of its rent adjustment percentage of the capped
        12-month-equivalent rent and its minimum monthly premium, a program with a discount subtracts its rent
        adjustment percentage of that rent, and a program with no adjustment adds nothing; the result is rounded half
        up to the cent. The effective cap is the expiring term program's renewal increase cap, limited to the
        statutory increase cap of the community's state where one exists (8.8 percent in California and 9.68 percent
        in Washington).
      params: [renewal_increase_cap_pct, rent_adjustment_pct, rent_adjustment_min_amount, ca_statutory_cap, wa_statutory_cap]
    inputs:
      history:
        - {table: term_offers, aggregate: latest, field: offer_date, filters: {offered_variant: "=variant_name"}}
        - {table: term_rent_changes, aggregate: count, field: rent_change_id, filters: {}}
        - {table: term_rent_changes, aggregate: latest, field: new_rent, filters: {}}
        - {category: lease, table: lease_payments, aggregate: count, field: payment_id, within_months: 12, filters: {event_type: lease_payment_return}}
      cross_category: [lease]
  - id: term_ext_like_program_renewal_rent
    base_policy_refs: [term_agg_multi_holding, term_agg_tenancy_chain, term_evt_term_pricing, term_transfer_rule, term_mtm_conversion]
    overwrite:
      - base_policy: term_evt_term_pricing
        superseded_clause: >-
          Its contracted_rent is the offered_rent of the accepted line, less the early_renewal_discount_monthly of the
          accepted term program when the resident signs at least that program's early_renewal_window_days before the
          expiring term_end_date.
        replaced_by: >-
          The contracted rent of a like-program renewal is the offered rent of the most recently delivered offer line
          for the renewing term program on the expiring term, rounded half up to the cent.
    trigger: on_request
    subject: [term_create]
    computes: contracted_rent
    target_tool: sign_renewal_term_7151ccb7
    params:
      very_early_days: 75
      very_early_discount: 40.00
      single_violation_share: 0.5
      autopay_ontime_credit: 10.00
      manual_ontime_credit: 5.00
      garage_bundle_credit: 15.00
      surface_bundle_credit: 7.50
      half_up_guard: 0.000001
    rule: >-
      This rule prices a renewal into the same term program as the expiring term, a like-program renewal, from that
      program's offer line on the expiring term; a renewal into another term program is priced from its accepted line
      as the term pricing rule states. It applies on the Flexible, Standard, Extended and Long-Term Lease programs,
      whose early renewal discount is above zero; a like-program renewal on the Short-Term Lease program is priced from
      its accepted line as the term pricing rule states.
      The contracted rent of a like-program renewal is fixed only after the offer line standing for the renewing term
      program is priced within the effective cap of the renewal offer rules.
      The contracted rent of a like-program renewal is the offered rent of the most recently delivered offer line for
      the renewing term program on the expiring term, rounded half up to the cent.
      From that offered rent are subtracted, in one step, the early renewal discount multiplied by the discount share,
      the on-time renewal credit and the parking bundle credit, and only the result is rounded, half up to the cent.
      The early renewal discount is set by the early-renewal days counted before the expiring term's end date: 75
      days or more earn 40.00 dollars a month; at least the renewing term program's early renewal window but fewer
      than 75 days earn that program's early renewal discount; fewer days than the window earn no discount.
      The early-renewal days are counted to the expiring term's end date from one of three starting dates: when the
      renewing term program carries two or more offer lines on the expiring term because a line was re-issued, from
      the scheduled delivery date, so that the count equals the program's renewal offer lead days; when it carries a
      single line that was delivered later than scheduled, fewer than the program's renewal offer lead days before
      the term end date, from that line's delivery date; otherwise from the handling date on which the renewal is
      signed.
      The discount share is set by the lease violation notices dated fewer than 12 full calendar months before the
      handling date: two or more such notices leave none of the early renewal discount; exactly one such notice
      leaves half of it; no such notice leaves all of it.
      The on-time renewal credit is set by the lease's late fees and autopay enrollment: a lease with no late fee
      dated fewer than 12 full calendar months before the handling date and with ACH autopay enrolled earns 10.00
      dollars a month; a lease with no such late fee and without autopay enrolled earns 5.00 dollars a month; a lease
      with such a late fee earns no credit.
      The parking bundle credit is set by the household's active parking license: a Structured Garage Space, EV
      Charging Reserved Space or Private Detached Garage earns 15.00 dollars a month; any other active parking license
      earns 7.50 dollars a month; a household with no active parking license earns no credit.
    prerequisite:
      - problem: term_ext_offer_line_correction
        kind: value_input
        gate: line_rent
        form: state
        policy_source: >-
          The contracted rent of a like-program renewal is fixed only after the offer line standing for the renewing
          term program is priced within the effective cap of the renewal offer rules.
        condition: >-
          The most recently delivered term_offers line for the expiring term's own term program carries an
          offered_rent no higher than the corrected offer rent of the renewal offer rules (the in-place contracted rent
          raised by the effective cap and adjusted by the program's rent adjustment).
        resolved_by: reissue_renewal_offer_line_9239b766
        effect: >-
          Once the corrected line is delivered, line_rent reads the corrected offer rent instead of the rent posted in
          error, and renewing_lines becomes two, so the early-renewal days are counted from the scheduled delivery
          date.
    cross_category:
      - category: lease
        as: history
        reads: [autopay_enrolled, lease_notices.event_type, lease_notices.notice_date, lease_charges.event_type, lease_charges.charge_date]
        note: The discount share counts the lease's violation notices and the on-time renewal credit counts its late fees and reads its autopay enrollment.
      - category: parking
        as: branch
        reads: [variant_name, status]
        note: The parking bundle credit is set by the product of the household's active parking license.
    compute:
      - renewing_lines: "COUNT('term_offers', offered_variant=F('variant_name'))"
      - line_rent: "LATEST('term_offers','offered_rent', date_field='offer_date', offered_variant=F('variant_name'))"
      - line_delivery_date: "LATEST('term_offers','offer_date', date_field='offer_date', offered_variant=F('variant_name'))"
      - signing_days_before_end: "DAYS(NOW, F('term_end_date'))"
      - early_days_counted: "P('renewal_offer_lead_days') if renewing_lines >= 2 else (DAYS(line_delivery_date, F('term_end_date')) if (renewing_lines == 1 and DAYS(line_delivery_date, F('term_end_date')) < P('renewal_offer_lead_days')) else signing_days_before_end)"
      - early_renewal_discount: "K('very_early_discount') if early_days_counted >= K('very_early_days') else (P('early_renewal_discount_monthly') if early_days_counted >= P('early_renewal_window_days') else 0.0)"
      - violations_12m: "XCOUNT('lease','lease_notices', within_months=12, date_field='notice_date', event_type='lease_violation_notice')"
      - discount_share: "0.0 if violations_12m >= 2 else (K('single_violation_share') if violations_12m == 1 else 1.0)"
      - late_fees_12m: "XCOUNT('lease','lease_charges', within_months=12, date_field='charge_date', event_type='lease_late_fee')"
      - autopay_enrolled_now: "CFIELD('lease','autopay_enrolled')"
      - ontime_credit: "K('autopay_ontime_credit') if (late_fees_12m == 0 and autopay_enrolled_now == True) else (K('manual_ontime_credit') if (late_fees_12m == 0 and autopay_enrolled_now == False) else 0.0)"
      - active_parking_product: "CFIELD('parking','variant_name', status='active')"
      - bundle_credit: "K('garage_bundle_credit') if (active_parking_product == 'Structured Garage Space' or active_parking_product == 'EV Charging Reserved Space' or active_parking_product == 'Private Detached Garage') else (K('surface_bundle_credit') if active_parking_product != None else 0.0)"
      - result: "RND(line_rent - early_renewal_discount * discount_share - ontime_credit - bundle_credit + K('half_up_guard'), 2)"
    compute_basis:
      renewing_lines: "when the renewing term program carries two or more offer lines on the expiring term because a line was re-issued"
      line_rent: "The contracted rent of a like-program renewal is the offered rent of the most recently delivered offer line for the renewing term program on the expiring term, rounded half up to the cent."
      line_delivery_date: "when it carries a single line that was delivered later than scheduled, fewer than the program's renewal offer lead days before the term end date, from that line's delivery date"
      signing_days_before_end: "otherwise from the handling date on which the renewal is signed."
      early_days_counted: "The early-renewal days are counted to the expiring term's end date from one of three starting dates: when the renewing term program carries two or more offer lines on the expiring term because a line was re-issued, from the scheduled delivery date, so that the count equals the program's renewal offer lead days; when it carries a single line that was delivered later than scheduled, fewer than the program's renewal offer lead days before the term end date, from that line's delivery date; otherwise from the handling date on which the renewal is signed."
      early_renewal_discount: "The early renewal discount is set by the early-renewal days counted before the expiring term's end date: 75 days or more earn 40.00 dollars a month; at least the renewing term program's early renewal window but fewer than 75 days earn that program's early renewal discount; fewer days than the window earn no discount."
      violations_12m: "the lease violation notices dated fewer than 12 full calendar months before the handling date"
      discount_share: "two or more such notices leave none of the early renewal discount; exactly one such notice leaves half of it; no such notice leaves all of it."
      late_fees_12m: "a lease with no late fee dated fewer than 12 full calendar months before the handling date"
      autopay_enrolled_now: "with ACH autopay enrolled"
      ontime_credit: "a lease with no late fee dated fewer than 12 full calendar months before the handling date and with ACH autopay enrolled earns 10.00 dollars a month; a lease with no such late fee and without autopay enrolled earns 5.00 dollars a month; a lease with such a late fee earns no credit."
      active_parking_product: "The parking bundle credit is set by the household's active parking license"
      bundle_credit: "a Structured Garage Space, EV Charging Reserved Space or Private Detached Garage earns 15.00 dollars a month; any other active parking license earns 7.50 dollars a month; a household with no active parking license earns no credit."
      result: "From that offered rent are subtracted, in one step, the early renewal discount multiplied by the discount share, the on-time renewal credit and the parking bundle credit, and only the result is rounded, half up to the cent."
    factors:
      - id: early_renewal_discount
        effect: parameter
        decides: early_renewal_discount
        bindings: [signing_days_before_end, early_renewal_discount]
        ladder:
          - when: "75 or more early-renewal days before the expiring term's end date"
            value: "K('very_early_discount') — 40.00 dollars a month"
          - when: "at least the renewing program's early renewal window but fewer than 75 early-renewal days"
            value: "P('early_renewal_discount_monthly') — the program's early renewal discount"
          - when: "fewer early-renewal days than the program's early renewal window"
            value: "0 — no discount"
        baseline:
          early_renewal_discount: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: early_renewal_clock_start
        effect: method
        decides: early_days_counted
        bindings: [renewing_lines, line_delivery_date, early_days_counted]
        ladder:
          - when: "the renewing term program carries two or more offer lines on the expiring term (a line was re-issued)"
            method: "count from the scheduled delivery date: the program's renewal offer lead days"
          - when: "the renewing term program carries a single line delivered fewer than the program's renewal offer lead days before the term end date"
            method: "count from that line's delivery date to the term end date"
          - when: "the renewing term program carries a single line delivered on schedule"
            method: "count from the handling date on which the renewal is signed to the term end date"
        baseline:
          early_days_counted: "signing_days_before_end"
        evidence: [history, date]
        cross_difficulty: null
      - id: violation_discount_share
        effect: parameter
        decides: discount_share
        bindings: [violations_12m, discount_share]
        ladder:
          - when: "two or more lease violation notices dated fewer than 12 full calendar months before the handling date"
            value: "0 — none of the early renewal discount"
          - when: "exactly one such notice"
            value: "K('single_violation_share') — half of the discount"
          - when: "no such notice"
            value: "1 — all of the discount"
        baseline:
          discount_share: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: lease
      - id: on_time_renewal_credit
        effect: parameter
        decides: ontime_credit
        bindings: [late_fees_12m, autopay_enrolled_now, ontime_credit]
        ladder:
          - when: "no late fee dated fewer than 12 full calendar months before the handling date AND ACH autopay enrolled"
            value: "K('autopay_ontime_credit') — 10.00 dollars a month"
          - when: "no such late fee AND autopay not enrolled"
            value: "K('manual_ontime_credit') — 5.00 dollars a month"
          - when: "a late fee dated fewer than 12 full calendar months before the handling date"
            value: "0 — no credit"
        baseline:
          ontime_credit: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: lease
      - id: parking_bundle_credit
        effect: parameter
        decides: bundle_credit
        bindings: [active_parking_product, bundle_credit]
        ladder:
          - when: "an active Structured Garage Space, EV Charging Reserved Space or Private Detached Garage license"
            value: "K('garage_bundle_credit') — 15.00 dollars a month"
          - when: "any other active parking license"
            value: "K('surface_bundle_credit') — 7.50 dollars a month"
          - when: "no active parking license"
            value: "0 — no credit"
        baseline:
          bundle_credit: "0.0"
        evidence: [cross_category]
        cross_difficulty: parking
    baseline:
      rule: >-
        The contracted rent of a like-program renewal is the offered rent of the most recently delivered offer line
        for the renewing term program on the expiring term, rounded half up to the cent.
      params: []
    inputs:
      history:
        - {table: term_offers, aggregate: count, field: offer_id, filters: {offered_variant: "=variant_name"}}
        - {table: term_offers, aggregate: latest, field: offered_rent, filters: {offered_variant: "=variant_name"}}
        - {category: lease, table: lease_notices, aggregate: count, field: notice_id, within_months: 12, filters: {event_type: lease_violation_notice}}
        - {category: lease, table: lease_charges, aggregate: count, field: charge_id, within_months: 12, filters: {event_type: lease_late_fee}}
      cross_category: [lease, parking]
  - id: term_ext_break_concession_recapture
    base_policy_refs: [term_early_termination_rule, term_statutory_release, term_transfer_rule, term_evt_charges_credits_payments, term_agg_tenancy_chain]
    overwrite:
      - base_policy: term_early_termination_rule
        superseded_clause: >-
          On either route, when concession_recapture is true a concession_recapture of term_msr_unearned_concession is
          assessed; the job relocation and home purchase clauses do not waive it.
        replaced_by: >-
          The four recapture shares are multiplied together into one combined share, which is applied once to the
          unearned concession, and only that product is rounded, half up to the cent.
      - base_policy: term_agg_tenancy_chain
        superseded_clause: >-
          The unearned concession recaptured on an early exit is computed from the concession of the lease's new-lease
          term (term_msr_unearned_concession), even when the exit happens under a later term; a concession is never
          recaptured once the new-lease term has run to its term_end_date.
        replaced_by: >-
          The unearned months are counted by one of three conventions, set by how far into the term the requested
          termination date falls, measured in full calendar months from the term start date to the termination date
    trigger: state_due
    subject: [term_fee_assessment]
    computes: amount
    target_tool: book_concession_recapture_8b577669
    params:
      autopay_conduct_share: 0.80
      manual_conduct_share: 0.90
      military_share: 0.25
      employer_share: 0.50
      clean_24_share: 0.85
      clean_12_share: 0.95
      long_commitment_days: 480
      long_commitment_share: 0.80
      extended_commitment_days: 395
      extended_commitment_share: 0.90
      half_up_guard: 0.000001
    rule: >-
      This rule sets the concession recapture booked on the term account for an open lease-break request made on a
      lease's new-lease term whose term program recaptures concessions; it is booked against that request once per
      request, and a concession is never recaptured once the new-lease term has run to its
      end date. Exits by the Early Termination Option or under a later term are recaptured as the early termination
      rule states.
      The concession recapture on a lease-break request is the total of the rent concession credits posted on the lease
      ledger, multiplied by the full months from the requested termination date to the term end date and divided by
      the term's months, rounded half up to the cent.
      The unearned months are counted by one of three conventions, set by how far into the term the requested
      termination date falls, measured in full calendar months from the term start date to the termination date: when
      those months are at least two thirds of the term's months, the unearned months are the term's months times the
      days from the termination date to the term end date, divided by the days of the whole term with both its first
      and last day included; when they are fewer than half of the term's months, the unearned months are the full
      months from the termination date to the term end date plus one for the month in progress; otherwise they are the
      full months from the termination date to the term end date.
      The unearned concession is the concession total times the unearned months divided by the term's months, and no
      figure before the final one is rounded.
      The conduct share is set by the lease's payment record: a lease with no returned payment dated fewer than 12
      full calendar months before the handling date and with ACH autopay enrolled keeps 80 percent; a lease with no
      such returned payment and without autopay enrolled keeps 90 percent; a lease with such a returned payment keeps
      the whole.
      The partnership share is set by the lease's ongoing rent discount program: a lease on the active military discount keeps 25
      percent; a lease on the preferred employer discount keeps 50 percent; a lease with no discount program keeps the whole.
      The clean-record share is set by the lease violation notices: a lease with no violation notice dated fewer than
      24 full calendar months before the handling date keeps 85 percent; a lease with a violation notice in that span
      but none dated fewer than 12 full calendar months before the handling date keeps 95 percent; a lease with a
      violation notice dated fewer than 12 full calendar months before the handling date keeps the whole.
      The commitment share is set by the length of the term, counted in days from its start date through its end
      date with both days included: 480 days or more keeps 80 percent; 395 to 479 days keeps 90 percent; fewer than
      395 days keeps the whole.
      The four recapture shares are multiplied together into one combined share, which is applied once to the
      unearned concession, and only that product is rounded, half up to the cent.
    prerequisite: []
    cross_category:
      - category: lease
        as: history
        reads: [rent_discount_program, autopay_enrolled, lease_charges.charge_code, lease_charges.amount, lease_payments.event_type, lease_payments.payment_date, lease_notices.event_type, lease_notices.notice_date]
        note: The concession total is summed from the lease ledger's rent concession credits; the conduct, partnership and clean-record shares are set by the lease's returned payments and autopay, its rent discount program and its violation notices.
    compute:
      - open_exit_requests: "COUNT('term_change_requests', request_type='lease_break', request_status='submitted')"
      - exit_date: "LATEST('term_change_requests','requested_date', date_field='created_at', request_type='lease_break') if open_exit_requests > 0 else F('term_end_date')"
      - concession_total: "XSUM('lease','lease_charges','amount', charge_code='rent_concession')"
      - months_occupied: "MONTHS(F('term_start_date'), exit_date)"
      - unearned_months: "(F('term_months') * DAYS(exit_date, F('term_end_date')) / (DAYS(F('term_start_date'), F('term_end_date')) + 1)) if months_occupied * 3 >= F('term_months') * 2 else ((MONTHS(exit_date, F('term_end_date')) + 1) if months_occupied * 2 < F('term_months') else MONTHS(exit_date, F('term_end_date')))"
      - unearned_concession: "concession_total * unearned_months / F('term_months')"
      - returned_payments_12m: "XCOUNT('lease','lease_payments', within_months=12, date_field='payment_date', event_type='lease_payment_return')"
      - autopay_on_lease: "CFIELD('lease','autopay_enrolled')"
      - conduct_share: "K('autopay_conduct_share') if (returned_payments_12m == 0 and autopay_on_lease == True) else (K('manual_conduct_share') if (returned_payments_12m == 0 and autopay_on_lease == False) else 1.0)"
      - discount_program: "CFIELD('lease','rent_discount_program')"
      - partnership_share: "K('military_share') if discount_program == 'active_military' else (K('employer_share') if discount_program == 'preferred_employer' else 1.0)"
      - violations_24m: "XCOUNT('lease','lease_notices', within_months=24, date_field='notice_date', event_type='lease_violation_notice')"
      - violations_12m: "XCOUNT('lease','lease_notices', within_months=12, date_field='notice_date', event_type='lease_violation_notice')"
      - clean_record_share: "K('clean_24_share') if violations_24m == 0 else (K('clean_12_share') if violations_12m == 0 else 1.0)"
      - term_length_days: "DAYS(F('term_start_date'), F('term_end_date')) + 1"
      - commitment_share: "K('long_commitment_share') if term_length_days >= K('long_commitment_days') else (K('extended_commitment_share') if term_length_days >= K('extended_commitment_days') else 1.0)"
      - result: "RND(unearned_concession * conduct_share * partnership_share * clean_record_share * commitment_share + K('half_up_guard'), 2)"
    compute_basis:
      open_exit_requests: "This rule sets the concession recapture booked on the term account for an open lease-break request made on a lease's new-lease term"
      exit_date: "multiplied by the full months from the requested termination date to the term end date"
      concession_total: "the total of the rent concession credits posted on the lease ledger"
      months_occupied: "set by how far into the term the requested termination date falls, measured in full calendar months from the term start date to the termination date"
      unearned_months: "when those months are at least two thirds of the term's months, the unearned months are the term's months times the days from the termination date to the term end date, divided by the days of the whole term with both its first and last day included; when they are fewer than half of the term's months, the unearned months are the full months from the termination date to the term end date plus one for the month in progress; otherwise they are the full months from the termination date to the term end date."
      unearned_concession: "The unearned concession is the concession total times the unearned months divided by the term's months, and no figure before the final one is rounded."
      returned_payments_12m: "a lease with no returned payment dated fewer than 12 full calendar months before the handling date"
      autopay_on_lease: "with ACH autopay enrolled"
      conduct_share: "a lease with no returned payment dated fewer than 12 full calendar months before the handling date and with ACH autopay enrolled keeps 80 percent; a lease with no such returned payment and without autopay enrolled keeps 90 percent; a lease with such a returned payment keeps the whole."
      discount_program: "The partnership share is set by the lease's ongoing rent discount program"
      partnership_share: "a lease on the active military discount keeps 25 percent; a lease on the preferred employer discount keeps 50 percent; a lease with no discount program keeps the whole."
      violations_24m: "a lease with no violation notice dated fewer than 24 full calendar months before the handling date keeps 85 percent"
      violations_12m: "a lease with a violation notice dated fewer than 12 full calendar months before the handling date keeps the whole."
      clean_record_share: "a lease with no violation notice dated fewer than 24 full calendar months before the handling date keeps 85 percent; a lease with a violation notice in that span but none dated fewer than 12 full calendar months before the handling date keeps 95 percent; a lease with a violation notice dated fewer than 12 full calendar months before the handling date keeps the whole."
      term_length_days: "The commitment share is set by the length of the term, counted in days from its start date through its end date with both days included"
      commitment_share: "480 days or more keeps 80 percent; 395 to 479 days keeps 90 percent; fewer than 395 days keeps the whole."
      result: "The four recapture shares are multiplied together into one combined share, which is applied once to the unearned concession, and only that product is rounded, half up to the cent."
    factors:
      - id: unearned_month_convention
        effect: method
        decides: unearned_months
        bindings: [months_occupied, unearned_months]
        ladder:
          - when: "full months from the term start date to the termination date are at least two thirds of the term's months"
            method: "exact days: term months times the days from the termination date to the term end date over the days of the whole term, both ends included"
          - when: "those months are fewer than half of the term's months"
            method: "full months from the termination date to the term end date plus one for the month in progress"
          - when: "those months are at least half but under two thirds of the term's months"
            method: "full months from the termination date to the term end date"
        baseline:
          unearned_months: "MONTHS(exit_date, F('term_end_date'))"
        evidence: [date]
        cross_difficulty: null
      - id: conduct_share
        effect: parameter
        decides: conduct_share
        bindings: [returned_payments_12m, autopay_on_lease, conduct_share]
        ladder:
          - when: "no returned payment dated fewer than 12 full calendar months before the handling date AND ACH autopay enrolled"
            value: "K('autopay_conduct_share') — 80 percent"
          - when: "no such returned payment AND autopay not enrolled"
            value: "K('manual_conduct_share') — 90 percent"
          - when: "a returned payment dated fewer than 12 full calendar months before the handling date"
            value: "1 — the whole"
        baseline:
          conduct_share: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: lease
      - id: partnership_share
        effect: parameter
        decides: partnership_share
        bindings: [discount_program, partnership_share]
        ladder:
          - when: "the lease's rent discount program is the active military discount"
            value: "K('military_share') — 25 percent"
          - when: "the lease's rent discount program is the preferred employer discount"
            value: "K('employer_share') — 50 percent"
          - when: "the lease has no rent discount program"
            value: "1 — the whole"
        baseline:
          partnership_share: "1.0"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: clean_record_share
        effect: parameter
        decides: clean_record_share
        bindings: [violations_24m, violations_12m, clean_record_share]
        ladder:
          - when: "no violation notice dated fewer than 24 full calendar months before the handling date"
            value: "K('clean_24_share') — 85 percent"
          - when: "a violation notice in that span but none dated fewer than 12 full calendar months before the handling date"
            value: "K('clean_12_share') — 95 percent"
          - when: "a violation notice dated fewer than 12 full calendar months before the handling date"
            value: "1 — the whole"
        baseline:
          clean_record_share: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: lease
      - id: commitment_share
        effect: parameter
        decides: commitment_share
        bindings: [term_length_days, commitment_share]
        ladder:
          - when: "the term runs 480 days or more, start and end dates included"
            value: "K('long_commitment_share') — 80 percent"
          - when: "the term runs 395 to 479 days"
            value: "K('extended_commitment_share') — 90 percent"
          - when: "the term runs fewer than 395 days"
            value: "1 — the whole"
        baseline:
          commitment_share: "1.0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The concession recapture on a lease-break request is the total of the rent concession credits posted on the
        lease ledger, multiplied by the full months from the requested termination date to the term end date and
        divided by the term's months, rounded half up to the cent.
      params: []
    inputs:
      history:
        - {table: term_change_requests, aggregate: count, field: request_id, filters: {request_type: lease_break, request_status: submitted}}
        - {table: term_change_requests, aggregate: latest, field: requested_date, filters: {request_type: lease_break, request_status: submitted}}
        - {category: lease, table: lease_charges, aggregate: sum, field: amount, filters: {charge_code: rent_concession}}
        - {category: lease, table: lease_payments, aggregate: count, field: payment_id, within_months: 12, filters: {event_type: lease_payment_return}}
        - {category: lease, table: lease_notices, aggregate: count, field: notice_id, within_months: 24, filters: {event_type: lease_violation_notice}}
      cross_category: [lease]
  - id: term_ext_break_notice_shortfall
    base_policy_refs: [term_early_termination_rule, term_statutory_release, term_transfer_rule, term_evt_charges_credits_payments, term_notice_to_vacate_rule]
    overwrite: []
    trigger: state_due
    subject: [term_fee_assessment]
    computes: amount
    target_tool: book_exit_notice_charge_a2fdf71c
    params:
      large_plan_notice_days: 75
      small_plan_notice_days: 45
      thirty_day_month: 30
      week_year_days: 364
      days_per_year: 365
      peak_share: 0.50
      shoulder_share: 0.75
      repeat_lapse_multiplier: 1.50
      single_lapse_multiplier: 1.25
      half_up_guard: 0.000001
    rule: >-
      An open lease-break request whose requested termination date leaves fewer days of notice than the notice an exit
      requires carries an insufficient notice charge on the term account, booked against that request once per request,
      with the days charged recorded on the line; a request giving at least the required notice carries no such charge.
      A notice to vacate keeps its own insufficient notice charge under the notice to vacate rule; this rule sets only the
      charge on a lease-break request, which is never a notice.
      The exit notice shortfall charge is the daily rent, the term's contracted rent times 12 divided by 365 and rounded
      half up to the cent, times the shortfall days; the charge is rounded half up to the cent.
      The shortfall days are the notice an exit requires less the days of notice given, never fewer than zero.
      The notice an exit requires is the term program's notice to vacate days, and the days of notice given are the
      calendar days from the date the request was received to the requested termination date.
      The notice an exit requires is set by the floor plan of the lease: a Three-Bedroom Residence or Penthouse
      Residence requires 75 days; a Studio Residence or One-Bedroom Residence requires 45 days; any other floor plan
      requires the term program's notice to vacate days.
      The days of notice given are counted in one of three ways: a request received on a Saturday or Sunday is counted
      from the following Monday, the next business day, to the termination date; a request received on a weekday for a
      termination date that falls on a Saturday or Sunday is counted from the received date to the Friday before the
      termination date; any other request is counted in calendar days from the received date to the termination date.
      The daily rent is worked out by the convention of the community's state: in California and Washington the
      contracted rent is divided by 30; in Texas and Georgia the contracted rent times 12 is divided by 364; in every
      other state the contracted rent times 12 is divided by 365; in each case the daily rent is rounded half up to the
      cent before it is used.
      The season share is set by the calendar month of the requested termination date: May through August keeps 50
      percent of the charge; March, April, September or October keeps 75 percent; November through February keeps the
      whole.
      The lapse multiplier is set by the other lease-break and Early Termination Option requests on the same term that
      were withdrawn or expired, a withdrawn statutory release, transfer or rescission request not counting: two or
      more raise the charge to 150 percent; exactly one raises it to 125 percent; none leaves it at 100 percent.
      The daily rent is multiplied by the shortfall days, the season share and the lapse multiplier in one step, and
      only that product is rounded, half up to the cent.
    prerequisite: []
    cross_category:
      - category: lease
        as: branch
        reads: [variant_name, community_state]
        note: The required notice is set by the lease's floor plan and the daily-rent convention by the community's state.
    compute:
      - open_exit_requests: "COUNT('term_change_requests', request_type='lease_break', request_status='submitted')"
      - exit_date: "LATEST('term_change_requests','requested_date', date_field='created_at', request_type='lease_break') if open_exit_requests > 0 else F('term_end_date')"
      - received_date: "LATEST('term_change_requests','created_at', date_field='created_at', request_type='lease_break') if open_exit_requests > 0 else F('term_end_date')"
      - received_weekday: "DAYS('2024-01-01', received_date) % 7"
      - exit_weekday: "DAYS('2024-01-01', exit_date) % 7"
      - notice_days_given: "(DAYS(received_date, exit_date) - (7 - received_weekday)) if received_weekday >= 5 else ((DAYS(received_date, exit_date) - (exit_weekday - 4)) if exit_weekday >= 5 else DAYS(received_date, exit_date))"
      - leased_floor_plan: "CFIELD('lease','variant_name')"
      - required_notice_days: "K('large_plan_notice_days') if (leased_floor_plan == 'Three-Bedroom Residence' or leased_floor_plan == 'Penthouse Residence') else (K('small_plan_notice_days') if (leased_floor_plan == 'Studio Residence' or leased_floor_plan == 'One-Bedroom Residence') else P('notice_to_vacate_days'))"
      - shortfall_days: "MX(0, required_notice_days - notice_days_given)"
      - community_state: "CFIELD('lease','community_state')"
      - daily_rent: "RND(F('contracted_rent') / K('thirty_day_month') + K('half_up_guard'), 2) if (community_state == 'CA' or community_state == 'WA') else (RND(F('contracted_rent') * 12 / K('week_year_days') + K('half_up_guard'), 2) if (community_state == 'TX' or community_state == 'GA') else RND(F('contracted_rent') * 12 / K('days_per_year') + K('half_up_guard'), 2))"
      - exit_month: "MONTHS('2000-01-01', exit_date) % 12 + 1"
      - season_share: "K('peak_share') if (exit_month >= 5 and exit_month <= 8) else (K('shoulder_share') if (exit_month == 3 or exit_month == 4 or exit_month == 9 or exit_month == 10) else 1.0)"
      - lapsed_requests: "COUNT('term_change_requests', request_type='lease_break', request_status='withdrawn') + COUNT('term_change_requests', request_type='lease_break', request_status='expired') + COUNT('term_change_requests', request_type='early_termination_option', request_status='withdrawn') + COUNT('term_change_requests', request_type='early_termination_option', request_status='expired')"
      - lapse_multiplier: "K('repeat_lapse_multiplier') if lapsed_requests >= 2 else (K('single_lapse_multiplier') if lapsed_requests == 1 else 1.0)"
      - result: "RND(daily_rent * shortfall_days * season_share * lapse_multiplier + K('half_up_guard'), 2)"
    compute_basis:
      open_exit_requests: "An open lease-break request whose requested termination date leaves fewer days of notice than the notice an exit requires carries an insufficient notice charge on the term account"
      exit_date: "the calendar days from the date the request was received to the requested termination date"
      received_date: "the calendar days from the date the request was received to the requested termination date"
      received_weekday: "a request received on a Saturday or Sunday is counted from the following Monday, the next business day, to the termination date"
      exit_weekday: "a request received on a weekday for a termination date that falls on a Saturday or Sunday is counted from the received date to the Friday before the termination date"
      notice_days_given: "The days of notice given are counted in one of three ways: a request received on a Saturday or Sunday is counted from the following Monday, the next business day, to the termination date; a request received on a weekday for a termination date that falls on a Saturday or Sunday is counted from the received date to the Friday before the termination date; any other request is counted in calendar days from the received date to the termination date."
      leased_floor_plan: "The notice an exit requires is set by the floor plan of the lease"
      required_notice_days: "a Three-Bedroom Residence or Penthouse Residence requires 75 days; a Studio Residence or One-Bedroom Residence requires 45 days; any other floor plan requires the term program's notice to vacate days."
      shortfall_days: "The shortfall days are the notice an exit requires less the days of notice given, never fewer than zero."
      community_state: "The daily rent is worked out by the convention of the community's state"
      daily_rent: "in California and Washington the contracted rent is divided by 30; in Texas and Georgia the contracted rent times 12 is divided by 364; in every other state the contracted rent times 12 is divided by 365; in each case the daily rent is rounded half up to the cent before it is used."
      exit_month: "The season share is set by the calendar month of the requested termination date"
      season_share: "May through August keeps 50 percent of the charge; March, April, September or October keeps 75 percent; November through February keeps the whole."
      lapsed_requests: "The lapse multiplier is set by the other lease-break and Early Termination Option requests on the same term that were withdrawn or expired, a withdrawn statutory release, transfer or rescission request not counting"
      lapse_multiplier: "two or more raise the charge to 150 percent; exactly one raises it to 125 percent; none leaves it at 100 percent."
      result: "The daily rent is multiplied by the shortfall days, the season share and the lapse multiplier in one step, and only that product is rounded, half up to the cent."
    factors:
      - id: notice_day_count
        effect: method
        decides: notice_days_given
        bindings: [received_weekday, exit_weekday, notice_days_given]
        ladder:
          - when: "the request was received on a Saturday or Sunday"
            method: "count from the following Monday, the next business day, to the termination date"
          - when: "the request was received on a weekday and the termination date falls on a Saturday or Sunday"
            method: "count from the received date to the Friday before the termination date"
          - when: "the request was received on a weekday and the termination date falls on a weekday"
            method: "count calendar days from the received date to the termination date"
        baseline:
          notice_days_given: "DAYS(received_date, exit_date)"
        evidence: [history, date]
        cross_difficulty: null
      - id: exit_notice_requirement
        effect: parameter
        decides: required_notice_days
        bindings: [leased_floor_plan, required_notice_days]
        ladder:
          - when: "the lease is on a Three-Bedroom Residence or Penthouse Residence floor plan"
            value: "K('large_plan_notice_days') — 75 days"
          - when: "the lease is on a Studio Residence or One-Bedroom Residence floor plan"
            value: "K('small_plan_notice_days') — 45 days"
          - when: "the lease is on any other floor plan"
            value: "P('notice_to_vacate_days') — the term program's notice to vacate days"
        baseline:
          required_notice_days: "P('notice_to_vacate_days')"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: state_daily_rent_convention
        effect: method
        decides: daily_rent
        bindings: [community_state, daily_rent]
        ladder:
          - when: "the community is in California or Washington"
            method: "contracted rent divided by 30, rounded half up to the cent"
          - when: "the community is in Texas or Georgia"
            method: "contracted rent times 12 divided by 364, rounded half up to the cent"
          - when: "the community is in any other state"
            method: "contracted rent times 12 divided by 365, rounded half up to the cent"
        baseline:
          daily_rent: "RND(F('contracted_rent') * 12 / K('days_per_year') + K('half_up_guard'), 2)"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: exit_season_share
        effect: parameter
        decides: season_share
        bindings: [exit_month, season_share]
        ladder:
          - when: "the requested termination date falls in May, June, July or August"
            value: "K('peak_share') — 50 percent"
          - when: "it falls in March, April, September or October"
            value: "K('shoulder_share') — 75 percent"
          - when: "it falls in November, December, January or February"
            value: "1 — the whole"
        baseline:
          season_share: "1.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: lapsed_request_multiplier
        effect: parameter
        decides: lapse_multiplier
        bindings: [lapsed_requests, lapse_multiplier]
        ladder:
          - when: "two or more other lease-break or Early Termination Option requests on the term were withdrawn or expired"
            value: "K('repeat_lapse_multiplier') — 150 percent"
          - when: "exactly one was withdrawn or expired"
            value: "K('single_lapse_multiplier') — 125 percent"
          - when: "none was withdrawn or expired"
            value: "1 — 100 percent"
        baseline:
          lapse_multiplier: "1.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The exit notice shortfall charge is the daily rent, the term's contracted rent times 12 divided by 365 and
        rounded half up to the cent, times the shortfall days; the charge is rounded half up to the cent. The shortfall
        days are the notice an exit requires less the days of notice given, never fewer than zero. The notice an exit
        requires is the term program's notice to vacate days, and the days of notice given are the calendar days from
        the date the request was received to the requested termination date.
      params: [notice_to_vacate_days, days_per_year]
    inputs:
      history:
        - {table: term_change_requests, aggregate: latest, field: requested_date, filters: {request_type: lease_break, request_status: submitted}}
        - {table: term_change_requests, aggregate: latest, field: created_at, filters: {request_type: lease_break, request_status: submitted}}
        - {table: term_change_requests, aggregate: count, field: request_id, filters: {request_type: lease_break, request_status: withdrawn}}
        - {table: term_change_requests, aggregate: count, field: request_id, filters: {request_type: early_termination_option, request_status: withdrawn}}
      cross_category: [lease]
  - id: term_ext_lease_break_quote
    base_policy_refs: [term_early_termination_rule, term_statutory_release, term_transfer_rule, term_evt_charges_credits_payments]
    overwrite:
      - base_policy: term_early_termination_rule
        superseded_clause: >-
          When the option is not available, the exit is a lease break: a reletting_fee of reletting_fee_pct times
          contracted_rent is assessed, and when lease_break_rent_liability is true lease_break_rent accrues under the term
          charge rule from the day after move-out until the day before a replacement resident's lease starts on the
          apartment home or term_end_date, whichever comes first.
        replaced_by: >-
          The reletting rate is applied to the contracted rent and that part is rounded half up to the cent; the
          collection surcharge, the parking release surcharge, the turnover allowance and the pet turnover surcharge are
          then added to it to give the reletting fee.
    trigger: on_request
    subject: [term_early_termination, term_fee_assessment]
    computes: quoted_amount
    target_tool: sign_lease_break_agreement_f74cee5b
    params:
      short_lead_days: 30
      full_lead_days: 60
      short_remaining_months: 4
      mid_remaining_months: 6
      short_remaining_rate: 0.45
      mid_remaining_rate: 0.65
      delinquent_late_surcharge: 150.00
      delinquent_surcharge: 75.00
      garage_parking_surcharge: 50.00
      other_parking_surcharge: 25.00
      large_plan_turnover: 100.00
      mid_plan_turnover: 50.00
      dog_turnover: 60.00
      other_pet_turnover: 30.00
      half_up_guard: 0.000001
    rule: >-
      When the Early Termination Option is not available to a resident who must leave before the term end date and no
      statutory release is documented, the exit is a lease break: the resident signs a lease break agreement on the open
      lease-break request, the term ends as terminated early on the requested termination date, the reletting fee is
      booked against the request on signing, and lease-break rent still accrues under the term charge rule from the day
      after move-out until the day before a replacement resident's lease starts or the term end date, whichever comes
      first.
      The total quoted on a lease-break agreement is fixed only after the term account carries the concession recapture
      owed on the open lease-break request.
      The lease-break agreement is not quoted for signature until the term account carries the insufficient notice
      charge owed on the open lease-break request.
      The total quoted on the agreement is the reletting fee plus every concession recapture and insufficient notice
      charge standing on the term account against the same request, rounded half up to the cent.
      The reletting fee of a lease break is the term program's reletting fee rate times the term's contracted rent,
      rounded half up to the cent.
      The reletting rate is set by the reletting months remaining: fewer than 4 months take a rate of 45 percent; 4 to
      6 months take 65 percent; 7 months or more take the term program's reletting fee rate.
      The reletting months remaining are counted by the notice the request gave, the calendar days from the date the
      request was received to the requested termination date: under 30 days, the full months from the received date to
      the term end date; 30 to 59 days, the full months from the termination date to the term end date plus one for the
      month in progress; 60 days or more, the full months from the termination date to the term end date.
      The collection surcharge is set by the lease ledger: a lease carrying a past-due balance with a late fee dated
      fewer than 3 full calendar months before the handling date adds 150.00 dollars; a lease carrying a past-due
      balance with no such late fee adds 75.00 dollars; a lease with no past-due balance adds nothing.
      The parking release surcharge is set by the household's active parking license: a Structured Garage Space, EV
      Charging Reserved Space or Private Detached Garage adds 50.00 dollars; any other active parking license adds 25.00
      dollars; no active parking license adds nothing.
      The turnover allowance is set by the floor plan of the lease: a Three-Bedroom Residence or Penthouse Residence
      adds 100.00 dollars; a Two-Bedroom Residence or One-Bedroom Den Residence adds 50.00 dollars; any other floor plan
      adds nothing.
      The pet turnover surcharge is set by the household's active pet addendum for a pet, never for an assistance
      animal: an active dog adds 60.00 dollars; any other active pet adds 30.00 dollars; a household with no active
      pet addendum, or only an assistance animal, adds nothing.
      The reletting rate is applied to the contracted rent and that part is rounded half up to the cent; the collection
      surcharge, the parking release surcharge, the turnover allowance and the pet turnover surcharge are then added to
      it to give the reletting fee.
    prerequisite:
      - problem: term_ext_break_concession_recapture
        kind: value_input
        gate: recapture_on_request
        form: state
        policy_source: >-
          The total quoted on a lease-break agreement is fixed only after the term account carries the concession
          recapture owed on the open lease-break request.
        condition: >-
          term_charges carries a term_fee_assessment line with fee_code concession_recapture and request_id equal to the
          open lease-break request, at the amount the recapture rule gives for that request.
        resolved_by: book_concession_recapture_8b577669
        effect: >-
          recapture_on_request rises from zero to the recapture booked on the request, and the quoted total rises by the
          same amount.
      - problem: term_ext_break_notice_shortfall
        kind: value_input
        gate: notice_charge_on_request
        form: state
        policy_source: >-
          The lease-break agreement is not quoted for signature until the term account carries the insufficient notice
          charge owed on the open lease-break request.
        condition: >-
          term_charges carries a term_fee_assessment line with fee_code insufficient_notice_charge and request_id equal to
          the open lease-break request, at the amount the exit notice shortfall rule gives for that request.
        resolved_by: book_exit_notice_charge_a2fdf71c
        effect: >-
          notice_charge_on_request rises from zero to the notice charge booked on the request, and the quoted total rises
          by the same amount.
    cross_category:
      - category: lease
        as: history
        reads: [balance_due, variant_name, lease_charges.event_type, lease_charges.charge_date]
        note: The collection surcharge reads the lease's past-due balance and recent late fees; the turnover allowance reads its floor plan.
      - category: parking
        as: branch
        reads: [variant_name, status]
        note: The parking release surcharge is set by the product of the active parking license.
      - category: pet
        as: branch
        reads: [species, status, animal_type]
        note: The pet turnover surcharge is set by the species of the active pet addendum.
    compute:
      - open_exit_requests: "COUNT('term_change_requests', request_type='lease_break', request_status='submitted')"
      - open_request_id: "LATEST('term_change_requests','request_id', date_field='created_at', request_type='lease_break') if open_exit_requests > 0 else 'none'"
      - exit_date: "LATEST('term_change_requests','requested_date', date_field='created_at', request_type='lease_break') if open_exit_requests > 0 else F('term_end_date')"
      - received_date: "LATEST('term_change_requests','created_at', date_field='created_at', request_type='lease_break') if open_exit_requests > 0 else F('term_end_date')"
      - request_lead_days: "DAYS(received_date, exit_date)"
      - reletting_months: "MONTHS(received_date, F('term_end_date')) if request_lead_days < K('short_lead_days') else ((MONTHS(exit_date, F('term_end_date')) + 1) if request_lead_days < K('full_lead_days') else MONTHS(exit_date, F('term_end_date')))"
      - reletting_rate: "K('short_remaining_rate') if reletting_months < K('short_remaining_months') else (K('mid_remaining_rate') if reletting_months <= K('mid_remaining_months') else P('reletting_fee_pct'))"
      - rate_part: "RND(reletting_rate * F('contracted_rent') + K('half_up_guard'), 2)"
      - lease_past_due: "CFIELD('lease','balance_due')"
      - recent_late_fees: "XCOUNT('lease','lease_charges', within_months=3, date_field='charge_date', event_type='lease_late_fee')"
      - collection_surcharge: "K('delinquent_late_surcharge') if (lease_past_due > 0 and recent_late_fees > 0) else (K('delinquent_surcharge') if (lease_past_due > 0 and recent_late_fees == 0) else 0.0)"
      - parking_product: "CFIELD('parking','variant_name', status='active')"
      - parking_surcharge: "K('garage_parking_surcharge') if (parking_product == 'Structured Garage Space' or parking_product == 'EV Charging Reserved Space' or parking_product == 'Private Detached Garage') else (K('other_parking_surcharge') if parking_product != None else 0.0)"
      - leased_floor_plan: "CFIELD('lease','variant_name')"
      - turnover_allowance: "K('large_plan_turnover') if (leased_floor_plan == 'Three-Bedroom Residence' or leased_floor_plan == 'Penthouse Residence') else (K('mid_plan_turnover') if (leased_floor_plan == 'Two-Bedroom Residence' or leased_floor_plan == 'One-Bedroom Den Residence') else 0.0)"
      - pet_species: "CFIELD('pet','species', status='active', animal_type='pet')"
      - pet_surcharge: "K('dog_turnover') if pet_species == 'dog' else (K('other_pet_turnover') if pet_species != None else 0.0)"
      - reletting_fee: "RND(rate_part + collection_surcharge + parking_surcharge + turnover_allowance + pet_surcharge + K('half_up_guard'), 2)"
      - recapture_on_request: "SUM('term_charges','amount', event_type='term_fee_assessment', fee_code='concession_recapture', request_id=open_request_id)"
      - notice_charge_on_request: "SUM('term_charges','amount', event_type='term_fee_assessment', fee_code='insufficient_notice_charge', request_id=open_request_id)"
      - result: "RND(reletting_fee + recapture_on_request + notice_charge_on_request + K('half_up_guard'), 2)"
    compute_basis:
      open_exit_requests: "the resident signs a lease break agreement on the open lease-break request"
      open_request_id: "every concession recapture and insufficient notice charge standing on the term account against the same request"
      exit_date: "the calendar days from the date the request was received to the requested termination date"
      received_date: "the calendar days from the date the request was received to the requested termination date"
      request_lead_days: "The reletting months remaining are counted by the notice the request gave, the calendar days from the date the request was received to the requested termination date"
      reletting_months: "under 30 days, the full months from the received date to the term end date; 30 to 59 days, the full months from the termination date to the term end date plus one for the month in progress; 60 days or more, the full months from the termination date to the term end date."
      reletting_rate: "The reletting rate is set by the reletting months remaining: fewer than 4 months take a rate of 45 percent; 4 to 6 months take 65 percent; 7 months or more take the term program's reletting fee rate."
      rate_part: "The reletting rate is applied to the contracted rent and that part is rounded half up to the cent"
      lease_past_due: "a lease carrying a past-due balance"
      recent_late_fees: "with a late fee dated fewer than 3 full calendar months before the handling date"
      collection_surcharge: "a lease carrying a past-due balance with a late fee dated fewer than 3 full calendar months before the handling date adds 150.00 dollars; a lease carrying a past-due balance with no such late fee adds 75.00 dollars; a lease with no past-due balance adds nothing."
      parking_product: "The parking release surcharge is set by the household's active parking license"
      parking_surcharge: "a Structured Garage Space, EV Charging Reserved Space or Private Detached Garage adds 50.00 dollars; any other active parking license adds 25.00 dollars; no active parking license adds nothing."
      leased_floor_plan: "The turnover allowance is set by the floor plan of the lease"
      turnover_allowance: "a Three-Bedroom Residence or Penthouse Residence adds 100.00 dollars; a Two-Bedroom Residence or One-Bedroom Den Residence adds 50.00 dollars; any other floor plan adds nothing."
      pet_species: "The pet turnover surcharge is set by the household's active pet addendum for a pet, never for an assistance animal"
      pet_surcharge: "an active dog adds 60.00 dollars; any other active pet adds 30.00 dollars; a household with no active pet addendum, or only an assistance animal, adds nothing."
      reletting_fee: "the collection surcharge, the parking release surcharge, the turnover allowance and the pet turnover surcharge are then added to it to give the reletting fee."
      recapture_on_request: "every concession recapture and insufficient notice charge standing on the term account against the same request"
      notice_charge_on_request: "every concession recapture and insufficient notice charge standing on the term account against the same request"
      result: "The total quoted on the agreement is the reletting fee plus every concession recapture and insufficient notice charge standing on the term account against the same request, rounded half up to the cent."
    factors:
      - id: remaining_term_reletting_rate
        effect: parameter
        decides: reletting_rate
        bindings: [open_exit_requests, exit_date, reletting_rate]
        ladder:
          - when: "fewer than 4 reletting months remaining"
            value: "K('short_remaining_rate') — 45 percent"
          - when: "4 to 6 reletting months remaining"
            value: "K('mid_remaining_rate') — 65 percent"
          - when: "7 or more reletting months remaining"
            value: "P('reletting_fee_pct') — the term program's reletting fee rate"
        baseline:
          reletting_rate: "P('reletting_fee_pct')"
        evidence: [history, date]
        cross_difficulty: null
      - id: reletting_month_count
        effect: method
        decides: reletting_months
        bindings: [received_date, request_lead_days, reletting_months]
        ladder:
          - when: "the request gave under 30 days from its received date to the termination date"
            method: "full months from the received date to the term end date"
          - when: "the request gave 30 to 59 days"
            method: "full months from the termination date to the term end date plus one for the month in progress"
          - when: "the request gave 60 days or more"
            method: "full months from the termination date to the term end date"
        baseline:
          reletting_months: "MONTHS(exit_date, F('term_end_date'))"
        evidence: [history, date]
        cross_difficulty: null
      - id: collection_surcharge
        effect: parameter
        decides: collection_surcharge
        bindings: [lease_past_due, recent_late_fees, collection_surcharge]
        ladder:
          - when: "the lease carries a past-due balance AND a late fee dated fewer than 3 full calendar months before the handling date"
            value: "K('delinquent_late_surcharge') — 150.00 dollars"
          - when: "the lease carries a past-due balance AND no such late fee"
            value: "K('delinquent_surcharge') — 75.00 dollars"
          - when: "the lease carries no past-due balance"
            value: "0 — nothing"
        baseline:
          collection_surcharge: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: lease
      - id: parking_release_surcharge
        effect: parameter
        decides: parking_surcharge
        bindings: [parking_product, parking_surcharge]
        ladder:
          - when: "an active Structured Garage Space, EV Charging Reserved Space or Private Detached Garage license"
            value: "K('garage_parking_surcharge') — 50.00 dollars"
          - when: "any other active parking license"
            value: "K('other_parking_surcharge') — 25.00 dollars"
          - when: "no active parking license"
            value: "0 — nothing"
        baseline:
          parking_surcharge: "0.0"
        evidence: [cross_category]
        cross_difficulty: parking
      - id: floor_plan_turnover_allowance
        effect: parameter
        decides: turnover_allowance
        bindings: [leased_floor_plan, turnover_allowance]
        ladder:
          - when: "the lease is on a Three-Bedroom Residence or Penthouse Residence"
            value: "K('large_plan_turnover') — 100.00 dollars"
          - when: "the lease is on a Two-Bedroom Residence or One-Bedroom Den Residence"
            value: "K('mid_plan_turnover') — 50.00 dollars"
          - when: "the lease is on any other floor plan"
            value: "0 — nothing"
        baseline:
          turnover_allowance: "0.0"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: pet_turnover_surcharge
        effect: parameter
        decides: pet_surcharge
        bindings: [pet_species, pet_surcharge]
        ladder:
          - when: "an active pet addendum for a dog"
            value: "K('dog_turnover') — 60.00 dollars"
          - when: "an active pet addendum for any other pet"
            value: "K('other_pet_turnover') — 30.00 dollars"
          - when: "no active pet addendum, or only an assistance animal"
            value: "0 — nothing"
        baseline:
          pet_surcharge: "0.0"
        evidence: [cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        The total quoted on the agreement is the reletting fee plus every concession recapture and insufficient notice
        charge standing on the term account against the same request, rounded half up to the cent. The reletting fee of
        a lease break is the term program's reletting fee rate times the term's contracted rent, rounded half up to the
        cent.
      params: [reletting_fee_pct]
    inputs:
      history:
        - {table: term_change_requests, aggregate: latest, field: requested_date, filters: {request_type: lease_break, request_status: submitted}}
        - {table: term_charges, aggregate: sum, field: amount, filters: {fee_code: concession_recapture}}
        - {table: term_charges, aggregate: sum, field: amount, filters: {fee_code: insufficient_notice_charge}}
        - {category: lease, table: lease_charges, aggregate: count, field: charge_id, within_months: 3, filters: {event_type: lease_late_fee}}
      cross_category: [lease, parking, pet]
