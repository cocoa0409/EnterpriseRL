events:
  # ---- application and move-in (holding writes) ----
  - type: lease_application
    target: leases
    mutation: create
    meaning: A prospective resident submits a rental application for a specific apartment home and floor plan.
    grain: One row per application for one apartment home.
    fields:
      customer_id: The applicant profile that becomes the primary leaseholder.
      variant_name: Floor plan applied for, official floor plan tier name.
      community_name: Community of the apartment home.
      community_state: State of the community, which fixes the governing landlord-tenant statutes.
      unit_number: Apartment home applied for, as printed on the application.
      application_date: Date the application was submitted.
      monthly_rent: Quoted monthly base rent for the apartment home.
      occupants_count: Persons proposed to occupy the apartment home.
      adult_applicants_count: Adult applicants to be screened.
      gross_monthly_income: Combined verified gross monthly income of the adult applicants.
      rent_discount_program: Discount program claimed at application, none if not claimed.
    triggers:
      - event: lease:lease_fee_charge
        map: {charge_code: application_fee}
  - type: lease_approval
    target: leases
    mutation: {transition: {from: applied, to: approved}}
    meaning: Screening approves the application (with or without conditions) and the lease is countersigned.
    grain: One row per transaction.
    fields:
      screening_result: approved or approved_with_conditions.
      screening_credit_score: Highest applicant credit score returned by the bureau.
    triggers:
      - event: lease:lease_fee_charge
        map: {charge_code: admin_fee}
      - event: deposit:deposit_account_open
        map: {lease_id: lease_id}
      - event: term:term_create
        map: {lease_id: lease_id, term_origin: new_lease}
      - event: utility:utility_enrollment
        map: {lease_id: lease_id}
  - type: lease_denial
    target: leases
    mutation: {transition: {from: applied, to: denied}}
    meaning: Screening denies the application or the application fails a floor plan entry gate.
    grain: One row per transaction.
    fields:
      screening_result: denied.
      screening_credit_score: Highest applicant credit score returned by the bureau.
      closed_date: Date of the denial, which closes the record.
    triggers: []
  - type: lease_withdrawal
    target: leases
    mutation: {transition: [{from: applied, to: cancelled}, {from: approved, to: cancelled}]}
    meaning: The applicant withdraws the application, before or after approval, before taking possession.
    grain: One row per transaction.
    fields:
      closed_date: Date the withdrawal was signed.
    triggers:
      - event: term:term_cancellation
      - event: deposit:deposit_close
  - type: lease_move_in
    target: leases
    mutation: {transition: {from: approved, to: active}}
    meaning: The resident completes move-in, receives keys and fobs, and possession begins.
    grain: One row per transaction.
    fields:
      move_in_date: Date possession began.
    triggers:
      - event: lease:lease_rent_charge
        map: {charge_code: prorated_rent, charge_date: move_in_date}
      - event: term:term_start
      - event: utility:utility_activation
  # ---- ledger: charges and credits ----
  - type: lease_rent_charge
    target: lease_charges
    meaning: Base rent for one billing period is posted to the lease ledger, in full on the due day or prorated for a partial month.
    grain: One row per rent line per billing period.
    distinguish_by: [charge_code, billing_period]
    fields:
      charge_code: base_rent for a full month, prorated_rent for a partial month.
      billing_period: Rent month billed.
      charge_date: Rent due date for base_rent; move-in date for prorated_rent.
      amount: Rent posted.
      proration_days: Days billed.
      days_in_period: Actual days in the rent month.
    account: rent_receivable
    direction: in
    triggers: []
  - type: lease_fee_charge
    target: lease_charges
    meaning: A lease fee is posted — application, administration, recurring amenity, trash valet, smart home or liability program fee, or a service fee for a fob, lockout, lease modification or court cost.
    grain: One row per fee occurrence.
    distinguish_by: [charge_code, billing_period, charge_date, service_window]
    fields:
      charge_code: Fee code.
      billing_period: Month the fee belongs to.
      charge_date: Date the fee was posted (the service date for fobs, lockouts and modifications).
      amount: Fee amount.
      service_window: business_hours or after_hours for lockout_fee; not_applicable otherwise.
      proration_days: Days billed for a prorated recurring fee; 0 for one-time fees.
      days_in_period: Actual days in the month for a prorated recurring fee; 0 for one-time fees.
    account: rent_receivable
    direction: in
    triggers: []
  - type: lease_late_fee
    target: lease_charges
    meaning: A late fee is assessed because rent for a billing period remained unpaid after the grace period.
    grain: One row per late fee per billing period per assessment day.
    distinguish_by: [charge_code, billing_period, charge_date]
    fields:
      charge_code: late_fee_initial or late_fee_daily.
      billing_period: Rent month that is late.
      charge_date: Day the late fee was assessed.
      amount: Late fee amount.
    account: rent_receivable
    direction: in
    triggers: []
  - type: lease_nsf_fee
    target: lease_charges
    meaning: A returned payment fee is charged for one dishonored payment.
    grain: One row per returned payment.
    distinguish_by: [source_payment_id]
    fields:
      charge_code: returned_payment_fee.
      source_payment_id: The dishonored payment.
      billing_period: Month of the return.
      charge_date: Date the fee was posted.
      amount: Fee after any state cap.
    account: rent_receivable
    direction: in
    triggers: []
  - type: lease_charge_credit
    target: lease_charges
    meaning: A credit reduces the ledger — a move-in rent concession, a monthly rent discount program credit, a courtesy late fee waiver or the reversal of a charge posted in error.
    grain: One row per credit per credited charge or billing period.
    distinguish_by: [charge_code, billing_period, source_charge_id]
    fields:
      charge_code: rent_concession, preferred_employer_discount, military_discount, late_fee_waiver or charge_reversal.
      billing_period: Month credited.
      charge_date: Date the credit was posted.
      amount: Credit amount (positive).
      source_charge_id: The single charge waived or reversed; for rent_concession and discount credits, the base_rent charge of the month credited.
    account: rent_receivable
    direction: out
    triggers: []
  # ---- ledger: payments ----
  - type: lease_payment
    target: lease_payments
    meaning: A payment is received on the lease ledger.
    grain: One row per payment transaction.
    distinguish_by: [payment_reference]
    fields:
      payment_method: Instrument used.
      amount: Amount received.
      payment_date: Date received.
      payment_reference: Portal confirmation number or instrument serial number.
      plan_request_id: Payment plan the payment belongs to, empty otherwise.
    account: rent_receivable
    direction: out
    triggers: []
  - type: lease_payment_return
    target: lease_payments
    meaning: A previously received payment is dishonored and reversed by the bank or card network.
    grain: One row per returned payment.
    distinguish_by: [source_payment_id]
    fields:
      source_payment_id: The payment being reversed.
      payment_method: Instrument of the returned payment.
      amount: Amount reversed (equal to the original payment).
      payment_date: Date of the return.
      payment_reference: Bank return trace or chargeback reference.
      return_reason: Return reason code.
    account: rent_receivable
    direction: in
    triggers:
      - event: lease:lease_nsf_fee
        when: {return_reason: [insufficient_funds, account_closed, stop_payment]}
        map: {source_payment_id: source_payment_id}
  - type: lease_certified_funds_restriction
    target: leases
    mutation: update
    meaning: The lease is placed on, or released from, certified funds only.
    grain: One row per transaction.
    fields:
      certified_funds_only: true when placed, false when released.
      certified_funds_until: Last date of the restriction.
    triggers: []
  - type: lease_autopay_update
    target: leases
    mutation: update
    meaning: The resident enrolls in or cancels recurring ACH autopay.
    grain: One row per transaction.
    fields:
      autopay_enrolled: New enrollment state.
    triggers: []
  - type: lease_insurance_update
    target: leases
    mutation: update
    meaning: Proof of renter's liability insurance is accepted, or a policy on file lapses or is cancelled.
    grain: One row per transaction.
    fields:
      insurance_on_file: New proof-of-insurance state.
    triggers: []
  # ---- delinquency, default and eviction ----
  - type: lease_delinquency_notice
    target: lease_notices
    meaning: A statutory notice demanding past-due rent (pay rent or quit) is served on the resident.
    grain: One row per notice served.
    distinguish_by: [notice_date, billing_period]
    fields:
      notice_date: Date served.
      cure_deadline: Last day to pay the amount demanded.
      amount_demanded: Past-due rent demanded (rent only, never fees).
      billing_period: Latest rent month included in the demand.
      service_method: How the notice was served.
    triggers:
      - event: lease:lease_default
  - type: lease_default
    target: leases
    mutation: {transition: {from: active, to: in_default}}
    meaning: The lease enters default when a delinquency notice is served.
    grain: One row per transaction.
    fields:
      balance_due: Ledger balance at the moment of default (read, not rewritten).
    triggers: []
  - type: lease_default_cure
    target: leases
    mutation: {transition: {from: in_default, to: active}}
    meaning: The default is cured by full payment of the amount demanded, or by a signed payment plan and its down payment, by the cure deadline.
    grain: One row per transaction.
    fields:
      balance_due: Ledger balance after the curing payment (read, not rewritten).
    triggers: []
  - type: lease_violation_notice
    target: lease_notices
    meaning: A notice to cure a non-monetary lease violation (cure or quit) is served.
    grain: One row per notice served.
    distinguish_by: [notice_date, violation_code]
    fields:
      notice_date: Date served.
      cure_deadline: Last day to cure the violation.
      violation_code: Covenant breached.
      service_method: How the notice was served.
      amount_demanded: 0.00.
    triggers: []
  - type: lease_eviction_referral
    target: lease_notices
    meaning: An expired, uncured delinquency notice is referred to eviction counsel with the balance to be sued for.
    grain: One row per referral.
    distinguish_by: [notice_date, billing_period]
    fields:
      notice_date: Referral date.
      amount_demanded: Past-due rent referred.
      billing_period: Latest rent month included.
    triggers:
      - event: lease:lease_eviction_filing
      - event: lease:lease_fee_charge
        map: {charge_code: court_cost}
  - type: lease_eviction_filing
    target: leases
    mutation: {transition: {from: in_default, to: eviction_filed}}
    meaning: Counsel files the eviction case.
    grain: One row per transaction.
    fields:
      balance_due: Ledger balance at filing including court costs (read, not rewritten).
    triggers: []
  - type: lease_reinstatement
    target: leases
    mutation: {transition: {from: eviction_filed, to: active}}
    meaning: The tenancy is reinstated before judgment after the resident pays the full reinstatement amount.
    grain: One row per transaction.
    fields:
      balance_due: Ledger balance after the reinstatement payment (read, not rewritten).
    triggers: []
  # ---- end of tenancy ----
  - type: lease_vacate
    target: leases
    mutation: {transition: [{from: active, to: vacated}, {from: in_default, to: vacated}, {from: eviction_filed, to: vacated}]}
    meaning: Possession ends — keys returned at move-out, abandonment confirmed, or a writ of possession executed.
    grain: One row per transaction.
    fields:
      move_out_date: Date possession ended.
    triggers:
      - event: deposit:deposit_move_out_review
        map: {move_out_date: move_out_date}
      - event: utility:utility_final_billing
        map: {service_end_date: move_out_date}
      - event: term:term_completion
      - event: parking:parking_move_out_termination
        map: {end_date: move_out_date}
      - event: storage:storage_move_out_termination
        map: {end_date: move_out_date}
      - event: pet:pet_addendum_end
        map: {end_date: move_out_date}
  - type: lease_close
    target: leases
    mutation: {transition: {from: vacated, to: closed}}
    meaning: The lease record is closed once the final account statement has been issued.
    grain: One row per transaction.
    fields:
      closed_date: Date closed.
    triggers: []
  # ---- consequences of term agreements ----
  - type: lease_rent_update
    target: leases
    mutation: update
    meaning: The monthly rent in force changes because a renewal, month-to-month conversion or other recorded rent change took effect.
    grain: One row per transaction.
    fields:
      monthly_rent: New monthly base rent.
    triggers: []
  - type: lease_unit_transfer
    target: leases
    mutation: update
    meaning: The lease moves to another apartment home in the same community under a signed transfer.
    grain: One row per transaction.
    fields:
      unit_number: New apartment home.
      variant_name: Floor plan of the new apartment home.
      monthly_rent: Monthly base rent of the new apartment home.
      occupants_count: Occupants approved for the new apartment home.
    triggers: []

measures:
  - id: lease_msr_unpaid_period_rent
    window: One billing period (calendar month) of one lease, evaluated at the end of a given calendar day.
    measure: The base_rent and prorated_rent charged for that billing period, less rent_concession, preferred_employer_discount and military_discount credits for that period, less the part of every lease_payment received by the end of that day (net of lease_payment_return rows dated by then) that the payment allocation order assigns to that period's rent; never below 0.00.
  - id: lease_msr_period_late_fees
    window: One billing period of one lease.
    measure: Sum of amount over lease_late_fee rows (late_fee_initial and late_fee_daily) whose billing_period is that period, less late_fee_waiver and charge_reversal credits whose source_charge_id is one of those rows.
  - id: lease_msr_returned_payments_12m
    window: Trailing 365 calendar days ending on and including the evaluation date.
    measure: Count of lease_payment_return rows on the lease whose payment_date falls in the window and whose return_reason is insufficient_funds, account_closed or stop_payment.
  - id: lease_msr_courtesy_waivers_12m
    window: Trailing 365 calendar days ending on and including the evaluation date.
    measure: Count of distinct billing_period values among lease_charge_credit rows on the lease with charge_code late_fee_waiver whose charge_date falls in the window.
  - id: lease_msr_lockouts_12m
    window: Trailing 365 calendar days ending on and including the evaluation date.
    measure: Count of lease_fee_charge rows on the lease with charge_code lockout_fee (including 0.00 lines) whose charge_date falls in the window.
  - id: lease_msr_payment_plans_12m
    window: Trailing 365 calendar days ending on and including the evaluation date.
    measure: Count of lease_payment_plan_requests rows on the lease whose request_status is signed, completed or defaulted and whose created_at date falls in the window; separately, whether any of them is defaulted.
  - id: lease_msr_referrals_on_lease
    window: Whole life of the lease.
    measure: Count of lease_eviction_referral rows on the lease.

policies:
  - id: lease_agg_multi_holding
    subject: [lease_application]
    rule: >-
      A resident may be the primary leaseholder on only one Larkspur apartment home lease at a time.
      A new application is accepted only when the customer holds no other lease in applied, approved, active, in_default, eviction_filed or vacated status.
      Leases that are denied, cancelled or closed do not count. A move to another apartment home in the same
      community during a lease is a transfer under the Lease Term Agreement charter and never a second application;
      a move to a different community requires the current lease to reach closed first. Co-signers and occupants
      who are not the primary leaseholder are outside this cap.
    eligibility:
      - id: one_open_lease
        applies_to: [lease_application]
        kind: dedup
        condition: "A new application is accepted only when the customer holds no other lease in applied, approved, active, in_default, eviction_filed or vacated status."
        evidence_fields: [leases.customer_id, leases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.customer_id]
          action_bindings:
            leases.customer_id: customer_id
        dedup_contract:
          table: leases
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, approved, active, in_default, eviction_filed, vacated]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: lease_screening_decision
    subject: [lease_application, lease_approval, lease_denial]
    rule: >-
      The application may be submitted only when the proposed occupants do not exceed the floor plan's max_occupants, the adult applicants do not exceed its max_adult_applicants, and every adult applicant has reached min_leaseholder_age.
      Occupancy is judged against the floor plan's max_occupants, which follows from its bedrooms; a den never counts as a
      bedroom. An application failing that test is not submitted and no application fee posts. The screening fee posts at
      submission as one application_fee line equal to application_fee_per_adult times adult_applicants_count, and
      it is not refunded on denial or withdrawal.
      A screening decision is recorded only from the result returned by the screening service; an applicant's own account of their credit or income never substitutes for it.
      The decision is taken in this order. The application is denied when gross_monthly_income is below
      min_income_multiple times the quoted monthly_rent, or when screening_credit_score is below
      min_credit_score_conditional. Otherwise it is approved without conditions when screening_credit_score is at or
      above min_credit_score_full_approval, and approved_with_conditions when it is at or above
      min_credit_score_conditional but below min_credit_score_full_approval. An approved_with_conditions result is
      carried into the security deposit charter, which assigns the deposit plan; approval with or without
      conditions both move the lease to approved and post the admin_fee once. Income of a guarantor or of a person
      who will not sign the lease is not counted in gross_monthly_income.
    eligibility:
      - id: occupancy_within_floor_plan
        applies_to: [lease_application]
        kind: caller_fact
        condition: "The application may be submitted only when the proposed occupants do not exceed the floor plan's max_occupants, the adult applicants do not exceed its max_adult_applicants, and every adult applicant has reached min_leaseholder_age."
        evidence_fields: [leases.occupants_count, leases.adult_applicants_count, leases.variant_name, leases.unit_number]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [leases.unit_number]
          action_bindings:
            leases.unit_number: unit_number
      - id: screening_result_on_record
        applies_to: [lease_approval, lease_denial]
        kind: authorization
        condition: "A screening decision is recorded only from the result returned by the screening service; an applicant's own account of their credit or income never substitutes for it."
        evidence_fields: [leases.lease_id, leases.screening_result, leases.screening_credit_score, leases.gross_monthly_income]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
    params:
      per_tier:
        Studio Residence: {min_income_multiple: "=min_income_multiple", min_credit_score_full_approval: "=min_credit_score_full_approval", min_credit_score_conditional: "=min_credit_score_conditional", max_occupants: "=max_occupants"}
        One-Bedroom Residence: {min_income_multiple: "=min_income_multiple", min_credit_score_full_approval: "=min_credit_score_full_approval", min_credit_score_conditional: "=min_credit_score_conditional", max_occupants: "=max_occupants"}
        One-Bedroom Den Residence: {min_income_multiple: "=min_income_multiple", min_credit_score_full_approval: "=min_credit_score_full_approval", min_credit_score_conditional: "=min_credit_score_conditional", max_occupants: "=max_occupants"}
        Two-Bedroom Residence: {min_income_multiple: "=min_income_multiple", min_credit_score_full_approval: "=min_credit_score_full_approval", min_credit_score_conditional: "=min_credit_score_conditional", max_occupants: "=max_occupants"}
        Three-Bedroom Residence: {min_income_multiple: "=min_income_multiple", min_credit_score_full_approval: "=min_credit_score_full_approval", min_credit_score_conditional: "=min_credit_score_conditional", max_occupants: "=max_occupants"}
        Penthouse Residence: {min_income_multiple: "=min_income_multiple", min_credit_score_full_approval: "=min_credit_score_full_approval", min_credit_score_conditional: "=min_credit_score_conditional", max_occupants: "=max_occupants"}
    formula:
      income_qualifies: gross_monthly_income >= min_income_multiple * monthly_rent
      application_fee_total: application_fee_per_adult * adult_applicants_count

  - id: lease_move_in_readiness
    subject: [lease_move_in]
    rule: >-
      Keys are issued and move-in is recorded only on an approved lease.
      Move-in may be recorded only when the security deposit account opened for this lease is in held status.
      That holds equally for a cash deposit plan and for the Zero-Deposit Guarantee Plan, whose account reaches held
      when its enrollment is complete under the security deposit charter. Funds due at move-in are the prorated rent
      for the move-in month and, when the move-in day of month is on or after second_month_collection_day, the full
      base rent of the following month as well; they are accepted only in the move_in_funds_methods of the floor
      plan. When no qualifying proof of renter's insurance is on file at move-in, move-in still proceeds and the
      liability program fee starts under the lease fee rule. The move-in date starts the initial Lease Term Agreement
      and activates the utility account for the lease.
    eligibility:
      - id: deposit_account_held
        applies_to: [lease_move_in]
        kind: state
        condition: "Move-in may be recorded only when the security deposit account opened for this lease is in held status."
        evidence_fields: [deposit_accounts.lease_id, deposit_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.lease_id]
          action_bindings:
            deposit_accounts.lease_id: lease_id
        state_contract:
          field: deposit_accounts.status
          allowed: [held]
    params:
      per_tier:
        Studio Residence: {move_in_funds_methods: "=move_in_funds_methods", second_month_collection_day: "=second_month_collection_day"}
        One-Bedroom Residence: {move_in_funds_methods: "=move_in_funds_methods", second_month_collection_day: "=second_month_collection_day"}
        One-Bedroom Den Residence: {move_in_funds_methods: "=move_in_funds_methods", second_month_collection_day: "=second_month_collection_day"}
        Two-Bedroom Residence: {move_in_funds_methods: "=move_in_funds_methods", second_month_collection_day: "=second_month_collection_day"}
        Three-Bedroom Residence: {move_in_funds_methods: "=move_in_funds_methods", second_month_collection_day: "=second_month_collection_day"}
        Penthouse Residence: {move_in_funds_methods: "=move_in_funds_methods", second_month_collection_day: "=second_month_collection_day"}

  - id: lease_evt_rent_posting
    subject: [lease_rent_charge]
    rule: >-
      Rent posts only while the lease is active, in_default or eviction_filed.
      On rent_due_day of every calendar month in possession one base_rent line posts for that month equal to the
      monthly_rent in force on that day, with proration_days and days_in_period both equal to the actual days of the
      month. At move-in one prorated_rent line posts for the move-in month: proration_days counts the days from the
      move-in date through the last day of the month, both inclusive, days_in_period is the actual number of days in
      that month (proration_method actual_days_in_month), and the amount is the monthly rent times proration_days
      divided by days_in_period, rounded half up to the cent. A move-in on the due day posts a base_rent line instead.
      When the move-in day is on or after second_month_collection_day, the following month's base_rent also posts on
      the move-in date. Rent is never prorated at move-out: the full base rent of the month in which possession ends
      is owed, and any settlement for the days after an early departure belongs to the Lease Term Agreement charter.
      Only one rent line of each charge code posts for a billing period.
      A rent change or unit transfer takes effect from the first billing period whose due date is on or after its
      effective date; rent already posted is not re-rated.
    eligibility:
      - id: rent_posting_status
        applies_to: [lease_rent_charge]
        kind: state
        condition: "Rent posts only while the lease is active, in_default or eviction_filed."
        evidence_fields: [leases.lease_id, leases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
        state_contract:
          field: leases.status
          allowed: [active, in_default, eviction_filed]
      - id: one_rent_line_per_period
        applies_to: [lease_rent_charge]
        kind: dedup
        condition: "Only one rent line of each charge code posts for a billing period."
        evidence_fields: [lease_charges.lease_id, lease_charges.billing_period, lease_charges.charge_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_charges.lease_id, lease_charges.billing_period]
          action_bindings:
            lease_charges.lease_id: lease_id
            lease_charges.billing_period: billing_period
        dedup_contract:
          table: lease_charges
          mode: separate_record
          object_bindings: {lease_id: lease_id, billing_period: billing_period}
          duplicate_filters: {charge_code: [base_rent, prorated_rent]}
          distinct_fields: [charge_code]
    params:
      per_tier:
        Studio Residence: {rent_due_day: "=rent_due_day", proration_method: "=proration_method", second_month_collection_day: "=second_month_collection_day"}
        One-Bedroom Residence: {rent_due_day: "=rent_due_day", proration_method: "=proration_method", second_month_collection_day: "=second_month_collection_day"}
        One-Bedroom Den Residence: {rent_due_day: "=rent_due_day", proration_method: "=proration_method", second_month_collection_day: "=second_month_collection_day"}
        Two-Bedroom Residence: {rent_due_day: "=rent_due_day", proration_method: "=proration_method", second_month_collection_day: "=second_month_collection_day"}
        Three-Bedroom Residence: {rent_due_day: "=rent_due_day", proration_method: "=proration_method", second_month_collection_day: "=second_month_collection_day"}
        Penthouse Residence: {rent_due_day: "=rent_due_day", proration_method: "=proration_method", second_month_collection_day: "=second_month_collection_day"}
    formula:
      prorated_amount: round(monthly_rent * proration_days / days_in_period, 2)

  - id: lease_evt_fees
    subject: [lease_fee_charge, lease_insurance_update]
    rule: >-
      Lease fees post only while the lease is applied, approved, active, in_default or eviction_filed.
      The application_fee posts at submission and the admin_fee posts once when the lease is approved. The monthly
      amenity_fee, trash_valet_fee and smart_home_fee post on rent_due_day of every month in possession at the floor
      plan's amounts; a fee whose floor plan amount is 0.00 is included in rent and posts no line. In the move-in month
      each recurring fee is prorated exactly as rent is (same proration_days and days_in_period, rounded half up to the
      cent). The liability_program_fee of liability_program_fee_monthly posts on rent_due_day for every month in which insurance_on_file is false on
      that day; it is never prorated, it stops from the first due day on which proof is on file, and accepting proof
      never refunds a month already posted. Proof qualifies only when its personal liability limit is at least the
      floor plan's min_liability_coverage and the policy names Larkspur Residential Trust as interested party. Each lost,
      damaged or additional access fob beyond fobs_issued_at_move_in is billed at key_fob_replacement_fee, as one line
      for all fobs issued the same day. A lockout answered 8:00-18:00 local time Monday-Saturday is billed at
      lockout_fee_business_hours and any other lockout at lockout_fee_after_hours, recorded in service_window; while
      lease_msr_lockouts_12m before this lockout is below lockouts_free_per_12_months the lockout posts a 0.00
      lockout_fee line instead. Adding or removing a leaseholder or occupant mid-term posts lease_modification_fee once
      per signed modification. A court_cost line posts on the date a file is referred to eviction counsel, in the amount
      of court_cost_by_state for the community's state. No other fee may be posted to the lease ledger; utility,
      parking, storage and pet charges belong to their own charters.
    eligibility:
      - id: fee_posting_status
        applies_to: [lease_fee_charge]
        kind: state
        condition: "Lease fees post only while the lease is applied, approved, active, in_default or eviction_filed."
        evidence_fields: [leases.lease_id, leases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
        state_contract:
          field: leases.status
          allowed: [applied, approved, active, in_default, eviction_filed]
    params:
      court_cost_by_state: {CA: 385.00, WA: 157.00, CO: 106.00, TX: 129.00, GA: 98.00, AZ: 83.00}
      per_tier:
        Studio Residence: {amenity_fee_monthly: "=amenity_fee_monthly", trash_valet_fee_monthly: "=trash_valet_fee_monthly", smart_home_fee_monthly: "=smart_home_fee_monthly", lockouts_free_per_12_months: "=lockouts_free_per_12_months", admin_fee: "=admin_fee"}
        One-Bedroom Residence: {amenity_fee_monthly: "=amenity_fee_monthly", trash_valet_fee_monthly: "=trash_valet_fee_monthly", smart_home_fee_monthly: "=smart_home_fee_monthly", lockouts_free_per_12_months: "=lockouts_free_per_12_months", admin_fee: "=admin_fee"}
        One-Bedroom Den Residence: {amenity_fee_monthly: "=amenity_fee_monthly", trash_valet_fee_monthly: "=trash_valet_fee_monthly", smart_home_fee_monthly: "=smart_home_fee_monthly", lockouts_free_per_12_months: "=lockouts_free_per_12_months", admin_fee: "=admin_fee"}
        Two-Bedroom Residence: {amenity_fee_monthly: "=amenity_fee_monthly", trash_valet_fee_monthly: "=trash_valet_fee_monthly", smart_home_fee_monthly: "=smart_home_fee_monthly", lockouts_free_per_12_months: "=lockouts_free_per_12_months", admin_fee: "=admin_fee"}
        Three-Bedroom Residence: {amenity_fee_monthly: "=amenity_fee_monthly", trash_valet_fee_monthly: "=trash_valet_fee_monthly", smart_home_fee_monthly: "=smart_home_fee_monthly", lockouts_free_per_12_months: "=lockouts_free_per_12_months", admin_fee: "=admin_fee"}
        Penthouse Residence: {amenity_fee_monthly: "=amenity_fee_monthly", trash_valet_fee_monthly: "=trash_valet_fee_monthly", smart_home_fee_monthly: "=smart_home_fee_monthly", lockouts_free_per_12_months: "=lockouts_free_per_12_months", admin_fee: "=admin_fee"}
    formula:
      lockout_amount: 0 if lease_msr_lockouts_12m < lockouts_free_per_12_months else (lockout_fee_after_hours if service_window == "after_hours" else lockout_fee_business_hours)
    measures: [lease_msr_lockouts_12m]

  - id: lease_evt_late_fee
    subject: [lease_late_fee]
    rule: >-
      Late fees may be assessed only while the lease is active or in_default.
      No late fee is assessed once an eviction case is filed, and none is ever assessed on fees, utilities or other
      non-rent charges.
      A billing period's rent is late on a day when lease_msr_unpaid_period_rent for that period, evaluated at the end
      of that day, is above 0.00. The effective grace period is the longer of the floor plan's grace_period_days and
      the state_min_days_late of the community's state.
      An initial late fee may be assessed only when the frozen date is later than the rent due date of the billing period plus the effective grace period.
      Grace days are counted as calendar days starting the day after the rent due date, without skipping weekends or holidays, so the first late day is the day after the last grace day.
      On the first late day one late_fee_initial line posts equal to the greater of late_fee_initial_flat and
      late_fee_initial_pct times the monthly_rent in force on the due date, rounded half up to the cent; at most one
      initial late fee posts per billing period. For each later calendar day on which the rent is still late one
      late_fee_daily line of late_fee_daily_amount posts, up to late_fee_daily_max_days lines for the period. All late
      fees of one period together are capped at the lowest applicable cap: the company cap of late_fee_cap_pct_of_rent
      times monthly_rent; in TX, tx_cap_pct_of_rent times monthly_rent; in CO, the greater of co_cap_flat and
      co_cap_pct_of_past_due times the rent unpaid on the first late day. A fee that would pass the cap posts only the
      remaining room, and no line posts once lease_msr_period_late_fees reaches the cap. Periods covered by a signed
      payment plan in good standing accrue no late fees while the plan is in good standing.
    eligibility:
      - id: late_fee_status
        applies_to: [lease_late_fee]
        kind: state
        condition: "Late fees may be assessed only while the lease is active or in_default."
        evidence_fields: [leases.lease_id, leases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
        state_contract:
          field: leases.status
          allowed: [active, in_default]
      - id: past_grace_period
        applies_to: [lease_late_fee]
        kind: time
        condition: "An initial late fee may be assessed only when the frozen date is later than the rent due date of the billing period plus the effective grace period."
        evidence_fields: [lease_charges.lease_id, lease_charges.billing_period, lease_charges.charge_date, leases.community_state]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_charges.lease_id, lease_charges.billing_period]
          action_bindings:
            lease_charges.lease_id: lease_id
            lease_charges.billing_period: billing_period
        temporal_basis:
          clock: frozen_time
          anchor_event: the rent due date of the billing period
          anchor_source: lease_charges.charge_date
          relation: not_before
          duration_source: variants.grace_period_days
          unit: calendar_days
          counting_rule: "Grace days are counted as calendar days starting the day after the rent due date, without skipping weekends or holidays, so the first late day is the day after the last grace day."
          boundary: exclusive
      - id: one_initial_late_fee
        applies_to: [lease_late_fee]
        kind: dedup
        condition: "at most one initial late fee posts per billing period"
        evidence_fields: [lease_charges.lease_id, lease_charges.billing_period, lease_charges.charge_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_charges.lease_id, lease_charges.billing_period]
          action_bindings:
            lease_charges.lease_id: lease_id
            lease_charges.billing_period: billing_period
        dedup_contract:
          table: lease_charges
          mode: separate_record
          object_bindings: {lease_id: lease_id, billing_period: billing_period}
          duplicate_filters: {charge_code: [late_fee_initial]}
          distinct_fields: [charge_date]
    params:
      state_min_days_late: {CA: 0, WA: 5, CO: 7, TX: 2, GA: 0, AZ: 0}
      tx_cap_pct_of_rent: 0.10
      co_cap_flat: 50.00
      co_cap_pct_of_past_due: 0.05
      per_tier:
        Studio Residence: {late_fee_initial_flat: "=late_fee_initial_flat", late_fee_initial_pct: "=late_fee_initial_pct", late_fee_daily_amount: "=late_fee_daily_amount", late_fee_daily_max_days: "=late_fee_daily_max_days", late_fee_cap_pct_of_rent: "=late_fee_cap_pct_of_rent", grace_period_days: "=grace_period_days"}
        One-Bedroom Residence: {late_fee_initial_flat: "=late_fee_initial_flat", late_fee_initial_pct: "=late_fee_initial_pct", late_fee_daily_amount: "=late_fee_daily_amount", late_fee_daily_max_days: "=late_fee_daily_max_days", late_fee_cap_pct_of_rent: "=late_fee_cap_pct_of_rent", grace_period_days: "=grace_period_days"}
        One-Bedroom Den Residence: {late_fee_initial_flat: "=late_fee_initial_flat", late_fee_initial_pct: "=late_fee_initial_pct", late_fee_daily_amount: "=late_fee_daily_amount", late_fee_daily_max_days: "=late_fee_daily_max_days", late_fee_cap_pct_of_rent: "=late_fee_cap_pct_of_rent", grace_period_days: "=grace_period_days"}
        Two-Bedroom Residence: {late_fee_initial_flat: "=late_fee_initial_flat", late_fee_initial_pct: "=late_fee_initial_pct", late_fee_daily_amount: "=late_fee_daily_amount", late_fee_daily_max_days: "=late_fee_daily_max_days", late_fee_cap_pct_of_rent: "=late_fee_cap_pct_of_rent", grace_period_days: "=grace_period_days"}
        Three-Bedroom Residence: {late_fee_initial_flat: "=late_fee_initial_flat", late_fee_initial_pct: "=late_fee_initial_pct", late_fee_daily_amount: "=late_fee_daily_amount", late_fee_daily_max_days: "=late_fee_daily_max_days", late_fee_cap_pct_of_rent: "=late_fee_cap_pct_of_rent", grace_period_days: "=grace_period_days"}
        Penthouse Residence: {late_fee_initial_flat: "=late_fee_initial_flat", late_fee_initial_pct: "=late_fee_initial_pct", late_fee_daily_amount: "=late_fee_daily_amount", late_fee_daily_max_days: "=late_fee_daily_max_days", late_fee_cap_pct_of_rent: "=late_fee_cap_pct_of_rent", grace_period_days: "=grace_period_days"}
    formula:
      initial_late_fee: max(late_fee_initial_flat, round(late_fee_initial_pct * monthly_rent, 2))
      company_period_cap: round(late_fee_cap_pct_of_rent * monthly_rent, 2)
      tx_period_cap: round(tx_cap_pct_of_rent * monthly_rent, 2)
    measures: [lease_msr_unpaid_period_rent, lease_msr_period_late_fees]

  - id: lease_evt_payment_acceptance
    subject: [lease_payment, lease_autopay_update]
    rule: >-
      Payments are accepted on a lease only while it is approved, active, in_default, eviction_filed or vacated.
      A closed lease accepts no payment here; any balance left at closing is carried and collected under the security
      deposit charter. Funds due at move-in are accepted only in the floor plan's move_in_funds_methods. While
      certified_funds_only is true and the payment date is on or before certified_funds_until, only the
      certified_funds_methods are accepted, and ACH autopay cannot be enrolled. Once a delinquency notice has been
      served, a payment smaller than the full amount demanded is accepted only when partial_payment_after_notice_accepted
      is true for the floor plan or the payment is the down payment or an installment of a signed payment plan; once an
      eviction case is filed, only a payment of the full balance_due is accepted. Every accepted payment is applied to
      the open charges of the lease in the allocation order of the community's state: allocation_order_default,
      unless allocation_order_overrides names the state. Within each group charges are paid oldest charge_date first,
      and within one date rent before recurring fees. An autopay enrollment or cancellation takes effect for the next
      rent due date that is at least autopay_cutoff_days calendar days after the request; a request made later takes
      effect for the due date after that.
    eligibility:
      - id: payment_acceptance_status
        applies_to: [lease_payment]
        kind: state
        condition: "Payments are accepted on a lease only while it is approved, active, in_default, eviction_filed or vacated."
        evidence_fields: [leases.lease_id, leases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
        state_contract:
          field: leases.status
          allowed: [approved, active, in_default, eviction_filed, vacated]
    params:
      allocation_order_default: [non_rent_charges, rent_charges]
      allocation_order_overrides: {CO: [rent_charges, non_rent_charges]}
      autopay_cutoff_days: 3
      per_tier:
        Studio Residence: {certified_funds_methods: "=certified_funds_methods", partial_payment_after_notice_accepted: "=partial_payment_after_notice_accepted"}
        One-Bedroom Residence: {certified_funds_methods: "=certified_funds_methods", partial_payment_after_notice_accepted: "=partial_payment_after_notice_accepted"}
        One-Bedroom Den Residence: {certified_funds_methods: "=certified_funds_methods", partial_payment_after_notice_accepted: "=partial_payment_after_notice_accepted"}
        Two-Bedroom Residence: {certified_funds_methods: "=certified_funds_methods", partial_payment_after_notice_accepted: "=partial_payment_after_notice_accepted"}
        Three-Bedroom Residence: {certified_funds_methods: "=certified_funds_methods", partial_payment_after_notice_accepted: "=partial_payment_after_notice_accepted"}
        Penthouse Residence: {certified_funds_methods: "=certified_funds_methods", partial_payment_after_notice_accepted: "=partial_payment_after_notice_accepted"}

  - id: lease_evt_returned_payment
    subject: [lease_payment_return, lease_nsf_fee, lease_certified_funds_restriction]
    rule: >-
      A returned payment reverses the original payment in full: the return row carries the original payment_id as
      source_payment_id and the original amount, dated the day the bank or card network returned it. A return for
      insufficient_funds, account_closed or stop_payment posts one returned_payment_fee line for that payment; a
      card_chargeback posts no fee, because a card dispute is the cardholder's right.
      Only one returned payment fee posts for a given returned payment.
      The fee is the floor plan's returned_payment_fee, reduced to the cap of the community's state in
      returned_payment_fee_cap_by_state when that is lower; in CA the first cap applies to the first fee-bearing
      return ever recorded on the lease and the subsequent cap to every later one. When lease_msr_returned_payments_12m,
      counting the return just recorded, reaches certified_funds_trigger_count, the lease is placed on certified funds
      only with certified_funds_until equal to the return date plus certified_funds_months calendar months (same day
      number, falling back to the month's last day), and any autopay enrollment is cancelled the same day. The
      restriction ends by itself after certified_funds_until; it is recorded as released (certified_funds_only false)
      at the first ledger action after that date, and it is never shortened on request.
    eligibility:
      - id: one_fee_per_return
        applies_to: [lease_nsf_fee]
        kind: dedup
        condition: "Only one returned payment fee posts for a given returned payment."
        evidence_fields: [lease_charges.source_payment_id, lease_charges.charge_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_charges.source_payment_id]
          action_bindings:
            lease_charges.source_payment_id: source_payment_id
        dedup_contract:
          table: lease_charges
          mode: separate_record
          object_bindings: {source_payment_id: source_payment_id}
          duplicate_filters: {charge_code: [returned_payment_fee]}
          distinct_fields: []
    params:
      returned_payment_fee_cap_by_state:
        CA: {first: 25.00, subsequent: 35.00}
        WA: {first: 40.00, subsequent: 40.00}
        CO: {first: 20.00, subsequent: 20.00}
        TX: {first: 30.00, subsequent: 30.00}
        GA: {first: 30.00, subsequent: 30.00}
        AZ: {first: 25.00, subsequent: 25.00}
      per_tier:
        Studio Residence: {returned_payment_fee: "=returned_payment_fee", certified_funds_trigger_count: "=certified_funds_trigger_count", certified_funds_months: "=certified_funds_months"}
        One-Bedroom Residence: {returned_payment_fee: "=returned_payment_fee", certified_funds_trigger_count: "=certified_funds_trigger_count", certified_funds_months: "=certified_funds_months"}
        One-Bedroom Den Residence: {returned_payment_fee: "=returned_payment_fee", certified_funds_trigger_count: "=certified_funds_trigger_count", certified_funds_months: "=certified_funds_months"}
        Two-Bedroom Residence: {returned_payment_fee: "=returned_payment_fee", certified_funds_trigger_count: "=certified_funds_trigger_count", certified_funds_months: "=certified_funds_months"}
        Three-Bedroom Residence: {returned_payment_fee: "=returned_payment_fee", certified_funds_trigger_count: "=certified_funds_trigger_count", certified_funds_months: "=certified_funds_months"}
        Penthouse Residence: {returned_payment_fee: "=returned_payment_fee", certified_funds_trigger_count: "=certified_funds_trigger_count", certified_funds_months: "=certified_funds_months"}
    measures: [lease_msr_returned_payments_12m]

  - id: lease_evt_credits_and_waivers
    subject: [lease_charge_credit]
    rule: >-
      Five credits exist on the lease ledger and no other. A rent_concession of the floor plan's move_in_concession_weeks
      is granted only on a new lease: its amount is the monthly_rent at move-in times 12, divided by 52, times the
      weeks, rounded half up to the cent, and it is credited against the base_rent of the first full billing period after
      move-in (the move-in month itself when move-in falls on the due day); any excess over that month's rent is
      credited against the next month.
      A rent concession is granted only when the lease's initial Lease Term Agreement has a term of at least the floor plan's concession_min_term_months.
      Renewal and transfer terms never earn a concession. A lease enrolled in rent_discount_program preferred_employer
      receives each month a preferred_employer_discount of preferred_employer_discount_pct times the monthly_rent in
      force, rounded half up to the cent, and one enrolled in active_military receives a military_discount of
      military_discount_monthly; a program discount starts with the first full billing period. The concession and a
      program discount never stack: in a billing period that receives a rent_concession credit no program discount is
      posted, and the discount resumes the following month. A courtesy late_fee_waiver credits every late fee line of
      one billing period in full, one credit per late fee line with that line as source_charge_id.
      A courtesy waiver may be granted only when the frozen date is on or after the move-in date plus the floor plan's courtesy_waiver_min_tenure_months.
      Tenure months are counted in calendar months from the move-in date to the same day number of a later month, falling back to the last day of that month when that day number does not exist.
      A courtesy waiver further requires that lease_msr_courtesy_waivers_12m is below courtesy_waivers_per_12_months,
      that autopay is enrolled when the floor plan's courtesy_waiver_requires_autopay is true, that
      lease_msr_returned_payments_12m is 0, that the late rent of that period has been paid in full, and that the
      lease is not eviction_filed. A charge_reversal credits the erroneous part of a charge posted against this
      charter (a late fee on rent that was not late, a duplicate line, a fee above its cap, a liability program fee for
      a month whose due day had proof on file); it does not count toward the courtesy limit.
      A charge is waived or reversed at most once.
    eligibility:
      - id: concession_term_length
        applies_to: [lease_charge_credit]
        kind: state
        condition: "A rent concession is granted only when the lease's initial Lease Term Agreement has a term of at least the floor plan's concession_min_term_months."
        evidence_fields: [lease_terms.lease_id, lease_terms.term_origin, lease_terms.term_months, lease_terms.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_terms.lease_id]
          action_bindings:
            lease_terms.lease_id: lease_id
        state_contract:
          field: lease_terms.term_origin
          allowed: [new_lease]
      - id: courtesy_tenure
        applies_to: [lease_charge_credit]
        kind: time
        condition: "A courtesy waiver may be granted only when the frozen date is on or after the move-in date plus the floor plan's courtesy_waiver_min_tenure_months."
        evidence_fields: [leases.lease_id, leases.move_in_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the move-in date
          anchor_source: leases.move_in_date
          relation: not_before
          duration_source: variants.courtesy_waiver_min_tenure_months
          unit: calendar_months
          counting_rule: "Tenure months are counted in calendar months from the move-in date to the same day number of a later month, falling back to the last day of that month when that day number does not exist."
          boundary: inclusive
      - id: waive_once
        applies_to: [lease_charge_credit]
        kind: dedup
        condition: "A charge is waived or reversed at most once."
        evidence_fields: [lease_charges.source_charge_id, lease_charges.charge_code]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_charges.source_charge_id]
          action_bindings:
            lease_charges.source_charge_id: source_charge_id
        dedup_contract:
          table: lease_charges
          mode: separate_record
          object_bindings: {source_charge_id: source_charge_id}
          duplicate_filters: {charge_code: [late_fee_waiver, charge_reversal]}
          distinct_fields: []
    params:
      per_tier:
        Studio Residence: {move_in_concession_weeks: "=move_in_concession_weeks", concession_min_term_months: "=concession_min_term_months", preferred_employer_discount_pct: "=preferred_employer_discount_pct", military_discount_monthly: "=military_discount_monthly", courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_tenure_months: "=courtesy_waiver_min_tenure_months", courtesy_waiver_requires_autopay: "=courtesy_waiver_requires_autopay"}
        One-Bedroom Residence: {move_in_concession_weeks: "=move_in_concession_weeks", concession_min_term_months: "=concession_min_term_months", preferred_employer_discount_pct: "=preferred_employer_discount_pct", military_discount_monthly: "=military_discount_monthly", courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_tenure_months: "=courtesy_waiver_min_tenure_months", courtesy_waiver_requires_autopay: "=courtesy_waiver_requires_autopay"}
        One-Bedroom Den Residence: {move_in_concession_weeks: "=move_in_concession_weeks", concession_min_term_months: "=concession_min_term_months", preferred_employer_discount_pct: "=preferred_employer_discount_pct", military_discount_monthly: "=military_discount_monthly", courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_tenure_months: "=courtesy_waiver_min_tenure_months", courtesy_waiver_requires_autopay: "=courtesy_waiver_requires_autopay"}
        Two-Bedroom Residence: {move_in_concession_weeks: "=move_in_concession_weeks", concession_min_term_months: "=concession_min_term_months", preferred_employer_discount_pct: "=preferred_employer_discount_pct", military_discount_monthly: "=military_discount_monthly", courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_tenure_months: "=courtesy_waiver_min_tenure_months", courtesy_waiver_requires_autopay: "=courtesy_waiver_requires_autopay"}
        Three-Bedroom Residence: {move_in_concession_weeks: "=move_in_concession_weeks", concession_min_term_months: "=concession_min_term_months", preferred_employer_discount_pct: "=preferred_employer_discount_pct", military_discount_monthly: "=military_discount_monthly", courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_tenure_months: "=courtesy_waiver_min_tenure_months", courtesy_waiver_requires_autopay: "=courtesy_waiver_requires_autopay"}
        Penthouse Residence: {move_in_concession_weeks: "=move_in_concession_weeks", concession_min_term_months: "=concession_min_term_months", preferred_employer_discount_pct: "=preferred_employer_discount_pct", military_discount_monthly: "=military_discount_monthly", courtesy_waivers_per_12_months: "=courtesy_waivers_per_12_months", courtesy_waiver_min_tenure_months: "=courtesy_waiver_min_tenure_months", courtesy_waiver_requires_autopay: "=courtesy_waiver_requires_autopay"}
    formula:
      concession_amount: round(monthly_rent * 12 / 52 * move_in_concession_weeks, 2)
      preferred_employer_amount: round(preferred_employer_discount_pct * monthly_rent, 2)
    measures: [lease_msr_courtesy_waivers_12m, lease_msr_returned_payments_12m]

  - id: lease_delinquency_and_default
    subject: [lease_delinquency_notice, lease_default, lease_default_cure]
    rule: >-
      A delinquency notice may be served only on an active lease.
      A delinquency notice may be served only when the frozen date is later than the rent due date of the billing period plus the effective grace period.
      Grace days are counted as calendar days starting the day after the rent due date, without skipping weekends or holidays, so the first late day is the day after the last grace day.
      The effective grace period is the one defined by the late fee rule. No notice is served for a billing period covered
      by a signed payment plan in good standing. The amount demanded is the unpaid rent only — the sum of
      lease_msr_unpaid_period_rent over every late billing period on the notice date — and never includes late fees,
      returned payment fees, other lease fees or charges of any other charter; billing_period records the latest rent
      month included. The notice period is nonpayment_notice_days_by_state for the community's state. The day of service
      is not counted; in CA the period counts only days that are not Saturdays, Sundays or California court holidays,
      and in every other state it counts calendar days, the last one included even when it falls on a weekend. The
      cure_deadline is the last day of that period. Service is by personal_delivery or posted_and_mailed. Serving the
      notice puts the lease in default. The default is cured, and the lease returns to active, when before the file is
      referred to eviction counsel the payments received on or after the notice date reach the amount demanded, or the
      resident signs a payment plan and pays its down payment; rent that fell due after the notice date is not part of
      the cure amount. A payment received after a referral never cures the default.
    eligibility:
      - id: notice_on_active_lease
        applies_to: [lease_delinquency_notice]
        kind: state
        condition: "A delinquency notice may be served only on an active lease."
        evidence_fields: [leases.lease_id, leases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
        state_contract:
          field: leases.status
          allowed: [active]
      - id: notice_after_grace
        applies_to: [lease_delinquency_notice]
        kind: time
        condition: "A delinquency notice may be served only when the frozen date is later than the rent due date of the billing period plus the effective grace period."
        evidence_fields: [lease_charges.lease_id, lease_charges.billing_period, lease_charges.charge_date, leases.community_state]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_charges.lease_id, lease_charges.billing_period]
          action_bindings:
            lease_charges.lease_id: lease_id
            lease_charges.billing_period: billing_period
        temporal_basis:
          clock: frozen_time
          anchor_event: the rent due date of the billing period
          anchor_source: lease_charges.charge_date
          relation: not_before
          duration_source: variants.grace_period_days
          unit: calendar_days
          counting_rule: "Grace days are counted as calendar days starting the day after the rent due date, without skipping weekends or holidays, so the first late day is the day after the last grace day."
          boundary: exclusive
    params:
      nonpayment_notice_days_by_state: {CA: 3, WA: 14, CO: 10, TX: 3, GA: 3, AZ: 5}
    measures: [lease_msr_unpaid_period_rent]

  - id: lease_eviction_and_reinstatement
    subject: [lease_eviction_referral, lease_eviction_filing, lease_reinstatement]
    rule: >-
      A file may be referred to eviction counsel only while the lease is in_default.
      A file may be referred only when the frozen date is on or after the cure deadline printed on the delinquency notice plus referral_wait_days.
      The waiting days are counted as calendar days starting the day after the cure deadline, so the referral date is the last waiting day or any later day.
      Referral further requires that the default was not cured, that no signed payment plan is in good standing, and that
      the unpaid rent is at least the floor plan's eviction_referral_min_arrears_rent_multiple times monthly_rent; below
      that amount the lease stays in_default without referral until it is cured. The referral records the unpaid rent as
      amount_demanded and posts the court cost under the lease fee rule, and counsel's filing moves the lease to
      eviction_filed. After filing, the tenancy is reinstated only when the floor plan's
      reinstatement_after_filing_allowed is true, no judgment for possession has been entered, the resident pays the
      entire balance_due (rent, fees, late fees and court costs) in certified_funds_methods, and
      lease_msr_referrals_on_lease is 1; a lease referred a second time is not reinstated and proceeds to judgment.
      Whether counsel may settle a filed case on other terms is a legal decision outside this charter.
    eligibility:
      - id: referral_from_default
        applies_to: [lease_eviction_referral]
        kind: state
        condition: "A file may be referred to eviction counsel only while the lease is in_default."
        evidence_fields: [leases.lease_id, leases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
        state_contract:
          field: leases.status
          allowed: [in_default]
      - id: referral_after_cure_deadline
        applies_to: [lease_eviction_referral]
        kind: time
        condition: "A file may be referred only when the frozen date is on or after the cure deadline printed on the delinquency notice plus referral_wait_days."
        evidence_fields: [lease_notices.notice_id, lease_notices.cure_deadline]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_notices.notice_id]
          action_bindings:
            lease_notices.notice_id: notice_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the cure deadline printed on the delinquency notice
          anchor_source: lease_notices.cure_deadline
          relation: not_before
          duration_source: params.referral_wait_days
          unit: calendar_days
          counting_rule: "The waiting days are counted as calendar days starting the day after the cure deadline, so the referral date is the last waiting day or any later day."
          boundary: inclusive
    params:
      referral_wait_days: 2
      per_tier:
        Studio Residence: {eviction_referral_min_arrears_rent_multiple: "=eviction_referral_min_arrears_rent_multiple", reinstatement_after_filing_allowed: "=reinstatement_after_filing_allowed"}
        One-Bedroom Residence: {eviction_referral_min_arrears_rent_multiple: "=eviction_referral_min_arrears_rent_multiple", reinstatement_after_filing_allowed: "=reinstatement_after_filing_allowed"}
        One-Bedroom Den Residence: {eviction_referral_min_arrears_rent_multiple: "=eviction_referral_min_arrears_rent_multiple", reinstatement_after_filing_allowed: "=reinstatement_after_filing_allowed"}
        Two-Bedroom Residence: {eviction_referral_min_arrears_rent_multiple: "=eviction_referral_min_arrears_rent_multiple", reinstatement_after_filing_allowed: "=reinstatement_after_filing_allowed"}
        Three-Bedroom Residence: {eviction_referral_min_arrears_rent_multiple: "=eviction_referral_min_arrears_rent_multiple", reinstatement_after_filing_allowed: "=reinstatement_after_filing_allowed"}
        Penthouse Residence: {eviction_referral_min_arrears_rent_multiple: "=eviction_referral_min_arrears_rent_multiple", reinstatement_after_filing_allowed: "=reinstatement_after_filing_allowed"}
    formula:
      referral_threshold: eviction_referral_min_arrears_rent_multiple * monthly_rent
    measures: [lease_msr_referrals_on_lease, lease_msr_unpaid_period_rent]

  - id: lease_violation_notices
    subject: [lease_violation_notice]
    rule: >-
      A violation notice may be served only while the lease is active or in_default.
      It is served for one of the covenants in violation_code, one notice per covenant per service date. A guest who
      stays more than the floor plan's guest_max_consecutive_nights consecutive nights is an unauthorized_occupant. The
      cure period is violation_cure_days_by_state for the community's state, the day of service not counted; in CA only
      days that are not Saturdays, Sundays or California court holidays count, elsewhere calendar days. A violation notice
      demands no money (amount_demanded 0.00) and never changes the lease status; damage it describes is charged at
      move-out under the security deposit charter, not on the lease ledger. Whether an uncured violation leads to a
      termination action is decided by community management and counsel, not by resident services.
    eligibility:
      - id: violation_notice_status
        applies_to: [lease_violation_notice]
        kind: state
        condition: "A violation notice may be served only while the lease is active or in_default."
        evidence_fields: [leases.lease_id, leases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
        state_contract:
          field: leases.status
          allowed: [active, in_default]
    params:
      violation_cure_days_by_state: {CA: 3, WA: 10, CO: 10, TX: 10, GA: 7, AZ: 10}
      per_tier:
        Studio Residence: {guest_max_consecutive_nights: "=guest_max_consecutive_nights"}
        One-Bedroom Residence: {guest_max_consecutive_nights: "=guest_max_consecutive_nights"}
        One-Bedroom Den Residence: {guest_max_consecutive_nights: "=guest_max_consecutive_nights"}
        Two-Bedroom Residence: {guest_max_consecutive_nights: "=guest_max_consecutive_nights"}
        Three-Bedroom Residence: {guest_max_consecutive_nights: "=guest_max_consecutive_nights"}
        Penthouse Residence: {guest_max_consecutive_nights: "=guest_max_consecutive_nights"}

  - id: lease_payment_plan
    subject: [lease_payment, lease_default_cure]
    rule: >-
      A payment plan covers the whole balance_due of the lease on the day it is drawn up (arrears_amount) and is
      available only on an active or in_default lease that has not been referred to eviction counsel. The arrears may
      not exceed the floor plan's payment_plan_max_arrears_rent_multiple times monthly_rent. The down payment is at
      least payment_plan_min_down_pct of the arrears, rounded up to the cent; the rest is split into at most
      payment_plan_max_installments equal installments, rounded to the cent with the last installment absorbing the
      difference, the first due payment_plan_installment_interval_days calendar days after the plan is drawn up and each
      later one the same number of days after the previous. A plan is refused when lease_msr_payment_plans_12m already
      equals payment_plans_per_12_months, or when any plan on the lease defaulted within the trailing 365 days.
      A payment plan takes effect only when the resident's signature is recorded on the plan request; an agent's promise or a resident's verbal agreement never activates a plan.
      Signing is the resident's own act. Payments of a plan carry its plan_request_id. A plan stays in good standing
      while every installment is paid by its due date plus payment_plan_missed_installment_grace_days; after that the
      plan is defaulted, the unpaid remainder is simply past due, and the covered periods again count as late from the
      default date. When the last installment is paid the plan is completed. Rent that falls due during the plan is
      not covered by it and must be paid on time.
    eligibility:
      - id: plan_signed
        applies_to: [lease_payment, lease_default_cure]
        kind: authorization
        condition: "A payment plan takes effect only when the resident's signature is recorded on the plan request; an agent's promise or a resident's verbal agreement never activates a plan."
        evidence_fields: [lease_payment_plan_requests.plan_request_id, lease_payment_plan_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [lease_payment_plan_requests.plan_request_id]
          action_bindings:
            lease_payment_plan_requests.plan_request_id: plan_request_id
    params:
      per_tier:
        Studio Residence: {payment_plan_max_installments: "=payment_plan_max_installments", payment_plan_min_down_pct: "=payment_plan_min_down_pct", payment_plan_max_arrears_rent_multiple: "=payment_plan_max_arrears_rent_multiple", payment_plans_per_12_months: "=payment_plans_per_12_months", payment_plan_installment_interval_days: "=payment_plan_installment_interval_days", payment_plan_missed_installment_grace_days: "=payment_plan_missed_installment_grace_days"}
        One-Bedroom Residence: {payment_plan_max_installments: "=payment_plan_max_installments", payment_plan_min_down_pct: "=payment_plan_min_down_pct", payment_plan_max_arrears_rent_multiple: "=payment_plan_max_arrears_rent_multiple", payment_plans_per_12_months: "=payment_plans_per_12_months", payment_plan_installment_interval_days: "=payment_plan_installment_interval_days", payment_plan_missed_installment_grace_days: "=payment_plan_missed_installment_grace_days"}
        One-Bedroom Den Residence: {payment_plan_max_installments: "=payment_plan_max_installments", payment_plan_min_down_pct: "=payment_plan_min_down_pct", payment_plan_max_arrears_rent_multiple: "=payment_plan_max_arrears_rent_multiple", payment_plans_per_12_months: "=payment_plans_per_12_months", payment_plan_installment_interval_days: "=payment_plan_installment_interval_days", payment_plan_missed_installment_grace_days: "=payment_plan_missed_installment_grace_days"}
        Two-Bedroom Residence: {payment_plan_max_installments: "=payment_plan_max_installments", payment_plan_min_down_pct: "=payment_plan_min_down_pct", payment_plan_max_arrears_rent_multiple: "=payment_plan_max_arrears_rent_multiple", payment_plans_per_12_months: "=payment_plans_per_12_months", payment_plan_installment_interval_days: "=payment_plan_installment_interval_days", payment_plan_missed_installment_grace_days: "=payment_plan_missed_installment_grace_days"}
        Three-Bedroom Residence: {payment_plan_max_installments: "=payment_plan_max_installments", payment_plan_min_down_pct: "=payment_plan_min_down_pct", payment_plan_max_arrears_rent_multiple: "=payment_plan_max_arrears_rent_multiple", payment_plans_per_12_months: "=payment_plans_per_12_months", payment_plan_installment_interval_days: "=payment_plan_installment_interval_days", payment_plan_missed_installment_grace_days: "=payment_plan_missed_installment_grace_days"}
        Penthouse Residence: {payment_plan_max_installments: "=payment_plan_max_installments", payment_plan_min_down_pct: "=payment_plan_min_down_pct", payment_plan_max_arrears_rent_multiple: "=payment_plan_max_arrears_rent_multiple", payment_plans_per_12_months: "=payment_plans_per_12_months", payment_plan_installment_interval_days: "=payment_plan_installment_interval_days", payment_plan_missed_installment_grace_days: "=payment_plan_missed_installment_grace_days"}
    formula:
      max_arrears: payment_plan_max_arrears_rent_multiple * monthly_rent
    measures: [lease_msr_payment_plans_12m]

  - id: lease_end_of_tenancy
    subject: [lease_withdrawal, lease_vacate, lease_close]
    rule: >-
      An applicant may withdraw only before taking possession; withdrawal is the applicant's own signed act. The
      application_fee is never refunded, and once the lease is approved the admin_fee is forfeited as well; a
      withdrawal also cancels the pending Lease Term Agreement and the deposit account under their own charters. After
      possession has begun, leaving before the term ends is an early termination or lease break under the Lease Term
      Agreement charter, never a withdrawal. Possession ends — and move-out is recorded with move_out_date — on the day
      all keys and fobs are returned, on the day abandonment is confirmed after the abandonment notice period of the
      state has run, or on the day a writ of possession is executed, whichever comes first. The move-out date starts the
      move-out review of the deposit account and the final billing of every add-on and utility account tied to the lease.
      A lease is closed only after the deposit account for the lease has its final account statement issued.
      Closing never erases a balance: whatever remains on the lease ledger is carried into the final account statement.
    eligibility:
      - id: final_statement_issued
        applies_to: [lease_close]
        kind: state
        condition: "A lease is closed only after the deposit account for the lease has its final account statement issued."
        evidence_fields: [deposit_accounts.lease_id, deposit_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [deposit_accounts.lease_id]
          action_bindings:
            deposit_accounts.lease_id: lease_id
        state_contract:
          field: deposit_accounts.status
          allowed: [disposition_issued, in_collections, closed]
    params:
      abandonment_notice_days_by_state: {CA: 18, WA: 7, CO: 15, TX: 2, GA: 7, AZ: 7}

  - id: lease_rent_and_unit_updates
    subject: [lease_rent_update, lease_unit_transfer]
    rule: >-
      The monthly rent is changed only to the new rent of a recorded rent change whose effective date has arrived.
      A rent change is recorded only under the Lease Term Agreement charter (renewal, month-to-month conversion or
      transfer), and it applies from the first billing period whose due date is on or after its effective date.
      A unit transfer rewrites unit_number, variant_name, monthly_rent and occupants_count only on a transfer signed
      under the Lease Term Agreement charter, and only when the destination floor plan admits the household: its
      occupants_count does not exceed the destination floor plan's max_occupants, and when the destination rent is
      higher than the current monthly_rent the recorded gross_monthly_income is at least the destination floor plan's
      min_income_multiple times the destination rent. The lease keeps its lease_id, ledger, balance and deposit account
      across a transfer, and a transfer never earns a new move-in concession.
    eligibility:
      - id: recorded_rent_change
        applies_to: [lease_rent_update]
        kind: authorization
        condition: "The monthly rent is changed only to the new rent of a recorded rent change whose effective date has arrived."
        evidence_fields: [term_rent_changes.rent_change_id, term_rent_changes.new_rent, term_rent_changes.effective_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [term_rent_changes.rent_change_id]
          action_bindings:
            term_rent_changes.rent_change_id: rent_change_id
    params:
      per_tier:
        Studio Residence: {max_occupants: "=max_occupants", min_income_multiple: "=min_income_multiple"}
        One-Bedroom Residence: {max_occupants: "=max_occupants", min_income_multiple: "=min_income_multiple"}
        One-Bedroom Den Residence: {max_occupants: "=max_occupants", min_income_multiple: "=min_income_multiple"}
        Two-Bedroom Residence: {max_occupants: "=max_occupants", min_income_multiple: "=min_income_multiple"}
        Three-Bedroom Residence: {max_occupants: "=max_occupants", min_income_multiple: "=min_income_multiple"}
        Penthouse Residence: {max_occupants: "=max_occupants", min_income_multiple: "=min_income_multiple"}

# ============================================================================
# extended_policies — rent_ledger_and_delinquency (layered on the base lease charter above)
# ============================================================================
extended_policies:
  - id: lease_ext_employer_discount_credit
    base_policy_refs: [lease_evt_credits_and_waivers, lease_evt_rent_posting]
    overwrite:
      - base_policy: lease_evt_credits_and_waivers
        superseded_clause: >-
          A lease enrolled in rent_discount_program preferred_employer receives each month a preferred_employer_discount
          of preferred_employer_discount_pct times the monthly_rent in force, rounded half up to the cent
        replaced_by: >-
          The preferred employer discount credit is the preferred employer rate times the amount of the period's base
          rent line, rounded half up to the cent.
    trigger: state_due
    subject: [lease_charge_credit]
    computes: amount
    target_tool: post_employer_discount_credit_34aaf7ea
    params:
      renewal_step_three: 0.010
      renewal_step_one: 0.005
      autopay_step_ten: 0.005
      autopay_step_six: 0.0025
      tenure_step_48: 0.005
      tenure_step_36: 0.0025
      bundle_step_full: 0.005
      bundle_step_parking: 0.0025
      late_share_first: 0.75
      late_share_repeat: 0.5
    rule: >-
      A preferred employer discount credit is owed for every billing period of a lease enrolled in
      rent_discount_program preferred_employer whose base rent line carries no preferred_employer_discount credit, and
      it is posted as one preferred_employer_discount credit whose source_charge_id is that base rent line and whose
      billing_period is that period; the period worked out is the latest billing period that carries a base rent line.
      A credit already posted for a billing period is never re-rated, a billing period that carries a rent_concession
      credit receives no preferred employer discount credit, and a lease not enrolled in preferred_employer receives none.
      The preferred employer discount credit is the preferred employer rate times the amount of the period's base rent
      line, rounded half up to the cent. The preferred employer rate is the floor plan's
      preferred_employer_discount_pct. The preferred employer rate is raised by a renewal step for the renewal rent
      changes recorded on the lease's Lease Term Agreements: three or more renewal rent changes on record raise it by
      renewal_step_three, one or two raise it by renewal_step_one, and none leaves it unchanged. The preferred employer
      rate is raised by an autopay step for the autopay drafts received on the lease in the last 12 months, counting
      lease payments made by ach_autopay dated after the same day of the month twelve months before the handling date:
      ten or more drafts raise it by autopay_step_ten, six to nine raise it by autopay_step_six, and fewer leave it
      unchanged. The preferred employer rate is raised by a tenure step for the full calendar months in possession,
      counted from the move-in date to the same day number of a later month: 48 months or more raise it by
      tenure_step_48, 36 to 47 months raise it by tenure_step_36, and fewer leave it unchanged. The preferred employer
      rate is raised by a household bundle step: a household holding an active parking license and an active storage
      rental raises it by bundle_step_full, a household holding an active parking license and no active storage rental
      raises it by bundle_step_parking, and any other household leaves it unchanged. The steps are added to the floor
      plan's rate before the rate is applied to the base rent line, and the discount is rounded once. When the
      period's rent went late the preferred employer discount credit is taken in part: a period that carries an
      initial late fee line while no other billing period of the lease carries one in the last 12 months (initial late
      fee lines dated after the same day of the month twelve months before the handling date) is credited three
      quarters of the discount, rounded down to the cent; a period that carries an initial late fee line while another
      billing period carries one in the last 12 months is credited half of the discount, rounded half up to the cent;
      a period that carries no initial late fee line is credited the whole discount.
    prerequisite: []
    cross_category:
      - category: term
        as: history
        reads: [term_rent_changes.change_reason]
        note: The renewal step is decided from the renewal rent changes recorded on the customer's Lease Term Agreements.
      - category: parking
        as: existence
        reads: [status]
        note: The household bundle step is decided from whether the customer holds an active parking license.
      - category: storage
        as: existence
        reads: [status]
        note: The household bundle step is decided, together with parking, from whether the customer holds an active storage rental.
    compute:
      - period: "LATEST('lease_charges', 'billing_period', date_field='charge_date', charge_code='base_rent')"
      - rent_line: "SUM('lease_charges', 'amount', charge_code='base_rent', billing_period=period)"
      - concession_in_period: "SUM('lease_charges', 'amount', charge_code='rent_concession', billing_period=period)"
      - credit_on_period: "SUM('lease_charges', 'amount', charge_code='preferred_employer_discount', billing_period=period)"
      - renewals: "XCOUNT('term', 'term_rent_changes', change_reason='renewal')"
      - renewal_step: "K('renewal_step_three') if renewals >= 3 else (K('renewal_step_one') if renewals >= 1 else 0)"
      - autopay_drafts: "COUNT('lease_payments', within_months=12, date_field='payment_date', event_type='lease_payment', payment_method='ach_autopay')"
      - autopay_step: "K('autopay_step_ten') if autopay_drafts >= 10 else (K('autopay_step_six') if autopay_drafts >= 6 else 0)"
      - tenure_months: "MONTHS(F('move_in_date'), NOW)"
      - tenure_step: "K('tenure_step_48') if tenure_months >= 48 else (K('tenure_step_36') if tenure_months >= 36 else 0)"
      - has_parking: "EXISTS('parking', status='active')"
      - has_storage: "EXISTS('storage', status='active')"
      - bundle_step: "K('bundle_step_full') if (has_parking and has_storage) else (K('bundle_step_parking') if (has_parking and not has_storage) else 0)"
      - rate: "P('preferred_employer_discount_pct') + renewal_step + autopay_step + tenure_step + bundle_step"
      - discount: "RND(rate * rent_line, 2)"
      - period_late: "COUNT('lease_charges', charge_code='late_fee_initial', billing_period=period)"
      - other_late_12: "COUNT('lease_charges', within_months=12, date_field='charge_date', charge_code='late_fee_initial') - period_late"
      - credit_taken: "int(RND(discount * K('late_share_first') * 100, 6)) / 100 if (period_late >= 1 and other_late_12 == 0) else (RND(discount * K('late_share_repeat'), 2) if (period_late >= 1 and other_late_12 >= 1) else discount)"
      - result: "0 if (F('rent_discount_program') != 'preferred_employer' or concession_in_period > 0 or credit_on_period > 0) else RND(credit_taken, 2)"
    compute_basis:
      period: "the period worked out is the latest billing period that carries a base rent line."
      rent_line: "The preferred employer discount credit is the preferred employer rate times the amount of the period's base rent line, rounded half up to the cent."
      concession_in_period: "a billing period that carries a rent_concession credit receives no preferred employer discount credit"
      credit_on_period: "A credit already posted for a billing period is never re-rated"
      renewals: "The preferred employer rate is raised by a renewal step for the renewal rent changes recorded on the lease's Lease Term Agreements"
      renewal_step: "three or more renewal rent changes on record raise it by renewal_step_three, one or two raise it by renewal_step_one, and none leaves it unchanged."
      autopay_drafts: "counting lease payments made by ach_autopay dated after the same day of the month twelve months before the handling date"
      autopay_step: "ten or more drafts raise it by autopay_step_ten, six to nine raise it by autopay_step_six, and fewer leave it unchanged."
      tenure_months: "for the full calendar months in possession, counted from the move-in date to the same day number of a later month"
      tenure_step: "48 months or more raise it by tenure_step_48, 36 to 47 months raise it by tenure_step_36, and fewer leave it unchanged."
      has_parking: "a household holding an active parking license and an active storage rental raises it by bundle_step_full"
      has_storage: "a household holding an active parking license and no active storage rental raises it by bundle_step_parking"
      bundle_step: "a household holding an active parking license and an active storage rental raises it by bundle_step_full, a household holding an active parking license and no active storage rental raises it by bundle_step_parking, and any other household leaves it unchanged."
      rate: "The steps are added to the floor plan's rate before the rate is applied to the base rent line, and the discount is rounded once."
      discount: "The preferred employer discount credit is the preferred employer rate times the amount of the period's base rent line, rounded half up to the cent."
      period_late: "a period that carries an initial late fee line while no other billing period of the lease carries one in the last 12 months"
      other_late_12: "(initial late fee lines dated after the same day of the month twelve months before the handling date)"
      credit_taken: "is credited three quarters of the discount, rounded down to the cent; a period that carries an initial late fee line while another billing period carries one in the last 12 months is credited half of the discount, rounded half up to the cent; a period that carries no initial late fee line is credited the whole discount."
      result: "a billing period that carries a rent_concession credit receives no preferred employer discount credit, and a lease not enrolled in preferred_employer receives none."
    factors:
      - id: renewal_step
        effect: parameter
        decides: renewal_step
        bindings: [renewals, renewal_step]
        ladder:
          - when: "three or more renewal rent changes recorded on the lease's Lease Term Agreements"
            value: "K('renewal_step_three') added to the preferred employer rate"
          - when: "one or two renewal rent changes recorded"
            value: "K('renewal_step_one') added to the preferred employer rate"
          - when: "otherwise (no renewal rent change recorded)"
            value: "nothing added"
        baseline:
          renewal_step: "0"
        evidence: [cross_category, history]
        cross_difficulty: term
      - id: autopay_step
        effect: parameter
        decides: autopay_step
        bindings: [autopay_drafts, autopay_step]
        ladder:
          - when: "ten or more ach_autopay lease payments dated in the last 12 months"
            value: "K('autopay_step_ten') added to the preferred employer rate"
          - when: "six to nine ach_autopay lease payments dated in the last 12 months"
            value: "K('autopay_step_six') added to the preferred employer rate"
          - when: "otherwise (fewer than six)"
            value: "nothing added"
        baseline:
          autopay_step: "0"
        evidence: [history]
        cross_difficulty: null
      - id: tenure_step
        effect: parameter
        decides: tenure_step
        bindings: [tenure_months, tenure_step]
        ladder:
          - when: "48 or more full calendar months since the move-in date"
            value: "K('tenure_step_48') added to the preferred employer rate"
          - when: "36 to 47 full calendar months since the move-in date"
            value: "K('tenure_step_36') added to the preferred employer rate"
          - when: "otherwise (fewer than 36 months)"
            value: "nothing added"
        baseline:
          tenure_step: "0"
        evidence: [date]
        cross_difficulty: null
      - id: household_bundle_step
        effect: parameter
        decides: bundle_step
        bindings: [has_parking, has_storage, bundle_step]
        ladder:
          - when: "the household holds an active parking license and an active storage rental"
            value: "K('bundle_step_full') added to the preferred employer rate"
          - when: "the household holds an active parking license and no active storage rental"
            value: "K('bundle_step_parking') added to the preferred employer rate"
          - when: "otherwise (no active parking license)"
            value: "nothing added"
        baseline:
          bundle_step: "0"
        evidence: [cross_category]
        cross_difficulty: parking
      - id: late_period_share
        effect: method
        decides: credit_taken
        bindings: [period_late, other_late_12, credit_taken]
        ladder:
          - when: "the period carries an initial late fee line and no other billing period carries one in the last 12 months"
            method: "three quarters of the discount, rounded down to the cent"
          - when: "the period carries an initial late fee line and another billing period carries one in the last 12 months"
            method: "half of the discount, rounded half up to the cent"
          - when: "otherwise (the period carries no initial late fee line)"
            method: "the whole discount, as computed"
        baseline:
          credit_taken: "discount"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The preferred employer discount credit is the preferred employer rate times the amount of the period's base rent
        line, rounded half up to the cent. The preferred employer rate is the floor plan's
        preferred_employer_discount_pct.
      params: [preferred_employer_discount_pct]
    inputs:
      history:
        - {table: lease_charges, aggregate: latest, field: billing_period, filters: {charge_code: base_rent}}
        - {table: lease_charges, aggregate: sum, field: amount, filters: {charge_code: base_rent}}
        - {table: lease_payments, aggregate: count, field: payment_id, within_months: 12, filters: {event_type: lease_payment, payment_method: ach_autopay}}
        - {table: lease_charges, aggregate: count, field: charge_id, within_months: 12, filters: {charge_code: late_fee_initial}}
        - {category: term, table: term_rent_changes, aggregate: count, field: rent_change_id, filters: {change_reason: renewal}}
      cross_category: [term, parking, storage]

  - id: lease_ext_rent_catch_up_payment
    base_policy_refs: [lease_evt_payment_acceptance, lease_payment_plan]
    overwrite:
      - base_policy: lease_evt_payment_acceptance
        superseded_clause: >-
          Every accepted payment is applied to the open charges of the lease in the allocation order of the community's
          state: allocation_order_default, unless allocation_order_overrides names the state.
        replaced_by: >-
          The order in which the period's payments are applied follows the lease's standing: a lease with no returned
          payment in the last 12 months and at least one renewal rent change recorded on its Lease Term Agreements
          applies them to the period's rent first, then to its late fees, then to its recurring fees; a lease with no
          returned payment in the last 12 months and no renewal rent change applies them to its recurring fees first,
          then to its rent, then to its late fees; any other lease applies them in the charter order.
    trigger: on_request
    subject: [lease_payment]
    computes: amount
    target_tool: make_rent_catch_up_payment_381e22a2
    params:
      fee_carry_half: 0.5
      next_window_short: 3
      next_window_standard: 10
    rule: >-
      A catch-up payment is the resident's own one-time lease payment that brings the most recent late billing period
      (the billing period of the latest initial late fee line) current, and its amount is the catch-up amount worked out
      on that period's lines as they stand when the payment is made. The catch-up amount for a late billing period is not
      fixed until that period's base rent line carries the preferred employer discount credit owed on a lease enrolled
      in the preferred employer program. The period's rent is its base rent line less the rent_concession,
      preferred_employer_discount and military_discount credits posted for the period. The period's recurring fees are
      its lease fee lines, and its late fees are its late fee lines less the late_fee_waiver and charge_reversal credits
      posted for the period. The period's payments are the lease payments received during the month ending on the
      handling date (dated after the same day number of the previous month), less the returned payments dated in that month. The period's
      payments are applied in the charter order: to its recurring fees first and its late fees next, and to its rent
      last, except in a community whose state puts rent first (CO), where they go to its rent first, then to its
      recurring fees, then to its late fees. The catch-up amount is the period's rent still unpaid after that
      application, plus all of its recurring fees still unpaid, plus all of its late fees still unpaid, plus the
      monthly_rent in force when the handling date falls on one of the ten days before the next rent due date (the day
      after the period's last day), rounded half up to the cent. The order in which the period's payments are applied
      follows the lease's standing: a lease with no returned payment in the last 12 months and at least one renewal
      rent change recorded on its Lease Term Agreements applies them to the period's rent first, then to its late fees, then to its recurring fees; a lease with no returned payment in the last 12 months and no renewal rent change
      applies them to its recurring fees first, then to its rent, then to its late fees; any other lease applies them in
      the charter order. The share of the period's still-unpaid recurring fees the catch-up amount carries follows the
      autopay record: a lease with ten or more ach_autopay lease payments dated in the last 12 months carries none of
      them, because they ride on the next draft; a lease with six to nine carries half of them, rounded half up to the
      cent; any other lease carries all of them. The part of the period's still-unpaid late fees the catch-up amount
      carries follows the lateness record: a lease on which no other billing period carries an initial late fee line
      dated in the last 12 months carries none of them; a lease on which exactly one other billing period does carries
      its still-unpaid late fees only up to the amount of the period's initial late fee line; any other lease carries
      all of them. Whether the catch-up amount carries the next month's rent follows the tenure: a lease in possession
      for 36 full calendar months or more never carries it; a lease in possession for 12 to 35 full calendar months
      carries it only when the handling date falls on one of the three days before the next rent due date; any other
      lease carries it on one of the ten days before. The last 12 months means dated after the same day of the month
      twelve months before the handling date, and full calendar months are counted from the move-in date to the same
      day number of a later month.
    prerequisite:
      - problem: lease_ext_employer_discount_credit
        kind: value_input
        gate: rent_credits
        form: state
        policy_source: >-
          The catch-up amount for a late billing period is not fixed until that period's base rent line carries the
          preferred employer discount credit owed on a lease enrolled in the preferred employer program.
        condition: >-
          On a lease whose rent_discount_program is preferred_employer, the late billing period's base_rent line is the
          source_charge_id of a preferred_employer_discount credit posted for that billing_period.
        resolved_by: post_employer_discount_credit_34aaf7ea
        effect: >-
          rent_credits rises by the preferred employer discount credit posted for the period, which lowers the period's
          rent and the rent still unpaid that the catch-up amount carries.
    cross_category:
      - category: term
        as: history
        reads: [term_rent_changes.change_reason]
        note: The application order is decided in part from whether a renewal rent change is recorded on the customer's Lease Term Agreements.
    compute:
      - late_period: "LATEST('lease_charges', 'billing_period', date_field='charge_date', charge_code='late_fee_initial')"
      - rent_line: "SUM('lease_charges', 'amount', charge_code='base_rent', billing_period=late_period)"
      - rent_credits: "SUM('lease_charges', 'amount', charge_code='rent_concession', billing_period=late_period) + SUM('lease_charges', 'amount', charge_code='preferred_employer_discount', billing_period=late_period) + SUM('lease_charges', 'amount', charge_code='military_discount', billing_period=late_period)"
      - rent_net: "MX(0, rent_line - rent_credits)"
      - fees: "SUM('lease_charges', 'amount', event_type='lease_fee_charge', billing_period=late_period)"
      - late_net: "MX(0, SUM('lease_charges', 'amount', event_type='lease_late_fee', billing_period=late_period) - SUM('lease_charges', 'amount', charge_code='late_fee_waiver', billing_period=late_period) - SUM('lease_charges', 'amount', charge_code='charge_reversal', billing_period=late_period))"
      - paid: "MX(0, SUM('lease_payments', 'amount', within_months=1, date_field='payment_date', event_type='lease_payment') - SUM('lease_payments', 'amount', within_months=1, date_field='payment_date', event_type='lease_payment_return'))"
      - returns_12: "COUNT('lease_payments', within_months=12, date_field='payment_date', event_type='lease_payment_return')"
      - renewals: "XCOUNT('term', 'term_rent_changes', change_reason='renewal')"
      - to_rent: "MN(paid, rent_net) if (returns_12 == 0 and renewals >= 1) else (MN(MX(0, paid - fees), rent_net) if (returns_12 == 0 and renewals == 0) else (MN(paid, rent_net) if F('community_state') == 'CO' else MN(MX(0, paid - fees - late_net), rent_net)))"
      - to_fees: "MN(MX(0, paid - to_rent - late_net), fees) if (returns_12 == 0 and renewals >= 1) else (MN(paid, fees) if (returns_12 == 0 and renewals == 0) else (MN(MX(0, paid - to_rent), fees) if F('community_state') == 'CO' else MN(paid, fees)))"
      - to_late: "MN(MX(0, paid - to_rent - to_fees), late_net)"
      - rent_open: "RND(MX(0, rent_net - to_rent), 2)"
      - fees_open: "RND(MX(0, fees - to_fees), 2)"
      - late_open: "RND(MX(0, late_net - to_late), 2)"
      - autopay_drafts: "COUNT('lease_payments', within_months=12, date_field='payment_date', event_type='lease_payment', payment_method='ach_autopay')"
      - fee_carry: "0 if autopay_drafts >= 10 else (RND(fees_open * K('fee_carry_half'), 2) if autopay_drafts >= 6 else fees_open)"
      - other_late_12: "COUNT('lease_charges', within_months=12, date_field='charge_date', charge_code='late_fee_initial') - COUNT('lease_charges', charge_code='late_fee_initial', billing_period=late_period)"
      - initial_line: "SUM('lease_charges', 'amount', charge_code='late_fee_initial', billing_period=late_period)"
      - late_carry: "0 if other_late_12 == 0 else (MN(initial_line, late_open) if other_late_12 == 1 else late_open)"
      - tenure_months: "MONTHS(F('move_in_date'), NOW)"
      - next_window: "0 if tenure_months >= 36 else (K('next_window_short') if tenure_months >= 12 else K('next_window_standard'))"
      - due: "LATEST('lease_charges', 'charge_date', date_field='charge_date', charge_code='base_rent', billing_period=late_period)"
      - days_in: "LATEST('lease_charges', 'days_in_period', date_field='charge_date', charge_code='base_rent', billing_period=late_period)"
      - days_before_next: "days_in - DAYS(due, NOW)"
      - next_carry: "F('monthly_rent') if (days_before_next >= 1 and days_before_next <= next_window) else 0"
      - result: "RND(rent_open + fee_carry + late_carry + next_carry, 2)"
    compute_basis:
      late_period: "brings the most recent late billing period (the billing period of the latest initial late fee line) current"
      rent_line: "The period's rent is its base rent line less the rent_concession, preferred_employer_discount and military_discount credits posted for the period."
      rent_credits: "The period's rent is its base rent line less the rent_concession, preferred_employer_discount and military_discount credits posted for the period."
      fees: "The period's recurring fees are its lease fee lines"
      late_net: "its late fees are its late fee lines less the late_fee_waiver and charge_reversal credits posted for the period."
      paid: "The period's payments are the lease payments received during the month ending on the handling date (dated after the same day number of the previous month), less the returned payments dated in that month."
      returns_12: "a lease with no returned payment in the last 12 months and at least one renewal rent change recorded on its Lease Term Agreements"
      renewals: "at least one renewal rent change recorded on its Lease Term Agreements"
      to_rent: "a lease with no returned payment in the last 12 months and at least one renewal rent change recorded on its Lease Term Agreements applies them to the period's rent first, then to its late fees, then to its recurring fees; a lease with no returned payment in the last 12 months and no renewal rent change applies them to its recurring fees first, then to its rent, then to its late fees; any other lease applies them in the charter order."
      to_fees: "The period's payments are applied in the charter order: to its recurring fees first and its late fees next, and to its rent last, except in a community whose state puts rent first (CO), where they go to its rent first, then to its recurring fees, then to its late fees."
      rent_open: "The catch-up amount is the period's rent still unpaid after that application"
      fees_open: "plus all of its recurring fees still unpaid"
      late_open: "plus all of its late fees still unpaid"
      autopay_drafts: "a lease with ten or more ach_autopay lease payments dated in the last 12 months carries none of them"
      fee_carry: "a lease with ten or more ach_autopay lease payments dated in the last 12 months carries none of them, because they ride on the next draft; a lease with six to nine carries half of them, rounded half up to the cent; any other lease carries all of them."
      other_late_12: "a lease on which no other billing period carries an initial late fee line dated in the last 12 months carries none of them"
      initial_line: "carries its still-unpaid late fees only up to the amount of the period's initial late fee line"
      late_carry: "a lease on which no other billing period carries an initial late fee line dated in the last 12 months carries none of them; a lease on which exactly one other billing period does carries its still-unpaid late fees only up to the amount of the period's initial late fee line; any other lease carries all of them."
      tenure_months: "full calendar months are counted from the move-in date to the same day number of a later month."
      next_window: "a lease in possession for 36 full calendar months or more never carries it; a lease in possession for 12 to 35 full calendar months carries it only when the handling date falls on one of the three days before the next rent due date; any other lease carries it on one of the ten days before."
      due: "the next rent due date (the day after the period's last day)"
      days_in: "the next rent due date (the day after the period's last day)"
      next_carry: "plus the monthly_rent in force when the handling date falls on one of the ten days before the next rent due date (the day after the period's last day), rounded half up to the cent."
      result: "The catch-up amount is the period's rent still unpaid after that application, plus all of its recurring fees still unpaid, plus all of its late fees still unpaid, plus the monthly_rent in force when the handling date falls on one of the ten days before the next rent due date (the day after the period's last day), rounded half up to the cent."
    factors:
      - id: application_order
        effect: method
        decides: to_rent
        bindings: [returns_12, renewals, to_rent, to_fees]
        ladder:
          - when: "no returned payment in the last 12 months and at least one renewal rent change recorded on the lease's Lease Term Agreements"
            method: "the period's payments go to its rent first, then its late fees, then its recurring fees"
          - when: "no returned payment in the last 12 months and no renewal rent change recorded"
            method: "the period's payments go to its recurring fees first, then its rent, then its late fees"
          - when: "otherwise (a returned payment in the last 12 months)"
            method: "the charter order: recurring fees, then late fees, then rent (rent first in CO)"
        baseline:
          to_rent: "MN(paid, rent_net) if F('community_state') == 'CO' else MN(MX(0, paid - fees - late_net), rent_net)"
          to_fees: "MN(MX(0, paid - to_rent), fees) if F('community_state') == 'CO' else MN(paid, fees)"
        evidence: [history, cross_category]
        cross_difficulty: term
      - id: recurring_fee_carry
        effect: parameter
        decides: fee_carry
        bindings: [autopay_drafts, fee_carry]
        ladder:
          - when: "ten or more ach_autopay lease payments dated in the last 12 months"
            value: "none of the period's still-unpaid recurring fees"
          - when: "six to nine ach_autopay lease payments dated in the last 12 months"
            value: "half of them, K('fee_carry_half'), rounded half up to the cent"
          - when: "otherwise (fewer than six)"
            value: "all of them"
        baseline:
          fee_carry: "fees_open"
        evidence: [history]
        cross_difficulty: null
      - id: late_fee_carry
        effect: parameter
        decides: late_carry
        bindings: [other_late_12, initial_line, late_carry]
        ladder:
          - when: "no other billing period carries an initial late fee line dated in the last 12 months"
            value: "none of the period's still-unpaid late fees"
          - when: "exactly one other billing period carries an initial late fee line dated in the last 12 months"
            value: "the still-unpaid late fees up to the amount of the period's initial late fee line"
          - when: "otherwise (two or more other late periods)"
            value: "all of them"
        baseline:
          late_carry: "late_open"
        evidence: [history]
        cross_difficulty: null
      - id: next_month_window
        effect: method
        decides: next_window
        bindings: [tenure_months, next_window]
        ladder:
          - when: "36 or more full calendar months in possession"
            method: "the next month's rent is never carried"
          - when: "12 to 35 full calendar months in possession"
            method: "the next month's rent is carried only on the three days before the next rent due date"
          - when: "otherwise (fewer than 12 months)"
            method: "the next month's rent is carried on the ten days before the next rent due date"
        baseline:
          next_window: "K('next_window_standard')"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The period's rent is its base rent line less the rent_concession, preferred_employer_discount and
        military_discount credits posted for the period. The period's recurring fees are its lease fee lines, and its
        late fees are its late fee lines less the late_fee_waiver and charge_reversal credits posted for the period. The
        period's payments are the lease payments received during the month ending on the handling date (dated after
        the same day number of the previous month), less the returned payments dated in that month. The period's payments are applied in the
        charter order: to its recurring fees first and its late fees next, and to its rent last, except in a community
        whose state puts rent first (CO), where they go to its rent first, then to its recurring fees, then to its late
        fees. The catch-up amount is the period's rent still unpaid after that application, plus all of its recurring
        fees still unpaid, plus all of its late fees still unpaid, plus the monthly_rent in force when the handling date
        falls on one of the ten days before the next rent due date (the day after the period's last day), rounded half
        up to the cent.
      params: [next_window_standard]
    inputs:
      history:
        - {table: lease_charges, aggregate: sum, field: amount, filters: {charge_code: base_rent}}
        - {table: lease_charges, aggregate: sum, field: amount, filters: {event_type: lease_fee_charge}}
        - {table: lease_charges, aggregate: sum, field: amount, filters: {event_type: lease_late_fee}}
        - {table: lease_payments, aggregate: sum, field: amount, within_months: 1, filters: {event_type: lease_payment}}
        - {table: lease_payments, aggregate: count, field: payment_id, within_months: 12, filters: {event_type: lease_payment, payment_method: ach_autopay}}
        - {table: lease_charges, aggregate: count, field: charge_id, within_months: 12, filters: {charge_code: late_fee_initial}}
        - {category: term, table: term_rent_changes, aggregate: count, field: rent_change_id, filters: {change_reason: renewal}}
      cross_category: [term]

  - id: lease_ext_courtesy_waiver_amount
    base_policy_refs: [lease_evt_credits_and_waivers, lease_evt_late_fee]
    overwrite:
      - base_policy: lease_evt_credits_and_waivers
        superseded_clause: >-
          A courtesy late_fee_waiver credits every late fee line of one billing period in full, one credit per late fee
          line with that line as source_charge_id.
        replaced_by: >-
          A courtesy waiver is posted as one late_fee_waiver credit whose source_charge_id is the initial late fee line of
          the billing period it covers and whose billing_period is that period; the period it covers is the most recent
          late billing period (the billing period of the latest initial late fee line).
      - base_policy: lease_evt_credits_and_waivers
        superseded_clause: >-
          that the late rent of that period has been paid in full
        replaced_by: >-
          A courtesy waiver on a billing period is granted only after the ledger shows a catch-up payment for that period,
          received on or after its first late day, in the full catch-up amount.
    trigger: on_request
    subject: [lease_charge_credit]
    computes: amount
    target_tool: grant_courtesy_late_fee_waiver_1c994f24
    params:
      first_daily_lines: 5
      waived_high: 250.00
      share_whole: 1.0
      share_over_20: 0.60
      share_11_20: 0.80
      weekday_reference: '2024-01-01'
      term_bonus_long: 0.10
      term_bonus_standard: 0.05
      household_bonus_clear: 0.05
      household_bonus_owing: 0.02
    rule: >-
      A courtesy waiver is posted as one late_fee_waiver credit whose source_charge_id is the initial late fee line of
      the billing period it covers and whose billing_period is that period; the period it covers is the most recent late
      billing period (the billing period of the latest initial late fee line). When that initial late fee line already carries a charge_reversal credit, the courtesy waiver credit is posted instead against the period's earliest daily late fee line that carries no credit, a charge being waived or reversed at most once. Every other condition the credits and
      waivers rule sets for a courtesy waiver stays in force. A courtesy waiver on a billing period is granted only after
      the ledger shows a catch-up payment for that period, received on or after its first late day, in the full catch-up
      amount. The courtesy waiver amount is the period's covered late fees times the waiver share, rounded half up to
      the cent. The period's covered late fees are all of its late fee lines, and the waiver share is the whole of them.
      Which late fee lines the courtesy waiver covers follows the late fees already waived on the lease, the sum of the
      late_fee_waiver credits on record: more than waived_high already waived covers the period's initial late fee
      line only; any smaller amount above zero covers the initial late fee line and the period's first five daily late
      fee lines, each at the average amount of the daily late fee lines posted for the period (all of them when fewer have posted); nothing waived before
      covers every late fee line of the period. The waiver
      share follows how long the rent took to be brought current, counted in calendar days from the start of the
      lateness clock to the date of the latest lease payment received: more than 20 days gives a waiver share of
      share_over_20, 11 to 20 days gives a waiver share of share_11_20, and 10 days or fewer leaves the whole. The
      lateness clock starts on the period's due date, except that when the latest ach_autopay payment return on the lease is dated within the period (on or after its due date and before the next due date) the clock starts on the date of that
      return, and when no such draft was returned and the due date fell on a Saturday or a Sunday the clock starts on
      the following Monday. A lease whose current Lease Term Agreement runs 13 months or longer adds term_bonus_long to
      the waiver share, one whose current term runs 10 to 12 months adds term_bonus_standard, and any shorter current
      term adds nothing. A household whose utility account received twelve or more utility payments with bill dates in
      the last 12 months (after the same day of the month twelve months before the handling date) and shows no utility
      balance due adds household_bonus_clear to the waiver share; a household with twelve or more such payments and a
      utility balance due adds household_bonus_owing; any other household adds nothing. The bonuses are added to the
      waiver share before it is applied, and the waiver share never exceeds the whole.
    prerequisite:
      - problem: lease_ext_rent_catch_up_payment
        kind: value_input
        gate: last_pay
        form: state
        policy_source: >-
          A courtesy waiver on a billing period is granted only after the ledger shows a catch-up payment for that period,
          received on or after its first late day, in the full catch-up amount.
        condition: >-
          A lease_payment dated on or after the late billing period's first late day, in the catch-up amount of that
          period, stands on the lease ledger.
        resolved_by: make_rent_catch_up_payment_381e22a2
        effect: >-
          last_pay moves to the date of the catch-up payment, which sets the days the rent took to be brought current and
          therefore the lateness share of the waiver.
    cross_category:
      - category: term
        as: branch
        reads: [term_months, status]
        note: The term bonus is decided from the length of the customer's current Lease Term Agreement.
      - category: utility
        as: history
        reads: [utility_bills.event_type, utility_bills.bill_date, balance_due, status]
        note: The household bonus is decided from the customer's utility payments over the last 12 months and the utility balance due.
    compute:
      - late_period: "LATEST('lease_charges', 'billing_period', date_field='charge_date', charge_code='late_fee_initial')"
      - initial_amt: "SUM('lease_charges', 'amount', charge_code='late_fee_initial', billing_period=late_period)"
      - daily_count: "COUNT('lease_charges', charge_code='late_fee_daily', billing_period=late_period)"
      - daily_sum: "SUM('lease_charges', 'amount', charge_code='late_fee_daily', billing_period=late_period)"
      - waived_on_record: "SUM('lease_charges', 'amount', charge_code='late_fee_waiver')"
      - covered: "initial_amt if waived_on_record > K('waived_high') else (RND(initial_amt + MN(K('first_daily_lines'), daily_count) * (daily_sum / daily_count if daily_count > 0 else 0), 2) if waived_on_record > 0 else RND(initial_amt + daily_sum, 2))"
      - due: "LATEST('lease_charges', 'charge_date', date_field='charge_date', charge_code='base_rent', billing_period=late_period)"
      - days_in: "LATEST('lease_charges', 'days_in_period', date_field='charge_date', charge_code='base_rent', billing_period=late_period)"
      - ret_date: "LATEST('lease_payments', 'payment_date', date_field='payment_date', event_type='lease_payment_return', payment_method='ach_autopay')"
      - draft_returned: "1 if (ret_date and DAYS(due, ret_date) >= 0 and DAYS(due, ret_date) < days_in) else 0"
      - weekday: "DAYS(K('weekday_reference'), due) % 7"
      - anchor_offset: "DAYS(due, ret_date) if draft_returned == 1 else ((7 - weekday) if weekday >= 5 else 0)"
      - last_pay: "LATEST('lease_payments', 'payment_date', date_field='payment_date', event_type='lease_payment')"
      - days_to_current: "DAYS(due, last_pay) - anchor_offset"
      - lateness_share: "K('share_over_20') if days_to_current > 20 else (K('share_11_20') if days_to_current > 10 else K('share_whole'))"
      - term_months: "CFIELD('term', 'term_months', status='current') or 0"
      - term_bonus: "K('term_bonus_long') if term_months >= 13 else (K('term_bonus_standard') if term_months >= 10 else 0)"
      - util_payments: "XCOUNT('utility', 'utility_bills', within_months=12, date_field='bill_date', event_type='utility_payment')"
      - util_balance: "float(CFIELD('utility', 'balance_due', status='active') or 0)"
      - household_bonus: "K('household_bonus_clear') if (util_payments >= 12 and util_balance == 0) else (K('household_bonus_owing') if (util_payments >= 12 and util_balance > 0) else 0)"
      - share: "MN(K('share_whole'), lateness_share + term_bonus + household_bonus)"
      - result: "RND(covered * share, 2)"
    compute_basis:
      late_period: "the period it covers is the most recent late billing period (the billing period of the latest initial late fee line)."
      initial_amt: "covers the period's initial late fee line only"
      daily_count: "(all of them when fewer have posted)"
      daily_sum: "each at the average amount of the daily late fee lines posted for the period"
      waived_on_record: "Which late fee lines the courtesy waiver covers follows the late fees already waived on the lease, the sum of the late_fee_waiver credits on record"
      covered: "more than waived_high already waived covers the period's initial late fee line only; any smaller amount above zero covers the initial late fee line and the period's first five daily late fee lines, each at the average amount of the daily late fee lines posted for the period (all of them when fewer have posted); nothing waived before covers every late fee line of the period."
      due: "The lateness clock starts on the period's due date"
      days_in: "(on or after its due date and before the next due date)"
      ret_date: "when the latest ach_autopay payment return on the lease is dated within the period (on or after its due date and before the next due date) the clock starts on the date of that return"
      draft_returned: "when the latest ach_autopay payment return on the lease is dated within the period (on or after its due date and before the next due date)"
      weekday: "when no such draft was returned and the due date fell on a Saturday or a Sunday the clock starts on the following Monday."
      anchor_offset: "The lateness clock starts on the period's due date, except that when the latest ach_autopay payment return on the lease is dated within the period (on or after its due date and before the next due date) the clock starts on the date of that return, and when no such draft was returned and the due date fell on a Saturday or a Sunday the clock starts on the following Monday."
      last_pay: "counted in calendar days from the start of the lateness clock to the date of the latest lease payment received"
      days_to_current: "The waiver share follows how long the rent took to be brought current, counted in calendar days from the start of the lateness clock to the date of the latest lease payment received"
      lateness_share: "more than 20 days gives a waiver share of share_over_20, 11 to 20 days gives a waiver share of share_11_20, and 10 days or fewer leaves the whole."
      term_months: "A lease whose current Lease Term Agreement runs 13 months or longer"
      term_bonus: "A lease whose current Lease Term Agreement runs 13 months or longer adds term_bonus_long to the waiver share, one whose current term runs 10 to 12 months adds term_bonus_standard, and any shorter current term adds nothing."
      util_payments: "twelve or more utility payments with bill dates in the last 12 months (after the same day of the month twelve months before the handling date)"
      util_balance: "and shows no utility balance due"
      household_bonus: "A household whose utility account received twelve or more utility payments with bill dates in the last 12 months (after the same day of the month twelve months before the handling date) and shows no utility balance due adds household_bonus_clear to the waiver share; a household with twelve or more such payments and a utility balance due adds household_bonus_owing; any other household adds nothing."
      share: "The bonuses are added to the waiver share before it is applied, and the waiver share never exceeds the whole."
      result: "The courtesy waiver amount is the period's covered late fees times the waiver share, rounded half up to the cent."
    factors:
      - id: covered_lines
        effect: method
        decides: covered
        bindings: [initial_amt, daily_count, daily_sum, waived_on_record, covered]
        ladder:
          - when: "the late_fee_waiver credits on record for the lease sum to more than K('waived_high')"
            method: "only the period's initial late fee line is covered"
          - when: "the late_fee_waiver credits on record sum to more than zero and no more than K('waived_high')"
            method: "the initial late fee line plus the period's first five daily late fee lines are covered"
          - when: "otherwise (nothing waived before)"
            method: "every late fee line of the period is covered"
        baseline:
          covered: "RND(initial_amt + daily_sum, 2)"
        evidence: [history]
        cross_difficulty: null
      - id: lateness_share
        effect: parameter
        decides: lateness_share
        bindings: [last_pay, days_to_current, lateness_share]
        ladder:
          - when: "more than 20 calendar days from the start of the lateness clock to the latest lease payment"
            value: "K('share_over_20')"
          - when: "11 to 20 calendar days"
            value: "K('share_11_20')"
          - when: "otherwise (10 days or fewer)"
            value: "K('share_whole'), the whole"
        baseline:
          lateness_share: "K('share_whole')"
        evidence: [history, date]
        cross_difficulty: null
      - id: lateness_clock_start
        effect: method
        decides: anchor_offset
        bindings: [ret_date, draft_returned, weekday, anchor_offset]
        ladder:
          - when: "the latest ach_autopay payment return on the lease is dated within the period"
            method: "the clock starts on the date of that return"
          - when: "no draft returned within the period and the due date fell on a Saturday or a Sunday"
            method: "the clock starts on the following Monday"
          - when: "otherwise"
            method: "the clock starts on the period's due date"
        baseline:
          anchor_offset: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: term_bonus
        effect: parameter
        decides: term_bonus
        bindings: [term_months, term_bonus]
        ladder:
          - when: "the current Lease Term Agreement runs 13 months or longer"
            value: "K('term_bonus_long') added to the waiver share"
          - when: "the current Lease Term Agreement runs 10 to 12 months"
            value: "K('term_bonus_standard') added to the waiver share"
          - when: "otherwise (a shorter current term)"
            value: "nothing added"
        baseline:
          term_bonus: "0"
        evidence: [cross_category]
        cross_difficulty: term
      - id: household_bonus
        effect: parameter
        decides: household_bonus
        bindings: [util_payments, util_balance, household_bonus]
        ladder:
          - when: "twelve or more utility payments with bill dates in the last 12 months and no utility balance due"
            value: "K('household_bonus_clear') added to the waiver share"
          - when: "twelve or more utility payments with bill dates in the last 12 months and a utility balance due"
            value: "K('household_bonus_owing') added to the waiver share"
          - when: "otherwise (fewer than twelve utility payments)"
            value: "nothing added"
        baseline:
          household_bonus: "0"
        evidence: [cross_category, history]
        cross_difficulty: utility
    baseline:
      rule: >-
        The courtesy waiver amount is the period's covered late fees times the waiver share, rounded half up to the
        cent. The period's covered late fees are all of its late fee lines, and the waiver share is the whole of them.
      params: [share_whole]
    inputs:
      history:
        - {table: lease_charges, aggregate: sum, field: amount, filters: {charge_code: late_fee_initial}}
        - {table: lease_charges, aggregate: sum, field: amount, filters: {charge_code: late_fee_daily}}
        - {table: lease_charges, aggregate: sum, field: amount, filters: {charge_code: late_fee_waiver}}
        - {table: lease_payments, aggregate: latest, field: payment_date, filters: {event_type: lease_payment}}
        - {table: lease_payments, aggregate: latest, field: payment_date, filters: {event_type: lease_payment_return, payment_method: ach_autopay}}
        - {category: utility, table: utility_bills, aggregate: count, field: bill_id, within_months: 12, filters: {event_type: utility_payment}}
      cross_category: [term, utility]

  - id: lease_ext_late_fee_review_reversal
    base_policy_refs: [lease_evt_credits_and_waivers, lease_evt_late_fee]
    overwrite:
      - base_policy: lease_evt_credits_and_waivers
        superseded_clause: >-
          A charge_reversal credits the erroneous part of a charge posted against this charter
        replaced_by: >-
          The late fee review reversal is the late fees posted for the reviewed period (its late fee lines) less the late
          fees the review allows, never below zero, and it is posted as one charge_reversal credit whose source_charge_id
          is the period's initial late fee line and whose billing_period is that period.
      - base_policy: lease_evt_late_fee
        superseded_clause: >-
          The effective grace period is the longer of the floor plan's grace_period_days and the state_min_days_late of
          the community's state.
        replaced_by: >-
          Tenure lengthens the review grace days: a lease in possession for 36 full calendar months or more adds
          grace_extra_long days, one in possession for 24 to 35 full calendar months adds grace_extra_mid days, and a
          shorter tenure adds none.
      - base_policy: lease_evt_late_fee
        superseded_clause: >-
          Grace days are counted as calendar days starting the day after the rent due date, without skipping weekends or
          holidays, so the first late day is the day after the last grace day.
        replaced_by: >-
          The late fee review clock moves: when the latest ach_autopay payment return on the lease is dated within the period (on or
          after its due date and before the next due date) the review clock starts on the date of that return; when no
          such draft was returned and the due date fell on a Saturday or a Sunday the review clock starts on the following
          Monday; otherwise it starts on the due date.
      - base_policy: lease_evt_late_fee
        superseded_clause: >-
          On the first late day one late_fee_initial line posts equal to the greater of late_fee_initial_flat and
          late_fee_initial_pct times the monthly_rent in force on the due date, rounded half up to the cent
        replaced_by: >-
          The review percentage follows the lateness record: a lease with no earlier late period in the review look-back
          and no returned payment in the last 12 months has a review percentage of pct_clean; a lease with exactly one
          earlier late period in the review look-back and no returned payment in the last 12 months has a review
          percentage of pct_one; any other lease keeps the floor plan's late_fee_initial_pct.
      - base_policy: lease_evt_late_fee
        superseded_clause: >-
          For each later calendar day on which the rent is still late one late_fee_daily line of late_fee_daily_amount
          posts, up to late_fee_daily_max_days lines for the period.
        replaced_by: >-
          The accrual end moves: when a payment plan request drawn up on or after the period's due date is awaiting the
          resident's signature (request_status submitted), the accrual end is the date that request was drawn up; when no
          such request is awaiting signature and a delinquency notice was served for the period, the accrual end is the
          notice date; otherwise the accrual end stays the handling date.
      - base_policy: lease_evt_late_fee
        superseded_clause: >-
          the company cap of late_fee_cap_pct_of_rent times monthly_rent; in TX, tx_cap_pct_of_rent times monthly_rent
        replaced_by: >-
          The period cap is late_fee_cap_pct_of_rent times the period's base rent line; in TX it is the lower of that and
          tx_cap_pct times the base rent line, and in CO the lower of that and the greater of co_cap_flat and co_cap_pct
          times the base rent line.
      - base_policy: lease_evt_late_fee
        superseded_clause: >-
          in CO, the greater of co_cap_flat and co_cap_pct_of_past_due times the rent unpaid on the first late day
        replaced_by: >-
          The period cap is late_fee_cap_pct_of_rent times the period's base rent line; in TX it is the lower of that and
          tx_cap_pct times the base rent line, and in CO the lower of that and the greater of co_cap_flat and co_cap_pct
          times the base rent line.
    trigger: state_due
    subject: [lease_charge_credit]
    computes: amount
    target_tool: post_late_fee_review_reversal_dc9bc174
    params:
      wa_min_late_days: 5
      co_min_late_days: 7
      tx_min_late_days: 2
      grace_extra_long: 2
      grace_extra_mid: 1
      weekday_reference: '2024-01-01'
      daily_relief_long: 4.00
      daily_relief_standard: 2.00
      pct_clean: 0.040
      pct_one: 0.045
      lookback_short: 6
      lookback_mid: 9
      lookback_standard: 12
      tx_cap_pct: 0.10
      co_cap_flat: 50.00
      co_cap_pct: 0.05
    rule: >-
      A late fee review is made of the most recent late billing period of a lease (the billing period of the latest
      initial late fee line); earlier periods are not reopened. Late fee lines post on the late fee review schedule this rule sets out: the initial late fee on the first late day of the review at the allowed initial late fee, and one daily late fee line at the allowed daily late fee for each allowed daily late fee line, within the period cap; the review grace days and the first late day of the review are the effective grace period and the first late day that every other rule of this charter reads. The late fee review reversal credits a period whose lines were posted on any other schedule. The late fee review reversal is the late fees posted for
      the reviewed period (its late fee lines) less the late fees the review allows, never below zero, and it is posted
      as one charge_reversal credit whose source_charge_id is the period's initial late fee line and whose billing_period
      is that period. The review allows the allowed initial late fee plus the allowed daily late fee lines times the
      allowed daily late fee, rounded half up to the cent and capped at the period cap. The period cap is
      late_fee_cap_pct_of_rent times the period's base rent line; in TX it is the lower of that and tx_cap_pct times the
      base rent line, and in CO the lower of that and the greater of co_cap_flat and co_cap_pct times the base rent line.
      The late fee review clock starts on the period's due date. The review grace days are the longer of the floor
      plan's grace_period_days and the minimum late days of the community's state (wa_min_late_days in WA,
      co_min_late_days in CO, tx_min_late_days in TX, none in any other state). The first late day of the review is the
      day after the last review grace day, the review grace days being counted as calendar days after the day the late
      fee review clock starts. The allowed initial late fee is the greater of late_fee_initial_flat and the review
      percentage times the period's base rent line, rounded half up to the cent, and it is allowed only when the accrual
      end falls on or after the first late day of the review. The review percentage is the floor plan's
      late_fee_initial_pct. The allowed daily late fee lines are the calendar days after the first late day of the
      review through the accrual end, never fewer than zero and never more than late_fee_daily_max_days. The accrual end
      is the handling date. The allowed daily late fee is the floor plan's late_fee_daily_amount. Tenure lengthens the
      review grace days: a lease in possession for 36 full calendar months or more adds grace_extra_long days, one in
      possession for 24 to 35 full calendar months adds grace_extra_mid days, and a shorter tenure adds none. The late
      fee review clock moves: when the latest ach_autopay payment return on the lease is dated within the period (on or after its
      due date and before the next due date) the review clock starts on the date of that return; when no such draft was
      returned and the due date fell on a Saturday or a Sunday the review clock starts on the following Monday; otherwise
      it starts on the due date. The accrual end moves: when a payment plan request drawn up on or after the period's
      due date is awaiting the resident's signature (request_status submitted), the accrual end is the date that request
      was drawn up; when no such request is awaiting signature and a delinquency notice was served for the period, the
      accrual end is the notice date; otherwise the accrual end stays the handling date. The allowed daily late fee
      follows the current Lease Term Agreement: a term of 13 months or longer takes daily_relief_long off the floor
      plan's late_fee_daily_amount, a term of 10 to 12 months takes daily_relief_standard off it, and a shorter term
      leaves it as it is. The review percentage follows the lateness record: a lease with no earlier late period in the
      review look-back and no returned payment in the last 12 months has a review percentage of pct_clean; a lease with
      exactly one earlier late period in the review look-back and no returned payment in the last 12 months has a review
      percentage of pct_one; any other lease keeps the floor plan's late_fee_initial_pct. An earlier late period is
      another billing period carrying an initial late fee line dated in the review look-back. The review look-back
      follows the renewals recorded on the lease's Lease Term Agreements: two or more renewal rent changes give a
      look-back of the last lookback_short months, exactly one gives the last lookback_mid months, and none gives the
      last lookback_standard months. The last N months means dated after the same day of the month N months before the
      handling date, and full calendar months of tenure are counted from the move-in date to the same day number of a
      later month.
    prerequisite: []
    cross_category:
      - category: term
        as: history
        reads: [term_months, status, term_rent_changes.change_reason]
        note: The allowed daily late fee is decided from the current term's length and the review look-back from the renewal rent changes on the customer's Lease Term Agreements.
    compute:
      - late_period: "LATEST('lease_charges', 'billing_period', date_field='charge_date', charge_code='late_fee_initial')"
      - due: "LATEST('lease_charges', 'charge_date', date_field='charge_date', charge_code='base_rent', billing_period=late_period)"
      - days_in: "LATEST('lease_charges', 'days_in_period', date_field='charge_date', charge_code='base_rent', billing_period=late_period)"
      - rent_line: "SUM('lease_charges', 'amount', charge_code='base_rent', billing_period=late_period)"
      - posted: "SUM('lease_charges', 'amount', event_type='lease_late_fee', billing_period=late_period)"
      - state_min: "K('wa_min_late_days') if F('community_state') == 'WA' else (K('co_min_late_days') if F('community_state') == 'CO' else (K('tx_min_late_days') if F('community_state') == 'TX' else 0))"
      - base_grace: "MX(P('grace_period_days'), state_min)"
      - tenure_months: "MONTHS(F('move_in_date'), NOW)"
      - grace_extra: "K('grace_extra_long') if tenure_months >= 36 else (K('grace_extra_mid') if tenure_months >= 24 else 0)"
      - ret_date: "LATEST('lease_payments', 'payment_date', date_field='payment_date', event_type='lease_payment_return', payment_method='ach_autopay')"
      - draft_returned: "1 if (ret_date and DAYS(due, ret_date) >= 0 and DAYS(due, ret_date) < days_in) else 0"
      - weekday: "DAYS(K('weekday_reference'), due) % 7"
      - clock_offset: "DAYS(due, ret_date) if draft_returned == 1 else ((7 - weekday) if weekday >= 5 else 0)"
      - first_late: "clock_offset + base_grace + grace_extra + 1"
      - plan_drawn: "LATEST('lease_payment_plan_requests', 'created_at', date_field='created_at', request_status='submitted')"
      - notice_date: "LATEST('lease_notices', 'notice_date', date_field='notice_date', event_type='lease_delinquency_notice', billing_period=late_period)"
      - accrual_end: "DAYS(due, plan_drawn) if (plan_drawn and DAYS(due, plan_drawn) >= 0) else (DAYS(due, notice_date) if notice_date else DAYS(due, NOW))"
      - daily_lines: "MX(0, MN(P('late_fee_daily_max_days'), accrual_end - first_late))"
      - term_months: "CFIELD('term', 'term_months', status='current') or 0"
      - daily_fee: "P('late_fee_daily_amount') - K('daily_relief_long') if term_months >= 13 else (P('late_fee_daily_amount') - K('daily_relief_standard') if term_months >= 10 else P('late_fee_daily_amount'))"
      - renewals: "XCOUNT('term', 'term_rent_changes', change_reason='renewal')"
      - lookback: "K('lookback_short') if renewals >= 2 else (K('lookback_mid') if renewals == 1 else K('lookback_standard'))"
      - earlier_late: "MX(0, COUNT('lease_charges', within_months=lookback, date_field='charge_date', charge_code='late_fee_initial') - COUNT('lease_charges', charge_code='late_fee_initial', billing_period=late_period))"
      - returns_12: "COUNT('lease_payments', within_months=12, date_field='payment_date', event_type='lease_payment_return')"
      - review_pct: "K('pct_clean') if (earlier_late == 0 and returns_12 == 0) else (K('pct_one') if (earlier_late == 1 and returns_12 == 0) else P('late_fee_initial_pct'))"
      - initial_allowed: "MX(P('late_fee_initial_flat'), RND(review_pct * rent_line, 2)) if accrual_end >= first_late else 0"
      - period_cap: "MN(RND(P('late_fee_cap_pct_of_rent') * rent_line, 2), RND(K('tx_cap_pct') * rent_line, 2)) if F('community_state') == 'TX' else (MN(RND(P('late_fee_cap_pct_of_rent') * rent_line, 2), MX(K('co_cap_flat'), RND(K('co_cap_pct') * rent_line, 2))) if F('community_state') == 'CO' else RND(P('late_fee_cap_pct_of_rent') * rent_line, 2))"
      - allowed: "MN(period_cap, RND(initial_allowed + daily_lines * daily_fee, 2))"
      - result: "RND(MX(0, posted - allowed), 2)"
    compute_basis:
      late_period: "A late fee review is made of the most recent late billing period of a lease (the billing period of the latest initial late fee line); earlier periods are not reopened."
      due: "The late fee review clock starts on the period's due date."
      days_in: "(on or after its due date and before the next due date)"
      rent_line: "the greater of late_fee_initial_flat and the review percentage times the period's base rent line, rounded half up to the cent"
      posted: "The late fee review reversal is the late fees posted for the reviewed period (its late fee lines) less the late fees the review allows, never below zero"
      state_min: "The review grace days are the longer of the floor plan's grace_period_days and the minimum late days of the community's state (wa_min_late_days in WA, co_min_late_days in CO, tx_min_late_days in TX, none in any other state)."
      base_grace: "The review grace days are the longer of the floor plan's grace_period_days and the minimum late days of the community's state"
      tenure_months: "full calendar months of tenure are counted from the move-in date to the same day number of a later month."
      grace_extra: "Tenure lengthens the review grace days: a lease in possession for 36 full calendar months or more adds grace_extra_long days, one in possession for 24 to 35 full calendar months adds grace_extra_mid days, and a shorter tenure adds none."
      ret_date: "when the latest ach_autopay payment return on the lease is dated within the period (on or after its due date and before the next due date) the review clock starts on the date of that return"
      draft_returned: "when the latest ach_autopay payment return on the lease is dated within the period (on or after its due date and before the next due date)"
      weekday: "when no such draft was returned and the due date fell on a Saturday or a Sunday the review clock starts on the following Monday"
      clock_offset: "The late fee review clock moves: when the latest ach_autopay payment return on the lease is dated within the period (on or after its due date and before the next due date) the review clock starts on the date of that return; when no such draft was returned and the due date fell on a Saturday or a Sunday the review clock starts on the following Monday; otherwise it starts on the due date."
      first_late: "The first late day of the review is the day after the last review grace day, the review grace days being counted as calendar days after the day the late fee review clock starts."
      plan_drawn: "when a payment plan request drawn up on or after the period's due date is awaiting the resident's signature (request_status submitted), the accrual end is the date that request was drawn up"
      notice_date: "when no such request is awaiting signature and a delinquency notice was served for the period, the accrual end is the notice date"
      accrual_end: "The accrual end moves: when a payment plan request drawn up on or after the period's due date is awaiting the resident's signature (request_status submitted), the accrual end is the date that request was drawn up; when no such request is awaiting signature and a delinquency notice was served for the period, the accrual end is the notice date; otherwise the accrual end stays the handling date."
      daily_lines: "The allowed daily late fee lines are the calendar days after the first late day of the review through the accrual end, never fewer than zero and never more than late_fee_daily_max_days."
      term_months: "The allowed daily late fee follows the current Lease Term Agreement"
      daily_fee: "a term of 13 months or longer takes daily_relief_long off the floor plan's late_fee_daily_amount, a term of 10 to 12 months takes daily_relief_standard off it, and a shorter term leaves it as it is."
      renewals: "The review look-back follows the renewals recorded on the lease's Lease Term Agreements"
      lookback: "two or more renewal rent changes give a look-back of the last lookback_short months, exactly one gives the last lookback_mid months, and none gives the last lookback_standard months."
      earlier_late: "An earlier late period is another billing period carrying an initial late fee line dated in the review look-back."
      returns_12: "and no returned payment in the last 12 months has a review percentage of pct_clean"
      review_pct: "The review percentage follows the lateness record: a lease with no earlier late period in the review look-back and no returned payment in the last 12 months has a review percentage of pct_clean; a lease with exactly one earlier late period in the review look-back and no returned payment in the last 12 months has a review percentage of pct_one; any other lease keeps the floor plan's late_fee_initial_pct."
      initial_allowed: "The allowed initial late fee is the greater of late_fee_initial_flat and the review percentage times the period's base rent line, rounded half up to the cent, and it is allowed only when the accrual end falls on or after the first late day of the review."
      period_cap: "The period cap is late_fee_cap_pct_of_rent times the period's base rent line; in TX it is the lower of that and tx_cap_pct times the base rent line, and in CO the lower of that and the greater of co_cap_flat and co_cap_pct times the base rent line."
      allowed: "The review allows the allowed initial late fee plus the allowed daily late fee lines times the allowed daily late fee, rounded half up to the cent and capped at the period cap."
      result: "The late fee review reversal is the late fees posted for the reviewed period (its late fee lines) less the late fees the review allows, never below zero"
    factors:
      - id: review_grace_extension
        effect: parameter
        decides: grace_extra
        bindings: [tenure_months, grace_extra]
        ladder:
          - when: "36 or more full calendar months in possession"
            value: "K('grace_extra_long') days added to the review grace days"
          - when: "24 to 35 full calendar months in possession"
            value: "K('grace_extra_mid') day added to the review grace days"
          - when: "otherwise (fewer than 24 months)"
            value: "no day added"
        baseline:
          grace_extra: "0"
        evidence: [date]
        cross_difficulty: null
      - id: review_clock_start
        effect: method
        decides: clock_offset
        bindings: [ret_date, draft_returned, weekday, clock_offset]
        ladder:
          - when: "the latest ach_autopay payment return on the lease is dated within the period"
            method: "the review clock starts on the date of that return"
          - when: "no draft returned within the period and the due date fell on a Saturday or a Sunday"
            method: "the review clock starts on the following Monday"
          - when: "otherwise"
            method: "the review clock starts on the due date"
        baseline:
          clock_offset: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: accrual_end
        effect: method
        decides: accrual_end
        bindings: [plan_drawn, notice_date, accrual_end]
        ladder:
          - when: "a payment plan request drawn up on or after the period's due date is awaiting the resident's signature"
            method: "daily late fee lines are allowed through the date the request was drawn up"
          - when: "no such request, and a delinquency notice was served for the period"
            method: "daily late fee lines are allowed through the notice date"
          - when: "otherwise"
            method: "daily late fee lines are allowed through the handling date"
        baseline:
          accrual_end: "DAYS(due, NOW)"
        evidence: [history, date]
        cross_difficulty: null
      - id: term_daily_relief
        effect: parameter
        decides: daily_fee
        bindings: [term_months, daily_fee]
        ladder:
          - when: "the current Lease Term Agreement runs 13 months or longer"
            value: "late_fee_daily_amount less K('daily_relief_long')"
          - when: "the current Lease Term Agreement runs 10 to 12 months"
            value: "late_fee_daily_amount less K('daily_relief_standard')"
          - when: "otherwise (a shorter term)"
            value: "P('late_fee_daily_amount')"
        baseline:
          daily_fee: "P('late_fee_daily_amount')"
        evidence: [cross_category]
        cross_difficulty: term
      - id: review_percentage
        effect: parameter
        decides: review_pct
        bindings: [earlier_late, returns_12, review_pct]
        ladder:
          - when: "no earlier late period in the review look-back and no returned payment in the last 12 months"
            value: "K('pct_clean')"
          - when: "exactly one earlier late period in the review look-back and no returned payment in the last 12 months"
            value: "K('pct_one')"
          - when: "otherwise (two or more earlier late periods, or a returned payment)"
            value: "P('late_fee_initial_pct')"
        baseline:
          review_pct: "P('late_fee_initial_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: review_look_back
        effect: method
        decides: lookback
        bindings: [renewals, lookback]
        ladder:
          - when: "two or more renewal rent changes recorded on the lease's Lease Term Agreements"
            method: "earlier late periods are counted over the last K('lookback_short') months"
          - when: "exactly one renewal rent change recorded"
            method: "earlier late periods are counted over the last K('lookback_mid') months"
          - when: "otherwise (no renewal rent change)"
            method: "earlier late periods are counted over the last K('lookback_standard') months"
        baseline:
          lookback: "K('lookback_standard')"
        evidence: [cross_category, history]
        cross_difficulty: term
    baseline:
      rule: >-
        The late fee review clock starts on the period's due date. The review grace days are the longer of the floor
        plan's grace_period_days and the minimum late days of the community's state (wa_min_late_days in WA,
        co_min_late_days in CO, tx_min_late_days in TX, none in any other state). The first late day of the review is
        the day after the last review grace day, the review grace days being counted as calendar days after the day the
        late fee review clock starts. The allowed initial late fee is the greater of late_fee_initial_flat and the review
        percentage times the period's base rent line, rounded half up to the cent, and it is allowed only when the
        accrual end falls on or after the first late day of the review. The review percentage is the floor plan's
        late_fee_initial_pct. The allowed daily late fee lines are the calendar days after the first late day of the
        review through the accrual end, never fewer than zero and never more than late_fee_daily_max_days. The accrual
        end is the handling date. The allowed daily late fee is the floor plan's late_fee_daily_amount. The review
        allows the allowed initial late fee plus the allowed daily late fee lines times the allowed daily late fee,
        rounded half up to the cent and capped at the period cap. The period cap is late_fee_cap_pct_of_rent times the
        period's base rent line; in TX it is the lower of that and tx_cap_pct times the base rent line, and in CO the
        lower of that and the greater of co_cap_flat and co_cap_pct times the base rent line.
      params: [grace_period_days, wa_min_late_days, co_min_late_days, tx_min_late_days, late_fee_initial_flat, late_fee_initial_pct, late_fee_daily_amount, late_fee_daily_max_days, late_fee_cap_pct_of_rent, tx_cap_pct, co_cap_flat, co_cap_pct]
    inputs:
      history:
        - {table: lease_charges, aggregate: sum, field: amount, filters: {event_type: lease_late_fee}}
        - {table: lease_charges, aggregate: count, field: charge_id, within_months: 6, filters: {charge_code: late_fee_initial}}
        - {table: lease_payments, aggregate: count, field: payment_id, within_months: 12, filters: {event_type: lease_payment_return}}
        - {table: lease_payment_plan_requests, aggregate: latest, field: created_at, filters: {request_status: submitted}}
        - {table: lease_notices, aggregate: latest, field: notice_date, filters: {event_type: lease_delinquency_notice}}
        - {category: term, table: term_rent_changes, aggregate: count, field: rent_change_id, filters: {change_reason: renewal}}
      cross_category: [term]

  - id: lease_ext_payment_plan_terms
    base_policy_refs: [lease_evt_payment_acceptance, lease_payment_plan]
    overwrite:
      - base_policy: lease_payment_plan
        superseded_clause: >-
          A payment plan covers the whole balance_due of the lease on the day it is drawn up (arrears_amount)
        replaced_by: >-
          The plan arrears are the whole ledger balance on the day the resident signs, and the figures of a plan request
          drawn up earlier are worked out again on that day.
      - base_policy: lease_payment_plan
        superseded_clause: >-
          the first due payment_plan_installment_interval_days calendar days after the plan is drawn up
        replaced_by: >-
          The rest of the plan arrears is split into the floor plan's payment_plan_max_installments equal installments
          unless the resident asks for fewer, each rounded to the cent with the last absorbing the difference, the first
          due payment_plan_installment_interval_days calendar days after the day of signing, not after the day the request
          was drawn up, and each later one the same number of days after the previous.
      - base_policy: lease_payment_plan
        superseded_clause: >-
          The down payment is at least payment_plan_min_down_pct of the arrears, rounded up to the cent
        replaced_by: >-
          The plan down payment is the plan percentage times the plan arrears left to spread, rounded up to the cent,
          plus the charges paid up front; the plan arrears left to spread are the plan arrears less the charges paid up
          front.
    trigger: on_request
    subject: [lease_payment]
    computes: down_payment_amount
    target_tool: sign_payment_plan_b63c5de9
    params:
      wa_min_late_days: 5
      co_min_late_days: 7
      tx_min_late_days: 2
      fee_window_days: 10
      completed_plan_credit: 0.10
      defaulted_plan_loading: 0.10
      size_loading_high: 0.05
      size_loading_mid: 0.02
      term_loading_near: 0.10
      term_loading_mid: 0.05
      term_near_days: 120
      term_mid_days: 240
      term_far_days: 9999
      tenure_credit_long: 0.04
      tenure_credit_mid: 0.02
    rule: >-
      A payment plan request drawn up for a lease and awaiting the resident's signature is signed by the resident in
      person, and the signature records on the request the figures fixed on the day of signing: the arrears, the down
      payment, the number of installments, the installment amount and the first installment date. The figures of a
      payment plan are fixed only after the most recent late billing period's late fees stand at the amount the late fee
      review allows, any excess carrying its charge reversal credit on that period's initial late fee line. Every other condition of the payment plan rule stays in force. Signing records the figures only; paying the down payment is the resident's own later act, as a plan payment carrying the plan's reference, and is not part of signing. The ledger balance is the lease's rent, fee, late fee and returned payment fee
      lines less its credit lines, less its payments, plus its returned payments. The plan arrears are the whole ledger
      balance on the day the resident signs, and the figures of a plan request drawn up earlier are worked out again on
      that day. The plan percentage is the floor plan's payment_plan_min_down_pct. Nothing is paid up front. The plan
      down payment is the plan percentage times the plan arrears left to spread, rounded up to the cent, plus the
      charges paid up front; the plan arrears left to spread are the plan arrears less the charges paid up front. The
      rest of the plan arrears is split into the floor plan's payment_plan_max_installments equal installments unless the
      resident asks for fewer, each rounded to the cent with the last absorbing the difference, the first due payment_plan_installment_interval_days calendar days after the day of signing, not after the day the request was drawn up, and each later one the same number of days after the previous. Which charges the plan arrears take
      in follows the day of signing, counted in calendar days from the due date of the current month (the latest billing
      period carrying a base rent line): a resident who signs within the plan grace days (the longer of the floor plan's
      grace_period_days and the minimum late days of the community's state, wa_min_late_days in WA, co_min_late_days in
      CO, tx_min_late_days in TX, none in any other state) leaves the current month's base rent line and recurring fee
      lines out of the plan arrears, because they are not yet past due; a resident who signs after the plan grace days
      but no more than fee_window_days after the due date leaves only the current month's recurring fee lines out; any
      later signature takes in the whole ledger balance. The plan percentage follows the payment plan history of the
      lease: a lease with a completed payment plan on record and no defaulted plan on record has a plan percentage of the floor plan's payment_plan_min_down_pct less completed_plan_credit; a lease with a defaulted plan on record has a plan percentage of payment_plan_min_down_pct plus defaulted_plan_loading; any other lease keeps the floor plan's payment_plan_min_down_pct. The plan percentage rises with the size of the plan
      arrears against the current month's base rent line: plan arrears above one month's rent add size_loading_high,
      plan arrears above half a month's rent add size_loading_mid, and smaller plan arrears add nothing. The plan
      percentage rises as the current Lease Term Agreement nears its end: a term ending no more than term_near_days
      after the day of signing adds term_loading_near, one ending no more than term_mid_days after it adds
      term_loading_mid, and one ending later adds nothing. The plan percentage falls with tenure: a lease in possession
      for 36 full calendar months or more takes tenure_credit_long off it, one in possession for 24 to 35 full calendar
      months takes tenure_credit_mid off it, and a shorter tenure takes nothing off. The loadings are added to the plan
      percentage and the tenure credit subtracted before it is applied, and the plan percentage never falls below zero.
      Some charges are paid up front in full with the down payment rather than spread: a lease with a returned payment
      in the last 12 months pays up front the returned payment fees dated in the last 12 months and the late fees of the
      most recent late billing period; a lease with no returned payment in the last 12 months and initial late fee lines
      in two or more billing periods in the last 12 months pays up front the late fees of the most recent late billing
      period; any other lease pays nothing up front. The late fees of a period are its late fee lines less the
      charge_reversal and late_fee_waiver credits posted for that period. The last 12 months means dated after the same
      day of the month twelve months before the day of signing, and full calendar months of tenure are counted from the
      move-in date to the same day number of a later month.
    prerequisite:
      - problem: lease_ext_late_fee_review_reversal
        kind: value_input
        gate: balance
        form: state
        policy_source: >-
          The figures of a payment plan are fixed only after the most recent late billing period's late fees stand at the
          amount the late fee review allows, any excess carrying its charge reversal credit on that period's initial late
          fee line.
        condition: >-
          The late fee lines of the most recent late billing period, less the charge_reversal credit whose source_charge_id
          is that period's initial late fee line, equal the late fees the late fee review allows for the period.
        resolved_by: post_late_fee_review_reversal_dc9bc174
        effect: >-
          balance falls by the charge reversal credited, and the late fees of the most recent late billing period paid up
          front fall by the same amount, lowering the plan down payment.
    cross_category:
      - category: term
        as: branch
        reads: [term_end_date, status]
        note: The term loading of the plan percentage is decided from how soon the customer's current Lease Term Agreement ends.
    compute:
      - rent_sum: "SUM('lease_charges', 'amount', event_type='lease_rent_charge')"
      - fee_sum: "SUM('lease_charges', 'amount', event_type='lease_fee_charge')"
      - late_sum: "SUM('lease_charges', 'amount', event_type='lease_late_fee')"
      - nsf_sum: "SUM('lease_charges', 'amount', event_type='lease_nsf_fee')"
      - credit_sum: "SUM('lease_charges', 'amount', event_type='lease_charge_credit')"
      - paid_sum: "SUM('lease_payments', 'amount', event_type='lease_payment')"
      - returned_sum: "SUM('lease_payments', 'amount', event_type='lease_payment_return')"
      - balance: "RND(rent_sum + fee_sum + late_sum + nsf_sum - credit_sum - paid_sum + returned_sum, 2)"
      - cur_period: "LATEST('lease_charges', 'billing_period', date_field='charge_date', charge_code='base_rent')"
      - cur_due: "LATEST('lease_charges', 'charge_date', date_field='charge_date', charge_code='base_rent', billing_period=cur_period)"
      - cur_rent: "SUM('lease_charges', 'amount', charge_code='base_rent', billing_period=cur_period)"
      - cur_fees: "SUM('lease_charges', 'amount', event_type='lease_fee_charge', billing_period=cur_period)"
      - state_min: "K('wa_min_late_days') if F('community_state') == 'WA' else (K('co_min_late_days') if F('community_state') == 'CO' else (K('tx_min_late_days') if F('community_state') == 'TX' else 0))"
      - plan_grace: "MX(P('grace_period_days'), state_min)"
      - days_since_due: "DAYS(cur_due, NOW)"
      - left_out: "RND(cur_rent + cur_fees, 2) if days_since_due <= plan_grace else (cur_fees if days_since_due <= K('fee_window_days') else 0)"
      - plan_arrears: "RND(MX(0, balance - left_out), 2)"
      - n_completed: "COUNT('lease_payment_plan_requests', request_status='completed')"
      - n_defaulted: "COUNT('lease_payment_plan_requests', request_status='defaulted')"
      - base_pct: "P('payment_plan_min_down_pct') - K('completed_plan_credit') if (n_completed >= 1 and n_defaulted == 0) else (P('payment_plan_min_down_pct') + K('defaulted_plan_loading') if n_defaulted >= 1 else P('payment_plan_min_down_pct'))"
      - size_ratio: "plan_arrears / SUM('lease_charges', 'amount', charge_code='base_rent', billing_period=cur_period)"
      - size_loading: "K('size_loading_high') if size_ratio > 1 else (K('size_loading_mid') if size_ratio > 0.5 else 0)"
      - term_end: "CFIELD('term', 'term_end_date', status='current')"
      - days_to_term_end: "DAYS(NOW, term_end) if term_end else K('term_far_days')"
      - term_loading: "K('term_loading_near') if days_to_term_end <= K('term_near_days') else (K('term_loading_mid') if days_to_term_end <= K('term_mid_days') else 0)"
      - tenure_months: "MONTHS(F('move_in_date'), NOW)"
      - tenure_credit: "K('tenure_credit_long') if tenure_months >= 36 else (K('tenure_credit_mid') if tenure_months >= 24 else 0)"
      - plan_pct: "MX(0, base_pct + size_loading + term_loading - tenure_credit)"
      - returns_12: "COUNT('lease_payments', within_months=12, date_field='payment_date', event_type='lease_payment_return')"
      - late_periods_12: "COUNT('lease_charges', within_months=12, date_field='charge_date', charge_code='late_fee_initial')"
      - late_period: "LATEST('lease_charges', 'billing_period', date_field='charge_date', charge_code='late_fee_initial')"
      - late_fees_latest: "RND(MX(0, SUM('lease_charges', 'amount', event_type='lease_late_fee', billing_period=late_period) - SUM('lease_charges', 'amount', charge_code='charge_reversal', billing_period=late_period) - SUM('lease_charges', 'amount', charge_code='late_fee_waiver', billing_period=late_period)), 2)"
      - nsf_12: "SUM('lease_charges', 'amount', within_months=12, date_field='charge_date', event_type='lease_nsf_fee')"
      - upfront: "RND(nsf_12 + late_fees_latest, 2) if returns_12 >= 1 else (late_fees_latest if late_periods_12 >= 2 else 0)"
      - spread: "RND(MX(0, plan_arrears - upfront), 2)"
      - result: "RND(-((-RND(plan_pct * spread * 100, 6)) // 1) / 100 + upfront, 2)"
    compute_basis:
      rent_sum: "The ledger balance is the lease's rent, fee, late fee and returned payment fee lines less its credit lines, less its payments, plus its returned payments."
      fee_sum: "The ledger balance is the lease's rent, fee, late fee and returned payment fee lines"
      late_sum: "The ledger balance is the lease's rent, fee, late fee and returned payment fee lines"
      nsf_sum: "The ledger balance is the lease's rent, fee, late fee and returned payment fee lines"
      credit_sum: "less its credit lines"
      paid_sum: "less its payments"
      returned_sum: "plus its returned payments."
      balance: "The ledger balance is the lease's rent, fee, late fee and returned payment fee lines less its credit lines, less its payments, plus its returned payments."
      cur_period: "the current month (the latest billing period carrying a base rent line)"
      cur_due: "counted in calendar days from the due date of the current month (the latest billing period carrying a base rent line)"
      cur_rent: "leaves the current month's base rent line and recurring fee lines out of the plan arrears"
      cur_fees: "leaves only the current month's recurring fee lines out"
      state_min: "the minimum late days of the community's state, wa_min_late_days in WA, co_min_late_days in CO, tx_min_late_days in TX, none in any other state"
      plan_grace: "the plan grace days (the longer of the floor plan's grace_period_days and the minimum late days of the community's state"
      days_since_due: "Which charges the plan arrears take in follows the day of signing, counted in calendar days from the due date of the current month"
      left_out: "a resident who signs within the plan grace days (the longer of the floor plan's grace_period_days and the minimum late days of the community's state, wa_min_late_days in WA, co_min_late_days in CO, tx_min_late_days in TX, none in any other state) leaves the current month's base rent line and recurring fee lines out of the plan arrears, because they are not yet past due; a resident who signs after the plan grace days but no more than fee_window_days after the due date leaves only the current month's recurring fee lines out; any later signature takes in the whole ledger balance."
      plan_arrears: "The plan arrears are the whole ledger balance on the day the resident signs, and the figures of a plan request drawn up earlier are worked out again on that day."
      n_completed: "a lease with a completed payment plan on record and no defaulted plan on record has a plan percentage of the floor plan's payment_plan_min_down_pct less completed_plan_credit"
      n_defaulted: "a lease with a defaulted plan on record has a plan percentage of payment_plan_min_down_pct plus defaulted_plan_loading"
      base_pct: "The plan percentage follows the payment plan history of the lease: a lease with a completed payment plan on record and no defaulted plan on record has a plan percentage of the floor plan's payment_plan_min_down_pct less completed_plan_credit; a lease with a defaulted plan on record has a plan percentage of payment_plan_min_down_pct plus defaulted_plan_loading; any other lease keeps the floor plan's payment_plan_min_down_pct."
      size_ratio: "The plan percentage rises with the size of the plan arrears against the current month's base rent line"
      size_loading: "plan arrears above one month's rent add size_loading_high, plan arrears above half a month's rent add size_loading_mid, and smaller plan arrears add nothing."
      term_end: "The plan percentage rises as the current Lease Term Agreement nears its end"
      days_to_term_end: "a term ending no more than term_near_days after the day of signing adds term_loading_near"
      term_loading: "a term ending no more than term_near_days after the day of signing adds term_loading_near, one ending no more than term_mid_days after it adds term_loading_mid, and one ending later adds nothing."
      tenure_months: "full calendar months of tenure are counted from the move-in date to the same day number of a later month."
      tenure_credit: "The plan percentage falls with tenure: a lease in possession for 36 full calendar months or more takes tenure_credit_long off it, one in possession for 24 to 35 full calendar months takes tenure_credit_mid off it, and a shorter tenure takes nothing off."
      plan_pct: "The loadings are added to the plan percentage and the tenure credit subtracted before it is applied, and the plan percentage never falls below zero."
      returns_12: "a lease with a returned payment in the last 12 months pays up front the returned payment fees dated in the last 12 months and the late fees of the most recent late billing period"
      late_periods_12: "a lease with no returned payment in the last 12 months and initial late fee lines in two or more billing periods in the last 12 months pays up front the late fees of the most recent late billing period"
      late_period: "the late fees of the most recent late billing period"
      late_fees_latest: "The late fees of a period are its late fee lines less the charge_reversal and late_fee_waiver credits posted for that period."
      nsf_12: "the returned payment fees dated in the last 12 months"
      upfront: "a lease with a returned payment in the last 12 months pays up front the returned payment fees dated in the last 12 months and the late fees of the most recent late billing period; a lease with no returned payment in the last 12 months and initial late fee lines in two or more billing periods in the last 12 months pays up front the late fees of the most recent late billing period; any other lease pays nothing up front."
      spread: "the plan arrears left to spread are the plan arrears less the charges paid up front."
      result: "The plan down payment is the plan percentage times the plan arrears left to spread, rounded up to the cent, plus the charges paid up front"
    factors:
      - id: plan_arrears_window
        effect: method
        decides: left_out
        bindings: [days_since_due, left_out]
        ladder:
          - when: "the resident signs within the plan grace days of the current month's due date"
            method: "the current month's base rent line and recurring fee lines are left out of the plan arrears"
          - when: "the resident signs after the plan grace days but no more than K('fee_window_days') days after the due date"
            method: "only the current month's recurring fee lines are left out"
          - when: "otherwise (a later signature)"
            method: "the plan arrears take in the whole ledger balance"
        baseline:
          left_out: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: plan_history_percentage
        effect: parameter
        decides: base_pct
        bindings: [n_completed, n_defaulted, base_pct]
        ladder:
          - when: "a completed payment plan on record and no defaulted plan on record"
            value: "P('payment_plan_min_down_pct') less K('completed_plan_credit')"
          - when: "a defaulted payment plan on record"
            value: "P('payment_plan_min_down_pct') plus K('defaulted_plan_loading')"
          - when: "otherwise (no plan history)"
            value: "P('payment_plan_min_down_pct')"
        baseline:
          base_pct: "P('payment_plan_min_down_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: arrears_size_loading
        effect: parameter
        decides: size_loading
        bindings: [size_ratio, size_loading]
        ladder:
          - when: "plan arrears above one month's rent (the current month's base rent line)"
            value: "K('size_loading_high') added to the plan percentage"
          - when: "plan arrears above half a month's rent and no more than one month's rent"
            value: "K('size_loading_mid') added to the plan percentage"
          - when: "otherwise (half a month's rent or less)"
            value: "nothing added"
        baseline:
          size_loading: "0"
        evidence: [history]
        cross_difficulty: null
      - id: term_end_loading
        effect: parameter
        decides: term_loading
        bindings: [term_end, days_to_term_end, term_loading]
        ladder:
          - when: "the current Lease Term Agreement ends no more than K('term_near_days') days after the day of signing"
            value: "K('term_loading_near') added to the plan percentage"
          - when: "it ends more than K('term_near_days') and no more than K('term_mid_days') days after"
            value: "K('term_loading_mid') added to the plan percentage"
          - when: "otherwise (it ends later)"
            value: "nothing added"
        baseline:
          term_loading: "0"
        evidence: [cross_category, date]
        cross_difficulty: term
      - id: tenure_credit
        effect: parameter
        decides: tenure_credit
        bindings: [tenure_months, tenure_credit]
        ladder:
          - when: "36 or more full calendar months in possession"
            value: "K('tenure_credit_long') taken off the plan percentage"
          - when: "24 to 35 full calendar months in possession"
            value: "K('tenure_credit_mid') taken off the plan percentage"
          - when: "otherwise (fewer than 24 months)"
            value: "nothing taken off"
        baseline:
          tenure_credit: "0"
        evidence: [date]
        cross_difficulty: null
      - id: upfront_charges
        effect: method
        decides: upfront
        bindings: [returns_12, late_periods_12, late_period, late_fees_latest, nsf_12, upfront]
        ladder:
          - when: "a returned payment in the last 12 months"
            method: "the returned payment fees of the last 12 months and the late fees of the most recent late billing period are paid up front, the rest spread"
          - when: "no returned payment in the last 12 months and initial late fee lines in two or more billing periods in the last 12 months"
            method: "the late fees of the most recent late billing period are paid up front, the rest spread"
          - when: "otherwise"
            method: "nothing is paid up front; the whole plan arrears are spread"
        baseline:
          upfront: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The ledger balance is the lease's rent, fee, late fee and returned payment fee lines less its credit lines, less
        its payments, plus its returned payments. The plan arrears are the whole ledger balance on the day the resident
        signs, and the figures of a plan request drawn up earlier are worked out again on that day. The plan percentage
        is the floor plan's payment_plan_min_down_pct. Nothing is paid up front. The plan down payment is the plan
        percentage times the plan arrears left to spread, rounded up to the cent, plus the charges paid up front; the plan
        arrears left to spread are the plan arrears less the charges paid up front.
      params: [payment_plan_min_down_pct]
    inputs:
      history:
        - {table: lease_charges, aggregate: sum, field: amount, filters: {event_type: lease_rent_charge}}
        - {table: lease_charges, aggregate: sum, field: amount, filters: {event_type: lease_charge_credit}}
        - {table: lease_payments, aggregate: sum, field: amount, filters: {event_type: lease_payment}}
        - {table: lease_payment_plan_requests, aggregate: count, field: plan_request_id, filters: {request_status: completed}}
        - {table: lease_charges, aggregate: count, field: charge_id, within_months: 12, filters: {charge_code: late_fee_initial}}
      cross_category: [term]
