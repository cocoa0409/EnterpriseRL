        superseded_clause: >-
          Usage of water, gas or electricity above its prorated allowance is billed as an overage line at the
          submetered rate times package_overage_rate_multiplier, water overage also carrying the sewer rate;
        replaced_by: >-
          The final electricity overage line bills the final electricity overage times electric_rate_per_kwh, times
          package_overage_rate_multiplier, rounded half up to the cent.
      - base_policy: utility_evt_flat_and_package
        superseded_clause: >-
          Flat amounts, the package fee and the package allowances are prorated for a partial first or last month by days of responsibility over the actual days of the period (proration_method), rounded half up to the cent (allowances to 3 decimals).
        replaced_by: >-
          The final electricity allowance is package_electric_allowance_kwh times the proration days over the days in period recorded on the account's latest package fee line, rounded to 3 decimals. Electricity allowances of every period other than the final period of an account in final billing remain prorated for a partial month by days of responsibility over the actual days of the period, to 3 decimals.
      - base_policy: utility_final_bill_and_close
        superseded_clause: >-
          the last period's usage, allocation or overage lines and flat or package lines prorated through the service end date
        replaced_by: >-
          The final electricity allowance is package_electric_allowance_kwh times the proration days over the days in period recorded on the account's latest package fee line, rounded to 3 decimals.
    trigger: state_due
    subject: [utility_package_overage]
    computes: amount
    target_tool: post_final_electric_overage_b496acda
    params:
      climate_uplift_hot: 150
      climate_uplift_mild: 75
      no_uplift: 0
      large_household: 4
      three_person_household: 3
      household_uplift_large: 100
      household_uplift_three: 50
      block_history_lines: 3
      block_width_kwh: 200
      block_rate_multiple: 1.20
      uniform_rate_multiple: 1.10
      long_tenure_months: 36
      mid_tenure_months: 12
      tenure_share_long: 0.85
      tenure_share_mid: 0.92
      full_share: 1.0
      standing_payment_count: 12
      standing_share_autopay: 0.95
      standing_share_manual: 0.97
      long_renewals: 3
      short_renewals: 1
      renewal_share_long: 0.94
      renewal_share_short: 0.97
    rule: >-
      The final electricity overage line is the electricity overage line of the final billing period of an
      All-Inclusive Utility Package account whose billing responsibility has ended; it is issued at the first bill
      issue after the service end date and is owed from that bill issue day until it stands on the account whenever
      the final electricity overage is above zero. The final electricity allowance is not prorated until the final
      period's package fee line stands on the account with its proration days. The final electricity allowance is
      package_electric_allowance_kwh times the proration days over the days in period recorded on the account's
      latest package fee line, rounded to 3 decimals. Electricity allowances of every period other than the final period of an account in final billing remain prorated for a partial month by days of responsibility over the actual days of the period, to 3 decimals. The final electricity overage is the electricity usage recorded
      on the account's latest electricity read, the service end read, less the final electricity allowance, never
      below zero, rounded to 3 decimals; the line records it as its usage. The final electricity overage line bills
      the final electricity overage times electric_rate_per_kwh, times package_overage_rate_multiplier, rounded half
      up to the cent. Before proration the monthly electricity allowance is raised by a climate uplift set by the
      community's state as recorded on the lease — climate_uplift_hot kilowatt-hours in AZ or TX, climate_uplift_mild
      in CA or GA, no_uplift in any other state — and by a household uplift set by the lease's approved occupants —
      household_uplift_large kilowatt-hours when the lease approves at least large_household occupants,
      household_uplift_three when it approves exactly three_person_household occupants, and no_uplift otherwise; the
      raised monthly allowance is then prorated as above. The final electricity overage is priced in blocks according
      to the account's electricity overage record: when at least block_history_lines electricity overage lines were
      issued on the account fewer than twelve whole months before the billing date, the first block_width_kwh of the
      final electricity overage is priced as measured and the rest at block_rate_multiple times; when at least one but
      fewer than block_history_lines such lines were issued in that time, the whole final electricity overage is
      priced at uniform_rate_multiple times; otherwise the final electricity overage is priced as measured; the priced
      electricity overage is rounded to 3 decimals. A final electricity tenure share applies: tenure_share_long when
      the lease's move-in date lies at least long_tenure_months whole months before the service end date,
      tenure_share_mid when it lies at least mid_tenure_months but fewer than long_tenure_months whole months before
      it, and the whole charge otherwise. A final electricity standing share applies: standing_share_autopay when the
      lease is enrolled in rent autopay and at least standing_payment_count utility payments were received fewer than
      twelve whole months before the billing date, standing_share_manual when at least standing_payment_count utility
      payments were received in that time and the lease is not enrolled in autopay, and the whole charge otherwise. A
      final electricity renewal share applies: renewal_share_long when the lease has at least long_renewals renewal
      rent changes on record, renewal_share_short when it has at least short_renewals but fewer than long_renewals,
      and the whole charge otherwise. The line's amount is the priced electricity overage times electric_rate_per_kwh,
      times package_overage_rate_multiplier, the final electricity tenure share, the final electricity standing share
      and the final electricity renewal share, all multiplied together and rounded half up to the cent once at the
      end.
    prerequisite:
      - problem: utility_ext_final_package_fee
        kind: value_input
        gate: eo_days
        form: state
        policy_source: >-
          The final electricity allowance is not prorated until the final period's package fee line stands on the
          account with its proration days.
        condition: >-
          utility_bills carries a utility_package flat charge line for the final billing period whose proration_days
          and days_in_period are those of the final period, so it is the account's latest package fee line.
        resolved_by: post_final_package_fee_c766a545
        effect: >-
          The final electricity allowance is prorated by the proration days and days in period of the final package
          fee line instead of those of the last full period's line, so the final electricity overage and its charge
          change.
    cross_category:
      - category: lease
        as: branch
        reads: [community_state, occupants_count, move_in_date, autopay_enrolled]
        note: The lease's state sets the climate uplift, its occupants the household uplift, its move-in date the tenure share and its autopay enrollment the standing share.
      - category: term
        as: history
        reads: [term_rent_changes.change_reason]
        note: The count of renewal rent changes on the lease's terms sets the final electricity renewal share.
    compute:
      - eo_days: "LATEST('utility_bills', 'proration_days', date_field='bill_date', event_type='utility_flat_charge', service_type='utility_package')"
      - eo_period_days: "LATEST('utility_bills', 'days_in_period', date_field='bill_date', event_type='utility_flat_charge', service_type='utility_package')"
      - eo_usage: "LATEST('utility_meter_reads', 'usage_quantity', date_field='read_date', service_type='electric')"
      - eo_state: "CFIELD('lease', 'community_state')"
      - eo_climate: "K('climate_uplift_hot') if (eo_state == 'AZ' or eo_state == 'TX') else (K('climate_uplift_mild') if (eo_state == 'CA' or eo_state == 'GA') else K('no_uplift'))"
      - eo_occupants: "CFIELD('lease', 'occupants_count')"
      - eo_household: "K('household_uplift_large') if eo_occupants >= K('large_household') else (K('household_uplift_three') if eo_occupants == K('three_person_household') else K('no_uplift'))"
      - eo_allowance: "RND((P('package_electric_allowance_kwh') + eo_climate + eo_household) * eo_days / eo_period_days, 3)"
      - eo_overage: "MX(0, RND(eo_usage - eo_allowance, 3))"
      - eo_history: "COUNT('utility_bills', within_months=12, date_field='bill_date', event_type='utility_package_overage', service_type='electric')"
      - eo_priced: "RND(MN(eo_overage, K('block_width_kwh')) + MX(0, eo_overage - K('block_width_kwh')) * K('block_rate_multiple'), 3) if eo_history >= K('block_history_lines') else (RND(eo_overage * K('uniform_rate_multiple'), 3) if (eo_history >= 1 and eo_history < K('block_history_lines')) else eo_overage)"
      - eo_tenure: "MONTHS(CFIELD('lease', 'move_in_date'), F('service_end_date'))"
      - eo_tenure_share: "K('tenure_share_long') if eo_tenure >= K('long_tenure_months') else (K('tenure_share_mid') if (eo_tenure >= K('mid_tenure_months') and eo_tenure < K('long_tenure_months')) else K('full_share'))"
      - eo_autopay: "CFIELD('lease', 'autopay_enrolled')"
      - eo_payments: "COUNT('utility_bills', within_months=12, date_field='bill_date', event_type='utility_payment')"
      - eo_standing_share: "K('standing_share_autopay') if (eo_autopay and eo_payments >= K('standing_payment_count')) else (K('standing_share_manual') if ((not eo_autopay) and eo_payments >= K('standing_payment_count')) else K('full_share'))"
      - eo_renewals: "XCOUNT('term', 'term_rent_changes', event_type='term_rent_change', change_reason='renewal')"
      - eo_renewal_share: "K('renewal_share_long') if eo_renewals >= K('long_renewals') else (K('renewal_share_short') if (eo_renewals >= K('short_renewals') and eo_renewals < K('long_renewals')) else K('full_share'))"
      - result: "RND(eo_priced * P('electric_rate_per_kwh') * P('package_overage_rate_multiplier') * eo_tenure_share * eo_standing_share * eo_renewal_share, 2)"
    compute_basis:
      eo_days: "The final electricity allowance is package_electric_allowance_kwh times the proration days over the days in period recorded on the account's latest package fee line, rounded to 3 decimals."
      eo_period_days: "the proration days over the days in period recorded on the account's latest package fee line"
      eo_usage: "The final electricity overage is the electricity usage recorded on the account's latest electricity read, the service end read, less the final electricity allowance, never below zero, rounded to 3 decimals"
      eo_state: "a climate uplift set by the community's state as recorded on the lease"
      eo_climate: "climate_uplift_hot kilowatt-hours in AZ or TX, climate_uplift_mild in CA or GA, no_uplift in any other state"
      eo_occupants: "a household uplift set by the lease's approved occupants"
      eo_household: "household_uplift_large kilowatt-hours when the lease approves at least large_household occupants, household_uplift_three when it approves exactly three_person_household occupants, and no_uplift otherwise"
      eo_allowance: "the raised monthly allowance is then prorated as above."
      eo_overage: "The final electricity overage is the electricity usage recorded on the account's latest electricity read, the service end read, less the final electricity allowance, never below zero, rounded to 3 decimals"
      eo_history: "when at least block_history_lines electricity overage lines were issued on the account fewer than twelve whole months before the billing date"
      eo_priced: "when at least block_history_lines electricity overage lines were issued on the account fewer than twelve whole months before the billing date, the first block_width_kwh of the final electricity overage is priced as measured and the rest at block_rate_multiple times; when at least one but fewer than block_history_lines such lines were issued in that time, the whole final electricity overage is priced at uniform_rate_multiple times; otherwise the final electricity overage is priced as measured; the priced electricity overage is rounded to 3 decimals."
      eo_tenure: "when the lease's move-in date lies at least long_tenure_months whole months before the service end date"
      eo_tenure_share: "A final electricity tenure share applies: tenure_share_long when the lease's move-in date lies at least long_tenure_months whole months before the service end date, tenure_share_mid when it lies at least mid_tenure_months but fewer than long_tenure_months whole months before it, and the whole charge otherwise."
      eo_autopay: "when the lease is enrolled in rent autopay"
      eo_payments: "at least standing_payment_count utility payments were received fewer than twelve whole months before the billing date"
      eo_standing_share: "A final electricity standing share applies: standing_share_autopay when the lease is enrolled in rent autopay and at least standing_payment_count utility payments were received fewer than twelve whole months before the billing date, standing_share_manual when at least standing_payment_count utility payments were received in that time and the lease is not enrolled in autopay, and the whole charge otherwise."
      eo_renewals: "when the lease has at least long_renewals renewal rent changes on record"
      eo_renewal_share: "A final electricity renewal share applies: renewal_share_long when the lease has at least long_renewals renewal rent changes on record, renewal_share_short when it has at least short_renewals but fewer than long_renewals, and the whole charge otherwise."
      result: "The line's amount is the priced electricity overage times electric_rate_per_kwh, times package_overage_rate_multiplier, the final electricity tenure share, the final electricity standing share and the final electricity renewal share, all multiplied together and rounded half up to the cent once at the end."
    factors:
      - id: climate_allowance_uplift
        effect: parameter
        decides: eo_climate
        bindings: [eo_state, eo_climate]
        ladder:
          - when: "the community's state as recorded on the lease is AZ or TX"
            value: "K('climate_uplift_hot')"
          - when: "the community's state as recorded on the lease is CA or GA"
            value: "K('climate_uplift_mild')"
          - when: "otherwise"
            value: "K('no_uplift')"
        baseline:
          eo_climate: "K('no_uplift')"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: household_allowance_uplift
        effect: parameter
        decides: eo_household
        bindings: [eo_occupants, eo_household]
        ladder:
          - when: "the lease approves at least large_household occupants"
            value: "K('household_uplift_large')"
          - when: "the lease approves exactly three_person_household occupants"
            value: "K('household_uplift_three')"
          - when: "otherwise"
            value: "K('no_uplift')"
        baseline:
          eo_household: "K('no_uplift')"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: electricity_overage_blocks
        effect: method
        decides: eo_priced
        bindings: [eo_history, eo_priced]
        ladder:
          - when: "at least block_history_lines electricity overage lines were issued on the account fewer than twelve whole months before the billing date"
            method: "the first block_width_kwh of the final electricity overage is priced as measured and the rest at block_rate_multiple times"
          - when: "at least one but fewer than block_history_lines such lines were issued in that time"
            method: "the whole final electricity overage is priced at uniform_rate_multiple times"
          - when: "otherwise"
            method: "the final electricity overage is priced as measured"
        baseline:
          eo_priced: "eo_overage"
        evidence: [history]
        cross_difficulty: null
      - id: final_electricity_tenure_share
        effect: parameter
        decides: eo_tenure_share
        bindings: [eo_tenure, eo_tenure_share]
        ladder:
          - when: "the lease's move-in date lies at least long_tenure_months whole months before the service end date"
            value: "K('tenure_share_long')"
          - when: "it lies at least mid_tenure_months but fewer than long_tenure_months whole months before it"
            value: "K('tenure_share_mid')"
          - when: "otherwise"
            value: "the whole charge"
        baseline:
          eo_tenure_share: "K('full_share')"
        evidence: [date, cross_category]
        cross_difficulty: lease
      - id: final_electricity_standing_share
        effect: parameter
        decides: eo_standing_share
        bindings: [eo_autopay, eo_payments, eo_standing_share]
        ladder:
          - when: "the lease is enrolled in rent autopay and at least standing_payment_count utility payments were received fewer than twelve whole months before the billing date"
            value: "K('standing_share_autopay')"
          - when: "at least standing_payment_count utility payments were received in that time and the lease is not enrolled in autopay"
            value: "K('standing_share_manual')"
          - when: "otherwise"
            value: "the whole charge"
        baseline:
          eo_standing_share: "K('full_share')"
        evidence: [history, cross_category]
        cross_difficulty: lease
      - id: final_electricity_renewal_share
        effect: parameter
        decides: eo_renewal_share
        bindings: [eo_renewals, eo_renewal_share]
        ladder:
          - when: "the lease has at least long_renewals renewal rent changes on record"
            value: "K('renewal_share_long')"
          - when: "the lease has at least short_renewals but fewer than long_renewals renewal rent changes on record"
            value: "K('renewal_share_short')"
          - when: "otherwise"
            value: "the whole charge"
        baseline:
          eo_renewal_share: "K('full_share')"
        evidence: [history, cross_category]
        cross_difficulty: term
    baseline:
      rule: >-
        The final electricity allowance is package_electric_allowance_kwh times the proration days over the days in
        period recorded on the account's latest package fee line, rounded to 3 decimals. The final electricity overage
        is the electricity usage recorded on the account's latest electricity read, the service end read, less the
        final electricity allowance, never below zero, rounded to 3 decimals; the line records it as its usage. The
        final electricity overage line bills the final electricity overage times electric_rate_per_kwh, times
        package_overage_rate_multiplier, rounded half up to the cent.
      params: [package_electric_allowance_kwh, electric_rate_per_kwh, package_overage_rate_multiplier]
    inputs:
      history:
        - {table: utility_bills, aggregate: latest, field: proration_days, filters: {event_type: utility_flat_charge, service_type: utility_package}}
        - {table: utility_meter_reads, aggregate: latest, field: usage_quantity, filters: {service_type: electric}}
        - {table: utility_bills, aggregate: count, field: bill_id, within_months: 12, filters: {event_type: utility_package_overage, service_type: electric}}
        - {table: utility_bills, aggregate: count, field: bill_id, within_months: 12, filters: {event_type: utility_payment}}
        - {category: term, table: term_rent_changes, aggregate: count, field: rent_change_id, filters: {event_type: term_rent_change, change_reason: renewal}}
      cross_category: [lease, term]
  - id: utility_ext_moveout_utility_payment
    base_policy_refs: [utility_agg_household_balance, utility_evt_payments]
    overwrite: []
    trigger: on_request
    subject: [utility_payment]
    computes: amount
    target_tool: pay_moveout_utility_share_762d5a93
    params:
      reserve_share_long: 0.60
      reserve_share_mid: 0.80
      reserve_share_full: 1.0
      long_tenure_months: 36
      mid_tenure_months: 12
      forwarding_share_ach: 1.0
      forwarding_share_check: 0.50
      lease_standing_full: 1.0
      lease_standing_partial: 0.50
      no_reliance: 0.0
    rule: >-
      The move-out utility payment is the part of the final utility balance of an account in final billing that the
      former resident pays in person because the security deposit is not expected to reach it; the resident pays it
      with an instrument of their own, and whatever is not paid is carried into the final account statement under the security deposit charter. It applies to every account in final billing, whether or not a line on it stands under a dispute. The part of the final utility balance paid in person is fixed only after the account
      in final billing carries its package fee line for the final period. Before the part paid in person is worked
      out, the final period's water usage above its final water allowance must stand on the account as a water
      overage line. The part paid in person is not worked out until the final period's electricity usage above its
      final electricity allowance stands on the account as an electricity overage line. The final utility balance is
      the sum of every usage, allocation, flat and package overage line billed on the account less every adjustment
      and payment posted on it, rounded half up to the cent. In the standard case nothing is left to the security
      deposit and the move-out utility payment is the whole final utility balance. The deposit expected to reach
      utilities is the cash deposit held on the lease's security deposit account less, in the order the deposit is
      applied at final accounting, the lease's balance, the anticipated move-out charges and the balance of the
      lease's completed final term, never below zero, rounded half up to the cent. The anticipated move-out charges
      depend on how far the move-out itemization has come: when the deposit account is in move-out review and at least
      one move-out charge has been itemized on it, they are the itemized move-out charges plus the reserve share of the
      cash deposit held less those charges; when the deposit account is in move-out review and no move-out charge has
      been itemized, they are the reserve share of the cash deposit held; in every other situation they are the whole
      cash deposit held; each is rounded half up to the cent. The reserve share for move-out charges not yet itemized
      is set by the resident's tenure, because finishes past their useful life are never charged: reserve_share_long
      when the lease's move-in date lies at least long_tenure_months whole months before the service end date,
      reserve_share_mid when it lies at least mid_tenure_months but fewer than long_tenure_months whole months before
      it, and reserve_share_full otherwise. The deposit expected to reach utilities is relied on in a forwarding
      share: forwarding_share_ach when a forwarding address is recorded on the deposit account and its refund method
      is direct deposit, forwarding_share_check when a forwarding address is recorded and its refund method is paper
      check, and no_reliance when no forwarding address is recorded. It is also relied on in a lease standing share:
      lease_standing_full when the lease is enrolled in rent autopay and is not restricted to certified funds,
      lease_standing_partial when exactly one of those two holds, and no_reliance when neither holds. The deposit
      relied on is the deposit expected to reach utilities times the forwarding share times the lease standing share,
      rounded half up to the cent once, and never more than the final utility balance; the move-out utility payment
      is the final utility balance less the deposit relied on, never below zero, rounded half up to the cent.
    prerequisite:
      - problem: utility_ext_final_package_fee
        kind: value_input
        gate: mo_balance
        form: state
        policy_source: >-
          The part of the final utility balance paid in person is fixed only after the account in final billing
          carries its package fee line for the final period.
        condition: >-
          utility_bills carries a utility_package flat charge line whose billing_period is the final billing period of
          the account in final_billing.
        resolved_by: post_final_package_fee_c766a545
        effect: >-
          The final package fee line enters the final utility balance, so the balance and with it the move-out
          utility payment rise by the amount of that line.
      - problem: utility_ext_final_water_overage
        kind: value_input
        gate: mo_balance
        form: state
        policy_source: >-
          Before the part paid in person is worked out, the final period's water usage above its final water
          allowance must stand on the account as a water overage line.
        condition: >-
          utility_bills carries a water utility_package_overage line for the final billing period whenever the service
          end water read exceeds the final water allowance.
        resolved_by: post_final_water_overage_2681eca1
        effect: >-
          The final water overage line enters the final utility balance, so the balance and the move-out utility
          payment rise by the amount of that line.
      - problem: utility_ext_final_electric_overage
        kind: value_input
        gate: mo_balance
        form: state
        policy_source: >-
          The part paid in person is not worked out until the final period's electricity usage above its final
          electricity allowance stands on the account as an electricity overage line.
        condition: >-
          utility_bills carries an electric utility_package_overage line for the final billing period whenever the
          service end electricity read exceeds the final electricity allowance.
        resolved_by: post_final_electric_overage_b496acda
        effect: >-
          The final electricity overage line enters the final utility balance, so the balance and the move-out
          utility payment rise by the amount of that line.
    cross_category:
      - category: deposit
        as: history
        reads: [deposit_held, status, forwarding_address, refund_method, deposit_transactions.amount]
        note: The deposit account's cash held, review status, itemized move-out charges, forwarding address and refund method decide the anticipated charges and the forwarding share.
      - category: lease
        as: branch
        reads: [balance_due, move_in_date, autopay_enrolled, certified_funds_only]
        note: The lease balance is taken ahead of utilities, its move-in date sets the reserve share, and its autopay and certified-funds status set the lease standing share.
      - category: term
        as: branch
        reads: [balance_due]
        note: The balance of the lease's completed final term is taken ahead of utilities.
    compute:
      - mo_charges: "SUM('utility_bills', 'amount', event_type='utility_usage_billback') + SUM('utility_bills', 'amount', event_type='utility_allocation_billback') + SUM('utility_bills', 'amount', event_type='utility_flat_charge') + SUM('utility_bills', 'amount', event_type='utility_package_overage')"
      - mo_credits: "SUM('utility_bills', 'amount', event_type='utility_bill_adjustment') + SUM('utility_bills', 'amount', event_type='utility_payment')"
      - mo_balance: "RND(mo_charges - mo_credits, 2)"
      - mo_held: "CFIELD('deposit', 'deposit_held')"
      - mo_status: "CFIELD('deposit', 'status')"
      - mo_itemized_n: "XCOUNT('deposit', 'deposit_transactions', event_type='deposit_move_out_charge')"
      - mo_itemized: "XSUM('deposit', 'deposit_transactions', 'amount', event_type='deposit_move_out_charge')"
      - mo_tenure: "MONTHS(CFIELD('lease', 'move_in_date'), F('service_end_date'))"
      - mo_reserve_share: "K('reserve_share_long') if mo_tenure >= K('long_tenure_months') else (K('reserve_share_mid') if (mo_tenure >= K('mid_tenure_months') and mo_tenure < K('long_tenure_months')) else K('reserve_share_full'))"
      - mo_anticipated: "RND(mo_itemized + mo_reserve_share * (mo_held - mo_itemized), 2) if (mo_status == 'move_out_review' and mo_itemized_n >= 1) else (RND(mo_reserve_share * mo_held, 2) if (mo_status == 'move_out_review' and mo_itemized_n == 0) else mo_held)"
      - mo_lease_balance: "CFIELD('lease', 'balance_due')"
      - mo_term_balance: "CFIELD('term', 'balance_due', status='completed') or 0"
      - mo_reach: "MX(0, RND(mo_held - mo_lease_balance - mo_anticipated - mo_term_balance, 2))"
      - mo_forwarding: "CFIELD('deposit', 'forwarding_address')"
      - mo_refund_method: "CFIELD('deposit', 'refund_method')"
      - mo_forwarding_share: "K('forwarding_share_ach') if (mo_forwarding != None and mo_refund_method == 'ach_direct_deposit') else (K('forwarding_share_check') if (mo_forwarding != None and mo_refund_method == 'paper_check') else K('no_reliance'))"
      - mo_autopay: "CFIELD('lease', 'autopay_enrolled')"
      - mo_certified: "CFIELD('lease', 'certified_funds_only')"
      - mo_standing_share: "K('lease_standing_full') if (mo_autopay and not mo_certified) else (K('lease_standing_partial') if ((mo_autopay and mo_certified) or ((not mo_autopay) and (not mo_certified))) else K('no_reliance'))"
      - mo_relied: "MN(mo_balance, RND(mo_reach * mo_forwarding_share * mo_standing_share, 2))"
      - result: "MX(0, RND(mo_balance - mo_relied, 2))"
    compute_basis:
      mo_charges: "The final utility balance is the sum of every usage, allocation, flat and package overage line billed on the account less every adjustment and payment posted on it, rounded half up to the cent."
      mo_credits: "less every adjustment and payment posted on it"
      mo_balance: "The final utility balance is the sum of every usage, allocation, flat and package overage line billed on the account less every adjustment and payment posted on it, rounded half up to the cent."
      mo_held: "the cash deposit held on the lease's security deposit account"
      mo_status: "when the deposit account is in move-out review"
      mo_itemized_n: "at least one move-out charge has been itemized on it"
      mo_itemized: "they are the itemized move-out charges plus the reserve share of the cash deposit held less those charges"
      mo_tenure: "when the lease's move-in date lies at least long_tenure_months whole months before the service end date"
      mo_reserve_share: "reserve_share_long when the lease's move-in date lies at least long_tenure_months whole months before the service end date, reserve_share_mid when it lies at least mid_tenure_months but fewer than long_tenure_months whole months before it, and reserve_share_full otherwise."
      mo_anticipated: "when the deposit account is in move-out review and at least one move-out charge has been itemized on it, they are the itemized move-out charges plus the reserve share of the cash deposit held less those charges; when the deposit account is in move-out review and no move-out charge has been itemized, they are the reserve share of the cash deposit held; in every other situation they are the whole cash deposit held; each is rounded half up to the cent."
      mo_lease_balance: "in the order the deposit is applied at final accounting, the lease's balance"
      mo_term_balance: "the balance of the lease's completed final term"
      mo_reach: "The deposit expected to reach utilities is the cash deposit held on the lease's security deposit account less, in the order the deposit is applied at final accounting, the lease's balance, the anticipated move-out charges and the balance of the lease's completed final term, never below zero, rounded half up to the cent."
      mo_forwarding: "when a forwarding address is recorded on the deposit account"
      mo_refund_method: "its refund method is direct deposit"
      mo_forwarding_share: "forwarding_share_ach when a forwarding address is recorded on the deposit account and its refund method is direct deposit, forwarding_share_check when a forwarding address is recorded and its refund method is paper check, and no_reliance when no forwarding address is recorded."
      mo_autopay: "when the lease is enrolled in rent autopay"
      mo_certified: "is not restricted to certified funds"
      mo_standing_share: "lease_standing_full when the lease is enrolled in rent autopay and is not restricted to certified funds, lease_standing_partial when exactly one of those two holds, and no_reliance when neither holds."
      mo_relied: "The deposit relied on is the deposit expected to reach utilities times the forwarding share times the lease standing share, rounded half up to the cent once, and never more than the final utility balance"
      result: "the move-out utility payment is the final utility balance less the deposit relied on, never below zero, rounded half up to the cent."
    factors:
      - id: itemization_anticipation
        effect: method
        decides: mo_anticipated
        bindings: [mo_status, mo_itemized_n, mo_itemized, mo_anticipated]
        ladder:
          - when: "the deposit account is in move-out review and at least one move-out charge has been itemized on it"
            method: "the itemized move-out charges plus the reserve share of the cash deposit held less those charges"
          - when: "the deposit account is in move-out review and no move-out charge has been itemized"
            method: "the reserve share of the cash deposit held"
          - when: "otherwise"
            method: "the whole cash deposit held"
        baseline:
          mo_anticipated: "mo_held"
        evidence: [history, cross_category]
        cross_difficulty: deposit
      - id: itemization_reserve_share
        effect: parameter
        decides: mo_reserve_share
        bindings: [mo_tenure, mo_reserve_share]
        ladder:
          - when: "the lease's move-in date lies at least long_tenure_months whole months before the service end date"
            value: "K('reserve_share_long')"
          - when: "it lies at least mid_tenure_months but fewer than long_tenure_months whole months before it"
            value: "K('reserve_share_mid')"
          - when: "otherwise"
            value: "K('reserve_share_full')"
        baseline:
          mo_reserve_share: "K('reserve_share_full')"
        evidence: [date, cross_category]
        cross_difficulty: lease
      - id: forwarding_reliance_share
        effect: parameter
        decides: mo_forwarding_share
        bindings: [mo_forwarding, mo_refund_method, mo_forwarding_share]
        ladder:
          - when: "a forwarding address is recorded on the deposit account and its refund method is direct deposit"
            value: "K('forwarding_share_ach')"
          - when: "a forwarding address is recorded and its refund method is paper check"
            value: "K('forwarding_share_check')"
          - when: "otherwise"
            value: "K('no_reliance')"
        baseline:
          mo_forwarding_share: "K('no_reliance')"
        evidence: [cross_category]
        cross_difficulty: deposit
      - id: lease_standing_reliance_share
        effect: parameter
        decides: mo_standing_share
        bindings: [mo_autopay, mo_certified, mo_standing_share]
        ladder:
          - when: "the lease is enrolled in rent autopay and is not restricted to certified funds"
            value: "K('lease_standing_full')"
          - when: "exactly one of those two holds"
            value: "K('lease_standing_partial')"
          - when: "otherwise"
            value: "K('no_reliance')"
        baseline:
          mo_standing_share: "K('no_reliance')"
        evidence: [cross_category]
        cross_difficulty: lease
    baseline:
      rule: >-
        The final utility balance is the sum of every usage, allocation, flat and package overage line billed on the
        account less every adjustment and payment posted on it, rounded half up to the cent. In the standard case
        nothing is left to the security deposit and the move-out utility payment is the whole final utility balance.
      params: []
    inputs:
      history:
        - {table: utility_bills, aggregate: sum, field: amount, filters: {}}
        - {category: deposit, table: deposit_transactions, aggregate: sum, field: amount, filters: {event_type: deposit_move_out_charge}}
      cross_category: [deposit, lease, term]
