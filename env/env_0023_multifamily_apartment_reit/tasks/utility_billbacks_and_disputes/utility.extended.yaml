events:
  - type: utility_enrollment
    target: utility_accounts
    mutation: create
    meaning: A utility account is opened for the apartment home of an approved lease or a signed transfer.
    grain: One row per account.
    fields:
      customer_id: Leaseholder.
      lease_id: Lease served.
      variant_name: Utility program fixed by the apartment home's metering.
      service_start_date: Planned first day of billing responsibility.
      billed_occupants: Approved occupants on the lease.
      unit_square_feet: Rentable square feet of the apartment home.
    triggers: []
  - type: utility_activation
    target: utility_accounts
    mutation: {transition: {from: pending, to: active}}
    meaning: Billing responsibility starts on the move-in or transfer move date.
    grain: One row per transaction.
    fields:
      service_start_date: Actual first day of billing responsibility.
    triggers:
      - event: utility:utility_flat_charge
        map: {service_type: move_in_setup_fee, bill_date: service_start_date}
  - type: utility_meter_read
    target: utility_meter_reads
    meaning: A submeter is read (or its read estimated) at the close of a billing period, at move-in or at move-out.
    grain: One row per meter per read date.
    distinguish_by: [service_type, read_date]
    fields:
      service_type: Metered service.
      billing_period: Service month closed by the read.
      read_date: Date of the read.
      read_value: Register value.
      usage_quantity: Consumption since the previous read.
      read_type: actual or estimated.
    triggers:
      - event: utility:utility_usage_billback
        when: {usage_quantity: {not: 0}}
        map: {service_type: service_type, billing_period: billing_period, usage_quantity: usage_quantity, read_type: read_type}
  - type: utility_usage_billback
    target: utility_bills
    meaning: Submetered consumption of one service for one billing period is billed, with its fixed service charge.
    grain: One row per service per billing period per read basis.
    distinguish_by: [service_type, billing_period, read_type]
    fields:
      service_type: water, sewer, gas or electric.
      billing_period: Service month.
      bill_date: Issue date.
      amount: Usage charge plus the fixed monthly charge of the service.
      usage_quantity: Consumption billed.
      usage_unit: kgal, therm or kwh.
      read_type: actual or estimated.
    account: utility_receivable
    direction: in
    triggers: []
  - type: utility_allocation_billback
    target: utility_bills
    meaning: The apartment home's allocated share of the community water or sewer bill for one billing period is billed.
    grain: One row per service per billing period.
    distinguish_by: [service_type, billing_period]
    fields:
      service_type: water or sewer.
      billing_period: Service month.
      bill_date: Issue date.
      amount: Allocated amount after deduction and cap.
      property_bill_amount: Community provider bill for the service and period.
      allocation_factor: The apartment home's allocation share.
      proration_days: Days of responsibility in the period.
      days_in_period: Actual days of the period.
    account: utility_receivable
    direction: in
    triggers: []
  - type: utility_flat_charge
    target: utility_bills
    meaning: A flat utility line is billed — trash, pest control, stormwater, billing administration, setup, the all-inclusive package fee or a meter test fee.
    grain: One row per flat service per billing period.
    distinguish_by: [service_type, billing_period]
    fields:
      service_type: Flat service or fee.
      billing_period: Service month.
      bill_date: Issue date.
      amount: Amount billed after proration.
      proration_days: Days of responsibility in the period.
      days_in_period: Actual days of the period.
    account: utility_receivable
    direction: in
    triggers: []
  - type: utility_package_overage
    target: utility_bills
    meaning: Usage of one service above the all-inclusive package allowance for one billing period is billed.
    grain: One row per service per billing period.
    distinguish_by: [service_type, billing_period]
    fields:
      service_type: water, gas or electric (sewer follows water usage and is included in the water overage line).
      billing_period: Service month.
      bill_date: Issue date.
      amount: Overage charge.
      usage_quantity: Usage above the prorated allowance.
      usage_unit: kgal, therm or kwh.
      read_type: actual or estimated.
    account: utility_receivable
    direction: in
    triggers: []
  - type: utility_bill_adjustment
    target: utility_bills
    meaning: A billed utility line is credited in whole or in part — leak adjustment, estimated-read true-up, occupancy correction, billing error or meter inaccuracy.
    grain: One row per credited bill line per reason.
    distinguish_by: [source_bill_id, adjustment_reason]
    fields:
      source_bill_id: The bill line credited.
      adjustment_reason: Reason of the credit.
      service_type: Service of the credited line.
      billing_period: Service month of the credited line.
      bill_date: Posting date.
      amount: Credit (positive).
    account: utility_receivable
    direction: out
    triggers: []
  - type: utility_payment
    target: utility_bills
    meaning: A payment toward the utility balance is received, including the application of the security deposit at final accounting.
    grain: One row per payment transaction.
    distinguish_by: [payment_reference]
    fields:
      service_type: not_applicable.
      billing_period: Month received.
      bill_date: Date received.
      amount: Amount received.
      payment_method: Instrument used.
      payment_reference: Confirmation or instrument number.
    account: utility_receivable
    direction: out
    triggers: []
  - type: utility_plan_change
    target: utility_accounts
    mutation: update
    meaning: The account moves to the All-Inclusive Utility Package from a submetered program, or back.
    grain: One row per transaction.
    fields:
      variant_name: New utility program.
    triggers: []
  - type: utility_occupancy_update
    target: utility_accounts
    mutation: update
    meaning: Billed occupants follow a change in the lease's approved occupants.
    grain: One row per transaction.
    fields:
      billed_occupants: New billed occupant count.
    triggers: []
  - type: utility_final_billing
    target: utility_accounts
    mutation: {transition: {from: active, to: final_billing}}
    meaning: Billing responsibility ends on the move-out or transfer move date and final reads are taken.
    grain: One row per transaction.
    fields:
      service_end_date: Last day of billing responsibility.
    triggers: []
  - type: utility_close
    target: utility_accounts
    mutation: {transition: [{from: final_billing, to: closed}, {from: pending, to: closed}]}
    meaning: The account is closed — after its final bill is settled or carried into final accounting, or before it ever billed.
    grain: One row per transaction.
    fields:
      closed_date: Date closed.
    triggers: []

measures:
  - id: utility_msr_average_usage
    window: The estimate_history_periods most recent billing periods before the period in question that have an actual read of the same service.
    measure: Arithmetic mean of usage_quantity of those actual utility_meter_read rows, rounded to 3 decimals; the basis for estimates and for the leak threshold.
  - id: utility_msr_consecutive_estimates
    window: Billing periods of one metered service counted back from the period in question until the first actual read.
    measure: Count of consecutive estimated utility_meter_read rows of that service immediately before the period in question.
  - id: utility_msr_leak_adjustments_12m
    window: Trailing 365 calendar days ending on and including the evaluation date.
    measure: Count of utility_bill_adjustment rows with adjustment_reason leak_adjustment on the account whose bill_date falls in the window.

policies:
  - id: utility_agg_multi_holding
    subject: [utility_enrollment]
    rule: >-
      Each apartment home under a lease has exactly one utility account, so a household normally holds one. During an
      in-community transfer the account of the apartment home left behind stays in final_billing while the account of the
      new apartment home opens, which is why two accounts may be open at once.
      A new utility account may be opened only when no other pending or active utility account exists for the same lease.
      An account in final_billing does not block the new one.
    eligibility:
      - id: one_open_account_per_lease
        applies_to: [utility_enrollment]
        kind: dedup
        condition: "A new utility account may be opened only when no other pending or active utility account exists for the same lease."
        evidence_fields: [utility_accounts.lease_id, utility_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_accounts.lease_id]
          action_bindings:
            utility_accounts.lease_id: lease_id
        dedup_contract:
          table: utility_accounts
          mode: separate_record
          object_bindings: {lease_id: lease_id}
          duplicate_filters: {status: [pending, active]}
          distinct_fields: []
    params:
      max_per_customer: 2

  - id: utility_agg_household_balance
    subject: [utility_payment, utility_close]
    rule: >-
      A household's utility balance is the sum of balance_due over all its utility accounts, including an account in
      final_billing after a transfer. A payment is applied to the account it is made on, oldest bill line first; a credit
      balance on one account is applied to the open balance of the household's other utility account before any refund.
      At final accounting the remaining utility balance of every account tied to the lease is carried into the final
      account statement under the security deposit charter, and each account is closed once its final bill has been
      issued and its balance paid or carried there. Unpaid utility charges never lead to an interruption of service —
      Larkspur never disconnects or restricts a utility for non-payment — and never incur a late fee under this charter.
    eligibility: []

  - id: utility_evt_enrollment_and_program
    subject: [utility_enrollment, utility_activation, utility_plan_change]
    rule: >-
      The utility program of an account is fixed by how the apartment home is metered (each program's entry gate), not
      chosen by the resident; the only choice is that a household in an apartment home with water, gas and electric
      submeters may opt into the All-Inclusive Utility Package, or opt back out to the Submetered Water, Gas & Electric
      Plan. The services an account bills are exactly those the program's covers_water_sewer, covers_trash, covers_pest,
      covers_stormwater, covers_gas and covers_electric switches name, and water and sewer are billed by the program's
      water_billing_method; a service not covered is contracted by the resident directly with the provider and never
      appears on the utility account. A program change takes effect on the first day of the next billing period and at most once in any
      plan_change_interval_months calendar months. billed_occupants is the lease's occupants_count (occupant_count_basis)
      and unit_square_feet the rentable square feet of the apartment home. The account activates on the move-in or
      transfer move date and posts the program's move_in_setup_fee on that date, except that the fee is waived on the
      account opened for an in-community transfer when transfer_setup_fee_waived is true.
      A program change is accepted only on an active account.
    eligibility:
      - id: program_change_on_active_account
        applies_to: [utility_plan_change]
        kind: state
        condition: "A program change is accepted only on an active account."
        evidence_fields: [utility_accounts.utility_account_id, utility_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_accounts.utility_account_id]
          action_bindings:
            utility_accounts.utility_account_id: utility_account_id
        state_contract:
          field: utility_accounts.status
          allowed: [active]
    params:
      plan_change_interval_months: 12
      per_tier:
        Essentials Utility Plan: {covers_water_sewer: "=covers_water_sewer", covers_trash: "=covers_trash", covers_pest: "=covers_pest", covers_stormwater: "=covers_stormwater", covers_gas: "=covers_gas", covers_electric: "=covers_electric", water_billing_method: "=water_billing_method", move_in_setup_fee: "=move_in_setup_fee", transfer_setup_fee_waived: "=transfer_setup_fee_waived", occupant_count_basis: "=occupant_count_basis"}
        Water-Sewer-Trash Allocation Plan: {covers_water_sewer: "=covers_water_sewer", covers_trash: "=covers_trash", covers_pest: "=covers_pest", covers_stormwater: "=covers_stormwater", covers_gas: "=covers_gas", covers_electric: "=covers_electric", water_billing_method: "=water_billing_method", move_in_setup_fee: "=move_in_setup_fee", transfer_setup_fee_waived: "=transfer_setup_fee_waived", occupant_count_basis: "=occupant_count_basis"}
        Submetered Water Plan: {covers_water_sewer: "=covers_water_sewer", covers_trash: "=covers_trash", covers_pest: "=covers_pest", covers_stormwater: "=covers_stormwater", covers_gas: "=covers_gas", covers_electric: "=covers_electric", water_billing_method: "=water_billing_method", move_in_setup_fee: "=move_in_setup_fee", transfer_setup_fee_waived: "=transfer_setup_fee_waived", occupant_count_basis: "=occupant_count_basis"}
        Submetered Water & Gas Plan: {covers_water_sewer: "=covers_water_sewer", covers_trash: "=covers_trash", covers_pest: "=covers_pest", covers_stormwater: "=covers_stormwater", covers_gas: "=covers_gas", covers_electric: "=covers_electric", water_billing_method: "=water_billing_method", move_in_setup_fee: "=move_in_setup_fee", transfer_setup_fee_waived: "=transfer_setup_fee_waived", occupant_count_basis: "=occupant_count_basis"}
        Submetered Water, Gas & Electric Plan: {covers_water_sewer: "=covers_water_sewer", covers_trash: "=covers_trash", covers_pest: "=covers_pest", covers_stormwater: "=covers_stormwater", covers_gas: "=covers_gas", covers_electric: "=covers_electric", water_billing_method: "=water_billing_method", move_in_setup_fee: "=move_in_setup_fee", transfer_setup_fee_waived: "=transfer_setup_fee_waived", occupant_count_basis: "=occupant_count_basis"}
        All-Inclusive Utility Package: {covers_water_sewer: "=covers_water_sewer", covers_trash: "=covers_trash", covers_pest: "=covers_pest", covers_stormwater: "=covers_stormwater", covers_gas: "=covers_gas", covers_electric: "=covers_electric", water_billing_method: "=water_billing_method", move_in_setup_fee: "=move_in_setup_fee", transfer_setup_fee_waived: "=transfer_setup_fee_waived", occupant_count_basis: "=occupant_count_basis"}

  - id: utility_evt_submetered_usage
    subject: [utility_meter_read, utility_usage_billback]
    rule: >-
      Usage lines post only while the account is active or in final_billing.
      Each metered service covered by the program is read on the last day of every billing period (billing_period_basis
      calendar_month), on the service start date and on the service end date; the service start read only opens the
      meter and bills nothing, and the service end read closes the final period in place of a period-end read. The usage line for a period bills
      usage_quantity times the service rate (water_rate_per_kgal, gas_rate_per_therm or electric_rate_per_kwh) plus the
      service's fixed monthly charge prorated by days of responsibility, rounded half up to the cent; sewer is billed as a
      separate line on the metered water usage at sewer_rate_per_kgal plus sewer_base_charge_monthly when
      sewer_billing_basis is metered_water. When an actual read cannot be obtained the usage is estimated as
      utility_msr_average_usage, prorated by days, and the line is marked estimated; no more than
      estimated_read_max_consecutive consecutive estimates may be billed, after which the next period waits for an actual
      read. When true_up_on_actual_read is true, the first actual read after estimates bills the actual cumulative usage
      since the last actual read less the usage already billed on the estimates; when that difference is negative the
      over-billed amount is credited by an estimated_read_true_up adjustment. Lines of the previous month are issued on
      bill_issue_day.
    eligibility:
      - id: usage_account_billable
        applies_to: [utility_usage_billback]
        kind: state
        condition: "Usage lines post only while the account is active or in final_billing."
        evidence_fields: [utility_accounts.utility_account_id, utility_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_accounts.utility_account_id]
          action_bindings:
            utility_accounts.utility_account_id: utility_account_id
        state_contract:
          field: utility_accounts.status
          allowed: [active, final_billing]
    params:
      per_tier:
        Essentials Utility Plan: {water_rate_per_kgal: "=water_rate_per_kgal", sewer_rate_per_kgal: "=sewer_rate_per_kgal", water_base_charge_monthly: "=water_base_charge_monthly", sewer_base_charge_monthly: "=sewer_base_charge_monthly", sewer_billing_basis: "=sewer_billing_basis", gas_rate_per_therm: "=gas_rate_per_therm", gas_base_charge_monthly: "=gas_base_charge_monthly", electric_rate_per_kwh: "=electric_rate_per_kwh", electric_base_charge_monthly: "=electric_base_charge_monthly", estimated_read_max_consecutive: "=estimated_read_max_consecutive", estimate_history_periods: "=estimate_history_periods", true_up_on_actual_read: "=true_up_on_actual_read", bill_issue_day: "=bill_issue_day"}
        Water-Sewer-Trash Allocation Plan: {water_rate_per_kgal: "=water_rate_per_kgal", sewer_rate_per_kgal: "=sewer_rate_per_kgal", water_base_charge_monthly: "=water_base_charge_monthly", sewer_base_charge_monthly: "=sewer_base_charge_monthly", sewer_billing_basis: "=sewer_billing_basis", gas_rate_per_therm: "=gas_rate_per_therm", gas_base_charge_monthly: "=gas_base_charge_monthly", electric_rate_per_kwh: "=electric_rate_per_kwh", electric_base_charge_monthly: "=electric_base_charge_monthly", estimated_read_max_consecutive: "=estimated_read_max_consecutive", estimate_history_periods: "=estimate_history_periods", true_up_on_actual_read: "=true_up_on_actual_read", bill_issue_day: "=bill_issue_day"}
        Submetered Water Plan: {water_rate_per_kgal: "=water_rate_per_kgal", sewer_rate_per_kgal: "=sewer_rate_per_kgal", water_base_charge_monthly: "=water_base_charge_monthly", sewer_base_charge_monthly: "=sewer_base_charge_monthly", sewer_billing_basis: "=sewer_billing_basis", gas_rate_per_therm: "=gas_rate_per_therm", gas_base_charge_monthly: "=gas_base_charge_monthly", electric_rate_per_kwh: "=electric_rate_per_kwh", electric_base_charge_monthly: "=electric_base_charge_monthly", estimated_read_max_consecutive: "=estimated_read_max_consecutive", estimate_history_periods: "=estimate_history_periods", true_up_on_actual_read: "=true_up_on_actual_read", bill_issue_day: "=bill_issue_day"}
        Submetered Water & Gas Plan: {water_rate_per_kgal: "=water_rate_per_kgal", sewer_rate_per_kgal: "=sewer_rate_per_kgal", water_base_charge_monthly: "=water_base_charge_monthly", sewer_base_charge_monthly: "=sewer_base_charge_monthly", sewer_billing_basis: "=sewer_billing_basis", gas_rate_per_therm: "=gas_rate_per_therm", gas_base_charge_monthly: "=gas_base_charge_monthly", electric_rate_per_kwh: "=electric_rate_per_kwh", electric_base_charge_monthly: "=electric_base_charge_monthly", estimated_read_max_consecutive: "=estimated_read_max_consecutive", estimate_history_periods: "=estimate_history_periods", true_up_on_actual_read: "=true_up_on_actual_read", bill_issue_day: "=bill_issue_day"}
        Submetered Water, Gas & Electric Plan: {water_rate_per_kgal: "=water_rate_per_kgal", sewer_rate_per_kgal: "=sewer_rate_per_kgal", water_base_charge_monthly: "=water_base_charge_monthly", sewer_base_charge_monthly: "=sewer_base_charge_monthly", sewer_billing_basis: "=sewer_billing_basis", gas_rate_per_therm: "=gas_rate_per_therm", gas_base_charge_monthly: "=gas_base_charge_monthly", electric_rate_per_kwh: "=electric_rate_per_kwh", electric_base_charge_monthly: "=electric_base_charge_monthly", estimated_read_max_consecutive: "=estimated_read_max_consecutive", estimate_history_periods: "=estimate_history_periods", true_up_on_actual_read: "=true_up_on_actual_read", bill_issue_day: "=bill_issue_day"}
        All-Inclusive Utility Package: {water_rate_per_kgal: "=water_rate_per_kgal", sewer_rate_per_kgal: "=sewer_rate_per_kgal", water_base_charge_monthly: "=water_base_charge_monthly", sewer_base_charge_monthly: "=sewer_base_charge_monthly", sewer_billing_basis: "=sewer_billing_basis", gas_rate_per_therm: "=gas_rate_per_therm", gas_base_charge_monthly: "=gas_base_charge_monthly", electric_rate_per_kwh: "=electric_rate_per_kwh", electric_base_charge_monthly: "=electric_base_charge_monthly", estimated_read_max_consecutive: "=estimated_read_max_consecutive", estimate_history_periods: "=estimate_history_periods", true_up_on_actual_read: "=true_up_on_actual_read", bill_issue_day: "=bill_issue_day"}
    formula:
      water_usage_charge: round(usage_quantity * water_rate_per_kgal, 2)
      sewer_usage_charge: round(usage_quantity * sewer_rate_per_kgal, 2)
      gas_usage_charge: round(usage_quantity * gas_rate_per_therm, 2)
      electric_usage_charge: round(usage_quantity * electric_rate_per_kwh, 2)
    measures: [utility_msr_average_usage, utility_msr_consecutive_estimates]

  - id: utility_evt_allocation
    subject: [utility_allocation_billback]
    rule: >-
      Allocation lines post only while the account is active or in final_billing.
      On an allocation program the community's water and sewer provider bill for the period (property_bill_amount) is
      first reduced by rubs_common_area_deduction_pct for common areas. The apartment home's allocation_factor is
      rubs_occupant_weight times its occupant factor (rubs_occupant_factors for billed_occupants, five or more using the
      five-person factor) divided by the sum of the occupant factors of all occupied apartment homes, plus rubs_sqft_weight
      times its unit_square_feet divided by the total square feet of occupied apartment homes; the billing vendor computes
      it to six decimals and records it on the line. The allocated amount is the deducted bill times allocation_factor,
      prorated by days of responsibility over the days of the period, rounded half up to the cent, and never more than
      rubs_max_monthly for the service per month. Vacant apartment homes are never allocated to residents. In TX the
      billing administration fee on an allocation program may not exceed tx_admin_fee_cap_pct_of_bill of the household's
      water and sewer charges for the period.
    eligibility:
      - id: allocation_account_billable
        applies_to: [utility_allocation_billback]
        kind: state
        condition: "Allocation lines post only while the account is active or in final_billing."
        evidence_fields: [utility_accounts.utility_account_id, utility_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_accounts.utility_account_id]
          action_bindings:
            utility_accounts.utility_account_id: utility_account_id
        state_contract:
          field: utility_accounts.status
          allowed: [active, final_billing]
    params:
      tx_admin_fee_cap_pct_of_bill: 0.09
      per_tier:
        Essentials Utility Plan: {rubs_common_area_deduction_pct: "=rubs_common_area_deduction_pct", rubs_occupant_weight: "=rubs_occupant_weight", rubs_sqft_weight: "=rubs_sqft_weight", rubs_occupant_factors: "=rubs_occupant_factors", rubs_max_monthly: "=rubs_max_monthly"}
        Water-Sewer-Trash Allocation Plan: {rubs_common_area_deduction_pct: "=rubs_common_area_deduction_pct", rubs_occupant_weight: "=rubs_occupant_weight", rubs_sqft_weight: "=rubs_sqft_weight", rubs_occupant_factors: "=rubs_occupant_factors", rubs_max_monthly: "=rubs_max_monthly"}
        Submetered Water Plan: {rubs_common_area_deduction_pct: "=rubs_common_area_deduction_pct", rubs_occupant_weight: "=rubs_occupant_weight", rubs_sqft_weight: "=rubs_sqft_weight", rubs_occupant_factors: "=rubs_occupant_factors", rubs_max_monthly: "=rubs_max_monthly"}
        Submetered Water & Gas Plan: {rubs_common_area_deduction_pct: "=rubs_common_area_deduction_pct", rubs_occupant_weight: "=rubs_occupant_weight", rubs_sqft_weight: "=rubs_sqft_weight", rubs_occupant_factors: "=rubs_occupant_factors", rubs_max_monthly: "=rubs_max_monthly"}
        Submetered Water, Gas & Electric Plan: {rubs_common_area_deduction_pct: "=rubs_common_area_deduction_pct", rubs_occupant_weight: "=rubs_occupant_weight", rubs_sqft_weight: "=rubs_sqft_weight", rubs_occupant_factors: "=rubs_occupant_factors", rubs_max_monthly: "=rubs_max_monthly"}
        All-Inclusive Utility Package: {rubs_common_area_deduction_pct: "=rubs_common_area_deduction_pct", rubs_occupant_weight: "=rubs_occupant_weight", rubs_sqft_weight: "=rubs_sqft_weight", rubs_occupant_factors: "=rubs_occupant_factors", rubs_max_monthly: "=rubs_max_monthly"}
    formula:
      allocated_amount: min(round(property_bill_amount * (1 - rubs_common_area_deduction_pct) * allocation_factor * proration_days / days_in_period, 2), rubs_max_monthly)

  - id: utility_evt_flat_and_package
    subject: [utility_flat_charge, utility_package_overage]
    rule: >-
      Flat and package lines post only while the account is active or in final_billing.
      Each covered flat service (trash_flat_monthly, pest_flat_monthly, stormwater_flat_monthly) and the
      billing_admin_fee_monthly post once per billing period; a flat amount of 0.00 posts no line. On the All-Inclusive
      Utility Package the package_monthly_fee posts once per period instead of every flat and usage line. Flat amounts,
      the package fee and the package allowances are prorated for a partial first or last month by days of responsibility
      over the actual days of the period (proration_method), rounded half up to the cent (allowances to 3 decimals). Usage
      of water, gas or electricity above its prorated allowance is billed as an overage line at the submetered rate times
      package_overage_rate_multiplier, water overage also carrying the sewer rate; usage within the allowance is never
      billed and unused allowance never carries over. A meter_test_fee line posts only for a resident-requested meter test
      that finds the meter within meter_accuracy_tolerance_pct.
    eligibility:
      - id: flat_account_billable
        applies_to: [utility_flat_charge, utility_package_overage]
        kind: state
        condition: "Flat and package lines post only while the account is active or in final_billing."
        evidence_fields: [utility_accounts.utility_account_id, utility_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_accounts.utility_account_id]
          action_bindings:
            utility_accounts.utility_account_id: utility_account_id
        state_contract:
          field: utility_accounts.status
          allowed: [active, final_billing]
    params:
      per_tier:
        Essentials Utility Plan: {covers_trash: "=covers_trash", covers_pest: "=covers_pest", covers_stormwater: "=covers_stormwater", trash_flat_monthly: "=trash_flat_monthly", pest_flat_monthly: "=pest_flat_monthly", stormwater_flat_monthly: "=stormwater_flat_monthly", billing_admin_fee_monthly: "=billing_admin_fee_monthly", package_monthly_fee: "=package_monthly_fee", package_water_allowance_kgal: "=package_water_allowance_kgal", package_gas_allowance_therms: "=package_gas_allowance_therms", package_electric_allowance_kwh: "=package_electric_allowance_kwh", package_overage_rate_multiplier: "=package_overage_rate_multiplier", proration_method: "=proration_method", meter_test_fee: "=meter_test_fee"}
        Water-Sewer-Trash Allocation Plan: {covers_trash: "=covers_trash", covers_pest: "=covers_pest", covers_stormwater: "=covers_stormwater", trash_flat_monthly: "=trash_flat_monthly", pest_flat_monthly: "=pest_flat_monthly", stormwater_flat_monthly: "=stormwater_flat_monthly", billing_admin_fee_monthly: "=billing_admin_fee_monthly", package_monthly_fee: "=package_monthly_fee", package_water_allowance_kgal: "=package_water_allowance_kgal", package_gas_allowance_therms: "=package_gas_allowance_therms", package_electric_allowance_kwh: "=package_electric_allowance_kwh", package_overage_rate_multiplier: "=package_overage_rate_multiplier", proration_method: "=proration_method", meter_test_fee: "=meter_test_fee"}
        Submetered Water Plan: {covers_trash: "=covers_trash", covers_pest: "=covers_pest", covers_stormwater: "=covers_stormwater", trash_flat_monthly: "=trash_flat_monthly", pest_flat_monthly: "=pest_flat_monthly", stormwater_flat_monthly: "=stormwater_flat_monthly", billing_admin_fee_monthly: "=billing_admin_fee_monthly", package_monthly_fee: "=package_monthly_fee", package_water_allowance_kgal: "=package_water_allowance_kgal", package_gas_allowance_therms: "=package_gas_allowance_therms", package_electric_allowance_kwh: "=package_electric_allowance_kwh", package_overage_rate_multiplier: "=package_overage_rate_multiplier", proration_method: "=proration_method", meter_test_fee: "=meter_test_fee"}
        Submetered Water & Gas Plan: {covers_trash: "=covers_trash", covers_pest: "=covers_pest", covers_stormwater: "=covers_stormwater", trash_flat_monthly: "=trash_flat_monthly", pest_flat_monthly: "=pest_flat_monthly", stormwater_flat_monthly: "=stormwater_flat_monthly", billing_admin_fee_monthly: "=billing_admin_fee_monthly", package_monthly_fee: "=package_monthly_fee", package_water_allowance_kgal: "=package_water_allowance_kgal", package_gas_allowance_therms: "=package_gas_allowance_therms", package_electric_allowance_kwh: "=package_electric_allowance_kwh", package_overage_rate_multiplier: "=package_overage_rate_multiplier", proration_method: "=proration_method", meter_test_fee: "=meter_test_fee"}
        Submetered Water, Gas & Electric Plan: {covers_trash: "=covers_trash", covers_pest: "=covers_pest", covers_stormwater: "=covers_stormwater", trash_flat_monthly: "=trash_flat_monthly", pest_flat_monthly: "=pest_flat_monthly", stormwater_flat_monthly: "=stormwater_flat_monthly", billing_admin_fee_monthly: "=billing_admin_fee_monthly", package_monthly_fee: "=package_monthly_fee", package_water_allowance_kgal: "=package_water_allowance_kgal", package_gas_allowance_therms: "=package_gas_allowance_therms", package_electric_allowance_kwh: "=package_electric_allowance_kwh", package_overage_rate_multiplier: "=package_overage_rate_multiplier", proration_method: "=proration_method", meter_test_fee: "=meter_test_fee"}
        All-Inclusive Utility Package: {covers_trash: "=covers_trash", covers_pest: "=covers_pest", covers_stormwater: "=covers_stormwater", trash_flat_monthly: "=trash_flat_monthly", pest_flat_monthly: "=pest_flat_monthly", stormwater_flat_monthly: "=stormwater_flat_monthly", billing_admin_fee_monthly: "=billing_admin_fee_monthly", package_monthly_fee: "=package_monthly_fee", package_water_allowance_kgal: "=package_water_allowance_kgal", package_gas_allowance_therms: "=package_gas_allowance_therms", package_electric_allowance_kwh: "=package_electric_allowance_kwh", package_overage_rate_multiplier: "=package_overage_rate_multiplier", proration_method: "=proration_method", meter_test_fee: "=meter_test_fee"}
    formula:
      prorated_flat: round(trash_flat_monthly * proration_days / days_in_period, 2)
      prorated_package_fee: round(package_monthly_fee * proration_days / days_in_period, 2)

  - id: utility_evt_adjustments_and_disputes
    subject: [utility_bill_adjustment]
    rule: >-
      A utility bill line is corrected only through a dispute recorded against that line, except an estimated_read_true_up,
      which follows automatically from the next actual read.
      A dispute may be accepted only when the frozen date is no later than the bill date of the disputed line plus dispute_window_days.
      Dispute days are counted as calendar days starting the day after the bill date, and the last counted day is included.
      Disputes are decided within dispute_response_business_days business days (Monday-Friday, federal holidays excluded).
      A leak_adjustment is granted when the disputed usage line's usage_quantity is at least leak_usage_threshold_multiple
      times utility_msr_average_usage, the leak was inside the apartment home and repaired by a maintenance work order
      completed within leak_repair_proof_days after the bill date, and utility_msr_leak_adjustments_12m is below
      leak_adjustments_per_12_months; it credits leak_adjustment_credit_pct of the charge for the usage above
      utility_msr_average_usage, rounded half up to the cent. An occupancy_correction credits the difference when a line
      was billed on a billed_occupants figure other than the one in force for that period. A billing_error credits the
      part of a line computed against this charter. A meter_accuracy dispute is decided by a meter test: when the meter
      over-registers by more than meter_accuracy_tolerance_pct, the usage lines since the last accurate test, at most
      the lines still within the dispute window, are re-billed by crediting the over-registered share; otherwise the
      meter_test_fee is charged and no credit is made. Allocation programs have no leak adjustment, because an allocation
      does not measure the apartment home's own use. Each bill line is credited at most once per reason.
    eligibility:
      - id: dispute_within_window
        applies_to: [utility_bill_adjustment]
        kind: time
        condition: "A dispute may be accepted only when the frozen date is no later than the bill date of the disputed line plus dispute_window_days."
        evidence_fields: [utility_bills.bill_id, utility_bills.bill_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_bills.bill_id]
          action_bindings:
            utility_bills.bill_id: source_bill_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the bill date of the disputed line
          anchor_source: utility_bills.bill_date
          relation: not_after
          duration_source: variants.dispute_window_days
          unit: calendar_days
          counting_rule: "Dispute days are counted as calendar days starting the day after the bill date, and the last counted day is included."
          boundary: inclusive
      - id: credit_once_per_reason
        applies_to: [utility_bill_adjustment]
        kind: dedup
        condition: "Each bill line is credited at most once per reason."
        evidence_fields: [utility_bills.source_bill_id, utility_bills.adjustment_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_bills.source_bill_id]
          action_bindings:
            utility_bills.source_bill_id: source_bill_id
        dedup_contract:
          table: utility_bills
          mode: separate_record
          object_bindings: {source_bill_id: source_bill_id}
          duplicate_filters: {event_type: [utility_bill_adjustment]}
          distinct_fields: [adjustment_reason]
      - id: repair_on_work_order
        applies_to: [utility_bill_adjustment]
        kind: authorization
        condition: "A utility bill line is corrected only through a dispute recorded against that line, except an estimated_read_true_up, which follows automatically from the next actual read."
        evidence_fields: [utility_disputes.dispute_id, utility_disputes.bill_id, utility_disputes.dispute_reason, utility_disputes.leak_repair_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_disputes.bill_id]
          action_bindings:
            utility_disputes.bill_id: source_bill_id
    params:
      per_tier:
        Essentials Utility Plan: {dispute_window_days: "=dispute_window_days", dispute_response_business_days: "=dispute_response_business_days", leak_adjustments_per_12_months: "=leak_adjustments_per_12_months", leak_adjustment_credit_pct: "=leak_adjustment_credit_pct", leak_usage_threshold_multiple: "=leak_usage_threshold_multiple", leak_repair_proof_days: "=leak_repair_proof_days", meter_accuracy_tolerance_pct: "=meter_accuracy_tolerance_pct"}
        Water-Sewer-Trash Allocation Plan: {dispute_window_days: "=dispute_window_days", dispute_response_business_days: "=dispute_response_business_days", leak_adjustments_per_12_months: "=leak_adjustments_per_12_months", leak_adjustment_credit_pct: "=leak_adjustment_credit_pct", leak_usage_threshold_multiple: "=leak_usage_threshold_multiple", leak_repair_proof_days: "=leak_repair_proof_days", meter_accuracy_tolerance_pct: "=meter_accuracy_tolerance_pct"}
        Submetered Water Plan: {dispute_window_days: "=dispute_window_days", dispute_response_business_days: "=dispute_response_business_days", leak_adjustments_per_12_months: "=leak_adjustments_per_12_months", leak_adjustment_credit_pct: "=leak_adjustment_credit_pct", leak_usage_threshold_multiple: "=leak_usage_threshold_multiple", leak_repair_proof_days: "=leak_repair_proof_days", meter_accuracy_tolerance_pct: "=meter_accuracy_tolerance_pct"}
        Submetered Water & Gas Plan: {dispute_window_days: "=dispute_window_days", dispute_response_business_days: "=dispute_response_business_days", leak_adjustments_per_12_months: "=leak_adjustments_per_12_months", leak_adjustment_credit_pct: "=leak_adjustment_credit_pct", leak_usage_threshold_multiple: "=leak_usage_threshold_multiple", leak_repair_proof_days: "=leak_repair_proof_days", meter_accuracy_tolerance_pct: "=meter_accuracy_tolerance_pct"}
        Submetered Water, Gas & Electric Plan: {dispute_window_days: "=dispute_window_days", dispute_response_business_days: "=dispute_response_business_days", leak_adjustments_per_12_months: "=leak_adjustments_per_12_months", leak_adjustment_credit_pct: "=leak_adjustment_credit_pct", leak_usage_threshold_multiple: "=leak_usage_threshold_multiple", leak_repair_proof_days: "=leak_repair_proof_days", meter_accuracy_tolerance_pct: "=meter_accuracy_tolerance_pct"}
        All-Inclusive Utility Package: {dispute_window_days: "=dispute_window_days", dispute_response_business_days: "=dispute_response_business_days", leak_adjustments_per_12_months: "=leak_adjustments_per_12_months", leak_adjustment_credit_pct: "=leak_adjustment_credit_pct", leak_usage_threshold_multiple: "=leak_usage_threshold_multiple", leak_repair_proof_days: "=leak_repair_proof_days", meter_accuracy_tolerance_pct: "=meter_accuracy_tolerance_pct"}
    formula:
      leak_credit: round(leak_adjustment_credit_pct * (usage_quantity - utility_msr_average_usage) * water_rate_per_kgal, 2)
    measures: [utility_msr_average_usage, utility_msr_leak_adjustments_12m]

  - id: utility_evt_occupancy
    subject: [utility_occupancy_update]
    rule: >-
      billed_occupants changes only when the lease's approved occupants_count changes through a signed lease
      modification, and the new count applies from the next billing period (occupancy_change_effective); a resident's
      statement that someone moved out without a signed modification never changes it. A change is never applied to a
      period already billed except through an occupancy_correction when the billed figure was not the one in force.
    eligibility:
      - id: occupants_from_lease
        applies_to: [utility_occupancy_update]
        kind: authorization
        condition: "billed_occupants changes only when the lease's approved occupants_count changes through a signed lease modification, and the new count applies from the next billing period (occupancy_change_effective); a resident's statement that someone moved out without a signed modification never changes it."
        evidence_fields: [leases.lease_id, leases.occupants_count]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [leases.lease_id]
          action_bindings:
            leases.lease_id: lease_id
    params:
      per_tier:
        Essentials Utility Plan: {occupancy_change_effective: "=occupancy_change_effective", occupant_count_basis: "=occupant_count_basis"}
        Water-Sewer-Trash Allocation Plan: {occupancy_change_effective: "=occupancy_change_effective", occupant_count_basis: "=occupant_count_basis"}
        Submetered Water Plan: {occupancy_change_effective: "=occupancy_change_effective", occupant_count_basis: "=occupant_count_basis"}
        Submetered Water & Gas Plan: {occupancy_change_effective: "=occupancy_change_effective", occupant_count_basis: "=occupant_count_basis"}
        Submetered Water, Gas & Electric Plan: {occupancy_change_effective: "=occupancy_change_effective", occupant_count_basis: "=occupant_count_basis"}
        All-Inclusive Utility Package: {occupancy_change_effective: "=occupancy_change_effective", occupant_count_basis: "=occupant_count_basis"}

  - id: utility_evt_payments
    subject: [utility_payment]
    rule: >-
      Utility payments are accepted only while the account is active or in final_billing.
      A payment is made in any lease-accepted instrument (the lease's certified-funds restriction applies here as well),
      or by deposit_application at final accounting, and it is applied to the account's oldest open bill line first.
    eligibility:
      - id: payment_account_open
        applies_to: [utility_payment]
        kind: state
        condition: "Utility payments are accepted only while the account is active or in final_billing."
        evidence_fields: [utility_accounts.utility_account_id, utility_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [utility_accounts.utility_account_id]
          action_bindings:
            utility_accounts.utility_account_id: utility_account_id
        state_contract:
          field: utility_accounts.status
          allowed: [active, final_billing]

  - id: utility_final_bill_and_close
    subject: [utility_final_billing, utility_close]
    rule: >-
      Billing responsibility ends on the service end date, which is the lease's move-out date or the transfer move date.
      Final reads are taken on that date, and the final bill — the last period's usage, allocation or overage lines and
      flat or package lines prorated through the service end date — is issued within final_bill_days_after_move_out
      calendar days. No line may be billed for any day after the service end date; the utility of a vacant apartment home
      is the community's cost. An account is closed only once its final bill has been issued and its balance is zero or
      has been carried into the final account statement. An account that never activated is closed with no bill when its
      lease application is withdrawn.
    eligibility: []
    params:
      per_tier:
        Essentials Utility Plan: {final_bill_days_after_move_out: "=final_bill_days_after_move_out"}
        Water-Sewer-Trash Allocation Plan: {final_bill_days_after_move_out: "=final_bill_days_after_move_out"}
        Submetered Water Plan: {final_bill_days_after_move_out: "=final_bill_days_after_move_out"}
        Submetered Water & Gas Plan: {final_bill_days_after_move_out: "=final_bill_days_after_move_out"}
        Submetered Water, Gas & Electric Plan: {final_bill_days_after_move_out: "=final_bill_days_after_move_out"}
        All-Inclusive Utility Package: {final_bill_days_after_move_out: "=final_bill_days_after_move_out"}

extended_policies:
  - id: utility_ext_gas_trueup_line
    base_policy_refs: [utility_evt_submetered_usage]
    overwrite:
      - base_policy: utility_evt_submetered_usage
        superseded_clause: >-
          When true_up_on_actual_read is true, the first actual read after estimates bills the actual cumulative usage
          since the last actual read less the usage already billed on the estimates;
        replaced_by: >-
          When the gas catch-up is above zero the line bills, in place of the gas true-up usage, the true-up period's own gas usage plus the counted catch-up, rounded to 3 decimals; when it is zero the line bills the gas true-up usage, and when the gas true-up usage is below zero the line bills no usage, the over-billed usage being credited by the estimated-read true-up adjustment the base rule provides.
      - base_policy: utility_evt_submetered_usage
        superseded_clause: >-
          The usage line for a period bills usage_quantity times the service rate (water_rate_per_kgal,
          gas_rate_per_therm or electric_rate_per_kwh) plus the service's fixed monthly charge prorated by days of
          responsibility, rounded half up to the cent;
        replaced_by: >-
          The line's amount is its usage charge plus its gas service charge less the returned service charges, never
          below zero, rounded half up to the cent.
    trigger: state_due
    subject: [utility_usage_billback]
    computes: amount
    target_tool: post_gas_trueup_line_465c860d
    params:
      backbill_limit_strict: 1.0
      backbill_limit_moderate: 1.5
      relief_tenure_months: 24
      relief_half: 0.5
      relief_three_quarters: 0.75
      price_share_autopay: 0.80
      price_share_manual: 0.90
      standing_payment_count: 6
      full_share: 1.0
      long_renewals: 3
      short_renewals: 1
      service_waived: 0.0
      service_half: 0.5
      return_full: 1.0
      return_half: 0.5
      return_none: 0.0
    rule: >-
      The gas true-up line is the gas usage line of the billing period closed by an actual gas read that follows one
      or more estimated gas reads; it is issued at the first bill issue after that read and is owed from that bill
      issue day until it stands on the account. The gas true-up usage is the actual cumulative gas usage since the
      last actual gas read less the gas usage already billed on the estimated gas lines. The actual cumulative gas usage is the usage recorded on the account's latest gas read, which is the actual read, plus the usage recorded on the estimated gas reads dated fewer than three whole months before the billing date, which are the estimated reads it follows. The gas usage already billed on estimates is
      the sum of the usage on the estimated gas usage lines issued fewer than three whole months before the billing
      date. Each sum of recorded gas usage is taken to 2 decimals, and the gas true-up usage is rounded to 3 decimals. The gas true-up line bills the gas true-up usage times
      gas_rate_per_therm, rounded half up to the cent, plus the gas service charge of gas_base_charge_monthly.
      The true-up period's own gas usage is the actual cumulative gas usage divided by the number of estimated gas
      reads in that window plus one, rounded to 3 decimals, and the gas catch-up is the gas true-up usage less that own
      usage, never below zero. The gas catch-up that may be billed is capped by the back-billing limit of the
      community's state as recorded on the lease: in CO or WA it may not exceed backbill_limit_strict times the
      true-up period's own gas usage; in CA or AZ it may not exceed backbill_limit_moderate times that own usage; in any
      other state the gas catch-up is not capped; each cap is rounded to 3 decimals. The capped gas catch-up is counted
      according to the estimate run and the resident's tenure: when the estimated gas reads in the window number at
      least estimated_read_max_consecutive and the lease's move-in date lies at least relief_tenure_months whole months
      before the billing date, the capped gas catch-up is halved and rounded down to a whole therm; when the estimated
      gas reads number at least estimated_read_max_consecutive and the move-in date lies fewer than
      relief_tenure_months whole months before the billing date, the capped gas catch-up is multiplied by
      relief_three_quarters and rounded up to a whole therm; in every other situation the capped gas catch-up is
      counted as measured. When the gas catch-up is above zero the line bills, in place of the gas true-up usage, the true-up period's own gas usage plus the counted catch-up, rounded to 3 decimals; when it is zero the line bills the gas true-up usage, and when the gas true-up usage is below zero the line bills no usage, the over-billed usage being credited by the estimated-read true-up adjustment the base rule provides. The counted catch-up therms are priced at a catch-up price share of gas_rate_per_therm set
      by the resident's payment standing: price_share_autopay when the lease is enrolled in rent autopay and at least
      standing_payment_count utility payments were received fewer than six whole months before the billing date;
      price_share_manual when at least standing_payment_count utility payments were received in that time and the
      lease is not enrolled in autopay; the full rate in every other situation. The usage charge of a line with a gas
      catch-up is the own gas usage plus the counted catch-up times the catch-up price share, rounded to 3 decimals,
      then times gas_rate_per_therm, rounded half up to the cent once at the end; the usage charge of a line without a
      gas catch-up is the billed gas usage times gas_rate_per_therm, rounded half up to the cent. The gas service
      charge on the true-up line is waived when the estimated gas reads number at least estimated_read_max_consecutive
      and the lease has at least long_renewals renewal rent changes on record; it is halved when the estimated gas
      reads number at least estimated_read_max_consecutive and the lease has at least short_renewals but fewer than
      long_renewals renewal rent changes on record; in every other situation the whole gas_base_charge_monthly
      applies; the gas service charge is rounded half up to the cent. The gas service charges already billed on the
      estimated gas lines, gas_base_charge_monthly for each estimated gas read in the window, are returned on the
      true-up line at a return share set by the community's state as recorded on the lease: in full in CO or WA, one
      half in CA or AZ, and not at all in any other state; the returned amount is rounded half up to the cent. The
      line's amount is its usage charge plus its gas service charge less the returned service charges, never below
      zero, rounded half up to the cent.
    prerequisite: []
    cross_category:
      - category: lease
        as: branch
        reads: [community_state, move_in_date, autopay_enrolled]
        note: The lease's community state caps the catch-up and sets the return share, its move-in date sets the catch-up relief, and its autopay enrollment sets the catch-up price share.
      - category: term
        as: history
        reads: [term_rent_changes.change_reason]
        note: The count of renewal rent changes on the lease's terms sets the gas service charge share on the true-up line.
    compute:
      - gt_cum: "LATEST('utility_meter_reads', 'usage_quantity', date_field='read_date', service_type='gas') + SUM('utility_meter_reads', 'usage_quantity', within_months=3, date_field='read_date', service_type='gas', read_type='estimated')"
      - gt_est_billed: "SUM('utility_bills', 'usage_quantity', within_months=3, date_field='bill_date', event_type='utility_usage_billback', service_type='gas', read_type='estimated')"
      - gt_est_reads: "COUNT('utility_meter_reads', within_months=3, date_field='read_date', service_type='gas', read_type='estimated')"
      - gt_trueup_usage: "RND(gt_cum - gt_est_billed, 3)"
      - gt_own_usage: "RND(gt_cum / (gt_est_reads + 1), 3)"
      - gt_catchup: "MX(0, RND(gt_trueup_usage - gt_own_usage, 3))"
      - gt_state: "CFIELD('lease', 'community_state')"
      - gt_catchup_cap: "RND(K('backbill_limit_strict') * gt_own_usage, 3) if (gt_state == 'CO' or gt_state == 'WA') else (RND(K('backbill_limit_moderate') * gt_own_usage, 3) if (gt_state == 'CA' or gt_state == 'AZ') else gt_catchup)"
      - gt_catchup_capped: "MN(gt_catchup, gt_catchup_cap)"
      - gt_tenure: "MONTHS(CFIELD('lease', 'move_in_date'), NOW)"
      - gt_catchup_counted: "int(gt_catchup_capped * K('relief_half')) if (gt_est_reads >= P('estimated_read_max_consecutive') and gt_tenure >= K('relief_tenure_months')) else ((int(gt_catchup_capped * K('relief_three_quarters')) + (1 if gt_catchup_capped * K('relief_three_quarters') > int(gt_catchup_capped * K('relief_three_quarters')) else 0)) if (gt_est_reads >= P('estimated_read_max_consecutive') and gt_tenure < K('relief_tenure_months')) else gt_catchup_capped)"
      - gt_billed_usage: "RND(gt_own_usage + gt_catchup_counted, 3) if gt_catchup > 0 else MX(0, gt_trueup_usage)"
      - gt_autopay: "CFIELD('lease', 'autopay_enrolled')"
      - gt_payments: "COUNT('utility_bills', within_months=6, date_field='bill_date', event_type='utility_payment')"
      - gt_price_share: "K('price_share_autopay') if (gt_autopay and gt_payments >= K('standing_payment_count')) else (K('price_share_manual') if ((not gt_autopay) and gt_payments >= K('standing_payment_count')) else K('full_share'))"
      - gt_priced_usage: "RND(gt_own_usage + gt_catchup_counted * gt_price_share, 3) if gt_catchup > 0 else gt_billed_usage"
      - gt_usage_charge: "RND(gt_priced_usage * P('gas_rate_per_therm'), 2)"
      - gt_renewals: "XCOUNT('term', 'term_rent_changes', event_type='term_rent_change', change_reason='renewal')"
      - gt_service_share: "K('service_waived') if (gt_est_reads >= P('estimated_read_max_consecutive') and gt_renewals >= K('long_renewals')) else (K('service_half') if (gt_est_reads >= P('estimated_read_max_consecutive') and gt_renewals >= K('short_renewals') and gt_renewals < K('long_renewals')) else K('full_share'))"
      - gt_service_charge: "RND(P('gas_base_charge_monthly') * gt_service_share, 2)"
      - gt_state_return: "CFIELD('lease', 'community_state')"
      - gt_return_share: "K('return_full') if (gt_state_return == 'CO' or gt_state_return == 'WA') else (K('return_half') if (gt_state_return == 'CA' or gt_state_return == 'AZ') else K('return_none'))"
      - gt_returned_charges: "RND(gt_est_reads * P('gas_base_charge_monthly') * gt_return_share, 2)"
      - result: "MX(0, RND(gt_usage_charge + gt_service_charge - gt_returned_charges, 2))"
    compute_basis:
      gt_cum: "The actual cumulative gas usage is the usage recorded on the account's latest gas read, which is the actual read, plus the usage recorded on the estimated gas reads dated fewer than three whole months before the billing date, which are the estimated reads it follows."
      gt_est_billed: "The gas usage already billed on estimates is the sum of the usage on the estimated gas usage lines issued fewer than three whole months before the billing date."
      gt_est_reads: "The true-up period's own gas usage is the actual cumulative gas usage divided by the number of estimated gas reads in that window plus one, rounded to 3 decimals"
      gt_trueup_usage: "The gas true-up usage is the actual cumulative gas usage since the last actual gas read less the gas usage already billed on the estimated gas lines."
      gt_own_usage: "The true-up period's own gas usage is the actual cumulative gas usage divided by the number of estimated gas reads in that window plus one, rounded to 3 decimals"
      gt_catchup: "the gas catch-up is the gas true-up usage less that own usage, never below zero."
      gt_state: "The gas catch-up that may be billed is capped by the back-billing limit of the community's state as recorded on the lease"
      gt_catchup_cap: "in CO or WA it may not exceed backbill_limit_strict times the true-up period's own gas usage; in CA or AZ it may not exceed backbill_limit_moderate times that own usage; in any other state the gas catch-up is not capped; each cap is rounded to 3 decimals."
      gt_catchup_capped: "The gas catch-up that may be billed is capped by the back-billing limit of the community's state as recorded on the lease"
      gt_tenure: "the lease's move-in date lies at least relief_tenure_months whole months before the billing date"
      gt_catchup_counted: "when the estimated gas reads in the window number at least estimated_read_max_consecutive and the lease's move-in date lies at least relief_tenure_months whole months before the billing date, the capped gas catch-up is halved and rounded down to a whole therm; when the estimated gas reads number at least estimated_read_max_consecutive and the move-in date lies fewer than relief_tenure_months whole months before the billing date, the capped gas catch-up is multiplied by relief_three_quarters and rounded up to a whole therm; in every other situation the capped gas catch-up is counted as measured."
      gt_billed_usage: "When the gas catch-up is above zero the line bills, in place of the gas true-up usage, the true-up period's own gas usage plus the counted catch-up, rounded to 3 decimals; when it is zero the line bills the gas true-up usage, and when the gas true-up usage is below zero the line bills no usage, the over-billed usage being credited by the estimated-read true-up adjustment the base rule provides."
      gt_autopay: "price_share_autopay when the lease is enrolled in rent autopay"
      gt_payments: "at least standing_payment_count utility payments were received fewer than six whole months before the billing date"
      gt_price_share: "The counted catch-up therms are priced at a catch-up price share of gas_rate_per_therm set by the resident's payment standing: price_share_autopay when the lease is enrolled in rent autopay and at least standing_payment_count utility payments were received fewer than six whole months before the billing date; price_share_manual when at least standing_payment_count utility payments were received in that time and the lease is not enrolled in autopay; the full rate in every other situation."
      gt_priced_usage: "The usage charge of a line with a gas catch-up is the own gas usage plus the counted catch-up times the catch-up price share, rounded to 3 decimals, then times gas_rate_per_therm, rounded half up to the cent once at the end; the usage charge of a line without a gas catch-up is the billed gas usage times gas_rate_per_therm, rounded half up to the cent."
      gt_usage_charge: "then times gas_rate_per_therm, rounded half up to the cent once at the end"
      gt_renewals: "the lease has at least long_renewals renewal rent changes on record"
      gt_service_share: "The gas service charge on the true-up line is waived when the estimated gas reads number at least estimated_read_max_consecutive and the lease has at least long_renewals renewal rent changes on record; it is halved when the estimated gas reads number at least estimated_read_max_consecutive and the lease has at least short_renewals but fewer than long_renewals renewal rent changes on record; in every other situation the whole gas_base_charge_monthly applies; the gas service charge is rounded half up to the cent."
      gt_service_charge: "the gas service charge is rounded half up to the cent."
      gt_state_return: "at a return share set by the community's state as recorded on the lease"
      gt_return_share: "in full in CO or WA, one half in CA or AZ, and not at all in any other state"
      gt_returned_charges: "The gas service charges already billed on the estimated gas lines, gas_base_charge_monthly for each estimated gas read in the window, are returned on the true-up line at a return share set by the community's state as recorded on the lease: in full in CO or WA, one half in CA or AZ, and not at all in any other state; the returned amount is rounded half up to the cent."
      result: "The line's amount is its usage charge plus its gas service charge less the returned service charges, never below zero, rounded half up to the cent."
    factors:
      - id: backbill_state_cap
        effect: parameter
        decides: gt_catchup_cap
        bindings: [gt_state, gt_catchup_cap]
        ladder:
          - when: "the lease's community state is CO or WA"
            value: "K('backbill_limit_strict') times the true-up period's own gas usage"
          - when: "the lease's community state is CA or AZ"
            value: "K('backbill_limit_moderate') times the true-up period's own gas usage"
          - when: "otherwise"
            value: "no cap: the whole gas catch-up"
        baseline:
          gt_catchup_cap: "gt_catchup"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: catchup_relief
        effect: method
        decides: gt_catchup_counted
        bindings: [gt_tenure, gt_catchup_counted]
        ladder:
          - when: "the estimated gas reads in the window number at least estimated_read_max_consecutive and the lease's move-in date lies at least relief_tenure_months whole months before the billing date"
            method: "the capped gas catch-up is halved and rounded down to a whole therm"
          - when: "the estimated gas reads number at least estimated_read_max_consecutive and the move-in date lies fewer than relief_tenure_months whole months before the billing date"
            method: "the capped gas catch-up is multiplied by relief_three_quarters and rounded up to a whole therm"
          - when: "otherwise"
            method: "the capped gas catch-up is counted as measured"
        baseline:
          gt_catchup_counted: "gt_catchup_capped"
        evidence: [history, date, cross_category]
        cross_difficulty: lease
      - id: catchup_price_share
        effect: parameter
        decides: gt_price_share
        bindings: [gt_autopay, gt_payments, gt_price_share]
        ladder:
          - when: "the lease is enrolled in rent autopay and at least standing_payment_count utility payments were received fewer than six whole months before the billing date"
            value: "K('price_share_autopay')"
          - when: "at least standing_payment_count utility payments were received in that time and the lease is not enrolled in autopay"
            value: "K('price_share_manual')"
          - when: "otherwise"
            value: "the full rate"
        baseline:
          gt_price_share: "K('full_share')"
        evidence: [history, cross_category]
        cross_difficulty: lease
      - id: trueup_service_charge
        effect: parameter
        decides: gt_service_share
        bindings: [gt_renewals, gt_service_share]
        ladder:
          - when: "the estimated gas reads number at least estimated_read_max_consecutive and the lease has at least long_renewals renewal rent changes on record"
            value: "K('service_waived'): the gas service charge is waived"
          - when: "the estimated gas reads number at least estimated_read_max_consecutive and the lease has at least short_renewals but fewer than long_renewals renewal rent changes on record"
            value: "K('service_half'): the gas service charge is halved"
          - when: "otherwise"
            value: "the whole gas_base_charge_monthly"
        baseline:
          gt_service_share: "K('full_share')"
        evidence: [history, cross_category]
        cross_difficulty: term
      - id: estimate_charge_return
        effect: parameter
        decides: gt_return_share
        bindings: [gt_state_return, gt_return_share]
        ladder:
          - when: "the lease's community state is CO or WA"
            value: "K('return_full'): the estimated periods' gas service charges are returned in full"
          - when: "the lease's community state is CA or AZ"
            value: "K('return_half'): one half is returned"
          - when: "otherwise"
            value: "K('return_none'): nothing is returned"
        baseline:
          gt_return_share: "K('return_none')"
        evidence: [cross_category]
        cross_difficulty: lease
    baseline:
      rule: >-
        The gas true-up usage is the actual cumulative gas usage since the last actual gas read less the gas usage
        already billed on the estimated gas lines. The actual cumulative gas usage is the usage recorded on the account's latest gas read, which is the actual read, plus the usage recorded on the estimated gas reads dated fewer than three whole months before the billing date, which are the estimated reads it follows. The gas usage already billed on estimates is the sum of the usage on the estimated
        gas usage lines issued fewer than three whole months before the billing date. Each sum of recorded gas usage is taken to 2 decimals, and the gas true-up usage is rounded to 3 decimals. The gas true-up line bills the gas true-up usage times gas_rate_per_therm, rounded half up to
        the cent, plus the gas service charge of gas_base_charge_monthly.
      params: [gas_rate_per_therm, gas_base_charge_monthly]
    inputs:
      history:
        - {table: utility_meter_reads, aggregate: latest, field: usage_quantity, filters: {service_type: gas}}
        - {table: utility_meter_reads, aggregate: sum, field: usage_quantity, within_months: 3, filters: {service_type: gas, read_type: estimated}}
        - {table: utility_meter_reads, aggregate: count, field: read_id, within_months: 3, filters: {service_type: gas, read_type: estimated}}
        - {table: utility_bills, aggregate: sum, field: usage_quantity, within_months: 3, filters: {event_type: utility_usage_billback, service_type: gas, read_type: estimated}}
        - {table: utility_bills, aggregate: count, field: bill_id, within_months: 6, filters: {event_type: utility_payment}}
        - {category: term, table: term_rent_changes, aggregate: count, field: rent_change_id, filters: {event_type: term_rent_change, change_reason: renewal}}
      cross_category: [lease, term]
  - id: utility_ext_electric_estimate_line
    base_policy_refs: [utility_evt_submetered_usage]
    overwrite:
      - base_policy: utility_evt_submetered_usage
        superseded_clause: >-
          When an actual read cannot be obtained the usage is estimated as utility_msr_average_usage, prorated by days,
          and the line is marked estimated;
        replaced_by: >-
          The estimated kilowatt-hours billed are the seasonal estimate times an estimate share, rounded to 3 decimals
      - base_policy: utility_evt_submetered_usage
        superseded_clause: >-
          The usage line for a period bills usage_quantity times the service rate (water_rate_per_kgal,
          gas_rate_per_therm or electric_rate_per_kwh) plus the service's fixed monthly charge prorated by days of
          responsibility, rounded half up to the cent;
        replaced_by: >-
          The line's amount is its usage charge plus its electricity service charge, rounded half up to the cent.
    trigger: state_due
    subject: [utility_usage_billback]
    computes: amount
    target_tool: bill_estimated_electric_line_1c085b40
    params:
      long_window_reads: 6
      long_window_tenure_months: 24
      default_kwh_per_occupant: 190
      seasonal_full_reads: 12
      share_first_autopay: 0.90
      share_repeat: 0.80
      full_share: 1.0
      state_share_strict: 0.95
      state_share_moderate: 0.97
      long_renewals: 3
      short_renewals: 1
      loyalty_long: 0.05
      loyalty_short: 0.02
      loyalty_none: 0.0
      service_half: 0.5
      service_three_quarters: 0.75
      service_long_tenure_months: 36
      service_mid_tenure_months: 12
    rule: >-
      The estimated electricity line is the electricity usage line of a billing period that closed without any electricity read after the account's first recorded electricity read; it is issued at the first bill issue after that period and is owed from that bill issue day
      until it stands on the account, marked as resting on an estimated read. The standard estimate is the average electricity usage of the actual electricity reads dated fewer than four whole months before the billing date, rounded to 3 decimals. Each sum of recorded electricity usage is taken to 2 decimals. The estimated electricity line bills the standard estimate as its usage, times
      electric_rate_per_kwh, rounded half up to the cent, plus the electricity service charge of
      electric_base_charge_monthly. The recent electricity average is taken over a window set by the account's read
      history and the resident's tenure: when at least long_window_reads actual electricity reads are dated fewer than
      seven whole months before the billing date and the lease's move-in date lies at least long_window_tenure_months
      whole months before it, the recent electricity average is the mean of those reads; when fewer than
      estimate_history_periods actual electricity reads are dated fewer than four whole months before the billing date
      and fewer than long_window_reads are dated fewer than seven whole months before it, the recent electricity
      average is default_kwh_per_occupant times the account's billed occupants; in every other situation the recent
      electricity average is the standard estimate; each is rounded to 3 decimals. The recent electricity average is
      then adjusted for season by last year's electricity read of the same service month, which is the actual
      electricity read dated at least twelve and fewer than thirteen whole months before the billing date: when that
      read exists and at least seasonal_full_reads actual electricity reads are dated fewer than thirteen whole months
      before the billing date, the seasonal estimate is the mean of the recent electricity average and last year's
      read; when that read exists and fewer than seasonal_full_reads actual electricity reads are dated in those
      thirteen months, the seasonal estimate is last year's read; in every other situation the seasonal estimate is
      the recent electricity average; each is rounded to 3 decimals. The estimated kilowatt-hours billed are the
      seasonal estimate times an estimate share, rounded to 3 decimals: share_first_autopay when no estimated
      electricity read is dated fewer than two whole months before the billing date and the lease is enrolled in rent
      autopay; share_repeat when at least one estimated electricity read is dated fewer than two whole months before
      the billing date; the whole estimate in every other situation. A first estimate is tempered for a household on rent autopay because its statements are settled without the resident reviewing them, and a repeated estimate is tempered further because the meter has then failed twice. The renewal loyalty reduction on an estimated
      electricity line is loyalty_long when the lease has at least long_renewals renewal rent changes on record,
      loyalty_short when it has at least short_renewals but fewer than long_renewals, and loyalty_none otherwise; it is the Larkspur renewal loyalty program's allowance on a charge the resident could not check against a read. The state estimated-billing share is state_share_strict when the community's state as recorded on the lease is CO or
      WA, state_share_moderate when it is CA or AZ, and the whole rate in any other state. The usage charge of the
      estimated electricity line is the billed estimated kilowatt-hours times electric_rate_per_kwh, times the state
      estimated-billing share, and times one less the renewal loyalty reduction, all multiplied together and rounded
      half up to the cent once at the end. The electricity service charge on the estimated line is
      electric_base_charge_monthly times a service share, rounded half up to the cent: service_half when the lease's
      move-in date lies at least service_long_tenure_months whole months before the billing date and no estimated
      electricity usage line was issued fewer than twelve whole months before it; service_three_quarters when the
      move-in date lies at least service_mid_tenure_months but fewer than service_long_tenure_months whole months
      before the billing date and no such estimated line was issued in those twelve months; the whole charge in every
      other situation. The line's amount is its usage charge plus its electricity service charge, rounded half up to
      the cent.
    prerequisite: []
    cross_category:
      - category: lease
        as: branch
        reads: [move_in_date, autopay_enrolled, community_state]
        note: The lease's move-in date sets the averaging window and the service share, its autopay enrollment sets the estimate share, and its community state sets the state estimated-billing share.
      - category: term
        as: history
        reads: [term_rent_changes.change_reason]
        note: The count of renewal rent changes on the lease's terms sets the renewal loyalty reduction.
    compute:
      - el_n7: "COUNT('utility_meter_reads', within_months=7, date_field='read_date', service_type='electric', read_type='actual')"
      - el_s7: "SUM('utility_meter_reads', 'usage_quantity', within_months=7, date_field='read_date', service_type='electric', read_type='actual')"
      - el_n4: "COUNT('utility_meter_reads', within_months=4, date_field='read_date', service_type='electric', read_type='actual')"
      - el_s4: "SUM('utility_meter_reads', 'usage_quantity', within_months=4, date_field='read_date', service_type='electric', read_type='actual')"
      - el_tenure: "MONTHS(CFIELD('lease', 'move_in_date'), NOW)"
      - el_recent: "RND(el_s7 / el_n7, 3) if (el_n7 >= K('long_window_reads') and el_tenure >= K('long_window_tenure_months')) else (RND(K('default_kwh_per_occupant') * F('billed_occupants'), 3) if (el_n4 < P('estimate_history_periods') and el_n7 < K('long_window_reads')) else RND(el_s4 / el_n4, 3))"
      - el_n13: "COUNT('utility_meter_reads', within_months=13, date_field='read_date', service_type='electric', read_type='actual')"
      - el_ly_n: "el_n13 - COUNT('utility_meter_reads', within_months=12, date_field='read_date', service_type='electric', read_type='actual')"
      - el_ly: "SUM('utility_meter_reads', 'usage_quantity', within_months=13, date_field='read_date', service_type='electric', read_type='actual') - SUM('utility_meter_reads', 'usage_quantity', within_months=12, date_field='read_date', service_type='electric', read_type='actual')"
      - el_seasonal: "RND((el_recent + el_ly) / 2, 3) if (el_ly_n >= 1 and el_n13 >= K('seasonal_full_reads')) else (RND(el_ly, 3) if (el_ly_n >= 1 and el_n13 < K('seasonal_full_reads')) else el_recent)"
      - el_est_recent: "COUNT('utility_meter_reads', within_months=2, date_field='read_date', service_type='electric', read_type='estimated')"
      - el_autopay: "CFIELD('lease', 'autopay_enrolled')"
      - el_share: "K('share_first_autopay') if (el_est_recent == 0 and el_autopay) else (K('share_repeat') if el_est_recent >= 1 else K('full_share'))"
      - el_billed_kwh: "RND(el_seasonal * el_share, 3)"
      - el_renewals: "XCOUNT('term', 'term_rent_changes', event_type='term_rent_change', change_reason='renewal')"
      - el_loyalty: "K('loyalty_long') if el_renewals >= K('long_renewals') else (K('loyalty_short') if (el_renewals >= K('short_renewals') and el_renewals < K('long_renewals')) else K('loyalty_none'))"
      - el_state: "CFIELD('lease', 'community_state')"
      - el_state_share: "K('state_share_strict') if (el_state == 'CO' or el_state == 'WA') else (K('state_share_moderate') if (el_state == 'CA' or el_state == 'AZ') else K('full_share'))"
      - el_usage_charge: "RND(el_billed_kwh * P('electric_rate_per_kwh') * el_state_share * (K('full_share') - el_loyalty), 2)"
      - el_tenure_service: "MONTHS(CFIELD('lease', 'move_in_date'), NOW)"
      - el_est_lines_12m: "COUNT('utility_bills', within_months=12, date_field='bill_date', event_type='utility_usage_billback', service_type='electric', read_type='estimated')"
      - el_service_share: "K('service_half') if (el_tenure_service >= K('service_long_tenure_months') and el_est_lines_12m == 0) else (K('service_three_quarters') if (el_tenure_service >= K('service_mid_tenure_months') and el_tenure_service < K('service_long_tenure_months') and el_est_lines_12m == 0) else K('full_share'))"
      - el_service_charge: "RND(P('electric_base_charge_monthly') * el_service_share, 2)"
      - result: "RND(el_usage_charge + el_service_charge, 2)"
    compute_basis:
      el_n7: "when at least long_window_reads actual electricity reads are dated fewer than seven whole months before the billing date"
      el_s7: "the recent electricity average is the mean of those reads"
      el_n4: "when fewer than estimate_history_periods actual electricity reads are dated fewer than four whole months before the billing date"
      el_s4: "The standard estimate is the average electricity usage of the actual electricity reads dated fewer than four whole months before the billing date, rounded to 3 decimals. Each sum of recorded electricity usage is taken to 2 decimals."
      el_tenure: "the lease's move-in date lies at least long_window_tenure_months whole months before it"
      el_recent: "when at least long_window_reads actual electricity reads are dated fewer than seven whole months before the billing date and the lease's move-in date lies at least long_window_tenure_months whole months before it, the recent electricity average is the mean of those reads; when fewer than estimate_history_periods actual electricity reads are dated fewer than four whole months before the billing date and fewer than long_window_reads are dated fewer than seven whole months before it, the recent electricity average is default_kwh_per_occupant times the account's billed occupants; in every other situation the recent electricity average is the standard estimate; each is rounded to 3 decimals."
      el_n13: "at least seasonal_full_reads actual electricity reads are dated fewer than thirteen whole months before the billing date"
      el_ly_n: "which is the actual electricity read dated at least twelve and fewer than thirteen whole months before the billing date"
      el_ly: "last year's electricity read of the same service month, which is the actual electricity read dated at least twelve and fewer than thirteen whole months before the billing date"
      el_seasonal: "when that read exists and at least seasonal_full_reads actual electricity reads are dated fewer than thirteen whole months before the billing date, the seasonal estimate is the mean of the recent electricity average and last year's read; when that read exists and fewer than seasonal_full_reads actual electricity reads are dated in those thirteen months, the seasonal estimate is last year's read; in every other situation the seasonal estimate is the recent electricity average; each is rounded to 3 decimals."
      el_est_recent: "when no estimated electricity read is dated fewer than two whole months before the billing date"
      el_autopay: "the lease is enrolled in rent autopay"
      el_share: "share_first_autopay when no estimated electricity read is dated fewer than two whole months before the billing date and the lease is enrolled in rent autopay; share_repeat when at least one estimated electricity read is dated fewer than two whole months before the billing date; the whole estimate in every other situation."
      el_billed_kwh: "The estimated kilowatt-hours billed are the seasonal estimate times an estimate share, rounded to 3 decimals"
      el_renewals: "when the lease has at least long_renewals renewal rent changes on record"
      el_loyalty: "The renewal loyalty reduction on an estimated electricity line is loyalty_long when the lease has at least long_renewals renewal rent changes on record, loyalty_short when it has at least short_renewals but fewer than long_renewals, and loyalty_none otherwise"
      el_state: "when the community's state as recorded on the lease is CO or WA"
      el_state_share: "The state estimated-billing share is state_share_strict when the community's state as recorded on the lease is CO or WA, state_share_moderate when it is CA or AZ, and the whole rate in any other state."
      el_usage_charge: "The usage charge of the estimated electricity line is the billed estimated kilowatt-hours times electric_rate_per_kwh, times the state estimated-billing share, and times one less the renewal loyalty reduction, all multiplied together and rounded half up to the cent once at the end."
      el_tenure_service: "when the lease's move-in date lies at least service_long_tenure_months whole months before the billing date"
      el_est_lines_12m: "no estimated electricity usage line was issued fewer than twelve whole months before it"
      el_service_share: "service_half when the lease's move-in date lies at least service_long_tenure_months whole months before the billing date and no estimated electricity usage line was issued fewer than twelve whole months before it; service_three_quarters when the move-in date lies at least service_mid_tenure_months but fewer than service_long_tenure_months whole months before the billing date and no such estimated line was issued in those twelve months; the whole charge in every other situation."
      el_service_charge: "The electricity service charge on the estimated line is electric_base_charge_monthly times a service share, rounded half up to the cent"
      result: "The line's amount is its usage charge plus its electricity service charge, rounded half up to the cent."
    factors:
      - id: estimate_window
        effect: method
        decides: el_recent
        bindings: [el_n7, el_s7, el_tenure, el_recent]
        ladder:
          - when: "at least long_window_reads actual electricity reads are dated fewer than seven whole months before the billing date and the lease's move-in date lies at least long_window_tenure_months whole months before it"
            method: "the recent electricity average is the mean of the actual reads of the last seven months"
          - when: "fewer than estimate_history_periods actual electricity reads are dated fewer than four whole months before the billing date and fewer than long_window_reads fewer than seven whole months before it"
            method: "the recent electricity average is default_kwh_per_occupant times the billed occupants"
          - when: "otherwise"
            method: "the recent electricity average is the standard estimate (the mean of the actual reads of the last four months)"
        baseline:
          el_recent: "RND(el_s4 / el_n4, 3)"
        evidence: [history, date, cross_category]
        cross_difficulty: lease
      - id: seasonal_adjustment
        effect: method
        decides: el_seasonal
        bindings: [el_n13, el_ly_n, el_ly, el_seasonal]
        ladder:
          - when: "last year's electricity read of the same service month exists and at least seasonal_full_reads actual electricity reads are dated fewer than thirteen whole months before the billing date"
            method: "the seasonal estimate is the mean of the recent electricity average and last year's read"
          - when: "last year's read of the same service month exists and fewer than seasonal_full_reads actual electricity reads are dated in those thirteen months"
            method: "the seasonal estimate is last year's read"
          - when: "otherwise"
            method: "the seasonal estimate is the recent electricity average"
        baseline:
          el_seasonal: "el_recent"
        evidence: [history, date]
        cross_difficulty: null
      - id: estimate_share
        effect: parameter
        decides: el_share
        bindings: [el_est_recent, el_autopay, el_share]
        ladder:
          - when: "no estimated electricity read is dated fewer than two whole months before the billing date and the lease is enrolled in rent autopay"
            value: "K('share_first_autopay')"
          - when: "at least one estimated electricity read is dated fewer than two whole months before the billing date"
            value: "K('share_repeat')"
          - when: "otherwise"
            value: "the whole estimate"
        baseline:
          el_share: "K('full_share')"
        evidence: [history, cross_category]
        cross_difficulty: lease
      - id: renewal_loyalty_reduction
        effect: parameter
        decides: el_loyalty
        bindings: [el_renewals, el_loyalty]
        ladder:
          - when: "the lease has at least long_renewals renewal rent changes on record"
            value: "K('loyalty_long')"
          - when: "the lease has at least short_renewals but fewer than long_renewals renewal rent changes on record"
            value: "K('loyalty_short')"
          - when: "otherwise"
            value: "K('loyalty_none')"
        baseline:
          el_loyalty: "K('loyalty_none')"
        evidence: [history, cross_category]
        cross_difficulty: term
      - id: state_estimate_share
        effect: parameter
        decides: el_state_share
        bindings: [el_state, el_state_share]
        ladder:
          - when: "the community's state as recorded on the lease is CO or WA"
            value: "K('state_share_strict')"
          - when: "the community's state as recorded on the lease is CA or AZ"
            value: "K('state_share_moderate')"
          - when: "otherwise"
            value: "the whole rate"
        baseline:
          el_state_share: "K('full_share')"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: estimate_service_share
        effect: parameter
        decides: el_service_share
        bindings: [el_tenure_service, el_est_lines_12m, el_service_share]
        ladder:
          - when: "the lease's move-in date lies at least service_long_tenure_months whole months before the billing date and no estimated electricity usage line was issued fewer than twelve whole months before it"
            value: "K('service_half')"
          - when: "the move-in date lies at least service_mid_tenure_months but fewer than service_long_tenure_months whole months before the billing date and no such estimated line was issued in those twelve months"
            value: "K('service_three_quarters')"
          - when: "otherwise"
            value: "the whole electric_base_charge_monthly"
        baseline:
          el_service_share: "K('full_share')"
        evidence: [history, date, cross_category]
        cross_difficulty: lease
    baseline:
      rule: >-
        The standard estimate is the average electricity usage of the actual electricity reads dated fewer than four whole months before the billing date, rounded to 3 decimals. Each sum of recorded electricity usage is taken to 2 decimals. The estimated electricity line bills the standard
        estimate as its usage, times electric_rate_per_kwh, rounded half up to the cent, plus the electricity service
        charge of electric_base_charge_monthly.
      params: [electric_rate_per_kwh, electric_base_charge_monthly, estimate_history_periods]
    inputs:
      history:
        - {table: utility_meter_reads, aggregate: sum, field: usage_quantity, within_months: 13, filters: {service_type: electric, read_type: actual}}
        - {table: utility_meter_reads, aggregate: count, field: read_id, within_months: 7, filters: {service_type: electric, read_type: actual}}
        - {table: utility_meter_reads, aggregate: count, field: read_id, within_months: 2, filters: {service_type: electric, read_type: estimated}}
        - {table: utility_bills, aggregate: count, field: bill_id, within_months: 12, filters: {event_type: utility_usage_billback, service_type: electric, read_type: estimated}}
        - {category: term, table: term_rent_changes, aggregate: count, field: rent_change_id, filters: {event_type: term_rent_change, change_reason: renewal}}
      cross_category: [lease, term]
  - id: utility_ext_undisputed_balance_payment
    base_policy_refs: [utility_agg_household_balance, utility_evt_payments]
    overwrite: []
    trigger: on_request
    subject: [utility_payment]
    computes: amount
    target_tool: pay_undisputed_utility_balance_990e05bb
    params:
      usual_reads_needed: 6
      security_full_rent: 0.50
      security_partial: 0.75
      full_share: 1.0
      standing_both: 0.80
      standing_one: 0.90
      standing_payment_count: 6
    rule: >-
      The undisputed balance is what a resident pays on an active utility services account while a bill line on it stands under a dispute still in submitted status (an account in final billing is settled by the move-out utility payment instead); the resident pays it in person with an instrument of their own, and
      the payment is applied to the account it is made on. The undisputed balance is fixed only after the account
      carries a gas usage line for the billing period closed by each actual gas read that follows estimated gas reads.
      Before the undisputed balance is worked out, every billing period since the account's first recorded electricity read that closed without an electricity read must carry its estimated electricity line on the account. The open balance of the account is the sum of every usage,
      allocation, flat and package overage line billed on it less every adjustment and payment posted on it, rounded
      half up to the cent. The held charges are the charge of the bill line named by the most recent dispute in
      submitted status on the account, as billed. The undisputed balance is the open balance less the held charges,
      rounded half up to the cent. The held charges depend on the ground of that dispute: when it is a suspected leak
      and the account's most recent sewer usage line bills the same metered usage as the disputed line, the held
      charges are the disputed line and that sewer line together; when it is a meter accuracy dispute, the held
      charges are every water usage line issued fewer than two whole months before the payment date; in every other
      situation the held charges are the disputed line alone; amounts are taken as billed and summed to the cent. A
      part of the held charges stays payable: when the dispute carries a leak repair date and at least
      usual_reads_needed actual water reads other than the read of the disputed period are dated fewer than seven
      whole months before the payment date, the payable part is the held charges times the usual water usage for the
      undisputed balance divided by the disputed line's usage, rounded half up to the cent, the usual water usage for the undisputed balance being the usage of the actual water reads dated fewer than seven whole months before the payment date less the usage billed on the disputed line (the read of the disputed period), divided by the number of those reads less one, rounded to 3 decimals, each sum of recorded water usage being taken to 2 decimals; when the dispute carries a
      leak repair date and fewer than usual_reads_needed such reads exist, the payable part is the water service charge
      water_base_charge_monthly plus, when the sewer line is held with it, the sewer service charge
      sewer_base_charge_monthly; in every other situation no part of the held charges is payable. The payable part is
      reduced by a security share set by the cash deposit held on the lease's security deposit account:
      security_full_rent when the cash deposit held is at least the lease's monthly rent; security_partial when a cash
      deposit is held but it is below the monthly rent; the whole payable part when no cash deposit is held. The
      payable part is further reduced by a standing share set by the resident's payment standing: standing_both when
      the lease is enrolled in rent autopay and at least standing_payment_count utility payments were received fewer
      than six whole months before the payment date; standing_one when exactly one of those two holds; the whole
      payable part when neither holds. The reduced payable part is the payable part times the security share times the
      standing share, rounded half up to the cent once at the end, and when a part of the held charges stays payable
      the undisputed balance is the open balance less the held charges plus that reduced payable part, rounded half up
      to the cent.
    prerequisite:
      - problem: utility_ext_gas_trueup_line
        kind: value_input
        gate: ub_open
        form: state
        policy_source: >-
          The undisputed balance is fixed only after the account carries a gas usage line for the billing period
          closed by each actual gas read that follows estimated gas reads.
        condition: >-
          utility_bills carries a gas utility_usage_billback line whose billing_period is the service month of every
          actual gas read that follows estimated gas reads on the account.
        resolved_by: post_gas_trueup_line_465c860d
        effect: >-
          The gas true-up line enters the open balance, so the open balance and with it the undisputed balance rise
          by the amount of that line.
      - problem: utility_ext_electric_estimate_line
        kind: value_input
        gate: ub_open
        form: state
        policy_source: >-
          Before the undisputed balance is worked out, every billing period since the account's first recorded electricity read that closed without an electricity read must carry its estimated electricity line on the account.
        condition: >-
          utility_bills carries an estimated electric utility_usage_billback line for every billing period after the account's first recorded electric meter read that closed with no electric meter read on the account.
        resolved_by: bill_estimated_electric_line_1c085b40
        effect: >-
          The estimated electricity line enters the open balance, so the open balance and with it the undisputed
          balance rise by the amount of that line.
    cross_category:
      - category: deposit
        as: branch
        reads: [deposit_held]
        note: The cash deposit held on the lease's security deposit account sets the security share of the payable part.
      - category: lease
        as: branch
        reads: [monthly_rent, autopay_enrolled]
        note: The lease's monthly rent is the yardstick of the security share and its autopay enrollment sets the standing share.
    compute:
      - ub_charges: "SUM('utility_bills', 'amount', event_type='utility_usage_billback') + SUM('utility_bills', 'amount', event_type='utility_allocation_billback') + SUM('utility_bills', 'amount', event_type='utility_flat_charge') + SUM('utility_bills', 'amount', event_type='utility_package_overage')"
      - ub_credits: "SUM('utility_bills', 'amount', event_type='utility_bill_adjustment') + SUM('utility_bills', 'amount', event_type='utility_payment')"
      - ub_open: "RND(ub_charges - ub_credits, 2)"
      - ub_disp_bill: "LATEST('utility_disputes', 'bill_id', date_field='created_at', dispute_status='submitted')"
      - ub_disp_reason: "LATEST('utility_disputes', 'dispute_reason', date_field='created_at', dispute_status='submitted')"
      - ub_disp_amount: "LATEST('utility_bills', 'amount', date_field='bill_date', bill_id=ub_disp_bill)"
      - ub_disp_usage: "LATEST('utility_bills', 'usage_quantity', date_field='bill_date', bill_id=ub_disp_bill)"
      - ub_sewer_usage: "LATEST('utility_bills', 'usage_quantity', date_field='bill_date', event_type='utility_usage_billback', service_type='sewer')"
      - ub_sewer_amount: "LATEST('utility_bills', 'amount', date_field='bill_date', event_type='utility_usage_billback', service_type='sewer')"
      - ub_water_recent: "SUM('utility_bills', 'amount', within_months=2, date_field='bill_date', event_type='utility_usage_billback', service_type='water')"
      - ub_held: "RND(ub_disp_amount + ub_sewer_amount, 2) if (ub_disp_reason == 'suspected_leak' and ub_sewer_usage == ub_disp_usage) else (ub_water_recent if ub_disp_reason == 'meter_accuracy' else ub_disp_amount)"
      - ub_repair: "LATEST('utility_disputes', 'leak_repair_date', date_field='created_at', dispute_status='submitted')"
      - ub_n7: "COUNT('utility_meter_reads', within_months=7, date_field='read_date', service_type='water', read_type='actual')"
      - ub_s7: "SUM('utility_meter_reads', 'usage_quantity', within_months=7, date_field='read_date', service_type='water', read_type='actual')"
      - ub_payable: "RND(ub_held * RND((ub_s7 - ub_disp_usage) / (ub_n7 - 1), 3) / ub_disp_usage, 2) if (ub_repair != None and ub_n7 - 1 >= K('usual_reads_needed')) else (RND(P('water_base_charge_monthly') + (P('sewer_base_charge_monthly') if ub_sewer_usage == ub_disp_usage else 0), 2) if (ub_repair != None and ub_n7 - 1 < K('usual_reads_needed')) else 0)"
      - ub_deposit: "CFIELD('deposit', 'deposit_held') or 0"
      - ub_rent: "CFIELD('lease', 'monthly_rent')"
      - ub_security_share: "K('security_full_rent') if (ub_deposit >= ub_rent and ub_deposit > 0) else (K('security_partial') if (ub_deposit > 0 and ub_deposit < ub_rent) else K('full_share'))"
      - ub_autopay: "CFIELD('lease', 'autopay_enrolled')"
      - ub_payments: "COUNT('utility_bills', within_months=6, date_field='bill_date', event_type='utility_payment')"
      - ub_standing_share: "K('standing_both') if (ub_autopay and ub_payments >= K('standing_payment_count')) else (K('standing_one') if ((ub_autopay and ub_payments < K('standing_payment_count')) or ((not ub_autopay) and ub_payments >= K('standing_payment_count'))) else K('full_share'))"
      - ub_reduced_payable: "RND(ub_payable * ub_security_share * ub_standing_share, 2)"
      - result: "RND(ub_open - ub_held + ub_reduced_payable, 2)"
    compute_basis:
      ub_charges: "The open balance of the account is the sum of every usage, allocation, flat and package overage line billed on it less every adjustment and payment posted on it, rounded half up to the cent."
      ub_credits: "less every adjustment and payment posted on it"
      ub_open: "The open balance of the account is the sum of every usage, allocation, flat and package overage line billed on it less every adjustment and payment posted on it, rounded half up to the cent."
      ub_disp_bill: "The held charges are the charge of the bill line named by the most recent dispute in submitted status on the account, as billed."
      ub_disp_reason: "The held charges depend on the ground of that dispute"
      ub_disp_amount: "The held charges are the charge of the bill line named by the most recent dispute in submitted status on the account, as billed."
      ub_disp_usage: "divided by the disputed line's usage"
      ub_sewer_usage: "the account's most recent sewer usage line bills the same metered usage as the disputed line"
      ub_sewer_amount: "the held charges are the disputed line and that sewer line together"
      ub_water_recent: "when it is a meter accuracy dispute, the held charges are every water usage line issued fewer than two whole months before the payment date"
      ub_held: "when it is a suspected leak and the account's most recent sewer usage line bills the same metered usage as the disputed line, the held charges are the disputed line and that sewer line together; when it is a meter accuracy dispute, the held charges are every water usage line issued fewer than two whole months before the payment date; in every other situation the held charges are the disputed line alone; amounts are taken as billed and summed to the cent."
      ub_repair: "when the dispute carries a leak repair date"
      ub_n7: "at least usual_reads_needed actual water reads other than the read of the disputed period are dated fewer than seven whole months before the payment date"
      ub_s7: "the usual water usage for the undisputed balance being the usage of the actual water reads dated fewer than seven whole months before the payment date less the usage billed on the disputed line (the read of the disputed period), divided by the number of those reads less one, rounded to 3 decimals, each sum of recorded water usage being taken to 2 decimals"
      ub_payable: "when the dispute carries a leak repair date and at least usual_reads_needed actual water reads other than the read of the disputed period are dated fewer than seven whole months before the payment date, the payable part is the held charges times the usual water usage for the undisputed balance divided by the disputed line's usage, rounded half up to the cent, the usual water usage for the undisputed balance being the usage of the actual water reads dated fewer than seven whole months before the payment date less the usage billed on the disputed line (the read of the disputed period), divided by the number of those reads less one, rounded to 3 decimals, each sum of recorded water usage being taken to 2 decimals; when the dispute carries a leak repair date and fewer than usual_reads_needed such reads exist, the payable part is the water service charge water_base_charge_monthly plus, when the sewer line is held with it, the sewer service charge sewer_base_charge_monthly; in every other situation no part of the held charges is payable."
      ub_deposit: "set by the cash deposit held on the lease's security deposit account"
      ub_rent: "security_full_rent when the cash deposit held is at least the lease's monthly rent"
      ub_security_share: "security_full_rent when the cash deposit held is at least the lease's monthly rent; security_partial when a cash deposit is held but it is below the monthly rent; the whole payable part when no cash deposit is held."
      ub_autopay: "the lease is enrolled in rent autopay"
      ub_payments: "at least standing_payment_count utility payments were received fewer than six whole months before the payment date"
      ub_standing_share: "standing_both when the lease is enrolled in rent autopay and at least standing_payment_count utility payments were received fewer than six whole months before the payment date; standing_one when exactly one of those two holds; the whole payable part when neither holds."
      ub_reduced_payable: "The reduced payable part is the payable part times the security share times the standing share, rounded half up to the cent once at the end"
      result: "when a part of the held charges stays payable the undisputed balance is the open balance less the held charges plus that reduced payable part, rounded half up to the cent."
    factors:
      - id: dispute_hold_scope
        effect: method
        decides: ub_held
        bindings: [ub_sewer_usage, ub_sewer_amount, ub_water_recent, ub_held]
        ladder:
          - when: "the dispute is a suspected leak and the account's most recent sewer usage line bills the same metered usage as the disputed line"
            method: "the disputed line and that sewer line are held together"
          - when: "the dispute is a meter accuracy dispute"
            method: "every water usage line issued fewer than two whole months before the payment date is held"
          - when: "otherwise"
            method: "the disputed line alone is held"
        baseline:
          ub_held: "ub_disp_amount"
        evidence: [history]
        cross_difficulty: null
      - id: payable_held_part
        effect: method
        decides: ub_payable
        bindings: [ub_repair, ub_n7, ub_s7, ub_payable]
        ladder:
          - when: "the dispute carries a leak repair date and at least usual_reads_needed actual water reads other than the disputed read are dated fewer than seven whole months before the payment date"
            method: "the held charges stay payable in the proportion of the usual water usage for the undisputed balance to the disputed usage"
          - when: "the dispute carries a leak repair date and fewer than usual_reads_needed such reads exist"
            method: "the water service charge, plus the sewer service charge when the sewer line is held, stays payable"
          - when: "otherwise"
            method: "no part of the held charges is payable"
        baseline:
          ub_payable: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: deposit_security_share
        effect: parameter
        decides: ub_security_share
        bindings: [ub_deposit, ub_rent, ub_security_share]
        ladder:
          - when: "the cash deposit held is at least the lease's monthly rent"
            value: "K('security_full_rent')"
          - when: "a cash deposit is held but it is below the monthly rent"
            value: "K('security_partial')"
          - when: "otherwise"
            value: "the whole payable part"
        baseline:
          ub_security_share: "K('full_share')"
        evidence: [cross_category]
        cross_difficulty: deposit
      - id: payment_standing_share
        effect: parameter
        decides: ub_standing_share
        bindings: [ub_autopay, ub_payments, ub_standing_share]
        ladder:
          - when: "the lease is enrolled in rent autopay and at least standing_payment_count utility payments were received fewer than six whole months before the payment date"
            value: "K('standing_both')"
          - when: "exactly one of those two holds"
            value: "K('standing_one')"
          - when: "otherwise"
            value: "the whole payable part"
        baseline:
          ub_standing_share: "K('full_share')"
        evidence: [history, cross_category]
        cross_difficulty: lease
    baseline:
      rule: >-
        The open balance of the account is the sum of every usage, allocation, flat and package overage line billed
        on it less every adjustment and payment posted on it, rounded half up to the cent. The held charges are the
        charge of the bill line named by the most recent dispute in submitted status on the account, as billed. The
        undisputed balance is the open balance less the held charges, rounded half up to the cent.
      params: []
    inputs:
      history:
        - {table: utility_bills, aggregate: sum, field: amount, filters: {}}
        - {table: utility_meter_reads, aggregate: sum, field: usage_quantity, within_months: 7, filters: {service_type: water, read_type: actual}}
        - {table: utility_disputes, aggregate: latest, field: bill_id, filters: {dispute_status: submitted}}
        - {table: utility_bills, aggregate: count, field: bill_id, within_months: 6, filters: {event_type: utility_payment}}
      cross_category: [deposit, lease]
  - id: utility_ext_leak_adjustment_credit
    base_policy_refs: [utility_evt_adjustments_and_disputes]
    overwrite:
      - base_policy: utility_evt_adjustments_and_disputes
        superseded_clause: >-
          it credits leak_adjustment_credit_pct of the charge for the usage above utility_msr_average_usage, rounded
          half up to the cent.
        replaced_by: >-
          The leak adjustment credit is the credit share of a leak adjustment plus its renewal loyalty increment,
          times the credited leak excess, times water_rate_per_kgal, rounded half up to the cent, plus the prompt-report
          courtesy, the sum rounded half up to the cent.
      - base_policy: utility_evt_adjustments_and_disputes
        superseded_clause: >-
          A leak_adjustment is granted when the disputed usage line's usage_quantity is at least
          leak_usage_threshold_multiple times utility_msr_average_usage,
        replaced_by: >-
          when the disputed usage is at least leak_usage_threshold_multiple times the usual water usage of a leak
          adjustment
      - base_policy: utility_evt_adjustments_and_disputes
        superseded_clause: >-
          and utility_msr_leak_adjustments_12m is below leak_adjustments_per_12_months;
        replaced_by: >-
          and fewer than leak_adjustments_per_12_months leak adjustments were posted on the account fewer than twelve
          whole months before the decision date
    trigger: on_request
    subject: [utility_bill_adjustment]
    computes: credit_amount
    target_tool: credit_leak_adjustment_a9c6c674
    params:
      long_history_tenure_months: 36
      mid_history_tenure_months: 12
      long_history_reads: 6
      large_household: 4
      three_person_household: 3
      tolerance_large: 0.20
      tolerance_three: 0.10
      tolerance_none: 0.0
      repeat_limit_recent: 2.0
      repeat_limit_older: 3.0
      fast_repair_days: 7
      share_fast_first: 0.75
      share_prompt_first: 0.60
      long_renewals: 3
      short_renewals: 1
      loyalty_long: 0.10
      loyalty_short: 0.05
      loyalty_none: 0.0
      quick_report_days: 3
      prompt_report_days: 14
      courtesy_quick: 10.00
      courtesy_prompt: 5.00
      courtesy_none: 0.0
    rule: >-
      A leak adjustment credits part of the charge of the water usage line named by the most recent suspected-leak
      dispute in submitted status on the account (the disputed line). A leak adjustment is not granted until the
      resident has paid the undisputed balance of the account. It is granted when the disputed usage is at least
      leak_usage_threshold_multiple times the usual water usage of a leak adjustment, the leak was repaired by a
      maintenance work order completed no more than leak_repair_proof_days days after the disputed line's bill date,
      and fewer than leak_adjustments_per_12_months leak adjustments were posted on the account fewer than twelve
      whole months before the decision date; when any of these fails the credit is zero. The usual water usage of a leak adjustment is the usage of the actual water reads dated fewer than four whole months before the decision date less the usage billed on the disputed line (the read of the disputed period), divided by the number of those reads less one, rounded to 3 decimals, each sum of recorded water usage being taken to 2 decimals. The leak excess is the disputed
      usage less the usual water usage of a leak adjustment, never below zero, rounded to 3 decimals. The leak
      adjustment credits leak_adjustment_credit_pct of the leak excess times water_rate_per_kgal, rounded half up to
      the cent. The usual water usage of a leak adjustment follows the season when the account's history allows it. Last year's water read of the same service month is the actual water read dated at least twelve and fewer than thirteen whole months before the decision date. When the lease's move-in date lies at least long_history_tenure_months whole months before the decision date, last year's water read of the same service month exists and at least long_history_reads actual water reads other than the disputed read are dated fewer than seven whole months before it, the usual water usage of a leak adjustment is the mean of two figures, rounded to 3 decimals: the seven-month usual usage, which is the usage of those seven-month reads less the usage billed on the disputed line divided by their number less one, rounded to 3 decimals, and last year's water read of the same service month; when the move-in date lies at least mid_history_tenure_months but fewer than long_history_tenure_months whole months before the decision date and last year's water read of the same service month exists, the usual water usage of a leak adjustment is last year's water read of the same service month, rounded to 3 decimals; in every other situation it is the four-month figure above. The leak excess credited is capped for repeat reporters: when a suspected-leak dispute on the account
      that was denied was submitted fewer than twelve whole months before the decision date, the leak excess may not
      exceed repeat_limit_recent times the usual water usage of a leak adjustment; when such a denied dispute was
      submitted at least twelve but fewer than twenty-four whole months before the decision date and none more
      recently, it may not exceed repeat_limit_older times that usual usage; in every other situation the leak excess
      is not capped; each cap is rounded to 3 decimals. The capped leak excess is then reduced by a household
      tolerance allowance, which is the usual water usage of a leak adjustment times a household tolerance share set
      by the lease's approved occupants: tolerance_large when the lease approves at least large_household occupants,
      tolerance_three when it approves exactly three_person_household occupants, and tolerance_none otherwise; the
      allowance is rounded to 3 decimals and the credited leak excess is the capped leak excess less the allowance,
      never below zero, rounded to 3 decimals. The credit share of a leak adjustment is set by how fast the
      leak was repaired and the account's leak record: share_fast_first when the repair work order was completed no
      more than fast_repair_days days after the disputed line's bill date and no leak adjustment was posted on the
      account fewer than twenty-four whole months before the decision date; share_prompt_first when the repair was
      completed more than fast_repair_days days after that bill date and no such leak adjustment was posted in those
      twenty-four months; leak_adjustment_credit_pct in every other situation. Under Larkspur's renewal loyalty program the credit share is raised by the renewal loyalty increment of a leak adjustment: loyalty_long when the lease has at least long_renewals renewal
      rent changes on record, loyalty_short when it has at least short_renewals but fewer than long_renewals, and
      loyalty_none otherwise. A prompt-report courtesy is added to the credit: courtesy_quick when the dispute was
      submitted no more than quick_report_days days after the disputed line's bill date, courtesy_prompt when it was
      submitted more than quick_report_days but no more than prompt_report_days days after it, and courtesy_none
      otherwise. The leak adjustment credit is the credit share of a leak adjustment plus its renewal loyalty
      increment, times the credited leak excess, times water_rate_per_kgal, rounded half up to the cent, plus the
      prompt-report courtesy, the sum rounded half up to the cent. Days after a bill date are counted as calendar days
      starting the day after the bill date. The credit is posted against the disputed line.
    prerequisite:
      - problem: utility_ext_undisputed_balance_payment
        kind: state_gate
        gate: utility_bills.event_type
        form: action
        policy_source: >-
          A leak adjustment is not granted until the resident has paid the undisputed balance of the account.
        fallback_reason: >-
          The payment leaves only a payment line on the account, and a payment line looks the same whichever amount
          the resident chose to pay and whichever rule sized it; nothing on the record marks a payment as the
          undisputed balance, so no record-visible state singles out this write and the sentence names the action.
        condition: >-
          utility_bills carries a utility_payment line on the account dated on or after the submission of the
          suspected-leak dispute, in the amount of the undisputed balance worked out at the moment of payment.
        resolved_by: pay_undisputed_utility_balance_990e05bb
        effect: >-
          Once the resident's payment of the undisputed balance is on the account the leak adjustment may be granted;
          the payment does not change any figure of the leak adjustment.
    cross_category:
      - category: lease
        as: branch
        reads: [move_in_date, occupants_count]
        note: The lease's move-in date sets which seasonal method gives the usual water usage and its approved occupants set the household tolerance.
      - category: term
        as: history
        reads: [term_rent_changes.change_reason]
        note: The count of renewal rent changes on the lease's terms sets the renewal loyalty increment.
    compute:
      - lk_disp_bill: "LATEST('utility_disputes', 'bill_id', date_field='created_at', dispute_reason='suspected_leak', dispute_status='submitted')"
      - lk_submitted: "LATEST('utility_disputes', 'created_at', date_field='created_at', dispute_reason='suspected_leak', dispute_status='submitted')"
      - lk_repair: "LATEST('utility_disputes', 'leak_repair_date', date_field='created_at', dispute_reason='suspected_leak', dispute_status='submitted')"
      - lk_usage: "LATEST('utility_bills', 'usage_quantity', date_field='bill_date', bill_id=lk_disp_bill)"
      - lk_bill_date: "LATEST('utility_bills', 'bill_date', date_field='bill_date', bill_id=lk_disp_bill)"
      - lk_n7: "COUNT('utility_meter_reads', within_months=7, date_field='read_date', service_type='water', read_type='actual')"
      - lk_s7: "SUM('utility_meter_reads', 'usage_quantity', within_months=7, date_field='read_date', service_type='water', read_type='actual')"
      - lk_ly_n: "COUNT('utility_meter_reads', within_months=13, date_field='read_date', service_type='water', read_type='actual') - COUNT('utility_meter_reads', within_months=12, date_field='read_date', service_type='water', read_type='actual')"
      - lk_ly: "SUM('utility_meter_reads', 'usage_quantity', within_months=13, date_field='read_date', service_type='water', read_type='actual') - SUM('utility_meter_reads', 'usage_quantity', within_months=12, date_field='read_date', service_type='water', read_type='actual')"
      - lk_n4: "COUNT('utility_meter_reads', within_months=4, date_field='read_date', service_type='water', read_type='actual')"
      - lk_s4: "SUM('utility_meter_reads', 'usage_quantity', within_months=4, date_field='read_date', service_type='water', read_type='actual')"
      - lk_tenure: "MONTHS(CFIELD('lease', 'move_in_date'), NOW)"
      - lk_usual: "RND((RND((lk_s7 - lk_usage) / (lk_n7 - 1), 3) + lk_ly) / 2, 3) if (lk_tenure >= K('long_history_tenure_months') and lk_ly_n >= 1 and lk_n7 - 1 >= K('long_history_reads')) else (RND(lk_ly, 3) if (lk_tenure >= K('mid_history_tenure_months') and lk_tenure < K('long_history_tenure_months') and lk_ly_n >= 1) else RND((lk_s4 - lk_usage) / (lk_n4 - 1), 3))"
      - lk_repair_days: "DAYS(lk_bill_date, lk_repair)"
      - lk_leak_12m: "COUNT('utility_bills', within_months=12, date_field='bill_date', event_type='utility_bill_adjustment', adjustment_reason='leak_adjustment')"
      - lk_qualifies: "lk_usage >= P('leak_usage_threshold_multiple') * lk_usual and lk_repair_days <= P('leak_repair_proof_days') and lk_leak_12m < P('leak_adjustments_per_12_months')"
      - lk_excess: "MX(0, RND(lk_usage - lk_usual, 3))"
      - lk_denied_12m: "COUNT('utility_disputes', within_months=12, date_field='created_at', dispute_reason='suspected_leak', dispute_status='denied')"
      - lk_denied_24m: "COUNT('utility_disputes', within_months=24, date_field='created_at', dispute_reason='suspected_leak', dispute_status='denied')"
      - lk_excess_cap: "RND(K('repeat_limit_recent') * lk_usual, 3) if lk_denied_12m >= 1 else (RND(K('repeat_limit_older') * lk_usual, 3) if (lk_denied_24m >= 1 and lk_denied_12m == 0) else lk_excess)"
      - lk_capped_excess: "MN(lk_excess, lk_excess_cap)"
      - lk_occupants: "CFIELD('lease', 'occupants_count')"
      - lk_tolerance: "K('tolerance_large') if lk_occupants >= K('large_household') else (K('tolerance_three') if lk_occupants == K('three_person_household') else K('tolerance_none'))"
      - lk_allowance: "RND(lk_usual * lk_tolerance, 3)"
      - lk_credited_excess: "MX(0, RND(lk_capped_excess - lk_allowance, 3))"
      - lk_prior_leak_24m: "COUNT('utility_bills', within_months=24, date_field='bill_date', event_type='utility_bill_adjustment', adjustment_reason='leak_adjustment')"
      - lk_share: "K('share_fast_first') if (lk_repair_days <= K('fast_repair_days') and lk_prior_leak_24m == 0) else (K('share_prompt_first') if (lk_repair_days > K('fast_repair_days') and lk_prior_leak_24m == 0) else P('leak_adjustment_credit_pct'))"
      - lk_renewals: "XCOUNT('term', 'term_rent_changes', event_type='term_rent_change', change_reason='renewal')"
      - lk_loyalty: "K('loyalty_long') if lk_renewals >= K('long_renewals') else (K('loyalty_short') if (lk_renewals >= K('short_renewals') and lk_renewals < K('long_renewals')) else K('loyalty_none'))"
      - lk_report_days: "DAYS(lk_bill_date, lk_submitted)"
      - lk_courtesy: "K('courtesy_quick') if lk_report_days <= K('quick_report_days') else (K('courtesy_prompt') if (lk_report_days > K('quick_report_days') and lk_report_days <= K('prompt_report_days')) else K('courtesy_none'))"
      - lk_credit_usage: "RND((lk_share + lk_loyalty) * lk_credited_excess * P('water_rate_per_kgal'), 2)"
      - result: "RND(lk_credit_usage + lk_courtesy, 2) if lk_qualifies else 0"
    compute_basis:
      lk_disp_bill: "A leak adjustment credits part of the charge of the water usage line named by the most recent suspected-leak dispute in submitted status on the account (the disputed line)."
      lk_submitted: "when the dispute was submitted no more than quick_report_days days after the disputed line's bill date"
      lk_repair: "the leak was repaired by a maintenance work order completed no more than leak_repair_proof_days days after the disputed line's bill date"
      lk_usage: "when the disputed usage is at least leak_usage_threshold_multiple times the usual water usage of a leak adjustment"
      lk_bill_date: "Days after a bill date are counted as calendar days starting the day after the bill date."
      lk_n7: "at least long_history_reads actual water reads other than the disputed read are dated fewer than seven whole months before it"
      lk_s7: "the seven-month usual usage, which is the usage of those seven-month reads less the usage billed on the disputed line divided by their number less one, rounded to 3 decimals"
      lk_ly_n: "last year's water read of the same service month exists"
      lk_ly: "Last year's water read of the same service month is the actual water read dated at least twelve and fewer than thirteen whole months before the decision date."
      lk_n4: "The usual water usage of a leak adjustment is the usage of the actual water reads dated fewer than four whole months before the decision date less the usage billed on the disputed line (the read of the disputed period), divided by the number of those reads less one, rounded to 3 decimals, each sum of recorded water usage being taken to 2 decimals."
      lk_s4: "The usual water usage of a leak adjustment is the usage of the actual water reads dated fewer than four whole months before the decision date less the usage billed on the disputed line (the read of the disputed period), divided by the number of those reads less one, rounded to 3 decimals, each sum of recorded water usage being taken to 2 decimals."
      lk_tenure: "the lease's move-in date lies at least long_history_tenure_months whole months before the decision date"
      lk_usual: "When the lease's move-in date lies at least long_history_tenure_months whole months before the decision date, last year's water read of the same service month exists and at least long_history_reads actual water reads other than the disputed read are dated fewer than seven whole months before it, the usual water usage of a leak adjustment is the mean of two figures, rounded to 3 decimals: the seven-month usual usage, which is the usage of those seven-month reads less the usage billed on the disputed line divided by their number less one, rounded to 3 decimals, and last year's water read of the same service month; when the move-in date lies at least mid_history_tenure_months but fewer than long_history_tenure_months whole months before the decision date and last year's water read of the same service month exists, the usual water usage of a leak adjustment is last year's water read of the same service month, rounded to 3 decimals; in every other situation it is the four-month figure above."
      lk_repair_days: "Days after a bill date are counted as calendar days starting the day after the bill date."
      lk_leak_12m: "fewer than leak_adjustments_per_12_months leak adjustments were posted on the account fewer than twelve whole months before the decision date"
      lk_qualifies: "It is granted when the disputed usage is at least leak_usage_threshold_multiple times the usual water usage of a leak adjustment, the leak was repaired by a maintenance work order completed no more than leak_repair_proof_days days after the disputed line's bill date, and fewer than leak_adjustments_per_12_months leak adjustments were posted on the account fewer than twelve whole months before the decision date; when any of these fails the credit is zero."
      lk_occupants: "a household tolerance share set by the lease's approved occupants"
      lk_tolerance: "tolerance_large when the lease approves at least large_household occupants, tolerance_three when it approves exactly three_person_household occupants, and tolerance_none otherwise"
      lk_allowance: "The capped leak excess is then reduced by a household tolerance allowance, which is the usual water usage of a leak adjustment times a household tolerance share set by the lease's approved occupants"
      lk_credited_excess: "the allowance is rounded to 3 decimals and the credited leak excess is the capped leak excess less the allowance, never below zero, rounded to 3 decimals."
      lk_excess: "The leak excess is the disputed usage less the usual water usage of a leak adjustment, never below zero, rounded to 3 decimals."
      lk_denied_12m: "when a suspected-leak dispute on the account that was denied was submitted fewer than twelve whole months before the decision date"
      lk_denied_24m: "when such a denied dispute was submitted at least twelve but fewer than twenty-four whole months before the decision date and none more recently"
      lk_excess_cap: "when a suspected-leak dispute on the account that was denied was submitted fewer than twelve whole months before the decision date, the leak excess may not exceed repeat_limit_recent times the usual water usage of a leak adjustment; when such a denied dispute was submitted at least twelve but fewer than twenty-four whole months before the decision date and none more recently, it may not exceed repeat_limit_older times that usual usage; in every other situation the leak excess is not capped; each cap is rounded to 3 decimals."
      lk_capped_excess: "The leak excess credited is capped for repeat reporters"
      lk_prior_leak_24m: "no leak adjustment was posted on the account fewer than twenty-four whole months before the decision date"
      lk_share: "share_fast_first when the repair work order was completed no more than fast_repair_days days after the disputed line's bill date and no leak adjustment was posted on the account fewer than twenty-four whole months before the decision date; share_prompt_first when the repair was completed more than fast_repair_days days after that bill date and no such leak adjustment was posted in those twenty-four months; leak_adjustment_credit_pct in every other situation."
      lk_renewals: "when the lease has at least long_renewals renewal rent changes on record"
      lk_loyalty: "loyalty_long when the lease has at least long_renewals renewal rent changes on record, loyalty_short when it has at least short_renewals but fewer than long_renewals, and loyalty_none otherwise."
      lk_report_days: "when the dispute was submitted no more than quick_report_days days after the disputed line's bill date"
      lk_courtesy: "courtesy_quick when the dispute was submitted no more than quick_report_days days after the disputed line's bill date, courtesy_prompt when it was submitted more than quick_report_days but no more than prompt_report_days days after it, and courtesy_none otherwise."
      lk_credit_usage: "The leak adjustment credit is the credit share of a leak adjustment plus its renewal loyalty increment, times the credited leak excess, times water_rate_per_kgal, rounded half up to the cent"
      result: "plus the prompt-report courtesy, the sum rounded half up to the cent."
    factors:
      - id: seasonal_usual_usage
        effect: method
        decides: lk_usual
        bindings: [lk_n7, lk_s7, lk_tenure, lk_ly_n, lk_ly, lk_usual]
        ladder:
          - when: "the lease's move-in date lies at least long_history_tenure_months whole months before the decision date, last year's water read of the same service month exists and at least long_history_reads actual water reads other than the disputed read are dated fewer than seven whole months before it"
            method: "seasonal blend: the mean of the seven-month usual usage and last year's water read of the same service month"
          - when: "the move-in date lies at least mid_history_tenure_months but fewer than long_history_tenure_months whole months before the decision date and last year's water read of the same service month exists"
            method: "same-month comparison: last year's water read of the same service month alone"
          - when: "otherwise"
            method: "recent mean: the four-month figure (the other actual water reads of the last four months)"
        baseline:
          lk_usual: "RND((lk_s4 - lk_usage) / (lk_n4 - 1), 3)"
        evidence: [history, date, cross_category]
        cross_difficulty: lease
      - id: household_tolerance
        effect: parameter
        decides: lk_tolerance
        bindings: [lk_occupants, lk_tolerance]
        ladder:
          - when: "the lease approves at least large_household occupants"
            value: "K('tolerance_large')"
          - when: "the lease approves exactly three_person_household occupants"
            value: "K('tolerance_three')"
          - when: "otherwise"
            value: "K('tolerance_none')"
        baseline:
          lk_tolerance: "K('tolerance_none')"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: repeat_reporter_cap
        effect: parameter
        decides: lk_excess_cap
        bindings: [lk_denied_12m, lk_denied_24m, lk_excess_cap]
        ladder:
          - when: "a denied suspected-leak dispute on the account was submitted fewer than twelve whole months before the decision date"
            value: "K('repeat_limit_recent') times the usual water usage of a leak adjustment"
          - when: "a denied suspected-leak dispute was submitted at least twelve but fewer than twenty-four whole months before the decision date and none more recently"
            value: "K('repeat_limit_older') times the usual water usage of a leak adjustment"
          - when: "otherwise"
            value: "no cap: the whole leak excess"
        baseline:
          lk_excess_cap: "lk_excess"
        evidence: [history, date]
        cross_difficulty: null
      - id: repair_speed_share
        effect: parameter
        decides: lk_share
        bindings: [lk_prior_leak_24m, lk_share]
        ladder:
          - when: "the repair work order was completed no more than fast_repair_days days after the disputed line's bill date and no leak adjustment was posted on the account fewer than twenty-four whole months before the decision date"
            value: "K('share_fast_first')"
          - when: "the repair was completed more than fast_repair_days days after that bill date and no such leak adjustment was posted in those twenty-four months"
            value: "K('share_prompt_first')"
          - when: "otherwise"
            value: "P('leak_adjustment_credit_pct')"
        baseline:
          lk_share: "P('leak_adjustment_credit_pct')"
        evidence: [history, date]
        cross_difficulty: null
      - id: renewal_loyalty_increment
        effect: parameter
        decides: lk_loyalty
        bindings: [lk_renewals, lk_loyalty]
        ladder:
          - when: "the lease has at least long_renewals renewal rent changes on record"
            value: "K('loyalty_long')"
          - when: "the lease has at least short_renewals but fewer than long_renewals renewal rent changes on record"
            value: "K('loyalty_short')"
          - when: "otherwise"
            value: "K('loyalty_none')"
        baseline:
          lk_loyalty: "K('loyalty_none')"
        evidence: [history, cross_category]
        cross_difficulty: term
      - id: prompt_report_courtesy
        effect: parameter
        decides: lk_courtesy
        bindings: [lk_report_days, lk_courtesy]
        ladder:
          - when: "the dispute was submitted no more than quick_report_days days after the disputed line's bill date"
            value: "K('courtesy_quick')"
          - when: "it was submitted more than quick_report_days but no more than prompt_report_days days after it"
            value: "K('courtesy_prompt')"
          - when: "otherwise"
            value: "K('courtesy_none')"
        baseline:
          lk_courtesy: "K('courtesy_none')"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        It is granted when the disputed usage is at least leak_usage_threshold_multiple times the usual water usage
        of a leak adjustment, the leak was repaired by a maintenance work order completed no more than
        leak_repair_proof_days days after the disputed line's bill date, and fewer than
        leak_adjustments_per_12_months leak adjustments were posted on the account fewer than twelve whole months
        before the decision date; when any of these fails the credit is zero. The usual water usage of a leak adjustment is the usage of the actual water reads dated fewer than four whole months before the decision date less the usage billed on the disputed line (the read of the disputed period), divided by the number of those reads less one, rounded to 3 decimals, each sum of recorded water usage being taken to 2 decimals. The leak excess is the disputed usage
        less the usual water usage of a leak adjustment, never below zero, rounded to 3 decimals. The leak adjustment
        credits leak_adjustment_credit_pct of the leak excess times water_rate_per_kgal, rounded half up to the cent.
      params: [leak_adjustment_credit_pct, water_rate_per_kgal, leak_usage_threshold_multiple, leak_repair_proof_days, leak_adjustments_per_12_months]
    inputs:
      history:
        - {table: utility_meter_reads, aggregate: sum, field: usage_quantity, within_months: 13, filters: {service_type: water, read_type: actual}}
        - {table: utility_disputes, aggregate: count, field: dispute_id, within_months: 24, filters: {dispute_reason: suspected_leak, dispute_status: denied}}
        - {table: utility_bills, aggregate: count, field: bill_id, within_months: 24, filters: {event_type: utility_bill_adjustment, adjustment_reason: leak_adjustment}}
        - {table: utility_bills, aggregate: latest, field: usage_quantity, filters: {}}
        - {category: term, table: term_rent_changes, aggregate: count, field: rent_change_id, filters: {event_type: term_rent_change, change_reason: renewal}}
      cross_category: [lease, term]
  - id: utility_ext_final_package_fee
    base_policy_refs: [utility_evt_flat_and_package, utility_final_bill_and_close]
    overwrite:
      - base_policy: utility_evt_flat_and_package
        superseded_clause: >-
          Flat amounts, the package fee and the package allowances are prorated for a partial first or last month by
          days of responsibility over the actual days of the period (proration_method), rounded half up to the cent
          (allowances to 3 decimals).
        replaced_by: >-
          Final package fees are prorated over a 30-day month: the days of responsibility of the final period are the days from the period-end water read of the last period that carries a package fee line to the service end date, and the final package fee line records the days charged as its proration days over convention_days days in the period. Package fees and flat amounts of every period other than the final period of an account in final billing, and the package gas allowance of every period including the final one, remain prorated for a partial month by days of responsibility over the actual days of the period, rounded half up to the cent (the gas allowance to 3 decimals).
      - base_policy: utility_final_bill_and_close
        superseded_clause: >-
          the last period's usage, allocation or overage lines and flat or package lines prorated through the service end date
        replaced_by: >-
          when a notice to vacate on the lease's completed final term was received at least long_notice_days days
          before the service end date and the lease's move-out date is the move-out date that notice named, the
          service end date itself is not charged and the days charged are the days of responsibility less one
    trigger: state_due
    subject: [utility_flat_charge]
    computes: amount
    target_tool: post_final_package_fee_c766a545
    params:
      convention_days: 30
      long_notice_days: 60
      state_share_hot: 0.95
      state_share_coastal: 0.97
      full_share: 1.0
      long_tenure_months: 36
      mid_tenure_months: 24
      final_courtesy_long: 0.10
      final_courtesy_mid: 0.05
      no_courtesy: 0.0
      standing_payment_count: 12
      standing_credit_autopay: 2.50
      standing_credit_manual: 1.25
      long_renewals: 3
      short_renewals: 1
      renewal_credit_long: 5.00
      renewal_credit_short: 2.50
      no_credit: 0.0
    rule: >-
      The final package fee line is the package fee line of the final billing period of an All-Inclusive Utility
      Package account whose billing responsibility has ended on its service end date; it is issued at the first
      bill issue after the service end date and is owed from that bill issue day until it stands on the account.
      Final package fees are prorated over a 30-day month: the days of responsibility of the final period are the
      days from the period-end water read of the last period that carries a package fee line to the service end
      date, and the final package fee line records the days charged as its proration days over convention_days days
      in the period. Package fees and flat amounts of every period other than the final period of an account in final billing, and the package gas allowance of every period including the final one, remain prorated for a partial month by days of responsibility over the actual days of the period, rounded half up to the cent (the gas allowance to 3 decimals). The final package fee line bills package_monthly_fee times the days of responsibility divided
      by convention_days, rounded half up to the cent. The days charged depend on the resident's notice: when a
      notice to vacate on the lease's completed final term was received at least long_notice_days days before the
      service end date and the lease's move-out date is the move-out date that notice named, the service end date
      itself is not charged and the days charged are the days of responsibility less one; when the lease's completed
      final term carries no notice to vacate, the whole 30-day month is charged; in every other situation the days
      charged are the days of responsibility. The prorated final package fee is package_monthly_fee times the days
      charged divided by convention_days times a state final-fee share set by the community's state as recorded on
      the lease — state_share_hot in AZ or TX, state_share_coastal in CA or WA, the whole fee in any other state —
      all multiplied together and rounded half up to the cent once. A final-month tenure courtesy then reduces the
      prorated final package fee: final_courtesy_long when the lease's move-in date lies at least long_tenure_months
      whole months before the service end date, final_courtesy_mid when it lies at least mid_tenure_months but fewer
      than long_tenure_months whole months before it, and no_courtesy otherwise; the reduced fee is rounded half up to
      the cent. A final-month standing credit is subtracted: standing_credit_autopay when the lease is enrolled in
      rent autopay and at least standing_payment_count utility payments were received fewer than twelve whole months
      before the billing date; standing_credit_manual when at least standing_payment_count utility payments were
      received in that time and the lease is not enrolled in autopay; no_credit otherwise. A final-month renewal
      credit is subtracted as well: renewal_credit_long when the lease has at least long_renewals renewal rent changes
      on record, renewal_credit_short when it has at least short_renewals but fewer than long_renewals, and no_credit
      otherwise. The line's amount is the reduced fee less the final-month standing credit and the final-month renewal
      credit, never below zero, rounded half up to the cent.
    prerequisite: []
    cross_category:
      - category: term
        as: history
        reads: [notice_to_vacate_date, intended_move_out_date, term_rent_changes.change_reason]
        note: The completed final term's notice to vacate and named move-out date set the days charged, and the renewal rent changes set the final-month renewal credit.
      - category: lease
        as: branch
        reads: [move_out_date, community_state, move_in_date, autopay_enrolled]
        note: The lease's move-out date is compared with the notice, its state sets the state final-fee share, its move-in date the tenure courtesy and its autopay enrollment the standing credit.
    compute:
      - pf_last_period: "LATEST('utility_bills', 'billing_period', date_field='bill_date', event_type='utility_flat_charge', service_type='utility_package')"
      - pf_last_read_date: "LATEST('utility_meter_reads', 'read_date', date_field='read_date', service_type='water', billing_period=pf_last_period)"
      - pf_resp_days: "DAYS(pf_last_read_date, F('service_end_date'))"
      - pf_notice: "CFIELD('term', 'notice_to_vacate_date', status='completed')"
      - pf_intended: "CFIELD('term', 'intended_move_out_date', status='completed')"
      - pf_move_out: "CFIELD('lease', 'move_out_date')"
      - pf_days_charged: "pf_resp_days - 1 if (pf_notice != None and DAYS(pf_notice, F('service_end_date')) >= K('long_notice_days') and pf_intended == pf_move_out) else (K('convention_days') if pf_notice == None else pf_resp_days)"
      - pf_state: "CFIELD('lease', 'community_state')"
      - pf_state_share: "K('state_share_hot') if (pf_state == 'AZ' or pf_state == 'TX') else (K('state_share_coastal') if (pf_state == 'CA' or pf_state == 'WA') else K('full_share'))"
      - pf_prorated: "RND(P('package_monthly_fee') * pf_days_charged / K('convention_days') * pf_state_share, 2)"
      - pf_tenure: "MONTHS(CFIELD('lease', 'move_in_date'), F('service_end_date'))"
      - pf_courtesy: "K('final_courtesy_long') if pf_tenure >= K('long_tenure_months') else (K('final_courtesy_mid') if (pf_tenure >= K('mid_tenure_months') and pf_tenure < K('long_tenure_months')) else K('no_courtesy'))"
      - pf_reduced: "RND(pf_prorated * (K('full_share') - pf_courtesy), 2)"
      - pf_autopay: "CFIELD('lease', 'autopay_enrolled')"
      - pf_payments: "COUNT('utility_bills', within_months=12, date_field='bill_date', event_type='utility_payment')"
      - pf_standing_credit: "K('standing_credit_autopay') if (pf_autopay and pf_payments >= K('standing_payment_count')) else (K('standing_credit_manual') if ((not pf_autopay) and pf_payments >= K('standing_payment_count')) else K('no_credit'))"
      - pf_renewals: "XCOUNT('term', 'term_rent_changes', event_type='term_rent_change', change_reason='renewal')"
      - pf_renewal_credit: "K('renewal_credit_long') if pf_renewals >= K('long_renewals') else (K('renewal_credit_short') if (pf_renewals >= K('short_renewals') and pf_renewals < K('long_renewals')) else K('no_credit'))"
      - result: "MX(0, RND(pf_reduced - pf_standing_credit - pf_renewal_credit, 2))"
    compute_basis:
      pf_last_period: "the days of responsibility of the final period are the days from the period-end water read of the last period that carries a package fee line to the service end date"
      pf_last_read_date: "the period-end water read of the last period that carries a package fee line"
      pf_resp_days: "the days of responsibility of the final period are the days from the period-end water read of the last period that carries a package fee line to the service end date"
      pf_notice: "a notice to vacate on the lease's completed final term was received at least long_notice_days days before the service end date"
      pf_intended: "the lease's move-out date is the move-out date that notice named"
      pf_move_out: "the lease's move-out date is the move-out date that notice named"
      pf_days_charged: "when a notice to vacate on the lease's completed final term was received at least long_notice_days days before the service end date and the lease's move-out date is the move-out date that notice named, the service end date itself is not charged and the days charged are the days of responsibility less one; when the lease's completed final term carries no notice to vacate, the whole 30-day month is charged; in every other situation the days charged are the days of responsibility."
      pf_state: "a state final-fee share set by the community's state as recorded on the lease"
      pf_state_share: "state_share_hot in AZ or TX, state_share_coastal in CA or WA, the whole fee in any other state"
      pf_prorated: "The prorated final package fee is package_monthly_fee times the days charged divided by convention_days times a state final-fee share set by the community's state as recorded on the lease — state_share_hot in AZ or TX, state_share_coastal in CA or WA, the whole fee in any other state — all multiplied together and rounded half up to the cent once."
      pf_tenure: "when the lease's move-in date lies at least long_tenure_months whole months before the service end date"
      pf_courtesy: "final_courtesy_long when the lease's move-in date lies at least long_tenure_months whole months before the service end date, final_courtesy_mid when it lies at least mid_tenure_months but fewer than long_tenure_months whole months before it, and no_courtesy otherwise"
      pf_reduced: "A final-month tenure courtesy then reduces the prorated final package fee"
      pf_autopay: "when the lease is enrolled in rent autopay"
      pf_payments: "at least standing_payment_count utility payments were received fewer than twelve whole months before the billing date"
      pf_standing_credit: "A final-month standing credit is subtracted: standing_credit_autopay when the lease is enrolled in rent autopay and at least standing_payment_count utility payments were received fewer than twelve whole months before the billing date; standing_credit_manual when at least standing_payment_count utility payments were received in that time and the lease is not enrolled in autopay; no_credit otherwise."
      pf_renewals: "when the lease has at least long_renewals renewal rent changes on record"
      pf_renewal_credit: "A final-month renewal credit is subtracted as well: renewal_credit_long when the lease has at least long_renewals renewal rent changes on record, renewal_credit_short when it has at least short_renewals but fewer than long_renewals, and no_credit otherwise."
      result: "The line's amount is the reduced fee less the final-month standing credit and the final-month renewal credit, never below zero, rounded half up to the cent."
    factors:
      - id: notice_days_charged
        effect: method
        decides: pf_days_charged
        bindings: [pf_notice, pf_intended, pf_move_out, pf_days_charged]
        ladder:
          - when: "a notice to vacate on the lease's completed final term was received at least long_notice_days days before the service end date and the lease's move-out date is the move-out date that notice named"
            method: "the service end date is not charged: the days charged are the days of responsibility less one"
          - when: "the lease's completed final term carries no notice to vacate"
            method: "the whole 30-day month is charged"
          - when: "otherwise"
            method: "the days charged are the days of responsibility"
        baseline:
          pf_days_charged: "pf_resp_days"
        evidence: [date, cross_category]
        cross_difficulty: term
      - id: state_final_fee_share
        effect: parameter
        decides: pf_state_share
        bindings: [pf_state, pf_state_share]
        ladder:
          - when: "the community's state as recorded on the lease is AZ or TX"
            value: "K('state_share_hot')"
          - when: "the community's state as recorded on the lease is CA or WA"
            value: "K('state_share_coastal')"
          - when: "otherwise"
            value: "the whole fee"
        baseline:
          pf_state_share: "K('full_share')"
        evidence: [cross_category]
        cross_difficulty: lease
      - id: final_month_tenure_courtesy
        effect: parameter
        decides: pf_courtesy
        bindings: [pf_tenure, pf_courtesy]
        ladder:
          - when: "the lease's move-in date lies at least long_tenure_months whole months before the service end date"
            value: "K('final_courtesy_long')"
          - when: "it lies at least mid_tenure_months but fewer than long_tenure_months whole months before it"
            value: "K('final_courtesy_mid')"
          - when: "otherwise"
            value: "K('no_courtesy')"
        baseline:
          pf_courtesy: "K('no_courtesy')"
        evidence: [date, cross_category]
        cross_difficulty: lease
      - id: final_month_standing_credit
        effect: parameter
        decides: pf_standing_credit
        bindings: [pf_autopay, pf_payments, pf_standing_credit]
        ladder:
          - when: "the lease is enrolled in rent autopay and at least standing_payment_count utility payments were received fewer than twelve whole months before the billing date"
            value: "K('standing_credit_autopay')"
          - when: "at least standing_payment_count utility payments were received in that time and the lease is not enrolled in autopay"
            value: "K('standing_credit_manual')"
          - when: "otherwise"
            value: "K('no_credit')"
        baseline:
          pf_standing_credit: "K('no_credit')"
        evidence: [history, cross_category]
        cross_difficulty: lease
      - id: final_month_renewal_credit
        effect: parameter
        decides: pf_renewal_credit
        bindings: [pf_renewals, pf_renewal_credit]
        ladder:
          - when: "the lease has at least long_renewals renewal rent changes on record"
            value: "K('renewal_credit_long')"
          - when: "the lease has at least short_renewals but fewer than long_renewals renewal rent changes on record"
            value: "K('renewal_credit_short')"
          - when: "otherwise"
            value: "K('no_credit')"
        baseline:
          pf_renewal_credit: "K('no_credit')"
        evidence: [history, cross_category]
        cross_difficulty: term
    baseline:
      rule: >-
        Final package fees are prorated over a 30-day month: the days of responsibility of the final period are the
        days from the period-end water read of the last period that carries a package fee line to the service end
        date, and the final package fee line records the days charged as its proration days over convention_days days
        in the period. The final package fee line bills package_monthly_fee times the days of responsibility divided
        by convention_days, rounded half up to the cent.
      params: [package_monthly_fee, convention_days]
    inputs:
      history:
        - {table: utility_bills, aggregate: latest, field: billing_period, filters: {event_type: utility_flat_charge, service_type: utility_package}}
        - {table: utility_meter_reads, aggregate: latest, field: read_date, filters: {service_type: water}}
        - {table: utility_bills, aggregate: count, field: bill_id, within_months: 12, filters: {event_type: utility_payment}}
        - {category: term, table: term_rent_changes, aggregate: count, field: rent_change_id, filters: {event_type: term_rent_change, change_reason: renewal}}
      cross_category: [term, lease]
  - id: utility_ext_final_water_overage
    base_policy_refs: [utility_evt_flat_and_package, utility_final_bill_and_close]
    overwrite:
      - base_policy: utility_evt_flat_and_package
        superseded_clause: >-
          Usage of water, gas or electricity above its prorated allowance is billed as an overage line at the
          submetered rate times package_overage_rate_multiplier, water overage also carrying the sewer rate;
        replaced_by: >-
          The final water overage line bills the final water overage times water_rate_per_kgal plus
          sewer_rate_per_kgal, times package_overage_rate_multiplier, rounded half up to the cent.
      - base_policy: utility_evt_flat_and_package
        superseded_clause: >-
          Flat amounts, the package fee and the package allowances are prorated for a partial first or last month by days of responsibility over the actual days of the period (proration_method), rounded half up to the cent (allowances to 3 decimals).
        replaced_by: >-
          The final water allowance is package_water_allowance_kgal times the proration days over the days in period recorded on the account's latest package fee line, rounded to 3 decimals. Water allowances of every period other than the final period of an account in final billing remain prorated for a partial month by days of responsibility over the actual days of the period, to 3 decimals.
      - base_policy: utility_final_bill_and_close
        superseded_clause: >-
          the last period's usage, allocation or overage lines and flat or package lines prorated through the service end date
        replaced_by: >-
          The final water allowance is package_water_allowance_kgal times the proration days over the days in period recorded on the account's latest package fee line, rounded to 3 decimals.
    trigger: state_due
    subject: [utility_package_overage]
    computes: amount
    target_tool: post_final_water_overage_2681eca1
    params:
      large_household: 4
      three_person_household: 3
      cleaning_allowance_large: 0.750
      cleaning_allowance_three: 0.500
      no_allowance: 0.0
      block_history_lines: 3
      block_width_kgal: 1.000
      block_rate_multiple: 1.25
      uniform_rate_multiple: 1.10
      sewer_share_large: 0.50
      sewer_share_two: 0.75
      full_share: 1.0
      drought_multiple_high: 1.10
      drought_multiple_moderate: 1.05
      long_tenure_months: 36
      mid_tenure_months: 12
      tenure_share_long: 0.80
      tenure_share_mid: 0.90
      long_renewals: 3
      short_renewals: 1
      renewal_share_long: 0.90
      renewal_share_short: 0.95
    rule: >-
      The final water overage line is the water overage line of the final billing period of an All-Inclusive
      Utility Package account whose billing responsibility has ended; it is issued at the first bill issue after the
      service end date and is owed from that bill issue day until it stands on the account whenever the final water
      overage is above zero. The final water allowance is prorated only after the final period's package fee line
      stands on the account with its proration days. The final water allowance is package_water_allowance_kgal times
      the proration days over the days in period recorded on the account's latest package fee line, rounded to 3
      decimals. Water allowances of every period other than the final period of an account in final billing remain prorated for a partial month by days of responsibility over the actual days of the period, to 3 decimals. The final water overage is the water usage recorded on the account's latest water read, the service
      end read, less the final water allowance, never below zero, rounded to 3 decimals; the line records it as its
      usage. The final water overage line bills the final water overage times water_rate_per_kgal plus
      sewer_rate_per_kgal, times package_overage_rate_multiplier, rounded half up to the cent. A move-out cleaning
      allowance is subtracted from the water usage together with the final water allowance before the final water
      overage is measured: cleaning_allowance_large when the lease approves at least large_household occupants,
      cleaning_allowance_three when it approves exactly three_person_household occupants, and no_allowance
      otherwise. The final water overage is priced in blocks according to the account's water overage record: when
      at least block_history_lines water overage lines were issued on the account fewer than twelve whole months
      before the billing date, the first block_width_kgal of the final water overage is priced as measured and the
      rest at block_rate_multiple times; when at least one but fewer than block_history_lines such lines were issued
      in that time, the whole final water overage is priced at uniform_rate_multiple times; otherwise the final water
      overage is priced as measured; the priced water overage is rounded to 3 decimals. The sewer rate carried by the
      final water overage is sewer_rate_per_kgal times a sewer carriage share set by the floor plan on the lease:
      sewer_share_large for a Three-Bedroom Residence or a Penthouse Residence, sewer_share_two for a Two-Bedroom
      Residence, and the whole sewer rate for any other floor plan. The share falls with the floor plan because the larger floor plans carry private patio hose bibs whose water never reaches the sewer. A drought surcharge multiple set by the
      community's state as recorded on the lease applies: drought_multiple_high in AZ or TX, drought_multiple_moderate
      in CA, and none in any other state. A final-overage tenure share applies: tenure_share_long when the lease's
      move-in date lies at least long_tenure_months whole months before the service end date, tenure_share_mid when it
      lies at least mid_tenure_months but fewer than long_tenure_months whole months before it, and the whole charge
      otherwise. A final-overage renewal share applies: renewal_share_long when the lease has at least long_renewals
      renewal rent changes on record, renewal_share_short when it has at least short_renewals but fewer than
      long_renewals, and the whole charge otherwise. The line's amount is the priced water overage times
      water_rate_per_kgal plus the carried sewer rate, times package_overage_rate_multiplier, the drought surcharge
      multiple, the final-overage tenure share and the final-overage renewal share, all multiplied together and
      rounded half up to the cent once at the end.
    prerequisite:
      - problem: utility_ext_final_package_fee
        kind: value_input
        gate: wo_days
        form: state
        policy_source: >-
          The final water allowance is prorated only after the final period's package fee line stands on the account
          with its proration days.
        condition: >-
          utility_bills carries a utility_package flat charge line for the final billing period whose proration_days
          and days_in_period are those of the final period, so it is the account's latest package fee line.
        resolved_by: post_final_package_fee_c766a545
        effect: >-
          The final water allowance is prorated by the proration days and days in period of the final package fee
          line instead of those of the last full period's line, so the final water overage and its charge change.
    cross_category:
      - category: lease
        as: branch
        reads: [occupants_count, variant_name, community_state, move_in_date]
        note: The lease's approved occupants set the move-out cleaning allowance, its floor plan the sewer carriage share, its state the drought surcharge and its move-in date the final-overage tenure share.
      - category: term
        as: history
        reads: [term_rent_changes.change_reason]
        note: The count of renewal rent changes on the lease's terms sets the final-overage renewal share.
    compute:
      - wo_days: "LATEST('utility_bills', 'proration_days', date_field='bill_date', event_type='utility_flat_charge', service_type='utility_package')"
      - wo_period_days: "LATEST('utility_bills', 'days_in_period', date_field='bill_date', event_type='utility_flat_charge', service_type='utility_package')"
      - wo_usage: "LATEST('utility_meter_reads', 'usage_quantity', date_field='read_date', service_type='water')"
      - wo_allowance: "RND(P('package_water_allowance_kgal') * wo_days / wo_period_days, 3)"
      - wo_occupants: "CFIELD('lease', 'occupants_count')"
      - wo_cleaning: "K('cleaning_allowance_large') if wo_occupants >= K('large_household') else (K('cleaning_allowance_three') if wo_occupants == K('three_person_household') else K('no_allowance'))"
      - wo_overage: "MX(0, RND(wo_usage - wo_allowance - wo_cleaning, 3))"
      - wo_history: "COUNT('utility_bills', within_months=12, date_field='bill_date', event_type='utility_package_overage', service_type='water')"
      - wo_priced: "RND(MN(wo_overage, K('block_width_kgal')) + MX(0, wo_overage - K('block_width_kgal')) * K('block_rate_multiple'), 3) if wo_history >= K('block_history_lines') else (RND(wo_overage * K('uniform_rate_multiple'), 3) if (wo_history >= 1 and wo_history < K('block_history_lines')) else wo_overage)"
      - wo_floor_plan: "CFIELD('lease', 'variant_name')"
      - wo_sewer_share: "K('sewer_share_large') if (wo_floor_plan == 'Three-Bedroom Residence' or wo_floor_plan == 'Penthouse Residence') else (K('sewer_share_two') if wo_floor_plan == 'Two-Bedroom Residence' else K('full_share'))"
      - wo_state: "CFIELD('lease', 'community_state')"
      - wo_drought: "K('drought_multiple_high') if (wo_state == 'AZ' or wo_state == 'TX') else (K('drought_multiple_moderate') if wo_state == 'CA' else K('full_share'))"
      - wo_tenure: "MONTHS(CFIELD('lease', 'move_in_date'), F('service_end_date'))"
      - wo_tenure_share: "K('tenure_share_long') if wo_tenure >= K('long_tenure_months') else (K('tenure_share_mid') if (wo_tenure >= K('mid_tenure_months') and wo_tenure < K('long_tenure_months')) else K('full_share'))"
      - wo_renewals: "XCOUNT('term', 'term_rent_changes', event_type='term_rent_change', change_reason='renewal')"
      - wo_renewal_share: "K('renewal_share_long') if wo_renewals >= K('long_renewals') else (K('renewal_share_short') if (wo_renewals >= K('short_renewals') and wo_renewals < K('long_renewals')) else K('full_share'))"
      - result: "RND(wo_priced * (P('water_rate_per_kgal') + P('sewer_rate_per_kgal') * wo_sewer_share) * P('package_overage_rate_multiplier') * wo_drought * wo_tenure_share * wo_renewal_share, 2)"
    compute_basis:
      wo_days: "The final water allowance is package_water_allowance_kgal times the proration days over the days in period recorded on the account's latest package fee line, rounded to 3 decimals."
      wo_period_days: "the proration days over the days in period recorded on the account's latest package fee line"
      wo_usage: "The final water overage is the water usage recorded on the account's latest water read, the service end read, less the final water allowance, never below zero, rounded to 3 decimals"
      wo_allowance: "The final water allowance is package_water_allowance_kgal times the proration days over the days in period recorded on the account's latest package fee line, rounded to 3 decimals."
      wo_occupants: "cleaning_allowance_large when the lease approves at least large_household occupants"
      wo_cleaning: "A move-out cleaning allowance is subtracted from the water usage together with the final water allowance before the final water overage is measured: cleaning_allowance_large when the lease approves at least large_household occupants, cleaning_allowance_three when it approves exactly three_person_household occupants, and no_allowance otherwise."
      wo_overage: "The final water overage is the water usage recorded on the account's latest water read, the service end read, less the final water allowance, never below zero, rounded to 3 decimals"
      wo_history: "when at least block_history_lines water overage lines were issued on the account fewer than twelve whole months before the billing date"
      wo_priced: "when at least block_history_lines water overage lines were issued on the account fewer than twelve whole months before the billing date, the first block_width_kgal of the final water overage is priced as measured and the rest at block_rate_multiple times; when at least one but fewer than block_history_lines such lines were issued in that time, the whole final water overage is priced at uniform_rate_multiple times; otherwise the final water overage is priced as measured; the priced water overage is rounded to 3 decimals."
      wo_floor_plan: "a sewer carriage share set by the floor plan on the lease"
      wo_sewer_share: "sewer_share_large for a Three-Bedroom Residence or a Penthouse Residence, sewer_share_two for a Two-Bedroom Residence, and the whole sewer rate for any other floor plan. The share falls with the floor plan because the larger floor plans carry private patio hose bibs whose water never reaches the sewer."
      wo_state: "A drought surcharge multiple set by the community's state as recorded on the lease applies"
      wo_drought: "drought_multiple_high in AZ or TX, drought_multiple_moderate in CA, and none in any other state."
      wo_tenure: "when the lease's move-in date lies at least long_tenure_months whole months before the service end date"
      wo_tenure_share: "A final-overage tenure share applies: tenure_share_long when the lease's move-in date lies at least long_tenure_months whole months before the service end date, tenure_share_mid when it lies at least mid_tenure_months but fewer than long_tenure_months whole months before it, and the whole charge otherwise."
      wo_renewals: "when the lease has at least long_renewals renewal rent changes on record"
      wo_renewal_share: "A final-overage renewal share applies: renewal_share_long when the lease has at least long_renewals renewal rent changes on record, renewal_share_short when it has at least short_renewals but fewer than long_renewals, and the whole charge otherwise."
      result: "The line's amount is the priced water overage times water_rate_per_kgal plus the carried sewer rate, times package_overage_rate_multiplier, the drought surcharge multiple, the final-overage tenure share and the final-overage renewal share, all multiplied together and rounded half up to the cent once at the end."
    factors:
      - id: moveout_cleaning_allowance
        effect: parameter
        decides: wo_cleaning
        bindings: [wo_occupants, wo_cleaning]
        ladder:
          - when: "the lease approves at least large_household occupants"
            value: "K('cleaning_allowance_large')"
          - when: "the lease approves exactly three_person_household occupants"
