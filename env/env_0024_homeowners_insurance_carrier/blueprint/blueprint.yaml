name: env_0024_homeowners_insurance_carrier
company: Larkspur Mutual Insurance Company

background: |
  Larkspur Mutual Insurance Company is a policyholder-owned property and casualty mutual headquartered in Columbus, Ohio, writing personal property lines for Ohio households since 1911 and today servicing roughly 410,000 policies through its policy service and claims desk.
  The desk speaks in the plain, steady voice of a regional mutual: it explains the declarations page, the bill and the claim file the way a neighbor who happens to be an underwriter would.
  Homeowners are insured under the HomeGuard Homeowners Policy in six packages, HomeGuard HO-3 Essential, HomeGuard HO-3 Enhanced, HomeGuard HO-3 Premier, HomeGuard HO-5 Enhanced, HomeGuard HO-5 Premier and HomeGuard HO-5 Signature, each bound on one residence premises with its own Coverage A, deductibles, roof settlement basis and billing plan.
  Condominium owners hold the CondoGuard Unit-Owners Policy, written as CondoGuard HO-6 Named Perils Essential, CondoGuard HO-6 Named Perils Enhanced, CondoGuard HO-6 Special Essential, CondoGuard HO-6 Special Enhanced, CondoGuard HO-6 Special Premier and CondoGuard HO-6 Special Signature, sized to what the association's master policy already covers.
  Tenants hold the RentGuard Renters Policy as RentGuard HO-4 Starter, RentGuard HO-4 Essential, RentGuard HO-4 Enhanced, RentGuard HO-4 Premier, RentGuard HO-4 Premier Plus or RentGuard HO-4 Signature, rated on the rental unit's territory and usually paid monthly.
  Landlords insure rental buildings under the LandlordGuard Dwelling Fire Policy as LandlordGuard DP-1 Basic, LandlordGuard DP-2 Broad, LandlordGuard DP-3 Special, LandlordGuard DP-3 Special Plus, LandlordGuard DP-3 Premier or LandlordGuard DP-3 Portfolio.
  Flood is written separately under the FloodGuard Private Flood Policy as FloodGuard Contents Only, FloodGuard Essential, FloodGuard Standard, FloodGuard Plus, FloodGuard Premier and FloodGuard High Value, often billed to the mortgage lender's escrow account.
  Households add liability protection with the Larkspur Personal Umbrella Policy at Larkspur Umbrella 1M, 2M, 3M, 4M, 5M or 10M, scheduled over their home, condominium, renters, landlord, auto and watercraft policies.
  Jewelry, watches, fine art and other valuables are scheduled item by item on the Larkspur Valuables Floater as Valuables Floater Classic, Select, Preferred, Prestige, Collector or Private Client.
  Every policy is a twelve-month contract with its own policy number that keeps producing entries after it is bound: installments billed and paid by the insured or the mortgagee, fees, midterm endorsements, underwriting inspections and condition letters, notices of cancellation or nonrenewal, renewals, and claim files with their payments, withheld depreciation and denials.
  Each policy carries a premium account whose balance is the running total of those billing entries, and every claim file carries the money issued on it and any depreciation still held back.
  Callers are mostly named insureds: owner-occupants with a mortgage, condominium owners dealing with their association, renters who move every year or two, and small landlords with a handful of one-to-four-unit rentals.
  A typical household holds one residence policy and often a flood policy, an umbrella or a floater alongside it, so a single call regularly touches several policies in one customer profile.
  They call after a storm or a burst pipe, when a bill or a notice arrives that they do not understand, when they refinance, buy, sell or move, when an inspector leaves a letter, or when a renewal offer shows a different premium.
  Their records carry years of history: prior terms and renewals, earlier claims and payments, returned payments and waived fees, past inspections, and mortgagees that have changed as loans were sold or refinanced.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: home_claim_settlement
    claim:
      categories: [home]
      event_types: [home_claim_reported, home_claim_payment, home_claim_payment_voided, home_holdback_withheld, home_holdback_released, home_holdback_forfeited, home_claim_denied, home_claim_closed, home_claim_reopened]
    summary: >
      Callers are HomeGuard named insureds, on any of the six HO-3 and HO-5 packages and on policies in force, cancelled, expired or renewed with a lapse, who report a loss or follow up on an open claim after wind or hail, a burst or slowly leaking pipe, a sewer backup, a theft or a fire, often with earlier claims on the same or another HomeGuard policy, a mortgagee on file and roofs of very different ages.
      The records involved are the policy's declarations (Coverage A and C limits, deductibles, wind/hail percentage, roof material and install year, roof settlement basis, water backup limit, mortgagee) and the claim file entries keyed by claim number, and the governing rules are home_claim_reporting for coverage on the loss date and the wind and hail reporting period, home_claim_settlement for the per-occurrence deductible, deductible waiver, replacement-cost versus actual-cash-value settlement and payee, home_roof_settlement for roof surfacing schedules and cosmetic hail, home_water_limitations for seepage, hidden water, water backup and mold sublimits, home_depreciation_recovery for releasing or forfeiting withheld depreciation, and home_claim_corrections for voids, closing and reopening, with every figure coming from the tier's column of parameters.
      In the natural course of a claim a first notice is recorded before any payment, an actual-cash-value payment precedes the withheld depreciation and its later release against proof of repair, and closing follows once every coverage part is paid or denied and no holdback remains.
      Reporting the loss, recording payments, releases, forfeitures, voids, denials, closings and reopenings are agent service actions on a verified caller, while stating the date and cause of loss and supplying proof of completed repair and its cost are facts only the insured can give.
      A dispute over the adjuster's estimate or the replacement-cost figure itself, an appraisal demand, a liability suit against the insured, a request to pay a contractor directly without the named insured's authority, and a demand for interest or bad-faith compensation on a delayed payment are outside what these rules decide and go to a human representative as POLICY_NOT_COVERED.

  - name: renters_billing_and_cancellation
    claim:
      categories: [renters]
      event_types: [renters_policy_cancelled, renters_policy_reinstated, renters_cancellation_rescinded, renters_fee_assessed, renters_fee_waived, renters_payment_received, renters_payment_returned, renters_additional_premium, renters_return_premium, renters_refund_issued, renters_balance_written_off, renters_collection_referred, renters_relocated, renters_coverage_updated, renters_billing_plan_changed]
    summary: >
      Callers are RentGuard named insureds on any of the six HO-4 tiers, many on monthly EFT or card plans, who are moving to a new apartment, moving out to buy a home, confused by a fee or a notice of cancellation, trying to get back in force after missing payments, or asking where their refund went; their accounts carry returned payments, waived fees, earlier reinstatements, roommates added as co-insured, landlords listed as interested parties and, for some, an umbrella or valuables floater that earns a bundle discount.
      The records are the renters policy (rental address, ZIP and territory, limits, deductible, billing plan, EFT suspension, term premium and premium balance), its premium account entries with due dates, fee codes, change reasons and source references, and its signature requests, and the governing rules are renters_premium_rating and renters_agg_bundle_discount for the annual premium and midterm re-rating, renters_premium_billing, renters_fees_and_waivers and renters_payment_application for installments, fees, courtesy waivers and returned payments, renters_nonpayment_cancellation, renters_insured_cancellation and renters_reinstatement for notices, backdated and short-rate cancellations and reinstatement windows, renters_refunds_and_collections for refunds, write-offs and collection referrals, and renters_midterm_changes for relocations and coverage changes, each figure taken from the tier's parameters.
      In the natural course of the account an installment is billed before it can be late, a notice of cancellation precedes the cancellation itself, a cancellation credit precedes any refund of the resulting balance, and a reinstatement follows a nonpayment cancellation.
      Posting payments, fees, waivers, re-ratings, credits, refunds, write-offs and reinstatements are agent service actions on a verified caller, whereas signing a cancellation request or a statement of no loss is something only the named insured can do and is handed to them.
      A request to remove a collection referral from a credit report, to split one policy into two after roommates separate, or to settle a landlord's security-deposit dispute is not decided by any rule here and goes to a human representative as POLICY_NOT_COVERED.

  - name: condo_coverage_changes
    claim:
      categories: [condo]
      event_types: [condo_endorsement_added, condo_endorsement_removed, condo_coverage_updated, condo_association_updated, condo_additional_premium, condo_return_premium, condo_claim_reported, condo_claim_payment, condo_claim_denied, condo_nonrenewal_noticed, condo_nonrenewal_rescinded]
    summary: >
      Callers are CondoGuard unit owners on named-perils or special-form HO-6 tiers whose association has just changed its master policy or deductible, who received a special assessment after damage to common property, who want to rent the unit out, or who want to raise loss assessment, water backup, Coverage A or liability limits; some own several units, some have an open claim, and some carry an umbrella that lists the condo as underlying.
      The records are the condo policy (association, master policy type and deductible, association change date, occupancy, Coverage A, C, loss assessment, liability and water backup limits, deductible), its endorsement entries, premium account and claim entries with assessment dates and bases, and the governing rules are condo_endorsements for availability, steps, pricing, proration, the open-claim freeze and the umbrella liability floor, condo_association_changes for Coverage A minimums by master policy type and the association change period, condo_bind_eligibility for the minimum table, condo_loss_assessment and condo_agg_assessment_per_unit for assessment coverage, the deductible assessment sublimit and per-unit caps, and condo_claim_settlement for what Coverage A pays under each master policy type, with figures taken per tier.
      In the natural course of the policy an association change is recorded before the coverage it affects is brought into line, an endorsement is recorded before its premium is billed or credited, and an assessment is reported as a claim before it is paid or denied.
      Recording endorsements, association changes, premium adjustments, assessment claims and payments is agent service work on a verified caller; the owner alone states the association's change from its certificate or notice, the unit's use, and the assessment share levied on the unit.
      Disputes with the association over how an assessment was apportioned, a request to transfer the policy to a buyer of the unit, and questions about the association's own master policy are not decided by these rules and go to a human representative as POLICY_NOT_COVERED.

  - name: dwelling_underwriting_and_renewal
    claim:
      categories: [dwelling]
      event_types: [dwelling_inspection_ordered, dwelling_inspection_completed, dwelling_condition_letter_issued, dwelling_cure_extension_granted, dwelling_condition_cured, dwelling_property_updated, dwelling_occupancy_updated, dwelling_vacancy_permit_issued, dwelling_additional_premium, dwelling_cancellation_noticed, dwelling_cancellation_rescinded, dwelling_nonrenewal_noticed, dwelling_nonrenewal_rescinded, dwelling_renewal_offered, dwelling_policy_renewed]
    summary: >
      Callers are small landlords insuring one to four unit rentals on LandlordGuard DP-1, DP-2 or DP-3 tiers, sometimes a whole book of properties on the Portfolio tier, who have an inspection letter with a cure date, a building sitting empty between tenants or under renovation, a notice of cancellation or nonrenewal, a renewal offer showing a sharp increase, or a new roof they want recognized.
      The records are the dwelling policy (units, roof and year built, occupancy, vacancy start and permit dates, lease type, limits, original effective and expiration dates, indicated renewal premium), its inspection entries with findings, letters, extensions and cures, and its premium account, and the governing rules are dwelling_inspections_and_conditions for letters, extensions, cure deadlines and proof, dwelling_occupancy_and_vacancy and dwelling_cancellation for vacancy permits, vacancy and new-business cancellation windows, dwelling_nonrenewal for grounds, precedence, notice deadlines and rescission, dwelling_renewal for the rate cap and inflation guard, and dwelling_agg_portfolio_tier for the portfolio minimum, each with per-tier values.
      In the natural course of underwriting an inspection is ordered before it is completed, a finding produces a letter before any extension or cure, a notice precedes the cancellation or nonrenewal it announces, and a renewal offer records the indicated premium before the renewal takes effect.
      Recording inspections, letters, extensions, cures, occupancy changes, vacancy permits and their charges, notices, rescissions and renewals are agent actions on a verified caller, while the landlord alone reports vacancy dates, tenants and lease terms and supplies the photographs, invoices or certificates that prove a correction.
      Appeals of an inspector's finding itself, commercial or mixed-use buildings, and disputes about how the rating system produced its indicated premium are outside these rules and go to a human representative as POLICY_NOT_COVERED.

  - name: flood_coverage_and_mortgagee_billing
    claim:
      categories: [flood]
      event_types: [flood_policy_bound, flood_endorsement_added, flood_coverage_updated, flood_additional_premium, flood_mortgagee_changed, flood_mortgagee_invoice, flood_payment_received, flood_refund_issued, flood_policy_cancelled, flood_return_premium, flood_policy_renewed, flood_renewal_offered, flood_zone_updated]
    summary: >
      Callers are FloodGuard policyholders and applicants, from contents-only renters and condo owners to owners of high-value homes, who need flood coverage for a loan closing, just learned a map revision put their building in a high-risk zone, want to raise limits before storm season, refinanced or paid off the loan, sold the house, or see a renewal invoice or refund routed to their lender; many also hold a HomeGuard, CondoGuard, RentGuard or LandlordGuard policy at the same address.
      The records are the flood policy (zone, map revision date, elevation certificate, occupancy, building replacement cost, limits and deductibles, purchase reason, bound, effective and expiration dates, billing plan, mortgagee, indicated renewal premium), its limit-increase entries, premium account and cancellation requests, and the governing rules are flood_waiting_period for standard, loan-closing, map-revision and midterm-increase waiting periods, flood_premium_rating and flood_agg_companion_discount for premium, proration and the renewal rate cap, flood_billing_and_mortgagee for escrow invoicing, payments and refunds to the right payer, flood_cancellation for accepted reasons, backdating limits, fully earned premium and the policy fee, flood_renewal for the grace period and repetitive loss, and flood_zone_changes, with every figure taken per tier.
      In the natural course of the policy it is bound before coverage attaches after its waiting period, a limit increase is requested before it attaches, a renewal is offered and invoiced before it is paid, and a cancellation credit precedes any refund.
      Binding, recording limit increases, mortgagee changes, zone updates, invoices, payments, credits, refunds and renewals are agent actions on a verified caller, while a cancellation request and its reason must be signed by the named insured, and loan-closing dates, sale or payoff dates and map or elevation documents come from the insured.
      Requests to handle a National Flood Insurance Program policy, to dispute the flood zone shown on the published map, or to obtain an elevation certificate are outside these rules and go to a human representative as POLICY_NOT_COVERED.
