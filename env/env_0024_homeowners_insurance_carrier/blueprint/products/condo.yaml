# Policy charter — CondoGuard Unit-Owners Policy (HO-6), Larkspur Mutual Insurance Company.
category: condo
display_name: CondoGuard Unit-Owners Policy

binding:
  holding_table: condo_policies
  event_tables: [condo_billing, condo_endorsements, condo_claims]
  intake_tables: [condo_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_balance}

lifecycle:
  states: [bound, in_force, pending_cancellation, cancelled, pending_nonrenewal, expired]
  transitions:
    - {from: bound, to: in_force, by: system, means: The policy reaches its effective date and coverage attaches.}
    - {from: bound, to: cancelled, by: user, means: The named insured signs a request to cancel before the policy takes effect.}
    - {from: in_force, to: pending_cancellation, by: agent, means: A notice of cancellation for nonpayment is issued with a scheduled cancellation date.}
    - {from: pending_cancellation, to: in_force, by: agent, means: The past-due amount arrives before the scheduled cancellation date and the notice is rescinded.}
    - {from: pending_cancellation, to: cancelled, by: system, means: The scheduled cancellation date arrives without payment.}
    - {from: in_force, to: cancelled, by: user, means: The named insured signs a request to cancel midterm, for example after selling the unit.}
    - {from: cancelled, to: in_force, by: agent, means: A policy cancelled for nonpayment is reinstated inside the reinstatement window.}
    - {from: in_force, to: pending_nonrenewal, by: agent, means: A notice of nonrenewal is issued.}
    - {from: pending_nonrenewal, to: in_force, by: agent, means: The ground for nonrenewal is cured before expiration and the notice is rescinded.}
    - {from: pending_nonrenewal, to: expired, by: system, means: The expiration date arrives under a notice of nonrenewal.}
    - {from: in_force, to: expired, by: system, means: The expiration date arrives and the renewal premium was not received.}

accounts:
  - key: premium_balance
    unit: USD
    meaning: Premium and fees owed on the unit-owners policy; positive owed to the carrier, negative a credit.
  - key: indemnity_paid
    unit: USD
    meaning: Claim money issued per claim and coverage part; issued payments raise it and voided payments lower it.
  - key: depreciation_holdback
    unit: USD
    meaning: Recoverable depreciation withheld from a replacement-cost payment, awaiting release or forfeiture.

parameter_schema:
  coverage_a_perils: Peril basis for Coverage A unit property (enum named_perils | open_perils).
  personal_property_perils: Peril basis for Coverage C (enum named_perils | open_perils).
  personal_property_settlement: Coverage C settlement basis (enum actual_cash_value | replacement_cost).
  min_coverage_a_bare_walls: Minimum Coverage A when the association master policy is bare walls (USD).
  min_coverage_a_single_entity: Minimum Coverage A when the master policy is single entity (USD).
  min_coverage_a_all_in: Minimum Coverage A when the master policy is all-in (USD).
  max_coverage_a: Maximum Coverage A (USD).
  personal_property_min: Minimum Coverage C (USD).
  personal_property_max: Maximum Coverage C (USD).
  loss_assessment_included_limit: Loss assessment limit included in the package (USD).
  loss_assessment_max_limit: Highest total loss assessment limit, included plus purchased (USD).
  loss_assessment_rate_per_5000: Annual premium per 5,000 USD of loss assessment limit purchased above the included limit (USD).
  deductible_assessment_sublimit: Most paid for an assessment that passes on the association's master policy deductible (USD).
  loss_assessment_deductible: Deductible per loss assessment claim (USD).
  loss_of_use_pct: Coverage D loss of use as a percent of Coverage C (percent).
  liability_limit_options: Personal liability limits the tier may carry (list of USD).
  medical_payments_limit: Medical payments to others per person (USD).
  deductible_options: Deductibles the tier may carry (list of USD).
  water_backup_included_limit: Water backup limit included in the package (USD; 0 = none).
  water_backup_max_limit: Highest total water backup limit (USD).
  water_backup_rate_per_5000: Annual premium per 5,000 USD of water backup purchased above the included limit (USD).
  unit_rental_allowed: Whether a unit rented to others may be insured with the unit-owners rental endorsement (boolean).
  unit_rental_annual_premium: Annual premium of the unit-owners rental endorsement (USD).
  identity_fraud_included_limit: Identity fraud expense limit included (USD; 0 = not included).
  identity_fraud_annual_premium: Annual premium of the identity fraud endorsement where not included (USD).
  jewelry_theft_limit: Special limit for theft of jewelry, watches and furs (USD).
  firearms_theft_limit: Special limit for theft of firearms (USD).
  money_limit: Special limit for money (USD).
  rc_no_holdback_threshold: Replacement-cost amount per coverage part at or below which no depreciation is withheld (USD).
  depreciation_recovery_days: Days after the actual-cash-value payment to document repair or replacement for release of withheld depreciation (calendar days).
  coverage_a_rate_per_1000: Annual premium per 1,000 USD of midterm Coverage A change (USD).
  personal_property_rate_per_1000: Annual premium per 1,000 USD of midterm Coverage C change (USD).
  liability_step_annual_premium: Annual premium per step along the tier's liability options (USD).
  min_premium_change: Prorated midterm premium changes below this are neither billed nor credited (USD).
  association_change_report_days: Days after the association changes its master policy type or deductible within which the unit owner's coverage is brought into line (calendar days).
  billing_plans_allowed: Billing plans allowed (list of annual | two_pay | quarterly | monthly_eft | mortgagee_escrow).
  installment_fee_direct: Service charge on each two_pay or quarterly installment after the first (USD).
  installment_fee_eft: Service charge on each monthly_eft installment after the first (USD).
  late_fee: Late fee per late installment (USD; 0 = none).
  late_fee_grace_days: Days past due before a late fee (calendar days).
  returned_payment_fee: Fee per returned payment (USD; 0 = none).
  nonpayment_notice_after_due_days: Days past due after which a nonpayment notice is issued (calendar days).
  nonpayment_cancel_notice_days: Days from a nonpayment notice to the scheduled cancellation date (calendar days).
  insured_cancel_basis: Unearned premium basis on a named-insured cancellation (enum pro_rata | short_rate).
  short_rate_retention_pct: Share of the pro-rata unearned premium kept on a short-rate cancellation (percent).
  minimum_earned_premium: Premium kept at minimum on a named-insured midterm cancellation (USD).
  reinstatement_window_days: Days after a nonpayment cancellation within which reinstatement may be requested (calendar days).
  reinstatement_fee: Fee at reinstatement (USD; 0 = none).
  refund_minimum: Smallest credit balance refunded (USD).
  renewal_offer_lead_days: Days before expiration the renewal is billed (calendar days).
  nonrenewal_notice_days: Minimum advance notice of nonrenewal (calendar days).
  paid_claims_nonrenewal_threshold: Paid claims in the lookback at which the policy becomes eligible for nonrenewal (count).
  claims_lookback_months: Claims lookback window (months).
  mortgagee_notice_days: Advance notice of cancellation owed to the mortgagee (calendar days).
  inflation_guard_pct: Automatic Coverage A increase at renewal (percent).

