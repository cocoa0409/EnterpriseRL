events:
  - type: condo_policy_bound
    target: condo_policies
    mutation: create
    meaning: A unit-owners policy is bound on one condominium unit, sized to the association's master policy type.
    grain: One row per policy contract.
    fields:
      policy_number: Policy number.
      variant_name: Official tier name.
      unit_address: Condominium unit address.
      association_name: Condominium association.
      master_policy_type: Master policy type on file.
      master_policy_deductible: Master policy deductible on file.
      occupancy: How the unit is occupied.
      coverage_a_limit: Coverage A unit property limit.
      personal_property_limit: Coverage C limit.
      loss_assessment_limit: Total loss assessment limit.
      liability_limit: Personal liability limit.
      deductible: Deductible.
      water_backup_limit: Total water backup limit.
      billing_plan: Billing plan.
      mortgagee_name: Mortgagee, empty when none.
      loan_number: Loan number, empty when none.
      bound_date: Date bound.
      original_effective_date: First inception date.
      effective_date: Start of term.
      expiration_date: End of term.
      term_premium: Annual premium of the term.
    triggers:
      - event: condo:condo_premium_billed
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date, posted_date: bound_date}
  - type: condo_policy_activated
    target: condo_policies
    mutation: {transition: {from: bound, to: in_force}}
    meaning: Coverage attaches on the effective date.
    grain: One row per transaction.
    fields: {effective_date: Effective date reached.}
    triggers: []
  - type: condo_cancellation_noticed
    target: condo_policies
    mutation: {transition: {from: in_force, to: pending_cancellation}}
    meaning: A notice of cancellation for nonpayment is issued and copied to the mortgagee.
    grain: One row per transaction.
    fields:
      status_reason: nonpayment.
      pending_action_date: Scheduled cancellation date.
    triggers: []
  - type: condo_cancellation_rescinded
    target: condo_policies
    mutation: {transition: {from: pending_cancellation, to: in_force}}
    meaning: A pending cancellation is withdrawn after payment of the past-due amount.
    grain: One row per transaction.
    fields:
      status_reason: Reset to none.
      pending_action_date: Cleared.
    triggers: []
  - type: condo_policy_cancelled
    target: condo_policies
    mutation:
      transition:
        - {from: pending_cancellation, to: cancelled}
        - {from: in_force, to: cancelled}
        - {from: bound, to: cancelled}
    meaning: Coverage ends before expiration for nonpayment or at the named insured's signed request.
    grain: One row per transaction.
    fields:
      policy_number: Policy number, carried unchanged.
      status_reason: nonpayment or insured_request.
      closed_date: Date coverage ended.
    triggers:
      - event: condo:condo_return_premium
        map: {change_reason: cancellation, effective_date: closed_date, posted_date: closed_date}
      - event: umbrella:umbrella_underlying_lapsed
        map: {underlying_line: condo, underlying_policy_number: policy_number, event_date: closed_date}
  - type: condo_policy_reinstated
    target: condo_policies
    mutation: {transition: {from: cancelled, to: in_force}}
    meaning: A policy cancelled for nonpayment is reinstated without a lapse.
    grain: One row per transaction.
    fields:
      status_reason: Reset to none.
      closed_date: Cleared.
    triggers:
      - event: condo:condo_fee_assessed
        map: {fee_code: reinstatement_fee}
      - event: condo:condo_additional_premium
        map: {change_reason: reinstatement_reversal}
  - type: condo_nonrenewal_noticed
    target: condo_policies
    mutation: {transition: {from: in_force, to: pending_nonrenewal}}
    meaning: A notice of nonrenewal is issued.
    grain: One row per transaction.
    fields:
      status_reason: claim_frequency or coverage_a_below_minimum.
      pending_action_date: Expiration date on which the policy will end.
    triggers: []
  - type: condo_nonrenewal_rescinded
    target: condo_policies
    mutation: {transition: {from: pending_nonrenewal, to: in_force}}
    meaning: A nonrenewal for inadequate Coverage A is withdrawn after Coverage A is raised.
    grain: One row per transaction.
    fields:
      status_reason: Reset to none.
      pending_action_date: Cleared.
    triggers: []
  - type: condo_policy_expired
    target: condo_policies
    mutation:
      transition:
        - {from: pending_nonrenewal, to: expired}
        - {from: in_force, to: expired}
    meaning: The term ends without renewal.
    grain: One row per transaction.
    fields:
      policy_number: Policy number, carried unchanged.
      status_reason: Nonrenewal ground or renewal_not_paid.
      closed_date: The expiration date.
    triggers:
      - event: umbrella:umbrella_underlying_lapsed
        map: {underlying_line: condo, underlying_policy_number: policy_number, event_date: closed_date}
  - type: condo_policy_renewed
    target: condo_policies
    mutation: update
    meaning: The policy rolls into a new twelve-month term.
    grain: One row per transaction.
    fields:
      effective_date: Start of the new term.
      expiration_date: End of the new term.
      coverage_a_limit: Coverage A after the inflation guard.
      term_premium: Renewal term premium.
    triggers:
      - event: condo:condo_premium_billed
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date}
  - type: condo_coverage_updated
    target: condo_policies
    mutation: update
    meaning: A limit, deductible or occupancy on the declarations changes as a result of an endorsement.
    grain: One row per transaction.
    fields:
      coverage_a_limit: Coverage A after the change.
      personal_property_limit: Coverage C after the change.
      loss_assessment_limit: Loss assessment limit after the change.
      liability_limit: Liability limit after the change.
      deductible: Deductible after the change.
      water_backup_limit: Water backup limit after the change.
      occupancy: Occupancy after a unit rental endorsement is added or removed.
    triggers: []
  - type: condo_association_updated
    target: condo_policies
    mutation: update
    meaning: The association's master policy type or master deductible on file changes, as shown on the association's certificate or bylaws notice.
    grain: One row per transaction.
    fields:
      association_name: Association after the change.
      master_policy_type: Master policy type after the change.
      master_policy_deductible: Master deductible after the change.
      association_change_date: Date the association's change took effect.
    triggers: []
  - type: condo_mortgagee_changed
    target: condo_policies
    mutation: update
    meaning: The mortgagee is added, replaced or removed.
    grain: One row per transaction.
    fields:
      mortgagee_name: New mortgagee, empty on payoff.
      loan_number: New loan number, empty on payoff.
    triggers: []
  - type: condo_premium_billed
    target: condo_billing
    meaning: One installment of the term premium is billed.
    grain: One row per installment of a term.
    distinguish_by: [term_effective_date, installment_number]
    fields:
      term_effective_date: Term billed.
      installment_number: Installment position.
      due_date: Due date.
      amount: Installment amount.
      payer: insured or mortgagee.
      posted_date: Bill date.
    account: premium_balance
    direction: in
    triggers:
      - event: condo:condo_fee_assessed
        when: {installment_number: {not: 1}}
        map: {fee_code: installment_fee, term_effective_date: term_effective_date, installment_number: installment_number, posted_date: posted_date}
  - type: condo_fee_assessed
    target: condo_billing
    meaning: An installment, late, returned-payment or reinstatement fee is charged.
    grain: One row per fee.
    distinguish_by: [fee_code, term_effective_date, installment_number, source_billing_id]
    fields:
      fee_code: Fee charged.
      term_effective_date: Term of the fee.
      installment_number: Installment of the fee (0 when none).
      source_billing_id: Returned payment the fee is for; empty otherwise.
      amount: Fee amount.
      posted_date: Date charged.
    account: premium_balance
    direction: in
    triggers: []
  - type: condo_payment_received
    target: condo_billing
    meaning: A premium payment is received from the insured or the mortgagee.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      payment_reference: Confirmation or check number.
      payer: Who paid.
      payment_method: Method.
      amount: Amount.
      posted_date: Date received.
    account: premium_balance
    direction: out
    triggers: []
  - type: condo_payment_returned
    target: condo_billing
    meaning: A payment is returned unpaid and reversed.
    grain: One row per returned payment.
    distinguish_by: [source_billing_id]
    fields:
      source_billing_id: Payment reversed.
      amount: Full payment amount.
      posted_date: Date posted.
    account: premium_balance
    direction: in
    triggers:
      - event: condo:condo_fee_assessed
        map: {fee_code: returned_payment_fee, source_billing_id: condo_billing_id, posted_date: posted_date}
  - type: condo_additional_premium
    target: condo_billing
    meaning: Additional premium from an endorsement, from reversing a cancellation credit at reinstatement, or from earned premium owed at cancellation is charged.
    grain: One row per premium-raising change.
    distinguish_by: [source_endorsement_id, change_reason, effective_date]
    fields:
      source_endorsement_id: Endorsement charged; empty otherwise.
      change_reason: endorsement, reinstatement_reversal or cancellation.
      effective_date: Date the change takes effect.
      amount: Amount charged.
      posted_date: Date charged.
    account: premium_balance
    direction: in
    triggers: []
  - type: condo_return_premium
    target: condo_billing
    meaning: Unearned premium is credited from an endorsement or a cancellation.
    grain: One row per premium-reducing change or cancellation.
    distinguish_by: [source_endorsement_id, change_reason, effective_date, credit_basis]
    fields:
      source_endorsement_id: Endorsement credited; empty for a cancellation.
      change_reason: endorsement or cancellation.
      effective_date: Date the change or cancellation takes effect.
      credit_basis: pro_rata, short_rate or flat.
      amount: Amount credited.
      posted_date: Date credited.
    account: premium_balance
    direction: out
    triggers: []
  - type: condo_refund_issued
    target: condo_billing
    meaning: A credit balance is refunded.
    grain: One row per refund.
    distinguish_by: [posted_date, payer]
    fields:
      payer: insured or mortgagee refunded.
      payment_method: Method.
      amount: Amount refunded.
      posted_date: Date refunded.
    account: premium_balance
    direction: in
    triggers: []
  - type: condo_endorsement_added
    target: condo_endorsements
    meaning: A midterm endorsement adds or raises a coverage, or changes a limit or deductible.
    grain: One row per endorsement change effective on a date.
    distinguish_by: [endorsement_code, effective_date, coverage_value]
    fields:
      endorsement_code: Coverage added or changed.
      request_date: Date requested.
      effective_date: Date effective.
      coverage_value: New limit or deductible (0.00 for unit_rental and identity_fraud).
      annual_premium_change: Full-year premium effect.
      premium_direction: additional, return or none.
      prorated_premium: Prorated premium effect.
    triggers:
      - event: condo:condo_additional_premium
        when: {premium_direction: additional}
        map: {source_endorsement_id: condo_endorsement_id, change_reason: endorsement, effective_date: effective_date, amount: prorated_premium, posted_date: effective_date}
      - event: condo:condo_return_premium
        when: {premium_direction: return}
        map: {source_endorsement_id: condo_endorsement_id, change_reason: endorsement, effective_date: effective_date, amount: prorated_premium, credit_basis: pro_rata, posted_date: effective_date}
      - event: condo:condo_coverage_updated
        when: {endorsement_code: coverage_a_change}
        map: {coverage_a_limit: coverage_value}
      - event: condo:condo_coverage_updated
        when: {endorsement_code: coverage_c_change}
        map: {personal_property_limit: coverage_value}
      - event: condo:condo_coverage_updated
        when: {endorsement_code: loss_assessment_increase}
        map: {loss_assessment_limit: coverage_value}
      - event: condo:condo_coverage_updated
        when: {endorsement_code: liability_change}
        map: {liability_limit: coverage_value}
      - event: condo:condo_coverage_updated
        when: {endorsement_code: deductible_change}
        map: {deductible: coverage_value}
      - event: condo:condo_coverage_updated
        when: {endorsement_code: water_backup}
        map: {water_backup_limit: coverage_value}
      - event: condo:condo_coverage_updated
        when: {endorsement_code: unit_rental}
        map: {occupancy: rented_to_others}
  - type: condo_endorsement_removed
    target: condo_endorsements
    meaning: A purchased optional endorsement is removed midterm.
    grain: One row per removal effective on a date.
    distinguish_by: [endorsement_code, effective_date]
    fields:
      endorsement_code: Optional coverage removed.
      request_date: Date requested.
      effective_date: Date effective.
      coverage_value: Limit remaining after removal.
      annual_premium_change: Full-year premium returned.
      premium_direction: return or none.
      prorated_premium: Prorated premium returned.
    triggers:
      - event: condo:condo_return_premium
        when: {premium_direction: return}
        map: {source_endorsement_id: condo_endorsement_id, change_reason: endorsement, effective_date: effective_date, amount: prorated_premium, credit_basis: pro_rata, posted_date: effective_date}
      - event: condo:condo_coverage_updated
        when: {endorsement_code: loss_assessment_increase}
        map: {loss_assessment_limit: coverage_value}
      - event: condo:condo_coverage_updated
        when: {endorsement_code: water_backup}
        map: {water_backup_limit: coverage_value}
  - type: condo_claim_reported
    target: condo_claims
    meaning: First notice of loss, or of an association assessment, opens a claim number.
    grain: One row per claim.
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number.
      loss_date: Date of the loss (for an assessment, the date of the loss to association property).
      assessment_date: Date the association levied the assessment; empty for a direct loss.
      peril: Cause of loss.
      entry_date: Date reported.
    triggers: []
  - type: condo_claim_payment
    target: condo_claims
    meaning: Claim money is issued for one coverage part and property class.
    grain: One row per payment on a coverage part and property class.
    distinguish_by: [claim_number, coverage_part, property_class, payment_type, entry_date]
    fields:
      claim_number: Claim paid.
      loss_date: Date of loss.
      assessment_date: Assessment date on a loss assessment payment.
      peril: Cause of loss.
      coverage_part: Coverage part paid.
      property_class: Property class paid.
      assessment_basis: Basis of an assessment on a loss assessment payment.
      payment_type: Kind of payment.
      replacement_cost_amount: Replacement-cost value, or the unit's assessment share, after caps.
      depreciation_amount: Depreciation.
      deductible_applied: Deductible absorbed.
      amount: Amount paid.
      payee: Payee.
      entry_date: Date issued.
    account: indemnity_paid
    direction: in
    triggers:
      - event: condo:condo_holdback_withheld
        when: {payment_type: acv_initial}
        map: {claim_number: claim_number, coverage_part: coverage_part, property_class: property_class, amount: depreciation_amount, source_entry_id: condo_claim_entry_id, entry_date: entry_date}
  - type: condo_claim_payment_voided
    target: condo_claims
    meaning: An uncashed claim payment is voided.
    grain: One row per voided payment.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim of the void.
      source_entry_id: Payment voided.
      amount: Amount voided.
      entry_date: Date voided.
    account: indemnity_paid
    direction: out
    triggers: []
  - type: condo_holdback_withheld
    target: condo_claims
    meaning: Recoverable depreciation is withheld from an actual-cash-value payment.
    grain: One row per actual-cash-value payment withholding depreciation.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim.
      coverage_part: Coverage part.
      property_class: Property class.
      source_entry_id: Payment the holdback came from.
      amount: Depreciation withheld.
      entry_date: Date withheld.
    account: depreciation_holdback
    direction: in
    triggers: []
  - type: condo_holdback_released
    target: condo_claims
    meaning: Withheld depreciation is released after completed repair or replacement is documented.
    grain: One row per documented completion released against a holdback.
    distinguish_by: [source_entry_id, entry_date, incurred_amount]
    fields:
      claim_number: Claim.
      coverage_part: Coverage part.
      property_class: Property class.
      source_entry_id: Holdback released against.
      incurred_amount: Documented cost incurred.
      amount: Depreciation released.
      entry_date: Date proof accepted.
    account: depreciation_holdback
    direction: out
    triggers:
      - event: condo:condo_claim_payment
        map: {claim_number: claim_number, coverage_part: coverage_part, property_class: property_class, payment_type: recoverable_depreciation, amount: amount, entry_date: entry_date}
  - type: condo_holdback_forfeited
    target: condo_claims
    meaning: Holdback left at the end of the recovery period is forfeited.
    grain: One row per holdback forfeited.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim.
      source_entry_id: Holdback forfeited.
      amount: Remaining holdback.
      entry_date: Date forfeited.
    account: depreciation_holdback
    direction: out
    triggers: []
  - type: condo_claim_denied
    target: condo_claims
    meaning: Coverage is denied for a coverage part or property class with a controlled reason.
    grain: One row per coverage part and class denied.
    distinguish_by: [claim_number, coverage_part, property_class, denial_reason]
    fields:
      claim_number: Claim.
      coverage_part: Coverage part denied.
      property_class: Property class denied.
      denial_reason: Reason.
      entry_date: Date of the denial letter.
    triggers: []
  - type: condo_claim_closed
    target: condo_claims
    meaning: The claim file is closed.
    grain: One row per closing.
    distinguish_by: [claim_number, entry_date]
    fields:
      claim_number: Claim.
      entry_date: Date closed.
    triggers: []

measures:
  - id: condo_msr_amount_due
    window: All entries of the policy up to and including the evaluation date.
    measure: Sum of condo_premium_billed amounts due on or before the evaluation date plus condo_fee_assessed, condo_payment_returned, condo_additional_premium and condo_refund_issued amounts posted on or before it, minus condo_payment_received and condo_return_premium amounts posted on or before it, floored at 0.00.
  - id: condo_msr_assessment_paid
    window: One occurrence — every entry of the claims that share the same association loss date and assessment basis across the customer's condo policies.
    measure: Sum of unvoided condo_claim_payment amounts with coverage_part loss_assessment for that occurrence and assessment basis.
  - id: condo_msr_paid_claims
    window: The claims_lookback_months calendar months ending on the notice date.
    measure: Count of distinct claim_number values on the customer's condo policies with at least one unvoided condo_claim_payment entry in the window.

policies:
  - id: condo_agg_multi_holding
    subject: [condo_policy_bound]
    rule: >-
      A customer may insure several condominium units, one CondoGuard policy per unit, up to max_per_customer live policies counted across the customer's profile; a live policy is one that is bound, in force, pending cancellation or pending nonrenewal.
      No other condominium policy that is bound, in force, pending cancellation or pending nonrenewal covers the same unit address.
    eligibility:
      - id: unit_not_already_insured
        applies_to: [condo_policy_bound]
        kind: dedup
        condition: "No other condominium policy that is bound, in force, pending cancellation or pending nonrenewal covers the same unit address."
        evidence_fields: [condo_policies.unit_address, condo_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[condo_policies.unit_address]]
          action_bindings: {condo_policies.unit_address: unit_address}
        dedup_contract:
          table: condo_policies
          mode: separate_record
          object_bindings: {unit_address: unit_address}
          duplicate_filters: {status: [bound, in_force, pending_cancellation, pending_nonrenewal]}
          distinct_fields: []
    params: {max_per_customer: 3}

  - id: condo_agg_assessment_per_unit
    subject: [condo_claim_payment, condo_claim_denied]
    rule: >-
      When one association loss produces assessments on several units the customer owns, each unit's share is claimed only on the CondoGuard policy of that unit, and each policy's loss assessment limit, deductible assessment sublimit and loss assessment deductible apply separately per unit.
      One occurrence is one association loss date with one assessment basis; for one unit it is paid at most once up to that unit's cap, measured by condo_msr_assessment_paid, however many assessment notices the association sends for it.
      A share already paid under one unit's policy is never paid again under another unit's policy, and the shares of units the customer does not own are never paid.
    eligibility: []
    measures: [condo_msr_assessment_paid]

  - id: condo_bind_eligibility
    subject: [condo_policy_bound, condo_policy_activated]
    rule: >-
      A CondoGuard policy is bound only on a unit in an association that carries a master policy, and only on a tier whose entry gate the applicant meets.
      Coverage A is at least the tier's minimum for the association's master policy type and at most max_coverage_a.
      The minimum is min_coverage_a_bare_walls, min_coverage_a_single_entity or min_coverage_a_all_in according to master_policy_type.
      Coverage C lies within personal_property_min and personal_property_max, liability is one of liability_limit_options, the deductible one of deductible_options, loss_assessment_limit starts at loss_assessment_included_limit and water_backup_limit at water_backup_included_limit, and the billing plan is one of billing_plans_allowed.
      A unit rented to others is bound only on a tier whose unit_rental_allowed is true and only with the unit rental endorsement; on other tiers a rented unit is insured under a LandlordGuard dwelling policy instead.
      A unit already insured under a live HomeGuard policy is never also insured under CondoGuard.
      A bound policy moves to in_force on its effective date, and the term runs twelve calendar months.
    eligibility:
      - id: coverage_a_minimum
        applies_to: [condo_policy_bound]
        kind: caller_fact
        condition: "Coverage A is at least the tier's minimum for the association's master policy type and at most max_coverage_a."
        evidence_fields: [condo_policies.master_policy_type, condo_policies.coverage_a_limit, condo_policies.customer_id, condo_policies.unit_address]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[condo_policies.customer_id, condo_policies.unit_address]]
          action_bindings: {condo_policies.customer_id: customer_id, condo_policies.unit_address: unit_address}
    params:
      per_tier:
        CondoGuard HO-6 Named Perils Essential: {bare_walls: "=min_coverage_a_bare_walls", single_entity: "=min_coverage_a_single_entity", all_in: "=min_coverage_a_all_in"}
        CondoGuard HO-6 Named Perils Enhanced: {bare_walls: "=min_coverage_a_bare_walls", single_entity: "=min_coverage_a_single_entity", all_in: "=min_coverage_a_all_in"}
        CondoGuard HO-6 Special Essential: {bare_walls: "=min_coverage_a_bare_walls", single_entity: "=min_coverage_a_single_entity", all_in: "=min_coverage_a_all_in"}
        CondoGuard HO-6 Special Enhanced: {bare_walls: "=min_coverage_a_bare_walls", single_entity: "=min_coverage_a_single_entity", all_in: "=min_coverage_a_all_in"}
        CondoGuard HO-6 Special Premier: {bare_walls: "=min_coverage_a_bare_walls", single_entity: "=min_coverage_a_single_entity", all_in: "=min_coverage_a_all_in"}
        CondoGuard HO-6 Special Signature: {bare_walls: "=min_coverage_a_bare_walls", single_entity: "=min_coverage_a_single_entity", all_in: "=min_coverage_a_all_in"}

  - id: condo_billing_and_payments
    subject: [condo_premium_billed, condo_fee_assessed, condo_payment_received, condo_payment_returned, condo_refund_issued, condo_mortgagee_changed]
    rule: >-
      Each term is billed on its plan's schedule: annual and mortgagee_escrow in one installment due on the term effective date (to the mortgagee under mortgagee_escrow), two_pay in two installments six calendar months apart, quarterly in four installments three calendar months apart, and monthly_eft in twelve monthly installments; each later installment is the term premium divided by the installment count rounded half-up to the cent, and installment 1 takes the difference.
      Installments are billed only while the policy is bound, in force, pending cancellation or pending nonrenewal.
      The installment fee is installment_fee_direct on two_pay and quarterly and installment_fee_eft on monthly_eft, charged on each installment after the first; a late fee is charged once per installment still unpaid more than late_fee_grace_days calendar days after its due date; a returned-payment fee is charged once per returned payment; none of these apply to a mortgagee-billed term, and a fee whose tier amount is 0.00 is never charged.
      Payments apply oldest charge first and are recorded with their confirmation or check number exactly as issued; a returned payment reverses the one payment it references in full.
      A refund is issued only when the premium balance is a credit of at least refund_minimum, to the payer of the most recent payment.
      A mortgagee change is recorded only with the mortgagee's name and loan number exactly as on the mortgage statement.
    eligibility:
      - id: billable_status
        applies_to: [condo_premium_billed]
        kind: state
        condition: "Installments are billed only while the policy is bound, in force, pending cancellation or pending nonrenewal."
        evidence_fields: [condo_policies.status, condo_policies.condo_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[condo_policies.condo_policy_id]]
          action_bindings: {condo_policies.condo_policy_id: condo_policy_id}
        state_contract:
          field: condo_policies.status
          allowed: [bound, in_force, pending_cancellation, pending_nonrenewal]
    params:
      installments_per_plan: {annual: 1, two_pay: 2, quarterly: 4, monthly_eft: 12, mortgagee_escrow: 1}
    measures: [condo_msr_amount_due]

  - id: condo_cancellation_and_reinstatement
    subject: [condo_cancellation_noticed, condo_cancellation_rescinded, condo_policy_cancelled, condo_policy_reinstated, condo_return_premium, condo_additional_premium]
    rule: >-
      A notice of cancellation for nonpayment is issued once an installment is still unpaid more than nonpayment_notice_after_due_days calendar days after its due date, with a scheduled cancellation date nonpayment_cancel_notice_days later and never sooner than mortgagee_notice_days when a mortgagee is on file; it is rescinded only by payments before the scheduled date totalling at least condo_msr_amount_due as of the notice date.
      The named insured cancels only by a signed request.
      The cancellation is processed only on a request the named insured has signed.
      A named-insured cancellation takes effect no earlier than the date the signed request is received; on or before the effective date of a bound policy it is flat.
      The pro-rata unearned premium is term_premium plus the signed annual_premium_change of every endorsement of the term whose premium was billed or credited, multiplied by the calendar days from the cancellation date to the expiration date and divided by the calendar days in the term, rounded half-up to the cent; under short_rate the carrier keeps short_rate_retention_pct of it; the credit is that returnable amount minus the term's scheduled installments not yet billed, reduced if needed so that the premium kept for the term is at least minimum_earned_premium; a negative result is billed as condo_additional_premium with change_reason cancellation.
      A carrier cancellation credits pro rata with no retention and no minimum earned premium.
      Only a policy cancelled for nonpayment is reinstated, and the reinstatement request is made no later than the reinstatement window that starts on the cancellation date.
      The reinstatement window is counted in calendar days from the cancellation date recorded as closed_date, and a request on the last day is on time.
      Reinstatement needs payment of condo_msr_amount_due plus the reinstatement fee and the named insured's signed statement of no loss since the cancellation date; it is without a lapse, and the cancellation credit is reversed by one condo_additional_premium entry with change_reason reinstatement_reversal.
    eligibility:
      - id: signed_request
        applies_to: [condo_policy_cancelled]
        kind: authorization
        condition: "The cancellation is processed only on a request the named insured has signed."
        evidence_fields: [condo_requests.condo_request_id, condo_requests.request_type, condo_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[condo_requests.condo_request_id]]
          action_bindings: {condo_requests.condo_request_id: condo_request_id}
      - id: reinstatement_window
        applies_to: [condo_policy_reinstated]
        kind: time
        condition: "Only a policy cancelled for nonpayment is reinstated, and the reinstatement request is made no later than the reinstatement window that starts on the cancellation date."
        evidence_fields: [condo_policies.closed_date, condo_policies.status_reason, condo_policies.condo_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[condo_policies.condo_policy_id]]
          action_bindings: {condo_policies.condo_policy_id: condo_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the cancellation date
          anchor_source: condo_policies.closed_date
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: "The reinstatement window is counted in calendar days from the cancellation date recorded as closed_date, and a request on the last day is on time."
          boundary: inclusive
    measures: [condo_msr_amount_due]

  - id: condo_endorsements
    subject: [condo_endorsement_added, condo_endorsement_removed, condo_coverage_updated, condo_additional_premium, condo_return_premium]
    rule: >-
      Endorsements are added or removed only while the policy is bound, in force or pending nonrenewal.
      A midterm change takes effect no earlier than the date the named insured requests it and before the expiration date.
      loss_assessment_increase and water_backup are bought in assessment_step increments above the tier's included limit up to loss_assessment_max_limit or water_backup_max_limit, with coverage_value recording the new total; unit_rental is available only where unit_rental_allowed is true and sets occupancy to rented_to_others; identity_fraud is available only where identity_fraud_included_limit is 0.
      coverage_a_change keeps Coverage A at or above the tier minimum for the current master_policy_type and at or below max_coverage_a; coverage_c_change keeps Coverage C within personal_property_min and personal_property_max; liability_change lands on one of liability_limit_options; deductible_change lands on one of deductible_options.
      The deductible assessment sublimit is fixed by tier and can never be raised by endorsement, and included package coverages can never be removed.
      The annual premium change is loss_assessment_rate_per_5000 or water_backup_rate_per_5000 per assessment_step; unit_rental_annual_premium; identity_fraud_annual_premium; coverage_a_rate_per_1000 or personal_property_rate_per_1000 per 1,000 USD of change; liability_step_annual_premium per step along liability_limit_options; and for a deductible change term_premium multiplied by the new deductible's factor minus the old one's in deductible_credit_factors.
      The prorated premium is the annual change multiplied by the calendar days from the change effective date to the expiration date and divided by the calendar days in the term, rounded half-up to the cent; premium_direction is additional for an increase, return for a decrease, and none below min_premium_change.
      Coverage increases are not accepted while the policy has a claim that has been reported and not closed.
      While the customer holds a live Larkspur Personal Umbrella that schedules this policy as underlying, the liability limit is never lowered below the umbrella's required underlying condominium liability limit.
    eligibility:
      - id: endorsable_status
        applies_to: [condo_endorsement_added, condo_endorsement_removed]
        kind: state
        condition: "Endorsements are added or removed only while the policy is bound, in force or pending nonrenewal."
        evidence_fields: [condo_policies.status, condo_policies.condo_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[condo_policies.condo_policy_id]]
          action_bindings: {condo_policies.condo_policy_id: condo_policy_id}
        state_contract:
          field: condo_policies.status
          allowed: [bound, in_force, pending_nonrenewal]
      - id: no_backdated_change
        applies_to: [condo_endorsement_added, condo_endorsement_removed]
        kind: caller_fact
        condition: "A midterm change takes effect no earlier than the date the named insured requests it and before the expiration date."
        evidence_fields: [condo_endorsements.request_date, condo_endorsements.effective_date, condo_policies.expiration_date, condo_policies.condo_policy_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[condo_policies.condo_policy_id]]
          action_bindings: {condo_policies.condo_policy_id: condo_policy_id}
      - id: open_claim_freeze
        applies_to: [condo_endorsement_added]
        kind: authorization
        condition: "Coverage increases are not accepted while the policy has a claim that has been reported and not closed."
        evidence_fields: [condo_claims.condo_policy_id, condo_claims.claim_number, condo_claims.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[condo_claims.condo_policy_id]]
          action_bindings: {condo_claims.condo_policy_id: condo_policy_id}
    params:
      assessment_step: 5000
      deductible_credit_factors: {"500": 0.05, "1000": 0.00, "2500": -0.10, "5000": -0.17}
    formula:
      loss_assessment_annual_change: "loss_assessment_rate_per_5000 * abs(coverage_value - loss_assessment_limit) / assessment_step"
      water_backup_annual_change: "water_backup_rate_per_5000 * abs(coverage_value - water_backup_limit) / assessment_step"
      coverage_a_annual_change: "coverage_a_rate_per_1000 * abs(coverage_value - coverage_a_limit) / 1000"

  - id: condo_association_changes
    subject: [condo_association_updated, condo_coverage_updated, condo_nonrenewal_noticed, condo_nonrenewal_rescinded]
    rule: >-
      A change in the association's master policy type or master deductible is recorded from the association's certificate of insurance or its written notice to owners, with the date the association's change took effect.
      When the new master_policy_type raises the tier's Coverage A minimum above the unit's coverage_a_limit, Coverage A must be raised by a coverage_a_change endorsement to at least the new minimum.
      Coverage A is raised within the association change period that starts on the date the association's change took effect.
      The association change period is counted in calendar days from association_change_date, and an endorsement effective on the last day is on time.
      Until Coverage A is raised, claims are settled on the Coverage A actually in force, never on the new minimum.
      When Coverage A is still below the minimum after that period, a notice of nonrenewal with status_reason coverage_a_below_minimum is issued at least nonrenewal_notice_days before expiration, and it is rescinded once Coverage A reaches the minimum before the expiration date.
      A higher master deductible changes nothing on the unit policy by itself: an assessment passing on the master deductible is still paid only up to deductible_assessment_sublimit.
    eligibility:
      - id: association_change_period
        applies_to: [condo_nonrenewal_noticed]
        kind: time
        condition: "Coverage A is raised within the association change period that starts on the date the association's change took effect."
        evidence_fields: [condo_policies.association_change_date, condo_policies.condo_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[condo_policies.condo_policy_id]]
          action_bindings: {condo_policies.condo_policy_id: condo_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the association's change took effect
          anchor_source: condo_policies.association_change_date
          relation: not_before
          duration_source: variants.association_change_report_days
          unit: calendar_days
          counting_rule: "The association change period is counted in calendar days from association_change_date, and an endorsement effective on the last day is on time."
          boundary: exclusive

  - id: condo_renewal
    subject: [condo_policy_renewed, condo_policy_expired]
    rule: >-
      A policy in force and not under a notice of nonrenewal renews for twelve calendar months when renewal installment 1 is paid by the expiration date; otherwise it expires with status_reason renewal_not_paid.
      At renewal Coverage A is increased by inflation_guard_pct and rounded up to the next 1,000 USD, never above max_coverage_a.
      The carrier also nonrenews when condo_msr_paid_claims reaches paid_claims_nonrenewal_threshold on the notice date, with at least nonrenewal_notice_days notice; a claim-frequency nonrenewal is never rescinded.
    eligibility: []
    measures: [condo_msr_paid_claims]

  - id: condo_claim_settlement
    subject: [condo_claim_reported, condo_claim_payment, condo_holdback_withheld, condo_claim_denied, condo_claim_closed, condo_claim_payment_voided]
    rule: >-
      A direct loss is covered only when the date of loss falls within a term during which the policy was in force.
      Coverage A pays unit property according to master_policy_type: under bare_walls both original_fixtures and owner_improvements, under single_entity only owner_improvements, and under all_in neither, those classes then being denied with master_policy_primary because the association's master policy insures them.
      One deductible applies per occurrence, absorbed first by unit_property, then personal_property.
      Where RC of a part is at or below rc_no_holdback_threshold the payment is replacement_cost_full; otherwise the first payment is acv_initial with the depreciation withheld in one condo_holdback_withheld entry, except personal property on an actual_cash_value tier, which is paid actual_cash_value_final with nothing withheld.
      Theft of jewelry_watches_furs, firearms and money is capped at the special limits; water backup is paid up to water_backup_limit and denied with no_water_backup_coverage when that is 0; surface water is denied with surface_water.
      Property and liability losses arising from renting the unit to others are denied with rented_without_endorsement unless occupancy is rented_to_others.
      A unit_property payment of mortgagee_copayee_threshold or more names the mortgagee as co-payee when one is on file.
      A payment that has already been voided is never voided again, and a claim is closed once every part is paid or denied and no holdback remains.
    eligibility:
      - id: voided_once
        applies_to: [condo_claim_payment_voided]
        kind: dedup
        condition: "A payment that has already been voided is never voided again, and a claim is closed once every part is paid or denied and no holdback remains."
        evidence_fields: [condo_claims.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[condo_claims.source_entry_id]]
          action_bindings: {condo_claims.source_entry_id: source_entry_id}
        dedup_contract:
          table: condo_claims
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [condo_claim_payment_voided]}
          distinct_fields: []
    params: {mortgagee_copayee_threshold: 5000.00}
    formula:
      acv_payment: "replacement_cost_amount - depreciation_amount - deductible_applied"
      full_rc_payment: "replacement_cost_amount - deductible_applied"

  - id: condo_loss_assessment
    subject: [condo_claim_payment, condo_claim_denied, condo_claim_reported]
    rule: >-
      A loss assessment is paid only when the association levies it during a term in which the policy was in force, for direct loss to association property caused by a peril the policy covers, or for association liability the policy would cover.
      The assessment is levied on a date within a term during which the policy was in force.
      Assessments for wear and tear, deferred maintenance, capital improvements, reserve shortfalls or dues are denied with not_covered_assessment, and earthquake assessments with earthquake_excluded.
      The payable amount is the unit's assessment share capped at deductible_assessment_sublimit when the assessment_basis is master_deductible_share, or at the loss_assessment_limit left for that occurrence otherwise, minus loss_assessment_deductible, and never below 0.00.
      No depreciation applies to an assessment, and the payment_type is loss_assessment.
    eligibility:
      - id: assessment_in_policy_period
        applies_to: [condo_claim_reported]
        kind: caller_fact
        condition: "The assessment is levied on a date within a term during which the policy was in force."
        evidence_fields: [condo_claims.assessment_date, condo_policies.original_effective_date, condo_policies.expiration_date, condo_policies.closed_date, condo_policies.condo_policy_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[condo_policies.condo_policy_id]]
          action_bindings: {condo_policies.condo_policy_id: condo_policy_id}
    params:
      per_tier:
        CondoGuard HO-6 Named Perils Essential: {deductible_share_cap: "=deductible_assessment_sublimit", assessment_deductible: "=loss_assessment_deductible"}
        CondoGuard HO-6 Named Perils Enhanced: {deductible_share_cap: "=deductible_assessment_sublimit", assessment_deductible: "=loss_assessment_deductible"}
        CondoGuard HO-6 Special Essential: {deductible_share_cap: "=deductible_assessment_sublimit", assessment_deductible: "=loss_assessment_deductible"}
        CondoGuard HO-6 Special Enhanced: {deductible_share_cap: "=deductible_assessment_sublimit", assessment_deductible: "=loss_assessment_deductible"}
        CondoGuard HO-6 Special Premier: {deductible_share_cap: "=deductible_assessment_sublimit", assessment_deductible: "=loss_assessment_deductible"}
        CondoGuard HO-6 Special Signature: {deductible_share_cap: "=deductible_assessment_sublimit", assessment_deductible: "=loss_assessment_deductible"}
    formula:
      deductible_share_payment: "max(0, min(replacement_cost_amount, deductible_assessment_sublimit) - loss_assessment_deductible)"
      common_property_payment: "max(0, min(replacement_cost_amount, loss_assessment_limit - condo_msr_assessment_paid) - loss_assessment_deductible)"
    measures: [condo_msr_assessment_paid]

  - id: condo_depreciation_recovery
    subject: [condo_holdback_released, condo_holdback_forfeited]
    rule: >-
      The holdback is released only when proof of completed repair or replacement is received no later than the depreciation recovery period that starts on the date of the initial actual-cash-value payment.
      The depreciation recovery period is counted in calendar days from the date of the initial actual-cash-value payment, and proof received on the last day is on time.
      The release is the smaller of the remaining holdback and the documented incurred cost (capped at RC) minus the actual cash value, never below 0.00; partial releases are allowed, and holdback left when the period ends is forfeited in one entry.
    eligibility:
      - id: recovery_period
        applies_to: [condo_holdback_released]
        kind: time
        condition: "The holdback is released only when proof of completed repair or replacement is received no later than the depreciation recovery period that starts on the date of the initial actual-cash-value payment."
        evidence_fields: [condo_claims.entry_date, condo_claims.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[condo_claims.source_entry_id]]
          action_bindings: {condo_claims.source_entry_id: source_entry_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the initial actual-cash-value payment
          anchor_source: condo_claims.entry_date
          relation: not_after
          duration_source: variants.depreciation_recovery_days
          unit: calendar_days
          counting_rule: "The depreciation recovery period is counted in calendar days from the date of the initial actual-cash-value payment, and proof received on the last day is on time."
          boundary: inclusive
    formula:
      release_amount: "max(0, min(depreciation_holdback, min(incurred_amount, replacement_cost_amount) - (replacement_cost_amount - depreciation_amount)))"
