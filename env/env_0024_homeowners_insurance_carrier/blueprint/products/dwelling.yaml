events:
  - type: dwelling_policy_bound
    target: dwelling_policies
    mutation: create
    meaning: A landlord dwelling policy is bound on one rental building with its form, limits, occupancy and billing plan.
    grain: One row per policy contract.
    fields:
      policy_number: Policy number.
      variant_name: Official tier name.
      property_address: Rental property address.
      units: Dwelling units in the building.
      year_built: Year built.
      roof_material: Roof covering material.
      roof_install_year: Year the roof covering was installed.
      roof_settlement: Roof surfacing settlement basis for the term.
      occupancy: Occupancy at binding.
      lease_type: Lease type in use.
      dwelling_limit: Coverage A.
      fair_rental_value_limit: Coverage D fair rental value.
      landlord_contents_limit: Coverage C landlord's furnishings.
      premises_liability_limit: Premises liability limit.
      deductible: All-other-perils deductible.
      wind_hail_deductible_pct: Wind/hail deductible percentage.
      billing_plan: Billing plan.
      mortgagee_name: Mortgagee, empty when none.
      loan_number: Loan number, empty when none.
      bound_date: Date bound.
      original_effective_date: First inception date.
      effective_date: Start of term.
      expiration_date: End of term.
      term_premium: Annual premium of the term.
    triggers:
      - event: dwelling:dwelling_premium_billed
        when: {billing_plan: mortgagee_escrow}
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date, amount: term_premium, payer: mortgagee, posted_date: bound_date}
      - event: dwelling:dwelling_premium_billed
        when: {billing_plan: {not: mortgagee_escrow}}
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date, payer: insured, posted_date: bound_date}
      - event: dwelling:dwelling_mortgagee_invoice
        when: {billing_plan: mortgagee_escrow}
        map: {term_effective_date: effective_date, due_date: effective_date, amount: term_premium, posted_date: bound_date}
      - event: dwelling:dwelling_inspection_ordered
        map: {}
  - type: dwelling_policy_activated
    target: dwelling_policies
    mutation: {transition: {from: bound, to: in_force}}
    meaning: Coverage attaches on the effective date.
    grain: One row per transaction.
    fields: {effective_date: Effective date reached.}
    triggers: []
  - type: dwelling_cancellation_noticed
    target: dwelling_policies
    mutation: {transition: {from: in_force, to: pending_cancellation}}
    meaning: A notice of cancellation is issued and copied to the mortgagee.
    grain: One row per transaction.
    fields:
      status_reason: nonpayment, uncured_condition, vacancy_without_permit or material_misrepresentation.
      pending_action_date: Scheduled cancellation date.
    triggers: []
  - type: dwelling_cancellation_rescinded
    target: dwelling_policies
    mutation: {transition: {from: pending_cancellation, to: in_force}}
    meaning: A pending cancellation is withdrawn after its cure.
    grain: One row per transaction.
    fields:
      status_reason: Reset to none.
      pending_action_date: Cleared.
    triggers: []
  - type: dwelling_policy_cancelled
    target: dwelling_policies
    mutation:
      transition:
        - {from: pending_cancellation, to: cancelled}
        - {from: in_force, to: cancelled}
        - {from: bound, to: cancelled}
    meaning: Coverage ends before expiration on a carrier notice or at the named insured's signed request.
    grain: One row per transaction.
    fields:
      policy_number: Policy number, carried unchanged.
      status_reason: Ground of the cancellation.
      closed_date: Date coverage ended.
    triggers:
      - event: dwelling:dwelling_return_premium
        map: {change_reason: cancellation, effective_date: closed_date, posted_date: closed_date}
      - event: umbrella:umbrella_underlying_lapsed
        map: {underlying_line: dwelling, underlying_policy_number: policy_number, event_date: closed_date}
  - type: dwelling_nonrenewal_noticed
    target: dwelling_policies
    mutation: {transition: {from: in_force, to: pending_nonrenewal}}
    meaning: A notice of nonrenewal is issued on an underwriting ground.
    grain: One row per transaction.
    fields:
      status_reason: uncured_condition, claim_frequency, roof_age or ineligible_occupancy.
      pending_action_date: Expiration date on which the policy will end.
    triggers: []
  - type: dwelling_nonrenewal_rescinded
    target: dwelling_policies
    mutation: {transition: {from: pending_nonrenewal, to: in_force}}
    meaning: A nonrenewal on a curable ground is withdrawn after the cure.
    grain: One row per transaction.
    fields:
      status_reason: Reset to none.
      pending_action_date: Cleared.
    triggers: []
  - type: dwelling_policy_expired
    target: dwelling_policies
    mutation:
      transition:
        - {from: pending_nonrenewal, to: expired}
        - {from: in_force, to: expired}
    meaning: The term ends without renewal.
    grain: One row per transaction.
    fields:
      policy_number: Policy number, carried unchanged.
      status_reason: Nonrenewal ground or renewal_not_paid.
      closed_date: The expiration date.
    triggers:
      - event: umbrella:umbrella_underlying_lapsed
        map: {underlying_line: dwelling, underlying_policy_number: policy_number, event_date: closed_date}
  - type: dwelling_policy_renewed
    target: dwelling_policies
    mutation: update
    meaning: The policy rolls into a new twelve-month term at the capped renewal premium, possibly on a different tier.
    grain: One row per transaction.
    fields:
      variant_name: Tier for the new term.
      effective_date: Start of the new term.
      expiration_date: End of the new term.
      dwelling_limit: Coverage A after the inflation guard.
      roof_settlement: Roof settlement basis re-evaluated for the new term.
      term_premium: Renewal term premium after the rate cap.
      indicated_renewal_premium: Cleared once the renewal takes effect.
    triggers:
      - event: dwelling:dwelling_premium_billed
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date}
  - type: dwelling_renewal_offered
    target: dwelling_policies
    mutation: update
    meaning: The rating system's indicated premium for the upcoming term is recorded when the renewal is offered.
    grain: One row per transaction.
    fields:
      indicated_renewal_premium: Premium indicated by the rating system for the upcoming term, before the rate cap.
    triggers: []
  - type: dwelling_occupancy_updated
    target: dwelling_policies
    mutation: update
    meaning: Occupancy, vacancy start or lease type on file changes as the landlord reports tenants moving out or in.
    grain: One row per transaction.
    fields:
      occupancy: Occupancy after the change.
      vacancy_start_date: First day the building became vacant, empty when occupied.
      lease_type: Lease type in use after the change.
    triggers: []
  - type: dwelling_vacancy_permit_issued
    target: dwelling_policies
    mutation: update
    meaning: A vacancy permit suspends the vacancy exclusion for a stated period.
    grain: One row per transaction.
    fields:
      vacancy_permit_start: First day of the permit.
      vacancy_permit_expiration: Last day of the permit.
    triggers:
      - event: dwelling:dwelling_additional_premium
        map: {change_reason: vacancy_permit, effective_date: vacancy_permit_start}
  - type: dwelling_property_updated
    target: dwelling_policies
    mutation: update
    meaning: Property characteristics change after documented work, such as a roof replacement.
    grain: One row per transaction.
    fields:
      roof_material: Roof material after the work.
      roof_install_year: Year the new roof was installed.
      roof_settlement: Roof settlement basis after the work.
    triggers: []
  - type: dwelling_mortgagee_changed
    target: dwelling_policies
    mutation: update
    meaning: The mortgagee is added, replaced or removed.
    grain: One row per transaction.
    fields:
      mortgagee_name: New mortgagee, empty on payoff.
      loan_number: New loan number, empty on payoff.
    triggers: []
  - type: dwelling_premium_billed
    target: dwelling_billing
    meaning: One installment of the term premium is billed.
    grain: One row per installment of a term.
    distinguish_by: [term_effective_date, installment_number]
    fields:
      term_effective_date: Term billed.
      installment_number: Installment position.
      due_date: Due date.
      amount: Installment amount.
      payer: insured or mortgagee.
      posted_date: Bill date.
    account: premium_balance
    direction: in
    triggers:
      - event: dwelling:dwelling_fee_assessed
        when: {installment_number: {not: 1}}
        map: {fee_code: installment_fee, term_effective_date: term_effective_date, installment_number: installment_number, posted_date: posted_date}
  - type: dwelling_fee_assessed
    target: dwelling_billing
    meaning: An installment, late or returned-payment fee is charged.
    grain: One row per fee.
    distinguish_by: [fee_code, term_effective_date, installment_number, source_billing_id]
    fields:
      fee_code: Fee charged.
      term_effective_date: Term of the fee.
      installment_number: Installment of the fee (0 when none).
      source_billing_id: Returned payment the fee is for; empty otherwise.
      amount: Fee amount.
      posted_date: Date charged.
    account: premium_balance
    direction: in
    triggers: []
  - type: dwelling_payment_received
    target: dwelling_billing
    meaning: A premium payment is received from the insured or the mortgagee.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      payment_reference: Confirmation or check number.
      payer: Who paid.
      payment_method: Method.
      amount: Amount.
      posted_date: Date received.
    account: premium_balance
    direction: out
    triggers: []
  - type: dwelling_payment_returned
    target: dwelling_billing
    meaning: A payment is returned unpaid and reversed.
    grain: One row per returned payment.
    distinguish_by: [source_billing_id]
    fields:
      source_billing_id: Payment reversed.
      amount: Full payment amount.
      posted_date: Date posted.
    account: premium_balance
    direction: in
    triggers:
      - event: dwelling:dwelling_fee_assessed
        map: {fee_code: returned_payment_fee, source_billing_id: dwelling_billing_id, posted_date: posted_date}
  - type: dwelling_additional_premium
    target: dwelling_billing
    meaning: Additional premium for a vacancy permit, or earned premium owed at cancellation, is charged.
    grain: One row per premium-raising change.
    distinguish_by: [change_reason, effective_date]
    fields:
      change_reason: vacancy_permit or cancellation.
      effective_date: Date the permit starts or the cancellation takes effect.
      amount: Amount charged.
      posted_date: Date charged.
    account: premium_balance
    direction: in
    triggers: []
  - type: dwelling_return_premium
    target: dwelling_billing
    meaning: Unearned premium is credited on cancellation.
    grain: One row per cancellation credit.
    distinguish_by: [change_reason, effective_date, credit_basis]
    fields:
      change_reason: cancellation.
      effective_date: Cancellation date.
      credit_basis: pro_rata, short_rate or flat.
      amount: Amount credited.
      posted_date: Date credited.
    account: premium_balance
    direction: out
    triggers: []
  - type: dwelling_refund_issued
    target: dwelling_billing
    meaning: A credit balance is refunded.
    grain: One row per refund.
    distinguish_by: [posted_date, payer]
    fields:
      payer: insured or mortgagee refunded.
      payment_method: Method.
      amount: Amount refunded.
      posted_date: Date refunded.
    account: premium_balance
    direction: in
    triggers: []
  - type: dwelling_mortgagee_invoice
    target: dwelling_billing
    meaning: The term premium is invoiced to the mortgagee for payment from escrow.
    grain: One row per mortgagee invoice per term.
    distinguish_by: [term_effective_date]
    fields:
      term_effective_date: Term invoiced.
      due_date: Due date.
      amount: Amount invoiced.
      posted_date: Date sent.
    triggers: []
  - type: dwelling_inspection_ordered
    target: dwelling_inspections
    meaning: An underwriting inspection of the rental property is ordered.
    grain: One row per inspection order.
    distinguish_by: [inspection_type, event_date]
    fields:
      inspection_type: Kind of inspection.
      event_date: Date ordered.
    triggers: []
  - type: dwelling_inspection_completed
    target: dwelling_inspections
    meaning: The inspection report is received; each finding is recorded, or one clean result.
    grain: One row per finding on a completed inspection.
    distinguish_by: [inspection_type, event_date, finding_code]
    fields:
      inspection_type: Kind of inspection.
      event_date: Date the report was received.
      finding_code: Condition found.
    triggers:
      - event: dwelling:dwelling_condition_letter_issued
        when: {finding_code: {not: none}}
        map: {finding_code: finding_code, source_entry_id: dwelling_inspection_entry_id, inspection_type: inspection_type, event_date: event_date}
  - type: dwelling_condition_letter_issued
    target: dwelling_inspections
    meaning: A letter asks the landlord to correct a finding by a cure due date.
    grain: One row per finding letter.
    distinguish_by: [source_entry_id]
    fields:
      source_entry_id: Finding the letter concerns.
      finding_code: Condition to correct.
      inspection_type: Inspection the finding came from.
      event_date: Date the letter was sent.
      cure_due_date: Last day to prove the correction.
    triggers: []
  - type: dwelling_cure_extension_granted
    target: dwelling_inspections
    meaning: The cure due date of one condition letter is extended once at the landlord's request.
    grain: One row per extended letter.
    distinguish_by: [source_entry_id]
    fields:
      source_entry_id: Condition letter extended.
      finding_code: Condition concerned.
      event_date: Date the extension was granted.
      cure_due_date: Extended cure due date.
    triggers: []
  - type: dwelling_condition_cured
    target: dwelling_inspections
    meaning: Proof that a finding was corrected is accepted.
    grain: One row per condition letter cured.
    distinguish_by: [source_entry_id]
    fields:
      source_entry_id: Condition letter cured.
      finding_code: Condition corrected.
      event_date: Date the proof was received.
    triggers:
      - event: dwelling:dwelling_property_updated
        when: {finding_code: roof_end_of_life}
        map: {}
  - type: dwelling_claim_reported
    target: dwelling_claims
    meaning: First notice of loss opens a claim number for one occurrence.
    grain: One row per claim.
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number.
      loss_date: Date of loss.
      peril: Cause of loss.
      entry_date: Date reported.
    triggers: []
  - type: dwelling_claim_payment
    target: dwelling_claims
    meaning: Claim money is issued for one coverage part and property class.
    grain: One row per payment on a coverage part and property class.
    distinguish_by: [claim_number, coverage_part, property_class, payment_type, entry_date]
    fields:
      claim_number: Claim paid.
      loss_date: Date of loss.
      peril: Cause of loss.
      coverage_part: Coverage part paid.
      property_class: Property class paid.
      payment_type: Kind of payment.
      replacement_cost_amount: Replacement-cost value after caps.
      depreciation_amount: Depreciation.
      deductible_applied: Deductible absorbed.
      vacancy_reduction: Amount removed by the vacancy reduction.
      amount: Amount paid.
      payee: Payee.
      entry_date: Date issued.
    account: indemnity_paid
    direction: in
    triggers:
      - event: dwelling:dwelling_holdback_withheld
        when: {payment_type: acv_initial}
        map: {claim_number: claim_number, coverage_part: coverage_part, property_class: property_class, amount: depreciation_amount, source_entry_id: dwelling_claim_entry_id, entry_date: entry_date}
  - type: dwelling_claim_payment_voided
    target: dwelling_claims
    meaning: An uncashed claim payment is voided.
    grain: One row per voided payment.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim of the void.
      source_entry_id: Payment voided.
      amount: Amount voided.
      entry_date: Date voided.
    account: indemnity_paid
    direction: out
    triggers: []
  - type: dwelling_holdback_withheld
    target: dwelling_claims
    meaning: Recoverable depreciation is withheld from an actual-cash-value payment.
    grain: One row per actual-cash-value payment withholding depreciation.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim.
      coverage_part: Coverage part.
      property_class: Property class.
      source_entry_id: Payment the holdback came from.
      amount: Depreciation withheld.
      entry_date: Date withheld.
    account: depreciation_holdback
    direction: in
    triggers: []
  - type: dwelling_holdback_released
    target: dwelling_claims
    meaning: Withheld depreciation is released after completed repair is documented.
    grain: One row per documented completion released against a holdback.
    distinguish_by: [source_entry_id, entry_date, incurred_amount]
    fields:
      claim_number: Claim.
      coverage_part: Coverage part.
      property_class: Property class.
      source_entry_id: Holdback released against.
      incurred_amount: Documented cost incurred.
      amount: Depreciation released.
      entry_date: Date proof accepted.
    account: depreciation_holdback
    direction: out
    triggers:
      - event: dwelling:dwelling_claim_payment
        map: {claim_number: claim_number, coverage_part: coverage_part, property_class: property_class, payment_type: recoverable_depreciation, amount: amount, entry_date: entry_date}
  - type: dwelling_holdback_forfeited
    target: dwelling_claims
    meaning: Holdback left at the end of the recovery period is forfeited.
    grain: One row per holdback forfeited.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim.
      source_entry_id: Holdback forfeited.
      amount: Remaining holdback.
      entry_date: Date forfeited.
    account: depreciation_holdback
    direction: out
    triggers: []
  - type: dwelling_claim_denied
    target: dwelling_claims
    meaning: Coverage is denied for a coverage part with a controlled reason.
    grain: One row per coverage part denied.
    distinguish_by: [claim_number, coverage_part, denial_reason]
    fields:
      claim_number: Claim.
      coverage_part: Coverage part denied.
      denial_reason: Reason.
      entry_date: Date of the denial letter.
    triggers: []
  - type: dwelling_claim_closed
    target: dwelling_claims
    meaning: The claim file is closed.
    grain: One row per closing.
    distinguish_by: [claim_number, entry_date]
    fields:
      claim_number: Claim.
      entry_date: Date closed.
    triggers: []

measures:
  - id: dwelling_msr_amount_due
    window: All entries of the policy up to and including the evaluation date.
    measure: Sum of dwelling_premium_billed amounts due on or before the evaluation date plus dwelling_fee_assessed, dwelling_payment_returned, dwelling_additional_premium and dwelling_refund_issued amounts posted on or before it, minus dwelling_payment_received and dwelling_return_premium amounts posted on or before it, floored at 0.00.
  - id: dwelling_msr_paid_claims
    window: The claims_lookback_months calendar months ending on the nonrenewal notice date.
    measure: Count of distinct claim_number values on this policy's property with at least one unvoided dwelling_claim_payment entry in the window, wind_hail and lightning claims included.
  - id: dwelling_msr_live_policies
    window: As of the evaluation date (binding or the renewal offer date).
    measure: Count of the customer's dwelling policies whose status is bound, in force, pending cancellation or pending nonrenewal, including the policy being evaluated.
  - id: dwelling_msr_vacant_days
    window: From vacancy_start_date up to the evaluation date (a date of loss or a notice date).
    measure: Consecutive calendar days the building has been vacant, counting vacancy_start_date as day 1, excluding days inside a vacancy permit.

policies:
  - id: dwelling_agg_multi_holding
    subject: [dwelling_policy_bound]
    rule: >-
      A landlord may insure up to max_per_customer rental buildings, one LandlordGuard policy per building address, counted across every dwelling policy in the customer's name; a live policy is one that is bound, in force, pending cancellation or pending nonrenewal.
      No other dwelling policy that is bound, in force, pending cancellation or pending nonrenewal covers the same property address.
    eligibility:
      - id: property_not_already_insured
        applies_to: [dwelling_policy_bound]
        kind: dedup
        condition: "No other dwelling policy that is bound, in force, pending cancellation or pending nonrenewal covers the same property address."
        evidence_fields: [dwelling_policies.property_address, dwelling_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_policies.property_address]]
          action_bindings: {dwelling_policies.property_address: property_address}
        dedup_contract:
          table: dwelling_policies
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [bound, in_force, pending_cancellation, pending_nonrenewal]}
          distinct_fields: []
    params: {max_per_customer: 12}

  - id: dwelling_agg_portfolio_tier
    subject: [dwelling_policy_bound, dwelling_policy_renewed]
    rule: >-
      LandlordGuard DP-3 Portfolio is a book-of-business tier: it is written only while dwelling_msr_live_policies is at least min_live_dwelling_policies across the customer's LandlordGuard policies, the new policy included.
      The count is taken at binding and again on each Portfolio policy's renewal offer date; when it has fallen below the minimum, that policy renews on LandlordGuard DP-3 Premier, with its indicated renewal premium rated for Premier and the renewal rate cap applied to it, and nothing changes midterm.
      Claims history is judged per property, never pooled across the portfolio.
    eligibility: []
    params: {min_live_dwelling_policies: 3, fallback_tier: LandlordGuard DP-3 Premier}
    measures: [dwelling_msr_live_policies]

  - id: dwelling_bind_eligibility
    subject: [dwelling_policy_bound, dwelling_policy_activated]
    rule: >-
      A LandlordGuard policy insures a building rented to others; the named insured's own primary residence is insured under HomeGuard instead, and a condominium unit rented to others under CondoGuard with the unit rental endorsement where its tier allows.
      The building has no more than the tier's max_units dwelling units and is let only on a lease type in lease_types_allowed.
      A lease shorter than short_term_rental_min_days is a short-term rental.
      The roof age and building age at the effective date are within max_roof_age_new_business_years and max_home_age_new_business_years.
      Coverage A lies within min_dwelling_limit and max_dwelling_limit; fair_rental_value_limit is fair_rental_value_pct of Coverage A; landlord_contents_limit is at most landlord_contents_max; premises liability, deductible and wind/hail percentage are chosen from the tier's options; the billing plan is one of billing_plans_allowed.
      roof_settlement is replacement_cost when the roof age at the effective date is at or below roof_rc_max_age_years and roof_surfacing_schedule otherwise.
      A bound policy moves to in_force on its effective date; the term runs twelve calendar months.
    eligibility:
      - id: units_and_lease
        applies_to: [dwelling_policy_bound]
        kind: caller_fact
        condition: "The building has no more than the tier's max_units dwelling units and is let only on a lease type in lease_types_allowed."
        evidence_fields: [dwelling_policies.units, dwelling_policies.lease_type, dwelling_policies.customer_id, dwelling_policies.property_address]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[dwelling_policies.customer_id, dwelling_policies.property_address]]
          action_bindings: {dwelling_policies.customer_id: customer_id, dwelling_policies.property_address: property_address}
      - id: roof_and_age
        applies_to: [dwelling_policy_bound]
        kind: caller_fact
        condition: "The roof age and building age at the effective date are within max_roof_age_new_business_years and max_home_age_new_business_years."
        evidence_fields: [dwelling_policies.roof_install_year, dwelling_policies.year_built, dwelling_policies.effective_date, dwelling_policies.customer_id, dwelling_policies.property_address]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[dwelling_policies.customer_id, dwelling_policies.property_address]]
          action_bindings: {dwelling_policies.customer_id: customer_id, dwelling_policies.property_address: property_address}

  - id: dwelling_billing_and_payments
    subject: [dwelling_premium_billed, dwelling_fee_assessed, dwelling_payment_received, dwelling_payment_returned, dwelling_refund_issued, dwelling_mortgagee_invoice, dwelling_mortgagee_changed]
    rule: >-
      Each term is billed on its plan's schedule: annual in one installment due on the term effective date, two_pay in two installments six calendar months apart, quarterly in four installments three calendar months apart, and mortgagee_escrow as one installment to the mortgagee with a mortgagee invoice of the same amount and due date; each later installment is the term premium divided by the installment count rounded half-up to the cent, and installment 1 takes the difference.
      Installments are billed only while the policy is bound, in force, pending cancellation or pending nonrenewal.
      installment_fee_direct is charged on each installment after the first; a late fee once per installment still unpaid more than late_fee_grace_days calendar days after its due date; a returned-payment fee once per returned payment; none of these on a mortgagee-billed term, and none when the tier amount is 0.00.
      Payments apply oldest charge first and are recorded with their confirmation or check number exactly as issued; a returned payment reverses the one payment it references in full.
      A refund is issued only when the premium balance is a credit of at least refund_minimum, to the payer of the most recent payment.
      A mortgagee change is recorded only with the mortgagee's name and loan number exactly as on the mortgage statement.
    eligibility:
      - id: billable_status
        applies_to: [dwelling_premium_billed]
        kind: state
        condition: "Installments are billed only while the policy is bound, in force, pending cancellation or pending nonrenewal."
        evidence_fields: [dwelling_policies.status, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_policies.dwelling_policy_id]]
          action_bindings: {dwelling_policies.dwelling_policy_id: dwelling_policy_id}
        state_contract:
          field: dwelling_policies.status
          allowed: [bound, in_force, pending_cancellation, pending_nonrenewal]
    params:
      installments_per_plan: {annual: 1, two_pay: 2, quarterly: 4, mortgagee_escrow: 1}
    measures: [dwelling_msr_amount_due]

  - id: dwelling_cancellation
    subject: [dwelling_cancellation_noticed, dwelling_cancellation_rescinded, dwelling_policy_cancelled, dwelling_return_premium, dwelling_additional_premium]
    rule: >-
      The carrier cancels midterm only for nonpayment, for an inspection finding left uncured inside the new business period, for vacancy without a permit beyond vacancy_cancel_days, or for material misrepresentation.
      A nonpayment notice is issued once an installment is still unpaid more than nonpayment_notice_after_due_days calendar days after its due date, with the cancellation scheduled nonpayment_cancel_notice_days later, and is rescinded only by payments before that date totalling at least dwelling_msr_amount_due as of the notice date.
      An underwriting cancellation notice for an uncured condition is issued only within the new business period that starts on the original effective date.
      The new business period is counted in calendar days with the original effective date as day 1, so the last day to issue the notice is the original effective date plus new_business_period_days minus 1.
      A vacancy cancellation notice is issued only after the vacancy period that starts on the vacancy start date.
      The vacancy period is counted with the vacancy start date as day 1, so the notice may be issued once dwelling_msr_vacant_days exceeds vacancy_cancel_days.
      An underwriting or vacancy notice schedules the cancellation underwriting_cancel_notice_days after the notice date and never sooner than mortgagee_notice_days when a mortgagee is on file; a vacancy notice is rescinded when a tenant moves in or a vacancy permit is issued before that date, and an uncured-condition notice when the condition is cured before that date.
      The named insured cancels only by a signed request, effective no earlier than the date it is received; a cancellation on or before the effective date of a bound policy is flat.
      The cancellation is processed only on a request the named insured has signed.
      On a named-insured cancellation the pro-rata unearned premium is term_premium multiplied by the calendar days from the cancellation date to the expiration date and divided by the calendar days in the term, rounded half-up to the cent; under short_rate the carrier keeps short_rate_retention_pct of it; the credit is the returnable amount minus the term's scheduled installments not yet billed, reduced if needed so that the premium kept for the term is at least minimum_earned_premium; a negative result is billed as dwelling_additional_premium with change_reason cancellation.
      A carrier cancellation credits pro rata with no retention and no minimum earned premium.
    eligibility:
      - id: new_business_period
        applies_to: [dwelling_cancellation_noticed]
        kind: time
        condition: "An underwriting cancellation notice for an uncured condition is issued only within the new business period that starts on the original effective date."
        evidence_fields: [dwelling_policies.original_effective_date, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_policies.dwelling_policy_id]]
          action_bindings: {dwelling_policies.dwelling_policy_id: dwelling_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the original effective date
          anchor_source: dwelling_policies.original_effective_date
          relation: not_after
          duration_source: variants.new_business_period_days
          unit: calendar_days
          counting_rule: "The new business period is counted in calendar days with the original effective date as day 1, so the last day to issue the notice is the original effective date plus new_business_period_days minus 1."
          boundary: exclusive
      - id: vacancy_period
        applies_to: [dwelling_cancellation_noticed]
        kind: time
        condition: "A vacancy cancellation notice is issued only after the vacancy period that starts on the vacancy start date."
        evidence_fields: [dwelling_policies.vacancy_start_date, dwelling_policies.vacancy_permit_expiration, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_policies.dwelling_policy_id]]
          action_bindings: {dwelling_policies.dwelling_policy_id: dwelling_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the vacancy start date
          anchor_source: dwelling_policies.vacancy_start_date
          relation: not_before
          duration_source: variants.vacancy_cancel_days
          unit: calendar_days
          counting_rule: "The vacancy period is counted with the vacancy start date as day 1, so the notice may be issued once dwelling_msr_vacant_days exceeds vacancy_cancel_days."
          boundary: inclusive
      - id: signed_request
        applies_to: [dwelling_policy_cancelled]
        kind: authorization
        condition: "The cancellation is processed only on a request the named insured has signed."
        evidence_fields: [dwelling_requests.dwelling_request_id, dwelling_requests.request_type, dwelling_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_requests.dwelling_request_id]]
          action_bindings: {dwelling_requests.dwelling_request_id: dwelling_request_id}
    measures: [dwelling_msr_amount_due, dwelling_msr_vacant_days]

  - id: dwelling_occupancy_and_vacancy
    subject: [dwelling_occupancy_updated, dwelling_vacancy_permit_issued, dwelling_additional_premium]
    rule: >-
      The landlord reports when the building becomes vacant, recording vacancy_start_date as the first day without a tenant in residence, and when a tenant moves in, which clears it; a building under renovation with no tenant is vacant.
      A vacancy permit is issued only on a tier whose vacancy_permit_available is true, for no more than vacancy_permit_max_days, starting no earlier than the date it is requested and never retroactively.
      A vacancy permit starts no earlier than the date the landlord requests it.
      The permit charge is term_premium multiplied by vacancy_permit_rate_pct, by the permit days and divided by the calendar days in the term, rounded half-up to the cent, posted as one dwelling_additional_premium entry with change_reason vacancy_permit dated the permit start.
      A lease type outside lease_types_allowed, including any short-term rental on a tier that does not list short_term, makes the building ineligible; the landlord must return to an allowed lease type or the policy is nonrenewed as ineligible_occupancy at the next renewal.
    eligibility:
      - id: permit_not_retroactive
        applies_to: [dwelling_vacancy_permit_issued]
        kind: caller_fact
        condition: "A vacancy permit starts no earlier than the date the landlord requests it."
        evidence_fields: [dwelling_policies.vacancy_permit_start, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[dwelling_policies.dwelling_policy_id]]
          action_bindings: {dwelling_policies.dwelling_policy_id: dwelling_policy_id}
    formula:
      vacancy_permit_charge: "term_premium * vacancy_permit_rate_pct / 100"

  - id: dwelling_inspections_and_conditions
    subject: [dwelling_inspection_ordered, dwelling_inspection_completed, dwelling_condition_letter_issued, dwelling_cure_extension_granted, dwelling_condition_cured, dwelling_property_updated]
    rule: >-
      Every new policy receives one inspection of the tier's new_business_inspection_type, ordered no later than inspection_order_days after the bound date; a roof_reinspection is ordered only to confirm a reported roof replacement.
      Inspections are ordered only while the policy is bound or in force.
      Each finding other than none receives one condition letter whose cure due date is the inspection completion date plus inspection_cure_days calendar days.
      A cure extension is granted once per letter, for cure_extension_days, only when the landlord asks for it on or before the letter's current cure due date and only on a tier whose cure_extension_days is above 0.
      A letter that has already been extended is never extended again.
      A condition is cured only when the proof of correction is received no later than the cure due date on the letter, as extended.
      Proof is photographs or a contractor invoice for hazard findings (missing_smoke_detectors, missing_handrails, unsecured_vacant_openings, deferred_maintenance, debris_hazard, roof_defect) and a completed roof_reinspection or a licensed electrician's certificate for eligibility findings (roof_end_of_life, knob_and_tube_wiring, fuse_panel).
      When a roof_end_of_life finding is cured by a new roof, the roof on file is updated and roof_settlement becomes replacement_cost where the tier's roof_rc_max_age_years is above 0.
      A finding left uncured after its cure due date supports cancellation inside the new business period and nonrenewal afterwards; it never changes how a claim is paid.
    eligibility:
      - id: order_status
        applies_to: [dwelling_inspection_ordered]
        kind: state
        condition: "Inspections are ordered only while the policy is bound or in force."
        evidence_fields: [dwelling_policies.status, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_policies.dwelling_policy_id]]
          action_bindings: {dwelling_policies.dwelling_policy_id: dwelling_policy_id}
        state_contract:
          field: dwelling_policies.status
          allowed: [bound, in_force]
      - id: extended_once
        applies_to: [dwelling_cure_extension_granted]
        kind: dedup
        condition: "A letter that has already been extended is never extended again."
        evidence_fields: [dwelling_inspections.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_inspections.source_entry_id]]
          action_bindings: {dwelling_inspections.source_entry_id: source_entry_id}
        dedup_contract:
          table: dwelling_inspections
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [dwelling_cure_extension_granted]}
          distinct_fields: []
      - id: cure_deadline
        applies_to: [dwelling_condition_cured]
        kind: caller_fact
        condition: "A condition is cured only when the proof of correction is received no later than the cure due date on the letter, as extended."
        evidence_fields: [dwelling_inspections.cure_due_date, dwelling_inspections.event_date, dwelling_inspections.source_entry_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[dwelling_inspections.source_entry_id]]
          action_bindings: {dwelling_inspections.source_entry_id: source_entry_id}

  - id: dwelling_nonrenewal
    subject: [dwelling_nonrenewal_noticed, dwelling_nonrenewal_rescinded, dwelling_policy_expired]
    rule: >-
      The carrier nonrenews only on these grounds, recorded in this order of precedence when several hold on the notice date: uncured_condition (a finding left uncured past its cure due date), claim_frequency (dwelling_msr_paid_claims at or above paid_claims_nonrenewal_threshold), roof_age (a roof older than roof_nonrenewal_age_years at the upcoming effective date) and ineligible_occupancy (a lease type the tier does not allow).
      A notice of nonrenewal is valid only when it is issued no later than the nonrenewal notice deadline before the expiration date.
      The nonrenewal notice deadline is the expiration date minus nonrenewal_notice_days calendar days, and a notice issued on the deadline itself is on time.
      A ground found after the deadline waits for the following term.
      A notice on uncured_condition, roof_age or ineligible_occupancy is rescinded before the expiration date once the ground is cured (the condition cured, the roof replaced, an allowed lease restored); a claim_frequency notice is never rescinded.
      On the expiration date a policy under notice expires and keeps its status_reason.
    eligibility:
      - id: notice_deadline
        applies_to: [dwelling_nonrenewal_noticed]
        kind: time
        condition: "A notice of nonrenewal is valid only when it is issued no later than the nonrenewal notice deadline before the expiration date."
        evidence_fields: [dwelling_policies.expiration_date, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_policies.dwelling_policy_id]]
          action_bindings: {dwelling_policies.dwelling_policy_id: dwelling_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the expiration date
          anchor_source: dwelling_policies.expiration_date
          relation: not_after
          duration_source: variants.nonrenewal_notice_days
          unit: calendar_days
          counting_rule: "The nonrenewal notice deadline is the expiration date minus nonrenewal_notice_days calendar days, and a notice issued on the deadline itself is on time."
          boundary: inclusive
    params: {roof_nonrenewal_age_years: 30}
    measures: [dwelling_msr_paid_claims]

  - id: dwelling_renewal
    subject: [dwelling_renewal_offered, dwelling_policy_renewed, dwelling_policy_expired]
    rule: >-
      When the renewal is offered, renewal_offer_lead_days before expiration, the rating system's indicated premium for the upcoming term is recorded as indicated_renewal_premium, and renewal installment 1 is billed on the capped premium.
      The renewal term premium is the smaller of indicated_renewal_premium and the expiring term_premium increased by renewal_rate_cap_pct, rounded half-up to the cent; the cap never lowers a premium below the indicated amount when the indicated amount is itself lower.
      At renewal Coverage A is increased by inflation_guard_pct, rounded up to the next 1,000 USD and capped at max_dwelling_limit, and roof_settlement is re-evaluated on the roof age at the new effective date.
      The policy renews for twelve calendar months when renewal installment 1 is paid by the expiration date; otherwise it expires with status_reason renewal_not_paid.
    eligibility: []
    params:
      per_tier:
        LandlordGuard DP-1 Basic: {rate_cap_pct: "=renewal_rate_cap_pct", inflation_guard_pct: "=inflation_guard_pct"}
        LandlordGuard DP-2 Broad: {rate_cap_pct: "=renewal_rate_cap_pct", inflation_guard_pct: "=inflation_guard_pct"}
        LandlordGuard DP-3 Special: {rate_cap_pct: "=renewal_rate_cap_pct", inflation_guard_pct: "=inflation_guard_pct"}
        LandlordGuard DP-3 Special Plus: {rate_cap_pct: "=renewal_rate_cap_pct", inflation_guard_pct: "=inflation_guard_pct"}
        LandlordGuard DP-3 Premier: {rate_cap_pct: "=renewal_rate_cap_pct", inflation_guard_pct: "=inflation_guard_pct"}
        LandlordGuard DP-3 Portfolio: {rate_cap_pct: "=renewal_rate_cap_pct", inflation_guard_pct: "=inflation_guard_pct"}
    formula:
      renewal_term_premium: "min(indicated_renewal_premium, round(term_premium * (1 + renewal_rate_cap_pct / 100), 2))"

  - id: dwelling_claim_settlement
    subject: [dwelling_claim_reported, dwelling_claim_payment, dwelling_holdback_withheld, dwelling_claim_denied, dwelling_claim_closed, dwelling_claim_payment_voided]
    rule: >-
      A loss is covered only when its date falls within a term during which the policy was in force, and only for perils of the tier's dwelling_perils basis.
      When dwelling_msr_vacant_days on the date of loss exceeds vacancy_exclusion_days and no vacancy permit covers that date, vandalism and glass breakage are denied with vacancy_exclusion and every other covered loss is reduced by vacancy_settlement_reduction_pct before the deductible, the reduction being recorded as vacancy_reduction.
      Losses arising from a short-term rental on a tier that does not allow short_term are denied with short_term_rental.
      One deductible applies per occurrence: the larger of wind_hail_deductible_pct of Coverage A and wind_hail_deductible_floor for wind_hail, and the policy deductible otherwise, absorbed first by dwelling, then other_structures, then landlord_contents.
      On a DP-1 tier the dwelling is paid actual_cash_value_final with nothing withheld; on other tiers a part whose RC is at or below rc_no_holdback_threshold is paid replacement_cost_full, otherwise acv_initial with depreciation withheld in one dwelling_holdback_withheld entry; roof surfacing on roof_surfacing_schedule is paid as roof_schedule at the schedule percentage, never withheld; landlord contents follow landlord_contents_settlement and theft of them is covered only where landlord_theft_included is true.
      Fair rental value is paid monthly as rent actually lost while the building is unfit to rent, up to fair_rental_value_limit and fair_rental_value_max_months, with no deductible.
      A dwelling payment of mortgagee_copayee_threshold or more names the mortgagee as co-payee when one is on file.
      A payment that has already been voided is never voided again.
    eligibility:
      - id: voided_once
        applies_to: [dwelling_claim_payment_voided]
        kind: dedup
        condition: "A payment that has already been voided is never voided again."
        evidence_fields: [dwelling_claims.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_claims.source_entry_id]]
          action_bindings: {dwelling_claims.source_entry_id: source_entry_id}
        dedup_contract:
          table: dwelling_claims
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [dwelling_claim_payment_voided]}
          distinct_fields: []
    params:
      wind_hail_deductible_floor: 1000
      roof_payment_schedule: {"0-12": 100, "13-15": 80, "16-18": 65, "19-21": 50, "22-25": 40, "26+": "=roof_schedule_min_pct"}
    formula:
      vacancy_reduction_amount: "round(replacement_cost_amount * vacancy_settlement_reduction_pct / 100, 2)"
      acv_payment: "replacement_cost_amount - depreciation_amount - vacancy_reduction - deductible_applied"
    measures: [dwelling_msr_vacant_days]

  - id: dwelling_depreciation_recovery
    subject: [dwelling_holdback_released, dwelling_holdback_forfeited]
    rule: >-
      The holdback is released only when proof of completed repair is received no later than the depreciation recovery period that starts on the date of the initial actual-cash-value payment.
      The depreciation recovery period is counted in calendar days from the date of the initial actual-cash-value payment, and proof received on the last day is on time.
      The release is the smaller of the remaining holdback and the documented incurred cost (capped at RC) minus the actual cash value, never below 0.00; holdback left when the period ends is forfeited in one entry.
    eligibility:
      - id: recovery_period
        applies_to: [dwelling_holdback_released]
        kind: time
        condition: "The holdback is released only when proof of completed repair is received no later than the depreciation recovery period that starts on the date of the initial actual-cash-value payment."
        evidence_fields: [dwelling_claims.entry_date, dwelling_claims.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_claims.source_entry_id]]
          action_bindings: {dwelling_claims.source_entry_id: source_entry_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the initial actual-cash-value payment
          anchor_source: dwelling_claims.entry_date
          relation: not_after
          duration_source: variants.depreciation_recovery_days
          unit: calendar_days
          counting_rule: "The depreciation recovery period is counted in calendar days from the date of the initial actual-cash-value payment, and proof received on the last day is on time."
          boundary: inclusive
    formula:
      release_amount: "max(0, min(depreciation_holdback, min(incurred_amount, replacement_cost_amount) - (replacement_cost_amount - depreciation_amount)))"
