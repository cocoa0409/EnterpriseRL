# Policy charter — FloodGuard Private Flood Policy, Larkspur Mutual Insurance Company.
category: flood
display_name: FloodGuard Private Flood Policy

binding:
  holding_table: flood_policies
  event_tables: [flood_billing, flood_endorsements, flood_claims]
  intake_tables: [flood_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_balance}

lifecycle:
  states: [bound, in_force, pending_cancellation, cancelled, expired]
  transitions:
    - {from: bound, to: in_force, by: system, means: The waiting period ends on the effective date and flood coverage attaches.}
    - {from: bound, to: cancelled, by: user, means: The named insured signs a request to cancel before coverage attaches, for example because the loan never closed.}
    - {from: in_force, to: pending_cancellation, by: agent, means: A notice of cancellation for nonpayment of the second installment is issued.}
    - {from: pending_cancellation, to: in_force, by: agent, means: The installment is paid before the scheduled cancellation date and the notice is rescinded.}
    - {from: pending_cancellation, to: cancelled, by: system, means: The scheduled cancellation date arrives without payment.}
    - {from: in_force, to: cancelled, by: user, means: The named insured signs a request to cancel midterm for one of the accepted cancellation reasons.}
    - {from: in_force, to: expired, by: system, means: The renewal grace period ends without the renewal premium, or the policy reaches expiration under a notice of nonrenewal; coverage ends at the expiration date.}

accounts:
  - key: premium_balance
    unit: USD
    meaning: Flood premium and fees owed; positive owed to the carrier, negative a credit.
  - key: indemnity_paid
    unit: USD
    meaning: Flood claim money issued per claim and coverage part; issued payments raise it and voided payments lower it.

parameter_schema:
  building_coverage_available: Whether building property can be insured (boolean; false = contents only).
  min_building_limit: Lowest building limit (USD; 0 on a contents-only tier).
  max_building_limit: Highest building limit (USD; 0 on a contents-only tier).
  max_contents_limit: Highest contents limit (USD).
  building_deductible_options: Building deductibles allowed (list of USD; empty on a contents-only tier).
  contents_deductible_options: Contents deductibles allowed (list of USD).
  building_settlement: Building loss settlement for a primary residence insured to the required share of replacement cost (enum not_applicable | actual_cash_value | replacement_cost).
  rc_min_insured_pct: Building limit as a share of the building's replacement cost needed for replacement-cost settlement (percent; 0 on a contents-only tier).
  contents_settlement: Contents loss settlement (enum actual_cash_value | replacement_cost).
  basement_contents_covered: Whether contents in a basement are covered beyond washers, dryers, freezers and their contents (boolean).
  basement_finishes_covered: Whether finished basement walls, floors and ceilings are covered (boolean).
  ale_limit: Additional living expense limit while the home is unfit to live in (USD; 0 = none).
  ale_max_months: Longest period additional living expense is paid (months).
  icc_limit: Increased cost of compliance limit to bring a substantially damaged building up to floodplain rules (USD).
  detached_structures_pct: Detached structures coverage as a percent of the building limit (percent).
  pool_repair_limit: Limit for flood damage to an in-ground pool (USD; 0 = not covered).
  loss_avoidance_limit: Reimbursement of sandbags, fill and pumping to protect the building from imminent flood (USD).
  standard_waiting_days: Waiting period between application and coverage for a voluntary purchase (calendar days).
  loan_closing_waiting_days: Waiting period when the purchase is tied to making, increasing, extending or renewing a loan (calendar days).
  map_revision_waiting_days: Waiting period when bought within the map revision window after a flood map revision placed the building in a high-risk zone (calendar days).
  map_revision_window_months: Months after a map revision during which the map revision waiting period applies (months).
  midterm_increase_waiting_days: Waiting period before a voluntary midterm coverage increase attaches (calendar days).
  renewal_grace_days: Days after expiration within which the renewal premium keeps coverage continuous (calendar days).
  proof_of_loss_days: Days after the date of loss within which the signed proof of loss must be received (calendar days).
  building_rate_factor: Tier factor applied to the zone building rate (multiplier).
  contents_rate_per_1000: Annual contents premium per 1,000 USD of contents limit (USD).
  elevation_credit_pct: Building premium credit when an elevation certificate shows the lowest floor at least one foot above base flood elevation (percent).
  companion_discount_pct: Discount when the same building is insured under a live HomeGuard, CondoGuard, RentGuard or LandlordGuard policy (percent).
  policy_fee: Annual policy fee, fully earned when billed (USD).
  minimum_annual_premium: Smallest annual premium before the policy fee (USD).
  billing_plans_allowed: Billing plans allowed (list of annual | two_pay | mortgagee_escrow).
  two_pay_installment_fee: Service charge on the second two_pay installment (USD).
  returned_payment_fee: Fee per returned payment (USD; 0 = none).
  nonpayment_notice_after_due_days: Days past the second installment's due date after which a nonpayment notice is issued (calendar days).
  nonpayment_cancel_notice_days: Days from a nonpayment notice to the scheduled cancellation date (calendar days).
  mortgagee_notice_days: Advance notice owed to the mortgagee before a cancellation or nonrenewal takes effect (calendar days).
  nonrenewal_notice_days: Minimum advance notice of nonrenewal to the named insured (calendar days).
  renewal_offer_lead_days: Days before expiration the renewal premium is billed or invoiced (calendar days).
  repetitive_loss_claims: Paid flood claims within the repetitive loss lookback, each above the repetitive loss minimum, at which the building is nonrenewed (count).
  repetitive_loss_min_claim: Smallest paid flood claim counted toward repetitive loss (USD).
  repetitive_loss_lookback_years: Lookback for repetitive loss (years).
  claim_paid_fully_earned: Whether the term premium becomes fully earned once a claim is paid in the term (boolean).
  refund_minimum: Smallest credit balance refunded (USD).
  renewal_rate_cap_pct: Largest renewal premium increase over the expiring term premium, excluding the policy fee (percent).
  min_premium_change: Midterm prorated premium changes below this amount are not billed (USD).
  increase_step: Step in which building and contents limits are changed (USD).
  max_basement_contents_limit: Most paid for covered basement contents where basement contents are covered (USD; 0 where only appliances are covered).
  zones_rated_extra_pct: Surcharge on the building premium for a building in zone VE (percent).
  claim_advance_pct: Share of the adjuster's undisputed building estimate paid as an advance before the proof of loss (percent; 0 = no advance).

