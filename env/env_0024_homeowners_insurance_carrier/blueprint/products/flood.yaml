events:
  - type: flood_policy_bound
    target: flood_policies
    mutation: create
    meaning: A private flood policy is bound on one building or one unit's contents, with coverage starting after the applicable waiting period.
    grain: One row per policy contract.
    fields:
      policy_number: Policy number.
      variant_name: Official tier name.
      property_address: Insured building or unit address.
      flood_zone: Flood zone on the current flood map.
      map_revision_date: Date of the map revision that placed the building in its zone, empty when none.
      elevation_certificate: Elevation certificate result on file.
      occupancy: Occupancy of the insured property.
      building_replacement_cost: Estimated replacement cost of the building.
      building_limit: Building limit.
      contents_limit: Contents limit.
      building_deductible: Building deductible.
      contents_deductible: Contents deductible.
      purchase_reason: Why the policy was bought, which decides the waiting period.
      billing_plan: Billing plan.
      mortgagee_name: Mortgagee, empty when none.
      loan_number: Loan number, empty when none.
      bound_date: Application and binding date.
      original_effective_date: First coverage start.
      effective_date: Coverage start for the term, after the waiting period.
      expiration_date: End of term.
      term_premium: Annual premium of the term, excluding the policy fee.
    triggers:
      - event: flood:flood_premium_billed
        when: {billing_plan: mortgagee_escrow}
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date, amount: term_premium, payer: mortgagee, posted_date: bound_date}
      - event: flood:flood_premium_billed
        when: {billing_plan: {not: mortgagee_escrow}}
        map: {term_effective_date: effective_date, installment_number: 1, due_date: bound_date, payer: insured, posted_date: bound_date}
      - event: flood:flood_mortgagee_invoice
        when: {billing_plan: mortgagee_escrow}
        map: {term_effective_date: effective_date, due_date: effective_date, posted_date: bound_date}
      - event: flood:flood_fee_assessed
        map: {fee_code: policy_fee, term_effective_date: effective_date, installment_number: 1, posted_date: bound_date}
  - type: flood_policy_activated
    target: flood_policies
    mutation: {transition: {from: bound, to: in_force}}
    meaning: The waiting period ends and flood coverage attaches.
    grain: One row per transaction.
    fields: {effective_date: Effective date reached.}
    triggers: []
  - type: flood_cancellation_noticed
    target: flood_policies
    mutation: {transition: {from: in_force, to: pending_cancellation}}
    meaning: A notice of cancellation for nonpayment of the second installment is issued and copied to the mortgagee.
    grain: One row per transaction.
    fields:
      status_reason: nonpayment.
      pending_action_date: Scheduled cancellation date.
    triggers: []
  - type: flood_cancellation_rescinded
    target: flood_policies
    mutation: {transition: {from: pending_cancellation, to: in_force}}
    meaning: The installment is paid before the scheduled date and the notice is withdrawn.
    grain: One row per transaction.
    fields:
      status_reason: Reset to none.
      pending_action_date: Cleared.
    triggers: []
  - type: flood_policy_cancelled
    target: flood_policies
    mutation:
      transition:
        - {from: pending_cancellation, to: cancelled}
        - {from: in_force, to: cancelled}
        - {from: bound, to: cancelled}
    meaning: Coverage ends before expiration for nonpayment or at the named insured's signed request for an accepted reason.
    grain: One row per transaction.
    fields:
      status_reason: nonpayment or the accepted cancellation reason.
      closed_date: Date coverage ended.
    triggers:
      - event: flood:flood_return_premium
        map: {change_reason: cancellation, effective_date: closed_date, posted_date: closed_date}
  - type: flood_policy_expired
    target: flood_policies
    mutation: {transition: {from: in_force, to: expired}}
    meaning: Coverage ends at the expiration date because the renewal was not paid within the grace period or the policy was nonrenewed.
    grain: One row per transaction.
    fields:
      status_reason: renewal_not_paid or repetitive_loss.
      closed_date: The expiration date.
    triggers: []
  - type: flood_policy_renewed
    target: flood_policies
    mutation: update
    meaning: The policy renews for twelve months with continuous coverage, applying any limit or deductible change the named insured asked to take effect at renewal.
    grain: One row per transaction.
    fields:
      effective_date: Start of the new term (the expiring expiration date).
      expiration_date: End of the new term.
      building_limit: Building limit for the new term.
      contents_limit: Contents limit for the new term.
      building_deductible: Building deductible for the new term.
      contents_deductible: Contents deductible for the new term.
      term_premium: Renewal premium after the rate cap.
      indicated_renewal_premium: Cleared once the renewal takes effect.
    triggers:
      - event: flood:flood_premium_billed
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date}
      - event: flood:flood_fee_assessed
        map: {fee_code: policy_fee, term_effective_date: effective_date, installment_number: 1}
  - type: flood_renewal_offered
    target: flood_policies
    mutation: update
    meaning: The rating system's indicated premium for the upcoming term is recorded when the renewal is offered.
    grain: One row per transaction.
    fields:
      indicated_renewal_premium: Indicated premium for the upcoming term, before the rate cap and excluding the policy fee.
    triggers: []
  - type: flood_coverage_updated
    target: flood_policies
    mutation: update
    meaning: A building or contents limit rises midterm after its waiting period.
    grain: One row per transaction.
    fields:
      building_limit: Building limit after the increase.
      contents_limit: Contents limit after the increase.
    triggers: []
  - type: flood_zone_updated
    target: flood_policies
    mutation: update
    meaning: A flood map revision or a new elevation certificate changes the zone or elevation on file.
    grain: One row per transaction.
    fields:
      flood_zone: Zone after the change.
      map_revision_date: Effective date of the map revision.
      elevation_certificate: Elevation certificate result after the change.
    triggers: []
  - type: flood_mortgagee_changed
    target: flood_policies
    mutation: update
    meaning: The mortgagee is added, replaced or removed.
    grain: One row per transaction.
    fields:
      mortgagee_name: New mortgagee, empty on payoff.
      loan_number: New loan number, empty on payoff.
    triggers: []
  - type: flood_premium_billed
    target: flood_billing
    meaning: One installment of the flood premium is billed to the insured or the mortgagee.
    grain: One row per installment of a term.
    distinguish_by: [term_effective_date, installment_number]
    fields:
      term_effective_date: Term billed.
      installment_number: Installment position.
      due_date: Due date.
      amount: Installment amount.
      payer: insured or mortgagee.
      posted_date: Bill date.
    account: premium_balance
    direction: in
    triggers:
      - event: flood:flood_fee_assessed
        when: {installment_number: 2}
        map: {fee_code: installment_fee, term_effective_date: term_effective_date, installment_number: installment_number, posted_date: posted_date}
  - type: flood_fee_assessed
    target: flood_billing
    meaning: The annual policy fee, the two-pay installment fee or a returned-payment fee is charged.
    grain: One row per fee.
    distinguish_by: [fee_code, term_effective_date, installment_number, source_billing_id]
    fields:
      fee_code: Fee charged.
      term_effective_date: Term of the fee.
      installment_number: Installment of the fee (0 when none).
      source_billing_id: Returned payment the fee is for; empty otherwise.
      amount: Fee amount.
      posted_date: Date charged.
    account: premium_balance
    direction: in
    triggers: []
  - type: flood_payment_received
    target: flood_billing
    meaning: A premium payment is received from the insured or the mortgagee.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      payment_reference: Confirmation or check number.
      payer: Who paid.
      payment_method: Method.
      amount: Amount.
      posted_date: Date received.
    account: premium_balance
    direction: out
    triggers: []
  - type: flood_payment_returned
    target: flood_billing
    meaning: A payment is returned unpaid and reversed.
    grain: One row per returned payment.
    distinguish_by: [source_billing_id]
    fields:
      source_billing_id: Payment reversed.
      amount: Full payment amount.
      posted_date: Date posted.
    account: premium_balance
    direction: in
    triggers:
      - event: flood:flood_fee_assessed
        map: {fee_code: returned_payment_fee, source_billing_id: flood_billing_id, posted_date: posted_date}
  - type: flood_additional_premium
    target: flood_billing
    meaning: Prorated premium for a midterm coverage increase is charged.
    grain: One row per coverage increase.
    distinguish_by: [source_endorsement_id]
    fields:
      source_endorsement_id: Endorsement charged.
      change_reason: coverage_increase.
      effective_date: Date the increase attaches.
      amount: Prorated additional premium.
      posted_date: Date charged.
    account: premium_balance
    direction: in
    triggers: []
  - type: flood_return_premium
    target: flood_billing
    meaning: Unearned premium is credited on an accepted cancellation.
    grain: One row per cancellation credit.
    distinguish_by: [change_reason, effective_date, credit_basis]
    fields:
      change_reason: cancellation.
      effective_date: Cancellation date.
      credit_basis: pro_rata or flat.
      amount: Amount credited (no entry is posted when the premium is fully earned).
      posted_date: Date credited.
    account: premium_balance
    direction: out
    triggers: []
  - type: flood_refund_issued
    target: flood_billing
    meaning: A credit balance is refunded to the payer entitled to it.
    grain: One row per refund.
    distinguish_by: [posted_date, payer]
    fields:
      payer: insured or mortgagee refunded.
      payment_method: Method.
      amount: Amount refunded.
      posted_date: Date refunded.
    account: premium_balance
    direction: in
    triggers: []
  - type: flood_mortgagee_invoice
    target: flood_billing
    meaning: The term premium and policy fee are invoiced to the mortgagee for payment from escrow.
    grain: One row per mortgagee invoice per term.
    distinguish_by: [term_effective_date]
    fields:
      term_effective_date: Term invoiced.
      due_date: Due date.
      amount: Amount invoiced.
      posted_date: Date sent.
    triggers: []
  - type: flood_endorsement_added
    target: flood_endorsements
    meaning: A midterm building or contents limit increase is requested and scheduled to attach after its waiting period.
    grain: One row per limit increase.
    distinguish_by: [change_code, request_date, coverage_value]
    fields:
      change_code: Which limit is increased.
      request_date: Date requested and paid.
      tied_to_loan: Whether the increase is required by a lender in making, increasing, extending or renewing a loan.
      waiting_period_days: Waiting period applied.
      effective_date: Date the increase attaches.
      coverage_value: New limit.
      annual_premium_change: Full-year premium of the increase.
      premium_direction: additional or none.
      prorated_premium: Prorated premium of the increase.
    triggers:
      - event: flood:flood_additional_premium
        when: {premium_direction: additional}
        map: {source_endorsement_id: flood_endorsement_id, change_reason: coverage_increase, effective_date: effective_date, amount: prorated_premium, posted_date: request_date}
      - event: flood:flood_coverage_updated
        when: {change_code: building_increase}
        map: {building_limit: coverage_value}
      - event: flood:flood_coverage_updated
        when: {change_code: contents_increase}
        map: {contents_limit: coverage_value}
  - type: flood_claim_reported
    target: flood_claims
    meaning: First notice of a flood loss opens a claim number.
    grain: One row per claim.
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number.
      loss_date: Date the flood entered the building.
      entry_date: Date reported.
    triggers: []
  - type: flood_proof_of_loss_received
    target: flood_claims
    meaning: The named insured's signed proof of loss is received for a claim.
    grain: One row per proof of loss received.
    distinguish_by: [claim_number, entry_date]
    fields:
      claim_number: Claim.
      loss_date: Date of loss.
      proof_of_loss_amount: Amount claimed on the signed proof of loss.
      entry_date: Date received.
    triggers: []
  - type: flood_claim_payment
    target: flood_claims
    meaning: Flood claim money is issued for one coverage part and location class.
    grain: One row per payment on a coverage part and location class.
    distinguish_by: [claim_number, coverage_part, location_class, payment_type, entry_date]
    fields:
      claim_number: Claim paid.
      loss_date: Date of loss.
      coverage_part: Coverage part paid.
      location_class: Above grade or basement.
      payment_type: Kind of payment.
      replacement_cost_amount: Replacement-cost value after caps.
      depreciation_amount: Depreciation.
      deductible_applied: Deductible absorbed.
      amount: Amount paid.
      payee: Payee.
      entry_date: Date issued.
    account: indemnity_paid
    direction: in
    triggers: []
  - type: flood_claim_payment_voided
    target: flood_claims
    meaning: An uncashed flood payment is voided.
    grain: One row per voided payment.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim of the void.
      source_entry_id: Payment voided.
      amount: Amount voided.
      entry_date: Date voided.
    account: indemnity_paid
    direction: out
    triggers: []
  - type: flood_claim_denied
    target: flood_claims
    meaning: Coverage is denied for a coverage part or location class with a controlled reason.
    grain: One row per coverage part and location class denied.
    distinguish_by: [claim_number, coverage_part, location_class, denial_reason]
    fields:
      claim_number: Claim.
      coverage_part: Coverage part denied.
      location_class: Location class denied.
      denial_reason: Reason.
      entry_date: Date of the denial letter.
    triggers: []
  - type: flood_claim_closed
    target: flood_claims
    meaning: The claim file is closed.
    grain: One row per closing.
    distinguish_by: [claim_number, entry_date]
    fields:
      claim_number: Claim.
      entry_date: Date closed.
    triggers: []

measures:
  - id: flood_msr_amount_due
    window: All entries of the policy up to and including the evaluation date.
    measure: Sum of flood_premium_billed amounts due on or before the evaluation date plus flood_fee_assessed, flood_payment_returned, flood_additional_premium and flood_refund_issued amounts posted on or before it, minus flood_payment_received and flood_return_premium amounts posted on or before it, floored at 0.00.
  - id: flood_msr_repetitive_losses
    window: The repetitive_loss_lookback_years years ending on the renewal offer date, across every flood policy that has insured the same property address.
    measure: Count of distinct claim_number values whose unvoided flood_claim_payment amounts total more than repetitive_loss_min_claim.
  - id: flood_msr_term_claims_paid
    window: The current policy term (effective date to expiration date).
    measure: Sum of unvoided flood_claim_payment amounts on the policy with loss_date in the term.

policies:
  - id: flood_agg_multi_holding
    subject: [flood_policy_bound]
    rule: >-
      A customer may insure several buildings or units with FloodGuard, one policy per property address, up to max_per_customer live policies; a live policy is one that is bound, in force or pending cancellation.
      No other flood policy that is bound, in force or pending cancellation covers the same property address.
    eligibility:
      - id: property_not_already_insured
        applies_to: [flood_policy_bound]
        kind: dedup
        condition: "No other flood policy that is bound, in force or pending cancellation covers the same property address."
        evidence_fields: [flood_policies.property_address, flood_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[flood_policies.property_address]]
          action_bindings: {flood_policies.property_address: property_address}
        dedup_contract:
          table: flood_policies
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [bound, in_force, pending_cancellation]}
          distinct_fields: []
    params: {max_per_customer: 6}

  - id: flood_agg_companion_discount
    subject: [flood_policy_bound, flood_policy_renewed]
    rule: >-
      companion_discount_pct applies when the same property address is insured under a live HomeGuard, CondoGuard, RentGuard or LandlordGuard policy of the same customer, judged across the customer's Larkspur portfolio at binding and on each renewal offer date; a live policy is one that is bound, in force, pending cancellation or pending nonrenewal.
      One companion policy is enough and the discount never stacks; a companion policy that ends midterm removes the discount only from the next renewal, never midterm.
      The discount applies to the premium before the policy fee and before the renewal rate cap.
    eligibility: []

  - id: flood_waiting_period
    subject: [flood_policy_bound, flood_policy_activated, flood_endorsement_added, flood_coverage_updated]
    rule: >-
      Coverage starts after a waiting period counted in calendar days from the application date, which is the bound date: the effective date is the bound date plus the waiting days.
      A voluntary purchase waits standard_waiting_days.
      A purchase required by a lender in making, increasing, extending or renewing a loan waits loan_closing_waiting_days, but only when the application and premium are received no later than the loan closing date; otherwise it waits standard_waiting_days.
      The map revision waiting period applies only when the policy is applied for within the map revision window that starts on the map revision date.
      The map revision window is counted in calendar months from the map revision date, falling back to the last day of the month when that day does not exist, and an application on the same day of the last month of the window is outside it.
      A map revision purchase waits map_revision_waiting_days, and only when the revision placed the building in zone A, AE or VE; after the window it waits standard_waiting_days.
      A renewal paid within the renewal grace period and a transfer of the policy to a buyer of the building carry no waiting period.
      A midterm limit increase waits midterm_increase_waiting_days from the request date, or loan_closing_waiting_days when tied_to_loan is true, and the new limit attaches on the date the waiting period ends.
      A bound policy moves to in_force on its effective date.
      A flood that begins before the effective date is never covered, even when the water reaches the building after it.
    eligibility:
      - id: map_revision_window
        applies_to: [flood_policy_bound]
        kind: time
        condition: "The map revision waiting period applies only when the policy is applied for within the map revision window that starts on the map revision date."
        evidence_fields: [flood_policies.map_revision_date, flood_policies.purchase_reason, flood_policies.customer_id, flood_policies.property_address]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[flood_policies.customer_id, flood_policies.property_address]]
          action_bindings: {flood_policies.customer_id: customer_id, flood_policies.property_address: property_address}
        temporal_basis:
          clock: frozen_time
          anchor_event: the map revision date
          anchor_source: flood_policies.map_revision_date
          relation: not_after
          duration_source: variants.map_revision_window_months
          unit: calendar_months
          counting_rule: "The map revision window is counted in calendar months from the map revision date, falling back to the last day of the month when that day does not exist, and an application on the same day of the last month of the window is outside it."
          boundary: exclusive
      - id: loan_closing_evidence
        applies_to: [flood_policy_bound, flood_endorsement_added]
        kind: caller_fact
        condition: "A purchase required by a lender in making, increasing, extending or renewing a loan waits loan_closing_waiting_days, but only when the application and premium are received no later than the loan closing date; otherwise it waits standard_waiting_days."
        evidence_fields: [flood_policies.purchase_reason, flood_policies.bound_date, flood_policies.customer_id, flood_policies.property_address]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[flood_policies.customer_id, flood_policies.property_address]]
          action_bindings: {flood_policies.customer_id: customer_id, flood_policies.property_address: property_address}
    params:
      per_tier:
        FloodGuard Contents Only: {standard: "=standard_waiting_days", loan_closing: "=loan_closing_waiting_days", map_revision: "=map_revision_waiting_days", midterm_increase: "=midterm_increase_waiting_days"}
        FloodGuard Essential: {standard: "=standard_waiting_days", loan_closing: "=loan_closing_waiting_days", map_revision: "=map_revision_waiting_days", midterm_increase: "=midterm_increase_waiting_days"}
        FloodGuard Standard: {standard: "=standard_waiting_days", loan_closing: "=loan_closing_waiting_days", map_revision: "=map_revision_waiting_days", midterm_increase: "=midterm_increase_waiting_days"}
        FloodGuard Plus: {standard: "=standard_waiting_days", loan_closing: "=loan_closing_waiting_days", map_revision: "=map_revision_waiting_days", midterm_increase: "=midterm_increase_waiting_days"}
        FloodGuard Premier: {standard: "=standard_waiting_days", loan_closing: "=loan_closing_waiting_days", map_revision: "=map_revision_waiting_days", midterm_increase: "=midterm_increase_waiting_days"}
        FloodGuard High Value: {standard: "=standard_waiting_days", loan_closing: "=loan_closing_waiting_days", map_revision: "=map_revision_waiting_days", midterm_increase: "=midterm_increase_waiting_days"}

  - id: flood_premium_rating
    subject: [flood_policy_bound, flood_policy_renewed, flood_endorsement_added, flood_renewal_offered]
    rule: >-
      The building premium is building_limit divided by 1,000, multiplied by the zone_building_rate of the flood zone and by building_rate_factor, raised by zones_rated_extra_pct in zone VE and reduced by elevation_credit_pct when the elevation certificate shows the lowest floor at least one foot above base flood elevation.
      The contents premium is contents_limit divided by 1,000 multiplied by contents_rate_per_1000.
      The annual premium is the building plus contents premium, reduced by companion_discount_pct where flood_agg_companion_discount applies, rounded half-up to the cent and never less than minimum_annual_premium; the policy fee is charged on top of it each term and is never discounted.
      A limit or zone change never re-rates the term midterm except through a limit increase, whose annual premium change is the difference between the annual premium with and without the increase and is prorated from the date it attaches to the expiration date over the calendar days in the term, rounded half-up to the cent; below min_premium_change nothing is billed.
      At renewal the indicated premium is rated on the zone, elevation and limits on file on the renewal offer date, and the renewal term premium is the smaller of that indicated premium and the expiring term_premium increased by renewal_rate_cap_pct, rounded half-up to the cent.
    eligibility: []
    params:
      zone_building_rate: {X: 0.64, A: 3.87, AE: 2.96, VE: 6.42}
    formula:
      building_premium: "building_limit / 1000 * zone_building_rate * building_rate_factor"
      contents_premium: "contents_limit / 1000 * contents_rate_per_1000"
      annual_premium: "max(minimum_annual_premium, round((building_premium + contents_premium) * (1 - companion_discount_pct / 100), 2))"
      renewal_term_premium: "min(indicated_renewal_premium, round(term_premium * (1 + renewal_rate_cap_pct / 100), 2))"

  - id: flood_billing_and_mortgagee
    subject: [flood_premium_billed, flood_fee_assessed, flood_payment_received, flood_payment_returned, flood_refund_issued, flood_mortgagee_invoice, flood_mortgagee_changed, flood_additional_premium]
    rule: >-
      A new policy's premium and policy fee are due on the bound date under the annual plan; under two_pay half of the premium, rounded half-up to the cent, is due on the bound date with the policy fee and the rest six calendar months after the effective date with two_pay_installment_fee; under mortgagee_escrow the premium and policy fee are invoiced to the mortgagee in one invoice due on the effective date.
      Premium is billed only while the policy is bound, in force or pending cancellation.
      A renewal is billed or invoiced renewal_offer_lead_days before expiration, due on the expiration date, and the mortgagee on file receives the renewal invoice for an escrowed policy.
      Payments apply oldest charge first and are recorded with their confirmation or check number exactly as issued; a returned payment reverses the one payment it references in full and adds returned_payment_fee.
      A refund is issued only when the premium balance is a credit of at least refund_minimum, to the payer of the most recent payment, so a credit created by the mortgagee's escrow payment is refunded to the mortgagee.
      A mortgagee change is recorded only with the mortgagee's name and loan number exactly as on the mortgage statement, and the mortgagee receives mortgagee_notice_days of notice before any cancellation or nonrenewal takes effect.
    eligibility:
      - id: billable_status
        applies_to: [flood_premium_billed]
        kind: state
        condition: "Premium is billed only while the policy is bound, in force or pending cancellation."
        evidence_fields: [flood_policies.status, flood_policies.flood_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[flood_policies.flood_policy_id]]
          action_bindings: {flood_policies.flood_policy_id: flood_policy_id}
        state_contract:
          field: flood_policies.status
          allowed: [bound, in_force, pending_cancellation]
    measures: [flood_msr_amount_due]

  - id: flood_cancellation
    subject: [flood_cancellation_noticed, flood_cancellation_rescinded, flood_policy_cancelled, flood_return_premium]
    rule: >-
      A flood policy is cancelled at the named insured's request only for an accepted cancellation reason listed in cancellation_reason_basis, on a request the named insured has signed.
      The named insured's signed request states an accepted cancellation reason.
      A request for any other reason, including that the lender no longer requires flood insurance, is declined midterm; the named insured may instead choose not to renew.
      The cancellation takes effect on the date of the reason (the sale closing date, the other policy's effective date, the payoff date, the date the building was destroyed) but never before the effective date and never more than cancel_backdate_max_days before the date the signed request is received.
      The credit follows the reason's basis: pro_rata is term_premium multiplied by the calendar days from the cancellation date to the expiration date and divided by the calendar days in the term, rounded half-up to the cent; flat returns the whole term premium; and the policy fee is never returned.
      When a claim has been paid in the term and claim_paid_fully_earned is true, the premium is fully earned and no credit is posted.
      A nonpayment notice for the second two_pay installment is issued once it is still unpaid more than nonpayment_notice_after_due_days calendar days after its due date, with the cancellation scheduled nonpayment_cancel_notice_days later and never sooner than mortgagee_notice_days when a mortgagee is on file; it is rescinded only by payment of flood_msr_amount_due before that date, and a nonpayment cancellation credits pro rata.
    eligibility:
      - id: accepted_reason
        applies_to: [flood_policy_cancelled]
        kind: authorization
        condition: "The named insured's signed request states an accepted cancellation reason."
        evidence_fields: [flood_requests.flood_request_id, flood_requests.cancellation_reason, flood_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[flood_requests.flood_request_id]]
          action_bindings: {flood_requests.flood_request_id: flood_request_id}
    params:
      cancellation_reason_basis: {property_sold: pro_rata, duplicate_coverage: pro_rata, loan_paid_off: pro_rata, building_destroyed_not_by_flood: pro_rata, loan_not_closed: flat}
      cancel_backdate_max_days: 30
    measures: [flood_msr_term_claims_paid, flood_msr_amount_due]

  - id: flood_renewal
    subject: [flood_renewal_offered, flood_policy_renewed, flood_policy_expired]
    rule: >-
      The renewal keeps coverage continuous only when the renewal premium is received no later than the renewal grace period that starts on the expiration date.
      The renewal grace period is counted in calendar days from the expiration date, and payment on the last day is on time.
      A renewal paid within the grace period takes effect on the expiring expiration date with no waiting period; after the grace period the policy expires as of its expiration date with status_reason renewal_not_paid, and new coverage needs a new application with a new waiting period.
      Limit decreases and deductible changes the named insured asks for take effect only at renewal.
      The building is nonrenewed as repetitive_loss when flood_msr_repetitive_losses reaches repetitive_loss_claims on the renewal offer date, with notice at least nonrenewal_notice_days before expiration to the named insured and mortgagee_notice_days to the mortgagee.
    eligibility:
      - id: renewal_grace
        applies_to: [flood_policy_renewed]
        kind: time
        condition: "The renewal keeps coverage continuous only when the renewal premium is received no later than the renewal grace period that starts on the expiration date."
        evidence_fields: [flood_policies.expiration_date, flood_policies.flood_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[flood_policies.flood_policy_id]]
          action_bindings: {flood_policies.flood_policy_id: flood_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the expiration date
          anchor_source: flood_policies.expiration_date
          relation: not_after
          duration_source: variants.renewal_grace_days
          unit: calendar_days
          counting_rule: "The renewal grace period is counted in calendar days from the expiration date, and payment on the last day is on time."
          boundary: inclusive
    measures: [flood_msr_repetitive_losses]

  - id: flood_zone_changes
    subject: [flood_zone_updated]
    rule: >-
      A flood map revision or a new elevation certificate is recorded when the named insured or the lender provides the revised map panel or the certificate.
      A zone or elevation change never changes the premium of the current term; it is rated at the next renewal offer.
      A revision that moves the building into zone A, AE or VE opens the map revision window for a new purchase at that address, and a revision that moves it out of those zones is a reason the lender may drop its requirement but never an accepted cancellation reason.
    eligibility: []

  - id: flood_claim_settlement
    subject: [flood_claim_reported, flood_proof_of_loss_received, flood_claim_payment, flood_claim_payment_voided, flood_claim_denied, flood_claim_closed]
    rule: >-
      A flood is covered only when it began on or after the effective date of the coverage in force; damage from a flood that began during the waiting period is denied with waiting_period.
      Building and contents each take their own deductible per occurrence; additional living expense, increased cost of compliance and loss avoidance take none.
      Building damage is settled at replacement cost only on a replacement_cost tier for a primary residence whose building_limit is at least rc_min_insured_pct of building_replacement_cost; otherwise at actual cash value; contents follow contents_settlement.
      Below-grade damage is limited: in a basement only washers, dryers, freezers and the food in them, furnaces, water heaters and electrical panels are covered unless basement_contents_covered or basement_finishes_covered is true, and covered basement contents are capped at max_basement_contents_limit; other basement items are denied with basement_exclusion.
      Advance payments of claim_advance_pct of the adjuster's undisputed building estimate may be paid before the proof of loss.
      A claim is paid in full only on a signed proof of loss received no later than the proof-of-loss period that starts on the date of loss.
      The proof-of-loss period is counted in calendar days from the date of loss, and a proof received on the last day is on time.
      Building payments name the mortgagee as co-payee when one is on file; a payment that has already been voided is never voided again.
    eligibility:
      - id: proof_of_loss_period
        applies_to: [flood_claim_payment]
        kind: time
        condition: "A claim is paid in full only on a signed proof of loss received no later than the proof-of-loss period that starts on the date of loss."
        evidence_fields: [flood_claims.loss_date, flood_claims.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[flood_claims.claim_number]]
          action_bindings: {flood_claims.claim_number: claim_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of loss
          anchor_source: flood_claims.loss_date
          relation: not_after
          duration_source: variants.proof_of_loss_days
          unit: calendar_days
          counting_rule: "The proof-of-loss period is counted in calendar days from the date of loss, and a proof received on the last day is on time."
          boundary: inclusive
    formula:
      rc_payment: "replacement_cost_amount - deductible_applied"
      acv_payment: "replacement_cost_amount - depreciation_amount - deductible_applied"
