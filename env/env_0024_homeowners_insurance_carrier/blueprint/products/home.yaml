# Policy charter — HomeGuard Homeowners Policy (HO-3 / HO-5), Larkspur Mutual Insurance Company.
category: home
display_name: HomeGuard Homeowners Policy

binding:
  holding_table: home_policies
  event_tables: [home_billing, home_endorsements, home_inspections, home_claims]
  intake_tables: [home_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_balance}

lifecycle:
  states: [bound, in_force, pending_cancellation, cancelled, pending_nonrenewal, expired]
  transitions:
    - {from: bound, to: in_force, by: system, means: The policy reaches its effective date and coverage attaches.}
    - {from: bound, to: cancelled, by: user, means: The named insured signs a request to cancel before the policy ever takes effect (flat cancellation).}
    - {from: in_force, to: pending_cancellation, by: agent, means: A notice of cancellation for nonpayment or an underwriting reason is issued and the cancellation date is scheduled.}
    - {from: pending_cancellation, to: in_force, by: agent, means: The notice of cancellation is rescinded because the cure the notice demands was received before the scheduled cancellation date.}
    - {from: pending_cancellation, to: cancelled, by: system, means: The scheduled cancellation date arrives without the cure and coverage ends.}
    - {from: in_force, to: cancelled, by: user, means: The named insured signs a request to cancel the policy midterm.}
    - {from: cancelled, to: in_force, by: agent, means: A policy cancelled for nonpayment is reinstated inside the reinstatement window.}
    - {from: in_force, to: pending_nonrenewal, by: agent, means: A notice of nonrenewal is issued and the policy will end at its expiration date.}
    - {from: pending_nonrenewal, to: in_force, by: agent, means: The notice of nonrenewal is rescinded because the underwriting condition behind it was cured before expiration.}
    - {from: pending_nonrenewal, to: expired, by: system, means: The expiration date arrives on a policy under a notice of nonrenewal.}
    - {from: in_force, to: expired, by: system, means: The expiration date arrives and the renewal premium was not received in time, so the policy lapses.}
    - {from: expired, to: in_force, by: agent, means: A late renewal payment is accepted inside the late-payment window and the policy renews with a coverage gap.}

accounts:
  - key: premium_balance
    unit: USD
    meaning: Premium and fees the named insured currently owes on the policy; positive means money owed to the carrier, negative means a credit owed back to the payer.
  - key: indemnity_paid
    unit: USD
    meaning: Claim money issued on the policy, per claim and coverage part; issued payments raise it and voided payments lower it.
  - key: depreciation_holdback
    unit: USD
    meaning: Recoverable depreciation withheld from a replacement-cost claim payment, per claim and coverage part, still waiting to be released or forfeited.

parameter_schema:
  coverage_form: ISO coverage form the tier is written on (string, HO-3 or HO-5).
  personal_property_perils: Peril basis for Coverage C personal property (enum named_perils | open_perils).
  personal_property_settlement: Loss settlement basis for Coverage C (enum actual_cash_value | replacement_cost).
  min_coverage_a: Lowest Coverage A dwelling limit the tier may be written at (USD).
  max_coverage_a: Highest Coverage A dwelling limit the tier may be written at (USD).
  other_structures_pct: Coverage B other-structures limit as a percent of Coverage A (percent).
  personal_property_pct: Coverage C personal-property limit as a percent of Coverage A (percent).
  loss_of_use_pct: Coverage D loss-of-use limit as a percent of Coverage A (percent).
  loss_of_use_max_months: Longest period additional living expense is paid after a covered loss (months).
  extended_replacement_cost_pct: Extra dwelling replacement cost payable above Coverage A after a total loss (percent of Coverage A; 0 = not included).
  liability_limit_options: Coverage E personal-liability limits the tier may carry (list of USD, lowest to highest).
  medical_payments_limit: Coverage F medical payments to others, per person (USD).
  aop_deductible_options: All-other-perils deductible amounts the tier may carry (list of USD).
  wind_hail_deductible_pct_options: Wind/hail deductible percentages of Coverage A the tier may carry (list of percent).
  wind_hail_deductible_minimum: Dollar floor under the percentage wind/hail deductible (USD).
  roof_rc_max_age_years: Oldest roof age, in whole years at the policy term effective date, that still settles roof surfacing at replacement cost (years).
  roof_schedule_exempt_materials: Roof materials that settle at replacement cost regardless of age (list of roof_material enum values; empty list = none).
  max_roof_age_new_business_years: Oldest roof age accepted when a new policy is bound (years).
  max_home_age_new_business_years: Oldest dwelling age, from year built, accepted when a new policy is bound (years).
  cosmetic_roof_hail_exclusion: Whether hail damage to a metal roof that does not let water in (cosmetic damage) is excluded (boolean).
  water_backup_included_limit: Water backup and sump discharge limit included in the package without an endorsement (USD; 0 = not included).
  water_backup_max_limit: Highest water backup limit the policy may carry in total, included plus purchased (USD).
  water_backup_rate_per_5000: Annual premium for each 5,000 USD of water backup limit purchased above the included limit (USD).
  hidden_water_limit: Limit for dwelling damage from continuous or repeated seepage or leakage of water that was hidden from view (USD; 0 = seepage fully excluded).
  seepage_exclusion_days: Duration of continuous or repeated seepage or leakage at or beyond which the seepage exclusion applies (calendar days).
  mold_limit: Aggregate limit for fungi, wet rot and bacteria remediation per policy term (USD).
  service_line_included_limit: Underground service line limit included in the package (USD; 0 = not included).
  service_line_endorsement_limit: Service line limit provided when the endorsement is purchased (USD).
  service_line_annual_premium: Annual premium of the service line endorsement (USD).
  equipment_breakdown_included_limit: Home systems equipment breakdown limit included in the package (USD; 0 = not included).
  equipment_breakdown_endorsement_limit: Equipment breakdown limit provided when the endorsement is purchased (USD).
  equipment_breakdown_annual_premium: Annual premium of the equipment breakdown endorsement (USD).
  identity_fraud_included_limit: Identity fraud expense limit included in the package (USD; 0 = not included).
  identity_fraud_endorsement_limit: Identity fraud expense limit provided when the endorsement is purchased (USD).
  identity_fraud_annual_premium: Annual premium of the identity fraud expense endorsement (USD).
  ordinance_or_law_pct: Ordinance or law coverage as a percent of Coverage A (percent).
  jewelry_theft_limit: Special limit for theft of jewelry, watches and furs under Coverage C (USD).
  firearms_theft_limit: Special limit for theft of firearms under Coverage C (USD).
  money_limit: Special limit for money, bank notes and coins under Coverage C (USD).
  rc_no_holdback_threshold: Replacement-cost loss amount per coverage part at or below which the full replacement cost is paid without withholding depreciation (USD; 0 = always withheld).
  depreciation_recovery_days: Days after the initial actual-cash-value payment within which repair or replacement must be completed and documented to recover withheld depreciation (calendar days).
  deductible_waiver_threshold: Covered loss amount per occurrence at or above which the deductible is waived (USD; 0 = no waiver).
  hail_claim_report_days: Days after the date of loss within which a wind or hail claim must be reported (calendar days).
  new_business_period_days: Days after the first effective date during which the policy may be cancelled for any underwriting reason (calendar days).
  new_business_inspection_type: Inspection ordered on every new policy (enum exterior | exterior_interior).
  inspection_order_days: Days after binding within which the new-business inspection is ordered (calendar days).
  inspection_cure_days: Days after the inspection completion date allowed to cure a condition finding (calendar days).
  nonrenewal_notice_days: Minimum days of advance written notice of nonrenewal before the expiration date (calendar days).
  nonpayment_cancel_notice_days: Days between the nonpayment notice date and the scheduled cancellation date (calendar days).
  underwriting_cancel_notice_days: Days between an underwriting cancellation notice date and the scheduled cancellation date (calendar days).
  nonpayment_notice_after_due_days: Days past an installment due date after which a nonpayment notice is issued if the installment is still unpaid (calendar days).
  late_fee_grace_days: Days past an installment due date before a late fee is charged (calendar days).
  late_fee: Late fee per late installment (USD; 0 = none).
  returned_payment_fee: Fee for each payment returned unpaid by the bank (USD; 0 = none).
  installment_fee_direct: Service charge on each installment after the first on a direct-billed installment plan (USD).
  installment_fee_eft: Service charge on each installment after the first on the monthly EFT plan (USD).
  billing_plans_allowed: Billing plans the tier may be placed on (list of billing_plan enum values).
  returned_payment_limit_12m: Returned payments within 12 months that suspend EFT and check payments for the rest of the term (count).
  courtesy_fee_waivers_12m: Courtesy waivers of a late fee or returned-payment fee allowed per rolling 12 months (count).
  insured_cancel_basis: How unearned premium is returned when the named insured cancels midterm (enum pro_rata | short_rate).
  short_rate_retention_pct: Share of the pro-rata unearned premium retained on a short-rate cancellation (percent; 0 when the basis is pro_rata).
  minimum_earned_premium: Premium the carrier keeps at minimum on a named-insured midterm cancellation (USD).
  reinstatement_window_days: Days after a nonpayment cancellation date within which reinstatement may be requested (calendar days).
  reinstatement_fee: Fee charged when a cancelled policy is reinstated (USD; 0 = none).
  refund_minimum: Smallest credit balance refunded; smaller credits stay on account (USD).
  min_premium_change: Midterm endorsement premium changes below this prorated amount are neither billed nor credited (USD).
  coverage_a_rate_per_1000: Annual premium per 1,000 USD of midterm Coverage A change (USD).
  liability_step_annual_premium: Annual premium per step up the tier's liability limit ladder (USD).
  inflation_guard_pct: Automatic Coverage A increase applied at each renewal (percent).
  paid_claims_nonrenewal_threshold: Non-weather paid claims in the lookback window at which the policy becomes eligible for nonrenewal (count).
  water_claims_nonrenewal_threshold: Paid water claims in the lookback window at which the policy becomes eligible for nonrenewal (count).
  claims_lookback_months: Length of the claims-history lookback window (months).
  renewal_offer_lead_days: Days before expiration the renewal offer and first renewal installment are billed (calendar days).
  renewal_late_payment_days: Days after expiration a late renewal payment is still accepted to renew with a lapse (calendar days).
  mortgagee_notice_days: Days of advance notice owed to the mortgagee before a cancellation takes effect (calendar days).
  mortgagee_copayee_threshold: Dwelling or other-structures payment at or above which the mortgagee is named as co-payee (USD).

