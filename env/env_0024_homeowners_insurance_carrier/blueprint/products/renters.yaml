# Policy charter — RentGuard Renters Policy (HO-4), Larkspur Mutual Insurance Company.
category: renters
display_name: RentGuard Renters Policy

binding:
  holding_table: renters_policies
  event_tables: [renters_billing, renters_claims]
  intake_tables: [renters_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_balance}

lifecycle:
  states: [bound, in_force, pending_cancellation, cancelled, pending_nonrenewal, expired]
  transitions:
    - {from: bound, to: in_force, by: system, means: The policy reaches its effective date and coverage attaches.}
    - {from: bound, to: cancelled, by: user, means: The named insured signs a request to cancel before the policy takes effect (flat cancellation).}
    - {from: in_force, to: pending_cancellation, by: agent, means: A notice of cancellation for nonpayment is issued with a scheduled cancellation date.}
    - {from: pending_cancellation, to: in_force, by: agent, means: The past-due amount is paid before the scheduled cancellation date and the notice is rescinded.}
    - {from: pending_cancellation, to: cancelled, by: system, means: The scheduled cancellation date arrives without payment.}
    - {from: in_force, to: cancelled, by: user, means: The named insured signs a request to cancel midterm, for example after moving out or buying a home.}
    - {from: cancelled, to: in_force, by: agent, means: A policy cancelled for nonpayment is reinstated inside the reinstatement window.}
    - {from: in_force, to: pending_nonrenewal, by: agent, means: A notice of nonrenewal is issued for claim frequency.}
    - {from: pending_nonrenewal, to: expired, by: system, means: The expiration date arrives on a policy under a notice of nonrenewal.}
    - {from: in_force, to: expired, by: system, means: The expiration date arrives and the renewal premium was not received in time.}
    - {from: expired, to: in_force, by: agent, means: A late renewal payment is accepted inside the late-payment window and the policy renews with a coverage gap.}

accounts:
  - key: premium_balance
    unit: USD
    meaning: Premium and fees the named insured owes on the renters policy; positive means owed to the carrier, negative a credit owed back.
  - key: indemnity_paid
    unit: USD
    meaning: Claim money issued on the policy per claim and coverage part; issued payments raise it and voided payments lower it.
  - key: depreciation_holdback
    unit: USD
    meaning: Recoverable depreciation withheld from a replacement-cost contents payment, still waiting to be released or forfeited.

parameter_schema:
  personal_property_min_limit: Lowest Coverage C personal property limit the tier may carry (USD).
  personal_property_max_limit: Highest Coverage C personal property limit the tier may carry (USD).
  personal_property_settlement: Loss settlement basis for Coverage C (enum actual_cash_value | replacement_cost).
  personal_property_perils: Peril basis for Coverage C (enum named_perils | open_perils).
  loss_of_use_pct: Coverage D loss of use as a percent of Coverage C (percent).
  loss_of_use_max_months: Longest period additional living expense is paid (months).
  liability_limit_options: Personal liability limits the tier may carry (list of USD).
  medical_payments_limit: Medical payments to others per person (USD).
  deductible_options: Deductibles the tier may carry (list of USD).
  off_premises_pct: Coverage C available for property while away from the rental premises (percent of Coverage C).
  jewelry_theft_limit: Special limit for theft of jewelry, watches and furs (USD).
  portable_electronics_limit: Special limit for laptops, phones, tablets and cameras per occurrence (USD).
  bicycle_limit: Special limit for bicycles and e-bikes per occurrence (USD).
  money_limit: Special limit for money and bank notes (USD).
  landlord_furnishings_limit: Limit for the landlord's furnishings in the unit (USD; 0 = not covered).
  water_backup_included_limit: Water backup and sump discharge limit for contents (USD; 0 = not covered).
  identity_fraud_included_limit: Identity fraud expense limit (USD; 0 = not included).
  food_spoilage_limit: Refrigerated food spoilage after a power outage (USD; 0 = not covered).
  rc_no_holdback_threshold: Replacement-cost contents loss at or below which the full replacement cost is paid without withholding depreciation (USD).
  depreciation_recovery_days: Days after the actual-cash-value payment within which replaced items must be documented to recover withheld depreciation (calendar days).
  contents_rate_per_1000: Annual premium per 1,000 USD of Coverage C before territory and deductible factors (USD).
  minimum_annual_premium: Smallest annual premium the tier charges (USD).
  autopay_discount_pct: Discount on the monthly_eft plan (percent; 0 = none).
  multi_policy_discount_pct: Discount while the customer also holds a live Larkspur Personal Umbrella or Valuables Floater (percent).
  co_insured_allowed: Whether a roommate may be added as an additional named insured (boolean).
  co_insured_annual_charge: Annual premium for an additional named insured (USD).
  billing_plans_allowed: Billing plans the tier may use (list of annual | two_pay | monthly_eft | monthly_card).
  installment_fee_eft: Service charge on each monthly_eft installment after the first (USD).
  installment_fee_card: Service charge on each monthly_card installment after the first (USD).
  installment_fee_two_pay: Service charge on the second two_pay installment (USD).
  late_fee: Late fee per late installment (USD; 0 = none).
  late_fee_grace_days: Days past an installment due date before a late fee is charged (calendar days).
  returned_payment_fee: Fee for each payment returned unpaid (USD; 0 = none).
  returned_payment_limit_12m: Returned payments in 12 months that suspend EFT for the rest of the term (count).
  courtesy_fee_waivers_12m: Courtesy waivers of a late or returned-payment fee allowed per rolling 12 months (count).
  nonpayment_notice_after_due_days: Days past an installment due date after which a nonpayment notice is issued (calendar days).
  nonpayment_cancel_notice_days: Days between the nonpayment notice and the scheduled cancellation date (calendar days).
  insured_cancel_basis: How unearned premium is returned on a named-insured cancellation (enum pro_rata | short_rate).
  short_rate_retention_pct: Share of the pro-rata unearned premium kept on a short-rate cancellation (percent).
  minimum_earned_premium: Premium kept at minimum on a named-insured midterm cancellation (USD).
  cancel_backdate_max_days: Most days a named-insured cancellation may be backdated to a documented move-out date (calendar days).
  reinstatement_window_days: Days after a nonpayment cancellation within which reinstatement may be requested (calendar days).
  reinstatement_fee: Fee charged at reinstatement (USD; 0 = none).
  max_reinstatements_12m: Reinstatements allowed in a rolling 12 months (count).
  refund_minimum: Smallest credit balance refunded (USD).
  small_balance_writeoff_max: Largest debit balance written off instead of billed once the policy has ended (USD).
  collection_referral_days: Days after the cancellation date an unpaid earned-premium balance is referred to collections (calendar days).
  relocation_report_days: Days after moving within which a new rental address must be reported (calendar days).
  moving_coverage_days: Days Coverage C applies at both the old and the new residence while moving (calendar days).
  interested_party_notice_days: Advance notice of cancellation owed to a landlord listed as interested party (calendar days).
  nonrenewal_notice_days: Minimum advance notice of nonrenewal before expiration (calendar days).
  paid_claims_nonrenewal_threshold: Paid claims in the lookback window at which the policy becomes eligible for nonrenewal (count).
  claims_lookback_months: Claims lookback window (months).
  renewal_offer_lead_days: Days before expiration the renewal is billed (calendar days).
  renewal_late_payment_days: Days after expiration a late renewal payment is still accepted to renew with a lapse (calendar days).
  min_premium_change: Midterm prorated premium changes below this amount are neither billed nor credited (USD).

