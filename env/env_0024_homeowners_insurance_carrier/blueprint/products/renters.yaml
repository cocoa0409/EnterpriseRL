events:
  - type: renters_policy_bound
    target: renters_policies
    mutation: create
    meaning: A renters policy is bound for one rental residence with its contents limit, liability limit, deductible, rating territory and billing plan.
    grain: One row per policy contract.
    fields:
      policy_number: Policy number assigned at binding.
      variant_name: Official tier name.
      rental_address: Rental residence address.
      rental_zip: ZIP code of the rental residence.
      territory_code: Rating territory derived from the ZIP code.
      unit_type: Kind of rental unit.
      personal_property_limit: Coverage C limit.
      liability_limit: Personal liability limit.
      deductible: Deductible.
      co_insured_name: Roommate added as additional named insured, empty when none.
      interested_party_name: Landlord or property manager listed as interested party, empty when none.
      billing_plan: Billing plan chosen.
      bound_date: Date bound.
      original_effective_date: First inception date.
      effective_date: Start of the term.
      expiration_date: End of the term.
      term_premium: Annual premium at the current rating.
    triggers:
      - event: renters:renters_premium_billed
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date, posted_date: bound_date}
  - type: renters_policy_activated
    target: renters_policies
    mutation: {transition: {from: bound, to: in_force}}
    meaning: Coverage attaches on the effective date.
    grain: One row per transaction.
    fields: {effective_date: Effective date reached.}
    triggers: []
  - type: renters_cancellation_noticed
    target: renters_policies
    mutation: {transition: {from: in_force, to: pending_cancellation}}
    meaning: A notice of cancellation for nonpayment is issued, copied to any interested party.
    grain: One row per transaction.
    fields:
      status_reason: nonpayment.
      pending_action_date: Scheduled cancellation date.
    triggers: []
  - type: renters_cancellation_rescinded
    target: renters_policies
    mutation: {transition: {from: pending_cancellation, to: in_force}}
    meaning: A pending nonpayment cancellation is withdrawn after the past-due amount is paid.
    grain: One row per transaction.
    fields:
      status_reason: Reset to none.
      pending_action_date: Cleared.
    triggers: []
  - type: renters_policy_cancelled
    target: renters_policies
    mutation:
      transition:
        - {from: pending_cancellation, to: cancelled}
        - {from: in_force, to: cancelled}
        - {from: bound, to: cancelled}
    meaning: Coverage ends before expiration for nonpayment or at the named insured's signed request.
    grain: One row per transaction.
    fields:
      policy_number: Policy number, carried unchanged.
      status_reason: nonpayment or insured_request.
      closed_date: Date coverage ended.
      pending_action_date: Cleared.
    triggers:
      - event: renters:renters_return_premium
        map: {change_reason: cancellation, effective_date: closed_date, posted_date: closed_date}
      - event: umbrella:umbrella_underlying_lapsed
        map: {underlying_line: renters, underlying_policy_number: policy_number, event_date: closed_date}
  - type: renters_policy_reinstated
    target: renters_policies
    mutation: {transition: {from: cancelled, to: in_force}}
    meaning: A policy cancelled for nonpayment is reinstated without a lapse.
    grain: One row per transaction.
    fields:
      status_reason: Reset to none.
      closed_date: Cleared.
    triggers:
      - event: renters:renters_fee_assessed
        map: {fee_code: reinstatement_fee}
      - event: renters:renters_additional_premium
        map: {change_reason: reinstatement_reversal}
  - type: renters_nonrenewal_noticed
    target: renters_policies
    mutation: {transition: {from: in_force, to: pending_nonrenewal}}
    meaning: A notice of nonrenewal for claim frequency is issued.
    grain: One row per transaction.
    fields:
      status_reason: claim_frequency.
      pending_action_date: The expiration date on which the policy will end.
    triggers: []
  - type: renters_policy_expired
    target: renters_policies
    mutation:
      transition:
        - {from: pending_nonrenewal, to: expired}
        - {from: in_force, to: expired}
    meaning: The term ends without a renewal in force.
    grain: One row per transaction.
    fields:
      policy_number: Policy number, carried unchanged.
      status_reason: claim_frequency or renewal_not_paid.
      closed_date: The expiration date.
    triggers:
      - event: umbrella:umbrella_underlying_lapsed
        map: {underlying_line: renters, underlying_policy_number: policy_number, event_date: closed_date}
  - type: renters_lapse_renewed
    target: renters_policies
    mutation: {transition: {from: expired, to: in_force}}
    meaning: A late renewal payment is accepted inside the window and the policy renews with a coverage gap.
    grain: One row per transaction.
    fields:
      effective_date: Start of the renewed term (the day the late payment was received).
      expiration_date: End of the renewed term.
      status_reason: Reset to none.
      closed_date: Cleared.
    triggers: []
  - type: renters_policy_renewed
    target: renters_policies
    mutation: update
    meaning: The policy rolls into a new twelve-month term at the renewal premium.
    grain: One row per transaction.
    fields:
      effective_date: Start of the new term.
      expiration_date: End of the new term.
      term_premium: Renewal annual premium.
    triggers:
      - event: renters:renters_premium_billed
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date}
  - type: renters_relocated
    target: renters_policies
    mutation: update
    meaning: The insured residence moves to a new rental address, re-rated on the new territory.
    grain: One row per transaction.
    fields:
      rental_address: New rental address.
      rental_zip: New ZIP code.
      territory_code: Rating territory of the new ZIP code.
      unit_type: Kind of the new rental unit.
      term_premium: Annual premium re-rated at the new address.
    triggers: []
  - type: renters_coverage_updated
    target: renters_policies
    mutation: update
    meaning: Contents limit, liability limit, deductible or additional named insured changes midterm, re-rated.
    grain: One row per transaction.
    fields:
      personal_property_limit: Coverage C after the change.
      liability_limit: Liability limit after the change.
      deductible: Deductible after the change.
      co_insured_name: Additional named insured after the change, empty when none.
      term_premium: Annual premium re-rated after the change.
    triggers: []
  - type: renters_interested_party_changed
    target: renters_policies
    mutation: update
    meaning: The landlord or property manager listed as interested party is added, replaced or removed.
    grain: One row per transaction.
    fields:
      interested_party_name: Interested party after the change, empty when removed.
      interested_party_address: Mailing address of the interested party, empty when removed.
    triggers: []
  - type: renters_billing_plan_changed
    target: renters_policies
    mutation: update
    meaning: The billing plan changes, at the insured's request or on EFT suspension, re-rated for the autopay discount.
    grain: One row per transaction.
    fields:
      billing_plan: Billing plan after the change.
      eft_suspended: Whether EFT is suspended for the rest of the term.
      term_premium: Annual premium re-rated for the plan.
    triggers: []
  - type: renters_premium_billed
    target: renters_billing
    meaning: One installment of the term premium is billed.
    grain: One row per installment of a term.
    distinguish_by: [term_effective_date, installment_number]
    fields:
      term_effective_date: Term billed.
      installment_number: Installment position (1 = first).
      due_date: Due date.
      amount: Installment amount.
      posted_date: Bill date.
    account: premium_balance
    direction: in
    triggers:
      - event: renters:renters_fee_assessed
        when: {installment_number: {not: 1}}
        map: {fee_code: installment_fee, term_effective_date: term_effective_date, installment_number: installment_number, posted_date: posted_date}
  - type: renters_fee_assessed
    target: renters_billing
    meaning: An installment fee, late fee, returned-payment fee or reinstatement fee is charged.
    grain: One row per fee.
    distinguish_by: [fee_code, term_effective_date, installment_number, source_billing_id]
    fields:
      fee_code: Fee charged.
      term_effective_date: Term of the fee.
      installment_number: Installment the fee relates to (0 when none).
      source_billing_id: Returned payment a returned-payment fee is for; empty otherwise.
      amount: Fee amount.
      posted_date: Date charged.
    account: premium_balance
    direction: in
    triggers: []
  - type: renters_fee_waived
    target: renters_billing
    meaning: A late fee or returned-payment fee is waived.
    grain: One row per waived fee.
    distinguish_by: [source_billing_id]
    fields:
      source_billing_id: Fee entry waived.
      fee_code: Code of the fee waived.
      amount: Full fee amount.
      posted_date: Date waived.
    account: premium_balance
    direction: out
    triggers: []
  - type: renters_payment_received
    target: renters_billing
    meaning: A premium payment is received and applied.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      payment_reference: Confirmation or check number.
      payment_method: Method of payment.
      amount: Amount paid.
      posted_date: Date received.
    account: premium_balance
    direction: out
    triggers: []
  - type: renters_payment_returned
    target: renters_billing
    meaning: A payment is returned unpaid by the bank and reversed.
    grain: One row per returned payment.
    distinguish_by: [source_billing_id]
    fields:
      source_billing_id: Payment entry reversed.
      amount: Full payment amount.
      posted_date: Date posted.
    account: premium_balance
    direction: in
    triggers:
      - event: renters:renters_fee_assessed
        map: {fee_code: returned_payment_fee, source_billing_id: renters_billing_id, posted_date: posted_date}
  - type: renters_additional_premium
    target: renters_billing
    meaning: Prorated additional premium from a midterm re-rating, or the reversal of a cancellation credit at reinstatement, is charged.
    grain: One row per premium-raising change on an effective date.
    distinguish_by: [change_reason, effective_date]
    fields:
      change_reason: What raised the premium.
      effective_date: Date the change takes effect.
      source_billing_id: Cancellation credit reversed at reinstatement; empty otherwise.
      amount: Prorated additional premium.
      posted_date: Date charged.
    account: premium_balance
    direction: in
    triggers: []
  - type: renters_return_premium
    target: renters_billing
    meaning: Unearned premium is credited from a midterm re-rating or a cancellation.
    grain: One row per premium-reducing change on an effective date, or per cancellation.
    distinguish_by: [change_reason, effective_date, credit_basis]
    fields:
      change_reason: What reduced the premium.
      effective_date: Date the change or cancellation takes effect.
      credit_basis: pro_rata, short_rate or flat.
      amount: Premium credited.
      posted_date: Date credited.
    account: premium_balance
    direction: out
    triggers: []
  - type: renters_refund_issued
    target: renters_billing
    meaning: A credit balance is refunded to the named insured.
    grain: One row per refund.
    distinguish_by: [posted_date]
    fields:
      amount: Amount refunded.
      payment_method: Method of refund.
      posted_date: Date refunded.
    account: premium_balance
    direction: in
    triggers: []
  - type: renters_balance_written_off
    target: renters_billing
    meaning: A small debit balance left on an ended policy is written off instead of billed.
    grain: One row per write-off.
    distinguish_by: [posted_date]
    fields:
      amount: Amount written off.
      posted_date: Date written off.
    account: premium_balance
    direction: out
    triggers: []
  - type: renters_collection_referred
    target: renters_billing
    meaning: An unpaid earned-premium balance on a cancelled policy is referred to the collection agency.
    grain: One row per referral.
    distinguish_by: [posted_date]
    fields:
      amount: Balance referred.
      posted_date: Date referred.
    triggers: []
  - type: renters_claim_reported
    target: renters_claims
    meaning: First notice of loss opens a claim number for one occurrence.
    grain: One row per claim.
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number.
      loss_date: Date of loss as reported.
      peril: Cause of loss.
      location: Where the property was.
      entry_date: Date reported.
    triggers: []
  - type: renters_claim_payment
    target: renters_claims
    meaning: Claim money is issued for one coverage part and property class.
    grain: One row per payment on a coverage part and property class.
    distinguish_by: [claim_number, coverage_part, property_class, payment_type, entry_date]
    fields:
      claim_number: Claim paid.
      loss_date: Date of loss.
      peril: Cause of loss.
      location: Where the property was.
      coverage_part: Coverage part paid.
      property_class: Property class paid.
      payment_type: Kind of payment.
      replacement_cost_amount: Replacement-cost value after limit caps.
      depreciation_amount: Depreciation on that value.
      deductible_applied: Deductible absorbed.
      amount: Amount paid.
      payee: Payee.
      entry_date: Date issued.
    account: indemnity_paid
    direction: in
    triggers:
      - event: renters:renters_holdback_withheld
        when: {payment_type: acv_initial}
        map: {claim_number: claim_number, coverage_part: coverage_part, property_class: property_class, amount: depreciation_amount, source_entry_id: renters_claim_entry_id, entry_date: entry_date}
  - type: renters_claim_payment_voided
    target: renters_claims
    meaning: An uncashed claim payment is voided.
    grain: One row per voided payment.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim of the void.
      source_entry_id: Payment voided.
      amount: Amount voided.
      entry_date: Date voided.
    account: indemnity_paid
    direction: out
    triggers: []
  - type: renters_holdback_withheld
    target: renters_claims
    meaning: Recoverable depreciation is withheld from an actual-cash-value contents payment.
    grain: One row per actual-cash-value payment that withholds depreciation.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim of the holdback.
      coverage_part: Coverage part.
      property_class: Property class.
      source_entry_id: Payment the holdback came from.
      amount: Depreciation withheld.
      entry_date: Date withheld.
    account: depreciation_holdback
    direction: in
    triggers: []
  - type: renters_holdback_released
    target: renters_claims
    meaning: Withheld depreciation is released after replacement is documented.
    grain: One row per documented replacement released against a holdback.
    distinguish_by: [source_entry_id, entry_date, incurred_amount]
    fields:
      claim_number: Claim of the release.
      coverage_part: Coverage part.
      property_class: Property class.
      source_entry_id: Holdback released against.
      incurred_amount: Documented replacement cost.
      amount: Depreciation released.
      entry_date: Date proof accepted.
    account: depreciation_holdback
    direction: out
    triggers:
      - event: renters:renters_claim_payment
        map: {claim_number: claim_number, coverage_part: coverage_part, property_class: property_class, payment_type: recoverable_depreciation, amount: amount, entry_date: entry_date}
  - type: renters_holdback_forfeited
    target: renters_claims
    meaning: Holdback unreleased at the end of the recovery period is forfeited.
    grain: One row per holdback forfeited.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim of the forfeiture.
      source_entry_id: Holdback forfeited.
      amount: Remaining holdback.
      entry_date: Date forfeited.
    account: depreciation_holdback
    direction: out
    triggers: []
  - type: renters_claim_denied
    target: renters_claims
    meaning: Coverage is denied for a coverage part with a controlled reason.
    grain: One row per coverage part denied.
    distinguish_by: [claim_number, coverage_part, denial_reason]
    fields:
      claim_number: Claim denied.
      coverage_part: Coverage part denied.
      denial_reason: Reason.
      entry_date: Date of the denial letter.
    triggers: []
  - type: renters_claim_closed
    target: renters_claims
    meaning: The claim file is closed.
    grain: One row per closing.
    distinguish_by: [claim_number, entry_date]
    fields:
      claim_number: Claim closed.
      entry_date: Date closed.
    triggers: []

measures:
  - id: renters_msr_amount_due
    window: All entries of the policy up to and including the evaluation date.
    measure: Sum of renters_premium_billed amounts whose due_date is on or before the evaluation date, plus renters_fee_assessed, renters_payment_returned, renters_additional_premium and renters_refund_issued amounts posted on or before it, minus renters_payment_received, renters_fee_waived, renters_return_premium and renters_balance_written_off amounts posted on or before it, floored at 0.00.
  - id: renters_msr_fee_waivers_12m
    window: Rolling 12 calendar months ending on the waiver date — posted_date later than the waiver date minus 12 calendar months and on or before it.
    measure: Count of renters_fee_waived entries on the policy.
  - id: renters_msr_returned_payments_12m
    window: Rolling 12 calendar months ending on the return date.
    measure: Count of renters_payment_returned entries on the policy, including the one being posted.
  - id: renters_msr_reinstatements_12m
    window: Rolling 12 calendar months ending on the reinstatement request date — posted_date later than that date minus 12 calendar months and on or before it.
    measure: Count of renters_additional_premium entries with change_reason reinstatement_reversal on the policy (one per reinstatement).
  - id: renters_msr_paid_claims
    window: The claims_lookback_months calendar months ending on the notice date.
    measure: Count of distinct claim_number values on the customer's renters policies with at least one unvoided renters_claim_payment entry in the window.

policies:
  - id: renters_agg_multi_holding
    subject: [renters_policy_bound]
    rule: >-
      A customer may hold RentGuard policies on at most max_per_customer rental residences at once (for example a family apartment and a student unit), one policy per rental address, counted across every renters policy in the customer's name.
      Only policies that are bound, in force, pending cancellation or pending nonrenewal count.
      The customer holds fewer live renters policies than the multi-holding cap and none at the same rental address before the new policy is bound.
    eligibility:
      - id: live_policy_cap
        applies_to: [renters_policy_bound]
        kind: authorization
        condition: "The customer holds fewer live renters policies than the multi-holding cap and none at the same rental address before the new policy is bound."
        evidence_fields: [renters_policies.customer_id, renters_policies.status, renters_policies.rental_address]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_policies.customer_id]]
          action_bindings: {renters_policies.customer_id: customer_id}
    params: {max_per_customer: 2}

  - id: renters_agg_bundle_discount
    subject: [renters_policy_bound, renters_policy_renewed, renters_additional_premium, renters_return_premium]
    rule: >-
      multi_policy_discount_pct applies to every live renters policy of a customer who also holds a live Larkspur Personal Umbrella or a live Larkspur Valuables Floater, judged across the customer's whole Larkspur portfolio by customer profile; a live policy is one that is bound, in force, pending cancellation or pending nonrenewal.
      The discount is applied once however many qualifying policies are held, and it never stacks with itself.
      When a qualifying policy is bound during the renters term the discount starts on that policy's effective date, and when the last qualifying policy ends during the term the discount stops on that policy's closed date; each is re-rated as a midterm change with change_reason multi_policy_discount_change under renters_midterm_changes.
      A customer who holds a HomeGuard or CondoGuard policy does not qualify through it, because a renters policy never insures the same residence as one of those.
    eligibility: []

  - id: renters_bind_eligibility
    subject: [renters_policy_bound, renters_policy_activated]
    rule: >-
      A RentGuard policy is bound only on a tier whose entry gate the applicant meets.
      Coverage C is set within personal_property_min_limit and personal_property_max_limit in steps of 1,000 USD, the liability limit must be one of liability_limit_options, the deductible one of deductible_options, and the billing plan one of billing_plans_allowed.
      The rental residence is in Ohio and its territory_code is assigned from the first three digits of rental_zip by territory_by_zip3.
      The customer holds no live HomeGuard or CondoGuard policy on the same address, because one residence is never insured under both at once.
      A roommate is added as co-insured only on a tier where co_insured_allowed is true, and only one roommate per policy.
      A bound policy moves to in_force on its effective date, and the term runs twelve calendar months.
    eligibility:
      - id: no_owner_policy_same_address
        applies_to: [renters_policy_bound]
        kind: authorization
        condition: "The customer holds no live HomeGuard or CondoGuard policy on the same address, because one residence is never insured under both at once."
        evidence_fields: [home_policies.customer_id, home_policies.property_address, home_policies.status, condo_policies.customer_id, condo_policies.unit_address, condo_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.customer_id], [condo_policies.customer_id]]
          action_bindings: {home_policies.customer_id: customer_id, condo_policies.customer_id: customer_id}
      - id: ohio_residence
        applies_to: [renters_policy_bound]
        kind: caller_fact
        condition: "The rental residence is in Ohio and its territory_code is assigned from the first three digits of rental_zip by territory_by_zip3."
        evidence_fields: [renters_policies.rental_zip, renters_policies.rental_address, renters_policies.customer_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[renters_policies.customer_id, renters_policies.rental_address]]
          action_bindings: {renters_policies.customer_id: customer_id, renters_policies.rental_address: rental_address}
    params:
      territory_by_zip3: {"430": CMH, "431": CMH, "432": CMH, "440": CLE, "441": CLE, "442": CLE, "443": CLE, "450": CIN, "451": CIN, "452": CIN, "453": CIN, "454": CIN, "434": TOL, "435": TOL, "436": TOL, "458": TOL, "444": NEO, "445": NEO, "446": NEO, "447": NEO, "448": NEO, "449": NEO, "433": SEO, "437": SEO, "438": SEO, "439": SEO, "455": SEO, "456": SEO, "457": SEO}

  - id: renters_premium_rating
    subject: [renters_policy_bound, renters_policy_renewed, renters_relocated, renters_coverage_updated, renters_billing_plan_changed]
    rule: >-
      The annual premium is computed in this order.
      The contents charge is personal_property_limit divided by 1,000, multiplied by contents_rate_per_1000, by the territory_factor of the policy's territory_code and by the deductible_factor of its deductible.
      The subtotal adds the liability_charge for the liability limit and, when a co-insured roommate is on the policy, co_insured_annual_charge.
      The discount percentage is autopay_discount_pct when the billing plan is monthly_eft plus multi_policy_discount_pct when renters_agg_bundle_discount applies, and 0 otherwise.
      The annual premium is the subtotal reduced by the discount percentage, rounded half-up to the cent, and never less than minimum_annual_premium.
      term_premium always holds the annual premium at the policy's current rating: it is set at binding and renewal and restated after every midterm re-rating.
      The same arithmetic is used for the renewal offer on the rating in force on the renewal offer date.
    eligibility: []
    params:
      territory_factor: {CMH: 1.00, CLE: 1.12, CIN: 1.06, TOL: 0.97, NEO: 0.94, SEO: 0.89}
      deductible_factor: {"100": 1.12, "250": 1.06, "500": 1.00, "1000": 0.91}
      liability_charge: {"100000": 14.00, "300000": 26.00, "500000": 38.00, "1000000": 61.00}
      per_tier:
        RentGuard HO-4 Starter: {rate: "=contents_rate_per_1000", floor: "=minimum_annual_premium", autopay: "=autopay_discount_pct", bundle: "=multi_policy_discount_pct"}
        RentGuard HO-4 Essential: {rate: "=contents_rate_per_1000", floor: "=minimum_annual_premium", autopay: "=autopay_discount_pct", bundle: "=multi_policy_discount_pct"}
        RentGuard HO-4 Enhanced: {rate: "=contents_rate_per_1000", floor: "=minimum_annual_premium", autopay: "=autopay_discount_pct", bundle: "=multi_policy_discount_pct"}
        RentGuard HO-4 Premier: {rate: "=contents_rate_per_1000", floor: "=minimum_annual_premium", autopay: "=autopay_discount_pct", bundle: "=multi_policy_discount_pct"}
        RentGuard HO-4 Premier Plus: {rate: "=contents_rate_per_1000", floor: "=minimum_annual_premium", autopay: "=autopay_discount_pct", bundle: "=multi_policy_discount_pct"}
        RentGuard HO-4 Signature: {rate: "=contents_rate_per_1000", floor: "=minimum_annual_premium", autopay: "=autopay_discount_pct", bundle: "=multi_policy_discount_pct"}
    formula:
      contents_charge: "personal_property_limit / 1000 * contents_rate_per_1000 * territory_factor * deductible_factor"
      subtotal: "contents_charge + liability_charge + co_insured_annual_charge"
      discount_pct: "autopay_discount_pct + multi_policy_discount_pct"
      annual_premium: "max(minimum_annual_premium, round(subtotal * (1 - discount_pct / 100), 2))"

  - id: renters_premium_billing
    subject: [renters_premium_billed]
    rule: >-
      Each term is billed on the installment schedule of its plan: annual in one installment due on the term effective date, two_pay in two installments due on the effective date and six calendar months later, and monthly_eft or monthly_card in twelve installments due monthly from the effective date, a due day that does not exist in a month falling back to the last day of that month.
      Each later installment is the term premium divided by the installment count, rounded half-up to the cent, and installment 1 takes the difference so the installments add up exactly to the term premium.
      Installment 1 of a new policy is posted on the bound date and installment 1 of a renewal renewal_offer_lead_days before the expiring term's expiration date; each later installment is posted bill_lead_days before its due date.
      After a midterm re-rating, the prorated additional or return premium is posted on its own and the remaining unbilled installments stay as scheduled.
      Installments are billed only while the policy is bound, in force, pending cancellation or pending nonrenewal.
      The installment fee is installment_fee_eft on monthly_eft, installment_fee_card on monthly_card and installment_fee_two_pay on the second two_pay installment, and is never charged on installment 1 or on the annual plan.
    eligibility:
      - id: billable_status
        applies_to: [renters_premium_billed]
        kind: state
        condition: "Installments are billed only while the policy is bound, in force, pending cancellation or pending nonrenewal."
        evidence_fields: [renters_policies.status, renters_policies.renters_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_policies.renters_policy_id]]
          action_bindings: {renters_policies.renters_policy_id: renters_policy_id}
        state_contract:
          field: renters_policies.status
          allowed: [bound, in_force, pending_cancellation, pending_nonrenewal]
    params:
      installments_per_plan: {annual: 1, two_pay: 2, monthly_eft: 12, monthly_card: 12}
      bill_lead_days: 15
    formula:
      later_installment: "round(term_premium / installments_per_plan, 2)"
      first_installment: "term_premium - (installments_per_plan - 1) * later_installment"

  - id: renters_fees_and_waivers
    subject: [renters_fee_assessed, renters_fee_waived]
    rule: >-
      A late fee is charged only when the installment is still unpaid after the late-fee grace period that starts on the installment due date.
      The late-fee grace period is counted in calendar days from the due date, so the late fee may be posted from the day after the due date plus late_fee_grace_days.
      An installment is still unpaid when renters_msr_amount_due on that day still includes any part of it, payments having been applied oldest charge first; a late fee is charged at most once per installment.
      The returned-payment fee is charged once per returned payment, referencing that return, and the reinstatement fee once per reinstatement; a fee whose tier amount is 0.00 is not charged at all.
      On the named insured's request a late fee or returned-payment fee may be waived as a courtesy.
      A courtesy waiver is granted only while the policy's waivers in the rolling 12 months are fewer than the tier's courtesy waiver allowance.
      A fee that has already been waived is never waived again.
      Installment fees and reinstatement fees are never waived, and a waiver removes the full amount of the one fee entry it references.
    eligibility:
      - id: late_fee_grace
        applies_to: [renters_fee_assessed]
        kind: time
        condition: "A late fee is charged only when the installment is still unpaid after the late-fee grace period that starts on the installment due date."
        evidence_fields: [renters_billing.due_date, renters_billing.term_effective_date, renters_billing.installment_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_billing.term_effective_date, renters_billing.installment_number]]
          action_bindings: {renters_billing.term_effective_date: term_effective_date, renters_billing.installment_number: installment_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: the installment due date
          anchor_source: renters_billing.due_date
          relation: not_before
          duration_source: variants.late_fee_grace_days
          unit: calendar_days
          counting_rule: "The late-fee grace period is counted in calendar days from the due date, so the late fee may be posted from the day after the due date plus late_fee_grace_days."
          boundary: exclusive
      - id: courtesy_allowance
        applies_to: [renters_fee_waived]
        kind: authorization
        condition: "A courtesy waiver is granted only while the policy's waivers in the rolling 12 months are fewer than the tier's courtesy waiver allowance."
        evidence_fields: [renters_billing.renters_policy_id, renters_billing.event_type, renters_billing.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_billing.renters_policy_id]]
          action_bindings: {renters_billing.renters_policy_id: renters_policy_id}
      - id: fee_waived_once
        applies_to: [renters_fee_waived]
        kind: dedup
        condition: "A fee that has already been waived is never waived again."
        evidence_fields: [renters_billing.source_billing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_billing.source_billing_id]]
          action_bindings: {renters_billing.source_billing_id: source_billing_id}
        dedup_contract:
          table: renters_billing
          mode: separate_record
          object_bindings: {source_billing_id: source_billing_id}
          duplicate_filters: {event_type: [renters_fee_waived]}
          distinct_fields: []
    measures: [renters_msr_fee_waivers_12m, renters_msr_amount_due]

  - id: renters_payment_application
    subject: [renters_payment_received, renters_payment_returned, renters_billing_plan_changed]
    rule: >-
      A payment is applied to the balance oldest charge first and recorded with its confirmation or check number exactly as issued.
      A returned payment reverses the one payment entry it references in full.
      A payment that has already been returned is never returned again.
      When renters_msr_returned_payments_12m reaches returned_payment_limit_12m, eft_suspended is set to true for the rest of the term and a monthly_eft policy is moved to monthly_card, losing the autopay discount from the date of the move under renters_premium_rating; eft_suspended resets to false at renewal.
      A named-insured request to change billing plan is accepted only for a plan in billing_plans_allowed and never to monthly_eft while eft_suspended is true, and is re-rated for the autopay discount from the change date.
      A billing-plan change is made only while the policy is in force or pending nonrenewal.
    eligibility:
      - id: payment_returned_once
        applies_to: [renters_payment_returned]
        kind: dedup
        condition: "A payment that has already been returned is never returned again."
        evidence_fields: [renters_billing.source_billing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_billing.source_billing_id]]
          action_bindings: {renters_billing.source_billing_id: source_billing_id}
        dedup_contract:
          table: renters_billing
          mode: separate_record
          object_bindings: {source_billing_id: source_billing_id}
          duplicate_filters: {event_type: [renters_payment_returned]}
          distinct_fields: []
      - id: plan_change_status
        applies_to: [renters_billing_plan_changed]
        kind: state
        condition: "A billing-plan change is made only while the policy is in force or pending nonrenewal."
        evidence_fields: [renters_policies.status, renters_policies.renters_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_policies.renters_policy_id]]
          action_bindings: {renters_policies.renters_policy_id: renters_policy_id}
        state_contract:
          field: renters_policies.status
          allowed: [in_force, pending_nonrenewal]
    measures: [renters_msr_returned_payments_12m]

  - id: renters_nonpayment_cancellation
    subject: [renters_cancellation_noticed, renters_cancellation_rescinded, renters_policy_cancelled]
    rule: >-
      A notice of cancellation for nonpayment is issued only when an installment has remained unpaid past the nonpayment notice period that starts on the installment due date.
      The nonpayment notice period is counted in calendar days from the due date, so the notice may be issued from the day after the due date plus nonpayment_notice_after_due_days.
      The scheduled cancellation date is the notice date plus nonpayment_cancel_notice_days calendar days, and never earlier than the notice date plus interested_party_notice_days when a landlord is listed as interested party; the notice is copied to the interested party.
      The notice is rescinded only when payments received after the notice date and before the scheduled cancellation date total at least renters_msr_amount_due as of the notice date.
      When the scheduled cancellation date arrives without that cure, the policy is cancelled that day with status_reason nonpayment and the unearned premium is credited pro rata, with no retention and no minimum earned premium.
    eligibility:
      - id: nonpayment_notice_period
        applies_to: [renters_cancellation_noticed]
        kind: time
        condition: "A notice of cancellation for nonpayment is issued only when an installment has remained unpaid past the nonpayment notice period that starts on the installment due date."
        evidence_fields: [renters_billing.due_date, renters_billing.term_effective_date, renters_billing.installment_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_billing.term_effective_date, renters_billing.installment_number]]
          action_bindings: {renters_billing.term_effective_date: term_effective_date, renters_billing.installment_number: installment_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: the installment due date
          anchor_source: renters_billing.due_date
          relation: not_before
          duration_source: variants.nonpayment_notice_after_due_days
          unit: calendar_days
          counting_rule: "The nonpayment notice period is counted in calendar days from the due date, so the notice may be issued from the day after the due date plus nonpayment_notice_after_due_days."
          boundary: exclusive
      - id: full_cure_received
        applies_to: [renters_cancellation_rescinded]
        kind: authorization
        condition: "The notice is rescinded only when payments received after the notice date and before the scheduled cancellation date total at least renters_msr_amount_due as of the notice date."
        evidence_fields: [renters_billing.event_type, renters_billing.amount, renters_billing.posted_date, renters_policies.pending_action_date, renters_policies.renters_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_policies.renters_policy_id]]
          action_bindings: {renters_policies.renters_policy_id: renters_policy_id}
    measures: [renters_msr_amount_due]

  - id: renters_insured_cancellation
    subject: [renters_policy_cancelled, renters_return_premium, renters_additional_premium]
    rule: >-
      The named insured cancels by a request recorded by the agent and signed by the named insured; a co-insured roommate cannot cancel the policy.
      The cancellation is processed only on a request the named insured has signed.
      The cancellation date is not earlier than the date the signed request is received, unless it is backdated to a documented move-out date.
      A cancellation is backdated only to a move-out date shown on a lease termination or a new residence's move-in document, by no more than cancel_backdate_max_days before the date the signed request is received, and only when no claim on the policy has a loss date on or after that move-out date.
      A cancellation on or before the effective date of a bound policy is flat, crediting the whole term premium with credit_basis flat.
      Otherwise the pro-rata unearned premium is term_premium, the annual premium at the current rating, multiplied by the calendar days from the cancellation date to the expiration date and divided by the calendar days in the term, rounded half-up to the cent.
      Under insured_cancel_basis pro_rata the whole unearned premium is returnable with credit_basis pro_rata; under short_rate the carrier keeps short_rate_retention_pct of it and the rest is returnable with credit_basis short_rate.
      The cancellation credit is the returnable amount minus the term's scheduled installments not yet billed, because unbilled installments are simply never billed.
      The credit is then reduced, if needed, so that the premium kept for the term (everything billed for the term minus the credit) is at least minimum_earned_premium.
      When the credit works out below 0.00, no credit is posted and the difference is billed as one renters_additional_premium entry with change_reason cancellation, dated the cancellation date.
      A positive credit is one renters_return_premium entry with change_reason cancellation dated the cancellation date, and the interested party, when listed, is notified.
    eligibility:
      - id: signed_request
        applies_to: [renters_policy_cancelled]
        kind: authorization
        condition: "The cancellation is processed only on a request the named insured has signed."
        evidence_fields: [renters_requests.renters_request_id, renters_requests.request_type, renters_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_requests.renters_request_id]]
          action_bindings: {renters_requests.renters_request_id: renters_request_id}
      - id: backdate_limit
        applies_to: [renters_policy_cancelled]
        kind: caller_fact
        condition: "A cancellation is backdated only to a move-out date shown on a lease termination or a new residence's move-in document, by no more than cancel_backdate_max_days before the date the signed request is received, and only when no claim on the policy has a loss date on or after that move-out date."
        evidence_fields: [renters_requests.renters_request_id, renters_requests.requested_effective_date, renters_requests.created_at, renters_claims.loss_date]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[renters_requests.renters_request_id]]
          action_bindings: {renters_requests.renters_request_id: renters_request_id}
    params:
      per_tier:
        RentGuard HO-4 Starter: {basis: "=insured_cancel_basis", retention_pct: "=short_rate_retention_pct", minimum_earned: "=minimum_earned_premium", backdate_days: "=cancel_backdate_max_days"}
        RentGuard HO-4 Essential: {basis: "=insured_cancel_basis", retention_pct: "=short_rate_retention_pct", minimum_earned: "=minimum_earned_premium", backdate_days: "=cancel_backdate_max_days"}
        RentGuard HO-4 Enhanced: {basis: "=insured_cancel_basis", retention_pct: "=short_rate_retention_pct", minimum_earned: "=minimum_earned_premium", backdate_days: "=cancel_backdate_max_days"}
        RentGuard HO-4 Premier: {basis: "=insured_cancel_basis", retention_pct: "=short_rate_retention_pct", minimum_earned: "=minimum_earned_premium", backdate_days: "=cancel_backdate_max_days"}
        RentGuard HO-4 Premier Plus: {basis: "=insured_cancel_basis", retention_pct: "=short_rate_retention_pct", minimum_earned: "=minimum_earned_premium", backdate_days: "=cancel_backdate_max_days"}
        RentGuard HO-4 Signature: {basis: "=insured_cancel_basis", retention_pct: "=short_rate_retention_pct", minimum_earned: "=minimum_earned_premium", backdate_days: "=cancel_backdate_max_days"}
    formula:
      short_rate_factor: "1 - short_rate_retention_pct / 100"

  - id: renters_reinstatement
    subject: [renters_policy_reinstated, renters_additional_premium]
    rule: >-
      Only a policy cancelled for nonpayment can be reinstated; a policy cancelled at the insured's request is never reinstated and must be rewritten as a new policy.
      The reinstatement request is made no later than the reinstatement window that starts on the cancellation date.
      The reinstatement window is counted in calendar days from the cancellation date recorded as closed_date, and a request on the last day of the window is on time.
      A policy is reinstated only while its reinstatements in the rolling 12 months are fewer than max_reinstatements_12m.
      The named insured has signed a statement of no loss covering the days since the cancellation date.
      Before reinstatement, payments received since the cancellation date must cover renters_msr_amount_due as of the request date plus the reinstatement fee.
      Reinstatement is without a lapse: the term is unchanged, the reinstatement fee is charged, and the cancellation credit is reversed by one renters_additional_premium entry with change_reason reinstatement_reversal for the same amount, referencing that credit and dated the reinstatement date.
    eligibility:
      - id: cancelled_for_nonpayment
        applies_to: [renters_policy_reinstated]
        kind: authorization
        condition: "Only a policy cancelled for nonpayment can be reinstated; a policy cancelled at the insured's request is never reinstated and must be rewritten as a new policy."
        evidence_fields: [renters_policies.status_reason, renters_policies.renters_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_policies.renters_policy_id]]
          action_bindings: {renters_policies.renters_policy_id: renters_policy_id}
      - id: reinstatement_window
        applies_to: [renters_policy_reinstated]
        kind: time
        condition: "The reinstatement request is made no later than the reinstatement window that starts on the cancellation date."
        evidence_fields: [renters_policies.closed_date, renters_policies.renters_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_policies.renters_policy_id]]
          action_bindings: {renters_policies.renters_policy_id: renters_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the cancellation date
          anchor_source: renters_policies.closed_date
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: "The reinstatement window is counted in calendar days from the cancellation date recorded as closed_date, and a request on the last day of the window is on time."
          boundary: inclusive
      - id: reinstatement_frequency
        applies_to: [renters_policy_reinstated]
        kind: authorization
        condition: "A policy is reinstated only while its reinstatements in the rolling 12 months are fewer than max_reinstatements_12m."
        evidence_fields: [renters_billing.renters_policy_id, renters_billing.change_reason, renters_billing.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_billing.renters_policy_id]]
          action_bindings: {renters_billing.renters_policy_id: renters_policy_id}
      - id: no_loss_statement
        applies_to: [renters_policy_reinstated]
        kind: authorization
        condition: "The named insured has signed a statement of no loss covering the days since the cancellation date."
        evidence_fields: [renters_requests.renters_request_id, renters_requests.request_type, renters_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_requests.renters_request_id]]
          action_bindings: {renters_requests.renters_request_id: renters_request_id}
    measures: [renters_msr_reinstatements_12m, renters_msr_amount_due]

  - id: renters_refunds_and_collections
    subject: [renters_refund_issued, renters_balance_written_off, renters_collection_referred]
    rule: >-
      A refund is issued only when the policy's premium balance is a credit of at least the refund minimum.
      The refund goes to the named insured by the method of the most recent payment: eft back to the bank account, card back to the card, and check by mailed check; a smaller credit stays on account while the policy is live and is written off at 0.00 once it has ended.
      Once a policy has ended, a debit balance at or below small_balance_writeoff_max is written off in one renters_balance_written_off entry and is never billed.
      A larger debit balance on an ended policy is billed on a final notice and, if still unpaid, referred to collections.
      An unpaid balance is referred to collections only from the collection referral date that follows the cancellation date.
      The collection referral date is the cancellation date plus collection_referral_days calendar days, and referral on that date is allowed.
      A balance is referred at most once; payments received after referral are still applied to the policy balance.
    eligibility:
      - id: refundable_credit
        applies_to: [renters_refund_issued]
        kind: authorization
        condition: "A refund is issued only when the policy's premium balance is a credit of at least the refund minimum."
        evidence_fields: [renters_policies.premium_balance, renters_policies.renters_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_policies.renters_policy_id]]
          action_bindings: {renters_policies.renters_policy_id: renters_policy_id}
      - id: ended_policy_only
        applies_to: [renters_balance_written_off, renters_collection_referred]
        kind: state
        condition: "Once a policy has ended, a debit balance at or below small_balance_writeoff_max is written off in one renters_balance_written_off entry and is never billed."
        evidence_fields: [renters_policies.status, renters_policies.renters_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_policies.renters_policy_id]]
          action_bindings: {renters_policies.renters_policy_id: renters_policy_id}
        state_contract:
          field: renters_policies.status
          allowed: [cancelled, expired]
      - id: referral_date
        applies_to: [renters_collection_referred]
        kind: time
        condition: "An unpaid balance is referred to collections only from the collection referral date that follows the cancellation date."
        evidence_fields: [renters_policies.closed_date, renters_policies.renters_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_policies.renters_policy_id]]
          action_bindings: {renters_policies.renters_policy_id: renters_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the cancellation date
          anchor_source: renters_policies.closed_date
          relation: not_before
          duration_source: variants.collection_referral_days
          unit: calendar_days
          counting_rule: "The collection referral date is the cancellation date plus collection_referral_days calendar days, and referral on that date is allowed."
          boundary: inclusive

  - id: renters_midterm_changes
    subject: [renters_relocated, renters_coverage_updated, renters_interested_party_changed, renters_additional_premium, renters_return_premium]
    rule: >-
      Midterm changes are made only while the policy is bound, in force or pending nonrenewal.
      A move to a new rental residence keeps the same policy: the new address must be in Ohio, a move out of state is handled as a named-insured cancellation, and territory_code is reassigned from the new ZIP code by territory_by_zip3.
      A relocation reported no later than relocation_report_days after the move-in date is re-rated from the move-in date; one reported later is re-rated from the report date.
      While moving, Coverage C applies at both the old and the new residence for moving_coverage_days after the move-in date.
      Coverage C, liability limit, deductible and co-insured changes must stay within the tier's options, take effect no earlier than the request date, and are re-rated under renters_premium_rating; a roommate is added only with the roommate's name exactly as on the lease.
      Every re-rating produces a new annual premium; the prorated change is the new annual premium minus the old annual premium, multiplied by the calendar days from the change effective date to the expiration date and divided by the calendar days in the term, rounded half-up to the cent.
      An increase is posted as renters_additional_premium and a decrease as renters_return_premium with credit_basis pro_rata, each with the change_reason of the change and dated the change effective date; when the prorated amount is below min_premium_change nothing is posted, but term_premium is still restated.
      Adding, replacing or removing the interested party has no premium effect.
    eligibility:
      - id: changeable_status
        applies_to: [renters_relocated, renters_coverage_updated]
        kind: state
        condition: "Midterm changes are made only while the policy is bound, in force or pending nonrenewal."
        evidence_fields: [renters_policies.status, renters_policies.renters_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_policies.renters_policy_id]]
          action_bindings: {renters_policies.renters_policy_id: renters_policy_id}
        state_contract:
          field: renters_policies.status
          allowed: [bound, in_force, pending_nonrenewal]

  - id: renters_renewal_and_nonrenewal
    subject: [renters_policy_renewed, renters_nonrenewal_noticed, renters_policy_expired, renters_lapse_renewed]
    rule: >-
      A policy in force and not under a notice of nonrenewal is renewed for twelve calendar months when renewal installment 1 is paid by the expiration date, at the annual premium rated under renters_premium_rating on the renewal offer date; otherwise it expires with status_reason renewal_not_paid.
      A late renewal payment is accepted only when it is received no later than the late-payment window that starts on the expiration date.
      The late-payment window is counted in calendar days from the expiration date, so the last day is the expiration date plus renewal_late_payment_days.
      A late renewal starts the new term on the day the payment is received, with no coverage between the expiration date and that day.
      The carrier nonrenews only when renters_msr_paid_claims is at or above paid_claims_nonrenewal_threshold on the notice date, and only with notice sent at least nonrenewal_notice_days before the expiration date; a policy expired under nonrenewal is never renewed late.
    eligibility:
      - id: late_payment_window
        applies_to: [renters_lapse_renewed]
        kind: time
        condition: "A late renewal payment is accepted only when it is received no later than the late-payment window that starts on the expiration date."
        evidence_fields: [renters_policies.expiration_date, renters_policies.renters_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_policies.renters_policy_id]]
          action_bindings: {renters_policies.renters_policy_id: renters_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the expiration date
          anchor_source: renters_policies.expiration_date
          relation: not_after
          duration_source: variants.renewal_late_payment_days
          unit: calendar_days
          counting_rule: "The late-payment window is counted in calendar days from the expiration date, so the last day is the expiration date plus renewal_late_payment_days."
          boundary: inclusive
    measures: [renters_msr_paid_claims]

  - id: renters_claim_settlement
    subject: [renters_claim_reported, renters_claim_payment, renters_holdback_withheld, renters_claim_denied, renters_claim_closed]
    rule: >-
      A claim is opened for each reported occurrence; the date of loss falls within a term during which the policy was in force, and property at a residence the insured moved from is covered only during the moving_coverage_days after the move-in date.
      One deductible applies per occurrence and is absorbed by personal_property first; loss of use has no deductible.
      Property away from the rental residence is covered up to off_premises_pct of Coverage C; jewelry theft, portable electronics, bicycles, money and landlord's furnishings are capped at their special limits; water backup is paid only up to water_backup_included_limit and denied with no_water_backup_coverage where that limit is 0; flood and surface water are denied with surface_water.
      On an actual_cash_value tier contents are paid as actual_cash_value_final, RC minus depreciation minus the deductible absorbed, with nothing withheld.
      On a replacement_cost tier, a class whose RC is at or below rc_no_holdback_threshold is paid replacement_cost_full; otherwise the first payment is acv_initial and the depreciation is withheld in one renters_holdback_withheld entry.
      A part whose RC does not exceed the deductible left for it is denied with below_deductible, and a claim is closed once every part is paid or denied and no holdback remains.
    eligibility: []
    formula:
      acv_payment: "replacement_cost_amount - depreciation_amount - deductible_applied"
      full_rc_payment: "replacement_cost_amount - deductible_applied"

  - id: renters_depreciation_recovery
    subject: [renters_holdback_released, renters_holdback_forfeited, renters_claim_payment_voided]
    rule: >-
      The holdback is released only when proof of replacement is received no later than the depreciation recovery period that starts on the date of the initial actual-cash-value payment.
      The depreciation recovery period is counted in calendar days from the date of the initial actual-cash-value payment, and proof received on the last day is on time.
      The release is the smaller of the remaining holdback and the documented replacement cost (capped at RC) minus the actual cash value, never below 0.00; partial releases are allowed, and any holdback left when the period ends is forfeited in one entry.
      A payment that has already been voided is never voided again; a voided payment is reissued as a new payment of the same amount.
    eligibility:
      - id: recovery_period
        applies_to: [renters_holdback_released]
        kind: time
        condition: "The holdback is released only when proof of replacement is received no later than the depreciation recovery period that starts on the date of the initial actual-cash-value payment."
        evidence_fields: [renters_claims.entry_date, renters_claims.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[renters_claims.source_entry_id]]
          action_bindings: {renters_claims.source_entry_id: source_entry_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the initial actual-cash-value payment
          anchor_source: renters_claims.entry_date
          relation: not_after
          duration_source: variants.depreciation_recovery_days
          unit: calendar_days
          counting_rule: "The depreciation recovery period is counted in calendar days from the date of the initial actual-cash-value payment, and proof received on the last day is on time."
          boundary: inclusive
    formula:
      release_amount: "max(0, min(depreciation_holdback, min(incurred_amount, replacement_cost_amount) - (replacement_cost_amount - depreciation_amount)))"
