# Policy charter — Larkspur Personal Umbrella, Larkspur Mutual Insurance Company.
category: umbrella
display_name: Larkspur Personal Umbrella Policy

binding:
  holding_table: umbrella_policies
  event_tables: [umbrella_billing, umbrella_underlying, umbrella_claims]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_balance}

lifecycle:
  states: [bound, in_force, pending_cancellation, cancelled, expired]
  transitions:
    - {from: bound, to: in_force, by: system, means: The umbrella reaches its effective date and coverage attaches.}
    - {from: bound, to: cancelled, by: user, means: The named insured signs a request to cancel before the umbrella takes effect.}
    - {from: in_force, to: pending_cancellation, by: agent, means: A notice of cancellation is issued for nonpayment or for underlying insurance that was not maintained or replaced.}
    - {from: pending_cancellation, to: in_force, by: agent, means: The cure demanded by the notice is received before the scheduled cancellation date and the notice is rescinded.}
    - {from: pending_cancellation, to: cancelled, by: system, means: The scheduled cancellation date arrives without the cure.}
    - {from: in_force, to: cancelled, by: user, means: The named insured signs a request to cancel the umbrella midterm.}
    - {from: in_force, to: expired, by: system, means: The term ends without renewal, either on a nonrenewal or because the renewal premium was not paid.}

accounts:
  - key: premium_balance
    unit: USD
    meaning: Umbrella premium and fees the named insured owes; positive means owed to the carrier, negative a credit.
  - key: indemnity_paid
    unit: USD
    meaning: Umbrella claim money issued per claim; issued payments raise it and voided payments lower it.

parameter_schema:
  umbrella_limit: Each-occurrence umbrella limit (USD).
  self_insured_retention: Retained amount the insured bears on a covered occurrence no underlying policy covers (USD).
  defense_outside_limit: Whether defense costs are paid in addition to the umbrella limit (boolean).
  um_uim_excess_limit: Excess uninsured/underinsured motorist limit (USD; 0 = not included).
  nonprofit_do_limit: Liability limit for the insured's service as an unpaid nonprofit director or officer (USD; 0 = excluded).
  worldwide_coverage: Whether occurrences anywhere in the world are covered (boolean).
  personal_injury_included: Whether libel, slander, false arrest and invasion of privacy are covered (boolean).
  required_home_liability: Minimum Coverage E a scheduled homeowners policy must carry (USD).
  required_condo_liability: Minimum personal liability a scheduled condominium policy must carry (USD).
  required_renters_liability: Minimum personal liability a scheduled renters policy must carry (USD).
  required_dwelling_liability: Minimum premises liability a scheduled landlord dwelling policy must carry (USD).
  required_auto_bi_per_person: Minimum bodily injury per person a scheduled auto policy must carry (USD).
  required_auto_bi_per_accident: Minimum bodily injury per accident a scheduled auto policy must carry (USD).
  required_auto_pd: Minimum property damage a scheduled auto policy must carry (USD).
  required_watercraft_liability: Minimum liability a scheduled watercraft policy must carry (USD).
  base_annual_premium: Annual premium for the named insured household with the included exposures (USD).
  included_vehicles: Vehicles included in the base premium (count).
  additional_vehicle_premium: Annual premium per vehicle beyond the included vehicles (USD).
  youthful_driver_age_under: Driver age under which a household driver is rated as youthful (years).
  youthful_driver_premium: Annual premium per youthful driver (USD).
  included_rental_units: Rental dwelling units included in the base premium (count).
  rental_unit_premium: Annual premium per rental dwelling unit beyond the included units (USD).
  watercraft_premium: Annual premium per scheduled watercraft (USD).
  max_vehicles: Most vehicles the umbrella may schedule (count).
  max_youthful_drivers: Most youthful drivers the umbrella may rate (count).
  max_rental_units: Most rental dwelling units the umbrella may schedule (count).
  max_watercraft: Most watercraft the umbrella may schedule (count).
  max_watercraft_length_ft: Longest watercraft the umbrella may schedule (feet).
  requires_larkspur_residence_policy: Whether the named insured's primary residence must be insured on a live Larkspur homeowners, condominium or renters policy (boolean).
  underlying_replacement_days: Days after an underlying policy lapses within which replacement underlying insurance must be scheduled (calendar days).
  underlying_cancel_notice_days: Days between a notice of cancellation for underlying not maintained and the scheduled cancellation date (calendar days).
  nonpayment_cancel_notice_days: Days between a nonpayment notice and the scheduled cancellation date (calendar days).
  nonpayment_notice_after_due_days: Days past an installment due date after which a nonpayment notice is issued (calendar days).
  late_fee: Late fee per late installment (USD; 0 = none).
  installment_fee_eft: Service charge on each monthly EFT installment after the first (USD).
  late_fee_grace_days: Days past an installment due date before a late fee is charged (calendar days).
  billing_plans_allowed: Billing plans the tier may use (list of annual | monthly_eft).
  insured_cancel_basis: How unearned premium is returned when the named insured cancels (enum pro_rata | short_rate).
  short_rate_retention_pct: Share of the pro-rata unearned premium kept on a short-rate cancellation (percent).
  minimum_earned_premium: Premium kept at minimum on a named-insured cancellation (USD).
  refund_minimum: Smallest credit balance refunded (USD).
  renewal_offer_lead_days: Days before expiration the renewal is billed (calendar days).
  min_premium_change: Prorated exposure-change premiums below this amount are neither billed nor credited (USD).
  exposure_report_days: Days after acquiring a vehicle, rental unit or watercraft or adding a youthful driver within which it must be reported (calendar days).
  max_liability_claims_5y: Liability claims paid by any carrier in the last 5 years at which the umbrella is not offered or renewed (count).
  liability_claims_lookback_years: Lookback for the liability claims count (years).
  nonrenewal_notice_days: Minimum advance notice of nonrenewal before expiration (calendar days).
  reinstatement_window_days: Days after a nonpayment cancellation within which reinstatement may be requested (calendar days).
  drop_down_for_uninsured_gap: Whether the umbrella drops down to pay the part of a loss an unmaintained underlying policy would have paid (boolean).
  golf_cart_liability_included: Whether liability from golf carts used on a course is covered (boolean).
  rental_units_per_property_max: Most dwelling units at one rental property the umbrella will extend over (count).

