events:
  - type: umbrella_policy_bound
    target: umbrella_policies
    mutation: create
    meaning: A personal umbrella is bound over the household's scheduled underlying policies with its rated exposures.
    grain: One row per umbrella contract.
    fields:
      policy_number: Umbrella policy number.
      variant_name: Official umbrella tier.
      vehicles: Household vehicles scheduled.
      youthful_drivers: Youthful drivers rated.
      rental_units: Rental dwelling units scheduled.
      watercraft: Watercraft scheduled.
      billing_plan: Billing plan chosen.
      bound_date: Date bound.
      effective_date: Start of the term.
      expiration_date: End of the term.
      term_premium: Annual premium of the term.
    triggers:
      - event: umbrella:umbrella_premium_billed
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date}
  - type: umbrella_policy_activated
    target: umbrella_policies
    mutation: {transition: {from: bound, to: in_force}}
    meaning: Coverage attaches on the effective date.
    grain: One row per transaction.
    fields: {effective_date: Effective date reached.}
    triggers: []
  - type: umbrella_cancellation_noticed
    target: umbrella_policies
    mutation: {transition: {from: in_force, to: pending_cancellation}}
    meaning: A notice of cancellation is issued with a scheduled cancellation date.
    grain: One row per transaction.
    fields:
      status_reason: nonpayment or underlying_not_maintained.
      pending_action_date: Scheduled cancellation date.
    triggers: []
  - type: umbrella_cancellation_rescinded
    target: umbrella_policies
    mutation: {transition: {from: pending_cancellation, to: in_force}}
    meaning: A pending cancellation is withdrawn after its cure.
    grain: One row per transaction.
    fields:
      status_reason: Reset to none.
      pending_action_date: Cleared.
    triggers: []
  - type: umbrella_policy_cancelled
    target: umbrella_policies
    mutation:
      transition:
        - {from: pending_cancellation, to: cancelled}
        - {from: in_force, to: cancelled}
        - {from: bound, to: cancelled}
    meaning: The umbrella ends before expiration on a carrier notice or at the named insured's signed request.
    grain: One row per transaction.
    fields:
      status_reason: Ground of the cancellation.
      closed_date: Date coverage ended.
    triggers:
      - event: umbrella:umbrella_return_premium
        map: {posted_date: closed_date}
  - type: umbrella_policy_expired
    target: umbrella_policies
    mutation: {transition: {from: in_force, to: expired}}
    meaning: The umbrella term ends without renewal.
    grain: One row per transaction.
    fields:
      status_reason: liability_claim_frequency or renewal_not_paid.
      closed_date: The expiration date.
    triggers: []
  - type: umbrella_policy_renewed
    target: umbrella_policies
    mutation: update
    meaning: The umbrella rolls into a new twelve-month term.
    grain: One row per transaction.
    fields:
      effective_date: Start of the new term.
      expiration_date: End of the new term.
      term_premium: Renewal term premium.
    triggers:
      - event: umbrella:umbrella_premium_billed
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date}
  - type: umbrella_exposure_updated
    target: umbrella_policies
    mutation: update
    meaning: A rated household exposure count changes midterm.
    grain: One row per transaction.
    fields:
      vehicles: Vehicles after the change.
      youthful_drivers: Youthful drivers after the change.
      rental_units: Rental units after the change.
      watercraft: Watercraft after the change.
    triggers: []
  - type: umbrella_premium_billed
    target: umbrella_billing
    meaning: One installment of the umbrella term premium is billed.
    grain: One row per installment of a term.
    distinguish_by: [term_effective_date, installment_number]
    fields:
      term_effective_date: Term billed.
      installment_number: Installment position (1 = first).
      due_date: Due date.
      amount: Installment amount.
      posted_date: Bill date.
    account: premium_balance
    direction: in
    triggers:
      - event: umbrella:umbrella_fee_assessed
        when: {installment_number: {not: 1}}
        map: {fee_code: installment_fee, term_effective_date: term_effective_date, installment_number: installment_number, posted_date: posted_date}
  - type: umbrella_fee_assessed
    target: umbrella_billing
    meaning: A late fee or monthly installment fee is charged.
    grain: One row per fee.
    distinguish_by: [fee_code, term_effective_date, installment_number]
    fields:
      fee_code: Fee charged.
      term_effective_date: Term of the fee.
      installment_number: Installment the fee relates to.
      amount: Fee amount.
      posted_date: Date charged.
    account: premium_balance
    direction: in
    triggers: []
  - type: umbrella_payment_received
    target: umbrella_billing
    meaning: A premium payment is received.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      payment_reference: Confirmation or check number.
      payment_method: Method of payment.
      amount: Amount paid.
      posted_date: Date received.
    account: premium_balance
    direction: out
    triggers: []
  - type: umbrella_additional_premium
    target: umbrella_billing
    meaning: Prorated additional premium for an added exposure is charged.
    grain: One row per exposure change that raises premium.
    distinguish_by: [exposure_change, effective_date]
    fields:
      exposure_change: Exposure added.
      acquired_date: Date the insured acquired the exposure, as stated.
      effective_date: Date coverage and premium for the exposure start.
      amount: Prorated additional premium.
      posted_date: Date charged.
    account: premium_balance
    direction: in
    triggers: []
  - type: umbrella_return_premium
    target: umbrella_billing
    meaning: Unearned premium is credited for a removed exposure or a cancellation.
    grain: One row per exposure removal or per cancellation.
    distinguish_by: [exposure_change, effective_date, credit_basis]
    fields:
      exposure_change: Exposure removed, or none for a cancellation.
      effective_date: Date of the removal or cancellation.
      credit_basis: pro_rata, short_rate or flat.
      amount: Premium credited.
      posted_date: Date credited.
    account: premium_balance
    direction: out
    triggers: []
  - type: umbrella_refund_issued
    target: umbrella_billing
    meaning: A credit balance is refunded to the named insured.
    grain: One row per refund.
    distinguish_by: [posted_date]
    fields:
      amount: Amount refunded.
      payment_method: Method of refund.
      posted_date: Date refunded.
    account: premium_balance
    direction: in
    triggers: []
  - type: umbrella_underlying_scheduled
    target: umbrella_underlying
    meaning: An underlying liability policy is added to the umbrella's schedule of underlying insurance.
    grain: One row per underlying policy scheduled.
    distinguish_by: [underlying_line, underlying_policy_number]
    fields:
      underlying_line: Line of the underlying policy.
      underlying_policy_number: Policy number of the underlying policy.
      underlying_carrier: Carrier of the underlying policy.
      underlying_liability_limit: Liability limit per occurrence or per accident.
      underlying_per_person_limit: Bodily injury per person limit (auto only).
      event_date: Date scheduled.
    triggers: []
  - type: umbrella_underlying_removed
    target: umbrella_underlying
    meaning: An underlying policy is removed from the schedule because the exposure it insured is gone.
    grain: One row per underlying policy removed.
    distinguish_by: [source_entry_id]
    fields:
      source_entry_id: The scheduling entry removed.
      underlying_line: Line removed.
      underlying_policy_number: Policy number removed.
      event_date: Date removed.
    triggers: []
  - type: umbrella_underlying_lapsed
    target: umbrella_underlying
    meaning: A scheduled underlying policy is reported ended (cancelled or expired) while its exposure remains.
    grain: One row per underlying policy lapse.
    distinguish_by: [underlying_line, underlying_policy_number, event_date]
    fields:
      underlying_line: Line of the lapsed policy.
      underlying_policy_number: Policy number of the lapsed policy.
      event_date: Date the underlying coverage ended.
    triggers: []
  - type: umbrella_claim_reported
    target: umbrella_claims
    meaning: A liability occurrence that may reach the umbrella is reported.
    grain: One row per umbrella claim.
    distinguish_by: [claim_number]
    fields:
      claim_number: Umbrella claim number.
      loss_date: Date of the occurrence.
      claim_kind: Kind of liability.
      underlying_line: Underlying line that responds first, or none.
      entry_date: Date reported.
    triggers: []
  - type: umbrella_claim_payment
    target: umbrella_claims
    meaning: Umbrella indemnity is paid above the underlying limit or the retained amount.
    grain: One row per umbrella payment.
    distinguish_by: [claim_number, entry_date, payee]
    fields:
      claim_number: Claim paid.
      loss_date: Date of the occurrence.
      claim_kind: Kind of liability.
      underlying_line: Underlying line that responded, or none.
      underlying_paid_amount: Amount borne below the umbrella by the underlying policy.
      retained_amount: Amount borne by the insured (retention or unmaintained-underlying gap).
      amount: Umbrella amount paid.
      payee: Who is paid.
      entry_date: Date paid.
    account: indemnity_paid
    direction: in
    triggers: []
  - type: umbrella_claim_payment_voided
    target: umbrella_claims
    meaning: An uncashed umbrella payment is voided.
    grain: One row per voided payment.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim of the void.
      source_entry_id: The payment voided.
      amount: Amount voided.
      entry_date: Date voided.
    account: indemnity_paid
    direction: out
    triggers: []

measures:
  - id: umbrella_msr_liability_claims_5y
    window: The liability_claims_lookback_years years ending on the evaluation date (bind date or renewal offer date).
    measure: Count of liability claims paid for the household by any carrier in the window, as disclosed on the application and on Larkspur claim records (home_claims, condo_claims, renters_claims and dwelling_claims entries with coverage_part liability and umbrella_claim_payment entries), each claim counted once.

policies:
  - id: umbrella_agg_multi_holding
    subject: [umbrella_policy_bound]
    rule: >-
      A household carries one Larkspur Personal Umbrella.
      The customer holds no other umbrella that is bound, in force or pending cancellation.
      A higher limit is obtained by rewriting the existing umbrella at renewal, never by stacking a second one.
    eligibility:
      - id: one_umbrella
        applies_to: [umbrella_policy_bound]
        kind: dedup
        condition: "The customer holds no other umbrella that is bound, in force or pending cancellation."
        evidence_fields: [umbrella_policies.customer_id, umbrella_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[umbrella_policies.customer_id]]
          action_bindings: {umbrella_policies.customer_id: customer_id}
        dedup_contract:
          table: umbrella_policies
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [bound, in_force, pending_cancellation]}
          distinct_fields: []
    params: {max_per_customer: 1}

  - id: umbrella_bind_eligibility
    subject: [umbrella_policy_bound, umbrella_underlying_scheduled, umbrella_policy_activated]
    rule: >-
      The primary residence of the named insured is insured on a live Larkspur HomeGuard, CondoGuard or RentGuard policy when the umbrella is bound.
      A live policy is one that is bound, in force, pending cancellation or pending nonrenewal.
      Every exposure the umbrella extends over must be scheduled as underlying with at least the tier's required limit for its line: required_home_liability, required_condo_liability, required_renters_liability, required_dwelling_liability, required_auto_bi_per_person with required_auto_bi_per_accident and required_auto_pd, or required_watercraft_liability.
      Rated exposures stay within max_vehicles, max_youthful_drivers, max_rental_units, max_watercraft and max_watercraft_length_ft, and no rental property may have more than rental_units_per_property_max units.
      umbrella_msr_liability_claims_5y below max_liability_claims_5y is required at binding.
      An underlying policy is scheduled only with its policy number, carrier and limits exactly as on its declarations page.
      A bound umbrella moves to in_force on its effective date.
    eligibility:
      - id: larkspur_residence_policy
        applies_to: [umbrella_policy_bound]
        kind: authorization
        condition: "The primary residence of the named insured is insured on a live Larkspur HomeGuard, CondoGuard or RentGuard policy when the umbrella is bound."
        evidence_fields: [home_policies.customer_id, home_policies.status, home_policies.occupancy, condo_policies.customer_id, condo_policies.status, renters_policies.customer_id, renters_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.customer_id], [condo_policies.customer_id], [renters_policies.customer_id]]
          action_bindings: {home_policies.customer_id: customer_id, condo_policies.customer_id: customer_id, renters_policies.customer_id: customer_id}
      - id: declarations_details
        applies_to: [umbrella_underlying_scheduled]
        kind: caller_fact
        condition: "An underlying policy is scheduled only with its policy number, carrier and limits exactly as on its declarations page."
        evidence_fields: [umbrella_underlying.underlying_policy_number, umbrella_underlying.underlying_carrier, umbrella_underlying.underlying_liability_limit]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[umbrella_underlying.underlying_policy_number]]
          action_bindings: {umbrella_underlying.underlying_policy_number: underlying_policy_number}
    measures: [umbrella_msr_liability_claims_5y]

  - id: umbrella_premium
    subject: [umbrella_premium_billed, umbrella_policy_renewed, umbrella_fee_assessed]
    rule: >-
      The term premium is base_annual_premium plus additional_vehicle_premium for each vehicle above included_vehicles, youthful_driver_premium for each youthful driver, rental_unit_premium for each rental unit above included_rental_units, and watercraft_premium for each watercraft.
      On the annual plan the whole premium is due on the effective date; on monthly_eft it is billed in twelve installments due monthly from the effective date, each later installment being the premium divided by twelve rounded half-up to the cent and installment 1 taking the difference, with installment_fee_eft charged on each installment after the first.
      Installments are billed only while the umbrella is bound, in force or pending cancellation.
      A late fee is charged once per installment still unpaid more than late_fee_grace_days calendar days after its due date, and never when the tier's late_fee is 0.00.
      Renewal installment 1 is billed renewal_offer_lead_days before expiration at the term premium recomputed on the exposures in force on that day.
    eligibility:
      - id: billable_status
        applies_to: [umbrella_premium_billed]
        kind: state
        condition: "Installments are billed only while the umbrella is bound, in force or pending cancellation."
        evidence_fields: [umbrella_policies.status, umbrella_policies.umbrella_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[umbrella_policies.umbrella_policy_id]]
          action_bindings: {umbrella_policies.umbrella_policy_id: umbrella_policy_id}
        state_contract:
          field: umbrella_policies.status
          allowed: [bound, in_force, pending_cancellation]
    formula:
      term_premium: "base_annual_premium + additional_vehicle_premium * max(0, vehicles - included_vehicles) + youthful_driver_premium * youthful_drivers + rental_unit_premium * max(0, rental_units - included_rental_units) + watercraft_premium * watercraft"

  - id: umbrella_exposure_changes
    subject: [umbrella_exposure_updated, umbrella_additional_premium, umbrella_return_premium]
    rule: >-
      A vehicle, youthful driver, rental unit or watercraft acquired during the term is covered from the day it is acquired only when it is reported no later than the exposure reporting period that starts on the date it was acquired.
      The exposure reporting period is counted in calendar days from the acquisition date, and a report on the last day is on time.
      An exposure reported late is covered only from the report date, and its premium is charged from the report date.
      The premium effect is the annual rate for the exposure multiplied by the calendar days from the exposure's effective date to the expiration date and divided by the calendar days in the term, rounded half-up to the cent; removals credit the same way pro rata from the removal date.
      Changes whose prorated amount is below min_premium_change are neither billed nor credited.
      An exposure that would take the umbrella above a tier maximum cannot be added midterm; the umbrella must move to a tier that allows it at renewal.
      Each added vehicle, rental unit or watercraft must be scheduled on qualifying underlying insurance under umbrella_bind_eligibility.
    eligibility:
      - id: exposure_reporting_period
        applies_to: [umbrella_exposure_updated]
        kind: time
        condition: "A vehicle, youthful driver, rental unit or watercraft acquired during the term is covered from the day it is acquired only when it is reported no later than the exposure reporting period that starts on the date it was acquired."
        evidence_fields: [umbrella_billing.acquired_date, umbrella_billing.exposure_change]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[umbrella_billing.exposure_change, umbrella_billing.acquired_date]]
          action_bindings: {umbrella_billing.exposure_change: exposure_change, umbrella_billing.acquired_date: acquired_date}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date it was acquired
          anchor_source: umbrella_billing.acquired_date
          relation: not_after
          duration_source: variants.exposure_report_days
          unit: calendar_days
          counting_rule: "The exposure reporting period is counted in calendar days from the acquisition date, and a report on the last day is on time."
          boundary: inclusive
    params:
      per_tier:
        Larkspur Umbrella 1M: {vehicle: "=additional_vehicle_premium", youthful_driver: "=youthful_driver_premium", rental_unit: "=rental_unit_premium", watercraft: "=watercraft_premium"}
        Larkspur Umbrella 2M: {vehicle: "=additional_vehicle_premium", youthful_driver: "=youthful_driver_premium", rental_unit: "=rental_unit_premium", watercraft: "=watercraft_premium"}
        Larkspur Umbrella 3M: {vehicle: "=additional_vehicle_premium", youthful_driver: "=youthful_driver_premium", rental_unit: "=rental_unit_premium", watercraft: "=watercraft_premium"}
        Larkspur Umbrella 4M: {vehicle: "=additional_vehicle_premium", youthful_driver: "=youthful_driver_premium", rental_unit: "=rental_unit_premium", watercraft: "=watercraft_premium"}
        Larkspur Umbrella 5M: {vehicle: "=additional_vehicle_premium", youthful_driver: "=youthful_driver_premium", rental_unit: "=rental_unit_premium", watercraft: "=watercraft_premium"}
        Larkspur Umbrella 10M: {vehicle: "=additional_vehicle_premium", youthful_driver: "=youthful_driver_premium", rental_unit: "=rental_unit_premium", watercraft: "=watercraft_premium"}

  - id: umbrella_underlying_maintenance
    subject: [umbrella_underlying_lapsed, umbrella_underlying_removed, umbrella_cancellation_noticed, umbrella_cancellation_rescinded]
    rule: >-
      The named insured must keep every scheduled underlying policy in force at no less than the required limit for as long as its exposure exists.
      When a scheduled underlying policy ends while its exposure remains, a lapse is recorded on the date coverage ended.
      An underlying policy is removed from the schedule only when the exposure it insured is gone (vehicle sold, property sold, watercraft sold), never merely because the policy ended.
      Replacement underlying insurance scheduled no later than the replacement period that starts on the underlying lapse date keeps the umbrella in force.
      The replacement period is counted in calendar days from the underlying lapse date, and scheduling on the last day is on time.
      After that period a notice of cancellation for underlying_not_maintained is issued with a scheduled cancellation date underlying_cancel_notice_days later, and it is rescinded when qualifying replacement underlying is scheduled before that date.
      A notice for nonpayment follows the same notice arithmetic with nonpayment_notice_after_due_days and nonpayment_cancel_notice_days and is rescinded by payment of the whole amount past due before the scheduled cancellation date.
    eligibility:
      - id: replacement_period
        applies_to: [umbrella_cancellation_noticed]
        kind: time
        condition: "Replacement underlying insurance scheduled no later than the replacement period that starts on the underlying lapse date keeps the umbrella in force."
        evidence_fields: [umbrella_underlying.event_date, umbrella_underlying.underlying_policy_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[umbrella_underlying.underlying_policy_number]]
          action_bindings: {umbrella_underlying.underlying_policy_number: underlying_policy_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: the underlying lapse date
          anchor_source: umbrella_underlying.event_date
          relation: not_before
          duration_source: variants.underlying_replacement_days
          unit: calendar_days
          counting_rule: "The replacement period is counted in calendar days from the underlying lapse date, and scheduling on the last day is on time."
          boundary: exclusive

  - id: umbrella_cancellation_and_refunds
    subject: [umbrella_policy_cancelled, umbrella_return_premium, umbrella_refund_issued]
    rule: >-
      The named insured cancels only by a signed request, effective no earlier than the date it is received.
      The cancellation is processed only on a request the named insured has signed.
      Unearned premium on a named-insured cancellation is pro rata or short rate by insured_cancel_basis, keeping short_rate_retention_pct on a short-rate cancellation and never less than minimum_earned_premium; a cancellation before the effective date is flat.
      A carrier cancellation credits pro rata in full.
      A credit balance of at least refund_minimum is refunded to the named insured by the method of the last payment.
    eligibility:
      - id: signed_request
        applies_to: [umbrella_policy_cancelled]
        kind: caller_fact
        condition: "The cancellation is processed only on a request the named insured has signed."
        evidence_fields: [umbrella_policies.umbrella_policy_id, umbrella_policies.status]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[umbrella_policies.umbrella_policy_id]]
          action_bindings: {umbrella_policies.umbrella_policy_id: umbrella_policy_id}

  - id: umbrella_claim_settlement
    subject: [umbrella_claim_reported, umbrella_claim_payment, umbrella_claim_payment_voided]
    rule: >-
      The umbrella pays covered damages above what the underlying policy that responds pays, up to umbrella_limit per occurrence, with defense costs outside the limit when defense_outside_limit is true.
      When a scheduled underlying policy covers the occurrence, the umbrella attaches only above that policy's required limit for its line, and the umbrella pays nothing until that amount is exhausted.
      When the occurrence is covered by the umbrella but by no underlying policy (for example personal injury or worldwide liability), the insured bears the self_insured_retention and the umbrella pays the rest.
      When a required underlying policy was not maintained, the umbrella pays only what it would have paid had the underlying been in force, and the insured bears the gap as retained_amount unless drop_down_for_uninsured_gap is true.
      Excess uninsured/underinsured motorist claims are paid only on tiers whose um_uim_excess_limit is above 0, and nonprofit director and officer claims only on tiers whose nonprofit_do_limit is above 0, each up to that limit.
      A payment that has already been voided is never voided again.
    eligibility:
      - id: voided_once
        applies_to: [umbrella_claim_payment_voided]
        kind: dedup
        condition: "A payment that has already been voided is never voided again."
        evidence_fields: [umbrella_claims.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[umbrella_claims.source_entry_id]]
          action_bindings: {umbrella_claims.source_entry_id: source_entry_id}
        dedup_contract:
          table: umbrella_claims
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [umbrella_claim_payment_voided]}
          distinct_fields: []
    params:
      per_tier:
        Larkspur Umbrella 1M: {limit: "=umbrella_limit", retention: "=self_insured_retention", um_uim: "=um_uim_excess_limit"}
        Larkspur Umbrella 2M: {limit: "=umbrella_limit", retention: "=self_insured_retention", um_uim: "=um_uim_excess_limit"}
        Larkspur Umbrella 3M: {limit: "=umbrella_limit", retention: "=self_insured_retention", um_uim: "=um_uim_excess_limit"}
        Larkspur Umbrella 4M: {limit: "=umbrella_limit", retention: "=self_insured_retention", um_uim: "=um_uim_excess_limit"}
        Larkspur Umbrella 5M: {limit: "=umbrella_limit", retention: "=self_insured_retention", um_uim: "=um_uim_excess_limit"}
        Larkspur Umbrella 10M: {limit: "=umbrella_limit", retention: "=self_insured_retention", um_uim: "=um_uim_excess_limit"}
    formula:
      umbrella_payment: "min(umbrella_limit, amount)"

  - id: umbrella_renewal
    subject: [umbrella_policy_renewed, umbrella_policy_expired, umbrella_payment_received]
    rule: >-
      A payment is applied oldest charge first and recorded with its confirmation or check number exactly as issued.
      An umbrella in force is renewed for twelve calendar months when renewal installment 1 is paid by the expiration date; otherwise it expires with status_reason renewal_not_paid.
      The umbrella is not renewed when umbrella_msr_liability_claims_5y has reached max_liability_claims_5y on the renewal offer date; the notice of nonrenewal must be sent at least nonrenewal_notice_days before expiration, and the umbrella then expires with status_reason liability_claim_frequency.
      An umbrella whose required residence policy is no longer live at the renewal offer date is not renewed.
    eligibility: []
    measures: [umbrella_msr_liability_claims_5y]
