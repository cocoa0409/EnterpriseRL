# Policy charter — Larkspur Valuables Floater (scheduled personal property), Larkspur Mutual Insurance Company.
category: valuables
display_name: Larkspur Valuables Floater

binding:
  holding_table: valuables_floaters
  event_tables: [valuables_items, valuables_billing, valuables_claims]
  status_field: status
  variant_field: variant_name
  quantity_fields: {scheduled_total: scheduled_value, premium_balance: premium_balance}

lifecycle:
  states: [bound, in_force, cancelled, expired]
  transitions:
    - {from: bound, to: in_force, by: system, means: The floater reaches its effective date.}
    - {from: bound, to: cancelled, by: user, means: The named insured signs a request to cancel before the floater takes effect.}
    - {from: in_force, to: cancelled, by: user, means: The named insured signs a request to cancel the floater midterm.}
    - {from: in_force, to: expired, by: system, means: The term ends without renewal.}

accounts:
  - key: scheduled_value
    unit: USD
    meaning: Total of the scheduled values of all items currently on the floater's schedule.
  - key: premium_balance
    unit: USD
    meaning: Floater premium owed; positive owed to the carrier, negative a credit.
  - key: indemnity_paid
    unit: USD
    meaning: Claim money issued on the floater per claim and item; issued payments raise it and voided payments lower it.

parameter_schema:
  jewelry_rate_per_100: Annual premium per 100 USD of scheduled jewelry (USD).
  watches_rate_per_100: Annual premium per 100 USD of scheduled watches (USD).
  fine_art_rate_per_100: Annual premium per 100 USD of scheduled fine art (USD).
  silverware_rate_per_100: Annual premium per 100 USD of scheduled silverware (USD).
  furs_rate_per_100: Annual premium per 100 USD of scheduled furs (USD).
  cameras_rate_per_100: Annual premium per 100 USD of scheduled cameras and optics (USD).
  musical_instruments_rate_per_100: Annual premium per 100 USD of scheduled musical instruments (USD).
  collectibles_rate_per_100: Annual premium per 100 USD of scheduled collectibles, stamps and coins (USD).
  wine_rate_per_100: Annual premium per 100 USD of scheduled wine (USD; 0 = class not offered).
  classes_offered: Item classes the tier schedules (list of item_class values).
  max_single_item: Largest scheduled value for one item (USD).
  max_schedule_total: Largest total scheduled value (USD).
  appraisal_required_over: Scheduled value above which a written appraisal or bill of sale is required (USD).
  appraisal_max_age_years: Oldest appraisal accepted when an item is scheduled (years).
  reappraisal_cycle_years: Years after which items above the appraisal threshold must be re-appraised at renewal (years).
  deductible: Deductible per occurrence (USD; 0 = none).
  blanket_jewelry_limit: Unscheduled jewelry covered in blanket (USD; 0 = none).
  blanket_per_item_limit: Most paid for one unscheduled item under the blanket (USD; 0 = none).
  blanket_rate_per_100: Annual premium per 100 USD of blanket jewelry limit (USD).
  newly_acquired_pct: Automatic coverage for newly acquired items of a scheduled class, as a percent of that class's scheduled total (percent).
  newly_acquired_cap: Most automatic coverage for newly acquired items per class (USD).
  newly_acquired_report_days: Days after acquisition within which a new item must be reported to stay covered (calendar days).
  mysterious_disappearance_covered: Whether unexplained disappearance of a scheduled item is covered (boolean).
  fine_art_breakage_covered: Whether breakage of fragile fine art is covered (boolean).
  fine_art_market_value_pct: Most paid for fine art as a percent of its scheduled value when its market value has risen (percent; 100 = agreed value only).
  pair_set_clause: Whether the loss of one item of a pair or set pays the reduction in value of the whole set (boolean).
  worldwide_coverage: Whether items are covered anywhere in the world (boolean).
  vault_credit_pct: Credit on jewelry and watch premium for items kept in a bank vault (percent).
  safe_credit_pct: Credit on jewelry and watch premium for a central-station alarm and home safe (percent).
  cash_settlement_pct_of_value: Cash settlement when the insured declines a replacement the carrier can buy at a discount (percent of the replacement cost to the carrier).
  claim_payment_basis: How a scheduled loss is settled (enum least_of_repair_replace_value | agreed_value).
  theft_police_report_hours: Hours after discovering a theft within which a police report must be made (hours).
  claim_report_days: Days after discovering a loss within which it must be reported (calendar days).
  minimum_annual_premium: Smallest annual floater premium (USD).
  billing_plans_allowed: Billing plans allowed (list of annual | quarterly).
  quarterly_installment_fee: Service charge on each quarterly installment after the first (USD).
  returned_payment_fee: Fee per returned payment (USD).
  min_premium_change: Midterm prorated premium changes below this amount are neither billed nor credited (USD).
  insured_cancel_basis: Unearned premium basis on a named-insured cancellation (enum pro_rata | short_rate).
  short_rate_retention_pct: Share of unearned premium kept on a short-rate cancellation (percent).
  minimum_earned_premium: Premium kept at minimum on a named-insured midterm cancellation (USD).
  refund_minimum: Smallest credit balance refunded (USD).
  renewal_offer_lead_days: Days before expiration the renewal is billed (calendar days).
  nonrenewal_notice_days: Minimum advance notice of nonrenewal (calendar days).
  theft_claims_nonrenewal_threshold: Paid theft or mysterious disappearance claims in 5 years at which the floater is nonrenewed (count).
  claims_lookback_years: Claims lookback window (years).
  removal_backdate_max_days: Most days an item removal may be backdated to a documented sale or gift date (calendar days).
  scheduled_value_rounding: Scheduled values are recorded rounded to this many USD (USD).

