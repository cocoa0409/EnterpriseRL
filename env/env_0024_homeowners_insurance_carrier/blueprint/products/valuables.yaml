events:
  - type: valuables_floater_bound
    target: valuables_floaters
    mutation: create
    meaning: A valuables floater is bound with its tier, blanket limit and billing plan; items are scheduled onto it separately.
    grain: One row per floater contract.
    fields:
      policy_number: Policy number.
      variant_name: Official tier name.
      blanket_limit: Blanket unscheduled jewelry limit.
      storage_credit: Vault or safe credit claimed.
      billing_plan: Billing plan.
      bound_date: Date bound.
      effective_date: Start of term.
      expiration_date: End of term.
      term_premium: Annual premium at binding.
    triggers:
      - event: valuables:valuables_premium_billed
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date, posted_date: bound_date}
  - type: valuables_floater_activated
    target: valuables_floaters
    mutation: {transition: {from: bound, to: in_force}}
    meaning: Coverage attaches on the effective date.
    grain: One row per transaction.
    fields: {effective_date: Effective date reached.}
    triggers: []
  - type: valuables_floater_cancelled
    target: valuables_floaters
    mutation:
      transition:
        - {from: in_force, to: cancelled}
        - {from: bound, to: cancelled}
    meaning: The floater ends at the named insured's signed request.
    grain: One row per transaction.
    fields:
      status_reason: insured_request.
      closed_date: Date coverage ended.
    triggers:
      - event: valuables:valuables_return_premium
        map: {change_reason: cancellation, effective_date: closed_date, posted_date: closed_date}
  - type: valuables_floater_expired
    target: valuables_floaters
    mutation: {transition: {from: in_force, to: expired}}
    meaning: The term ends without renewal.
    grain: One row per transaction.
    fields:
      status_reason: renewal_not_paid, theft_frequency or reappraisal_missing.
      closed_date: The expiration date.
    triggers: []
  - type: valuables_floater_renewed
    target: valuables_floaters
    mutation: update
    meaning: The floater renews for twelve months at the premium rated on the schedule in force.
    grain: One row per transaction.
    fields:
      effective_date: Start of the new term.
      expiration_date: End of the new term.
      term_premium: Renewal premium.
    triggers:
      - event: valuables:valuables_premium_billed
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date}
  - type: valuables_item_scheduled
    target: valuables_items
    meaning: An item is added to the schedule at its appraised or purchase value.
    grain: One row per item scheduled.
    distinguish_by: [item_description, item_class, effective_date]
    fields:
      item_description: Item description exactly as on the appraisal.
      item_class: Item class.
      appraisal_date: Date of the appraisal or bill of sale.
      amount: Scheduled value.
      acquired_date: Date acquired.
      effective_date: Date coverage on the schedule begins.
    account: scheduled_value
    direction: in
    triggers:
      - event: valuables:valuables_additional_premium
        map: {source_item_id: valuables_item_entry_id, change_reason: item_scheduled, effective_date: effective_date}
  - type: valuables_item_revalued
    target: valuables_items
    meaning: A scheduled item's value is raised on a new appraisal.
    grain: One row per revaluation of an item.
    distinguish_by: [source_entry_id, appraisal_date]
    fields:
      source_entry_id: Scheduling entry of the item.
      item_class: Item class.
      appraisal_date: Date of the new appraisal.
      amount: Increase in scheduled value.
      effective_date: Date the new value applies.
    account: scheduled_value
    direction: in
    triggers:
      - event: valuables:valuables_additional_premium
        map: {source_item_id: valuables_item_entry_id, change_reason: item_revalued, effective_date: effective_date}
  - type: valuables_item_removed
    target: valuables_items
    meaning: A scheduled item is removed after sale, gift or a paid total loss.
    grain: One row per item removal.
    distinguish_by: [source_entry_id]
    fields:
      source_entry_id: Scheduling entry of the item.
      item_class: Item class.
      removal_reason: Why the item leaves the schedule.
      amount: Scheduled value removed.
      effective_date: Date removed.
    account: scheduled_value
    direction: out
    triggers:
      - event: valuables:valuables_return_premium
        when: {removal_reason: [sold, gifted, no_longer_owned]}
        map: {source_item_id: valuables_item_entry_id, change_reason: item_removed, effective_date: effective_date}
  - type: valuables_premium_billed
    target: valuables_billing
    meaning: One installment of the floater premium is billed.
    grain: One row per installment of a term.
    distinguish_by: [term_effective_date, installment_number]
    fields:
      term_effective_date: Term billed.
      installment_number: Installment position.
      due_date: Due date.
      amount: Installment amount.
      posted_date: Bill date.
    account: premium_balance
    direction: in
    triggers: []
  - type: valuables_payment_received
    target: valuables_billing
    meaning: A premium payment is received.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      payment_reference: Confirmation or check number.
      payment_method: Method.
      amount: Amount.
      posted_date: Date received.
    account: premium_balance
    direction: out
    triggers: []
  - type: valuables_additional_premium
    target: valuables_billing
    meaning: Prorated premium for an item scheduled or revalued midterm is charged.
    grain: One row per item change.
    distinguish_by: [source_item_id, change_reason]
    fields:
      source_item_id: Item entry charged.
      change_reason: item_scheduled or item_revalued.
      effective_date: Date the change applies.
      amount: Prorated premium.
      posted_date: Date charged.
    account: premium_balance
    direction: in
    triggers: []
  - type: valuables_return_premium
    target: valuables_billing
    meaning: Unearned premium is credited for an item removed or on cancellation.
    grain: One row per item removal or cancellation.
    distinguish_by: [source_item_id, change_reason, effective_date]
    fields:
      source_item_id: Item entry credited; empty for a cancellation.
      change_reason: item_removed or cancellation.
      effective_date: Date of the removal or cancellation.
      amount: Amount credited.
      posted_date: Date credited.
    account: premium_balance
    direction: out
    triggers: []
  - type: valuables_refund_issued
    target: valuables_billing
    meaning: A credit balance is refunded.
    grain: One row per refund.
    distinguish_by: [posted_date]
    fields:
      payment_method: Method.
      amount: Amount refunded.
      posted_date: Date refunded.
    account: premium_balance
    direction: in
    triggers: []
  - type: valuables_claim_reported
    target: valuables_claims
    meaning: Loss of, or damage to, a scheduled or blanket item is reported.
    grain: One row per claim.
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number.
      loss_date: Date the loss was discovered.
      cause: Cause of loss.
      entry_date: Date reported.
    triggers: []
  - type: valuables_claim_payment
    target: valuables_claims
    meaning: Claim money is issued for one item.
    grain: One row per payment for one item.
    distinguish_by: [claim_number, item_entry_id, payment_type]
    fields:
      claim_number: Claim paid.
      item_entry_id: Scheduling entry of the item, empty for a blanket item.
      payment_type: repair, replacement, cash or pair_set.
      amount: Amount paid.
      entry_date: Date issued.
    account: indemnity_paid
    direction: in
    triggers:
      - event: valuables:valuables_item_removed
        when: {payment_type: [replacement, cash]}
        map: {source_entry_id: item_entry_id, removal_reason: total_loss_paid, effective_date: entry_date}
  - type: valuables_claim_payment_voided
    target: valuables_claims
    meaning: An uncashed claim payment is voided.
    grain: One row per voided payment.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim.
      source_entry_id: Payment voided.
      amount: Amount voided.
      entry_date: Date voided.
    account: indemnity_paid
    direction: out
    triggers: []
  - type: valuables_claim_denied
    target: valuables_claims
    meaning: A claim for an item is denied with a controlled reason.
    grain: One row per item denied.
    distinguish_by: [claim_number, item_entry_id, denial_reason]
    fields:
      claim_number: Claim.
      item_entry_id: Item denied, empty for a blanket item.
      denial_reason: Reason.
      entry_date: Date of the denial letter.
    triggers: []

measures:
  - id: valuables_msr_class_total
    window: As of the evaluation date.
    measure: For one item class, the sum of valuables_item_scheduled and valuables_item_revalued amounts minus valuables_item_removed amounts on the floater.
  - id: valuables_msr_theft_claims
    window: The claims_lookback_years years ending on the renewal offer date.
    measure: Count of distinct claim_number values on the floater with cause theft or mysterious_disappearance and at least one unvoided valuables_claim_payment.

policies:
  - id: valuables_agg_multi_holding
    subject: [valuables_floater_bound]
    rule: >-
      A customer carries one valuables floater; all items are scheduled on it.
      The customer holds no other valuables floater that is bound or in force, and the customer's primary residence is insured on a live Larkspur HomeGuard, CondoGuard or RentGuard policy.
    eligibility:
      - id: one_floater
        applies_to: [valuables_floater_bound]
        kind: dedup
        condition: "The customer holds no other valuables floater that is bound or in force, and the customer's primary residence is insured on a live Larkspur HomeGuard, CondoGuard or RentGuard policy."
        evidence_fields: [valuables_floaters.customer_id, valuables_floaters.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[valuables_floaters.customer_id]]
          action_bindings: {valuables_floaters.customer_id: customer_id}
        dedup_contract:
          table: valuables_floaters
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [bound, in_force]}
          distinct_fields: []
    params: {max_per_customer: 1}

  - id: valuables_bind_and_renewal
    subject: [valuables_floater_activated, valuables_floater_renewed, valuables_floater_expired]
    rule: >-
      A bound floater moves to in_force on its effective date, and the term runs twelve calendar months.
      It renews when renewal installment 1 is paid by the expiration date, at the premium rated on the schedule in force on the renewal offer date; otherwise it expires with status_reason renewal_not_paid.
      Items above appraisal_required_over whose appraisal is older than reappraisal_cycle_years on the renewal offer date must be re-appraised before renewal; if not, the floater is nonrenewed with reappraisal_missing on nonrenewal_notice_days notice.
      The floater is also nonrenewed with theft_frequency when valuables_msr_theft_claims reaches theft_claims_nonrenewal_threshold.
    eligibility: []
    measures: [valuables_msr_theft_claims]

  - id: valuables_item_scheduling
    subject: [valuables_item_scheduled, valuables_item_revalued]
    rule: >-
      An item is scheduled only in a class listed in classes_offered, for no more than max_single_item, and only while the schedule total stays within max_schedule_total; the scheduled value is the appraised or purchase value rounded to scheduled_value_rounding.
      Items are scheduled only while the floater is bound or in force.
      An item valued above appraisal_required_over is scheduled only on a written appraisal or bill of sale dated no earlier than the appraisal age limit that ends on the scheduling date.
      The appraisal age limit is counted in whole calendar years back from the scheduling date, and an appraisal dated exactly appraisal_max_age_years earlier is still accepted.
      A newly acquired item of a class already scheduled is covered automatically from its acquisition date up to newly_acquired_pct of that class's total (never above newly_acquired_cap) when it is reported within newly_acquired_report_days, and its premium is then charged from the acquisition date; reported later, it is covered and charged only from the report date.
      The same item is never scheduled twice; a higher value is recorded by revaluation on a new appraisal, and a revaluation never lowers a value (a lower value is a removal and a new scheduling).
    eligibility:
      - id: schedulable_status
        applies_to: [valuables_item_scheduled, valuables_item_revalued]
        kind: state
        condition: "Items are scheduled only while the floater is bound or in force."
        evidence_fields: [valuables_floaters.status, valuables_floaters.valuables_floater_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[valuables_floaters.valuables_floater_id]]
          action_bindings: {valuables_floaters.valuables_floater_id: valuables_floater_id}
        state_contract:
          field: valuables_floaters.status
          allowed: [bound, in_force]
      - id: appraisal_age
        applies_to: [valuables_item_scheduled]
        kind: caller_fact
        condition: "An item valued above appraisal_required_over is scheduled only on a written appraisal or bill of sale dated no earlier than the appraisal age limit that ends on the scheduling date."
        evidence_fields: [valuables_items.appraisal_date, valuables_items.item_description]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[valuables_items.item_description]]
          action_bindings: {valuables_items.item_description: item_description}
    measures: [valuables_msr_class_total]

  - id: valuables_premium_rating
    subject: [valuables_floater_bound, valuables_additional_premium, valuables_return_premium, valuables_premium_billed]
    rule: >-
      The annual premium is, for each class, the class total divided by 100 and multiplied by the class rate, with vault_credit_pct or safe_credit_pct (whichever storage_credit records, never both) taken off the jewelry and watches premium, plus the blanket_limit divided by 100 times blanket_rate_per_100, never less than minimum_annual_premium.
      An item scheduled, revalued or removed midterm changes the premium by its value divided by 100 times its class rate (after the storage credit), prorated over the calendar days from its effective date to the expiration date and divided by the calendar days in the term, rounded half-up to the cent; below min_premium_change nothing is posted.
      A removal after a paid total loss returns no premium, because the premium for that item is fully earned.
      On the quarterly plan the term premium is billed in four installments three calendar months apart, each later installment being a quarter rounded half-up to the cent, with quarterly_installment_fee on each after the first.
    eligibility: []
    formula:
      item_annual_premium: "amount / 100 * jewelry_rate_per_100"

  - id: valuables_item_removal
    subject: [valuables_item_removed]
    rule: >-
      An item is removed when the named insured has sold or given it away or no longer owns it, or when its total loss has been paid.
      A removal is effective no earlier than the date the named insured requests it, except that it may be backdated to a documented sale or gift date by no more than removal_backdate_max_days.
      An item that has already been removed is never removed again.
    eligibility:
      - id: removed_once
        applies_to: [valuables_item_removed]
        kind: dedup
        condition: "An item that has already been removed is never removed again."
        evidence_fields: [valuables_items.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[valuables_items.source_entry_id]]
          action_bindings: {valuables_items.source_entry_id: source_entry_id}
        dedup_contract:
          table: valuables_items
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [valuables_item_removed]}
          distinct_fields: []

  - id: valuables_billing_and_cancellation
    subject: [valuables_payment_received, valuables_refund_issued, valuables_floater_cancelled, valuables_return_premium]
    rule: >-
      Payments apply oldest charge first and are recorded with their confirmation or check number exactly as issued; a credit of at least refund_minimum is refunded by the method of the last payment.
      The floater is cancelled only on a request the named insured has signed, effective no earlier than the date the request is received.
      The cancellation credit is term_premium plus the prorated premium of midterm item changes, taken pro rata from the cancellation date to the expiration date and rounded half-up to the cent, less short_rate_retention_pct under a short-rate basis, less the term's installments not yet billed, and reduced so that at least minimum_earned_premium is kept.
    eligibility:
      - id: signed_request
        applies_to: [valuables_floater_cancelled]
        kind: caller_fact
        condition: "The floater is cancelled only on a request the named insured has signed, effective no earlier than the date the request is received."
        evidence_fields: [valuables_floaters.valuables_floater_id, valuables_floaters.status]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[valuables_floaters.valuables_floater_id]]
          action_bindings: {valuables_floaters.valuables_floater_id: valuables_floater_id}

  - id: valuables_claim_settlement
    subject: [valuables_claim_reported, valuables_claim_payment, valuables_claim_denied, valuables_claim_payment_voided]
    rule: >-
      A loss is covered only when it is reported no later than the claim reporting period that starts on the date the loss was discovered.
      The claim reporting period is counted in calendar days from the discovery date, and a report on the last day is on time.
      A theft or mysterious disappearance additionally needs a police report made within theft_police_report_hours of discovery, or it is denied with no_police_report.
      Under least_of_repair_replace_value the carrier pays the least of the repair cost, the cost to replace with a like item, and the scheduled value; under agreed_value a total loss pays the scheduled value; fine art may pay up to fine_art_market_value_pct of its scheduled value on proof of a higher market value.
      A deductible applies per occurrence where the tier has one; breakage of fine art is paid only where fine_art_breakage_covered is true; a blanket item pays up to blanket_per_item_limit.
      Under the pair_set_clause the loss of one item of a pair or set pays the loss in value of the set, never its full value when the rest remains.
      A replacement or cash payment for a total loss removes the item from the schedule; a payment that has already been voided is never voided again.
    eligibility:
      - id: reporting_period
        applies_to: [valuables_claim_reported]
        kind: time
        condition: "A loss is covered only when it is reported no later than the claim reporting period that starts on the date the loss was discovered."
        evidence_fields: [valuables_claims.loss_date, valuables_claims.claim_number]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[valuables_claims.claim_number]]
          action_bindings: {valuables_claims.claim_number: claim_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the loss was discovered
          anchor_source: valuables_claims.loss_date
          relation: not_after
          duration_source: variants.claim_report_days
          unit: calendar_days
          counting_rule: "The claim reporting period is counted in calendar days from the discovery date, and a report on the last day is on time."
          boundary: inclusive
    params:
      per_tier:
        Valuables Floater Classic: {basis: "=claim_payment_basis", deductible: "=deductible", fine_art_cap_pct: "=fine_art_market_value_pct"}
        Valuables Floater Select: {basis: "=claim_payment_basis", deductible: "=deductible", fine_art_cap_pct: "=fine_art_market_value_pct"}
        Valuables Floater Preferred: {basis: "=claim_payment_basis", deductible: "=deductible", fine_art_cap_pct: "=fine_art_market_value_pct"}
        Valuables Floater Prestige: {basis: "=claim_payment_basis", deductible: "=deductible", fine_art_cap_pct: "=fine_art_market_value_pct"}
        Valuables Floater Collector: {basis: "=claim_payment_basis", deductible: "=deductible", fine_art_cap_pct: "=fine_art_market_value_pct"}
        Valuables Floater Private Client: {basis: "=claim_payment_basis", deductible: "=deductible", fine_art_cap_pct: "=fine_art_market_value_pct"}

  - id: valuables_storage_credit
    subject: [valuables_floater_bound, valuables_claim_payment, valuables_claim_denied]
    rule: >-
      A vault credit is granted only for jewelry and watches kept in a bank safe-deposit box, and a safe credit only where the residence has a central-station alarm and a home safe; the floater records one of vault, safe or none in storage_credit and never both credits.
      On a tier whose vault_credit_pct or safe_credit_pct is 0 the matching credit is never recorded.
      A vault-rated item that is out of the vault when lost is paid only when the named insured told the carrier of its removal before the loss, in which case the premium for the days out of the vault is charged at the full class rate; otherwise the loss is paid at vault_credit_pct less than the amount otherwise payable.
      A safe credit carries no such condition.
    eligibility: []
