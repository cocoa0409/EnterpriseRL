        The standard full-year liability step charge is the tier's liability step premium for each step raised, rounded half-up to the cent.
        The liability step charge for the rest of the term is the full-year liability step charge multiplied by the calendar days from the day the raise takes effect to the expiration date and divided by the calendar days in the term, rounded half-up to the cent.
      params: [liability_step_annual_premium, liability_limit_options]
    inputs:
