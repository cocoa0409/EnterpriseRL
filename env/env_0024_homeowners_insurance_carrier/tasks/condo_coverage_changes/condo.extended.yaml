        evidence: [date]
        cross_difficulty: null
      - id: liability_loss_load
        effect: parameter
        decides: liability_loss_mult
        bindings: [medpay_payments, liability_payments, liability_loss_mult]
        ladder:
          - when: "two or more medical payments or personal liability claim payments issued on the policy fewer than 60 whole months ago"
            value: "K('liability_loss_two_mult') = 1.50"
          - when: "exactly one such payment"
            value: "K('liability_loss_one_mult') = 1.25"
          - when: "otherwise (no such payment)"
            value: "K('standard_mult') = 1.00"
        baseline:
