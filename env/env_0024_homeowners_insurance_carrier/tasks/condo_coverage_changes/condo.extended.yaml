        - {table: condo_billing, aggregate: count, field: condo_billing_id, filters: {event_type: condo_premium_billed, term_effective_date: current term}}
      cross_category: [home]

  - id: condo_ext_coverage_a_realignment_charge
    base_policy_refs: [condo_endorsements, condo_association_changes, condo_cancellation_and_reinstatement, condo_bind_eligibility]
    overwrite:
      - base_policy: condo_endorsements
        superseded_clause: >-
          A midterm change takes effect no earlier than the date the named insured requests it and before the expiration date.
        replaced_by: >-
          A Coverage A realignment takes effect on the day the named insured requests it, and that day is before the expiration date.
      - base_policy: condo_association_changes
        superseded_clause: >-
          When the new master_policy_type raises the tier's Coverage A minimum above the unit's coverage_a_limit, Coverage A must be raised by a coverage_a_change endorsement to at least the new minimum.
        replaced_by: >-
          When the master policy type on file makes the tier's Coverage A minimum higher than the Coverage A on the declarations, a Coverage A realignment raises Coverage A to exactly that minimum, and an owner who wants more than the minimum asks for a separate Coverage A change.
      - base_policy: condo_endorsements
        superseded_clause: >-
          coverage_a_rate_per_1000 or personal_property_rate_per_1000 per 1,000 USD of change
        replaced_by: >-
          The Coverage A realignment rate is adjusted by three multipliers that are first multiplied together and then applied once to the tier's Coverage A rate per 1,000 USD, before the full-year realignment charge is rounded; none of them acts on the result of another.
      - base_policy: condo_endorsements
        superseded_clause: >-
          The prorated premium is the annual change multiplied by the calendar days from the change effective date to the expiration date and divided by the calendar days in the term, rounded half-up to the cent
        replaced_by: >-
          The share of the full-year realignment charge billed for the rest of the term depends on how the term is billed.
    trigger: on_request
    subject: [condo_endorsement_added, condo_coverage_updated, condo_additional_premium]
    computes: prorated_premium
    target_tool: raise_coverage_a_minimum_ec3d8a44
    params:
      standard_mult: 1.00
      per_thousand: 1000
      flood_companion_months: 36
      flood_long_mult: 0.93
      flood_new_mult: 0.97
      claims_free_long_months: 60
      claims_free_mid_months: 36
      claims_free_long_mult: 0.90
      claims_free_mid_mult: 0.95
      payment_window_months: 12
      returned_draft_mult: 1.05
      eft_clean_mult: 0.97
      installments_two_pay: 2
      installments_quarterly: 4
      installments_monthly: 12
      months_per_year: 12
    rule: >-
      When the master policy type on file makes the tier's Coverage A minimum higher than the Coverage A on the declarations, a Coverage A realignment raises Coverage A to exactly that minimum, and an owner who wants more than the minimum asks for a separate Coverage A change.
      The tier's Coverage A minimum is its bare-walls, single-entity or all-in minimum according to the master policy type shown on the declarations.
      A Coverage A realignment takes effect on the day the named insured requests it, and that day is before the expiration date.
      The standard full-year realignment charge is the tier's Coverage A rate per 1,000 USD multiplied by the number of thousands of USD by which the new Coverage A exceeds the Coverage A on the declarations before the change, rounded half-up to the cent.
      The realignment charge for the rest of the term is the full-year realignment charge multiplied by the calendar days from the day the realignment takes effect to the expiration date and divided by the calendar days in the term, rounded half-up to the cent.
      The Coverage A realignment rate is adjusted by three multipliers that are first multiplied together and then applied once to the tier's Coverage A rate per 1,000 USD, before the full-year realignment charge is rounded; none of them acts on the result of another.
      The flood companion multiplier on the realignment rate is 0.93 when the customer holds an in-force FloodGuard policy written on a condominium unit whose first inception date is 36 or more whole months before the day of the realignment, 0.97 when the customer holds such an in-force FloodGuard condominium-unit policy with a first inception date fewer than 36 whole months before that day, and 1.00 when the customer holds no in-force FloodGuard policy written on a condominium unit.
      The claims-free multiplier on the realignment rate measures the whole months from the date of the latest claim payment issued on the CondoGuard policy (or, when none was ever issued, from the policy's first inception date) to the day of the realignment: it is 0.90 for 60 or more whole months, 0.95 for 36 to 59 whole months, and 1.00 for fewer than 36 whole months.
      The payment-record multiplier on the realignment rate is 1.05 when a payment on the policy was returned unpaid fewer than 12 whole months before the day of the realignment, 0.97 when the term is billed on the monthly EFT plan and no payment was returned within that time, and 1.00 when the term is on any other plan and no payment was returned within that time.
      The share of the full-year realignment charge billed for the rest of the term depends on how the term is billed.
      On a monthly EFT plan with at least one installment of the current term not yet billed, the realignment share is the number of the current term's monthly installments not yet billed divided by twelve, where the installments billed are the premium installments posted with the current term's effective date.
      On a two-pay or quarterly plan with at least one installment of the current term not yet billed, the realignment share is the whole calendar months from the day the realignment takes effect to the expiration date, a part month dropped, divided by twelve.
      On any other plan, or when every installment of the current term has already been billed, the realignment share is the calendar days from the day the realignment takes effect to the expiration date divided by the calendar days in the term.
      The realignment charge for the rest of the term is then the full-year realignment charge multiplied by the realignment share, rounded half-up to the cent; the full-year figure is rounded first and the share is applied to the rounded figure. Each rounding of the realignment charge to the cent is half-up in exact decimal: a figure lying exactly halfway between two cents goes to the higher cent.
    prerequisite: []
    cross_category:
      - category: flood
        as: branch
        reads: [status, occupancy, original_effective_date]
        note: The flood companion multiplier reads whether the customer holds an in-force FloodGuard condominium-unit policy and how long ago it first incepted.
    compute:
      - new_minimum: "P('min_coverage_a_bare_walls') if F('master_policy_type') == 'bare_walls' else (P('min_coverage_a_single_entity') if F('master_policy_type') == 'single_entity' else P('min_coverage_a_all_in'))"
      - increase_thousands: "MX(0, new_minimum - F('coverage_a_limit')) / K('per_thousand')"
      - flood_unit_cover: "CFIELD('flood', 'occupancy', status='in_force') == 'condo_unit'"
      - flood_tenure_months: "MONTHS(CFIELD('flood', 'original_effective_date', status='in_force') or NOW, NOW)"
      - flood_mult: "K('flood_long_mult') if (flood_unit_cover and flood_tenure_months >= K('flood_companion_months')) else (K('flood_new_mult') if (flood_unit_cover and flood_tenure_months < K('flood_companion_months')) else K('standard_mult'))"
      - claims_free_months: "MONTHS(LATEST('condo_claims', 'entry_date', date_field='entry_date', event_type='condo_claim_payment') or F('original_effective_date'), NOW)"
      - claims_free_mult: "K('claims_free_long_mult') if claims_free_months >= K('claims_free_long_months') else (K('claims_free_mid_mult') if claims_free_months >= K('claims_free_mid_months') else K('standard_mult'))"
      - returned_12: "COUNT('condo_billing', within_months=K('payment_window_months'), date_field='posted_date', event_type='condo_payment_returned')"
      - payment_mult: "K('returned_draft_mult') if returned_12 >= 1 else (K('eft_clean_mult') if F('billing_plan') == 'monthly_eft' else K('standard_mult'))"
      - plan_installments: "K('installments_quarterly') if F('billing_plan') == 'quarterly' else (K('installments_two_pay') if F('billing_plan') == 'two_pay' else K('installments_monthly'))"
      - term_installments_billed: "COUNT('condo_billing', event_type='condo_premium_billed', term_effective_date=F('effective_date'))"
      - unbilled_installments: "MX(0, plan_installments - term_installments_billed)"
      - days_left: "DAYS(NOW, F('expiration_date'))"
      - term_days: "DAYS(F('effective_date'), F('expiration_date'))"
      - realignment_share: "unbilled_installments / K('months_per_year') if (F('billing_plan') == 'monthly_eft' and unbilled_installments >= 1) else (MONTHS(NOW, F('expiration_date')) / K('months_per_year') if ((F('billing_plan') == 'quarterly' or F('billing_plan') == 'two_pay') and unbilled_installments >= 1) else days_left / term_days)"
      - adjusted_rate: "P('coverage_a_rate_per_1000') * flood_mult * claims_free_mult * payment_mult"
      - annual_change: "int(round((adjusted_rate * increase_thousands) * 100, 6) + 0.5) / 100"
      - result: "int(round((annual_change * realignment_share) * 100, 6) + 0.5) / 100"
    compute_basis:
      new_minimum: "The tier's Coverage A minimum is its bare-walls, single-entity or all-in minimum according to the master policy type shown on the declarations."
      increase_thousands: "The standard full-year realignment charge is the tier's Coverage A rate per 1,000 USD multiplied by the number of thousands of USD by which the new Coverage A exceeds the Coverage A on the declarations before the change, rounded half-up to the cent."
      flood_unit_cover: "The flood companion multiplier on the realignment rate is 0.93 when the customer holds an in-force FloodGuard policy written on a condominium unit whose first inception date is 36 or more whole months before the day of the realignment, 0.97 when the customer holds such an in-force FloodGuard condominium-unit policy with a first inception date fewer than 36 whole months before that day, and 1.00 when the customer holds no in-force FloodGuard policy written on a condominium unit."
      flood_tenure_months: "The flood companion multiplier on the realignment rate is 0.93 when the customer holds an in-force FloodGuard policy written on a condominium unit whose first inception date is 36 or more whole months before the day of the realignment, 0.97 when the customer holds such an in-force FloodGuard condominium-unit policy with a first inception date fewer than 36 whole months before that day, and 1.00 when the customer holds no in-force FloodGuard policy written on a condominium unit."
      flood_mult: "The flood companion multiplier on the realignment rate is 0.93 when the customer holds an in-force FloodGuard policy written on a condominium unit whose first inception date is 36 or more whole months before the day of the realignment, 0.97 when the customer holds such an in-force FloodGuard condominium-unit policy with a first inception date fewer than 36 whole months before that day, and 1.00 when the customer holds no in-force FloodGuard policy written on a condominium unit."
      claims_free_months: "The claims-free multiplier on the realignment rate measures the whole months from the date of the latest claim payment issued on the CondoGuard policy (or, when none was ever issued, from the policy's first inception date) to the day of the realignment: it is 0.90 for 60 or more whole months, 0.95 for 36 to 59 whole months, and 1.00 for fewer than 36 whole months."
      claims_free_mult: "The claims-free multiplier on the realignment rate measures the whole months from the date of the latest claim payment issued on the CondoGuard policy (or, when none was ever issued, from the policy's first inception date) to the day of the realignment: it is 0.90 for 60 or more whole months, 0.95 for 36 to 59 whole months, and 1.00 for fewer than 36 whole months."
      returned_12: "The payment-record multiplier on the realignment rate is 1.05 when a payment on the policy was returned unpaid fewer than 12 whole months before the day of the realignment, 0.97 when the term is billed on the monthly EFT plan and no payment was returned within that time, and 1.00 when the term is on any other plan and no payment was returned within that time."
      payment_mult: "The payment-record multiplier on the realignment rate is 1.05 when a payment on the policy was returned unpaid fewer than 12 whole months before the day of the realignment, 0.97 when the term is billed on the monthly EFT plan and no payment was returned within that time, and 1.00 when the term is on any other plan and no payment was returned within that time."
      plan_installments: "On a monthly EFT plan with at least one installment of the current term not yet billed, the realignment share is the number of the current term's monthly installments not yet billed divided by twelve, where the installments billed are the premium installments posted with the current term's effective date."
      term_installments_billed: "where the installments billed are the premium installments posted with the current term's effective date."
      unbilled_installments: "On a monthly EFT plan with at least one installment of the current term not yet billed, the realignment share is the number of the current term's monthly installments not yet billed divided by twelve, where the installments billed are the premium installments posted with the current term's effective date."
      days_left: "The realignment charge for the rest of the term is the full-year realignment charge multiplied by the calendar days from the day the realignment takes effect to the expiration date and divided by the calendar days in the term, rounded half-up to the cent."
      term_days: "The realignment charge for the rest of the term is the full-year realignment charge multiplied by the calendar days from the day the realignment takes effect to the expiration date and divided by the calendar days in the term, rounded half-up to the cent."
      realignment_share: "On a monthly EFT plan with at least one installment of the current term not yet billed, the realignment share is the number of the current term's monthly installments not yet billed divided by twelve, where the installments billed are the premium installments posted with the current term's effective date. On a two-pay or quarterly plan with at least one installment of the current term not yet billed, the realignment share is the whole calendar months from the day the realignment takes effect to the expiration date, a part month dropped, divided by twelve. On any other plan, or when every installment of the current term has already been billed, the realignment share is the calendar days from the day the realignment takes effect to the expiration date divided by the calendar days in the term."
      adjusted_rate: "The Coverage A realignment rate is adjusted by three multipliers that are first multiplied together and then applied once to the tier's Coverage A rate per 1,000 USD, before the full-year realignment charge is rounded; none of them acts on the result of another."
      annual_change: "The standard full-year realignment charge is the tier's Coverage A rate per 1,000 USD multiplied by the number of thousands of USD by which the new Coverage A exceeds the Coverage A on the declarations before the change, rounded half-up to the cent."
      result: "The realignment charge for the rest of the term is then the full-year realignment charge multiplied by the realignment share, rounded half-up to the cent; the full-year figure is rounded first and the share is applied to the rounded figure. Each rounding of the realignment charge to the cent is half-up in exact decimal: a figure lying exactly halfway between two cents goes to the higher cent."
    factors:
      - id: flood_companion
        effect: parameter
        decides: flood_mult
        bindings: [flood_unit_cover, flood_tenure_months, flood_mult]
        ladder:
          - when: "an in-force FloodGuard policy written on a condominium unit AND its first inception 36 or more whole months ago"
            value: "K('flood_long_mult') = 0.93"
          - when: "an in-force FloodGuard condominium-unit policy AND its first inception fewer than 36 whole months ago"
            value: "K('flood_new_mult') = 0.97"
          - when: "otherwise (no in-force FloodGuard condominium-unit policy)"
            value: "K('standard_mult') = 1.00"
        baseline:
          flood_mult: "K('standard_mult')"
        evidence: [cross_category, date]
        cross_difficulty: flood
      - id: realignment_claims_free
        effect: parameter
        decides: claims_free_mult
        bindings: [claims_free_months, claims_free_mult]
        ladder:
          - when: "60 or more whole months since the latest claim payment on the policy (or since first inception when none)"
            value: "K('claims_free_long_mult') = 0.90"
          - when: "36 to 59 whole months since the latest claim payment"
            value: "K('claims_free_mid_mult') = 0.95"
          - when: "otherwise (fewer than 36 whole months)"
            value: "K('standard_mult') = 1.00"
        baseline:
          claims_free_mult: "K('standard_mult')"
        evidence: [history, date]
        cross_difficulty: null
      - id: realignment_payment_record
        effect: parameter
        decides: payment_mult
        bindings: [returned_12, payment_mult]
        ladder:
          - when: "a payment on the policy returned unpaid fewer than 12 whole months ago"
            value: "K('returned_draft_mult') = 1.05"
          - when: "no returned payment within that time AND the term billed on the monthly EFT plan"
            value: "K('eft_clean_mult') = 0.97"
          - when: "otherwise (no returned payment AND any other plan)"
            value: "K('standard_mult') = 1.00"
        baseline:
          payment_mult: "K('standard_mult')"
        evidence: [history]
        cross_difficulty: null
      - id: realignment_billing_share
        effect: method
        decides: realignment_share
        bindings: [term_installments_billed, unbilled_installments, realignment_share]
        ladder:
          - when: "a monthly EFT plan AND at least one installment of the current term not yet billed"
            method: "the share is the current term's unbilled monthly installments divided by twelve"
          - when: "a two-pay or quarterly plan AND at least one installment of the current term not yet billed"
            method: "the share is the whole calendar months to the expiration date, a part month dropped, divided by twelve"
          - when: "otherwise"
            method: "the share is the calendar days to the expiration date divided by the calendar days in the term"
        baseline:
          realignment_share: "days_left / term_days"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        When the master policy type on file makes the tier's Coverage A minimum higher than the Coverage A on the declarations, a Coverage A realignment raises Coverage A to exactly that minimum, and an owner who wants more than the minimum asks for a separate Coverage A change.
        The tier's Coverage A minimum is its bare-walls, single-entity or all-in minimum according to the master policy type shown on the declarations.
        The standard full-year realignment charge is the tier's Coverage A rate per 1,000 USD multiplied by the number of thousands of USD by which the new Coverage A exceeds the Coverage A on the declarations before the change, rounded half-up to the cent.
        The realignment charge for the rest of the term is the full-year realignment charge multiplied by the calendar days from the day the realignment takes effect to the expiration date and divided by the calendar days in the term, rounded half-up to the cent.
      params: [coverage_a_rate_per_1000, min_coverage_a_bare_walls, min_coverage_a_single_entity, min_coverage_a_all_in]
    inputs:
      history:
        - {table: condo_claims, aggregate: latest, field: entry_date, filters: {event_type: condo_claim_payment}}
        - {table: condo_billing, aggregate: count, field: condo_billing_id, within_months: 12, filters: {event_type: condo_payment_returned}}
        - {table: condo_billing, aggregate: count, field: condo_billing_id, filters: {event_type: condo_premium_billed, term_effective_date: current term}}
      cross_category: [flood]

  - id: condo_ext_deductible_raise_credit
    base_policy_refs: [condo_endorsements, condo_association_changes, condo_cancellation_and_reinstatement]
    overwrite:
      - base_policy: condo_endorsements
        superseded_clause: >-
          A midterm change takes effect no earlier than the date the named insured requests it and before the expiration date.
        replaced_by: >-
          A deductible raise takes effect on the day the named insured requests it, and that day is before the expiration date.
      - base_policy: condo_endorsements
        superseded_clause: >-
          and for a deductible change term_premium multiplied by the new deductible's factor minus the old one's in deductible_credit_factors
        replaced_by: >-
          The standard full-year deductible credit is the annual premium in force multiplied by the deductible step credit, rounded half-up to the cent.
      - base_policy: condo_endorsements
        superseded_clause: >-
          The prorated premium is the annual change multiplied by the calendar days from the change effective date to the expiration date and divided by the calendar days in the term, rounded half-up to the cent
        replaced_by: >-
          The share of the full-year deductible credit returned for the rest of the term depends on how the term is billed.
    trigger: on_request
    subject: [condo_endorsement_added, condo_coverage_updated, condo_return_premium]
    computes: prorated_premium
    target_tool: elect_deductible_raise_c9f31846
    params:
      standard_mult: 1.00
      step_credit_from_500: 0.05
      step_credit_from_1000: 0.10
      step_credit_from_2500: 0.07
      claims_window_months: 60
      claims_two_share: 0.60
      claims_one_share: 0.80
      recent_lowering_months: 12
      older_lowering_months: 24
      recent_lowering_share: 0.25
      older_lowering_share: 0.50
      tenure_long_months: 120
      tenure_mid_months: 60
      tenure_long_share: 1.10
      tenure_mid_share: 1.05
      late_window_months: 12
      late_two_share: 0.80
      late_one_share: 0.90
      installments_two_pay: 2
      installments_quarterly: 4
      installments_monthly: 12
      months_per_year: 12
    rule: >-
      A deductible raise moves the per-occurrence deductible on a CondoGuard policy to the next higher of the deductibles the tier offers, and the declarations then show the higher deductible.
      A deductible raise takes effect on the day the named insured requests it, and that day is before the expiration date.
      The credit for a deductible raise is worked out only after the declarations show Coverage A at or above the tier's minimum for the master policy type on file.
      The annual premium in force is the current term's premium plus the full-year premium effect of every endorsement effective in the current term that added premium, minus the full-year premium effect of every endorsement effective in the current term that returned premium.
      The deductible step credit is the tier's deductible credit factor of the old deductible minus that of the new one: 0.05 for a raise from 500 USD to 1,000 USD, 0.10 for a raise from 1,000 USD to 2,500 USD, and 0.07 for a raise from 2,500 USD to 5,000 USD.
      The standard full-year deductible credit is the annual premium in force multiplied by the deductible step credit, rounded half-up to the cent.
      The deductible credit for the rest of the term is the full-year deductible credit multiplied by the calendar days from the day the raise takes effect to the expiration date and divided by the calendar days in the term, rounded half-up to the cent.
      Four deductible credit shares adjust the credit: they are first multiplied together and then applied once to the product of the annual premium in force and the deductible step credit, before the full-year deductible credit is rounded; none of them acts on the result of another.
      The loss-history share of the deductible credit counts the claim payments issued on the CondoGuard policy fewer than 60 whole months before the day of the raise: it is 0.60 for two or more, 0.80 for exactly one, and 1.00 for none.
      The re-raise share of the deductible credit looks at the latest deductible lowering on the policy, a deductible endorsement that added premium: it is 0.25 when such a lowering took effect fewer than 12 whole months before the day of the raise, 0.50 when the latest such lowering took effect 12 to 23 whole months before that day, and 1.00 when there was no such lowering or the latest one took effect 24 or more whole months before.
      The tenure share of the deductible credit is 1.10 when the policy has been in force for 120 or more whole months since its first inception date, 1.05 when it has been in force for 60 to 119 whole months, and 1.00 when it has been in force for fewer than 60 whole months.
      The late-payment share of the deductible credit counts the late fees charged on the policy fewer than 12 whole months before the day of the raise: it is 0.80 for two or more, 0.90 for exactly one, and 1.00 for none.
      The share of the full-year deductible credit returned for the rest of the term depends on how the term is billed.
      On a monthly EFT plan with at least one installment of the current term not yet billed, the deductible share is the whole calendar months from the day the raise takes effect to the expiration date plus one for the month in which the raise takes effect, never more than twelve, divided by twelve, where the installments billed are the premium installments posted with the current term's effective date.
      On a two-pay or quarterly plan with at least one installment of the current term not yet billed, the deductible share is the number of the current term's installments not yet billed divided by the plan's number of installments (two for two-pay, four for quarterly).
      On any other plan, or when every installment of the current term has already been billed, the deductible share is the calendar days from the day the raise takes effect to the expiration date divided by the calendar days in the term.
      The deductible credit for the rest of the term is then the full-year deductible credit multiplied by the deductible share, rounded half-up to the cent; the full-year figure is rounded first and the share is applied to the rounded figure. Each rounding of the deductible credit to the cent is half-up in exact decimal: a figure lying exactly halfway between two cents goes to the higher cent.
    prerequisite:
      - problem: condo_ext_coverage_a_realignment_charge
        kind: value_input
        gate: annual_in_force
        form: state
        policy_source: >-
          The credit for a deductible raise is worked out only after the declarations show Coverage A at or above the tier's minimum for the master policy type on file.
        condition: >-
          condo_policies.coverage_a_limit is at or above the tier minimum (min_coverage_a_bare_walls, min_coverage_a_single_entity or min_coverage_a_all_in) for condo_policies.master_policy_type.
        resolved_by: raise_coverage_a_minimum_ec3d8a44
        effect: >-
          Once Coverage A is realigned, the Coverage A endorsement effective in the current term adds its full-year premium effect to the annual premium in force, so the full-year deductible credit and the credit for the rest of the term both rise.
    cross_category: []
    compute:
      - annual_added: "SUM('condo_endorsements', 'annual_premium_change', within_months=MONTHS(F('effective_date'), NOW) + 1, date_field='effective_date', premium_direction='additional')"
      - annual_returned: "SUM('condo_endorsements', 'annual_premium_change', within_months=MONTHS(F('effective_date'), NOW) + 1, date_field='effective_date', premium_direction='return')"
      - annual_in_force: "F('term_premium') + annual_added - annual_returned"
      - step_credit: "K('step_credit_from_500') if F('deductible') == 500 else (K('step_credit_from_1000') if F('deductible') == 1000 else K('step_credit_from_2500'))"
      - claim_payments_60: "COUNT('condo_claims', within_months=K('claims_window_months'), date_field='entry_date', event_type='condo_claim_payment')"
      - claims_share: "K('claims_two_share') if claim_payments_60 >= 2 else (K('claims_one_share') if claim_payments_60 == 1 else K('standard_mult'))"
      - lowerings: "COUNT('condo_endorsements', event_type='condo_endorsement_added', endorsement_code='deductible_change', premium_direction='additional')"
      - months_since_lowering: "MONTHS(LATEST('condo_endorsements', 'effective_date', date_field='effective_date', event_type='condo_endorsement_added', endorsement_code='deductible_change', premium_direction='additional'), NOW) if lowerings >= 1 else 0"
      - reraise_share: "K('recent_lowering_share') if (lowerings >= 1 and months_since_lowering < K('recent_lowering_months')) else (K('older_lowering_share') if (lowerings >= 1 and months_since_lowering >= K('recent_lowering_months') and months_since_lowering < K('older_lowering_months')) else K('standard_mult'))"
      - ded_tenure_months: "MONTHS(F('original_effective_date'), NOW)"
      - tenure_share: "K('tenure_long_share') if ded_tenure_months >= K('tenure_long_months') else (K('tenure_mid_share') if ded_tenure_months >= K('tenure_mid_months') else K('standard_mult'))"
      - late_fees_12: "COUNT('condo_billing', within_months=K('late_window_months'), date_field='posted_date', event_type='condo_fee_assessed', fee_code='late_fee')"
      - late_share: "K('late_two_share') if late_fees_12 >= 2 else (K('late_one_share') if late_fees_12 == 1 else K('standard_mult'))"
      - plan_installments: "K('installments_quarterly') if F('billing_plan') == 'quarterly' else (K('installments_two_pay') if F('billing_plan') == 'two_pay' else K('installments_monthly'))"
      - term_installments_billed: "COUNT('condo_billing', event_type='condo_premium_billed', term_effective_date=F('effective_date'))"
      - unbilled_installments: "MX(0, plan_installments - term_installments_billed)"
      - days_left: "DAYS(NOW, F('expiration_date'))"
      - term_days: "DAYS(F('effective_date'), F('expiration_date'))"
      - deductible_share: "MN(K('months_per_year'), MONTHS(NOW, F('expiration_date')) + 1) / K('months_per_year') if (F('billing_plan') == 'monthly_eft' and unbilled_installments >= 1) else (unbilled_installments / plan_installments if ((F('billing_plan') == 'quarterly' or F('billing_plan') == 'two_pay') and unbilled_installments >= 1) else days_left / term_days)"
      - annual_change: "int(round((annual_in_force * step_credit * claims_share * reraise_share * tenure_share * late_share) * 100, 6) + 0.5) / 100"
      - result: "int(round((annual_change * deductible_share) * 100, 6) + 0.5) / 100"
    compute_basis:
      annual_added: "The annual premium in force is the current term's premium plus the full-year premium effect of every endorsement effective in the current term that added premium, minus the full-year premium effect of every endorsement effective in the current term that returned premium."
      annual_returned: "The annual premium in force is the current term's premium plus the full-year premium effect of every endorsement effective in the current term that added premium, minus the full-year premium effect of every endorsement effective in the current term that returned premium."
      annual_in_force: "The annual premium in force is the current term's premium plus the full-year premium effect of every endorsement effective in the current term that added premium, minus the full-year premium effect of every endorsement effective in the current term that returned premium."
      step_credit: "The deductible step credit is the tier's deductible credit factor of the old deductible minus that of the new one: 0.05 for a raise from 500 USD to 1,000 USD, 0.10 for a raise from 1,000 USD to 2,500 USD, and 0.07 for a raise from 2,500 USD to 5,000 USD."
      claim_payments_60: "The loss-history share of the deductible credit counts the claim payments issued on the CondoGuard policy fewer than 60 whole months before the day of the raise: it is 0.60 for two or more, 0.80 for exactly one, and 1.00 for none."
      claims_share: "The loss-history share of the deductible credit counts the claim payments issued on the CondoGuard policy fewer than 60 whole months before the day of the raise: it is 0.60 for two or more, 0.80 for exactly one, and 1.00 for none."
      lowerings: "The re-raise share of the deductible credit looks at the latest deductible lowering on the policy, a deductible endorsement that added premium: it is 0.25 when such a lowering took effect fewer than 12 whole months before the day of the raise, 0.50 when the latest such lowering took effect 12 to 23 whole months before that day, and 1.00 when there was no such lowering or the latest one took effect 24 or more whole months before."
      months_since_lowering: "The re-raise share of the deductible credit looks at the latest deductible lowering on the policy, a deductible endorsement that added premium: it is 0.25 when such a lowering took effect fewer than 12 whole months before the day of the raise, 0.50 when the latest such lowering took effect 12 to 23 whole months before that day, and 1.00 when there was no such lowering or the latest one took effect 24 or more whole months before."
      reraise_share: "The re-raise share of the deductible credit looks at the latest deductible lowering on the policy, a deductible endorsement that added premium: it is 0.25 when such a lowering took effect fewer than 12 whole months before the day of the raise, 0.50 when the latest such lowering took effect 12 to 23 whole months before that day, and 1.00 when there was no such lowering or the latest one took effect 24 or more whole months before."
      ded_tenure_months: "The tenure share of the deductible credit is 1.10 when the policy has been in force for 120 or more whole months since its first inception date, 1.05 when it has been in force for 60 to 119 whole months, and 1.00 when it has been in force for fewer than 60 whole months."
      tenure_share: "The tenure share of the deductible credit is 1.10 when the policy has been in force for 120 or more whole months since its first inception date, 1.05 when it has been in force for 60 to 119 whole months, and 1.00 when it has been in force for fewer than 60 whole months."
      late_fees_12: "The late-payment share of the deductible credit counts the late fees charged on the policy fewer than 12 whole months before the day of the raise: it is 0.80 for two or more, 0.90 for exactly one, and 1.00 for none."
      late_share: "The late-payment share of the deductible credit counts the late fees charged on the policy fewer than 12 whole months before the day of the raise: it is 0.80 for two or more, 0.90 for exactly one, and 1.00 for none."
      plan_installments: "the deductible share is the number of the current term's installments not yet billed divided by the plan's number of installments (two for two-pay, four for quarterly)."
      term_installments_billed: "where the installments billed are the premium installments posted with the current term's effective date."
      unbilled_installments: "On a two-pay or quarterly plan with at least one installment of the current term not yet billed, the deductible share is the number of the current term's installments not yet billed divided by the plan's number of installments (two for two-pay, four for quarterly)."
      days_left: "The deductible credit for the rest of the term is the full-year deductible credit multiplied by the calendar days from the day the raise takes effect to the expiration date and divided by the calendar days in the term, rounded half-up to the cent."
      term_days: "The deductible credit for the rest of the term is the full-year deductible credit multiplied by the calendar days from the day the raise takes effect to the expiration date and divided by the calendar days in the term, rounded half-up to the cent."
      deductible_share: "On a monthly EFT plan with at least one installment of the current term not yet billed, the deductible share is the whole calendar months from the day the raise takes effect to the expiration date plus one for the month in which the raise takes effect, never more than twelve, divided by twelve, where the installments billed are the premium installments posted with the current term's effective date. On a two-pay or quarterly plan with at least one installment of the current term not yet billed, the deductible share is the number of the current term's installments not yet billed divided by the plan's number of installments (two for two-pay, four for quarterly). On any other plan, or when every installment of the current term has already been billed, the deductible share is the calendar days from the day the raise takes effect to the expiration date divided by the calendar days in the term."
      annual_change: "Four deductible credit shares adjust the credit: they are first multiplied together and then applied once to the product of the annual premium in force and the deductible step credit, before the full-year deductible credit is rounded; none of them acts on the result of another."
      result: "The deductible credit for the rest of the term is then the full-year deductible credit multiplied by the deductible share, rounded half-up to the cent; the full-year figure is rounded first and the share is applied to the rounded figure. Each rounding of the deductible credit to the cent is half-up in exact decimal: a figure lying exactly halfway between two cents goes to the higher cent."
    factors:
      - id: deductible_loss_history
        effect: parameter
        decides: claims_share
        bindings: [claim_payments_60, claims_share]
        ladder:
          - when: "two or more claim payments issued on the policy fewer than 60 whole months ago"
            value: "K('claims_two_share') = 0.60"
          - when: "exactly one such claim payment"
            value: "K('claims_one_share') = 0.80"
          - when: "otherwise (no such claim payment)"
            value: "K('standard_mult') = 1.00"
        baseline:
          claims_share: "K('standard_mult')"
        evidence: [history]
        cross_difficulty: null
      - id: deductible_reraise
        effect: parameter
        decides: reraise_share
        bindings: [lowerings, months_since_lowering, reraise_share]
        ladder:
          - when: "a deductible lowering on the policy AND the latest one took effect fewer than 12 whole months ago"
            value: "K('recent_lowering_share') = 0.25"
          - when: "a deductible lowering on the policy AND the latest one took effect 12 to 23 whole months ago"
            value: "K('older_lowering_share') = 0.50"
          - when: "otherwise (no lowering, or the latest 24 or more whole months ago)"
            value: "K('standard_mult') = 1.00"
        baseline:
          reraise_share: "K('standard_mult')"
        evidence: [history, date]
        cross_difficulty: null
      - id: deductible_tenure
        effect: parameter
        decides: tenure_share
        bindings: [ded_tenure_months, tenure_share]
        ladder:
          - when: "the policy in force for 120 or more whole months since first inception"
            value: "K('tenure_long_share') = 1.10"
          - when: "in force for 60 to 119 whole months"
            value: "K('tenure_mid_share') = 1.05"
          - when: "otherwise (fewer than 60 whole months)"
            value: "K('standard_mult') = 1.00"
        baseline:
          tenure_share: "K('standard_mult')"
        evidence: [date]
        cross_difficulty: null
      - id: deductible_late_payment
        effect: parameter
        decides: late_share
        bindings: [late_fees_12, late_share]
        ladder:
          - when: "two or more late fees charged on the policy fewer than 12 whole months ago"
            value: "K('late_two_share') = 0.80"
          - when: "exactly one such late fee"
            value: "K('late_one_share') = 0.90"
          - when: "otherwise (no such late fee)"
            value: "K('standard_mult') = 1.00"
        baseline:
          late_share: "K('standard_mult')"
        evidence: [history]
        cross_difficulty: null
      - id: deductible_billing_share
        effect: method
        decides: deductible_share
        bindings: [term_installments_billed, unbilled_installments, deductible_share]
        ladder:
          - when: "a monthly EFT plan AND at least one installment of the current term not yet billed"
            method: "the share is the whole calendar months to the expiration date plus one for the month of the raise, never more than twelve, divided by twelve"
          - when: "a two-pay or quarterly plan AND at least one installment of the current term not yet billed"
            method: "the share is the current term's unbilled installments divided by the plan's installment count"
          - when: "otherwise"
            method: "the share is the calendar days to the expiration date divided by the calendar days in the term"
        baseline:
          deductible_share: "days_left / term_days"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A deductible raise moves the per-occurrence deductible on a CondoGuard policy to the next higher of the deductibles the tier offers, and the declarations then show the higher deductible.
        The annual premium in force is the current term's premium plus the full-year premium effect of every endorsement effective in the current term that added premium, minus the full-year premium effect of every endorsement effective in the current term that returned premium.
        The deductible step credit is the tier's deductible credit factor of the old deductible minus that of the new one: 0.05 for a raise from 500 USD to 1,000 USD, 0.10 for a raise from 1,000 USD to 2,500 USD, and 0.07 for a raise from 2,500 USD to 5,000 USD.
        The standard full-year deductible credit is the annual premium in force multiplied by the deductible step credit, rounded half-up to the cent.
        The deductible credit for the rest of the term is the full-year deductible credit multiplied by the calendar days from the day the raise takes effect to the expiration date and divided by the calendar days in the term, rounded half-up to the cent.
      params: [step_credit_from_500, step_credit_from_1000, step_credit_from_2500, deductible_options]
    inputs:
      history:
        - {table: condo_endorsements, aggregate: sum, field: annual_premium_change, filters: {premium_direction: additional, effective: current term}}
        - {table: condo_endorsements, aggregate: sum, field: annual_premium_change, filters: {premium_direction: return, effective: current term}}
        - {table: condo_claims, aggregate: count, field: condo_claim_entry_id, within_months: 60, filters: {event_type: condo_claim_payment}}
        - {table: condo_endorsements, aggregate: latest, field: effective_date, filters: {endorsement_code: deductible_change, premium_direction: additional}}
        - {table: condo_billing, aggregate: count, field: condo_billing_id, within_months: 12, filters: {event_type: condo_fee_assessed, fee_code: late_fee}}
        - {table: condo_billing, aggregate: count, field: condo_billing_id, filters: {event_type: condo_premium_billed, term_effective_date: current term}}
      cross_category: []
