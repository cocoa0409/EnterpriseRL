      landlord_mult: "The returning-landlord multiplier looks at the unit's earlier rental, measured in whole months from the effective date of the latest unit rental endorsement added to the effective date of the latest unit rental endorsement removed: it is 0.90 when a unit rental endorsement was earlier removed from the policy and that earlier rental had stayed on for 24 or more whole months, 0.96 when a unit rental endorsement was earlier removed and that earlier rental had stayed on for fewer than 24 whole months, and 1.00 when no unit rental endorsement was ever removed from the policy."
