            value: "K('household_high_mult') = 0.80"
          - when: "the customer holds an in-force HomeGuard homeowners policy AND its personal liability limit is below 500,000 USD"
            value: "K('household_low_mult') = 0.90"
          - when: "otherwise (no in-force HomeGuard homeowners policy)"
            value: "K('standard_mult') = 1.00"
