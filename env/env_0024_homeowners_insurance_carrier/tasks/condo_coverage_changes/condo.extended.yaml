  - id: condo_ext_unit_rental_charge
    base_policy_refs: [condo_endorsements, condo_association_changes, condo_cancellation_and_reinstatement, condo_bind_eligibility]
    overwrite:
      - base_policy: condo_endorsements
        superseded_clause: >-
          A midterm change takes effect no earlier than the date the named insured requests it and before the expiration date.
        replaced_by: >-
          A unit rental endorsement takes effect on the day the named insured requests it, and that day is before the expiration date.
      - base_policy: condo_endorsements
        superseded_clause: >-
          unit_rental_annual_premium;
        replaced_by: >-
          The standard full-year rental charge is the tier's unit rental annual premium plus the landlord liability load, rounded half-up to the cent.
      - base_policy: condo_endorsements
        superseded_clause: >-
          The prorated premium is the annual change multiplied by the calendar days from the change effective date to the expiration date and divided by the calendar days in the term, rounded half-up to the cent
        replaced_by: >-
          The share of the full-year rental charge billed for the rest of the term depends on the policy's payment record and on how the term is billed.
    trigger: on_request
    subject: [condo_endorsement_added, condo_coverage_updated, condo_additional_premium]
    computes: prorated_premium
    target_tool: add_unit_rental_endorsement_60a857ee
    params:
      standard_mult: 1.00
      companion_tenure_months: 60
      companion_long_mult: 0.90
      companion_short_mult: 0.95
      loss_two_mult: 1.25
      loss_one_mult: 1.10
      loss_free_mult: 0.95
      returning_months: 24
      returning_long_mult: 0.90
      returning_short_mult: 0.96
      payment_window_months: 12
      late_fee_mult: 1.05
      clean_payment_mult: 0.97
      fully_earned_share: 1.00
      installments_two_pay: 2
      installments_quarterly: 4
      installments_monthly: 12
    rule: >-
      A unit rental endorsement is recorded on a CondoGuard policy only where the tier allows a unit rented to others, and it changes the occupancy on the declarations to rented to others.
      A unit rental endorsement takes effect on the day the named insured requests it, and that day is before the expiration date.
      A unit rental endorsement is not recorded until the declarations carry the higher of the tier's two personal liability limits.
      The standard full-year rental charge is the tier's unit rental annual premium plus the landlord liability load, rounded half-up to the cent.
      The landlord liability load is the tier's liability step premium when the declarations carry the higher of the tier's two personal liability limits, and nothing when they carry the lower one.
      The rental charge for the rest of the term is the full-year rental charge multiplied by the calendar days from the day the endorsement takes effect to the expiration date and divided by the calendar days in the term, rounded half-up to the cent.
      Four rental multipliers adjust the sum of the unit rental annual premium and the landlord liability load: they are first multiplied together and then applied once to that sum, before the full-year rental charge is rounded; none of them acts on the result of another.
      The companion residence multiplier on the rental charge is 0.90 when the named insured's primary residence is insured under an in-force HomeGuard homeowners policy and the CondoGuard policy has been in force for 60 or more whole months since its first inception date, 0.95 when the primary residence is insured under an in-force HomeGuard homeowners policy and the CondoGuard policy has been in force for fewer than 60 whole months, and 1.00 when no in-force HomeGuard homeowners policy insures the named insured's primary residence.
      The rental loss-history multiplier counts the claim payments issued on the CondoGuard policy fewer than 36 whole months before the day of the endorsement: it is 1.25 for two or more, 1.10 for exactly one, 0.95 for none when the policy has been in force for 36 or more whole months, and 1.00 for none when it has been in force for fewer than 36 whole months.
      The returning-landlord multiplier looks at the unit's earlier rental, measured in whole months from the effective date of the latest unit rental endorsement added to the effective date of the latest unit rental endorsement removed: it is 0.90 when a unit rental endorsement was earlier removed from the policy and that earlier rental had stayed on for 24 or more whole months, 0.96 when a unit rental endorsement was earlier removed and that earlier rental had stayed on for fewer than 24 whole months, and 1.00 when no unit rental endorsement was ever removed from the policy.
      The rental payment-history multiplier is 1.05 when a late fee was charged on the policy fewer than 12 whole months before the day of the endorsement, 0.97 when no late fee was charged within that time and the policy has been in force for 12 or more whole months, and 1.00 when no late fee was charged within that time and the policy has been in force for fewer than 12 whole months.
      The share of the full-year rental charge billed for the rest of the term depends on the policy's payment record and on how the term is billed.
      When a payment on the policy was returned unpaid fewer than 12 whole months before the day of the endorsement, the rental charge is fully earned and the rental share is one, so the whole full-year rental charge is billed.
      When no payment was returned within that time and the term is on a two-pay or quarterly plan with at least one installment of the current term not yet billed, the rental share is the number of the current term's installments not yet billed divided by the plan's number of installments (two for two-pay, four for quarterly), where the installments billed are the premium installments posted with the current term's effective date.
      In every other case the rental share is the calendar days from the day the endorsement takes effect to the expiration date divided by the calendar days in the term.
      The rental charge for the rest of the term is then the full-year rental charge multiplied by the rental share, rounded half-up to the cent; the full-year figure is rounded first and the share is applied to the rounded figure. Each rounding of the rental charge to the cent is half-up in exact decimal: a figure lying exactly halfway between two cents goes to the higher cent.
    prerequisite:
      - problem: condo_ext_liability_raise_charge
        kind: value_input
        gate: landlord_liability_load
        form: state
        policy_source: >-
          A unit rental endorsement is not recorded until the declarations carry the higher of the tier's two personal liability limits.
        condition: >-
          condo_policies.liability_limit equals the higher of the two values in the tier's liability_limit_options.
        resolved_by: raise_liability_limit_70984c5d
        effect: >-
          Once the liability raise is on the declarations, the landlord liability load moves from nothing to the tier's liability step premium, so the full-year rental charge and the rental charge for the rest of the term both rise.
    cross_category:
      - category: home
        as: branch
        reads: [status, occupancy]
        note: The companion residence multiplier reads whether an in-force HomeGuard policy insures the named insured's primary residence.
    compute:
      - rental_tenure_months: "MONTHS(F('original_effective_date'), NOW)"
      - home_primary: "CFIELD('home', 'occupancy', status='in_force') == 'primary'"
      - companion_mult: "K('companion_long_mult') if (home_primary and rental_tenure_months >= K('companion_tenure_months')) else (K('companion_short_mult') if (home_primary and rental_tenure_months < K('companion_tenure_months')) else K('standard_mult'))"
      - claim_payments_36: "COUNT('condo_claims', within_months=P('claims_lookback_months'), date_field='entry_date', event_type='condo_claim_payment')"
      - rental_loss_mult: "K('loss_two_mult') if claim_payments_36 >= 2 else (K('loss_one_mult') if claim_payments_36 == 1 else (K('loss_free_mult') if rental_tenure_months >= P('claims_lookback_months') else K('standard_mult')))"
      - rentals_removed: "COUNT('condo_endorsements', event_type='condo_endorsement_removed', endorsement_code='unit_rental')"
      - prior_rental_months: "MONTHS(LATEST('condo_endorsements', 'effective_date', date_field='effective_date', event_type='condo_endorsement_added', endorsement_code='unit_rental'), LATEST('condo_endorsements', 'effective_date', date_field='effective_date', event_type='condo_endorsement_removed', endorsement_code='unit_rental')) if rentals_removed >= 1 else 0"
      - landlord_mult: "K('returning_long_mult') if (rentals_removed >= 1 and prior_rental_months >= K('returning_months')) else (K('returning_short_mult') if (rentals_removed >= 1 and prior_rental_months < K('returning_months')) else K('standard_mult'))"
      - late_fees_12: "COUNT('condo_billing', within_months=K('payment_window_months'), date_field='posted_date', event_type='condo_fee_assessed', fee_code='late_fee')"
      - rental_payment_mult: "K('late_fee_mult') if late_fees_12 >= 1 else (K('clean_payment_mult') if rental_tenure_months >= K('payment_window_months') else K('standard_mult'))"
      - returned_12: "COUNT('condo_billing', within_months=K('payment_window_months'), date_field='posted_date', event_type='condo_payment_returned')"
      - plan_installments: "K('installments_quarterly') if F('billing_plan') == 'quarterly' else (K('installments_two_pay') if F('billing_plan') == 'two_pay' else K('installments_monthly'))"
      - term_installments_billed: "COUNT('condo_billing', event_type='condo_premium_billed', term_effective_date=F('effective_date'))"
      - unbilled_installments: "MX(0, plan_installments - term_installments_billed)"
      - days_left: "DAYS(NOW, F('expiration_date'))"
      - term_days: "DAYS(F('effective_date'), F('expiration_date'))"
      - rental_share: "K('fully_earned_share') if returned_12 >= 1 else (unbilled_installments / plan_installments if ((F('billing_plan') == 'quarterly' or F('billing_plan') == 'two_pay') and unbilled_installments >= 1) else days_left / term_days)"
      - landlord_liability_load: "P('liability_step_annual_premium') if F('liability_limit') >= max(P('liability_limit_options')) else 0"
      - annual_change: "int(round(((P('unit_rental_annual_premium') + landlord_liability_load) * companion_mult * rental_loss_mult * landlord_mult * rental_payment_mult) * 100, 6) + 0.5) / 100"
      - result: "int(round((annual_change * rental_share) * 100, 6) + 0.5) / 100"
    compute_basis:
      rental_tenure_months: "The companion residence multiplier on the rental charge is 0.90 when the named insured's primary residence is insured under an in-force HomeGuard homeowners policy and the CondoGuard policy has been in force for 60 or more whole months since its first inception date, 0.95 when the primary residence is insured under an in-force HomeGuard homeowners policy and the CondoGuard policy has been in force for fewer than 60 whole months, and 1.00 when no in-force HomeGuard homeowners policy insures the named insured's primary residence."
