      companion_mult: "The companion residence multiplier on the rental charge is 0.90 when the named insured's primary residence is insured under an in-force HomeGuard homeowners policy and the CondoGuard policy has been in force for 60 or more whole months since its first inception date, 0.95 when the primary residence is insured under an in-force HomeGuard homeowners policy and the CondoGuard policy has been in force for fewer than 60 whole months, and 1.00 when no in-force HomeGuard homeowners policy insures the named insured's primary residence."
