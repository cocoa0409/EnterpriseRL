      rental_loss_mult: "The rental loss-history multiplier counts the claim payments issued on the CondoGuard policy fewer than 36 whole months before the day of the endorsement: it is 1.25 for two or more, 1.10 for exactly one, 0.95 for none when the policy has been in force for 36 or more whole months, and 1.00 for none when it has been in force for fewer than 36 whole months."
      rentals_removed: "The returning-landlord multiplier looks at the unit's earlier rental, measured in whole months from the effective date of the latest unit rental endorsement added to the effective date of the latest unit rental endorsement removed: it is 0.90 when a unit rental endorsement was earlier removed from the policy and that earlier rental had stayed on for 24 or more whole months, 0.96 when a unit rental endorsement was earlier removed and that earlier rental had stayed on for fewer than 24 whole months, and 1.00 when no unit rental endorsement was ever removed from the policy."
