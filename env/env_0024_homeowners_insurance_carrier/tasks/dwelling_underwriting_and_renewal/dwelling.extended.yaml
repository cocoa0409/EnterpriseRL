# Policy charter — LandlordGuard Dwelling Fire Policy (DP-1 / DP-2 / DP-3), Larkspur Mutual Insurance Company.
category: dwelling
display_name: LandlordGuard Dwelling Fire Policy

binding:
  holding_table: dwelling_policies
  event_tables: [dwelling_billing, dwelling_inspections, dwelling_claims]
  intake_tables: [dwelling_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_balance}

lifecycle:
  states: [bound, in_force, pending_cancellation, cancelled, pending_nonrenewal, expired]
  transitions:
    - {from: bound, to: in_force, by: system, means: The policy reaches its effective date and coverage attaches.}
    - {from: bound, to: cancelled, by: user, means: The named insured signs a request to cancel before the policy takes effect.}
    - {from: in_force, to: pending_cancellation, by: agent, means: A notice of cancellation is issued for nonpayment, an uncured condition inside the new business period, or prolonged vacancy without a permit.}
    - {from: pending_cancellation, to: in_force, by: agent, means: The cure demanded by the notice is received before the scheduled cancellation date and the notice is rescinded.}
    - {from: pending_cancellation, to: cancelled, by: system, means: The scheduled cancellation date arrives without the cure.}
    - {from: in_force, to: cancelled, by: user, means: The named insured signs a request to cancel midterm, for example after selling the rental property.}
    - {from: in_force, to: pending_nonrenewal, by: agent, means: A notice of nonrenewal is issued on an underwriting ground.}
    - {from: pending_nonrenewal, to: in_force, by: agent, means: The curable ground for nonrenewal is cured before expiration and the notice is rescinded.}
    - {from: pending_nonrenewal, to: expired, by: system, means: The expiration date arrives under a notice of nonrenewal.}
    - {from: in_force, to: expired, by: system, means: The expiration date arrives and the renewal premium was not received.}

accounts:
  - key: premium_balance
    unit: USD
    meaning: Premium and fees owed on the landlord policy; positive owed to the carrier, negative a credit.
  - key: indemnity_paid
    unit: USD
    meaning: Claim money issued per claim and coverage part; issued payments raise it and voided payments lower it.
  - key: depreciation_holdback
    unit: USD
    meaning: Recoverable depreciation withheld from a replacement-cost dwelling payment, awaiting release or forfeiture.

parameter_schema:
  coverage_form: ISO dwelling form (string DP-1, DP-2 or DP-3).
  dwelling_perils: Peril basis for the dwelling (enum basic_named | broad_named | open_perils).
  dwelling_settlement: Dwelling loss settlement (enum actual_cash_value | replacement_cost).
  landlord_contents_settlement: Settlement of the landlord's furnishings and appliances (enum actual_cash_value | replacement_cost).
  min_dwelling_limit: Lowest Coverage A (USD).
  max_dwelling_limit: Highest Coverage A (USD).
  other_structures_pct: Coverage B other structures as a percent of Coverage A (percent).
  fair_rental_value_pct: Coverage D fair rental value limit as a percent of Coverage A (percent).
  fair_rental_value_max_months: Longest period lost rent is paid after a covered loss (months).
  landlord_contents_max: Most Coverage C for the landlord's furnishings and appliances (USD).
  landlord_theft_included: Whether theft of the landlord's furnishings and appliances is covered (boolean).
  premises_liability_options: Premises liability limits the tier may carry (list of USD).
  medical_payments_limit: Medical payments per person (USD).
  deductible_options: All-other-perils deductibles allowed (list of USD).
  wind_hail_deductible_pct_options: Wind/hail deductible percentages of Coverage A allowed (list of percent).
  max_units: Most dwelling units in one insured building (count).
  lease_types_allowed: Lease types accepted (list of annual_lease | month_to_month | short_term).
  short_term_rental_min_days: Shortest rental term that is not a short-term rental (days).
  max_home_age_new_business_years: Oldest building accepted at binding (years from year built).
  max_roof_age_new_business_years: Oldest roof accepted at binding (years).
  roof_rc_max_age_years: Oldest roof age at the term effective date that still settles roof surfacing at replacement cost (years; 0 = never).
  roof_schedule_min_pct: Floor of the roof surfacing payment schedule for the oldest roofs (percent of replacement cost).
  vacancy_exclusion_days: Consecutive days of vacancy after which vandalism and glass breakage are excluded and other losses are reduced (calendar days).
  vacancy_settlement_reduction_pct: Reduction of other covered losses while vacant beyond the vacancy exclusion days without a permit (percent).
  vacancy_permit_available: Whether a vacancy permit can be added (boolean).
  vacancy_permit_max_days: Longest vacancy permit (calendar days).
  vacancy_permit_rate_pct: Vacancy permit charge as a percent of the annual term premium, prorated over the permit days (percent).
  vacancy_cancel_days: Consecutive days vacant without a permit after which the carrier cancels for a substantial change in risk (calendar days).
  new_business_inspection_type: Inspection ordered on every new policy (enum exterior | exterior_interior).
  inspection_order_days: Days after binding within which the new-business inspection is ordered (calendar days).
  inspection_cure_days: Days after the inspection completion date to cure a finding (calendar days).
  cure_extension_days: Days added to a cure due date by the one extension a letter may receive (calendar days; 0 = no extension).
  new_business_period_days: Days from the first effective date during which the policy may be cancelled for an uncured condition (calendar days).
  nonrenewal_notice_days: Minimum advance notice of nonrenewal before expiration (calendar days).
  nonpayment_notice_after_due_days: Days past due after which a nonpayment notice is issued (calendar days).
  nonpayment_cancel_notice_days: Days from a nonpayment notice to the scheduled cancellation date (calendar days).
  underwriting_cancel_notice_days: Days from an underwriting cancellation notice to the scheduled cancellation date (calendar days).
  late_fee: Late fee per late installment (USD; 0 = none).
  late_fee_grace_days: Days past due before a late fee (calendar days).
  returned_payment_fee: Fee per returned payment (USD; 0 = none).
  installment_fee_direct: Service charge on each installment after the first (USD).
  billing_plans_allowed: Billing plans allowed (list of annual | two_pay | quarterly | mortgagee_escrow).
  insured_cancel_basis: Unearned premium basis on a named-insured cancellation (enum pro_rata | short_rate).
  short_rate_retention_pct: Share of the pro-rata unearned premium kept on a short-rate cancellation (percent).
  minimum_earned_premium: Premium kept at minimum on a named-insured midterm cancellation (USD).
  refund_minimum: Smallest credit balance refunded (USD).
  paid_claims_nonrenewal_threshold: Paid claims on the property in the lookback at which it becomes eligible for nonrenewal (count).
  claims_lookback_months: Claims lookback window (months).
  renewal_rate_cap_pct: Largest renewal premium increase over the expiring term premium (percent).
  inflation_guard_pct: Automatic Coverage A increase at renewal (percent; 0 = none).
  renewal_offer_lead_days: Days before expiration the renewal is billed (calendar days).
  mortgagee_notice_days: Advance notice of cancellation owed to the mortgagee (calendar days).
  rc_no_holdback_threshold: Replacement-cost amount per coverage part at or below which no depreciation is withheld (USD).
  depreciation_recovery_days: Days after the actual-cash-value payment to document repair for release of withheld depreciation (calendar days).
  mortgagee_copayee_threshold: Dwelling payment at or above which the mortgagee is named co-payee (USD).

