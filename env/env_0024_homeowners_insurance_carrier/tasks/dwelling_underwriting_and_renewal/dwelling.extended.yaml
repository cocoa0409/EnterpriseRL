events:
  - type: dwelling_policy_bound
    target: dwelling_policies
    mutation: create
    meaning: A landlord dwelling policy is bound on one rental building with its form, limits, occupancy and billing plan.
    grain: One row per policy contract.
    fields:
      policy_number: Policy number.
      variant_name: Official tier name.
      property_address: Rental property address.
      units: Dwelling units in the building.
      year_built: Year built.
      roof_material: Roof covering material.
      roof_install_year: Year the roof covering was installed.
      roof_settlement: Roof surfacing settlement basis for the term.
      occupancy: Occupancy at binding.
      lease_type: Lease type in use.
      dwelling_limit: Coverage A.
      fair_rental_value_limit: Coverage D fair rental value.
      landlord_contents_limit: Coverage C landlord's furnishings.
      premises_liability_limit: Premises liability limit.
      deductible: All-other-perils deductible.
      wind_hail_deductible_pct: Wind/hail deductible percentage.
      billing_plan: Billing plan.
      mortgagee_name: Mortgagee, empty when none.
      loan_number: Loan number, empty when none.
      bound_date: Date bound.
      original_effective_date: First inception date.
      effective_date: Start of term.
      expiration_date: End of term.
      term_premium: Annual premium of the term.
    triggers:
      - event: dwelling:dwelling_premium_billed
        when: {billing_plan: mortgagee_escrow}
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date, amount: term_premium, payer: mortgagee, posted_date: bound_date}
      - event: dwelling:dwelling_premium_billed
        when: {billing_plan: {not: mortgagee_escrow}}
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date, payer: insured, posted_date: bound_date}
      - event: dwelling:dwelling_mortgagee_invoice
        when: {billing_plan: mortgagee_escrow}
        map: {term_effective_date: effective_date, due_date: effective_date, amount: term_premium, posted_date: bound_date}
      - event: dwelling:dwelling_inspection_ordered
        map: {}
  - type: dwelling_policy_activated
    target: dwelling_policies
    mutation: {transition: {from: bound, to: in_force}}
    meaning: Coverage attaches on the effective date.
    grain: One row per transaction.
    fields: {effective_date: Effective date reached.}
    triggers: []
  - type: dwelling_cancellation_noticed
    target: dwelling_policies
    mutation: {transition: {from: in_force, to: pending_cancellation}}
    meaning: A notice of cancellation is issued and copied to the mortgagee.
    grain: One row per transaction.
    fields:
      status_reason: nonpayment, uncured_condition, vacancy_without_permit or material_misrepresentation.
      pending_action_date: Scheduled cancellation date.
    triggers: []
  - type: dwelling_cancellation_rescinded
    target: dwelling_policies
    mutation: {transition: {from: pending_cancellation, to: in_force}}
    meaning: A pending cancellation is withdrawn after its cure.
    grain: One row per transaction.
    fields:
      status_reason: Reset to none.
      pending_action_date: Cleared.
    triggers: []
  - type: dwelling_policy_cancelled
    target: dwelling_policies
    mutation:
      transition:
        - {from: pending_cancellation, to: cancelled}
        - {from: in_force, to: cancelled}
        - {from: bound, to: cancelled}
    meaning: Coverage ends before expiration on a carrier notice or at the named insured's signed request.
    grain: One row per transaction.
    fields:
      policy_number: Policy number, carried unchanged.
      status_reason: Ground of the cancellation.
      closed_date: Date coverage ended.
    triggers:
      - event: dwelling:dwelling_return_premium
        map: {change_reason: cancellation, effective_date: closed_date, posted_date: closed_date}
      - event: umbrella:umbrella_underlying_lapsed
        map: {underlying_line: dwelling, underlying_policy_number: policy_number, event_date: closed_date}
  - type: dwelling_nonrenewal_noticed
    target: dwelling_policies
    mutation: {transition: {from: in_force, to: pending_nonrenewal}}
    meaning: A notice of nonrenewal is issued on an underwriting ground.
    grain: One row per transaction.
    fields:
      status_reason: uncured_condition, claim_frequency, roof_age or ineligible_occupancy.
      pending_action_date: Expiration date on which the policy will end.
    triggers: []
  - type: dwelling_nonrenewal_rescinded
    target: dwelling_policies
    mutation: {transition: {from: pending_nonrenewal, to: in_force}}
    meaning: A nonrenewal on a curable ground is withdrawn after the cure.
    grain: One row per transaction.
    fields:
      status_reason: Reset to none.
      pending_action_date: Cleared.
    triggers: []
  - type: dwelling_policy_expired
    target: dwelling_policies
    mutation:
      transition:
        - {from: pending_nonrenewal, to: expired}
        - {from: in_force, to: expired}
    meaning: The term ends without renewal.
    grain: One row per transaction.
    fields:
      policy_number: Policy number, carried unchanged.
      status_reason: Nonrenewal ground or renewal_not_paid.
      closed_date: The expiration date.
    triggers:
      - event: umbrella:umbrella_underlying_lapsed
        map: {underlying_line: dwelling, underlying_policy_number: policy_number, event_date: closed_date}
  - type: dwelling_policy_renewed
    target: dwelling_policies
    mutation: update
    meaning: The policy rolls into a new twelve-month term at the capped renewal premium, possibly on a different tier.
    grain: One row per transaction.
    fields:
      variant_name: Tier for the new term.
      effective_date: Start of the new term.
      expiration_date: End of the new term.
      dwelling_limit: Coverage A after the inflation guard.
      roof_settlement: Roof settlement basis re-evaluated for the new term.
      term_premium: Renewal term premium after the rate cap.
      indicated_renewal_premium: Cleared once the renewal takes effect.
    triggers:
      - event: dwelling:dwelling_premium_billed
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date}
  - type: dwelling_renewal_offered
    target: dwelling_policies
    mutation: update
    meaning: The rating system's indicated premium for the upcoming term is recorded when the renewal is offered.
    grain: One row per transaction.
    fields:
      indicated_renewal_premium: Premium indicated by the rating system for the upcoming term, before the rate cap.
    triggers: []
  - type: dwelling_occupancy_updated
    target: dwelling_policies
    mutation: update
    meaning: Occupancy, vacancy start or lease type on file changes as the landlord reports tenants moving out or in.
    grain: One row per transaction.
    fields:
      occupancy: Occupancy after the change.
      vacancy_start_date: First day the building became vacant, empty when occupied.
      lease_type: Lease type in use after the change.
    triggers: []
  - type: dwelling_vacancy_permit_issued
    target: dwelling_policies
    mutation: update
    meaning: A vacancy permit suspends the vacancy exclusion for a stated period.
    grain: One row per transaction.
    fields:
      vacancy_permit_start: First day of the permit.
      vacancy_permit_expiration: Last day of the permit.
    triggers:
      - event: dwelling:dwelling_additional_premium
        map: {change_reason: vacancy_permit, effective_date: vacancy_permit_start}
  - type: dwelling_property_updated
    target: dwelling_policies
    mutation: update
    meaning: Property characteristics change after documented work, such as a roof replacement.
    grain: One row per transaction.
    fields:
      roof_material: Roof material after the work.
      roof_install_year: Year the new roof was installed.
      roof_settlement: Roof settlement basis after the work.
    triggers: []
  - type: dwelling_mortgagee_changed
    target: dwelling_policies
    mutation: update
    meaning: The mortgagee is added, replaced or removed.
    grain: One row per transaction.
    fields:
      mortgagee_name: New mortgagee, empty on payoff.
      loan_number: New loan number, empty on payoff.
    triggers: []
  - type: dwelling_premium_billed
    target: dwelling_billing
    meaning: One installment of the term premium is billed.
    grain: One row per installment of a term.
    distinguish_by: [term_effective_date, installment_number]
    fields:
      term_effective_date: Term billed.
      installment_number: Installment position.
      due_date: Due date.
      amount: Installment amount.
      payer: insured or mortgagee.
      posted_date: Bill date.
    account: premium_balance
    direction: in
    triggers:
      - event: dwelling:dwelling_fee_assessed
        when: {installment_number: {not: 1}}
        map: {fee_code: installment_fee, term_effective_date: term_effective_date, installment_number: installment_number, posted_date: posted_date}
  - type: dwelling_fee_assessed
    target: dwelling_billing
    meaning: An installment, late or returned-payment fee is charged.
    grain: One row per fee.
    distinguish_by: [fee_code, term_effective_date, installment_number, source_billing_id]
    fields:
      fee_code: Fee charged.
      term_effective_date: Term of the fee.
      installment_number: Installment of the fee (0 when none).
      source_billing_id: Returned payment the fee is for; empty otherwise.
      amount: Fee amount.
      posted_date: Date charged.
    account: premium_balance
    direction: in
    triggers: []
  - type: dwelling_payment_received
    target: dwelling_billing
    meaning: A premium payment is received from the insured or the mortgagee.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      payment_reference: Confirmation or check number.
      payer: Who paid.
      payment_method: Method.
      amount: Amount.
      posted_date: Date received.
    account: premium_balance
    direction: out
    triggers: []
  - type: dwelling_payment_returned
    target: dwelling_billing
    meaning: A payment is returned unpaid and reversed.
    grain: One row per returned payment.
    distinguish_by: [source_billing_id]
    fields:
      source_billing_id: Payment reversed.
      amount: Full payment amount.
      posted_date: Date posted.
    account: premium_balance
    direction: in
    triggers:
      - event: dwelling:dwelling_fee_assessed
        map: {fee_code: returned_payment_fee, source_billing_id: dwelling_billing_id, posted_date: posted_date}
  - type: dwelling_additional_premium
    target: dwelling_billing
    meaning: Additional premium for a vacancy permit, or earned premium owed at cancellation, is charged.
    grain: One row per premium-raising change.
    distinguish_by: [change_reason, effective_date]
    fields:
      change_reason: vacancy_permit or cancellation.
      effective_date: Date the permit starts or the cancellation takes effect.
      amount: Amount charged.
      posted_date: Date charged.
    account: premium_balance
    direction: in
    triggers: []
  - type: dwelling_return_premium
    target: dwelling_billing
    meaning: Unearned premium is credited on cancellation.
    grain: One row per cancellation credit.
    distinguish_by: [change_reason, effective_date, credit_basis]
    fields:
      change_reason: cancellation.
      effective_date: Cancellation date.
      credit_basis: pro_rata, short_rate or flat.
      amount: Amount credited.
      posted_date: Date credited.
    account: premium_balance
    direction: out
    triggers: []
  - type: dwelling_refund_issued
    target: dwelling_billing
    meaning: A credit balance is refunded.
    grain: One row per refund.
    distinguish_by: [posted_date, payer]
    fields:
      payer: insured or mortgagee refunded.
      payment_method: Method.
      amount: Amount refunded.
      posted_date: Date refunded.
    account: premium_balance
    direction: in
    triggers: []
  - type: dwelling_mortgagee_invoice
    target: dwelling_billing
    meaning: The term premium is invoiced to the mortgagee for payment from escrow.
    grain: One row per mortgagee invoice per term.
    distinguish_by: [term_effective_date]
    fields:
      term_effective_date: Term invoiced.
      due_date: Due date.
      amount: Amount invoiced.
      posted_date: Date sent.
    triggers: []
  - type: dwelling_inspection_ordered
    target: dwelling_inspections
    meaning: An underwriting inspection of the rental property is ordered.
    grain: One row per inspection order.
    distinguish_by: [inspection_type, event_date]
    fields:
      inspection_type: Kind of inspection.
      event_date: Date ordered.
    triggers: []
  - type: dwelling_inspection_completed
    target: dwelling_inspections
    meaning: The inspection report is received; each finding is recorded, or one clean result.
    grain: One row per finding on a completed inspection.
    distinguish_by: [inspection_type, event_date, finding_code]
    fields:
      inspection_type: Kind of inspection.
      event_date: Date the report was received.
      finding_code: Condition found.
    triggers:
      - event: dwelling:dwelling_condition_letter_issued
        when: {finding_code: {not: none}}
        map: {finding_code: finding_code, source_entry_id: dwelling_inspection_entry_id, inspection_type: inspection_type, event_date: event_date}
  - type: dwelling_condition_letter_issued
    target: dwelling_inspections
    meaning: A letter asks the landlord to correct a finding by a cure due date.
    grain: One row per finding letter.
    distinguish_by: [source_entry_id]
    fields:
      source_entry_id: Finding the letter concerns.
      finding_code: Condition to correct.
      inspection_type: Inspection the finding came from.
      event_date: Date the letter was sent.
      cure_due_date: Last day to prove the correction.
    triggers: []
  - type: dwelling_cure_extension_granted
    target: dwelling_inspections
    meaning: The cure due date of one condition letter is extended once at the landlord's request.
    grain: One row per extended letter.
    distinguish_by: [source_entry_id]
    fields:
      source_entry_id: Condition letter extended.
      finding_code: Condition concerned.
      event_date: Date the extension was granted.
      cure_due_date: Extended cure due date.
    triggers: []
  - type: dwelling_condition_cured
    target: dwelling_inspections
    meaning: Proof that a finding was corrected is accepted.
    grain: One row per condition letter cured.
    distinguish_by: [source_entry_id]
    fields:
      source_entry_id: Condition letter cured.
      finding_code: Condition corrected.
      event_date: Date the proof was received.
    triggers:
      - event: dwelling:dwelling_property_updated
        when: {finding_code: roof_end_of_life}
        map: {}
  - type: dwelling_claim_reported
    target: dwelling_claims
    meaning: First notice of loss opens a claim number for one occurrence.
    grain: One row per claim.
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number.
      loss_date: Date of loss.
      peril: Cause of loss.
      entry_date: Date reported.
    triggers: []
  - type: dwelling_claim_payment
    target: dwelling_claims
    meaning: Claim money is issued for one coverage part and property class.
    grain: One row per payment on a coverage part and property class.
    distinguish_by: [claim_number, coverage_part, property_class, payment_type, entry_date]
    fields:
      claim_number: Claim paid.
      loss_date: Date of loss.
      peril: Cause of loss.
      coverage_part: Coverage part paid.
      property_class: Property class paid.
      payment_type: Kind of payment.
      replacement_cost_amount: Replacement-cost value after caps.
      depreciation_amount: Depreciation.
      deductible_applied: Deductible absorbed.
      vacancy_reduction: Amount removed by the vacancy reduction.
      amount: Amount paid.
      payee: Payee.
      entry_date: Date issued.
    account: indemnity_paid
    direction: in
    triggers:
      - event: dwelling:dwelling_holdback_withheld
        when: {payment_type: acv_initial}
        map: {claim_number: claim_number, coverage_part: coverage_part, property_class: property_class, amount: depreciation_amount, source_entry_id: dwelling_claim_entry_id, entry_date: entry_date}
  - type: dwelling_claim_payment_voided
    target: dwelling_claims
    meaning: An uncashed claim payment is voided.
    grain: One row per voided payment.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim of the void.
      source_entry_id: Payment voided.
      amount: Amount voided.
      entry_date: Date voided.
    account: indemnity_paid
    direction: out
    triggers: []
  - type: dwelling_holdback_withheld
    target: dwelling_claims
    meaning: Recoverable depreciation is withheld from an actual-cash-value payment.
    grain: One row per actual-cash-value payment withholding depreciation.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim.
      coverage_part: Coverage part.
      property_class: Property class.
      source_entry_id: Payment the holdback came from.
      amount: Depreciation withheld.
      entry_date: Date withheld.
    account: depreciation_holdback
    direction: in
    triggers: []
  - type: dwelling_holdback_released
    target: dwelling_claims
    meaning: Withheld depreciation is released after completed repair is documented.
    grain: One row per documented completion released against a holdback.
    distinguish_by: [source_entry_id, entry_date, incurred_amount]
    fields:
      claim_number: Claim.
      coverage_part: Coverage part.
      property_class: Property class.
      source_entry_id: Holdback released against.
      incurred_amount: Documented cost incurred.
      amount: Depreciation released.
      entry_date: Date proof accepted.
    account: depreciation_holdback
    direction: out
    triggers:
      - event: dwelling:dwelling_claim_payment
        map: {claim_number: claim_number, coverage_part: coverage_part, property_class: property_class, payment_type: recoverable_depreciation, amount: amount, entry_date: entry_date}
  - type: dwelling_holdback_forfeited
    target: dwelling_claims
    meaning: Holdback left at the end of the recovery period is forfeited.
    grain: One row per holdback forfeited.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim.
      source_entry_id: Holdback forfeited.
      amount: Remaining holdback.
      entry_date: Date forfeited.
    account: depreciation_holdback
    direction: out
    triggers: []
  - type: dwelling_claim_denied
    target: dwelling_claims
    meaning: Coverage is denied for a coverage part with a controlled reason.
    grain: One row per coverage part denied.
    distinguish_by: [claim_number, coverage_part, denial_reason]
    fields:
      claim_number: Claim.
      coverage_part: Coverage part denied.
      denial_reason: Reason.
      entry_date: Date of the denial letter.
    triggers: []
  - type: dwelling_claim_closed
    target: dwelling_claims
    meaning: The claim file is closed.
    grain: One row per closing.
    distinguish_by: [claim_number, entry_date]
    fields:
      claim_number: Claim.
      entry_date: Date closed.
    triggers: []

measures:
  - id: dwelling_msr_amount_due
    window: All entries of the policy up to and including the evaluation date.
    measure: Sum of dwelling_premium_billed amounts due on or before the evaluation date plus dwelling_fee_assessed, dwelling_payment_returned, dwelling_additional_premium and dwelling_refund_issued amounts posted on or before it, minus dwelling_payment_received and dwelling_return_premium amounts posted on or before it, floored at 0.00.
  - id: dwelling_msr_paid_claims
    window: The claims_lookback_months calendar months ending on the nonrenewal notice date.
    measure: Count of distinct claim_number values on this policy's property with at least one unvoided dwelling_claim_payment entry in the window, wind_hail and lightning claims included.
  - id: dwelling_msr_live_policies
    window: As of the evaluation date (binding or the renewal offer date).
    measure: Count of the customer's dwelling policies whose status is bound, in force, pending cancellation or pending nonrenewal, including the policy being evaluated.
  - id: dwelling_msr_vacant_days
    window: From vacancy_start_date up to the evaluation date (a date of loss or a notice date).
    measure: Consecutive calendar days the building has been vacant, counting vacancy_start_date as day 1, excluding days inside a vacancy permit.

policies:
  - id: dwelling_agg_multi_holding
    subject: [dwelling_policy_bound]
    rule: >-
      A landlord may insure up to max_per_customer rental buildings, one LandlordGuard policy per building address, counted across every dwelling policy in the customer's name; a live policy is one that is bound, in force, pending cancellation or pending nonrenewal.
      No other dwelling policy that is bound, in force, pending cancellation or pending nonrenewal covers the same property address.
    eligibility:
      - id: property_not_already_insured
        applies_to: [dwelling_policy_bound]
        kind: dedup
        condition: "No other dwelling policy that is bound, in force, pending cancellation or pending nonrenewal covers the same property address."
        evidence_fields: [dwelling_policies.property_address, dwelling_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_policies.property_address]]
          action_bindings: {dwelling_policies.property_address: property_address}
        dedup_contract:
          table: dwelling_policies
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [bound, in_force, pending_cancellation, pending_nonrenewal]}
          distinct_fields: []
    params: {max_per_customer: 12}

  - id: dwelling_agg_portfolio_tier
    subject: [dwelling_policy_bound, dwelling_policy_renewed]
    rule: >-
      LandlordGuard DP-3 Portfolio is a book-of-business tier: it is written only while dwelling_msr_live_policies is at least min_live_dwelling_policies across the customer's LandlordGuard policies, the new policy included.
      The count is taken at binding and again on each Portfolio policy's renewal offer date; when it has fallen below the minimum, that policy renews on LandlordGuard DP-3 Premier, with its indicated renewal premium rated for Premier and the renewal rate cap applied to it, and nothing changes midterm.
      Claims history is judged per property, never pooled across the portfolio.
    eligibility: []
    params: {min_live_dwelling_policies: 3, fallback_tier: LandlordGuard DP-3 Premier}
    measures: [dwelling_msr_live_policies]

  - id: dwelling_bind_eligibility
    subject: [dwelling_policy_bound, dwelling_policy_activated]
    rule: >-
      A LandlordGuard policy insures a building rented to others; the named insured's own primary residence is insured under HomeGuard instead, and a condominium unit rented to others under CondoGuard with the unit rental endorsement where its tier allows.
      The building has no more than the tier's max_units dwelling units and is let only on a lease type in lease_types_allowed.
      A lease shorter than short_term_rental_min_days is a short-term rental.
      The roof age and building age at the effective date are within max_roof_age_new_business_years and max_home_age_new_business_years.
      Coverage A lies within min_dwelling_limit and max_dwelling_limit; fair_rental_value_limit is fair_rental_value_pct of Coverage A; landlord_contents_limit is at most landlord_contents_max; premises liability, deductible and wind/hail percentage are chosen from the tier's options; the billing plan is one of billing_plans_allowed.
      roof_settlement is replacement_cost when the roof age at the effective date is at or below roof_rc_max_age_years and roof_surfacing_schedule otherwise.
      A bound policy moves to in_force on its effective date; the term runs twelve calendar months.
    eligibility:
      - id: units_and_lease
        applies_to: [dwelling_policy_bound]
        kind: caller_fact
        condition: "The building has no more than the tier's max_units dwelling units and is let only on a lease type in lease_types_allowed."
        evidence_fields: [dwelling_policies.units, dwelling_policies.lease_type, dwelling_policies.customer_id, dwelling_policies.property_address]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[dwelling_policies.customer_id, dwelling_policies.property_address]]
          action_bindings: {dwelling_policies.customer_id: customer_id, dwelling_policies.property_address: property_address}
      - id: roof_and_age
        applies_to: [dwelling_policy_bound]
        kind: caller_fact
        condition: "The roof age and building age at the effective date are within max_roof_age_new_business_years and max_home_age_new_business_years."
        evidence_fields: [dwelling_policies.roof_install_year, dwelling_policies.year_built, dwelling_policies.effective_date, dwelling_policies.customer_id, dwelling_policies.property_address]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[dwelling_policies.customer_id, dwelling_policies.property_address]]
          action_bindings: {dwelling_policies.customer_id: customer_id, dwelling_policies.property_address: property_address}

  - id: dwelling_billing_and_payments
    subject: [dwelling_premium_billed, dwelling_fee_assessed, dwelling_payment_received, dwelling_payment_returned, dwelling_refund_issued, dwelling_mortgagee_invoice, dwelling_mortgagee_changed]
    rule: >-
      Each term is billed on its plan's schedule: annual in one installment due on the term effective date, two_pay in two installments six calendar months apart, quarterly in four installments three calendar months apart, and mortgagee_escrow as one installment to the mortgagee with a mortgagee invoice of the same amount and due date; each later installment is the term premium divided by the installment count rounded half-up to the cent, and installment 1 takes the difference.
      Installments are billed only while the policy is bound, in force, pending cancellation or pending nonrenewal.
      installment_fee_direct is charged on each installment after the first; a late fee once per installment still unpaid more than late_fee_grace_days calendar days after its due date; a returned-payment fee once per returned payment; none of these on a mortgagee-billed term, and none when the tier amount is 0.00.
      Payments apply oldest charge first and are recorded with their confirmation or check number exactly as issued; a returned payment reverses the one payment it references in full.
      A refund is issued only when the premium balance is a credit of at least refund_minimum, to the payer of the most recent payment.
      A mortgagee change is recorded only with the mortgagee's name and loan number exactly as on the mortgage statement.
    eligibility:
      - id: billable_status
        applies_to: [dwelling_premium_billed]
        kind: state
        condition: "Installments are billed only while the policy is bound, in force, pending cancellation or pending nonrenewal."
        evidence_fields: [dwelling_policies.status, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_policies.dwelling_policy_id]]
          action_bindings: {dwelling_policies.dwelling_policy_id: dwelling_policy_id}
        state_contract:
          field: dwelling_policies.status
          allowed: [bound, in_force, pending_cancellation, pending_nonrenewal]
    params:
      installments_per_plan: {annual: 1, two_pay: 2, quarterly: 4, mortgagee_escrow: 1}
    measures: [dwelling_msr_amount_due]

  - id: dwelling_cancellation
    subject: [dwelling_cancellation_noticed, dwelling_cancellation_rescinded, dwelling_policy_cancelled, dwelling_return_premium, dwelling_additional_premium]
    rule: >-
      The carrier cancels midterm only for nonpayment, for an inspection finding left uncured inside the new business period, for vacancy without a permit beyond vacancy_cancel_days, or for material misrepresentation.
      A nonpayment notice is issued once an installment is still unpaid more than nonpayment_notice_after_due_days calendar days after its due date, with the cancellation scheduled nonpayment_cancel_notice_days later, and is rescinded only by payments before that date totalling at least dwelling_msr_amount_due as of the notice date.
      An underwriting cancellation notice for an uncured condition is issued only within the new business period that starts on the original effective date.
      The new business period is counted in calendar days with the original effective date as day 1, so the last day to issue the notice is the original effective date plus new_business_period_days minus 1.
      A vacancy cancellation notice is issued only after the vacancy period that starts on the vacancy start date.
      The vacancy period is counted with the vacancy start date as day 1, so the notice may be issued once dwelling_msr_vacant_days exceeds vacancy_cancel_days.
      An underwriting or vacancy notice schedules the cancellation underwriting_cancel_notice_days after the notice date and never sooner than mortgagee_notice_days when a mortgagee is on file; a vacancy notice is rescinded when a tenant moves in or a vacancy permit is issued before that date, and an uncured-condition notice when the condition is cured before that date.
      The named insured cancels only by a signed request, effective no earlier than the date it is received; a cancellation on or before the effective date of a bound policy is flat.
      The cancellation is processed only on a request the named insured has signed.
      On a named-insured cancellation the pro-rata unearned premium is term_premium multiplied by the calendar days from the cancellation date to the expiration date and divided by the calendar days in the term, rounded half-up to the cent; under short_rate the carrier keeps short_rate_retention_pct of it; the credit is the returnable amount minus the term's scheduled installments not yet billed, reduced if needed so that the premium kept for the term is at least minimum_earned_premium; a negative result is billed as dwelling_additional_premium with change_reason cancellation.
      A carrier cancellation credits pro rata with no retention and no minimum earned premium.
    eligibility:
      - id: new_business_period
        applies_to: [dwelling_cancellation_noticed]
        kind: time
        condition: "An underwriting cancellation notice for an uncured condition is issued only within the new business period that starts on the original effective date."
        evidence_fields: [dwelling_policies.original_effective_date, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_policies.dwelling_policy_id]]
          action_bindings: {dwelling_policies.dwelling_policy_id: dwelling_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the original effective date
          anchor_source: dwelling_policies.original_effective_date
          relation: not_after
          duration_source: variants.new_business_period_days
          unit: calendar_days
          counting_rule: "The new business period is counted in calendar days with the original effective date as day 1, so the last day to issue the notice is the original effective date plus new_business_period_days minus 1."
          boundary: exclusive
      - id: vacancy_period
        applies_to: [dwelling_cancellation_noticed]
        kind: time
        condition: "A vacancy cancellation notice is issued only after the vacancy period that starts on the vacancy start date."
        evidence_fields: [dwelling_policies.vacancy_start_date, dwelling_policies.vacancy_permit_expiration, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_policies.dwelling_policy_id]]
          action_bindings: {dwelling_policies.dwelling_policy_id: dwelling_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the vacancy start date
          anchor_source: dwelling_policies.vacancy_start_date
          relation: not_before
          duration_source: variants.vacancy_cancel_days
          unit: calendar_days
          counting_rule: "The vacancy period is counted with the vacancy start date as day 1, so the notice may be issued once dwelling_msr_vacant_days exceeds vacancy_cancel_days."
          boundary: inclusive
      - id: signed_request
        applies_to: [dwelling_policy_cancelled]
        kind: authorization
        condition: "The cancellation is processed only on a request the named insured has signed."
        evidence_fields: [dwelling_requests.dwelling_request_id, dwelling_requests.request_type, dwelling_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_requests.dwelling_request_id]]
          action_bindings: {dwelling_requests.dwelling_request_id: dwelling_request_id}
    measures: [dwelling_msr_amount_due, dwelling_msr_vacant_days]

  - id: dwelling_occupancy_and_vacancy
    subject: [dwelling_occupancy_updated, dwelling_vacancy_permit_issued, dwelling_additional_premium]
    rule: >-
      The landlord reports when the building becomes vacant, recording vacancy_start_date as the first day without a tenant in residence, and when a tenant moves in, which clears it; a building under renovation with no tenant is vacant.
      A vacancy permit is issued only on a tier whose vacancy_permit_available is true, for no more than vacancy_permit_max_days, starting no earlier than the date it is requested and never retroactively.
      A vacancy permit starts no earlier than the date the landlord requests it.
      The permit charge is term_premium multiplied by vacancy_permit_rate_pct, by the permit days and divided by the calendar days in the term, rounded half-up to the cent, posted as one dwelling_additional_premium entry with change_reason vacancy_permit dated the permit start.
      A lease type outside lease_types_allowed, including any short-term rental on a tier that does not list short_term, makes the building ineligible; the landlord must return to an allowed lease type or the policy is nonrenewed as ineligible_occupancy at the next renewal.
    eligibility:
      - id: permit_not_retroactive
        applies_to: [dwelling_vacancy_permit_issued]
        kind: caller_fact
        condition: "A vacancy permit starts no earlier than the date the landlord requests it."
        evidence_fields: [dwelling_policies.vacancy_permit_start, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[dwelling_policies.dwelling_policy_id]]
          action_bindings: {dwelling_policies.dwelling_policy_id: dwelling_policy_id}
    formula:
      vacancy_permit_charge: "term_premium * vacancy_permit_rate_pct / 100"

  - id: dwelling_inspections_and_conditions
    subject: [dwelling_inspection_ordered, dwelling_inspection_completed, dwelling_condition_letter_issued, dwelling_cure_extension_granted, dwelling_condition_cured, dwelling_property_updated]
    rule: >-
      Every new policy receives one inspection of the tier's new_business_inspection_type, ordered no later than inspection_order_days after the bound date; a roof_reinspection is ordered only to confirm a reported roof replacement.
      Inspections are ordered only while the policy is bound or in force.
      Each finding other than none receives one condition letter whose cure due date is the inspection completion date plus inspection_cure_days calendar days.
      A cure extension is granted once per letter, for cure_extension_days, only when the landlord asks for it on or before the letter's current cure due date and only on a tier whose cure_extension_days is above 0.
      A letter that has already been extended is never extended again.
      A condition is cured only when the proof of correction is received no later than the cure due date on the letter, as extended.
      Proof is photographs or a contractor invoice for hazard findings (missing_smoke_detectors, missing_handrails, unsecured_vacant_openings, deferred_maintenance, debris_hazard, roof_defect) and a completed roof_reinspection or a licensed electrician's certificate for eligibility findings (roof_end_of_life, knob_and_tube_wiring, fuse_panel).
      When a roof_end_of_life finding is cured by a new roof, the roof on file is updated and roof_settlement becomes replacement_cost where the tier's roof_rc_max_age_years is above 0.
      A finding left uncured after its cure due date supports cancellation inside the new business period and nonrenewal afterwards; it never changes how a claim is paid.
    eligibility:
      - id: order_status
        applies_to: [dwelling_inspection_ordered]
        kind: state
        condition: "Inspections are ordered only while the policy is bound or in force."
        evidence_fields: [dwelling_policies.status, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_policies.dwelling_policy_id]]
          action_bindings: {dwelling_policies.dwelling_policy_id: dwelling_policy_id}
        state_contract:
          field: dwelling_policies.status
          allowed: [bound, in_force]
      - id: extended_once
        applies_to: [dwelling_cure_extension_granted]
        kind: dedup
        condition: "A letter that has already been extended is never extended again."
        evidence_fields: [dwelling_inspections.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_inspections.source_entry_id]]
          action_bindings: {dwelling_inspections.source_entry_id: source_entry_id}
        dedup_contract:
          table: dwelling_inspections
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [dwelling_cure_extension_granted]}
          distinct_fields: []
      - id: cure_deadline
        applies_to: [dwelling_condition_cured]
        kind: caller_fact
        condition: "A condition is cured only when the proof of correction is received no later than the cure due date on the letter, as extended."
        evidence_fields: [dwelling_inspections.cure_due_date, dwelling_inspections.event_date, dwelling_inspections.source_entry_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[dwelling_inspections.source_entry_id]]
          action_bindings: {dwelling_inspections.source_entry_id: source_entry_id}

  - id: dwelling_nonrenewal
    subject: [dwelling_nonrenewal_noticed, dwelling_nonrenewal_rescinded, dwelling_policy_expired]
    rule: >-
      The carrier nonrenews only on these grounds, recorded in this order of precedence when several hold on the notice date: uncured_condition (a finding left uncured past its cure due date), claim_frequency (dwelling_msr_paid_claims at or above paid_claims_nonrenewal_threshold), roof_age (a roof older than roof_nonrenewal_age_years at the upcoming effective date) and ineligible_occupancy (a lease type the tier does not allow).
      A notice of nonrenewal is valid only when it is issued no later than the nonrenewal notice deadline before the expiration date.
      The nonrenewal notice deadline is the expiration date minus nonrenewal_notice_days calendar days, and a notice issued on the deadline itself is on time.
      A ground found after the deadline waits for the following term.
      A notice on uncured_condition, roof_age or ineligible_occupancy is rescinded before the expiration date once the ground is cured (the condition cured, the roof replaced, an allowed lease restored); a claim_frequency notice is never rescinded.
      On the expiration date a policy under notice expires and keeps its status_reason.
    eligibility:
      - id: notice_deadline
        applies_to: [dwelling_nonrenewal_noticed]
        kind: time
        condition: "A notice of nonrenewal is valid only when it is issued no later than the nonrenewal notice deadline before the expiration date."
        evidence_fields: [dwelling_policies.expiration_date, dwelling_policies.dwelling_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_policies.dwelling_policy_id]]
          action_bindings: {dwelling_policies.dwelling_policy_id: dwelling_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the expiration date
          anchor_source: dwelling_policies.expiration_date
          relation: not_after
          duration_source: variants.nonrenewal_notice_days
          unit: calendar_days
          counting_rule: "The nonrenewal notice deadline is the expiration date minus nonrenewal_notice_days calendar days, and a notice issued on the deadline itself is on time."
          boundary: inclusive
    params: {roof_nonrenewal_age_years: 30}
    measures: [dwelling_msr_paid_claims]

  - id: dwelling_renewal
    subject: [dwelling_renewal_offered, dwelling_policy_renewed, dwelling_policy_expired]
    rule: >-
      When the renewal is offered, renewal_offer_lead_days before expiration, the rating system's indicated premium for the upcoming term is recorded as indicated_renewal_premium, and renewal installment 1 is billed on the capped premium.
      The renewal term premium is the smaller of indicated_renewal_premium and the expiring term_premium increased by renewal_rate_cap_pct, rounded half-up to the cent; the cap never lowers a premium below the indicated amount when the indicated amount is itself lower.
      At renewal Coverage A is increased by inflation_guard_pct, rounded up to the next 1,000 USD and capped at max_dwelling_limit, and roof_settlement is re-evaluated on the roof age at the new effective date.
      The policy renews for twelve calendar months when renewal installment 1 is paid by the expiration date; otherwise it expires with status_reason renewal_not_paid.
    eligibility: []
    params:
      per_tier:
        LandlordGuard DP-1 Basic: {rate_cap_pct: "=renewal_rate_cap_pct", inflation_guard_pct: "=inflation_guard_pct"}
        LandlordGuard DP-2 Broad: {rate_cap_pct: "=renewal_rate_cap_pct", inflation_guard_pct: "=inflation_guard_pct"}
        LandlordGuard DP-3 Special: {rate_cap_pct: "=renewal_rate_cap_pct", inflation_guard_pct: "=inflation_guard_pct"}
        LandlordGuard DP-3 Special Plus: {rate_cap_pct: "=renewal_rate_cap_pct", inflation_guard_pct: "=inflation_guard_pct"}
        LandlordGuard DP-3 Premier: {rate_cap_pct: "=renewal_rate_cap_pct", inflation_guard_pct: "=inflation_guard_pct"}
        LandlordGuard DP-3 Portfolio: {rate_cap_pct: "=renewal_rate_cap_pct", inflation_guard_pct: "=inflation_guard_pct"}
    formula:
      renewal_term_premium: "min(indicated_renewal_premium, round(term_premium * (1 + renewal_rate_cap_pct / 100), 2))"

  - id: dwelling_claim_settlement
    subject: [dwelling_claim_reported, dwelling_claim_payment, dwelling_holdback_withheld, dwelling_claim_denied, dwelling_claim_closed, dwelling_claim_payment_voided]
    rule: >-
      A loss is covered only when its date falls within a term during which the policy was in force, and only for perils of the tier's dwelling_perils basis.
      When dwelling_msr_vacant_days on the date of loss exceeds vacancy_exclusion_days and no vacancy permit covers that date, vandalism and glass breakage are denied with vacancy_exclusion and every other covered loss is reduced by vacancy_settlement_reduction_pct before the deductible, the reduction being recorded as vacancy_reduction.
      Losses arising from a short-term rental on a tier that does not allow short_term are denied with short_term_rental.
      One deductible applies per occurrence: the larger of wind_hail_deductible_pct of Coverage A and wind_hail_deductible_floor for wind_hail, and the policy deductible otherwise, absorbed first by dwelling, then other_structures, then landlord_contents.
      On a DP-1 tier the dwelling is paid actual_cash_value_final with nothing withheld; on other tiers a part whose RC is at or below rc_no_holdback_threshold is paid replacement_cost_full, otherwise acv_initial with depreciation withheld in one dwelling_holdback_withheld entry; roof surfacing on roof_surfacing_schedule is paid as roof_schedule at the schedule percentage, never withheld; landlord contents follow landlord_contents_settlement and theft of them is covered only where landlord_theft_included is true.
      Fair rental value is paid monthly as rent actually lost while the building is unfit to rent, up to fair_rental_value_limit and fair_rental_value_max_months, with no deductible.
      A dwelling payment of mortgagee_copayee_threshold or more names the mortgagee as co-payee when one is on file.
      A payment that has already been voided is never voided again.
    eligibility:
      - id: voided_once
        applies_to: [dwelling_claim_payment_voided]
        kind: dedup
        condition: "A payment that has already been voided is never voided again."
        evidence_fields: [dwelling_claims.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_claims.source_entry_id]]
          action_bindings: {dwelling_claims.source_entry_id: source_entry_id}
        dedup_contract:
          table: dwelling_claims
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [dwelling_claim_payment_voided]}
          distinct_fields: []
    params:
      wind_hail_deductible_floor: 1000
      roof_payment_schedule: {"0-12": 100, "13-15": 80, "16-18": 65, "19-21": 50, "22-25": 40, "26+": "=roof_schedule_min_pct"}
    formula:
      vacancy_reduction_amount: "round(replacement_cost_amount * vacancy_settlement_reduction_pct / 100, 2)"
      acv_payment: "replacement_cost_amount - depreciation_amount - vacancy_reduction - deductible_applied"
    measures: [dwelling_msr_vacant_days]

  - id: dwelling_depreciation_recovery
    subject: [dwelling_holdback_released, dwelling_holdback_forfeited]
    rule: >-
      The holdback is released only when proof of completed repair is received no later than the depreciation recovery period that starts on the date of the initial actual-cash-value payment.
      The depreciation recovery period is counted in calendar days from the date of the initial actual-cash-value payment, and proof received on the last day is on time.
      The release is the smaller of the remaining holdback and the documented incurred cost (capped at RC) minus the actual cash value, never below 0.00; holdback left when the period ends is forfeited in one entry.
    eligibility:
      - id: recovery_period
        applies_to: [dwelling_holdback_released]
        kind: time
        condition: "The holdback is released only when proof of completed repair is received no later than the depreciation recovery period that starts on the date of the initial actual-cash-value payment."
        evidence_fields: [dwelling_claims.entry_date, dwelling_claims.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[dwelling_claims.source_entry_id]]
          action_bindings: {dwelling_claims.source_entry_id: source_entry_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the initial actual-cash-value payment
          anchor_source: dwelling_claims.entry_date
          relation: not_after
          duration_source: variants.depreciation_recovery_days
          unit: calendar_days
          counting_rule: "The depreciation recovery period is counted in calendar days from the date of the initial actual-cash-value payment, and proof received on the last day is on time."
          boundary: inclusive
    formula:
      release_amount: "max(0, min(depreciation_holdback, min(incurred_amount, replacement_cost_amount) - (replacement_cost_amount - depreciation_amount)))"

extended_policies:
  - id: dwelling_ext_vacancy_permit_charge
    base_policy_refs: [dwelling_cancellation, dwelling_occupancy_and_vacancy]
    overwrite:
      - base_policy: dwelling_occupancy_and_vacancy
        superseded_clause: >-
          The permit charge is term_premium multiplied by vacancy_permit_rate_pct, by the permit days and divided by the calendar days in the term, rounded half-up to the cent, posted as one dwelling_additional_premium entry with change_reason vacancy_permit dated the permit start.
        replaced_by: >-
          The vacancy permit charge is the policy's term_premium multiplied by the permit rate percentage divided by 100, by the charged permit days and divided by the calendar days in the term (counted from the effective date to the expiration date), rounded half-up to the cent once, on the final figure, and it is posted as one additional premium entry for the vacancy permit dated the permit start.
    trigger: on_request
    subject: [dwelling_additional_premium]
    computes: charge
    target_tool: issue_vacancy_permit_2309bb3c
    params:
      lookback_months: 36
      prior_permit_two_plus_pts: 10
      prior_permit_one_pts: 5
      building_over_100_pts: 10
      building_over_70_pts: 5
      vacancy_loss_two_plus_pts: 8
      vacancy_loss_one_pts: 4
      tenure_84_credit_pts: 5
      tenure_36_credit_pts: 2
      month_block_days: 30
      week_block_days: 7
    rule: >-
      A vacancy permit requested by the landlord starts on the date of the request and runs through the day before the policy's expiration date, or for vacancy_permit_max_days if that is shorter; its permit days are those calendar days, both the first and the last day counted.
      The vacancy permit charge is the policy's term_premium multiplied by the permit rate percentage divided by 100, by the charged permit days and divided by the calendar days in the term (counted from the effective date to the expiration date), rounded half-up to the cent once, on the final figure, and it is posted as one additional premium entry for the vacancy permit dated the permit start.
      The standard permit rate percentage is the tier's vacancy_permit_rate_pct, and the charged permit days are the permit days themselves.
      The permit rate percentage is the tier's vacancy_permit_rate_pct plus the prior-permit points, plus the building-age points, plus the vacancy-loss points, minus the landlord-tenure credit points, all added together before the rate is applied once.
      Prior-permit points reflect repeated vacancy on the building: two or more vacancy permit charges posted on the policy in the 36 calendar months up to the request date add 10 points, exactly one such charge adds 5 points, and a policy with none adds no points.
      Building-age points reflect how an empty older building deteriorates: a building more than 100 years old on the request date, its age counted in whole months from January 1 of the year built, adds 10 points, one more than 70 but not more than 100 years old adds 5 points, and a building 70 years old or younger adds no points.
      Vacancy-loss points reflect losses typical of an empty building: two or more claims reported on the policy for freeze, vandalism or glass breakage with a loss date in the 36 calendar months up to the request date add 8 points, exactly one such claim adds 4 points, and a policy with no such claim adds no points; claims for other causes of loss are not counted.
      The landlord-tenure credit reflects the landlord's continuous time with the carrier on this building: a policy whose original effective date is at least 84 whole months before the request date takes 5 points off, one insured at least 36 but fewer than 84 whole months takes 2 points off, and one insured fewer than 36 whole months takes nothing off.
      How the charged permit days are counted depends on how long the building has already stood vacant on the permit start, counting the vacancy start date as day 1: a building vacant more than vacancy_exclusion_days is charged in whole 30-day blocks, the permit days rounded up to the next multiple of 30; a building vacant more than 30 days but not more than vacancy_exclusion_days is charged in whole 7-day weeks, the permit days rounded up to the next multiple of 7; and a building vacant 30 days or fewer is charged for the permit days themselves.
    prerequisite: []
    cross_category: []
    compute:
      - permit_days: "MN(DAYS(NOW, F('expiration_date')), P('vacancy_permit_max_days'))"
      - term_days: "DAYS(F('effective_date'), F('expiration_date'))"
      - n_prior_permits: "COUNT('dwelling_billing', within_months=K('lookback_months'), date_field='posted_date', event_type='dwelling_additional_premium', change_reason='vacancy_permit')"
      - prior_permit_pts: "K('prior_permit_two_plus_pts') if n_prior_permits >= 2 else (K('prior_permit_one_pts') if n_prior_permits == 1 else 0)"
      - building_months: "MONTHS(F('year_built') + '-01-01', NOW)"
      - building_pts: "K('building_over_100_pts') if building_months > 1200 else (K('building_over_70_pts') if building_months > 840 else 0)"
      - n_vacancy_losses: "COUNT('dwelling_claims', within_months=K('lookback_months'), date_field='loss_date', event_type='dwelling_claim_reported', peril='freeze') + COUNT('dwelling_claims', within_months=K('lookback_months'), date_field='loss_date', event_type='dwelling_claim_reported', peril='vandalism') + COUNT('dwelling_claims', within_months=K('lookback_months'), date_field='loss_date', event_type='dwelling_claim_reported', peril='glass_breakage')"
      - vacancy_loss_pts: "K('vacancy_loss_two_plus_pts') if n_vacancy_losses >= 2 else (K('vacancy_loss_one_pts') if n_vacancy_losses == 1 else 0)"
      - tenure_months: "MONTHS(F('original_effective_date'), NOW)"
      - tenure_credit_pts: "K('tenure_84_credit_pts') if tenure_months >= 84 else (K('tenure_36_credit_pts') if tenure_months >= 36 else 0)"
      - vacant_days_at_start: "DAYS(F('vacancy_start_date'), NOW) + 1"
      - charged_days: "(-(-permit_days // K('month_block_days'))) * K('month_block_days') if vacant_days_at_start > P('vacancy_exclusion_days') else ((-(-permit_days // K('week_block_days'))) * K('week_block_days') if vacant_days_at_start > K('month_block_days') else permit_days)"
      - permit_rate_pct: "P('vacancy_permit_rate_pct') + prior_permit_pts + building_pts + vacancy_loss_pts - tenure_credit_pts"
      - result: "RND(F('term_premium') * permit_rate_pct / 100 * charged_days / term_days, 2)"
    compute_basis:
      permit_days: "A vacancy permit requested by the landlord starts on the date of the request and runs through the day before the policy's expiration date, or for vacancy_permit_max_days if that is shorter; its permit days are those calendar days, both the first and the last day counted."
      term_days: "divided by the calendar days in the term (counted from the effective date to the expiration date)"
      n_prior_permits: "two or more vacancy permit charges posted on the policy in the 36 calendar months up to the request date add 10 points, exactly one such charge adds 5 points, and a policy with none adds no points."
      prior_permit_pts: "Prior-permit points reflect repeated vacancy on the building: two or more vacancy permit charges posted on the policy in the 36 calendar months up to the request date add 10 points, exactly one such charge adds 5 points, and a policy with none adds no points."
      building_months: "its age counted in whole months from January 1 of the year built"
      building_pts: "a building more than 100 years old on the request date, its age counted in whole months from January 1 of the year built, adds 10 points, one more than 70 but not more than 100 years old adds 5 points, and a building 70 years old or younger adds no points."
      n_vacancy_losses: "two or more claims reported on the policy for freeze, vandalism or glass breakage with a loss date in the 36 calendar months up to the request date add 8 points, exactly one such claim adds 4 points, and a policy with no such claim adds no points; claims for other causes of loss are not counted."
      vacancy_loss_pts: "Vacancy-loss points reflect losses typical of an empty building: two or more claims reported on the policy for freeze, vandalism or glass breakage with a loss date in the 36 calendar months up to the request date add 8 points, exactly one such claim adds 4 points, and a policy with no such claim adds no points"
      tenure_months: "a policy whose original effective date is at least 84 whole months before the request date"
      tenure_credit_pts: "The landlord-tenure credit reflects the landlord's continuous time with the carrier on this building: a policy whose original effective date is at least 84 whole months before the request date takes 5 points off, one insured at least 36 but fewer than 84 whole months takes 2 points off, and one insured fewer than 36 whole months takes nothing off."
      vacant_days_at_start: "How the charged permit days are counted depends on how long the building has already stood vacant on the permit start, counting the vacancy start date as day 1"
      charged_days: "a building vacant more than vacancy_exclusion_days is charged in whole 30-day blocks, the permit days rounded up to the next multiple of 30; a building vacant more than 30 days but not more than vacancy_exclusion_days is charged in whole 7-day weeks, the permit days rounded up to the next multiple of 7; and a building vacant 30 days or fewer is charged for the permit days themselves."
      permit_rate_pct: "The permit rate percentage is the tier's vacancy_permit_rate_pct plus the prior-permit points, plus the building-age points, plus the vacancy-loss points, minus the landlord-tenure credit points, all added together before the rate is applied once."
      result: "The vacancy permit charge is the policy's term_premium multiplied by the permit rate percentage divided by 100, by the charged permit days and divided by the calendar days in the term (counted from the effective date to the expiration date), rounded half-up to the cent once, on the final figure"
    factors:
      - id: prior_permits
        effect: parameter
        decides: prior_permit_pts
        bindings: [n_prior_permits, prior_permit_pts]
        ladder:
          - when: "two or more vacancy permit charges posted on the policy in the 36 calendar months up to the request date"
            value: "K('prior_permit_two_plus_pts') = 10 points"
          - when: "exactly one vacancy permit charge posted in that window"
            value: "K('prior_permit_one_pts') = 5 points"
          - when: "otherwise (no vacancy permit charge in that window)"
            value: "0 points"
        baseline:
          prior_permit_pts: "0"
        evidence: [history]
        cross_difficulty: null
      - id: building_age
        effect: parameter
        decides: building_pts
        bindings: [building_months, building_pts]
        ladder:
          - when: "building more than 100 years old on the request date (more than 1200 whole months from January 1 of the year built)"
            value: "K('building_over_100_pts') = 10 points"
          - when: "building more than 70 but not more than 100 years old"
            value: "K('building_over_70_pts') = 5 points"
          - when: "otherwise (70 years old or younger)"
            value: "0 points"
        baseline:
          building_pts: "0"
        evidence: [date]
        cross_difficulty: null
      - id: vacancy_losses
        effect: parameter
        decides: vacancy_loss_pts
        bindings: [n_vacancy_losses, vacancy_loss_pts]
        ladder:
          - when: "two or more freeze, vandalism or glass breakage claims with a loss date in the 36 calendar months up to the request date"
            value: "K('vacancy_loss_two_plus_pts') = 8 points"
          - when: "exactly one such claim in that window"
            value: "K('vacancy_loss_one_pts') = 4 points"
          - when: "otherwise (no such claim in that window)"
            value: "0 points"
        baseline:
          vacancy_loss_pts: "0"
        evidence: [history]
        cross_difficulty: null
      - id: landlord_tenure
        effect: parameter
        decides: tenure_credit_pts
        bindings: [tenure_months, tenure_credit_pts]
        ladder:
          - when: "original effective date at least 84 whole months before the request date"
            value: "K('tenure_84_credit_pts') = 5 points off"
          - when: "original effective date at least 36 but fewer than 84 whole months before the request date"
            value: "K('tenure_36_credit_pts') = 2 points off"
          - when: "otherwise (fewer than 36 whole months)"
            value: "0 points off"
        baseline:
          tenure_credit_pts: "0"
        evidence: [date]
        cross_difficulty: null
      - id: charge_day_count
        effect: method
        decides: charged_days
        bindings: [vacant_days_at_start, charged_days]
        ladder:
          - when: "building vacant more than vacancy_exclusion_days on the permit start (vacancy start date as day 1)"
            method: "permit days rounded up to the next multiple of 30 (whole 30-day blocks)"
          - when: "building vacant more than 30 days but not more than vacancy_exclusion_days on the permit start"
            method: "permit days rounded up to the next multiple of 7 (whole weeks)"
          - when: "otherwise (vacant 30 days or fewer)"
            method: "the permit days themselves"
        baseline:
          charged_days: "permit_days"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        A vacancy permit requested by the landlord starts on the date of the request and runs through the day before the policy's expiration date, or for vacancy_permit_max_days if that is shorter; its permit days are those calendar days, both the first and the last day counted.
        The vacancy permit charge is the policy's term_premium multiplied by the permit rate percentage divided by 100, by the charged permit days and divided by the calendar days in the term (counted from the effective date to the expiration date), rounded half-up to the cent once, on the final figure, and it is posted as one additional premium entry for the vacancy permit dated the permit start.
        The standard permit rate percentage is the tier's vacancy_permit_rate_pct, and the charged permit days are the permit days themselves.
      params: [vacancy_permit_rate_pct, vacancy_permit_max_days]
    inputs:
      history:
        - {table: dwelling_billing, aggregate: count, field: amount, within_months: 36, filters: {event_type: dwelling_additional_premium, change_reason: vacancy_permit}}
        - {table: dwelling_claims, aggregate: count, field: peril, within_months: 36, filters: {event_type: dwelling_claim_reported, peril: [freeze, vandalism, glass_breakage]}}
      cross_category: []

  - id: dwelling_ext_renewal_indication
    base_policy_refs: [dwelling_renewal]
    overwrite:
      - base_policy: dwelling_renewal
        superseded_clause: >-
          When the renewal is offered, renewal_offer_lead_days before expiration
        replaced_by: >-
          A renewal that has reached renewal_offer_lead_days before expiration without an indicated renewal premium on the policy is offered on the day it is found, and the offer date is that day.
      - base_policy: dwelling_renewal
        superseded_clause: >-
          the rating system's indicated premium for the upcoming term is recorded as indicated_renewal_premium
        replaced_by: >-
          When the renewal is offered, the indicated renewal premium for the upcoming term is the expiring term_premium increased by the tier's inflation_guard_pct and then by the rating percentage, rounded half-up to the cent once, on the final figure.
    trigger: state_due
    subject: [dwelling_renewal_offered]
    computes: indicated_renewal_premium
    target_tool: record_renewal_indication_d716047a
    params:
      claims_two_plus_pct: 20
      claims_one_pct: 10
      maintenance_multiplier: 1.5
      weather_multiplier: 0.5
      roof_over_20_pct: 12
      roof_over_15_pct: 6
      vacancy_annual_pct: 8
      account_both_credit_pct: 7
      account_one_credit_pct: 4
    rule: >-
      A renewal that has reached renewal_offer_lead_days before expiration without an indicated renewal premium on the policy is offered on the day it is found, and the offer date is that day.
      When the renewal is offered, the indicated renewal premium for the upcoming term is the expiring term_premium increased by the tier's inflation_guard_pct and then by the rating percentage, rounded half-up to the cent once, on the final figure.
      The standard rating percentage is zero.
      The rating percentage is the claims load, plus the roof-age load, plus the vacancy load, minus the account credit, all added together and applied once to the trended premium.
      The claims load starts from the number of claims reported on the policy with a loss date in the claims_lookback_months calendar months up to the offer date: two or more such claims give 20 percent, exactly one gives 10 percent, and none gives 0 percent.
      That claims load is then weighted by the cause of loss of the claim with the most recent loss date on the policy: when it was water_sudden_accidental or freeze, losses that follow upkeep, the load is multiplied by 1.5; when it was wind_hail, lightning or weight_of_ice_snow, losses that follow the weather, the load is multiplied by 0.5; for any other cause the load is taken as it stands.
      The roof-age load looks at the roof's age on the upcoming effective date, counted in whole months from January 1 of the roof install year: a roof more than 20 years old gives 12 percent, one more than 15 but not more than 20 years old gives 6 percent, and one 15 years old or younger gives 0 percent.
      The vacancy load looks at the building's occupancy on the offer date, and how it is worked out depends on the permit: for a building on file as vacant with a vacancy permit whose dates cover the offer date, the load is 8 percent prorated over the vacancy the permit carries, that is 8 percent multiplied by the calendar days from the vacancy start date through the permit's last day, both counted, and divided by the calendar days in the expiring term; for a building on file as vacant with no permit covering the offer date, the load is the full 8 percent; and for an occupied building the load is 0 percent.
      For a building on file as vacant longer than the tier's vacancy exclusion period, the indicated renewal premium is recorded only after the policy carries a vacancy permit whose dates cover the offer date.
      The account credit rewards a household that keeps its other protection with the carrier: a named insured with a HomeGuard policy in force and this LandlordGuard policy scheduled as underlying on a Larkspur umbrella receives 7 percent, one with exactly one of those two receives 4 percent, and one with neither receives 0 percent.
      A LandlordGuard policy counts as scheduled on an umbrella only while the named insured holds a Larkspur umbrella in force and the umbrella's scheduling entries for this policy number outnumber its removal and lapse entries for it.
    prerequisite:
      - problem: dwelling_ext_vacancy_permit_charge
        kind: value_input
        gate: vac_pct
        form: state
        policy_source: >-
          For a building on file as vacant longer than the tier's vacancy exclusion period, the indicated renewal premium is recorded only after the policy carries a vacancy permit whose dates cover the offer date.
        condition: >-
          dwelling_policies.vacancy_permit_start is on or before the offer date and dwelling_policies.vacancy_permit_expiration is on or after it, whenever dwelling_policies.vacancy_start_date shows the building vacant for more than the tier's vacancy_exclusion_days on the offer date.
        resolved_by: issue_vacancy_permit_2309bb3c
        effect: >-
          Once the vacancy permit is on the policy with dates covering the offer date, the vacancy load binding vac_pct moves from the flat 8 percent to 8 percent prorated over the days from the vacancy start date through the permit's last day.
    cross_category:
      - category: home
        as: existence
        reads: [status]
        note: The account credit tier reads whether the named insured holds a HomeGuard policy in force.
      - category: umbrella
        as: history
        reads: [umbrella_underlying.event_type, umbrella_underlying.underlying_line, umbrella_underlying.underlying_policy_number]
        note: The account credit tier reads the umbrella schedule-of-underlying entries that schedule this LandlordGuard policy.
    compute:
      - n_claims: "COUNT('dwelling_claims', within_months=P('claims_lookback_months'), date_field='loss_date', event_type='dwelling_claim_reported')"
      - claims_pct: "K('claims_two_plus_pct') if n_claims >= 2 else (K('claims_one_pct') if n_claims == 1 else 0)"
      - latest_peril: "LATEST('dwelling_claims', 'peril', date_field='loss_date', event_type='dwelling_claim_reported')"
      - claims_load_pct: "claims_pct * K('maintenance_multiplier') if (latest_peril == 'water_sudden_accidental' or latest_peril == 'freeze') else (claims_pct * K('weather_multiplier') if (latest_peril == 'wind_hail' or latest_peril == 'lightning' or latest_peril == 'weight_of_ice_snow') else claims_pct)"
      - roof_months: "MONTHS(F('roof_install_year') + '-01-01', F('expiration_date'))"
      - roof_pct: "K('roof_over_20_pct') if roof_months > 240 else (K('roof_over_15_pct') if roof_months > 180 else 0)"
      - vacancy_days: "DAYS(F('vacancy_start_date'), NOW) + 1 if F('vacancy_start_date') else 0"
      - permit_covers: "1 if (F('vacancy_permit_start') != '' and F('vacancy_permit_start') <= NOW and F('vacancy_permit_expiration') >= NOW) else 0"
      - permit_vacancy_days: "DAYS(F('vacancy_start_date'), F('vacancy_permit_expiration')) + 1 if permit_covers == 1 else 0"
      - vac_pct: "K('vacancy_annual_pct') * permit_vacancy_days / DAYS(F('effective_date'), F('expiration_date')) if (vacancy_days > 0 and permit_covers == 1) else (K('vacancy_annual_pct') if (vacancy_days > 0 and permit_covers == 0) else 0)"
      - home_in_force: "EXISTS('home', status='in_force')"
      - umbrella_schedules: "(XCOUNT('umbrella', 'umbrella_underlying', event_type='umbrella_underlying_scheduled', underlying_line='dwelling', underlying_policy_number=F('policy_number')) - XCOUNT('umbrella', 'umbrella_underlying', event_type='umbrella_underlying_removed', underlying_line='dwelling', underlying_policy_number=F('policy_number')) - XCOUNT('umbrella', 'umbrella_underlying', event_type='umbrella_underlying_lapsed', underlying_line='dwelling', underlying_policy_number=F('policy_number'))) * EXISTS('umbrella', status='in_force')"
      - credit_pct: "K('account_both_credit_pct') if (home_in_force and umbrella_schedules >= 1) else (K('account_one_credit_pct') if (home_in_force or umbrella_schedules >= 1) else 0)"
      - trended: "F('term_premium') * (1 + P('inflation_guard_pct') / 100)"
      - result: "RND(trended * (1 + (claims_load_pct + roof_pct + vac_pct - credit_pct) / 100), 2)"
    compute_basis:
      n_claims: "The claims load starts from the number of claims reported on the policy with a loss date in the claims_lookback_months calendar months up to the offer date"
      claims_pct: "two or more such claims give 20 percent, exactly one gives 10 percent, and none gives 0 percent."
      latest_peril: "That claims load is then weighted by the cause of loss of the claim with the most recent loss date on the policy"
      claims_load_pct: "when it was water_sudden_accidental or freeze, losses that follow upkeep, the load is multiplied by 1.5; when it was wind_hail, lightning or weight_of_ice_snow, losses that follow the weather, the load is multiplied by 0.5; for any other cause the load is taken as it stands."
      roof_months: "The roof-age load looks at the roof's age on the upcoming effective date, counted in whole months from January 1 of the roof install year"
      roof_pct: "a roof more than 20 years old gives 12 percent, one more than 15 but not more than 20 years old gives 6 percent, and one 15 years old or younger gives 0 percent."
      vacancy_days: "The vacancy load looks at the building's occupancy on the offer date"
      permit_covers: "a building on file as vacant with a vacancy permit whose dates cover the offer date"
      permit_vacancy_days: "the calendar days from the vacancy start date through the permit's last day, both counted"
      vac_pct: "for a building on file as vacant with a vacancy permit whose dates cover the offer date, the load is 8 percent prorated over the vacancy the permit carries, that is 8 percent multiplied by the calendar days from the vacancy start date through the permit's last day, both counted, and divided by the calendar days in the expiring term; for a building on file as vacant with no permit covering the offer date, the load is the full 8 percent; and for an occupied building the load is 0 percent."
      home_in_force: "a named insured with a HomeGuard policy in force"
      umbrella_schedules: "A LandlordGuard policy counts as scheduled on an umbrella only while the named insured holds a Larkspur umbrella in force and the umbrella's scheduling entries for this policy number outnumber its removal and lapse entries for it."
      credit_pct: "The account credit rewards a household that keeps its other protection with the carrier: a named insured with a HomeGuard policy in force and this LandlordGuard policy scheduled as underlying on a Larkspur umbrella receives 7 percent, one with exactly one of those two receives 4 percent, and one with neither receives 0 percent."
      trended: "the expiring term_premium increased by the tier's inflation_guard_pct"
      result: "The rating percentage is the claims load, plus the roof-age load, plus the vacancy load, minus the account credit, all added together and applied once to the trended premium."
    factors:
      - id: claims_count
        effect: parameter
        decides: claims_pct
        bindings: [n_claims, claims_pct]
        ladder:
          - when: "two or more claims reported with a loss date in the claims lookback window up to the offer date"
            value: "K('claims_two_plus_pct') = 20 percent"
          - when: "exactly one such claim"
            value: "K('claims_one_pct') = 10 percent"
          - when: "otherwise (no such claim)"
            value: "0 percent"
        baseline:
          claims_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: claim_cause_weighting
        effect: parameter
        decides: claims_load_pct
        bindings: [latest_peril, claims_load_pct]
        ladder:
          - when: "the claim with the most recent loss date was water_sudden_accidental or freeze"
            value: "weight K('maintenance_multiplier') = 1.5 on the claims load"
          - when: "the claim with the most recent loss date was wind_hail, lightning or weight_of_ice_snow"
            value: "weight K('weather_multiplier') = 0.5 on the claims load"
          - when: "otherwise (any other cause, or no claim)"
            value: "weight 1 (load as it stands)"
        baseline:
          claims_load_pct: "claims_pct"
        evidence: [history]
        cross_difficulty: null
      - id: roof_age
        effect: parameter
        decides: roof_pct
        bindings: [roof_months, roof_pct]
        ladder:
          - when: "roof more than 20 years old on the upcoming effective date"
            value: "K('roof_over_20_pct') = 12 percent"
          - when: "roof more than 15 but not more than 20 years old"
            value: "K('roof_over_15_pct') = 6 percent"
          - when: "otherwise (15 years old or younger)"
            value: "0 percent"
        baseline:
          roof_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: vacancy_at_offer
        effect: method
        decides: vac_pct
        bindings: [vacancy_days, permit_covers, permit_vacancy_days, vac_pct]
        ladder:
          - when: "building on file as vacant AND a vacancy permit whose dates cover the offer date"
            method: "load prorated by days: 8 percent x (days from the vacancy start date through the permit's last day, both counted) / days in the expiring term"
          - when: "building on file as vacant AND no vacancy permit covering the offer date"
            method: "flat annual load of the full 8 percent"
          - when: "otherwise (building occupied)"
            method: "no vacancy load"
        baseline:
          vac_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: household_account_credit
        effect: parameter
        decides: credit_pct
        bindings: [home_in_force, umbrella_schedules, credit_pct]
        ladder:
          - when: "a HomeGuard policy in force AND this LandlordGuard policy scheduled as underlying on a Larkspur umbrella"
            value: "K('account_both_credit_pct') = 7 percent credit"
          - when: "a HomeGuard policy in force OR this policy scheduled on an umbrella, but not both"
            value: "K('account_one_credit_pct') = 4 percent credit"
          - when: "otherwise (neither)"
            value: "0 percent"
        baseline:
          credit_pct: "0"
        evidence: [cross_category, history]
        cross_difficulty: home
    baseline:
      rule: >-
        When the renewal is offered, the indicated renewal premium for the upcoming term is the expiring term_premium increased by the tier's inflation_guard_pct and then by the rating percentage, rounded half-up to the cent once, on the final figure.
        The standard rating percentage is zero.
      params: [inflation_guard_pct]
    inputs:
      history:
        - {table: dwelling_claims, aggregate: count, field: loss_date, within_months: 36, filters: {event_type: dwelling_claim_reported}}
        - {table: dwelling_claims, aggregate: latest, field: peril, filters: {event_type: dwelling_claim_reported}}
        - {category: umbrella, table: umbrella_underlying, aggregate: count, field: underlying_policy_number, filters: {event_type: umbrella_underlying_scheduled, underlying_line: dwelling}}
      cross_category: [home, umbrella]

  - id: dwelling_ext_renewal_premium_paid_in_full
    base_policy_refs: [dwelling_billing_and_payments, dwelling_renewal]
    overwrite:
      - base_policy: dwelling_renewal
        superseded_clause: >-
          The renewal term premium is the smaller of indicated_renewal_premium and the expiring term_premium increased by renewal_rate_cap_pct, rounded half-up to the cent; the cap never lowers a premium below the indicated amount when the indicated amount is itself lower.
        replaced_by: >-
          The renewal term premium is the smaller of the indicated renewal premium on the policy and the expiring term_premium increased by the renewal cap percentage (that capped figure rounded half-up to the cent), and that smaller figure is then increased by the account adjustment percentage, reduced by the flat account credit and rounded half-up to the cent.
      - base_policy: dwelling_renewal
        superseded_clause: >-
          and renewal installment 1 is billed on the capped premium.
        replaced_by: >-
          A named insured who pays the renewal term premium in full pays it in one payment recorded against the upcoming term; that payment settles renewal installment 1, and no installment is billed for a term paid in full.
    trigger: on_request
    subject: [dwelling_payment_received]
    computes: amount
    target_tool: pay_renewal_premium_4100e9a3
    params:
      loyalty_tenure_months: 60
      loyalty_claim_free_pts: 5
      loyalty_one_claim_pts: 2
      window_two_plus_months: 36
      window_one_months: 24
      window_standard_months: 12
      late_two_plus_pct: 4
      late_one_pct: 2
      flood_claim_free_credit_pct: 3
      flood_with_claim_credit_pct: 1
      book_flat_per_unit: 25.00
      book_two_three_credit_pct: 2
    rule: >-
      A named insured who pays the renewal term premium in full pays it in one payment recorded against the upcoming term; that payment settles renewal installment 1, and no installment is billed for a term paid in full.
      The renewal term premium is fixed only once the policy record carries the indicated renewal premium for the upcoming term.
      The renewal term premium is the smaller of the indicated renewal premium on the policy and the expiring term_premium increased by the renewal cap percentage (that capped figure rounded half-up to the cent), and that smaller figure is then increased by the account adjustment percentage, reduced by the flat account credit and rounded half-up to the cent.
      The standard renewal cap percentage is the tier's renewal_rate_cap_pct, the standard account adjustment percentage is zero and the standard flat account credit is zero.
      The renewal cap percentage rewards a long, quiet record on the building: a policy whose original effective date is at least 60 whole months before the upcoming effective date and that has no claim reported with a loss date in the claims_lookback_months calendar months up to today takes 5 points off the tier's renewal_rate_cap_pct; a policy insured at least 60 whole months with exactly one such claim takes 2 points off; any other policy keeps the tier's renewal_rate_cap_pct.
      The account adjustment percentage is the late-payment surcharge minus the flood companion credit minus the rental book credit, added together and applied once to the smaller figure.
      The late-payment surcharge counts the late fees posted on the policy over the payment-history window up to today: two or more late fees give 4 percent, exactly one gives 2 percent, and none gives 0 percent.
      The payment-history window depends on returned payments posted on the policy in the 24 calendar months up to today: with two or more returned payments the window is the 36 calendar months up to today, with exactly one it is the 24 calendar months up to today, and with none it is the 12 calendar months up to today.
      The flood companion credit applies to a building the named insured also insures under FloodGuard: a FloodGuard policy in force at the same property address with no flood claim payment on that FloodGuard policy in the claims_lookback_months calendar months up to today gives 3 percent, a FloodGuard policy in force at that address with one or more flood claim payments on it in that window gives 1 percent, and a building with no FloodGuard policy in force at that address gives 0 percent.
      The rental book credit looks at the rental units the named insured schedules on a Larkspur umbrella in force, and its form depends on the size of that book: a book of four or more units is credited 25.00 USD for each scheduled unit as the flat account credit, taken off the premium after the account adjustment percentage; a book of two or three units is credited 2 percent inside the account adjustment percentage; and a book of fewer than two units, or no umbrella in force, is credited nothing.
    prerequisite:
      - problem: dwelling_ext_renewal_indication
        kind: value_input
        gate: indicated
        form: state
        policy_source: >-
          The renewal term premium is fixed only once the policy record carries the indicated renewal premium for the upcoming term.
        condition: >-
          dwelling_policies.indicated_renewal_premium holds a positive amount recorded for the upcoming term.
        resolved_by: record_renewal_indication_d716047a
        effect: >-
          Once the indicated renewal premium is on the policy, the binding indicated takes that amount instead of an empty value, and the smaller-of comparison with the capped expiring premium can be made.
    cross_category:
      - category: flood
        as: branch
        reads: [status, property_address, flood_claims.event_type, flood_claims.entry_date]
        note: The flood companion credit tier reads the FloodGuard policy at the same address and the named insured's flood claim payments.
      - category: umbrella
        as: branch
        reads: [rental_units, status]
        note: The rental book credit tier reads the rental units scheduled on the named insured's umbrella in force.
    compute:
      - indicated: "F('indicated_renewal_premium') or 0"
      - tenure_at_renewal: "MONTHS(F('original_effective_date'), F('expiration_date'))"
      - n_claims_lookback: "COUNT('dwelling_claims', within_months=P('claims_lookback_months'), date_field='loss_date', event_type='dwelling_claim_reported')"
      - cap_pct: "P('renewal_rate_cap_pct') - K('loyalty_claim_free_pts') if (tenure_at_renewal >= K('loyalty_tenure_months') and n_claims_lookback == 0) else (P('renewal_rate_cap_pct') - K('loyalty_one_claim_pts') if (tenure_at_renewal >= K('loyalty_tenure_months') and n_claims_lookback == 1) else P('renewal_rate_cap_pct'))"
      - capped: "RND(F('term_premium') * (1 + cap_pct / 100), 2)"
      - smaller_premium: "MN(indicated, capped)"
      - n_returned_24: "COUNT('dwelling_billing', within_months=K('window_one_months'), date_field='posted_date', event_type='dwelling_payment_returned')"
      - late_window: "K('window_two_plus_months') if n_returned_24 >= 2 else (K('window_one_months') if n_returned_24 == 1 else K('window_standard_months'))"
      - n_late_fees: "COUNT('dwelling_billing', within_months=late_window, date_field='posted_date', event_type='dwelling_fee_assessed', fee_code='late_fee')"
      - late_pct: "K('late_two_plus_pct') if n_late_fees >= 2 else (K('late_one_pct') if n_late_fees == 1 else 0)"
      - flood_status: "CFIELD('flood', 'status', property_address=F('property_address'))"
      - n_flood_paid: "XCOUNT('flood', 'flood_claims', within_months=P('claims_lookback_months'), date_field='entry_date', event_type='flood_claim_payment', flood_policy_id=CFIELD('flood', 'flood_policy_id', property_address=F('property_address')))"
      - flood_credit_pct: "K('flood_claim_free_credit_pct') if (flood_status == 'in_force' and n_flood_paid == 0) else (K('flood_with_claim_credit_pct') if (flood_status == 'in_force' and n_flood_paid >= 1) else 0)"
      - book_units: "CFIELD('umbrella', 'rental_units', status='in_force') or 0"
      - book_credit_pct: "K('book_two_three_credit_pct') if (book_units >= 2 and book_units < 4) else 0"
      - book_flat: "K('book_flat_per_unit') * book_units if book_units >= 4 else 0"
      - result: "RND(smaller_premium * (1 + (late_pct - flood_credit_pct - book_credit_pct) / 100) - book_flat, 2)"
    compute_basis:
      indicated: "the indicated renewal premium on the policy"
      tenure_at_renewal: "a policy whose original effective date is at least 60 whole months before the upcoming effective date"
      n_claims_lookback: "no claim reported with a loss date in the claims_lookback_months calendar months up to today"
      cap_pct: "a policy whose original effective date is at least 60 whole months before the upcoming effective date and that has no claim reported with a loss date in the claims_lookback_months calendar months up to today takes 5 points off the tier's renewal_rate_cap_pct; a policy insured at least 60 whole months with exactly one such claim takes 2 points off; any other policy keeps the tier's renewal_rate_cap_pct."
      capped: "the expiring term_premium increased by the renewal cap percentage (that capped figure rounded half-up to the cent)"
      smaller_premium: "The renewal term premium is the smaller of the indicated renewal premium on the policy and the expiring term_premium increased by the renewal cap percentage"
      n_returned_24: "The payment-history window depends on returned payments posted on the policy in the 24 calendar months up to today"
      late_window: "with two or more returned payments the window is the 36 calendar months up to today, with exactly one it is the 24 calendar months up to today, and with none it is the 12 calendar months up to today."
      n_late_fees: "The late-payment surcharge counts the late fees posted on the policy over the payment-history window up to today"
      late_pct: "two or more late fees give 4 percent, exactly one gives 2 percent, and none gives 0 percent."
      flood_status: "a FloodGuard policy in force at the same property address"
      n_flood_paid: "with no flood claim payment on that FloodGuard policy in the claims_lookback_months calendar months up to today"
      flood_credit_pct: "a FloodGuard policy in force at the same property address with no flood claim payment on that FloodGuard policy in the claims_lookback_months calendar months up to today gives 3 percent, a FloodGuard policy in force at that address with one or more flood claim payments on it in that window gives 1 percent, and a building with no FloodGuard policy in force at that address gives 0 percent."
      book_units: "The rental book credit looks at the rental units the named insured schedules on a Larkspur umbrella in force"
      book_credit_pct: "a book of two or three units is credited 2 percent inside the account adjustment percentage; and a book of fewer than two units, or no umbrella in force, is credited nothing."
      book_flat: "a book of four or more units is credited 25.00 USD for each scheduled unit as the flat account credit, taken off the premium after the account adjustment percentage"
      result: "that smaller figure is then increased by the account adjustment percentage, reduced by the flat account credit and rounded half-up to the cent. The account adjustment percentage is the late-payment surcharge minus the flood companion credit minus the rental book credit, added together and applied once to the smaller figure."
    factors:
      - id: loyalty_cap
        effect: parameter
        decides: cap_pct
        bindings: [tenure_at_renewal, n_claims_lookback, cap_pct]
        ladder:
          - when: "insured at least 60 whole months at the upcoming effective date AND no claim reported with a loss date in the claims lookback window"
            value: "P('renewal_rate_cap_pct') - K('loyalty_claim_free_pts') (5 points off)"
          - when: "insured at least 60 whole months AND exactly one such claim"
            value: "P('renewal_rate_cap_pct') - K('loyalty_one_claim_pts') (2 points off)"
          - when: "otherwise"
            value: "P('renewal_rate_cap_pct')"
        baseline:
          cap_pct: "P('renewal_rate_cap_pct')"
        evidence: [date, history, tier_param]
        cross_difficulty: null
      - id: payment_history_window
        effect: parameter
        decides: late_window
        bindings: [n_returned_24, late_window]
        ladder:
          - when: "two or more returned payments posted in the 24 calendar months up to today"
            value: "K('window_two_plus_months') = 36-month window"
          - when: "exactly one returned payment in those 24 months"
            value: "K('window_one_months') = 24-month window"
          - when: "otherwise (no returned payment in those 24 months)"
            value: "K('window_standard_months') = 12-month window"
        baseline:
          late_window: "K('window_standard_months')"
        evidence: [history]
        cross_difficulty: null
      - id: late_payment_surcharge
        effect: parameter
        decides: late_pct
        bindings: [n_late_fees, late_pct]
        ladder:
          - when: "two or more late fees posted over the payment-history window"
            value: "K('late_two_plus_pct') = 4 percent"
          - when: "exactly one late fee in that window"
            value: "K('late_one_pct') = 2 percent"
          - when: "otherwise (none)"
            value: "0 percent"
        baseline:
          late_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: flood_companion
        effect: parameter
        decides: flood_credit_pct
        bindings: [flood_status, n_flood_paid, flood_credit_pct]
        ladder:
          - when: "FloodGuard policy in force at the same property address AND no flood claim payment in the claims lookback window"
            value: "K('flood_claim_free_credit_pct') = 3 percent credit"
          - when: "FloodGuard policy in force at that address AND one or more flood claim payments in that window"
            value: "K('flood_with_claim_credit_pct') = 1 percent credit"
          - when: "otherwise (no FloodGuard policy in force at that address)"
            value: "0 percent"
        baseline:
          flood_credit_pct: "0"
        evidence: [cross_category, history]
        cross_difficulty: flood
      - id: rental_book_credit
        effect: method
        decides: book_credit_pct
        bindings: [book_units, book_credit_pct, book_flat]
        ladder:
          - when: "four or more rental units scheduled on a Larkspur umbrella in force"
            method: "flat credit of K('book_flat_per_unit') = 25.00 USD per scheduled unit, taken off after the percentage adjustment"
          - when: "two or three rental units scheduled on it"
            method: "percentage credit of K('book_two_three_credit_pct') = 2 percent inside the account adjustment percentage"
          - when: "otherwise (fewer than two units or no umbrella in force)"
            method: "no credit"
        baseline:
          book_credit_pct: "0"
          book_flat: "0"
        evidence: [cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        The renewal term premium is the smaller of the indicated renewal premium on the policy and the expiring term_premium increased by the renewal cap percentage (that capped figure rounded half-up to the cent), and that smaller figure is then increased by the account adjustment percentage, reduced by the flat account credit and rounded half-up to the cent.
        The standard renewal cap percentage is the tier's renewal_rate_cap_pct, the standard account adjustment percentage is zero and the standard flat account credit is zero.
      params: [renewal_rate_cap_pct]
    inputs:
      history:
        - {table: dwelling_claims, aggregate: count, field: loss_date, within_months: 36, filters: {event_type: dwelling_claim_reported}}
        - {table: dwelling_billing, aggregate: count, field: posted_date, within_months: 24, filters: {event_type: dwelling_payment_returned}}
        - {table: dwelling_billing, aggregate: count, field: posted_date, within_months: 24, filters: {event_type: dwelling_fee_assessed, fee_code: late_fee}}
        - {category: flood, table: flood_claims, aggregate: count, field: entry_date, within_months: 36, filters: {event_type: flood_claim_payment}}
      cross_category: [flood, umbrella]

  - id: dwelling_ext_installment_fee
    base_policy_refs: [dwelling_billing_and_payments]
    overwrite:
      - base_policy: dwelling_billing_and_payments
        superseded_clause: >-
          installment_fee_direct is charged on each installment after the first
        replaced_by: >-
          Each billed installment of a term other than installment 1 carries one installment fee, and a billed installment found without it is charged the fee on the day it is found.
    trigger: state_due
    subject: [dwelling_fee_assessed]
    computes: amount
    target_tool: assess_installment_fee_8325e06b
    params:
      large_installment_usd: 1000
      small_installment_usd: 250
      percent_fee_rate: 0.8
      eft_three_plus_credit: 2.00
      eft_one_two_credit: 1.00
      tenure_120_credit: 1.50
      tenure_60_credit: 0.75
      returned_two_plus_add: 2.00
      returned_one_add: 1.00
    rule: >-
      Each billed installment of a term other than installment 1 carries one installment fee, and a billed installment found without it is charged the fee on the day it is found.
      No installment fee is charged on a mortgagee-billed term or on a tier whose installment_fee_direct is 0.00.
      The installment fee is the fee basis for the installment plus the fee adjustment, never below 0.00, rounded half-up to the cent once on the final figure.
      The standard fee basis is the tier's installment_fee_direct, and the standard fee adjustment is zero.
      The fee adjustment is the returned-payment add-on minus the EFT credit minus the installment-fee tenure credit, the three added together.
      How the fee basis is set depends on the amount of the installment the fee is charged on (the most recently billed installment): an installment above 1000 USD takes 0.8 percent of the installment amount; an installment of 250 USD or less takes half the tier's installment_fee_direct; any other installment takes the tier's installment_fee_direct.
      The returned-payment add-on reflects the cost of servicing an unreliable draft: two or more returned payments posted on the policy in the 12 calendar months up to the charge date add 2.00 USD, exactly one adds 1.00 USD, and none adds nothing.
      The EFT credit rewards payments that clear by bank draft: the number of payments received by EFT on the policy in the 12 calendar months up to the charge date, less the returned payments posted in the same months, gives 2.00 USD when it is three or more, 1.00 USD when it is one or two, and nothing when it is zero or less.
      The installment-fee tenure credit looks at whole months from the original effective date to the charge date: 120 months or more take 1.50 USD off, 60 to 119 months take 0.75 USD off, and fewer than 60 months take nothing off.
    prerequisite: []
    cross_category: []
    compute:
      - inst_amount: "LATEST('dwelling_billing', 'amount', date_field='posted_date', event_type='dwelling_premium_billed')"
      - fee_basis: "inst_amount * K('percent_fee_rate') / 100 if inst_amount > K('large_installment_usd') else (P('installment_fee_direct') / 2 if inst_amount <= K('small_installment_usd') else P('installment_fee_direct'))"
      - n_returned_12: "COUNT('dwelling_billing', within_months=12, date_field='posted_date', event_type='dwelling_payment_returned')"
      - returned_add: "K('returned_two_plus_add') if n_returned_12 >= 2 else (K('returned_one_add') if n_returned_12 == 1 else 0)"
      - n_eft_12: "COUNT('dwelling_billing', within_months=12, date_field='posted_date', event_type='dwelling_payment_received', payment_method='eft')"
      - eft_credit: "K('eft_three_plus_credit') if n_eft_12 - n_returned_12 >= 3 else (K('eft_one_two_credit') if n_eft_12 - n_returned_12 >= 1 else 0)"
      - tenure_months: "MONTHS(F('original_effective_date'), NOW)"
      - tenure_credit: "K('tenure_120_credit') if tenure_months >= 120 else (K('tenure_60_credit') if tenure_months >= 60 else 0)"
      - result: "RND(MX(0, fee_basis + returned_add - eft_credit - tenure_credit), 2)"
    compute_basis:
      inst_amount: "the amount of the installment the fee is charged on (the most recently billed installment)"
      fee_basis: "an installment above 1000 USD takes 0.8 percent of the installment amount; an installment of 250 USD or less takes half the tier's installment_fee_direct; any other installment takes the tier's installment_fee_direct."
      n_returned_12: "two or more returned payments posted on the policy in the 12 calendar months up to the charge date"
      returned_add: "The returned-payment add-on reflects the cost of servicing an unreliable draft: two or more returned payments posted on the policy in the 12 calendar months up to the charge date add 2.00 USD, exactly one adds 1.00 USD, and none adds nothing."
      n_eft_12: "the number of payments received by EFT on the policy in the 12 calendar months up to the charge date, less the returned payments posted in the same months"
      eft_credit: "gives 2.00 USD when it is three or more, 1.00 USD when it is one or two, and nothing when it is zero or less."
      tenure_months: "The installment-fee tenure credit looks at whole months from the original effective date to the charge date"
      tenure_credit: "120 months or more take 1.50 USD off, 60 to 119 months take 0.75 USD off, and fewer than 60 months take nothing off."
      result: "The installment fee is the fee basis for the installment plus the fee adjustment, never below 0.00, rounded half-up to the cent once on the final figure. The fee adjustment is the returned-payment add-on minus the EFT credit minus the installment-fee tenure credit, the three added together."
    factors:
      - id: fee_basis_by_size
        effect: method
        decides: fee_basis
        bindings: [inst_amount, fee_basis]
        ladder:
          - when: "installment above 1000 USD"
            method: "0.8 percent of the installment amount"
          - when: "installment of 250 USD or less"
            method: "half the tier's installment_fee_direct"
          - when: "otherwise"
            method: "the tier's installment_fee_direct"
        baseline:
          fee_basis: "P('installment_fee_direct')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: returned_payment_addon
        effect: parameter
        decides: returned_add
        bindings: [n_returned_12, returned_add]
        ladder:
          - when: "two or more returned payments in the 12 months"
            value: "K('returned_two_plus_add') = 2.00 USD"
          - when: "exactly one returned payment"
            value: "K('returned_one_add') = 1.00 USD"
          - when: "otherwise (none)"
            value: "0.00"
        baseline:
          returned_add: "0"
        evidence: [history]
        cross_difficulty: null
      - id: eft_clearing_credit
        effect: parameter
        decides: eft_credit
        bindings: [n_eft_12, eft_credit]
        ladder:
          - when: "EFT payments in the 12 months less returned payments is three or more"
            value: "K('eft_three_plus_credit') = 2.00 USD off"
          - when: "that difference is one or two"
            value: "K('eft_one_two_credit') = 1.00 USD off"
          - when: "otherwise (zero or less)"
            value: "0.00"
        baseline:
          eft_credit: "0"
        evidence: [history]
        cross_difficulty: null
      - id: installment_tenure_credit
        effect: parameter
        decides: tenure_credit
        bindings: [tenure_months, tenure_credit]
        ladder:
          - when: "120 or more whole months since the original effective date"
            value: "K('tenure_120_credit') = 1.50 USD off"
          - when: "60 to 119 whole months"
            value: "K('tenure_60_credit') = 0.75 USD off"
          - when: "otherwise (fewer than 60 months)"
            value: "0.00"
        baseline:
          tenure_credit: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        Each billed installment of a term other than installment 1 carries one installment fee, and a billed installment found without it is charged the fee on the day it is found.
        The installment fee is the fee basis for the installment plus the fee adjustment, never below 0.00, rounded half-up to the cent once on the final figure.
        The standard fee basis is the tier's installment_fee_direct, and the standard fee adjustment is zero.
      params: [installment_fee_direct]
    inputs:
      history:
        - {table: dwelling_billing, aggregate: latest, field: amount, filters: {event_type: dwelling_premium_billed}}
        - {table: dwelling_billing, aggregate: count, field: posted_date, within_months: 12, filters: {event_type: dwelling_payment_returned}}
        - {table: dwelling_billing, aggregate: count, field: posted_date, within_months: 12, filters: {event_type: dwelling_payment_received, payment_method: eft}}
      cross_category: []

  - id: dwelling_ext_late_fee
    base_policy_refs: [dwelling_billing_and_payments]
    overwrite:
      - base_policy: dwelling_billing_and_payments
        superseded_clause: >-
          a late fee once per installment still unpaid more than late_fee_grace_days calendar days after its due date
        replaced_by: >-
          A late fee is charged once for each installment still unpaid more than late_fee_grace_days calendar days after its due date, on the day it is found, and is recorded against that installment's term and position.
    trigger: state_due
    subject: [dwelling_fee_assessed]
    computes: amount
    target_tool: assess_late_fee_984fd113
    params:
      large_installment_usd: 1000
      small_installment_usd: 250
      percent_basis_rate: 1.2
      days_long: 20
      days_mid: 12
      days_long_add: 5.00
      days_mid_add: 2.50
      household_both_credit: 3.00
      household_one_credit: 1.50
      tenure_120_credit: 4.00
      tenure_60_credit: 2.00
      repeat_two_plus_factor: 2
      repeat_one_factor: 1.5
    rule: >-
      A late fee is charged once for each installment still unpaid more than late_fee_grace_days calendar days after its due date, on the day it is found, and is recorded against that installment's term and position.
      No late fee is charged on a mortgagee-billed term or on a tier whose late_fee is 0.00.
      The late fee is the late-fee basis plus the late-fee adjustment, multiplied by the repeat factor, never below 0.00, rounded half-up to the cent once on the final figure.
      The standard late-fee basis is the tier's late_fee, the standard late-fee adjustment is zero and the standard repeat factor is 1.
      The late-fee adjustment is the days-late add-on minus the household credit minus the late-fee tenure credit, the three added together.
      How the late-fee basis is set depends on the amount of the late installment (the most recently billed installment): an installment above 1000 USD takes 1.2 percent of the installment amount; an installment of 250 USD or less takes half the tier's late_fee; any other installment takes the tier's late_fee.
      The days-late add-on counts calendar days from the late installment's due date to the charge date: more than 20 days adds 5.00 USD, more than 12 up to 20 days adds 2.50 USD, and 12 days or fewer adds nothing.
      The household credit rewards a named insured who keeps other protection with the carrier: a HomeGuard policy in force together with a Larkspur umbrella in force takes 3.00 USD off, exactly one of the two takes 1.50 USD off, and neither takes nothing off.
      The late-fee tenure credit looks at whole months from the original effective date to the charge date: 120 months or more take 4.00 USD off, 60 to 119 months take 2.00 USD off, and fewer than 60 months take nothing off.
      The repeat factor depends on the late fees already posted on the policy in the 24 calendar months up to the charge date: two or more multiply the fee by 2, exactly one multiplies it by 1.5, and none leaves it as it stands.
    prerequisite: []
    cross_category:
      - category: home
        as: existence
        reads: [status]
        note: The household credit tier reads whether the named insured holds a HomeGuard policy in force.
      - category: umbrella
        as: existence
        reads: [status]
        note: The household credit tier reads whether the named insured holds a Larkspur umbrella in force.
    compute:
      - late_amount: "LATEST('dwelling_billing', 'amount', date_field='posted_date', event_type='dwelling_premium_billed')"
      - late_basis: "late_amount * K('percent_basis_rate') / 100 if late_amount > K('large_installment_usd') else (P('late_fee') / 2 if late_amount <= K('small_installment_usd') else P('late_fee'))"
      - days_late: "DAYS(LATEST('dwelling_billing', 'due_date', date_field='posted_date', event_type='dwelling_premium_billed'), NOW)"
      - days_add: "K('days_long_add') if days_late > K('days_long') else (K('days_mid_add') if days_late > K('days_mid') else 0)"
      - home_live: "EXISTS('home', status='in_force')"
      - umbrella_live: "EXISTS('umbrella', status='in_force')"
      - household_credit: "K('household_both_credit') if (home_live and umbrella_live) else (K('household_one_credit') if (home_live or umbrella_live) else 0)"
      - tenure_months: "MONTHS(F('original_effective_date'), NOW)"
      - tenure_credit: "K('tenure_120_credit') if tenure_months >= 120 else (K('tenure_60_credit') if tenure_months >= 60 else 0)"
      - n_late_24: "COUNT('dwelling_billing', within_months=24, date_field='posted_date', event_type='dwelling_fee_assessed', fee_code='late_fee')"
      - repeat_factor: "K('repeat_two_plus_factor') if n_late_24 >= 2 else (K('repeat_one_factor') if n_late_24 == 1 else 1)"
      - result: "RND(MX(0, (late_basis + days_add - household_credit - tenure_credit) * repeat_factor), 2)"
    compute_basis:
      late_amount: "How the late-fee basis is set depends on the amount of the late installment (the most recently billed installment)"
      late_basis: "an installment above 1000 USD takes 1.2 percent of the installment amount; an installment of 250 USD or less takes half the tier's late_fee; any other installment takes the tier's late_fee."
      days_late: "The days-late add-on counts calendar days from the late installment's due date to the charge date"
      days_add: "more than 20 days adds 5.00 USD, more than 12 up to 20 days adds 2.50 USD, and 12 days or fewer adds nothing."
      home_live: "a HomeGuard policy in force"
      umbrella_live: "a Larkspur umbrella in force"
      household_credit: "The household credit rewards a named insured who keeps other protection with the carrier: a HomeGuard policy in force together with a Larkspur umbrella in force takes 3.00 USD off, exactly one of the two takes 1.50 USD off, and neither takes nothing off."
      tenure_months: "The late-fee tenure credit looks at whole months from the original effective date to the charge date"
      tenure_credit: "120 months or more take 4.00 USD off, 60 to 119 months take 2.00 USD off, and fewer than 60 months take nothing off."
      n_late_24: "The repeat factor depends on the late fees already posted on the policy in the 24 calendar months up to the charge date"
      repeat_factor: "two or more multiply the fee by 2, exactly one multiplies it by 1.5, and none leaves it as it stands."
      result: "The late fee is the late-fee basis plus the late-fee adjustment, multiplied by the repeat factor, never below 0.00, rounded half-up to the cent once on the final figure. The late-fee adjustment is the days-late add-on minus the household credit minus the late-fee tenure credit, the three added together."
    factors:
      - id: late_fee_basis
        effect: method
        decides: late_basis
        bindings: [late_amount, late_basis]
        ladder:
          - when: "late installment above 1000 USD"
            method: "1.2 percent of the installment amount"
          - when: "late installment of 250 USD or less"
            method: "half the tier's late_fee"
          - when: "otherwise"
            method: "the tier's late_fee"
        baseline:
          late_basis: "P('late_fee')"
        evidence: [history]
        cross_difficulty: null
      - id: days_late
        effect: parameter
        decides: days_add
        bindings: [days_late, days_add]
        ladder:
          - when: "more than 20 calendar days from the due date to the charge date"
            value: "K('days_long_add') = 5.00 USD"
          - when: "more than 12 up to 20 days"
            value: "K('days_mid_add') = 2.50 USD"
          - when: "otherwise (12 days or fewer)"
            value: "0.00"
        baseline:
          days_add: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: household_credit
        effect: parameter
        decides: household_credit
        bindings: [home_live, umbrella_live, household_credit]
        ladder:
          - when: "HomeGuard policy in force AND Larkspur umbrella in force"
            value: "K('household_both_credit') = 3.00 USD off"
          - when: "HomeGuard policy in force OR umbrella in force, but not both"
            value: "K('household_one_credit') = 1.50 USD off"
          - when: "otherwise (neither)"
            value: "0.00"
        baseline:
          household_credit: "0"
        evidence: [cross_category]
        cross_difficulty: home
      - id: late_fee_tenure_credit
        effect: parameter
        decides: tenure_credit
        bindings: [tenure_months, tenure_credit]
        ladder:
          - when: "120 or more whole months since the original effective date"
            value: "K('tenure_120_credit') = 4.00 USD off"
          - when: "60 to 119 whole months"
            value: "K('tenure_60_credit') = 2.00 USD off"
          - when: "otherwise (fewer than 60 months)"
            value: "0.00"
        baseline:
          tenure_credit: "0"
        evidence: [date]
        cross_difficulty: null
      - id: repeat_lateness
        effect: parameter
        decides: repeat_factor
        bindings: [n_late_24, repeat_factor]
        ladder:
          - when: "two or more late fees posted in the 24 months up to the charge date"
            value: "K('repeat_two_plus_factor') = 2"
          - when: "exactly one late fee in those months"
            value: "K('repeat_one_factor') = 1.5"
          - when: "otherwise (none)"
            value: "1"
        baseline:
          repeat_factor: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A late fee is charged once for each installment still unpaid more than late_fee_grace_days calendar days after its due date, on the day it is found, and is recorded against that installment's term and position.
        The late fee is the late-fee basis plus the late-fee adjustment, multiplied by the repeat factor, never below 0.00, rounded half-up to the cent once on the final figure.
        The standard late-fee basis is the tier's late_fee, the standard late-fee adjustment is zero and the standard repeat factor is 1.
      params: [late_fee, late_fee_grace_days]
    inputs:
      history:
        - {table: dwelling_billing, aggregate: latest, field: amount, filters: {event_type: dwelling_premium_billed}}
        - {table: dwelling_billing, aggregate: latest, field: due_date, filters: {event_type: dwelling_premium_billed}}
