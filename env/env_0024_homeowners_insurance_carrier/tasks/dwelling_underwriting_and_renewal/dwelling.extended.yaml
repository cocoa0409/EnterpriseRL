  - id: dwelling_ext_returned_payment_fee
    base_policy_refs: [dwelling_billing_and_payments]
    overwrite:
      - base_policy: dwelling_billing_and_payments
        superseded_clause: >-
          a returned-payment fee once per returned payment
        replaced_by: >-
          A returned-payment fee is charged once for each returned payment and points at that returned payment; a returned payment found without its fee is charged on the day it is found.
    trigger: state_due
    subject: [dwelling_fee_assessed]
    computes: amount
    target_tool: assess_returned_payment_fee_55a26ad1
    params:
      large_return_usd: 1000
      small_return_usd: 100
      excess_rate_pct: 2
      check_add: 5.00
      eft_add: 2.50
      home_clean_credit: 5.00
      home_returned_add: 5.00
      tenure_120_credit: 10.00
      tenure_60_credit: 5.00
      three_plus_factor: 2
      two_factor: 1.5
    rule: >-
      A returned-payment fee is charged once for each returned payment and points at that returned payment; a returned payment found without its fee is charged on the day it is found.
      No returned-payment fee is charged on a mortgagee-billed term or on a tier whose returned_payment_fee is 0.00.
      The returned-payment fee is the returned-fee basis plus the returned-fee adjustment, multiplied by the return-frequency factor, never below 0.00, rounded half-up to the cent once on the final figure.
      The standard returned-fee basis is the tier's returned_payment_fee, the standard returned-fee adjustment is zero and the standard return-frequency factor is 1.
      The returned-fee adjustment is the payment-channel add-on plus the household standing adjustment minus the returned-fee tenure credit, the three added together.
      How the returned-fee basis is set depends on the amount of the returned payment (the most recently posted returned payment): a payment above 1000 USD takes the tier's returned_payment_fee plus 2 percent of the part of the payment above 1000 USD; a payment of 100 USD or less takes half the tier's returned_payment_fee; any other payment takes the tier's returned_payment_fee.
      The payment-channel add-on looks at the method of the most recent payment received on the policy, the payment the return reverses: a check adds 5.00 USD, an EFT draft adds 2.50 USD, and any other method adds nothing.
      The household standing adjustment looks at the named insured's HomeGuard account: a HomeGuard policy in force with no returned payment posted on it in the 12 calendar months up to the charge date takes 5.00 USD off, a HomeGuard policy in force with one or more returned payments posted on it in those months adds 5.00 USD, and no HomeGuard policy in force changes nothing.
      The returned-fee tenure credit looks at whole months from the original effective date to the charge date: 120 months or more take 10.00 USD off, 60 to 119 months take 5.00 USD off, and fewer than 60 months take nothing off.
      The return-frequency factor depends on the returned payments posted on the policy in the 12 calendar months up to the charge date, this one included: three or more multiply the fee by 2, exactly two multiply it by 1.5, and one leaves it as it stands.
    prerequisite: []
    cross_category:
      - category: home
        as: history
        reads: [status, home_billing.event_type, home_billing.posted_date]
        note: The household standing adjustment reads the HomeGuard policy in force and the returned payments posted on the named insured's HomeGuard account.
    compute:
      - returned_amount: "LATEST('dwelling_billing', 'amount', date_field='posted_date', event_type='dwelling_payment_returned')"
      - fee_basis: "P('returned_payment_fee') + (returned_amount - K('large_return_usd')) * K('excess_rate_pct') / 100 if returned_amount > K('large_return_usd') else (P('returned_payment_fee') / 2 if returned_amount <= K('small_return_usd') else P('returned_payment_fee'))"
      - last_method: "LATEST('dwelling_billing', 'payment_method', date_field='posted_date', event_type='dwelling_payment_received')"
      - channel_add: "K('check_add') if last_method == 'check' else (K('eft_add') if last_method == 'eft' else 0)"
      - home_live: "EXISTS('home', status='in_force')"
      - n_home_returned: "XCOUNT('home', 'home_billing', within_months=12, date_field='posted_date', event_type='home_payment_returned')"
      - household_adj: "0 - K('home_clean_credit') if (home_live and n_home_returned == 0) else (K('home_returned_add') if (home_live and n_home_returned >= 1) else 0)"
      - tenure_months: "MONTHS(F('original_effective_date'), NOW)"
      - tenure_credit: "K('tenure_120_credit') if tenure_months >= 120 else (K('tenure_60_credit') if tenure_months >= 60 else 0)"
      - n_returned_12: "COUNT('dwelling_billing', within_months=12, date_field='posted_date', event_type='dwelling_payment_returned')"
      - frequency_factor: "K('three_plus_factor') if n_returned_12 >= 3 else (K('two_factor') if n_returned_12 == 2 else 1)"
      - result: "RND(MX(0, (fee_basis + channel_add + household_adj - tenure_credit) * frequency_factor), 2)"
    compute_basis:
      returned_amount: "How the returned-fee basis is set depends on the amount of the returned payment (the most recently posted returned payment)"
      fee_basis: "a payment above 1000 USD takes the tier's returned_payment_fee plus 2 percent of the part of the payment above 1000 USD; a payment of 100 USD or less takes half the tier's returned_payment_fee; any other payment takes the tier's returned_payment_fee."
      last_method: "The payment-channel add-on looks at the method of the most recent payment received on the policy, the payment the return reverses"
      channel_add: "a check adds 5.00 USD, an EFT draft adds 2.50 USD, and any other method adds nothing."
      home_live: "a HomeGuard policy in force"
      n_home_returned: "no returned payment posted on it in the 12 calendar months up to the charge date"
      household_adj: "a HomeGuard policy in force with no returned payment posted on it in the 12 calendar months up to the charge date takes 5.00 USD off, a HomeGuard policy in force with one or more returned payments posted on it in those months adds 5.00 USD, and no HomeGuard policy in force changes nothing."
      tenure_months: "The returned-fee tenure credit looks at whole months from the original effective date to the charge date"
      tenure_credit: "120 months or more take 10.00 USD off, 60 to 119 months take 5.00 USD off, and fewer than 60 months take nothing off."
      n_returned_12: "The return-frequency factor depends on the returned payments posted on the policy in the 12 calendar months up to the charge date, this one included"
      frequency_factor: "three or more multiply the fee by 2, exactly two multiply it by 1.5, and one leaves it as it stands."
      result: "The returned-payment fee is the returned-fee basis plus the returned-fee adjustment, multiplied by the return-frequency factor, never below 0.00, rounded half-up to the cent once on the final figure. The returned-fee adjustment is the payment-channel add-on plus the household standing adjustment minus the returned-fee tenure credit, the three added together."
    factors:
      - id: returned_fee_basis
        effect: method
        decides: fee_basis
        bindings: [returned_amount, fee_basis]
        ladder:
          - when: "returned payment above 1000 USD"
            method: "the tier's returned_payment_fee plus 2 percent of the part of the payment above 1000 USD"
          - when: "returned payment of 100 USD or less"
            method: "half the tier's returned_payment_fee"
          - when: "otherwise"
            method: "the tier's returned_payment_fee"
        baseline:
          fee_basis: "P('returned_payment_fee')"
        evidence: [history]
        cross_difficulty: null
      - id: payment_channel
        effect: parameter
        decides: channel_add
        bindings: [last_method, channel_add]
        ladder:
          - when: "most recent payment received was a check"
            value: "K('check_add') = 5.00 USD"
          - when: "most recent payment received was an EFT draft"
            value: "K('eft_add') = 2.50 USD"
          - when: "otherwise (card or any other method)"
            value: "0.00"
        baseline:
          channel_add: "0"
        evidence: [history]
        cross_difficulty: null
      - id: household_standing
        effect: parameter
        decides: household_adj
        bindings: [home_live, n_home_returned, household_adj]
        ladder:
          - when: "HomeGuard policy in force AND no returned payment on the HomeGuard account in the 12 months"
            value: "-K('home_clean_credit') = 5.00 USD off"
          - when: "HomeGuard policy in force AND one or more returned payments on it in the 12 months"
            value: "K('home_returned_add') = 5.00 USD added"
          - when: "otherwise (no HomeGuard policy in force)"
            value: "0.00"
        baseline:
          household_adj: "0"
        evidence: [cross_category, history]
        cross_difficulty: home
      - id: returned_fee_tenure_credit
        effect: parameter
        decides: tenure_credit
        bindings: [tenure_months, tenure_credit]
        ladder:
          - when: "120 or more whole months since the original effective date"
            value: "K('tenure_120_credit') = 10.00 USD off"
          - when: "60 to 119 whole months"
            value: "K('tenure_60_credit') = 5.00 USD off"
          - when: "otherwise (fewer than 60 months)"
            value: "0.00"
        baseline:
          tenure_credit: "0"
        evidence: [date]
        cross_difficulty: null
      - id: return_frequency
        effect: parameter
        decides: frequency_factor
        bindings: [n_returned_12, frequency_factor]
        ladder:
          - when: "three or more returned payments in the 12 months, this one included"
            value: "K('three_plus_factor') = 2"
          - when: "exactly two returned payments"
            value: "K('two_factor') = 1.5"
          - when: "otherwise (this one only)"
            value: "1"
        baseline:
          frequency_factor: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A returned-payment fee is charged once for each returned payment and points at that returned payment; a returned payment found without its fee is charged on the day it is found.
        The returned-payment fee is the returned-fee basis plus the returned-fee adjustment, multiplied by the return-frequency factor, never below 0.00, rounded half-up to the cent once on the final figure.
        The standard returned-fee basis is the tier's returned_payment_fee, the standard returned-fee adjustment is zero and the standard return-frequency factor is 1.
      params: [returned_payment_fee]
    inputs:
      history:
        - {table: dwelling_billing, aggregate: latest, field: amount, filters: {event_type: dwelling_payment_returned}}
        - {table: dwelling_billing, aggregate: latest, field: payment_method, filters: {event_type: dwelling_payment_received}}
        - {table: dwelling_billing, aggregate: count, field: posted_date, within_months: 12, filters: {event_type: dwelling_payment_returned}}
        - {category: home, table: home_billing, aggregate: count, field: posted_date, within_months: 12, filters: {event_type: home_payment_returned}}
      cross_category: [home]

  - id: dwelling_ext_term_payoff
    base_policy_refs: [dwelling_billing_and_payments]
    overwrite:
      - base_policy: dwelling_billing_and_payments
        superseded_clause: >-
          Each term is billed on its plan's schedule
        replaced_by: >-
          A named insured may pay off the current term in one payment recorded against the current term, and a term paid off in full receives no further installment bill.
    trigger: on_request
    subject: [dwelling_payment_received]
    computes: amount
    target_tool: pay_off_term_premium_a09f99f1
    params:
      late_two_plus_pct: 2
      late_one_pct: 1
      tenure_120_pct: 2
      tenure_60_pct: 1
      claim_free_pct: 2
      one_claim_pct: 1
    rule: >-
      A named insured may pay off the current term in one payment recorded against the current term, and a term paid off in full receives no further installment bill.
      The pay-off amount is not fixed until every billed installment of the current term other than installment 1 carries its installment fee on the premium account.
      The pay-off amount is fixed only after each returned payment posted on the policy carries its returned-payment fee entry.
      The pay-off amount is not fixed until the premium account carries a late fee for every installment still unpaid more than the grace days after its due date.
      The pay-off amount is the amount past due on the policy plus the unbilled premium of the current term adjusted by the pay-off percentage, plus the pay-off installment fees, rounded half-up to the cent once on the final figure.
      The amount past due is every premium installment billed, fee, returned payment, additional premium and refund posted on the policy, less every payment received and return premium posted, never below 0.00; the unbilled premium is the current term_premium less the installments billed for the current term, never below 0.00.
      The standard pay-off percentage is zero and the standard pay-off installment fees are zero.
      The pay-off percentage is the late-payment load minus the pay-off tenure discount minus the claim-free discount, the three added together and applied once to the unbilled premium.
      The late-payment load counts the late fees posted on the policy in the 24 calendar months up to the pay-off date: two or more give 2 percent, exactly one gives 1 percent, and none gives 0 percent.
      The pay-off tenure discount looks at whole months from the original effective date to the pay-off date: 120 months or more give 2 percent, 60 to 119 months give 1 percent, and fewer than 60 months give 0 percent.
      The claim-free discount counts claims reported on the policy with a loss date in the claims_lookback_months calendar months up to the pay-off date: none gives 2 percent, exactly one gives 1 percent, and two or more give 0 percent.
      The pay-off installment fees depend on the returned payments posted on the policy in the 12 calendar months up to the pay-off date: with two or more, every installment of the current term not yet billed carries the tier's installment_fee_direct; with exactly one, only the next unbilled installment carries it; with none, no fee is charged on unbilled installments.
      The number of installments in a term is 1 on the annual and mortgagee_escrow plans, 2 on two_pay and 4 on quarterly.
      A pay-off made after repeated returned payments ends the installment plan on the insured's default rather than by the insured's choice, so the service charges the plan would have carried stay earned; the late-payment load prices the collection cost that a record of late installments adds to the premium still unbilled.
    prerequisite:
      - problem: dwelling_ext_installment_fee
        kind: value_input
        gate: fees
        form: state
        policy_source: >-
          The pay-off amount is not fixed until every billed installment of the current term other than installment 1 carries its installment fee on the premium account.
        condition: >-
          Every dwelling_billing premium-billed entry of the current term with installment_number above 1 has a dwelling_fee_assessed entry with fee_code installment_fee for the same term_effective_date and installment_number.
        resolved_by: assess_installment_fee_8325e06b
        effect: >-
          Once the missing installment fee is posted, the binding fees (and with it the amount past due) rises by that fee.
      - problem: dwelling_ext_returned_payment_fee
        kind: value_input
        gate: fees
        form: state
        policy_source: >-
          The pay-off amount is fixed only after each returned payment posted on the policy carries its returned-payment fee entry.
        condition: >-
          Every dwelling_payment_returned entry of the policy has a dwelling_fee_assessed entry with fee_code returned_payment_fee whose source_billing_id is that returned entry.
        resolved_by: assess_returned_payment_fee_55a26ad1
        effect: >-
          Once the missing returned-payment fee is posted, the binding fees (and the amount past due) rises by that fee.
      - problem: dwelling_ext_late_fee
        kind: value_input
        gate: n_late_24
        form: state
        policy_source: >-
          The pay-off amount is not fixed until the premium account carries a late fee for every installment still unpaid more than the grace days after its due date.
        condition: >-
          Every billed installment unpaid more than late_fee_grace_days after its due_date has a dwelling_fee_assessed entry with fee_code late_fee for its term_effective_date and installment_number.
        resolved_by: assess_late_fee_984fd113
        effect: >-
          Once the late fee is posted, the binding n_late_24 counts it (moving the late-payment load tier) and the amount past due rises by the fee.
    cross_category: []
    compute:
      - billed: "SUM('dwelling_billing', 'amount', event_type='dwelling_premium_billed')"
      - fees: "SUM('dwelling_billing', 'amount', event_type='dwelling_fee_assessed')"
      - returned: "SUM('dwelling_billing', 'amount', event_type='dwelling_payment_returned')"
      - additional: "SUM('dwelling_billing', 'amount', event_type='dwelling_additional_premium')"
      - refunds: "SUM('dwelling_billing', 'amount', event_type='dwelling_refund_issued')"
      - paid: "SUM('dwelling_billing', 'amount', event_type='dwelling_payment_received')"
      - credits: "SUM('dwelling_billing', 'amount', event_type='dwelling_return_premium')"
      - past_due: "MX(0, billed + fees + returned + additional + refunds - paid - credits)"
      - term_billed: "SUM('dwelling_billing', 'amount', event_type='dwelling_premium_billed', term_effective_date=F('effective_date'))"
      - unbilled: "MX(0, F('term_premium') - term_billed)"
      - plan_count: "4 if F('billing_plan') == 'quarterly' else (2 if F('billing_plan') == 'two_pay' else 1)"
      - n_unbilled: "MX(0, plan_count - COUNT('dwelling_billing', event_type='dwelling_premium_billed', term_effective_date=F('effective_date')))"
      - n_returned_12: "COUNT('dwelling_billing', within_months=12, date_field='posted_date', event_type='dwelling_payment_returned')"
      - unbilled_fees: "n_unbilled * P('installment_fee_direct') if n_returned_12 >= 2 else (MN(n_unbilled, 1) * P('installment_fee_direct') if n_returned_12 == 1 else 0)"
      - n_late_24: "COUNT('dwelling_billing', within_months=24, date_field='posted_date', event_type='dwelling_fee_assessed', fee_code='late_fee')"
      - late_load: "K('late_two_plus_pct') if n_late_24 >= 2 else (K('late_one_pct') if n_late_24 == 1 else 0)"
      - tenure_months: "MONTHS(F('original_effective_date'), NOW)"
      - tenure_disc: "K('tenure_120_pct') if tenure_months >= 120 else (K('tenure_60_pct') if tenure_months >= 60 else 0)"
      - n_claims: "COUNT('dwelling_claims', within_months=P('claims_lookback_months'), date_field='loss_date', event_type='dwelling_claim_reported')"
      - claim_free_disc: "K('claim_free_pct') if n_claims == 0 else (K('one_claim_pct') if n_claims == 1 else 0)"
      - result: "RND(past_due + unbilled * (1 + (late_load - tenure_disc - claim_free_disc) / 100) + unbilled_fees, 2)"
    compute_basis:
      billed: "every premium installment billed"
      fees: "fee"
      returned: "returned payment"
      additional: "additional premium"
      refunds: "and refund posted on the policy"
      paid: "less every payment received"
      credits: "and return premium posted"
      past_due: "The amount past due is every premium installment billed, fee, returned payment, additional premium and refund posted on the policy, less every payment received and return premium posted, never below 0.00"
      term_billed: "the installments billed for the current term"
      unbilled: "the unbilled premium is the current term_premium less the installments billed for the current term, never below 0.00."
      plan_count: "The number of installments in a term is 1 on the annual and mortgagee_escrow plans, 2 on two_pay and 4 on quarterly."
      n_unbilled: "every installment of the current term not yet billed"
      n_returned_12: "The pay-off installment fees depend on the returned payments posted on the policy in the 12 calendar months up to the pay-off date"
      unbilled_fees: "with two or more, every installment of the current term not yet billed carries the tier's installment_fee_direct; with exactly one, only the next unbilled installment carries it; with none, no fee is charged on unbilled installments."
      n_late_24: "The late-payment load counts the late fees posted on the policy in the 24 calendar months up to the pay-off date"
      late_load: "two or more give 2 percent, exactly one gives 1 percent, and none gives 0 percent."
      tenure_months: "The pay-off tenure discount looks at whole months from the original effective date to the pay-off date"
      tenure_disc: "120 months or more give 2 percent, 60 to 119 months give 1 percent, and fewer than 60 months give 0 percent."
      n_claims: "The claim-free discount counts claims reported on the policy with a loss date in the claims_lookback_months calendar months up to the pay-off date"
      claim_free_disc: "none gives 2 percent, exactly one gives 1 percent, and two or more give 0 percent."
      result: "The pay-off amount is the amount past due on the policy plus the unbilled premium of the current term adjusted by the pay-off percentage, plus the pay-off installment fees, rounded half-up to the cent once on the final figure. The pay-off percentage is the late-payment load minus the pay-off tenure discount minus the claim-free discount, the three added together and applied once to the unbilled premium."
    factors:
      - id: payoff_installment_fees
        effect: method
        decides: unbilled_fees
        bindings: [n_returned_12, unbilled_fees]
        ladder:
          - when: "two or more returned payments posted in the 12 months up to the pay-off date"
            method: "every unbilled installment of the term carries the tier's installment_fee_direct"
          - when: "exactly one returned payment in those months"
            method: "only the next unbilled installment carries the fee"
          - when: "otherwise (none)"
            method: "no fee on unbilled installments"
        baseline:
          unbilled_fees: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: late_payment_load
        effect: parameter
        decides: late_load
        bindings: [n_late_24, late_load]
        ladder:
          - when: "two or more late fees posted in the 24 months up to the pay-off date"
            value: "K('late_two_plus_pct') = 2 percent"
          - when: "exactly one late fee"
            value: "K('late_one_pct') = 1 percent"
          - when: "otherwise (none)"
            value: "0 percent"
        baseline:
          late_load: "0"
        evidence: [history]
        cross_difficulty: null
      - id: payoff_tenure_discount
        effect: parameter
        decides: tenure_disc
        bindings: [tenure_months, tenure_disc]
        ladder:
          - when: "120 or more whole months since the original effective date"
            value: "K('tenure_120_pct') = 2 percent"
          - when: "60 to 119 whole months"
            value: "K('tenure_60_pct') = 1 percent"
          - when: "otherwise (fewer than 60 months)"
            value: "0 percent"
        baseline:
          tenure_disc: "0"
        evidence: [date]
        cross_difficulty: null
      - id: claim_free_discount
        effect: parameter
        decides: claim_free_disc
        bindings: [n_claims, claim_free_disc]
        ladder:
          - when: "no claim reported with a loss date in the claims lookback window"
            value: "K('claim_free_pct') = 2 percent"
          - when: "exactly one such claim"
            value: "K('one_claim_pct') = 1 percent"
          - when: "otherwise (two or more)"
            value: "0 percent"
        baseline:
          claim_free_disc: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A named insured may pay off the current term in one payment recorded against the current term, and a term paid off in full receives no further installment bill.
        The pay-off amount is the amount past due on the policy plus the unbilled premium of the current term adjusted by the pay-off percentage, plus the pay-off installment fees, rounded half-up to the cent once on the final figure.
        The amount past due is every premium installment billed, fee, returned payment, additional premium and refund posted on the policy, less every payment received and return premium posted, never below 0.00; the unbilled premium is the current term_premium less the installments billed for the current term, never below 0.00.
        The standard pay-off percentage is zero and the standard pay-off installment fees are zero.
        The number of installments in a term is 1 on the annual and mortgagee_escrow plans, 2 on two_pay and 4 on quarterly.
      params: [installment_fee_direct]
    inputs:
      history:
        - {table: dwelling_billing, aggregate: sum, field: amount, filters: {}}
        - {table: dwelling_billing, aggregate: count, field: posted_date, within_months: 12, filters: {event_type: dwelling_payment_returned}}
        - {table: dwelling_billing, aggregate: count, field: posted_date, within_months: 24, filters: {event_type: dwelling_fee_assessed, fee_code: late_fee}}
        - {table: dwelling_claims, aggregate: count, field: loss_date, within_months: 36, filters: {event_type: dwelling_claim_reported}}
      cross_category: []
