          The companion discount on the renewal offer date is the tier's companion discount percentage plus the long companion extra percentage when a HomeGuard policy of the customer in force at the same property address has been in force since its original effective date for at least the long companion months; the tier's companion discount percentage when a HomeGuard policy in force at the same property address has been in force for fewer than the long companion months, or a LandlordGuard policy of the customer is in force at the same property address; and no companion discount otherwise.
    trigger: state_due
    subject: [flood_renewal_offered]
    computes: indicated_renewal_premium
    target_tool: record_flood_renewal_offer_81f1ff73
    params:
      zone_rate_x: 0.64
      zone_rate_a: 3.87
      zone_rate_ae: 2.96
      zone_rate_ve: 6.42
      newly_mapped_rate: 1.45
      newly_mapped_months: 24
      recent_loss_months: 36
      loss_lookback_months: 120
      loss_load_recent_pct: 15
      loss_load_older_pct: 5
      elevation_after_claim_share: 0.5
      long_companion_months: 60
      long_companion_extra_pct: 3
      pre_firm_year: 1975
      pre_firm_load_pct: 10
      modern_build_year: 2000
      modern_build_credit_pct: 5
    rule: >-
      The indicated renewal premium is worked out on the renewal offer date from the records on file that day.
      The building premium is the rated building amount divided by 1,000, multiplied by the building rate and by the tier's building rate factor.
      The rated building amount is the building limit on file, and the building rate is the zone building rate of the flood zone on file.
      The contents premium is the contents limit on file divided by 1,000 and multiplied by the tier's contents rate per 1,000.
      The indicated renewal premium is the building premium plus the contents premium, rounded half-up to the cent once at the end, and never less than the tier's minimum annual premium.
      The rated building amount is chosen as follows: when the building limit on file exceeds the building replacement cost on file, the building premium is rated on the replacement cost instead of the limit; when the limit does not exceed the replacement cost and a building limit increase recorded on the policy attaches after the renewal offer date and no later than the expiration date, it is rated on the increased limit that increase records; in every other case it is rated on the building limit on file.
      The building rate is selected as follows: a building in zone A or AE whose map revision date on file is fewer than the newly mapped months before the renewal offer date is rated at the newly mapped rate; a building in zone VE is rated at the zone VE building rate raised by the tier's VE surcharge percentage; every other building is rated at the zone building rate of its flood zone on file.
      A flood loss load raises the building premium by the recent loss load percentage when a flood claim payment was issued on the policy within the recent loss months before the renewal offer date; by the older loss load percentage when no flood claim payment was issued within the recent loss months but one was issued within the loss lookback months; and by nothing when no flood claim payment was issued within the loss lookback months.
      An elevation credit reduces the building premium by the tier's elevation credit percentage when the elevation certificate on file shows the lowest floor at least one foot above base flood elevation and no flood claim payment was issued on the policy within the loss lookback months; by the tier's elevation credit percentage multiplied by the elevation after-claim share when the certificate shows at least one foot above base flood elevation and a flood claim payment was issued within the loss lookback months; and by nothing when the certificate on file does not show at least one foot above base flood elevation.
      A construction-era adjustment follows the year built on the customer's HomeGuard policy in force at the same property address: a building built before the pre-FIRM year carries the pre-FIRM load percentage as a surcharge on the building premium; a building built in or after the modern build year carries the modern build credit percentage as a reduction of the building premium; and a building built in between, or one with no HomeGuard policy in force at the same property address, carries no construction-era adjustment.
      The companion discount on the renewal offer date is the tier's companion discount percentage plus the long companion extra percentage when a HomeGuard policy of the customer in force at the same property address has been in force since its original effective date for at least the long companion months; the tier's companion discount percentage when a HomeGuard policy in force at the same property address has been in force for fewer than the long companion months, or a LandlordGuard policy of the customer is in force at the same property address; and no companion discount otherwise.
      The flood loss load, the construction-era adjustment and the elevation credit each multiply the building premium in turn, each acting on the building premium as already adjusted by the one before; the companion discount then reduces the sum of the adjusted building premium and the contents premium once, and rounding half-up to the cent and the minimum annual premium are applied only to that final figure.
    prerequisite: []
    cross_category:
      - category: home
        as: branch
        reads: [property_address, status, original_effective_date, year_built]
        note: The companion discount tier and the construction-era adjustment are decided from the customer's HomeGuard policy in force at the same property address.
      - category: dwelling
        as: branch
        reads: [property_address, status]
        note: A LandlordGuard policy in force at the same property address places the customer on the standard companion discount tier.
    compute:
      - zone_rate_on_file: "K('zone_rate_x') if F('flood_zone') == 'X' else (K('zone_rate_a') if F('flood_zone') == 'A' else (K('zone_rate_ae') if F('flood_zone') == 'AE' else K('zone_rate_ve')))"
      - months_since_map_revision: "MONTHS(F('map_revision_date'), NOW) if F('map_revision_date') else 999"
      - bldg_rate: "K('newly_mapped_rate') if ((F('flood_zone') == 'A' or F('flood_zone') == 'AE') and months_since_map_revision < K('newly_mapped_months')) else (K('zone_rate_ve') * (1 + P('zones_rated_extra_pct') / 100) if F('flood_zone') == 'VE' else zone_rate_on_file)"
      - increase_attach_date: "LATEST('flood_endorsements', 'effective_date', date_field='request_date', change_code='building_increase')"
      - increase_new_limit: "LATEST('flood_endorsements', 'coverage_value', date_field='request_date', change_code='building_increase')"
      - rated_building_amount: "F('building_replacement_cost') if F('building_limit') > F('building_replacement_cost') else (increase_new_limit if (increase_attach_date and increase_attach_date > NOW and increase_attach_date <= F('expiration_date')) else F('building_limit'))"
      - claim_payments_recent: "COUNT('flood_claims', within_months=K('recent_loss_months'), date_field='entry_date', event_type='flood_claim_payment')"
      - claim_payments_lookback: "COUNT('flood_claims', within_months=K('loss_lookback_months'), date_field='entry_date', event_type='flood_claim_payment')"
      - loss_load_pct: "K('loss_load_recent_pct') if claim_payments_recent > 0 else (K('loss_load_older_pct') if claim_payments_lookback > 0 else 0)"
      - elevation_claim_payments: "COUNT('flood_claims', within_months=K('loss_lookback_months'), date_field='entry_date', event_type='flood_claim_payment')"
      - elev_credit_pct: "P('elevation_credit_pct') if (F('elevation_certificate') == 'at_or_above_1ft' and elevation_claim_payments == 0) else (P('elevation_credit_pct') * K('elevation_after_claim_share') if (F('elevation_certificate') == 'at_or_above_1ft' and elevation_claim_payments > 0) else 0)"
      - era_home_same_address: "CFIELD('home', 'property_address', status='in_force', property_address=F('property_address')) == F('property_address')"
      - home_year_built: "int(CFIELD('home', 'year_built', status='in_force', property_address=F('property_address')) or 0)"
      - era_load_pct: "K('pre_firm_load_pct') if (era_home_same_address and home_year_built > 0 and home_year_built < K('pre_firm_year')) else (0 - K('modern_build_credit_pct') if (era_home_same_address and home_year_built >= K('modern_build_year')) else 0)"
      - home_same_address: "CFIELD('home', 'property_address', status='in_force', property_address=F('property_address')) == F('property_address')"
      - home_months_in_force: "MONTHS(CFIELD('home', 'original_effective_date', status='in_force', property_address=F('property_address')) or NOW, NOW)"
      - dwelling_same_address: "CFIELD('dwelling', 'property_address', status='in_force', property_address=F('property_address')) == F('property_address')"
      - companion_pct: "P('companion_discount_pct') + K('long_companion_extra_pct') if (home_same_address and home_months_in_force >= K('long_companion_months')) else (P('companion_discount_pct') if ((home_same_address and home_months_in_force < K('long_companion_months')) or dwelling_same_address) else 0)"
      - building_premium: "rated_building_amount / 1000 * bldg_rate * P('building_rate_factor')"
      - adjusted_building_premium: "building_premium * (1 + loss_load_pct / 100) * (1 + era_load_pct / 100) * (1 - elev_credit_pct / 100)"
      - contents_premium: "F('contents_limit') / 1000 * P('contents_rate_per_1000')"
      - result: "MX(P('minimum_annual_premium'), RND((adjusted_building_premium + contents_premium) * (1 - companion_pct / 100), 2))"
    compute_basis:
      zone_rate_on_file: "The rated building amount is the building limit on file, and the building rate is the zone building rate of the flood zone on file."
      months_since_map_revision: "a building in zone A or AE whose map revision date on file is fewer than the newly mapped months before the renewal offer date is rated at the newly mapped rate"
