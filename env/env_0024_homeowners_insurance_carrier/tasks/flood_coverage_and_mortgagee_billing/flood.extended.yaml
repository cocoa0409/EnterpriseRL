        ladder:
          - when: "the elevation certificate shows at least one foot above base flood elevation and no flood claim payment was issued within the loss lookback months"
            value: "P('elevation_credit_pct')"
          - when: "the elevation certificate shows at least one foot above base flood elevation and a flood claim payment was issued within the loss lookback months"
            value: "P('elevation_credit_pct') * K('elevation_after_claim_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          elev_credit_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: construction_era_adjustment
        effect: parameter
        decides: era_load_pct
        bindings: [era_home_same_address, home_year_built, era_load_pct]
        ladder:
          - when: "the HomeGuard policy in force at the same property address shows the building built before the pre-FIRM year"
            value: "K('pre_firm_load_pct')"
          - when: "the HomeGuard policy in force at the same property address shows the building built in or after the modern build year"
            value: "0 - K('modern_build_credit_pct')"
          - when: "otherwise"
            value: "0"
