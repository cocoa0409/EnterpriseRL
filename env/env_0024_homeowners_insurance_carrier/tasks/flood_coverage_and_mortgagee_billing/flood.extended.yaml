    baseline:
      rule: >-
        The indicated renewal premium is worked out on the renewal offer date from the records on file that day.
        The building premium is the rated building amount divided by 1,000, multiplied by the building rate and by the tier's building rate factor.
        The rated building amount is the building limit on file, and the building rate is the zone building rate of the flood zone on file.
        The contents premium is the contents limit on file divided by 1,000 and multiplied by the tier's contents rate per 1,000.
        The indicated renewal premium is the building premium plus the contents premium, rounded half-up to the cent once at the end, and never less than the tier's minimum annual premium.
      params: [zone_rate_x, zone_rate_a, zone_rate_ae, zone_rate_ve, building_rate_factor, contents_rate_per_1000, minimum_annual_premium]
    inputs:
      history:
        - {table: flood_claims, aggregate: count, field: flood_claim_entry_id, within_months: 120, filters: {event_type: flood_claim_payment}}
        - {table: flood_endorsements, aggregate: latest, field: effective_date, filters: {change_code: building_increase}}
      cross_category: [home, dwelling]
  - id: flood_ext_renewal_term
    base_policy_refs: [flood_premium_rating, flood_renewal, flood_agg_companion_discount]
    overwrite:
      - base_policy: flood_premium_rating
        superseded_clause: >-
          the renewal term premium is the smaller of that indicated premium and the expiring term_premium increased by renewal_rate_cap_pct, rounded half-up to the cent.
        replaced_by: >-
          The prompt-payment, claim-free and account credit percentages are added together and the total reduces the smaller of the indicated renewal premium and the capped premium once; rounding half-up to the cent is applied only to the final renewal term premium.
    trigger: state_due
    subject: [flood_policy_renewed]
    computes: term_premium
    target_tool: renew_flood_policy_8cc307a9
    params:
      loyal_months: 120
      tenured_months: 60
      loyal_cap_reduction_pct: 7
      tenured_cap_reduction_pct: 3
      claim_window_months: 60
      loss_lookback_months: 120
      returned_window_months: 36
      prompt_pay_credit_pct: 2
      late_pay_credit_pct: 1
      claim_free_window_months: 60
      claim_free_all_pct: 4
      claim_free_recent_pct: 2
      account_credit_scheduled_pct: 3
      account_credit_unscheduled_pct: 1
    rule: >-
      The renewal term premium is the smaller of the indicated renewal premium on file and the capped premium, rounded half-up to the cent.
      The capped premium is the expiring term premium increased by the tier's renewal rate cap percentage, rounded half-up to the cent.
      The renewal term premium is fixed only after the indicated premium for the upcoming term stands on the policy.
      The tenure counted for the renewal rate cap is measured in whole calendar months to the date the renewal is recorded, from a start date chosen as follows: when a HomeGuard policy of the customer in force at the same property address began before the flood policy's original effective date and no flood claim payment was issued on the flood policy within the loss lookback months before the date the renewal is recorded, from that HomeGuard policy's original effective date; when a flood claim payment was issued on the flood policy within the loss lookback months, from the date of the most recent flood claim payment; and otherwise from the flood policy's original effective date.
      The renewal rate cap percentage is the tier's renewal rate cap percentage less the loyal cap reduction when the counted tenure is at least the loyal months and no flood claim payment was issued within the claim window months before the date the renewal is recorded; the tier's renewal rate cap percentage less the tenured cap reduction when the counted tenure is at least the tenured months but fewer than the loyal months and no flood claim payment was issued within the claim window months; and the tier's renewal rate cap percentage otherwise.
      A prompt-payment credit reduces the renewal term premium by the prompt-payment credit percentage when no payment on the policy was returned within the returned-payment window months and the most recent premium payment was received no later than the due date of the most recent premium charge; by the late-payment credit percentage when no payment was returned within that window and the most recent premium payment was received after that due date; and by nothing when a payment was returned within that window.
      A claim-free credit reduces the renewal term premium by the all-time claim-free credit percentage when no flood claim payment has ever been issued on the policy; by the recent claim-free credit percentage when a flood claim payment was issued on the policy but none within the claim-free window months before the date the renewal is recorded; and by nothing when a flood claim payment was issued within the claim-free window months.
      An account credit reduces the renewal term premium by the scheduled account credit percentage when the customer holds a Larkspur Umbrella policy in force whose underlying schedule lists, and has not since removed, the HomeGuard policy in force at the same property address; by the unscheduled account credit percentage when the customer holds a Larkspur Umbrella policy in force whose underlying schedule does not list that HomeGuard policy or has removed it; and by nothing when the customer holds no Larkspur Umbrella policy in force.
      The prompt-payment, claim-free and account credit percentages are added together and the total reduces the smaller of the indicated renewal premium and the capped premium once; rounding half-up to the cent is applied only to the final renewal term premium.
    prerequisite:
      - problem: flood_ext_renewal_indication
        kind: state_gate
        gate: flood_policies.indicated_renewal_premium
        form: state
        policy_source: >-
          The renewal term premium is fixed only after the indicated premium for the upcoming term stands on the policy.
        condition: >-
          flood_policies.indicated_renewal_premium carries the indicated premium for the upcoming term (it is empty on a policy whose renewal offer was never recorded).
        resolved_by: record_flood_renewal_offer_81f1ff73
        effect: >-
          The indicated renewal premium the smaller-of comparison needs becomes present on the policy, so the renewal term premium can be fixed at all; where the capped premium is the smaller figure the indicated premium's exact value does not move the result.
    cross_category:
      - category: home
        as: branch
        reads: [policy_number, property_address, status, original_effective_date]
        note: The HomeGuard at the same property address decides the tenure start date and identifies the policy whose umbrella scheduling decides the account credit.
      - category: umbrella
        as: history
        reads: [status, umbrella_underlying.underlying_policy_number, umbrella_underlying.underlying_line, umbrella_underlying.event_type]
        note: The account credit tier is decided from the customer's Larkspur Umbrella in force and its underlying-schedule ledger (scheduled less removed entries).
    compute:
      - indicated: "F('indicated_renewal_premium')"
      - expiring_premium: "F('term_premium')"
      - anchor_claims_lookback: "COUNT('flood_claims', within_months=K('loss_lookback_months'), date_field='entry_date', event_type='flood_claim_payment')"
      - anchor_last_claim_payment: "LATEST('flood_claims', 'entry_date', date_field='entry_date', event_type='flood_claim_payment')"
      - anchor_home_start: "CFIELD('home', 'original_effective_date', property_address=F('property_address'), status='in_force')"
      - tenure_months: "MONTHS(anchor_home_start, NOW) if (anchor_home_start and anchor_home_start < F('original_effective_date') and anchor_claims_lookback == 0) else (MONTHS(anchor_last_claim_payment, NOW) if anchor_claims_lookback > 0 else MONTHS(F('original_effective_date'), NOW))"
      - cap_claims_window: "COUNT('flood_claims', within_months=K('claim_window_months'), date_field='entry_date', event_type='flood_claim_payment')"
      - cap_pct: "P('renewal_rate_cap_pct') - K('loyal_cap_reduction_pct') if (tenure_months >= K('loyal_months') and cap_claims_window == 0) else (P('renewal_rate_cap_pct') - K('tenured_cap_reduction_pct') if (tenure_months >= K('tenured_months') and cap_claims_window == 0) else P('renewal_rate_cap_pct'))"
      - capped_premium: "RND(expiring_premium * (1 + cap_pct / 100), 2)"
      - smaller_premium: "MN(indicated, capped_premium)"
      - returned_payments_window: "COUNT('flood_billing', within_months=K('returned_window_months'), date_field='posted_date', event_type='flood_payment_returned')"
      - last_payment_date: "LATEST('flood_billing', 'posted_date', date_field='posted_date', event_type='flood_payment_received')"
      - last_charge_due_date: "LATEST('flood_billing', 'due_date', date_field='posted_date', event_type='flood_premium_billed')"
      - prompt_pay_pct: "K('prompt_pay_credit_pct') if (returned_payments_window == 0 and last_payment_date <= last_charge_due_date) else (K('late_pay_credit_pct') if (returned_payments_window == 0 and last_payment_date > last_charge_due_date) else 0)"
      - claim_payments_ever: "COUNT('flood_claims', event_type='flood_claim_payment')"
      - claim_payments_claim_free_window: "COUNT('flood_claims', within_months=K('claim_free_window_months'), date_field='entry_date', event_type='flood_claim_payment')"
      - claim_free_pct: "K('claim_free_all_pct') if claim_payments_ever == 0 else (K('claim_free_recent_pct') if claim_payments_claim_free_window == 0 else 0)"
      - umbrella_in_force: "EXISTS('umbrella', status='in_force')"
      - home_policy_number_here: "CFIELD('home', 'policy_number', property_address=F('property_address'), status='in_force')"
      - umbrella_schedules_home: "XCOUNT('umbrella', 'umbrella_underlying', event_type='umbrella_underlying_scheduled', underlying_line='home', underlying_policy_number=home_policy_number_here) - XCOUNT('umbrella', 'umbrella_underlying', event_type='umbrella_underlying_removed', underlying_line='home', underlying_policy_number=home_policy_number_here)"
      - account_credit_pct: "K('account_credit_scheduled_pct') if (umbrella_in_force and umbrella_schedules_home > 0) else (K('account_credit_unscheduled_pct') if (umbrella_in_force and umbrella_schedules_home <= 0) else 0)"
      - result: "RND(smaller_premium * (1 - (prompt_pay_pct + claim_free_pct + account_credit_pct) / 100), 2)"
    compute_basis:
      indicated: "The renewal term premium is the smaller of the indicated renewal premium on file and the capped premium, rounded half-up to the cent."
      expiring_premium: "The capped premium is the expiring term premium increased by the tier's renewal rate cap percentage, rounded half-up to the cent."
      anchor_claims_lookback: "no flood claim payment was issued on the flood policy within the loss lookback months before the date the renewal is recorded"
      anchor_last_claim_payment: "from the date of the most recent flood claim payment"
      anchor_home_start: "when a HomeGuard policy of the customer in force at the same property address began before the flood policy's original effective date"
      tenure_months: "The tenure counted for the renewal rate cap is measured in whole calendar months to the date the renewal is recorded, from a start date chosen as follows: when a HomeGuard policy of the customer in force at the same property address began before the flood policy's original effective date and no flood claim payment was issued on the flood policy within the loss lookback months before the date the renewal is recorded, from that HomeGuard policy's original effective date; when a flood claim payment was issued on the flood policy within the loss lookback months, from the date of the most recent flood claim payment; and otherwise from the flood policy's original effective date."
      cap_claims_window: "no flood claim payment was issued within the claim window months before the date the renewal is recorded"
      cap_pct: "The renewal rate cap percentage is the tier's renewal rate cap percentage less the loyal cap reduction when the counted tenure is at least the loyal months and no flood claim payment was issued within the claim window months before the date the renewal is recorded; the tier's renewal rate cap percentage less the tenured cap reduction when the counted tenure is at least the tenured months but fewer than the loyal months and no flood claim payment was issued within the claim window months; and the tier's renewal rate cap percentage otherwise."
      capped_premium: "The capped premium is the expiring term premium increased by the tier's renewal rate cap percentage, rounded half-up to the cent."
      smaller_premium: "The renewal term premium is the smaller of the indicated renewal premium on file and the capped premium, rounded half-up to the cent."
      returned_payments_window: "when no payment on the policy was returned within the returned-payment window months"
      last_payment_date: "the most recent premium payment was received no later than the due date of the most recent premium charge"
      last_charge_due_date: "the due date of the most recent premium charge"
      prompt_pay_pct: "A prompt-payment credit reduces the renewal term premium by the prompt-payment credit percentage when no payment on the policy was returned within the returned-payment window months and the most recent premium payment was received no later than the due date of the most recent premium charge; by the late-payment credit percentage when no payment was returned within that window and the most recent premium payment was received after that due date; and by nothing when a payment was returned within that window."
      claim_payments_ever: "when no flood claim payment has ever been issued on the policy"
      claim_payments_claim_free_window: "none within the claim-free window months before the date the renewal is recorded"
      claim_free_pct: "A claim-free credit reduces the renewal term premium by the all-time claim-free credit percentage when no flood claim payment has ever been issued on the policy; by the recent claim-free credit percentage when a flood claim payment was issued on the policy but none within the claim-free window months before the date the renewal is recorded; and by nothing when a flood claim payment was issued within the claim-free window months."
      umbrella_in_force: "when the customer holds a Larkspur Umbrella policy in force"
      home_policy_number_here: "the HomeGuard policy in force at the same property address"
      umbrella_schedules_home: "whose underlying schedule lists, and has not since removed, the HomeGuard policy in force at the same property address"
      account_credit_pct: "An account credit reduces the renewal term premium by the scheduled account credit percentage when the customer holds a Larkspur Umbrella policy in force whose underlying schedule lists, and has not since removed, the HomeGuard policy in force at the same property address; by the unscheduled account credit percentage when the customer holds a Larkspur Umbrella policy in force whose underlying schedule does not list that HomeGuard policy or has removed it; and by nothing when the customer holds no Larkspur Umbrella policy in force."
      result: "The prompt-payment, claim-free and account credit percentages are added together and the total reduces the smaller of the indicated renewal premium and the capped premium once; rounding half-up to the cent is applied only to the final renewal term premium."
    factors:
      - id: renewal_cap_tenure
        effect: parameter
        decides: cap_pct
        bindings: [cap_claims_window, cap_pct]
        ladder:
          - when: "counted tenure at least the loyal months AND no flood claim payment within the claim window months"
            value: "P('renewal_rate_cap_pct') - K('loyal_cap_reduction_pct')"
          - when: "counted tenure at least the tenured months but fewer than the loyal months AND no flood claim payment within the claim window months"
            value: "P('renewal_rate_cap_pct') - K('tenured_cap_reduction_pct')"
          - when: "otherwise"
            value: "P('renewal_rate_cap_pct')"
        baseline:
          cap_pct: "P('renewal_rate_cap_pct')"
        evidence: [date, history]
        cross_difficulty: null
      - id: cap_tenure_start
        effect: method
        decides: tenure_months
        bindings: [anchor_claims_lookback, anchor_last_claim_payment, anchor_home_start, tenure_months]
        ladder:
          - when: "a HomeGuard in force at the same property address began before the flood policy's original effective date AND no flood claim payment within the loss lookback months"
            method: "tenure is counted from the HomeGuard policy's original effective date (the household's first Larkspur cover at the address)"
          - when: "a flood claim payment was issued within the loss lookback months"
            method: "tenure is counted from the date of the most recent flood claim payment (the loyalty clock restarts at the last paid claim)"
          - when: "otherwise"
            method: "tenure is counted from the flood policy's original effective date"
        baseline:
          tenure_months: "MONTHS(F('original_effective_date'), NOW)"
        evidence: [history, date, cross_category]
        cross_difficulty: home
      - id: prompt_payment_credit
        effect: parameter
        decides: prompt_pay_pct
        bindings: [returned_payments_window, last_payment_date, last_charge_due_date, prompt_pay_pct]
        ladder:
          - when: "no payment returned within the returned-payment window months AND the most recent premium payment received no later than the due date of the most recent premium charge"
            value: "K('prompt_pay_credit_pct')"
          - when: "no payment returned within the returned-payment window months AND the most recent premium payment received after that due date"
            value: "K('late_pay_credit_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          prompt_pay_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: claim_free_credit
        effect: parameter
        decides: claim_free_pct
        bindings: [claim_payments_ever, claim_payments_claim_free_window, claim_free_pct]
        ladder:
          - when: "no flood claim payment has ever been issued on the policy"
            value: "K('claim_free_all_pct')"
          - when: "a flood claim payment was issued on the policy but none within the claim-free window months"
            value: "K('claim_free_recent_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          claim_free_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: umbrella_account_credit
        effect: parameter
        decides: account_credit_pct
        bindings: [umbrella_in_force, home_policy_number_here, umbrella_schedules_home, account_credit_pct]
        ladder:
          - when: "a Larkspur Umbrella in force AND its underlying schedule lists, and has not since removed, the HomeGuard in force at the same property address"
            value: "K('account_credit_scheduled_pct')"
          - when: "a Larkspur Umbrella in force AND its schedule does not list that HomeGuard or has removed it"
            value: "K('account_credit_unscheduled_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          account_credit_pct: "0"
        evidence: [cross_category, history]
        cross_difficulty: umbrella
    baseline:
      rule: >-
        The renewal term premium is the smaller of the indicated renewal premium on file and the capped premium, rounded half-up to the cent.
        The capped premium is the expiring term premium increased by the tier's renewal rate cap percentage, rounded half-up to the cent.
      params: [renewal_rate_cap_pct]
    inputs:
      history:
        - {table: flood_claims, aggregate: count, field: flood_claim_entry_id, within_months: 120, filters: {event_type: flood_claim_payment}}
        - {table: flood_billing, aggregate: latest, field: posted_date, filters: {event_type: flood_payment_received}}
        - {category: umbrella, table: umbrella_underlying, aggregate: count, field: umbrella_underlying_entry_id, filters: {event_type: umbrella_underlying_scheduled, underlying_line: home}}
      cross_category: [home, umbrella]

  - id: flood_ext_renewal_payment
    base_policy_refs: [flood_billing_and_mortgagee, flood_renewal]
    overwrite: []
    trigger: on_request
    subject: [flood_payment_received]
    computes: amount
    target_tool: pay_flood_renewal_premium_ad8d78a5
    params:
      pif_threshold: 250
      pif_high_pct: 3
      pif_low_pct: 1
      late_days_threshold: 15
      late_daily_charge: 1.25
      late_charge_low: 10
      dividend_two_lines_pct: 4
      dividend_one_line_pct: 2
      electronic_window_months: 36
      electronic_all_pct: 1.5
      electronic_mixed_pct: 0.5
    rule: >-
      A renewal payment the named insured makes for a new term is the premium charged for the new term plus the policy fee charged for the new term, plus the balance the premium account shows from earlier terms, a balance owed being added and a credit being deducted.
      A credit balance from earlier terms that came from a payment by anyone other than the named insured is not deducted, because it is refunded to its payer instead.
      A renewal payment is not taken until the premium account carries the premium charge for the new term.
      A pay-in-full discount reduces the renewal payment by the high pay-in-full percentage of the premium charged for the new term when the policy is on the annual plan and that premium is at least the pay-in-full threshold; by the low pay-in-full percentage when the policy is on the annual plan and that premium is below the threshold; and by nothing on any other billing plan.
      A late-renewal charge is added to the renewal payment according to the calendar days from the new term's start date to the payment date: when more than the late days threshold have passed, the charge is the late daily charge multiplied by every calendar day from the new term's start date to the payment date; when at least one day but no more than the late days threshold have passed, the lower late-renewal charge is added as one flat amount; and no charge is added when the payment is made on or before the new term's start date.
      A member dividend reduces the renewal payment by the two-line dividend percentage of the premium charged for the new term when the customer holds both a HomeGuard policy and a Larkspur Umbrella policy in force; by the one-line dividend percentage when the customer holds exactly one of them in force; and by nothing when the customer holds neither.
      An electronic-payment credit reduces the renewal payment by the all-electronic percentage of the premium charged for the new term when the named insured's own premium payments received on the policy within the electronic window months were all made by EFT or card; by the mixed-payment percentage when the named insured's payments in that window were made both by EFT or card and by check; and by nothing when none of the named insured's payments in that window was made by EFT or card.
      The pay-in-full discount, the member dividend and the electronic-payment credit are each worked out on the premium charged for the new term and rounded half-up to the cent; the renewal payment is that premium plus the policy fee and the balance that enters from earlier terms, less the discount, the dividend and the electronic-payment credit, plus the late-renewal charge, rounded half-up to the cent.
    prerequisite:
      - problem: flood_ext_renewal_term
        kind: value_input
        gate: new_term_premium
        form: state
        policy_source: >-
          A renewal payment is not taken until the premium account carries the premium charge for the new term.
        condition: >-
          The policy's effective_date is the start of the new term (the expiring term's expiration date) and flood_billing carries a flood_premium_billed entry whose term_effective_date is that date; while the policy still shows the expiring term, the only premium charge matching its effective_date is the expiring term's own charge, which is not a charge for the new term.
        resolved_by: renew_flood_policy_8cc307a9
        effect: >-
          Before the renewal the binding new_term_premium reads the premium charged for the term the policy's effective_date names, which is the expiring term's own charge (already billed and paid); the renewal moves effective_date to the new term's start date and posts that term's charge, so new_term_premium becomes the renewal term premium and the payment is priced on the new term.
    cross_category:
      - category: home
        as: existence
        reads: [status]
        note: A HomeGuard policy in force is one of the two lines counted for the member dividend.
      - category: umbrella
        as: existence
        reads: [status]
        note: A Larkspur Umbrella in force is the other line counted for the member dividend.
    compute:
      - new_term_premium: "SUM('flood_billing', 'amount', event_type='flood_premium_billed', term_effective_date=F('effective_date'))"
      - new_term_fee: "SUM('flood_billing', 'amount', event_type='flood_fee_assessed', fee_code='policy_fee', term_effective_date=F('effective_date'))"
      - charges_posted: "SUM('flood_billing', 'amount', event_type='flood_premium_billed') + SUM('flood_billing', 'amount', event_type='flood_fee_assessed') + SUM('flood_billing', 'amount', event_type='flood_payment_returned') + SUM('flood_billing', 'amount', event_type='flood_additional_premium') + SUM('flood_billing', 'amount', event_type='flood_refund_issued')"
      - credits_posted: "SUM('flood_billing', 'amount', event_type='flood_payment_received') + SUM('flood_billing', 'amount', event_type='flood_return_premium')"
      - earlier_balance: "RND(charges_posted - credits_posted - new_term_premium - new_term_fee, 2)"
      - last_payer: "LATEST('flood_billing', 'payer', date_field='posted_date', event_type='flood_payment_received')"
      - balance_entering: "earlier_balance if (earlier_balance >= 0 or last_payer == 'insured') else 0"
      - pif_premium_charged: "SUM('flood_billing', 'amount', event_type='flood_premium_billed', term_effective_date=F('effective_date'))"
      - pif_pct: "K('pif_high_pct') if (F('billing_plan') == 'annual' and pif_premium_charged >= K('pif_threshold')) else (K('pif_low_pct') if (F('billing_plan') == 'annual' and pif_premium_charged < K('pif_threshold')) else 0)"
      - days_past_term_start: "DAYS(F('effective_date'), NOW)"
      - late_charge: "K('late_daily_charge') * days_past_term_start if days_past_term_start > K('late_days_threshold') else (K('late_charge_low') if days_past_term_start >= 1 else 0)"
      - home_line_in_force: "EXISTS('home', status='in_force')"
      - umbrella_line_in_force: "EXISTS('umbrella', status='in_force')"
      - dividend_pct: "K('dividend_two_lines_pct') if (home_line_in_force and umbrella_line_in_force) else (K('dividend_one_line_pct') if (home_line_in_force or umbrella_line_in_force) else 0)"
      - electronic_payments_window: "COUNT('flood_billing', within_months=K('electronic_window_months'), date_field='posted_date', event_type='flood_payment_received', payer='insured', payment_method='eft') + COUNT('flood_billing', within_months=K('electronic_window_months'), date_field='posted_date', event_type='flood_payment_received', payer='insured', payment_method='card')"
      - check_payments_window: "COUNT('flood_billing', within_months=K('electronic_window_months'), date_field='posted_date', event_type='flood_payment_received', payer='insured', payment_method='check')"
      - electronic_pct: "K('electronic_all_pct') if (electronic_payments_window > 0 and check_payments_window == 0) else (K('electronic_mixed_pct') if (electronic_payments_window > 0 and check_payments_window > 0) else 0)"
      - pif_discount: "RND(new_term_premium * pif_pct / 100, 2)"
      - member_dividend: "RND(new_term_premium * dividend_pct / 100, 2)"
      - electronic_credit: "RND(new_term_premium * electronic_pct / 100, 2)"
      - result: "RND(new_term_premium + new_term_fee + balance_entering - pif_discount - member_dividend - electronic_credit + late_charge, 2)"
    compute_basis:
      new_term_premium: "A renewal payment the named insured makes for a new term is the premium charged for the new term plus the policy fee charged for the new term"
      new_term_fee: "plus the policy fee charged for the new term"
      charges_posted: "plus the balance the premium account shows from earlier terms, a balance owed being added and a credit being deducted"
      credits_posted: "plus the balance the premium account shows from earlier terms, a balance owed being added and a credit being deducted"
      earlier_balance: "plus the balance the premium account shows from earlier terms, a balance owed being added and a credit being deducted"
      last_payer: "A credit balance from earlier terms that came from a payment by anyone other than the named insured is not deducted, because it is refunded to its payer instead."
      balance_entering: "A credit balance from earlier terms that came from a payment by anyone other than the named insured is not deducted, because it is refunded to its payer instead."
      pif_premium_charged: "that premium is at least the pay-in-full threshold"
      pif_pct: "A pay-in-full discount reduces the renewal payment by the high pay-in-full percentage of the premium charged for the new term when the policy is on the annual plan and that premium is at least the pay-in-full threshold; by the low pay-in-full percentage when the policy is on the annual plan and that premium is below the threshold; and by nothing on any other billing plan."
      days_past_term_start: "according to the calendar days from the new term's start date to the payment date"
      late_charge: "when more than the late days threshold have passed, the charge is the late daily charge multiplied by every calendar day from the new term's start date to the payment date; when at least one day but no more than the late days threshold have passed, the lower late-renewal charge is added as one flat amount; and no charge is added when the payment is made on or before the new term's start date."
      home_line_in_force: "when the customer holds both a HomeGuard policy and a Larkspur Umbrella policy in force"
      umbrella_line_in_force: "when the customer holds both a HomeGuard policy and a Larkspur Umbrella policy in force"
      dividend_pct: "A member dividend reduces the renewal payment by the two-line dividend percentage of the premium charged for the new term when the customer holds both a HomeGuard policy and a Larkspur Umbrella policy in force; by the one-line dividend percentage when the customer holds exactly one of them in force; and by nothing when the customer holds neither."
      electronic_payments_window: "the named insured's own premium payments received on the policy within the electronic window months were all made by EFT or card"
      check_payments_window: "when the named insured's payments in that window were made both by EFT or card and by check"
      electronic_pct: "An electronic-payment credit reduces the renewal payment by the all-electronic percentage of the premium charged for the new term when the named insured's own premium payments received on the policy within the electronic window months were all made by EFT or card; by the mixed-payment percentage when the named insured's payments in that window were made both by EFT or card and by check; and by nothing when none of the named insured's payments in that window was made by EFT or card."
      pif_discount: "The pay-in-full discount, the member dividend and the electronic-payment credit are each worked out on the premium charged for the new term and rounded half-up to the cent"
      member_dividend: "The pay-in-full discount, the member dividend and the electronic-payment credit are each worked out on the premium charged for the new term and rounded half-up to the cent"
      electronic_credit: "The pay-in-full discount, the member dividend and the electronic-payment credit are each worked out on the premium charged for the new term and rounded half-up to the cent"
      result: "the renewal payment is that premium plus the policy fee and the balance that enters from earlier terms, less the discount, the dividend and the electronic-payment credit, plus the late-renewal charge, rounded half-up to the cent."
    factors:
      - id: pay_in_full_discount
        effect: parameter
        decides: pif_pct
        bindings: [pif_premium_charged, pif_pct]
        ladder:
          - when: "annual plan AND the premium charged for the new term is at least the pay-in-full threshold"
            value: "K('pif_high_pct')"
          - when: "annual plan AND the premium charged for the new term is below the pay-in-full threshold"
            value: "K('pif_low_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          pif_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: late_renewal_charge
        effect: method
        decides: late_charge
        bindings: [days_past_term_start, late_charge]
        ladder:
          - when: "more than the late days threshold have passed since the new term's start date"
            method: "the late daily charge multiplied by every calendar day from the new term's start date to the payment date"
          - when: "at least one day but no more than the late days threshold have passed"
            method: "one flat charge, the lower late-renewal charge"
          - when: "otherwise"
            method: "no charge is added"
        baseline:
          late_charge: "0"
        evidence: [date]
        cross_difficulty: null
      - id: member_dividend_lines
        effect: parameter
        decides: dividend_pct
        bindings: [home_line_in_force, umbrella_line_in_force, dividend_pct]
        ladder:
          - when: "a HomeGuard policy in force AND a Larkspur Umbrella policy in force"
            value: "K('dividend_two_lines_pct')"
          - when: "exactly one of a HomeGuard policy or a Larkspur Umbrella policy in force"
            value: "K('dividend_one_line_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          dividend_pct: "0"
        evidence: [cross_category]
        cross_difficulty: home
      - id: electronic_payment_credit
        effect: parameter
        decides: electronic_pct
        bindings: [electronic_payments_window, check_payments_window, electronic_pct]
        ladder:
          - when: "the named insured's payments within the electronic window months made by EFT or card AND none by check"
            value: "K('electronic_all_pct')"
          - when: "the named insured's payments within the electronic window months made by EFT or card AND some by check"
            value: "K('electronic_mixed_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          electronic_pct: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A renewal payment the named insured makes for a new term is the premium charged for the new term plus the policy fee charged for the new term, plus the balance the premium account shows from earlier terms, a balance owed being added and a credit being deducted.
      params: [policy_fee]
    inputs:
      history:
        - {table: flood_billing, aggregate: sum, field: amount, filters: {event_type: flood_premium_billed}}
        - {table: flood_billing, aggregate: count, field: flood_billing_id, within_months: 36, filters: {event_type: flood_payment_received}}
      cross_category: [home, umbrella]

  - id: flood_ext_increase_premium
    base_policy_refs: [flood_billing_and_mortgagee, flood_premium_rating, flood_waiting_period]
    overwrite:
      - base_policy: flood_premium_rating
        superseded_clause: >-
          A limit or zone change never re-rates the term midterm except through a limit increase, whose annual premium change is the difference between the annual premium with and without the increase and is prorated from the date it attaches to the expiration date over the calendar days in the term, rounded half-up to the cent; below min_premium_change nothing is billed.
        replaced_by: >-
          The earned share of a limit increase is chosen as follows: when the increase attaches at least the whole-month threshold days after the term's effective date, the share is the whole calendar months from the attach date to the expiration date divided by twelve; when it attaches no more than the full-charge threshold days after the term's effective date, the full annual premium change is charged; in every other case the share is the calendar days from the attach date to the expiration date divided by the calendar days in the term.
    trigger: state_due
    subject: [flood_additional_premium]
    computes: amount
    target_tool: bill_flood_increase_premium_f099355d
    params:
      whole_month_threshold_days: 90
      full_charge_threshold_days: 30
      long_companion_months: 60
      long_companion_extra_pct: 3
      upper_band_limit: 500000
      middle_band_limit: 300000
      upper_band_share: 0.70
      middle_band_share: 0.85
      adverse_near_days: 90
      adverse_far_days: 365
      adverse_near_load_pct: 25
      adverse_far_load_pct: 10
      itv_full_share: 0.80
      itv_partial_share: 0.60
      itv_full_credit_pct: 5
      itv_partial_credit_pct: 2
      mitigation_window_months: 24
      mitigation_credit_pct: 5
      mitigation_after_loss_credit_pct: 2
    rule: >-
      The additional premium charged for a limit increase is the annual premium change recorded on the limit increase entry multiplied by the earned share of the increase, rounded half-up to the cent once at the end; when that figure is below the tier's minimum premium change, nothing is charged.
      The earned share of the increase is the calendar days from the date the increase attaches to the expiration date divided by the calendar days in the term.
      The earned share of a limit increase is chosen as follows: when the increase attaches at least the whole-month threshold days after the term's effective date, the share is the whole calendar months from the attach date to the expiration date divided by twelve; when it attaches no more than the full-charge threshold days after the term's effective date, the full annual premium change is charged; in every other case the share is the calendar days from the attach date to the expiration date divided by the calendar days in the term.
      The increase companion discount is the tier's companion discount percentage plus the long companion extra percentage when a HomeGuard policy of the customer at the same property address was in force on the date the increase was requested, meaning bound on or before that date and not cancelled or expired by it, and had then been in force since its original effective date for at least the long companion months; the tier's companion discount percentage when such a HomeGuard policy was in force on the request date but for fewer than the long companion months; and no discount when no HomeGuard policy at the same property address was in force on the request date.
      The layer share applied to the annual premium change is the upper band share when the new building limit is above the upper band limit; the middle band share when the new limit is above the middle band limit but not above the upper band limit; and the whole annual premium change otherwise.
      An anti-selection load raises the additional premium by the near load percentage when the most recent flood claim on the policy was reported no more than the near window days before the increase was requested; by the far load percentage when it was reported more than the near window days but no more than the far window days before the request; and by nothing when no flood claim was reported within the far window days before the request.
      An insurance-to-value credit reduces the additional premium by the full credit percentage when the new building limit is at least the full share of the building replacement cost on file; by the partial credit percentage when it is at least the partial share but below the full share; and by nothing below the partial share.
      A mitigation credit reduces the additional premium by the mitigation credit percentage when a loss-avoidance reimbursement was paid on the policy within the mitigation window months before the date the charge is posted and no building or contents payment was issued in that window; by the after-loss mitigation credit percentage when a loss-avoidance reimbursement was paid in that window and a building or contents payment was also issued in it; and by nothing when no loss-avoidance reimbursement was paid in that window.
      The layer share, the anti-selection load, the insurance-to-value credit, the mitigation credit, the increase companion discount and the earned share each multiply the annual premium change in turn, each acting on the figure the one before produced, and rounding is applied only to the final charge.
    prerequisite: []
    cross_category:
      - category: home
        as: branch
        reads: [property_address, status, closed_date, original_effective_date]
        note: The increase companion discount tier is decided from the customer's HomeGuard policy at the same property address as it stood on the request date.
    compute:
      - annual_change: "LATEST('flood_endorsements', 'annual_premium_change', date_field='request_date', change_code='building_increase')"
      - attach_date: "LATEST('flood_endorsements', 'effective_date', date_field='request_date', change_code='building_increase')"
      - request_date: "LATEST('flood_endorsements', 'request_date', date_field='request_date', change_code='building_increase')"
      - days_into_term: "DAYS(F('effective_date'), attach_date)"
      - months_left: "MONTHS(attach_date, F('expiration_date'))"
      - days_left: "DAYS(attach_date, F('expiration_date'))"
      - term_days: "DAYS(F('effective_date'), F('expiration_date'))"
      - earned_share: "months_left / 12 if days_into_term >= K('whole_month_threshold_days') else (1 if days_into_term <= K('full_charge_threshold_days') else days_left / term_days)"
      - home_here_closed: "CFIELD('home', 'closed_date', property_address=F('property_address'))"
      - home_here_live_on_request: "CFIELD('home', 'property_address', property_address=F('property_address')) == F('property_address') and CFIELD('home', 'bound_date', property_address=F('property_address')) <= request_date and (CFIELD('home', 'status', property_address=F('property_address')) == 'in_force' or CFIELD('home', 'status', property_address=F('property_address')) == 'pending_cancellation' or CFIELD('home', 'status', property_address=F('property_address')) == 'pending_nonrenewal' or (home_here_closed and home_here_closed > request_date))"
      - home_here_months_on_request: "MONTHS(CFIELD('home', 'original_effective_date', property_address=F('property_address')) or request_date, request_date)"
      - increase_companion_pct: "P('companion_discount_pct') + K('long_companion_extra_pct') if (home_here_live_on_request and home_here_months_on_request >= K('long_companion_months')) else (P('companion_discount_pct') if (home_here_live_on_request and home_here_months_on_request < K('long_companion_months')) else 0)"
      - band_new_limit: "LATEST('flood_endorsements', 'coverage_value', date_field='request_date', change_code='building_increase')"
      - layer_share: "K('upper_band_share') if band_new_limit > K('upper_band_limit') else (K('middle_band_share') if band_new_limit > K('middle_band_limit') else 1)"
      - last_claim_report: "LATEST('flood_claims', 'entry_date', date_field='entry_date', event_type='flood_claim_reported')"
      - days_claim_to_request: "DAYS(last_claim_report, request_date) if last_claim_report else 99999"
      - anti_selection_pct: "K('adverse_near_load_pct') if (days_claim_to_request >= 0 and days_claim_to_request <= K('adverse_near_days')) else (K('adverse_far_load_pct') if (days_claim_to_request > K('adverse_near_days') and days_claim_to_request <= K('adverse_far_days')) else 0)"
      - itv_new_limit: "LATEST('flood_endorsements', 'coverage_value', date_field='request_date', change_code='building_increase')"
      - itv_credit_pct: "K('itv_full_credit_pct') if itv_new_limit >= K('itv_full_share') * F('building_replacement_cost') else (K('itv_partial_credit_pct') if itv_new_limit >= K('itv_partial_share') * F('building_replacement_cost') else 0)"
      - loss_avoidance_paid_window: "SUM('flood_claims', 'amount', within_months=K('mitigation_window_months'), date_field='entry_date', event_type='flood_claim_payment', coverage_part='loss_avoidance')"
      - damage_paid_window: "SUM('flood_claims', 'amount', within_months=K('mitigation_window_months'), date_field='entry_date', event_type='flood_claim_payment', coverage_part='building') + SUM('flood_claims', 'amount', within_months=K('mitigation_window_months'), date_field='entry_date', event_type='flood_claim_payment', coverage_part='contents')"
      - mitigation_pct: "K('mitigation_credit_pct') if (loss_avoidance_paid_window > 0 and damage_paid_window == 0) else (K('mitigation_after_loss_credit_pct') if (loss_avoidance_paid_window > 0 and damage_paid_window > 0) else 0)"
      - charge_before_minimum: "RND(annual_change * layer_share * (1 + anti_selection_pct / 100) * (1 - itv_credit_pct / 100) * (1 - mitigation_pct / 100) * (1 - increase_companion_pct / 100) * earned_share, 2)"
      - result: "charge_before_minimum if charge_before_minimum >= P('min_premium_change') else 0"
    compute_basis:
      annual_change: "the annual premium change recorded on the limit increase entry"
      attach_date: "the calendar days from the date the increase attaches to the expiration date"
      request_date: "on the date the increase was requested"
      days_into_term: "when the increase attaches at least the whole-month threshold days after the term's effective date"
      months_left: "the share is the whole calendar months from the attach date to the expiration date divided by twelve"
      days_left: "the share is the calendar days from the attach date to the expiration date divided by the calendar days in the term"
      term_days: "divided by the calendar days in the term"
      earned_share: "The earned share of a limit increase is chosen as follows: when the increase attaches at least the whole-month threshold days after the term's effective date, the share is the whole calendar months from the attach date to the expiration date divided by twelve; when it attaches no more than the full-charge threshold days after the term's effective date, the full annual premium change is charged; in every other case the share is the calendar days from the attach date to the expiration date divided by the calendar days in the term."
      home_here_closed: "bound on or before that date and not cancelled or expired by it"
      home_here_live_on_request: "when a HomeGuard policy of the customer at the same property address was in force on the date the increase was requested"
      home_here_months_on_request: "had then been in force since its original effective date for at least the long companion months"
      increase_companion_pct: "The increase companion discount is the tier's companion discount percentage plus the long companion extra percentage when a HomeGuard policy of the customer at the same property address was in force on the date the increase was requested, meaning bound on or before that date and not cancelled or expired by it, and had then been in force since its original effective date for at least the long companion months; the tier's companion discount percentage when such a HomeGuard policy was in force on the request date but for fewer than the long companion months; and no discount when no HomeGuard policy at the same property address was in force on the request date."
      band_new_limit: "when the new building limit is above the upper band limit"
      layer_share: "The layer share applied to the annual premium change is the upper band share when the new building limit is above the upper band limit; the middle band share when the new limit is above the middle band limit but not above the upper band limit; and the whole annual premium change otherwise."
      last_claim_report: "when the most recent flood claim on the policy was reported"
      days_claim_to_request: "no more than the near window days before the increase was requested"
      anti_selection_pct: "An anti-selection load raises the additional premium by the near load percentage when the most recent flood claim on the policy was reported no more than the near window days before the increase was requested; by the far load percentage when it was reported more than the near window days but no more than the far window days before the request; and by nothing when no flood claim was reported within the far window days before the request."
      itv_new_limit: "when the new building limit is at least the full share of the building replacement cost on file"
      itv_credit_pct: "An insurance-to-value credit reduces the additional premium by the full credit percentage when the new building limit is at least the full share of the building replacement cost on file; by the partial credit percentage when it is at least the partial share but below the full share; and by nothing below the partial share."
      loss_avoidance_paid_window: "when a loss-avoidance reimbursement was paid on the policy within the mitigation window months"
      damage_paid_window: "and no building or contents payment was issued in that window"
      mitigation_pct: "A mitigation credit reduces the additional premium by the mitigation credit percentage when a loss-avoidance reimbursement was paid on the policy within the mitigation window months before the date the charge is posted and no building or contents payment was issued in that window; by the after-loss mitigation credit percentage when a loss-avoidance reimbursement was paid in that window and a building or contents payment was also issued in it; and by nothing when no loss-avoidance reimbursement was paid in that window."
      charge_before_minimum: "The layer share, the anti-selection load, the insurance-to-value credit, the mitigation credit, the increase companion discount and the earned share each multiply the annual premium change in turn, each acting on the figure the one before produced, and rounding is applied only to the final charge."
      result: "when that figure is below the tier's minimum premium change, nothing is charged."
    factors:
      - id: increase_earned_share_method
        effect: method
        decides: earned_share
        bindings: [days_into_term, months_left, days_left, term_days, earned_share]
        ladder:
          - when: "the increase attaches at least the whole-month threshold days after the term's effective date"
            method: "whole calendar months from the attach date to the expiration date divided by twelve"
          - when: "the increase attaches no more than the full-charge threshold days after the term's effective date"
            method: "the full annual premium change is charged"
          - when: "otherwise"
            method: "calendar days from the attach date to the expiration date divided by the calendar days in the term"
        baseline:
          earned_share: "days_left / term_days"
        evidence: [date, history]
        cross_difficulty: null
      - id: increase_companion_discount
        effect: parameter
        decides: increase_companion_pct
        bindings: [home_here_closed, home_here_live_on_request, home_here_months_on_request, increase_companion_pct]
        ladder:
          - when: "a HomeGuard at the same property address in force on the request date AND in force since its original effective date for at least the long companion months"
            value: "P('companion_discount_pct') + K('long_companion_extra_pct')"
          - when: "a HomeGuard at the same property address in force on the request date AND for fewer than the long companion months"
            value: "P('companion_discount_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          increase_companion_pct: "0"
        evidence: [cross_category, date]
        cross_difficulty: home
      - id: increase_layer_share
        effect: parameter
        decides: layer_share
        bindings: [band_new_limit, layer_share]
        ladder:
          - when: "the new building limit is above the upper band limit"
            value: "K('upper_band_share')"
          - when: "the new building limit is above the middle band limit but not above the upper band limit"
            value: "K('middle_band_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          layer_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: anti_selection_load
        effect: parameter
        decides: anti_selection_pct
        bindings: [last_claim_report, days_claim_to_request, anti_selection_pct]
        ladder:
          - when: "the most recent flood claim was reported no more than the near window days before the increase was requested"
            value: "K('adverse_near_load_pct')"
          - when: "it was reported more than the near window days but no more than the far window days before the request"
            value: "K('adverse_far_load_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          anti_selection_pct: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: insurance_to_value_credit
        effect: parameter
        decides: itv_credit_pct
        bindings: [itv_new_limit, itv_credit_pct]
        ladder:
          - when: "the new building limit is at least the full share of the building replacement cost on file"
            value: "K('itv_full_credit_pct')"
          - when: "the new building limit is at least the partial share but below the full share"
            value: "K('itv_partial_credit_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          itv_credit_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: mitigation_credit
        effect: parameter
        decides: mitigation_pct
        bindings: [loss_avoidance_paid_window, damage_paid_window, mitigation_pct]
        ladder:
          - when: "a loss-avoidance reimbursement paid within the mitigation window months AND no building or contents payment in that window"
            value: "K('mitigation_credit_pct')"
          - when: "a loss-avoidance reimbursement paid within the window AND a building or contents payment in it"
            value: "K('mitigation_after_loss_credit_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          mitigation_pct: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The additional premium charged for a limit increase is the annual premium change recorded on the limit increase entry multiplied by the earned share of the increase, rounded half-up to the cent once at the end; when that figure is below the tier's minimum premium change, nothing is charged.
        The earned share of the increase is the calendar days from the date the increase attaches to the expiration date divided by the calendar days in the term.
      params: [min_premium_change]
    inputs:
      history:
        - {table: flood_endorsements, aggregate: latest, field: annual_premium_change, filters: {change_code: building_increase}}
        - {table: flood_claims, aggregate: sum, field: amount, within_months: 24, filters: {event_type: flood_claim_payment, coverage_part: loss_avoidance}}
      cross_category: [home]

  - id: flood_ext_cancellation_credit
    base_policy_refs: [flood_cancellation]
    overwrite:
      - base_policy: flood_cancellation
        superseded_clause: >-
          The credit follows the reason's basis: pro_rata is term_premium multiplied by the calendar days from the cancellation date to the expiration date and divided by the calendar days in the term, rounded half-up to the cent; flat returns the whole term premium; and the policy fee is never returned.
        replaced_by: >-
          The unearned share of the term is counted as follows: for a cancellation because the property was sold, when the customer's HomeGuard policy at the same property address ended within the corroboration days of the cancellation date, the cancellation date itself counts as unearned, so the share is the calendar days from the cancellation date to the expiration date plus one, divided by the calendar days in the term; for a cancellation because the property was sold with no such HomeGuard corroboration, the unearned days run from the date the cancellation request was received, as recorded on the request whether or not it had been signed by then, to the expiration date; and for every other cancellation the unearned days are the calendar days from the cancellation date to the expiration date.
      - base_policy: flood_cancellation
        superseded_clause: >-
          When a claim has been paid in the term and claim_paid_fully_earned is true, the premium is fully earned and no credit is posted.
        replaced_by: >-
          Claim payments issued on the policy within the claim window months before the cancellation is processed reduce the credit: a building or contents payment makes the premium fully earned, so no credit and no fee return are due; loss-avoidance reimbursements alone are deducted from the credit in the amount paid; and with no such payment nothing is deducted.
    trigger: on_request
    subject: [flood_policy_cancelled, flood_return_premium]
    computes: credit_amount
    target_tool: sign_flood_cancellation_83daa4cf
    params:
      corroboration_days: 7
      claim_window_months: 12
      short_increase_days: 60
      fee_tenure_months: 60
      fee_share_long: 0.5
      fee_share_short: 0.25
      backdating_threshold_days: 14
      backdating_far_pct: 5
      backdating_near_pct: 2
    rule: >-
      The cancellation date is the date of the reason stated on the named insured's cancellation request.
      The cancellation credit is the term premium multiplied by the unearned share of the term, rounded half-up to the cent once at the end, and the policy fee is not returned.
      The unearned share of the term is the calendar days from the cancellation date to the expiration date divided by the calendar days in the term.
      A cancellation because the loan never closed returns the whole term premium in place of the unearned share.
      The cancellation credit is worked out only after the premium account carries an additional-premium charge for every limit increase recorded on the policy with additional premium due.
      The unearned share of the term is counted as follows: for a cancellation because the property was sold, when the customer's HomeGuard policy at the same property address ended within the corroboration days of the cancellation date, the cancellation date itself counts as unearned, so the share is the calendar days from the cancellation date to the expiration date plus one, divided by the calendar days in the term; for a cancellation because the property was sold with no such HomeGuard corroboration, the unearned days run from the date the cancellation request was received, as recorded on the request whether or not it had been signed by then, to the expiration date; and for every other cancellation the unearned days are the calendar days from the cancellation date to the expiration date.
      Additional premium charged for limit increases within the claim window months before the cancellation is processed is returned in full when the increase attached fewer than the short increase days before the cancellation date; in the share of the calendar days from the cancellation date to the expiration date over the calendar days from the attach date to the expiration date when it attached at least the short increase days before the cancellation date; and not at all when no additional premium was charged in that window.
      Claim payments issued on the policy within the claim window months before the cancellation is processed reduce the credit: a building or contents payment makes the premium fully earned, so no credit and no fee return are due; loss-avoidance reimbursements alone are deducted from the credit in the amount paid; and with no such payment nothing is deducted.
      Part of the policy fee is returned on a cancellation because the property was sold: the long-tenure fee share when the policy had been continuously insured since its original effective date for at least the fee tenure months by the cancellation date; the short-tenure fee share when for fewer than those months; and nothing on any other cancellation.
      A backdating retention keeps a share of the premium credit when the cancellation date precedes the date the cancellation request was received, as recorded on the request: the far backdating percentage when it precedes it by more than the backdating threshold days; the near backdating percentage when by at least one day but no more than the threshold; and nothing when the cancellation date is not earlier than the date the request was received.
      The premium credit is the term premium credit plus the additional premium returned; the backdating retention is taken from that premium credit, the claim deduction is subtracted from what remains and the returned share of the policy fee is added, and the result, never below zero, is rounded half-up to the cent once at the end.
    prerequisite:
      - problem: flood_ext_increase_premium
        kind: value_input
        gate: addl_billed
        form: state
        policy_source: >-
          The cancellation credit is worked out only after the premium account carries an additional-premium charge for every limit increase recorded on the policy with additional premium due.
        condition: >-
          For every flood_endorsements entry of the policy with premium_direction additional there is a flood_billing flood_additional_premium entry whose source_endorsement_id is that entry.
        resolved_by: bill_flood_increase_premium_f099355d
        effect: >-
          The binding addl_billed changes from zero to the additional premium charged for the limit increase, which the increase-return rule then returns in full or in share.
    cross_category:
      - category: home
        as: branch
        reads: [property_address, closed_date]
        note: The unearned-day count is decided by whether the customer's HomeGuard policy at the same property address ended within the corroboration days of the cancellation date.
    compute:
      - cancel_date: "LATEST('flood_requests', 'requested_effective_date', date_field='created_at', request_type='insured_cancellation')"
      - cancel_reason: "LATEST('flood_requests', 'cancellation_reason', date_field='created_at', request_type='insured_cancellation')"
      - request_received: "LATEST('flood_requests', 'created_at', date_field='created_at', request_type='insured_cancellation')"
      - term_days_in_force: "DAYS(F('effective_date'), F('expiration_date'))"
      - sale_home_closed: "CFIELD('home', 'closed_date', property_address=F('property_address'))"
      - sale_corroborated: "sale_home_closed and ABS(DAYS(sale_home_closed, cancel_date)) <= K('corroboration_days')"
      - unearned_share: "(DAYS(cancel_date, F('expiration_date')) + 1) / term_days_in_force if (cancel_reason == 'property_sold' and sale_corroborated) else (DAYS(request_received, F('expiration_date')) / term_days_in_force if (cancel_reason == 'property_sold' and not sale_corroborated) else DAYS(cancel_date, F('expiration_date')) / term_days_in_force)"
      - term_credit: "F('term_premium') if cancel_reason == 'loan_not_closed' else F('term_premium') * unearned_share"
      - addl_billed: "SUM('flood_billing', 'amount', within_months=K('claim_window_months'), date_field='posted_date', event_type='flood_additional_premium')"
      - addl_attach: "LATEST('flood_billing', 'effective_date', date_field='posted_date', event_type='flood_additional_premium')"
      - addl_returned: "addl_billed if (addl_billed > 0 and DAYS(addl_attach, cancel_date) < K('short_increase_days')) else (addl_billed * DAYS(cancel_date, F('expiration_date')) / DAYS(addl_attach, F('expiration_date')) if (addl_billed > 0 and DAYS(addl_attach, cancel_date) >= K('short_increase_days')) else 0)"
      - premium_credit: "term_credit + addl_returned"
      - backdating_days: "DAYS(cancel_date, request_received)"
      - backdating_pct: "K('backdating_far_pct') if backdating_days > K('backdating_threshold_days') else (K('backdating_near_pct') if backdating_days >= 1 else 0)"
      - months_insured_at_cancel: "MONTHS(F('original_effective_date'), cancel_date)"
      - fee_return_share: "K('fee_share_long') if (cancel_reason == 'property_sold' and months_insured_at_cancel >= K('fee_tenure_months')) else (K('fee_share_short') if (cancel_reason == 'property_sold' and months_insured_at_cancel < K('fee_tenure_months')) else 0)"
      - fee_returned: "P('policy_fee') * fee_return_share"
      - loss_avoidance_in_window: "SUM('flood_claims', 'amount', within_months=K('claim_window_months'), date_field='entry_date', event_type='flood_claim_payment', coverage_part='loss_avoidance')"
      - damage_in_window: "SUM('flood_claims', 'amount', within_months=K('claim_window_months'), date_field='entry_date', event_type='flood_claim_payment', coverage_part='building') + SUM('flood_claims', 'amount', within_months=K('claim_window_months'), date_field='entry_date', event_type='flood_claim_payment', coverage_part='contents')"
      - claim_deduction: "premium_credit * (1 - backdating_pct / 100) + fee_returned if damage_in_window > 0 else (loss_avoidance_in_window if loss_avoidance_in_window > 0 else 0)"
      - result: "MX(0, RND(premium_credit * (1 - backdating_pct / 100) - claim_deduction + fee_returned, 2))"
    compute_basis:
      cancel_date: "The cancellation date is the date of the reason stated on the named insured's cancellation request."
      cancel_reason: "for a cancellation because the property was sold"
      request_received: "the unearned days run from the date the cancellation request was received, as recorded on the request whether or not it had been signed by then, to the expiration date"
      term_days_in_force: "divided by the calendar days in the term"
      sale_home_closed: "when the customer's HomeGuard policy at the same property address ended within the corroboration days of the cancellation date"
      sale_corroborated: "when the customer's HomeGuard policy at the same property address ended within the corroboration days of the cancellation date"
      unearned_share: "The unearned share of the term is counted as follows: for a cancellation because the property was sold, when the customer's HomeGuard policy at the same property address ended within the corroboration days of the cancellation date, the cancellation date itself counts as unearned, so the share is the calendar days from the cancellation date to the expiration date plus one, divided by the calendar days in the term; for a cancellation because the property was sold with no such HomeGuard corroboration, the unearned days run from the date the cancellation request was received, as recorded on the request whether or not it had been signed by then, to the expiration date; and for every other cancellation the unearned days are the calendar days from the cancellation date to the expiration date."
      term_credit: "A cancellation because the loan never closed returns the whole term premium in place of the unearned share."
      addl_billed: "Additional premium charged for limit increases within the claim window months before the cancellation is processed"
      addl_attach: "when the increase attached fewer than the short increase days before the cancellation date"
      addl_returned: "Additional premium charged for limit increases within the claim window months before the cancellation is processed is returned in full when the increase attached fewer than the short increase days before the cancellation date; in the share of the calendar days from the cancellation date to the expiration date over the calendar days from the attach date to the expiration date when it attached at least the short increase days before the cancellation date; and not at all when no additional premium was charged in that window."
      premium_credit: "The premium credit is the term premium credit plus the additional premium returned"
      backdating_days: "when the cancellation date precedes the date the cancellation request was received, as recorded on the request"
      backdating_pct: "A backdating retention keeps a share of the premium credit when the cancellation date precedes the date the cancellation request was received, as recorded on the request: the far backdating percentage when it precedes it by more than the backdating threshold days; the near backdating percentage when by at least one day but no more than the threshold; and nothing when the cancellation date is not earlier than the date the request was received."
      months_insured_at_cancel: "continuously insured since its original effective date for at least the fee tenure months by the cancellation date"
      fee_return_share: "Part of the policy fee is returned on a cancellation because the property was sold: the long-tenure fee share when the policy had been continuously insured since its original effective date for at least the fee tenure months by the cancellation date; the short-tenure fee share when for fewer than those months; and nothing on any other cancellation."
      fee_returned: "the returned share of the policy fee is added"
      loss_avoidance_in_window: "loss-avoidance reimbursements alone are deducted from the credit in the amount paid"
      damage_in_window: "a building or contents payment makes the premium fully earned, so no credit and no fee return are due"
      claim_deduction: "Claim payments issued on the policy within the claim window months before the cancellation is processed reduce the credit: a building or contents payment makes the premium fully earned, so no credit and no fee return are due; loss-avoidance reimbursements alone are deducted from the credit in the amount paid; and with no such payment nothing is deducted."
      result: "the backdating retention is taken from that premium credit, the claim deduction is subtracted from what remains and the returned share of the policy fee is added, and the result, never below zero, is rounded half-up to the cent once at the end."
    factors:
      - id: unearned_day_count
        effect: method
        decides: unearned_share
        bindings: [sale_home_closed, sale_corroborated, unearned_share]
        ladder:
          - when: "cancelled because the property was sold AND the HomeGuard at the same property address ended within the corroboration days of the cancellation date"
            method: "the cancellation date itself counts as unearned: (days from cancellation date to expiration + 1) / days in the term"
          - when: "cancelled because the property was sold AND no such HomeGuard corroboration"
            method: "unearned days run from the date the cancellation request was received, as recorded on the request, to the expiration date"
          - when: "otherwise"
            method: "calendar days from the cancellation date to the expiration date / days in the term"
        baseline:
          unearned_share: "DAYS(cancel_date, F('expiration_date')) / term_days_in_force"
        evidence: [cross_category, date]
        cross_difficulty: home
      - id: increase_premium_return
        effect: method
        decides: addl_returned
        bindings: [addl_billed, addl_attach, addl_returned]
        ladder:
          - when: "additional premium charged in the claim window AND the increase attached fewer than the short increase days before the cancellation date"
            method: "the additional premium is returned in full"
          - when: "additional premium charged in the claim window AND the increase attached at least the short increase days before the cancellation date"
            method: "returned in the share of days from cancellation to expiration over days from attach to expiration"
          - when: "otherwise"
            method: "no additional premium is returned"
        baseline:
          addl_returned: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: window_claim_deduction
        effect: parameter
        decides: claim_deduction
        bindings: [loss_avoidance_in_window, damage_in_window, claim_deduction]
        ladder:
          - when: "a building or contents payment issued within the claim window months"
            value: "the whole premium credit after retention plus the fee return (premium fully earned)"
          - when: "only loss-avoidance reimbursements paid within the claim window months"
            value: "the loss-avoidance amount paid"
          - when: "otherwise"
            value: "0"
        baseline:
          claim_deduction: "0"
        evidence: [history]
        cross_difficulty: null
      - id: sale_fee_return
        effect: parameter
        decides: fee_return_share
        bindings: [months_insured_at_cancel, fee_return_share]
        ladder:
          - when: "cancelled because the property was sold AND continuously insured for at least the fee tenure months"
            value: "K('fee_share_long')"
          - when: "cancelled because the property was sold AND continuously insured for fewer than the fee tenure months"
            value: "K('fee_share_short')"
          - when: "otherwise"
            value: "0"
        baseline:
          fee_return_share: "0"
        evidence: [date]
        cross_difficulty: null
      - id: backdating_retention
        effect: parameter
        decides: backdating_pct
        bindings: [backdating_days, backdating_pct]
        ladder:
          - when: "the cancellation date precedes the date the cancellation request was received, as recorded on the request, by more than the backdating threshold days"
            value: "K('backdating_far_pct')"
          - when: "it precedes it by at least one day but no more than the threshold"
            value: "K('backdating_near_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          backdating_pct: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The cancellation date is the date of the reason stated on the named insured's cancellation request.
        The cancellation credit is the term premium multiplied by the unearned share of the term, rounded half-up to the cent once at the end, and the policy fee is not returned.
        The unearned share of the term is the calendar days from the cancellation date to the expiration date divided by the calendar days in the term.
      params: [policy_fee]
    inputs:
      history:
        - {table: flood_requests, aggregate: latest, field: requested_effective_date, filters: {request_type: insured_cancellation}}
        - {table: flood_billing, aggregate: sum, field: amount, within_months: 12, filters: {event_type: flood_additional_premium}}
        - {table: flood_claims, aggregate: sum, field: amount, within_months: 12, filters: {event_type: flood_claim_payment}}
      cross_category: [home]

  - id: flood_ext_cancellation_refund
    base_policy_refs: [flood_billing_and_mortgagee, flood_cancellation]
    overwrite:
      - base_policy: flood_billing_and_mortgagee
        superseded_clause: >-
          A refund is issued only when the premium balance is a credit of at least refund_minimum, to the payer of the most recent payment, so a credit created by the mortgagee's escrow payment is refunded to the mortgagee.
        replaced_by: >-
          Interest is the refundable amount, the credit balance less what was held back for other balances, multiplied by the interest percentage and by the interest days over 365, rounded half-up to the cent; the payment-method charge is worked out on the same refundable amount and rounded half-up to the cent; and the refund is the refundable amount plus the interest less the payment-method charge, rounded half-up to the cent.
    trigger: on_request
    subject: [flood_refund_issued]
    computes: amount
    target_tool: issue_flood_refund_b526defb
    params:
      other_offset_share: 0.5
      interest_far_days: 30
      interest_near_days: 7
      interest_far_pct: 6
      interest_near_pct: 3
      corroboration_days: 7
      card_charge_pct: 2.5
      check_charge_pct: 1
    rule: >-
      The refund is the credit balance of the premium account, every payment and credit posted less every charge posted, rounded half-up to the cent, paid to the payer of the most recent payment by the method of that payment; a refund below the tier's refund minimum is not paid.
      No refund is paid out until the premium account carries the cancellation credit for the policy's signed cancellation.
      The credit balance is held back against other Larkspur balances of the customer as follows, the held-back amount staying on this premium account for that balance: when the customer's HomeGuard policy at the same property address shows an amount owed, that amount is held back from the refund in full, up to the credit balance; when that HomeGuard policy shows nothing owed and a Larkspur Umbrella policy in force shows an amount owed, that amount is held back up to the other-policy offset share of the credit balance; and otherwise nothing is held back.
      Refund interest accrues at the far interest percentage a year when more than the far delay days have passed from the cancellation date to the refund date; at the near interest percentage a year when more than the near delay days but no more than the far delay days have passed; and not at all otherwise.
      Refund interest days are counted as follows: when the cancellation date precedes the date the cancellation request was received, as recorded on the request whether or not it had been signed by then, and the customer's HomeGuard policy at the same property address ended within the corroboration days of the cancellation date, from the date the request was received to the refund date; when the cancellation date precedes the date the request was received without that corroboration, no interest days are counted; and otherwise from the cancellation date to the refund date.
      A payment-method charge is kept from the refund: the card charge percentage of the refundable amount when the most recent payment was made by card; the check charge percentage when it was made by check; and nothing for any other method.
      Interest is the refundable amount, the credit balance less what was held back for other balances, multiplied by the interest percentage and by the interest days over 365, rounded half-up to the cent; the payment-method charge is worked out on the same refundable amount and rounded half-up to the cent; and the refund is the refundable amount plus the interest less the payment-method charge, rounded half-up to the cent.
    prerequisite:
      - problem: flood_ext_cancellation_credit
        kind: value_input
        gate: credits_posted
        form: state
        policy_source: >-
          No refund is paid out until the premium account carries the cancellation credit for the policy's signed cancellation.
        condition: >-
          flood_billing carries a flood_return_premium entry with change_reason cancellation for the policy.
        resolved_by: sign_flood_cancellation_83daa4cf
        effect: >-
          The binding credits_posted rises by the cancellation credit, turning the account's balance into the credit the refund pays out.
    cross_category:
      - category: home
        as: branch
        reads: [property_address, premium_balance, closed_date]
        note: The HomeGuard at the same property address decides both whether part of the credit is applied to its balance and how refund interest days are counted.
      - category: umbrella
        as: branch
        reads: [status, premium_balance]
        note: An umbrella in force with an amount owed is the second candidate for the credit offset.
    compute:
      - charges_all: "SUM('flood_billing', 'amount', event_type='flood_premium_billed') + SUM('flood_billing', 'amount', event_type='flood_fee_assessed') + SUM('flood_billing', 'amount', event_type='flood_payment_returned') + SUM('flood_billing', 'amount', event_type='flood_additional_premium') + SUM('flood_billing', 'amount', event_type='flood_refund_issued')"
      - credits_posted: "SUM('flood_billing', 'amount', event_type='flood_payment_received') + SUM('flood_billing', 'amount', event_type='flood_return_premium')"
      - credit_balance: "RND(credits_posted - charges_all, 2)"
      - home_owed_here: "CFIELD('home', 'premium_balance', property_address=F('property_address')) or 0"
      - umbrella_owed: "CFIELD('umbrella', 'premium_balance', status='in_force') or 0"
      - offset_applied: "MN(home_owed_here, credit_balance) if (home_owed_here > 0 and credit_balance > 0) else (MN(umbrella_owed, credit_balance * K('other_offset_share')) if (home_owed_here <= 0 and umbrella_owed > 0 and credit_balance > 0) else 0)"
      - refundable: "credit_balance - offset_applied"
      - delay_days: "DAYS(F('closed_date'), NOW)"
      - interest_pct: "K('interest_far_pct') if delay_days > K('interest_far_days') else (K('interest_near_pct') if delay_days > K('interest_near_days') else 0)"
      - request_received_on: "LATEST('flood_requests', 'created_at', date_field='created_at', request_type='insured_cancellation')"
      - interest_home_closed: "CFIELD('home', 'closed_date', property_address=F('property_address'))"
      - interest_corroborated: "interest_home_closed and ABS(DAYS(interest_home_closed, F('closed_date'))) <= K('corroboration_days')"
      - interest_days: "DAYS(request_received_on, NOW) if (DAYS(F('closed_date'), request_received_on) > 0 and interest_corroborated) else (0 if (DAYS(F('closed_date'), request_received_on) > 0 and not interest_corroborated) else DAYS(F('closed_date'), NOW))"
      - last_payment_method: "LATEST('flood_billing', 'payment_method', date_field='posted_date', event_type='flood_payment_received')"
      - method_charge_pct: "K('card_charge_pct') if last_payment_method == 'card' else (K('check_charge_pct') if last_payment_method == 'check' else 0)"
      - refund_interest: "RND(refundable * interest_pct / 100 * interest_days / 365, 2)"
      - method_charge: "RND(refundable * method_charge_pct / 100, 2)"
      - refund_figure: "RND(refundable + refund_interest - method_charge, 2)"
      - result: "refund_figure if refund_figure >= P('refund_minimum') else 0"
    compute_basis:
      charges_all: "The refund is the credit balance of the premium account, every payment and credit posted less every charge posted"
      credits_posted: "every payment and credit posted less every charge posted"
      credit_balance: "The refund is the credit balance of the premium account, every payment and credit posted less every charge posted, rounded half-up to the cent"
      home_owed_here: "when the customer's HomeGuard policy at the same property address shows an amount owed"
      umbrella_owed: "a Larkspur Umbrella policy in force shows an amount owed"
      offset_applied: "The credit balance is held back against other Larkspur balances of the customer as follows, the held-back amount staying on this premium account for that balance: when the customer's HomeGuard policy at the same property address shows an amount owed, that amount is held back from the refund in full, up to the credit balance; when that HomeGuard policy shows nothing owed and a Larkspur Umbrella policy in force shows an amount owed, that amount is held back up to the other-policy offset share of the credit balance; and otherwise nothing is held back."
      refundable: "the refundable amount, the credit balance less what was held back for other balances"
      delay_days: "from the cancellation date to the refund date"
      interest_pct: "Refund interest accrues at the far interest percentage a year when more than the far delay days have passed from the cancellation date to the refund date; at the near interest percentage a year when more than the near delay days but no more than the far delay days have passed; and not at all otherwise."
      request_received_on: "from the date the request was received to the refund date"
      interest_home_closed: "the customer's HomeGuard policy at the same property address ended within the corroboration days of the cancellation date"
      interest_corroborated: "the customer's HomeGuard policy at the same property address ended within the corroboration days of the cancellation date"
      interest_days: "Refund interest days are counted as follows: when the cancellation date precedes the date the cancellation request was received, as recorded on the request whether or not it had been signed by then, and the customer's HomeGuard policy at the same property address ended within the corroboration days of the cancellation date, from the date the request was received to the refund date; when the cancellation date precedes the date the request was received without that corroboration, no interest days are counted; and otherwise from the cancellation date to the refund date."
      last_payment_method: "when the most recent payment was made by card"
      method_charge_pct: "A payment-method charge is kept from the refund: the card charge percentage of the refundable amount when the most recent payment was made by card; the check charge percentage when it was made by check; and nothing for any other method."
      refund_interest: "Interest is the refundable amount, the credit balance less what was held back for other balances, multiplied by the interest percentage and by the interest days over 365, rounded half-up to the cent"
      method_charge: "the payment-method charge is worked out on the same refundable amount and rounded half-up to the cent"
      refund_figure: "the refund is the refundable amount plus the interest less the payment-method charge, rounded half-up to the cent."
      result: "a refund below the tier's refund minimum is not paid."
    factors:
      - id: credit_offset_order
        effect: method
        decides: offset_applied
        bindings: [home_owed_here, umbrella_owed, offset_applied]
        ladder:
          - when: "the HomeGuard at the same property address shows an amount owed AND the account shows a credit"
            method: "that amount is held back from the refund in full, up to the credit balance"
          - when: "the HomeGuard shows nothing owed AND a Larkspur Umbrella in force shows an amount owed AND the account shows a credit"
            method: "the umbrella balance is held back up to the other-policy offset share of the credit"
          - when: "otherwise"
            method: "nothing is held back"
        baseline:
          offset_applied: "0"
        evidence: [cross_category]
        cross_difficulty: home
      - id: refund_interest_rate
        effect: parameter
        decides: interest_pct
        bindings: [delay_days, interest_pct]
        ladder:
          - when: "more than the far delay days from the cancellation date to the refund date"
            value: "K('interest_far_pct')"
          - when: "more than the near delay days but no more than the far delay days"
            value: "K('interest_near_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          interest_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: refund_interest_anchor
        effect: method
        decides: interest_days
        bindings: [request_received_on, interest_home_closed, interest_corroborated, interest_days]
        ladder:
          - when: "the cancellation date precedes the date the cancellation request was received, as recorded on the request, AND the HomeGuard at the same address ended within the corroboration days of it"
            method: "interest days run from the date the cancellation request was received, as recorded on the request, to the refund date"
          - when: "the cancellation date precedes the date the cancellation request was received, as recorded on the request, AND no such corroboration"
            method: "no interest days are counted"
          - when: "otherwise"
            method: "interest days run from the cancellation date to the refund date"
        baseline:
          interest_days: "DAYS(F('closed_date'), NOW)"
        evidence: [date, cross_category]
        cross_difficulty: home
      - id: refund_method_charge
        effect: parameter
        decides: method_charge_pct
        bindings: [last_payment_method, method_charge_pct]
        ladder:
          - when: "the most recent payment was made by card"
            value: "K('card_charge_pct')"
          - when: "the most recent payment was made by check"
            value: "K('check_charge_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          method_charge_pct: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The refund is the credit balance of the premium account, every payment and credit posted less every charge posted, rounded half-up to the cent, paid to the payer of the most recent payment by the method of that payment; a refund below the tier's refund minimum is not paid.
      params: [refund_minimum]
    inputs:
      history:
        - {table: flood_billing, aggregate: sum, field: amount, filters: {event_type: flood_return_premium}}
        - {table: flood_billing, aggregate: latest, field: payment_method, filters: {event_type: flood_payment_received}}
      cross_category: [home, umbrella]
