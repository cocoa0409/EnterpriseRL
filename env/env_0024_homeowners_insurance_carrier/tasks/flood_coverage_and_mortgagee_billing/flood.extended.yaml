            value: "P('companion_discount_pct') + K('long_companion_extra_pct')"
          - when: "(a HomeGuard policy in force at the same property address AND in force for fewer than the long companion months) OR a LandlordGuard policy in force at the same property address"
            value: "P('companion_discount_pct')"
