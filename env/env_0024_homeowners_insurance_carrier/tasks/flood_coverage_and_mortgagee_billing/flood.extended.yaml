        ladder:
          - when: "the building is in zone A or AE and its map revision date on file is fewer than the newly mapped months before the renewal offer date"
            value: "K('newly_mapped_rate')"
          - when: "the building is in zone VE"
            value: "K('zone_rate_ve') raised by P('zones_rated_extra_pct')"
