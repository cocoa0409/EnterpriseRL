    factors:
      - id: rated_building_amount_rule
        effect: method
        decides: rated_building_amount
        bindings: [increase_attach_date, increase_new_limit, rated_building_amount]
        ladder:
          - when: "the building limit on file exceeds the building replacement cost on file"
            method: "the building premium is rated on the replacement cost instead of the limit"
          - when: "the limit does not exceed the replacement cost and a building limit increase recorded on the policy attaches after the renewal offer date and no later than the expiration date"
            method: "the building premium is rated on the increased limit that increase records"
          - when: "otherwise"
