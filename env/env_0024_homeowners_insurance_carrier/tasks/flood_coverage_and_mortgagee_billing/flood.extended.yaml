      building_premium: "The building premium is the rated building amount divided by 1,000, multiplied by the building rate and by the tier's building rate factor."
      adjusted_building_premium: "The flood loss load, the construction-era adjustment and the elevation credit each multiply the building premium in turn, each acting on the building premium as already adjusted by the one before"
      contents_premium: "The contents premium is the contents limit on file divided by 1,000 and multiplied by the tier's contents rate per 1,000."
