    trigger: state_due
    subject: [home_claim_payment]
    computes: amount
    target_tool: settle_denied_mold_remediation_0cacd0ff
    params:
      containment_rc_floor: 3000
      containment_wet_area_pct: 10
      barrier_fee: 400
      water_window_months: 36
      clearance_rc_high: 5000
      clearance_rc_low: 1500
      clearance_fee_high: 650
      clearance_fee_low: 350
      antimicrobial_days_clean: 2
      antimicrobial_days_grey: 7
      antimicrobial_pct_black: 8
      antimicrobial_pct_grey: 4
      duct_wet_rc_high: 10000
      duct_wet_rc_low: 4000
      duct_fee_large: 450
      duct_fee_small: 200
      mold_window_months: 12
    rule: >-
      This policy re-settles the fungi, wet rot and bacteria remediation of the most recently reported claim on a HomeGuard policy when the claim's first notice records a freeze or a sudden and accidental discharge of water while the mold remediation stands on the claim only as a repeated-seepage denial entry, and fixes the mold payment that replaces that denial.
      The claim is identified by the most recent first-notice entry on the policy, and the cause of loss, date of loss and report date it records are the ones this remediation settles against.
      The mold remediation replacement-cost value is the one recorded on its repeated-seepage denial entry.
      The wet area of the claim is measured by its dwelling water damage: the replacement-cost value on its dwelling repeated-seepage denial entry together with that on any dwelling payment entry of the claim that replaces no denial.
      The mold remediation absorbs none of the occurrence deductible, which the dwelling, other-structures and personal-property parts of the occurrence absorb in their own order.
      Remediation is a service that carries no depreciation, so nothing is ever withheld on a mold payment.
      The remediation figure is the recorded mold replacement-cost value as estimated.
      Instead, where the policy carries a payment entry for a water loss (sudden discharge, freeze, water backup or seepage) on another claim with a date of loss in the 36 months before the call and the mold replacement-cost value is at least 3,000.00, the containment is extended over the whole wet area, because moisture from the earlier loss makes hidden growth beyond the visible mold likely, and the remediation figure is the recorded mold value plus 10 percent of the claim's dwelling water damage; where there is no such earlier paid water loss and the mold value is at least 3,000.00, a single-area containment barrier is priced and the remediation figure is the recorded mold value plus 400.00.
      A clearance testing fee is added: 650.00 when the mold replacement-cost value is at least 5,000.00, 350.00 when it is at least 1,500.00 but below 5,000.00, and nothing below 1,500.00.
      An antimicrobial treatment fee is added at a percentage of the mold replacement-cost value by how long the water stood before the first notice, since standing water degrades from clean to grey to black: 8 percent when the loss was reported more than 7 days after the date of loss, 4 percent when it was reported 3 to 7 days after it, and nothing when it was reported within 2 days, when the water is still clean.
      A duct and air-handler cleaning fee is added by the extent of the wet area: 450.00 when the claim's dwelling water damage is at least 10,000.00, 200.00 when it is at least 4,000.00 but below 10,000.00, and nothing below 4,000.00, where the wet area does not reach the air returns.
      The mold payment starts from the remediation figure less any mold money already issued on the claim, and the fees are added to it; it is never below 0.00 and is rounded to the cent once, on the final figure.
      The whole mold figure, fees included, never exceeds the tier's mold limit less the mold money already issued on the policy for losses with a date of loss in the 12 months before the call.
      The payment is replacement_cost_full when the mold replacement-cost value is at or below the tier's no-holdback threshold and acv_initial otherwise, and it is payable to the insured alone, because the mortgagee co-payee rule reaches only dwelling and other-structures payments.
