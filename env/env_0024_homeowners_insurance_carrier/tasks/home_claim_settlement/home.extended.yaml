  - id: home_ext_contents_supplemental
    base_policy_refs: [home_claim_settlement, home_roof_settlement, home_water_limitations, home_depreciation_recovery]
    overwrite:
      - base_policy: home_claim_settlement
        superseded_clause: >-
          For dwelling and other_structures, and for personal_property on a replacement_cost tier, when RC is at or below rc_no_holdback_threshold the payment is replacement_cost_full, equal to RC minus the deductible absorbed; otherwise the first payment is acv_initial, equal to RC minus depreciation minus the deductible absorbed, and the depreciation is withheld in one home_holdback_withheld entry.
        replaced_by: >-
          The contents settled basis is their actual-cash-value figure, the replacement-cost value less the depreciation less the deductible the contents absorb.
      - base_policy: home_claim_settlement
        superseded_clause: >-
          One deductible applies per occurrence: for peril wind_hail it is the larger of wind_hail_deductible_pct of Coverage A and wind_hail_deductible_minimum, and for every other peril it is the aop_deductible; it is absorbed first by dwelling, then other_structures, then personal_property, until used up.
        replaced_by: >-
          When no waiver applies, the contents absorb what the occurrence deductible leaves after that same-event share and after the deductible carried on the claim's dwelling and other-structures payment entries, and never more than their replacement-cost value.
    trigger: on_request
    subject: [home_claim_payment]
    computes: amount
    target_tool: accept_contents_supplemental_dc7651d7
    params:
      cleaning_rc_floor: 5000
      cleaning_pct_large: 8
      cleaning_pct_small: 4
      packout_rc_floor: 10000
      packout_pct_storage: 5
      packout_pct_inhome: 2
      wet_pct_sewage: 6
      wet_pct_clean: 3
    rule: >-
      This policy re-settles the personal property (contents) part of the most recently reported claim on a HomeGuard policy once the claim's first contents settlement entry stands, and fixes the contents supplemental the named insured accepts on it.
      The contents claim is taken from the newest first-notice entry on the policy, and the date of loss and cause of loss written on that entry apply to the contents.
      The contents replacement-cost value and depreciation are those recorded on the claim's actual-cash-value initial payment entry for personal property, and the contents money already issued is every personal-property payment entry of the claim, recoverable-depreciation payments included.
      The personal property supplemental is not fixed until the dwelling water damage of the same claim carries a payment entry wherever the claim's first notice records a freeze or a sudden discharge of water.
      The personal property supplemental is not fixed until the mold remediation of the same claim carries a payment entry wherever that first notice records a freeze or a sudden discharge of water.
      The occurrence deductible is one per occurrence: the all-other-perils deductible on the declarations or, for a wind or hail loss, the larger of the declarations' wind/hail percentage of Coverage A and the tier's wind/hail minimum.
      No deductible applies to the contents where the tier's deductible waiver threshold is above 0 and the replacement-cost values on the claim's denial entries and on its payment entries that replace no denial together reach it.
      For a freeze or sudden discharge loss, the deductible the customer already bore on a LandlordGuard freeze or sudden-discharge claim with the same date of loss counts toward the occurrence deductible as its same-event share, never more than the whole occurrence deductible.
      When no waiver applies, the contents absorb what the occurrence deductible leaves after that same-event share and after the deductible carried on the claim's dwelling and other-structures payment entries, and never more than their replacement-cost value.
      The contents settled basis is their actual-cash-value figure, the replacement-cost value less the depreciation less the deductible the contents absorb.
      When the contents replacement-cost value is at or below the tier's no-holdback threshold, the settled basis is instead the full replacement-cost value less the deductible absorbed; when it is above that threshold and a release of withheld contents depreciation stands on the claim, the settled basis is instead the smaller of the replacement-cost value and the largest documented replacement cost on those releases, less the deductible absorbed.
      A contents cleaning allowance for antimicrobial cleaning of salvageable contents is added at a percentage of the contents replacement-cost value: 8 percent when a mold payment entry stands on the claim and that value is at least 5,000.00, 4 percent when a mold payment entry stands and the value is below 5,000.00, and nothing when no mold payment entry stands.
      A pack-out allowance is added at a percentage of the contents replacement-cost value: 5 percent for packing out and storing the contents when the claim's dwelling payment entries carry a replacement-cost value of at least 10,000.00, 2 percent for moving the contents within the home when a dwelling payment entry stands with a replacement-cost value below 10,000.00, and nothing when the claim has no dwelling payment entry.
      A saturated-contents handling allowance for extracting, drying or hauling water-soaked household goods is added at a percentage of the contents replacement-cost value: 6 percent for a water backup loss, whose goods are sewage-contaminated, 3 percent for a freeze or sudden discharge loss, and nothing for a loss that is not a water loss, where ordinary debris removal is already within the replacement-cost value.
      The contents supplemental starts from the settled basis less the contents money already issued; it is never below 0.00 and is rounded to the cent once, on the final figure.
      The cleaning, pack-out and saturated-contents allowances, each taken on the contents replacement-cost value, are added to that figure before the floor and the rounding.
      The supplemental is paid as payment_type supplemental on the personal-property general class and is payable to the insured alone, the mortgagee co-payee rule reaching only dwelling and other-structures payments.
    prerequisite:
      - problem: home_ext_water_denial_reversal
        kind: value_input
        gate: dw_abs
        form: state
        policy_source: >-
          The personal property supplemental is not fixed until the dwelling water damage of the same claim carries a payment entry wherever the claim's first notice records a freeze or a sudden discharge of water.
        condition: >-
          Where the claim's first notice records peril freeze or water_sudden_accidental, the claim carries a dwelling general home_claim_payment entry (with its deductible and replacement-cost value) rather than only a repeated-seepage denial of the dwelling damage.
        resolved_by: settle_denied_water_damage_028e176f
        effect: >-
          The deductible carried on the claim's dwelling payment entries rises above 0.00, so the deductible left for the contents falls; and the dwelling payment replacement-cost value read by the pack-out ladder rises from 0.00 to the dwelling water damage value.
      - problem: home_ext_mold_denial_reversal
        kind: value_input
        gate: mold_entries
        form: state
        policy_source: >-
          The personal property supplemental is not fixed until the mold remediation of the same claim carries a payment entry wherever that first notice records a freeze or a sudden discharge of water.
        condition: >-
          Where the claim's first notice records peril freeze or water_sudden_accidental, the claim carries a mold home_claim_payment entry rather than only a repeated-seepage denial of the mold remediation.
        resolved_by: settle_denied_mold_remediation_0cacd0ff
        effect: >-
          The count of mold payment entries on the claim rises from 0 to 1, moving the contents cleaning ladder off its no-mold tier.
    cross_category:
      - category: dwelling
        as: history
        reads: [dwelling_claims.event_type, dwelling_claims.loss_date, dwelling_claims.peril, dwelling_claims.deductible_applied]
        note: The same-event share of the occurrence deductible reads the deductible carried on the customer's same-date LandlordGuard claim payments (a plain deductible read, not a factor).
    compute:
      - cn: "LATEST('home_claims', 'claim_number', date_field='entry_date', event_type='home_claim_reported')"
      - loss_date: "LATEST('home_claims', 'loss_date', date_field='entry_date', event_type='home_claim_reported', claim_number=cn)"
      - peril: "LATEST('home_claims', 'peril', date_field='entry_date', event_type='home_claim_reported', claim_number=cn)"
      - rc_pp: "SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_payment', coverage_part='personal_property', payment_type='acv_initial', claim_number=cn)"
      - dep_pp: "SUM('home_claims', 'depreciation_amount', event_type='home_claim_payment', coverage_part='personal_property', payment_type='acv_initial', claim_number=cn)"
      - paid_pp: "SUM('home_claims', 'amount', event_type='home_claim_payment', coverage_part='personal_property', claim_number=cn)"
      - occ_d: "MX(F('wind_hail_deductible_pct') * F('dwelling_limit') / 100, P('wind_hail_deductible_minimum')) if peril == 'wind_hail' else F('aop_deductible')"
      - occ_rc_pp: "SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_payment', source_entry_id='', claim_number=cn) + SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_denied', claim_number=cn)"
      - same_event_share: "MN(occ_d, XSUM('dwelling', 'dwelling_claims', 'deductible_applied', event_type='dwelling_claim_payment', loss_date=loss_date, peril='freeze') + XSUM('dwelling', 'dwelling_claims', 'deductible_applied', event_type='dwelling_claim_payment', loss_date=loss_date, peril='water_sudden_accidental')) if (peril == 'freeze' or peril == 'water_sudden_accidental') else 0"
      - dw_abs: "SUM('home_claims', 'deductible_applied', event_type='home_claim_payment', coverage_part='dwelling', claim_number=cn)"
      - os_abs: "SUM('home_claims', 'deductible_applied', event_type='home_claim_payment', coverage_part='other_structures', claim_number=cn)"
      - pp_ded: "0 if (P('deductible_waiver_threshold') > 0 and occ_rc_pp >= P('deductible_waiver_threshold')) else MX(0, MN(rc_pp, occ_d - same_event_share - dw_abs - os_abs))"
      - pp_released: "SUM('home_claims', 'amount', event_type='home_holdback_released', coverage_part='personal_property', claim_number=cn)"
      - pp_documented: "MAX('home_claims', 'incurred_amount', event_type='home_holdback_released', coverage_part='personal_property', claim_number=cn)"
      - pp_basis: "rc_pp - pp_ded if rc_pp <= P('rc_no_holdback_threshold') else (MN(rc_pp, pp_documented) - pp_ded if (rc_pp > P('rc_no_holdback_threshold') and pp_released > 0) else rc_pp - dep_pp - pp_ded)"
      - mold_entries: "COUNT('home_claims', event_type='home_claim_payment', coverage_part='mold', claim_number=cn)"
      - cleaning_rc: "SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_payment', coverage_part='personal_property', payment_type='acv_initial', claim_number=cn)"
      - cleaning_pct: "K('cleaning_pct_large') if (mold_entries > 0 and cleaning_rc >= K('cleaning_rc_floor')) else (K('cleaning_pct_small') if (mold_entries > 0 and cleaning_rc < K('cleaning_rc_floor')) else 0)"
      - dw_paid_rc: "SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_payment', coverage_part='dwelling', claim_number=cn)"
      - dw_paid_count: "COUNT('home_claims', event_type='home_claim_payment', coverage_part='dwelling', claim_number=cn)"
      - packout_pct: "K('packout_pct_storage') if (dw_paid_count > 0 and dw_paid_rc >= K('packout_rc_floor')) else (K('packout_pct_inhome') if (dw_paid_count > 0 and dw_paid_rc < K('packout_rc_floor')) else 0)"
      - wet_peril: "LATEST('home_claims', 'peril', date_field='entry_date', event_type='home_claim_reported', claim_number=cn)"
      - wet_pct: "K('wet_pct_sewage') if wet_peril == 'water_backup' else (K('wet_pct_clean') if (wet_peril == 'freeze' or wet_peril == 'water_sudden_accidental') else 0)"
      - result: "MX(0, RND(pp_basis - paid_pp + rc_pp * (cleaning_pct + packout_pct + wet_pct) / 100, 2))"
    compute_basis:
      cn: "The contents claim is taken from the newest first-notice entry on the policy, and the date of loss and cause of loss written on that entry apply to the contents."
      loss_date: "the date of loss and cause of loss written on that entry apply to the contents."
      peril: "the date of loss and cause of loss written on that entry apply to the contents."
      rc_pp: "The contents replacement-cost value and depreciation are those recorded on the claim's actual-cash-value initial payment entry for personal property"
      dep_pp: "The contents replacement-cost value and depreciation are those recorded on the claim's actual-cash-value initial payment entry for personal property"
      paid_pp: "the contents money already issued is every personal-property payment entry of the claim, recoverable-depreciation payments included."
      occ_d: "The occurrence deductible is one per occurrence: the all-other-perils deductible on the declarations or, for a wind or hail loss, the larger of the declarations' wind/hail percentage of Coverage A and the tier's wind/hail minimum."
      occ_rc_pp: "No deductible applies to the contents where the tier's deductible waiver threshold is above 0 and the replacement-cost values on the claim's denial entries and on its payment entries that replace no denial together reach it."
      same_event_share: "For a freeze or sudden discharge loss, the deductible the customer already bore on a LandlordGuard freeze or sudden-discharge claim with the same date of loss counts toward the occurrence deductible as its same-event share, never more than the whole occurrence deductible."
      dw_abs: "after the deductible carried on the claim's dwelling and other-structures payment entries"
      os_abs: "after the deductible carried on the claim's dwelling and other-structures payment entries"
      pp_ded: "No deductible applies to the contents where the tier's deductible waiver threshold is above 0 and the replacement-cost values on the claim's denial entries and on its payment entries that replace no denial together reach it. When no waiver applies, the contents absorb what the occurrence deductible leaves after that same-event share and after the deductible carried on the claim's dwelling and other-structures payment entries, and never more than their replacement-cost value."
      pp_released: "when it is above that threshold and a release of withheld contents depreciation stands on the claim"
      pp_documented: "the smaller of the replacement-cost value and the largest documented replacement cost on those releases, less the deductible absorbed."
      pp_basis: "The contents settled basis is their actual-cash-value figure, the replacement-cost value less the depreciation less the deductible the contents absorb. When the contents replacement-cost value is at or below the tier's no-holdback threshold, the settled basis is instead the full replacement-cost value less the deductible absorbed; when it is above that threshold and a release of withheld contents depreciation stands on the claim, the settled basis is instead the smaller of the replacement-cost value and the largest documented replacement cost on those releases, less the deductible absorbed."
      mold_entries: "when a mold payment entry stands on the claim"
      cleaning_rc: "A contents cleaning allowance for antimicrobial cleaning of salvageable contents is added at a percentage of the contents replacement-cost value"
      cleaning_pct: "8 percent when a mold payment entry stands on the claim and that value is at least 5,000.00, 4 percent when a mold payment entry stands and the value is below 5,000.00, and nothing when no mold payment entry stands."
      dw_paid_rc: "when the claim's dwelling payment entries carry a replacement-cost value of at least 10,000.00"
      dw_paid_count: "and nothing when the claim has no dwelling payment entry."
      packout_pct: "5 percent for packing out and storing the contents when the claim's dwelling payment entries carry a replacement-cost value of at least 10,000.00, 2 percent for moving the contents within the home when a dwelling payment entry stands with a replacement-cost value below 10,000.00, and nothing when the claim has no dwelling payment entry."
      wet_peril: "the date of loss and cause of loss written on that entry apply to the contents."
      wet_pct: "6 percent for a water backup loss, whose goods are sewage-contaminated, 3 percent for a freeze or sudden discharge loss, and nothing for a loss that is not a water loss, where ordinary debris removal is already within the replacement-cost value."
      result: "The contents supplemental starts from the settled basis less the contents money already issued; it is never below 0.00 and is rounded to the cent once, on the final figure. The cleaning, pack-out and saturated-contents allowances, each taken on the contents replacement-cost value, are added to that figure before the floor and the rounding."
    factors:
      - id: contents_settlement_method
        effect: method
        decides: pp_basis
        bindings: [pp_released, pp_documented, pp_basis]
        ladder:
          - when: "contents replacement-cost value at or below the tier's no-holdback threshold"
            method: "settled basis = full replacement-cost value less the deductible absorbed"
          - when: "above that threshold and a release of withheld contents depreciation stands on the claim"
            method: "settled basis = the smaller of the replacement-cost value and the largest documented replacement cost on the releases, less the deductible absorbed"
          - when: "otherwise"
            method: "settled basis = replacement-cost value less depreciation less the deductible absorbed"
        baseline:
          pp_basis: "rc_pp - dep_pp - pp_ded"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: contents_cleaning
        effect: parameter
        decides: cleaning_pct
        bindings: [mold_entries, cleaning_rc, cleaning_pct]
        ladder:
          - {when: "a mold payment entry stands on the claim AND contents replacement-cost value of at least 5,000.00", value: "K('cleaning_pct_large') = 8 percent"}
          - {when: "a mold payment entry stands on the claim AND contents replacement-cost value below 5,000.00", value: "K('cleaning_pct_small') = 4 percent"}
          - {when: "otherwise (no mold payment entry on the claim)", value: "0"}
        baseline:
          cleaning_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: contents_packout
        effect: parameter
        decides: packout_pct
        bindings: [dw_paid_rc, dw_paid_count, packout_pct]
        ladder:
          - {when: "a dwelling payment entry on the claim AND dwelling payment replacement-cost value of at least 10,000.00 (pack-out and storage)", value: "K('packout_pct_storage') = 5 percent"}
          - {when: "a dwelling payment entry on the claim AND dwelling payment replacement-cost value below 10,000.00 (moving contents within the home)", value: "K('packout_pct_inhome') = 2 percent"}
          - {when: "otherwise (no dwelling payment entry on the claim)", value: "0"}
        baseline:
          packout_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: contents_saturated_handling
        effect: parameter
        decides: wet_pct
        bindings: [wet_peril, wet_pct]
        ladder:
          - {when: "a water backup loss (sewage-contaminated goods)", value: "K('wet_pct_sewage') = 6 percent"}
          - {when: "a freeze or sudden discharge loss", value: "K('wet_pct_clean') = 3 percent"}
          - {when: "otherwise (not a water loss: ordinary debris removal is within the replacement-cost value)", value: "0"}
        baseline:
          wet_pct: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The contents claim is taken from the newest first-notice entry on the policy, and the date of loss and cause of loss written on that entry apply to the contents.
        The contents replacement-cost value and depreciation are those recorded on the claim's actual-cash-value initial payment entry for personal property, and the contents money already issued is every personal-property payment entry of the claim, recoverable-depreciation payments included.
        The occurrence deductible is one per occurrence: the all-other-perils deductible on the declarations or, for a wind or hail loss, the larger of the declarations' wind/hail percentage of Coverage A and the tier's wind/hail minimum.
        No deductible applies to the contents where the tier's deductible waiver threshold is above 0 and the replacement-cost values on the claim's denial entries and on its payment entries that replace no denial together reach it.
        For a freeze or sudden discharge loss, the deductible the customer already bore on a LandlordGuard freeze or sudden-discharge claim with the same date of loss counts toward the occurrence deductible as its same-event share, never more than the whole occurrence deductible.
        When no waiver applies, the contents absorb what the occurrence deductible leaves after that same-event share and after the deductible carried on the claim's dwelling and other-structures payment entries, and never more than their replacement-cost value.
        The contents settled basis is their actual-cash-value figure, the replacement-cost value less the depreciation less the deductible the contents absorb.
        The contents supplemental starts from the settled basis less the contents money already issued; it is never below 0.00 and is rounded to the cent once, on the final figure.
      params: [wind_hail_deductible_minimum, deductible_waiver_threshold, rc_no_holdback_threshold]
    inputs:
      history:
        - {table: home_claims, aggregate: sum, field: amount, filters: {event_type: home_claim_payment, coverage_part: personal_property}}
        - {table: home_claims, aggregate: count, field: claim_number, filters: {event_type: home_claim_payment, coverage_part: mold}}
        - {table: home_claims, aggregate: sum, field: replacement_cost_amount, filters: {event_type: home_claim_payment, coverage_part: dwelling}}
        - {table: home_claims, aggregate: max, field: incurred_amount, filters: {event_type: home_holdback_released, coverage_part: personal_property}}
        - {category: dwelling, table: dwelling_claims, aggregate: sum, field: deductible_applied, filters: {event_type: dwelling_claim_payment}}
      cross_category: [dwelling]
