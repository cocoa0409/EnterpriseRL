      - duct_wet_rc: "SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_denied', coverage_part='dwelling', denial_reason='repeated_seepage', claim_number=cn) + SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_payment', coverage_part='dwelling', source_entry_id='', claim_number=cn)"
      - duct_fee: "K('duct_fee_large') if duct_wet_rc >= K('duct_wet_rc_high') else (K('duct_fee_small') if duct_wet_rc >= K('duct_wet_rc_low') else 0)"
