  - id: home_ext_mold_denial_reversal
    base_policy_refs: [home_claim_settlement, home_roof_settlement, home_water_limitations, home_depreciation_recovery]
    overwrite:
      - base_policy: home_water_limitations
        superseded_clause: >-
          Fungi, wet rot and bacteria remediation that results from a covered water loss is paid as coverage_part mold up to mold_limit in aggregate per term, measured by home_msr_term_sublimit_paid.
        replaced_by: >-
          The whole mold figure, fees included, never exceeds the tier's mold limit less the mold money already issued on the policy for losses with a date of loss in the 12 months before the call.
      - base_policy: home_water_limitations
        superseded_clause: >-
          Holdback applies to hidden_water, water_backup and mold payments exactly as to dwelling under home_claim_settlement.
        replaced_by: >-
          Remediation is a service that carries no depreciation, so nothing is ever withheld on a mold payment.
      - base_policy: home_claim_settlement
        superseded_clause: >-
          For dwelling and other_structures, and for personal_property on a replacement_cost tier, when RC is at or below rc_no_holdback_threshold the payment is replacement_cost_full, equal to RC minus the deductible absorbed; otherwise the first payment is acv_initial, equal to RC minus depreciation minus the deductible absorbed, and the depreciation is withheld in one home_holdback_withheld entry.
        replaced_by: >-
