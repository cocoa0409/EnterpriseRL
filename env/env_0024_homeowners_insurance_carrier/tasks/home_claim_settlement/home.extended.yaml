        evidence: [date, history]
        cross_difficulty: null
    baseline:
      rule: >-
        The claim is the one whose first-notice entry carries the latest entry date on the policy, with the date and cause of loss that entry records.
        The other-structures replacement-cost value and depreciation are those recorded on the claim's actual-cash-value initial payment entry for other structures, and the money already issued on the part is every other-structures payment entry of the claim, the recoverable-depreciation payments included.
        The occurrence deductible for the other structures is the larger of the declarations' wind/hail percentage of Coverage A and the tier's wind/hail minimum when the cause of loss is wind or hail, and the declarations' all-other-perils deductible for any other cause.
        No deductible applies to the other structures when the replacement-cost values on the claim's payment entries that replace no denial, together with those on its denial entries, reach the tier's waiver threshold where that threshold is above 0.
        Otherwise the other structures absorb what the occurrence deductible leaves after the deductible carried on the claim's dwelling payment entries, but never more than their replacement-cost value.
        The settled basis of the other structures is their actual-cash-value figure: the replacement-cost value less the depreciation, less the deductible they absorb.
        The supplemental payment starts from the settled basis less the money already issued on the part; it is never below 0.00 and is rounded to the cent once, on the final figure.
      params: [wind_hail_deductible_minimum, deductible_waiver_threshold]
    inputs:
      history:
        - {table: home_claims, aggregate: sum, field: amount, filters: {event_type: home_claim_payment, coverage_part: other_structures}}
        - {table: home_claims, aggregate: sum, field: deductible_applied, filters: {event_type: home_claim_payment, coverage_part: dwelling}}
        - {table: home_claims, aggregate: max, field: incurred_amount, filters: {event_type: home_holdback_released, coverage_part: other_structures}}
        - {table: home_claims, aggregate: count, field: loss_date, within_months: 36, filters: {event_type: home_claim_reported}}
        - {category: flood, table: flood_claims, aggregate: count, field: loss_date, filters: {event_type: flood_claim_payment}}
      cross_category: [flood]
  - id: home_ext_water_denial_reversal
    base_policy_refs: [home_claim_settlement, home_roof_settlement, home_water_limitations, home_depreciation_recovery]
    overwrite:
      - base_policy: home_water_limitations
        superseded_clause: >-
          water_sudden_accidental and freeze damage settle under home_claim_settlement with the aop_deductible.
        replaced_by: >-
          Where a single-event credit applies, the deductible left for the dwelling water damage is the occurrence deductible less that credit.
      - base_policy: home_claim_settlement
        superseded_clause: >-
          For dwelling and other_structures, and for personal_property on a replacement_cost tier, when RC is at or below rc_no_holdback_threshold the payment is replacement_cost_full, equal to RC minus the deductible absorbed; otherwise the first payment is acv_initial, equal to RC minus depreciation minus the deductible absorbed, and the depreciation is withheld in one home_holdback_withheld entry.
        replaced_by: >-
          The reversal payment on the dwelling water damage starts from its covered amount less the deductible it absorbs and less any dwelling money already issued on the claim; it is never below 0.00 and is rounded to the cent once, on the final figure.
    trigger: state_due
    subject: [home_claim_payment]
    computes: amount
    target_tool: settle_denied_water_damage_028e176f
    params:
      labor_free_share_ho5: 55
      dep_cap_pct_ho3: 40
      drying_days_prompt: 2
      drying_days_late: 7
      drying_pct_prompt: 8
      drying_pct_late: 4
      access_rc_floor: 10000
      access_pct_large: 6
      access_pct_small: 3
      plumbing_code_ol_floor: 25
      plumbing_code_pct_full: 5
      plumbing_code_pct_reduced: 3
      hazmat_fee_pre1978: 750
      hazmat_fee_pre1990: 350
    rule: >-
      This policy re-settles the dwelling water damage of the most recently reported claim on a HomeGuard policy when the claim's first notice records a freeze or a sudden and accidental discharge of water while the dwelling damage stands on the claim only as a repeated-seepage denial entry, and fixes the payment that replaces that denial.
      The claim concerned is the latest first-notice entry on the policy, whose recorded date of loss, report date and cause of loss govern this settlement.
      The replacement-cost value and depreciation of the dwelling water damage are those recorded on its repeated-seepage denial entry.
      The occurrence deductible for the water loss is the all-other-perils deductible on the declarations, or for a wind or hail loss the larger of the declarations' wind/hail percentage of Coverage A and the tier's wind/hail minimum.
      Where the tier's deductible waiver threshold is above 0 and the replacement-cost values on the claim's denial entries and on its payment entries that replace no denial together reach it, no deductible applies to the dwelling water damage.
      Before any single-event credit, the deductible left for the dwelling water damage is the whole occurrence deductible.
      Where a single-event credit applies, the deductible left for the dwelling water damage is the occurrence deductible less that credit.
      When no waiver applies, the dwelling water damage absorbs the smaller of the deductible left for it and its covered amount.
      A freeze or sudden discharge that strikes the customer's home and a rental building the customer insures under LandlordGuard on the same date of loss is borne under one deductible: where a LandlordGuard freeze or sudden-discharge claim of the customer with the same date of loss carries a payment entry and the deductible carried on its payment entries is at least the occurrence deductible, the single-event credit is the whole occurrence deductible; where such a LandlordGuard payment entry exists and the deductible it carries is below the occurrence deductible, the credit is the deductible it carries; with no such LandlordGuard payment entry there is no credit.
      The covered amount of the dwelling water damage is the full replacement-cost value when that value is at or below the tier's no-holdback threshold, and otherwise the replacement-cost value less the depreciation recognized.
      The depreciation recognized is the depreciation recorded on the denial entry.
      Instead, on an HO-5 form with a replacement-cost value above the no-holdback threshold, depreciation is recognized on materials only, at 45 percent of the recorded depreciation (the labor share of 55 percent is not depreciated); on an HO-3 form with a replacement-cost value above that threshold, the depreciation recognized is the recorded depreciation but never more than 40 percent of the replacement-cost value.
      A water extraction and drying allowance is added at a percentage of the replacement-cost value, by the whole days from the date of loss to the report date on the first notice: 8 percent when the loss was reported within 2 days, 4 percent when it was reported in 3 to 7 days, and none when it was reported later, by which time the drying window has passed and the wet materials are replaced instead.
      An access tear-out allowance for opening walls, floors or ceilings to reach a frozen supply line is added at a percentage of the replacement-cost value: 6 percent for a freeze loss whose dwelling water damage has a replacement-cost value of at least 10,000.00, 3 percent for a freeze loss below that value, and none for a sudden discharge, whose tear-out of the wet materials around the discharge point is already inside the replacement-cost value of the damage, while a frozen line runs inside exterior walls beyond the wet area.
      A plumbing code-upgrade allowance for bringing the repaired supply run to the current plumbing code is added at a percentage of the replacement-cost value: 5 percent for a dwelling built before 1980 on a tier whose ordinance-or-law percentage is at least 25, 3 percent for a dwelling built before 1980 on a tier whose ordinance-or-law percentage is below 25, and none for a dwelling built in 1980 or later, whose supply lines already meet that code.
      A hazardous-material survey fee is added because the wet walls, floors or ceilings of every reversed water loss are cut out, by the year the dwelling was built: 750.00 for a dwelling built before 1978, 350.00 for one built from 1978 through 1989, and nothing for one built in 1990 or later.
      The reversal payment on the dwelling water damage starts from its covered amount less the deductible it absorbs and less any dwelling money already issued on the claim; it is never below 0.00 and is rounded to the cent once, on the final figure.
      The drying, access and plumbing code-upgrade allowances, each taken on the replacement-cost value, and the hazardous-material survey fee are added to that figure before the floor and the rounding.
      The payment is replacement_cost_full when the covered amount is the full replacement-cost value and acv_initial otherwise, with the depreciation recognized withheld, and its payee follows the claim settlement payee rule.
    prerequisite: []
    cross_category:
      - category: dwelling
        as: history
        reads: [dwelling_claims.event_type, dwelling_claims.loss_date, dwelling_claims.peril, dwelling_claims.deductible_applied]
        note: The single-event credit reads the customer's LandlordGuard claim payment entries with the same date of loss and the deductible they carry.
    compute:
      - cn: "LATEST('home_claims', 'claim_number', date_field='entry_date', event_type='home_claim_reported')"
      - loss_date: "LATEST('home_claims', 'loss_date', date_field='entry_date', event_type='home_claim_reported', claim_number=cn)"
      - report_date: "LATEST('home_claims', 'entry_date', date_field='entry_date', event_type='home_claim_reported', claim_number=cn)"
      - peril: "LATEST('home_claims', 'peril', date_field='entry_date', event_type='home_claim_reported', claim_number=cn)"
      - rc_w: "SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_denied', coverage_part='dwelling', denial_reason='repeated_seepage', claim_number=cn)"
      - dep_w: "SUM('home_claims', 'depreciation_amount', event_type='home_claim_denied', coverage_part='dwelling', denial_reason='repeated_seepage', claim_number=cn)"
      - paid_dw: "SUM('home_claims', 'amount', event_type='home_claim_payment', coverage_part='dwelling', claim_number=cn)"
      - occ_ded: "MX(F('wind_hail_deductible_pct') * F('dwelling_limit') / 100, P('wind_hail_deductible_minimum')) if peril == 'wind_hail' else F('aop_deductible')"
      - occ_rc_sum: "SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_payment', source_entry_id='', claim_number=cn) + SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_denied', claim_number=cn)"
      - same_day_payments: "XCOUNT('dwelling', 'dwelling_claims', event_type='dwelling_claim_payment', loss_date=loss_date, peril='freeze') + XCOUNT('dwelling', 'dwelling_claims', event_type='dwelling_claim_payment', loss_date=loss_date, peril='water_sudden_accidental')"
      - same_day_deductible: "XSUM('dwelling', 'dwelling_claims', 'deductible_applied', event_type='dwelling_claim_payment', loss_date=loss_date, peril='freeze') + XSUM('dwelling', 'dwelling_claims', 'deductible_applied', event_type='dwelling_claim_payment', loss_date=loss_date, peril='water_sudden_accidental')"
      - event_credit: "occ_ded if (same_day_payments > 0 and same_day_deductible >= occ_ded) else (same_day_deductible if (same_day_payments > 0 and same_day_deductible < occ_ded) else 0)"
      - dep_rc: "SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_denied', coverage_part='dwelling', denial_reason='repeated_seepage', claim_number=cn)"
      - dep_recognized: "dep_w * (100 - K('labor_free_share_ho5')) / 100 if (P('coverage_form') == 'HO-5' and dep_rc > P('rc_no_holdback_threshold')) else (MN(dep_w, dep_rc * K('dep_cap_pct_ho3') / 100) if (P('coverage_form') == 'HO-3' and dep_rc > P('rc_no_holdback_threshold')) else dep_w)"
      - covered_w: "rc_w if rc_w <= P('rc_no_holdback_threshold') else rc_w - dep_recognized"
      - absorbed_w: "0 if (P('deductible_waiver_threshold') > 0 and occ_rc_sum >= P('deductible_waiver_threshold')) else MN(MX(0, occ_ded - event_credit), covered_w)"
      - report_days: "DAYS(loss_date, report_date)"
      - drying_pct: "K('drying_pct_prompt') if report_days <= K('drying_days_prompt') else (K('drying_pct_late') if (report_days > K('drying_days_prompt') and report_days <= K('drying_days_late')) else 0)"
      - access_rc: "SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_denied', coverage_part='dwelling', denial_reason='repeated_seepage', claim_number=cn)"
      - access_pct: "K('access_pct_large') if (peril == 'freeze' and access_rc >= K('access_rc_floor')) else (K('access_pct_small') if (peril == 'freeze' and access_rc < K('access_rc_floor')) else 0)"
      - built_vs_1980: "MONTHS(F('year_built') + '-01-01', '1980-01-01')"
      - plumbing_code_pct: "K('plumbing_code_pct_full') if (built_vs_1980 > 0 and P('ordinance_or_law_pct') >= K('plumbing_code_ol_floor')) else (K('plumbing_code_pct_reduced') if (built_vs_1980 > 0 and P('ordinance_or_law_pct') < K('plumbing_code_ol_floor')) else 0)"
      - built_vs_1978: "MONTHS(F('year_built') + '-01-01', '1978-01-01')"
      - built_vs_1990: "MONTHS(F('year_built') + '-01-01', '1990-01-01')"
      - hazmat_fee: "K('hazmat_fee_pre1978') if built_vs_1978 > 0 else (K('hazmat_fee_pre1990') if built_vs_1990 > 0 else 0)"
      - result: "MX(0, RND(covered_w - absorbed_w - paid_dw + rc_w * (drying_pct + access_pct + plumbing_code_pct) / 100 + hazmat_fee, 2))"
    compute_basis:
      cn: "The claim concerned is the latest first-notice entry on the policy, whose recorded date of loss, report date and cause of loss govern this settlement."
      loss_date: "whose recorded date of loss, report date and cause of loss govern this settlement."
