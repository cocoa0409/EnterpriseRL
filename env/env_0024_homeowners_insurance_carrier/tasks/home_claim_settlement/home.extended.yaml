      - prior_water_paid: "COUNT('home_claims', within_months=K('water_window_months'), date_field='loss_date', event_type='home_claim_payment', peril='water_sudden_accidental') + COUNT('home_claims', within_months=K('water_window_months'), date_field='loss_date', event_type='home_claim_payment', peril='freeze') + COUNT('home_claims', within_months=K('water_window_months'), date_field='loss_date', event_type='home_claim_payment', peril='water_backup') + COUNT('home_claims', within_months=K('water_window_months'), date_field='loss_date', event_type='home_claim_payment', peril='water_repeated_seepage') - COUNT('home_claims', event_type='home_claim_payment', claim_number=cn)"
