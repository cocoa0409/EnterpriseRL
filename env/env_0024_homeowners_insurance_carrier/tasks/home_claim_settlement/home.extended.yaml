        effect: parameter
        decides: tenure_credit
        bindings: [tenure_months, recent_claims, tenure_credit]
        ladder:
          - {when: "at least 180 whole months since the original effective date and no more than two claims with a date of loss in the 36 months before the call", value: "K('tenure_credit_long') = 250.00"}
          - {when: "60 to 179 whole months and no more than two such claims", value: "K('tenure_credit_mid') = 100.00"}
          - {when: "otherwise", value: "0"}
