      history:
        - {table: home_claims, aggregate: latest, field: claim_number, filters: {event_type: home_claim_reported}}
        - {table: home_claims, aggregate: sum, field: replacement_cost_amount, filters: {event_type: home_claim_denied, property_class: roof_surfacing}}
        - {table: home_claims, aggregate: sum, field: amount, within_months: 36, filters: {event_type: home_claim_payment, property_class: roof_surfacing}}
        - {table: home_claims, aggregate: sum, field: amount, within_months: 36, filters: {event_type: home_holdback_forfeited, property_class: roof_surfacing}}
      cross_category: []
  - id: home_ext_structure_supplemental
    base_policy_refs: [home_claim_settlement, home_roof_settlement, home_water_limitations, home_depreciation_recovery]
    overwrite:
      - base_policy: home_claim_settlement
        superseded_clause: >-
          For dwelling and other_structures, and for personal_property on a replacement_cost tier, when RC is at or below rc_no_holdback_threshold the payment is replacement_cost_full, equal to RC minus the deductible absorbed; otherwise the first payment is acv_initial, equal to RC minus depreciation minus the deductible absorbed, and the depreciation is withheld in one home_holdback_withheld entry.
        replaced_by: >-
          The settled basis of the other structures is their actual-cash-value figure: the replacement-cost value less the depreciation, less the deductible they absorb.
      - base_policy: home_claim_settlement
        superseded_clause: >-
          it is absorbed first by dwelling, then other_structures, then personal_property, until used up.
        replaced_by: >-
          Otherwise the other structures absorb what the occurrence deductible leaves after the deductible carried on the claim's dwelling payment entries, but never more than their replacement-cost value.
    trigger: on_request
    subject: [home_claim_payment]
    computes: amount
    target_tool: accept_structure_supplemental_c73fec14
    params:
      op_trades_full: 3
      op_trades_part: 2
      op_pct_full: 10
      op_pct_part: 5
      permit_rc_high: 25000
      permit_rc_low: 10000
      permit_pct_high: 2
      permit_pct_low: 1
      haul_dep_share_pct: 25
      haul_dep_share_floor: 10
      haul_pct_aged: 4
      haul_pct_newer: 2
      tenure_months_long: 180
      tenure_months_mid: 60
      tenure_claims_max: 2
      tenure_window_months: 36
      tenure_credit_long: 250
      tenure_credit_mid: 100
    rule: >-
      This policy re-settles the other-structures part of the most recently reported wind or hail claim on a HomeGuard policy once the claim's first other-structures settlement entry stands, and fixes the supplemental payment the named insured accepts on it.
      The claim is the one whose first-notice entry carries the latest entry date on the policy, with the date and cause of loss that entry records.
      The other-structures replacement-cost value and depreciation are those recorded on the claim's actual-cash-value initial payment entry for other structures, and the money already issued on the part is every other-structures payment entry of the claim, the recoverable-depreciation payments included.
      The occurrence deductible for the other structures is the larger of the declarations' wind/hail percentage of Coverage A and the tier's wind/hail minimum when the cause of loss is wind or hail, and the declarations' all-other-perils deductible for any other cause.
      No deductible applies to the other structures when the replacement-cost values on the claim's payment entries that replace no denial, together with those on its denial entries, reach the tier's waiver threshold where that threshold is above 0.
      Otherwise the other structures absorb what the occurrence deductible leaves after the deductible carried on the claim's dwelling payment entries, but never more than their replacement-cost value.
      The other-structures supplemental figure is fixed only after the roof surfacing of the same claim carries a payment entry wherever that roof surfacing was denied below the deductible.
      The settled basis of the other structures is their actual-cash-value figure: the replacement-cost value less the depreciation, less the deductible they absorb.
      When the replacement-cost value is at or below the tier's no-holdback threshold, the settled basis is instead the full replacement-cost value less the deductible absorbed; when it is above that threshold and a release of withheld depreciation already stands on the part, the settled basis is instead the smaller of the replacement-cost value and the largest documented incurred cost on those releases, less the deductible absorbed.
      Overhead and profit for the general contractor is added at a percentage of the other-structures replacement-cost value, set by the trades the storm job involves, counted as the claim's first-settlement payment entries (actual-cash-value initial, full replacement-cost, actual-cash-value final and roof schedule payments) plus the payment entries of the customer's FloodGuard claims with the same date of loss: 10 percent when they number three or more, 5 percent when they number exactly two, and nothing when they number fewer than two.
      A permit and inspection allowance is added at 2 percent of the other-structures replacement-cost value when that value is 25,000.00 or more, at 1 percent when it is 10,000.00 or more but below 25,000.00, and not at all below 10,000.00.
      A demolition and haul-away allowance for tearing out the damaged structure is added by the structure's recorded depreciation share: 4 percent of the other-structures replacement-cost value when the recorded depreciation is at least 25 percent of that value, 2 percent when it is at least 10 percent but below 25 percent, and not at all below 10 percent, where a nearly new structure is repaired in place.
      A member-tenure credit is added in dollars, counting whole months from the policy's original effective date to the day of the call and the claims on the policy whose date of loss falls in the 36 months before the call: 250.00 for at least 180 months with no more than two such claims, 100.00 for 60 to 179 months with no more than two such claims, and nothing otherwise.
      The supplemental payment starts from the settled basis less the money already issued on the part; it is never below 0.00 and is rounded to the cent once, on the final figure.
      The overhead-and-profit, permit and haul-away allowances, each taken on the replacement-cost value, and the member-tenure credit are added to that figure before the floor and the rounding.
      The supplemental is paid as payment_type supplemental on the other-structures general class, and its payee follows the claim settlement payee rule.
    prerequisite:
      - problem: home_ext_roof_denial_reversal
        kind: value_input
        gate: dw_abs
        form: state
        policy_source: >-
          The other-structures supplemental figure is fixed only after the roof surfacing of the same claim carries a payment entry wherever that roof surfacing was denied below the deductible.
        condition: >-
          Where the claim carries a below-deductible denial entry of dwelling roof surfacing, the claim also carries a dwelling roof surfacing home_claim_payment entry (with the deductible the roof surfacing absorbs), so the deductible left for the other structures is the occurrence deductible less the deductible on the claim's dwelling payment entries.
        resolved_by: settle_denied_roof_surfacing_b6cb399f
        effect: >-
          A roof surfacing payment entry appears on the claim carrying the deductible the roof surfacing absorbs, so the sum of the deductible on the claim's dwelling payment entries rises from 0.00 and the deductible left for the other structures (and with it the other-structures settled basis) changes; the extra first-settlement entry also raises the trade count read by the overhead-and-profit ladder.
    cross_category:
      - category: flood
        as: history
        reads: [flood_claims.event_type, flood_claims.loss_date]
        note: The overhead-and-profit ladder counts the payment entries of the customer's FloodGuard claims with the same date of loss as trades of the same storm job.
    compute:
      - cn: "LATEST('home_claims', 'claim_number', date_field='entry_date', event_type='home_claim_reported')"
      - loss_date: "LATEST('home_claims', 'loss_date', date_field='entry_date', event_type='home_claim_reported', claim_number=cn)"
      - peril: "LATEST('home_claims', 'peril', date_field='entry_date', event_type='home_claim_reported', claim_number=cn)"
      - rc_os: "SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_payment', coverage_part='other_structures', payment_type='acv_initial', claim_number=cn)"
      - dep_os: "SUM('home_claims', 'depreciation_amount', event_type='home_claim_payment', coverage_part='other_structures', payment_type='acv_initial', claim_number=cn)"
      - paid_os: "SUM('home_claims', 'amount', event_type='home_claim_payment', coverage_part='other_structures', claim_number=cn)"
      - occ_ded: "MX(F('wind_hail_deductible_pct') * F('dwelling_limit') / 100, P('wind_hail_deductible_minimum')) if peril == 'wind_hail' else F('aop_deductible')"
      - occ_rc_total: "SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_payment', source_entry_id='', claim_number=cn) + SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_denied', claim_number=cn)"
      - dw_abs: "SUM('home_claims', 'deductible_applied', event_type='home_claim_payment', coverage_part='dwelling', claim_number=cn)"
      - os_ded: "0 if (P('deductible_waiver_threshold') > 0 and occ_rc_total >= P('deductible_waiver_threshold')) else MX(0, MN(rc_os, occ_ded - dw_abs))"
      - released_os: "SUM('home_claims', 'amount', event_type='home_holdback_released', coverage_part='other_structures', claim_number=cn)"
      - documented_cost: "MAX('home_claims', 'incurred_amount', event_type='home_holdback_released', coverage_part='other_structures', claim_number=cn)"
      - settled_basis: "rc_os - os_ded if rc_os <= P('rc_no_holdback_threshold') else (MN(rc_os, documented_cost) - os_ded if (rc_os > P('rc_no_holdback_threshold') and released_os > 0) else rc_os - dep_os - os_ded)"
      - job_trades: "COUNT('home_claims', event_type='home_claim_payment', payment_type='acv_initial', claim_number=cn) + COUNT('home_claims', event_type='home_claim_payment', payment_type='replacement_cost_full', claim_number=cn) + COUNT('home_claims', event_type='home_claim_payment', payment_type='actual_cash_value_final', claim_number=cn) + COUNT('home_claims', event_type='home_claim_payment', payment_type='roof_schedule', claim_number=cn) + XCOUNT('flood', 'flood_claims', event_type='flood_claim_payment', loss_date=loss_date)"
      - op_pct: "K('op_pct_full') if job_trades >= K('op_trades_full') else (K('op_pct_part') if job_trades >= K('op_trades_part') else 0)"
      - permit_rc: "SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_payment', coverage_part='other_structures', payment_type='acv_initial', claim_number=cn)"
      - permit_pct: "K('permit_pct_high') if permit_rc >= K('permit_rc_high') else (K('permit_pct_low') if permit_rc >= K('permit_rc_low') else 0)"
      - haul_dep: "SUM('home_claims', 'depreciation_amount', event_type='home_claim_payment', coverage_part='other_structures', payment_type='acv_initial', claim_number=cn)"
      - haul_pct: "K('haul_pct_aged') if haul_dep * 100 >= permit_rc * K('haul_dep_share_pct') else (K('haul_pct_newer') if (haul_dep * 100 >= permit_rc * K('haul_dep_share_floor') and haul_dep * 100 < permit_rc * K('haul_dep_share_pct')) else 0)"
      - tenure_months: "MONTHS(F('original_effective_date'), NOW)"
      - recent_claims: "COUNT('home_claims', within_months=K('tenure_window_months'), date_field='loss_date', event_type='home_claim_reported')"
      - tenure_credit: "K('tenure_credit_long') if (tenure_months >= K('tenure_months_long') and recent_claims <= K('tenure_claims_max')) else (K('tenure_credit_mid') if (tenure_months >= K('tenure_months_mid') and tenure_months < K('tenure_months_long') and recent_claims <= K('tenure_claims_max')) else 0)"
      - result: "MX(0, RND(settled_basis - paid_os + rc_os * (op_pct + permit_pct + haul_pct) / 100 + tenure_credit, 2))"
    compute_basis:
      cn: "The claim is the one whose first-notice entry carries the latest entry date on the policy, with the date and cause of loss that entry records."
      loss_date: "with the date and cause of loss that entry records."
      peril: "with the date and cause of loss that entry records."
      rc_os: "The other-structures replacement-cost value and depreciation are those recorded on the claim's actual-cash-value initial payment entry for other structures"
      dep_os: "The other-structures replacement-cost value and depreciation are those recorded on the claim's actual-cash-value initial payment entry for other structures"
      paid_os: "the money already issued on the part is every other-structures payment entry of the claim, the recoverable-depreciation payments included."
      occ_ded: "The occurrence deductible for the other structures is the larger of the declarations' wind/hail percentage of Coverage A and the tier's wind/hail minimum when the cause of loss is wind or hail, and the declarations' all-other-perils deductible for any other cause."
      occ_rc_total: "No deductible applies to the other structures when the replacement-cost values on the claim's payment entries that replace no denial, together with those on its denial entries, reach the tier's waiver threshold where that threshold is above 0."
      dw_abs: "Otherwise the other structures absorb what the occurrence deductible leaves after the deductible carried on the claim's dwelling payment entries, but never more than their replacement-cost value."
      os_ded: "Otherwise the other structures absorb what the occurrence deductible leaves after the deductible carried on the claim's dwelling payment entries, but never more than their replacement-cost value."
      released_os: "when it is above that threshold and a release of withheld depreciation already stands on the part"
      documented_cost: "the smaller of the replacement-cost value and the largest documented incurred cost on those releases, less the deductible absorbed."
      settled_basis: "The settled basis of the other structures is their actual-cash-value figure: the replacement-cost value less the depreciation, less the deductible they absorb. When the replacement-cost value is at or below the tier's no-holdback threshold, the settled basis is instead the full replacement-cost value less the deductible absorbed; when it is above that threshold and a release of withheld depreciation already stands on the part, the settled basis is instead the smaller of the replacement-cost value and the largest documented incurred cost on those releases, less the deductible absorbed."
      job_trades: "counted as the claim's first-settlement payment entries (actual-cash-value initial, full replacement-cost, actual-cash-value final and roof schedule payments) plus the payment entries of the customer's FloodGuard claims with the same date of loss"
      op_pct: "10 percent when they number three or more, 5 percent when they number exactly two, and nothing when they number fewer than two."
      permit_rc: "A permit and inspection allowance is added at 2 percent of the other-structures replacement-cost value"
      permit_pct: "A permit and inspection allowance is added at 2 percent of the other-structures replacement-cost value when that value is 25,000.00 or more, at 1 percent when it is 10,000.00 or more but below 25,000.00, and not at all below 10,000.00."
      haul_dep: "by the structure's recorded depreciation share"
      haul_pct: "A demolition and haul-away allowance for tearing out the damaged structure is added by the structure's recorded depreciation share: 4 percent of the other-structures replacement-cost value when the recorded depreciation is at least 25 percent of that value, 2 percent when it is at least 10 percent but below 25 percent, and not at all below 10 percent, where a nearly new structure is repaired in place."
      tenure_months: "counting whole months from the policy's original effective date to the day of the call"
      recent_claims: "the claims on the policy whose date of loss falls in the 36 months before the call"
      tenure_credit: "250.00 for at least 180 months with no more than two such claims, 100.00 for 60 to 179 months with no more than two such claims, and nothing otherwise."
      result: "The supplemental payment starts from the settled basis less the money already issued on the part; it is never below 0.00 and is rounded to the cent once, on the final figure. The overhead-and-profit, permit and haul-away allowances, each taken on the replacement-cost value, and the member-tenure credit are added to that figure before the floor and the rounding."
    factors:
      - id: structure_settlement_method
        effect: method
        decides: settled_basis
        bindings: [released_os, documented_cost, settled_basis]
        ladder:
          - when: "the other-structures replacement-cost value is at or below the tier's no-holdback threshold"
            method: "settled basis = full replacement-cost value less the deductible absorbed"
          - when: "the replacement-cost value is above that threshold and a release of withheld depreciation already stands on the part"
            method: "settled basis = the smaller of the replacement-cost value and the largest documented incurred cost on the releases, less the deductible absorbed"
          - when: "otherwise"
            method: "settled basis = replacement-cost value less depreciation less the deductible absorbed"
        baseline:
          settled_basis: "rc_os - dep_os - os_ded"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: storm_job_overhead_profit
        effect: parameter
        decides: op_pct
        bindings: [job_trades, op_pct]
        ladder:
          - {when: "three or more trades: the claim's first-settlement payment entries plus the same-date FloodGuard claim payment entries", value: "K('op_pct_full') = 10 percent"}
          - {when: "exactly two such trades", value: "K('op_pct_part') = 5 percent"}
          - {when: "otherwise (fewer than two)", value: "0"}
        baseline:
          op_pct: "0"
        evidence: [history, cross_category]
        cross_difficulty: flood
      - id: structure_permit_allowance
        effect: parameter
        decides: permit_pct
        bindings: [permit_rc, permit_pct]
        ladder:
          - {when: "other-structures replacement-cost value of 25,000.00 or more", value: "K('permit_pct_high') = 2 percent"}
          - {when: "10,000.00 or more but below 25,000.00", value: "K('permit_pct_low') = 1 percent"}
          - {when: "otherwise (below 10,000.00)", value: "0"}
        baseline:
          permit_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: structure_haul_away
        effect: parameter
        decides: haul_pct
        bindings: [haul_dep, haul_pct]
        ladder:
          - {when: "recorded depreciation at least 25 percent of the other-structures replacement-cost value", value: "K('haul_pct_aged') = 4 percent"}
          - {when: "recorded depreciation at least 10 percent but below 25 percent of it", value: "K('haul_pct_newer') = 2 percent"}
          - {when: "otherwise (below 10 percent: a nearly new structure repaired in place)", value: "0"}
        baseline:
          haul_pct: "0"
        evidence: [history]
        cross_difficulty: null
