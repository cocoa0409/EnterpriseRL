events:
  # ---------------- contract changes on home_policies ----------------
  - type: home_policy_bound
    target: home_policies
    mutation: create
    meaning: A new homeowners policy is bound for one residence premises with its tier, limits, deductibles, roof settlement basis and billing plan.
    grain: One row per policy contract.
    fields:
      policy_number: Policy number assigned at binding.
      variant_name: Official tier name the policy is written on.
      occupancy: Whether the premises is the primary or a secondary/seasonal residence.
      property_address: Residence premises address.
      year_built: Year the dwelling was built.
      roof_material: Roof covering material.
      roof_install_year: Year the current roof covering was installed.
      roof_settlement: Roof surfacing settlement basis assigned for the term.
      dwelling_limit: Coverage A limit.
      personal_property_limit: Coverage C limit.
      liability_limit: Coverage E limit.
      aop_deductible: All-other-perils deductible.
      wind_hail_deductible_pct: Wind/hail deductible percentage of Coverage A.
      water_backup_limit: Total water backup limit in force.
      billing_plan: Billing plan chosen.
      mortgagee_name: First mortgagee, empty when none.
      loan_number: Mortgage loan number, empty when none.
      bound_date: Date the policy was bound.
      original_effective_date: First inception date of the policy.
      effective_date: Start of the current term.
      expiration_date: End of the current term.
      term_premium: Annual premium of the term.
    triggers:
      - event: home:home_premium_billed
        when: {billing_plan: mortgagee_escrow}
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date, amount: term_premium, payer: mortgagee}
      - event: home:home_premium_billed
        when: {billing_plan: {not: mortgagee_escrow}}
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date, payer: insured}
      - event: home:home_mortgagee_invoice
        when: {billing_plan: mortgagee_escrow}
        map: {term_effective_date: effective_date, due_date: effective_date, amount: term_premium}
      - event: home:home_inspection_ordered
        map: {}
  - type: home_policy_activated
    target: home_policies
    mutation: {transition: {from: bound, to: in_force}}
    meaning: Coverage attaches on the effective date of a bound policy.
    grain: One row per transaction.
    fields: {effective_date: The effective date reached.}
    triggers: []
  - type: home_cancellation_noticed
    target: home_policies
    mutation: {transition: {from: in_force, to: pending_cancellation}}
    meaning: A notice of cancellation is issued to the named insured (and copied to the mortgagee) with a scheduled cancellation date.
    grain: One row per transaction.
    fields:
      status_reason: Ground of the notice (nonpayment, uncured_condition, material_misrepresentation or substantial_hazard_increase).
      pending_action_date: Scheduled cancellation date stated on the notice.
    triggers: []
  - type: home_cancellation_rescinded
    target: home_policies
    mutation: {transition: {from: pending_cancellation, to: in_force}}
    meaning: A pending cancellation is withdrawn because its cure arrived before the scheduled cancellation date.
    grain: One row per transaction.
    fields:
      status_reason: Reset to none.
      pending_action_date: Cleared.
    triggers: []
  - type: home_policy_cancelled
    target: home_policies
    mutation:
      transition:
        - {from: pending_cancellation, to: cancelled}
        - {from: in_force, to: cancelled}
        - {from: bound, to: cancelled}
    meaning: Coverage ends before the expiration date, on a carrier notice or at the named insured's signed request.
    grain: One row per transaction.
    fields:
      policy_number: Policy number of the cancelled policy, carried unchanged.
      status_reason: Ground of the cancellation.
      closed_date: Date coverage ended.
      pending_action_date: Cleared.
    triggers:
      - event: home:home_return_premium
        map: {posted_date: closed_date}
      - event: umbrella:umbrella_underlying_lapsed
        map: {underlying_line: home, underlying_policy_number: policy_number, event_date: closed_date}
  - type: home_policy_reinstated
    target: home_policies
    mutation: {transition: {from: cancelled, to: in_force}}
    meaning: A policy cancelled for nonpayment is put back in force without a lapse.
    grain: One row per transaction.
    fields:
      status_reason: Reset to none.
      closed_date: Cleared.
    triggers:
      - event: home:home_fee_assessed
        map: {fee_code: reinstatement_fee}
      - event: home:home_additional_premium
        map: {credit_basis: reinstatement_reversal}
  - type: home_nonrenewal_noticed
    target: home_policies
    mutation: {transition: {from: in_force, to: pending_nonrenewal}}
    meaning: A notice of nonrenewal is issued; the policy will end at its expiration date.
    grain: One row per transaction.
    fields:
      status_reason: Ground of the nonrenewal (uncured_condition, claim_frequency or water_claim_frequency).
      pending_action_date: The expiration date on which the policy will end.
    triggers: []
  - type: home_nonrenewal_rescinded
    target: home_policies
    mutation: {transition: {from: pending_nonrenewal, to: in_force}}
    meaning: A notice of nonrenewal is withdrawn and the policy will be offered renewal.
    grain: One row per transaction.
    fields:
      status_reason: Reset to none.
      pending_action_date: Cleared.
    triggers: []
  - type: home_policy_expired
    target: home_policies
    mutation:
      transition:
        - {from: pending_nonrenewal, to: expired}
        - {from: in_force, to: expired}
    meaning: The policy term ends without a renewal in force.
    grain: One row per transaction.
    fields:
      policy_number: Policy number of the expired policy, carried unchanged.
      status_reason: Nonrenewal ground carried over, or renewal_not_paid.
      closed_date: The expiration date.
    triggers:
      - event: umbrella:umbrella_underlying_lapsed
        map: {underlying_line: home, underlying_policy_number: policy_number, event_date: closed_date}
  - type: home_lapse_renewed
    target: home_policies
    mutation: {transition: {from: expired, to: in_force}}
    meaning: A late renewal payment is accepted inside the late-payment window and the policy renews with a coverage gap.
    grain: One row per transaction.
    fields:
      effective_date: Start of the renewed term (the day the late payment was received).
      expiration_date: End of the renewed term.
      status_reason: Reset to none.
      closed_date: Cleared.
    triggers: []
  - type: home_policy_renewed
    target: home_policies
    mutation: update
    meaning: The policy rolls into a new twelve-month term with its renewed Coverage A, roof settlement basis and term premium.
    grain: One row per transaction.
    fields:
      effective_date: Start of the new term.
      expiration_date: End of the new term.
      dwelling_limit: Coverage A after the inflation guard.
      roof_settlement: Roof settlement basis re-evaluated for the new term.
      term_premium: Renewal term premium from the renewal offer.
    triggers:
      - event: home:home_premium_billed
        map: {term_effective_date: effective_date, installment_number: 1, due_date: effective_date}
  - type: home_coverage_updated
    target: home_policies
    mutation: update
    meaning: A coverage limit or deductible on the declarations page changes as the result of an endorsement.
    grain: One row per transaction.
    fields:
      dwelling_limit: Coverage A after the change.
      personal_property_limit: Coverage C after the change.
      liability_limit: Coverage E after the change.
      aop_deductible: All-other-perils deductible after the change.
      water_backup_limit: Total water backup limit after the change.
    triggers: []
  - type: home_property_updated
    target: home_policies
    mutation: update
    meaning: Property characteristics on file change after documented work, such as a roof replacement.
    grain: One row per transaction.
    fields:
      roof_material: Roof covering material after the work.
      roof_install_year: Year the new roof covering was installed.
      roof_settlement: Roof settlement basis re-evaluated after the work.
    triggers: []
  - type: home_mortgagee_changed
    target: home_policies
    mutation: update
    meaning: The first mortgagee on the policy is added, replaced or removed (refinance, sale of the loan or payoff).
    grain: One row per transaction.
    fields:
      mortgagee_name: New first mortgagee, empty when the loan is paid off.
      loan_number: New loan number, empty when the loan is paid off.
    triggers: []
  - type: home_billing_plan_changed
    target: home_policies
    mutation: update
    meaning: The billing plan changes, at the named insured's request or because EFT and check payments were suspended.
    grain: One row per transaction.
    fields:
      billing_plan: Billing plan after the change.
      eft_suspended: Whether EFT and check payments are suspended for the rest of the term.
    triggers: []
  # ---------------- premium ledger: home_billing ----------------
  - type: home_premium_billed
    target: home_billing
    meaning: One installment of the term premium is billed to the payer.
    grain: One row per installment of a policy term.
    distinguish_by: [term_effective_date, installment_number]
    fields:
      term_effective_date: Term the installment belongs to.
      installment_number: Position of the installment in the term schedule (1 = first).
      due_date: Date the installment is due.
      amount: Installment amount billed.
      payer: Who is billed (insured or mortgagee).
      posted_date: Date the bill was issued.
    account: premium_balance
    direction: in
    triggers:
      - event: home:home_fee_assessed
        when: {installment_number: {not: 1}}
        map: {fee_code: installment_fee, term_effective_date: term_effective_date, installment_number: installment_number, posted_date: posted_date}
  - type: home_fee_assessed
    target: home_billing
    meaning: A billing fee is charged — installment service charge, late fee, returned-payment fee or reinstatement fee.
    grain: One row per fee charged.
    distinguish_by: [fee_code, term_effective_date, installment_number, source_billing_id]
    fields:
      fee_code: Which fee is charged.
      term_effective_date: Term the fee belongs to.
      installment_number: Installment the fee relates to (0 when not tied to an installment).
      source_billing_id: The returned payment a returned-payment fee is charged for; empty otherwise.
      amount: Fee amount.
      posted_date: Date the fee is charged.
    account: premium_balance
    direction: in
    triggers: []
  - type: home_fee_waived
    target: home_billing
    meaning: A previously charged late fee or returned-payment fee is waived.
    grain: One row per waived fee.
    distinguish_by: [source_billing_id]
    fields:
      source_billing_id: The fee entry being waived.
      fee_code: Code of the fee being waived.
      amount: Amount waived (the full fee).
      posted_date: Date of the waiver.
    account: premium_balance
    direction: out
    triggers: []
  - type: home_payment_received
    target: home_billing
    meaning: A premium payment from the named insured or the mortgagee is received and applied.
    grain: One row per payment received.
    distinguish_by: [payment_reference]
    fields:
      payment_reference: Confirmation or check number of the payment.
      amount: Payment amount.
      payer: Who paid.
      payment_method: How the payment was made.
      posted_date: Date the payment was received.
    account: premium_balance
    direction: out
    triggers: []
  - type: home_payment_returned
    target: home_billing
    meaning: A payment is returned unpaid by the bank and its credit is reversed.
    grain: One row per returned payment.
    distinguish_by: [source_billing_id]
    fields:
      source_billing_id: The payment entry being reversed.
      amount: Amount reversed (the full payment).
      posted_date: Date the return was posted.
    account: premium_balance
    direction: in
    triggers:
      - event: home:home_fee_assessed
        map: {fee_code: returned_payment_fee, source_billing_id: home_billing_id, posted_date: posted_date}
  - type: home_additional_premium
    target: home_billing
    meaning: Additional premium is charged, from a premium-raising midterm endorsement or from reversing a cancellation credit at reinstatement.
    grain: One row per endorsement that raises premium, or per reinstatement.
    distinguish_by: [source_endorsement_id, credit_basis, posted_date]
    fields:
      source_endorsement_id: The endorsement the charge belongs to; empty when the charge reverses a cancellation credit at reinstatement.
      credit_basis: reinstatement_reversal when the charge reverses a cancellation credit at reinstatement, none for an endorsement charge.
      amount: Prorated additional premium.
      posted_date: Date charged.
    account: premium_balance
    direction: in
    triggers: []
  - type: home_return_premium
    target: home_billing
    meaning: Unearned premium is credited, from a premium-reducing endorsement or from a cancellation.
    grain: One row per endorsement credit or per cancellation credit.
    distinguish_by: [source_endorsement_id, credit_basis, posted_date]
    fields:
      source_endorsement_id: The endorsement credited; empty for a cancellation credit.
      credit_basis: Basis of the credit (pro_rata, short_rate or flat).
      amount: Premium credited.
      posted_date: Date credited.
    account: premium_balance
    direction: out
    triggers: []
  - type: home_refund_issued
    target: home_billing
    meaning: A credit balance is paid back out to the payer entitled to it.
    grain: One row per refund disbursement.
    distinguish_by: [posted_date, payer]
    fields:
      amount: Amount refunded.
      payer: Who receives the refund (insured or mortgagee).
      payment_method: How the refund is sent.
      posted_date: Date the refund was issued.
    account: premium_balance
    direction: in
    triggers: []
  - type: home_mortgagee_invoice
    target: home_billing
    meaning: The full term premium is invoiced to the mortgagee for payment from escrow.
    grain: One row per mortgagee invoice per term.
    distinguish_by: [term_effective_date]
    fields:
      term_effective_date: Term invoiced.
      due_date: Date payment from escrow is due.
      amount: Amount invoiced.
      posted_date: Date the invoice was sent.
    triggers: []
  # ---------------- endorsements: home_endorsements ----------------
  - type: home_endorsement_added
    target: home_endorsements
    meaning: A midterm endorsement adds optional coverage or changes a limit or deductible.
    grain: One row per endorsement change effective on a date.
    distinguish_by: [endorsement_code, effective_date, coverage_value]
    fields:
      endorsement_code: Which coverage the endorsement adds or changes.
      request_date: Date the named insured requested the change.
      effective_date: Date the change takes effect.
      coverage_value: New limit or deductible set by the change.
      annual_premium_change: Full-year premium effect of the change.
      premium_direction: Whether the prorated effect is billed, credited or neither.
      prorated_premium: Prorated premium effect for the rest of the term.
    triggers:
      - event: home:home_additional_premium
        when: {premium_direction: additional}
        map: {source_endorsement_id: home_endorsement_id, amount: prorated_premium, credit_basis: none, posted_date: effective_date}
      - event: home:home_return_premium
        when: {premium_direction: return}
        map: {source_endorsement_id: home_endorsement_id, amount: prorated_premium, credit_basis: pro_rata, posted_date: effective_date}
      - event: home:home_coverage_updated
        when: {endorsement_code: coverage_a_change}
        map: {dwelling_limit: coverage_value}
      - event: home:home_coverage_updated
        when: {endorsement_code: coverage_c_change}
        map: {personal_property_limit: coverage_value}
      - event: home:home_coverage_updated
        when: {endorsement_code: liability_change}
        map: {liability_limit: coverage_value}
      - event: home:home_coverage_updated
        when: {endorsement_code: aop_deductible_change}
        map: {aop_deductible: coverage_value}
      - event: home:home_coverage_updated
        when: {endorsement_code: water_backup}
        map: {water_backup_limit: coverage_value}
  - type: home_endorsement_removed
    target: home_endorsements
    meaning: A purchased optional endorsement is removed midterm.
    grain: One row per endorsement removal effective on a date.
    distinguish_by: [endorsement_code, effective_date]
    fields:
      endorsement_code: Which optional coverage is removed.
      request_date: Date the named insured requested the removal.
      effective_date: Date the removal takes effect.
      coverage_value: Limit remaining after removal (the included limit, or 0).
      annual_premium_change: Full-year premium given back.
      premium_direction: Whether the prorated effect is credited or neither.
      prorated_premium: Prorated premium credited.
    triggers:
      - event: home:home_return_premium
        when: {premium_direction: return}
        map: {source_endorsement_id: home_endorsement_id, amount: prorated_premium, credit_basis: pro_rata, posted_date: effective_date}
      - event: home:home_coverage_updated
        when: {endorsement_code: water_backup}
        map: {water_backup_limit: coverage_value}
  # ---------------- inspections: home_inspections ----------------
  - type: home_inspection_ordered
    target: home_inspections
    meaning: An underwriting inspection of the premises is ordered from the inspection vendor.
    grain: One row per inspection order.
    distinguish_by: [inspection_type, event_date]
    fields:
      inspection_type: Kind of inspection ordered.
      event_date: Date ordered.
    triggers: []
  - type: home_inspection_completed
    target: home_inspections
    meaning: The inspection report is received; each finding is recorded, or a single clean result.
    grain: One row per finding on a completed inspection (a clean inspection records one row with finding none).
    distinguish_by: [inspection_type, event_date, finding_code]
    fields:
      inspection_type: Kind of inspection completed.
      event_date: Date the report was received.
      finding_code: Condition found.
    triggers:
      - event: home:home_condition_letter_issued
        when: {finding_code: {not: none}}
        map: {finding_code: finding_code, source_entry_id: home_inspection_entry_id, inspection_type: inspection_type, event_date: event_date}
  - type: home_condition_letter_issued
    target: home_inspections
    meaning: A letter asks the named insured to correct an inspection finding by a cure due date.
    grain: One row per finding letter.
    distinguish_by: [source_entry_id]
    fields:
      source_entry_id: The inspection finding the letter concerns.
      finding_code: Condition to correct.
      inspection_type: Inspection the finding came from.
      event_date: Date the letter was sent.
      cure_due_date: Last day to provide proof of correction.
    triggers: []
  - type: home_condition_cured
    target: home_inspections
    meaning: Proof that a finding was corrected (photos, invoice or re-inspection) is accepted.
    grain: One row per condition letter cured.
    distinguish_by: [source_entry_id]
    fields:
      source_entry_id: The condition letter cured.
      finding_code: Condition corrected.
      event_date: Date the proof was received.
    triggers:
      - event: home:home_property_updated
        when: {finding_code: roof_end_of_life}
        map: {}
  # ---------------- claims ledger: home_claims ----------------
  - type: home_claim_reported
    target: home_claims
    meaning: First notice of loss opens a claim number for one occurrence.
    grain: One row per claim (occurrence).
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number assigned at first notice.
      loss_date: Date of the occurrence as reported.
      peril: Cause of loss.
      entry_date: Date the claim was reported.
    triggers: []
  - type: home_claim_payment
    target: home_claims
    meaning: Claim money is issued for one coverage part of a claim.
    grain: One row per payment issued on a coverage part and property class.
    distinguish_by: [claim_number, coverage_part, property_class, payment_type, entry_date]
    fields:
      claim_number: Claim the payment belongs to.
      loss_date: Date of loss.
      peril: Cause of loss.
      coverage_part: Coverage part paid.
      property_class: Class of property paid (general, roof surfacing or a special-limit class).
      payment_type: Kind of payment.
      replacement_cost_amount: Replacement-cost value of the covered damage for this part and class.
      depreciation_amount: Depreciation on that replacement-cost value.
      deductible_applied: Deductible absorbed by this payment.
      roof_age_years: Roof age in whole years at the date of loss (roof surfacing payments; 0 otherwise).
      amount: Amount paid.
      payee: Who the payment is made out to.
      entry_date: Date issued.
    account: indemnity_paid
    direction: in
    triggers:
      - event: home:home_holdback_withheld
        when: {payment_type: acv_initial}
        map: {claim_number: claim_number, coverage_part: coverage_part, property_class: property_class, amount: depreciation_amount, source_entry_id: home_claim_entry_id, entry_date: entry_date}
  - type: home_claim_payment_voided
    target: home_claims
    meaning: An issued claim payment is voided before it is cashed (payee correction, lost or stale-dated check).
    grain: One row per voided payment.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim of the voided payment.
      source_entry_id: The payment voided.
      amount: Amount voided (the full payment).
      entry_date: Date voided.
    account: indemnity_paid
    direction: out
    triggers: []
  - type: home_holdback_withheld
    target: home_claims
    meaning: Recoverable depreciation is withheld from an actual-cash-value payment pending repair or replacement.
    grain: One row per actual-cash-value payment that withholds depreciation.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim of the holdback.
      coverage_part: Coverage part withheld on.
      property_class: Property class withheld on.
      source_entry_id: The actual-cash-value payment the holdback came from.
      amount: Depreciation withheld.
      entry_date: Date withheld (the date of the actual-cash-value payment).
    account: depreciation_holdback
    direction: in
    triggers: []
  - type: home_holdback_released
    target: home_claims
    meaning: Withheld depreciation is released after completed repair or replacement is documented.
    grain: One row per documented completion released against one holdback.
    distinguish_by: [source_entry_id, entry_date, incurred_amount]
    fields:
      claim_number: Claim of the release.
      coverage_part: Coverage part released on.
      property_class: Property class released on.
      source_entry_id: The holdback released against.
      incurred_amount: Documented cost actually incurred to repair or replace.
      amount: Depreciation released.
      entry_date: Date the proof was accepted.
    account: depreciation_holdback
    direction: out
    triggers:
      - event: home:home_claim_payment
        map: {claim_number: claim_number, coverage_part: coverage_part, property_class: property_class, payment_type: recoverable_depreciation, amount: amount, entry_date: entry_date}
  - type: home_holdback_forfeited
    target: home_claims
    meaning: Withheld depreciation still unreleased when the recovery period ends is forfeited.
    grain: One row per holdback forfeited.
    distinguish_by: [source_entry_id]
    fields:
      claim_number: Claim of the forfeiture.
      coverage_part: Coverage part.
      source_entry_id: The holdback forfeited.
      amount: Remaining holdback forfeited.
      entry_date: Date forfeited.
    account: depreciation_holdback
    direction: out
    triggers: []
  - type: home_claim_denied
    target: home_claims
    meaning: Coverage is denied for one coverage part of a claim, with a controlled denial reason.
    grain: One row per coverage part denied on a claim.
    distinguish_by: [claim_number, coverage_part, denial_reason]
    fields:
      claim_number: Claim denied.
      loss_date: Date of loss.
      peril: Cause of loss.
      coverage_part: Coverage part denied.
      denial_reason: Why coverage is denied.
      entry_date: Date of the denial letter.
    triggers: []
  - type: home_claim_closed
    target: home_claims
    meaning: The claim file is closed.
    grain: One row per closing of a claim.
    distinguish_by: [claim_number, entry_date]
    fields:
      claim_number: Claim closed.
      entry_date: Date closed.
    triggers: []
  - type: home_claim_reopened
    target: home_claims
    meaning: A closed claim is reopened for supplemental damage from the same occurrence.
    grain: One row per reopening of a claim.
    distinguish_by: [claim_number, entry_date]
    fields:
      claim_number: Claim reopened.
      entry_date: Date reopened.
    triggers: []

measures:
  - id: home_msr_non_weather_paid_claims
    window: The claims_lookback_months calendar months ending on the evaluation date (the bound date at binding, the notice date at nonrenewal) — payment entries whose entry_date is later than the evaluation date minus claims_lookback_months calendar months and on or before the evaluation date.
    measure: Count of distinct claim_number values, across every home policy in the customer's name (live or ended), that have at least one home_claim_payment entry in the window not reversed by a home_claim_payment_voided entry, excluding claims whose peril is wind_hail or lightning.
  - id: home_msr_water_paid_claims
    window: Same window as home_msr_non_weather_paid_claims.
    measure: Count of distinct claim_number values, across every home policy in the customer's name, that have at least one unvoided home_claim_payment entry in the window and whose peril is water_sudden_accidental, water_repeated_seepage, water_backup or freeze.
  - id: home_msr_fee_waivers_12m
    window: Rolling 12 calendar months ending on the waiver date — posted_date later than the waiver date minus 12 calendar months and on or before the waiver date.
    measure: Count of home_fee_waived entries on the policy in the window.
  - id: home_msr_returned_payments_12m
    window: Rolling 12 calendar months ending on the return date — posted_date later than the return date minus 12 calendar months and on or before the return date.
    measure: Count of home_payment_returned entries on the policy in the window, including the one being posted.
  - id: home_msr_amount_due
    window: All entries of the policy up to and including the evaluation date.
    measure: Sum of home_premium_billed amounts whose due_date is on or before the evaluation date, plus home_fee_assessed, home_payment_returned, home_additional_premium and home_refund_issued amounts posted on or before it, minus home_payment_received, home_fee_waived and home_return_premium amounts posted on or before it, floored at 0.00.
  - id: home_msr_term_sublimit_paid
    window: The policy term containing the date of loss (term effective date through expiration date).
    measure: For one sublimited coverage part (hidden_water or mold), the home_claim_payment amounts on the policy whose loss_date falls in the term, minus home_claim_payment_voided amounts of those payments.

policies:
  - id: home_agg_multi_holding
    subject: [home_policy_bound]
    rule: >-
      A customer may hold several HomeGuard policies, one per residence premises, counted across every policy in the customer's name by customer profile.
      Only policies that are bound, in force, pending cancellation or pending nonrenewal count; cancelled and expired policies do not.
      The customer holds fewer live homeowners policies than the multi-holding cap before the new policy is bound.
      At most max_primary_residences of those live policies may carry occupancy primary; every other live policy must be a secondary or seasonal residence.
      When the cap is reached the application is declined, and a live policy must first end before another is bound.
    eligibility:
      - id: live_policy_cap
        applies_to: [home_policy_bound]
        kind: authorization
        condition: "The customer holds fewer live homeowners policies than the multi-holding cap before the new policy is bound."
        evidence_fields: [home_policies.customer_id, home_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.customer_id]]
          action_bindings: {home_policies.customer_id: customer_id}
    params: {max_per_customer: 3, max_primary_residences: 1}

  - id: home_agg_portfolio_claims_history
    subject: [home_policy_bound, home_nonrenewal_noticed]
    rule: >-
      Claims history is judged on the customer, not on a single policy: home_msr_non_weather_paid_claims and home_msr_water_paid_claims are taken across every HomeGuard policy in the customer's name, live or ended.
      A claim counts once, by claim number, as soon as it has at least one issued payment that was not voided; claims closed without payment, fully denied claims and claims whose only payments were voided never count.
      Wind/hail and lightning claims are weather claims and never count toward the non-weather count; water claims count toward both counts.
      At binding the non-weather count is compared with the tier's entry gate; at nonrenewal both counts are compared with the policy's own tier thresholds under home_nonrenewal.
      Claims on condominium, renters, landlord or flood policies never count toward HomeGuard claims history.
    eligibility: []
    measures: [home_msr_non_weather_paid_claims, home_msr_water_paid_claims]

  - id: home_bind_eligibility
    subject: [home_policy_bound, home_policy_activated]
    rule: >-
      A new HomeGuard policy is bound only on a tier whose entry gate the applicant meets.
      Coverage A is set within min_coverage_a and max_coverage_a; Coverage C defaults to personal_property_pct of Coverage A rounded up to the next 1,000 USD; Coverage E must be one of liability_limit_options; the all-other-perils deductible must be one of aop_deductible_options and the wind/hail percentage one of wind_hail_deductible_pct_options; water_backup_limit starts at water_backup_included_limit.
      Roof age is the calendar year of the effective date minus roof_install_year.
      roof_settlement is replacement_cost when that roof age is at or below roof_rc_max_age_years or the roof_material is listed in roof_schedule_exempt_materials, and roof_surfacing_schedule otherwise.
      The roof age at the effective date is at or below the tier's maximum roof age for new business.
      The dwelling age at the effective date is at or below the tier's maximum home age for new business.
      Dwelling age is the calendar year of the effective date minus year_built.
      The billing plan must be one of billing_plans_allowed, and mortgagee_escrow requires a mortgagee name and loan number on the application.
      No other homeowners policy that is bound, in force, pending cancellation or pending nonrenewal covers the same property address.
      A homeowners policy is never bound on a condominium unit, which is insured on a CondoGuard policy instead; where the customer holds a live RentGuard renters policy at the same address, that renters policy must end no later than the homeowners effective date, because one residence is never insured under both at once.
      The term runs twelve calendar months from the effective date, and original_effective_date equals effective_date on a new policy.
      A bound policy moves to in_force on its effective date; a policy bound with an effective date equal to the bound date is in force the same day.
    eligibility:
      - id: roof_age_new_business
        applies_to: [home_policy_bound]
        kind: caller_fact
        condition: "The roof age at the effective date is at or below the tier's maximum roof age for new business."
        evidence_fields: [home_policies.roof_install_year, home_policies.effective_date, home_policies.customer_id, home_policies.property_address]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[home_policies.customer_id, home_policies.property_address]]
          action_bindings: {home_policies.customer_id: customer_id, home_policies.property_address: property_address}
      - id: home_age_new_business
        applies_to: [home_policy_bound]
        kind: caller_fact
        condition: "The dwelling age at the effective date is at or below the tier's maximum home age for new business."
        evidence_fields: [home_policies.year_built, home_policies.effective_date, home_policies.customer_id, home_policies.property_address]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[home_policies.customer_id, home_policies.property_address]]
          action_bindings: {home_policies.customer_id: customer_id, home_policies.property_address: property_address}
      - id: premises_not_already_insured
        applies_to: [home_policy_bound]
        kind: dedup
        condition: "No other homeowners policy that is bound, in force, pending cancellation or pending nonrenewal covers the same property address."
        evidence_fields: [home_policies.property_address, home_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.property_address]]
          action_bindings: {home_policies.property_address: property_address}
        dedup_contract:
          table: home_policies
          mode: separate_record
          object_bindings: {property_address: property_address}
          duplicate_filters: {status: [bound, in_force, pending_cancellation, pending_nonrenewal]}
          distinct_fields: []

  - id: home_premium_billing
    subject: [home_premium_billed, home_mortgagee_invoice]
    rule: >-
      Each term's premium is billed on the installment schedule of the policy's billing plan, using installments_per_plan and interval_months_per_plan.
      Installment 1 is due on the term effective date and each later installment is due the plan's interval of calendar months after the previous due date, falling back to the last day of the month when that day does not exist.
      Each later installment equals the term premium divided by the plan's installment count, rounded half-up to the cent, and installment 1 takes the difference so the installments add up exactly to the term premium.
      Installment 1 of a new policy is posted on the bound date; installment 1 of a renewal is posted renewal_offer_lead_days before the expiration date of the expiring term; every later installment is posted bill_lead_days before its due date.
      Under mortgagee_escrow the whole term premium is billed as one installment with payer mortgagee, and a mortgagee invoice for the same amount and due date is sent at the same time; no installment fee, late fee or returned-payment fee applies to a mortgagee-billed term.
      Installments are billed only while the policy is bound, in force, pending cancellation or pending nonrenewal.
      An installment that has already been billed for the same term and installment number is never billed again.
    eligibility:
      - id: billable_status
        applies_to: [home_premium_billed]
        kind: state
        condition: "Installments are billed only while the policy is bound, in force, pending cancellation or pending nonrenewal."
        evidence_fields: [home_policies.status, home_policies.home_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}
        state_contract:
          field: home_policies.status
          allowed: [bound, in_force, pending_cancellation, pending_nonrenewal]
      - id: installment_billed_once
        applies_to: [home_premium_billed]
        kind: dedup
        condition: "An installment that has already been billed for the same term and installment number is never billed again."
        evidence_fields: [home_billing.home_policy_id, home_billing.term_effective_date, home_billing.installment_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_billing.home_policy_id, home_billing.term_effective_date, home_billing.installment_number]]
          action_bindings: {home_billing.home_policy_id: home_policy_id, home_billing.term_effective_date: term_effective_date, home_billing.installment_number: installment_number}
        dedup_contract:
          table: home_billing
          mode: separate_record
          object_bindings: {home_policy_id: home_policy_id, term_effective_date: term_effective_date, installment_number: installment_number}
          duplicate_filters: {event_type: [home_premium_billed]}
          distinct_fields: []
    params:
      installments_per_plan: {annual: 1, two_pay: 2, quarterly: 4, monthly_eft: 12, mortgagee_escrow: 1}
      interval_months_per_plan: {annual: 0, two_pay: 6, quarterly: 3, monthly_eft: 1, mortgagee_escrow: 0}
      bill_lead_days: 20
    formula:
      later_installment: "round(term_premium / installments_per_plan, 2)"
      first_installment: "term_premium - (installments_per_plan - 1) * later_installment"

  - id: home_fees_and_waivers
    subject: [home_fee_assessed, home_fee_waived]
    rule: >-
      Four fees exist and each is charged only as stated here.
      The installment fee is charged on each installment after the first: installment_fee_eft on the monthly_eft plan and installment_fee_direct on the two_pay and quarterly plans; annual and mortgagee_escrow terms carry no installment fee.
      A late fee is charged once per installment.
      A late fee is charged only when the installment is still unpaid after the late-fee grace period that starts on the installment due date.
      The late-fee grace period is counted in calendar days from the due date, so the late fee may be posted from the day after the due date plus late_fee_grace_days.
      An installment is still unpaid when home_msr_amount_due on that day still includes any part of it, payments having been applied to the oldest charge first.
      The returned-payment fee is charged once for each payment returned by the bank, referencing that returned-payment entry.
      The reinstatement fee is charged once when a cancelled policy is reinstated.
      A fee whose tier amount is 0.00 is not charged at all, and no late fee or returned-payment fee is ever charged on a mortgagee-billed term.
      On the named insured's request a late fee or returned-payment fee may be waived as a courtesy.
      A courtesy waiver is granted only while the policy's waivers in the rolling 12 months are fewer than the tier's courtesy waiver allowance.
      A fee that has already been waived is never waived again.
      Installment fees and reinstatement fees are never waived, and a waiver always removes the full amount of the one fee entry it references.
    eligibility:
      - id: late_fee_grace
        applies_to: [home_fee_assessed]
        kind: time
        condition: "A late fee is charged only when the installment is still unpaid after the late-fee grace period that starts on the installment due date."
        evidence_fields: [home_billing.due_date, home_billing.term_effective_date, home_billing.installment_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_billing.term_effective_date, home_billing.installment_number]]
          action_bindings: {home_billing.term_effective_date: term_effective_date, home_billing.installment_number: installment_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: the installment due date
          anchor_source: home_billing.due_date
          relation: not_before
          duration_source: variants.late_fee_grace_days
          unit: calendar_days
          counting_rule: "The late-fee grace period is counted in calendar days from the due date, so the late fee may be posted from the day after the due date plus late_fee_grace_days."
          boundary: exclusive
      - id: courtesy_allowance
        applies_to: [home_fee_waived]
        kind: authorization
        condition: "A courtesy waiver is granted only while the policy's waivers in the rolling 12 months are fewer than the tier's courtesy waiver allowance."
        evidence_fields: [home_billing.home_policy_id, home_billing.event_type, home_billing.posted_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_billing.home_policy_id]]
          action_bindings: {home_billing.home_policy_id: home_policy_id}
      - id: fee_waived_once
        applies_to: [home_fee_waived]
        kind: dedup
        condition: "A fee that has already been waived is never waived again."
        evidence_fields: [home_billing.source_billing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_billing.source_billing_id]]
          action_bindings: {home_billing.source_billing_id: source_billing_id}
        dedup_contract:
          table: home_billing
          mode: separate_record
          object_bindings: {source_billing_id: source_billing_id}
          duplicate_filters: {event_type: [home_fee_waived]}
          distinct_fields: []
    measures: [home_msr_fee_waivers_12m, home_msr_amount_due]

  - id: home_payment_application
    subject: [home_payment_received, home_payment_returned, home_billing_plan_changed]
    rule: >-
      A payment is applied to the policy balance, oldest charge first, and is recorded with its confirmation or check number exactly as issued.
      While eft_suspended is true, payments by eft or check are not accepted; only card payments or a mortgagee check are accepted.
      A returned payment reverses the one payment entry it references for that payment's full amount.
      A payment that has already been returned is never returned again.
      When home_msr_returned_payments_12m reaches returned_payment_limit_12m, eft_suspended is set to true for the rest of the term, and a policy on monthly_eft is moved to quarterly when the tier allows quarterly and to two_pay otherwise; eft_suspended resets to false at the next renewal.
      A named-insured request to change billing plan is accepted only for a plan in billing_plans_allowed, never to monthly_eft while eft_suspended is true, and never into or out of mortgagee_escrow midterm, which waits for renewal.
      On a plan change the unbilled remainder of the term premium is re-spread evenly over the installments of the new plan whose due dates fall after the change date.
      A billing-plan change is made only while the policy is in force or pending nonrenewal.
    eligibility:
      - id: eft_suspension
        applies_to: [home_payment_received]
        kind: authorization
        condition: "While eft_suspended is true, payments by eft or check are not accepted; only card payments or a mortgagee check are accepted."
        evidence_fields: [home_policies.eft_suspended, home_policies.home_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}
      - id: payment_returned_once
        applies_to: [home_payment_returned]
        kind: dedup
        condition: "A payment that has already been returned is never returned again."
        evidence_fields: [home_billing.source_billing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_billing.source_billing_id]]
          action_bindings: {home_billing.source_billing_id: source_billing_id}
        dedup_contract:
          table: home_billing
          mode: separate_record
          object_bindings: {source_billing_id: source_billing_id}
          duplicate_filters: {event_type: [home_payment_returned]}
          distinct_fields: []
      - id: plan_change_status
        applies_to: [home_billing_plan_changed]
        kind: state
        condition: "A billing-plan change is made only while the policy is in force or pending nonrenewal."
        evidence_fields: [home_policies.status, home_policies.home_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}
        state_contract:
          field: home_policies.status
          allowed: [in_force, pending_nonrenewal]
    measures: [home_msr_returned_payments_12m]

  - id: home_nonpayment_cancellation
    subject: [home_cancellation_noticed, home_cancellation_rescinded, home_policy_cancelled]
    rule: >-
      A notice of cancellation for nonpayment is issued only when an installment has remained unpaid past the nonpayment notice period that starts on the installment due date.
      The nonpayment notice period is counted in calendar days from the due date, so the notice may be issued from the day after the due date plus nonpayment_notice_after_due_days.
      The scheduled cancellation date is the notice date plus nonpayment_cancel_notice_days calendar days, and never earlier than the notice date plus mortgagee_notice_days when a mortgagee is on file; the notice is copied to the mortgagee.
      The notice is rescinded only when payments received after the notice date and before the scheduled cancellation date total at least home_msr_amount_due as of the notice date.
      A partial payment does not rescind the notice.
      When the scheduled cancellation date arrives without that cure, the policy is cancelled effective that date with status_reason nonpayment, and the unearned premium is credited pro rata with no short-rate retention and no minimum earned premium.
      A payment received on or after the cancellation date does not rescind anything; it is applied to the balance and can only support a reinstatement under home_reinstatement.
    eligibility:
      - id: nonpayment_notice_period
        applies_to: [home_cancellation_noticed]
        kind: time
        condition: "A notice of cancellation for nonpayment is issued only when an installment has remained unpaid past the nonpayment notice period that starts on the installment due date."
        evidence_fields: [home_billing.due_date, home_billing.term_effective_date, home_billing.installment_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_billing.term_effective_date, home_billing.installment_number]]
          action_bindings: {home_billing.term_effective_date: term_effective_date, home_billing.installment_number: installment_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: the installment due date
          anchor_source: home_billing.due_date
          relation: not_before
          duration_source: variants.nonpayment_notice_after_due_days
          unit: calendar_days
          counting_rule: "The nonpayment notice period is counted in calendar days from the due date, so the notice may be issued from the day after the due date plus nonpayment_notice_after_due_days."
          boundary: exclusive
      - id: full_cure_received
        applies_to: [home_cancellation_rescinded]
        kind: authorization
        condition: "The notice is rescinded only when payments received after the notice date and before the scheduled cancellation date total at least home_msr_amount_due as of the notice date."
        evidence_fields: [home_billing.event_type, home_billing.amount, home_billing.posted_date, home_policies.pending_action_date, home_policies.home_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}
    measures: [home_msr_amount_due]

  - id: home_insured_cancellation
    subject: [home_policy_cancelled, home_return_premium, home_additional_premium]
    rule: >-
      The named insured may cancel at any time; the request is recorded and must be signed by the named insured before it is processed.
      The cancellation is processed only on a request the named insured has signed.
      The requested cancellation date is not earlier than the date the signed request is received.
      A requested date after the expiration date is not a cancellation; the policy is simply not renewed at the insured's direction.
      When the requested date is on or before the effective date of a policy that is still bound, the cancellation is flat: the whole term premium is credited with credit_basis flat and no minimum earned premium applies.
      Otherwise the current annual premium is term_premium plus the signed annual_premium_change of every endorsement of the term whose prorated premium was billed or credited, and the pro-rata unearned premium is that current annual premium multiplied by the calendar days from the cancellation date to the expiration date and divided by the calendar days in the term, rounded half-up to the cent.
      Under insured_cancel_basis pro_rata the whole unearned premium is returnable with credit_basis pro_rata; under short_rate the carrier keeps short_rate_retention_pct of it and the rest is returnable with credit_basis short_rate.
      The cancellation credit is the returnable amount minus the term's scheduled installments not yet billed, because unbilled installments are simply never billed.
      The credit is then reduced, if needed, so that the premium kept for the term (everything billed for the term minus the credit) is at least minimum_earned_premium.
      When the credit works out below 0.00, no credit is posted and the difference is billed as one home_additional_premium entry with credit_basis none, dated the cancellation date.
      A positive credit is posted as one home_return_premium entry dated the cancellation date, and any resulting credit balance is refunded under home_refunds_and_mortgagee.
      The mortgagee, when on file, is notified of the cancellation.
      A carrier-initiated cancellation (nonpayment, uncured condition, material misrepresentation or substantial hazard increase) always credits pro rata with no retention and no minimum earned premium.
    eligibility:
      - id: signed_request
        applies_to: [home_policy_cancelled]
        kind: authorization
        condition: "The cancellation is processed only on a request the named insured has signed."
        evidence_fields: [home_requests.home_request_id, home_requests.request_type, home_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_requests.home_request_id]]
          action_bindings: {home_requests.home_request_id: home_request_id}
      - id: no_backdating
        applies_to: [home_policy_cancelled]
        kind: caller_fact
        condition: "The requested cancellation date is not earlier than the date the signed request is received."
        evidence_fields: [home_requests.home_request_id, home_requests.requested_effective_date, home_requests.created_at]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[home_requests.home_request_id]]
          action_bindings: {home_requests.home_request_id: home_request_id}
    params:
      per_tier:
        HomeGuard HO-3 Essential: {basis: "=insured_cancel_basis", retention_pct: "=short_rate_retention_pct", minimum_earned: "=minimum_earned_premium"}
        HomeGuard HO-3 Enhanced: {basis: "=insured_cancel_basis", retention_pct: "=short_rate_retention_pct", minimum_earned: "=minimum_earned_premium"}
        HomeGuard HO-3 Premier: {basis: "=insured_cancel_basis", retention_pct: "=short_rate_retention_pct", minimum_earned: "=minimum_earned_premium"}
        HomeGuard HO-5 Enhanced: {basis: "=insured_cancel_basis", retention_pct: "=short_rate_retention_pct", minimum_earned: "=minimum_earned_premium"}
        HomeGuard HO-5 Premier: {basis: "=insured_cancel_basis", retention_pct: "=short_rate_retention_pct", minimum_earned: "=minimum_earned_premium"}
        HomeGuard HO-5 Signature: {basis: "=insured_cancel_basis", retention_pct: "=short_rate_retention_pct", minimum_earned: "=minimum_earned_premium"}

  - id: home_reinstatement
    subject: [home_policy_reinstated, home_additional_premium]
    rule: >-
      Only a policy cancelled for nonpayment can be reinstated.
      A policy cancelled at the insured's request or for an underwriting reason is never reinstated, and an expired policy follows home_renewal instead.
      The reinstatement request is made no later than the reinstatement window that starts on the cancellation date.
      The reinstatement window is counted in calendar days from the cancellation date recorded as closed_date, and a request on the last day of the window is on time.
      Before the policy is reinstated, the payments received since the cancellation date must cover home_msr_amount_due as of the request date plus the tier's reinstatement fee.
      The named insured has signed a statement of no loss covering the days since the cancellation date.
      A policy is reinstated at most once per term.
      Reinstatement is without a lapse: the original term and expiration date are unchanged, the reinstatement fee is charged, and the cancellation credit posted at cancellation is reversed by one home_additional_premium entry of the same amount with credit_basis reinstatement_reversal and no source endorsement, dated the reinstatement date.
    eligibility:
      - id: cancelled_for_nonpayment
        applies_to: [home_policy_reinstated]
        kind: authorization
        condition: "Only a policy cancelled for nonpayment can be reinstated."
        evidence_fields: [home_policies.status_reason, home_policies.home_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}
      - id: reinstatement_window
        applies_to: [home_policy_reinstated]
        kind: time
        condition: "The reinstatement request is made no later than the reinstatement window that starts on the cancellation date."
        evidence_fields: [home_policies.closed_date, home_policies.home_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the cancellation date
          anchor_source: home_policies.closed_date
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: "The reinstatement window is counted in calendar days from the cancellation date recorded as closed_date, and a request on the last day of the window is on time."
          boundary: inclusive
      - id: no_loss_statement
        applies_to: [home_policy_reinstated]
        kind: authorization
        condition: "The named insured has signed a statement of no loss covering the days since the cancellation date."
        evidence_fields: [home_requests.home_request_id, home_requests.request_type, home_requests.outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_requests.home_request_id]]
          action_bindings: {home_requests.home_request_id: home_request_id}
      - id: once_per_term
        applies_to: [home_policy_reinstated]
        kind: dedup
        condition: "A policy is reinstated at most once per term."
        evidence_fields: [home_billing.home_policy_id, home_billing.term_effective_date, home_billing.credit_basis]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_billing.home_policy_id, home_billing.term_effective_date]]
          action_bindings: {home_billing.home_policy_id: home_policy_id, home_billing.term_effective_date: term_effective_date}
        dedup_contract:
          table: home_billing
          mode: separate_record
          object_bindings: {home_policy_id: home_policy_id, term_effective_date: term_effective_date}
          duplicate_filters: {credit_basis: [reinstatement_reversal]}
          distinct_fields: []
    measures: [home_msr_amount_due]

  - id: home_endorsements
    subject: [home_endorsement_added, home_endorsement_removed, home_coverage_updated, home_additional_premium, home_return_premium]
    rule: >-
      Endorsements are added or removed only while the policy is bound, in force or pending nonrenewal.
      A midterm change takes effect no earlier than the date the named insured requests it and before the expiration date.
      water_backup is bought in water_backup_step increments above water_backup_included_limit up to water_backup_max_limit, and coverage_value records the new total water backup limit; service_line, equipment_breakdown and identity_fraud may be bought only when the tier's included limit for that coverage is 0, at the tier's endorsement limit.
      coverage_a_change must stay within min_coverage_a and max_coverage_a; coverage_c_change must stay between coverage_c_floor_pct and coverage_c_ceiling_pct of Coverage A; liability_change must land on one of liability_limit_options; aop_deductible_change must land on one of aop_deductible_options.
      Wind/hail deductible percentages change only at renewal, and coverages included in the tier package can never be removed; only purchased water backup limit, service line, equipment breakdown and identity fraud endorsements can be removed.
      The annual premium change is water_backup_rate_per_5000 per water_backup_step bought or removed; the tier's annual premium for service_line, equipment_breakdown or identity_fraud; coverage_a_rate_per_1000 per 1,000 USD of Coverage A change; coverage_c_rate_per_1000 per 1,000 USD of Coverage C change; liability_step_annual_premium per step moved along liability_limit_options; and for a deductible change, term_premium multiplied by the new deductible's factor minus the old deductible's factor in deductible_credit_factors.
      The prorated premium is the annual change multiplied by the calendar days from the change effective date to the expiration date and divided by the calendar days in the term, rounded half-up to the cent.
      premium_direction is additional for an increase and return for a decrease, and none when the prorated amount is below min_premium_change, in which case nothing is billed or credited.
      term_premium is not restated midterm; the change reaches the next term through the renewal offer.
      Coverage increases are not accepted while the policy has a claim that has been reported and not closed.
      A coverage increase is any raise of Coverage A, Coverage C, Coverage E or water backup limit, and any addition of service_line, equipment_breakdown or identity_fraud; deductible changes and removals are not increases.
      While the customer holds a live Larkspur Personal Umbrella that schedules this policy as underlying, Coverage E is never lowered below the umbrella's required underlying homeowners liability limit.
    eligibility:
      - id: endorsable_status
        applies_to: [home_endorsement_added, home_endorsement_removed]
        kind: state
        condition: "Endorsements are added or removed only while the policy is bound, in force or pending nonrenewal."
        evidence_fields: [home_policies.status, home_policies.home_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}
        state_contract:
          field: home_policies.status
          allowed: [bound, in_force, pending_nonrenewal]
      - id: no_backdated_change
        applies_to: [home_endorsement_added, home_endorsement_removed]
        kind: caller_fact
        condition: "A midterm change takes effect no earlier than the date the named insured requests it and before the expiration date."
        evidence_fields: [home_endorsements.request_date, home_endorsements.effective_date, home_policies.expiration_date, home_policies.home_policy_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}
      - id: open_claim_freeze
        applies_to: [home_endorsement_added]
        kind: authorization
        condition: "Coverage increases are not accepted while the policy has a claim that has been reported and not closed."
        evidence_fields: [home_claims.home_policy_id, home_claims.claim_number, home_claims.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_claims.home_policy_id]]
          action_bindings: {home_claims.home_policy_id: home_policy_id}
      - id: umbrella_underlying_floor
        applies_to: [home_endorsement_added]
        kind: authorization
        condition: "While the customer holds a live Larkspur Personal Umbrella that schedules this policy as underlying, Coverage E is never lowered below the umbrella's required underlying homeowners liability limit."
        evidence_fields: [umbrella_policies.status, umbrella_policies.customer_id, umbrella_underlying.underlying_policy_number, umbrella_underlying.underlying_line]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[umbrella_policies.customer_id]]
          action_bindings: {umbrella_policies.customer_id: customer_id}
    params:
      water_backup_step: 5000
      coverage_c_floor_pct: 40
      coverage_c_ceiling_pct: 100
      coverage_c_rate_per_1000: 3.15
      deductible_credit_factors: {"500": 0.06, "1000": 0.00, "2500": -0.11, "5000": -0.19, "10000": -0.27, "25000": -0.36}
    formula:
      water_backup_annual_change: "water_backup_rate_per_5000 * abs(coverage_value - water_backup_limit) / water_backup_step"
      coverage_a_annual_change: "coverage_a_rate_per_1000 * abs(coverage_value - dwelling_limit) / 1000"
      coverage_c_annual_change: "coverage_c_rate_per_1000 * abs(coverage_value - personal_property_limit) / 1000"

  - id: home_inspections_and_conditions
    subject: [home_inspection_ordered, home_inspection_completed, home_condition_letter_issued, home_condition_cured, home_property_updated]
    rule: >-
      Every new policy receives one new-business inspection of the tier's new_business_inspection_type, ordered no later than inspection_order_days after the bound date; a roof_reinspection is ordered only when the named insured reports a roof replacement.
      Inspections are ordered only while the policy is bound or in force.
      Each finding other than none receives exactly one condition letter, whose cure due date is the inspection completion date plus inspection_cure_days calendar days.
      A condition is cured only when the proof of correction is received no later than the cure due date that follows the inspection completion date.
      The cure period is counted in calendar days from the inspection completion date, and proof received on the cure due date itself is on time.
      Proof is photographs or a contractor invoice for hazard findings (trampoline_unfenced, pool_unfenced, uncertified_wood_stove, missing_stair_handrail, debris_hazard, roof_defect) and a completed roof_reinspection or a licensed electrician's certificate for eligibility findings (roof_end_of_life, knob_and_tube_wiring, fuse_panel).
      A condition that has already been cured is never cured again.
      When a roof_end_of_life finding is cured by a new roof, roof_material and roof_install_year are updated to the new roof and roof_settlement becomes replacement_cost for the rest of the term.
      A finding left uncured after its cure due date is an underwriting ground: inside the new business period it supports cancellation under home_underwriting_cancellation, and afterwards it supports nonrenewal under home_nonrenewal.
      An inspection finding, cured or not, never changes how a claim is paid.
    eligibility:
      - id: order_status
        applies_to: [home_inspection_ordered]
        kind: state
        condition: "Inspections are ordered only while the policy is bound or in force."
        evidence_fields: [home_policies.status, home_policies.home_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}
        state_contract:
          field: home_policies.status
          allowed: [bound, in_force]
      - id: cure_deadline
        applies_to: [home_condition_cured]
        kind: time
        condition: "A condition is cured only when the proof of correction is received no later than the cure due date that follows the inspection completion date."
        evidence_fields: [home_inspections.event_date, home_inspections.cure_due_date, home_inspections.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_inspections.source_entry_id]]
          action_bindings: {home_inspections.source_entry_id: source_entry_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the inspection completion date
          anchor_source: home_inspections.event_date
          relation: not_after
          duration_source: variants.inspection_cure_days
          unit: calendar_days
          counting_rule: "The cure period is counted in calendar days from the inspection completion date, and proof received on the cure due date itself is on time."
          boundary: inclusive
      - id: cured_once
        applies_to: [home_condition_cured]
        kind: dedup
        condition: "A condition that has already been cured is never cured again."
        evidence_fields: [home_inspections.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_inspections.source_entry_id]]
          action_bindings: {home_inspections.source_entry_id: source_entry_id}
        dedup_contract:
          table: home_inspections
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [home_condition_cured]}
          distinct_fields: []

  - id: home_underwriting_cancellation
    subject: [home_cancellation_noticed, home_policy_cancelled]
    rule: >-
      Inside the new business period the carrier may cancel for an inspection finding left uncured after its cure due date or for material misrepresentation on the application.
      An underwriting cancellation notice for an uncured condition is issued only within the new business period that starts on the original effective date.
      The new business period is counted in calendar days with the original effective date as day 1, so the last day to issue the notice is the original effective date plus new_business_period_days minus 1.
      After the new business period the carrier cancels midterm only for material misrepresentation or a substantial increase in hazard documented by an inspection; an uncured condition then waits for nonrenewal.
      The scheduled cancellation date is the notice date plus underwriting_cancel_notice_days calendar days, and the notice is copied to the mortgagee.
      An underwriting notice for an uncured condition is rescinded when the condition is cured before the scheduled cancellation date; a misrepresentation or hazard notice is never rescinded.
      Unearned premium on an underwriting cancellation is credited pro rata with no retention and no minimum earned premium.
    eligibility:
      - id: new_business_period
        applies_to: [home_cancellation_noticed]
        kind: time
        condition: "An underwriting cancellation notice for an uncured condition is issued only within the new business period that starts on the original effective date."
        evidence_fields: [home_policies.original_effective_date, home_policies.home_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the original effective date
          anchor_source: home_policies.original_effective_date
          relation: not_after
          duration_source: variants.new_business_period_days
          unit: calendar_days
          counting_rule: "The new business period is counted in calendar days with the original effective date as day 1, so the last day to issue the notice is the original effective date plus new_business_period_days minus 1."
          boundary: exclusive

  - id: home_nonrenewal
    subject: [home_nonrenewal_noticed, home_nonrenewal_rescinded, home_policy_expired]
    rule: >-
      The carrier nonrenews a policy only on one of three grounds, judged on the notice date: a condition finding left uncured past its cure due date (uncured_condition); home_msr_non_weather_paid_claims at or above paid_claims_nonrenewal_threshold (claim_frequency); or home_msr_water_paid_claims at or above water_claims_nonrenewal_threshold (water_claim_frequency).
      When several grounds hold, status_reason records the first of them in that order.
      Weather claims alone are never a ground, and a single claim is never a ground.
      A notice of nonrenewal is valid only when it is issued no later than the nonrenewal notice deadline before the expiration date.
      The nonrenewal notice deadline is the expiration date minus nonrenewal_notice_days calendar days, and a notice issued on the deadline itself is on time.
      A ground found after the deadline cannot be acted on this term: the policy is renewed and the ground is reconsidered for the following term.
      A notice of nonrenewal is rescinded before the expiration date only when its ground is uncured_condition and that condition has since been cured.
      Claim-frequency grounds can never be cured.
      On the expiration date a policy under a notice of nonrenewal expires and keeps its status_reason.
    eligibility:
      - id: notice_deadline
        applies_to: [home_nonrenewal_noticed]
        kind: time
        condition: "A notice of nonrenewal is valid only when it is issued no later than the nonrenewal notice deadline before the expiration date."
        evidence_fields: [home_policies.expiration_date, home_policies.home_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the expiration date
          anchor_source: home_policies.expiration_date
          relation: not_after
          duration_source: variants.nonrenewal_notice_days
          unit: calendar_days
          counting_rule: "The nonrenewal notice deadline is the expiration date minus nonrenewal_notice_days calendar days, and a notice issued on the deadline itself is on time."
          boundary: inclusive
      - id: curable_ground_only
        applies_to: [home_nonrenewal_rescinded]
        kind: authorization
        condition: "A notice of nonrenewal is rescinded before the expiration date only when its ground is uncured_condition and that condition has since been cured."
        evidence_fields: [home_policies.status_reason, home_policies.home_policy_id, home_inspections.event_type, home_inspections.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}
    measures: [home_msr_non_weather_paid_claims, home_msr_water_paid_claims]

  - id: home_renewal
    subject: [home_policy_renewed, home_policy_expired, home_lapse_renewed]
    rule: >-
      A policy in force and not under a notice of nonrenewal is offered renewal: installment 1 of the renewal term is billed renewal_offer_lead_days before the expiration date at the renewal term premium produced by the rating system, which becomes term_premium when the policy renews.
      The policy renews on its expiration date for a new term of twelve calendar months when renewal installment 1 was paid in full on or before the expiration date; a mortgagee-billed policy renews on its mortgagee invoice.
      At renewal Coverage A becomes the expiring Coverage A increased by inflation_guard_pct, rounded up to the next 1,000 USD and capped at max_coverage_a; roof_settlement is re-evaluated with the roof age at the new effective date as in home_bind_eligibility; eft_suspended resets to false.
      When renewal installment 1 is unpaid at the end of the expiration date, the policy expires with status_reason renewal_not_paid.
      A late renewal payment is accepted only when it is received no later than the late-payment window that starts on the expiration date.
      The late-payment window is counted in calendar days from the expiration date, so the last day is the expiration date plus renewal_late_payment_days.
      The policy then renews with a lapse: the new term starts on the day the payment is received, there is no coverage between the expiration date and that day, and the new expiration date is twelve calendar months after the new effective date.
      A policy that expired under a notice of nonrenewal can never be renewed late.
    eligibility:
      - id: late_payment_window
        applies_to: [home_lapse_renewed]
        kind: time
        condition: "A late renewal payment is accepted only when it is received no later than the late-payment window that starts on the expiration date."
        evidence_fields: [home_policies.expiration_date, home_policies.home_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the expiration date
          anchor_source: home_policies.expiration_date
          relation: not_after
          duration_source: variants.renewal_late_payment_days
          unit: calendar_days
          counting_rule: "The late-payment window is counted in calendar days from the expiration date, so the last day is the expiration date plus renewal_late_payment_days."
          boundary: inclusive
      - id: not_nonrenewed
        applies_to: [home_lapse_renewed]
        kind: authorization
        condition: "A policy that expired under a notice of nonrenewal can never be renewed late."
        evidence_fields: [home_policies.status_reason, home_policies.home_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}

  - id: home_claim_reporting
    subject: [home_claim_reported, home_claim_denied]
    rule: >-
      A claim is opened for each occurrence the named insured reports, with the date of loss and cause of loss as reported; the claim number is assigned at first notice and every later entry of the claim carries it.
      The date of loss falls within a term during which the policy was in force.
      A loss dated before the original effective date, after the expiration or cancellation date, or inside a lapse gap between an expiration and a late renewal is denied with not_in_force_on_loss_date.
      A wind or hail claim is covered only when it is reported no later than the wind and hail reporting period that starts on the date of loss.
      The wind and hail reporting period is counted in calendar days from the date of loss, and a report on the last day is on time.
      A wind or hail claim reported after that period is denied with late_notice for every coverage part; other perils have no fixed reporting period.
      Surface water, flood and rising water are never covered by a HomeGuard policy and are denied with surface_water; flood is insured only under a separate FloodGuard policy.
      A claim number is never opened twice for the same occurrence.
    eligibility:
      - id: in_force_on_loss_date
        applies_to: [home_claim_reported]
        kind: caller_fact
        condition: "The date of loss falls within a term during which the policy was in force."
        evidence_fields: [home_claims.loss_date, home_policies.original_effective_date, home_policies.expiration_date, home_policies.closed_date, home_policies.home_policy_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}
      - id: hail_reporting_period
        applies_to: [home_claim_reported]
        kind: time
        condition: "A wind or hail claim is covered only when it is reported no later than the wind and hail reporting period that starts on the date of loss."
        evidence_fields: [home_claims.loss_date, home_claims.claim_number]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[home_claims.claim_number]]
          action_bindings: {home_claims.claim_number: claim_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of loss
          anchor_source: home_claims.loss_date
          relation: not_after
          duration_source: variants.hail_claim_report_days
          unit: calendar_days
          counting_rule: "The wind and hail reporting period is counted in calendar days from the date of loss, and a report on the last day is on time."
          boundary: inclusive
      - id: one_claim_per_occurrence
        applies_to: [home_claim_reported]
        kind: dedup
        condition: "A claim number is never opened twice for the same occurrence."
        evidence_fields: [home_claims.home_policy_id, home_claims.loss_date, home_claims.peril]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_claims.home_policy_id, home_claims.loss_date, home_claims.peril]]
          action_bindings: {home_claims.home_policy_id: home_policy_id, home_claims.loss_date: loss_date, home_claims.peril: peril}
        dedup_contract:
          table: home_claims
          mode: separate_record
          object_bindings: {home_policy_id: home_policy_id, loss_date: loss_date, peril: peril}
          duplicate_filters: {event_type: [home_claim_reported]}
          distinct_fields: []

  - id: home_claim_settlement
    subject: [home_claim_payment, home_holdback_withheld, home_claim_denied]
    rule: >-
      A payment is issued only on a claim number opened by first notice of loss.
      Each covered coverage part and property class of a claim is settled from its replacement-cost value (RC), its depreciation and the deductible.
      One deductible applies per occurrence: for peril wind_hail it is the larger of wind_hail_deductible_pct of Coverage A and wind_hail_deductible_minimum, and for every other peril it is the aop_deductible; it is absorbed first by dwelling, then other_structures, then personal_property, until used up.
      When the total covered RC of the occurrence is at or above deductible_waiver_threshold on a tier whose threshold is above 0, no deductible applies.
      When the covered RC of a coverage part does not exceed the deductible left for it to absorb, that part is denied with below_deductible.
      For dwelling and other_structures, and for personal_property on a replacement_cost tier, when RC is at or below rc_no_holdback_threshold the payment is replacement_cost_full, equal to RC minus the deductible absorbed; otherwise the first payment is acv_initial, equal to RC minus depreciation minus the deductible absorbed, and the depreciation is withheld in one home_holdback_withheld entry.
      For personal_property on an actual_cash_value tier the payment is actual_cash_value_final, equal to RC minus depreciation minus the deductible absorbed, and nothing is withheld.
      RC is capped at what remains of the part's limit: Coverage A for dwelling (plus extended_replacement_cost_pct of Coverage A on a total loss), other_structures_pct of Coverage A, personal_property_limit, and for theft of jewelry_watches_furs, firearms or money the special limits jewelry_theft_limit, firearms_theft_limit and money_limit.
      Loss of use is reimbursed as incurred with no deductible, up to loss_of_use_pct of Coverage A and for no longer than loss_of_use_max_months after the date of loss.
      A dwelling or other_structures payment at or above mortgagee_copayee_threshold is payable to insured_and_mortgagee when a mortgagee is on file; every other payment is payable to insured.
      Roof surfacing of a wind or hail claim is settled under home_roof_settlement and water losses under home_water_limitations before this arithmetic is applied.
    eligibility:
      - id: claim_opened
        applies_to: [home_claim_payment]
        kind: authorization
        condition: "A payment is issued only on a claim number opened by first notice of loss."
        evidence_fields: [home_claims.claim_number, home_claims.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_claims.claim_number]]
          action_bindings: {home_claims.claim_number: claim_number}
    params:
      per_tier:
        HomeGuard HO-3 Essential: {contents_basis: "=personal_property_settlement", no_holdback_up_to: "=rc_no_holdback_threshold", waiver_from: "=deductible_waiver_threshold"}
        HomeGuard HO-3 Enhanced: {contents_basis: "=personal_property_settlement", no_holdback_up_to: "=rc_no_holdback_threshold", waiver_from: "=deductible_waiver_threshold"}
        HomeGuard HO-3 Premier: {contents_basis: "=personal_property_settlement", no_holdback_up_to: "=rc_no_holdback_threshold", waiver_from: "=deductible_waiver_threshold"}
        HomeGuard HO-5 Enhanced: {contents_basis: "=personal_property_settlement", no_holdback_up_to: "=rc_no_holdback_threshold", waiver_from: "=deductible_waiver_threshold"}
        HomeGuard HO-5 Premier: {contents_basis: "=personal_property_settlement", no_holdback_up_to: "=rc_no_holdback_threshold", waiver_from: "=deductible_waiver_threshold"}
        HomeGuard HO-5 Signature: {contents_basis: "=personal_property_settlement", no_holdback_up_to: "=rc_no_holdback_threshold", waiver_from: "=deductible_waiver_threshold"}
    formula:
      wind_hail_deductible: "max(wind_hail_deductible_pct / 100 * dwelling_limit, wind_hail_deductible_minimum)"
      acv_initial_payment: "replacement_cost_amount - depreciation_amount - deductible_applied"
      replacement_cost_full_payment: "replacement_cost_amount - deductible_applied"
      holdback: "depreciation_amount"

  - id: home_roof_settlement
    subject: [home_claim_payment, home_claim_denied, home_property_updated, home_policy_renewed]
    rule: >-
      Roof surfacing damage from wind or hail on the dwelling is paid with property_class roof_surfacing, and its roof age is the calendar year of the date of loss minus roof_install_year, recorded as roof_age_years.
      When the policy's roof_settlement is replacement_cost, roof surfacing settles like the rest of the dwelling under home_claim_settlement.
      When roof_settlement is roof_surfacing_schedule, roof surfacing is paid once as payment_type roof_schedule: RC multiplied by the roof_payment_schedule percentage for the roof age band, minus the deductible it absorbs; nothing is withheld and no depreciation is ever recoverable on it, while the rest of the dwelling damage still settles under home_claim_settlement.
      On a tier whose cosmetic_roof_hail_exclusion is true, hail dents to a metal roof that do not let water in are denied with cosmetic_damage; on other tiers they are paid.
      Wear, tear and deterioration of a roof is never covered and is denied with wear_and_tear.
      roof_settlement changes only at binding, at renewal and after a documented roof replacement, never because of a claim.
    eligibility: []
    params:
      roof_payment_schedule: {"0-10": 100, "11-12": 85, "13-14": 75, "15-16": 65, "17-18": 55, "19-20": 45, "21-24": 35, "25+": 25}

  - id: home_water_limitations
    subject: [home_claim_payment, home_claim_denied]
    rule: >-
      Water losses are classified by the peril on the claim.
      water_sudden_accidental and freeze damage settle under home_claim_settlement with the aop_deductible.
      Damage from continuous or repeated seepage or leakage lasting seepage_exclusion_days or more (peril water_repeated_seepage) is excluded, except that dwelling damage from a leak hidden inside walls, floors or ceilings is paid as coverage_part hidden_water up to hidden_water_limit per term; on a tier whose hidden_water_limit is 0 the whole seepage loss is denied with repeated_seepage, and the deteriorated plumbing itself is always denied with wear_and_tear.
      Water that backs up through sewers or drains or overflows a sump (peril water_backup) is paid as coverage_part water_backup only when the policy's water_backup_limit is above 0, up to that limit per occurrence after the aop_deductible; with no water backup limit it is denied with no_water_backup_coverage.
      Fungi, wet rot and bacteria remediation that results from a covered water loss is paid as coverage_part mold up to mold_limit in aggregate per term, measured by home_msr_term_sublimit_paid.
      Once a per-term sublimit is used up, further amounts under it are denied with sublimit_exhausted.
      Holdback applies to hidden_water, water_backup and mold payments exactly as to dwelling under home_claim_settlement.
    eligibility: []
    measures: [home_msr_term_sublimit_paid]
    formula:
      hidden_water_remaining: "hidden_water_limit - home_msr_term_sublimit_paid"
      mold_remaining: "mold_limit - home_msr_term_sublimit_paid"

  - id: home_depreciation_recovery
    subject: [home_holdback_released, home_holdback_forfeited, home_claim_payment]
    rule: >-
      Withheld depreciation is released only against documented completion of repair or replacement of the damaged property of that coverage part.
      The holdback is released only when the proof of completed repair or replacement is received no later than the depreciation recovery period that starts on the date of the initial actual-cash-value payment.
      The depreciation recovery period is counted in calendar days from the date of the initial actual-cash-value payment, so the last day is that date plus depreciation_recovery_days, and proof received on the last day is on time.
      The release equals the smaller of the holdback still remaining on that entry and the documented incurred cost (capped at the replacement-cost value) minus the actual cash value (RC minus depreciation), and is never below 0.00.
      Several partial releases may be made against one holdback as items are completed, each on its own proof, and each release issues a recoverable_depreciation payment under the same payee rule as the original payment.
      When the recovery period ends with holdback remaining, the remainder is forfeited in one home_holdback_forfeited entry.
      A holdback that has been forfeited can no longer be released.
    eligibility:
      - id: recovery_period
        applies_to: [home_holdback_released]
        kind: time
        condition: "The holdback is released only when the proof of completed repair or replacement is received no later than the depreciation recovery period that starts on the date of the initial actual-cash-value payment."
        evidence_fields: [home_claims.entry_date, home_claims.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_claims.source_entry_id]]
          action_bindings: {home_claims.source_entry_id: source_entry_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of the initial actual-cash-value payment
          anchor_source: home_claims.entry_date
          relation: not_after
          duration_source: variants.depreciation_recovery_days
          unit: calendar_days
          counting_rule: "The depreciation recovery period is counted in calendar days from the date of the initial actual-cash-value payment, so the last day is that date plus depreciation_recovery_days, and proof received on the last day is on time."
          boundary: inclusive
      - id: not_forfeited
        applies_to: [home_holdback_released, home_holdback_forfeited]
        kind: dedup
        condition: "A holdback that has been forfeited can no longer be released."
        evidence_fields: [home_claims.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_claims.source_entry_id]]
          action_bindings: {home_claims.source_entry_id: source_entry_id}
        dedup_contract:
          table: home_claims
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [home_holdback_forfeited]}
          distinct_fields: []
    formula:
      release_amount: "max(0, min(depreciation_holdback, min(incurred_amount, replacement_cost_amount) - (replacement_cost_amount - depreciation_amount)))"

  - id: home_claim_corrections
    subject: [home_claim_payment_voided, home_claim_closed, home_claim_reopened]
    rule: >-
      A claim payment is voided only when it has not been cashed and must be reissued: a payee correction after a mortgagee is added or removed, a lost check, or a check left uncashed stale_check_days after issue.
      A void always reverses one payment entry in full, referenced by source_entry_id.
      A payment that has already been voided is never voided again.
      The replacement is a new home_claim_payment with payment_type reissue for the same coverage part, property class and amount, dated the void date.
      A claim is closed when every reported coverage part has been paid or denied and no holdback on it remains; a claim with remaining holdback stays open until release or forfeiture.
      A closed claim is reopened for supplemental damage from the same occurrence only when the request is made no later than the reopen window that starts on the date the claim was closed.
      The reopen window is counted in calendar days from the closing date, so the last day is the closing date plus reopen_window_days.
      A later request for the same occurrence is declined, and damage from a new occurrence is a new claim.
    eligibility:
      - id: voided_once
        applies_to: [home_claim_payment_voided]
        kind: dedup
        condition: "A payment that has already been voided is never voided again."
        evidence_fields: [home_claims.source_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_claims.source_entry_id]]
          action_bindings: {home_claims.source_entry_id: source_entry_id}
        dedup_contract:
          table: home_claims
          mode: separate_record
          object_bindings: {source_entry_id: source_entry_id}
          duplicate_filters: {event_type: [home_claim_payment_voided]}
          distinct_fields: []
      - id: reopen_window
        applies_to: [home_claim_reopened]
        kind: time
        condition: "A closed claim is reopened for supplemental damage from the same occurrence only when the request is made no later than the reopen window that starts on the date the claim was closed."
        evidence_fields: [home_claims.entry_date, home_claims.claim_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_claims.claim_number]]
          action_bindings: {home_claims.claim_number: claim_number}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the claim was closed
          anchor_source: home_claims.entry_date
          relation: not_after
          duration_source: params.reopen_window_days
          unit: calendar_days
          counting_rule: "The reopen window is counted in calendar days from the closing date, so the last day is the closing date plus reopen_window_days."
          boundary: inclusive
    params: {stale_check_days: 180, reopen_window_days: 365}

  - id: home_refunds_and_mortgagee
    subject: [home_refund_issued, home_mortgagee_changed, home_mortgagee_invoice]
    rule: >-
      A refund is issued only when the policy's premium balance is a credit of at least the refund minimum.
      A smaller credit stays on the account and is applied to the next bill, or is written off when the policy has ended.
      The refund goes to the payer of the most recent payment: to the mortgagee by check when the mortgagee paid it, otherwise to the named insured by the method of that payment (eft back to the account, card back to the card, check by check).
      A mortgagee change is recorded only with both the new mortgagee's name and the loan number exactly as they appear on the mortgage statement.
      On a loan payoff both are cleared, and a policy on mortgagee_escrow moves to a direct billing plan at the next renewal.
      The mortgagee receives mortgagee_notice_days of advance notice of any cancellation and is invoiced for each term of a mortgagee-billed policy when installment 1 is billed.
    eligibility:
      - id: refundable_credit
        applies_to: [home_refund_issued]
        kind: authorization
        condition: "A refund is issued only when the policy's premium balance is a credit of at least the refund minimum."
        evidence_fields: [home_policies.premium_balance, home_policies.home_policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}
      - id: mortgagee_statement_details
        applies_to: [home_mortgagee_changed]
        kind: caller_fact
        condition: "A mortgagee change is recorded only with both the new mortgagee's name and the loan number exactly as they appear on the mortgage statement."
        evidence_fields: [home_policies.mortgagee_name, home_policies.loan_number, home_policies.home_policy_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[home_policies.home_policy_id]]
          action_bindings: {home_policies.home_policy_id: home_policy_id}

# ============================================================================
# extended_policies — difficulty home_claim_settlement (erl-task-instantiate)
# ============================================================================
extended_policies:
  - id: home_ext_roof_denial_reversal
    base_policy_refs: [home_claim_settlement, home_roof_settlement, home_water_limitations, home_depreciation_recovery]
    overwrite:
      - base_policy: home_roof_settlement
        superseded_clause: >-
          When roof_settlement is roof_surfacing_schedule, roof surfacing is paid once as payment_type roof_schedule: RC multiplied by the roof_payment_schedule percentage for the roof age band, minus the deductible it absorbs; nothing is withheld and no depreciation is ever recoverable on it, while the rest of the dwelling damage still settles under home_claim_settlement.
        replaced_by: >-
          Any code-upgrade, tear-off, matching or emergency tarping allowance is added to that figure and any deduction for earlier unrepaired roof damage is taken from it before the floor and the rounding.
      - base_policy: home_claim_settlement
        superseded_clause: >-
          For dwelling and other_structures, and for personal_property on a replacement_cost tier, when RC is at or below rc_no_holdback_threshold the payment is replacement_cost_full, equal to RC minus the deductible absorbed; otherwise the first payment is acv_initial, equal to RC minus depreciation minus the deductible absorbed, and the depreciation is withheld in one home_holdback_withheld entry.
        replaced_by: >-
          The reversal payment on the roof surfacing starts from the covered amount less the deductible the roof surfacing absorbs and less any roof surfacing money already issued on the claim; it is never below 0.00 and is rounded to the cent once, on the final figure.
    trigger: state_due
    subject: [home_claim_payment]
    computes: amount
    target_tool: settle_denied_roof_surfacing_b6cb399f
    params:
      code_age_years: 50
      code_ol_pct_floor: 25
      code_pct_full: 10
      code_pct_reduced: 5
      tearoff_pct_heavy: 8
      tearoff_pct_asphalt: 5
      tearoff_rc_floor: 10000
      prior_window_months: 36
      band_25_plus: 25
      band_21_24: 35
      band_19_20: 45
      band_17_18: 55
      band_15_16: 65
      band_13_14: 75
      band_11_12: 85
      band_0_10: 100
      matching_age_old: 20
      matching_age_mid: 10
      matching_pct_old: 10
      matching_pct_mid: 5
      tarp_days_vendor: 3
      tarp_days_own: 14
      tarp_fee_vendor: 450
      tarp_fee_own: 200
    rule: >-
      This policy re-settles the wind or hail roof surfacing damage of the most recently reported claim on a HomeGuard policy when that damage stands on the claim only as a below-deductible denial entry, and fixes the amount of the payment that replaces the denial.
      The claim concerned is the one whose first-notice entry is the latest on the policy; its date of loss, report date and cause of loss are those recorded on that first-notice entry.
      The replacement-cost value and the depreciation of the roof surfacing are the figures recorded on its below-deductible denial entry of that claim.
      The occurrence deductible is, for a wind or hail loss, the larger of the wind/hail percentage on the declarations applied to Coverage A and the tier's wind/hail deductible minimum, and for every other cause of loss the all-other-perils deductible on the declarations.
      No deductible applies when the replacement-cost values recorded on the claim's denial entries and on its payment entries that replace no denial together reach the tier's deductible waiver threshold on a tier whose threshold is above 0.
      Otherwise the roof surfacing absorbs the smaller of the occurrence deductible and its covered amount.
      The covered amount follows the roof surfacing settlement basis the declarations carry for the term: on the roof surfacing schedule it is the replacement-cost value multiplied by the schedule percentage for the roof's age band, and on replacement cost it is the full replacement-cost value when that value is at or below the tier's no-holdback threshold and otherwise the replacement-cost value less the recorded depreciation.
      The roof's age for the band is the calendar year of the date of loss minus the roof install year on the declarations.
      The schedule percentage is 25 for a roof aged 25 years or more, 35 for 21 to 24 years, 45 for 19 to 20 years, 55 for 17 to 18 years, 65 for 15 to 16 years, 75 for 13 to 14 years, 85 for 11 to 12 years and 100 for 0 to 10 years.
      A code-upgrade allowance is added at a percentage of the roof surfacing's replacement-cost value, with the dwelling's age counted in whole years from 1 January of the year built to the date of loss: 10 percent when the dwelling is at least 50 years old and the tier's ordinance-or-law percentage is at least 25, 5 percent when the dwelling is at least 50 years old and the tier's ordinance-or-law percentage is below 25, and no allowance for a dwelling younger than 50 years.
      A tear-off and disposal allowance is added at a percentage of the roof surfacing's replacement-cost value: 8 percent for a wood shake or tile/slate roof, 5 percent for an asphalt roof, three-tab or architectural, whose roof surfacing replacement-cost value is at least 10,000.00, and none for a metal roof, which is overlaid or salvaged, or for an asphalt roof below that value, which is repaired in sections without a full tear-off.
      A matching allowance is added so that the repaired roof presents a reasonably uniform appearance, because shingle lines on an older asphalt roof are no longer made and undamaged adjoining slopes must be replaced with the damaged ones: 10 percent of the roof surfacing's replacement-cost value for an asphalt roof at least 20 years old at the date of loss, 5 percent for an asphalt roof 10 to 19 years old, and none for a younger asphalt roof, whose shingles are still available, or for a roof of any other material.
      Emergency tarping is reimbursed by the whole days from the date of loss to the report date on the first notice: 450.00 when the loss was reported within 3 days, when the desk's emergency vendor tarps the roof at first notice, 200.00 when it was reported 4 to 14 days after the loss, the insured's own temporary covering reimbursed at the desk's standard rate, and nothing when it was reported later, past the emergency stage.
      Roof surfacing damage already paid on an earlier claim and never repaired is not paid twice: where roof surfacing money was issued on the policy on an earlier claim with a date of loss in the 36 months before the call and the depreciation withheld on it has been forfeited, the deduction is the roof surfacing money issued on it; where such money was issued and depreciation withheld on it still stands neither released nor forfeited, the deduction is that money plus the standing holdback, which the earlier claim may still pay; otherwise nothing is deducted.
      The reversal payment on the roof surfacing starts from the covered amount less the deductible the roof surfacing absorbs and less any roof surfacing money already issued on the claim; it is never below 0.00 and is rounded to the cent once, on the final figure.
      Any code-upgrade, tear-off, matching or emergency tarping allowance is added to that figure and any deduction for earlier unrepaired roof damage is taken from it before the floor and the rounding.
      The payment is roof_schedule when the declarations carry the roof surfacing schedule, replacement_cost_full when the covered amount is the full replacement-cost value, and acv_initial with the recorded depreciation withheld otherwise, and its payee follows the claim settlement payee rule.
    prerequisite: []
    cross_category: []
    compute:
      - cn: "LATEST('home_claims', 'claim_number', date_field='entry_date', event_type='home_claim_reported')"
      - loss_date: "LATEST('home_claims', 'loss_date', date_field='entry_date', event_type='home_claim_reported', claim_number=cn)"
      - peril: "LATEST('home_claims', 'peril', date_field='entry_date', event_type='home_claim_reported', claim_number=cn)"
      - rc: "SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_denied', coverage_part='dwelling', property_class='roof_surfacing', denial_reason='below_deductible', claim_number=cn)"
      - dep: "SUM('home_claims', 'depreciation_amount', event_type='home_claim_denied', coverage_part='dwelling', property_class='roof_surfacing', denial_reason='below_deductible', claim_number=cn)"
      - paid_roof: "SUM('home_claims', 'amount', event_type='home_claim_payment', property_class='roof_surfacing', claim_number=cn)"
      - occ_deductible: "MX(F('wind_hail_deductible_pct') * F('dwelling_limit') / 100, P('wind_hail_deductible_minimum')) if peril == 'wind_hail' else F('aop_deductible')"
      - occ_rc: "SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_payment', source_entry_id='', claim_number=cn) + SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_denied', claim_number=cn)"
      - band_age: "MONTHS(F('roof_install_year') + '-01-01', loss_date) // 12"
      - schedule_pct: "K('band_25_plus') if band_age >= 25 else (K('band_21_24') if band_age >= 21 else (K('band_19_20') if band_age >= 19 else (K('band_17_18') if band_age >= 17 else (K('band_15_16') if band_age >= 15 else (K('band_13_14') if band_age >= 13 else (K('band_11_12') if band_age >= 11 else K('band_0_10')))))))"
      - covered: "rc * schedule_pct / 100 if F('roof_settlement') == 'roof_surfacing_schedule' else (rc if rc <= P('rc_no_holdback_threshold') else rc - dep)"
      - deductible_absorbed: "0 if (P('deductible_waiver_threshold') > 0 and occ_rc >= P('deductible_waiver_threshold')) else MN(occ_deductible, covered)"
      - dwelling_age: "MONTHS(F('year_built') + '-01-01', loss_date) // 12"
      - code_pct: "K('code_pct_full') if (dwelling_age >= K('code_age_years') and P('ordinance_or_law_pct') >= K('code_ol_pct_floor')) else (K('code_pct_reduced') if (dwelling_age >= K('code_age_years') and P('ordinance_or_law_pct') < K('code_ol_pct_floor')) else 0)"
      - tearoff_rc: "SUM('home_claims', 'replacement_cost_amount', event_type='home_claim_denied', coverage_part='dwelling', property_class='roof_surfacing', denial_reason='below_deductible', claim_number=cn)"
      - tearoff_pct: "K('tearoff_pct_heavy') if (F('roof_material') == 'wood_shake' or F('roof_material') == 'tile_slate') else (K('tearoff_pct_asphalt') if ((F('roof_material') == 'asphalt_3tab' or F('roof_material') == 'asphalt_architectural') and tearoff_rc >= K('tearoff_rc_floor')) else 0)"
      - matching_age: "MONTHS(F('roof_install_year') + '-01-01', loss_date) // 12"
      - matching_pct: "K('matching_pct_old') if ((F('roof_material') == 'asphalt_3tab' or F('roof_material') == 'asphalt_architectural') and matching_age >= K('matching_age_old')) else (K('matching_pct_mid') if ((F('roof_material') == 'asphalt_3tab' or F('roof_material') == 'asphalt_architectural') and matching_age >= K('matching_age_mid') and matching_age < K('matching_age_old')) else 0)"
      - report_date: "LATEST('home_claims', 'entry_date', date_field='entry_date', event_type='home_claim_reported', claim_number=cn)"
      - tarp_days: "DAYS(loss_date, report_date)"
      - tarp_fee: "K('tarp_fee_vendor') if tarp_days <= K('tarp_days_vendor') else (K('tarp_fee_own') if (tarp_days > K('tarp_days_vendor') and tarp_days <= K('tarp_days_own')) else 0)"
      - prior_paid: "SUM('home_claims', 'amount', event_type='home_claim_payment', property_class='roof_surfacing', within_months=K('prior_window_months'), date_field='loss_date') - SUM('home_claims', 'amount', event_type='home_claim_payment', property_class='roof_surfacing', within_months=K('prior_window_months'), date_field='loss_date', claim_number=cn)"
      - prior_forfeited: "SUM('home_claims', 'amount', event_type='home_holdback_forfeited', property_class='roof_surfacing', within_months=K('prior_window_months'), date_field='loss_date') - SUM('home_claims', 'amount', event_type='home_holdback_forfeited', property_class='roof_surfacing', within_months=K('prior_window_months'), date_field='loss_date', claim_number=cn)"
      - prior_standing: "SUM('home_claims', 'amount', event_type='home_holdback_withheld', property_class='roof_surfacing', within_months=K('prior_window_months'), date_field='loss_date') - SUM('home_claims', 'amount', event_type='home_holdback_released', property_class='roof_surfacing', within_months=K('prior_window_months'), date_field='loss_date') - SUM('home_claims', 'amount', event_type='home_holdback_forfeited', property_class='roof_surfacing', within_months=K('prior_window_months'), date_field='loss_date') - SUM('home_claims', 'amount', event_type='home_holdback_withheld', property_class='roof_surfacing', within_months=K('prior_window_months'), date_field='loss_date', claim_number=cn) + SUM('home_claims', 'amount', event_type='home_holdback_released', property_class='roof_surfacing', within_months=K('prior_window_months'), date_field='loss_date', claim_number=cn) + SUM('home_claims', 'amount', event_type='home_holdback_forfeited', property_class='roof_surfacing', within_months=K('prior_window_months'), date_field='loss_date', claim_number=cn)"
      - prior_deduction: "prior_paid if (prior_paid > 0 and prior_forfeited > 0) else (prior_paid + prior_standing if (prior_paid > 0 and prior_standing > 0) else 0)"
      - result: "MX(0, RND(covered - deductible_absorbed - paid_roof + rc * (code_pct + tearoff_pct + matching_pct) / 100 + tarp_fee - prior_deduction, 2))"
    compute_basis:
      cn: "The claim concerned is the one whose first-notice entry is the latest on the policy; its date of loss, report date and cause of loss are those recorded on that first-notice entry."
      loss_date: "its date of loss, report date and cause of loss are those recorded on that first-notice entry."
      peril: "its date of loss, report date and cause of loss are those recorded on that first-notice entry."
      rc: "The replacement-cost value and the depreciation of the roof surfacing are the figures recorded on its below-deductible denial entry of that claim."
      dep: "The replacement-cost value and the depreciation of the roof surfacing are the figures recorded on its below-deductible denial entry of that claim."
      paid_roof: "less any roof surfacing money already issued on the claim"
      occ_deductible: "The occurrence deductible is, for a wind or hail loss, the larger of the wind/hail percentage on the declarations applied to Coverage A and the tier's wind/hail deductible minimum, and for every other cause of loss the all-other-perils deductible on the declarations."
      occ_rc: "No deductible applies when the replacement-cost values recorded on the claim's denial entries and on its payment entries that replace no denial together reach the tier's deductible waiver threshold on a tier whose threshold is above 0."
      band_age: "The roof's age for the band is the calendar year of the date of loss minus the roof install year on the declarations."
      schedule_pct: "The schedule percentage is 25 for a roof aged 25 years or more, 35 for 21 to 24 years, 45 for 19 to 20 years, 55 for 17 to 18 years, 65 for 15 to 16 years, 75 for 13 to 14 years, 85 for 11 to 12 years and 100 for 0 to 10 years."
      covered: "The covered amount follows the roof surfacing settlement basis the declarations carry for the term: on the roof surfacing schedule it is the replacement-cost value multiplied by the schedule percentage for the roof's age band, and on replacement cost it is the full replacement-cost value when that value is at or below the tier's no-holdback threshold and otherwise the replacement-cost value less the recorded depreciation."
      deductible_absorbed: "No deductible applies when the replacement-cost values recorded on the claim's denial entries and on its payment entries that replace no denial together reach the tier's deductible waiver threshold on a tier whose threshold is above 0. Otherwise the roof surfacing absorbs the smaller of the occurrence deductible and its covered amount."
      dwelling_age: "with the dwelling's age counted in whole years from 1 January of the year built to the date of loss"
      code_pct: "10 percent when the dwelling is at least 50 years old and the tier's ordinance-or-law percentage is at least 25, 5 percent when the dwelling is at least 50 years old and the tier's ordinance-or-law percentage is below 25, and no allowance for a dwelling younger than 50 years."
      tearoff_rc: "A tear-off and disposal allowance is added at a percentage of the roof surfacing's replacement-cost value"
      tearoff_pct: "8 percent for a wood shake or tile/slate roof, 5 percent for an asphalt roof, three-tab or architectural, whose roof surfacing replacement-cost value is at least 10,000.00, and none for a metal roof, which is overlaid or salvaged, or for an asphalt roof below that value, which is repaired in sections without a full tear-off."
      matching_age: "for an asphalt roof at least 20 years old at the date of loss"
      matching_pct: "10 percent of the roof surfacing's replacement-cost value for an asphalt roof at least 20 years old at the date of loss, 5 percent for an asphalt roof 10 to 19 years old, and none for a younger asphalt roof, whose shingles are still available, or for a roof of any other material."
      report_date: "its date of loss, report date and cause of loss are those recorded on that first-notice entry."
      tarp_days: "Emergency tarping is reimbursed by the whole days from the date of loss to the report date on the first notice"
      tarp_fee: "450.00 when the loss was reported within 3 days, when the desk's emergency vendor tarps the roof at first notice, 200.00 when it was reported 4 to 14 days after the loss, the insured's own temporary covering reimbursed at the desk's standard rate, and nothing when it was reported later, past the emergency stage."
      prior_paid: "where roof surfacing money was issued on the policy on an earlier claim with a date of loss in the 36 months before the call"
      prior_forfeited: "and the depreciation withheld on it has been forfeited, the deduction is the roof surfacing money issued on it"
      prior_standing: "where such money was issued and depreciation withheld on it still stands neither released nor forfeited, the deduction is that money plus the standing holdback, which the earlier claim may still pay"
      prior_deduction: "Roof surfacing damage already paid on an earlier claim and never repaired is not paid twice: where roof surfacing money was issued on the policy on an earlier claim with a date of loss in the 36 months before the call and the depreciation withheld on it has been forfeited, the deduction is the roof surfacing money issued on it; where such money was issued and depreciation withheld on it still stands neither released nor forfeited, the deduction is that money plus the standing holdback, which the earlier claim may still pay; otherwise nothing is deducted."
      result: "The reversal payment on the roof surfacing starts from the covered amount less the deductible the roof surfacing absorbs and less any roof surfacing money already issued on the claim; it is never below 0.00 and is rounded to the cent once, on the final figure. Any code-upgrade, tear-off, matching or emergency tarping allowance is added to that figure and any deduction for earlier unrepaired roof damage is taken from it before the floor and the rounding."
    factors:
      - id: prior_unrepaired_roof
        effect: method
        decides: prior_deduction
        bindings: [prior_paid, prior_forfeited, prior_standing, prior_deduction]
        ladder:
          - when: "roof surfacing money was issued on an earlier claim with a date of loss in the 36 months before the call AND the depreciation withheld on it was forfeited"
            method: "deduction = the roof surfacing money issued on that earlier claim"
          - when: "roof surfacing money was issued on an earlier claim in that window AND depreciation withheld on it still stands neither released nor forfeited"
            method: "deduction = that money plus the standing holdback (a second quantity, still payable on the earlier claim, enters the sum)"
          - when: "otherwise"
            method: "nothing is deducted"
        baseline:
          prior_deduction: "0"
        evidence: [history]
        cross_difficulty: null
      - id: roof_code_upgrade
        effect: parameter
        decides: code_pct
        bindings: [dwelling_age, code_pct]
        ladder:
          - {when: "the dwelling is at least 50 years old at the date of loss and the tier's ordinance-or-law percentage is at least 25", value: "K('code_pct_full') = 10 percent of the roof surfacing replacement-cost value"}
          - {when: "the dwelling is at least 50 years old at the date of loss and the tier's ordinance-or-law percentage is below 25", value: "K('code_pct_reduced') = 5 percent"}
          - {when: "otherwise (a dwelling younger than 50 years)", value: "0"}
        baseline:
          code_pct: "0"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: roof_tearoff_disposal
        effect: parameter
        decides: tearoff_pct
        bindings: [tearoff_rc, tearoff_pct]
        ladder:
          - {when: "a wood shake or tile/slate roof", value: "K('tearoff_pct_heavy') = 8 percent"}
          - {when: "an asphalt roof (three-tab or architectural) whose roof surfacing replacement-cost value is at least 10,000.00", value: "K('tearoff_pct_asphalt') = 5 percent"}
          - {when: "otherwise (a metal roof, overlaid or salvaged; or an asphalt roof below 10,000.00, repaired in sections)", value: "0"}
        baseline:
          tearoff_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: roof_matching
        effect: parameter
        decides: matching_pct
        bindings: [matching_age, matching_pct]
        ladder:
          - {when: "an asphalt roof at least 20 years old at the date of loss (shingle line no longer made)", value: "K('matching_pct_old') = 10 percent of the roof surfacing replacement-cost value"}
          - {when: "an asphalt roof 10 to 19 years old (shingle line often changed)", value: "K('matching_pct_mid') = 5 percent"}
          - {when: "otherwise (a younger asphalt roof, or any other material)", value: "0"}
        baseline:
          matching_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: roof_emergency_tarp
        effect: parameter
        decides: tarp_fee
        bindings: [report_date, tarp_days, tarp_fee]
        ladder:
          - {when: "loss reported within 3 days (the desk's emergency vendor tarps at first notice)", value: "K('tarp_fee_vendor') = 450.00"}
          - {when: "loss reported 4 to 14 days after the date of loss (the insured's own temporary covering)", value: "K('tarp_fee_own') = 200.00"}
          - {when: "otherwise (reported later, past the emergency stage)", value: "0"}
        baseline:
          tarp_fee: "0"
        evidence: [date, history]
        cross_difficulty: null
    baseline:
      rule: >-
        The claim concerned is the one whose first-notice entry is the latest on the policy; its date of loss, report date and cause of loss are those recorded on that first-notice entry.
        The replacement-cost value and the depreciation of the roof surfacing are the figures recorded on its below-deductible denial entry of that claim.
        The occurrence deductible is, for a wind or hail loss, the larger of the wind/hail percentage on the declarations applied to Coverage A and the tier's wind/hail deductible minimum, and for every other cause of loss the all-other-perils deductible on the declarations.
        No deductible applies when the replacement-cost values recorded on the claim's denial entries and on its payment entries that replace no denial together reach the tier's deductible waiver threshold on a tier whose threshold is above 0.
        Otherwise the roof surfacing absorbs the smaller of the occurrence deductible and its covered amount.
        The covered amount follows the roof surfacing settlement basis the declarations carry for the term: on the roof surfacing schedule it is the replacement-cost value multiplied by the schedule percentage for the roof's age band, and on replacement cost it is the full replacement-cost value when that value is at or below the tier's no-holdback threshold and otherwise the replacement-cost value less the recorded depreciation.
        The roof's age for the band is the calendar year of the date of loss minus the roof install year on the declarations.
        The schedule percentage is 25 for a roof aged 25 years or more, 35 for 21 to 24 years, 45 for 19 to 20 years, 55 for 17 to 18 years, 65 for 15 to 16 years, 75 for 13 to 14 years, 85 for 11 to 12 years and 100 for 0 to 10 years.
        The reversal payment on the roof surfacing starts from the covered amount less the deductible the roof surfacing absorbs and less any roof surfacing money already issued on the claim; it is never below 0.00 and is rounded to the cent once, on the final figure.
      params: [wind_hail_deductible_minimum, deductible_waiver_threshold, rc_no_holdback_threshold]
