      stop_claim_relief_pct: "Stop relief for the claim record: when no renters claim was reported on the policy in the last 60 calendar months, claim_free_relief_pct relief points apply; when at least one renters claim was reported in the last 60 calendar months but no renters claim payment was issued in the last 36 calendar months, claim_unpaid_relief_pct relief points apply; when a renters claim payment was issued in the last 36 calendar months, no claim-record relief points apply."
      stop_returns_12m: "when two or more renters payments were returned unpaid in the last 12 calendar months"
      stop_dishonour_points: "Stop dishonour points: when two or more renters payments were returned unpaid in the last 12 calendar months, dishonour_offset_high_pct points are subtracted from the stop relief; when exactly one renters payment was returned unpaid in the last 12 calendar months, dishonour_offset_low_pct points are subtracted; when none was returned, none are subtracted."
      stop_relief_pct: "relief points are added together, dishonour points are subtracted from them, and the total is never below 0."
      stop_charge: "Any stop relief percentage reduces the discount-stop charge by that percentage of the annual change multiplied by the share of the year charged for the stop, before the rounding"
      result: "A discount-stop charge below min_premium_change is not posted."
    factors:
      - id: stop_courtesy_period
        effect: method
        decides: stop_charged_days
        bindings: [stop_ended_reason, stop_ended_held_months, stop_charged_days]
        ladder:
          - when: "the ending qualifying policy was cancelled at its named insured's request and had been held 12 whole months or more from its bound date to its closed date"
            method: "the days charged run from its closed date to the renters expiration date, less the 30-day courtesy"
          - when: "the ending qualifying policy was cancelled for nonpayment"
            method: "the days charged are the whole renters term from its effective date"
          - when: "otherwise"
            method: "the days charged run from the closed date of the ending qualifying policy"
        baseline:
          stop_charged_days: "DAYS(stop_ended_date, F('expiration_date'))"
        evidence: [cross_category, date]
        cross_difficulty: null
      - id: stop_plan_proration
        effect: method
        decides: stop_year_share
        bindings: [stop_term_days, stop_year_share]
        ladder:
          - when: "the renters policy is billed monthly_eft or monthly_card"
            method: "whole 30-day periods in the days charged, counted downward, divided by 12"
          - when: "the renters policy is billed two_pay"
            method: "the days charged divided by 360"
          - when: "otherwise"
            method: "the days charged divided by the calendar days in the renters term"
        baseline:
          stop_year_share: "stop_charged_days / stop_term_days"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: stop_flood_relief
        effect: parameter
        decides: stop_flood_relief_pct
        bindings: [stop_flood_same_address, stop_flood_payments_24m, stop_flood_relief_pct]
        ladder:
          - when: "a FloodGuard policy in force insures the renters rental address and at least 2 FloodGuard premium payments were received in the last 24 calendar months"
            value: "K('flood_relief_full_pct') = 20 relief points"
          - when: "a FloodGuard policy in force insures the renters rental address and fewer than 2 FloodGuard premium payments were received in the last 24 calendar months"
            value: "K('flood_relief_part_pct') = 10 relief points"
          - when: "otherwise"
            value: "0 relief points"
        baseline:
          stop_flood_relief_pct: "0"
        evidence: [cross_category, history]
        cross_difficulty: flood
      - id: stop_tenure_relief
        effect: parameter
        decides: stop_tenure_relief_pct
        bindings: [stop_tenure_months, stop_tenure_relief_pct]
        ladder:
          - when: "60 or more whole months since the renters original effective date"
            value: "K('tenure_relief_long_pct') = 15 relief points"
          - when: "36 to 59 whole months since the renters original effective date"
            value: "K('tenure_relief_mid_pct') = 5 relief points"
          - when: "fewer than 36 whole months"
            value: "0 relief points"
        baseline:
          stop_tenure_relief_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: stop_claim_record_relief
        effect: parameter
        decides: stop_claim_relief_pct
        bindings: [stop_claims_reported_60m, stop_claim_payments_36m, stop_claim_relief_pct]
        ladder:
          - when: "no renters claim reported in the last 60 calendar months"
            value: "K('claim_free_relief_pct') = 10 relief points"
          - when: "a renters claim reported in the last 60 calendar months but no renters claim payment issued in the last 36 calendar months"
            value: "K('claim_unpaid_relief_pct') = 5 relief points"
          - when: "a renters claim payment issued in the last 36 calendar months"
            value: "0 relief points"
        baseline:
          stop_claim_relief_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: stop_dishonour_points
        effect: parameter
        decides: stop_dishonour_points
        bindings: [stop_returns_12m, stop_dishonour_points]
        ladder:
          - when: "two or more renters payments returned unpaid in the last 12 calendar months"
            value: "K('dishonour_offset_high_pct') = 20 points subtracted"
          - when: "exactly one renters payment returned unpaid in the last 12 calendar months"
            value: "K('dishonour_offset_low_pct') = 10 points subtracted"
          - when: "no renters payment returned unpaid in the last 12 calendar months"
            value: "0 points subtracted"
        baseline:
          stop_dishonour_points: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
