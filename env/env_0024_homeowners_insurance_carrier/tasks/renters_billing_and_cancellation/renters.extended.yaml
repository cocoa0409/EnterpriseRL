        resolved_by: pay_reinstatement_cure_5468a22a
        effect: >-
          The cure payment becomes the latest payment received on or after the cancellation date, so the fee basis is read from its amount: a cure payment at or above the large-cure threshold moves the basis from the tier's flat reinstatement fee to a percentage of the cure payment.
    cross_category:
      - category: dwelling
        as: branch
        reads: [status, original_effective_date]
        note: The LandlordGuard holding and its original effective date decide the landlord relief on the reinstatement fee.
    compute:
      - fee_cure_payment: "LATEST('renters_billing', 'amount', date_field='posted_date', event_type='renters_payment_received') if (LATEST('renters_billing', 'posted_date', date_field='posted_date', event_type='renters_payment_received') or '') >= F('closed_date') else 0"
      - fee_tenure_months: "MONTHS(F('original_effective_date'), NOW)"
      - fee_basis: "RND(fee_cure_payment * K('large_cure_rate_long_pct') / 100, 2) if (fee_cure_payment >= K('large_cure_threshold') and fee_tenure_months >= K('large_cure_tenure_months')) else (RND(fee_cure_payment * K('large_cure_rate_short_pct') / 100, 2) if (fee_cure_payment >= K('large_cure_threshold') and fee_tenure_months < K('large_cure_tenure_months')) else P('reinstatement_fee'))"
      - fee_lapse_days: "DAYS(F('closed_date'), NOW)"
      - fee_lapse_multiplier: "K('quick_lapse_multiplier') if fee_lapse_days <= K('quick_lapse_days') else (K('long_lapse_multiplier') if fee_lapse_days > K('long_lapse_days') else 1)"
      - fee_late_charges_12m: "COUNT('renters_billing', within_months=12, date_field='posted_date', event_type='renters_fee_assessed', fee_code='late_fee')"
      - fee_late_add: "K('late_add_high') if fee_late_charges_12m >= 2 else (K('late_add_low') if fee_late_charges_12m == 1 else 0)"
      - fee_claim_payments_36m: "COUNT('renters_claims', within_months=36, date_field='entry_date', event_type='renters_claim_payment')"
      - fee_claims_reported_36m: "COUNT('renters_claims', within_months=36, date_field='entry_date', event_type='renters_claim_reported')"
      - fee_claim_add: "K('paid_claim_add') if fee_claim_payments_36m >= 1 else (K('reported_claim_add') if fee_claims_reported_36m >= 1 else 0)"
      - fee_landlord_months: "MONTHS(CFIELD('dwelling', 'original_effective_date', status='in_force'), NOW) if CFIELD('dwelling', 'status', status='in_force') == 'in_force' else -1"
      - fee_landlord_relief: "K('landlord_relief_long') if fee_landlord_months >= K('landlord_long_months') else (K('landlord_relief_mid') if fee_landlord_months >= K('landlord_mid_months') else 0)"
      - result: "0 if P('reinstatement_fee') == 0 else RND(MX(0, fee_basis * fee_lapse_multiplier + fee_late_add + fee_claim_add - fee_landlord_relief), 2)"
