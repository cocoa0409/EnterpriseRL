        - {table: renters_billing, aggregate: count, field: renters_billing_id, within_months: 36, filters: {event_type: renters_additional_premium, change_reason: reinstatement_reversal}}
        - {table: renters_billing, aggregate: count, field: renters_billing_id, within_months: 12, filters: {event_type: renters_payment_returned}}
        - {category: dwelling, table: dwelling_billing, aggregate: count, field: dwelling_billing_id, within_months: 12, filters: {event_type: dwelling_payment_received}}
