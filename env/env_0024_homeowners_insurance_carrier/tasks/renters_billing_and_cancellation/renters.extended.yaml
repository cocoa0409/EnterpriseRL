      cure_tenure_months: "when the whole months from the renters original effective date to today are long_tenure_months or more"
      cure_tenure_credit: "Tenure credit on the cure: when the whole months from the renters original effective date to today are long_tenure_months or more, long_tenure_credit is taken off the cure; when they are mid_tenure_months or more but fewer than long_tenure_months, mid_tenure_credit is taken off; when they are fewer than mid_tenure_months, no tenure credit applies."
      result: "The current term's late charges are taken out of the unpaid charges and the late charges collected are put back first, the deposit and the lapse-length charge are added, the landlord credit and the tenure credit are taken off, and the total, never below 0.00, is rounded half-up to the cent once, on the final figure only."
    factors:
      - id: cure_late_charge_treatment
        effect: method
        decides: cure_late_collected
        bindings: [cure_reinstatements_36m, cure_term_late_count, cure_latest_late_charge, cure_late_collected]
        ladder:
          - when: "no reinstatement in the last 36 calendar months and at most one late charge posted in the current term"
            method: "no late charge is selected for the cure; the current term's late charges stay on the reinstated account"
          - when: "no reinstatement in the last 36 calendar months and more than one late charge posted in the current term"
            method: "only the latest late charge of the current term is selected for the cure; the others stay on the reinstated account"
          - when: "a reinstatement recorded in the last 36 calendar months"
            method: "every late charge of the current term is selected for the cure"
        baseline:
          cure_late_collected: "cure_term_late_charges"
        evidence: [history]
        cross_difficulty: null
      - id: cure_dishonour_deposit
        effect: parameter
        decides: cure_dishonour_deposit
        bindings: [cure_returns_12m, cure_scheduled_installment, cure_dishonour_deposit]
        ladder:
          - when: "two or more renters payments returned unpaid in the last 12 calendar months"
            value: "a deposit of one scheduled installment"
          - when: "exactly one renters payment returned unpaid in the last 12 calendar months"
            value: "a deposit of half of one scheduled installment"
          - when: "no renters payment returned unpaid in the last 12 calendar months"
            value: "no deposit"
        baseline:
          cure_dishonour_deposit: "0"
        evidence: [history]
        cross_difficulty: null
      - id: cure_landlord_credit
        effect: parameter
        decides: cure_landlord_credit
        bindings: [cure_landlord_status, cure_landlord_payments_12m, cure_landlord_credit]
        ladder:
          - when: "a LandlordGuard policy in force and at least 2 LandlordGuard premium payments received in the last 12 calendar months"
            value: "K('landlord_credit_full') = 4.00 taken off"
          - when: "a LandlordGuard policy in force and fewer than 2 LandlordGuard premium payments received in the last 12 calendar months"
            value: "K('landlord_credit_part') = 2.00 taken off"
          - when: "no LandlordGuard policy in force"
            value: "no landlord credit"
        baseline:
          cure_landlord_credit: "0"
        evidence: [cross_category, history]
        cross_difficulty: dwelling
      - id: cure_lapse_length_charge
        effect: parameter
        decides: cure_lapse_charge
        bindings: [cure_lapse_days, cure_lapse_charge]
        ladder:
          - when: "more than 20 calendar days from the cancellation date to today"
            value: "K('long_lapse_charge') = 5.00 added"
          - when: "11 to 20 calendar days from the cancellation date to today"
            value: "K('mid_lapse_charge') = 2.50 added"
          - when: "10 calendar days or fewer"
            value: "nothing added"
        baseline:
          cure_lapse_charge: "0"
        evidence: [date]
        cross_difficulty: null
      - id: cure_tenure_credit
        effect: parameter
        decides: cure_tenure_credit
        bindings: [cure_tenure_months, cure_tenure_credit]
        ladder:
          - when: "36 or more whole months since the renters original effective date"
            value: "K('long_tenure_credit') = 3.00 taken off"
          - when: "24 to 35 whole months since the renters original effective date"
            value: "K('mid_tenure_credit') = 1.50 taken off"
          - when: "fewer than 24 whole months"
            value: "no tenure credit"
        baseline:
          cure_tenure_credit: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The cure amount is worked out in this order.
        The unpaid charges are every installment billed, fee charged, payment returned, additional premium and refund posted on the premium account, less every payment received, fee waived, write-off and return premium posted on it other than the latest cancellation credit, rounded half-up to the cent.
        The cure amount is the unpaid charges, never below 0.00, rounded half-up to the cent.
