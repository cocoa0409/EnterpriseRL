      stop_tenure_months: "when the whole months from the renters original effective date to today are tenure_long_months or more"
      stop_tenure_relief_pct: "Stop relief for tenure: when the whole months from the renters original effective date to today are tenure_long_months or more, tenure_relief_long_pct relief points apply; when they are tenure_mid_months or more but fewer than tenure_long_months, tenure_relief_mid_pct relief points apply; when they are fewer than tenure_mid_months, no tenure relief points apply."
      stop_claims_reported_60m: "when no renters claim was reported on the policy in the last 60 calendar months"
