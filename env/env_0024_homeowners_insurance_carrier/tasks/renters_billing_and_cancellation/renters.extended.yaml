      landlord_min_payments: 2
      long_lapse_days: 20
      mid_lapse_days: 10
      long_lapse_charge: 5.00
      mid_lapse_charge: 2.50
      long_tenure_months: 36
      mid_tenure_months: 24
      long_tenure_credit: 3.00
      mid_tenure_credit: 1.50
    rule: >-
      A named insured asking to reinstate a policy cancelled for nonpayment pays the cure amount by card in one payment; the cancellation credit is left out of it because reinstatement reverses that credit, and the reinstatement fee is not part of it because it is charged at reinstatement.
      The cure amount is worked out in this order.
      The unpaid charges are every installment billed, fee charged, payment returned, additional premium and refund posted on the premium account, less every payment received, fee waived, write-off and return premium posted on it other than the latest cancellation credit, rounded half-up to the cent.
      The cure amount is the unpaid charges, never below 0.00, rounded half-up to the cent.
      Late charges in the cure: when the policy shows no reinstatement in the last 36 calendar months and at most one late charge was posted in the current term, no late charge is collected with the cure and the current term's late charges stay on the reinstated account; when the policy shows no reinstatement in the last 36 calendar months and more than one late charge was posted in the current term, only the latest late charge of the current term is collected with the cure and the others stay on the reinstated account; when a reinstatement was recorded in the last 36 calendar months, every late charge of the current term is collected with the cure.
      Cure deposit after dishonoured payments: when two or more renters payments were returned unpaid in the last 12 calendar months, a deposit of one scheduled installment is added to the cure; when exactly one was returned unpaid in the last 12 calendar months, a deposit of half of one scheduled installment is added; when none was returned, no deposit is added; a scheduled installment is taken at the amount of the latest installment billed, and a deposit stays on the account as a credit toward the installments that follow.
      Landlord household credit on the cure: when the customer holds a LandlordGuard policy in force and at least landlord_min_payments LandlordGuard premium payments were received in the last 12 calendar months, landlord_credit_full is taken off the cure; when the customer holds a LandlordGuard policy in force with fewer than landlord_min_payments LandlordGuard premium payments received in the last 12 calendar months, landlord_credit_part is taken off; when the customer holds no LandlordGuard policy in force, no landlord credit applies.
      Lapse-length charge on the cure: the calendar days from the cancellation date recorded as closed date to today are counted; when they are more than long_lapse_days, long_lapse_charge is added to the cure; when they are more than mid_lapse_days but no more than long_lapse_days, mid_lapse_charge is added; when they are mid_lapse_days or fewer, nothing is added.
      Tenure credit on the cure: when the whole months from the renters original effective date to today are long_tenure_months or more, long_tenure_credit is taken off the cure; when they are mid_tenure_months or more but fewer than long_tenure_months, mid_tenure_credit is taken off; when they are fewer than mid_tenure_months, no tenure credit applies.
      The current term's late charges are taken out of the unpaid charges and the late charges collected are put back first, the deposit and the lapse-length charge are added, the landlord credit and the tenure credit are taken off, and the total, never below 0.00, is rounded half-up to the cent once, on the final figure only.
    prerequisite: []
    cross_category:
      - category: dwelling
        as: history
        reads: [status, dwelling_billing.event_type, dwelling_billing.posted_date]
        note: The LandlordGuard holding and its premium payments in the last 12 months decide the landlord household credit on the cure.
    compute:
      - cure_charges: "SUM('renters_billing', 'amount', event_type='renters_premium_billed') + SUM('renters_billing', 'amount', event_type='renters_fee_assessed') + SUM('renters_billing', 'amount', event_type='renters_payment_returned') + SUM('renters_billing', 'amount', event_type='renters_additional_premium') + SUM('renters_billing', 'amount', event_type='renters_refund_issued')"
      - cure_credits: "SUM('renters_billing', 'amount', event_type='renters_payment_received') + SUM('renters_billing', 'amount', event_type='renters_fee_waived') + SUM('renters_billing', 'amount', event_type='renters_return_premium') + SUM('renters_billing', 'amount', event_type='renters_balance_written_off')"
      - cure_cancellation_credit: "LATEST('renters_billing', 'amount', date_field='posted_date', event_type='renters_return_premium', change_reason='cancellation') or 0"
      - cure_unpaid: "RND(cure_charges - cure_credits + cure_cancellation_credit, 2)"
      - cure_reinstatements_36m: "COUNT('renters_billing', within_months=36, date_field='posted_date', event_type='renters_additional_premium', change_reason='reinstatement_reversal')"
      - cure_term_late_count: "COUNT('renters_billing', event_type='renters_fee_assessed', fee_code='late_fee', term_effective_date=F('effective_date'))"
      - cure_term_late_charges: "SUM('renters_billing', 'amount', event_type='renters_fee_assessed', fee_code='late_fee', term_effective_date=F('effective_date'))"
      - cure_latest_late_charge: "LATEST('renters_billing', 'amount', date_field='posted_date', event_type='renters_fee_assessed', fee_code='late_fee', term_effective_date=F('effective_date')) or 0"
      - cure_late_collected: "0 if (cure_reinstatements_36m == 0 and cure_term_late_count <= 1) else (cure_latest_late_charge if (cure_reinstatements_36m == 0 and cure_term_late_count > 1) else cure_term_late_charges)"
      - cure_returns_12m: "COUNT('renters_billing', within_months=12, date_field='posted_date', event_type='renters_payment_returned')"
      - cure_scheduled_installment: "LATEST('renters_billing', 'amount', date_field='due_date', event_type='renters_premium_billed')"
      - cure_dishonour_deposit: "K('deposit_full_share') * cure_scheduled_installment if cure_returns_12m >= 2 else (K('deposit_half_share') * cure_scheduled_installment if cure_returns_12m == 1 else 0)"
      - cure_landlord_status: "CFIELD('dwelling', 'status', status='in_force')"
      - cure_landlord_payments_12m: "XCOUNT('dwelling', 'dwelling_billing', within_months=12, date_field='posted_date', event_type='dwelling_payment_received')"
      - cure_landlord_credit: "K('landlord_credit_full') if (cure_landlord_status == 'in_force' and cure_landlord_payments_12m >= K('landlord_min_payments')) else (K('landlord_credit_part') if (cure_landlord_status == 'in_force' and cure_landlord_payments_12m < K('landlord_min_payments')) else 0)"
      - cure_lapse_days: "DAYS(F('closed_date'), NOW)"
      - cure_lapse_charge: "K('long_lapse_charge') if cure_lapse_days > K('long_lapse_days') else (K('mid_lapse_charge') if cure_lapse_days > K('mid_lapse_days') else 0)"
      - cure_tenure_months: "MONTHS(F('original_effective_date'), NOW)"
      - cure_tenure_credit: "K('long_tenure_credit') if cure_tenure_months >= K('long_tenure_months') else (K('mid_tenure_credit') if cure_tenure_months >= K('mid_tenure_months') else 0)"
      - result: "RND(MX(0, cure_unpaid - cure_term_late_charges + cure_late_collected + cure_dishonour_deposit + cure_lapse_charge - cure_landlord_credit - cure_tenure_credit), 2)"
    compute_basis:
      cure_charges: "The unpaid charges are every installment billed, fee charged, payment returned, additional premium and refund posted on the premium account, less every payment received, fee waived, write-off and return premium posted on it other than the latest cancellation credit, rounded half-up to the cent."
