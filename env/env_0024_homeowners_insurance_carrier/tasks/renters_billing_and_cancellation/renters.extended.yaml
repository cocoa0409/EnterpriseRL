      stop_new_premium: "The annual premium after the stop is the annual premium before discounts reduced by autopay_discount_pct when the billing plan is monthly_eft and by no other percentage, rounded half-up to the cent and never less than minimum_annual_premium, and it is restated as the policy's annual premium."
      stop_annual_change: "The annual change is the annual premium after the stop minus the current annual premium."
      stop_umb_closed: "When more than one qualifying policy ended during the renters term, the ending qualifying policy is the one with the latest closed date."
      stop_val_closed: "When more than one qualifying policy ended during the renters term, the ending qualifying policy is the one with the latest closed date."
      stop_ended_date: "When the last live Larkspur Personal Umbrella or Valuables Floater of the customer ends during the renters term, the multi-policy discount stops and the renters policy owes a discount-stop charge, posted as one additional premium entry with change_reason multi_policy_discount_change dated the closed date of the ending qualifying policy."
      stop_ended_reason: "Stop courtesy period: when the ending qualifying policy was cancelled at its named insured's request and had been held for courtesy_min_held_months whole months or more from its bound date to its closed date"
      stop_ended_held_months: "had been held for courtesy_min_held_months whole months or more from its bound date to its closed date"
      stop_charged_days: "Stop courtesy period: when the ending qualifying policy was cancelled at its named insured's request and had been held for courtesy_min_held_months whole months or more from its bound date to its closed date, the days charged for the stop are the calendar days from its closed date to the renters expiration date less courtesy_days; when the ending qualifying policy was cancelled for nonpayment, the days charged for the stop are the calendar days of the whole renters term from its effective date, because a qualifying policy left unpaid never earned the discount; in every other case the days charged for the stop run from the closed date."
