        bindings: [catch_days_since_return, catch_prompt_credit]
        ladder:
          - when: "paid no more than late_fee_grace_days calendar days after the latest returned renters payment was posted and the policy billed monthly_eft"
            value: "K('prompt_credit_eft') = 5.00 taken off"
          - when: "paid within that period and the policy billed on any other plan"
            value: "K('prompt_credit_other') = 2.50 taken off"
          - when: "paid later, or no renters payment ever returned"
            value: "no prompt credit"
        baseline:
          catch_prompt_credit: "0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: catch_card_service_charge
        effect: parameter
        decides: catch_card_charge
        bindings: [catch_card_payments_12m, catch_card_charge]
        ladder:
          - when: "no renters payment by card received in the last 12 calendar months"
            value: "P('installment_fee_card') added"
          - when: "one to three renters payments by card received in the last 12 calendar months"
            value: "P('installment_fee_eft') added"
          - when: "four or more renters payments by card received in the last 12 calendar months"
