      cure_unpaid: "The unpaid charges are every installment billed, fee charged, payment returned, additional premium and refund posted on the premium account, less every payment received, fee waived, write-off and return premium posted on it other than the latest cancellation credit, rounded half-up to the cent."
      cure_reinstatements_36m: "when the policy shows no reinstatement in the last 36 calendar months"
