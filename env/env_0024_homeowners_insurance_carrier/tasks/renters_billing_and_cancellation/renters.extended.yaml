      fee_claim_add: "Reinstatement fee addition for the claim record: when a renters claim payment was issued on the policy in the last 36 calendar months, paid_claim_add is added to the fee; when a renters claim was reported in the last 36 calendar months but no claim payment was issued in that period, reported_claim_add is added; when no renters claim was reported in the last 36 calendar months, nothing is added."
      fee_landlord_months: "when the customer holds a LandlordGuard policy in force whose original effective date is landlord_long_months whole months or more before today"
      fee_landlord_relief: "Reinstatement fee relief for a landlord customer: when the customer holds a LandlordGuard policy in force whose original effective date is landlord_long_months whole months or more before today, landlord_relief_long is taken off the fee; when that LandlordGuard policy's original effective date is landlord_mid_months or more but fewer than landlord_long_months whole months before today, landlord_relief_mid is taken off; when the customer holds no LandlordGuard policy in force, or one held fewer than landlord_mid_months whole months, no relief applies."
      result: "The fee basis is scaled by lapse age first, the additions are then added and the relief taken off, and the total, never below 0.00, is rounded half-up to the cent once, on the final figure only."
    factors:
      - id: fee_cure_size_basis
        effect: method
        decides: fee_basis
        bindings: [fee_cure_payment, fee_tenure_months, fee_basis]
        ladder:
          - when: "the cure payment is 50.00 or more and 24 or more whole months since the renters original effective date"
            method: "the fee basis is 20 percent of the cure payment, rounded half-up to the cent"
          - when: "the cure payment is 50.00 or more and fewer than 24 whole months since the renters original effective date"
            method: "the fee basis is 25 percent of the cure payment, rounded half-up to the cent"
          - when: "the cure payment is below 50.00"
            method: "the fee basis is the tier's flat reinstatement fee"
        baseline:
          fee_basis: "P('reinstatement_fee')"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: fee_lapse_age_scaling
        effect: parameter
        decides: fee_lapse_multiplier
        bindings: [fee_lapse_days, fee_lapse_multiplier]
        ladder:
          - when: "7 or fewer calendar days from the cancellation date to today"
            value: "K('quick_lapse_multiplier') = 0.5 times the fee basis"
          - when: "more than 20 calendar days from the cancellation date to today"
            value: "K('long_lapse_multiplier') = 1.5 times the fee basis"
          - when: "8 to 20 calendar days from the cancellation date to today"
            value: "1 times the fee basis"
        baseline:
          fee_lapse_multiplier: "1"
        evidence: [date]
        cross_difficulty: null
      - id: fee_late_charge_addition
        effect: parameter
        decides: fee_late_add
        bindings: [fee_late_charges_12m, fee_late_add]
        ladder:
          - when: "two or more late charges posted on the policy in the last 12 calendar months"
            value: "K('late_add_high') = 4.00 added"
          - when: "exactly one late charge posted in the last 12 calendar months"
            value: "K('late_add_low') = 2.00 added"
          - when: "no late charge posted in the last 12 calendar months"
            value: "nothing added"
        baseline:
          fee_late_add: "0"
        evidence: [history]
        cross_difficulty: null
      - id: fee_claim_record_addition
        effect: parameter
        decides: fee_claim_add
        bindings: [fee_claim_payments_36m, fee_claims_reported_36m, fee_claim_add]
        ladder:
          - when: "a renters claim payment issued in the last 36 calendar months"
            value: "K('paid_claim_add') = 5.00 added"
          - when: "a renters claim reported in the last 36 calendar months with no claim payment in that period"
            value: "K('reported_claim_add') = 2.00 added"
          - when: "no renters claim reported in the last 36 calendar months"
            value: "nothing added"
        baseline:
          fee_claim_add: "0"
        evidence: [history]
        cross_difficulty: null
      - id: fee_landlord_relief
        effect: parameter
        decides: fee_landlord_relief
        bindings: [fee_landlord_months, fee_landlord_relief]
        ladder:
          - when: "a LandlordGuard policy in force whose original effective date is 36 or more whole months before today"
            value: "K('landlord_relief_long') = 3.00 taken off"
          - when: "a LandlordGuard policy in force whose original effective date is 12 to 35 whole months before today"
            value: "K('landlord_relief_mid') = 1.50 taken off"
          - when: "no LandlordGuard policy in force, or one held fewer than 12 whole months"
            value: "no relief"
        baseline:
          fee_landlord_relief: "0"
        evidence: [cross_category, date]
        cross_difficulty: dwelling
    baseline:
      rule: >-
        The reinstatement fee is worked out in this order.
        The reinstatement fee is the tier's reinstatement_fee, rounded half-up to the cent.
        A tier whose reinstatement_fee is 0.00 charges no reinstatement fee at all.
      params: [reinstatement_fee]
    inputs:
      history:
        - {table: renters_billing, aggregate: latest, field: amount, filters: {event_type: renters_payment_received}}
        - {table: renters_billing, aggregate: count, field: renters_billing_id, within_months: 12, filters: {event_type: renters_fee_assessed, fee_code: late_fee}}
        - {table: renters_claims, aggregate: count, field: renters_claim_entry_id, within_months: 36, filters: {event_type: renters_claim_payment}}
      cross_category: [dwelling]
