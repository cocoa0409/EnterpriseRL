      mid_schedule_points: 1
      flood_long_months: 24
      flood_long_points: 2
      flood_short_points: 1
      tenure_long_months: 48
      tenure_mid_months: 24
      tenure_long_points: 2
      tenure_mid_points: 1
      dishonour_high_points: 2
      dishonour_low_points: 1
    rule: >-
      When a Larkspur Personal Umbrella or Valuables Floater of the customer takes effect during the renters term while the renters premium carries no multi-policy discount, the discount restarts and the renters policy is owed a restart credit, posted as one return premium entry with change_reason multi_policy_discount_change and credit_basis pro_rata dated the effective date of the new qualifying policy.
      The restart credit is not posted until the premium account carries a multi-policy discount change charge dated the closed date of every qualifying policy that ended earlier in the same renters term.
      The restart credit is worked out in this order.
      The annual premium without discounts is the current annual premium divided by one minus autopay_discount_pct divided by 100 when the billing plan is monthly_eft, and taken as it stands on any other plan, rounded half-up to the cent.
      The annual premium without discounts is taken from the current annual premium in that way and is not rebuilt from the contents, liability and co-insured charges; a current annual premium held at minimum_annual_premium is treated the same way.
      The discount percentages after the restart are autopay_discount_pct when the billing plan is monthly_eft plus multi_policy_discount_pct.
      The annual premium after the restart is the annual premium without discounts reduced by the discount percentages after the restart, rounded half-up to the cent and never less than minimum_annual_premium, and it is restated as the policy's annual premium.
      The annual reduction is the current annual premium minus the annual premium after the restart.
      The days credited for the restart are the calendar days from the effective date of the new qualifying policy to the expiration date of the renters term.
      The share of the year credited for the restart is the days credited for the restart divided by the calendar days in the renters term.
      The restart credit is the annual reduction multiplied by the share of the year credited for the restart, rounded half-up to the cent once, on the final figure only.
      A restart credit below min_premium_change is not posted.
      Restart start date: when the new qualifying policy was bound early_bind_days calendar days or more before it took effect and is billed on the annual plan, the days credited for the restart run from its bound date to the renters expiration date; when it was bound early_bind_days calendar days or more before it took effect and is billed on any other plan, the days credited run from early_start_days calendar days before its effective date to the renters expiration date, and never from a day before the renters effective date; when it was bound fewer than early_bind_days calendar days before it took effect, the days credited run from its effective date.
      Restart proration by billing plan: on a renters policy billed monthly_eft or monthly_card, the share of the year credited for the restart is the number of whole_period_days-day periods in the days credited for the restart, a part period counted as a whole one, divided by 12; on a renters policy billed two_pay, it is the days credited for the restart divided by two_pay_year_days; on any other plan it is the days credited for the restart divided by the calendar days in the renters term.
      Any restart points are added to the discount percentages after the restart; schedule points, household points and tenure points are added and restart dishonour points are subtracted.
      Restart schedule points: when the new qualifying policy is a Valuables Floater whose scheduled total is large_schedule_value or more, large_schedule_points points are added; when its scheduled total is mid_schedule_value or more but below large_schedule_value, mid_schedule_points points are added; in every other case no schedule points are added.
      Restart household points: when the customer holds a FloodGuard policy in force whose original effective date is flood_long_months whole months or more before today, flood_long_points points are added; when the customer holds a FloodGuard policy in force whose original effective date is fewer than flood_long_months whole months before today, flood_short_points points are added; when the customer holds no FloodGuard policy in force, no household points are added.
      Restart tenure points: when the whole months from the renters original effective date to today are tenure_long_months or more, tenure_long_points points are added; when they are tenure_mid_months or more but fewer than tenure_long_months, tenure_mid_points points are added; when they are fewer than tenure_mid_months, no tenure points are added.
      Restart dishonour points: when two or more renters payments were returned unpaid in the last 12 calendar months, dishonour_high_points points are subtracted; when exactly one was returned unpaid in the last 12 calendar months, dishonour_low_points points are subtracted; when none was returned, none are subtracted.
    prerequisite:
      - problem: renters_ext_discount_stop_charge
        kind: value_input
        gate: restart_old_premium
        form: state
        policy_source: >-
          The restart credit is not posted until the premium account carries a multi-policy discount change charge dated the closed date of every qualifying policy that ended earlier in the same renters term.
        condition: >-
          renters_billing holds a renters_additional_premium entry with change_reason multi_policy_discount_change whose effective_date equals the closed_date of every umbrella or valuables policy of the customer that closed inside the current renters term.
        resolved_by: post_discount_stop_charge_d8b9b7f1
        effect: >-
          Once the discount-stop charge is posted, the current annual premium the restart credit starts from is the restated premium after the stop, so the annual premium without discounts, the annual reduction and the restart credit are all worked from the restated figure rather than from a premium that still carries the ended discount.
    cross_category:
      - category: valuables
        as: branch
        reads: [status, bound_date, effective_date, billing_plan, scheduled_total]
        note: The new floater's bound and effective dates, plan and scheduled total set the restart start date and the schedule points.
      - category: umbrella
        as: branch
        reads: [status, bound_date, effective_date, billing_plan]
        note: A new umbrella is read the same way as a new floater for the restart start date.
      - category: flood
        as: branch
        reads: [status, original_effective_date]
        note: The FloodGuard holding and its original effective date decide the household points.
    compute:
      - restart_old_premium: "F('term_premium')"
      - restart_autopay_pct: "P('autopay_discount_pct') if F('billing_plan') == 'monthly_eft' else 0"
      - restart_gross_premium: "RND(restart_old_premium / (1 - restart_autopay_pct / 100), 2)"
      - restart_new_bound: "CFIELD('valuables', 'bound_date', status='in_force') or CFIELD('umbrella', 'bound_date', status='in_force')"
      - restart_new_effective: "CFIELD('valuables', 'effective_date', status='in_force') or CFIELD('umbrella', 'effective_date', status='in_force')"
      - restart_new_plan: "CFIELD('valuables', 'billing_plan', status='in_force') or CFIELD('umbrella', 'billing_plan', status='in_force')"
      - restart_bind_lead_days: "DAYS(restart_new_bound, restart_new_effective)"
      - restart_term_days: "DAYS(F('effective_date'), F('expiration_date'))"
      - restart_credit_days: "DAYS(restart_new_bound, F('expiration_date')) if (restart_bind_lead_days >= K('early_bind_days') and restart_new_plan == 'annual') else (MN(DAYS(restart_new_effective, F('expiration_date')) + K('early_start_days'), restart_term_days) if (restart_bind_lead_days >= K('early_bind_days') and restart_new_plan != 'annual') else DAYS(restart_new_effective, F('expiration_date')))"
      - restart_year_share: "(-(-restart_credit_days // K('whole_period_days'))) / 12 if (F('billing_plan') == 'monthly_eft' or F('billing_plan') == 'monthly_card') else (restart_credit_days / K('two_pay_year_days') if F('billing_plan') == 'two_pay' else restart_credit_days / restart_term_days)"
      - restart_scheduled_total: "CFIELD('valuables', 'scheduled_total', status='in_force') or 0"
      - restart_schedule_points: "K('large_schedule_points') if restart_scheduled_total >= K('large_schedule_value') else (K('mid_schedule_points') if restart_scheduled_total >= K('mid_schedule_value') else 0)"
      - restart_flood_in_force: "CFIELD('flood', 'status', status='in_force') == 'in_force'"
      - restart_flood_months: "MONTHS(CFIELD('flood', 'original_effective_date', status='in_force'), NOW) if restart_flood_in_force else 0"
      - restart_household_points: "K('flood_long_points') if (restart_flood_in_force and restart_flood_months >= K('flood_long_months')) else (K('flood_short_points') if (restart_flood_in_force and restart_flood_months < K('flood_long_months')) else 0)"
      - restart_tenure_months: "MONTHS(F('original_effective_date'), NOW)"
      - restart_tenure_points: "K('tenure_long_points') if restart_tenure_months >= K('tenure_long_months') else (K('tenure_mid_points') if restart_tenure_months >= K('tenure_mid_months') else 0)"
      - restart_returns_12m: "COUNT('renters_billing', within_months=12, date_field='posted_date', event_type='renters_payment_returned')"
      - restart_dishonour_points: "K('dishonour_high_points') if restart_returns_12m >= 2 else (K('dishonour_low_points') if restart_returns_12m == 1 else 0)"
      - restart_discount_pct: "restart_autopay_pct + P('multi_policy_discount_pct') + restart_schedule_points + restart_household_points + restart_tenure_points - restart_dishonour_points"
      - restart_new_premium: "MX(P('minimum_annual_premium'), RND(restart_gross_premium * (1 - restart_discount_pct / 100), 2))"
      - restart_annual_reduction: "restart_old_premium - restart_new_premium"
      - restart_credit: "RND(restart_annual_reduction * restart_year_share, 2)"
      - result: "restart_credit if restart_credit >= P('min_premium_change') else 0"
    compute_basis:
      restart_old_premium: "The annual reduction is the current annual premium minus the annual premium after the restart."
      restart_autopay_pct: "The annual premium without discounts is the current annual premium divided by one minus autopay_discount_pct divided by 100 when the billing plan is monthly_eft, and taken as it stands on any other plan, rounded half-up to the cent."
      restart_gross_premium: "The annual premium without discounts is taken from the current annual premium in that way and is not rebuilt from the contents, liability and co-insured charges; a current annual premium held at minimum_annual_premium is treated the same way."
      restart_new_bound: "when the new qualifying policy was bound early_bind_days calendar days or more before it took effect"
      restart_new_effective: "The days credited for the restart are the calendar days from the effective date of the new qualifying policy to the expiration date of the renters term."
      restart_new_plan: "and is billed on the annual plan"
      restart_bind_lead_days: "when the new qualifying policy was bound early_bind_days calendar days or more before it took effect"
      restart_credit_days: "Restart start date: when the new qualifying policy was bound early_bind_days calendar days or more before it took effect and is billed on the annual plan, the days credited for the restart run from its bound date to the renters expiration date; when it was bound early_bind_days calendar days or more before it took effect and is billed on any other plan, the days credited run from early_start_days calendar days before its effective date to the renters expiration date, and never from a day before the renters effective date; when it was bound fewer than early_bind_days calendar days before it took effect, the days credited run from its effective date."
      restart_term_days: "The share of the year credited for the restart is the days credited for the restart divided by the calendar days in the renters term."
      restart_year_share: "Restart proration by billing plan: on a renters policy billed monthly_eft or monthly_card, the share of the year credited for the restart is the number of whole_period_days-day periods in the days credited for the restart, a part period counted as a whole one, divided by 12; on a renters policy billed two_pay, it is the days credited for the restart divided by two_pay_year_days; on any other plan it is the days credited for the restart divided by the calendar days in the renters term."
      restart_scheduled_total: "when the new qualifying policy is a Valuables Floater whose scheduled total is large_schedule_value or more"
      restart_schedule_points: "Restart schedule points: when the new qualifying policy is a Valuables Floater whose scheduled total is large_schedule_value or more, large_schedule_points points are added; when its scheduled total is mid_schedule_value or more but below large_schedule_value, mid_schedule_points points are added; in every other case no schedule points are added."
      restart_flood_in_force: "when the customer holds a FloodGuard policy in force whose original effective date is flood_long_months whole months or more before today"
      restart_flood_months: "whose original effective date is flood_long_months whole months or more before today"
      restart_household_points: "Restart household points: when the customer holds a FloodGuard policy in force whose original effective date is flood_long_months whole months or more before today, flood_long_points points are added; when the customer holds a FloodGuard policy in force whose original effective date is fewer than flood_long_months whole months before today, flood_short_points points are added; when the customer holds no FloodGuard policy in force, no household points are added."
      restart_tenure_months: "when the whole months from the renters original effective date to today are tenure_long_months or more"
      restart_tenure_points: "Restart tenure points: when the whole months from the renters original effective date to today are tenure_long_months or more, tenure_long_points points are added; when they are tenure_mid_months or more but fewer than tenure_long_months, tenure_mid_points points are added; when they are fewer than tenure_mid_months, no tenure points are added."
      restart_returns_12m: "when two or more renters payments were returned unpaid in the last 12 calendar months"
      restart_dishonour_points: "Restart dishonour points: when two or more renters payments were returned unpaid in the last 12 calendar months, dishonour_high_points points are subtracted; when exactly one was returned unpaid in the last 12 calendar months, dishonour_low_points points are subtracted; when none was returned, none are subtracted."
      restart_discount_pct: "Any restart points are added to the discount percentages after the restart; schedule points, household points and tenure points are added and restart dishonour points are subtracted."
      restart_new_premium: "The annual premium after the restart is the annual premium without discounts reduced by the discount percentages after the restart, rounded half-up to the cent and never less than minimum_annual_premium, and it is restated as the policy's annual premium."
      restart_annual_reduction: "The annual reduction is the current annual premium minus the annual premium after the restart."
      restart_credit: "The restart credit is the annual reduction multiplied by the share of the year credited for the restart, rounded half-up to the cent once, on the final figure only."
      result: "A restart credit below min_premium_change is not posted."
    factors:
      - id: restart_start_date
        effect: method
        decides: restart_credit_days
        bindings: [restart_new_bound, restart_new_plan, restart_bind_lead_days, restart_credit_days]
        ladder:
          - when: "the new qualifying policy was bound 14 or more calendar days before it took effect and is billed on the annual plan"
            method: "the days credited run from its bound date to the renters expiration date"
          - when: "the new qualifying policy was bound 14 or more calendar days before it took effect and is billed on any other plan"
            method: "the days credited run from 7 days before its effective date to the renters expiration date, never from before the renters effective date"
          - when: "the new qualifying policy was bound fewer than 14 calendar days before it took effect"
            method: "the days credited run from its effective date to the renters expiration date"
        baseline:
          restart_credit_days: "DAYS(restart_new_effective, F('expiration_date'))"
        evidence: [cross_category, date]
        cross_difficulty: null
      - id: restart_plan_proration
        effect: method
        decides: restart_year_share
        bindings: [restart_term_days, restart_year_share]
        ladder:
          - when: "the renters policy is billed monthly_eft or monthly_card"
            method: "30-day periods in the days credited, a part period counted as a whole one, divided by 12"
          - when: "the renters policy is billed two_pay"
            method: "the days credited divided by 360"
          - when: "otherwise"
            method: "the days credited divided by the calendar days in the renters term"
        baseline:
          restart_year_share: "restart_credit_days / restart_term_days"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: restart_schedule_points
        effect: parameter
        decides: restart_schedule_points
        bindings: [restart_scheduled_total, restart_schedule_points]
        ladder:
          - when: "the new qualifying policy is a Valuables Floater scheduling 25,000 or more"
            value: "K('large_schedule_points') = 2 points"
          - when: "the new qualifying policy is a Valuables Floater scheduling 10,000 to 24,999.99"
            value: "K('mid_schedule_points') = 1 point"
          - when: "otherwise"
            value: "0 points"
        baseline:
          restart_schedule_points: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: restart_household_points
        effect: parameter
        decides: restart_household_points
        bindings: [restart_flood_in_force, restart_flood_months, restart_household_points]
        ladder:
          - when: "a FloodGuard policy in force and its original effective date 24 or more whole months before today"
            value: "K('flood_long_points') = 2 points"
          - when: "a FloodGuard policy in force and its original effective date fewer than 24 whole months before today"
            value: "K('flood_short_points') = 1 point"
          - when: "no FloodGuard policy in force"
            value: "0 points"
        baseline:
          restart_household_points: "0"
        evidence: [cross_category, date]
        cross_difficulty: flood
      - id: restart_tenure_points
        effect: parameter
        decides: restart_tenure_points
        bindings: [restart_tenure_months, restart_tenure_points]
        ladder:
          - when: "48 or more whole months since the renters original effective date"
            value: "K('tenure_long_points') = 2 points"
          - when: "24 to 47 whole months since the renters original effective date"
            value: "K('tenure_mid_points') = 1 point"
          - when: "fewer than 24 whole months"
            value: "0 points"
        baseline:
          restart_tenure_points: "0"
        evidence: [date]
        cross_difficulty: null
      - id: restart_dishonour_points
        effect: parameter
        decides: restart_dishonour_points
        bindings: [restart_returns_12m, restart_dishonour_points]
        ladder:
          - when: "two or more renters payments returned unpaid in the last 12 calendar months"
            value: "K('dishonour_high_points') = 2 points subtracted"
          - when: "exactly one renters payment returned unpaid in the last 12 calendar months"
            value: "K('dishonour_low_points') = 1 point subtracted"
          - when: "no renters payment returned unpaid in the last 12 calendar months"
            value: "0 points subtracted"
        baseline:
          restart_dishonour_points: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The restart credit is worked out in this order.
        The annual premium without discounts is the current annual premium divided by one minus autopay_discount_pct divided by 100 when the billing plan is monthly_eft, and taken as it stands on any other plan, rounded half-up to the cent.
        The annual premium without discounts is taken from the current annual premium in that way and is not rebuilt from the contents, liability and co-insured charges; a current annual premium held at minimum_annual_premium is treated the same way.
        The discount percentages after the restart are autopay_discount_pct when the billing plan is monthly_eft plus multi_policy_discount_pct.
        The annual premium after the restart is the annual premium without discounts reduced by the discount percentages after the restart, rounded half-up to the cent and never less than minimum_annual_premium, and it is restated as the policy's annual premium.
        The annual reduction is the current annual premium minus the annual premium after the restart.
        The days credited for the restart are the calendar days from the effective date of the new qualifying policy to the expiration date of the renters term.
        The share of the year credited for the restart is the days credited for the restart divided by the calendar days in the renters term.
        The restart credit is the annual reduction multiplied by the share of the year credited for the restart, rounded half-up to the cent once, on the final figure only.
        A restart credit below min_premium_change is not posted.
      params: [autopay_discount_pct, multi_policy_discount_pct, minimum_annual_premium, min_premium_change]
    inputs:
      history:
        - {table: renters_billing, aggregate: count, field: renters_billing_id, within_months: 12, filters: {event_type: renters_payment_returned}}
      cross_category: [valuables, umbrella, flood]
  - id: renters_ext_late_charge
    base_policy_refs: [renters_fees_and_waivers]
    overwrite:
      - base_policy: renters_fees_and_waivers
        superseded_clause: >-
          The returned-payment fee is charged once per returned payment, referencing that return, and the reinstatement fee once per reinstatement; a fee whose tier amount is 0.00 is not charged at all.
        replaced_by: >-
          The returned-payment fee is charged once per returned payment, referencing that return, and the reinstatement fee once per reinstatement; a late fee is charged at the late charge worked out below instead of at the tier's late_fee alone; a fee whose tier amount is 0.00 is not charged at all.
    trigger: state_due
    subject: [renters_fee_assessed]
    computes: amount
    target_tool: assess_late_charge_664a192e
    params:
      long_tenure_months: 36
      mid_tenure_months: 12
      long_tenure_charge: 3.00
      mid_tenure_charge: 4.00
      dishonour_add_high: 2.00
      dishonour_add_low: 1.00
      large_installment_amount: 50.00
      mid_installment_amount: 20.00
      large_installment_add: 1.00
      mid_installment_add: 0.50
      very_late_days: 30
      late_days: 12
      late_percentage_only: 25
      late_percentage_added: 10
    rule: >-
      A renters installment still unpaid after its late-fee grace period carries one late charge, posted as one fee entry with fee_code late_fee referencing the term and the installment number of the overdue installment.
      The returned-payment fee is charged once per returned payment, referencing that return, and the reinstatement fee once per reinstatement; a late fee is charged at the late charge worked out below instead of at the tier's late_fee alone; a fee whose tier amount is 0.00 is not charged at all.
      An installment whose payment was returned unpaid is unpaid from its due date, the returned payment counting as never received.
      The overdue installment is the installment of the current term with the latest due date already past among the installments billed, and the late charge is worked out for it in this order.
      The late charge is the tier's late_fee, rounded half-up to the cent.
      A tier whose late_fee is 0.00 charges no late charge at all.
      Late charge base by tenure: when the whole months from the renters original effective date to today are long_tenure_months or more and no late charge was posted on the policy in the last 12 calendar months, the base of the late charge is long_tenure_charge; when those whole months are mid_tenure_months or more but fewer than long_tenure_months and no late charge was posted on the policy in the last 12 calendar months, the base of the late charge is mid_tenure_charge; in every other case the base of the late charge is the tier's late_fee.
      Late charge addition for dishonoured payments: when two or more renters payments were returned unpaid in the last 12 calendar months, dishonour_add_high is added to the base of the late charge; when exactly one was returned unpaid in the last 12 calendar months, dishonour_add_low is added; when none was returned, nothing is added.
      Late charge addition for installment size: the unpaid part of the overdue installment is its billed amount plus the installment service charge billed with that same installment; when that unpaid part is large_installment_amount or more, large_installment_add is added to the base of the late charge; when it is mid_installment_amount or more but below large_installment_amount, mid_installment_add is added; when it is below mid_installment_amount, nothing is added.
      Late charge method by lateness: the calendar days from the due date of the overdue installment to today are counted; when they are more than very_late_days, the late charge is late_percentage_only percent of the unpaid part of the overdue installment, in place of the base with its additions; when they are late_days to very_late_days, the late charge is the base with its additions plus late_percentage_added percent of the unpaid part of the overdue installment; when they are fewer than late_days, the late charge is the base with its additions.
      The additions are made to the base of the late charge first, the lateness method is then applied, and the result is rounded half-up to the cent once, on the final figure only.
    prerequisite: []
    cross_category: []
    compute:
      - late_latest_number: "LATEST('renters_billing', 'installment_number', date_field='due_date', event_type='renters_premium_billed', term_effective_date=F('effective_date'))"
      - late_latest_due: "LATEST('renters_billing', 'due_date', date_field='due_date', event_type='renters_premium_billed', term_effective_date=F('effective_date'))"
      - late_overdue_number: "late_latest_number if late_latest_due < NOW else late_latest_number - 1"
      - late_due_date: "LATEST('renters_billing', 'due_date', date_field='due_date', event_type='renters_premium_billed', term_effective_date=F('effective_date'), installment_number=late_overdue_number)"
      - late_installment_amount: "LATEST('renters_billing', 'amount', date_field='due_date', event_type='renters_premium_billed', term_effective_date=F('effective_date'), installment_number=late_overdue_number)"
      - late_service_charge: "LATEST('renters_billing', 'amount', date_field='posted_date', event_type='renters_fee_assessed', fee_code='installment_fee', term_effective_date=F('effective_date'), installment_number=late_overdue_number)"
      - late_unpaid_part: "late_installment_amount + (late_service_charge or 0)"
      - late_size_add: "K('large_installment_add') if late_unpaid_part >= K('large_installment_amount') else (K('mid_installment_add') if late_unpaid_part >= K('mid_installment_amount') else 0)"
      - late_tenure_months: "MONTHS(F('original_effective_date'), NOW)"
      - late_prior_charges_12m: "COUNT('renters_billing', within_months=12, date_field='posted_date', event_type='renters_fee_assessed', fee_code='late_fee')"
      - late_base_charge: "K('long_tenure_charge') if (late_tenure_months >= K('long_tenure_months') and late_prior_charges_12m == 0) else (K('mid_tenure_charge') if (late_tenure_months >= K('mid_tenure_months') and late_prior_charges_12m == 0) else P('late_fee'))"
      - late_returns_12m: "COUNT('renters_billing', within_months=12, date_field='posted_date', event_type='renters_payment_returned')"
      - late_dishonour_add: "K('dishonour_add_high') if late_returns_12m >= 2 else (K('dishonour_add_low') if late_returns_12m == 1 else 0)"
      - late_flat_charge: "late_base_charge + late_dishonour_add + late_size_add"
      - late_days_past_due: "DAYS(late_due_date, NOW)"
      - late_method_charge: "late_unpaid_part * K('late_percentage_only') / 100 if late_days_past_due > K('very_late_days') else (late_flat_charge + late_unpaid_part * K('late_percentage_added') / 100 if late_days_past_due >= K('late_days') else late_flat_charge)"
      - result: "0 if P('late_fee') == 0 else RND(late_method_charge, 2)"
    compute_basis:
      late_latest_number: "The overdue installment is the installment of the current term with the latest due date already past among the installments billed, and the late charge is worked out for it in this order."
      late_latest_due: "The overdue installment is the installment of the current term with the latest due date already past among the installments billed, and the late charge is worked out for it in this order."
      late_overdue_number: "The overdue installment is the installment of the current term with the latest due date already past among the installments billed, and the late charge is worked out for it in this order."
      late_due_date: "The overdue installment is the installment of the current term with the latest due date already past among the installments billed, and the late charge is worked out for it in this order."
      late_installment_amount: "the unpaid part of the overdue installment is its billed amount plus the installment service charge billed with that same installment"
      late_service_charge: "the unpaid part of the overdue installment is its billed amount plus the installment service charge billed with that same installment"
      late_unpaid_part: "the unpaid part of the overdue installment is its billed amount plus the installment service charge billed with that same installment"
      late_size_add: "Late charge addition for installment size: the unpaid part of the overdue installment is its billed amount plus the installment service charge billed with that same installment; when that unpaid part is large_installment_amount or more, large_installment_add is added to the base of the late charge; when it is mid_installment_amount or more but below large_installment_amount, mid_installment_add is added; when it is below mid_installment_amount, nothing is added."
      late_tenure_months: "when the whole months from the renters original effective date to today are long_tenure_months or more"
      late_prior_charges_12m: "and no late charge was posted on the policy in the last 12 calendar months"
      late_base_charge: "Late charge base by tenure: when the whole months from the renters original effective date to today are long_tenure_months or more and no late charge was posted on the policy in the last 12 calendar months, the base of the late charge is long_tenure_charge; when those whole months are mid_tenure_months or more but fewer than long_tenure_months and no late charge was posted on the policy in the last 12 calendar months, the base of the late charge is mid_tenure_charge; in every other case the base of the late charge is the tier's late_fee."
      late_returns_12m: "when two or more renters payments were returned unpaid in the last 12 calendar months"
      late_dishonour_add: "Late charge addition for dishonoured payments: when two or more renters payments were returned unpaid in the last 12 calendar months, dishonour_add_high is added to the base of the late charge; when exactly one was returned unpaid in the last 12 calendar months, dishonour_add_low is added; when none was returned, nothing is added."
      late_flat_charge: "The additions are made to the base of the late charge first, the lateness method is then applied, and the result is rounded half-up to the cent once, on the final figure only."
      late_days_past_due: "the calendar days from the due date of the overdue installment to today are counted"
      late_method_charge: "Late charge method by lateness: the calendar days from the due date of the overdue installment to today are counted; when they are more than very_late_days, the late charge is late_percentage_only percent of the unpaid part of the overdue installment, in place of the base with its additions; when they are late_days to very_late_days, the late charge is the base with its additions plus late_percentage_added percent of the unpaid part of the overdue installment; when they are fewer than late_days, the late charge is the base with its additions."
      result: "A tier whose late_fee is 0.00 charges no late charge at all."
    factors:
      - id: late_tenure_base
        effect: parameter
        decides: late_base_charge
        bindings: [late_tenure_months, late_prior_charges_12m, late_base_charge]
        ladder:
          - when: "36 or more whole months since the renters original effective date and no late charge posted on the policy in the last 12 calendar months"
            value: "K('long_tenure_charge') = 3.00"
          - when: "12 to 35 whole months since the renters original effective date and no late charge posted on the policy in the last 12 calendar months"
            value: "K('mid_tenure_charge') = 4.00"
          - when: "otherwise (fewer than 12 whole months, or a late charge posted in the last 12 calendar months)"
            value: "P('late_fee'), the tier's late fee"
        baseline:
          late_base_charge: "P('late_fee')"
        evidence: [date, history, tier_param]
        cross_difficulty: null
      - id: late_dishonour_addition
        effect: parameter
        decides: late_dishonour_add
        bindings: [late_returns_12m, late_dishonour_add]
        ladder:
          - when: "two or more renters payments returned unpaid in the last 12 calendar months"
            value: "K('dishonour_add_high') = 2.00 added"
          - when: "exactly one renters payment returned unpaid in the last 12 calendar months"
            value: "K('dishonour_add_low') = 1.00 added"
          - when: "no renters payment returned unpaid in the last 12 calendar months"
            value: "nothing added"
        baseline:
          late_dishonour_add: "0"
        evidence: [history]
        cross_difficulty: null
      - id: late_installment_size_addition
        effect: parameter
        decides: late_size_add
        bindings: [late_installment_amount, late_service_charge, late_unpaid_part, late_size_add]
        ladder:
          - when: "the unpaid part of the overdue installment (billed amount plus the service charge billed with it) is 50.00 or more"
            value: "K('large_installment_add') = 1.00 added"
          - when: "the unpaid part is 20.00 or more but below 50.00"
            value: "K('mid_installment_add') = 0.50 added"
          - when: "the unpaid part is below 20.00"
            value: "nothing added"
        baseline:
          late_size_add: "0"
        evidence: [history]
        cross_difficulty: null
      - id: late_lateness_method
        effect: method
        decides: late_method_charge
        bindings: [late_days_past_due, late_method_charge]
        ladder:
          - when: "more than 30 calendar days from the overdue installment's due date to today"
            method: "a percentage charge: 25 percent of the unpaid part of the overdue installment, in place of the flat base with its additions"
          - when: "12 to 30 calendar days from the due date to today"
            method: "a combined charge: the flat base with its additions plus 10 percent of the unpaid part of the overdue installment"
          - when: "fewer than 12 calendar days from the due date to today"
            method: "a flat charge: the base with its additions"
        baseline:
          late_method_charge: "late_flat_charge"
        evidence: [date, history]
        cross_difficulty: null
    baseline:
      rule: >-
        The overdue installment is the installment of the current term with the latest due date already past among the installments billed, and the late charge is worked out for it in this order.
        The late charge is the tier's late_fee, rounded half-up to the cent.
        A tier whose late_fee is 0.00 charges no late charge at all.
      params: [late_fee]
    inputs:
      history:
        - {table: renters_billing, aggregate: latest, field: due_date, filters: {event_type: renters_premium_billed}}
        - {table: renters_billing, aggregate: count, field: renters_billing_id, within_months: 12, filters: {event_type: renters_fee_assessed, fee_code: late_fee}}
        - {table: renters_billing, aggregate: count, field: renters_billing_id, within_months: 12, filters: {event_type: renters_payment_returned}}
      cross_category: []
  - id: renters_ext_catch_up_amount
    base_policy_refs: [renters_payment_application]
    overwrite: []
    trigger: on_request
    subject: [renters_payment_received]
    computes: amount
    target_tool: pay_catch_up_by_card_50a8e701
    params:
      prompt_credit_eft: 5.00
      prompt_credit_other: 2.50
      card_payments_regular: 4
      flood_credit_full: 3.00
      flood_credit_part: 1.00
      long_tenure_months: 36
      mid_tenure_months: 24
    rule: >-
      A named insured of a policy in force who asks to bring the renters premium account fully up to date pays a catch-up amount by card in one payment, applied oldest charge first.
      The catch-up is one payment applied to the premium account oldest charge first; whatever it carries beyond the account balance stays on the account as a credit toward the charges billed next.
      The catch-up amount is fixed only after the premium account carries a multi-policy discount change credit dated the effective date of every qualifying policy that took effect during the renters term while the renters premium carried no multi-policy discount.
      The catch-up amount is fixed only after each installment of the term left unpaid past its late-fee grace period carries a late charge on the premium account.
      The catch-up amount is worked out in this order.
      The account balance is every installment billed, fee charged, payment returned, additional premium and refund posted on the premium account, less every payment received, fee waived, return premium and write-off posted on it, rounded half-up to the cent.
      The catch-up amount is the account balance, never below 0.00, rounded half-up to the cent.
      Catch-up collection ahead of billing after dishonoured payments: when two or more renters payments were returned unpaid in the last 12 calendar months, the unbilled premium of the term, which is the annual premium less every installment already billed for the term and never below 0.00, is collected with the catch-up; when exactly one renters payment was returned unpaid in the last 12 calendar months and a late charge was posted on the policy in the last 12 calendar months, the next scheduled installment is collected with the catch-up, taken at the amount of the latest installment billed together with the installment service charge of the policy's billing plan, installment_fee_eft on monthly_eft and installment_fee_card on any other plan; in every other case nothing is collected ahead of billing.
      Service charge relief on an installment collected early: when the next scheduled installment is collected with the catch-up and the whole months from the renters original effective date to today are long_tenure_months or more, its installment service charge is waived in full; when they are mid_tenure_months or more but fewer than long_tenure_months, half of that service charge is waived; when they are fewer than mid_tenure_months, or no installment is collected early, nothing is waived.
      Prompt catch-up credit: when the catch-up is paid no more than late_fee_grace_days calendar days after the latest returned renters payment was posted and the policy is billed monthly_eft, prompt_credit_eft is taken off the catch-up amount; when it is paid within that period and the policy is billed on any other plan, prompt_credit_other is taken off; when it is paid later, or no renters payment was ever returned, no prompt credit applies.
      Card service charge on the catch-up: when no renters payment by card was received in the last 12 calendar months, the catch-up carries installment_fee_card; when one or more but fewer than card_payments_regular renters payments by card were received in the last 12 calendar months, it carries installment_fee_eft; when card_payments_regular or more were received by card, it carries no card service charge.
      Flood household credit on the catch-up: when the customer holds a FloodGuard policy in force billed on the annual plan and at least one FloodGuard premium payment was received in the last 12 calendar months, flood_credit_full is taken off the catch-up amount; when the customer holds a FloodGuard policy in force billed on another plan, or with no FloodGuard premium payment received in the last 12 calendar months, flood_credit_part is taken off; when the customer holds no FloodGuard policy in force, no flood credit applies.
      The amount collected ahead of billing and the card service charge are added to the account balance, the service charge relief, the prompt credit and the flood credit are taken off, and the total, never below 0.00, is rounded half-up to the cent once, on the final figure only.
    prerequisite:
      - problem: renters_ext_discount_restart_credit
        kind: value_input
        gate: catch_balance
        form: state
        policy_source: >-
          The catch-up amount is fixed only after the premium account carries a multi-policy discount change credit dated the effective date of every qualifying policy that took effect during the renters term while the renters premium carried no multi-policy discount.
        condition: >-
          renters_billing holds a renters_return_premium entry with change_reason multi_policy_discount_change whose effective_date equals the effective_date of every umbrella or valuables policy of the customer that took effect inside the current renters term at a time when no umbrella or valuables policy of the customer was live.
        resolved_by: post_discount_restart_credit_e779526e
        effect: >-
          The restart credit posted on the premium account lowers the account balance, and with it the catch-up amount, by the amount of the credit.
      - problem: renters_ext_late_charge
        kind: value_input
        gate: catch_balance
        form: state
        policy_source: >-
          The catch-up amount is fixed only after each installment of the term left unpaid past its late-fee grace period carries a late charge on the premium account.
        condition: >-
          Every renters_premium_billed entry of the current term whose due_date plus late_fee_grace_days is before today and which the balance still includes has a renters_fee_assessed entry with fee_code late_fee for the same term_effective_date and installment_number.
        resolved_by: assess_late_charge_664a192e
        effect: >-
          The late charge posted on the premium account raises the account balance by its amount, and a late charge posted in the last 12 months moves collection ahead of billing from nothing to the next scheduled installment when exactly one payment was returned.
    cross_category:
      - category: flood
        as: history
        reads: [status, billing_plan, flood_billing.event_type, flood_billing.posted_date]
        note: The FloodGuard plan and its premium payments in 12 months decide the flood household credit on the catch-up.
    compute:
      - catch_charges: "SUM('renters_billing', 'amount', event_type='renters_premium_billed') + SUM('renters_billing', 'amount', event_type='renters_fee_assessed') + SUM('renters_billing', 'amount', event_type='renters_payment_returned') + SUM('renters_billing', 'amount', event_type='renters_additional_premium') + SUM('renters_billing', 'amount', event_type='renters_refund_issued')"
      - catch_credits: "SUM('renters_billing', 'amount', event_type='renters_payment_received') + SUM('renters_billing', 'amount', event_type='renters_fee_waived') + SUM('renters_billing', 'amount', event_type='renters_return_premium') + SUM('renters_billing', 'amount', event_type='renters_balance_written_off')"
      - catch_balance: "RND(catch_charges - catch_credits, 2)"
      - catch_returns_12m: "COUNT('renters_billing', within_months=12, date_field='posted_date', event_type='renters_payment_returned')"
      - catch_late_charges_12m: "COUNT('renters_billing', within_months=12, date_field='posted_date', event_type='renters_fee_assessed', fee_code='late_fee')"
      - catch_next_installment: "LATEST('renters_billing', 'amount', date_field='due_date', event_type='renters_premium_billed')"
      - catch_plan_service_charge: "P('installment_fee_eft') if F('billing_plan') == 'monthly_eft' else P('installment_fee_card')"
      - catch_unbilled_premium: "MX(0, F('term_premium') - SUM('renters_billing', 'amount', event_type='renters_premium_billed', term_effective_date=F('effective_date')))"
      - catch_next_collected: "catch_returns_12m == 1 and catch_late_charges_12m >= 1"
      - catch_ahead_amount: "catch_unbilled_premium if catch_returns_12m >= 2 else ((catch_next_installment + catch_plan_service_charge) if catch_next_collected else 0)"
      - catch_tenure_months: "MONTHS(F('original_effective_date'), NOW)"
      - catch_early_relief: "0 if not catch_next_collected else (catch_plan_service_charge if catch_tenure_months >= K('long_tenure_months') else (catch_plan_service_charge / 2 if catch_tenure_months >= K('mid_tenure_months') else 0))"
      - catch_days_since_return: "DAYS(LATEST('renters_billing', 'posted_date', date_field='posted_date', event_type='renters_payment_returned') or NOW, NOW)"
      - catch_prompt_credit: "K('prompt_credit_eft') if (catch_returns_12m >= 1 and catch_days_since_return <= P('late_fee_grace_days') and F('billing_plan') == 'monthly_eft') else (K('prompt_credit_other') if (catch_returns_12m >= 1 and catch_days_since_return <= P('late_fee_grace_days') and F('billing_plan') != 'monthly_eft') else 0)"
      - catch_card_payments_12m: "COUNT('renters_billing', within_months=12, date_field='posted_date', event_type='renters_payment_received', payment_method='card')"
      - catch_card_charge: "P('installment_fee_card') if catch_card_payments_12m == 0 else (P('installment_fee_eft') if catch_card_payments_12m < K('card_payments_regular') else 0)"
      - catch_flood_plan: "CFIELD('flood', 'billing_plan', status='in_force')"
      - catch_flood_payments_12m: "XCOUNT('flood', 'flood_billing', within_months=12, date_field='posted_date', event_type='flood_payment_received')"
      - catch_flood_credit: "K('flood_credit_full') if (catch_flood_plan == 'annual' and catch_flood_payments_12m >= 1) else (K('flood_credit_part') if catch_flood_plan else 0)"
      - result: "RND(MX(0, MX(0, catch_balance) + catch_ahead_amount - catch_early_relief + catch_card_charge - catch_prompt_credit - catch_flood_credit), 2)"
    compute_basis:
      catch_charges: "The account balance is every installment billed, fee charged, payment returned, additional premium and refund posted on the premium account, less every payment received, fee waived, return premium and write-off posted on it, rounded half-up to the cent."
      catch_credits: "The account balance is every installment billed, fee charged, payment returned, additional premium and refund posted on the premium account, less every payment received, fee waived, return premium and write-off posted on it, rounded half-up to the cent."
      catch_balance: "The account balance is every installment billed, fee charged, payment returned, additional premium and refund posted on the premium account, less every payment received, fee waived, return premium and write-off posted on it, rounded half-up to the cent."
      catch_returns_12m: "when two or more renters payments were returned unpaid in the last 12 calendar months"
      catch_late_charges_12m: "and a late charge was posted on the policy in the last 12 calendar months"
      catch_next_installment: "taken at the amount of the latest installment billed"
      catch_plan_service_charge: "together with the installment service charge of the policy's billing plan, installment_fee_eft on monthly_eft and installment_fee_card on any other plan"
      catch_unbilled_premium: "the unbilled premium of the term, which is the annual premium less every installment already billed for the term and never below 0.00, is collected with the catch-up"
      catch_next_collected: "when exactly one renters payment was returned unpaid in the last 12 calendar months and a late charge was posted on the policy in the last 12 calendar months, the next scheduled installment is collected with the catch-up"
      catch_ahead_amount: "Catch-up collection ahead of billing after dishonoured payments: when two or more renters payments were returned unpaid in the last 12 calendar months, the unbilled premium of the term, which is the annual premium less every installment already billed for the term and never below 0.00, is collected with the catch-up; when exactly one renters payment was returned unpaid in the last 12 calendar months and a late charge was posted on the policy in the last 12 calendar months, the next scheduled installment is collected with the catch-up, taken at the amount of the latest installment billed together with the installment service charge of the policy's billing plan, installment_fee_eft on monthly_eft and installment_fee_card on any other plan; in every other case nothing is collected ahead of billing."
      catch_tenure_months: "the whole months from the renters original effective date to today are long_tenure_months or more"
      catch_early_relief: "Service charge relief on an installment collected early: when the next scheduled installment is collected with the catch-up and the whole months from the renters original effective date to today are long_tenure_months or more, its installment service charge is waived in full; when they are mid_tenure_months or more but fewer than long_tenure_months, half of that service charge is waived; when they are fewer than mid_tenure_months, or no installment is collected early, nothing is waived."
      catch_days_since_return: "when the catch-up is paid no more than late_fee_grace_days calendar days after the latest returned renters payment was posted"
      catch_prompt_credit: "Prompt catch-up credit: when the catch-up is paid no more than late_fee_grace_days calendar days after the latest returned renters payment was posted and the policy is billed monthly_eft, prompt_credit_eft is taken off the catch-up amount; when it is paid within that period and the policy is billed on any other plan, prompt_credit_other is taken off; when it is paid later, or no renters payment was ever returned, no prompt credit applies."
      catch_card_payments_12m: "when no renters payment by card was received in the last 12 calendar months"
      catch_card_charge: "Card service charge on the catch-up: when no renters payment by card was received in the last 12 calendar months, the catch-up carries installment_fee_card; when one or more but fewer than card_payments_regular renters payments by card were received in the last 12 calendar months, it carries installment_fee_eft; when card_payments_regular or more were received by card, it carries no card service charge."
      catch_flood_plan: "when the customer holds a FloodGuard policy in force billed on the annual plan"
      catch_flood_payments_12m: "and at least one FloodGuard premium payment was received in the last 12 calendar months"
      catch_flood_credit: "Flood household credit on the catch-up: when the customer holds a FloodGuard policy in force billed on the annual plan and at least one FloodGuard premium payment was received in the last 12 calendar months, flood_credit_full is taken off the catch-up amount; when the customer holds a FloodGuard policy in force billed on another plan, or with no FloodGuard premium payment received in the last 12 calendar months, flood_credit_part is taken off; when the customer holds no FloodGuard policy in force, no flood credit applies."
      result: "The amount collected ahead of billing and the card service charge are added to the account balance, the service charge relief, the prompt credit and the flood credit are taken off, and the total, never below 0.00, is rounded half-up to the cent once, on the final figure only."
    factors:
      - id: catch_ahead_of_billing
        effect: method
        decides: catch_ahead_amount
        bindings: [catch_returns_12m, catch_late_charges_12m, catch_next_installment, catch_plan_service_charge, catch_unbilled_premium, catch_next_collected, catch_ahead_amount]
        ladder:
          - when: "two or more renters payments returned unpaid in the last 12 calendar months"
            method: "the unbilled premium of the term is collected: the annual premium less every installment already billed for the term, never below 0.00"
          - when: "exactly one renters payment returned unpaid in the last 12 calendar months and a late charge posted in the last 12 calendar months"
