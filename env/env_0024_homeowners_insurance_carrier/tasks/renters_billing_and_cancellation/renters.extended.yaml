  - id: renters_ext_reinstatement_fee
    base_policy_refs: [renters_reinstatement, renters_fees_and_waivers]
    overwrite:
      - base_policy: renters_reinstatement
        superseded_clause: >-
          Reinstatement is without a lapse: the term is unchanged, the reinstatement fee is charged, and the cancellation credit is reversed by one renters_additional_premium entry with change_reason reinstatement_reversal for the same amount, referencing that credit and dated the reinstatement date.
        replaced_by: >-
          Reinstatement is without a lapse: the term is unchanged, the reinstatement fee worked out below is charged as one fee entry with fee_code reinstatement_fee, the cancellation credit is reversed by one additional premium entry with change_reason reinstatement_reversal for the same amount, referencing that credit and dated the reinstatement date, and the signed statement of no loss is marked completed.
    trigger: on_request
    subject: [renters_policy_reinstated]
    computes: reinstatement_fee
    target_tool: reinstate_lapsed_policy_e7e59896
    params:
      large_cure_threshold: 50.00
      large_cure_tenure_months: 24
      large_cure_rate_long_pct: 20
      large_cure_rate_short_pct: 25
      quick_lapse_days: 7
      long_lapse_days: 20
      quick_lapse_multiplier: 0.5
      long_lapse_multiplier: 1.5
      late_add_high: 4.00
      late_add_low: 2.00
      landlord_long_months: 36
      landlord_mid_months: 12
      landlord_relief_long: 3.00
      landlord_relief_mid: 1.50
      paid_claim_add: 5.00
      reported_claim_add: 2.00
    rule: >-
      Reinstatement is without a lapse: the term is unchanged, the reinstatement fee worked out below is charged as one fee entry with fee_code reinstatement_fee, the cancellation credit is reversed by one additional premium entry with change_reason reinstatement_reversal for the same amount, referencing that credit and dated the reinstatement date, and the signed statement of no loss is marked completed.
      The reinstatement is not recorded until the premium account shows a payment received on or after the cancellation date that covers the cure amount.
      The reinstatement fee is worked out in this order.
      The reinstatement fee is the tier's reinstatement_fee, rounded half-up to the cent.
      A tier whose reinstatement_fee is 0.00 charges no reinstatement fee at all.
      Reinstatement fee basis by the size of the cure: the cure payment is the latest renters payment received on or after the cancellation date; when the cure payment is large_cure_threshold or more and the whole months from the renters original effective date to today are large_cure_tenure_months or more, the fee basis is large_cure_rate_long_pct percent of the cure payment, rounded half-up to the cent; when the cure payment is large_cure_threshold or more and those whole months are fewer than large_cure_tenure_months, the fee basis is large_cure_rate_short_pct percent of the cure payment, rounded half-up to the cent; when the cure payment is below large_cure_threshold, the fee basis is the tier's reinstatement_fee.
      Reinstatement fee scaling by lapse age: the calendar days from the cancellation date recorded as closed date to today are counted; when they are quick_lapse_days or fewer, the fee basis is multiplied by quick_lapse_multiplier; when they are more than long_lapse_days, it is multiplied by long_lapse_multiplier; when they are more than quick_lapse_days but no more than long_lapse_days, it is taken once.
      Reinstatement fee addition for late charges: when two or more late charges were posted on the policy in the last 12 calendar months, late_add_high is added to the fee; when exactly one was posted, late_add_low is added; when none was posted, nothing is added.
      Reinstatement fee addition for the claim record: when a renters claim payment was issued on the policy in the last 36 calendar months, paid_claim_add is added to the fee; when a renters claim was reported in the last 36 calendar months but no claim payment was issued in that period, reported_claim_add is added; when no renters claim was reported in the last 36 calendar months, nothing is added.
      Reinstatement fee relief for a landlord customer: when the customer holds a LandlordGuard policy in force whose original effective date is landlord_long_months whole months or more before today, landlord_relief_long is taken off the fee; when that LandlordGuard policy's original effective date is landlord_mid_months or more but fewer than landlord_long_months whole months before today, landlord_relief_mid is taken off; when the customer holds no LandlordGuard policy in force, or one held fewer than landlord_mid_months whole months, no relief applies.
      The fee basis is scaled by lapse age first, the additions are then added and the relief taken off, and the total, never below 0.00, is rounded half-up to the cent once, on the final figure only.
    prerequisite:
      - problem: renters_ext_reinstatement_cure
        kind: value_input
        gate: fee_cure_payment
        form: state
        policy_source: >-
          The reinstatement is not recorded until the premium account shows a payment received on or after the cancellation date that covers the cure amount.
        condition: >-
