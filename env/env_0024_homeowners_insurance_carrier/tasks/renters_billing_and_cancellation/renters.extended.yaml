        evidence: [history, tier_param]
        cross_difficulty: null
      - id: catch_flood_household_credit
        effect: parameter
        decides: catch_flood_credit
        bindings: [catch_flood_plan, catch_flood_payments_12m, catch_flood_credit]
        ladder:
          - when: "a FloodGuard policy in force billed on the annual plan and at least one FloodGuard premium payment received in the last 12 calendar months"
            value: "K('flood_credit_full') = 3.00 taken off"
          - when: "a FloodGuard policy in force billed on another plan, or with no FloodGuard premium payment in the last 12 calendar months"
            value: "K('flood_credit_part') = 1.00 taken off"
          - when: "no FloodGuard policy in force"
            value: "no flood credit"
        baseline:
          catch_flood_credit: "0"
        evidence: [cross_category, history]
        cross_difficulty: flood
    baseline:
      rule: >-
        The catch-up amount is worked out in this order.
        The account balance is every installment billed, fee charged, payment returned, additional premium and refund posted on the premium account, less every payment received, fee waived, return premium and write-off posted on it, rounded half-up to the cent.
        The catch-up amount is the account balance, never below 0.00, rounded half-up to the cent.
      params: []
    inputs:
