        cross_difficulty: null
      - id: catch_early_service_charge_relief
        effect: parameter
        decides: catch_early_relief
        bindings: [catch_tenure_months, catch_early_relief]
        ladder:
          - when: "an installment is collected early and 36 or more whole months since the renters original effective date"
            value: "its whole installment service charge waived"
          - when: "an installment is collected early and 24 to 35 whole months since the renters original effective date"
            value: "half its installment service charge waived"
          - when: "fewer than 24 whole months, or no installment collected early"
            value: "nothing waived"
        baseline:
          catch_early_relief: "0"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: catch_prompt_credit
