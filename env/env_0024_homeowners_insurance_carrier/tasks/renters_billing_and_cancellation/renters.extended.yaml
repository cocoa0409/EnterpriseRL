      params: [autopay_discount_pct, multi_policy_discount_pct, minimum_annual_premium, min_premium_change]
    inputs:
      history:
        - {table: renters_claims, aggregate: count, field: renters_claim_entry_id, within_months: 60, filters: {event_type: renters_claim_reported}}
        - {table: renters_claims, aggregate: count, field: renters_claim_entry_id, within_months: 36, filters: {event_type: renters_claim_payment}}
