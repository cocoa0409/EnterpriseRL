        - {table: renters_billing, aggregate: count, field: renters_billing_id, within_months: 12, filters: {event_type: renters_payment_returned}}
        - {table: renters_billing, aggregate: count, field: renters_billing_id, within_months: 12, filters: {event_type: renters_fee_assessed, fee_code: late_fee}}
        - {table: renters_billing, aggregate: count, field: renters_billing_id, within_months: 12, filters: {event_type: renters_payment_received, payment_method: card}}
