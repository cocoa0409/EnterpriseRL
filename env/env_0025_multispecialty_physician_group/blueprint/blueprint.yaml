# The blueprint of env_0025_multispecialty_physician_group. Output of the erl-scenario-blueprint skill.
# Path: env/env_0025_multispecialty_physician_group/blueprint/blueprint.yaml

name: env_0025_multispecialty_physician_group
company: Linden Ridge Medical Group

background: |
  Linden Ridge Medical Group is a physician-owned multispecialty group in central Ohio, with about 240 physicians and advanced practice clinicians working from 31 clinic locations around Columbus, Dublin, Westerville, Hilliard and Delaware.
  It provides primary care, pediatrics, obstetrics and gynecology, behavioral health, a dozen medical and surgical specialties, physical therapy and in-house advanced imaging, and its Patient Services Center answers patients by phone and through the MyLinden portal in a warm, plain-spoken voice.
  Every registered patient holds one Patient Financial Account, carried on one of seven financial classes: Medicaid Managed Care Account, Self-Pay Account, Medicare Part B Account, Medicare Advantage Account, Commercial HMO/EPO Account, Commercial PPO/POS Account or High-Deductible Health Plan Account; the account books every charge, copay, payment, adjustment, refund and statement of the patient's care.
  In-person care is held as booked In-Person Appointments of seven visit types, from the Nurse Visit, Established Patient Office Visit, New Patient Office Visit and Annual Preventive Exam to the Specialist Consultation, In-Office Procedure Visit and Advanced Imaging Appointment, each running from booking through check-in to completion, cancellation or a missed visit, with fees and booking deposits booked against it.
  Virtual Care encounters run alongside them as the Portal E-Visit, Audio-Only Phone Visit, Primary Care Video Visit, Behavioral Health Video Visit, Specialty Video Follow-Up and On-Demand Virtual Urgent Care, with prepayments and fees booked per encounter.
  Referrals & Prior Authorizations are held as cases of seven kinds, the In-Group Specialist Referral, HMO Specialist Referral, Standing Specialist Referral, Out-of-Network Referral, Physical Therapy Episode Authorization, Advanced Imaging Prior Authorization and Outpatient Procedure Prior Authorization, each carrying a ledger of authorized units granted, used, restored and lapsed.
  Prescriptions & Renewals are held one prescription at a time as an Acute Short-Course Prescription, Standard Maintenance Prescription, Monitored Maintenance Prescription, Schedule III-V Controlled Prescription, Schedule II Controlled Prescription or Specialty Medication Prescription, and each keeps a ledger of fills authorized, dispensed and voided.
  Patient Payment Plans spread patient balances over the 3-Month Interest-Free Plan, 6-Month Interest-Free Plan, 12-Month Interest-Free Plan, 18-Month Extended Plan, 24-Month Extended Plan or Financial Hardship Plan, booking enrolled charges, installments, extra payments and releases.
  Medical Records Requests are held one release at a time as a Portal Self-Service Download, Patient Electronic Copy Request, Patient Paper Copy Request, Provider-to-Provider Transfer, Third-Party Authorized Release, Certified Legal Records Package or Imaging Disc Copy Request, each with its own fee ledger.
  Linden Memberships add a monthly or annual membership on top of insurance or self-pay as the Linden Connect Virtual Membership, Linden Essential Membership, Linden Family Membership, Linden Plus Membership, Linden Premier Concierge Membership or Linden Executive Health Membership, booking dues and member visit credits.
  About 310,000 active patients use the group, most insured through Ohio's commercial carriers, Medicare, Medicare Advantage plans or Medicaid managed care plans, with a steady minority paying for themselves.
  Callers are patients, parents calling for children, and adult children helping aging parents.
  A typical caller holds one financial account, a few upcoming or recent appointments, one or two referrals, several prescriptions and sometimes a payment plan, a membership or an open records request.
  They bring histories of copays and statements, rescheduled and missed visits, insurance changes mid-year, authorizations that ran short and renewals that stalled waiting on a visit or a lab.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: appointment_scheduling_and_attendance
    claim:
      categories: [appointment]
      event_types: [appointment_booked, appointment_rescheduled, appointment_cancelled, appointment_fee_assessed, appointment_fee_waived, appointment_deposit_collected, appointment_deposit_released]
    summary: >
      Patients and parents call to book, move or cancel in-person visits and to contest the no-show and
      late-cancellation fees that land on their statements, and their settings differ by visit type (a Nurse
      Visit and an Advanced Imaging Appointment carry very different notice windows, fees and deposits), by the
      appointment's status and reschedule history, by the financial class on the patient's billing account
      (a Self-Pay Account owes a booking deposit, a Medicaid Managed Care Account is never charged an
      appointment fee, a Commercial HMO/EPO Account needs a referral for specialty, procedure and imaging
      visits), and by the patient's record of missed visits across all appointments. The records involved are
      the appointment itself (scheduled date and time, cancel timing, reschedule count, deposit held), its fee
      and deposit ledger, the patient's other appointments, the referral a visit is booked against and the
      billing account's tier on the visit date; the governing rules are the booking caps and duplicate check
      of appointment_agg_open_booking_cap, the referral and authorization gate of
      appointment_booking_eligibility, the timely-versus-late classification of
      appointment_cancellation_timing, the per-visit-type fee of appointment_no_show_fee with its first-offense
      and Medicaid exemptions, the documentation window of appointment_fee_waiver, the reschedule limit of
      appointment_reschedule, and the deposit disposition of appointment_booking_deposit, while visits
      naturally move from booking through confirmation and check-in to completion, cancellation or a missed
      visit. Booking, rescheduling, cancelling on the patient's request, assessing or waiving a fee and
      collecting or releasing a deposit are agent service actions on a verified patient, whereas confirming
      attendance is the patient's own act. Requests the rules cannot decide, such as reversing a same-day-only
      booking restriction or a dismissal (decisions reserved to the practice manager), compensating travel
      costs or lost wages after a clinic cancellation, or booking a named outside clinician who does not
      practice at the group, have no policy path and go to a human with reason POLICY_NOT_COVERED.

  - name: patient_balance_and_coverage_resolution
    claim:
      categories: [billing]
      event_types: [billing_coverage_updated, billing_adjustment_posted, billing_payment_posted, billing_refund_issued, billing_hold_placed, billing_hold_released, billing_charge_posted]
    summary: >
      Patients call about what they owe: a statement they do not recognise, insurance they forgot to report or
      that changed mid-year, a discount they believe they earned, a credit they want back, a returned payment,
      or a charge they want paused while it is reviewed, and the same question resolves differently across the
      seven financial classes, the account's status (active, on hold, in final notice or with an agency), the
      charge's date of service relative to coverage changes, and the history of statements, payments and
      adjustments already applied to each charge. The records involved are the Patient Financial Account (tier,
      coverage dates, copays and deductible, hold reason, hardship approval, balance), its ledger of charges,
      payments, adjustments, refunds and statements linked by the charge each entry applies to, the patient's
      billing cases, and, from other lines, the payment plan that may have enrolled a charge and the appointment
      or virtual-care fee that produced one; the governing rules are billing_coverage_verification and
      billing_retro_coverage_rebill for coverage and the payer's filing limit, billing_prompt_pay_discount and
      billing_self_pay_discount with their stacking and mutual exclusion against billing_hardship_adjustment,
      billing_payment_application, billing_credit_balance_refund with its hold period, billing_returned_payment,
      billing_review_hold with its dispute window, billing_estimate_dispute for self-pay estimates,
      billing_late_fee, billing_noncovered_and_liability and billing_statement_escalation, while charges
      naturally move from posting through statements to payment, final notice or agency placement. Recording a
      coverage change, posting payments, adjustments, refunds and fee charges, and placing or releasing a hold
      are agent actions on a verified patient, while confirming an account closure is the patient's own act.
      Requests outside every rule, such as settling a balance for a negotiated lump sum, removing a debt from
      a credit report, disputing the clinical necessity of a service that was rendered, or moving a child's
      charges to the other parent's account, go to a human with reason POLICY_NOT_COVERED.

  - name: referral_and_authorization_management
    claim:
      categories: [referral]
      event_types: [referral_requested, referral_appeal_filed, referral_validity_extended, referral_provider_changed, referral_unit_restored, referral_cancelled, referral_units_granted]
    summary: >
      Patients call because a specialist visit, a course of physical therapy, an MRI or a procedure is held up
      by a referral or prior authorization: it was denied, it is about to expire or has run out of visits, a
      visit was counted against it in error, they want a different provider, or they want an out-of-network
      specialist, and each situation turns on the referral's kind, its status and decision history, its validity
      dates and units remaining, the extensions already used, and the patient's financial class and primary
      care clinician of record. The records involved are the referral (type, specialty, rendering provider,
      decision date, validity, units remaining, extension count, denial reason, appeal level), its unit ledger
      of grants, uses by encounter, restorations and lapses, the patient's service requests on it, the
      appointments and virtual visits booked against it and the billing account's tier; the governing rules are
      referral_agg_overlap for duplicates and the standing-versus-HMO exclusion,
      referral_submission_and_decision for the PCP-of-record and HMO-tier requirements, referral_unit_accounting
      for grants, weekly caps and the restore window, referral_validity_extension for extension status and caps,
      referral_denial_and_appeal for the appeal window and levels, referral_provider_change,
      referral_retro_authorization and referral_out_of_network, while cases naturally move from request through
      submission and decision to use, exhaustion, expiry or cancellation. Opening, extending, changing the
      provider on, restoring units to and cancelling a referral are agent actions, while filing an appeal that
      needs the patient's consent and signing an out-of-network cost-share acknowledgement are the patient's own
      acts. Requests no rule decides, such as asking the group to guarantee payment of a service the payer
      denied, insisting on a specific outside surgeon the payer did not name, or moving an authorization to a
      family member, go to a human with reason POLICY_NOT_COVERED.

  - name: prescription_renewal_handling
    claim:
      categories: [rx]
      event_types: [rx_renewal_requested, rx_renewed, rx_renewal_held, rx_bridge_supply_authorized, rx_pharmacy_changed, rx_fills_authorized, rx_fills_voided]
    summary: >
      Patients call because they are running out of a medication: they want a renewal, an early fill before a
      trip, a short bridge supply while they wait for a visit, a replacement for lost medication, or their
      prescription moved to another pharmacy, and the answer depends on the prescription's class (acute,
      maintenance, lab-monitored, Schedule III-V or Schedule II controlled, specialty), its status, fills
      remaining and expiration, and how recently the patient was seen by the prescribing department, had
      monitoring labs or drug screens, signed a controlled-substance agreement or had a database check. The
      records involved are the prescription (prescriber and department, pharmacy, expiration, hold reason, prior
      authorization status, monitoring dates, transfer count), its fill ledger, and the patient's completed and
      upcoming appointments in the prescribing department; the governing rules are rx_renewal_eligibility with
      its post-expiry and visit-interval windows, rx_fill_authorization for how many fills a renewal grants and
      how the old ones are voided, rx_fill_timing for early-refill thresholds and travel overrides,
      rx_bridge_supply with its tie to a booked visit, rx_hold_lapse, rx_controlled_safeguards,
      rx_pharmacy_transfer, rx_lost_stolen_replacement and rx_specialty_access, while prescriptions naturally
      move from transmission through renewal requests, holds and approvals to expiry or discontinuation.
      Logging a renewal request, approving it under the nurse protocol where the class allows, placing it on
      hold, authorizing bridge or replacement fills and changing the pharmacy are agent actions, while signing
      a controlled-substance agreement is the patient's own act. Requests outside every rule, such as a
      prescription for a medication the patient was never prescribed, a prescription in a family member's
      name, or a clinical question about side effects or interactions, go to a human with reason
      POLICY_NOT_COVERED.

  - name: payment_plan_servicing
    claim:
      categories: [payplan]
      event_types: [payplan_proposed, payplan_balance_enrolled, payplan_extra_payment, payplan_modified, payplan_cured, payplan_reinstated, payplan_balance_adjusted, payplan_installment_paid]
    summary: >
      Patients call to spread a balance they cannot pay at once, to add new charges to an existing plan, to
      change a due day or pause installments, to catch up after missed installments, to reinstate a defaulted
      plan or to pay one off, and their options differ by the plan tier and its balance range, the plan's status
      and delinquency history, the charges eligible for enrollment on the billing account (post-adjudication,
      not disputed, not already enrolled, possibly already with an agency), the patient's history of earlier
      defaults, and any hardship approval on the billing account. The records involved are the payment plan
      (tier, term, installment, due day, remaining balance, autopay, delinquency and default dates, modification
      and reinstatement counts), its ledger of enrollments, installments, extra payments, reductions and
      releases linked to billing charges, and the Patient Financial Account those charges live on; the governing
      rules are payplan_agg_multi_holding and payplan_agg_default_history, the down-payment and installment
      computation of payplan_enrollment_terms, payplan_charge_eligibility, payplan_agreement_and_activation with
      its proposal validity, payplan_installments_and_delinquency with grace and cure windows,
      payplan_add_on_and_modification, payplan_prepayment_and_reduction, payplan_release_and_reinstatement and
      payplan_hardship_plan_terms, while plans naturally move from proposal through signature to active
      servicing and on to payoff, cancellation or default. Proposing a plan, enrolling charges, posting
      installments and extra payments, recording modifications, cures, reinstatements and reductions are agent
      actions, whereas signing the installment agreement and cancelling the plan are the patient's own acts.
      Requests the rules do not cover, such as settling the plan for a reduced lump sum, moving the plan to a
      different guarantor, or folding a hospital's separate bill into the group's plan, go to a human with
      reason POLICY_NOT_COVERED.
