# Policy charter: Patient Financial Account (the guarantor billing account of one patient).
# Path: env/env_0025_multispecialty_physician_group/blueprint/products/billing.yaml

category: billing
display_name: Patient Financial Account

binding:
  holding_table: billing_accounts
  event_tables: [billing_transactions]
  intake_tables: [billing_cases]
  status_field: status
  variant_field: variant_name
  quantity_fields: {patient_balance: patient_balance}

lifecycle:
  states: [registered, active, billing_hold, precollection, collections, closed]
  transitions:
    - {from: registered, to: active, by: agent, means: "Coverage on file is verified with the payer (or the uninsured attestation is recorded) and the account starts receiving patient-responsibility postings and statements."}
    - {from: active, to: billing_hold, by: agent, means: "Statements, late fees and escalation are paused while a balance dispute, insurance review, hardship review or estate review is open."}
    - {from: precollection, to: billing_hold, by: agent, means: "A dispute or review opened during the final-notice period pauses the escalation to an outside agency."}
    - {from: billing_hold, to: active, by: agent, means: "The review that placed the hold is resolved and the ordinary statement cycle resumes."}
    - {from: active, to: precollection, by: system, means: "The final notice is issued after the tier's series of statements has gone unpaid."}
    - {from: precollection, to: active, by: agent, means: "The account is brought current during the final-notice period: the past-due balance is paid down below the placement minimum or enrolled in a payment plan."}
    - {from: precollection, to: collections, by: system, means: "The past-due balance is placed with the group's outside collection agency after the final-notice period expires."}
    - {from: collections, to: active, by: agent, means: "The agency placement is recalled because the balance was paid in full, insurance paid it, or it was placed in error."}
    - {from: active, to: closed, by: user, means: "The patient closes the financial account on leaving the practice; only the patient can confirm the closure, and it lands first as an account-closure case."}

accounts:
  - key: patient_balance
    unit: USD
    meaning: "Amount the patient (guarantor) owes the group after insurance adjudication; charges and reversed payments raise it, payments, copays and adjustments lower it, and a refund of a credit brings a negative (credit) balance back toward zero."

parameter_schema:
  statement_cycle_days: "Calendar days between two consecutive patient statements while a balance is owed; integer, days."
  statements_before_final_notice: "Number of consecutive statements that may go unpaid before the final notice is issued; integer, count."
  final_notice_to_collections_days: "Calendar days from the final notice to placement with the outside collection agency; integer, days."
  collections_min_balance_usd: "Minimum past-due balance that may be placed with the collection agency; below it the balance stays in-house; USD."
  small_balance_writeoff_usd: "Remaining balance at or below which the account's residual is administratively written off at the final-notice step instead of escalating; USD."
  prompt_pay_discount_pct: "Discount percentage granted when the patient pays a charge's full remaining balance inside the prompt-pay window; percent, 2 decimals; 0.00 means not offered."
  prompt_pay_window_days: "Calendar days, counted from the posting date of the charge, within which a full payment earns the prompt-pay discount; integer, days."
  prompt_pay_min_balance_usd: "Minimum remaining balance of a charge for the prompt-pay discount to apply; USD."
  self_pay_discount_pct: "Uninsured discount applied to the gross fee-schedule charge of a self-pay service at posting; percent, 2 decimals; 0.00 means not applicable."
  copay_collect_at_checkin: "Whether the fixed copay printed on the insurance card is collected at check-in; boolean."
  deductible_estimate_collect_pct: "Share of the estimated deductible or coinsurance for the visit collected at the time of service; percent, 2 decimals."
  pos_estimate_cap_usd: "Maximum amount collected at the time of service toward an estimated deductible, coinsurance or self-pay estimate for one encounter; USD."
  returned_payment_fee_usd: "Fee posted when a check or ACH payment is returned unpaid by the bank; USD."
  returned_payments_before_restriction: "Number of returned payments within the restriction look-back after which check and ACH are no longer accepted; integer, count."
  returned_payment_restriction_months: "Rolling look-back, in calendar months, over which returned payments are counted and during which the check/ACH restriction then lasts; integer, months."
  refund_threshold_usd: "Minimum credit balance that is refunded to the payer of the credit; smaller credits remain on the account for future charges; USD."
  credit_balance_hold_days: "Calendar days a credit balance is held before refund, to let pending insurance claims and crossovers finish; integer, days."
  refund_processing_business_days: "Business days (Monday-Friday excluding group holidays) to issue an approved refund after the hold ends; integer."
  insurance_pending_hold_days: "Calendar days after the date of service during which the patient is not statemented for a charge whose claim is still pending with the payer; integer, days."
  timely_filing_days: "Payer filing limit: calendar days after the date of service within which a claim must be filed with this tier's payer; 0 means no payer to bill; integer, days."
  balance_billing_permitted: "Whether the patient may be billed above the payer-determined patient responsibility; boolean."
  noncovered_waiver_required: "Whether a signed advance notice of non-coverage (ABN or payer waiver) must be on file before a non-covered service is billed to the patient; boolean."
  hardship_adjustment_max_pct: "Maximum percentage of a charge's remaining balance that an approved financial-hardship review may adjust off; percent, 2 decimals."
  hardship_review_business_days: "Business days to decide a complete financial-hardship application; integer."
  dispute_window_days: "Calendar days after the statement date that first billed a charge within which the patient may dispute that charge; integer, days."
  dispute_hold_max_days: "Maximum calendar days an account may stay on billing hold for one dispute before the hold must be released; integer, days."
  itemized_statement_fee_usd: "Fee for an itemized statement of services; USD."
  itemized_statement_business_days: "Business days to deliver a requested itemized statement; integer."
  late_fee_usd: "Late fee posted once per past-due statement when no payment is received by the late-fee day; USD; 0.00 means not charged."
  late_fee_after_days: "Calendar days after a statement date after which an unpaid statement balance is past due for the late fee; integer, days."
  late_fee_max_per_12_months: "Maximum late fees posted on one account in the rolling 12 months; integer, count."
  late_fee_partial_payment_pct: "Share of a statement balance which, paid before the late-fee day, prevents the late fee; percent, 2 decimals."
  coverage_reverification_days: "Calendar days after the last eligibility verification after which coverage must be re-verified before the next posting to the payer; integer, days."
  card_on_file_required: "Whether a payment card must be kept on file for post-adjudication balances; boolean."
  card_on_file_max_auto_charge_usd: "Maximum amount charged automatically to the card on file for one encounter's post-adjudication balance; USD; 0.00 means no automatic charging."
  card_on_file_notice_days: "Calendar days of advance notice given before the card on file is charged; integer, days."
  gfe_required: "Whether a Good Faith Estimate must be issued for scheduled services (No Surprises Act uninsured/self-pay estimate); boolean."
  gfe_dispute_threshold_usd: "Amount by which the billed total for an encounter must exceed its Good Faith Estimate for the patient to be eligible for the billed-versus-estimate dispute; USD."
  gfe_dispute_window_days: "Calendar days after the date of the first bill for the encounter within which the patient may start the billed-versus-estimate dispute; integer, days."
  gfe_delivery_business_days_short_lead: "Business days within which the Good Faith Estimate is delivered when the service is scheduled 3 to 9 business days ahead; integer."
  gfe_delivery_business_days_long_lead: "Business days within which the Good Faith Estimate is delivered when the service is scheduled 10 or more business days ahead; integer."
  statement_delivery_default: "Default statement delivery channel for a new account (paperless or mail); enum string."
  secondary_claim_billing: "Whether a secondary coverage on file is billed before the remaining balance becomes patient responsibility; boolean."
  copay_hardship_waiver_permitted: "Whether a copay may be waived case by case on an approved documented financial hardship; boolean."
  payment_allocation_order: "Order in which an undesignated payment is applied across open charges; enum string."
  hsa_fsa_card_accepted: "Whether HSA/FSA debit cards are accepted as a payment method; boolean."
  estate_hold_days: "Calendar days the account of a deceased patient stays on estate-review hold before statements go to the estate representative; integer, days."
  collections_recall_on_insurance_payment: "Whether an agency placement is recalled when a late insurance payment reduces the placed balance; boolean."
  cob_response_days: "Calendar days the patient has to return a coordination-of-benefits questionnaire requested by the payer before the pended charge becomes patient responsibility; integer, days."
  account_closure_zero_balance_required: "Whether the account must carry a zero balance before a closure request can take effect; boolean."

