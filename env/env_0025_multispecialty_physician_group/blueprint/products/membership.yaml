# Policy charter: Linden Memberships (direct primary care and concierge memberships; one membership per holding).
# Path: env/env_0025_multispecialty_physician_group/blueprint/products/membership.yaml

category: membership
display_name: Linden Memberships

binding:
  holding_table: memberships
  event_tables: [membership_events]
  intake_tables: [membership_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {credits_remaining: member_visit_credits}

lifecycle:
  states: [pending, active, frozen, past_due, cancellation_pending, cancelled, terminated]
  transitions:
    - {from: pending, to: active, by: system, means: "The first dues (and any enrollment fee) are paid and the membership starts."}
    - {from: pending, to: cancelled, by: agent, means: "An enrollment is abandoned before the first dues are paid."}
    - {from: active, to: frozen, by: user, means: "The member freezes the membership for a permitted period; only the member can ask for it."}
    - {from: frozen, to: active, by: system, means: "The freeze period ends and the membership resumes."}
    - {from: active, to: past_due, by: system, means: "Dues remain unpaid after the payment grace days."}
    - {from: past_due, to: active, by: agent, means: "The overdue dues (and any reinstatement fee) are paid."}
    - {from: past_due, to: terminated, by: system, means: "Dues remain unpaid past the termination threshold."}
    - {from: active, to: cancellation_pending, by: user, means: "The member gives notice of cancellation; only the member can end the membership."}
    - {from: frozen, to: cancellation_pending, by: user, means: "A frozen member gives notice of cancellation."}
    - {from: cancellation_pending, to: active, by: user, means: "The member rescinds the notice before it takes effect."}
    - {from: cancellation_pending, to: cancelled, by: system, means: "The notice period ends and the cancellation takes effect."}

accounts:
  - key: member_visit_credits
    unit: visits
    meaning: "Member visit credits available in the current period: monthly allotments (and rollovers) add, member visits and period-end or closing expiries subtract."

parameter_schema:
  monthly_dues_usd: "Dues per calendar month on the monthly cycle; 0.00 where only the annual cycle exists; USD."
  annual_dues_usd: "Dues per membership year on the annual cycle; USD."
  billing_cycles_allowed: "Dues cycles offered: monthly-annual or annual; enum string."
  enrollment_fee_usd: "One-time enrollment fee charged with the first dues; USD."
  enrollment_payment_days: "Calendar days after enrollment within which the first dues must be paid before the enrollment is abandoned; integer, days."
  included_dependents: "Dependents covered by the base dues; integer, count."
  dependent_add_on_usd: "Monthly dues per dependent beyond included_dependents (annual cycle: twelve times this); USD."
  max_dependents: "Maximum dependents on one membership; integer, count."
  min_commitment_months: "Calendar months from activation before the membership may end without an early termination fee; integer, months."
  early_termination_fee_usd: "Fee when a cancellation takes effect before the commitment ends; USD."
  cancellation_notice_days: "Calendar days between the cancellation notice and its effective date; integer, days."
  freeze_allowed: "Whether the membership may be frozen; boolean."
  freeze_max_months_per_membership_year: "Maximum months frozen per membership year (activation anniversary to anniversary); integer, months."
  freeze_min_notice_days: "Calendar days of notice before a freeze starts; integer, days."
  freeze_fee_usd: "Holding fee per frozen month instead of dues; USD."
  included_visit_credits_per_month: "Member visit credits granted at the start of each calendar month of membership; integer, visits."
  credits_rollover: "Whether unused credits roll into the next month; boolean."
  max_rollover_credits: "Largest number of credits that may roll over; integer, visits."
  same_day_guarantee: "Whether a same-day visit is guaranteed when requested before the cutoff; boolean."
  same_day_request_cutoff_hour: "Hour of the day (24-hour clock) before which a same-day request is guaranteed; 0 means no guarantee; integer."
  message_response_hours: "Hours within which a member's portal message gets a clinician reply; integer, hours."
  virtual_visits_included: "Whether virtual visits with the member's care team use credits instead of being charged; boolean."
  after_hours_physician_access: "Whether the member can reach an on-call group physician directly after hours; boolean."
  home_visits_per_year: "Home visits included per membership year; integer, count."
  executive_physical_included: "Whether a comprehensive executive physical is included each membership year; boolean."
  annual_wellness_included: "Whether an annual wellness visit is included without using a credit; boolean."
  lab_panel_discount_pct: "Discount on in-house lab panels for self-paid labs; percent."
  imaging_discount_pct: "Discount on self-paid in-house imaging; percent."
  dedicated_physician: "Whether the member has a named physician with a capped panel; boolean."
  appointment_length_minutes: "Standard length of a member visit; integer, minutes."
  insurance_billed_for_visits: "Whether member primary care visits are also billed to the member's insurance; boolean."
  member_visit_copay_waived: "Whether no copay or visit charge applies to member primary care visits (only where insurance is not billed); boolean."
  guest_passes_per_year: "Visits per membership year a member may give to a non-member guest; integer, count."
  payment_grace_days: "Calendar days after a dues due date before the membership becomes past due; integer, days."
  termination_after_past_due_days: "Calendar days in past_due after which the membership is terminated; integer, days."
  reinstatement_fee_usd: "Fee to reinstate a past-due membership; USD."
  rejoin_waiting_months: "Calendar months after a termination for non-payment before the patient may enroll again; integer, months."
  upgrade_proration: "Whether an immediate upgrade is charged the prorated difference for the rest of the current month; boolean."
  upgrade_effective: "When an upgrade takes effect: immediate or next_period; enum string."
  downgrade_effective: "When a downgrade takes effect: next_period; enum string."
  tier_change_min_interval_months: "Minimum calendar months between two tier changes; integer, months."
  age_min_years: "Youngest age for the primary member; integer, years."
  dependent_age_max_years: "Age at which a dependent leaves the family membership; 0 means no dependents; integer, years."
  pharmacy_at_cost_access: "Whether generic medications are dispensed in-office at wholesale cost; boolean."
  care_coordination_included: "Whether a care coordinator manages referrals and authorizations for the member; boolean."
  travel_medicine_included: "Whether pre-travel consultations and vaccine counselling are included; boolean."
  annual_price_lock: "Whether dues are locked for the membership year; boolean."
  annual_refund_basis: "Refund of annual dues on cancellation: prorated_full_months, prorated_after_commitment or none_after_cooling_off; enum string."
  cooling_off_days: "Calendar days after enrollment within which a cancellation refunds all dues and the enrollment fee; integer, days."

