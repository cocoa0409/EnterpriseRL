events:
  - type: membership_enrolled
    target: memberships
    mutation: create
    meaning: "A patient enrolls in a membership tier on a chosen dues cycle."
    grain: "One row per membership."
    fields:
      customer_id: "The primary member."
      variant_name: "Membership tier (official tier name)."
      status: "Always pending on creation."
      enrolled_date: "Enrollment date."
      billing_cycle: "monthly or annual."
      dues_amount_usd: "Dues per cycle including dependent add-ons."
      dependents_count: "Dependents covered."
      credits_remaining: "0 on creation."
    triggers: []
  - type: membership_activated
    target: memberships
    mutation: {transition: {from: pending, to: active}}
    meaning: "The first dues are paid and the membership starts."
    grain: "One row per transaction."
    fields:
      status: "Set to active."
      activated_date: "Start date."
      commitment_end_date: "Activation date plus min_commitment_months."
      current_period_start: "First day of the first period (the activation date)."
    triggers:
      - event: membership:membership_credits_granted
        map: {event_date: activated_date, period_start: current_period_start, grant_reason: period_allotment}
  - type: membership_enrollment_abandoned
    target: memberships
    mutation: {transition: {from: pending, to: cancelled}}
    meaning: "An enrollment is abandoned before the first dues are paid."
    grain: "One row per transaction."
    fields:
      status: "Set to cancelled."
      closed_date: "Date abandoned."
      close_reason: "enrollment_abandoned."
    triggers: []
  - type: membership_frozen
    target: memberships
    mutation: {transition: {from: active, to: frozen}}
    meaning: "The member freezes the membership."
    grain: "One row per transaction."
    fields:
      status: "Set to frozen."
      freeze_start_date: "First day of the freeze (a first day of a month)."
      freeze_end_date: "Last day of the freeze (a last day of a month)."
      freeze_months_used: "Months frozen in the current membership year including this freeze."
    triggers: []
  - type: membership_unfrozen
    target: memberships
    mutation: {transition: {from: frozen, to: active}}
    meaning: "The freeze ends and the membership resumes."
    grain: "One row per transaction."
    fields:
      status: "Set to active."
      current_period_start: "First day of the month after the freeze."
    triggers:
      - event: membership:membership_credits_granted
        map: {event_date: current_period_start, period_start: current_period_start, grant_reason: period_allotment}
  - type: membership_past_due
    target: memberships
    mutation: {transition: {from: active, to: past_due}}
    meaning: "Dues stay unpaid past the grace days."
    grain: "One row per transaction."
    fields:
      status: "Set to past_due."
      past_due_since: "Day after the grace days ended."
    triggers: []
  - type: membership_reinstated
    target: memberships
    mutation: {transition: {from: past_due, to: active}}
    meaning: "Overdue dues and any reinstatement fee are paid."
    grain: "One row per transaction."
    fields:
      status: "Set to active."
      past_due_since: "Cleared to empty."
    triggers: []
  - type: membership_terminated
    target: memberships
    mutation: {transition: {from: past_due, to: terminated}}
    meaning: "The membership is terminated for non-payment."
    grain: "One row per transaction."
    fields:
      status: "Set to terminated."
      closed_date: "Termination date."
      close_reason: "terminated_nonpayment."
      credits_remaining: "Credits left (expired)."
    triggers:
      - event: membership:membership_credits_expired
        when: {credits_remaining: {not: 0}}
        map: {credits: credits_remaining, event_date: closed_date, expire_reason: termination}
  - type: membership_cancel_requested
    target: memberships
    mutation: {transition: [{from: active, to: cancellation_pending}, {from: frozen, to: cancellation_pending}]}
    meaning: "The member gives notice of cancellation."
    grain: "One row per transaction."
    fields:
      status: "Set to cancellation_pending."
      cancel_notice_date: "Date of notice."
      cancel_effective_date: "Notice date plus cancellation_notice_days."
    triggers: []
  - type: membership_cancel_rescinded
    target: memberships
    mutation: {transition: {from: cancellation_pending, to: active}}
    meaning: "The member withdraws the notice before it takes effect."
    grain: "One row per transaction."
    fields:
      status: "Set to active."
      cancel_notice_date: "Cleared to empty."
      cancel_effective_date: "Cleared to empty."
    triggers: []
  - type: membership_cancelled
    target: memberships
    mutation: {transition: {from: cancellation_pending, to: cancelled}}
    meaning: "The cancellation takes effect."
    grain: "One row per transaction."
    fields:
      status: "Set to cancelled."
      closed_date: "Effective date."
      close_reason: "member_cancelled."
      credits_remaining: "Credits left (expired)."
    triggers:
      - event: membership:membership_credits_expired
        when: {credits_remaining: {not: 0}}
        map: {credits: credits_remaining, event_date: closed_date, expire_reason: cancellation}
  - type: membership_tier_changed
    target: memberships
    mutation: update
    meaning: "The member moves to another tier or dues cycle, or changes dependents."
    grain: "One row per transaction."
    fields:
      variant_name: "Tier after the change."
      billing_cycle: "Cycle after the change."
      dues_amount_usd: "Dues per cycle after the change."
      dependents_count: "Dependents after the change."
      last_tier_change_date: "Date the change takes effect."
    triggers: []
  - type: membership_dues_billed
    target: membership_events
    meaning: "Dues, the enrollment fee, a freeze fee, an upgrade proration, a reinstatement fee or an early termination fee are billed to the member's financial account."
    grain: "One row per charge kind per period of one membership."
    distinguish_by: [dues_kind, period_start]
    fields:
      event_date: "Billing date."
      period_start: "First day of the period the charge covers."
      period_end: "Last day of the period the charge covers."
      dues_kind: "What is billed."
      amount: "Amount billed."
    triggers:
      - event: billing:billing_charge_posted
        map: {txn_date: event_date, service_date: period_start, amount: amount, line_category: membership_fee, source_category: membership, channel: system}
  - type: membership_dues_credited
    target: membership_events
    meaning: "Dues already billed are credited back: a cooling-off refund, an annual prorated refund, or a downgrade proration."
    grain: "One row per credit reason per period of one membership."
    distinguish_by: [credit_reason, period_start]
    fields:
      event_date: "Credit date."
      period_start: "First day of the period credited."
      credit_reason: "Why dues are credited."
      amount: "Amount credited."
    triggers:
      - event: billing:billing_adjustment_posted
        map: {txn_date: event_date, amount: amount, adjustment_code: membership_dues_credit}
  - type: membership_credits_granted
    target: membership_events
    meaning: "The monthly allotment of member visit credits (plus any rollover) is granted."
    grain: "One row per monthly grant of one membership."
    distinguish_by: [period_start, grant_reason]
    fields:
      event_date: "Grant date."
      period_start: "First day of the month granted."
      credits: "Credits granted."
      grant_reason: "period_allotment, rollover or service_recovery."
    account: member_visit_credits
    direction: in
    triggers: []
  - type: membership_credit_used
    target: membership_events
    meaning: "A member visit uses one credit."
    grain: "One row per encounter that used a credit."
    distinguish_by: [encounter_number]
    fields:
      event_date: "Visit date."
      credits: "Always 1."
      encounter_number: "Encounter of the member visit."
      service_type: "office_visit, same_day_visit, virtual_visit or home_visit."
    account: member_visit_credits
    direction: out
    triggers: []
  - type: membership_credits_expired
    target: membership_events
    meaning: "Unused credits lapse at month end (beyond any rollover) or when the membership ends."
    grain: "One row per expiry of one membership per date."
    distinguish_by: [expire_reason, event_date]
    fields:
      event_date: "Expiry date."
      credits: "Credits expired."
      expire_reason: "period_end, cancellation or termination."
    account: member_visit_credits
    direction: out
    triggers: []

measures:
  - id: membership_msr_recent_termination
    window: "Rolling window of the tier's rejoin_waiting_months calendar months ending on the enrollment date."
    measure: "Count of the patient's other memberships with status terminated whose closed_date falls inside the window."
  - id: membership_msr_credits_used_this_month
    window: "The calendar month of the visit."
    measure: "Count of membership_credit_used rows on the membership dated inside the month."

policies:
  - id: membership_agg_multi_holding
    subject: [membership_enrolled]
    rule: >-
      A patient holds at most one membership at a time, as primary member or as a dependent on a Linden
      Family Membership. The patient holds no membership in status pending, active, frozen, past_due or
      cancellation_pending. A change of tier is made on the existing membership, never by enrolling a second
      one.
    eligibility:
      - id: one_membership
        applies_to: [membership_enrolled]
        kind: dedup
        condition: "The patient holds no membership in status pending, active, frozen, past_due or cancellation_pending."
        evidence_fields: [memberships.customer_id, memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[memberships.customer_id]]
          action_bindings: {memberships.customer_id: customer_id}
        dedup_contract:
          table: memberships
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending, active, frozen, past_due, cancellation_pending]}
          distinct_fields: []
    params: {max_per_customer: 1}

  - id: membership_enrollment
    subject: [membership_enrolled, membership_activated, membership_enrollment_abandoned]
    rule: >-
      A patient may enroll in a tier whose entry gate they meet, choosing a dues cycle the tier's
      billing_cycles_allowed offers; the membership starts when the first dues and the enrollment_fee_usd are
      paid, and an enrollment whose first dues are unpaid enrollment_payment_days after enrollment is abandoned. A family membership covers
      included_dependents dependents in the base dues and up to max_dependents in total, each extra dependent
      adding dependent_add_on_usd per month; dependents leave at dependent_age_max_years. A patient whose
      earlier membership was terminated for non-payment may not re-enroll during the waiting period. The
      enrollment is made no earlier than the tier's rejoin waiting period counted from the date the earlier
      membership was terminated. The waiting period is counted in calendar months from the termination date
      to the same day of the month, falling back to the last day of the month when that day does not exist,
      and enrollment on that day is allowed. A membership is not insurance and never changes the tier of the
      patient's financial account.
      The primary member must be at least age_min_years old on the enrollment date.
    eligibility:
      - id: rejoin_wait
        applies_to: [membership_enrolled]
        kind: time
        condition: "The enrollment is made no earlier than the tier's rejoin waiting period counted from the date the earlier membership was terminated."
        evidence_fields: [memberships.closed_date, memberships.status, memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[memberships.membership_id]]
          action_bindings: {memberships.membership_id: membership_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date the earlier membership was terminated"
          anchor_source: memberships.closed_date
          relation: not_before
          duration_source: variants.rejoin_waiting_months
          unit: calendar_months
          counting_rule: "The waiting period is counted in calendar months from the termination date to the same day of the month, falling back to the last day of the month when that day does not exist, and enrollment on that day is allowed."
          boundary: inclusive
    params:
      per_tier:
        Linden Connect Virtual Membership: {enrollment_fee_usd: "=enrollment_fee_usd", rejoin_waiting_months: "=rejoin_waiting_months", max_dependents: "=max_dependents"}
        Linden Essential Membership: {enrollment_fee_usd: "=enrollment_fee_usd", rejoin_waiting_months: "=rejoin_waiting_months", max_dependents: "=max_dependents"}
        Linden Family Membership: {enrollment_fee_usd: "=enrollment_fee_usd", rejoin_waiting_months: "=rejoin_waiting_months", max_dependents: "=max_dependents"}
        Linden Plus Membership: {enrollment_fee_usd: "=enrollment_fee_usd", rejoin_waiting_months: "=rejoin_waiting_months", max_dependents: "=max_dependents"}
        Linden Premier Concierge Membership: {enrollment_fee_usd: "=enrollment_fee_usd", rejoin_waiting_months: "=rejoin_waiting_months", max_dependents: "=max_dependents"}
        Linden Executive Health Membership: {enrollment_fee_usd: "=enrollment_fee_usd", rejoin_waiting_months: "=rejoin_waiting_months", max_dependents: "=max_dependents"}
    measures: [membership_msr_recent_termination]

  - id: membership_dues_billing
    subject: [membership_dues_billed, membership_dues_credited]
    rule: >-
      On the monthly cycle monthly_dues_usd (plus dependent add-ons) is billed on the first day of each
      period; on the annual cycle annual_dues_usd is billed at the start of each membership year. Dues are
      billed as membership_fee charges on the patient's financial account and follow its statement rules,
      except that membership dues are never enrolled in a payment plan. Each charge kind is billed once per
      period. Where annual_price_lock is true, dues do not change during the membership year. A freeze bills
      freeze_fee_usd per frozen month instead of dues. Credits of dues already billed follow the
      cancellation and tier-change rules.
    eligibility:
      - id: once_per_period
        applies_to: [membership_dues_billed]
        kind: dedup
        condition: "Each charge kind is billed once per period."
        evidence_fields: [membership_events.membership_id, membership_events.dues_kind, membership_events.period_start]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[membership_events.membership_id, membership_events.period_start]]
          action_bindings: {membership_events.membership_id: membership_id, membership_events.period_start: period_start}
        dedup_contract:
          table: membership_events
          mode: separate_record
          object_bindings: {membership_id: membership_id, period_start: period_start}
          duplicate_filters: {event_type: [membership_dues_billed]}
          distinct_fields: [dues_kind]
    params:
      per_tier:
        Linden Connect Virtual Membership: {monthly_dues_usd: "=monthly_dues_usd", annual_dues_usd: "=annual_dues_usd", included_dependents: "=included_dependents", dependent_add_on_usd: "=dependent_add_on_usd"}
        Linden Essential Membership: {monthly_dues_usd: "=monthly_dues_usd", annual_dues_usd: "=annual_dues_usd", included_dependents: "=included_dependents", dependent_add_on_usd: "=dependent_add_on_usd"}
        Linden Family Membership: {monthly_dues_usd: "=monthly_dues_usd", annual_dues_usd: "=annual_dues_usd", included_dependents: "=included_dependents", dependent_add_on_usd: "=dependent_add_on_usd"}
        Linden Plus Membership: {monthly_dues_usd: "=monthly_dues_usd", annual_dues_usd: "=annual_dues_usd", included_dependents: "=included_dependents", dependent_add_on_usd: "=dependent_add_on_usd"}
        Linden Premier Concierge Membership: {monthly_dues_usd: "=monthly_dues_usd", annual_dues_usd: "=annual_dues_usd", included_dependents: "=included_dependents", dependent_add_on_usd: "=dependent_add_on_usd"}
        Linden Executive Health Membership: {monthly_dues_usd: "=monthly_dues_usd", annual_dues_usd: "=annual_dues_usd", included_dependents: "=included_dependents", dependent_add_on_usd: "=dependent_add_on_usd"}
    formula:
      monthly_amount: monthly_dues_usd + max(dependents_count - included_dependents, 0) * dependent_add_on_usd

  - id: membership_visit_credits
    subject: [membership_credits_granted, membership_credit_used, membership_credits_expired]
    rule: >-
      At the start of each calendar month of an active membership, included_visit_credits_per_month credits
      are granted. Credits are granted only while the membership status is active. Where credits_rollover is
      true, up to max_rollover_credits unused credits carry into the next month and the rest expire at month
      end; otherwise all unused credits expire at month end. A member visit (office, same-day, virtual where
      virtual_visits_included is true, or home) uses one credit; the annual wellness visit and the executive
      physical, where included, use none. A credit is used only while the membership status is active. When
      no credit is left, further visits are charged as ordinary visits under the financial account rules.
      Remaining credits expire when the membership is cancelled or terminated and are never refunded.
    eligibility:
      - id: grant_when_active
        applies_to: [membership_credits_granted]
        kind: state
        condition: "Credits are granted only while the membership status is active."
        evidence_fields: [memberships.status, memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[memberships.membership_id]]
          action_bindings: {memberships.membership_id: membership_id}
        state_contract:
          field: memberships.status
          allowed: [active]
      - id: use_when_active
        applies_to: [membership_credit_used]
        kind: state
        condition: "A credit is used only while the membership status is active."
        evidence_fields: [memberships.status, memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[memberships.membership_id]]
          action_bindings: {memberships.membership_id: membership_id}
        state_contract:
          field: memberships.status
          allowed: [active]
    params:
      per_tier:
        Linden Connect Virtual Membership: {included_visit_credits_per_month: "=included_visit_credits_per_month", max_rollover_credits: "=max_rollover_credits"}
        Linden Essential Membership: {included_visit_credits_per_month: "=included_visit_credits_per_month", max_rollover_credits: "=max_rollover_credits"}
        Linden Family Membership: {included_visit_credits_per_month: "=included_visit_credits_per_month", max_rollover_credits: "=max_rollover_credits"}
        Linden Plus Membership: {included_visit_credits_per_month: "=included_visit_credits_per_month", max_rollover_credits: "=max_rollover_credits"}
        Linden Premier Concierge Membership: {included_visit_credits_per_month: "=included_visit_credits_per_month", max_rollover_credits: "=max_rollover_credits"}
        Linden Executive Health Membership: {included_visit_credits_per_month: "=included_visit_credits_per_month", max_rollover_credits: "=max_rollover_credits"}
    measures: [membership_msr_credits_used_this_month]

  - id: membership_freeze
    subject: [membership_frozen, membership_unfrozen]
    rule: >-
      Where freeze_allowed is true, a member may freeze the membership in whole calendar months, up to
      freeze_max_months_per_membership_year per membership year, with at least freeze_min_notice_days notice.
      Freezing is the member's own request. During a freeze no dues are billed (freeze_fee_usd is billed per
      frozen month instead), no credits are granted, and member services are unavailable; the commitment end
      date moves later by the frozen months. A membership that is past due or in its notice period cannot be
      frozen. A freeze, and a tier or cycle change that takes effect at the next period, is requested ahead
      of time as a membership request that the member submits; the freeze or change is applied on its start
      date, and a request may be withdrawn until then.
    eligibility: []
    params:
      per_tier:
        Linden Connect Virtual Membership: {freeze_max_months_per_membership_year: "=freeze_max_months_per_membership_year", freeze_min_notice_days: "=freeze_min_notice_days", freeze_fee_usd: "=freeze_fee_usd"}
        Linden Essential Membership: {freeze_max_months_per_membership_year: "=freeze_max_months_per_membership_year", freeze_min_notice_days: "=freeze_min_notice_days", freeze_fee_usd: "=freeze_fee_usd"}
        Linden Family Membership: {freeze_max_months_per_membership_year: "=freeze_max_months_per_membership_year", freeze_min_notice_days: "=freeze_min_notice_days", freeze_fee_usd: "=freeze_fee_usd"}
        Linden Plus Membership: {freeze_max_months_per_membership_year: "=freeze_max_months_per_membership_year", freeze_min_notice_days: "=freeze_min_notice_days", freeze_fee_usd: "=freeze_fee_usd"}
        Linden Premier Concierge Membership: {freeze_max_months_per_membership_year: "=freeze_max_months_per_membership_year", freeze_min_notice_days: "=freeze_min_notice_days", freeze_fee_usd: "=freeze_fee_usd"}
        Linden Executive Health Membership: {freeze_max_months_per_membership_year: "=freeze_max_months_per_membership_year", freeze_min_notice_days: "=freeze_min_notice_days", freeze_fee_usd: "=freeze_fee_usd"}

  - id: membership_cancellation
    subject: [membership_cancel_requested, membership_cancel_rescinded, membership_cancelled, membership_dues_credited]
    rule: >-
      Only the member can cancel. A cancellation takes effect cancellation_notice_days after the notice; the
      member may rescind the notice before then. A cancellation taking effect before commitment_end_date is
      charged early_termination_fee_usd. A cancellation noticed within the cooling-off period refunds all dues
      and the enrollment fee and carries no early termination fee. The notice is given no later than the
      tier's cooling-off period counted from the enrollment date. The period is counted in calendar days
      starting the day after the enrollment date, and a notice on the last day still qualifies. Outside the
      cooling-off period, annual dues are credited per the tier's annual_refund_basis: prorated_full_months
      credits each full month remaining after the effective date, prorated_after_commitment does so only for
      months after commitment_end_date, and none_after_cooling_off credits nothing. Monthly dues are never
      prorated.
    eligibility:
      - id: cooling_off
        applies_to: [membership_dues_credited]
        kind: time
        condition: "The notice is given no later than the tier's cooling-off period counted from the enrollment date."
        evidence_fields: [memberships.enrolled_date, memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[memberships.membership_id]]
          action_bindings: {memberships.membership_id: membership_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the enrollment date"
          anchor_source: memberships.enrolled_date
          relation: not_after
          duration_source: variants.cooling_off_days
          unit: calendar_days
          counting_rule: "The period is counted in calendar days starting the day after the enrollment date, and a notice on the last day still qualifies."
          boundary: inclusive
    params:
      per_tier:
        Linden Connect Virtual Membership: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_termination_fee_usd: "=early_termination_fee_usd", cooling_off_days: "=cooling_off_days"}
        Linden Essential Membership: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_termination_fee_usd: "=early_termination_fee_usd", cooling_off_days: "=cooling_off_days"}
        Linden Family Membership: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_termination_fee_usd: "=early_termination_fee_usd", cooling_off_days: "=cooling_off_days"}
        Linden Plus Membership: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_termination_fee_usd: "=early_termination_fee_usd", cooling_off_days: "=cooling_off_days"}
        Linden Premier Concierge Membership: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_termination_fee_usd: "=early_termination_fee_usd", cooling_off_days: "=cooling_off_days"}
        Linden Executive Health Membership: {cancellation_notice_days: "=cancellation_notice_days", min_commitment_months: "=min_commitment_months", early_termination_fee_usd: "=early_termination_fee_usd", cooling_off_days: "=cooling_off_days"}

  - id: membership_past_due_and_termination
    subject: [membership_past_due, membership_reinstated, membership_terminated]
    rule: >-
      Dues unpaid payment_grace_days after their due date make the membership past due, and member services
      are suspended. Paying all overdue dues plus reinstatement_fee_usd returns it to active. A membership
      still past due termination_after_past_due_days after past_due_since is terminated for non-payment; the
      unpaid dues stay on the financial account, and re-enrollment waits rejoin_waiting_months. A
      termination is recorded only after the tier's termination period has passed since the date the
      membership became past due. The termination period is counted in calendar days
      starting the day after past_due_since, and termination may be recorded only from the day after the
      last counted day.
    eligibility:
      - id: termination_period
        applies_to: [membership_terminated]
        kind: time
        condition: "A termination is recorded only after the tier's termination period has passed since the date the membership became past due."
        evidence_fields: [memberships.past_due_since, memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[memberships.membership_id]]
          action_bindings: {memberships.membership_id: membership_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date the membership became past due"
          anchor_source: memberships.past_due_since
          relation: not_before
          duration_source: variants.termination_after_past_due_days
          unit: calendar_days
          counting_rule: "The termination period is counted in calendar days starting the day after past_due_since, and termination may be recorded only from the day after the last counted day."
          boundary: exclusive
    params:
      per_tier:
        Linden Connect Virtual Membership: {payment_grace_days: "=payment_grace_days", termination_after_past_due_days: "=termination_after_past_due_days", reinstatement_fee_usd: "=reinstatement_fee_usd"}
        Linden Essential Membership: {payment_grace_days: "=payment_grace_days", termination_after_past_due_days: "=termination_after_past_due_days", reinstatement_fee_usd: "=reinstatement_fee_usd"}
        Linden Family Membership: {payment_grace_days: "=payment_grace_days", termination_after_past_due_days: "=termination_after_past_due_days", reinstatement_fee_usd: "=reinstatement_fee_usd"}
        Linden Plus Membership: {payment_grace_days: "=payment_grace_days", termination_after_past_due_days: "=termination_after_past_due_days", reinstatement_fee_usd: "=reinstatement_fee_usd"}
        Linden Premier Concierge Membership: {payment_grace_days: "=payment_grace_days", termination_after_past_due_days: "=termination_after_past_due_days", reinstatement_fee_usd: "=reinstatement_fee_usd"}
        Linden Executive Health Membership: {payment_grace_days: "=payment_grace_days", termination_after_past_due_days: "=termination_after_past_due_days", reinstatement_fee_usd: "=reinstatement_fee_usd"}

  - id: membership_tier_change
    subject: [membership_tier_changed]
    rule: >-
      A member may change tier or cycle on the existing membership. An upgrade takes effect per the target
      tier's upgrade_effective (immediately, with the prorated difference for the rest of the month billed
      where upgrade_proration is true); a downgrade takes effect at the next period. A tier change is made
      no earlier than the tier's minimum interval counted from the previous tier change. The interval is
      counted in calendar months from last_tier_change_date to the same day of the month, falling back to
      the last day of the month, and a change on that day is allowed. Moving to a tier with a longer commitment
      restarts the commitment from the change date. The membership status is active when the tier is changed.
    eligibility:
      - id: tier_change_interval
        applies_to: [membership_tier_changed]
        kind: time
        condition: "A tier change is made no earlier than the tier's minimum interval counted from the previous tier change."
        evidence_fields: [memberships.last_tier_change_date, memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[memberships.membership_id]]
          action_bindings: {memberships.membership_id: membership_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the previous tier change"
          anchor_source: memberships.last_tier_change_date
          relation: not_before
          duration_source: variants.tier_change_min_interval_months
          unit: calendar_months
          counting_rule: "The interval is counted in calendar months from last_tier_change_date to the same day of the month, falling back to the last day of the month, and a change on that day is allowed."
          boundary: inclusive
      - id: change_when_active
        applies_to: [membership_tier_changed]
        kind: state
        condition: "The membership status is active when the tier is changed."
        evidence_fields: [memberships.status, memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[memberships.membership_id]]
          action_bindings: {memberships.membership_id: membership_id}
        state_contract:
          field: memberships.status
          allowed: [active]
    params:
      per_tier:
        Linden Connect Virtual Membership: {tier_change_min_interval_months: "=tier_change_min_interval_months", upgrade_effective: "=upgrade_effective", downgrade_effective: "=downgrade_effective"}
        Linden Essential Membership: {tier_change_min_interval_months: "=tier_change_min_interval_months", upgrade_effective: "=upgrade_effective", downgrade_effective: "=downgrade_effective"}
        Linden Family Membership: {tier_change_min_interval_months: "=tier_change_min_interval_months", upgrade_effective: "=upgrade_effective", downgrade_effective: "=downgrade_effective"}
        Linden Plus Membership: {tier_change_min_interval_months: "=tier_change_min_interval_months", upgrade_effective: "=upgrade_effective", downgrade_effective: "=downgrade_effective"}
        Linden Premier Concierge Membership: {tier_change_min_interval_months: "=tier_change_min_interval_months", upgrade_effective: "=upgrade_effective", downgrade_effective: "=downgrade_effective"}
        Linden Executive Health Membership: {tier_change_min_interval_months: "=tier_change_min_interval_months", upgrade_effective: "=upgrade_effective", downgrade_effective: "=downgrade_effective"}

  - id: membership_insurance_interplay
    subject: [membership_credit_used]
    rule: >-
      Combination with the financial account: where insurance_billed_for_visits is false (the Essential and
      Family memberships), member primary care visits are not billed to insurance and carry no copay
      (member_visit_copay_waived); where it is true, member visits are billed to the patient's insurance and
      the copay is collected under the financial account rules, because a membership never waives an
      insurer's cost share. Specialist visits, imaging, procedures and outside labs are always billed
      normally; members receive lab_panel_discount_pct and imaging_discount_pct only on self-paid in-house
      services. The membership does not change referral or authorization requirements, although where
      care_coordination_included is true a coordinator initiates them for the member.
    eligibility: []
    params:
      per_tier:
        Linden Connect Virtual Membership: {insurance_billed_for_visits: "=insurance_billed_for_visits", member_visit_copay_waived: "=member_visit_copay_waived"}
        Linden Essential Membership: {insurance_billed_for_visits: "=insurance_billed_for_visits", member_visit_copay_waived: "=member_visit_copay_waived"}
        Linden Family Membership: {insurance_billed_for_visits: "=insurance_billed_for_visits", member_visit_copay_waived: "=member_visit_copay_waived"}
        Linden Plus Membership: {insurance_billed_for_visits: "=insurance_billed_for_visits", member_visit_copay_waived: "=member_visit_copay_waived"}
        Linden Premier Concierge Membership: {insurance_billed_for_visits: "=insurance_billed_for_visits", member_visit_copay_waived: "=member_visit_copay_waived"}
