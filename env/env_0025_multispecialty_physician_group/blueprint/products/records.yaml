events:
  - type: records_request_received
    target: records_requests
    mutation: create
    meaning: "A request to release a patient's records is received from the patient, a representative, a provider or an authorized third party."
    grain: "One row per request."
    fields:
      customer_id: "The patient whose records are requested."
      variant_name: "Request type (official tier name)."
      status: "Always received on creation."
      received_date: "Date received."
      request_channel: "portal, phone, mail, fax or in_person."
      recipient_name: "Recipient exactly as named on the request or authorization."
      recipient_type: "patient, personal_representative, provider, attorney, insurer or other_third_party."
      delivery_method: "How the records are to be delivered."
      record_scope: "What is requested."
      date_range_start: "First date of service requested."
      date_range_end: "Last date of service requested."
      expedited: "Whether expedited processing was requested."
      fee_balance_usd: "0.00 on creation; raised by fee assessments."
    triggers: []
  - type: records_authorization_requested
    target: records_requests
    mutation: {transition: {from: received, to: authorization_pending}}
    meaning: "The patient's signed authorization (or representative documentation) is requested."
    grain: "One row per transaction."
    fields:
      status: "Set to authorization_pending."
      authorization_requested_date: "Date the authorization form was sent."
    triggers: []
  - type: records_authorization_signed
    target: records_requests
    mutation: {transition: {from: authorization_pending, to: in_process}}
    meaning: "The patient signs the release authorization."
    grain: "One row per transaction."
    fields:
      status: "Set to in_process."
      authorization_signed_date: "Date signed."
      authorization_expiration_date: "Expiration stated on the authorization, or signing date plus authorization_validity_months."
      due_date: "Signing date plus response_days."
    triggers: []
  - type: records_processing_started
    target: records_requests
    mutation: {transition: {from: received, to: in_process}}
    meaning: "Compilation starts on a complete, verified request that needs no authorization."
    grain: "One row per transaction."
    fields:
      status: "Set to in_process."
      due_date: "Received date plus response_days (or expedite_business_days business days when expedited)."
    triggers: []
  - type: records_extension_notified
    target: records_requests
    mutation: {transition: {from: in_process, to: extended}}
    meaning: "The one extension is taken with written notice stating the reason and the new due date."
    grain: "One row per transaction."
    fields:
      status: "Set to extended."
      extension_notice_date: "Date the notice was sent."
      due_date: "Original due date plus extension_days."
    triggers: []
  - type: records_fulfilled
    target: records_requests
    mutation: {transition: [{from: in_process, to: fulfilled}, {from: extended, to: fulfilled}]}
    meaning: "The records are delivered."
    grain: "One row per transaction."
    fields:
      status: "Set to fulfilled."
      fulfilled_date: "Delivery date."
      page_count: "Pages released."
      closed_date: "Same as fulfilled_date."
    triggers: []
  - type: records_denied
    target: records_requests
    mutation: {transition: [{from: received, to: denied}, {from: in_process, to: denied}]}
    meaning: "The request is denied on a permitted ground."
    grain: "One row per transaction."
    fields:
      status: "Set to denied."
      denial_ground: "Ground of denial."
      closed_date: "Date of denial."
      fee_balance_usd: "Fee outstanding at denial (waived)."
    triggers:
      - event: records:records_fee_waived
        when: {fee_balance_usd: {not: 0.00}}
        map: {amount: fee_balance_usd, event_date: closed_date, waiver_reason: request_denied}
  - type: records_cancelled
    target: records_requests
    mutation: {transition: [{from: received, to: cancelled}, {from: in_process, to: cancelled}, {from: authorization_pending, to: cancelled}]}
    meaning: "The request is withdrawn, or lapses for want of a signed authorization."
    grain: "One row per transaction."
    fields:
      status: "Set to cancelled."
      cancel_reason: "requester_withdrew or authorization_not_returned."
      closed_date: "Date of cancellation."
      fee_balance_usd: "Fee outstanding at cancellation (waived)."
    triggers:
      - event: records:records_fee_waived
        when: {fee_balance_usd: {not: 0.00}}
        map: {amount: fee_balance_usd, event_date: closed_date, waiver_reason: request_cancelled}
  - type: records_delivery_updated
    target: records_requests
    mutation: update
    meaning: "The delivery method of an open request is changed."
    grain: "One row per transaction."
    fields:
      delivery_method: "New delivery method."
    triggers: []
  - type: records_fee_assessed
    target: records_events
    meaning: "One component of the request's fee is assessed."
    grain: "One row per fee component of one request."
    distinguish_by: [fee_component]
    fields:
      event_date: "Date assessed."
      fee_component: "flat_fee, page_fee, search_fee, certification_fee, disc_fee, expedite_fee or postage."
      amount: "Amount of the component (after the cap is applied to the last component)."
      page_count: "Pages the page fee is computed on; 0 for other components."
    account: records_fee_balance
    direction: in
    triggers: []
  - type: records_fee_paid
    target: records_events
    meaning: "The requester pays the fee."
    grain: "One row per payment on one request."
    distinguish_by: [event_date, amount]
    fields:
      event_date: "Payment date."
      amount: "Amount paid."
      payment_method: "How it was paid."
    account: records_fee_balance
    direction: out
    triggers: []
  - type: records_fee_waived
    target: records_events
    meaning: "Part or all of the fee is waived."
    grain: "One row per waiver reason on one request."
    distinguish_by: [waiver_reason]
    fields:
      event_date: "Date of the waiver."
      amount: "Amount waived."
      waiver_reason: "Why it is waived."
    account: records_fee_balance
    direction: out
    triggers: []
  - type: records_fee_refunded
    target: records_events
    meaning: "A fee already paid is refunded after a waiver, denial or cancellation."
    grain: "One row per refunded payment."
    distinguish_by: [applies_to_event_id]
    fields:
      event_date: "Refund date."
      amount: "Amount refunded."
      applies_to_event_id: "The payment row refunded."
      payment_method: "Method refunded to (the original method)."
    account: records_fee_balance
    direction: in
    triggers: []
  - type: records_fee_transferred
    target: records_events
    meaning: "An unpaid patient fee moves to the patient's financial account to be statemented there."
    grain: "One row per transfer of one request's fee."
    distinguish_by: [event_date]
    fields:
      event_date: "Transfer date."
      amount: "Amount transferred."
    account: records_fee_balance
    direction: out
    triggers:
      - event: billing:billing_charge_posted
        map: {txn_date: event_date, service_date: event_date, amount: amount, line_category: records_fee, source_category: records, channel: system}

measures:
  - id: records_msr_free_copies_used
    window: "Rolling 12 calendar months ending on the received date of the request."
    measure: "Count of the patient's other requests of the same tier with status fulfilled whose received_date falls inside the window and that carry a records_fee_waived row with waiver_reason free_copy."
  - id: records_msr_page_fee
    window: "The request being fulfilled."
    measure: "Sum over its pages of the per_page_usd of the page_fee_ladder band each page number falls in, rounded to the cent."

policies:
  - id: records_agg_multi_holding
    subject: [records_request_received]
    rule: >-
      A patient may have any number of records requests over time for different recipients, scopes and date
      ranges; overlapping requests are governed by records_agg_overlap_and_free_copies.
    eligibility: []
    params: {max_per_customer: null}

  - id: records_agg_overlap_and_free_copies
    subject: [records_request_received, records_fee_waived]
    rule: >-
      The patient has no other open request of the same tier for the same recipient and record scope. An
      open request is one in status received, authorization_pending, in_process or extended; a second
      identical request is not opened and the requester is given the status of the first. Across a
      patient's requests of one tier, the first free_copies_per_12_months fulfilled requests in a rolling 12
      months (records_msr_free_copies_used) are free: their fee is waived with reason free_copy; later
      requests are charged. Portal downloads and provider-to-provider transfers carry no fee at all.
    eligibility:
      - id: no_open_duplicate
        applies_to: [records_request_received]
        kind: dedup
        condition: "The patient has no other open request of the same tier for the same recipient and record scope."
        evidence_fields: [records_requests.customer_id, records_requests.variant_name, records_requests.recipient_name, records_requests.record_scope, records_requests.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[records_requests.customer_id, records_requests.variant_name, records_requests.recipient_name, records_requests.record_scope]]
          action_bindings: {records_requests.customer_id: customer_id, records_requests.variant_name: variant_name, records_requests.recipient_name: recipient_name, records_requests.record_scope: record_scope}
        dedup_contract:
          table: records_requests
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name, recipient_name: recipient_name, record_scope: record_scope}
          duplicate_filters: {status: [received, authorization_pending, in_process, extended]}
          distinct_fields: [date_range_start, date_range_end]
    params:
      per_tier:
        Portal Self-Service Download: {free_copies_per_12_months: "=free_copies_per_12_months"}
        Patient Electronic Copy Request: {free_copies_per_12_months: "=free_copies_per_12_months"}
        Patient Paper Copy Request: {free_copies_per_12_months: "=free_copies_per_12_months"}
        Provider-to-Provider Transfer: {free_copies_per_12_months: "=free_copies_per_12_months"}
        Third-Party Authorized Release: {free_copies_per_12_months: "=free_copies_per_12_months"}
        Certified Legal Records Package: {free_copies_per_12_months: "=free_copies_per_12_months"}
        Imaging Disc Copy Request: {free_copies_per_12_months: "=free_copies_per_12_months"}
    measures: [records_msr_free_copies_used]

  - id: records_response_timeline
    subject: [records_processing_started, records_extension_notified, records_fulfilled]
    rule: >-
      Records are delivered within response_days calendar days of receipt, or of the signature where an
      authorization is required, and within expedite_business_days business days when expedited where
      expedite_available is true. Where max_extensions is 1, one extension of extension_days may be taken
      with written notice of the reason. The extension notice is sent no later than the original due date.
      The due date is the day the response period ends, counted in calendar days starting the day after the
      received or signing date; a notice sent on the due date itself still qualifies and no grace day follows
      it. A second
      extension is never taken. Records delivered after the due date are late; where late_fulfillment_fee_waived
      is true the whole fee is then waived. Requesters get a status update every status_update_business_days
      business days while the request is open. Portal records become available portal_availability_hours
      after finalization.
      Where identity_verification_required is true the requester's identity is verified before compilation
      starts, and one request covers at most date_range_max_years years of dates of service; a longer span
      needs a second request.
    eligibility:
      - id: extension_before_due
        applies_to: [records_extension_notified]
        kind: time
        condition: "The extension notice is sent no later than the original due date."
        evidence_fields: [records_requests.due_date, records_requests.records_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[records_requests.records_request_id]]
          action_bindings: {records_requests.records_request_id: records_request_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the original due date"
          anchor_source: records_requests.due_date
          relation: not_after
          duration_source: params.extension_notice_grace_days
          unit: calendar_days
          counting_rule: "The due date is the day the response period ends, counted in calendar days starting the day after the received or signing date; a notice sent on the due date itself still qualifies and no grace day follows it."
          boundary: inclusive
    params:
      extension_notice_grace_days: 0
      per_tier:
        Portal Self-Service Download: {response_days: "=response_days", extension_days: "=extension_days", max_extensions: "=max_extensions"}
        Patient Electronic Copy Request: {response_days: "=response_days", extension_days: "=extension_days", max_extensions: "=max_extensions"}
        Patient Paper Copy Request: {response_days: "=response_days", extension_days: "=extension_days", max_extensions: "=max_extensions"}
        Provider-to-Provider Transfer: {response_days: "=response_days", extension_days: "=extension_days", max_extensions: "=max_extensions"}
        Third-Party Authorized Release: {response_days: "=response_days", extension_days: "=extension_days", max_extensions: "=max_extensions"}
        Certified Legal Records Package: {response_days: "=response_days", extension_days: "=extension_days", max_extensions: "=max_extensions"}
        Imaging Disc Copy Request: {response_days: "=response_days", extension_days: "=extension_days", max_extensions: "=max_extensions"}

  - id: records_fee_schedule
    subject: [records_fee_assessed]
    rule: >-
      The fee is the sum of the tier's components that apply: flat_fee_usd; the page fee
      (records_msr_page_fee) where the release is page-counted, each page charged at the per_page_usd of the
      page_fee_ladder band its page number falls in; search_fee_usd; certification_fee_usd; disc_fee_usd per
      disc; expedite_fee_usd when expedited; and actual postage where postage_passthrough is true. Where
      max_fee_usd is above 0.00 the total is capped at it, the cap being applied to the last component
      assessed. Each component is assessed once per request. Patient-access tiers are cost-based and never
      carry a search fee. Fees are assessed when the page count is known (at fulfillment) or, where
      prepayment_required is true, when the quote is issued before release.
    eligibility:
      - id: component_once
        applies_to: [records_fee_assessed]
        kind: dedup
        condition: "Each component is assessed once per request."
        evidence_fields: [records_events.records_request_id, records_events.fee_component]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[records_events.records_request_id]]
          action_bindings: {records_events.records_request_id: records_request_id}
        dedup_contract:
          table: records_events
          mode: separate_record
          object_bindings: {records_request_id: records_request_id}
          duplicate_filters: {event_type: [records_fee_assessed]}
          distinct_fields: [fee_component]
    params:
      per_tier:
        Portal Self-Service Download: {flat_fee_usd: "=flat_fee_usd", page_fee_ladder: "=page_fee_ladder", search_fee_usd: "=search_fee_usd", certification_fee_usd: "=certification_fee_usd", disc_fee_usd: "=disc_fee_usd", max_fee_usd: "=max_fee_usd", expedite_fee_usd: "=expedite_fee_usd"}
        Patient Electronic Copy Request: {flat_fee_usd: "=flat_fee_usd", page_fee_ladder: "=page_fee_ladder", search_fee_usd: "=search_fee_usd", certification_fee_usd: "=certification_fee_usd", disc_fee_usd: "=disc_fee_usd", max_fee_usd: "=max_fee_usd", expedite_fee_usd: "=expedite_fee_usd"}
        Patient Paper Copy Request: {flat_fee_usd: "=flat_fee_usd", page_fee_ladder: "=page_fee_ladder", search_fee_usd: "=search_fee_usd", certification_fee_usd: "=certification_fee_usd", disc_fee_usd: "=disc_fee_usd", max_fee_usd: "=max_fee_usd", expedite_fee_usd: "=expedite_fee_usd"}
        Provider-to-Provider Transfer: {flat_fee_usd: "=flat_fee_usd", page_fee_ladder: "=page_fee_ladder", search_fee_usd: "=search_fee_usd", certification_fee_usd: "=certification_fee_usd", disc_fee_usd: "=disc_fee_usd", max_fee_usd: "=max_fee_usd", expedite_fee_usd: "=expedite_fee_usd"}
        Third-Party Authorized Release: {flat_fee_usd: "=flat_fee_usd", page_fee_ladder: "=page_fee_ladder", search_fee_usd: "=search_fee_usd", certification_fee_usd: "=certification_fee_usd", disc_fee_usd: "=disc_fee_usd", max_fee_usd: "=max_fee_usd", expedite_fee_usd: "=expedite_fee_usd"}
        Certified Legal Records Package: {flat_fee_usd: "=flat_fee_usd", page_fee_ladder: "=page_fee_ladder", search_fee_usd: "=search_fee_usd", certification_fee_usd: "=certification_fee_usd", disc_fee_usd: "=disc_fee_usd", max_fee_usd: "=max_fee_usd", expedite_fee_usd: "=expedite_fee_usd"}
        Imaging Disc Copy Request: {flat_fee_usd: "=flat_fee_usd", page_fee_ladder: "=page_fee_ladder", search_fee_usd: "=search_fee_usd", certification_fee_usd: "=certification_fee_usd", disc_fee_usd: "=disc_fee_usd", max_fee_usd: "=max_fee_usd", expedite_fee_usd: "=expedite_fee_usd"}
    formula:
      total_fee_usd: min(flat_fee_usd + records_msr_page_fee + search_fee_usd + certification_fee_usd + disc_fee_usd, max_fee_usd) if max_fee_usd > 0 else flat_fee_usd + records_msr_page_fee + search_fee_usd + certification_fee_usd + disc_fee_usd
    measures: [records_msr_page_fee]

  - id: records_authorization
    subject: [records_authorization_requested, records_authorization_signed, records_cancelled]
    rule: >-
      Where authorization_required is true, no work starts until the patient (or a documented personal
      representative) signs a release authorization naming the recipient; signing is the patient's own act.
      A representative supplies guardianship, power-of-attorney or estate documentation where
      representative_documentation_required is true. The authorization is returned signed no later than the
      tier's return window counted from the date it was requested. The window is counted in calendar days
      starting the day after the request date, and a signature on the last day still qualifies. An
      authorization not returned in time lapses and the request is cancelled with reason
      authorization_not_returned. A signed authorization stays valid until the expiration it states or, if it
      states none, authorization_validity_months after signing. Where recipient_change_requires_new_authorization
      is true, a different recipient needs a new authorization and a new request. A patient's own copy
      requests, and provider-to-provider transfers for treatment, need no authorization.
    eligibility:
      - id: authorization_returned
        applies_to: [records_authorization_signed]
        kind: time
        condition: "The authorization is returned signed no later than the tier's return window counted from the date it was requested."
        evidence_fields: [records_requests.authorization_requested_date, records_requests.records_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[records_requests.records_request_id]]
          action_bindings: {records_requests.records_request_id: records_request_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date it was requested"
          anchor_source: records_requests.authorization_requested_date
          relation: not_after
          duration_source: variants.authorization_return_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the request date, and a signature on the last day still qualifies."
          boundary: inclusive
    params:
      per_tier:
        Portal Self-Service Download: {authorization_required: "=authorization_required", authorization_return_days: "=authorization_return_days", authorization_validity_months: "=authorization_validity_months"}
        Patient Electronic Copy Request: {authorization_required: "=authorization_required", authorization_return_days: "=authorization_return_days", authorization_validity_months: "=authorization_validity_months"}
        Patient Paper Copy Request: {authorization_required: "=authorization_required", authorization_return_days: "=authorization_return_days", authorization_validity_months: "=authorization_validity_months"}
        Provider-to-Provider Transfer: {authorization_required: "=authorization_required", authorization_return_days: "=authorization_return_days", authorization_validity_months: "=authorization_validity_months"}
        Third-Party Authorized Release: {authorization_required: "=authorization_required", authorization_return_days: "=authorization_return_days", authorization_validity_months: "=authorization_validity_months"}
        Certified Legal Records Package: {authorization_required: "=authorization_required", authorization_return_days: "=authorization_return_days", authorization_validity_months: "=authorization_validity_months"}
        Imaging Disc Copy Request: {authorization_required: "=authorization_required", authorization_return_days: "=authorization_return_days", authorization_validity_months: "=authorization_validity_months"}

  - id: records_sensitive_information
    subject: [records_fulfilled, records_denied]
    rule: >-
      Separately kept psychotherapy notes are never released under any tier (psychotherapy_notes_releasable is
      false everywhere); substance-use-disorder treatment records are released only on a consent naming the
      recipient where part2_specific_consent_required is true; HIV, genetic-testing and sexual-health results
      only on a specific consent where sensitive_specific_consent_required is true; and a parent's request
      excludes the confidential adolescent services of a minor absent the minor's consent where
      adolescent_confidential_excluded is true. Excluded material is withheld and the rest released; the
      request is denied outright only when nothing releasable remains. Patients younger than
      minimum_age_self_request_years request through a guardian except for the services they consented to
      themselves.
    eligibility: []
    params:
      per_tier:
        Portal Self-Service Download: {part2_specific_consent_required: "=part2_specific_consent_required", sensitive_specific_consent_required: "=sensitive_specific_consent_required", adolescent_confidential_excluded: "=adolescent_confidential_excluded"}
        Patient Electronic Copy Request: {part2_specific_consent_required: "=part2_specific_consent_required", sensitive_specific_consent_required: "=sensitive_specific_consent_required", adolescent_confidential_excluded: "=adolescent_confidential_excluded"}
        Patient Paper Copy Request: {part2_specific_consent_required: "=part2_specific_consent_required", sensitive_specific_consent_required: "=sensitive_specific_consent_required", adolescent_confidential_excluded: "=adolescent_confidential_excluded"}
        Provider-to-Provider Transfer: {part2_specific_consent_required: "=part2_specific_consent_required", sensitive_specific_consent_required: "=sensitive_specific_consent_required", adolescent_confidential_excluded: "=adolescent_confidential_excluded"}
        Third-Party Authorized Release: {part2_specific_consent_required: "=part2_specific_consent_required", sensitive_specific_consent_required: "=sensitive_specific_consent_required", adolescent_confidential_excluded: "=adolescent_confidential_excluded"}
        Certified Legal Records Package: {part2_specific_consent_required: "=part2_specific_consent_required", sensitive_specific_consent_required: "=sensitive_specific_consent_required", adolescent_confidential_excluded: "=adolescent_confidential_excluded"}
        Imaging Disc Copy Request: {part2_specific_consent_required: "=part2_specific_consent_required", sensitive_specific_consent_required: "=sensitive_specific_consent_required", adolescent_confidential_excluded: "=adolescent_confidential_excluded"}

  - id: records_fee_waivers
    subject: [records_fee_waived, records_fee_refunded]
    rule: >-
      A fee is waived in full, with the matching reason: when the records go to a treating provider for
      continuity of care where continuity_fee_waived is true; when they support a Social Security disability
      or VA benefits claim where benefit_application_fee_waived is true; when the patient's billing account
      carries a hardship approval whose hardship_approved_through is on or after the request date where
      hardship_waiver_allowed is true; when the records were delivered late where late_fulfillment_fee_waived
      is true; when the request is one of the free copies of the period; and when the request is denied or
      cancelled. A request's fee is waived at most once for each reason. Only one reason is applied: the
      first that holds in the order listed. A fee already paid and then waived is refunded to the original
      payment method.
    eligibility:
      - id: waiver_once_per_reason
        applies_to: [records_fee_waived]
        kind: dedup
        condition: "A request's fee is waived at most once for each reason."
        evidence_fields: [records_events.records_request_id, records_events.waiver_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[records_events.records_request_id]]
          action_bindings: {records_events.records_request_id: records_request_id}
        dedup_contract:
          table: records_events
          mode: separate_record
          object_bindings: {records_request_id: records_request_id}
          duplicate_filters: {event_type: [records_fee_waived]}
          distinct_fields: [waiver_reason]
    params:
      per_tier:
        Portal Self-Service Download: {continuity_fee_waived: "=continuity_fee_waived", benefit_application_fee_waived: "=benefit_application_fee_waived", hardship_waiver_allowed: "=hardship_waiver_allowed", late_fulfillment_fee_waived: "=late_fulfillment_fee_waived"}
        Patient Electronic Copy Request: {continuity_fee_waived: "=continuity_fee_waived", benefit_application_fee_waived: "=benefit_application_fee_waived", hardship_waiver_allowed: "=hardship_waiver_allowed", late_fulfillment_fee_waived: "=late_fulfillment_fee_waived"}
        Patient Paper Copy Request: {continuity_fee_waived: "=continuity_fee_waived", benefit_application_fee_waived: "=benefit_application_fee_waived", hardship_waiver_allowed: "=hardship_waiver_allowed", late_fulfillment_fee_waived: "=late_fulfillment_fee_waived"}
        Provider-to-Provider Transfer: {continuity_fee_waived: "=continuity_fee_waived", benefit_application_fee_waived: "=benefit_application_fee_waived", hardship_waiver_allowed: "=hardship_waiver_allowed", late_fulfillment_fee_waived: "=late_fulfillment_fee_waived"}
        Third-Party Authorized Release: {continuity_fee_waived: "=continuity_fee_waived", benefit_application_fee_waived: "=benefit_application_fee_waived", hardship_waiver_allowed: "=hardship_waiver_allowed", late_fulfillment_fee_waived: "=late_fulfillment_fee_waived"}
        Certified Legal Records Package: {continuity_fee_waived: "=continuity_fee_waived", benefit_application_fee_waived: "=benefit_application_fee_waived", hardship_waiver_allowed: "=hardship_waiver_allowed", late_fulfillment_fee_waived: "=late_fulfillment_fee_waived"}
        Imaging Disc Copy Request: {continuity_fee_waived: "=continuity_fee_waived", benefit_application_fee_waived: "=benefit_application_fee_waived", hardship_waiver_allowed: "=hardship_waiver_allowed", late_fulfillment_fee_waived: "=late_fulfillment_fee_waived"}

  - id: records_payment_and_transfer
    subject: [records_fee_paid, records_fee_transferred]
    rule: >-
      Where prepayment_required is true the quoted fee is paid before the records are released. Otherwise
      the fee is invoiced with the release. An unpaid fee moves to the patient's financial account only
      after the tier's transfer period has passed since fulfillment. The period is counted in calendar days
      starting the day after the fulfillment date, and the transfer may be made only from the day after the
      last counted day. Where fee_transfer_after_days is 0 no transfer is made (third-party requesters pay
      before release). Once transferred, the fee is a charge of line category records_fee on the financial
      account and follows its statement rules.
    eligibility:
      - id: transfer_period_elapsed
        applies_to: [records_fee_transferred]
        kind: time
        condition: "An unpaid fee moves to the patient's financial account only after the tier's transfer period has passed since fulfillment."
        evidence_fields: [records_requests.fulfilled_date, records_requests.records_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[records_requests.records_request_id]]
          action_bindings: {records_requests.records_request_id: records_request_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "fulfillment"
          anchor_source: records_requests.fulfilled_date
          relation: not_before
          duration_source: variants.fee_transfer_after_days
          unit: calendar_days
          counting_rule: "The period is counted in calendar days starting the day after the fulfillment date, and the transfer may be made only from the day after the last counted day."
          boundary: exclusive
    params:
      per_tier:
        Portal Self-Service Download: {prepayment_required: "=prepayment_required", fee_transfer_after_days: "=fee_transfer_after_days"}
        Patient Electronic Copy Request: {prepayment_required: "=prepayment_required", fee_transfer_after_days: "=fee_transfer_after_days"}
        Patient Paper Copy Request: {prepayment_required: "=prepayment_required", fee_transfer_after_days: "=fee_transfer_after_days"}
        Provider-to-Provider Transfer: {prepayment_required: "=prepayment_required", fee_transfer_after_days: "=fee_transfer_after_days"}
        Third-Party Authorized Release: {prepayment_required: "=prepayment_required", fee_transfer_after_days: "=fee_transfer_after_days"}
        Certified Legal Records Package: {prepayment_required: "=prepayment_required", fee_transfer_after_days: "=fee_transfer_after_days"}
        Imaging Disc Copy Request: {prepayment_required: "=prepayment_required", fee_transfer_after_days: "=fee_transfer_after_days"}

  - id: records_denial_and_review
    subject: [records_denied]
    rule: >-
      A request may be denied without review for psychotherapy notes or information compiled for litigation,
      and on a reviewable ground when a licensed professional determines release is reasonably likely to
      endanger the life or physical safety of the patient or another person. Where denial_review_available is
      true the requester may ask for a review of a reviewable denial by a licensed professional who did not
      take part, completed within denial_review_days. A third-party request without a valid authorization is
      denied unless a court subpoena or order is served where subpoena_required is true. A denied request's
      outstanding fee is waived.
      Where amendment_request_allowed is true a patient may ask to amend information in the released
      record, and the request is acted on within amendment_response_days calendar days; a patient may also
      obtain accountings of disclosures, the first accounting_of_disclosures_free_per_12_months in a
      rolling 12 months free of charge.
    eligibility: []
    params:
      per_tier:
        Portal Self-Service Download: {denial_review_available: "=denial_review_available", denial_review_days: "=denial_review_days"}
