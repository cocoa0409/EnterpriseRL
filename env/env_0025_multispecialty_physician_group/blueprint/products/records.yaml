# Policy charter: Medical Records Requests (one release-of-information request per holding).
# Path: env/env_0025_multispecialty_physician_group/blueprint/products/records.yaml

category: records
display_name: Medical Records Requests

binding:
  holding_table: records_requests
  event_tables: [records_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {fee_balance_usd: records_fee_balance}

lifecycle:
  states: [received, authorization_pending, in_process, extended, fulfilled, denied, cancelled]
  transitions:
    - {from: received, to: authorization_pending, by: agent, means: "The request needs the patient's signed authorization (or a representative's documentation) before any work starts."}
    - {from: authorization_pending, to: in_process, by: user, means: "The patient signs the release authorization; only the patient (or legal representative) can give it."}
    - {from: authorization_pending, to: cancelled, by: system, means: "The authorization is not returned within the return window."}
    - {from: received, to: in_process, by: agent, means: "The requester's identity is verified and the request is complete, so compilation starts."}
    - {from: in_process, to: extended, by: agent, means: "The one permitted extension is taken with written notice before the original due date."}
    - {from: in_process, to: fulfilled, by: system, means: "The records are delivered."}
    - {from: extended, to: fulfilled, by: system, means: "The records are delivered within the extended due date."}
    - {from: received, to: denied, by: agent, means: "The request is denied on a permitted ground before compilation."}
    - {from: in_process, to: denied, by: agent, means: "Part or all of the request is denied on a permitted ground found during review."}
    - {from: received, to: cancelled, by: agent, means: "The requester withdraws the request before compilation."}
    - {from: in_process, to: cancelled, by: agent, means: "The requester withdraws the request during compilation."}

accounts:
  - key: records_fee_balance
    unit: USD
    meaning: "Fee owed on the request: assessed fees and refunds add, payments, waivers and transfers to the patient's financial account subtract."

parameter_schema:
  response_days: "Calendar days after the request is received (or, where an authorization is needed, after it is signed) by which the records are delivered; integer, days."
  extension_days: "Calendar days one extension adds to the due date; integer, days."
  max_extensions: "Extensions permitted per request; integer, count."
  flat_fee_usd: "Flat fee per request; USD."
  page_fee_ladder: "Per-page fee bands for paper or page-counted copies, a list of {from_page, to_page, per_page_usd} where to_page 0 means no upper bound; each page is charged at the rate of its own band; structured."
  search_fee_usd: "Records search fee per request; USD."
  certification_fee_usd: "Custodian certification and affidavit fee per request; USD."
  disc_fee_usd: "Fee per imaging disc produced; USD."
  postage_passthrough: "Whether actual postage is added to the fee; boolean."
  max_fee_usd: "Cap on the total fee per request; 0.00 means no cap; USD."
  prepayment_required: "Whether the fee must be paid before the records are released; boolean."
  fee_transfer_after_days: "Calendar days after fulfillment after which an unpaid fee moves to the patient's financial account; 0 means never transferred; integer, days."
  authorization_required: "Whether a signed HIPAA release authorization from the patient or representative is required; boolean."
  authorization_return_days: "Calendar days after the authorization is requested within which it must be returned signed; integer, days."
  authorization_validity_months: "Calendar months a signed authorization stays valid when it states no earlier expiration; integer, months."
  identity_verification_required: "Whether the requester's identity must be verified before release; boolean."
  representative_documentation_required: "Whether a personal representative must supply guardianship, power-of-attorney or estate documentation; boolean."
  adolescent_confidential_excluded: "Whether confidential adolescent services are excluded from a parent's request absent the minor's consent; boolean."
  psychotherapy_notes_releasable: "Whether separately kept psychotherapy notes are released (never without a specific authorization); boolean."
  part2_specific_consent_required: "Whether substance-use-disorder treatment records need a specific consent naming the recipient; boolean."
  sensitive_specific_consent_required: "Whether HIV, genetic-testing and sexual-health results need a specific consent; boolean."
  delivery_methods: "Delivery methods offered, as a hyphen-joined list drawn from portal, email, mail, fax, pickup, disc_mail; enum string."
  unencrypted_email_allowed: "Whether records may be sent by unencrypted email after the patient acknowledges the risk; boolean."
  pickup_hold_days: "Calendar days records ready for pickup are held before being mailed or destroyed; integer, days."
  portal_availability_hours: "Hours after a note or result is finalized that it appears for portal download; integer, hours."
  date_range_max_years: "Largest span of dates one request may cover; integer, years."
  fax_page_limit: "Largest number of pages delivered by fax; larger releases go by mail or portal; integer, pages."
  imaging_images_included: "Whether diagnostic images (not only reports) are included; boolean."
  expedite_available: "Whether expedited processing is offered; boolean."
  expedite_fee_usd: "Fee for expedited processing; USD."
  expedite_business_days: "Business days for an expedited request; 0 means no expedite; integer."
  continuity_fee_waived: "Whether fees are waived when records go to a treating provider for continuity of care; boolean."
  benefit_application_fee_waived: "Whether fees are waived for records supporting a Social Security disability or VA benefits claim; boolean."
  hardship_waiver_allowed: "Whether fees may be waived on a current financial-hardship approval; boolean."
  free_copies_per_12_months: "Requests of the tier fulfilled free of fees per patient in a rolling 12 months; integer, count."
  subpoena_required: "Whether a court subpoena or order is required when no patient authorization is given; boolean."
  custodian_affidavit_included: "Whether a signed custodian affidavit accompanies the records; boolean."
  amendment_request_allowed: "Whether the patient may request an amendment of the released record through this tier; boolean."
  amendment_response_days: "Calendar days to act on an amendment request; integer, days."
  accounting_of_disclosures_free_per_12_months: "Free accountings of disclosures per patient in a rolling 12 months; integer, count."
  denial_review_available: "Whether a denial on a reviewable ground can be reviewed by another licensed professional; boolean."
  denial_review_days: "Calendar days to complete a denial review; integer, days."
  record_format: "Format produced: pdf, ccda_xml, paper, dicom_disc or certified_paper; enum string."
  recipient_change_requires_new_authorization: "Whether changing the recipient needs a new signed authorization; boolean."
  late_fulfillment_fee_waived: "Whether the fee is waived when the records are delivered after the due date; boolean."
  status_update_business_days: "Business days between status updates to the requester while the request is open; integer."
  minimum_age_self_request_years: "Youngest patient who may request their own records without a guardian; integer, years."
  release_log_required: "Whether the release is entered in the disclosure log; boolean."

