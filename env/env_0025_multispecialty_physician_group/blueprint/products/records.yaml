  - id: records_delivery
    subject: [records_delivery_updated, records_fulfilled]
    rule: >-
      Records go by one of the tier's delivery_methods. Unencrypted email is used only where
      unencrypted_email_allowed is true and the patient acknowledges the risk. Releases longer than
      fax_page_limit pages are not faxed. Records waiting for pickup are held pickup_hold_days. The delivery
      method of an open request may be changed. The request status is received, authorization_pending,
      in_process or extended when the delivery method is changed. Diagnostic images are included only where
      imaging_images_included is true; the format produced is the tier's record_format.
      Where custodian_affidavit_included is true a signed custodian affidavit accompanies the records, and
      where release_log_required is true the release is entered in the disclosure log.
    eligibility:
      - id: open_for_delivery_change
        applies_to: [records_delivery_updated]
        kind: state
        condition: "The request status is received, authorization_pending, in_process or extended when the delivery method is changed."
        evidence_fields: [records_requests.status, records_requests.records_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[records_requests.records_request_id]]
          action_bindings: {records_requests.records_request_id: records_request_id}
        state_contract:
          field: records_requests.status
          allowed: [received, authorization_pending, in_process, extended]
    params:
      per_tier:
        Portal Self-Service Download: {unencrypted_email_allowed: "=unencrypted_email_allowed", pickup_hold_days: "=pickup_hold_days", fax_page_limit: "=fax_page_limit"}
        Patient Electronic Copy Request: {unencrypted_email_allowed: "=unencrypted_email_allowed", pickup_hold_days: "=pickup_hold_days", fax_page_limit: "=fax_page_limit"}
        Patient Paper Copy Request: {unencrypted_email_allowed: "=unencrypted_email_allowed", pickup_hold_days: "=pickup_hold_days", fax_page_limit: "=fax_page_limit"}
        Provider-to-Provider Transfer: {unencrypted_email_allowed: "=unencrypted_email_allowed", pickup_hold_days: "=pickup_hold_days", fax_page_limit: "=fax_page_limit"}
        Third-Party Authorized Release: {unencrypted_email_allowed: "=unencrypted_email_allowed", pickup_hold_days: "=pickup_hold_days", fax_page_limit: "=fax_page_limit"}
        Certified Legal Records Package: {unencrypted_email_allowed: "=unencrypted_email_allowed", pickup_hold_days: "=pickup_hold_days", fax_page_limit: "=fax_page_limit"}
