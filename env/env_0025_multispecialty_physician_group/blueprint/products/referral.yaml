# Policy charter: Referrals & Prior Authorizations (one referral or authorization case per holding).
# Path: env/env_0025_multispecialty_physician_group/blueprint/products/referral.yaml

category: referral
display_name: Referrals & Prior Authorizations

binding:
  holding_table: referrals
  event_tables: [referral_events]
  intake_tables: [referral_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {units_remaining: authorized_units}

lifecycle:
  states: [requested, submitted, approved, denied, appealed, denied_final, exhausted, expired, cancelled]
  transitions:
    - {from: requested, to: submitted, by: agent, means: "The referral coordinator sends the complete request to the payer (or, for an in-group referral, to the specialty scheduler)."}
    - {from: requested, to: cancelled, by: agent, means: "The request is withdrawn before submission at the patient's or clinician's request, or closed as a duplicate."}
    - {from: submitted, to: approved, by: system, means: "The payer (or the specialty triage for an in-group referral) approves the request and issues the authorization."}
    - {from: submitted, to: denied, by: system, means: "The payer denies the request."}
    - {from: denied, to: appealed, by: user, means: "The patient authorizes and files (or authorizes the group to file) an appeal of the denial."}
    - {from: denied, to: denied_final, by: system, means: "The appeal window passes without an appeal."}
    - {from: appealed, to: approved, by: system, means: "The appeal overturns the denial."}
    - {from: appealed, to: denied_final, by: system, means: "The last available appeal level upholds the denial."}
    - {from: approved, to: exhausted, by: system, means: "The last authorized unit is used."}
    - {from: exhausted, to: approved, by: system, means: "The payer approves an extension adding units to an exhausted authorization."}
    - {from: approved, to: expired, by: system, means: "The valid-through date passes; unused units lapse."}
    - {from: approved, to: cancelled, by: agent, means: "An approved referral is cancelled at the patient's request or superseded by a standing referral."}

accounts:
  - key: authorized_units
    unit: units (visits, studies or procedures per the tier's units_measure)
    meaning: "Units of service the referral or authorization still covers; grants and restorations add units, completed visits and lapses remove them."

parameter_schema:
  standard_turnaround_business_days: "Business days (Monday-Friday, group holidays excluded) from submission within which a standard request is decided; integer."
  urgent_turnaround_hours: "Elapsed hours from submission within which an urgent request is decided; integer, hours."
  units_per_approval: "Units granted by an initial or appeal approval; integer, units."
  units_measure: "What one unit is: visits, studies or procedures; enum string."
  validity_days: "Calendar days of validity counted from valid_from; valid_through is valid_from plus this many days minus one; integer, days."
  max_extensions: "Maximum extensions one referral may receive; integer, count."
  extension_units: "Units added by one extension; 0 means an extension adds validity only; integer, units."
  extension_validity_days: "Calendar days an extension adds to valid_through; integer, days."
  extension_request_lead_days: "Calendar days before valid_through (or before the last unit is used) by which the coordinator asks for an extension so care is not interrupted; integer, days."
  payer_submission_required: "Whether the request must be approved by the payer (false = decided by the group's own specialty triage); boolean."
  clinical_notes_required: "Whether supporting clinical notes must accompany the submission; boolean."
  retro_authorization_window_days: "Calendar days after the date of service within which a retroactive authorization may be requested; 0 means none; integer, days."
  appeal_window_days: "Calendar days after the denial decision date within which an appeal may be filed; integer, days."
  appeal_decision_days: "Calendar days within which a standard appeal is decided; integer, days."
  expedited_appeal_hours: "Elapsed hours within which an expedited appeal is decided; integer, hours."
  appeal_levels_available: "Number of appeal levels available before the denial is final; integer, count."
  peer_to_peer_available: "Whether the ordering clinician may request a peer-to-peer review of a denial; boolean."
  peer_to_peer_window_business_days: "Business days after the denial within which a peer-to-peer review may be requested; integer."
  peer_to_peer_turnaround_business_days: "Business days within which the payer holds a requested peer-to-peer review; integer."
  patient_notification_business_days: "Business days after a decision within which the patient is notified; integer."
  provider_change_allowed: "Whether the rendering provider may be changed on the existing referral (same specialty); boolean."
  visits_per_week_cap: "Maximum units usable in one calendar week (Monday-Sunday); 0 means no weekly cap; integer."
  reevaluation_before_extension: "Whether a re-evaluation visit must be completed before an extension is requested; boolean."
  progress_note_every_units: "Units after which a progress note must be sent to the payer to keep the authorization current; 0 means none; integer."
  oon_cost_share_acknowledgement_required: "Whether the patient must sign an out-of-network cost-share acknowledgement before submission; boolean."
  oon_network_gap_distance_miles: "Distance beyond which the nearest in-network specialist establishes a network gap; 0 means not applicable; integer, miles."
  oon_network_gap_wait_days: "Wait for the first in-network appointment beyond which a network gap exists; 0 means not applicable; integer, days."
  chronic_condition_required: "Whether a documented chronic or complex condition is required; boolean."
  duplicate_window_days: "Calendar days after an approval within which a new request for the same specialty is treated as a duplicate while units remain; integer, days."
  unscheduled_followup_days: "Calendar days after approval after which the coordinator contacts a patient who has not booked a visit; integer, days."
  site_of_service_restricted: "Whether the service must be performed at the site named on the authorization; boolean."
  telehealth_counts_against_units: "Whether a completed telehealth visit with the rendering provider uses a unit; boolean."
  service_change_requires_new_request: "Whether a change of the ordered service (study, procedure code) requires a new request; boolean."
  pre_service_estimate_required: "Whether the patient receives a cost estimate before the first use; boolean."
  records_to_rendering_provider_business_days: "Business days after approval within which the referral packet and records go to the rendering provider; integer."
  consult_report_due_days: "Calendar days after each visit within which the rendering provider's report is due back to the referring clinician; integer, days."
  max_open_same_specialty: "Maximum referrals of the tier a patient may hold open (requested, submitted, approved, appealed) for one specialty; integer, count."
  eligibility_recheck_days: "Calendar days after which coverage is re-verified before the next unit is used; integer, days."
  second_opinion_allowed: "Whether the referral may be used for one second-opinion visit with a different provider of the specialty; boolean."
  urgent_request_allowed: "Whether the tier may be requested as urgent; boolean."
  unit_restore_window_days: "Calendar days after a unit is used within which a unit counted in error may be restored; integer, days."
  expiry_notice_days: "Calendar days before valid_through at which the patient is told the referral is about to expire; integer, days."
  exhaustion_notice_units: "Remaining units at which the patient is told the referral is nearly used up; 0 means no notice; integer, units."
  rendering_in_group_required: "Whether the rendering provider must be a Linden Ridge clinician; boolean."
  submission_channel: "How the request is submitted: internal_scheduler, payer_portal or payer_fax; enum string."
  pcp_signature_required: "Whether the referring clinician must be the patient's primary care clinician of record; boolean."
  appeal_patient_consent_required: "Whether an appeal filed by the group on the patient's behalf needs the patient's signed consent; boolean."
  liability_notice_on_denial: "Whether a patient who proceeds after a final denial must sign a financial-liability notice; boolean."

