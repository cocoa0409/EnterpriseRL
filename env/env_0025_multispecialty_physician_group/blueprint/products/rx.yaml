# Policy charter: Prescriptions & Renewals (one prescription per holding).
# Path: env/env_0025_multispecialty_physician_group/blueprint/products/rx.yaml

category: rx
display_name: Prescriptions & Renewals

binding:
  holding_table: prescriptions
  event_tables: [rx_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {refills_remaining: authorized_fills}

lifecycle:
  states: [prescribed, active, renewal_requested, on_hold, expired, discontinued]
  transitions:
    - {from: prescribed, to: active, by: agent, means: "The signed prescription is transmitted electronically to the patient's pharmacy (after any required prior authorization)."}
    - {from: prescribed, to: discontinued, by: agent, means: "A prescription is withdrawn before transmission (prior authorization denied, prescriber cancels, patient declines)."}
    - {from: active, to: renewal_requested, by: agent, means: "A renewal request from the pharmacy, the portal or a phone call is logged against the prescription."}
    - {from: expired, to: renewal_requested, by: agent, means: "A renewal of a recently expired prescription is logged inside the post-expiry window."}
    - {from: renewal_requested, to: active, by: agent, means: "The renewal is approved under the refill protocol or on the prescriber's signature and new fills are authorized."}
    - {from: renewal_requested, to: on_hold, by: agent, means: "The renewal cannot be approved until a visit, lab, drug screen, agreement or prior authorization is completed."}
    - {from: on_hold, to: active, by: agent, means: "The missing requirement is met and the renewal is approved."}
    - {from: renewal_requested, to: discontinued, by: agent, means: "The prescriber declines the renewal."}
    - {from: on_hold, to: discontinued, by: system, means: "The hold lapses unresolved or the prescriber declines."}
    - {from: active, to: expired, by: system, means: "The expiration date passes; unfilled refills lapse."}
    - {from: active, to: discontinued, by: agent, means: "The prescriber stops the medication, the patient asks to stop it, or care moves elsewhere."}

accounts:
  - key: authorized_fills
    unit: fills
    meaning: "Pharmacy fills the prescription still authorizes (the first fill plus refills); authorizations add fills, dispensings and voids remove them."

parameter_schema:
  max_days_supply_per_fill: "Largest days' supply one fill may dispense; integer, days."
  max_refills_per_authorization: "Refills authorized by one new prescription or renewal, in addition to the first fill; integer, count."
  prescription_validity_days: "Calendar days from the prescribing or renewal date after which the prescription expires (expiration_date is that date plus this many days minus one); integer, days."
  max_total_days_supply_per_authorization: "Largest total days' supply one prescription or renewal may authorize across all its fills; integer, days."
  renewal_turnaround_business_days: "Business days (Monday-Friday, group holidays excluded) within which a complete renewal request is decided; integer."
  renewal_allowed: "Whether the prescription can be renewed at all (false = a new visit and prescription are needed); boolean."
  visit_interval_months: "Calendar months after the patient's most recent completed visit with the prescribing department within which a renewal may be approved without a new visit; integer, months."
  monitoring_lab_interval_months: "Calendar months after the last monitoring lab within which a renewal may be approved; 0 means no monitoring labs; integer, months."
  drug_screen_interval_months: "Calendar months after the last drug screen within which a renewal may be approved; 0 means none required; integer, months."
  controlled_agreement_required: "Whether a signed controlled-substance agreement must be on file; boolean."
  controlled_agreement_renewal_months: "Calendar months a signed controlled-substance agreement stays current; 0 means not applicable; integer, months."
  pdmp_check_required: "Whether the state prescription-monitoring database (OARRS) must be checked before prescribing or renewing; boolean."
  pdmp_check_validity_days: "Calendar days a database check stays current for renewals; 0 means not applicable; integer, days."
  early_refill_threshold_pct: "Share of the previous fill's days' supply that must have elapsed before the next fill; percent; 0 means no refills exist."
  vacation_override_allowed: "Whether an early fill for travel may override the early-refill threshold; boolean."
  vacation_override_per_12_months: "Maximum travel overrides per prescription in a rolling 12 months; integer, count."
  bridge_supply_allowed: "Whether a one-time bridge supply may be authorized while a renewal is on hold awaiting a visit or lab; boolean."
  bridge_supply_days: "Days' supply of a bridge fill; integer, days."
  bridge_supply_max_per_12_months: "Maximum bridge supplies per prescription in a rolling 12 months; integer, count."
  renewal_after_expiry_days: "Calendar days after the expiration date within which an expired prescription may still be renewed; 0 means a new prescription is needed; integer, days."
  renewal_request_lead_days: "Business days before the patient runs out by which a renewal should be requested; integer."
  transfer_allowed: "Whether the prescription's remaining fills may be moved to another pharmacy; boolean."
  one_time_transfer_only: "Whether only one pharmacy transfer is permitted over the prescription's life; boolean."
  prior_auth_required: "Whether the payer's prior authorization must be approved before the prescription is transmitted or renewed; boolean."
  specialty_pharmacy_required: "Whether the prescription must be filled by a designated specialty pharmacy; boolean."
  mail_order_allowed: "Whether the prescription may be filled by mail order; boolean."
  mail_order_days_supply: "Days' supply of a mail-order fill; 0 means mail order not available; integer, days."
  prescriber_review_required: "Whether each renewal needs the prescriber's own signature (false = nurse refill protocol may approve); boolean."
  protocol_renewal_max_refills: "Refills a nurse-protocol renewal may authorize; 0 means protocol renewal not available; integer, count."
  portal_renewal_allowed: "Whether renewal may be requested in the MyLinden portal; boolean."
  phone_renewal_allowed: "Whether renewal may be requested by phone; boolean."
  dose_change_requires_visit: "Whether a change of dose or strength requires a visit rather than a renewal; boolean."
  lost_stolen_replacement_allowed: "Whether a replacement fill may be authorized for lost or stolen medication; boolean."
  lost_stolen_replacement_per_12_months: "Maximum replacement fills per prescription in a rolling 12 months; integer, count."
  police_report_required_for_replacement: "Whether a police report number is required for a stolen-medication replacement; boolean."
  hold_notification_business_days: "Business days within which the patient is told why a renewal is on hold; integer."
  hold_resolution_days: "Calendar days a renewal may stay on hold awaiting the missing requirement before it lapses; integer, days."
  max_active_same_medication: "Maximum open prescriptions of the same medication and strength per patient; integer, count."
  epcs_required: "Whether the prescription must be transmitted by electronic prescribing for controlled substances; boolean."
  dea_schedule: "Controlled-substance schedule of the tier: none, III-V or II; enum string."
  covering_clinician_renewal_allowed: "Whether a covering clinician may sign the renewal when the prescriber is away; boolean."
  refill_reminder_days_before_runout: "Days before the estimated run-out date that a refill reminder is sent; integer, days."
  adherence_gap_days_for_review: "Days past the estimated run-out of the last fill beyond which a renewal needs prescriber review even under protocol; 0 means not applicable; integer, days."
  benefits_investigation_business_days: "Business days to complete the benefits investigation for a specialty medication; integer."
  copay_assistance_offered: "Whether manufacturer or foundation copay assistance enrollment is offered; boolean."
  patient_education_required: "Whether medication teaching must be completed before the first fill; boolean."
  fill_sync_allowed: "Whether the prescription may be enrolled in medication synchronization with a short alignment fill; boolean."
  sync_short_fill_max_days: "Largest days' supply of a synchronization short fill; 0 means not available; integer, days."

