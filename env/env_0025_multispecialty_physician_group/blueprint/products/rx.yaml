events:
  - type: rx_prescribed
    target: prescriptions
    mutation: create
    meaning: "A clinician signs a new prescription for the patient."
    grain: "One row per prescription."
    fields:
      customer_id: "The patient."
      variant_name: "Prescription class (official tier name)."
      status: "Always prescribed on creation."
      prescribed_date: "Date the prescription is signed."
      medication_name: "Medication exactly as written on the prescription."
      strength: "Strength and form exactly as written (e.g. '20 mg tablet')."
      days_supply: "Days' supply of one fill."
      prescriber_name: "Prescribing clinician exactly as listed in the provider directory."
      prescribing_department: "Department of the prescriber."
      pharmacy_name: "Pharmacy exactly as listed in the pharmacy directory."
      refills_remaining: "0 on creation; raised by the fill authorization posted at transmission."
      expiration_date: "Prescribing date plus prescription_validity_days minus one."
      prior_auth_status: "not_required, or pending where the tier needs prior authorization."
    triggers: []
  - type: rx_transmitted
    target: prescriptions
    mutation: {transition: {from: prescribed, to: active}}
    meaning: "The prescription is transmitted to the pharmacy."
    grain: "One row per transaction."
    fields:
      status: "Set to active."
      transmitted_date: "Date of transmission."
    triggers:
      - event: rx:rx_fills_authorized
        map: {fill_date: transmitted_date, authorization_reason: new_prescription}
  - type: rx_renewal_requested
    target: prescriptions
    mutation: {transition: [{from: active, to: renewal_requested}, {from: expired, to: renewal_requested}]}
    meaning: "A renewal request is logged against the prescription."
    grain: "One row per transaction."
    fields:
      status: "Set to renewal_requested."
      renewal_requested_date: "Date the request was received."
      renewal_channel: "pharmacy_request, patient_portal or phone."
    triggers: []
  - type: rx_renewed
    target: prescriptions
    mutation: {transition: [{from: renewal_requested, to: active}, {from: on_hold, to: active}]}
    meaning: "The renewal is approved; remaining fills of the old authorization are replaced by the new authorization."
    grain: "One row per transaction."
    fields:
      status: "Set to active."
      renewed_date: "Date of the approval."
      expiration_date: "Renewal date plus prescription_validity_days minus one."
      hold_reason: "Reset to none."
      refills_remaining: "Fills left on the old authorization at the moment of renewal (voided before the new grant)."
    triggers:
      - event: rx:rx_fills_voided
        when: {refills_remaining: {not: 0}}
        map: {fill_date: renewed_date, fills: refills_remaining, void_reason: superseded_by_renewal}
      - event: rx:rx_fills_authorized
        map: {fill_date: renewed_date, authorization_reason: renewal}
  - type: rx_renewal_held
    target: prescriptions
    mutation: {transition: {from: renewal_requested, to: on_hold}}
    meaning: "The renewal waits for a visit, lab, drug screen, agreement or prior authorization."
    grain: "One row per transaction."
    fields:
      status: "Set to on_hold."
      hold_reason: "What is missing."
      hold_started_date: "Date the hold starts."
    triggers: []
  - type: rx_renewal_declined
    target: prescriptions
    mutation: {transition: [{from: renewal_requested, to: discontinued}, {from: on_hold, to: discontinued}]}
    meaning: "The renewal is declined by the prescriber or lapses after an unresolved hold."
    grain: "One row per transaction."
    fields:
      status: "Set to discontinued."
      discontinue_reason: "renewal_denied or hold_lapsed."
      closed_date: "Date of the decline."
      refills_remaining: "Fills left at the decline (voided)."
    triggers:
      - event: rx:rx_fills_voided
        when: {refills_remaining: {not: 0}}
        map: {fill_date: closed_date, fills: refills_remaining, void_reason: discontinued}
  - type: rx_expired
    target: prescriptions
    mutation: {transition: {from: active, to: expired}}
    meaning: "The prescription passes its expiration date."
    grain: "One row per transaction."
    fields:
      status: "Set to expired."
      closed_date: "The day after expiration_date."
      refills_remaining: "Fills left at expiry (voided)."
    triggers:
      - event: rx:rx_fills_voided
        when: {refills_remaining: {not: 0}}
        map: {fill_date: closed_date, fills: refills_remaining, void_reason: expired}
  - type: rx_discontinued
    target: prescriptions
    mutation: {transition: [{from: active, to: discontinued}, {from: prescribed, to: discontinued}]}
    meaning: "The medication is stopped or the prescription withdrawn."
    grain: "One row per transaction."
    fields:
      status: "Set to discontinued."
      discontinue_reason: "Why it was stopped."
      closed_date: "Date of discontinuation."
      refills_remaining: "Fills left at discontinuation (voided)."
    triggers:
      - event: rx:rx_fills_voided
        when: {refills_remaining: {not: 0}}
        map: {fill_date: closed_date, fills: refills_remaining, void_reason: discontinued}
  - type: rx_pharmacy_changed
    target: prescriptions
    mutation: update
    meaning: "The remaining fills are moved to another pharmacy."
    grain: "One row per transaction."
    fields:
      pharmacy_name: "New pharmacy exactly as listed in the pharmacy directory."
      transfer_count: "Previous count plus one."
    triggers: []
  - type: rx_compliance_updated
    target: prescriptions
    mutation: update
    meaning: "A monitoring requirement is recorded: a resulted lab, a drug screen, a signed controlled-substance agreement, a database check or a prior-authorization decision."
    grain: "One row per transaction."
    fields:
      last_monitoring_lab_date: "Result date of the latest monitoring lab."
      last_drug_screen_date: "Date of the latest drug screen."
      controlled_agreement_signed_date: "Date the patient signed the current controlled-substance agreement."
      pdmp_checked_date: "Date of the latest prescription-monitoring database check."
      prior_auth_status: "Latest prior-authorization status."
    triggers: []
  - type: rx_fills_authorized
    target: rx_events
    meaning: "Fills are authorized by a new prescription, a renewal or a lost/stolen replacement."
    grain: "One row per authorization decision on one prescription."
    distinguish_by: [authorization_reason, fill_date]
    fields:
      fill_date: "Date of the authorization."
      fills: "Fills authorized (first fill plus refills, or 1 for a replacement)."
      days_supply_per_fill: "Days' supply of each authorized fill."
      authorization_reason: "new_prescription, renewal or replacement_fill."
      police_report_number: "Police report number for a stolen-medication replacement, exactly as given; empty otherwise."
    account: authorized_fills
    direction: in
    triggers: []
  - type: rx_bridge_supply_authorized
    target: rx_events
    meaning: "A one-time bridge fill is authorized while a renewal is on hold awaiting a visit or lab."
    grain: "One row per bridge authorization on one prescription."
    distinguish_by: [fill_date]
    fields:
      fill_date: "Date of the authorization."
      fills: "Always 1."
      days_supply_per_fill: "The tier's bridge_supply_days."
      authorization_reason: "bridge_supply."
    account: authorized_fills
    direction: in
    triggers: []
  - type: rx_fill_dispensed
    target: rx_events
    meaning: "The pharmacy reports dispensing one fill."
    grain: "One row per dispensing."
    distinguish_by: [fill_date, fill_basis]
    fields:
      fill_date: "Date dispensed."
      fills: "Always 1."
      days_supply_per_fill: "Days' supply dispensed."
      fill_basis: "regular, early_vacation_override, med_sync_short_fill, replacement or bridge."
      dispensing_pharmacy: "Pharmacy that dispensed, exactly as reported."
    account: authorized_fills
    direction: out
    triggers: []
  - type: rx_fills_voided
    target: rx_events
    meaning: "Fills still authorized are voided because the prescription expired, was discontinued, was superseded by a renewal, or moved away."
    grain: "One row per void on one prescription."
    distinguish_by: [void_reason, fill_date]
    fields:
      fill_date: "Date of the void."
      fills: "Fills voided."
      void_reason: "expired, discontinued, superseded_by_renewal or transferred_out."
    account: authorized_fills
    direction: out
    triggers: []

measures:
  - id: rx_msr_last_prescriber_visit
    window: "All history up to the handling date."
    measure: "The latest scheduled_date among the patient's appointments with status completed whose department equals the prescription's prescribing_department (in-person visits) or telehealth visits with status completed in that department."
  - id: rx_msr_bridges_12m
    window: "Rolling 12 calendar months ending on the handling date."
    measure: "Count of rx_bridge_supply_authorized rows on the prescription with fill_date inside the window."
  - id: rx_msr_vacation_overrides_12m
    window: "Rolling 12 calendar months ending on the handling date."
    measure: "Count of rx_fill_dispensed rows on the prescription with fill_basis early_vacation_override and fill_date inside the window."
  - id: rx_msr_replacements_12m
    window: "Rolling 12 calendar months ending on the handling date."
    measure: "Count of rx_fills_authorized rows on the prescription with authorization_reason replacement_fill and fill_date inside the window."
  - id: rx_msr_days_since_last_fill
    window: "From the most recent rx_fill_dispensed row of the prescription to the handling date."
    measure: "Calendar days from that row's fill_date to the handling date, together with that row's days_supply_per_fill."

policies:
  - id: rx_agg_multi_holding
    subject: [rx_prescribed]
    rule: >-
      A patient may hold any number of prescriptions for different medications. How many prescriptions of
      one medication may be open at once is governed by rx_agg_same_medication.
    eligibility: []
    params: {max_per_customer: null}

  - id: rx_agg_same_medication
    subject: [rx_prescribed]
    rule: >-
      A patient holds at most max_active_same_medication open prescriptions of one medication and strength.
      The patient holds no other prescription of the same medication and strength in status prescribed,
      active, renewal_requested or on_hold. A dose or strength change is a new prescription that discontinues
      the old one with reason replaced_by_new_prescription (and, where dose_change_requires_visit is true,
      only after a visit). Across medications, a patient may hold Schedule II and Schedule III-V controlled
      prescriptions only from one prescribing clinician at a time: a controlled prescription from a second
      Linden Ridge prescriber is not written while another prescriber's controlled prescription is open,
      unless the first is discontinued with reason transferred_care.
    eligibility:
      - id: no_open_same_medication
        applies_to: [rx_prescribed]
        kind: dedup
        condition: "The patient holds no other prescription of the same medication and strength in status prescribed, active, renewal_requested or on_hold."
        evidence_fields: [prescriptions.customer_id, prescriptions.medication_name, prescriptions.strength, prescriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.customer_id, prescriptions.medication_name, prescriptions.strength]]
          action_bindings: {prescriptions.customer_id: customer_id, prescriptions.medication_name: medication_name, prescriptions.strength: strength}
        dedup_contract:
          table: prescriptions
          mode: separate_record
          object_bindings: {customer_id: customer_id, medication_name: medication_name, strength: strength}
          duplicate_filters: {status: [prescribed, active, renewal_requested, on_hold]}
          distinct_fields: []

  - id: rx_renewal_eligibility
    subject: [rx_renewal_requested, rx_renewed, rx_renewal_held]
    rule: >-
      A renewal may be requested only where renewal_allowed is true (an Acute Short-Course Prescription needs a
      new visit), through a channel the tier allows (portal where portal_renewal_allowed is true, phone where
      phone_renewal_allowed is true, and always by the pharmacy's electronic request). An expired prescription
      may be renewed only shortly after it expired. The renewal of an expired prescription is requested no
      later than the tier's post-expiry window counted from the expiration date. That window is counted in
      calendar days starting the day after the expiration date, and a request on the last day still
      qualifies. A renewal is approved only when every requirement of the tier is current on the renewal
      date; otherwise it is put on hold naming the first missing requirement in this order: visit, lab,
      drug screen, agreement, database check, prior authorization. The visit requirement: the renewal date is
      no later than the tier's visit interval counted from the patient's most recent completed visit with the
      prescribing department (rx_msr_last_prescriber_visit). The interval is counted in calendar months from
      the visit date to the same day of the month, falling back to the last day of the month when that day
      does not exist, and a renewal on that day still qualifies. The lab requirement (where
      monitoring_lab_interval_months is above 0): last_monitoring_lab_date is within that many calendar months
      before the renewal date, counted the same way. The drug screen, agreement and database requirements
      follow rx_controlled_safeguards, and the prior-authorization requirement follows rx_specialty_access. A
      renewal whose last fill ran out more than adherence_gap_days_for_review ago needs the prescriber's
      review even where the refill protocol would otherwise apply. A request that asks to change the dose is
      not a renewal where dose_change_requires_visit is true.
    eligibility:
      - id: post_expiry_window
        applies_to: [rx_renewal_requested]
        kind: time
        condition: "The renewal of an expired prescription is requested no later than the tier's post-expiry window counted from the expiration date."
        evidence_fields: [prescriptions.expiration_date, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the expiration date"
          anchor_source: prescriptions.expiration_date
          relation: not_after
          duration_source: variants.renewal_after_expiry_days
          unit: calendar_days
          counting_rule: "That window is counted in calendar days starting the day after the expiration date, and a request on the last day still qualifies."
          boundary: inclusive
      - id: visit_current
        applies_to: [rx_renewed]
        kind: time
        condition: "the renewal date is no later than the tier's visit interval counted from the patient's most recent completed visit with the prescribing department"
        evidence_fields: [appointments.scheduled_date, appointments.status, appointments.department, appointments.appointment_id, prescriptions.prescribing_department]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[appointments.appointment_id]]
          action_bindings: {appointments.appointment_id: appointment_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the patient's most recent completed visit with the prescribing department"
          anchor_source: appointments.scheduled_date
          relation: not_after
          duration_source: variants.visit_interval_months
          unit: calendar_months
          counting_rule: "The interval is counted in calendar months from the visit date to the same day of the month, falling back to the last day of the month when that day does not exist, and a renewal on that day still qualifies."
          boundary: inclusive
    params:
      per_tier:
        Acute Short-Course Prescription: {visit_interval_months: "=visit_interval_months", monitoring_lab_interval_months: "=monitoring_lab_interval_months", renewal_after_expiry_days: "=renewal_after_expiry_days"}
        Standard Maintenance Prescription: {visit_interval_months: "=visit_interval_months", monitoring_lab_interval_months: "=monitoring_lab_interval_months", renewal_after_expiry_days: "=renewal_after_expiry_days"}
        Monitored Maintenance Prescription: {visit_interval_months: "=visit_interval_months", monitoring_lab_interval_months: "=monitoring_lab_interval_months", renewal_after_expiry_days: "=renewal_after_expiry_days"}
        Schedule III-V Controlled Prescription: {visit_interval_months: "=visit_interval_months", monitoring_lab_interval_months: "=monitoring_lab_interval_months", renewal_after_expiry_days: "=renewal_after_expiry_days"}
        Schedule II Controlled Prescription: {visit_interval_months: "=visit_interval_months", monitoring_lab_interval_months: "=monitoring_lab_interval_months", renewal_after_expiry_days: "=renewal_after_expiry_days"}
        Specialty Medication Prescription: {visit_interval_months: "=visit_interval_months", monitoring_lab_interval_months: "=monitoring_lab_interval_months", renewal_after_expiry_days: "=renewal_after_expiry_days"}
    measures: [rx_msr_last_prescriber_visit]

  - id: rx_fill_authorization
    subject: [rx_fills_authorized, rx_renewed, rx_fills_voided]
    rule: >-
      A new prescription or a renewal authorizes the first fill plus refills: the number of fills is the
      smaller of max_refills_per_authorization plus one and the whole number of fills of days_supply that fit
      in max_total_days_supply_per_authorization (rounded down), and one fill never exceeds
      max_days_supply_per_fill. A renewal approved under the nurse refill protocol (only where
      prescriber_review_required is false) authorizes at most protocol_renewal_max_refills refills plus the
      first fill. Fills are authorized only while the prescription status is active. A renewal replaces the
      old authorization: fills still left at the moment of renewal are voided as superseded_by_renewal before
      the new fills are granted, so fills never accumulate across renewals. A renewal sets a new
      expiration_date of the renewal date plus prescription_validity_days minus one. Complete renewal requests
      are decided within renewal_turnaround_business_days; a covering clinician may sign where
      covering_clinician_renewal_allowed is true.
    eligibility:
      - id: authorize_when_active
        applies_to: [rx_fills_authorized]
        kind: state
        condition: "Fills are authorized only while the prescription status is active."
        evidence_fields: [prescriptions.status, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}
        state_contract:
          field: prescriptions.status
          allowed: [active]
    params:
      per_tier:
        Acute Short-Course Prescription: {max_refills_per_authorization: "=max_refills_per_authorization", max_total_days_supply_per_authorization: "=max_total_days_supply_per_authorization", protocol_renewal_max_refills: "=protocol_renewal_max_refills"}
        Standard Maintenance Prescription: {max_refills_per_authorization: "=max_refills_per_authorization", max_total_days_supply_per_authorization: "=max_total_days_supply_per_authorization", protocol_renewal_max_refills: "=protocol_renewal_max_refills"}
        Monitored Maintenance Prescription: {max_refills_per_authorization: "=max_refills_per_authorization", max_total_days_supply_per_authorization: "=max_total_days_supply_per_authorization", protocol_renewal_max_refills: "=protocol_renewal_max_refills"}
        Schedule III-V Controlled Prescription: {max_refills_per_authorization: "=max_refills_per_authorization", max_total_days_supply_per_authorization: "=max_total_days_supply_per_authorization", protocol_renewal_max_refills: "=protocol_renewal_max_refills"}
        Schedule II Controlled Prescription: {max_refills_per_authorization: "=max_refills_per_authorization", max_total_days_supply_per_authorization: "=max_total_days_supply_per_authorization", protocol_renewal_max_refills: "=protocol_renewal_max_refills"}
        Specialty Medication Prescription: {max_refills_per_authorization: "=max_refills_per_authorization", max_total_days_supply_per_authorization: "=max_total_days_supply_per_authorization", protocol_renewal_max_refills: "=protocol_renewal_max_refills"}
    formula:
      fills: min(max_refills_per_authorization + 1, max_total_days_supply_per_authorization / days_supply)

  - id: rx_fill_timing
    subject: [rx_fill_dispensed]
    rule: >-
      A fill is dispensed only while the prescription status is active, on or before its expiration_date,
      and while refills_remaining is above 0. The next fill is due once early_refill_threshold_pct of the
      previous fill's days' supply has elapsed (rx_msr_days_since_last_fill); an earlier fill is refused
      unless it is a travel override (only where vacation_override_allowed is true and
      rx_msr_vacation_overrides_12m is below vacation_override_per_12_months), a medication-synchronization
      short fill of at most sync_short_fill_max_days (only where fill_sync_allowed is true), or an authorized
      replacement or bridge fill. Mail-order fills, where mail_order_allowed is true, dispense
      mail_order_days_supply; a specialty prescription is dispensed only by the designated specialty pharmacy.
      Where specialty_pharmacy_required is true only the designated specialty pharmacy may dispense.
    eligibility:
      - id: dispense_when_active
        applies_to: [rx_fill_dispensed]
        kind: state
        condition: "A fill is dispensed only while the prescription status is active, on or before its expiration_date, and while refills_remaining is above 0."
        evidence_fields: [prescriptions.status, prescriptions.expiration_date, prescriptions.refills_remaining, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}
        state_contract:
          field: prescriptions.status
          allowed: [active]
    params:
      per_tier:
        Acute Short-Course Prescription: {early_refill_threshold_pct: "=early_refill_threshold_pct", vacation_override_per_12_months: "=vacation_override_per_12_months"}
        Standard Maintenance Prescription: {early_refill_threshold_pct: "=early_refill_threshold_pct", vacation_override_per_12_months: "=vacation_override_per_12_months"}
        Monitored Maintenance Prescription: {early_refill_threshold_pct: "=early_refill_threshold_pct", vacation_override_per_12_months: "=vacation_override_per_12_months"}
        Schedule III-V Controlled Prescription: {early_refill_threshold_pct: "=early_refill_threshold_pct", vacation_override_per_12_months: "=vacation_override_per_12_months"}
        Schedule II Controlled Prescription: {early_refill_threshold_pct: "=early_refill_threshold_pct", vacation_override_per_12_months: "=vacation_override_per_12_months"}
        Specialty Medication Prescription: {early_refill_threshold_pct: "=early_refill_threshold_pct", vacation_override_per_12_months: "=vacation_override_per_12_months"}
    formula:
      earliest_regular_fill_day: round(days_supply_per_fill * early_refill_threshold_pct / 100, 0)
    measures: [rx_msr_days_since_last_fill, rx_msr_vacation_overrides_12m]

  - id: rx_bridge_supply
    subject: [rx_bridge_supply_authorized]
    rule: >-
      While a renewal is on hold because the visit or lab requirement is not current, a single bridge fill of
      bridge_supply_days may be authorized so the patient does not run out, where bridge_supply_allowed is
      true and rx_msr_bridges_12m is below bridge_supply_max_per_12_months. A bridge is authorized only
      while the prescription status is on_hold. Combination with appointments: the patient holds a booked or
      confirmed appointment with the prescribing department whose scheduled date falls within the tier's
      hold_resolution_days after the hold started. A bridge is never authorized for a hold caused by a drug
      screen, agreement, database check or prior authorization, and never for a controlled or specialty
      prescription.
    eligibility:
      - id: bridge_when_on_hold
        applies_to: [rx_bridge_supply_authorized]
        kind: state
        condition: "A bridge is authorized only while the prescription status is on_hold."
        evidence_fields: [prescriptions.status, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}
        state_contract:
          field: prescriptions.status
          allowed: [on_hold]
      - id: visit_booked
        applies_to: [rx_bridge_supply_authorized]
        kind: authorization
        condition: "the patient holds a booked or confirmed appointment with the prescribing department whose scheduled date falls within the tier's hold_resolution_days after the hold started."
        evidence_fields: [appointments.status, appointments.department, appointments.scheduled_date, appointments.appointment_id, prescriptions.hold_started_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[appointments.appointment_id]]
          action_bindings: {appointments.appointment_id: appointment_id}
    params:
      per_tier:
        Acute Short-Course Prescription: {bridge_supply_days: "=bridge_supply_days", bridge_supply_max_per_12_months: "=bridge_supply_max_per_12_months"}
        Standard Maintenance Prescription: {bridge_supply_days: "=bridge_supply_days", bridge_supply_max_per_12_months: "=bridge_supply_max_per_12_months"}
        Monitored Maintenance Prescription: {bridge_supply_days: "=bridge_supply_days", bridge_supply_max_per_12_months: "=bridge_supply_max_per_12_months"}
        Schedule III-V Controlled Prescription: {bridge_supply_days: "=bridge_supply_days", bridge_supply_max_per_12_months: "=bridge_supply_max_per_12_months"}
        Schedule II Controlled Prescription: {bridge_supply_days: "=bridge_supply_days", bridge_supply_max_per_12_months: "=bridge_supply_max_per_12_months"}
        Specialty Medication Prescription: {bridge_supply_days: "=bridge_supply_days", bridge_supply_max_per_12_months: "=bridge_supply_max_per_12_months"}
    measures: [rx_msr_bridges_12m]

  - id: rx_hold_lapse
    subject: [rx_renewal_held, rx_renewal_declined]
    rule: >-
      The patient is told within hold_notification_business_days business days why a renewal is on hold and
      what completes it. Completing the requirement (a completed visit, a resulted lab or screen, a signed
      agreement, a database check, an approved prior authorization) lets the renewal be approved from hold. A
      hold lapses into a decline when it is not resolved in time. A hold lapses only after it has lasted
      longer than the tier's hold resolution days counted from the date the hold started. The hold is counted
      in calendar days starting the day after the hold started, and the lapse may be recorded only from the
      day after the last counted day. A lapsed renewal is recorded as declined with reason hold_lapsed; the
      patient then needs a visit and a new prescription. A prescriber may decline a renewal at any time for
      clinical reasons (reason renewal_denied); that decision belongs to the prescriber alone.
    eligibility:
      - id: hold_lasted
        applies_to: [rx_renewal_declined]
        kind: time
        condition: "A hold lapses only after it has lasted longer than the tier's hold resolution days counted from the date the hold started."
        evidence_fields: [prescriptions.hold_started_date, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date the hold started"
          anchor_source: prescriptions.hold_started_date
          relation: not_before
          duration_source: variants.hold_resolution_days
          unit: calendar_days
          counting_rule: "The hold is counted in calendar days starting the day after the hold started, and the lapse may be recorded only from the day after the last counted day."
          boundary: exclusive
    params:
      per_tier:
        Acute Short-Course Prescription: {hold_resolution_days: "=hold_resolution_days", hold_notification_business_days: "=hold_notification_business_days"}
        Standard Maintenance Prescription: {hold_resolution_days: "=hold_resolution_days", hold_notification_business_days: "=hold_notification_business_days"}
        Monitored Maintenance Prescription: {hold_resolution_days: "=hold_resolution_days", hold_notification_business_days: "=hold_notification_business_days"}
        Schedule III-V Controlled Prescription: {hold_resolution_days: "=hold_resolution_days", hold_notification_business_days: "=hold_notification_business_days"}
        Schedule II Controlled Prescription: {hold_resolution_days: "=hold_resolution_days", hold_notification_business_days: "=hold_notification_business_days"}
        Specialty Medication Prescription: {hold_resolution_days: "=hold_resolution_days", hold_notification_business_days: "=hold_notification_business_days"}

  - id: rx_controlled_safeguards
    subject: [rx_renewed, rx_compliance_updated]
    rule: >-
      For a tier whose controlled_agreement_required is true, a controlled prescription is renewed only
      when a controlled-substance agreement signed by the patient within controlled_agreement_renewal_months
      calendar months of the renewal date is on file, a drug screen dated within drug_screen_interval_months
      is on file, and, where pdmp_check_required is true, the prescription-monitoring database was checked
      within pdmp_check_validity_days calendar days of the renewal date. Signing the agreement is the
      patient's own act; nobody signs it for the patient. A Schedule II Controlled Prescription has no
      refills: every fill needs its own prescription, it cannot be transferred between pharmacies, and it is
      transmitted only electronically where epcs_required is true. Controlled prescriptions never receive a
      travel override, a bridge supply or a lost or stolen replacement.
      The tier's dea_schedule (II or III-V, none for the other classes) identifies which of these
      safeguards apply.
    eligibility:
      - id: agreement_current
        applies_to: [rx_renewed]
        kind: authorization
        condition: "For a tier whose controlled_agreement_required is true, a controlled prescription is renewed only when a controlled-substance agreement signed by the patient within controlled_agreement_renewal_months calendar months of the renewal date is on file"
        evidence_fields: [prescriptions.controlled_agreement_signed_date, prescriptions.last_drug_screen_date, prescriptions.pdmp_checked_date, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}
    params:
      per_tier:
        Acute Short-Course Prescription: {controlled_agreement_renewal_months: "=controlled_agreement_renewal_months", drug_screen_interval_months: "=drug_screen_interval_months", pdmp_check_validity_days: "=pdmp_check_validity_days"}
        Standard Maintenance Prescription: {controlled_agreement_renewal_months: "=controlled_agreement_renewal_months", drug_screen_interval_months: "=drug_screen_interval_months", pdmp_check_validity_days: "=pdmp_check_validity_days"}
        Monitored Maintenance Prescription: {controlled_agreement_renewal_months: "=controlled_agreement_renewal_months", drug_screen_interval_months: "=drug_screen_interval_months", pdmp_check_validity_days: "=pdmp_check_validity_days"}
        Schedule III-V Controlled Prescription: {controlled_agreement_renewal_months: "=controlled_agreement_renewal_months", drug_screen_interval_months: "=drug_screen_interval_months", pdmp_check_validity_days: "=pdmp_check_validity_days"}
        Schedule II Controlled Prescription: {controlled_agreement_renewal_months: "=controlled_agreement_renewal_months", drug_screen_interval_months: "=drug_screen_interval_months", pdmp_check_validity_days: "=pdmp_check_validity_days"}
        Specialty Medication Prescription: {controlled_agreement_renewal_months: "=controlled_agreement_renewal_months", drug_screen_interval_months: "=drug_screen_interval_months", pdmp_check_validity_days: "=pdmp_check_validity_days"}

  - id: rx_pharmacy_transfer
    subject: [rx_pharmacy_changed, rx_fills_voided]
    rule: >-
      A patient may move the remaining fills of a prescription to another pharmacy where transfer_allowed is
      true; the prescription keeps its fills and expiration and only the pharmacy changes. Where
      one_time_transfer_only is true, a prescription whose transfer_count is already 1 or more cannot be
      transferred again. The prescription status is active or renewal_requested when the pharmacy is changed.
      A Schedule II prescription is not transferred: the patient asks for the next prescription to be sent to
      the new pharmacy. A specialty prescription can move only between designated specialty pharmacies. A
      patient moving all care to an outside practice has open prescriptions discontinued with reason
      transferred_care, and their remaining fills are voided.
    eligibility:
      - id: transferable_status
        applies_to: [rx_pharmacy_changed]
        kind: state
        condition: "The prescription status is active or renewal_requested when the pharmacy is changed."
        evidence_fields: [prescriptions.status, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}
        state_contract:
          field: prescriptions.status
          allowed: [active, renewal_requested]
    params:
      per_tier:
        Acute Short-Course Prescription: {transfer_allowed: "=transfer_allowed", one_time_transfer_only: "=one_time_transfer_only"}
        Standard Maintenance Prescription: {transfer_allowed: "=transfer_allowed", one_time_transfer_only: "=one_time_transfer_only"}
        Monitored Maintenance Prescription: {transfer_allowed: "=transfer_allowed", one_time_transfer_only: "=one_time_transfer_only"}
        Schedule III-V Controlled Prescription: {transfer_allowed: "=transfer_allowed", one_time_transfer_only: "=one_time_transfer_only"}
        Schedule II Controlled Prescription: {transfer_allowed: "=transfer_allowed", one_time_transfer_only: "=one_time_transfer_only"}
        Specialty Medication Prescription: {transfer_allowed: "=transfer_allowed", one_time_transfer_only: "=one_time_transfer_only"}

  - id: rx_lost_stolen_replacement
    subject: [rx_fills_authorized]
    rule: >-
      Where lost_stolen_replacement_allowed is true, one replacement fill may be authorized for medication
      that was lost or stolen, when rx_msr_replacements_12m is below lost_stolen_replacement_per_12_months;
      it is posted with authorization_reason replacement_fill and one fill. Where
      police_report_required_for_replacement is true, a stolen-medication replacement needs the police report
      number, recorded exactly as the patient gives it. A replacement is never authorized for controlled
      prescriptions, and damaged or spilled medication is treated as lost.
    eligibility: []
    params:
      per_tier:
        Acute Short-Course Prescription: {lost_stolen_replacement_per_12_months: "=lost_stolen_replacement_per_12_months"}
        Standard Maintenance Prescription: {lost_stolen_replacement_per_12_months: "=lost_stolen_replacement_per_12_months"}
        Monitored Maintenance Prescription: {lost_stolen_replacement_per_12_months: "=lost_stolen_replacement_per_12_months"}
        Schedule III-V Controlled Prescription: {lost_stolen_replacement_per_12_months: "=lost_stolen_replacement_per_12_months"}
        Schedule II Controlled Prescription: {lost_stolen_replacement_per_12_months: "=lost_stolen_replacement_per_12_months"}
        Specialty Medication Prescription: {lost_stolen_replacement_per_12_months: "=lost_stolen_replacement_per_12_months"}
    measures: [rx_msr_replacements_12m]

  - id: rx_specialty_access
    subject: [rx_transmitted, rx_compliance_updated]
    rule: >-
      Where prior_auth_required is true, a prescription is transmitted, and a renewal approved, only after
      the payer's prior authorization is recorded as approved; the benefits investigation is completed within
      benefits_investigation_business_days business days, copay assistance enrollment is offered where
      copay_assistance_offered is true, and medication teaching is completed before the first fill where
      patient_education_required is true. A specialty prescription is filled only by a designated specialty
      pharmacy. A denied prior authorization leaves the prescription untransmitted, and it is discontinued if
      the payer's appeal is not pursued. A Self-Pay Account patient needs no prior authorization but pays the
      pharmacy's cash price.
    eligibility:
      - id: pa_approved
        applies_to: [rx_transmitted]
        kind: authorization
        condition: "Where prior_auth_required is true, a prescription is transmitted, and a renewal approved, only after the payer's prior authorization is recorded as approved"
        evidence_fields: [prescriptions.prior_auth_status, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}

  - id: rx_expiry_and_discontinuation
    subject: [rx_expired, rx_discontinued, rx_fills_voided]
    rule: >-
      A prescription expires the day after its expiration_date whether or not fills remain; unfilled fills
      are voided with reason expired. A prescription is discontinued when the prescriber stops the
      medication, when the patient asks to stop it, when a new strength replaces it, or when care moves to an
      outside practice; remaining fills are voided with reason discontinued. A patient's request to stop a
      medication is recorded as asked but is sent to the prescriber for acknowledgement, and it never
      discontinues other prescriptions. Refill reminders go out refill_reminder_days_before_runout days before
      the estimated run-out, and patients are asked to request renewals renewal_request_lead_days business
      days ahead.
    eligibility: []
