events:
  - type: telehealth_requested
    target: telehealth_visits
    mutation: create
    meaning: "A patient requests a virtual encounter: submits an e-visit, asks for a phone or video visit, or joins the on-demand queue."
    grain: "One row per virtual encounter."
    fields:
      customer_id: "The patient."
      variant_name: "Encounter type (official tier name)."
      status: "Always requested on creation."
      requested_date: "Date of the request."
      department: "Department providing the encounter."
      encounter_number: "Encounter number assigned at request."
      patient_location_state: "State the patient says they are in at request."
      referral_id: "Referral the encounter is covered by, for a specialty follow-up; empty otherwise."
      prepaid_balance_usd: "0.00 on creation; raised only by a prepayment."
      cancel_timing: "not_cancelled on creation."
    triggers: []
  - type: telehealth_scheduled
    target: telehealth_visits
    mutation: {transition: {from: requested, to: scheduled}}
    meaning: "A scheduled phone or video visit gets its date, time and clinician."
    grain: "One row per transaction."
    fields:
      status: "Set to scheduled."
      scheduled_date: "Visit date."
      scheduled_time: "Start time, clinic local time."
      clinician_name: "Clinician exactly as listed in the provider directory."
    triggers: []
  - type: telehealth_started
    target: telehealth_visits
    mutation: {transition: [{from: requested, to: in_progress}, {from: scheduled, to: in_progress}]}
    meaning: "A clinician opens the encounter and the patient attests their location."
    grain: "One row per transaction."
    fields:
      status: "Set to in_progress."
      clinician_name: "Clinician who opened the encounter."
      patient_location_state: "State attested by the patient at the start."
    triggers: []
  - type: telehealth_completed
    target: telehealth_visits
    mutation: {transition: {from: in_progress, to: completed}}
    meaning: "The clinician closes the encounter."
    grain: "One row per transaction."
    fields:
      status: "Set to completed."
      closed_date: "Date closed."
      connected_minutes: "Minutes the patient and clinician were connected."
      end_reason: "completed_normally, audio_fallback_completed or technical_failure_no_charge."
      encounter_number: "Encounter of the visit."
      referral_id: "Referral the encounter is covered by, or empty."
      prepaid_balance_usd: "Prepayment held at completion."
    triggers:
      - event: referral:referral_unit_used
        when: {referral_id: {not: ""}, end_reason: [completed_normally, audio_fallback_completed]}
        map: {referral_id: referral_id, encounter_number: encounter_number, unit_date: closed_date, units: 1, source_category: telehealth}
      - event: telehealth:telehealth_prepayment_released
        when: {prepaid_balance_usd: {not: 0.00}, end_reason: [completed_normally, audio_fallback_completed]}
        map: {amount: prepaid_balance_usd, event_date: closed_date, encounter_number: encounter_number, disposition: applied_to_visit}
      - event: telehealth:telehealth_prepayment_released
        when: {prepaid_balance_usd: {not: 0.00}, end_reason: technical_failure_no_charge}
        map: {amount: prepaid_balance_usd, event_date: closed_date, encounter_number: encounter_number, disposition: refunded}
  - type: telehealth_converted
    target: telehealth_visits
    mutation: {transition: {from: in_progress, to: converted_to_in_person}}
    meaning: "The clinician ends the virtual encounter because an in-person examination is needed."
    grain: "One row per transaction."
    fields:
      status: "Set to converted_to_in_person."
      closed_date: "Date of conversion."
      converted_appointment_id: "In-person appointment booked for the conversion, or empty until booked."
      encounter_number: "Encounter of the virtual visit."
      prepaid_balance_usd: "Prepayment held at conversion."
    triggers:
      - event: telehealth:telehealth_prepayment_released
        when: {prepaid_balance_usd: {not: 0.00}}
        map: {amount: prepaid_balance_usd, event_date: closed_date, encounter_number: encounter_number, disposition: conversion_credit}
  - type: telehealth_cancelled
    target: telehealth_visits
    mutation: {transition: [{from: requested, to: cancelled}, {from: scheduled, to: cancelled}]}
    meaning: "The encounter is cancelled by the patient or clinic, or released from the queue after the maximum wait."
    grain: "One row per transaction."
    fields:
      status: "Set to cancelled."
      closed_date: "Date of cancellation."
      cancel_timing: "timely, late, clinic_initiated or queue_timeout."
      encounter_number: "Encounter of the visit."
      prepaid_balance_usd: "Prepayment held at cancellation."
    triggers:
      - event: telehealth:telehealth_prepayment_released
        when: {prepaid_balance_usd: {not: 0.00}, cancel_timing: [timely, clinic_initiated, queue_timeout]}
        map: {amount: prepaid_balance_usd, event_date: closed_date, encounter_number: encounter_number, disposition: refunded}
  - type: telehealth_no_show
    target: telehealth_visits
    mutation: {transition: {from: scheduled, to: no_show}}
    meaning: "The patient does not join within the join grace period."
    grain: "One row per transaction."
    fields:
      status: "Set to no_show."
      closed_date: "Scheduled date."
    triggers: []
  - type: telehealth_rescheduled
    target: telehealth_visits
    mutation: update
    meaning: "A scheduled virtual visit is moved."
    grain: "One row per transaction."
    fields:
      scheduled_date: "New date."
      scheduled_time: "New start time."
      reschedule_count: "Previous count plus one."
    triggers: []
  - type: telehealth_prepayment_collected
    target: telehealth_events
    meaning: "A prepayment is collected when the encounter is requested."
    grain: "One row per prepayment of one encounter."
    distinguish_by: [event_date, payment_method]
    fields:
      event_date: "Collection date."
      encounter_number: "Encounter prepaid."
      amount: "Amount collected."
      payment_method: "How it was paid."
    account: visit_prepayment
    direction: in
    triggers: []
  - type: telehealth_prepayment_released
    target: telehealth_events
    meaning: "The prepayment leaves the encounter: applied to it, refunded, credited toward an in-person visit, or forfeited toward a fee."
    grain: "One row per disposition of one encounter's prepayment."
    distinguish_by: [disposition]
    fields:
      event_date: "Release date."
      encounter_number: "Encounter prepaid."
      amount: "Amount released under this disposition."
      disposition: "applied_to_visit, refunded, conversion_credit or forfeited_to_fee."
    account: visit_prepayment
    direction: out
    triggers:
      - event: billing:billing_copay_collected
        when: {disposition: applied_to_visit}
        map: {txn_date: event_date, encounter_number: encounter_number, amount: amount, payment_method: virtual_prepayment, channel: system}
      - event: billing:billing_payment_posted
        when: {disposition: [conversion_credit, forfeited_to_fee]}
        map: {txn_date: event_date, amount: amount, payment_method: virtual_prepayment, channel: system}
  - type: telehealth_fee_assessed
    target: telehealth_events
    meaning: "A virtual no-show or late-cancellation fee, or the self-pay price of the encounter, is charged."
    grain: "One row per fee type on one encounter."
    distinguish_by: [fee_type]
    fields:
      event_date: "Date assessed."
      service_date: "Date of the encounter."
      encounter_number: "Encounter charged."
      fee_type: "no_show_fee, late_cancel_fee or self_pay_visit."
      amount: "Amount charged."
    triggers:
      - event: billing:billing_charge_posted
        map: {txn_date: event_date, service_date: service_date, encounter_number: encounter_number, amount: amount, line_category: telehealth_fee, source_category: telehealth, channel: system}
  - type: telehealth_fee_waived
    target: telehealth_events
    meaning: "A virtual fee is waived at assessment or removed afterwards."
    grain: "One row per waived fee of one encounter."
    distinguish_by: [fee_type, waiver_reason]
    fields:
      event_date: "Date of the waiver."
      encounter_number: "Encounter concerned."
      fee_type: "Fee waived."
      waiver_reason: "first_offense, medicaid_prohibition, technical_failure or clinic_error."
      amount: "Amount waived."
      applies_to_event_id: "Assessed fee row removed; empty when waived at assessment."
    triggers:
      - event: billing:billing_adjustment_posted
        when: {applies_to_event_id: {not: ""}}
        map: {txn_date: event_date, amount: amount, adjustment_code: telehealth_fee_waiver}

measures:
  - id: telehealth_msr_encounters_7d
    window: "Rolling 7 calendar days ending on the handling date."
    measure: "Count of the patient's telehealth visits of the same tier with requested_date inside the window and status other than cancelled."
  - id: telehealth_msr_last_in_person
    window: "All history up to the handling date."
    measure: "Latest scheduled_date among the patient's appointments with status completed in the encounter's department."
  - id: telehealth_msr_no_shows_12m
    window: "Rolling 12 calendar months ending on the scheduled date of the missed visit, excluding it."
    measure: "Count of the patient's other telehealth visits with status no_show whose scheduled_date falls inside the window."

policies:
  - id: telehealth_agg_multi_holding
    subject: [telehealth_requested]
    rule: >-
      A patient may hold any number of virtual encounters over time and across types; how many may be
      started within a week, and how many may wait at once, is governed by telehealth_agg_frequency.
    eligibility: []
    params: {max_per_customer: null}

  - id: telehealth_agg_frequency
    subject: [telehealth_requested]
    rule: >-
      A patient may start no more than max_per_7_days encounters of one type in any rolling 7 days
      (telehealth_msr_encounters_7d). The patient holds no other encounter of the same type in status
      requested or in_progress. A patient needing care beyond the weekly limit is offered an in-person
      visit instead.
    eligibility:
      - id: one_waiting_per_type
        applies_to: [telehealth_requested]
        kind: dedup
        condition: "The patient holds no other encounter of the same type in status requested or in_progress."
        evidence_fields: [telehealth_visits.customer_id, telehealth_visits.variant_name, telehealth_visits.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[telehealth_visits.customer_id, telehealth_visits.variant_name]]
          action_bindings: {telehealth_visits.customer_id: customer_id, telehealth_visits.variant_name: variant_name}
        dedup_contract:
          table: telehealth_visits
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name}
          duplicate_filters: {status: [requested, in_progress]}
          distinct_fields: []
    params:
      per_tier:
        Portal E-Visit: {max_per_7_days: "=max_per_7_days"}
        Audio-Only Phone Visit: {max_per_7_days: "=max_per_7_days"}
        Primary Care Video Visit: {max_per_7_days: "=max_per_7_days"}
        Behavioral Health Video Visit: {max_per_7_days: "=max_per_7_days"}
        Specialty Video Follow-Up: {max_per_7_days: "=max_per_7_days"}
        On-Demand Virtual Urgent Care: {max_per_7_days: "=max_per_7_days"}
    formula:
      request_allowed: telehealth_msr_encounters_7d < max_per_7_days
    measures: [telehealth_msr_encounters_7d]

  - id: telehealth_location_and_eligibility
    subject: [telehealth_requested, telehealth_started]
    rule: >-
      A clinician may treat only a patient physically located in a state the tier's licensed_states covers
      at the moment of the encounter. The patient attests being physically in a covered state when the
      encounter starts. A patient elsewhere is told to use local care; the request is cancelled as
      clinic_initiated. Where new_patient_allowed is false the patient must have a completed visit in the
      group within the last established_lookback_months months. Patients younger than minimum_age_years are not served, and a
      parent or guardian joins for patients younger than guardian_present_under_age. Where
      in_person_interval_months is above 0, continued virtual care requires a completed in-person visit in
      the department (telehealth_msr_last_in_person) within that many calendar months before the
      encounter; otherwise the patient is booked in person first. Where emergency_contact_required or
      crisis_protocol_required is true, the emergency contact and safety plan are confirmed at the start.
      The device the tier requires (device_requirement) must be available to the patient.
      Where location_attestation_required is true the attestation is recorded at the start of every
      encounter.
    eligibility:
      - id: located_in_covered_state
        applies_to: [telehealth_started]
        kind: caller_fact
        condition: "The patient attests being physically in a covered state when the encounter starts."
        evidence_fields: [telehealth_visits.patient_location_state, telehealth_visits.telehealth_visit_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[telehealth_visits.telehealth_visit_id]]
          action_bindings: {telehealth_visits.telehealth_visit_id: telehealth_visit_id}
    params:
      per_tier:
        Portal E-Visit: {new_patient_allowed: "=new_patient_allowed", minimum_age_years: "=minimum_age_years", in_person_interval_months: "=in_person_interval_months"}
        Audio-Only Phone Visit: {new_patient_allowed: "=new_patient_allowed", minimum_age_years: "=minimum_age_years", in_person_interval_months: "=in_person_interval_months"}
        Primary Care Video Visit: {new_patient_allowed: "=new_patient_allowed", minimum_age_years: "=minimum_age_years", in_person_interval_months: "=in_person_interval_months"}
        Behavioral Health Video Visit: {new_patient_allowed: "=new_patient_allowed", minimum_age_years: "=minimum_age_years", in_person_interval_months: "=in_person_interval_months"}
        Specialty Video Follow-Up: {new_patient_allowed: "=new_patient_allowed", minimum_age_years: "=minimum_age_years", in_person_interval_months: "=in_person_interval_months"}
        On-Demand Virtual Urgent Care: {new_patient_allowed: "=new_patient_allowed", minimum_age_years: "=minimum_age_years", in_person_interval_months: "=in_person_interval_months"}
    measures: [telehealth_msr_last_in_person]

  - id: telehealth_pricing_and_prepayment
    subject: [telehealth_prepayment_collected, telehealth_fee_assessed]
    rule: >-
      Combination with the financial account: an insured patient's encounter is billed to the payer where
      insurance_billable is true and the patient owes the copay of the tier's telehealth_copay_class (none,
      primary or specialist) under the financial account rules; a Self-Pay Account patient pays
      self_pay_price_usd, charged as a self_pay_visit fee on completion. Where prepayment_required is true,
      the price (for self-pay) or the copay (for insured patients) is collected when the encounter is
      requested and held on the encounter; Medicaid Managed Care Account patients prepay nothing. One
      prepayment is collected per encounter. The prepayment is applied to the encounter on completion,
      refunded within prepayment_refund_business_days on a timely or clinic-initiated cancellation, a
      queue timeout or an uncharged technical failure, credited toward the in-person visit on conversion,
      and forfeited toward a fee only on a late cancellation. The self-pay price is shown before the request
      is submitted where price_transparency_display is true, and no other charge is added.
    eligibility:
      - id: one_prepayment
        applies_to: [telehealth_prepayment_collected]
        kind: dedup
        condition: "One prepayment is collected per encounter."
        evidence_fields: [telehealth_events.telehealth_visit_id, telehealth_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[telehealth_events.telehealth_visit_id]]
          action_bindings: {telehealth_events.telehealth_visit_id: telehealth_visit_id}
        dedup_contract:
          table: telehealth_events
          mode: separate_record
          object_bindings: {telehealth_visit_id: telehealth_visit_id}
          duplicate_filters: {event_type: [telehealth_prepayment_collected]}
          distinct_fields: []
    params:
      per_tier:
        Portal E-Visit: {self_pay_price_usd: "=self_pay_price_usd", prepayment_required: "=prepayment_required", telehealth_copay_class: "=telehealth_copay_class"}
        Audio-Only Phone Visit: {self_pay_price_usd: "=self_pay_price_usd", prepayment_required: "=prepayment_required", telehealth_copay_class: "=telehealth_copay_class"}
        Primary Care Video Visit: {self_pay_price_usd: "=self_pay_price_usd", prepayment_required: "=prepayment_required", telehealth_copay_class: "=telehealth_copay_class"}
        Behavioral Health Video Visit: {self_pay_price_usd: "=self_pay_price_usd", prepayment_required: "=prepayment_required", telehealth_copay_class: "=telehealth_copay_class"}
        Specialty Video Follow-Up: {self_pay_price_usd: "=self_pay_price_usd", prepayment_required: "=prepayment_required", telehealth_copay_class: "=telehealth_copay_class"}
        On-Demand Virtual Urgent Care: {self_pay_price_usd: "=self_pay_price_usd", prepayment_required: "=prepayment_required", telehealth_copay_class: "=telehealth_copay_class"}

  - id: telehealth_cancellation_and_no_show
    subject: [telehealth_cancelled, telehealth_no_show, telehealth_fee_assessed, telehealth_fee_waived]
    rule: >-
      A patient cancellation of a scheduled virtual visit is timely when made at least cancel_notice_hours of
      full elapsed hours before the start and late otherwise; a clinic cancellation is clinic_initiated and
      an on-demand request released after queue_max_wait_minutes is queue_timeout, neither with a fee. A
      late cancellation is charged late_cancel_fee_usd and a no-show no_show_fee_usd, where those are above
      0.00. A virtual no-show fee is charged only when the encounter's status is no_show. Where
      first_no_show_waived is true and telehealth_msr_no_shows_12m is 0 the no-show fee is waived at
      assessment with reason first_offense. A patient whose billing account is on the Medicaid Managed Care
      Account tier on the encounter date is never charged a virtual fee (reason medicaid_prohibition), which
      takes precedence over the first-offense waiver. A charged fee is removed on documented clinic error or
      a technical failure on the group's side.
      A scheduled visit becomes a no-show when the patient has not joined join_grace_minutes after the
      start.
    eligibility:
      - id: missed_before_fee
        applies_to: [telehealth_fee_assessed]
        kind: state
        condition: "A virtual no-show fee is charged only when the encounter's status is no_show."
        evidence_fields: [telehealth_visits.status, telehealth_visits.telehealth_visit_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[telehealth_visits.telehealth_visit_id]]
          action_bindings: {telehealth_visits.telehealth_visit_id: telehealth_visit_id}
        state_contract:
          field: telehealth_visits.status
          allowed: [no_show]
    params:
      per_tier:
        Portal E-Visit: {cancel_notice_hours: "=cancel_notice_hours", late_cancel_fee_usd: "=late_cancel_fee_usd", no_show_fee_usd: "=no_show_fee_usd", first_no_show_waived: "=first_no_show_waived"}
        Audio-Only Phone Visit: {cancel_notice_hours: "=cancel_notice_hours", late_cancel_fee_usd: "=late_cancel_fee_usd", no_show_fee_usd: "=no_show_fee_usd", first_no_show_waived: "=first_no_show_waived"}
        Primary Care Video Visit: {cancel_notice_hours: "=cancel_notice_hours", late_cancel_fee_usd: "=late_cancel_fee_usd", no_show_fee_usd: "=no_show_fee_usd", first_no_show_waived: "=first_no_show_waived"}
        Behavioral Health Video Visit: {cancel_notice_hours: "=cancel_notice_hours", late_cancel_fee_usd: "=late_cancel_fee_usd", no_show_fee_usd: "=no_show_fee_usd", first_no_show_waived: "=first_no_show_waived"}
        Specialty Video Follow-Up: {cancel_notice_hours: "=cancel_notice_hours", late_cancel_fee_usd: "=late_cancel_fee_usd", no_show_fee_usd: "=no_show_fee_usd", first_no_show_waived: "=first_no_show_waived"}
        On-Demand Virtual Urgent Care: {cancel_notice_hours: "=cancel_notice_hours", late_cancel_fee_usd: "=late_cancel_fee_usd", no_show_fee_usd: "=no_show_fee_usd", first_no_show_waived: "=first_no_show_waived"}
    measures: [telehealth_msr_no_shows_12m]

  - id: telehealth_technical_failure
    subject: [telehealth_completed]
    rule: >-
      When a session drops, the clinician tries to reconnect reconnect_attempts times and, where
      audio_fallback_allowed is true, completes the encounter by phone as the same encounter (end reason
      audio_fallback_completed, charged normally). When the encounter cannot be completed and the connected
      time is below tech_failure_threshold_minutes, it closes with end reason technical_failure_no_charge:
      no charge is billed, any prepayment is refunded, and a new encounter is offered at no charge; at or
      above the threshold it is charged as completed. A failure on the patient's side is treated the same
      way as one on the group's side.
    eligibility: []
    params:
      per_tier:
        Portal E-Visit: {tech_failure_threshold_minutes: "=tech_failure_threshold_minutes", reconnect_attempts: "=reconnect_attempts", audio_fallback_allowed: "=audio_fallback_allowed"}
        Audio-Only Phone Visit: {tech_failure_threshold_minutes: "=tech_failure_threshold_minutes", reconnect_attempts: "=reconnect_attempts", audio_fallback_allowed: "=audio_fallback_allowed"}
        Primary Care Video Visit: {tech_failure_threshold_minutes: "=tech_failure_threshold_minutes", reconnect_attempts: "=reconnect_attempts", audio_fallback_allowed: "=audio_fallback_allowed"}
        Behavioral Health Video Visit: {tech_failure_threshold_minutes: "=tech_failure_threshold_minutes", reconnect_attempts: "=reconnect_attempts", audio_fallback_allowed: "=audio_fallback_allowed"}
        Specialty Video Follow-Up: {tech_failure_threshold_minutes: "=tech_failure_threshold_minutes", reconnect_attempts: "=reconnect_attempts", audio_fallback_allowed: "=audio_fallback_allowed"}
        On-Demand Virtual Urgent Care: {tech_failure_threshold_minutes: "=tech_failure_threshold_minutes", reconnect_attempts: "=reconnect_attempts", audio_fallback_allowed: "=audio_fallback_allowed"}

  - id: telehealth_conversion_credit
    subject: [telehealth_converted, telehealth_prepayment_released]
    rule: >-
      When the clinician converts a virtual encounter to an in-person visit, the patient is not charged the
      self-pay price or virtual copay beyond the tier's conversion_credit_pct share credited toward the
      in-person visit. The in-person visit takes place no later than the tier's conversion window counted
      from the conversion date. The window is counted in calendar days starting the day after the conversion
      date, and a visit on the last day still qualifies. Past the window the credit is refunded instead of
      applied. Where conversion_credit_pct is 0 (behavioral health), the virtual encounter is charged as
      completed and nothing is credited.
    eligibility:
      - id: conversion_window
        applies_to: [telehealth_prepayment_released]
        kind: time
        condition: "The in-person visit takes place no later than the tier's conversion window counted from the conversion date."
        evidence_fields: [telehealth_visits.closed_date, telehealth_visits.telehealth_visit_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[telehealth_visits.telehealth_visit_id]]
          action_bindings: {telehealth_visits.telehealth_visit_id: telehealth_visit_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the conversion date"
          anchor_source: telehealth_visits.closed_date
          relation: not_after
          duration_source: variants.conversion_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the conversion date, and a visit on the last day still qualifies."
          boundary: inclusive
    params:
      per_tier:
        Portal E-Visit: {conversion_credit_pct: "=conversion_credit_pct", conversion_window_days: "=conversion_window_days"}
        Audio-Only Phone Visit: {conversion_credit_pct: "=conversion_credit_pct", conversion_window_days: "=conversion_window_days"}
        Primary Care Video Visit: {conversion_credit_pct: "=conversion_credit_pct", conversion_window_days: "=conversion_window_days"}
        Behavioral Health Video Visit: {conversion_credit_pct: "=conversion_credit_pct", conversion_window_days: "=conversion_window_days"}
        Specialty Video Follow-Up: {conversion_credit_pct: "=conversion_credit_pct", conversion_window_days: "=conversion_window_days"}
        On-Demand Virtual Urgent Care: {conversion_credit_pct: "=conversion_credit_pct", conversion_window_days: "=conversion_window_days"}

  - id: telehealth_evisit_and_queue
    subject: [telehealth_requested, telehealth_started, telehealth_cancelled]
    rule: >-
      A Portal E-Visit is answered by a clinician within response_business_hours business hours of
      submission; an unsubmitted questionnaire expires after evisit_questionnaire_expiry_hours. The
      clinician may escalate an e-visit or phone visit to video without a new charge where
      escalation_to_video_allowed is true. On-Demand Virtual Urgent Care is available per operating_hours;
      a request not picked up within queue_max_wait_minutes is released as queue_timeout with a full refund.
      Follow-up portal messages about the encounter are included for followup_message_days days. The
      after-visit summary is posted within after_visit_summary_hours.
      Scheduled sessions last up to max_session_minutes; same-day access is offered only where
      same_day_available is true; the encounter is staffed by the tier's clinician_type; and an
      interpreter can join where interpreter_available is true.
    eligibility: []
    params:
      per_tier:
        Portal E-Visit: {response_business_hours: "=response_business_hours", queue_max_wait_minutes: "=queue_max_wait_minutes", evisit_questionnaire_expiry_hours: "=evisit_questionnaire_expiry_hours"}
        Audio-Only Phone Visit: {response_business_hours: "=response_business_hours", queue_max_wait_minutes: "=queue_max_wait_minutes", evisit_questionnaire_expiry_hours: "=evisit_questionnaire_expiry_hours"}
        Primary Care Video Visit: {response_business_hours: "=response_business_hours", queue_max_wait_minutes: "=queue_max_wait_minutes", evisit_questionnaire_expiry_hours: "=evisit_questionnaire_expiry_hours"}
        Behavioral Health Video Visit: {response_business_hours: "=response_business_hours", queue_max_wait_minutes: "=queue_max_wait_minutes", evisit_questionnaire_expiry_hours: "=evisit_questionnaire_expiry_hours"}
        Specialty Video Follow-Up: {response_business_hours: "=response_business_hours", queue_max_wait_minutes: "=queue_max_wait_minutes", evisit_questionnaire_expiry_hours: "=evisit_questionnaire_expiry_hours"}
        On-Demand Virtual Urgent Care: {response_business_hours: "=response_business_hours", queue_max_wait_minutes: "=queue_max_wait_minutes", evisit_questionnaire_expiry_hours: "=evisit_questionnaire_expiry_hours"}

  - id: telehealth_scope_of_care
    subject: [telehealth_completed]
    rule: >-
      What a virtual encounter may produce depends on its type: prescriptions renewed only where
      rx_renewal_allowed is true (and never a controlled prescription unless controlled_prescribing_allowed
      is true), labs ordered where lab_order_allowed is true, referrals ordered where referral_order_allowed
      is true, and work or school notes where work_note_available is true. Combination with referrals: a
      Specialty Video Follow-Up booked against a referral uses one unit of it on completion only where that
      referral's tier counts telehealth against units; the referral rules decide. Sessions are never
      recorded (session_recording_permitted is false on every tier).
    eligibility: []
    params:
      per_tier:
        Portal E-Visit: {controlled_prescribing_allowed: "=controlled_prescribing_allowed", rx_renewal_allowed: "=rx_renewal_allowed", referral_order_allowed: "=referral_order_allowed", lab_order_allowed: "=lab_order_allowed"}
        Audio-Only Phone Visit: {controlled_prescribing_allowed: "=controlled_prescribing_allowed", rx_renewal_allowed: "=rx_renewal_allowed", referral_order_allowed: "=referral_order_allowed", lab_order_allowed: "=lab_order_allowed"}
        Primary Care Video Visit: {controlled_prescribing_allowed: "=controlled_prescribing_allowed", rx_renewal_allowed: "=rx_renewal_allowed", referral_order_allowed: "=referral_order_allowed", lab_order_allowed: "=lab_order_allowed"}
        Behavioral Health Video Visit: {controlled_prescribing_allowed: "=controlled_prescribing_allowed", rx_renewal_allowed: "=rx_renewal_allowed", referral_order_allowed: "=referral_order_allowed", lab_order_allowed: "=lab_order_allowed"}
        Specialty Video Follow-Up: {controlled_prescribing_allowed: "=controlled_prescribing_allowed", rx_renewal_allowed: "=rx_renewal_allowed", referral_order_allowed: "=referral_order_allowed", lab_order_allowed: "=lab_order_allowed"}
        On-Demand Virtual Urgent Care: {controlled_prescribing_allowed: "=controlled_prescribing_allowed", rx_renewal_allowed: "=rx_renewal_allowed", referral_order_allowed: "=referral_order_allowed", lab_order_allowed: "=lab_order_allowed"}

  - id: telehealth_reschedule
    subject: [telehealth_rescheduled, telehealth_scheduled]
    rule: >-
      A scheduled virtual visit is booked at least min_booking_lead_minutes ahead and no more than
      booking_horizon_days ahead, and may be moved by the patient up to max_reschedules times while the
      notice for a timely cancellation still holds. A virtual visit is rescheduled only while its status is
      scheduled. Reminders go out reminder_hours before the start and the connection test link
      pre_visit_tech_check_hours before, where those are above 0. E-visits and on-demand visits are never
      scheduled.
    eligibility:
      - id: reschedule_when_scheduled
        applies_to: [telehealth_rescheduled]
        kind: state
        condition: "A virtual visit is rescheduled only while its status is scheduled."
        evidence_fields: [telehealth_visits.status, telehealth_visits.telehealth_visit_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[telehealth_visits.telehealth_visit_id]]
          action_bindings: {telehealth_visits.telehealth_visit_id: telehealth_visit_id}
        state_contract:
          field: telehealth_visits.status
          allowed: [scheduled]
    params:
      per_tier:
        Portal E-Visit: {max_reschedules: "=max_reschedules", booking_horizon_days: "=booking_horizon_days", min_booking_lead_minutes: "=min_booking_lead_minutes"}
        Audio-Only Phone Visit: {max_reschedules: "=max_reschedules", booking_horizon_days: "=booking_horizon_days", min_booking_lead_minutes: "=min_booking_lead_minutes"}
        Primary Care Video Visit: {max_reschedules: "=max_reschedules", booking_horizon_days: "=booking_horizon_days", min_booking_lead_minutes: "=min_booking_lead_minutes"}
        Behavioral Health Video Visit: {max_reschedules: "=max_reschedules", booking_horizon_days: "=booking_horizon_days", min_booking_lead_minutes: "=min_booking_lead_minutes"}
        Specialty Video Follow-Up: {max_reschedules: "=max_reschedules", booking_horizon_days: "=booking_horizon_days", min_booking_lead_minutes: "=min_booking_lead_minutes"}
        On-Demand Virtual Urgent Care: {max_reschedules: "=max_reschedules", booking_horizon_days: "=booking_horizon_days", min_booking_lead_minutes: "=min_booking_lead_minutes"}
