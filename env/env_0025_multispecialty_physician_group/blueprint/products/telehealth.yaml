# Policy charter: Virtual Care (one telehealth encounter per holding).
# Path: env/env_0025_multispecialty_physician_group/blueprint/products/telehealth.yaml

category: telehealth
display_name: Virtual Care

binding:
  holding_table: telehealth_visits
  event_tables: [telehealth_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {prepaid_balance_usd: visit_prepayment}

lifecycle:
  states: [requested, scheduled, in_progress, completed, converted_to_in_person, cancelled, no_show]
  transitions:
    - {from: requested, to: scheduled, by: agent, means: "A scheduled video or phone visit is given a date, time and clinician."}
    - {from: requested, to: in_progress, by: system, means: "An e-visit questionnaire or an on-demand queue entry is picked up by a clinician."}
    - {from: scheduled, to: in_progress, by: system, means: "The clinician opens the scheduled session and the patient joins."}
    - {from: in_progress, to: completed, by: system, means: "The clinician closes the encounter."}
    - {from: in_progress, to: converted_to_in_person, by: agent, means: "The clinician determines the problem needs an in-person examination and ends the virtual encounter."}
    - {from: requested, to: cancelled, by: agent, means: "The request is cancelled by the patient or abandoned in the queue before a clinician picks it up."}
    - {from: scheduled, to: cancelled, by: agent, means: "A scheduled virtual visit is cancelled by the patient or the clinic before it starts."}
    - {from: scheduled, to: no_show, by: system, means: "The patient does not join within the join grace period."}

accounts:
  - key: visit_prepayment
    unit: USD
    meaning: "Amount prepaid by a self-pay patient (or for on-demand urgent care, any patient's expected cost share) for one virtual encounter, held until it is applied, credited or refunded."

parameter_schema:
  self_pay_price_usd: "Price of the encounter for a Self-Pay Account patient; USD."
  prepayment_required: "Whether payment is collected when the encounter is requested; boolean."
  insurance_billable: "Whether the encounter is billed to insurance for insured patients; boolean."
  telehealth_copay_class: "Which insurance copay applies to an insured patient: none, primary or specialist; enum string."
  response_business_hours: "Business hours (8:00-17:00 Monday-Friday) within which an e-visit gets a clinician reply; 0 means not applicable; integer."
  max_session_minutes: "Longest session scheduled for the encounter type; integer, minutes."
  booking_horizon_days: "Furthest day ahead a scheduled virtual visit may be booked; 0 means not schedulable; integer, days."
  min_booking_lead_minutes: "Minimum minutes between booking and start; integer, minutes."
  operating_hours: "When the service is available: business_hours, extended_hours (7:00-22:00 daily) or always; enum string."
  queue_max_wait_minutes: "Longest wait in the on-demand queue before the request is released with a full refund; 0 means no queue; integer, minutes."
  cancel_notice_hours: "Hours before a scheduled start by which a patient cancellation is timely; integer, hours."
  late_cancel_fee_usd: "Fee for a late patient cancellation of a scheduled virtual visit; USD."
  no_show_fee_usd: "Fee for a scheduled virtual visit the patient does not join; USD."
  first_no_show_waived: "Whether the first virtual no-show in 12 months is waived; boolean."
  join_grace_minutes: "Minutes after the scheduled start within which the patient may still join; integer, minutes."
  tech_failure_threshold_minutes: "Connected minutes below which a session ended by a technical failure is not charged; integer, minutes."
  reconnect_attempts: "Reconnection attempts the clinician makes after a dropped session before switching to phone; integer, count."
  audio_fallback_allowed: "Whether a dropped video session may be completed by phone as the same encounter; boolean."
  conversion_credit_pct: "Share of the virtual encounter's patient charge credited toward the in-person visit it is converted to; percent."
  conversion_window_days: "Calendar days after conversion within which the in-person visit must occur to receive the credit; integer, days."
  licensed_states: "States in which the patient must be physically located during the encounter: OH, OH-KY-IN-PA-WV-MI; enum string."
  location_attestation_required: "Whether the patient attests their physical location at the start of every encounter; boolean."
  new_patient_allowed: "Whether patients with no completed visit in the group within established_lookback_months may use the encounter type; boolean."
  established_lookback_months: "Months within which a completed visit in the group makes the patient established for this encounter type; integer, months."
  minimum_age_years: "Youngest patient age served; integer, years."
  guardian_present_under_age: "Age under which a parent or guardian must join; integer, years."
  controlled_prescribing_allowed: "Whether controlled substances may be prescribed from the encounter; boolean."
  in_person_interval_months: "Calendar months within which the patient must also have an in-person visit with the department for continued virtual care; 0 means no requirement; integer, months."
  followup_message_days: "Calendar days after the encounter during which follow-up portal messages are included at no charge; integer, days."
  max_per_7_days: "Maximum encounters of the type per patient in a rolling 7 days; integer, count."
  evisit_questionnaire_expiry_hours: "Hours an unsubmitted e-visit questionnaire is kept before it expires; 0 means not applicable; integer, hours."
  escalation_to_video_allowed: "Whether the clinician may escalate the encounter to a video visit without a new charge; boolean."
  interpreter_available: "Whether a video or phone interpreter can be added; boolean."
  pre_visit_tech_check_hours: "Hours before a scheduled start at which the connection test link is sent; 0 means none; integer, hours."
  reminder_hours: "Hours before a scheduled start at which the reminder is sent; 0 means none; integer, hours."
  work_note_available: "Whether a work or school note may be issued from the encounter; boolean."
  lab_order_allowed: "Whether labs may be ordered from the encounter; boolean."
  rx_renewal_allowed: "Whether prescriptions may be renewed from the encounter; boolean."
  referral_order_allowed: "Whether a referral may be ordered from the encounter; boolean."
  prepayment_refund_business_days: "Business days to refund a prepayment that becomes refundable; integer."
  max_reschedules: "Maximum patient reschedules of one scheduled virtual visit; integer, count."
  crisis_protocol_required: "Whether a safety plan and emergency contact must be confirmed at the start; boolean."
  emergency_contact_required: "Whether an emergency contact must be on file before the encounter; boolean."
  session_recording_permitted: "Whether the session may be recorded (always false for clinical privacy); boolean."
  after_visit_summary_hours: "Hours after completion within which the after-visit summary is posted; integer, hours."
  device_requirement: "Device needed: portal_only, phone_only or video_capable; enum string."
  clinician_type: "Who staffs it: physician_or_app, licensed_therapist_or_psychiatrist, specialist_physician; enum string."
  same_day_available: "Whether same-day access is offered; boolean."
  price_transparency_display: "Whether the self-pay price is shown before the request is submitted; boolean."

