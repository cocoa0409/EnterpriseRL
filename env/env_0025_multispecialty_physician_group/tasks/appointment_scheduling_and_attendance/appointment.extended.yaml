    - *id002
    compute:
    - rs_deposit_collected_total: SUM('appointment_events', 'amount', event_type='appointment_deposit_collected')
    - rs_deposit_released_total: SUM('appointment_events', 'amount', event_type='appointment_deposit_released')
    - rs_deposit_held: rs_deposit_collected_total - rs_deposit_released_total
    - no_show_fee_recorded_as_waived: SUM('appointment_events', 'amount', event_type='appointment_fee_waived', fee_type='no_show_fee')
    - rn_is_no_show: 1 if F('status') == 'no_show' else 0
    - rn_ns_count: XCOUNT('billing', 'billing_transactions', within_months=K('lookback_months'), date_field='service_date',
        event_type='billing_charge_posted', line_category='no_show_fee')
    - rn_lc_count: XCOUNT('billing', 'billing_transactions', within_months=K('lookback_months'), date_field='service_date',
        event_type='billing_charge_posted', line_category='late_cancel_fee')
    - rn_escalation_rate: K('repeat_rate') if rn_ns_count + rn_lc_count >= K('repeat_count') and rn_ns_count >= K('single_count')
        else (K('single_rate') if rn_lc_count >= K('single_count') or rn_ns_count >= K('single_count') else K('standard_rate'))
    - rn_booking_days: DAYS(F('booked_date'), F('scheduled_date'))
    - rn_held_days: DAYS(F('last_rescheduled_date'), F('scheduled_date')) if F('reschedule_count') >= K('single_count') else
        (DAYS(F('confirmed_date'), F('scheduled_date')) if F('confirmed_date') else rn_booking_days)
    - rn_held_addition: K('long_hold_add') if rn_held_days >= K('long_hold_days') else (K('mid_hold_add') if rn_held_days >=
        K('mid_hold_days') else 0)
    - rn_confirm_lead_days: DAYS(F('confirmed_date'), F('scheduled_date')) if F('confirmed_date') else K('never_confirmed')
    - rn_confirmed_addition: K('late_confirm_add') if rn_confirm_lead_days >= 0 and rn_confirm_lead_days <= K('late_confirm_days')
        else (K('early_confirm_add') if rn_confirm_lead_days > K('late_confirm_days') else 0)
    - rn_account_age_days: DAYS(CFIELD('billing', 'opened_date'), NOW)
    - rn_courtesy_credit: K('long_tenure_credit') if rn_account_age_days >= K('long_tenure_days') else (K('mid_tenure_credit')
        if rn_account_age_days >= K('mid_tenure_days') else 0)
    - rn_hardship_pct: CFIELD('billing', 'hardship_approved_pct')
    - rn_hardship_through: CFIELD('billing', 'hardship_approved_through')
    - rn_hardship_rate: rn_hardship_pct if rn_hardship_pct > 0 and rn_hardship_through >= F('scheduled_date') else (rn_hardship_pct
        / 2 if rn_hardship_pct > 0 and rn_hardship_through and DAYS(rn_hardship_through, F('scheduled_date')) <= K('hardship_grace_days')
        else 0)
    - rn_fee: RND((P('no_show_fee_usd') * rn_escalation_rate + rn_held_addition + rn_confirmed_addition - rn_courtesy_credit)
        * (100 - rn_hardship_rate) / 100 * rn_is_no_show, 2)
    - result: RND(rs_deposit_held - rn_fee + no_show_fee_recorded_as_waived, 2)
