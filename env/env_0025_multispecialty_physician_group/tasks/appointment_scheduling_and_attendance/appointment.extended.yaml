events:
  - type: appointment_booked
    target: appointments
    mutation: create
    meaning: "A clinic visit of one visit type is booked for a patient with a clinician, department, location, date and time."
    grain: "One row per booked visit."
    fields:
      customer_id: "The patient."
      variant_name: "Visit type (official tier name)."
      status: "Always booked on creation."
      booked_date: "Date the booking is made (handling date)."
      scheduled_date: "Date of the visit."
      scheduled_time: "Start time of the visit, clinic local time."
      department: "Department the visit is with."
      clinician_name: "Clinician the visit is with, exactly as listed in the provider directory."
      clinic_location: "Clinic the visit is at, exactly as listed in the location directory."
      booking_channel: "Where the booking was made."
      encounter_number: "Encounter number assigned to the visit at booking."
      referral_id: "Referral or authorization the visit is booked against; empty when none is required."
      reschedule_count: "0 on creation."
      deposit_held_usd: "0.00 on creation; raised only by a deposit collection."
      cancel_timing: "not_cancelled on creation."
    triggers: []
  - type: appointment_confirmed
    target: appointments
    mutation: {transition: {from: booked, to: confirmed}}
    meaning: "The patient confirms attendance."
    grain: "One row per transaction."
    fields:
      status: "Set to confirmed."
      confirmed_date: "Date of the confirmation."
    triggers: []
  - type: appointment_rescheduled
    target: appointments
    mutation: update
    meaning: "An open appointment is moved to another date or time (and, where allowed, another clinician of the same department), keeping its encounter and status."
    grain: "One row per transaction."
    fields:
      scheduled_date: "New visit date."
      scheduled_time: "New start time."
      clinician_name: "Clinician after the move."
      reschedule_count: "Previous count plus one for a patient-requested move; unchanged for a clinic-initiated or waitlist move."
      last_rescheduled_date: "Date of this reschedule (handling date)."
    triggers: []
  - type: appointment_checked_in
    target: appointments
    mutation: {transition: [{from: booked, to: checked_in}, {from: confirmed, to: checked_in}]}
    meaning: "The patient arrives and is checked in."
    grain: "One row per transaction."
    fields:
      status: "Set to checked_in."
      checked_in_at: "Clock time of check-in."
      arrival_minutes_late: "Whole minutes after the scheduled start at check-in; 0 when on time or early."
    triggers: []
  - type: appointment_completed
    target: appointments
    mutation: {transition: {from: checked_in, to: completed}}
    meaning: "The clinician closes the encounter."
    grain: "One row per transaction."
    fields:
      status: "Set to completed."
      closed_date: "Date the visit was completed."
      encounter_number: "Encounter of the visit (unchanged, carried to downstream postings)."
      referral_id: "Referral or authorization the visit was booked against; empty when none."
      deposit_held_usd: "Deposit held on the visit at completion (released by the applied-to-visit posting)."
    triggers:
      - event: referral:referral_unit_used
        when: {referral_id: {not: ""}}
        map: {referral_id: referral_id, encounter_number: encounter_number, unit_date: closed_date, units: 1, source_category: appointment}
      - event: appointment:appointment_deposit_released
        when: {deposit_held_usd: {not: 0.00}}
        map: {amount: deposit_held_usd, encounter_number: encounter_number, event_date: closed_date, disposition: applied_to_visit}
  - type: appointment_cancelled
    target: appointments
    mutation: {transition: [{from: booked, to: cancelled}, {from: confirmed, to: cancelled}]}
    meaning: "An open appointment is cancelled before check-in, by the patient's request, the clinic, or a late arrival beyond the check-in limit."
    grain: "One row per transaction."
    fields:
      status: "Set to cancelled."
      cancelled_at: "Moment of cancellation (handling timestamp)."
      cancel_reason: "Why the appointment was cancelled."
      cancel_timing: "timely, late or clinic_initiated, determined by the cancellation rules."
      closed_date: "Date of cancellation."
      encounter_number: "Encounter of the visit."
      deposit_held_usd: "Deposit held on the visit at cancellation; refunded at once on a timely or clinic-initiated cancellation, otherwise released under the deposit rules once any fee is decided."
    triggers:
      - event: appointment:appointment_deposit_released
        when: {cancel_timing: [timely, clinic_initiated], deposit_held_usd: {not: 0.00}}
        map: {amount: deposit_held_usd, encounter_number: encounter_number, event_date: closed_date, disposition: refunded}
  - type: appointment_no_show_recorded
    target: appointments
    mutation: {transition: [{from: booked, to: no_show}, {from: confirmed, to: no_show}]}
    meaning: "The session ends without the patient having cancelled or checked in."
    grain: "One row per transaction."
    fields:
      status: "Set to no_show."
      closed_date: "Scheduled date of the missed visit."
      encounter_number: "Encounter of the visit."
      deposit_held_usd: "Deposit held on the visit when it was missed; released under the deposit rules once any fee is decided."
    triggers: []
  - type: appointment_fee_assessed
    target: appointment_events
    meaning: "A no-show fee or late-cancellation fee is assessed on a missed or late-cancelled visit."
    grain: "One row per fee type on one appointment."
    distinguish_by: [fee_type]
    fields:
      event_date: "Date the fee is assessed."
      service_date: "Scheduled date of the missed or late-cancelled visit."
      encounter_number: "Encounter of that visit."
      fee_type: "no_show_fee or late_cancel_fee."
      amount: "Fee amount from the visit type's parameters."
    triggers:
      - event: billing:billing_charge_posted
        when: {fee_type: no_show_fee}
        map: {txn_date: event_date, service_date: service_date, encounter_number: encounter_number, amount: amount, line_category: no_show_fee, source_category: appointment, channel: system}
      - event: billing:billing_charge_posted
        when: {fee_type: late_cancel_fee}
        map: {txn_date: event_date, service_date: service_date, encounter_number: encounter_number, amount: amount, line_category: late_cancel_fee, source_category: appointment, channel: system}
  - type: appointment_fee_waived
    target: appointment_events
    meaning: "A no-show or late-cancellation fee is waived, either at the time it would be assessed (first offense, fee prohibition) or after assessment on documentation or clinic error."
    grain: "One row per waived fee of one appointment."
    distinguish_by: [fee_type, waiver_reason]
    fields:
      event_date: "Date of the waiver."
      service_date: "Scheduled date of the visit."
      encounter_number: "Encounter of the visit."
      fee_type: "Which fee is waived."
      waiver_reason: "Why it is waived."
      amount: "Amount waived."
      applies_to_event_id: "The assessed fee row being waived; empty when the fee is waived at assessment and never charged."
    triggers:
      - event: billing:billing_adjustment_posted
        when: {applies_to_event_id: {not: ""}, waiver_reason: medicaid_prohibition}
        map: {txn_date: event_date, amount: amount, adjustment_code: medicaid_fee_prohibition}
      - event: billing:billing_adjustment_posted
        when: {applies_to_event_id: {not: ""}, waiver_reason: {not: medicaid_prohibition}}
        map: {txn_date: event_date, amount: amount, adjustment_code: appointment_fee_waiver}
  - type: appointment_deposit_collected
    target: appointment_events
    meaning: "A booking deposit is collected from a self-pay patient for the visit."
    grain: "One row per deposit collection on one appointment."
    distinguish_by: [event_date, payment_method]
    fields:
      event_date: "Collection date."
      encounter_number: "Encounter of the visit."
      amount: "Deposit collected."
      payment_method: "How it was paid."
    account: booking_deposit
    direction: in
    triggers: []
  - type: appointment_deposit_released
    target: appointment_events
    meaning: "The held deposit leaves the appointment: applied to the visit's charges, refunded to the patient, or forfeited toward the fee."
    grain: "One row per disposition of the deposit of one appointment (a forfeiture larger than the fee is split into a forfeited row and a refunded row)."
    distinguish_by: [disposition]
    fields:
      event_date: "Date of the release."
      encounter_number: "Encounter of the visit."
      amount: "Amount released under this disposition."
      disposition: "applied_to_visit, refunded or forfeited_to_fee."
    account: booking_deposit
    direction: out
    triggers:
      - event: billing:billing_copay_collected
        when: {disposition: applied_to_visit}
        map: {txn_date: event_date, encounter_number: encounter_number, amount: amount, payment_method: booking_deposit, channel: system}
      - event: billing:billing_payment_posted
        when: {disposition: forfeited_to_fee}
        map: {txn_date: event_date, encounter_number: encounter_number, amount: amount, payment_method: booking_deposit, channel: system}

measures:
  - id: appointment_msr_missed_visits
    window: "Rolling window of no_show_lookback_months calendar months ending on the handling date (same day-of-month, falling back to the month's last day)."
    measure: "Count of the patient's appointments, across all visit types, with status no_show whose scheduled_date falls inside the window, plus those with cancel_timing late whose visit type's late_cancel_counts_toward_no_show is true and whose scheduled_date falls inside the window."
  - id: appointment_msr_open_same_type
    window: "Point-in-time on the handling date."
    measure: "Count of the patient's appointments of the same visit type whose status is booked or confirmed."
  - id: appointment_msr_prior_no_shows_same_type
    window: "Rolling window of no_show_lookback_months calendar months ending on the scheduled date of the missed visit, excluding that visit."
    measure: "Count of the patient's other appointments of the same visit type with status no_show and scheduled_date inside the window."

policies:
  - id: appointment_agg_multi_holding
    subject: [appointment_booked]
    rule: >-
      A patient may hold any number of appointments over time and across visit types; there is no
      lifetime cap. What is capped is the number held open at once for one visit type, governed by
      appointment_agg_open_booking_cap. Appointments of family members are separate holdings under each
      patient's own profile and never count toward one another's caps.
    eligibility: []
    params: {max_per_customer: null}

  - id: appointment_agg_open_booking_cap
    subject: [appointment_booked]
    rule: >-
      Across all of a patient's appointments, appointment_msr_open_same_type must stay below the visit
      type's max_open_per_patient for a new booking of that type to be made; a recurring Nurse Visit series,
      where recurring_series_allowed is true, may hold up to recurring_series_max_occurrences open
      appointments instead and counts as one series. The patient has no other open appointment of the same
      visit type in the same department on the same scheduled date. An Annual Preventive Exam is booked only
      on a date at least min_interval_months after the patient's last completed Annual Preventive Exam
      (counted in calendar months from that visit's scheduled date, falling back to the month's last day).
      The cap never blocks a clinic-initiated rebooking of a cancelled visit.
    eligibility:
      - id: no_duplicate_same_day
        applies_to: [appointment_booked]
        kind: dedup
        condition: "The patient has no other open appointment of the same visit type in the same department on the same scheduled date."
        evidence_fields: [appointments.customer_id, appointments.variant_name, appointments.department, appointments.scheduled_date, appointments.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[appointments.customer_id, appointments.variant_name, appointments.department, appointments.scheduled_date]]
          action_bindings: {appointments.customer_id: customer_id, appointments.variant_name: variant_name, appointments.department: department, appointments.scheduled_date: scheduled_date}
        dedup_contract:
          table: appointments
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name, department: department, scheduled_date: scheduled_date}
          duplicate_filters: {status: [booked, confirmed, checked_in]}
          distinct_fields: [scheduled_time]
    params:
      per_tier:
        Nurse Visit: {max_open_per_patient: "=max_open_per_patient", min_interval_months: "=min_interval_months"}
        Established Patient Office Visit: {max_open_per_patient: "=max_open_per_patient", min_interval_months: "=min_interval_months"}
        New Patient Office Visit: {max_open_per_patient: "=max_open_per_patient", min_interval_months: "=min_interval_months"}
        Annual Preventive Exam: {max_open_per_patient: "=max_open_per_patient", min_interval_months: "=min_interval_months"}
        Specialist Consultation: {max_open_per_patient: "=max_open_per_patient", min_interval_months: "=min_interval_months"}
        In-Office Procedure Visit: {max_open_per_patient: "=max_open_per_patient", min_interval_months: "=min_interval_months"}
        Advanced Imaging Appointment: {max_open_per_patient: "=max_open_per_patient", min_interval_months: "=min_interval_months"}
    formula:
      booking_allowed: appointment_msr_open_same_type < max_open_per_patient
    measures: [appointment_msr_open_same_type]

  - id: appointment_booking_eligibility
    subject: [appointment_booked]
    rule: >-
      A visit is booked on a slot whose start is at least min_booking_lead_hours after the moment of booking
      and no later than booking_horizon_days after the booking date; a same-day slot only where
      same_day_booking_allowed is true. The visit type follows the patient's history: a patient with no
      completed visit in the department within new_patient_lookback_months books a New Patient Office Visit,
      otherwise an Established Patient Office Visit. Combination with the financial account: when the
      patient's billing account is on the Commercial HMO/EPO Account tier and the visit type's
      referral_required_on_hmo is true, the visit must be booked against a referral. The linked referral is
      approved, is for the department of the visit, has units remaining, and its valid-through date is on or
      after the scheduled date. Where prior_auth_required is true and the patient is insured, the linked
      authorization must meet the same condition and be approved at least auth_confirmed_lead_business_days
      business days (Monday to Friday, group holidays excluded) before the scheduled date; if it is not, the
      clinic moves the visit (a clinic-initiated reschedule) rather than letting it proceed unauthorized.
      Self-pay patients need no referral or authorization. A patient under the same-day-only restriction of
      appointment_no_show_escalation may book only a slot on the handling date itself. A patient who has been
      dismissed from the practice is not booked; a request to reverse a dismissal is not something the
      booking rules decide. Online self-booking is available only for visit types whose
      online_self_scheduling_allowed is true; the others are booked by phone or at the front desk.
      Each visit occupies one slot of the visit type's slot_minutes.
    eligibility:
      - id: referral_covers_visit
        applies_to: [appointment_booked]
        kind: authorization
        condition: "The linked referral is approved, is for the department of the visit, has units remaining, and its valid-through date is on or after the scheduled date."
        evidence_fields: [referrals.referral_id, referrals.status, referrals.specialty, referrals.units_remaining, referrals.valid_through, billing_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[referrals.referral_id]]
          action_bindings: {referrals.referral_id: referral_id}
    params:
      per_tier:
        Nurse Visit: {referral_required_on_hmo: "=referral_required_on_hmo", prior_auth_required: "=prior_auth_required", min_booking_lead_hours: "=min_booking_lead_hours", booking_horizon_days: "=booking_horizon_days"}
        Established Patient Office Visit: {referral_required_on_hmo: "=referral_required_on_hmo", prior_auth_required: "=prior_auth_required", min_booking_lead_hours: "=min_booking_lead_hours", booking_horizon_days: "=booking_horizon_days"}
        New Patient Office Visit: {referral_required_on_hmo: "=referral_required_on_hmo", prior_auth_required: "=prior_auth_required", min_booking_lead_hours: "=min_booking_lead_hours", booking_horizon_days: "=booking_horizon_days"}
        Annual Preventive Exam: {referral_required_on_hmo: "=referral_required_on_hmo", prior_auth_required: "=prior_auth_required", min_booking_lead_hours: "=min_booking_lead_hours", booking_horizon_days: "=booking_horizon_days"}
        Specialist Consultation: {referral_required_on_hmo: "=referral_required_on_hmo", prior_auth_required: "=prior_auth_required", min_booking_lead_hours: "=min_booking_lead_hours", booking_horizon_days: "=booking_horizon_days"}
        In-Office Procedure Visit: {referral_required_on_hmo: "=referral_required_on_hmo", prior_auth_required: "=prior_auth_required", min_booking_lead_hours: "=min_booking_lead_hours", booking_horizon_days: "=booking_horizon_days"}
        Advanced Imaging Appointment: {referral_required_on_hmo: "=referral_required_on_hmo", prior_auth_required: "=prior_auth_required", min_booking_lead_hours: "=min_booking_lead_hours", booking_horizon_days: "=booking_horizon_days"}

  - id: appointment_cancellation_timing
    subject: [appointment_cancelled, appointment_fee_assessed]
    rule: >-
      A patient may cancel an open appointment at any time before check-in; the cancellation is recorded
      with its timing. A patient cancellation is timely when the full elapsed hours from the moment of
      cancellation to the scheduled start (scheduled_date and scheduled_time, clinic local time) are at least
      the visit type's cancel_notice_hours, and late otherwise. A cancellation made by the clinic (clinician
      unavailable, clinic closure, weather closure, missing authorization, unconfirmed release) is recorded
      as clinic_initiated and never carries a fee; the clinic offers a replacement slot within
      clinic_cancel_rebook_priority_days business days. A patient who arrives more than
      late_arrival_rebook_minutes after the scheduled start cannot be checked in, and the visit is cancelled
      with reason late_arrival and timing late. A late cancellation is charged the visit type's
      late_cancel_fee_usd unless appointment_fee_waiver removes it. A late-cancellation fee is assessed only
      when the cancellation was recorded with timing late. A request to cancel less than cancel_notice_hours before the start in order to rebook is a late
      cancellation of this appointment followed by a new booking, never a reschedule.
    eligibility:
      - id: late_timing_recorded
        applies_to: [appointment_fee_assessed]
        kind: state
        condition: "A late-cancellation fee is assessed only when the cancellation was recorded with timing late."
        evidence_fields: [appointments.cancel_timing, appointments.appointment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[appointments.appointment_id]]
          action_bindings: {appointments.appointment_id: appointment_id}
        state_contract:
          field: appointments.cancel_timing
          allowed: [late]
    params:
      per_tier:
        Nurse Visit: {cancel_notice_hours: "=cancel_notice_hours", late_cancel_fee_usd: "=late_cancel_fee_usd"}
        Established Patient Office Visit: {cancel_notice_hours: "=cancel_notice_hours", late_cancel_fee_usd: "=late_cancel_fee_usd"}
        New Patient Office Visit: {cancel_notice_hours: "=cancel_notice_hours", late_cancel_fee_usd: "=late_cancel_fee_usd"}
        Annual Preventive Exam: {cancel_notice_hours: "=cancel_notice_hours", late_cancel_fee_usd: "=late_cancel_fee_usd"}
        Specialist Consultation: {cancel_notice_hours: "=cancel_notice_hours", late_cancel_fee_usd: "=late_cancel_fee_usd"}
        In-Office Procedure Visit: {cancel_notice_hours: "=cancel_notice_hours", late_cancel_fee_usd: "=late_cancel_fee_usd"}
        Advanced Imaging Appointment: {cancel_notice_hours: "=cancel_notice_hours", late_cancel_fee_usd: "=late_cancel_fee_usd"}
    formula:
      amount: late_cancel_fee_usd

  - id: appointment_no_show_fee
    subject: [appointment_no_show_recorded, appointment_fee_assessed]
    rule: >-
      A visit closes as a no-show when the patient neither cancelled nor was checked in by the end of the
      clinic session. A no-show fee is assessed only when the visit's status is no_show. The no-show fee is the
      visit type's no_show_fee_usd. Where first_no_show_waived is true and
      appointment_msr_prior_no_shows_same_type is 0, the fee is not charged: the waiver is recorded instead
      with reason first_offense and no fee row. Combination with the financial account: when the patient's
      billing account was on the Medicaid Managed Care Account tier on the scheduled date, no no-show or
      late-cancellation fee is ever charged; the waiver is recorded with reason medicaid_prohibition. The
      Medicaid prohibition takes precedence over the first-offense waiver, and either one excludes the fee
      entirely (the two are never stacked with a partial fee). A held booking deposit is forfeited toward
      the fee under appointment_booking_deposit.
    eligibility:
      - id: visit_missed
        applies_to: [appointment_fee_assessed]
        kind: state
        condition: "A no-show fee is assessed only when the visit's status is no_show."
        evidence_fields: [appointments.status, appointments.appointment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[appointments.appointment_id]]
          action_bindings: {appointments.appointment_id: appointment_id}
        state_contract:
          field: appointments.status
          allowed: [no_show]
    params:
      per_tier:
        Nurse Visit: {no_show_fee_usd: "=no_show_fee_usd", first_no_show_waived: "=first_no_show_waived"}
        Established Patient Office Visit: {no_show_fee_usd: "=no_show_fee_usd", first_no_show_waived: "=first_no_show_waived"}
        New Patient Office Visit: {no_show_fee_usd: "=no_show_fee_usd", first_no_show_waived: "=first_no_show_waived"}
        Annual Preventive Exam: {no_show_fee_usd: "=no_show_fee_usd", first_no_show_waived: "=first_no_show_waived"}
        Specialist Consultation: {no_show_fee_usd: "=no_show_fee_usd", first_no_show_waived: "=first_no_show_waived"}
        In-Office Procedure Visit: {no_show_fee_usd: "=no_show_fee_usd", first_no_show_waived: "=first_no_show_waived"}
        Advanced Imaging Appointment: {no_show_fee_usd: "=no_show_fee_usd", first_no_show_waived: "=first_no_show_waived"}
    formula:
      when_not: first_no_show_waived and appointment_msr_prior_no_shows_same_type == 0
      amount: no_show_fee_usd
    measures: [appointment_msr_prior_no_shows_same_type]

  - id: appointment_fee_waiver
    subject: [appointment_fee_waived]
    rule: >-
      An assessed no-show or late-cancellation fee is waived in full, and the waiver removes the matching
      charge from the financial account, when one of these holds: the patient documents a medical emergency
      or hospital admission of the patient (or, for a minor, of the patient or the guardian bringing them) on
      the scheduled date; the clinic was closed or the clinician unavailable; the clinic recorded the
      appointment in error; or the fee was charged although the Medicaid prohibition applied. The patient
      supplies the emergency documentation no later than the visit type's documentation window counted from
      the scheduled date of the missed visit. The window is counted in calendar days starting the day after
      the scheduled date, and documentation received on the last day still qualifies. A fee is waived at most
      once. Transportation trouble, forgetting, work conflicts or weather without a clinic closure are not
      grounds for a waiver, and a customer's statement that a document was sent does not replace the
      document being received. A partial waiver is never granted.
    eligibility:
      - id: documentation_window
        applies_to: [appointment_fee_waived]
        kind: time
        condition: "The patient supplies the emergency documentation no later than the visit type's documentation window counted from the scheduled date of the missed visit."
        evidence_fields: [appointments.scheduled_date, appointments.appointment_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys: [[appointments.appointment_id]]
          action_bindings: {appointments.appointment_id: appointment_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the scheduled date of the missed visit"
          anchor_source: appointments.scheduled_date
          relation: not_after
          duration_source: variants.waiver_documentation_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the scheduled date, and documentation received on the last day still qualifies."
          boundary: inclusive
      - id: waive_once
        applies_to: [appointment_fee_waived]
        kind: dedup
        condition: "A fee is waived at most once."
        evidence_fields: [appointment_events.applies_to_event_id, appointment_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[appointment_events.applies_to_event_id]]
          action_bindings: {appointment_events.applies_to_event_id: applies_to_event_id}
        dedup_contract:
          table: appointment_events
          mode: separate_record
          object_bindings: {applies_to_event_id: applies_to_event_id}
          duplicate_filters: {event_type: [appointment_fee_waived]}
          distinct_fields: []
    params:
      per_tier:
        Nurse Visit: {waiver_documentation_days: "=waiver_documentation_days"}
        Established Patient Office Visit: {waiver_documentation_days: "=waiver_documentation_days"}
        New Patient Office Visit: {waiver_documentation_days: "=waiver_documentation_days"}
        Annual Preventive Exam: {waiver_documentation_days: "=waiver_documentation_days"}
        Specialist Consultation: {waiver_documentation_days: "=waiver_documentation_days"}
        In-Office Procedure Visit: {waiver_documentation_days: "=waiver_documentation_days"}
        Advanced Imaging Appointment: {waiver_documentation_days: "=waiver_documentation_days"}

  - id: appointment_reschedule
    subject: [appointment_rescheduled]
    rule: >-
      A patient may move an open appointment to another slot of the same visit type while the notice for a
      timely cancellation still holds (at least cancel_notice_hours of full elapsed hours before the current
      start); the move keeps the encounter number and the status. The appointment status is booked or
      confirmed when it is rescheduled. A patient-requested reschedule is allowed only while the
      appointment's reschedule_count is below the visit type's reschedule_limit; once the limit is reached
      the patient may only cancel (timing per appointment_cancellation_timing) and book anew. A reschedule
      counts one toward reschedule_count; a clinic-initiated move and the acceptance of a waitlist offer do
      not. The new slot must itself satisfy appointment_booking_eligibility (lead time, horizon, referral
      validity on the new date); a move to another clinician is allowed only where
      clinician_change_on_reschedule_allowed is true. Where telehealth_conversion_allowed is true, a patient
      may instead ask, up to telehealth_conversion_cutoff_hours before the start, to convert the visit to a
      video visit: the in-person appointment is cancelled with reason converted_to_video and timing timely,
      and the video visit is booked under the virtual-care rules.
    eligibility:
      - id: open_for_reschedule
        applies_to: [appointment_rescheduled]
        kind: state
        condition: "The appointment status is booked or confirmed when it is rescheduled."
        evidence_fields: [appointments.status, appointments.appointment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[appointments.appointment_id]]
          action_bindings: {appointments.appointment_id: appointment_id}
        state_contract:
          field: appointments.status
          allowed: [booked, confirmed]
      - id: under_reschedule_limit
        applies_to: [appointment_rescheduled]
        kind: authorization
        condition: "A patient-requested reschedule is allowed only while the appointment's reschedule_count is below the visit type's reschedule_limit"
        evidence_fields: [appointments.reschedule_count, appointments.appointment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[appointments.appointment_id]]
          action_bindings: {appointments.appointment_id: appointment_id}
    params:
      per_tier:
        Nurse Visit: {reschedule_limit: "=reschedule_limit", telehealth_conversion_cutoff_hours: "=telehealth_conversion_cutoff_hours"}
        Established Patient Office Visit: {reschedule_limit: "=reschedule_limit", telehealth_conversion_cutoff_hours: "=telehealth_conversion_cutoff_hours"}
        New Patient Office Visit: {reschedule_limit: "=reschedule_limit", telehealth_conversion_cutoff_hours: "=telehealth_conversion_cutoff_hours"}
        Annual Preventive Exam: {reschedule_limit: "=reschedule_limit", telehealth_conversion_cutoff_hours: "=telehealth_conversion_cutoff_hours"}
        Specialist Consultation: {reschedule_limit: "=reschedule_limit", telehealth_conversion_cutoff_hours: "=telehealth_conversion_cutoff_hours"}
        In-Office Procedure Visit: {reschedule_limit: "=reschedule_limit", telehealth_conversion_cutoff_hours: "=telehealth_conversion_cutoff_hours"}
        Advanced Imaging Appointment: {reschedule_limit: "=reschedule_limit", telehealth_conversion_cutoff_hours: "=telehealth_conversion_cutoff_hours"}

  - id: appointment_booking_deposit
    subject: [appointment_deposit_collected, appointment_deposit_released]
    rule: >-
      When the patient's billing account is on the Self-Pay Account tier on the booking date, the visit
      type's self_pay_booking_deposit_usd is collected when the visit is booked (none where it is 0.00).
      One deposit is collected per appointment. The deposit is held on the appointment until the visit
      closes: on completion it is applied in full to the visit's charges; on a timely or clinic-initiated
      cancellation it is refunded in full within deposit_refund_business_days; on a no-show or late
      cancellation it is forfeited toward the fee that is actually charged, and any part above that fee (or
      the whole deposit when the fee is waived) is refunded. A reschedule carries the deposit to the new
      slot. A patient who gains insurance before the visit keeps the deposit on the appointment until the
      visit closes.
    eligibility:
      - id: one_deposit
        applies_to: [appointment_deposit_collected]
        kind: dedup
        condition: "One deposit is collected per appointment."
        evidence_fields: [appointment_events.appointment_id, appointment_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[appointment_events.appointment_id]]
          action_bindings: {appointment_events.appointment_id: appointment_id}
        dedup_contract:
          table: appointment_events
          mode: separate_record
          object_bindings: {appointment_id: appointment_id}
          duplicate_filters: {event_type: [appointment_deposit_collected]}
          distinct_fields: []
    params:
      per_tier:
        Nurse Visit: {self_pay_booking_deposit_usd: "=self_pay_booking_deposit_usd", deposit_refund_business_days: "=deposit_refund_business_days"}
        Established Patient Office Visit: {self_pay_booking_deposit_usd: "=self_pay_booking_deposit_usd", deposit_refund_business_days: "=deposit_refund_business_days"}
        New Patient Office Visit: {self_pay_booking_deposit_usd: "=self_pay_booking_deposit_usd", deposit_refund_business_days: "=deposit_refund_business_days"}
        Annual Preventive Exam: {self_pay_booking_deposit_usd: "=self_pay_booking_deposit_usd", deposit_refund_business_days: "=deposit_refund_business_days"}
        Specialist Consultation: {self_pay_booking_deposit_usd: "=self_pay_booking_deposit_usd", deposit_refund_business_days: "=deposit_refund_business_days"}
        In-Office Procedure Visit: {self_pay_booking_deposit_usd: "=self_pay_booking_deposit_usd", deposit_refund_business_days: "=deposit_refund_business_days"}
        Advanced Imaging Appointment: {self_pay_booking_deposit_usd: "=self_pay_booking_deposit_usd", deposit_refund_business_days: "=deposit_refund_business_days"}
    formula:
      forfeited_usd: min(deposit_held_usd, amount)

  - id: appointment_arrival_and_completion
    subject: [appointment_checked_in, appointment_completed]
    rule: >-
      Patients are asked to arrive arrival_early_minutes before the start and, where echeckin_available is
      true, may complete e-check-in from echeckin_opens_hours before the start; a New Patient Office Visit,
      Annual Preventive Exam, Specialist Consultation, procedure or imaging visit whose intake forms are due
      new_patient_forms_due_hours before the start may still be checked in if the forms are completed on
      arrival. A patient arriving up to late_arrival_grace_minutes after the start is seen normally; one
      arriving later but within late_arrival_rebook_minutes is checked in and seen if the clinician can
      accommodate, otherwise offered the next slot the same day; beyond that the visit is cancelled as a late
      arrival under appointment_cancellation_timing. A checked-in patient whose clinician is running more
      than clinic_delay_rebook_minutes behind may leave and rebook with no fee and no count, recorded as a
      clinic-initiated cancellation. The copay or time-of-service estimate is collected at check-in under
      the financial account rules. On completion, a visit booked against a referral or authorization uses
      one unit of it, a held deposit is applied to the visit, and the after-visit summary is posted within
      visit_summary_portal_hours.
      The copay collected at check-in is the one named by the visit type's copay_class.
    eligibility: []
    params:
      per_tier:
        Nurse Visit: {late_arrival_grace_minutes: "=late_arrival_grace_minutes", late_arrival_rebook_minutes: "=late_arrival_rebook_minutes"}
        Established Patient Office Visit: {late_arrival_grace_minutes: "=late_arrival_grace_minutes", late_arrival_rebook_minutes: "=late_arrival_rebook_minutes"}
        New Patient Office Visit: {late_arrival_grace_minutes: "=late_arrival_grace_minutes", late_arrival_rebook_minutes: "=late_arrival_rebook_minutes"}
        Annual Preventive Exam: {late_arrival_grace_minutes: "=late_arrival_grace_minutes", late_arrival_rebook_minutes: "=late_arrival_rebook_minutes"}
        Specialist Consultation: {late_arrival_grace_minutes: "=late_arrival_grace_minutes", late_arrival_rebook_minutes: "=late_arrival_rebook_minutes"}
        In-Office Procedure Visit: {late_arrival_grace_minutes: "=late_arrival_grace_minutes", late_arrival_rebook_minutes: "=late_arrival_rebook_minutes"}
        Advanced Imaging Appointment: {late_arrival_grace_minutes: "=late_arrival_grace_minutes", late_arrival_rebook_minutes: "=late_arrival_rebook_minutes"}

  - id: appointment_no_show_escalation
    subject: [appointment_no_show_recorded, appointment_booked]
    rule: >-
      After each no-show (and each late cancellation that counts), appointment_msr_missed_visits is compared
      with the thresholds of the missed visit's type: at no_show_warning_threshold a written attendance
      warning is sent; at no_show_restriction_threshold the patient may, for no_show_restriction_months
      counted from that missed visit's scheduled date, book only same-day slots (future non-same-day
      bookings already held stay in place); at no_show_dismissal_review_threshold the patient is referred to
      the practice manager for a dismissal review, and a dismissed patient receives urgent care for
      dismissal_emergency_care_days after the dismissal letter. A waived fee does not remove the missed visit
      from the count, except a waiver for clinic error, which erases the no-show. Restriction and dismissal
      decisions and their reversal belong to the practice manager, not to the scheduling desk.
      The missed-visit count looks back no_show_lookback_months calendar months and includes late
      cancellations only of visit types whose late_cancel_counts_toward_no_show is true.
    eligibility: []
    params:
      per_tier:
        Nurse Visit: {no_show_warning_threshold: "=no_show_warning_threshold", no_show_restriction_threshold: "=no_show_restriction_threshold", no_show_dismissal_review_threshold: "=no_show_dismissal_review_threshold"}
        Established Patient Office Visit: {no_show_warning_threshold: "=no_show_warning_threshold", no_show_restriction_threshold: "=no_show_restriction_threshold", no_show_dismissal_review_threshold: "=no_show_dismissal_review_threshold"}
        New Patient Office Visit: {no_show_warning_threshold: "=no_show_warning_threshold", no_show_restriction_threshold: "=no_show_restriction_threshold", no_show_dismissal_review_threshold: "=no_show_dismissal_review_threshold"}
        Annual Preventive Exam: {no_show_warning_threshold: "=no_show_warning_threshold", no_show_restriction_threshold: "=no_show_restriction_threshold", no_show_dismissal_review_threshold: "=no_show_dismissal_review_threshold"}
        Specialist Consultation: {no_show_warning_threshold: "=no_show_warning_threshold", no_show_restriction_threshold: "=no_show_restriction_threshold", no_show_dismissal_review_threshold: "=no_show_dismissal_review_threshold"}
        In-Office Procedure Visit: {no_show_warning_threshold: "=no_show_warning_threshold", no_show_restriction_threshold: "=no_show_restriction_threshold", no_show_dismissal_review_threshold: "=no_show_dismissal_review_threshold"}
        Advanced Imaging Appointment: {no_show_warning_threshold: "=no_show_warning_threshold", no_show_restriction_threshold: "=no_show_restriction_threshold", no_show_dismissal_review_threshold: "=no_show_dismissal_review_threshold"}
    measures: [appointment_msr_missed_visits]

  - id: appointment_reminders_and_release
    subject: [appointment_confirmed, appointment_cancelled]
    rule: >-
      Reminders go out by appointment_reminder_channel at reminder_first_hours and reminder_second_hours
      before the start, and preparation instructions prep_instructions_days_before the visit where that is
      above 0; an in-person interpreter must be requested at least interpreter_request_hours before the start.
      The patient confirms in answer to a reminder. Where confirmation_call_required is true and the patient
      has not confirmed by the second reminder, a coordinator calls. Where unconfirmed_release_hours is above
      0 and the appointment is still unconfirmed at that many hours before the start, the clinic releases the
      slot: the appointment is cancelled with reason unconfirmed_release and timing clinic_initiated, with no
      fee and any deposit refunded. A patient who confirms after the release is offered the waitlist or a new
      booking, not the released slot.
    eligibility: []
    params:
      per_tier:
        Nurse Visit: {unconfirmed_release_hours: "=unconfirmed_release_hours", confirmation_call_required: "=confirmation_call_required"}
        Established Patient Office Visit: {unconfirmed_release_hours: "=unconfirmed_release_hours", confirmation_call_required: "=confirmation_call_required"}
        New Patient Office Visit: {unconfirmed_release_hours: "=unconfirmed_release_hours", confirmation_call_required: "=confirmation_call_required"}
        Annual Preventive Exam: {unconfirmed_release_hours: "=unconfirmed_release_hours", confirmation_call_required: "=confirmation_call_required"}
        Specialist Consultation: {unconfirmed_release_hours: "=unconfirmed_release_hours", confirmation_call_required: "=confirmation_call_required"}
        In-Office Procedure Visit: {unconfirmed_release_hours: "=unconfirmed_release_hours", confirmation_call_required: "=confirmation_call_required"}
        Advanced Imaging Appointment: {unconfirmed_release_hours: "=unconfirmed_release_hours", confirmation_call_required: "=confirmation_call_required"}

  - id: appointment_waitlist_offers
    subject: [appointment_rescheduled, appointment_booked]
    rule: >-
      A patient holding an open appointment of a visit type whose waitlist_eligible is true may join the
      earlier-slot waitlist for it; the request lands as a waitlist entry in status waiting. When an earlier
      slot opens, entries are offered in the order they were created, and each offer is held for
      waitlist_offer_hold_minutes; an offer not accepted in that time passes to the next entry and the entry
      returns to waiting. Accepting an offer moves the existing appointment to the offered slot as a
      waitlist move (no reschedule counted, no fee) and closes the entry as accepted; a patient without an
      open appointment who accepts is booked instead. An entry expires when its requested-by date passes.
      Nurse visits are not waitlisted.
    eligibility: []
    params:
      per_tier:
        Nurse Visit: {waitlist_eligible: "=waitlist_eligible", waitlist_offer_hold_minutes: "=waitlist_offer_hold_minutes"}
        Established Patient Office Visit: {waitlist_eligible: "=waitlist_eligible", waitlist_offer_hold_minutes: "=waitlist_offer_hold_minutes"}
        New Patient Office Visit: {waitlist_eligible: "=waitlist_eligible", waitlist_offer_hold_minutes: "=waitlist_offer_hold_minutes"}
        Annual Preventive Exam: {waitlist_eligible: "=waitlist_eligible", waitlist_offer_hold_minutes: "=waitlist_offer_hold_minutes"}
        Specialist Consultation: {waitlist_eligible: "=waitlist_eligible", waitlist_offer_hold_minutes: "=waitlist_offer_hold_minutes"}
        In-Office Procedure Visit: {waitlist_eligible: "=waitlist_eligible", waitlist_offer_hold_minutes: "=waitlist_offer_hold_minutes"}
        Advanced Imaging Appointment: {waitlist_eligible: "=waitlist_eligible", waitlist_offer_hold_minutes: "=waitlist_offer_hold_minutes"}

# ============================================================================
# extended_policies (appointment_scheduling_and_attendance)
# ============================================================================
extended_policies:
  - id: appointment_ext_cancellation_notice_days
    base_policy_refs:
    - appointment_cancellation_timing
    - appointment_reminders_and_release
    - appointment_reschedule
    overwrite:
    - base_policy: appointment_cancellation_timing
      superseded_clause: A patient cancellation is timely when the full elapsed hours from the moment of cancellation to the
        scheduled start (scheduled_date and scheduled_time, clinic local time) are at least the visit type's cancel_notice_hours,
        and late otherwise.
      replaced_by: A patient cancellation is timely when the notice days it gives are at least the notice days the visit requires,
        and late otherwise.
    - base_policy: appointment_cancellation_timing
      superseded_clause: A request to cancel less than cancel_notice_hours before the start in order to rebook is a late cancellation
        of this appointment followed by a new booking, never a reschedule.
      replaced_by: A request to cancel a visit in order to rebook it is recorded as a cancellation of this visit with the timing
        class this rule gives, followed by a new booking, never as a reschedule.
    - base_policy: appointment_reschedule
      superseded_clause: A patient may move an open appointment to another slot of the same visit type while the notice for
        a timely cancellation still holds (at least cancel_notice_hours of full elapsed hours before the current start); the
        move keeps the encounter number and the status.
      replaced_by: A patient may move an open visit to another slot of the same visit type only while a cancellation of the
        visit recorded on the same day would be timely under this rule; the move keeps the encounter number and the status.
    trigger: on_request
    subject:
    - appointment_cancelled
    computes: cancel_timing
    target_tool: cancel_patient_appointment_f57629ba
    params:
      one_day: 1
      two_days: 2
      hours_per_day: 24
      prep_long_days: 3
      lookback_months: 12
      single_count: 1
      repeat_count: 2
      never_moved: -1
      recent_move_days: 30
      lead_mid_days: 30
      lead_long_days: 60
      never_confirmed: -1
      recent_confirm_days: 7
    rule: A patient may cancel an open visit at any time before check-in, and the cancellation is recorded with its timing class.
      A patient cancellation is timely when the notice days it gives are at least the notice days the visit requires, and late
      otherwise. The notice days given are the calendar days from the date of the cancellation to the scheduled date of the
      visit, the cancellation date not counted and the scheduled date counted. The notice days required are the visit type's
      cancellation notice hours divided by 24 and rounded up to a whole day. Where the visit type sends preparation instructions
      3 or more days before the visit, the notice days given are counted only to the day those instructions go out, that is,
      the calendar days are reduced by the visit type's preparation days; where the visit type sends them 1 or 2 days before
      the visit, the notice days given are counted only to the day before the visit, that is, the calendar days are reduced
      by 1 day; where the visit type sends none, the notice days given are the calendar days as counted. Where the patient's
      financial account shows 2 or more no-show or late-cancellation fees posted with a date of service less than 12 whole months
      before the cancellation date, the notice days required rise by 2 days; where it shows exactly 1 such fee, they rise by
      1 day; where it shows none, they do not rise. Where the patient has moved the visit and the latest move was made 30 days
      or fewer before the cancellation date, the notice days required rise by 2 days; where the patient has moved the visit
      and the latest move was made more than 30 days before the cancellation date, they rise by 1 day; where the patient never
      moved the visit, they do not rise. Where the visit was booked 60 or more days before its scheduled date, the notice days
      required rise by 2 days; where it was booked 30 to 59 days before its scheduled date, they rise by 1 day; where it was
      booked fewer than 30 days before its scheduled date, they do not rise. Where the patient confirmed the visit and the confirmation
      was given 7 days or fewer before the cancellation date, the notice days required rise by 2 days; where the patient confirmed
      the visit more than 7 days before the cancellation date, they rise by 1 day; where the patient never confirmed the visit,
      they do not rise. The rises for fee history, for a patient move, for the booking lead and for a confirmation are added
      together onto the notice days required, and the preparation reduction applies only to the notice days given. A request
      to cancel a visit in order to rebook it is recorded as a cancellation of this visit with the timing class this rule gives,
      followed by a new booking, never as a reschedule. A patient may move an open visit to another slot of the same visit type
      only while a cancellation of the visit recorded on the same day would be timely under this rule; the move keeps the encounter
      number and the status. A cancellation made by the clinic is outside this rule and is recorded as clinic initiated.
    prerequisite: []
    cross_category:
    - &id001
      category: billing
      as: history
      reads:
      - billing_transactions.line_category
      - billing_transactions.service_date
      note: Counts no-show and late-cancellation fee charges on the patient's financial account ledger.
    compute:
    - notice_calendar_days: DAYS(NOW, F('scheduled_date'))
    - prep_days: P('prep_instructions_days_before')
    - notice_days_given: DAYS(NOW, F('scheduled_date')) - prep_days if prep_days >= K('prep_long_days') else (DAYS(NOW, F('scheduled_date'))
        - K('one_day') if prep_days >= K('one_day') else notice_calendar_days)
    - fee_history_count: XCOUNT('billing', 'billing_transactions', within_months=K('lookback_months'), date_field='service_date',
        event_type='billing_charge_posted', line_category='no_show_fee') + XCOUNT('billing', 'billing_transactions', within_months=K('lookback_months'),
        date_field='service_date', event_type='billing_charge_posted', line_category='late_cancel_fee')
    - fee_history_rise: K('two_days') if fee_history_count >= K('repeat_count') else (K('one_day') if fee_history_count >= K('single_count')
        else 0)
    - move_age_days: DAYS(F('last_rescheduled_date'), NOW) if F('reschedule_count') >= K('single_count') else K('never_moved')
    - patient_move_rise: K('two_days') if move_age_days >= 0 and move_age_days <= K('recent_move_days') else (K('one_day') if
        move_age_days > K('recent_move_days') else 0)
    - booking_lead_days: DAYS(F('booked_date'), F('scheduled_date'))
    - booking_lead_rise: K('two_days') if booking_lead_days >= K('lead_long_days') else (K('one_day') if booking_lead_days >=
        K('lead_mid_days') else 0)
    - confirmation_age_days: DAYS(F('confirmed_date'), NOW) if F('confirmed_date') else K('never_confirmed')
    - confirmation_rise: K('two_days') if confirmation_age_days >= 0 and confirmation_age_days <= K('recent_confirm_days') else
        (K('one_day') if confirmation_age_days > K('recent_confirm_days') else 0)
    - base_required_days: (P('cancel_notice_hours') + K('hours_per_day') - K('one_day')) // K('hours_per_day')
    - notice_days_required: base_required_days + fee_history_rise + patient_move_rise + booking_lead_rise + confirmation_rise
    - result: '''timely'' if notice_days_given >= notice_days_required else ''late'''
    compute_basis:
      notice_calendar_days: The notice days given are the calendar days from the date of the cancellation to the scheduled date
        of the visit, the cancellation date not counted and the scheduled date counted.
      notice_days_given: Where the visit type sends preparation instructions 3 or more days before the visit, the notice days
        given are counted only to the day those instructions go out, that is, the calendar days are reduced by the visit type's
        preparation days; where the visit type sends them 1 or 2 days before the visit, the notice days given are counted only
        to the day before the visit, that is, the calendar days are reduced by 1 day; where the visit type sends none, the notice
        days given are the calendar days as counted.
      fee_history_count: Where the patient's financial account shows 2 or more no-show or late-cancellation fees posted with
        a date of service less than 12 whole months before the cancellation date, the notice days required rise by 2 days; where
        it shows exactly 1 such fee, they rise by 1 day; where it shows none, they do not rise.
      fee_history_rise: Where the patient's financial account shows 2 or more no-show or late-cancellation fees posted with
        a date of service less than 12 whole months before the cancellation date, the notice days required rise by 2 days; where
        it shows exactly 1 such fee, they rise by 1 day; where it shows none, they do not rise.
      move_age_days: Where the patient has moved the visit and the latest move was made 30 days or fewer before the cancellation
        date, the notice days required rise by 2 days; where the patient has moved the visit and the latest move was made more
        than 30 days before the cancellation date, they rise by 1 day; where the patient never moved the visit, they do not
        rise.
      patient_move_rise: Where the patient has moved the visit and the latest move was made 30 days or fewer before the cancellation
        date, the notice days required rise by 2 days; where the patient has moved the visit and the latest move was made more
        than 30 days before the cancellation date, they rise by 1 day; where the patient never moved the visit, they do not
        rise.
      booking_lead_days: Where the visit was booked 60 or more days before its scheduled date, the notice days required rise
        by 2 days; where it was booked 30 to 59 days before its scheduled date, they rise by 1 day; where it was booked fewer
        than 30 days before its scheduled date, they do not rise.
      booking_lead_rise: Where the visit was booked 60 or more days before its scheduled date, the notice days required rise
        by 2 days; where it was booked 30 to 59 days before its scheduled date, they rise by 1 day; where it was booked fewer
        than 30 days before its scheduled date, they do not rise.
      confirmation_age_days: Where the patient confirmed the visit and the confirmation was given 7 days or fewer before the
        cancellation date, the notice days required rise by 2 days; where the patient confirmed the visit more than 7 days before
        the cancellation date, they rise by 1 day; where the patient never confirmed the visit, they do not rise.
      confirmation_rise: Where the patient confirmed the visit and the confirmation was given 7 days or fewer before the cancellation
        date, the notice days required rise by 2 days; where the patient confirmed the visit more than 7 days before the cancellation
        date, they rise by 1 day; where the patient never confirmed the visit, they do not rise.
      base_required_days: The notice days required are the visit type's cancellation notice hours divided by 24 and rounded
        up to a whole day.
      notice_days_required: The rises for fee history, for a patient move, for the booking lead and for a confirmation are added
        together onto the notice days required, and the preparation reduction applies only to the notice days given.
      result: A patient cancellation is timely when the notice days it gives are at least the notice days the visit requires,
        and late otherwise.
    factors:
    - id: preparation_day_anchor
      effect: method
      decides: notice_days_given
      bindings:
      - prep_days
      - notice_days_given
      ladder:
      - when: the visit type sends preparation instructions 3 or more days before the visit
        method: 'the notice days given are counted only to the day the instructions go out: the calendar days less the visit
          type''s preparation days'
      - when: the visit type sends preparation instructions 1 or 2 days before the visit
        method: 'the notice days given are counted only to the day before the visit: the calendar days less 1 day'
      - when: otherwise
        method: the notice days given are the calendar days to the scheduled date
      baseline:
        notice_days_given: notice_calendar_days
      evidence:
      - date
      - tier_param
      cross_difficulty: null
    - id: fee_history_notice_rise
      effect: parameter
      decides: fee_history_rise
      bindings:
      - fee_history_count
      - fee_history_rise
      ladder:
      - when: the financial account shows 2 or more no-show or late-cancellation fees with a date of service less than 12 whole
          months before the cancellation date
        value: K('two_days')
      - when: the financial account shows exactly 1 such fee
        value: K('one_day')
      - when: otherwise
        value: '0'
      baseline:
        fee_history_rise: '0'
      evidence:
      - cross_category
      - history
      cross_difficulty: billing
    - id: patient_move_notice_rise
      effect: parameter
      decides: patient_move_rise
      bindings:
      - move_age_days
      - patient_move_rise
      ladder:
      - when: the patient moved the visit and the latest move was 30 days or fewer before the cancellation date
        value: K('two_days')
      - when: the patient moved the visit and the latest move was more than 30 days before the cancellation date
        value: K('one_day')
      - when: otherwise
        value: '0'
      baseline:
        patient_move_rise: '0'
      evidence:
      - date
      cross_difficulty: null
    - id: booking_lead_notice_rise
      effect: parameter
      decides: booking_lead_rise
      bindings:
      - booking_lead_days
      - booking_lead_rise
      ladder:
      - when: the visit was booked 60 or more days before its scheduled date
        value: K('two_days')
      - when: the visit was booked 30 to 59 days before its scheduled date
        value: K('one_day')
      - when: otherwise
        value: '0'
      baseline:
        booking_lead_rise: '0'
      evidence:
      - date
      cross_difficulty: null
    - id: confirmation_notice_rise
      effect: parameter
      decides: confirmation_rise
      bindings:
      - confirmation_age_days
      - confirmation_rise
      ladder:
      - when: the patient confirmed the visit 7 days or fewer before the cancellation date
        value: K('two_days')
      - when: the patient confirmed the visit more than 7 days before the cancellation date
        value: K('one_day')
      - when: otherwise
        value: '0'
      baseline:
        confirmation_rise: '0'
      evidence:
      - date
      cross_difficulty: null
    baseline:
      rule: A patient cancellation is timely when the notice days it gives are at least the notice days the visit requires,
        and late otherwise. The notice days given are the calendar days from the date of the cancellation to the scheduled date
        of the visit, the cancellation date not counted and the scheduled date counted. The notice days required are the visit
        type's cancellation notice hours divided by 24 and rounded up to a whole day.
      params:
      - cancel_notice_hours
      - hours_per_day
    inputs:
      history:
      - category: billing
        table: billing_transactions
        aggregate: count
        field: billing_txn_id
        within_months: 12
        filters:
          event_type: billing_charge_posted
      cross_category:
      - billing
  - id: appointment_ext_late_cancel_fee_prohibition
    base_policy_refs:
    - appointment_fee_waiver
    - appointment_cancellation_timing
    - appointment_no_show_fee
    overwrite:
    - base_policy: appointment_fee_waiver
      superseded_clause: The patient supplies the emergency documentation no later than the visit type's documentation window
        counted from the scheduled date of the missed visit.
      replaced_by: A fee recorded as waived at the moment it is decided is entered once for the visit, and no documentation
        is asked of the patient for it.
    - base_policy: appointment_fee_waiver
      superseded_clause: A fee is waived at most once.
      replaced_by: A fee recorded as waived at the moment it is decided is entered once for the visit, and no documentation
        is asked of the patient for it.
    - base_policy: appointment_cancellation_timing
      superseded_clause: A late cancellation is charged the visit type's late_cancel_fee_usd unless appointment_fee_waiver removes
        it.
