        rn_held_addition: '0'
      evidence:
      - date
      cross_difficulty: null
    - id: rn_held_slot_anchor
      effect: method
      decides: rn_held_days
      bindings:
      - rn_held_days
      ladder:
      - when: the patient moved the visit
        method: the held days are counted from the latest move to the scheduled date
      - when: the patient confirmed the visit and never moved it
        method: the held days are counted from the confirmation date to the scheduled date
      - when: otherwise
        method: the held days are counted from the booking date to the scheduled date
      baseline:
        rn_held_days: rn_booking_days
      evidence:
      - date
      cross_difficulty: null
    - id: rn_confirmed_addition
      effect: parameter
      decides: rn_confirmed_addition
      bindings:
      - rn_confirm_lead_days
      - rn_confirmed_addition
      ladder:
      - when: the patient confirmed the missed visit 2 days or fewer before its scheduled date
        value: K('late_confirm_add')
      - when: the patient confirmed it more than 2 days before its scheduled date
        value: K('early_confirm_add')
      - when: otherwise
        value: '0'
      baseline:
        rn_confirmed_addition: '0'
      evidence:
      - date
      cross_difficulty: null
    - id: rn_courtesy_credit
      effect: parameter
      decides: rn_courtesy_credit
      bindings:
      - rn_account_age_days
      - rn_courtesy_credit
      ladder:
      - when: the financial account was opened 1826 or more days back
        value: K('long_tenure_credit')
      - when: the financial account was opened 730 to 1825 days back
        value: K('mid_tenure_credit')
      - when: otherwise
        value: '0'
      baseline:
        rn_courtesy_credit: '0'
      evidence:
      - cross_category
      - date
      cross_difficulty: billing
    - id: rn_hardship_reduction
      effect: parameter
      decides: rn_hardship_rate
      bindings:
      - rn_hardship_pct
      - rn_hardship_through
      - rn_hardship_rate
      ladder:
      - when: a financial-hardship approval above zero covers the scheduled date of the missed visit
        value: the approved hardship percentage
      - when: a financial-hardship approval above zero ended 90 days or fewer before that scheduled date
        value: half the approved hardship percentage
      - when: otherwise
        value: '0'
      baseline:
        rn_hardship_rate: '0'
      evidence:
      - cross_category
      cross_difficulty: billing
    baseline:
      rule: The deposit held on the missed visit is the total of the deposits collected on it less the total already released
        from it. The no-show fee the refund offsets is the visit type's no-show fee when the visit's status is no-show, and
        nothing otherwise. The refund on the missed visit is the deposit held on it, less the no-show fee the refund offsets,
        plus the amount recorded on it as waived for its no-show fee, rounded to the cent.
      params:
      - no_show_fee_usd
    inputs:
      history:
      - table: appointment_events
        aggregate: sum
        field: amount
        filters:
          event_type: appointment_deposit_collected
      - table: appointment_events
        aggregate: sum
        field: amount
        filters:
          event_type: appointment_deposit_released
      - table: appointment_events
        aggregate: sum
        field: amount
        filters:
          event_type: appointment_fee_waived
          fee_type: no_show_fee
      - category: billing
        table: billing_transactions
        aggregate: count
        field: billing_txn_id
        within_months: 12
        filters:
          event_type: billing_charge_posted
      cross_category:
      - billing
  - id: appointment_ext_moved_visit_deposit_balance
    base_policy_refs:
    - appointment_booking_deposit
    - appointment_reschedule
    overwrite:
    - base_policy: appointment_booking_deposit
      superseded_clause: One deposit is collected per appointment.
      replaced_by: When a patient moves an open visit that holds a booking deposit, the deposit is carried to the new slot and
        the deposit the moved visit requires is worked out again; where it exceeds the deposit held on the visit, the patient
        pays the difference by card as a further deposit entry on the same visit, and that balance stays owed while the visit
        is open and is worked out on the day it is paid.
    - base_policy: appointment_booking_deposit
      superseded_clause: A reschedule carries the deposit to the new slot.
      replaced_by: When a patient moves an open visit that holds a booking deposit, the deposit is carried to the new slot and
        the deposit the moved visit requires is worked out again; where it exceeds the deposit held on the visit, the patient
        pays the difference by card as a further deposit entry on the same visit, and that balance stays owed while the visit
        is open and is worked out on the day it is paid.
    trigger: state_due
    subject:
    - appointment_deposit_collected
    computes: amount
    target_tool: pay_deposit_balance_07a1fa0e
    params:
      lookback_months: 12
      single_count: 1
      repeat_count: 2
      standard_rate: 1.0
      single_rate: 1.5
      repeat_rate: 2.0
      high_balance_floor: 100.0
      high_balance_add: 50.0
      low_balance_add: 25.0
      short_move_days: 14
      long_move_days: 45
      short_move_add: 50.0
      mid_move_add: 25.0
    rule: 'When a patient moves an open visit that holds a booking deposit, the deposit is carried to the new slot and the deposit
      the moved visit requires is worked out again; where it exceeds the deposit held on the visit, the patient pays the difference
      by card as a further deposit entry on the same visit, and that balance stays owed while the visit is open and is worked
      out on the day it is paid. The deposit balance owed on the moved visit is the deposit the moved visit requires less the
      deposit held on it, and nothing where that difference is zero or less. The deposit held on the moved visit is the total
      of the deposits collected on it less the total already released from it. The deposit the moved visit requires is the visit
      type''s self-pay booking deposit. Where the ledger of the financial account shows 2 or more no-show or late-cancellation
      fee charges posted with a date of service less than 12 whole months before the payment date, the visit type''s self-pay
      booking deposit, for the deposit the moved visit requires, is doubled; where the ledger shows exactly 1 such charge, the
      visit type''s self-pay booking deposit, for the deposit the moved visit requires, is raised by half; where the ledger
      shows none, it is taken as it stands; charges of any other kind are not counted. Where the latest move left fewer than
      14 days between the day of the move and the new scheduled date, 50.00 dollars are added to the deposit the moved visit
      requires; where it left 14 to 44 days, 25.00 dollars are added; where it left 45 or more days, nothing is added; for a
      visit never moved, the days are counted from its booking date. The unpaid balance counted for the deposit the moved visit
      requires is selected this way: where the patient''s payment plan is active, it is the account''s unpaid balance less the
      balance remaining on that plan; where no payment plan is active and the account carries a financial-hardship approval
      above zero, it is the account''s unpaid balance reduced by the approved hardship percentage and rounded to the cent; otherwise
      it is the account''s unpaid balance as it stands. Where the unpaid balance counted for the deposit the moved visit requires
      is above 100.00 dollars, 50.00 dollars are added to the deposit the moved visit requires; where it is above zero and up
      to 100.00 dollars, 25.00 dollars are added to the deposit the moved visit requires; where it is zero or less, nothing
      is added to the deposit the moved visit requires. The self-pay booking deposit is raised first; the move-lead and unpaid-balance
      amounts are then added, and the deposit the moved visit requires is rounded to the cent before the deposit held is taken
      off it.'
    prerequisite: []
    cross_category:
    - category: billing
      as: history
      reads:
      - billing_transactions.line_category
      - billing_transactions.service_date
      - billing_accounts.patient_balance
      - billing_accounts.hardship_approved_pct
      note: The history rate counts fee charges on the ledger; the balance amount reads the financial account holding.
    - *id003
    compute:
    - mv_deposit_collected: SUM('appointment_events', 'amount', event_type='appointment_deposit_collected')
    - mv_deposit_released: SUM('appointment_events', 'amount', event_type='appointment_deposit_released')
    - mv_deposit_held: mv_deposit_collected - mv_deposit_released
    - mv_fee_history_count: XCOUNT('billing', 'billing_transactions', within_months=K('lookback_months'), date_field='service_date',
        event_type='billing_charge_posted', line_category='no_show_fee') + XCOUNT('billing', 'billing_transactions', within_months=K('lookback_months'),
        date_field='service_date', event_type='billing_charge_posted', line_category='late_cancel_fee')
    - mv_history_rate: K('repeat_rate') if mv_fee_history_count >= K('repeat_count') else (K('single_rate') if mv_fee_history_count
        >= K('single_count') else K('standard_rate'))
    - mv_move_lead_days: DAYS(F('last_rescheduled_date'), F('scheduled_date')) if F('reschedule_count') >= K('single_count')
        else DAYS(F('booked_date'), F('scheduled_date'))
    - mv_move_lead_amount: K('short_move_add') if mv_move_lead_days < K('short_move_days') else (K('mid_move_add') if mv_move_lead_days
        < K('long_move_days') else 0)
    - mv_whole_balance: CFIELD('billing', 'patient_balance')
    - mv_plan_status: CFIELD('payplan', 'status')
    - mv_hardship_pct: CFIELD('billing', 'hardship_approved_pct')
    - mv_balance_counted: RND(mv_whole_balance - CFIELD('payplan', 'remaining_balance'), 2) if mv_plan_status == 'active' else
        (RND(mv_whole_balance * (100 - mv_hardship_pct) / 100, 2) if mv_hardship_pct > 0 else mv_whole_balance)
    - mv_balance_amount: K('high_balance_add') if mv_balance_counted > K('high_balance_floor') else (K('low_balance_add') if
        mv_balance_counted > 0 else 0)
    - mv_deposit_required: RND(P('self_pay_booking_deposit_usd') * mv_history_rate + mv_move_lead_amount + mv_balance_amount,
        2)
    - result: RND(MX(0, mv_deposit_required - mv_deposit_held), 2)
    compute_basis:
      mv_fee_history_count: Where the ledger of the financial account shows 2 or more no-show or late-cancellation fee charges
        posted with a date of service less than 12 whole months before the payment date, the visit type's self-pay booking deposit,
        for the deposit the moved visit requires, is doubled; where the ledger shows exactly 1 such charge, the visit type's
        self-pay booking deposit, for the deposit the moved visit requires, is raised by half; where the ledger shows none,
        it is taken as it stands; charges of any other kind are not counted.
      mv_history_rate: Where the ledger of the financial account shows 2 or more no-show or late-cancellation fee charges posted
        with a date of service less than 12 whole months before the payment date, the visit type's self-pay booking deposit,
        for the deposit the moved visit requires, is doubled; where the ledger shows exactly 1 such charge, the visit type's
        self-pay booking deposit, for the deposit the moved visit requires, is raised by half; where the ledger shows none,
        it is taken as it stands; charges of any other kind are not counted.
      mv_whole_balance: Where the unpaid balance counted for the deposit the moved visit requires is above 100.00 dollars, 50.00
        dollars are added to the deposit the moved visit requires; where it is above zero and up to 100.00 dollars, 25.00 dollars
        are added to the deposit the moved visit requires; where it is zero or less, nothing is added to the deposit the moved
        visit requires.
      mv_plan_status: 'The unpaid balance counted for the deposit the moved visit requires is selected this way: where the patient''s
        payment plan is active, it is the account''s unpaid balance less the balance remaining on that plan; where no payment
        plan is active and the account carries a financial-hardship approval above zero, it is the account''s unpaid balance
        reduced by the approved hardship percentage and rounded to the cent; otherwise it is the account''s unpaid balance as
        it stands.'
      mv_hardship_pct: 'The unpaid balance counted for the deposit the moved visit requires is selected this way: where the
        patient''s payment plan is active, it is the account''s unpaid balance less the balance remaining on that plan; where
        no payment plan is active and the account carries a financial-hardship approval above zero, it is the account''s unpaid
        balance reduced by the approved hardship percentage and rounded to the cent; otherwise it is the account''s unpaid balance
        as it stands.'
      mv_balance_counted: 'The unpaid balance counted for the deposit the moved visit requires is selected this way: where the
        patient''s payment plan is active, it is the account''s unpaid balance less the balance remaining on that plan; where
        no payment plan is active and the account carries a financial-hardship approval above zero, it is the account''s unpaid
        balance reduced by the approved hardship percentage and rounded to the cent; otherwise it is the account''s unpaid balance
        as it stands.'
      mv_balance_amount: Where the unpaid balance counted for the deposit the moved visit requires is above 100.00 dollars,
        50.00 dollars are added to the deposit the moved visit requires; where it is above zero and up to 100.00 dollars, 25.00
        dollars are added to the deposit the moved visit requires; where it is zero or less, nothing is added to the deposit
        the moved visit requires.
      mv_deposit_collected: The deposit held on the moved visit is the total of the deposits collected on it less the total
        already released from it.
      mv_deposit_released: The deposit held on the moved visit is the total of the deposits collected on it less the total already
        released from it.
      mv_deposit_held: The deposit held on the moved visit is the total of the deposits collected on it less the total already
        released from it.
      mv_move_lead_days: Where the latest move left fewer than 14 days between the day of the move and the new scheduled date,
        50.00 dollars are added to the deposit the moved visit requires; where it left 14 to 44 days, 25.00 dollars are added;
        where it left 45 or more days, nothing is added; for a visit never moved, the days are counted from its booking date.
      mv_move_lead_amount: Where the latest move left fewer than 14 days between the day of the move and the new scheduled date,
        50.00 dollars are added to the deposit the moved visit requires; where it left 14 to 44 days, 25.00 dollars are added;
        where it left 45 or more days, nothing is added; for a visit never moved, the days are counted from its booking date.
      mv_deposit_required: The self-pay booking deposit is raised first; the move-lead and unpaid-balance amounts are then added,
        and the deposit the moved visit requires is rounded to the cent before the deposit held is taken off it.
      result: The deposit balance owed on the moved visit is the deposit the moved visit requires less the deposit held on it,
        and nothing where that difference is zero or less.
    factors:
    - id: mv_fee_history_rate
      effect: parameter
      decides: mv_history_rate
      bindings:
      - mv_fee_history_count
      - mv_history_rate
      ladder:
      - when: 2 or more no-show or late-cancellation fee charges with a date of service less than 12 whole months back
        value: K('repeat_rate')
      - when: exactly 1 such charge
        value: K('single_rate')
      - when: otherwise
        value: K('standard_rate')
      baseline:
        mv_history_rate: K('standard_rate')
      evidence:
      - cross_category
      - history
      cross_difficulty: billing
    - id: moved_deposit_move_lead
      effect: parameter
      decides: mv_move_lead_amount
      bindings:
      - mv_move_lead_days
      - mv_move_lead_amount
      ladder:
      - when: the latest move left fewer than 14 days to the new scheduled date
        value: K('short_move_add')
      - when: the latest move left 14 to 44 days to the new scheduled date
        value: K('mid_move_add')
      - when: otherwise (45 or more days)
        value: '0'
      baseline:
        mv_move_lead_amount: '0'
      evidence:
      - date
      cross_difficulty: null
    - id: mv_balance_selection
      effect: method
      decides: mv_balance_counted
      bindings:
      - mv_plan_status
      - mv_hardship_pct
      - mv_balance_counted
      ladder:
      - when: the patient's payment plan is active
        method: the account's unpaid balance less the balance remaining on the active plan
      - when: no payment plan is active and a financial-hardship approval above zero stands
        method: the account's unpaid balance reduced by the approved hardship percentage
      - when: otherwise
        method: the account's unpaid balance as it stands
      baseline:
        mv_balance_counted: mv_whole_balance
      evidence:
      - cross_category
      cross_difficulty: payplan
    - id: mv_unpaid_balance_amount
