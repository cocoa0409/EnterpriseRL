# Extended charter: In-Person Appointments, difficulty appointment_scheduling_and_attendance.
# Path: env/env_0025_multispecialty_physician_group/tasks/appointment_scheduling_and_attendance/appointment.extended.yaml
# Base section below is copied verbatim from blueprint/products/appointment.yaml; extended_policies are appended.

category: appointment
display_name: In-Person Appointments

binding:
  holding_table: appointments
  event_tables: [appointment_events]
  intake_tables: [appointment_waitlist]
  status_field: status
  variant_field: variant_name
  quantity_fields: {deposit_held_usd: booking_deposit}

lifecycle:
  states: [booked, confirmed, checked_in, completed, cancelled, no_show]
  transitions:
    - {from: booked, to: confirmed, by: user, means: "The patient confirms attendance in answer to a reminder (text, email, portal or call)."}
    - {from: booked, to: checked_in, by: agent, means: "An unconfirmed patient arrives inside the late-arrival limit and is checked in by the front desk or kiosk."}
    - {from: confirmed, to: checked_in, by: agent, means: "A confirmed patient arrives inside the late-arrival limit and is checked in."}
    - {from: checked_in, to: completed, by: system, means: "The clinician closes the encounter and the visit is complete."}
    - {from: booked, to: cancelled, by: agent, means: "The appointment is cancelled at the patient's request or by the clinic before the patient is checked in."}
    - {from: confirmed, to: cancelled, by: agent, means: "A confirmed appointment is cancelled at the patient's request or by the clinic before check-in."}
    - {from: booked, to: no_show, by: system, means: "The patient neither cancelled nor arrived inside the late-arrival limit; the slot closes as a no-show at the end of the clinic session."}
    - {from: confirmed, to: no_show, by: system, means: "A confirmed patient neither cancelled nor arrived inside the late-arrival limit."}

accounts:
  - key: booking_deposit
    unit: USD
    meaning: "Booking deposit collected from a self-pay patient for one scheduled visit and held until the visit is completed (applied to its charges), cancelled on time (refunded) or missed or cancelled late (forfeited toward the fee)."

parameter_schema:
  slot_minutes: "Length of the scheduled slot for the visit type; integer, minutes."
  booking_horizon_days: "Furthest calendar day ahead, counted from the booking date, on which the visit type may be scheduled; integer, days."
  min_booking_lead_hours: "Minimum hours between the moment of booking and the scheduled start; integer, hours."
  online_self_scheduling_allowed: "Whether the patient may book the visit type directly in the MyLinden portal; boolean."
  same_day_booking_allowed: "Whether the visit type may be booked for the same calendar day; boolean."
  cancel_notice_hours: "Minimum full elapsed hours between the cancellation and the scheduled start for the cancellation to be timely; integer, hours."
  late_cancel_fee_usd: "Fee for a patient cancellation that is not timely; USD."
  no_show_fee_usd: "Fee for a missed appointment (no-show); USD."
  first_no_show_waived: "Whether the patient's first no-show of the visit type inside the look-back is waived rather than charged; boolean."
  late_cancel_counts_toward_no_show: "Whether a late cancellation of the visit type counts as a missed appointment for the no-show thresholds; boolean."
  no_show_lookback_months: "Rolling look-back, in calendar months, over which missed appointments are counted; integer, months."
  no_show_warning_threshold: "Missed appointments inside the look-back that trigger a written attendance warning; integer, count."
  no_show_restriction_threshold: "Missed appointments inside the look-back after which the patient may book only same-day slots; integer, count."
  no_show_restriction_months: "Duration of the same-day-only booking restriction, in calendar months from the no-show that triggered it; integer, months."
  no_show_dismissal_review_threshold: "Missed appointments inside the look-back that refer the patient to the practice manager for dismissal review; integer, count."
  dismissal_emergency_care_days: "Calendar days of urgent care the group continues to provide after a dismissal letter; integer, days."
  waiver_documentation_days: "Calendar days after the scheduled date of a missed or late-cancelled visit within which emergency documentation must be supplied for a fee waiver; integer, days."
  late_arrival_grace_minutes: "Minutes after the scheduled start within which a late patient is still seen with no consequence; integer, minutes."
  late_arrival_rebook_minutes: "Minutes after the scheduled start beyond which the patient can no longer be checked in and the visit is handled as a late cancellation; integer, minutes."
  reschedule_limit: "Maximum number of patient-requested reschedules of one appointment; integer, count."
  reminder_first_hours: "Hours before the scheduled start at which the first reminder is sent; integer, hours."
  reminder_second_hours: "Hours before the scheduled start at which the second reminder is sent; integer, hours."
  confirmation_call_required: "Whether a scheduling coordinator calls to confirm when the patient has not confirmed by the second reminder; boolean."
  unconfirmed_release_hours: "Hours before the scheduled start by which an unconfirmed appointment is released by the clinic; 0 means never released; integer, hours."
  self_pay_booking_deposit_usd: "Deposit collected at booking when the patient's financial account is on the Self-Pay Account tier; 0.00 means no deposit; USD."
  deposit_refund_business_days: "Business days to refund a booking deposit that becomes refundable; integer."
  referral_required_on_hmo: "Whether the visit type requires an approved referral when the patient's financial account is on the Commercial HMO/EPO Account tier; boolean."
  prior_auth_required: "Whether the visit type requires an approved prior authorization for insured patients; boolean."
  auth_confirmed_lead_business_days: "Business days before the scheduled date by which the required authorization must be approved, or the clinic reschedules the visit; integer."
  new_patient_forms_due_hours: "Hours before the scheduled start by which the intake forms must be completed in the portal; 0 means none required; integer, hours."
  arrival_early_minutes: "Minutes before the scheduled start the patient is asked to arrive; integer, minutes."
  copay_class: "Which insurance copay the visit type draws at check-in: primary, specialist or none; enum string."
  telehealth_conversion_allowed: "Whether the booked visit may be converted to a video visit at the patient's request; boolean."
  telehealth_conversion_cutoff_hours: "Latest point, in hours before the scheduled start, at which a conversion to video may be requested; integer, hours."
  max_open_per_patient: "Maximum appointments of the visit type a patient may hold open (booked or confirmed) at once; integer, count."
  waitlist_eligible: "Whether the patient may join the earlier-slot waitlist for the visit type; boolean."
  waitlist_offer_hold_minutes: "Minutes a waitlist slot offer is held for the patient before it passes to the next person; integer, minutes."
  min_interval_months: "Minimum calendar months between two completed visits of the visit type (preventive frequency limit); 0 means no limit; integer, months."
  new_patient_lookback_months: "Months without a completed visit in the same department after which the patient books as a new patient; 0 means not applicable; integer, months."
  prep_instructions_days_before: "Calendar days before the visit that preparation instructions are sent; 0 means none; integer, days."
  interpreter_request_hours: "Hours before the scheduled start by which an in-person interpreter must be requested; integer, hours."
  clinician_change_on_reschedule_allowed: "Whether a reschedule may move the visit to a different clinician of the same department; boolean."
  clinic_cancel_rebook_priority_days: "Business days within which a clinic-cancelled visit is offered a priority replacement slot; integer."
  clinic_delay_rebook_minutes: "Minutes the clinician must be running behind the scheduled start before a checked-in patient may leave and rebook with no fee and no count; integer, minutes."
  appointment_reminder_channel: "Channel of the reminders: text_and_email or phone_call; enum string."
  echeckin_opens_hours: "Hours before the scheduled start at which portal e-check-in opens; integer, hours."
  echeckin_available: "Whether portal e-check-in is offered for the visit type; boolean."
  visit_summary_portal_hours: "Hours after completion within which the after-visit summary is posted to the portal; integer, hours."
  recurring_series_allowed: "Whether the visit type may be booked as a recurring series (for example allergy injections); boolean."
  recurring_series_max_occurrences: "Maximum appointments in one recurring series; 0 means series not allowed; integer, count."

