      it is decided is entered once for the visit, and no documentation is asked of the patient for it. The late-cancellation
      fee the visit carries is fixed only after the visit''s appointment record shows it cancelled with a timing class. The
      late-cancellation fee the visit carries is the visit type''s late-cancellation fee when the visit''s cancellation is recorded
