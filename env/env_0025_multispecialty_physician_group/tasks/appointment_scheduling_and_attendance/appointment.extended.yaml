    - id: lf_notice_starting_amount
      effect: parameter
      decides: lf_start
      bindings:
      - lf_calendar_days
      - lf_start
      ladder:
      - when: the notice days counted are 8 or more
        value: P('late_cancel_fee_usd') - K('far_notice_credit')
      - when: the notice days counted are 5 to 7
        value: P('late_cancel_fee_usd') - K('mid_notice_credit')
      - when: the cancellation was recorded 1 calendar day or less before the scheduled date
        value: P('no_show_fee_usd')
      - when: otherwise
        value: P('late_cancel_fee_usd')
      baseline:
        lf_start: P('late_cancel_fee_usd')
      evidence:
      - date
      cross_difficulty: null
    - id: lf_notice_preparation_anchor
      effect: method
      decides: lf_notice_days
      bindings:
      - lf_prep_days
      - lf_notice_days
      ladder:
      - when: the visit type sends preparation instructions 3 or more days before the visit
        method: 'the notice is counted only to the day the instructions go out: calendar days less the preparation days'
      - when: the visit type sends preparation instructions 1 or 2 days before the visit
        method: 'the notice is counted only to the day before the visit: calendar days less 1 day'
      - when: otherwise
        method: the notice is the calendar days to the scheduled date
      baseline:
        lf_notice_days: lf_calendar_days
      evidence:
      - date
      - tier_param
      cross_difficulty: null
    - id: lf_attendance_escalation
      effect: parameter
      decides: lf_escalation_rate
      bindings:
      - lf_ns_count
      - lf_lc_count
      - lf_escalation_rate
      ladder:
      - when: 2 or more no-show or late-cancellation fee charges in the 12 whole months back and at least one of them a no-show
          fee
        value: K('repeat_rate')
      - when: at least 1 such charge (late-cancellation or no-show) but not that combination
        value: K('single_rate')
      - when: otherwise
        value: K('standard_rate')
      baseline:
        lf_escalation_rate: K('standard_rate')
      evidence:
      - cross_category
      - history
      cross_difficulty: billing
    - id: lf_patient_move_addition
      effect: parameter
      decides: lf_move_addition
      bindings:
      - lf_move_age
      - lf_move_addition
      ladder:
      - when: the patient moved the visit and the latest move was 30 days or fewer before the cancellation date
        value: K('recent_move_add')
      - when: the patient moved the visit and the latest move was more than 30 days before the cancellation date
        value: K('older_move_add')
      - when: otherwise
        value: '0'
      baseline:
        lf_move_addition: '0'
      evidence:
      - date
      cross_difficulty: null
    baseline:
