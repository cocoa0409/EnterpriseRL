      - billing
  - id: appointment_ext_missed_visit_deposit_refund
    base_policy_refs:
    - appointment_booking_deposit
    - appointment_no_show_fee
    overwrite:
    - base_policy: appointment_booking_deposit
      superseded_clause: on a no-show or late cancellation it is forfeited toward the fee that is actually charged, and any
        part above that fee (or the whole deposit when the fee is waived) is refunded.
      replaced_by: The refund on the missed visit is the deposit held on it, less the no-show fee the refund offsets, plus the
        amount recorded on it as waived for its no-show fee, rounded to the cent.
    trigger: state_due
    subject:
    - appointment_deposit_released
    computes: amount
    target_tool: refund_missed_visit_deposit_4264223f
    params:
      lookback_months: 12
      single_count: 1
      repeat_count: 2
      standard_rate: 1.0
      single_rate: 1.25
      repeat_rate: 1.5
      long_hold_days: 90
      mid_hold_days: 60
      long_hold_add: 25.0
      mid_hold_add: 15.0
      never_confirmed: -1
      late_confirm_days: 2
      late_confirm_add: 25.0
      early_confirm_add: 15.0
      long_tenure_days: 1826
      mid_tenure_days: 730
      long_tenure_credit: 15.0
      mid_tenure_credit: 10.0
      hardship_grace_days: 90
    rule: A booking deposit held on a visit that closed as a no-show is refunded to the patient as one refund entry. The deposit
      refund on a missed visit is fixed only after the missed visit's fee and deposit history shows the decision on its no-show
      fee. A deposit on a missed visit is not refunded until each open visit the patient moved shows a deposit entry dated on
      or after that visit's latest move. The deposit held on the missed visit is the total of the deposits collected on it less
      the total already released from it. The no-show fee the refund offsets is the visit type's no-show fee when the visit's
      status is no-show, and nothing otherwise. The refund on the missed visit is the deposit held on it, less the no-show fee
      the refund offsets, plus the amount recorded on it as waived for its no-show fee, rounded to the cent. Where the ledger
      of the financial account shows 2 or more no-show or late-cancellation fee charges posted with a date of service less than
      12 whole months before the refund date, at least one of them a no-show fee, the visit type's no-show fee is raised by
      half for the no-show fee the refund offsets; where the ledger shows at least 1 such charge but not that combination, it
      is raised by a quarter for the no-show fee the refund offsets; where the ledger shows none, it is taken as it stands;
      charges of any other kind, such as virtual-visit fees, are not counted for the no-show fee the refund offsets. The days
      the missed slot was held for the patient, for the no-show fee the refund offsets, are counted to the scheduled date from
      the latest move where the patient moved the visit, from the confirmation date where the patient confirmed the visit and
      never moved it, and from the booking date otherwise. Where the missed slot was held for the patient 90 days or more, 25.00
      dollars are added to the no-show fee the refund offsets; where it was held 60 to 89 days, 15.00 dollars are added to the
      no-show fee the refund offsets; where it was held fewer than 60 days, nothing is added to the no-show fee the refund offsets.
      Where the patient confirmed the missed visit 2 days or fewer before its scheduled date, 25.00 dollars are added to the
      no-show fee the refund offsets; where the patient confirmed it more than 2 days before its scheduled date, 15.00 dollars
      are added to the no-show fee the refund offsets; where the patient never confirmed it, nothing is added to the no-show
      fee the refund offsets. Where the financial account was opened 1826 or more days before the refund date, 15.00 dollars
      are taken off the no-show fee the refund offsets as a courtesy to a long-standing patient; where it was opened 730 to
      1825 days before, 10.00 dollars are taken off the no-show fee the refund offsets; where it was opened fewer than 730 days
      before, nothing is taken off the no-show fee the refund offsets. Where the account's financial-hardship approval covers
      the scheduled date of the missed visit, the no-show fee the refund offsets is reduced by the approved hardship percentage;
      where the approval ended 90 days or fewer before that scheduled date, it is reduced by half the approved percentage; where
      no approval covers or recently covered that date, it is not reduced. The visit type's no-show fee is raised first; the
      held-slot and confirmation additions are then added and the courtesy credit taken off, the hardship reduction is applied
      to that figure, and the no-show fee the refund offsets is rounded to the cent only at the end.
    prerequisite:
    - problem: appointment_ext_no_show_fee_prohibition
      kind: value_input
      gate: no_show_fee_recorded_as_waived
      form: state
      policy_source: The deposit refund on a missed visit is fixed only after the missed visit's fee and deposit history shows
        the decision on its no-show fee.
      condition: The missed visit's fee and deposit history carries an entry deciding its no-show fee (a waiver entry for fee
        type no_show_fee).
      resolved_by: record_no_show_fee_prohibition_783ac881
      effect: Once the waiver entry stands, the amount recorded as waived enters the refund and offsets the no-show fee the
        refund offsets, so the whole deposit held comes back.
    - problem: appointment_ext_moved_visit_deposit_balance
      kind: state_gate
      gate: appointment_events.event_date
      form: state
      policy_source: A deposit on a missed visit is not refunded until each open visit the patient moved shows a deposit entry
        dated on or after that visit's latest move.
      condition: Every open appointment of the patient with a reschedule count above zero has an appointment_deposit_collected
        entry whose event date is on or after its last_rescheduled_date.
      resolved_by: pay_deposit_balance_07a1fa0e
      effect: Once the moved visit carries a deposit entry dated after its latest move, the refund on the missed visit may be
        made.
