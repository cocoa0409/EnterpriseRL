      - mv_balance_amount
      ladder:
      - when: the unpaid balance counted is above 100.00 dollars
        value: K('high_balance_add')
      - when: the unpaid balance counted is above zero and up to 100.00 dollars
        value: K('low_balance_add')
      - when: otherwise
        value: '0'
      baseline:
        mv_balance_amount: '0'
      evidence:
      - cross_category
      cross_difficulty: billing
    baseline:
      rule: The deposit balance owed on the moved visit is the deposit the moved visit requires less the deposit held on it,
        and nothing where that difference is zero or less. The deposit held on the moved visit is the total of the deposits
        collected on it less the total already released from it. The deposit the moved visit requires is the visit type's self-pay
        booking deposit.
      params:
      - self_pay_booking_deposit_usd
    inputs:
      history:
      - table: appointment_events
        aggregate: sum
        field: amount
        filters:
          event_type: appointment_deposit_collected
      - table: appointment_events
        aggregate: sum
