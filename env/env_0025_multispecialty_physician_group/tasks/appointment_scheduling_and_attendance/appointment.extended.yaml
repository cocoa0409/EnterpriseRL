    - lf_prep_days: P('prep_instructions_days_before')
    - lf_notice_days: (DAYS(F('cancelled_at'), F('scheduled_date')) - lf_prep_days if lf_prep_days >= K('prep_long_days') else
        (DAYS(F('cancelled_at'), F('scheduled_date')) - K('one_day') if lf_prep_days >= K('one_day') else lf_calendar_days))
        if F('cancelled_at') else 0
    - lf_start: P('late_cancel_fee_usd') - K('far_notice_credit') if lf_notice_days >= K('far_notice_days') else (P('late_cancel_fee_usd')
