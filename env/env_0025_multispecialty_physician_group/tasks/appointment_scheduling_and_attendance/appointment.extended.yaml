      kind: value_input
      gate: lf_is_late
      form: state
      policy_source: The late-cancellation fee the visit carries is fixed only after the visit's appointment record shows it
        cancelled with a timing class.
      condition: The visit's appointment record has status cancelled, a cancellation timestamp and a cancel timing of timely,
        late or clinic initiated.
