        added to that figure, and the late-cancellation fee the refund offsets is rounded to the cent only at the end.
      deposit_collected_total: The deposit held on the visit is the total of the deposits collected on it less the total already
        released from it.
      deposit_released_total: The deposit held on the visit is the total of the deposits collected on it less the total already
        released from it.
      deposit_held_on_visit: The deposit held on the visit is the total of the deposits collected on it less the total already
        released from it.
      fee_recorded_as_waived: The refund amount is the deposit held on the visit, less the late-cancellation fee the refund
        offsets, plus the amount recorded on the visit as waived for its late-cancellation fee, rounded to the cent.
      rf_is_late: The late-cancellation fee the refund offsets is the visit type's late-cancellation fee when the visit's cancellation
        is recorded with timing late, and nothing otherwise.
      result: The refund amount is the deposit held on the visit, less the late-cancellation fee the refund offsets, plus the
        amount recorded on the visit as waived for its late-cancellation fee, rounded to the cent.
    factors:
    - id: rf_notice_starting_amount
      effect: parameter
      decides: rf_start
      bindings:
      - rf_calendar_days
      - rf_start
      ladder:
      - when: the notice days counted are 8 or more
        value: P('late_cancel_fee_usd') - K('far_notice_credit')
      - when: the notice days counted are 5 to 7
        value: P('late_cancel_fee_usd') - K('mid_notice_credit')
      - when: the cancellation was recorded 1 calendar day or less before the scheduled date
        value: P('no_show_fee_usd')
      - when: otherwise
        value: P('late_cancel_fee_usd')
      baseline:
        rf_start: P('late_cancel_fee_usd')
      evidence:
      - date
      cross_difficulty: null
    - id: rf_notice_preparation_anchor
      effect: method
      decides: rf_notice_days
      bindings:
      - rf_prep_days
      - rf_notice_days
      ladder:
      - when: the visit type sends preparation instructions 3 or more days before the visit
        method: 'the notice is counted only to the day the instructions go out: calendar days less the preparation days'
      - when: the visit type sends preparation instructions 1 or 2 days before the visit
        method: 'the notice is counted only to the day before the visit: calendar days less 1 day'
      - when: otherwise
        method: the notice is the calendar days to the scheduled date
      baseline:
        rf_notice_days: rf_calendar_days
      evidence:
      - date
      - tier_param
      cross_difficulty: null
    - id: rf_attendance_escalation
      effect: parameter
      decides: rf_escalation_rate
      bindings:
      - rf_ns_count
      - rf_lc_count
      - rf_escalation_rate
      ladder:
      - when: 2 or more no-show or late-cancellation fee charges in the 12 whole months back and at least one of them a no-show
          fee
        value: K('repeat_rate')
      - when: at least 1 such charge (late-cancellation or no-show) but not that combination
        value: K('single_rate')
      - when: otherwise
        value: K('standard_rate')
      baseline:
        rf_escalation_rate: K('standard_rate')
      evidence:
      - cross_category
      - history
      cross_difficulty: billing
    - id: rf_patient_move_addition
      effect: parameter
      decides: rf_move_addition
      bindings:
      - rf_move_age
      - rf_move_addition
      ladder:
      - when: the patient moved the visit and the latest move was 30 days or fewer before the cancellation date
        value: K('recent_move_add')
      - when: the patient moved the visit and the latest move was more than 30 days before the cancellation date
        value: K('older_move_add')
      - when: otherwise
        value: '0'
      baseline:
        rf_move_addition: '0'
      evidence:
      - date
      cross_difficulty: null
    baseline:
      rule: The deposit held on the visit is the total of the deposits collected on it less the total already released from
        it. The late-cancellation fee the refund offsets is the visit type's late-cancellation fee when the visit's cancellation
        is recorded with timing late, and nothing otherwise. The refund amount is the deposit held on the visit, less the late-cancellation
        fee the refund offsets, plus the amount recorded on the visit as waived for its late-cancellation fee, rounded to the
        cent.
      params:
      - late_cancel_fee_usd
    inputs:
      history:
      - table: appointment_events
        aggregate: sum
        field: amount
        filters:
          event_type: appointment_deposit_collected
      - table: appointment_events
        aggregate: sum
        field: amount
        filters:
          event_type: appointment_deposit_released
      - table: appointment_events
        aggregate: sum
        field: amount
        filters:
          event_type: appointment_fee_waived
          fee_type: late_cancel_fee
      - category: billing
        table: billing_transactions
        aggregate: count
        field: billing_txn_id
        within_months: 12
        filters:
          event_type: billing_charge_posted
      cross_category:
      - billing
  - id: appointment_ext_self_pay_booking_deposit
    base_policy_refs:
    - appointment_booking_deposit
    overwrite:
    - base_policy: appointment_booking_deposit
      superseded_clause: When the patient's billing account is on the Self-Pay Account tier on the booking date, the visit type's
        self_pay_booking_deposit_usd is collected when the visit is booked (none where it is 0.00).
      replaced_by: When the patient's financial account is on the Self-Pay Account tier on the booking date of a visit, a booking
        deposit is owed on the visit and the patient pays it by card as one deposit entry; a booking deposit not collected at
        booking stays owed while the visit is open, and it is worked out on the day it is paid.
    trigger: state_due
    subject:
    - appointment_deposit_collected
    computes: amount
    target_tool: pay_booking_deposit_d4a062b3
    params:
      lookback_months: 12
      single_count: 1
      repeat_count: 2
      standard_rate: 1.0
      single_rate: 1.5
      repeat_rate: 2.0
      high_balance_floor: 100.0
      high_balance_add: 50.0
      low_balance_add: 25.0
      long_lead_days: 45
      short_lead_days: 14
      long_lead_credit: 25.0
      short_lead_add: 50.0
      long_tenure_days: 1826
      mid_tenure_days: 730
      long_tenure_credit: 25.0
      mid_tenure_credit: 10.0
    rule: 'When the patient''s financial account is on the Self-Pay Account tier on the booking date of a visit, a booking deposit
      is owed on the visit and the patient pays it by card as one deposit entry; a booking deposit not collected at booking
      stays owed while the visit is open, and it is worked out on the day it is paid. The booking deposit is the visit type''s
      self-pay booking deposit, rounded to the cent; none is owed where the visit type''s self-pay booking deposit is 0.00 or
      where the figure worked out is zero or less. Where the ledger of the financial account shows 2 or more no-show or late-cancellation
      fee charges posted with a date of service less than 12 whole months before the payment date, the visit type''s self-pay
      booking deposit, for the booking deposit, is doubled; where the ledger shows exactly 1 such charge, the visit type''s
      self-pay booking deposit, for the booking deposit, is raised by half; where the ledger shows none, it is taken as it stands;
      charges of any other kind are not counted. Where the visit was booked 45 or more days before its scheduled date, 25.00
      dollars are taken off the booking deposit; where it was booked fewer than 14 days before its scheduled date, 50.00 dollars
      are added to the booking deposit; where it was booked 14 to 44 days before its scheduled date, the booking deposit is
      not changed for its booking lead. The unpaid balance counted for the booking deposit is selected this way: where the patient''s
      payment plan is active, it is the account''s unpaid balance less the balance remaining on that plan; where no payment
      plan is active and the account carries a financial-hardship approval above zero, it is the account''s unpaid balance reduced
      by the approved hardship percentage and rounded to the cent; otherwise it is the account''s unpaid balance as it stands.
      Where the unpaid balance counted for the booking deposit is above 100.00 dollars, 50.00 dollars are added to the booking
      deposit; where it is above zero and up to 100.00 dollars, 25.00 dollars are added to the booking deposit; where it is
      zero or less, nothing is added to the booking deposit. Where the financial account was opened 1826 or more days before
      the payment date, 25.00 dollars are taken off the booking deposit; where it was opened 730 to 1825 days before the payment
      date, 10.00 dollars are taken off the booking deposit; where it was opened fewer than 730 days before the payment date,
      nothing is taken off the booking deposit. The self-pay booking deposit is raised first; the booking-lead amount and the
      unpaid-balance amount are then added to or taken off that product, the account-age credit is taken off, and the booking
      deposit is rounded to the cent only at the end.'
    prerequisite: []
    cross_category:
    - category: billing
      as: history
      reads:
      - billing_transactions.line_category
      - billing_transactions.service_date
      - billing_accounts.patient_balance
      - billing_accounts.hardship_approved_pct
      - billing_accounts.opened_date
      note: The history rate counts fee charges on the ledger; the balance and account-age amounts read the financial account
        holding.
    - &id003
      category: payplan
      as: branch
      reads:
      - status
      - remaining_balance
      note: The balance selection reads whether the patient's payment plan is active and the balance remaining on it.
    compute:
    - dep_fee_history_count: XCOUNT('billing', 'billing_transactions', within_months=K('lookback_months'), date_field='service_date',
        event_type='billing_charge_posted', line_category='no_show_fee') + XCOUNT('billing', 'billing_transactions', within_months=K('lookback_months'),
        date_field='service_date', event_type='billing_charge_posted', line_category='late_cancel_fee')
    - dep_history_rate: K('repeat_rate') if dep_fee_history_count >= K('repeat_count') else (K('single_rate') if dep_fee_history_count
        >= K('single_count') else K('standard_rate'))
    - deposit_lead_days: DAYS(F('booked_date'), F('scheduled_date'))
    - booking_lead_amount: 0 - K('long_lead_credit') if deposit_lead_days >= K('long_lead_days') else (K('short_lead_add') if
        deposit_lead_days < K('short_lead_days') else 0)
    - dep_whole_balance: CFIELD('billing', 'patient_balance')
    - dep_plan_status: CFIELD('payplan', 'status')
    - dep_hardship_pct: CFIELD('billing', 'hardship_approved_pct')
    - dep_balance_counted: RND(dep_whole_balance - CFIELD('payplan', 'remaining_balance'), 2) if dep_plan_status == 'active'
        else (RND(dep_whole_balance * (100 - dep_hardship_pct) / 100, 2) if dep_hardship_pct > 0 else dep_whole_balance)
    - dep_balance_amount: K('high_balance_add') if dep_balance_counted > K('high_balance_floor') else (K('low_balance_add')
        if dep_balance_counted > 0 else 0)
    - account_age_days: DAYS(CFIELD('billing', 'opened_date'), NOW)
    - account_age_credit: K('long_tenure_credit') if account_age_days >= K('long_tenure_days') else (K('mid_tenure_credit')
        if account_age_days >= K('mid_tenure_days') else 0)
    - result: 0 if P('self_pay_booking_deposit_usd') <= 0 else RND(MX(0, P('self_pay_booking_deposit_usd') * dep_history_rate
        + booking_lead_amount + dep_balance_amount - account_age_credit), 2)
    compute_basis:
      dep_fee_history_count: Where the ledger of the financial account shows 2 or more no-show or late-cancellation fee charges
        posted with a date of service less than 12 whole months before the payment date, the visit type's self-pay booking deposit,
        for the booking deposit, is doubled; where the ledger shows exactly 1 such charge, the visit type's self-pay booking
        deposit, for the booking deposit, is raised by half; where the ledger shows none, it is taken as it stands; charges
        of any other kind are not counted.
      dep_history_rate: Where the ledger of the financial account shows 2 or more no-show or late-cancellation fee charges posted
        with a date of service less than 12 whole months before the payment date, the visit type's self-pay booking deposit,
        for the booking deposit, is doubled; where the ledger shows exactly 1 such charge, the visit type's self-pay booking
        deposit, for the booking deposit, is raised by half; where the ledger shows none, it is taken as it stands; charges
        of any other kind are not counted.
      dep_whole_balance: Where the unpaid balance counted for the booking deposit is above 100.00 dollars, 50.00 dollars are
        added to the booking deposit; where it is above zero and up to 100.00 dollars, 25.00 dollars are added to the booking
        deposit; where it is zero or less, nothing is added to the booking deposit.
      dep_plan_status: 'The unpaid balance counted for the booking deposit is selected this way: where the patient''s payment
        plan is active, it is the account''s unpaid balance less the balance remaining on that plan; where no payment plan is
        active and the account carries a financial-hardship approval above zero, it is the account''s unpaid balance reduced
        by the approved hardship percentage and rounded to the cent; otherwise it is the account''s unpaid balance as it stands.'
      dep_hardship_pct: 'The unpaid balance counted for the booking deposit is selected this way: where the patient''s payment
        plan is active, it is the account''s unpaid balance less the balance remaining on that plan; where no payment plan is
        active and the account carries a financial-hardship approval above zero, it is the account''s unpaid balance reduced
        by the approved hardship percentage and rounded to the cent; otherwise it is the account''s unpaid balance as it stands.'
      dep_balance_counted: 'The unpaid balance counted for the booking deposit is selected this way: where the patient''s payment
        plan is active, it is the account''s unpaid balance less the balance remaining on that plan; where no payment plan is
        active and the account carries a financial-hardship approval above zero, it is the account''s unpaid balance reduced
        by the approved hardship percentage and rounded to the cent; otherwise it is the account''s unpaid balance as it stands.'
      dep_balance_amount: Where the unpaid balance counted for the booking deposit is above 100.00 dollars, 50.00 dollars are
        added to the booking deposit; where it is above zero and up to 100.00 dollars, 25.00 dollars are added to the booking
        deposit; where it is zero or less, nothing is added to the booking deposit.
      deposit_lead_days: Where the visit was booked 45 or more days before its scheduled date, 25.00 dollars are taken off the
        booking deposit; where it was booked fewer than 14 days before its scheduled date, 50.00 dollars are added to the booking
        deposit; where it was booked 14 to 44 days before its scheduled date, the booking deposit is not changed for its booking
        lead.
      booking_lead_amount: Where the visit was booked 45 or more days before its scheduled date, 25.00 dollars are taken off
        the booking deposit; where it was booked fewer than 14 days before its scheduled date, 50.00 dollars are added to the
        booking deposit; where it was booked 14 to 44 days before its scheduled date, the booking deposit is not changed for
        its booking lead.
      account_age_days: Where the financial account was opened 1826 or more days before the payment date, 25.00 dollars are
        taken off the booking deposit; where it was opened 730 to 1825 days before the payment date, 10.00 dollars are taken
        off the booking deposit; where it was opened fewer than 730 days before the payment date, nothing is taken off the booking
        deposit.
      account_age_credit: Where the financial account was opened 1826 or more days before the payment date, 25.00 dollars are
        taken off the booking deposit; where it was opened 730 to 1825 days before the payment date, 10.00 dollars are taken
        off the booking deposit; where it was opened fewer than 730 days before the payment date, nothing is taken off the booking
        deposit.
      result: The self-pay booking deposit is raised first; the booking-lead amount and the unpaid-balance amount are then added
        to or taken off that product, the account-age credit is taken off, and the booking deposit is rounded to the cent only
        at the end.
    factors:
    - id: dep_fee_history_rate
      effect: parameter
      decides: dep_history_rate
      bindings:
      - dep_fee_history_count
      - dep_history_rate
      ladder:
      - when: 2 or more no-show or late-cancellation fee charges with a date of service less than 12 whole months back
        value: K('repeat_rate')
      - when: exactly 1 such charge
        value: K('single_rate')
      - when: otherwise
        value: K('standard_rate')
      baseline:
        dep_history_rate: K('standard_rate')
      evidence:
      - cross_category
      - history
      cross_difficulty: billing
    - id: booking_lead_amount
      effect: parameter
      decides: booking_lead_amount
      bindings:
      - deposit_lead_days
      - booking_lead_amount
      ladder:
      - when: the visit was booked 45 or more days before its scheduled date
        value: 0 - K('long_lead_credit')
      - when: the visit was booked fewer than 14 days before its scheduled date
        value: K('short_lead_add')
      - when: otherwise (14 to 44 days)
        value: '0'
      baseline:
        booking_lead_amount: '0'
      evidence:
      - date
      cross_difficulty: null
    - id: dep_balance_selection
      effect: method
      decides: dep_balance_counted
      bindings:
      - dep_plan_status
      - dep_hardship_pct
      - dep_balance_counted
      ladder:
      - when: the patient's payment plan is active
        method: the account's unpaid balance less the balance remaining on the active plan
      - when: no payment plan is active and a financial-hardship approval above zero stands
        method: the account's unpaid balance reduced by the approved hardship percentage
      - when: otherwise
        method: the account's unpaid balance as it stands
      baseline:
        dep_balance_counted: dep_whole_balance
      evidence:
      - cross_category
      cross_difficulty: payplan
    - id: dep_unpaid_balance_amount
      effect: parameter
      decides: dep_balance_amount
      bindings:
      - dep_whole_balance
      - dep_balance_amount
      ladder:
      - when: the unpaid balance counted is above 100.00 dollars
        value: K('high_balance_add')
      - when: the unpaid balance counted is above zero and up to 100.00 dollars
        value: K('low_balance_add')
      - when: otherwise
        value: '0'
      baseline:
        dep_balance_amount: '0'
      evidence:
      - cross_category
      cross_difficulty: billing
    - id: account_age_credit
      effect: parameter
      decides: account_age_credit
      bindings:
      - account_age_days
      - account_age_credit
      ladder:
      - when: the financial account was opened 1826 or more days before the payment date
        value: K('long_tenure_credit')
      - when: the financial account was opened 730 to 1825 days before the payment date
        value: K('mid_tenure_credit')
      - when: otherwise
        value: '0'
      baseline:
        account_age_credit: '0'
      evidence:
      - cross_category
      - date
      cross_difficulty: billing
    baseline:
      rule: The booking deposit is the visit type's self-pay booking deposit, rounded to the cent; none is owed where the visit
        type's self-pay booking deposit is 0.00 or where the figure worked out is zero or less.
      params:
      - self_pay_booking_deposit_usd
    inputs:
      history:
      - category: billing
        table: billing_transactions
        aggregate: count
        field: billing_txn_id
        within_months: 12
        filters:
          event_type: billing_charge_posted
      cross_category:
      - billing
      - payplan
  - id: appointment_ext_no_show_fee_prohibition
    base_policy_refs:
    - appointment_fee_waiver
    - appointment_no_show_fee
    overwrite:
    - base_policy: appointment_fee_waiver
      superseded_clause: The patient supplies the emergency documentation no later than the visit type's documentation window
        counted from the scheduled date of the missed visit.
      replaced_by: A no-show fee recorded as waived at the moment it is decided is entered once for the missed visit, and no
        documentation is asked of the patient for it.
    - base_policy: appointment_fee_waiver
      superseded_clause: A fee is waived at most once.
      replaced_by: A no-show fee recorded as waived at the moment it is decided is entered once for the missed visit, and no
        documentation is asked of the patient for it.
    - base_policy: appointment_no_show_fee
      superseded_clause: The no-show fee is the visit type's no_show_fee_usd.
      replaced_by: The no-show fee the missed visit carries is the visit type's no-show fee when the visit's status is no-show,
        and nothing for a visit in any other status.
    trigger: state_due
    subject:
    - appointment_fee_waived
    computes: amount
    target_tool: record_no_show_fee_prohibition_783ac881
    params:
      lookback_months: 12
      single_count: 1
      repeat_count: 2
      standard_rate: 1.0
      single_rate: 1.25
      repeat_rate: 1.5
      long_hold_days: 90
      mid_hold_days: 60
      long_hold_add: 25.0
      mid_hold_add: 15.0
      never_confirmed: -1
      late_confirm_days: 2
      late_confirm_add: 25.0
      early_confirm_add: 15.0
      long_tenure_days: 1826
      mid_tenure_days: 730
      long_tenure_credit: 15.0
      mid_tenure_credit: 10.0
      hardship_grace_days: 90
    rule: 'When the patient''s financial account was on the Medicaid Managed Care Account tier on the scheduled date of a visit
      that closed as a no-show, the no-show fee the missed visit carries is never charged: it is recorded as waived at the moment
      the fee is decided, with reason Medicaid prohibition, as one waiver entry for the missed visit that references no assessed
      fee, for the amount of the no-show fee the missed visit carries. A no-show fee recorded as waived at the moment it is
      decided is entered once for the missed visit, and no documentation is asked of the patient for it. The no-show fee the
      missed visit carries is the visit type''s no-show fee when the visit''s status is no-show, and nothing for a visit in
      any other status. Where the ledger of the financial account shows 2 or more no-show or late-cancellation fee charges posted
      with a date of service less than 12 whole months before the day the fee is decided, at least one of them a no-show fee,
      the visit type''s no-show fee is raised by half for the no-show fee the missed visit carries; where the ledger shows at
      least 1 such charge but not that combination, it is raised by a quarter for the no-show fee the missed visit carries;
      where the ledger shows none, it is taken as it stands; charges of any other kind, such as virtual-visit fees, are not
      counted for the no-show fee the missed visit carries. The days the missed slot was held for the patient, for the no-show
      fee the missed visit carries, are counted to the scheduled date from the latest move where the patient moved the visit,
      from the confirmation date where the patient confirmed the visit and never moved it, and from the booking date otherwise.
      Where the missed slot was held for the patient 90 days or more, 25.00 dollars are added to the no-show fee the missed
      visit carries; where it was held 60 to 89 days, 15.00 dollars are added to the no-show fee the missed visit carries; where
      it was held fewer than 60 days, nothing is added to the no-show fee the missed visit carries. Where the patient confirmed
      the missed visit 2 days or fewer before its scheduled date, 25.00 dollars are added to the no-show fee the missed visit
      carries; where the patient confirmed it more than 2 days before its scheduled date, 15.00 dollars are added to the no-show
      fee the missed visit carries; where the patient never confirmed it, nothing is added to the no-show fee the missed visit
      carries. Where the financial account was opened 1826 or more days before the day the fee is decided, 15.00 dollars are
      taken off the no-show fee the missed visit carries as a courtesy to a long-standing patient; where it was opened 730 to
      1825 days before, 10.00 dollars are taken off the no-show fee the missed visit carries; where it was opened fewer than
      730 days before, nothing is taken off the no-show fee the missed visit carries. Where the account''s financial-hardship
      approval covers the scheduled date of the missed visit, the no-show fee the missed visit carries is reduced by the approved
      hardship percentage; where the approval ended 90 days or fewer before that scheduled date, it is reduced by half the approved
      percentage; where no approval covers or recently covered that date, it is not reduced. The visit type''s no-show fee is
      raised first; the held-slot and confirmation additions are then added and the courtesy credit taken off, the hardship
      reduction is applied to that figure, and the no-show fee the missed visit carries is rounded to the cent only at the end.'
    prerequisite: []
    cross_category:
    - &id002
      category: billing
      as: history
      reads:
      - billing_transactions.line_category
      - billing_transactions.service_date
      - billing_accounts.opened_date
      - billing_accounts.hardship_approved_pct
      - billing_accounts.hardship_approved_through
      note: The escalation counts fee charges on the ledger; the courtesy credit and the hardship reduction read the financial
        account holding.
    compute:
    - nf_is_no_show: 1 if F('status') == 'no_show' else 0
    - nf_ns_count: XCOUNT('billing', 'billing_transactions', within_months=K('lookback_months'), date_field='service_date',
        event_type='billing_charge_posted', line_category='no_show_fee')
    - nf_lc_count: XCOUNT('billing', 'billing_transactions', within_months=K('lookback_months'), date_field='service_date',
        event_type='billing_charge_posted', line_category='late_cancel_fee')
    - nf_escalation_rate: K('repeat_rate') if nf_ns_count + nf_lc_count >= K('repeat_count') and nf_ns_count >= K('single_count')
        else (K('single_rate') if nf_lc_count >= K('single_count') or nf_ns_count >= K('single_count') else K('standard_rate'))
    - nf_booking_days: DAYS(F('booked_date'), F('scheduled_date'))
    - nf_held_days: DAYS(F('last_rescheduled_date'), F('scheduled_date')) if F('reschedule_count') >= K('single_count') else
        (DAYS(F('confirmed_date'), F('scheduled_date')) if F('confirmed_date') else nf_booking_days)
    - nf_held_addition: K('long_hold_add') if nf_held_days >= K('long_hold_days') else (K('mid_hold_add') if nf_held_days >=
        K('mid_hold_days') else 0)
    - nf_confirm_lead_days: DAYS(F('confirmed_date'), F('scheduled_date')) if F('confirmed_date') else K('never_confirmed')
    - nf_confirmed_addition: K('late_confirm_add') if nf_confirm_lead_days >= 0 and nf_confirm_lead_days <= K('late_confirm_days')
        else (K('early_confirm_add') if nf_confirm_lead_days > K('late_confirm_days') else 0)
    - nf_account_age_days: DAYS(CFIELD('billing', 'opened_date'), NOW)
    - nf_courtesy_credit: K('long_tenure_credit') if nf_account_age_days >= K('long_tenure_days') else (K('mid_tenure_credit')
        if nf_account_age_days >= K('mid_tenure_days') else 0)
    - nf_hardship_pct: CFIELD('billing', 'hardship_approved_pct')
    - nf_hardship_through: CFIELD('billing', 'hardship_approved_through')
    - nf_hardship_rate: nf_hardship_pct if nf_hardship_pct > 0 and nf_hardship_through >= F('scheduled_date') else (nf_hardship_pct
        / 2 if nf_hardship_pct > 0 and nf_hardship_through and DAYS(nf_hardship_through, F('scheduled_date')) <= K('hardship_grace_days')
        else 0)
    - result: RND((P('no_show_fee_usd') * nf_escalation_rate + nf_held_addition + nf_confirmed_addition - nf_courtesy_credit)
        * (100 - nf_hardship_rate) / 100 * nf_is_no_show, 2)
    compute_basis:
      nf_ns_count: Where the ledger of the financial account shows 2 or more no-show or late-cancellation fee charges posted
        with a date of service less than 12 whole months before the day the fee is decided, at least one of them a no-show fee,
        the visit type's no-show fee is raised by half for the no-show fee the missed visit carries; where the ledger shows
        at least 1 such charge but not that combination, it is raised by a quarter for the no-show fee the missed visit carries;
        where the ledger shows none, it is taken as it stands; charges of any other kind, such as virtual-visit fees, are not
        counted for the no-show fee the missed visit carries.
      nf_lc_count: Where the ledger of the financial account shows 2 or more no-show or late-cancellation fee charges posted
        with a date of service less than 12 whole months before the day the fee is decided, at least one of them a no-show fee,
        the visit type's no-show fee is raised by half for the no-show fee the missed visit carries; where the ledger shows
        at least 1 such charge but not that combination, it is raised by a quarter for the no-show fee the missed visit carries;
        where the ledger shows none, it is taken as it stands; charges of any other kind, such as virtual-visit fees, are not
        counted for the no-show fee the missed visit carries.
      nf_escalation_rate: Where the ledger of the financial account shows 2 or more no-show or late-cancellation fee charges
        posted with a date of service less than 12 whole months before the day the fee is decided, at least one of them a no-show
        fee, the visit type's no-show fee is raised by half for the no-show fee the missed visit carries; where the ledger shows
        at least 1 such charge but not that combination, it is raised by a quarter for the no-show fee the missed visit carries;
        where the ledger shows none, it is taken as it stands; charges of any other kind, such as virtual-visit fees, are not
        counted for the no-show fee the missed visit carries.
      nf_booking_days: The days the missed slot was held for the patient, for the no-show fee the missed visit carries, are
        counted to the scheduled date from the latest move where the patient moved the visit, from the confirmation date where
        the patient confirmed the visit and never moved it, and from the booking date otherwise.
      nf_held_days: The days the missed slot was held for the patient, for the no-show fee the missed visit carries, are counted
        to the scheduled date from the latest move where the patient moved the visit, from the confirmation date where the patient
        confirmed the visit and never moved it, and from the booking date otherwise.
      nf_held_addition: Where the missed slot was held for the patient 90 days or more, 25.00 dollars are added to the no-show
        fee the missed visit carries; where it was held 60 to 89 days, 15.00 dollars are added to the no-show fee the missed
        visit carries; where it was held fewer than 60 days, nothing is added to the no-show fee the missed visit carries.
      nf_confirm_lead_days: Where the patient confirmed the missed visit 2 days or fewer before its scheduled date, 25.00 dollars
        are added to the no-show fee the missed visit carries; where the patient confirmed it more than 2 days before its scheduled
        date, 15.00 dollars are added to the no-show fee the missed visit carries; where the patient never confirmed it, nothing
        is added to the no-show fee the missed visit carries.
      nf_confirmed_addition: Where the patient confirmed the missed visit 2 days or fewer before its scheduled date, 25.00 dollars
        are added to the no-show fee the missed visit carries; where the patient confirmed it more than 2 days before its scheduled
        date, 15.00 dollars are added to the no-show fee the missed visit carries; where the patient never confirmed it, nothing
        is added to the no-show fee the missed visit carries.
      nf_account_age_days: Where the financial account was opened 1826 or more days before the day the fee is decided, 15.00
        dollars are taken off the no-show fee the missed visit carries as a courtesy to a long-standing patient; where it was
        opened 730 to 1825 days before, 10.00 dollars are taken off the no-show fee the missed visit carries; where it was opened
        fewer than 730 days before, nothing is taken off the no-show fee the missed visit carries.
      nf_courtesy_credit: Where the financial account was opened 1826 or more days before the day the fee is decided, 15.00
        dollars are taken off the no-show fee the missed visit carries as a courtesy to a long-standing patient; where it was
        opened 730 to 1825 days before, 10.00 dollars are taken off the no-show fee the missed visit carries; where it was opened
        fewer than 730 days before, nothing is taken off the no-show fee the missed visit carries.
      nf_hardship_pct: Where the account's financial-hardship approval covers the scheduled date of the missed visit, the no-show
        fee the missed visit carries is reduced by the approved hardship percentage; where the approval ended 90 days or fewer
        before that scheduled date, it is reduced by half the approved percentage; where no approval covers or recently covered
        that date, it is not reduced.
      nf_hardship_through: Where the account's financial-hardship approval covers the scheduled date of the missed visit, the
        no-show fee the missed visit carries is reduced by the approved hardship percentage; where the approval ended 90 days
        or fewer before that scheduled date, it is reduced by half the approved percentage; where no approval covers or recently
        covered that date, it is not reduced.
      nf_hardship_rate: Where the account's financial-hardship approval covers the scheduled date of the missed visit, the no-show
        fee the missed visit carries is reduced by the approved hardship percentage; where the approval ended 90 days or fewer
        before that scheduled date, it is reduced by half the approved percentage; where no approval covers or recently covered
        that date, it is not reduced.
      result: The visit type's no-show fee is raised first; the held-slot and confirmation additions are then added and the
        courtesy credit taken off, the hardship reduction is applied to that figure, and the no-show fee the missed visit carries
        is rounded to the cent only at the end.
      nf_is_no_show: The no-show fee the missed visit carries is the visit type's no-show fee when the visit's status is no-show,
        and nothing for a visit in any other status.
    factors:
    - id: nf_attendance_escalation
      effect: parameter
      decides: nf_escalation_rate
      bindings:
      - nf_ns_count
      - nf_lc_count
      - nf_escalation_rate
      ladder:
      - when: 2 or more no-show or late-cancellation fee charges in the 12 whole months back and at least one of them a no-show
          fee
        value: K('repeat_rate')
      - when: at least 1 such charge but not that combination
        value: K('single_rate')
      - when: otherwise
        value: K('standard_rate')
      baseline:
        nf_escalation_rate: K('standard_rate')
      evidence:
      - cross_category
      - history
      cross_difficulty: billing
    - id: nf_held_slot_addition
      effect: parameter
      decides: nf_held_addition
      bindings:
      - nf_booking_days
      - nf_held_addition
      ladder:
      - when: the missed slot was held for the patient 90 days or more
        value: K('long_hold_add')
      - when: the missed slot was held for the patient 60 to 89 days
        value: K('mid_hold_add')
      - when: otherwise
        value: '0'
      baseline:
        nf_held_addition: '0'
      evidence:
      - date
      cross_difficulty: null
    - id: nf_held_slot_anchor
      effect: method
      decides: nf_held_days
      bindings:
      - nf_held_days
      ladder:
      - when: the patient moved the visit
        method: the held days are counted from the latest move to the scheduled date
      - when: the patient confirmed the visit and never moved it
        method: the held days are counted from the confirmation date to the scheduled date
      - when: otherwise
        method: the held days are counted from the booking date to the scheduled date
      baseline:
        nf_held_days: nf_booking_days
      evidence:
      - date
      cross_difficulty: null
    - id: nf_confirmed_addition
      effect: parameter
      decides: nf_confirmed_addition
      bindings:
      - nf_confirm_lead_days
      - nf_confirmed_addition
      ladder:
      - when: the patient confirmed the missed visit 2 days or fewer before its scheduled date
        value: K('late_confirm_add')
      - when: the patient confirmed it more than 2 days before its scheduled date
        value: K('early_confirm_add')
      - when: otherwise
        value: '0'
      baseline:
        nf_confirmed_addition: '0'
      evidence:
      - date
      cross_difficulty: null
    - id: nf_courtesy_credit
      effect: parameter
      decides: nf_courtesy_credit
      bindings:
      - nf_account_age_days
      - nf_courtesy_credit
      ladder:
      - when: the financial account was opened 1826 or more days back
        value: K('long_tenure_credit')
      - when: the financial account was opened 730 to 1825 days back
        value: K('mid_tenure_credit')
      - when: otherwise
        value: '0'
      baseline:
        nf_courtesy_credit: '0'
      evidence:
      - cross_category
      - date
      cross_difficulty: billing
    - id: nf_hardship_reduction
      effect: parameter
      decides: nf_hardship_rate
      bindings:
      - nf_hardship_pct
      - nf_hardship_through
      - nf_hardship_rate
      ladder:
      - when: a financial-hardship approval above zero covers the scheduled date of the missed visit
        value: the approved hardship percentage
      - when: a financial-hardship approval above zero ended 90 days or fewer before that scheduled date
        value: half the approved hardship percentage
      - when: otherwise
        value: '0'
      baseline:
        nf_hardship_rate: '0'
      evidence:
      - cross_category
      cross_difficulty: billing
    baseline:
      rule: The no-show fee the missed visit carries is the visit type's no-show fee when the visit's status is no-show, and
