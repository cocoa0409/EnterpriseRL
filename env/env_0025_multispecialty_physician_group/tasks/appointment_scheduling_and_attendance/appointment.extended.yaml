    rule: 'When the patient''s financial account was on the Medicaid Managed Care Account tier on the scheduled date of a visit
      whose cancellation is recorded with timing late, the late-cancellation fee the visit carries is never charged: it is recorded
      as waived at the moment the fee is decided, with reason Medicaid prohibition, as one waiver entry for the visit that references
