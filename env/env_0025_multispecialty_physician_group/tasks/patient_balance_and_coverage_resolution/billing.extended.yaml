  - id: plan_offset
    effect: method
    decides: credit_base
    bindings:
    - plan_active
    - plan_delinquent
    - plan_paid_6m
    - plan_missed_6m
    - plan_missed_amount_6m
    - plan_active_balance
    - plan_delinquent_balance
    - credit_base
    ladder:
    - when: an active payment plan with an installment paid and no missed installment in the last six
        months
      method: the plan's charges do not absorb the credit (remaining_balance added back)
    - when: a delinquent payment plan with a missed installment in the last six months
