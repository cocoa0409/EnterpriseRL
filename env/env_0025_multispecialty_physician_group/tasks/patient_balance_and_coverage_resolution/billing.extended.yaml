  baseline:
    rule: 'Under the standard method the pre-placement statement balance is the account''s balance owed:
      every charge, reversed payment and refund posted to the account less every payment, time-of-service
      collection and adjustment, with the remaining balance of an active or delinquent payment plan left
      off. Under the standard method nothing else is left off the pre-placement statement, and its balance
      is rounded to the nearest cent once, at the end.'
