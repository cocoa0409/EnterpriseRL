    tenure_pct: 'The good-faith percentage starts from the account''s tenure: long_tenure_pct for an account
      opened at least long_tenure_months calendar months before the handling date, mid_tenure_pct for
      one opened at least mid_tenure_months calendar months before it, and standard_good_faith_pct otherwise.'
    cof_recent: The good-faith percentage is lowered by card_on_file_paid_reduction_pct points when a
      card-on-file payment was posted to the account within the one calendar month before the handling
