      calendar months before the handling date, and newer_account_late_fee_pct percent of it when the
      account was opened more recently; for an account charged more late fees in those 12 months it is
      shown.'
    late_left_off: 'The most recently posted late fee, when it was posted after the account''s final_notice_date,
      is left off the pre-placement statement for an account charged no more than two late fees in the
      12 calendar months before the handling date: in full when the account was opened at least mature_account_months
      calendar months before the handling date, and newer_account_late_fee_pct percent of it when the
      account was opened more recently; for an account charged more late fees in those 12 months it is
      shown.'
    result: The pre-placement statement balance is the balance owed less the payment-plan balance and
      less each part left off as stated, never below 0.00, rounded to the nearest cent once, at the end.
      Under the standard method nothing else is left off the pre-placement statement, and its balance
      is rounded to the nearest cent once, at the end.
  factors:
  - id: statement_lead_time
    effect: method
    decides: lead_left_off
    bindings:
    - coi_posted
    - ded_posted
    - nc_posted
    - coi_cof
    - ded_cof
    - nc_cof
    - cof_account
    - coi_in_lead
    - ded_in_lead
    - nc_in_lead
    - lead_left_off
    ladder:
    - when: the tier requires a card on file and the account holds one
      method: a line posted fewer than card_on_file_notice_days calendar days ago that carries no card-on-file
        payment is left off
    - when: otherwise, statement_delivery is mail
      method: a line posted fewer than mail_lead_days calendar days ago is left off
    - when: otherwise
