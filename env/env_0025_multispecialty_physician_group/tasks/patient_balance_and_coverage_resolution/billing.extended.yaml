    rule: 'The paydown base is the balance of the account''s most recent statement less the part of a
      defaulted payment plan''s released balance that is left out of the paydown. Under the standard method
      the final-notice paydown brings the paydown base below the placement minimum: it is the paydown
      base less the tier''s collections_min_balance_usd plus below_minimum_margin_usd, never below 0.00,
      rounded to the nearest cent once, at the end. Under the standard method no part of a released plan
      balance is left out of the paydown base.'
