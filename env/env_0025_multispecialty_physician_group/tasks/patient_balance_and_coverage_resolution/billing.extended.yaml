- id: billing_ext_pre_placement_statement
  base_policy_refs:
  - billing_statement_escalation
  - billing_itemized_statement
  - billing_coverage_verification
  overwrite:
  - base_policy: billing_statement_escalation
    superseded_clause: While a balance is owed, a statement is issued every statement_cycle_days of the
      account's tier, numbered by statement_sequence within the current unpaid series; any payment or
      copay collection restarts the series.
    replaced_by: An account in precollection whose most recent charge was posted after its most recent
      statement is issued a pre-placement statement on the handling date, without waiting for the next
      statement cycle.
  - base_policy: billing_statement_escalation
    superseded_clause: Charges whose claim is still pending with the payer are left off statements until
      insurance_pending_hold_days after their date of service, and charges enrolled in an active payment
      plan are never statemented or escalated while the plan is active or delinquent.
    replaced_by: The pre-placement statement balance is the balance owed less the payment-plan balance
      and less each part left off as stated, never below 0.00, rounded to the nearest cent once, at the
      end.
  trigger: state_due
  subject:
  - billing_statement_issued
  computes: statement_amount_usd
  target_tool: issue_account_statement_de3ca581
  params:
    mail_lead_days: 3
    pending_documentation_pct: 50.0
    mature_account_months: 60
    newer_account_late_fee_pct: 50.0
  rule: 'An account in precollection whose most recent charge was posted after its most recent statement
    is issued a pre-placement statement on the handling date, without waiting for the next statement cycle.
    The pre-placement statement is numbered as the next position in the account''s current unpaid series,
    and that series restarts at 1 after any payment or copay collection. On an account whose tier requires
    a card on file, the pre-placement statement balance is fixed only after the most recent encounter
    carries a card-on-file payment. Under the standard method the pre-placement statement balance is the
    account''s balance owed: every charge, reversed payment and refund posted to the account less every
    payment, time-of-service collection and adjustment, with the remaining balance of an active or delinquent
    payment plan left off. Under the standard method nothing else is left off the pre-placement statement,
    and its balance is rounded to the nearest cent once, at the end. For the pre-placement statement,
    the most recent encounter means the encounter whose deductible or coinsurance line was posted last,
    its lines are its deductible line, its coinsurance line and its non-covered service line, and a line''s
    open part is its amount less the payments posted against that line. How lines of the most recent encounter
    are carried on the pre-placement statement depends on the account: for an account whose tier requires
    a card on file and that holds one, a line posted fewer than the tier''s card_on_file_notice_days calendar
    days before the handling date that carries no card-on-file payment is left off for the next cycle;
    for any other account whose statement_delivery is mail, a line posted fewer than mail_lead_days calendar
    days before the handling date is left off for the next cycle; for any other account every line is
    shown; the open part of each line left off is what is left off. The deductible line of the most recent
    encounter that is not inside the statement lead time is shown only up to the recorded remaining deductible:
    when deductible_remaining_usd is above 0.00 and coverage_verified_date is no more than the tier''s
    coverage_reverification_days calendar days before the handling date, the part of that line''s open
    part above deductible_remaining_usd is left off; when deductible_remaining_usd is above 0.00 and coverage_verified_date
    is older than that, the line''s whole open part is left off; when deductible_remaining_usd is 0.00
    the line is shown in full. The most recently posted no-show fee, whose open part is its amount less
    the payments and adjustments posted against it, is left off the pre-placement statement while its
    missed visit is inside the documentation window of the visit''s type, that is, while the handling
    date is no more than the appointment rules'' waiver_documentation_days calendar days after the visit
    date: its whole open part is left off when that visit type waives a first no-show (first_no_show_waived),
    and pending_documentation_pct percent of its open part when it does not; once the window has closed
    the fee is shown. The most recently posted late fee, when it was posted after the account''s final_notice_date,
    is left off the pre-placement statement for an account charged no more than two late fees in the 12
    calendar months before the handling date: in full when the account was opened at least mature_account_months
    calendar months before the handling date, and newer_account_late_fee_pct percent of it when the account
    was opened more recently; for an account charged more late fees in those 12 months it is shown. The
    pre-placement statement balance is the balance owed less the payment-plan balance and less each part
    left off as stated, never below 0.00, rounded to the nearest cent once, at the end. A window of calendar
    months for the pre-placement statement ends on the handling date and reaches back that many months,
    a date on the same calendar day that many months earlier falling outside it.'
  prerequisite:
  - problem: billing_ext_card_on_file_charge
    kind: value_input
    gate: owed
    form: state
    policy_source: On an account whose tier requires a card on file, the pre-placement statement balance
      is fixed only after the most recent encounter carries a card-on-file payment.
    condition: On an account whose tier has card_on_file_required true, the most recent encounter (the
      encounter of the last-posted deductible or coinsurance line) carries a billing_payment_posted entry
      with payment_method card_on_file.
    resolved_by: charge_card_on_file_381e2993
    effect: The card-on-file payment lowers the balance owed (the owed binding) by the amount charged,
      and the open part of the line it is posted against shrinks by the same amount, so the statement
      balance reflects the card charge.
  cross_category:
  - category: payplan
    as: existence
    reads:
    - status
    - remaining_balance
    note: The remaining balance of an active or delinquent plan is left off the statement (standard method).
  - category: appointment
    as: branch
    reads:
    - encounter_number
    - variant_name
    note: The missed visit's type decides the documentation window and whether a first no-show is waived,
      which decides the no-show fee tier.
  compute:
  - charges: SUM('billing_transactions','amount', event_type='billing_charge_posted')
  - reversed: SUM('billing_transactions','amount', event_type='billing_payment_reversed')
  - refunded: SUM('billing_transactions','amount', event_type='billing_refund_issued')
  - paid: SUM('billing_transactions','amount', event_type='billing_payment_posted')
  - collected: SUM('billing_transactions','amount', event_type='billing_copay_collected')
  - adjusted: SUM('billing_transactions','amount', event_type='billing_adjustment_posted')
  - owed: charges + reversed + refunded - paid - collected - adjusted
  - plan_balance: (CFIELD('payplan','remaining_balance', status='active') or 0) + (CFIELD('payplan','remaining_balance',
      status='delinquent') or 0)
  - date_c: LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_charge_posted',
      line_category='coinsurance')
  - date_d: LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_charge_posted',
      line_category='deductible')
  - enc_c: LATEST('billing_transactions','encounter_number', date_field='txn_date', event_type='billing_charge_posted',
      line_category='coinsurance')
  - enc_d: LATEST('billing_transactions','encounter_number', date_field='txn_date', event_type='billing_charge_posted',
      line_category='deductible')
  - enc: enc_c if (date_c or '') >= (date_d or '') else enc_d
  - coi_id: LATEST('billing_transactions','billing_txn_id', date_field='txn_date', event_type='billing_charge_posted',
      encounter_number=enc, line_category='coinsurance')
  - ded_id: LATEST('billing_transactions','billing_txn_id', date_field='txn_date', event_type='billing_charge_posted',
      encounter_number=enc, line_category='deductible')
  - coi_line: SUM('billing_transactions','amount', billing_txn_id=coi_id)
  - ded_line: SUM('billing_transactions','amount', billing_txn_id=ded_id)
  - coi_open: MX(0, coi_line - SUM('billing_transactions','amount', event_type='billing_payment_posted',
      applies_to_txn_id=coi_id))
  - ded_open: MX(0, ded_line - SUM('billing_transactions','amount', event_type='billing_payment_posted',
      applies_to_txn_id=ded_id))
  - nc_id: LATEST('billing_transactions','billing_txn_id', date_field='txn_date', event_type='billing_charge_posted',
      encounter_number=enc, line_category='noncovered_service')
  - nc_line: SUM('billing_transactions','amount', billing_txn_id=nc_id)
  - nc_open: MX(0, nc_line - SUM('billing_transactions','amount', event_type='billing_payment_posted',
      applies_to_txn_id=nc_id))
  - coi_posted: LATEST('billing_transactions','txn_date', date_field='txn_date', billing_txn_id=coi_id)
  - ded_posted: LATEST('billing_transactions','txn_date', date_field='txn_date', billing_txn_id=ded_id)
  - nc_posted: LATEST('billing_transactions','txn_date', date_field='txn_date', billing_txn_id=nc_id)
  - coi_cof: SUM('billing_transactions','amount', event_type='billing_payment_posted', payment_method='card_on_file',
      applies_to_txn_id=coi_id)
  - ded_cof: SUM('billing_transactions','amount', event_type='billing_payment_posted', payment_method='card_on_file',
      applies_to_txn_id=ded_id)
  - nc_cof: SUM('billing_transactions','amount', event_type='billing_payment_posted', payment_method='card_on_file',
      applies_to_txn_id=nc_id)
  - cof_account: P('card_on_file_required') == True and F('card_on_file') == True
  - coi_in_lead: coi_line > 0 and ((cof_account and DAYS(coi_posted, NOW) < P('card_on_file_notice_days')
      and coi_cof == 0) or (not cof_account and F('statement_delivery') == 'mail' and DAYS(coi_posted,
      NOW) < K('mail_lead_days')))
  - ded_in_lead: ded_line > 0 and ((cof_account and DAYS(ded_posted, NOW) < P('card_on_file_notice_days')
      and ded_cof == 0) or (not cof_account and F('statement_delivery') == 'mail' and DAYS(ded_posted,
      NOW) < K('mail_lead_days')))
  - nc_in_lead: nc_line > 0 and ((cof_account and DAYS(nc_posted, NOW) < P('card_on_file_notice_days')
      and nc_cof == 0) or (not cof_account and F('statement_delivery') == 'mail' and DAYS(nc_posted, NOW)
      < K('mail_lead_days')))
  - lead_left_off: (coi_open if coi_in_lead else 0) + (ded_open if ded_in_lead else 0) + (nc_open if nc_in_lead
      else 0) if (cof_account or F('statement_delivery') == 'mail') else 0
  - ded_remaining: F('deductible_remaining_usd')
  - verified_age: DAYS(F('coverage_verified_date'), NOW)
  - ded_left_off: 0 if ded_in_lead else (MX(0, ded_open - ded_remaining) if (ded_remaining > 0 and verified_age
      <= P('coverage_reverification_days')) else (ded_open if (ded_remaining > 0 and verified_age > P('coverage_reverification_days'))
      else 0))
  - fee_id: LATEST('billing_transactions','billing_txn_id', date_field='txn_date', event_type='billing_charge_posted',
      line_category='no_show_fee')
  - fee_enc: LATEST('billing_transactions','encounter_number', date_field='txn_date', event_type='billing_charge_posted',
      line_category='no_show_fee')
  - fee_visit_date: LATEST('billing_transactions','service_date', date_field='txn_date', event_type='billing_charge_posted',
      line_category='no_show_fee')
  - fee_open: MX(0, SUM('billing_transactions','amount', billing_txn_id=fee_id) - SUM('billing_transactions','amount',
      event_type='billing_payment_posted', applies_to_txn_id=fee_id) - SUM('billing_transactions','amount',
      event_type='billing_adjustment_posted', applies_to_txn_id=fee_id))
  - window_days: CPARAM('appointment','waiver_documentation_days', encounter_number=fee_enc)
  - first_waived: CPARAM('appointment','first_no_show_waived', encounter_number=fee_enc)
  - in_window: fee_open > 0 and window_days and DAYS(fee_visit_date, NOW) <= window_days
  - fee_left_off: fee_open if (in_window and first_waived == True) else (RND(fee_open * K('pending_documentation_pct')
      / 100, 2) if (in_window and first_waived == False) else 0)
  - late_12m: COUNT('billing_transactions', within_months=12, date_field='txn_date', event_type='billing_charge_posted',
      line_category='late_fee')
  - late_last_date: LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_charge_posted',
      line_category='late_fee')
  - late_last_amt: LATEST('billing_transactions','amount', date_field='txn_date', event_type='billing_charge_posted',
      line_category='late_fee')
  - late_after_notice: late_last_amt if (late_last_date and F('final_notice_date') and late_last_date
      > F('final_notice_date')) else 0
  - account_age: MONTHS(F('opened_date'), NOW)
  - late_left_off: late_after_notice if (late_12m <= 2 and account_age >= K('mature_account_months'))
      else (RND(late_after_notice * K('newer_account_late_fee_pct') / 100, 2) if (late_12m <= 2 and account_age
      < K('mature_account_months')) else 0)
  - result: MX(0, RND(owed - plan_balance - lead_left_off - ded_left_off - fee_left_off - late_left_off,
      2))
