- id: billing_ext_final_notice_paydown
  base_policy_refs:
  - billing_payment_application
  - billing_statement_escalation
  - billing_collections_recall
  overwrite:
  - base_policy: billing_payment_application
    superseded_clause: A payment is applied to a specific encounter only when the patient names that encounter's
      encounter number.
    replaced_by: The final-notice paydown is posted as one entry against the open charge with the earliest
      date of service, whether or not the patient names that encounter's encounter number, and once it
      is posted the account returns to active and its final_notice_date is cleared.
  - base_policy: billing_payment_application
    superseded_clause: A payment is applied to open charges in the tier's payment_allocation_order (oldest
      date of service first, and among charges of the same date the lower txn_date first), one allocation
      per charge, each allocation never exceeding that charge's remaining balance.
    replaced_by: The final-notice paydown is posted as one entry against the open charge with the earliest
      date of service, whether or not the patient names that encounter's encounter number, and once it
      is posted the account returns to active and its final_notice_date is cleared.
  - base_policy: billing_statement_escalation
    superseded_clause: Enrolling the past-due balance in a payment plan, or paying it below collections_min_balance_usd,
      during the final-notice period returns the account to active.
    replaced_by: 'How the final-notice paydown is computed depends on the account''s history: an account
      with a check or ACH payment returned in the 12 calendar months before the handling date pays the
      whole paydown base; an account with no such return that was opened at least good_faith_min_tenure_months
      calendar months before the handling date pays the good-faith share, the paydown base multiplied
      by the good-faith percentage; any other account pays under the standard method.'
  - base_policy: billing_collections_recall
    superseded_clause: An account in precollection returns to active when its past-due balance is enrolled
      in a payment plan or paid below collections_min_balance_usd.
    replaced_by: 'How the final-notice paydown is computed depends on the account''s history: an account
      with a check or ACH payment returned in the 12 calendar months before the handling date pays the
      whole paydown base; an account with no such return that was opened at least good_faith_min_tenure_months
      calendar months before the handling date pays the good-faith share, the paydown base multiplied
      by the good-faith percentage; any other account pays under the standard method.'
  trigger: on_request
  subject:
  - billing_payment_posted
  computes: payment_amount_usd
  target_tool: pay_final_notice_balance_8381dcc2
  params:
    below_minimum_margin_usd: 0.01
    good_faith_min_tenure_months: 36
    long_tenure_months: 120
    mid_tenure_months: 60
    long_tenure_pct: 40.0
    mid_tenure_pct: 50.0
    standard_good_faith_pct: 60.0
    card_on_file_paid_reduction_pct: 10.0
    card_on_file_enrolled_reduction_pct: 5.0
    member_long_months: 6
    member_long_reduction_pct: 10.0
    member_new_reduction_pct: 5.0
    late_fee_two_addon_pct: 10.0
    late_fee_one_addon_pct: 5.0
  rule: 'This policy settles the final-notice paydown: the amount a patient pays by card during the account''s
    final-notice period (status precollection) so that the account returns to active. The final-notice
    paydown is not fixed until the account''s most recent statement is dated no earlier than its most
    recent charge posting. The paydown base is the balance of the account''s most recent statement less
    the part of a defaulted payment plan''s released balance that is left out of the paydown. Under the
    standard method the final-notice paydown brings the paydown base below the placement minimum: it is
    the paydown base less the tier''s collections_min_balance_usd plus below_minimum_margin_usd, never
    below 0.00, rounded to the nearest cent once, at the end. Under the standard method no part of a released
    plan balance is left out of the paydown base. A defaulted payment plan''s released balance is left
    out of the paydown base while the plan can still be reinstated, that is, while the plan''s defaulted_date
    is no more than its tier''s reinstatement_window_days calendar days before the handling date: the
    whole released balance is left out for a Financial Hardship Plan, and for any other plan tier the
    released balance less the reinstatement payment (the tier''s reinstatement_payment_installments times
    the plan''s installment_amount) is left out; once the reinstatement window has closed, nothing is
    left out. How the final-notice paydown is computed depends on the account''s history: an account with
    a check or ACH payment returned in the 12 calendar months before the handling date pays the whole
    paydown base; an account with no such return that was opened at least good_faith_min_tenure_months
    calendar months before the handling date pays the good-faith share, the paydown base multiplied by
    the good-faith percentage; any other account pays under the standard method. The good-faith percentage
    starts from the account''s tenure: long_tenure_pct for an account opened at least long_tenure_months
    calendar months before the handling date, mid_tenure_pct for one opened at least mid_tenure_months
    calendar months before it, and standard_good_faith_pct otherwise. The good-faith percentage is lowered
    by card_on_file_paid_reduction_pct points when a card-on-file payment was posted to the account within
    the one calendar month before the handling date, by card_on_file_enrolled_reduction_pct points when
    no such payment was posted but the account holds a card on file, and by nothing otherwise. The good-faith
    percentage is lowered by member_long_reduction_pct points for a patient whose Linden membership is
    active and was activated at least member_long_months calendar months before the handling date, by
    member_new_reduction_pct points for an active membership activated more recently, and by nothing when
    no membership is active. The good-faith percentage is raised by late_fee_two_addon_pct points when
    the account was charged two or more late fees in the 12 calendar months before the handling date,
    by late_fee_one_addon_pct points when it was charged exactly one, and by nothing when it was charged
    none. The good-faith percentage is the tenure percentage less the card-on-file and membership reductions
    plus the late-fee addition, and the good-faith share is the paydown base multiplied by that percentage,
    rounded to the nearest cent once, at the end. A window of calendar months for the final-notice paydown
    ends on the handling date and reaches back that many months, a date on the same calendar day that
    many months earlier falling outside it. The final-notice paydown is posted as one entry against the
    open charge with the earliest date of service, whether or not the patient names that encounter''s
    encounter number, and once it is posted the account returns to active and its final_notice_date is
    cleared.'
  prerequisite:
  - problem: billing_ext_pre_placement_statement
    kind: value_input
    gate: statement_balance
    form: state
    policy_source: The final-notice paydown is not fixed until the account's most recent statement is
      dated no earlier than its most recent charge posting.
    condition: The account's most recent billing_statement_issued entry has a txn_date on or after the
      txn_date of its most recent billing_charge_posted entry.
    resolved_by: issue_account_statement_de3ca581
    effect: The newly issued statement becomes the most recent statement, so the statement_balance binding
      (and with it the paydown base) takes that statement's balance instead of the final-notice statement's.
  cross_category:
  - category: payplan
    as: branch
    reads:
    - status
    - variant_name
    - defaulted_date
    - installment_amount
    - payplan_transactions.amount
    note: A defaulted plan still inside its tier's reinstatement window decides how much of the released
      balance is left out of the paydown base.
  - category: membership
    as: branch
    reads:
    - status
    - activated_date
    note: An active Linden membership and its activation date decide the membership reduction of the good-faith
      percentage.
  compute:
  - statement_balance: LATEST('billing_transactions','amount', date_field='txn_date', event_type='billing_statement_issued')
  - plan_default_date: CFIELD('payplan','defaulted_date', status='defaulted')
  - plan_tier_window: CPARAM('payplan','reinstatement_window_days', status='defaulted')
  - plan_reinstate_n: CPARAM('payplan','reinstatement_payment_installments', status='defaulted')
  - plan_installment: CFIELD('payplan','installment_amount', status='defaulted')
  - plan_is_hardship: EXISTS('payplan', status='defaulted', variant_name='Financial Hardship Plan')
  - plan_released: XSUM('payplan','payplan_transactions','amount', event_type='payplan_balance_released')
  - plan_reinstatable: plan_released > 0 and plan_default_date and DAYS(plan_default_date, NOW) <= plan_tier_window
  - plan_left_out: plan_released if (plan_reinstatable and plan_is_hardship) else (MX(0, plan_released
      - plan_reinstate_n * plan_installment) if (plan_reinstatable and not plan_is_hardship) else 0)
  - paydown_base: MX(0, statement_balance - plan_left_out)
  - returned_12m: COUNT('billing_transactions', within_months=12, date_field='txn_date', event_type='billing_payment_reversed',
      payment_method='check') + COUNT('billing_transactions', within_months=12, date_field='txn_date',
      event_type='billing_payment_reversed', payment_method='ach')
  - tenure_months: MONTHS(F('opened_date'), NOW)
  - tenure_pct: K('long_tenure_pct') if tenure_months >= K('long_tenure_months') else (K('mid_tenure_pct')
      if tenure_months >= K('mid_tenure_months') else K('standard_good_faith_pct'))
  - cof_recent: COUNT('billing_transactions', within_months=1, date_field='txn_date', event_type='billing_payment_posted',
      payment_method='card_on_file')
  - cof_reduction: K('card_on_file_paid_reduction_pct') if cof_recent > 0 else (K('card_on_file_enrolled_reduction_pct')
      if F('card_on_file') == True else 0)
  - member_since: CFIELD('membership','activated_date', status='active')
  - member_reduction: K('member_long_reduction_pct') if (member_since and MONTHS(member_since, NOW) >=
      K('member_long_months')) else (K('member_new_reduction_pct') if (member_since and MONTHS(member_since,
      NOW) < K('member_long_months')) else 0)
  - late_12m: COUNT('billing_transactions', within_months=12, date_field='txn_date', event_type='billing_charge_posted',
      line_category='late_fee')
  - late_addon: K('late_fee_two_addon_pct') if late_12m >= 2 else (K('late_fee_one_addon_pct') if late_12m
      == 1 else 0)
  - good_faith_pct: tenure_pct - cof_reduction - member_reduction + late_addon
  - paydown: paydown_base if returned_12m > 0 else (RND(paydown_base * good_faith_pct / 100, 2) if tenure_months
      >= K('good_faith_min_tenure_months') else MX(0, paydown_base - P('collections_min_balance_usd')
      + K('below_minimum_margin_usd')))
  - result: MX(0, RND(paydown, 2))
  compute_basis:
    statement_balance: The paydown base is the balance of the account's most recent statement less the
      part of a defaulted payment plan's released balance that is left out of the paydown.
    plan_default_date: 'A defaulted payment plan''s released balance is left out of the paydown base while
      the plan can still be reinstated, that is, while the plan''s defaulted_date is no more than its
      tier''s reinstatement_window_days calendar days before the handling date: the whole released balance
      is left out for a Financial Hardship Plan, and for any other plan tier the released balance less
      the reinstatement payment (the tier''s reinstatement_payment_installments times the plan''s installment_amount)
      is left out; once the reinstatement window has closed, nothing is left out.'
    plan_tier_window: 'A defaulted payment plan''s released balance is left out of the paydown base while
      the plan can still be reinstated, that is, while the plan''s defaulted_date is no more than its
      tier''s reinstatement_window_days calendar days before the handling date: the whole released balance
      is left out for a Financial Hardship Plan, and for any other plan tier the released balance less
      the reinstatement payment (the tier''s reinstatement_payment_installments times the plan''s installment_amount)
