- id: billing_ext_credit_refund
  base_policy_refs:
  - billing_credit_balance_refund
  - billing_payment_application
  - billing_returned_payment
  - billing_coverage_verification
  overwrite:
  - base_policy: billing_credit_balance_refund
    superseded_clause: Before any refund the credit is applied to any other open charge on the account,
      oldest date of service first, and only what remains is refundable.
    replaced_by: 'Which open charges absorb the credit depends on the patient''s payment plan: when the
      patient has an active payment plan with an installment paid and no missed installment recorded in
      the six calendar months before the handling date, the charges that plan carries do not absorb the
      credit and the plan''s remaining_balance is added back; when the patient has a delinquent payment
      plan with a missed installment recorded in those six months, those charges absorb only the missed
      installments and the plan''s remaining_balance less the missed installment amounts is added back;
      otherwise every open charge absorbs the credit.'
  - base_policy: billing_credit_balance_refund
    superseded_clause: A remaining credit of at least refund_threshold_usd is refunded, within refund_processing_business_days
      after the hold ends, to the method of that payment (a cash payment is refunded by check); a smaller
      credit stays on the account for future charges.
    replaced_by: The credit refund is worked out as the credit balance with the plan add-back, less every
      amount kept (the booked-visit hold, the returned-payment reserve, the dues hold, the deductible
      reserve and the virtual-visit hold), never below 0.00, rounded to the nearest cent once, at the
      end; what is kept stays on the account as a credit.
  trigger: on_request
  subject:
  - billing_refund_issued
  computes: refund_amount_usd
  target_tool: issue_credit_refund_942b7f9f
  params:
    procedure_visit_hold_usd: 150.0
    consultation_visit_hold_usd: 75.0
    deductible_reserve_cap_usd: 150.0
    specialty_virtual_hold_usd: 45.0
    virtual_visit_hold_usd: 25.0
  rule: 'This policy settles the credit refund: the amount of an account''s credit balance refunded to
    the payer of the payment that created the credit. A credit is refunded only after the charge whose
    check or ACH payment was most recently returned carries a card, HSA/FSA card or cash payment posted
    after that return. Under the standard method the credit refund is the account''s credit balance once
    the credit has been applied to every other open charge: every payment, time-of-service collection
    and adjustment posted to the account less every charge, reversed payment and refund, refunded in full
    and rounded to the nearest cent once, at the end. Which open charges absorb the credit depends on
    the patient''s payment plan: when the patient has an active payment plan with an installment paid
    and no missed installment recorded in the six calendar months before the handling date, the charges
    that plan carries do not absorb the credit and the plan''s remaining_balance is added back; when the
    patient has a delinquent payment plan with a missed installment recorded in those six months, those
    charges absorb only the missed installments and the plan''s remaining_balance less the missed installment
    amounts is added back; otherwise every open charge absorbs the credit. Part of the credit is kept
    on the account for a booked in-person visit: when an Advanced Imaging Appointment or an In-Office
    Procedure Visit is booked, procedure_visit_hold_usd is kept; when a Specialist Consultation is booked
    and neither of those is, consultation_visit_hold_usd is kept; otherwise nothing is kept for a booked
    visit. A reserve against returned payments is kept: for an account with at least the tier''s returned_payments_before_restriction
    returned check or ACH payments in the 12 calendar months before the handling date, the tier''s returned_payment_fee_usd
    times that number of returns is kept; for an account with exactly one such return, one returned_payment_fee_usd
    is kept; otherwise no returned-payment reserve is kept. For a patient with an active Linden membership
    billed monthly, one period''s dues_amount_usd is kept for the next dues bill; for an active membership
    billed annually whose current period started at least 11 calendar months before the handling date,
    one twelfth of its dues_amount_usd is kept; otherwise nothing is kept for dues. A reserve against
    deductible still to be applied is kept: when deductible_remaining_usd is above 0.00 and coverage_verified_date
    is no more than the tier''s coverage_reverification_days calendar days before the handling date, the
    lower of deductible_remaining_usd and deductible_reserve_cap_usd is kept; when deductible_remaining_usd
    is above 0.00 and coverage_verified_date is older than that, deductible_reserve_cap_usd is kept; otherwise
    no deductible reserve is kept. Part of the credit is kept for a scheduled virtual visit: when a Specialty
    Video Follow-Up or a Behavioral Health Video Visit is scheduled, specialty_virtual_hold_usd is kept;
    when another virtual visit type is scheduled and neither of those is, virtual_visit_hold_usd is kept;
    otherwise nothing is kept for a virtual visit. The credit refund is worked out as the credit balance
    with the plan add-back, less every amount kept (the booked-visit hold, the returned-payment reserve,
    the dues hold, the deductible reserve and the virtual-visit hold), never below 0.00, rounded to the
    nearest cent once, at the end; what is kept stays on the account as a credit. A window of calendar
    months for the credit refund ends on the handling date and reaches back that many months, a date on
    the same calendar day that many months earlier falling outside it. The payment that created the credit
    is the most recently posted payment that brought the unreversed payments applied to a charge above
    that charge''s amount, counting only charges to which no returned check or ACH payment was ever applied;
    the credit refund is issued as one refund entry against that payment and goes to that payment''s own
    method, a cash payment being refunded by check.'
  prerequisite:
  - problem: billing_ext_returned_payment_replacement
    kind: value_input
    gate: net_credit
    form: state
    policy_source: A credit is refunded only after the charge whose check or ACH payment was most recently
      returned carries a card, HSA/FSA card or cash payment posted after that return.
    condition: The billing charge referenced by the payment of the latest billing_payment_reversed entry
      whose payment_method is check or ach carries a billing_payment_posted entry with payment_method
      card, hsa_fsa_card or cash whose txn_date is after that reversal's txn_date.
    resolved_by: pay_returned_payment_replacement_5bda38e8
    effect: The replacement card payment raises paid (and with it net_credit) by the amount replaced,
      so the credit is no longer absorbed by the restored returned balances, returned-payment fees and
      late fees.
  cross_category:
  - category: payplan
    as: branch
    reads:
    - status
    - remaining_balance
    - payplan_transactions.amount
    note: An active or delinquent plan and its missed installments decide which open charges absorb the
      credit.
  - category: appointment
    as: existence
    reads:
    - status
    - variant_name
    note: A booked visit and its type decide the booked-visit hold tier.
  - category: membership
    as: branch
    reads:
    - status
    - billing_cycle
    - dues_amount_usd
    - current_period_start
    note: An active membership, its billing cycle and dues decide the dues hold.
  - category: telehealth
    as: existence
    reads:
    - status
    - variant_name
    note: A scheduled virtual visit and its type decide the virtual-visit hold tier.
  compute:
  - charges: SUM('billing_transactions','amount', event_type='billing_charge_posted')
  - reversed: SUM('billing_transactions','amount', event_type='billing_payment_reversed')
  - refunded: SUM('billing_transactions','amount', event_type='billing_refund_issued')
  - paid: SUM('billing_transactions','amount', event_type='billing_payment_posted')
  - collected: SUM('billing_transactions','amount', event_type='billing_copay_collected')
  - adjusted: SUM('billing_transactions','amount', event_type='billing_adjustment_posted')
  - net_credit: paid + collected + adjusted - charges - reversed - refunded
  - plan_active: EXISTS('payplan', status='active')
  - plan_delinquent: EXISTS('payplan', status='delinquent')
  - plan_missed_6m: XCOUNT('payplan','payplan_transactions', within_months=6, date_field='txn_date', event_type='payplan_installment_missed')
  - plan_paid_6m: XCOUNT('payplan','payplan_transactions', within_months=6, date_field='txn_date', event_type='payplan_installment_paid')
  - plan_missed_amount_6m: XSUM('payplan','payplan_transactions','amount', within_months=6, date_field='txn_date',
      event_type='payplan_installment_missed')
  - plan_active_balance: CFIELD('payplan','remaining_balance', status='active')
  - plan_delinquent_balance: CFIELD('payplan','remaining_balance', status='delinquent')
  - credit_base: net_credit + plan_active_balance if (plan_active and plan_paid_6m > 0 and plan_missed_6m
      == 0) else (net_credit + plan_delinquent_balance - plan_missed_amount_6m if (plan_delinquent and
      plan_missed_6m > 0) else net_credit)
  - booked_procedure: EXISTS('appointment', status='booked', variant_name='Advanced Imaging Appointment')
      or EXISTS('appointment', status='booked', variant_name='In-Office Procedure Visit')
  - booked_consult: EXISTS('appointment', status='booked', variant_name='Specialist Consultation')
  - visit_hold: K('procedure_visit_hold_usd') if booked_procedure else (K('consultation_visit_hold_usd')
      if booked_consult else 0)
  - returns_12m: COUNT('billing_transactions', within_months=12, date_field='txn_date', event_type='billing_payment_reversed',
      payment_method='check') + COUNT('billing_transactions', within_months=12, date_field='txn_date',
      event_type='billing_payment_reversed', payment_method='ach')
  - return_reserve: P('returned_payment_fee_usd') * returns_12m if returns_12m >= P('returned_payments_before_restriction')
      else (P('returned_payment_fee_usd') if returns_12m == 1 else 0)
  - member_monthly: EXISTS('membership', status='active', billing_cycle='monthly')
  - member_annual: EXISTS('membership', status='active', billing_cycle='annual')
  - member_dues: CFIELD('membership','dues_amount_usd', status='active')
  - member_period_start: CFIELD('membership','current_period_start', status='active')
  - dues_hold: member_dues if member_monthly else (RND(member_dues / 12, 2) if (member_annual and MONTHS(member_period_start,
      NOW) >= 11) else 0)
  - ded_remaining: F('deductible_remaining_usd')
  - verified_age: DAYS(F('coverage_verified_date'), NOW)
  - deductible_reserve: MN(ded_remaining, K('deductible_reserve_cap_usd')) if (ded_remaining > 0 and verified_age
      <= P('coverage_reverification_days')) else (K('deductible_reserve_cap_usd') if (ded_remaining >
      0 and verified_age > P('coverage_reverification_days')) else 0)
  - scheduled_specialty: EXISTS('telehealth', status='scheduled', variant_name='Specialty Video Follow-Up')
      or EXISTS('telehealth', status='scheduled', variant_name='Behavioral Health Video Visit')
  - scheduled_any: EXISTS('telehealth', status='scheduled')
  - virtual_hold: K('specialty_virtual_hold_usd') if scheduled_specialty else (K('virtual_visit_hold_usd')
      if scheduled_any else 0)
  - result: MX(0, RND(credit_base - visit_hold - return_reserve - dues_hold - deductible_reserve - virtual_hold,
      2))
