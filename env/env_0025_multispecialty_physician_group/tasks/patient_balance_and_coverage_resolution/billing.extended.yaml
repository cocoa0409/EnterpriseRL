- id: billing_ext_returned_payment_replacement
  base_policy_refs:
  - billing_payment_application
  - billing_returned_payment
  overwrite:
  - base_policy: billing_payment_application
    superseded_clause: A payment is applied to a specific encounter only when the patient names that encounter's
      encounter number.
    replaced_by: A returned-payment replacement is posted as one card payment against the charge the most
      recently returned check or ACH payment had paid, whether or not the patient names that encounter's
      encounter number.
  - base_policy: billing_payment_application
    superseded_clause: A payment is applied to open charges in the tier's payment_allocation_order (oldest
      date of service first, and among charges of the same date the lower txn_date first), one allocation
      per charge, each allocation never exceeding that charge's remaining balance.
    replaced_by: A returned-payment replacement is posted as one card payment against the charge the most
      recently returned check or ACH payment had paid, whether or not the patient names that encounter's
      encounter number.
  trigger: on_request
  subject:
  - billing_payment_posted
  computes: replacement_amount_usd
  target_tool: pay_returned_payment_replacement_5bda38e8
  params: {}
  rule: 'This policy settles the returned-payment replacement: the amount a patient pays by card, HSA/FSA
    card or cash to make good check or ACH payments the bank returned unpaid. Under the standard method
    the returned-payment replacement is the amount of the most recently returned check or ACH payment
    plus the returned-payment fee posted with that return, rounded to the nearest cent once, at the end.
    Which returned payments the replacement covers depends on the account''s return history: when the
    account has at least the tier''s returned_payments_before_restriction returned check or ACH payments
    in the 12 calendar months before the handling date, every check or ACH payment returned in those 12
    months is covered; when it has exactly one in those 12 months and at least one more in the 24 calendar
    months before the handling date, every check or ACH payment returned in those 24 months is covered;
    otherwise only the most recently returned check or ACH payment is covered. The covered returned amount
    is reduced by what has since been taken off the charge the most recently returned check or ACH payment
    had paid: by the billing_error_correction adjustments posted to that charge when there are any, otherwise
    by the hardship_adjustment adjustments posted to it when there are any, and by nothing otherwise.
    The returned-payment fees the replacement includes depend on the fees posted: when two or more returned_payment_fee
    charges were posted in the 12 calendar months before the handling date, every one of them is included;
    when exactly one was posted in those 12 months and the account holds a card on file, no fee is included
    and the fee stays on the account for the ordinary statement; otherwise the fee posted with the most
    recent return is included. Late fees join the replacement according to the return history: when the
    account has at least the tier''s returned_payments_before_restriction returned check or ACH payments
    in the 12 calendar months before the handling date and late fees were posted in those 12 months, every
    such late fee is included; when it has fewer returned check or ACH payments and late fees were posted
    in those 12 months, only the most recent late fee is included; when no late fee was posted in those
    12 months, none is included. The returned-payment replacement is the covered returned amount less
    its reduction, plus the included returned-payment fees, plus the included late fees, never below 0.00,
    rounded to the nearest cent once, at the end. A window of calendar months for the returned-payment
    replacement ends on the handling date and reaches back that many months, a date on the same calendar
    day that many months earlier falling outside it. A returned-payment replacement is posted as one card
    payment against the charge the most recently returned check or ACH payment had paid, whether or not
    the patient names that encounter''s encounter number.'
  prerequisite: []
  cross_category: []
  compute:
  - returns_12m: COUNT('billing_transactions', within_months=12, date_field='txn_date', event_type='billing_payment_reversed',
      payment_method='check') + COUNT('billing_transactions', within_months=12, date_field='txn_date',
      event_type='billing_payment_reversed', payment_method='ach')
  - returns_24m: COUNT('billing_transactions', within_months=24, date_field='txn_date', event_type='billing_payment_reversed',
      payment_method='check') + COUNT('billing_transactions', within_months=24, date_field='txn_date',
      event_type='billing_payment_reversed', payment_method='ach')
  - returned_12m: SUM('billing_transactions','amount', within_months=12, date_field='txn_date', event_type='billing_payment_reversed',
      payment_method='check') + SUM('billing_transactions','amount', within_months=12, date_field='txn_date',
      event_type='billing_payment_reversed', payment_method='ach')
  - returned_24m: SUM('billing_transactions','amount', within_months=24, date_field='txn_date', event_type='billing_payment_reversed',
      payment_method='check') + SUM('billing_transactions','amount', within_months=24, date_field='txn_date',
      event_type='billing_payment_reversed', payment_method='ach')
  - check_last_date: LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_payment_reversed',
      payment_method='check')
  - ach_last_date: LATEST('billing_transactions','txn_date', date_field='txn_date', event_type='billing_payment_reversed',
      payment_method='ach')
  - returned_last: LATEST('billing_transactions','amount', date_field='txn_date', event_type='billing_payment_reversed',
      payment_method='check') if (check_last_date or '') >= (ach_last_date or '') else LATEST('billing_transactions','amount',
      date_field='txn_date', event_type='billing_payment_reversed', payment_method='ach')
  - covered: returned_12m if returns_12m >= P('returned_payments_before_restriction') else (returned_24m
      if (returns_12m == 1 and returns_24m > 1) else (returned_last or 0))
  - returned_payment_id: LATEST('billing_transactions','applies_to_txn_id', date_field='txn_date', event_type='billing_payment_reversed',
      payment_method='check') if (check_last_date or '') >= (ach_last_date or '') else LATEST('billing_transactions','applies_to_txn_id',
      date_field='txn_date', event_type='billing_payment_reversed', payment_method='ach')
  - returned_charge_id: LATEST('billing_transactions','applies_to_txn_id', date_field='txn_date', billing_txn_id=returned_payment_id)
  - corrections: SUM('billing_transactions','amount', event_type='billing_adjustment_posted', adjustment_code='billing_error_correction',
      applies_to_txn_id=returned_charge_id)
  - hardship_taken: SUM('billing_transactions','amount', event_type='billing_adjustment_posted', adjustment_code='hardship_adjustment',
      applies_to_txn_id=returned_charge_id)
  - reduction: corrections if corrections > 0 else (hardship_taken if hardship_taken > 0 else 0)
  - fees_12m_count: COUNT('billing_transactions', within_months=12, date_field='txn_date', event_type='billing_charge_posted',
      line_category='returned_payment_fee')
  - fees_12m: SUM('billing_transactions','amount', within_months=12, date_field='txn_date', event_type='billing_charge_posted',
      line_category='returned_payment_fee')
  - fee_last: LATEST('billing_transactions','amount', date_field='txn_date', event_type='billing_charge_posted',
      line_category='returned_payment_fee')
  - fees: fees_12m if fees_12m_count >= 2 else (0 if (fees_12m_count == 1 and F('card_on_file') == True)
      else (fee_last or 0))
  - late_12m_count: COUNT('billing_transactions', within_months=12, date_field='txn_date', event_type='billing_charge_posted',
      line_category='late_fee')
  - late_12m: SUM('billing_transactions','amount', within_months=12, date_field='txn_date', event_type='billing_charge_posted',
      line_category='late_fee')
  - late_last: LATEST('billing_transactions','amount', date_field='txn_date', event_type='billing_charge_posted',
      line_category='late_fee')
  - lates: late_12m if (returns_12m >= P('returned_payments_before_restriction') and late_12m_count >
      0) else ((late_last or 0) if (returns_12m < P('returned_payments_before_restriction') and late_12m_count
      > 0) else 0)
  - result: MX(0, RND(covered - reduction + fees + lates, 2))
