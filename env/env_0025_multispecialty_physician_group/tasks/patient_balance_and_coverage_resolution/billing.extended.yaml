  factors:
  - id: paydown_method
    effect: method
    decides: paydown
    bindings:
    - returned_12m
    - paydown
    ladder:
    - when: a check or ACH payment returned in the last 12 months
      method: the whole paydown base is paid
    - when: no such return and the account opened at least good_faith_min_tenure_months months ago
      method: 'the good-faith share: the paydown base multiplied by the good-faith percentage'
    - when: otherwise
      method: the paydown base less collections_min_balance_usd plus below_minimum_margin_usd
    baseline:
