    - ded_left_off
    ladder:
    - when: deductible_remaining_usd above 0.00 and coverage_verified_date within the tier's coverage_reverification_days
      value: the part of the deductible line's open part above deductible_remaining_usd
    - when: deductible_remaining_usd above 0.00 and coverage_verified_date older than the tier's coverage_reverification_days
      value: the deductible line's whole open part
    - when: otherwise (deductible_remaining_usd is 0.00)
