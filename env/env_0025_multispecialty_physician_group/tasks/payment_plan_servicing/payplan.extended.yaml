# Extended charter: Patient Payment Plans (payment_plan_servicing difficulty).
# Path: env/env_0025_multispecialty_physician_group/tasks/payment_plan_servicing/payplan.extended.yaml
# Base section below is verbatim from blueprint/products/payplan.yaml; extended_policies appended at the end.

category: payplan
display_name: Patient Payment Plans

binding:
  holding_table: payment_plans
  event_tables: [payplan_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {remaining_balance: plan_balance}

lifecycle:
  states: [proposed, active, delinquent, defaulted, paid_off, cancelled, withdrawn]
  transitions:
    - {from: proposed, to: active, by: user, means: "The patient signs the installment agreement (and pays any down payment); only the patient can accept it."}
    - {from: proposed, to: withdrawn, by: agent, means: "The proposal is withdrawn because the patient declines it or it lapses unsigned."}
    - {from: active, to: delinquent, by: system, means: "An installment is still unpaid when its grace days end."}
    - {from: delinquent, to: active, by: agent, means: "Every missed installment is paid inside the cure window."}
    - {from: delinquent, to: defaulted, by: system, means: "Missed installments reach the default count or the cure window ends uncured; the remaining balance is released back to standard billing."}
    - {from: defaulted, to: active, by: agent, means: "The plan is reinstated inside the reinstatement window on payment of the reinstatement installments."}
    - {from: active, to: paid_off, by: system, means: "The remaining plan balance reaches zero."}
    - {from: active, to: cancelled, by: user, means: "The patient ends the plan; the remaining balance returns to standard statements."}

accounts:
  - key: plan_balance
    unit: USD
    meaning: "Balance of the billing charges (and any setup fee) enrolled in the plan that the patient still owes under it; enrollments add, payments, adjustments and releases subtract."

parameter_schema:
  term_months: "Number of monthly installments the enrolled balance is spread over; integer, months."
  min_enrolled_balance_usd: "Smallest total balance the tier may enroll; USD."
  max_enrolled_balance_usd: "Largest total balance the tier may carry, including add-ons; USD."
  min_installment_usd: "Smallest monthly installment; USD."
  down_payment_pct: "Down payment as a percentage of the initially enrolled balance, due at signing; percent, 2 decimals."
  down_payment_min_usd: "Minimum down payment where a down payment applies; USD."
  setup_fee_usd: "One-time setup fee added to the plan balance at signing; USD."
  apr_pct: "Annual percentage rate charged on the plan balance; percent, 2 decimals."
  autopay_required: "Whether installments must be paid by automatic debit; boolean."
  grace_days: "Calendar days after an installment's due date before it counts as missed; integer, days."
  missed_before_delinquent: "Missed installments that make the plan delinquent; integer, count."
  missed_before_default: "Missed installments, counted since the plan last was current, that default the plan; integer, count."
  cure_window_days: "Calendar days after the plan becomes delinquent within which paying every missed installment returns it to active; integer, days."
  reinstatement_allowed_count: "Times a defaulted plan may be reinstated over its life; integer, count."
  reinstatement_payment_installments: "Installments that must be paid to reinstate a defaulted plan; integer, count."
  reinstatement_window_days: "Calendar days after default within which reinstatement is possible; integer, days."
  add_on_allowed: "Whether new charges may be added to the plan after signing; boolean."
  add_on_max_count: "Maximum add-ons over the plan's life; integer, count."
  add_on_method: "How an add-on is absorbed: reamortize_remaining_term (same end date, higher installment) or restart_term (a fresh full term); enum string."
  minimum_months_remaining_for_add_on: "Minimum installments still to run for an add-on to be accepted; integer, count."
  min_add_on_amount_usd: "Smallest total of charges accepted as one add-on; USD."
  due_day_latest: "Latest day of the month that may be chosen as the due day (earliest is 1); integer."
  due_day_change_max_per_plan: "Maximum due-day changes over the plan's life; integer, count."
  first_due_days_after_signing: "Calendar days after signing on or before which the first installment falls (the first due date is the first chosen due day on or after signing plus this many days); integer, days."
  proposal_valid_days: "Calendar days after the proposal date within which the patient must sign; integer, days."
  requires_hardship_approval: "Whether the tier requires a current financial-hardship approval on the billing account; boolean."
  collections_balance_eligible: "Whether balances already placed with the collection agency may be enrolled (recalling the placement); boolean."
  default_skips_to_final_notice: "Whether a defaulted plan's released balance goes straight to the final notice instead of restarting the statement series; boolean."
  missed_installment_notice_days: "Calendar days after a miss within which the patient is notified; integer, days."
  default_notice_days: "Calendar days before the cure window ends at which a default warning is sent; integer, days."
  installment_due_reminder_days: "Days before each due date that a reminder (or autopay pre-debit notice) is sent; integer, days."
  early_payoff_statement_business_days: "Business days to issue a payoff statement on request; integer."
  prepayment_application: "How an extra payment is applied: shorten_term (same installment, earlier end) or reduce_installment (same end, lower installment); enum string."
  balance_reduction_method: "How an insurance payment or adjustment on an enrolled charge is absorbed: shorten_term or reduce_installment; enum string."
  pause_allowed: "Whether installments may be paused; boolean."
  pause_max_months: "Longest single pause; integer, months."
  pause_max_per_plan: "Maximum pauses over the plan's life; integer, count."
  term_extension_allowed: "Whether the term may be lengthened on request; boolean."
  term_extension_max_months: "Maximum total months the term may be lengthened; integer, months."
  portal_self_enrollment_allowed: "Whether the patient may set the plan up in the MyLinden portal without a counselor; boolean."
  counselor_review_required: "Whether a financial counselor must review the proposal before it is offered; boolean."
  enrollment_counselor_business_days: "Business days for the counselor review; 0 means no review; integer."
  autopay_retry_days: "Calendar days after a failed automatic debit before it is retried; integer, days."
  autopay_retry_count: "Retries of a failed automatic debit before the installment is left to the grace period; integer, count."
  returned_autopay_before_removal: "Returned automatic debits after which autopay is removed and the patient must pay each installment manually; integer, count."
  hardship_plan_review_months: "Calendar months after signing at which a hardship plan's terms are reviewed; 0 means no review; integer, months."
  max_plan_modifications: "Maximum modifications (installment, due day, method, term, pause) over the plan's life; integer, count."
  prior_default_lockout_months: "Calendar months after a previous plan's default during which the tier is not offered; 0 means no lockout; integer, months."

