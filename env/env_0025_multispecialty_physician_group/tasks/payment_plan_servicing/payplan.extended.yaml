events:
  - type: payplan_proposed
    target: payment_plans
    mutation: create
    meaning: "An installment plan is proposed to the patient for selected billing charges, with its tier, term, down payment, installment and due day."
    grain: "One row per proposed plan."
    fields:
      customer_id: "The patient (guarantor)."
      billing_account_id: "Financial account whose charges the plan covers."
      variant_name: "Plan tier (official tier name)."
      status: "Always proposed on creation."
      proposed_date: "Date of the proposal (handling date)."
      term_months: "Installments in the plan."
      installment_amount: "Monthly installment computed by the enrollment terms."
      down_payment_usd: "Down payment due at signing (0.00 where none)."
      due_day: "Day of the month installments fall due."
      autopay_enrolled: "Whether automatic debit is set up."
      autopay_method: "Automatic debit method, or none."
      remaining_balance: "0.00 on creation; raised by the enrollment postings."
    triggers: []
  - type: payplan_agreement_signed
    target: payment_plans
    mutation: {transition: {from: proposed, to: active}}
    meaning: "The patient signs the installment agreement."
    grain: "One row per transaction."
    fields:
      status: "Set to active."
      agreement_signed_date: "Date of signature."
      first_due_date: "Date of the first installment."
    triggers: []
  - type: payplan_proposal_withdrawn
    target: payment_plans
    mutation: {transition: {from: proposed, to: withdrawn}}
    meaning: "The proposal is declined or lapses unsigned."
    grain: "One row per transaction."
    fields:
      status: "Set to withdrawn."
      closed_date: "Date of withdrawal."
      cancel_reason: "patient_declined or proposal_expired."
      remaining_balance: "Balance enrolled on the proposal (released)."
    triggers:
      - event: payplan:payplan_balance_released
        when: {remaining_balance: {not: 0.00}}
        map: {amount: remaining_balance, txn_date: closed_date, release_reason: proposal_withdrawn}
  - type: payplan_delinquent
    target: payment_plans
    mutation: {transition: {from: active, to: delinquent}}
    meaning: "An installment went unpaid past its grace days."
    grain: "One row per transaction."
    fields:
      status: "Set to delinquent."
      delinquent_since: "Date the plan became delinquent (the day after the grace days ended)."
    triggers: []
  - type: payplan_cured
    target: payment_plans
    mutation: {transition: {from: delinquent, to: active}}
    meaning: "All missed installments are paid inside the cure window."
    grain: "One row per transaction."
    fields:
      status: "Set to active."
      delinquent_since: "Cleared to empty."
    triggers: []
  - type: payplan_defaulted
    target: payment_plans
    mutation: {transition: {from: delinquent, to: defaulted}}
    meaning: "The plan defaults; the remaining balance leaves the plan."
    grain: "One row per transaction."
    fields:
      status: "Set to defaulted."
      defaulted_date: "Date of default."
      remaining_balance: "Plan balance at default (released)."
    triggers:
      - event: payplan:payplan_balance_released
        when: {remaining_balance: {not: 0.00}}
        map: {amount: remaining_balance, txn_date: defaulted_date, release_reason: default}
  - type: payplan_reinstated
    target: payment_plans
    mutation: {transition: {from: defaulted, to: active}}
    meaning: "A defaulted plan is reinstated and its released balance re-enrolled."
    grain: "One row per transaction."
    fields:
      status: "Set to active."
      reinstated_date: "Date of reinstatement."
      reinstatement_count: "Previous count plus one."
      installment_amount: "Installment re-computed over the remaining term."
      delinquent_since: "Cleared to empty."
    triggers:
      - event: payplan:payplan_balance_enrolled
        map: {txn_date: reinstated_date, enroll_reason: reinstatement}
  - type: payplan_paid_off
    target: payment_plans
    mutation: {transition: {from: active, to: paid_off}}
    meaning: "The plan balance reaches zero."
    grain: "One row per transaction."
    fields:
      status: "Set to paid_off."
      closed_date: "Date the balance reached zero."
      cancel_reason: "Set to paid_off."
    triggers: []
  - type: payplan_cancelled
    target: payment_plans
    mutation: {transition: {from: active, to: cancelled}}
    meaning: "The patient ends the plan before it is paid off."
    grain: "One row per transaction."
    fields:
      status: "Set to cancelled."
      closed_date: "Date of cancellation."
      cancel_reason: "Set to patient_cancelled."
      remaining_balance: "Plan balance at cancellation (released)."
    triggers:
      - event: payplan:payplan_balance_released
        when: {remaining_balance: {not: 0.00}}
        map: {amount: remaining_balance, txn_date: closed_date, release_reason: patient_cancellation}
  - type: payplan_modified
    target: payment_plans
    mutation: update
    meaning: "A term of an active plan changes: due day, installment after an add-on or reduction, autopay, term extension or a pause."
    grain: "One row per transaction."
    fields:
      installment_amount: "Installment after the change."
      due_day: "Due day after the change."
      term_months: "Term after the change."
      autopay_enrolled: "Autopay after the change."
      autopay_method: "Autopay method after the change."
      modification_count: "Previous count plus one."
      due_day_change_count: "Previous count plus one when the due day changed."
      paused_through: "Last month-end of a pause, or empty."
      pause_count: "Previous count plus one when a pause starts."
      term_extension_months_used: "Total months of extension used after the change."
    triggers: []
  - type: payplan_balance_enrolled
    target: payplan_transactions
    meaning: "A billing charge (or the setup fee) is enrolled in the plan at proposal, as an add-on, or on reinstatement."
    grain: "One row per charge enrolled per enrollment reason."
    distinguish_by: [billing_txn_id, enroll_reason, txn_date]
    fields:
      txn_date: "Date of enrollment."
      billing_txn_id: "The billing charge enrolled; empty for the setup fee or a reinstatement re-enrollment of the released balance."
      amount: "Amount enrolled: the charge's remaining balance, the setup fee, or the released balance."
      enroll_reason: "initial_enrollment, add_on, setup_fee or reinstatement."
    account: plan_balance
    direction: in
    triggers: []
  - type: payplan_installment_paid
    target: payplan_transactions
    meaning: "A scheduled installment is paid (by autopay or manually)."
    grain: "One row per installment number paid."
    distinguish_by: [installment_number]
    fields:
      txn_date: "Payment date."
      amount: "Amount paid for that installment."
      installment_number: "Which installment (1 = first)."
      payment_method: "How it was paid."
      channel: "Where it was received."
      autopay: "Whether it was an automatic debit."
    account: plan_balance
    direction: out
    triggers:
      - event: billing:billing_payment_posted
        map: {txn_date: txn_date, amount: amount, payment_method: payment_plan, channel: channel}
  - type: payplan_installment_missed
    target: payplan_transactions
    meaning: "An installment is recorded as missed at the end of its grace days."
    grain: "One row per installment number missed."
    distinguish_by: [installment_number]
    fields:
      txn_date: "Date the miss is recorded."
      installment_number: "Which installment."
      amount: "Installment amount that went unpaid."
    triggers: []
  - type: payplan_extra_payment
    target: payplan_transactions
    meaning: "A payment outside the schedule: the down payment, a prepayment or a payoff."
    grain: "One row per extra payment."
    distinguish_by: [extra_kind, txn_date, amount]
    fields:
      txn_date: "Payment date."
      amount: "Amount paid."
      extra_kind: "down_payment, prepayment or payoff."
      payment_method: "How it was paid."
      channel: "Where it was received."
    account: plan_balance
    direction: out
    triggers:
      - event: billing:billing_payment_posted
        map: {txn_date: txn_date, amount: amount, payment_method: payment_method, channel: channel}
  - type: payplan_balance_adjusted
    target: payplan_transactions
    meaning: "An enrolled charge is reduced outside the plan (late insurance payment, hardship adjustment, billing correction) and the plan balance follows."
    grain: "One row per reduction of one enrolled charge per reason."
    distinguish_by: [billing_txn_id, adjustment_reason]
    fields:
      txn_date: "Date of the reduction."
      billing_txn_id: "The enrolled billing charge reduced."
      amount: "Amount of the reduction."
      adjustment_reason: "insurance_payment, hardship_adjustment or billing_correction."
    account: plan_balance
    direction: out
    triggers: []
  - type: payplan_balance_released
    target: payplan_transactions
    meaning: "The remaining plan balance leaves the plan and returns to standard billing on default, cancellation or withdrawal."
    grain: "One row per release."
    distinguish_by: [release_reason, txn_date]
    fields:
      txn_date: "Date of release."
      amount: "Balance released."
      release_reason: "default, patient_cancellation or proposal_withdrawn."
    account: plan_balance
    direction: out
    triggers: []

measures:
  - id: payplan_msr_enrolled_total
    window: "From the proposal to the handling date."
    measure: "Sum of amounts of payplan_balance_enrolled rows on the plan with enroll_reason initial_enrollment or add_on."
  - id: payplan_msr_missed_since_current
    window: "From the later of the plan's first due date and its most recent cure or reinstatement, to the handling date."
    measure: "Count of payplan_installment_missed rows on the plan in the window whose installment_number has no payplan_installment_paid row."
  - id: payplan_msr_recent_default
    window: "Rolling window of the tier's prior_default_lockout_months calendar months ending on the handling date."
    measure: "Count of the patient's other payment plans with a defaulted_date inside the window (whether or not later reinstated)."
  - id: payplan_msr_add_on_count
    window: "Life of the plan."
    measure: "Count of distinct txn_date values among payplan_balance_enrolled rows on the plan with enroll_reason add_on."

policies:
  - id: payplan_agg_multi_holding
    subject: [payplan_proposed]
    rule: >-
      A patient holds at most one open payment plan; new eligible charges are added to it as add-ons rather
      than opening a second plan. The patient holds no other payment plan in status proposed, active,
      delinquent or defaulted. A defaulted plan still counts while it can be reinstated; once its
      reinstatement window has passed it no longer blocks a new plan. Plans of family members are separate
      holdings under each patient's own profile.
    eligibility:
      - id: one_open_plan
        applies_to: [payplan_proposed]
        kind: dedup
        condition: "The patient holds no other payment plan in status proposed, active, delinquent or defaulted."
        evidence_fields: [payment_plans.customer_id, payment_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.customer_id]]
          action_bindings: {payment_plans.customer_id: customer_id}
        dedup_contract:
          table: payment_plans
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [proposed, active, delinquent, defaulted]}
          distinct_fields: []
    params: {max_per_customer: 1}

  - id: payplan_agg_default_history
    subject: [payplan_proposed]
    rule: >-
      A patient's plan history across all of the patient's plans limits which tiers may be offered: a tier
      whose prior_default_lockout_months is above 0 is not offered while payplan_msr_recent_default is 1 or
      more, even if the earlier plan was later reinstated and paid off. Tiers with no lockout remain
      available, so a patient with a recent default may still be offered the 3-Month or 6-Month
      Interest-Free Plan (within their balance ranges) or, with a current hardship approval, the Financial
      Hardship Plan.
    eligibility: []
    params:
      per_tier:
        3-Month Interest-Free Plan: {prior_default_lockout_months: "=prior_default_lockout_months"}
        6-Month Interest-Free Plan: {prior_default_lockout_months: "=prior_default_lockout_months"}
        12-Month Interest-Free Plan: {prior_default_lockout_months: "=prior_default_lockout_months"}
        18-Month Extended Plan: {prior_default_lockout_months: "=prior_default_lockout_months"}
        24-Month Extended Plan: {prior_default_lockout_months: "=prior_default_lockout_months"}
        Financial Hardship Plan: {prior_default_lockout_months: "=prior_default_lockout_months"}
    formula:
      tier_offered: prior_default_lockout_months == 0 or payplan_msr_recent_default == 0
    measures: [payplan_msr_recent_default]

  - id: payplan_enrollment_terms
    subject: [payplan_proposed]
    rule: >-
      The tier offered is one whose balance range contains the total to be enrolled
      (payplan_msr_enrolled_total, between min_enrolled_balance_usd and max_enrolled_balance_usd inclusive);
      where two tiers fit, the patient chooses. The down payment is down_payment_pct of the total, rounded to
      the cent, but not less than down_payment_min_usd where down_payment_pct is above 0.00. The installment
      is the total less the down payment divided by term_months, rounded to the cent, with the final
      installment absorbing any rounding difference; when that falls below min_installment_usd the
      installment is min_installment_usd and the plan simply ends sooner. The tier's setup_fee_usd, where
      above 0.00, is enrolled into the plan balance at signing and spread with the rest; apr_pct is 0.00 on
      every tier, so no interest ever accrues. Where autopay_required is true the proposal must carry an
      automatic debit method. The due day is any day from 1 to due_day_latest. Where
      counselor_review_required is true the proposal is prepared by a financial counselor within
      enrollment_counselor_business_days business days; where portal_self_enrollment_allowed is true the
      patient may also set it up in the portal. The Financial Hardship Plan requires, on the patient's
      billing account, a hardship approval whose hardship_approved_through is on or after the proposal date.
      A tier whose requires_hardship_approval is true is offered only on that approval.
    eligibility:
      - id: hardship_approval_current
        applies_to: [payplan_proposed]
        kind: authorization
        condition: "The Financial Hardship Plan requires, on the patient's billing account, a hardship approval whose hardship_approved_through is on or after the proposal date."
        evidence_fields: [billing_accounts.hardship_approved_pct, billing_accounts.hardship_approved_through, billing_accounts.billing_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[billing_accounts.billing_account_id]]
          action_bindings: {billing_accounts.billing_account_id: billing_account_id}
    params:
      per_tier:
        3-Month Interest-Free Plan: {term_months: "=term_months", min_enrolled_balance_usd: "=min_enrolled_balance_usd", max_enrolled_balance_usd: "=max_enrolled_balance_usd", min_installment_usd: "=min_installment_usd", down_payment_pct: "=down_payment_pct", down_payment_min_usd: "=down_payment_min_usd", setup_fee_usd: "=setup_fee_usd"}
        6-Month Interest-Free Plan: {term_months: "=term_months", min_enrolled_balance_usd: "=min_enrolled_balance_usd", max_enrolled_balance_usd: "=max_enrolled_balance_usd", min_installment_usd: "=min_installment_usd", down_payment_pct: "=down_payment_pct", down_payment_min_usd: "=down_payment_min_usd", setup_fee_usd: "=setup_fee_usd"}
        12-Month Interest-Free Plan: {term_months: "=term_months", min_enrolled_balance_usd: "=min_enrolled_balance_usd", max_enrolled_balance_usd: "=max_enrolled_balance_usd", min_installment_usd: "=min_installment_usd", down_payment_pct: "=down_payment_pct", down_payment_min_usd: "=down_payment_min_usd", setup_fee_usd: "=setup_fee_usd"}
        18-Month Extended Plan: {term_months: "=term_months", min_enrolled_balance_usd: "=min_enrolled_balance_usd", max_enrolled_balance_usd: "=max_enrolled_balance_usd", min_installment_usd: "=min_installment_usd", down_payment_pct: "=down_payment_pct", down_payment_min_usd: "=down_payment_min_usd", setup_fee_usd: "=setup_fee_usd"}
        24-Month Extended Plan: {term_months: "=term_months", min_enrolled_balance_usd: "=min_enrolled_balance_usd", max_enrolled_balance_usd: "=max_enrolled_balance_usd", min_installment_usd: "=min_installment_usd", down_payment_pct: "=down_payment_pct", down_payment_min_usd: "=down_payment_min_usd", setup_fee_usd: "=setup_fee_usd"}
        Financial Hardship Plan: {term_months: "=term_months", min_enrolled_balance_usd: "=min_enrolled_balance_usd", max_enrolled_balance_usd: "=max_enrolled_balance_usd", min_installment_usd: "=min_installment_usd", down_payment_pct: "=down_payment_pct", down_payment_min_usd: "=down_payment_min_usd", setup_fee_usd: "=setup_fee_usd"}
    formula:
      down_payment_usd: max(round(payplan_msr_enrolled_total * down_payment_pct / 100, 2), down_payment_min_usd) if down_payment_pct > 0 else 0
      installment_amount: max(min_installment_usd, round((payplan_msr_enrolled_total - down_payment_usd) / term_months, 2))
    measures: [payplan_msr_enrolled_total]

  - id: payplan_charge_eligibility
    subject: [payplan_balance_enrolled]
    rule: >-
      Only billing charges that are patient responsibility after insurance adjudication may be enrolled: a
      charge still pending with a payer, a charge under an open balance dispute, and fees posted in error are
      not enrolled. Each charge is enrolled at its remaining balance on the enrollment date. A billing charge
      is enrolled in a payment plan at most once. A charge on an account in collections may be enrolled only
      where the tier's collections_balance_eligible is true, and enrolling it recalls the placement under the
      financial account rules. Balance is enrolled only while the plan status is proposed or active. The
      plan's total enrolled (payplan_msr_enrolled_total) never exceeds max_enrolled_balance_usd. While a
      charge is enrolled in an active or delinquent plan it receives no statements, late fees, final notice or
      prompt-pay discount under the financial account rules.
    eligibility:
      - id: charge_enrolled_once
        applies_to: [payplan_balance_enrolled]
        kind: dedup
        condition: "A billing charge is enrolled in a payment plan at most once."
        evidence_fields: [payplan_transactions.billing_txn_id, payplan_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payplan_transactions.billing_txn_id]]
          action_bindings: {payplan_transactions.billing_txn_id: billing_txn_id}
        dedup_contract:
          table: payplan_transactions
          mode: separate_record
          object_bindings: {billing_txn_id: billing_txn_id}
          duplicate_filters: {event_type: [payplan_balance_enrolled]}
          distinct_fields: []
      - id: enroll_when_open
        applies_to: [payplan_balance_enrolled]
        kind: state
        condition: "Balance is enrolled only while the plan status is proposed or active."
        evidence_fields: [payment_plans.status, payment_plans.payment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.payment_plan_id]]
          action_bindings: {payment_plans.payment_plan_id: payment_plan_id}
        state_contract:
          field: payment_plans.status
          allowed: [proposed, active]
    params:
      per_tier:
        3-Month Interest-Free Plan: {collections_balance_eligible: "=collections_balance_eligible", max_enrolled_balance_usd: "=max_enrolled_balance_usd"}
        6-Month Interest-Free Plan: {collections_balance_eligible: "=collections_balance_eligible", max_enrolled_balance_usd: "=max_enrolled_balance_usd"}
        12-Month Interest-Free Plan: {collections_balance_eligible: "=collections_balance_eligible", max_enrolled_balance_usd: "=max_enrolled_balance_usd"}
        18-Month Extended Plan: {collections_balance_eligible: "=collections_balance_eligible", max_enrolled_balance_usd: "=max_enrolled_balance_usd"}
        24-Month Extended Plan: {collections_balance_eligible: "=collections_balance_eligible", max_enrolled_balance_usd: "=max_enrolled_balance_usd"}
        Financial Hardship Plan: {collections_balance_eligible: "=collections_balance_eligible", max_enrolled_balance_usd: "=max_enrolled_balance_usd"}
    measures: [payplan_msr_enrolled_total]

  - id: payplan_agreement_and_activation
    subject: [payplan_agreement_signed, payplan_proposal_withdrawn, payplan_extra_payment]
    rule: >-
      A plan takes effect only when the patient signs the installment agreement; accepting a payment
      obligation is the patient's own act and is never done for them. The patient signs no later than the
      tier's proposal validity counted from the proposal date. The validity is counted in calendar days
      starting the day after the proposal date, and a signature on the last day still qualifies. An unsigned
      proposal past its validity, or one the patient declines, is withdrawn and its enrolled charges return
      to standard statements. Any down payment is paid at signing as an extra payment of kind down_payment.
      The first due date is the first occurrence of the chosen due day that is at least
      first_due_days_after_signing calendar days after the signing date. Signing a plan that enrolls the
      past-due balance of an account in precollection returns that account to active under the financial
      account rules.
    eligibility:
      - id: signed_in_time
        applies_to: [payplan_agreement_signed]
        kind: time
        condition: "The patient signs no later than the tier's proposal validity counted from the proposal date."
        evidence_fields: [payment_plans.proposed_date, payment_plans.payment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.payment_plan_id]]
          action_bindings: {payment_plans.payment_plan_id: payment_plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the proposal date"
          anchor_source: payment_plans.proposed_date
          relation: not_after
          duration_source: variants.proposal_valid_days
          unit: calendar_days
          counting_rule: "The validity is counted in calendar days starting the day after the proposal date, and a signature on the last day still qualifies."
          boundary: inclusive
    params:
      per_tier:
        3-Month Interest-Free Plan: {proposal_valid_days: "=proposal_valid_days", first_due_days_after_signing: "=first_due_days_after_signing"}
        6-Month Interest-Free Plan: {proposal_valid_days: "=proposal_valid_days", first_due_days_after_signing: "=first_due_days_after_signing"}
        12-Month Interest-Free Plan: {proposal_valid_days: "=proposal_valid_days", first_due_days_after_signing: "=first_due_days_after_signing"}
        18-Month Extended Plan: {proposal_valid_days: "=proposal_valid_days", first_due_days_after_signing: "=first_due_days_after_signing"}
        24-Month Extended Plan: {proposal_valid_days: "=proposal_valid_days", first_due_days_after_signing: "=first_due_days_after_signing"}
        Financial Hardship Plan: {proposal_valid_days: "=proposal_valid_days", first_due_days_after_signing: "=first_due_days_after_signing"}

  - id: payplan_installments_and_delinquency
    subject: [payplan_installment_paid, payplan_installment_missed, payplan_delinquent, payplan_cured, payplan_defaulted]
    rule: >-
      Installments fall due monthly on the due day starting at first_due_date; installment n is due
      first_due_date advanced by n minus one calendar months. Autopay debits on the due date; a failed debit
      is retried autopay_retry_count times, autopay_retry_days apart, and after returned_autopay_before_removal
      returned debits autopay is removed. An installment is recorded as missed only when it is still unpaid
      at the end of the tier's grace days after the installment's due date. The due date is first_due_date
      advanced by installment_number minus one calendar months (falling back to the month's last day), the
      grace days are counted in calendar days starting the day after that due date, and the miss may be
      recorded only from the day after the last grace day. The patient is notified within
      missed_installment_notice_days. The plan becomes delinquent when payplan_msr_missed_since_current
      reaches missed_before_delinquent. Paying every missed installment inside cure_window_days of
      delinquent_since returns it to active. The plan defaults when payplan_msr_missed_since_current reaches
      missed_before_default, or when the cure window ends uncured; a warning goes out default_notice_days
      before the window ends. The cure window is counted in calendar days from the day after
      delinquent_since, and a default for an uncured window is recorded only from the day after its last day.
      A payment larger than the installment due is applied to that installment and the excess treated as a
      prepayment.
      A reminder (or, with autopay, a pre-debit notice) goes out installment_due_reminder_days days before
      each due date.
    eligibility:
      - id: grace_elapsed
        applies_to: [payplan_installment_missed]
        kind: time
        condition: "An installment is recorded as missed only when it is still unpaid at the end of the tier's grace days after the installment's due date."
        evidence_fields: [payment_plans.first_due_date, payment_plans.payment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.payment_plan_id]]
          action_bindings: {payment_plans.payment_plan_id: payment_plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the installment's due date"
          anchor_source: payment_plans.first_due_date
          relation: not_before
          duration_source: variants.grace_days
          unit: calendar_days
          counting_rule: "The due date is first_due_date advanced by installment_number minus one calendar months (falling back to the month's last day), the grace days are counted in calendar days starting the day after that due date, and the miss may be recorded only from the day after the last grace day."
          boundary: exclusive
    params:
      per_tier:
        3-Month Interest-Free Plan: {grace_days: "=grace_days", missed_before_default: "=missed_before_default", cure_window_days: "=cure_window_days"}
        6-Month Interest-Free Plan: {grace_days: "=grace_days", missed_before_default: "=missed_before_default", cure_window_days: "=cure_window_days"}
        12-Month Interest-Free Plan: {grace_days: "=grace_days", missed_before_default: "=missed_before_default", cure_window_days: "=cure_window_days"}
        18-Month Extended Plan: {grace_days: "=grace_days", missed_before_default: "=missed_before_default", cure_window_days: "=cure_window_days"}
        24-Month Extended Plan: {grace_days: "=grace_days", missed_before_default: "=missed_before_default", cure_window_days: "=cure_window_days"}
        Financial Hardship Plan: {grace_days: "=grace_days", missed_before_default: "=missed_before_default", cure_window_days: "=cure_window_days"}
    formula:
      becomes_delinquent: payplan_msr_missed_since_current >= missed_before_delinquent
      defaults: payplan_msr_missed_since_current >= missed_before_default
    measures: [payplan_msr_missed_since_current]

  - id: payplan_add_on_and_modification
    subject: [payplan_balance_enrolled, payplan_modified]
    rule: >-
      Where add_on_allowed is true, new eligible charges may be added to an active plan (never a delinquent
      one) while payplan_msr_add_on_count is below add_on_max_count, the charges added together total at
      least min_add_on_amount_usd, at least minimum_months_remaining_for_add_on installments remain, and the
      new total stays within max_enrolled_balance_usd. Under add_on_method reamortize_remaining_term the
      remaining balance is re-spread over the installments left (same end date); under restart_term it is
      spread over a fresh full term_months from the next due date. A plan is modified only while its status
      is active. Each change of installment, due day, autopay, term or pause counts toward
      max_plan_modifications, and due-day changes also toward due_day_change_max_per_plan; a change beyond
      either limit is refused. Where term_extension_allowed is true the term may be lengthened by up to
      term_extension_max_months in total, re-spreading the remaining balance; the installment may never fall
      below min_installment_usd. Removing autopay from a tier whose autopay_required is true is not allowed;
      the patient may only switch the debit method.
    eligibility:
      - id: modify_when_active
        applies_to: [payplan_modified]
        kind: state
        condition: "A plan is modified only while its status is active."
        evidence_fields: [payment_plans.status, payment_plans.payment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.payment_plan_id]]
          action_bindings: {payment_plans.payment_plan_id: payment_plan_id}
        state_contract:
          field: payment_plans.status
          allowed: [active]
    params:
      per_tier:
        3-Month Interest-Free Plan: {add_on_max_count: "=add_on_max_count", minimum_months_remaining_for_add_on: "=minimum_months_remaining_for_add_on", min_add_on_amount_usd: "=min_add_on_amount_usd", max_plan_modifications: "=max_plan_modifications", due_day_change_max_per_plan: "=due_day_change_max_per_plan"}
        6-Month Interest-Free Plan: {add_on_max_count: "=add_on_max_count", minimum_months_remaining_for_add_on: "=minimum_months_remaining_for_add_on", min_add_on_amount_usd: "=min_add_on_amount_usd", max_plan_modifications: "=max_plan_modifications", due_day_change_max_per_plan: "=due_day_change_max_per_plan"}
        12-Month Interest-Free Plan: {add_on_max_count: "=add_on_max_count", minimum_months_remaining_for_add_on: "=minimum_months_remaining_for_add_on", min_add_on_amount_usd: "=min_add_on_amount_usd", max_plan_modifications: "=max_plan_modifications", due_day_change_max_per_plan: "=due_day_change_max_per_plan"}
        18-Month Extended Plan: {add_on_max_count: "=add_on_max_count", minimum_months_remaining_for_add_on: "=minimum_months_remaining_for_add_on", min_add_on_amount_usd: "=min_add_on_amount_usd", max_plan_modifications: "=max_plan_modifications", due_day_change_max_per_plan: "=due_day_change_max_per_plan"}
        24-Month Extended Plan: {add_on_max_count: "=add_on_max_count", minimum_months_remaining_for_add_on: "=minimum_months_remaining_for_add_on", min_add_on_amount_usd: "=min_add_on_amount_usd", max_plan_modifications: "=max_plan_modifications", due_day_change_max_per_plan: "=due_day_change_max_per_plan"}
        Financial Hardship Plan: {add_on_max_count: "=add_on_max_count", minimum_months_remaining_for_add_on: "=minimum_months_remaining_for_add_on", min_add_on_amount_usd: "=min_add_on_amount_usd", max_plan_modifications: "=max_plan_modifications", due_day_change_max_per_plan: "=due_day_change_max_per_plan"}
    measures: [payplan_msr_add_on_count]

  - id: payplan_prepayment_and_reduction
    subject: [payplan_extra_payment, payplan_balance_adjusted, payplan_paid_off]
    rule: >-
      A patient may pay more than the installment, or pay the plan off, at any time with no penalty; a payoff
      statement is issued within early_payoff_statement_business_days on request. A prepayment is applied
      according to the tier's prepayment_application: shorten_term keeps the installment and ends the plan
      sooner, reduce_installment keeps the end date and lowers the installment. When an enrolled charge is
      reduced outside the plan (a late insurance payment, a hardship adjustment, a billing correction), the
      plan balance is reduced by the same amount on the same date and absorbed according to
      balance_reduction_method. An enrolled charge is reduced at most once per reason. When the remaining
      balance reaches 0.00 the plan is paid off; a payment beyond the remaining balance is applied to the
      financial account, where it becomes a credit if nothing else is owed.
    eligibility:
      - id: reduce_once_per_reason
        applies_to: [payplan_balance_adjusted]
        kind: dedup
        condition: "An enrolled charge is reduced at most once per reason."
        evidence_fields: [payplan_transactions.billing_txn_id, payplan_transactions.adjustment_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payplan_transactions.billing_txn_id]]
          action_bindings: {payplan_transactions.billing_txn_id: billing_txn_id}
        dedup_contract:
          table: payplan_transactions
          mode: separate_record
          object_bindings: {billing_txn_id: billing_txn_id}
          duplicate_filters: {event_type: [payplan_balance_adjusted]}
          distinct_fields: [adjustment_reason]
    params:
      per_tier:
        3-Month Interest-Free Plan: {prepayment_application: "=prepayment_application", balance_reduction_method: "=balance_reduction_method"}
        6-Month Interest-Free Plan: {prepayment_application: "=prepayment_application", balance_reduction_method: "=balance_reduction_method"}
        12-Month Interest-Free Plan: {prepayment_application: "=prepayment_application", balance_reduction_method: "=balance_reduction_method"}
        18-Month Extended Plan: {prepayment_application: "=prepayment_application", balance_reduction_method: "=balance_reduction_method"}
        24-Month Extended Plan: {prepayment_application: "=prepayment_application", balance_reduction_method: "=balance_reduction_method"}
        Financial Hardship Plan: {prepayment_application: "=prepayment_application", balance_reduction_method: "=balance_reduction_method"}

  - id: payplan_release_and_reinstatement
    subject: [payplan_cancelled, payplan_balance_released, payplan_reinstated]
    rule: >-
      When a plan is cancelled by the patient, withdrawn or defaulted, its remaining balance is released
      back to the financial account's standard handling: after a cancellation or withdrawal, and after a
      default where default_skips_to_final_notice is false, the released charges restart the statement
      series at 1; after a default where default_skips_to_final_notice is true, the account goes straight to
      the final notice. Cancelling is the patient's own decision. A defaulted plan may be reinstated where
      reinstatement_count is below reinstatement_allowed_count, on payment of
      reinstatement_payment_installments installments. The reinstatement is made no later than the tier's
      reinstatement window counted from the date the plan defaulted. The window is counted in calendar days
      starting the day after the default date, and a reinstatement on the last day still qualifies. On
      reinstatement the released balance is re-enrolled, the installment re-computed over the installments
      that remain of the original term, and any final notice issued because of the default is withdrawn by
      returning the account to active.
    eligibility:
      - id: reinstatement_window
        applies_to: [payplan_reinstated]
        kind: time
        condition: "The reinstatement is made no later than the tier's reinstatement window counted from the date the plan defaulted."
        evidence_fields: [payment_plans.defaulted_date, payment_plans.payment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.payment_plan_id]]
          action_bindings: {payment_plans.payment_plan_id: payment_plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date the plan defaulted"
          anchor_source: payment_plans.defaulted_date
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the default date, and a reinstatement on the last day still qualifies."
          boundary: inclusive
    params:
      per_tier:
        3-Month Interest-Free Plan: {reinstatement_allowed_count: "=reinstatement_allowed_count", reinstatement_window_days: "=reinstatement_window_days", reinstatement_payment_installments: "=reinstatement_payment_installments", default_skips_to_final_notice: "=default_skips_to_final_notice"}
        6-Month Interest-Free Plan: {reinstatement_allowed_count: "=reinstatement_allowed_count", reinstatement_window_days: "=reinstatement_window_days", reinstatement_payment_installments: "=reinstatement_payment_installments", default_skips_to_final_notice: "=default_skips_to_final_notice"}
        12-Month Interest-Free Plan: {reinstatement_allowed_count: "=reinstatement_allowed_count", reinstatement_window_days: "=reinstatement_window_days", reinstatement_payment_installments: "=reinstatement_payment_installments", default_skips_to_final_notice: "=default_skips_to_final_notice"}
        18-Month Extended Plan: {reinstatement_allowed_count: "=reinstatement_allowed_count", reinstatement_window_days: "=reinstatement_window_days", reinstatement_payment_installments: "=reinstatement_payment_installments", default_skips_to_final_notice: "=default_skips_to_final_notice"}
        24-Month Extended Plan: {reinstatement_allowed_count: "=reinstatement_allowed_count", reinstatement_window_days: "=reinstatement_window_days", reinstatement_payment_installments: "=reinstatement_payment_installments", default_skips_to_final_notice: "=default_skips_to_final_notice"}
        Financial Hardship Plan: {reinstatement_allowed_count: "=reinstatement_allowed_count", reinstatement_window_days: "=reinstatement_window_days", reinstatement_payment_installments: "=reinstatement_payment_installments", default_skips_to_final_notice: "=default_skips_to_final_notice"}

  - id: payplan_hardship_plan_terms
    subject: [payplan_modified, payplan_proposed]
    rule: >-
      The Financial Hardship Plan is available only with a current hardship approval (see
      payplan_enrollment_terms) and differs from the other tiers in three ways. Where pause_allowed is true
      the patient may pause installments for up to pause_max_months consecutive months, at most
      pause_max_per_plan times, while the plan is active and current; the paused months are added to the
      end of the term and nothing is missed during them. The plan is reviewed hardship_plan_review_months
      after signing; if the hardship approval has expired by then, the remaining balance is re-spread under
      the plan's own terms without a pause option, never moved to another tier. Its add-ons restart the term.
      A patient on any other tier who experiences hardship is not moved to the Financial Hardship Plan by a
      modification; a new plan after cancellation is required.
    eligibility: []
    params:
      per_tier:
        3-Month Interest-Free Plan: {pause_max_months: "=pause_max_months", pause_max_per_plan: "=pause_max_per_plan", hardship_plan_review_months: "=hardship_plan_review_months"}
        6-Month Interest-Free Plan: {pause_max_months: "=pause_max_months", pause_max_per_plan: "=pause_max_per_plan", hardship_plan_review_months: "=hardship_plan_review_months"}
        12-Month Interest-Free Plan: {pause_max_months: "=pause_max_months", pause_max_per_plan: "=pause_max_per_plan", hardship_plan_review_months: "=hardship_plan_review_months"}
        18-Month Extended Plan: {pause_max_months: "=pause_max_months", pause_max_per_plan: "=pause_max_per_plan", hardship_plan_review_months: "=hardship_plan_review_months"}
        24-Month Extended Plan: {pause_max_months: "=pause_max_months", pause_max_per_plan: "=pause_max_per_plan", hardship_plan_review_months: "=hardship_plan_review_months"}
        Financial Hardship Plan: {pause_max_months: "=pause_max_months", pause_max_per_plan: "=pause_max_per_plan", hardship_plan_review_months: "=hardship_plan_review_months"}

# ============================================================================
# extended_policies (payment_plan_servicing). Claimed task by task: task 0 = the three policies of the
# 24-Month Extended Plan signing tree; task 1 = the four policies of the 18-Month Extended Plan add-on tree.
# ============================================================================
extended_policies:
  - id: payplan_ext_signing_setup_fee
    base_policy_refs: [payplan_charge_eligibility, payplan_add_on_and_modification, payplan_enrollment_terms, payplan_agreement_and_activation]
    overwrite:
      - base_policy: payplan_enrollment_terms
        superseded_clause: >-
          The tier's setup_fee_usd, where above 0.00, is enrolled into the plan balance at signing and spread with the rest
        replaced_by: >-
          The setup fee entered is worked out in this order: first the scheduled setup fee is the tier's setup_fee_usd multiplied by the autopay share, the tenure share, the hardship share and the balance-size share, the four shares acting together on the tier's setup_fee_usd as one combined product; then the scheduled setup fee is turned into the fee entered by the returning-plan rule.
      - base_policy: payplan_charge_eligibility
        superseded_clause: >-
          A billing charge is enrolled in a payment plan at most once.
        replaced_by: >-
          The setup fee is not a billing charge: its entry carries no charge reference, and a plan carries at most one signing setup-fee entry, booked when the agreement is signed; any add-on fee an active plan carries later is a separate entry.
    trigger: on_request
    subject: [payplan_balance_enrolled]
    computes: amount
    target_tool: enroll_setup_fee_08ffaf93
    params:
      ach_autopay_share: 0.80
      card_autopay_share: 0.90
      long_tenure_months: 120
      long_tenure_share: 0.80
      mid_tenure_months: 60
      mid_tenure_share: 0.90
      deep_hardship_pct: 50
      deep_hardship_share: 0.60
      partial_hardship_share: 0.80
      large_balance_usd: 10000.00
      large_balance_share: 0.80
      mid_balance_usd: 5000.00
      mid_balance_share: 0.90
      returning_full_count: 12
      returning_part_share: 0.75
    rule: >-
      When the patient signs the installment agreement of a tier whose setup_fee_usd is above 0.00, the plan balance is
      charged the setup fee as one enrollment entry of reason setup_fee, booked on the signing date. The setup fee is not a
      billing charge: its entry carries no charge reference, and a plan carries at most one signing setup-fee entry, booked when the agreement is signed; any add-on fee an active plan carries later is a separate entry. The standard setup fee is the tier's setup_fee_usd, entered at that amount rounded half up to
      the cent. The autopay share of the setup fee is ach_autopay_share when the plan's automatic debit method is ach and
      the financial account shows no late fee posted less than 12 whole months before the signing date, card_autopay_share
      when the method is card or hsa_fsa_card and the account shows no such late fee, and 1 in every other case. The tenure
      share of the setup fee is long_tenure_share when the financial account was opened at least long_tenure_months whole
      months before the signing date, mid_tenure_share when it was opened at least mid_tenure_months but fewer than
      long_tenure_months whole months before, and 1 otherwise. The hardship share of the setup fee is deep_hardship_share
      when the financial account holds a hardship approval of at least deep_hardship_pct percent whose
      hardship_approved_through is on or after the signing date, partial_hardship_share when it holds an approval above
      0.00 but below deep_hardship_pct percent that is still current on the signing date, and 1 when it holds no current
      approval. The balance-size share of the setup fee is large_balance_share when the charges enrolled on the plan
      (initial enrollments and add-ons, the setup fee excluded) total at least large_balance_usd, mid_balance_share when
      they total at least mid_balance_usd but less than large_balance_usd, and 1 otherwise. How the scheduled setup fee
      becomes the fee entered follows the patient's earlier plans with the group, counted as the payments the financial
      account shows posted with payment method payment_plan: with at least returning_full_count such payments the fee
      entered is half the scheduled setup fee rounded down to the whole dollar; with at least one but fewer than
      returning_full_count it is the scheduled setup fee multiplied by returning_part_share and rounded up to the whole
      dollar; with none it is the scheduled setup fee rounded half up to the cent. The setup fee entered is worked out in
      this order: first the scheduled setup fee is the tier's setup_fee_usd multiplied by the autopay share, the tenure
      share, the hardship share and the balance-size share, the four shares acting together on the tier's setup_fee_usd as
      one combined product; then the scheduled setup fee is turned into the fee entered by the returning-plan rule. A tier
      whose setup_fee_usd is 0.00 books no setup-fee entry.
    prerequisite: []
    cross_category:
      - category: billing
        as: history
        reads: [opened_date, hardship_approved_pct, hardship_approved_through, billing_transactions.line_category, billing_transactions.payment_method, billing_transactions.txn_date]
        note: The autopay, tenure, hardship and returning-plan factors read the patient's Patient Financial Account and its ledger (late fees, plan payments).
    compute:
      - fee_standard: "P('setup_fee_usd')"
      - late_fees_12m: "XCOUNT('billing','billing_transactions', within_months=12, date_field='txn_date', event_type='billing_charge_posted', line_category='late_fee')"
      - autopay_share: "K('ach_autopay_share') if (F('autopay_method') == 'ach' and late_fees_12m == 0) else (K('card_autopay_share') if ((F('autopay_method') == 'card' or F('autopay_method') == 'hsa_fsa_card') and late_fees_12m == 0) else 1)"
      - tenure_months: "MONTHS(CFIELD('billing','opened_date'), NOW)"
      - tenure_share: "K('long_tenure_share') if tenure_months >= K('long_tenure_months') else (K('mid_tenure_share') if tenure_months >= K('mid_tenure_months') else 1)"
      - hardship_pct: "CFIELD('billing','hardship_approved_pct')"
      - hardship_through: "CFIELD('billing','hardship_approved_through')"
      - hardship_share: "K('deep_hardship_share') if (hardship_pct >= K('deep_hardship_pct') and DAYS(NOW, hardship_through) >= 0) else (K('partial_hardship_share') if (hardship_pct > 0 and hardship_pct < K('deep_hardship_pct') and DAYS(NOW, hardship_through) >= 0) else 1)"
      - enrolled_charges: "SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_balance_enrolled', enroll_reason='initial_enrollment') + SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_balance_enrolled', enroll_reason='add_on')"
      - size_share: "K('large_balance_share') if enrolled_charges >= K('large_balance_usd') else (K('mid_balance_share') if enrolled_charges >= K('mid_balance_usd') else 1)"
      - scheduled_fee: "fee_standard * autopay_share * tenure_share * hardship_share * size_share"
      - plan_payments_on_record: "XCOUNT('billing','billing_transactions', event_type='billing_payment_posted', payment_method='payment_plan')"
      - fee_entered: "(scheduled_fee / 2) // 1 if plan_payments_on_record >= K('returning_full_count') else (-((-(scheduled_fee * K('returning_part_share'))) // 1) if plan_payments_on_record >= 1 else RND(scheduled_fee, 2))"
      - result: "RND(fee_entered, 2)"
    compute_basis:
      fee_standard: "The standard setup fee is the tier's setup_fee_usd, entered at that amount rounded half up to the cent."
      late_fees_12m: "the financial account shows no late fee posted less than 12 whole months before the signing date"
      autopay_share: "The autopay share of the setup fee is ach_autopay_share when the plan's automatic debit method is ach and the financial account shows no late fee posted less than 12 whole months before the signing date, card_autopay_share when the method is card or hsa_fsa_card and the account shows no such late fee, and 1 in every other case."
      tenure_months: "when the financial account was opened at least long_tenure_months whole months before the signing date"
      tenure_share: "The tenure share of the setup fee is long_tenure_share when the financial account was opened at least long_tenure_months whole months before the signing date, mid_tenure_share when it was opened at least mid_tenure_months but fewer than long_tenure_months whole months before, and 1 otherwise."
      hardship_pct: "when the financial account holds a hardship approval of at least deep_hardship_pct percent"
      hardship_through: "whose hardship_approved_through is on or after the signing date"
      hardship_share: "The hardship share of the setup fee is deep_hardship_share when the financial account holds a hardship approval of at least deep_hardship_pct percent whose hardship_approved_through is on or after the signing date, partial_hardship_share when it holds an approval above 0.00 but below deep_hardship_pct percent that is still current on the signing date, and 1 when it holds no current approval."
      enrolled_charges: "the charges enrolled on the plan (initial enrollments and add-ons, the setup fee excluded)"
      size_share: "The balance-size share of the setup fee is large_balance_share when the charges enrolled on the plan (initial enrollments and add-ons, the setup fee excluded) total at least large_balance_usd, mid_balance_share when they total at least mid_balance_usd but less than large_balance_usd, and 1 otherwise."
      scheduled_fee: "first the scheduled setup fee is the tier's setup_fee_usd multiplied by the autopay share, the tenure share, the hardship share and the balance-size share, the four shares acting together on the tier's setup_fee_usd as one combined product"
      plan_payments_on_record: "counted as the payments the financial account shows posted with payment method payment_plan"
      fee_entered: "with at least returning_full_count such payments the fee entered is half the scheduled setup fee rounded down to the whole dollar; with at least one but fewer than returning_full_count it is the scheduled setup fee multiplied by returning_part_share and rounded up to the whole dollar; with none it is the scheduled setup fee rounded half up to the cent."
      result: "then the scheduled setup fee is turned into the fee entered by the returning-plan rule."
    factors:
      - id: autopay_share_of_setup_fee
        effect: parameter
        decides: autopay_share
        bindings: [late_fees_12m, autopay_share]
        ladder:
          - when: "the plan's automatic debit method is ach and the financial account shows no late fee posted less than 12 whole months before the signing date"
            value: "K('ach_autopay_share')"
          - when: "the automatic debit method is card or hsa_fsa_card and the account shows no such late fee"
            value: "K('card_autopay_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          autopay_share: "1"
        evidence: [history, cross_category]
        cross_difficulty: billing
      - id: tenure_share_of_setup_fee
        effect: parameter
        decides: tenure_share
        bindings: [tenure_months, tenure_share]
        ladder:
          - when: "the financial account was opened at least long_tenure_months whole months before the signing date"
            value: "K('long_tenure_share')"
          - when: "it was opened at least mid_tenure_months but fewer than long_tenure_months whole months before"
            value: "K('mid_tenure_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          tenure_share: "1"
        evidence: [date, cross_category]
        cross_difficulty: billing
      - id: hardship_share_of_setup_fee
        effect: parameter
        decides: hardship_share
        bindings: [hardship_pct, hardship_through, hardship_share]
        ladder:
          - when: "the account holds a hardship approval of at least deep_hardship_pct percent whose hardship_approved_through is on or after the signing date"
            value: "K('deep_hardship_share')"
          - when: "it holds an approval above 0.00 but below deep_hardship_pct percent that is still current on the signing date"
            value: "K('partial_hardship_share')"
          - when: "otherwise (no current approval)"
            value: "1"
        baseline:
          hardship_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: billing
      - id: balance_size_share_of_setup_fee
        effect: parameter
        decides: size_share
        bindings: [enrolled_charges, size_share]
        ladder:
          - when: "the charges enrolled on the plan total at least large_balance_usd"
            value: "K('large_balance_share')"
          - when: "they total at least mid_balance_usd but less than large_balance_usd"
            value: "K('mid_balance_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          size_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: returning_plan_rule_for_setup_fee
        effect: method
        decides: fee_entered
        bindings: [plan_payments_on_record, fee_entered]
        ladder:
          - when: "the financial account shows at least returning_full_count payments posted with payment method payment_plan"
            method: "half the scheduled setup fee, rounded down to the whole dollar"
          - when: "it shows at least one but fewer than returning_full_count such payments"
            method: "the scheduled setup fee multiplied by returning_part_share, rounded up to the whole dollar"
          - when: "otherwise (no such payment)"
            method: "the scheduled setup fee rounded half up to the cent"
        baseline:
          fee_entered: "RND(scheduled_fee, 2)"
        evidence: [history, cross_category]
        cross_difficulty: billing
    baseline:
      rule: >-
        When the patient signs the installment agreement of a tier whose setup_fee_usd is above 0.00, the plan balance is
        charged the setup fee as one enrollment entry of reason setup_fee, booked on the signing date. The standard setup
        fee is the tier's setup_fee_usd, entered at that amount rounded half up to the cent.
      params: [setup_fee_usd]
    inputs:
      history:
        - {table: payplan_transactions, aggregate: sum, field: amount, filters: {event_type: payplan_balance_enrolled, enroll_reason: initial_enrollment}}
        - {table: payplan_transactions, aggregate: sum, field: amount, filters: {event_type: payplan_balance_enrolled, enroll_reason: add_on}}
        - {category: billing, table: billing_transactions, aggregate: count, field: billing_txn_id, within_months: 12, filters: {event_type: billing_charge_posted, line_category: late_fee}}
        - {category: billing, table: billing_transactions, aggregate: count, field: billing_txn_id, filters: {event_type: billing_payment_posted, payment_method: payment_plan}}
      cross_category: [billing]

  - id: payplan_ext_encounter_charge_enrollment
    base_policy_refs: [payplan_charge_eligibility, payplan_add_on_and_modification]
    overwrite:
      - base_policy: payplan_charge_eligibility
        superseded_clause: >-
          Each charge is enrolled at its remaining balance on the enrollment date.
        replaced_by: >-
          The enrolled amount is worked out in this order: first the counted amount less the time-of-service collections, the credited payments and the adjustments the financial account shows applied to the charge, never below 0.00, giving the remaining balance; then that remaining balance multiplied by the relief share, by one minus the prompt-pay rate divided by 100, and by the late-posting share, the three acting together on the remaining balance as one product; the result is rounded half up to the cent once, at the end (an amount exactly halfway between two cents goes to the higher cent).
    trigger: state_due
    subject: [payplan_balance_enrolled]
    computes: amount
    target_tool: enroll_encounter_charge_372696d1
    params:
      estimate_cap_factor: 1.25
      relief_deep_pct: 50
      relief_deep_share: 0.50
      relief_partial_share: 0.75
      lag_long_days: 60
      lag_long_share: 0.90
      lag_mid_days: 30
      lag_mid_share: 0.95
    rule: >-
      A proposed plan carries every eligible charge of the encounters it enrolls: a charge the financial account posts for an encounter already enrolled on a proposed plan, and not yet on that plan, is enrolled on it as an initial enrollment, one charge per entry, and where several such charges stand unenrolled the most recently posted one is enrolled first. The standard enrolled amount of such a charge is its remaining balance on the enrollment date: the charge
      amount, less every time-of-service collection, payment and adjustment the financial account shows applied to it,
      never below 0.00, rounded half up to the cent. The charge amount counted toward the enrolled amount is capped by the
      estimate given before the service: on the Self-Pay Account, where the charge carries an estimate above 0.00, it is
      capped at that estimate plus the account's gfe_dispute_threshold_usd; on any other financial class, where the charge
      carries an estimate above 0.00, it is capped at the estimate multiplied by estimate_cap_factor and rounded half up to
      the cent; a charge carrying no estimate is counted at its full amount. The part of a charge above the cap stays on the
      financial account's standard statements. Which payments are credited against the counted amount follows the
      account's returned payments, counted as the payment reversals the financial account shows posted less than 12 whole
      months before the enrollment date: with at least the account's returned_payments_before_restriction reversals, check
      and ACH payments posted less than one whole month before the enrollment date are not credited and every other payment
      applied to the charge is; with at least one reversal but fewer than returned_payments_before_restriction, check
      payments posted less than one whole month before the enrollment date are not credited and every other payment applied
      to the charge is; with no reversal, every payment applied to the charge is credited. Where the financial account
      holds a hardship approval whose hardship_approved_through is on or after the charge's date of service and shows no
      hardship adjustment on the charge, the plan carries only a relief share of the remaining balance: relief_deep_share
      when the approval is at least relief_deep_pct percent, relief_partial_share when it is above 0.00 but below
      relief_deep_pct percent; in every other case the relief share is 1. The part of the remaining balance outside the
      relief share is left on the financial account for the business office to adjust under the hardship decision. A charge
      enrolled no more than the account's prompt_pay_window_days calendar days after its posting date keeps a prompt-pay
      rate when the plan pays by automatic debit: the account's full prompt_pay_discount_pct when the plan's automatic debit
      method is ach, half of it when the method is card or hsa_fsa_card; with no automatic debit, or once more than
      prompt_pay_window_days days have passed since posting, the prompt-pay rate is 0. A charge posted late keeps a
      late-posting share: lag_long_share when its posting date is at least lag_long_days calendar days after its date of
      service, lag_mid_share when it is at least lag_mid_days but fewer than lag_long_days days after, and 1 when it is
      posted fewer than lag_mid_days days after the date of service. The enrolled amount is worked out in this order: first
      the counted amount less the time-of-service collections, the credited payments and the adjustments the financial
      account shows applied to the charge, never below 0.00, giving the remaining balance; then that remaining balance
      multiplied by the relief share, by one minus the prompt-pay rate divided by 100, and by the late-posting share, the
      three acting together on the remaining balance as one product; the result is rounded half up to the cent once, at the end (an amount exactly halfway between two cents goes to the higher cent).
    prerequisite: []
    cross_category:
      - category: billing
        as: history
        reads: [variant_name, hardship_approved_pct, hardship_approved_through, gfe_dispute_threshold_usd, returned_payments_before_restriction, prompt_pay_window_days, prompt_pay_discount_pct, billing_transactions.amount, billing_transactions.estimate_amount, billing_transactions.txn_date, billing_transactions.service_date, billing_transactions.payment_method, billing_transactions.adjustment_code]
        note: The charge itself, its collections, payments and adjustments, the account's reversals and its class parameters decide the estimate cap, the payment-clearing method, the relief share and the prompt-pay rate.
    compute:
      - charge_id: "XLATEST('billing','billing_transactions','billing_txn_id', date_field='txn_date', event_type='billing_charge_posted')"
      - charge_amount: "XLATEST('billing','billing_transactions','amount', date_field='txn_date', event_type='billing_charge_posted')"
      - charge_estimate: "XLATEST('billing','billing_transactions','estimate_amount', date_field='txn_date', event_type='billing_charge_posted')"
      - charge_posted: "XLATEST('billing','billing_transactions','txn_date', date_field='txn_date', event_type='billing_charge_posted')"
      - charge_service: "XLATEST('billing','billing_transactions','service_date', date_field='txn_date', event_type='billing_charge_posted')"
      - account_class: "CFIELD('billing','variant_name')"
      - counted_amount: "MN(charge_amount, RND(charge_estimate + CPARAM('billing','gfe_dispute_threshold_usd'), 2)) if (account_class == 'Self-Pay Account' and charge_estimate > 0) else (MN(charge_amount, RND(charge_estimate * K('estimate_cap_factor'), 2)) if (account_class != 'Self-Pay Account' and charge_estimate > 0) else charge_amount)"
      - tos_collected: "XSUM('billing','billing_transactions','amount', event_type='billing_copay_collected', applies_to_txn_id=charge_id)"
      - adjustments: "XSUM('billing','billing_transactions','amount', event_type='billing_adjustment_posted', applies_to_txn_id=charge_id)"
      - all_payments: "XSUM('billing','billing_transactions','amount', event_type='billing_payment_posted', applies_to_txn_id=charge_id)"
      - recent_check_payments: "XSUM('billing','billing_transactions','amount', within_months=1, date_field='txn_date', event_type='billing_payment_posted', payment_method='check', applies_to_txn_id=charge_id)"
      - recent_ach_payments: "XSUM('billing','billing_transactions','amount', within_months=1, date_field='txn_date', event_type='billing_payment_posted', payment_method='ach', applies_to_txn_id=charge_id)"
      - reversals_12m: "XCOUNT('billing','billing_transactions', within_months=12, date_field='txn_date', event_type='billing_payment_reversed')"
      - credited_payments: "all_payments - recent_check_payments - recent_ach_payments if reversals_12m >= CPARAM('billing','returned_payments_before_restriction') else (all_payments - recent_check_payments if reversals_12m >= 1 else all_payments)"
      - remaining_balance: "MX(0, counted_amount - tos_collected - credited_payments - adjustments)"
      - hardship_pct: "CFIELD('billing','hardship_approved_pct')"
      - hardship_through: "CFIELD('billing','hardship_approved_through')"
      - hardship_adjustments_on_charge: "XCOUNT('billing','billing_transactions', event_type='billing_adjustment_posted', adjustment_code='hardship_adjustment', applies_to_txn_id=charge_id)"
      - relief_share: "K('relief_deep_share') if (hardship_pct >= K('relief_deep_pct') and DAYS(charge_service, hardship_through) >= 0 and hardship_adjustments_on_charge == 0) else (K('relief_partial_share') if (hardship_pct > 0 and hardship_pct < K('relief_deep_pct') and DAYS(charge_service, hardship_through) >= 0 and hardship_adjustments_on_charge == 0) else 1)"
      - prompt_window_days: "CPARAM('billing','prompt_pay_window_days')"
      - prompt_class_pct: "CPARAM('billing','prompt_pay_discount_pct')"
      - days_since_posting: "DAYS(charge_posted, NOW)"
      - prompt_rate: "prompt_class_pct if (days_since_posting <= prompt_window_days and F('autopay_method') == 'ach') else (prompt_class_pct / 2 if (days_since_posting <= prompt_window_days and (F('autopay_method') == 'card' or F('autopay_method') == 'hsa_fsa_card')) else 0)"
      - posting_lag_days: "DAYS(charge_service, charge_posted)"
      - late_posting_share: "K('lag_long_share') if posting_lag_days >= K('lag_long_days') else (K('lag_mid_share') if posting_lag_days >= K('lag_mid_days') else 1)"
      - result: "RND(remaining_balance * relief_share * (1 - prompt_rate / 100) * late_posting_share + 0.000001, 2)"
    compute_basis:
      charge_id: "where several such charges stand unenrolled the most recently posted one is enrolled first"
      charge_amount: "the charge amount, less every time-of-service collection, payment and adjustment the financial account shows applied to it"
      charge_estimate: "The charge amount counted toward the enrolled amount is capped by the estimate given before the service"
      charge_posted: "A charge enrolled no more than the account's prompt_pay_window_days calendar days after its posting date"
      charge_service: "whose hardship_approved_through is on or after the charge's date of service"
      account_class: "on the Self-Pay Account, where the charge carries an estimate above 0.00"
      counted_amount: "The charge amount counted toward the enrolled amount is capped by the estimate given before the service: on the Self-Pay Account, where the charge carries an estimate above 0.00, it is capped at that estimate plus the account's gfe_dispute_threshold_usd; on any other financial class, where the charge carries an estimate above 0.00, it is capped at the estimate multiplied by estimate_cap_factor and rounded half up to the cent; a charge carrying no estimate is counted at its full amount."
      tos_collected: "less every time-of-service collection, payment and adjustment the financial account shows applied to it"
      adjustments: "less every time-of-service collection, payment and adjustment the financial account shows applied to it"
      all_payments: "with no reversal, every payment applied to the charge is credited."
      recent_check_payments: "check payments posted less than one whole month before the enrollment date are not credited"
      recent_ach_payments: "check and ACH payments posted less than one whole month before the enrollment date are not credited"
      reversals_12m: "counted as the payment reversals the financial account shows posted less than 12 whole months before the enrollment date"
      credited_payments: "with at least the account's returned_payments_before_restriction reversals, check and ACH payments posted less than one whole month before the enrollment date are not credited and every other payment applied to the charge is; with at least one reversal but fewer than returned_payments_before_restriction, check payments posted less than one whole month before the enrollment date are not credited and every other payment applied to the charge is; with no reversal, every payment applied to the charge is credited."
      remaining_balance: "first the counted amount less the time-of-service collections, the credited payments and the adjustments the financial account shows applied to the charge, never below 0.00, giving the remaining balance"
      hardship_pct: "relief_deep_share when the approval is at least relief_deep_pct percent"
      hardship_through: "Where the financial account holds a hardship approval whose hardship_approved_through is on or after the charge's date of service and shows no hardship adjustment on the charge"
      hardship_adjustments_on_charge: "and shows no hardship adjustment on the charge"
      relief_share: "the plan carries only a relief share of the remaining balance: relief_deep_share when the approval is at least relief_deep_pct percent, relief_partial_share when it is above 0.00 but below relief_deep_pct percent; in every other case the relief share is 1."
      prompt_window_days: "A charge enrolled no more than the account's prompt_pay_window_days calendar days after its posting date keeps a prompt-pay rate when the plan pays by automatic debit"
      prompt_class_pct: "the account's full prompt_pay_discount_pct when the plan's automatic debit method is ach"
      days_since_posting: "no more than the account's prompt_pay_window_days calendar days after its posting date"
      prompt_rate: "the account's full prompt_pay_discount_pct when the plan's automatic debit method is ach, half of it when the method is card or hsa_fsa_card; with no automatic debit, or once more than prompt_pay_window_days days have passed since posting, the prompt-pay rate is 0."
      posting_lag_days: "when its posting date is at least lag_long_days calendar days after its date of service"
      late_posting_share: "A charge posted late keeps a late-posting share: lag_long_share when its posting date is at least lag_long_days calendar days after its date of service, lag_mid_share when it is at least lag_mid_days but fewer than lag_long_days days after, and 1 when it is posted fewer than lag_mid_days days after the date of service."
      result: "then that remaining balance multiplied by the relief share, by one minus the prompt-pay rate divided by 100, and by the late-posting share, the three acting together on the remaining balance as one product; the result is rounded half up to the cent once, at the end (an amount exactly halfway between two cents goes to the higher cent)."
    factors:
      - id: estimate_cap_on_counted_amount
        effect: parameter
        decides: counted_amount
        bindings: [account_class, counted_amount]
        ladder:
          - when: "the account is the Self-Pay Account and the charge carries an estimate above 0.00"
            value: "the estimate plus CPARAM('billing','gfe_dispute_threshold_usd')"
          - when: "the account is any other financial class and the charge carries an estimate above 0.00"
            value: "the estimate multiplied by K('estimate_cap_factor')"
          - when: "otherwise (no estimate)"
            value: "no cap: the full charge amount"
        baseline:
          counted_amount: "charge_amount"
        evidence: [cross_category, history]
        cross_difficulty: billing
      - id: payment_clearing_method
        effect: method
        decides: credited_payments
        bindings: [recent_check_payments, recent_ach_payments, reversals_12m, credited_payments]
        ladder:
          - when: "the account shows at least returned_payments_before_restriction payment reversals in the 12 whole months before the enrollment date"
            method: "credit every payment except check and ACH payments posted less than one whole month before the enrollment date"
          - when: "it shows at least one but fewer than returned_payments_before_restriction such reversals"
            method: "credit every payment except check payments posted less than one whole month before the enrollment date"
          - when: "otherwise (no reversal)"
            method: "credit every payment applied to the charge"
        baseline:
          credited_payments: "all_payments"
        evidence: [history, cross_category]
        cross_difficulty: billing
      - id: hardship_relief_share_at_enrollment
        effect: parameter
        decides: relief_share
        bindings: [hardship_pct, hardship_through, hardship_adjustments_on_charge, relief_share]
        ladder:
          - when: "the approval is at least relief_deep_pct percent, covers the charge's date of service, and no hardship adjustment shows on the charge"
            value: "K('relief_deep_share')"
          - when: "the approval is above 0.00 but below relief_deep_pct percent, covers the date of service, and no hardship adjustment shows on the charge"
            value: "K('relief_partial_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          relief_share: "1"
        evidence: [cross_category, date, history]
        cross_difficulty: billing
      - id: prompt_pay_rate_at_enrollment
        effect: parameter
        decides: prompt_rate
        bindings: [prompt_window_days, prompt_class_pct, days_since_posting, prompt_rate]
        ladder:
          - when: "the charge is enrolled no more than prompt_pay_window_days days after posting and the plan's automatic debit method is ach"
            value: "CPARAM('billing','prompt_pay_discount_pct')"
          - when: "the charge is enrolled within that window and the automatic debit method is card or hsa_fsa_card"
            value: "half of CPARAM('billing','prompt_pay_discount_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          prompt_rate: "0"
        evidence: [date, cross_category]
        cross_difficulty: billing
      - id: late_posting_share_at_enrollment
        effect: parameter
        decides: late_posting_share
        bindings: [posting_lag_days, late_posting_share]
        ladder:
          - when: "the charge was posted at least lag_long_days calendar days after its date of service"
            value: "K('lag_long_share')"
          - when: "it was posted at least lag_mid_days but fewer than lag_long_days days after"
            value: "K('lag_mid_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          late_posting_share: "1"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard enrolled amount of such a charge is its remaining balance on the enrollment date: the charge amount, less every
        time-of-service collection, payment and adjustment the financial account shows applied to it, never below 0.00,
        rounded half up to the cent.
      params: []
    inputs:
      history:
        - {category: billing, table: billing_transactions, aggregate: latest, field: amount, filters: {event_type: billing_charge_posted}}
        - {category: billing, table: billing_transactions, aggregate: sum, field: amount, filters: {event_type: billing_payment_posted}}
        - {category: billing, table: billing_transactions, aggregate: sum, field: amount, filters: {event_type: billing_copay_collected}}
        - {category: billing, table: billing_transactions, aggregate: sum, field: amount, filters: {event_type: billing_adjustment_posted}}
        - {category: billing, table: billing_transactions, aggregate: count, field: billing_txn_id, within_months: 12, filters: {event_type: billing_payment_reversed}}
      cross_category: [billing]

  - id: payplan_ext_signing_installment
    base_policy_refs: [payplan_agreement_and_activation, payplan_enrollment_terms]
    overwrite:
      - base_policy: payplan_enrollment_terms
        superseded_clause: >-
          The down payment is down_payment_pct of the total, rounded to the cent, but not less than down_payment_min_usd where down_payment_pct is above 0.00.
        replaced_by: >-
          The down payment at signing is 0.00 when the financial account holds a hardship approval above 0.00 whose hardship_approved_through is on or after the signing date and shows no late fee posted less than 12 whole months before the signing date; it is half of the tier's down_payment_pct of the enrolled charges, rounded half up to the cent and with no minimum, when the account holds no hardship approval (an approved percentage of 0.00) and shows no such late fee; in every other case it is the standard down payment.
      - base_policy: payplan_enrollment_terms
        superseded_clause: >-
          The installment is the total less the down payment divided by term_months, rounded to the cent, with the final installment absorbing any rounding difference; when that falls below min_installment_usd the installment is min_installment_usd and the plan simply ends sooner.
        replaced_by: >-
          The signed installment is worked out in this order: first the level installment, then the first-phase installment taken from it, then the autopay credit and the returning-plan credit subtracted from the first-phase installment; the result is never below the tier's min_installment_usd and is rounded half up to the cent.
    trigger: on_request
    subject: [payplan_agreement_signed]
    computes: installment_amount
    target_tool: sign_installment_agreement_b4bb7ade
    params:
      self_pay_first_phase_share: 0.80
      deductible_first_phase_share: 0.90
      autopay_ach_credit_usd: 3.00
      autopay_card_credit_usd: 1.50
      returning_full_count: 12
      returning_credit_full_usd: 4.00
      returning_credit_part_usd: 2.00
    rule: >-
      The installment written into the agreement the patient signs is worked out afresh at signing, on the plan balance
      standing on the signing date. The signed installment is fixed only after the plan balance carries the setup-fee entry
      the tier owes at signing. The signed installment is not fixed until the plan carries an enrollment entry for every
      charge the financial account posted for an encounter already enrolled on it. The plan balance at signing is every
      amount enrolled on the plan less every reduction and every payment booked on it. The standard down payment is the
      tier's down_payment_pct of the charges enrolled on the plan (initial enrollments and add-ons, the setup fee excluded),
      rounded half up to the cent, but not less than the tier's down_payment_min_usd. The standard signed installment is the
      plan balance at signing less the standard down payment, divided by the tier's term_months and rounded half up to the
      cent, never below the tier's min_installment_usd. The down payment at signing is 0.00 when the financial account
      holds a hardship approval above 0.00 whose hardship_approved_through is on or after the signing date and shows no
      late fee posted less than 12 whole months before the signing date; it is half of the tier's down_payment_pct of the
      enrolled charges, rounded half up to the cent and with no minimum, when the account holds no hardship approval (an
      approved percentage of 0.00) and shows no such late fee; in every other case it is the standard down payment. The
      level installment is the plan balance at signing less the down payment at signing, divided by the tier's term_months
      and rounded half up to the cent. The first-phase installment follows the financial class of the account: on the
      Self-Pay Account it is the level installment multiplied by self_pay_first_phase_share and rounded down to the whole
      dollar; on the High-Deductible Health Plan Account and the Commercial PPO/POS Account it is the level installment
      multiplied by deductible_first_phase_share and rounded down to the whole dollar; on every other class it is the level
      installment itself. The installments of the first phase carry that amount for the first twelve months and the later
      installments absorb the difference, the final installment absorbing any remainder. The autopay credit on the signed
      installment is autopay_ach_credit_usd when the plan's automatic debit method is ach and the financial account's
      statements are delivered paperless, autopay_card_credit_usd when the method is card or hsa_fsa_card and statements
      are delivered paperless, and 0.00 in every other case. The returning-plan credit on the signed installment is
      returning_credit_full_usd when the financial account shows at least returning_full_count payments posted with
      payment method payment_plan, returning_credit_part_usd when it shows at least one but fewer than
      returning_full_count, and 0.00 when it shows none. The signed installment is worked out in this order: first the level
      installment, then the first-phase installment taken from it, then the autopay credit and the returning-plan credit
      subtracted from the first-phase installment; the result is never below the tier's min_installment_usd and is rounded
      half up to the cent. Any down payment above 0.00 is paid at signing as an extra payment of kind down_payment.
    prerequisite:
      - problem: payplan_ext_signing_setup_fee
        kind: value_input
        gate: plan_balance
        form: state
        policy_source: >-
          The signed installment is fixed only after the plan balance carries the setup-fee entry the tier owes at signing.
        condition: >-
          The plan's ledger carries a payplan_balance_enrolled entry with enroll_reason setup_fee whenever the tier's
          setup_fee_usd is above 0.00, so the plan balance read at signing includes the setup fee.
        resolved_by: enroll_setup_fee_08ffaf93
        effect: >-
          plan_balance rises by the setup fee entered (the amount the setup-fee policy computes), and the level installment
          and every figure derived from it are worked out on that larger balance.
      - problem: payplan_ext_encounter_charge_enrollment
        kind: value_input
        gate: plan_balance
        form: state
        policy_source: >-
          The signed installment is not fixed until the plan carries an enrollment entry for every charge the financial account posted for an encounter already enrolled on it.
        condition: >-
          Every billing_charge_posted row whose encounter_number matches an encounter already enrolled on the proposed plan
          has a payplan_balance_enrolled entry on the plan pointing at it.
        resolved_by: enroll_encounter_charge_372696d1
        effect: >-
          plan_balance rises by the enrolled amount of the late-posted encounter charge (the amount the encounter-charge
          enrollment policy computes), changing the level installment worked out at signing.
    cross_category:
      - category: billing
        as: branch
        reads: [variant_name, hardship_approved_pct, hardship_approved_through, statement_delivery, billing_transactions.line_category, billing_transactions.payment_method]
        note: The down-payment, first-phase, autopay-credit and returning-plan factors read the Patient Financial Account (class, hardship approval, statement delivery) and its ledger (late fees, plan payments).
    compute:
      - enrolled_all: "SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_balance_enrolled')"
      - enrolled_charges: "SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_balance_enrolled', enroll_reason='initial_enrollment') + SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_balance_enrolled', enroll_reason='add_on')"
      - reductions: "SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_balance_adjusted')"
      - payments: "SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_installment_paid') + SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_extra_payment')"
      - plan_balance: "enrolled_all - reductions - payments"
      - hardship_pct: "CFIELD('billing','hardship_approved_pct')"
      - hardship_through: "CFIELD('billing','hardship_approved_through')"
      - late_fees_12m: "XCOUNT('billing','billing_transactions', within_months=12, date_field='txn_date', event_type='billing_charge_posted', line_category='late_fee')"
      - down_payment: "0 if (hardship_pct > 0 and DAYS(NOW, hardship_through) >= 0 and late_fees_12m == 0) else (RND(enrolled_charges * P('down_payment_pct') / 2 / 100, 2) if (hardship_pct == 0 and late_fees_12m == 0) else MX(RND(enrolled_charges * P('down_payment_pct') / 100, 2), P('down_payment_min_usd')))"
      - level_installment: "RND((plan_balance - down_payment) / P('term_months'), 2)"
      - account_class: "CFIELD('billing','variant_name')"
      - first_phase: "(level_installment * K('self_pay_first_phase_share')) // 1 if account_class == 'Self-Pay Account' else ((level_installment * K('deductible_first_phase_share')) // 1 if (account_class == 'High-Deductible Health Plan Account' or account_class == 'Commercial PPO/POS Account') else level_installment)"
      - statement_delivery: "CFIELD('billing','statement_delivery')"
      - autopay_credit: "K('autopay_ach_credit_usd') if (F('autopay_method') == 'ach' and statement_delivery == 'paperless') else (K('autopay_card_credit_usd') if ((F('autopay_method') == 'card' or F('autopay_method') == 'hsa_fsa_card') and statement_delivery == 'paperless') else 0)"
      - plan_payments_on_record: "XCOUNT('billing','billing_transactions', event_type='billing_payment_posted', payment_method='payment_plan')"
      - returning_credit: "K('returning_credit_full_usd') if plan_payments_on_record >= K('returning_full_count') else (K('returning_credit_part_usd') if plan_payments_on_record >= 1 else 0)"
      - result: "RND(MX(P('min_installment_usd'), first_phase - autopay_credit - returning_credit), 2)"
    compute_basis:
      enrolled_all: "The plan balance at signing is every amount enrolled on the plan less every reduction and every payment booked on it."
      enrolled_charges: "the charges enrolled on the plan (initial enrollments and add-ons, the setup fee excluded)"
      reductions: "less every reduction and every payment booked on it"
      payments: "less every reduction and every payment booked on it"
      plan_balance: "The plan balance at signing is every amount enrolled on the plan less every reduction and every payment booked on it."
      hardship_pct: "when the financial account holds a hardship approval above 0.00"
      hardship_through: "whose hardship_approved_through is on or after the signing date"
      late_fees_12m: "shows no late fee posted less than 12 whole months before the signing date"
      down_payment: "The down payment at signing is 0.00 when the financial account holds a hardship approval above 0.00 whose hardship_approved_through is on or after the signing date and shows no late fee posted less than 12 whole months before the signing date; it is half of the tier's down_payment_pct of the enrolled charges, rounded half up to the cent and with no minimum, when the account holds no hardship approval (an approved percentage of 0.00) and shows no such late fee; in every other case it is the standard down payment."
      level_installment: "The level installment is the plan balance at signing less the down payment at signing, divided by the tier's term_months and rounded half up to the cent."
      account_class: "The first-phase installment follows the financial class of the account"
      first_phase: "on the Self-Pay Account it is the level installment multiplied by self_pay_first_phase_share and rounded down to the whole dollar; on the High-Deductible Health Plan Account and the Commercial PPO/POS Account it is the level installment multiplied by deductible_first_phase_share and rounded down to the whole dollar; on every other class it is the level installment itself."
      statement_delivery: "and the financial account's statements are delivered paperless"
      autopay_credit: "The autopay credit on the signed installment is autopay_ach_credit_usd when the plan's automatic debit method is ach and the financial account's statements are delivered paperless, autopay_card_credit_usd when the method is card or hsa_fsa_card and statements are delivered paperless, and 0.00 in every other case."
      plan_payments_on_record: "when the financial account shows at least returning_full_count payments posted with payment method payment_plan"
      returning_credit: "The returning-plan credit on the signed installment is returning_credit_full_usd when the financial account shows at least returning_full_count payments posted with payment method payment_plan, returning_credit_part_usd when it shows at least one but fewer than returning_full_count, and 0.00 when it shows none."
      result: "The signed installment is worked out in this order: first the level installment, then the first-phase installment taken from it, then the autopay credit and the returning-plan credit subtracted from the first-phase installment; the result is never below the tier's min_installment_usd and is rounded half up to the cent."
    factors:
      - id: down_payment_at_signing
        effect: parameter
        decides: down_payment
        bindings: [hardship_pct, hardship_through, late_fees_12m, down_payment]
        ladder:
          - when: "the account holds a hardship approval above 0.00 current on the signing date and shows no late fee posted less than 12 whole months before it"
            value: "0.00"
          - when: "the account holds no hardship approval (0.00 approved) and shows no such late fee"
            value: "half of P('down_payment_pct') of the enrolled charges, no minimum"
          - when: "otherwise"
            value: "P('down_payment_pct') of the enrolled charges, not less than P('down_payment_min_usd')"
        baseline:
          down_payment: "MX(RND(enrolled_charges * P('down_payment_pct') / 100, 2), P('down_payment_min_usd'))"
        evidence: [cross_category, history, date]
        cross_difficulty: billing
      - id: first_phase_of_signed_installment
        effect: method
        decides: first_phase
        bindings: [account_class, first_phase]
        ladder:
          - when: "the account is the Self-Pay Account"
            method: "the level installment multiplied by self_pay_first_phase_share, rounded down to the whole dollar"
          - when: "the account is the High-Deductible Health Plan Account or the Commercial PPO/POS Account"
            method: "the level installment multiplied by deductible_first_phase_share, rounded down to the whole dollar"
          - when: "otherwise"
            method: "the level installment itself"
        baseline:
          first_phase: "level_installment"
        evidence: [cross_category]
        cross_difficulty: billing
      - id: autopay_credit_on_signed_installment
        effect: parameter
        decides: autopay_credit
        bindings: [statement_delivery, autopay_credit]
        ladder:
          - when: "the plan's automatic debit method is ach and the account's statements are delivered paperless"
            value: "K('autopay_ach_credit_usd')"
          - when: "the method is card or hsa_fsa_card and statements are delivered paperless"
            value: "K('autopay_card_credit_usd')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          autopay_credit: "0"
        evidence: [cross_category]
        cross_difficulty: billing
      - id: returning_plan_credit_on_signed_installment
        effect: parameter
        decides: returning_credit
        bindings: [plan_payments_on_record, returning_credit]
        ladder:
          - when: "the financial account shows at least returning_full_count payments posted with payment method payment_plan"
            value: "K('returning_credit_full_usd')"
          - when: "it shows at least one but fewer than returning_full_count such payments"
            value: "K('returning_credit_part_usd')"
          - when: "otherwise (none)"
            value: "0.00"
        baseline:
          returning_credit: "0"
        evidence: [history, cross_category]
        cross_difficulty: billing
    baseline:
      rule: >-
        The installment written into the agreement the patient signs is worked out afresh at signing, on the plan balance
        standing on the signing date. The plan balance at signing is every amount enrolled on the plan less every reduction
        and every payment booked on it. The standard down payment is the tier's down_payment_pct of the charges enrolled on
        the plan (initial enrollments and add-ons, the setup fee excluded), rounded half up to the cent, but not less than the
        tier's down_payment_min_usd. The standard signed installment is the plan balance at signing less the standard down
        payment, divided by the tier's term_months and rounded half up to the cent, never below the tier's
        min_installment_usd.
      params: [down_payment_pct, down_payment_min_usd, term_months, min_installment_usd]
    inputs:
      history:
        - {table: payplan_transactions, aggregate: sum, field: amount, filters: {event_type: payplan_balance_enrolled}}
        - {table: payplan_transactions, aggregate: sum, field: amount, filters: {event_type: payplan_balance_adjusted}}
        - {category: billing, table: billing_transactions, aggregate: count, field: billing_txn_id, within_months: 12, filters: {event_type: billing_charge_posted, line_category: late_fee}}
        - {category: billing, table: billing_transactions, aggregate: count, field: billing_txn_id, filters: {event_type: billing_payment_posted, payment_method: payment_plan}}
      cross_category: [billing]

  - id: payplan_ext_add_on_charge_amount
    base_policy_refs: [payplan_charge_eligibility, payplan_add_on_and_modification]
    overwrite:
      - base_policy: payplan_charge_eligibility
        superseded_clause: >-
          Each charge is enrolled at its remaining balance on the enrollment date.
        replaced_by: >-
          The add-on amount is worked out in this order: first the remaining balance, then the counted amount after the over-estimate share, then that counted amount multiplied by the plan-standing share, by the deductible-exposure share and by one minus the add-on prompt-pay rate divided by 100, the three acting together on the counted amount as one product; the product is rounded once, by the tenure rounding.
    trigger: state_due
    subject: [payplan_balance_enrolled]
    computes: amount
    target_tool: enroll_add_on_charge_102110ed
    params:
      over_estimate_share_high: 0.50
      over_estimate_share_other: 0.75
      standing_min_paid: 6
      good_standing_share: 0.97
      fair_standing_share: 0.985
      deductible_high_usd: 1000.00
      high_deductible_share: 0.96
      partial_deductible_share: 0.985
      long_tenure_months: 120
      mid_tenure_months: 60
    rule: >-
      Where add_on_allowed is true, an active plan carries every eligible charge of the encounters enrolled on it: a charge the financial account posts for an encounter the plan enrolled at its proposal, and not yet on the plan, is added to it as an add-on, one charge per entry; the charge added is the most recently posted charge of that encounter, the encounter being the one whose charge the plan most recently enrolled at its proposal. The standard add-on amount of a charge is its remaining balance on the enrollment date: the charge amount less every
      time-of-service collection, payment and adjustment the financial account shows applied to it, never below 0.00,
      rounded half up to the cent. Where the charge amount is above the estimate given before the service, only an
      over-estimate share of the part above the estimate is added: over_estimate_share_high on the High-Deductible Health
      Plan Account and the Self-Pay Account, over_estimate_share_other on any other financial class; where the charge
      amount is not above its estimate, or it carries no estimate, the whole remaining balance is counted. The part left out
      stays on the financial account's standard statements. The plan-standing share of the add-on is good_standing_share
      when the plan shows at least standing_min_paid installments paid and no missed installment, every installment paid on
      it was paid by automatic debit, and the financial account shows no late fee posted less than 12 whole months before
      the enrollment date; it is fair_standing_share when the plan shows at least standing_min_paid installments paid and no
      missed installment, at least one installment paid on it was paid other than by automatic debit, and the account
      shows no such late fee; it is 1 in every other case. The
      deductible-exposure share of the add-on is high_deductible_share when the financial account's
      deductible_remaining_usd is at least deductible_high_usd, partial_deductible_share when it is above 0.00 but below
      deductible_high_usd, and 1 when it is 0.00. The add-on prompt-pay rate is the account's full
      prompt_pay_discount_pct when the charge is added no more than prompt_pay_window_days calendar days after its posting
      date and the account keeps a card on file, half of it when the charge is added within that window and the account
      keeps no card on file, and 0 once more than prompt_pay_window_days days have passed since posting. How the add-on
      amount is rounded follows how long the financial account has been open: opened at least long_tenure_months whole
      months before the enrollment date, it is rounded down to the whole dollar; opened at least mid_tenure_months but
      fewer than long_tenure_months whole months before, it is rounded down to the half dollar; otherwise it is rounded half
      up to the cent. The add-on amount is worked out in this order: first the remaining balance, then the counted amount
      after the over-estimate share, then that counted amount multiplied by the plan-standing share, by the
      deductible-exposure share and by one minus the add-on prompt-pay rate divided by 100, the three acting together on
      the counted amount as one product; the product is rounded once, by the tenure rounding.
    prerequisite: []
    cross_category:
      - category: billing
        as: history
        reads: [billing_transactions.encounter_number, variant_name, deductible_remaining_usd, card_on_file, opened_date, prompt_pay_window_days, prompt_pay_discount_pct, billing_transactions.amount, billing_transactions.estimate_amount, billing_transactions.txn_date, billing_transactions.line_category]
        note: The charge and the entries applied to it, the account's class, deductible, card on file, tenure and late fees decide the over-estimate share, the standing share, the deductible share, the prompt-pay rate and the rounding.
    compute:
      - enrolled_encounter: "XLATEST('billing','billing_transactions','encounter_number', date_field='txn_date', event_type='billing_charge_posted', billing_txn_id=LATEST('payplan_transactions','billing_txn_id', date_field='txn_date', event_type='payplan_balance_enrolled', enroll_reason='initial_enrollment'))"
      - charge_id: "XLATEST('billing','billing_transactions','billing_txn_id', date_field='txn_date', event_type='billing_charge_posted', encounter_number=enrolled_encounter)"
      - charge_amount: "XLATEST('billing','billing_transactions','amount', date_field='txn_date', event_type='billing_charge_posted', encounter_number=enrolled_encounter)"
      - charge_estimate: "XLATEST('billing','billing_transactions','estimate_amount', date_field='txn_date', event_type='billing_charge_posted', encounter_number=enrolled_encounter)"
      - charge_posted: "XLATEST('billing','billing_transactions','txn_date', date_field='txn_date', event_type='billing_charge_posted', encounter_number=enrolled_encounter)"
      - collected: "XSUM('billing','billing_transactions','amount', event_type='billing_copay_collected', applies_to_txn_id=charge_id)"
      - paid: "XSUM('billing','billing_transactions','amount', event_type='billing_payment_posted', applies_to_txn_id=charge_id)"
      - adjusted: "XSUM('billing','billing_transactions','amount', event_type='billing_adjustment_posted', applies_to_txn_id=charge_id)"
      - remaining_balance: "MX(0, charge_amount - collected - paid - adjusted)"
      - account_class: "CFIELD('billing','variant_name')"
      - counted_amount: "remaining_balance - (1 - K('over_estimate_share_high')) * MX(0, charge_amount - charge_estimate) if ((account_class == 'High-Deductible Health Plan Account' or account_class == 'Self-Pay Account') and charge_estimate > 0) else (remaining_balance - (1 - K('over_estimate_share_other')) * MX(0, charge_amount - charge_estimate) if (account_class != 'High-Deductible Health Plan Account' and account_class != 'Self-Pay Account' and charge_estimate > 0) else remaining_balance)"
      - missed_installments: "COUNT('payplan_transactions', date_field='txn_date', event_type='payplan_installment_missed')"
      - installments_by_autopay: "COUNT('payplan_transactions', date_field='txn_date', event_type='payplan_installment_paid', autopay=True)"
      - installments_paid: "COUNT('payplan_transactions', date_field='txn_date', event_type='payplan_installment_paid')"
      - late_fees_12m: "XCOUNT('billing','billing_transactions', within_months=12, date_field='txn_date', event_type='billing_charge_posted', line_category='late_fee')"
      - standing_share: "K('good_standing_share') if (installments_paid >= K('standing_min_paid') and missed_installments == 0 and installments_by_autopay == installments_paid and late_fees_12m == 0) else (K('fair_standing_share') if (installments_paid >= K('standing_min_paid') and missed_installments == 0 and installments_by_autopay < installments_paid and late_fees_12m == 0) else 1)"
      - deductible_remaining: "CFIELD('billing','deductible_remaining_usd')"
      - deductible_share: "K('high_deductible_share') if deductible_remaining >= K('deductible_high_usd') else (K('partial_deductible_share') if deductible_remaining > 0 else 1)"
      - card_on_file: "CFIELD('billing','card_on_file')"
      - days_since_posting: "DAYS(charge_posted, NOW)"
      - addon_prompt_rate: "CPARAM('billing','prompt_pay_discount_pct') if (days_since_posting <= CPARAM('billing','prompt_pay_window_days') and card_on_file == True) else (CPARAM('billing','prompt_pay_discount_pct') / 2 if (days_since_posting <= CPARAM('billing','prompt_pay_window_days') and card_on_file == False) else 0)"
      - product: "counted_amount * standing_share * deductible_share * (1 - addon_prompt_rate / 100)"
      - tenure_months: "MONTHS(CFIELD('billing','opened_date'), NOW)"
      - rounded_amount: "product // 1 if tenure_months >= K('long_tenure_months') else ((product * 2) // 1 / 2 if tenure_months >= K('mid_tenure_months') else RND(product, 2))"
      - result: "RND(rounded_amount, 2)"
    compute_basis:
      enrolled_encounter: "the encounter being the one whose charge the plan most recently enrolled at its proposal"
      charge_id: "the charge added is the most recently posted charge of that encounter"
      charge_amount: "the charge amount less every time-of-service collection, payment and adjustment the financial account shows applied to it"
      charge_estimate: "Where the charge amount is above the estimate given before the service"
      charge_posted: "no more than prompt_pay_window_days calendar days after its posting date"
      collected: "less every time-of-service collection, payment and adjustment the financial account shows applied to it"
      paid: "less every time-of-service collection, payment and adjustment the financial account shows applied to it"
      adjusted: "less every time-of-service collection, payment and adjustment the financial account shows applied to it"
      remaining_balance: "The standard add-on amount of a charge is its remaining balance on the enrollment date: the charge amount less every time-of-service collection, payment and adjustment the financial account shows applied to it, never below 0.00, rounded half up to the cent."
      account_class: "over_estimate_share_high on the High-Deductible Health Plan Account and the Self-Pay Account, over_estimate_share_other on any other financial class"
      counted_amount: "Where the charge amount is above the estimate given before the service, only an over-estimate share of the part above the estimate is added: over_estimate_share_high on the High-Deductible Health Plan Account and the Self-Pay Account, over_estimate_share_other on any other financial class; where the charge amount is not above its estimate, or it carries no estimate, the whole remaining balance is counted."
      missed_installments: "when the plan shows at least standing_min_paid installments paid and no missed installment"
      installments_by_autopay: "every installment paid on it was paid by automatic debit"
      installments_paid: "at least one installment paid on it was paid other than by automatic debit"
      late_fees_12m: "the financial account shows no late fee posted less than 12 whole months before the enrollment date"
      standing_share: "The plan-standing share of the add-on is good_standing_share when the plan shows at least standing_min_paid installments paid and no missed installment, every installment paid on it was paid by automatic debit, and the financial account shows no late fee posted less than 12 whole months before the enrollment date; it is fair_standing_share when the plan shows at least standing_min_paid installments paid and no missed installment, at least one installment paid on it was paid other than by automatic debit, and the account shows no such late fee; it is 1 in every other case."
      deductible_remaining: "when the financial account's deductible_remaining_usd is at least deductible_high_usd"
      deductible_share: "The deductible-exposure share of the add-on is high_deductible_share when the financial account's deductible_remaining_usd is at least deductible_high_usd, partial_deductible_share when it is above 0.00 but below deductible_high_usd, and 1 when it is 0.00."
      card_on_file: "and the account keeps a card on file"
      days_since_posting: "when the charge is added no more than prompt_pay_window_days calendar days after its posting date"
      addon_prompt_rate: "The add-on prompt-pay rate is the account's full prompt_pay_discount_pct when the charge is added no more than prompt_pay_window_days calendar days after its posting date and the account keeps a card on file, half of it when the charge is added within that window and the account keeps no card on file, and 0 once more than prompt_pay_window_days days have passed since posting."
      product: "then that counted amount multiplied by the plan-standing share, by the deductible-exposure share and by one minus the add-on prompt-pay rate divided by 100, the three acting together on the counted amount as one product"
      tenure_months: "opened at least long_tenure_months whole months before the enrollment date"
      rounded_amount: "How the add-on amount is rounded follows how long the financial account has been open: opened at least long_tenure_months whole months before the enrollment date, it is rounded down to the whole dollar; opened at least mid_tenure_months but fewer than long_tenure_months whole months before, it is rounded down to the half dollar; otherwise it is rounded half up to the cent."
      result: "the product is rounded once, by the tenure rounding."
    factors:
      - id: over_estimate_share_of_add_on
        effect: parameter
        decides: counted_amount
        bindings: [account_class, counted_amount]
        ladder:
          - when: "the account is the High-Deductible Health Plan Account or the Self-Pay Account and the charge amount is above its estimate"
            value: "K('over_estimate_share_high') of the part above the estimate"
          - when: "the account is any other financial class and the charge amount is above its estimate"
            value: "K('over_estimate_share_other') of the part above the estimate"
          - when: "otherwise (not above the estimate, or no estimate)"
            value: "the whole remaining balance"
        baseline:
          counted_amount: "remaining_balance"
        evidence: [cross_category, history]
        cross_difficulty: billing
      - id: plan_standing_share_of_add_on
        effect: parameter
        decides: standing_share
        bindings: [missed_installments, installments_by_autopay, installments_paid, late_fees_12m, standing_share]
        ladder:
          - when: "at least standing_min_paid installments paid and none missed on the plan, every installment paid by automatic debit, and no late fee posted less than 12 whole months before"
            value: "K('good_standing_share')"
          - when: "at least standing_min_paid installments paid and none missed, at least one installment paid other than by automatic debit, and no such late fee"
            value: "K('fair_standing_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          standing_share: "1"
        evidence: [history, cross_category]
        cross_difficulty: billing
      - id: deductible_exposure_share_of_add_on
        effect: parameter
        decides: deductible_share
        bindings: [deductible_remaining, deductible_share]
        ladder:
          - when: "the account's deductible_remaining_usd is at least deductible_high_usd"
            value: "K('high_deductible_share')"
          - when: "it is above 0.00 but below deductible_high_usd"
            value: "K('partial_deductible_share')"
          - when: "otherwise (0.00)"
            value: "1"
        baseline:
          deductible_share: "1"
        evidence: [cross_category]
        cross_difficulty: billing
      - id: add_on_prompt_pay_rate
        effect: parameter
        decides: addon_prompt_rate
        bindings: [card_on_file, days_since_posting, addon_prompt_rate]
        ladder:
          - when: "the charge is added no more than prompt_pay_window_days days after posting and the account keeps a card on file"
            value: "CPARAM('billing','prompt_pay_discount_pct')"
          - when: "the charge is added within that window and the account keeps no card on file"
            value: "half of CPARAM('billing','prompt_pay_discount_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          addon_prompt_rate: "0"
        evidence: [date, cross_category]
        cross_difficulty: billing
      - id: tenure_rounding_of_add_on
        effect: method
        decides: rounded_amount
        bindings: [tenure_months, rounded_amount]
        ladder:
          - when: "the financial account was opened at least long_tenure_months whole months before the enrollment date"
            method: "round the product down to the whole dollar"
          - when: "it was opened at least mid_tenure_months but fewer than long_tenure_months whole months before"
            method: "round the product down to the half dollar"
          - when: "otherwise"
            method: "round the product half up to the cent"
        baseline:
          rounded_amount: "RND(product, 2)"
        evidence: [date, cross_category]
        cross_difficulty: billing
    baseline:
      rule: >-
        Where add_on_allowed is true, an active plan carries every eligible charge of the encounters enrolled on it: a charge the financial account posts for an encounter the plan enrolled at its proposal, and not yet on the plan, is added to it as an add-on, one charge per entry; the charge added is the most recently posted charge of that encounter, the encounter being the one whose charge the plan most recently enrolled at its proposal. The standard add-on amount of a charge is its remaining balance on the enrollment date: the charge amount less every
        time-of-service collection, payment and adjustment the financial account shows applied to it, never below 0.00,
        rounded half up to the cent.
      params: []
    inputs:
      history:
        - {table: payplan_transactions, aggregate: count, field: payplan_txn_id, filters: {event_type: payplan_installment_paid}}
        - {table: payplan_transactions, aggregate: count, field: payplan_txn_id, filters: {event_type: payplan_installment_missed}}
        - {category: billing, table: billing_transactions, aggregate: latest, field: amount, filters: {event_type: billing_charge_posted}}
        - {category: billing, table: billing_transactions, aggregate: sum, field: amount, filters: {event_type: billing_payment_posted}}
        - {category: billing, table: billing_transactions, aggregate: count, field: billing_txn_id, within_months: 12, filters: {event_type: billing_charge_posted, line_category: late_fee}}
      cross_category: [billing]

  - id: payplan_ext_add_on_term_extension
    base_policy_refs: [payplan_add_on_and_modification, payplan_hardship_plan_terms]
    overwrite:
      - base_policy: payplan_add_on_and_modification
        superseded_clause: >-
          Under add_on_method reamortize_remaining_term the remaining balance is re-spread over the installments left (same end date); under restart_term it is spread over a fresh full term_months from the next due date.
        replaced_by: >-
          When an add-on is taken on a tier other than the Financial Hardship Plan whose term_extension_allowed is true, the plan's term is lengthened, as one modification, by the extension months the add-on earns, adding them to term_months and to term_extension_months_used.
    trigger: state_due
    subject: [payplan_modified]
    computes: extension_months
    target_tool: extend_plan_term_6d1d2771
    params:
      size_divisor_installments: 6
      left_short_count: 6
      left_mid_count: 12
      left_short_months: 2
      left_mid_months: 1
      history_full_count: 12
      history_full_months: 2
      history_part_months: 1
      age_long_months: 12
      age_mid_months: 6
      age_long_grant: 2
      age_mid_grant: 1
      autopay_min_paid: 6
      ach_grant: 2
      card_grant: 1
    rule: >-
      When an add-on is taken on a tier other than the Financial Hardship Plan whose term_extension_allowed is true, the plan's term is lengthened, as one
      modification, by the extension months the add-on earns, adding them to term_months and to term_extension_months_used. On the Financial Hardship Plan an add-on restarts the term instead and earns no extension. The extension granted with an add-on is not fixed until the plan carries the add-on
      enrollment entry it is granted for. The add-on counted is the add-on enrollment entry booked on the plan on the
      handling date. The standard extension granted with an add-on is the add-on amount divided by
      size_divisor_installments times the plan's current installment_amount, rounded down to whole months; the total
      extension never exceeds the room left, which is the tier's term_extension_max_months less term_extension_months_used,
      and is never below 0. How the add-on share of the extension is rounded to whole months follows the financial
      account's payment reversals posted less than 12 whole months before the handling date: with none it is rounded up;
      with exactly one it is rounded half up; with two or more it is rounded down. The remaining-term months of the
      extension are left_short_months when fewer than left_short_count installments are left (term_months less the
      installments paid), left_mid_months when at least left_short_count but fewer than left_mid_count are left, and 0
      when left_mid_count or more are left. The plan-history months of the extension are history_full_months when the
      financial account shows at least history_full_count payments posted with payment method payment_plan,
      history_part_months when it shows at least one but fewer than history_full_count, and 0 when it shows none. The
      plan-age months of the extension are age_long_grant when the agreement was signed at least age_long_months whole
      months before the handling date, age_mid_grant when it was signed at least age_mid_months but fewer than
      age_long_months whole months before, and 0 otherwise. The automatic-debit months of the extension are ach_grant
      when the plan's automatic debit method is ach and at least autopay_min_paid installments have been paid on the plan,
      card_grant when the method is card or hsa_fsa_card and at least autopay_min_paid installments have been paid, and 0
      in every other case. The extension months are worked out in this order: first the add-on share, rounded as above;
      then the remaining-term months, the plan-history months, the plan-age months and the automatic-debit months are added
      to it; the sum is then held within the room left.
    prerequisite:
      - problem: payplan_ext_add_on_charge_amount
        kind: value_input
        gate: addon_amount
        form: state
        policy_source: >-
          The extension granted with an add-on is not fixed until the plan carries the add-on enrollment entry it is granted for.
        condition: >-
          A payplan_balance_enrolled entry with enroll_reason add_on, dated the handling date, stands on the plan for the
          charge the patient asked to add.
        resolved_by: enroll_add_on_charge_102110ed
        effect: >-
          addon_amount becomes the add-on amount the add-on charge policy computes (0.00 without the entry), which moves the
          add-on share of the extension.
    cross_category:
      - category: billing
        as: history
        reads: [billing_transactions.event_type, billing_transactions.payment_method, billing_transactions.txn_date]
        note: The rounding of the add-on share reads the account's payment reversals; the plan-history months read its payment_plan payments.
    compute:
      - addon_amount: "SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_balance_enrolled', enroll_reason='add_on', txn_date=NOW)"
      - current_installment: "F('installment_amount')"
      - installments_paid: "COUNT('payplan_transactions', date_field='txn_date', event_type='payplan_installment_paid')"
      - size_raw: "addon_amount / (current_installment * K('size_divisor_installments'))"
      - reversals_12m: "XCOUNT('billing','billing_transactions', within_months=12, date_field='txn_date', event_type='billing_payment_reversed')"
      - size_months: "-((-size_raw) // 1) if reversals_12m == 0 else ((size_raw + 0.5) // 1 if reversals_12m == 1 else size_raw // 1)"
      - installments_left: "F('term_months') - COUNT('payplan_transactions', date_field='txn_date', event_type='payplan_installment_paid')"
      - left_months: "K('left_short_months') if installments_left < K('left_short_count') else (K('left_mid_months') if installments_left < K('left_mid_count') else 0)"
      - plan_payments_on_record: "XCOUNT('billing','billing_transactions', event_type='billing_payment_posted', payment_method='payment_plan')"
      - history_months: "K('history_full_months') if plan_payments_on_record >= K('history_full_count') else (K('history_part_months') if plan_payments_on_record >= 1 else 0)"
      - plan_age: "MONTHS(F('agreement_signed_date'), NOW)"
      - age_months: "K('age_long_grant') if plan_age >= K('age_long_months') else (K('age_mid_grant') if plan_age >= K('age_mid_months') else 0)"
      - autopay_months: "K('ach_grant') if (F('autopay_method') == 'ach' and installments_paid >= K('autopay_min_paid')) else (K('card_grant') if ((F('autopay_method') == 'card' or F('autopay_method') == 'hsa_fsa_card') and installments_paid >= K('autopay_min_paid')) else 0)"
      - room_left: "P('term_extension_max_months') - F('term_extension_months_used')"
      - hardship_tier: "F('variant_name') == 'Financial Hardship Plan'"
      - result: "0 if hardship_tier else MX(0, MN(room_left, size_months + left_months + history_months + age_months + autopay_months))"
    compute_basis:
      addon_amount: "The add-on counted is the add-on enrollment entry booked on the plan on the handling date."
      current_installment: "the add-on amount divided by size_divisor_installments times the plan's current installment_amount"
      installments_paid: "(term_months less the installments paid)"
      size_raw: "The standard extension granted with an add-on is the add-on amount divided by size_divisor_installments times the plan's current installment_amount, rounded down to whole months"
      reversals_12m: "follows the financial account's payment reversals posted less than 12 whole months before the handling date"
      size_months: "How the add-on share of the extension is rounded to whole months follows the financial account's payment reversals posted less than 12 whole months before the handling date: with none it is rounded up; with exactly one it is rounded half up; with two or more it is rounded down."
      installments_left: "fewer than left_short_count installments are left (term_months less the installments paid)"
      left_months: "The remaining-term months of the extension are left_short_months when fewer than left_short_count installments are left (term_months less the installments paid), left_mid_months when at least left_short_count but fewer than left_mid_count are left, and 0 when left_mid_count or more are left."
      plan_payments_on_record: "when the financial account shows at least history_full_count payments posted with payment method payment_plan"
      history_months: "The plan-history months of the extension are history_full_months when the financial account shows at least history_full_count payments posted with payment method payment_plan, history_part_months when it shows at least one but fewer than history_full_count, and 0 when it shows none."
      plan_age: "when the agreement was signed at least age_long_months whole months before the handling date"
      age_months: "The plan-age months of the extension are age_long_grant when the agreement was signed at least age_long_months whole months before the handling date, age_mid_grant when it was signed at least age_mid_months but fewer than age_long_months whole months before, and 0 otherwise."
      autopay_months: "The automatic-debit months of the extension are ach_grant when the plan's automatic debit method is ach and at least autopay_min_paid installments have been paid on the plan, card_grant when the method is card or hsa_fsa_card and at least autopay_min_paid installments have been paid, and 0 in every other case."
      room_left: "the total extension never exceeds the room left, which is the tier's term_extension_max_months less term_extension_months_used, and is never below 0"
      hardship_tier: "On the Financial Hardship Plan an add-on restarts the term instead and earns no extension."
      result: "The extension months are worked out in this order: first the add-on share, rounded as above; then the remaining-term months, the plan-history months, the plan-age months and the automatic-debit months are added to it; the sum is then held within the room left."
    factors:
      - id: add_on_share_rounding_of_extension
        effect: method
        decides: size_months
        bindings: [reversals_12m, size_months]
        ladder:
          - when: "the account shows no payment reversal posted less than 12 whole months before the handling date"
            method: "round the add-on share up to whole months"
          - when: "it shows exactly one such reversal"
            method: "round the add-on share half up to whole months"
          - when: "otherwise (two or more)"
            method: "round the add-on share down to whole months"
        baseline:
          size_months: "size_raw // 1"
        evidence: [history, cross_category]
        cross_difficulty: billing
      - id: remaining_term_months_of_extension
        effect: parameter
        decides: left_months
        bindings: [installments_left, left_months]
        ladder:
          - when: "fewer than left_short_count installments are left"
            value: "K('left_short_months')"
          - when: "at least left_short_count but fewer than left_mid_count are left"
            value: "K('left_mid_months')"
          - when: "otherwise"
            value: "0"
        baseline:
          left_months: "0"
        evidence: [history]
        cross_difficulty: null
      - id: plan_history_months_of_extension
        effect: parameter
        decides: history_months
        bindings: [plan_payments_on_record, history_months]
        ladder:
          - when: "the account shows at least history_full_count payments posted with payment method payment_plan"
            value: "K('history_full_months')"
          - when: "it shows at least one but fewer than history_full_count"
            value: "K('history_part_months')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          history_months: "0"
        evidence: [history, cross_category]
        cross_difficulty: billing
      - id: plan_age_months_of_extension
        effect: parameter
        decides: age_months
        bindings: [plan_age, age_months]
        ladder:
          - when: "the agreement was signed at least age_long_months whole months before the handling date"
            value: "K('age_long_grant')"
          - when: "it was signed at least age_mid_months but fewer than age_long_months whole months before"
            value: "K('age_mid_grant')"
          - when: "otherwise"
            value: "0"
        baseline:
          age_months: "0"
        evidence: [date]
        cross_difficulty: null
      - id: automatic_debit_months_of_extension
        effect: parameter
        decides: autopay_months
        bindings: [installments_paid, autopay_months]
        ladder:
          - when: "the automatic debit method is ach and at least autopay_min_paid installments have been paid on the plan"
            value: "K('ach_grant')"
          - when: "the method is card or hsa_fsa_card and at least autopay_min_paid installments have been paid"
            value: "K('card_grant')"
          - when: "otherwise"
            value: "0"
        baseline:
          autopay_months: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        When an add-on is taken on a tier other than the Financial Hardship Plan whose term_extension_allowed is true, the plan's term is lengthened, as one
        modification, by the extension months the add-on earns, adding them to term_months and to
        term_extension_months_used. The add-on counted is the add-on enrollment entry booked on the plan on the handling
        date. The standard extension granted with an add-on is the add-on amount divided by size_divisor_installments
        times the plan's current installment_amount, rounded down to whole months; the total extension never exceeds the
        room left, which is the tier's term_extension_max_months less term_extension_months_used, and is never below 0.
      params: [term_extension_max_months]
    inputs:
      history:
        - {table: payplan_transactions, aggregate: sum, field: amount, filters: {event_type: payplan_balance_enrolled, enroll_reason: add_on}}
        - {table: payplan_transactions, aggregate: count, field: payplan_txn_id, filters: {event_type: payplan_installment_paid}}
        - {category: billing, table: billing_transactions, aggregate: count, field: billing_txn_id, within_months: 12, filters: {event_type: billing_payment_reversed}}
        - {category: billing, table: billing_transactions, aggregate: count, field: billing_txn_id, filters: {event_type: billing_payment_posted, payment_method: payment_plan}}
      cross_category: [billing]

  - id: payplan_ext_add_on_fee
    base_policy_refs: [payplan_charge_eligibility, payplan_add_on_and_modification, payplan_enrollment_terms]
    overwrite:
      - base_policy: payplan_enrollment_terms
        superseded_clause: >-
          The tier's setup_fee_usd, where above 0.00, is enrolled into the plan balance at signing and spread with the rest
        replaced_by: >-
          On a tier whose setup_fee_usd is above 0.00, every add-on booked on the plan is also charged an add-on fee, booked on the plan balance as one enrollment entry of reason setup_fee on the day the add-on is enrolled.
    trigger: state_due
    subject: [payplan_balance_enrolled]
    computes: amount
    target_tool: enroll_add_on_fee_792da8e6
    params:
      first_add_on_share: 0.50
      second_add_on_share: 0.75
      small_add_on_usd: 1000.00
      small_add_on_share: 0.60
      mid_add_on_usd: 2500.00
      mid_add_on_share: 0.80
      debit_with_card_on_file_share: 0.80
      debit_without_card_share: 0.90
      clean_record_share: 0.90
      one_late_fee_share: 0.95
    rule: >-
      On a tier whose setup_fee_usd is above 0.00, every add-on booked on the plan is also charged an add-on fee, booked
      on the plan balance as one enrollment entry of reason setup_fee on the day the add-on is enrolled. The add-on fee is
      not fixed until the plan carries the add-on enrollment entry it is charged for. The standard add-on fee is the tier's
      setup_fee_usd, rounded half up to the cent. The add-on number share of the fee is first_add_on_share when the plan
      carries exactly one add-on enrollment entry over its life (the add-on being charged is its first),
      second_add_on_share when it carries exactly two, and 1 when it carries three or more. The add-on size share of the
      fee is small_add_on_share when the add-on enrollment entry booked on the handling date is below small_add_on_usd,
      mid_add_on_share when it is at least small_add_on_usd but below mid_add_on_usd, and 1 when it is mid_add_on_usd or
      more. The debit share of the fee is debit_with_card_on_file_share when the plan pays by automatic debit and the
      financial account keeps a card on file, debit_without_card_share when the plan pays by automatic debit and the
      account keeps no card on file, and 1 when the plan does not pay by automatic debit. The late-fee record share of the
      fee is clean_record_share when the financial account shows no late fee posted less than 24 whole months before the
      handling date, one_late_fee_share when it shows exactly one such late fee, and 1 when it shows two or more. The
      scheduled add-on fee is the tier's setup_fee_usd multiplied by the add-on number share, the add-on size share, the
      debit share and the late-fee record share, the four shares acting together on the tier's setup_fee_usd as one
      combined product. How the scheduled add-on fee becomes the fee entered follows the account's financial class: on the
      High-Deductible Health Plan Account it is rounded down to the whole dollar; on the Self-Pay Account it is rounded
      down to the half dollar; on every other class it is rounded half up to the cent.
    prerequisite:
      - problem: payplan_ext_add_on_charge_amount
        kind: value_input
        gate: addon_amount
        form: state
        policy_source: >-
          The add-on fee is not fixed until the plan carries the add-on enrollment entry it is charged for.
        condition: >-
          A payplan_balance_enrolled entry with enroll_reason add_on, dated the handling date, stands on the plan for the
          charge the patient asked to add.
        resolved_by: enroll_add_on_charge_102110ed
        effect: >-
          addon_count rises to include the new add-on and addon_amount becomes the add-on amount the add-on charge policy
          computes, which select the add-on number share and the add-on size share.
    cross_category:
      - category: billing
        as: branch
        reads: [card_on_file, variant_name, billing_transactions.line_category, billing_transactions.txn_date]
        note: The debit share reads the account's card on file, the late-fee record share its late fees over 24 months, and the rounding its financial class.
    compute:
      - fee_standard: "P('setup_fee_usd')"
      - addon_count: "COUNT('payplan_transactions', date_field='txn_date', event_type='payplan_balance_enrolled', enroll_reason='add_on')"
      - number_share: "K('first_add_on_share') if addon_count == 1 else (K('second_add_on_share') if addon_count == 2 else 1)"
      - addon_amount: "SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_balance_enrolled', enroll_reason='add_on', txn_date=NOW)"
      - size_share: "K('small_add_on_share') if addon_amount < K('small_add_on_usd') else (K('mid_add_on_share') if addon_amount < K('mid_add_on_usd') else 1)"
      - card_on_file: "CFIELD('billing','card_on_file')"
      - debit_share: "K('debit_with_card_on_file_share') if (F('autopay_enrolled') == True and card_on_file == True) else (K('debit_without_card_share') if (F('autopay_enrolled') == True and card_on_file == False) else 1)"
      - late_fees_24m: "XCOUNT('billing','billing_transactions', within_months=24, date_field='txn_date', event_type='billing_charge_posted', line_category='late_fee')"
      - record_share: "K('clean_record_share') if late_fees_24m == 0 else (K('one_late_fee_share') if late_fees_24m == 1 else 1)"
      - scheduled_fee: "fee_standard * number_share * size_share * debit_share * record_share"
      - account_class: "CFIELD('billing','variant_name')"
      - fee_entered: "scheduled_fee // 1 if account_class == 'High-Deductible Health Plan Account' else ((scheduled_fee * 2) // 1 / 2 if account_class == 'Self-Pay Account' else RND(scheduled_fee, 2))"
      - result: "RND(fee_entered, 2)"
    compute_basis:
      fee_standard: "The standard add-on fee is the tier's setup_fee_usd, rounded half up to the cent."
      addon_count: "when the plan carries exactly one add-on enrollment entry over its life (the add-on being charged is its first)"
      number_share: "The add-on number share of the fee is first_add_on_share when the plan carries exactly one add-on enrollment entry over its life (the add-on being charged is its first), second_add_on_share when it carries exactly two, and 1 when it carries three or more."
      addon_amount: "when the add-on enrollment entry booked on the handling date is below small_add_on_usd"
      size_share: "The add-on size share of the fee is small_add_on_share when the add-on enrollment entry booked on the handling date is below small_add_on_usd, mid_add_on_share when it is at least small_add_on_usd but below mid_add_on_usd, and 1 when it is mid_add_on_usd or more."
      card_on_file: "the financial account keeps a card on file"
      debit_share: "The debit share of the fee is debit_with_card_on_file_share when the plan pays by automatic debit and the financial account keeps a card on file, debit_without_card_share when the plan pays by automatic debit and the account keeps no card on file, and 1 when the plan does not pay by automatic debit."
      late_fees_24m: "shows no late fee posted less than 24 whole months before the handling date"
      record_share: "The late-fee record share of the fee is clean_record_share when the financial account shows no late fee posted less than 24 whole months before the handling date, one_late_fee_share when it shows exactly one such late fee, and 1 when it shows two or more."
      scheduled_fee: "The scheduled add-on fee is the tier's setup_fee_usd multiplied by the add-on number share, the add-on size share, the debit share and the late-fee record share, the four shares acting together on the tier's setup_fee_usd as one combined product."
      account_class: "How the scheduled add-on fee becomes the fee entered follows the account's financial class"
      fee_entered: "on the High-Deductible Health Plan Account it is rounded down to the whole dollar; on the Self-Pay Account it is rounded down to the half dollar; on every other class it is rounded half up to the cent."
      result: "How the scheduled add-on fee becomes the fee entered follows the account's financial class"
    factors:
      - id: add_on_number_share_of_fee
        effect: parameter
        decides: number_share
        bindings: [addon_count, number_share]
        ladder:
          - when: "the plan carries exactly one add-on enrollment entry over its life"
            value: "K('first_add_on_share')"
          - when: "it carries exactly two"
            value: "K('second_add_on_share')"
          - when: "otherwise (three or more)"
            value: "1"
        baseline:
          number_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: add_on_size_share_of_fee
        effect: parameter
        decides: size_share
        bindings: [addon_amount, size_share]
        ladder:
          - when: "the add-on booked on the handling date is below small_add_on_usd"
            value: "K('small_add_on_share')"
          - when: "it is at least small_add_on_usd but below mid_add_on_usd"
            value: "K('mid_add_on_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          size_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: debit_share_of_add_on_fee
        effect: parameter
        decides: debit_share
        bindings: [card_on_file, debit_share]
        ladder:
          - when: "the plan pays by automatic debit and the account keeps a card on file"
            value: "K('debit_with_card_on_file_share')"
          - when: "the plan pays by automatic debit and the account keeps no card on file"
            value: "K('debit_without_card_share')"
          - when: "otherwise (no automatic debit)"
            value: "1"
        baseline:
          debit_share: "1"
        evidence: [cross_category]
        cross_difficulty: billing
      - id: late_fee_record_share_of_add_on_fee
        effect: parameter
        decides: record_share
        bindings: [late_fees_24m, record_share]
        ladder:
          - when: "the account shows no late fee posted less than 24 whole months before the handling date"
            value: "K('clean_record_share')"
          - when: "it shows exactly one such late fee"
            value: "K('one_late_fee_share')"
          - when: "otherwise (two or more)"
            value: "1"
        baseline:
          record_share: "1"
        evidence: [history, cross_category]
        cross_difficulty: billing
      - id: class_rounding_of_add_on_fee
        effect: method
        decides: fee_entered
        bindings: [account_class, fee_entered]
        ladder:
          - when: "the account is the High-Deductible Health Plan Account"
            method: "round the scheduled add-on fee down to the whole dollar"
          - when: "the account is the Self-Pay Account"
            method: "round the scheduled add-on fee down to the half dollar"
          - when: "otherwise"
            method: "round the scheduled add-on fee half up to the cent"
        baseline:
          fee_entered: "RND(scheduled_fee, 2)"
        evidence: [cross_category]
        cross_difficulty: billing
    baseline:
      rule: >-
        On a tier whose setup_fee_usd is above 0.00, every add-on booked on the plan is also charged an add-on fee, booked
        on the plan balance as one enrollment entry of reason setup_fee on the day the add-on is enrolled. The standard
        add-on fee is the tier's setup_fee_usd, rounded half up to the cent.
      params: [setup_fee_usd]
    inputs:
      history:
        - {table: payplan_transactions, aggregate: count, field: payplan_txn_id, filters: {event_type: payplan_balance_enrolled, enroll_reason: add_on}}
        - {table: payplan_transactions, aggregate: sum, field: amount, filters: {event_type: payplan_balance_enrolled, enroll_reason: add_on}}
        - {category: billing, table: billing_transactions, aggregate: count, field: billing_txn_id, within_months: 24, filters: {event_type: billing_charge_posted, line_category: late_fee}}
      cross_category: [billing]


  - id: payplan_ext_add_on_installment
    base_policy_refs: [payplan_add_on_and_modification, payplan_hardship_plan_terms, payplan_agreement_and_activation]
    overwrite:
      - base_policy: payplan_add_on_and_modification
        superseded_clause: >-
          Under add_on_method reamortize_remaining_term the remaining balance is re-spread over the installments left (same end date); under restart_term it is spread over a fresh full term_months from the next due date.
        replaced_by: >-
          The re-spread basis follows the tier and the day's add-on: on the Financial Hardship Plan the plan balance is spread over a fresh full term_months; on any other tier, when an add-on is booked on the handling date and the plan shows no missed installment, the plan balance standing before that add-on is re-spread over the installments left and the add-on together with its add-on fee is spread over the tier's full term_months, the two spreads being added; in every other case the plan balance is re-spread over the installments left.
    trigger: on_request
    subject: [payplan_modified]
    computes: installment_amount
    target_tool: accept_add_on_installment_27cdd630
    params:
      self_pay_class_credit_usd: 3.00
      hdhp_class_credit_usd: 2.00
      card_debit_credit_usd: 1.50
      ach_debit_credit_usd: 1.00
      age_long_months: 12
      age_mid_months: 6
      age_long_credit_usd: 2.00
      age_mid_credit_usd: 1.00
    rule: >-
      A re-spread of the installment of an active plan, whether the patient asks for it or it follows an add-on, changes
      the patient's payment obligation, so it takes effect only when the patient accepts it in person; the representative
      prepares the figure and hands the acceptance to the patient. The re-spread installment is fixed only after the plan
      carries an enrollment entry for every charge the financial account posted for an encounter the plan enrolled at its
      proposal. The re-spread installment is not worked out until the plan balance carries the add-on fee entry owed for
      every add-on booked on the handling date. The re-spread installment is fixed only after the plan's term shows the
      extension months the add-on earns. The plan balance is every amount enrolled on the plan less every reduction,
      payment and release booked on it, and the installments left are the plan's term_months less the installments paid.
      The standard re-spread installment is the plan balance divided by the installments left, rounded half up to the
      cent, never below the tier's min_installment_usd. The re-spread basis follows the tier and the day's add-on: on the
      Financial Hardship Plan the plan balance is spread over a fresh full term_months; on any other tier, when an add-on
      is booked on the handling date and the plan shows no missed installment, the plan balance standing before that
      add-on is re-spread over the installments left and the add-on together with its add-on fee is spread over the
      tier's full term_months, the two spreads being added; in every other case the plan balance is re-spread over the
      installments left. Each spread is rounded half up to the cent. The class credit on the re-spread installment is
      self_pay_class_credit_usd on the Self-Pay Account, hdhp_class_credit_usd on the High-Deductible Health Plan Account,
      and 0.00 on every other class. The debit credit on the re-spread installment is card_debit_credit_usd when the plan's
      automatic debit method is card or hsa_fsa_card and the financial account keeps a card on file, ach_debit_credit_usd
      when the method is ach and the account keeps a card on file, and 0.00 in every other case. The plan-age credit on the
      re-spread installment is age_long_credit_usd when the agreement was signed at least age_long_months whole months
      before the handling date, age_mid_credit_usd when it was signed at least age_mid_months but fewer than
      age_long_months whole months before, and 0.00 otherwise. The re-spread installment is worked out in this order:
      first the spread by the re-spread basis, then the class credit, the debit credit and the plan-age credit subtracted
      from it; the result is never below the tier's min_installment_usd and is rounded half up to the cent.
    prerequisite:
      - problem: payplan_ext_add_on_charge_amount
        kind: value_input
        gate: plan_balance
        form: state
        policy_source: >-
          The re-spread installment is fixed only after the plan carries an enrollment entry for every charge the financial account posted for an encounter the plan enrolled at its proposal.
        condition: >-
          Every billing_charge_posted row of an encounter enrolled on the plan at its proposal has a payplan_balance_enrolled
          entry on the plan pointing at it (the later-posted ones as add_on entries).
        resolved_by: enroll_add_on_charge_102110ed
        effect: >-
          plan_balance and addon_today rise by the add-on amount the add-on charge policy computes, which selects the
          re-spread basis and enters the spread.
      - problem: payplan_ext_add_on_fee
        kind: value_input
        gate: fee_today
        form: state
        policy_source: >-
          The re-spread installment is not worked out until the plan balance carries the add-on fee entry owed for every add-on booked on the handling date.
        condition: >-
          For every add_on entry dated the handling date, a payplan_balance_enrolled entry with enroll_reason setup_fee,
          dated the handling date, stands on the plan.
        resolved_by: enroll_add_on_fee_792da8e6
        effect: >-
          fee_today and plan_balance rise by the add-on fee the add-on fee policy computes, which enters the add-on's own
          spread.
      - problem: payplan_ext_add_on_term_extension
        kind: value_input
        gate: installments_left
        form: state
        policy_source: >-
          The re-spread installment is fixed only after the plan's term shows the extension months the add-on earns.
        condition: >-
          The plan's term_months and term_extension_months_used already include the extension months granted for the add-on
          booked on the handling date.
        resolved_by: extend_plan_term_6d1d2771
        effect: >-
          installments_left grows by the extension months the extension policy computes, so the re-spread of the balance
          standing before the add-on runs over more installments.
    cross_category:
      - category: billing
        as: branch
        reads: [variant_name, card_on_file]
        note: The class credit reads the account's financial class and the debit credit whether it keeps a card on file.
    compute:
      - enrolled: "SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_balance_enrolled')"
      - reductions: "SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_balance_adjusted')"
      - payments: "SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_installment_paid') + SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_extra_payment')"
      - releases: "SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_balance_released')"
      - plan_balance: "enrolled - reductions - payments - releases"
      - installments_paid: "COUNT('payplan_transactions', date_field='txn_date', event_type='payplan_installment_paid')"
      - installments_left: "F('term_months') - installments_paid"
      - addon_today: "SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_balance_enrolled', enroll_reason='add_on', txn_date=NOW)"
      - fee_today: "SUM('payplan_transactions','amount', date_field='txn_date', event_type='payplan_balance_enrolled', enroll_reason='setup_fee', txn_date=NOW)"
      - missed_installments: "COUNT('payplan_transactions', date_field='txn_date', event_type='payplan_installment_missed')"
      - spread: "RND(plan_balance / P('term_months'), 2) if F('variant_name') == 'Financial Hardship Plan' else (RND(RND((plan_balance - addon_today - fee_today) / installments_left, 2) + RND((addon_today + fee_today) / P('term_months'), 2), 2) if (F('variant_name') != 'Financial Hardship Plan' and addon_today > 0 and missed_installments == 0) else RND(plan_balance / installments_left, 2))"
      - account_class: "CFIELD('billing','variant_name')"
      - class_credit: "K('self_pay_class_credit_usd') if account_class == 'Self-Pay Account' else (K('hdhp_class_credit_usd') if account_class == 'High-Deductible Health Plan Account' else 0)"
      - card_on_file: "CFIELD('billing','card_on_file')"
      - debit_credit: "K('card_debit_credit_usd') if ((F('autopay_method') == 'card' or F('autopay_method') == 'hsa_fsa_card') and card_on_file == True) else (K('ach_debit_credit_usd') if (F('autopay_method') == 'ach' and card_on_file == True) else 0)"
      - plan_age: "MONTHS(F('agreement_signed_date'), NOW)"
      - age_credit: "K('age_long_credit_usd') if plan_age >= K('age_long_months') else (K('age_mid_credit_usd') if plan_age >= K('age_mid_months') else 0)"
      - result: "RND(MX(P('min_installment_usd'), spread - class_credit - debit_credit - age_credit), 2)"
    compute_basis:
      enrolled: "The plan balance is every amount enrolled on the plan less every reduction, payment and release booked on it"
      reductions: "less every reduction, payment and release booked on it"
      payments: "less every reduction, payment and release booked on it"
      releases: "less every reduction, payment and release booked on it"
      plan_balance: "The plan balance is every amount enrolled on the plan less every reduction, payment and release booked on it"
      installments_paid: "the installments left are the plan's term_months less the installments paid"
      installments_left: "the installments left are the plan's term_months less the installments paid"
      addon_today: "when an add-on is booked on the handling date and the plan shows no missed installment"
      fee_today: "the add-on together with its add-on fee is spread over the tier's full term_months"
      missed_installments: "and the plan shows no missed installment"
      spread: "The re-spread basis follows the tier and the day's add-on: on the Financial Hardship Plan the plan balance is spread over a fresh full term_months; on any other tier, when an add-on is booked on the handling date and the plan shows no missed installment, the plan balance standing before that add-on is re-spread over the installments left and the add-on together with its add-on fee is spread over the tier's full term_months, the two spreads being added; in every other case the plan balance is re-spread over the installments left. Each spread is rounded half up to the cent."
      account_class: "The class credit on the re-spread installment is self_pay_class_credit_usd on the Self-Pay Account"
      class_credit: "The class credit on the re-spread installment is self_pay_class_credit_usd on the Self-Pay Account, hdhp_class_credit_usd on the High-Deductible Health Plan Account, and 0.00 on every other class."
      card_on_file: "and the financial account keeps a card on file"
      debit_credit: "The debit credit on the re-spread installment is card_debit_credit_usd when the plan's automatic debit method is card or hsa_fsa_card and the financial account keeps a card on file, ach_debit_credit_usd when the method is ach and the account keeps a card on file, and 0.00 in every other case."
      plan_age: "when the agreement was signed at least age_long_months whole months before the handling date"
      age_credit: "The plan-age credit on the re-spread installment is age_long_credit_usd when the agreement was signed at least age_long_months whole months before the handling date, age_mid_credit_usd when it was signed at least age_mid_months but fewer than age_long_months whole months before, and 0.00 otherwise."
      result: "The re-spread installment is worked out in this order: first the spread by the re-spread basis, then the class credit, the debit credit and the plan-age credit subtracted from it; the result is never below the tier's min_installment_usd and is rounded half up to the cent."
    factors:
      - id: re_spread_basis_after_add_on
        effect: method
        decides: spread
        bindings: [missed_installments, spread]
        ladder:
          - when: "the plan is on the Financial Hardship Plan"
            method: "spread the plan balance over a fresh full term_months"
          - when: "on any other tier, an add-on is booked on the handling date and the plan shows no missed installment"
            method: "split: the balance standing before the add-on over the installments left, plus the add-on and its add-on fee over the tier's full term_months"
          - when: "otherwise"
            method: "re-spread the whole plan balance over the installments left"
        baseline:
          spread: "RND(plan_balance / installments_left, 2)"
        evidence: [history]
        cross_difficulty: null
      - id: class_credit_on_re_spread_installment
        effect: parameter
        decides: class_credit
        bindings: [account_class, class_credit]
        ladder:
          - when: "the account is the Self-Pay Account"
            value: "K('self_pay_class_credit_usd')"
          - when: "the account is the High-Deductible Health Plan Account"
            value: "K('hdhp_class_credit_usd')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          class_credit: "0"
        evidence: [cross_category]
        cross_difficulty: billing
      - id: debit_credit_on_re_spread_installment
        effect: parameter
        decides: debit_credit
        bindings: [card_on_file, debit_credit]
        ladder:
          - when: "the automatic debit method is card or hsa_fsa_card and the account keeps a card on file"
            value: "K('card_debit_credit_usd')"
          - when: "the method is ach and the account keeps a card on file"
            value: "K('ach_debit_credit_usd')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          debit_credit: "0"
        evidence: [cross_category]
        cross_difficulty: billing
      - id: plan_age_credit_on_re_spread_installment
        effect: parameter
        decides: age_credit
        bindings: [plan_age, age_credit]
        ladder:
          - when: "the agreement was signed at least age_long_months whole months before the handling date"
            value: "K('age_long_credit_usd')"
          - when: "it was signed at least age_mid_months but fewer than age_long_months whole months before"
            value: "K('age_mid_credit_usd')"
          - when: "otherwise"
            value: "0.00"
        baseline:
          age_credit: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The plan balance is every amount enrolled on the plan less every reduction, payment and release booked on it, and
        the installments left are the plan's term_months less the installments paid. The standard re-spread installment is
        the plan balance divided by the installments left, rounded half up to the cent, never below the tier's
        min_installment_usd.
      params: [min_installment_usd]
    inputs:
      history:
        - {table: payplan_transactions, aggregate: sum, field: amount, filters: {event_type: payplan_balance_enrolled}}
        - {table: payplan_transactions, aggregate: sum, field: amount, filters: {event_type: payplan_installment_paid}}
        - {table: payplan_transactions, aggregate: sum, field: amount, filters: {event_type: payplan_extra_payment}}
        - {table: payplan_transactions, aggregate: count, field: payplan_txn_id, filters: {event_type: payplan_installment_missed}}
      cross_category: [billing]
