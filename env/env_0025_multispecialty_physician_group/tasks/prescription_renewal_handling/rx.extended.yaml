events:
  - type: rx_prescribed
    target: prescriptions
    mutation: create
    meaning: "A clinician signs a new prescription for the patient."
    grain: "One row per prescription."
    fields:
      customer_id: "The patient."
      variant_name: "Prescription class (official tier name)."
      status: "Always prescribed on creation."
      prescribed_date: "Date the prescription is signed."
      medication_name: "Medication exactly as written on the prescription."
      strength: "Strength and form exactly as written (e.g. '20 mg tablet')."
      days_supply: "Days' supply of one fill."
      prescriber_name: "Prescribing clinician exactly as listed in the provider directory."
      prescribing_department: "Department of the prescriber."
      pharmacy_name: "Pharmacy exactly as listed in the pharmacy directory."
      refills_remaining: "0 on creation; raised by the fill authorization posted at transmission."
      expiration_date: "Prescribing date plus prescription_validity_days minus one."
      prior_auth_status: "not_required, or pending where the tier needs prior authorization."
    triggers: []
  - type: rx_transmitted
    target: prescriptions
    mutation: {transition: {from: prescribed, to: active}}
    meaning: "The prescription is transmitted to the pharmacy."
    grain: "One row per transaction."
    fields:
      status: "Set to active."
      transmitted_date: "Date of transmission."
    triggers:
      - event: rx:rx_fills_authorized
        map: {fill_date: transmitted_date, authorization_reason: new_prescription}
  - type: rx_renewal_requested
    target: prescriptions
    mutation: {transition: [{from: active, to: renewal_requested}, {from: expired, to: renewal_requested}]}
    meaning: "A renewal request is logged against the prescription."
    grain: "One row per transaction."
    fields:
      status: "Set to renewal_requested."
      renewal_requested_date: "Date the request was received."
      renewal_channel: "pharmacy_request, patient_portal or phone."
    triggers: []
  - type: rx_renewed
    target: prescriptions
    mutation: {transition: [{from: renewal_requested, to: active}, {from: on_hold, to: active}]}
    meaning: "The renewal is approved; remaining fills of the old authorization are replaced by the new authorization."
    grain: "One row per transaction."
    fields:
      status: "Set to active."
      renewed_date: "Date of the approval."
      expiration_date: "Renewal date plus prescription_validity_days minus one."
      hold_reason: "Reset to none."
      refills_remaining: "Fills left on the old authorization at the moment of renewal (voided before the new grant)."
    triggers:
      - event: rx:rx_fills_voided
        when: {refills_remaining: {not: 0}}
        map: {fill_date: renewed_date, fills: refills_remaining, void_reason: superseded_by_renewal}
      - event: rx:rx_fills_authorized
        map: {fill_date: renewed_date, authorization_reason: renewal}
  - type: rx_renewal_held
    target: prescriptions
    mutation: {transition: {from: renewal_requested, to: on_hold}}
    meaning: "The renewal waits for a visit, lab, drug screen, agreement or prior authorization."
    grain: "One row per transaction."
    fields:
      status: "Set to on_hold."
      hold_reason: "What is missing."
      hold_started_date: "Date the hold starts."
    triggers: []
  - type: rx_renewal_declined
    target: prescriptions
    mutation: {transition: [{from: renewal_requested, to: discontinued}, {from: on_hold, to: discontinued}]}
    meaning: "The renewal is declined by the prescriber or lapses after an unresolved hold."
    grain: "One row per transaction."
    fields:
      status: "Set to discontinued."
      discontinue_reason: "renewal_denied or hold_lapsed."
      closed_date: "Date of the decline."
      refills_remaining: "Fills left at the decline (voided)."
    triggers:
      - event: rx:rx_fills_voided
        when: {refills_remaining: {not: 0}}
        map: {fill_date: closed_date, fills: refills_remaining, void_reason: discontinued}
  - type: rx_expired
    target: prescriptions
    mutation: {transition: {from: active, to: expired}}
    meaning: "The prescription passes its expiration date."
    grain: "One row per transaction."
    fields:
      status: "Set to expired."
      closed_date: "The day after expiration_date."
      refills_remaining: "Fills left at expiry (voided)."
    triggers:
      - event: rx:rx_fills_voided
        when: {refills_remaining: {not: 0}}
        map: {fill_date: closed_date, fills: refills_remaining, void_reason: expired}
  - type: rx_discontinued
    target: prescriptions
    mutation: {transition: [{from: active, to: discontinued}, {from: prescribed, to: discontinued}]}
    meaning: "The medication is stopped or the prescription withdrawn."
    grain: "One row per transaction."
    fields:
      status: "Set to discontinued."
      discontinue_reason: "Why it was stopped."
      closed_date: "Date of discontinuation."
      refills_remaining: "Fills left at discontinuation (voided)."
    triggers:
      - event: rx:rx_fills_voided
        when: {refills_remaining: {not: 0}}
        map: {fill_date: closed_date, fills: refills_remaining, void_reason: discontinued}
  - type: rx_pharmacy_changed
    target: prescriptions
    mutation: update
    meaning: "The remaining fills are moved to another pharmacy."
    grain: "One row per transaction."
    fields:
      pharmacy_name: "New pharmacy exactly as listed in the pharmacy directory."
      transfer_count: "Previous count plus one."
    triggers: []
  - type: rx_compliance_updated
    target: prescriptions
    mutation: update
    meaning: "A monitoring requirement is recorded: a resulted lab, a drug screen, a signed controlled-substance agreement, a database check or a prior-authorization decision."
    grain: "One row per transaction."
    fields:
      last_monitoring_lab_date: "Result date of the latest monitoring lab."
      last_drug_screen_date: "Date of the latest drug screen."
      controlled_agreement_signed_date: "Date the patient signed the current controlled-substance agreement."
      pdmp_checked_date: "Date of the latest prescription-monitoring database check."
      prior_auth_status: "Latest prior-authorization status."
    triggers: []
  - type: rx_fills_authorized
    target: rx_events
    meaning: "Fills are authorized by a new prescription, a renewal or a lost/stolen replacement."
    grain: "One row per authorization decision on one prescription."
    distinguish_by: [authorization_reason, fill_date]
    fields:
      fill_date: "Date of the authorization."
      fills: "Fills authorized (first fill plus refills, or 1 for a replacement)."
      days_supply_per_fill: "Days' supply of each authorized fill."
      authorization_reason: "new_prescription, renewal or replacement_fill."
      police_report_number: "Police report number for a stolen-medication replacement, exactly as given; empty otherwise."
    account: authorized_fills
    direction: in
    triggers: []
  - type: rx_bridge_supply_authorized
    target: rx_events
    meaning: "A one-time bridge fill is authorized while a renewal is on hold awaiting a visit or lab."
    grain: "One row per bridge authorization on one prescription."
    distinguish_by: [fill_date]
    fields:
      fill_date: "Date of the authorization."
      fills: "Always 1."
      days_supply_per_fill: "The tier's bridge_supply_days."
      authorization_reason: "bridge_supply."
    account: authorized_fills
    direction: in
    triggers: []
  - type: rx_fill_dispensed
    target: rx_events
    meaning: "The pharmacy reports dispensing one fill."
    grain: "One row per dispensing."
    distinguish_by: [fill_date, fill_basis]
    fields:
      fill_date: "Date dispensed."
      fills: "Always 1."
      days_supply_per_fill: "Days' supply dispensed."
      fill_basis: "regular, early_vacation_override, med_sync_short_fill, replacement or bridge."
      dispensing_pharmacy: "Pharmacy that dispensed, exactly as reported."
    account: authorized_fills
    direction: out
    triggers: []
  - type: rx_fills_voided
    target: rx_events
    meaning: "Fills still authorized are voided because the prescription expired, was discontinued, was superseded by a renewal, or moved away."
    grain: "One row per void on one prescription."
    distinguish_by: [void_reason, fill_date]
    fields:
      fill_date: "Date of the void."
      fills: "Fills voided."
      void_reason: "expired, discontinued, superseded_by_renewal or transferred_out."
    account: authorized_fills
    direction: out
    triggers: []

measures:
  - id: rx_msr_last_prescriber_visit
    window: "All history up to the handling date."
    measure: "The latest scheduled_date among the patient's appointments with status completed whose department equals the prescription's prescribing_department (in-person visits) or telehealth visits with status completed in that department."
  - id: rx_msr_bridges_12m
    window: "Rolling 12 calendar months ending on the handling date."
    measure: "Count of rx_bridge_supply_authorized rows on the prescription with fill_date inside the window."
  - id: rx_msr_vacation_overrides_12m
    window: "Rolling 12 calendar months ending on the handling date."
    measure: "Count of rx_fill_dispensed rows on the prescription with fill_basis early_vacation_override and fill_date inside the window."
  - id: rx_msr_replacements_12m
    window: "Rolling 12 calendar months ending on the handling date."
    measure: "Count of rx_fills_authorized rows on the prescription with authorization_reason replacement_fill and fill_date inside the window."
  - id: rx_msr_days_since_last_fill
    window: "From the most recent rx_fill_dispensed row of the prescription to the handling date."
    measure: "Calendar days from that row's fill_date to the handling date, together with that row's days_supply_per_fill."

policies:
  - id: rx_agg_multi_holding
    subject: [rx_prescribed]
    rule: >-
      A patient may hold any number of prescriptions for different medications. How many prescriptions of
      one medication may be open at once is governed by rx_agg_same_medication.
    eligibility: []
    params: {max_per_customer: null}

  - id: rx_agg_same_medication
    subject: [rx_prescribed]
    rule: >-
      A patient holds at most max_active_same_medication open prescriptions of one medication and strength.
      The patient holds no other prescription of the same medication and strength in status prescribed,
      active, renewal_requested or on_hold. A dose or strength change is a new prescription that discontinues
      the old one with reason replaced_by_new_prescription (and, where dose_change_requires_visit is true,
      only after a visit). Across medications, a patient may hold Schedule II and Schedule III-V controlled
      prescriptions only from one prescribing clinician at a time: a controlled prescription from a second
      Linden Ridge prescriber is not written while another prescriber's controlled prescription is open,
      unless the first is discontinued with reason transferred_care.
    eligibility:
      - id: no_open_same_medication
        applies_to: [rx_prescribed]
        kind: dedup
        condition: "The patient holds no other prescription of the same medication and strength in status prescribed, active, renewal_requested or on_hold."
        evidence_fields: [prescriptions.customer_id, prescriptions.medication_name, prescriptions.strength, prescriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.customer_id, prescriptions.medication_name, prescriptions.strength]]
          action_bindings: {prescriptions.customer_id: customer_id, prescriptions.medication_name: medication_name, prescriptions.strength: strength}
        dedup_contract:
          table: prescriptions
          mode: separate_record
          object_bindings: {customer_id: customer_id, medication_name: medication_name, strength: strength}
          duplicate_filters: {status: [prescribed, active, renewal_requested, on_hold]}
          distinct_fields: []

  - id: rx_renewal_eligibility
    subject: [rx_renewal_requested, rx_renewed, rx_renewal_held]
    rule: >-
      A renewal may be requested only where renewal_allowed is true (an Acute Short-Course Prescription needs a
      new visit), through a channel the tier allows (portal where portal_renewal_allowed is true, phone where
      phone_renewal_allowed is true, and always by the pharmacy's electronic request). An expired prescription
      may be renewed only shortly after it expired. The renewal of an expired prescription is requested no
      later than the tier's post-expiry window counted from the expiration date. That window is counted in
      calendar days starting the day after the expiration date, and a request on the last day still
      qualifies. A renewal is approved only when every requirement of the tier is current on the renewal
      date; otherwise it is put on hold naming the first missing requirement in this order: visit, lab,
      drug screen, agreement, database check, prior authorization. The visit requirement: the renewal date is
      no later than the tier's visit interval counted from the patient's most recent completed visit with the
      prescribing department (rx_msr_last_prescriber_visit). The interval is counted in calendar months from
      the visit date to the same day of the month, falling back to the last day of the month when that day
      does not exist, and a renewal on that day still qualifies. The lab requirement (where
      monitoring_lab_interval_months is above 0): last_monitoring_lab_date is within that many calendar months
      before the renewal date, counted the same way. The drug screen, agreement and database requirements
      follow rx_controlled_safeguards, and the prior-authorization requirement follows rx_specialty_access. A
      renewal whose last fill ran out more than adherence_gap_days_for_review ago needs the prescriber's
      review even where the refill protocol would otherwise apply. A request that asks to change the dose is
      not a renewal where dose_change_requires_visit is true.
    eligibility:
      - id: post_expiry_window
        applies_to: [rx_renewal_requested]
        kind: time
        condition: "The renewal of an expired prescription is requested no later than the tier's post-expiry window counted from the expiration date."
        evidence_fields: [prescriptions.expiration_date, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the expiration date"
          anchor_source: prescriptions.expiration_date
          relation: not_after
          duration_source: variants.renewal_after_expiry_days
          unit: calendar_days
          counting_rule: "That window is counted in calendar days starting the day after the expiration date, and a request on the last day still qualifies."
          boundary: inclusive
      - id: visit_current
        applies_to: [rx_renewed]
        kind: time
        condition: "the renewal date is no later than the tier's visit interval counted from the patient's most recent completed visit with the prescribing department"
        evidence_fields: [appointments.scheduled_date, appointments.status, appointments.department, appointments.appointment_id, prescriptions.prescribing_department]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[appointments.appointment_id]]
          action_bindings: {appointments.appointment_id: appointment_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the patient's most recent completed visit with the prescribing department"
          anchor_source: appointments.scheduled_date
          relation: not_after
          duration_source: variants.visit_interval_months
          unit: calendar_months
          counting_rule: "The interval is counted in calendar months from the visit date to the same day of the month, falling back to the last day of the month when that day does not exist, and a renewal on that day still qualifies."
          boundary: inclusive
    params:
      per_tier:
        Acute Short-Course Prescription: {visit_interval_months: "=visit_interval_months", monitoring_lab_interval_months: "=monitoring_lab_interval_months", renewal_after_expiry_days: "=renewal_after_expiry_days"}
        Standard Maintenance Prescription: {visit_interval_months: "=visit_interval_months", monitoring_lab_interval_months: "=monitoring_lab_interval_months", renewal_after_expiry_days: "=renewal_after_expiry_days"}
        Monitored Maintenance Prescription: {visit_interval_months: "=visit_interval_months", monitoring_lab_interval_months: "=monitoring_lab_interval_months", renewal_after_expiry_days: "=renewal_after_expiry_days"}
        Schedule III-V Controlled Prescription: {visit_interval_months: "=visit_interval_months", monitoring_lab_interval_months: "=monitoring_lab_interval_months", renewal_after_expiry_days: "=renewal_after_expiry_days"}
        Schedule II Controlled Prescription: {visit_interval_months: "=visit_interval_months", monitoring_lab_interval_months: "=monitoring_lab_interval_months", renewal_after_expiry_days: "=renewal_after_expiry_days"}
        Specialty Medication Prescription: {visit_interval_months: "=visit_interval_months", monitoring_lab_interval_months: "=monitoring_lab_interval_months", renewal_after_expiry_days: "=renewal_after_expiry_days"}
    measures: [rx_msr_last_prescriber_visit]

  - id: rx_fill_authorization
    subject: [rx_fills_authorized, rx_renewed, rx_fills_voided]
    rule: >-
      A new prescription or a renewal authorizes the first fill plus refills: the number of fills is the
      smaller of max_refills_per_authorization plus one and the whole number of fills of days_supply that fit
      in max_total_days_supply_per_authorization (rounded down), and one fill never exceeds
      max_days_supply_per_fill. A renewal approved under the nurse refill protocol (only where
      prescriber_review_required is false) authorizes at most protocol_renewal_max_refills refills plus the
      first fill. Fills are authorized only while the prescription status is active. A renewal replaces the
      old authorization: fills still left at the moment of renewal are voided as superseded_by_renewal before
      the new fills are granted, so fills never accumulate across renewals. A renewal sets a new
      expiration_date of the renewal date plus prescription_validity_days minus one. Complete renewal requests
      are decided within renewal_turnaround_business_days; a covering clinician may sign where
      covering_clinician_renewal_allowed is true.
    eligibility:
      - id: authorize_when_active
        applies_to: [rx_fills_authorized]
        kind: state
        condition: "Fills are authorized only while the prescription status is active."
        evidence_fields: [prescriptions.status, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}
        state_contract:
          field: prescriptions.status
          allowed: [active]
    params:
      per_tier:
        Acute Short-Course Prescription: {max_refills_per_authorization: "=max_refills_per_authorization", max_total_days_supply_per_authorization: "=max_total_days_supply_per_authorization", protocol_renewal_max_refills: "=protocol_renewal_max_refills"}
        Standard Maintenance Prescription: {max_refills_per_authorization: "=max_refills_per_authorization", max_total_days_supply_per_authorization: "=max_total_days_supply_per_authorization", protocol_renewal_max_refills: "=protocol_renewal_max_refills"}
        Monitored Maintenance Prescription: {max_refills_per_authorization: "=max_refills_per_authorization", max_total_days_supply_per_authorization: "=max_total_days_supply_per_authorization", protocol_renewal_max_refills: "=protocol_renewal_max_refills"}
        Schedule III-V Controlled Prescription: {max_refills_per_authorization: "=max_refills_per_authorization", max_total_days_supply_per_authorization: "=max_total_days_supply_per_authorization", protocol_renewal_max_refills: "=protocol_renewal_max_refills"}
        Schedule II Controlled Prescription: {max_refills_per_authorization: "=max_refills_per_authorization", max_total_days_supply_per_authorization: "=max_total_days_supply_per_authorization", protocol_renewal_max_refills: "=protocol_renewal_max_refills"}
        Specialty Medication Prescription: {max_refills_per_authorization: "=max_refills_per_authorization", max_total_days_supply_per_authorization: "=max_total_days_supply_per_authorization", protocol_renewal_max_refills: "=protocol_renewal_max_refills"}
    formula:
      fills: min(max_refills_per_authorization + 1, max_total_days_supply_per_authorization / days_supply)

  - id: rx_fill_timing
    subject: [rx_fill_dispensed]
    rule: >-
      A fill is dispensed only while the prescription status is active, on or before its expiration_date,
      and while refills_remaining is above 0. The next fill is due once early_refill_threshold_pct of the
      previous fill's days' supply has elapsed (rx_msr_days_since_last_fill); an earlier fill is refused
      unless it is a travel override (only where vacation_override_allowed is true and
      rx_msr_vacation_overrides_12m is below vacation_override_per_12_months), a medication-synchronization
      short fill of at most sync_short_fill_max_days (only where fill_sync_allowed is true), or an authorized
      replacement or bridge fill. Mail-order fills, where mail_order_allowed is true, dispense
      mail_order_days_supply; a specialty prescription is dispensed only by the designated specialty pharmacy.
      Where specialty_pharmacy_required is true only the designated specialty pharmacy may dispense.
    eligibility:
      - id: dispense_when_active
        applies_to: [rx_fill_dispensed]
        kind: state
        condition: "A fill is dispensed only while the prescription status is active, on or before its expiration_date, and while refills_remaining is above 0."
        evidence_fields: [prescriptions.status, prescriptions.expiration_date, prescriptions.refills_remaining, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}
        state_contract:
          field: prescriptions.status
          allowed: [active]
    params:
      per_tier:
        Acute Short-Course Prescription: {early_refill_threshold_pct: "=early_refill_threshold_pct", vacation_override_per_12_months: "=vacation_override_per_12_months"}
        Standard Maintenance Prescription: {early_refill_threshold_pct: "=early_refill_threshold_pct", vacation_override_per_12_months: "=vacation_override_per_12_months"}
        Monitored Maintenance Prescription: {early_refill_threshold_pct: "=early_refill_threshold_pct", vacation_override_per_12_months: "=vacation_override_per_12_months"}
        Schedule III-V Controlled Prescription: {early_refill_threshold_pct: "=early_refill_threshold_pct", vacation_override_per_12_months: "=vacation_override_per_12_months"}
        Schedule II Controlled Prescription: {early_refill_threshold_pct: "=early_refill_threshold_pct", vacation_override_per_12_months: "=vacation_override_per_12_months"}
        Specialty Medication Prescription: {early_refill_threshold_pct: "=early_refill_threshold_pct", vacation_override_per_12_months: "=vacation_override_per_12_months"}
    formula:
      earliest_regular_fill_day: round(days_supply_per_fill * early_refill_threshold_pct / 100, 0)
    measures: [rx_msr_days_since_last_fill, rx_msr_vacation_overrides_12m]

  - id: rx_bridge_supply
    subject: [rx_bridge_supply_authorized]
    rule: >-
      While a renewal is on hold because the visit or lab requirement is not current, a single bridge fill of
      bridge_supply_days may be authorized so the patient does not run out, where bridge_supply_allowed is
      true and rx_msr_bridges_12m is below bridge_supply_max_per_12_months. A bridge is authorized only
      while the prescription status is on_hold. Combination with appointments: the patient holds a booked or
      confirmed appointment with the prescribing department whose scheduled date falls within the tier's
      hold_resolution_days after the hold started. A bridge is never authorized for a hold caused by a drug
      screen, agreement, database check or prior authorization, and never for a controlled or specialty
      prescription.
    eligibility:
      - id: bridge_when_on_hold
        applies_to: [rx_bridge_supply_authorized]
        kind: state
        condition: "A bridge is authorized only while the prescription status is on_hold."
        evidence_fields: [prescriptions.status, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}
        state_contract:
          field: prescriptions.status
          allowed: [on_hold]
      - id: visit_booked
        applies_to: [rx_bridge_supply_authorized]
        kind: authorization
        condition: "the patient holds a booked or confirmed appointment with the prescribing department whose scheduled date falls within the tier's hold_resolution_days after the hold started."
        evidence_fields: [appointments.status, appointments.department, appointments.scheduled_date, appointments.appointment_id, prescriptions.hold_started_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[appointments.appointment_id]]
          action_bindings: {appointments.appointment_id: appointment_id}
    params:
      per_tier:
        Acute Short-Course Prescription: {bridge_supply_days: "=bridge_supply_days", bridge_supply_max_per_12_months: "=bridge_supply_max_per_12_months"}
        Standard Maintenance Prescription: {bridge_supply_days: "=bridge_supply_days", bridge_supply_max_per_12_months: "=bridge_supply_max_per_12_months"}
        Monitored Maintenance Prescription: {bridge_supply_days: "=bridge_supply_days", bridge_supply_max_per_12_months: "=bridge_supply_max_per_12_months"}
        Schedule III-V Controlled Prescription: {bridge_supply_days: "=bridge_supply_days", bridge_supply_max_per_12_months: "=bridge_supply_max_per_12_months"}
        Schedule II Controlled Prescription: {bridge_supply_days: "=bridge_supply_days", bridge_supply_max_per_12_months: "=bridge_supply_max_per_12_months"}
        Specialty Medication Prescription: {bridge_supply_days: "=bridge_supply_days", bridge_supply_max_per_12_months: "=bridge_supply_max_per_12_months"}
    measures: [rx_msr_bridges_12m]

  - id: rx_hold_lapse
    subject: [rx_renewal_held, rx_renewal_declined]
    rule: >-
      The patient is told within hold_notification_business_days business days why a renewal is on hold and
      what completes it. Completing the requirement (a completed visit, a resulted lab or screen, a signed
      agreement, a database check, an approved prior authorization) lets the renewal be approved from hold. A
      hold lapses into a decline when it is not resolved in time. A hold lapses only after it has lasted
      longer than the tier's hold resolution days counted from the date the hold started. The hold is counted
      in calendar days starting the day after the hold started, and the lapse may be recorded only from the
      day after the last counted day. A lapsed renewal is recorded as declined with reason hold_lapsed; the
      patient then needs a visit and a new prescription. A prescriber may decline a renewal at any time for
      clinical reasons (reason renewal_denied); that decision belongs to the prescriber alone.
    eligibility:
      - id: hold_lasted
        applies_to: [rx_renewal_declined]
        kind: time
        condition: "A hold lapses only after it has lasted longer than the tier's hold resolution days counted from the date the hold started."
        evidence_fields: [prescriptions.hold_started_date, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date the hold started"
          anchor_source: prescriptions.hold_started_date
          relation: not_before
          duration_source: variants.hold_resolution_days
          unit: calendar_days
          counting_rule: "The hold is counted in calendar days starting the day after the hold started, and the lapse may be recorded only from the day after the last counted day."
          boundary: exclusive
    params:
      per_tier:
        Acute Short-Course Prescription: {hold_resolution_days: "=hold_resolution_days", hold_notification_business_days: "=hold_notification_business_days"}
        Standard Maintenance Prescription: {hold_resolution_days: "=hold_resolution_days", hold_notification_business_days: "=hold_notification_business_days"}
        Monitored Maintenance Prescription: {hold_resolution_days: "=hold_resolution_days", hold_notification_business_days: "=hold_notification_business_days"}
        Schedule III-V Controlled Prescription: {hold_resolution_days: "=hold_resolution_days", hold_notification_business_days: "=hold_notification_business_days"}
        Schedule II Controlled Prescription: {hold_resolution_days: "=hold_resolution_days", hold_notification_business_days: "=hold_notification_business_days"}
        Specialty Medication Prescription: {hold_resolution_days: "=hold_resolution_days", hold_notification_business_days: "=hold_notification_business_days"}

  - id: rx_controlled_safeguards
    subject: [rx_renewed, rx_compliance_updated]
    rule: >-
      For a tier whose controlled_agreement_required is true, a controlled prescription is renewed only
      when a controlled-substance agreement signed by the patient within controlled_agreement_renewal_months
      calendar months of the renewal date is on file, a drug screen dated within drug_screen_interval_months
      is on file, and, where pdmp_check_required is true, the prescription-monitoring database was checked
      within pdmp_check_validity_days calendar days of the renewal date. Signing the agreement is the
      patient's own act; nobody signs it for the patient. A Schedule II Controlled Prescription has no
      refills: every fill needs its own prescription, it cannot be transferred between pharmacies, and it is
      transmitted only electronically where epcs_required is true. Controlled prescriptions never receive a
      travel override, a bridge supply or a lost or stolen replacement.
      The tier's dea_schedule (II or III-V, none for the other classes) identifies which of these
      safeguards apply.
    eligibility:
      - id: agreement_current
        applies_to: [rx_renewed]
        kind: authorization
        condition: "For a tier whose controlled_agreement_required is true, a controlled prescription is renewed only when a controlled-substance agreement signed by the patient within controlled_agreement_renewal_months calendar months of the renewal date is on file"
        evidence_fields: [prescriptions.controlled_agreement_signed_date, prescriptions.last_drug_screen_date, prescriptions.pdmp_checked_date, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}
    params:
      per_tier:
        Acute Short-Course Prescription: {controlled_agreement_renewal_months: "=controlled_agreement_renewal_months", drug_screen_interval_months: "=drug_screen_interval_months", pdmp_check_validity_days: "=pdmp_check_validity_days"}
        Standard Maintenance Prescription: {controlled_agreement_renewal_months: "=controlled_agreement_renewal_months", drug_screen_interval_months: "=drug_screen_interval_months", pdmp_check_validity_days: "=pdmp_check_validity_days"}
        Monitored Maintenance Prescription: {controlled_agreement_renewal_months: "=controlled_agreement_renewal_months", drug_screen_interval_months: "=drug_screen_interval_months", pdmp_check_validity_days: "=pdmp_check_validity_days"}
        Schedule III-V Controlled Prescription: {controlled_agreement_renewal_months: "=controlled_agreement_renewal_months", drug_screen_interval_months: "=drug_screen_interval_months", pdmp_check_validity_days: "=pdmp_check_validity_days"}
        Schedule II Controlled Prescription: {controlled_agreement_renewal_months: "=controlled_agreement_renewal_months", drug_screen_interval_months: "=drug_screen_interval_months", pdmp_check_validity_days: "=pdmp_check_validity_days"}
        Specialty Medication Prescription: {controlled_agreement_renewal_months: "=controlled_agreement_renewal_months", drug_screen_interval_months: "=drug_screen_interval_months", pdmp_check_validity_days: "=pdmp_check_validity_days"}

  - id: rx_pharmacy_transfer
    subject: [rx_pharmacy_changed, rx_fills_voided]
    rule: >-
      A patient may move the remaining fills of a prescription to another pharmacy where transfer_allowed is
      true; the prescription keeps its fills and expiration and only the pharmacy changes. Where
      one_time_transfer_only is true, a prescription whose transfer_count is already 1 or more cannot be
      transferred again. The prescription status is active or renewal_requested when the pharmacy is changed.
      A Schedule II prescription is not transferred: the patient asks for the next prescription to be sent to
      the new pharmacy. A specialty prescription can move only between designated specialty pharmacies. A
      patient moving all care to an outside practice has open prescriptions discontinued with reason
      transferred_care, and their remaining fills are voided.
    eligibility:
      - id: transferable_status
        applies_to: [rx_pharmacy_changed]
        kind: state
        condition: "The prescription status is active or renewal_requested when the pharmacy is changed."
        evidence_fields: [prescriptions.status, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}
        state_contract:
          field: prescriptions.status
          allowed: [active, renewal_requested]
    params:
      per_tier:
        Acute Short-Course Prescription: {transfer_allowed: "=transfer_allowed", one_time_transfer_only: "=one_time_transfer_only"}
        Standard Maintenance Prescription: {transfer_allowed: "=transfer_allowed", one_time_transfer_only: "=one_time_transfer_only"}
        Monitored Maintenance Prescription: {transfer_allowed: "=transfer_allowed", one_time_transfer_only: "=one_time_transfer_only"}
        Schedule III-V Controlled Prescription: {transfer_allowed: "=transfer_allowed", one_time_transfer_only: "=one_time_transfer_only"}
        Schedule II Controlled Prescription: {transfer_allowed: "=transfer_allowed", one_time_transfer_only: "=one_time_transfer_only"}
        Specialty Medication Prescription: {transfer_allowed: "=transfer_allowed", one_time_transfer_only: "=one_time_transfer_only"}

  - id: rx_lost_stolen_replacement
    subject: [rx_fills_authorized]
    rule: >-
      Where lost_stolen_replacement_allowed is true, one replacement fill may be authorized for medication
      that was lost or stolen, when rx_msr_replacements_12m is below lost_stolen_replacement_per_12_months;
      it is posted with authorization_reason replacement_fill and one fill. Where
      police_report_required_for_replacement is true, a stolen-medication replacement needs the police report
      number, recorded exactly as the patient gives it. A replacement is never authorized for controlled
      prescriptions, and damaged or spilled medication is treated as lost.
    eligibility: []
    params:
      per_tier:
        Acute Short-Course Prescription: {lost_stolen_replacement_per_12_months: "=lost_stolen_replacement_per_12_months"}
        Standard Maintenance Prescription: {lost_stolen_replacement_per_12_months: "=lost_stolen_replacement_per_12_months"}
        Monitored Maintenance Prescription: {lost_stolen_replacement_per_12_months: "=lost_stolen_replacement_per_12_months"}
        Schedule III-V Controlled Prescription: {lost_stolen_replacement_per_12_months: "=lost_stolen_replacement_per_12_months"}
        Schedule II Controlled Prescription: {lost_stolen_replacement_per_12_months: "=lost_stolen_replacement_per_12_months"}
        Specialty Medication Prescription: {lost_stolen_replacement_per_12_months: "=lost_stolen_replacement_per_12_months"}
    measures: [rx_msr_replacements_12m]

  - id: rx_specialty_access
    subject: [rx_transmitted, rx_compliance_updated]
    rule: >-
      Where prior_auth_required is true, a prescription is transmitted, and a renewal approved, only after
      the payer's prior authorization is recorded as approved; the benefits investigation is completed within
      benefits_investigation_business_days business days, copay assistance enrollment is offered where
      copay_assistance_offered is true, and medication teaching is completed before the first fill where
      patient_education_required is true. A specialty prescription is filled only by a designated specialty
      pharmacy. A denied prior authorization leaves the prescription untransmitted, and it is discontinued if
      the payer's appeal is not pursued. A Self-Pay Account patient needs no prior authorization but pays the
      pharmacy's cash price.
    eligibility:
      - id: pa_approved
        applies_to: [rx_transmitted]
        kind: authorization
        condition: "Where prior_auth_required is true, a prescription is transmitted, and a renewal approved, only after the payer's prior authorization is recorded as approved"
        evidence_fields: [prescriptions.prior_auth_status, prescriptions.prescription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[prescriptions.prescription_id]]
          action_bindings: {prescriptions.prescription_id: prescription_id}

  - id: rx_expiry_and_discontinuation
    subject: [rx_expired, rx_discontinued, rx_fills_voided]
    rule: >-
      A prescription expires the day after its expiration_date whether or not fills remain; unfilled fills
      are voided with reason expired. A prescription is discontinued when the prescriber stops the
      medication, when the patient asks to stop it, when a new strength replaces it, or when care moves to an
      outside practice; remaining fills are voided with reason discontinued. A patient's request to stop a
      medication is recorded as asked but is sent to the prescriber for acknowledgement, and it never
      discontinues other prescriptions. Refill reminders go out refill_reminder_days_before_runout days before
      the estimated run-out, and patients are asked to request renewals renewal_request_lead_days business
      days ahead.
    eligibility: []

# ============================================================================
# extended_policies — prescription_renewal_handling (each claimed by exactly one task)
# ============================================================================
extended_policies:
  - id: rx_ext_retail_move_fill_days
    base_policy_refs: [rx_pharmacy_transfer, rx_fill_authorization]
    overwrite:
      - base_policy: rx_pharmacy_transfer
        superseded_clause: >-
          the prescription keeps its fills and expiration and only the pharmacy changes
        replaced_by: >-
          the prescription keeps its fills and its expiration date, and its per-fill days' supply at
          the retail pharmacy becomes the retail fill length set out in this policy
    trigger: on_request
    subject: [rx_pharmacy_changed]
    computes: days_supply
    target_tool: move_prescription_pharmacy_221e1a97
    params:
      retail_standard_days: 30
      payer_medicaid_days: 34
      payer_medicare_days: 60
      payer_commercial_days: 90
      adherence_window_months: 12
      adherent_days_min: 330
      partial_days_min: 270
      adherent_allowance_days: 90
      partial_allowance_days: 60
      recent_visit_days: 183
      year_visit_days: 365
      recent_visit_allowance_days: 90
      year_visit_allowance_days: 60
    rule: >-
      A prescription the patient moves to a retail pharmacy is dispensed there in fills of the retail
      standard of 30 days. The retail fill length is recorded on the prescription at the moment the
      patient moves it, and it is the days' supply every later fill of that prescription dispenses at
      the retail pharmacy. When a patient moves a prescription to a retail pharmacy, the prescription
      keeps its fills and its expiration date, and its per-fill days' supply at the retail pharmacy
      becomes the retail fill length set out in this policy. The retail fill length is the shortest of
      four allowances, each worked out on the day of the move in whole days: the payer allowance, the adherence allowance, the authorization-span allowance and the visit
      allowance, and it never exceeds the largest days' supply per fill of the prescription's class. The payer
      allowance follows the financial class recorded on the patient's billing account: a Medicaid
      Managed Care Account allows 34 days; a Medicare Advantage Account or a Medicare Part B Account
      allows 60 days; a Commercial PPO/POS Account or a Commercial HMO/EPO Account allows 90 days; any
      other financial class allows the retail standard of 30 days. The adherence allowance follows the
      days' supply dispensed on this prescription in the last 12 calendar months, adding up the days'
      supply of every dispensing whose date falls inside that window: 330 days or more allows 90 days;
      at least 270 but under 330 days allows 60 days; under 270 days allows the retail standard of 30
      days. The authorization-span allowance follows the fills the prescription still authorizes, the
      per-fill days' supply the prescription carries before the move, and the calendar days from the
      day of the move to its expiration date: where at least one fill remains and those fills, each at
      the per-fill days' supply the prescription carries, would run past the expiration date, it is
      those days divided evenly among the fills remaining, rounded down to a whole day; where at least
      one fill remains and those fills would end on or before the expiration date, it is the per-fill
      days' supply the prescription carries; where no fill remains, it is the retail standard of 30
      days. The visit allowance follows the calendar days from the patient's latest
      completed in-person visit with the prescribing department to the day of the move, a virtual
      visit not counting: 183 days or fewer allows 90 days; more than 183 but no more than 365 days
      allows 60 days; more than 365 days, or no such visit, allows the retail standard of 30 days. A
      move to a mail-order pharmacy is dispensed at the mail-order days' supply and is outside this
      policy.
    prerequisite: []
    cross_category:
      - category: billing
        as: branch
        reads: [variant_name]
        note: the payer allowance tier is decided by the financial class on the patient's billing account.
      - category: appointment
        as: history
        reads: [appointments.scheduled_date, appointments.status, appointments.department]
        note: the visit allowance tier is decided by the latest completed in-person visit with the prescribing department.
    compute:
      - billing_class: "CFIELD('billing','variant_name')"
      - payer_allowance: "K('payer_medicaid_days') if billing_class == 'Medicaid Managed Care Account' else (K('payer_medicare_days') if (billing_class == 'Medicare Advantage Account' or billing_class == 'Medicare Part B Account') else (K('payer_commercial_days') if (billing_class == 'Commercial PPO/POS Account' or billing_class == 'Commercial HMO/EPO Account') else K('retail_standard_days')))"
      - days_dispensed_year: "SUM('rx_events','days_supply_per_fill', within_months=K('adherence_window_months'), date_field='fill_date', event_type='rx_fill_dispensed')"
      - adherence_allowance: "K('adherent_allowance_days') if days_dispensed_year >= K('adherent_days_min') else (K('partial_allowance_days') if days_dispensed_year >= K('partial_days_min') else K('retail_standard_days'))"
      - fills_left: "F('refills_remaining')"
      - days_to_expiry: "DAYS(NOW, F('expiration_date'))"
      - written_fill_days: "F('days_supply')"
      - span_allowance: "(days_to_expiry // fills_left) if (fills_left >= 1 and fills_left * written_fill_days > days_to_expiry) else (written_fill_days if fills_left >= 1 else K('retail_standard_days'))"
      - last_inperson_visit: "XLATEST('appointment','appointments','scheduled_date', date_field='scheduled_date', status='completed', department=F('prescribing_department'))"
      - days_since_visit: "DAYS(last_inperson_visit, NOW) if last_inperson_visit else 100000"
      - visit_allowance: "K('recent_visit_allowance_days') if days_since_visit <= K('recent_visit_days') else (K('year_visit_allowance_days') if days_since_visit <= K('year_visit_days') else K('retail_standard_days'))"
      - result: "MN(payer_allowance, adherence_allowance, span_allowance, visit_allowance, P('max_days_supply_per_fill'))"
    compute_basis:
      billing_class: "The payer allowance follows the financial class recorded on the patient's billing account"
      payer_allowance: "a Medicaid Managed Care Account allows 34 days; a Medicare Advantage Account or a Medicare Part B Account allows 60 days; a Commercial PPO/POS Account or a Commercial HMO/EPO Account allows 90 days; any other financial class allows the retail standard of 30 days."
      days_dispensed_year: "The adherence allowance follows the days' supply dispensed on this prescription in the last 12 calendar months, adding up the days' supply of every dispensing whose date falls inside that window"
      adherence_allowance: "330 days or more allows 90 days; at least 270 but under 330 days allows 60 days; under 270 days allows the retail standard of 30 days."
      fills_left: "The authorization-span allowance follows the fills the prescription still authorizes"
      days_to_expiry: "the calendar days from the day of the move to its expiration date"
      written_fill_days: "the per-fill days' supply the prescription carries before the move"
      span_allowance: "where at least one fill remains and those fills, each at the per-fill days' supply the prescription carries, would run past the expiration date, it is those days divided evenly among the fills remaining, rounded down to a whole day; where at least one fill remains and those fills would end on or before the expiration date, it is the per-fill days' supply the prescription carries; where no fill remains, it is the retail standard of 30 days."
      last_inperson_visit: "The visit allowance follows the calendar days from the patient's latest completed in-person visit with the prescribing department to the day of the move, a virtual visit not counting"
      visit_allowance: "183 days or fewer allows 90 days; more than 183 but no more than 365 days allows 60 days; more than 365 days, or no such visit, allows the retail standard of 30 days."
      result: "The retail fill length is the shortest of four allowances, each worked out on the day of the move in whole days: the payer allowance, the adherence allowance, the authorization-span allowance and the visit allowance, and it never exceeds the largest days' supply per fill of the prescription's class."
    factors:
      - id: payer_retail_allowance
        effect: parameter
        decides: payer_allowance
        bindings: [billing_class, payer_allowance]
        ladder:
          - {when: "the billing account is a Medicaid Managed Care Account", value: "K('payer_medicaid_days') = 34 days"}
          - {when: "the billing account is a Medicare Advantage Account or a Medicare Part B Account", value: "K('payer_medicare_days') = 60 days"}
          - {when: "the billing account is a Commercial PPO/POS Account or a Commercial HMO/EPO Account", value: "K('payer_commercial_days') = 90 days"}
          - {when: "otherwise", value: "K('retail_standard_days') = 30 days"}
        baseline: {payer_allowance: "K('retail_standard_days')"}
        evidence: [cross_category]
        cross_difficulty: billing
      - id: dispensing_adherence_allowance
        effect: parameter
        decides: adherence_allowance
        bindings: [days_dispensed_year, adherence_allowance]
        ladder:
          - {when: "330 or more days' supply dispensed on the prescription in the last 12 calendar months", value: "K('adherent_allowance_days') = 90 days"}
          - {when: "at least 270 but under 330 days' supply dispensed in that window", value: "K('partial_allowance_days') = 60 days"}
          - {when: "otherwise (under 270 days' supply)", value: "K('retail_standard_days') = 30 days"}
        baseline: {adherence_allowance: "K('retail_standard_days')"}
        evidence: [history]
        cross_difficulty: null
      - id: authorization_span_allowance
        effect: method
        decides: span_allowance
        bindings: [fills_left, days_to_expiry, written_fill_days, span_allowance]
        ladder:
          - {when: "at least one fill remains AND those fills at the per-fill days' supply the prescription carries would run past the expiration date", method: "fit the fills to the authorization: the calendar days from the move to the expiration date divided evenly among the fills remaining, rounded down to a whole day"}
          - {when: "at least one fill remains AND those fills would end on or before the expiration date", method: "keep the fill length as written: the per-fill days' supply the prescription carries before the move"}
          - {when: "otherwise (no fill remains)", method: "the retail standard of 30 days"}
        baseline: {span_allowance: "K('retail_standard_days')"}
        evidence: [date, history]
        cross_difficulty: null
      - id: visit_recency_allowance
        effect: parameter
        decides: visit_allowance
        bindings: [last_inperson_visit, days_since_visit, visit_allowance]
        ladder:
          - {when: "the latest completed in-person visit with the prescribing department was 183 days ago or fewer", value: "K('recent_visit_allowance_days') = 90 days"}
          - {when: "that visit was more than 183 but no more than 365 days ago", value: "K('year_visit_allowance_days') = 60 days"}
          - {when: "otherwise (more than 365 days ago, or no such visit)", value: "K('retail_standard_days') = 30 days"}
        baseline: {visit_allowance: "K('retail_standard_days')"}
        evidence: [cross_category, date]
        cross_difficulty: appointment
    baseline:
      rule: >-
        A prescription the patient moves to a retail pharmacy is dispensed there in fills of the retail
        standard of 30 days. The retail fill length is recorded on the prescription at the moment the
        patient moves it, and it is the days' supply every later fill of that prescription dispenses at
        the retail pharmacy.
      params: [retail_standard_days]
    inputs:
      history:
        - {table: rx_events, aggregate: sum, field: days_supply_per_fill, within_months: 12, filters: {event_type: rx_fill_dispensed}}
        - {category: appointment, table: appointments, aggregate: latest, field: scheduled_date, filters: {status: completed}}
      cross_category: [billing, appointment]

  - id: rx_ext_replacement_fill_days
    base_policy_refs: [rx_fill_authorization, rx_lost_stolen_replacement, rx_fill_timing]
    overwrite: []
    trigger: on_request
    subject: [rx_fills_authorized]
    computes: days_supply_per_fill
    target_tool: authorize_replacement_fill_7c6c01e8
    params:
      fresh_window_days: 14
      late_window_days: 60
      share_medicaid_pct: 85
      share_medicare_pct: 80
      share_commercial_pct: 70
      prior_window_months: 24
      missed_window_months: 12
      repeat_attended_pct: 75
      repeat_missed_pct: 50
      full_pct: 100
      no_credit_days: 0
      overdue_visit_days: 270
      trim_unbooked_days: 21
      trim_booked_days: 7
      no_trim_days: 0
    rule: >-
      A replacement fill for lost, stolen or damaged medication dispenses one regular fill of the
      prescription, that is, the per-fill days' supply recorded on the prescription. The replacement
      fill is posted as one fill on the day it is authorized, and its days' supply is a whole number of
      days. A replacement fill's days' supply is fixed only after the prescription stands at a retail
      pharmacy rather than at a mail-order pharmacy. The replacement days are worked out in this
      order. First, the lost supply is counted from the prescription's most recent
      dispensing, using the calendar days from that dispensing's date to the day of the replacement:
      where that is 14 days or fewer, the lost supply is the days until the next regular fill would
      have fallen due, that is, the early-refill share of the dispensing's days' supply rounded up to a
      whole day, less the days already elapsed; where it is 15 to 60 days, the lost supply is the days
      that dispensing would still have covered, that is, its days' supply less the days elapsed; where
      it is more than 60 days, the lost supply is one regular fill. The early-refill share used for this
      count follows the financial class recorded on the patient's billing account: a Medicaid Managed
      Care Account uses 85 percent; a Medicare Advantage Account or a Medicare Part B Account uses 80
      percent; a Commercial PPO/POS Account or a Commercial HMO/EPO Account uses 70 percent; any other
      financial class uses the early-refill percentage of the prescription's class. Second, the fills
      the prescription still authorizes are credited against the lost supply, because they remain
      available to the patient: where at least one fill remains and the expiration date is more than
      one per-fill days' supply away, the credit is the fills remaining multiplied by the per-fill days'
      supply; where at least one fill remains but the expiration date is no more than one per-fill
      days' supply away, the credit is the smaller of the days to the expiration date and one per-fill
      days' supply; where no fill remains, there is no credit. Third, the lost supply less the credit
      is multiplied by the replaced share, and any fraction of a day is dropped: where an earlier
      replacement fill was posted on this prescription in the last 24 calendar months and the patient
      has no missed visit with the prescribing department in the last 12 calendar months, the share is
      75 percent; where there was such an earlier replacement and the patient has one or more missed
      visits with that department in those 12 months, the share is 50 percent; otherwise the share is
      100 percent. Fourth, a follow-up trim is subtracted: where the patient's latest completed
      in-person visit with the prescribing department was more than 270 days before the day of the
      replacement and no visit with that department is booked or confirmed, the trim is 21 days; where
      that visit was more than 270 days before and a visit with that department is booked or confirmed,
      the trim is 7 days; otherwise there is no trim. The replacement days are never below zero. A
      replacement is authorized only where the prescription's class allows lost or stolen replacement
      and no replacement fill was posted on it in the rolling 12 months, never for a controlled
      prescription, and a stolen-medication replacement of a class that requires a police report
      carries the police report number exactly as the patient gives it.
    prerequisite:
      - problem: rx_ext_retail_move_fill_days
        kind: value_input
        gate: fill_days
        form: state
        policy_source: >-
          A replacement fill's days' supply is fixed only after the prescription stands at a retail
          pharmacy rather than at a mail-order pharmacy.
        condition: >-
          prescriptions.pharmacy_name names a retail pharmacy rather than a mail-order pharmacy
        resolved_by: move_prescription_pharmacy_221e1a97
        effect: >-
          once the prescription stands at the retail pharmacy, the per-fill days' supply the replacement
          reads (binding fill_days, used by the credit for the fills still authorized) is the retail fill
          length recorded at the move instead of the mail-order days' supply
    cross_category:
      - category: billing
        as: branch
        reads: [variant_name]
        note: the early-refill share tier used to count the lost supply is decided by the financial class on the billing account.
      - category: appointment
        as: history
        reads: [appointments.scheduled_date, appointments.status, appointments.department]
        note: the replaced share tier reads missed visits and the follow-up trim tier reads the latest completed and any booked visit with the prescribing department.
    compute:
      - latest_fill_date: "LATEST('rx_events','fill_date', date_field='fill_date', event_type='rx_fill_dispensed')"
      - latest_fill_days: "LATEST('rx_events','days_supply_per_fill', date_field='fill_date', event_type='rx_fill_dispensed')"
      - days_since_fill: "DAYS(latest_fill_date, NOW)"
      - fill_days: "F('days_supply')"
      - billing_class: "CFIELD('billing','variant_name')"
      - early_share: "K('share_medicaid_pct') if billing_class == 'Medicaid Managed Care Account' else (K('share_medicare_pct') if (billing_class == 'Medicare Advantage Account' or billing_class == 'Medicare Part B Account') else (K('share_commercial_pct') if (billing_class == 'Commercial PPO/POS Account' or billing_class == 'Commercial HMO/EPO Account') else P('early_refill_threshold_pct')))"
      - lost_days: "(-((-(latest_fill_days * early_share)) // 100) - days_since_fill) if days_since_fill <= K('fresh_window_days') else ((latest_fill_days - days_since_fill) if days_since_fill <= K('late_window_days') else fill_days)"
      - fills_left: "F('refills_remaining')"
      - days_to_expiry: "DAYS(NOW, F('expiration_date'))"
      - credit_days: "(fills_left * fill_days) if (fills_left >= 1 and days_to_expiry > fill_days) else (MN(days_to_expiry, fill_days) if fills_left >= 1 else K('no_credit_days'))"
      - prior_replacements: "COUNT('rx_events', within_months=K('prior_window_months'), date_field='fill_date', event_type='rx_fills_authorized', authorization_reason='replacement_fill')"
      - missed_visits: "XCOUNT('appointment','appointments', within_months=K('missed_window_months'), date_field='scheduled_date', status='no_show', department=F('prescribing_department'))"
      - replaced_share: "K('repeat_attended_pct') if (prior_replacements >= 1 and missed_visits == 0) else (K('repeat_missed_pct') if (prior_replacements >= 1 and missed_visits >= 1) else K('full_pct'))"
      - last_inperson_visit: "XLATEST('appointment','appointments','scheduled_date', date_field='scheduled_date', status='completed', department=F('prescribing_department'))"
      - days_since_visit: "DAYS(last_inperson_visit, NOW) if last_inperson_visit else 100000"
      - upcoming_visits: "XCOUNT('appointment','appointments', status='booked', department=F('prescribing_department')) + XCOUNT('appointment','appointments', status='confirmed', department=F('prescribing_department'))"
      - followup_trim: "K('trim_unbooked_days') if (days_since_visit > K('overdue_visit_days') and upcoming_visits == 0) else (K('trim_booked_days') if (days_since_visit > K('overdue_visit_days') and upcoming_visits >= 1) else K('no_trim_days'))"
      - result: "MX(0, int((lost_days - credit_days) * replaced_share / 100) - followup_trim)"
    compute_basis:
      latest_fill_date: "the lost supply is counted from the prescription's most recent dispensing, using the calendar days from that dispensing's date to the day of the replacement"
      latest_fill_days: "the early-refill share of the dispensing's days' supply rounded up to a whole day"
      days_since_fill: "using the calendar days from that dispensing's date to the day of the replacement"
      fill_days: "A replacement fill for lost, stolen or damaged medication dispenses one regular fill of the prescription, that is, the per-fill days' supply recorded on the prescription."
      billing_class: "The early-refill share used for this count follows the financial class recorded on the patient's billing account"
      early_share: "a Medicaid Managed Care Account uses 85 percent; a Medicare Advantage Account or a Medicare Part B Account uses 80 percent; a Commercial PPO/POS Account or a Commercial HMO/EPO Account uses 70 percent; any other financial class uses the early-refill percentage of the prescription's class."
      lost_days: "where that is 14 days or fewer, the lost supply is the days until the next regular fill would have fallen due, that is, the early-refill share of the dispensing's days' supply rounded up to a whole day, less the days already elapsed; where it is 15 to 60 days, the lost supply is the days that dispensing would still have covered, that is, its days' supply less the days elapsed; where it is more than 60 days, the lost supply is one regular fill."
      fills_left: "Second, the fills the prescription still authorizes are credited against the lost supply, because they remain available to the patient"
      days_to_expiry: "where at least one fill remains and the expiration date is more than one per-fill days' supply away"
      credit_days: "where at least one fill remains and the expiration date is more than one per-fill days' supply away, the credit is the fills remaining multiplied by the per-fill days' supply; where at least one fill remains but the expiration date is no more than one per-fill days' supply away, the credit is the smaller of the days to the expiration date and one per-fill days' supply; where no fill remains, there is no credit."
      prior_replacements: "where an earlier replacement fill was posted on this prescription in the last 24 calendar months"
      missed_visits: "the patient has no missed visit with the prescribing department in the last 12 calendar months"
      replaced_share: "where an earlier replacement fill was posted on this prescription in the last 24 calendar months and the patient has no missed visit with the prescribing department in the last 12 calendar months, the share is 75 percent; where there was such an earlier replacement and the patient has one or more missed visits with that department in those 12 months, the share is 50 percent; otherwise the share is 100 percent."
      last_inperson_visit: "where the patient's latest completed in-person visit with the prescribing department was more than 270 days before the day of the replacement"
      upcoming_visits: "no visit with that department is booked or confirmed"
      followup_trim: "Fourth, a follow-up trim is subtracted: where the patient's latest completed in-person visit with the prescribing department was more than 270 days before the day of the replacement and no visit with that department is booked or confirmed, the trim is 21 days; where that visit was more than 270 days before and a visit with that department is booked or confirmed, the trim is 7 days; otherwise there is no trim."
      result: "Third, the lost supply less the credit is multiplied by the replaced share, and any fraction of a day is dropped ... The replacement days are never below zero."
    factors:
      - id: lost_supply_count
        effect: method
        decides: lost_days
        bindings: [latest_fill_date, latest_fill_days, days_since_fill, lost_days]
        ladder:
          - {when: "the most recent dispensing was 14 days or fewer before the replacement", method: "the days until the next regular fill would have fallen due: the early-refill share of that dispensing's days' supply, rounded up to a whole day, less the days elapsed"}
          - {when: "the most recent dispensing was 15 to 60 days before", method: "the days that dispensing would still have covered: its days' supply less the days elapsed"}
          - {when: "otherwise (more than 60 days before)", method: "one regular fill: the per-fill days' supply recorded on the prescription"}
        baseline: {lost_days: "fill_days"}
        evidence: [history, date]
        cross_difficulty: null
      - id: payer_early_refill_share
        effect: parameter
        decides: early_share
        bindings: [billing_class, early_share]
        ladder:
          - {when: "the billing account is a Medicaid Managed Care Account", value: "K('share_medicaid_pct') = 85 percent"}
          - {when: "the billing account is a Medicare Advantage Account or a Medicare Part B Account", value: "K('share_medicare_pct') = 80 percent"}
          - {when: "the billing account is a Commercial PPO/POS Account or a Commercial HMO/EPO Account", value: "K('share_commercial_pct') = 70 percent"}
          - {when: "otherwise", value: "P('early_refill_threshold_pct'), the class's early-refill percentage"}
        baseline: {early_share: "P('early_refill_threshold_pct')"}
        evidence: [cross_category, tier_param]
        cross_difficulty: billing
      - id: standing_fill_credit
        effect: method
        decides: credit_days
        bindings: [fills_left, days_to_expiry, credit_days]
        ladder:
          - {when: "at least one fill remains and the expiration date is more than one per-fill days' supply away", method: "credit the fills remaining multiplied by the per-fill days' supply"}
          - {when: "at least one fill remains and the expiration date is no more than one per-fill days' supply away", method: "credit the smaller of the days to the expiration date and one per-fill days' supply"}
          - {when: "otherwise (no fill remains)", method: "no credit"}
        baseline: {credit_days: "K('no_credit_days')"}
        evidence: [history, date]
        cross_difficulty: null
      - id: repeat_loss_share
        effect: parameter
        decides: replaced_share
        bindings: [prior_replacements, missed_visits, replaced_share]
        ladder:
          - {when: "an earlier replacement fill in the last 24 calendar months AND no missed visit with the prescribing department in the last 12 calendar months", value: "K('repeat_attended_pct') = 75 percent"}
          - {when: "an earlier replacement fill in the last 24 calendar months AND one or more missed visits with that department in the last 12 calendar months", value: "K('repeat_missed_pct') = 50 percent"}
          - {when: "otherwise", value: "K('full_pct') = 100 percent"}
        baseline: {replaced_share: "K('full_pct')"}
        evidence: [history, cross_category]
        cross_difficulty: appointment
      - id: followup_trim
        effect: parameter
        decides: followup_trim
        bindings: [last_inperson_visit, days_since_visit, upcoming_visits, followup_trim]
        ladder:
          - {when: "latest completed in-person visit with the prescribing department more than 270 days ago AND no visit with it booked or confirmed", value: "K('trim_unbooked_days') = 21 days"}
          - {when: "latest completed in-person visit more than 270 days ago AND a visit with it booked or confirmed", value: "K('trim_booked_days') = 7 days"}
          - {when: "otherwise", value: "K('no_trim_days') = 0 days"}
        baseline: {followup_trim: "K('no_trim_days')"}
        evidence: [cross_category, date]
        cross_difficulty: appointment
    baseline:
      rule: >-
        A replacement fill for lost, stolen or damaged medication dispenses one regular fill of the
        prescription, that is, the per-fill days' supply recorded on the prescription. The replacement
        fill is posted as one fill on the day it is authorized, and its days' supply is a whole number of
        days.
      params: []
    inputs:
      history:
        - {table: rx_events, aggregate: latest, field: fill_date, filters: {event_type: rx_fill_dispensed}}
        - {table: rx_events, aggregate: count, field: rx_event_id, within_months: 24, filters: {event_type: rx_fills_authorized, authorization_reason: replacement_fill}}
        - {category: appointment, table: appointments, aggregate: count, field: appointment_id, within_months: 12, filters: {status: no_show}}
      cross_category: [billing, appointment]

  - id: rx_ext_agreement_fill_interval
    base_policy_refs: [rx_controlled_safeguards, rx_specialty_access]
    overwrite: []
    trigger: on_request
    subject: [rx_compliance_updated]
    computes: days_supply
    target_tool: sign_controlled_agreement_46ef2e3a
    params:
      start_interval_days: 14
      screen_recent_days: 183
      screen_year_days: 365
      screen_recent_allowance: 30
      screen_year_allowance: 21
      missed_window_months: 12
      recent_visit_days: 183
      attended_allowance: 30
      one_missed_allowance: 21
      dispensing_window_months: 12
      regular_min: 11
      regular_max: 12
      near_regular_min: 9
      near_regular_max: 10
      regular_allowance: 28
      near_regular_allowance: 21
      booked_horizon_days: 60
      visit_span_days: 183
      commercial_allowance: 30
      medicare_allowance: 28
      medicaid_allowance: 21
    rule: >-
      When the patient signs a new controlled-substance agreement for a controlled prescription, the
      agreement sets the starting fill interval of 14 days. The agreed fill interval is recorded on the
      prescription as its per-fill days' supply on the day the patient signs, and every later fill of
      that prescription dispenses that many days. Signing the agreement is the patient's own act, and
      the patient accepts the agreed fill interval by signing. The agreed fill interval is the shortest
      of five allowances, each a whole number of days worked out on the signing day: the screening
      allowance, the attendance allowance, the dispensing-regularity allowance, the visit-cadence
      allowance and the coverage allowance. The screening allowance follows the calendar days since the
      date of the latest drug screen on the prescription: 183 days or fewer allows 30 days; more than
      183 but no more than 365 days allows 21 days; more than 365 days, or no drug screen, allows the
      starting 14 days. The attendance allowance combines missed visits and recent care with the
      prescribing department: where the patient has no missed visit with that department in the last 12
      calendar months and a completed in-person visit with it no more than 183 days before the signing
      day, it allows 30 days; where the patient has exactly one missed visit with that department in
      those 12 months and a completed in-person visit with it no more than 183 days before, it allows
      21 days; otherwise it allows the starting 14 days. The dispensing-regularity allowance follows the
      number of dispensings of the prescription in the last 12 calendar months: 11 or 12 dispensings
      allow 28 days; 9 or 10 dispensings allow 21 days; any other number allows the starting 14 days.
      The visit-cadence allowance spaces the fills to the patient's next visit with the prescribing
      department, using the latest-dated visit with that department that is booked or confirmed: where
      that visit is 1 to 60 calendar days after the signing day, the days to that visit are divided
      into the fewest fills of no more than the class's largest days' supply per fill, and the
      allowance is the days to the visit divided by that number of fills, rounded down to a whole day;
      where no visit with that department is booked or confirmed within 60 days but the latest completed
      in-person visit with it was fewer than 183 days before the signing day, the days remaining until
      183 days after that visit are divided the same way; otherwise it allows the starting 14 days. The
      coverage allowance follows the financial class recorded on the patient's billing account: a
      Commercial PPO/POS Account or a Commercial HMO/EPO Account allows 30 days; a Medicare Advantage
      Account or a Medicare Part B Account allows 28 days; a Medicaid Managed Care Account allows 21
      days; any other financial class allows the starting 14 days. A virtual visit is not an in-person
      visit for any of these allowances, and a missed visit with another department does not count.
    prerequisite: []
    cross_category:
      - category: appointment
        as: history
        reads: [appointments.scheduled_date, appointments.status, appointments.department]
        note: the attendance allowance (missed and completed visits) and the visit-cadence allowance (booked or confirmed and completed visits) are decided from the prescribing department's appointments.
      - category: billing
        as: branch
        reads: [variant_name]
        note: the coverage allowance tier is decided by the financial class on the billing account.
    compute:
      - screen_age: "DAYS(F('last_drug_screen_date'), NOW) if F('last_drug_screen_date') else 100000"
      - screening_allowance: "K('screen_recent_allowance') if screen_age <= K('screen_recent_days') else (K('screen_year_allowance') if screen_age <= K('screen_year_days') else K('start_interval_days'))"
      - missed_visits: "XCOUNT('appointment','appointments', within_months=K('missed_window_months'), date_field='scheduled_date', status='no_show', department=F('prescribing_department'))"
      - last_inperson_visit: "XLATEST('appointment','appointments','scheduled_date', date_field='scheduled_date', status='completed', department=F('prescribing_department'))"
      - days_since_visit: "DAYS(last_inperson_visit, NOW) if last_inperson_visit else 100000"
      - attendance_allowance: "K('attended_allowance') if (missed_visits == 0 and days_since_visit <= K('recent_visit_days')) else (K('one_missed_allowance') if (missed_visits == 1 and days_since_visit <= K('recent_visit_days')) else K('start_interval_days'))"
      - dispensings_year: "COUNT('rx_events', within_months=K('dispensing_window_months'), date_field='fill_date', event_type='rx_fill_dispensed')"
      - regularity_allowance: "K('regular_allowance') if (dispensings_year >= K('regular_min') and dispensings_year <= K('regular_max')) else (K('near_regular_allowance') if (dispensings_year >= K('near_regular_min') and dispensings_year <= K('near_regular_max')) else K('start_interval_days'))"
      - booked_visit: "XLATEST('appointment','appointments','scheduled_date', date_field='scheduled_date', status='booked', department=F('prescribing_department'))"
      - confirmed_visit: "XLATEST('appointment','appointments','scheduled_date', date_field='scheduled_date', status='confirmed', department=F('prescribing_department'))"
      - next_visit: "booked_visit if (booked_visit and (not confirmed_visit or booked_visit > confirmed_visit)) else confirmed_visit"
      - days_to_visit: "DAYS(NOW, next_visit) if next_visit else 100000"
      - span_left: "K('visit_span_days') - days_since_visit"
      - cadence_allowance: "(days_to_visit // (-((-days_to_visit) // P('max_days_supply_per_fill')))) if (days_to_visit >= 1 and days_to_visit <= K('booked_horizon_days')) else ((span_left // (-((-span_left) // P('max_days_supply_per_fill')))) if span_left > 0 else K('start_interval_days'))"
      - billing_class: "CFIELD('billing','variant_name')"
      - coverage_allowance: "K('commercial_allowance') if (billing_class == 'Commercial PPO/POS Account' or billing_class == 'Commercial HMO/EPO Account') else (K('medicare_allowance') if (billing_class == 'Medicare Advantage Account' or billing_class == 'Medicare Part B Account') else (K('medicaid_allowance') if billing_class == 'Medicaid Managed Care Account' else K('start_interval_days')))"
      - result: "MN(screening_allowance, attendance_allowance, regularity_allowance, cadence_allowance, coverage_allowance)"
    compute_basis:
      screen_age: "The screening allowance follows the calendar days since the date of the latest drug screen on the prescription"
      screening_allowance: "183 days or fewer allows 30 days; more than 183 but no more than 365 days allows 21 days; more than 365 days, or no drug screen, allows the starting 14 days."
      missed_visits: "no missed visit with that department in the last 12 calendar months ... a missed visit with another department does not count."
      last_inperson_visit: "a completed in-person visit with it no more than 183 days before the signing day ... A virtual visit is not an in-person visit for any of these allowances"
      attendance_allowance: "where the patient has no missed visit with that department in the last 12 calendar months and a completed in-person visit with it no more than 183 days before the signing day, it allows 30 days; where the patient has exactly one missed visit with that department in those 12 months and a completed in-person visit with it no more than 183 days before, it allows 21 days; otherwise it allows the starting 14 days."
      dispensings_year: "The dispensing-regularity allowance follows the number of dispensings of the prescription in the last 12 calendar months"
      regularity_allowance: "11 or 12 dispensings allow 28 days; 9 or 10 dispensings allow 21 days; any other number allows the starting 14 days."
      booked_visit: "using the latest-dated visit with that department that is booked or confirmed"
      confirmed_visit: "using the latest-dated visit with that department that is booked or confirmed"
      next_visit: "using the latest-dated visit with that department that is booked or confirmed"
      cadence_allowance: "where that visit is 1 to 60 calendar days after the signing day, the days to that visit are divided into the fewest fills of no more than the class's largest days' supply per fill, and the allowance is the days to the visit divided by that number of fills, rounded down to a whole day; where no visit with that department is booked or confirmed within 60 days but the latest completed in-person visit with it was fewer than 183 days before the signing day, the days remaining until 183 days after that visit are divided the same way; otherwise it allows the starting 14 days."
      billing_class: "The coverage allowance follows the financial class recorded on the patient's billing account"
      coverage_allowance: "a Commercial PPO/POS Account or a Commercial HMO/EPO Account allows 30 days; a Medicare Advantage Account or a Medicare Part B Account allows 28 days; a Medicaid Managed Care Account allows 21 days; any other financial class allows the starting 14 days."
      result: "The agreed fill interval is the shortest of five allowances, each a whole number of days worked out on the signing day"
    factors:
      - id: screening_allowance
        effect: parameter
        decides: screening_allowance
        bindings: [screen_age, screening_allowance]
        ladder:
          - {when: "latest drug screen 183 days or fewer before the signing day", value: "K('screen_recent_allowance') = 30 days"}
          - {when: "latest drug screen more than 183 but no more than 365 days before", value: "K('screen_year_allowance') = 21 days"}
          - {when: "otherwise (older, or none)", value: "K('start_interval_days') = 14 days"}
        baseline: {screening_allowance: "K('start_interval_days')"}
        evidence: [date]
        cross_difficulty: null
      - id: attendance_allowance
        effect: parameter
        decides: attendance_allowance
        bindings: [missed_visits, last_inperson_visit, days_since_visit, attendance_allowance]
        ladder:
          - {when: "no missed visit with the prescribing department in 12 calendar months AND a completed in-person visit with it no more than 183 days before", value: "K('attended_allowance') = 30 days"}
          - {when: "exactly one missed visit with that department in 12 calendar months AND a completed in-person visit with it no more than 183 days before", value: "K('one_missed_allowance') = 21 days"}
          - {when: "otherwise", value: "K('start_interval_days') = 14 days"}
        baseline: {attendance_allowance: "K('start_interval_days')"}
        evidence: [cross_category, date]
        cross_difficulty: appointment
      - id: dispensing_regularity_allowance
        effect: parameter
        decides: regularity_allowance
        bindings: [dispensings_year, regularity_allowance]
        ladder:
          - {when: "11 or 12 dispensings of the prescription in the last 12 calendar months", value: "K('regular_allowance') = 28 days"}
          - {when: "9 or 10 dispensings", value: "K('near_regular_allowance') = 21 days"}
          - {when: "otherwise (any other number)", value: "K('start_interval_days') = 14 days"}
        baseline: {regularity_allowance: "K('start_interval_days')"}
        evidence: [history]
        cross_difficulty: null
      - id: visit_cadence_allowance
        effect: method
        decides: cadence_allowance
        bindings: [booked_visit, confirmed_visit, next_visit, days_to_visit, span_left, cadence_allowance]
        ladder:
          - {when: "a booked or confirmed visit with the prescribing department 1 to 60 days after the signing day", method: "the days to that visit divided by the fewest fills of no more than the class's largest days' supply per fill that cover them, rounded down"}
          - {when: "no such visit within 60 days, and the latest completed in-person visit with the department fewer than 183 days before", method: "the days remaining until 183 days after that visit divided the same way"}
          - {when: "otherwise", method: "the starting 14 days"}
        baseline: {cadence_allowance: "K('start_interval_days')"}
        evidence: [cross_category, date]
        cross_difficulty: appointment
      - id: coverage_allowance
        effect: parameter
        decides: coverage_allowance
        bindings: [billing_class, coverage_allowance]
        ladder:
          - {when: "the billing account is a Commercial PPO/POS Account or a Commercial HMO/EPO Account", value: "K('commercial_allowance') = 30 days"}
          - {when: "the billing account is a Medicare Advantage Account or a Medicare Part B Account", value: "K('medicare_allowance') = 28 days"}
          - {when: "the billing account is a Medicaid Managed Care Account", value: "K('medicaid_allowance') = 21 days"}
          - {when: "otherwise", value: "K('start_interval_days') = 14 days"}
        baseline: {coverage_allowance: "K('start_interval_days')"}
        evidence: [cross_category]
        cross_difficulty: billing
    baseline:
      rule: >-
        When the patient signs a new controlled-substance agreement for a controlled prescription, the
        agreement sets the starting fill interval of 14 days. The agreed fill interval is recorded on the
        prescription as its per-fill days' supply on the day the patient signs, and every later fill of
        that prescription dispenses that many days.
      params: [start_interval_days]
    inputs:
      history:
        - {table: rx_events, aggregate: count, field: rx_event_id, within_months: 12, filters: {event_type: rx_fill_dispensed}}
        - {category: appointment, table: appointments, aggregate: count, field: appointment_id, within_months: 12, filters: {status: no_show}}
        - {category: appointment, table: appointments, aggregate: latest, field: scheduled_date, filters: {status: booked}}
      cross_category: [appointment, billing]

  - id: rx_ext_controlled_renewal_fills
    base_policy_refs: [rx_renewal_eligibility, rx_fill_authorization, rx_controlled_safeguards, rx_hold_lapse]
    overwrite:
      - base_policy: rx_fill_authorization
        superseded_clause: >-
          the number of fills is the smaller of max_refills_per_authorization plus one and the whole
          number of fills of days_supply that fit in max_total_days_supply_per_authorization (rounded
          down)
        replaced_by: >-
          The fills a controlled renewal authorizes are the reach fills, plus the reserve fills, less the
          database-check withholding, plus the adherence adjustment, plus the follow-up adjustment, never
          more than the class's refills per authorization plus one and never fewer than one.
    trigger: on_request
    subject: [rx_renewed]
    computes: fills
    target_tool: approve_prescription_renewal_192bec69
    params:
      visit_span_days: 183
      missed_window_months: 12
      screen_recent_days: 183
      reserve_attended: 2
      reserve_missed: 1
      no_reserve: 0
      pdmp_stale_days: 60
      pdmp_aging_days: 30
      pdmp_stale_withhold: 2
      pdmp_aging_withhold: 1
      no_withhold: 0
      adherence_window_months: 6
      on_schedule_min: 170
      on_schedule_max: 190
      on_schedule_extra: 1
      early_fill_cut: -1
      no_adjust: 0
      followup_window_months: 6
      engaged_extra: 1
      virtual_only_cut: -1
    rule: >-
      A controlled renewal approved from hold authorizes the smaller of the class's refills per
      authorization plus one and the whole number of fills of the prescription's per-fill days' supply
      that fit in the class's total days' supply per authorization, rounded down. The fills are posted
      at the prescription's per-fill days' supply on the renewal date, and the fills left on the old
      authorization are voided as superseded when the new fills are granted. Completing the missing requirement lets the held renewal be approved from hold, and every other
      requirement of the class must still be current on the renewal date. For a class whose renewals
      need the prescriber's own signature, that review is the one that placed the renewal on hold
      naming its single missing requirement, so the approval from hold is recorded without a second
      signature once that requirement is complete. A controlled renewal's fills are not fixed until the
      prescription shows a controlled-substance agreement the patient signed within the class's
      agreement renewal months before the renewal date. The fills a controlled renewal authorizes are
      the reach fills, plus the reserve fills, less the database-check withholding, plus the adherence
      adjustment, plus the follow-up adjustment, never more than the class's refills per authorization
      plus one and never fewer than one. The reach fills are worked out by one of three methods: where
      the patient's latest-dated booked or confirmed visit with the prescribing department is 1 or more
      calendar days after the renewal date, they are the days to that visit divided by the per-fill
      days' supply, rounded up to a whole fill; where no such visit is booked or confirmed but the latest
      completed in-person visit with that department was fewer than 183 days before the renewal date,
      they are the days remaining until 183 days after that visit divided by the per-fill days' supply,
      rounded up; otherwise they are the class fills of the first sentence. The reserve fills combine
      missed visits and drug screening: where the patient has no missed visit with the prescribing
      department in the last 12 calendar months and a drug screen no more than 183 days before the
      renewal date, they are 2; where the patient has one or more missed visits with that department in
      those 12 months and a drug screen no more than 183 days before, they are 1; otherwise they are 0.
      The database-check withholding follows the calendar days since the latest prescription-monitoring
      database check: more than 60 days withholds 2 fills; more than 30 but no more than 60 days
      withholds 1 fill; 30 days or fewer withholds none. The adherence adjustment follows the days'
      supply dispensed on the prescription in the last 6 calendar months: 170 to 190 days adds 1 fill;
      more than 190 days takes away 1 fill; under 170 days changes nothing. The follow-up adjustment
      combines virtual and in-person care with the prescribing department in the last 6 calendar months:
      where the patient completed a virtual visit and also a completed in-person visit with that
      department, it adds 1 fill; where the patient completed a virtual visit but no in-person visit with
      it, it takes away 1 fill; otherwise it changes nothing. A missed visit with another department
      does not count.
    prerequisite:
      - problem: rx_ext_agreement_fill_interval
        kind: value_input
        gate: fill_days
        form: state
        policy_source: >-
          A controlled renewal's fills are not fixed until the prescription shows a controlled-substance
          agreement the patient signed within the class's agreement renewal months before the renewal
          date.
        condition: >-
          prescriptions.controlled_agreement_signed_date falls within controlled_agreement_renewal_months calendar months before the renewal date
        resolved_by: sign_controlled_agreement_46ef2e3a
        effect: >-
          the agreement current requirement of the renewal becomes satisfied, and the per-fill days'
          supply the renewal reads (binding fill_days, which divides the days to the next visit into
          reach fills) becomes the agreed fill interval recorded at the signature
    cross_category:
      - category: appointment
        as: history
        reads: [appointments.scheduled_date, appointments.status, appointments.department]
        note: the reach fills method reads booked, confirmed and completed visits, and the reserve fills and follow-up adjustment read missed and completed in-person visits of the prescribing department.
      - category: telehealth
        as: history
        reads: [telehealth_visits.scheduled_date, telehealth_visits.status, telehealth_visits.department]
        note: the follow-up adjustment tier reads completed virtual visits with the prescribing department.
    compute:
      - fill_days: "F('days_supply')"
      - class_fills: "MN(P('max_refills_per_authorization') + 1, P('max_total_days_supply_per_authorization') // fill_days)"
      - booked_visit: "XLATEST('appointment','appointments','scheduled_date', date_field='scheduled_date', status='booked', department=F('prescribing_department'))"
      - confirmed_visit: "XLATEST('appointment','appointments','scheduled_date', date_field='scheduled_date', status='confirmed', department=F('prescribing_department'))"
      - next_visit: "booked_visit if (booked_visit and (not confirmed_visit or booked_visit > confirmed_visit)) else confirmed_visit"
      - days_to_visit: "DAYS(NOW, next_visit) if next_visit else 0"
      - last_inperson_visit: "XLATEST('appointment','appointments','scheduled_date', date_field='scheduled_date', status='completed', department=F('prescribing_department'))"
      - days_since_visit: "DAYS(last_inperson_visit, NOW) if last_inperson_visit else 100000"
      - reach_fills: "(-((-days_to_visit) // fill_days)) if days_to_visit >= 1 else ((-((-(K('visit_span_days') - days_since_visit)) // fill_days)) if days_since_visit < K('visit_span_days') else class_fills)"
      - missed_visits: "XCOUNT('appointment','appointments', within_months=K('missed_window_months'), date_field='scheduled_date', status='no_show', department=F('prescribing_department'))"
      - screen_age: "DAYS(F('last_drug_screen_date'), NOW) if F('last_drug_screen_date') else 100000"
      - reserve_fills: "K('reserve_attended') if (missed_visits == 0 and screen_age <= K('screen_recent_days')) else (K('reserve_missed') if (missed_visits >= 1 and screen_age <= K('screen_recent_days')) else K('no_reserve'))"
      - pdmp_age: "DAYS(F('pdmp_checked_date'), NOW) if F('pdmp_checked_date') else 100000"
      - pdmp_withhold: "K('pdmp_stale_withhold') if pdmp_age > K('pdmp_stale_days') else (K('pdmp_aging_withhold') if pdmp_age > K('pdmp_aging_days') else K('no_withhold'))"
      - days_dispensed_half: "SUM('rx_events','days_supply_per_fill', within_months=K('adherence_window_months'), date_field='fill_date', event_type='rx_fill_dispensed')"
      - adherence_adjust: "K('on_schedule_extra') if (days_dispensed_half >= K('on_schedule_min') and days_dispensed_half <= K('on_schedule_max')) else (K('early_fill_cut') if days_dispensed_half > K('on_schedule_max') else K('no_adjust'))"
      - virtual_visits: "XCOUNT('telehealth','telehealth_visits', within_months=K('followup_window_months'), date_field='scheduled_date', status='completed', department=F('prescribing_department'))"
      - inperson_visits: "XCOUNT('appointment','appointments', within_months=K('followup_window_months'), date_field='scheduled_date', status='completed', department=F('prescribing_department'))"
      - followup_adjust: "K('engaged_extra') if (virtual_visits >= 1 and inperson_visits >= 1) else (K('virtual_only_cut') if (virtual_visits >= 1 and inperson_visits == 0) else K('no_adjust'))"
      - result: "MX(1, MN(P('max_refills_per_authorization') + 1, reach_fills + reserve_fills - pdmp_withhold + adherence_adjust + followup_adjust))"
    compute_basis:
      fill_days: "the whole number of fills of the prescription's per-fill days' supply"
      class_fills: "A controlled renewal approved from hold authorizes the smaller of the class's refills per authorization plus one and the whole number of fills of the prescription's per-fill days' supply that fit in the class's total days' supply per authorization, rounded down."
      booked_visit: "where the patient's latest-dated booked or confirmed visit with the prescribing department is 1 or more calendar days after the renewal date"
      confirmed_visit: "where the patient's latest-dated booked or confirmed visit with the prescribing department is 1 or more calendar days after the renewal date"
      next_visit: "the patient's latest-dated booked or confirmed visit with the prescribing department"
      last_inperson_visit: "the latest completed in-person visit with that department was fewer than 183 days before the renewal date"
      reach_fills: "where the patient's latest-dated booked or confirmed visit with the prescribing department is 1 or more calendar days after the renewal date, they are the days to that visit divided by the per-fill days' supply, rounded up to a whole fill; where no such visit is booked or confirmed but the latest completed in-person visit with that department was fewer than 183 days before the renewal date, they are the days remaining until 183 days after that visit divided by the per-fill days' supply, rounded up; otherwise they are the class fills of the first sentence."
      missed_visits: "missed visits with the prescribing department in the last 12 calendar months ... A missed visit with another department does not count."
      screen_age: "a drug screen no more than 183 days before the renewal date"
      reserve_fills: "where the patient has no missed visit with the prescribing department in the last 12 calendar months and a drug screen no more than 183 days before the renewal date, they are 2; where the patient has one or more missed visits with that department in those 12 months and a drug screen no more than 183 days before, they are 1; otherwise they are 0."
      pdmp_age: "The database-check withholding follows the calendar days since the latest prescription-monitoring database check"
      pdmp_withhold: "more than 60 days withholds 2 fills; more than 30 but no more than 60 days withholds 1 fill; 30 days or fewer withholds none."
      days_dispensed_half: "The adherence adjustment follows the days' supply dispensed on the prescription in the last 6 calendar months"
      adherence_adjust: "170 to 190 days adds 1 fill; more than 190 days takes away 1 fill; under 170 days changes nothing."
      virtual_visits: "The follow-up adjustment combines virtual and in-person care with the prescribing department in the last 6 calendar months"
      inperson_visits: "The follow-up adjustment combines virtual and in-person care with the prescribing department in the last 6 calendar months"
      followup_adjust: "where the patient completed a virtual visit and also a completed in-person visit with that department, it adds 1 fill; where the patient completed a virtual visit but no in-person visit with it, it takes away 1 fill; otherwise it changes nothing."
      result: "The fills a controlled renewal authorizes are the reach fills, plus the reserve fills, less the database-check withholding, plus the adherence adjustment, plus the follow-up adjustment, never more than the class's refills per authorization plus one and never fewer than one."
    factors:
      - id: visit_reach_fills
        effect: method
        decides: reach_fills
        bindings: [booked_visit, confirmed_visit, next_visit, days_to_visit, last_inperson_visit, days_since_visit, reach_fills]
        ladder:
          - {when: "a booked or confirmed visit with the prescribing department 1 or more days after the renewal date", method: "the days to that visit divided by the per-fill days' supply, rounded up to a whole fill"}
          - {when: "no such visit, and the latest completed in-person visit with the department fewer than 183 days before", method: "the days remaining until 183 days after that visit divided by the per-fill days' supply, rounded up"}
          - {when: "otherwise", method: "the class fills: the smaller of refills per authorization plus one and the whole fills of the per-fill days' supply fitting in the class total days"}
        baseline: {reach_fills: "class_fills"}
        evidence: [cross_category, date]
        cross_difficulty: appointment
      - id: screening_reserve_fills
        effect: parameter
        decides: reserve_fills
        bindings: [missed_visits, screen_age, reserve_fills]
        ladder:
          - {when: "no missed visit with the prescribing department in 12 calendar months AND a drug screen no more than 183 days before", value: "K('reserve_attended') = 2 fills"}
          - {when: "one or more missed visits with that department in 12 calendar months AND a drug screen no more than 183 days before", value: "K('reserve_missed') = 1 fill"}
          - {when: "otherwise", value: "K('no_reserve') = 0 fills"}
        baseline: {reserve_fills: "K('no_reserve')"}
        evidence: [cross_category, date]
        cross_difficulty: appointment
      - id: database_check_withholding
        effect: parameter
        decides: pdmp_withhold
        bindings: [pdmp_age, pdmp_withhold]
        ladder:
          - {when: "latest prescription-monitoring database check more than 60 days before the renewal date", value: "K('pdmp_stale_withhold') = 2 fills"}
          - {when: "more than 30 but no more than 60 days before", value: "K('pdmp_aging_withhold') = 1 fill"}
          - {when: "otherwise (30 days or fewer)", value: "K('no_withhold') = 0 fills"}
        baseline: {pdmp_withhold: "K('no_withhold')"}
        evidence: [date]
        cross_difficulty: null
      - id: adherence_adjustment
        effect: parameter
        decides: adherence_adjust
        bindings: [days_dispensed_half, adherence_adjust]
        ladder:
          - {when: "170 to 190 days' supply dispensed on the prescription in the last 6 calendar months", value: "K('on_schedule_extra') = +1 fill"}
          - {when: "more than 190 days' supply dispensed in that window", value: "K('early_fill_cut') = -1 fill"}
          - {when: "otherwise (under 170 days)", value: "K('no_adjust') = 0"}
        baseline: {adherence_adjust: "K('no_adjust')"}
        evidence: [history]
        cross_difficulty: null
      - id: followup_adjustment
        effect: parameter
        decides: followup_adjust
        bindings: [virtual_visits, inperson_visits, followup_adjust]
        ladder:
          - {when: "a completed virtual visit AND a completed in-person visit with the prescribing department in the last 6 calendar months", value: "K('engaged_extra') = +1 fill"}
          - {when: "a completed virtual visit AND no completed in-person visit with that department in those 6 months", value: "K('virtual_only_cut') = -1 fill"}
          - {when: "otherwise", value: "K('no_adjust') = 0"}
        baseline: {followup_adjust: "K('no_adjust')"}
        evidence: [cross_category]
        cross_difficulty: appointment
    baseline:
      rule: >-
        A controlled renewal approved from hold authorizes the smaller of the class's refills per
        authorization plus one and the whole number of fills of the prescription's per-fill days' supply
        that fit in the class's total days' supply per authorization, rounded down. The fills are posted
        at the prescription's per-fill days' supply on the renewal date, and the fills left on the old
        authorization are voided as superseded when the new fills are granted.
      params: [max_refills_per_authorization, max_total_days_supply_per_authorization]
    inputs:
      history:
        - {table: rx_events, aggregate: sum, field: days_supply_per_fill, within_months: 6, filters: {event_type: rx_fill_dispensed}}
        - {category: appointment, table: appointments, aggregate: latest, field: scheduled_date, filters: {status: booked}}
        - {category: appointment, table: appointments, aggregate: count, field: appointment_id, within_months: 12, filters: {status: no_show}}
        - {category: telehealth, table: telehealth_visits, aggregate: count, field: telehealth_visit_id, within_months: 6, filters: {status: completed}}
      cross_category: [appointment, telehealth]
