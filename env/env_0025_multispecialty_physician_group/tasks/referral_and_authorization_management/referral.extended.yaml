events:
  - type: referral_requested
    target: referrals
    mutation: create
    meaning: "A clinician orders a referral or a service needing prior authorization and the request is opened for the patient."
    grain: "One row per referral or authorization request."
    fields:
      customer_id: "The patient."
      variant_name: "Referral or authorization type (official tier name)."
      status: "Always requested on creation."
      requested_date: "Date the request is opened (handling date)."
      specialty: "Department or service line the referral is for."
      referring_clinician: "Ordering clinician exactly as listed in the provider directory."
      rendering_provider: "Provider or site that will render the service, exactly as listed in the provider or facility directory."
      urgency: "standard or urgent."
      units_remaining: "0 on creation; raised only by a unit grant."
      extension_count: "0 on creation."
    triggers: []
  - type: referral_submitted
    target: referrals
    mutation: {transition: {from: requested, to: submitted}}
    meaning: "The complete request is submitted for decision."
    grain: "One row per transaction."
    fields:
      status: "Set to submitted."
      submitted_date: "Date of submission."
    triggers: []
  - type: referral_approved
    target: referrals
    mutation: {transition: [{from: submitted, to: approved}, {from: appealed, to: approved}, {from: exhausted, to: approved}]}
    meaning: "The request, an appeal, or an extension of an exhausted authorization is approved."
    grain: "One row per transaction."
    fields:
      status: "Set to approved."
      decision_date: "Date of the decision."
      last_decision_basis: "initial_review, appeal or extension."
      payer_auth_number: "Authorization number issued by the payer (or the in-group referral number), exactly as issued."
      valid_from: "First date of validity."
      valid_through: "Last date of validity."
    triggers:
      - event: referral:referral_units_granted
        when: {last_decision_basis: initial_review}
        map: {unit_date: decision_date, grant_reason: initial_approval}
      - event: referral:referral_units_granted
        when: {last_decision_basis: appeal}
        map: {unit_date: decision_date, grant_reason: appeal_approval}
      - event: referral:referral_units_granted
        when: {last_decision_basis: extension}
        map: {unit_date: decision_date, grant_reason: extension}
  - type: referral_denied
    target: referrals
    mutation: {transition: {from: submitted, to: denied}}
    meaning: "The payer denies the request."
    grain: "One row per transaction."
    fields:
      status: "Set to denied."
      decision_date: "Date of the denial."
      denial_reason: "Reason stated in the denial."
    triggers: []
  - type: referral_appeal_filed
    target: referrals
    mutation: {transition: {from: denied, to: appealed}}
    meaning: "An appeal of the denial is filed with the patient's authorization."
    grain: "One row per transaction."
    fields:
      status: "Set to appealed."
      appeal_filed_date: "Date the appeal is filed."
      appeal_level: "Level of this appeal (1 = first)."
    triggers: []
  - type: referral_denial_finalized
    target: referrals
    mutation: {transition: [{from: denied, to: denied_final}, {from: appealed, to: denied_final}]}
    meaning: "The denial becomes final: the appeal window lapsed or the last appeal level upheld it."
    grain: "One row per transaction."
    fields:
      status: "Set to denied_final."
      decision_date: "Date the denial became final."
      closed_date: "Same date."
    triggers: []
  - type: referral_exhausted
    target: referrals
    mutation: {transition: {from: approved, to: exhausted}}
    meaning: "The last authorized unit has been used."
    grain: "One row per transaction."
    fields:
      status: "Set to exhausted."
    triggers: []
  - type: referral_expired
    target: referrals
    mutation: {transition: {from: approved, to: expired}}
    meaning: "The valid-through date has passed."
    grain: "One row per transaction."
    fields:
      status: "Set to expired."
      closed_date: "The day after valid_through."
      units_remaining: "Units still unused at expiry (lapsed by the forfeiture posting)."
    triggers:
      - event: referral:referral_units_forfeited
        when: {units_remaining: {not: 0}}
        map: {units: units_remaining, unit_date: closed_date, forfeit_reason: expired}
  - type: referral_cancelled
    target: referrals
    mutation: {transition: [{from: requested, to: cancelled}, {from: approved, to: cancelled}]}
    meaning: "The referral is withdrawn, closed as a duplicate, or superseded."
    grain: "One row per transaction."
    fields:
      status: "Set to cancelled."
      cancel_reason: "patient_request, clinician_withdrawn, duplicate or superseded."
      closed_date: "Date of cancellation."
      units_remaining: "Units still unused at cancellation."
    triggers:
      - event: referral:referral_units_forfeited
        when: {units_remaining: {not: 0}, cancel_reason: superseded}
        map: {units: units_remaining, unit_date: closed_date, forfeit_reason: superseded}
      - event: referral:referral_units_forfeited
        when: {units_remaining: {not: 0}, cancel_reason: {not: superseded}}
        map: {units: units_remaining, unit_date: closed_date, forfeit_reason: cancelled}
  - type: referral_validity_extended
    target: referrals
    mutation: update
    meaning: "An extension lengthens the validity of an approved referral (and, where the tier grants extension units, adds units through a unit grant)."
    grain: "One row per transaction."
    fields:
      valid_through: "New last date of validity."
      extension_count: "Previous count plus one."
      last_decision_basis: "Set to extension."
    triggers: []
  - type: referral_provider_changed
    target: referrals
    mutation: update
    meaning: "The rendering provider (or site) on an open referral is changed within the same specialty."
    grain: "One row per transaction."
    fields:
      rendering_provider: "New rendering provider or site exactly as listed in the directory."
    triggers: []
  - type: referral_units_granted
    target: referral_events
    meaning: "Units are added to the referral by an initial approval, an appeal approval, an extension or a retroactive authorization."
    grain: "One row per grant decision on one referral."
    distinguish_by: [grant_reason, unit_date]
    fields:
      unit_date: "Date of the decision that grants the units."
      units: "Units granted."
      grant_reason: "initial_approval, appeal_approval, extension or retro_authorization."
    account: authorized_units
    direction: in
    triggers: []
  - type: referral_unit_used
    target: referral_events
    meaning: "A completed visit (or telehealth visit, where it counts) uses one unit."
    grain: "One row per encounter that used the referral."
    distinguish_by: [encounter_number]
    fields:
      referral_id: "Referral the unit is taken from."
      unit_date: "Date of the completed visit."
      units: "Always 1."
      encounter_number: "Encounter that used the unit."
      source_category: "appointment or telehealth."
    account: authorized_units
    direction: out
    triggers: []
  - type: referral_unit_restored
    target: referral_events
    meaning: "A unit counted in error (visit not rendered, duplicate posting, wrong referral) is given back."
    grain: "One row per restored unit-use row."
    distinguish_by: [applies_to_unit_event_id]
    fields:
      unit_date: "Date of the restoration."
      units: "Always 1."
      encounter_number: "Encounter of the erroneous use."
      applies_to_unit_event_id: "The unit-use row being reversed."
      restore_reason: "Why the use was in error."
    account: authorized_units
    direction: in
    triggers: []
  - type: referral_units_forfeited
    target: referral_events
    meaning: "Units still unused lapse when the referral expires, is cancelled or is superseded."
    grain: "One row per lapse of one referral."
    distinguish_by: [forfeit_reason]
    fields:
      unit_date: "Date of the lapse."
      units: "Units lapsed."
      forfeit_reason: "expired, cancelled or superseded."
    account: authorized_units
    direction: out
    triggers: []

measures:
  - id: referral_msr_units_this_week
    window: "The calendar week (Monday to Sunday) containing the date of the visit."
    measure: "Sum of units of referral_unit_used rows on the referral dated inside the week, minus units of referral_unit_restored rows reversing those uses."
  - id: referral_msr_open_same_specialty
    window: "Point-in-time on the handling date."
    measure: "Count of the patient's referrals of the same tier and specialty whose status is requested, submitted, approved or appealed."

policies:
  - id: referral_agg_multi_holding
    subject: [referral_requested]
    rule: >-
      A patient may hold any number of referrals and authorizations across specialties and services over
      time; there is no overall cap. How many may be open at once for one specialty, and how an overlapping
      request is treated, is governed by referral_agg_overlap.
    eligibility: []
    params: {max_per_customer: null}

  - id: referral_agg_overlap
    subject: [referral_requested, referral_cancelled]
    rule: >-
      For one tier and one specialty a patient may hold at most max_open_same_specialty open referrals
      (referral_msr_open_same_specialty). The patient holds no other referral of the same tier and
      specialty in status requested, submitted or appealed. A new request for the same specialty made within
      duplicate_window_days after an approval whose units remain is a duplicate and is not opened; the
      existing referral is used or extended instead. A Standing Specialist Referral and an HMO Specialist
      Referral for the same specialty are mutually exclusive: when a standing referral is approved, any
      approved HMO Specialist Referral for that specialty is cancelled with reason superseded and its unused
      units lapse, and a new HMO Specialist Referral is not opened while the standing referral is approved.
      An Out-of-Network Referral is not opened while an approved in-network referral of the same specialty
      still has units. Imaging and procedure authorizations are per ordered service, so two authorizations of
      the same tier may be open for two different ordered services up to the tier's cap.
      A Standing Specialist Referral is requested only where a chronic or complex condition is documented,
      as the tier's chronic_condition_required demands.
    eligibility:
      - id: no_pending_duplicate
        applies_to: [referral_requested]
        kind: dedup
        condition: "The patient holds no other referral of the same tier and specialty in status requested, submitted or appealed."
        evidence_fields: [referrals.customer_id, referrals.variant_name, referrals.specialty, referrals.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[referrals.customer_id, referrals.variant_name, referrals.specialty]]
          action_bindings: {referrals.customer_id: customer_id, referrals.variant_name: variant_name, referrals.specialty: specialty}
        dedup_contract:
          table: referrals
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name, specialty: specialty}
          duplicate_filters: {status: [requested, submitted, appealed]}
          distinct_fields: [rendering_provider]
    params:
      per_tier:
        In-Group Specialist Referral: {max_open_same_specialty: "=max_open_same_specialty", duplicate_window_days: "=duplicate_window_days"}
        HMO Specialist Referral: {max_open_same_specialty: "=max_open_same_specialty", duplicate_window_days: "=duplicate_window_days"}
        Standing Specialist Referral: {max_open_same_specialty: "=max_open_same_specialty", duplicate_window_days: "=duplicate_window_days"}
        Out-of-Network Referral: {max_open_same_specialty: "=max_open_same_specialty", duplicate_window_days: "=duplicate_window_days"}
        Physical Therapy Episode Authorization: {max_open_same_specialty: "=max_open_same_specialty", duplicate_window_days: "=duplicate_window_days"}
        Advanced Imaging Prior Authorization: {max_open_same_specialty: "=max_open_same_specialty", duplicate_window_days: "=duplicate_window_days"}
        Outpatient Procedure Prior Authorization: {max_open_same_specialty: "=max_open_same_specialty", duplicate_window_days: "=duplicate_window_days"}
    formula:
      request_allowed: referral_msr_open_same_specialty < max_open_same_specialty
    measures: [referral_msr_open_same_specialty]

  - id: referral_submission_and_decision
    subject: [referral_submitted, referral_approved, referral_denied]
    rule: >-
      A request is submitted through the tier's submission_channel once it is complete: clinical notes where
      clinical_notes_required is true, the signed cost-share acknowledgement where
      oon_cost_share_acknowledgement_required is true, and a cost estimate given to the patient where
      pre_service_estimate_required is true. For a tier whose pcp_signature_required is true, the referring
      clinician is the patient's primary care clinician of record. Combination with the financial account:
      an HMO Specialist Referral is issued only while the patient's billing account is on the Commercial
      HMO/EPO Account tier; a patient on another insured tier who needs an in-group specialist gets an
      In-Group Specialist Referral, and a Self-Pay Account patient needs no payer referral at all. Standard
      requests are decided within standard_turnaround_business_days business days of submission and urgent
      requests (only where urgent_request_allowed is true, on the ordering clinician's attestation) within
      urgent_turnaround_hours; the patient is notified within patient_notification_business_days business
      days of the decision. An approval sets valid_from to the decision date and valid_through to valid_from
      plus validity_days minus one. Where payer_submission_required is false the decision is made by the
      group's specialty triage and cannot be appealed to a payer, only reviewed internally under
      referral_denial_and_appeal.
      After approval the referral packet reaches the rendering provider within
      records_to_rendering_provider_business_days business days, and the rendering provider's report is
      due back to the referring clinician within consult_report_due_days after each visit.
    eligibility:
      - id: pcp_of_record
        applies_to: [referral_submitted]
        kind: authorization
        condition: "For a tier whose pcp_signature_required is true, the referring clinician is the patient's primary care clinician of record."
        evidence_fields: [referrals.referring_clinician, customers.primary_care_clinician, referrals.referral_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[referrals.referral_id]]
          action_bindings: {referrals.referral_id: referral_id}
    params:
      per_tier:
        In-Group Specialist Referral: {standard_turnaround_business_days: "=standard_turnaround_business_days", validity_days: "=validity_days", pcp_signature_required: "=pcp_signature_required"}
        HMO Specialist Referral: {standard_turnaround_business_days: "=standard_turnaround_business_days", validity_days: "=validity_days", pcp_signature_required: "=pcp_signature_required"}
        Standing Specialist Referral: {standard_turnaround_business_days: "=standard_turnaround_business_days", validity_days: "=validity_days", pcp_signature_required: "=pcp_signature_required"}
        Out-of-Network Referral: {standard_turnaround_business_days: "=standard_turnaround_business_days", validity_days: "=validity_days", pcp_signature_required: "=pcp_signature_required"}
        Physical Therapy Episode Authorization: {standard_turnaround_business_days: "=standard_turnaround_business_days", validity_days: "=validity_days", pcp_signature_required: "=pcp_signature_required"}
        Advanced Imaging Prior Authorization: {standard_turnaround_business_days: "=standard_turnaround_business_days", validity_days: "=validity_days", pcp_signature_required: "=pcp_signature_required"}
        Outpatient Procedure Prior Authorization: {standard_turnaround_business_days: "=standard_turnaround_business_days", validity_days: "=validity_days", pcp_signature_required: "=pcp_signature_required"}

  - id: referral_unit_accounting
    subject: [referral_units_granted, referral_unit_used, referral_unit_restored, referral_exhausted]
    rule: >-
      An initial or appeal approval grants the tier's units_per_approval, an extension grants extension_units
      (none where that is 0), and a retroactive authorization grants exactly the units of the services it
      covers. Units are granted only when the referral status is approved. Each completed in-person visit
      booked against the referral uses one unit, and a completed telehealth visit with the rendering provider
      uses one unit only where telehealth_counts_against_units is true. A unit is used only while the
      referral status is approved and the date of the visit is within valid_from to valid_through; a visit
      that is cancelled or missed uses nothing. Where visits_per_week_cap is above 0, referral_msr_units_this_week
      may not exceed it, and a visit beyond the weekly cap is not covered by the authorization. When
      units_remaining reaches 0 the referral becomes exhausted. A unit counted in error is restored when the
      correction is asked for in time. The restoration is requested no later than the tier's restore window
      counted from the date the unit was used. The window is counted in calendar days starting the day after
      the unit date, and a request on the last day still qualifies. A unit-use row is restored at most once.
      Restoring a unit on an exhausted referral returns it to approved only through an extension decision;
      otherwise the restored unit is usable only while the referral is approved.
      One unit is one of the tier's units_measure. Coverage is re-verified before a unit is used whenever
      the last verification is older than eligibility_recheck_days, and where progress_note_every_units is
      above 0 a progress note goes to the payer after every that many units.
    eligibility:
      - id: grant_only_when_approved
        applies_to: [referral_units_granted]
        kind: state
        condition: "Units are granted only when the referral status is approved."
        evidence_fields: [referrals.status, referrals.referral_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[referrals.referral_id]]
          action_bindings: {referrals.referral_id: referral_id}
        state_contract:
          field: referrals.status
          allowed: [approved]
      - id: use_only_when_approved
        applies_to: [referral_unit_used]
        kind: state
        condition: "A unit is used only while the referral status is approved and the date of the visit is within valid_from to valid_through"
        evidence_fields: [referrals.status, referrals.valid_from, referrals.valid_through, referrals.referral_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[referrals.referral_id]]
          action_bindings: {referrals.referral_id: referral_id}
        state_contract:
          field: referrals.status
          allowed: [approved]
      - id: restore_window
        applies_to: [referral_unit_restored]
        kind: time
        condition: "The restoration is requested no later than the tier's restore window counted from the date the unit was used."
        evidence_fields: [referral_events.unit_date, referral_events.referral_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[referral_events.referral_event_id]]
          action_bindings: {referral_events.referral_event_id: applies_to_unit_event_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date the unit was used"
          anchor_source: referral_events.unit_date
          relation: not_after
          duration_source: variants.unit_restore_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the unit date, and a request on the last day still qualifies."
          boundary: inclusive
      - id: restore_once
        applies_to: [referral_unit_restored]
        kind: dedup
        condition: "A unit-use row is restored at most once."
        evidence_fields: [referral_events.applies_to_unit_event_id, referral_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[referral_events.applies_to_unit_event_id]]
          action_bindings: {referral_events.applies_to_unit_event_id: applies_to_unit_event_id}
        dedup_contract:
          table: referral_events
          mode: separate_record
          object_bindings: {applies_to_unit_event_id: applies_to_unit_event_id}
          duplicate_filters: {event_type: [referral_unit_restored]}
          distinct_fields: []
    params:
      per_tier:
        In-Group Specialist Referral: {units_per_approval: "=units_per_approval", extension_units: "=extension_units", visits_per_week_cap: "=visits_per_week_cap", unit_restore_window_days: "=unit_restore_window_days"}
        HMO Specialist Referral: {units_per_approval: "=units_per_approval", extension_units: "=extension_units", visits_per_week_cap: "=visits_per_week_cap", unit_restore_window_days: "=unit_restore_window_days"}
        Standing Specialist Referral: {units_per_approval: "=units_per_approval", extension_units: "=extension_units", visits_per_week_cap: "=visits_per_week_cap", unit_restore_window_days: "=unit_restore_window_days"}
        Out-of-Network Referral: {units_per_approval: "=units_per_approval", extension_units: "=extension_units", visits_per_week_cap: "=visits_per_week_cap", unit_restore_window_days: "=unit_restore_window_days"}
        Physical Therapy Episode Authorization: {units_per_approval: "=units_per_approval", extension_units: "=extension_units", visits_per_week_cap: "=visits_per_week_cap", unit_restore_window_days: "=unit_restore_window_days"}
        Advanced Imaging Prior Authorization: {units_per_approval: "=units_per_approval", extension_units: "=extension_units", visits_per_week_cap: "=visits_per_week_cap", unit_restore_window_days: "=unit_restore_window_days"}
        Outpatient Procedure Prior Authorization: {units_per_approval: "=units_per_approval", extension_units: "=extension_units", visits_per_week_cap: "=visits_per_week_cap", unit_restore_window_days: "=unit_restore_window_days"}
    formula:
      within_weekly_cap: visits_per_week_cap == 0 or referral_msr_units_this_week < visits_per_week_cap
      exhausted_after: units_remaining - 1 == 0
    measures: [referral_msr_units_this_week]

  - id: referral_validity_extension
    subject: [referral_validity_extended, referral_approved, referral_expired]
    rule: >-
      A referral covers services dated from valid_from through valid_through; the day after valid_through it
      expires and unused units lapse. The patient is told expiry_notice_days before valid_through, and when
      units_remaining falls to exhaustion_notice_units, that more care may need an extension; the coordinator
      aims to request it extension_request_lead_days ahead. An extension is requested only while the referral
      status is approved or exhausted; an expired, cancelled or finally denied referral cannot be extended and
      a new request is opened instead. An extension is granted only while extension_count is below the
      tier's max_extensions. Each extension adds extension_validity_days to valid_through and, where
      extension_units is above 0, grants those units (an exhausted referral returns to approved on that
      grant). Where reevaluation_before_extension is true, a completed re-evaluation visit must precede the
      request. The Standing Specialist Referral cannot be extended; it is renewed by a new request.
    eligibility:
      - id: extendable_status
        applies_to: [referral_validity_extended]
        kind: state
        condition: "An extension is requested only while the referral status is approved or exhausted"
        evidence_fields: [referrals.status, referrals.referral_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[referrals.referral_id]]
          action_bindings: {referrals.referral_id: referral_id}
        state_contract:
          field: referrals.status
          allowed: [approved, exhausted]
      - id: under_extension_cap
        applies_to: [referral_validity_extended]
        kind: authorization
        condition: "An extension is granted only while extension_count is below the tier's max_extensions."
        evidence_fields: [referrals.extension_count, referrals.referral_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[referrals.referral_id]]
          action_bindings: {referrals.referral_id: referral_id}
    params:
      per_tier:
        In-Group Specialist Referral: {max_extensions: "=max_extensions", extension_validity_days: "=extension_validity_days", expiry_notice_days: "=expiry_notice_days"}
        HMO Specialist Referral: {max_extensions: "=max_extensions", extension_validity_days: "=extension_validity_days", expiry_notice_days: "=expiry_notice_days"}
        Standing Specialist Referral: {max_extensions: "=max_extensions", extension_validity_days: "=extension_validity_days", expiry_notice_days: "=expiry_notice_days"}
        Out-of-Network Referral: {max_extensions: "=max_extensions", extension_validity_days: "=extension_validity_days", expiry_notice_days: "=expiry_notice_days"}
        Physical Therapy Episode Authorization: {max_extensions: "=max_extensions", extension_validity_days: "=extension_validity_days", expiry_notice_days: "=expiry_notice_days"}
        Advanced Imaging Prior Authorization: {max_extensions: "=max_extensions", extension_validity_days: "=extension_validity_days", expiry_notice_days: "=expiry_notice_days"}
        Outpatient Procedure Prior Authorization: {max_extensions: "=max_extensions", extension_validity_days: "=extension_validity_days", expiry_notice_days: "=expiry_notice_days"}

  - id: referral_denial_and_appeal
    subject: [referral_denied, referral_appeal_filed, referral_denial_finalized]
    rule: >-
      A denied request may be appealed. The appeal is filed no later than the tier's appeal window counted from
      the denial decision date. The window is counted in calendar days starting the day after the decision
      date, and an appeal filed on the last day still qualifies. Where appeal_patient_consent_required is
      true the patient must sign the appeal consent, so the appeal is the patient's own act. Appeals are
      decided within appeal_decision_days, or within expedited_appeal_hours when the ordering clinician
      attests that waiting could seriously jeopardize the patient's health. Up to appeal_levels_available
      levels may be used; when the last level upholds the denial, or the window passes with no appeal, the
      denial is final. Where peer_to_peer_available is true the ordering clinician may instead ask for a
      peer-to-peer review within peer_to_peer_window_business_days business days of the denial, held within
      peer_to_peer_turnaround_business_days; it does not stop the appeal window. After a final denial the
      patient may cancel the service or proceed at their own expense, signing a financial-liability notice
      where liability_notice_on_denial is true; without that notice the group may not bill the patient for
      the denied service. For the In-Group Specialist Referral the single level is an internal review by the
      specialty's medical director.
    eligibility:
      - id: appeal_window
        applies_to: [referral_appeal_filed]
        kind: time
        condition: "The appeal is filed no later than the tier's appeal window counted from the denial decision date."
        evidence_fields: [referrals.decision_date, referrals.referral_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[referrals.referral_id]]
          action_bindings: {referrals.referral_id: referral_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the denial decision date"
          anchor_source: referrals.decision_date
          relation: not_after
          duration_source: variants.appeal_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the decision date, and an appeal filed on the last day still qualifies."
          boundary: inclusive
    params:
      per_tier:
        In-Group Specialist Referral: {appeal_window_days: "=appeal_window_days", appeal_levels_available: "=appeal_levels_available", peer_to_peer_window_business_days: "=peer_to_peer_window_business_days"}
        HMO Specialist Referral: {appeal_window_days: "=appeal_window_days", appeal_levels_available: "=appeal_levels_available", peer_to_peer_window_business_days: "=peer_to_peer_window_business_days"}
        Standing Specialist Referral: {appeal_window_days: "=appeal_window_days", appeal_levels_available: "=appeal_levels_available", peer_to_peer_window_business_days: "=peer_to_peer_window_business_days"}
        Out-of-Network Referral: {appeal_window_days: "=appeal_window_days", appeal_levels_available: "=appeal_levels_available", peer_to_peer_window_business_days: "=peer_to_peer_window_business_days"}
        Physical Therapy Episode Authorization: {appeal_window_days: "=appeal_window_days", appeal_levels_available: "=appeal_levels_available", peer_to_peer_window_business_days: "=peer_to_peer_window_business_days"}
        Advanced Imaging Prior Authorization: {appeal_window_days: "=appeal_window_days", appeal_levels_available: "=appeal_levels_available", peer_to_peer_window_business_days: "=peer_to_peer_window_business_days"}
        Outpatient Procedure Prior Authorization: {appeal_window_days: "=appeal_window_days", appeal_levels_available: "=appeal_levels_available", peer_to_peer_window_business_days: "=peer_to_peer_window_business_days"}

  - id: referral_provider_change
    subject: [referral_provider_changed]
    rule: >-
      Where provider_change_allowed is true, a patient may move an open referral to another rendering
      provider of the same specialty (for imaging and procedures, another site) without a new request; the
      units and validity carry over. The referral status is submitted or approved when the rendering
      provider is changed. Where rendering_in_group_required is true the new provider must be a Linden Ridge
      clinician. Where provider_change_allowed is false (the HMO Specialist Referral and the Out-of-Network
      Referral) a different provider needs a new request, because the payer authorizes the named provider.
      Where second_opinion_allowed is true, one second-opinion visit with a different provider of the
      specialty may be booked against the referral without changing the rendering provider. Where
      site_of_service_restricted is true, a visit at a site other than the one on the authorization is not
      covered by it. A change of the ordered service itself requires a new request where
      service_change_requires_new_request is true.
    eligibility:
      - id: changeable_status
        applies_to: [referral_provider_changed]
        kind: state
        condition: "The referral status is submitted or approved when the rendering provider is changed."
        evidence_fields: [referrals.status, referrals.referral_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[referrals.referral_id]]
          action_bindings: {referrals.referral_id: referral_id}
        state_contract:
          field: referrals.status
          allowed: [submitted, approved]
    params:
      per_tier:
        In-Group Specialist Referral: {provider_change_allowed: "=provider_change_allowed", rendering_in_group_required: "=rendering_in_group_required"}
        HMO Specialist Referral: {provider_change_allowed: "=provider_change_allowed", rendering_in_group_required: "=rendering_in_group_required"}
        Standing Specialist Referral: {provider_change_allowed: "=provider_change_allowed", rendering_in_group_required: "=rendering_in_group_required"}
        Out-of-Network Referral: {provider_change_allowed: "=provider_change_allowed", rendering_in_group_required: "=rendering_in_group_required"}
        Physical Therapy Episode Authorization: {provider_change_allowed: "=provider_change_allowed", rendering_in_group_required: "=rendering_in_group_required"}
        Advanced Imaging Prior Authorization: {provider_change_allowed: "=provider_change_allowed", rendering_in_group_required: "=rendering_in_group_required"}
        Outpatient Procedure Prior Authorization: {provider_change_allowed: "=provider_change_allowed", rendering_in_group_required: "=rendering_in_group_required"}

  - id: referral_retro_authorization
    subject: [referral_units_granted]
    rule: >-
      A service that was performed without the authorization its tier requires may be authorized
      retroactively where retro_authorization_window_days is above 0 (urgent imaging and procedures, and
      in-group referrals). The retroactive request is made no later than the tier's retro window counted
      from the date of service of the visit. The window is counted in calendar days starting the day after
      the date of service, and a request on the last day still qualifies. An approved retroactive request
      grants units with reason retro_authorization equal to the services it covers, and those services then
      use the units. A service outside the window, or on a tier with no retro window, stays unauthorized; the
      group, not the insured patient, bears that denial under the financial account rules.
    eligibility:
      - id: retro_window
        applies_to: [referral_units_granted]
        kind: time
        condition: "The retroactive request is made no later than the tier's retro window counted from the date of service of the visit."
        evidence_fields: [appointments.scheduled_date, appointments.appointment_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[appointments.appointment_id]]
          action_bindings: {appointments.appointment_id: appointment_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date of service of the visit"
          anchor_source: appointments.scheduled_date
          relation: not_after
          duration_source: variants.retro_authorization_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days starting the day after the date of service, and a request on the last day still qualifies."
          boundary: inclusive
    params:
      per_tier:
        In-Group Specialist Referral: {retro_authorization_window_days: "=retro_authorization_window_days"}
        HMO Specialist Referral: {retro_authorization_window_days: "=retro_authorization_window_days"}
        Standing Specialist Referral: {retro_authorization_window_days: "=retro_authorization_window_days"}
        Out-of-Network Referral: {retro_authorization_window_days: "=retro_authorization_window_days"}
        Physical Therapy Episode Authorization: {retro_authorization_window_days: "=retro_authorization_window_days"}
        Advanced Imaging Prior Authorization: {retro_authorization_window_days: "=retro_authorization_window_days"}
        Outpatient Procedure Prior Authorization: {retro_authorization_window_days: "=retro_authorization_window_days"}

  - id: referral_out_of_network
    subject: [referral_requested, referral_submitted]
    rule: >-
      An Out-of-Network Referral is requested only when a network gap is documented: the nearest in-network
      provider of the specialty is farther than oon_network_gap_distance_miles from the patient's mailing ZIP
      code, or the first in-network appointment is more than oon_network_gap_wait_days away. Before
      submission the patient must sign the cost-share acknowledgement, which only the patient can give, so it
      is the patient's own act. An approved out-of-network referral is billed by the outside provider under
      the payer's in-network cost share; telehealth visits with that provider do not use its units. A patient
      who wants an out-of-network provider without a network gap is not eligible for this tier.
    eligibility: []

  - id: referral_cancellation_and_lapse
    subject: [referral_cancelled, referral_units_forfeited, referral_expired]
    rule: >-
      A patient may cancel a referral that is requested or approved; unused units lapse with the
      cancellation. A referral superseded by an approved standing referral is cancelled with reason
      superseded. When a referral lapses (expiry or cancellation), open appointments booked against it are not
      automatically covered by another referral: each is re-linked to another approved referral of the same
      specialty that covers its date, or else moved or cancelled by the clinic with reason
      missing_authorization under the appointment rules. A patient who has not booked a visit
      unscheduled_followup_days after approval is contacted by the coordinator; the referral is not cancelled
      for that reason alone. Units that lapse are never restored; the patient needs an extension (while
      allowed) or a new request.
    eligibility: []

extended_policies:
- id: referral_ext_study_site_estimate
  base_policy_refs:
  - referral_provider_change
  - referral_submission_and_decision
  overwrite: []
  trigger: on_request
  subject:
  - referral_provider_changed
  computes: estimated_patient_share_usd
  target_tool: confirm_imaging_site_change_a21d40f9
  params: {}
  rule: >-
    When an approved imaging or procedure prior authorization is moved to another site, the patient signs for a
    pre-service estimate of the amount asked of them at check-in for the study at that site, and the site change
    is recorded together with that estimate; the site given is the clinic location of the study booked against the
    authorization, copied exactly. The estimate is the specialist copay recorded on the patient's financial account.
    The copay in the site-change estimate follows the financial class: where the class does not collect copays at
    check-in, the copay is nothing; where the class collects copays at check-in but no specialist copay above zero
    is recorded on the account, the copay is the office-visit copay; otherwise the copay is the specialist copay.
    The deductible rate in the site-change estimate follows the financial account: where the financial class collects
    a deductible share at the time of service and the last coverage verification will be older than that class's
    re-verification period on the study date, the rate is 100 percent; where the class collects a deductible share
    and the last coverage verification will still be within that period on the study date, the rate is the class's
    deductible collection percentage; otherwise the rate is zero. The deductible part of the site-change estimate
    is the remaining deductible on the financial account multiplied by the deductible rate and divided by 100, rounded
    half up to the cent: where the rate is above zero and that figure reaches the financial class's time-of-service
    collection cap, the deductible part is the cap; where the rate is above zero and some deductible remains, the
    deductible part is that figure; otherwise the deductible part is zero. Hardship relief in the site-change estimate
    follows the account's hardship approval: where the approval runs through the study date or later and its percentage
    is 50 or more, the copay and the deductible part are added and that sum is reduced by the approved percentage;
    where the approval runs through the study date or later and its percentage is above zero but below 50, only
    the deductible part is reduced by the approved percentage and the copay is kept whole; otherwise nothing is
    reduced; each reduced figure is rounded half up to the cent. The missed-visit deposit in the site-change estimate
    follows the no-show fees assessed on the patient's appointments in the 12 months before the handling date (a
    fee later waived still counts as assessed): two or more such fees add the no-show fee of the booked study's
    visit type, exactly one adds the late-cancellation fee of that visit type, and none adds nothing. The credit
    offset in the site-change estimate follows the financial account's balance, the amount due being the relieved
    copay and deductible part plus the missed-visit deposit: a credit at least as large as the amount due offsets
    the whole amount due, a smaller credit offsets its own amount, and an account without a credit offsets nothing.
    The estimate signed for is the amount due less the credit offset, never below zero, rounded half up to the cent.
  prerequisite: []
  cross_category:
  - category: appointment
    as: history
    reads:
    - scheduled_date
    - no_show_fee_usd
    - late_cancel_fee_usd
    - appointment_events.event_type
    - appointment_events.fee_type
    - appointment_events.event_date
    note: >-
      The booked study's date and visit type fee amounts decide the missed-visit deposit; the patient's no-show
      fee ledger decides the deposit tier.
  - category: billing
    as: branch
    reads:
    - copay_collect_at_checkin
    - copay_specialist_usd
    - copay_primary_usd
    - deductible_remaining_usd
    - coverage_verified_date
    - hardship_approved_pct
    - hardship_approved_through
    - patient_balance
    - deductible_estimate_collect_pct
    - pos_estimate_cap_usd
    - coverage_reverification_days
    note: >-
      The financial class's copay collection, collection percentage, cap and re-verification period and the account's
      copays, deductible, verification date, hardship approval and balance decide the copay, rate, deductible, relief
      and credit factors.
  compute:
  - booked_date: CFIELD('appointment','scheduled_date', referral_id=HID, status='booked')
  - site_class_collects_copay: CPARAM('billing','copay_collect_at_checkin')
  - copay_specialist: CFIELD('billing','copay_specialist_usd')
  - copay_office: CFIELD('billing','copay_primary_usd')
  - site_copay: >-
      0 if not site_class_collects_copay else (copay_office if copay_specialist <= 0 else copay_specialist)
  - class_collect_pct: CPARAM('billing','deductible_estimate_collect_pct')
  - class_reverify_days: CPARAM('billing','coverage_reverification_days')
  - verification_age_at_study: DAYS(CFIELD('billing','coverage_verified_date'), booked_date)
  - site_rate: >-
      100 if (class_collect_pct > 0 and verification_age_at_study > class_reverify_days) else (class_collect_pct
      if (class_collect_pct > 0 and verification_age_at_study <= class_reverify_days) else 0)
  - deductible_left: CFIELD('billing','deductible_remaining_usd')
  - class_pos_cap: CPARAM('billing','pos_estimate_cap_usd')
  - site_deductible: >-
      class_pos_cap if (site_rate > 0 and RND(deductible_left * site_rate / 100, 2) >= class_pos_cap) else (RND(deductible_left
      * site_rate / 100, 2) if (site_rate > 0 and deductible_left > 0) else 0)
  - hardship_pct: CFIELD('billing','hardship_approved_pct')
  - hardship_through: CFIELD('billing','hardship_approved_through')
  - site_relieved: >-
      RND((site_copay + site_deductible) * (1 - hardship_pct / 100), 2) if (hardship_through >= booked_date and
      hardship_pct >= 50) else (RND(site_copay + site_deductible * (1 - hardship_pct / 100), 2) if (hardship_through
      >= booked_date and hardship_pct > 0) else site_copay + site_deductible)
  - no_show_fees_12m: >-
      XCOUNT('appointment','appointment_events', within_months=12, date_field='event_date', event_type='appointment_fee_assessed',
      fee_type='no_show_fee')
  - site_deposit: >-
      CPARAM('appointment','no_show_fee_usd', referral_id=HID, status='booked') if no_show_fees_12m >= 2 else (CPARAM('appointment','late_cancel_fee_usd',
      referral_id=HID, status='booked') if no_show_fees_12m == 1 else 0)
  - amount_due: site_relieved + site_deposit
  - account_balance: CFIELD('billing','patient_balance')
  - site_credit: >-
      amount_due if (account_balance < 0 and 0 - account_balance >= amount_due) else (0 - account_balance if (account_balance
      < 0 and 0 - account_balance < amount_due) else 0)
  - result: RND(MX(0, amount_due - site_credit), 2)
  compute_basis:
    booked_date: the site given is the clinic location of the study booked against the authorization, copied exactly.
    copay_specialist: The estimate is the specialist copay recorded on the patient's financial account.
    copay_office: the copay is the office-visit copay
    site_copay: >-
      where the class does not collect copays at check-in, the copay is nothing; where the class collects copays
      at check-in but no specialist copay above zero is recorded on the account, the copay is the office-visit copay;
      otherwise the copay is the specialist copay.
    class_collect_pct: where the financial class collects a deductible share at the time of service
    class_reverify_days: older than that class's re-verification period on the study date
    verification_age_at_study: >-
      the last coverage verification will be older than that class's re-verification period on the study date
    site_rate: >-
      where the financial class collects a deductible share at the time of service and the last coverage verification
      will be older than that class's re-verification period on the study date, the rate is 100 percent; where the
      class collects a deductible share and the last coverage verification will still be within that period on the
      study date, the rate is the class's deductible collection percentage; otherwise the rate is zero.
    deductible_left: >-
      the remaining deductible on the financial account multiplied by the deductible rate and divided by 100, rounded
      half up to the cent
    class_pos_cap: the financial class's time-of-service collection cap
    site_deductible: >-
      where the rate is above zero and that figure reaches the financial class's time-of-service collection cap,
      the deductible part is the cap; where the rate is above zero and some deductible remains, the deductible part
      is that figure; otherwise the deductible part is zero.
    hardship_pct: Hardship relief in the site-change estimate follows the account's hardship approval
    hardship_through: where the approval runs through the study date or later
    site_relieved: >-
      where the approval runs through the study date or later and its percentage is 50 or more, the copay and the
      deductible part are added and that sum is reduced by the approved percentage; where the approval runs through
      the study date or later and its percentage is above zero but below 50, only the deductible part is reduced
      by the approved percentage and the copay is kept whole; otherwise nothing is reduced; each reduced figure
      is rounded half up to the cent.
    no_show_fees_12m: >-
      the no-show fees assessed on the patient's appointments in the 12 months before the handling date (a fee later
      waived still counts as assessed)
    site_deposit: >-
      two or more such fees add the no-show fee of the booked study's visit type, exactly one adds the late-cancellation
      fee of that visit type, and none adds nothing.
    amount_due: the amount due being the relieved copay and deductible part plus the missed-visit deposit
    account_balance: The credit offset in the site-change estimate follows the financial account's balance
    site_credit: >-
      a credit at least as large as the amount due offsets the whole amount due, a smaller credit offsets its own
      amount, and an account without a credit offsets nothing.
    result: >-
      The estimate signed for is the amount due less the credit offset, never below zero, rounded half up to the
      cent.
    site_class_collects_copay: The copay in the site-change estimate follows the financial class
  factors:
  - id: site_copay_by_class
    effect: parameter
    decides: site_copay
    bindings:
    - site_class_collects_copay
    - copay_specialist
    - copay_office
    - site_copay
    ladder:
    - when: the financial class does not collect copays at check-in
      value: nothing
    - when: the class collects copays at check-in but no specialist copay above zero is recorded on the account
      value: the office-visit copay
    - when: otherwise
      value: the specialist copay recorded on the financial account
    baseline:
      site_copay: copay_specialist
    evidence:
    - cross_category
    cross_difficulty: billing
  - id: site_deductible_rate
    effect: parameter
    decides: site_rate
    bindings:
    - class_collect_pct
    - class_reverify_days
    - verification_age_at_study
    - site_rate
    ladder:
    - when: >-
        the financial class collects a deductible share at the time of service and the last coverage verification
        will be older than the class's re-verification period on the study date
      value: 100 percent
    - when: >-
        the financial class collects a deductible share and the last coverage verification will still be within
        that period on the study date
      value: the class's deductible collection percentage
    - when: otherwise
      value: zero
    baseline:
      site_rate: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: billing
  - id: site_deductible_part
    effect: parameter
    decides: site_deductible
    bindings:
    - deductible_left
    - class_pos_cap
    - site_deductible
    ladder:
    - when: >-
        the rate is above zero and the remaining deductible times the rate reaches the class's time-of-service collection
        cap
      value: the cap
    - when: the rate is above zero and some deductible remains
      value: the remaining deductible times the rate, divided by 100
    - when: otherwise
      value: zero
    baseline:
      site_deductible: '0'
    evidence:
    - cross_category
    cross_difficulty: billing
  - id: site_hardship_relief
    effect: method
    decides: site_relieved
    bindings:
    - hardship_pct
    - hardship_through
    - site_relieved
    ladder:
    - when: the hardship approval runs through the study date or later and its percentage is 50 or more
      method: the copay and the deductible part are added and the sum is reduced by the approved percentage
    - when: >-
        the hardship approval runs through the study date or later and its percentage is above zero but below 50
      method: only the deductible part is reduced by the approved percentage; the copay is kept whole
    - when: otherwise
      method: nothing is reduced; the copay and the deductible part are added as they stand
    baseline:
      site_relieved: site_copay + site_deductible
    evidence:
    - cross_category
    - date
    cross_difficulty: billing
  - id: site_missed_visit_deposit
    effect: parameter
    decides: site_deposit
    bindings:
    - no_show_fees_12m
    - site_deposit
    ladder:
    - when: >-
        two or more no-show fees were assessed on the patient's appointments in the 12 months before the handling
        date, a fee later waived still counting
      value: the no-show fee of the booked study's visit type
    - when: exactly one such fee was assessed
      value: the late-cancellation fee of the booked study's visit type
    - when: otherwise
      value: nothing
    baseline:
      site_deposit: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: appointment
  - id: site_credit_offset
    effect: parameter
    decides: site_credit
    bindings:
    - account_balance
    - site_credit
    ladder:
    - when: the financial account carries a credit at least as large as the amount due
      value: the whole amount due
    - when: the financial account carries a credit smaller than the amount due
      value: the credit's own amount
    - when: otherwise
      value: nothing
    baseline:
      site_credit: '0'
    evidence:
    - cross_category
    cross_difficulty: billing
  baseline:
    rule: The estimate is the specialist copay recorded on the patient's financial account.
    params: []
  inputs:
    history:
    - category: appointment
      table: appointment_events
      aggregate: count
      field: appointment_event_id
      within_months: 12
      filters:
        event_type: appointment_fee_assessed
        fee_type: no_show_fee
    cross_category:
    - appointment
    - billing
- id: referral_ext_study_validity
  base_policy_refs:
  - referral_validity_extension
  overwrite:
  - base_policy: referral_validity_extension
    superseded_clause: >-
      Each extension adds extension_validity_days to valid_through and, where extension_units is above 0, grants
      those units (an exhausted referral returns to approved on that grant).
    replaced_by: >-
      The added validity days are that sum plus the weekend roll, and the extension is recorded as one extension
      decision that adds no units.
  trigger: on_request
  subject:
  - referral_validity_extended
  computes: added_validity_days
  target_tool: extend_study_authorization_f1ccb059
  params:
    repeat_no_show_margin_days: 14
    single_no_show_margin_days: 7
    repeat_late_cancel_margin_days: 6
    single_late_cancel_margin_days: 3
    payer_recheck_allowance_days: 5
    internal_recheck_allowance_days: 3
    repeat_reschedule_allowance_days: 7
    single_reschedule_allowance_days: 5
    saturday_roll_days: 2
    sunday_roll_days: 1
  rule: >-
    An extension of an approved or exhausted prior authorization whose tier adds no units on extension (the Advanced
    Imaging Prior Authorization and the Outpatient Procedure Prior Authorization) lengthens its validity by the
    added validity days set out here. An extension adds the tier's extension_validity_days to valid_through. The
    added validity is fixed only after the site named on the authorization is the site where the booked study will
    be performed. The study span of the added validity follows the study booked against the authorization: where
    the study is booked at the site named on the authorization for a date after valid_through, the study span is
    the number of calendar days from valid_through to the study date; where it is booked at the named site for a
    date on or before valid_through, the study span is zero; otherwise the study span is the tier's extension_validity_days.
    The no-show margin of the added validity follows the no-show fees assessed on the patient's appointments in
    the 12 months before the handling date (a fee later waived still counts as assessed): two or more give the repeat
    no-show margin of 14 days, exactly one gives the single no-show margin of 7 days, and none gives no margin.
    The late-cancellation margin of the added validity follows the late-cancellation fees assessed on the patient's
    appointments in the 12 months before the handling date (a fee later waived still counts as assessed): two or
    more give the repeat late-cancellation margin of 6 days, exactly one gives the single late-cancellation margin
    of 3 days, and none gives no margin. The coverage re-check allowance of the added validity follows the age,
    on the study date, of the last coverage verification on the financial account: older than both the tier's eligibility_recheck_days
    and the financial class's re-verification period gives the payer re-check allowance of 5 days; older than the
    tier's eligibility_recheck_days but within the class's re-verification period gives the internal re-check allowance
    of 3 days; otherwise there is no allowance. The reschedule allowance of the added validity follows the booked
    study's own count of patient reschedules: two or more give the repeat-reschedule allowance of 7 days, exactly
    one gives the single-reschedule allowance of 5 days, and none gives no allowance. The study span, the two margins
    and the two allowances are added together, all in calendar days. The weekend roll of the added validity follows
    the day on which valid_through moved forward by that sum would fall: a Saturday gives a weekend roll of 2 days
    and a Sunday a weekend roll of 1 day, so the authorization runs through the following Monday, and any other
    day gives no weekend roll. The added validity days are that sum plus the weekend roll, and the extension is
    recorded as one extension decision that adds no units.
  prerequisite:
  - problem: referral_ext_study_site_estimate
    kind: value_input
    gate: named_site_match
    form: state
    policy_source: >-
      The added validity is fixed only after the site named on the authorization is the site where the booked study
      will be performed.
    condition: >-
      referrals.rendering_provider on the authorization equals the clinic_location of the appointment booked against
      it with status booked.
    resolved_by: confirm_imaging_site_change_a21d40f9
    effect: >-
      Once the authorization names the booked study's site, named_site_match becomes 1 and the study span is measured
      from valid_through to the booked study date instead of falling through to the tier's extension_validity_days.
  cross_category:
  - category: appointment
    as: history
    reads:
    - scheduled_date
    - clinic_location
    - reschedule_count
    - appointment_events.event_type
    - appointment_events.fee_type
    - appointment_events.event_date
    note: >-
      The booked study's date, site and reschedule count decide the span and reschedule factors; the no-show and
      late-cancellation fee ledgers decide the two margin factors.
  - category: billing
    as: branch
    reads:
    - coverage_verified_date
    - coverage_reverification_days
    note: >-
      The financial account's last coverage verification and its class's re-verification period decide the re-check
      allowance.
  compute:
  - booked_study_date: CFIELD('appointment','scheduled_date', referral_id=HID, status='booked')
  - booked_study_site: CFIELD('appointment','clinic_location', referral_id=HID, status='booked')
  - named_site_match: 1 if booked_study_site == F('rendering_provider') else 0
  - days_past_validity: DAYS(F('valid_through'), booked_study_date)
  - study_span: >-
      days_past_validity if (named_site_match == 1 and days_past_validity > 0) else (0 if (named_site_match == 1
      and days_past_validity <= 0) else P('extension_validity_days'))
  - no_show_fee_count: >-
      XCOUNT('appointment','appointment_events', within_months=12, date_field='event_date', event_type='appointment_fee_assessed',
      fee_type='no_show_fee')
  - no_show_margin: >-
      K('repeat_no_show_margin_days') if no_show_fee_count >= 2 else (K('single_no_show_margin_days') if no_show_fee_count
      == 1 else 0)
  - late_cancel_fee_count: >-
      XCOUNT('appointment','appointment_events', within_months=12, date_field='event_date', event_type='appointment_fee_assessed',
      fee_type='late_cancel_fee')
  - late_cancel_margin: >-
      K('repeat_late_cancel_margin_days') if late_cancel_fee_count >= 2 else (K('single_late_cancel_margin_days')
      if late_cancel_fee_count == 1 else 0)
  - study_verification_age: DAYS(CFIELD('billing','coverage_verified_date'), booked_study_date)
  - recheck_allowance: >-
      K('payer_recheck_allowance_days') if (study_verification_age > P('eligibility_recheck_days') and study_verification_age
      > CPARAM('billing','coverage_reverification_days')) else (K('internal_recheck_allowance_days') if (study_verification_age
      > P('eligibility_recheck_days') and study_verification_age <= CPARAM('billing','coverage_reverification_days'))
      else 0)
  - study_reschedules: CFIELD('appointment','reschedule_count', referral_id=HID, status='booked')
  - reschedule_allowance: >-
      K('repeat_reschedule_allowance_days') if study_reschedules >= 2 else (K('single_reschedule_allowance_days')
      if study_reschedules == 1 else 0)
  - days_before_roll: study_span + no_show_margin + late_cancel_margin + recheck_allowance + reschedule_allowance
  - roll_weekday: (DAYS('2026-01-05', F('valid_through')) + days_before_roll) % 7
  - weekend_roll: >-
      K('saturday_roll_days') if roll_weekday == 5 else (K('sunday_roll_days') if roll_weekday == 6 else 0)
  - result: days_before_roll + weekend_roll
  compute_basis:
    booked_study_date: The study span of the added validity follows the study booked against the authorization
    booked_study_site: where the study is booked at the site named on the authorization
    named_site_match: >-
      The added validity is fixed only after the site named on the authorization is the site where the booked study
      will be performed.
    days_past_validity: the study span is the number of calendar days from valid_through to the study date
    study_span: >-
      where the study is booked at the site named on the authorization for a date after valid_through, the study
      span is the number of calendar days from valid_through to the study date; where it is booked at the named
      site for a date on or before valid_through, the study span is zero; otherwise the study span is the tier's
      extension_validity_days.
    no_show_fee_count: >-
      the no-show fees assessed on the patient's appointments in the 12 months before the handling date (a fee later
      waived still counts as assessed)
    no_show_margin: >-
      two or more give the repeat no-show margin of 14 days, exactly one gives the single no-show margin of 7 days,
      and none gives no margin.
    late_cancel_fee_count: >-
      the late-cancellation fees assessed on the patient's appointments in the 12 months before the handling date
      (a fee later waived still counts as assessed)
    late_cancel_margin: >-
      two or more give the repeat late-cancellation margin of 6 days, exactly one gives the single late-cancellation
      margin of 3 days, and none gives no margin.
    study_verification_age: the age, on the study date, of the last coverage verification on the financial account
    recheck_allowance: >-
      older than both the tier's eligibility_recheck_days and the financial class's re-verification period gives
      the payer re-check allowance of 5 days; older than the tier's eligibility_recheck_days but within the class's
      re-verification period gives the internal re-check allowance of 3 days; otherwise there is no allowance.
    study_reschedules: the booked study's own count of patient reschedules
    reschedule_allowance: >-
      two or more give the repeat-reschedule allowance of 7 days, exactly one gives the single-reschedule allowance
      of 5 days, and none gives no allowance.
    days_before_roll: The study span, the two margins and the two allowances are added together, all in calendar
      days.
    roll_weekday: the day on which valid_through moved forward by that sum would fall
    weekend_roll: >-
      a Saturday gives a weekend roll of 2 days and a Sunday a weekend roll of 1 day, so the authorization runs
      through the following Monday, and any other day gives no weekend roll.
    result: The added validity days are that sum plus the weekend roll
  factors:
  - id: study_span
    effect: method
    decides: study_span
    bindings:
    - booked_study_date
    - booked_study_site
    - days_past_validity
    - study_span
    ladder:
    - when: the study is booked at the site named on the authorization for a date after valid_through
      method: the span is counted as the calendar days from valid_through to the study date
    - when: the study is booked at the named site for a date on or before valid_through
      method: the span is zero
    - when: otherwise
      method: the span is the tier's extension_validity_days
    baseline:
      study_span: P('extension_validity_days')
    evidence:
    - cross_category
    - date
    cross_difficulty: appointment
  - id: no_show_margin
    effect: parameter
    decides: no_show_margin
    bindings:
    - no_show_fee_count
    - no_show_margin
    ladder:
    - when: >-
        two or more no-show fees assessed on the patient's appointments in the 12 months before the handling date,
        a fee later waived still counting
      value: 14 days
    - when: exactly one such fee
      value: 7 days
    - when: otherwise
      value: no margin
    baseline:
      no_show_margin: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: appointment
  - id: late_cancel_margin
    effect: parameter
    decides: late_cancel_margin
    bindings:
    - late_cancel_fee_count
    - late_cancel_margin
    ladder:
    - when: >-
        two or more late-cancellation fees assessed on the patient's appointments in the 12 months before the handling
        date, a fee later waived still counting
      value: 6 days
    - when: exactly one such fee
      value: 3 days
    - when: otherwise
      value: no margin
    baseline:
      late_cancel_margin: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: appointment
  - id: recheck_allowance
    effect: parameter
    decides: recheck_allowance
    bindings:
    - study_verification_age
    - recheck_allowance
    ladder:
    - when: >-
        on the study date the last coverage verification is older than both the tier's eligibility_recheck_days
        and the financial class's re-verification period
      value: 5 days
    - when: it is older than the tier's eligibility_recheck_days but within the class's re-verification period
      value: 3 days
    - when: otherwise
      value: no allowance
    baseline:
      recheck_allowance: '0'
    evidence:
    - cross_category
    - date
    - tier_param
    cross_difficulty: billing
  - id: reschedule_allowance
    effect: parameter
    decides: reschedule_allowance
    bindings:
    - study_reschedules
    - reschedule_allowance
    ladder:
    - when: the booked study has been rescheduled by the patient two or more times
      value: 7 days
    - when: exactly once
      value: 5 days
    - when: otherwise
      value: no allowance
    baseline:
      reschedule_allowance: '0'
    evidence:
    - cross_category
    cross_difficulty: appointment
  - id: weekend_roll
    effect: parameter
    decides: weekend_roll
    bindings:
    - roll_weekday
    - weekend_roll
    ladder:
    - when: valid_through moved forward by the sum falls on a Saturday
      value: 2 days
    - when: it falls on a Sunday
      value: 1 day
    - when: otherwise
      value: no weekend roll
    baseline:
      weekend_roll: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: An extension adds the tier's extension_validity_days to valid_through.
    params:
    - extension_validity_days
  inputs:
    history:
    - category: appointment
      table: appointment_events
      aggregate: count
      field: appointment_event_id
      within_months: 12
      filters:
        event_type: appointment_fee_assessed
        fee_type: no_show_fee
    - category: appointment
      table: appointment_events
      aggregate: count
      field: appointment_event_id
      within_months: 12
      filters:
        event_type: appointment_fee_assessed
        fee_type: late_cancel_fee
    cross_category:
    - appointment
    - billing
- id: referral_ext_oon_visit_share
  base_policy_refs:
  - referral_validity_extension
  - referral_out_of_network
  - referral_submission_and_decision
  overwrite: []
  trigger: on_request
  subject:
  - referral_validity_extended
  computes: acknowledged_cost_share_usd
  target_tool: sign_oon_cost_share_acknowledgement_95eb7797
  params: {}
  rule: >-
    The cost-share acknowledgement a patient signs on an Out-of-Network Referral states the out-of-network visit
    share, the amount asked of the patient at each continued visit with the outside provider under the payer's in-network
    cost share. The out-of-network visit share is the office-visit copay recorded on the patient's financial account.
    The copay in the out-of-network visit share follows the financial account: where the financial class collects
    copays at check-in and a specialist copay above zero is recorded, the copay is that specialist copay; where
    the financial class does not collect copays at check-in, the copay is nothing; otherwise the copay is the office-visit
    copay. The deductible basis of the out-of-network visit share follows the account's own ledger: where the patient's
    most recent deductible charge is above zero and the remaining deductible is at least that charge, the basis
    is that charge; where the remaining deductible is above zero but smaller than that charge, or no deductible
    charge is on the ledger, the basis is the remaining deductible; otherwise the basis is zero. The collection
    rate of the out-of-network visit share follows the account's coverage verification on the handling date: where
    the financial class collects a deductible share at the time of service and the last coverage verification is
    older than that class's re-verification period, the rate is 100 percent; where the class collects a deductible
    share and the verification is within that period, the rate is the class's deductible collection percentage;
    otherwise the rate is zero. The deductible part of the out-of-network visit share is the basis multiplied by
    the rate and divided by 100, rounded half up to the cent, and never more than the financial class's time-of-service
    collection cap. Hardship relief of the out-of-network visit share follows the account's hardship approval on
    the handling date: where the approval runs through the handling date or later and its percentage is 50 or more,
    the copay and the deductible part are added and that sum is reduced by the approved percentage; where the approval
    runs through the handling date or later and its percentage is above zero but below 50, only the deductible part
    is reduced by the approved percentage and the copay is kept whole; otherwise nothing is reduced; each reduced
    figure is rounded half up to the cent. The acknowledged out-of-network visit share is the relieved copay and
    deductible part, rounded half up to the cent.
  prerequisite: []
  cross_category:
  - category: billing
    as: history
    reads:
    - copay_primary_usd
    - copay_specialist_usd
    - deductible_remaining_usd
    - coverage_verified_date
    - hardship_approved_pct
    - hardship_approved_through
    - copay_collect_at_checkin
    - deductible_estimate_collect_pct
    - pos_estimate_cap_usd
    - coverage_reverification_days
    - billing_transactions.amount
    - billing_transactions.line_category
    - billing_transactions.txn_date
    note: >-
      The financial account's copays, deductible, verification date and hardship approval, its class's collection
      parameters and the latest deductible charge on its ledger decide all four factors.
  compute:
  - class_collects_copay: CPARAM('billing','copay_collect_at_checkin')
  - share_specialist_copay: CFIELD('billing','copay_specialist_usd')
  - share_office_copay: CFIELD('billing','copay_primary_usd')
  - share_copay: >-
      share_specialist_copay if (class_collects_copay and share_specialist_copay > 0) else (0 if not class_collects_copay
      else share_office_copay)
  - latest_deductible_charge: >-
      float(XLATEST('billing','billing_transactions','amount', date_field='txn_date', event_type='billing_charge_posted',
      line_category='deductible') or 0)
  - share_deductible_left: CFIELD('billing','deductible_remaining_usd')
  - share_basis: >-
      latest_deductible_charge if (latest_deductible_charge > 0 and share_deductible_left >= latest_deductible_charge)
      else (share_deductible_left if share_deductible_left > 0 else 0)
  - share_collect_pct: CPARAM('billing','deductible_estimate_collect_pct')
  - share_verification_age: DAYS(CFIELD('billing','coverage_verified_date'), NOW)
  - share_rate: >-
      100 if (share_collect_pct > 0 and share_verification_age > CPARAM('billing','coverage_reverification_days'))
      else (share_collect_pct if (share_collect_pct > 0 and share_verification_age <= CPARAM('billing','coverage_reverification_days'))
      else 0)
  - share_deductible_part: MN(CPARAM('billing','pos_estimate_cap_usd'), RND(share_basis * share_rate / 100, 2))
  - share_hardship_pct: CFIELD('billing','hardship_approved_pct')
  - share_hardship_through: CFIELD('billing','hardship_approved_through')
  - share_relieved: >-
      RND((share_copay + share_deductible_part) * (1 - share_hardship_pct / 100), 2) if (share_hardship_through
      >= NOW and share_hardship_pct >= 50) else (RND(share_copay + share_deductible_part * (1 - share_hardship_pct
      / 100), 2) if (share_hardship_through >= NOW and share_hardship_pct > 0) else share_copay + share_deductible_part)
  - result: RND(share_relieved, 2)
  compute_basis:
    class_collects_copay: where the financial class collects copays at check-in
    share_specialist_copay: a specialist copay above zero is recorded, the copay is that specialist copay
    share_office_copay: >-
      The out-of-network visit share is the office-visit copay recorded on the patient's financial account.
    share_copay: >-
      where the financial class collects copays at check-in and a specialist copay above zero is recorded, the copay
      is that specialist copay; where the financial class does not collect copays at check-in, the copay is nothing;
      otherwise the copay is the office-visit copay.
    latest_deductible_charge: the patient's most recent deductible charge
    share_deductible_left: the remaining deductible
    share_basis: >-
      where the patient's most recent deductible charge is above zero and the remaining deductible is at least that
      charge, the basis is that charge; where the remaining deductible is above zero but smaller than that charge,
      or no deductible charge is on the ledger, the basis is the remaining deductible; otherwise the basis is zero.
    share_collect_pct: where the financial class collects a deductible share at the time of service
    share_verification_age: the last coverage verification is older than that class's re-verification period
    share_rate: >-
      where the financial class collects a deductible share at the time of service and the last coverage verification
      is older than that class's re-verification period, the rate is 100 percent; where the class collects a deductible
      share and the verification is within that period, the rate is the class's deductible collection percentage;
      otherwise the rate is zero.
    share_deductible_part: >-
      The deductible part of the out-of-network visit share is the basis multiplied by the rate and divided by 100,
      rounded half up to the cent, and never more than the financial class's time-of-service collection cap.
    share_hardship_pct: >-
      Hardship relief of the out-of-network visit share follows the account's hardship approval on the handling
      date
    share_hardship_through: where the approval runs through the handling date or later
    share_relieved: >-
      where the approval runs through the handling date or later and its percentage is 50 or more, the copay and
      the deductible part are added and that sum is reduced by the approved percentage; where the approval runs
      through the handling date or later and its percentage is above zero but below 50, only the deductible part
      is reduced by the approved percentage and the copay is kept whole; otherwise nothing is reduced; each reduced
      figure is rounded half up to the cent.
    result: >-
      The acknowledged out-of-network visit share is the relieved copay and deductible part, rounded half up to
      the cent.
  factors:
  - id: share_copay
    effect: parameter
    decides: share_copay
    bindings:
    - class_collects_copay
    - share_specialist_copay
    - share_office_copay
    - share_copay
    ladder:
    - when: the financial class collects copays at check-in and a specialist copay above zero is recorded
      value: the specialist copay
    - when: the financial class does not collect copays at check-in
      value: nothing
    - when: otherwise
      value: the office-visit copay
    baseline:
      share_copay: share_office_copay
    evidence:
    - cross_category
    cross_difficulty: billing
  - id: share_deductible_basis
    effect: parameter
    decides: share_basis
    bindings:
    - latest_deductible_charge
    - share_deductible_left
    - share_basis
    ladder:
    - when: >-
        the most recent deductible charge on the ledger is above zero and the remaining deductible is at least that
        charge
      value: that most recent deductible charge
    - when: >-
        the remaining deductible is above zero but smaller than that charge, or no deductible charge is on the ledger
      value: the remaining deductible
    - when: otherwise
      value: zero
    baseline:
      share_basis: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: billing
  - id: share_collection_rate
    effect: parameter
    decides: share_rate
    bindings:
    - share_collect_pct
    - share_verification_age
    - share_rate
    ladder:
    - when: >-
        the class collects a deductible share at the time of service and the last coverage verification is older
        than the class's re-verification period
      value: 100 percent
    - when: the class collects a deductible share and the verification is within that period
      value: the class's deductible collection percentage
    - when: otherwise
      value: zero
    baseline:
      share_rate: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: billing
  - id: share_hardship_relief
    effect: method
    decides: share_relieved
    bindings:
    - share_hardship_pct
    - share_hardship_through
    - share_relieved
    ladder:
    - when: the hardship approval runs through the handling date or later and its percentage is 50 or more
      method: the copay and the deductible part are added and the sum is reduced by the approved percentage
    - when: >-
        the hardship approval runs through the handling date or later and its percentage is above zero but below
        50
      method: only the deductible part is reduced by the approved percentage; the copay is kept whole
    - when: otherwise
      method: nothing is reduced; the copay and the deductible part are added as they stand
    baseline:
      share_relieved: share_copay + share_deductible_part
    evidence:
    - cross_category
    - date
    cross_difficulty: billing
  baseline:
    rule: >-
      The out-of-network visit share is the office-visit copay recorded on the patient's financial account.
    params: []
  inputs:
    history:
    - category: billing
      table: billing_transactions
      aggregate: latest
      field: amount
      filters:
        event_type: billing_charge_posted
        line_category: deductible
    cross_category:
    - billing
- id: referral_ext_visit_validity
  base_policy_refs:
  - referral_validity_extension
  overwrite:
  - base_policy: referral_validity_extension
    superseded_clause: >-
      Each extension adds extension_validity_days to valid_through and, where extension_units is above 0, grants
      those units (an exhausted referral returns to approved on that grant).
    replaced_by: >-
      The course validity days are that sum plus the course weekend roll; the visits of the extension are posted
      separately and this lengthening is not counted as an extension decision of its own.
  trigger: on_request
  subject:
  - referral_validity_extended
  computes: added_validity_days
  target_tool: lengthen_referral_validity_fab859e3
  params:
    active_course_extra_days: 24
    open_course_span_days: 56
    payer_course_recheck_days: 5
    internal_course_recheck_days: 2
    saturday_course_roll_days: 2
    sunday_course_roll_days: 1
  rule: >-
    When a visit referral whose tier adds units on extension (the In-Group Specialist Referral, the HMO Specialist
    Referral, the Out-of-Network Referral and the Physical Therapy Episode Authorization) is extended, its validity
    is lengthened by the course validity days set out here. A lengthening adds the tier's extension_validity_days
    to valid_through. The course span follows the referral's state and its use: where the referral is exhausted
    and at least one unit use on it falls within the two months before the handling date, the course span is the
    active-course span, the tier's extension_validity_days plus 24 days; where the referral is approved and still
    has units remaining, the course span is the open-course span of 56 days; otherwise the course span is the tier's
    extension_validity_days. The anchor of the course span follows the referral's status: for an exhausted referral
    the span runs from the handling date, so the course validity days are the span less the days from the handling
    date to valid_through; for an approved referral with fewer days left to valid_through than the tier's extension_request_lead_days,
    the span runs from the handling date plus those lead days, so the course validity days are the span plus the
    lead days less the days left; otherwise the span runs from valid_through and the course validity days are the
    span itself. The course re-check allowance follows the age, on the handling date, of the last coverage verification
    on the financial account: older than both the tier's eligibility_recheck_days and the financial class's re-verification
    period gives the payer course re-check allowance of 5 days; older than eligibility_recheck_days but within the
    class's re-verification period gives the internal course re-check allowance of 2 days; otherwise there is no
    allowance. The anchored span and the allowance are added together, all in calendar days. The course weekend
    roll follows the day on which valid_through moved forward by that sum would fall: a Saturday gives a course
    weekend roll of 2 days and a Sunday a course weekend roll of 1 day, so the referral runs through the following
    Monday, and any other day gives no course weekend roll. The course validity days are that sum plus the course
    weekend roll; the visits of the extension are posted separately and this lengthening is not counted as an extension
    decision of its own.
  prerequisite: []
  cross_category:
  - category: billing
    as: branch
    reads:
    - coverage_verified_date
    - coverage_reverification_days
    note: >-
      The financial account's last coverage verification and its class's re-verification period decide the course
      re-check allowance.
  compute:
  - course_recent_uses: COUNT('referral_events', within_months=2, date_field='unit_date', event_type='referral_unit_used')
  - course_span: >-
      P('extension_validity_days') + K('active_course_extra_days') if (F('status') == 'exhausted' and course_recent_uses
      >= 1) else (K('open_course_span_days') if (F('status') == 'approved' and F('units_remaining') > 0) else P('extension_validity_days'))
  - course_days_left: DAYS(NOW, F('valid_through'))
  - anchored_span: >-
      course_span - course_days_left if F('status') == 'exhausted' else (course_span + P('extension_request_lead_days')
      - course_days_left if (F('status') == 'approved' and course_days_left < P('extension_request_lead_days'))
      else course_span)
  - course_verification_age: DAYS(CFIELD('billing','coverage_verified_date'), NOW)
  - course_recheck: >-
      K('payer_course_recheck_days') if (course_verification_age > P('eligibility_recheck_days') and course_verification_age
      > CPARAM('billing','coverage_reverification_days')) else (K('internal_course_recheck_days') if (course_verification_age
      > P('eligibility_recheck_days') and course_verification_age <= CPARAM('billing','coverage_reverification_days'))
      else 0)
  - course_sum: anchored_span + course_recheck
  - course_weekday: (DAYS('2026-01-05', F('valid_through')) + course_sum) % 7
  - course_roll: >-
      K('saturday_course_roll_days') if course_weekday == 5 else (K('sunday_course_roll_days') if course_weekday
      == 6 else 0)
  - result: course_sum + course_roll
  compute_basis:
    course_recent_uses: at least one unit use on it falls within the two months before the handling date
    course_span: >-
      where the referral is exhausted and at least one unit use on it falls within the two months before the handling
      date, the course span is the active-course span, the tier's extension_validity_days plus 24 days; where the
      referral is approved and still has units remaining, the course span is the open-course span of 56 days; otherwise
      the course span is the tier's extension_validity_days.
    course_days_left: the days from the handling date to valid_through
    anchored_span: >-
      for an exhausted referral the span runs from the handling date, so the course validity days are the span less
      the days from the handling date to valid_through; for an approved referral with fewer days left to valid_through
      than the tier's extension_request_lead_days, the span runs from the handling date plus those lead days, so
      the course validity days are the span plus the lead days less the days left; otherwise the span runs from
      valid_through and the course validity days are the span itself.
    course_verification_age: the age, on the handling date, of the last coverage verification on the financial account
    course_recheck: >-
      older than both the tier's eligibility_recheck_days and the financial class's re-verification period gives
      the payer course re-check allowance of 5 days; older than eligibility_recheck_days but within the class's
      re-verification period gives the internal course re-check allowance of 2 days; otherwise there is no allowance.
    course_sum: The anchored span and the allowance are added together, all in calendar days.
    course_weekday: the day on which valid_through moved forward by that sum would fall
    course_roll: >-
      a Saturday gives a course weekend roll of 2 days and a Sunday a course weekend roll of 1 day, so the referral
      runs through the following Monday, and any other day gives no course weekend roll.
    result: The course validity days are that sum plus the course weekend roll
  factors:
  - id: course_span
    effect: parameter
    decides: course_span
    bindings:
    - course_recent_uses
    - course_span
    ladder:
    - when: >-
        the referral is exhausted and at least one unit use on it falls within the two months before the handling
        date
      value: the tier's extension_validity_days plus 24 days
    - when: the referral is approved and still has units remaining
      value: 56 days
    - when: otherwise
      value: the tier's extension_validity_days
    baseline:
      course_span: P('extension_validity_days')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: course_anchor
    effect: method
    decides: anchored_span
    bindings:
    - course_days_left
    - anchored_span
    ladder:
    - when: the referral is exhausted
      method: 'the span runs from the handling date: the span less the days from the handling date to valid_through'
    - when: >-
        the referral is approved with fewer days left to valid_through than the tier's extension_request_lead_days
      method: >-
        the span runs from the handling date plus the lead days: the span plus the lead days less the days left
    - when: otherwise
      method: 'the span runs from valid_through: the span itself'
    baseline:
      anchored_span: course_span
    evidence:
    - date
    cross_difficulty: null
  - id: course_recheck
    effect: parameter
    decides: course_recheck
    bindings:
    - course_verification_age
    - course_recheck
    ladder:
    - when: >-
        on the handling date the last coverage verification is older than both the tier's eligibility_recheck_days
        and the financial class's re-verification period
      value: 5 days
    - when: it is older than eligibility_recheck_days but within the class's re-verification period
      value: 2 days
    - when: otherwise
      value: no allowance
    baseline:
      course_recheck: '0'
    evidence:
    - cross_category
    - date
    - tier_param
    cross_difficulty: billing
  - id: course_roll
    effect: parameter
    decides: course_roll
    bindings:
    - course_weekday
    - course_roll
    ladder:
    - when: valid_through moved forward by the sum falls on a Saturday
      value: 2 days
    - when: it falls on a Sunday
      value: 1 day
    - when: otherwise
      value: no course weekend roll
    baseline:
      course_roll: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: A lengthening adds the tier's extension_validity_days to valid_through.
    params:
    - extension_validity_days
  inputs:
    history:
    - table: referral_events
      aggregate: count
      field: referral_event_id
      within_months: 2
      filters:
        event_type: referral_unit_used
    cross_category:
    - billing
- id: referral_ext_extension_visits
  base_policy_refs:
  - referral_validity_extension
  - referral_unit_accounting
  - referral_out_of_network
  overwrite:
  - base_policy: referral_validity_extension
    superseded_clause: >-
      Each extension adds extension_validity_days to valid_through and, where extension_units is above 0, grants
      those units (an exhausted referral returns to approved on that grant).
    replaced_by: >-
      The extension visits are the carry-forward plus the window and exhaustion-pace adjustments less the two trims,
      never fewer than one.
  - base_policy: referral_unit_accounting
    superseded_clause: >-
      An initial or appeal approval grants the tier's units_per_approval, an extension grants extension_units (none
      where that is 0), and a retroactive authorization grants exactly the units of the services it covers.
    replaced_by: >-
      The extension visits are the carry-forward plus the window and exhaustion-pace adjustments less the two trims,
      never fewer than one.
  - base_policy: referral_unit_accounting
    superseded_clause: Units are granted only when the referral status is approved.
    replaced_by: >-
      An extension grant may be posted on an exhausted referral, which returns to approved with that grant.
  trigger: on_request
  subject:
  - referral_validity_extended
  computes: extension_visits
  target_tool: grant_extension_visits_d2c34b29
  params:
    active_course_min_uses: 3
    recent_use_days: 30
    long_window_days: 84
    short_window_days: 42
    fast_exhaustion_days: 60
    steady_exhaustion_days: 90
  rule: >-
    When a visit referral whose tier adds units on extension is extended, the extension visits worked out here are
    posted as a unit grant with reason extension, and the extension is recorded as one extension decision. An extension
    grant may be posted on an exhausted referral, which returns to approved with that grant. An extension adds the
    tier's extension_units. Extension visits on an out-of-network referral are not posted until a cost-share acknowledgement
    signed by the patient within the past month stands on the referral. The extension visits are fixed only after
    the referral's valid-through date lies at least the tier's extension validity days beyond the handling date.
    The carry-forward of the extension visits follows the referral's recent use, counting unit uses less the restorations
    that reverse them: where the net uses in the 3 months before the handling date are 3 or more and the most recent
    use is within the 30 days before the handling date, the carry-forward is those net uses; where the net uses
    in those 3 months are 1 or more but the first condition does not hold, the carry-forward is half of the net
    uses rounded up to a whole visit; otherwise the carry-forward is the tier's extension_units. The window adjustment
    of the extension visits follows the days from the handling date to valid_through: 84 days or more add one visit,
    fewer than 42 days take one visit away, and anything in between changes nothing. The exhaustion-pace adjustment
    of the extension visits follows how quickly the referral was used up: an exhausted referral whose most recent
    unit use came within 60 days of its latest decision adds two visits, an exhausted referral whose most recent
    use came later than that but within 90 days of that decision adds one visit, and any other referral adds nothing.
    The no-show trim of the extension visits follows the no-show fees assessed on the patient's appointments in
    the 12 months before the handling date (a fee later waived still counts as assessed): two or more take two visits
    away, exactly one takes one visit away, and none takes nothing. The late-cancellation trim of the extension
    visits follows the late-cancellation fees assessed on the patient's appointments in the same 12 months (a fee
    later waived still counts as assessed): two or more take two visits away, exactly one takes one visit away,
    and none takes nothing. The extension visits are the carry-forward plus the window and exhaustion-pace adjustments
    less the two trims, never fewer than one.
  prerequisite:
  - problem: referral_ext_oon_visit_share
    kind: value_input
    gate: recent_signed_ack
    form: state
    policy_source: >-
      Extension visits on an out-of-network referral are not posted until a cost-share acknowledgement signed by
      the patient within the past month stands on the referral.
    condition: >-
      referral_requests holds a row for the referral with request_type oon_acknowledgement, request_status patient_signed
      and created_at within the month before the handling date.
    resolved_by: sign_oon_cost_share_acknowledgement_95eb7797
    effect: >-
      Once the acknowledgement stands, recent_signed_ack becomes 1 and the extension visits of an Out-of-Network
      Referral take the computed value instead of zero.
  - problem: referral_ext_visit_validity
    kind: value_input
    gate: visit_days_left
    form: state
    policy_source: >-
      The extension visits are fixed only after the referral's valid-through date lies at least the tier's extension
      validity days beyond the handling date.
    condition: referrals.valid_through minus the handling date is at least the tier's extension_validity_days.
    resolved_by: lengthen_referral_validity_fab859e3
    effect: >-
      Once valid_through is lengthened, visit_days_left grows by the added days and the window adjustment is read
      on the lengthened date, so its tier can change.
  cross_category:
  - category: appointment
    as: history
    reads:
    - appointment_events.event_type
    - appointment_events.fee_type
    - appointment_events.event_date
    note: The patient's no-show and late-cancellation fee ledger in the last 12 months decides the two trims.
  compute:
  - visit_net_uses: >-
      SUM('referral_events','units', within_months=3, date_field='unit_date', event_type='referral_unit_used') -
      SUM('referral_events','units', within_months=3, date_field='unit_date', event_type='referral_unit_restored')
  - visit_last_use: LATEST('referral_events','unit_date', date_field='unit_date', event_type='referral_unit_used')
  - visit_days_since_use: DAYS(visit_last_use, NOW) if visit_last_use else 9999
  - carry_forward: >-
      visit_net_uses if (visit_net_uses >= K('active_course_min_uses') and visit_days_since_use <= K('recent_use_days'))
      else ((visit_net_uses + 1) // 2 if visit_net_uses >= 1 else P('extension_units'))
  - visit_days_left: DAYS(NOW, F('valid_through'))
  - window_adjustment: >-
      1 if visit_days_left >= K('long_window_days') else (-1 if visit_days_left < K('short_window_days') else 0)
  - pace_days: DAYS(F('decision_date'), visit_last_use) if visit_last_use else 9999
  - pace_adjustment: >-
      2 if (F('status') == 'exhausted' and pace_days <= K('fast_exhaustion_days')) else (1 if (F('status') == 'exhausted'
      and pace_days <= K('steady_exhaustion_days')) else 0)
  - visit_no_shows: >-
      XCOUNT('appointment','appointment_events', within_months=12, date_field='event_date', event_type='appointment_fee_assessed',
      fee_type='no_show_fee')
  - no_show_trim: 2 if visit_no_shows >= 2 else (1 if visit_no_shows == 1 else 0)
  - visit_late_cancels: >-
      XCOUNT('appointment','appointment_events', within_months=12, date_field='event_date', event_type='appointment_fee_assessed',
      fee_type='late_cancel_fee')
  - late_cancel_trim: 2 if visit_late_cancels >= 2 else (1 if visit_late_cancels == 1 else 0)
  - visits_before_gate: MX(1, carry_forward + window_adjustment + pace_adjustment - no_show_trim - late_cancel_trim)
  - recent_signed_ack: >-
      COUNT('referral_requests', within_months=1, date_field='created_at', request_type='oon_acknowledgement', request_status='patient_signed')
  - result: >-
      int(visits_before_gate) if (recent_signed_ack >= 1 or F('variant_name') != 'Out-of-Network Referral') else
      0
  compute_basis:
    visit_net_uses: counting unit uses less the restorations that reverse them
    visit_last_use: the most recent use is within the 30 days before the handling date
    visit_days_since_use: the most recent use is within the 30 days before the handling date
    carry_forward: >-
      where the net uses in the 3 months before the handling date are 3 or more and the most recent use is within
      the 30 days before the handling date, the carry-forward is those net uses; where the net uses in those 3 months
      are 1 or more but the first condition does not hold, the carry-forward is half of the net uses rounded up
      to a whole visit; otherwise the carry-forward is the tier's extension_units.
    visit_days_left: >-
      The extension visits are fixed only after the referral's valid-through date lies at least the tier's extension
      validity days beyond the handling date.
    window_adjustment: >-
      84 days or more add one visit, fewer than 42 days take one visit away, and anything in between changes nothing.
    pace_days: whose most recent unit use came within 60 days of its latest decision
    pace_adjustment: >-
      an exhausted referral whose most recent unit use came within 60 days of its latest decision adds two visits,
      an exhausted referral whose most recent use came later than that but within 90 days of that decision adds
      one visit, and any other referral adds nothing.
    visit_no_shows: >-
      the no-show fees assessed on the patient's appointments in the 12 months before the handling date (a fee later
      waived still counts as assessed)
    no_show_trim: two or more take two visits away, exactly one takes one visit away, and none takes nothing.
    visit_late_cancels: >-
      the late-cancellation fees assessed on the patient's appointments in the same 12 months (a fee later waived
      still counts as assessed)
    late_cancel_trim: two or more take two visits away, exactly one takes one visit away, and none takes nothing.
    visits_before_gate: >-
      The extension visits are the carry-forward plus the window and exhaustion-pace adjustments less the two trims,
      never fewer than one.
    recent_signed_ack: >-
      Extension visits on an out-of-network referral are not posted until a cost-share acknowledgement signed by
      the patient within the past month stands on the referral.
    result: >-
      Extension visits on an out-of-network referral are not posted until a cost-share acknowledgement signed by
      the patient within the past month stands on the referral.
  factors:
  - id: carry_forward
    effect: method
    decides: carry_forward
    bindings:
    - visit_net_uses
    - visit_last_use
    - visit_days_since_use
    - carry_forward
    ladder:
    - when: >-
        net uses (unit uses less the restorations reversing them) in the 3 months before the handling date are 3
        or more and the most recent use is within the 30 days before the handling date
      method: the net uses are carried forward as the visit count
    - when: net uses in those 3 months are 1 or more but the first condition does not hold
      method: half of the net uses, rounded up to a whole visit
    - when: otherwise
      method: the tier's extension_units
    baseline:
      carry_forward: P('extension_units')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: window_adjustment
    effect: parameter
    decides: window_adjustment
    bindings:
    - visit_days_left
    - window_adjustment
    ladder:
    - when: 84 days or more from the handling date to valid_through
      value: plus one visit
    - when: fewer than 42 days
      value: minus one visit
    - when: otherwise
      value: no change
    baseline:
      window_adjustment: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: exhaustion_pace
    effect: parameter
    decides: pace_adjustment
    bindings:
    - pace_days
    - pace_adjustment
    ladder:
    - when: the referral is exhausted and its most recent unit use came within 60 days of its latest decision
      value: plus two visits
    - when: >-
        the referral is exhausted and its most recent unit use came later than 60 but within 90 days of that decision
      value: plus one visit
    - when: otherwise
      value: no change
    baseline:
      pace_adjustment: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: no_show_trim
    effect: parameter
    decides: no_show_trim
    bindings:
    - visit_no_shows
    - no_show_trim
    ladder:
    - when: >-
        two or more no-show fees assessed on the patient's appointments in the 12 months before the handling date,
        a fee later waived still counting
      value: minus two visits
    - when: exactly one such fee
      value: minus one visit
    - when: otherwise
      value: no change
    baseline:
      no_show_trim: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: appointment
  - id: late_cancel_trim
    effect: parameter
    decides: late_cancel_trim
    bindings:
    - visit_late_cancels
    - late_cancel_trim
    ladder:
    - when: >-
        two or more late-cancellation fees assessed on the patient's appointments in the 12 months before the handling
        date, a fee later waived still counting
      value: minus two visits
    - when: exactly one such fee
      value: minus one visit
    - when: otherwise
      value: no change
    baseline:
      late_cancel_trim: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: appointment
  baseline:
    rule: An extension adds the tier's extension_units.
    params:
    - extension_units
  inputs:
    history:
    - table: referral_events
      aggregate: sum
      field: units
      within_months: 3
      filters:
        event_type: referral_unit_used
    - table: referral_events
      aggregate: sum
      field: units
      within_months: 3
      filters:
        event_type: referral_unit_restored
    - category: appointment
      table: appointment_events
      aggregate: count
      field: appointment_event_id
      within_months: 12
      filters:
        event_type: appointment_fee_assessed
        fee_type: no_show_fee
    - category: appointment
      table: appointment_events
      aggregate: count
      field: appointment_event_id
      within_months: 12
      filters:
        event_type: appointment_fee_assessed
        fee_type: late_cancel_fee
    cross_category:
    - appointment
