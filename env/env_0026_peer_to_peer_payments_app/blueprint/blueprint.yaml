name: env_0026_peer_to_peer_payments_app
company: Pocketwire

background: |
  Pocketwire, Inc. is a US consumer and small-business payments app headquartered in Oakland, California, with about 31 million monthly active users; its banking services are provided by its partner bank, Harbor Bay Bank, N.A., Member FDIC, and its debit cards are issued on the Visa network.
  The support desk speaks in a plain, calm and exact tone, because the people who write in are usually looking at money that moved, did not move, or is being held.
  Every customer holds a Pocketwire Personal Account, a stored balance used to send and receive P2P payments, add money from linked banks and cards, receive direct deposits and cash out, offered as the plans Pocketwire Lite, Pocketwire Core, Pocketwire Plus, Pocketwire Prime, Pocketwire Onyx and Pocketwire Summit, the paid plans being billed monthly or annually.
  Each personal account keeps a ledger of payments, top-ups, deposits, cash-outs, fees, claims and transfers to and from the other Pocketwire products, and its limitations, security locks and recoveries are recorded on the account itself.
  Verified customers can hold the Pocketwire Visa Debit Card as a physical card plus virtual and single-use virtual cards, in the tiers Pocketwire Visa Classic Debit, Pocketwire Visa Gold Debit, Pocketwire Visa Platinum Debit, Pocketwire Visa Signature Debit, Pocketwire Visa Infinite Debit and Pocketwire Visa Infinite Metal Debit, whose holds, purchases, ATM withdrawals, fees, merchant refunds and disputes settle on the card's own ledger.
  Card spend earns Pocketwire Rewards points, a membership ranked Pocketwire Rewards Member, Pocketwire Rewards Silver, Pocketwire Rewards Gold, Pocketwire Rewards Platinum, Pocketwire Rewards Diamond and Pocketwire Rewards Obsidian by quarterly spend, with boosts, bonuses, clawbacks and redemptions kept in a points ledger.
  Sellers, from weekend market stalls to small online shops, run a Pocketwire Business Profile with its own balance, ranked Pocketwire Business Starter, Pocketwire Business Essentials, Pocketwire Business Growth, Pocketwire Business Pro, Pocketwire Business Premier and Pocketwire Business Enterprise by monthly sales volume, where every sale, fee, refund, hold, buyer claim and payout is booked.
  Customers with regular paychecks can hold a Pocketwire Advance line, ranked Pocketwire Advance Starter, Pocketwire Advance Basic, Pocketwire Advance Standard, Pocketwire Advance Plus, Pocketwire Advance Max and Pocketwire Advance Elite, whose advances, fees, repayments, extensions and write-offs are tracked against what the customer owes.
  Savers keep money aside in Pocketwire Savings Vaults, offered as Pocketwire Vault Essential, Pocketwire Vault Select, Pocketwire Vault Preferred, Pocketwire Vault Premier, Pocketwire Vault Reserve and Pocketwire Vault Private, with deposits, round-ups, withdrawals and monthly interest on each vault.
  Shoppers can split purchases with Pocketwire Pay in 4, ranked Pocketwire Pay in 4 Starter, Pocketwire Pay in 4 Classic, Pocketwire Pay in 4 Select, Pocketwire Pay in 4 Preferred, Pocketwire Pay in 4 Premier and Pocketwire Pay in 4 Elite, each plan being repaid in installments.
  The typical caller is a working adult between 19 and 55 who holds a personal account with a card and a rewards membership, often a direct deposit, and increasingly an advance line, a vault or a Pay in 4 plan.
  A growing share of callers are sole proprietors and small shops who run both a personal account and one or more business profiles from the same phone.
  Callers arrive with months of history on file: payments to friends and landlords, instant cash-outs on payday, card purchases at groceries and gas stations, boosts they activated, advances they repaid late or on time, earlier claims and disputes, and in some cases a past limitation or security lock.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: support_handoffs

difficulties:
  - name: personal_payments_limits_and_account_access
    claim:
      categories: [wallet]
      event_types: [wallet_plan_change, wallet_limit_decision, wallet_lift_restriction, wallet_risk_close, wallet_lock, wallet_recover, wallet_request_closure, wallet_withdraw_closure, wallet_close, wallet_cash_out, wallet_cash_out_return, wallet_fee, wallet_fee_refund, wallet_payment_refund, wallet_claim_filed, wallet_claim_resolved, wallet_provisional_credit, wallet_provisional_credit_reversal, wallet_claim_reimbursement]
    summary: >
      Customers of the Pocketwire Personal Account call about money on their balance — a payment sent to the wrong person or to a phone number that never claimed it, an instant cash-out fee they think is wrong, a transfer the bank returned, a weekly send limit that blocks rent, a plan upgrade or downgrade, a limitation or a security lock after a takeover, a payment they say they never made, a goods-and-services purchase that never arrived, or a wish to close the account — and the setting varies with the plan from Pocketwire Lite to Pocketwire Summit, the account status (active, limited, locked, closure_pending), whether a debit card or a qualifying direct deposit is on file, and a history of earlier claims, limit decisions, recoveries and fees.
      The records involved are the personal account, its ledger of payments, top-ups, direct deposits, cash-outs, fees and credits, its claims and its service requests, read alongside the customer's debit cards and other Pocketwire products; the governing rules combine state gates (sending, cash-outs and plan changes by status in wallet_send_limits, wallet_cash_out_rules and wallet_plan_change_rules), per-plan quantities (the send, receive and cash-out limits and the instant transfer fee with its free quota, direct-deposit rate and card-holder bonus in wallet_instant_transfer_fee, the funding and seller fees in wallet_funding_fees and wallet_evt_receiving), time windows anchored on recorded dates (the report and protection windows, liability tiers and provisional-credit timing in wallet_unauthorized_claims and wallet_purchase_protection, the limit spacing in wallet_limit_increase, the cooling-off in wallet_account_recovery, the document window in wallet_restriction, the refund window in wallet_plan_fee) and object-level exclusions such as one claim per payment and one refund per fee.
      In the natural order of the domain a payment or cash-out precedes any fee, return or claim on it, a limitation precedes its document review and lifting, a lock precedes its approved recovery, and a claim is filed before provisional credit and before its outcome.
      Service actions such as posting a fee refund, a provisional credit or a reimbursement, deciding a submitted limit request, lifting a limitation on an approved review, completing recovery, refunding an unclaimed invitation or completing a closure are performed by the agent, whereas choosing or changing a plan, confirming or withdrawing a closure, filing a claim that asserts the customer's own rights and withdrawing a claim are the customer's own decisions that the agent hands to the customer to confirm.
      Requests that no policy decides — reversing a completed personal payment to a registered recipient on the sender's say-so, overriding the identity check that sets activation, lifting a limitation before the review team rules, recovering an account without the plan's recovery method, or waiving a correctly charged fee as a courtesy — have no covered path, and a POLICY_NOT_COVERED handoff is the only correct route for them.

  - name: debit_card_disputes_and_card_servicing
    claim:
      categories: [card]
      event_types: [card_issue, card_lock, card_unlock, card_block, card_close, card_fee, card_fee_refund, card_atm_reimbursement, card_hold_release, card_dispute_filed, card_dispute_resolved, card_provisional_credit, card_provisional_credit_reversal, card_dispute_credit]
    summary: >
      Holders of the Pocketwire Visa Debit Card call because a card is lost, stolen, damaged or misplaced, because a purchase or ATM withdrawal appears that they did not make, because a merchant charged twice, never delivered or never refunded, because an authorization hold at a hotel or gas station is still tying up money, because an ATM fee or surcharge was charged, or because they want a replacement, an extra virtual card or a card on a higher tier; the setting varies with the card tier from Pocketwire Visa Classic Debit to Pocketwire Visa Infinite Metal Debit, the card's status (ordered, active, locked, blocked, closed), how many cards and replacements the customer already has, the linked personal plan and its direct deposits, and the customer's recent dispute history.
      The records involved are the cards, their settlement ledger of holds, purchases, withdrawals, fees, refunds and credits, and the dispute records, with the linked personal account consulted for plan, status and deposits; the rules are shaped by state gates (an unauthorized dispute only on a blocked or closed card in card_disputes_unauthorized, purchases only on active or locked cards in card_lock_rules), per-tier quantities (replacement allowances and fees in card_replacement_fees, ATM fees, free withdrawals and surcharge reimbursement caps in card_evt_atm_fees, foreign fees in card_evt_foreign_and_refunds, shared daily limits in card_agg_shared_limits, liability caps, provisional-credit timing, the small-dispute auto-credit threshold and the rolling dispute cap in card_disputes_unauthorized) and time windows anchored on transaction, authorization, issue and report dates (card_disputes_merchant, card_authorization_holds, card_activation_window).
      In the natural order of the domain a card is issued and activated before it is used, a hold precedes its settlement or release, a block precedes the replacement card, and a dispute is filed before its provisional credit and before its outcome.
      Locking and unlocking at the customer's request, blocking on the customer's report, issuing a replacement, reimbursing a surcharge, releasing a hold that has run its course and posting or reversing dispute credits are agent service actions, while activating a card, cancelling a card, filing a dispute that asserts the customer's own rights and withdrawing a dispute belong to the customer and are handed to the customer to confirm.
      Requests outside every rule — releasing a hold early on the strength of a merchant receipt, activating a card for the customer, unlocking a blocked card, treating a family member's purchase or a forgotten subscription as unauthorized, or refunding a merchant's own price difference — have no covered path and call for a POLICY_NOT_COVERED handoff.

  - name: business_profile_sales_holds_and_payouts
    claim:
      categories: [business]
      event_types: [business_refund, business_fee_credit, business_payout, business_fee, business_payout_return, business_hold_release, business_seller_response, business_clear_review, business_suspend, business_close, business_chargeback_reversal]
    summary: >
      Owners of a Pocketwire Business Profile call because sale funds are held, a payout is paused or declined, a transaction or instant payout fee looks too high, a buyer opened a claim or a chargeback was taken, a refund to a buyer needs to go through, a rolling reserve was imposed, the profile went under review or was suspended, or they want to close the profile; the setting varies with the tier from Pocketwire Business Starter to Pocketwire Business Enterprise, the profile status (active, under_review, suspended), whether the owner is still a new seller across all of their profiles, the sale channel and buyer region, any reserve on the profile, and the history of claims, refunds and deliveries.
      The records involved are the business profile and its balance, its ledger of sales, fees, refunds, chargebacks, payouts, holds, releases and delivery confirmations, its buyer claims and its service requests, with the owner's personal account and other profiles read for seller history; the rules are shaped by state gates (sales in business_sales_limits, payouts in business_payouts, refunds in business_refunds), per-tier quantities (channel, micropayment and cross-border fees in business_transaction_fees, hold periods, delivery-based early release and hold precedence in business_holds, the reserve ceiling and review spacing in business_rolling_reserve, payout limits and instant fees in business_payouts, fee credits on refunds, seller protection limits and chargeback fees in business_buyer_claims), aggregation across profiles in business_agg_seller_history, and time windows anchored on sale, claim, hold and review dates.
      In the natural order of the domain a sale precedes its fee, hold, delivery confirmation, refund or claim, a claim precedes the seller's response and its outcome, a hold precedes its release, and a review precedes its clearing or a suspension.
      Releasing a hold that is due, crediting back a fee, recording tracking or signature proof the owner supplies as the seller's response, clearing a review on approved documents and closing a suspended profile are agent service actions, whereas paying out the owner's balance, refunding or accepting a buyer's claim and closing an active profile dispose of the owner's own funds and are the owner's decisions, handed to the owner to confirm.
      Requests no policy covers — releasing a hold early on the seller's word without carrier confirmation, removing or lowering a reserve that the risk team set, re-pricing past sales after a tier change, or changing a tier between reviews — have no covered path and call for a POLICY_NOT_COVERED handoff.

  - name: rewards_points_earning_and_redemption
    claim:
      categories: [rewards]
      event_types: [rewards_enroll, rewards_cashback_earned, rewards_boost_earned, rewards_clawback, rewards_redemption, rewards_redemption_reversal, rewards_goodwill_credit, rewards_bonus, rewards_referral_bonus, rewards_reinstate, rewards_close]
    summary: >
      Pocketwire Rewards members call because a card purchase earned fewer points than they expected or none at all, a boost did not apply, points were taken back after a refund, points are still pending, a gift card never arrived, a redemption was refused or they want to redeem or cancel one, a referral or milestone bonus is missing, their tier changed at the quarterly review, the membership was suspended, or they want to leave the program; the setting varies with the tier from Pocketwire Rewards Member to Pocketwire Rewards Obsidian, the membership status (enrolled, active, suspended), the merchant category and timing of each purchase against the quarterly and monthly caps, the direct deposits on the linked personal account, and the history of boosts, redemptions and courtesy credits.
      The records involved are the membership, its points ledger and the card purchases and merchant refunds behind each entry, with the linked personal account and card read for eligibility and deposits; the rules are shaped by state gates (earning in rewards_earning, redemption in rewards_redemption_rules), per-tier quantities (base and category rates, the category spend cap, the direct-deposit rate lift and monthly caps in rewards_earning, boost slots, validity and caps with the offer catalogue in rewards_boosts, point values, minimums, increments and pending days in rewards_redemption_rules, retention and grace in rewards_tier_review, courtesy amounts in rewards_goodwill), time windows such as the clawback window in rewards_clawback_rules, and exclusions such as one earning and one boost per purchase and one bonus per period.
      In the natural order of the domain a purchase settles before it earns, a boost is activated before the purchase it boosts, a merchant refund precedes its clawback, and a redemption precedes its fulfilment, reversal or any courtesy credit for lateness.
      Crediting missing points or a missing boost, applying a clawback, posting a due bonus or a courtesy credit, reversing an unfulfillable redemption and reinstating a suspended membership are agent service actions, whereas redeeming points, activating a boost and leaving the program are the member's own decisions handed to the member to confirm.
      Requests outside every rule — courtesy points for missing earnings or a disliked tier change, moving a tier between reviews, restoring expired or forfeited points, reversing a cash redemption, or crediting points on P2P payments — have no covered path and call for a POLICY_NOT_COVERED handoff.

  - name: paycheck_advance_servicing
    claim:
      categories: [advance]
      event_types: [advance_open, advance_repayment, advance_fee_waiver, advance_extension, advance_fee, advance_cure, advance_suspend, advance_reinstate, advance_close]
    summary: >
      Borrowers on a Pocketwire Advance line call because an advance request was refused, a fee looks wrong, autopay took money they needed, they repaid quickly and expect the fee back, a payday moved and they need more time, a late fee was charged, the line went past due or was suspended, their limit went down at the monthly review, or they want to open or close a line; the setting varies with the tier from Pocketwire Advance Starter to Pocketwire Advance Elite, the line status (active, past_due, suspended), how many advances are outstanding, the linked personal plan and its direct deposits, and the history of on-time repayments, extensions and waivers.
      The records involved are the advance line, its ledger of disbursements, fees, repayments, waivers, extensions and write-offs, and the linked personal account's plan, status and direct deposits; the rules are shaped by state gates (disbursement only on an active line in advance_disbursement_rules), per-tier quantities (limits, plan bonus and concurrency in advance_agg_outstanding, flat and express fees and the plan discount in advance_fees, grace and weekly late fees with their cap in advance_late_fees, courtesy waivers and the cancellation window in advance_waivers, standard and hardship extensions in advance_extensions, suspension and write-off periods in advance_delinquency, review thresholds in advance_tier_review) and time anchors such as the disbursement time, the current due date and the date the line became past due.
      In the natural order of the domain an advance is disbursed before its fees, repayments and extensions, a missed due date and grace period precede late fees and past-due status, and full repayment precedes a cure, reinstatement or closure.
      Waiving a fee that qualifies, granting a qualifying extension, curing, suspending or reinstating the line as the records require and opening an application are agent service actions, while requesting a new advance, making a manual repayment from the customer's own funds and closing an active line are the customer's own decisions handed to the customer to confirm.
      Requests no policy decides — approving a declined line or raising a limit by hand, waiving a flat fee outside the cancellation window, waiving an extension fee, erasing a past-due period from the history, or stopping autopay on a tier that requires it — have no covered path and call for a POLICY_NOT_COVERED handoff.
