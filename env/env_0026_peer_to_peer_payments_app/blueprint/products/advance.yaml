# Pocketwire Advance — small-dollar advances against upcoming direct deposits.
category: advance
display_name: Pocketwire Advance

binding:
  holding_table: advance_lines
  event_tables: [advance_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {outstanding_balance: outstanding}

lifecycle:
  states: [applied, active, past_due, suspended, closed]
  transitions:
    - {from: applied, to: active, by: system, means: The eligibility check approved the line.}
    - {from: applied, to: closed, by: system, means: The eligibility check declined the line.}
    - {from: active, to: past_due, by: system, means: An advance is still unpaid when its grace period ends.}
    - {from: past_due, to: active, by: agent, means: Every overdue advance is repaid, so the line is current again.}
    - {from: past_due, to: suspended, by: agent, means: The line stayed past due for the suspension period.}
    - {from: suspended, to: active, by: agent, means: A suspended line repaid in full is reinstated after the waiting period.}
    - {from: active, to: closed, by: user, means: The customer closes a line with nothing outstanding.}
    - {from: suspended, to: closed, by: agent, means: A suspended line is closed after its balance was repaid or written off.}

accounts:
  - key: outstanding
    unit: USD
    meaning: What the customer owes on the line — advance principal and fees; disbursements and fees increase it, repayments, fee waivers and write-offs reduce it.

parameter_schema:
  advance_limit: Maximum total advance principal outstanding on the line at one time, before any plan bonus, USD.
  plan_limit_bonus: Amount added to advance_limit while the customer's personal account is on Pocketwire Prime, Pocketwire Onyx or Pocketwire Summit, USD.
  min_advance_amount: Smallest single advance, USD.
  advance_increment: Advances are requested in whole multiples of this amount, USD.
  flat_fee_pct: Flat advance fee as a percentage of the advance amount, charged once at disbursement, percent.
  flat_fee_min: Minimum flat advance fee, USD.
  flat_fee_max: Maximum flat advance fee, USD.
  plan_fee_discount_pct: Discount on the flat advance fee while the personal account is on Pocketwire Onyx or Pocketwire Summit, percent of the fee.
  express_fee_ladder: Express delivery fee to an external debit card by advance amount — ordered bands of {up_to, fee}; the fee of the first band whose up_to is at or above the advance amount applies, USD.
  express_delivery_max_minutes: Latest arrival of an express delivery to an external debit card, minutes.
  standard_delivery_fee: Fee for standard delivery to an external debit card, USD.
  standard_delivery_business_days: Latest arrival of a standard delivery to an external debit card, business days.
  disbursement_destinations_allowed: Where an advance can be delivered, list of personal_balance and external_debit_card.
  repayment_term_days: Calendar days from the disbursement date to the due date, days.
  max_outstanding_advances: Maximum advances not yet repaid at the same time on the line, count.
  max_advances_per_month: Maximum advances disbursed per calendar month, count.
  cooldown_after_repayment_hours: Full hours after an advance is repaid in full before a new advance can be disbursed, hours.
  cancellation_window_hours: Full hours after disbursement within which repaying the advance in full cancels it and waives its flat fee, hours.
  grace_period_days: Calendar days after the due date before an unpaid advance makes the line past due, days.
  late_fee_pct_weekly: Late fee per full week past the grace period, percentage of the unpaid principal of that advance, percent.
  late_fee_interval_days: Length of one late-fee period, calendar days.
  late_fee_min: Minimum late fee per period, USD.
  late_fee_cap_pct_of_principal: Cap on all late fees of one advance, percentage of its principal, percent.
  late_fee_courtesy_waivers_per_year: Late fees that can be waived as a courtesy per calendar year, count.
  past_due_suspend_days: Calendar days after the line became past due at which it is suspended if still past due, days.
  write_off_days: Calendar days after the line became past due at which the unpaid balance is written off, days.
  past_due_downgrade_steps: Tiers the line drops at the next monthly review after any past-due period in the previous month, count.
  suspension_reinstate_wait_days: Calendar days after a suspended line was repaid in full before it can be reinstated, days.
  extension_available: Whether a standard due-date extension can be taken, boolean.
  extension_days: Calendar days a standard extension adds to the due date, days.
  extension_fee: Fee for a standard extension, USD; booked as a 0.00 row when there is no fee.
  max_extensions_per_advance: Standard extensions allowed on one advance, count.
  max_extensions_per_year: Standard extensions allowed per calendar year on the line, count.
  extension_requires_on_time_repayments: Consecutive on-time repayments on record needed before a standard extension, count.
  hardship_extension_days: Calendar days a hardship extension adds to the due date, days.
  hardship_extensions_per_year: Hardship extensions allowed per calendar year, count.
  autopay_required: Whether autopay must stay switched on for the line, boolean.
  autopay_collects_from_next_direct_deposit: Whether autopay collects from the next direct deposit posting on or after the due date before trying the personal balance, boolean.
  autopay_retry_count: Autopay retries after a failed collection, count.
  autopay_retry_interval_days: Calendar days between autopay retries, days.
  partial_autopay: Whether autopay collects a partial amount when the balance is short, boolean.
  min_manual_repayment: Smallest manual repayment, USD; a repayment of the whole outstanding amount is always allowed.
  external_card_repayment_supported: Whether manual repayment from an external debit card is accepted, boolean.
  repayment_allocation_order: Order in which a repayment is applied to one advance, list.
  dd_min_monthly: Previous-calendar-month direct deposits into the personal account needed to keep the tier at the monthly review, USD.
  dd_min_deposits_count: Number of direct deposits in the previous calendar month needed to keep the tier, count.
  tier_review_grace_months: Consecutive monthly reviews below the direct deposit requirement tolerated before a downgrade, count.
  on_time_repayments_for_upgrade: Consecutive on-time repayments needed to move up one tier at a review, count.
  clean_history_days_for_upgrade: Calendar days without any past-due period needed before an upgrade, days.

