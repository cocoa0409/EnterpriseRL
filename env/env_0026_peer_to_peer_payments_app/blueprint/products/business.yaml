events:
  - type: business_open
    target: business_profiles
    mutation: create
    meaning: The owner of a personal account opens a business profile.
    grain: One row per business profile.
    fields:
      customer_id: The owner.
      wallet_id: The owner's personal account.
      variant_name: Always Pocketwire Business Starter at opening.
      business_name: Registered or trading name.
      entity_type: Legal form of the business.
      opened_date: Opening date.
      business_balance: Opening balance, always 0.00.
      tier_review_date: First day of the next calendar month.
      below_retention_months: 0 at opening.
      review_reason: none at opening.
    triggers: []
  - type: business_activate
    target: business_profiles
    mutation: {transition: {from: applied, to: active}}
    meaning: Business verification passes.
    grain: One row per business profile.
    fields:
      status: Becomes active.
    triggers: []
  - type: business_decline
    target: business_profiles
    mutation: {transition: {from: applied, to: closed}}
    meaning: Business verification declines the profile.
    grain: One row per business profile.
    fields:
      status: Becomes closed.
      closed_date: Decline date.
    triggers: []
  - type: business_start_review
    target: business_profiles
    mutation: {transition: {from: active, to: under_review}}
    meaning: A risk review of the profile starts.
    grain: One row per business profile.
    fields:
      status: Becomes under_review.
      review_reason: Why the review started.
      review_started_at: Moment the review started.
    triggers: []
  - type: business_clear_review
    target: business_profiles
    mutation: {transition: {from: under_review, to: active}}
    meaning: The review is cleared.
    grain: One row per business profile.
    fields:
      status: Returns to active.
    triggers: []
  - type: business_suspend
    target: business_profiles
    mutation: {transition: {from: under_review, to: suspended}}
    meaning: The profile is suspended after a failed or unanswered review.
    grain: One row per business profile.
    fields:
      status: Becomes suspended.
    triggers: []
  - type: business_close
    target: business_profiles
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}]}
    meaning: The profile is closed by the owner or, after suspension, by Pocketwire.
    grain: One row per business profile.
    fields:
      status: Becomes closed.
      closed_date: Closure date.
    triggers: []
  - type: business_tier_change
    target: business_profiles
    mutation: update
    meaning: The monthly tier review moves the profile up or down, or records another month below retention.
    grain: One row per business profile.
    fields:
      variant_name: Tier after the review.
      tier_review_date: Next review date.
      below_retention_months: Consecutive reviews below retention volume after this review.
    triggers: []
  - type: business_reserve_set
    target: business_profiles
    mutation: update
    meaning: The risk team assigns, changes or removes a rolling reserve on the profile.
    grain: One row per business profile.
    fields:
      reserve_rate_override_pct: Reserve percentage held back from each sale; 0.00 when the reserve is removed.
      reserve_set_date: Date of this reserve decision.
    triggers: []
  - type: business_sale
    target: business_transactions
    meaning: A buyer pays the business for goods or services.
    grain: One row per sale.
    distinguish_by: [txn_reference]
    fields:
      txn_reference: The payment reference shown in the app.
      txn_date: Sale date, Eastern Time.
      amount: Gross sale amount.
      buyer_username: The buyer's username or checkout email.
      sale_channel: in_app, online_checkout, qr_code, tap_to_pay or invoice.
      buyer_region: domestic or international.
    account: business_balance
    direction: in
    triggers:
      - event: business:business_fee
        map: {fee_type: transaction_fee, source_txn_id: business_txn_id, txn_date: txn_date}
      - event: business:business_fee
        when: {buyer_region: international}
        map: {fee_type: cross_border_fee, source_txn_id: business_txn_id, txn_date: txn_date}
  - type: business_fee
    target: business_transactions
    meaning: A business fee is charged — transaction, cross-border, instant payout, chargeback or subscription.
    grain: One row per fee.
    distinguish_by: [fee_type, source_txn_id, billing_period]
    fields:
      fee_type: Which fee.
      source_txn_id: The sale, payout or chargeback the fee belongs to; empty on subscription fees.
      billing_period: Month a subscription fee covers (YYYY-MM); empty on other fees.
      txn_date: Date charged.
      amount: Fee amount (0.00 when a subscription is waived is never booked; the row is simply absent).
    account: business_balance
    direction: out
    triggers: []
  - type: business_fee_credit
    target: business_transactions
    meaning: A fee, or part of it, is credited back — the percentage part of a transaction fee on a refund, a refunded chargeback fee, or the fee of a returned instant payout.
    grain: One row per fee credited.
    distinguish_by: [source_txn_id, txn_date]
    fields:
      source_txn_id: The fee row being credited.
      fee_type: Type of the credited fee.
      txn_date: Credit date.
      amount: Credited amount.
    account: business_balance
    direction: in
    triggers: []
  - type: business_refund
    target: business_transactions
    meaning: The seller refunds a buyer in full or in part.
    grain: One row per refund.
    distinguish_by: [source_txn_id, txn_reference]
    fields:
      source_txn_id: The sale being refunded.
      txn_reference: The refund reference shown in the app.
      txn_date: Refund date.
      amount: Amount refunded.
    account: business_balance
    direction: out
    triggers: []
  - type: business_chargeback
    target: business_transactions
    meaning: A buyer claim is decided for the buyer and the claimed amount is taken from the business balance.
    grain: One row per claim decided for the buyer.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The sale the claim was on.
      txn_date: Date of the debit.
      amount: Amount debited, equal to the claim amount.
    account: business_balance
    direction: out
    triggers:
      - event: business:business_fee
        map: {fee_type: chargeback_fee, source_txn_id: business_txn_id, txn_date: txn_date}
  - type: business_chargeback_reversal
    target: business_transactions
    meaning: A decision for the buyer is reversed for the seller on appeal and the amount returned.
    grain: One row per reversed chargeback.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The chargeback row reversed.
      txn_date: Date returned.
      amount: Amount returned, equal to the chargeback.
    account: business_balance
    direction: in
    triggers: []
  - type: business_payout
    target: business_transactions
    meaning: The seller moves available balance to a linked bank account, a debit card or their personal balance.
    grain: One row per payout.
    distinguish_by: [txn_reference]
    fields:
      txn_reference: The payout reference shown in the app.
      txn_date: Payout date, Eastern Time.
      amount: Amount paid out.
      payout_method: standard_bank, instant_card or personal_balance.
      destination_last4: Last four digits of the bank account or card; empty for personal_balance.
    account: business_balance
    direction: out
    triggers:
      - event: business:business_fee
        when: {payout_method: instant_card}
        map: {fee_type: instant_payout_fee, source_txn_id: business_txn_id, txn_date: txn_date}
      - event: wallet:wallet_internal_credit
        when: {payout_method: personal_balance}
        map: {source_product: business, source_txn_id: business_txn_id, txn_date: txn_date, amount: amount}
  - type: business_payout_return
    target: business_transactions
    meaning: A bank or card payout is returned and credited back.
    grain: One row per returned payout.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The payout returned.
      txn_date: Return date.
      amount: Returned amount.
      payout_method: Method of the returned payout.
    account: business_balance
    direction: in
    triggers:
      - event: business:business_fee_credit
        when: {payout_method: instant_card}
        map: {fee_type: instant_payout_fee, txn_date: txn_date}
  - type: business_negative_balance_recovery
    target: business_transactions
    meaning: A business balance that stayed negative too long is brought back to zero from the owner's personal balance.
    grain: One row per recovery.
    distinguish_by: [txn_date]
    fields:
      txn_date: Recovery date.
      amount: Amount recovered.
    account: business_balance
    direction: in
    triggers:
      - event: wallet:wallet_internal_debit
        map: {source_product: business, source_txn_id: business_txn_id, txn_date: txn_date, amount: amount}
  - type: business_payment_hold
    target: business_transactions
    meaning: Funds of a sale are placed on hold — new-seller hold, high-risk hold, rolling reserve or dispute hold.
    grain: One row per hold on one sale.
    distinguish_by: [source_txn_id, hold_type]
    fields:
      source_txn_id: The sale whose funds are held.
      hold_type: new_seller_hold, high_risk_hold, rolling_reserve or dispute_hold.
      txn_date: Date the hold was placed.
      amount: Amount held.
      release_due_date: Date the hold is due to be released; empty on a dispute hold, which lasts until the claim closes.
    triggers: []
  - type: business_hold_release
    target: business_transactions
    meaning: A hold is released and its funds become available.
    grain: One row per released hold.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The hold row released.
      txn_date: Release date.
      amount: Amount released, equal to the hold.
    triggers: []
  - type: business_delivery_confirmed
    target: business_transactions
    meaning: The carrier confirms delivery of the item of a sale through the tracking the seller added.
    grain: One row per sale delivered.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The sale delivered.
      txn_date: Delivery date reported by the carrier.
      tracking_number: Carrier tracking number.
    triggers: []
  - type: business_claim_opened
    target: business_claims
    meaning: A buyer opens a claim against a sale.
    grain: One row per claim.
    distinguish_by: [sale_txn_id]
    fields:
      sale_txn_id: The sale claimed against.
      claim_reason: item_not_received, not_as_described or unauthorized_buyer.
      opened_date: Date the claim opened.
      claim_amount: Amount claimed.
      outcome: Always open.
    triggers:
      - event: business:business_payment_hold
        map: {hold_type: dispute_hold, source_txn_id: sale_txn_id, txn_date: opened_date, amount: claim_amount}
  - type: business_seller_response
    target: business_claims
    meaning: The seller responds to an open buyer claim.
    grain: One row per claim responded to.
    distinguish_by: [sale_txn_id]
    fields:
      sale_txn_id: The sale claimed against.
      response_type: tracking_provided, signature_proof_provided, refund_issued or claim_accepted.
      response_date: Date of the response.
      tracking_number: Carrier tracking number when tracking or signature proof is provided.
    triggers:
      - event: business:business_refund
        when: {response_type: [refund_issued, claim_accepted]}
        map: {source_txn_id: sale_txn_id, txn_date: response_date}
  - type: business_claim_closed
    target: business_claims
    meaning: A buyer claim is decided or withdrawn.
    grain: One row per claim closed.
    distinguish_by: [sale_txn_id]
    fields:
      sale_txn_id: The sale claimed against.
      claim_reason: As opened.
      claim_amount: As opened.
      outcome: seller_won, buyer_won or withdrawn_by_buyer.
      outcome_date: Date of the outcome.
    triggers:
      - event: business:business_chargeback
        when: {outcome: buyer_won}
        map: {source_txn_id: sale_txn_id, txn_date: outcome_date, amount: claim_amount}
      - event: business:business_hold_release
        map: {txn_date: outcome_date, amount: claim_amount}

measures:
  - id: business_msr_sales_7d
    window: Rolling 7 calendar days — the handling date and the six preceding calendar days, Eastern Time.
    measure: Sum of amount over business_sale rows of the profile with txn_date in the window.
  - id: business_msr_prev_month_volume
    window: The calendar month before the month containing the handling date.
    measure: Sum of amount over business_sale rows of the profile with txn_date in the window, less amount over business_refund and business_chargeback rows with txn_date in the window.
  - id: business_msr_active_holds
    window: Current state on the handling date.
    measure: Sum of amount over business_payment_hold rows of the profile not matched by a business_hold_release row pointing to them.
  - id: business_msr_payouts_today
    window: The handling calendar day, Eastern Time.
    measure: Sum of amount over business_payout rows of the profile with txn_date equal to the handling date, excluding payouts returned by a business_payout_return.
  - id: business_msr_completed_sales
    window: Whole history of all of the customer's business profiles up to the handling date.
    measure: Count of business_sale rows across the customer's business profiles that carry no business_refund covering the full amount and no business_chargeback.
  - id: business_msr_avg_sale_30d
    window: The 30 calendar days before the sale date, not including it.
    measure: Average amount over business_sale rows of the profile with txn_date in the window; 0.00 when there are none.
  - id: business_msr_buyer_won_ratio_90d
    window: Rolling 90 calendar days ending on the handling date.
    measure: Count of business_chargeback rows across the customer's business profiles in the window, divided by the count of business_sale rows across them in the window, as a percentage.

policies:
  - id: business_agg_multi_holding
    subject: [business_open]
    rule: >-
      A customer may hold up to max_per_customer business profiles that are not closed, each with its own name, balance and tier.
      A further profile is opened only if the customer holds fewer than max_per_customer business profiles whose status is anything other than closed.
    eligibility:
      - id: profile_cap
        applies_to: [business_open]
        kind: dedup
        condition: "A further profile is opened only if the customer holds fewer than max_per_customer business profiles whose status is anything other than closed."
        evidence_fields: [business_profiles.customer_id, business_profiles.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_profiles.customer_id]
          action_bindings:
            business_profiles.customer_id: customer_id
        dedup_contract:
          table: business_profiles
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active, under_review, suspended]}
          distinct_fields: [business_name]
    params:
      max_per_customer: 3

  - id: business_agg_seller_history
    subject: [business_payment_hold, business_start_review, business_open]
    rule: >-
      Seller history is judged across all of the customer's business profiles together: the new-seller period runs from the opened_date of the customer's earliest business profile, including closed ones, the completed-sales count (business_msr_completed_sales) adds the sales of every profile, and the buyer-won ratio (business_msr_buyer_won_ratio_90d) is computed across all of them.
      Opening another profile therefore never restarts new-seller status, and a profile whose owner has a suspended profile cannot be opened while that suspension stands.
      Each profile's tier, balance, holds and payouts remain its own; volumes are never added across profiles for tier purposes.
    eligibility: []
    measures: [business_msr_completed_sales, business_msr_buyer_won_ratio_90d]

  - id: business_opening
    subject: [business_open, business_activate, business_decline]
    rule: >-
      A business profile is opened only by a customer whose personal account is active on Pocketwire Core or a higher plan with kyc_status verified; a Pocketwire Lite account, or a personal account that is limited, locked or closure_pending, cannot open one.
      Every profile opens on Pocketwire Business Starter in applied status, and business verification (entity documents and, for anything other than a sole proprietor, the entity's tax identification) sets it to active or closed; a representative cannot activate a profile.
    eligibility:
      - id: owner_account_ok
        applies_to: [business_open]
        kind: authorization
        condition: "A business profile is opened only by a customer whose personal account is active on Pocketwire Core or a higher plan with kyc_status verified"
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.status, wallet_accounts.variant_name, wallet_accounts.kyc_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id

  - id: business_transaction_fees
    subject: [business_sale, business_fee]
    rule: >-
      Every sale books a transaction_fee on the sale date at the rate of its sale_channel — transaction_fee_pct and transaction_fee_fixed for in_app and online_checkout, qr_code_fee_pct and qr_code_fee_fixed for qr_code, tap_to_pay_fee_pct and tap_to_pay_fee_fixed for tap_to_pay, invoice_fee_pct and invoice_fee_fixed for invoice — except that a sale below micropayment_threshold uses micropayment_fee_pct and micropayment_fee_fixed whatever its channel; the micropayment rate and a channel rate never apply together.
      The fee is the sale amount times the percentage, rounded to the cent (half up), plus the fixed part.
      A sale from an international buyer also books a cross_border_fee of the sale amount times cross_border_fee_pct, rounded to the cent (half up).
      The tier whose rates apply is the tier on the sale date; a later tier change never re-prices earlier sales.
    eligibility: []
    formula:
      channel_transaction_fee: "round(amount * transaction_fee_pct / 100, 2) + transaction_fee_fixed"
      micropayment_fee: "round(amount * micropayment_fee_pct / 100, 2) + micropayment_fee_fixed"
      cross_border_fee: "round(amount * cross_border_fee_pct / 100, 2)"
    params:
      per_tier:
        Pocketwire Business Starter: {transaction_fee_pct: =transaction_fee_pct, transaction_fee_fixed: =transaction_fee_fixed, qr_code_fee_pct: =qr_code_fee_pct, tap_to_pay_fee_pct: =tap_to_pay_fee_pct, invoice_fee_pct: =invoice_fee_pct, micropayment_fee_pct: =micropayment_fee_pct, cross_border_fee_pct: =cross_border_fee_pct}
        Pocketwire Business Essentials: {transaction_fee_pct: =transaction_fee_pct, transaction_fee_fixed: =transaction_fee_fixed, qr_code_fee_pct: =qr_code_fee_pct, tap_to_pay_fee_pct: =tap_to_pay_fee_pct, invoice_fee_pct: =invoice_fee_pct, micropayment_fee_pct: =micropayment_fee_pct, cross_border_fee_pct: =cross_border_fee_pct}
        Pocketwire Business Growth: {transaction_fee_pct: =transaction_fee_pct, transaction_fee_fixed: =transaction_fee_fixed, qr_code_fee_pct: =qr_code_fee_pct, tap_to_pay_fee_pct: =tap_to_pay_fee_pct, invoice_fee_pct: =invoice_fee_pct, micropayment_fee_pct: =micropayment_fee_pct, cross_border_fee_pct: =cross_border_fee_pct}
        Pocketwire Business Pro: {transaction_fee_pct: =transaction_fee_pct, transaction_fee_fixed: =transaction_fee_fixed, qr_code_fee_pct: =qr_code_fee_pct, tap_to_pay_fee_pct: =tap_to_pay_fee_pct, invoice_fee_pct: =invoice_fee_pct, micropayment_fee_pct: =micropayment_fee_pct, cross_border_fee_pct: =cross_border_fee_pct}
        Pocketwire Business Premier: {transaction_fee_pct: =transaction_fee_pct, transaction_fee_fixed: =transaction_fee_fixed, qr_code_fee_pct: =qr_code_fee_pct, tap_to_pay_fee_pct: =tap_to_pay_fee_pct, invoice_fee_pct: =invoice_fee_pct, micropayment_fee_pct: =micropayment_fee_pct, cross_border_fee_pct: =cross_border_fee_pct}
        Pocketwire Business Enterprise: {transaction_fee_pct: =transaction_fee_pct, transaction_fee_fixed: =transaction_fee_fixed, qr_code_fee_pct: =qr_code_fee_pct, tap_to_pay_fee_pct: =tap_to_pay_fee_pct, invoice_fee_pct: =invoice_fee_pct, micropayment_fee_pct: =micropayment_fee_pct, cross_border_fee_pct: =cross_border_fee_pct}

  - id: business_sales_limits
    subject: [business_sale, business_start_review, business_payment_hold]
    rule: >-
      A sale can be accepted only while the profile status is active or under_review.
      A payment above max_single_sale is declined to the buyer and not booked.
      When a sale takes the rolling 7-day sales (business_msr_sales_7d) above rolling_7d_sales_limit, the sale is still accepted, the part above the limit is held as a high_risk_hold released high_risk_hold_days calendar days after the sale date, and a review starts with review_reason sales_limit_exceeded unless one is already under way.
      A review also starts with review_reason chargeback_ratio when the buyer-won ratio across the customer's profiles exceeds chargeback_ratio_review_threshold_pct.
    eligibility:
      - id: sale_status
        applies_to: [business_sale]
        kind: state
        condition: "A sale can be accepted only while the profile status is active or under_review."
        evidence_fields: [business_profiles.business_id, business_profiles.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_profiles.business_id]
          action_bindings:
            business_profiles.business_id: business_id
        state_contract:
          field: business_profiles.status
          allowed: [active, under_review]
    measures: [business_msr_sales_7d]
    formula:
      held_excess: "max(0, business_msr_sales_7d + amount - rolling_7d_sales_limit)"

  - id: business_holds
    subject: [business_payment_hold, business_hold_release]
    rule: >-
      A sale made during the new-seller period — within new_seller_period_days calendar days after the customer's earliest business profile opened and while business_msr_completed_sales is below new_seller_sales_count_exempt — is held in full as a new_seller_hold with a release_due_date new_seller_hold_days calendar days after the sale date.
      A sale above high_ticket_multiple times the profile's average sale over the previous 30 days (business_msr_avg_sale_30d), when that average is above 0.00, is held in full as a high_risk_hold with a release_due_date high_risk_hold_days calendar days after the sale date.
      A new_seller_hold and a high_risk_hold never stack on one sale: only the one with the later release_due_date is placed.
      A rolling reserve holdback and a dispute hold are placed independently of them and of each other, under business_rolling_reserve and on each opened buyer claim respectively.
      A hold is released only once its release is due: the release is recorded no earlier than the hold's recorded release due date, or, for a new_seller_hold or high_risk_hold, delivery_confirmation_release_days calendar days after the carrier-confirmed delivery date of that sale when that comes first.
      Release timing is counted in calendar days, a release on the due date itself qualifies, and a dispute hold is released only when its claim closes, whatever the outcome.
      A representative cannot release a hold early for any other reason, including the seller's statement that the item was delivered without carrier confirmation.
    eligibility:
      - id: release_due
        applies_to: [business_hold_release]
        kind: time
        condition: "the release is recorded no earlier than the hold's recorded release due date, or, for a new_seller_hold or high_risk_hold, delivery_confirmation_release_days calendar days after the carrier-confirmed delivery date of that sale when that comes first"
        evidence_fields: [business_transactions.business_txn_id, business_transactions.release_due_date, business_transactions.hold_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_transactions.business_txn_id]
          action_bindings:
            business_transactions.business_txn_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the hold's recorded release due date
          anchor_source: business_transactions.release_due_date
          relation: not_before
          duration_source: params.release_offset_days
          unit: calendar_days
          counting_rule: "Release timing is counted in calendar days, a release on the due date itself qualifies, and a dispute hold is released only when its claim closes, whatever the outcome."
          boundary: inclusive
      - id: release_once
        applies_to: [business_hold_release]
        kind: dedup
        condition: "A hold is released only once its release is due"
        evidence_fields: [business_transactions.source_txn_id, business_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_transactions.source_txn_id]
          action_bindings:
            business_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: business_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [business_hold_release]}
          distinct_fields: []
    measures: [business_msr_avg_sale_30d, business_msr_completed_sales]
    params:
      release_offset_days: 0
      per_tier:
        Pocketwire Business Starter: {new_seller_hold_days: =new_seller_hold_days, high_risk_hold_days: =high_risk_hold_days, delivery_confirmation_release_days: =delivery_confirmation_release_days, high_ticket_multiple: =high_ticket_multiple}
        Pocketwire Business Essentials: {new_seller_hold_days: =new_seller_hold_days, high_risk_hold_days: =high_risk_hold_days, delivery_confirmation_release_days: =delivery_confirmation_release_days, high_ticket_multiple: =high_ticket_multiple}
        Pocketwire Business Growth: {new_seller_hold_days: =new_seller_hold_days, high_risk_hold_days: =high_risk_hold_days, delivery_confirmation_release_days: =delivery_confirmation_release_days, high_ticket_multiple: =high_ticket_multiple}
        Pocketwire Business Pro: {new_seller_hold_days: =new_seller_hold_days, high_risk_hold_days: =high_risk_hold_days, delivery_confirmation_release_days: =delivery_confirmation_release_days, high_ticket_multiple: =high_ticket_multiple}
        Pocketwire Business Premier: {new_seller_hold_days: =new_seller_hold_days, high_risk_hold_days: =high_risk_hold_days, delivery_confirmation_release_days: =delivery_confirmation_release_days, high_ticket_multiple: =high_ticket_multiple}
        Pocketwire Business Enterprise: {new_seller_hold_days: =new_seller_hold_days, high_risk_hold_days: =high_risk_hold_days, delivery_confirmation_release_days: =delivery_confirmation_release_days, high_ticket_multiple: =high_ticket_multiple}

  - id: business_rolling_reserve
    subject: [business_reserve_set, business_payment_hold, business_hold_release]
    rule: >-
      The risk team may assign a rolling reserve by setting reserve_rate_override_pct, never above the tier's max_rolling_reserve_pct; while it is above 0.00, each new sale books a rolling_reserve hold of the sale amount times that percentage, rounded to the cent (half up), with a release_due_date rolling_reserve_hold_days calendar days after the sale date.
      The seller may ask for the reserve to be reduced or removed with a reserve_reduction request once reserve_review_days calendar days have passed since reserve_set_date; the risk team decides it, and an approved reduction applies only to sales made after the new reserve_set_date — holdbacks already placed keep their release dates.
      A representative cannot change or waive a reserve, and a reserve is never set on a customer's request.
    eligibility: []
    formula:
      reserve_holdback: "round(amount * reserve_rate_override_pct / 100, 2)"
    params:
      per_tier:
        Pocketwire Business Starter: {max_rolling_reserve_pct: =max_rolling_reserve_pct, rolling_reserve_hold_days: =rolling_reserve_hold_days, reserve_review_days: =reserve_review_days}
        Pocketwire Business Essentials: {max_rolling_reserve_pct: =max_rolling_reserve_pct, rolling_reserve_hold_days: =rolling_reserve_hold_days, reserve_review_days: =reserve_review_days}
        Pocketwire Business Growth: {max_rolling_reserve_pct: =max_rolling_reserve_pct, rolling_reserve_hold_days: =rolling_reserve_hold_days, reserve_review_days: =reserve_review_days}
        Pocketwire Business Pro: {max_rolling_reserve_pct: =max_rolling_reserve_pct, rolling_reserve_hold_days: =rolling_reserve_hold_days, reserve_review_days: =reserve_review_days}
        Pocketwire Business Premier: {max_rolling_reserve_pct: =max_rolling_reserve_pct, rolling_reserve_hold_days: =rolling_reserve_hold_days, reserve_review_days: =reserve_review_days}
        Pocketwire Business Enterprise: {max_rolling_reserve_pct: =max_rolling_reserve_pct, rolling_reserve_hold_days: =rolling_reserve_hold_days, reserve_review_days: =reserve_review_days}

  - id: business_payouts
    subject: [business_payout, business_fee, business_payout_return, business_fee_credit]
    rule: >-
      A payout can be made only while the profile status is active; payouts pause while the profile is under_review or suspended.
      A payout can never exceed the available balance, which is business_balance less the funds under unreleased holds (business_msr_active_holds), must be at least min_payout_amount, and together with the day's earlier payouts (business_msr_payouts_today) may not exceed daily_payout_limit; an instant_card payout may not exceed instant_payout_max_per_payout.
      A standard_bank payout is free and arrives within standard_payout_business_days business days; a payout to the owner's personal balance is free and immediate.
      An instant_card payout books an instant_payout_fee of the payout amount times instant_payout_fee_pct, rounded to the cent (half up), raised to instant_payout_fee_min and lowered to instant_payout_fee_max; when an instant payout is returned, its fee is credited back in full.
      Where auto_payout_available is true the owner can switch on a daily automatic standard_bank payout of the whole available balance, booked like any other payout.
      A payout that breaches a limit is declined in full and not booked.
    eligibility:
      - id: payout_status
        applies_to: [business_payout]
        kind: state
        condition: "A payout can be made only while the profile status is active; payouts pause while the profile is under_review or suspended."
        evidence_fields: [business_profiles.business_id, business_profiles.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_profiles.business_id]
          action_bindings:
            business_profiles.business_id: business_id
        state_contract:
          field: business_profiles.status
          allowed: [active]
    measures: [business_msr_active_holds, business_msr_payouts_today]
    formula:
      available_balance: "business_balance - business_msr_active_holds"
      instant_payout_fee: "min(max(round(amount * instant_payout_fee_pct / 100, 2), instant_payout_fee_min), instant_payout_fee_max)"

  - id: business_refunds
    subject: [business_refund, business_fee_credit]
    rule: >-
      A seller refund can be made while the profile status is active, under_review or suspended, so that a suspended seller can still make buyers whole.
      A refund is made only within the refund window: the refund is made no later than refund_window_days calendar days after the sale date.
      The refund window is counted in calendar days from the sale date, the day after the sale being day 1, and a refund on the last day qualifies.
      The refunds on one sale together may not exceed its amount, and a sale on which a claim was decided for the buyer can no longer be refunded.
      On tiers whose fee_refund_pct_portion_on_refund is true, the percentage part of the sale's transaction fee is credited back in proportion to the refunded share of the sale, rounded to the cent (half up); the fixed part and any cross_border_fee are never credited back, and on other tiers no fee is credited back.
      A refund can be taken from funds on hold for that same sale, and it can take the business balance negative.
    eligibility:
      - id: refund_status
        applies_to: [business_refund]
        kind: state
        condition: "A seller refund can be made while the profile status is active, under_review or suspended, so that a suspended seller can still make buyers whole."
        evidence_fields: [business_profiles.business_id, business_profiles.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_profiles.business_id]
          action_bindings:
            business_profiles.business_id: business_id
        state_contract:
          field: business_profiles.status
          allowed: [active, under_review, suspended]
      - id: refund_window
        applies_to: [business_refund]
        kind: time
        condition: "the refund is made no later than refund_window_days calendar days after the sale date"
        evidence_fields: [business_transactions.business_txn_id, business_transactions.txn_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_transactions.business_txn_id]
          action_bindings:
            business_transactions.business_txn_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the sale date
          anchor_source: business_transactions.txn_date
          relation: not_after
          duration_source: variants.refund_window_days
          unit: calendar_days
          counting_rule: "The refund window is counted in calendar days from the sale date, the day after the sale being day 1, and a refund on the last day qualifies."
          boundary: inclusive

  - id: business_buyer_claims
    subject: [business_claim_opened, business_seller_response, business_claim_closed, business_chargeback, business_chargeback_reversal, business_fee]
    rule: >-
      A buyer can open one claim per sale within buyer_claim_window_days calendar days after the sale date; on tiers whose dispute_hold_on_claim is true the claimed amount is held on the business balance as a dispute_hold while the claim is open.
      The seller responds by providing tracking, providing signature-on-delivery proof, refunding, or accepting the claim, and the response counts only within the response window: the response is recorded no later than seller_response_days calendar days after the claim opened date.
      The response window is counted in calendar days from the claim opened date, the day after opening being day 1, and a response on the last day counts.
      A claim with no response in time is decided for the buyer.
      Seller protection decides the claim for the seller when the claim is item_not_received, the seller responded in time with tracking showing delivery to the buyer's address — or signature proof when the sale amount is at or above signature_proof_threshold — and the claim amount is within seller_protection_max_per_claim; an unauthorized_buyer claim is decided for the seller when the sale shows delivery confirmed by the carrier; not_as_described claims are decided by the claims team on the evidence and are never covered by seller protection.
      A claim decided for the buyer debits the claim amount as a business_chargeback and books a chargeback_fee; on tiers whose chargeback_fee_refunded_if_won is true, the fee is credited back if the decision is later reversed for the seller.
      Refunding or accepting settles the claim for the buyer without a chargeback or chargeback fee.
    eligibility:
      - id: response_window
        applies_to: [business_seller_response]
        kind: time
        condition: "the response is recorded no later than seller_response_days calendar days after the claim opened date"
        evidence_fields: [business_claims.sale_txn_id, business_claims.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_claims.sale_txn_id]
          action_bindings:
            business_claims.sale_txn_id: sale_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the claim opened date
          anchor_source: business_claims.opened_date
          relation: not_after
          duration_source: variants.seller_response_days
          unit: calendar_days
          counting_rule: "The response window is counted in calendar days from the claim opened date, the day after opening being day 1, and a response on the last day counts."
          boundary: inclusive
    params:
      per_tier:
        Pocketwire Business Starter: {seller_response_days: =seller_response_days, seller_protection_max_per_claim: =seller_protection_max_per_claim, chargeback_fee: =chargeback_fee}
        Pocketwire Business Essentials: {seller_response_days: =seller_response_days, seller_protection_max_per_claim: =seller_protection_max_per_claim, chargeback_fee: =chargeback_fee}
        Pocketwire Business Growth: {seller_response_days: =seller_response_days, seller_protection_max_per_claim: =seller_protection_max_per_claim, chargeback_fee: =chargeback_fee}
        Pocketwire Business Pro: {seller_response_days: =seller_response_days, seller_protection_max_per_claim: =seller_protection_max_per_claim, chargeback_fee: =chargeback_fee}
        Pocketwire Business Premier: {seller_response_days: =seller_response_days, seller_protection_max_per_claim: =seller_protection_max_per_claim, chargeback_fee: =chargeback_fee}
        Pocketwire Business Enterprise: {seller_response_days: =seller_response_days, seller_protection_max_per_claim: =seller_protection_max_per_claim, chargeback_fee: =chargeback_fee}

  - id: business_delivery_tracking
    subject: [business_delivery_confirmed]
    rule: >-
      Delivery is confirmed only by the carrier through tracking the seller added to the sale; a delivery date stated by the seller or the buyer is never recorded as a confirmation.
      One confirmation is recorded per sale, and it is the evidence both for early release of a new_seller_hold or high_risk_hold and for seller protection on item_not_received and unauthorized_buyer claims.
    eligibility: []

  - id: business_review_and_suspension
    subject: [business_start_review, business_clear_review, business_suspend, business_close]
    rule: >-
      Reviews are started by the risk system for the reasons in business_sales_limits and for identity or prohibited-goods reports, and pause payouts while sales continue.
      A review is cleared only on a review_documents request whose request_status is approved by the review team.
      The review team decides submitted review documents within review_decision_business_days business days, and a representative cannot shorten or pre-empt that decision.
      A profile is suspended when the review team declined the review_documents request, or when no review_documents request was submitted and the response window has passed: the suspension is recorded later than business_review_response_days calendar days after the review start time.
      The response window is counted in calendar days from the review start time, the day after the review started being day 1, and the window is still open on its last day.
      A suspended profile's balance stays until open claims close and holds are released; it is then paid out to the owner's personal balance by a support representative and the profile is closed.
      The owner may close an active profile only when its business balance is 0.00, no buyer claim is open and no hold is unreleased; closing is the owner's own decision, confirmed in the app.
    eligibility:
      - id: review_documents_approved
        applies_to: [business_clear_review]
        kind: authorization
        condition: "A review is cleared only on a review_documents request whose request_status is approved by the review team."
        evidence_fields: [business_requests.request_id, business_requests.request_type, business_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_requests.request_id]
          action_bindings:
            business_requests.request_id: request_id
      - id: review_window_passed
        applies_to: [business_suspend]
        kind: time
        condition: "the suspension is recorded later than business_review_response_days calendar days after the review start time"
        evidence_fields: [business_profiles.business_id, business_profiles.review_started_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_profiles.business_id]
          action_bindings:
            business_profiles.business_id: business_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the review start time
          anchor_source: business_profiles.review_started_at
          relation: not_before
          duration_source: variants.business_review_response_days
          unit: calendar_days
          counting_rule: "The response window is counted in calendar days from the review start time, the day after the review started being day 1, and the window is still open on its last day."
          boundary: exclusive

  - id: business_tier_review
    subject: [business_tier_change]
    rule: >-
      Tiers are reviewed on the first day of each calendar month against the previous month's net sales volume (business_msr_prev_month_volume).
      The profile moves up to the highest tier whose entry_gate min_prev_month_volume that volume meets — Pocketwire Business Enterprise additionally needs the profile opened at least entry_gate min_profile_age_months calendar months before the review.
      When the volume is below the current tier's tier_retention_monthly_volume, below_retention_months goes up by one, and the profile drops one tier only once below_retention_months exceeds tier_grace_months, the count then resetting to 0; a review at or above retention resets the count without a change.
      A tier is never changed between reviews or at the seller's request.
    eligibility: []
    measures: [business_msr_prev_month_volume]
    params:
      per_tier:
        Pocketwire Business Starter: {tier_retention_monthly_volume: =tier_retention_monthly_volume, tier_grace_months: =tier_grace_months}
        Pocketwire Business Essentials: {tier_retention_monthly_volume: =tier_retention_monthly_volume, tier_grace_months: =tier_grace_months}
        Pocketwire Business Growth: {tier_retention_monthly_volume: =tier_retention_monthly_volume, tier_grace_months: =tier_grace_months}
        Pocketwire Business Pro: {tier_retention_monthly_volume: =tier_retention_monthly_volume, tier_grace_months: =tier_grace_months}
        Pocketwire Business Premier: {tier_retention_monthly_volume: =tier_retention_monthly_volume, tier_grace_months: =tier_grace_months}
        Pocketwire Business Enterprise: {tier_retention_monthly_volume: =tier_retention_monthly_volume, tier_grace_months: =tier_grace_months}

  - id: business_subscription_fee
    subject: [business_fee]
    rule: >-
      On tiers with a monthly_subscription_fee above 0.00, the fee is charged on the first day of each calendar month as a subscription_fee whose billing_period is that month, at the tier held after that day's review.
      The fee is waived — no row is booked — when the previous calendar month's net sales volume is at or above monthly_subscription_waiver_volume.
      Subscription fees are never prorated or refunded, including when the profile closes or is suspended during the month.
    eligibility: []
    measures: [business_msr_prev_month_volume]

  - id: business_negative_balance
    subject: [business_negative_balance_recovery]
    rule: >-
      A business balance can go negative through refunds, chargebacks and fees.
      When it has stayed negative for longer than negative_balance_recovery_days calendar days, counted from the first day it went negative, the shortfall is recovered in one step from the owner's personal balance, as far as that balance allows, as an internal transfer; any rest stays owed on the business balance.
      Sales received while the balance is negative reduce the shortfall first.
    eligibility: []
