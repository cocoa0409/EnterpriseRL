events:
  - type: paylater_open
    target: paylater_accounts
    mutation: create
    meaning: The customer applies for Pocketwire Pay in 4.
    grain: One row per Pay in 4 account.
    fields:
      customer_id: The applicant.
      wallet_id: The linked personal account.
      variant_name: Always Pocketwire Pay in 4 Starter at opening.
      opened_date: Application date.
      amount_owed: Opening amount owed, always 0.00.
      completed_on_time_plans: 0 at opening.
      tier_review_date: First review date.
    triggers: []
  - type: paylater_approve
    target: paylater_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: The eligibility check approves the account.
    grain: One row per account.
    fields:
      status: Becomes active.
    triggers: []
  - type: paylater_decline
    target: paylater_accounts
    mutation: {transition: {from: applied, to: closed}}
    meaning: The eligibility check declines the account.
    grain: One row per account.
    fields:
      status: Becomes closed.
      closed_date: Decline date.
    triggers: []
  - type: paylater_mark_past_due
    target: paylater_accounts
    mutation: {transition: {from: active, to: past_due}}
    meaning: An installment is still unpaid after its grace days.
    grain: One row per account.
    fields:
      status: Becomes past_due.
      past_due_since: Date the account became past due.
    triggers: []
  - type: paylater_cure
    target: paylater_accounts
    mutation: {transition: {from: past_due, to: active}}
    meaning: Every overdue installment is paid.
    grain: One row per account.
    fields:
      status: Returns to active.
    triggers: []
  - type: paylater_suspend
    target: paylater_accounts
    mutation: {transition: {from: past_due, to: suspended}}
    meaning: The account stayed past due for the suspension period.
    grain: One row per account.
    fields:
      status: Becomes suspended.
    triggers: []
  - type: paylater_reinstate
    target: paylater_accounts
    mutation: {transition: {from: suspended, to: active}}
    meaning: A suspended account repaid in full is reinstated on Pocketwire Pay in 4 Starter.
    grain: One row per account.
    fields:
      status: Returns to active.
      variant_name: Always Pocketwire Pay in 4 Starter on reinstatement.
    triggers: []
  - type: paylater_close
    target: paylater_accounts
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}]}
    meaning: The account is closed.
    grain: One row per account.
    fields:
      status: Becomes closed.
      closed_date: Closure date.
    triggers: []
  - type: paylater_tier_change
    target: paylater_accounts
    mutation: update
    meaning: The periodic review moves the account up or down.
    grain: One row per account.
    fields:
      variant_name: Tier after the review.
      tier_review_date: Next review date.
      completed_on_time_plans: Plans paid in full on time, as counted at the review.
    triggers: []
  - type: paylater_plan_created
    target: paylater_ledger
    meaning: A purchase is split into a Pay in 4 plan.
    grain: One row per plan.
    distinguish_by: [plan_reference]
    fields:
      plan_reference: The plan reference shown in the app.
      merchant_name: Merchant of the purchase.
      entry_date: Purchase date; installment due dates follow from it.
      amount: Purchase amount.
    account: owed
    direction: in
    triggers:
      - event: paylater:paylater_installment_paid
        map: {source_txn_id: paylater_entry_id, entry_date: entry_date, installment_number: 1, payment_method: autopay_debit_card}
  - type: paylater_installment_paid
    target: paylater_ledger
    meaning: An installment, or part of one, is paid.
    grain: One row per installment payment.
    distinguish_by: [source_txn_id, installment_number, entry_date]
    fields:
      source_txn_id: The plan paid.
      installment_number: Installment paid (1 to installment_count, beyond it after a hardship respread).
      entry_date: Payment date.
      amount: Amount paid.
      payment_method: autopay_debit_card, autopay_personal_balance, manual_debit_card, manual_personal_balance or manual_credit_card.
    account: owed
    direction: out
    triggers:
      - event: wallet:wallet_internal_debit
        when: {payment_method: [autopay_personal_balance, manual_personal_balance]}
        map: {source_product: paylater, source_txn_id: paylater_entry_id, txn_date: entry_date, amount: amount}
  - type: paylater_late_fee
    target: paylater_ledger
    meaning: A late fee is charged on an installment.
    grain: One row per late installment.
    distinguish_by: [source_txn_id, installment_number]
    fields:
      source_txn_id: The plan.
      installment_number: The late installment.
      entry_date: Date charged.
      amount: Fee amount.
    account: owed
    direction: in
    triggers: []
  - type: paylater_refund_adjustment
    target: paylater_ledger
    meaning: A merchant refund reduces what is owed on a plan.
    grain: One row per merchant refund.
    distinguish_by: [source_txn_id, entry_date]
    fields:
      source_txn_id: The plan refunded.
      entry_date: Date the refund posted.
      amount: Amount by which the plan is reduced.
    account: owed
    direction: out
    triggers: []
  - type: paylater_fee_waiver
    target: paylater_ledger
    meaning: A late fee is waived.
    grain: One row per waived fee.
    distinguish_by: [source_txn_id, installment_number]
    fields:
      source_txn_id: The plan.
      installment_number: The installment whose late fee is waived.
      entry_date: Waiver date.
      amount: Amount waived.
    account: owed
    direction: out
    triggers: []
  - type: paylater_reschedule
    target: paylater_ledger
    meaning: An installment's due date is moved, or a plan is paused or respread on hardship.
    grain: One row per schedule change.
    distinguish_by: [source_txn_id, installment_number, reschedule_type]
    fields:
      source_txn_id: The plan.
      installment_number: The first installment affected.
      reschedule_type: reschedule, hardship_pause or hardship_respread.
      entry_date: Date of the change.
      new_due_date: New due date of that installment.
    triggers: []
  - type: paylater_dispute_opened
    target: paylater_ledger
    meaning: The customer disputes the purchase behind a plan and its installments pause.
    grain: One row per disputed plan.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The plan disputed.
      dispute_reason: item_not_received, not_as_described, returned_not_refunded or unauthorized.
      entry_date: Date opened.
    triggers: []
  - type: paylater_dispute_resolved
    target: paylater_ledger
    meaning: A plan dispute is decided.
    grain: One row per disputed plan.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The plan disputed.
      dispute_outcome: customer_won or merchant_won.
      entry_date: Date decided.
      amount: Amount by which the plan is reduced when the customer won; 0.00 otherwise.
    triggers:
      - event: paylater:paylater_refund_adjustment
        when: {dispute_outcome: customer_won}
        map: {source_txn_id: source_txn_id, entry_date: entry_date, amount: amount}
  - type: paylater_write_off
    target: paylater_ledger
    meaning: The unpaid balance of a plan is written off.
    grain: One row per plan written off.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The plan.
      entry_date: Write-off date.
      amount: Amount written off.
    account: owed
    direction: out
    triggers: []

measures:
  - id: paylater_msr_open_plans
    window: Current state on the handling date.
    measure: Count of paylater_plan_created rows of the account not yet fully paid, refunded or written off, and the sum of their unpaid purchase amounts.
  - id: paylater_msr_plans_today
    window: The handling calendar day, Eastern Time.
    measure: Count of paylater_plan_created rows of the account with entry_date equal to the handling date.
  - id: paylater_msr_missed_180d
    window: Rolling 180 calendar days ending on the handling date.
    measure: Count of paylater_late_fee rows of the account with entry_date in the window, together with installments that went past grace on tiers without a late fee.
  - id: paylater_msr_reschedules_year
    window: The calendar year containing the handling date.
    measure: Count of paylater_reschedule rows of the account with entry_date in the window, by reschedule_type.
  - id: paylater_msr_courtesy_waivers_year
    window: The calendar year containing the handling date.
    measure: Count of paylater_fee_waiver rows of the account with entry_date in the window.
  - id: paylater_msr_open_disputes
    window: Current state on the handling date.
    measure: Count of paylater_dispute_opened rows of the account without a paylater_dispute_resolved row for the same plan.

policies:
  - id: paylater_agg_multi_holding
    subject: [paylater_open]
    rule: >-
      A customer may hold one Pocketwire Pay in 4 account.
      An account is opened only if the customer holds no other Pay in 4 account whose status is anything other than closed.
    eligibility:
      - id: one_account
        applies_to: [paylater_open]
        kind: dedup
        condition: "An account is opened only if the customer holds no other Pay in 4 account whose status is anything other than closed."
        evidence_fields: [paylater_accounts.customer_id, paylater_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [paylater_accounts.customer_id]
          action_bindings:
            paylater_accounts.customer_id: customer_id
        dedup_contract:
          table: paylater_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active, past_due, suspended]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: paylater_agg_spending_power
    subject: [paylater_plan_created]
    rule: >-
      The unpaid purchase amounts of all open plans (paylater_msr_open_plans) plus the new purchase may not exceed the effective spending power, which is spending_power plus wallet_plan_bonus_power while the linked personal account is on Pocketwire Prime, Pocketwire Onyx or Pocketwire Summit, and spending_power otherwise.
      Spending power frees up as installments are paid where spending_power_restore_on_payment is true, and only when a plan is fully paid otherwise.
      At most max_active_plans plans are open and at most daily_new_plans_max are created per calendar day (paylater_msr_plans_today).
    eligibility: []
    measures: [paylater_msr_open_plans, paylater_msr_plans_today]
    params:
      bonus_plans: [Pocketwire Prime, Pocketwire Onyx, Pocketwire Summit]
      per_tier:
        Pocketwire Pay in 4 Starter: {spending_power: =spending_power, wallet_plan_bonus_power: =wallet_plan_bonus_power, max_active_plans: =max_active_plans}
        Pocketwire Pay in 4 Classic: {spending_power: =spending_power, wallet_plan_bonus_power: =wallet_plan_bonus_power, max_active_plans: =max_active_plans}
        Pocketwire Pay in 4 Select: {spending_power: =spending_power, wallet_plan_bonus_power: =wallet_plan_bonus_power, max_active_plans: =max_active_plans}
        Pocketwire Pay in 4 Preferred: {spending_power: =spending_power, wallet_plan_bonus_power: =wallet_plan_bonus_power, max_active_plans: =max_active_plans}
        Pocketwire Pay in 4 Premier: {spending_power: =spending_power, wallet_plan_bonus_power: =wallet_plan_bonus_power, max_active_plans: =max_active_plans}
        Pocketwire Pay in 4 Elite: {spending_power: =spending_power, wallet_plan_bonus_power: =wallet_plan_bonus_power, max_active_plans: =max_active_plans}

  - id: paylater_opening
    subject: [paylater_open, paylater_approve, paylater_decline]
    rule: >-
      An account can be applied for only by a customer whose personal account is active on Pocketwire Core or a higher plan; the eligibility check approves it on Pocketwire Pay in 4 Starter when the Starter entry_gate is met and declines it otherwise, and a representative cannot approve it or raise its spending power.
    eligibility:
      - id: wallet_ok
        applies_to: [paylater_open]
        kind: authorization
        condition: "An account can be applied for only by a customer whose personal account is active on Pocketwire Core or a higher plan"
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.status, wallet_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id

  - id: paylater_plans
    subject: [paylater_plan_created, paylater_installment_paid]
    rule: >-
      A plan can be created only while the account status is active.
      The purchase must be between min_purchase_amount and max_purchase_amount, not in merchant_category_exclusions, and from a United States merchant unless international_merchants_allowed is true.
      The purchase is split into installment_count installments due every installment_interval_days calendar days from the purchase date, the first (down_payment_pct of the purchase) collected at checkout, with cents that do not divide evenly placed per installment_rounding; plan_fee is charged and there is no interest.
      A linked external debit card stays on file for autopay where external_debit_card_required is true, and manual_credit_card payments are accepted only where credit_card_repayment_allowed is true.
      Autopay collects each installment on its due date from the sources in autopay_source_order, retrying autopay_retry_attempts times every autopay_retry_interval_days calendar days; the customer can pay manually at any time, in part where partial_payment_allowed, never less than min_partial_payment, and pay a plan off early at no cost where early_payoff_allowed is true.
    eligibility:
      - id: account_active
        applies_to: [paylater_plan_created]
        kind: state
        condition: "A plan can be created only while the account status is active."
        evidence_fields: [paylater_accounts.paylater_id, paylater_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [paylater_accounts.paylater_id]
          action_bindings:
            paylater_accounts.paylater_id: paylater_id
        state_contract:
          field: paylater_accounts.status
          allowed: [active]

  - id: paylater_late_fees
    subject: [paylater_late_fee, paylater_mark_past_due, paylater_fee_waiver]
    rule: >-
      An installment still unpaid late_fee_grace_days calendar days after its due date books a late_fee of late_fee on that installment, at most late_fees_per_installment_max per installment, while the plan's late fees stay within late_fee_cap_pct_of_order of its purchase amount, and makes the account past_due.
      A paused installment (dispute or hardship) is never late while the pause lasts.
      A late fee can be waived as a courtesy at the customer's request at most courtesy_late_fee_waivers_per_year times per calendar year (paylater_msr_courtesy_waivers_year), once the late installment is paid; a late fee is waived only if no earlier waiver exists for the same plan and installment.
      When the merchant refunds the whole purchase, the plan's late fees are refunded where late_fees_refunded_on_full_refund is true.
    eligibility:
      - id: waive_once
        applies_to: [paylater_fee_waiver]
        kind: dedup
        condition: "a late fee is waived only if no earlier waiver exists for the same plan and installment"
        evidence_fields: [paylater_ledger.source_txn_id, paylater_ledger.installment_number, paylater_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [paylater_ledger.source_txn_id, paylater_ledger.installment_number]
          action_bindings:
            paylater_ledger.source_txn_id: source_txn_id
            paylater_ledger.installment_number: installment_number
        dedup_contract:
          table: paylater_ledger
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id, installment_number: installment_number}
          duplicate_filters: {event_type: [paylater_fee_waiver]}
          distinct_fields: []
    measures: [paylater_msr_courtesy_waivers_year]
    params:
      per_tier:
        Pocketwire Pay in 4 Starter: {late_fee: =late_fee, late_fee_grace_days: =late_fee_grace_days, late_fee_cap_pct_of_order: =late_fee_cap_pct_of_order}
        Pocketwire Pay in 4 Classic: {late_fee: =late_fee, late_fee_grace_days: =late_fee_grace_days, late_fee_cap_pct_of_order: =late_fee_cap_pct_of_order}
        Pocketwire Pay in 4 Select: {late_fee: =late_fee, late_fee_grace_days: =late_fee_grace_days, late_fee_cap_pct_of_order: =late_fee_cap_pct_of_order}
        Pocketwire Pay in 4 Preferred: {late_fee: =late_fee, late_fee_grace_days: =late_fee_grace_days, late_fee_cap_pct_of_order: =late_fee_cap_pct_of_order}
        Pocketwire Pay in 4 Premier: {late_fee: =late_fee, late_fee_grace_days: =late_fee_grace_days, late_fee_cap_pct_of_order: =late_fee_cap_pct_of_order}
        Pocketwire Pay in 4 Elite: {late_fee: =late_fee, late_fee_grace_days: =late_fee_grace_days, late_fee_cap_pct_of_order: =late_fee_cap_pct_of_order}

  - id: paylater_reschedules
    subject: [paylater_reschedule]
    rule: >-
      One installment's due date can be moved up to reschedule_max_days calendar days later where reschedule_available is true, within reschedules_per_plan on that plan and max_reschedules_per_year on the account (paylater_msr_reschedules_year), and only before that installment is due.
      A hardship pause stops every installment of the account for hardship_pause_days calendar days once per hardship_pauses_per_year per calendar year, and a hardship respread spreads one plan's remaining balance over hardship_extra_installments more installments; both rest on the verified customer's statement of a loss of income or an emergency expense.
      A schedule change never changes the amount owed.
    eligibility: []
    measures: [paylater_msr_reschedules_year]

  - id: paylater_refunds_and_disputes
    subject: [paylater_refund_adjustment, paylater_dispute_opened, paylater_dispute_resolved]
    rule: >-
      A merchant refund reduces the plan per refund_application_order — the last installments first — and a refund larger than what is still owed on the plan is returned to the customer's payment source.
      A purchase can be disputed within dispute_window_days calendar days of the purchase date, with at most max_open_disputes disputes open (paylater_msr_open_disputes); the plan's installments pause for dispute_pause_days calendar days while the merchant has merchant_response_days to answer and the customer dispute_evidence_days to upload evidence.
      A dispute decided for the customer reduces the plan by the disputed amount; one decided for the merchant restarts the schedule with the next installment due the day after the decision.
    eligibility: []
    measures: [paylater_msr_open_disputes]

  - id: paylater_delinquency
    subject: [paylater_cure, paylater_suspend, paylater_reinstate, paylater_write_off, paylater_close]
    rule: >-
      A past_due account returns to active once no installment is past its grace days unpaid, is suspended after past_due_suspend_days calendar days past due counted from past_due_since, and has its unpaid plans written off after write_off_days calendar days counted the same way.
      A suspended account repaid in full is reinstated on Pocketwire Pay in 4 Starter after reactivation_wait_days calendar days, and one with a write-off is closed instead.
      The customer can close an active account only when nothing is owed; closing is the customer's own decision.
    eligibility: []

  - id: paylater_tier_review
    subject: [paylater_tier_change]
    rule: >-
      Accounts are reviewed every tier_review_frequency_days calendar days: an account moves up one tier when its completed_on_time_plans reach the next tier's entry_gate completed_on_time_plans_min and on_time_plans_for_upgrade more plans have been paid on time since the last move, and drops downgrade_steps_on_missed tiers when paylater_msr_missed_180d is at or above missed_installments_downgrade_threshold.
      A tier is never changed between reviews or at the customer's request.
    eligibility: []
    measures: [paylater_msr_missed_180d]
