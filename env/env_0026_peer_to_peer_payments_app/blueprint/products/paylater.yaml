# Pocketwire Pay in 4 — interest-free split payments on purchases, repaid in four installments.
category: paylater
display_name: Pocketwire Pay in 4

binding:
  holding_table: paylater_accounts
  event_tables: [paylater_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {amount_owed: owed}

lifecycle:
  states: [applied, active, past_due, suspended, closed]
  transitions:
    - {from: applied, to: active, by: system, means: The eligibility check approved the account.}
    - {from: applied, to: closed, by: system, means: The eligibility check declined the account.}
    - {from: active, to: past_due, by: system, means: An installment is still unpaid after its grace days.}
    - {from: past_due, to: active, by: agent, means: Every overdue installment is paid.}
    - {from: past_due, to: suspended, by: agent, means: The account stayed past due for the suspension period.}
    - {from: suspended, to: active, by: agent, means: A suspended account repaid in full is reinstated after the waiting period.}
    - {from: active, to: closed, by: user, means: The customer closes an account with nothing owed.}
    - {from: suspended, to: closed, by: agent, means: A suspended account is closed after repayment or write-off.}

accounts:
  - key: owed
    unit: USD
    meaning: What the customer owes across Pay in 4 plans — purchase amounts and late fees in; installments paid, merchant refund adjustments, fee waivers and write-offs out.

parameter_schema:
  spending_power: Maximum total unpaid purchase amount across open plans, before any plan bonus, USD.
  wallet_plan_bonus_power: Amount added to spending_power while the personal account is on Pocketwire Prime, Pocketwire Onyx or Pocketwire Summit, USD.
  min_purchase_amount: Smallest purchase that can be split, USD.
  max_purchase_amount: Largest single purchase that can be split, USD.
  installment_count: Number of installments per plan, including the one paid at purchase, count.
  installment_interval_days: Calendar days between installment due dates, days.
  down_payment_pct: Share of the purchase collected at checkout as the first installment, percent.
  installment_rounding: How cents that do not divide evenly are placed, text.
  plan_fee: Fee for opening a plan, USD; Pay in 4 charges no interest.
  max_active_plans: Maximum plans not yet fully paid at the same time, count.
  daily_new_plans_max: Maximum plans created on one calendar day, count.
  international_merchants_allowed: Whether purchases from merchants outside the United States can be split, boolean.
  merchant_category_exclusions: Merchant categories whose purchases can never be split, list.
  external_debit_card_required: Whether a linked external debit card must stay on file for autopay, boolean.
  autopay_source_order: Order in which autopay tries payment sources, list.
  autopay_retry_attempts: Autopay retries after a failed installment collection, count.
  autopay_retry_interval_days: Calendar days between autopay retries, days.
  credit_card_repayment_allowed: Whether installments can be paid with a credit card, boolean.
  partial_payment_allowed: Whether a manual partial payment of an installment is accepted, boolean.
  min_partial_payment: Smallest manual partial payment, USD.
  early_payoff_allowed: Whether the remaining installments of a plan can be paid off early at no cost, boolean.
  spending_power_restore_on_payment: Whether each installment paid restores spending power immediately rather than when the plan is fully paid, boolean.
  late_fee: Late fee on an installment still unpaid after the grace days, USD.
  late_fee_grace_days: Calendar days after an installment's due date before a late fee is charged, days.
  late_fees_per_installment_max: Late fees per installment, count.
  late_fee_cap_pct_of_order: Cap on all late fees of one plan, percentage of the purchase amount, percent.
  courtesy_late_fee_waivers_per_year: Late fees that can be waived as a courtesy per calendar year, count.
  late_fees_refunded_on_full_refund: Whether late fees of a plan are refunded when the merchant refunds the whole purchase, boolean.
  reschedule_available: Whether an installment's due date can be moved, boolean.
  reschedule_max_days: Most calendar days an installment can be moved later, days.
  reschedules_per_plan: Reschedules allowed on one plan, count.
  max_reschedules_per_year: Reschedules allowed per calendar year on the account, count.
  hardship_pause_days: Calendar days all installments of the account are paused on a hardship request, days.
  hardship_pauses_per_year: Hardship pauses per calendar year, count.
  hardship_extra_installments: Extra installments the remaining balance of one plan can be spread over on a hardship request, count.
  dispute_window_days: Calendar days after the purchase date within which a purchase on a plan can be disputed, days.
  dispute_pause_days: Calendar days installments of a disputed plan are paused while the dispute is open, days.
  max_open_disputes: Disputes open at the same time on the account, count.
  dispute_evidence_days: Calendar days after opening a dispute within which the customer must upload evidence, days.
  merchant_response_days: Calendar days the merchant has to answer a dispute, days.
  refund_application_order: How a merchant refund reduces a plan, text.
  past_due_suspend_days: Calendar days after the account became past due at which it is suspended, days.
  write_off_days: Calendar days after the account became past due at which unpaid installments are written off, days.
  reactivation_wait_days: Calendar days after a suspended account is repaid in full before it can be reinstated, days.
  on_time_plans_for_upgrade: Plans paid in full on time needed to move up one tier at a review, count.
  missed_installments_downgrade_threshold: Installments that went past due over the previous 180 days at or above which the account drops a tier at review, count.
  downgrade_steps_on_missed: Tiers dropped at a review when the missed threshold is reached, count.
  tier_review_frequency_days: Calendar days between spending power reviews, days.

