# Pocketwire Rewards — the points program earned on Pocketwire debit card spend.
category: rewards
display_name: Pocketwire Rewards

binding:
  holding_table: rewards_memberships
  event_tables: [rewards_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {points_balance: points}

lifecycle:
  states: [enrolled, active, suspended, closed]
  transitions:
    - {from: enrolled, to: active, by: system, means: The first points are earned and the membership becomes active.}
    - {from: active, to: suspended, by: agent, means: Earning and redemption stop while the linked personal account is limited or locked, or after rewards abuse is confirmed.}
    - {from: suspended, to: active, by: agent, means: The suspension ends once its reason no longer holds.}
    - {from: enrolled, to: closed, by: user, means: The customer leaves the program before earning anything.}
    - {from: active, to: closed, by: user, means: The customer leaves the program; remaining points are forfeited.}
    - {from: suspended, to: closed, by: agent, means: A membership suspended for confirmed rewards abuse, or whose linked personal account closed, is closed.}

accounts:
  - key: points
    unit: points
    meaning: Pocketwire Rewards points held by the member — earned on card purchases, boosts and bonuses, spent on redemptions, clawed back on refunds and forfeited on expiry or closure.

parameter_schema:
  base_earn_rate_points_per_dollar: Base points earned per USD of qualifying card spend, points per USD.
  grocery_bonus_points_per_dollar: Additional points per USD on grocery purchases, inside the quarterly category bonus cap, points per USD.
  dining_bonus_points_per_dollar: Additional points per USD on dining purchases, inside the quarterly category bonus cap, points per USD.
  gas_bonus_points_per_dollar: Additional points per USD on gas purchases, inside the quarterly category bonus cap, points per USD.
  travel_bonus_points_per_dollar: Additional points per USD on travel purchases, inside the quarterly category bonus cap, points per USD.
  streaming_bonus_points_per_dollar: Additional points per USD on streaming purchases, inside the quarterly category bonus cap, points per USD.
  online_retail_bonus_points_per_dollar: Additional points per USD on online retail purchases, inside the quarterly category bonus cap, points per USD.
  category_bonus_quarterly_spend_cap: Spend per calendar quarter, across all bonus categories, that can earn category bonus points; spend above it earns base points only, USD.
  dd_boost_points_per_dollar: Additional base points per USD when the linked personal account received direct deposits at or above dd_boost_threshold in the previous calendar month, points per USD.
  dd_boost_threshold: Previous-calendar-month direct deposit total into the linked personal account that unlocks dd_boost_points_per_dollar, USD.
  recurring_purchases_earn: Whether recurring card charges earn points, boolean.
  min_purchase_amount_to_earn: Smallest settled purchase amount that earns points, USD.
  max_points_per_purchase: Maximum base plus category points earned on one purchase, points.
  monthly_earn_cap_points: Maximum base plus category points earned per calendar month; purchases beyond it earn nothing that month, points.
  boost_offers_active_max: Maximum boost offers activated and not yet used or expired at the same time, count.
  boost_uses_per_activation: Number of qualifying purchases one boost activation applies to, count.
  boost_points_cap_per_purchase: Maximum boost points on one purchase, points.
  boost_activation_valid_days: Calendar days after activation that an unused boost stays valid, days.
  boost_swap_cooldown_hours: Full hours after a boost is used or expires before a new boost can be activated in that slot, hours.
  points_pending_days: Calendar days after the earning date before earned points become redeemable, days.
  cash_redemption_cents_per_point: Cash value of one point redeemed to the personal balance, US cents per point.
  gift_card_cents_per_point: Value of one point redeemed for a digital gift card, US cents per point.
  charity_cents_per_point: Donation value of one point redeemed for a partner charity, US cents per point.
  charity_match_pct: Percentage of a charity redemption's donation value that Pocketwire adds as a matching donation, percent.
  min_cash_redemption_points: Minimum points in one cash redemption, points.
  min_gift_card_redemption_points: Minimum points in one gift card or charity redemption, points.
  redemption_increment_points: Redemptions must be a whole multiple of this many points, points.
  max_cash_redemption_points_per_day: Maximum points redeemed to cash on one calendar day, points.
  gift_card_fulfilment_business_days: Latest delivery of a digital gift card after the redemption date, business days.
  redemption_cancel_window_hours: Full hours after a gift card or charity redemption during which the customer can cancel it before fulfilment, hours.
  max_points_balance: Maximum points balance; earning that would exceed it is not credited, points.
  points_expiry_months_inactivity: Calendar months without any earning or redemption after which the whole points balance expires; 0 means points never expire, months.
  referral_bonus_points: Points credited when a referred new customer qualifies, points.
  referral_bonus_max_per_year: Maximum referral bonuses per calendar year, count.
  referral_qualifying_spend: Card spend the referred customer must reach to qualify the referral, USD.
  referral_qualifying_days: Calendar days after the referred customer's sign-up within which the qualifying spend must be reached, days.
  goodwill_points_per_credit: Courtesy points credited for one late gift card fulfilment, points.
  goodwill_max_credits_per_year: Maximum courtesy credits over the rolling 365 days, count.
  milestone_quarterly_spend_threshold: Qualifying spend in one calendar quarter that earns the quarterly milestone bonus, USD.
  milestone_bonus_points: Points of the quarterly milestone bonus, points.
  anniversary_bonus_points: Points credited on each membership anniversary while the membership is active, points.
  tier_retention_spend_quarter: Qualifying spend in the previous calendar quarter needed to keep the tier at a quarterly review, USD.
  tier_grace_quarters: Consecutive quarterly reviews below retention spend that are tolerated before a downgrade, count.
  tier_downgrade_max_steps: Most tiers a membership can drop at one quarterly review, count.
  clawback_on_refund: Whether points earned on a purchase are clawed back when the merchant refunds it, boolean.
  clawback_window_days: Calendar days after the purchase date within which a merchant refund claws back points; later refunds leave points in place, days.
  negative_balance_allowed: Whether a clawback may take the points balance below zero; when false the clawback is cut to the balance, boolean.
  partner_charities: Partner charities available for charity redemptions, list of names.

