events:
  - type: rewards_enroll
    target: rewards_memberships
    mutation: create
    meaning: The customer joins Pocketwire Rewards.
    grain: One row per membership.
    fields:
      customer_id: The member.
      wallet_id: The personal account cash redemptions are paid into.
      variant_name: Always Pocketwire Rewards Member at enrolment.
      enrolled_date: Enrolment date; membership anniversaries count from it.
      points_balance: Opening points balance, always 0.
      tier_qualified_date: Date the current tier was assigned (the enrolment date at first).
      tier_review_date: First day of the next calendar quarter, when the first review runs.
      below_retention_quarters: Consecutive reviews below retention spend, 0 at enrolment.
    triggers: []
  - type: rewards_activate
    target: rewards_memberships
    mutation: {transition: {from: enrolled, to: active}}
    meaning: The membership becomes active when the first points are credited.
    grain: One row per membership.
    fields:
      status: Becomes active.
    triggers: []
  - type: rewards_suspend
    target: rewards_memberships
    mutation: {transition: {from: active, to: suspended}}
    meaning: The membership is suspended.
    grain: One row per membership.
    fields:
      status: Becomes suspended.
      suspension_reason: linked_account_restricted or rewards_abuse.
    triggers: []
  - type: rewards_reinstate
    target: rewards_memberships
    mutation: {transition: {from: suspended, to: active}}
    meaning: A suspended membership is reinstated.
    grain: One row per membership.
    fields:
      status: Returns to active.
    triggers: []
  - type: rewards_close
    target: rewards_memberships
    mutation: {transition: [{from: enrolled, to: closed}, {from: active, to: closed}, {from: suspended, to: closed}]}
    meaning: The membership is closed.
    grain: One row per membership.
    fields:
      status: Becomes closed.
      closed_date: Closure date.
    triggers:
      - event: rewards:rewards_points_expiry
        map: {expiry_reason: program_closed, entry_date: closed_date}
  - type: rewards_tier_change
    target: rewards_memberships
    mutation: update
    meaning: The quarterly tier review moves the membership up or down, or records another quarter below retention.
    grain: One row per membership.
    fields:
      variant_name: Tier after the review.
      tier_qualified_date: Date the current tier was assigned.
      tier_review_date: Date of the next review.
      below_retention_quarters: Consecutive reviews below retention spend after this review.
    triggers: []
  - type: rewards_cashback_earned
    target: rewards_ledger
    meaning: Points are earned on a settled Pocketwire card purchase (including points credited later for a purchase that was missed).
    grain: One row per card purchase earning points.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The card purchase that earned the points.
      spend_amount: The purchase amount.
      merchant_category: The purchase's merchant category.
      entry_date: Date the points were credited.
      points: Points earned.
    account: points
    direction: in
    triggers: []
  - type: rewards_boost_activated
    target: rewards_ledger
    meaning: The member activates a boost offer in the app.
    grain: One row per boost activation.
    distinguish_by: [offer_code, entry_date]
    fields:
      offer_code: The boost offer activated.
      entry_date: Activation date; validity counts from it.
      activated_at: Activation moment; the swap cooldown counts from the end of the previous boost.
    triggers: []
  - type: rewards_boost_earned
    target: rewards_ledger
    meaning: Boost points are earned on a card purchase at the offer's merchant.
    grain: One row per boosted purchase.
    distinguish_by: [source_txn_id, offer_code]
    fields:
      source_txn_id: The boosted card purchase.
      offer_code: The boost offer applied.
      spend_amount: The purchase amount.
      entry_date: Date the boost points were credited.
      points: Boost points.
    account: points
    direction: in
    triggers: []
  - type: rewards_clawback
    target: rewards_ledger
    meaning: Points earned on a purchase are taken back after the merchant refunds it.
    grain: One row per refunded purchase.
    distinguish_by: [source_txn_id, entry_date]
    fields:
      source_txn_id: The refunded card purchase.
      spend_amount: The refunded amount.
      entry_date: Date of the clawback.
      points: Points clawed back.
    account: points
    direction: out
    triggers: []
  - type: rewards_redemption
    target: rewards_ledger
    meaning: The member redeems points for cash to the personal balance, a digital gift card or a charity donation.
    grain: One row per redemption.
    distinguish_by: [redemption_reference]
    fields:
      redemption_reference: The redemption reference shown in the app.
      redemption_type: cash_to_balance, gift_card or charity.
      entry_date: Redemption date.
      points: Points redeemed.
      cash_value: USD value of the redemption.
      payee_name: Gift card brand or partner charity; empty on cash redemptions.
    account: points
    direction: out
    triggers:
      - event: wallet:wallet_internal_credit
        when: {redemption_type: cash_to_balance}
        map: {source_product: rewards, source_txn_id: rewards_entry_id, txn_date: entry_date, amount: cash_value}
  - type: rewards_gift_card_fulfilled
    target: rewards_ledger
    meaning: A gift card or charity redemption is fulfilled — the gift card code delivered or the donation sent.
    grain: One row per fulfilled redemption.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The redemption fulfilled.
      entry_date: Fulfilment date.
    triggers: []
  - type: rewards_redemption_reversal
    target: rewards_ledger
    meaning: A gift card or charity redemption is cancelled before fulfilment, or could not be fulfilled, and its points are returned.
    grain: One row per reversed redemption.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The redemption reversed.
      entry_date: Reversal date.
      points: Points returned, equal to the points redeemed.
    account: points
    direction: in
    triggers: []
  - type: rewards_points_expiry
    target: rewards_ledger
    meaning: The points balance expires after inactivity or is forfeited on closure.
    grain: One row per expiry.
    distinguish_by: [expiry_reason, entry_date]
    fields:
      expiry_reason: inactivity or program_closed.
      entry_date: Expiry date.
      points: Points removed, equal to the whole remaining positive balance.
    account: points
    direction: out
    triggers: []
  - type: rewards_referral_bonus
    target: rewards_ledger
    meaning: A referred new customer qualifies and the referring member earns the referral bonus.
    grain: One row per qualified referral.
    distinguish_by: [referred_username]
    fields:
      referred_username: Username of the referred customer.
      entry_date: Date credited.
      points: Bonus points.
    account: points
    direction: in
    triggers: []
  - type: rewards_bonus
    target: rewards_ledger
    meaning: A quarterly spend milestone or a membership anniversary bonus is credited.
    grain: One row per bonus per period.
    distinguish_by: [bonus_type, bonus_period]
    fields:
      bonus_type: quarterly_milestone or anniversary.
      bonus_period: The quarter (YYYY-Qn) or anniversary year (YYYY) the bonus is for.
      entry_date: Date credited.
      points: Bonus points.
    account: points
    direction: in
    triggers: []
  - type: rewards_goodwill_credit
    target: rewards_ledger
    meaning: Courtesy points are credited for a gift card or charity redemption fulfilled late.
    grain: One row per late redemption compensated.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The redemption that was fulfilled late.
      entry_date: Date credited.
      points: Courtesy points.
    account: points
    direction: in
    triggers: []

measures:
  - id: rewards_msr_points_month
    window: The calendar month containing the handling date.
    measure: Sum of points over rewards_cashback_earned rows of the membership with entry_date in the window.
  - id: rewards_msr_category_spend_quarter
    window: The calendar quarter containing the purchase date, up to and excluding the purchase being assessed.
    measure: Sum of spend_amount over rewards_cashback_earned rows of the membership whose merchant_category is grocery, dining, gas, travel, streaming or online_retail with entry_date in the window.
  - id: rewards_msr_prev_quarter_spend
    window: The calendar quarter before the quarter containing the handling date.
    measure: Sum of spend_amount over rewards_cashback_earned rows with entry_date in the window, less spend_amount over rewards_clawback rows with entry_date in the window.
  - id: rewards_msr_open_boosts
    window: Boost activations still valid on the handling date.
    measure: Count of rewards_boost_activated rows of the membership whose validity has not ended and whose uses (rewards_boost_earned rows with the same offer_code since the activation) are fewer than boost_uses_per_activation.
  - id: rewards_msr_redeemable_points
    window: Current state on the handling date.
    measure: points_balance less the points of rewards_cashback_earned, rewards_boost_earned, rewards_bonus and rewards_referral_bonus rows credited within the last points_pending_days calendar days.
  - id: rewards_msr_cash_redeemed_today
    window: The handling calendar day, Eastern Time.
    measure: Sum of points over rewards_redemption rows with redemption_type cash_to_balance and entry_date equal to the handling date.
  - id: rewards_msr_referrals_year
    window: The calendar year containing the handling date.
    measure: Count of rewards_referral_bonus rows of the membership with entry_date in the window.
  - id: rewards_msr_goodwill_365d
    window: Rolling 365 calendar days ending on the handling date.
    measure: Count of rewards_goodwill_credit rows of the membership with entry_date in the window.
  - id: rewards_msr_last_activity
    window: Whole membership history.
    measure: Latest entry_date over rewards_cashback_earned, rewards_boost_earned and rewards_redemption rows of the membership; the enrolled_date when there are none.

policies:
  - id: rewards_agg_multi_holding
    subject: [rewards_enroll]
    rule: >-
      A customer may hold one Pocketwire Rewards membership.
      A membership is opened only if the customer holds no other membership whose status is anything other than closed; a customer whose membership was closed may re-enrol, starting again at Pocketwire Rewards Member with a zero balance, and forfeited points are never restored.
    eligibility:
      - id: one_membership
        applies_to: [rewards_enroll]
        kind: dedup
        condition: "A membership is opened only if the customer holds no other membership whose status is anything other than closed"
        evidence_fields: [rewards_memberships.customer_id, rewards_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.customer_id]
          action_bindings:
            rewards_memberships.customer_id: customer_id
        dedup_contract:
          table: rewards_memberships
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [enrolled, active, suspended]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: rewards_enrolment
    subject: [rewards_enroll, rewards_activate]
    rule: >-
      Enrolment is open to a customer whose personal account is active and who holds a Pocketwire debit card that is ordered, active or locked, because points are earned only on Pocketwire debit card purchases; P2P payments, cash-outs, ATM withdrawals, fees and internal transfers never earn points.
      Every membership starts at Pocketwire Rewards Member on the enrolment date with its first tier review on the first day of the next calendar quarter; a customer's spend before enrolment never counts toward points or tier.
      The membership becomes active by itself when the first points are credited.
    eligibility:
      - id: wallet_and_card
        applies_to: [rewards_enroll]
        kind: authorization
        condition: "Enrolment is open to a customer whose personal account is active and who holds a Pocketwire debit card that is ordered, active or locked"
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.status, card_accounts.card_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id

  - id: rewards_earning
    subject: [rewards_cashback_earned]
    rule: >-
      Points are earned only while the membership status is enrolled or active.
      A settled card purchase of at least min_purchase_amount_to_earn earns the base rate plus the category bonus of its merchant category, and recurring purchases earn only on tiers whose recurring_purchases_earn is true.
      The category bonus applies only to the part of the purchase that, added to the bonus-category spend already earned this quarter (rewards_msr_category_spend_quarter), stays within category_bonus_quarterly_spend_cap; the rest earns the base rate only.
      When the linked personal account received direct deposits of at least dd_boost_threshold in the calendar month before the purchase, dd_boost_points_per_dollar is added to the base rate; this is how the personal account's deposit history lifts the rewards rate.
      Points are rounded down to whole points per purchase, capped at max_points_per_purchase, and cut to what remains under monthly_earn_cap_points (rewards_msr_points_month) and max_points_balance; the points are credited on the settlement date of the purchase.
      A purchase earns points only once: points are credited only if no earlier rewards_cashback_earned row points to the same card purchase, so a purchase the customer reports as missing is credited only when no earning row exists for it.
    eligibility:
      - id: earning_status
        applies_to: [rewards_cashback_earned]
        kind: state
        condition: "Points are earned only while the membership status is enrolled or active."
        evidence_fields: [rewards_memberships.membership_id, rewards_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.membership_id]
          action_bindings:
            rewards_memberships.membership_id: membership_id
        state_contract:
          field: rewards_memberships.status
          allowed: [enrolled, active]
      - id: earn_once
        applies_to: [rewards_cashback_earned]
        kind: dedup
        condition: "points are credited only if no earlier rewards_cashback_earned row points to the same card purchase"
        evidence_fields: [rewards_ledger.source_txn_id, rewards_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_ledger.source_txn_id]
          action_bindings:
            rewards_ledger.source_txn_id: source_txn_id
        dedup_contract:
          table: rewards_ledger
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [rewards_cashback_earned]}
          distinct_fields: []
    measures: [rewards_msr_category_spend_quarter, rewards_msr_points_month]
    formula:
      category_bonus_rate: "grocery_bonus_points_per_dollar if merchant_category == 'grocery' else dining_bonus_points_per_dollar if merchant_category == 'dining' else gas_bonus_points_per_dollar if merchant_category == 'gas' else travel_bonus_points_per_dollar if merchant_category == 'travel' else streaming_bonus_points_per_dollar if merchant_category == 'streaming' else online_retail_bonus_points_per_dollar if merchant_category == 'online_retail' else 0"
      bonus_eligible_spend: "max(0, min(spend_amount, category_bonus_quarterly_spend_cap - rewards_msr_category_spend_quarter))"
      points_before_dd_boost: "min(max_points_per_purchase, spend_amount * base_earn_rate_points_per_dollar + bonus_eligible_spend * category_bonus_rate)"
    params:
      per_tier:
        Pocketwire Rewards Member: {base_earn_rate_points_per_dollar: =base_earn_rate_points_per_dollar, dining_bonus_points_per_dollar: =dining_bonus_points_per_dollar, category_bonus_quarterly_spend_cap: =category_bonus_quarterly_spend_cap, monthly_earn_cap_points: =monthly_earn_cap_points}
        Pocketwire Rewards Silver: {base_earn_rate_points_per_dollar: =base_earn_rate_points_per_dollar, dining_bonus_points_per_dollar: =dining_bonus_points_per_dollar, category_bonus_quarterly_spend_cap: =category_bonus_quarterly_spend_cap, monthly_earn_cap_points: =monthly_earn_cap_points}
        Pocketwire Rewards Gold: {base_earn_rate_points_per_dollar: =base_earn_rate_points_per_dollar, dining_bonus_points_per_dollar: =dining_bonus_points_per_dollar, category_bonus_quarterly_spend_cap: =category_bonus_quarterly_spend_cap, monthly_earn_cap_points: =monthly_earn_cap_points}
        Pocketwire Rewards Platinum: {base_earn_rate_points_per_dollar: =base_earn_rate_points_per_dollar, dining_bonus_points_per_dollar: =dining_bonus_points_per_dollar, category_bonus_quarterly_spend_cap: =category_bonus_quarterly_spend_cap, monthly_earn_cap_points: =monthly_earn_cap_points}
        Pocketwire Rewards Diamond: {base_earn_rate_points_per_dollar: =base_earn_rate_points_per_dollar, dining_bonus_points_per_dollar: =dining_bonus_points_per_dollar, category_bonus_quarterly_spend_cap: =category_bonus_quarterly_spend_cap, monthly_earn_cap_points: =monthly_earn_cap_points}
        Pocketwire Rewards Obsidian: {base_earn_rate_points_per_dollar: =base_earn_rate_points_per_dollar, dining_bonus_points_per_dollar: =dining_bonus_points_per_dollar, category_bonus_quarterly_spend_cap: =category_bonus_quarterly_spend_cap, monthly_earn_cap_points: =monthly_earn_cap_points}

  - id: rewards_boosts
    subject: [rewards_boost_activated, rewards_boost_earned]
    rule: >-
      A boost is activated by the member in the app from the offers in boost_offer_catalog; a boost can be activated only while the member's open boosts (rewards_msr_open_boosts) are fewer than boost_offers_active_max, so on single-slot tiers a new boost excludes any other until the current one is used or expires, and a slot freed by use or expiry reopens only after boost_swap_cooldown_hours full hours.
      An activated boost stays valid for boost_activation_valid_days calendar days, the activation date being day 0, and applies to the next boost_uses_per_activation settled purchases at the offer's merchant made after the activation moment; a purchase made before activation is never boosted.
      Boost points are the purchase amount times the offer's bonus_points_per_dollar, rounded down to whole points and capped at the lower of the offer's max_points and boost_points_cap_per_purchase.
      Boost points add to the purchase's base and category points rather than replacing them; they do not count toward monthly_earn_cap_points or the category bonus cap, and only one boost can apply to one purchase — when two open boosts match the same purchase, the one activated first applies.
      A boosted purchase earns boost points only once: boost points are credited only if no earlier rewards_boost_earned row points to the same card purchase, so a missing boost is credited only when the activation, the merchant match and the timing all hold and no boost row exists for that purchase.
    eligibility:
      - id: boost_once
        applies_to: [rewards_boost_earned]
        kind: dedup
        condition: "boost points are credited only if no earlier rewards_boost_earned row points to the same card purchase"
        evidence_fields: [rewards_ledger.source_txn_id, rewards_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_ledger.source_txn_id]
          action_bindings:
            rewards_ledger.source_txn_id: source_txn_id
        dedup_contract:
          table: rewards_ledger
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [rewards_boost_earned]}
          distinct_fields: []
    measures: [rewards_msr_open_boosts]
    params:
      boost_offer_catalog:
        BOOST-FRESHMART5: {merchant_name: FreshMart, bonus_points_per_dollar: 5, max_points: 750}
        BOOST-BLUEBIRD10: {merchant_name: Bluebird Coffee, bonus_points_per_dollar: 10, max_points: 300}
        BOOST-ZIPLINE3: {merchant_name: Zipline Rides, bonus_points_per_dollar: 3, max_points: 450}
        BOOST-STREAMLY20: {merchant_name: Streamly, bonus_points_per_dollar: 20, max_points: 400}
        BOOST-NORTHWAY4: {merchant_name: Northway Fuel, bonus_points_per_dollar: 4, max_points: 600}
        BOOST-PATTY15: {merchant_name: Patty Shack, bonus_points_per_dollar: 15, max_points: 500}
      per_tier:
        Pocketwire Rewards Member: {boost_offers_active_max: =boost_offers_active_max, boost_uses_per_activation: =boost_uses_per_activation, boost_points_cap_per_purchase: =boost_points_cap_per_purchase, boost_activation_valid_days: =boost_activation_valid_days}
        Pocketwire Rewards Silver: {boost_offers_active_max: =boost_offers_active_max, boost_uses_per_activation: =boost_uses_per_activation, boost_points_cap_per_purchase: =boost_points_cap_per_purchase, boost_activation_valid_days: =boost_activation_valid_days}
        Pocketwire Rewards Gold: {boost_offers_active_max: =boost_offers_active_max, boost_uses_per_activation: =boost_uses_per_activation, boost_points_cap_per_purchase: =boost_points_cap_per_purchase, boost_activation_valid_days: =boost_activation_valid_days}
        Pocketwire Rewards Platinum: {boost_offers_active_max: =boost_offers_active_max, boost_uses_per_activation: =boost_uses_per_activation, boost_points_cap_per_purchase: =boost_points_cap_per_purchase, boost_activation_valid_days: =boost_activation_valid_days}
        Pocketwire Rewards Diamond: {boost_offers_active_max: =boost_offers_active_max, boost_uses_per_activation: =boost_uses_per_activation, boost_points_cap_per_purchase: =boost_points_cap_per_purchase, boost_activation_valid_days: =boost_activation_valid_days}
        Pocketwire Rewards Obsidian: {boost_offers_active_max: =boost_offers_active_max, boost_uses_per_activation: =boost_uses_per_activation, boost_points_cap_per_purchase: =boost_points_cap_per_purchase, boost_activation_valid_days: =boost_activation_valid_days}

  - id: rewards_clawback_rules
    subject: [rewards_clawback]
    rule: >-
      On tiers whose clawback_on_refund is true, when a merchant refund linked to an earning purchase posts, the points earned on that purchase are clawed back in proportion to the refunded share of the purchase — base, category, direct-deposit and boost points alike — rounded up to whole points, on the refund date.
      A refund claws back points only when it posts within the clawback window: the refund is dated no later than clawback_window_days calendar days after the purchase date.
      The clawback window is counted in calendar days from the purchase date, the day after the purchase being day 1, and a refund on the last day still claws back.
      On tiers whose negative_balance_allowed is false the clawback is cut to the points balance and the rest is written off; otherwise the balance may go negative and later earnings fill it first.
      An unlinked merchant credit, a dispute credit or a refund outside the window never claws back points.
    eligibility:
      - id: clawback_window
        applies_to: [rewards_clawback]
        kind: time
        condition: "the refund is dated no later than clawback_window_days calendar days after the purchase date"
        evidence_fields: [card_transactions.card_txn_id, card_transactions.txn_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.card_txn_id]
          action_bindings:
            card_transactions.card_txn_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the purchase date
          anchor_source: card_transactions.txn_date
          relation: not_after
          duration_source: variants.clawback_window_days
          unit: calendar_days
          counting_rule: "The clawback window is counted in calendar days from the purchase date, the day after the purchase being day 1, and a refund on the last day still claws back."
          boundary: inclusive

  - id: rewards_redemption_rules
    subject: [rewards_redemption, rewards_redemption_reversal, rewards_gift_card_fulfilled]
    rule: >-
      Points can be redeemed only while the membership status is active.
      Only redeemable points (rewards_msr_redeemable_points) can be redeemed — points stay pending for points_pending_days calendar days after they are credited.
      A redemption is a whole multiple of redemption_increment_points and at least min_cash_redemption_points for cash, or min_gift_card_redemption_points for a gift card or charity.
      Cash value is points times cash_redemption_cents_per_point, gift card value points times gift_card_cents_per_point, and donation value points times charity_cents_per_point, each divided by 100 and rounded down to the cent; a charity redemption goes only to one of partner_charities, and Pocketwire adds charity_match_pct of the donation value as its own donation, which is not credited to the member.
      Cash redemptions on one calendar day (rewards_msr_cash_redeemed_today plus the new one) may not exceed max_cash_redemption_points_per_day, and a cash redemption is paid into the linked personal account the same day, which needs that account to be able to receive an internal credit.
      A redemption is the member's own decision to spend their points and is confirmed by the member in the app.
      Gift cards and donations are fulfilled within gift_card_fulfilment_business_days business days; the member can cancel one within redemption_cancel_window_hours full hours of the redemption as long as it is not yet fulfilled, and one that cannot be fulfilled is reversed; a reversal returns the same points, and cash redemptions can never be reversed.
    eligibility:
      - id: redeem_active
        applies_to: [rewards_redemption]
        kind: state
        condition: "Points can be redeemed only while the membership status is active."
        evidence_fields: [rewards_memberships.membership_id, rewards_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.membership_id]
          action_bindings:
            rewards_memberships.membership_id: membership_id
        state_contract:
          field: rewards_memberships.status
          allowed: [active]
      - id: reversal_once
        applies_to: [rewards_redemption_reversal]
        kind: dedup
        condition: "a reversal returns the same points, and cash redemptions can never be reversed"
        evidence_fields: [rewards_ledger.source_txn_id, rewards_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_ledger.source_txn_id]
          action_bindings:
            rewards_ledger.source_txn_id: source_txn_id
        dedup_contract:
          table: rewards_ledger
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [rewards_redemption_reversal, rewards_gift_card_fulfilled]}
          distinct_fields: []
    measures: [rewards_msr_redeemable_points, rewards_msr_cash_redeemed_today]
    formula:
      cash_value_uncut: "points * cash_redemption_cents_per_point / 100"
      gift_card_value_uncut: "points * gift_card_cents_per_point / 100"
      charity_value_uncut: "points * charity_cents_per_point / 100"
    params:
      per_tier:
        Pocketwire Rewards Member: {cash_redemption_cents_per_point: =cash_redemption_cents_per_point, gift_card_cents_per_point: =gift_card_cents_per_point, min_cash_redemption_points: =min_cash_redemption_points, points_pending_days: =points_pending_days}
        Pocketwire Rewards Silver: {cash_redemption_cents_per_point: =cash_redemption_cents_per_point, gift_card_cents_per_point: =gift_card_cents_per_point, min_cash_redemption_points: =min_cash_redemption_points, points_pending_days: =points_pending_days}
        Pocketwire Rewards Gold: {cash_redemption_cents_per_point: =cash_redemption_cents_per_point, gift_card_cents_per_point: =gift_card_cents_per_point, min_cash_redemption_points: =min_cash_redemption_points, points_pending_days: =points_pending_days}
        Pocketwire Rewards Platinum: {cash_redemption_cents_per_point: =cash_redemption_cents_per_point, gift_card_cents_per_point: =gift_card_cents_per_point, min_cash_redemption_points: =min_cash_redemption_points, points_pending_days: =points_pending_days}
        Pocketwire Rewards Diamond: {cash_redemption_cents_per_point: =cash_redemption_cents_per_point, gift_card_cents_per_point: =gift_card_cents_per_point, min_cash_redemption_points: =min_cash_redemption_points, points_pending_days: =points_pending_days}
        Pocketwire Rewards Obsidian: {cash_redemption_cents_per_point: =cash_redemption_cents_per_point, gift_card_cents_per_point: =gift_card_cents_per_point, min_cash_redemption_points: =min_cash_redemption_points, points_pending_days: =points_pending_days}

  - id: rewards_tier_review
    subject: [rewards_tier_change]
    rule: >-
      Tiers are reviewed on the first day of each calendar quarter against the qualifying spend of the previous quarter (rewards_msr_prev_quarter_spend), which is purchase spend that earned points less refunded spend that was clawed back.
      The membership moves up to the highest tier whose entry_gate min_quarterly_qualifying_spend that spend meets, and an upgrade is never limited in steps.
      When the spend is below the current tier's tier_retention_spend_quarter, below_retention_quarters goes up by one; the membership drops one tier (tier_downgrade_max_steps) only once below_retention_quarters exceeds tier_grace_quarters, and the count then resets to 0; a review at or above retention resets the count to 0 without a tier change.
      Every review sets tier_review_date to the first day of the next quarter, and a change of tier sets tier_qualified_date to the review date; a tier is never changed between reviews, even at the member's request or on a goodwill basis.
    eligibility: []
    measures: [rewards_msr_prev_quarter_spend]
    params:
      per_tier:
        Pocketwire Rewards Member: {tier_retention_spend_quarter: =tier_retention_spend_quarter, tier_grace_quarters: =tier_grace_quarters}
        Pocketwire Rewards Silver: {tier_retention_spend_quarter: =tier_retention_spend_quarter, tier_grace_quarters: =tier_grace_quarters}
        Pocketwire Rewards Gold: {tier_retention_spend_quarter: =tier_retention_spend_quarter, tier_grace_quarters: =tier_grace_quarters}
        Pocketwire Rewards Platinum: {tier_retention_spend_quarter: =tier_retention_spend_quarter, tier_grace_quarters: =tier_grace_quarters}
        Pocketwire Rewards Diamond: {tier_retention_spend_quarter: =tier_retention_spend_quarter, tier_grace_quarters: =tier_grace_quarters}
        Pocketwire Rewards Obsidian: {tier_retention_spend_quarter: =tier_retention_spend_quarter, tier_grace_quarters: =tier_grace_quarters}

  - id: rewards_bonuses
    subject: [rewards_bonus, rewards_referral_bonus]
    rule: >-
      The quarterly milestone bonus of milestone_bonus_points, at the tier held on the last day of a quarter, is credited once for that quarter when the quarter's qualifying spend reached milestone_quarterly_spend_threshold; the anniversary bonus of anniversary_bonus_points is credited on each anniversary of the enrolled_date while the membership is active.
      A bonus is credited only if no earlier rewards_bonus row of the same bonus_type exists for the same bonus_period.
      A referral bonus of referral_bonus_points is credited when the referred customer, whose profile was created through the member's referral, reached referral_qualifying_spend in card purchases within referral_qualifying_days calendar days after sign-up, at most referral_bonus_max_per_year times per calendar year (rewards_msr_referrals_year); referring oneself or a second profile of the same person is rewards abuse and earns nothing.
      A referral is rewarded once per referred customer, bonuses are credited while the membership is active, and bonus points are subject to points_pending_days like any other earning.
    eligibility:
      - id: bonus_once_per_period
        applies_to: [rewards_bonus]
        kind: dedup
        condition: "A bonus is credited only if no earlier rewards_bonus row of the same bonus_type exists for the same bonus_period."
        evidence_fields: [rewards_ledger.bonus_type, rewards_ledger.bonus_period, rewards_ledger.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_ledger.membership_id, rewards_ledger.bonus_type, rewards_ledger.bonus_period]
          action_bindings:
            rewards_ledger.membership_id: membership_id
            rewards_ledger.bonus_type: bonus_type
            rewards_ledger.bonus_period: bonus_period
        dedup_contract:
          table: rewards_ledger
          mode: separate_record
          object_bindings: {membership_id: membership_id, bonus_type: bonus_type, bonus_period: bonus_period}
          duplicate_filters: {event_type: [rewards_bonus]}
          distinct_fields: []
    measures: [rewards_msr_referrals_year]

  - id: rewards_goodwill
    subject: [rewards_goodwill_credit]
    rule: >-
      Courtesy points are credited only for a gift card or charity redemption that was fulfilled late: its fulfilment was recorded later than gift_card_fulfilment_business_days business days after the redemption date, or it is still unfulfilled and not reversed after that period.
      The fulfilment period is counted in Federal Reserve business days from the redemption date, the first business day after the redemption being day 1.
      The credit is goodwill_points_per_credit of the tier held on the credit date, at most once per late redemption and at most goodwill_max_credits_per_year times over the rolling 365 days (rewards_msr_goodwill_365d); no courtesy points are credited for any other complaint, including missing points or boosts, which are handled by crediting the missing earning itself.
    eligibility:
      - id: goodwill_once
        applies_to: [rewards_goodwill_credit]
        kind: dedup
        condition: "at most once per late redemption"
        evidence_fields: [rewards_ledger.source_txn_id, rewards_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_ledger.source_txn_id]
          action_bindings:
            rewards_ledger.source_txn_id: source_txn_id
        dedup_contract:
          table: rewards_ledger
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [rewards_goodwill_credit]}
          distinct_fields: []
    measures: [rewards_msr_goodwill_365d]

  - id: rewards_points_expiry_rules
    subject: [rewards_points_expiry, rewards_close]
    rule: >-
      On tiers whose points_expiry_months_inactivity is not 0, the whole positive points balance expires once no earning or redemption has occurred for that many calendar months since the last activity (rewards_msr_last_activity), the expiry being dated the same day of the month that many months later, falling back to the month's last day when that day does not exist.
      Closing the membership forfeits the whole positive balance on the closure date; leaving the program is the member's own decision, confirmed by the member, and a member who wants value from the points redeems them before closing.
      Expired or forfeited points are never restored, including on re-enrolment, and a negative balance is simply cleared on closure without any charge.
    eligibility: []
    measures: [rewards_msr_last_activity]

  - id: rewards_membership_status
    subject: [rewards_suspend, rewards_reinstate, rewards_close]
    rule: >-
      A membership is suspended with suspension_reason linked_account_restricted while the linked personal account is limited or locked, and with rewards_abuse when the risk team confirms self-referral or manufactured spend.
      A membership suspended for linked_account_restricted is reinstated when the personal account returns to active; one suspended for rewards_abuse is never reinstated and is closed with its points forfeited.
      While suspended, purchases earn no points and none can be redeemed, and missed earnings are never credited back after reinstatement.
      A membership whose linked personal account closes is closed on the same day.
    eligibility: []
