# Pocketwire Savings Vault — interest-bearing savings sub-accounts beside the personal balance.
category: savings
display_name: Pocketwire Savings Vault

binding:
  holding_table: savings_vaults
  event_tables: [savings_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {vault_balance: vault_balance}

lifecycle:
  states: [opening, active, time_locked, frozen, closed]
  transitions:
    - {from: opening, to: active, by: system, means: The first deposit of at least min_opening_deposit funds the vault.}
    - {from: opening, to: closed, by: system, means: The vault was not funded within the funding window.}
    - {from: active, to: time_locked, by: user, means: The customer locks the vault until a chosen date.}
    - {from: time_locked, to: active, by: system, means: The lock end date is reached, or the customer ends the lock early where allowed.}
    - {from: active, to: frozen, by: system, means: The vault is frozen because the linked personal account is limited or locked, or a legal order applies.}
    - {from: time_locked, to: frozen, by: system, means: A time-locked vault is frozen for the same reasons.}
    - {from: frozen, to: active, by: agent, means: The freeze is lifted once its reason no longer holds.}
    - {from: active, to: closed, by: user, means: The customer closes an emptied vault.}

accounts:
  - key: vault_balance
    unit: USD
    meaning: Money saved in the vault — deposits, interest and bonuses in; withdrawals and fees out.

parameter_schema:
  base_apy_pct: Annual percentage yield on the part of the combined vault balance up to apy_balance_cap, percent.
  apy_balance_cap: Combined vault balance up to which base_apy_pct applies, USD.
  overflow_apy_pct: Annual percentage yield on the part of the combined vault balance above apy_balance_cap, percent.
  promo_apy_bonus_pct: Extra APY on a customer's first vault for its first promo_apy_months, percentage points.
  promo_apy_months: Calendar months from the first vault's opened_date during which the promotional bonus applies, months.
  dd_apy_bonus_pct: Extra APY while the linked personal account received direct deposits of at least dd_apy_bonus_threshold in the previous calendar month, percentage points.
  dd_apy_bonus_threshold: Previous-calendar-month direct deposits that unlock dd_apy_bonus_pct, USD.
  time_lock_bonus_apy_pct: Extra APY on a vault while it is time-locked, percentage points.
  interest_min_daily_balance: Smallest end-of-day vault balance that earns interest for that day, USD.
  interest_day_count_basis: Day-count basis of daily interest accrual, text.
  interest_posting_day: When accrued interest is posted, text.
  interest_while_frozen: Whether a frozen vault keeps accruing interest, boolean.
  accrued_interest_paid_on_close: Whether interest accrued in the month of closure is paid at closure, boolean.
  max_vaults: Maximum vaults not closed per customer, count.
  max_total_vault_balance: Maximum combined balance across the customer's vaults, USD.
  min_opening_deposit: Smallest first deposit that funds a new vault, USD.
  funding_window_days: Calendar days after opening within which a vault must receive its first deposit, days.
  daily_deposit_limit: Cap on deposits into the customer's vaults on one calendar day, USD.
  monthly_deposit_limit: Cap on deposits into the customer's vaults in one calendar month, USD.
  free_withdrawals_per_month: Withdrawals per vault per calendar month without the excess withdrawal fee, count.
  excess_withdrawal_fee: Fee on each withdrawal beyond the free monthly count, USD.
  max_withdrawal_per_day: Cap on withdrawals from the customer's vaults on one calendar day, USD.
  withdrawal_hold_days_after_deposit: Calendar days a deposit funded from an external bank stays unavailable for withdrawal, days.
  withdrawal_to_external_bank_allowed: Whether a withdrawal can go straight to a linked bank rather than the personal balance, boolean.
  external_withdrawal_business_days: Latest arrival of a withdrawal to a linked bank, business days.
  round_ups_available: Whether card purchase round-ups can be switched on, boolean.
  round_up_multiplier_max: Highest round-up multiplier the customer can choose, times.
  round_up_monthly_cap: Cap on round-up deposits per calendar month, USD.
  round_up_sweep_threshold: Accumulated round-ups swept into the vault once they reach this amount, USD.
  dd_split_max_pct: Largest share of each direct deposit that can be split straight into a vault, percent.
  autosave_available: Whether scheduled autosave deposits can be set up, boolean.
  autosave_min_amount: Smallest scheduled autosave deposit, USD.
  autosave_max_per_run: Largest scheduled autosave deposit, USD.
  autosave_skip_if_balance_below: Personal ledger balance below which a scheduled autosave is skipped, USD.
  time_lock_available: Whether a vault can be time-locked, boolean.
  time_lock_min_days: Shortest time lock, calendar days.
  time_lock_max_days: Longest time lock, calendar days.
  early_unlock_allowed: Whether a time lock can be ended early at the customer's request, boolean.
  early_unlock_bonus_forfeit: Whether ending a time lock early forfeits the time-lock bonus interest already posted, boolean.
  goal_completion_bonus: Bonus paid when a savings goal is reached, USD.
  goal_min_amount_for_bonus: Smallest goal amount that earns the goal bonus, USD.
  goal_min_days_for_bonus: Minimum calendar days between setting the goal and reaching it for the bonus, days.
  goal_bonus_max_per_year: Goal bonuses per calendar year per customer, count.
  dormant_after_days: Calendar days without a customer-initiated deposit or withdrawal after which a vault is marked dormant for unclaimed-property purposes, days.
  fdic_passthrough_limit: Deposit insurance limit per program bank for the customer's combined deposits, USD.
  program_bank_count: Number of program banks the combined vault balance is spread over for pass-through insurance, count.
  min_balance_to_keep_tier: Average combined vault balance over the previous calendar month needed to keep the tier at the monthly review, USD.
  tier_review_grace_months: Consecutive monthly reviews below min_balance_to_keep_tier tolerated before a downgrade, count.

