events:
  - type: savings_open
    target: savings_vaults
    mutation: create
    meaning: The customer opens a savings vault.
    grain: One row per vault.
    fields:
      customer_id: The saver.
      wallet_id: The linked personal account.
      variant_name: The tier the customer's vaults carry.
      opened_date: Opening date.
      vault_name: Name the customer gives the vault.
      vault_balance: Opening balance, always 0.00.
      goal_amount: Savings goal; empty when none.
      goal_set_date: Date the goal was set; empty when none.
      round_up_multiplier: 0 when round-ups are off, otherwise the chosen multiplier.
    triggers: []
  - type: savings_fund
    target: savings_vaults
    mutation: {transition: {from: opening, to: active}}
    meaning: The first qualifying deposit funds the vault.
    grain: One row per vault.
    fields:
      status: Becomes active.
    triggers: []
  - type: savings_expire_unfunded
    target: savings_vaults
    mutation: {transition: {from: opening, to: closed}}
    meaning: An unfunded vault is closed at the end of the funding window.
    grain: One row per vault.
    fields:
      status: Becomes closed.
      closed_date: Closure date.
    triggers: []
  - type: savings_time_lock
    target: savings_vaults
    mutation: {transition: {from: active, to: time_locked}}
    meaning: The customer time-locks the vault.
    grain: One row per vault.
    fields:
      status: Becomes time_locked.
      lock_start_date: Date the lock began.
      lock_end_date: Date the lock ends.
    triggers: []
  - type: savings_unlock
    target: savings_vaults
    mutation: {transition: {from: time_locked, to: active}}
    meaning: A time lock ends on its end date or early where allowed.
    grain: One row per vault.
    fields:
      status: Returns to active.
      lock_end_date: Actual end date of the lock.
    triggers: []
  - type: savings_freeze
    target: savings_vaults
    mutation: {transition: [{from: active, to: frozen}, {from: time_locked, to: frozen}]}
    meaning: The vault is frozen.
    grain: One row per vault.
    fields:
      status: Becomes frozen.
      freeze_reason: linked_account_restricted or legal_order.
    triggers: []
  - type: savings_unfreeze
    target: savings_vaults
    mutation: {transition: {from: frozen, to: active}}
    meaning: The freeze is lifted.
    grain: One row per vault.
    fields:
      status: Returns to active.
    triggers: []
  - type: savings_close
    target: savings_vaults
    mutation: {transition: {from: active, to: closed}}
    meaning: The customer closes an emptied vault.
    grain: One row per vault.
    fields:
      status: Becomes closed.
      closed_date: Closure date.
    triggers: []
  - type: savings_settings_update
    target: savings_vaults
    mutation: update
    meaning: The customer changes the vault's name, goal or round-up multiplier.
    grain: One row per vault.
    fields:
      vault_name: Vault name after the change.
      goal_amount: Goal after the change.
      goal_set_date: Date the goal was set or changed.
      round_up_multiplier: Round-up multiplier after the change.
    triggers: []
  - type: savings_deposit
    target: savings_ledger
    meaning: Money is deposited into the vault.
    grain: One row per deposit.
    distinguish_by: [deposit_source, source_txn_id, entry_date]
    fields:
      deposit_source: personal_balance, external_bank, round_up, direct_deposit_split or autosave.
      source_txn_id: The originating record (card purchases swept for a round-up batch are summarised by the last purchase; the direct deposit for a split); empty for manual and autosave deposits.
      entry_date: Deposit date.
      amount: Amount deposited.
    account: vault_balance
    direction: in
    triggers:
      - event: wallet:wallet_internal_debit
        when: {deposit_source: [personal_balance, round_up, autosave]}
        map: {source_product: savings, source_txn_id: savings_entry_id, txn_date: entry_date, amount: amount}
  - type: savings_withdrawal
    target: savings_ledger
    meaning: Money is withdrawn from the vault.
    grain: One row per withdrawal.
    distinguish_by: [withdrawal_reference]
    fields:
      withdrawal_reference: The withdrawal reference shown in the app.
      withdrawal_destination: personal_balance or external_bank.
      entry_date: Withdrawal date.
      amount: Amount withdrawn.
    account: vault_balance
    direction: out
    triggers:
      - event: wallet:wallet_internal_credit
        when: {withdrawal_destination: personal_balance}
        map: {source_product: savings, source_txn_id: savings_entry_id, txn_date: entry_date, amount: amount}
  - type: savings_interest
    target: savings_ledger
    meaning: Monthly interest is posted.
    grain: One row per vault per interest month.
    distinguish_by: [interest_period]
    fields:
      interest_period: Month the interest covers (YYYY-MM).
      entry_date: Posting date.
      amount: Interest posted.
    account: vault_balance
    direction: in
    triggers: []
  - type: savings_fee
    target: savings_ledger
    meaning: An excess withdrawal fee is charged.
    grain: One row per fee.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The withdrawal that exceeded the free count.
      entry_date: Date charged.
      amount: Fee amount.
    account: vault_balance
    direction: out
    triggers: []
  - type: savings_bonus
    target: savings_ledger
    meaning: A goal completion bonus is paid.
    grain: One row per goal reached.
    distinguish_by: [goal_set_date]
    fields:
      goal_set_date: The goal's set date, identifying the goal.
      entry_date: Date paid.
      amount: Bonus amount.
    account: vault_balance
    direction: in
    triggers: []
  - type: savings_bonus_forfeit
    target: savings_ledger
    meaning: Time-lock bonus interest already posted is taken back after an early unlock.
    grain: One row per early-ended lock.
    distinguish_by: [lock_start_date]
    fields:
      lock_start_date: Start date of the lock ended early.
      entry_date: Date taken back.
      amount: Bonus interest forfeited.
    account: vault_balance
    direction: out
    triggers: []

measures:
  - id: savings_msr_combined_balance
    window: Current state on the handling date.
    measure: Sum of vault_balance over the customer's vaults that are not closed.
  - id: savings_msr_withdrawals_month
    window: The calendar month containing the handling date.
    measure: Count of savings_withdrawal rows of the vault with entry_date in the window, not counting the withdrawal being assessed.
  - id: savings_msr_deposits_today
    window: The handling calendar day, Eastern Time.
    measure: Sum of amount over savings_deposit rows across the customer's vaults with entry_date equal to the handling date.
  - id: savings_msr_deposits_month
    window: The calendar month containing the handling date.
    measure: Sum of amount over savings_deposit rows across the customer's vaults with entry_date in the window.
  - id: savings_msr_round_ups_month
    window: The calendar month containing the handling date.
    measure: Sum of amount over savings_deposit rows with deposit_source round_up across the customer's vaults in the window.
  - id: savings_msr_avg_balance_prev_month
    window: The calendar month before the month containing the handling date.
    measure: Average of the end-of-day combined vault balance over the days of the window.
  - id: savings_msr_goal_bonuses_year
    window: The calendar year containing the handling date.
    measure: Count of savings_bonus rows across the customer's vaults with entry_date in the window.

policies:
  - id: savings_agg_multi_holding
    subject: [savings_open]
    rule: >-
      A customer may hold several vaults, up to max_vaults vaults that are not closed.
      A further vault is opened only if the customer holds fewer than max_vaults vaults whose status is anything other than closed; every vault of a customer carries the same tier.
    eligibility:
      - id: vault_cap
        applies_to: [savings_open]
        kind: dedup
        condition: "A further vault is opened only if the customer holds fewer than max_vaults vaults whose status is anything other than closed"
        evidence_fields: [savings_vaults.customer_id, savings_vaults.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [savings_vaults.customer_id]
          action_bindings:
            savings_vaults.customer_id: customer_id
        dedup_contract:
          table: savings_vaults
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [opening, active, time_locked, frozen]}
          distinct_fields: [vault_name]
    params:
      max_per_customer: null

  - id: savings_agg_combined_balance
    subject: [savings_interest, savings_deposit]
    rule: >-
      Interest bands, the deposit limits and the balance cap are applied to the customer's vaults together: base_apy_pct applies to the combined balance (savings_msr_combined_balance) up to apy_balance_cap and overflow_apy_pct above it, the earning split being allocated to each vault in proportion to its end-of-day balance.
      A deposit that would take the combined balance above max_total_vault_balance, or the day's or month's deposits (savings_msr_deposits_today, savings_msr_deposits_month) above daily_deposit_limit or monthly_deposit_limit, is declined in full.
      The combined vault balance together with the personal ledger balance is insured up to fdic_passthrough_limit per program bank across program_bank_count banks.
    eligibility: []
    measures: [savings_msr_combined_balance, savings_msr_deposits_today, savings_msr_deposits_month]
    params:
      per_tier:
        Pocketwire Vault Essential: {base_apy_pct: =base_apy_pct, apy_balance_cap: =apy_balance_cap, overflow_apy_pct: =overflow_apy_pct, max_total_vault_balance: =max_total_vault_balance}
        Pocketwire Vault Select: {base_apy_pct: =base_apy_pct, apy_balance_cap: =apy_balance_cap, overflow_apy_pct: =overflow_apy_pct, max_total_vault_balance: =max_total_vault_balance}
        Pocketwire Vault Preferred: {base_apy_pct: =base_apy_pct, apy_balance_cap: =apy_balance_cap, overflow_apy_pct: =overflow_apy_pct, max_total_vault_balance: =max_total_vault_balance}
        Pocketwire Vault Premier: {base_apy_pct: =base_apy_pct, apy_balance_cap: =apy_balance_cap, overflow_apy_pct: =overflow_apy_pct, max_total_vault_balance: =max_total_vault_balance}
        Pocketwire Vault Reserve: {base_apy_pct: =base_apy_pct, apy_balance_cap: =apy_balance_cap, overflow_apy_pct: =overflow_apy_pct, max_total_vault_balance: =max_total_vault_balance}
        Pocketwire Vault Private: {base_apy_pct: =base_apy_pct, apy_balance_cap: =apy_balance_cap, overflow_apy_pct: =overflow_apy_pct, max_total_vault_balance: =max_total_vault_balance}

  - id: savings_opening
    subject: [savings_open, savings_fund, savings_expire_unfunded]
    rule: >-
      A vault can be opened only by a customer whose personal account is active on a plan at or above the tier's entry_gate linked_wallet_plan_min, so the personal account's plan decides the vault tier on offer.
      A new vault is active once a first deposit of at least min_opening_deposit arrives, and is closed by the system if none arrives within funding_window_days calendar days after opening.
    eligibility:
      - id: plan_allows
        applies_to: [savings_open]
        kind: authorization
        condition: "A vault can be opened only by a customer whose personal account is active on a plan at or above the tier's entry_gate linked_wallet_plan_min"
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.status, wallet_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id

  - id: savings_interest_rules
    subject: [savings_interest]
    rule: >-
      Interest accrues daily on each end-of-day balance of at least interest_min_daily_balance, at the applicable APY divided by 365 (interest_day_count_basis), and is posted on interest_posting_day rounded to the cent (half up).
      The applicable APY is the banded rate of savings_agg_combined_balance plus, where they apply, promo_apy_bonus_pct on the customer's first vault during promo_apy_months, dd_apy_bonus_pct when the linked personal account's previous-month direct deposits reached dd_apy_bonus_threshold, and time_lock_bonus_apy_pct on a time-locked vault; these bonuses add together.
      A frozen vault accrues interest when interest_while_frozen is true, and interest accrued in the month of closure is paid at closure only when accrued_interest_paid_on_close is true.
    eligibility: []
    formula:
      daily_interest_on_base_band: "min(vault_balance, apy_balance_cap) * base_apy_pct / 100 / 365"
    params:
      per_tier:
        Pocketwire Vault Essential: {promo_apy_bonus_pct: =promo_apy_bonus_pct, dd_apy_bonus_pct: =dd_apy_bonus_pct, time_lock_bonus_apy_pct: =time_lock_bonus_apy_pct}
        Pocketwire Vault Select: {promo_apy_bonus_pct: =promo_apy_bonus_pct, dd_apy_bonus_pct: =dd_apy_bonus_pct, time_lock_bonus_apy_pct: =time_lock_bonus_apy_pct}
        Pocketwire Vault Preferred: {promo_apy_bonus_pct: =promo_apy_bonus_pct, dd_apy_bonus_pct: =dd_apy_bonus_pct, time_lock_bonus_apy_pct: =time_lock_bonus_apy_pct}
        Pocketwire Vault Premier: {promo_apy_bonus_pct: =promo_apy_bonus_pct, dd_apy_bonus_pct: =dd_apy_bonus_pct, time_lock_bonus_apy_pct: =time_lock_bonus_apy_pct}
        Pocketwire Vault Reserve: {promo_apy_bonus_pct: =promo_apy_bonus_pct, dd_apy_bonus_pct: =dd_apy_bonus_pct, time_lock_bonus_apy_pct: =time_lock_bonus_apy_pct}
        Pocketwire Vault Private: {promo_apy_bonus_pct: =promo_apy_bonus_pct, dd_apy_bonus_pct: =dd_apy_bonus_pct, time_lock_bonus_apy_pct: =time_lock_bonus_apy_pct}

  - id: savings_deposit_rules
    subject: [savings_deposit]
    rule: >-
      A deposit can be made while the vault status is opening, active or time_locked.
      Round-ups, where round_ups_available is true, add the difference between each card purchase and the next whole dollar, times the chosen round_up_multiplier (never above round_up_multiplier_max), swept when they reach round_up_sweep_threshold and capped by round_up_monthly_cap (savings_msr_round_ups_month); a direct deposit split can send at most dd_split_max_pct of each deposit; autosave runs only where autosave_available, between autosave_min_amount and autosave_max_per_run, and is skipped when the personal ledger balance is below autosave_skip_if_balance_below.
      Deposits from the personal balance, round-ups and autosave move money out of the personal account; a deposit from an external bank stays unavailable for withdrawal for withdrawal_hold_days_after_deposit calendar days.
    eligibility:
      - id: deposit_status
        applies_to: [savings_deposit]
        kind: state
        condition: "A deposit can be made while the vault status is opening, active or time_locked."
        evidence_fields: [savings_vaults.vault_id, savings_vaults.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [savings_vaults.vault_id]
          action_bindings:
            savings_vaults.vault_id: vault_id
        state_contract:
          field: savings_vaults.status
          allowed: [opening, active, time_locked]
    measures: [savings_msr_round_ups_month]

  - id: savings_withdrawal_rules
    subject: [savings_withdrawal, savings_fee]
    rule: >-
      A withdrawal can be made only while the vault status is active; a time-locked or frozen vault cannot be withdrawn from.
      Withdrawals go to the personal balance immediately, or to a linked bank within external_withdrawal_business_days business days where withdrawal_to_external_bank_allowed is true; the day's withdrawals across the customer's vaults may not exceed max_withdrawal_per_day, and funds still under the deposit hold cannot be withdrawn.
      Each withdrawal beyond free_withdrawals_per_month in the calendar month (savings_msr_withdrawals_month) books an excess withdrawal fee of excess_withdrawal_fee on the same day; the fee is never waived.
    eligibility:
      - id: withdraw_active
        applies_to: [savings_withdrawal]
        kind: state
        condition: "A withdrawal can be made only while the vault status is active; a time-locked or frozen vault cannot be withdrawn from."
        evidence_fields: [savings_vaults.vault_id, savings_vaults.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [savings_vaults.vault_id]
          action_bindings:
            savings_vaults.vault_id: vault_id
        state_contract:
          field: savings_vaults.status
          allowed: [active]
    measures: [savings_msr_withdrawals_month]
    params:
      per_tier:
        Pocketwire Vault Essential: {free_withdrawals_per_month: =free_withdrawals_per_month, excess_withdrawal_fee: =excess_withdrawal_fee}
        Pocketwire Vault Select: {free_withdrawals_per_month: =free_withdrawals_per_month, excess_withdrawal_fee: =excess_withdrawal_fee}
        Pocketwire Vault Preferred: {free_withdrawals_per_month: =free_withdrawals_per_month, excess_withdrawal_fee: =excess_withdrawal_fee}
        Pocketwire Vault Premier: {free_withdrawals_per_month: =free_withdrawals_per_month, excess_withdrawal_fee: =excess_withdrawal_fee}
        Pocketwire Vault Reserve: {free_withdrawals_per_month: =free_withdrawals_per_month, excess_withdrawal_fee: =excess_withdrawal_fee}
        Pocketwire Vault Private: {free_withdrawals_per_month: =free_withdrawals_per_month, excess_withdrawal_fee: =excess_withdrawal_fee}

  - id: savings_time_locks
    subject: [savings_time_lock, savings_unlock, savings_bonus_forfeit]
    rule: >-
      A vault can be time-locked where time_lock_available is true, for between time_lock_min_days and time_lock_max_days calendar days; locking is the customer's own decision.
      The lock ends on its lock_end_date; it can be ended early only where early_unlock_allowed is true, and then the time-lock bonus interest already posted for that lock is taken back when early_unlock_bonus_forfeit is true.
      A representative cannot end a lock early on a tier that does not allow it, whatever the customer's reason.
    eligibility: []

  - id: savings_goal_bonus
    subject: [savings_bonus, savings_settings_update]
    rule: >-
      A goal bonus of goal_completion_bonus is paid when the vault balance first reaches a goal of at least goal_min_amount_for_bonus that was set at least goal_min_days_for_bonus calendar days earlier, at most goal_bonus_max_per_year times per calendar year (savings_msr_goal_bonuses_year) and once per goal.
      Changing the goal amount resets goal_set_date, and withdrawing after the bonus does not take it back.
    eligibility: []
    measures: [savings_msr_goal_bonuses_year]

  - id: savings_freeze_rules
    subject: [savings_freeze, savings_unfreeze]
    rule: >-
      Vaults are frozen while the linked personal account is limited or locked, or under a legal order, and unfrozen by a representative once the personal account is active again and no legal order stands; a time lock that ended during a freeze leaves the vault active on unfreezing.
    eligibility: []

  - id: savings_closure_and_review
    subject: [savings_close, savings_settings_update]
    rule: >-
      A vault can be closed by the customer only when its balance is 0.00, after withdrawing everything to the personal balance.
      Vault tiers are reviewed on the first day of each calendar month: all of a customer's vaults move to the highest tier whose entry_gate both the linked plan and the previous month's average combined balance (savings_msr_avg_balance_prev_month) meet, and drop one tier only after more than tier_review_grace_months consecutive reviews below min_balance_to_keep_tier.
      A vault untouched by the customer for dormant_after_days calendar days is reported as dormant under state unclaimed-property law.
    eligibility: []
    measures: [savings_msr_avg_balance_prev_month]
