# Pocketwire Personal Account — the stored-balance P2P account every customer holds.
category: wallet
display_name: Pocketwire Personal Account

binding:
  holding_table: wallet_accounts
  event_tables: [wallet_transactions, wallet_claims]
  intake_tables: [wallet_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {ledger_balance: balance}

lifecycle:
  states: [applied, active, limited, locked, closure_pending, closed]
  transitions:
    - {from: applied, to: active, by: system, means: The Customer Identification Program check on the sign-up passed and the account is opened for payments.}
    - {from: applied, to: closed, by: system, means: The sign-up was declined by the Customer Identification Program check and the account never opened.}
    - {from: active, to: limited, by: system, means: A limitation is placed after a risk or document trigger; sending, cash-outs and plan changes stop while receiving continues.}
    - {from: limited, to: active, by: agent, means: The limitation is lifted after the back-office review of the submitted documents was approved.}
    - {from: limited, to: closed, by: agent, means: The account is closed for risk after the document response window ran out or the review was declined.}
    - {from: active, to: locked, by: agent, means: A security lock is placed on suspected account takeover; every money movement stops until recovery.}
    - {from: limited, to: locked, by: agent, means: A limited account showing takeover signals is additionally security-locked.}
    - {from: locked, to: active, by: agent, means: Account recovery completed after the approved identity re-verification and the cooling-off period.}
    - {from: active, to: closure_pending, by: user, means: The customer confirms in the app that they want the account closed.}
    - {from: closure_pending, to: active, by: user, means: The customer withdraws a pending closure before it completes.}
    - {from: closure_pending, to: closed, by: agent, means: Closure completes once the ledger balance is zero and no claim is open.}

accounts:
  - key: balance
    unit: USD
    meaning: The personal-account ledger balance built from personal-account movements (payments, bank transfers, fees, claim credits and internal transfers from other Pocketwire products); debit card activity settles on the card's own settlement ledger, so the balance the app displays is this figure plus the net of that card ledger.

parameter_schema:
  monthly_plan_fee: Monthly subscription fee for the plan when billed monthly, USD, charged on each plan renewal date.
  annual_plan_fee: Subscription fee for the plan when billed annually, USD, charged once on the annual plan renewal date.
  annual_billing_available: Whether the plan can be billed annually instead of monthly, boolean.
  plan_trial_days: Free-trial length on a first subscription to the plan, calendar days counted from the plan change date; 0 means no trial.
  plan_cancellation_refund_days: Calendar days after an annual plan fee is charged during which cancelling or downgrading refunds that annual fee in full; 0 means no refund window.
  restricted_fee_waiver_days: Number of calendar days within one billing period the account must spend limited or locked for that period's monthly plan fee to be waived, days.
  weekly_send_limit: Default cap on the sum of P2P payments sent over the rolling 7-day window (today and the six preceding calendar days), USD.
  per_payment_send_limit: Maximum amount of a single P2P payment sent, USD.
  rolling_30d_receive_limit: Cap on the sum of P2P payments received over the rolling 30-day window (today and the 29 preceding calendar days), USD.
  max_ledger_balance: Maximum personal-account ledger balance the account may hold after any credit, USD.
  cash_out_enabled: Whether the plan may transfer balance out to a linked bank account or debit card at all, boolean.
  daily_cash_out_limit: Cap on the sum of cash-outs (standard and instant) initiated on one calendar day, Eastern Time, USD.
  instant_transfer_max_per_transfer: Maximum amount of one instant cash-out, USD.
  instant_transfer_fee_rate_pct: Base instant cash-out fee as a percentage of the transfer amount, percent.
  instant_transfer_fee_min: Minimum instant cash-out fee when a fee applies, USD.
  instant_transfer_fee_max: Maximum instant cash-out fee, USD.
  free_instant_transfers_per_month: Number of instant cash-outs per calendar month that carry no fee, count.
  standard_transfer_max_business_days: Latest arrival of a standard cash-out, business days after initiation.
  credit_card_funding_enabled: Whether P2P payments may be funded from a linked credit card, boolean.
  credit_card_funding_fee_rate_pct: Fee on a P2P payment funded by a linked credit card, percentage of the payment amount, percent.
  instant_topup_fee_rate_pct: Fee on an instant add-money from a linked debit card, percentage of the top-up amount, percent.
  daily_topup_limit: Cap on the sum of add-money top-ups initiated on one calendar day, Eastern Time, USD.
  early_direct_deposit_days: How many calendar days before the payer's scheduled pay date a direct deposit is made available, days.
  dd_benefit_threshold: Sum of direct deposits posted in the previous calendar month at or above which the reduced instant cash-out rate applies, USD.
  dd_instant_fee_rate_pct: Reduced instant cash-out fee rate that replaces the base rate when the direct-deposit threshold is met, percent.
  card_holder_bonus_free_instant: Extra fee-free instant cash-outs per calendar month when the customer holds a Pocketwire debit card in active or locked status, count.
  limit_increase_eligible: Whether the plan may request a weekly send limit increase, boolean.
  limit_increase_min_account_age_days: Minimum calendar days between the account opened date and the limit decision, days.
  limit_increase_cooldown_days: Minimum calendar days between the previous limit decision date and a new limit decision, days.
  limit_increase_max_step_pct: Largest single increase over the current effective weekly send limit, percent of that limit.
  max_approved_weekly_send_limit: Ceiling that an approved weekly send limit may never exceed, USD.
  limit_increase_review_business_days: Service target for deciding a submitted limit increase request, business days.
  unauthorized_claim_report_days: Calendar days after the disputed payment's transaction date within which an unauthorized-payment claim is accepted, days.
  timely_notice_business_days: Business days after the disputed payment's transaction date within which a report counts as timely notice for the liability cap, business days.
  liability_cap_timely: Maximum customer liability on an approved unauthorized-payment claim reported with timely notice, USD.
  liability_cap_late: Maximum customer liability on an approved unauthorized-payment claim reported after timely notice but inside the report window, USD.
  provisional_credit_business_days: Business days after the claim report date at which provisional credit is posted if the claim is still unresolved, business days.
  new_account_provisional_credit_business_days: Provisional-credit timing that replaces the standard timing when the disputed payment occurred within the new-account period, business days.
  claim_investigation_business_days: Business days after the claim report date by which the investigation must be resolved, business days.
  new_account_investigation_days: Calendar days after the claim report date by which a new-account claim must be resolved, days.
  new_account_period_days: Calendar days after the account opened date during which a disputed payment counts as a new-account transaction, days.
  purchase_protection_claim_days: Calendar days after a goods-and-services payment's transaction date within which a purchase protection claim is accepted, days.
  purchase_protection_max_amount: Maximum reimbursable amount of one purchase protection claim, USD.
  goods_services_fee_rate_pct: Seller fee on a goods-and-services payment received into a personal account, percentage of the payment amount, percent.
  unclaimed_payment_expiry_days: Calendar days after sending after which a payment to a recipient who never claimed it is refunded, days.
  restriction_document_response_days: Calendar days after the limitation was placed within which the customer must submit the requested documents, days.
  restriction_review_business_days: Service target for deciding submitted limitation documents, business days.
  limitation_closure_fund_hold_days: Calendar days the remaining balance of an account closed for risk is held before release to the customer, days.
  recovery_cooling_off_hours: Minimum full hours between the security lock and completion of account recovery, hours.
  recovery_method: Identity re-verification method required before recovery can be approved, one of sms_and_email or government_id_and_selfie.
  post_recovery_send_limit_weekly: Rolling 7-day send cap that replaces the effective weekly send limit during the post-recovery period, USD.
  post_recovery_restriction_days: Calendar days after the recovered date during which the post-recovery send cap applies, days.
  plan_downgrade_timing: When a downgrade to a lower plan takes effect, one of end_of_billing_period or immediate.

