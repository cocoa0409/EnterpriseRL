# Pocketwire Business Profile — a seller profile with its own balance for goods-and-services sales.
category: business
display_name: Pocketwire Business Profile

binding:
  holding_table: business_profiles
  event_tables: [business_transactions, business_claims]
  intake_tables: [business_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {business_balance: business_balance}

lifecycle:
  states: [applied, active, under_review, suspended, closed]
  transitions:
    - {from: applied, to: active, by: system, means: Business verification passed and the profile can accept payments.}
    - {from: applied, to: closed, by: system, means: Business verification declined the profile.}
    - {from: active, to: under_review, by: system, means: A risk review starts; sales continue but payouts pause.}
    - {from: under_review, to: active, by: agent, means: The review is cleared after the review documents were approved.}
    - {from: under_review, to: suspended, by: agent, means: The review failed or the documents were not provided in time; the profile can no longer accept payments.}
    - {from: active, to: closed, by: user, means: The owner closes the profile.}
    - {from: suspended, to: closed, by: agent, means: A suspended profile with a zero balance and no open claim is closed.}

accounts:
  - key: business_balance
    unit: USD
    meaning: The business profile balance — sales in, fees, refunds, chargebacks and payouts out; funds under a hold remain part of it but are not available for payout.

parameter_schema:
  transaction_fee_pct: Seller transaction fee on an in-app or online-checkout sale, percentage of the sale amount, percent.
  transaction_fee_fixed: Fixed part of the seller transaction fee on an in-app or online-checkout sale, USD.
  qr_code_fee_pct: Seller transaction fee on an in-person QR-code sale, percent.
  qr_code_fee_fixed: Fixed part of the fee on an in-person QR-code sale, USD.
  tap_to_pay_fee_pct: Seller transaction fee on a tap-to-pay card-present sale, percent.
  tap_to_pay_fee_fixed: Fixed part of the fee on a tap-to-pay sale, USD.
  invoice_fee_pct: Seller transaction fee on a sale paid through a Pocketwire invoice, percent.
  invoice_fee_fixed: Fixed part of the fee on an invoice sale, USD.
  micropayment_threshold: Sale amount below which the micropayment rate replaces the channel rate, USD.
  micropayment_fee_pct: Transaction fee percentage on a sale below micropayment_threshold, percent.
  micropayment_fee_fixed: Fixed part of the fee on a sale below micropayment_threshold, USD.
  cross_border_fee_pct: Additional fee on a sale from a buyer outside the United States, percent of the sale amount.
  monthly_subscription_fee: Monthly subscription fee for the business tier, USD, charged on the first day of each calendar month.
  monthly_subscription_waiver_volume: Previous-calendar-month net sales volume at or above which that month's subscription fee is waived; 0.00 on tiers without a fee, USD.
  tier_retention_monthly_volume: Previous-calendar-month net sales volume needed to keep the tier at the monthly review, USD.
  tier_grace_months: Consecutive monthly reviews below retention volume tolerated before a downgrade, count.
  rolling_7d_sales_limit: Sales over the rolling 7-day window (the handling date and six preceding days) above which the excess is held and the profile goes under review, USD.
  max_single_sale: Maximum amount of one sale; a larger payment is declined, USD.
  new_seller_period_days: Calendar days after the customer's first business profile opened during which the new-seller hold applies, days.
  new_seller_sales_count_exempt: Completed sales across the customer's business profiles after which the new-seller hold no longer applies, count.
  new_seller_hold_days: Calendar days the funds of a new seller's sale are held from the sale date, days.
  high_ticket_multiple: Multiple of the average sale over the previous 30 days above which a sale is held as high risk, ratio.
  high_risk_hold_days: Calendar days a high-risk sale or a sales-limit excess is held from the sale date, days.
  max_rolling_reserve_pct: Highest rolling reserve percentage the risk team can assign, percent of each sale.
  rolling_reserve_hold_days: Calendar days each reserve holdback is kept from the sale date, days.
  reserve_review_days: Calendar days after a reserve was set before the seller may ask for it to be reduced, days.
  dispute_hold_on_claim: Whether the claimed amount of a sale is held while a buyer claim on it is open, boolean.
  delivery_confirmation_release_days: Calendar days after carrier-confirmed delivery at which a new-seller or high-risk hold on that sale is released early, days.
  instant_payout_fee_pct: Fee on an instant payout to a debit card, percent of the payout.
  instant_payout_fee_min: Minimum instant payout fee, USD.
  instant_payout_fee_max: Maximum instant payout fee, USD.
  daily_payout_limit: Cap on the sum of payouts initiated on one calendar day, Eastern Time, USD.
  instant_payout_max_per_payout: Maximum amount of one instant payout, USD.
  min_payout_amount: Smallest payout amount, USD.
  standard_payout_business_days: Latest arrival of a standard bank payout, business days.
  auto_payout_available: Whether a daily automatic standard payout of the available balance can be switched on, boolean.
  refund_window_days: Calendar days after the sale date within which the seller can refund the buyer through Pocketwire, days.
  fee_refund_pct_portion_on_refund: Whether the percentage part of the transaction fee is returned in proportion when a sale is refunded (the fixed part is never returned), boolean.
  buyer_claim_window_days: Calendar days after the sale date within which a buyer can open a claim against the sale, days.
  seller_response_days: Calendar days after a buyer claim opened within which the seller must respond, days.
  seller_protection_max_per_claim: Maximum claim amount seller protection covers, USD.
  signature_proof_threshold: Sale amount at or above which seller protection on an item-not-received claim needs signature-on-delivery proof rather than tracking alone, USD.
  chargeback_fee: Fee charged on each claim decided for the buyer, USD.
  chargeback_fee_refunded_if_won: Whether a chargeback fee is refunded when the decision is later reversed for the seller, boolean.
  chargeback_ratio_review_threshold_pct: Claims decided for the buyer over the rolling 90 days as a percentage of sales in the same window above which the profile goes under review, percent.
  business_review_response_days: Calendar days after a review started within which the seller must submit review documents, days.
  review_decision_business_days: Service target for deciding submitted review documents, business days.
  negative_balance_recovery_days: Calendar days a business balance may stay negative before the shortfall is collected from the owner's personal balance, days.

