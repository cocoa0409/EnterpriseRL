events:
  - type: business_open
    target: business_profiles
    mutation: create
    meaning: The owner of a personal account opens a business profile.
    grain: One row per business profile.
    fields:
      customer_id: The owner.
      wallet_id: The owner's personal account.
      variant_name: Always Pocketwire Business Starter at opening.
      business_name: Registered or trading name.
      entity_type: Legal form of the business.
      opened_date: Opening date.
      business_balance: Opening balance, always 0.00.
      tier_review_date: First day of the next calendar month.
      below_retention_months: 0 at opening.
      review_reason: none at opening.
    triggers: []
  - type: business_activate
    target: business_profiles
    mutation: {transition: {from: applied, to: active}}
    meaning: Business verification passes.
    grain: One row per business profile.
    fields:
      status: Becomes active.
    triggers: []
  - type: business_decline
    target: business_profiles
    mutation: {transition: {from: applied, to: closed}}
    meaning: Business verification declines the profile.
    grain: One row per business profile.
    fields:
      status: Becomes closed.
      closed_date: Decline date.
    triggers: []
  - type: business_start_review
    target: business_profiles
    mutation: {transition: {from: active, to: under_review}}
    meaning: A risk review of the profile starts.
    grain: One row per business profile.
    fields:
      status: Becomes under_review.
      review_reason: Why the review started.
      review_started_at: Moment the review started.
    triggers: []
  - type: business_clear_review
    target: business_profiles
    mutation: {transition: {from: under_review, to: active}}
    meaning: The review is cleared.
    grain: One row per business profile.
    fields:
      status: Returns to active.
    triggers: []
  - type: business_suspend
    target: business_profiles
    mutation: {transition: {from: under_review, to: suspended}}
    meaning: The profile is suspended after a failed or unanswered review.
    grain: One row per business profile.
    fields:
      status: Becomes suspended.
    triggers: []
  - type: business_close
    target: business_profiles
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}]}
    meaning: The profile is closed by the owner or, after suspension, by Pocketwire.
    grain: One row per business profile.
    fields:
      status: Becomes closed.
      closed_date: Closure date.
    triggers: []
  - type: business_tier_change
    target: business_profiles
    mutation: update
    meaning: The monthly tier review moves the profile up or down, or records another month below retention.
    grain: One row per business profile.
    fields:
      variant_name: Tier after the review.
      tier_review_date: Next review date.
      below_retention_months: Consecutive reviews below retention volume after this review.
    triggers: []
  - type: business_reserve_set
    target: business_profiles
    mutation: update
    meaning: The risk team assigns, changes or removes a rolling reserve on the profile.
    grain: One row per business profile.
    fields:
      reserve_rate_override_pct: Reserve percentage held back from each sale; 0.00 when the reserve is removed.
      reserve_set_date: Date of this reserve decision.
    triggers: []
  - type: business_sale
    target: business_transactions
    meaning: A buyer pays the business for goods or services.
    grain: One row per sale.
    distinguish_by: [txn_reference]
    fields:
      txn_reference: The payment reference shown in the app.
      txn_date: Sale date, Eastern Time.
      amount: Gross sale amount.
      buyer_username: The buyer's username or checkout email.
      sale_channel: in_app, online_checkout, qr_code, tap_to_pay or invoice.
      buyer_region: domestic or international.
    account: business_balance
    direction: in
    triggers:
      - event: business:business_fee
        map: {fee_type: transaction_fee, source_txn_id: business_txn_id, txn_date: txn_date}
      - event: business:business_fee
        when: {buyer_region: international}
        map: {fee_type: cross_border_fee, source_txn_id: business_txn_id, txn_date: txn_date}
  - type: business_fee
    target: business_transactions
    meaning: A business fee is charged — transaction, cross-border, instant payout, chargeback or subscription.
    grain: One row per fee.
    distinguish_by: [fee_type, source_txn_id, billing_period]
    fields:
      fee_type: Which fee.
      source_txn_id: The sale, payout or chargeback the fee belongs to; empty on subscription fees.
      billing_period: Month a subscription fee covers (YYYY-MM); empty on other fees.
      txn_date: Date charged.
      amount: Fee amount (0.00 when a subscription is waived is never booked; the row is simply absent).
    account: business_balance
    direction: out
    triggers: []
  - type: business_fee_credit
    target: business_transactions
    meaning: A fee, or part of it, is credited back — the percentage part of a transaction fee on a refund, a refunded chargeback fee, or the fee of a returned instant payout.
    grain: One row per fee credited.
    distinguish_by: [source_txn_id, txn_date]
    fields:
      source_txn_id: The fee row being credited.
      fee_type: Type of the credited fee.
      txn_date: Credit date.
      amount: Credited amount.
    account: business_balance
    direction: in
    triggers: []
  - type: business_refund
    target: business_transactions
    meaning: The seller refunds a buyer in full or in part.
    grain: One row per refund.
    distinguish_by: [source_txn_id, txn_reference]
    fields:
      source_txn_id: The sale being refunded.
      txn_reference: The refund reference shown in the app.
      txn_date: Refund date.
      amount: Amount refunded.
    account: business_balance
    direction: out
    triggers: []
  - type: business_chargeback
    target: business_transactions
    meaning: A buyer claim is decided for the buyer and the claimed amount is taken from the business balance.
    grain: One row per claim decided for the buyer.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The sale the claim was on.
      txn_date: Date of the debit.
      amount: Amount debited, equal to the claim amount.
    account: business_balance
    direction: out
    triggers:
      - event: business:business_fee
        map: {fee_type: chargeback_fee, source_txn_id: business_txn_id, txn_date: txn_date}
  - type: business_chargeback_reversal
    target: business_transactions
    meaning: A decision for the buyer is reversed for the seller on appeal and the amount returned.
    grain: One row per reversed chargeback.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The chargeback row reversed.
      txn_date: Date returned.
      amount: Amount returned, equal to the chargeback.
    account: business_balance
    direction: in
    triggers: []
  - type: business_payout
    target: business_transactions
    meaning: The seller moves available balance to a linked bank account, a debit card or their personal balance.
    grain: One row per payout.
    distinguish_by: [txn_reference]
    fields:
      txn_reference: The payout reference shown in the app.
      txn_date: Payout date, Eastern Time.
      amount: Amount paid out.
      payout_method: standard_bank, instant_card or personal_balance.
      destination_last4: Last four digits of the bank account or card; empty for personal_balance.
    account: business_balance
    direction: out
    triggers:
      - event: business:business_fee
        when: {payout_method: instant_card}
        map: {fee_type: instant_payout_fee, source_txn_id: business_txn_id, txn_date: txn_date}
      - event: wallet:wallet_internal_credit
        when: {payout_method: personal_balance}
        map: {source_product: business, source_txn_id: business_txn_id, txn_date: txn_date, amount: amount}
  - type: business_payout_return
    target: business_transactions
    meaning: A bank or card payout is returned and credited back.
    grain: One row per returned payout.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The payout returned.
      txn_date: Return date.
      amount: Returned amount.
      payout_method: Method of the returned payout.
    account: business_balance
    direction: in
    triggers:
      - event: business:business_fee_credit
        when: {payout_method: instant_card}
        map: {fee_type: instant_payout_fee, txn_date: txn_date}
  - type: business_negative_balance_recovery
    target: business_transactions
    meaning: A business balance that stayed negative too long is brought back to zero from the owner's personal balance.
    grain: One row per recovery.
    distinguish_by: [txn_date]
    fields:
      txn_date: Recovery date.
      amount: Amount recovered.
    account: business_balance
    direction: in
    triggers:
      - event: wallet:wallet_internal_debit
        map: {source_product: business, source_txn_id: business_txn_id, txn_date: txn_date, amount: amount}
  - type: business_payment_hold
    target: business_transactions
    meaning: Funds of a sale are placed on hold — new-seller hold, high-risk hold, rolling reserve or dispute hold.
    grain: One row per hold on one sale.
    distinguish_by: [source_txn_id, hold_type]
    fields:
      source_txn_id: The sale whose funds are held.
      hold_type: new_seller_hold, high_risk_hold, rolling_reserve or dispute_hold.
      txn_date: Date the hold was placed.
      amount: Amount held.
      release_due_date: Date the hold is due to be released; empty on a dispute hold, which lasts until the claim closes.
    triggers: []
  - type: business_hold_release
    target: business_transactions
    meaning: A hold is released and its funds become available.
    grain: One row per released hold.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The hold row released.
      txn_date: Release date.
      amount: Amount released, equal to the hold.
    triggers: []
  - type: business_delivery_confirmed
    target: business_transactions
    meaning: The carrier confirms delivery of the item of a sale through the tracking the seller added.
    grain: One row per sale delivered.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The sale delivered.
      txn_date: Delivery date reported by the carrier.
      tracking_number: Carrier tracking number.
    triggers: []
  - type: business_claim_opened
    target: business_claims
    meaning: A buyer opens a claim against a sale.
    grain: One row per claim.
    distinguish_by: [sale_txn_id]
    fields:
      sale_txn_id: The sale claimed against.
      claim_reason: item_not_received, not_as_described or unauthorized_buyer.
      opened_date: Date the claim opened.
      claim_amount: Amount claimed.
      outcome: Always open.
    triggers:
      - event: business:business_payment_hold
        map: {hold_type: dispute_hold, source_txn_id: sale_txn_id, txn_date: opened_date, amount: claim_amount}
  - type: business_seller_response
    target: business_claims
    meaning: The seller responds to an open buyer claim.
    grain: One row per claim responded to.
    distinguish_by: [sale_txn_id]
    fields:
      sale_txn_id: The sale claimed against.
      response_type: tracking_provided, signature_proof_provided, refund_issued or claim_accepted.
      response_date: Date of the response.
      tracking_number: Carrier tracking number when tracking or signature proof is provided.
    triggers:
      - event: business:business_refund
        when: {response_type: [refund_issued, claim_accepted]}
        map: {source_txn_id: sale_txn_id, txn_date: response_date}
  - type: business_claim_closed
    target: business_claims
    meaning: A buyer claim is decided or withdrawn.
    grain: One row per claim closed.
    distinguish_by: [sale_txn_id]
    fields:
      sale_txn_id: The sale claimed against.
      claim_reason: As opened.
      claim_amount: As opened.
      outcome: seller_won, buyer_won or withdrawn_by_buyer.
      outcome_date: Date of the outcome.
    triggers:
      - event: business:business_chargeback
        when: {outcome: buyer_won}
        map: {source_txn_id: sale_txn_id, txn_date: outcome_date, amount: claim_amount}
      - event: business:business_hold_release
        map: {txn_date: outcome_date, amount: claim_amount}

measures:
  - id: business_msr_sales_7d
    window: Rolling 7 calendar days — the handling date and the six preceding calendar days, Eastern Time.
    measure: Sum of amount over business_sale rows of the profile with txn_date in the window.
  - id: business_msr_prev_month_volume
    window: The calendar month before the month containing the handling date.
    measure: Sum of amount over business_sale rows of the profile with txn_date in the window, less amount over business_refund and business_chargeback rows with txn_date in the window.
  - id: business_msr_active_holds
    window: Current state on the handling date.
    measure: Sum of amount over business_payment_hold rows of the profile not matched by a business_hold_release row pointing to them.
  - id: business_msr_payouts_today
    window: The handling calendar day, Eastern Time.
    measure: Sum of amount over business_payout rows of the profile with txn_date equal to the handling date, excluding payouts returned by a business_payout_return.
  - id: business_msr_completed_sales
    window: Whole history of all of the customer's business profiles up to the handling date.
    measure: Count of business_sale rows across the customer's business profiles that carry no business_refund covering the full amount and no business_chargeback.
  - id: business_msr_avg_sale_30d
    window: The 30 calendar days before the sale date, not including it.
    measure: Average amount over business_sale rows of the profile with txn_date in the window; 0.00 when there are none.
  - id: business_msr_buyer_won_ratio_90d
    window: Rolling 90 calendar days ending on the handling date.
    measure: Count of business_chargeback rows across the customer's business profiles in the window, divided by the count of business_sale rows across them in the window, as a percentage.

policies:
  - id: business_agg_multi_holding
    subject: [business_open]
    rule: >-
      A customer may hold up to max_per_customer business profiles that are not closed, each with its own name, balance and tier.
      A further profile is opened only if the customer holds fewer than max_per_customer business profiles whose status is anything other than closed.
    eligibility:
      - id: profile_cap
        applies_to: [business_open]
        kind: dedup
        condition: "A further profile is opened only if the customer holds fewer than max_per_customer business profiles whose status is anything other than closed."
        evidence_fields: [business_profiles.customer_id, business_profiles.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_profiles.customer_id]
          action_bindings:
            business_profiles.customer_id: customer_id
        dedup_contract:
          table: business_profiles
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active, under_review, suspended]}
          distinct_fields: [business_name]
    params:
      max_per_customer: 3

  - id: business_agg_seller_history
    subject: [business_payment_hold, business_start_review, business_open]
    rule: >-
      Seller history is judged across all of the customer's business profiles together: the new-seller period runs from the opened_date of the customer's earliest business profile, including closed ones, the completed-sales count (business_msr_completed_sales) adds the sales of every profile, and the buyer-won ratio (business_msr_buyer_won_ratio_90d) is computed across all of them.
      Opening another profile therefore never restarts new-seller status, and a profile whose owner has a suspended profile cannot be opened while that suspension stands.
      Each profile's tier, balance, holds and payouts remain its own; volumes are never added across profiles for tier purposes.
    eligibility: []
    measures: [business_msr_completed_sales, business_msr_buyer_won_ratio_90d]

  - id: business_opening
    subject: [business_open, business_activate, business_decline]
    rule: >-
      A business profile is opened only by a customer whose personal account is active on Pocketwire Core or a higher plan with kyc_status verified; a Pocketwire Lite account, or a personal account that is limited, locked or closure_pending, cannot open one.
      Every profile opens on Pocketwire Business Starter in applied status, and business verification (entity documents and, for anything other than a sole proprietor, the entity's tax identification) sets it to active or closed; a representative cannot activate a profile.
    eligibility:
      - id: owner_account_ok
        applies_to: [business_open]
        kind: authorization
        condition: "A business profile is opened only by a customer whose personal account is active on Pocketwire Core or a higher plan with kyc_status verified"
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.status, wallet_accounts.variant_name, wallet_accounts.kyc_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id

  - id: business_transaction_fees
    subject: [business_sale, business_fee]
    rule: >-
      Every sale books a transaction_fee on the sale date at the rate of its sale_channel — transaction_fee_pct and transaction_fee_fixed for in_app and online_checkout, qr_code_fee_pct and qr_code_fee_fixed for qr_code, tap_to_pay_fee_pct and tap_to_pay_fee_fixed for tap_to_pay, invoice_fee_pct and invoice_fee_fixed for invoice — except that a sale below micropayment_threshold uses micropayment_fee_pct and micropayment_fee_fixed whatever its channel; the micropayment rate and a channel rate never apply together.
      The fee is the sale amount times the percentage, rounded to the cent (half up), plus the fixed part.
      A sale from an international buyer also books a cross_border_fee of the sale amount times cross_border_fee_pct, rounded to the cent (half up).
      The tier whose rates apply is the tier on the sale date; a later tier change never re-prices earlier sales.
    eligibility: []
    formula:
      channel_transaction_fee: "round(amount * transaction_fee_pct / 100, 2) + transaction_fee_fixed"
      micropayment_fee: "round(amount * micropayment_fee_pct / 100, 2) + micropayment_fee_fixed"
      cross_border_fee: "round(amount * cross_border_fee_pct / 100, 2)"
    params:
      per_tier:
        Pocketwire Business Starter: {transaction_fee_pct: =transaction_fee_pct, transaction_fee_fixed: =transaction_fee_fixed, qr_code_fee_pct: =qr_code_fee_pct, tap_to_pay_fee_pct: =tap_to_pay_fee_pct, invoice_fee_pct: =invoice_fee_pct, micropayment_fee_pct: =micropayment_fee_pct, cross_border_fee_pct: =cross_border_fee_pct}
        Pocketwire Business Essentials: {transaction_fee_pct: =transaction_fee_pct, transaction_fee_fixed: =transaction_fee_fixed, qr_code_fee_pct: =qr_code_fee_pct, tap_to_pay_fee_pct: =tap_to_pay_fee_pct, invoice_fee_pct: =invoice_fee_pct, micropayment_fee_pct: =micropayment_fee_pct, cross_border_fee_pct: =cross_border_fee_pct}
        Pocketwire Business Growth: {transaction_fee_pct: =transaction_fee_pct, transaction_fee_fixed: =transaction_fee_fixed, qr_code_fee_pct: =qr_code_fee_pct, tap_to_pay_fee_pct: =tap_to_pay_fee_pct, invoice_fee_pct: =invoice_fee_pct, micropayment_fee_pct: =micropayment_fee_pct, cross_border_fee_pct: =cross_border_fee_pct}
        Pocketwire Business Pro: {transaction_fee_pct: =transaction_fee_pct, transaction_fee_fixed: =transaction_fee_fixed, qr_code_fee_pct: =qr_code_fee_pct, tap_to_pay_fee_pct: =tap_to_pay_fee_pct, invoice_fee_pct: =invoice_fee_pct, micropayment_fee_pct: =micropayment_fee_pct, cross_border_fee_pct: =cross_border_fee_pct}
        Pocketwire Business Premier: {transaction_fee_pct: =transaction_fee_pct, transaction_fee_fixed: =transaction_fee_fixed, qr_code_fee_pct: =qr_code_fee_pct, tap_to_pay_fee_pct: =tap_to_pay_fee_pct, invoice_fee_pct: =invoice_fee_pct, micropayment_fee_pct: =micropayment_fee_pct, cross_border_fee_pct: =cross_border_fee_pct}
        Pocketwire Business Enterprise: {transaction_fee_pct: =transaction_fee_pct, transaction_fee_fixed: =transaction_fee_fixed, qr_code_fee_pct: =qr_code_fee_pct, tap_to_pay_fee_pct: =tap_to_pay_fee_pct, invoice_fee_pct: =invoice_fee_pct, micropayment_fee_pct: =micropayment_fee_pct, cross_border_fee_pct: =cross_border_fee_pct}

  - id: business_sales_limits
    subject: [business_sale, business_start_review, business_payment_hold]
    rule: >-
      A sale can be accepted only while the profile status is active or under_review.
      A payment above max_single_sale is declined to the buyer and not booked.
      When a sale takes the rolling 7-day sales (business_msr_sales_7d) above rolling_7d_sales_limit, the sale is still accepted, the part above the limit is held as a high_risk_hold released high_risk_hold_days calendar days after the sale date, and a review starts with review_reason sales_limit_exceeded unless one is already under way.
      A review also starts with review_reason chargeback_ratio when the buyer-won ratio across the customer's profiles exceeds chargeback_ratio_review_threshold_pct.
    eligibility:
      - id: sale_status
        applies_to: [business_sale]
        kind: state
        condition: "A sale can be accepted only while the profile status is active or under_review."
        evidence_fields: [business_profiles.business_id, business_profiles.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_profiles.business_id]
          action_bindings:
            business_profiles.business_id: business_id
        state_contract:
          field: business_profiles.status
          allowed: [active, under_review]
    measures: [business_msr_sales_7d]
    formula:
      held_excess: "max(0, business_msr_sales_7d + amount - rolling_7d_sales_limit)"

  - id: business_holds
    subject: [business_payment_hold, business_hold_release]
    rule: >-
      A sale made during the new-seller period — within new_seller_period_days calendar days after the customer's earliest business profile opened and while business_msr_completed_sales is below new_seller_sales_count_exempt — is held in full as a new_seller_hold with a release_due_date new_seller_hold_days calendar days after the sale date.
      A sale above high_ticket_multiple times the profile's average sale over the previous 30 days (business_msr_avg_sale_30d), when that average is above 0.00, is held in full as a high_risk_hold with a release_due_date high_risk_hold_days calendar days after the sale date.
      A new_seller_hold and a high_risk_hold never stack on one sale: only the one with the later release_due_date is placed.
      A rolling reserve holdback and a dispute hold are placed independently of them and of each other, under business_rolling_reserve and on each opened buyer claim respectively.
      A hold is released only once its release is due: the release is recorded no earlier than the hold's recorded release due date, or, for a new_seller_hold or high_risk_hold, delivery_confirmation_release_days calendar days after the carrier-confirmed delivery date of that sale when that comes first.
      Release timing is counted in calendar days, a release on the due date itself qualifies, and a dispute hold is released only when its claim closes, whatever the outcome.
      A representative cannot release a hold early for any other reason, including the seller's statement that the item was delivered without carrier confirmation.
    eligibility:
      - id: release_due
        applies_to: [business_hold_release]
        kind: time
        condition: "the release is recorded no earlier than the hold's recorded release due date, or, for a new_seller_hold or high_risk_hold, delivery_confirmation_release_days calendar days after the carrier-confirmed delivery date of that sale when that comes first"
        evidence_fields: [business_transactions.business_txn_id, business_transactions.release_due_date, business_transactions.hold_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_transactions.business_txn_id]
          action_bindings:
            business_transactions.business_txn_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the hold's recorded release due date
          anchor_source: business_transactions.release_due_date
          relation: not_before
          duration_source: params.release_offset_days
          unit: calendar_days
          counting_rule: "Release timing is counted in calendar days, a release on the due date itself qualifies, and a dispute hold is released only when its claim closes, whatever the outcome."
          boundary: inclusive
      - id: release_once
        applies_to: [business_hold_release]
        kind: dedup
        condition: "A hold is released only once its release is due"
        evidence_fields: [business_transactions.source_txn_id, business_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_transactions.source_txn_id]
          action_bindings:
            business_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: business_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [business_hold_release]}
          distinct_fields: []
    measures: [business_msr_avg_sale_30d, business_msr_completed_sales]
    params:
      release_offset_days: 0
      per_tier:
        Pocketwire Business Starter: {new_seller_hold_days: =new_seller_hold_days, high_risk_hold_days: =high_risk_hold_days, delivery_confirmation_release_days: =delivery_confirmation_release_days, high_ticket_multiple: =high_ticket_multiple}
        Pocketwire Business Essentials: {new_seller_hold_days: =new_seller_hold_days, high_risk_hold_days: =high_risk_hold_days, delivery_confirmation_release_days: =delivery_confirmation_release_days, high_ticket_multiple: =high_ticket_multiple}
        Pocketwire Business Growth: {new_seller_hold_days: =new_seller_hold_days, high_risk_hold_days: =high_risk_hold_days, delivery_confirmation_release_days: =delivery_confirmation_release_days, high_ticket_multiple: =high_ticket_multiple}
        Pocketwire Business Pro: {new_seller_hold_days: =new_seller_hold_days, high_risk_hold_days: =high_risk_hold_days, delivery_confirmation_release_days: =delivery_confirmation_release_days, high_ticket_multiple: =high_ticket_multiple}
        Pocketwire Business Premier: {new_seller_hold_days: =new_seller_hold_days, high_risk_hold_days: =high_risk_hold_days, delivery_confirmation_release_days: =delivery_confirmation_release_days, high_ticket_multiple: =high_ticket_multiple}
        Pocketwire Business Enterprise: {new_seller_hold_days: =new_seller_hold_days, high_risk_hold_days: =high_risk_hold_days, delivery_confirmation_release_days: =delivery_confirmation_release_days, high_ticket_multiple: =high_ticket_multiple}

  - id: business_rolling_reserve
    subject: [business_reserve_set, business_payment_hold, business_hold_release]
    rule: >-
      The risk team may assign a rolling reserve by setting reserve_rate_override_pct, never above the tier's max_rolling_reserve_pct; while it is above 0.00, each new sale books a rolling_reserve hold of the sale amount times that percentage, rounded to the cent (half up), with a release_due_date rolling_reserve_hold_days calendar days after the sale date.
      The seller may ask for the reserve to be reduced or removed with a reserve_reduction request once reserve_review_days calendar days have passed since reserve_set_date; the risk team decides it, and an approved reduction applies only to sales made after the new reserve_set_date — holdbacks already placed keep their release dates.
      A representative cannot change or waive a reserve, and a reserve is never set on a customer's request.
    eligibility: []
    formula:
      reserve_holdback: "round(amount * reserve_rate_override_pct / 100, 2)"
    params:
      per_tier:
        Pocketwire Business Starter: {max_rolling_reserve_pct: =max_rolling_reserve_pct, rolling_reserve_hold_days: =rolling_reserve_hold_days, reserve_review_days: =reserve_review_days}
        Pocketwire Business Essentials: {max_rolling_reserve_pct: =max_rolling_reserve_pct, rolling_reserve_hold_days: =rolling_reserve_hold_days, reserve_review_days: =reserve_review_days}
        Pocketwire Business Growth: {max_rolling_reserve_pct: =max_rolling_reserve_pct, rolling_reserve_hold_days: =rolling_reserve_hold_days, reserve_review_days: =reserve_review_days}
        Pocketwire Business Pro: {max_rolling_reserve_pct: =max_rolling_reserve_pct, rolling_reserve_hold_days: =rolling_reserve_hold_days, reserve_review_days: =reserve_review_days}
        Pocketwire Business Premier: {max_rolling_reserve_pct: =max_rolling_reserve_pct, rolling_reserve_hold_days: =rolling_reserve_hold_days, reserve_review_days: =reserve_review_days}
        Pocketwire Business Enterprise: {max_rolling_reserve_pct: =max_rolling_reserve_pct, rolling_reserve_hold_days: =rolling_reserve_hold_days, reserve_review_days: =reserve_review_days}

  - id: business_payouts
    subject: [business_payout, business_fee, business_payout_return, business_fee_credit]
    rule: >-
      A payout can be made only while the profile status is active; payouts pause while the profile is under_review or suspended.
      A payout can never exceed the available balance, which is business_balance less the funds under unreleased holds (business_msr_active_holds), must be at least min_payout_amount, and together with the day's earlier payouts (business_msr_payouts_today) may not exceed daily_payout_limit; an instant_card payout may not exceed instant_payout_max_per_payout.
      A standard_bank payout is free and arrives within standard_payout_business_days business days; a payout to the owner's personal balance is free and immediate.
      An instant_card payout books an instant_payout_fee of the payout amount times instant_payout_fee_pct, rounded to the cent (half up), raised to instant_payout_fee_min and lowered to instant_payout_fee_max; when an instant payout is returned, its fee is credited back in full.
      Where auto_payout_available is true the owner can switch on a daily automatic standard_bank payout of the whole available balance, booked like any other payout.
      A payout that breaches a limit is declined in full and not booked.
    eligibility:
      - id: payout_status
        applies_to: [business_payout]
        kind: state
        condition: "A payout can be made only while the profile status is active; payouts pause while the profile is under_review or suspended."
        evidence_fields: [business_profiles.business_id, business_profiles.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_profiles.business_id]
          action_bindings:
            business_profiles.business_id: business_id
        state_contract:
          field: business_profiles.status
          allowed: [active]
    measures: [business_msr_active_holds, business_msr_payouts_today]
    formula:
      available_balance: "business_balance - business_msr_active_holds"
      instant_payout_fee: "min(max(round(amount * instant_payout_fee_pct / 100, 2), instant_payout_fee_min), instant_payout_fee_max)"

  - id: business_refunds
    subject: [business_refund, business_fee_credit]
    rule: >-
      A seller refund can be made while the profile status is active, under_review or suspended, so that a suspended seller can still make buyers whole.
      A refund is made only within the refund window: the refund is made no later than refund_window_days calendar days after the sale date.
      The refund window is counted in calendar days from the sale date, the day after the sale being day 1, and a refund on the last day qualifies.
      The refunds on one sale together may not exceed its amount, and a sale on which a claim was decided for the buyer can no longer be refunded.
      On tiers whose fee_refund_pct_portion_on_refund is true, the percentage part of the sale's transaction fee is credited back in proportion to the refunded share of the sale, rounded to the cent (half up); the fixed part and any cross_border_fee are never credited back, and on other tiers no fee is credited back.
      A refund can be taken from funds on hold for that same sale, and it can take the business balance negative.
    eligibility:
      - id: refund_status
        applies_to: [business_refund]
        kind: state
        condition: "A seller refund can be made while the profile status is active, under_review or suspended, so that a suspended seller can still make buyers whole."
        evidence_fields: [business_profiles.business_id, business_profiles.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_profiles.business_id]
          action_bindings:
            business_profiles.business_id: business_id
        state_contract:
          field: business_profiles.status
          allowed: [active, under_review, suspended]
      - id: refund_window
        applies_to: [business_refund]
        kind: time
        condition: "the refund is made no later than refund_window_days calendar days after the sale date"
        evidence_fields: [business_transactions.business_txn_id, business_transactions.txn_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_transactions.business_txn_id]
          action_bindings:
            business_transactions.business_txn_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the sale date
          anchor_source: business_transactions.txn_date
          relation: not_after
          duration_source: variants.refund_window_days
          unit: calendar_days
          counting_rule: "The refund window is counted in calendar days from the sale date, the day after the sale being day 1, and a refund on the last day qualifies."
          boundary: inclusive

  - id: business_buyer_claims
    subject: [business_claim_opened, business_seller_response, business_claim_closed, business_chargeback, business_chargeback_reversal, business_fee]
    rule: >-
      A buyer can open one claim per sale within buyer_claim_window_days calendar days after the sale date; on tiers whose dispute_hold_on_claim is true the claimed amount is held on the business balance as a dispute_hold while the claim is open.
      The seller responds by providing tracking, providing signature-on-delivery proof, refunding, or accepting the claim, and the response counts only within the response window: the response is recorded no later than seller_response_days calendar days after the claim opened date.
      The response window is counted in calendar days from the claim opened date, the day after opening being day 1, and a response on the last day counts.
      A claim with no response in time is decided for the buyer.
      Seller protection decides the claim for the seller when the claim is item_not_received, the seller responded in time with tracking showing delivery to the buyer's address — or signature proof when the sale amount is at or above signature_proof_threshold — and the claim amount is within seller_protection_max_per_claim; an unauthorized_buyer claim is decided for the seller when the sale shows delivery confirmed by the carrier; not_as_described claims are decided by the claims team on the evidence and are never covered by seller protection.
      A claim decided for the buyer debits the claim amount as a business_chargeback and books a chargeback_fee; on tiers whose chargeback_fee_refunded_if_won is true, the fee is credited back if the decision is later reversed for the seller.
      Refunding or accepting settles the claim for the buyer without a chargeback or chargeback fee.
    eligibility:
      - id: response_window
        applies_to: [business_seller_response]
        kind: time
        condition: "the response is recorded no later than seller_response_days calendar days after the claim opened date"
        evidence_fields: [business_claims.sale_txn_id, business_claims.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_claims.sale_txn_id]
          action_bindings:
            business_claims.sale_txn_id: sale_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the claim opened date
          anchor_source: business_claims.opened_date
          relation: not_after
          duration_source: variants.seller_response_days
          unit: calendar_days
          counting_rule: "The response window is counted in calendar days from the claim opened date, the day after opening being day 1, and a response on the last day counts."
          boundary: inclusive
    params:
      per_tier:
        Pocketwire Business Starter: {seller_response_days: =seller_response_days, seller_protection_max_per_claim: =seller_protection_max_per_claim, chargeback_fee: =chargeback_fee}
        Pocketwire Business Essentials: {seller_response_days: =seller_response_days, seller_protection_max_per_claim: =seller_protection_max_per_claim, chargeback_fee: =chargeback_fee}
        Pocketwire Business Growth: {seller_response_days: =seller_response_days, seller_protection_max_per_claim: =seller_protection_max_per_claim, chargeback_fee: =chargeback_fee}
        Pocketwire Business Pro: {seller_response_days: =seller_response_days, seller_protection_max_per_claim: =seller_protection_max_per_claim, chargeback_fee: =chargeback_fee}
        Pocketwire Business Premier: {seller_response_days: =seller_response_days, seller_protection_max_per_claim: =seller_protection_max_per_claim, chargeback_fee: =chargeback_fee}
        Pocketwire Business Enterprise: {seller_response_days: =seller_response_days, seller_protection_max_per_claim: =seller_protection_max_per_claim, chargeback_fee: =chargeback_fee}

  - id: business_delivery_tracking
    subject: [business_delivery_confirmed]
    rule: >-
      Delivery is confirmed only by the carrier through tracking the seller added to the sale; a delivery date stated by the seller or the buyer is never recorded as a confirmation.
      One confirmation is recorded per sale, and it is the evidence both for early release of a new_seller_hold or high_risk_hold and for seller protection on item_not_received and unauthorized_buyer claims.
    eligibility: []

  - id: business_review_and_suspension
    subject: [business_start_review, business_clear_review, business_suspend, business_close]
    rule: >-
      Reviews are started by the risk system for the reasons in business_sales_limits and for identity or prohibited-goods reports, and pause payouts while sales continue.
      A review is cleared only on a review_documents request whose request_status is approved by the review team.
      The review team decides submitted review documents within review_decision_business_days business days, and a representative cannot shorten or pre-empt that decision.
      A profile is suspended when the review team declined the review_documents request, or when no review_documents request was submitted and the response window has passed: the suspension is recorded later than business_review_response_days calendar days after the review start time.
      The response window is counted in calendar days from the review start time, the day after the review started being day 1, and the window is still open on its last day.
      A suspended profile's balance stays until open claims close and holds are released; it is then paid out to the owner's personal balance by a support representative and the profile is closed.
      The owner may close an active profile only when its business balance is 0.00, no buyer claim is open and no hold is unreleased; closing is the owner's own decision, confirmed in the app.
    eligibility:
      - id: review_documents_approved
        applies_to: [business_clear_review]
        kind: authorization
        condition: "A review is cleared only on a review_documents request whose request_status is approved by the review team."
        evidence_fields: [business_requests.request_id, business_requests.request_type, business_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_requests.request_id]
          action_bindings:
            business_requests.request_id: request_id
      - id: review_window_passed
        applies_to: [business_suspend]
        kind: time
        condition: "the suspension is recorded later than business_review_response_days calendar days after the review start time"
        evidence_fields: [business_profiles.business_id, business_profiles.review_started_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_profiles.business_id]
          action_bindings:
            business_profiles.business_id: business_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the review start time
          anchor_source: business_profiles.review_started_at
          relation: not_before
          duration_source: variants.business_review_response_days
          unit: calendar_days
          counting_rule: "The response window is counted in calendar days from the review start time, the day after the review started being day 1, and the window is still open on its last day."
          boundary: exclusive

  - id: business_tier_review
    subject: [business_tier_change]
    rule: >-
      Tiers are reviewed on the first day of each calendar month against the previous month's net sales volume (business_msr_prev_month_volume).
      The profile moves up to the highest tier whose entry_gate min_prev_month_volume that volume meets — Pocketwire Business Enterprise additionally needs the profile opened at least entry_gate min_profile_age_months calendar months before the review.
      When the volume is below the current tier's tier_retention_monthly_volume, below_retention_months goes up by one, and the profile drops one tier only once below_retention_months exceeds tier_grace_months, the count then resetting to 0; a review at or above retention resets the count without a change.
      A tier is never changed between reviews or at the seller's request.
    eligibility: []
    measures: [business_msr_prev_month_volume]
    params:
      per_tier:
        Pocketwire Business Starter: {tier_retention_monthly_volume: =tier_retention_monthly_volume, tier_grace_months: =tier_grace_months}
        Pocketwire Business Essentials: {tier_retention_monthly_volume: =tier_retention_monthly_volume, tier_grace_months: =tier_grace_months}
        Pocketwire Business Growth: {tier_retention_monthly_volume: =tier_retention_monthly_volume, tier_grace_months: =tier_grace_months}
        Pocketwire Business Pro: {tier_retention_monthly_volume: =tier_retention_monthly_volume, tier_grace_months: =tier_grace_months}
        Pocketwire Business Premier: {tier_retention_monthly_volume: =tier_retention_monthly_volume, tier_grace_months: =tier_grace_months}
        Pocketwire Business Enterprise: {tier_retention_monthly_volume: =tier_retention_monthly_volume, tier_grace_months: =tier_grace_months}

  - id: business_subscription_fee
    subject: [business_fee]
    rule: >-
      On tiers with a monthly_subscription_fee above 0.00, the fee is charged on the first day of each calendar month as a subscription_fee whose billing_period is that month, at the tier held after that day's review.
      The fee is waived — no row is booked — when the previous calendar month's net sales volume is at or above monthly_subscription_waiver_volume.
      Subscription fees are never prorated or refunded, including when the profile closes or is suspended during the month.
    eligibility: []
    measures: [business_msr_prev_month_volume]

  - id: business_negative_balance
    subject: [business_negative_balance_recovery]
    rule: >-
      A business balance can go negative through refunds, chargebacks and fees.
      When it has stayed negative for longer than negative_balance_recovery_days calendar days, counted from the first day it went negative, the shortfall is recovered in one step from the owner's personal balance, as far as that balance allows, as an internal transfer; any rest stays owed on the business balance.
      Sales received while the balance is negative reduce the shortfall first.
    eligibility: []

extended_policies:
  - id: business_ext_subscription_month_charge
    base_policy_refs: [business_subscription_fee, business_transaction_fees, business_payouts, business_buyer_claims]
    overwrite:
      - base_policy: business_subscription_fee
        superseded_clause: >-
          On tiers with a monthly_subscription_fee above 0.00, the fee is charged on the first day of each calendar month as a subscription_fee whose billing_period is that month, at the tier held after that day's review.
        replaced_by: >-
          On a tier whose monthly_subscription_fee is above 0.00, the month's subscription_fee entry is booked on the first day of the calendar month for that month's billing period, at the amount worked out below for the tier held after that day's review, in a month the waiver rule does not waive.
    trigger: state_due
    subject: [business_fee]
    computes: fee_amount
    target_tool: book_subscription_fee_2324701e
    params:
      bundle_top_pct: 30
      bundle_mid_pct: 20
      relief_high_share: 0.8
      relief_low_share: 0.5
      relief_high_pct: 30
      relief_low_pct: 15
      relief_window_long_months: 24
      relief_window_mid_months: 12
      relief_claims_months: 3
      relief_average_months: 3
      tenure_long_months: 36
      tenure_mid_months: 12
      tenure_long_credit: 3.0
      tenure_mid_credit: 1.5
    rule: >-
      On a tier whose monthly_subscription_fee is above 0.00, the month's subscription_fee entry is booked on the first day of the calendar month for that month's billing period, at the amount worked out below for the tier held after that day's review, in a month the waiver rule does not waive.
      The standard subscription charge is the list fee, which is the monthly_subscription_fee of the tier held after the month's review, charged with no percentage off and no credit and kept to the cent.
      The subscription relief net sales are the sales less the refunds less the chargebacks on the profile dated within the rolling month ending on the handling date.
      A rolling window of a number of months ending on the handling date covers the dates after the same calendar day that many months earlier, up to and including the handling date, and a profile's age in whole months counts a month once the same day of the month as its opening date is reached.
      The plan bundle percentage is bundle_top_pct percent when the owner's personal account is on Pocketwire Onyx or Pocketwire Summit, bundle_mid_pct percent when it is on Pocketwire Prime, and nothing when it is on any other plan.
      The subscription relief three-month average is the sales less the refunds less the chargebacks on the profile dated within the rolling relief_average_months months ending on the handling date, divided by relief_average_months and rounded to the nearest cent.
      The subscription relief volume is chosen by the profile's age and claims record: for a profile at least relief_window_long_months whole months old with no chargeback dated within the rolling relief_claims_months months ending on the handling date, it is the higher of the subscription relief net sales and the subscription relief three-month average; for a profile at least relief_window_mid_months whole months old that does not meet both of those conditions, it is the subscription relief three-month average; for any other profile it is the subscription relief net sales.
      A subscription relief volume at or above relief_high_share of the tier's monthly_subscription_waiver_volume earns a volume relief percentage of relief_high_pct percent, a subscription relief volume below that but at or above relief_low_share of it earns relief_low_pct percent, and a lower subscription relief volume earns no volume relief percentage.
      The subscription tenure credit is tenure_long_credit dollars for a profile at least tenure_long_months whole months old, tenure_mid_credit dollars for a profile at least tenure_mid_months but fewer than tenure_long_months whole months old, and nothing for a younger profile.
      The plan bundle percentage and the volume relief percentage are first added into one combined percentage, the list fee is then reduced once by that combined percentage, the subscription tenure credit is subtracted from that reduced fee, the result is never below zero, and it is rounded to the nearest cent only at that last step.
    prerequisite: []
    cross_category:
      - category: wallet
        as: branch
        reads: [variant_name]
        note: The plan bundle percentage is decided by the plan of the owner's Pocketwire Personal Account.
    compute:
      - list_fee: "P('monthly_subscription_fee')"
      - owner_plan: "CFIELD('wallet', 'variant_name')"
      - bundle_pct: "K('bundle_top_pct') if (owner_plan == 'Pocketwire Onyx' or owner_plan == 'Pocketwire Summit') else (K('bundle_mid_pct') if owner_plan == 'Pocketwire Prime' else 0)"
      - relief_net_month: "SUM('business_transactions', 'amount', within_months=1, date_field='txn_date', event_type='business_sale') - SUM('business_transactions', 'amount', within_months=1, date_field='txn_date', event_type='business_refund') - SUM('business_transactions', 'amount', within_months=1, date_field='txn_date', event_type='business_chargeback')"
      - relief_recent_chargebacks: "COUNT('business_transactions', within_months=K('relief_claims_months'), date_field='txn_date', event_type='business_chargeback')"
      - relief_quarter_avg: "RND((SUM('business_transactions', 'amount', within_months=K('relief_average_months'), date_field='txn_date', event_type='business_sale') - SUM('business_transactions', 'amount', within_months=K('relief_average_months'), date_field='txn_date', event_type='business_refund') - SUM('business_transactions', 'amount', within_months=K('relief_average_months'), date_field='txn_date', event_type='business_chargeback')) / K('relief_average_months'), 2)"
      - relief_volume: "MX(relief_net_month, relief_quarter_avg) if (MONTHS(F('opened_date'), NOW) >= K('relief_window_long_months') and relief_recent_chargebacks == 0) else (relief_quarter_avg if MONTHS(F('opened_date'), NOW) >= K('relief_window_mid_months') else relief_net_month)"
      - relief_pct: "K('relief_high_pct') if relief_volume >= K('relief_high_share') * P('monthly_subscription_waiver_volume') else (K('relief_low_pct') if relief_volume >= K('relief_low_share') * P('monthly_subscription_waiver_volume') else 0)"
      - tenure_credit: "K('tenure_long_credit') if MONTHS(F('opened_date'), NOW) >= K('tenure_long_months') else (K('tenure_mid_credit') if MONTHS(F('opened_date'), NOW) >= K('tenure_mid_months') else 0)"
      - result: "RND(MX(0, list_fee * (100 - bundle_pct - relief_pct) / 100 - tenure_credit), 2)"
    compute_basis:
      list_fee: "The standard subscription charge is the list fee, which is the monthly_subscription_fee of the tier held after the month's review, charged with no percentage off and no credit and kept to the cent."
      owner_plan: "The plan bundle percentage is bundle_top_pct percent when the owner's personal account is on Pocketwire Onyx or Pocketwire Summit, bundle_mid_pct percent when it is on Pocketwire Prime, and nothing when it is on any other plan."
      bundle_pct: "The plan bundle percentage is bundle_top_pct percent when the owner's personal account is on Pocketwire Onyx or Pocketwire Summit, bundle_mid_pct percent when it is on Pocketwire Prime, and nothing when it is on any other plan."
      relief_net_month: "The subscription relief net sales are the sales less the refunds less the chargebacks on the profile dated within the rolling month ending on the handling date. A rolling window of a number of months ending on the handling date covers the dates after the same calendar day that many months earlier, up to and including the handling date"
      relief_recent_chargebacks: "for a profile at least relief_window_long_months whole months old with no chargeback dated within the rolling relief_claims_months months ending on the handling date"
      relief_quarter_avg: "The subscription relief three-month average is the sales less the refunds less the chargebacks on the profile dated within the rolling relief_average_months months ending on the handling date, divided by relief_average_months and rounded to the nearest cent."
      relief_volume: "The subscription relief volume is chosen by the profile's age and claims record: for a profile at least relief_window_long_months whole months old with no chargeback dated within the rolling relief_claims_months months ending on the handling date, it is the higher of the subscription relief net sales and the subscription relief three-month average; for a profile at least relief_window_mid_months whole months old that does not meet both of those conditions, it is the subscription relief three-month average; for any other profile it is the subscription relief net sales."
      relief_pct: "A subscription relief volume at or above relief_high_share of the tier's monthly_subscription_waiver_volume earns a volume relief percentage of relief_high_pct percent, a subscription relief volume below that but at or above relief_low_share of it earns relief_low_pct percent, and a lower subscription relief volume earns no volume relief percentage."
      tenure_credit: "The subscription tenure credit is tenure_long_credit dollars for a profile at least tenure_long_months whole months old, tenure_mid_credit dollars for a profile at least tenure_mid_months but fewer than tenure_long_months whole months old, and nothing for a younger profile. a profile's age in whole months counts a month once the same day of the month as its opening date is reached."
      result: "The plan bundle percentage and the volume relief percentage are first added into one combined percentage, the list fee is then reduced once by that combined percentage, the subscription tenure credit is subtracted from that reduced fee, the result is never below zero, and it is rounded to the nearest cent only at that last step."
    factors:
      - id: plan_bundle
        effect: parameter
        decides: bundle_pct
        bindings: [owner_plan, bundle_pct]
        ladder:
          - when: "the owner's personal account is on Pocketwire Onyx or Pocketwire Summit"
            value: "K('bundle_top_pct')"
          - when: "the owner's personal account is on Pocketwire Prime"
            value: "K('bundle_mid_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          bundle_pct: "0"
        evidence: [cross_category]
        cross_difficulty: wallet
      - id: volume_relief
        effect: parameter
        decides: relief_pct
        bindings: [relief_net_month, relief_pct]
        ladder:
          - when: "the subscription relief volume is at or above relief_high_share of the tier's monthly_subscription_waiver_volume"
            value: "K('relief_high_pct')"
          - when: "the subscription relief volume is below relief_high_share but at or above relief_low_share of the tier's monthly_subscription_waiver_volume"
            value: "K('relief_low_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          relief_pct: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: tenure_credit
        effect: parameter
        decides: tenure_credit
        bindings: [tenure_credit]
        ladder:
          - when: "the profile is at least tenure_long_months whole months old"
            value: "K('tenure_long_credit')"
          - when: "the profile is at least tenure_mid_months but fewer than tenure_long_months whole months old"
            value: "K('tenure_mid_credit')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_credit: "0"
        evidence: [date]
        cross_difficulty: null
      - id: relief_window
        effect: method
        decides: relief_volume
        bindings: [relief_recent_chargebacks, relief_quarter_avg, relief_volume]
        ladder:
          - when: "the profile is at least relief_window_long_months whole months old and no chargeback is dated within the rolling relief_claims_months months ending on the handling date"
            method: "the relief volume is the higher of the rolling-month net sales and the rolling three-month average"
          - when: "the profile is at least relief_window_mid_months whole months old and does not meet both conditions of the first tier"
            method: "the relief volume is the rolling three-month average (three months of net sales divided by three, to the cent)"
          - when: "otherwise"
            method: "the relief volume is the rolling-month net sales"
        baseline:
          relief_volume: "relief_net_month"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard subscription charge is the list fee, which is the monthly_subscription_fee of the tier held after the month's review, charged with no percentage off and no credit and kept to the cent.
      params: [monthly_subscription_fee]
    inputs:
      history:
        - {table: business_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: business_sale}}
        - {table: business_transactions, aggregate: sum, field: amount, within_months: 3, filters: {event_type: business_sale}}
        - {table: business_transactions, aggregate: sum, field: amount, within_months: 3, filters: {event_type: business_refund}}
        - {table: business_transactions, aggregate: count, field: business_txn_id, within_months: 3, filters: {event_type: business_chargeback}}
      cross_category: [wallet]

  - id: business_ext_instant_payout_amount
    base_policy_refs: [business_payouts]
    overwrite:
      - base_policy: business_payouts
        superseded_clause: >-
          A payout can never exceed the available balance, which is business_balance less the funds under unreleased holds (business_msr_active_holds)
        replaced_by: >-
          An instant payout that sends the most a profile can pay out to a debit card on the handling date is worked out from the balance cleared for an instant payout, which takes the place of the available balance for that payout.
      - base_policy: business_payouts
        superseded_clause: >-
          together with the day's earlier payouts (business_msr_payouts_today) may not exceed daily_payout_limit
        replaced_by: >-
          The instant payout amount is that instant share capped at the tier's instant_payout_max_per_payout and at the tier's daily_payout_limit less the payouts already dated on the handling date, never below zero, and rounded to the nearest cent.
    trigger: on_request
    subject: [business_payout]
    computes: amount
    target_tool: send_instant_payout_0ea58e95
    params:
      settle_tenure_months: 12
      claims_window_months: 3
      claims_high_pct: 8
      claims_low_pct: 4
      intl_high_share: 0.3
      intl_low_share: 0.1
      intl_high_pct: 4
      intl_low_pct: 2
      advance_active_pct: 25
      velocity_high_count: 4
      velocity_low_count: 2
      velocity_high_amount: 400.0
      velocity_low_amount: 150.0
      share_window_months: 3
      payout_history_months: 12
      thin_payout_count: 12
      thin_share: 0.8
    rule: >-
      An instant payout that sends the most a profile can pay out to a debit card on the handling date is worked out from the balance cleared for an instant payout, which takes the place of the available balance for that payout.
      The standard instant payout amount is the business balance less the holds counted against an instant payout, less every sale dated on the handling date as still settling, and less the tier's instant_payout_fee_max kept back so the payout's own fee can be booked; what remains, never below zero, is paid out in full to the cent within the tier's instant_payout_max_per_payout and within the tier's daily_payout_limit less the payouts already dated on the handling date.
      The holds counted against an instant payout are the amount of every hold entry on the profile less the amount of every hold release entry on it.
      A rolling window of a number of months ending on the handling date covers the dates after the same calendar day that many months earlier, up to and including the handling date, and a profile's age in whole months counts a month once the same day of the month as its opening date is reached.
      The sales still settling on the handling date are none for a profile on Pocketwire Business Premier or Pocketwire Business Enterprise; for a profile on another tier that is at least settle_tenure_months whole months old, they are the sales dated on the handling date other than in-person qr_code and tap_to_pay sales; for any other profile, they are every sale dated on the handling date.
      The instant claims reserve percentage is claims_high_pct percent when the profile has both a chargeback dated within the rolling claims_window_months months ending on the handling date and a buyer claim still open, a claim being open while the profile's claim openings outnumber its claim closings, claims_low_pct percent when it has exactly one of those two, and nothing when it has neither; the instant claims reserve is that percentage of the gross sales dated within the rolling month ending on the handling date, rounded to the nearest cent.
      The instant cross-border keep-back percentage is intl_high_pct percent when the international sales dated within the rolling month ending on the handling date are more than intl_high_share of all sales dated in that month, intl_low_pct percent when they are more than intl_low_share but not more than intl_high_share of them, and nothing otherwise; the instant cross-border keep-back is that percentage of those international sales, rounded to the nearest cent.
      The instant advance keep-back is the whole outstanding balance of the owner's Pocketwire Advance line when that line is past_due or suspended, advance_active_pct percent of that outstanding balance, rounded to the nearest cent, when the line is active and owes more than zero, and nothing when the owner has no such line or owes nothing on it.
      The instant velocity keep-back is velocity_high_amount dollars when at least velocity_high_count instant_card payouts are dated within the rolling month ending on the handling date, velocity_low_amount dollars when at least velocity_low_count but fewer than velocity_high_count are, and nothing when fewer are.
      The balance cleared for an instant payout is the business balance less the holds counted against an instant payout, the sales still settling on the handling date, the instant claims reserve, the instant cross-border keep-back, the instant advance keep-back, the instant velocity keep-back and the tier's instant_payout_fee_max, all taken from that one balance.
      The instant share of the cleared balance follows the profile's payout record: when a payout return is dated within the rolling share_window_months months ending on the handling date, the cleared balance is halved and rounded down to whole dollars; when there is none but fewer than thin_payout_count payouts are dated within the rolling payout_history_months months ending on the handling date, the cleared balance is multiplied by thin_share and rounded down to whole dollars; otherwise the whole cleared balance is kept to the cent; a cleared balance below zero counts as zero.
      The instant payout amount is that instant share capped at the tier's instant_payout_max_per_payout and at the tier's daily_payout_limit less the payouts already dated on the handling date, never below zero, and rounded to the nearest cent.
      The instant payout amount is worked out only after the business balance carries the subscription fee entry for the current calendar month, on a tier that charges a monthly subscription and in a month the waiver rule does not waive.
    prerequisite:
      - problem: business_ext_subscription_month_charge
        kind: value_input
        gate: balance
        form: state
        policy_source: >-
          The instant payout amount is worked out only after the business balance carries the subscription fee entry for the current calendar month, on a tier that charges a monthly subscription and in a month the waiver rule does not waive.
        condition: >-
          On a tier whose monthly_subscription_fee is above 0.00 and in a month not waived, the profile's business_transactions carry a business_fee entry with fee_type subscription_fee dated in the handling month, and business_profiles.business_balance already reflects its debit.
        resolved_by: book_subscription_fee_2324701e
        effect: >-
          The balance binding drops by the booked subscription fee, which lowers the balance cleared for an instant payout and so the instant share that is paid out.
    cross_category:
      - category: advance
        as: branch
        reads: [status, outstanding_balance]
        note: The instant advance keep-back is decided by the status and outstanding balance of the owner's Pocketwire Advance line.
    compute:
      - balance: "F('business_balance')"
      - open_holds: "SUM('business_transactions', 'amount', event_type='business_payment_hold') - SUM('business_transactions', 'amount', event_type='business_hold_release')"
      - today_sales: "SUM('business_transactions', 'amount', event_type='business_sale', txn_date=NOW)"
      - today_in_person: "SUM('business_transactions', 'amount', event_type='business_sale', txn_date=NOW, sale_channel='qr_code') + SUM('business_transactions', 'amount', event_type='business_sale', txn_date=NOW, sale_channel='tap_to_pay')"
      - settling_today: "0 if (F('variant_name') == 'Pocketwire Business Premier' or F('variant_name') == 'Pocketwire Business Enterprise') else (today_sales - today_in_person if MONTHS(F('opened_date'), NOW) >= K('settle_tenure_months') else today_sales)"
      - month_sales: "SUM('business_transactions', 'amount', within_months=1, date_field='txn_date', event_type='business_sale')"
      - chargebacks_window: "COUNT('business_transactions', within_months=K('claims_window_months'), date_field='txn_date', event_type='business_chargeback')"
      - open_claims: "COUNT('business_claims', event_type='business_claim_opened') - COUNT('business_claims', event_type='business_claim_closed')"
      - claims_reserve_pct: "K('claims_high_pct') if (chargebacks_window >= 1 and open_claims >= 1) else (K('claims_low_pct') if (chargebacks_window >= 1 or open_claims >= 1) else 0)"
      - claims_reserve: "RND(month_sales * claims_reserve_pct / 100, 2)"
      - intl_month: "SUM('business_transactions', 'amount', within_months=1, date_field='txn_date', event_type='business_sale', buyer_region='international')"
      - intl_keep_pct: "K('intl_high_pct') if intl_month > K('intl_high_share') * month_sales else (K('intl_low_pct') if intl_month > K('intl_low_share') * month_sales else 0)"
      - intl_keepback: "RND(intl_month * intl_keep_pct / 100, 2)"
      - advance_status: "CFIELD('advance', 'status')"
      - advance_owed: "CFIELD('advance', 'outstanding_balance')"
      - advance_keepback: "float(advance_owed) if (advance_status == 'past_due' or advance_status == 'suspended') else (RND(float(advance_owed) * K('advance_active_pct') / 100, 2) if (advance_status == 'active' and float(advance_owed or 0) > 0) else 0)"
      - instant_count: "COUNT('business_transactions', within_months=1, date_field='txn_date', event_type='business_payout', payout_method='instant_card')"
      - velocity_keepback: "K('velocity_high_amount') if instant_count >= K('velocity_high_count') else (K('velocity_low_amount') if instant_count >= K('velocity_low_count') else 0)"
      - fee_keepback: "P('instant_payout_fee_max')"
      - cleared: "balance - open_holds - settling_today - claims_reserve - intl_keepback - advance_keepback - velocity_keepback - fee_keepback"
      - returns_window: "COUNT('business_transactions', within_months=K('share_window_months'), date_field='txn_date', event_type='business_payout_return')"
      - payouts_history: "COUNT('business_transactions', within_months=K('payout_history_months'), date_field='txn_date', event_type='business_payout')"
      - instant_share: "int(MX(0, cleared) / 2) if returns_window >= 1 else (int(MX(0, cleared) * K('thin_share')) if payouts_history < K('thin_payout_count') else MX(0, cleared))"
      - daily_room: "P('daily_payout_limit') - SUM('business_transactions', 'amount', event_type='business_payout', txn_date=NOW)"
      - result: "RND(MX(0, MN(instant_share, P('instant_payout_max_per_payout'), daily_room)), 2)"
    compute_basis:
      balance: "The balance cleared for an instant payout is the business balance less the holds counted against an instant payout"
      open_holds: "The holds counted against an instant payout are the amount of every hold entry on the profile less the amount of every hold release entry on it."
      today_sales: "less every sale dated on the handling date as still settling"
      today_in_person: "for a profile on another tier that is at least settle_tenure_months whole months old, they are the sales dated on the handling date other than in-person qr_code and tap_to_pay sales"
      settling_today: "The sales still settling on the handling date are none for a profile on Pocketwire Business Premier or Pocketwire Business Enterprise; for a profile on another tier that is at least settle_tenure_months whole months old, they are the sales dated on the handling date other than in-person qr_code and tap_to_pay sales; for any other profile, they are every sale dated on the handling date."
      month_sales: "the instant claims reserve is that percentage of the gross sales dated within the rolling month ending on the handling date, rounded to the nearest cent. A rolling window of a number of months ending on the handling date covers the dates after the same calendar day that many months earlier, up to and including the handling date"
      chargebacks_window: "when the profile has both a chargeback dated within the rolling claims_window_months months ending on the handling date and a buyer claim still open"
      open_claims: "a claim being open while the profile's claim openings outnumber its claim closings"
      claims_reserve_pct: "The instant claims reserve percentage is claims_high_pct percent when the profile has both a chargeback dated within the rolling claims_window_months months ending on the handling date and a buyer claim still open, a claim being open while the profile's claim openings outnumber its claim closings, claims_low_pct percent when it has exactly one of those two, and nothing when it has neither"
      claims_reserve: "the instant claims reserve is that percentage of the gross sales dated within the rolling month ending on the handling date, rounded to the nearest cent."
      intl_month: "when the international sales dated within the rolling month ending on the handling date are more than intl_high_share of all sales dated in that month"
      intl_keep_pct: "The instant cross-border keep-back percentage is intl_high_pct percent when the international sales dated within the rolling month ending on the handling date are more than intl_high_share of all sales dated in that month, intl_low_pct percent when they are more than intl_low_share but not more than intl_high_share of them, and nothing otherwise"
      intl_keepback: "the instant cross-border keep-back is that percentage of those international sales, rounded to the nearest cent."
      advance_status: "when that line is past_due or suspended"
      advance_owed: "The instant advance keep-back is the whole outstanding balance of the owner's Pocketwire Advance line"
      advance_keepback: "The instant advance keep-back is the whole outstanding balance of the owner's Pocketwire Advance line when that line is past_due or suspended, advance_active_pct percent of that outstanding balance, rounded to the nearest cent, when the line is active and owes more than zero, and nothing when the owner has no such line or owes nothing on it."
      instant_count: "when at least velocity_high_count instant_card payouts are dated within the rolling month ending on the handling date"
      velocity_keepback: "The instant velocity keep-back is velocity_high_amount dollars when at least velocity_high_count instant_card payouts are dated within the rolling month ending on the handling date, velocity_low_amount dollars when at least velocity_low_count but fewer than velocity_high_count are, and nothing when fewer are."
      fee_keepback: "and less the tier's instant_payout_fee_max kept back so the payout's own fee can be booked"
      cleared: "The balance cleared for an instant payout is the business balance less the holds counted against an instant payout, the sales still settling on the handling date, the instant claims reserve, the instant cross-border keep-back, the instant advance keep-back, the instant velocity keep-back and the tier's instant_payout_fee_max, all taken from that one balance."
      returns_window: "when a payout return is dated within the rolling share_window_months months ending on the handling date"
      payouts_history: "when there is none but fewer than thin_payout_count payouts are dated within the rolling payout_history_months months ending on the handling date"
      instant_share: "The instant share of the cleared balance follows the profile's payout record: when a payout return is dated within the rolling share_window_months months ending on the handling date, the cleared balance is halved and rounded down to whole dollars; when there is none but fewer than thin_payout_count payouts are dated within the rolling payout_history_months months ending on the handling date, the cleared balance is multiplied by thin_share and rounded down to whole dollars; otherwise the whole cleared balance is kept to the cent; a cleared balance below zero counts as zero."
      daily_room: "at the tier's daily_payout_limit less the payouts already dated on the handling date"
      result: "The instant payout amount is that instant share capped at the tier's instant_payout_max_per_payout and at the tier's daily_payout_limit less the payouts already dated on the handling date, never below zero, and rounded to the nearest cent."
    factors:
      - id: settling_sales
        effect: method
        decides: settling_today
        bindings: [today_in_person, settling_today]
        ladder:
          - when: "the profile is on Pocketwire Business Premier or Pocketwire Business Enterprise"
            method: "no sale of the handling date is treated as still settling"
          - when: "the profile is on another tier and is at least settle_tenure_months whole months old"
            method: "the handling date's sales are treated as settling except in-person qr_code and tap_to_pay sales, which clear at once"
          - when: "otherwise"
            method: "every sale dated on the handling date is treated as still settling"
        baseline:
          settling_today: "today_sales"
        evidence: [history, date]
        cross_difficulty: null
      - id: claims_reserve
        effect: parameter
        decides: claims_reserve_pct
        bindings: [chargebacks_window, open_claims, claims_reserve_pct]
        ladder:
          - when: "a chargeback is dated within the rolling claims_window_months months and a buyer claim is still open"
            value: "K('claims_high_pct')"
          - when: "exactly one of: a chargeback dated within the rolling claims_window_months months, or a buyer claim still open"
            value: "K('claims_low_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          claims_reserve_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: cross_border_keepback
        effect: parameter
        decides: intl_keep_pct
        bindings: [intl_month, intl_keep_pct]
        ladder:
          - when: "international sales in the rolling month are more than intl_high_share of that month's sales"
            value: "K('intl_high_pct')"
          - when: "international sales in the rolling month are more than intl_low_share but not more than intl_high_share of that month's sales"
            value: "K('intl_low_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          intl_keep_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: advance_keepback
        effect: parameter
        decides: advance_keepback
        bindings: [advance_status, advance_owed, advance_keepback]
        ladder:
          - when: "the owner's Pocketwire Advance line is past_due or suspended"
            value: "the whole outstanding_balance of the line"
          - when: "the owner's Pocketwire Advance line is active and owes more than zero"
            value: "K('advance_active_pct') percent of the outstanding_balance"
          - when: "otherwise"
            value: "0"
        baseline:
          advance_keepback: "0"
        evidence: [cross_category]
        cross_difficulty: advance
      - id: velocity_keepback
        effect: parameter
        decides: velocity_keepback
        bindings: [instant_count, velocity_keepback]
        ladder:
          - when: "at least velocity_high_count instant_card payouts are dated in the rolling month"
            value: "K('velocity_high_amount')"
          - when: "at least velocity_low_count but fewer than velocity_high_count instant_card payouts are dated in the rolling month"
            value: "K('velocity_low_amount')"
          - when: "otherwise"
            value: "0"
        baseline:
          velocity_keepback: "0"
        evidence: [history]
        cross_difficulty: null
      - id: instant_share
        effect: method
        decides: instant_share
        bindings: [returns_window, payouts_history, instant_share]
        ladder:
          - when: "a payout return is dated within the rolling share_window_months months"
            method: "the cleared balance is halved and rounded down to whole dollars"
          - when: "no payout return in that window and fewer than thin_payout_count payouts in the rolling payout_history_months months"
            method: "the cleared balance is multiplied by thin_share and rounded down to whole dollars"
          - when: "otherwise"
            method: "the whole cleared balance is kept to the cent"
        baseline:
          instant_share: "MX(0, cleared)"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard instant payout amount is the business balance less the holds counted against an instant payout, less every sale dated on the handling date as still settling, and less the tier's instant_payout_fee_max kept back so the payout's own fee can be booked; what remains, never below zero, is paid out in full to the cent within the tier's instant_payout_max_per_payout and within the tier's daily_payout_limit less the payouts already dated on the handling date.
        The holds counted against an instant payout are the amount of every hold entry on the profile less the amount of every hold release entry on it.
      params: [instant_payout_fee_max, instant_payout_max_per_payout, daily_payout_limit]
    inputs:
      history:
        - {table: business_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: business_sale}}
        - {table: business_transactions, aggregate: sum, field: amount, filters: {event_type: business_payment_hold}}
        - {table: business_transactions, aggregate: count, field: business_txn_id, within_months: 3, filters: {event_type: business_chargeback}}
        - {table: business_transactions, aggregate: count, field: business_txn_id, within_months: 3, filters: {event_type: business_payout_return}}
        - {table: business_claims, aggregate: count, field: business_claim_id, filters: {event_type: business_claim_opened}}
      cross_category: [advance]

  - id: business_ext_chargeback_fee_charge
    base_policy_refs: [business_buyer_claims, business_transaction_fees, business_payouts, business_subscription_fee]
    overwrite:
      - base_policy: business_buyer_claims
        superseded_clause: >-
          A claim decided for the buyer debits the claim amount as a business_chargeback and books a chargeback_fee
        replaced_by: >-
          For a claim decided for the buyer, the chargeback_fee entry is booked against the chargeback it belongs to at the amount worked out below, which takes the place of a flat charge of the tier's chargeback_fee.
    trigger: state_due
    subject: [business_fee]
    computes: fee_amount
    target_tool: book_chargeback_fee_9ab6815a
    params:
      repeat_window_months: 12
      first_claim_fee: 12.0
      frequent_claim_count: 3
      frequent_claim_fee: 35.0
      unauthorized_surcharge: 10.0
      inr_surcharge: 5.0
      ratio_window_months: 3
      ratio_high_multiplier: 2
      ratio_step_multiplier: 1.5
      small_claim_limit: 100.0
      mid_claim_limit: 250.0
      small_claim_multiplier: 0.5
      mid_claim_multiplier: 0.75
      top_plan_reduction: 5.0
      mid_plan_reduction: 2.5
      signature_credit: 8.0
      tracking_credit: 5.0
    rule: >-
      For a claim decided for the buyer, the chargeback_fee entry is booked against the chargeback it belongs to at the amount worked out below, which takes the place of a flat charge of the tier's chargeback_fee.
      The standard chargeback fee is the tier's chargeback_fee, charged in full on the chargeback with no surcharge, scaling or reduction and kept to the cent.
      The chargeback priced is the chargeback most recently debited on the profile, and its buyer claim is the claim opened on the same sale.
      A rolling window of a number of months ending on the handling date covers the dates after the same calendar day that many months earlier, up to and including the handling date.
      The chargeback fee level is first_claim_fee dollars when that chargeback is the only chargeback dated within the rolling repeat_window_months months ending on the handling date, frequent_claim_fee dollars when at least frequent_claim_count chargebacks are dated in that window, and the tier's chargeback_fee otherwise.
      The claim reason surcharge is unauthorized_surcharge dollars when the claim's reason is unauthorized_buyer, inr_surcharge dollars when it is item_not_received, and nothing otherwise.
      The ratio-adjusted chargeback fee starts from the chargeback fee level plus the claim reason surcharge: when the chargebacks dated within the rolling ratio_window_months months ending on the handling date are more than the tier's chargeback_ratio_review_threshold_pct percent of the sales dated in that window, that sum is multiplied by ratio_high_multiplier; when they are more than half of that percentage but not more than it, the sum is multiplied by ratio_step_multiplier and rounded up to whole dollars; otherwise the sum is kept as it is.
      The claim-size chargeback fee follows the claim amount: for a claim below small_claim_limit dollars the ratio-adjusted chargeback fee is multiplied by small_claim_multiplier and rounded down to whole dollars; for a claim of at least small_claim_limit but below mid_claim_limit dollars it is multiplied by mid_claim_multiplier and rounded down to whole dollars; for a larger claim it is kept as it is.
      The personal plan chargeback reduction is top_plan_reduction dollars when the owner's personal account is on Pocketwire Onyx or Pocketwire Summit, mid_plan_reduction dollars when it is on Pocketwire Plus or Pocketwire Prime, and nothing on any other plan.
      The seller response credit is signature_credit dollars when the seller responded to that claim with signature-on-delivery proof no later than the tier's seller_response_days calendar days after the claim opened, tracking_credit dollars when the seller instead responded with tracking within that window, and nothing when the seller gave neither response in time.
      The chargeback fee is the claim-size chargeback fee less the personal plan chargeback reduction and less the seller response credit, never below zero, and rounded to the nearest cent.
    prerequisite: []
    cross_category:
      - category: wallet
        as: branch
        reads: [variant_name]
        note: The personal plan chargeback reduction is decided by the plan of the owner's Pocketwire Personal Account.
    compute:
      - cb_sale: "LATEST('business_transactions', 'source_txn_id', date_field='txn_date', event_type='business_chargeback')"
      - cb_year_count: "COUNT('business_transactions', within_months=K('repeat_window_months'), date_field='txn_date', event_type='business_chargeback')"
      - fee_level: "K('first_claim_fee') if cb_year_count == 1 else (K('frequent_claim_fee') if cb_year_count >= K('frequent_claim_count') else P('chargeback_fee'))"
      - claim_reason: "LATEST('business_claims', 'claim_reason', date_field='opened_date', event_type='business_claim_opened', sale_txn_id=cb_sale)"
      - reason_surcharge: "K('unauthorized_surcharge') if claim_reason == 'unauthorized_buyer' else (K('inr_surcharge') if claim_reason == 'item_not_received' else 0)"
      - ratio_chargebacks: "COUNT('business_transactions', within_months=K('ratio_window_months'), date_field='txn_date', event_type='business_chargeback')"
      - ratio_sales: "COUNT('business_transactions', within_months=K('ratio_window_months'), date_field='txn_date', event_type='business_sale')"
      - ratio_fee: "(fee_level + reason_surcharge) * K('ratio_high_multiplier') if ratio_chargebacks * 100 > P('chargeback_ratio_review_threshold_pct') * ratio_sales else (-((-(fee_level + reason_surcharge) * K('ratio_step_multiplier')) // 1) if ratio_chargebacks * 100 > P('chargeback_ratio_review_threshold_pct') * ratio_sales / 2 else fee_level + reason_surcharge)"
      - claim_amount: "LATEST('business_claims', 'claim_amount', date_field='opened_date', event_type='business_claim_opened', sale_txn_id=cb_sale)"
      - sized_fee: "(ratio_fee * K('small_claim_multiplier')) // 1 if claim_amount < K('small_claim_limit') else ((ratio_fee * K('mid_claim_multiplier')) // 1 if claim_amount < K('mid_claim_limit') else ratio_fee)"
      - owner_plan: "CFIELD('wallet', 'variant_name')"
      - plan_reduction: "K('top_plan_reduction') if (owner_plan == 'Pocketwire Onyx' or owner_plan == 'Pocketwire Summit') else (K('mid_plan_reduction') if (owner_plan == 'Pocketwire Plus' or owner_plan == 'Pocketwire Prime') else 0)"
      - claim_opened: "LATEST('business_claims', 'opened_date', date_field='opened_date', event_type='business_claim_opened', sale_txn_id=cb_sale)"
      - response_date: "LATEST('business_claims', 'response_date', date_field='response_date', event_type='business_seller_response', sale_txn_id=cb_sale)"
      - signature_responses: "COUNT('business_claims', event_type='business_seller_response', sale_txn_id=cb_sale, response_type='signature_proof_provided')"
      - tracking_responses: "COUNT('business_claims', event_type='business_seller_response', sale_txn_id=cb_sale, response_type='tracking_provided')"
      - response_credit: "K('signature_credit') if (signature_responses >= 1 and DAYS(claim_opened, response_date) <= P('seller_response_days')) else (K('tracking_credit') if (tracking_responses >= 1 and DAYS(claim_opened, response_date) <= P('seller_response_days')) else 0)"
      - result: "RND(MX(0, sized_fee - plan_reduction - response_credit), 2)"
    compute_basis:
      cb_sale: "The chargeback priced is the chargeback most recently debited on the profile, and its buyer claim is the claim opened on the same sale."
      cb_year_count: "when that chargeback is the only chargeback dated within the rolling repeat_window_months months ending on the handling date"
      fee_level: "The chargeback fee level is first_claim_fee dollars when that chargeback is the only chargeback dated within the rolling repeat_window_months months ending on the handling date, frequent_claim_fee dollars when at least frequent_claim_count chargebacks are dated in that window, and the tier's chargeback_fee otherwise."
      claim_reason: "The claim reason surcharge is unauthorized_surcharge dollars when the claim's reason is unauthorized_buyer"
      reason_surcharge: "The claim reason surcharge is unauthorized_surcharge dollars when the claim's reason is unauthorized_buyer, inr_surcharge dollars when it is item_not_received, and nothing otherwise."
      ratio_chargebacks: "when the chargebacks dated within the rolling ratio_window_months months ending on the handling date"
      ratio_sales: "are more than the tier's chargeback_ratio_review_threshold_pct percent of the sales dated in that window"
      ratio_fee: "The ratio-adjusted chargeback fee starts from the chargeback fee level plus the claim reason surcharge: when the chargebacks dated within the rolling ratio_window_months months ending on the handling date are more than the tier's chargeback_ratio_review_threshold_pct percent of the sales dated in that window, that sum is multiplied by ratio_high_multiplier; when they are more than half of that percentage but not more than it, the sum is multiplied by ratio_step_multiplier and rounded up to whole dollars; otherwise the sum is kept as it is."
      claim_amount: "The claim-size chargeback fee follows the claim amount"
      sized_fee: "The claim-size chargeback fee follows the claim amount: for a claim below small_claim_limit dollars the ratio-adjusted chargeback fee is multiplied by small_claim_multiplier and rounded down to whole dollars; for a claim of at least small_claim_limit but below mid_claim_limit dollars it is multiplied by mid_claim_multiplier and rounded down to whole dollars; for a larger claim it is kept as it is."
      owner_plan: "when the owner's personal account is on Pocketwire Onyx or Pocketwire Summit"
      plan_reduction: "The personal plan chargeback reduction is top_plan_reduction dollars when the owner's personal account is on Pocketwire Onyx or Pocketwire Summit, mid_plan_reduction dollars when it is on Pocketwire Plus or Pocketwire Prime, and nothing on any other plan."
      claim_opened: "no later than the tier's seller_response_days calendar days after the claim opened"
      response_date: "when the seller responded to that claim with signature-on-delivery proof no later than the tier's seller_response_days calendar days after the claim opened"
      signature_responses: "when the seller responded to that claim with signature-on-delivery proof"
      tracking_responses: "when the seller instead responded with tracking within that window"
      response_credit: "The seller response credit is signature_credit dollars when the seller responded to that claim with signature-on-delivery proof no later than the tier's seller_response_days calendar days after the claim opened, tracking_credit dollars when the seller instead responded with tracking within that window, and nothing when the seller gave neither response in time."
      result: "The chargeback fee is the claim-size chargeback fee less the personal plan chargeback reduction and less the seller response credit, never below zero, and rounded to the nearest cent."
    factors:
      - id: repeat_claims_level
        effect: parameter
        decides: fee_level
        bindings: [cb_year_count, fee_level]
        ladder:
          - when: "the chargeback is the only chargeback dated within the rolling repeat_window_months months"
            value: "K('first_claim_fee')"
          - when: "at least frequent_claim_count chargebacks are dated within the rolling repeat_window_months months"
            value: "K('frequent_claim_fee')"
          - when: "otherwise"
            value: "P('chargeback_fee')"
        baseline:
          fee_level: "P('chargeback_fee')"
        evidence: [history]
        cross_difficulty: null
      - id: claim_reason_surcharge
        effect: parameter
        decides: reason_surcharge
        bindings: [claim_reason, reason_surcharge]
        ladder:
          - when: "the claim's reason is unauthorized_buyer"
            value: "K('unauthorized_surcharge')"
          - when: "the claim's reason is item_not_received"
            value: "K('inr_surcharge')"
          - when: "otherwise"
            value: "0"
        baseline:
          reason_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: ratio_adjustment
        effect: method
        decides: ratio_fee
        bindings: [ratio_chargebacks, ratio_sales, ratio_fee]
        ladder:
          - when: "chargebacks in the rolling ratio_window_months months are more than chargeback_ratio_review_threshold_pct percent of that window's sales"
            method: "the fee level plus surcharge is multiplied by ratio_high_multiplier"
          - when: "they are more than half of that percentage but not more than it"
            method: "the fee level plus surcharge is multiplied by ratio_step_multiplier and rounded up to whole dollars"
          - when: "otherwise"
            method: "the fee level plus surcharge is kept as it is"
        baseline:
          ratio_fee: "fee_level + reason_surcharge"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: claim_size_scaling
        effect: method
        decides: sized_fee
        bindings: [claim_amount, sized_fee]
        ladder:
          - when: "the claim amount is below small_claim_limit dollars"
            method: "the ratio-adjusted fee is multiplied by small_claim_multiplier and rounded down to whole dollars"
          - when: "the claim amount is at least small_claim_limit but below mid_claim_limit dollars"
            method: "the ratio-adjusted fee is multiplied by mid_claim_multiplier and rounded down to whole dollars"
          - when: "otherwise"
            method: "the ratio-adjusted fee is kept as it is"
        baseline:
          sized_fee: "ratio_fee"
        evidence: [history]
        cross_difficulty: null
      - id: plan_reduction
        effect: parameter
        decides: plan_reduction
        bindings: [owner_plan, plan_reduction]
        ladder:
          - when: "the owner's personal account is on Pocketwire Onyx or Pocketwire Summit"
            value: "K('top_plan_reduction')"
          - when: "the owner's personal account is on Pocketwire Plus or Pocketwire Prime"
            value: "K('mid_plan_reduction')"
          - when: "otherwise"
            value: "0"
        baseline:
          plan_reduction: "0"
        evidence: [cross_category]
        cross_difficulty: wallet
      - id: seller_response_credit
        effect: parameter
        decides: response_credit
        bindings: [signature_responses, tracking_responses, response_credit]
        ladder:
          - when: "the seller responded with signature-on-delivery proof and the response is dated no later than seller_response_days calendar days after the claim opened"
            value: "K('signature_credit')"
          - when: "the seller did not give signature proof in time but responded with tracking and the response is dated no later than seller_response_days calendar days after the claim opened"
            value: "K('tracking_credit')"
          - when: "otherwise"
            value: "0"
        baseline:
          response_credit: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard chargeback fee is the tier's chargeback_fee, charged in full on the chargeback with no surcharge, scaling or reduction and kept to the cent.
      params: [chargeback_fee]
    inputs:
      history:
        - {table: business_transactions, aggregate: count, field: business_txn_id, within_months: 12, filters: {event_type: business_chargeback}}
        - {table: business_transactions, aggregate: count, field: business_txn_id, within_months: 3, filters: {event_type: business_sale}}
        - {table: business_claims, aggregate: latest, field: claim_amount, filters: {event_type: business_claim_opened}}
        - {table: business_claims, aggregate: count, field: business_claim_id, filters: {event_type: business_seller_response}}
      cross_category: [wallet]

  - id: business_ext_refund_fee_credit
    base_policy_refs: [business_refunds, business_payouts]
    overwrite:
      - base_policy: business_refunds
        superseded_clause: >-
          On tiers whose fee_refund_pct_portion_on_refund is true, the percentage part of the sale's transaction fee is credited back in proportion to the refunded share of the sale, rounded to the cent (half up); the fixed part and any cross_border_fee are never credited back, and on other tiers no fee is credited back.
        replaced_by: >-
          On a tier whose fee_refund_pct_portion_on_refund is true, a refund earns a fee credit out of the percentage part of the refunded sale's transaction fee, booked against that transaction fee at the amount worked out below; the fixed part of the fee and any cross_border_fee are never credited back, and on other tiers no fee is credited back.
    trigger: state_due
    subject: [business_fee_credit]
    computes: credit_amount
    target_tool: credit_refund_fee_b8556c63
    params:
      prompt_days: 14
      late_days: 60
      full_credit_pct: 100
      mid_credit_pct: 60
      late_credit_pct: 25
      nad_credit_multiplier: 0.5
      inr_credit_multiplier: 0.75
    rule: >-
      On a tier whose fee_refund_pct_portion_on_refund is true, a refund earns a fee credit out of the percentage part of the refunded sale's transaction fee, booked against that transaction fee at the amount worked out below; the fixed part of the fee and any cross_border_fee are never credited back, and on other tiers no fee is credited back.
      The standard refund fee credit is the percentage part of the refunded sale's transaction fee, which is the sale amount times the tier's transaction_fee_pct rounded to the nearest cent, multiplied by the refunded share, which is the refund amount divided by the sale amount, and rounded to the nearest cent, with no part of the fixed fee credited.
      The refund credited is the refund most recently booked on the profile, and its sale is the sale that refund points to.
      The credited fee percentage is the tier's micropayment_fee_pct when the sale amount is below micropayment_threshold, and otherwise follows the sale channel: qr_code_fee_pct for a qr_code sale, tap_to_pay_fee_pct for a tap_to_pay sale, invoice_fee_pct for an invoice sale, and transaction_fee_pct for an in_app or online_checkout sale.
      The credited refund share follows the owner's personal plan: on Pocketwire Onyx or Pocketwire Summit the whole percentage part is credited whatever share was refunded; on Pocketwire Plus or Pocketwire Prime the refunded share is rounded up to the next whole tenth, never above the whole; on any other plan the refunded share is used exactly.
      The refund timing percentage is late_credit_pct percent when the refund is dated more than late_days calendar days after the sale, mid_credit_pct percent when it is dated more than prompt_days but no more than late_days calendar days after the sale, and full_credit_pct percent when it is dated no more than prompt_days calendar days after the sale.
      The refund percentage credit is the percentage part, worked out at the credited fee percentage, times the credited refund share, times the refund timing percentage divided by one hundred.
      The claim-settled refund credit follows how the refund was made: when the seller issued the refund as the response to a not_as_described buyer claim on that sale, the refund percentage credit is multiplied by nad_credit_multiplier and rounded down to the cent; when the refund answered an item_not_received claim, it is multiplied by inr_credit_multiplier and rounded down to the cent; a refund given without such a claim response keeps the refund percentage credit as it is.
      The refund fee credit is the claim-settled refund credit, rounded to the nearest cent only at that last step.
    prerequisite: []
    cross_category:
      - category: wallet
        as: branch
        reads: [variant_name]
        note: The credited refund share is decided by the plan of the owner's Pocketwire Personal Account.
    compute:
      - refund_sale: "LATEST('business_transactions', 'source_txn_id', date_field='txn_date', event_type='business_refund')"
      - refund_amount: "LATEST('business_transactions', 'amount', date_field='txn_date', event_type='business_refund')"
      - refund_date: "LATEST('business_transactions', 'txn_date', date_field='txn_date', event_type='business_refund')"
      - sale_amount: "SUM('business_transactions', 'amount', event_type='business_sale', business_txn_id=refund_sale)"
      - sale_date: "LATEST('business_transactions', 'txn_date', date_field='txn_date', event_type='business_sale', business_txn_id=refund_sale)"
      - sale_channel: "LATEST('business_transactions', 'sale_channel', date_field='txn_date', event_type='business_sale', business_txn_id=refund_sale)"
      - credited_pct: "P('micropayment_fee_pct') if sale_amount < P('micropayment_threshold') else (P('qr_code_fee_pct') if sale_channel == 'qr_code' else (P('tap_to_pay_fee_pct') if sale_channel == 'tap_to_pay' else (P('invoice_fee_pct') if sale_channel == 'invoice' else P('transaction_fee_pct'))))"
      - pct_part: "RND(sale_amount * credited_pct / 100, 2)"
      - owner_plan: "CFIELD('wallet', 'variant_name')"
      - refund_share: "1 if (owner_plan == 'Pocketwire Onyx' or owner_plan == 'Pocketwire Summit') else (MN(1, -((-(refund_amount / sale_amount) * 10) // 1) / 10) if (owner_plan == 'Pocketwire Plus' or owner_plan == 'Pocketwire Prime') else refund_amount / sale_amount)"
      - refund_timing_pct: "K('late_credit_pct') if DAYS(sale_date, refund_date) > K('late_days') else (K('mid_credit_pct') if DAYS(sale_date, refund_date) > K('prompt_days') else K('full_credit_pct'))"
      - pct_credit: "pct_part * refund_share * refund_timing_pct / 100"
      - claim_reason: "LATEST('business_claims', 'claim_reason', date_field='opened_date', event_type='business_claim_opened', sale_txn_id=refund_sale)"
      - refund_responses: "COUNT('business_claims', event_type='business_seller_response', sale_txn_id=refund_sale, response_type='refund_issued')"
      - settled_credit: "((pct_credit * K('nad_credit_multiplier') * 100) // 1) / 100 if (refund_responses >= 1 and claim_reason == 'not_as_described') else (((pct_credit * K('inr_credit_multiplier') * 100) // 1) / 100 if (refund_responses >= 1 and claim_reason == 'item_not_received') else pct_credit)"
      - result: "RND(settled_credit, 2)"
    compute_basis:
      refund_sale: "The refund credited is the refund most recently booked on the profile, and its sale is the sale that refund points to."
      refund_amount: "the refunded share, which is the refund amount divided by the sale amount"
      refund_date: "when the refund is dated more than late_days calendar days after the sale"
      sale_amount: "which is the sale amount times the tier's transaction_fee_pct rounded to the nearest cent"
      sale_date: "when the refund is dated more than late_days calendar days after the sale"
      sale_channel: "and otherwise follows the sale channel: qr_code_fee_pct for a qr_code sale, tap_to_pay_fee_pct for a tap_to_pay sale, invoice_fee_pct for an invoice sale, and transaction_fee_pct for an in_app or online_checkout sale."
      credited_pct: "The credited fee percentage is the tier's micropayment_fee_pct when the sale amount is below micropayment_threshold, and otherwise follows the sale channel: qr_code_fee_pct for a qr_code sale, tap_to_pay_fee_pct for a tap_to_pay sale, invoice_fee_pct for an invoice sale, and transaction_fee_pct for an in_app or online_checkout sale."
      pct_part: "The refund percentage credit is the percentage part, worked out at the credited fee percentage, times the credited refund share, times the refund timing percentage divided by one hundred. the percentage part of the refunded sale's transaction fee, which is the sale amount times the tier's transaction_fee_pct rounded to the nearest cent"
      owner_plan: "The credited refund share follows the owner's personal plan"
      refund_share: "The credited refund share follows the owner's personal plan: on Pocketwire Onyx or Pocketwire Summit the whole percentage part is credited whatever share was refunded; on Pocketwire Plus or Pocketwire Prime the refunded share is rounded up to the next whole tenth, never above the whole; on any other plan the refunded share is used exactly."
      refund_timing_pct: "The refund timing percentage is late_credit_pct percent when the refund is dated more than late_days calendar days after the sale, mid_credit_pct percent when it is dated more than prompt_days but no more than late_days calendar days after the sale, and full_credit_pct percent when it is dated no more than prompt_days calendar days after the sale."
      pct_credit: "The refund percentage credit is the percentage part, worked out at the credited fee percentage, times the credited refund share, times the refund timing percentage divided by one hundred."
      claim_reason: "when the seller issued the refund as the response to a not_as_described buyer claim on that sale"
      refund_responses: "when the seller issued the refund as the response to a not_as_described buyer claim on that sale"
      settled_credit: "The claim-settled refund credit follows how the refund was made: when the seller issued the refund as the response to a not_as_described buyer claim on that sale, the refund percentage credit is multiplied by nad_credit_multiplier and rounded down to the cent; when the refund answered an item_not_received claim, it is multiplied by inr_credit_multiplier and rounded down to the cent; a refund given without such a claim response keeps the refund percentage credit as it is."
      result: "The refund fee credit is the claim-settled refund credit, rounded to the nearest cent only at that last step."
    factors:
      - id: credited_fee_rate
        effect: parameter
        decides: credited_pct
        bindings: [sale_channel, credited_pct]
        ladder:
          - when: "the refunded sale's amount is below micropayment_threshold"
            value: "P('micropayment_fee_pct')"
          - when: "the sale is at or above micropayment_threshold and its channel is qr_code"
            value: "P('qr_code_fee_pct')"
          - when: "the sale is at or above micropayment_threshold and its channel is tap_to_pay"
            value: "P('tap_to_pay_fee_pct')"
          - when: "the sale is at or above micropayment_threshold and its channel is invoice"
            value: "P('invoice_fee_pct')"
          - when: "otherwise (in_app or online_checkout)"
            value: "P('transaction_fee_pct')"
        baseline:
          credited_pct: "P('transaction_fee_pct')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: plan_refund_share
        effect: method
        decides: refund_share
        bindings: [owner_plan, refund_share]
        ladder:
          - when: "the owner's personal account is on Pocketwire Onyx or Pocketwire Summit"
            method: "the whole percentage part is credited whatever share was refunded"
          - when: "the owner's personal account is on Pocketwire Plus or Pocketwire Prime"
            method: "the refunded share is rounded up to the next whole tenth, never above the whole"
          - when: "otherwise"
            method: "the refunded share is used exactly"
        baseline:
          refund_share: "refund_amount / sale_amount"
        evidence: [cross_category]
        cross_difficulty: wallet
      - id: claim_settlement_scaling
        effect: method
        decides: settled_credit
        bindings: [claim_reason, refund_responses, settled_credit]
        ladder:
          - when: "the seller issued the refund as the response to a not_as_described buyer claim on the sale"
            method: "the refund percentage credit is multiplied by nad_credit_multiplier and rounded down to the cent"
          - when: "the refund answered an item_not_received buyer claim on the sale"
            method: "the refund percentage credit is multiplied by inr_credit_multiplier and rounded down to the cent"
          - when: "otherwise"
            method: "the refund percentage credit is kept as it is"
        baseline:
          settled_credit: "pct_credit"
        evidence: [history]
        cross_difficulty: null
      - id: refund_timing
        effect: parameter
        decides: refund_timing_pct
        bindings: [refund_timing_pct]
        ladder:
          - when: "the refund is dated more than late_days calendar days after the sale"
            value: "K('late_credit_pct')"
          - when: "the refund is dated more than prompt_days but no more than late_days calendar days after the sale"
            value: "K('mid_credit_pct')"
          - when: "otherwise (no more than prompt_days calendar days after the sale)"
            value: "K('full_credit_pct')"
        baseline:
          refund_timing_pct: "K('full_credit_pct')"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard refund fee credit is the percentage part of the refunded sale's transaction fee, which is the sale amount times the tier's transaction_fee_pct rounded to the nearest cent, multiplied by the refunded share, which is the refund amount divided by the sale amount, and rounded to the nearest cent, with no part of the fixed fee credited.
      params: [transaction_fee_pct]
    inputs:
      history:
        - {table: business_transactions, aggregate: latest, field: amount, filters: {event_type: business_refund}}
        - {table: business_transactions, aggregate: sum, field: amount, filters: {event_type: business_sale}}
        - {table: business_claims, aggregate: count, field: business_claim_id, filters: {event_type: business_seller_response}}
      cross_category: [wallet]

  - id: business_ext_bank_payout_amount
    base_policy_refs: [business_payouts]
    overwrite:
      - base_policy: business_payouts
        superseded_clause: >-
          A payout can never exceed the available balance, which is business_balance less the funds under unreleased holds (business_msr_active_holds)
        replaced_by: >-
          A standard_bank payout that sends the most a profile can pay out to the owner's bank account is worked out from the balance cleared for a bank payout, which takes the place of the available balance for that payout.
      - base_policy: business_payouts
        superseded_clause: >-
          together with the day's earlier payouts (business_msr_payouts_today) may not exceed daily_payout_limit
        replaced_by: >-
          The bank payout amount is that cleared balance capped at the tier's daily_payout_limit less the payouts already dated on the handling date, never below zero, and rounded to the nearest cent.
    trigger: on_request
    subject: [business_payout]
    computes: amount
    target_tool: pay_out_to_bank_7d50e7f4
    params:
      return_window_months: 6
      return_high_count: 2
      return_high_amount: 600.0
      return_low_amount: 250.0
      refund_high_share: 0.05
      refund_low_share: 0.02
      refund_high_pct: 5
      refund_low_pct: 2
      invoice_new_months: 12
      invoice_settled_months: 24
      ratio_window_months: 3
      ratio_high_pct: 8
      ratio_low_pct: 3
      paylater_active_pct: 20
      delivery_low_rate: 0.5
      delivery_high_rate: 0.8
      delivery_low_keep_pct: 4
      delivery_mid_keep_pct: 1.5
    rule: >-
      A standard_bank payout that sends the most a profile can pay out to the owner's bank account is worked out from the balance cleared for a bank payout, which takes the place of the available balance for that payout.
      The standard bank payout amount is the business balance less the holds counted against a bank payout; what remains, never below zero, is paid out in full to the cent within the tier's daily_payout_limit less the payouts already dated on the handling date.
      The holds counted against a bank payout are the amount of every hold entry on the profile less the amount of every hold release entry on it.
      A rolling window of a number of months ending on the handling date covers the dates after the same calendar day that many months earlier, up to and including the handling date, and a profile's age in whole months counts a month once the same day of the month as its opening date is reached.
      The bank return keep-back is return_high_amount dollars when at least return_high_count returns of standard_bank payouts are dated within the rolling return_window_months months ending on the handling date, return_low_amount dollars when at least one but fewer than return_high_count are, and nothing when none is.
      The refund exposure percentage is refund_high_pct percent when the refunds dated within the rolling month ending on the handling date are at least refund_high_share of the sales dated in that month, refund_low_pct percent when they are at least refund_low_share but less than refund_high_share of them, and nothing when they are less; the refund exposure keep-back is that percentage of the month's sales, rounded to the nearest cent.
      The invoice sales still clearing are every invoice sale dated within the rolling month ending on the handling date for a profile fewer than invoice_new_months whole months old, half of those invoice sales rounded down to whole dollars for a profile at least invoice_new_months but fewer than invoice_settled_months whole months old, and none for an older profile.
      The chargeback-ratio reserve percentage is ratio_high_pct percent when the chargebacks dated within the rolling ratio_window_months months ending on the handling date are more than the tier's chargeback_ratio_review_threshold_pct percent of the sales dated in that window, ratio_low_pct percent when they are more than half of that percentage but not more than it, and nothing otherwise; the chargeback-ratio reserve is that percentage of the rolling month's sales, rounded to the nearest cent.
      The bank Pay in 4 keep-back is the whole amount owed on the owner's Pocketwire Pay in 4 account when that account is past_due or suspended, paylater_active_pct percent of the amount owed, rounded to the nearest cent, when the account is active and owes more than zero, and nothing when the owner has no such account or owes nothing on it.
      The delivery confirmation keep-back percentage is delivery_low_keep_pct percent when the carrier delivery confirmations dated within the rolling month ending on the handling date number fewer than delivery_low_rate times the sales dated in that month, delivery_mid_keep_pct percent when they number at least delivery_low_rate but fewer than delivery_high_rate times those sales, and nothing when they reach delivery_high_rate times those sales; the delivery confirmation keep-back is that percentage of the month's sales, rounded to the nearest cent.
      The balance cleared for a bank payout is the business balance less the holds counted against a bank payout, the bank return keep-back, the refund exposure keep-back, the invoice sales still clearing, the chargeback-ratio reserve, the bank Pay in 4 keep-back and the delivery confirmation keep-back, all taken from that one balance.
      The bank payout amount is that cleared balance capped at the tier's daily_payout_limit less the payouts already dated on the handling date, never below zero, and rounded to the nearest cent.
      The bank payout amount is fixed only after every refund booked on the profile carries its refund fee credit entry, on a tier that credits part of the transaction fee back on refunds.
      The bank payout amount is not fixed until every chargeback debited on the profile carries its chargeback fee entry.
    prerequisite:
      - problem: business_ext_refund_fee_credit
        kind: value_input
        gate: balance
        form: state
        policy_source: >-
          The bank payout amount is fixed only after every refund booked on the profile carries its refund fee credit entry, on a tier that credits part of the transaction fee back on refunds.
        condition: >-
          On a tier whose fee_refund_pct_portion_on_refund is true, the transaction fee of every sale carrying a business_refund entry has a business_fee_credit entry pointing to it, and business_profiles.business_balance already reflects that credit.
        resolved_by: credit_refund_fee_b8556c63
        effect: >-
          The balance binding rises by the booked refund fee credit, which raises the balance cleared for a bank payout and so the bank payout amount.
      - problem: business_ext_chargeback_fee_charge
        kind: value_input
        gate: balance
        form: state
        policy_source: >-
          The bank payout amount is not fixed until every chargeback debited on the profile carries its chargeback fee entry.
        condition: >-
          Every business_chargeback entry on the profile has a business_fee entry with fee_type chargeback_fee pointing to it, and business_profiles.business_balance already reflects that fee.
        resolved_by: book_chargeback_fee_9ab6815a
        effect: >-
          The balance binding drops by the booked chargeback fee, which lowers the balance cleared for a bank payout and so the bank payout amount.
    cross_category:
      - category: paylater
        as: branch
        reads: [status, amount_owed]
        note: The bank Pay in 4 keep-back is decided by the status and amount owed on the owner's Pocketwire Pay in 4 account.
    compute:
      - balance: "F('business_balance')"
      - open_holds: "SUM('business_transactions', 'amount', event_type='business_payment_hold') - SUM('business_transactions', 'amount', event_type='business_hold_release')"
      - bank_returns: "COUNT('business_transactions', within_months=K('return_window_months'), date_field='txn_date', event_type='business_payout_return', payout_method='standard_bank')"
      - return_keepback: "K('return_high_amount') if bank_returns >= K('return_high_count') else (K('return_low_amount') if bank_returns >= 1 else 0)"
      - month_sales: "SUM('business_transactions', 'amount', within_months=1, date_field='txn_date', event_type='business_sale')"
      - month_refunds: "SUM('business_transactions', 'amount', within_months=1, date_field='txn_date', event_type='business_refund')"
      - refund_keep_pct: "K('refund_high_pct') if month_refunds >= K('refund_high_share') * month_sales else (K('refund_low_pct') if month_refunds >= K('refund_low_share') * month_sales else 0)"
      - refund_keepback: "RND(month_sales * refund_keep_pct / 100, 2)"
      - month_invoices: "SUM('business_transactions', 'amount', within_months=1, date_field='txn_date', event_type='business_sale', sale_channel='invoice')"
      - invoice_clearing: "month_invoices if MONTHS(F('opened_date'), NOW) < K('invoice_new_months') else ((month_invoices / 2) // 1 if MONTHS(F('opened_date'), NOW) < K('invoice_settled_months') else 0)"
      - ratio_chargebacks: "COUNT('business_transactions', within_months=K('ratio_window_months'), date_field='txn_date', event_type='business_chargeback')"
      - ratio_sales: "COUNT('business_transactions', within_months=K('ratio_window_months'), date_field='txn_date', event_type='business_sale')"
      - ratio_reserve_pct: "K('ratio_high_pct') if ratio_chargebacks * 100 > P('chargeback_ratio_review_threshold_pct') * ratio_sales else (K('ratio_low_pct') if ratio_chargebacks * 100 > P('chargeback_ratio_review_threshold_pct') * ratio_sales / 2 else 0)"
      - ratio_reserve: "RND(month_sales * ratio_reserve_pct / 100, 2)"
      - paylater_status: "CFIELD('paylater', 'status')"
      - paylater_owed: "CFIELD('paylater', 'amount_owed')"
      - paylater_keepback: "float(paylater_owed) if (paylater_status == 'past_due' or paylater_status == 'suspended') else (RND(float(paylater_owed) * K('paylater_active_pct') / 100, 2) if (paylater_status == 'active' and float(paylater_owed or 0) > 0) else 0)"
      - month_deliveries: "COUNT('business_transactions', within_months=1, date_field='txn_date', event_type='business_delivery_confirmed')"
      - month_sale_count: "COUNT('business_transactions', within_months=1, date_field='txn_date', event_type='business_sale')"
      - delivery_keep_pct: "K('delivery_low_keep_pct') if month_deliveries < K('delivery_low_rate') * month_sale_count else (K('delivery_mid_keep_pct') if month_deliveries < K('delivery_high_rate') * month_sale_count else 0)"
      - delivery_keepback: "RND(month_sales * delivery_keep_pct / 100, 2)"
      - cleared: "balance - open_holds - return_keepback - refund_keepback - invoice_clearing - ratio_reserve - paylater_keepback - delivery_keepback"
      - daily_room: "P('daily_payout_limit') - SUM('business_transactions', 'amount', event_type='business_payout', txn_date=NOW)"
      - result: "RND(MX(0, MN(cleared, daily_room)), 2)"
    compute_basis:
      balance: "The balance cleared for a bank payout is the business balance less the holds counted against a bank payout"
      open_holds: "The holds counted against a bank payout are the amount of every hold entry on the profile less the amount of every hold release entry on it."
      bank_returns: "when at least return_high_count returns of standard_bank payouts are dated within the rolling return_window_months months ending on the handling date"
      return_keepback: "The bank return keep-back is return_high_amount dollars when at least return_high_count returns of standard_bank payouts are dated within the rolling return_window_months months ending on the handling date, return_low_amount dollars when at least one but fewer than return_high_count are, and nothing when none is."
      month_sales: "of the sales dated in that month. A rolling window of a number of months ending on the handling date covers the dates after the same calendar day that many months earlier, up to and including the handling date"
      month_refunds: "when the refunds dated within the rolling month ending on the handling date"
      refund_keep_pct: "The refund exposure percentage is refund_high_pct percent when the refunds dated within the rolling month ending on the handling date are at least refund_high_share of the sales dated in that month, refund_low_pct percent when they are at least refund_low_share but less than refund_high_share of them, and nothing when they are less"
      refund_keepback: "the refund exposure keep-back is that percentage of the month's sales, rounded to the nearest cent."
      month_invoices: "every invoice sale dated within the rolling month ending on the handling date"
      invoice_clearing: "The invoice sales still clearing are every invoice sale dated within the rolling month ending on the handling date for a profile fewer than invoice_new_months whole months old, half of those invoice sales rounded down to whole dollars for a profile at least invoice_new_months but fewer than invoice_settled_months whole months old, and none for an older profile."
      ratio_chargebacks: "when the chargebacks dated within the rolling ratio_window_months months ending on the handling date"
      ratio_sales: "are more than the tier's chargeback_ratio_review_threshold_pct percent of the sales dated in that window"
      ratio_reserve_pct: "The chargeback-ratio reserve percentage is ratio_high_pct percent when the chargebacks dated within the rolling ratio_window_months months ending on the handling date are more than the tier's chargeback_ratio_review_threshold_pct percent of the sales dated in that window, ratio_low_pct percent when they are more than half of that percentage but not more than it, and nothing otherwise"
      ratio_reserve: "the chargeback-ratio reserve is that percentage of the rolling month's sales, rounded to the nearest cent."
      paylater_status: "when that account is past_due or suspended"
      paylater_owed: "The bank Pay in 4 keep-back is the whole amount owed on the owner's Pocketwire Pay in 4 account"
      paylater_keepback: "The bank Pay in 4 keep-back is the whole amount owed on the owner's Pocketwire Pay in 4 account when that account is past_due or suspended, paylater_active_pct percent of the amount owed, rounded to the nearest cent, when the account is active and owes more than zero, and nothing when the owner has no such account or owes nothing on it."
      month_deliveries: "when the carrier delivery confirmations dated within the rolling month ending on the handling date"
      month_sale_count: "number fewer than delivery_low_rate times the sales dated in that month"
      delivery_keep_pct: "The delivery confirmation keep-back percentage is delivery_low_keep_pct percent when the carrier delivery confirmations dated within the rolling month ending on the handling date number fewer than delivery_low_rate times the sales dated in that month, delivery_mid_keep_pct percent when they number at least delivery_low_rate but fewer than delivery_high_rate times those sales, and nothing when they reach delivery_high_rate times those sales"
      delivery_keepback: "the delivery confirmation keep-back is that percentage of the month's sales, rounded to the nearest cent."
      cleared: "The balance cleared for a bank payout is the business balance less the holds counted against a bank payout, the bank return keep-back, the refund exposure keep-back, the invoice sales still clearing, the chargeback-ratio reserve, the bank Pay in 4 keep-back and the delivery confirmation keep-back, all taken from that one balance."
      daily_room: "capped at the tier's daily_payout_limit less the payouts already dated on the handling date"
      result: "The bank payout amount is that cleared balance capped at the tier's daily_payout_limit less the payouts already dated on the handling date, never below zero, and rounded to the nearest cent."
    factors:
      - id: bank_return_keepback
        effect: parameter
        decides: return_keepback
        bindings: [bank_returns, return_keepback]
        ladder:
          - when: "at least return_high_count standard_bank payout returns are dated in the rolling return_window_months months"
            value: "K('return_high_amount')"
          - when: "at least one but fewer than return_high_count are"
            value: "K('return_low_amount')"
          - when: "otherwise"
            value: "0"
        baseline:
          return_keepback: "0"
        evidence: [history]
        cross_difficulty: null
      - id: refund_exposure
        effect: parameter
        decides: refund_keep_pct
        bindings: [month_refunds, refund_keep_pct]
        ladder:
          - when: "the rolling month's refunds are at least refund_high_share of its sales"
            value: "K('refund_high_pct')"
          - when: "the rolling month's refunds are at least refund_low_share but less than refund_high_share of its sales"
            value: "K('refund_low_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          refund_keep_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: invoice_clearing
        effect: method
        decides: invoice_clearing
        bindings: [month_invoices, invoice_clearing]
        ladder:
          - when: "the profile is fewer than invoice_new_months whole months old"
            method: "every invoice sale of the rolling month is still clearing"
          - when: "the profile is at least invoice_new_months but fewer than invoice_settled_months whole months old"
            method: "half of the rolling month's invoice sales, rounded down to whole dollars, is still clearing"
          - when: "otherwise"
            method: "no invoice sale is still clearing"
        baseline:
          invoice_clearing: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: ratio_reserve
        effect: parameter
        decides: ratio_reserve_pct
        bindings: [ratio_chargebacks, ratio_sales, ratio_reserve_pct]
        ladder:
          - when: "chargebacks in the rolling ratio_window_months months are more than chargeback_ratio_review_threshold_pct percent of that window's sales"
            value: "K('ratio_high_pct')"
          - when: "they are more than half of that percentage but not more than it"
            value: "K('ratio_low_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          ratio_reserve_pct: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: paylater_keepback
        effect: parameter
        decides: paylater_keepback
        bindings: [paylater_status, paylater_owed, paylater_keepback]
        ladder:
          - when: "the owner's Pocketwire Pay in 4 account is past_due or suspended"
            value: "the whole amount_owed"
          - when: "the owner's Pocketwire Pay in 4 account is active and owes more than zero"
            value: "K('paylater_active_pct') percent of amount_owed"
          - when: "otherwise"
            value: "0"
        baseline:
          paylater_keepback: "0"
        evidence: [cross_category]
        cross_difficulty: paylater
      - id: delivery_confirmation_keepback
        effect: parameter
        decides: delivery_keep_pct
        bindings: [month_deliveries, month_sale_count, delivery_keep_pct]
        ladder:
          - when: "the rolling month's carrier delivery confirmations are fewer than delivery_low_rate times its sales"
            value: "K('delivery_low_keep_pct')"
          - when: "they are at least delivery_low_rate but fewer than delivery_high_rate times its sales"
            value: "K('delivery_mid_keep_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          delivery_keep_pct: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard bank payout amount is the business balance less the holds counted against a bank payout; what remains, never below zero, is paid out in full to the cent within the tier's daily_payout_limit less the payouts already dated on the handling date.
        The holds counted against a bank payout are the amount of every hold entry on the profile less the amount of every hold release entry on it.
      params: [daily_payout_limit]
    inputs:
      history:
        - {table: business_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: business_sale}}
        - {table: business_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: business_refund}}
        - {table: business_transactions, aggregate: count, field: business_txn_id, within_months: 6, filters: {event_type: business_payout_return}}
        - {table: business_transactions, aggregate: count, field: business_txn_id, within_months: 1, filters: {event_type: business_delivery_confirmed}}
      cross_category: [paylater]
