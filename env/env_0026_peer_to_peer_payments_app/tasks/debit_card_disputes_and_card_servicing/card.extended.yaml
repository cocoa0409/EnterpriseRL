      tenure_months: "has been open long_tenure_months or more whole months on the filing date"
      tenure_courtesy: "The tenure courtesy is tenure_courtesy_long when the linked personal account has been open long_tenure_months or more whole months on the filing date, tenure_courtesy_mid when it has been open mid_tenure_months or more but fewer than long_tenure_months whole months, and 0.00 when it has been open fewer than mid_tenure_months whole months."
