      - purchase_ref: "LATEST('card_transactions','card_txn_id', date_field='txn_date', event_type='card_purchase')"
      - linked_authorization: "SUM('card_transactions','amount', event_type='card_authorization_hold', card_txn_id=LATEST('card_transactions','source_txn_id', date_field='txn_date', event_type='card_purchase'))"
      - authorization_count: "COUNT('card_transactions', event_type='card_authorization_hold')"
      - same_day_authorizations: "COUNT('card_transactions', event_type='card_authorization_hold', txn_date=LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_authorization_hold'))"
      - authorized_reference: "SUM('card_transactions','amount', event_type='card_authorization_hold') if (authorization_count >= 2 and same_day_authorizations == authorization_count) else (MAX('card_transactions','amount', event_type='card_authorization_hold') if (authorization_count >= 2 and same_day_authorizations < authorization_count) else linked_authorization)"
      - dining_online: "COUNT('card_transactions', event_type='card_purchase', merchant_category='dining', entry_mode='online')"
      - dining_contactless: "COUNT('card_transactions', event_type='card_purchase', merchant_category='dining', entry_mode='contactless')"
      - dining_any: "COUNT('card_transactions', event_type='card_purchase', merchant_category='dining')"
      - gratuity_pct: "K('delivery_gratuity_pct') if (dining_any >= 1 and dining_online >= 1) else (K('table_gratuity_pct') if (dining_any >= 1 and dining_contactless >= 1) else 0)"
      - foreign_purchases: "COUNT('card_transactions', event_type='card_purchase', is_foreign=True)"
      - settlement_lag_days: "DAYS(LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_authorization_hold'), LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_purchase'))"
      - exchange_pct: "K('fx_tolerance_slow_pct') if (foreign_purchases >= 1 and settlement_lag_days >= K('slow_settlement_days')) else (K('fx_tolerance_prompt_pct') if (foreign_purchases >= 1 and settlement_lag_days < K('slow_settlement_days')) else 0)"
      - credits_all: "SUM('card_transactions','amount', event_type='card_merchant_refund')"
      - credits_linked: "SUM('card_transactions','amount', event_type='card_merchant_refund', source_txn_id=purchase_ref)"
      - latest_unlinked_credit: "LATEST('card_transactions','amount', date_field='txn_date', event_type='card_merchant_refund', source_txn_id='')"
      - credits_counted: "credits_all if (credits_all > 0 and credits_linked == 0) else (credits_linked + latest_unlinked_credit if (credits_linked > 0 and credits_all > credits_linked) else credits_linked)"
      - gratuity_allowance: "RND(authorized_reference * gratuity_pct / 100, 2)"
      - exchange_allowance: "RND(authorized_reference * exchange_pct / 100, 2)"
      - result: "RND(MN(settled_amount, MX(0, settled_amount - authorized_reference - gratuity_allowance - exchange_allowance - credits_counted)), 2)"
