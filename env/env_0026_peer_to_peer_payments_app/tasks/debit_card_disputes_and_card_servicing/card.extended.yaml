events:
  - type: card_issue
    target: card_accounts
    mutation: create
    meaning: A physical, virtual or single-use virtual card is issued — a first card, an additional virtual card, a replacement, a renewal before expiry or a card on a new tier.
    grain: One row per card issued.
    fields:
      customer_id: The cardholder.
      wallet_id: The personal account the card draws on.
      variant_name: The card tier, written as the official card name.
      card_form: physical, virtual or single_use_virtual.
      card_last4: Last four digits of the new card number.
      issued_date: Issue date.
      expiry_month: Expiry month printed on the card.
      delivery_speed: standard or expedited for physical cards; not_applicable for virtual cards.
      custom_design: Whether the physical card carries a custom design.
      replaces_card_id: The card this one replaces or renews; empty on a first or additional card.
      issue_reason: Why the card was issued.
    triggers:
      - event: card:card_fee
        when: {delivery_speed: expedited}
        map: {card_fee_type: expedited_shipping_fee, txn_date: issued_date}
      - event: card:card_fee
        when: {custom_design: true}
        map: {card_fee_type: custom_design_fee, txn_date: issued_date}
      - event: card:card_fee
        when: {issue_reason: [replacement_lost, replacement_damaged]}
        map: {card_fee_type: replacement_card_fee, txn_date: issued_date}
  - type: card_activate
    target: card_accounts
    mutation: {transition: {from: ordered, to: active}}
    meaning: The customer activates the card.
    grain: One row per card.
    fields:
      status: Becomes active.
      activated_date: Activation date; the new-card period counts from it.
    triggers: []
  - type: card_lock
    target: card_accounts
    mutation: {transition: {from: active, to: locked}}
    meaning: The card is locked.
    grain: One row per card.
    fields:
      status: Becomes locked.
    triggers: []
  - type: card_unlock
    target: card_accounts
    mutation: {transition: {from: locked, to: active}}
    meaning: The card lock is removed.
    grain: One row per card.
    fields:
      status: Returns to active.
    triggers: []
  - type: card_block
    target: card_accounts
    mutation: {transition: [{from: active, to: blocked}, {from: locked, to: blocked}, {from: ordered, to: blocked}]}
    meaning: The card is permanently blocked after a lost, stolen, compromised or damaged report.
    grain: One row per card.
    fields:
      status: Becomes blocked.
      block_reason: lost, stolen, compromised or damaged.
      blocked_date: Date of the block.
    triggers: []
  - type: card_close
    target: card_accounts
    mutation: {transition: [{from: ordered, to: closed}, {from: active, to: closed}, {from: locked, to: closed}, {from: blocked, to: closed}]}
    meaning: The card is closed.
    grain: One row per card.
    fields:
      status: Becomes closed.
      closed_date: Closure date.
    triggers: []
  - type: card_authorization_hold
    target: card_transactions
    meaning: A merchant authorization places a pending hold on the card before the purchase settles.
    grain: One row per authorization.
    distinguish_by: [txn_reference]
    fields:
      txn_reference: The network authorization reference.
      txn_date: Authorization date.
      amount: Amount held.
      merchant_name: Merchant as shown in the app.
      merchant_category: Merchant category.
      hold_type: standard or extended.
    triggers: []
  - type: card_hold_release
    target: card_transactions
    meaning: An authorization hold is released without settling.
    grain: One row per released authorization.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The authorization hold released.
      txn_date: Release date.
      amount: Amount released, equal to the hold.
    triggers: []
  - type: card_purchase
    target: card_transactions
    meaning: A card purchase settles.
    grain: One row per settled purchase.
    distinguish_by: [txn_reference]
    fields:
      txn_reference: The network settlement reference shown in the app.
      source_txn_id: The authorization hold this purchase settled; empty for purchases settled without a prior hold.
      txn_date: Settlement date.
      amount: Settled amount in USD.
      merchant_name: Merchant as shown in the app.
      merchant_category: Merchant category.
      entry_mode: chip, contactless, online or recurring.
      is_foreign: Whether the purchase was processed outside the United States or in a foreign currency.
    account: card_ledger
    direction: out
    triggers:
      - event: card:card_fee
        when: {is_foreign: true}
        map: {card_fee_type: foreign_transaction_fee, source_txn_id: card_txn_id, txn_date: txn_date}
      - event: rewards:rewards_cashback_earned
        map: {source_txn_id: card_txn_id, spend_amount: amount, merchant_category: merchant_category, entry_date: txn_date}
  - type: card_atm_withdrawal
    target: card_transactions
    meaning: Cash is withdrawn at an ATM.
    grain: One row per ATM withdrawal.
    distinguish_by: [txn_reference]
    fields:
      txn_reference: The network reference shown in the app.
      txn_date: Withdrawal date.
      amount: Amount debited, including any ATM-owner surcharge.
      atm_network: in_network, out_of_network or international.
      atm_operator_surcharge: Surcharge the ATM owner added, included in amount.
      merchant_name: ATM owner name.
    account: card_ledger
    direction: out
    triggers:
      - event: card:card_fee
        when: {atm_network: out_of_network}
        map: {card_fee_type: pocketwire_atm_fee, source_txn_id: card_txn_id, txn_date: txn_date}
      - event: card:card_fee
        when: {atm_network: international}
        map: {card_fee_type: international_atm_fee, source_txn_id: card_txn_id, txn_date: txn_date}
  - type: card_fee
    target: card_transactions
    meaning: A card fee is charged.
    grain: One row per fee charged.
    distinguish_by: [card_fee_type, source_txn_id, txn_date]
    fields:
      card_fee_type: Which fee.
      source_txn_id: The purchase or withdrawal the fee belongs to; empty on issuance fees.
      txn_date: Date charged.
      amount: Fee amount (0.00 when a withdrawal falls inside the free monthly allowance).
    account: card_ledger
    direction: out
    triggers: []
  - type: card_fee_refund
    target: card_transactions
    meaning: A card fee is refunded in whole or in part.
    grain: One row per refunded fee.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The fee row being refunded.
      card_fee_type: Type of the refunded fee.
      txn_date: Refund date.
      amount: Refunded amount.
    account: card_ledger
    direction: in
    triggers: []
  - type: card_atm_reimbursement
    target: card_transactions
    meaning: An ATM-owner surcharge is reimbursed.
    grain: One row per reimbursed withdrawal.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The ATM withdrawal whose surcharge is reimbursed.
      txn_date: Reimbursement date.
      amount: Reimbursed amount.
    account: card_ledger
    direction: in
    triggers: []
  - type: card_merchant_refund
    target: card_transactions
    meaning: A merchant sends a refund credit to the card.
    grain: One row per merchant credit.
    distinguish_by: [txn_reference]
    fields:
      txn_reference: The network reference of the credit.
      source_txn_id: The purchase being refunded, when the network links it; empty for an unlinked credit.
      txn_date: Date the credit posted.
      amount: Credit amount.
      merchant_name: Merchant as shown in the app.
      is_foreign: Whether the original purchase was foreign.
    account: card_ledger
    direction: in
    triggers:
      - event: rewards:rewards_clawback
        when: {source_txn_id: {not: ""}}
        map: {source_txn_id: source_txn_id, spend_amount: amount, entry_date: txn_date}
      - event: card:card_fee_refund
        when: {is_foreign: true}
        map: {card_fee_type: foreign_transaction_fee, txn_date: txn_date}
  - type: card_provisional_credit
    target: card_transactions
    meaning: Provisional credit is posted on a pending card dispute.
    grain: One row per dispute credited.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The disputed card transaction.
      txn_date: Posting date.
      amount: Provisional credit amount.
    account: card_ledger
    direction: in
    triggers: []
  - type: card_provisional_credit_reversal
    target: card_transactions
    meaning: Provisional credit on a card dispute is taken back after denial or withdrawal.
    grain: One row per reversed provisional credit.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The disputed card transaction.
      txn_date: Reversal date.
      amount: Amount reversed, equal to the provisional credit.
    account: card_ledger
    direction: out
    triggers: []
  - type: card_dispute_credit
    target: card_transactions
    meaning: Final credit on a card dispute that received no provisional credit — a small dispute credited on filing or an approval without prior provisional credit.
    grain: One row per dispute credited.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The disputed card transaction.
      txn_date: Credit date.
      amount: Credited amount.
    account: card_ledger
    direction: in
    triggers: []
  - type: card_dispute_filed
    target: card_disputes
    meaning: The customer disputes a settled card purchase or ATM withdrawal.
    grain: One row per dispute filed.
    distinguish_by: [card_txn_id]
    fields:
      card_txn_id: The disputed card transaction.
      dispute_reason: Why it is disputed.
      reported_date: Filing date.
      dispute_amount: Amount disputed.
      customer_liability: Liability computed at filing (unauthorized disputes; 0.00 otherwise).
      resolution: Always pending on a filed dispute.
      provisional_credit_posted: Always false on a filed dispute.
    triggers: []
  - type: card_dispute_resolved
    target: card_disputes
    meaning: A card dispute reaches its outcome.
    grain: One row per dispute resolved.
    distinguish_by: [card_txn_id]
    fields:
      card_txn_id: The disputed card transaction.
      dispute_reason: As filed.
      resolution: approved, denied or withdrawn.
      resolution_date: Date of the outcome.
      dispute_amount: As filed.
      customer_liability: As computed at filing.
      provisional_credit_posted: Whether provisional credit had been posted before the outcome.
    triggers:
      - event: card:card_provisional_credit_reversal
        when: {resolution: [denied, withdrawn], provisional_credit_posted: true}
        map: {source_txn_id: card_txn_id, txn_date: resolution_date}
      - event: card:card_dispute_credit
        when: {resolution: approved, provisional_credit_posted: false}
        map: {source_txn_id: card_txn_id, txn_date: resolution_date}

measures:
  - id: card_msr_purchases_today
    window: The handling calendar day, Eastern Time.
    measure: Sum of amount over card_purchase rows on all of the customer's cards with txn_date equal to the handling date.
  - id: card_msr_virtual_purchases_today
    window: The handling calendar day, Eastern Time.
    measure: Sum of amount over card_purchase rows on the customer's virtual and single-use virtual cards with txn_date equal to the handling date.
  - id: card_msr_atm_today
    window: The handling calendar day, Eastern Time.
    measure: Sum of amount and count of rows over card_atm_withdrawal rows on all of the customer's cards with txn_date equal to the handling date.
  - id: card_msr_free_atm_used_month
    window: The calendar month containing the handling date, up to the handling date.
    measure: Count of card_atm_withdrawal rows with atm_network out_of_network on all of the customer's cards in the window, not counting the withdrawal being assessed.
  - id: card_msr_atm_reimbursed_month
    window: The calendar month containing the handling date, up to the handling date.
    measure: Sum of amount over card_atm_reimbursement rows on all of the customer's cards with txn_date in the window.
  - id: card_msr_disputes_12m
    window: Rolling 365 calendar days ending on the handling date.
    measure: Count of card_dispute_filed rows on all of the customer's cards with reported_date in the window, not counting the dispute being filed.
  - id: card_msr_paid_replacements_12m
    window: Rolling 365 calendar days ending on the new card's issue date.
    measure: Count of card_issue rows of the customer with issue_reason replacement_lost or replacement_damaged and issued_date in the window, not counting the card being issued.
  - id: card_msr_single_use_month
    window: The calendar month containing the handling date.
    measure: Count of card_issue rows of the customer with card_form single_use_virtual and issued_date in the window.

policies:
  - id: card_agg_multi_holding
    subject: [card_issue]
    rule: >-
      A customer may hold several cards at once: at most physical_card_limit_per_customer non-closed physical card, at most max_virtual_cards non-closed reusable virtual cards, and at most single_use_virtual_cards_per_month single-use virtual cards issued per calendar month (card_msr_single_use_month), each count read from the tier of the card being issued.
      A replacement or renewal physical card may be issued while the card it replaces is still blocked or active, because the replaced card closes when the replacement is activated; it never counts twice against the physical card limit.
      A request beyond any of these counts is refused and no card is issued.
    eligibility: []
    measures: [card_msr_single_use_month]
    params:
      max_per_customer: null
      per_tier:
        Pocketwire Visa Classic Debit: {physical_card_limit_per_customer: =physical_card_limit_per_customer, max_virtual_cards: =max_virtual_cards, single_use_virtual_cards_per_month: =single_use_virtual_cards_per_month}
        Pocketwire Visa Gold Debit: {physical_card_limit_per_customer: =physical_card_limit_per_customer, max_virtual_cards: =max_virtual_cards, single_use_virtual_cards_per_month: =single_use_virtual_cards_per_month}
        Pocketwire Visa Platinum Debit: {physical_card_limit_per_customer: =physical_card_limit_per_customer, max_virtual_cards: =max_virtual_cards, single_use_virtual_cards_per_month: =single_use_virtual_cards_per_month}
        Pocketwire Visa Signature Debit: {physical_card_limit_per_customer: =physical_card_limit_per_customer, max_virtual_cards: =max_virtual_cards, single_use_virtual_cards_per_month: =single_use_virtual_cards_per_month}
        Pocketwire Visa Infinite Debit: {physical_card_limit_per_customer: =physical_card_limit_per_customer, max_virtual_cards: =max_virtual_cards, single_use_virtual_cards_per_month: =single_use_virtual_cards_per_month}
        Pocketwire Visa Infinite Metal Debit: {physical_card_limit_per_customer: =physical_card_limit_per_customer, max_virtual_cards: =max_virtual_cards, single_use_virtual_cards_per_month: =single_use_virtual_cards_per_month}

  - id: card_agg_shared_limits
    subject: [card_purchase, card_atm_withdrawal]
    rule: >-
      Daily purchase and ATM limits are shared across all of the customer's cards: the per_transaction_purchase_limit and the virtual_card_daily_purchase_limit are read from the tier of the card used, while the customer's daily totals (card_msr_purchases_today, card_msr_virtual_purchases_today and card_msr_atm_today) are compared against the highest daily_purchase_limit, daily_atm_withdrawal_limit and atm_withdrawals_per_day among the customer's cards that are active or locked.
      A purchase or withdrawal can also never exceed the displayed available balance — the linked personal ledger balance plus the card ledger net, less open authorization holds.
      A transaction that would breach any limit or the available balance is declined at the terminal and is never booked; there is no overdraft and no declined-transaction fee.
    eligibility: []
    measures: [card_msr_purchases_today, card_msr_virtual_purchases_today, card_msr_atm_today]
    formula:
      purchase_allowed: "amount <= per_transaction_purchase_limit and card_msr_purchases_today + amount <= daily_purchase_limit"

  - id: card_issue_eligibility
    subject: [card_issue]
    rule: >-
      A card is issued only when the linked personal account is active, its kyc_status is verified and its plan is at or above the plan named in the card tier's entry_gate linked_wallet_plan_min; the Pocketwire Visa Signature Debit additionally needs the personal account opened at least the entry_gate min_wallet_account_age_days before the issue date.
      Holding a personal account plan therefore decides which card tiers are open to the customer, and a customer whose plan is later downgraded keeps the cards already issued until their expiry or replacement, when the replacement is issued on the highest tier the plan then allows.
      A custom design adds custom_design_fee and expedited delivery adds expedited_shipping_fee, each charged on the issue date; virtual cards are issued instantly and carry no delivery or design fee.
      A physical card arrives within standard_delivery_business_days business days, or expedited_delivery_business_days with expedited delivery, and is metal on tiers whose metal_card is true; every card's expiry_month is card_validity_years after its issue month.
      A renewal card is issued automatically reissue_before_expiry_days before the expiry month starts and carries no fee.
    eligibility:
      - id: linked_account_active
        applies_to: [card_issue]
        kind: authorization
        condition: "A card is issued only when the linked personal account is active, its kyc_status is verified and its plan is at or above the plan named in the card tier's entry_gate linked_wallet_plan_min"
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.status, wallet_accounts.kyc_status, wallet_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id

  - id: card_replacement_fees
    subject: [card_issue, card_fee]
    rule: >-
      A replacement for a card blocked as stolen or compromised is free, and it ships expedited at no charge on tiers whose stolen_replacement_expedited_free is true.
      A replacement for a card blocked as lost or damaged is free while the customer's paid-reason replacements over the rolling 365 days (card_msr_paid_replacements_12m) are fewer than free_replacements_per_year; beyond that, replacement_card_fee is charged on the issue date, and the replacement_card_fee row is booked with amount 0.00 when the replacement falls inside the allowance.
      A replacement is issued on the same tier as the blocked card unless the linked plan no longer allows that tier; the new card gets a new number and the blocked card's number never works again.
      Replacement and shipping fees are refunded only when Pocketwire shipped a card that never arrived and the customer reports it within standard or expedited delivery time plus 5 business days, in which case the replacement for the missing card is free.
    eligibility: []
    measures: [card_msr_paid_replacements_12m]
    params:
      undelivered_report_grace_business_days: 5
      per_tier:
        Pocketwire Visa Classic Debit: {replacement_card_fee: =replacement_card_fee, free_replacements_per_year: =free_replacements_per_year, stolen_replacement_expedited_free: =stolen_replacement_expedited_free}
        Pocketwire Visa Gold Debit: {replacement_card_fee: =replacement_card_fee, free_replacements_per_year: =free_replacements_per_year, stolen_replacement_expedited_free: =stolen_replacement_expedited_free}
        Pocketwire Visa Platinum Debit: {replacement_card_fee: =replacement_card_fee, free_replacements_per_year: =free_replacements_per_year, stolen_replacement_expedited_free: =stolen_replacement_expedited_free}
        Pocketwire Visa Signature Debit: {replacement_card_fee: =replacement_card_fee, free_replacements_per_year: =free_replacements_per_year, stolen_replacement_expedited_free: =stolen_replacement_expedited_free}
        Pocketwire Visa Infinite Debit: {replacement_card_fee: =replacement_card_fee, free_replacements_per_year: =free_replacements_per_year, stolen_replacement_expedited_free: =stolen_replacement_expedited_free}
        Pocketwire Visa Infinite Metal Debit: {replacement_card_fee: =replacement_card_fee, free_replacements_per_year: =free_replacements_per_year, stolen_replacement_expedited_free: =stolen_replacement_expedited_free}

  - id: card_activation_window
    subject: [card_activate, card_close]
    rule: >-
      A physical card is activated by the customer in the app with the card's last four digits and security code; a support representative cannot activate a card on the customer's behalf.
      A physical card still ordered and never activated is closed by the system once the activation window has passed: the closure is recorded later than activation_window_days calendar days after the card issue date.
      The activation window is counted in calendar days from the card issue date, the day after issue being day 1, and the card can still be activated on the window's last day.
      Activating a replacement card closes the card it replaces on the same day.
    eligibility:
      - id: activation_window_passed
        applies_to: [card_close]
        kind: time
        condition: "the closure is recorded later than activation_window_days calendar days after the card issue date"
        evidence_fields: [card_accounts.card_id, card_accounts.issued_date, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_id]
          action_bindings:
            card_accounts.card_id: card_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the card issue date
          anchor_source: card_accounts.issued_date
          relation: not_before
          duration_source: variants.activation_window_days
          unit: calendar_days
          counting_rule: "The activation window is counted in calendar days from the card issue date, the day after issue being day 1, and the card can still be activated on the window's last day."
          boundary: exclusive

  - id: card_lock_rules
    subject: [card_lock, card_unlock, card_purchase]
    rule: >-
      A lock is a temporary, reversible freeze the verified customer can ask for when a card is misplaced; it stops new purchases and ATM withdrawals, but refunds, dispute credits and incoming personal-account activity continue, and recurring charges from merchants the card has already paid keep settling on tiers whose recurring_allowed_while_locked is true.
      A card purchase can settle only while the card status is active or locked, and on a locked card only as a recurring charge on a tier that allows it.
      A lock never replaces a block: a card the customer knows is lost, stolen or used without their permission must be blocked instead, and a blocked card can never be unlocked.
    eligibility:
      - id: purchase_card_status
        applies_to: [card_purchase]
        kind: state
        condition: "A card purchase can settle only while the card status is active or locked, and on a locked card only as a recurring charge on a tier that allows it."
        evidence_fields: [card_accounts.card_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_id]
          action_bindings:
            card_accounts.card_id: card_id
        state_contract:
          field: card_accounts.status
          allowed: [active, locked]

  - id: card_block_and_replace
    subject: [card_block, card_close, card_issue]
    rule: >-
      A card is blocked when the verified customer states that the card is lost, stolen, damaged or has been used without their permission; block_reason records lost, stolen, damaged or compromised accordingly, and the customer's own statement is the authority for this report.
      The block takes effect immediately and is permanent; authorization holds already placed still settle or release on their own schedule.
      A replacement is issued on the customer's request as a new card whose replaces_card_id is the blocked card, with the fee decided by card_replacement_fees, and a blocked card with no replacement closes at its expiry month.
      A card the customer merely cannot find at the moment is locked under card_lock_rules instead of blocked.
    eligibility:
      - id: customer_reports_loss
        applies_to: [card_block]
        kind: caller_fact
        condition: "A card is blocked when the verified customer states that the card is lost, stolen, damaged or has been used without their permission"
        evidence_fields: [card_accounts.card_id, card_accounts.customer_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_id]
          action_bindings:
            card_accounts.card_id: card_id

  - id: card_evt_atm_fees
    subject: [card_atm_withdrawal, card_fee, card_atm_reimbursement]
    rule: >-
      In-network ATM withdrawals carry no Pocketwire fee; every domestic out-of-network withdrawal books a pocketwire_atm_fee row, at 0.00 while card_msr_free_atm_used_month is lower than free_atm_withdrawals_per_month and at pocketwire_atm_fee otherwise; an international withdrawal carries international_atm_fee and never uses the free allowance.
      ATM-owner surcharges are reimbursed on request, per withdrawal the lower of the surcharge and atm_reimbursement_per_withdrawal_cap, until the month's reimbursements (card_msr_atm_reimbursed_month) reach atm_operator_fee_reimbursement_cap_monthly, the last reimbursement being cut to what remains.
      On tiers whose atm_reimbursement_requires_direct_deposit is true, a surcharge is reimbursed only when the direct deposits into the linked personal account in the calendar month before the withdrawal reached atm_reimbursement_dd_threshold, so the personal account's deposit history changes the card's entitlement.
      Reimbursement is requested within the refund window: the request is made no later than atm_fee_refund_window_days calendar days after the ATM withdrawal date.
      The refund window is counted in calendar days from the ATM withdrawal date, the day after the withdrawal being day 1, and a request on the window's last day qualifies.
      Each withdrawal is reimbursed at most once, balance inquiries and over-the-counter withdrawals carry balance_inquiry_atm_fee and over_the_counter_cash_fee without reimbursement, and the Pocketwire fees themselves are never reimbursed as surcharges.
    eligibility:
      - id: reimbursement_window
        applies_to: [card_atm_reimbursement]
        kind: time
        condition: "the request is made no later than atm_fee_refund_window_days calendar days after the ATM withdrawal date"
        evidence_fields: [card_transactions.card_txn_id, card_transactions.txn_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.card_txn_id]
          action_bindings:
            card_transactions.card_txn_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the ATM withdrawal date
          anchor_source: card_transactions.txn_date
          relation: not_after
          duration_source: variants.atm_fee_refund_window_days
          unit: calendar_days
          counting_rule: "The refund window is counted in calendar days from the ATM withdrawal date, the day after the withdrawal being day 1, and a request on the window's last day qualifies."
          boundary: inclusive
      - id: one_reimbursement
        applies_to: [card_atm_reimbursement]
        kind: dedup
        condition: "Each withdrawal is reimbursed at most once"
        evidence_fields: [card_transactions.source_txn_id, card_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.source_txn_id]
          action_bindings:
            card_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: card_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [card_atm_reimbursement]}
          distinct_fields: []
    measures: [card_msr_free_atm_used_month, card_msr_atm_reimbursed_month]
    formula:
      atm_fee: "0 if card_msr_free_atm_used_month < free_atm_withdrawals_per_month else pocketwire_atm_fee"
      reimbursement: "max(0, min(atm_operator_surcharge, atm_reimbursement_per_withdrawal_cap, atm_operator_fee_reimbursement_cap_monthly - card_msr_atm_reimbursed_month))"
    params:
      per_tier:
        Pocketwire Visa Classic Debit: {pocketwire_atm_fee: =pocketwire_atm_fee, free_atm_withdrawals_per_month: =free_atm_withdrawals_per_month, atm_operator_fee_reimbursement_cap_monthly: =atm_operator_fee_reimbursement_cap_monthly, atm_reimbursement_requires_direct_deposit: =atm_reimbursement_requires_direct_deposit}
        Pocketwire Visa Gold Debit: {pocketwire_atm_fee: =pocketwire_atm_fee, free_atm_withdrawals_per_month: =free_atm_withdrawals_per_month, atm_operator_fee_reimbursement_cap_monthly: =atm_operator_fee_reimbursement_cap_monthly, atm_reimbursement_requires_direct_deposit: =atm_reimbursement_requires_direct_deposit}
        Pocketwire Visa Platinum Debit: {pocketwire_atm_fee: =pocketwire_atm_fee, free_atm_withdrawals_per_month: =free_atm_withdrawals_per_month, atm_operator_fee_reimbursement_cap_monthly: =atm_operator_fee_reimbursement_cap_monthly, atm_reimbursement_requires_direct_deposit: =atm_reimbursement_requires_direct_deposit}
        Pocketwire Visa Signature Debit: {pocketwire_atm_fee: =pocketwire_atm_fee, free_atm_withdrawals_per_month: =free_atm_withdrawals_per_month, atm_operator_fee_reimbursement_cap_monthly: =atm_operator_fee_reimbursement_cap_monthly, atm_reimbursement_requires_direct_deposit: =atm_reimbursement_requires_direct_deposit}
        Pocketwire Visa Infinite Debit: {pocketwire_atm_fee: =pocketwire_atm_fee, free_atm_withdrawals_per_month: =free_atm_withdrawals_per_month, atm_operator_fee_reimbursement_cap_monthly: =atm_operator_fee_reimbursement_cap_monthly, atm_reimbursement_requires_direct_deposit: =atm_reimbursement_requires_direct_deposit}
        Pocketwire Visa Infinite Metal Debit: {pocketwire_atm_fee: =pocketwire_atm_fee, free_atm_withdrawals_per_month: =free_atm_withdrawals_per_month, atm_operator_fee_reimbursement_cap_monthly: =atm_operator_fee_reimbursement_cap_monthly, atm_reimbursement_requires_direct_deposit: =atm_reimbursement_requires_direct_deposit}

  - id: card_evt_foreign_and_refunds
    subject: [card_purchase, card_fee, card_merchant_refund, card_fee_refund]
    rule: >-
      A foreign purchase carries a foreign_transaction_fee equal to the purchase amount times foreign_transaction_fee_pct, rounded to the cent (half up), booked on the settlement date.
      A merchant refund posts as a card_merchant_refund; when it is linked to a foreign purchase and foreign_fee_refund_on_merchant_refund is true, the foreign transaction fee is refunded in proportion to the refunded share of the purchase, rounded to the cent (half up).
      A merchant refund of a disputed purchase reduces the amount still in dispute by the refunded amount, and when it covers the whole disputed amount the dispute is closed as withdrawn.
      Pocketwire never refunds a merchant's price, restocking fee or currency difference on the merchant's behalf.
    eligibility: []
    formula:
      foreign_transaction_fee: "round(amount * foreign_transaction_fee_pct / 100, 2)"

  - id: card_authorization_holds
    subject: [card_authorization_hold, card_hold_release, card_purchase]
    rule: >-
      An authorization hold reduces the available balance until the purchase settles or the hold is released; a settling purchase that points to the hold replaces it, even if the settled amount differs from the held amount.
      An unsettled hold is released by Pocketwire only after its release period: the release is recorded no earlier than auth_hold_release_days calendar days after the authorization date for a standard hold, or extended_hold_release_days for an extended hold.
      The release period is counted in calendar days from the authorization date, the day after the authorization being day 1, and the release on the day the period is reached qualifies.
      Before the release period ends, only the merchant can release a hold; a representative cannot release it early at the customer's request, even when the customer shows the merchant's receipt.
    eligibility:
      - id: hold_release_period
        applies_to: [card_hold_release]
        kind: time
        condition: "the release is recorded no earlier than auth_hold_release_days calendar days after the authorization date for a standard hold, or extended_hold_release_days for an extended hold"
        evidence_fields: [card_transactions.card_txn_id, card_transactions.txn_date, card_transactions.hold_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.card_txn_id]
          action_bindings:
            card_transactions.card_txn_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the authorization date
          anchor_source: card_transactions.txn_date
          relation: not_before
          duration_source: variants.auth_hold_release_days
          unit: calendar_days
          counting_rule: "The release period is counted in calendar days from the authorization date, the day after the authorization being day 1, and the release on the day the period is reached qualifies."
          boundary: inclusive

  - id: card_disputes_unauthorized
    subject: [card_dispute_filed, card_dispute_resolved, card_provisional_credit, card_provisional_credit_reversal, card_dispute_credit]
    rule: >-
      An unauthorized dispute covers a card purchase or ATM withdrawal the customer did not make or authorize; a purchase by a family member the customer gave the card to, or a recurring charge the customer signed up for and forgot, is not unauthorized.
      An unauthorized dispute is filed only on a card whose status is blocked or closed, so a card still active or locked must be blocked as compromised first.
      The dispute is accepted only within the report window: the dispute is filed no later than unauthorized_report_days calendar days after the disputed card transaction's date.
      The report window is counted in calendar days from the disputed card transaction's date, the day after the transaction being day 1, and a dispute filed on the last day is accepted.
      A transaction can carry only one dispute: a dispute is filed only if no earlier dispute of any reason exists on the same card transaction, so an unauthorized dispute and a merchant dispute are mutually exclusive on one transaction.
      Liability is the lower of the dispute amount and liability_cap_timely when the dispute is filed within timely_notice_business_days Federal Reserve business days after the transaction date, and the lower of the dispute amount and liability_cap_late otherwise.
      A dispute amount at or below small_dispute_auto_credit_threshold is credited in full as final on filing as a card_dispute_credit and resolved approved the same day, without liability or investigation.
      Otherwise provisional credit of the dispute amount less the liability is posted once the dispute has stayed pending long enough: provisional credit is posted no earlier than provisional_credit_business_days business days after the dispute report date, and only on a dispute whose latest record is still pending.
      Provisional-credit timing is counted in Federal Reserve business days from the dispute report date, the first business day after the report being day 1, and posting on the day the period is reached qualifies.
      When the customer's disputes over the rolling 365 days (card_msr_disputes_12m) already exceed max_disputes_rolling_12m, no provisional credit is posted and the amount is credited only on approval; for a transaction within new_account_period_days after the card's activated_date, new_account_provisional_credit_business_days and new_account_investigation_days replace the standard timings.
      The disputes team records approved or denied; a dispute still pending after investigation_business_days business days is resolved as approved on the next handling, and a posted provisional credit is reversed on denial or on the customer's withdrawal, which is the customer's own decision.
    eligibility:
      - id: card_blocked_first
        applies_to: [card_dispute_filed]
        kind: state
        condition: "An unauthorized dispute is filed only on a card whose status is blocked or closed, so a card still active or locked must be blocked as compromised first."
        evidence_fields: [card_accounts.card_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_accounts.card_id]
          action_bindings:
            card_accounts.card_id: card_id
        state_contract:
          field: card_accounts.status
          allowed: [blocked, closed]
      - id: unauthorized_window
        applies_to: [card_dispute_filed]
        kind: time
        condition: "the dispute is filed no later than unauthorized_report_days calendar days after the disputed card transaction's date"
        evidence_fields: [card_transactions.card_txn_id, card_transactions.txn_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.card_txn_id]
          action_bindings:
            card_transactions.card_txn_id: card_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the disputed card transaction's date
          anchor_source: card_transactions.txn_date
          relation: not_after
          duration_source: variants.unauthorized_report_days
          unit: calendar_days
          counting_rule: "The report window is counted in calendar days from the disputed card transaction's date, the day after the transaction being day 1, and a dispute filed on the last day is accepted."
          boundary: inclusive
      - id: one_dispute_per_transaction
        applies_to: [card_dispute_filed]
        kind: dedup
        condition: "a dispute is filed only if no earlier dispute of any reason exists on the same card transaction"
        evidence_fields: [card_disputes.card_txn_id, card_disputes.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_disputes.card_txn_id]
          action_bindings:
            card_disputes.card_txn_id: card_txn_id
        dedup_contract:
          table: card_disputes
          mode: separate_record
          object_bindings: {card_txn_id: card_txn_id}
          duplicate_filters: {event_type: [card_dispute_filed]}
          distinct_fields: []
      - id: provisional_timing
        applies_to: [card_provisional_credit]
        kind: time
        condition: "provisional credit is posted no earlier than provisional_credit_business_days business days after the dispute report date, and only on a dispute whose latest record is still pending"
        evidence_fields: [card_disputes.card_txn_id, card_disputes.reported_date, card_disputes.resolution]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_disputes.card_txn_id]
          action_bindings:
            card_disputes.card_txn_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the dispute report date
          anchor_source: card_disputes.reported_date
          relation: not_before
          duration_source: variants.provisional_credit_business_days
          unit: business_days
          counting_rule: "Provisional-credit timing is counted in Federal Reserve business days from the dispute report date, the first business day after the report being day 1, and posting on the day the period is reached qualifies."
          boundary: inclusive
    measures: [card_msr_disputes_12m]
    formula:
      liability_if_timely: "min(dispute_amount, liability_cap_timely)"
      liability_if_late: "min(dispute_amount, liability_cap_late)"
      provisional_credit_amount: "dispute_amount - customer_liability"
      auto_credit: "dispute_amount <= small_dispute_auto_credit_threshold"
    params:
      per_tier:
        Pocketwire Visa Classic Debit: {unauthorized_report_days: =unauthorized_report_days, liability_cap_late: =liability_cap_late, provisional_credit_business_days: =provisional_credit_business_days, small_dispute_auto_credit_threshold: =small_dispute_auto_credit_threshold, max_disputes_rolling_12m: =max_disputes_rolling_12m}
        Pocketwire Visa Gold Debit: {unauthorized_report_days: =unauthorized_report_days, liability_cap_late: =liability_cap_late, provisional_credit_business_days: =provisional_credit_business_days, small_dispute_auto_credit_threshold: =small_dispute_auto_credit_threshold, max_disputes_rolling_12m: =max_disputes_rolling_12m}
        Pocketwire Visa Platinum Debit: {unauthorized_report_days: =unauthorized_report_days, liability_cap_late: =liability_cap_late, provisional_credit_business_days: =provisional_credit_business_days, small_dispute_auto_credit_threshold: =small_dispute_auto_credit_threshold, max_disputes_rolling_12m: =max_disputes_rolling_12m}
        Pocketwire Visa Signature Debit: {unauthorized_report_days: =unauthorized_report_days, liability_cap_late: =liability_cap_late, provisional_credit_business_days: =provisional_credit_business_days, small_dispute_auto_credit_threshold: =small_dispute_auto_credit_threshold, max_disputes_rolling_12m: =max_disputes_rolling_12m}
        Pocketwire Visa Infinite Debit: {unauthorized_report_days: =unauthorized_report_days, liability_cap_late: =liability_cap_late, provisional_credit_business_days: =provisional_credit_business_days, small_dispute_auto_credit_threshold: =small_dispute_auto_credit_threshold, max_disputes_rolling_12m: =max_disputes_rolling_12m}
        Pocketwire Visa Infinite Metal Debit: {unauthorized_report_days: =unauthorized_report_days, liability_cap_late: =liability_cap_late, provisional_credit_business_days: =provisional_credit_business_days, small_dispute_auto_credit_threshold: =small_dispute_auto_credit_threshold, max_disputes_rolling_12m: =max_disputes_rolling_12m}

  - id: card_disputes_merchant
    subject: [card_dispute_filed, card_dispute_resolved, card_dispute_credit]
    rule: >-
      A merchant dispute covers a purchase the customer made where the goods were not received, were not as described, were charged twice or at the wrong amount, a cancelled recurring charge continued, or a promised merchant credit never posted.
      The dispute is accepted only within the merchant window: the dispute is filed no later than merchant_dispute_days calendar days after the card transaction date.
      The merchant window is counted in calendar days from the card transaction date, the day after the transaction being day 1, and a dispute filed on the last day is accepted.
      For goods not received, not as described and credit not processed, the customer must first have contacted the merchant at least merchant_resolution_wait_days calendar days before filing, which rests on the customer's statement of the date of first contact; duplicate charges and incorrect amounts need no merchant contact.
      Merchant disputes carry no customer liability and no provisional credit, the small-dispute auto-credit of card_disputes_unauthorized applies to them as well, and the one-dispute-per-transaction exclusion applies to them too.
      The customer uploads supporting documents within dispute_documentation_days calendar days of filing; the disputes team records approved or denied, and a dispute without documents at the end of that period is denied.
    eligibility:
      - id: merchant_window
        applies_to: [card_dispute_filed]
        kind: time
        condition: "the dispute is filed no later than merchant_dispute_days calendar days after the card transaction date"
        evidence_fields: [card_transactions.card_txn_id, card_transactions.txn_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.card_txn_id]
          action_bindings:
            card_transactions.card_txn_id: card_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the card transaction date
          anchor_source: card_transactions.txn_date
          relation: not_after
          duration_source: variants.merchant_dispute_days
          unit: calendar_days
          counting_rule: "The merchant window is counted in calendar days from the card transaction date, the day after the transaction being day 1, and a dispute filed on the last day is accepted."
          boundary: inclusive
      - id: merchant_contacted_first
        applies_to: [card_dispute_filed]
        kind: caller_fact
        condition: "For goods not received, not as described and credit not processed, the customer must first have contacted the merchant at least merchant_resolution_wait_days calendar days before filing, which rests on the customer's statement of the date of first contact; duplicate charges and incorrect amounts need no merchant contact."
        evidence_fields: [card_transactions.card_txn_id, card_transactions.merchant_name]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [card_transactions.card_txn_id]
          action_bindings:
            card_transactions.card_txn_id: card_txn_id

extended_policies:
  - id: card_ext_takeover_card_liability
    base_policy_refs: [card_disputes_unauthorized, card_disputes_merchant]
    overwrite:
      - base_policy: card_disputes_unauthorized
        superseded_clause: >-
          Liability is the lower of the dispute amount and liability_cap_timely when the dispute is filed within timely_notice_business_days Federal Reserve business days after the transaction date, and the lower of the dispute amount and liability_cap_late otherwise.
        replaced_by: >-
          The liability recorded on the dispute is the lower of the takeover card's settled purchases and the liability ceiling, rounded to the cent (half up).
      - base_policy: card_disputes_merchant
        superseded_clause: >-
          For goods not received, not as described and credit not processed, the customer must first have contacted the merchant at least merchant_resolution_wait_days calendar days before filing
        replaced_by: >-
          A dispute of a takeover card's purchase needs no earlier contact with the merchant.
      - base_policy: card_disputes_unauthorized
        superseded_clause: >-
          A dispute amount at or below small_dispute_auto_credit_threshold is credited in full as final on filing as a card_dispute_credit and resolved approved the same day, without liability or investigation.
        replaced_by: >-
          The liability of a takeover card's purchase is recorded by this rule whatever the amount disputed, including an amount at or below small_dispute_auto_credit_threshold, which carries no liability-free small-dispute credit.
    trigger: on_request
    subject: [card_dispute_filed]
    computes: customer_liability
    target_tool: file_unauthorized_card_dispute_b9450be9
    params:
      takeover_issue_window_days: 1
      reduced_ceiling_notice_days: 10
      reduced_ceiling_pct: 50
      dd_relief_high_total: 2000.00
      dd_relief_high_factor: 0.6
      dd_relief_mid_factor: 0.8
      slow_block_days: 3
      slow_block_factor: 0.8
      late_block_factor: 0.9
    rule: >-
      This rule settles the customer liability recorded when the cardholder disputes, as unauthorized, a purchase on a virtual card they say they never created, called here a takeover card; every settled purchase on such a card is the activity in dispute.
      A dispute of a takeover card's purchase needs no earlier contact with the merchant.
      The liability of a takeover card's purchase is recorded by this rule whatever the amount disputed, including an amount at or below small_dispute_auto_credit_threshold, which carries no liability-free small-dispute credit.
      The amount disputed is the whole settled amount of the purchase.
      The liability recorded on the dispute is the lower of the takeover card's settled purchases and the liability ceiling, rounded to the cent (half up).
      The liability ceiling is the notice cap multiplied by the deposit relief and then by the block relief, rounded to the cent (half up).
      The notice days are the calendar days from the notice start date to the filing date.
      The notice start date is the settlement date of the takeover card's latest purchase.
      The notice cap is liability_cap_timely when the notice days are no more than timely_notice_business_days, and liability_cap_late otherwise.
      The deposit relief and the block relief are each 1.
      Where the linked personal account carries a lock whose restriction reason is suspected_account_takeover and the takeover card was issued no more than takeover_issue_window_days calendar days before the day that lock was placed, the notice start date is the recovered date of the linked personal account; where that does not hold, the card was blocked as compromised and the block date is on or after the settlement date of its latest purchase, the notice start date is the card's block date; in every other case the notice start date is the settlement date of the takeover card's latest purchase.
      The notice cap is liability_cap_timely when the notice days are no more than timely_notice_business_days, reduced_ceiling_pct percent of liability_cap_late rounded to the cent (half up) when the notice days are more than timely_notice_business_days and no more than reduced_ceiling_notice_days, and liability_cap_late when the notice days are more than reduced_ceiling_notice_days.
      The deposit relief is dd_relief_high_factor when the direct deposits into the linked personal account over the two months up to the filing date total at least dd_relief_high_total, dd_relief_mid_factor when they total at least atm_reimbursement_dd_threshold but less than dd_relief_high_total, and 1 when they total less than atm_reimbursement_dd_threshold.
      The block relief is slow_block_factor when the takeover card was blocked slow_block_days or more calendar days after its issue date, late_block_factor when it was blocked one or more but fewer than slow_block_days calendar days after its issue date, and 1 when it was blocked on its issue date.
    prerequisite: []
    cross_category:
      - category: wallet
        as: history
        reads: [restriction_reason, restricted_at, recovered_date, wallet_transactions.amount]
        note: The notice start date reads the takeover lock and recovery recorded on the linked personal account, and the deposit relief reads its direct deposits.
    compute:
      - settled_purchases: "SUM('card_transactions','amount', event_type='card_purchase')"
      - latest_purchase_date: "LATEST('card_transactions','txn_date', date_field='txn_date', event_type='card_purchase')"
      - takeover_reason: "CFIELD('wallet','restriction_reason')"
      - lock_after_issue_days: "DAYS(F('issued_date'), CFIELD('wallet','restricted_at'))"
      - notice_start: "CFIELD('wallet','recovered_date') if (takeover_reason == 'suspected_account_takeover' and 0 <= lock_after_issue_days <= K('takeover_issue_window_days')) else (F('blocked_date') if (F('block_reason') == 'compromised' and DAYS(latest_purchase_date, F('blocked_date')) >= 0) else latest_purchase_date)"
      - notice_days: "DAYS(notice_start, NOW)"
      - notice_cap: "P('liability_cap_timely') if notice_days <= P('timely_notice_business_days') else (RND(P('liability_cap_late') * K('reduced_ceiling_pct') / 100, 2) if notice_days <= K('reduced_ceiling_notice_days') else P('liability_cap_late'))"
      - deposits_two_months: "XSUM('wallet','wallet_transactions','amount', within_months=2, date_field='txn_date', event_type='wallet_direct_deposit')"
      - deposit_relief: "K('dd_relief_high_factor') if deposits_two_months >= K('dd_relief_high_total') else (K('dd_relief_mid_factor') if deposits_two_months >= P('atm_reimbursement_dd_threshold') else 1)"
      - block_after_issue_days: "DAYS(F('issued_date'), F('blocked_date'))"
      - block_relief: "K('slow_block_factor') if block_after_issue_days >= K('slow_block_days') else (K('late_block_factor') if block_after_issue_days >= 1 else 1)"
      - liability_ceiling: "RND(notice_cap * deposit_relief * block_relief, 2)"
      - result: "RND(MN(settled_purchases, liability_ceiling), 2)"
    compute_basis:
      settled_purchases: "every settled purchase on such a card is the activity in dispute."
      latest_purchase_date: "The notice start date is the settlement date of the takeover card's latest purchase."
      takeover_reason: "Where the linked personal account carries a lock whose restriction reason is suspected_account_takeover and the takeover card was issued no more than takeover_issue_window_days calendar days before the day that lock was placed, the notice start date is the recovered date of the linked personal account;"
      lock_after_issue_days: "the takeover card was issued no more than takeover_issue_window_days calendar days before the day that lock was placed"
      notice_start: "Where the linked personal account carries a lock whose restriction reason is suspected_account_takeover and the takeover card was issued no more than takeover_issue_window_days calendar days before the day that lock was placed, the notice start date is the recovered date of the linked personal account; where that does not hold, the card was blocked as compromised and the block date is on or after the settlement date of its latest purchase, the notice start date is the card's block date; in every other case the notice start date is the settlement date of the takeover card's latest purchase."
      notice_days: "The notice days are the calendar days from the notice start date to the filing date."
      notice_cap: "The notice cap is liability_cap_timely when the notice days are no more than timely_notice_business_days, reduced_ceiling_pct percent of liability_cap_late rounded to the cent (half up) when the notice days are more than timely_notice_business_days and no more than reduced_ceiling_notice_days, and liability_cap_late when the notice days are more than reduced_ceiling_notice_days."
      deposits_two_months: "the direct deposits into the linked personal account over the two months up to the filing date"
      deposit_relief: "The deposit relief is dd_relief_high_factor when the direct deposits into the linked personal account over the two months up to the filing date total at least dd_relief_high_total, dd_relief_mid_factor when they total at least atm_reimbursement_dd_threshold but less than dd_relief_high_total, and 1 when they total less than atm_reimbursement_dd_threshold."
      block_after_issue_days: "blocked slow_block_days or more calendar days after its issue date"
      block_relief: "The block relief is slow_block_factor when the takeover card was blocked slow_block_days or more calendar days after its issue date, late_block_factor when it was blocked one or more but fewer than slow_block_days calendar days after its issue date, and 1 when it was blocked on its issue date."
      liability_ceiling: "The liability ceiling is the notice cap multiplied by the deposit relief and then by the block relief, rounded to the cent (half up)."
      result: "The liability recorded on the dispute is the lower of the takeover card's settled purchases and the liability ceiling, rounded to the cent (half up)."
    factors:
      - id: notice_start_date
        effect: method
        decides: notice_start
        bindings: [latest_purchase_date, takeover_reason, lock_after_issue_days, notice_start]
        ladder:
          - when: "the linked personal account carries a lock whose restriction reason is suspected_account_takeover AND the takeover card was issued no more than takeover_issue_window_days calendar days before the day that lock was placed"
            method: "the notice days are counted from the recovered date of the linked personal account"
          - when: "the first condition does not hold AND the card was blocked as compromised with its block date on or after the settlement date of its latest purchase"
            method: "the notice days are counted from the card's block date"
          - when: "otherwise"
            method: "the notice days are counted from the settlement date of the takeover card's latest purchase"
        baseline:
          notice_start: "latest_purchase_date"
        evidence: [cross_category, date, history]
        cross_difficulty: wallet
      - id: notice_cap_tier
        effect: parameter
        decides: notice_cap
        bindings: [notice_days, notice_cap]
        ladder:
          - when: "the notice days are no more than timely_notice_business_days"
            value: "P('liability_cap_timely')"
          - when: "the notice days are more than timely_notice_business_days and no more than reduced_ceiling_notice_days"
            value: "reduced_ceiling_pct percent of P('liability_cap_late')"
          - when: "otherwise (more than reduced_ceiling_notice_days notice days)"
            value: "P('liability_cap_late')"
        baseline:
          notice_cap: "P('liability_cap_timely') if notice_days <= P('timely_notice_business_days') else P('liability_cap_late')"
        evidence: [date]
        cross_difficulty: null
      - id: deposit_relief_tier
        effect: parameter
        decides: deposit_relief
        bindings: [deposits_two_months, deposit_relief]
        ladder:
          - when: "direct deposits into the linked personal account over the two months up to the filing date total at least dd_relief_high_total"
            value: "K('dd_relief_high_factor')"
          - when: "they total at least atm_reimbursement_dd_threshold but less than dd_relief_high_total"
            value: "K('dd_relief_mid_factor')"
          - when: "otherwise (less than atm_reimbursement_dd_threshold)"
            value: "1"
        baseline:
          deposit_relief: "1"
        evidence: [cross_category, history]
        cross_difficulty: wallet
      - id: block_relief_tier
        effect: parameter
        decides: block_relief
        bindings: [block_after_issue_days, block_relief]
        ladder:
          - when: "the takeover card was blocked slow_block_days or more calendar days after its issue date"
            value: "K('slow_block_factor')"
          - when: "it was blocked one or more but fewer than slow_block_days calendar days after its issue date"
            value: "K('late_block_factor')"
          - when: "otherwise (blocked on its issue date)"
            value: "1"
        baseline:
          block_relief: "1"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The liability recorded on the dispute is the lower of the takeover card's settled purchases and the liability ceiling, rounded to the cent (half up).
        The liability ceiling is the notice cap multiplied by the deposit relief and then by the block relief, rounded to the cent (half up).
        The notice days are the calendar days from the notice start date to the filing date.
        The notice start date is the settlement date of the takeover card's latest purchase.
        The notice cap is liability_cap_timely when the notice days are no more than timely_notice_business_days, and liability_cap_late otherwise.
        The deposit relief and the block relief are each 1.
      params: [liability_cap_timely, liability_cap_late, timely_notice_business_days]
    inputs:
      history:
        - {table: card_transactions, aggregate: sum, field: amount, filters: {event_type: card_purchase}}
        - {table: card_transactions, aggregate: latest, field: txn_date, filters: {event_type: card_purchase}}
        - {category: wallet, table: wallet_transactions, aggregate: sum, field: amount, within_months: 2, filters: {event_type: wallet_direct_deposit}}
      cross_category: [wallet]
  - id: card_ext_takeover_card_final_credit
    base_policy_refs: [card_disputes_unauthorized, card_disputes_merchant]
    overwrite:
      - base_policy: card_disputes_unauthorized
        superseded_clause: >-
          Otherwise provisional credit of the dispute amount less the liability is posted once the dispute has stayed pending long enough
        replaced_by: >-
          An open unauthorized dispute of a purchase on a takeover card whose linked personal account carries a recorded takeover lock is approved on filing and settled at once with a final credit; no provisional credit is posted on it.
