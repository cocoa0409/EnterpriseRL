      split_release_margin: 5.00
    rule: >-
      An open incorrect-amount dispute of a single-use card purchase is credited on filing up to the on-filing ceiling, and whatever is not credited on filing stays in dispute for the disputes team.
      The credit on filing is not booked until the single-use card's purchase stands on the records with an open incorrect-amount dispute.
      The overcharge on record is the disputed amount of the incorrect-amount disputes filed on the single-use card less the disputed amount of those already resolved.
      The on-filing ceiling is the card tier's small_dispute_auto_credit_threshold multiplied by the tenure multiplier and rounded to the cent (half up), plus the deposit uplift, the plan uplift, the standing uplift and the merchant acknowledgement uplift.
      The credit on filing is the lower of the overcharge on record and the on-filing ceiling, rounded to the cent (half up).
      The tenure multiplier is 1 and the four uplifts are each 0.00.
      The tenure multiplier is long_tenure_multiplier when the linked personal account has been open long_tenure_months or more whole months on the filing date, mid_tenure_multiplier when it has been open mid_tenure_months or more but fewer than long_tenure_months whole months, and 1 when it has been open fewer than mid_tenure_months whole months.
      The deposit uplift is deposit_uplift_high when the direct deposits into the linked personal account over the three months up to the filing date total at least deposit_uplift_high_total, deposit_uplift_mid when they total at least atm_reimbursement_dd_threshold but less than deposit_uplift_high_total, and 0.00 when they total less than atm_reimbursement_dd_threshold.
      The plan uplift is plan_uplift_top when the linked plan is Pocketwire Onyx or Pocketwire Summit, plan_uplift_paid when it is Pocketwire Plus or Pocketwire Prime, and 0.00 on Pocketwire Lite or Pocketwire Core.
      The standing uplift is standing_uplift_clean when the linked personal account has never been restricted, standing_uplift_old when its most recent limitation was lifted standing_lookback_months or more whole months before the filing date, and 0.00 when it is restricted now or its most recent limitation was lifted fewer than standing_lookback_months whole months before.
      The merchant acknowledgement uplift is merchant_ack_high when the merchant credits posted on the single-use card total at least merchant_ack_total, merchant_ack_low when they total more than 0.00 but less than merchant_ack_total, and 0.00 when the merchant has posted no credit.
      When the overcharge on record exceeds the on-filing ceiling by no more than whole_release_margin, the whole overcharge on record is credited on filing; when it exceeds the ceiling by more than whole_release_margin but no more than split_release_margin, the credit on filing is the ceiling plus half of the excess, rounded to the cent (half up); in every other case the credit on filing is the lower of the overcharge on record and the on-filing ceiling.
    prerequisite:
      - problem: card_ext_single_use_incorrect_amount
        kind: value_input
        gate: overcharge_on_record
        form: state
        policy_source: >-
          The credit on filing is not booked until the single-use card's purchase stands on the records with an open incorrect-amount dispute.
        condition: >-
          The single-use card carries a card_dispute_filed record of reason incorrect_amount on its purchase, with its dispute_amount recorded, and no card_dispute_resolved record for that purchase.
        resolved_by: file_incorrect_amount_card_dispute_a0bf950b
        effect: >-
          Once the incorrect-amount dispute is filed, the overcharge on record rises from 0.00 to the disputed amount recorded at filing, so the credit on filing is measured against a real overcharge instead of crediting nothing.
    cross_category:
      - category: wallet
        as: history
        reads: [opened_date, variant_name, restriction_reason, restriction_lifted_date, wallet_transactions.amount]
        note: The tenure multiplier, the plan uplift and the standing uplift read the linked personal account, and the deposit uplift reads its direct-deposit ledger over three months.
    compute:
      - overcharge_on_record: "SUM('card_disputes','dispute_amount', event_type='card_dispute_filed', dispute_reason='incorrect_amount') - SUM('card_disputes','dispute_amount', event_type='card_dispute_resolved', dispute_reason='incorrect_amount')"
      - account_age_months: "MONTHS(CFIELD('wallet','opened_date'), NOW)"
      - tenure_multiplier: "K('long_tenure_multiplier') if account_age_months >= K('long_tenure_months') else (K('mid_tenure_multiplier') if account_age_months >= K('mid_tenure_months') else 1)"
      - scaled_threshold: "RND(P('small_dispute_auto_credit_threshold') * tenure_multiplier, 2)"
      - deposits_three_months: "XSUM('wallet','wallet_transactions','amount', within_months=3, date_field='txn_date', event_type='wallet_direct_deposit')"
      - deposit_uplift: "K('deposit_uplift_high') if deposits_three_months >= K('deposit_uplift_high_total') else (K('deposit_uplift_mid') if deposits_three_months >= P('atm_reimbursement_dd_threshold') else 0)"
      - plan_on_file: "CFIELD('wallet','variant_name')"
      - plan_uplift: "K('plan_uplift_top') if (plan_on_file == 'Pocketwire Onyx' or plan_on_file == 'Pocketwire Summit') else (K('plan_uplift_paid') if (plan_on_file == 'Pocketwire Plus' or plan_on_file == 'Pocketwire Prime') else 0)"
      - restriction_on_file: "CFIELD('wallet','restriction_reason')"
      - lifted_on: "CFIELD('wallet','restriction_lifted_date')"
      - standing_uplift: "K('standing_uplift_clean') if restriction_on_file == 'none' else (K('standing_uplift_old') if (lifted_on != '' and MONTHS(lifted_on, NOW) >= K('standing_lookback_months')) else 0)"
      - merchant_credits_posted: "SUM('card_transactions','amount', event_type='card_merchant_refund')"
      - merchant_ack_uplift: "K('merchant_ack_high') if merchant_credits_posted >= K('merchant_ack_total') else (K('merchant_ack_low') if merchant_credits_posted > 0 else 0)"
      - on_filing_ceiling: "scaled_threshold + deposit_uplift + plan_uplift + standing_uplift + merchant_ack_uplift"
      - ceiling_excess: "overcharge_on_record - on_filing_ceiling"
      - on_filing_credit: "overcharge_on_record if ceiling_excess <= K('whole_release_margin') else (on_filing_ceiling + RND(ceiling_excess / 2, 2) if ceiling_excess <= K('split_release_margin') else MN(overcharge_on_record, on_filing_ceiling))"
      - result: "RND(MX(0, on_filing_credit), 2)"
    compute_basis:
      overcharge_on_record: "The overcharge on record is the disputed amount of the incorrect-amount disputes filed on the single-use card less the disputed amount of those already resolved."
      account_age_months: "has been open long_tenure_months or more whole months on the filing date"
      tenure_multiplier: "The tenure multiplier is long_tenure_multiplier when the linked personal account has been open long_tenure_months or more whole months on the filing date, mid_tenure_multiplier when it has been open mid_tenure_months or more but fewer than long_tenure_months whole months, and 1 when it has been open fewer than mid_tenure_months whole months."
      scaled_threshold: "the card tier's small_dispute_auto_credit_threshold multiplied by the tenure multiplier and rounded to the cent (half up)"
      deposits_three_months: "the direct deposits into the linked personal account over the three months up to the filing date"
      deposit_uplift: "The deposit uplift is deposit_uplift_high when the direct deposits into the linked personal account over the three months up to the filing date total at least deposit_uplift_high_total, deposit_uplift_mid when they total at least atm_reimbursement_dd_threshold but less than deposit_uplift_high_total, and 0.00 when they total less than atm_reimbursement_dd_threshold."
      plan_on_file: "when the linked plan is Pocketwire Onyx or Pocketwire Summit"
      plan_uplift: "The plan uplift is plan_uplift_top when the linked plan is Pocketwire Onyx or Pocketwire Summit, plan_uplift_paid when it is Pocketwire Plus or Pocketwire Prime, and 0.00 on Pocketwire Lite or Pocketwire Core."
      restriction_on_file: "when the linked personal account has never been restricted"
      lifted_on: "its most recent limitation was lifted standing_lookback_months or more whole months before the filing date"
      standing_uplift: "The standing uplift is standing_uplift_clean when the linked personal account has never been restricted, standing_uplift_old when its most recent limitation was lifted standing_lookback_months or more whole months before the filing date, and 0.00 when it is restricted now or its most recent limitation was lifted fewer than standing_lookback_months whole months before."
      merchant_credits_posted: "the merchant credits posted on the single-use card"
      merchant_ack_uplift: "The merchant acknowledgement uplift is merchant_ack_high when the merchant credits posted on the single-use card total at least merchant_ack_total, merchant_ack_low when they total more than 0.00 but less than merchant_ack_total, and 0.00 when the merchant has posted no credit."
      on_filing_ceiling: "The on-filing ceiling is the card tier's small_dispute_auto_credit_threshold multiplied by the tenure multiplier and rounded to the cent (half up), plus the deposit uplift, the plan uplift, the standing uplift and the merchant acknowledgement uplift."
      ceiling_excess: "exceeds the on-filing ceiling by no more than whole_release_margin"
      on_filing_credit: "When the overcharge on record exceeds the on-filing ceiling by no more than whole_release_margin, the whole overcharge on record is credited on filing; when it exceeds the ceiling by more than whole_release_margin but no more than split_release_margin, the credit on filing is the ceiling plus half of the excess, rounded to the cent (half up); in every other case the credit on filing is the lower of the overcharge on record and the on-filing ceiling."
      result: "The credit on filing is the lower of the overcharge on record and the on-filing ceiling, rounded to the cent (half up)."
    factors:
      - id: tenure_multiplier_tier
        effect: parameter
        decides: tenure_multiplier
        bindings: [account_age_months, tenure_multiplier]
        ladder:
          - when: "the linked personal account has been open long_tenure_months or more whole months"
            value: "K('long_tenure_multiplier')"
          - when: "it has been open mid_tenure_months or more but fewer than long_tenure_months whole months"
            value: "K('mid_tenure_multiplier')"
          - when: "otherwise (fewer than mid_tenure_months whole months)"
            value: "1"
        baseline:
          tenure_multiplier: "1"
        evidence: [cross_category, date]
        cross_difficulty: wallet
      - id: deposit_uplift_tier
        effect: parameter
        decides: deposit_uplift
        bindings: [deposits_three_months, deposit_uplift]
        ladder:
          - when: "direct deposits into the linked personal account over the three months up to the filing date total at least deposit_uplift_high_total"
            value: "K('deposit_uplift_high')"
          - when: "they total at least atm_reimbursement_dd_threshold but less than deposit_uplift_high_total"
            value: "K('deposit_uplift_mid')"
          - when: "otherwise (less than atm_reimbursement_dd_threshold)"
            value: "0.00"
        baseline:
          deposit_uplift: "0"
        evidence: [cross_category, history]
        cross_difficulty: wallet
      - id: plan_uplift_tier
        effect: parameter
        decides: plan_uplift
        bindings: [plan_on_file, plan_uplift]
        ladder:
          - when: "the linked plan is Pocketwire Onyx or Pocketwire Summit"
            value: "K('plan_uplift_top')"
          - when: "the linked plan is Pocketwire Plus or Pocketwire Prime"
            value: "K('plan_uplift_paid')"
          - when: "otherwise (Pocketwire Lite or Pocketwire Core)"
            value: "0.00"
        baseline:
          plan_uplift: "0"
        evidence: [cross_category]
        cross_difficulty: wallet
      - id: standing_uplift_tier
        effect: parameter
        decides: standing_uplift
        bindings: [restriction_on_file, lifted_on, standing_uplift]
        ladder:
          - when: "the linked personal account has never been restricted"
            value: "K('standing_uplift_clean')"
          - when: "its most recent limitation was lifted standing_lookback_months or more whole months before the filing date"
            value: "K('standing_uplift_old')"
          - when: "otherwise (restricted now, or lifted fewer than standing_lookback_months whole months before)"
            value: "0.00"
        baseline:
          standing_uplift: "0"
        evidence: [cross_category, date]
        cross_difficulty: wallet
      - id: merchant_ack_tier
        effect: parameter
        decides: merchant_ack_uplift
        bindings: [merchant_credits_posted, merchant_ack_uplift]
        ladder:
          - when: "the merchant credits posted on the single-use card total at least merchant_ack_total"
            value: "K('merchant_ack_high')"
          - when: "they total more than 0.00 but less than merchant_ack_total"
            value: "K('merchant_ack_low')"
          - when: "otherwise (no merchant credit)"
            value: "0.00"
        baseline:
          merchant_ack_uplift: "0"
        evidence: [history]
        cross_difficulty: null
      - id: near_ceiling_release
        effect: method
        decides: on_filing_credit
        bindings: [overcharge_on_record, ceiling_excess, on_filing_credit]
        ladder:
          - when: "the overcharge on record exceeds the on-filing ceiling by no more than whole_release_margin"
            method: "the whole overcharge on record is credited on filing"
          - when: "it exceeds the ceiling by more than whole_release_margin but no more than split_release_margin"
            method: "the ceiling plus half of the excess is credited on filing"
          - when: "otherwise"
            method: "the lower of the overcharge on record and the on-filing ceiling is credited"
        baseline:
          on_filing_credit: "MN(overcharge_on_record, on_filing_ceiling)"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The on-filing ceiling is the card tier's small_dispute_auto_credit_threshold multiplied by the tenure multiplier and rounded to the cent (half up), plus the deposit uplift, the plan uplift, the standing uplift and the merchant acknowledgement uplift.
        The credit on filing is the lower of the overcharge on record and the on-filing ceiling, rounded to the cent (half up).
        The tenure multiplier is 1 and the four uplifts are each 0.00.
      params: [small_dispute_auto_credit_threshold]
    inputs:
      history:
        - {table: card_disputes, aggregate: sum, field: dispute_amount, filters: {dispute_reason: incorrect_amount}}
        - {table: card_transactions, aggregate: sum, field: amount, filters: {event_type: card_merchant_refund}}
        - {category: wallet, table: wallet_transactions, aggregate: sum, field: amount, within_months: 3, filters: {event_type: wallet_direct_deposit}}
      cross_category: [wallet]
