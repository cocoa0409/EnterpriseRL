# Pocketwire Visa Debit Card — physical and virtual debit cards drawing on the personal balance.
category: card
display_name: Pocketwire Visa Debit Card

binding:
  holding_table: card_accounts
  event_tables: [card_transactions, card_disputes]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [ordered, active, locked, blocked, closed]
  transitions:
    - {from: ordered, to: active, by: user, means: The customer activates the card in the app; virtual cards are activated on issue.}
    - {from: active, to: locked, by: agent, means: The card is locked at the verified customer's request or by the customer in the app; a lock is reversible.}
    - {from: locked, to: active, by: agent, means: The lock is removed at the verified customer's request or by the customer in the app.}
    - {from: active, to: blocked, by: agent, means: The card is permanently blocked after a lost, stolen, compromised or damaged report.}
    - {from: locked, to: blocked, by: agent, means: A locked card is permanently blocked after a lost, stolen, compromised or damaged report.}
    - {from: ordered, to: blocked, by: agent, means: A card not yet activated is blocked after it is reported lost or stolen in the mail.}
    - {from: ordered, to: closed, by: system, means: A physical card not activated within the activation window is closed.}
    - {from: active, to: closed, by: user, means: The customer cancels the card in the app.}
    - {from: locked, to: closed, by: user, means: The customer cancels a locked card in the app.}
    - {from: blocked, to: closed, by: system, means: A blocked card is closed once its replacement is activated, or at its expiry month when no replacement was ordered.}

accounts:
  - key: card_ledger
    unit: USD
    meaning: The card settlement ledger — the net of card activity settled against the linked personal balance; purchases, ATM withdrawals and card fees draw it down, and merchant refunds, fee refunds, ATM surcharge reimbursements and dispute credits restore it. The balance the app displays is the personal ledger balance plus this net.

parameter_schema:
  custom_design_fee: One-time fee for a custom-design physical card, USD, charged on issuance.
  replacement_card_fee: Fee for a replacement physical card after a lost or damaged report beyond the free allowance, USD; stolen and compromised replacements are always free.
  free_replacements_per_year: Number of lost or damaged physical-card replacements free of replacement_card_fee over the rolling 365 days before the new issue date, count.
  expedited_shipping_fee: Fee for expedited delivery of a physical card, USD.
  standard_delivery_business_days: Latest arrival of a standard-delivery physical card, business days after the issue date.
  expedited_delivery_business_days: Latest arrival of an expedited physical card, business days after the issue date.
  stolen_replacement_expedited_free: Whether a replacement for a stolen or compromised card ships expedited at no charge, boolean.
  card_validity_years: Years from the issue month to the card's expiry month, years.
  reissue_before_expiry_days: Calendar days before the expiry month's first day that a renewal card is issued automatically, days.
  activation_window_days: Calendar days after the issue date within which an ordered physical card must be activated before it is closed, days.
  metal_card: Whether the physical card is made of metal, boolean.
  physical_card_limit_per_customer: Maximum non-closed physical cards per customer, count.
  max_virtual_cards: Maximum non-closed reusable virtual cards per customer, count.
  single_use_virtual_cards_per_month: Maximum single-use virtual cards issued per calendar month, count.
  daily_purchase_limit: Cap on the sum of settled purchases on one calendar day (Eastern Time) across all of the customer's cards, USD.
  per_transaction_purchase_limit: Maximum amount of one purchase, USD.
  virtual_card_daily_purchase_limit: Cap on the sum of purchases made with virtual cards on one calendar day, counted inside daily_purchase_limit, USD.
  daily_atm_withdrawal_limit: Cap on the sum of ATM withdrawals on one calendar day across all of the customer's cards, USD.
  atm_withdrawals_per_day: Maximum number of ATM withdrawals on one calendar day, count.
  pocketwire_atm_fee: Pocketwire fee on a domestic out-of-network ATM withdrawal beyond the free monthly allowance, USD.
  free_atm_withdrawals_per_month: Domestic out-of-network ATM withdrawals per calendar month free of pocketwire_atm_fee, count.
  atm_operator_fee_reimbursement_cap_monthly: Maximum ATM-owner surcharges reimbursed per calendar month, USD.
  atm_reimbursement_per_withdrawal_cap: Maximum ATM-owner surcharge reimbursed on one withdrawal, USD.
  atm_reimbursement_requires_direct_deposit: Whether ATM-owner surcharge reimbursement requires the previous calendar month's direct deposits to reach atm_reimbursement_dd_threshold, boolean.
  atm_reimbursement_dd_threshold: Previous-calendar-month direct deposit total into the linked personal account needed for surcharge reimbursement when required, USD.
  atm_fee_refund_window_days: Calendar days after an ATM withdrawal within which surcharge reimbursement can be requested, days.
  balance_inquiry_atm_fee: Fee on a balance inquiry at an out-of-network ATM, USD.
  over_the_counter_cash_fee: Fee on an over-the-counter cash withdrawal at a bank teller, USD.
  foreign_transaction_fee_pct: Fee on a purchase processed outside the United States or in a foreign currency, percentage of the purchase amount, percent.
  international_atm_fee: Pocketwire fee on an ATM withdrawal outside the United States, USD.
  foreign_fee_refund_on_merchant_refund: Whether the foreign transaction fee is refunded in proportion when the merchant refunds the purchase, boolean.
  recurring_allowed_while_locked: Whether recurring merchant charges from merchants the card already paid keep settling while the card is locked, boolean.
  auth_hold_release_days: Calendar days after the authorization date after which an unsettled standard authorization hold is released, days.
  extended_hold_release_days: Calendar days after the authorization date after which an unsettled extended hold (hotels, car rentals, fuel pre-authorizations over the standard hold) is released, days.
  unauthorized_report_days: Calendar days after the disputed card transaction's date within which an unauthorized-transaction dispute is accepted, days.
  merchant_dispute_days: Calendar days after the card transaction date within which a merchant dispute is accepted, days.
  merchant_resolution_wait_days: Calendar days the customer must allow after first contacting the merchant before a goods-not-received, not-as-described or credit-not-processed dispute is filed, days.
  dispute_documentation_days: Calendar days after filing within which the customer must upload supporting documents for a merchant dispute, days.
  timely_notice_business_days: Business days after the transaction date within which an unauthorized dispute counts as timely notice, business days.
  liability_cap_timely: Maximum customer liability on an approved unauthorized card dispute with timely notice, USD.
  liability_cap_late: Maximum customer liability on an approved unauthorized card dispute reported after timely notice, USD.
  provisional_credit_business_days: Business days after the dispute report date at which provisional credit is posted on a pending dispute, business days.
  new_account_provisional_credit_business_days: Provisional-credit timing replacing the standard one when the disputed transaction occurred within the new-card period, business days.
  investigation_business_days: Business days after the report date by which a dispute must be resolved, business days.
  new_account_investigation_days: Calendar days after the report date by which a new-card dispute must be resolved, days.
  new_account_period_days: Calendar days after the card's activated date during which a disputed transaction counts as a new-card transaction, days.
  small_dispute_auto_credit_threshold: Dispute amount at or below which a dispute is credited in full as final on filing without investigation, USD.
  max_disputes_rolling_12m: Disputes filed over the rolling 365 days before a new filing above which provisional credit is withheld until the investigation ends, count.

