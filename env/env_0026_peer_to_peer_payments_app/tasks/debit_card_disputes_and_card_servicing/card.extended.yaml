      lock_length_days: "from the day it was placed to the recovered date"
      lock_courtesy: "The lock courtesy is lock_courtesy_long when the takeover lock lasted long_lock_days or more calendar days from the day it was placed to the recovered date, lock_courtesy_short when it lasted one or more but fewer than long_lock_days calendar days, and 0.00 when it lasted less than one calendar day."
