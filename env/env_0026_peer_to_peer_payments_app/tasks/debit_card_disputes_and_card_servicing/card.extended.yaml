    trigger: on_request
    subject: [card_dispute_resolved, card_dispute_credit]
    computes: credit_amount
    target_tool: post_takeover_dispute_credit_edfadedb
    params:
      fast_lock_days: 1
      partial_absorb_cap: 10.00
      long_lock_days: 3
      lock_courtesy_long: 10.00
      lock_courtesy_short: 5.00
      fee_return_share_pct: 50
      long_tenure_months: 60
      mid_tenure_months: 24
      tenure_courtesy_long: 10.00
      tenure_courtesy_mid: 5.00
    rule: >-
      A takeover card is a virtual card the cardholder says they never created.
      An open unauthorized dispute of a purchase on a takeover card whose linked personal account carries a recorded takeover lock is approved on filing and settled at once with a final credit; no provisional credit is posted on it.
      Such a dispute is settled by this final credit whatever the amount disputed, including an amount at or below small_dispute_auto_credit_threshold, which is not credited in full as a small dispute.
      The final credit is booked only after the takeover card's purchase stands on the records with an open unauthorized dispute carrying its recorded customer liability.
      The open disputed amount is the disputed amount of the unauthorized disputes filed on the takeover card less the disputed amount of those already resolved, and the open liability is worked out the same way from their recorded customer liability.
      The final credit is the open disputed amount less the liability kept by the customer, never below zero, plus the lock courtesy, the fee return and the tenure courtesy, rounded to the cent (half up).
      The liability kept by the customer is the open liability.
      The lock courtesy, the fee return and the tenure courtesy are each 0.00.
      Where the linked plan is Pocketwire Onyx or Pocketwire Summit and the takeover lock was placed no more than fast_lock_days calendar days after the takeover card's issue date, Pocketwire absorbs the whole open liability and the liability kept is zero; where the linked plan is Pocketwire Plus or Pocketwire Prime and the lock was placed no more than fast_lock_days calendar days after that issue date, Pocketwire absorbs up to partial_absorb_cap of it and the liability kept is the open liability less partial_absorb_cap, never below zero; in every other case the liability kept is the open liability.
      The lock courtesy is lock_courtesy_long when the takeover lock lasted long_lock_days or more calendar days from the day it was placed to the recovered date, lock_courtesy_short when it lasted one or more but fewer than long_lock_days calendar days, and 0.00 when it lasted less than one calendar day.
      The fee return is the whole of the foreign transaction fees charged on the takeover card when there are such fees and the card's tier is Pocketwire Visa Signature Debit, Pocketwire Visa Infinite Debit or Pocketwire Visa Infinite Metal Debit, fee_return_share_pct percent of those fees rounded to the cent (half up) when there are such fees on any other tier, and 0.00 when no foreign transaction fee was charged on the card.
      The tenure courtesy is tenure_courtesy_long when the linked personal account has been open long_tenure_months or more whole months on the filing date, tenure_courtesy_mid when it has been open mid_tenure_months or more but fewer than long_tenure_months whole months, and 0.00 when it has been open fewer than mid_tenure_months whole months.
