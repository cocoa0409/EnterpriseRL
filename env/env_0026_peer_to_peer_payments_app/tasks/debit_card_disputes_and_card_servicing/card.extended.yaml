      credits_linked: "only the merchant credits linked to the purchase are counted"
      latest_unlinked_credit: "the most recent unlinked credit"
      credits_counted: "Where the card carries merchant credits and none of them is linked to the purchase, every merchant credit on the card is counted; where it carries both linked and unlinked merchant credits, the linked credits and the most recent unlinked credit are counted; in every other case only the merchant credits linked to the purchase are counted."
      gratuity_allowance: "The gratuity allowance is the gratuity rate applied to the authorized reference"
      exchange_allowance: "the exchange allowance is the exchange rate tolerance applied to the authorized reference, each rounded to the cent (half up)"
      result: "The overcharge in dispute is the settled purchase amount less the authorized reference, less the gratuity allowance, less the exchange allowance and less the merchant credits counted, never below zero and never more than the settled purchase amount, rounded to the cent (half up)."
