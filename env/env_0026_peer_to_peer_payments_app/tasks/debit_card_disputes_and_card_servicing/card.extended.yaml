    rule: >-
      This rule settles the amount the cardholder disputes as an incorrect amount on the purchase made with a single-use virtual card, which by design carries one purchase, so the card's settled purchase, its authorizations and its merchant credits all belong to that purchase.
      An incorrect-amount dispute of a single-use card purchase needs no earlier contact with the merchant.
      The overcharge in dispute is the settled purchase amount less the authorized reference, less the gratuity allowance, less the exchange allowance and less the merchant credits counted, never below zero and never more than the settled purchase amount, rounded to the cent (half up).
      The authorized reference is the amount of the authorization the purchase settled against.
      The gratuity allowance is the gratuity rate applied to the authorized reference, and the exchange allowance is the exchange rate tolerance applied to the authorized reference, each rounded to the cent (half up); both rates are 0 percent.
      The merchant credits counted are the merchant credits linked to the purchase.
      Where the card carries two or more authorizations and all of them were placed on the same day, the later ones being incremental authorizations, the authorized reference is the total of all the card's authorizations; where it carries two or more authorizations placed on different days, the later being re-authorizations, the authorized reference is the largest single authorization; where it carries one authorization the authorized reference is the authorization the purchase settled against.
      The gratuity rate is delivery_gratuity_pct percent when the purchase is in the dining category and was made online, table_gratuity_pct percent when it is in the dining category and was made contactless, and 0 percent for any other purchase.
      The exchange rate tolerance is fx_tolerance_slow_pct percent when the purchase is foreign and settled slow_settlement_days or more calendar days after the card's latest authorization, fx_tolerance_prompt_pct percent when it is foreign and settled fewer than slow_settlement_days calendar days after it, and 0 percent when the purchase is domestic.
      Where the card carries merchant credits and none of them is linked to the purchase, every merchant credit on the card is counted; where it carries both linked and unlinked merchant credits, the linked credits and the most recent unlinked credit are counted; in every other case only the merchant credits linked to the purchase are counted.
      A merchant dispute records no customer liability.
    prerequisite: []
    cross_category: []
    compute:
