      authorized_reference: "Where the card carries two or more authorizations and all of them were placed on the same day, the later ones being incremental authorizations, the authorized reference is the total of all the card's authorizations; where it carries two or more authorizations placed on different days, the later being re-authorizations, the authorized reference is the largest single authorization; where it carries one authorization the authorized reference is the authorization the purchase settled against."
