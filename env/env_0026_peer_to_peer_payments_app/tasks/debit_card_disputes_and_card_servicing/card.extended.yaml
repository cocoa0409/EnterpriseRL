      - liability_open: "SUM('card_disputes','customer_liability', event_type='card_dispute_filed', dispute_reason='unauthorized') - SUM('card_disputes','customer_liability', event_type='card_dispute_resolved', dispute_reason='unauthorized')"
      - linked_plan: "CFIELD('wallet','variant_name')"
      - lock_after_issue: "DAYS(F('issued_date'), CFIELD('wallet','restricted_at'))"
      - liability_kept: "0 if ((linked_plan == 'Pocketwire Onyx' or linked_plan == 'Pocketwire Summit') and 0 <= lock_after_issue <= K('fast_lock_days')) else (MX(0, liability_open - K('partial_absorb_cap')) if ((linked_plan == 'Pocketwire Plus' or linked_plan == 'Pocketwire Prime') and 0 <= lock_after_issue <= K('fast_lock_days')) else liability_open)"
      - lock_length_days: "DAYS(CFIELD('wallet','restricted_at'), CFIELD('wallet','recovered_date'))"
      - lock_courtesy: "K('lock_courtesy_long') if lock_length_days >= K('long_lock_days') else (K('lock_courtesy_short') if lock_length_days >= 1 else 0)"
      - foreign_fees: "SUM('card_transactions','amount', event_type='card_fee', card_fee_type='foreign_transaction_fee')"
      - fee_return: "foreign_fees if (foreign_fees > 0 and (F('variant_name') == 'Pocketwire Visa Signature Debit' or F('variant_name') == 'Pocketwire Visa Infinite Debit' or F('variant_name') == 'Pocketwire Visa Infinite Metal Debit')) else (RND(foreign_fees * K('fee_return_share_pct') / 100, 2) if foreign_fees > 0 else 0)"
      - tenure_months: "MONTHS(CFIELD('wallet','opened_date'), NOW)"
      - tenure_courtesy: "K('tenure_courtesy_long') if tenure_months >= K('long_tenure_months') else (K('tenure_courtesy_mid') if tenure_months >= K('mid_tenure_months') else 0)"
      - result: "RND(MX(0, disputed_open - liability_kept) + lock_courtesy + fee_return + tenure_courtesy, 2)"
    compute_basis:
      disputed_open: "The open disputed amount is the disputed amount of the unauthorized disputes filed on the takeover card less the disputed amount of those already resolved"
      liability_open: "the open liability is worked out the same way from their recorded customer liability."
      linked_plan: "Where the linked plan is Pocketwire Onyx or Pocketwire Summit"
