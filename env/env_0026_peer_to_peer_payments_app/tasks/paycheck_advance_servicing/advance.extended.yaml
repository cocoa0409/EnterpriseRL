events:
  - type: advance_open
    target: advance_lines
    mutation: create
    meaning: The customer applies for a Pocketwire Advance line.
    grain: One row per advance line.
    fields:
      customer_id: The applicant.
      wallet_id: The personal account the line is linked to.
      variant_name: Always Pocketwire Advance Starter at opening.
      opened_date: Application date.
      outstanding_balance: Opening outstanding balance, always 0.00.
      tier_review_date: First day of the next calendar month.
      consecutive_on_time_repayments: 0 at opening.
      below_requirement_months: 0 at opening.
    triggers: []
  - type: advance_approve
    target: advance_lines
    mutation: {transition: {from: applied, to: active}}
    meaning: The eligibility check approves the line.
    grain: One row per advance line.
    fields:
      status: Becomes active.
    triggers: []
  - type: advance_decline
    target: advance_lines
    mutation: {transition: {from: applied, to: closed}}
    meaning: The eligibility check declines the line.
    grain: One row per advance line.
    fields:
      status: Becomes closed.
      closed_date: Decline date.
    triggers: []
  - type: advance_mark_past_due
    target: advance_lines
    mutation: {transition: {from: active, to: past_due}}
    meaning: An advance is still unpaid when its grace period ends.
    grain: One row per advance line.
    fields:
      status: Becomes past_due.
      past_due_since: Date the line became past due.
      consecutive_on_time_repayments: Reset to 0.
    triggers: []
  - type: advance_cure
    target: advance_lines
    mutation: {transition: {from: past_due, to: active}}
    meaning: Every overdue advance is repaid and the line is current again.
    grain: One row per advance line.
    fields:
      status: Returns to active.
    triggers: []
  - type: advance_suspend
    target: advance_lines
    mutation: {transition: {from: past_due, to: suspended}}
    meaning: The line stayed past due for the suspension period.
    grain: One row per advance line.
    fields:
      status: Becomes suspended.
      suspended_date: Date suspended.
    triggers: []
  - type: advance_reinstate
    target: advance_lines
    mutation: {transition: {from: suspended, to: active}}
    meaning: A suspended line repaid in full is reinstated on Pocketwire Advance Starter.
    grain: One row per advance line.
    fields:
      status: Returns to active.
      variant_name: Always Pocketwire Advance Starter on reinstatement.
    triggers: []
  - type: advance_close
    target: advance_lines
    mutation: {transition: [{from: active, to: closed}, {from: suspended, to: closed}]}
    meaning: The line is closed.
    grain: One row per advance line.
    fields:
      status: Becomes closed.
      closed_date: Closure date.
    triggers: []
  - type: advance_tier_change
    target: advance_lines
    mutation: update
    meaning: The monthly review moves the line up or down, or records another month below the direct deposit requirement.
    grain: One row per advance line.
    fields:
      variant_name: Tier after the review.
      tier_review_date: Next review date.
      below_requirement_months: Consecutive reviews below the direct deposit requirement after this review.
    triggers: []
  - type: advance_disbursement
    target: advance_ledger
    meaning: An advance is disbursed.
    grain: One row per advance.
    distinguish_by: [advance_reference]
    fields:
      advance_reference: The advance reference shown in the app.
      entry_date: Disbursement date.
      disbursed_at: Disbursement moment; the cancellation window counts from it.
      amount: Advance principal.
      delivery_destination: personal_balance or external_debit_card.
      delivery_speed: standard or express (express only to an external debit card; personal_balance deliveries are immediate and recorded as standard).
      due_date: Repayment due date.
    account: outstanding
    direction: in
    triggers:
      - event: advance:advance_fee
        map: {fee_type: advance_fee, source_txn_id: advance_entry_id, entry_date: entry_date}
      - event: advance:advance_fee
        when: {delivery_speed: express}
        map: {fee_type: express_fee, source_txn_id: advance_entry_id, entry_date: entry_date}
      - event: wallet:wallet_internal_credit
        when: {delivery_destination: personal_balance}
        map: {source_product: advance, source_txn_id: advance_entry_id, txn_date: entry_date, amount: amount}
  - type: advance_fee
    target: advance_ledger
    meaning: A fee is added to what the customer owes — flat advance fee, express fee, late fee or extension fee.
    grain: One row per fee.
    distinguish_by: [fee_type, source_txn_id, fee_period]
    fields:
      fee_type: Which fee.
      source_txn_id: The advance the fee belongs to.
      fee_period: For a late fee, the number of the late-fee period (1 for the first full week past grace); for an extension fee, the number of the extension on that advance; 0 otherwise.
      entry_date: Date charged.
      amount: Fee amount.
    account: outstanding
    direction: in
    triggers: []
  - type: advance_repayment
    target: advance_ledger
    meaning: A repayment is collected by autopay or made manually.
    grain: One row per repayment.
    distinguish_by: [source_txn_id, entry_date, repayment_method, repayment_attempt]
    fields:
      source_txn_id: The advance repaid.
      entry_date: Repayment date.
      amount: Amount repaid.
      repayment_method: autopay_direct_deposit, autopay_personal_balance, manual_personal_balance or manual_debit_card.
      repayment_attempt: 0 for a manual repayment or the first autopay attempt, then the retry number.
    account: outstanding
    direction: out
    triggers:
      - event: wallet:wallet_internal_debit
        when: {repayment_method: [autopay_personal_balance, manual_personal_balance]}
        map: {source_product: advance, source_txn_id: advance_entry_id, txn_date: entry_date, amount: amount}
  - type: advance_fee_waiver
    target: advance_ledger
    meaning: A fee is waived and removed from what the customer owes.
    grain: One row per waived fee.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The fee row waived.
      waiver_reason: cancellation_window or courtesy.
      entry_date: Waiver date.
      amount: Amount waived.
    account: outstanding
    direction: out
    triggers: []
  - type: advance_extension
    target: advance_ledger
    meaning: The due date of an advance is extended.
    grain: One row per extension.
    distinguish_by: [source_txn_id, new_due_date]
    fields:
      source_txn_id: The advance extended.
      extension_type: standard or hardship.
      entry_date: Date of the extension.
      new_due_date: Due date after the extension.
    triggers:
      - event: advance:advance_fee
        when: {extension_type: standard}
        map: {fee_type: extension_fee, source_txn_id: source_txn_id, entry_date: entry_date}
  - type: advance_write_off
    target: advance_ledger
    meaning: The unpaid balance of an advance is written off.
    grain: One row per advance written off.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The advance written off.
      entry_date: Write-off date.
      amount: Amount written off (the advance's remaining principal and fees).
    account: outstanding
    direction: out
    triggers: []

measures:
  - id: advance_msr_open_advances
    window: Current state on the handling date.
    measure: Count of advance_disbursement rows of the line whose principal and fees are not yet fully repaid, waived or written off, and the sum of their remaining principal.
  - id: advance_msr_advances_month
    window: The calendar month containing the handling date.
    measure: Count of advance_disbursement rows of the line with entry_date in the window.
  - id: advance_msr_extensions_year
    window: The calendar year containing the handling date.
    measure: Count of advance_extension rows of the line with entry_date in the window, by extension_type.
  - id: advance_msr_courtesy_waivers_year
    window: The calendar year containing the handling date.
    measure: Count of advance_fee_waiver rows of the line with waiver_reason courtesy and entry_date in the window.
  - id: advance_msr_prev_month_dd
    window: The calendar month before the month containing the handling date.
    measure: Sum and count of wallet_direct_deposit rows on the linked personal account with txn_date in the window.

policies:
  - id: advance_agg_multi_holding
    subject: [advance_open]
    rule: >-
      A customer may hold one Pocketwire Advance line.
      A line is opened only if the customer holds no other advance line whose status is anything other than closed; a customer whose earlier line closed after a write-off can apply again only once the written-off amount has been repaid in full.
    eligibility:
      - id: one_line
        applies_to: [advance_open]
        kind: dedup
        condition: "A line is opened only if the customer holds no other advance line whose status is anything other than closed"
        evidence_fields: [advance_lines.customer_id, advance_lines.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [advance_lines.customer_id]
          action_bindings:
            advance_lines.customer_id: customer_id
        dedup_contract:
          table: advance_lines
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active, past_due, suspended]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: advance_agg_outstanding
    subject: [advance_disbursement]
    rule: >-
      Several advances may be outstanding on one line at once: the count of advances not yet fully repaid (advance_msr_open_advances) plus the new one may not exceed max_outstanding_advances, and their remaining principal plus the new advance may not exceed the effective limit.
      The effective limit is advance_limit plus plan_limit_bonus while the linked personal account is on Pocketwire Prime, Pocketwire Onyx or Pocketwire Summit, and advance_limit otherwise; fees never count toward it.
      At most max_advances_per_month advances are disbursed per calendar month (advance_msr_advances_month).
    eligibility: []
    measures: [advance_msr_open_advances, advance_msr_advances_month]
    params:
      bonus_plans: [Pocketwire Prime, Pocketwire Onyx, Pocketwire Summit]
      per_tier:
        Pocketwire Advance Starter: {advance_limit: =advance_limit, plan_limit_bonus: =plan_limit_bonus, max_outstanding_advances: =max_outstanding_advances, max_advances_per_month: =max_advances_per_month}
        Pocketwire Advance Basic: {advance_limit: =advance_limit, plan_limit_bonus: =plan_limit_bonus, max_outstanding_advances: =max_outstanding_advances, max_advances_per_month: =max_advances_per_month}
        Pocketwire Advance Standard: {advance_limit: =advance_limit, plan_limit_bonus: =plan_limit_bonus, max_outstanding_advances: =max_outstanding_advances, max_advances_per_month: =max_advances_per_month}
        Pocketwire Advance Plus: {advance_limit: =advance_limit, plan_limit_bonus: =plan_limit_bonus, max_outstanding_advances: =max_outstanding_advances, max_advances_per_month: =max_advances_per_month}
        Pocketwire Advance Max: {advance_limit: =advance_limit, plan_limit_bonus: =plan_limit_bonus, max_outstanding_advances: =max_outstanding_advances, max_advances_per_month: =max_advances_per_month}
        Pocketwire Advance Elite: {advance_limit: =advance_limit, plan_limit_bonus: =plan_limit_bonus, max_outstanding_advances: =max_outstanding_advances, max_advances_per_month: =max_advances_per_month}

  - id: advance_line_opening
    subject: [advance_open, advance_approve, advance_decline]
    rule: >-
      A line can be applied for only by a customer whose personal account is active on Pocketwire Core or a higher plan, so the personal account's plan and status decide access to advances.
      The eligibility check approves the line on Pocketwire Advance Starter when the Starter entry_gate is met — the personal account opened at least min_wallet_account_age_days before the application and direct deposits in the previous calendar month of at least min_prev_month_direct_deposits — and declines it otherwise; a representative cannot approve a line or raise its starting tier.
    eligibility:
      - id: wallet_ok
        applies_to: [advance_open]
        kind: authorization
        condition: "A line can be applied for only by a customer whose personal account is active on Pocketwire Core or a higher plan"
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.status, wallet_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id

  - id: advance_disbursement_rules
    subject: [advance_disbursement]
    rule: >-
      An advance can be disbursed only while the line status is active, so no new advance is possible while any advance is past due or the line is suspended.
      The linked personal account must be active or limited for a personal_balance delivery, and an external_debit_card delivery is possible only where disbursement_destinations_allowed lists it; no advance is disbursed while the personal account is locked or closed.
      The amount is at least min_advance_amount and a whole multiple of advance_increment, within advance_agg_outstanding.
      After an advance is repaid in full, the next one waits cooldown_after_repayment_hours full hours.
      The due date is repayment_term_days calendar days after the disbursement date; a personal_balance delivery is immediate and free, a standard external_debit_card delivery costs standard_delivery_fee and arrives within standard_delivery_business_days business days, and express delivery arrives within express_delivery_max_minutes minutes for the express fee.
      Requesting an advance is the customer's own borrowing decision and is confirmed by the customer in the app.
    eligibility:
      - id: line_active
        applies_to: [advance_disbursement]
        kind: state
        condition: "An advance can be disbursed only while the line status is active, so no new advance is possible while any advance is past due or the line is suspended."
        evidence_fields: [advance_lines.advance_line_id, advance_lines.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [advance_lines.advance_line_id]
          action_bindings:
            advance_lines.advance_line_id: advance_line_id
        state_contract:
          field: advance_lines.status
          allowed: [active]

  - id: advance_fees
    subject: [advance_fee, advance_disbursement]
    rule: >-
      Every advance books one advance_fee on the disbursement date equal to the advance amount times flat_fee_pct, rounded to the cent (half up), raised to flat_fee_min and lowered to flat_fee_max.
      While the linked personal account is on Pocketwire Onyx or Pocketwire Summit, the fee after that clamp is reduced by plan_fee_discount_pct, rounded to the cent (half up); the discount never applies to express, late or extension fees.
      An express delivery books an express_fee taken from express_fee_ladder: the fee of the first band whose up_to is at or above the advance amount.
      There is no interest, and no fee other than those named in this charter is ever charged.
    eligibility: []
    formula:
      flat_fee: "min(max(round(amount * flat_fee_pct / 100, 2), flat_fee_min), flat_fee_max)"
      discounted_flat_fee: "round(flat_fee * (100 - plan_fee_discount_pct) / 100, 2)"
    params:
      discount_plans: [Pocketwire Onyx, Pocketwire Summit]
      per_tier:
        Pocketwire Advance Starter: {flat_fee_pct: =flat_fee_pct, flat_fee_max: =flat_fee_max, plan_fee_discount_pct: =plan_fee_discount_pct, express_fee_ladder: =express_fee_ladder}
        Pocketwire Advance Basic: {flat_fee_pct: =flat_fee_pct, flat_fee_max: =flat_fee_max, plan_fee_discount_pct: =plan_fee_discount_pct, express_fee_ladder: =express_fee_ladder}
        Pocketwire Advance Standard: {flat_fee_pct: =flat_fee_pct, flat_fee_max: =flat_fee_max, plan_fee_discount_pct: =plan_fee_discount_pct, express_fee_ladder: =express_fee_ladder}
        Pocketwire Advance Plus: {flat_fee_pct: =flat_fee_pct, flat_fee_max: =flat_fee_max, plan_fee_discount_pct: =plan_fee_discount_pct, express_fee_ladder: =express_fee_ladder}
        Pocketwire Advance Max: {flat_fee_pct: =flat_fee_pct, flat_fee_max: =flat_fee_max, plan_fee_discount_pct: =plan_fee_discount_pct, express_fee_ladder: =express_fee_ladder}
        Pocketwire Advance Elite: {flat_fee_pct: =flat_fee_pct, flat_fee_max: =flat_fee_max, plan_fee_discount_pct: =plan_fee_discount_pct, express_fee_ladder: =express_fee_ladder}

  - id: advance_repayment_rules
    subject: [advance_repayment]
    rule: >-
      Autopay collects each advance's remaining principal and fees on its due date — from the next direct deposit posting on or after the due date when autopay_collects_from_next_direct_deposit is true, otherwise from the personal balance — and retries autopay_retry_count times every autopay_retry_interval_days calendar days after a failure; on tiers whose partial_autopay is true a short balance is collected in part.
      The customer can repay manually at any time from the personal balance, or from an external debit card where external_card_repayment_supported is true, at least min_manual_repayment or the whole amount outstanding on that advance, and never more than that amount.
      A repayment is applied to one advance in repayment_allocation_order — its fees first, then its principal.
      An advance repaid in full on or before its due date counts as on time and adds one to consecutive_on_time_repayments; a repayment after the due date does not.
      Switching autopay off is refused on tiers whose autopay_required is true.
    eligibility: []
    params:
      per_tier:
        Pocketwire Advance Starter: {autopay_required: =autopay_required, partial_autopay: =partial_autopay, external_card_repayment_supported: =external_card_repayment_supported}
        Pocketwire Advance Basic: {autopay_required: =autopay_required, partial_autopay: =partial_autopay, external_card_repayment_supported: =external_card_repayment_supported}
        Pocketwire Advance Standard: {autopay_required: =autopay_required, partial_autopay: =partial_autopay, external_card_repayment_supported: =external_card_repayment_supported}
        Pocketwire Advance Plus: {autopay_required: =autopay_required, partial_autopay: =partial_autopay, external_card_repayment_supported: =external_card_repayment_supported}
        Pocketwire Advance Max: {autopay_required: =autopay_required, partial_autopay: =partial_autopay, external_card_repayment_supported: =external_card_repayment_supported}
        Pocketwire Advance Elite: {autopay_required: =autopay_required, partial_autopay: =partial_autopay, external_card_repayment_supported: =external_card_repayment_supported}

  - id: advance_late_fees
    subject: [advance_fee, advance_mark_past_due]
    rule: >-
      An advance still not fully repaid when grace_period_days calendar days have passed after its due date makes the line past_due, and past_due_since records that day.
      For each full late_fee_interval_days period after the grace period ends, a late_fee is booked on the advance at its unpaid principal times late_fee_pct_weekly, rounded to the cent (half up) and raised to late_fee_min, numbered by fee_period; late fees stop once their total on the advance would exceed late_fee_cap_pct_of_principal of its principal, the last one being cut to the cap.
      No late fee is booked on an advance that was extended while the extension's new due date and grace period have not passed.
    eligibility: []
    formula:
      late_fee: "max(round(amount * late_fee_pct_weekly / 100, 2), late_fee_min)"
    params:
      per_tier:
        Pocketwire Advance Starter: {grace_period_days: =grace_period_days, late_fee_pct_weekly: =late_fee_pct_weekly, late_fee_cap_pct_of_principal: =late_fee_cap_pct_of_principal}
        Pocketwire Advance Basic: {grace_period_days: =grace_period_days, late_fee_pct_weekly: =late_fee_pct_weekly, late_fee_cap_pct_of_principal: =late_fee_cap_pct_of_principal}
        Pocketwire Advance Standard: {grace_period_days: =grace_period_days, late_fee_pct_weekly: =late_fee_pct_weekly, late_fee_cap_pct_of_principal: =late_fee_cap_pct_of_principal}
        Pocketwire Advance Plus: {grace_period_days: =grace_period_days, late_fee_pct_weekly: =late_fee_pct_weekly, late_fee_cap_pct_of_principal: =late_fee_cap_pct_of_principal}
        Pocketwire Advance Max: {grace_period_days: =grace_period_days, late_fee_pct_weekly: =late_fee_pct_weekly, late_fee_cap_pct_of_principal: =late_fee_cap_pct_of_principal}
        Pocketwire Advance Elite: {grace_period_days: =grace_period_days, late_fee_pct_weekly: =late_fee_pct_weekly, late_fee_cap_pct_of_principal: =late_fee_cap_pct_of_principal}

  - id: advance_waivers
    subject: [advance_fee_waiver]
    rule: >-
      The flat advance fee and any express fee of an advance are waived with waiver_reason cancellation_window when the advance is repaid in full within the cancellation window: the full repayment is recorded no later than cancellation_window_hours full hours after the disbursement time.
      The cancellation window is counted in full elapsed hours from the disbursement time recorded in disbursed_at, and a repayment at exactly the end of the window qualifies; an express fee is waived only when the advance was delivered to the personal balance, never when it was delivered to an external card.
      A late fee can be waived with waiver_reason courtesy at the customer's request at most late_fee_courtesy_waivers_per_year times per calendar year (advance_msr_courtesy_waivers_year), one late fee per waiver, and only once the advance it belongs to is repaid in full.
      Each fee is waived at most once: a fee is waived only if no earlier advance_fee_waiver points to the same fee row.
      Flat fees outside the cancellation window, extension fees and fees on a written-off advance are never waived.
    eligibility:
      - id: cancellation_window
        applies_to: [advance_fee_waiver]
        kind: time
        condition: "the full repayment is recorded no later than cancellation_window_hours full hours after the disbursement time"
        evidence_fields: [advance_ledger.advance_entry_id, advance_ledger.disbursed_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [advance_ledger.advance_entry_id]
          action_bindings:
            advance_ledger.advance_entry_id: advance_entry_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the disbursement time
          anchor_source: advance_ledger.disbursed_at
          relation: not_after
          duration_source: variants.cancellation_window_hours
          unit: elapsed_hours
          counting_rule: "The cancellation window is counted in full elapsed hours from the disbursement time recorded in disbursed_at, and a repayment at exactly the end of the window qualifies"
          boundary: inclusive
      - id: waive_once
        applies_to: [advance_fee_waiver]
        kind: dedup
        condition: "a fee is waived only if no earlier advance_fee_waiver points to the same fee row"
        evidence_fields: [advance_ledger.source_txn_id, advance_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [advance_ledger.source_txn_id]
          action_bindings:
            advance_ledger.source_txn_id: source_txn_id
        dedup_contract:
          table: advance_ledger
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [advance_fee_waiver]}
          distinct_fields: []
    measures: [advance_msr_courtesy_waivers_year]

  - id: advance_extensions
    subject: [advance_extension, advance_fee]
    rule: >-
      A standard extension is available only on tiers whose extension_available is true, when the line has at least extension_requires_on_time_repayments consecutive on-time repayments, within max_extensions_per_advance on that advance and max_extensions_per_year on the line (advance_msr_extensions_year); it moves the due date extension_days calendar days later and books an extension_fee, at 0.00 on tiers without a fee.
      An extension is granted only before the advance is late: the extension is recorded no later than the advance's current due date.
      The due date is compared as a calendar date, and an extension on the due date itself qualifies.
      A hardship extension is granted when the verified customer states a loss of income or an emergency expense, once per hardship_extensions_per_year per calendar year, on any tier and whatever the on-time history, moving the due date hardship_extension_days calendar days later with no fee; the customer's statement is the authority for the hardship.
      Both kinds of extension are the customer's own request and change only the due date, never the amount owed.
    eligibility:
      - id: before_due
        applies_to: [advance_extension]
        kind: time
        condition: "the extension is recorded no later than the advance's current due date"
        evidence_fields: [advance_ledger.advance_entry_id, advance_ledger.due_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [advance_ledger.advance_entry_id]
          action_bindings:
            advance_ledger.advance_entry_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the advance's current due date
          anchor_source: advance_ledger.due_date
          relation: not_after
          duration_source: params.extension_offset_days
          unit: calendar_days
          counting_rule: "The due date is compared as a calendar date, and an extension on the due date itself qualifies."
          boundary: inclusive
      - id: hardship_statement
        applies_to: [advance_extension]
        kind: caller_fact
        condition: "A hardship extension is granted when the verified customer states a loss of income or an emergency expense"
        evidence_fields: [advance_ledger.advance_entry_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [advance_ledger.advance_entry_id]
          action_bindings:
            advance_ledger.advance_entry_id: source_txn_id
    measures: [advance_msr_extensions_year]
    params:
      extension_offset_days: 0

  - id: advance_delinquency
    subject: [advance_cure, advance_suspend, advance_write_off, advance_reinstate]
    rule: >-
      A past_due line returns to active as soon as no advance on it is past its grace period unpaid.
      A line is suspended once it has been past due long enough: the suspension is recorded no earlier than past_due_suspend_days calendar days after the date the line became past due.
      The suspension period is counted in calendar days from the date the line became past due, recorded in past_due_since, the day after being day 1, and suspension on the day the period is reached qualifies.
      The remaining principal and fees of each unpaid advance are written off once the line has been past due for write_off_days calendar days, counted the same way; a write-off ends collection by Pocketwire but the amount stays owed for a future line.
      A suspended line whose outstanding balance is 0.00 is reinstated on Pocketwire Advance Starter once suspension_reinstate_wait_days calendar days have passed since the full repayment; a line with a write-off is closed instead of reinstated.
    eligibility:
      - id: suspension_period
        applies_to: [advance_suspend]
        kind: time
        condition: "the suspension is recorded no earlier than past_due_suspend_days calendar days after the date the line became past due"
        evidence_fields: [advance_lines.advance_line_id, advance_lines.past_due_since]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [advance_lines.advance_line_id]
          action_bindings:
            advance_lines.advance_line_id: advance_line_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the line became past due
          anchor_source: advance_lines.past_due_since
          relation: not_before
          duration_source: variants.past_due_suspend_days
          unit: calendar_days
          counting_rule: "The suspension period is counted in calendar days from the date the line became past due, recorded in past_due_since, the day after being day 1, and suspension on the day the period is reached qualifies."
          boundary: inclusive

  - id: advance_tier_review
    subject: [advance_tier_change]
    rule: >-
      Lines are reviewed on the first day of each calendar month.
      A line that was past due at any time in the previous month drops past_due_downgrade_steps tiers, never below Pocketwire Advance Starter.
      Otherwise, when the previous month's direct deposits (advance_msr_prev_month_dd) are below the current tier's dd_min_monthly or fewer than dd_min_deposits_count, below_requirement_months goes up by one and the line drops one tier once it exceeds tier_review_grace_months; when they meet the next tier's entry_gate, the line has at least on_time_repayments_for_upgrade consecutive on-time repayments and no past-due period in the last clean_history_days_for_upgrade calendar days, the line moves up one tier.
      A tier is never changed between reviews or at the customer's request, and a representative cannot raise a limit.
    eligibility: []
    measures: [advance_msr_prev_month_dd]
    params:
      per_tier:
        Pocketwire Advance Starter: {dd_min_monthly: =dd_min_monthly, on_time_repayments_for_upgrade: =on_time_repayments_for_upgrade, tier_review_grace_months: =tier_review_grace_months}
        Pocketwire Advance Basic: {dd_min_monthly: =dd_min_monthly, on_time_repayments_for_upgrade: =on_time_repayments_for_upgrade, tier_review_grace_months: =tier_review_grace_months}
        Pocketwire Advance Standard: {dd_min_monthly: =dd_min_monthly, on_time_repayments_for_upgrade: =on_time_repayments_for_upgrade, tier_review_grace_months: =tier_review_grace_months}
        Pocketwire Advance Plus: {dd_min_monthly: =dd_min_monthly, on_time_repayments_for_upgrade: =on_time_repayments_for_upgrade, tier_review_grace_months: =tier_review_grace_months}
        Pocketwire Advance Max: {dd_min_monthly: =dd_min_monthly, on_time_repayments_for_upgrade: =on_time_repayments_for_upgrade, tier_review_grace_months: =tier_review_grace_months}
        Pocketwire Advance Elite: {dd_min_monthly: =dd_min_monthly, on_time_repayments_for_upgrade: =on_time_repayments_for_upgrade, tier_review_grace_months: =tier_review_grace_months}

  - id: advance_closure
    subject: [advance_close]
    rule: >-
      The customer can close an active line only when its outstanding balance is 0.00; closing is the customer's own decision and is confirmed in the app.
      A suspended line is closed by Pocketwire after its balance was repaid in full and it is not reinstated, or after a write-off.
      Closing the personal account requires the advance line to be closed first.
    eligibility:
      - id: nothing_outstanding
        applies_to: [advance_close]
        kind: authorization
        condition: "The customer can close an active line only when its outstanding balance is 0.00"
        evidence_fields: [advance_lines.advance_line_id, advance_lines.outstanding_balance]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [advance_lines.advance_line_id]
          action_bindings:
            advance_lines.advance_line_id: advance_line_id

extended_policies:
  - id: advance_ext_payroll_delay_relief
    base_policy_refs: [advance_waivers]
    overwrite:
      - base_policy: advance_waivers
        superseded_clause: >-
          A late fee can be waived with waiver_reason courtesy at the customer's request at most late_fee_courtesy_waivers_per_year times per calendar year (advance_msr_courtesy_waivers_year), one late fee per waiver, and only once the advance it belongs to is repaid in full.
        replaced_by: >-
          A late fee booked on an advance whose autopay collection came from a direct deposit that posted after the advance's due date is relieved in part by a payroll-delay relief, booked once that advance is repaid in full as a waiver of that one late fee with waiver_reason courtesy and without any request from the customer; a payroll-delay relief does not count toward late_fee_courtesy_waivers_per_year.
      - base_policy: advance_waivers
        superseded_clause: >-
          The flat advance fee and any express fee of an advance are waived with waiver_reason cancellation_window when the advance is repaid in full within the cancellation window: the full repayment is recorded no later than cancellation_window_hours full hours after the disbursement time.
        replaced_by: >-
          A payroll-delay relief is granted without regard to the cancellation window, which governs only the flat advance fee and the express fee.
    trigger: state_due
    subject: [advance_fee_waiver]
    computes: amount
    target_tool: grant_payroll_delay_relief_50112cf3
    params:
      standard_share: 0.10
      long_delay_days: 14
      short_delay_days: 7
      long_delay_share: 0.20
      short_delay_share: 0.10
      regular_count_high: 12
      regular_count_low: 6
      regular_share_high: 0.10
      regular_share_low: 0.05
      account_long_days: 1095
      account_mid_days: 365
      account_share_long: 0.05
      account_share_mid: 0.02
      clean_min_advances: 3
      clean_share_high: 0.05
      clean_share_low: 0.02
      plan_share_summit: 0.10
      plan_share_member: 0.05
      card_purchases_min: 10
      card_multiplier_high: 1.4
      card_purchase_credit: 0.02
    rule: >
      A late fee booked on an advance whose autopay collection came from a direct deposit that posted after the advance's due date is relieved in part by a payroll-delay relief, booked once that advance is repaid in full as a waiver of that one late fee with waiver_reason courtesy and without any request from the customer; a payroll-delay relief does not count toward late_fee_courtesy_waivers_per_year.
      A payroll-delay relief is granted without regard to the cancellation window, which governs only the flat advance fee and the express fee.
      The flat advance fee and any express fee of an advance are still waived with waiver_reason cancellation_window when the advance is repaid in full within the cancellation window.
      Apart from the payroll-delay relief, a late fee can still be waived with waiver_reason courtesy at the customer's request at most late_fee_courtesy_waivers_per_year times per calendar year, one late fee per waiver, and only once the advance it belongs to is repaid in full.
      The relief acts on the late fee most recently booked on the line.
      The relief share starts from standard_share of that late fee.
      The relief is that late fee times the relief share, rounded to the cent (half up), and never more than the late fee itself.
      A window of a number of months before the handling date covers the records dated after the same day of the month that many months before the handling date, up to and including the handling date.
      The payroll delay is counted in calendar days from the due date of the line's most recent advance to the date of the line's most recent autopay collection from a direct deposit; a payroll delay of at least long_delay_days days adds long_delay_share to the relief share, a payroll delay of at least short_delay_days days but fewer than long_delay_days days adds short_delay_share, and a shorter payroll delay adds nothing.
      When the linked personal account received at least regular_count_high direct deposits totalling at least six times dd_min_monthly in the six months before the handling date, regular_share_high is added to the relief share; when it received at least regular_count_low direct deposits totalling at least three times dd_min_monthly in that window without meeting both parts of the higher test, regular_share_low is added to the relief share; otherwise the payroll record adds nothing to the relief share.
      When the linked personal account was opened at least account_long_days days before the handling date, account_share_long is added to the relief share; when it was opened at least account_mid_days days but fewer than account_long_days days before the handling date, account_share_mid is added to the relief share; a younger personal account adds nothing to the relief share.
      When the line carries at most one late fee in the twelve months before the handling date and at least clean_min_advances advances were disbursed on it in that window, clean_share_high is added to the relief share; when it carries at most one late fee in that window but fewer than clean_min_advances advances were disbursed on it, clean_share_low is added to the relief share; when it carries two or more late fees in that window, its lateness record adds nothing to the relief share.
      When the linked personal account is on Pocketwire Summit, plan_share_summit is added to the relief share; when it is on Pocketwire Onyx or Pocketwire Prime, plan_share_member is added to the relief share; any other plan adds nothing to the relief share.
      When the customer holds an active physical Pocketwire Visa Platinum Debit, Signature Debit, Infinite Debit or Infinite Metal Debit card and made at least card_purchases_min card purchases in the three months before the handling date, the late fee times the relief share is multiplied by card_multiplier_high before the relief is rounded; when the customer holds an active physical Pocketwire Visa Classic Debit or Gold Debit card and made at least card_purchases_min card purchases in that window, card_purchase_credit is added to the late fee times the relief share for each card purchase in that window before the relief is rounded; otherwise the late fee times the relief share is rounded as it stands.
    prerequisite: []
    cross_category:
      - category: wallet
        as: history
        reads: [wallet_transactions.amount, wallet_transactions.event_type, wallet_transactions.txn_date, opened_date, variant_name]
        note: The payroll-record share counts and sums the linked personal account's direct deposits over six months, the account-age share reads its opening date and the plan share reads its plan.
      - category: card
        as: branch
        reads: [variant_name, status, card_form, card_transactions.event_type, card_transactions.txn_date]
        note: The card multiplier is chosen from the physical card's tier and the count of card purchases in the last three months.
    compute:
      - late_fee_amount: "LATEST('advance_ledger','amount', date_field='entry_date', event_type='advance_fee', fee_type='late_fee')"
      - advance_due_date: "LATEST('advance_ledger','due_date', date_field='entry_date', event_type='advance_disbursement')"
      - collection_date: "LATEST('advance_ledger','entry_date', date_field='entry_date', event_type='advance_repayment', repayment_method='autopay_direct_deposit')"
      - payroll_delay_days: "DAYS(advance_due_date, collection_date)"
      - delay_share: "K('long_delay_share') if payroll_delay_days >= K('long_delay_days') else (K('short_delay_share') if payroll_delay_days >= K('short_delay_days') else 0)"
      - dd_count_6m: "XCOUNT('wallet','wallet_transactions', within_months=6, date_field='txn_date', event_type='wallet_direct_deposit')"
      - dd_total_6m: "XSUM('wallet','wallet_transactions','amount', within_months=6, date_field='txn_date', event_type='wallet_direct_deposit')"
      - regularity_share: "K('regular_share_high') if (dd_count_6m >= K('regular_count_high') and dd_total_6m >= 6 * P('dd_min_monthly')) else (K('regular_share_low') if (dd_count_6m >= K('regular_count_low') and dd_total_6m >= 3 * P('dd_min_monthly')) else 0)"
      - account_age_days: "DAYS(CFIELD('wallet','opened_date'), NOW)"
      - account_share: "K('account_share_long') if account_age_days >= K('account_long_days') else (K('account_share_mid') if account_age_days >= K('account_mid_days') else 0)"
      - late_fees_12m: "COUNT('advance_ledger', within_months=12, date_field='entry_date', event_type='advance_fee', fee_type='late_fee')"
      - advances_12m: "COUNT('advance_ledger', within_months=12, date_field='entry_date', event_type='advance_disbursement')"
      - clean_share: "K('clean_share_high') if (late_fees_12m <= 1 and advances_12m >= K('clean_min_advances')) else (K('clean_share_low') if (late_fees_12m <= 1 and advances_12m < K('clean_min_advances')) else 0)"
      - wallet_plan: "CFIELD('wallet','variant_name')"
      - plan_share: "K('plan_share_summit') if wallet_plan == 'Pocketwire Summit' else (K('plan_share_member') if (wallet_plan == 'Pocketwire Onyx' or wallet_plan == 'Pocketwire Prime') else 0)"
      - relief_share: "K('standard_share') + delay_share + regularity_share + account_share + clean_share + plan_share"
      - unrounded_relief: "late_fee_amount * relief_share"
      - card_tier: "CFIELD('card','variant_name', status='active', card_form='physical')"
      - card_purchases_3m: "XCOUNT('card','card_transactions', within_months=3, date_field='txn_date', event_type='card_purchase')"
      - rounded_relief: "RND(unrounded_relief * K('card_multiplier_high'), 2) if ((card_tier == 'Pocketwire Visa Platinum Debit' or card_tier == 'Pocketwire Visa Signature Debit' or card_tier == 'Pocketwire Visa Infinite Debit' or card_tier == 'Pocketwire Visa Infinite Metal Debit') and card_purchases_3m >= K('card_purchases_min')) else (RND(unrounded_relief + card_purchases_3m * K('card_purchase_credit'), 2) if ((card_tier == 'Pocketwire Visa Classic Debit' or card_tier == 'Pocketwire Visa Gold Debit') and card_purchases_3m >= K('card_purchases_min')) else RND(unrounded_relief, 2))"
      - result: "MN(late_fee_amount, rounded_relief)"
    compute_basis:
      late_fee_amount: "The relief acts on the late fee most recently booked on the line."
      advance_due_date: "The payroll delay is counted in calendar days from the due date of the line's most recent advance to the date of the line's most recent autopay collection from a direct deposit"
      collection_date: "The payroll delay is counted in calendar days from the due date of the line's most recent advance to the date of the line's most recent autopay collection from a direct deposit"
      payroll_delay_days: "The payroll delay is counted in calendar days from the due date of the line's most recent advance to the date of the line's most recent autopay collection from a direct deposit"
      delay_share: "a payroll delay of at least long_delay_days days adds long_delay_share to the relief share, a payroll delay of at least short_delay_days days but fewer than long_delay_days days adds short_delay_share, and a shorter payroll delay adds nothing."
      dd_count_6m: "A window of a number of months before the handling date covers the records dated after the same day of the month that many months before the handling date, up to and including the handling date."
      dd_total_6m: "A window of a number of months before the handling date covers the records dated after the same day of the month that many months before the handling date, up to and including the handling date."
      regularity_share: "When the linked personal account received at least regular_count_high direct deposits totalling at least six times dd_min_monthly in the six months before the handling date, regular_share_high is added to the relief share; when it received at least regular_count_low direct deposits totalling at least three times dd_min_monthly in that window without meeting both parts of the higher test, regular_share_low is added to the relief share; otherwise the payroll record adds nothing to the relief share."
      account_age_days: "When the linked personal account was opened at least account_long_days days before the handling date"
      account_share: "When the linked personal account was opened at least account_long_days days before the handling date, account_share_long is added to the relief share; when it was opened at least account_mid_days days but fewer than account_long_days days before the handling date, account_share_mid is added to the relief share; a younger personal account adds nothing to the relief share."
      late_fees_12m: "When the line carries at most one late fee in the twelve months before the handling date"
      advances_12m: "at least clean_min_advances advances were disbursed on it in that window"
      clean_share: "When the line carries at most one late fee in the twelve months before the handling date and at least clean_min_advances advances were disbursed on it in that window, clean_share_high is added to the relief share; when it carries at most one late fee in that window but fewer than clean_min_advances advances were disbursed on it, clean_share_low is added to the relief share; when it carries two or more late fees in that window, its lateness record adds nothing to the relief share."
      wallet_plan: "When the linked personal account is on Pocketwire Summit"
      plan_share: "When the linked personal account is on Pocketwire Summit, plan_share_summit is added to the relief share; when it is on Pocketwire Onyx or Pocketwire Prime, plan_share_member is added to the relief share; any other plan adds nothing to the relief share."
      relief_share: "The relief share starts from standard_share of that late fee."
      unrounded_relief: "The relief is that late fee times the relief share, rounded to the cent (half up), and never more than the late fee itself."
      card_tier: "When the customer holds an active physical Pocketwire Visa Platinum Debit, Signature Debit, Infinite Debit or Infinite Metal Debit card"
      card_purchases_3m: "made at least card_purchases_min card purchases in the three months before the handling date"
      rounded_relief: "When the customer holds an active physical Pocketwire Visa Platinum Debit, Signature Debit, Infinite Debit or Infinite Metal Debit card and made at least card_purchases_min card purchases in the three months before the handling date, the late fee times the relief share is multiplied by card_multiplier_high before the relief is rounded; when the customer holds an active physical Pocketwire Visa Classic Debit or Gold Debit card and made at least card_purchases_min card purchases in that window, card_purchase_credit is added to the late fee times the relief share for each card purchase in that window before the relief is rounded; otherwise the late fee times the relief share is rounded as it stands."
      result: "The relief is that late fee times the relief share, rounded to the cent (half up), and never more than the late fee itself."
    factors:
      - id: collection_lag
        effect: parameter
        decides: delay_share
        bindings: [advance_due_date, collection_date, payroll_delay_days, delay_share]
        ladder:
          - when: "the payroll delay from the advance's due date to its autopay collection from a direct deposit is at least long_delay_days calendar days"
            value: "K('long_delay_share')"
          - when: "the payroll delay is at least short_delay_days but fewer than long_delay_days calendar days"
            value: "K('short_delay_share')"
          - when: "otherwise (a payroll delay shorter than short_delay_days calendar days)"
            value: "0"
        baseline:
          delay_share: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: payroll_record
        effect: parameter
        decides: regularity_share
        bindings: [dd_count_6m, dd_total_6m, regularity_share]
        ladder:
          - when: "at least regular_count_high direct deposits into the linked personal account in the six months before the handling date AND those deposits total at least six times dd_min_monthly"
            value: "K('regular_share_high')"
          - when: "at least regular_count_low direct deposits AND a total of at least three times dd_min_monthly in that window, without both parts of the higher test"
            value: "K('regular_share_low')"
          - when: "otherwise"
            value: "0"
        baseline:
          regularity_share: "0"
        evidence: [cross_category, history]
        cross_difficulty: wallet
      - id: account_age
        effect: parameter
        decides: account_share
        bindings: [account_age_days, account_share]
        ladder:
          - when: "the linked personal account was opened at least account_long_days days before the handling date"
            value: "K('account_share_long')"
          - when: "it was opened at least account_mid_days but fewer than account_long_days days before the handling date"
            value: "K('account_share_mid')"
          - when: "otherwise (a personal account younger than account_mid_days days)"
            value: "0"
        baseline:
          account_share: "0"
        evidence: [cross_category, date]
        cross_difficulty: wallet
      - id: lateness_record
        effect: parameter
        decides: clean_share
        bindings: [late_fees_12m, advances_12m, clean_share]
        ladder:
          - when: "at most one late fee on the line in the twelve months before the handling date AND at least clean_min_advances advances disbursed on the line in that window"
            value: "K('clean_share_high')"
          - when: "at most one late fee in that window AND fewer than clean_min_advances advances disbursed in it"
            value: "K('clean_share_low')"
          - when: "otherwise (two or more late fees on the line in that window)"
            value: "0"
        baseline:
          clean_share: "0"
        evidence: [history]
        cross_difficulty: null
      - id: plan_membership
        effect: parameter
        decides: plan_share
        bindings: [wallet_plan, plan_share]
        ladder:
          - when: "the linked personal account is on Pocketwire Summit"
            value: "K('plan_share_summit')"
          - when: "the linked personal account is on Pocketwire Onyx or Pocketwire Prime"
            value: "K('plan_share_member')"
          - when: "otherwise (Pocketwire Lite, Core or Plus)"
            value: "0"
        baseline:
          plan_share: "0"
        evidence: [cross_category]
        cross_difficulty: wallet
      - id: card_multiplier
        effect: method
        decides: rounded_relief
        bindings: [card_tier, card_purchases_3m, rounded_relief]
        ladder:
          - when: "an active physical Pocketwire Visa Platinum, Signature, Infinite or Infinite Metal Debit card AND at least card_purchases_min card purchases in the three months before the handling date"
            method: "the late fee times the relief share is multiplied by card_multiplier_high, then rounded to the cent (half up)"
          - when: "an active physical Pocketwire Visa Classic or Gold Debit card AND at least card_purchases_min card purchases in that window"
            method: "card_purchase_credit is added to the late fee times the relief share for each card purchase in the window, then the sum is rounded to the cent (half up)"
          - when: "otherwise"
            method: "the late fee times the relief share is rounded to the cent (half up) as it stands"
        baseline:
          rounded_relief: "RND(unrounded_relief, 2)"
        evidence: [cross_category, history]
        cross_difficulty: card
    baseline:
      rule: >-
        The relief acts on the late fee most recently booked on the line. The relief share starts from standard_share of that late fee. The relief is that late fee times the relief share, rounded to the cent (half up), and never more than the late fee itself.
      params: [standard_share]
    inputs:
      history:
        - {table: advance_ledger, aggregate: latest, field: amount, filters: {event_type: advance_fee, fee_type: late_fee}}
        - {table: advance_ledger, aggregate: latest, field: due_date, filters: {event_type: advance_disbursement}}
        - {table: advance_ledger, aggregate: latest, field: entry_date, filters: {event_type: advance_repayment, repayment_method: autopay_direct_deposit}}
        - {table: advance_ledger, aggregate: count, field: advance_entry_id, within_months: 12, filters: {event_type: advance_fee, fee_type: late_fee}}
        - {table: advance_ledger, aggregate: count, field: advance_entry_id, within_months: 12, filters: {event_type: advance_disbursement}}
        - {category: wallet, table: wallet_transactions, aggregate: count, field: txn_id, within_months: 6, filters: {event_type: wallet_direct_deposit}}
        - {category: wallet, table: wallet_transactions, aggregate: sum, field: amount, within_months: 6, filters: {event_type: wallet_direct_deposit}}
        - {category: card, table: card_transactions, aggregate: count, field: card_txn_id, within_months: 3, filters: {event_type: card_purchase}}
      cross_category: [wallet, card]

  - id: advance_ext_largest_advance
    base_policy_refs: [advance_agg_outstanding, advance_disbursement_rules, advance_fees]
    overwrite:
      - base_policy: advance_agg_outstanding
        superseded_clause: >-
          The effective limit is advance_limit plus plan_limit_bonus while the linked personal account is on Pocketwire Prime, Pocketwire Onyx or Pocketwire Summit, and advance_limit otherwise; fees never count toward it.
        replaced_by: >-
          The room for a new advance starts from the tier's advance_limit.
      - base_policy: advance_agg_outstanding
        superseded_clause: >-
          and their remaining principal plus the new advance may not exceed the effective limit.
        replaced_by: >-
          The largest advance worked out here takes the place of the effective limit as the ceiling on a new advance: a new advance may not exceed it, and the remaining principal of the line's advances is already taken off in it.
      - base_policy: advance_disbursement_rules
        superseded_clause: >-
          The amount is at least min_advance_amount and a whole multiple of advance_increment, within advance_agg_outstanding.
        replaced_by: >-
          The amount of a new advance is at least min_advance_amount, a whole multiple of advance_increment and within the largest advance worked out here, and the count of advances not yet fully repaid plus the new one still may not exceed max_outstanding_advances.
    trigger: on_request
    subject: [advance_disbursement]
    computes: amount
    target_tool: request_advance_00c9f515
    params:
      payroll_high_bonus: 50
      payroll_low_bonus: 25
      summit_bonus_multiplier: 2
      tenure_long_days: 1095
      tenure_mid_days: 365
      tenure_long_bonus: 30
      tenure_mid_bonus: 15
      track_high_count: 4
      track_low_count: 2
      track_high_bonus: 20
      track_low_bonus: 10
      holdback_high_threshold: 2.00
      holdback_high: 40
      holdback_low: 20
      card_purchases_min: 10
      card_uplift_high: 1.10
      card_purchase_room: 1.00
    rule: >
      When a customer asks for the largest advance the line can take, the amount is worked out as set out here and the customer requests it in the app as a standard delivery to an external debit card; the flat advance fee and the due date of that advance are those of the fee and disbursement rules and are booked with it.
      The largest advance a line can take is worked out only after every late fee on the line that qualifies for payroll-delay relief carries its relief waiver entry.
      The room for a new advance starts from the tier's advance_limit.
      The room is reduced by the remaining principal of the line's advances, which is the principal disbursed on the line less the part of its repayments and waivers left after all of its booked fees are covered, never below zero.
      The largest advance is the room rounded down to a whole multiple of advance_increment.
      The largest advance worked out here takes the place of the effective limit as the ceiling on a new advance: a new advance may not exceed it, and the remaining principal of the line's advances is already taken off in it.
      The amount of a new advance is at least min_advance_amount, a whole multiple of advance_increment and within the largest advance worked out here, and the count of advances not yet fully repaid plus the new one still may not exceed max_outstanding_advances.
      A window of a number of months before the handling date covers the records dated after the same day of the month that many months before the handling date, up to and including the handling date.
      When the linked personal account received direct deposits totalling at least twice dd_min_monthly from at least two deposits in the month before the handling date, payroll_high_bonus is added to the room; when the deposits in that month total at least dd_min_monthly from at least dd_min_deposits_count deposits without meeting both parts of the higher test, payroll_low_bonus is added to the room; otherwise the payroll adds nothing to the room.
      When the linked personal account is on Pocketwire Summit, summit_bonus_multiplier times plan_limit_bonus is added to the room; when it is on Pocketwire Onyx or Pocketwire Prime, plan_limit_bonus is added to the room; any other plan adds nothing to the room.
      When the line was opened at least tenure_long_days days before the handling date, tenure_long_bonus is added to the room; when it was opened at least tenure_mid_days days but fewer than tenure_long_days days before the handling date, tenure_mid_bonus is added to the room; a younger line adds nothing to the room.
      When at least track_high_count advances were disbursed on the line in the twelve months before the handling date, track_high_bonus is added to the room; when at least track_low_count but fewer than track_high_count advances were disbursed on it in that window, track_low_bonus is added to the room; fewer advances add nothing to the room.
      The late fees kept on the line are the late fees booked on it in the twelve months before the handling date less the courtesy waivers booked on it in that window; when the late fees kept reach holdback_high_threshold, holdback_high is taken off the room; when they are above zero but below holdback_high_threshold, holdback_low is taken off the room; when none are kept, nothing is taken off the room.
      When the customer holds an active physical Pocketwire Visa Platinum Debit, Signature Debit, Infinite Debit or Infinite Metal Debit card and made at least card_purchases_min card purchases in the three months before the handling date, the room is multiplied by card_uplift_high before it is rounded down; when the customer holds an active physical Pocketwire Visa Classic Debit or Gold Debit card and made at least card_purchases_min card purchases in that window, card_purchase_room is added to the room for each card purchase in that window before it is rounded down; otherwise the room is rounded down as it stands.
      The bonuses are added to advance_limit first, the holdback and the remaining principal are then taken off, the card treatment then acts on that room, and only the result is rounded down.
    prerequisite:
      - problem: advance_ext_payroll_delay_relief
        kind: value_input
        gate: kept_late_fees
        form: state
        policy_source: >-
          The largest advance a line can take is worked out only after every late fee on the line that qualifies for payroll-delay relief carries its relief waiver entry.
        condition: >-
          Every late fee on the line that meets the payroll-delay relief rule (its advance collected by autopay from a direct deposit that posted after the due date, the advance repaid in full) has an advance_fee_waiver row with waiver_reason courtesy pointing at it on the line's ledger.
        resolved_by: grant_payroll_delay_relief_50112cf3
        effect: >-
          The relief waiver lowers the late fees kept on the line in the twelve-month window, so the kept_late_fees binding falls and the holdback tier the room takes can change.
    cross_category:
      - category: wallet
        as: history
        reads: [wallet_transactions.amount, wallet_transactions.event_type, wallet_transactions.txn_date, variant_name]
        note: The payroll bonus sums and counts the last month's direct deposits on the linked personal account and the plan bonus reads its plan.
      - category: card
        as: branch
        reads: [variant_name, status, card_form, card_transactions.event_type, card_transactions.txn_date]
        note: The card multiplier is chosen from the physical card's tier and the count of card purchases in the last three months.
    compute:
      - dd_total_1m: "XSUM('wallet','wallet_transactions','amount', within_months=1, date_field='txn_date', event_type='wallet_direct_deposit')"
      - dd_count_1m: "XCOUNT('wallet','wallet_transactions', within_months=1, date_field='txn_date', event_type='wallet_direct_deposit')"
      - payroll_bonus: "K('payroll_high_bonus') if (dd_total_1m >= 2 * P('dd_min_monthly') and dd_count_1m >= 2) else (K('payroll_low_bonus') if (dd_total_1m >= P('dd_min_monthly') and dd_count_1m >= P('dd_min_deposits_count')) else 0)"
      - wallet_plan: "CFIELD('wallet','variant_name')"
      - plan_bonus: "K('summit_bonus_multiplier') * P('plan_limit_bonus') if wallet_plan == 'Pocketwire Summit' else (P('plan_limit_bonus') if (wallet_plan == 'Pocketwire Onyx' or wallet_plan == 'Pocketwire Prime') else 0)"
      - line_age_days: "DAYS(F('opened_date'), NOW)"
      - tenure_bonus: "K('tenure_long_bonus') if line_age_days >= K('tenure_long_days') else (K('tenure_mid_bonus') if line_age_days >= K('tenure_mid_days') else 0)"
      - advances_12m: "COUNT('advance_ledger', within_months=12, date_field='entry_date', event_type='advance_disbursement')"
      - track_bonus: "K('track_high_bonus') if advances_12m >= K('track_high_count') else (K('track_low_bonus') if advances_12m >= K('track_low_count') else 0)"
      - late_fees_booked_12m: "SUM('advance_ledger','amount', within_months=12, date_field='entry_date', event_type='advance_fee', fee_type='late_fee')"
      - courtesy_waived_12m: "SUM('advance_ledger','amount', within_months=12, date_field='entry_date', event_type='advance_fee_waiver', waiver_reason='courtesy')"
      - kept_late_fees: "RND(late_fees_booked_12m - courtesy_waived_12m, 2)"
      - holdback: "K('holdback_high') if kept_late_fees >= K('holdback_high_threshold') else (K('holdback_low') if kept_late_fees > 0 else 0)"
      - principal_disbursed: "SUM('advance_ledger','amount', event_type='advance_disbursement')"
      - fees_booked: "SUM('advance_ledger','amount', event_type='advance_fee')"
      - repaid_total: "SUM('advance_ledger','amount', event_type='advance_repayment')"
      - waived_total: "SUM('advance_ledger','amount', event_type='advance_fee_waiver')"
      - remaining_principal: "MX(0, principal_disbursed - MX(0, repaid_total + waived_total - fees_booked))"
      - room: "P('advance_limit') + payroll_bonus + plan_bonus + tenure_bonus + track_bonus - holdback - remaining_principal"
      - card_tier: "CFIELD('card','variant_name', status='active', card_form='physical')"
      - card_purchases_3m: "XCOUNT('card','card_transactions', within_months=3, date_field='txn_date', event_type='card_purchase')"
      - adjusted_room: "room * K('card_uplift_high') if ((card_tier == 'Pocketwire Visa Platinum Debit' or card_tier == 'Pocketwire Visa Signature Debit' or card_tier == 'Pocketwire Visa Infinite Debit' or card_tier == 'Pocketwire Visa Infinite Metal Debit') and card_purchases_3m >= K('card_purchases_min')) else (room + card_purchases_3m * K('card_purchase_room') if ((card_tier == 'Pocketwire Visa Classic Debit' or card_tier == 'Pocketwire Visa Gold Debit') and card_purchases_3m >= K('card_purchases_min')) else room)"
      - result: "int(adjusted_room / P('advance_increment')) * P('advance_increment')"
    compute_basis:
      dd_total_1m: "When the linked personal account received direct deposits totalling at least twice dd_min_monthly from at least two deposits in the month before the handling date"
      dd_count_1m: "When the linked personal account received direct deposits totalling at least twice dd_min_monthly from at least two deposits in the month before the handling date"
      payroll_bonus: "When the linked personal account received direct deposits totalling at least twice dd_min_monthly from at least two deposits in the month before the handling date, payroll_high_bonus is added to the room; when the deposits in that month total at least dd_min_monthly from at least dd_min_deposits_count deposits without meeting both parts of the higher test, payroll_low_bonus is added to the room; otherwise the payroll adds nothing to the room."
      wallet_plan: "When the linked personal account is on Pocketwire Summit"
      plan_bonus: "When the linked personal account is on Pocketwire Summit, summit_bonus_multiplier times plan_limit_bonus is added to the room; when it is on Pocketwire Onyx or Pocketwire Prime, plan_limit_bonus is added to the room; any other plan adds nothing to the room."
      line_age_days: "When the line was opened at least tenure_long_days days before the handling date"
      tenure_bonus: "When the line was opened at least tenure_long_days days before the handling date, tenure_long_bonus is added to the room; when it was opened at least tenure_mid_days days but fewer than tenure_long_days days before the handling date, tenure_mid_bonus is added to the room; a younger line adds nothing to the room."
      advances_12m: "When at least track_high_count advances were disbursed on the line in the twelve months before the handling date"
      track_bonus: "When at least track_high_count advances were disbursed on the line in the twelve months before the handling date, track_high_bonus is added to the room; when at least track_low_count but fewer than track_high_count advances were disbursed on it in that window, track_low_bonus is added to the room; fewer advances add nothing to the room."
      late_fees_booked_12m: "The late fees kept on the line are the late fees booked on it in the twelve months before the handling date less the courtesy waivers booked on it in that window"
      courtesy_waived_12m: "The late fees kept on the line are the late fees booked on it in the twelve months before the handling date less the courtesy waivers booked on it in that window"
      kept_late_fees: "The late fees kept on the line are the late fees booked on it in the twelve months before the handling date less the courtesy waivers booked on it in that window"
      holdback: "when the late fees kept reach holdback_high_threshold, holdback_high is taken off the room; when they are above zero but below holdback_high_threshold, holdback_low is taken off the room; when none are kept, nothing is taken off the room."
      principal_disbursed: "The room is reduced by the remaining principal of the line's advances, which is the principal disbursed on the line less the part of its repayments and waivers left after all of its booked fees are covered, never below zero."
      fees_booked: "The room is reduced by the remaining principal of the line's advances, which is the principal disbursed on the line less the part of its repayments and waivers left after all of its booked fees are covered, never below zero."
      repaid_total: "The room is reduced by the remaining principal of the line's advances, which is the principal disbursed on the line less the part of its repayments and waivers left after all of its booked fees are covered, never below zero."
      waived_total: "The room is reduced by the remaining principal of the line's advances, which is the principal disbursed on the line less the part of its repayments and waivers left after all of its booked fees are covered, never below zero."
      remaining_principal: "The room is reduced by the remaining principal of the line's advances, which is the principal disbursed on the line less the part of its repayments and waivers left after all of its booked fees are covered, never below zero."
      room: "The bonuses are added to advance_limit first, the holdback and the remaining principal are then taken off, the card treatment then acts on that room, and only the result is rounded down."
      card_tier: "When the customer holds an active physical Pocketwire Visa Platinum Debit, Signature Debit, Infinite Debit or Infinite Metal Debit card"
      card_purchases_3m: "made at least card_purchases_min card purchases in the three months before the handling date"
      adjusted_room: "When the customer holds an active physical Pocketwire Visa Platinum Debit, Signature Debit, Infinite Debit or Infinite Metal Debit card and made at least card_purchases_min card purchases in the three months before the handling date, the room is multiplied by card_uplift_high before it is rounded down; when the customer holds an active physical Pocketwire Visa Classic Debit or Gold Debit card and made at least card_purchases_min card purchases in that window, card_purchase_room is added to the room for each card purchase in that window before it is rounded down; otherwise the room is rounded down as it stands."
      result: "The largest advance is the room rounded down to a whole multiple of advance_increment."
    factors:
      - id: payroll_bonus
        effect: parameter
        decides: payroll_bonus
        bindings: [dd_total_1m, dd_count_1m, payroll_bonus]
        ladder:
          - when: "direct deposits into the linked personal account in the month before the handling date total at least twice dd_min_monthly AND come from at least two deposits"
            value: "K('payroll_high_bonus')"
          - when: "they total at least dd_min_monthly AND come from at least dd_min_deposits_count deposits, without both parts of the higher test"
            value: "K('payroll_low_bonus')"
          - when: "otherwise"
            value: "0"
        baseline:
          payroll_bonus: "0"
        evidence: [cross_category, history]
        cross_difficulty: wallet
      - id: plan_bonus
        effect: parameter
        decides: plan_bonus
        bindings: [wallet_plan, plan_bonus]
        ladder:
          - when: "the linked personal account is on Pocketwire Summit"
            value: "K('summit_bonus_multiplier') * P('plan_limit_bonus')"
          - when: "the linked personal account is on Pocketwire Onyx or Pocketwire Prime"
            value: "P('plan_limit_bonus')"
          - when: "otherwise (Pocketwire Lite, Core or Plus)"
            value: "0"
        baseline:
          plan_bonus: "0"
        evidence: [cross_category]
        cross_difficulty: wallet
      - id: line_tenure
        effect: parameter
        decides: tenure_bonus
        bindings: [line_age_days, tenure_bonus]
        ladder:
          - when: "the line was opened at least tenure_long_days days before the handling date"
            value: "K('tenure_long_bonus')"
          - when: "it was opened at least tenure_mid_days but fewer than tenure_long_days days before the handling date"
            value: "K('tenure_mid_bonus')"
          - when: "otherwise (a line younger than tenure_mid_days days)"
            value: "0"
        baseline:
          tenure_bonus: "0"
        evidence: [date]
        cross_difficulty: null
      - id: borrowing_track
        effect: parameter
        decides: track_bonus
        bindings: [advances_12m, track_bonus]
        ladder:
          - when: "at least track_high_count advances disbursed on the line in the twelve months before the handling date"
            value: "K('track_high_bonus')"
          - when: "at least track_low_count but fewer than track_high_count advances in that window"
            value: "K('track_low_bonus')"
          - when: "otherwise (fewer than track_low_count advances)"
            value: "0"
        baseline:
          track_bonus: "0"
        evidence: [history]
        cross_difficulty: null
      - id: lateness_holdback
        effect: parameter
        decides: holdback
        bindings: [late_fees_booked_12m, courtesy_waived_12m, kept_late_fees, holdback]
        ladder:
          - when: "late fees kept on the line (late fees booked in the twelve months before the handling date less courtesy waivers booked in that window) of at least holdback_high_threshold"
            value: "K('holdback_high')"
          - when: "late fees kept above zero but below holdback_high_threshold"
            value: "K('holdback_low')"
          - when: "otherwise (no late fee kept)"
            value: "0"
        baseline:
          holdback: "0"
        evidence: [history]
        cross_difficulty: null
      - id: card_uplift
        effect: method
        decides: adjusted_room
        bindings: [card_tier, card_purchases_3m, adjusted_room]
        ladder:
          - when: "an active physical Pocketwire Visa Platinum, Signature, Infinite or Infinite Metal Debit card AND at least card_purchases_min card purchases in the three months before the handling date"
            method: "the room is multiplied by card_uplift_high and the product is rounded down to a whole multiple of advance_increment"
          - when: "an active physical Pocketwire Visa Classic or Gold Debit card AND at least card_purchases_min card purchases in that window"
            method: "card_purchase_room is added to the room for each card purchase in the window and the sum is rounded down to a whole multiple of advance_increment"
          - when: "otherwise"
            method: "the room itself is rounded down to a whole multiple of advance_increment"
        baseline:
          adjusted_room: "room"
        evidence: [cross_category, history]
        cross_difficulty: card
    baseline:
      rule: >-
        The room for a new advance starts from the tier's advance_limit. The room is reduced by the remaining principal of the line's advances, which is the principal disbursed on the line less the part of its repayments and waivers left after all of its booked fees are covered, never below zero. The largest advance is the room rounded down to a whole multiple of advance_increment.
      params: [advance_limit, advance_increment]
    inputs:
      history:
        - {table: advance_ledger, aggregate: count, field: advance_entry_id, within_months: 12, filters: {event_type: advance_disbursement}}
        - {table: advance_ledger, aggregate: sum, field: amount, within_months: 12, filters: {event_type: advance_fee, fee_type: late_fee}}
        - {table: advance_ledger, aggregate: sum, field: amount, within_months: 12, filters: {event_type: advance_fee_waiver, waiver_reason: courtesy}}
        - {table: advance_ledger, aggregate: sum, field: amount, filters: {event_type: advance_disbursement}}
        - {table: advance_ledger, aggregate: sum, field: amount, filters: {event_type: advance_fee}}
        - {table: advance_ledger, aggregate: sum, field: amount, filters: {event_type: advance_repayment}}
        - {table: advance_ledger, aggregate: sum, field: amount, filters: {event_type: advance_fee_waiver}}
        - {category: wallet, table: wallet_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: wallet_direct_deposit}}
        - {category: wallet, table: wallet_transactions, aggregate: count, field: txn_id, within_months: 1, filters: {event_type: wallet_direct_deposit}}
        - {category: card, table: card_transactions, aggregate: count, field: card_txn_id, within_months: 3, filters: {event_type: card_purchase}}
      cross_category: [wallet, card]

  - id: advance_ext_late_fee_assessment
    base_policy_refs: [advance_fees, advance_late_fees, advance_extensions]
    overwrite:
      - base_policy: advance_late_fees
        superseded_clause: >-
          For each full late_fee_interval_days period after the grace period ends, a late_fee is booked on the advance at its unpaid principal times late_fee_pct_weekly, rounded to the cent (half up) and raised to late_fee_min, numbered by fee_period; late fees stop once their total on the advance would exceed late_fee_cap_pct_of_principal of its principal, the last one being cut to the cap.
        replaced_by: >-
          The late fee of that period is the unpaid principal times late_fee_pct_weekly, rounded to the cent (half up), raised to late_fee_min and never more than late_fee_cap_pct_of_principal of the advance's principal less the late fees already booked on the line.
    trigger: state_due
    subject: [advance_fee]
    computes: amount
    target_tool: assess_late_fee_a649c20a
    params:
      steady_rate_first: 0.50
      steady_rate_repeat: 0.75
      collection_high_share: 0.50
      collection_low_share: 0.30
      collection_high_factor: 0.8
      collection_low_factor: 0.9
      plan_factor_summit: 0.8
      plan_factor_member: 0.9
      established_line_days: 365
      first_period_established: 0.75
      first_period_new: 0.9
    rule: >
      When a full late-fee period has closed on the line's most recent advance after its grace period while that advance still has unpaid principal, the late fee of that period is booked on that advance numbered by the period it belongs to; once no unpaid principal remains, a closing period carries no late fee.
      The periods are counted in whole late_fee_interval_days-day blocks from the day the grace period ends, which is grace_period_days calendar days after the advance's due date, and the period booked is the most recent block that has closed by the handling date.
      The unpaid principal is the principal disbursed on the line less the part of its repayments and waivers left after all of its booked fees are covered, never below zero.
      The late fee of that period is the unpaid principal times late_fee_pct_weekly, rounded to the cent (half up), raised to late_fee_min and never more than late_fee_cap_pct_of_principal of the advance's principal less the late fees already booked on the line.
      A window of a number of months before the handling date covers the records dated after the same day of the month that many months before the handling date, up to and including the handling date.
      When the linked personal account received direct deposits totalling at least three times dd_min_monthly in the three months before the handling date and the line has never carried a late fee, the weekly rate is steady_rate_first percent in place of late_fee_pct_weekly; when those deposits reach three times dd_min_monthly and the line has carried a late fee before, the weekly rate is steady_rate_repeat percent; when those deposits fall short of three times dd_min_monthly, the weekly rate is late_fee_pct_weekly.
      The share of the advance's principal already repaid is its principal less the unpaid principal, divided by its principal; when that share is at least collection_high_share, the fee is multiplied by collection_high_factor; when it is at least collection_low_share but below collection_high_share, the fee is multiplied by collection_low_factor; when it is below collection_low_share, no collection factor applies.
      When the linked personal account is on Pocketwire Summit, the fee is multiplied by plan_factor_summit; when it is on Pocketwire Onyx or Pocketwire Prime, the fee is multiplied by plan_factor_member; on any other plan no plan factor applies.
      When the period booked is the first late-fee period of the advance and the line was opened at least established_line_days days before the handling date, the fee is multiplied by first_period_established and rounded down to the cent; when it is the first period and the line was opened fewer than established_line_days days before the handling date, the fee is multiplied by first_period_new and rounded down to the cent; for any later period the fee is rounded to the cent (half up) as it stands.
      The unpaid principal is multiplied by the weekly rate, the collection factor and the plan factor together, the first-period treatment then rounds that product, and only then are the minimum and the cap applied.
    prerequisite: []
    cross_category:
      - category: wallet
        as: history
        reads: [wallet_transactions.amount, wallet_transactions.event_type, wallet_transactions.txn_date, variant_name]
        note: The weekly rate reads the three-month direct deposit total of the linked personal account and the plan factor reads its plan.
    compute:
      - principal_disbursed: "SUM('advance_ledger','amount', event_type='advance_disbursement')"
      - fees_booked: "SUM('advance_ledger','amount', event_type='advance_fee')"
      - repaid_total: "SUM('advance_ledger','amount', event_type='advance_repayment')"
      - waived_total: "SUM('advance_ledger','amount', event_type='advance_fee_waiver')"
      - unpaid_principal: "MX(0, principal_disbursed - MX(0, repaid_total + waived_total - fees_booked))"
      - advance_principal: "LATEST('advance_ledger','amount', date_field='entry_date', event_type='advance_disbursement')"
      - advance_due_date: "LATEST('advance_ledger','due_date', date_field='entry_date', event_type='advance_disbursement')"
      - period_number: "int((DAYS(advance_due_date, NOW) - P('grace_period_days')) / P('late_fee_interval_days'))"
      - dd_total_3m: "XSUM('wallet','wallet_transactions','amount', within_months=3, date_field='txn_date', event_type='wallet_direct_deposit')"
      - earlier_late_fees: "COUNT('advance_ledger', event_type='advance_fee', fee_type='late_fee')"
      - weekly_rate: "K('steady_rate_first') if (dd_total_3m >= 3 * P('dd_min_monthly') and earlier_late_fees == 0) else (K('steady_rate_repeat') if (dd_total_3m >= 3 * P('dd_min_monthly') and earlier_late_fees > 0) else P('late_fee_pct_weekly'))"
      - repaid_share: "(advance_principal - unpaid_principal) / advance_principal"
      - collection_factor: "K('collection_high_factor') if repaid_share >= K('collection_high_share') else (K('collection_low_factor') if repaid_share >= K('collection_low_share') else 1)"
      - wallet_plan: "CFIELD('wallet','variant_name')"
      - plan_factor: "K('plan_factor_summit') if wallet_plan == 'Pocketwire Summit' else (K('plan_factor_member') if (wallet_plan == 'Pocketwire Onyx' or wallet_plan == 'Pocketwire Prime') else 1)"
      - rated_fee: "unpaid_principal * weekly_rate / 100 * collection_factor * plan_factor"
      - line_age_days: "DAYS(F('opened_date'), NOW)"
      - treated_fee: "int(RND(rated_fee * K('first_period_established') * 100, 6)) / 100 if (period_number == 1 and line_age_days >= K('established_line_days')) else (int(RND(rated_fee * K('first_period_new') * 100, 6)) / 100 if (period_number == 1 and line_age_days < K('established_line_days')) else RND(rated_fee, 2))"
      - late_fees_booked: "SUM('advance_ledger','amount', event_type='advance_fee', fee_type='late_fee')"
      - cap_room: "RND(P('late_fee_cap_pct_of_principal') * advance_principal / 100 - late_fees_booked, 2)"
      - result: "MN(MX(treated_fee, P('late_fee_min')), cap_room) if unpaid_principal > 0 else 0"
    compute_basis:
      principal_disbursed: "The unpaid principal is the principal disbursed on the line less the part of its repayments and waivers left after all of its booked fees are covered, never below zero."
      fees_booked: "The unpaid principal is the principal disbursed on the line less the part of its repayments and waivers left after all of its booked fees are covered, never below zero."
      repaid_total: "The unpaid principal is the principal disbursed on the line less the part of its repayments and waivers left after all of its booked fees are covered, never below zero."
      waived_total: "The unpaid principal is the principal disbursed on the line less the part of its repayments and waivers left after all of its booked fees are covered, never below zero."
      unpaid_principal: "The unpaid principal is the principal disbursed on the line less the part of its repayments and waivers left after all of its booked fees are covered, never below zero."
      advance_principal: "When a full late-fee period has closed on the line's most recent advance after its grace period while that advance still has unpaid principal, the late fee of that period is booked on that advance numbered by the period it belongs to; once no unpaid principal remains, a closing period carries no late fee."
      advance_due_date: "The periods are counted in whole late_fee_interval_days-day blocks from the day the grace period ends, which is grace_period_days calendar days after the advance's due date, and the period booked is the most recent block that has closed by the handling date."
      period_number: "The periods are counted in whole late_fee_interval_days-day blocks from the day the grace period ends, which is grace_period_days calendar days after the advance's due date, and the period booked is the most recent block that has closed by the handling date."
      dd_total_3m: "When the linked personal account received direct deposits totalling at least three times dd_min_monthly in the three months before the handling date and the line has never carried a late fee"
      earlier_late_fees: "and the line has never carried a late fee"
      weekly_rate: "When the linked personal account received direct deposits totalling at least three times dd_min_monthly in the three months before the handling date and the line has never carried a late fee, the weekly rate is steady_rate_first percent in place of late_fee_pct_weekly; when those deposits reach three times dd_min_monthly and the line has carried a late fee before, the weekly rate is steady_rate_repeat percent; when those deposits fall short of three times dd_min_monthly, the weekly rate is late_fee_pct_weekly."
      repaid_share: "The share of the advance's principal already repaid is its principal less the unpaid principal, divided by its principal"
      collection_factor: "when that share is at least collection_high_share, the fee is multiplied by collection_high_factor; when it is at least collection_low_share but below collection_high_share, the fee is multiplied by collection_low_factor; when it is below collection_low_share, no collection factor applies."
      wallet_plan: "When the linked personal account is on Pocketwire Summit"
      plan_factor: "When the linked personal account is on Pocketwire Summit, the fee is multiplied by plan_factor_summit; when it is on Pocketwire Onyx or Pocketwire Prime, the fee is multiplied by plan_factor_member; on any other plan no plan factor applies."
      rated_fee: "The unpaid principal is multiplied by the weekly rate, the collection factor and the plan factor together, the first-period treatment then rounds that product, and only then are the minimum and the cap applied."
      line_age_days: "the line was opened at least established_line_days days before the handling date"
      treated_fee: "When the period booked is the first late-fee period of the advance and the line was opened at least established_line_days days before the handling date, the fee is multiplied by first_period_established and rounded down to the cent; when it is the first period and the line was opened fewer than established_line_days days before the handling date, the fee is multiplied by first_period_new and rounded down to the cent; for any later period the fee is rounded to the cent (half up) as it stands."
      late_fees_booked: "never more than late_fee_cap_pct_of_principal of the advance's principal less the late fees already booked on the line."
      cap_room: "never more than late_fee_cap_pct_of_principal of the advance's principal less the late fees already booked on the line."
      result: "The late fee of that period is the unpaid principal times late_fee_pct_weekly, rounded to the cent (half up), raised to late_fee_min and never more than late_fee_cap_pct_of_principal of the advance's principal less the late fees already booked on the line."
    factors:
      - id: steady_payroll_rate
        effect: parameter
        decides: weekly_rate
        bindings: [dd_total_3m, earlier_late_fees, weekly_rate]
        ladder:
          - when: "direct deposits into the linked personal account in the three months before the handling date total at least three times dd_min_monthly AND the line has never carried a late fee"
            value: "K('steady_rate_first')"
          - when: "those deposits total at least three times dd_min_monthly AND the line has carried a late fee before"
            value: "K('steady_rate_repeat')"
          - when: "otherwise (those deposits fall short of three times dd_min_monthly)"
            value: "P('late_fee_pct_weekly')"
        baseline:
          weekly_rate: "P('late_fee_pct_weekly')"
        evidence: [cross_category, history]
        cross_difficulty: wallet
      - id: collection_credit
        effect: parameter
        decides: collection_factor
        bindings: [advance_principal, repaid_share, collection_factor]
        ladder:
          - when: "the share of the advance's principal already repaid is at least collection_high_share"
            value: "K('collection_high_factor')"
          - when: "that share is at least collection_low_share but below collection_high_share"
            value: "K('collection_low_factor')"
          - when: "otherwise (below collection_low_share)"
            value: "1"
        baseline:
          collection_factor: "1"
        evidence: [history]
        cross_difficulty: null
      - id: plan_factor
        effect: parameter
        decides: plan_factor
        bindings: [wallet_plan, plan_factor]
        ladder:
          - when: "the linked personal account is on Pocketwire Summit"
            value: "K('plan_factor_summit')"
          - when: "the linked personal account is on Pocketwire Onyx or Pocketwire Prime"
            value: "K('plan_factor_member')"
          - when: "otherwise (Pocketwire Lite, Core or Plus)"
            value: "1"
        baseline:
          plan_factor: "1"
        evidence: [cross_category]
        cross_difficulty: wallet
      - id: first_period_treatment
        effect: method
        decides: treated_fee
        bindings: [line_age_days, treated_fee]
        ladder:
          - when: "the period booked is the advance's first late-fee period AND the line was opened at least established_line_days days before the handling date"
            method: "the fee is multiplied by first_period_established and rounded down to the cent"
          - when: "the period booked is the first late-fee period AND the line was opened fewer than established_line_days days before the handling date"
            method: "the fee is multiplied by first_period_new and rounded down to the cent"
          - when: "otherwise (a later period)"
            method: "the fee is rounded to the cent (half up) as it stands"
        baseline:
          treated_fee: "RND(rated_fee, 2)"
        evidence: [date, history]
        cross_difficulty: null
    baseline:
      rule: >-
        When a full late-fee period has closed on the line's most recent advance after its grace period while that advance still has unpaid principal, the late fee of that period is booked on that advance numbered by the period it belongs to; once no unpaid principal remains, a closing period carries no late fee. The periods are counted in whole late_fee_interval_days-day blocks from the day the grace period ends, which is grace_period_days calendar days after the advance's due date, and the period booked is the most recent block that has closed by the handling date. The unpaid principal is the principal disbursed on the line less the part of its repayments and waivers left after all of its booked fees are covered, never below zero. The late fee of that period is the unpaid principal times late_fee_pct_weekly, rounded to the cent (half up), raised to late_fee_min and never more than late_fee_cap_pct_of_principal of the advance's principal less the late fees already booked on the line.
      params: [late_fee_pct_weekly, late_fee_min, late_fee_cap_pct_of_principal, grace_period_days, late_fee_interval_days]
    inputs:
      history:
        - {table: advance_ledger, aggregate: sum, field: amount, filters: {event_type: advance_disbursement}}
        - {table: advance_ledger, aggregate: sum, field: amount, filters: {event_type: advance_fee}}
        - {table: advance_ledger, aggregate: sum, field: amount, filters: {event_type: advance_repayment}}
        - {table: advance_ledger, aggregate: sum, field: amount, filters: {event_type: advance_fee_waiver}}
        - {table: advance_ledger, aggregate: latest, field: amount, filters: {event_type: advance_disbursement}}
        - {table: advance_ledger, aggregate: latest, field: due_date, filters: {event_type: advance_disbursement}}
        - {table: advance_ledger, aggregate: count, field: advance_entry_id, filters: {event_type: advance_fee, fee_type: late_fee}}
        - {table: advance_ledger, aggregate: sum, field: amount, filters: {event_type: advance_fee, fee_type: late_fee}}
        - {category: wallet, table: wallet_transactions, aggregate: sum, field: amount, within_months: 3, filters: {event_type: wallet_direct_deposit}}
      cross_category: [wallet]

  - id: advance_ext_card_repayment_share
    base_policy_refs: [advance_repayment_rules]
    overwrite:
      - base_policy: advance_repayment_rules
        superseded_clause: >-
          The customer can repay manually at any time from the personal balance, or from an external debit card where external_card_repayment_supported is true, at least min_manual_repayment or the whole amount outstanding on that advance, and never more than that amount.
        replaced_by: >-
          On a line that is past due, a manual repayment from an external debit card, where external_card_repayment_supported is true, takes at most the card repayment share of what the line owes on one day; a customer who asks to pay as much as possible by card repays exactly that amount.
    trigger: on_request
    subject: [advance_repayment]
    computes: amount
    target_tool: repay_advance_by_card_db2e846d
    params:
      standard_share: 30
      track_long_days: 730
      track_mid_days: 365
      track_high_advances: 6
      track_low_advances: 3
      track_share_high: 20
      track_share_low: 10
      payroll_share_high: 15
      payroll_share_low: 5
      card_history_high: 2
      card_share_high: 10
      card_share_low: 5
      plan_share_member: 10
      plan_share_plus: 5
      early_days: 14
      middle_days: 30
      early_points_per_day: 2
      middle_multiplier: 1.1
    rule: >
      On a line that is past due, a manual repayment from an external debit card, where external_card_repayment_supported is true, takes at most the card repayment share of what the line owes on one day; a customer who asks to pay as much as possible by card repays exactly that amount.
      Any other manual repayment, from the personal balance or on a line that is not past due, is at least min_manual_repayment or the whole amount outstanding on that advance, and never more than that amount.
      The card repayment share is not applied until the line carries a late fee entry for every late-fee period that has closed on its past-due advance.
      What the line owes is the principal disbursed and the fees booked on it less its repayments and waivers.
      The card repayment share starts from standard_share percent.
      The card repayment is what the line owes times the card repayment share, rounded to the cent (half up), at least min_manual_repayment and never more than what the line owes.
      A window of a number of months before the handling date covers the records dated after the same day of the month that many months before the handling date, up to and including the handling date.
      When the line was opened at least track_long_days days before the handling date and at least track_high_advances advances have been disbursed on it, track_share_high points are added to the share; when it was opened at least track_mid_days days before the handling date and at least track_low_advances advances have been disbursed on it without meeting both parts of the higher test, track_share_low points are added; otherwise the line's track record adds nothing to the share.
      When the linked personal account received direct deposits totalling at least dd_min_monthly from at least two deposits in the month before the handling date, payroll_share_high points are added to the share; when those deposits total at least half of dd_min_monthly without meeting both parts of the higher test, payroll_share_low points are added; otherwise the payroll adds nothing to the share.
      When at least card_history_high earlier repayments on the line were made by external debit card, card_share_high points are added to the share; when exactly one was, card_share_low points are added; when none was, the card history adds nothing to the share.
      When the linked personal account is on Pocketwire Prime, Pocketwire Onyx or Pocketwire Summit, plan_share_member points are added to the share; when it is on Pocketwire Plus, plan_share_plus points are added; on any other plan nothing is added to the share.
      The days past due are counted in calendar days from the date the line became past due to the handling date; when they are at most early_days, early_points_per_day points are added to the share for each day by which they fall short of early_days; when they are more than early_days but at most middle_days, the share is multiplied by middle_multiplier; when they are more than middle_days, the share is used as it stands.
      The points are added to standard_share first, the days-past-due treatment then acts on that share, the share then acts once on what the line owes, and only the result is rounded.
    prerequisite:
      - problem: advance_ext_late_fee_assessment
        kind: value_input
        gate: amount_owed
        form: state
        policy_source: >-
          The card repayment share is not applied until the line carries a late fee entry for every late-fee period that has closed on its past-due advance.
        condition: >-
          For every full late-fee period that has closed after the grace period of the line's past-due advance, an advance_fee row with fee_type late_fee and that period's fee_period stands on the line's ledger.
        resolved_by: assess_late_fee_a649c20a
        effect: >-
          Booking the late fee of the closed period raises what the line owes by that fee, so the amount_owed binding and the repayment the share gives rise with it.
    cross_category:
      - category: wallet
        as: history
        reads: [wallet_transactions.amount, wallet_transactions.event_type, wallet_transactions.txn_date, variant_name]
        note: The payroll points sum and count the last month's direct deposits on the linked personal account and the plan points read its plan.
    compute:
      - principal_disbursed: "SUM('advance_ledger','amount', event_type='advance_disbursement')"
      - fees_booked: "SUM('advance_ledger','amount', event_type='advance_fee')"
      - repaid_total: "SUM('advance_ledger','amount', event_type='advance_repayment')"
      - waived_total: "SUM('advance_ledger','amount', event_type='advance_fee_waiver')"
      - amount_owed: "RND(principal_disbursed + fees_booked - repaid_total - waived_total, 2)"
      - line_age_days: "DAYS(F('opened_date'), NOW)"
      - advances_total: "COUNT('advance_ledger', event_type='advance_disbursement')"
      - track_share: "K('track_share_high') if (line_age_days >= K('track_long_days') and advances_total >= K('track_high_advances')) else (K('track_share_low') if (line_age_days >= K('track_mid_days') and advances_total >= K('track_low_advances')) else 0)"
      - dd_total_1m: "XSUM('wallet','wallet_transactions','amount', within_months=1, date_field='txn_date', event_type='wallet_direct_deposit')"
      - dd_count_1m: "XCOUNT('wallet','wallet_transactions', within_months=1, date_field='txn_date', event_type='wallet_direct_deposit')"
      - payroll_share: "K('payroll_share_high') if (dd_total_1m >= P('dd_min_monthly') and dd_count_1m >= 2) else (K('payroll_share_low') if dd_total_1m >= P('dd_min_monthly') / 2 else 0)"
      - card_repayments: "COUNT('advance_ledger', event_type='advance_repayment', repayment_method='manual_debit_card')"
      - card_history_share: "K('card_share_high') if card_repayments >= K('card_history_high') else (K('card_share_low') if card_repayments == 1 else 0)"
      - wallet_plan: "CFIELD('wallet','variant_name')"
      - plan_share: "K('plan_share_member') if (wallet_plan == 'Pocketwire Prime' or wallet_plan == 'Pocketwire Onyx' or wallet_plan == 'Pocketwire Summit') else (K('plan_share_plus') if wallet_plan == 'Pocketwire Plus' else 0)"
      - share_points: "K('standard_share') + track_share + payroll_share + card_history_share + plan_share"
      - days_past_due: "DAYS(F('past_due_since'), NOW)"
      - timed_share: "share_points + (K('early_days') - days_past_due) * K('early_points_per_day') if days_past_due <= K('early_days') else (share_points * K('middle_multiplier') if days_past_due <= K('middle_days') else share_points)"
      - result: "MN(amount_owed, MX(P('min_manual_repayment'), RND(amount_owed * timed_share / 100, 2)))"
    compute_basis:
      principal_disbursed: "What the line owes is the principal disbursed and the fees booked on it less its repayments and waivers."
      fees_booked: "What the line owes is the principal disbursed and the fees booked on it less its repayments and waivers."
      repaid_total: "What the line owes is the principal disbursed and the fees booked on it less its repayments and waivers."
      waived_total: "What the line owes is the principal disbursed and the fees booked on it less its repayments and waivers."
      amount_owed: "What the line owes is the principal disbursed and the fees booked on it less its repayments and waivers."
      line_age_days: "When the line was opened at least track_long_days days before the handling date"
      advances_total: "and at least track_high_advances advances have been disbursed on it"
      track_share: "When the line was opened at least track_long_days days before the handling date and at least track_high_advances advances have been disbursed on it, track_share_high points are added to the share; when it was opened at least track_mid_days days before the handling date and at least track_low_advances advances have been disbursed on it without meeting both parts of the higher test, track_share_low points are added; otherwise the line's track record adds nothing to the share."
      dd_total_1m: "When the linked personal account received direct deposits totalling at least dd_min_monthly from at least two deposits in the month before the handling date"
      dd_count_1m: "When the linked personal account received direct deposits totalling at least dd_min_monthly from at least two deposits in the month before the handling date"
      payroll_share: "When the linked personal account received direct deposits totalling at least dd_min_monthly from at least two deposits in the month before the handling date, payroll_share_high points are added to the share; when those deposits total at least half of dd_min_monthly without meeting both parts of the higher test, payroll_share_low points are added; otherwise the payroll adds nothing to the share."
      card_repayments: "When at least card_history_high earlier repayments on the line were made by external debit card"
      card_history_share: "When at least card_history_high earlier repayments on the line were made by external debit card, card_share_high points are added to the share; when exactly one was, card_share_low points are added; when none was, the card history adds nothing to the share."
      wallet_plan: "When the linked personal account is on Pocketwire Prime, Pocketwire Onyx or Pocketwire Summit"
      plan_share: "When the linked personal account is on Pocketwire Prime, Pocketwire Onyx or Pocketwire Summit, plan_share_member points are added to the share; when it is on Pocketwire Plus, plan_share_plus points are added; on any other plan nothing is added to the share."
      share_points: "The card repayment share starts from standard_share percent."
      days_past_due: "The days past due are counted in calendar days from the date the line became past due to the handling date"
      timed_share: "The days past due are counted in calendar days from the date the line became past due to the handling date; when they are at most early_days, early_points_per_day points are added to the share for each day by which they fall short of early_days; when they are more than early_days but at most middle_days, the share is multiplied by middle_multiplier; when they are more than middle_days, the share is used as it stands."
      result: "The card repayment is what the line owes times the card repayment share, rounded to the cent (half up), at least min_manual_repayment and never more than what the line owes."
    factors:
      - id: track_record
        effect: parameter
        decides: track_share
        bindings: [line_age_days, advances_total, track_share]
        ladder:
          - when: "the line was opened at least track_long_days days before the handling date AND at least track_high_advances advances have been disbursed on it"
            value: "K('track_share_high')"
          - when: "the line was opened at least track_mid_days days before the handling date AND at least track_low_advances advances have been disbursed on it, without both parts of the higher test"
            value: "K('track_share_low')"
          - when: "otherwise"
            value: "0"
        baseline:
          track_share: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: payroll_points
        effect: parameter
        decides: payroll_share
        bindings: [dd_total_1m, dd_count_1m, payroll_share]
        ladder:
          - when: "direct deposits into the linked personal account in the month before the handling date total at least dd_min_monthly AND come from at least two deposits"
            value: "K('payroll_share_high')"
          - when: "those deposits total at least half of dd_min_monthly, without both parts of the higher test"
            value: "K('payroll_share_low')"
          - when: "otherwise (less than half of dd_min_monthly)"
            value: "0"
        baseline:
          payroll_share: "0"
        evidence: [cross_category, history]
        cross_difficulty: wallet
      - id: card_history
        effect: parameter
        decides: card_history_share
        bindings: [card_repayments, card_history_share]
        ladder:
          - when: "at least card_history_high earlier repayments on the line were made by external debit card"
            value: "K('card_share_high')"
          - when: "exactly one earlier repayment on the line was made by external debit card"
            value: "K('card_share_low')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          card_history_share: "0"
        evidence: [history]
        cross_difficulty: null
      - id: plan_points
        effect: parameter
        decides: plan_share
        bindings: [wallet_plan, plan_share]
        ladder:
          - when: "the linked personal account is on Pocketwire Prime, Pocketwire Onyx or Pocketwire Summit"
            value: "K('plan_share_member')"
          - when: "the linked personal account is on Pocketwire Plus"
            value: "K('plan_share_plus')"
          - when: "otherwise (Pocketwire Lite or Core)"
            value: "0"
        baseline:
          plan_share: "0"
        evidence: [cross_category]
        cross_difficulty: wallet
      - id: arrears_timing
        effect: method
        decides: timed_share
        bindings: [days_past_due, timed_share]
        ladder:
          - when: "the line became past due at most early_days calendar days before the handling date"
            method: "early_points_per_day points are added to the share for each day by which the days past due fall short of early_days, before it acts on what the line owes"
          - when: "the line became past due more than early_days but at most middle_days calendar days before"
            method: "the share is multiplied by middle_multiplier before it acts on what the line owes"
          - when: "otherwise (more than middle_days calendar days past due)"
            method: "the share acts on what the line owes as it stands"
        baseline:
          timed_share: "share_points"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        What the line owes is the principal disbursed and the fees booked on it less its repayments and waivers. The card repayment share starts from standard_share percent. The card repayment is what the line owes times the card repayment share, rounded to the cent (half up), at least min_manual_repayment and never more than what the line owes.
      params: [standard_share, min_manual_repayment]
    inputs:
      history:
        - {table: advance_ledger, aggregate: sum, field: amount, filters: {event_type: advance_disbursement}}
        - {table: advance_ledger, aggregate: sum, field: amount, filters: {event_type: advance_fee}}
        - {table: advance_ledger, aggregate: sum, field: amount, filters: {event_type: advance_repayment}}
        - {table: advance_ledger, aggregate: sum, field: amount, filters: {event_type: advance_fee_waiver}}
        - {table: advance_ledger, aggregate: count, field: advance_entry_id, filters: {event_type: advance_disbursement}}
        - {table: advance_ledger, aggregate: count, field: advance_entry_id, filters: {event_type: advance_repayment, repayment_method: manual_debit_card}}
        - {category: wallet, table: wallet_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: wallet_direct_deposit}}
        - {category: wallet, table: wallet_transactions, aggregate: count, field: txn_id, within_months: 1, filters: {event_type: wallet_direct_deposit}}
      cross_category: [wallet]
