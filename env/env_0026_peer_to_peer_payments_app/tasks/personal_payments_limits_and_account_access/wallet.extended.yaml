events:
  - type: wallet_open
    target: wallet_accounts
    mutation: create
    meaning: A customer signs up for a Pocketwire Personal Account on a plan.
    grain: One row per personal account.
    fields:
      customer_id: The customer who signs up.
      variant_name: The plan the account opens on, written as the official plan name.
      kyc_status: Identity verification status at sign-up.
      opened_date: Sign-up date, Eastern Time.
      billing_cycle: How the plan fee is billed (not_applicable on free plans).
      plan_renewal_date: Next plan fee date; empty on free plans.
      ledger_balance: Opening ledger balance, always 0.00.
    triggers: []
  - type: wallet_activate
    target: wallet_accounts
    mutation: {transition: {from: applied, to: active}}
    meaning: The Customer Identification Program check passes and the account opens for payments.
    grain: One row per personal account.
    fields:
      status: Becomes active.
    triggers: []
  - type: wallet_decline
    target: wallet_accounts
    mutation: {transition: {from: applied, to: closed}}
    meaning: The Customer Identification Program check declines the sign-up.
    grain: One row per personal account.
    fields:
      status: Becomes closed.
      closed_date: Decline date.
    triggers: []
  - type: wallet_plan_change
    target: wallet_accounts
    mutation: update
    meaning: The customer changes plan — an upgrade takes effect immediately, a downgrade is scheduled or applied according to the current plan's downgrade timing.
    grain: One row per personal account.
    fields:
      variant_name: The plan now in effect.
      pending_variant_name: The lower plan scheduled to take effect on the next plan renewal date; empty when none is scheduled.
      billing_cycle: Billing cycle in effect after the change.
      plan_started_date: Date the current paid plan subscription started (trial counting starts here).
      plan_renewal_date: Next plan fee date after the change.
      kyc_status: Identity verification status (read, not changed, by a plan change).
    triggers: []
  - type: wallet_limit_decision
    target: wallet_accounts
    mutation: update
    meaning: A weekly send limit increase request is decided and the decision recorded on the account.
    grain: One row per personal account.
    fields:
      approved_weekly_send_limit: The approved weekly send limit that overrides the plan's weekly_send_limit; unchanged on a decline.
      limit_decision_date: Date of this decision (approval or decline).
    triggers: []
  - type: wallet_restrict
    target: wallet_accounts
    mutation: {transition: {from: active, to: limited}}
    meaning: The risk team places a limitation on the account.
    grain: One row per personal account.
    fields:
      status: Becomes limited.
      restriction_reason: Why the limitation was placed.
      restricted_at: Moment the limitation was placed.
    triggers: []
  - type: wallet_lift_restriction
    target: wallet_accounts
    mutation: {transition: {from: limited, to: active}}
    meaning: The limitation is lifted after the documents review was approved.
    grain: One row per personal account.
    fields:
      status: Becomes active.
      restriction_lifted_date: Date the limitation was lifted.
    triggers: []
  - type: wallet_risk_close
    target: wallet_accounts
    mutation: {transition: {from: limited, to: closed}}
    meaning: A limited account is closed for risk.
    grain: One row per personal account.
    fields:
      status: Becomes closed.
      closed_date: Date of the risk closure; the fund hold period is counted from it.
    triggers: []
  - type: wallet_lock
    target: wallet_accounts
    mutation: {transition: [{from: active, to: locked}, {from: limited, to: locked}]}
    meaning: A security lock is placed on suspected account takeover.
    grain: One row per personal account.
    fields:
      status: Becomes locked.
      restriction_reason: Always suspected_account_takeover.
      restricted_at: Moment the security lock was placed; the recovery cooling-off period is counted from it.
    triggers: []
  - type: wallet_recover
    target: wallet_accounts
    mutation: {transition: {from: locked, to: active}}
    meaning: Account recovery completes and the security lock is removed.
    grain: One row per personal account.
    fields:
      status: Becomes active.
      recovered_date: Date recovery completed; the post-recovery period is counted from it.
    triggers: []
  - type: wallet_request_closure
    target: wallet_accounts
    mutation: {transition: {from: active, to: closure_pending}}
    meaning: The customer confirms in the app that they want the personal account closed.
    grain: One row per personal account.
    fields:
      status: Becomes closure_pending.
    triggers: []
  - type: wallet_withdraw_closure
    target: wallet_accounts
    mutation: {transition: {from: closure_pending, to: active}}
    meaning: The customer withdraws a pending closure.
    grain: One row per personal account.
    fields:
      status: Returns to active.
    triggers: []
  - type: wallet_close
    target: wallet_accounts
    mutation: {transition: {from: closure_pending, to: closed}}
    meaning: A pending closure completes.
    grain: One row per personal account.
    fields:
      status: Becomes closed.
      closed_date: Closure date.
    triggers: []
  - type: wallet_payment_sent
    target: wallet_transactions
    meaning: The customer sends a P2P payment to another person.
    grain: One row per P2P payment sent.
    distinguish_by: [txn_reference]
    fields:
      txn_reference: The payment reference shown in the app.
      txn_date: Date the payment was sent, Eastern Time.
      amount: Payment amount.
      counterparty: The recipient's username, or the phone number or email the payment was sent to.
      payment_type: personal or goods_and_services.
      funding_source: Where the money came from.
      recipient_status: Whether the recipient already had an account or received an invitation to claim the payment.
    account: balance
    direction: out
    triggers:
      - event: wallet:wallet_topup
        when: {funding_source: [linked_bank, linked_debit_card, linked_credit_card]}
        map: {amount: amount, funding_source: funding_source, txn_date: txn_date, source_txn_id: txn_id, transfer_speed: instant}
      - event: wallet:wallet_fee
        when: {funding_source: linked_credit_card}
        map: {fee_type: credit_card_funding_fee, source_txn_id: txn_id, txn_date: txn_date}
  - type: wallet_payment_received
    target: wallet_transactions
    meaning: A P2P payment from another person is credited to the customer's balance.
    grain: One row per P2P payment received.
    distinguish_by: [txn_reference]
    fields:
      txn_reference: The payment reference shown in the app.
      txn_date: Date the payment was credited.
      amount: Payment amount.
      counterparty: The sender's username.
      payment_type: personal or goods_and_services.
    account: balance
    direction: in
    triggers:
      - event: wallet:wallet_fee
        when: {payment_type: goods_and_services}
        map: {fee_type: goods_services_seller_fee, source_txn_id: txn_id, txn_date: txn_date}
  - type: wallet_payment_claimed
    target: wallet_transactions
    meaning: The recipient of an invitation payment creates an account and claims the payment.
    grain: One row per invitation payment claimed.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The invitation payment that was claimed.
      txn_date: Date the recipient claimed it.
      counterparty: The username the recipient claimed it under.
    triggers: []
  - type: wallet_payment_refund
    target: wallet_transactions
    meaning: An invitation payment that was not claimed in time, or was cancelled by the sender before it was claimed, is returned to the sender's balance.
    grain: One row per refunded invitation payment.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The invitation payment being refunded.
      txn_date: Refund date.
      amount: Refunded amount, equal to the original payment amount.
    account: balance
    direction: in
    triggers: []
  - type: wallet_topup
    target: wallet_transactions
    meaning: Money is added to the balance from a linked bank account or debit card, either on request or automatically to fund a payment.
    grain: One row per top-up.
    distinguish_by: [txn_reference, source_txn_id]
    fields:
      txn_reference: The top-up reference shown in the app (empty on automatic funding pulls).
      source_txn_id: The payment this top-up funded; empty on a customer-requested top-up.
      txn_date: Date the top-up was initiated.
      amount: Amount added.
      funding_source: linked_bank, linked_debit_card or linked_credit_card.
      transfer_speed: standard (bank, free) or instant (debit card).
    account: balance
    direction: in
    triggers:
      - event: wallet:wallet_fee
        when: {transfer_speed: instant, funding_source: linked_debit_card, source_txn_id: ""}
        map: {fee_type: instant_topup_fee, source_txn_id: txn_id, txn_date: txn_date}
  - type: wallet_direct_deposit
    target: wallet_transactions
    meaning: A payroll or benefits direct deposit posts to the balance.
    grain: One row per direct deposit.
    distinguish_by: [txn_reference]
    fields:
      txn_reference: The ACH trace reference of the deposit.
      txn_date: Date the deposit was made available.
      amount: Deposit amount.
      counterparty: The payer name as sent by the employer or agency.
    account: balance
    direction: in
    triggers: []
  - type: wallet_cash_out
    target: wallet_transactions
    meaning: The customer transfers balance out to a linked bank account (standard) or linked debit card (instant); also used for the release of a risk-closed account's held balance.
    grain: One row per cash-out.
    distinguish_by: [txn_reference]
    fields:
      txn_reference: The transfer reference shown in the app.
      txn_date: Date the transfer was initiated, Eastern Time.
      amount: Amount transferred out.
      transfer_speed: standard or instant.
      destination_last4: Last four digits of the destination bank account or card.
    account: balance
    direction: out
    triggers:
      - event: wallet:wallet_fee
        when: {transfer_speed: instant}
        map: {fee_type: instant_transfer_fee, source_txn_id: txn_id, txn_date: txn_date}
  - type: wallet_cash_out_return
    target: wallet_transactions
    meaning: The receiving bank or card network returns a cash-out and the amount is credited back.
    grain: One row per returned cash-out.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The cash-out being returned.
      txn_date: Date the return posted.
      amount: Returned amount, equal to the original cash-out amount.
      transfer_speed: Speed of the original cash-out.
    account: balance
    direction: in
    triggers:
      - event: wallet:wallet_fee_refund
        when: {transfer_speed: instant}
        map: {fee_type: instant_transfer_fee, txn_date: txn_date}
  - type: wallet_fee
    target: wallet_transactions
    meaning: A fee is charged to the balance — instant transfer, credit card funding, instant top-up, goods-and-services seller fee or plan fee.
    grain: One row per fee charged.
    distinguish_by: [fee_type, source_txn_id, billing_period]
    fields:
      fee_type: Which fee.
      source_txn_id: The transaction the fee belongs to; empty for plan fees.
      billing_period: The billing period a plan fee covers; empty for other fees.
      txn_date: Date the fee was charged.
      amount: Fee amount (0.00 when an instant transfer falls inside the free monthly quota).
    account: balance
    direction: out
    triggers: []
  - type: wallet_fee_refund
    target: wallet_transactions
    meaning: A fee previously charged is refunded to the balance.
    grain: One row per refunded fee.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The fee row being refunded.
      fee_type: Type of the refunded fee.
      txn_date: Refund date.
      amount: Refunded amount.
    account: balance
    direction: in
    triggers: []
  - type: wallet_provisional_credit
    target: wallet_transactions
    meaning: Provisional credit is posted on a pending unauthorized-payment claim.
    grain: One row per claim credited.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The disputed payment.
      txn_date: Date the provisional credit posted.
      amount: Provisional credit amount (claim amount less the customer's liability).
    account: balance
    direction: in
    triggers: []
  - type: wallet_provisional_credit_reversal
    target: wallet_transactions
    meaning: Provisional credit is taken back after the claim is denied or withdrawn.
    grain: One row per reversed provisional credit.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The disputed payment.
      txn_date: Date of the reversal.
      amount: Amount reversed, equal to the provisional credit posted.
    account: balance
    direction: out
    triggers: []
  - type: wallet_claim_reimbursement
    target: wallet_transactions
    meaning: An approved claim is reimbursed to the balance when no provisional credit had been posted for it.
    grain: One row per reimbursed claim.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The disputed payment.
      txn_date: Reimbursement date.
      amount: Reimbursed amount.
    account: balance
    direction: in
    triggers: []
  - type: wallet_internal_credit
    target: wallet_transactions
    meaning: Money arrives in the balance from another Pocketwire product — a rewards cash redemption, an advance disbursement, a savings vault withdrawal or a business profile payout.
    grain: One row per internal transfer credited.
    distinguish_by: [source_product, source_txn_id]
    fields:
      source_product: The Pocketwire product the money came from.
      source_txn_id: The originating record in that product.
      txn_date: Date credited.
      amount: Amount credited.
    account: balance
    direction: in
    triggers: []
  - type: wallet_internal_debit
    target: wallet_transactions
    meaning: Money leaves the balance for another Pocketwire product — a savings vault deposit, an advance repayment, a Pay in 4 installment or the recovery of a negative business balance.
    grain: One row per internal transfer debited.
    distinguish_by: [source_product, source_txn_id]
    fields:
      source_product: The Pocketwire product the money went to.
      source_txn_id: The receiving record in that product.
      txn_date: Date debited.
      amount: Amount debited.
    account: balance
    direction: out
    triggers: []
  - type: wallet_claim_filed
    target: wallet_claims
    meaning: The customer files a claim on a payment they sent — unauthorized payment or goods-and-services purchase protection.
    grain: One row per claim filed.
    distinguish_by: [txn_id]
    fields:
      txn_id: The disputed payment.
      claim_type: unauthorized or purchase_protection.
      reported_date: Date the claim was filed.
      claim_amount: Amount claimed.
      resolution: Always pending on a filed claim.
      customer_liability: The customer's liability computed at filing (unauthorized claims; 0.00 for purchase protection).
      provisional_credit_posted: Always false on a filed claim.
    triggers: []
  - type: wallet_claim_resolved
    target: wallet_claims
    meaning: A filed claim reaches its outcome — approved, denied or withdrawn by the customer.
    grain: One row per claim resolved.
    distinguish_by: [txn_id]
    fields:
      txn_id: The disputed payment (the same payment as the filed claim).
      claim_type: Same claim type as the filed claim.
      resolution: approved, denied or withdrawn.
      resolution_date: Date of the outcome.
      claim_amount: Amount claimed, as filed.
      customer_liability: Liability as computed at filing.
      provisional_credit_posted: Whether provisional credit had been posted before the outcome.
    triggers:
      - event: wallet:wallet_provisional_credit_reversal
        when: {resolution: [denied, withdrawn], provisional_credit_posted: true}
        map: {source_txn_id: txn_id, txn_date: resolution_date}
      - event: wallet:wallet_claim_reimbursement
        when: {resolution: approved, provisional_credit_posted: false}
        map: {source_txn_id: txn_id, txn_date: resolution_date}

measures:
  - id: wallet_msr_sent_7d
    window: Rolling 7 calendar days — the handling date and the six preceding calendar days, Eastern Time.
    measure: Sum of amount over wallet_payment_sent rows of the account with txn_date in the window, excluding payments refunded by a wallet_payment_refund.
  - id: wallet_msr_received_30d
    window: Rolling 30 calendar days — the handling date and the 29 preceding calendar days, Eastern Time.
    measure: Sum of amount over wallet_payment_received rows of the account with txn_date in the window.
  - id: wallet_msr_cash_out_today
    window: The handling calendar day, Eastern Time.
    measure: Sum of amount over wallet_cash_out rows of the account with txn_date equal to the handling date, excluding cash-outs later returned by a wallet_cash_out_return.
  - id: wallet_msr_topup_today
    window: The handling calendar day, Eastern Time.
    measure: Sum of amount over customer-requested wallet_topup rows (empty source_txn_id) of the account with txn_date equal to the handling date.
  - id: wallet_msr_instant_count_month
    window: The calendar month containing the handling date, from its first day up to the handling date.
    measure: Count of wallet_cash_out rows with transfer_speed instant in the window that have not been returned by a wallet_cash_out_return, not counting the transfer being assessed.
  - id: wallet_msr_dd_prev_month
    window: The calendar month before the month containing the handling date.
    measure: Sum of amount over wallet_direct_deposit rows of the account with txn_date in the window.

policies:
  - id: wallet_agg_multi_holding
    subject: [wallet_open]
    rule: >-
      Each person may hold one Pocketwire Personal Account, identified by the customer profile.
      A new personal account may be opened only if the customer holds no other personal account whose status is anything other than closed.
      A customer whose earlier personal account was closed may open a new one; a customer who wants a second balance for business activity opens a Pocketwire Business Profile instead, which is a separate product and never counts against this limit.
    eligibility:
      - id: one_open_account
        applies_to: [wallet_open]
        kind: dedup
        condition: "A new personal account may be opened only if the customer holds no other personal account whose status is anything other than closed."
        evidence_fields: [wallet_accounts.customer_id, wallet_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.customer_id]
          action_bindings:
            wallet_accounts.customer_id: customer_id
        dedup_contract:
          table: wallet_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [applied, active, limited, locked, closure_pending]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: wallet_open_and_activation
    subject: [wallet_open, wallet_activate, wallet_decline]
    rule: >-
      A personal account opens in applied status on the plan whose entry_gate the applicant meets; a sign-up without completed identity verification opens on Pocketwire Lite, and every other plan requires kyc_status verified.
      The applicant's date of birth on the customer profile shows they are at least 18 years old on the opening date.
      Age is counted in whole years from the date of birth to the opening date, and a birthday falling on the opening date counts as reached.
      The opening ledger balance is 0.00, billing_cycle is not_applicable on Pocketwire Lite and Pocketwire Core, and a paid plan chosen at sign-up starts its trial or first plan fee on the opened date under wallet_plan_fee.
      Activation from applied to active and decline from applied to closed are set by the Customer Identification Program check, never by a support representative; a representative explains the outcome but cannot override it, and a declined applicant may sign up again only as a new application.
    eligibility:
      - id: adult_applicant
        applies_to: [wallet_open]
        kind: authorization
        condition: "The applicant's date of birth on the customer profile shows they are at least 18 years old on the opening date."
        evidence_fields: [customers.customer_id, customers.date_of_birth]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
    params:
      minimum_age_years: 18

  - id: wallet_plan_change_rules
    subject: [wallet_plan_change]
    rule: >-
      A plan change is accepted only while the account status is active.
      The target plan's entry_gate must be met at the moment of the change; a move from Pocketwire Lite to any higher plan therefore needs kyc_status verified first, and Pocketwire Summit additionally needs the account opened at least the entry_gate min_account_age_days before the change date.
      An upgrade takes effect on the change date: the new plan's parameters apply from that date, and the plan fee consequence is decided by wallet_plan_fee.
      A downgrade takes effect according to the current plan's plan_downgrade_timing — immediate applies the lower plan on the change date, end_of_billing_period writes the lower plan into pending_variant_name and it takes effect on the plan_renewal_date, when no fee for the higher plan is charged.
      A customer may cancel a scheduled downgrade before the renewal date by clearing pending_variant_name, and scheduling a new change replaces any earlier scheduled one.
      Annual billing may be chosen only on a plan whose annual_billing_available is true; switching from annual to monthly billing takes effect on the plan_renewal_date.
      A plan change is the customer's own subscription decision and is confirmed by the customer in the app.
    eligibility:
      - id: plan_change_active
        applies_to: [wallet_plan_change]
        kind: state
        condition: "A plan change is accepted only while the account status is active."
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id
        state_contract:
          field: wallet_accounts.status
          allowed: [active]

  - id: wallet_plan_fee
    subject: [wallet_fee, wallet_fee_refund, wallet_plan_change]
    rule: >-
      The plan fee is charged on each plan_renewal_date as a wallet_fee of fee_type plan_fee whose billing_period names the month or year it covers — monthly_plan_fee on monthly billing and annual_plan_fee on annual billing — and the renewal date then moves forward one calendar month or one calendar year, falling back to the last day of the month when that day does not exist.
      A customer subscribing to a paid plan for the first time gets plan_trial_days free days counted from the plan_started_date, and the first plan fee is charged on the day after the trial ends; a customer who has subscribed to any paid plan before gets no trial.
      On an upgrade between two paid plans on monthly billing, the customer is charged, on the change date, the difference between the two monthly plan fees prorated by the days remaining in the current billing period, and the renewal date does not move; an upgrade from a free plan without a trial charges the new plan's full fee on the change date and sets the renewal date one billing cycle later.
      The monthly plan fee for a billing period is waived — no fee row is booked — when on the renewal date the account is limited or locked and has been since a restricted_at at least restricted_fee_waiver_days calendar days earlier; restricted_at is the authoritative start of the current limitation or lock.
      An annual plan fee is refunded in full as a wallet_fee_refund only when the customer cancels or downgrades within the refund window: the plan change is recorded no later than plan_cancellation_refund_days calendar days after the annual plan fee charge date.
      The refund window is counted in calendar days from the annual plan fee charge date, the day after the charge being day 1, and a change on the last day of the window still qualifies.
      Monthly plan fees and annual fees outside the window are never refunded, whether or not the plan's benefits were used; a plan fee is not charged at all on a plan whose monthly_plan_fee is 0.00.
    eligibility:
      - id: annual_refund_window
        applies_to: [wallet_fee_refund]
        kind: time
        condition: "the plan change is recorded no later than plan_cancellation_refund_days calendar days after the annual plan fee charge date"
        evidence_fields: [wallet_transactions.txn_id, wallet_transactions.txn_date, wallet_transactions.fee_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_transactions.txn_id]
          action_bindings:
            wallet_transactions.txn_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the annual plan fee charge date
          anchor_source: wallet_transactions.txn_date
          relation: not_after
          duration_source: variants.plan_cancellation_refund_days
          unit: calendar_days
          counting_rule: "The refund window is counted in calendar days from the annual plan fee charge date, the day after the charge being day 1, and a change on the last day of the window still qualifies."
          boundary: inclusive
    params:
      proration_day_basis: actual_days_in_current_billing_period

  - id: wallet_send_limits
    subject: [wallet_payment_sent]
    rule: >-
      A payment can be sent only while the account status is active.
      A single payment may not exceed per_payment_send_limit.
      The rolling 7-day total of payments sent (wallet_msr_sent_7d) plus the new payment may not exceed the effective weekly limit, which is approved_weekly_send_limit when one is recorded on the account and otherwise the plan's weekly_send_limit.
      During the post-recovery period — from the recovered_date through post_recovery_restriction_days calendar days later — the effective weekly limit is replaced by the lower of itself and post_recovery_send_limit_weekly.
      A payment funded by a linked credit card is allowed only on plans whose credit_card_funding_enabled is true.
      A payment that would breach any of these limits is declined in full — it is never split or partially sent — and no row is booked; the customer may send a smaller amount or wait until earlier payments leave the rolling window.
      Payments to a recipient who is not yet registered are sent as invitations (recipient_status unclaimed_invite) and count toward the limits from the day they are sent.
      A completed personal payment to a registered recipient cannot be reversed by Pocketwire when the customer sent it to the wrong person or changed their mind; the customer may request the money back from the recipient in the app, and such a payment is not an unauthorized payment.
    eligibility:
      - id: send_requires_active
        applies_to: [wallet_payment_sent]
        kind: state
        condition: "A payment can be sent only while the account status is active."
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id
        state_contract:
          field: wallet_accounts.status
          allowed: [active]
    measures: [wallet_msr_sent_7d]
    formula:
      effective_weekly_limit: "approved_weekly_send_limit if approved_weekly_send_limit else weekly_send_limit"
      remaining_weekly_capacity: "max(0, effective_weekly_limit - wallet_msr_sent_7d)"
      payment_allowed: "amount <= per_payment_send_limit and amount <= remaining_weekly_capacity"
    params:
      per_tier:
        Pocketwire Lite: {per_payment_send_limit: =per_payment_send_limit, weekly_send_limit: =weekly_send_limit, post_recovery_send_limit_weekly: =post_recovery_send_limit_weekly, post_recovery_restriction_days: =post_recovery_restriction_days}
        Pocketwire Core: {per_payment_send_limit: =per_payment_send_limit, weekly_send_limit: =weekly_send_limit, post_recovery_send_limit_weekly: =post_recovery_send_limit_weekly, post_recovery_restriction_days: =post_recovery_restriction_days}
        Pocketwire Plus: {per_payment_send_limit: =per_payment_send_limit, weekly_send_limit: =weekly_send_limit, post_recovery_send_limit_weekly: =post_recovery_send_limit_weekly, post_recovery_restriction_days: =post_recovery_restriction_days}
        Pocketwire Prime: {per_payment_send_limit: =per_payment_send_limit, weekly_send_limit: =weekly_send_limit, post_recovery_send_limit_weekly: =post_recovery_send_limit_weekly, post_recovery_restriction_days: =post_recovery_restriction_days}
        Pocketwire Onyx: {per_payment_send_limit: =per_payment_send_limit, weekly_send_limit: =weekly_send_limit, post_recovery_send_limit_weekly: =post_recovery_send_limit_weekly, post_recovery_restriction_days: =post_recovery_restriction_days}
        Pocketwire Summit: {per_payment_send_limit: =per_payment_send_limit, weekly_send_limit: =weekly_send_limit, post_recovery_send_limit_weekly: =post_recovery_send_limit_weekly, post_recovery_restriction_days: =post_recovery_restriction_days}

  - id: wallet_funding_fees
    subject: [wallet_payment_sent, wallet_topup, wallet_fee]
    rule: >-
      A payment funded by a linked credit card carries a credit_card_funding_fee equal to the payment amount times credit_card_funding_fee_rate_pct, rounded to the cent (half up), charged as a separate wallet_fee on the payment date; the fee is charged to the balance and does not reduce the amount the recipient receives.
      A customer-requested instant top-up from a linked debit card carries an instant_topup_fee equal to the top-up amount times instant_topup_fee_rate_pct, rounded to the cent (half up).
      Payments funded by the balance, a linked bank account or a linked debit card carry no funding fee, standard top-ups from a linked bank account are free, and the automatic funding pull behind a payment never carries its own top-up fee.
      Customer-requested top-ups initiated on one calendar day (wallet_msr_topup_today plus the new top-up) may not exceed daily_topup_limit, and no top-up may take the ledger balance above max_ledger_balance; a top-up that would breach either is declined in full.
      A funding fee is refunded only when the underlying payment is refunded as an unclaimed invitation or reimbursed on an approved claim; a fee is never refunded because the customer chose a more expensive funding source.
    eligibility: []
    measures: [wallet_msr_topup_today]
    formula:
      credit_card_funding_fee: "round(amount * credit_card_funding_fee_rate_pct / 100, 2)"
      instant_topup_fee: "round(amount * instant_topup_fee_rate_pct / 100, 2)"

  - id: wallet_instant_transfer_fee
    subject: [wallet_cash_out, wallet_fee]
    rule: >-
      A standard cash-out to a linked bank account is free and arrives within standard_transfer_max_business_days business days.
      Every instant cash-out books a wallet_fee of fee_type instant_transfer_fee on the transfer date.
      The fee is 0.00 when the transfer falls inside the monthly free quota, which is free_instant_transfers_per_month increased by card_holder_bonus_free_instant when the customer holds a Pocketwire debit card whose status is active or locked on the transfer date; the transfer falls inside the quota when wallet_msr_instant_count_month is lower than that quota.
      Outside the quota, the fee rate is dd_instant_fee_rate_pct when the direct deposits posted in the previous calendar month (wallet_msr_dd_prev_month) are at or above dd_benefit_threshold, and instant_transfer_fee_rate_pct otherwise; the two rates never combine, and the free quota always takes precedence over either rate.
      The fee is the transfer amount times the applicable rate, rounded to the cent (half up), then raised to instant_transfer_fee_min when lower and lowered to instant_transfer_fee_max when higher.
      A customer who is charged the wrong fee because a qualifying card or direct deposit was on file is refunded the difference only as a wallet_fee_refund of the whole fee followed by a new wallet_fee at the correct amount; a fee that was correctly charged is never waived as a courtesy.
    eligibility: []
    measures: [wallet_msr_instant_count_month, wallet_msr_dd_prev_month]
    formula:
      applicable_rate_pct: "dd_instant_fee_rate_pct if wallet_msr_dd_prev_month >= dd_benefit_threshold else instant_transfer_fee_rate_pct"
      raw_fee: "round(amount * applicable_rate_pct / 100, 2)"
      chargeable_fee: "min(max(raw_fee, instant_transfer_fee_min), instant_transfer_fee_max)"
    params:
      qualifying_card_statuses: [active, locked]
      per_tier:
        Pocketwire Lite: {free_instant_transfers_per_month: =free_instant_transfers_per_month, card_holder_bonus_free_instant: =card_holder_bonus_free_instant, instant_transfer_fee_rate_pct: =instant_transfer_fee_rate_pct, dd_instant_fee_rate_pct: =dd_instant_fee_rate_pct, dd_benefit_threshold: =dd_benefit_threshold, instant_transfer_fee_max: =instant_transfer_fee_max}
        Pocketwire Core: {free_instant_transfers_per_month: =free_instant_transfers_per_month, card_holder_bonus_free_instant: =card_holder_bonus_free_instant, instant_transfer_fee_rate_pct: =instant_transfer_fee_rate_pct, dd_instant_fee_rate_pct: =dd_instant_fee_rate_pct, dd_benefit_threshold: =dd_benefit_threshold, instant_transfer_fee_max: =instant_transfer_fee_max}
        Pocketwire Plus: {free_instant_transfers_per_month: =free_instant_transfers_per_month, card_holder_bonus_free_instant: =card_holder_bonus_free_instant, instant_transfer_fee_rate_pct: =instant_transfer_fee_rate_pct, dd_instant_fee_rate_pct: =dd_instant_fee_rate_pct, dd_benefit_threshold: =dd_benefit_threshold, instant_transfer_fee_max: =instant_transfer_fee_max}
        Pocketwire Prime: {free_instant_transfers_per_month: =free_instant_transfers_per_month, card_holder_bonus_free_instant: =card_holder_bonus_free_instant, instant_transfer_fee_rate_pct: =instant_transfer_fee_rate_pct, dd_instant_fee_rate_pct: =dd_instant_fee_rate_pct, dd_benefit_threshold: =dd_benefit_threshold, instant_transfer_fee_max: =instant_transfer_fee_max}
        Pocketwire Onyx: {free_instant_transfers_per_month: =free_instant_transfers_per_month, card_holder_bonus_free_instant: =card_holder_bonus_free_instant, instant_transfer_fee_rate_pct: =instant_transfer_fee_rate_pct, dd_instant_fee_rate_pct: =dd_instant_fee_rate_pct, dd_benefit_threshold: =dd_benefit_threshold, instant_transfer_fee_max: =instant_transfer_fee_max}
        Pocketwire Summit: {free_instant_transfers_per_month: =free_instant_transfers_per_month, card_holder_bonus_free_instant: =card_holder_bonus_free_instant, instant_transfer_fee_rate_pct: =instant_transfer_fee_rate_pct, dd_instant_fee_rate_pct: =dd_instant_fee_rate_pct, dd_benefit_threshold: =dd_benefit_threshold, instant_transfer_fee_max: =instant_transfer_fee_max}

  - id: wallet_cash_out_rules
    subject: [wallet_cash_out]
    rule: >-
      A cash-out can be made only while the account status is active or closure_pending, or when the account was closed for risk and its fund hold period has ended.
      Cash-outs are available only on plans whose cash_out_enabled is true; a Pocketwire Lite customer must complete identity verification and move to Pocketwire Core before any money can leave the balance.
      The cash-outs initiated on one calendar day (wallet_msr_cash_out_today plus the new cash-out) may not exceed daily_cash_out_limit, and an instant cash-out may not exceed instant_transfer_max_per_transfer; an amount above the instant maximum may still go by standard transfer within the daily limit.
      A cash-out can never exceed the ledger balance, and a cash-out that would breach a limit is declined in full with no row booked.
      The held balance of an account closed for risk is released by one standard cash-out of the whole remaining ledger balance once limitation_closure_fund_hold_days calendar days have passed since the closed_date, the closed_date itself not counted.
    eligibility:
      - id: cash_out_status
        applies_to: [wallet_cash_out]
        kind: state
        condition: "A cash-out can be made only while the account status is active or closure_pending, or when the account was closed for risk and its fund hold period has ended."
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.status, wallet_accounts.closed_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id
        state_contract:
          field: wallet_accounts.status
          allowed: [active, closure_pending, closed]
    measures: [wallet_msr_cash_out_today]
    formula:
      remaining_daily_capacity: "max(0, daily_cash_out_limit - wallet_msr_cash_out_today)"
      cash_out_allowed: "amount <= remaining_daily_capacity and amount <= ledger_balance"

  - id: wallet_evt_transfer_returns
    subject: [wallet_cash_out_return, wallet_fee_refund]
    rule: >-
      When the receiving bank or card network returns a cash-out, the full amount is credited back as a wallet_cash_out_return pointing to that cash-out, and the returned transfer no longer counts toward the daily cash-out limit or the monthly free instant quota.
      The instant_transfer_fee charged on a returned instant cash-out is refunded in full as one wallet_fee_refund pointing to that fee row.
      A fee row can be refunded only once: a fee is refunded only if no earlier wallet_fee_refund points to the same fee row.
      A cash-out that completed to a destination the customer entered is not a return, even if the customer entered the wrong account; Pocketwire does not refund that transfer or its fee.
    eligibility:
      - id: single_fee_refund
        applies_to: [wallet_fee_refund]
        kind: dedup
        condition: "a fee is refunded only if no earlier wallet_fee_refund points to the same fee row"
        evidence_fields: [wallet_transactions.source_txn_id, wallet_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_transactions.source_txn_id]
          action_bindings:
            wallet_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: wallet_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [wallet_fee_refund]}
          distinct_fields: []

  - id: wallet_limit_increase
    subject: [wallet_limit_decision]
    rule: >-
      A weekly send limit increase can be decided only while the account status is active, only on plans whose limit_increase_eligible is true, and only on a limit_increase request from the customer that is still submitted.
      The account must be old enough: the decision is made no earlier than limit_increase_min_account_age_days calendar days after the account opened date.
      Account age is counted in calendar days from the opened date, the day after opening being day 1, and a decision on the day the minimum is reached qualifies.
      Decisions are spaced out: the decision is made no earlier than limit_increase_cooldown_days calendar days after the previous limit decision date; an account with no previous limit decision date passes this spacing.
      Spacing is counted in calendar days from the previous limit decision date, the day after it being day 1, and a decision on the day the spacing is reached qualifies.
      A request is declined while any unauthorized-payment claim on the account is still pending or while the account is inside its post-recovery period.
      An approval sets approved_weekly_send_limit to the lower of the requested limit and the maximum new limit, where the maximum new limit is the lower of max_approved_weekly_send_limit and the current effective weekly limit raised by limit_increase_max_step_pct; a request at or below the current effective limit is declined as needing no change.
      A submitted request is decided within limit_increase_review_business_days business days of its submission; the customer cannot have it decided sooner.
      Every decision, approval or decline, records limit_decision_date as the decision date and closes the request as approved or declined; the per-payment limit and the cash-out limits are never changed by a limit increase.
      An approved limit stays with the account across later plan changes but is capped by the new plan's max_approved_weekly_send_limit when the new plan's ceiling is lower.
    eligibility:
      - id: limit_active
        applies_to: [wallet_limit_decision]
        kind: state
        condition: "A weekly send limit increase can be decided only while the account status is active, only on plans whose limit_increase_eligible is true, and only on a limit_increase request from the customer that is still submitted."
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id
        state_contract:
          field: wallet_accounts.status
          allowed: [active]
      - id: limit_request_on_file
        applies_to: [wallet_limit_decision]
        kind: authorization
        condition: "A weekly send limit increase can be decided only while the account status is active, only on plans whose limit_increase_eligible is true, and only on a limit_increase request from the customer that is still submitted."
        evidence_fields: [wallet_requests.request_id, wallet_requests.request_type, wallet_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_requests.request_id]
          action_bindings:
            wallet_requests.request_id: request_id
      - id: account_age
        applies_to: [wallet_limit_decision]
        kind: time
        condition: "the decision is made no earlier than limit_increase_min_account_age_days calendar days after the account opened date"
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the account opened date
          anchor_source: wallet_accounts.opened_date
          relation: not_before
          duration_source: variants.limit_increase_min_account_age_days
          unit: calendar_days
          counting_rule: "Account age is counted in calendar days from the opened date, the day after opening being day 1, and a decision on the day the minimum is reached qualifies."
          boundary: inclusive
      - id: decision_spacing
        applies_to: [wallet_limit_decision]
        kind: time
        condition: "the decision is made no earlier than limit_increase_cooldown_days calendar days after the previous limit decision date"
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.limit_decision_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the previous limit decision date
          anchor_source: wallet_accounts.limit_decision_date
          relation: not_before
          duration_source: variants.limit_increase_cooldown_days
          unit: calendar_days
          counting_rule: "Spacing is counted in calendar days from the previous limit decision date, the day after it being day 1, and a decision on the day the spacing is reached qualifies."
          boundary: inclusive
    formula:
      current_effective_limit: "approved_weekly_send_limit if approved_weekly_send_limit else weekly_send_limit"
      maximum_new_limit: "min(max_approved_weekly_send_limit, round(current_effective_limit * (1 + limit_increase_max_step_pct / 100), 2))"
    params:
      per_tier:
        Pocketwire Lite: {limit_increase_eligible: =limit_increase_eligible, limit_increase_min_account_age_days: =limit_increase_min_account_age_days, limit_increase_cooldown_days: =limit_increase_cooldown_days, limit_increase_max_step_pct: =limit_increase_max_step_pct, max_approved_weekly_send_limit: =max_approved_weekly_send_limit}
        Pocketwire Core: {limit_increase_eligible: =limit_increase_eligible, limit_increase_min_account_age_days: =limit_increase_min_account_age_days, limit_increase_cooldown_days: =limit_increase_cooldown_days, limit_increase_max_step_pct: =limit_increase_max_step_pct, max_approved_weekly_send_limit: =max_approved_weekly_send_limit}
        Pocketwire Plus: {limit_increase_eligible: =limit_increase_eligible, limit_increase_min_account_age_days: =limit_increase_min_account_age_days, limit_increase_cooldown_days: =limit_increase_cooldown_days, limit_increase_max_step_pct: =limit_increase_max_step_pct, max_approved_weekly_send_limit: =max_approved_weekly_send_limit}
        Pocketwire Prime: {limit_increase_eligible: =limit_increase_eligible, limit_increase_min_account_age_days: =limit_increase_min_account_age_days, limit_increase_cooldown_days: =limit_increase_cooldown_days, limit_increase_max_step_pct: =limit_increase_max_step_pct, max_approved_weekly_send_limit: =max_approved_weekly_send_limit}
        Pocketwire Onyx: {limit_increase_eligible: =limit_increase_eligible, limit_increase_min_account_age_days: =limit_increase_min_account_age_days, limit_increase_cooldown_days: =limit_increase_cooldown_days, limit_increase_max_step_pct: =limit_increase_max_step_pct, max_approved_weekly_send_limit: =max_approved_weekly_send_limit}
        Pocketwire Summit: {limit_increase_eligible: =limit_increase_eligible, limit_increase_min_account_age_days: =limit_increase_min_account_age_days, limit_increase_cooldown_days: =limit_increase_cooldown_days, limit_increase_max_step_pct: =limit_increase_max_step_pct, max_approved_weekly_send_limit: =max_approved_weekly_send_limit}

  - id: wallet_restriction
    subject: [wallet_restrict, wallet_lift_restriction, wallet_risk_close]
    rule: >-
      Limitations are placed by the Pocketwire risk team, never at a customer's request; restriction_reason records why, and a limited account can still receive payments and direct deposits and repay a Pocketwire Advance, but cannot send payments, cash out, top up or change plan.
      A support representative explains which documents the reason requires, and the customer submits them in the app as a restriction_documents request.
      A limitation is lifted only on a restriction_documents request whose request_status is approved by the review team; a request still submitted is waiting for review within restriction_review_business_days business days, and the representative cannot shorten or pre-empt that review.
      An account is closed for risk when the review team declined the restriction_documents request, or when no restriction_documents request was submitted and the response window has passed: the risk closure is recorded later than restriction_document_response_days calendar days after the limitation placement time.
      The response window is counted in calendar days from the limitation placement time, the day after the limitation being day 1, and the window is still open on its last day.
      A risk-closed account's remaining balance is held and released under wallet_cash_out_rules.
    eligibility:
      - id: documents_approved
        applies_to: [wallet_lift_restriction]
        kind: authorization
        condition: "A limitation is lifted only on a restriction_documents request whose request_status is approved by the review team"
        evidence_fields: [wallet_requests.request_id, wallet_requests.request_type, wallet_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_requests.request_id]
          action_bindings:
            wallet_requests.request_id: request_id
      - id: response_window_passed
        applies_to: [wallet_risk_close]
        kind: time
        condition: "the risk closure is recorded later than restriction_document_response_days calendar days after the limitation placement time"
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.restricted_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the limitation placement time
          anchor_source: wallet_accounts.restricted_at
          relation: not_before
          duration_source: variants.restriction_document_response_days
          unit: calendar_days
          counting_rule: "The response window is counted in calendar days from the limitation placement time, the day after the limitation being day 1, and the window is still open on its last day."
          boundary: exclusive

  - id: wallet_account_recovery
    subject: [wallet_lock, wallet_recover]
    rule: >-
      A support representative places a security lock when the verified customer reports a login, device change or payment they did not make, or when the customer reports that their phone number or email was taken over; the lock stops every money movement except incoming credits.
      Recovery requires an account_recovery request whose request_status is approved, which the review team sets after the customer passes the plan's recovery_method in the app.
      Recovery completes only after the cooling-off period: recovery is recorded no earlier than recovery_cooling_off_hours full hours after the security lock time.
      The cooling-off period is counted in full elapsed hours from the security lock time recorded in restricted_at, and recovery at exactly the end of the period qualifies.
      Recovery sets recovered_date, and the post-recovery send cap of wallet_send_limits applies from that date; unauthorized payments made before the lock are handled separately as claims under wallet_unauthorized_claims and are not refunded by recovery itself.
      A customer who cannot pass the recovery_method cannot be recovered by a representative on the strength of other information, however convincing.
    eligibility:
      - id: recovery_approved
        applies_to: [wallet_recover]
        kind: authorization
        condition: "Recovery requires an account_recovery request whose request_status is approved"
        evidence_fields: [wallet_requests.request_id, wallet_requests.request_type, wallet_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_requests.request_id]
          action_bindings:
            wallet_requests.request_id: request_id
      - id: cooling_off
        applies_to: [wallet_recover]
        kind: time
        condition: "recovery is recorded no earlier than recovery_cooling_off_hours full hours after the security lock time"
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.restricted_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the security lock time
          anchor_source: wallet_accounts.restricted_at
          relation: not_before
          duration_source: variants.recovery_cooling_off_hours
          unit: elapsed_hours
          counting_rule: "The cooling-off period is counted in full elapsed hours from the security lock time recorded in restricted_at, and recovery at exactly the end of the period qualifies."
          boundary: inclusive

  - id: wallet_unauthorized_claims
    subject: [wallet_claim_filed, wallet_claim_resolved, wallet_provisional_credit, wallet_provisional_credit_reversal, wallet_claim_reimbursement]
    rule: >-
      An unauthorized-payment claim covers a wallet_payment_sent the customer did not make or authorize; a payment the customer made themselves — including one sent to the wrong person, one induced by a seller who never delivered, or one sent from a shared device the customer let someone use — is not unauthorized.
      The claim is accepted only within the report window: the claim is filed no later than unauthorized_claim_report_days calendar days after the disputed payment's transaction date.
      The report window is counted in calendar days from the disputed payment's transaction date, the day after the payment being day 1, and a claim filed on the last day of the window is accepted.
      A payment can carry only one claim of either type: a claim is filed only if no earlier claim of any type or outcome exists on the same payment, so an unauthorized claim and a purchase protection claim are mutually exclusive on one payment.
      The customer's liability is computed at filing: when the claim is filed within timely_notice_business_days business days after the payment's transaction date, liability is the lower of the claim amount and liability_cap_timely; otherwise it is the lower of the claim amount and liability_cap_late.
      Business days are Federal Reserve business days — Monday through Friday excluding federal holidays — and the first business day after the transaction date is day 1.
      Provisional credit of the claim amount less the customer's liability is posted once the claim has stayed pending long enough: provisional credit is posted no earlier than provisional_credit_business_days business days after the claim report date, and only on a claim whose latest record is still pending.
      Provisional-credit timing is counted in Federal Reserve business days from the claim report date, the first business day after the report being day 1, and posting on the day the period is reached qualifies.
      When the disputed payment's transaction date falls within new_account_period_days calendar days after the account opened date, new_account_provisional_credit_business_days replaces provisional_credit_business_days and new_account_investigation_days calendar days replace claim_investigation_business_days.
      The claims team records approved or denied; a claim still pending after claim_investigation_business_days business days (or new_account_investigation_days calendar days for a new-account payment) from the report date is resolved as approved on the next handling.
      On approval, a provisional credit already posted becomes final with no further row, and when none was posted the claim amount less the liability is reimbursed as a wallet_claim_reimbursement.
      On denial, or on withdrawal by the customer, a posted provisional credit is reversed in full; the customer's withdrawal is the customer's own decision, confirmed by the customer, and ends the claim for good.
    eligibility:
      - id: report_window
        applies_to: [wallet_claim_filed]
        kind: time
        condition: "the claim is filed no later than unauthorized_claim_report_days calendar days after the disputed payment's transaction date"
        evidence_fields: [wallet_transactions.txn_id, wallet_transactions.txn_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_transactions.txn_id]
          action_bindings:
            wallet_transactions.txn_id: txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the disputed payment's transaction date
          anchor_source: wallet_transactions.txn_date
          relation: not_after
          duration_source: variants.unauthorized_claim_report_days
          unit: calendar_days
          counting_rule: "The report window is counted in calendar days from the disputed payment's transaction date, the day after the payment being day 1, and a claim filed on the last day of the window is accepted."
          boundary: inclusive
      - id: one_claim_per_payment
        applies_to: [wallet_claim_filed]
        kind: dedup
        condition: "a claim is filed only if no earlier claim of any type or outcome exists on the same payment"
        evidence_fields: [wallet_claims.txn_id, wallet_claims.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_claims.txn_id]
          action_bindings:
            wallet_claims.txn_id: txn_id
        dedup_contract:
          table: wallet_claims
          mode: separate_record
          object_bindings: {txn_id: txn_id}
          duplicate_filters: {event_type: [wallet_claim_filed]}
          distinct_fields: []
      - id: provisional_credit_timing
        applies_to: [wallet_provisional_credit]
        kind: time
        condition: "provisional credit is posted no earlier than provisional_credit_business_days business days after the claim report date, and only on a claim whose latest record is still pending"
        evidence_fields: [wallet_claims.txn_id, wallet_claims.reported_date, wallet_claims.resolution]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_claims.txn_id]
          action_bindings:
            wallet_claims.txn_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the claim report date
          anchor_source: wallet_claims.reported_date
          relation: not_before
          duration_source: variants.provisional_credit_business_days
          unit: business_days
          counting_rule: "Provisional-credit timing is counted in Federal Reserve business days from the claim report date, the first business day after the report being day 1, and posting on the day the period is reached qualifies."
          boundary: inclusive
      - id: single_provisional_credit
        applies_to: [wallet_provisional_credit]
        kind: dedup
        condition: "provisional credit is posted no earlier than provisional_credit_business_days business days after the claim report date, and only on a claim whose latest record is still pending"
        evidence_fields: [wallet_transactions.source_txn_id, wallet_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_transactions.source_txn_id]
          action_bindings:
            wallet_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: wallet_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [wallet_provisional_credit]}
          distinct_fields: []
    formula:
      liability_if_timely: "min(claim_amount, liability_cap_timely)"
      liability_if_late: "min(claim_amount, liability_cap_late)"
      credit_amount: "claim_amount - customer_liability"
    params:
      per_tier:
        Pocketwire Lite: {unauthorized_claim_report_days: =unauthorized_claim_report_days, liability_cap_timely: =liability_cap_timely, liability_cap_late: =liability_cap_late, provisional_credit_business_days: =provisional_credit_business_days, claim_investigation_business_days: =claim_investigation_business_days}
        Pocketwire Core: {unauthorized_claim_report_days: =unauthorized_claim_report_days, liability_cap_timely: =liability_cap_timely, liability_cap_late: =liability_cap_late, provisional_credit_business_days: =provisional_credit_business_days, claim_investigation_business_days: =claim_investigation_business_days}
        Pocketwire Plus: {unauthorized_claim_report_days: =unauthorized_claim_report_days, liability_cap_timely: =liability_cap_timely, liability_cap_late: =liability_cap_late, provisional_credit_business_days: =provisional_credit_business_days, claim_investigation_business_days: =claim_investigation_business_days}
        Pocketwire Prime: {unauthorized_claim_report_days: =unauthorized_claim_report_days, liability_cap_timely: =liability_cap_timely, liability_cap_late: =liability_cap_late, provisional_credit_business_days: =provisional_credit_business_days, claim_investigation_business_days: =claim_investigation_business_days}
        Pocketwire Onyx: {unauthorized_claim_report_days: =unauthorized_claim_report_days, liability_cap_timely: =liability_cap_timely, liability_cap_late: =liability_cap_late, provisional_credit_business_days: =provisional_credit_business_days, claim_investigation_business_days: =claim_investigation_business_days}
        Pocketwire Summit: {unauthorized_claim_report_days: =unauthorized_claim_report_days, liability_cap_timely: =liability_cap_timely, liability_cap_late: =liability_cap_late, provisional_credit_business_days: =provisional_credit_business_days, claim_investigation_business_days: =claim_investigation_business_days}

  - id: wallet_purchase_protection
    subject: [wallet_claim_filed, wallet_claim_resolved, wallet_claim_reimbursement]
    rule: >-
      Purchase protection covers only a wallet_payment_sent whose payment_type is goods_and_services, when the item was not received or was significantly not as described; personal payments are never covered, even when they paid for goods, and a goods-and-services payment the customer did not authorize is handled as an unauthorized claim instead.
      The claim is accepted only within the protection window: the claim is filed no later than purchase_protection_claim_days calendar days after the goods-and-services payment's transaction date.
      The protection window is counted in calendar days from the goods-and-services payment's transaction date, the day after the payment being day 1, and a claim filed on the last day of the window is accepted.
      The one-claim-per-payment exclusion of wallet_unauthorized_claims applies to purchase protection claims too.
      Purchase protection claims carry no customer liability and no provisional credit; the claims team records approved or denied, and an approval reimburses the lower of the claim amount and purchase_protection_max_amount as a wallet_claim_reimbursement, together with the refund of any credit card funding fee charged on that payment.
    eligibility:
      - id: protection_window
        applies_to: [wallet_claim_filed]
        kind: time
        condition: "the claim is filed no later than purchase_protection_claim_days calendar days after the goods-and-services payment's transaction date"
        evidence_fields: [wallet_transactions.txn_id, wallet_transactions.txn_date, wallet_transactions.payment_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_transactions.txn_id]
          action_bindings:
            wallet_transactions.txn_id: txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the goods-and-services payment's transaction date
          anchor_source: wallet_transactions.txn_date
          relation: not_after
          duration_source: variants.purchase_protection_claim_days
          unit: calendar_days
          counting_rule: "The protection window is counted in calendar days from the goods-and-services payment's transaction date, the day after the payment being day 1, and a claim filed on the last day of the window is accepted."
          boundary: inclusive
    formula:
      reimbursement_amount: "min(claim_amount, purchase_protection_max_amount)"

  - id: wallet_evt_invitation_payments
    subject: [wallet_payment_claimed, wallet_payment_refund]
    rule: >-
      A payment sent to a phone number or email with no Pocketwire account is an invitation (recipient_status unclaimed_invite) and stays with Pocketwire until the recipient claims it, which is booked as wallet_payment_claimed.
      An invitation payment is refunded only if it has not been claimed; the sender may cancel an unclaimed invitation at any time, and an invitation still unclaimed unclaimed_payment_expiry_days calendar days after its transaction date is refunded automatically on the next handling.
      The expiry is counted in calendar days from the invitation payment's transaction date, the day after sending being day 1, and a refund on the day the expiry is reached qualifies.
      The refund returns the full payment amount to the balance as one wallet_payment_refund pointing to the invitation payment, whatever its original funding source, and any credit card funding fee charged on it is refunded as a wallet_fee_refund.
      A claimed invitation, or a payment to a registered recipient, is never refunded by Pocketwire.
    eligibility:
      - id: not_yet_claimed
        applies_to: [wallet_payment_refund]
        kind: dedup
        condition: "An invitation payment is refunded only if it has not been claimed"
        evidence_fields: [wallet_transactions.source_txn_id, wallet_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_transactions.source_txn_id]
          action_bindings:
            wallet_transactions.source_txn_id: source_txn_id
        dedup_contract:
          table: wallet_transactions
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [wallet_payment_claimed, wallet_payment_refund]}
          distinct_fields: []

  - id: wallet_evt_receiving
    subject: [wallet_payment_received, wallet_fee]
    rule: >-
      Incoming payments credit the balance only while the rolling 30-day total received (wallet_msr_received_30d) plus the new payment stays within rolling_30d_receive_limit and the ledger balance after the credit stays within max_ledger_balance; a payment that would breach either is declined back to the sender and nothing is booked.
      A goods-and-services payment received into a personal account carries a goods_services_seller_fee equal to the payment amount times goods_services_fee_rate_pct, rounded to the cent (half up), booked as a separate wallet_fee on the same day; personal payments received carry no fee.
      The seller fee is refunded only in the same proportion as a refund the customer sends back to the buyer through the app, and never because the customer marked a sale as personal after the fact.
    eligibility: []
    measures: [wallet_msr_received_30d]
    formula:
      goods_services_seller_fee: "round(amount * goods_services_fee_rate_pct / 100, 2)"

  - id: wallet_evt_direct_deposit
    subject: [wallet_direct_deposit]
    rule: >-
      Direct deposits post as soon as Pocketwire receives the payer's file, which is up to early_direct_deposit_days calendar days before the payer's scheduled pay date; the early availability depends on when the payer sends the file and is never guaranteed for a given deposit.
      Direct deposits do not count toward rolling_30d_receive_limit, but a deposit that would take the ledger balance above max_ledger_balance is returned to the payer.
      Direct deposits are accepted while the account is active, limited or locked; on a closed account they are returned to the payer.
      The monthly direct-deposit total is the input of the reduced instant transfer rate in wallet_instant_transfer_fee and of the Pocketwire Advance eligibility rules.
    eligibility: []

  - id: wallet_evt_internal_transfers
    subject: [wallet_internal_credit, wallet_internal_debit]
    rule: >-
      Transfers between the personal balance and other Pocketwire products are free, post on the same day, and never count toward the P2P send or receive limits or the cash-out limits.
      An internal debit can be made only while the account status is active, limited or closure_pending; a locked account can receive internal credits but cannot move money out, except that a scheduled Pocketwire Advance repayment is still collected.
      An internal credit that would take the ledger balance above max_ledger_balance is not made and the money stays in the originating product.
    eligibility:
      - id: internal_debit_status
        applies_to: [wallet_internal_debit]
        kind: state
        condition: "An internal debit can be made only while the account status is active, limited or closure_pending"
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id
        state_contract:
          field: wallet_accounts.status
          allowed: [active, limited, closure_pending]

  - id: wallet_closure
    subject: [wallet_request_closure, wallet_withdraw_closure, wallet_close]
    rule: >-
      Closing the personal account is the customer's own decision and is confirmed by the customer in the app, which moves the account to closure_pending; the customer may withdraw it while it is still pending.
      A closure completes only when the ledger balance is 0.00 and no claim on the account is still pending; the customer moves any remaining balance out by cash-out first, and a pending claim keeps the account in closure_pending until it is resolved.
      A customer who holds an open Pocketwire Business Profile or an open Pocketwire Advance line must close those first, because both are linked to the personal account.
      A closed account cannot be reopened; the customer may open a new account under wallet_agg_multi_holding.
    eligibility:
      - id: zero_balance
        applies_to: [wallet_close]
        kind: authorization
        condition: "A closure completes only when the ledger balance is 0.00 and no claim on the account is still pending"
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.ledger_balance, wallet_claims.resolution]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id

# ============================================================================
# extended_policies — personal_payments_limits_and_account_access
# ============================================================================
extended_policies:
  - id: wallet_ext_renewal_plan_fee
    base_policy_refs: [wallet_plan_fee, wallet_funding_fees, wallet_instant_transfer_fee, wallet_evt_receiving]
    overwrite:
      - base_policy: wallet_plan_fee
        superseded_clause: >-
          The plan fee is charged on each plan_renewal_date as a wallet_fee of fee_type plan_fee whose billing_period names the month or year it covers — monthly_plan_fee on monthly billing and annual_plan_fee on annual billing — and the renewal date then moves forward one calendar month or one calendar year, falling back to the last day of the month when that day does not exist.
        replaced_by: >-
          On monthly billing the renewal plan fee is booked on the renewal date as one plan fee entry whose billing period is the month in which the new period starts, and the renewal date then moves forward one calendar month, falling back to the last day of the month when that day does not exist.
    trigger: state_due
    subject: [wallet_fee]
    computes: fee_amount
    target_tool: charge_plan_fee_0f985a0a
    params:
      dd_high_count: 2
      dd_high_total: 2500.00
      dd_high_pct: 25
      dd_low_pct: 10
      rw_top_pct: 15
      rw_mid_pct: 10
      vault_top_balance: 10000.00
      vault_top_pct: 10
      vault_mid_balance: 2500.00
      vault_mid_pct: 5
      card_top_pct: 10
      card_mid_pct: 5
    rule: >-
      On monthly billing the renewal plan fee is booked on the renewal date as one plan fee entry whose billing period is the month in which the new period starts, and the renewal date then moves forward one calendar month, falling back to the last day of the month when that day does not exist.
      On annual billing the renewal plan fee is the plan's annual_plan_fee, booked on the renewal date as one plan fee entry whose billing period is the year in which the new period starts, and the renewal date then moves forward one calendar year, falling back to the last day of the month when that day does not exist; the reductions and the credit described below apply to monthly billing only.
      The renewal plan fee is the plan's monthly_plan_fee for the new period, rounded to the cent (half up) once, at the end.
      Where reductions apply, the renewal discount percentage is taken off the monthly_plan_fee first and the restricted-days credit is then subtracted from that discounted fee, the result never falling below 0.00 before the single rounding.
      The renewal discount percentage is the sum of four percentages — the payroll-deposit reduction, the rewards-member reduction, the vault-saver reduction and the debit-card reduction — added together into one total that is applied once to the monthly_plan_fee; the four reductions never act one after another.
      The payroll-deposit reduction on the renewal plan fee reads the direct deposits dated in the last month, a deposit counting when it is dated later than the same calendar day one month before the handling date: with dd_high_count or more such deposits that together reach dd_high_total the reduction is dd_high_pct percent; with deposits that together reach the plan's dd_benefit_threshold without meeting both of those conditions it is dd_low_pct percent; with neither it is 0 percent.
      The rewards-member reduction on the renewal plan fee is rw_top_pct percent for a Pocketwire Rewards membership in active status on the Pocketwire Rewards Diamond or Pocketwire Rewards Obsidian tier, rw_mid_pct percent for an active membership on the Pocketwire Rewards Gold or Pocketwire Rewards Platinum tier, and 0 percent for any other membership or none.
      The vault-saver reduction on the renewal plan fee reads the balance of the customer's active Pocketwire Savings Vault (a vault that is time_locked, frozen or closed does not count): at vault_top_balance or more it is vault_top_pct percent, at vault_mid_balance or more but below vault_top_balance it is vault_mid_pct percent, and below vault_mid_balance or with no active vault it is 0 percent.
      The debit-card reduction on the renewal plan fee reads the tier of the customer's Pocketwire debit card in active or locked status: card_top_pct percent on Pocketwire Visa Infinite Debit or Pocketwire Visa Infinite Metal Debit, card_mid_pct percent on Pocketwire Visa Platinum Debit or Pocketwire Visa Signature Debit, and 0 percent on any other tier or with no such card.
      The restricted-days credit on the renewal plan fee is worked out on the fee after the renewal discount percentage, over the ending billing period, which runs from the date of the previous plan fee entry to the handling date (the renewal date itself when the fee is booked on time) and whose length is the calendar days between those two dates.
      When the account's most recent restriction was a security lock for suspected_account_takeover recovered on or after the start of that period, the credit is the discounted fee times the days from the later of the lock date and the period start to the recovered date, divided by the period's length; when it was a limitation for risk_review or identity_documents_required lifted on or after the start of that period, the credit is all or nothing — the whole discounted fee when the days from the later of the limitation date and the period start to the lifted date are more than half the period's length, and nothing when they are not; otherwise there is no credit.
      The plan-fee waiver for restricted accounts still applies: when on the renewal date the account is limited or locked and has been since a restricted_at at least restricted_fee_waiver_days calendar days earlier, no plan fee entry is booked for that period, and a plan whose monthly_plan_fee is 0.00 books none either.
    baseline:
      rule: >-
        On monthly billing the renewal plan fee is booked on the renewal date as one plan fee entry whose billing period is the month in which the new period starts, and the renewal date then moves forward one calendar month, falling back to the last day of the month when that day does not exist.
        On annual billing the renewal plan fee is the plan's annual_plan_fee, booked on the renewal date as one plan fee entry whose billing period is the year in which the new period starts, and the renewal date then moves forward one calendar year, falling back to the last day of the month when that day does not exist; the reductions and the credit described below apply to monthly billing only.
        The renewal plan fee is the plan's monthly_plan_fee for the new period, rounded to the cent (half up) once, at the end.
      params: [monthly_plan_fee, annual_plan_fee]
    prerequisite: []
    cross_category:
      - category: rewards
        as: branch
        reads: [status, variant_name]
        note: The rewards-member reduction is decided from the customer's Pocketwire Rewards membership status and tier.
      - category: savings
        as: branch
        reads: [vault_balance]
        note: The vault-saver reduction is decided from the balance of the customer's active savings vault.
      - category: card
        as: branch
        reads: [status, variant_name]
        note: The debit-card reduction is decided from the tier of the customer's active or locked debit card.
    compute:
      - dd_total: "SUM('wallet_transactions', 'amount', within_months=1, date_field='txn_date', event_type='wallet_direct_deposit')"
      - dd_count: "COUNT('wallet_transactions', within_months=1, date_field='txn_date', event_type='wallet_direct_deposit')"
      - dd_discount_pct: "K('dd_high_pct') if (dd_count >= K('dd_high_count') and dd_total >= K('dd_high_total')) else (K('dd_low_pct') if (dd_total >= P('dd_benefit_threshold') and (dd_count < K('dd_high_count') or dd_total < K('dd_high_total'))) else 0)"
      - rw_status: "CFIELD('rewards', 'status')"
      - rw_tier: "CFIELD('rewards', 'variant_name')"
      - rewards_discount_pct: "K('rw_top_pct') if (rw_status == 'active' and (rw_tier == 'Pocketwire Rewards Diamond' or rw_tier == 'Pocketwire Rewards Obsidian')) else (K('rw_mid_pct') if (rw_status == 'active' and (rw_tier == 'Pocketwire Rewards Gold' or rw_tier == 'Pocketwire Rewards Platinum')) else 0)"
      - vault_total: "float(CFIELD('savings', 'vault_balance', status='active') or 0)"
      - vault_discount_pct: "K('vault_top_pct') if vault_total >= K('vault_top_balance') else (K('vault_mid_pct') if vault_total >= K('vault_mid_balance') else 0)"
      - card_tier: "CFIELD('card', 'variant_name', status='active') or CFIELD('card', 'variant_name', status='locked')"
      - card_discount_pct: "K('card_top_pct') if (card_tier == 'Pocketwire Visa Infinite Debit' or card_tier == 'Pocketwire Visa Infinite Metal Debit') else (K('card_mid_pct') if (card_tier == 'Pocketwire Visa Platinum Debit' or card_tier == 'Pocketwire Visa Signature Debit') else 0)"
      - total_discount_pct: "dd_discount_pct + rewards_discount_pct + vault_discount_pct + card_discount_pct"
      - discounted_fee: "P('monthly_plan_fee') * (1 - total_discount_pct / 100)"
      - period_start: "LATEST('wallet_transactions', 'txn_date', date_field='txn_date', event_type='wallet_fee', fee_type='plan_fee')"
      - period_days: "DAYS(period_start, NOW)"
      - restricted_credit: "(discounted_fee * DAYS(MX(F('restricted_at'), period_start), F('recovered_date')) / period_days) if (F('restriction_reason') == 'suspected_account_takeover' and F('recovered_date') >= period_start) else ((discounted_fee if DAYS(MX(F('restricted_at'), period_start), F('restriction_lifted_date')) * 2 > period_days else 0) if ((F('restriction_reason') == 'risk_review' or F('restriction_reason') == 'identity_documents_required') and F('restriction_lifted_date') >= period_start) else 0)"
      - result: "RND(P('annual_plan_fee'), 2) if F('billing_cycle') == 'annual' else RND(MX(0, discounted_fee - restricted_credit), 2)"
    compute_basis:
      dd_total: "The payroll-deposit reduction on the renewal plan fee reads the direct deposits dated in the last month, a deposit counting when it is dated later than the same calendar day one month before the handling date"
      dd_count: "The payroll-deposit reduction on the renewal plan fee reads the direct deposits dated in the last month, a deposit counting when it is dated later than the same calendar day one month before the handling date"
      dd_discount_pct: "with dd_high_count or more such deposits that together reach dd_high_total the reduction is dd_high_pct percent; with deposits that together reach the plan's dd_benefit_threshold without meeting both of those conditions it is dd_low_pct percent; with neither it is 0 percent."
      rw_status: "The rewards-member reduction on the renewal plan fee is rw_top_pct percent for a Pocketwire Rewards membership in active status"
      rw_tier: "on the Pocketwire Rewards Diamond or Pocketwire Rewards Obsidian tier, rw_mid_pct percent for an active membership on the Pocketwire Rewards Gold or Pocketwire Rewards Platinum tier"
      rewards_discount_pct: "The rewards-member reduction on the renewal plan fee is rw_top_pct percent for a Pocketwire Rewards membership in active status on the Pocketwire Rewards Diamond or Pocketwire Rewards Obsidian tier, rw_mid_pct percent for an active membership on the Pocketwire Rewards Gold or Pocketwire Rewards Platinum tier, and 0 percent for any other membership or none."
      vault_total: "The vault-saver reduction on the renewal plan fee reads the balance of the customer's active Pocketwire Savings Vault"
      vault_discount_pct: "at vault_top_balance or more it is vault_top_pct percent, at vault_mid_balance or more but below vault_top_balance it is vault_mid_pct percent, and below vault_mid_balance or with no active vault it is 0 percent."
      card_tier: "The debit-card reduction on the renewal plan fee reads the tier of the customer's Pocketwire debit card in active or locked status"
      card_discount_pct: "card_top_pct percent on Pocketwire Visa Infinite Debit or Pocketwire Visa Infinite Metal Debit, card_mid_pct percent on Pocketwire Visa Platinum Debit or Pocketwire Visa Signature Debit, and 0 percent on any other tier or with no such card."
      total_discount_pct: "added together into one total that is applied once to the monthly_plan_fee; the four reductions never act one after another."
      discounted_fee: "the renewal discount percentage is taken off the monthly_plan_fee first"
      period_start: "over the ending billing period, which runs from the date of the previous plan fee entry to the handling date"
      period_days: "whose length is the calendar days between those two dates."
      restricted_credit: "When the account's most recent restriction was a security lock for suspected_account_takeover recovered on or after the start of that period, the credit is the discounted fee times the days from the later of the lock date and the period start to the recovered date, divided by the period's length; when it was a limitation for risk_review or identity_documents_required lifted on or after the start of that period, the credit is all or nothing — the whole discounted fee when the days from the later of the limitation date and the period start to the lifted date are more than half the period's length, and nothing when they are not; otherwise there is no credit."
      result: "On annual billing the renewal plan fee is the plan's annual_plan_fee | the reductions and the credit described below apply to monthly billing only | the restricted-days credit is then subtracted from that discounted fee, the result never falling below 0.00 before the single rounding."
    factors:
      - id: payroll_deposit_reduction
        effect: parameter
        decides: dd_discount_pct
        bindings: [dd_total, dd_count, dd_discount_pct]
        ladder:
          - when: "dd_high_count or more direct deposits dated in the last month AND together reaching dd_high_total"
            value: "K('dd_high_pct')"
          - when: "direct deposits dated in the last month reaching dd_benefit_threshold AND not meeting both conditions of the tier above"
            value: "K('dd_low_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          dd_discount_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: rewards_member_reduction
        effect: parameter
        decides: rewards_discount_pct
        bindings: [rw_status, rw_tier, rewards_discount_pct]
        ladder:
          - when: "Pocketwire Rewards membership active AND on the Diamond or Obsidian tier"
            value: "K('rw_top_pct')"
          - when: "Pocketwire Rewards membership active AND on the Gold or Platinum tier"
            value: "K('rw_mid_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          rewards_discount_pct: "0"
        evidence: [cross_category]
        cross_difficulty: rewards
      - id: vault_saver_reduction
        effect: parameter
        decides: vault_discount_pct
        bindings: [vault_total, vault_discount_pct]
        ladder:
          - when: "active savings vault balance at vault_top_balance or more"
            value: "K('vault_top_pct')"
          - when: "active savings vault balance at vault_mid_balance or more but below vault_top_balance"
            value: "K('vault_mid_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          vault_discount_pct: "0"
        evidence: [cross_category]
        cross_difficulty: savings
      - id: debit_card_reduction
        effect: parameter
        decides: card_discount_pct
        bindings: [card_tier, card_discount_pct]
        ladder:
          - when: "active or locked Pocketwire Visa Infinite Debit or Infinite Metal Debit card"
            value: "K('card_top_pct')"
          - when: "active or locked Pocketwire Visa Platinum Debit or Signature Debit card"
            value: "K('card_mid_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          card_discount_pct: "0"
        evidence: [cross_category]
        cross_difficulty: card
      - id: restricted_days_credit
        effect: method
        decides: restricted_credit
        bindings: [period_start, period_days, restricted_credit]
        ladder:
          - when: "most recent restriction a security lock for suspected account takeover AND recovered on or after the start of the ending period"
            method: "pro rata: credit the discounted fee times the locked days (later of lock date and period start, to the recovered date) over the period length"
          - when: "most recent restriction a limitation for risk review or identity documents AND lifted on or after the start of the ending period"
            method: "all or nothing: credit the whole discounted fee when the limitation covered more than half the ending period, nothing otherwise"
          - when: "otherwise"
            method: "no credit; the discounted fee stands"
        baseline:
          restricted_credit: "0"
        evidence: [date, history]
        cross_difficulty: null
    inputs:
      history:
        - {table: wallet_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: wallet_direct_deposit}}
        - {table: wallet_transactions, aggregate: count, field: txn_id, within_months: 1, filters: {event_type: wallet_direct_deposit}}
        - {table: wallet_transactions, aggregate: latest, field: txn_date, filters: {event_type: wallet_fee, fee_type: plan_fee}}
      cross_category: [rewards, savings, card]

  - id: wallet_ext_available_balance_transfer
    base_policy_refs: [wallet_instant_transfer_fee, wallet_cash_out_rules]
    overwrite: []
    trigger: on_request
    subject: [wallet_cash_out]
    computes: amount
    target_tool: transfer_balance_to_bank_3181bc35
    params:
      adv_near_days: 3
      adv_near_pct: 100
      adv_mid_days: 10
      adv_mid_pct: 50
      topup_new_days: 180
      topup_new_pct: 100
      topup_mid_days: 365
      topup_mid_pct: 50
      biz_idle_pct: 100
      biz_active_pct: 50
    rule: >-
      A customer who asks to move everything they can out of the personal balance to their linked bank sends one standard cash-out whose amount is the available transfer amount.
      The available transfer amount is the account's ledger balance at the moment of the transfer, rounded to the cent (half up).
      Where amounts are kept back — the advance repayment reserve, the sales receipt hold, the bank top-up hold and the business shortfall reserve — they are added together and taken off the ledger balance once, the result never falling below 0.00.
      A transfer of the whole available balance is not sized until the account carries a plan fee entry for every billing period whose renewal date has arrived.
      The advance repayment reserve on the available transfer amount reads the customer's Pocketwire Advance line and the due date of its most recent advance disbursement: for a line in active status whose due date is from 0 to adv_near_days calendar days after the handling date, adv_near_pct percent of the line's outstanding balance is kept back; for an active line whose due date is more than adv_near_days and at most adv_mid_days calendar days away, adv_mid_pct percent is kept back; otherwise nothing is kept back.
      The sales receipt hold on the available transfer amount reads the goods-and-services payments received into the account: when every such payment the account ever received is dated in the last three months (a new seller), the goods-and-services payments dated in the last two months are held in full; when the account received such a payment before the last three months (an established seller), only the single most recent goods-and-services payment it received is held; when the account never received one, nothing is held; a payment counts inside a window of N months when it is dated later than the same calendar day N months before the handling date.
      The bank top-up hold on the available transfer amount reads the customer-requested top-ups from a linked bank dated in the last month (automatic funding pulls behind a payment are not top-ups the customer requested) and the account's age in calendar days from its opened date: for an account younger than topup_new_days days, topup_new_pct percent of those top-ups is held; for an account at least topup_new_days but younger than topup_mid_days days, topup_mid_pct percent is held; for an older account nothing is held; the held amount is rounded to the cent (half up).
      The business shortfall reserve on the available transfer amount reads the customer's Pocketwire Business Profile: when its business balance is below zero and no business sale was booked on it in the last month, biz_idle_pct percent of the shortfall is kept back; when its balance is below zero and at least one sale was booked in the last month, biz_active_pct percent of the shortfall is kept back; otherwise nothing is kept back; the reserve is rounded to the cent (half up).
      The cash-out rules of the personal account still apply to the transfer: the account must be active or closure_pending, the day's cash-outs together may not exceed daily_cash_out_limit, and no cash-out may exceed the ledger balance.
    baseline:
      rule: >-
        A customer who asks to move everything they can out of the personal balance to their linked bank sends one standard cash-out whose amount is the available transfer amount.
        The available transfer amount is the account's ledger balance at the moment of the transfer, rounded to the cent (half up).
      params: []
    prerequisite:
      - problem: wallet_ext_renewal_plan_fee
        kind: value_input
        gate: ledger_now
        form: state
        policy_source: >-
          A transfer of the whole available balance is not sized until the account carries a plan fee entry for every billing period whose renewal date has arrived.
        condition: >-
          For a paid plan (monthly or annual billing) whose plan_renewal_date is on or before the handling date, wallet_transactions holds a wallet_fee row of fee_type plan_fee for the billing period starting on that date and plan_renewal_date has moved past the handling date.
        resolved_by: charge_plan_fee_0f985a0a
        effect: >-
          The plan fee entry takes its amount off ledger_balance, so the ledger balance the available transfer amount starts from (binding ledger_now) falls by the fee booked.
    cross_category:
      - category: advance
        as: branch
        reads: [status, outstanding_balance, advance_ledger.due_date]
        note: The advance repayment reserve is decided from the line's status, its outstanding balance and the due date of its latest disbursement.
      - category: business
        as: history
        reads: [business_balance, business_transactions.event_type]
        note: The business shortfall reserve is decided from the business balance and the count of sales booked on the profile in the last month.
    compute:
      - ledger_now: "F('ledger_balance')"
      - adv_status: "CFIELD('advance', 'status')"
      - adv_outstanding: "float(CFIELD('advance', 'outstanding_balance') or 0)"
      - adv_due: "XLATEST('advance', 'advance_ledger', 'due_date', date_field='entry_date', event_type='advance_disbursement')"
      - adv_days_to_due: "DAYS(NOW, adv_due) if adv_due else 999"
      - advance_reserve: "RND(adv_outstanding * K('adv_near_pct') / 100, 2) if (adv_status == 'active' and adv_days_to_due >= 0 and adv_days_to_due <= K('adv_near_days')) else (RND(adv_outstanding * K('adv_mid_pct') / 100, 2) if (adv_status == 'active' and adv_days_to_due > K('adv_near_days') and adv_days_to_due <= K('adv_mid_days')) else 0)"
      - gs_2m: "SUM('wallet_transactions', 'amount', within_months=2, date_field='txn_date', event_type='wallet_payment_received', payment_type='goods_and_services')"
      - gs_latest: "float(LATEST('wallet_transactions', 'amount', date_field='txn_date', event_type='wallet_payment_received', payment_type='goods_and_services') or 0)"
      - gs_all_count: "COUNT('wallet_transactions', event_type='wallet_payment_received', payment_type='goods_and_services')"
      - gs_3m_count: "COUNT('wallet_transactions', within_months=3, date_field='txn_date', event_type='wallet_payment_received', payment_type='goods_and_services')"
      - sales_hold: "gs_2m if (gs_all_count > 0 and gs_all_count == gs_3m_count) else (gs_latest if gs_all_count > gs_3m_count else 0)"
      - age_days: "DAYS(F('opened_date'), NOW)"
      - topup_1m: "SUM('wallet_transactions', 'amount', within_months=1, date_field='txn_date', event_type='wallet_topup', funding_source='linked_bank', source_txn_id='')"
      - topup_hold: "RND(topup_1m * K('topup_new_pct') / 100, 2) if age_days < K('topup_new_days') else (RND(topup_1m * K('topup_mid_pct') / 100, 2) if age_days < K('topup_mid_days') else 0)"
      - biz_balance: "float(CFIELD('business', 'business_balance') or 0)"
      - biz_sales_1m: "XCOUNT('business', 'business_transactions', within_months=1, date_field='txn_date', event_type='business_sale')"
      - business_reserve: "RND(-biz_balance * K('biz_idle_pct') / 100, 2) if (biz_balance < 0 and biz_sales_1m == 0) else (RND(-biz_balance * K('biz_active_pct') / 100, 2) if (biz_balance < 0 and biz_sales_1m > 0) else 0)"
      - total_kept_back: "advance_reserve + sales_hold + topup_hold + business_reserve"
      - result: "RND(MX(0, ledger_now - total_kept_back), 2)"
    compute_basis:
      ledger_now: "The available transfer amount is the account's ledger balance at the moment of the transfer"
      adv_status: "for a line in active status"
      adv_outstanding: "adv_near_pct percent of the line's outstanding balance is kept back"
      adv_due: "The advance repayment reserve on the available transfer amount reads the customer's Pocketwire Advance line and the due date of its most recent advance disbursement"
      adv_days_to_due: "whose due date is from 0 to adv_near_days calendar days after the handling date"
      advance_reserve: "for a line in active status whose due date is from 0 to adv_near_days calendar days after the handling date, adv_near_pct percent of the line's outstanding balance is kept back; for an active line whose due date is more than adv_near_days and at most adv_mid_days calendar days away, adv_mid_pct percent is kept back; otherwise nothing is kept back."
      gs_2m: "the goods-and-services payments dated in the last two months are held in full"
      gs_latest: "only the single most recent goods-and-services payment it received is held"
      gs_all_count: "The sales receipt hold on the available transfer amount reads the goods-and-services payments received into the account"
      gs_3m_count: "when every such payment the account ever received is dated in the last three months (a new seller)"
      sales_hold: "when every such payment the account ever received is dated in the last three months (a new seller), the goods-and-services payments dated in the last two months are held in full; when the account received such a payment before the last three months (an established seller), only the single most recent goods-and-services payment it received is held; when the account never received one, nothing is held; a payment counts inside a window of N months when it is dated later than the same calendar day N months before the handling date."
      age_days: "the account's age in calendar days from its opened date"
      topup_1m: "The bank top-up hold on the available transfer amount reads the customer-requested top-ups from a linked bank dated in the last month (automatic funding pulls behind a payment are not top-ups the customer requested)"
      topup_hold: "for an account younger than topup_new_days days, topup_new_pct percent of those top-ups is held; for an account at least topup_new_days but younger than topup_mid_days days, topup_mid_pct percent is held; for an older account nothing is held; the held amount is rounded to the cent (half up)."
      biz_balance: "The business shortfall reserve on the available transfer amount reads the customer's Pocketwire Business Profile"
      biz_sales_1m: "no business sale was booked on it in the last month"
      business_reserve: "when its business balance is below zero and no business sale was booked on it in the last month, biz_idle_pct percent of the shortfall is kept back; when its balance is below zero and at least one sale was booked in the last month, biz_active_pct percent of the shortfall is kept back; otherwise nothing is kept back; the reserve is rounded to the cent (half up)."
      total_kept_back: "they are added together and taken off the ledger balance once"
      result: "the result never falling below 0.00."
    factors:
      - id: advance_repayment_reserve
        effect: parameter
        decides: advance_reserve
        bindings: [adv_status, adv_outstanding, adv_due, adv_days_to_due, advance_reserve]
        ladder:
          - when: "Advance line active AND latest disbursement due within 0 to adv_near_days days"
            value: "K('adv_near_pct') percent of the outstanding balance"
          - when: "Advance line active AND latest disbursement due in more than adv_near_days and at most adv_mid_days days"
            value: "K('adv_mid_pct') percent of the outstanding balance"
          - when: "otherwise"
            value: "0"
        baseline:
          advance_reserve: "0"
        evidence: [cross_category, date]
        cross_difficulty: advance
      - id: sales_receipt_hold
        effect: method
        decides: sales_hold
        bindings: [gs_2m, gs_latest, gs_all_count, gs_3m_count, sales_hold]
        ladder:
          - when: "every goods-and-services payment ever received dated in the last three months (new seller)"
            method: "hold the total of the goods-and-services receipts of the last two months"
          - when: "a goods-and-services payment received before the last three months (established seller)"
            method: "hold only the single most recent goods-and-services receipt"
          - when: "otherwise"
            method: "hold nothing"
        baseline:
          sales_hold: "0"
        evidence: [history]
        cross_difficulty: null
      - id: bank_topup_hold
        effect: parameter
        decides: topup_hold
        bindings: [age_days, topup_1m, topup_hold]
        ladder:
          - when: "account younger than topup_new_days days"
            value: "K('topup_new_pct') percent of the last month's requested bank top-ups"
          - when: "account at least topup_new_days but younger than topup_mid_days days"
            value: "K('topup_mid_pct') percent of the last month's requested bank top-ups"
          - when: "otherwise"
            value: "0"
        baseline:
          topup_hold: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: business_shortfall_reserve
        effect: parameter
        decides: business_reserve
        bindings: [biz_balance, biz_sales_1m, business_reserve]
        ladder:
          - when: "business balance below zero AND no business sale in the last month"
            value: "K('biz_idle_pct') percent of the shortfall"
          - when: "business balance below zero AND at least one business sale in the last month"
            value: "K('biz_active_pct') percent of the shortfall"
          - when: "otherwise"
            value: "0"
        baseline:
          business_reserve: "0"
        evidence: [cross_category, history]
        cross_difficulty: business
    inputs:
      history:
        - {table: wallet_transactions, aggregate: sum, field: amount, within_months: 2, filters: {event_type: wallet_payment_received, payment_type: goods_and_services}}
        - {table: wallet_transactions, aggregate: count, field: txn_id, within_months: 3, filters: {event_type: wallet_payment_received, payment_type: goods_and_services}}
        - {table: wallet_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: wallet_topup, funding_source: linked_bank, source_txn_id: ""}}
        - {category: advance, table: advance_ledger, aggregate: latest, field: due_date, filters: {event_type: advance_disbursement}}
        - {category: business, table: business_transactions, aggregate: count, field: business_txn_id, within_months: 1, filters: {event_type: business_sale}}
      cross_category: [advance, business]

  - id: wallet_ext_protection_reimbursement
    base_policy_refs: [wallet_unauthorized_claims, wallet_purchase_protection]
    overwrite:
      - base_policy: wallet_purchase_protection
        superseded_clause: >-
          Purchase protection claims carry no customer liability and no provisional credit; the claims team records approved or denied, and an approval reimburses the lower of the claim amount and purchase_protection_max_amount as a wallet_claim_reimbursement, together with the refund of any credit card funding fee charged on that payment.
        replaced_by: >-
          Purchase protection claims carry no customer liability and no provisional credit; the claims team records approved or denied, and an approval is paid as one reimbursement entry pointing to the disputed payment, whose amount is the protection reimbursement and which already includes any credit card funding fee part, so no separate fee refund is booked for that payment.
    trigger: state_due
    subject: [wallet_claim_reimbursement]
    computes: amount
    target_tool: post_protection_reimbursement_5be5cf5a
    params:
      rw_top_multiplier: 2.0
      rw_mid_multiplier: 1.5
      share_two_or_more: 80
      share_one: 90
      lookback_long_age: 730
      lookback_mid_age: 365
      delay_long_days: 30
      delay_interest_pct: 18
      delay_mid_days: 15
      delay_mid_pct: 1
    rule: >-
      Purchase protection claims carry no customer liability and no provisional credit; the claims team records approved or denied, and an approval is paid as one reimbursement entry pointing to the disputed payment, whose amount is the protection reimbursement and which already includes any credit card funding fee part, so no separate fee refund is booked for that payment.
      The claim paid is the purchase protection claim most recently approved on the account, and it is paid once: a claim whose disputed payment already carries a reimbursement entry is not paid again.
      The protection reimbursement is the covered amount capped at the protection ceiling, which is the plan's purchase_protection_max_amount, never below 0.00 and rounded to the cent (half up) once, at the end.
      The covered amount is the claim amount as filed, plus the credit card funding fee booked on the disputed payment in the same proportion as the claim amount bears to the payment amount (rounded to the cent, half up; nothing when no such fee was booked), less the money the customer received from the seller's username, personal payments counting in full and goods-and-services payments counting net of the goods_services_fee_rate_pct seller fee the customer paid on them (rounded to the cent, half up).
      Where they apply, the repeat-claim coverage share and the claim-review delay credit act before the ceiling: the covered amount is first multiplied by the coverage share, the claim-review delay credit is then added to that result, and only this figure is compared with the protection ceiling raised by the rewards protection multiplier.
      The repeat-claim coverage share of the protection reimbursement reads the purchase protection claims the customer filed within the claim look-back window, other than the claim being paid: with two or more such claims the share is share_two_or_more percent, with exactly one it is share_one percent, and with none it is 100 percent.
      The claim look-back window of the protection reimbursement depends on the account's age in calendar days from its opened date: for an account at least lookback_long_age days old it covers the last six months, for an account at least lookback_mid_age but under lookback_long_age days old it covers the last nine months, and for a younger account it covers the last twelve months; a claim falls inside a window of N months when its report date is later than the same calendar day N months before the handling date.
      The claim-review delay credit of the protection reimbursement reads the calendar days from the paid claim's report date to its approval date and is worked out on the covered amount after the coverage share: at delay_long_days days or more it is simple interest at delay_interest_pct percent a year for every one of those days, counted on an actual/365 basis; at delay_mid_days days or more but fewer than delay_long_days it is a flat delay_mid_pct percent of that amount; below delay_mid_days there is no credit.
      The rewards protection multiplier on the protection ceiling reads the customer's Pocketwire Rewards membership: rw_top_multiplier for an active membership on the Pocketwire Rewards Diamond or Pocketwire Rewards Obsidian tier, rw_mid_multiplier for an active membership on the Pocketwire Rewards Gold or Pocketwire Rewards Platinum tier, and 1 for any other membership or none.
      The protection window, the one-claim-per-payment exclusion and the approval by the claims team still govern the claim.
    baseline:
      rule: >-
        Purchase protection claims carry no customer liability and no provisional credit; the claims team records approved or denied, and an approval is paid as one reimbursement entry pointing to the disputed payment, whose amount is the protection reimbursement and which already includes any credit card funding fee part, so no separate fee refund is booked for that payment.
        The claim paid is the purchase protection claim most recently approved on the account, and it is paid once: a claim whose disputed payment already carries a reimbursement entry is not paid again.
        The protection reimbursement is the covered amount capped at the protection ceiling, which is the plan's purchase_protection_max_amount, never below 0.00 and rounded to the cent (half up) once, at the end.
