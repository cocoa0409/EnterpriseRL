          - when: "otherwise"
            value: "a twelve-month look-back"
        baseline:
          prior_claims: "prior_12m"
        evidence: [date]
        cross_difficulty: null
      - id: repeat_claim_share
        effect: parameter
        decides: coverage_share
        bindings: [prior_6m, prior_9m, prior_12m, coverage_share]
        ladder:
          - when: "two or more other purchase protection claims inside the look-back window"
            value: "K('share_two_or_more')"
          - when: "exactly one other purchase protection claim inside the look-back window"
            value: "K('share_one')"
          - when: "otherwise"
            value: "100"
        baseline:
          coverage_share: "100"
        evidence: [history]
        cross_difficulty: null
      - id: claim_review_delay_credit
        effect: method
        decides: delay_credit
        bindings: [pp_reported, pp_approved, review_days, delay_credit]
        ladder:
          - when: "claim approved delay_long_days or more days after it was reported"
            method: "simple interest at delay_interest_pct percent a year on the amount after the coverage share, for every review day, actual/365"
          - when: "claim approved delay_mid_days or more but fewer than delay_long_days days after it was reported"
            method: "a flat delay_mid_pct percent of the amount after the coverage share"
          - when: "otherwise"
            method: "no delay credit"
        baseline:
          delay_credit: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: rewards_protection_multiplier
        effect: parameter
        decides: ceiling_multiplier
        bindings: [rw_status, rw_tier, ceiling_multiplier]
        ladder:
          - when: "Pocketwire Rewards membership active AND on the Diamond or Obsidian tier"
            value: "K('rw_top_multiplier')"
          - when: "Pocketwire Rewards membership active AND on the Gold or Platinum tier"
            value: "K('rw_mid_multiplier')"
          - when: "otherwise"
            value: "1"
        baseline:
          ceiling_multiplier: "1"
        evidence: [cross_category]
        cross_difficulty: rewards
    inputs:
      history:
        - {table: wallet_claims, aggregate: latest, field: claim_amount, filters: {event_type: wallet_claim_resolved, claim_type: purchase_protection, resolution: approved}}
        - {table: wallet_transactions, aggregate: sum, field: amount, filters: {event_type: wallet_fee, fee_type: credit_card_funding_fee}}
        - {table: wallet_transactions, aggregate: sum, field: amount, filters: {event_type: wallet_payment_received}}
        - {table: wallet_claims, aggregate: count, field: wallet_claim_id, within_months: 12, filters: {event_type: wallet_claim_filed, claim_type: purchase_protection}}
      cross_category: [rewards]

  - id: wallet_ext_claim_money_instant_fee
    base_policy_refs: [wallet_instant_transfer_fee, wallet_cash_out_rules, wallet_plan_fee, wallet_funding_fees, wallet_evt_receiving]
    overwrite:
      - base_policy: wallet_instant_transfer_fee
        superseded_clause: >-
          The fee is 0.00 when the transfer falls inside the monthly free quota, which is free_instant_transfers_per_month increased by card_holder_bonus_free_instant when the customer holds a Pocketwire debit card whose status is active or locked on the transfer date; the transfer falls inside the quota when wallet_msr_instant_count_month is lower than that quota.
        replaced_by: >-
          The instant transfer fee is 0.00 when the transfer falls inside the free quota, which is free_instant_transfers_per_month increased by card_holder_bonus_free_instant when the customer holds a Pocketwire debit card in active or locked status; the transfer falls inside the quota when the instant cash-outs dated in the last month, less those returned in that month (a return carries the speed of the transfer it returns), are fewer than that quota, a transfer counting in the last month when it is dated later than the same calendar day one month before the handling date.
      - base_policy: wallet_instant_transfer_fee
        superseded_clause: >-
          Outside the quota, the fee rate is dd_instant_fee_rate_pct when the direct deposits posted in the previous calendar month (wallet_msr_dd_prev_month) are at or above dd_benefit_threshold, and instant_transfer_fee_rate_pct otherwise; the two rates never combine, and the free quota always takes precedence over either rate.
        replaced_by: >-
          The deposit rate tier of the instant fee rate reads the direct deposit measure and the count of direct deposits dated in the last month: when the measure reaches dd_top_level and dd_top_count or more deposits are dated in the last month, the tier is dd_instant_fee_rate_pct less dd_top_cut; when the measure reaches the plan's dd_benefit_threshold without meeting both of those conditions, it is dd_instant_fee_rate_pct; otherwise it is instant_transfer_fee_rate_pct.
      - base_policy: wallet_instant_transfer_fee
        superseded_clause: >-
          The fee is the transfer amount times the applicable rate, rounded to the cent (half up), then raised to instant_transfer_fee_min when lower and lowered to instant_transfer_fee_max when higher.
        replaced_by: >-
          Outside the quota, the instant transfer fee is the transfer amount times the instant fee rate, which is instant_transfer_fee_rate_pct, raised to instant_transfer_fee_min when lower and lowered to instant_transfer_fee_max when higher, and rounded to the cent (half up) once, at the end.
    trigger: on_request
    subject: [wallet_cash_out, wallet_fee]
    computes: fee_amount
    target_tool: send_instant_cash_out_cd9063e1
    params:
      dd_avg3_age: 365
      dd_avg2_age: 180
      dd_top_level: 2000.00
      dd_top_count: 2
      dd_top_cut: 0.50
      card_tenure_days: 180
      card_cut_long: 0.25
      card_cut_new: 0.10
      bal_high: 5000.00
      bal_mid: 2500.00
      bal_min_age: 90
      bal_cut_high: 0.20
      bal_cut_mid: 0.10
      vault_high: 5000.00
      vault_mid: 1000.00
      saver_high_pct: 20
      saver_mid_pct: 10
      rate_floor_pct: 0.25
    rule: >-
      For a customer who asks to have the money reimbursed on a claim sent instantly to a linked debit card, the transfer amount is the most recent claim reimbursement credited to the account, sent as one instant cash-out whose instant transfer fee is booked as a separate fee entry pointing to it.
      An instant cash-out of claim money is priced only after the purchase protection claim most recently approved on the account carries its reimbursement entry.
      The instant transfer fee is 0.00 when the transfer falls inside the free quota, which is free_instant_transfers_per_month increased by card_holder_bonus_free_instant when the customer holds a Pocketwire debit card in active or locked status; the transfer falls inside the quota when the instant cash-outs dated in the last month, less those returned in that month (a return carries the speed of the transfer it returns), are fewer than that quota, a transfer counting in the last month when it is dated later than the same calendar day one month before the handling date.
      Outside the quota, the instant transfer fee is the transfer amount times the instant fee rate, which is instant_transfer_fee_rate_pct, raised to instant_transfer_fee_min when lower and lowered to instant_transfer_fee_max when higher, and rounded to the cent (half up) once, at the end.
      Whatever deposit rate tier applies, the instant fee rate is that tier less the card-tenure rate cut and less the balance rate cut (each cut being 0 where it does not apply), both cuts subtracted from the tier together and the rate never set below rate_floor_pct; the saver fee reduction, where it applies, is taken off the fee after the minimum and maximum have been applied and before the single rounding.
      The deposit rate tier of the instant fee rate reads the direct deposit measure and the count of direct deposits dated in the last month: when the measure reaches dd_top_level and dd_top_count or more deposits are dated in the last month, the tier is dd_instant_fee_rate_pct less dd_top_cut; when the measure reaches the plan's dd_benefit_threshold without meeting both of those conditions, it is dd_instant_fee_rate_pct; otherwise it is instant_transfer_fee_rate_pct.
      The direct deposit measure of the instant fee rate depends on the account's age in calendar days from its opened date: for an account at least dd_avg3_age days old it is the middle value of the last three monthly totals (the last month, the month before it and the month before that, so that one unusual month neither lifts nor sinks it); for an account at least dd_avg2_age but under dd_avg3_age days old it is the lower of the last two monthly totals; for a younger account it is the total of the direct deposits dated in the last month; the monthly total N months back is the deposits dated inside the window of N months less those dated inside the window of N - 1 months; a deposit counts inside a window of N months when it is dated later than the same calendar day N months before the handling date.
      The card-tenure rate cut of the instant fee rate reads the customer's Pocketwire debit card: for a card in active or locked status activated at least card_tenure_days calendar days before the handling date the cut is card_cut_long percentage points; for a card in active or locked status activated more recently it is card_cut_new percentage points; with no such card it is 0.
      The balance rate cut of the instant fee rate reads the ledger balance before the transfer and the account's age: for an account at least bal_min_age days old holding bal_high or more the cut is bal_cut_high percentage points; for an account at least bal_min_age days old holding bal_mid or more but less than bal_high it is bal_cut_mid percentage points; otherwise it is 0.
      The saver fee reduction of the instant transfer fee reads the balance of the customer's active Pocketwire Savings Vault (a vault that is time_locked, frozen or closed does not count): at vault_high or more it is saver_high_pct percent, at vault_mid or more but below vault_high it is saver_mid_pct percent, and below vault_mid or with no active vault it is 0 percent.
      The cash-out rules still apply: the account must be active or closure_pending, the instant cash-out may not exceed instant_transfer_max_per_transfer, the day's cash-outs may not exceed daily_cash_out_limit, and the transfer and its fee may not exceed the ledger balance.
    baseline:
      rule: >-
        For a customer who asks to have the money reimbursed on a claim sent instantly to a linked debit card, the transfer amount is the most recent claim reimbursement credited to the account, sent as one instant cash-out whose instant transfer fee is booked as a separate fee entry pointing to it.
        The instant transfer fee is 0.00 when the transfer falls inside the free quota, which is free_instant_transfers_per_month increased by card_holder_bonus_free_instant when the customer holds a Pocketwire debit card in active or locked status; the transfer falls inside the quota when the instant cash-outs dated in the last month, less those returned in that month (a return carries the speed of the transfer it returns), are fewer than that quota, a transfer counting in the last month when it is dated later than the same calendar day one month before the handling date.
        Outside the quota, the instant transfer fee is the transfer amount times the instant fee rate, which is instant_transfer_fee_rate_pct, raised to instant_transfer_fee_min when lower and lowered to instant_transfer_fee_max when higher, and rounded to the cent (half up) once, at the end.
      params: [instant_transfer_fee_rate_pct, instant_transfer_fee_min, instant_transfer_fee_max, free_instant_transfers_per_month, card_holder_bonus_free_instant]
    prerequisite:
      - problem: wallet_ext_protection_reimbursement
        kind: value_input
        gate: reimb_amt
        form: state
        policy_source: >-
          An instant cash-out of claim money is priced only after the purchase protection claim most recently approved on the account carries its reimbursement entry.
        condition: >-
          The latest wallet_claims row (by resolution_date) with event_type wallet_claim_resolved, claim_type purchase_protection and resolution approved has a wallet_transactions row of event_type wallet_claim_reimbursement whose source_txn_id is that claim's txn_id.
        resolved_by: post_protection_reimbursement_5be5cf5a
        effect: >-
          The reimbursement entry becomes the most recent claim reimbursement, so the transfer amount the fee is computed on (binding reimb_amt) becomes the reimbursement paid, and the ledger balance read by the balance rate cut rises by the same amount.
    cross_category:
      - category: card
        as: branch
        reads: [status, activated_date]
        note: The card-tenure rate cut is decided from the debit card's status and activation date; the card status also sets the card-holder quota bonus.
      - category: savings
        as: branch
        reads: [vault_balance]
        note: The saver fee reduction is decided from the balance of the customer's active savings vault.
    compute:
      - reimb_amt: "float(LATEST('wallet_transactions', 'amount', date_field='txn_date', event_type='wallet_claim_reimbursement') or 0)"
      - card_state: "CFIELD('card', 'status')"
      - quota: "P('free_instant_transfers_per_month') + (P('card_holder_bonus_free_instant') if (card_state == 'active' or card_state == 'locked') else 0)"
      - instant_used: "COUNT('wallet_transactions', within_months=1, date_field='txn_date', event_type='wallet_cash_out', transfer_speed='instant') - COUNT('wallet_transactions', within_months=1, date_field='txn_date', event_type='wallet_cash_out_return', transfer_speed='instant')"
      - acct_age: "DAYS(F('opened_date'), NOW)"
      - dd_1m: "SUM('wallet_transactions', 'amount', within_months=1, date_field='txn_date', event_type='wallet_direct_deposit')"
      - dd_2m_total: "SUM('wallet_transactions', 'amount', within_months=2, date_field='txn_date', event_type='wallet_direct_deposit')"
      - dd_3m_total: "SUM('wallet_transactions', 'amount', within_months=3, date_field='txn_date', event_type='wallet_direct_deposit')"
      - dd_month2: "dd_2m_total - dd_1m"
      - dd_month3: "dd_3m_total - dd_2m_total"
      - dd_median3: "dd_1m + dd_month2 + dd_month3 - MX(dd_1m, dd_month2, dd_month3) - MN(dd_1m, dd_month2, dd_month3)"
      - dd_lower2: "MN(dd_1m, dd_month2)"
      - dd_measure: "dd_median3 if acct_age >= K('dd_avg3_age') else (dd_lower2 if acct_age >= K('dd_avg2_age') else dd_1m)"
      - dd_1m_count: "COUNT('wallet_transactions', within_months=1, date_field='txn_date', event_type='wallet_direct_deposit')"
      - deposit_rate: "(P('dd_instant_fee_rate_pct') - K('dd_top_cut')) if (dd_measure >= K('dd_top_level') and dd_1m_count >= K('dd_top_count')) else (P('dd_instant_fee_rate_pct') if (dd_measure >= P('dd_benefit_threshold') and (dd_measure < K('dd_top_level') or dd_1m_count < K('dd_top_count'))) else P('instant_transfer_fee_rate_pct'))"
      - card_age: "DAYS(CFIELD('card', 'activated_date'), NOW) if CFIELD('card', 'activated_date') else 0"
      - card_cut: "K('card_cut_long') if ((card_state == 'active' or card_state == 'locked') and card_age >= K('card_tenure_days')) else (K('card_cut_new') if ((card_state == 'active' or card_state == 'locked') and card_age < K('card_tenure_days')) else 0)"
      - bal_now: "F('ledger_balance')"
      - bal_age: "DAYS(F('opened_date'), NOW)"
      - balance_cut: "K('bal_cut_high') if (bal_now >= K('bal_high') and bal_age >= K('bal_min_age')) else (K('bal_cut_mid') if (bal_now >= K('bal_mid') and bal_now < K('bal_high') and bal_age >= K('bal_min_age')) else 0)"
      - fee_rate: "MX(K('rate_floor_pct'), deposit_rate - card_cut - balance_cut)"
      - vault_total: "float(CFIELD('savings', 'vault_balance', status='active') or 0)"
      - saver_pct: "K('saver_high_pct') if vault_total >= K('vault_high') else (K('saver_mid_pct') if vault_total >= K('vault_mid') else 0)"
      - clamped_fee: "MN(MX(reimb_amt * fee_rate / 100, P('instant_transfer_fee_min')), P('instant_transfer_fee_max'))"
      - result: "0 if instant_used < quota else RND(clamped_fee * (1 - saver_pct / 100), 2)"
    compute_basis:
      reimb_amt: "the transfer amount is the most recent claim reimbursement credited to the account"
      card_state: "when the customer holds a Pocketwire debit card in active or locked status"
      quota: "which is free_instant_transfers_per_month increased by card_holder_bonus_free_instant when the customer holds a Pocketwire debit card in active or locked status"
      instant_used: "the transfer falls inside the quota when the instant cash-outs dated in the last month, less those returned in that month (a return carries the speed of the transfer it returns), are fewer than that quota, a transfer counting in the last month when it is dated later than the same calendar day one month before the handling date."
      acct_age: "The direct deposit measure of the instant fee rate depends on the account's age in calendar days from its opened date"
      dd_1m: "for a younger account it is the total of the direct deposits dated in the last month"
      dd_2m_total: "the deposits dated inside the window of N months"
      dd_3m_total: "the deposits dated inside the window of N months"
      dd_month2: "the monthly total N months back is the deposits dated inside the window of N months less those dated inside the window of N - 1 months"
      dd_month3: "the monthly total N months back is the deposits dated inside the window of N months less those dated inside the window of N - 1 months"
      dd_median3: "it is the middle value of the last three monthly totals"
      dd_lower2: "it is the lower of the last two monthly totals"
      dd_measure: "for an account at least dd_avg3_age days old it is the middle value of the last three monthly totals (the last month, the month before it and the month before that, so that one unusual month neither lifts nor sinks it); for an account at least dd_avg2_age but under dd_avg3_age days old it is the lower of the last two monthly totals; for a younger account it is the total of the direct deposits dated in the last month; the monthly total N months back is the deposits dated inside the window of N months less those dated inside the window of N - 1 months; a deposit counts inside a window of N months when it is dated later than the same calendar day N months before the handling date."
      dd_1m_count: "the count of direct deposits dated in the last month"
      deposit_rate: "when the measure reaches dd_top_level and dd_top_count or more deposits are dated in the last month, the tier is dd_instant_fee_rate_pct less dd_top_cut; when the measure reaches the plan's dd_benefit_threshold without meeting both of those conditions, it is dd_instant_fee_rate_pct; otherwise it is instant_transfer_fee_rate_pct."
      card_age: "activated at least card_tenure_days calendar days before the handling date"
      card_cut: "for a card in active or locked status activated at least card_tenure_days calendar days before the handling date the cut is card_cut_long percentage points; for a card in active or locked status activated more recently it is card_cut_new percentage points; with no such card it is 0."
      bal_now: "The balance rate cut of the instant fee rate reads the ledger balance before the transfer"
      bal_age: "and the account's age"
      balance_cut: "for an account at least bal_min_age days old holding bal_high or more the cut is bal_cut_high percentage points; for an account at least bal_min_age days old holding bal_mid or more but less than bal_high it is bal_cut_mid percentage points; otherwise it is 0."
      fee_rate: "the instant fee rate is that tier less the card-tenure rate cut and less the balance rate cut (each cut being 0 where it does not apply), both cuts subtracted from the tier together and the rate never set below rate_floor_pct"
      vault_total: "The saver fee reduction of the instant transfer fee reads the balance of the customer's active Pocketwire Savings Vault"
      saver_pct: "at vault_high or more it is saver_high_pct percent, at vault_mid or more but below vault_high it is saver_mid_pct percent, and below vault_mid or with no active vault it is 0 percent."
      clamped_fee: "the instant transfer fee is the transfer amount times the instant fee rate, which is instant_transfer_fee_rate_pct, raised to instant_transfer_fee_min when lower and lowered to instant_transfer_fee_max when higher"
      result: "the saver fee reduction, where it applies, is taken off the fee after the minimum and maximum have been applied and before the single rounding."
    factors:
      - id: deposit_rate_tier
        effect: parameter
        decides: deposit_rate
        bindings: [dd_1m_count, deposit_rate]
        ladder:
          - when: "direct deposit measure at dd_top_level or more AND dd_top_count or more deposits in the last month"
            value: "P('dd_instant_fee_rate_pct') - K('dd_top_cut')"
          - when: "direct deposit measure at dd_benefit_threshold or more AND not meeting both conditions of the tier above"
            value: "P('dd_instant_fee_rate_pct')"
          - when: "otherwise"
            value: "P('instant_transfer_fee_rate_pct')"
        baseline:
          deposit_rate: "P('instant_transfer_fee_rate_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: deposit_measure_window
        effect: method
        decides: dd_measure
        bindings: [acct_age, dd_1m, dd_2m_total, dd_3m_total, dd_month2, dd_month3, dd_median3, dd_lower2, dd_measure]
        ladder:
          - when: "account at least dd_avg3_age days old"
            method: "the middle value of the last three monthly deposit totals"
          - when: "account at least dd_avg2_age but under dd_avg3_age days old"
            method: "the lower of the last two monthly deposit totals"
          - when: "otherwise"
            method: "total of the direct deposits of the last month"
        baseline:
          dd_measure: "dd_1m"
        evidence: [date, history]
        cross_difficulty: null
      - id: card_tenure_cut
        effect: parameter
        decides: card_cut
        bindings: [card_state, card_age, card_cut]
        ladder:
          - when: "debit card active or locked AND activated at least card_tenure_days days ago"
            value: "K('card_cut_long')"
          - when: "debit card active or locked AND activated fewer than card_tenure_days days ago"
            value: "K('card_cut_new')"
          - when: "otherwise"
            value: "0"
        baseline:
          card_cut: "0"
        evidence: [cross_category, date]
        cross_difficulty: card
      - id: balance_rate_cut
        effect: parameter
        decides: balance_cut
        bindings: [bal_now, bal_age, balance_cut]
        ladder:
          - when: "ledger balance at bal_high or more AND account at least bal_min_age days old"
            value: "K('bal_cut_high')"
          - when: "ledger balance at bal_mid or more but below bal_high AND account at least bal_min_age days old"
            value: "K('bal_cut_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          balance_cut: "0"
        evidence: [date]
        cross_difficulty: null
      - id: saver_fee_reduction
        effect: parameter
        decides: saver_pct
        bindings: [vault_total, saver_pct]
        ladder:
          - when: "active savings vault balance at vault_high or more"
            value: "K('saver_high_pct')"
          - when: "active savings vault balance at vault_mid or more but below vault_high"
            value: "K('saver_mid_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          saver_pct: "0"
        evidence: [cross_category]
        cross_difficulty: savings
    inputs:
      history:
        - {table: wallet_transactions, aggregate: latest, field: amount, filters: {event_type: wallet_claim_reimbursement}}
        - {table: wallet_transactions, aggregate: count, field: txn_id, within_months: 1, filters: {event_type: wallet_cash_out, transfer_speed: instant}}
        - {table: wallet_transactions, aggregate: sum, field: amount, within_months: 3, filters: {event_type: wallet_direct_deposit}}
        - {table: wallet_transactions, aggregate: count, field: txn_id, within_months: 1, filters: {event_type: wallet_direct_deposit}}
      cross_category: [card, savings]
