      params: [purchase_protection_max_amount, goods_services_fee_rate_pct]
    prerequisite: []
    cross_category:
      - category: rewards
        as: branch
        reads: [status, variant_name]
        note: The rewards protection multiplier is decided from the membership's status and tier.
    compute:
      - pp_txn: "LATEST('wallet_claims', 'txn_id', date_field='resolution_date', event_type='wallet_claim_resolved', claim_type='purchase_protection', resolution='approved')"
      - claim_amt: "float(LATEST('wallet_claims', 'claim_amount', date_field='resolution_date', event_type='wallet_claim_resolved', claim_type='purchase_protection', resolution='approved') or 0)"
      - pay_amt: "float(LATEST('wallet_transactions', 'amount', date_field='txn_date', txn_id=pp_txn) or 0)"
      - cc_fee: "SUM('wallet_transactions', 'amount', event_type='wallet_fee', fee_type='credit_card_funding_fee', source_txn_id=pp_txn)"
      - funding_fee_part: "RND(cc_fee * claim_amt / pay_amt, 2) if pay_amt > 0 else 0"
      - seller: "LATEST('wallet_transactions', 'counterparty', date_field='txn_date', txn_id=pp_txn)"
      - back_personal: "SUM('wallet_transactions', 'amount', event_type='wallet_payment_received', payment_type='personal', counterparty=seller)"
      - back_gs: "SUM('wallet_transactions', 'amount', event_type='wallet_payment_received', payment_type='goods_and_services', counterparty=seller)"
      - seller_deduction: "back_personal + RND(back_gs * (1 - P('goods_services_fee_rate_pct') / 100), 2)"
      - covered: "claim_amt + funding_fee_part - seller_deduction"
      - acct_age: "DAYS(F('opened_date'), NOW)"
      - prior_6m: "COUNT('wallet_claims', within_months=6, date_field='reported_date', event_type='wallet_claim_filed', claim_type='purchase_protection') - COUNT('wallet_claims', within_months=6, date_field='reported_date', event_type='wallet_claim_filed', claim_type='purchase_protection', txn_id=pp_txn)"
      - prior_9m: "COUNT('wallet_claims', within_months=9, date_field='reported_date', event_type='wallet_claim_filed', claim_type='purchase_protection') - COUNT('wallet_claims', within_months=9, date_field='reported_date', event_type='wallet_claim_filed', claim_type='purchase_protection', txn_id=pp_txn)"
      - prior_12m: "COUNT('wallet_claims', within_months=12, date_field='reported_date', event_type='wallet_claim_filed', claim_type='purchase_protection') - COUNT('wallet_claims', within_months=12, date_field='reported_date', event_type='wallet_claim_filed', claim_type='purchase_protection', txn_id=pp_txn)"
      - prior_claims: "prior_6m if acct_age >= K('lookback_long_age') else (prior_9m if acct_age >= K('lookback_mid_age') else prior_12m)"
      - coverage_share: "K('share_two_or_more') if prior_claims >= 2 else (K('share_one') if prior_claims == 1 else 100)"
      - pp_reported: "LATEST('wallet_claims', 'reported_date', date_field='resolution_date', event_type='wallet_claim_resolved', claim_type='purchase_protection', resolution='approved')"
      - pp_approved: "LATEST('wallet_claims', 'resolution_date', date_field='resolution_date', event_type='wallet_claim_resolved', claim_type='purchase_protection', resolution='approved')"
      - review_days: "DAYS(pp_reported, pp_approved) if pp_approved else 0"
      - shared_amount: "covered * coverage_share / 100"
      - delay_credit: "(shared_amount * K('delay_interest_pct') / 100 * review_days / 365) if review_days >= K('delay_long_days') else ((shared_amount * K('delay_mid_pct') / 100) if review_days >= K('delay_mid_days') else 0)"
      - rw_status: "CFIELD('rewards', 'status')"
      - rw_tier: "CFIELD('rewards', 'variant_name')"
      - ceiling_multiplier: "K('rw_top_multiplier') if (rw_status == 'active' and (rw_tier == 'Pocketwire Rewards Diamond' or rw_tier == 'Pocketwire Rewards Obsidian')) else (K('rw_mid_multiplier') if (rw_status == 'active' and (rw_tier == 'Pocketwire Rewards Gold' or rw_tier == 'Pocketwire Rewards Platinum')) else 1)"
      - ceiling: "P('purchase_protection_max_amount') * ceiling_multiplier"
      - result: "RND(MX(0, MN(shared_amount + delay_credit, ceiling)), 2)"
