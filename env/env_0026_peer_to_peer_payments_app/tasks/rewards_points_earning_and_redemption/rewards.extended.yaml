events:
  - type: rewards_enroll
    target: rewards_memberships
    mutation: create
    meaning: The customer joins Pocketwire Rewards.
    grain: One row per membership.
    fields:
      customer_id: The member.
      wallet_id: The personal account cash redemptions are paid into.
      variant_name: Always Pocketwire Rewards Member at enrolment.
      enrolled_date: Enrolment date; membership anniversaries count from it.
      points_balance: Opening points balance, always 0.
      tier_qualified_date: Date the current tier was assigned (the enrolment date at first).
      tier_review_date: First day of the next calendar quarter, when the first review runs.
      below_retention_quarters: Consecutive reviews below retention spend, 0 at enrolment.
    triggers: []
  - type: rewards_activate
    target: rewards_memberships
    mutation: {transition: {from: enrolled, to: active}}
    meaning: The membership becomes active when the first points are credited.
    grain: One row per membership.
    fields:
      status: Becomes active.
    triggers: []
  - type: rewards_suspend
    target: rewards_memberships
    mutation: {transition: {from: active, to: suspended}}
    meaning: The membership is suspended.
    grain: One row per membership.
    fields:
      status: Becomes suspended.
      suspension_reason: linked_account_restricted or rewards_abuse.
    triggers: []
  - type: rewards_reinstate
    target: rewards_memberships
    mutation: {transition: {from: suspended, to: active}}
    meaning: A suspended membership is reinstated.
    grain: One row per membership.
    fields:
      status: Returns to active.
    triggers: []
  - type: rewards_close
    target: rewards_memberships
    mutation: {transition: [{from: enrolled, to: closed}, {from: active, to: closed}, {from: suspended, to: closed}]}
    meaning: The membership is closed.
    grain: One row per membership.
    fields:
      status: Becomes closed.
      closed_date: Closure date.
    triggers:
      - event: rewards:rewards_points_expiry
        map: {expiry_reason: program_closed, entry_date: closed_date}
  - type: rewards_tier_change
    target: rewards_memberships
    mutation: update
    meaning: The quarterly tier review moves the membership up or down, or records another quarter below retention.
    grain: One row per membership.
    fields:
      variant_name: Tier after the review.
      tier_qualified_date: Date the current tier was assigned.
      tier_review_date: Date of the next review.
      below_retention_quarters: Consecutive reviews below retention spend after this review.
    triggers: []
  - type: rewards_cashback_earned
    target: rewards_ledger
    meaning: Points are earned on a settled Pocketwire card purchase (including points credited later for a purchase that was missed).
    grain: One row per card purchase earning points.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The card purchase that earned the points.
      spend_amount: The purchase amount.
      merchant_category: The purchase's merchant category.
      entry_date: Date the points were credited.
      points: Points earned.
    account: points
    direction: in
    triggers: []
  - type: rewards_boost_activated
    target: rewards_ledger
    meaning: The member activates a boost offer in the app.
    grain: One row per boost activation.
    distinguish_by: [offer_code, entry_date]
    fields:
      offer_code: The boost offer activated.
      entry_date: Activation date; validity counts from it.
      activated_at: Activation moment; the swap cooldown counts from the end of the previous boost.
    triggers: []
  - type: rewards_boost_earned
    target: rewards_ledger
    meaning: Boost points are earned on a card purchase at the offer's merchant.
    grain: One row per boosted purchase.
    distinguish_by: [source_txn_id, offer_code]
    fields:
      source_txn_id: The boosted card purchase.
      offer_code: The boost offer applied.
      spend_amount: The purchase amount.
      entry_date: Date the boost points were credited.
      points: Boost points.
    account: points
    direction: in
    triggers: []
  - type: rewards_clawback
    target: rewards_ledger
    meaning: Points earned on a purchase are taken back after the merchant refunds it.
    grain: One row per refunded purchase.
    distinguish_by: [source_txn_id, entry_date]
    fields:
      source_txn_id: The refunded card purchase.
      spend_amount: The refunded amount.
      entry_date: Date of the clawback.
      points: Points clawed back.
    account: points
    direction: out
    triggers: []
  - type: rewards_redemption
    target: rewards_ledger
    meaning: The member redeems points for cash to the personal balance, a digital gift card or a charity donation.
    grain: One row per redemption.
    distinguish_by: [redemption_reference]
    fields:
      redemption_reference: The redemption reference shown in the app.
      redemption_type: cash_to_balance, gift_card or charity.
      entry_date: Redemption date.
      points: Points redeemed.
      cash_value: USD value of the redemption.
      payee_name: Gift card brand or partner charity; empty on cash redemptions.
    account: points
    direction: out
    triggers:
      - event: wallet:wallet_internal_credit
        when: {redemption_type: cash_to_balance}
        map: {source_product: rewards, source_txn_id: rewards_entry_id, txn_date: entry_date, amount: cash_value}
  - type: rewards_gift_card_fulfilled
    target: rewards_ledger
    meaning: A gift card or charity redemption is fulfilled — the gift card code delivered or the donation sent.
    grain: One row per fulfilled redemption.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The redemption fulfilled.
      entry_date: Fulfilment date.
    triggers: []
  - type: rewards_redemption_reversal
    target: rewards_ledger
    meaning: A gift card or charity redemption is cancelled before fulfilment, or could not be fulfilled, and its points are returned.
    grain: One row per reversed redemption.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The redemption reversed.
      entry_date: Reversal date.
      points: Points returned, equal to the points redeemed.
    account: points
    direction: in
    triggers: []
  - type: rewards_points_expiry
    target: rewards_ledger
    meaning: The points balance expires after inactivity or is forfeited on closure.
    grain: One row per expiry.
    distinguish_by: [expiry_reason, entry_date]
    fields:
      expiry_reason: inactivity or program_closed.
      entry_date: Expiry date.
      points: Points removed, equal to the whole remaining positive balance.
    account: points
    direction: out
    triggers: []
  - type: rewards_referral_bonus
    target: rewards_ledger
    meaning: A referred new customer qualifies and the referring member earns the referral bonus.
    grain: One row per qualified referral.
    distinguish_by: [referred_username]
    fields:
      referred_username: Username of the referred customer.
      entry_date: Date credited.
      points: Bonus points.
    account: points
    direction: in
    triggers: []
  - type: rewards_bonus
    target: rewards_ledger
    meaning: A quarterly spend milestone or a membership anniversary bonus is credited.
    grain: One row per bonus per period.
    distinguish_by: [bonus_type, bonus_period]
    fields:
      bonus_type: quarterly_milestone or anniversary.
      bonus_period: The quarter (YYYY-Qn) or anniversary year (YYYY) the bonus is for.
      entry_date: Date credited.
      points: Bonus points.
    account: points
    direction: in
    triggers: []
  - type: rewards_goodwill_credit
    target: rewards_ledger
    meaning: Courtesy points are credited for a gift card or charity redemption fulfilled late.
    grain: One row per late redemption compensated.
    distinguish_by: [source_txn_id]
    fields:
      source_txn_id: The redemption that was fulfilled late.
      entry_date: Date credited.
      points: Courtesy points.
    account: points
    direction: in
    triggers: []

measures:
  - id: rewards_msr_points_month
    window: The calendar month containing the handling date.
    measure: Sum of points over rewards_cashback_earned rows of the membership with entry_date in the window.
  - id: rewards_msr_category_spend_quarter
    window: The calendar quarter containing the purchase date, up to and excluding the purchase being assessed.
    measure: Sum of spend_amount over rewards_cashback_earned rows of the membership whose merchant_category is grocery, dining, gas, travel, streaming or online_retail with entry_date in the window.
  - id: rewards_msr_prev_quarter_spend
    window: The calendar quarter before the quarter containing the handling date.
    measure: Sum of spend_amount over rewards_cashback_earned rows with entry_date in the window, less spend_amount over rewards_clawback rows with entry_date in the window.
  - id: rewards_msr_open_boosts
    window: Boost activations still valid on the handling date.
    measure: Count of rewards_boost_activated rows of the membership whose validity has not ended and whose uses (rewards_boost_earned rows with the same offer_code since the activation) are fewer than boost_uses_per_activation.
  - id: rewards_msr_redeemable_points
    window: Current state on the handling date.
    measure: points_balance less the points of rewards_cashback_earned, rewards_boost_earned, rewards_bonus and rewards_referral_bonus rows credited within the last points_pending_days calendar days.
  - id: rewards_msr_cash_redeemed_today
    window: The handling calendar day, Eastern Time.
    measure: Sum of points over rewards_redemption rows with redemption_type cash_to_balance and entry_date equal to the handling date.
  - id: rewards_msr_referrals_year
    window: The calendar year containing the handling date.
    measure: Count of rewards_referral_bonus rows of the membership with entry_date in the window.
  - id: rewards_msr_goodwill_365d
    window: Rolling 365 calendar days ending on the handling date.
    measure: Count of rewards_goodwill_credit rows of the membership with entry_date in the window.
  - id: rewards_msr_last_activity
    window: Whole membership history.
    measure: Latest entry_date over rewards_cashback_earned, rewards_boost_earned and rewards_redemption rows of the membership; the enrolled_date when there are none.

policies:
  - id: rewards_agg_multi_holding
    subject: [rewards_enroll]
    rule: >-
      A customer may hold one Pocketwire Rewards membership.
      A membership is opened only if the customer holds no other membership whose status is anything other than closed; a customer whose membership was closed may re-enrol, starting again at Pocketwire Rewards Member with a zero balance, and forfeited points are never restored.
    eligibility:
      - id: one_membership
        applies_to: [rewards_enroll]
        kind: dedup
        condition: "A membership is opened only if the customer holds no other membership whose status is anything other than closed"
        evidence_fields: [rewards_memberships.customer_id, rewards_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.customer_id]
          action_bindings:
            rewards_memberships.customer_id: customer_id
        dedup_contract:
          table: rewards_memberships
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [enrolled, active, suspended]}
          distinct_fields: []
    params:
      max_per_customer: 1

  - id: rewards_enrolment
    subject: [rewards_enroll, rewards_activate]
    rule: >-
      Enrolment is open to a customer whose personal account is active and who holds a Pocketwire debit card that is ordered, active or locked, because points are earned only on Pocketwire debit card purchases; P2P payments, cash-outs, ATM withdrawals, fees and internal transfers never earn points.
      Every membership starts at Pocketwire Rewards Member on the enrolment date with its first tier review on the first day of the next calendar quarter; a customer's spend before enrolment never counts toward points or tier.
      The membership becomes active by itself when the first points are credited.
    eligibility:
      - id: wallet_and_card
        applies_to: [rewards_enroll]
        kind: authorization
        condition: "Enrolment is open to a customer whose personal account is active and who holds a Pocketwire debit card that is ordered, active or locked"
        evidence_fields: [wallet_accounts.wallet_id, wallet_accounts.status, card_accounts.card_id, card_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_accounts.wallet_id]
          action_bindings:
            wallet_accounts.wallet_id: wallet_id

  - id: rewards_earning
    subject: [rewards_cashback_earned]
    rule: >-
      Points are earned only while the membership status is enrolled or active.
      A settled card purchase of at least min_purchase_amount_to_earn earns the base rate plus the category bonus of its merchant category, and recurring purchases earn only on tiers whose recurring_purchases_earn is true.
      The category bonus applies only to the part of the purchase that, added to the bonus-category spend already earned this quarter (rewards_msr_category_spend_quarter), stays within category_bonus_quarterly_spend_cap; the rest earns the base rate only.
      When the linked personal account received direct deposits of at least dd_boost_threshold in the calendar month before the purchase, dd_boost_points_per_dollar is added to the base rate; this is how the personal account's deposit history lifts the rewards rate.
      Points are rounded down to whole points per purchase, capped at max_points_per_purchase, and cut to what remains under monthly_earn_cap_points (rewards_msr_points_month) and max_points_balance; the points are credited on the settlement date of the purchase.
      A purchase earns points only once: points are credited only if no earlier rewards_cashback_earned row points to the same card purchase, so a purchase the customer reports as missing is credited only when no earning row exists for it.
    eligibility:
      - id: earning_status
        applies_to: [rewards_cashback_earned]
        kind: state
        condition: "Points are earned only while the membership status is enrolled or active."
        evidence_fields: [rewards_memberships.membership_id, rewards_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.membership_id]
          action_bindings:
            rewards_memberships.membership_id: membership_id
        state_contract:
          field: rewards_memberships.status
          allowed: [enrolled, active]
      - id: earn_once
        applies_to: [rewards_cashback_earned]
        kind: dedup
        condition: "points are credited only if no earlier rewards_cashback_earned row points to the same card purchase"
        evidence_fields: [rewards_ledger.source_txn_id, rewards_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_ledger.source_txn_id]
          action_bindings:
            rewards_ledger.source_txn_id: source_txn_id
        dedup_contract:
          table: rewards_ledger
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [rewards_cashback_earned]}
          distinct_fields: []
    measures: [rewards_msr_category_spend_quarter, rewards_msr_points_month]
    formula:
      category_bonus_rate: "grocery_bonus_points_per_dollar if merchant_category == 'grocery' else dining_bonus_points_per_dollar if merchant_category == 'dining' else gas_bonus_points_per_dollar if merchant_category == 'gas' else travel_bonus_points_per_dollar if merchant_category == 'travel' else streaming_bonus_points_per_dollar if merchant_category == 'streaming' else online_retail_bonus_points_per_dollar if merchant_category == 'online_retail' else 0"
      bonus_eligible_spend: "max(0, min(spend_amount, category_bonus_quarterly_spend_cap - rewards_msr_category_spend_quarter))"
      points_before_dd_boost: "min(max_points_per_purchase, spend_amount * base_earn_rate_points_per_dollar + bonus_eligible_spend * category_bonus_rate)"
    params:
      per_tier:
        Pocketwire Rewards Member: {base_earn_rate_points_per_dollar: =base_earn_rate_points_per_dollar, dining_bonus_points_per_dollar: =dining_bonus_points_per_dollar, category_bonus_quarterly_spend_cap: =category_bonus_quarterly_spend_cap, monthly_earn_cap_points: =monthly_earn_cap_points}
        Pocketwire Rewards Silver: {base_earn_rate_points_per_dollar: =base_earn_rate_points_per_dollar, dining_bonus_points_per_dollar: =dining_bonus_points_per_dollar, category_bonus_quarterly_spend_cap: =category_bonus_quarterly_spend_cap, monthly_earn_cap_points: =monthly_earn_cap_points}
        Pocketwire Rewards Gold: {base_earn_rate_points_per_dollar: =base_earn_rate_points_per_dollar, dining_bonus_points_per_dollar: =dining_bonus_points_per_dollar, category_bonus_quarterly_spend_cap: =category_bonus_quarterly_spend_cap, monthly_earn_cap_points: =monthly_earn_cap_points}
        Pocketwire Rewards Platinum: {base_earn_rate_points_per_dollar: =base_earn_rate_points_per_dollar, dining_bonus_points_per_dollar: =dining_bonus_points_per_dollar, category_bonus_quarterly_spend_cap: =category_bonus_quarterly_spend_cap, monthly_earn_cap_points: =monthly_earn_cap_points}
        Pocketwire Rewards Diamond: {base_earn_rate_points_per_dollar: =base_earn_rate_points_per_dollar, dining_bonus_points_per_dollar: =dining_bonus_points_per_dollar, category_bonus_quarterly_spend_cap: =category_bonus_quarterly_spend_cap, monthly_earn_cap_points: =monthly_earn_cap_points}
        Pocketwire Rewards Obsidian: {base_earn_rate_points_per_dollar: =base_earn_rate_points_per_dollar, dining_bonus_points_per_dollar: =dining_bonus_points_per_dollar, category_bonus_quarterly_spend_cap: =category_bonus_quarterly_spend_cap, monthly_earn_cap_points: =monthly_earn_cap_points}

  - id: rewards_boosts
    subject: [rewards_boost_activated, rewards_boost_earned]
    rule: >-
      A boost is activated by the member in the app from the offers in boost_offer_catalog; a boost can be activated only while the member's open boosts (rewards_msr_open_boosts) are fewer than boost_offers_active_max, so on single-slot tiers a new boost excludes any other until the current one is used or expires, and a slot freed by use or expiry reopens only after boost_swap_cooldown_hours full hours.
      An activated boost stays valid for boost_activation_valid_days calendar days, the activation date being day 0, and applies to the next boost_uses_per_activation settled purchases at the offer's merchant made after the activation moment; a purchase made before activation is never boosted.
      Boost points are the purchase amount times the offer's bonus_points_per_dollar, rounded down to whole points and capped at the lower of the offer's max_points and boost_points_cap_per_purchase.
      Boost points add to the purchase's base and category points rather than replacing them; they do not count toward monthly_earn_cap_points or the category bonus cap, and only one boost can apply to one purchase — when two open boosts match the same purchase, the one activated first applies.
      A boosted purchase earns boost points only once: boost points are credited only if no earlier rewards_boost_earned row points to the same card purchase, so a missing boost is credited only when the activation, the merchant match and the timing all hold and no boost row exists for that purchase.
    eligibility:
      - id: boost_once
        applies_to: [rewards_boost_earned]
        kind: dedup
        condition: "boost points are credited only if no earlier rewards_boost_earned row points to the same card purchase"
        evidence_fields: [rewards_ledger.source_txn_id, rewards_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_ledger.source_txn_id]
          action_bindings:
            rewards_ledger.source_txn_id: source_txn_id
        dedup_contract:
          table: rewards_ledger
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [rewards_boost_earned]}
          distinct_fields: []
    measures: [rewards_msr_open_boosts]
    params:
      boost_offer_catalog:
        BOOST-FRESHMART5: {merchant_name: FreshMart, bonus_points_per_dollar: 5, max_points: 750}
        BOOST-BLUEBIRD10: {merchant_name: Bluebird Coffee, bonus_points_per_dollar: 10, max_points: 300}
        BOOST-ZIPLINE3: {merchant_name: Zipline Rides, bonus_points_per_dollar: 3, max_points: 450}
        BOOST-STREAMLY20: {merchant_name: Streamly, bonus_points_per_dollar: 20, max_points: 400}
        BOOST-NORTHWAY4: {merchant_name: Northway Fuel, bonus_points_per_dollar: 4, max_points: 600}
        BOOST-PATTY15: {merchant_name: Patty Shack, bonus_points_per_dollar: 15, max_points: 500}
      per_tier:
        Pocketwire Rewards Member: {boost_offers_active_max: =boost_offers_active_max, boost_uses_per_activation: =boost_uses_per_activation, boost_points_cap_per_purchase: =boost_points_cap_per_purchase, boost_activation_valid_days: =boost_activation_valid_days}
        Pocketwire Rewards Silver: {boost_offers_active_max: =boost_offers_active_max, boost_uses_per_activation: =boost_uses_per_activation, boost_points_cap_per_purchase: =boost_points_cap_per_purchase, boost_activation_valid_days: =boost_activation_valid_days}
        Pocketwire Rewards Gold: {boost_offers_active_max: =boost_offers_active_max, boost_uses_per_activation: =boost_uses_per_activation, boost_points_cap_per_purchase: =boost_points_cap_per_purchase, boost_activation_valid_days: =boost_activation_valid_days}
        Pocketwire Rewards Platinum: {boost_offers_active_max: =boost_offers_active_max, boost_uses_per_activation: =boost_uses_per_activation, boost_points_cap_per_purchase: =boost_points_cap_per_purchase, boost_activation_valid_days: =boost_activation_valid_days}
        Pocketwire Rewards Diamond: {boost_offers_active_max: =boost_offers_active_max, boost_uses_per_activation: =boost_uses_per_activation, boost_points_cap_per_purchase: =boost_points_cap_per_purchase, boost_activation_valid_days: =boost_activation_valid_days}
        Pocketwire Rewards Obsidian: {boost_offers_active_max: =boost_offers_active_max, boost_uses_per_activation: =boost_uses_per_activation, boost_points_cap_per_purchase: =boost_points_cap_per_purchase, boost_activation_valid_days: =boost_activation_valid_days}

  - id: rewards_clawback_rules
    subject: [rewards_clawback]
    rule: >-
      On tiers whose clawback_on_refund is true, when a merchant refund linked to an earning purchase posts, the points earned on that purchase are clawed back in proportion to the refunded share of the purchase — base, category, direct-deposit and boost points alike — rounded up to whole points, on the refund date.
      A refund claws back points only when it posts within the clawback window: the refund is dated no later than clawback_window_days calendar days after the purchase date.
      The clawback window is counted in calendar days from the purchase date, the day after the purchase being day 1, and a refund on the last day still claws back.
      On tiers whose negative_balance_allowed is false the clawback is cut to the points balance and the rest is written off; otherwise the balance may go negative and later earnings fill it first.
      An unlinked merchant credit, a dispute credit or a refund outside the window never claws back points.
    eligibility:
      - id: clawback_window
        applies_to: [rewards_clawback]
        kind: time
        condition: "the refund is dated no later than clawback_window_days calendar days after the purchase date"
        evidence_fields: [card_transactions.card_txn_id, card_transactions.txn_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [card_transactions.card_txn_id]
          action_bindings:
            card_transactions.card_txn_id: source_txn_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the purchase date
          anchor_source: card_transactions.txn_date
          relation: not_after
          duration_source: variants.clawback_window_days
          unit: calendar_days
          counting_rule: "The clawback window is counted in calendar days from the purchase date, the day after the purchase being day 1, and a refund on the last day still claws back."
          boundary: inclusive

  - id: rewards_redemption_rules
    subject: [rewards_redemption, rewards_redemption_reversal, rewards_gift_card_fulfilled]
    rule: >-
      Points can be redeemed only while the membership status is active.
      Only redeemable points (rewards_msr_redeemable_points) can be redeemed — points stay pending for points_pending_days calendar days after they are credited.
      A redemption is a whole multiple of redemption_increment_points and at least min_cash_redemption_points for cash, or min_gift_card_redemption_points for a gift card or charity.
      Cash value is points times cash_redemption_cents_per_point, gift card value points times gift_card_cents_per_point, and donation value points times charity_cents_per_point, each divided by 100 and rounded down to the cent; a charity redemption goes only to one of partner_charities, and Pocketwire adds charity_match_pct of the donation value as its own donation, which is not credited to the member.
      Cash redemptions on one calendar day (rewards_msr_cash_redeemed_today plus the new one) may not exceed max_cash_redemption_points_per_day, and a cash redemption is paid into the linked personal account the same day, which needs that account to be able to receive an internal credit.
      A redemption is the member's own decision to spend their points and is confirmed by the member in the app.
      Gift cards and donations are fulfilled within gift_card_fulfilment_business_days business days; the member can cancel one within redemption_cancel_window_hours full hours of the redemption as long as it is not yet fulfilled, and one that cannot be fulfilled is reversed; a reversal returns the same points, and cash redemptions can never be reversed.
    eligibility:
      - id: redeem_active
        applies_to: [rewards_redemption]
        kind: state
        condition: "Points can be redeemed only while the membership status is active."
        evidence_fields: [rewards_memberships.membership_id, rewards_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.membership_id]
          action_bindings:
            rewards_memberships.membership_id: membership_id
        state_contract:
          field: rewards_memberships.status
          allowed: [active]
      - id: reversal_once
        applies_to: [rewards_redemption_reversal]
        kind: dedup
        condition: "a reversal returns the same points, and cash redemptions can never be reversed"
        evidence_fields: [rewards_ledger.source_txn_id, rewards_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_ledger.source_txn_id]
          action_bindings:
            rewards_ledger.source_txn_id: source_txn_id
        dedup_contract:
          table: rewards_ledger
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [rewards_redemption_reversal, rewards_gift_card_fulfilled]}
          distinct_fields: []
    measures: [rewards_msr_redeemable_points, rewards_msr_cash_redeemed_today]
    formula:
      cash_value_uncut: "points * cash_redemption_cents_per_point / 100"
      gift_card_value_uncut: "points * gift_card_cents_per_point / 100"
      charity_value_uncut: "points * charity_cents_per_point / 100"
    params:
      per_tier:
        Pocketwire Rewards Member: {cash_redemption_cents_per_point: =cash_redemption_cents_per_point, gift_card_cents_per_point: =gift_card_cents_per_point, min_cash_redemption_points: =min_cash_redemption_points, points_pending_days: =points_pending_days}
        Pocketwire Rewards Silver: {cash_redemption_cents_per_point: =cash_redemption_cents_per_point, gift_card_cents_per_point: =gift_card_cents_per_point, min_cash_redemption_points: =min_cash_redemption_points, points_pending_days: =points_pending_days}
        Pocketwire Rewards Gold: {cash_redemption_cents_per_point: =cash_redemption_cents_per_point, gift_card_cents_per_point: =gift_card_cents_per_point, min_cash_redemption_points: =min_cash_redemption_points, points_pending_days: =points_pending_days}
        Pocketwire Rewards Platinum: {cash_redemption_cents_per_point: =cash_redemption_cents_per_point, gift_card_cents_per_point: =gift_card_cents_per_point, min_cash_redemption_points: =min_cash_redemption_points, points_pending_days: =points_pending_days}
        Pocketwire Rewards Diamond: {cash_redemption_cents_per_point: =cash_redemption_cents_per_point, gift_card_cents_per_point: =gift_card_cents_per_point, min_cash_redemption_points: =min_cash_redemption_points, points_pending_days: =points_pending_days}
        Pocketwire Rewards Obsidian: {cash_redemption_cents_per_point: =cash_redemption_cents_per_point, gift_card_cents_per_point: =gift_card_cents_per_point, min_cash_redemption_points: =min_cash_redemption_points, points_pending_days: =points_pending_days}

  - id: rewards_tier_review
    subject: [rewards_tier_change]
    rule: >-
      Tiers are reviewed on the first day of each calendar quarter against the qualifying spend of the previous quarter (rewards_msr_prev_quarter_spend), which is purchase spend that earned points less refunded spend that was clawed back.
      The membership moves up to the highest tier whose entry_gate min_quarterly_qualifying_spend that spend meets, and an upgrade is never limited in steps.
      When the spend is below the current tier's tier_retention_spend_quarter, below_retention_quarters goes up by one; the membership drops one tier (tier_downgrade_max_steps) only once below_retention_quarters exceeds tier_grace_quarters, and the count then resets to 0; a review at or above retention resets the count to 0 without a tier change.
      Every review sets tier_review_date to the first day of the next quarter, and a change of tier sets tier_qualified_date to the review date; a tier is never changed between reviews, even at the member's request or on a goodwill basis.
    eligibility: []
    measures: [rewards_msr_prev_quarter_spend]
    params:
      per_tier:
        Pocketwire Rewards Member: {tier_retention_spend_quarter: =tier_retention_spend_quarter, tier_grace_quarters: =tier_grace_quarters}
        Pocketwire Rewards Silver: {tier_retention_spend_quarter: =tier_retention_spend_quarter, tier_grace_quarters: =tier_grace_quarters}
        Pocketwire Rewards Gold: {tier_retention_spend_quarter: =tier_retention_spend_quarter, tier_grace_quarters: =tier_grace_quarters}
        Pocketwire Rewards Platinum: {tier_retention_spend_quarter: =tier_retention_spend_quarter, tier_grace_quarters: =tier_grace_quarters}
        Pocketwire Rewards Diamond: {tier_retention_spend_quarter: =tier_retention_spend_quarter, tier_grace_quarters: =tier_grace_quarters}
        Pocketwire Rewards Obsidian: {tier_retention_spend_quarter: =tier_retention_spend_quarter, tier_grace_quarters: =tier_grace_quarters}

  - id: rewards_bonuses
    subject: [rewards_bonus, rewards_referral_bonus]
    rule: >-
      The quarterly milestone bonus of milestone_bonus_points, at the tier held on the last day of a quarter, is credited once for that quarter when the quarter's qualifying spend reached milestone_quarterly_spend_threshold; the anniversary bonus of anniversary_bonus_points is credited on each anniversary of the enrolled_date while the membership is active.
      A bonus is credited only if no earlier rewards_bonus row of the same bonus_type exists for the same bonus_period.
      A referral bonus of referral_bonus_points is credited when the referred customer, whose profile was created through the member's referral, reached referral_qualifying_spend in card purchases within referral_qualifying_days calendar days after sign-up, at most referral_bonus_max_per_year times per calendar year (rewards_msr_referrals_year); referring oneself or a second profile of the same person is rewards abuse and earns nothing.
      A referral is rewarded once per referred customer, bonuses are credited while the membership is active, and bonus points are subject to points_pending_days like any other earning.
    eligibility:
      - id: bonus_once_per_period
        applies_to: [rewards_bonus]
        kind: dedup
        condition: "A bonus is credited only if no earlier rewards_bonus row of the same bonus_type exists for the same bonus_period."
        evidence_fields: [rewards_ledger.bonus_type, rewards_ledger.bonus_period, rewards_ledger.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_ledger.membership_id, rewards_ledger.bonus_type, rewards_ledger.bonus_period]
          action_bindings:
            rewards_ledger.membership_id: membership_id
            rewards_ledger.bonus_type: bonus_type
            rewards_ledger.bonus_period: bonus_period
        dedup_contract:
          table: rewards_ledger
          mode: separate_record
          object_bindings: {membership_id: membership_id, bonus_type: bonus_type, bonus_period: bonus_period}
          duplicate_filters: {event_type: [rewards_bonus]}
          distinct_fields: []
    measures: [rewards_msr_referrals_year]

  - id: rewards_goodwill
    subject: [rewards_goodwill_credit]
    rule: >-
      Courtesy points are credited only for a gift card or charity redemption that was fulfilled late: its fulfilment was recorded later than gift_card_fulfilment_business_days business days after the redemption date, or it is still unfulfilled and not reversed after that period.
      The fulfilment period is counted in Federal Reserve business days from the redemption date, the first business day after the redemption being day 1.
      The credit is goodwill_points_per_credit of the tier held on the credit date, at most once per late redemption and at most goodwill_max_credits_per_year times over the rolling 365 days (rewards_msr_goodwill_365d); no courtesy points are credited for any other complaint, including missing points or boosts, which are handled by crediting the missing earning itself.
    eligibility:
      - id: goodwill_once
        applies_to: [rewards_goodwill_credit]
        kind: dedup
        condition: "at most once per late redemption"
        evidence_fields: [rewards_ledger.source_txn_id, rewards_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_ledger.source_txn_id]
          action_bindings:
            rewards_ledger.source_txn_id: source_txn_id
        dedup_contract:
          table: rewards_ledger
          mode: separate_record
          object_bindings: {source_txn_id: source_txn_id}
          duplicate_filters: {event_type: [rewards_goodwill_credit]}
          distinct_fields: []
    measures: [rewards_msr_goodwill_365d]

  - id: rewards_points_expiry_rules
    subject: [rewards_points_expiry, rewards_close]
    rule: >-
      On tiers whose points_expiry_months_inactivity is not 0, the whole positive points balance expires once no earning or redemption has occurred for that many calendar months since the last activity (rewards_msr_last_activity), the expiry being dated the same day of the month that many months later, falling back to the month's last day when that day does not exist.
      Closing the membership forfeits the whole positive balance on the closure date; leaving the program is the member's own decision, confirmed by the member, and a member who wants value from the points redeems them before closing.
      Expired or forfeited points are never restored, including on re-enrolment, and a negative balance is simply cleared on closure without any charge.
    eligibility: []
    measures: [rewards_msr_last_activity]

  - id: rewards_membership_status
    subject: [rewards_suspend, rewards_reinstate, rewards_close]
    rule: >-
      A membership is suspended with suspension_reason linked_account_restricted while the linked personal account is limited or locked, and with rewards_abuse when the risk team confirms self-referral or manufactured spend.
      A membership suspended for linked_account_restricted is reinstated when the personal account returns to active; one suspended for rewards_abuse is never reinstated and is closed with its points forfeited.
      While suspended, purchases earn no points and none can be redeemed, and missed earnings are never credited back after reinstatement.
      A membership whose linked personal account closes is closed on the same day.
    eligibility: []

extended_policies:
  - id: rewards_ext_anniversary_bonus_amount
    base_policy_refs: [rewards_bonuses]
    overwrite:
      - base_policy: rewards_bonuses
        superseded_clause: >-
          the anniversary bonus of anniversary_bonus_points is credited on each anniversary of the enrolled_date while the membership is active
        replaced_by: >-
          The anniversary bonus is owed for each anniversary of the enrolled_date reached while the membership is active, and it is booked as one entry for that anniversary year, carrying the year of the anniversary as its period.
      - base_policy: rewards_bonuses
        superseded_clause: >-
          A bonus is credited only if no earlier rewards_bonus row of the same bonus_type exists for the same bonus_period.
        replaced_by: >-
          An anniversary bonus is credited only if the ledger carries no anniversary bonus entry dated on or after the most recent anniversary of the enrolled_date.
    trigger: state_due
    subject: [rewards_bonus]
    computes: points
    target_tool: credit_anniversary_bonus_4deaf7db
    params:
      anniversary_spend_based_floor: 60000
      anniversary_spend_based_rate: 0.11
      anniversary_blended_floor: 30000
      anniversary_blended_rate: 0.05
      anniversary_tenure_long_years: 5
      anniversary_tenure_mid_years: 3
      anniversary_tenure_supplement_long: 2000
      anniversary_tenure_supplement_mid: 1000
      anniversary_dd_high_floor: 40000
      anniversary_dd_std_floor: 12000
      anniversary_dd_supplement_high: 1500
      anniversary_dd_supplement_std: 750
      anniversary_card_supplement_metal: 1000
      anniversary_card_supplement_premium: 500
      anniversary_clean_supplement_none: 500
      anniversary_clean_supplement_one: 250
    rule: >-
      The anniversary bonus is owed for each anniversary of the enrolled_date reached while the membership is active, and it is booked as one entry for that anniversary year, carrying the year of the anniversary as its period.
      An anniversary bonus is credited only if the ledger carries no anniversary bonus entry dated on or after the most recent anniversary of the enrolled_date.
      The anniversary bonus credited for an anniversary is the anniversary tier amount, which is the anniversary_bonus_points of the tier held on the credit date, in whole points.
      A date lies within the last N months when it is later than the same calendar day N months before the handling date and not later than the handling date, and the membership's whole years are the whole months from the enrolled_date to the handling date divided by twelve and rounded down, a whole month being reached on the same calendar day of a later month.
      The anniversary spend of the membership year is the spend carried by earning entries dated within the last twelve months less the spend carried by clawback entries dated within the same twelve months.
      Earning entries are the entries that credit base and category points on a card purchase; boost entries, which carry the same purchase's spend, are not earning entries.
      When the anniversary spend of the membership year is at least anniversary_spend_based_floor, the anniversary bonus is computed as that spend times anniversary_spend_based_rate points per USD, rounded down to whole points, in place of the anniversary tier amount; when it is at least anniversary_blended_floor but below anniversary_spend_based_floor, the anniversary bonus is the anniversary tier amount plus that spend above anniversary_blended_floor times anniversary_blended_rate points per USD, the added part rounded down to whole points; when it is below anniversary_blended_floor, the anniversary bonus is the anniversary tier amount.
      The anniversary tenure supplement is anniversary_tenure_supplement_long points when the membership has completed at least anniversary_tenure_long_years whole years, anniversary_tenure_supplement_mid points when it has completed at least anniversary_tenure_mid_years but fewer than anniversary_tenure_long_years whole years, and nothing when it has completed fewer than anniversary_tenure_mid_years whole years.
      The anniversary direct-deposit supplement is anniversary_dd_supplement_high points when the direct deposits received by the linked personal account within the last twelve months total at least anniversary_dd_high_floor and that account is on Pocketwire Onyx or Pocketwire Summit; it is anniversary_dd_supplement_std points when the account does not meet that first condition but its direct deposits within the last twelve months total at least anniversary_dd_std_floor and it is on Pocketwire Plus, Pocketwire Prime, Pocketwire Onyx or Pocketwire Summit; and it is nothing otherwise.
      The anniversary card supplement is anniversary_card_supplement_metal points when the member's active physical debit card is a Pocketwire Visa Infinite Metal Debit card, anniversary_card_supplement_premium points when it is a Pocketwire Visa Infinite Debit or Pocketwire Visa Signature Debit card, and nothing when it is any other card or there is none.
      The anniversary clean-record supplement is anniversary_clean_supplement_none points when no clawback entry is dated within the last twelve months, anniversary_clean_supplement_one points when exactly one is, and nothing when two or more are.
      The anniversary tenure supplement, the anniversary direct-deposit supplement, the anniversary card supplement and the anniversary clean-record supplement are added to the anniversary bonus after its form is set, and the sum is the whole number of points credited.
      Bonus points are subject to points_pending_days like any other earning.
    prerequisite: []
    cross_category:
      - category: wallet
        as: history
        reads: [variant_name, wallet_transactions.amount]
        note: The anniversary direct-deposit supplement is decided from the linked personal account's plan and its direct deposits over the last twelve months.
      - category: card
        as: branch
        reads: [variant_name, status, card_form]
        note: The anniversary card supplement is decided from the tier of the member's active physical debit card.
    compute:
      - anniv_earn_spend_12m: "SUM('rewards_ledger', 'spend_amount', within_months=12, date_field='entry_date', event_type='rewards_cashback_earned')"
      - anniv_clawed_spend_12m: "SUM('rewards_ledger', 'spend_amount', within_months=12, date_field='entry_date', event_type='rewards_clawback')"
      - anniv_year_spend: "anniv_earn_spend_12m - anniv_clawed_spend_12m"
      - anniv_bonus_form: "int(anniv_year_spend * K('anniversary_spend_based_rate')) if anniv_year_spend >= K('anniversary_spend_based_floor') else (P('anniversary_bonus_points') + int((anniv_year_spend - K('anniversary_blended_floor')) * K('anniversary_blended_rate')) if anniv_year_spend >= K('anniversary_blended_floor') else P('anniversary_bonus_points'))"
      - anniv_years: "MONTHS(F('enrolled_date'), NOW) // 12"
      - anniv_tenure_supplement: "K('anniversary_tenure_supplement_long') if anniv_years >= K('anniversary_tenure_long_years') else (K('anniversary_tenure_supplement_mid') if anniv_years >= K('anniversary_tenure_mid_years') else 0)"
      - anniv_dd_12m: "XSUM('wallet', 'wallet_transactions', 'amount', within_months=12, date_field='txn_date', event_type='wallet_direct_deposit', wallet_id=F('wallet_id'))"
      - anniv_linked_plan: "CFIELD('wallet', 'variant_name', wallet_id=F('wallet_id'))"
      - anniv_dd_supplement: "K('anniversary_dd_supplement_high') if (anniv_dd_12m >= K('anniversary_dd_high_floor') and (anniv_linked_plan == 'Pocketwire Onyx' or anniv_linked_plan == 'Pocketwire Summit')) else (K('anniversary_dd_supplement_std') if (anniv_dd_12m >= K('anniversary_dd_std_floor') and (anniv_linked_plan == 'Pocketwire Plus' or anniv_linked_plan == 'Pocketwire Prime' or anniv_linked_plan == 'Pocketwire Onyx' or anniv_linked_plan == 'Pocketwire Summit')) else 0)"
      - anniv_card_tier: "CFIELD('card', 'variant_name', status='active', card_form='physical')"
      - anniv_card_supplement: "K('anniversary_card_supplement_metal') if anniv_card_tier == 'Pocketwire Visa Infinite Metal Debit' else (K('anniversary_card_supplement_premium') if (anniv_card_tier == 'Pocketwire Visa Infinite Debit' or anniv_card_tier == 'Pocketwire Visa Signature Debit') else 0)"
      - anniv_clawbacks_12m: "COUNT('rewards_ledger', within_months=12, date_field='entry_date', event_type='rewards_clawback')"
      - anniv_clean_supplement: "K('anniversary_clean_supplement_none') if anniv_clawbacks_12m == 0 else (K('anniversary_clean_supplement_one') if anniv_clawbacks_12m == 1 else 0)"
      - result: "anniv_bonus_form + anniv_tenure_supplement + anniv_dd_supplement + anniv_card_supplement + anniv_clean_supplement"
    compute_basis:
      anniv_earn_spend_12m: "The anniversary spend of the membership year is the spend carried by earning entries dated within the last twelve months less the spend carried by clawback entries dated within the same twelve months."
      anniv_clawed_spend_12m: "The anniversary spend of the membership year is the spend carried by earning entries dated within the last twelve months less the spend carried by clawback entries dated within the same twelve months."
      anniv_year_spend: "A date lies within the last N months when it is later than the same calendar day N months before the handling date and not later than the handling date"
      anniv_bonus_form: "When the anniversary spend of the membership year is at least anniversary_spend_based_floor, the anniversary bonus is computed as that spend times anniversary_spend_based_rate points per USD, rounded down to whole points, in place of the anniversary tier amount; when it is at least anniversary_blended_floor but below anniversary_spend_based_floor, the anniversary bonus is the anniversary tier amount plus that spend above anniversary_blended_floor times anniversary_blended_rate points per USD, the added part rounded down to whole points; when it is below anniversary_blended_floor, the anniversary bonus is the anniversary tier amount."
      anniv_years: "the membership's whole years are the whole months from the enrolled_date to the handling date divided by twelve and rounded down, a whole month being reached on the same calendar day of a later month."
      anniv_tenure_supplement: "The anniversary tenure supplement is anniversary_tenure_supplement_long points when the membership has completed at least anniversary_tenure_long_years whole years, anniversary_tenure_supplement_mid points when it has completed at least anniversary_tenure_mid_years but fewer than anniversary_tenure_long_years whole years, and nothing when it has completed fewer than anniversary_tenure_mid_years whole years."
      anniv_dd_12m: "the direct deposits received by the linked personal account within the last twelve months"
      anniv_linked_plan: "that account is on Pocketwire Onyx or Pocketwire Summit"
      anniv_dd_supplement: "The anniversary direct-deposit supplement is anniversary_dd_supplement_high points when the direct deposits received by the linked personal account within the last twelve months total at least anniversary_dd_high_floor and that account is on Pocketwire Onyx or Pocketwire Summit; it is anniversary_dd_supplement_std points when the account does not meet that first condition but its direct deposits within the last twelve months total at least anniversary_dd_std_floor and it is on Pocketwire Plus, Pocketwire Prime, Pocketwire Onyx or Pocketwire Summit; and it is nothing otherwise."
      anniv_card_tier: "the member's active physical debit card"
      anniv_card_supplement: "The anniversary card supplement is anniversary_card_supplement_metal points when the member's active physical debit card is a Pocketwire Visa Infinite Metal Debit card, anniversary_card_supplement_premium points when it is a Pocketwire Visa Infinite Debit or Pocketwire Visa Signature Debit card, and nothing when it is any other card or there is none."
      anniv_clawbacks_12m: "no clawback entry is dated within the last twelve months"
      anniv_clean_supplement: "The anniversary clean-record supplement is anniversary_clean_supplement_none points when no clawback entry is dated within the last twelve months, anniversary_clean_supplement_one points when exactly one is, and nothing when two or more are."
      result: "The anniversary tenure supplement, the anniversary direct-deposit supplement, the anniversary card supplement and the anniversary clean-record supplement are added to the anniversary bonus after its form is set, and the sum is the whole number of points credited."
    factors:
      - id: anniversary_bonus_form
        effect: method
        decides: anniv_bonus_form
        bindings: [anniv_earn_spend_12m, anniv_clawed_spend_12m, anniv_year_spend, anniv_bonus_form]
        ladder:
          - when: "the anniversary spend of the membership year is at least anniversary_spend_based_floor"
            method: "the bonus is that spend times anniversary_spend_based_rate points per USD, rounded down, in place of the anniversary tier amount"
          - when: "the anniversary spend of the membership year is at least anniversary_blended_floor but below anniversary_spend_based_floor"
            method: "the bonus is the anniversary tier amount plus the spend above anniversary_blended_floor times anniversary_blended_rate points per USD, the added part rounded down"
          - when: "otherwise"
            method: "the bonus is the anniversary tier amount"
        baseline:
          anniv_bonus_form: "P('anniversary_bonus_points')"
        evidence: [history]
        cross_difficulty: null
      - id: anniversary_tenure_supplement
        effect: parameter
        decides: anniv_tenure_supplement
        bindings: [anniv_years, anniv_tenure_supplement]
        ladder:
          - when: "the membership has completed at least anniversary_tenure_long_years whole years"
            value: "K('anniversary_tenure_supplement_long')"
          - when: "the membership has completed at least anniversary_tenure_mid_years but fewer than anniversary_tenure_long_years whole years"
            value: "K('anniversary_tenure_supplement_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          anniv_tenure_supplement: "0"
        evidence: [date]
        cross_difficulty: null
      - id: anniversary_direct_deposit_supplement
        effect: parameter
        decides: anniv_dd_supplement
        bindings: [anniv_dd_12m, anniv_linked_plan, anniv_dd_supplement]
        ladder:
          - when: "direct deposits within the last twelve months total at least anniversary_dd_high_floor and the linked account is on Pocketwire Onyx or Pocketwire Summit"
            value: "K('anniversary_dd_supplement_high')"
          - when: "the first condition is not met, direct deposits within the last twelve months total at least anniversary_dd_std_floor and the linked account is on a paid plan (Plus, Prime, Onyx or Summit)"
            value: "K('anniversary_dd_supplement_std')"
          - when: "otherwise"
            value: "0"
        baseline:
          anniv_dd_supplement: "0"
        evidence: [cross_category, history]
        cross_difficulty: wallet
      - id: anniversary_card_supplement
        effect: parameter
        decides: anniv_card_supplement
        bindings: [anniv_card_tier, anniv_card_supplement]
        ladder:
          - when: "the active physical debit card is a Pocketwire Visa Infinite Metal Debit card"
            value: "K('anniversary_card_supplement_metal')"
          - when: "the active physical debit card is a Pocketwire Visa Infinite Debit or Pocketwire Visa Signature Debit card"
            value: "K('anniversary_card_supplement_premium')"
          - when: "otherwise"
            value: "0"
        baseline:
          anniv_card_supplement: "0"
        evidence: [cross_category]
        cross_difficulty: card
      - id: anniversary_clean_record_supplement
        effect: parameter
        decides: anniv_clean_supplement
        bindings: [anniv_clawbacks_12m, anniv_clean_supplement]
        ladder:
          - when: "no clawback entry is dated within the last twelve months"
            value: "K('anniversary_clean_supplement_none')"
          - when: "exactly one clawback entry is dated within the last twelve months"
            value: "K('anniversary_clean_supplement_one')"
          - when: "otherwise"
            value: "0"
        baseline:
          anniv_clean_supplement: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The anniversary bonus credited for an anniversary is the anniversary tier amount, which is the anniversary_bonus_points of the tier held on the credit date, in whole points.
      params: [anniversary_bonus_points]
    inputs:
      history:
        - {table: rewards_ledger, aggregate: sum, field: spend_amount, within_months: 12, filters: {event_type: rewards_cashback_earned}}
        - {table: rewards_ledger, aggregate: sum, field: spend_amount, within_months: 12, filters: {event_type: rewards_clawback}}
        - {table: rewards_ledger, aggregate: count, field: rewards_entry_id, within_months: 12, filters: {event_type: rewards_clawback}}
        - {category: wallet, table: wallet_transactions, aggregate: sum, field: amount, within_months: 12, filters: {event_type: wallet_direct_deposit}}
      cross_category: [wallet, card]

  - id: rewards_ext_refund_clawback_points
    base_policy_refs: [rewards_clawback_rules]
    overwrite:
      - base_policy: rewards_clawback_rules
        superseded_clause: >-
          the points earned on that purchase are clawed back in proportion to the refunded share of the purchase — base, category, direct-deposit and boost points alike — rounded up to whole points, on the refund date.
        replaced_by: >-
          The clawback is booked as one entry on the day it is assessed, against the refunded card purchase and carrying the refunded amount, and the points it takes are worked out as follows.
    trigger: state_due
    subject: [rewards_clawback]
    computes: points
    target_tool: post_refund_clawback_4ceb9a03
    params:
      clawback_age_long_days: 60
      clawback_age_mid_days: 30
      clawback_loyalty_high_years: 4
      clawback_loyalty_high_spend: 40000
      clawback_loyalty_std_years: 2
      clawback_loyalty_std_spend: 15000
      clawback_loyalty_relief_high: 750
      clawback_loyalty_relief_std: 300
      clawback_travel_relief: 300
      clawback_dining_relief: 100
      clawback_activity_high_count: 15
      clawback_activity_std_count: 8
      clawback_activity_relief_high: 400
      clawback_activity_relief_std: 150
    rule: >-
      On tiers whose clawback_on_refund is true a clawback is assessed refund by refund, and the refund assessed is the latest merchant refund posted on the member's debit cards, which carries the card purchase it refunds; the refund claws back points only when it is dated no later than clawback_window_days calendar days after that purchase, the day after the purchase being day 1.
      The points clawed back are fixed only after the ledger carries the anniversary bonus for the most recent enrolment anniversary the membership has reached while active.
      The clawback is booked as one entry on the day it is assessed, against the refunded card purchase and carrying the refunded amount, and the points it takes are worked out as follows.
      The standard clawback is the points the refunded purchase earned, counting its earning entry and any boost entry for it, times the refunded amount divided by the purchase amount, rounded up to whole points, and it is taken from the points balance as it stands.
      Earning entries are the entries that credit base and category points on a card purchase; boost entries, which carry the same purchase's spend, are not earning entries.
      The refund age is the number of calendar days from the purchase date to the refund date, the day after the purchase being day 1, and the rate-method clawback is the refunded amount times the base_earn_rate_points_per_dollar of the tier held on the handling date, rounded up to whole points.
      When the refund age is more than clawback_age_long_days days, the clawback is the rate-method clawback in place of the standard clawback; when it is more than clawback_age_mid_days but not more than clawback_age_long_days days, the clawback is the lower of the standard clawback and the rate-method clawback; when it is not more than clawback_age_mid_days days, the clawback is the standard clawback.
      A date lies within the last N months when it is later than the same calendar day N months before the handling date and not later than the handling date, and the membership's whole years are the whole months from the enrolled_date to the handling date divided by twelve and rounded down.
      The clawback relief spend is the spend carried by earning entries dated within the last twelve months less the spend carried by clawback entries dated within the same twelve months.
      The clawback loyalty relief is clawback_loyalty_relief_high points when the membership has completed at least clawback_loyalty_high_years whole years and the clawback relief spend is at least clawback_loyalty_high_spend; it is clawback_loyalty_relief_std points when the member does not meet that first condition but the membership has completed at least clawback_loyalty_std_years whole years and the clawback relief spend is at least clawback_loyalty_std_spend; and it is nothing otherwise.
      The clawback category relief is clawback_travel_relief points when the earning entry of the refunded purchase carries the travel category, clawback_dining_relief points when it carries the dining category, and nothing for any other category.
      The clawback card-activity relief is clawback_activity_relief_high points when the member's debit cards carry at least clawback_activity_high_count settled purchases dated within the last three months, clawback_activity_relief_std points when they carry at least clawback_activity_std_count but fewer than clawback_activity_high_count, and nothing when they carry fewer than clawback_activity_std_count.
      The clawback loyalty relief, the clawback category relief and the clawback card-activity relief are added together and taken off the clawback after its age method is applied, and the clawback never goes below zero.
      On tiers whose negative_balance_allowed is false the clawback is then cut to the points balance on the handling date, never below zero, and the rest is written off; on other tiers it is taken in full.
    prerequisite:
      - problem: rewards_ext_anniversary_bonus_amount
        kind: value_input
        gate: clawback_balance_cap
        form: state
        policy_source: >-
          The points clawed back are fixed only after the ledger carries the anniversary bonus for the most recent enrolment anniversary the membership has reached while active.
        condition: >-
          For the most recent anniversary of the membership's enrolled_date reached while the membership was active, the points ledger carries a rewards_bonus entry of bonus_type anniversary dated on or after that anniversary, and the membership's points_balance includes it.
        resolved_by: credit_anniversary_bonus_4deaf7db
        effect: >-
          The anniversary bonus entry raises the points balance, so the balance the clawback is cut to on tiers whose negative_balance_allowed is false (clawback_balance_cap) rises by the bonus points, and a clawback that the lower balance would have cut is taken in full.
    cross_category:
      - category: card
        as: history
        reads: [card_transactions.amount, card_transactions.txn_date, card_transactions.source_txn_id, card_transactions.event_type]
        note: The refund and the refunded purchase are read from the card ledger, which also decides the refund age (and so the age method) and the clawback card-activity relief.
    compute:
      - refund_amount: "XLATEST('card', 'card_transactions', 'amount', date_field='txn_date', event_type='card_merchant_refund')"
      - refunded_purchase: "XLATEST('card', 'card_transactions', 'source_txn_id', date_field='txn_date', event_type='card_merchant_refund')"
      - purchase_amount: "XLATEST('card', 'card_transactions', 'amount', date_field='txn_date', event_type='card_purchase', card_txn_id=refunded_purchase)"
      - purchase_points: "SUM('rewards_ledger', 'points', event_type='rewards_cashback_earned', source_txn_id=refunded_purchase) + SUM('rewards_ledger', 'points', event_type='rewards_boost_earned', source_txn_id=refunded_purchase)"
      - standard_clawback: "-int((-RND(purchase_points * refund_amount / purchase_amount, 6)) // 1)"
      - refund_date: "XLATEST('card', 'card_transactions', 'txn_date', date_field='txn_date', event_type='card_merchant_refund')"
      - purchase_date: "XLATEST('card', 'card_transactions', 'txn_date', date_field='txn_date', event_type='card_purchase', card_txn_id=refunded_purchase)"
      - refund_age_days: "DAYS(purchase_date, refund_date)"
      - rate_method_clawback: "-int((-RND(refund_amount * P('base_earn_rate_points_per_dollar'), 6)) // 1)"
      - aged_clawback: "rate_method_clawback if refund_age_days > K('clawback_age_long_days') else (MN(standard_clawback, rate_method_clawback) if refund_age_days > K('clawback_age_mid_days') else standard_clawback)"
      - relief_earn_spend_12m: "SUM('rewards_ledger', 'spend_amount', within_months=12, date_field='entry_date', event_type='rewards_cashback_earned')"
      - relief_clawed_spend_12m: "SUM('rewards_ledger', 'spend_amount', within_months=12, date_field='entry_date', event_type='rewards_clawback')"
      - relief_spend: "relief_earn_spend_12m - relief_clawed_spend_12m"
      - relief_years: "MONTHS(F('enrolled_date'), NOW) // 12"
      - loyalty_relief: "K('clawback_loyalty_relief_high') if (relief_years >= K('clawback_loyalty_high_years') and relief_spend >= K('clawback_loyalty_high_spend')) else (K('clawback_loyalty_relief_std') if (relief_years >= K('clawback_loyalty_std_years') and relief_spend >= K('clawback_loyalty_std_spend')) else 0)"
      - refunded_category: "LATEST('rewards_ledger', 'merchant_category', date_field='entry_date', event_type='rewards_cashback_earned', source_txn_id=refunded_purchase)"
      - category_relief: "K('clawback_travel_relief') if refunded_category == 'travel' else (K('clawback_dining_relief') if refunded_category == 'dining' else 0)"
      - card_purchases_3m: "XCOUNT('card', 'card_transactions', within_months=3, date_field='txn_date', event_type='card_purchase')"
      - activity_relief: "K('clawback_activity_relief_high') if card_purchases_3m >= K('clawback_activity_high_count') else (K('clawback_activity_relief_std') if card_purchases_3m >= K('clawback_activity_std_count') else 0)"
      - relieved_clawback: "MX(0, aged_clawback - loyalty_relief - category_relief - activity_relief)"
      - clawback_balance_cap: "MX(0, F('points_balance'))"
      - result: "MN(relieved_clawback, clawback_balance_cap) if P('negative_balance_allowed') == False else relieved_clawback"
    compute_basis:
      refund_amount: "the refund assessed is the latest merchant refund posted on the member's debit cards, which carries the card purchase it refunds"
      refunded_purchase: "the refund assessed is the latest merchant refund posted on the member's debit cards, which carries the card purchase it refunds"
      purchase_amount: "The standard clawback is the points the refunded purchase earned, counting its earning entry and any boost entry for it, times the refunded amount divided by the purchase amount, rounded up to whole points, and it is taken from the points balance as it stands."
      purchase_points: "The standard clawback is the points the refunded purchase earned, counting its earning entry and any boost entry for it, times the refunded amount divided by the purchase amount, rounded up to whole points, and it is taken from the points balance as it stands."
      standard_clawback: "The standard clawback is the points the refunded purchase earned, counting its earning entry and any boost entry for it, times the refunded amount divided by the purchase amount, rounded up to whole points, and it is taken from the points balance as it stands."
      refund_date: "The refund age is the number of calendar days from the purchase date to the refund date, the day after the purchase being day 1"
      purchase_date: "The refund age is the number of calendar days from the purchase date to the refund date, the day after the purchase being day 1"
      refund_age_days: "The refund age is the number of calendar days from the purchase date to the refund date, the day after the purchase being day 1"
      rate_method_clawback: "the rate-method clawback is the refunded amount times the base_earn_rate_points_per_dollar of the tier held on the handling date, rounded up to whole points."
      aged_clawback: "When the refund age is more than clawback_age_long_days days, the clawback is the rate-method clawback in place of the standard clawback; when it is more than clawback_age_mid_days but not more than clawback_age_long_days days, the clawback is the lower of the standard clawback and the rate-method clawback; when it is not more than clawback_age_mid_days days, the clawback is the standard clawback."
      relief_earn_spend_12m: "The clawback relief spend is the spend carried by earning entries dated within the last twelve months less the spend carried by clawback entries dated within the same twelve months."
      relief_clawed_spend_12m: "The clawback relief spend is the spend carried by earning entries dated within the last twelve months less the spend carried by clawback entries dated within the same twelve months."
      relief_spend: "A date lies within the last N months when it is later than the same calendar day N months before the handling date and not later than the handling date"
      relief_years: "the membership's whole years are the whole months from the enrolled_date to the handling date divided by twelve and rounded down."
      loyalty_relief: "The clawback loyalty relief is clawback_loyalty_relief_high points when the membership has completed at least clawback_loyalty_high_years whole years and the clawback relief spend is at least clawback_loyalty_high_spend; it is clawback_loyalty_relief_std points when the member does not meet that first condition but the membership has completed at least clawback_loyalty_std_years whole years and the clawback relief spend is at least clawback_loyalty_std_spend; and it is nothing otherwise."
      refunded_category: "the earning entry of the refunded purchase carries the travel category"
      category_relief: "The clawback category relief is clawback_travel_relief points when the earning entry of the refunded purchase carries the travel category, clawback_dining_relief points when it carries the dining category, and nothing for any other category."
      card_purchases_3m: "the member's debit cards carry at least clawback_activity_high_count settled purchases dated within the last three months"
      activity_relief: "The clawback card-activity relief is clawback_activity_relief_high points when the member's debit cards carry at least clawback_activity_high_count settled purchases dated within the last three months, clawback_activity_relief_std points when they carry at least clawback_activity_std_count but fewer than clawback_activity_high_count, and nothing when they carry fewer than clawback_activity_std_count."
      relieved_clawback: "The clawback loyalty relief, the clawback category relief and the clawback card-activity relief are added together and taken off the clawback after its age method is applied, and the clawback never goes below zero."
      clawback_balance_cap: "On tiers whose negative_balance_allowed is false the clawback is then cut to the points balance on the handling date, never below zero, and the rest is written off; on other tiers it is taken in full."
      result: "On tiers whose negative_balance_allowed is false the clawback is then cut to the points balance on the handling date, never below zero, and the rest is written off; on other tiers it is taken in full."
    factors:
      - id: clawback_age_method
        effect: method
        decides: aged_clawback
        bindings: [refund_date, purchase_date, refund_age_days, rate_method_clawback, aged_clawback]
        ladder:
          - when: "the refund age is more than clawback_age_long_days days"
            method: "rate method: the refunded amount times the tier's base_earn_rate_points_per_dollar, rounded up, in place of the proportional share of what the purchase earned"
          - when: "the refund age is more than clawback_age_mid_days but not more than clawback_age_long_days days"
            method: "lower-of-two: the smaller of the standard proportional clawback and the rate-method clawback"
          - when: "otherwise"
            method: "the standard clawback: the proportional share of the points the purchase earned"
        baseline:
          aged_clawback: "standard_clawback"
        evidence: [date, cross_category]
        cross_difficulty: card
      - id: clawback_loyalty_relief
        effect: parameter
        decides: loyalty_relief
        bindings: [relief_earn_spend_12m, relief_clawed_spend_12m, relief_spend, relief_years, loyalty_relief]
        ladder:
          - when: "at least clawback_loyalty_high_years whole years of membership and a clawback relief spend of at least clawback_loyalty_high_spend"
            value: "K('clawback_loyalty_relief_high')"
          - when: "the first condition is not met, at least clawback_loyalty_std_years whole years of membership and a clawback relief spend of at least clawback_loyalty_std_spend"
            value: "K('clawback_loyalty_relief_std')"
          - when: "otherwise"
            value: "0"
        baseline:
          loyalty_relief: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: clawback_category_relief
        effect: parameter
        decides: category_relief
        bindings: [refunded_category, category_relief]
        ladder:
          - when: "the refunded purchase's earning entry carries the travel category"
            value: "K('clawback_travel_relief')"
          - when: "the refunded purchase's earning entry carries the dining category"
            value: "K('clawback_dining_relief')"
          - when: "otherwise"
            value: "0"
        baseline:
          category_relief: "0"
        evidence: [history]
        cross_difficulty: null
      - id: clawback_card_activity_relief
        effect: parameter
        decides: activity_relief
        bindings: [card_purchases_3m, activity_relief]
        ladder:
          - when: "at least clawback_activity_high_count settled card purchases dated within the last three months"
            value: "K('clawback_activity_relief_high')"
          - when: "at least clawback_activity_std_count but fewer than clawback_activity_high_count settled card purchases dated within the last three months"
            value: "K('clawback_activity_relief_std')"
          - when: "otherwise"
            value: "0"
        baseline:
          activity_relief: "0"
        evidence: [cross_category, history]
        cross_difficulty: card
    baseline:
      rule: >-
        The standard clawback is the points the refunded purchase earned, counting its earning entry and any boost entry for it, times the refunded amount divided by the purchase amount, rounded up to whole points, and it is taken from the points balance as it stands.
        On tiers whose negative_balance_allowed is false the clawback is then cut to the points balance on the handling date, never below zero, and the rest is written off; on other tiers it is taken in full.
      params: [negative_balance_allowed]
    inputs:
      history:
        - {table: rewards_ledger, aggregate: sum, field: points, filters: {event_type: rewards_cashback_earned}}
        - {table: rewards_ledger, aggregate: sum, field: points, filters: {event_type: rewards_boost_earned}}
        - {table: rewards_ledger, aggregate: sum, field: spend_amount, within_months: 12, filters: {event_type: rewards_cashback_earned}}
        - {table: rewards_ledger, aggregate: sum, field: spend_amount, within_months: 12, filters: {event_type: rewards_clawback}}
        - {table: rewards_ledger, aggregate: latest, field: merchant_category, filters: {event_type: rewards_cashback_earned}}
        - {category: card, table: card_transactions, aggregate: latest, field: amount, filters: {event_type: card_merchant_refund}}
        - {category: card, table: card_transactions, aggregate: count, field: card_txn_id, within_months: 3, filters: {event_type: card_purchase}}
      cross_category: [card]

  - id: rewards_ext_whole_balance_gift_card_value
    base_policy_refs: [rewards_redemption_rules]
    overwrite:
      - base_policy: rewards_redemption_rules
        superseded_clause: >-
          gift card value points times gift_card_cents_per_point
        replaced_by: >-
          The gift card rate is gift_card_cents_per_point plus the gift card engaged-spender lift, the gift card card-tier lift, the gift card redeemer lift and the gift card boost lift, all added together before the rate is applied to the points redeemed; the value is then worked out by the gift card plan valuation, in US cents, and divided by 100 and rounded down to the cent only once, at the end.
    trigger: on_request
    subject: [rewards_redemption]
    computes: cash_value
    target_tool: redeem_points_gift_card_91c84320
    params:
      gift_engaged_high_spend: 13000
      gift_engaged_high_years: 3
      gift_engaged_std_spend: 8000
      gift_engaged_std_years: 1
      gift_engaged_lift_high: 0.15
      gift_engaged_lift_std: 0.05
      gift_card_lift_metal: 0.10
      gift_card_lift_premium: 0.05
      gift_redeemer_high_count: 4
      gift_redeemer_std_count: 2
      gift_redeemer_lift_high: 0.05
      gift_redeemer_lift_std: 0.02
      gift_boost_high_count: 4
      gift_boost_std_count: 1
      gift_boost_lift_high: 0.05
      gift_boost_lift_std: 0.02
      gift_plan_dd_high_floor: 3000
      gift_band_start_points: 5000
      gift_band_extra_cents: 0.10
      gift_block_points: 5000
      gift_block_bonus_cents: 250
    rule: >-
      Points can be redeemed only while the membership status is active, and only redeemable points can be redeemed.
      A whole-balance gift card redemption is available only when none of the points balance is still pending, so that the whole balance is redeemable, and the points redeemed are then the points balance on the handling date rounded down to a whole multiple of redemption_increment_points; the redemption is booked as one entry carrying the gift card brand the member names.
      A whole-balance gift card redemption is not valued until the ledger carries a clawback entry for the latest merchant refund of an earning purchase posted within the clawback window.
      The standard gift card value is the points redeemed times gift_card_cents_per_point, divided by 100 and rounded down to the cent.
      The gift card rate is gift_card_cents_per_point plus the gift card engaged-spender lift, the gift card card-tier lift, the gift card redeemer lift and the gift card boost lift, all added together before the rate is applied to the points redeemed; the value is then worked out by the gift card plan valuation, in US cents, and divided by 100 and rounded down to the cent only once, at the end.
      A date lies within the last N months when it is later than the same calendar day N months before the handling date and not later than the handling date, and the membership's whole years are the whole months from the enrolled_date to the handling date divided by twelve and rounded down.
      Earning entries are the entries that credit base and category points on a card purchase; boost entries, which carry the same purchase's spend, are not earning entries.
      The gift card spend measure is the spend carried by earning entries dated within the last three months less the spend carried by clawback entries dated within the same three months.
      The gift card engaged-spender lift is gift_engaged_lift_high US cents per point when the gift card spend measure is at least gift_engaged_high_spend and the membership has completed at least gift_engaged_high_years whole years; it is gift_engaged_lift_std cents per point when the member does not meet that first condition but the gift card spend measure is at least gift_engaged_std_spend and the membership has completed at least gift_engaged_std_years whole year; and it is nothing otherwise.
      The gift card card-tier lift is gift_card_lift_metal cents per point when the member's active physical debit card is a Pocketwire Visa Infinite Metal Debit card, gift_card_lift_premium cents per point when it is a Pocketwire Visa Infinite Debit or Pocketwire Visa Signature Debit card, and nothing when it is any other card or there is none.
      The gift card redeemer lift is gift_redeemer_lift_high cents per point when the ledger carries at least gift_redeemer_high_count gift card redemptions dated within the last twelve months, gift_redeemer_lift_std cents per point when it carries at least gift_redeemer_std_count but fewer than gift_redeemer_high_count, and nothing when it carries fewer than gift_redeemer_std_count; charity and cash redemptions are not counted.
      The gift card boost lift is gift_boost_lift_high cents per point when the ledger carries at least gift_boost_high_count boost entries dated within the last twelve months, gift_boost_lift_std cents per point when it carries at least gift_boost_std_count but fewer than gift_boost_high_count, and nothing when it carries none; boost activations that never earned are not counted.
      The gift card plan valuation depends on the linked personal account: when it is on Pocketwire Onyx or Pocketwire Summit and received direct deposits totalling at least gift_plan_dd_high_floor within the last month, the value is banded, the first gift_band_start_points points redeemed being valued at the gift card rate and every point beyond them at the gift card rate plus gift_band_extra_cents cents; when the account does not meet that first condition but is on Pocketwire Plus, Pocketwire Prime, Pocketwire Onyx or Pocketwire Summit and received direct deposits totalling at least dd_boost_threshold within the last month, the value is every point redeemed at the gift card rate plus a block bonus of gift_block_bonus_cents cents for every full gift_block_points points redeemed; otherwise the value is every point redeemed at the gift card rate.
    prerequisite:
      - problem: rewards_ext_refund_clawback_points
        kind: value_input
        gate: gc_redeem_points
        form: state
        policy_source: >-
          A whole-balance gift card redemption is not valued until the ledger carries a clawback entry for the latest merchant refund of an earning purchase posted within the clawback window.
        condition: >-
          When the latest card_merchant_refund on the member's cards refunds an earning purchase and is dated no later than clawback_window_days after that purchase, the ledger carries a rewards_clawback entry whose source_txn_id is the refunded purchase, and the points_balance reflects it.
        resolved_by: post_refund_clawback_4ceb9a03
        effect: >-
          The clawback entry lowers the points balance, so the points redeemed (gc_redeem_points) fall by the points clawed back rounded to the increment, and its refunded spend is taken off the gift card spend measure, which can move the member to a lower gift card engaged-spender lift.
    cross_category:
      - category: card
        as: branch
        reads: [variant_name, status, card_form]
        note: The gift card card-tier lift is decided from the tier of the member's active physical debit card.
      - category: wallet
        as: history
        reads: [variant_name, wallet_transactions.amount]
        note: The gift card plan valuation is decided from the linked personal account's plan and its direct deposits over the last month.
    compute:
      - gc_redeem_points: "int(MX(0, F('points_balance')) // P('redemption_increment_points')) * P('redemption_increment_points')"
      - gc_earn_spend_3m: "SUM('rewards_ledger', 'spend_amount', within_months=3, date_field='entry_date', event_type='rewards_cashback_earned')"
      - gc_clawed_spend_3m: "SUM('rewards_ledger', 'spend_amount', within_months=3, date_field='entry_date', event_type='rewards_clawback')"
      - gc_spend_measure: "gc_earn_spend_3m - gc_clawed_spend_3m"
      - gc_years: "MONTHS(F('enrolled_date'), NOW) // 12"
      - gc_engaged_lift: "K('gift_engaged_lift_high') if (gc_spend_measure >= K('gift_engaged_high_spend') and gc_years >= K('gift_engaged_high_years')) else (K('gift_engaged_lift_std') if (gc_spend_measure >= K('gift_engaged_std_spend') and gc_years >= K('gift_engaged_std_years')) else 0)"
      - gc_card_tier: "CFIELD('card', 'variant_name', status='active', card_form='physical')"
      - gc_card_lift: "K('gift_card_lift_metal') if gc_card_tier == 'Pocketwire Visa Infinite Metal Debit' else (K('gift_card_lift_premium') if (gc_card_tier == 'Pocketwire Visa Infinite Debit' or gc_card_tier == 'Pocketwire Visa Signature Debit') else 0)"
      - gc_redemptions_12m: "COUNT('rewards_ledger', within_months=12, date_field='entry_date', event_type='rewards_redemption', redemption_type='gift_card')"
      - gc_redeemer_lift: "K('gift_redeemer_lift_high') if gc_redemptions_12m >= K('gift_redeemer_high_count') else (K('gift_redeemer_lift_std') if gc_redemptions_12m >= K('gift_redeemer_std_count') else 0)"
      - gc_boosts_12m: "COUNT('rewards_ledger', within_months=12, date_field='entry_date', event_type='rewards_boost_earned')"
      - gc_boost_lift: "K('gift_boost_lift_high') if gc_boosts_12m >= K('gift_boost_high_count') else (K('gift_boost_lift_std') if gc_boosts_12m >= K('gift_boost_std_count') else 0)"
      - gc_rate: "P('gift_card_cents_per_point') + gc_engaged_lift + gc_card_lift + gc_redeemer_lift + gc_boost_lift"
      - gc_dd_1m: "XSUM('wallet', 'wallet_transactions', 'amount', within_months=1, date_field='txn_date', event_type='wallet_direct_deposit', wallet_id=F('wallet_id'))"
      - gc_linked_plan: "CFIELD('wallet', 'variant_name', wallet_id=F('wallet_id'))"
      - gc_value_cents: "gc_redeem_points * gc_rate + MX(0, gc_redeem_points - K('gift_band_start_points')) * K('gift_band_extra_cents') if ((gc_linked_plan == 'Pocketwire Onyx' or gc_linked_plan == 'Pocketwire Summit') and gc_dd_1m >= K('gift_plan_dd_high_floor')) else (gc_redeem_points * gc_rate + (gc_redeem_points // K('gift_block_points')) * K('gift_block_bonus_cents') if ((gc_linked_plan == 'Pocketwire Plus' or gc_linked_plan == 'Pocketwire Prime' or gc_linked_plan == 'Pocketwire Onyx' or gc_linked_plan == 'Pocketwire Summit') and gc_dd_1m >= P('dd_boost_threshold')) else gc_redeem_points * gc_rate)"
      - result: "int(RND(gc_value_cents, 6)) / 100"
    compute_basis:
      gc_redeem_points: "A whole-balance gift card redemption is available only when none of the points balance is still pending, so that the whole balance is redeemable, and the points redeemed are then the points balance on the handling date rounded down to a whole multiple of redemption_increment_points"
      gc_earn_spend_3m: "The gift card spend measure is the spend carried by earning entries dated within the last three months less the spend carried by clawback entries dated within the same three months."
      gc_clawed_spend_3m: "The gift card spend measure is the spend carried by earning entries dated within the last three months less the spend carried by clawback entries dated within the same three months."
      gc_spend_measure: "A date lies within the last N months when it is later than the same calendar day N months before the handling date and not later than the handling date"
      gc_years: "the membership's whole years are the whole months from the enrolled_date to the handling date divided by twelve and rounded down."
      gc_engaged_lift: "The gift card engaged-spender lift is gift_engaged_lift_high US cents per point when the gift card spend measure is at least gift_engaged_high_spend and the membership has completed at least gift_engaged_high_years whole years; it is gift_engaged_lift_std cents per point when the member does not meet that first condition but the gift card spend measure is at least gift_engaged_std_spend and the membership has completed at least gift_engaged_std_years whole year; and it is nothing otherwise."
      gc_card_tier: "the member's active physical debit card"
      gc_card_lift: "The gift card card-tier lift is gift_card_lift_metal cents per point when the member's active physical debit card is a Pocketwire Visa Infinite Metal Debit card, gift_card_lift_premium cents per point when it is a Pocketwire Visa Infinite Debit or Pocketwire Visa Signature Debit card, and nothing when it is any other card or there is none."
      gc_redemptions_12m: "the ledger carries at least gift_redeemer_high_count gift card redemptions dated within the last twelve months"
      gc_redeemer_lift: "The gift card redeemer lift is gift_redeemer_lift_high cents per point when the ledger carries at least gift_redeemer_high_count gift card redemptions dated within the last twelve months, gift_redeemer_lift_std cents per point when it carries at least gift_redeemer_std_count but fewer than gift_redeemer_high_count, and nothing when it carries fewer than gift_redeemer_std_count; charity and cash redemptions are not counted."
      gc_boosts_12m: "the ledger carries at least gift_boost_high_count boost entries dated within the last twelve months"
      gc_boost_lift: "The gift card boost lift is gift_boost_lift_high cents per point when the ledger carries at least gift_boost_high_count boost entries dated within the last twelve months, gift_boost_lift_std cents per point when it carries at least gift_boost_std_count but fewer than gift_boost_high_count, and nothing when it carries none; boost activations that never earned are not counted."
      gc_rate: "The gift card rate is gift_card_cents_per_point plus the gift card engaged-spender lift, the gift card card-tier lift, the gift card redeemer lift and the gift card boost lift, all added together before the rate is applied to the points redeemed"
      gc_dd_1m: "received direct deposits totalling at least gift_plan_dd_high_floor within the last month"
      gc_linked_plan: "when it is on Pocketwire Onyx or Pocketwire Summit"
      gc_value_cents: "The gift card plan valuation depends on the linked personal account: when it is on Pocketwire Onyx or Pocketwire Summit and received direct deposits totalling at least gift_plan_dd_high_floor within the last month, the value is banded, the first gift_band_start_points points redeemed being valued at the gift card rate and every point beyond them at the gift card rate plus gift_band_extra_cents cents; when the account does not meet that first condition but is on Pocketwire Plus, Pocketwire Prime, Pocketwire Onyx or Pocketwire Summit and received direct deposits totalling at least dd_boost_threshold within the last month, the value is every point redeemed at the gift card rate plus a block bonus of gift_block_bonus_cents cents for every full gift_block_points points redeemed; otherwise the value is every point redeemed at the gift card rate."
      result: "the value is then worked out by the gift card plan valuation, in US cents, and divided by 100 and rounded down to the cent only once, at the end."
    factors:
      - id: gift_card_engaged_spender_lift
        effect: parameter
        decides: gc_engaged_lift
        bindings: [gc_earn_spend_3m, gc_clawed_spend_3m, gc_spend_measure, gc_years, gc_engaged_lift]
        ladder:
          - when: "a gift card spend measure of at least gift_engaged_high_spend and at least gift_engaged_high_years whole years of membership"
            value: "K('gift_engaged_lift_high')"
          - when: "the first condition is not met, a gift card spend measure of at least gift_engaged_std_spend and at least gift_engaged_std_years whole year of membership"
            value: "K('gift_engaged_lift_std')"
          - when: "otherwise"
            value: "0"
        baseline:
          gc_engaged_lift: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: gift_card_card_tier_lift
        effect: parameter
        decides: gc_card_lift
        bindings: [gc_card_tier, gc_card_lift]
        ladder:
          - when: "the active physical debit card is a Pocketwire Visa Infinite Metal Debit card"
            value: "K('gift_card_lift_metal')"
          - when: "the active physical debit card is a Pocketwire Visa Infinite Debit or Pocketwire Visa Signature Debit card"
            value: "K('gift_card_lift_premium')"
          - when: "otherwise"
            value: "0"
        baseline:
          gc_card_lift: "0"
        evidence: [cross_category]
        cross_difficulty: card
      - id: gift_card_redeemer_lift
        effect: parameter
        decides: gc_redeemer_lift
        bindings: [gc_redemptions_12m, gc_redeemer_lift]
        ladder:
          - when: "at least gift_redeemer_high_count gift card redemptions dated within the last twelve months"
            value: "K('gift_redeemer_lift_high')"
          - when: "at least gift_redeemer_std_count but fewer than gift_redeemer_high_count gift card redemptions dated within the last twelve months"
            value: "K('gift_redeemer_lift_std')"
          - when: "otherwise"
            value: "0"
        baseline:
          gc_redeemer_lift: "0"
        evidence: [history]
        cross_difficulty: null
      - id: gift_card_boost_lift
        effect: parameter
        decides: gc_boost_lift
        bindings: [gc_boosts_12m, gc_boost_lift]
        ladder:
          - when: "at least gift_boost_high_count boost entries dated within the last twelve months"
            value: "K('gift_boost_lift_high')"
          - when: "at least gift_boost_std_count but fewer than gift_boost_high_count boost entries dated within the last twelve months"
            value: "K('gift_boost_lift_std')"
          - when: "otherwise"
            value: "0"
        baseline:
          gc_boost_lift: "0"
        evidence: [history]
        cross_difficulty: null
      - id: gift_card_plan_valuation
        effect: method
        decides: gc_value_cents
        bindings: [gc_dd_1m, gc_linked_plan, gc_value_cents]
        ladder:
          - when: "the linked account is on Pocketwire Onyx or Pocketwire Summit and received direct deposits of at least gift_plan_dd_high_floor within the last month"
            method: "banded valuation: the first gift_band_start_points points at the gift card rate, every point beyond them at the gift card rate plus gift_band_extra_cents cents"
          - when: "the first condition is not met, the linked account is on a paid plan (Plus, Prime, Onyx or Summit) and received direct deposits of at least dd_boost_threshold within the last month"
            method: "block valuation: every point at the gift card rate plus gift_block_bonus_cents cents for each full gift_block_points points"
          - when: "otherwise"
            method: "flat valuation: every point at the gift card rate"
        baseline:
          gc_value_cents: "gc_redeem_points * gc_rate"
        evidence: [cross_category, history]
        cross_difficulty: wallet
    baseline:
      rule: >-
        A whole-balance gift card redemption is available only when none of the points balance is still pending, so that the whole balance is redeemable, and the points redeemed are then the points balance on the handling date rounded down to a whole multiple of redemption_increment_points; the redemption is booked as one entry carrying the gift card brand the member names.
        The standard gift card value is the points redeemed times gift_card_cents_per_point, divided by 100 and rounded down to the cent.
      params: [gift_card_cents_per_point, redemption_increment_points]
    inputs:
      history:
        - {table: rewards_ledger, aggregate: sum, field: spend_amount, within_months: 3, filters: {event_type: rewards_cashback_earned}}
        - {table: rewards_ledger, aggregate: sum, field: spend_amount, within_months: 3, filters: {event_type: rewards_clawback}}
        - {table: rewards_ledger, aggregate: count, field: rewards_entry_id, within_months: 12, filters: {event_type: rewards_redemption, redemption_type: gift_card}}
        - {table: rewards_ledger, aggregate: count, field: rewards_entry_id, within_months: 12, filters: {event_type: rewards_boost_earned}}
        - {category: wallet, table: wallet_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: wallet_direct_deposit}}
      cross_category: [card, wallet]

  - id: rewards_ext_late_fulfilment_courtesy_points
    base_policy_refs: [rewards_goodwill]
    overwrite:
      - base_policy: rewards_goodwill
        superseded_clause: >-
          The credit is goodwill_points_per_credit of the tier held on the credit date
        replaced_by: >-
          The courtesy credit is the courtesy amount in the form set by the courtesy redemption volume, plus the courtesy loyalty supplement, the courtesy card supplement, the courtesy plan supplement and the courtesy redemption supplement, all added together; the sum is the whole number of points credited.
    trigger: state_due
    subject: [rewards_goodwill_credit]
    computes: points
    target_tool: credit_late_fulfilment_courtesy_4e426c94
    params:
      courtesy_volume_high: 400000
      courtesy_volume_rate: 0.02
      courtesy_volume_std: 100000
      courtesy_blended_rate: 0.01
      courtesy_loyalty_high_years: 3
      courtesy_loyalty_high_spend: 40000
      courtesy_loyalty_std_years: 1
      courtesy_loyalty_std_spend: 15000
      courtesy_loyalty_supplement_high: 1500
      courtesy_loyalty_supplement_std: 500
      courtesy_card_supplement_metal: 1000
      courtesy_card_supplement_premium: 500
      courtesy_plan_supplement_summit: 750
      courtesy_plan_supplement_mid: 300
      courtesy_redemption_high_count: 4
      courtesy_redemption_std_count: 2
      courtesy_redemption_supplement_high: 500
      courtesy_redemption_supplement_std: 200
    rule: >-
      Courtesy points are credited only for a gift card or charity redemption that was fulfilled late: its fulfilment was recorded later than gift_card_fulfilment_business_days business days after the redemption date, or it is still unfulfilled and not reversed after that period, the fulfilment period being counted in Federal Reserve business days from the redemption date with the first business day after the redemption as day 1.
      A courtesy credit is booked as one entry against the late redemption, at most once per late redemption and at most goodwill_max_credits_per_year times over the rolling 365 days.
      The courtesy tier amount is the goodwill_points_per_credit of the tier held on the credit date, and the standard courtesy credit is that courtesy tier amount, in whole points.
      The courtesy credit is the courtesy amount in the form set by the courtesy redemption volume, plus the courtesy loyalty supplement, the courtesy card supplement, the courtesy plan supplement and the courtesy redemption supplement, all added together; the sum is the whole number of points credited.
      A date lies within the last N months when it is later than the same calendar day N months before the handling date and not later than the handling date, and the membership's whole years are the whole months from the enrolled_date to the handling date divided by twelve and rounded down.
      The courtesy redemption volume is the points of all redemption entries, of any kind, dated within the last twelve months.
      When the courtesy redemption volume is at least courtesy_volume_high, the courtesy amount is that volume times courtesy_volume_rate, rounded down to whole points, in place of the courtesy tier amount; when it is at least courtesy_volume_std but below courtesy_volume_high, the courtesy amount is the courtesy tier amount plus the volume above courtesy_volume_std times courtesy_blended_rate, the added part rounded down to whole points; when it is below courtesy_volume_std, the courtesy amount is the courtesy tier amount.
      Earning entries are the entries that credit base and category points on a card purchase; boost entries, which carry the same purchase's spend, are not earning entries.
      The courtesy loyalty spend is the spend carried by earning entries dated within the last twelve months less the spend carried by clawback entries dated within the same twelve months.
      The courtesy loyalty supplement is courtesy_loyalty_supplement_high points when the membership has completed at least courtesy_loyalty_high_years whole years and the courtesy loyalty spend is at least courtesy_loyalty_high_spend; it is courtesy_loyalty_supplement_std points when the member does not meet that first condition but the membership has completed at least courtesy_loyalty_std_years whole year and the courtesy loyalty spend is at least courtesy_loyalty_std_spend; and it is nothing otherwise.
      The courtesy card supplement is courtesy_card_supplement_metal points when the member's active physical debit card is a Pocketwire Visa Infinite Metal Debit card, courtesy_card_supplement_premium points when it is a Pocketwire Visa Infinite Debit or Pocketwire Visa Signature Debit card, and nothing when it is any other card or there is none.
      The courtesy plan supplement is courtesy_plan_supplement_summit points when the linked personal account is on Pocketwire Summit, courtesy_plan_supplement_mid points when it is on Pocketwire Onyx or Pocketwire Prime, and nothing on any other plan.
      The courtesy redemption supplement is courtesy_redemption_supplement_high points when the ledger carries at least courtesy_redemption_high_count redemptions of any kind dated within the last twelve months, courtesy_redemption_supplement_std points when it carries at least courtesy_redemption_std_count but fewer than courtesy_redemption_high_count, and nothing when it carries fewer than courtesy_redemption_std_count.
      No courtesy points are credited for any other complaint.
    prerequisite: []
    cross_category:
      - category: card
        as: branch
        reads: [variant_name, status, card_form]
        note: The courtesy card supplement is decided from the tier of the member's active physical debit card.
      - category: wallet
        as: branch
        reads: [variant_name]
        note: The courtesy plan supplement is decided from the linked personal account's plan.
    compute:
      - cty_volume_12m: "SUM('rewards_ledger', 'points', within_months=12, date_field='entry_date', event_type='rewards_redemption')"
      - cty_form: "int(cty_volume_12m * K('courtesy_volume_rate')) if cty_volume_12m >= K('courtesy_volume_high') else (P('goodwill_points_per_credit') + int((cty_volume_12m - K('courtesy_volume_std')) * K('courtesy_blended_rate')) if cty_volume_12m >= K('courtesy_volume_std') else P('goodwill_points_per_credit'))"
      - cty_earn_spend_12m: "SUM('rewards_ledger', 'spend_amount', within_months=12, date_field='entry_date', event_type='rewards_cashback_earned')"
      - cty_clawed_spend_12m: "SUM('rewards_ledger', 'spend_amount', within_months=12, date_field='entry_date', event_type='rewards_clawback')"
      - cty_loyalty_spend: "cty_earn_spend_12m - cty_clawed_spend_12m"
      - cty_years: "MONTHS(F('enrolled_date'), NOW) // 12"
      - cty_loyalty_supplement: "K('courtesy_loyalty_supplement_high') if (cty_years >= K('courtesy_loyalty_high_years') and cty_loyalty_spend >= K('courtesy_loyalty_high_spend')) else (K('courtesy_loyalty_supplement_std') if (cty_years >= K('courtesy_loyalty_std_years') and cty_loyalty_spend >= K('courtesy_loyalty_std_spend')) else 0)"
      - cty_card_tier: "CFIELD('card', 'variant_name', status='active', card_form='physical')"
      - cty_card_supplement: "K('courtesy_card_supplement_metal') if cty_card_tier == 'Pocketwire Visa Infinite Metal Debit' else (K('courtesy_card_supplement_premium') if (cty_card_tier == 'Pocketwire Visa Infinite Debit' or cty_card_tier == 'Pocketwire Visa Signature Debit') else 0)"
      - cty_linked_plan: "CFIELD('wallet', 'variant_name', wallet_id=F('wallet_id'))"
      - cty_plan_supplement: "K('courtesy_plan_supplement_summit') if cty_linked_plan == 'Pocketwire Summit' else (K('courtesy_plan_supplement_mid') if (cty_linked_plan == 'Pocketwire Onyx' or cty_linked_plan == 'Pocketwire Prime') else 0)"
      - cty_redemptions_12m: "COUNT('rewards_ledger', within_months=12, date_field='entry_date', event_type='rewards_redemption')"
      - cty_redemption_supplement: "K('courtesy_redemption_supplement_high') if cty_redemptions_12m >= K('courtesy_redemption_high_count') else (K('courtesy_redemption_supplement_std') if cty_redemptions_12m >= K('courtesy_redemption_std_count') else 0)"
      - result: "cty_form + cty_loyalty_supplement + cty_card_supplement + cty_plan_supplement + cty_redemption_supplement"
    compute_basis:
      cty_volume_12m: "The courtesy redemption volume is the points of all redemption entries, of any kind, dated within the last twelve months."
      cty_form: "When the courtesy redemption volume is at least courtesy_volume_high, the courtesy amount is that volume times courtesy_volume_rate, rounded down to whole points, in place of the courtesy tier amount; when it is at least courtesy_volume_std but below courtesy_volume_high, the courtesy amount is the courtesy tier amount plus the volume above courtesy_volume_std times courtesy_blended_rate, the added part rounded down to whole points; when it is below courtesy_volume_std, the courtesy amount is the courtesy tier amount."
      cty_earn_spend_12m: "The courtesy loyalty spend is the spend carried by earning entries dated within the last twelve months less the spend carried by clawback entries dated within the same twelve months."
      cty_clawed_spend_12m: "The courtesy loyalty spend is the spend carried by earning entries dated within the last twelve months less the spend carried by clawback entries dated within the same twelve months."
      cty_loyalty_spend: "A date lies within the last N months when it is later than the same calendar day N months before the handling date and not later than the handling date"
      cty_years: "the membership's whole years are the whole months from the enrolled_date to the handling date divided by twelve and rounded down."
      cty_loyalty_supplement: "The courtesy loyalty supplement is courtesy_loyalty_supplement_high points when the membership has completed at least courtesy_loyalty_high_years whole years and the courtesy loyalty spend is at least courtesy_loyalty_high_spend; it is courtesy_loyalty_supplement_std points when the member does not meet that first condition but the membership has completed at least courtesy_loyalty_std_years whole year and the courtesy loyalty spend is at least courtesy_loyalty_std_spend; and it is nothing otherwise."
      cty_card_tier: "the member's active physical debit card"
      cty_card_supplement: "The courtesy card supplement is courtesy_card_supplement_metal points when the member's active physical debit card is a Pocketwire Visa Infinite Metal Debit card, courtesy_card_supplement_premium points when it is a Pocketwire Visa Infinite Debit or Pocketwire Visa Signature Debit card, and nothing when it is any other card or there is none."
      cty_linked_plan: "the linked personal account is on Pocketwire Summit"
      cty_plan_supplement: "The courtesy plan supplement is courtesy_plan_supplement_summit points when the linked personal account is on Pocketwire Summit, courtesy_plan_supplement_mid points when it is on Pocketwire Onyx or Pocketwire Prime, and nothing on any other plan."
      cty_redemptions_12m: "the ledger carries at least courtesy_redemption_high_count redemptions of any kind dated within the last twelve months"
      cty_redemption_supplement: "The courtesy redemption supplement is courtesy_redemption_supplement_high points when the ledger carries at least courtesy_redemption_high_count redemptions of any kind dated within the last twelve months, courtesy_redemption_supplement_std points when it carries at least courtesy_redemption_std_count but fewer than courtesy_redemption_high_count, and nothing when it carries fewer than courtesy_redemption_std_count."
      result: "The courtesy credit is the courtesy amount in the form set by the courtesy redemption volume, plus the courtesy loyalty supplement, the courtesy card supplement, the courtesy plan supplement and the courtesy redemption supplement, all added together; the sum is the whole number of points credited."
    factors:
      - id: courtesy_volume_form
        effect: method
        decides: cty_form
        bindings: [cty_volume_12m, cty_form]
        ladder:
          - when: "a courtesy redemption volume of at least courtesy_volume_high"
            method: "volume-based: the volume times courtesy_volume_rate, rounded down, in place of the courtesy tier amount"
          - when: "a courtesy redemption volume of at least courtesy_volume_std but below courtesy_volume_high"
            method: "blended: the courtesy tier amount plus the volume above courtesy_volume_std times courtesy_blended_rate, the added part rounded down"
          - when: "otherwise"
            method: "flat: the courtesy tier amount"
        baseline:
          cty_form: "P('goodwill_points_per_credit')"
        evidence: [history]
        cross_difficulty: null
      - id: courtesy_loyalty_supplement
        effect: parameter
        decides: cty_loyalty_supplement
        bindings: [cty_earn_spend_12m, cty_clawed_spend_12m, cty_loyalty_spend, cty_years, cty_loyalty_supplement]
        ladder:
          - when: "at least courtesy_loyalty_high_years whole years of membership and a courtesy loyalty spend of at least courtesy_loyalty_high_spend"
            value: "K('courtesy_loyalty_supplement_high')"
          - when: "the first condition is not met, at least courtesy_loyalty_std_years whole year of membership and a courtesy loyalty spend of at least courtesy_loyalty_std_spend"
            value: "K('courtesy_loyalty_supplement_std')"
          - when: "otherwise"
            value: "0"
        baseline:
          cty_loyalty_supplement: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: courtesy_card_supplement
        effect: parameter
        decides: cty_card_supplement
        bindings: [cty_card_tier, cty_card_supplement]
        ladder:
          - when: "the active physical debit card is a Pocketwire Visa Infinite Metal Debit card"
            value: "K('courtesy_card_supplement_metal')"
          - when: "the active physical debit card is a Pocketwire Visa Infinite Debit or Pocketwire Visa Signature Debit card"
            value: "K('courtesy_card_supplement_premium')"
          - when: "otherwise"
            value: "0"
        baseline:
          cty_card_supplement: "0"
        evidence: [cross_category]
        cross_difficulty: card
      - id: courtesy_plan_supplement
        effect: parameter
        decides: cty_plan_supplement
        bindings: [cty_linked_plan, cty_plan_supplement]
        ladder:
          - when: "the linked personal account is on Pocketwire Summit"
            value: "K('courtesy_plan_supplement_summit')"
          - when: "the linked personal account is on Pocketwire Onyx or Pocketwire Prime"
            value: "K('courtesy_plan_supplement_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          cty_plan_supplement: "0"
        evidence: [cross_category]
        cross_difficulty: wallet
      - id: courtesy_redemption_supplement
        effect: parameter
        decides: cty_redemption_supplement
        bindings: [cty_redemptions_12m, cty_redemption_supplement]
        ladder:
          - when: "at least courtesy_redemption_high_count redemptions dated within the last twelve months"
            value: "K('courtesy_redemption_supplement_high')"
          - when: "at least courtesy_redemption_std_count but fewer than courtesy_redemption_high_count redemptions dated within the last twelve months"
            value: "K('courtesy_redemption_supplement_std')"
          - when: "otherwise"
            value: "0"
        baseline:
          cty_redemption_supplement: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The courtesy tier amount is the goodwill_points_per_credit of the tier held on the credit date, and the standard courtesy credit is that courtesy tier amount, in whole points.
      params: [goodwill_points_per_credit]
    inputs:
      history:
        - {table: rewards_ledger, aggregate: sum, field: points, within_months: 12, filters: {event_type: rewards_redemption}}
        - {table: rewards_ledger, aggregate: sum, field: spend_amount, within_months: 12, filters: {event_type: rewards_cashback_earned}}
        - {table: rewards_ledger, aggregate: sum, field: spend_amount, within_months: 12, filters: {event_type: rewards_clawback}}
        - {table: rewards_ledger, aggregate: count, field: rewards_entry_id, within_months: 12, filters: {event_type: rewards_redemption}}
      cross_category: [card, wallet]

  - id: rewards_ext_quarterly_milestone_bonus_amount
    base_policy_refs: [rewards_bonuses]
    overwrite:
      - base_policy: rewards_bonuses
        superseded_clause: >-
          The quarterly milestone bonus of milestone_bonus_points, at the tier held on the last day of a quarter, is credited once for that quarter when the quarter's qualifying spend reached milestone_quarterly_spend_threshold;
        replaced_by: >-
          The quarterly milestone bonus is owed for a calendar quarter once that quarter has ended, when the quarter's qualifying spend — the spend carried by earning entries dated in the quarter less the spend carried by clawback entries dated in the quarter — reached the milestone_quarterly_spend_threshold of the tier held on the quarter's last day, and it is booked as one entry carrying the quarter (YYYY-Qn) as its period.
      - base_policy: rewards_bonuses
        superseded_clause: >-
          A bonus is credited only if no earlier rewards_bonus row of the same bonus_type exists for the same bonus_period.
        replaced_by: >-
          A quarterly milestone bonus is credited only if the ledger carries no quarterly milestone bonus entry dated after the last day of the quarter it is for.
    trigger: state_due
    subject: [rewards_bonus]
    computes: points
    target_tool: credit_quarterly_milestone_bonus_7b7b30cf
    params:
      milestone_streak_long_count: 3
      milestone_streak_short_count: 1
      milestone_spend_based_rate: 1.5
      milestone_blended_rate: 0.5
      milestone_tenure_long_years: 5
      milestone_tenure_mid_years: 3
      milestone_tenure_supplement_long: 2500
      milestone_tenure_supplement_mid: 1200
      milestone_dd_high_floor: 9000
      milestone_dd_std_floor: 3000
      milestone_dd_supplement_high: 2000
      milestone_dd_supplement_std: 800
      milestone_card_supplement_metal: 1500
      milestone_card_supplement_premium: 750
      milestone_foreign_high_count: 4
      milestone_foreign_std_count: 1
      milestone_foreign_supplement_high: 900
      milestone_foreign_supplement_std: 350
      milestone_everyday_high_count: 10
      milestone_everyday_std_count: 4
      milestone_everyday_supplement_high: 600
      milestone_everyday_supplement_std: 250
    rule: >-
      The quarterly milestone bonus is owed for a calendar quarter once that quarter has ended, when the quarter's qualifying spend — the spend carried by earning entries dated in the quarter less the spend carried by clawback entries dated in the quarter — reached the milestone_quarterly_spend_threshold of the tier held on the quarter's last day, and it is booked as one entry carrying the quarter (YYYY-Qn) as its period.
      A quarterly milestone bonus is credited only if the ledger carries no quarterly milestone bonus entry dated after the last day of the quarter it is for.
      The milestone tier amount is the milestone_bonus_points of the tier held on the credit date, and the standard milestone bonus is that milestone tier amount, in whole points.
      A date lies within the last N months when it is later than the same calendar day N months before the handling date and not later than the handling date, and the membership's whole years are the whole months from the enrolled_date to the handling date divided by twelve and rounded down.
      Earning entries are the entries that credit base and category points on a card purchase; boost entries, which carry the same purchase's spend, are not earning entries.
      The milestone streak is the number of quarterly milestone bonus entries already dated within the last twelve months, and the milestone spend measure is the spend carried by earning entries dated within the last three months less the spend carried by clawback entries dated within the same three months.
      With a milestone streak of at least milestone_streak_long_count, the milestone bonus is computed on spend, as the milestone spend measure times milestone_spend_based_rate points per USD rounded down to whole points, in place of the milestone tier amount; with a milestone streak of at least milestone_streak_short_count but below milestone_streak_long_count, it is the milestone tier amount plus the milestone spend measure above the milestone_quarterly_spend_threshold of the tier held on the credit date times milestone_blended_rate points per USD, the added part rounded down to whole points and never below zero; with no milestone bonus entry in that period it is the milestone tier amount.
      The milestone tenure supplement is milestone_tenure_supplement_long points when the membership has completed at least milestone_tenure_long_years whole years, milestone_tenure_supplement_mid points when it has completed at least milestone_tenure_mid_years but fewer than milestone_tenure_long_years whole years, and nothing when it has completed fewer than milestone_tenure_mid_years whole years.
      The milestone direct-deposit supplement is milestone_dd_supplement_high points when the direct deposits received by the linked personal account within the last three months total at least milestone_dd_high_floor and that account is on Pocketwire Onyx or Pocketwire Summit; it is milestone_dd_supplement_std points when the account does not meet that first condition but its direct deposits within the last three months total at least milestone_dd_std_floor and it is on Pocketwire Plus, Pocketwire Prime, Pocketwire Onyx or Pocketwire Summit; and it is nothing otherwise.
      The milestone card supplement is milestone_card_supplement_metal points when the member's active physical debit card is a Pocketwire Visa Infinite Metal Debit card, milestone_card_supplement_premium points when it is a Pocketwire Visa Infinite Debit or Pocketwire Visa Signature Debit card, and nothing when it is any other card or there is none.
      The milestone travel-abroad supplement is milestone_foreign_supplement_high points when the member's debit cards carry at least milestone_foreign_high_count settled foreign purchases dated within the last twelve months, milestone_foreign_supplement_std points when they carry at least milestone_foreign_std_count but fewer than milestone_foreign_high_count, and nothing when they carry none.
      The milestone everyday-spend supplement is milestone_everyday_supplement_high points when the ledger carries at least milestone_everyday_high_count earning entries in the grocery or dining category dated within the last three months, milestone_everyday_supplement_std points when it carries at least milestone_everyday_std_count but fewer than milestone_everyday_high_count, and nothing when it carries fewer than milestone_everyday_std_count.
      The milestone tenure supplement, the milestone direct-deposit supplement, the milestone card supplement, the milestone travel-abroad supplement and the milestone everyday-spend supplement are added to the milestone bonus after its form is set by the streak, and the sum is the whole number of points credited.
      Bonus points are subject to points_pending_days like any other earning.
    prerequisite: []
    cross_category:
      - category: wallet
        as: history
        reads: [variant_name, wallet_transactions.amount]
        note: The milestone direct-deposit supplement is decided from the linked personal account's plan and its direct deposits over the last three months.
      - category: card
        as: history
        reads: [variant_name, status, card_form, card_transactions.is_foreign]
        note: The milestone card supplement is decided from the active physical card's tier and the travel-abroad supplement from the card ledger's foreign purchases.
    compute:
      - ms_streak: "COUNT('rewards_ledger', within_months=12, date_field='entry_date', event_type='rewards_bonus', bonus_type='quarterly_milestone')"
      - ms_earn_spend_3m: "SUM('rewards_ledger', 'spend_amount', within_months=3, date_field='entry_date', event_type='rewards_cashback_earned')"
      - ms_clawed_spend_3m: "SUM('rewards_ledger', 'spend_amount', within_months=3, date_field='entry_date', event_type='rewards_clawback')"
      - ms_spend_measure: "ms_earn_spend_3m - ms_clawed_spend_3m"
      - ms_form: "int(ms_spend_measure * K('milestone_spend_based_rate')) if ms_streak >= K('milestone_streak_long_count') else (P('milestone_bonus_points') + int(MX(0, ms_spend_measure - P('milestone_quarterly_spend_threshold')) * K('milestone_blended_rate')) if ms_streak >= K('milestone_streak_short_count') else P('milestone_bonus_points'))"
      - ms_years: "MONTHS(F('enrolled_date'), NOW) // 12"
      - ms_tenure_supplement: "K('milestone_tenure_supplement_long') if ms_years >= K('milestone_tenure_long_years') else (K('milestone_tenure_supplement_mid') if ms_years >= K('milestone_tenure_mid_years') else 0)"
      - ms_dd_3m: "XSUM('wallet', 'wallet_transactions', 'amount', within_months=3, date_field='txn_date', event_type='wallet_direct_deposit', wallet_id=F('wallet_id'))"
      - ms_linked_plan: "CFIELD('wallet', 'variant_name', wallet_id=F('wallet_id'))"
      - ms_dd_supplement: "K('milestone_dd_supplement_high') if (ms_dd_3m >= K('milestone_dd_high_floor') and (ms_linked_plan == 'Pocketwire Onyx' or ms_linked_plan == 'Pocketwire Summit')) else (K('milestone_dd_supplement_std') if (ms_dd_3m >= K('milestone_dd_std_floor') and (ms_linked_plan == 'Pocketwire Plus' or ms_linked_plan == 'Pocketwire Prime' or ms_linked_plan == 'Pocketwire Onyx' or ms_linked_plan == 'Pocketwire Summit')) else 0)"
      - ms_card_tier: "CFIELD('card', 'variant_name', status='active', card_form='physical')"
      - ms_card_supplement: "K('milestone_card_supplement_metal') if ms_card_tier == 'Pocketwire Visa Infinite Metal Debit' else (K('milestone_card_supplement_premium') if (ms_card_tier == 'Pocketwire Visa Infinite Debit' or ms_card_tier == 'Pocketwire Visa Signature Debit') else 0)"
      - ms_foreign_12m: "XCOUNT('card', 'card_transactions', within_months=12, date_field='txn_date', event_type='card_purchase', is_foreign=True)"
      - ms_foreign_supplement: "K('milestone_foreign_supplement_high') if ms_foreign_12m >= K('milestone_foreign_high_count') else (K('milestone_foreign_supplement_std') if ms_foreign_12m >= K('milestone_foreign_std_count') else 0)"
      - ms_everyday_3m: "COUNT('rewards_ledger', within_months=3, date_field='entry_date', event_type='rewards_cashback_earned', merchant_category='grocery') + COUNT('rewards_ledger', within_months=3, date_field='entry_date', event_type='rewards_cashback_earned', merchant_category='dining')"
      - ms_everyday_supplement: "K('milestone_everyday_supplement_high') if ms_everyday_3m >= K('milestone_everyday_high_count') else (K('milestone_everyday_supplement_std') if ms_everyday_3m >= K('milestone_everyday_std_count') else 0)"
      - result: "ms_form + ms_tenure_supplement + ms_dd_supplement + ms_card_supplement + ms_foreign_supplement + ms_everyday_supplement"
    compute_basis:
      ms_streak: "The milestone streak is the number of quarterly milestone bonus entries already dated within the last twelve months"
      ms_earn_spend_3m: "the milestone spend measure is the spend carried by earning entries dated within the last three months less the spend carried by clawback entries dated within the same three months."
      ms_clawed_spend_3m: "the milestone spend measure is the spend carried by earning entries dated within the last three months less the spend carried by clawback entries dated within the same three months."
      ms_spend_measure: "A date lies within the last N months when it is later than the same calendar day N months before the handling date and not later than the handling date"
      ms_form: "With a milestone streak of at least milestone_streak_long_count, the milestone bonus is computed on spend, as the milestone spend measure times milestone_spend_based_rate points per USD rounded down to whole points, in place of the milestone tier amount; with a milestone streak of at least milestone_streak_short_count but below milestone_streak_long_count, it is the milestone tier amount plus the milestone spend measure above the milestone_quarterly_spend_threshold of the tier held on the credit date times milestone_blended_rate points per USD, the added part rounded down to whole points and never below zero; with no milestone bonus entry in that period it is the milestone tier amount."
      ms_years: "the membership's whole years are the whole months from the enrolled_date to the handling date divided by twelve and rounded down."
      ms_tenure_supplement: "The milestone tenure supplement is milestone_tenure_supplement_long points when the membership has completed at least milestone_tenure_long_years whole years, milestone_tenure_supplement_mid points when it has completed at least milestone_tenure_mid_years but fewer than milestone_tenure_long_years whole years, and nothing when it has completed fewer than milestone_tenure_mid_years whole years."
      ms_dd_3m: "the direct deposits received by the linked personal account within the last three months"
      ms_linked_plan: "that account is on Pocketwire Onyx or Pocketwire Summit"
      ms_dd_supplement: "The milestone direct-deposit supplement is milestone_dd_supplement_high points when the direct deposits received by the linked personal account within the last three months total at least milestone_dd_high_floor and that account is on Pocketwire Onyx or Pocketwire Summit; it is milestone_dd_supplement_std points when the account does not meet that first condition but its direct deposits within the last three months total at least milestone_dd_std_floor and it is on Pocketwire Plus, Pocketwire Prime, Pocketwire Onyx or Pocketwire Summit; and it is nothing otherwise."
      ms_card_tier: "the member's active physical debit card"
      ms_card_supplement: "The milestone card supplement is milestone_card_supplement_metal points when the member's active physical debit card is a Pocketwire Visa Infinite Metal Debit card, milestone_card_supplement_premium points when it is a Pocketwire Visa Infinite Debit or Pocketwire Visa Signature Debit card, and nothing when it is any other card or there is none."
      ms_foreign_12m: "the member's debit cards carry at least milestone_foreign_high_count settled foreign purchases dated within the last twelve months"
      ms_foreign_supplement: "The milestone travel-abroad supplement is milestone_foreign_supplement_high points when the member's debit cards carry at least milestone_foreign_high_count settled foreign purchases dated within the last twelve months, milestone_foreign_supplement_std points when they carry at least milestone_foreign_std_count but fewer than milestone_foreign_high_count, and nothing when they carry none."
      ms_everyday_3m: "the ledger carries at least milestone_everyday_high_count earning entries in the grocery or dining category dated within the last three months"
      ms_everyday_supplement: "The milestone everyday-spend supplement is milestone_everyday_supplement_high points when the ledger carries at least milestone_everyday_high_count earning entries in the grocery or dining category dated within the last three months, milestone_everyday_supplement_std points when it carries at least milestone_everyday_std_count but fewer than milestone_everyday_high_count, and nothing when it carries fewer than milestone_everyday_std_count."
      result: "The milestone tenure supplement, the milestone direct-deposit supplement, the milestone card supplement, the milestone travel-abroad supplement and the milestone everyday-spend supplement are added to the milestone bonus after its form is set by the streak, and the sum is the whole number of points credited."
    factors:
      - id: milestone_streak_form
        effect: method
        decides: ms_form
        bindings: [ms_streak, ms_earn_spend_3m, ms_clawed_spend_3m, ms_spend_measure, ms_form]
        ladder:
          - when: "a milestone streak of at least milestone_streak_long_count"
            method: "spend-based: the milestone spend measure times milestone_spend_based_rate points per USD, rounded down, in place of the milestone tier amount"
          - when: "a milestone streak of at least milestone_streak_short_count but below milestone_streak_long_count"
            method: "blended: the milestone tier amount plus the spend measure above the tier's milestone threshold times milestone_blended_rate, the added part rounded down and never below zero"
          - when: "otherwise"
            method: "flat: the milestone tier amount"
        baseline:
          ms_form: "P('milestone_bonus_points')"
        evidence: [history]
        cross_difficulty: null
      - id: milestone_tenure_supplement
        effect: parameter
        decides: ms_tenure_supplement
        bindings: [ms_years, ms_tenure_supplement]
        ladder:
          - when: "at least milestone_tenure_long_years whole years of membership"
            value: "K('milestone_tenure_supplement_long')"
          - when: "at least milestone_tenure_mid_years but fewer than milestone_tenure_long_years whole years"
            value: "K('milestone_tenure_supplement_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          ms_tenure_supplement: "0"
        evidence: [date]
        cross_difficulty: null
      - id: milestone_direct_deposit_supplement
        effect: parameter
        decides: ms_dd_supplement
        bindings: [ms_dd_3m, ms_linked_plan, ms_dd_supplement]
        ladder:
          - when: "direct deposits within the last three months of at least milestone_dd_high_floor and the linked account on Pocketwire Onyx or Pocketwire Summit"
            value: "K('milestone_dd_supplement_high')"
          - when: "the first condition is not met, direct deposits within the last three months of at least milestone_dd_std_floor and the linked account on a paid plan (Plus, Prime, Onyx or Summit)"
            value: "K('milestone_dd_supplement_std')"
          - when: "otherwise"
            value: "0"
        baseline:
          ms_dd_supplement: "0"
        evidence: [cross_category, history]
        cross_difficulty: wallet
      - id: milestone_card_supplement
        effect: parameter
        decides: ms_card_supplement
        bindings: [ms_card_tier, ms_card_supplement]
        ladder:
          - when: "the active physical debit card is a Pocketwire Visa Infinite Metal Debit card"
            value: "K('milestone_card_supplement_metal')"
          - when: "the active physical debit card is a Pocketwire Visa Infinite Debit or Pocketwire Visa Signature Debit card"
            value: "K('milestone_card_supplement_premium')"
          - when: "otherwise"
            value: "0"
        baseline:
          ms_card_supplement: "0"
        evidence: [cross_category]
        cross_difficulty: card
      - id: milestone_travel_abroad_supplement
        effect: parameter
        decides: ms_foreign_supplement
        bindings: [ms_foreign_12m, ms_foreign_supplement]
        ladder:
          - when: "at least milestone_foreign_high_count settled foreign card purchases dated within the last twelve months"
            value: "K('milestone_foreign_supplement_high')"
          - when: "at least milestone_foreign_std_count but fewer than milestone_foreign_high_count settled foreign card purchases dated within the last twelve months"
            value: "K('milestone_foreign_supplement_std')"
          - when: "otherwise"
            value: "0"
        baseline:
          ms_foreign_supplement: "0"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: milestone_everyday_spend_supplement
        effect: parameter
        decides: ms_everyday_supplement
        bindings: [ms_everyday_3m, ms_everyday_supplement]
        ladder:
          - when: "at least milestone_everyday_high_count grocery or dining earning entries dated within the last three months"
            value: "K('milestone_everyday_supplement_high')"
          - when: "at least milestone_everyday_std_count but fewer than milestone_everyday_high_count grocery or dining earning entries dated within the last three months"
            value: "K('milestone_everyday_supplement_std')"
          - when: "otherwise"
            value: "0"
        baseline:
          ms_everyday_supplement: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The milestone tier amount is the milestone_bonus_points of the tier held on the credit date, and the standard milestone bonus is that milestone tier amount, in whole points.
      params: [milestone_bonus_points]
    inputs:
      history:
        - {table: rewards_ledger, aggregate: count, field: rewards_entry_id, within_months: 12, filters: {event_type: rewards_bonus, bonus_type: quarterly_milestone}}
        - {table: rewards_ledger, aggregate: sum, field: spend_amount, within_months: 3, filters: {event_type: rewards_cashback_earned}}
        - {table: rewards_ledger, aggregate: sum, field: spend_amount, within_months: 3, filters: {event_type: rewards_clawback}}
        - {table: rewards_ledger, aggregate: count, field: rewards_entry_id, within_months: 3, filters: {event_type: rewards_cashback_earned, merchant_category: grocery}}
        - {table: rewards_ledger, aggregate: count, field: rewards_entry_id, within_months: 3, filters: {event_type: rewards_cashback_earned, merchant_category: dining}}
        - {category: wallet, table: wallet_transactions, aggregate: sum, field: amount, within_months: 3, filters: {event_type: wallet_direct_deposit}}
        - {category: card, table: card_transactions, aggregate: count, field: card_txn_id, within_months: 12, filters: {event_type: card_purchase, is_foreign: true}}
      cross_category: [wallet, card]

  - id: rewards_ext_whole_balance_charity_value
    base_policy_refs: [rewards_redemption_rules]
    overwrite:
      - base_policy: rewards_redemption_rules
        superseded_clause: >-
          donation value points times charity_cents_per_point
        replaced_by: >-
          The charity rate is charity_cents_per_point plus the charity giving lift, the charity account-age lift, the charity spend lift, the charity deposit lift and the charity card-activity lift, all added together before the rate is applied to the points donated; the value is then worked out by the charity valuation, in US cents, and divided by 100 and rounded down to the cent only once, at the end.
    trigger: on_request
    subject: [rewards_redemption]
    computes: cash_value
    target_tool: donate_points_to_charity_56fec22b
    params:
      charity_giving_high_count: 2
      charity_giving_high_years: 3
      charity_giving_std_count: 1
      charity_giving_std_years: 1
      charity_giving_lift_high: 0.20
      charity_giving_lift_std: 0.10
      charity_account_age_long_months: 60
      charity_account_age_mid_months: 24
      charity_account_age_lift_long: 0.08
      charity_account_age_lift_mid: 0.04
      charity_spend_high: 15000
      charity_spend_std: 6000
      charity_spend_lift_high: 0.10
      charity_spend_lift_std: 0.05
      charity_deposit_high_floor: 5000
      charity_deposit_lift_high: 0.06
      charity_deposit_lift_std: 0.03
      charity_activity_high_count: 30
      charity_activity_std_count: 12
      charity_activity_lift_high: 0.05
      charity_activity_lift_std: 0.02
      charity_band_count: 5
      charity_band_start_points: 20000
      charity_band_extra_cents: 0.10
      charity_block_count: 2
      charity_block_points: 10000
      charity_block_bonus_cents: 200
    rule: >-
      Points can be redeemed only while the membership status is active, and only redeemable points can be redeemed; a charity redemption goes only to one of partner_charities, and Pocketwire's own matching donation of charity_match_pct is never credited to the member.
      A whole-balance charity donation is available only when none of the points balance is still pending, so that the whole balance is redeemable, and the points donated are then the points balance on the handling date rounded down to a whole multiple of redemption_increment_points; the donation is booked as one entry carrying the partner charity the member names.
      A whole-balance charity donation is recorded only after the ledger carries the courtesy credit owed for every gift card or charity redemption fulfilled later than its fulfilment period.
      Before a whole-balance charity donation is valued, the ledger must carry the quarterly milestone bonus for every ended quarter whose qualifying spend reached the milestone.
      The standard donation value is the points donated times charity_cents_per_point, divided by 100 and rounded down to the cent.
      The charity rate is charity_cents_per_point plus the charity giving lift, the charity account-age lift, the charity spend lift, the charity deposit lift and the charity card-activity lift, all added together before the rate is applied to the points donated; the value is then worked out by the charity valuation, in US cents, and divided by 100 and rounded down to the cent only once, at the end.
      A date lies within the last N months when it is later than the same calendar day N months before the handling date and not later than the handling date, and the membership's whole years are the whole months from the enrolled_date to the handling date divided by twelve and rounded down.
      Earning entries are the entries that credit base and category points on a card purchase; boost entries, which carry the same purchase's spend, are not earning entries.
      The charity giving lift is charity_giving_lift_high US cents per point when the ledger carries at least charity_giving_high_count charity redemptions dated within the last twelve months and the membership has completed at least charity_giving_high_years whole years; it is charity_giving_lift_std cents per point when the member does not meet that first condition but the ledger carries at least charity_giving_std_count charity redemption dated within the last twelve months and the membership has completed at least charity_giving_std_years whole year; and it is nothing otherwise.
      The charity account-age lift is charity_account_age_lift_long cents per point when the linked personal account has been open for at least charity_account_age_long_months whole months on the handling date, charity_account_age_lift_mid cents per point when it has been open for at least charity_account_age_mid_months but fewer than charity_account_age_long_months whole months, and nothing when it has been open for fewer.
      The charity spend measure is the spend carried by earning entries dated within the last three months less the spend carried by clawback entries dated within the same three months; the charity spend lift is charity_spend_lift_high cents per point when that measure is at least charity_spend_high, charity_spend_lift_std cents per point when it is at least charity_spend_std but below charity_spend_high, and nothing when it is below charity_spend_std.
      The charity deposit lift is charity_deposit_lift_high cents per point when the direct deposits received by the linked personal account within the last month total at least charity_deposit_high_floor, charity_deposit_lift_std cents per point when they total at least dd_boost_threshold but less than charity_deposit_high_floor, and nothing when they total less than dd_boost_threshold.
      The charity card-activity lift is charity_activity_lift_high cents per point when the member's debit cards carry at least charity_activity_high_count settled purchases dated within the last three months, charity_activity_lift_std cents per point when they carry at least charity_activity_std_count but fewer than charity_activity_high_count, and nothing when they carry fewer than charity_activity_std_count.
      The charity valuation depends on the redemptions of any kind dated within the last twelve months: with at least charity_band_count of them the value is banded, the first charity_band_start_points points donated being valued at the charity rate and every point beyond them at the charity rate plus charity_band_extra_cents cents; with at least charity_block_count but fewer than charity_band_count of them the value is every point donated at the charity rate plus a block bonus of charity_block_bonus_cents cents for every full charity_block_points points donated; with fewer than charity_block_count the value is every point donated at the charity rate.
    prerequisite:
      - problem: rewards_ext_late_fulfilment_courtesy_points
        kind: value_input
        gate: ch_donate_points
        form: state
        policy_source: >-
          A whole-balance charity donation is recorded only after the ledger carries the courtesy credit owed for every gift card or charity redemption fulfilled later than its fulfilment period.
        condition: >-
          Every gift_card or charity rewards_redemption whose rewards_gift_card_fulfilled entry is dated later than gift_card_fulfilment_business_days business days after the redemption date (or that is still unfulfilled and not reversed after that period) has a rewards_goodwill_credit entry whose source_txn_id is that redemption, within goodwill_max_credits_per_year over the rolling 365 days, and the points_balance includes it.
        resolved_by: credit_late_fulfilment_courtesy_4e426c94
        effect: >-
          The courtesy credit raises the points balance, and courtesy points are not pending, so the points donated (ch_donate_points) rise by the courtesy points rounded to the increment, and the donation value rises with them.
      - problem: rewards_ext_quarterly_milestone_bonus_amount
        kind: value_input
        gate: ch_donate_points
        form: state
        policy_source: >-
          Before a whole-balance charity donation is valued, the ledger must carry the quarterly milestone bonus for every ended quarter whose qualifying spend reached the milestone.
        condition: >-
          For every ended calendar quarter whose qualifying spend reached the milestone_quarterly_spend_threshold of the tier held on its last day, the ledger carries a rewards_bonus entry of bonus_type quarterly_milestone dated after that quarter's last day, and the points_balance includes it.
        resolved_by: credit_quarterly_milestone_bonus_7b7b30cf
        effect: >-
          The milestone bonus raises the points balance; on tiers whose points_pending_days is 0 it is redeemable at once, so the points donated (ch_donate_points) rise by the bonus points rounded to the increment, and the donation value rises with them.
    cross_category:
      - category: wallet
        as: history
        reads: [opened_date, wallet_transactions.amount]
        note: The charity account-age lift is decided from the linked personal account's opening date and the charity deposit lift from its direct deposits over the last month.
      - category: card
        as: history
        reads: [card_transactions.event_type, card_transactions.txn_date]
        note: The charity card-activity lift is decided from the settled purchases on the member's debit cards over the last three months.
    compute:
      - ch_donate_points: "int(MX(0, F('points_balance')) // P('redemption_increment_points')) * P('redemption_increment_points')"
      - ch_charity_12m: "COUNT('rewards_ledger', within_months=12, date_field='entry_date', event_type='rewards_redemption', redemption_type='charity')"
      - ch_years: "MONTHS(F('enrolled_date'), NOW) // 12"
      - ch_giving_lift: "K('charity_giving_lift_high') if (ch_charity_12m >= K('charity_giving_high_count') and ch_years >= K('charity_giving_high_years')) else (K('charity_giving_lift_std') if (ch_charity_12m >= K('charity_giving_std_count') and ch_years >= K('charity_giving_std_years')) else 0)"
      - ch_account_months: "MONTHS(CFIELD('wallet', 'opened_date', wallet_id=F('wallet_id')), NOW)"
      - ch_account_age_lift: "K('charity_account_age_lift_long') if ch_account_months >= K('charity_account_age_long_months') else (K('charity_account_age_lift_mid') if ch_account_months >= K('charity_account_age_mid_months') else 0)"
      - ch_earn_spend_3m: "SUM('rewards_ledger', 'spend_amount', within_months=3, date_field='entry_date', event_type='rewards_cashback_earned')"
      - ch_clawed_spend_3m: "SUM('rewards_ledger', 'spend_amount', within_months=3, date_field='entry_date', event_type='rewards_clawback')"
      - ch_spend_measure: "ch_earn_spend_3m - ch_clawed_spend_3m"
      - ch_spend_lift: "K('charity_spend_lift_high') if ch_spend_measure >= K('charity_spend_high') else (K('charity_spend_lift_std') if ch_spend_measure >= K('charity_spend_std') else 0)"
      - ch_dd_1m: "XSUM('wallet', 'wallet_transactions', 'amount', within_months=1, date_field='txn_date', event_type='wallet_direct_deposit', wallet_id=F('wallet_id'))"
      - ch_deposit_lift: "K('charity_deposit_lift_high') if ch_dd_1m >= K('charity_deposit_high_floor') else (K('charity_deposit_lift_std') if ch_dd_1m >= P('dd_boost_threshold') else 0)"
      - ch_card_purchases_3m: "XCOUNT('card', 'card_transactions', within_months=3, date_field='txn_date', event_type='card_purchase')"
      - ch_activity_lift: "K('charity_activity_lift_high') if ch_card_purchases_3m >= K('charity_activity_high_count') else (K('charity_activity_lift_std') if ch_card_purchases_3m >= K('charity_activity_std_count') else 0)"
      - ch_rate: "P('charity_cents_per_point') + ch_giving_lift + ch_account_age_lift + ch_spend_lift + ch_deposit_lift + ch_activity_lift"
      - ch_redemptions_12m: "COUNT('rewards_ledger', within_months=12, date_field='entry_date', event_type='rewards_redemption')"
      - ch_value_cents: "ch_donate_points * ch_rate + MX(0, ch_donate_points - K('charity_band_start_points')) * K('charity_band_extra_cents') if ch_redemptions_12m >= K('charity_band_count') else (ch_donate_points * ch_rate + (ch_donate_points // K('charity_block_points')) * K('charity_block_bonus_cents') if ch_redemptions_12m >= K('charity_block_count') else ch_donate_points * ch_rate)"
      - result: "int(RND(ch_value_cents, 6)) / 100"
    compute_basis:
      ch_donate_points: "A whole-balance charity donation is available only when none of the points balance is still pending, so that the whole balance is redeemable, and the points donated are then the points balance on the handling date rounded down to a whole multiple of redemption_increment_points"
      ch_charity_12m: "the ledger carries at least charity_giving_high_count charity redemptions dated within the last twelve months"
      ch_years: "the membership's whole years are the whole months from the enrolled_date to the handling date divided by twelve and rounded down."
      ch_giving_lift: "The charity giving lift is charity_giving_lift_high US cents per point when the ledger carries at least charity_giving_high_count charity redemptions dated within the last twelve months and the membership has completed at least charity_giving_high_years whole years; it is charity_giving_lift_std cents per point when the member does not meet that first condition but the ledger carries at least charity_giving_std_count charity redemption dated within the last twelve months and the membership has completed at least charity_giving_std_years whole year; and it is nothing otherwise."
      ch_account_months: "the linked personal account has been open for at least charity_account_age_long_months whole months on the handling date"
      ch_account_age_lift: "The charity account-age lift is charity_account_age_lift_long cents per point when the linked personal account has been open for at least charity_account_age_long_months whole months on the handling date, charity_account_age_lift_mid cents per point when it has been open for at least charity_account_age_mid_months but fewer than charity_account_age_long_months whole months, and nothing when it has been open for fewer."
      ch_earn_spend_3m: "The charity spend measure is the spend carried by earning entries dated within the last three months less the spend carried by clawback entries dated within the same three months"
      ch_clawed_spend_3m: "The charity spend measure is the spend carried by earning entries dated within the last three months less the spend carried by clawback entries dated within the same three months"
      ch_spend_measure: "A date lies within the last N months when it is later than the same calendar day N months before the handling date and not later than the handling date"
      ch_spend_lift: "the charity spend lift is charity_spend_lift_high cents per point when that measure is at least charity_spend_high, charity_spend_lift_std cents per point when it is at least charity_spend_std but below charity_spend_high, and nothing when it is below charity_spend_std."
      ch_dd_1m: "the direct deposits received by the linked personal account within the last month"
      ch_deposit_lift: "The charity deposit lift is charity_deposit_lift_high cents per point when the direct deposits received by the linked personal account within the last month total at least charity_deposit_high_floor, charity_deposit_lift_std cents per point when they total at least dd_boost_threshold but less than charity_deposit_high_floor, and nothing when they total less than dd_boost_threshold."
      ch_card_purchases_3m: "the member's debit cards carry at least charity_activity_high_count settled purchases dated within the last three months"
      ch_activity_lift: "The charity card-activity lift is charity_activity_lift_high cents per point when the member's debit cards carry at least charity_activity_high_count settled purchases dated within the last three months, charity_activity_lift_std cents per point when they carry at least charity_activity_std_count but fewer than charity_activity_high_count, and nothing when they carry fewer than charity_activity_std_count."
      ch_rate: "The charity rate is charity_cents_per_point plus the charity giving lift, the charity account-age lift, the charity spend lift, the charity deposit lift and the charity card-activity lift, all added together before the rate is applied to the points donated"
      ch_redemptions_12m: "The charity valuation depends on the redemptions of any kind dated within the last twelve months"
      ch_value_cents: "with at least charity_band_count of them the value is banded, the first charity_band_start_points points donated being valued at the charity rate and every point beyond them at the charity rate plus charity_band_extra_cents cents; with at least charity_block_count but fewer than charity_band_count of them the value is every point donated at the charity rate plus a block bonus of charity_block_bonus_cents cents for every full charity_block_points points donated; with fewer than charity_block_count the value is every point donated at the charity rate."
      result: "the value is then worked out by the charity valuation, in US cents, and divided by 100 and rounded down to the cent only once, at the end."
    factors:
      - id: charity_giving_lift
        effect: parameter
        decides: ch_giving_lift
        bindings: [ch_charity_12m, ch_years, ch_giving_lift]
        ladder:
          - when: "at least charity_giving_high_count charity redemptions dated within the last twelve months and at least charity_giving_high_years whole years of membership"
            value: "K('charity_giving_lift_high')"
          - when: "the first condition is not met, at least charity_giving_std_count charity redemption dated within the last twelve months and at least charity_giving_std_years whole year of membership"
            value: "K('charity_giving_lift_std')"
          - when: "otherwise"
            value: "0"
        baseline:
          ch_giving_lift: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: charity_account_age_lift
        effect: parameter
        decides: ch_account_age_lift
        bindings: [ch_account_months, ch_account_age_lift]
        ladder:
          - when: "the linked personal account open for at least charity_account_age_long_months whole months"
            value: "K('charity_account_age_lift_long')"
          - when: "open for at least charity_account_age_mid_months but fewer than charity_account_age_long_months whole months"
            value: "K('charity_account_age_lift_mid')"
          - when: "otherwise"
            value: "0"
        baseline:
          ch_account_age_lift: "0"
        evidence: [cross_category, date]
        cross_difficulty: wallet
      - id: charity_spend_lift
        effect: parameter
        decides: ch_spend_lift
        bindings: [ch_earn_spend_3m, ch_clawed_spend_3m, ch_spend_measure, ch_spend_lift]
        ladder:
          - when: "a charity spend measure of at least charity_spend_high"
            value: "K('charity_spend_lift_high')"
          - when: "a charity spend measure of at least charity_spend_std but below charity_spend_high"
            value: "K('charity_spend_lift_std')"
          - when: "otherwise"
            value: "0"
        baseline:
          ch_spend_lift: "0"
        evidence: [history]
        cross_difficulty: null
      - id: charity_deposit_lift
        effect: parameter
        decides: ch_deposit_lift
        bindings: [ch_dd_1m, ch_deposit_lift]
        ladder:
          - when: "direct deposits within the last month of at least charity_deposit_high_floor"
            value: "K('charity_deposit_lift_high')"
          - when: "direct deposits within the last month of at least dd_boost_threshold but less than charity_deposit_high_floor"
            value: "K('charity_deposit_lift_std')"
          - when: "otherwise"
            value: "0"
        baseline:
          ch_deposit_lift: "0"
        evidence: [cross_category, history]
        cross_difficulty: wallet
      - id: charity_card_activity_lift
        effect: parameter
        decides: ch_activity_lift
        bindings: [ch_card_purchases_3m, ch_activity_lift]
        ladder:
          - when: "at least charity_activity_high_count settled card purchases dated within the last three months"
            value: "K('charity_activity_lift_high')"
          - when: "at least charity_activity_std_count but fewer than charity_activity_high_count settled card purchases dated within the last three months"
            value: "K('charity_activity_lift_std')"
          - when: "otherwise"
            value: "0"
        baseline:
          ch_activity_lift: "0"
        evidence: [cross_category, history]
        cross_difficulty: card
      - id: charity_valuation
        effect: method
        decides: ch_value_cents
        bindings: [ch_redemptions_12m, ch_value_cents]
        ladder:
          - when: "at least charity_band_count redemptions of any kind dated within the last twelve months"
            method: "banded valuation: the first charity_band_start_points points at the charity rate, every point beyond them at the charity rate plus charity_band_extra_cents cents"
          - when: "at least charity_block_count but fewer than charity_band_count redemptions dated within the last twelve months"
            method: "block valuation: every point at the charity rate plus charity_block_bonus_cents cents for each full charity_block_points points"
          - when: "otherwise"
            method: "flat valuation: every point at the charity rate"
        baseline:
          ch_value_cents: "ch_donate_points * ch_rate"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A whole-balance charity donation is available only when none of the points balance is still pending, so that the whole balance is redeemable, and the points donated are then the points balance on the handling date rounded down to a whole multiple of redemption_increment_points; the donation is booked as one entry carrying the partner charity the member names.
        The standard donation value is the points donated times charity_cents_per_point, divided by 100 and rounded down to the cent.
      params: [charity_cents_per_point, redemption_increment_points]
    inputs:
      history:
        - {table: rewards_ledger, aggregate: count, field: rewards_entry_id, within_months: 12, filters: {event_type: rewards_redemption, redemption_type: charity}}
        - {table: rewards_ledger, aggregate: sum, field: spend_amount, within_months: 3, filters: {event_type: rewards_cashback_earned}}
        - {table: rewards_ledger, aggregate: sum, field: spend_amount, within_months: 3, filters: {event_type: rewards_clawback}}
        - {table: rewards_ledger, aggregate: count, field: rewards_entry_id, within_months: 12, filters: {event_type: rewards_redemption}}
        - {category: wallet, table: wallet_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: wallet_direct_deposit}}
        - {category: card, table: card_transactions, aggregate: count, field: card_txn_id, within_months: 3, filters: {event_type: card_purchase}}
      cross_category: [wallet, card]
