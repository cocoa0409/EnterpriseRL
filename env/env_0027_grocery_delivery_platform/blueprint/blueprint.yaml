name: env_0027_grocery_delivery_platform
company: Cartwise

background: |
  Cartwise is a US grocery delivery and pickup platform that lets households order from more than 1,400 partner
  supermarkets, warehouse clubs and specialty grocers in 38 states, with the orders shopped and delivered by
  independent-contractor shoppers. The company serves roughly 9 million active customers and about 260,000 active
  shoppers, and its support desk speaks in a plain, practical and friendly voice to both sides of the marketplace.
  Customers hold a Cartwise+ membership on one of six plans: Cartwise+ Assist Monthly, Cartwise+ Student Monthly,
  Cartwise+ Monthly, Cartwise+ Annual, Cartwise+ Family Annual and Cartwise+ Premier Annual; a membership is billed a
  period fee every month or year and books credit back and Priority Delivery upgrades as it is used. Every order is
  its own record at one of six service levels: Curbside Pickup, No-Rush Delivery, Standard Delivery, Priority
  Delivery, Express 30 Delivery and Stock-Up Delivery; each order books its item lines, substitutions, fees, fee
  waivers, refunds and tip as they happen. Shoppers hold a contractor account at one of six levels: Shop-Only Shopper,
  Full-Service Shopper, Full-Service Shopper Silver, Full-Service Shopper Gold, Full-Service Shopper Platinum and
  Full-Service Shopper Diamond, and the account books customer ratings, rating exclusions and violation points. The
  work itself arrives as batches of six types: Shop-Only Batch, Express 30 Batch, Single Delivery Batch, Double
  Delivery Batch, Triple Delivery Batch and Stock-Up Batch; each batch books its pay components, tips, adjustments
  and reversals. Shopper earnings flow into a payout account on one of six plans: Weekly Direct Deposit, Instant
  Cashout, Everyday Pay Card Blue, Everyday Pay Card Gold, Everyday Pay Card Platinum and Everyday Pay Card
  Diamond, which books credits, deposits, cashouts, fees and card cashback. Cartwise also sells gift cards as the
  Cartwise eGift Card, Cartwise Plastic Gift Card, Cartwise Reloadable Gift Card, Cartwise Holiday Bonus Gift Card,
  Cartwise Corporate Gift Card and Cartwise Corporate Premium Gift Card, and runs the Cartwise Rewards points program
  with the Member, Bronze, Silver, Gold, Platinum and Diamond tiers. Customers who call typically hold a membership,
  several recent orders in different states and sometimes a gift card or a rewards account, and they ring about a
  charge, a missing or swapped item, a fee, a tip or their plan. Shoppers who call typically hold one contractor
  account, a string of recent batches and one payout account, and they ring about pay on a batch, a tip change, a
  low rating, violation points, a hold or deactivation, or a cashout that did not arrive. Many people are both: a
  shopper who also orders groceries brings a membership, orders, batches and a payout account to the same call.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: membership_charges_and_cancellations
    claim:
      categories: [membership]
      event_types: [membership_fee_charged, membership_fee_refunded, membership_auto_renew_disabled, membership_auto_renew_enabled, membership_canceled, membership_paused, membership_resumed, membership_plan_switched, membership_reinstated]
    summary: >
      Callers are Cartwise+ members on any of the six plans who question a period fee, want money back, want to stop,
      pause or change their plan, or are past due after a declined card; their setting varies with the plan's billing
      cycle, whether the membership is trialing, active, past_due, paused or pending_cancellation, whether a household
      shares it, and how much of the current period's benefits have already been used on orders. The records involved
      are the membership itself (period dates, auto-renew, past-due and pause dates), its ledger of fee charges, refunds,
      credit and upgrade entries, the orders on which benefits were waived, and any pending membership request; the
      governing rules gate on status and on time windows counted from the charge date, the renewal date or the past-due
      date, and they are quantified per plan in membership_evt_fee_billing, membership_evt_fee_refund,
      membership_evt_failed_payment, membership_evt_pause, membership_evt_plan_switch and membership_evt_cancellation,
      with benefit use measured across the order history. In the ordinary course a period is billed, benefits are used on
      orders, and only then does a refund, cancellation or switch come into question, but that ordering is background
      only. The agent books refunds and service-side changes such as pauses and plan switches, while ending a membership
      or turning auto-renew back on is the member's own decision, registered by the agent and confirmed by the member
      through a user action. Requests no rule decides, such as refunding a monthly period after benefits were used for a
      reason outside the refund rules, back-dating a cancellation, transferring a membership to another person or
      waiving an unpaid period, fall outside the charter and go to a human with POLICY_NOT_COVERED.
  - name: order_item_refunds_fees_and_tips
    claim:
      categories: [order]
      event_types: [order_item_refunded, order_fee_refunded, order_fee_charged, order_tip_increased, order_tip_reduced, order_rescheduled, order_canceled]
    summary: >
      Callers are customers with one or more orders at any of the six service levels who report missing, damaged or
      wrong items, dispute a substitution or its price, question a fee or a late delivery, want to change a tip, or want
      to move or cancel an order; the setting varies with the order's status (placed, shopping, completed, returned or
      closed), its service level, whether a Cartwise+ membership was recorded at checkout, and the customer's recent
      refund history across all orders. The records are the order, its item lines with requested and billed quantities
      and prices, substitution decisions, fee charges and waivers, refunds already granted and tip entries, together
      with the membership whose benefits were judged at checkout; the rules are per service level in
      order_evt_fee_schedule, order_evt_service_fee, order_evt_substitutions, order_evt_item_refunds,
      order_agg_refund_review, order_evt_on_time_guarantee, order_evt_tips, order_evt_reschedule and
      order_evt_cancellation, and they gate on status, on windows counted from completion or from the booked window,
      and on per-order and rolling 90-day caps. In the natural course an order is billed at checkout, completed, and only
      then refunded or re-tipped, but that ordering is background only. The agent books item and fee refunds and
      registers amounts above the self-service caps for review, while cancelling an order and changing a tip are the
      customer's own decisions carried out through user actions. Requests no rule decides, such as refunding a closed
      order, compensating for a store's shelf price, refunding a tip the customer already gave, or paying out a credit
      in cash, go to a human with POLICY_NOT_COVERED.
  - name: shopper_ratings_and_deactivations
    claim:
      categories: [shopper]
      event_types: [shopper_rating_excluded, shopper_violation_recorded, shopper_violation_cleared, shopper_hold_released, shopper_deactivated, shopper_reactivated, shopper_document_updated, shopper_closed]
    summary: >
      Callers are shoppers at any of the six levels who dispute a low rating or a violation, ask why they are on hold or
      deactivated, want to appeal, or need a renewed licence or insurance put on file; their setting varies with the
      account's status (active, on_hold, deactivated or closed), the level's thresholds and quotas, the rating and
      violation history of the last months, and the batches and orders those ratings and violations point to. The
      records are the contractor account with its warning, hold, deactivation and reactivation dates, its ledger of
      ratings, exclusions and violations, submitted appeals, and the orders and batches behind each entry; the rules
      are per level in shopper_evt_rating_exclusion, shopper_evt_violations, shopper_evt_holds,
      shopper_evt_deactivation, shopper_evt_reactivation and shopper_evt_documents, gating on windows counted from the
      rating, violation or deactivation date and on points and exclusion quotas measured over rolling windows. In the
      natural course ratings and violations accumulate, a warning or hold follows, and deactivation and appeal come
      last, but that ordering is background only. The agent excludes qualifying ratings, clears violations the records
      disprove, records renewed documents and reactivates accounts whose cause is cured, while an appeal of a
      deactivation or a voluntary closure is the shopper's own act submitted through a user action. Requests no rule
      decides, such as restoring a level between evaluations, paying compensation for time on hold, disclosing
      background-check contents or reversing a zero-tolerance finding without an appeal, go to a human with
      POLICY_NOT_COVERED.
  - name: shopper_batch_pay_and_tips
    claim:
      categories: [batch]
      event_types: [batch_pay_posted, batch_pay_adjusted, batch_pay_reversed, batch_tip_adjusted_up, batch_tip_adjusted_down]
    summary: >
      Callers are shoppers who believe a batch paid less than it should, that a pay component is missing, that a tip
      changed unfairly, or that pay was taken back; the setting varies with the batch type, whether the batch is
      completed, canceled, dropped or finalized, how many orders, items, heavy units, miles and waiting minutes it
      carried, what the offer showed, and how many adjustments the shopper already received in the last 30 days. The
      records are the batch with its offer and route figures, its ledger of pay components, tips, adjustments and
      reversals, the shopper's pay disputes, and the orders in the batch with their tips and item lines; the rules are
      per batch type in batch_evt_pay_calculation, batch_evt_tips, batch_evt_cancel_and_drop, batch_evt_pay_disputes,
      batch_agg_adjustment_limits and batch_evt_clawback, gating on the batch status, on windows counted from completion
      and on per-adjustment caps and a rolling adjustment count. In the natural course a batch is accepted, completed,
      paid in components and finalized after the tip window, but that ordering is background only. The agent computes
      and books owed adjustments and escalates those above its limits, while submitting a pay dispute is the shopper's
      own claim made through a user action. Requests no rule decides, such as paying for a dropped batch, paying
      mileage on actual miles without a qualifying gap, reversing a customer's tip change or paying an unshown boost,
      go to a human with POLICY_NOT_COVERED.
  - name: shopper_payouts_and_cashouts
    claim:
      categories: [payout]
      event_types: [payout_instant_cashout, payout_cashout_fee_charged, payout_fee_refunded, payout_account_unfrozen, payout_destination_changed, payout_plan_changed, payout_account_closed, payout_cashback_paid]
    summary: >
      Callers are shoppers on any of the six payout plans who cannot cash out, see a cashout fee they dispute, had a
      deposit or cashout bounce, are frozen, want a different plan or destination, want to close the account, or are
      missing card cashback; the setting varies with the plan, the account's status (pending_verification, active,
      frozen or closed), the cashable balance after unfinalized tips, today's cashouts, recent destination changes and
      the shopper's level. The records are the payout account with its verification, destination, freeze and balance
      fields, its ledger of credits, debits, deposits, cashouts, fees, returns and cashback, the shopper account's level,
      and the batches whose finalization decides which tips are cashable; the rules are per plan in
      payout_evt_instant_cashout, payout_evt_fee_refund, payout_evt_freezes, payout_plan_eligibility,
      payout_evt_cashback and payout_evt_closure, gating on status, on holds counted from verification or from a
      destination change, and on daily counts and amounts. In the natural course earnings are credited from batches,
      then cashed out or swept weekly, and only then do returns, fee refunds and freezes arise, but that ordering is
      background only. The agent refunds qualifying fees, lifts freezes whose cause the records show resolved and moves
      eligible plans, while cashing out, replacing the destination and closing the account are the shopper's own acts
      carried out through user actions. Requests no rule decides, such as advancing unposted earnings, waiving a
      negative balance, sending money to a third party's account or paying cashback on purchases made with another card,
      go to a human with POLICY_NOT_COVERED.
