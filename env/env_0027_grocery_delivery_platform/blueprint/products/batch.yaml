# Product charter: Cartwise Shopper Batches (category key: batch).
category: batch
display_name: Cartwise Shopper Batches
binding:
  holding_table: batches
  event_tables: [batch_events]
  intake_tables: [batch_pay_disputes]
  status_field: status
  variant_field: variant_name
  quantity_fields: {earnings_usd: batch_earnings}
lifecycle:
  states: [accepted, shopping, delivering, completed, dropped, canceled, finalized]
  transitions:
  - {from: accepted, to: shopping, by: system, means: The shopper arrives at the store and starts shopping the batch.}
  - {from: accepted, to: dropped, by: user, means: The shopper drops the batch before starting to shop.}
  - {from: shopping, to: dropped, by: user, means: The shopper drops the batch while shopping and it is reassigned.}
  - {from: accepted, to: canceled, by: system, means: Every order in the batch is canceled by its customer before
      shopping starts.}
  - {from: shopping, to: canceled, by: system, means: Every order in the batch is canceled by its customer while
      it is being shopped.}
  - {from: shopping, to: delivering, by: system, means: The shopper checks out and leaves the store with the orders.}
  - {from: shopping, to: completed, by: system, means: A shop-only batch is staged for handoff or pickup.}
  - {from: delivering, to: completed, by: system, means: The last order of the batch is handed over or returned
      to the store.}
  - {from: completed, to: finalized, by: system, means: The tip window ends and the batch's pay becomes final.}
  - {from: canceled, to: finalized, by: system, means: The canceled batch's pay becomes final.}
accounts:
- key: batch_earnings
  unit: USD
  meaning: >-
    The shopper's earnings on this batch including tips; pay components and tip increases book in while tip reductions
    and pay reversals book out.
parameter_schema:
  orders_per_batch: Integer — customer orders carried in the batch.
  includes_delivery: Boolean — whether the shopper delivers the orders (false = shop and stage only).
  batch_base_pay_usd: USD — fixed pay for completing the batch.
  per_additional_order_pay_usd: USD — pay for each order in the batch beyond the first.
  per_item_pay_usd: USD — pay per item unit shopped.
  staging_pay_per_order_usd: USD — pay per order staged for pickup or handoff.
  mileage_rate_usd_per_mile: USD per mile — pay per mile of the estimated route beyond the included miles.
  mileage_included_miles: Decimal miles — route miles covered by the base pay.
  mileage_basis: Enum estimated_route — the distance mileage pay is computed on.
  mileage_dispute_tolerance_pct: >-
    Percent — actual miles above the estimate by more than this can be adjusted on dispute (0 = no mileage pay).
  long_distance_threshold_miles: >-
    Decimal miles — estimated route above which the long-distance bonus is added (0 = no bonus).
  long_distance_bonus_usd: USD — long-distance bonus.
  heavy_pay_min_units: Integer — heavy units in the batch at or above which heavy pay starts (0 = no heavy pay).
  heavy_pay_per_unit_usd: USD — pay per heavy unit once heavy pay starts.
  wait_free_minutes: Integer minutes — waiting at the store counter or the customer's door that is not paid.
  wait_rate_usd_per_minute: USD per minute — pay for recorded waiting beyond the free minutes.
  wait_pay_cap_usd: USD — maximum wait pay per batch.
  peak_boost_eligible: Boolean — whether a peak boost shown on the offer is paid.
  peak_boost_max_usd: USD — largest peak boost a batch of this type can carry.
  minimum_batch_pay_usd: USD — floor on the batch's pay before tips; a top-up is added to reach it.
  shown_pay_is_floor: >-
    Boolean — whether the pay shown on the accepted offer is guaranteed as a floor unless the orders changed.
  tip_passthrough_pct: Percent — share of the customer's tip paid to the shopper.
  pay_finalize_after_hours: Integer hours after completion at which pay and tips become final.
  cancellation_pay_usd: USD — pay when the batch is canceled after shopping started.
  cancellation_pay_per_item_shopped_usd: USD — additional pay per item already shopped when canceled mid-shop.
  return_to_store_pay_usd: USD — pay per order returned to the store because the customer could not be reached.
  drop_forfeits_pay: Boolean — whether a dropped batch earns nothing.
  excused_drop_reasons: List — drop reasons that carry no violation points.
  pay_dispute_window_days: Integer calendar days after completion within which a pay dispute can be submitted.
  pay_dispute_min_usd: USD — smallest shortfall handled as a pay dispute.
  pay_adjustment_agent_cap_usd: USD — largest single adjustment the agent may approve; larger ones are escalated.
  pay_adjustments_per_30d: >-
    Integer — adjustments the agent may approve per shopper in a rolling 30 days; further ones are escalated.
  adjustment_reasons: List — controlled reasons a pay adjustment can carry.
  clawback_window_days: Integer calendar days after completion within which posted pay can be reversed.
  clawback_reasons: List — the only grounds on which posted pay is reversed.
  tips_clawback_allowed: >-
    Boolean — whether tips can be reversed by a clawback (tips move only by customer tip changes).
  max_item_units: Integer — item units a batch of this type may carry.
  max_route_miles: Decimal miles — longest estimated route offered.
  offer_expiry_seconds: Integer seconds — how long an offer stays open before it is passed on.
  accept_to_start_minutes: >-
    Integer minutes — time after acceptance by which shopping must start before the batch is released as dropped.
  alcohol_id_scan_required: Boolean — whether handing over alcohol requires the in-app ID scan.
  contact_attempts_required: Integer — customer contact attempts required before a return to store is paid.
  customer_wait_before_return_minutes: Integer minutes — wait at the door before a return to store is allowed.
  weekly_pay_cutoff: Enum — end of the weekly earnings period used by weekly payouts.
  earnings_currency_rounding: Enum — rounding of every computed pay component.
  pay_breakdown_visible: Boolean — whether the shopper sees each pay component in the app.
  quality_bonus_usd: USD — bonus per order rated 5 stars with no item refund.
  quality_bonus_window_hours: Integer hours after completion within which a 5-star rating earns the quality bonus.
