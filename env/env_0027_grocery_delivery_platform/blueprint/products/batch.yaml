events:
- type: batch_accepted
  target: batches
  mutation: create
  meaning: A shopper accepts a batch offer and the batch record opens.
  grain: one row per accepted batch
  fields: {customer_id: the shopper's profile, shopper_account_id: the shopper's contractor account, variant_name: official
      batch type, store_name: store the batch is shopped at, accepted_at: acceptance time, order_count: orders in
      the batch, item_count: item units in the batch, estimated_miles: estimated route miles, shown_pay_usd: pay
      before tips shown on the offer}
  triggers: []
- type: batch_shopping_started
  target: batches
  mutation:
    transition: {from: accepted, to: shopping}
  meaning: Shopping of the batch begins.
  grain: one row per transaction
  fields: {shopping_started_at: time shopping started}
  triggers: []
- type: batch_delivery_started
  target: batches
  mutation:
    transition: {from: shopping, to: delivering}
  meaning: The shopper leaves the store with the batch's orders.
  grain: one row per transaction
  fields: {wait_minutes: store-counter waiting recorded so far}
  triggers: []
- type: batch_completed
  target: batches
  mutation:
    transition:
    - {from: delivering, to: completed}
    - {from: shopping, to: completed}
  meaning: The last order of the batch is handed over, staged or returned to the store.
  grain: one row per transaction
  fields: {completed_date: completion date, actual_miles: GPS miles driven, wait_minutes: total recorded waiting}
  triggers:
  - event: batch:batch_pay_posted
    map: {pay_component: batch_base}
- type: batch_dropped
  target: batches
  mutation:
    transition:
    - {from: accepted, to: dropped}
    - {from: shopping, to: dropped}
  meaning: The shopper gives up the batch and it is reassigned.
  grain: one row per transaction
  fields: {dropped_date: drop date, drop_reason: controlled reason}
  triggers:
  - event: shopper:shopper_violation_recorded
    when: {drop_reason: shopper_choice}
    map: {violation_type: batch_dropped, batch_id: batch_id}
- type: batch_canceled
  target: batches
  mutation:
    transition:
    - {from: accepted, to: canceled}
    - {from: shopping, to: canceled}
  meaning: All orders in the batch are canceled by their customers.
  grain: one row per transaction
  fields: {canceled_date: cancellation date, cancel_stage: whether shopping had started}
  triggers:
  - event: batch:batch_pay_posted
    when: {cancel_stage: during_shopping}
    map: {pay_component: cancellation_pay}
- type: batch_finalized
  target: batches
  mutation:
    transition:
    - {from: completed, to: finalized}
    - {from: canceled, to: finalized}
  meaning: The batch's pay and tips become final.
  grain: one row per transaction
  fields: {finalized_date: date pay became final}
  triggers: []
- type: batch_pay_posted
  target: batch_events
  meaning: One pay component is credited to the batch.
  grain: one row per pay component per order (order empty for batch-level components)
  distinguish_by: [pay_component, order_id]
  fields: {pay_component: which component, order_id: order the component belongs to (empty for batch-level components),
    amount_usd: amount credited (positive), event_date: posting date}
  account: batch_earnings
  direction: in
  triggers:
  - event: payout:payout_earnings_credited
    map: {batch_id: batch_id, batch_event_id: batch_event_id, amount_usd: amount_usd}
- type: batch_tip_posted
  target: batch_events
  meaning: The customer's tip for one order is credited to the shopper at completion.
  grain: one row per tipped order
  distinguish_by: [order_id]
  fields: {batch_id: the batch that completed the order, order_id: the tipped order, amount_usd: tip credited (positive),
    event_date: posting date}
  account: batch_earnings
  direction: in
  triggers:
  - event: payout:payout_earnings_credited
    map: {batch_id: batch_id, batch_event_id: batch_event_id, amount_usd: amount_usd}
- type: batch_tip_adjusted_up
  target: batch_events
  meaning: A customer's tip increase for one order reaches the shopper.
  grain: one row per tip change
  distinguish_by: [order_id, event_date]
  fields: {batch_id: the batch that completed the order, order_id: the order whose tip changed, amount_usd: increase
      (positive), event_date: date of change}
  account: batch_earnings
  direction: in
  triggers:
  - event: payout:payout_earnings_credited
    map: {batch_id: batch_id, batch_event_id: batch_event_id, amount_usd: amount_usd}
- type: batch_tip_adjusted_down
  target: batch_events
  meaning: A customer's tip reduction for one order is taken from the shopper's earnings.
  grain: one row per tip change
  distinguish_by: [order_id, event_date]
  fields: {batch_id: the batch that completed the order, order_id: the order whose tip changed, amount_usd: reduction
      (positive), event_date: date of change}
  account: batch_earnings
  direction: out
  triggers:
  - event: payout:payout_earnings_debited
    map: {batch_id: batch_id, batch_event_id: batch_event_id, amount_usd: amount_usd}
- type: batch_pay_adjusted
  target: batch_events
  meaning: An approved pay adjustment is credited to the batch.
  grain: one row per adjustment reason per batch
  distinguish_by: [adjustment_reason]
  fields: {adjustment_reason: controlled reason, batch_pay_dispute_id: the dispute that asked for it, amount_usd: amount
      credited (positive), event_date: approval date}
  account: batch_earnings
  direction: in
  triggers:
  - event: payout:payout_earnings_credited
    map: {batch_id: batch_id, batch_event_id: batch_event_id, amount_usd: amount_usd}
- type: batch_pay_reversed
  target: batch_events
  meaning: All or part of one posted pay component is taken back.
  grain: one row per reversed pay row
  distinguish_by: [source_event_id]
  fields: {source_event_id: the batch_pay_posted or batch_pay_adjusted row reversed, reversal_reason: controlled
      reason, amount_usd: amount reversed (positive), event_date: reversal date}
  account: batch_earnings
  direction: out
  triggers:
  - event: payout:payout_earnings_debited
    map: {batch_id: batch_id, batch_event_id: batch_event_id, amount_usd: amount_usd}
measures:
- id: batch_msr_heavy_units
  window: the single batch
  measure: >-
    sum of quantity of order_item_charged rows with item_category heavy across the orders whose batch_id is this
    batch
- id: batch_msr_items_shopped
  window: the single batch, up to cancellation or completion
  measure: >-
    count of item units recorded in item_count for completed batches, or the units already shopped as recorded on
    the cancellation for canceled batches
- id: batch_msr_pay_before_tips
  window: the single batch, through frozen_time
  measure: >-
    sum of amount_usd of batch_pay_posted and batch_pay_adjusted rows on the batch minus batch_pay_reversed rows
- {id: batch_msr_adjustments_30d, window: 'rolling 30 calendar days ending on frozen_time, by event_date', measure: count
    of batch_pay_adjusted rows across all batches of the same shopper_account_id}
- id: batch_msr_returned_orders
  window: the single batch
  measure: >-
    count of orders whose batch_id is this batch and whose status is returned or closed after a return
policies:
- id: batch_agg_multi_holding
  subject: [batch_accepted]
  rule: >
    A shopper may hold only one batch in progress at a time; a new batch can be accepted only when every other batch
    of the same shopper_account_id is completed, dropped, canceled or finalized. The shopper's contractor account
    must be active and the batch type must be one the shopper's level allows (Express 30, Stock-Up, heavy and alcohol
    eligibility and max_concurrent_orders are set by the shopper charter). Completed batches accumulate without
    limit.
  eligibility:
  - id: one_in_progress
    applies_to: [batch_accepted]
    kind: dedup
    condition: >-
      A shopper may hold only one batch in progress at a time; a new batch can be accepted only when every other
      batch of the same shopper_account_id is completed, dropped, canceled or finalized.
    evidence_fields: [batches.shopper_account_id, batches.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batches.shopper_account_id]
      action_bindings: {batches.shopper_account_id: shopper_account_id}
    dedup_contract:
      table: batches
      mode: separate_record
      object_bindings: {shopper_account_id: shopper_account_id}
      duplicate_filters:
        status: [accepted, shopping, delivering]
      distinct_fields: []
  params: {max_per_customer: 1}
- id: batch_agg_adjustment_limits
  subject: [batch_pay_adjusted]
  rule: >
    Pay adjustments are limited across all of a shopper's batches. The agent may approve an adjustment only while
    batch_msr_adjustments_30d is below pay_adjustments_per_30d and the adjustment is not above pay_adjustment_agent_cap_usd
    of the batch's type; otherwise the dispute is escalated (dispute_status escalated) and no adjustment is booked
    by the agent.
  eligibility:
  - id: within_agent_limits
    applies_to: [batch_pay_adjusted]
    kind: authorization
    condition: >-
      The agent may approve an adjustment only while batch_msr_adjustments_30d is below pay_adjustments_per_30d
      and the adjustment is not above pay_adjustment_agent_cap_usd of the batch's type; otherwise the dispute is
      escalated (dispute_status escalated) and no adjustment is booked by the agent.
    evidence_fields: [batch_events.event_type, batch_events.event_date, batches.shopper_account_id, batches.batch_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batches.shopper_account_id]
      action_bindings: {batches.shopper_account_id: shopper_account_id}
  params:
    per_tier:
      Shop-Only Batch: {pay_adjustment_agent_cap_usd: =pay_adjustment_agent_cap_usd, pay_adjustments_per_30d: =pay_adjustments_per_30d}
      Express 30 Batch: {pay_adjustment_agent_cap_usd: =pay_adjustment_agent_cap_usd, pay_adjustments_per_30d: =pay_adjustments_per_30d}
      Single Delivery Batch: {pay_adjustment_agent_cap_usd: =pay_adjustment_agent_cap_usd, pay_adjustments_per_30d: =pay_adjustments_per_30d}
      Double Delivery Batch: {pay_adjustment_agent_cap_usd: =pay_adjustment_agent_cap_usd, pay_adjustments_per_30d: =pay_adjustments_per_30d}
      Triple Delivery Batch: {pay_adjustment_agent_cap_usd: =pay_adjustment_agent_cap_usd, pay_adjustments_per_30d: =pay_adjustments_per_30d}
      Stock-Up Batch: {pay_adjustment_agent_cap_usd: =pay_adjustment_agent_cap_usd, pay_adjustments_per_30d: =pay_adjustments_per_30d}
  measures: [batch_msr_adjustments_30d]
- id: batch_evt_pay_calculation
  subject: [batch_pay_posted, batch_completed]
  rule: >
    A completed batch is paid in components, each posted once per batch (or once per order for per-order components)
    and each rounded to the cent half up (earnings_currency_rounding). batch_base is batch_base_pay_usd. per_order
    is per_additional_order_pay_usd for each order beyond the first. per_item is per_item_pay_usd times item_count.
    staging is staging_pay_per_order_usd per staged order. mileage is mileage_rate_usd_per_mile times the part of
    estimated_miles above mileage_included_miles; it is always computed on the estimated route because mileage_basis
    is estimated_route, never on actual miles. long_distance is long_distance_bonus_usd when long_distance_threshold_miles
    is above 0 and estimated_miles exceeds it. heavy_pay is heavy_pay_per_unit_usd times batch_msr_heavy_units when
    heavy_pay_min_units is above 0 and batch_msr_heavy_units is at least heavy_pay_min_units. wait_time is wait_rate_usd_per_minute
    times the minutes of wait_minutes above wait_free_minutes, capped at wait_pay_cap_usd. peak_boost is the boost
    shown on the offer where peak_boost_eligible is true, never above peak_boost_max_usd. quality_bonus is quality_bonus_usd
    per order rated 5 stars within quality_bonus_window_hours with no item refund. return_pay is return_to_store_pay_usd
    per returned order. When the sum of components before tips is below minimum_batch_pay_usd, a minimum_topup component
    brings it up to that floor; and when shown_pay_is_floor is true and the sum is below shown_pay_usd while the
    orders did not change after acceptance, the gap is owed as a shown_pay_shortfall adjustment. Components are
    posted only on a batch that is completed or canceled, never on a dropped one.
  eligibility:
  - id: payable_state
    applies_to: [batch_pay_posted]
    kind: state
    condition: >-
      Components are posted only on a batch that is completed or canceled, never on a dropped one.
    evidence_fields: [batches.status, batches.batch_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batches.batch_id]
      action_bindings: {batches.batch_id: batch_id}
    state_contract:
      field: batches.status
      allowed: [completed, canceled]
  - id: once_per_component
    applies_to: [batch_pay_posted]
    kind: dedup
    condition: >-
      A completed batch is paid in components, each posted once per batch (or once per order for per-order components)
      and each rounded to the cent half up (earnings_currency_rounding).
    evidence_fields: [batch_events.batch_id, batch_events.pay_component, batch_events.order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batch_events.batch_id]
      action_bindings: {batch_events.batch_id: batch_id}
    dedup_contract:
      table: batch_events
      mode: separate_record
      object_bindings: {batch_id: batch_id, pay_component: pay_component, order_id: order_id}
      duplicate_filters:
        event_type: [batch_pay_posted]
      distinct_fields: []
  params:
    per_tier:
      Shop-Only Batch: {batch_base_pay_usd: =batch_base_pay_usd, mileage_rate_usd_per_mile: =mileage_rate_usd_per_mile,
        minimum_batch_pay_usd: =minimum_batch_pay_usd, heavy_pay_per_unit_usd: =heavy_pay_per_unit_usd}
      Express 30 Batch: {batch_base_pay_usd: =batch_base_pay_usd, mileage_rate_usd_per_mile: =mileage_rate_usd_per_mile,
        minimum_batch_pay_usd: =minimum_batch_pay_usd, heavy_pay_per_unit_usd: =heavy_pay_per_unit_usd}
      Single Delivery Batch: {batch_base_pay_usd: =batch_base_pay_usd, mileage_rate_usd_per_mile: =mileage_rate_usd_per_mile,
        minimum_batch_pay_usd: =minimum_batch_pay_usd, heavy_pay_per_unit_usd: =heavy_pay_per_unit_usd}
      Double Delivery Batch: {batch_base_pay_usd: =batch_base_pay_usd, mileage_rate_usd_per_mile: =mileage_rate_usd_per_mile,
        minimum_batch_pay_usd: =minimum_batch_pay_usd, heavy_pay_per_unit_usd: =heavy_pay_per_unit_usd}
      Triple Delivery Batch: {batch_base_pay_usd: =batch_base_pay_usd, mileage_rate_usd_per_mile: =mileage_rate_usd_per_mile,
        minimum_batch_pay_usd: =minimum_batch_pay_usd, heavy_pay_per_unit_usd: =heavy_pay_per_unit_usd}
      Stock-Up Batch: {batch_base_pay_usd: =batch_base_pay_usd, mileage_rate_usd_per_mile: =mileage_rate_usd_per_mile,
        minimum_batch_pay_usd: =minimum_batch_pay_usd, heavy_pay_per_unit_usd: =heavy_pay_per_unit_usd}
  formula:
    mileage_pay: round(mileage_rate_usd_per_mile * max(estimated_miles - mileage_included_miles, 0), 2)
    wait_pay: >-
      min(round(wait_rate_usd_per_minute * max(wait_minutes - wait_free_minutes, 0), 2), wait_pay_cap_usd)
    per_order_pay: per_additional_order_pay_usd * max(order_count - 1, 0)
    per_item_pay: round(per_item_pay_usd * item_count, 2)
  measures: [batch_msr_heavy_units, batch_msr_pay_before_tips]
- id: batch_evt_tips
  subject: [batch_tip_posted, batch_tip_adjusted_up, batch_tip_adjusted_down, batch_finalized]
  rule: >
    tip_passthrough_pct of every customer tip goes to the shopper, and tips are never part of minimum_batch_pay_usd
    or shown_pay_usd. The tip on each delivered order is posted at completion, one row per order. A customer's tip
    change made within the order's tip edit window (order charter) is passed on as batch_tip_adjusted_up or batch_tip_adjusted_down
    on the batch that completed the order, and a reduction may take the batch's earnings for that order's tip down
    to 0.00 but never lower. Pay and tips become final pay_finalize_after_hours after completion, when the batch
    is finalized; after that no tip change reaches the batch. Tips are never reversed by a clawback because tips_clawback_allowed
    is false. Tip changes reach only a batch that is completed and not yet finalized.
  eligibility:
  - id: not_finalized
    applies_to: [batch_tip_adjusted_up, batch_tip_adjusted_down]
    kind: state
    condition: Tip changes reach only a batch that is completed and not yet finalized.
    evidence_fields: [batches.status, batches.batch_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batches.batch_id]
      action_bindings: {batches.batch_id: batch_id}
    state_contract:
      field: batches.status
      allowed: [completed]
  params:
    per_tier:
      Shop-Only Batch: {pay_finalize_after_hours: =pay_finalize_after_hours, tip_passthrough_pct: =tip_passthrough_pct}
      Express 30 Batch: {pay_finalize_after_hours: =pay_finalize_after_hours, tip_passthrough_pct: =tip_passthrough_pct}
      Single Delivery Batch: {pay_finalize_after_hours: =pay_finalize_after_hours, tip_passthrough_pct: =tip_passthrough_pct}
      Double Delivery Batch: {pay_finalize_after_hours: =pay_finalize_after_hours, tip_passthrough_pct: =tip_passthrough_pct}
      Triple Delivery Batch: {pay_finalize_after_hours: =pay_finalize_after_hours, tip_passthrough_pct: =tip_passthrough_pct}
      Stock-Up Batch: {pay_finalize_after_hours: =pay_finalize_after_hours, tip_passthrough_pct: =tip_passthrough_pct}
- id: batch_evt_cancel_and_drop
  subject: [batch_canceled, batch_dropped, batch_shopping_started, batch_delivery_started]
  rule: >
    When every order of a batch is canceled after shopping started (cancel_stage during_shopping), the shopper is
    paid a cancellation_pay component of cancellation_pay_usd plus cancellation_pay_per_item_shopped_usd per item
    unit already shopped (batch_msr_items_shopped); a batch canceled before shopping started earns nothing. A dropped
    batch earns nothing because drop_forfeits_pay is true, whatever was already shopped. A drop with drop_reason
    shopper_choice records a batch_dropped violation on the shopper account; a drop whose reason is in excused_drop_reasons
    records none. Shopping must start within accept_to_start_minutes of accepted_at, otherwise the batch is released
    as dropped with drop_reason not_started. An order returned to the store earns return_to_store_pay_usd only after
    contact_attempts_required attempts and customer_wait_before_return_minutes of waiting recorded in the app. Only
    a batch that is accepted or shopping can be dropped or canceled.
  eligibility:
  - id: open_batch
    applies_to: [batch_canceled, batch_dropped]
    kind: state
    condition: Only a batch that is accepted or shopping can be dropped or canceled.
    evidence_fields: [batches.status, batches.batch_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batches.batch_id]
      action_bindings: {batches.batch_id: batch_id}
    state_contract:
      field: batches.status
      allowed: [accepted, shopping, canceled, dropped]
  params:
    per_tier:
      Shop-Only Batch: {cancellation_pay_usd: =cancellation_pay_usd, return_to_store_pay_usd: =return_to_store_pay_usd,
        accept_to_start_minutes: =accept_to_start_minutes}
      Express 30 Batch: {cancellation_pay_usd: =cancellation_pay_usd, return_to_store_pay_usd: =return_to_store_pay_usd,
        accept_to_start_minutes: =accept_to_start_minutes}
      Single Delivery Batch: {cancellation_pay_usd: =cancellation_pay_usd, return_to_store_pay_usd: =return_to_store_pay_usd,
        accept_to_start_minutes: =accept_to_start_minutes}
      Double Delivery Batch: {cancellation_pay_usd: =cancellation_pay_usd, return_to_store_pay_usd: =return_to_store_pay_usd,
        accept_to_start_minutes: =accept_to_start_minutes}
      Triple Delivery Batch: {cancellation_pay_usd: =cancellation_pay_usd, return_to_store_pay_usd: =return_to_store_pay_usd,
        accept_to_start_minutes: =accept_to_start_minutes}
      Stock-Up Batch: {cancellation_pay_usd: =cancellation_pay_usd, return_to_store_pay_usd: =return_to_store_pay_usd,
        accept_to_start_minutes: =accept_to_start_minutes}
  formula:
    cancellation_pay: >-
      round(cancellation_pay_usd + cancellation_pay_per_item_shopped_usd * batch_msr_items_shopped, 2)
  measures: [batch_msr_items_shopped, batch_msr_returned_orders]
- id: batch_evt_pay_disputes
  subject: [batch_pay_adjusted]
  rule: >
    A shopper disputes pay on one batch by submitting a dispute naming a reason from the batch type's adjustment_reasons.
    A dispute is accepted only when it is submitted within the dispute window counted from the batch's completion.
    The window is counted in calendar days with completed_date as day 0, and the last day to dispute is completed_date
    plus pay_dispute_window_days, inclusive. The owed amount is what the component should have been under batch_evt_pay_calculation
    minus what was posted for it, rounded to the cent; a shortfall below pay_dispute_min_usd is not adjusted. mileage_underpaid
    is owed only when actual_miles exceed estimated_miles by more than mileage_dispute_tolerance_pct and then pays
    mileage_rate_usd_per_mile on the miles above that tolerance. Each batch receives at most one adjustment per
    adjustment_reason. An approved adjustment carries the dispute's id and the dispute is marked approved; a dispute
    found owed nothing is marked denied.
  eligibility:
  - id: dispute_window
    applies_to: [batch_pay_adjusted]
    kind: time
    condition: >-
      A dispute is accepted only when it is submitted within the dispute window counted from the batch's completion.
    evidence_fields: [batches.completed_date, batches.batch_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batches.batch_id]
      action_bindings: {batches.batch_id: batch_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the batch's completion
      anchor_source: batches.completed_date
      relation: not_after
      duration_source: variants.pay_dispute_window_days
      unit: calendar_days
      counting_rule: >-
        The window is counted in calendar days with completed_date as day 0, and the last day to dispute is completed_date
        plus pay_dispute_window_days, inclusive.
      boundary: inclusive
  - id: one_per_reason
    applies_to: [batch_pay_adjusted]
    kind: dedup
    condition: Each batch receives at most one adjustment per adjustment_reason.
    evidence_fields: [batch_events.batch_id, batch_events.adjustment_reason, batch_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batch_events.batch_id]
      action_bindings: {batch_events.batch_id: batch_id}
    dedup_contract:
      table: batch_events
      mode: separate_record
      object_bindings: {batch_id: batch_id, adjustment_reason: adjustment_reason}
      duplicate_filters:
        event_type: [batch_pay_adjusted]
      distinct_fields: []
  params:
    per_tier:
      Shop-Only Batch: {pay_dispute_window_days: =pay_dispute_window_days, mileage_dispute_tolerance_pct: =mileage_dispute_tolerance_pct}
      Express 30 Batch: {pay_dispute_window_days: =pay_dispute_window_days, mileage_dispute_tolerance_pct: =mileage_dispute_tolerance_pct}
      Single Delivery Batch: {pay_dispute_window_days: =pay_dispute_window_days, mileage_dispute_tolerance_pct: =mileage_dispute_tolerance_pct}
      Double Delivery Batch: {pay_dispute_window_days: =pay_dispute_window_days, mileage_dispute_tolerance_pct: =mileage_dispute_tolerance_pct}
      Triple Delivery Batch: {pay_dispute_window_days: =pay_dispute_window_days, mileage_dispute_tolerance_pct: =mileage_dispute_tolerance_pct}
      Stock-Up Batch: {pay_dispute_window_days: =pay_dispute_window_days, mileage_dispute_tolerance_pct: =mileage_dispute_tolerance_pct}
  formula:
    mileage_adjustment: >-
      round(mileage_rate_usd_per_mile * max(actual_miles - estimated_miles * (1 + mileage_dispute_tolerance_pct
      / 100), 0), 2)
- id: batch_evt_clawback
  subject: [batch_pay_reversed]
  rule: >
    Posted pay is reversed only on a ground listed in the batch type's clawback_reasons, and only within the clawback
    window counted from the batch's completion. The clawback window is counted in calendar days with completed_date
    as day 0, and the last day to reverse is completed_date plus clawback_window_days, inclusive. A reversal targets
    one posted or adjusted pay row, named by source_event_id, never more than that row's amount, and each row is
    reversed at most once. Tips are never reversed. A reversal for fraud_substantiated requires the shopper account
    to carry a zero-tolerance violation for the same order.
  eligibility:
  - id: clawback_window
    applies_to: [batch_pay_reversed]
    kind: time
    condition: >-
      Posted pay is reversed only on a ground listed in the batch type's clawback_reasons, and only within the clawback
      window counted from the batch's completion.
    evidence_fields: [batches.completed_date, batches.batch_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batches.batch_id]
      action_bindings: {batches.batch_id: batch_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the batch's completion
      anchor_source: batches.completed_date
      relation: not_after
      duration_source: variants.clawback_window_days
      unit: calendar_days
      counting_rule: >-
        The clawback window is counted in calendar days with completed_date as day 0, and the last day to reverse
        is completed_date plus clawback_window_days, inclusive.
      boundary: inclusive
  - id: reverse_once
    applies_to: [batch_pay_reversed]
    kind: dedup
    condition: >-
      A reversal targets one posted or adjusted pay row, named by source_event_id, never more than that row's amount,
      and each row is reversed at most once.
    evidence_fields: [batch_events.source_event_id, batch_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batch_events.source_event_id]
      action_bindings: {batch_events.source_event_id: source_event_id}
    dedup_contract:
      table: batch_events
      mode: separate_record
      object_bindings: {source_event_id: source_event_id}
      duplicate_filters:
        event_type: [batch_pay_reversed]
      distinct_fields: []
  params:
    per_tier:
      Shop-Only Batch: {clawback_window_days: =clawback_window_days, clawback_reasons: =clawback_reasons}
      Express 30 Batch: {clawback_window_days: =clawback_window_days, clawback_reasons: =clawback_reasons}
      Single Delivery Batch: {clawback_window_days: =clawback_window_days, clawback_reasons: =clawback_reasons}
      Double Delivery Batch: {clawback_window_days: =clawback_window_days, clawback_reasons: =clawback_reasons}
      Triple Delivery Batch: {clawback_window_days: =clawback_window_days, clawback_reasons: =clawback_reasons}
      Stock-Up Batch: {clawback_window_days: =clawback_window_days, clawback_reasons: =clawback_reasons}
- id: batch_evt_lifecycle
  subject: [batch_accepted, batch_shopping_started, batch_delivery_started, batch_completed, batch_finalized]
  rule: >
    A batch moves accepted, shopping, then delivering (batch types with includes_delivery true) and completed, or
    straight from shopping to completed for a Shop-Only Batch; every step is recorded by the system from the shopper's
    app and the agent never advances a batch's status. A batch carries at most orders_per_batch orders, max_item_units
    item units and an estimated route of at most max_route_miles. Alcohol is handed over only after the ID scan
    where alcohol_id_scan_required is true. Weekly payouts sweep earnings up to weekly_pay_cutoff. An offer not
    accepted within offer_expiry_seconds passes to another shopper and creates no batch. Each posted pay component
    is shown to the shopper where pay_breakdown_visible is true.
  eligibility: []
  params:
    per_tier:
      Shop-Only Batch: {orders_per_batch: =orders_per_batch, max_item_units: =max_item_units, max_route_miles: =max_route_miles}
