events:
- type: giftcard_issued
  target: giftcards
  mutation: create
  meaning: A gift card is sold and its record opens.
  grain: one row per card
  fields: {customer_id: the profile the card belongs to, variant_name: official card type, issued_date: purchase
      date, card_last4: last four digits of the card number, expiry_date: expiry date of expiring value (empty when
      none)}
  triggers:
  - event: giftcard:giftcard_loaded
    map: {load_type: purchase}
- type: giftcard_activated
  target: giftcards
  mutation:
    transition: {from: issued, to: active}
  meaning: The card clears its activation hold.
  grain: one row per transaction
  fields: {activated_date: activation date}
  triggers: []
- type: giftcard_suspended
  target: giftcards
  mutation:
    transition: {from: active, to: suspended}
  meaning: The card is blocked after a loss report or a fraud alert.
  grain: one row per transaction
  fields: {suspended_date: suspension date, suspend_reason: controlled reason}
  triggers: []
- type: giftcard_reinstated
  target: giftcards
  mutation:
    transition: {from: suspended, to: active}
  meaning: A suspended card is unblocked.
  grain: one row per transaction
  fields: {suspended_date: cleared to empty, suspend_reason: cleared to empty}
  triggers: []
- type: giftcard_replaced
  target: giftcards
  mutation:
    transition: {from: suspended, to: closed}
  meaning: A suspended card is closed and replaced by a new card.
  grain: one row per transaction
  fields: {closed_date: closure date, close_reason: replaced}
  triggers:
  - event: giftcard:giftcard_balance_transferred_out
    map: {transfer_reason: replacement}
- type: giftcard_depleted
  target: giftcards
  mutation:
    transition: {from: active, to: depleted}
  meaning: The balance reaches zero.
  grain: one row per transaction
  fields: {depleted_date: date the balance reached zero}
  triggers: []
- type: giftcard_restored
  target: giftcards
  mutation:
    transition: {from: depleted, to: active}
  meaning: A reload or reversed redemption gives a depleted card a balance again.
  grain: one row per transaction
  fields: {depleted_date: cleared to empty}
  triggers: []
- type: giftcard_expired
  target: giftcards
  mutation:
    transition: {from: active, to: expired}
  meaning: An expiring card reaches its expiry date.
  grain: one row per transaction
  fields: {expiry_date: the expiry date reached}
  triggers: []
- type: giftcard_cashed_out
  target: giftcards
  mutation:
    transition: {from: active, to: closed}
  meaning: The holder takes a small remaining balance in cash where state law requires it.
  grain: one row per transaction
  fields: {closed_date: closure date, close_reason: cashed_out}
  triggers:
  - event: giftcard:giftcard_value_removed
    map: {removal_reason: cash_out}
- type: giftcard_registered
  target: giftcards
  mutation: update
  meaning: The holder registers the card to their profile.
  grain: one row per transaction
  fields: {registered_date: registration date, customer_id: the registering profile}
  triggers: []
- type: giftcard_loaded
  target: giftcard_events
  meaning: Value is put on the card at purchase, by reload or as a promotional bonus.
  grain: one row per load
  distinguish_by: [load_type, event_date, amount_usd]
  fields: {load_type: purchase or reload or bonus, amount_usd: value loaded (positive), event_date: load date}
  account: card_balance
  direction: in
  triggers: []
- type: giftcard_redeemed
  target: giftcard_events
  meaning: Card value pays toward one order.
  grain: one row per order paid
  distinguish_by: [order_id]
  fields: {order_id: the order paid, amount_usd: value used (positive), event_date: redemption date}
  account: card_balance
  direction: out
  triggers: []
- type: giftcard_redemption_reversed
  target: giftcard_events
  meaning: An order refund returns value to the card that paid it.
  grain: one row per refunded order refund row
  distinguish_by: [order_id, source_event_id]
  fields: {order_id: the refunded order, source_event_id: the order_events refund row being returned, amount_usd: value
      returned (positive), event_date: date returned}
  account: card_balance
  direction: in
  triggers: []
- type: giftcard_balance_transferred_out
  target: giftcard_events
  meaning: The balance leaves this card for a replacement or a merge.
  grain: one row per transfer
  distinguish_by: [transfer_reason, counterpart_giftcard_id]
  fields: {transfer_reason: replacement or merge, counterpart_giftcard_id: the receiving card, amount_usd: value
      moved (positive), event_date: transfer date}
  account: card_balance
  direction: out
  triggers: []
- type: giftcard_balance_transferred_in
  target: giftcard_events
  meaning: The balance of another card arrives on this card.
  grain: one row per transfer
  distinguish_by: [transfer_reason, counterpart_giftcard_id]
  fields: {transfer_reason: replacement or merge, counterpart_giftcard_id: the sending card, amount_usd: value received
      (positive), event_date: transfer date}
  account: card_balance
  direction: in
  triggers: []
- type: giftcard_value_removed
  target: giftcard_events
  meaning: Value leaves the card by cash-out, bonus expiry or purchase refund.
  grain: one row per removal reason
  distinguish_by: [removal_reason]
  fields: {removal_reason: controlled reason, amount_usd: value removed (positive), event_date: removal date}
  account: card_balance
  direction: out
  triggers: []
measures:
- id: giftcard_msr_bonus_remaining
  window: the single card through frozen_time
  measure: >-
    sum of giftcard_loaded rows with load_type bonus minus the bonus part of redemptions spent under redemption_order
    minus bonus_expiry removals
- id: giftcard_msr_replacements_this_year
  window: the calendar year of frozen_time
  measure: >-
    count of giftcard_balance_transferred_out rows with transfer_reason replacement dated in the year, across the
    card and the cards it replaced (linked by counterpart_giftcard_id)
- {id: giftcard_msr_purchases_today, window: the calendar day of frozen_time, measure: sum of face value of cards
    issued to the same purchaser profile that day}
policies:
- id: giftcard_agg_multi_holding
  subject: [giftcard_issued, giftcard_redeemed]
  rule: >
    A customer may hold any number of gift cards. Cards are never pooled into one balance except by an explicit
    merge onto a Reloadable card; on one order the customer may combine up to cards_per_order_max cards, each paying
    at most its own per_order_redemption_max_usd, and cards are applied in the order the customer lists them.
  eligibility: []
  params: {max_per_customer: null}
- id: giftcard_agg_combination
  subject: [giftcard_redeemed, giftcard_balance_transferred_out, giftcard_balance_transferred_in]
  rule: >
    A card whose balance_merge_allowed is true may move its whole balance, if at least merge_min_balance_usd, onto
    a Cartwise Reloadable Gift Card of the same holder, provided the receiving card stays within its max_balance_usd;
    the sending card is then depleted. Bonus value never moves in a merge because merge_moves_bonus is false, and
    it lapses on the sending card. Card value never pays alcohol lines because alcohol_redeemable is false, and
    pays tips and Cartwise+ fees only where tips_payable and membership_payable are true.
  eligibility: []
  params:
    per_tier:
      Cartwise eGift Card: {balance_merge_allowed: =balance_merge_allowed, max_balance_usd: =max_balance_usd}
      Cartwise Plastic Gift Card: {balance_merge_allowed: =balance_merge_allowed, max_balance_usd: =max_balance_usd}
      Cartwise Reloadable Gift Card: {balance_merge_allowed: =balance_merge_allowed, max_balance_usd: =max_balance_usd}
      Cartwise Holiday Bonus Gift Card: {balance_merge_allowed: =balance_merge_allowed, max_balance_usd: =max_balance_usd}
      Cartwise Corporate Gift Card: {balance_merge_allowed: =balance_merge_allowed, max_balance_usd: =max_balance_usd}
      Cartwise Corporate Premium Gift Card: {balance_merge_allowed: =balance_merge_allowed, max_balance_usd: =max_balance_usd}
- id: giftcard_purchase_and_activation
  subject: [giftcard_issued, giftcard_activated, giftcard_loaded]
  rule: >
    A card is sold for a value between face_value_min_usd and face_value_max_usd plus purchase_fee_usd and shipping_fee_usd,
    within purchase_limit_per_day_usd per purchaser as counted by giftcard_msr_purchases_today; business orders
    of at least bulk_min_cards cards get bulk_discount_pct off. A Holiday Bonus card is also loaded with bonus_value_usd
    for each full 50.00 of purchased value. The card becomes redeemable when its activation hold has passed. The
    hold is counted in elapsed hours from the purchase, and the card activates at issued time plus activation_hold_hours.
    Reloads are allowed only on reloadable cards, between reload_min_usd and reload_max_usd, and only while the
    card is active or depleted.
  eligibility:
  - id: reload_state
    applies_to: [giftcard_loaded]
    kind: state
    condition: >-
      Reloads are allowed only on reloadable cards, between reload_min_usd and reload_max_usd, and only while the
      card is active or depleted.
    evidence_fields: [giftcards.status, giftcards.giftcard_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [giftcards.giftcard_id]
      action_bindings: {giftcards.giftcard_id: giftcard_id}
    state_contract:
      field: giftcards.status
      allowed: [issued, active, depleted]
  params:
    per_tier:
      Cartwise eGift Card: {activation_hold_hours: =activation_hold_hours, reloadable: =reloadable, bonus_value_usd: =bonus_value_usd}
      Cartwise Plastic Gift Card: {activation_hold_hours: =activation_hold_hours, reloadable: =reloadable, bonus_value_usd: =bonus_value_usd}
      Cartwise Reloadable Gift Card: {activation_hold_hours: =activation_hold_hours, reloadable: =reloadable, bonus_value_usd: =bonus_value_usd}
      Cartwise Holiday Bonus Gift Card: {activation_hold_hours: =activation_hold_hours, reloadable: =reloadable,
        bonus_value_usd: =bonus_value_usd}
      Cartwise Corporate Gift Card: {activation_hold_hours: =activation_hold_hours, reloadable: =reloadable, bonus_value_usd: =bonus_value_usd}
      Cartwise Corporate Premium Gift Card: {activation_hold_hours: =activation_hold_hours, reloadable: =reloadable,
        bonus_value_usd: =bonus_value_usd}
  measures: [giftcard_msr_purchases_today]
- id: giftcard_evt_redemption
  subject: [giftcard_redeemed, giftcard_depleted, giftcard_restored]
  rule: >
    A card pays toward an order only while it is active, up to its balance and per_order_redemption_max_usd, and
    never for alcohol lines. Where redemption_order is bonus_first, bonus value is spent before purchased value.
    Redemption requires the card PIN where pin_required_for_redemption is true. A redemption that brings the balance
    to zero depletes the card; a later reload or reversed redemption restores it to active. Redeemed value stays
    on the card rather than moving to an account balance because redeem_to_account is false, and cards are accepted
    at every retailer (redemption_scope all_retailers).
  eligibility:
  - id: redeem_active
    applies_to: [giftcard_redeemed]
    kind: state
    condition: >-
      A card pays toward an order only while it is active, up to its balance and per_order_redemption_max_usd, and
      never for alcohol lines.
    evidence_fields: [giftcards.status, giftcards.giftcard_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [giftcards.giftcard_id]
      action_bindings: {giftcards.giftcard_id: giftcard_id}
    state_contract:
      field: giftcards.status
      allowed: [active]
  params:
    per_tier:
      Cartwise eGift Card: {per_order_redemption_max_usd: =per_order_redemption_max_usd, redemption_order: =redemption_order}
      Cartwise Plastic Gift Card: {per_order_redemption_max_usd: =per_order_redemption_max_usd, redemption_order: =redemption_order}
      Cartwise Reloadable Gift Card: {per_order_redemption_max_usd: =per_order_redemption_max_usd, redemption_order: =redemption_order}
      Cartwise Holiday Bonus Gift Card: {per_order_redemption_max_usd: =per_order_redemption_max_usd, redemption_order: =redemption_order}
      Cartwise Corporate Gift Card: {per_order_redemption_max_usd: =per_order_redemption_max_usd, redemption_order: =redemption_order}
      Cartwise Corporate Premium Gift Card: {per_order_redemption_max_usd: =per_order_redemption_max_usd, redemption_order: =redemption_order}
- id: giftcard_evt_refund_to_card
  subject: [giftcard_redemption_reversed]
  rule: >
    When an order paid partly or wholly by a gift card is refunded, the refund goes back to the card up to the amount
    that card paid on that order, card before other payment methods because refund_card_first is true, where refund_to_card_on_order_refund
    is true. When the card has expired or closed, the refund goes where refund_to_card_after_expiry says. Each order
    refund row is returned to a card once.
  eligibility:
  - id: once_per_refund_row
    applies_to: [giftcard_redemption_reversed]
    kind: dedup
    condition: Each order refund row is returned to a card once.
    evidence_fields: [giftcard_events.source_event_id, giftcard_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [giftcard_events.source_event_id]
      action_bindings: {giftcard_events.source_event_id: source_event_id}
    dedup_contract:
      table: giftcard_events
      mode: separate_record
      object_bindings: {source_event_id: source_event_id}
      duplicate_filters:
        event_type: [giftcard_redemption_reversed]
      distinct_fields: []
  params:
    per_tier:
      Cartwise eGift Card: {refund_to_card_after_expiry: =refund_to_card_after_expiry}
      Cartwise Plastic Gift Card: {refund_to_card_after_expiry: =refund_to_card_after_expiry}
      Cartwise Reloadable Gift Card: {refund_to_card_after_expiry: =refund_to_card_after_expiry}
      Cartwise Holiday Bonus Gift Card: {refund_to_card_after_expiry: =refund_to_card_after_expiry}
      Cartwise Corporate Gift Card: {refund_to_card_after_expiry: =refund_to_card_after_expiry}
      Cartwise Corporate Premium Gift Card: {refund_to_card_after_expiry: =refund_to_card_after_expiry}
- id: giftcard_evt_loss_and_replacement
  subject: [giftcard_suspended, giftcard_reinstated, giftcard_replaced, giftcard_registered]
  rule: >
    A card reported lost or stolen is suspended at once where suspend_on_loss_report is true, and the balance left
    at the moment of the report is protected. A suspended card is replaced only when the card was registered before
    the loss report where replacement_requires_registration is true, or on the purchase receipt where replacement_requires_purchase_proof
    is true, at replacement_fee_usd taken from the balance, and no more than replacements_per_year times as counted
    by giftcard_msr_replacements_this_year. Only a suspended card can be replaced. The replacement receives the
    protected balance less the fee; bonus value moves with it only before its bonus expiry. A report withdrawn by
    the holder reinstates the card. Where registration_available is true the holder may register the card to their
    profile, and a card may be registered to a profile other than the purchaser's only where transferable_between_profiles
    is true. The balance is protected from the moment set by balance_protected_from. A fraud_review suspension is
    targeted for decision within fraud_review_business_days, and the replacement fee is taken from the protected
    balance because replacement_fee_from_balance is true.
  eligibility:
  - id: replace_suspended
    applies_to: [giftcard_replaced]
    kind: state
    condition: Only a suspended card can be replaced.
    evidence_fields: [giftcards.status, giftcards.giftcard_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [giftcards.giftcard_id]
      action_bindings: {giftcards.giftcard_id: giftcard_id}
    state_contract:
      field: giftcards.status
      allowed: [suspended, closed]
  params:
    per_tier:
      Cartwise eGift Card: {replacement_requires_registration: =replacement_requires_registration, replacement_fee_usd: =replacement_fee_usd,
        replacements_per_year: =replacements_per_year}
      Cartwise Plastic Gift Card: {replacement_requires_registration: =replacement_requires_registration, replacement_fee_usd: =replacement_fee_usd,
        replacements_per_year: =replacements_per_year}
      Cartwise Reloadable Gift Card: {replacement_requires_registration: =replacement_requires_registration, replacement_fee_usd: =replacement_fee_usd,
        replacements_per_year: =replacements_per_year}
      Cartwise Holiday Bonus Gift Card: {replacement_requires_registration: =replacement_requires_registration,
        replacement_fee_usd: =replacement_fee_usd, replacements_per_year: =replacements_per_year}
      Cartwise Corporate Gift Card: {replacement_requires_registration: =replacement_requires_registration, replacement_fee_usd: =replacement_fee_usd,
        replacements_per_year: =replacements_per_year}
      Cartwise Corporate Premium Gift Card: {replacement_requires_registration: =replacement_requires_registration,
        replacement_fee_usd: =replacement_fee_usd, replacements_per_year: =replacements_per_year}
  measures: [giftcard_msr_replacements_this_year]
- id: giftcard_evt_expiry_and_bonus
  subject: [giftcard_expired, giftcard_value_removed]
  rule: >
    Purchased value never expires because purchased_value_expires is false, and inactivity_fee_usd is 0.00 for every
    card. Bonus value on a Holiday Bonus card lapses when the bonus period counted from activation has run. The
    bonus period is counted in calendar days with activated_date as day 0, and bonus value lapses on the day after
    activated_date plus bonus_expiry_days. The lapse removes only giftcard_msr_bonus_remaining (removal_reason bonus_expiry);
    a card whose expires is true moves to expired only when nothing but lapsed bonus value remained on it.
  eligibility:
  - id: bonus_period_run
    applies_to: [giftcard_value_removed]
    kind: time
    condition: >-
      Bonus value on a Holiday Bonus card lapses when the bonus period counted from activation has run.
    evidence_fields: [giftcards.activated_date, giftcards.giftcard_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [giftcards.giftcard_id]
      action_bindings: {giftcards.giftcard_id: giftcard_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: activation
      anchor_source: giftcards.activated_date
      relation: not_before
      duration_source: variants.bonus_expiry_days
      unit: calendar_days
      counting_rule: >-
        The bonus period is counted in calendar days with activated_date as day 0, and bonus value lapses on the
        day after activated_date plus bonus_expiry_days.
      boundary: exclusive
  params:
    per_tier:
      Cartwise eGift Card: {expires: =expires, bonus_expiry_days: =bonus_expiry_days}
      Cartwise Plastic Gift Card: {expires: =expires, bonus_expiry_days: =bonus_expiry_days}
      Cartwise Reloadable Gift Card: {expires: =expires, bonus_expiry_days: =bonus_expiry_days}
      Cartwise Holiday Bonus Gift Card: {expires: =expires, bonus_expiry_days: =bonus_expiry_days}
      Cartwise Corporate Gift Card: {expires: =expires, bonus_expiry_days: =bonus_expiry_days}
      Cartwise Corporate Premium Gift Card: {expires: =expires, bonus_expiry_days: =bonus_expiry_days}
  measures: [giftcard_msr_bonus_remaining]
- id: giftcard_evt_cash_out_and_purchase_refund
  subject: [giftcard_cashed_out, giftcard_value_removed]
  rule: >
    A holder whose profile address is in one of cash_out_states may cash out the card when its purchased balance
    is at or below cash_out_threshold_usd; bonus value is not paid out and lapses. Only the holder can request a
    cash-out, and it closes the card. A purchaser may have an unredeemed card refunded within the purchase refund
    window counted from the purchase. The purchase refund window is counted in calendar days with issued_date as
    day 0, and the last day is issued_date plus purchase_refund_window_days, inclusive; a card with any redemption
    is not refundable because purchase_refund_requires_unredeemed is true. Bonus value is never cashed out because
    cash_out_bonus_value is false, and the cash-out closes the card because cash_out_closes_card is true.
  eligibility:
  - id: purchase_refund_window
    applies_to: [giftcard_value_removed]
    kind: time
    condition: >-
      A purchaser may have an unredeemed card refunded within the purchase refund window counted from the purchase.
    evidence_fields: [giftcards.issued_date, giftcards.giftcard_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [giftcards.giftcard_id]
      action_bindings: {giftcards.giftcard_id: giftcard_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the purchase
      anchor_source: giftcards.issued_date
      relation: not_after
      duration_source: variants.purchase_refund_window_days
      unit: calendar_days
      counting_rule: >-
        The purchase refund window is counted in calendar days with issued_date as day 0, and the last day is issued_date
        plus purchase_refund_window_days, inclusive; a card with any redemption is not refundable because purchase_refund_requires_unredeemed
        is true.
      boundary: inclusive
  params:
    per_tier:
      Cartwise eGift Card: {cash_out_threshold_usd: =cash_out_threshold_usd, purchase_refund_window_days: =purchase_refund_window_days}
      Cartwise Plastic Gift Card: {cash_out_threshold_usd: =cash_out_threshold_usd, purchase_refund_window_days: =purchase_refund_window_days}
      Cartwise Reloadable Gift Card: {cash_out_threshold_usd: =cash_out_threshold_usd, purchase_refund_window_days: =purchase_refund_window_days}
      Cartwise Holiday Bonus Gift Card: {cash_out_threshold_usd: =cash_out_threshold_usd, purchase_refund_window_days: =purchase_refund_window_days}
      Cartwise Corporate Gift Card: {cash_out_threshold_usd: =cash_out_threshold_usd, purchase_refund_window_days: =purchase_refund_window_days}
      Cartwise Corporate Premium Gift Card: {cash_out_threshold_usd: =cash_out_threshold_usd, purchase_refund_window_days: =purchase_refund_window_days}
