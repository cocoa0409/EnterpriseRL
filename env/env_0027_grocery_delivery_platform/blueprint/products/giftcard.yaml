# Product charter: Cartwise Gift Cards (category key: giftcard).
category: giftcard
display_name: Cartwise Gift Cards
binding:
  holding_table: giftcards
  event_tables: [giftcard_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_usd: card_balance}
lifecycle:
  states: [issued, active, suspended, depleted, expired, closed]
  transitions:
  - {from: issued, to: active, by: system, means: The card clears its activation hold and can be redeemed.}
  - {from: active, to: suspended, by: agent, means: The card holder reports the card lost or stolen or a fraud review
      opens.}
  - {from: suspended, to: active, by: agent, means: The report is withdrawn or the review clears the card.}
  - {from: suspended, to: closed, by: agent, means: The card is replaced and its balance moves to the replacement.}
  - {from: active, to: depleted, by: system, means: Redemptions bring the balance to zero.}
  - {from: depleted, to: active, by: system, means: A reload or a reversed redemption restores a balance.}
  - {from: active, to: expired, by: system, means: A card type that expires reaches its expiry date.}
  - {from: active, to: closed, by: user, means: The holder cashes out a small remaining balance where the law of
      their state requires it.}
accounts:
- key: card_balance
  unit: USD
  meaning: >-
    Value remaining on the card; loads and reversed redemptions and incoming transfers book in while redemptions
    and cash-outs and outgoing transfers and forfeitures book out.
parameter_schema:
  face_value_min_usd: USD — smallest value a card can be bought for.
  face_value_max_usd: USD — largest value a card can be bought for.
  purchase_fee_usd: USD — fee added to the purchase price.
  shipping_fee_usd: USD — fee for mailing a physical card (0 for digital or rack cards).
  bulk_min_cards: Integer — cards in one business order for bulk pricing (0 = not sold in bulk).
  bulk_discount_pct: Percent — discount on a bulk business order.
  activation_hold_hours: Integer hours after purchase before the card can be redeemed.
  reloadable: Boolean — whether value can be added after purchase.
  reload_min_usd: USD — smallest reload (0 = not reloadable).
  reload_max_usd: USD — largest single reload (0 = not reloadable).
  max_balance_usd: USD — largest balance the card may carry.
  expires: Boolean — whether the card's value expires.
  bonus_value_usd: >-
    USD — promotional bonus value loaded on a Holiday Bonus card per 50.00 of purchased value (0 = none).
  bonus_expiry_days: Integer calendar days after activation when unused bonus value expires (0 = no bonus).
  purchased_value_expires: Boolean — whether the purchased (non-bonus) value ever expires.
  inactivity_fee_usd: USD — monthly inactivity fee.
  redemption_order: Enum — which value is spent first when a card holds bonus and purchased value.
  alcohol_redeemable: Boolean — whether the card can pay for alcohol lines.
  tips_payable: Boolean — whether the card can pay shopper tips.
  membership_payable: Boolean — whether the card can pay Cartwise+ fees.
  per_order_redemption_max_usd: USD — most a single card pays toward one order.
  cards_per_order_max: Integer — gift cards combinable on one order.
  redeem_to_account: >-
    Boolean — whether redeeming moves the value to the customer's Cartwise account balance instead of staying on
    the card.
  refund_to_card_on_order_refund: Boolean — whether an order refund paid by the card goes back to the card.
  refund_to_card_after_expiry: >-
    Enum original_card|cartwise_credit — where an order refund goes when the card has expired or closed.
  registration_available: Boolean — whether the holder can register the card to their profile.
  replacement_requires_registration: Boolean — whether a lost card can be replaced only if it was registered before
    the loss.
  replacement_requires_purchase_proof: Boolean — whether a lost unregistered card needs the purchase receipt.
  replacement_fee_usd: USD — fee to replace a lost or stolen card.
  replacements_per_year: Integer — replacements allowed per card per calendar year.
  suspend_on_loss_report: Boolean — whether a loss report suspends the card at once.
  balance_protected_from: Enum report_time — from what moment a replacement protects the balance.
  fraud_review_business_days: Integer business days — target to finish a fraud review.
  cash_out_threshold_usd: USD — balance at or below which a cash-out is available where state law requires it.
  cash_out_states: List — states whose law requires a small-balance cash-out.
  cash_out_bonus_value: Boolean — whether bonus value is included in a cash-out.
  transferable_between_profiles: Boolean — whether an unredeemed card can be given to another person.
  balance_merge_allowed: >-
    Boolean — whether the balance of this card can be moved onto a Reloadable card of the same holder.
  merge_min_balance_usd: USD — smallest balance that can be merged.
  purchase_limit_per_day_usd: USD — card value one purchaser may buy per calendar day.
  purchase_refund_window_days: >-
    Integer calendar days after purchase during which an unredeemed card can be refunded to the purchaser.
  purchase_refund_requires_unredeemed: Boolean — whether a purchase refund requires the card never to have been
    redeemed.
  pin_required_for_redemption: Boolean — whether redeeming requires the card PIN.
  redemption_scope: Enum all_retailers — which retailers accept the card.
  merge_moves_bonus: Boolean — whether bonus value moves in a balance merge.
  replacement_fee_from_balance: Boolean — whether the replacement fee is taken from the protected balance.
  refund_card_first: Boolean — whether order refunds return to gift cards before other payment methods.
  cash_out_closes_card: Boolean — whether a cash-out closes the card.
