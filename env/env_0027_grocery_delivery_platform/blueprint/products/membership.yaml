events:
- type: membership_enrolled
  target: memberships
  mutation: create
  meaning: >-
    A customer enrolls in a Cartwise+ plan and the membership record opens awaiting eligibility and payment confirmation.
  grain: one row per enrollment
  fields: {customer_id: the enrolling customer, variant_name: the official plan name chosen, enrolled_date: date
      of enrollment, auto_renew: true at enrollment}
  triggers: []
- type: membership_trial_started
  target: memberships
  mutation:
    transition: {from: applied, to: trialing}
  meaning: The enrollment is confirmed and the plan's free trial starts.
  grain: one row per transaction
  fields: {trial_end_date: last day of the trial, eligibility_verified_date: date required proof was accepted (empty
      when none required)}
  triggers: []
- type: membership_activated
  target: memberships
  mutation:
    transition:
    - {from: applied, to: active}
    - {from: trialing, to: active}
  meaning: The first paid period starts, either directly after enrollment or when the trial converts.
  grain: one row per transaction
  fields: {variant_name: the plan held, current_period_start: first day of the paid period, current_period_end: renewal
      date that ends the period, eligibility_verified_date: date required proof was accepted}
  triggers:
  - event: membership:membership_fee_charged
    map: {fee_type: first_period, billing_period_start: current_period_start}
  - event: membership:membership_upgrade_allotted
    when:
      variant_name: [Cartwise+ Family Annual, Cartwise+ Premier Annual]
    map: {billing_period_start: current_period_start}
- type: membership_renewed
  target: memberships
  mutation: update
  meaning: An active membership rolls into its next paid period on the renewal date.
  grain: one row per transaction
  fields: {current_period_start: first day of the new period, current_period_end: renewal date that ends the new
      period, priority_upgrades_remaining: upgrades reset for the new period}
  triggers:
  - event: membership:membership_fee_charged
    map: {fee_type: renewal, billing_period_start: current_period_start}
- type: membership_past_due
  target: memberships
  mutation:
    transition:
    - {from: active, to: past_due}
    - {from: trialing, to: past_due}
  meaning: A period fee is declined and the membership enters the retry and grace period.
  grain: one row per transaction
  fields: {past_due_since: date the fee was first declined}
  triggers: []
- type: membership_reinstated
  target: memberships
  mutation:
    transition: {from: past_due, to: active}
  meaning: The outstanding period fee is captured and the membership returns to active.
  grain: one row per transaction
  fields: {current_period_start: first day of the period now paid, current_period_end: renewal date ending that
      period, past_due_since: cleared to empty}
  triggers:
  - event: membership:membership_fee_charged
    map: {fee_type: renewal_retry, billing_period_start: current_period_start}
- type: membership_paused
  target: memberships
  mutation:
    transition: {from: active, to: paused}
  meaning: A monthly membership is paused; no fee is charged and no benefit applies until it resumes.
  grain: one row per transaction
  fields: {pause_start_date: first paused day (the renewal date), pause_end_date: last paused day}
  triggers:
  - event: membership:membership_pause_logged
    map: {billing_period_start: pause_start_date}
- type: membership_pause_logged
  target: membership_events
  meaning: >-
    The pause history keeps one row for every pause that starts, so pauses can be counted over time.
  grain: one row per pause
  distinguish_by: [billing_period_start]
  fields: {billing_period_start: the renewal date on which the pause started, quantity: booked pause length in calendar
      days, event_date: date the pause was booked}
  triggers: []
- type: membership_resumed
  target: memberships
  mutation:
    transition: {from: paused, to: active}
  meaning: A paused membership resumes and a new paid period starts.
  grain: one row per transaction
  fields: {current_period_start: first day of the new period, current_period_end: renewal date ending it}
  triggers:
  - event: membership:membership_fee_charged
    map: {fee_type: renewal, billing_period_start: current_period_start}
- type: membership_auto_renew_disabled
  target: memberships
  mutation:
    transition: {from: active, to: pending_cancellation}
  meaning: The customer turns off auto-renew; benefits continue to the end of the paid period.
  grain: one row per transaction
  fields: {auto_renew: set to false}
  triggers: []
- type: membership_auto_renew_enabled
  target: memberships
  mutation:
    transition: {from: pending_cancellation, to: active}
  meaning: The customer turns auto-renew back on before the paid period ends.
  grain: one row per transaction
  fields: {auto_renew: set to true}
  triggers: []
- type: membership_canceled
  target: memberships
  mutation:
    transition:
    - {from: applied, to: canceled}
    - {from: trialing, to: canceled}
    - {from: past_due, to: canceled}
    - {from: pending_cancellation, to: canceled}
    - {from: active, to: canceled}
  meaning: The membership ends and all order benefits stop.
  grain: one row per transaction
  fields: {canceled_date: date the membership ended, cancel_reason: controlled reason for the ending}
  triggers: []
- type: membership_plan_switched
  target: memberships
  mutation: update
  meaning: The membership moves to another Cartwise+ plan.
  grain: one row per transaction
  fields: {variant_name: the new official plan name, plan_switched_date: date the new plan took effect, current_period_start: start
      of the new plan's period, current_period_end: end of the new plan's period}
  triggers:
  - event: membership:membership_fee_charged
    map: {fee_type: plan_switch, billing_period_start: current_period_start}
- type: membership_fee_charged
  target: membership_events
  meaning: A period fee is captured from the customer's payment card.
  grain: one row per captured period fee
  distinguish_by: [fee_type, billing_period_start, event_date]
  fields: {fee_type: why the fee was charged, billing_period_start: first day of the period paid for, amount_usd: fee
      captured (positive), event_date: capture date}
  account: membership_fees
  direction: in
  triggers: []
- type: membership_fee_refunded
  target: membership_events
  meaning: All or part of one captured period fee is returned to the customer.
  grain: one row per refund of one fee charge
  distinguish_by: [source_event_id, refund_type]
  fields: {source_event_id: the membership_fee_charged row being refunded, refund_type: basis of the refund, amount_usd: amount
      returned (positive), event_date: refund date}
  account: membership_fees
  direction: out
  triggers: []
- type: membership_credit_earned
  target: membership_events
  meaning: Cartwise+ credit back is earned on one completed eligible order.
  grain: one row per earning order
  distinguish_by: [order_id]
  fields: {order_id: the completed order that earned the credit, amount_usd: credit earned (positive), event_date: date
      earned}
  account: plus_credit
  direction: in
  triggers: []
- type: membership_credit_applied
  target: membership_events
  meaning: Cartwise+ credit is spent against one order.
  grain: one row per order the credit is applied to
  distinguish_by: [order_id]
  fields: {order_id: the order the credit paid toward, amount_usd: credit spent (positive), event_date: date applied}
  account: plus_credit
  direction: out
  triggers: []
- type: membership_credit_expired
  target: membership_events
  meaning: Unspent credit from one earning lapses at its expiry or after cancellation.
  grain: one row per lapsed earning
  distinguish_by: [source_event_id]
  fields: {source_event_id: the membership_credit_earned row whose remainder lapses, amount_usd: credit removed
      (positive), event_date: lapse date}
  account: plus_credit
  direction: out
  triggers: []
- type: membership_upgrade_allotted
  target: membership_events
  meaning: The period's Priority Delivery upgrades are granted at the start of a paid period.
  grain: one row per paid period
  distinguish_by: [billing_period_start]
  fields: {billing_period_start: the period the upgrades belong to, quantity: upgrades granted, event_date: grant
      date}
  account: priority_upgrades
  direction: in
  triggers: []
- type: membership_upgrade_redeemed
  target: membership_events
  meaning: One Priority Delivery upgrade is used on one order instead of paying the Priority fee.
  grain: one row per upgraded order
  distinguish_by: [order_id]
  fields: {order_id: the upgraded order, quantity: upgrades used (1), event_date: date used}
  account: priority_upgrades
  direction: out
  triggers: []
- type: membership_member_added
  target: membership_events
  meaning: A household member starts sharing the membership's benefits.
  grain: one row per member addition
  distinguish_by: [member_customer_id, event_date]
  fields: {member_customer_id: the added person's customer profile, event_date: date added}
  triggers: []
- type: membership_member_removed
  target: membership_events
  meaning: A household member stops sharing the membership's benefits.
  grain: one row per member removal
  distinguish_by: [member_customer_id, event_date]
  fields: {member_customer_id: the removed person's customer profile, event_date: date removed}
  triggers: []
measures:
- id: membership_msr_benefit_uses_since_charge
  window: from the event_date of the fee charge in question through frozen_time, inclusive
  measure: >-
    count of this customer's order_events rows with event_type order_fee_waived and waiver_basis in (member_free_delivery,
    member_priority_upgrade, member_service_fee_rate) plus membership_credit_applied rows on this membership, all
    dated on or after that charge date
- id: membership_msr_pauses_365d
  window: rolling 365 calendar days ending on frozen_time
  measure: >-
    count of membership_pause_logged rows on this membership whose billing_period_start falls in the window
- id: membership_msr_household_active_members
  window: current state at frozen_time
  measure: >-
    count of member_customer_id values with a membership_member_added row on this membership and no later membership_member_removed
    row for the same person, plus 1 for the holder
- id: membership_msr_unused_full_months
  window: the current paid period, from current_period_start to current_period_end
  measure: >-
    12 minus the number of months of the period that have started on or before frozen_time, where month k (k = 0..11)
    starts on the same day-of-month as current_period_start (month-end fallback), floored at 0
- id: membership_msr_current_period_charge
  window: the current paid period
  measure: >-
    amount_usd of the membership_fee_charged row on this membership whose billing_period_start equals current_period_start
- {id: membership_msr_unused_days, window: from frozen_time's date through the day before current_period_end, measure: 'count
    of calendar days in the window, inclusive of both ends'}
- {id: membership_msr_days_in_period, window: from current_period_start through the day before current_period_end,
  measure: 'count of calendar days in the window, inclusive of both ends'}
- id: membership_msr_order_eligible_subtotal
  window: the single order in question
  measure: >-
    sum of amount_usd of that order's order_events rows with event_type order_item_charged, order_item_substituted
    and order_item_refunded (refunds negative), excluding lines whose item_category is alcohol when credit_back_excludes_alcohol
    is true
- {id: membership_msr_removals_this_period, window: from current_period_start through frozen_time, measure: count
    of membership_member_removed rows on this membership dated in the window}
policies:
- id: membership_agg_multi_holding
  subject: [membership_enrolled]
  rule: >
    A customer profile may hold only one Cartwise+ membership that is not canceled. A new enrollment is allowed
    only when every other membership of the customer is canceled. A person covered as a household member on someone
    else's Family or Premier membership who enrolls in a plan of their own must first be removed from that household,
    because benefits never stack across two memberships.
  eligibility:
  - id: no_live_membership
    applies_to: [membership_enrolled]
    kind: dedup
    condition: A new enrollment is allowed only when every other membership of the customer is canceled.
    evidence_fields: [memberships.status, memberships.customer_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.customer_id]
      action_bindings: {memberships.customer_id: customer_id}
    dedup_contract:
      table: memberships
      mode: separate_record
      object_bindings: {customer_id: customer_id}
      duplicate_filters:
        status: [applied, trialing, active, past_due, paused, pending_cancellation]
      distinct_fields: []
  params: {max_per_customer: 1}
- id: membership_enrollment_eligibility
  subject: [membership_enrolled, membership_trial_started, membership_activated, membership_canceled]
  rule: >
    Enrollment follows the plan's entry gate: the holder must meet min_member_age_years and have a payment card
    on file. A plan whose eligibility_proof is not none starts only after that proof is accepted, and the proof
    must be accepted within the proof window counted from the enrollment date. The window is counted in calendar
    days with the enrollment date as day 0 and the last day being the enrollment date plus eligibility_proof_window_days,
    inclusive. An enrollment still without accepted proof after that last day is closed by the agent with cancel
    reason eligibility_not_verified. A trial is granted only when the plan's trial_days is above 0, the customer
    has no canceled membership whose canceled_date is fewer than trial_reeligibility_days before the enrollment
    date, and the customer has received fewer than lifetime_trials_cap trials; otherwise the membership goes straight
    to active with the first period fee. The student plan is refused once the customer's cumulative student-plan
    time would exceed student_max_enrollment_years. Assist and Student memberships must re-verify their proof every
    eligibility_reverification_months; a membership whose proof has lapsed is switched to Cartwise+ Monthly at the
    next renewal under membership_evt_plan_switch.
  eligibility:
  - id: proof_within_window
    applies_to: [membership_trial_started, membership_activated]
    kind: time
    condition: >-
      A plan whose eligibility_proof is not none starts only after that proof is accepted, and the proof must be
      accepted within the proof window counted from the enrollment date.
    evidence_fields: [memberships.enrolled_date, memberships.eligibility_verified_date, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the enrollment date
      anchor_source: memberships.enrolled_date
      relation: not_after
      duration_source: variants.eligibility_proof_window_days
      unit: calendar_days
      counting_rule: >-
        The window is counted in calendar days with the enrollment date as day 0 and the last day being the enrollment
        date plus eligibility_proof_window_days, inclusive.
      boundary: inclusive
  - id: trial_eligible
    applies_to: [membership_trial_started]
    kind: authorization
    condition: >-
      A trial is granted only when the plan's trial_days is above 0, the customer has no canceled membership whose
      canceled_date is fewer than trial_reeligibility_days before the enrollment date, and the customer has received
      fewer than lifetime_trials_cap trials; otherwise the membership goes straight to active with the first period
      fee.
    evidence_fields: [memberships.customer_id, memberships.canceled_date, memberships.trial_end_date, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
  params:
    per_tier:
      Cartwise+ Assist Monthly: {trial_days: =trial_days, eligibility_proof_window_days: =eligibility_proof_window_days}
      Cartwise+ Student Monthly: {trial_days: =trial_days, eligibility_proof_window_days: =eligibility_proof_window_days}
      Cartwise+ Monthly: {trial_days: =trial_days, eligibility_proof_window_days: =eligibility_proof_window_days}
      Cartwise+ Annual: {trial_days: =trial_days, eligibility_proof_window_days: =eligibility_proof_window_days}
      Cartwise+ Family Annual: {trial_days: =trial_days, eligibility_proof_window_days: =eligibility_proof_window_days}
      Cartwise+ Premier Annual: {trial_days: =trial_days, eligibility_proof_window_days: =eligibility_proof_window_days}
- id: membership_evt_fee_billing
  subject: [membership_fee_charged, membership_activated, membership_renewed, membership_resumed]
  rule: >
    Every paid period is billed once, on its first day, at the plan's period_fee_usd; the fee_type records whether
    it is the first_period, a renewal, a renewal_retry after a decline, or a plan_switch charge. A period runs period_length_months
    calendar months on the plan's billing_cycle, and the renewal date follows renewal_day_rule: the renewal date
    is the same day of month as the period start, and when that day does not exist in the renewal month the renewal
    falls on that month's last day. A fee is charged only while the membership is applied, trialing, active, past_due
    or paused at the moment of the charge. Taxes are not added to membership fees. Price is the one in force for
    the plan on the charge date; no tier pays another tier's fee. A renewal is not charged for a membership in pending_cancellation
    or canceled.
  eligibility:
  - id: billable_state
    applies_to: [membership_fee_charged]
    kind: state
    condition: >-
      A fee is charged only while the membership is applied, trialing, active, past_due or paused at the moment
      of the charge.
    evidence_fields: [memberships.status, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    state_contract:
      field: memberships.status
      allowed: [applied, trialing, active, past_due, paused]
  params:
    per_tier:
      Cartwise+ Assist Monthly: {period_fee_usd: =period_fee_usd, period_length_months: =period_length_months}
      Cartwise+ Student Monthly: {period_fee_usd: =period_fee_usd, period_length_months: =period_length_months}
      Cartwise+ Monthly: {period_fee_usd: =period_fee_usd, period_length_months: =period_length_months}
      Cartwise+ Annual: {period_fee_usd: =period_fee_usd, period_length_months: =period_length_months}
      Cartwise+ Family Annual: {period_fee_usd: =period_fee_usd, period_length_months: =period_length_months}
      Cartwise+ Premier Annual: {period_fee_usd: =period_fee_usd, period_length_months: =period_length_months}
  formula: {amount_usd: period_fee_usd}
- id: membership_evt_failed_payment
  subject: [membership_past_due, membership_reinstated, membership_canceled]
  rule: >
    When a period fee is declined the membership becomes past_due and the fee is retried payment_retry_attempts
    times, payment_retry_interval_days apart. Order benefits keep applying during past_due only where benefits_during_past_due
    is true. A capture during past_due reinstates the membership for the period that was being billed; the period
    dates do not move. The membership may be canceled for non-payment only after the grace period counted from the
    date it became past_due has fully run. The grace period is counted in calendar days with past_due_since as day
    0; cancellation is allowed from the day after past_due_since plus past_due_grace_days, so the last grace day
    itself still allows reinstatement. A cancellation for non-payment carries cancel reason unpaid, and no refund
    is owed because no fee was captured for the unpaid period.
  eligibility:
  - id: grace_elapsed
    applies_to: [membership_canceled]
    kind: time
    condition: >-
      The membership may be canceled for non-payment only after the grace period counted from the date it became
      past_due has fully run.
    evidence_fields: [memberships.past_due_since, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the date it became past_due
      anchor_source: memberships.past_due_since
      relation: not_before
      duration_source: variants.past_due_grace_days
      unit: calendar_days
      counting_rule: >-
        The grace period is counted in calendar days with past_due_since as day 0; cancellation is allowed from
        the day after past_due_since plus past_due_grace_days, so the last grace day itself still allows reinstatement.
      boundary: exclusive
  - id: reinstate_from_past_due
    applies_to: [membership_reinstated]
    kind: state
    condition: >-
      A capture during past_due reinstates the membership for the period that was being billed; the period dates
      do not move.
    evidence_fields: [memberships.status, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    state_contract:
      field: memberships.status
      allowed: [past_due, active]
  params:
    per_tier:
      Cartwise+ Assist Monthly: {past_due_grace_days: =past_due_grace_days, benefits_during_past_due: =benefits_during_past_due}
      Cartwise+ Student Monthly: {past_due_grace_days: =past_due_grace_days, benefits_during_past_due: =benefits_during_past_due}
      Cartwise+ Monthly: {past_due_grace_days: =past_due_grace_days, benefits_during_past_due: =benefits_during_past_due}
      Cartwise+ Annual: {past_due_grace_days: =past_due_grace_days, benefits_during_past_due: =benefits_during_past_due}
      Cartwise+ Family Annual: {past_due_grace_days: =past_due_grace_days, benefits_during_past_due: =benefits_during_past_due}
      Cartwise+ Premier Annual: {past_due_grace_days: =past_due_grace_days, benefits_during_past_due: =benefits_during_past_due}
- id: membership_evt_fee_refund
  subject: [membership_fee_refunded]
  rule: >
    A refund always targets one captured fee charge, named by its source_event_id, and the membership's other charges
    are never summed into it. A full refund is available only when the request is made within the unused-refund
    window counted from the day the period fee was charged. The window is counted in calendar days, where the charge
    date is day 0 and the last eligible day is the charge date plus unused_refund_window_days, inclusive. Where
    refund_requires_no_benefit_use is true, a full refund additionally requires membership_msr_benefit_uses_since_charge
    to be 0; a refund_type of full_unused refunds the whole charge. Outside the window, or once a benefit has been
    used, an annual plan (prorated_refund_allowed true) receives a prorated_annual refund of the unused full months
    (membership_msr_unused_full_months), and only while no more than prorated_refund_max_used_months months of the
    period have started; a month has started on the same day-of-month as the period start. Monthly plans receive
    no refund outside the full-refund rule. A second capture for the same plan and billing_period_start is a duplicate_charge
    and is refunded in full when reported within duplicate_charge_refund_days of its capture, regardless of benefit
    use. Each fee charge can be refunded at most once. Refunds go to refund_destination. A refund of a first period
    or renewal charge ends the membership: after a full_unused or prorated_annual refund the membership is canceled,
    registered as a customer request that takes effect once the customer confirms; a duplicate_charge refund leaves
    the membership as it is.
  eligibility:
  - id: full_refund_window
    applies_to: [membership_fee_refunded]
    kind: time
    condition: >-
      A full refund is available only when the request is made within the unused-refund window counted from the
      day the period fee was charged.
    evidence_fields: [membership_events.event_date, membership_events.membership_event_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [membership_events.membership_event_id]
      action_bindings: {membership_events.membership_event_id: source_event_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the period fee was charged
      anchor_source: membership_events.event_date
      relation: not_after
      duration_source: variants.unused_refund_window_days
      unit: calendar_days
      counting_rule: >-
        The window is counted in calendar days, where the charge date is day 0 and the last eligible day is the
        charge date plus unused_refund_window_days, inclusive.
      boundary: inclusive
  - id: one_refund_per_charge
    applies_to: [membership_fee_refunded]
    kind: dedup
    condition: Each fee charge can be refunded at most once.
    evidence_fields: [membership_events.source_event_id, membership_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [membership_events.source_event_id]
      action_bindings: {membership_events.source_event_id: source_event_id}
    dedup_contract:
      table: membership_events
      mode: separate_record
      object_bindings: {source_event_id: source_event_id}
      duplicate_filters:
        event_type: [membership_fee_refunded]
      distinct_fields: []
  params:
    per_tier:
      Cartwise+ Assist Monthly: {unused_refund_window_days: =unused_refund_window_days, prorated_refund_allowed: =prorated_refund_allowed}
      Cartwise+ Student Monthly: {unused_refund_window_days: =unused_refund_window_days, prorated_refund_allowed: =prorated_refund_allowed}
      Cartwise+ Monthly: {unused_refund_window_days: =unused_refund_window_days, prorated_refund_allowed: =prorated_refund_allowed}
      Cartwise+ Annual: {unused_refund_window_days: =unused_refund_window_days, prorated_refund_allowed: =prorated_refund_allowed}
      Cartwise+ Family Annual: {unused_refund_window_days: =unused_refund_window_days, prorated_refund_allowed: =prorated_refund_allowed}
      Cartwise+ Premier Annual: {unused_refund_window_days: =unused_refund_window_days, prorated_refund_allowed: =prorated_refund_allowed}
    months_per_year: 12
  formula: {full_unused_refund: amount_usd, prorated_annual_refund: 'round(amount_usd * membership_msr_unused_full_months
      / months_per_year, 2)'}
  measures: [membership_msr_benefit_uses_since_charge, membership_msr_unused_full_months]
- id: membership_evt_cancellation
  subject: [membership_auto_renew_disabled, membership_auto_renew_enabled, membership_canceled]
  rule: >
    A customer ends a membership in one of two ways, and only the customer can confirm either. Turning off auto-renew
    moves an active membership to pending_cancellation; benefits continue until current_period_end and the membership
    is canceled with reason customer_period_end on that date without a refund. Auto-renew can be turned back on
    only while the membership is still pending_cancellation. An immediate cancellation (reason customer_immediate)
    is available from active and ends benefits on the day it is confirmed; whether any money comes back is decided
    only by membership_evt_fee_refund. A trial canceled before it converts (reason trial_canceled) is never charged.
    The agent registers the request on the customer's behalf and the customer confirms it; the agent never moves
    the status itself. On cancellation any unused priority upgrades lapse, and the credit balance stays spendable
    for credit_forfeit_after_cancel_days after canceled_date before it expires.
  eligibility:
  - id: renew_back_on
    applies_to: [membership_auto_renew_enabled]
    kind: state
    condition: Auto-renew can be turned back on only while the membership is still pending_cancellation.
    evidence_fields: [memberships.status, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    state_contract:
      field: memberships.status
      allowed: [pending_cancellation, active]
  params:
    cancel_reasons: [customer_immediate, customer_period_end, trial_canceled, unpaid, eligibility_not_verified]
- id: membership_evt_pause
  subject: [membership_paused, membership_resumed, membership_pause_logged]
  rule: >
    Only plans with pause_allowed true can be paused, and only from active. A pause starts on the next renewal date
    and lasts between pause_min_days and pause_max_days calendar days. A pause must be requested at least the plan's
    cutoff before the next renewal date. The cutoff is counted in calendar days backward from current_period_end,
    so the last day to ask is current_period_end minus pause_request_cutoff_days, inclusive. A membership may be
    paused no more than pauses_per_rolling_365_days times as counted by membership_msr_pauses_365d. No fee is charged
    and no benefit applies while paused, and priority upgrades and credit expiry clocks keep running. The membership
    resumes on the day after pause_end_date, or earlier on the customer's request, and a new paid period starts
    on the resume day with a renewal fee.
  eligibility:
  - id: pause_cutoff
    applies_to: [membership_paused]
    kind: time
    condition: A pause must be requested at least the plan's cutoff before the next renewal date.
    evidence_fields: [memberships.current_period_end, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the next renewal date
      anchor_source: memberships.current_period_end
      relation: not_after
      duration_source: variants.pause_request_cutoff_days
      unit: calendar_days
      counting_rule: >-
        The cutoff is counted in calendar days backward from current_period_end, so the last day to ask is current_period_end
        minus pause_request_cutoff_days, inclusive.
      boundary: inclusive
  - id: pause_from_active
    applies_to: [membership_paused]
    kind: state
    condition: Only plans with pause_allowed true can be paused, and only from active.
    evidence_fields: [memberships.status, memberships.variant_name, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    state_contract:
      field: memberships.status
      allowed: [active, paused]
  params:
    per_tier:
      Cartwise+ Assist Monthly: {pause_allowed: =pause_allowed, pause_max_days: =pause_max_days}
      Cartwise+ Student Monthly: {pause_allowed: =pause_allowed, pause_max_days: =pause_max_days}
      Cartwise+ Monthly: {pause_allowed: =pause_allowed, pause_max_days: =pause_max_days}
      Cartwise+ Annual: {pause_allowed: =pause_allowed, pause_max_days: =pause_max_days}
      Cartwise+ Family Annual: {pause_allowed: =pause_allowed, pause_max_days: =pause_max_days}
      Cartwise+ Premier Annual: {pause_allowed: =pause_allowed, pause_max_days: =pause_max_days}
  measures: [membership_msr_pauses_365d]
- id: membership_evt_plan_switch
  subject: [membership_plan_switched]
  rule: >
    A membership may switch only to a plan listed in its allowed_switch_targets, and only while it is active. A
    switch to a plan with a higher period_fee_usd takes effect immediately because upgrade_switch_timing is immediate:
    the unused days of the current period are credited under switch_proration_basis unused_days at the old plan's
    daily rate (membership_msr_current_period_charge divided by membership_msr_days_in_period, times membership_msr_unused_days)
    against the new plan's first fee, a new period starts on the switch date, and the plan_switch charge is the
    new period_fee_usd minus that credit, rounded to the cent and never below zero. A switch to a plan with an equal
    or lower fee takes effect, because downgrade_switch_timing is next_renewal, at the next renewal date with no
    proration. Only switches_per_period switch is allowed per paid period, so a switch is allowed only when plan_switched_date
    is empty or earlier than current_period_start. A switch to Assist or Student requires that plan's eligibility
    proof to be accepted first. Priority upgrades are re-allotted only by the new plan's next period start.
  eligibility:
  - id: switch_from_active
    applies_to: [membership_plan_switched]
    kind: state
    condition: >-
      A membership may switch only to a plan listed in its allowed_switch_targets, and only while it is active.
    evidence_fields: [memberships.status, memberships.variant_name, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    state_contract:
      field: memberships.status
      allowed: [active]
  formula:
    proration_credit: >-
      round(membership_msr_current_period_charge * membership_msr_unused_days / membership_msr_days_in_period, 2)
    amount_usd: max(round(period_fee_usd - proration_credit, 2), 0)
  measures: [membership_msr_current_period_charge, membership_msr_unused_days, membership_msr_days_in_period]
- id: membership_evt_credit_back
  subject: [membership_credit_earned, membership_credit_applied, membership_credit_expired]
  rule: >
    A completed order earns Cartwise+ credit when the customer's membership was trialing or active on the order's
    completion date, the order's service level is within credit_back_scope (pickup_only means Curbside Pickup orders
    only), and the eligible item subtotal is at least credit_back_min_subtotal_usd. The eligible item subtotal is
    membership_msr_order_eligible_subtotal: the order's item charges after substitutions and item refunds, excluding
    alcohol lines where credit_back_excludes_alcohol is true, and excluding fees and tips. The credit is credit_back_pct
    of that subtotal, rounded to the cent, capped at credit_back_cap_per_order_usd, and further cut to the room
    left under credit_max_balance_usd. An order earns credit only once. Credit is applied to an order only when
    its item subtotal is at least credit_redemption_min_subtotal_usd, oldest earnings first. Each earning's unspent
    remainder expires credit_expiry_days after it was earned, counted in calendar days with the earning date as
    day 0. After a cancellation, remaining credit expires on canceled_date plus credit_forfeit_after_cancel_days
    if that is sooner.
  eligibility:
  - id: one_earning_per_order
    applies_to: [membership_credit_earned]
    kind: dedup
    condition: An order earns credit only once.
    evidence_fields: [membership_events.order_id, membership_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [membership_events.order_id]
      action_bindings: {membership_events.order_id: order_id}
    dedup_contract:
      table: membership_events
      mode: separate_record
      object_bindings: {order_id: order_id}
      duplicate_filters:
        event_type: [membership_credit_earned]
      distinct_fields: []
  params:
    per_tier:
      Cartwise+ Assist Monthly: {credit_back_pct: =credit_back_pct, credit_back_cap_per_order_usd: =credit_back_cap_per_order_usd}
      Cartwise+ Student Monthly: {credit_back_pct: =credit_back_pct, credit_back_cap_per_order_usd: =credit_back_cap_per_order_usd}
      Cartwise+ Monthly: {credit_back_pct: =credit_back_pct, credit_back_cap_per_order_usd: =credit_back_cap_per_order_usd}
      Cartwise+ Annual: {credit_back_pct: =credit_back_pct, credit_back_cap_per_order_usd: =credit_back_cap_per_order_usd}
      Cartwise+ Family Annual: {credit_back_pct: =credit_back_pct, credit_back_cap_per_order_usd: =credit_back_cap_per_order_usd}
      Cartwise+ Premier Annual: {credit_back_pct: =credit_back_pct, credit_back_cap_per_order_usd: =credit_back_cap_per_order_usd}
  formula:
    amount_usd: >-
      min(round(membership_msr_order_eligible_subtotal * credit_back_pct / 100, 2), credit_back_cap_per_order_usd,
      credit_max_balance_usd - plus_credit)
  measures: [membership_msr_order_eligible_subtotal]
- id: membership_evt_priority_upgrades
  subject: [membership_upgrade_allotted, membership_upgrade_redeemed]
  rule: >
    At the start of each paid period a plan with priority_upgrades_per_period above 0 is allotted that many Priority
    Delivery upgrades; plans with 0 receive no allotment row. Unused upgrades lapse at the end of the period because
    priority_upgrade_rollover is false for every plan. An upgrade is redeemed on a Priority Delivery order placed
    while the membership is trialing or active; it replaces that order's Priority fee in full and uses exactly one
    upgrade. An upgrade cannot be redeemed when priority_upgrades_remaining is 0, and one order uses at most one
    upgrade. A redeemed upgrade is returned only when the order is canceled before shopping starts.
  eligibility:
  - id: one_upgrade_per_order
    applies_to: [membership_upgrade_redeemed]
    kind: dedup
    condition: one order uses at most one upgrade.
    evidence_fields: [membership_events.order_id, membership_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [membership_events.order_id]
      action_bindings: {membership_events.order_id: order_id}
    dedup_contract:
      table: membership_events
      mode: separate_record
      object_bindings: {order_id: order_id}
      duplicate_filters:
        event_type: [membership_upgrade_redeemed]
      distinct_fields: []
  params:
    per_tier:
      Cartwise+ Assist Monthly: {priority_upgrades_per_period: =priority_upgrades_per_period}
      Cartwise+ Student Monthly: {priority_upgrades_per_period: =priority_upgrades_per_period}
      Cartwise+ Monthly: {priority_upgrades_per_period: =priority_upgrades_per_period}
      Cartwise+ Annual: {priority_upgrades_per_period: =priority_upgrades_per_period}
      Cartwise+ Family Annual: {priority_upgrades_per_period: =priority_upgrades_per_period}
      Cartwise+ Premier Annual: {priority_upgrades_per_period: =priority_upgrades_per_period}
- id: membership_evt_household
  subject: [membership_member_added, membership_member_removed]
  rule: >
    Only plans with household_seats above 1 share benefits, and only while the membership is trialing or active.
    A member may be added only while membership_msr_household_active_members is below household_seats. The added
    person must have their own customer profile, be at least household_member_min_age_years old, and must not hold
    a Cartwise+ membership of their own that is not canceled; holding one blocks the addition. A person removed
    from this membership cannot be added back until household_readd_cooldown_days calendar days after the removal
    date have passed. Removals in one paid period are limited to household_removals_per_period as counted by membership_msr_removals_this_period.
    Household members share free delivery, the member service-fee rate and credit earning (credited to the holder's
    balance); priority upgrades and credit redemption remain with the holder.
  eligibility:
  - id: seat_available
    applies_to: [membership_member_added]
    kind: state
    condition: >-
      Only plans with household_seats above 1 share benefits, and only while the membership is trialing or active.
    evidence_fields: [memberships.status, memberships.variant_name, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    state_contract:
      field: memberships.status
      allowed: [trialing, active]
  params:
    per_tier:
      Cartwise+ Assist Monthly: {household_seats: =household_seats, household_removals_per_period: =household_removals_per_period}
      Cartwise+ Student Monthly: {household_seats: =household_seats, household_removals_per_period: =household_removals_per_period}
      Cartwise+ Monthly: {household_seats: =household_seats, household_removals_per_period: =household_removals_per_period}
      Cartwise+ Annual: {household_seats: =household_seats, household_removals_per_period: =household_removals_per_period}
      Cartwise+ Family Annual: {household_seats: =household_seats, household_removals_per_period: =household_removals_per_period}
      Cartwise+ Premier Annual: {household_seats: =household_seats, household_removals_per_period: =household_removals_per_period}
  measures: [membership_msr_household_active_members, membership_msr_removals_this_period]
- id: membership_evt_order_benefits
  subject: [membership_credit_applied, membership_upgrade_redeemed]
  rule: >
    A membership's order benefits are free delivery on the services in free_delivery_services when the order's item
    subtotal is at least free_delivery_order_minimum_usd, the member_service_fee_rate_pct service-fee rate, the
    express_fee_discount_pct discount on the Express 30 fee, the small-basket fee waiver where small_basket_fee_waived
    is true, credit back and priority upgrades. Benefits apply to an order only when the membership is trialing
    or active on the order's placed date, or pending_cancellation (the paid period has not yet ended), or past_due
    where benefits_during_past_due is true; an applied, paused or canceled membership grants none. Benefits are
    judged once, on the placed date, and are not recomputed when the membership's status changes later. How each
    benefit enters the order's charges is set by the order charter.
  eligibility:
  - id: benefit_status
    applies_to: [membership_credit_applied, membership_upgrade_redeemed]
    kind: state
    condition: >-
      Benefits apply to an order only when the membership is trialing or active on the order's placed date, or pending_cancellation
      (the paid period has not yet ended), or past_due where benefits_during_past_due is true; an applied, paused
      or canceled membership grants none.
    evidence_fields: [memberships.status, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    state_contract:
      field: memberships.status
      allowed: [trialing, active, past_due, pending_cancellation]
  params:
    per_tier:
      Cartwise+ Assist Monthly: {free_delivery_order_minimum_usd: =free_delivery_order_minimum_usd, member_service_fee_rate_pct: =member_service_fee_rate_pct}
      Cartwise+ Student Monthly: {free_delivery_order_minimum_usd: =free_delivery_order_minimum_usd, member_service_fee_rate_pct: =member_service_fee_rate_pct}
      Cartwise+ Monthly: {free_delivery_order_minimum_usd: =free_delivery_order_minimum_usd, member_service_fee_rate_pct: =member_service_fee_rate_pct}
      Cartwise+ Annual: {free_delivery_order_minimum_usd: =free_delivery_order_minimum_usd, member_service_fee_rate_pct: =member_service_fee_rate_pct}
      Cartwise+ Family Annual: {free_delivery_order_minimum_usd: =free_delivery_order_minimum_usd, member_service_fee_rate_pct: =member_service_fee_rate_pct}
      Cartwise+ Premier Annual: {free_delivery_order_minimum_usd: =free_delivery_order_minimum_usd, member_service_fee_rate_pct: =member_service_fee_rate_pct}
