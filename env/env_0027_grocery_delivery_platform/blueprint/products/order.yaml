# Product charter: Cartwise Grocery Orders (category key: order).
category: order
display_name: Cartwise Grocery Orders
binding:
  holding_table: orders
  event_tables: [order_events]
  intake_tables: [order_review_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {tip_usd: tip}
lifecycle:
  states: [placed, shopping, en_route, ready_for_pickup, completed, returned, canceled, closed]
  transitions:
  - {from: placed, to: shopping, by: system, means: A shopper accepts the order's batch and starts shopping.}
  - {from: placed, to: canceled, by: user, means: The customer cancels before shopping starts.}
  - {from: shopping, to: canceled, by: user, means: The customer cancels while the order is being shopped and before
      checkout.}
  - {from: shopping, to: en_route, by: system, means: The shopper checks out and leaves the store with a delivery
      order.}
  - {from: shopping, to: ready_for_pickup, by: system, means: The shopper checks out and stages a pickup order at
      the store.}
  - {from: en_route, to: completed, by: system, means: The delivery order is handed over or left at the door.}
  - {from: ready_for_pickup, to: completed, by: system, means: The customer collects the pickup order.}
  - {from: en_route, to: returned, by: system, means: The customer could not be reached and the order is taken back
      to the store.}
  - {from: ready_for_pickup, to: returned, by: system, means: The pickup order is not collected within the hold
      time and is returned to stock.}
  - {from: completed, to: closed, by: system, means: The issue-report window ends and the order's charges are final.}
  - {from: returned, to: closed, by: system, means: The returned order's settlement is final.}
accounts:
- key: order_billed
  unit: USD
  meaning: >-
    Net amount billed to the customer on this order for items and fees; charges book in and refunds book out.
- key: tip
  unit: USD
  meaning: >-
    Tip the customer has committed to the shopper on this order; the checkout tip and increases book in while reductions
    book out.
parameter_schema:
  fulfillment_mode: Enum pickup|delivery — how the order reaches the customer.
  window_length_minutes: Integer minutes — length of the promised delivery or pickup window.
  advance_booking_days: Integer calendar days — how far ahead a window may be booked (0 = same day only).
  order_minimum_usd: USD — minimum item subtotal to place the order.
  max_items: Integer — maximum item units on one order.
  delivery_fee_usd: USD — base delivery fee for non-members (0 for pickup).
  pickup_fee_usd: USD — pickup fee (pickup orders only).
  priority_fee_usd: USD — Priority surcharge added on top of the delivery fee.
  express_fee_usd: USD — Express 30 surcharge added on top of the delivery fee.
  service_fee_rate_pct: Percent of item subtotal — non-member service-fee rate.
  service_fee_min_usd: USD — floor of the service fee.
  service_fee_max_usd: USD — ceiling of the service fee.
  small_basket_threshold_usd: USD — item subtotal below which the small-basket fee applies (0 = no small-basket
    fee).
  small_basket_fee_usd: USD — small-basket fee.
  heavy_item_threshold_count: >-
    Integer — heavy item units (item_category heavy) above which the heavy-order fee applies (0 = no heavy fee).
  heavy_order_fee_usd: USD — heavy-order fee.
  busy_pricing_max_usd: USD — maximum busy-pricing fee shown and accepted at checkout.
  busy_pricing_member_exempt: Boolean — whether members with an order benefit pay no busy-pricing fee.
  reschedule_cutoff_hours: Integer hours — last moment before the window start at which the window may be moved.
  max_reschedules: Integer — reschedules allowed per order.
  item_edit_until: Enum — last moment items may be added or removed.
  cancellation_fee_usd: USD — fee when the customer cancels after shopping started and before checkout.
  cancel_after_checkout_allowed: Boolean — whether an order can be canceled after checkout.
  substitution_default: >-
    Enum best_match|contact_me|refund — what the shopper does for an out-of-stock line with no customer preference.
  substitution_approval_timeout_minutes: >-
    Integer minutes — how long the shopper waits for the customer's chat answer before applying the default.
  substitution_price_cap_pct: >-
    Percent — a replacement whose unit price exceeds the original's by more than this, without customer approval,
    is billed at the original unit price.
  issue_report_window_days: >-
    Integer calendar days after completion within which item issues and substitution rejections can be reported.
  self_service_refund_cap_usd: >-
    USD — maximum item refunds the agent may grant on one order; anything above goes to review.
  self_service_refund_cap_pct: >-
    Percent of the order's item subtotal — second per-order cap; the lower of the two caps applies.
  refund_count_90d_limit: >-
    Integer — item refunds across the customer's orders in a rolling 90 days above which new requests go to review.
  refund_amount_90d_limit_usd: >-
    USD — item refund total across the customer's orders in a rolling 90 days above which new requests go to review.
  damaged_photo_required_over_usd: >-
    USD — a damaged or quality refund for a line charged above this requires a photo on the case.
  weighted_item_tolerance_pct: >-
    Percent — weighed items billed above the requested weight by more than this are refunded down to the tolerance.
  refund_destination_default: >-
    Enum original_payment_method|cartwise_credit — where item and fee refunds go unless the customer asks otherwise.
  service_fee_refund_on_item_refund: Boolean — whether the service fee attributable to refunded items is also refunded.
  on_time_guarantee_scope: >-
    Enum none|pickup_fee|delivery_fee|priority_fee|express_fee — the fee refunded when the order completes late.
  late_threshold_minutes: Integer minutes after the window end beyond which the order counts as late.
  late_refunds_per_30d: Integer — on-time guarantee refunds per customer in a rolling 30 days.
  tip_allowed: Boolean — whether the order carries a shopper tip.
  tip_default_pct: Percent of item subtotal — tip preselected at checkout.
  tip_edit_window_hours: Integer hours after completion during which the tip can be changed.
  tip_edits_after_completion: Integer — tip changes allowed after completion.
  tip_increase_max_usd: USD — largest single tip increase accepted after completion.
  alcohol_allowed: Boolean — whether alcohol lines can be ordered.
  alcohol_return_fee_usd: USD — fee when alcohol is returned because the ID check failed at handoff.
  contact_attempts_before_return: Integer — contact attempts before an undeliverable order is returned (0 = not
    applicable).
  wait_minutes_before_return: >-
    Integer minutes — wait at the address before an undeliverable delivery order is returned; for Curbside Pickup,
    the hold time before an uncollected order is returned.
  returned_item_refund_pct: Percent of item charges refunded on a returned order (perishables are never refunded).
  returned_fees_refundable: Boolean — whether fees are refunded when the order is returned.
  leave_at_door_allowed: Boolean — whether the order may be left unattended.
