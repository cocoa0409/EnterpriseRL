# Product charter: Cartwise Rewards (category key: rewards).
category: rewards
display_name: Cartwise Rewards
binding:
  holding_table: rewards_accounts
  event_tables: [rewards_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {points_balance: points}
lifecycle:
  states: [enrolled, active, suspended, closed]
  transitions:
  - {from: enrolled, to: active, by: system, means: The first qualifying order completes and points start to post.}
  - {from: enrolled, to: closed, by: user, means: The customer leaves the program before any qualifying order.}
  - {from: active, to: suspended, by: agent, means: Earning and redemption are stopped during a misuse review.}
  - {from: suspended, to: active, by: agent, means: The review clears the account.}
  - {from: active, to: closed, by: user, means: The customer leaves the program.}
  - {from: suspended, to: closed, by: system, means: The review confirms misuse and the account is closed.}
accounts:
- key: points
  unit: points
  meaning: >-
    Cartwise Rewards points available to redeem; earnings and bonuses and restorations book in while redemptions
    and reversals and expiries book out.
parameter_schema:
  qualifying_spend_12m_min_usd: USD — qualifying spend in the trailing 12 months needed to hold the tier.
  points_per_usd: Integer points per whole dollar of qualifying spend.
  tier_multiplier: Decimal — multiplier on base points.
  pickup_bonus_points_per_usd: Integer points per whole dollar added on Curbside Pickup orders.
  weekly_bonus_order_points: Integer points for the first qualifying order each calendar week.
  earn_on_fees: Boolean — whether fees count as qualifying spend.
  earn_on_tips: Boolean — whether tips count as qualifying spend.
  earn_on_alcohol: Boolean — whether alcohol lines count as qualifying spend.
  earn_on_giftcard_paid: Boolean — whether the part of an order paid by gift card counts as qualifying spend.
  earn_posting_trigger: Enum order_closed — when points for an order post.
  qualifying_spend_basis: Enum item_subtotal_after_refunds — what counts as qualifying spend.
  redemption_block_points: Integer — points per redemption block.
  redemption_block_value_usd: USD — value of one redemption block.
  min_redemption_blocks: Integer — fewest blocks redeemable on one order.
  max_redemption_pct_of_subtotal: Percent — most of an order's item subtotal that points may pay.
  redemption_applies_after_credit: Boolean — whether points apply after Cartwise+ credit on the same order.
  redemption_restored_on_cancel: Boolean — whether points redeemed on an order canceled before shopping come back.
  points_expiry_months: >-
    Integer calendar months after posting at which unredeemed points expire when the account had no activity.
  activity_extends_expiry: Boolean — whether any earning or redemption resets the expiry clock of all points.
  max_points_balance: Integer — points balance above which new earnings are cut to the room left.
  refund_reversal_basis: Enum proportional — how points are taken back when an order is refunded.
  negative_balance_allowed: Boolean — whether a reversal may take the balance below zero.
  birthday_bonus_points: Integer points credited in the customer's birth month.
  enrollment_anniversary_points: Integer points credited on each enrollment anniversary.
  double_points_days_per_year: Integer — double-points days offered per calendar year.
  double_points_bonus_cap: Integer — most extra points one double-points order earns.
  referral_bonus_points: Integer points for a referred friend's first completed order.
  referrals_per_year_cap: Integer — referral bonuses per calendar year.
  tier_evaluation_day: Integer — day of the month on which tiers are evaluated.
  tier_grace_months: Integer — months a member keeps a tier after falling below its spend.
  tier_downgrade_steps: Integer — tiers lost per evaluation after grace.
  inactivity_close_months: Integer — months without any order after which an account is closed.
  closure_forfeits_points: Boolean — whether points lapse on closure.
  suspend_on_misuse_report: Boolean — whether a misuse report suspends earning and redemption at once.
  misuse_review_business_days: Integer business days — target to finish a misuse review.
  reinstatement_restores_pending: Boolean — whether points held during suspension post after reinstatement.
  earn_on_membership_fees: Boolean — whether Cartwise+ fees earn points.
  pickup_bonus_min_subtotal_usd: USD — smallest pickup subtotal earning the pickup bonus.
  weekly_bonus_min_subtotal_usd: USD — smallest subtotal earning the weekly bonus.
  point_rounding: Enum floor — how fractional points are rounded.
  double_points_multiplier: Integer — multiplier on base points on a double-points day.
  birthday_bonus_window: Enum birth_month — when the birthday bonus posts.
  anniversary_basis: Enum enrolled_date — the date anniversaries count from.
  referral_min_subtotal_usd: >-
    USD — smallest first-order item subtotal of a referred friend that earns the referral bonus.
  tier_promotion_timing: Enum at_evaluation — when a promotion takes effect.
  weekly_bonus_week_basis: Enum monday_to_sunday_local — the calendar week for the weekly bonus.
  points_pay_alcohol: Boolean — whether redeemed points can pay alcohol lines.
  points_pay_fees: Boolean — whether redeemed points can pay delivery and service fees.
