events:
- type: rewards_enrolled
  target: rewards_accounts
  mutation: create
  meaning: A customer joins Cartwise Rewards.
  grain: one row per enrollment
  fields: {customer_id: the member, variant_name: Cartwise Rewards Member at enrollment, enrolled_date: enrollment
      date}
  triggers: []
- type: rewards_activated
  target: rewards_accounts
  mutation:
    transition: {from: enrolled, to: active}
  meaning: The first qualifying order completes.
  grain: one row per transaction
  fields: {activated_date: activation date}
  triggers: []
- type: rewards_suspended
  target: rewards_accounts
  mutation:
    transition: {from: active, to: suspended}
  meaning: A misuse review suspends the account.
  grain: one row per transaction
  fields: {suspended_date: suspension date}
  triggers: []
- type: rewards_reinstated
  target: rewards_accounts
  mutation:
    transition: {from: suspended, to: active}
  meaning: The review clears the account.
  grain: one row per transaction
  fields: {suspended_date: cleared to empty}
  triggers: []
- type: rewards_closed
  target: rewards_accounts
  mutation:
    transition:
    - {from: enrolled, to: closed}
    - {from: active, to: closed}
    - {from: suspended, to: closed}
  meaning: The rewards account ends.
  grain: one row per transaction
  fields: {closed_date: closure date, close_reason: controlled reason}
  triggers: []
- type: rewards_tier_changed
  target: rewards_accounts
  mutation: update
  meaning: The monthly evaluation moves the member to another tier.
  grain: one row per transaction
  fields: {variant_name: new tier, tier_evaluated_date: evaluation date}
  triggers: []
- type: rewards_points_earned
  target: rewards_events
  meaning: Points post for one closed order or one bonus.
  grain: one row per earn type per order
  distinguish_by: [earn_type, order_id, event_date]
  fields:
    earn_type: >-
      base or pickup_bonus or weekly_bonus or double_points or birthday or anniversary or referral
    order_id: the order (empty for non-order bonuses)
    points: points credited
    event_date: posting date
  account: points
  direction: in
  triggers: []
- type: rewards_points_redeemed
  target: rewards_events
  meaning: Points pay toward one order.
  grain: one row per order
  distinguish_by: [order_id]
  fields: {order_id: the order paid, points: points used, amount_usd: value applied, event_date: redemption date}
  account: points
  direction: out
  triggers: []
- type: rewards_points_restored
  target: rewards_events
  meaning: Points redeemed on an order canceled before shopping come back.
  grain: one row per restored redemption
  distinguish_by: [source_event_id]
  fields: {source_event_id: the rewards_points_redeemed row restored, order_id: the canceled order, points: points
      returned, event_date: restore date}
  account: points
  direction: in
  triggers: []
- type: rewards_points_reversed
  target: rewards_events
  meaning: Points earned on an order are taken back after an item refund.
  grain: one row per order refund row
  distinguish_by: [source_event_id]
  fields: {source_event_id: the order_events refund row that caused it, order_id: the refunded order, points: points
      removed, event_date: reversal date}
  account: points
  direction: out
  triggers: []
- type: rewards_points_expired
  target: rewards_events
  meaning: Unredeemed points lapse.
  grain: one row per expiry run
  distinguish_by: [event_date]
  fields: {points: points removed, event_date: expiry date}
  account: points
  direction: out
  triggers: []
measures:
- id: rewards_msr_qualifying_spend_12m
  window: the 12 calendar months ending the day before the evaluation date
  measure: >-
    sum of the customer's order item subtotals after item refunds, excluding alcohol, fees and tips, for orders
    closed in the window
- {id: rewards_msr_last_activity_date, window: all history through frozen_time, measure: latest event_date of rewards_points_earned
    or rewards_points_redeemed rows on the account}
- {id: rewards_msr_referrals_this_year, window: the calendar year of frozen_time, measure: count of rewards_points_earned
    rows with earn_type referral}
policies:
- id: rewards_agg_multi_holding
  subject: [rewards_enrolled]
  rule: >
    A customer holds one rewards account. A new enrollment is allowed only when the customer has no rewards account
    that is not closed.
  eligibility:
  - id: one_rewards_account
    applies_to: [rewards_enrolled]
    kind: dedup
    condition: >-
      A new enrollment is allowed only when the customer has no rewards account that is not closed.
    evidence_fields: [rewards_accounts.customer_id, rewards_accounts.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rewards_accounts.customer_id]
      action_bindings: {rewards_accounts.customer_id: customer_id}
    dedup_contract:
      table: rewards_accounts
      mode: separate_record
      object_bindings: {customer_id: customer_id}
      duplicate_filters:
        status: [enrolled, active, suspended]
      distinct_fields: []
  params: {max_per_customer: 1}
- id: rewards_enrollment
  subject: [rewards_enrolled, rewards_activated, rewards_closed]
  rule: >
    Enrollment is free and starts at Cartwise Rewards Member. The account activates when the customer's first order
    after enrollment closes. A customer may leave at any time; points lapse on closure where closure_forfeits_points
    is true. An account with no order for inactivity_close_months months is closed with close_reason inactivity.
  eligibility: []
  params:
    per_tier:
      Cartwise Rewards Member: {inactivity_close_months: =inactivity_close_months}
      Cartwise Rewards Bronze: {inactivity_close_months: =inactivity_close_months}
      Cartwise Rewards Silver: {inactivity_close_months: =inactivity_close_months}
      Cartwise Rewards Gold: {inactivity_close_months: =inactivity_close_months}
      Cartwise Rewards Platinum: {inactivity_close_months: =inactivity_close_months}
      Cartwise Rewards Diamond: {inactivity_close_months: =inactivity_close_months}
- id: rewards_evt_earning
  subject: [rewards_points_earned]
  rule: >
    Points post when an order closes, because earn_posting_trigger is order_closed, on its qualifying spend (qualifying_spend_basis
    item_subtotal_after_refunds, excluding fees, tips and alcohol), as points_per_usd per whole dollar times tier_multiplier,
    floored. Curbside Pickup orders with qualifying spend of at least pickup_bonus_min_subtotal_usd add pickup_bonus_points_per_usd
    per whole dollar. The first order of each calendar week with qualifying spend of at least weekly_bonus_min_subtotal_usd
    adds weekly_bonus_order_points. Bonuses are posted as their own earn_type rows and are not multiplied. Birthday
    and anniversary bonuses post once a year; referral bonuses stop after referrals_per_year_cap (rewards_msr_referrals_this_year).
    Earnings are cut to the room left under max_points_balance. Points post only while the account is active. Fees,
    tips, alcohol and Cartwise+ fees never earn because earn_on_fees, earn_on_tips, earn_on_alcohol and earn_on_membership_fees
    are false, while the part of an order paid by gift card earns because earn_on_giftcard_paid is true; fractions
    follow point_rounding floor. The birthday bonus is birthday_bonus_points in the birth month (birthday_bonus_window)
    and the anniversary bonus is enrollment_anniversary_points on each anniversary of enrolled_date (anniversary_basis).
    On one of the tier's double_points_days_per_year days an order adds a double_points row of base points times
    (double_points_multiplier - 1), capped at double_points_bonus_cap. A referred friend's first completed order
    with an item subtotal of at least referral_min_subtotal_usd earns referral_bonus_points. The weekly bonus week
    runs weekly_bonus_week_basis.
  eligibility:
  - id: earn_active
    applies_to: [rewards_points_earned]
    kind: state
    condition: Points post only while the account is active.
    evidence_fields: [rewards_accounts.status, rewards_accounts.rewards_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rewards_accounts.rewards_account_id]
      action_bindings: {rewards_accounts.rewards_account_id: rewards_account_id}
    state_contract:
      field: rewards_accounts.status
      allowed: [active]
  params:
    per_tier:
      Cartwise Rewards Member: {tier_multiplier: =tier_multiplier, weekly_bonus_order_points: =weekly_bonus_order_points}
      Cartwise Rewards Bronze: {tier_multiplier: =tier_multiplier, weekly_bonus_order_points: =weekly_bonus_order_points}
      Cartwise Rewards Silver: {tier_multiplier: =tier_multiplier, weekly_bonus_order_points: =weekly_bonus_order_points}
      Cartwise Rewards Gold: {tier_multiplier: =tier_multiplier, weekly_bonus_order_points: =weekly_bonus_order_points}
      Cartwise Rewards Platinum: {tier_multiplier: =tier_multiplier, weekly_bonus_order_points: =weekly_bonus_order_points}
      Cartwise Rewards Diamond: {tier_multiplier: =tier_multiplier, weekly_bonus_order_points: =weekly_bonus_order_points}
  measures: [rewards_msr_referrals_this_year]
- id: rewards_evt_redemption
  subject: [rewards_points_redeemed, rewards_points_restored]
  rule: >
    Points are redeemed in whole blocks of redemption_block_points, each worth redemption_block_value_usd, at least
    min_redemption_blocks per order, and for no more than max_redemption_pct_of_subtotal of the order's item subtotal.
    Points apply after Cartwise+ credit on the same order. Redemption is allowed only while the account is active.
    Points redeemed on an order canceled before shopping are restored once. Points apply after Cartwise+ credit
    because redemption_applies_after_credit is true, are restored on a pre-shopping cancellation because redemption_restored_on_cancel
    is true, never pay alcohol lines because points_pay_alcohol is false, and pay delivery and service fees only
    where points_pay_fees is true.
  eligibility:
  - id: redeem_active
    applies_to: [rewards_points_redeemed]
    kind: state
    condition: Redemption is allowed only while the account is active.
    evidence_fields: [rewards_accounts.status, rewards_accounts.rewards_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rewards_accounts.rewards_account_id]
      action_bindings: {rewards_accounts.rewards_account_id: rewards_account_id}
    state_contract:
      field: rewards_accounts.status
      allowed: [active]
  params:
    per_tier:
      Cartwise Rewards Member: {max_redemption_pct_of_subtotal: =max_redemption_pct_of_subtotal}
      Cartwise Rewards Bronze: {max_redemption_pct_of_subtotal: =max_redemption_pct_of_subtotal}
      Cartwise Rewards Silver: {max_redemption_pct_of_subtotal: =max_redemption_pct_of_subtotal}
      Cartwise Rewards Gold: {max_redemption_pct_of_subtotal: =max_redemption_pct_of_subtotal}
      Cartwise Rewards Platinum: {max_redemption_pct_of_subtotal: =max_redemption_pct_of_subtotal}
      Cartwise Rewards Diamond: {max_redemption_pct_of_subtotal: =max_redemption_pct_of_subtotal}
- id: rewards_evt_reversal
  subject: [rewards_points_reversed]
  rule: >
    When an item refund is booked on an order that has already earned points, the base and multiplied points earned
    on the refunded amount are reversed in proportion (refund_reversal_basis proportional), floored, one reversal
    per refund row. A reversal never takes the balance below zero because negative_balance_allowed is false; the
    uncovered remainder is dropped. Bonus rows are not reversed unless the order's qualifying spend falls below
    the bonus minimum.
  eligibility:
  - id: reverse_once
    applies_to: [rewards_points_reversed]
    kind: dedup
    condition: >-
      When an item refund is booked on an order that has already earned points, the base and multiplied points earned
      on the refunded amount are reversed in proportion (refund_reversal_basis proportional), floored, one reversal
      per refund row.
    evidence_fields: [rewards_events.source_event_id, rewards_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rewards_events.source_event_id]
      action_bindings: {rewards_events.source_event_id: source_event_id}
    dedup_contract:
      table: rewards_events
      mode: separate_record
      object_bindings: {source_event_id: source_event_id}
      duplicate_filters:
        event_type: [rewards_points_reversed]
      distinct_fields: []
- id: rewards_evt_expiry
  subject: [rewards_points_expired]
  rule: >
    Points expire only after a stretch without activity. The expiry is counted in calendar months from the last
    activity date (rewards_msr_last_activity_date), and points expire on the same day-of-month points_expiry_months
    later, falling back to the month's last day. Because activity_extends_expiry is true, any earning or redemption
    restarts the clock for the whole balance.
  eligibility:
  - id: inactivity_elapsed
    applies_to: [rewards_points_expired]
    kind: time
    condition: Points expire only after a stretch without activity.
    evidence_fields: [rewards_events.event_date, rewards_events.rewards_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rewards_events.rewards_account_id]
      action_bindings: {rewards_events.rewards_account_id: rewards_account_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: a stretch without activity
      anchor_source: rewards_events.event_date
      relation: not_before
      duration_source: variants.points_expiry_months
      unit: calendar_months
      counting_rule: >-
        The expiry is counted in calendar months from the last activity date (rewards_msr_last_activity_date), and
        points expire on the same day-of-month points_expiry_months later, falling back to the month's last day.
      boundary: inclusive
  params:
    per_tier:
      Cartwise Rewards Member: {points_expiry_months: =points_expiry_months}
      Cartwise Rewards Bronze: {points_expiry_months: =points_expiry_months}
      Cartwise Rewards Silver: {points_expiry_months: =points_expiry_months}
      Cartwise Rewards Gold: {points_expiry_months: =points_expiry_months}
      Cartwise Rewards Platinum: {points_expiry_months: =points_expiry_months}
      Cartwise Rewards Diamond: {points_expiry_months: =points_expiry_months}
  measures: [rewards_msr_last_activity_date]
- id: rewards_evt_tier_evaluation
  subject: [rewards_tier_changed]
  rule: >
    Tiers are evaluated on tier_evaluation_day each month against rewards_msr_qualifying_spend_12m. A member is
    promoted at once to the highest tier whose qualifying_spend_12m_min_usd is met. A member below the current tier's
    minimum keeps it for tier_grace_months evaluations and then drops tier_downgrade_steps tier. Tiers are evaluated
    only for accounts that are active. Promotions take effect at the evaluation (tier_promotion_timing).
  eligibility:
  - id: evaluate_active
    applies_to: [rewards_tier_changed]
    kind: state
    condition: Tiers are evaluated only for accounts that are active.
    evidence_fields: [rewards_accounts.status, rewards_accounts.rewards_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rewards_accounts.rewards_account_id]
      action_bindings: {rewards_accounts.rewards_account_id: rewards_account_id}
    state_contract:
      field: rewards_accounts.status
      allowed: [active]
  params:
    per_tier:
      Cartwise Rewards Member: {qualifying_spend_12m_min_usd: =qualifying_spend_12m_min_usd, tier_grace_months: =tier_grace_months}
      Cartwise Rewards Bronze: {qualifying_spend_12m_min_usd: =qualifying_spend_12m_min_usd, tier_grace_months: =tier_grace_months}
      Cartwise Rewards Silver: {qualifying_spend_12m_min_usd: =qualifying_spend_12m_min_usd, tier_grace_months: =tier_grace_months}
      Cartwise Rewards Gold: {qualifying_spend_12m_min_usd: =qualifying_spend_12m_min_usd, tier_grace_months: =tier_grace_months}
      Cartwise Rewards Platinum: {qualifying_spend_12m_min_usd: =qualifying_spend_12m_min_usd, tier_grace_months: =tier_grace_months}
      Cartwise Rewards Diamond: {qualifying_spend_12m_min_usd: =qualifying_spend_12m_min_usd, tier_grace_months: =tier_grace_months}
  measures: [rewards_msr_qualifying_spend_12m]
- id: rewards_evt_suspension
  subject: [rewards_suspended, rewards_reinstated, rewards_closed]
  rule: >
    A misuse report (points earned on orders later found fraudulent, or account sharing) suspends the account at
    once where suspend_on_misuse_report is true; no points post or redeem while suspended. A suspension is lifted
    only while the account is suspended and only when the review clears it, and points held during the suspension
    then post where reinstatement_restores_pending is true. A confirmed misuse closes the account with close_reason
    misuse and its points lapse.
  eligibility:
  - id: lift_suspended
    applies_to: [rewards_reinstated]
    kind: state
    condition: >-
      A suspension is lifted only while the account is suspended and only when the review clears it, and points
      held during the suspension then post where reinstatement_restores_pending is true.
    evidence_fields: [rewards_accounts.status, rewards_accounts.rewards_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [rewards_accounts.rewards_account_id]
      action_bindings: {rewards_accounts.rewards_account_id: rewards_account_id}
    state_contract:
      field: rewards_accounts.status
      allowed: [suspended, active]
  params:
    per_tier:
      Cartwise Rewards Member: {misuse_review_business_days: =misuse_review_business_days}
      Cartwise Rewards Bronze: {misuse_review_business_days: =misuse_review_business_days}
      Cartwise Rewards Silver: {misuse_review_business_days: =misuse_review_business_days}
      Cartwise Rewards Gold: {misuse_review_business_days: =misuse_review_business_days}
      Cartwise Rewards Platinum: {misuse_review_business_days: =misuse_review_business_days}
      Cartwise Rewards Diamond: {misuse_review_business_days: =misuse_review_business_days}
