# Product charter: Cartwise Shopper Contractor Accounts (category key: shopper).
category: shopper
display_name: Cartwise Shopper Contractor Accounts
binding:
  holding_table: shopper_accounts
  event_tables: [shopper_events]
  intake_tables: [shopper_appeals]
  status_field: status
  variant_field: variant_name
  quantity_fields: {violation_points_balance: violation_points}
lifecycle:
  states: [applied, screening, active, on_hold, deactivated, closed]
  transitions:
  - {from: applied, to: screening, by: system, means: The applicant's documents are complete and the background
      check is ordered.}
  - {from: screening, to: active, by: system, means: The background check returns clear and the account can take
      batches.}
  - {from: screening, to: closed, by: system, means: The background check does not return clear or documents are
      not supplied.}
  - {from: active, to: on_hold, by: system, means: Batch access is suspended while an incident or a points threshold
      is reviewed.}
  - {from: on_hold, to: active, by: agent, means: The review ends without deactivation and batch access returns.}
  - {from: on_hold, to: deactivated, by: system, means: The review upholds a deactivation cause.}
  - {from: active, to: deactivated, by: system, means: A deactivation cause is met on an active account.}
  - {from: deactivated, to: active, by: agent, means: The deactivation cause is cured or an appeal is upheld and
      the account is reactivated.}
  - {from: active, to: closed, by: user, means: The shopper closes the account.}
  - {from: deactivated, to: closed, by: system, means: The appeal window lapses without an appeal or an appeal is
      finally denied.}
accounts:
- key: violation_points
  unit: points
  meaning: >-
    Active violation points on the account; recorded violations book in while cleared or expired violations book
    out.
parameter_schema:
  service_scope: Enum shop_only|full_service — whether the shopper only shops and stages or also delivers.
  vehicle_required: Boolean — whether an insured vehicle and valid licence must be on file.
  min_age_years: Integer years — minimum age to hold the account.
  alcohol_min_age_years: Integer years — minimum age to take batches containing alcohol.
  background_check_renewal_months: Integer calendar months — how often the background check is re-run.
  document_grace_days: >-
    Integer calendar days after a licence or insurance expiry date during which the account stays active awaiting
    the renewed document.
  rating_window_ratings: Integer — number of most recent non-excluded customer ratings in the average.
  min_ratings_for_evaluation: >-
    Integer — ratings needed before the average is used for warnings, deactivation or level evaluation.
  rating_warning_threshold: Decimal stars — an average below this issues a rating warning.
  rating_floor: Decimal stars — an average below this after the warning cure period leads to deactivation.
  warning_cure_days: >-
    Integer calendar days after a rating warning during which the shopper can raise the average before deactivation
    is considered.
  rating_exclusion_reasons: List — reasons for which a low rating (1 to 3 stars) is removed from the average.
  rating_exclusions_per_30d: Integer — rating exclusions granted in a rolling 30 days.
  rating_exclusion_request_days: Integer calendar days after the rating date within which an exclusion can be requested.
  violation_window_days: >-
    Integer calendar days — a violation's points count for this long from the violation date and then expire.
  violation_points_hold_threshold: Integer points — active points at or above which the account is placed on hold
    for review.
  violation_points_deactivation_threshold: Integer points — active points at or above which the account is deactivated.
  points_late_delivery: >-
    Integer points — completing a delivery more than the order's late threshold after its window.
  points_missing_items_verified: Integer points — a missing-item report verified against the checkout receipt.
  points_batch_dropped: Integer points — dropping a batch after accepting it.
  points_wrong_address: Integer points — handing an order to the wrong address.
  points_conduct_complaint: Integer points — a substantiated customer or store conduct complaint.
  points_alcohol_procedure: Integer points — handing over alcohol without completing the ID scan.
  zero_tolerance_violations: List — violations that deactivate on the first substantiated occurrence.
  violation_dispute_days: Integer calendar days after a violation date within which the shopper can dispute it.
  acceptance_rate_counts: >-
    Boolean — whether declining offered batches affects status (it never does for contractors).
  hold_max_days: >-
    Integer calendar days — a hold must end in release or deactivation within this many days of hold_start_date.
  hold_pay_for_accepted_batches: >-
    Boolean — whether batches accepted before the hold are still paid when the hold interrupts them.
  appeal_window_days: Integer calendar days after the deactivation date within which an appeal can be submitted.
  appeal_decision_business_days: Integer business days — decision target for a submitted appeal.
  appealable_reasons: List — deactivation reasons open to appeal.
  reactivations_lifetime_max: Integer — reactivations an account may ever receive.
  reactivation_level: Enum — level the account returns at after reactivation.
  reapply_after_closure_days: Integer calendar days after closure before the person may apply again.
  level_evaluation_day: Integer — day of each calendar month on which levels are evaluated.
  level_min_batches_30d: Integer — completed batches in the 30 days before evaluation needed to hold the level.
  level_min_avg_rating: Decimal stars — rating average needed to hold the level (0 = no requirement).
  level_min_on_time_pct: >-
    Percent — on-time completions in the 30 days before evaluation needed to hold the level (0 = no requirement).
  level_demotion_grace_cycles: Integer — consecutive failed evaluations tolerated before a one-level demotion.
  early_schedule_access_hours: Integer hours — how much earlier than general release the shopper can reserve hours.
  batch_offer_head_start_seconds: Integer seconds — head start on new batch offers.
  max_concurrent_orders: Integer — orders the shopper may carry in one batch.
  heavy_batches_eligible: Boolean — whether batches with heavy orders are offered.
  stockup_batches_eligible: Boolean — whether Stock-Up Delivery batches are offered.
  express_batches_eligible: Boolean — whether Express 30 batches are offered.
  alcohol_batches_eligible: >-
    Boolean — whether batches containing alcohol are offered, subject to alcohol_min_age_years.
  dedicated_support_line: Boolean — whether the shopper reaches the priority shopper-support queue.
  retraining_after_hold: Boolean — whether a released hold requires the in-app refresher before new batches.
