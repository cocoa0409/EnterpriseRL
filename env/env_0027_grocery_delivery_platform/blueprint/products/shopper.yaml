events:
- type: shopper_applied
  target: shopper_accounts
  mutation: create
  meaning: A person applies to shop on Cartwise and the contractor account opens.
  grain: one row per application
  fields: {customer_id: the applicant's profile, variant_name: the entry level applied for (Shop-Only Shopper or
      Full-Service Shopper), applied_date: application date}
  triggers: []
- type: shopper_screening_started
  target: shopper_accounts
  mutation:
    transition: {from: applied, to: screening}
  meaning: The background check is ordered.
  grain: one row per transaction
  fields: {background_check_date: date the check was ordered}
  triggers: []
- type: shopper_activated
  target: shopper_accounts
  mutation:
    transition: {from: screening, to: active}
  meaning: The background check is clear and the account can take batches.
  grain: one row per transaction
  fields: {activated_date: activation date}
  triggers: []
- type: shopper_screening_failed
  target: shopper_accounts
  mutation:
    transition: {from: screening, to: closed}
  meaning: The background check does not come back clear and the application closes.
  grain: one row per transaction
  fields: {closed_date: closure date, closure_reason: screening_not_clear}
  triggers: []
- type: shopper_document_updated
  target: shopper_accounts
  mutation: update
  meaning: A renewed driver licence or vehicle insurance document is accepted onto the account.
  grain: one row per transaction
  fields: {license_expiry_date: expiry date of the licence now on file, insurance_expiry_date: expiry date of the
      insurance now on file}
  triggers: []
- type: shopper_rating_warning_issued
  target: shopper_accounts
  mutation: update
  meaning: The shopper is warned that the rating average is below the warning threshold.
  grain: one row per transaction
  fields: {rating_warning_date: date the warning was issued}
  triggers: []
- type: shopper_hold_placed
  target: shopper_accounts
  mutation:
    transition: {from: active, to: on_hold}
  meaning: Batch access is suspended pending review.
  grain: one row per transaction
  fields: {hold_start_date: first day of the hold, hold_reason: why the hold was placed}
  triggers: []
- type: shopper_hold_released
  target: shopper_accounts
  mutation:
    transition: {from: on_hold, to: active}
  meaning: The review ends without deactivation and batch access returns.
  grain: one row per transaction
  fields: {hold_start_date: cleared to empty, hold_reason: cleared to empty}
  triggers: []
- type: shopper_deactivated
  target: shopper_accounts
  mutation:
    transition:
    - {from: active, to: deactivated}
    - {from: on_hold, to: deactivated}
  meaning: The account loses access to batches.
  grain: one row per transaction
  fields: {deactivated_date: deactivation date, deactivation_reason: controlled cause}
  triggers: []
- type: shopper_reactivated
  target: shopper_accounts
  mutation:
    transition: {from: deactivated, to: active}
  meaning: A deactivated account regains access to batches.
  grain: one row per transaction
  fields: {reactivated_date: reactivation date, reactivation_count: reactivations received including this one, variant_name: level
      the account returns at}
  triggers: []
- type: shopper_closed
  target: shopper_accounts
  mutation:
    transition:
    - {from: active, to: closed}
    - {from: deactivated, to: closed}
  meaning: The contractor account ends.
  grain: one row per transaction
  fields: {closed_date: closure date, closure_reason: controlled cause}
  triggers: []
- type: shopper_level_changed
  target: shopper_accounts
  mutation: update
  meaning: The monthly evaluation moves the shopper to another level.
  grain: one row per transaction
  fields: {variant_name: the new level, level_evaluated_date: evaluation date}
  triggers: []
- type: shopper_rating_received
  target: shopper_events
  meaning: A customer rates the shopper for one completed order.
  grain: one row per rated order
  distinguish_by: [order_id]
  fields: {order_id: the rated order, batch_id: the batch it was in, rating: stars given, event_date: rating date}
  triggers: []
- type: shopper_rating_excluded
  target: shopper_events
  meaning: One low rating is removed from the shopper's average.
  grain: one row per excluded rating
  distinguish_by: [source_event_id]
  fields: {source_event_id: the shopper_rating_received row removed, order_id: the rated order, exclusion_reason: controlled
      reason, event_date: exclusion date}
  triggers: []
- type: shopper_violation_recorded
  target: shopper_events
  meaning: >-
    A violation is recorded against the account with its points (0 for zero-tolerance reports under investigation).
  grain: one row per violation on one order
  distinguish_by: [violation_type, order_id, event_date]
  fields: {violation_type: controlled violation, order_id: order involved (empty when none), batch_id: batch involved
      (empty when none), points: points added, event_date: violation date}
  account: violation_points
  direction: in
  triggers:
  - event: shopper:shopper_hold_placed
    when:
      violation_type: [fraud, harassment, theft, alcohol_to_minor, account_sharing, unsafe_driving_injury]
    map: {hold_reason: incident_investigation}
- type: shopper_violation_cleared
  target: shopper_events
  meaning: One violation's points leave the account, by expiry or by a successful dispute.
  grain: one row per cleared violation
  distinguish_by: [source_event_id]
  fields: {source_event_id: the shopper_violation_recorded row cleared, removal_reason: controlled reason, points: points
      removed, event_date: clearing date}
  account: violation_points
  direction: out
  triggers: []
measures:
- id: shopper_msr_avg_rating
  window: >-
    the most recent rating_window_ratings shopper_rating_received rows on the account that have no shopper_rating_excluded
    row, as of frozen_time
  measure: >-
    arithmetic mean of rating over those rows, rounded to 2 decimals; undefined while fewer than min_ratings_for_evaluation
    rows exist
- id: shopper_msr_active_points
  window: >-
    violations dated within violation_window_days calendar days before frozen_time's date, inclusive
  measure: >-
    sum of points of shopper_violation_recorded rows in the window that have no shopper_violation_cleared row
- {id: shopper_msr_exclusions_30d, window: 'rolling 30 calendar days ending on frozen_time, by event_date', measure: count
    of shopper_rating_excluded rows on the account}
- {id: shopper_msr_batches_30d, window: the 30 calendar days ending the day before the evaluation date, measure: count
    of the shopper's batches (batches table) whose completed_date falls in the window}
- id: shopper_msr_on_time_pct_30d
  window: the 30 calendar days ending the day before the evaluation date
  measure: >-
    percent of the shopper's completed delivery orders in the window whose completed_at is no later than scheduled_window_end
    plus that order's late_threshold_minutes, rounded to 1 decimal
policies:
- id: shopper_agg_multi_holding
  subject: [shopper_applied]
  rule: >
    A person may hold only one shopper contractor account. A new application is accepted only when the person has
    no shopper account that is not closed, and only when any closed account's closed_date is at least reapply_after_closure_days
    before the application date. An account closed for screening_not_clear follows the same waiting period.
  eligibility:
  - id: one_account
    applies_to: [shopper_applied]
    kind: dedup
    condition: >-
      A new application is accepted only when the person has no shopper account that is not closed, and only when
      any closed account's closed_date is at least reapply_after_closure_days before the application date.
    evidence_fields: [shopper_accounts.customer_id, shopper_accounts.status, shopper_accounts.closed_date]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [shopper_accounts.customer_id]
      action_bindings: {shopper_accounts.customer_id: customer_id}
    dedup_contract:
      table: shopper_accounts
      mode: separate_record
      object_bindings: {customer_id: customer_id}
      duplicate_filters:
        status: [applied, screening, active, on_hold, deactivated]
      distinct_fields: [closed_date]
  params: {max_per_customer: 1}
- id: shopper_onboarding
  subject: [shopper_applied, shopper_screening_started, shopper_activated, shopper_screening_failed]
  rule: >
    An applicant enters at Shop-Only Shopper or Full-Service Shopper only; higher levels are reached only through
    the monthly evaluation. The applicant must be at least min_age_years old, and a Full-Service applicant must
    have a valid licence and vehicle insurance on file because vehicle_required is true. The account is activated
    only after the background check returns clear; a check that does not return clear closes the application with
    reason screening_not_clear, and the reason is not disclosed beyond that. Alcohol batches are never offered to
    a shopper younger than alcohol_min_age_years. The background check is re-run every background_check_renewal_months.
  eligibility:
  - id: screening_state
    applies_to: [shopper_activated]
    kind: state
    condition: >-
      The account is activated only after the background check returns clear; a check that does not return clear
      closes the application with reason screening_not_clear, and the reason is not disclosed beyond that.
    evidence_fields: [shopper_accounts.status, shopper_accounts.shopper_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [shopper_accounts.shopper_account_id]
      action_bindings: {shopper_accounts.shopper_account_id: shopper_account_id}
    state_contract:
      field: shopper_accounts.status
      allowed: [screening, active]
  params:
    per_tier:
      Shop-Only Shopper: {vehicle_required: =vehicle_required, background_check_renewal_months: =background_check_renewal_months}
      Full-Service Shopper: {vehicle_required: =vehicle_required, background_check_renewal_months: =background_check_renewal_months}
      Full-Service Shopper Silver: {vehicle_required: =vehicle_required, background_check_renewal_months: =background_check_renewal_months}
      Full-Service Shopper Gold: {vehicle_required: =vehicle_required, background_check_renewal_months: =background_check_renewal_months}
      Full-Service Shopper Platinum: {vehicle_required: =vehicle_required, background_check_renewal_months: =background_check_renewal_months}
      Full-Service Shopper Diamond: {vehicle_required: =vehicle_required, background_check_renewal_months: =background_check_renewal_months}
- id: shopper_evt_ratings
  subject: [shopper_rating_received, shopper_rating_warning_issued]
  rule: >
    Each completed order can be rated once by its customer, from 1 to 5 stars, and the rating is attributed to the
    shopper whose batch completed the order. The rating average is shopper_msr_avg_rating; it is not used for any
    decision until min_ratings_for_evaluation ratings exist. A rating warning is issued when the average falls below
    rating_warning_threshold of the shopper's level, and at most one warning is open at a time; a warning closes
    when the average returns to the threshold or above. Declining batch offers never affects ratings or status,
    because acceptance_rate_counts is false.
  eligibility:
  - id: one_rating_per_order
    applies_to: [shopper_rating_received]
    kind: dedup
    condition: >-
      Each completed order can be rated once by its customer, from 1 to 5 stars, and the rating is attributed to
      the shopper whose batch completed the order.
    evidence_fields: [shopper_events.order_id, shopper_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [shopper_events.order_id]
      action_bindings: {shopper_events.order_id: order_id}
    dedup_contract:
      table: shopper_events
      mode: separate_record
      object_bindings: {order_id: order_id}
      duplicate_filters:
        event_type: [shopper_rating_received]
      distinct_fields: []
  params:
    per_tier:
      Shop-Only Shopper: {rating_warning_threshold: =rating_warning_threshold}
      Full-Service Shopper: {rating_warning_threshold: =rating_warning_threshold}
      Full-Service Shopper Silver: {rating_warning_threshold: =rating_warning_threshold}
      Full-Service Shopper Gold: {rating_warning_threshold: =rating_warning_threshold}
      Full-Service Shopper Platinum: {rating_warning_threshold: =rating_warning_threshold}
      Full-Service Shopper Diamond: {rating_warning_threshold: =rating_warning_threshold}
  measures: [shopper_msr_avg_rating]
- id: shopper_evt_rating_exclusion
  subject: [shopper_rating_excluded]
  rule: >
    A rating of 1, 2 or 3 stars is removed from the average when its cause is one of rating_exclusion_reasons and
    the order's records show that cause (out_of_stock_items when the order has an order_substitution_decided row
    with decision not_found_refunded; customer_unreachable when the order was returned; store_delay and app_outage
    when a review case records it). An exclusion must be requested within the request window counted from the rating
    date. The window is counted in calendar days with the rating's event_date as day 0, and the last day to request
    is that date plus rating_exclusion_request_days, inclusive. A shopper receives at most rating_exclusions_per_30d
    exclusions as counted by shopper_msr_exclusions_30d. Each rating can be excluded once, and 4 or 5 star ratings
    are never excluded.
  eligibility:
  - id: exclusion_window
    applies_to: [shopper_rating_excluded]
    kind: time
    condition: An exclusion must be requested within the request window counted from the rating date.
    evidence_fields: [shopper_events.event_date, shopper_events.shopper_event_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [shopper_events.shopper_event_id]
      action_bindings: {shopper_events.shopper_event_id: source_event_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the rating date
      anchor_source: shopper_events.event_date
      relation: not_after
      duration_source: variants.rating_exclusion_request_days
      unit: calendar_days
      counting_rule: >-
        The window is counted in calendar days with the rating's event_date as day 0, and the last day to request
        is that date plus rating_exclusion_request_days, inclusive.
      boundary: inclusive
  - id: exclude_once
    applies_to: [shopper_rating_excluded]
    kind: dedup
    condition: Each rating can be excluded once, and 4 or 5 star ratings are never excluded.
    evidence_fields: [shopper_events.source_event_id, shopper_events.event_type, shopper_events.rating]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [shopper_events.source_event_id]
      action_bindings: {shopper_events.source_event_id: source_event_id}
    dedup_contract:
      table: shopper_events
      mode: separate_record
      object_bindings: {source_event_id: source_event_id}
      duplicate_filters:
        event_type: [shopper_rating_excluded]
      distinct_fields: []
  params:
    per_tier:
      Shop-Only Shopper: {rating_exclusions_per_30d: =rating_exclusions_per_30d, rating_exclusion_request_days: =rating_exclusion_request_days}
      Full-Service Shopper: {rating_exclusions_per_30d: =rating_exclusions_per_30d, rating_exclusion_request_days: =rating_exclusion_request_days}
      Full-Service Shopper Silver: {rating_exclusions_per_30d: =rating_exclusions_per_30d, rating_exclusion_request_days: =rating_exclusion_request_days}
      Full-Service Shopper Gold: {rating_exclusions_per_30d: =rating_exclusions_per_30d, rating_exclusion_request_days: =rating_exclusion_request_days}
      Full-Service Shopper Platinum: {rating_exclusions_per_30d: =rating_exclusions_per_30d, rating_exclusion_request_days: =rating_exclusion_request_days}
      Full-Service Shopper Diamond: {rating_exclusions_per_30d: =rating_exclusions_per_30d, rating_exclusion_request_days: =rating_exclusion_request_days}
  measures: [shopper_msr_exclusions_30d]
- id: shopper_evt_violations
  subject: [shopper_violation_recorded, shopper_violation_cleared]
  rule: >
    A substantiated violation adds the points set for its type (points_late_delivery, points_missing_items_verified,
    points_batch_dropped, points_wrong_address, points_conduct_complaint, points_alcohol_procedure). A zero-tolerance
    violation is recorded with 0 points as soon as a credible report is received, places the account on hold, and
    is handled by shopper_evt_deactivation; when the investigation does not substantiate it, it is cleared with
    removal_reason not_substantiated. Only one violation of a type is recorded per order. Points count for violation_window_days
    from the violation date and are then cleared with removal_reason expired. A shopper may dispute a violation,
    and a dispute is accepted only when it is submitted within the dispute window counted from the violation date.
    The dispute window is counted in calendar days with the violation's event_date as day 0, and the last day to
    dispute is that date plus violation_dispute_days, inclusive. A dispute is decided on the records: a late_delivery
    violation is cleared (removal_reason dispute_upheld) when the order's record shows it was not late (completed_at
    no later than scheduled_window_end plus that service level's late_threshold_minutes), and a missing_items_verified
    violation is cleared when the order has no order_item_refunded row with refund_reason missing; any other dispute
    goes to the appeals team.
  eligibility:
  - id: dispute_window
    applies_to: [shopper_violation_cleared]
    kind: time
    condition: >-
      A shopper may dispute a violation, and a dispute is accepted only when it is submitted within the dispute
      window counted from the violation date.
    evidence_fields: [shopper_events.event_date, shopper_events.shopper_event_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [shopper_events.shopper_event_id]
      action_bindings: {shopper_events.shopper_event_id: source_event_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the violation date
      anchor_source: shopper_events.event_date
      relation: not_after
      duration_source: variants.violation_dispute_days
      unit: calendar_days
      counting_rule: >-
        The dispute window is counted in calendar days with the violation's event_date as day 0, and the last day
        to dispute is that date plus violation_dispute_days, inclusive.
      boundary: inclusive
  - id: one_per_type_per_order
    applies_to: [shopper_violation_recorded]
    kind: dedup
    condition: Only one violation of a type is recorded per order.
    evidence_fields: [shopper_events.order_id, shopper_events.violation_type, shopper_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [shopper_events.order_id]
      action_bindings: {shopper_events.order_id: order_id}
    dedup_contract:
      table: shopper_events
      mode: separate_record
      object_bindings: {order_id: order_id, violation_type: violation_type}
      duplicate_filters:
        event_type: [shopper_violation_recorded]
      distinct_fields: []
  params:
    per_tier:
      Shop-Only Shopper: {violation_window_days: =violation_window_days, violation_dispute_days: =violation_dispute_days}
      Full-Service Shopper: {violation_window_days: =violation_window_days, violation_dispute_days: =violation_dispute_days}
      Full-Service Shopper Silver: {violation_window_days: =violation_window_days, violation_dispute_days: =violation_dispute_days}
      Full-Service Shopper Gold: {violation_window_days: =violation_window_days, violation_dispute_days: =violation_dispute_days}
      Full-Service Shopper Platinum: {violation_window_days: =violation_window_days, violation_dispute_days: =violation_dispute_days}
      Full-Service Shopper Diamond: {violation_window_days: =violation_window_days, violation_dispute_days: =violation_dispute_days}
  measures: [shopper_msr_active_points]
- id: shopper_evt_holds
  subject: [shopper_hold_placed, shopper_hold_released]
  rule: >
    An active account is placed on hold (hold_reason violation_points_threshold) when shopper_msr_active_points
    reaches violation_points_hold_threshold, and at once (hold_reason incident_investigation) when a zero-tolerance
    violation is recorded, before the investigation concludes. A hold is released only while the account is on_hold
    and only when the review found no deactivation cause. A hold must end within hold_max_days of hold_start_date.
    Batches accepted before the hold are paid where hold_pay_for_accepted_batches is true. Where retraining_after_hold
    is true, the shopper completes the in-app refresher before new batches are offered.
  eligibility:
  - id: release_from_hold
    applies_to: [shopper_hold_released]
    kind: state
    condition: >-
      A hold is released only while the account is on_hold and only when the review found no deactivation cause.
    evidence_fields: [shopper_accounts.status, shopper_accounts.shopper_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [shopper_accounts.shopper_account_id]
      action_bindings: {shopper_accounts.shopper_account_id: shopper_account_id}
    state_contract:
      field: shopper_accounts.status
      allowed: [on_hold, active]
  params:
    per_tier:
      Shop-Only Shopper: {violation_points_hold_threshold: =violation_points_hold_threshold, hold_max_days: =hold_max_days}
      Full-Service Shopper: {violation_points_hold_threshold: =violation_points_hold_threshold, hold_max_days: =hold_max_days}
      Full-Service Shopper Silver: {violation_points_hold_threshold: =violation_points_hold_threshold, hold_max_days: =hold_max_days}
      Full-Service Shopper Gold: {violation_points_hold_threshold: =violation_points_hold_threshold, hold_max_days: =hold_max_days}
      Full-Service Shopper Platinum: {violation_points_hold_threshold: =violation_points_hold_threshold, hold_max_days: =hold_max_days}
      Full-Service Shopper Diamond: {violation_points_hold_threshold: =violation_points_hold_threshold, hold_max_days: =hold_max_days}
  measures: [shopper_msr_active_points]
- id: shopper_evt_deactivation
  subject: [shopper_deactivated]
  rule: >
    An account is deactivated for exactly one controlled cause, checked in this order of priority. First, zero_tolerance_violation,
    when the investigation substantiates a recorded violation listed in zero_tolerance_violations. Second, violation_points,
    when shopper_msr_active_points reaches violation_points_deactivation_threshold. Third, documents_expired, when
    a licence or insurance expiry date has passed by more than document_grace_days on an account with vehicle_required
    true. Fourth, rating_below_floor, which applies only after a rating warning has stood for the full cure period.
    The cure period is counted in calendar days with rating_warning_date as day 0, and deactivation for rating is
    allowed only from the day after rating_warning_date plus warning_cure_days, and only if shopper_msr_avg_rating
    is then below rating_floor. Acceptance rate is never a cause. Batches already accepted are paid under the batch
    charter.
  eligibility:
  - id: cure_period_elapsed
    applies_to: [shopper_deactivated]
    kind: time
    condition: >-
      Fourth, rating_below_floor, which applies only after a rating warning has stood for the full cure period.
    evidence_fields: [shopper_accounts.rating_warning_date, shopper_accounts.shopper_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [shopper_accounts.shopper_account_id]
      action_bindings: {shopper_accounts.shopper_account_id: shopper_account_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: a rating warning has stood for the full cure period
      anchor_source: shopper_accounts.rating_warning_date
      relation: not_before
      duration_source: variants.warning_cure_days
      unit: calendar_days
      counting_rule: >-
        The cure period is counted in calendar days with rating_warning_date as day 0, and deactivation for rating
        is allowed only from the day after rating_warning_date plus warning_cure_days, and only if shopper_msr_avg_rating
        is then below rating_floor.
      boundary: exclusive
  params:
    per_tier:
      Shop-Only Shopper: {violation_points_deactivation_threshold: =violation_points_deactivation_threshold, rating_floor: =rating_floor,
        warning_cure_days: =warning_cure_days, document_grace_days: =document_grace_days}
      Full-Service Shopper: {violation_points_deactivation_threshold: =violation_points_deactivation_threshold,
        rating_floor: =rating_floor, warning_cure_days: =warning_cure_days, document_grace_days: =document_grace_days}
      Full-Service Shopper Silver: {violation_points_deactivation_threshold: =violation_points_deactivation_threshold,
        rating_floor: =rating_floor, warning_cure_days: =warning_cure_days, document_grace_days: =document_grace_days}
      Full-Service Shopper Gold: {violation_points_deactivation_threshold: =violation_points_deactivation_threshold,
        rating_floor: =rating_floor, warning_cure_days: =warning_cure_days, document_grace_days: =document_grace_days}
      Full-Service Shopper Platinum: {violation_points_deactivation_threshold: =violation_points_deactivation_threshold,
        rating_floor: =rating_floor, warning_cure_days: =warning_cure_days, document_grace_days: =document_grace_days}
      Full-Service Shopper Diamond: {violation_points_deactivation_threshold: =violation_points_deactivation_threshold,
        rating_floor: =rating_floor, warning_cure_days: =warning_cure_days, document_grace_days: =document_grace_days}
  measures: [shopper_msr_active_points, shopper_msr_avg_rating]
- id: shopper_evt_reactivation
  subject: [shopper_reactivated, shopper_closed]
  rule: >
    A deactivated account is reactivated in one of two ways. A documents_expired deactivation is reactivated by
    the agent once a renewed document with an expiry date after the reactivation date is on file, without an appeal.
    Any other appealable cause needs an appeal submitted by the shopper, and an appeal is accepted only when it
    is submitted within the appeal window counted from the deactivation date. The appeal window is counted in calendar
    days with deactivated_date as day 0, and the last day to appeal is deactivated_date plus appeal_window_days,
    inclusive. Only reasons listed in appealable_reasons can be appealed. The appeals team decides within appeal_decision_business_days;
    an upheld appeal reactivates the account, a denied one closes it with reason appeal_denied. An account that
    has already received reactivations_lifetime_max reactivations cannot be reactivated again. A reactivated account
    returns at the level set by reactivation_level. An account deactivated and not appealed within the window is
    closed with reason appeal_window_lapsed. A shopper may close an active account at any time (reason voluntary).
  eligibility:
  - id: appeal_window
    applies_to: [shopper_reactivated]
    kind: time
    condition: >-
      Any other appealable cause needs an appeal submitted by the shopper, and an appeal is accepted only when it
      is submitted within the appeal window counted from the deactivation date.
    evidence_fields: [shopper_accounts.deactivated_date, shopper_accounts.shopper_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [shopper_accounts.shopper_account_id]
      action_bindings: {shopper_accounts.shopper_account_id: shopper_account_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the deactivation date
      anchor_source: shopper_accounts.deactivated_date
      relation: not_after
      duration_source: variants.appeal_window_days
      unit: calendar_days
      counting_rule: >-
        The appeal window is counted in calendar days with deactivated_date as day 0, and the last day to appeal
        is deactivated_date plus appeal_window_days, inclusive.
      boundary: inclusive
  - id: reactivation_limit
    applies_to: [shopper_reactivated]
    kind: authorization
    condition: >-
      An account that has already received reactivations_lifetime_max reactivations cannot be reactivated again.
    evidence_fields: [shopper_accounts.reactivation_count, shopper_accounts.shopper_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [shopper_accounts.shopper_account_id]
      action_bindings: {shopper_accounts.shopper_account_id: shopper_account_id}
  params:
    per_tier:
      Shop-Only Shopper: {appeal_window_days: =appeal_window_days, reactivations_lifetime_max: =reactivations_lifetime_max,
        reactivation_level: =reactivation_level}
      Full-Service Shopper: {appeal_window_days: =appeal_window_days, reactivations_lifetime_max: =reactivations_lifetime_max,
        reactivation_level: =reactivation_level}
      Full-Service Shopper Silver: {appeal_window_days: =appeal_window_days, reactivations_lifetime_max: =reactivations_lifetime_max,
        reactivation_level: =reactivation_level}
      Full-Service Shopper Gold: {appeal_window_days: =appeal_window_days, reactivations_lifetime_max: =reactivations_lifetime_max,
        reactivation_level: =reactivation_level}
      Full-Service Shopper Platinum: {appeal_window_days: =appeal_window_days, reactivations_lifetime_max: =reactivations_lifetime_max,
        reactivation_level: =reactivation_level}
      Full-Service Shopper Diamond: {appeal_window_days: =appeal_window_days, reactivations_lifetime_max: =reactivations_lifetime_max,
        reactivation_level: =reactivation_level}
- id: shopper_evt_level_evaluation
  subject: [shopper_level_changed]
  rule: >
    Levels are evaluated on level_evaluation_day of each calendar month for active Full-Service accounts; Shop-Only
    Shopper is outside the ladder and never moves by evaluation. A shopper is promoted to the highest level whose
    level_min_batches_30d (shopper_msr_batches_30d), level_min_avg_rating (shopper_msr_avg_rating) and level_min_on_time_pct
    (shopper_msr_on_time_pct_30d) are all met, and a promotion may skip levels. A shopper who fails the current
    level's requirements keeps it for level_demotion_grace_cycles evaluations and then moves down one level only.
    The level's entitlements (early_schedule_access_hours, batch_offer_head_start_seconds, max_concurrent_orders,
    heavy_batches_eligible, stockup_batches_eligible, express_batches_eligible, alcohol_batches_eligible, dedicated_support_line)
    change on the evaluation date. Levels are never changed between evaluations except by reactivation. Levels are
    evaluated only for accounts that are active on the evaluation date.
  eligibility:
  - id: active_on_evaluation
    applies_to: [shopper_level_changed]
    kind: state
    condition: Levels are evaluated only for accounts that are active on the evaluation date.
    evidence_fields: [shopper_accounts.status, shopper_accounts.shopper_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [shopper_accounts.shopper_account_id]
      action_bindings: {shopper_accounts.shopper_account_id: shopper_account_id}
    state_contract:
      field: shopper_accounts.status
      allowed: [active]
  params:
    per_tier:
      Shop-Only Shopper: {level_min_batches_30d: =level_min_batches_30d, level_min_avg_rating: =level_min_avg_rating,
        level_min_on_time_pct: =level_min_on_time_pct, level_demotion_grace_cycles: =level_demotion_grace_cycles}
      Full-Service Shopper: {level_min_batches_30d: =level_min_batches_30d, level_min_avg_rating: =level_min_avg_rating,
        level_min_on_time_pct: =level_min_on_time_pct, level_demotion_grace_cycles: =level_demotion_grace_cycles}
      Full-Service Shopper Silver: {level_min_batches_30d: =level_min_batches_30d, level_min_avg_rating: =level_min_avg_rating,
        level_min_on_time_pct: =level_min_on_time_pct, level_demotion_grace_cycles: =level_demotion_grace_cycles}
