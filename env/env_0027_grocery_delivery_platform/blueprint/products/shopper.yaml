- id: shopper_evt_documents
  subject: [shopper_document_updated]
  rule: >
    A renewed driver licence or vehicle insurance document is accepted only when its expiry date is after the date
    it is recorded, and it replaces the expiry date on file. Documents are recorded for accounts in any status except
    closed. Recording a renewed document on a documents_expired account does not by itself reactivate it; reactivation
    follows shopper_evt_reactivation.
  eligibility:
  - id: not_closed
    applies_to: [shopper_document_updated]
    kind: state
    condition: Documents are recorded for accounts in any status except closed.
    evidence_fields: [shopper_accounts.status, shopper_accounts.shopper_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [shopper_accounts.shopper_account_id]
      action_bindings: {shopper_accounts.shopper_account_id: shopper_account_id}
    state_contract:
      field: shopper_accounts.status
      allowed: [applied, screening, active, on_hold, deactivated]
  params:
    per_tier:
      Shop-Only Shopper: {document_grace_days: =document_grace_days}
      Full-Service Shopper: {document_grace_days: =document_grace_days}
      Full-Service Shopper Silver: {document_grace_days: =document_grace_days}
      Full-Service Shopper Gold: {document_grace_days: =document_grace_days}
      Full-Service Shopper Platinum: {document_grace_days: =document_grace_days}
