# Product charter: Cartwise+ Membership (category key: membership).
category: membership
display_name: Cartwise+ Membership
binding:
  holding_table: memberships
  event_tables: [membership_events]
  intake_tables: [membership_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {credit_balance_usd: plus_credit, priority_upgrades_remaining: priority_upgrades}
lifecycle:
  states: [applied, trialing, active, past_due, paused, pending_cancellation, canceled]
  transitions:
  - {from: applied, to: trialing, by: system, means: The enrollment's eligibility is confirmed and the free trial
      for the plan starts.}
  - from: applied
    to: active
    by: system
    means: >-
      The enrollment's eligibility is confirmed without a trial and the first period fee is captured.
  - from: applied
    to: canceled
    by: agent
    means: >-
      The enrollment is closed because the required eligibility proof was not accepted within the proof window.
  - {from: trialing, to: active, by: system, means: The trial ends and the first period fee is captured.}
  - {from: trialing, to: past_due, by: system, means: The first period fee is declined when the trial ends.}
  - {from: trialing, to: canceled, by: user, means: The customer ends the membership during the trial.}
  - {from: active, to: past_due, by: system, means: A renewal fee is declined and the retry schedule starts.}
  - {from: past_due, to: active, by: system, means: A retry or an updated payment card captures the outstanding
      period fee.}
  - {from: past_due, to: canceled, by: system, means: The past-due grace period ends with the fee still unpaid.}
  - from: active
    to: paused
    by: agent
    means: >-
      A monthly membership is paused at the customer's request starting at the next renewal date.
  - from: paused
    to: active
    by: agent
    means: >-
      The pause ends on its end date or earlier at the customer's request and a new period starts with a fee charge.
  - {from: active, to: pending_cancellation, by: user, means: The customer turns off auto-renew and keeps benefits
      until the paid period ends.}
  - {from: pending_cancellation, to: active, by: user, means: The customer turns auto-renew back on before the paid
      period ends.}
  - {from: pending_cancellation, to: canceled, by: system, means: The paid period ends with auto-renew off.}
  - {from: active, to: canceled, by: user, means: The customer confirms an immediate cancellation.}
accounts:
- key: membership_fees
  unit: USD
  meaning: >-
    Net membership fees the customer has paid on this membership; period fee charges book in and fee refunds book
    out.
- key: plus_credit
  unit: USD
  meaning: >-
    Cartwise+ credit-back balance earned on eligible orders and spendable on later orders; earnings book in while
    redemptions and expiries book out.
- key: priority_upgrades
  unit: upgrades
  meaning: >-
    Priority Delivery upgrades available in the current membership year; allotments book in and redemptions book
    out.
parameter_schema:
  billing_cycle: Enum monthly|annual — how often the period fee is charged.
  period_fee_usd: USD — the fee charged for one membership period (first period, renewal, retry).
  period_length_months: Integer calendar months — length of one paid period.
  renewal_day_rule: >-
    Enum — how the renewal date is anchored; enrollment_day_month_end_fallback means the same day of month as the
    period start, falling back to the last day of a shorter month.
  trial_days: Integer calendar days — length of the free trial granted at enrollment (0 = no trial).
  trial_reeligibility_days: >-
    Integer calendar days — a customer whose previous membership was canceled fewer than this many days ago gets
    no trial.
  lifetime_trials_cap: Integer — maximum trials one customer profile may ever receive across all plans.
  eligibility_proof: >-
    Enum none|snap_ebt_card|student_email — proof the plan requires before the membership can start.
  eligibility_proof_window_days: >-
    Integer calendar days — days after enrollment within which the required proof must be accepted (0 = no proof
    required).
  eligibility_reverification_months: >-
    Integer calendar months — proof must be re-accepted this often to keep the plan (0 = never).
  student_max_enrollment_years: Integer years — maximum cumulative years on the student plan (0 = not applicable).
  min_member_age_years: Integer years — minimum age of the account holder.
  free_delivery_order_minimum_usd: >-
    USD — item subtotal at or above which the delivery fee of an eligible delivery order is waived.
  free_delivery_services: List of order service levels whose delivery fee the membership waives.
  member_service_fee_rate_pct: Percent of item subtotal — the member service-fee rate on orders.
  express_fee_discount_pct: Percent — discount the membership applies to the Express 30 fee.
  small_basket_fee_waived: Boolean — whether the membership waives the small-basket fee.
  benefits_during_past_due: Boolean — whether order benefits keep applying while the membership is past_due.
  payment_retry_attempts: Integer — automatic retries of a declined period fee.
  payment_retry_interval_days: Integer calendar days — spacing between automatic retries.
  past_due_grace_days: >-
    Integer calendar days — days after the membership became past_due before it is canceled unpaid.
  unused_refund_window_days: >-
    Integer calendar days — window after a period fee charge within which a full refund is available if no benefit
    was used.
  refund_requires_no_benefit_use: Boolean — whether a full refund requires that no member benefit was used since
    the charge.
  prorated_refund_allowed: >-
    Boolean — whether a prorated refund of unused full months is available outside the full-refund window.
  prorated_refund_max_used_months: >-
    Integer — a prorated refund is available only while at most this many months of the period have started.
  duplicate_charge_refund_days: Integer calendar days — window within which a duplicate period charge is refunded
    in full.
  refund_destination: Enum original_payment_method|cartwise_credit — where a fee refund is returned.
  pause_allowed: Boolean — whether the plan can be paused.
  pause_min_days: Integer calendar days — shortest pause (0 = pause not offered).
  pause_max_days: Integer calendar days — longest pause (0 = pause not offered).
  pauses_per_rolling_365_days: Integer — pauses allowed in any rolling 365-day window.
  pause_request_cutoff_days: >-
    Integer calendar days — a pause must be requested at least this many days before the next renewal date.
  credit_back_pct: >-
    Percent of eligible item subtotal — Cartwise+ credit earned on an eligible completed order.
  credit_back_scope: Enum pickup_only|pickup_and_delivery — which completed orders earn credit back.
  credit_back_min_subtotal_usd: USD — minimum eligible item subtotal for an order to earn credit.
  credit_back_cap_per_order_usd: USD — maximum credit earned on one order.
  credit_back_excludes_alcohol: Boolean — whether alcohol lines are excluded from the eligible item subtotal.
  credit_expiry_days: Integer calendar days — each credit earning expires this many days after it was earned.
  credit_max_balance_usd: >-
    USD — credit earnings stop once the balance reaches this cap; an earning is cut down to the room left.
  credit_redemption_min_subtotal_usd: USD — minimum order item subtotal to apply credit.
  credit_forfeit_after_cancel_days: >-
    Integer calendar days — remaining credit stays usable this long after cancellation, then expires.
  priority_upgrades_per_period: Integer — Priority Delivery upgrades allotted at the start of each paid period.
  priority_upgrade_rollover: Boolean — whether unused upgrades carry into the next period.
  household_seats: Integer — people (holder included) who share the membership's benefits.
  household_member_min_age_years: Integer years — minimum age of an added household member.
  household_readd_cooldown_days: >-
    Integer calendar days — a removed member cannot be added back to the same membership for this long.
  household_removals_per_period: Integer — member removals allowed per paid period.
  allowed_switch_targets: List of official plan names this plan may switch to.
  upgrade_switch_timing: >-
    Enum immediate|next_renewal — when a switch to a plan with a higher period fee takes effect.
  downgrade_switch_timing: >-
    Enum immediate|next_renewal — when a switch to a plan with an equal or lower period fee takes effect.
  switch_proration_basis: >-
    Enum unused_days — how the unused part of the old plan's fee is credited toward an immediate switch.
  switches_per_period: Integer — plan switches allowed per paid period.
