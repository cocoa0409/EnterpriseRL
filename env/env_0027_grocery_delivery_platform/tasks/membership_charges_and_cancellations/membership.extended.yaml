events:
- type: membership_enrolled
  target: memberships
  mutation: create
  meaning: >-
    A customer enrolls in a Cartwise+ plan and the membership record opens awaiting eligibility and payment confirmation.
  grain: one row per enrollment
  fields: {customer_id: the enrolling customer, variant_name: the official plan name chosen, enrolled_date: date
      of enrollment, auto_renew: true at enrollment}
  triggers: []
- type: membership_trial_started
  target: memberships
  mutation:
    transition: {from: applied, to: trialing}
  meaning: The enrollment is confirmed and the plan's free trial starts.
  grain: one row per transaction
  fields: {trial_end_date: last day of the trial, eligibility_verified_date: date required proof was accepted (empty
      when none required)}
  triggers: []
- type: membership_activated
  target: memberships
  mutation:
    transition:
    - {from: applied, to: active}
    - {from: trialing, to: active}
  meaning: The first paid period starts, either directly after enrollment or when the trial converts.
  grain: one row per transaction
  fields: {variant_name: the plan held, current_period_start: first day of the paid period, current_period_end: renewal
      date that ends the period, eligibility_verified_date: date required proof was accepted}
  triggers:
  - event: membership:membership_fee_charged
    map: {fee_type: first_period, billing_period_start: current_period_start}
  - event: membership:membership_upgrade_allotted
    when:
      variant_name: [Cartwise+ Family Annual, Cartwise+ Premier Annual]
    map: {billing_period_start: current_period_start}
- type: membership_renewed
  target: memberships
  mutation: update
  meaning: An active membership rolls into its next paid period on the renewal date.
  grain: one row per transaction
  fields: {current_period_start: first day of the new period, current_period_end: renewal date that ends the new
      period, priority_upgrades_remaining: upgrades reset for the new period}
  triggers:
  - event: membership:membership_fee_charged
    map: {fee_type: renewal, billing_period_start: current_period_start}
- type: membership_past_due
  target: memberships
  mutation:
    transition:
    - {from: active, to: past_due}
    - {from: trialing, to: past_due}
  meaning: A period fee is declined and the membership enters the retry and grace period.
  grain: one row per transaction
  fields: {past_due_since: date the fee was first declined}
  triggers: []
- type: membership_reinstated
  target: memberships
  mutation:
    transition: {from: past_due, to: active}
  meaning: The outstanding period fee is captured and the membership returns to active.
  grain: one row per transaction
  fields: {current_period_start: first day of the period now paid, current_period_end: renewal date ending that
      period, past_due_since: cleared to empty}
  triggers:
  - event: membership:membership_fee_charged
    map: {fee_type: renewal_retry, billing_period_start: current_period_start}
- type: membership_paused
  target: memberships
  mutation:
    transition: {from: active, to: paused}
  meaning: A monthly membership is paused; no fee is charged and no benefit applies until it resumes.
  grain: one row per transaction
  fields: {pause_start_date: first paused day (the renewal date), pause_end_date: last paused day}
  triggers:
  - event: membership:membership_pause_logged
    map: {billing_period_start: pause_start_date}
- type: membership_pause_logged
  target: membership_events
  meaning: >-
    The pause history keeps one row for every pause that starts, so pauses can be counted over time.
  grain: one row per pause
  distinguish_by: [billing_period_start]
  fields: {billing_period_start: the renewal date on which the pause started, quantity: booked pause length in calendar
      days, event_date: date the pause was booked}
  triggers: []
- type: membership_resumed
  target: memberships
  mutation:
    transition: {from: paused, to: active}
  meaning: A paused membership resumes and a new paid period starts.
  grain: one row per transaction
  fields: {current_period_start: first day of the new period, current_period_end: renewal date ending it}
  triggers:
  - event: membership:membership_fee_charged
    map: {fee_type: renewal, billing_period_start: current_period_start}
- type: membership_auto_renew_disabled
  target: memberships
  mutation:
    transition: {from: active, to: pending_cancellation}
  meaning: The customer turns off auto-renew; benefits continue to the end of the paid period.
  grain: one row per transaction
  fields: {auto_renew: set to false}
  triggers: []
- type: membership_auto_renew_enabled
  target: memberships
  mutation:
    transition: {from: pending_cancellation, to: active}
  meaning: The customer turns auto-renew back on before the paid period ends.
  grain: one row per transaction
  fields: {auto_renew: set to true}
  triggers: []
- type: membership_canceled
  target: memberships
  mutation:
    transition:
    - {from: applied, to: canceled}
    - {from: trialing, to: canceled}
    - {from: past_due, to: canceled}
    - {from: pending_cancellation, to: canceled}
    - {from: active, to: canceled}
  meaning: The membership ends and all order benefits stop.
  grain: one row per transaction
  fields: {canceled_date: date the membership ended, cancel_reason: controlled reason for the ending}
  triggers: []
- type: membership_plan_switched
  target: memberships
  mutation: update
  meaning: The membership moves to another Cartwise+ plan.
  grain: one row per transaction
  fields: {variant_name: the new official plan name, plan_switched_date: date the new plan took effect, current_period_start: start
      of the new plan's period, current_period_end: end of the new plan's period}
  triggers:
  - event: membership:membership_fee_charged
    map: {fee_type: plan_switch, billing_period_start: current_period_start}
- type: membership_fee_charged
  target: membership_events
  meaning: A period fee is captured from the customer's payment card.
  grain: one row per captured period fee
  distinguish_by: [fee_type, billing_period_start, event_date]
  fields: {fee_type: why the fee was charged, billing_period_start: first day of the period paid for, amount_usd: fee
      captured (positive), event_date: capture date}
  account: membership_fees
  direction: in
  triggers: []
- type: membership_fee_refunded
  target: membership_events
  meaning: All or part of one captured period fee is returned to the customer.
  grain: one row per refund of one fee charge
  distinguish_by: [source_event_id, refund_type]
  fields: {source_event_id: the membership_fee_charged row being refunded, refund_type: basis of the refund, amount_usd: amount
      returned (positive), event_date: refund date}
  account: membership_fees
  direction: out
  triggers: []
- type: membership_credit_earned
  target: membership_events
  meaning: Cartwise+ credit back is earned on one completed eligible order.
  grain: one row per earning order
  distinguish_by: [order_id]
  fields: {order_id: the completed order that earned the credit, amount_usd: credit earned (positive), event_date: date
      earned}
  account: plus_credit
  direction: in
  triggers: []
- type: membership_credit_applied
  target: membership_events
  meaning: Cartwise+ credit is spent against one order.
  grain: one row per order the credit is applied to
  distinguish_by: [order_id]
  fields: {order_id: the order the credit paid toward, amount_usd: credit spent (positive), event_date: date applied}
  account: plus_credit
  direction: out
  triggers: []
- type: membership_credit_expired
  target: membership_events
  meaning: Unspent credit from one earning lapses at its expiry or after cancellation.
  grain: one row per lapsed earning
  distinguish_by: [source_event_id]
  fields: {source_event_id: the membership_credit_earned row whose remainder lapses, amount_usd: credit removed
      (positive), event_date: lapse date}
  account: plus_credit
  direction: out
  triggers: []
- type: membership_upgrade_allotted
  target: membership_events
  meaning: The period's Priority Delivery upgrades are granted at the start of a paid period.
  grain: one row per paid period
  distinguish_by: [billing_period_start]
  fields: {billing_period_start: the period the upgrades belong to, quantity: upgrades granted, event_date: grant
      date}
  account: priority_upgrades
  direction: in
  triggers: []
- type: membership_upgrade_redeemed
  target: membership_events
  meaning: One Priority Delivery upgrade is used on one order instead of paying the Priority fee.
  grain: one row per upgraded order
  distinguish_by: [order_id]
  fields: {order_id: the upgraded order, quantity: upgrades used (1), event_date: date used}
  account: priority_upgrades
  direction: out
  triggers: []
- type: membership_member_added
  target: membership_events
  meaning: A household member starts sharing the membership's benefits.
  grain: one row per member addition
  distinguish_by: [member_customer_id, event_date]
  fields: {member_customer_id: the added person's customer profile, event_date: date added}
  triggers: []
- type: membership_member_removed
  target: membership_events
  meaning: A household member stops sharing the membership's benefits.
  grain: one row per member removal
  distinguish_by: [member_customer_id, event_date]
  fields: {member_customer_id: the removed person's customer profile, event_date: date removed}
  triggers: []
measures:
- id: membership_msr_benefit_uses_since_charge
  window: from the event_date of the fee charge in question through frozen_time, inclusive
  measure: >-
    count of this customer's order_events rows with event_type order_fee_waived and waiver_basis in (member_free_delivery,
    member_priority_upgrade, member_service_fee_rate) plus membership_credit_applied rows on this membership, all
    dated on or after that charge date
- id: membership_msr_pauses_365d
  window: rolling 365 calendar days ending on frozen_time
  measure: >-
    count of membership_pause_logged rows on this membership whose billing_period_start falls in the window
- id: membership_msr_household_active_members
  window: current state at frozen_time
  measure: >-
    count of member_customer_id values with a membership_member_added row on this membership and no later membership_member_removed
    row for the same person, plus 1 for the holder
- id: membership_msr_unused_full_months
  window: the current paid period, from current_period_start to current_period_end
  measure: >-
    12 minus the number of months of the period that have started on or before frozen_time, where month k (k = 0..11)
    starts on the same day-of-month as current_period_start (month-end fallback), floored at 0
- id: membership_msr_current_period_charge
  window: the current paid period
  measure: >-
    amount_usd of the membership_fee_charged row on this membership whose billing_period_start equals current_period_start
- {id: membership_msr_unused_days, window: from frozen_time's date through the day before current_period_end, measure: 'count
    of calendar days in the window, inclusive of both ends'}
- {id: membership_msr_days_in_period, window: from current_period_start through the day before current_period_end,
  measure: 'count of calendar days in the window, inclusive of both ends'}
- id: membership_msr_order_eligible_subtotal
  window: the single order in question
  measure: >-
    sum of amount_usd of that order's order_events rows with event_type order_item_charged, order_item_substituted
    and order_item_refunded (refunds negative), excluding lines whose item_category is alcohol when credit_back_excludes_alcohol
    is true
- {id: membership_msr_removals_this_period, window: from current_period_start through frozen_time, measure: count
    of membership_member_removed rows on this membership dated in the window}
policies:
- id: membership_agg_multi_holding
  subject: [membership_enrolled]
  rule: >
    A customer profile may hold only one Cartwise+ membership that is not canceled. A new enrollment is allowed
    only when every other membership of the customer is canceled. A person covered as a household member on someone
    else's Family or Premier membership who enrolls in a plan of their own must first be removed from that household,
    because benefits never stack across two memberships.
  eligibility:
  - id: no_live_membership
    applies_to: [membership_enrolled]
    kind: dedup
    condition: A new enrollment is allowed only when every other membership of the customer is canceled.
    evidence_fields: [memberships.status, memberships.customer_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.customer_id]
      action_bindings: {memberships.customer_id: customer_id}
    dedup_contract:
      table: memberships
      mode: separate_record
      object_bindings: {customer_id: customer_id}
      duplicate_filters:
        status: [applied, trialing, active, past_due, paused, pending_cancellation]
      distinct_fields: []
  params: {max_per_customer: 1}
- id: membership_enrollment_eligibility
  subject: [membership_enrolled, membership_trial_started, membership_activated, membership_canceled]
  rule: >
    Enrollment follows the plan's entry gate: the holder must meet min_member_age_years and have a payment card
    on file. A plan whose eligibility_proof is not none starts only after that proof is accepted, and the proof
    must be accepted within the proof window counted from the enrollment date. The window is counted in calendar
    days with the enrollment date as day 0 and the last day being the enrollment date plus eligibility_proof_window_days,
    inclusive. An enrollment still without accepted proof after that last day is closed by the agent with cancel
    reason eligibility_not_verified. A trial is granted only when the plan's trial_days is above 0, the customer
    has no canceled membership whose canceled_date is fewer than trial_reeligibility_days before the enrollment
    date, and the customer has received fewer than lifetime_trials_cap trials; otherwise the membership goes straight
    to active with the first period fee. The student plan is refused once the customer's cumulative student-plan
    time would exceed student_max_enrollment_years. Assist and Student memberships must re-verify their proof every
    eligibility_reverification_months; a membership whose proof has lapsed is switched to Cartwise+ Monthly at the
    next renewal under membership_evt_plan_switch.
  eligibility:
  - id: proof_within_window
    applies_to: [membership_trial_started, membership_activated]
    kind: time
    condition: >-
      A plan whose eligibility_proof is not none starts only after that proof is accepted, and the proof must be
      accepted within the proof window counted from the enrollment date.
    evidence_fields: [memberships.enrolled_date, memberships.eligibility_verified_date, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the enrollment date
      anchor_source: memberships.enrolled_date
      relation: not_after
      duration_source: variants.eligibility_proof_window_days
      unit: calendar_days
      counting_rule: >-
        The window is counted in calendar days with the enrollment date as day 0 and the last day being the enrollment
        date plus eligibility_proof_window_days, inclusive.
      boundary: inclusive
  - id: trial_eligible
    applies_to: [membership_trial_started]
    kind: authorization
    condition: >-
      A trial is granted only when the plan's trial_days is above 0, the customer has no canceled membership whose
      canceled_date is fewer than trial_reeligibility_days before the enrollment date, and the customer has received
      fewer than lifetime_trials_cap trials; otherwise the membership goes straight to active with the first period
      fee.
    evidence_fields: [memberships.customer_id, memberships.canceled_date, memberships.trial_end_date, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
  params:
    per_tier:
      Cartwise+ Assist Monthly: {trial_days: =trial_days, eligibility_proof_window_days: =eligibility_proof_window_days}
      Cartwise+ Student Monthly: {trial_days: =trial_days, eligibility_proof_window_days: =eligibility_proof_window_days}
      Cartwise+ Monthly: {trial_days: =trial_days, eligibility_proof_window_days: =eligibility_proof_window_days}
      Cartwise+ Annual: {trial_days: =trial_days, eligibility_proof_window_days: =eligibility_proof_window_days}
      Cartwise+ Family Annual: {trial_days: =trial_days, eligibility_proof_window_days: =eligibility_proof_window_days}
      Cartwise+ Premier Annual: {trial_days: =trial_days, eligibility_proof_window_days: =eligibility_proof_window_days}
- id: membership_evt_fee_billing
  subject: [membership_fee_charged, membership_activated, membership_renewed, membership_resumed]
  rule: >
    Every paid period is billed once, on its first day, at the plan's period_fee_usd; the fee_type records whether
    it is the first_period, a renewal, a renewal_retry after a decline, or a plan_switch charge. A period runs period_length_months
    calendar months on the plan's billing_cycle, and the renewal date follows renewal_day_rule: the renewal date
    is the same day of month as the period start, and when that day does not exist in the renewal month the renewal
    falls on that month's last day. A fee is charged only while the membership is applied, trialing, active, past_due
    or paused at the moment of the charge. Taxes are not added to membership fees. Price is the one in force for
    the plan on the charge date; no tier pays another tier's fee. A renewal is not charged for a membership in pending_cancellation
    or canceled.
  eligibility:
  - id: billable_state
    applies_to: [membership_fee_charged]
    kind: state
    condition: >-
      A fee is charged only while the membership is applied, trialing, active, past_due or paused at the moment
      of the charge.
    evidence_fields: [memberships.status, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    state_contract:
      field: memberships.status
      allowed: [applied, trialing, active, past_due, paused]
  params:
    per_tier:
      Cartwise+ Assist Monthly: {period_fee_usd: =period_fee_usd, period_length_months: =period_length_months}
      Cartwise+ Student Monthly: {period_fee_usd: =period_fee_usd, period_length_months: =period_length_months}
      Cartwise+ Monthly: {period_fee_usd: =period_fee_usd, period_length_months: =period_length_months}
      Cartwise+ Annual: {period_fee_usd: =period_fee_usd, period_length_months: =period_length_months}
      Cartwise+ Family Annual: {period_fee_usd: =period_fee_usd, period_length_months: =period_length_months}
      Cartwise+ Premier Annual: {period_fee_usd: =period_fee_usd, period_length_months: =period_length_months}
  formula: {amount_usd: period_fee_usd}
- id: membership_evt_failed_payment
  subject: [membership_past_due, membership_reinstated, membership_canceled]
  rule: >
    When a period fee is declined the membership becomes past_due and the fee is retried payment_retry_attempts
    times, payment_retry_interval_days apart. Order benefits keep applying during past_due only where benefits_during_past_due
    is true. A capture during past_due reinstates the membership for the period that was being billed; the period
    dates do not move. The membership may be canceled for non-payment only after the grace period counted from the
    date it became past_due has fully run. The grace period is counted in calendar days with past_due_since as day
    0; cancellation is allowed from the day after past_due_since plus past_due_grace_days, so the last grace day
    itself still allows reinstatement. A cancellation for non-payment carries cancel reason unpaid, and no refund
    is owed because no fee was captured for the unpaid period.
  eligibility:
  - id: grace_elapsed
    applies_to: [membership_canceled]
    kind: time
    condition: >-
      The membership may be canceled for non-payment only after the grace period counted from the date it became
      past_due has fully run.
    evidence_fields: [memberships.past_due_since, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the date it became past_due
      anchor_source: memberships.past_due_since
      relation: not_before
      duration_source: variants.past_due_grace_days
      unit: calendar_days
      counting_rule: >-
        The grace period is counted in calendar days with past_due_since as day 0; cancellation is allowed from
        the day after past_due_since plus past_due_grace_days, so the last grace day itself still allows reinstatement.
      boundary: exclusive
  - id: reinstate_from_past_due
    applies_to: [membership_reinstated]
    kind: state
    condition: >-
      A capture during past_due reinstates the membership for the period that was being billed; the period dates
      do not move.
    evidence_fields: [memberships.status, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    state_contract:
      field: memberships.status
      allowed: [past_due, active]
  params:
    per_tier:
      Cartwise+ Assist Monthly: {past_due_grace_days: =past_due_grace_days, benefits_during_past_due: =benefits_during_past_due}
      Cartwise+ Student Monthly: {past_due_grace_days: =past_due_grace_days, benefits_during_past_due: =benefits_during_past_due}
      Cartwise+ Monthly: {past_due_grace_days: =past_due_grace_days, benefits_during_past_due: =benefits_during_past_due}
      Cartwise+ Annual: {past_due_grace_days: =past_due_grace_days, benefits_during_past_due: =benefits_during_past_due}
      Cartwise+ Family Annual: {past_due_grace_days: =past_due_grace_days, benefits_during_past_due: =benefits_during_past_due}
      Cartwise+ Premier Annual: {past_due_grace_days: =past_due_grace_days, benefits_during_past_due: =benefits_during_past_due}
- id: membership_evt_fee_refund
  subject: [membership_fee_refunded]
  rule: >
    A refund always targets one captured fee charge, named by its source_event_id, and the membership's other charges
    are never summed into it. A full refund is available only when the request is made within the unused-refund
    window counted from the day the period fee was charged. The window is counted in calendar days, where the charge
    date is day 0 and the last eligible day is the charge date plus unused_refund_window_days, inclusive. Where
    refund_requires_no_benefit_use is true, a full refund additionally requires membership_msr_benefit_uses_since_charge
    to be 0; a refund_type of full_unused refunds the whole charge. Outside the window, or once a benefit has been
    used, an annual plan (prorated_refund_allowed true) receives a prorated_annual refund of the unused full months
    (membership_msr_unused_full_months), and only while no more than prorated_refund_max_used_months months of the
    period have started; a month has started on the same day-of-month as the period start. Monthly plans receive
    no refund outside the full-refund rule. A second capture for the same plan and billing_period_start is a duplicate_charge
    and is refunded in full when reported within duplicate_charge_refund_days of its capture, regardless of benefit
    use. Each fee charge can be refunded at most once. Refunds go to refund_destination. A refund of a first period
    or renewal charge ends the membership: after a full_unused or prorated_annual refund the membership is canceled,
    registered as a customer request that takes effect once the customer confirms; a duplicate_charge refund leaves
    the membership as it is.
  eligibility:
  - id: full_refund_window
    applies_to: [membership_fee_refunded]
    kind: time
    condition: >-
      A full refund is available only when the request is made within the unused-refund window counted from the
      day the period fee was charged.
    evidence_fields: [membership_events.event_date, membership_events.membership_event_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [membership_events.membership_event_id]
      action_bindings: {membership_events.membership_event_id: source_event_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the day the period fee was charged
      anchor_source: membership_events.event_date
      relation: not_after
      duration_source: variants.unused_refund_window_days
      unit: calendar_days
      counting_rule: >-
        The window is counted in calendar days, where the charge date is day 0 and the last eligible day is the
        charge date plus unused_refund_window_days, inclusive.
      boundary: inclusive
  - id: one_refund_per_charge
    applies_to: [membership_fee_refunded]
    kind: dedup
    condition: Each fee charge can be refunded at most once.
    evidence_fields: [membership_events.source_event_id, membership_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [membership_events.source_event_id]
      action_bindings: {membership_events.source_event_id: source_event_id}
    dedup_contract:
      table: membership_events
      mode: separate_record
      object_bindings: {source_event_id: source_event_id}
      duplicate_filters:
        event_type: [membership_fee_refunded]
      distinct_fields: []
  params:
    per_tier:
      Cartwise+ Assist Monthly: {unused_refund_window_days: =unused_refund_window_days, prorated_refund_allowed: =prorated_refund_allowed}
      Cartwise+ Student Monthly: {unused_refund_window_days: =unused_refund_window_days, prorated_refund_allowed: =prorated_refund_allowed}
      Cartwise+ Monthly: {unused_refund_window_days: =unused_refund_window_days, prorated_refund_allowed: =prorated_refund_allowed}
      Cartwise+ Annual: {unused_refund_window_days: =unused_refund_window_days, prorated_refund_allowed: =prorated_refund_allowed}
      Cartwise+ Family Annual: {unused_refund_window_days: =unused_refund_window_days, prorated_refund_allowed: =prorated_refund_allowed}
      Cartwise+ Premier Annual: {unused_refund_window_days: =unused_refund_window_days, prorated_refund_allowed: =prorated_refund_allowed}
    months_per_year: 12
  formula: {full_unused_refund: amount_usd, prorated_annual_refund: 'round(amount_usd * membership_msr_unused_full_months
      / months_per_year, 2)'}
  measures: [membership_msr_benefit_uses_since_charge, membership_msr_unused_full_months]
- id: membership_evt_cancellation
  subject: [membership_auto_renew_disabled, membership_auto_renew_enabled, membership_canceled]
  rule: >
    A customer ends a membership in one of two ways, and only the customer can confirm either. Turning off auto-renew
    moves an active membership to pending_cancellation; benefits continue until current_period_end and the membership
    is canceled with reason customer_period_end on that date without a refund. Auto-renew can be turned back on
    only while the membership is still pending_cancellation. An immediate cancellation (reason customer_immediate)
    is available from active and ends benefits on the day it is confirmed; whether any money comes back is decided
    only by membership_evt_fee_refund. A trial canceled before it converts (reason trial_canceled) is never charged.
    The agent registers the request on the customer's behalf and the customer confirms it; the agent never moves
    the status itself. On cancellation any unused priority upgrades lapse, and the credit balance stays spendable
    for credit_forfeit_after_cancel_days after canceled_date before it expires.
  eligibility:
  - id: renew_back_on
    applies_to: [membership_auto_renew_enabled]
    kind: state
    condition: Auto-renew can be turned back on only while the membership is still pending_cancellation.
    evidence_fields: [memberships.status, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    state_contract:
      field: memberships.status
      allowed: [pending_cancellation, active]
  params:
    cancel_reasons: [customer_immediate, customer_period_end, trial_canceled, unpaid, eligibility_not_verified]
- id: membership_evt_pause
  subject: [membership_paused, membership_resumed, membership_pause_logged]
  rule: >
    Only plans with pause_allowed true can be paused, and only from active. A pause starts on the next renewal date
    and lasts between pause_min_days and pause_max_days calendar days. A pause must be requested at least the plan's
    cutoff before the next renewal date. The cutoff is counted in calendar days backward from current_period_end,
    so the last day to ask is current_period_end minus pause_request_cutoff_days, inclusive. A membership may be
    paused no more than pauses_per_rolling_365_days times as counted by membership_msr_pauses_365d. No fee is charged
    and no benefit applies while paused, and priority upgrades and credit expiry clocks keep running. The membership
    resumes on the day after pause_end_date, or earlier on the customer's request, and a new paid period starts
    on the resume day with a renewal fee.
  eligibility:
  - id: pause_cutoff
    applies_to: [membership_paused]
    kind: time
    condition: A pause must be requested at least the plan's cutoff before the next renewal date.
    evidence_fields: [memberships.current_period_end, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the next renewal date
      anchor_source: memberships.current_period_end
      relation: not_after
      duration_source: variants.pause_request_cutoff_days
      unit: calendar_days
      counting_rule: >-
        The cutoff is counted in calendar days backward from current_period_end, so the last day to ask is current_period_end
        minus pause_request_cutoff_days, inclusive.
      boundary: inclusive
  - id: pause_from_active
    applies_to: [membership_paused]
    kind: state
    condition: Only plans with pause_allowed true can be paused, and only from active.
    evidence_fields: [memberships.status, memberships.variant_name, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    state_contract:
      field: memberships.status
      allowed: [active, paused]
  params:
    per_tier:
      Cartwise+ Assist Monthly: {pause_allowed: =pause_allowed, pause_max_days: =pause_max_days}
      Cartwise+ Student Monthly: {pause_allowed: =pause_allowed, pause_max_days: =pause_max_days}
      Cartwise+ Monthly: {pause_allowed: =pause_allowed, pause_max_days: =pause_max_days}
      Cartwise+ Annual: {pause_allowed: =pause_allowed, pause_max_days: =pause_max_days}
      Cartwise+ Family Annual: {pause_allowed: =pause_allowed, pause_max_days: =pause_max_days}
      Cartwise+ Premier Annual: {pause_allowed: =pause_allowed, pause_max_days: =pause_max_days}
  measures: [membership_msr_pauses_365d]
- id: membership_evt_plan_switch
  subject: [membership_plan_switched]
  rule: >
    A membership may switch only to a plan listed in its allowed_switch_targets, and only while it is active. A
    switch to a plan with a higher period_fee_usd takes effect immediately because upgrade_switch_timing is immediate:
    the unused days of the current period are credited under switch_proration_basis unused_days at the old plan's
    daily rate (membership_msr_current_period_charge divided by membership_msr_days_in_period, times membership_msr_unused_days)
    against the new plan's first fee, a new period starts on the switch date, and the plan_switch charge is the
    new period_fee_usd minus that credit, rounded to the cent and never below zero. A switch to a plan with an equal
    or lower fee takes effect, because downgrade_switch_timing is next_renewal, at the next renewal date with no
    proration. Only switches_per_period switch is allowed per paid period, so a switch is allowed only when plan_switched_date
    is empty or earlier than current_period_start. A switch to Assist or Student requires that plan's eligibility
    proof to be accepted first. Priority upgrades are re-allotted only by the new plan's next period start.
  eligibility:
  - id: switch_from_active
    applies_to: [membership_plan_switched]
    kind: state
    condition: >-
      A membership may switch only to a plan listed in its allowed_switch_targets, and only while it is active.
    evidence_fields: [memberships.status, memberships.variant_name, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    state_contract:
      field: memberships.status
      allowed: [active]
  formula:
    proration_credit: >-
      round(membership_msr_current_period_charge * membership_msr_unused_days / membership_msr_days_in_period, 2)
    amount_usd: max(round(period_fee_usd - proration_credit, 2), 0)
  measures: [membership_msr_current_period_charge, membership_msr_unused_days, membership_msr_days_in_period]
- id: membership_evt_credit_back
  subject: [membership_credit_earned, membership_credit_applied, membership_credit_expired]
  rule: >
    A completed order earns Cartwise+ credit when the customer's membership was trialing or active on the order's
    completion date, the order's service level is within credit_back_scope (pickup_only means Curbside Pickup orders
    only), and the eligible item subtotal is at least credit_back_min_subtotal_usd. The eligible item subtotal is
    membership_msr_order_eligible_subtotal: the order's item charges after substitutions and item refunds, excluding
    alcohol lines where credit_back_excludes_alcohol is true, and excluding fees and tips. The credit is credit_back_pct
    of that subtotal, rounded to the cent, capped at credit_back_cap_per_order_usd, and further cut to the room
    left under credit_max_balance_usd. An order earns credit only once. Credit is applied to an order only when
    its item subtotal is at least credit_redemption_min_subtotal_usd, oldest earnings first. Each earning's unspent
    remainder expires credit_expiry_days after it was earned, counted in calendar days with the earning date as
    day 0. After a cancellation, remaining credit expires on canceled_date plus credit_forfeit_after_cancel_days
    if that is sooner.
  eligibility:
  - id: one_earning_per_order
    applies_to: [membership_credit_earned]
    kind: dedup
    condition: An order earns credit only once.
    evidence_fields: [membership_events.order_id, membership_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [membership_events.order_id]
      action_bindings: {membership_events.order_id: order_id}
    dedup_contract:
      table: membership_events
      mode: separate_record
      object_bindings: {order_id: order_id}
      duplicate_filters:
        event_type: [membership_credit_earned]
      distinct_fields: []
  params:
    per_tier:
      Cartwise+ Assist Monthly: {credit_back_pct: =credit_back_pct, credit_back_cap_per_order_usd: =credit_back_cap_per_order_usd}
      Cartwise+ Student Monthly: {credit_back_pct: =credit_back_pct, credit_back_cap_per_order_usd: =credit_back_cap_per_order_usd}
      Cartwise+ Monthly: {credit_back_pct: =credit_back_pct, credit_back_cap_per_order_usd: =credit_back_cap_per_order_usd}
      Cartwise+ Annual: {credit_back_pct: =credit_back_pct, credit_back_cap_per_order_usd: =credit_back_cap_per_order_usd}
      Cartwise+ Family Annual: {credit_back_pct: =credit_back_pct, credit_back_cap_per_order_usd: =credit_back_cap_per_order_usd}
      Cartwise+ Premier Annual: {credit_back_pct: =credit_back_pct, credit_back_cap_per_order_usd: =credit_back_cap_per_order_usd}
  formula:
    amount_usd: >-
      min(round(membership_msr_order_eligible_subtotal * credit_back_pct / 100, 2), credit_back_cap_per_order_usd,
      credit_max_balance_usd - plus_credit)
  measures: [membership_msr_order_eligible_subtotal]
- id: membership_evt_priority_upgrades
  subject: [membership_upgrade_allotted, membership_upgrade_redeemed]
  rule: >
    At the start of each paid period a plan with priority_upgrades_per_period above 0 is allotted that many Priority
    Delivery upgrades; plans with 0 receive no allotment row. Unused upgrades lapse at the end of the period because
    priority_upgrade_rollover is false for every plan. An upgrade is redeemed on a Priority Delivery order placed
    while the membership is trialing or active; it replaces that order's Priority fee in full and uses exactly one
    upgrade. An upgrade cannot be redeemed when priority_upgrades_remaining is 0, and one order uses at most one
    upgrade. A redeemed upgrade is returned only when the order is canceled before shopping starts.
  eligibility:
  - id: one_upgrade_per_order
    applies_to: [membership_upgrade_redeemed]
    kind: dedup
    condition: one order uses at most one upgrade.
    evidence_fields: [membership_events.order_id, membership_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [membership_events.order_id]
      action_bindings: {membership_events.order_id: order_id}
    dedup_contract:
      table: membership_events
      mode: separate_record
      object_bindings: {order_id: order_id}
      duplicate_filters:
        event_type: [membership_upgrade_redeemed]
      distinct_fields: []
  params:
    per_tier:
      Cartwise+ Assist Monthly: {priority_upgrades_per_period: =priority_upgrades_per_period}
      Cartwise+ Student Monthly: {priority_upgrades_per_period: =priority_upgrades_per_period}
      Cartwise+ Monthly: {priority_upgrades_per_period: =priority_upgrades_per_period}
      Cartwise+ Annual: {priority_upgrades_per_period: =priority_upgrades_per_period}
      Cartwise+ Family Annual: {priority_upgrades_per_period: =priority_upgrades_per_period}
      Cartwise+ Premier Annual: {priority_upgrades_per_period: =priority_upgrades_per_period}
- id: membership_evt_household
  subject: [membership_member_added, membership_member_removed]
  rule: >
    Only plans with household_seats above 1 share benefits, and only while the membership is trialing or active.
    A member may be added only while membership_msr_household_active_members is below household_seats. The added
    person must have their own customer profile, be at least household_member_min_age_years old, and must not hold
    a Cartwise+ membership of their own that is not canceled; holding one blocks the addition. A person removed
    from this membership cannot be added back until household_readd_cooldown_days calendar days after the removal
    date have passed. Removals in one paid period are limited to household_removals_per_period as counted by membership_msr_removals_this_period.
    Household members share free delivery, the member service-fee rate and credit earning (credited to the holder's
    balance); priority upgrades and credit redemption remain with the holder.
  eligibility:
  - id: seat_available
    applies_to: [membership_member_added]
    kind: state
    condition: >-
      Only plans with household_seats above 1 share benefits, and only while the membership is trialing or active.
    evidence_fields: [memberships.status, memberships.variant_name, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    state_contract:
      field: memberships.status
      allowed: [trialing, active]
  params:
    per_tier:
      Cartwise+ Assist Monthly: {household_seats: =household_seats, household_removals_per_period: =household_removals_per_period}
      Cartwise+ Student Monthly: {household_seats: =household_seats, household_removals_per_period: =household_removals_per_period}
      Cartwise+ Monthly: {household_seats: =household_seats, household_removals_per_period: =household_removals_per_period}
      Cartwise+ Annual: {household_seats: =household_seats, household_removals_per_period: =household_removals_per_period}
      Cartwise+ Family Annual: {household_seats: =household_seats, household_removals_per_period: =household_removals_per_period}
      Cartwise+ Premier Annual: {household_seats: =household_seats, household_removals_per_period: =household_removals_per_period}
  measures: [membership_msr_household_active_members, membership_msr_removals_this_period]
- id: membership_evt_order_benefits
  subject: [membership_credit_applied, membership_upgrade_redeemed]
  rule: >
    A membership's order benefits are free delivery on the services in free_delivery_services when the order's item
    subtotal is at least free_delivery_order_minimum_usd, the member_service_fee_rate_pct service-fee rate, the
    express_fee_discount_pct discount on the Express 30 fee, the small-basket fee waiver where small_basket_fee_waived
    is true, credit back and priority upgrades. Benefits apply to an order only when the membership is trialing
    or active on the order's placed date, or pending_cancellation (the paid period has not yet ended), or past_due
    where benefits_during_past_due is true; an applied, paused or canceled membership grants none. Benefits are
    judged once, on the placed date, and are not recomputed when the membership's status changes later. How each
    benefit enters the order's charges is set by the order charter.
  eligibility:
  - id: benefit_status
    applies_to: [membership_credit_applied, membership_upgrade_redeemed]
    kind: state
    condition: >-
      Benefits apply to an order only when the membership is trialing or active on the order's placed date, or pending_cancellation
      (the paid period has not yet ended), or past_due where benefits_during_past_due is true; an applied, paused
      or canceled membership grants none.
    evidence_fields: [memberships.status, memberships.membership_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [memberships.membership_id]
      action_bindings: {memberships.membership_id: membership_id}
    state_contract:
      field: memberships.status
      allowed: [trialing, active, past_due, pending_cancellation]
  params:
    per_tier:
      Cartwise+ Assist Monthly: {free_delivery_order_minimum_usd: =free_delivery_order_minimum_usd, member_service_fee_rate_pct: =member_service_fee_rate_pct}
      Cartwise+ Student Monthly: {free_delivery_order_minimum_usd: =free_delivery_order_minimum_usd, member_service_fee_rate_pct: =member_service_fee_rate_pct}
      Cartwise+ Monthly: {free_delivery_order_minimum_usd: =free_delivery_order_minimum_usd, member_service_fee_rate_pct: =member_service_fee_rate_pct}
      Cartwise+ Annual: {free_delivery_order_minimum_usd: =free_delivery_order_minimum_usd, member_service_fee_rate_pct: =member_service_fee_rate_pct}
      Cartwise+ Family Annual: {free_delivery_order_minimum_usd: =free_delivery_order_minimum_usd, member_service_fee_rate_pct: =member_service_fee_rate_pct}
      Cartwise+ Premier Annual: {free_delivery_order_minimum_usd: =free_delivery_order_minimum_usd, member_service_fee_rate_pct: =member_service_fee_rate_pct}

extended_policies:
- id: membership_ext_term_charge_refund
  base_policy_refs:
  - membership_evt_fee_refund
  overwrite:
  - base_policy: membership_evt_fee_refund
    superseded_clause: >-
      A full refund is available only when the request is made within the unused-refund window counted from the
      day the period fee was charged.
    replaced_by: >-
      When a member ends early an annual term that a plan switch from a monthly plan opened, the charge that opened
      the term is refunded under this rule whenever the early end is asked for, however long ago that charge was
      captured and whether or not a member benefit was used since.
  - base_policy: membership_evt_fee_refund
    superseded_clause: >-
      Outside the window, or once a benefit has been used, an annual plan (prorated_refund_allowed true) receives
      a prorated_annual refund of the unused full months (membership_msr_unused_full_months), and only while no
      more than prorated_refund_max_used_months months of the period have started; a month has started on the same
      day-of-month as the period start.
    replaced_by: The standard term-opening refund is worked out in three steps.
  - base_policy: membership_evt_fee_refund
    superseded_clause: >-
      Where refund_requires_no_benefit_use is true, a full refund additionally requires membership_msr_benefit_uses_since_charge
      to be 0; a refund_type of full_unused refunds the whole charge.
    replaced_by: >-
      The term-opening refund is always priced by the method below and never as a refund of the whole charge.
  trigger: on_request
  subject:
  - membership_fee_refunded
  computes: amount_usd
  target_tool: confirm_annual_term_early_end_0b7355fe
  params:
    long_member_months: 18
    months_per_term: 12
    first_quarter_months: 3
    opening_rate_full: 1.0
    opening_rate_after_retry: 0.95
    opening_rate_standard: 0.9
    frequent_capture_count: 10
    steady_capture_count: 6
    waiver_offset_gold: 0.5
    waiver_offset_silver: 0.75
    waiver_offset_standard: 1.0
  rule: >-
    When a member ends early an annual term that a plan switch from a monthly plan opened, the charge that opened
    the term is refunded under this rule whenever the early end is asked for, however long ago that charge was captured
    and whether or not a member benefit was used since. An annual term opened by a first-period or renewal charge
    is not ended early under this rule. The term-opening refund is always priced by the method below and never as
    a refund of the whole charge. The charge that opened the term is the fee charge on the membership whose billing
    period start is the first day of the current term; the refund is booked against that charge, is returned to
    the original payment method, and is the member's own confirmation of the early end. The standard term-opening
    refund is worked out in three steps. First, the unused share of the term is the months of the term not yet started,
    divided by months_per_term, where a month of the term starts on the same day of the month as the term's first
    day and the month in progress counts as started. Second, the opening charge times that unused share times the
    opening retention rate of opening_rate_standard, rounded to the cent, is the gross opening refund. Third, the
    member fee waivers received on orders in the three months ending today are taken off the gross opening refund
    at the waiver offset rate of waiver_offset_standard; the offset is rounded to the cent, and the gross opening
    refund less the offset, never below zero, is the term-opening refund. The unused share of the term is measured
    by one of three methods. A member whose enrollment date is at least long_member_months months back and who received
    no member fee waiver on any order in the last month has the month in progress refunded as well: the unused share
    is months_per_term less the whole months of the term already completed, divided by months_per_term. A member
    whose enrollment date is at least long_member_months months back and who received at least one member fee waiver
    on an order in the last month has the unused share counted in calendar days: the days from today up to the day
    before the term ends, divided by the days in the term. Any other member has the unused share counted in months
    not yet started, as in the standard method. The opening retention rate depends on the term's age and on the
    member's payment record. A term with fewer than first_quarter_months whole months completed, on a membership
    with no retry capture in the last twelve months, is refunded at opening_rate_full. A term with fewer than first_quarter_months
    whole months completed, on a membership with at least one retry capture in the last twelve months, is refunded
    at opening_rate_after_retry. Any other term is refunded at opening_rate_standard. The waivers offset are counted
    over a window that depends on how steadily the member has paid. A membership with at least frequent_capture_count
    fee charges captured in the last twelve months has only the waivers of the last month counted. A membership
    with at least steady_capture_count and fewer than frequent_capture_count fee charges captured in the last twelve
    months has the waivers of the last two months counted. Any other membership has the waivers of the last three
    months counted. The waiver offset rate follows the member's Cartwise Rewards tier. A member at Cartwise Rewards
    Gold, Platinum or Diamond has the counted waivers offset at waiver_offset_gold. A member at Cartwise Rewards
    Silver or Bronze has them offset at waiver_offset_silver. Any other member has them offset at waiver_offset_standard.
    Every window here is counted in whole months ending today, a row dated on the same day of the month that many
    months back not counted.
  prerequisite: []
  cross_category:
  - category: order
    as: history
    reads:
    - order_events.event_type
    - order_events.amount_usd
    - order_events.event_date
    note: >-
      the unused-share method and the offset window read the member fee waivers booked on the member's orders.
  - category: rewards
    as: branch
    reads:
    - variant_name
    note: the waiver offset rate reads the member's Cartwise Rewards tier.
  compute:
  - opening_charge: >-
      SUM('membership_events', 'amount_usd', event_type='membership_fee_charged', billing_period_start=F('current_period_start'))
  - enrolled_months: MONTHS(F('enrolled_date'), NOW)
  - waivers_last_month: XCOUNT('order', 'order_events', within_months=1, event_type='order_fee_waived')
  - term_months_completed: MONTHS(F('current_period_start'), NOW)
  - unused_share: >-
      (K('months_per_term') - term_months_completed) / K('months_per_term') if (enrolled_months >= K('long_member_months')
      and waivers_last_month == 0) else (DAYS(NOW, F('current_period_end')) / DAYS(F('current_period_start'), F('current_period_end'))
      if (enrolled_months >= K('long_member_months') and waivers_last_month >= 1) else (K('months_per_term') - term_months_completed
      - 1) / K('months_per_term'))
  - term_retry_captures: >-
      COUNT('membership_events', within_months=12, event_type='membership_fee_charged', fee_type='renewal_retry')
  - opening_rate: >-
      K('opening_rate_full') if (term_months_completed < K('first_quarter_months') and term_retry_captures == 0)
      else (K('opening_rate_after_retry') if (term_months_completed < K('first_quarter_months') and term_retry_captures
      >= 1) else K('opening_rate_standard'))
  - gross_opening_refund: RND(opening_charge * unused_share * opening_rate, 2)
  - captures_12m: COUNT('membership_events', within_months=12, event_type='membership_fee_charged')
  - offset_waivers: >-
      XSUM('order', 'order_events', 'amount_usd', within_months=1, event_type='order_fee_waived') if captures_12m
      >= K('frequent_capture_count') else (XSUM('order', 'order_events', 'amount_usd', within_months=2, event_type='order_fee_waived')
      if captures_12m >= K('steady_capture_count') else XSUM('order', 'order_events', 'amount_usd', within_months=3,
      event_type='order_fee_waived'))
  - rewards_tier: CFIELD('rewards', 'variant_name')
  - waiver_offset_rate: >-
      K('waiver_offset_gold') if (rewards_tier == 'Cartwise Rewards Gold' or rewards_tier == 'Cartwise Rewards Platinum'
      or rewards_tier == 'Cartwise Rewards Diamond') else (K('waiver_offset_silver') if (rewards_tier == 'Cartwise
      Rewards Silver' or rewards_tier == 'Cartwise Rewards Bronze') else K('waiver_offset_standard'))
  - waiver_offset: RND(offset_waivers * waiver_offset_rate, 2)
  - result: MX(0, RND(gross_opening_refund - waiver_offset, 2))
  compute_basis:
    opening_charge: >-
      The charge that opened the term is the fee charge on the membership whose billing period start is the first
      day of the current term; the refund is booked against that charge, is returned to the original payment method,
      and is the member's own confirmation of the early end.
    enrolled_months: >-
      A member whose enrollment date is at least long_member_months months back and who received no member fee waiver
      on any order in the last month has the month in progress refunded as well: the unused share is months_per_term
      less the whole months of the term already completed, divided by months_per_term.
    waivers_last_month: >-
      A member whose enrollment date is at least long_member_months months back and who received at least one member
      fee waiver on an order in the last month has the unused share counted in calendar days: the days from today
      up to the day before the term ends, divided by the days in the term.
    term_months_completed: >-
      First, the unused share of the term is the months of the term not yet started, divided by months_per_term,
      where a month of the term starts on the same day of the month as the term's first day and the month in progress
      counts as started.
    unused_share: >-
      The unused share of the term is measured by one of three methods. A member whose enrollment date is at least
      long_member_months months back and who received no member fee waiver on any order in the last month has the
      month in progress refunded as well: the unused share is months_per_term less the whole months of the term
      already completed, divided by months_per_term. A member whose enrollment date is at least long_member_months
      months back and who received at least one member fee waiver on an order in the last month has the unused share
      counted in calendar days: the days from today up to the day before the term ends, divided by the days in the
      term. Any other member has the unused share counted in months not yet started, as in the standard method.
    term_retry_captures: >-
      A term with fewer than first_quarter_months whole months completed, on a membership with no retry capture
      in the last twelve months, is refunded at opening_rate_full.
    opening_rate: >-
      The opening retention rate depends on the term's age and on the member's payment record. A term with fewer
      than first_quarter_months whole months completed, on a membership with no retry capture in the last twelve
      months, is refunded at opening_rate_full. A term with fewer than first_quarter_months whole months completed,
      on a membership with at least one retry capture in the last twelve months, is refunded at opening_rate_after_retry.
      Any other term is refunded at opening_rate_standard.
    gross_opening_refund: >-
      Second, the opening charge times that unused share times the opening retention rate of opening_rate_standard,
      rounded to the cent, is the gross opening refund.
    captures_12m: >-
      A membership with at least frequent_capture_count fee charges captured in the last twelve months has only
      the waivers of the last month counted.
    offset_waivers: >-
      The waivers offset are counted over a window that depends on how steadily the member has paid. A membership
      with at least frequent_capture_count fee charges captured in the last twelve months has only the waivers of
      the last month counted. A membership with at least steady_capture_count and fewer than frequent_capture_count
      fee charges captured in the last twelve months has the waivers of the last two months counted. Any other membership
      has the waivers of the last three months counted.
    rewards_tier: The waiver offset rate follows the member's Cartwise Rewards tier.
    waiver_offset_rate: >-
      A member at Cartwise Rewards Gold, Platinum or Diamond has the counted waivers offset at waiver_offset_gold.
      A member at Cartwise Rewards Silver or Bronze has them offset at waiver_offset_silver. Any other member has
      them offset at waiver_offset_standard.
    waiver_offset: >-
      Third, the member fee waivers received on orders in the three months ending today are taken off the gross
      opening refund at the waiver offset rate of waiver_offset_standard; the offset is rounded to the cent, and
      the gross opening refund less the offset, never below zero, is the term-opening refund.
    result: >-
      Third, the member fee waivers received on orders in the three months ending today are taken off the gross
      opening refund at the waiver offset rate of waiver_offset_standard; the offset is rounded to the cent, and
      the gross opening refund less the offset, never below zero, is the term-opening refund.
  factors:
  - id: unused_share_method
    effect: method
    decides: unused_share
    bindings:
    - enrolled_months
    - waivers_last_month
    - unused_share
    ladder:
    - when: >-
        enrollment date at least long_member_months months back AND no member fee waiver on any order in the last
        month
      method: >-
        the month in progress is refunded too: months_per_term less the whole months of the term completed, over
        months_per_term
    - when: >-
        enrollment date at least long_member_months months back AND at least one member fee waiver on an order in
        the last month
      method: calendar days from today up to the day before the term ends, over the days in the term
    - when: otherwise
      method: months of the term not yet started (the month in progress counted as started), over months_per_term
    baseline:
      unused_share: (K('months_per_term') - term_months_completed - 1) / K('months_per_term')
    evidence:
    - date
    - cross_category
    cross_difficulty: order
  - id: opening_retention_rate
    effect: parameter
    decides: opening_rate
    bindings:
    - term_retry_captures
    - opening_rate
    ladder:
    - when: >-
        fewer than first_quarter_months whole months of the term completed AND no retry capture on the membership
        in the last twelve months
      value: K('opening_rate_full')
    - when: >-
        fewer than first_quarter_months whole months of the term completed AND at least one retry capture in the
        last twelve months
      value: K('opening_rate_after_retry')
    - when: otherwise
      value: K('opening_rate_standard')
    baseline:
      opening_rate: K('opening_rate_standard')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: waiver_offset_window
    effect: parameter
    decides: offset_waivers
    bindings:
    - captures_12m
    - offset_waivers
    ladder:
    - when: at least frequent_capture_count fee charges captured in the last twelve months
      value: a waiver window of the last month
    - when: >-
        at least steady_capture_count and fewer than frequent_capture_count fee charges captured in the last twelve
        months
      value: a waiver window of the last two months
    - when: otherwise
      value: a waiver window of the last three months
    baseline:
      offset_waivers: XSUM('order', 'order_events', 'amount_usd', within_months=3, event_type='order_fee_waived')
    evidence:
    - history
    - cross_category
    cross_difficulty: order
  - id: waiver_offset_rate
    effect: parameter
    decides: waiver_offset_rate
    bindings:
    - rewards_tier
    - waiver_offset_rate
    ladder:
    - when: Cartwise Rewards tier Gold, Platinum or Diamond
      value: K('waiver_offset_gold')
    - when: Cartwise Rewards tier Silver or Bronze
      value: K('waiver_offset_silver')
    - when: otherwise
      value: K('waiver_offset_standard')
    baseline:
      waiver_offset_rate: K('waiver_offset_standard')
    evidence:
    - cross_category
    cross_difficulty: rewards
  baseline:
    rule: >-
      The standard term-opening refund is worked out in three steps. First, the unused share of the term is the
      months of the term not yet started, divided by months_per_term, where a month of the term starts on the same
      day of the month as the term's first day and the month in progress counts as started. Second, the opening
      charge times that unused share times the opening retention rate of opening_rate_standard, rounded to the cent,
      is the gross opening refund. Third, the member fee waivers received on orders in the three months ending today
      are taken off the gross opening refund at the waiver offset rate of waiver_offset_standard; the offset is
      rounded to the cent, and the gross opening refund less the offset, never below zero, is the term-opening refund.
    params:
    - months_per_term
    - opening_rate_standard
    - waiver_offset_standard
  inputs:
    history:
    - table: membership_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: membership_fee_charged
    - table: membership_events
      aggregate: count
      field: membership_event_id
      within_months: 12
      filters:
        event_type: membership_fee_charged
    - category: order
      table: order_events
      aggregate: sum
      field: amount_usd
      within_months: 3
      filters:
        event_type: order_fee_waived
    cross_category:
    - order
    - rewards
- id: membership_ext_carried_value_refund
  base_policy_refs:
  - membership_evt_fee_refund
  overwrite:
  - base_policy: membership_evt_fee_refund
    superseded_clause: >-
      A full refund is available only when the request is made within the unused-refund window counted from the
      day the period fee was charged.
    replaced_by: >-
      When an annual term that was opened by a plan switch ends early, the value an earlier fee charge carried into
      the term is refunded against that earlier charge whenever the early end is asked for.
  - base_policy: membership_evt_fee_refund
    superseded_clause: >-
      A refund of a first period or renewal charge ends the membership: after a full_unused or prorated_annual refund
      the membership is canceled, registered as a customer request that takes effect once the customer confirms;
      a duplicate_charge refund leaves the membership as it is.
    replaced_by: A carried-value refund leaves the membership, its plan and its dates as they are.
  - base_policy: membership_evt_fee_refund
    superseded_clause: >-
      Where refund_requires_no_benefit_use is true, a full refund additionally requires membership_msr_benefit_uses_since_charge
      to be 0; a refund_type of full_unused refunds the whole charge.
    replaced_by: >-
      The carried-value refund is priced by the method below whether or not a member benefit was used since the
      earlier charge, and never as a refund of the whole earlier charge.
  - base_policy: membership_evt_fee_refund
    superseded_clause: Monthly plans receive no refund outside the full-refund rule.
    replaced_by: It is due even when the earlier charge was the fee of a monthly plan.
  trigger: on_request
  subject:
  - membership_fee_refunded
  computes: amount_usd
  target_tool: refund_carried_term_value_822a3886
  params:
    months_per_term: 12
    recent_switch_months: 3
    small_carry_usd: 6.0
    carried_rate_gold: 1.0
    carried_rate_silver: 0.95
    carried_rate_standard: 0.9
    handling_clean: 0.0
    handling_one_retry: 0.25
    handling_standard: 0.5
    frequent_capture_count: 10
    steady_capture_count: 6
    carried_waiver_share_frequent: 0.1
    carried_waiver_share_steady: 0.25
    carried_waiver_share_standard: 0.5
  rule: >-
    When an annual term that was opened by a plan switch ends early, the value an earlier fee charge carried into
    the term is refunded against that earlier charge whenever the early end is asked for. The carried value is the
    part of the annual plan's period fee that the plan-switch charge did not collect: the plan's period_fee_usd
    less the plan-switch charge that opened the term, rounded to the cent. The earlier charge is the fee charge
    captured most recently before the term's first day, and the carried-value refund is booked against it and returned
    to the original payment method. A carried-value refund leaves the membership, its plan and its dates as they
    are. The carried-value refund is priced by the method below whether or not a member benefit was used since the
    earlier charge, and never as a refund of the whole earlier charge. It is due even when the earlier charge was
    the fee of a monthly plan. The standard carried-value refund is worked out as follows. The carried value is
    multiplied by the calendar days from today up to the day before the term ends over the days in the term and
    by the carried retention rate of carried_rate_standard, and the product is rounded to the cent. A handling amount
    of handling_standard is taken off, and so is a carried waiver share of carried_waiver_share_standard times the
    member fee waivers received on orders in the last month; the result, rounded to the cent and never below zero,
    is the carried-value refund. The part of the carried value that is refunded is set by one of three methods.
    When the plan switch that opened the term took effect fewer than recent_switch_months whole months ago and the
    carried value is below small_carry_usd, the whole carried value is refunded. When the plan switch took effect
    fewer than recent_switch_months whole months ago and the carried value is small_carry_usd or more, the carried
    value is refunded for the months of the term not yet started over months_per_term, the month in progress counted
    as started. Otherwise the carried value is refunded for the calendar days still ahead, as in the standard method.
    The carried retention rate follows the member's Cartwise Rewards tier: carried_rate_gold at Gold, Platinum or
    Diamond, carried_rate_silver at Silver or Bronze, and carried_rate_standard at any other tier or with no rewards
    account. The handling amount follows the membership's record of late payments over the last twelve months: a
    membership with no retry capture in that time pays handling_clean, a membership with exactly one retry capture
    pays handling_one_retry, and any other membership pays handling_standard. The carried waiver share follows how
    steadily the member has paid over the last twelve months: at least frequent_capture_count fee charges captured
    gives carried_waiver_share_frequent, at least steady_capture_count and fewer than frequent_capture_count gives
    carried_waiver_share_steady, and fewer gives carried_waiver_share_standard. Every window here is counted in
    whole months ending today, a row dated on the same day of the month that many months back not counted.
  prerequisite: []
  cross_category:
  - category: rewards
    as: branch
    reads:
    - variant_name
    note: the carried retention rate reads the member's Cartwise Rewards tier.
  - category: order
    as: history
    reads:
    - order_events.event_type
    - order_events.amount_usd
    - order_events.event_date
    note: >-
      the carried waiver share is applied to the member fee waivers booked on the member's orders in the last month.
  compute:
  - opening_charge: >-
      SUM('membership_events', 'amount_usd', event_type='membership_fee_charged', fee_type='plan_switch', billing_period_start=F('current_period_start'))
  - carried_value: RND(P('period_fee_usd') - opening_charge, 2)
  - switch_age_months: MONTHS(F('plan_switched_date'), NOW)
  - carried_share: >-
      1 if (switch_age_months < K('recent_switch_months') and carried_value < K('small_carry_usd')) else ((K('months_per_term')
      - MONTHS(F('current_period_start'), NOW) - 1) / K('months_per_term') if (switch_age_months < K('recent_switch_months')
      and carried_value >= K('small_carry_usd')) else DAYS(NOW, F('current_period_end')) / DAYS(F('current_period_start'),
      F('current_period_end')))
  - carried_tier: CFIELD('rewards', 'variant_name')
  - carried_rate: >-
      K('carried_rate_gold') if (carried_tier == 'Cartwise Rewards Gold' or carried_tier == 'Cartwise Rewards Platinum'
      or carried_tier == 'Cartwise Rewards Diamond') else (K('carried_rate_silver') if (carried_tier == 'Cartwise
      Rewards Silver' or carried_tier == 'Cartwise Rewards Bronze') else K('carried_rate_standard'))
  - retry_captures_12m: >-
      COUNT('membership_events', within_months=12, event_type='membership_fee_charged', fee_type='renewal_retry')
  - handling_amount: >-
      K('handling_clean') if retry_captures_12m == 0 else (K('handling_one_retry') if retry_captures_12m == 1 else
      K('handling_standard'))
  - carried_captures_12m: COUNT('membership_events', within_months=12, event_type='membership_fee_charged')
  - carried_waiver_share: >-
      K('carried_waiver_share_frequent') if carried_captures_12m >= K('frequent_capture_count') else (K('carried_waiver_share_steady')
      if carried_captures_12m >= K('steady_capture_count') else K('carried_waiver_share_standard'))
  - month_waivers: XSUM('order', 'order_events', 'amount_usd', within_months=1, event_type='order_fee_waived')
  - gross_carried_refund: RND(carried_value * carried_share * carried_rate, 2)
  - result: MX(0, RND(gross_carried_refund - handling_amount - RND(carried_waiver_share * month_waivers, 2), 2))
  compute_basis:
    opening_charge: >-
      The carried value is the part of the annual plan's period fee that the plan-switch charge did not collect:
      the plan's period_fee_usd less the plan-switch charge that opened the term, rounded to the cent.
    carried_value: >-
      The carried value is the part of the annual plan's period fee that the plan-switch charge did not collect:
      the plan's period_fee_usd less the plan-switch charge that opened the term, rounded to the cent.
    switch_age_months: >-
      When the plan switch that opened the term took effect fewer than recent_switch_months whole months ago and
      the carried value is below small_carry_usd, the whole carried value is refunded.
    carried_share: >-
      The part of the carried value that is refunded is set by one of three methods. When the plan switch that opened
      the term took effect fewer than recent_switch_months whole months ago and the carried value is below small_carry_usd,
      the whole carried value is refunded. When the plan switch took effect fewer than recent_switch_months whole
      months ago and the carried value is small_carry_usd or more, the carried value is refunded for the months
      of the term not yet started over months_per_term, the month in progress counted as started. Otherwise the
      carried value is refunded for the calendar days still ahead, as in the standard method.
    carried_tier: >-
      The carried retention rate follows the member's Cartwise Rewards tier: carried_rate_gold at Gold, Platinum
      or Diamond, carried_rate_silver at Silver or Bronze, and carried_rate_standard at any other tier or with no
      rewards account.
    carried_rate: >-
      The carried retention rate follows the member's Cartwise Rewards tier: carried_rate_gold at Gold, Platinum
      or Diamond, carried_rate_silver at Silver or Bronze, and carried_rate_standard at any other tier or with no
      rewards account.
    retry_captures_12m: >-
      The handling amount follows the membership's record of late payments over the last twelve months: a membership
      with no retry capture in that time pays handling_clean, a membership with exactly one retry capture pays handling_one_retry,
      and any other membership pays handling_standard.
    handling_amount: >-
      The handling amount follows the membership's record of late payments over the last twelve months: a membership
      with no retry capture in that time pays handling_clean, a membership with exactly one retry capture pays handling_one_retry,
      and any other membership pays handling_standard.
    carried_captures_12m: >-
      The carried waiver share follows how steadily the member has paid over the last twelve months: at least frequent_capture_count
      fee charges captured gives carried_waiver_share_frequent, at least steady_capture_count and fewer than frequent_capture_count
      gives carried_waiver_share_steady, and fewer gives carried_waiver_share_standard.
    carried_waiver_share: >-
      The carried waiver share follows how steadily the member has paid over the last twelve months: at least frequent_capture_count
      fee charges captured gives carried_waiver_share_frequent, at least steady_capture_count and fewer than frequent_capture_count
      gives carried_waiver_share_steady, and fewer gives carried_waiver_share_standard.
    month_waivers: >-
      A handling amount of handling_standard is taken off, and so is a carried waiver share of carried_waiver_share_standard
      times the member fee waivers received on orders in the last month; the result, rounded to the cent and never
      below zero, is the carried-value refund.
    gross_carried_refund: >-
      The carried value is multiplied by the calendar days from today up to the day before the term ends over the
      days in the term and by the carried retention rate of carried_rate_standard, and the product is rounded to
      the cent.
    result: >-
      A handling amount of handling_standard is taken off, and so is a carried waiver share of carried_waiver_share_standard
      times the member fee waivers received on orders in the last month; the result, rounded to the cent and never
      below zero, is the carried-value refund.
  factors:
  - id: carried_share_method
    effect: method
    decides: carried_share
    bindings:
    - switch_age_months
    - carried_share
    ladder:
    - when: >-
        plan switch that opened the term took effect fewer than recent_switch_months whole months ago AND carried
        value below small_carry_usd
      method: the whole carried value is refunded
    - when: >-
        plan switch took effect fewer than recent_switch_months whole months ago AND carried value small_carry_usd
        or more
      method: the carried value times the months of the term not yet started over months_per_term
    - when: otherwise
      method: the carried value times the calendar days still ahead over the days in the term
    baseline:
      carried_share: DAYS(NOW, F('current_period_end')) / DAYS(F('current_period_start'), F('current_period_end'))
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: carried_retention_rate
    effect: parameter
    decides: carried_rate
    bindings:
    - carried_tier
    - carried_rate
    ladder:
    - when: Cartwise Rewards tier Gold, Platinum or Diamond
      value: K('carried_rate_gold')
    - when: Cartwise Rewards tier Silver or Bronze
      value: K('carried_rate_silver')
    - when: otherwise
      value: K('carried_rate_standard')
    baseline:
      carried_rate: K('carried_rate_standard')
    evidence:
    - cross_category
    cross_difficulty: rewards
  - id: carried_handling_amount
    effect: parameter
    decides: handling_amount
    bindings:
    - retry_captures_12m
    - handling_amount
    ladder:
    - when: no retry capture on the membership in the last twelve months
      value: K('handling_clean')
    - when: exactly one retry capture in the last twelve months
      value: K('handling_one_retry')
    - when: otherwise
      value: K('handling_standard')
    baseline:
      handling_amount: K('handling_standard')
    evidence:
    - history
    cross_difficulty: null
  - id: carried_waiver_share
    effect: parameter
    decides: carried_waiver_share
    bindings:
    - carried_captures_12m
    - carried_waiver_share
    ladder:
    - when: at least frequent_capture_count fee charges captured in the last twelve months
      value: K('carried_waiver_share_frequent')
    - when: >-
        at least steady_capture_count and fewer than frequent_capture_count fee charges captured in the last twelve
        months
      value: K('carried_waiver_share_steady')
    - when: otherwise
      value: K('carried_waiver_share_standard')
    baseline:
      carried_waiver_share: K('carried_waiver_share_standard')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The standard carried-value refund is worked out as follows. The carried value is multiplied by the calendar
      days from today up to the day before the term ends over the days in the term and by the carried retention
      rate of carried_rate_standard, and the product is rounded to the cent. A handling amount of handling_standard
      is taken off, and so is a carried waiver share of carried_waiver_share_standard times the member fee waivers
      received on orders in the last month; the result, rounded to the cent and never below zero, is the carried-value
      refund.
    params:
    - carried_rate_standard
    - handling_standard
    - carried_waiver_share_standard
  inputs:
    history:
    - table: membership_events
      aggregate: count
      field: membership_event_id
      within_months: 12
      filters:
        event_type: membership_fee_charged
    - category: order
      table: order_events
      aggregate: sum
      field: amount_usd
      within_months: 1
      filters:
        event_type: order_fee_waived
    cross_category:
    - rewards
    - order
- id: membership_ext_move_to_monthly_charge
  base_policy_refs:
  - membership_evt_plan_switch
  - membership_evt_fee_billing
  overwrite:
  - base_policy: membership_evt_plan_switch
    superseded_clause: >-
      A switch to a plan with an equal or lower fee takes effect, because downgrade_switch_timing is next_renewal,
      at the next renewal date with no proration.
    replaced_by: >-
      A member on Cartwise+ Annual whose current annual term was opened by a plan switch from a monthly plan and
      who asks for a pause is moved to Cartwise+ Monthly on the day of the request, and a new one-month paid period
      starts that day with a plan-switch charge.
  - base_policy: membership_evt_plan_switch
    superseded_clause: >-
      Only switches_per_period switch is allowed per paid period, so a switch is allowed only when plan_switched_date
      is empty or earlier than current_period_start.
    replaced_by: This move is allowed even in a term that a plan switch opened.
  - base_policy: membership_evt_fee_billing
    superseded_clause: Every paid period is billed once, on its first day, at the plan's period_fee_usd
    replaced_by: >-
      The new monthly period is billed on its first day at the move-to-monthly charge worked out below rather than
      at Cartwise+ Monthly's full period fee.
  trigger: on_request
  subject:
  - membership_plan_switched
  computes: amount_usd
  target_tool: move_annual_plan_to_monthly_dc3bc730
  params:
    monthly_plan_fee_usd: 9.99
    long_member_months: 18
    weeks_days: 7
    months_per_term: 12
    move_rate_gold: 0.9
    move_rate_silver: 0.95
    move_rate_standard: 1.0
    credit_share_clean: 1.0
    credit_share_one_retry: 0.75
    credit_share_standard: 0.5
    welcome_long: 1.0
    welcome_mid: 0.5
    welcome_none: 0.0
    monthly_history_long: 12
    monthly_history_mid: 6
    activity_credit_two: 0.5
    activity_credit_one: 0.25
    activity_credit_none: 0.0
    recent_switch_months: 3
  rule: >-
    A member on Cartwise+ Annual whose current annual term was opened by a plan switch from a monthly plan and who
    asks for a pause is moved to Cartwise+ Monthly on the day of the request, and a new one-month paid period starts
    that day with a plan-switch charge. A member whose annual term was opened by a first-period or renewal charge
    is not moved under this rule. The new monthly period is billed on its first day at the move-to-monthly charge
    worked out below rather than at Cartwise+ Monthly's full period fee. This move is allowed even in a term that
    a plan switch opened. The move-to-monthly charge is fixed only after the charge that opened the annual term
    carries a prorated-annual refund booked against it. The move-to-monthly charge is not fixed until the fee charge
    captured most recently before the annual term began carries its own refund of the value it carried into the
    term. The standard move-to-monthly charge is worked out as follows. The value the member still holds in the
    annual term is the plan-switch charge that opened the term plus the value carried into it (the annual plan's
    period_fee_usd less that plan-switch charge), less every prorated-annual refund booked on the membership in
    the last month. The value of the annual term already run is the annual plan's period_fee_usd times the calendar
    days from the term's first day up to the day before today, divided by the days in the term. The value held ahead
    of today is the value held less the value already run, rounded to the cent and never below zero, and the move
    credit is credit_share_standard of it, rounded to the cent. The move-to-monthly charge is Cartwise+ Monthly's
    period fee of monthly_plan_fee_usd times the move rate of move_rate_standard, less the move credit, rounded
    to the cent and never below zero. The value of the annual term already run is measured by one of three methods.
    A member whose enrollment date is at least long_member_months months back and whose plan switch into the annual
    term took effect fewer than recent_switch_months whole months ago has it counted in whole weeks: the annual
    plan's period_fee_usd times the whole weeks run times weeks_days, divided by the days in the term. A member
    whose enrollment date is at least long_member_months months back and whose plan switch into the annual term
    took effect recent_switch_months or more whole months ago has it counted in months started: the annual plan's
    period_fee_usd times the months of the term started, the month in progress included, divided by months_per_term.
    Any other member has it counted in calendar days, as in the standard method. The move credit share follows the
    membership's late payments over the last twelve months: credit_share_clean with no retry capture, credit_share_one_retry
    with exactly one retry capture, and credit_share_standard otherwise. The move rate follows the member's Cartwise
    Rewards tier: move_rate_gold at Gold, Platinum or Diamond, move_rate_silver at Silver or Bronze, and move_rate_standard
    at any other tier or with no rewards account. A welcome-back amount is taken off the move-to-monthly charge
    for members who were on a monthly plan before: a membership with at least monthly_history_long renewal charges
    on record takes off welcome_long, one with at least monthly_history_mid and fewer than monthly_history_long
    takes off welcome_mid, and any other takes off welcome_none. An activity credit is taken off as well for members
    who shopped with their benefits in the last month: at least two member fee waivers on orders in the last month
    takes off activity_credit_two, exactly one takes off activity_credit_one, and none takes off activity_credit_none.
    Every window here is counted in whole months ending today, a row dated on the same day of the month that many
    months back not counted.
  prerequisite:
  - problem: membership_ext_term_charge_refund
    kind: value_input
    gate: value_held
    form: state
    policy_source: >-
      The move-to-monthly charge is fixed only after the charge that opened the annual term carries a prorated-annual
      refund booked against it.
    condition: >-
      A membership_events row of type membership_fee_refunded with refund_type prorated_annual whose source_event_id
      is the fee charge whose billing_period_start equals memberships.current_period_start (the charge that opened
      the current annual term) stands on the membership.
    resolved_by: confirm_annual_term_early_end_0b7355fe
    effect: >-
      The refund of the opening charge is booked, so the value the member still holds in the annual term falls by
      that refund and the move credit is taken from what is left.
  - problem: membership_ext_carried_value_refund
    kind: value_input
    gate: value_held
    form: state
    policy_source: >-
      The move-to-monthly charge is not fixed until the fee charge captured most recently before the annual term
      began carries its own refund of the value it carried into the term.
    condition: >-
      A membership_events row of type membership_fee_refunded with refund_type prorated_annual whose source_event_id
      is the last fee charge captured before the current term's first day stands on the membership.
    resolved_by: refund_carried_term_value_822a3886
    effect: >-
      The carried-value refund is booked, so the value the member still holds in the annual term falls by that refund
      as well.
  cross_category:
  - category: rewards
    as: branch
    reads:
    - variant_name
    note: the move rate reads the member's Cartwise Rewards tier.
  - category: order
    as: history
    reads:
    - order_events.event_type
    - order_events.event_date
    note: the activity credit counts the member fee waivers booked on the member's orders in the last month.
  compute:
  - term_opening_charge: >-
      SUM('membership_events', 'amount_usd', event_type='membership_fee_charged', billing_period_start=F('current_period_start'))
  - value_held: >-
      term_opening_charge + (P('period_fee_usd') - term_opening_charge) - SUM('membership_events', 'amount_usd',
      within_months=1, event_type='membership_fee_refunded', refund_type='prorated_annual')
  - move_enrolled_months: MONTHS(F('enrolled_date'), NOW)
  - move_switch_age: MONTHS(F('plan_switched_date'), NOW)
  - value_run: >-
      P('period_fee_usd') * int(DAYS(F('current_period_start'), NOW) / K('weeks_days')) * K('weeks_days') / DAYS(F('current_period_start'),
      F('current_period_end')) if (move_enrolled_months >= K('long_member_months') and move_switch_age < K('recent_switch_months'))
      else (P('period_fee_usd') * (MONTHS(F('current_period_start'), NOW) + 1) / K('months_per_term') if (move_enrolled_months
      >= K('long_member_months') and move_switch_age >= K('recent_switch_months')) else P('period_fee_usd') * DAYS(F('current_period_start'),
      NOW) / DAYS(F('current_period_start'), F('current_period_end')))
  - value_ahead: MX(0, RND(value_held - value_run, 2))
  - move_retry_captures: >-
      COUNT('membership_events', within_months=12, event_type='membership_fee_charged', fee_type='renewal_retry')
  - move_credit_share: >-
      K('credit_share_clean') if move_retry_captures == 0 else (K('credit_share_one_retry') if move_retry_captures
      == 1 else K('credit_share_standard'))
  - move_credit: RND(value_ahead * move_credit_share, 2)
  - move_tier: CFIELD('rewards', 'variant_name')
  - move_rate: >-
      K('move_rate_gold') if (move_tier == 'Cartwise Rewards Gold' or move_tier == 'Cartwise Rewards Platinum' or
      move_tier == 'Cartwise Rewards Diamond') else (K('move_rate_silver') if (move_tier == 'Cartwise Rewards Silver'
      or move_tier == 'Cartwise Rewards Bronze') else K('move_rate_standard'))
  - monthly_renewals: COUNT('membership_events', event_type='membership_fee_charged', fee_type='renewal')
  - welcome_back: >-
      K('welcome_long') if monthly_renewals >= K('monthly_history_long') else (K('welcome_mid') if monthly_renewals
      >= K('monthly_history_mid') else K('welcome_none'))
  - month_waiver_count: XCOUNT('order', 'order_events', within_months=1, event_type='order_fee_waived')
  - activity_credit: >-
      K('activity_credit_two') if month_waiver_count >= 2 else (K('activity_credit_one') if month_waiver_count ==
      1 else K('activity_credit_none'))
  - result: MX(0, RND(K('monthly_plan_fee_usd') * move_rate - move_credit - welcome_back - activity_credit, 2))
  compute_basis:
    term_opening_charge: >-
      The value the member still holds in the annual term is the plan-switch charge that opened the term plus the
      value carried into it (the annual plan's period_fee_usd less that plan-switch charge), less every prorated-annual
      refund booked on the membership in the last month.
    value_held: >-
      The value the member still holds in the annual term is the plan-switch charge that opened the term plus the
      value carried into it (the annual plan's period_fee_usd less that plan-switch charge), less every prorated-annual
      refund booked on the membership in the last month.
    move_enrolled_months: >-
      A member whose enrollment date is at least long_member_months months back and whose plan switch into the annual
      term took effect fewer than recent_switch_months whole months ago has it counted in whole weeks: the annual
      plan's period_fee_usd times the whole weeks run times weeks_days, divided by the days in the term.
    move_switch_age: >-
      A member whose enrollment date is at least long_member_months months back and whose plan switch into the annual
      term took effect recent_switch_months or more whole months ago has it counted in months started: the annual
      plan's period_fee_usd times the months of the term started, the month in progress included, divided by months_per_term.
    value_run: >-
      The value of the annual term already run is measured by one of three methods. A member whose enrollment date
      is at least long_member_months months back and whose plan switch into the annual term took effect fewer than
      recent_switch_months whole months ago has it counted in whole weeks: the annual plan's period_fee_usd times
      the whole weeks run times weeks_days, divided by the days in the term. A member whose enrollment date is at
      least long_member_months months back and whose plan switch into the annual term took effect recent_switch_months
      or more whole months ago has it counted in months started: the annual plan's period_fee_usd times the months
      of the term started, the month in progress included, divided by months_per_term. Any other member has it counted
      in calendar days, as in the standard method.
    value_ahead: >-
      The value held ahead of today is the value held less the value already run, rounded to the cent and never
      below zero, and the move credit is credit_share_standard of it, rounded to the cent.
    move_retry_captures: >-
      The move credit share follows the membership's late payments over the last twelve months: credit_share_clean
      with no retry capture, credit_share_one_retry with exactly one retry capture, and credit_share_standard otherwise.
    move_credit_share: >-
      The move credit share follows the membership's late payments over the last twelve months: credit_share_clean
      with no retry capture, credit_share_one_retry with exactly one retry capture, and credit_share_standard otherwise.
    move_credit: >-
      The value held ahead of today is the value held less the value already run, rounded to the cent and never
      below zero, and the move credit is credit_share_standard of it, rounded to the cent.
    move_tier: >-
      The move rate follows the member's Cartwise Rewards tier: move_rate_gold at Gold, Platinum or Diamond, move_rate_silver
      at Silver or Bronze, and move_rate_standard at any other tier or with no rewards account.
    move_rate: >-
      The move rate follows the member's Cartwise Rewards tier: move_rate_gold at Gold, Platinum or Diamond, move_rate_silver
      at Silver or Bronze, and move_rate_standard at any other tier or with no rewards account.
    monthly_renewals: >-
      A welcome-back amount is taken off the move-to-monthly charge for members who were on a monthly plan before:
      a membership with at least monthly_history_long renewal charges on record takes off welcome_long, one with
      at least monthly_history_mid and fewer than monthly_history_long takes off welcome_mid, and any other takes
      off welcome_none.
    welcome_back: >-
      A welcome-back amount is taken off the move-to-monthly charge for members who were on a monthly plan before:
      a membership with at least monthly_history_long renewal charges on record takes off welcome_long, one with
      at least monthly_history_mid and fewer than monthly_history_long takes off welcome_mid, and any other takes
      off welcome_none.
    month_waiver_count: >-
      An activity credit is taken off as well for members who shopped with their benefits in the last month: at
      least two member fee waivers on orders in the last month takes off activity_credit_two, exactly one takes
      off activity_credit_one, and none takes off activity_credit_none.
    activity_credit: >-
      An activity credit is taken off as well for members who shopped with their benefits in the last month: at
      least two member fee waivers on orders in the last month takes off activity_credit_two, exactly one takes
      off activity_credit_one, and none takes off activity_credit_none.
    result: >-
      The move-to-monthly charge is Cartwise+ Monthly's period fee of monthly_plan_fee_usd times the move rate of
      move_rate_standard, less the move credit, rounded to the cent and never below zero.
  factors:
  - id: term_run_value_method
    effect: method
    decides: value_run
    bindings:
    - move_enrolled_months
    - move_switch_age
    - value_run
    ladder:
    - when: >-
        enrollment date at least long_member_months months back AND plan switch into the annual term fewer than
        recent_switch_months whole months ago
      method: >-
        value already run counted in whole weeks of the term run, at the annual plan's period_fee_usd over the days
        in the term
    - when: >-
        enrollment date at least long_member_months months back AND plan switch into the annual term recent_switch_months
        or more whole months ago
      method: >-
        value already run counted in months of the term started, the month in progress included, over months_per_term
    - when: otherwise
      method: >-
        value already run counted in calendar days from the term's first day up to the day before today, over the
