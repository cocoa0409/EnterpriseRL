      the switch charged: when the plan switch took effect in the last month and the latest plan-switch charge is
      at least the plan's period_fee_usd, the allowance is reduced by the calendar days from today up to the day
      before the next renewal date; when the plan switch took effect in the last month and the latest plan-switch
      charge is below the plan's period_fee_usd, it is reduced by half of those days, rounded down to a whole day;
      otherwise it is not reduced.
    notice_days: >-
      Early notice adds a notice extension: a request made at least notice_long_days calendar days before the next
      renewal date adds notice_extension_long days, one made at least notice_mid_days and fewer than notice_long_days
      days before adds notice_extension_mid days, and any later request adds notice_extension_none.
    notice_extension: >-
      Early notice adds a notice extension: a request made at least notice_long_days calendar days before the next
      renewal date adds notice_extension_long days, one made at least notice_mid_days and fewer than notice_long_days
      days before adds notice_extension_mid days, and any later request adds notice_extension_none.
    result: >-
      The pause length is the standard allowance plus the tenure, rewards, spending and notice extensions, less
      the earlier-pause and fresh-period reductions, and never below the plan's pause_min_days.
  factors:
  - id: tenure_extension
    effect: parameter
    decides: tenure_extension
    bindings:
    - pause_enrolled_months
    - captures_on_record
    - tenure_extension
    ladder:
    - when: >-
        at least long_capture_count fee charges captured on record AND enrollment date at least long_member_months
        months back
      value: K('tenure_extension_long')
    - when: >-
        at least mid_capture_count fee charges captured AND enrollment date at least mid_member_months months back,
        without meeting the first tier
      value: K('tenure_extension_mid')
    - when: otherwise
      value: K('tenure_extension_none')
    baseline:
      tenure_extension: K('tenure_extension_none')
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: rewards_extension
    effect: parameter
    decides: rewards_extension
    bindings:
    - pause_tier
    - rewards_extension
    ladder:
    - when: Cartwise Rewards tier Gold, Platinum or Diamond
      value: K('rewards_extension_gold')
    - when: Cartwise Rewards tier Silver or Bronze
      value: K('rewards_extension_silver')
    - when: otherwise
      value: K('rewards_extension_none')
    baseline:
      rewards_extension: K('rewards_extension_none')
    evidence:
    - cross_category
    cross_difficulty: rewards
  - id: spending_extension
    effect: parameter
    decides: spend_extension
    bindings:
    - item_spend_3m
    - spend_extension
    ladder:
    - when: item charges on the member's orders in the last three months total at least spend_high_usd
      value: K('spend_extension_high')
    - when: they total at least spend_mid_usd and less than spend_high_usd
      value: K('spend_extension_mid')
    - when: otherwise
      value: K('spend_extension_none')
    baseline:
      spend_extension: K('spend_extension_none')
    evidence:
    - cross_category
    - history
    cross_difficulty: order
  - id: earlier_pause_reduction
    effect: method
    decides: earlier_pause_reduction
    bindings:
    - paused_days_12m
    - earlier_pause_count
    - earlier_pause_reduction
    ladder:
    - when: pauses logged in the last twelve months total at least booked_pause_threshold_days days
      method: the allowance is reduced by the whole booked length of those pauses, in days
    - when: >-
        pauses logged in the last twelve months total at least one and fewer than booked_pause_threshold_days days
      method: >-
        each of those pauses counts as a flat pause_min_days days whatever its length: the allowance is reduced
        by their number times pause_min_days
    - when: otherwise
      method: earlier pauses are not counted and the allowance is not reduced
    baseline:
      earlier_pause_reduction: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: fresh_period_reduction
    effect: parameter
    decides: fresh_period_reduction
    bindings:
    - switched_last_month
    - latest_switch_charge
    - fresh_period_reduction
    ladder:
    - when: >-
        plan switch took effect in the last month AND latest plan-switch charge at least the plan's period_fee_usd
      value: >-
        a reduction share of the whole: all calendar days from today up to the day before the next renewal date
    - when: >-
        plan switch took effect in the last month AND latest plan-switch charge below the plan's period_fee_usd
      value: a reduction share of one half of those days, rounded down to a whole day
    - when: otherwise
      value: a reduction share of zero
    baseline:
      fresh_period_reduction: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: notice_extension
    effect: parameter
    decides: notice_extension
    bindings:
    - notice_days
    - notice_extension
    ladder:
    - when: request made at least notice_long_days calendar days before the next renewal date
      value: K('notice_extension_long')
    - when: request made at least notice_mid_days and fewer than notice_long_days days before
      value: K('notice_extension_mid')
    - when: otherwise
      value: K('notice_extension_none')
    baseline:
      notice_extension: K('notice_extension_none')
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The standard pause allowance is the plan's pause_max_days, counted in calendar days with the next renewal
      date as the first paused day.
    params:
    - pause_max_days
    - pause_min_days
  inputs:
    history:
    - table: membership_events
      aggregate: count
      field: membership_event_id
      filters:
        event_type: membership_fee_charged
    - table: membership_events
      aggregate: sum
      field: quantity
      within_months: 12
      filters:
        event_type: membership_pause_logged
    - category: order
      table: order_events
      aggregate: sum
      field: amount_usd
      within_months: 3
      filters:
        event_type: order_item_charged
    cross_category:
    - rewards
    - order
- id: membership_ext_past_due_settlement
  base_policy_refs:
  - membership_evt_failed_payment
  - membership_evt_fee_billing
  overwrite:
  - base_policy: membership_evt_fee_billing
    superseded_clause: Every paid period is billed once, on its first day, at the plan's period_fee_usd
    replaced_by: >-
      When a member settles a past-due period in person with their card, the amount captured for the period being
      billed is the past-due settlement worked out below rather than the plan's full period fee.
  trigger: on_request
  subject:
  - membership_reinstated
  computes: amount_usd
  target_tool: settle_past_due_membership_fee_b438dc6f
  params:
    week_days: 7
    long_capture_count: 24
    courtesy_rate_long: 0.9
    courtesy_rate_short: 0.95
    courtesy_rate_standard: 1.0
    partner_credit_gold: 0.5
    partner_credit_silver: 0.25
    partner_credit_none: 0.0
    early_credit_proof_plan: 0.3
    early_credit_other_plan: 0.15
    early_credit_none: 0.0
  rule: >
    When a member settles a past-due period in person with their card, the amount captured for the period being
    billed is the past-due settlement worked out below rather than the plan's full period fee. The capture is booked
    as a retry of the period fee for the period that was being billed, it reinstates the membership, and the period
    dates do not move. The standard past-due settlement is the plan's period_fee_usd for the period being billed,
    rounded to the cent. The share of the period fee that is settled is set by one of three methods. On a plan whose
    order benefits stop while past due, when the membership has been past due for at least payment_retry_interval_days
    calendar days (counted from the past-due date up to the day before today), only the days of the period still
    ahead are settled: the period fee times the calendar days from today up to the day before the renewal date,
    divided by the days in the period. On a plan whose order benefits stop while past due, when the membership has
    been past due for fewer days than that, the whole weeks of benefits withheld are taken off: the period fee times
    the days in the period less the whole weeks past due times week_days, divided by the days in the period. On
    a plan whose order benefits keep applying while past due, the whole period fee is settled. A courtesy rate is
    applied to the settled share for members whose card has not failed before: a membership with no retry capture
    in the last twelve months and at least long_capture_count fee charges captured on record settles at courtesy_rate_long,
    one with no retry capture in the last twelve months and fewer captures settles at courtesy_rate_short, and any
    other settles at courtesy_rate_standard. A partner credit follows the member's Cartwise Rewards tier: partner_credit_gold
    at Gold, Platinum or Diamond, partner_credit_silver at Silver or Bronze, and partner_credit_none at any other
    tier or with no rewards account. An early-settlement credit is given when the member settles before the automatic
    retries have run out, that is, within payment_retry_attempts times payment_retry_interval_days calendar days
    of the past-due date: on a plan that requires eligibility proof it is early_credit_proof_plan, on any other
    plan early_credit_other_plan, and a later settlement gets early_credit_none. The past-due settlement is the
    period fee times the settled share times the courtesy rate, less the partner and early-settlement credits, rounded
    to the cent and never below zero. Every twelve-month window here is counted in whole months ending today, a
    row dated on the same day of the month twelve months back not counted.
  prerequisite: []
  cross_category:
  - category: rewards
    as: branch
    reads:
    - variant_name
    note: the partner credit reads the member's Cartwise Rewards tier.
  compute:
  - settle_period_fee: P('period_fee_usd')
  - days_past_due: DAYS(F('past_due_since'), NOW)
  - period_days: DAYS(F('current_period_start'), F('current_period_end'))
  - settled_share: >-
      DAYS(NOW, F('current_period_end')) / period_days if (P('benefits_during_past_due') == False and days_past_due
      >= P('payment_retry_interval_days')) else ((period_days - int(days_past_due / K('week_days')) * K('week_days'))
      / period_days if (P('benefits_during_past_due') == False and days_past_due < P('payment_retry_interval_days'))
      else 1)
  - settle_retry_captures: >-
      COUNT('membership_events', within_months=12, event_type='membership_fee_charged', fee_type='renewal_retry')
  - settle_captures_on_record: COUNT('membership_events', event_type='membership_fee_charged')
  - courtesy_rate: >-
      K('courtesy_rate_long') if (settle_retry_captures == 0 and settle_captures_on_record >= K('long_capture_count'))
      else (K('courtesy_rate_short') if (settle_retry_captures == 0 and settle_captures_on_record < K('long_capture_count'))
      else K('courtesy_rate_standard'))
  - settle_tier: CFIELD('rewards', 'variant_name')
  - partner_credit: >-
      K('partner_credit_gold') if (settle_tier == 'Cartwise Rewards Gold' or settle_tier == 'Cartwise Rewards Platinum'
      or settle_tier == 'Cartwise Rewards Diamond') else (K('partner_credit_silver') if (settle_tier == 'Cartwise
      Rewards Silver' or settle_tier == 'Cartwise Rewards Bronze') else K('partner_credit_none'))
  - early_credit: >-
      K('early_credit_proof_plan') if (DAYS(F('past_due_since'), NOW) <= P('payment_retry_attempts') * P('payment_retry_interval_days')
      and P('eligibility_reverification_months') > 0) else (K('early_credit_other_plan') if (DAYS(F('past_due_since'),
      NOW) <= P('payment_retry_attempts') * P('payment_retry_interval_days') and P('eligibility_reverification_months')
      == 0) else K('early_credit_none'))
  - result: MX(0, RND(settle_period_fee * settled_share * courtesy_rate - partner_credit - early_credit, 2))
  compute_basis:
    settle_period_fee: >-
      The standard past-due settlement is the plan's period_fee_usd for the period being billed, rounded to the
      cent.
    days_past_due: >-
      On a plan whose order benefits stop while past due, when the membership has been past due for at least payment_retry_interval_days
      calendar days (counted from the past-due date up to the day before today), only the days of the period still
      ahead are settled: the period fee times the calendar days from today up to the day before the renewal date,
      divided by the days in the period.
    period_days: >-
      On a plan whose order benefits stop while past due, when the membership has been past due for fewer days than
      that, the whole weeks of benefits withheld are taken off: the period fee times the days in the period less
      the whole weeks past due times week_days, divided by the days in the period.
    settled_share: >-
      The share of the period fee that is settled is set by one of three methods. On a plan whose order benefits
      stop while past due, when the membership has been past due for at least payment_retry_interval_days calendar
      days (counted from the past-due date up to the day before today), only the days of the period still ahead
      are settled: the period fee times the calendar days from today up to the day before the renewal date, divided
      by the days in the period. On a plan whose order benefits stop while past due, when the membership has been
      past due for fewer days than that, the whole weeks of benefits withheld are taken off: the period fee times
      the days in the period less the whole weeks past due times week_days, divided by the days in the period. On
      a plan whose order benefits keep applying while past due, the whole period fee is settled.
    settle_retry_captures: >-
      A courtesy rate is applied to the settled share for members whose card has not failed before: a membership
      with no retry capture in the last twelve months and at least long_capture_count fee charges captured on record
      settles at courtesy_rate_long, one with no retry capture in the last twelve months and fewer captures settles
      at courtesy_rate_short, and any other settles at courtesy_rate_standard.
    settle_captures_on_record: >-
      A courtesy rate is applied to the settled share for members whose card has not failed before: a membership
      with no retry capture in the last twelve months and at least long_capture_count fee charges captured on record
      settles at courtesy_rate_long, one with no retry capture in the last twelve months and fewer captures settles
      at courtesy_rate_short, and any other settles at courtesy_rate_standard.
    courtesy_rate: >-
      A courtesy rate is applied to the settled share for members whose card has not failed before: a membership
      with no retry capture in the last twelve months and at least long_capture_count fee charges captured on record
      settles at courtesy_rate_long, one with no retry capture in the last twelve months and fewer captures settles
      at courtesy_rate_short, and any other settles at courtesy_rate_standard.
    settle_tier: >-
      A partner credit follows the member's Cartwise Rewards tier: partner_credit_gold at Gold, Platinum or Diamond,
      partner_credit_silver at Silver or Bronze, and partner_credit_none at any other tier or with no rewards account.
    partner_credit: >-
      A partner credit follows the member's Cartwise Rewards tier: partner_credit_gold at Gold, Platinum or Diamond,
      partner_credit_silver at Silver or Bronze, and partner_credit_none at any other tier or with no rewards account.
    early_credit: >-
      An early-settlement credit is given when the member settles before the automatic retries have run out, that
      is, within payment_retry_attempts times payment_retry_interval_days calendar days of the past-due date: on
      a plan that requires eligibility proof it is early_credit_proof_plan, on any other plan early_credit_other_plan,
      and a later settlement gets early_credit_none.
    result: >-
      The past-due settlement is the period fee times the settled share times the courtesy rate, less the partner
      and early-settlement credits, rounded to the cent and never below zero.
  factors:
  - id: settled_share_method
    effect: method
    decides: settled_share
    bindings:
    - days_past_due
    - settled_share
    ladder:
    - when: >-
        plan whose order benefits stop while past due AND past due for at least payment_retry_interval_days days
      method: >-
        only the days of the period still ahead are settled: period fee times the days from today up to the day
        before the renewal date over the days in the period
    - when: >-
        plan whose order benefits stop while past due AND past due for fewer than payment_retry_interval_days days
      method: >-
        the whole weeks past due are taken off: period fee times (days in the period less whole weeks past due times
        week_days) over the days in the period
    - when: otherwise (order benefits keep applying while past due)
      method: the whole period fee is settled
    baseline:
      settled_share: '1'
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: courtesy_rate
    effect: parameter
    decides: courtesy_rate
    bindings:
    - settle_retry_captures
    - settle_captures_on_record
    - courtesy_rate
    ladder:
    - when: >-
        no retry capture in the last twelve months AND at least long_capture_count fee charges captured on record
      value: K('courtesy_rate_long')
    - when: no retry capture in the last twelve months AND fewer than long_capture_count fee charges captured
      value: K('courtesy_rate_short')
    - when: otherwise
      value: K('courtesy_rate_standard')
    baseline:
      courtesy_rate: K('courtesy_rate_standard')
    evidence:
    - history
    cross_difficulty: null
  - id: partner_credit
    effect: parameter
    decides: partner_credit
    bindings:
    - settle_tier
    - partner_credit
    ladder:
    - when: Cartwise Rewards tier Gold, Platinum or Diamond
      value: K('partner_credit_gold')
    - when: Cartwise Rewards tier Silver or Bronze
      value: K('partner_credit_silver')
    - when: otherwise
      value: K('partner_credit_none')
    baseline:
      partner_credit: K('partner_credit_none')
    evidence:
    - cross_category
    cross_difficulty: rewards
  - id: early_settlement_credit
    effect: parameter
    decides: early_credit
    bindings:
    - early_credit
    ladder:
    - when: >-
        settled within payment_retry_attempts times payment_retry_interval_days days of the past-due date AND a
        plan that requires eligibility proof
      value: K('early_credit_proof_plan')
    - when: settled within that time AND a plan that requires no eligibility proof
      value: K('early_credit_other_plan')
    - when: otherwise
      value: K('early_credit_none')
    baseline:
      early_credit: K('early_credit_none')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  baseline:
    rule: >-
      The standard past-due settlement is the plan's period_fee_usd for the period being billed, rounded to the
      cent.
    params:
    - period_fee_usd
  inputs:
    history:
    - table: membership_events
      aggregate: count
      field: membership_event_id
      within_months: 12
      filters:
        event_type: membership_fee_charged
        fee_type: renewal_retry
    - table: membership_events
      aggregate: count
      field: membership_event_id
      filters:
        event_type: membership_fee_charged
    cross_category:
    - rewards
- id: membership_ext_annual_upgrade_charge
  base_policy_refs:
  - membership_evt_plan_switch
  - membership_evt_fee_billing
  overwrite:
  - base_policy: membership_evt_plan_switch
    superseded_clause: >-
      the unused days of the current period are credited under switch_proration_basis unused_days at the old plan's
      daily rate (membership_msr_current_period_charge divided by membership_msr_days_in_period, times membership_msr_unused_days)
      against the new plan's first fee, a new period starts on the switch date, and the plan_switch charge is the
      new period_fee_usd minus that credit, rounded to the cent and never below zero.
    replaced_by: >-
      A member on a monthly plan who moves up to Cartwise+ Annual pays the upgrade charge worked out below, and
      a new twelve-month period starts on the switch date.
  - base_policy: membership_evt_fee_billing
    superseded_clause: Every paid period is billed once, on its first day, at the plan's period_fee_usd
    replaced_by: >-
      The new annual period is billed on its first day at the upgrade charge worked out below rather than at Cartwise+
      Annual's full period fee.
  trigger: on_request
  subject:
  - membership_plan_switched
  computes: amount_usd
  target_tool: upgrade_membership_plan_10b03fa3
  params:
    annual_plan_fee_usd: 99.0
    week_days: 7
    graduation_capture_long: 36
    graduation_capture_mid: 12
    graduation_rate_long: 0.8
    graduation_rate_mid: 0.9
    graduation_rate_standard: 1.0
    rewards_offer_gold: 10.0
    rewards_offer_silver: 5.0
    rewards_offer_none: 0.0
    shopper_spend_high_usd: 150.0
    shopper_spend_mid_usd: 75.0
    shopper_offer_high: 3.0
    shopper_offer_mid: 1.5
    shopper_offer_none: 0.0
    proof_age_months: 11
    reverification_offer_due: 2.0
    reverification_offer_recent: 1.0
    reverification_offer_none: 0.0
    anniversary_long_months: 36
    anniversary_mid_months: 24
    anniversary_offer_long: 1.0
    anniversary_offer_mid: 0.5
    anniversary_offer_none: 0.0
  rule: >-
    A member on a monthly plan who moves up to Cartwise+ Annual pays the upgrade charge worked out below, and a
    new twelve-month period starts on the switch date. The new annual period is billed on its first day at the upgrade
    charge worked out below rather than at Cartwise+ Annual's full period fee. The upgrade charge on a past-due
    membership is fixed only after the period being billed shows a captured retry fee and the membership no longer
    carries a past-due date. The standard upgrade charge is Cartwise+ Annual's period fee of annual_plan_fee_usd
    less the upgrade credit, rounded to the cent and never below zero. The upgrade credit is the fee captured for
    the current monthly period (every fee charge whose billing period start is the current period's first day) times
    the calendar days from today up to the day before the renewal date, divided by the days in the period, rounded
    to the cent. The upgrade credit is measured by one of three methods. When the current period's fee was captured
    as a retry for less than the plan's period_fee_usd, the whole fee captured for the period is credited, because
    the retry already settled only part of the period. When the current period's fee was captured as a retry for
    the plan's period_fee_usd or more, the fee captured is credited for the whole weeks of the period still ahead:
    the fee times the whole weeks from today up to the renewal date times week_days, divided by the days in the
    period. Any other period is credited for the calendar days still ahead, as in the standard method. A graduation
    rate applies to the annual fee for members leaving the student plan: a Cartwise+ Student Monthly membership
    with at least graduation_capture_long fee charges captured on record pays graduation_rate_long of the fee, one
    with at least graduation_capture_mid and fewer than graduation_capture_long pays graduation_rate_mid, and any
    other membership pays graduation_rate_standard. A rewards offer follows the member's Cartwise Rewards tier:
    rewards_offer_gold off at Gold, Platinum or Diamond, rewards_offer_silver off at Silver or Bronze, and rewards_offer_none
    at any other tier or with no rewards account. A shopper offer follows the item charges on the member's orders
    over the last three months: at least shopper_spend_high_usd takes shopper_offer_high off, at least shopper_spend_mid_usd
    and less than shopper_spend_high_usd takes shopper_offer_mid off, and less takes shopper_offer_none off. A re-verification
    offer is given to members on a plan that requires eligibility proof: when at least proof_age_months whole months
    have passed since the proof was last accepted it is reverification_offer_due, when fewer have passed it is reverification_offer_recent,
    and on a plan that requires no proof it is reverification_offer_none. An anniversary offer follows the enrollment
    date: at least anniversary_long_months months back takes anniversary_offer_long off, at least anniversary_mid_months
    and fewer than anniversary_long_months takes anniversary_offer_mid off, and fewer takes anniversary_offer_none
    off. The upgrade charge is the annual fee times the graduation rate, less the upgrade credit and the rewards,
    shopper, re-verification and anniversary offers, rounded to the cent and never below zero. Every three-month
    window here is counted in whole months ending today, a row dated on the same day of the month three months back
    not counted.
  prerequisite:
  - problem: membership_ext_past_due_settlement
    kind: value_input
    gate: period_kept_fee
    form: state
    policy_source: >-
      The upgrade charge on a past-due membership is fixed only after the period being billed shows a captured retry
      fee and the membership no longer carries a past-due date.
    condition: >-
      A membership_fee_charged row with fee_type renewal_retry and billing_period_start equal to memberships.current_period_start
      stands on the membership and memberships.past_due_since is empty.
    resolved_by: settle_past_due_membership_fee_b438dc6f
    effect: >-
      The retry capture exists, so the fee captured for the current period becomes the settled amount and the upgrade
      credit is taken from it; the membership is active, as the plan switch requires.
  cross_category:
  - category: rewards
    as: branch
    reads:
    - variant_name
    note: the rewards offer reads the member's Cartwise Rewards tier.
  - category: order
    as: history
    reads:
    - order_events.event_type
    - order_events.amount_usd
    - order_events.event_date
    note: the shopper offer sums the item charges on the member's orders over the last three months.
  compute:
  - period_kept_fee: >-
      SUM('membership_events', 'amount_usd', event_type='membership_fee_charged', billing_period_start=F('current_period_start'))
  - upgrade_period_days: DAYS(F('current_period_start'), F('current_period_end'))
  - period_retry_captures: >-
      COUNT('membership_events', event_type='membership_fee_charged', fee_type='renewal_retry', billing_period_start=F('current_period_start'))
  - credit_share: >-
      1 if (period_retry_captures >= 1 and period_kept_fee < P('period_fee_usd')) else (int(DAYS(NOW, F('current_period_end'))
      / K('week_days')) * K('week_days') / upgrade_period_days if (period_retry_captures >= 1 and period_kept_fee
      >= P('period_fee_usd')) else DAYS(NOW, F('current_period_end')) / upgrade_period_days)
  - upgrade_credit: RND(period_kept_fee * credit_share, 2)
  - upgrade_captures: COUNT('membership_events', event_type='membership_fee_charged')
  - graduation_rate: >-
      K('graduation_rate_long') if (F('variant_name') == 'Cartwise+ Student Monthly' and upgrade_captures >= K('graduation_capture_long'))
      else (K('graduation_rate_mid') if (F('variant_name') == 'Cartwise+ Student Monthly' and upgrade_captures >=
      K('graduation_capture_mid') and upgrade_captures < K('graduation_capture_long')) else K('graduation_rate_standard'))
  - upgrade_tier: CFIELD('rewards', 'variant_name')
  - rewards_offer: >-
      K('rewards_offer_gold') if (upgrade_tier == 'Cartwise Rewards Gold' or upgrade_tier == 'Cartwise Rewards Platinum'
      or upgrade_tier == 'Cartwise Rewards Diamond') else (K('rewards_offer_silver') if (upgrade_tier == 'Cartwise
      Rewards Silver' or upgrade_tier == 'Cartwise Rewards Bronze') else K('rewards_offer_none'))
  - upgrade_spend_3m: XSUM('order', 'order_events', 'amount_usd', within_months=3, event_type='order_item_charged')
  - shopper_offer: >-
      K('shopper_offer_high') if upgrade_spend_3m >= K('shopper_spend_high_usd') else (K('shopper_offer_mid') if
      upgrade_spend_3m >= K('shopper_spend_mid_usd') else K('shopper_offer_none'))
  - reverification_offer: >-
      K('reverification_offer_due') if (P('eligibility_reverification_months') > 0 and MONTHS(F('eligibility_verified_date'),
      NOW) >= K('proof_age_months')) else (K('reverification_offer_recent') if (P('eligibility_reverification_months')
      > 0 and MONTHS(F('eligibility_verified_date'), NOW) < K('proof_age_months')) else K('reverification_offer_none'))
  - upgrade_enrolled_months: MONTHS(F('enrolled_date'), NOW)
  - anniversary_offer: >-
      K('anniversary_offer_long') if upgrade_enrolled_months >= K('anniversary_long_months') else (K('anniversary_offer_mid')
      if upgrade_enrolled_months >= K('anniversary_mid_months') else K('anniversary_offer_none'))
  - result: >-
      MX(0, RND(K('annual_plan_fee_usd') * graduation_rate - upgrade_credit - rewards_offer - shopper_offer - reverification_offer
      - anniversary_offer, 2))
  compute_basis:
    period_kept_fee: >-
      The upgrade credit is the fee captured for the current monthly period (every fee charge whose billing period
      start is the current period's first day) times the calendar days from today up to the day before the renewal
      date, divided by the days in the period, rounded to the cent.
    upgrade_period_days: >-
      The upgrade credit is the fee captured for the current monthly period (every fee charge whose billing period
      start is the current period's first day) times the calendar days from today up to the day before the renewal
      date, divided by the days in the period, rounded to the cent.
    period_retry_captures: >-
      When the current period's fee was captured as a retry for less than the plan's period_fee_usd, the whole fee
      captured for the period is credited, because the retry already settled only part of the period.
    credit_share: >-
      The upgrade credit is measured by one of three methods. When the current period's fee was captured as a retry
      for less than the plan's period_fee_usd, the whole fee captured for the period is credited, because the retry
      already settled only part of the period. When the current period's fee was captured as a retry for the plan's
      period_fee_usd or more, the fee captured is credited for the whole weeks of the period still ahead: the fee
      times the whole weeks from today up to the renewal date times week_days, divided by the days in the period.
      Any other period is credited for the calendar days still ahead, as in the standard method.
    upgrade_credit: >-
      The upgrade credit is the fee captured for the current monthly period (every fee charge whose billing period
      start is the current period's first day) times the calendar days from today up to the day before the renewal
      date, divided by the days in the period, rounded to the cent.
    upgrade_captures: >-
      A graduation rate applies to the annual fee for members leaving the student plan: a Cartwise+ Student Monthly
      membership with at least graduation_capture_long fee charges captured on record pays graduation_rate_long
      of the fee, one with at least graduation_capture_mid and fewer than graduation_capture_long pays graduation_rate_mid,
      and any other membership pays graduation_rate_standard.
    graduation_rate: >-
      A graduation rate applies to the annual fee for members leaving the student plan: a Cartwise+ Student Monthly
      membership with at least graduation_capture_long fee charges captured on record pays graduation_rate_long
      of the fee, one with at least graduation_capture_mid and fewer than graduation_capture_long pays graduation_rate_mid,
      and any other membership pays graduation_rate_standard.
    upgrade_tier: >-
      A rewards offer follows the member's Cartwise Rewards tier: rewards_offer_gold off at Gold, Platinum or Diamond,
      rewards_offer_silver off at Silver or Bronze, and rewards_offer_none at any other tier or with no rewards
      account.
    rewards_offer: >-
      A rewards offer follows the member's Cartwise Rewards tier: rewards_offer_gold off at Gold, Platinum or Diamond,
      rewards_offer_silver off at Silver or Bronze, and rewards_offer_none at any other tier or with no rewards
      account.
    upgrade_spend_3m: >-
      A shopper offer follows the item charges on the member's orders over the last three months: at least shopper_spend_high_usd
      takes shopper_offer_high off, at least shopper_spend_mid_usd and less than shopper_spend_high_usd takes shopper_offer_mid
      off, and less takes shopper_offer_none off.
    shopper_offer: >-
      A shopper offer follows the item charges on the member's orders over the last three months: at least shopper_spend_high_usd
      takes shopper_offer_high off, at least shopper_spend_mid_usd and less than shopper_spend_high_usd takes shopper_offer_mid
      off, and less takes shopper_offer_none off.
    reverification_offer: >-
      A re-verification offer is given to members on a plan that requires eligibility proof: when at least proof_age_months
      whole months have passed since the proof was last accepted it is reverification_offer_due, when fewer have
      passed it is reverification_offer_recent, and on a plan that requires no proof it is reverification_offer_none.
    upgrade_enrolled_months: >-
      An anniversary offer follows the enrollment date: at least anniversary_long_months months back takes anniversary_offer_long
      off, at least anniversary_mid_months and fewer than anniversary_long_months takes anniversary_offer_mid off,
      and fewer takes anniversary_offer_none off.
    anniversary_offer: >-
      An anniversary offer follows the enrollment date: at least anniversary_long_months months back takes anniversary_offer_long
      off, at least anniversary_mid_months and fewer than anniversary_long_months takes anniversary_offer_mid off,
      and fewer takes anniversary_offer_none off.
    result: >-
      The upgrade charge is the annual fee times the graduation rate, less the upgrade credit and the rewards, shopper,
      re-verification and anniversary offers, rounded to the cent and never below zero.
  factors:
  - id: upgrade_credit_method
    effect: method
    decides: credit_share
    bindings:
    - period_retry_captures
    - credit_share
    ladder:
    - when: current period's fee captured as a retry for less than the plan's period_fee_usd
      method: the whole fee captured for the period is credited
    - when: current period's fee captured as a retry for the plan's period_fee_usd or more
      method: >-
        the fee captured is credited for the whole weeks still ahead times week_days over the days in the period
    - when: otherwise
      method: the fee captured is credited for the calendar days still ahead over the days in the period
    baseline:
      credit_share: DAYS(NOW, F('current_period_end')) / upgrade_period_days
    evidence:
    - history
    - tier_param
    - date
    cross_difficulty: null
  - id: graduation_rate
    effect: parameter
    decides: graduation_rate
    bindings:
    - upgrade_captures
    - graduation_rate
    ladder:
    - when: Cartwise+ Student Monthly AND at least graduation_capture_long fee charges captured on record
      value: K('graduation_rate_long')
    - when: >-
        Cartwise+ Student Monthly AND at least graduation_capture_mid and fewer than graduation_capture_long fee
        charges captured
      value: K('graduation_rate_mid')
    - when: otherwise
      value: K('graduation_rate_standard')
    baseline:
      graduation_rate: K('graduation_rate_standard')
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: rewards_offer
    effect: parameter
    decides: rewards_offer
    bindings:
    - upgrade_tier
    - rewards_offer
    ladder:
    - when: Cartwise Rewards tier Gold, Platinum or Diamond
      value: K('rewards_offer_gold')
    - when: Cartwise Rewards tier Silver or Bronze
      value: K('rewards_offer_silver')
    - when: otherwise
      value: K('rewards_offer_none')
    baseline:
      rewards_offer: K('rewards_offer_none')
    evidence:
    - cross_category
    cross_difficulty: rewards
  - id: shopper_offer
    effect: parameter
    decides: shopper_offer
    bindings:
    - upgrade_spend_3m
    - shopper_offer
    ladder:
    - when: item charges on the member's orders in the last three months total at least shopper_spend_high_usd
      value: K('shopper_offer_high')
    - when: they total at least shopper_spend_mid_usd and less than shopper_spend_high_usd
      value: K('shopper_offer_mid')
    - when: otherwise
      value: K('shopper_offer_none')
    baseline:
      shopper_offer: K('shopper_offer_none')
    evidence:
    - cross_category
    - history
    cross_difficulty: order
  - id: reverification_offer
    effect: parameter
    decides: reverification_offer
    bindings:
    - reverification_offer
    ladder:
    - when: >-
        plan that requires eligibility proof AND at least proof_age_months whole months since the proof was last
        accepted
      value: K('reverification_offer_due')
    - when: plan that requires eligibility proof AND fewer than proof_age_months whole months since
      value: K('reverification_offer_recent')
    - when: otherwise
      value: K('reverification_offer_none')
    baseline:
      reverification_offer: K('reverification_offer_none')
    evidence:
    - date
    - tier_param
    cross_difficulty: null
  - id: anniversary_offer
    effect: parameter
    decides: anniversary_offer
    bindings:
    - upgrade_enrolled_months
    - anniversary_offer
    ladder:
    - when: enrollment date at least anniversary_long_months months back
      value: K('anniversary_offer_long')
    - when: at least anniversary_mid_months and fewer than anniversary_long_months months back
      value: K('anniversary_offer_mid')
    - when: otherwise
      value: K('anniversary_offer_none')
    baseline:
      anniversary_offer: K('anniversary_offer_none')
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The standard upgrade charge is Cartwise+ Annual's period fee of annual_plan_fee_usd less the upgrade credit,
      rounded to the cent and never below zero. The upgrade credit is the fee captured for the current monthly period
      (every fee charge whose billing period start is the current period's first day) times the calendar days from
      today up to the day before the renewal date, divided by the days in the period, rounded to the cent.
    params:
    - annual_plan_fee_usd
  inputs:
    history:
    - table: membership_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: membership_fee_charged
    - table: membership_events
      aggregate: count
      field: membership_event_id
      filters:
        event_type: membership_fee_charged
    - category: order
      table: order_events
      aggregate: sum
      field: amount_usd
      within_months: 3
      filters:
        event_type: order_item_charged
    cross_category:
    - rewards
    - order
