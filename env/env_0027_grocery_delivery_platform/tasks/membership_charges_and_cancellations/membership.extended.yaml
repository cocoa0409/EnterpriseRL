- id: membership_ext_pause_length
  base_policy_refs:
  - membership_evt_pause
  overwrite:
  - base_policy: membership_evt_pause
    superseded_clause: >-
      A pause starts on the next renewal date and lasts between pause_min_days and pause_max_days calendar days.
    replaced_by: >-
      A pause starts on the next renewal date and, when the member asks for the longest pause available, runs for
      the pause allowance worked out below, which may be longer than the plan's pause_max_days.
  trigger: on_request
  subject:
  - membership_paused
  computes: pause_days
  target_tool: book_membership_pause_b6aef13b
  params:
    long_member_months: 18
    mid_member_months: 12
    long_capture_count: 18
    mid_capture_count: 12
    tenure_extension_long: 28
    tenure_extension_mid: 14
    tenure_extension_none: 0
    rewards_extension_gold: 10
    rewards_extension_silver: 5
    rewards_extension_none: 0
    spend_high_usd: 200.0
    spend_mid_usd: 100.0
    spend_extension_high: 7
    spend_extension_mid: 3
    spend_extension_none: 0
    booked_pause_threshold_days: 30
    notice_long_days: 28
    notice_mid_days: 14
    notice_extension_long: 7
    notice_extension_mid: 3
    notice_extension_none: 0
  rule: >-
    A pause starts on the next renewal date and, when the member asks for the longest pause available, runs for
    the pause allowance worked out below, which may be longer than the plan's pause_max_days. The pause length for
    a member who asked for a pause while on Cartwise+ Annual is not fixed until the membership shows Cartwise+ Monthly
    as its plan, with a plan-switch charge captured on the day its current period began. The booked length is recorded
    on the membership and in its pause history. The standard pause allowance is the plan's pause_max_days, counted
    in calendar days with the next renewal date as the first paused day. Long-standing members get a tenure extension
    added to the allowance: a membership with at least long_capture_count fee charges captured on record and an
    enrollment date at least long_member_months months back gets tenure_extension_long days, one with at least mid_capture_count
    fee charges captured and an enrollment date at least mid_member_months months back gets tenure_extension_mid
    days, and any other gets tenure_extension_none. The member's Cartwise Rewards tier adds a rewards extension:
    rewards_extension_gold days at Gold, Platinum or Diamond, rewards_extension_silver days at Silver or Bronze,
    and rewards_extension_none at any other tier or with no rewards account. Regular shoppers get a spending extension:
    item charges on the member's orders in the last three months totalling at least spend_high_usd add spend_extension_high
    days, at least spend_mid_usd and less than spend_high_usd add spend_extension_mid days, and less add spend_extension_none.
    Earlier pauses share the allowance over the year, and how they are counted is set by their booked length: when
    the pauses logged in the last twelve months (by first paused day) total at least booked_pause_threshold_days
    days, the allowance is reduced by their whole booked length in days; when they total fewer days but at least
    one day, each of those pauses is counted as a flat pause_min_days days whatever its booked length, and the allowance
    is reduced by the number of those pauses times pause_min_days; with no pause logged in that time it is not reduced.
    A member who has just switched plans already holds a fresh paid period, and how its days count is set by what
    the switch charged: when the plan switch took effect in the last month and the latest plan-switch charge is
    at least the plan's period_fee_usd, the allowance is reduced by the calendar days from today up to the day before
    the next renewal date; when the plan switch took effect in the last month and the latest plan-switch charge
    is below the plan's period_fee_usd, it is reduced by half of those days, rounded down to a whole day; otherwise
    it is not reduced. Early notice adds a notice extension: a request made at least notice_long_days calendar days
    before the next renewal date adds notice_extension_long days, one made at least notice_mid_days and fewer than
    notice_long_days days before adds notice_extension_mid days, and any later request adds notice_extension_none.
    The pause length is the standard allowance plus the tenure, rewards, spending and notice extensions, less the
    earlier-pause and fresh-period reductions, and never below the plan's pause_min_days. Every window here is counted
    in whole months ending today, a row dated on the same day of the month that many months back not counted.
  prerequisite:
  - problem: membership_ext_move_to_monthly_charge
    kind: value_input
    gate: plan_allowance
    form: state
    policy_source: >-
      The pause length for a member who asked for a pause while on Cartwise+ Annual is not fixed until the membership
