  - pause_enrolled_months: MONTHS(F('enrolled_date'), NOW)
  - captures_on_record: COUNT('membership_events', event_type='membership_fee_charged')
  - tenure_extension: >-
      K('tenure_extension_long') if (captures_on_record >= K('long_capture_count') and pause_enrolled_months >=
      K('long_member_months')) else (K('tenure_extension_mid') if (captures_on_record >= K('mid_capture_count')
      and pause_enrolled_months >= K('mid_member_months')) else K('tenure_extension_none'))
  - pause_tier: CFIELD('rewards', 'variant_name')
  - rewards_extension: >-
      K('rewards_extension_gold') if (pause_tier == 'Cartwise Rewards Gold' or pause_tier == 'Cartwise Rewards Platinum'
      or pause_tier == 'Cartwise Rewards Diamond') else (K('rewards_extension_silver') if (pause_tier == 'Cartwise
      Rewards Silver' or pause_tier == 'Cartwise Rewards Bronze') else K('rewards_extension_none'))
  - item_spend_3m: XSUM('order', 'order_events', 'amount_usd', within_months=3, event_type='order_item_charged')
  - spend_extension: >-
      K('spend_extension_high') if item_spend_3m >= K('spend_high_usd') else (K('spend_extension_mid') if item_spend_3m
      >= K('spend_mid_usd') else K('spend_extension_none'))
  - paused_days_12m: >-
      SUM('membership_events', 'quantity', within_months=12, date_field='billing_period_start', event_type='membership_pause_logged')
  - earlier_pause_count: >-
