    cross_difficulty: order
  baseline:
    rule: >-
      The standard move-to-monthly charge is worked out as follows. The value the member still holds in the annual
      term is the plan-switch charge that opened the term plus the value carried into it (the annual plan's period_fee_usd
      less that plan-switch charge), less every prorated-annual refund booked on the membership in the last month.
      The value of the annual term already run is the annual plan's period_fee_usd times the calendar days from
      the term's first day up to the day before today, divided by the days in the term. The value held ahead of
      today is the value held less the value already run, rounded to the cent and never below zero, and the move
      credit is credit_share_standard of it, rounded to the cent. The move-to-monthly charge is Cartwise+ Monthly's
      period fee of monthly_plan_fee_usd times the move rate of move_rate_standard, less the move credit, rounded
      to the cent and never below zero.
    params:
