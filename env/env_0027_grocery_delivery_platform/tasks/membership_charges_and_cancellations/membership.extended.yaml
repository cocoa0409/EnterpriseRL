      else 0)
  - notice_days: DAYS(NOW, F('current_period_end'))
  - notice_extension: >-
      K('notice_extension_long') if notice_days >= K('notice_long_days') else (K('notice_extension_mid') if notice_days
      >= K('notice_mid_days') else K('notice_extension_none'))
  - result: >-
      int(MX(P('pause_min_days'), plan_allowance + tenure_extension + rewards_extension + spend_extension + notice_extension
      - earlier_pause_reduction - fresh_period_reduction))
