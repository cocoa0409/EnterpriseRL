- id: order_ext_substitution_price_protection
  base_policy_refs: [order_agg_refund_review, order_evt_substitutions, order_evt_item_refunds, order_evt_weighted_items,
    order_evt_alcohol_and_returns]
  overwrite:
  - base_policy: order_evt_substitutions
    superseded_clause: >-
      The substituted line is billed at the replacement's price, except that an auto_best_match replacement whose
      unit price exceeds the original's by more than substitution_price_cap_pct is billed at the original unit price
      times the billed quantity; if it was billed higher, the excess is refunded with refund_reason substitution_price_protection.
    replaced_by: >-
      When the shopper chose the replacement without the customer's approval (auto_best_match) and its unit price
      exceeds the original unit price by more than substitution_price_cap_pct of the order's service level, the
      price-protection refund this rule computes is booked on that line with refund_reason substitution_price_protection;
      a customer-approved replacement is never price-protected.
  trigger: state_due
  subject: [order_item_refunded]
  computes: amount_usd
  target_tool: refund_substitution_overcharge_0e292d66
  params:
    tenure_long_months: 24
    tenure_mid_months: 12
    guarantee_high_mult: 2.0
    guarantee_mid_mult: 1.5
    guarantee_fee_count: 3
    allowance_two_days_usd: 1.00
    allowance_one_day_usd: 0.50
    uplift_large_pct: 10
    uplift_small_pct: 5
    large_order_usd: 125.0
    handling_perishable_usd: 0.50
    handling_shelf_usd: 0.25
  rule: >-
    The substituted line is billed at the replacement's price. When the shopper chose the replacement without the
    customer's approval (auto_best_match) and its unit price exceeds the original unit price by more than
    substitution_price_cap_pct of the order's service level, the price-protection refund this rule computes is
    booked on that line with refund_reason substitution_price_protection; a customer-approved replacement is never
    price-protected. The protected charge is the billed units times the protected unit price, rounded to the cent.
    The protected unit price is the original unit price times (1 + substitution_price_cap_pct of the order's service
    level / 100). The price-protection excess is the line's billed charge less the protected charge, never below
    zero. The price-protection refund is the price-protection excess, rounded to the cent. Months are counted by
    anniversary: between an earlier date and a later date as many whole months have passed as there are monthly
    anniversaries of the earlier date falling on or before the later date, so a period fee counts as charged within
    the last N whole calendar months when fewer than N such months have passed from its charge date to today, and a
    fee charged earlier in the current month is 0 months old. The protected unit price depends on the Cartwise+
    membership recorded on the order: when that membership is on an annual plan and was enrolled at least 24 whole
    calendar months before the order's placed date, the protected unit price is the original unit price itself; when
    it is on an annual plan and was enrolled at least 12 and fewer than 24 whole calendar months before, it is the
    average of the original unit price and the replacement's billed unit price; in every other case it is the
    original unit price times (1 + substitution_price_cap_pct / 100) as stated above. The price-protection guarantee
    multiplies the excess: when the customer's membership ledger shows at least 3 period fees charged within the
    last 36 whole calendar months, the excess is returned twice over; when it shows 1 or 2 such fees, the excess is
    returned one and a half times; otherwise the excess is returned once. The price-protection order uplift raises
    the refund after the guarantee: when the order already carries an item refund for a missing, damaged, wrong_item
    or quality issue and its item subtotal (the sum of its billed item lines) is at least 125.00, by 10 percent;
    when it carries such a refund and its item subtotal is below 125.00, by 5 percent; otherwise it is not raised.
    The price-protection standing allowance is added after rounding: when at least 2 calendar days have passed from
    the date of completed_at to today and no price-protection refund stands on the order yet, it is 1.00; when
    exactly 1 calendar day has passed and none stands yet, it is 0.50; otherwise there is none. The price-protection
    handling credit is added as well: when at least 2 replacement units were billed and the replacement is
    perishable, it is 0.50 per billed unit; when at least 2 replacement units were billed and the replacement is not
    perishable, it is 0.25 per billed unit; otherwise there is none. In full, the excess is multiplied by the
    guarantee and by 1 plus the uplift percentage and rounded to the cent once, then the standing allowance and the
    handling credit are added; the refund never exceeds the line's billed charge.
  prerequisite: []
  cross_category:
  - category: membership
    as: history
    reads: [variant_name, enrolled_date, membership_events.event_type, membership_events.event_date]
    note: The protected-price tier reads the plan's billing cycle and enrollment date; the guarantee counts period fees
      in the membership ledger over 36 months.
  compute:
  - pp_line_charge: "SUM('order_events','amount_usd', event_type='order_item_charged', substitution_decision='auto_best_match')"
  - pp_billed_units: "SUM('order_events','quantity', event_type='order_item_charged', substitution_decision='auto_best_match')"
  - pp_billed_price: "MAX('order_events','unit_price_usd', event_type='order_item_charged', substitution_decision='auto_best_match')"
  - pp_original_price: "MAX('order_events','original_unit_price_usd', event_type='order_item_charged', substitution_decision='auto_best_match')"
  - pp_triggered: "pp_billed_price > pp_original_price * (1 + P('substitution_price_cap_pct') / 100)"
  - pp_plan_cycle: "CPARAM('membership','billing_cycle', membership_id=F('membership_id'))"
  - pp_enrolled_date: "CFIELD('membership','enrolled_date', membership_id=F('membership_id'))"
  - pp_tenure_months: "MONTHS(pp_enrolled_date, F('placed_date')) if pp_enrolled_date else 0"
  - pp_protected_price: "pp_original_price if (pp_plan_cycle == 'annual' and pp_tenure_months >= K('tenure_long_months')) else ((pp_original_price + pp_billed_price) / 2 if (pp_plan_cycle == 'annual' and pp_tenure_months >= K('tenure_mid_months')) else pp_original_price * (1 + P('substitution_price_cap_pct') / 100))"
  - pp_excess: "MX(0, pp_line_charge - RND(pp_billed_units * pp_protected_price))"
  - pp_plan_fees_36m: "XCOUNT('membership','membership_events', within_months=36, event_type='membership_fee_charged')"
  - pp_guarantee_mult: "K('guarantee_high_mult') if pp_plan_fees_36m >= K('guarantee_fee_count') else (K('guarantee_mid_mult') if pp_plan_fees_36m >= 1 else 1)"
  - pp_issue_refunds: "COUNT('order_events', event_type='order_item_refunded', refund_reason='missing') + COUNT('order_events', event_type='order_item_refunded', refund_reason='damaged') + COUNT('order_events', event_type='order_item_refunded', refund_reason='wrong_item') + COUNT('order_events', event_type='order_item_refunded', refund_reason='quality')"
  - pp_item_subtotal: "SUM('order_events','amount_usd', event_type='order_item_charged')"
  - pp_uplift_pct: "K('uplift_large_pct') if (pp_issue_refunds >= 1 and pp_item_subtotal >= K('large_order_usd')) else (K('uplift_small_pct') if (pp_issue_refunds >= 1 and pp_item_subtotal < K('large_order_usd')) else 0)"
  - pp_days_since_completion: "DAYS(F('completed_at'), NOW)"
  - pp_refunded: "SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='substitution_price_protection')"
  - pp_standing_allowance: "K('allowance_two_days_usd') if (pp_days_since_completion >= 2 and pp_refunded == 0) else (K('allowance_one_day_usd') if (pp_days_since_completion == 1 and pp_refunded == 0) else 0)"
  - pp_line_class: "LATEST('order_events','item_category', event_type='order_item_charged', substitution_decision='auto_best_match')"
  - pp_handling_credit: "K('handling_perishable_usd') * pp_billed_units if (pp_billed_units >= 2 and pp_line_class == 'perishable') else (K('handling_shelf_usd') * pp_billed_units if (pp_billed_units >= 2 and pp_line_class != 'perishable') else 0)"
  - result: "RND(MN(pp_line_charge, RND(pp_excess * pp_guarantee_mult * (1 + pp_uplift_pct / 100)) + pp_standing_allowance + pp_handling_credit)) if pp_triggered else 0"
  compute_basis:
    pp_line_charge: The price-protection excess is the line's billed charge less the protected charge, never below zero.
    pp_billed_units: The protected charge is the billed units times the protected unit price, rounded to the cent.
    pp_billed_price: its unit price exceeds the original unit price by more than substitution_price_cap_pct of the order's service level
    pp_original_price: The protected unit price is the original unit price times (1 + substitution_price_cap_pct of the order's service level / 100).
    pp_triggered: When the shopper chose the replacement without the customer's approval (auto_best_match) and its unit price exceeds the original unit price by more than substitution_price_cap_pct of the order's service level, the price-protection refund this rule computes is booked on that line with refund_reason substitution_price_protection
    pp_plan_cycle: The protected unit price depends on the Cartwise+ membership recorded on the order
    pp_enrolled_date: when that membership is on an annual plan and was enrolled at least 24 whole calendar months before the order's placed date
    pp_tenure_months: 'Months are counted by anniversary: between an earlier date and a later date as many whole months have passed as there are monthly anniversaries of the earlier date falling on or before the later date, so a period fee counts as charged within the last N whole calendar months when fewer than N such months have passed from its charge date to today, and a fee charged earlier in the current month is 0 months old. ... was enrolled at least 24 whole calendar months before the order''s placed date'
    pp_protected_price: when that membership is on an annual plan and was enrolled at least 24 whole calendar months before the order's placed date, the protected unit price is the original unit price itself; when it is on an annual plan and was enrolled at least 12 and fewer than 24 whole calendar months before, it is the average of the original unit price and the replacement's billed unit price; in every other case it is the original unit price times (1 + substitution_price_cap_pct / 100) as stated above.
    pp_excess: The price-protection excess is the line's billed charge less the protected charge, never below zero.
    pp_plan_fees_36m: 'Months are counted by anniversary: between an earlier date and a later date as many whole months have passed as there are monthly anniversaries of the earlier date falling on or before the later date, so a period fee counts as charged within the last N whole calendar months when fewer than N such months have passed from its charge date to today, and a fee charged earlier in the current month is 0 months old. ... when the customer''s membership ledger shows at least 3 period fees charged within the last 36 whole calendar months'
    pp_guarantee_mult: when the customer's membership ledger shows at least 3 period fees charged within the last 36 whole calendar months, the excess is returned twice over; when it shows 1 or 2 such fees, the excess is returned one and a half times; otherwise the excess is returned once.
    pp_issue_refunds: when the order already carries an item refund for a missing, damaged, wrong_item or quality issue
    pp_item_subtotal: its item subtotal (the sum of its billed item lines) is at least 125.00
    pp_uplift_pct: when the order already carries an item refund for a missing, damaged, wrong_item or quality issue and its item subtotal (the sum of its billed item lines) is at least 125.00, by 10 percent; when it carries such a refund and its item subtotal is below 125.00, by 5 percent; otherwise it is not raised.
    pp_days_since_completion: when at least 2 calendar days have passed from the date of completed_at to today
    pp_refunded: and no price-protection refund stands on the order yet
    pp_standing_allowance: when at least 2 calendar days have passed from the date of completed_at to today and no price-protection refund stands on the order yet, it is 1.00; when exactly 1 calendar day has passed and none stands yet, it is 0.50; otherwise there is none.
    pp_line_class: and the replacement is perishable
    pp_handling_credit: when at least 2 replacement units were billed and the replacement is perishable, it is 0.50 per billed unit; when at least 2 replacement units were billed and the replacement is not perishable, it is 0.25 per billed unit; otherwise there is none.
    result: In full, the excess is multiplied by the guarantee and by 1 plus the uplift percentage and rounded to the cent once, then the standing allowance and the handling credit are added; the refund never exceeds the line's billed charge.
  factors:
  - id: price_protection_protected_price
    effect: method
    decides: pp_protected_price
    bindings: [pp_plan_cycle, pp_enrolled_date, pp_tenure_months, pp_protected_price]
    ladder:
    - when: membership on an annual plan AND enrolled at least 24 whole months before the placed date
      method: the protected unit price is the original unit price itself
    - when: membership on an annual plan AND enrolled 12 to 23 whole months before the placed date
      method: the protected unit price is the average of the original and the replacement's billed unit price
    - when: otherwise
      method: the protected unit price is the original unit price raised by the service level's substitution cap
