    wo_standing_allowance: "when at least 2 calendar days have passed from the date of completed_at to today and no weight-overage refund stands on the order yet, it is 1.00; when exactly 1 calendar day has passed and none stands yet, it is 0.50; otherwise there is none."
    result: "In full, the overage weight is multiplied by its price and by 1 plus the uplift percentage, rounded to the cent once, and the standing allowance is added; the refund never exceeds the line's billed charge."
