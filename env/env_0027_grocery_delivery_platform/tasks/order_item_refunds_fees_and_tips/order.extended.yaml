events:
- type: order_placed
  target: orders
  mutation: create
  meaning: The customer checks out a cart for one retailer and one service level, opening the order.
  grain: one row per order
  fields: {customer_id: ordering customer, variant_name: official service level, retailer_name: store the order
      is shopped at, placed_date: checkout date, scheduled_window_start: start of the booked window, scheduled_window_end: end
      of the booked window, membership_id: the Cartwise+ membership whose benefits were judged at checkout (empty
      for non-members)}
  triggers: []
- type: order_rescheduled
  target: orders
  mutation: update
  meaning: The booked window is moved to a new window before the reschedule cutoff.
  grain: one row per transaction
  fields: {scheduled_window_start: new window start, scheduled_window_end: new window end, reschedule_count: reschedules
      used after this move}
  triggers: []
- type: order_shopping_started
  target: orders
  mutation:
    transition: {from: placed, to: shopping}
  meaning: A shopper's batch picks up the order and shopping begins.
  grain: one row per transaction
  fields: {batch_id: the shopper batch that holds this order}
  triggers: []
- type: order_dispatched
  target: orders
  mutation:
    transition: {from: shopping, to: en_route}
  meaning: The delivery order is checked out and on its way.
  grain: one row per transaction
  fields: {batch_id: the shopper batch delivering it}
  triggers: []
- type: order_ready_for_pickup
  target: orders
  mutation:
    transition: {from: shopping, to: ready_for_pickup}
  meaning: The pickup order is checked out and staged at the store.
  grain: one row per transaction
  fields: {batch_id: the shopper batch that staged it}
  triggers: []
- type: order_completed
  target: orders
  mutation:
    transition:
    - {from: en_route, to: completed}
    - {from: ready_for_pickup, to: completed}
  meaning: The order reaches the customer.
  grain: one row per transaction
  fields: {order_id: the order completed, completed_at: exact handoff time, variant_name: service level of the order,
    batch_id: the shopper batch that completed it, tip_usd: tip committed at handoff}
  triggers:
  - event: batch:batch_tip_posted
    when:
      variant_name: {not: Curbside Pickup}
    map: {batch_id: batch_id, order_id: order_id, amount_usd: tip_usd}
- type: order_returned
  target: orders
  mutation:
    transition:
    - {from: en_route, to: returned}
    - {from: ready_for_pickup, to: returned}
  meaning: The order could not be handed over and goes back to the store.
  grain: one row per transaction
  fields: {returned_date: date the order was returned}
  triggers: []
- type: order_canceled
  target: orders
  mutation:
    transition:
    - {from: placed, to: canceled}
    - {from: shopping, to: canceled}
  meaning: The customer cancels the order before checkout.
  grain: one row per transaction
  fields: {canceled_date: cancellation date, cancel_stage: whether shopping had started when the cancellation was
      confirmed}
  triggers:
  - event: order:order_fee_charged
    when: {cancel_stage: during_shopping}
    map: {fee_type: cancellation}
- type: order_closed
  target: orders
  mutation:
    transition:
    - {from: completed, to: closed}
    - {from: returned, to: closed}
  meaning: The order's charges become final after its issue-report window.
  grain: one row per transaction
  fields: {closed_date: date the order closed}
  triggers: []
- type: order_item_charged
  target: order_events
  meaning: One item line is billed at checkout at the price of what was actually handed over.
  grain: one row per order line
  distinguish_by: [line_number]
  fields: {line_number: line position on the order, item_name: product as listed, item_category: item class driving
      fees and exclusions, requested_quantity: units or pounds the customer asked for, quantity: units or pounds
      billed, original_unit_price_usd: unit price of the product originally ordered, unit_price_usd: unit price
      billed, line_outcome: whether the line went as ordered or was substituted or weight-adjusted, substitute_item_name: replacement
      product (empty unless substituted), amount_usd: line charge (positive), event_date: checkout date}
  account: order_billed
  direction: in
  triggers: []
- type: order_substitution_decided
  target: order_events
  meaning: The handling of one out-of-stock line is settled while shopping.
  grain: one row per out-of-stock line
  distinguish_by: [line_number]
  fields: {line_number: the out-of-stock line, item_name: product originally ordered, substitute_item_name: replacement
      chosen (empty when refunded), substitution_decision: how the line was settled, event_date: date settled}
  triggers: []
- type: order_item_refunded
  target: order_events
  meaning: All or part of one billed item line is returned to the customer.
  grain: one row per refund reason on one line
  distinguish_by: [line_number, refund_reason]
  fields: {line_number: the refunded line, source_event_id: the order_item_charged row being refunded, refund_reason: controlled
      reason, refund_destination: where the money goes, amount_usd: amount refunded (positive), event_date: refund
      date}
  account: order_billed
  direction: out
  triggers: []
- type: order_fee_charged
  target: order_events
  meaning: One fee is billed on the order.
  grain: one row per fee type per order
  distinguish_by: [fee_type]
  fields: {fee_type: which fee, amount_usd: fee billed (positive), event_date: billing date}
  account: order_billed
  direction: in
  triggers: []
- type: order_fee_waived
  target: order_events
  meaning: A fee that would otherwise apply is waived or reduced by a membership benefit.
  grain: one row per waived fee type per order
  distinguish_by: [fee_type]
  fields: {fee_type: which fee, waiver_basis: benefit behind the waiver, amount_usd: fee amount not billed (positive),
    event_date: checkout date}
  triggers:
  - event: membership:membership_upgrade_redeemed
    when: {waiver_basis: member_priority_upgrade}
    map: {order_id: order_id}
- type: order_fee_refunded
  target: order_events
  meaning: All or part of one billed fee is returned to the customer.
  grain: one row per refund of one fee charge
  distinguish_by: [source_event_id, refund_reason]
  fields: {source_event_id: the order_fee_charged row being refunded, fee_type: which fee, refund_reason: controlled
      reason, refund_destination: where the money goes, amount_usd: amount refunded (positive), event_date: refund
      date}
  account: order_billed
  direction: out
  triggers: []
- type: order_tip_set
  target: order_events
  meaning: The checkout tip is committed.
  grain: one row per order
  distinguish_by: [event_date]
  fields: {amount_usd: tip committed (positive), batch_id: batch the tip is for (empty before shopping), event_date: checkout
      date}
  account: tip
  direction: in
  triggers: []
- type: order_tip_increased
  target: order_events
  meaning: The customer raises the tip after completion.
  grain: one row per tip change
  distinguish_by: [event_date]
  fields: {amount_usd: increase (positive), batch_id: batch that delivered the order, event_date: date of change}
  account: tip
  direction: in
  triggers:
  - event: batch:batch_tip_adjusted_up
    map: {batch_id: batch_id, order_id: order_id, amount_usd: amount_usd}
- type: order_tip_reduced
  target: order_events
  meaning: The customer lowers the tip after completion.
  grain: one row per tip change
  distinguish_by: [event_date]
  fields: {amount_usd: reduction (positive), batch_id: batch that delivered the order, event_date: date of change}
  account: tip
  direction: out
  triggers:
  - event: batch:batch_tip_adjusted_down
    map: {batch_id: batch_id, order_id: order_id, amount_usd: amount_usd}
measures:
- {id: order_msr_item_subtotal, window: the single order, measure: sum of amount_usd of the order's order_item_charged
    rows}
- {id: order_msr_heavy_units, window: the single order, measure: sum of quantity of the order's order_item_charged
    rows whose item_category is heavy}
- id: order_msr_refunded_on_order
  window: the single order, through frozen_time
  measure: >-
    sum of amount_usd of the order's order_item_refunded rows with refund_reason in (missing, damaged, wrong_item,
    quality)
- id: order_msr_refund_count_90d
  window: rolling 90 calendar days ending on frozen_time, by event_date
  measure: >-
    count of order_item_refunded rows with refund_reason in (missing, damaged, wrong_item, quality) across all of
    the customer's orders
- id: order_msr_refund_amount_90d
  window: rolling 90 calendar days ending on frozen_time, by event_date
  measure: >-
    sum of amount_usd of order_item_refunded rows with refund_reason in (missing, damaged, wrong_item, quality)
    across all of the customer's orders
- id: order_msr_late_refunds_30d
  window: rolling 30 calendar days ending on frozen_time, by event_date
  measure: >-
    count of order_fee_refunded rows with refund_reason late_delivery across all of the customer's orders
- {id: order_msr_tip_edits, window: 'the single order, after completed_at', measure: count of order_tip_increased
    and order_tip_reduced rows on the order}
policies:
- id: order_agg_multi_holding
  subject: [order_placed]
  rule: >
    A customer may hold any number of orders at once, including several open orders for different retailers or windows;
    each order is billed, refunded and tipped on its own. Limits that span orders are set only by order_agg_refund_review
    and order_evt_on_time_guarantee.
  eligibility: []
  params: {max_per_customer: null}
- id: order_agg_refund_review
  subject: [order_item_refunded]
  rule: >
    Item refunds are judged across all of a customer's orders as well as per order. A new missing, damaged, wrong_item
    or quality refund may be granted by the agent only while order_msr_refund_count_90d is below refund_count_90d_limit
    and order_msr_refund_amount_90d plus the requested amount does not exceed refund_amount_90d_limit_usd, both
    taken from the service level of the order being refunded. When either limit would be crossed, no refund is booked;
    the request is registered for review with request_type refund_limit_review and the review team decides it. Substitution
    price protection, weight overage, substitution rejection, alcohol and returned-order refunds do not count toward
    or depend on these limits.
  eligibility:
  - id: under_rolling_limits
    applies_to: [order_item_refunded]
    kind: authorization
    condition: >-
      A new missing, damaged, wrong_item or quality refund may be granted by the agent only while order_msr_refund_count_90d
      is below refund_count_90d_limit and order_msr_refund_amount_90d plus the requested amount does not exceed
      refund_amount_90d_limit_usd, both taken from the service level of the order being refunded.
    evidence_fields: [order_events.event_type, order_events.refund_reason, order_events.amount_usd, order_events.event_date,
      order_events.customer_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [order_events.customer_id]
      action_bindings: {order_events.customer_id: customer_id}
  params:
    per_tier:
      Curbside Pickup: {refund_count_90d_limit: =refund_count_90d_limit, refund_amount_90d_limit_usd: =refund_amount_90d_limit_usd}
      No-Rush Delivery: {refund_count_90d_limit: =refund_count_90d_limit, refund_amount_90d_limit_usd: =refund_amount_90d_limit_usd}
      Standard Delivery: {refund_count_90d_limit: =refund_count_90d_limit, refund_amount_90d_limit_usd: =refund_amount_90d_limit_usd}
      Priority Delivery: {refund_count_90d_limit: =refund_count_90d_limit, refund_amount_90d_limit_usd: =refund_amount_90d_limit_usd}
      Express 30 Delivery: {refund_count_90d_limit: =refund_count_90d_limit, refund_amount_90d_limit_usd: =refund_amount_90d_limit_usd}
      Stock-Up Delivery: {refund_count_90d_limit: =refund_count_90d_limit, refund_amount_90d_limit_usd: =refund_amount_90d_limit_usd}
  measures: [order_msr_refund_count_90d, order_msr_refund_amount_90d]
- id: order_evt_fee_schedule
  subject: [order_fee_charged, order_fee_waived, order_placed]
  rule: >
    Fees are fixed at checkout from the order's service level and are billed once per fee_type. A delivery order
    is billed delivery_fee_usd; a pickup order is billed pickup_fee_usd. Priority Delivery adds priority_fee_usd
    and Express 30 Delivery adds express_fee_usd. A small_basket fee of small_basket_fee_usd applies when small_basket_threshold_usd
    is above 0 and the item subtotal is below it. A heavy fee of heavy_order_fee_usd applies when heavy_item_threshold_count
    is above 0 and order_msr_heavy_units exceeds it. A busy fee is billed only as the amount the customer accepted
    at checkout and never above busy_pricing_max_usd. Membership benefits are applied at checkout from the membership
    recorded on the order, under membership_evt_order_benefits: the delivery fee is waived (member_free_delivery)
    on a service in that plan's free_delivery_services when the item subtotal is at least its free_delivery_order_minimum_usd;
    one priority upgrade, when available, replaces the priority fee (member_priority_upgrade); the express fee is
    reduced by the plan's express_fee_discount_pct (member_express_discount); the small-basket fee is waived where
    the plan waives it (member_small_basket_waiver). Each waived or reduced amount is recorded as an order_fee_waived
    row and only the remainder is billed. Benefits never waive the pickup, heavy, busy, cancellation or alcohol_return
    fees. An order is placed only when its item subtotal is at least order_minimum_usd and its units do not exceed
    max_items. The busy fee is never waived for members because busy_pricing_member_exempt is false for every service
    level.
  eligibility:
  - id: order_minimum_met
    applies_to: [order_placed]
    kind: caller_fact
    condition: >-
      An order is placed only when its item subtotal is at least order_minimum_usd and its units do not exceed max_items.
    evidence_fields: [orders.variant_name, orders.order_id]
    evidence_contract:
      authority: mixed
      timing: pre_action
      correlation_keys:
      - [orders.order_id]
      action_bindings: {orders.order_id: order_id}
  params:
    per_tier:
      Curbside Pickup: {delivery_fee_usd: =delivery_fee_usd, pickup_fee_usd: =pickup_fee_usd, priority_fee_usd: =priority_fee_usd,
        express_fee_usd: =express_fee_usd, heavy_order_fee_usd: =heavy_order_fee_usd}
      No-Rush Delivery: {delivery_fee_usd: =delivery_fee_usd, pickup_fee_usd: =pickup_fee_usd, priority_fee_usd: =priority_fee_usd,
        express_fee_usd: =express_fee_usd, heavy_order_fee_usd: =heavy_order_fee_usd}
      Standard Delivery: {delivery_fee_usd: =delivery_fee_usd, pickup_fee_usd: =pickup_fee_usd, priority_fee_usd: =priority_fee_usd,
        express_fee_usd: =express_fee_usd, heavy_order_fee_usd: =heavy_order_fee_usd}
      Priority Delivery: {delivery_fee_usd: =delivery_fee_usd, pickup_fee_usd: =pickup_fee_usd, priority_fee_usd: =priority_fee_usd,
        express_fee_usd: =express_fee_usd, heavy_order_fee_usd: =heavy_order_fee_usd}
      Express 30 Delivery: {delivery_fee_usd: =delivery_fee_usd, pickup_fee_usd: =pickup_fee_usd, priority_fee_usd: =priority_fee_usd,
        express_fee_usd: =express_fee_usd, heavy_order_fee_usd: =heavy_order_fee_usd}
      Stock-Up Delivery: {delivery_fee_usd: =delivery_fee_usd, pickup_fee_usd: =pickup_fee_usd, priority_fee_usd: =priority_fee_usd,
        express_fee_usd: =express_fee_usd, heavy_order_fee_usd: =heavy_order_fee_usd}
  measures: [order_msr_heavy_units, order_msr_item_subtotal]
- id: order_evt_service_fee
  subject: [order_fee_charged, order_fee_waived]
  rule: >
    The service fee is a percentage of the item subtotal (order_msr_item_subtotal) bounded by service_fee_min_usd
    and service_fee_max_usd of the order's service level. A non-member pays service_fee_rate_pct. When a membership
    benefit applies, the rate is the lower of service_fee_rate_pct and the plan's member_service_fee_rate_pct; the
    difference between the non-member fee and the member fee is recorded as an order_fee_waived row with waiver_basis
    member_service_fee_rate, and never as a negative charge. The bounds apply to each fee computed before comparing.
    Every amount is rounded to the cent, half up. When items are refunded and service_fee_refund_on_item_refund
    is true, the service fee is refunded in proportion to the refunded item amount (refund_reason item_refund_share),
    rounded to the cent; the refunded share is never recomputed against the floor.
  eligibility: []
  params:
    per_tier:
      Curbside Pickup: {service_fee_rate_pct: =service_fee_rate_pct, service_fee_min_usd: =service_fee_min_usd,
        service_fee_max_usd: =service_fee_max_usd}
      No-Rush Delivery: {service_fee_rate_pct: =service_fee_rate_pct, service_fee_min_usd: =service_fee_min_usd,
        service_fee_max_usd: =service_fee_max_usd}
      Standard Delivery: {service_fee_rate_pct: =service_fee_rate_pct, service_fee_min_usd: =service_fee_min_usd,
        service_fee_max_usd: =service_fee_max_usd}
      Priority Delivery: {service_fee_rate_pct: =service_fee_rate_pct, service_fee_min_usd: =service_fee_min_usd,
        service_fee_max_usd: =service_fee_max_usd}
      Express 30 Delivery: {service_fee_rate_pct: =service_fee_rate_pct, service_fee_min_usd: =service_fee_min_usd,
        service_fee_max_usd: =service_fee_max_usd}
      Stock-Up Delivery: {service_fee_rate_pct: =service_fee_rate_pct, service_fee_min_usd: =service_fee_min_usd,
        service_fee_max_usd: =service_fee_max_usd}
    member_service_fee_rate_pct: >-
      taken from the Cartwise+ plan recorded on the order (membership charter, membership_evt_order_benefits)
  formula:
    service_fee_nonmember: >-
      min(max(round(order_msr_item_subtotal * service_fee_rate_pct / 100, 2), service_fee_min_usd), service_fee_max_usd)
    service_fee_member: >-
      min(max(round(order_msr_item_subtotal * min(service_fee_rate_pct, member_service_fee_rate_pct) / 100, 2),
      service_fee_min_usd), service_fee_max_usd)
  measures: [order_msr_item_subtotal]
- id: order_evt_substitutions
  subject: [order_substitution_decided, order_item_charged, order_item_refunded]
  rule: >
    For an out-of-stock line the shopper follows the customer's line preference; with none, the service level's
    substitution_default applies, and a chat question unanswered after substitution_approval_timeout_minutes is
    treated as no answer. The decision is recorded once per line as approved_by_customer, auto_best_match or not_found_refunded.
    The substituted line is billed at the replacement's price, except that an auto_best_match replacement whose
    unit price exceeds the original's by more than substitution_price_cap_pct is billed at the original unit price
    times the billed quantity; if it was billed higher, the excess is refunded with refund_reason substitution_price_protection.
    A customer-approved replacement is never price-protected. A customer may reject a delivered substitution within
    the issue-report window and receive the line's full charge back with refund_reason substitution_rejected; the
    replacement is kept, never collected. A line whose decision is approved_by_customer cannot be rejected afterwards.
    A not_found_refunded line is never billed, so it has nothing to refund.
  eligibility:
  - id: rejectable_substitution
    applies_to: [order_item_refunded]
    kind: authorization
    condition: A line whose decision is approved_by_customer cannot be rejected afterwards.
    evidence_fields: [order_events.substitution_decision, order_events.line_number, order_events.order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [order_events.order_id, order_events.line_number]
      action_bindings: {order_events.order_id: order_id, order_events.line_number: line_number}
  params:
    per_tier:
      Curbside Pickup: {substitution_price_cap_pct: =substitution_price_cap_pct, substitution_default: =substitution_default}
      No-Rush Delivery: {substitution_price_cap_pct: =substitution_price_cap_pct, substitution_default: =substitution_default}
      Standard Delivery: {substitution_price_cap_pct: =substitution_price_cap_pct, substitution_default: =substitution_default}
      Priority Delivery: {substitution_price_cap_pct: =substitution_price_cap_pct, substitution_default: =substitution_default}
      Express 30 Delivery: {substitution_price_cap_pct: =substitution_price_cap_pct, substitution_default: =substitution_default}
      Stock-Up Delivery: {substitution_price_cap_pct: =substitution_price_cap_pct, substitution_default: =substitution_default}
- id: order_evt_item_refunds
  subject: [order_item_refunded]
  rule: >
    A missing, damaged, wrong_item or quality refund targets one billed line, named by order and line_number, and
    pays back that line's charge for the affected units at the billed unit price. Item issues are refunded only
    on a completed order and only when reported within the issue window counted from the order's completion. The
    window is counted in calendar days from the date part of completed_at as day 0, and the last day to report is
    that date plus issue_report_window_days, inclusive. A damaged or quality refund on a line charged above damaged_photo_required_over_usd
    needs a photo on the case; without one it is registered for review with request_type photo_review. The agent
    may grant item refunds on one order only up to the lower of self_service_refund_cap_usd and self_service_refund_cap_pct
    of order_msr_item_subtotal, counting order_msr_refunded_on_order already granted; the part above the cap is
    registered for review with request_type refund_over_cap and is not booked. Each line can be refunded once per
    refund_reason, and never for more than the line's charge minus what was already refunded on it. Refunds go to
    refund_destination_default unless the customer asks for cartwise_credit.
  eligibility:
  - id: completed_order
    applies_to: [order_item_refunded]
    kind: state
    condition: >-
      Item issues are refunded only on a completed order and only when reported within the issue window counted
      from the order's completion.
    evidence_fields: [orders.status, orders.order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [orders.order_id]
      action_bindings: {orders.order_id: order_id}
    state_contract:
      field: orders.status
      allowed: [completed]
  - id: issue_window
    applies_to: [order_item_refunded]
    kind: time
    condition: >-
      Item issues are refunded only on a completed order and only when reported within the issue window counted
      from the order's completion.
    evidence_fields: [orders.completed_at, orders.order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [orders.order_id]
      action_bindings: {orders.order_id: order_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the order's completion
      anchor_source: orders.completed_at
      relation: not_after
      duration_source: variants.issue_report_window_days
      unit: calendar_days
      counting_rule: >-
        The window is counted in calendar days from the date part of completed_at as day 0, and the last day to
        report is that date plus issue_report_window_days, inclusive.
      boundary: inclusive
  - id: once_per_line_reason
    applies_to: [order_item_refunded]
    kind: dedup
    condition: >-
      Each line can be refunded once per refund_reason, and never for more than the line's charge minus what was
      already refunded on it.
    evidence_fields: [order_events.order_id, order_events.line_number, order_events.refund_reason, order_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [order_events.order_id, order_events.line_number]
      action_bindings: {order_events.order_id: order_id, order_events.line_number: line_number}
    dedup_contract:
      table: order_events
      mode: separate_record
      object_bindings: {order_id: order_id, line_number: line_number, refund_reason: refund_reason}
      duplicate_filters:
        event_type: [order_item_refunded]
      distinct_fields: []
  params:
    per_tier:
      Curbside Pickup: {issue_report_window_days: =issue_report_window_days, self_service_refund_cap_usd: =self_service_refund_cap_usd,
        self_service_refund_cap_pct: =self_service_refund_cap_pct}
      No-Rush Delivery: {issue_report_window_days: =issue_report_window_days, self_service_refund_cap_usd: =self_service_refund_cap_usd,
        self_service_refund_cap_pct: =self_service_refund_cap_pct}
      Standard Delivery: {issue_report_window_days: =issue_report_window_days, self_service_refund_cap_usd: =self_service_refund_cap_usd,
        self_service_refund_cap_pct: =self_service_refund_cap_pct}
      Priority Delivery: {issue_report_window_days: =issue_report_window_days, self_service_refund_cap_usd: =self_service_refund_cap_usd,
        self_service_refund_cap_pct: =self_service_refund_cap_pct}
      Express 30 Delivery: {issue_report_window_days: =issue_report_window_days, self_service_refund_cap_usd: =self_service_refund_cap_usd,
        self_service_refund_cap_pct: =self_service_refund_cap_pct}
      Stock-Up Delivery: {issue_report_window_days: =issue_report_window_days, self_service_refund_cap_usd: =self_service_refund_cap_usd,
        self_service_refund_cap_pct: =self_service_refund_cap_pct}
  formula:
    per_order_cap: >-
      min(self_service_refund_cap_usd, round(order_msr_item_subtotal * self_service_refund_cap_pct / 100, 2))
    grantable_now: max(per_order_cap - order_msr_refunded_on_order, 0)
  measures: [order_msr_item_subtotal, order_msr_refunded_on_order]
- id: order_evt_weighted_items
  subject: [order_item_charged, order_item_refunded]
  rule: >
    Produce, meat and deli sold by weight (item_category weighted) are billed on the weight handed over. When the
    billed weight exceeds the requested weight by more than weighted_item_tolerance_pct, the charge for the weight
    above requested weight times (1 + weighted_item_tolerance_pct / 100) is refunded with refund_reason weight_overage,
    rounded to the cent. Weight shortfalls are not refunded because they are already billed at the lower weight.
    A weight_overage refund does not count toward the per-order self-service cap or the rolling limits.
  eligibility: []
  params:
    per_tier:
      Curbside Pickup: {weighted_item_tolerance_pct: =weighted_item_tolerance_pct}
      No-Rush Delivery: {weighted_item_tolerance_pct: =weighted_item_tolerance_pct}
      Standard Delivery: {weighted_item_tolerance_pct: =weighted_item_tolerance_pct}
      Priority Delivery: {weighted_item_tolerance_pct: =weighted_item_tolerance_pct}
      Express 30 Delivery: {weighted_item_tolerance_pct: =weighted_item_tolerance_pct}
      Stock-Up Delivery: {weighted_item_tolerance_pct: =weighted_item_tolerance_pct}
- id: order_evt_cancellation
  subject: [order_canceled, order_fee_charged, order_fee_refunded]
  rule: >
    An order can be canceled only before checkout, that is while it is placed or shopping; after checkout it cannot
    be canceled because cancel_after_checkout_allowed is false for every service level, and item problems are handled
    as refunds instead. Only the customer can confirm a cancellation. A cancellation confirmed while placed (cancel_stage
    before_shopping) is free, nothing is billed, and a redeemed priority upgrade is returned to the membership.
    A cancellation confirmed while shopping (cancel_stage during_shopping) bills cancellation_fee_usd as fee_type
    cancellation, and no other fee, item or tip is billed.
  eligibility:
  - id: before_checkout
    applies_to: [order_canceled]
    kind: state
    condition: >-
      An order can be canceled only before checkout, that is while it is placed or shopping; after checkout it cannot
      be canceled because cancel_after_checkout_allowed is false for every service level, and item problems are
      handled as refunds instead.
    evidence_fields: [orders.status, orders.order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [orders.order_id]
      action_bindings: {orders.order_id: order_id}
    state_contract:
      field: orders.status
      allowed: [placed, shopping, canceled]
  params:
    per_tier:
      Curbside Pickup: {cancellation_fee_usd: =cancellation_fee_usd}
      No-Rush Delivery: {cancellation_fee_usd: =cancellation_fee_usd}
      Standard Delivery: {cancellation_fee_usd: =cancellation_fee_usd}
      Priority Delivery: {cancellation_fee_usd: =cancellation_fee_usd}
      Express 30 Delivery: {cancellation_fee_usd: =cancellation_fee_usd}
      Stock-Up Delivery: {cancellation_fee_usd: =cancellation_fee_usd}
- id: order_evt_reschedule
  subject: [order_rescheduled]
  rule: >
    A booked window may be moved only while the order is placed. The move must be made no later than the reschedule
    cutoff before the booked window start. The cutoff is counted in elapsed hours, and the last moment to move is
    scheduled_window_start minus reschedule_cutoff_hours, inclusive. A service level allows max_reschedules moves
    per order, counted by reschedule_count, and the new window must lie within advance_booking_days of the move
    date. Rescheduling never changes the fees fixed at checkout.
  eligibility:
  - id: placed_only
    applies_to: [order_rescheduled]
    kind: state
    condition: A booked window may be moved only while the order is placed.
    evidence_fields: [orders.status, orders.order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [orders.order_id]
      action_bindings: {orders.order_id: order_id}
    state_contract:
      field: orders.status
      allowed: [placed]
  - id: before_cutoff
    applies_to: [order_rescheduled]
    kind: time
    condition: The move must be made no later than the reschedule cutoff before the booked window start.
    evidence_fields: [orders.scheduled_window_start, orders.order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [orders.order_id]
      action_bindings: {orders.order_id: order_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the booked window start
      anchor_source: orders.scheduled_window_start
      relation: not_after
      duration_source: variants.reschedule_cutoff_hours
      unit: elapsed_hours
      counting_rule: >-
        The cutoff is counted in elapsed hours, and the last moment to move is scheduled_window_start minus reschedule_cutoff_hours,
        inclusive.
      boundary: inclusive
  params:
    per_tier:
      Curbside Pickup: {max_reschedules: =max_reschedules, reschedule_cutoff_hours: =reschedule_cutoff_hours}
      No-Rush Delivery: {max_reschedules: =max_reschedules, reschedule_cutoff_hours: =reschedule_cutoff_hours}
      Standard Delivery: {max_reschedules: =max_reschedules, reschedule_cutoff_hours: =reschedule_cutoff_hours}
      Priority Delivery: {max_reschedules: =max_reschedules, reschedule_cutoff_hours: =reschedule_cutoff_hours}
      Express 30 Delivery: {max_reschedules: =max_reschedules, reschedule_cutoff_hours: =reschedule_cutoff_hours}
      Stock-Up Delivery: {max_reschedules: =max_reschedules, reschedule_cutoff_hours: =reschedule_cutoff_hours}
- id: order_evt_tips
  subject: [order_tip_set, order_tip_increased, order_tip_reduced, order_completed]
  rule: >
    Only service levels with tip_allowed true carry a tip; the checkout tip defaults to tip_default_pct of the item
    subtotal and the customer may change it before checkout. The whole tip passes to the shopper; Cartwise keeps
    none of it. After completion the tip can be changed at most tip_edits_after_completion times, and only within
    the tip edit window counted from the order's completion. The window is counted in elapsed hours from completed_at,
    and the last moment to change is completed_at plus tip_edit_window_hours, inclusive. A single increase may not
    exceed tip_increase_max_usd, and a reduction may not bring the tip below 0.00. A tip is never reduced by the
    agent on the customer's behalf without the customer confirming the new amount, and a tip reduction is never
    used to fund an item refund. Each tip change passes to the shopper's batch at once.
  eligibility:
  - id: tip_window
    applies_to: [order_tip_increased, order_tip_reduced]
    kind: time
    condition: >-
      After completion the tip can be changed at most tip_edits_after_completion times, and only within the tip
      edit window counted from the order's completion.
    evidence_fields: [orders.completed_at, orders.order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [orders.order_id]
      action_bindings: {orders.order_id: order_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the order's completion
      anchor_source: orders.completed_at
      relation: not_after
      duration_source: variants.tip_edit_window_hours
      unit: elapsed_hours
      counting_rule: >-
        The window is counted in elapsed hours from completed_at, and the last moment to change is completed_at
        plus tip_edit_window_hours, inclusive.
      boundary: inclusive
  params:
    per_tier:
      Curbside Pickup: {tip_allowed: =tip_allowed, tip_edit_window_hours: =tip_edit_window_hours}
      No-Rush Delivery: {tip_allowed: =tip_allowed, tip_edit_window_hours: =tip_edit_window_hours}
      Standard Delivery: {tip_allowed: =tip_allowed, tip_edit_window_hours: =tip_edit_window_hours}
      Priority Delivery: {tip_allowed: =tip_allowed, tip_edit_window_hours: =tip_edit_window_hours}
      Express 30 Delivery: {tip_allowed: =tip_allowed, tip_edit_window_hours: =tip_edit_window_hours}
      Stock-Up Delivery: {tip_allowed: =tip_allowed, tip_edit_window_hours: =tip_edit_window_hours}
  measures: [order_msr_tip_edits]
- id: order_evt_on_time_guarantee
  subject: [order_fee_refunded]
  rule: >
    An order counts as late when completed_at is more than late_threshold_minutes after scheduled_window_end. A
    late order whose service level has an on_time_guarantee_scope other than none gets that fee refunded in full
    with refund_reason late_delivery, from the matching order_fee_charged row; if that fee was fully waived there
    is nothing to refund and no substitute credit is given. A customer receives at most late_refunds_per_30d late
    refunds as counted by order_msr_late_refunds_30d; beyond that the guarantee does not pay. Lateness caused by
    a reschedule the customer asked for is measured against the rescheduled window.
  eligibility:
  - id: late_refund_quota
    applies_to: [order_fee_refunded]
    kind: authorization
    condition: >-
      A customer receives at most late_refunds_per_30d late refunds as counted by order_msr_late_refunds_30d; beyond
      that the guarantee does not pay.
    evidence_fields: [order_events.refund_reason, order_events.event_date, order_events.customer_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [order_events.customer_id]
      action_bindings: {order_events.customer_id: customer_id}
  params:
    per_tier:
      Curbside Pickup: {on_time_guarantee_scope: =on_time_guarantee_scope, late_threshold_minutes: =late_threshold_minutes}
      No-Rush Delivery: {on_time_guarantee_scope: =on_time_guarantee_scope, late_threshold_minutes: =late_threshold_minutes}
      Standard Delivery: {on_time_guarantee_scope: =on_time_guarantee_scope, late_threshold_minutes: =late_threshold_minutes}
      Priority Delivery: {on_time_guarantee_scope: =on_time_guarantee_scope, late_threshold_minutes: =late_threshold_minutes}
      Express 30 Delivery: {on_time_guarantee_scope: =on_time_guarantee_scope, late_threshold_minutes: =late_threshold_minutes}
      Stock-Up Delivery: {on_time_guarantee_scope: =on_time_guarantee_scope, late_threshold_minutes: =late_threshold_minutes}
  measures: [order_msr_late_refunds_30d]
- id: order_evt_alcohol_and_returns
  subject: [order_returned, order_item_refunded, order_fee_charged, order_closed]
  rule: >
    Alcohol lines are sold only on service levels with alcohol_allowed true and are handed over only after a valid
    ID check. When the ID check fails, the alcohol lines are refunded in full with refund_reason alcohol_id_failed
    and alcohol_return_fee_usd is billed as fee_type alcohol_return. A delivery order whose customer cannot be reached
    after contact_attempts_before_return attempts and wait_minutes_before_return minutes, or a pickup order not
    collected within its hold time, is returned; returned_item_refund_pct of the charge of each non-perishable line
    is refunded with refund_reason returned_order, perishable lines are not refunded, and fees are refunded only
    where returned_fees_refundable is true. A completed or returned order closes when its issue-report window ends;
    a closed order takes no further item refund, tip change or fee refund.
  eligibility: []
  params:
    per_tier:
      Curbside Pickup: {returned_item_refund_pct: =returned_item_refund_pct, alcohol_return_fee_usd: =alcohol_return_fee_usd}
      No-Rush Delivery: {returned_item_refund_pct: =returned_item_refund_pct, alcohol_return_fee_usd: =alcohol_return_fee_usd}
      Standard Delivery: {returned_item_refund_pct: =returned_item_refund_pct, alcohol_return_fee_usd: =alcohol_return_fee_usd}
      Priority Delivery: {returned_item_refund_pct: =returned_item_refund_pct, alcohol_return_fee_usd: =alcohol_return_fee_usd}
      Express 30 Delivery: {returned_item_refund_pct: =returned_item_refund_pct, alcohol_return_fee_usd: =alcohol_return_fee_usd}
      Stock-Up Delivery: {returned_item_refund_pct: =returned_item_refund_pct, alcohol_return_fee_usd: =alcohol_return_fee_usd}
- id: order_evt_fulfillment
  subject: [order_shopping_started, order_dispatched, order_ready_for_pickup, order_completed, order_closed]
  rule: >
    An order moves placed, shopping, then en_route for delivery service levels or ready_for_pickup for Curbside
    Pickup, then completed at handoff; every step is recorded by the system from the shopper's app, and the agent
    never advances an order's status. Items may be added or removed until item_edit_until. Unattended drop-off is
    allowed only where leave_at_door_allowed is true and never for an order containing alcohol. An order closes
    the day after its issue-report window ends.
  eligibility: []
  params:
    per_tier:
      Curbside Pickup: {leave_at_door_allowed: =leave_at_door_allowed, window_length_minutes: =window_length_minutes}
      No-Rush Delivery: {leave_at_door_allowed: =leave_at_door_allowed, window_length_minutes: =window_length_minutes}
      Standard Delivery: {leave_at_door_allowed: =leave_at_door_allowed, window_length_minutes: =window_length_minutes}
      Priority Delivery: {leave_at_door_allowed: =leave_at_door_allowed, window_length_minutes: =window_length_minutes}
      Express 30 Delivery: {leave_at_door_allowed: =leave_at_door_allowed, window_length_minutes: =window_length_minutes}
      Stock-Up Delivery: {leave_at_door_allowed: =leave_at_door_allowed, window_length_minutes: =window_length_minutes}

# ============================================================================
# extended_policies (difficulty order_item_refunds_fees_and_tips)
# ============================================================================
extended_policies:
- id: order_ext_wrong_item_kept_refund
  base_policy_refs: [order_agg_refund_review, order_evt_substitutions, order_evt_item_refunds, order_evt_weighted_items,
    order_evt_alcohol_and_returns]
  overwrite:
  - base_policy: order_evt_item_refunds
    superseded_clause: >-
      A missing, damaged, wrong_item or quality refund targets one billed line, named by order and line_number, and
      pays back that line's charge for the affected units at the billed unit price.
    replaced_by: >-
      When the order entries show that the replacement handed over on a line whose substitution the customer approved
      is a different product from the approved replacement, the customer keeps the product handed over and the line
      is refunded with refund_reason wrong_item at the wrong-item refund this rule computes, not at the line's full
      charge.
  trigger: state_due
  subject: [order_item_refunded]
  computes: amount_usd
  target_tool: refund_wrong_item_79d6dec9
  params:
    share_monthly_pct: 60
    share_annual_pct: 75
    share_standard_pct: 40
    monthly_fee_count: 6
    annual_fee_count: 1
    perishable_adj_pct: 10
    shelf_adj_pct: 5
    credit_two_days_usd: 0.40
    credit_one_day_usd: 0.20
    uplift_large_pct: 5
    uplift_mid_pct: 2
    large_basket_usd: 50.0
    large_basket_lines: 5
  rule: >-
    When the order entries show that the replacement handed over on a line whose substitution the customer approved
    is a different product from the approved replacement, the customer keeps the product handed over and the line
    is refunded with refund_reason wrong_item at the wrong-item refund this rule computes, not at the line's full
    charge. The wrong-item value is the line's billed charge, that is the sum of the amounts billed on the line
    whose substitution the customer approved. The wrong-item keep share is 40 percent. The wrong-item refund is the wrong-item value times the
    wrong-item keep share, rounded to the cent. Months are counted by anniversary: between an earlier date and a later date as many whole months have passed as there are monthly anniversaries of the earlier date falling on or before the later date, so a period fee counts as charged within the last N whole calendar months when fewer than N such months have passed from its charge date to today, and a fee charged earlier in the current month is 0 months old. The wrong-item keep share depends on the Cartwise+ membership recorded on the order: when that membership is on a monthly plan and the customer's membership ledger shows at
    least 6 period fees charged within the last 6 whole calendar months, the share is 60 percent; when that
    membership is on an annual plan and the ledger shows at least 1 period fee charged within the last 12 whole
    calendar months, the share is 75 percent; in every other case the share is 40 percent. The wrong-item value
    depends on how the billed unit price compares with the original unit price on the line: when the billed unit
    price is below the original unit price, the value is the original unit price times the billed units, rounded to
    the cent; when the billed unit price is above the original unit price, the value is the average of the billed
    and the original unit price times the billed units, rounded to the cent; when the two prices are equal, the
    value is the line's billed charge. The wrong-item class points are added to the keep share before it is applied:
    a perishable product on an order whose service level delivers adds 10 share points; a pantry or household
    product on an order whose service level delivers adds 5 share points; any other product, or any product on a
    pickup order, adds none. The wrong-item basket uplift raises the refund after the share is applied: when the
    order's item subtotal (the sum of its billed item lines) is at least 50.00 and the order has at least 5 billed
    item lines, the refund is raised by 5 percent; when the item subtotal is at least 50.00 and the order has fewer
    than 5 billed item lines, it is raised by 2 percent; otherwise it is not raised. The wrong-item standing credit
    is added after rounding: when at least 2 calendar days have passed from the date of completed_at to today and
    no wrong-item refund stands on the order yet, the credit is 0.40; when exactly 1 calendar day has passed and no
    wrong-item refund stands on the order yet, the credit is 0.20; otherwise there is no credit. In full, the
    wrong-item value is multiplied by the sum of the keep share and the class points (as a percentage), that result
    is multiplied by 1 plus the basket uplift percentage, the product is rounded to the cent once, and the standing
    credit is then added. The refund never exceeds the line's billed charge minus the wrong-item refunds already
    standing on the order.
  prerequisite: []
  cross_category:
  - category: membership
    as: history
    reads: [variant_name, membership_events.event_type, membership_events.event_date]
    note: The wrong-item keep share tier is decided from the plan's billing cycle and the count of period fees in the
      customer's membership ledger.
  compute:
  - wi_line_charge: "SUM('order_events','amount_usd', event_type='order_item_charged', substitution_decision='approved_by_customer')"
  - wi_line_units: "SUM('order_events','quantity', event_type='order_item_charged', substitution_decision='approved_by_customer')"
  - wi_billed_price: "MAX('order_events','unit_price_usd', event_type='order_item_charged', substitution_decision='approved_by_customer')"
  - wi_original_price: "MAX('order_events','original_unit_price_usd', event_type='order_item_charged', substitution_decision='approved_by_customer')"
  - wi_line_refunded: "SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='wrong_item')"
  - wi_line_class: "LATEST('order_events','item_category', event_type='order_item_charged', substitution_decision='approved_by_customer')"
  - wi_plan_cycle: "CPARAM('membership','billing_cycle', membership_id=F('membership_id'))"
  - wi_plan_fees_6m: "XCOUNT('membership','membership_events', within_months=6, event_type='membership_fee_charged')"
  - wi_plan_fees_12m: "XCOUNT('membership','membership_events', within_months=12, event_type='membership_fee_charged')"
  - wi_keep_share_pct: "K('share_monthly_pct') if (wi_plan_cycle == 'monthly' and wi_plan_fees_6m >= K('monthly_fee_count')) else (K('share_annual_pct') if (wi_plan_cycle == 'annual' and wi_plan_fees_12m >= K('annual_fee_count')) else K('share_standard_pct'))"
  - wi_value: "RND(wi_original_price * wi_line_units) if wi_billed_price < wi_original_price else (RND((wi_billed_price + wi_original_price) / 2 * wi_line_units) if wi_billed_price > wi_original_price else wi_line_charge)"
  - wi_class_adj_pct: "K('perishable_adj_pct') if (wi_line_class == 'perishable' and P('fulfillment_mode') == 'delivery') else (K('shelf_adj_pct') if ((wi_line_class == 'pantry' or wi_line_class == 'household') and P('fulfillment_mode') == 'delivery') else 0)"
  - wi_order_subtotal: "SUM('order_events','amount_usd', event_type='order_item_charged')"
  - wi_order_lines: "COUNT('order_events', event_type='order_item_charged')"
  - wi_basket_uplift_pct: "K('uplift_large_pct') if (wi_order_subtotal >= K('large_basket_usd') and wi_order_lines >= K('large_basket_lines')) else (K('uplift_mid_pct') if (wi_order_subtotal >= K('large_basket_usd') and wi_order_lines < K('large_basket_lines')) else 0)"
  - wi_days_since_completion: "DAYS(F('completed_at'), NOW)"
  - wi_standing_credit: "K('credit_two_days_usd') if (wi_days_since_completion >= 2 and wi_line_refunded == 0) else (K('credit_one_day_usd') if (wi_days_since_completion == 1 and wi_line_refunded == 0) else 0)"
  - result: "RND(MN(MX(0, wi_line_charge - wi_line_refunded), RND(wi_value * (wi_keep_share_pct + wi_class_adj_pct) / 100 * (1 + wi_basket_uplift_pct / 100)) + wi_standing_credit))"
  compute_basis:
    wi_line_charge: "The wrong-item value is the line's billed charge, that is the sum of the amounts billed on the line whose substitution the customer approved."
    wi_line_units: "when the billed unit price is below the original unit price, the value is the original unit price times the billed units, rounded to the cent"
    wi_billed_price: "The wrong-item value depends on how the billed unit price compares with the original unit price on the line"
    wi_original_price: "The wrong-item value depends on how the billed unit price compares with the original unit price on the line"
    wi_line_refunded: "The refund never exceeds the line's billed charge minus the wrong-item refunds already standing on the order."
    wi_line_class: "a perishable product on an order whose service level delivers adds 10 share points; a pantry or household product on an order whose service level delivers adds 5 share points"
    wi_plan_cycle: "The wrong-item keep share depends on the Cartwise+ membership recorded on the order"
    wi_plan_fees_6m: "Months are counted by anniversary: between an earlier date and a later date as many whole months have passed as there are monthly anniversaries of the earlier date falling on or before the later date, so a period fee counts as charged within the last N whole calendar months when fewer than N such months have passed from its charge date to today, and a fee charged earlier in the current month is 0 months old. ... when that membership is on a monthly plan and the customer's membership ledger shows at least 6 period fees charged within the last 6 whole calendar months, the share is 60 percent"
    wi_plan_fees_12m: "when that membership is on an annual plan and the ledger shows at least 1 period fee charged within the last 12 whole calendar months, the share is 75 percent"
    wi_keep_share_pct: "when that membership is on a monthly plan and the customer's membership ledger shows at least 6 period fees charged within the last 6 whole calendar months, the share is 60 percent; when that membership is on an annual plan and the ledger shows at least 1 period fee charged within the last 12 whole calendar months, the share is 75 percent; in every other case the share is 40 percent."
    wi_value: "when the billed unit price is below the original unit price, the value is the original unit price times the billed units, rounded to the cent; when the billed unit price is above the original unit price, the value is the average of the billed and the original unit price times the billed units, rounded to the cent; when the two prices are equal, the value is the line's billed charge."
    wi_class_adj_pct: "a perishable product on an order whose service level delivers adds 10 share points; a pantry or household product on an order whose service level delivers adds 5 share points; any other product, or any product on a pickup order, adds none."
    wi_order_subtotal: "when the order's item subtotal (the sum of its billed item lines) is at least 50.00"
    wi_order_lines: "and the order has at least 5 billed item lines"
    wi_basket_uplift_pct: "when the order's item subtotal (the sum of its billed item lines) is at least 50.00 and the order has at least 5 billed item lines, the refund is raised by 5 percent; when the item subtotal is at least 50.00 and the order has fewer than 5 billed item lines, it is raised by 2 percent; otherwise it is not raised."
    wi_days_since_completion: "when at least 2 calendar days have passed from the date of completed_at to today"
    wi_standing_credit: "when at least 2 calendar days have passed from the date of completed_at to today and no wrong-item refund stands on the order yet, the credit is 0.40; when exactly 1 calendar day has passed and no wrong-item refund stands on the order yet, the credit is 0.20; otherwise there is no credit."
    result: "In full, the wrong-item value is multiplied by the sum of the keep share and the class points (as a percentage), that result is multiplied by 1 plus the basket uplift percentage, the product is rounded to the cent once, and the standing credit is then added. The refund never exceeds the line's billed charge minus the wrong-item refunds already standing on the order."
  factors:
  - id: wrong_item_keep_share
    effect: parameter
    decides: wi_keep_share_pct
    bindings: [wi_plan_cycle, wi_plan_fees_6m, wi_plan_fees_12m, wi_keep_share_pct]
    ladder:
    - when: the membership recorded on the order is on a monthly plan AND the membership ledger shows at least 6 period fees in the last 6 whole months
      value: K('share_monthly_pct')
    - when: the membership recorded on the order is on an annual plan AND the membership ledger shows at least 1 period fee in the last 12 whole months
      value: K('share_annual_pct')
    - when: otherwise
      value: K('share_standard_pct')
    baseline:
      wi_keep_share_pct: "K('share_standard_pct')"
    evidence: [cross_category, history]
    cross_difficulty: membership
  - id: wrong_item_value_basis
    effect: method
    decides: wi_value
    bindings: [wi_billed_price, wi_original_price, wi_line_units, wi_value]
    ladder:
    - when: the billed unit price is below the original unit price
      method: original unit price times billed units, rounded to the cent
    - when: the billed unit price is above the original unit price
      method: average of billed and original unit price times billed units, rounded to the cent
    - when: otherwise (the two prices are equal)
      method: the line's billed charge
    baseline:
      wi_value: "wi_line_charge"
    evidence: [history]
    cross_difficulty: null
  - id: wrong_item_class_points
    effect: parameter
    decides: wi_class_adj_pct
    bindings: [wi_line_class, wi_class_adj_pct]
    ladder:
    - when: the product is perishable AND the order's service level delivers
      value: K('perishable_adj_pct')
    - when: the product is pantry or household AND the order's service level delivers
      value: K('shelf_adj_pct')
    - when: otherwise
      value: "0"
    baseline:
      wi_class_adj_pct: "0"
    evidence: [history, tier_param]
    cross_difficulty: null
  - id: wrong_item_basket_uplift
    effect: parameter
    decides: wi_basket_uplift_pct
    bindings: [wi_order_subtotal, wi_order_lines, wi_basket_uplift_pct]
    ladder:
    - when: item subtotal at least 50.00 AND at least 5 billed item lines
      value: K('uplift_large_pct')
    - when: item subtotal at least 50.00 AND fewer than 5 billed item lines
      value: K('uplift_mid_pct')
    - when: otherwise
      value: "0"
    baseline:
      wi_basket_uplift_pct: "0"
    evidence: [history]
    cross_difficulty: null
  - id: wrong_item_standing_credit
    effect: parameter
    decides: wi_standing_credit
    bindings: [wi_days_since_completion, wi_standing_credit]
    ladder:
    - when: at least 2 calendar days since completion AND no wrong-item refund standing on the order
      value: K('credit_two_days_usd')
    - when: exactly 1 calendar day since completion AND no wrong-item refund standing on the order
      value: K('credit_one_day_usd')
    - when: otherwise
      value: "0"
    baseline:
      wi_standing_credit: "0"
    evidence: [date, history]
    cross_difficulty: null
  baseline:
    rule: >-
      The wrong-item value is the line's billed charge, that is the sum of the amounts billed on the line whose
      substitution the customer approved. The wrong-item keep share is 40 percent. The wrong-item refund is the wrong-item value times the
      wrong-item keep share, rounded to the cent.
    params: [share_standard_pct]
  inputs:
    history:
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_item_charged, substitution_decision: approved_by_customer}}
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_item_refunded, refund_reason: wrong_item}}
    - {table: order_events, aggregate: count, field: order_event_id, filters: {event_type: order_item_charged}}
    - {category: membership, table: membership_events, aggregate: count, field: membership_event_id, within_months: 6, filters: {event_type: membership_fee_charged}}
    - {category: membership, table: membership_events, aggregate: count, field: membership_event_id, within_months: 12, filters: {event_type: membership_fee_charged}}
    cross_category: [membership]
- id: order_ext_unfound_line_refund
  base_policy_refs: [order_agg_refund_review, order_evt_substitutions, order_evt_item_refunds, order_evt_weighted_items,
    order_evt_alcohol_and_returns]
  overwrite:
  - base_policy: order_evt_item_refunds
    superseded_clause: >-
      The agent may grant item refunds on one order only up to the lower of self_service_refund_cap_usd and self_service_refund_cap_pct
      of order_msr_item_subtotal, counting order_msr_refunded_on_order already granted; the part above the cap is
      registered for review with request_type refund_over_cap and is not booked.
    replaced_by: >-
      The unfound-line refund is booked only up to the unfound-line room, and the part of the line's charge above that
      room is not booked by this refund.
  - base_policy: order_evt_substitutions
    superseded_clause: >-
      A not_found_refunded line is never billed, so it has nothing to refund.
    replaced_by: >-
      A line that the order entries show as billed although the shopper's substitution decision for it records the
      product as not found (not_found_refunded) was never handed over, and its charge is refunded with refund_reason
      missing without waiting for the customer to report it.
  trigger: state_due
  subject: [order_item_refunded]
  computes: amount_usd
  target_tool: refund_unfound_item_93423917
  params:
    cap_pct_monthly: 55
    cap_pct_annual: 60
    monthly_fee_count: 6
    annual_fee_count: 1
    topup_two_days_usd: 5.00
    topup_one_day_usd: 2.50
    tenure_long_months: 36
    tenure_mid_months: 12
    tenure_long_usd: 3.00
    tenure_mid_usd: 1.50
  rule: >-
    A line that the order entries show as billed although the shopper's substitution decision for it records the
    product as not found (not_found_refunded) was never handed over, and its charge is refunded with refund_reason
    missing without waiting for the customer to report it. The unfound-line refund is fixed only after every
    wrong-item refund owed on the order's approved replacements stands on the order. The unfound-line refund is booked
    only up to the unfound-line room, and the part of the line's charge above that room is not booked by this refund.
    The unfound-line room governs only a line recorded as not found; every other missing, damaged, wrong_item or quality
    refund the agent books on the order stays within the lower of self_service_refund_cap_usd and
    self_service_refund_cap_pct of the order's item subtotal, counting the item refunds already granted, and the part
    of it above that cap is registered for review with request_type refund_over_cap and is not booked.
    Months are counted by anniversary: between an earlier date and a later date as many whole months have passed as
    there are monthly anniversaries of the earlier date falling on or before the later date, so a period fee counts
    as charged within the last N whole calendar months when fewer than N such months have passed from its charge
    date to today, and a fee charged earlier in the current month is 0 months old.
    The unfound-line charge is the sum of the amounts billed on the line recorded as not found, less any missing
    refund already standing on the order. The unfound-line cap basis is the order's item subtotal, the sum of its
    billed item lines. The unfound-line cap share is self_service_refund_cap_pct of the order's service level. The
    unfound-line room is the lower of self_service_refund_cap_usd and the cap share of the cap basis (rounded to the
    cent), less the item refunds already granted on the order for missing, damaged, wrong_item and quality issues,
    and never below zero. The unfound-line refund is the lower of the unfound-line charge and the unfound-line room.
    The unfound-line cap share depends on the Cartwise+ membership recorded on the order: when that membership is on a
    monthly plan and the customer's membership ledger shows at least 6 period fees charged within the last 6 whole
    calendar months, the share is 55 percent; when that membership is on an annual plan and the ledger shows at least
    1 period fee charged within the last 12 whole calendar months, the share is 60 percent; in every other case it is
    self_service_refund_cap_pct of the order's service level. The unfound-line cap basis depends on the fees on the
    order: when the order carries fee waivers from a membership benefit and also carries billed fees, the basis is
    the item subtotal plus the fee amounts waived; when the order carries no fee waiver but carries billed fees, the
    basis is the item subtotal plus the fees billed; otherwise the basis is the item subtotal alone. The unfound-line
    room top-up is added to the room before the refunds already granted are taken off: when at least 2 calendar days
    have passed from the date of completed_at to today and no missing refund stands on the order yet, the top-up is
    5.00; when exactly 1 calendar day has passed and no missing refund stands on the order yet, it is 2.50; otherwise
    there is no top-up. The unfound-line tenure allowance is added to the room in the same way: when the membership
    recorded on the order was enrolled at least 36 whole calendar months before the order's placed date, the
    allowance is 3.00; when it was enrolled at least 12 and fewer than 36 whole calendar months before, it is 1.50;
    otherwise, or when no membership is recorded, there is none. In full, the room is the lower of
    self_service_refund_cap_usd and the rounded cap share of the cap basis, plus the top-up and the tenure allowance,
    less the refunds already granted, never below zero, and the refund is the lower of that room and the
    unfound-line charge.
  prerequisite:
  - problem: order_ext_wrong_item_kept_refund
    kind: value_input
    gate: m_granted_on_order
    form: state
    policy_source: >-
      The unfound-line refund is fixed only after every wrong-item refund owed on the order's approved replacements
      stands on the order.
    condition: >-
      order_events carries an order_item_refunded entry with refund_reason wrong_item for every approved-replacement
      line whose billed replacement differs from the replacement the customer approved.
    resolved_by: refund_wrong_item_79d6dec9
    effect: >-
      The wrong-item refund enters the refunds already granted on the order (m_granted_on_order), lowering the
      unfound-line room by its amount; the wrong-item policy states that it books that refund with refund_reason
      wrong_item.
  cross_category:
  - category: membership
    as: history
    reads: [variant_name, enrolled_date, membership_events.event_type, membership_events.event_date]
    note: The unfound-line cap share tier is read from the plan's billing cycle and the membership ledger's period
      fees; the tenure allowance from the membership's enrollment date.
  compute:
  - m_line_charge: "MX(0, SUM('order_events','amount_usd', event_type='order_item_charged', substitution_decision='not_found_refunded') - SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='missing'))"
  - m_item_subtotal: "SUM('order_events','amount_usd', event_type='order_item_charged')"
  - m_granted_on_order: "SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='missing') + SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='damaged') + SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='wrong_item') + SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='quality')"
  - m_plan_cycle: "CPARAM('membership','billing_cycle', membership_id=F('membership_id'))"
  - m_plan_fees_6m: "XCOUNT('membership','membership_events', within_months=6, event_type='membership_fee_charged')"
  - m_plan_fees_12m: "XCOUNT('membership','membership_events', within_months=12, event_type='membership_fee_charged')"
  - m_cap_pct: "K('cap_pct_monthly') if (m_plan_cycle == 'monthly' and m_plan_fees_6m >= K('monthly_fee_count')) else (K('cap_pct_annual') if (m_plan_cycle == 'annual' and m_plan_fees_12m >= K('annual_fee_count')) else P('self_service_refund_cap_pct'))"
  - m_fees_waived: "SUM('order_events','amount_usd', event_type='order_fee_waived')"
  - m_fees_billed: "SUM('order_events','amount_usd', event_type='order_fee_charged')"
  - m_cap_basis: "m_item_subtotal + m_fees_waived if (m_fees_waived > 0 and m_fees_billed > 0) else (m_item_subtotal + m_fees_billed if (m_fees_waived == 0 and m_fees_billed > 0) else m_item_subtotal)"
  - m_days_since_completion: "DAYS(F('completed_at'), NOW)"
  - m_missing_standing: "SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='missing')"
  - m_room_topup: "K('topup_two_days_usd') if (m_days_since_completion >= 2 and m_missing_standing == 0) else (K('topup_one_day_usd') if (m_days_since_completion == 1 and m_missing_standing == 0) else 0)"
  - m_enrolled_date: "CFIELD('membership','enrolled_date', membership_id=F('membership_id'))"
  - m_tenure_months: "MONTHS(m_enrolled_date, F('placed_date')) if m_enrolled_date else 0"
  - m_tenure_allowance: "K('tenure_long_usd') if m_tenure_months >= K('tenure_long_months') else (K('tenure_mid_usd') if m_tenure_months >= K('tenure_mid_months') else 0)"
  - m_room: "MX(0, MN(P('self_service_refund_cap_usd'), RND(m_cap_basis * m_cap_pct / 100)) + m_room_topup + m_tenure_allowance - m_granted_on_order)"
  - result: "RND(MN(m_line_charge, m_room))"
  compute_basis:
    m_line_charge: "The unfound-line charge is the sum of the amounts billed on the line recorded as not found, less any missing refund already standing on the order."
    m_item_subtotal: "The unfound-line cap basis is the order's item subtotal, the sum of its billed item lines."
    m_granted_on_order: "less the item refunds already granted on the order for missing, damaged, wrong_item and quality issues, and never below zero"
    m_plan_cycle: "The unfound-line cap share depends on the Cartwise+ membership recorded on the order"
    m_plan_fees_6m: "Months are counted by anniversary: between an earlier date and a later date as many whole months have passed as there are monthly anniversaries of the earlier date falling on or before the later date, so a period fee counts as charged within the last N whole calendar months when fewer than N such months have passed from its charge date to today, and a fee charged earlier in the current month is 0 months old. ... when that membership is on a monthly plan and the customer's membership ledger shows at least 6 period fees charged within the last 6 whole calendar months, the share is 55 percent"
    m_plan_fees_12m: "when that membership is on an annual plan and the ledger shows at least 1 period fee charged within the last 12 whole calendar months, the share is 60 percent"
    m_cap_pct: "when that membership is on a monthly plan and the customer's membership ledger shows at least 6 period fees charged within the last 6 whole calendar months, the share is 55 percent; when that membership is on an annual plan and the ledger shows at least 1 period fee charged within the last 12 whole calendar months, the share is 60 percent; in every other case it is self_service_refund_cap_pct of the order's service level."
    m_fees_waived: "when the order carries fee waivers from a membership benefit and also carries billed fees, the basis is the item subtotal plus the fee amounts waived"
    m_fees_billed: "when the order carries no fee waiver but carries billed fees, the basis is the item subtotal plus the fees billed"
    m_cap_basis: "when the order carries fee waivers from a membership benefit and also carries billed fees, the basis is the item subtotal plus the fee amounts waived; when the order carries no fee waiver but carries billed fees, the basis is the item subtotal plus the fees billed; otherwise the basis is the item subtotal alone."
    m_days_since_completion: "when at least 2 calendar days have passed from the date of completed_at to today"
    m_missing_standing: "and no missing refund stands on the order yet"
    m_room_topup: "when at least 2 calendar days have passed from the date of completed_at to today and no missing refund stands on the order yet, the top-up is 5.00; when exactly 1 calendar day has passed and no missing refund stands on the order yet, it is 2.50; otherwise there is no top-up."
    m_enrolled_date: "when the membership recorded on the order was enrolled at least 36 whole calendar months before the order's placed date"
    m_tenure_months: "Months are counted by anniversary: between an earlier date and a later date as many whole months have passed as there are monthly anniversaries of the earlier date falling on or before the later date, so a period fee counts as charged within the last N whole calendar months when fewer than N such months have passed from its charge date to today, and a fee charged earlier in the current month is 0 months old. ... when the membership recorded on the order was enrolled at least 36 whole calendar months before the order's placed date"
    m_tenure_allowance: "when the membership recorded on the order was enrolled at least 36 whole calendar months before the order's placed date, the allowance is 3.00; when it was enrolled at least 12 and fewer than 36 whole calendar months before, it is 1.50; otherwise, or when no membership is recorded, there is none."
    m_room: "In full, the room is the lower of self_service_refund_cap_usd and the rounded cap share of the cap basis, plus the top-up and the tenure allowance, less the refunds already granted, never below zero"
    result: "and the refund is the lower of that room and the unfound-line charge."
  factors:
  - id: unfound_line_cap_share
    effect: parameter
    decides: m_cap_pct
    bindings: [m_plan_cycle, m_plan_fees_6m, m_plan_fees_12m, m_cap_pct]
    ladder:
    - when: membership on a monthly plan AND at least 6 period fees in the last 6 whole months
      value: K('cap_pct_monthly')
    - when: membership on an annual plan AND at least 1 period fee in the last 12 whole months
      value: K('cap_pct_annual')
    - when: otherwise
      value: P('self_service_refund_cap_pct')
    baseline:
      m_cap_pct: "P('self_service_refund_cap_pct')"
    evidence: [cross_category, history]
    cross_difficulty: membership
  - id: unfound_line_cap_basis
    effect: method
    decides: m_cap_basis
    bindings: [m_fees_waived, m_fees_billed, m_cap_basis]
    ladder:
    - when: the order carries membership fee waivers AND carries billed fees
      method: item subtotal plus the fee amounts waived
    - when: the order carries no fee waiver AND carries billed fees
      method: item subtotal plus the fees billed
    - when: otherwise
      method: item subtotal alone
    baseline:
      m_cap_basis: "m_item_subtotal"
    evidence: [history]
    cross_difficulty: null
  - id: unfound_line_room_topup
    effect: parameter
    decides: m_room_topup
    bindings: [m_days_since_completion, m_missing_standing, m_room_topup]
    ladder:
    - when: at least 2 calendar days since completion AND no missing refund standing on the order
      value: K('topup_two_days_usd')
    - when: exactly 1 calendar day since completion AND no missing refund standing on the order
      value: K('topup_one_day_usd')
    - when: otherwise
      value: "0"
    baseline:
      m_room_topup: "0"
    evidence: [date, history]
    cross_difficulty: null
  - id: unfound_line_tenure_allowance
    effect: parameter
    decides: m_tenure_allowance
    bindings: [m_enrolled_date, m_tenure_months, m_tenure_allowance]
    ladder:
    - when: membership enrolled at least 36 whole months before the placed date
      value: K('tenure_long_usd')
    - when: membership enrolled 12 to 35 whole months before the placed date
      value: K('tenure_mid_usd')
    - when: otherwise
      value: "0"
    baseline:
      m_tenure_allowance: "0"
    evidence: [cross_category, date]
    cross_difficulty: membership
  baseline:
    rule: >-
      The unfound-line charge is the sum of the amounts billed on the line recorded as not found, less any missing
      refund already standing on the order. The unfound-line cap basis is the order's item subtotal, the sum of its
      billed item lines. The unfound-line cap share is self_service_refund_cap_pct of the order's service level. The
      unfound-line room is the lower of self_service_refund_cap_usd and the cap share of the cap basis (rounded to
      the cent), less the item refunds already granted on the order for missing, damaged, wrong_item and quality
      issues, and never below zero. The unfound-line refund is the lower of the unfound-line charge and the
      unfound-line room.
    params: [self_service_refund_cap_pct, self_service_refund_cap_usd]
  inputs:
    history:
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_item_charged}}
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_item_refunded}}
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_fee_waived}}
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_fee_charged}}
    - {category: membership, table: membership_events, aggregate: count, field: membership_event_id, within_months: 6, filters: {event_type: membership_fee_charged}}
    cross_category: [membership]
- id: order_ext_over_cap_review_amount
  base_policy_refs: [order_agg_refund_review, order_evt_substitutions, order_evt_item_refunds, order_evt_weighted_items,
    order_evt_alcohol_and_returns]
  overwrite:
  - base_policy: order_evt_item_refunds
    superseded_clause: >-
      The agent may grant item refunds on one order only up to the lower of self_service_refund_cap_usd and self_service_refund_cap_pct
      of order_msr_item_subtotal, counting order_msr_refunded_on_order already granted; the part above the cap is
      registered for review with request_type refund_over_cap and is not booked.
    replaced_by: >-
      When the refund of a line recorded as not found stops at the room left under the per-order self-service cap,
      the agent registers the over-cap amount this rule computes for review with request_type refund_over_cap on that
      line and with its refund_reason missing; nothing of it is booked as a refund.
  - base_policy: order_evt_substitutions
    superseded_clause: >-
      A not_found_refunded line is never billed, so it has nothing to refund.
    replaced_by: >-
      A line billed although its substitution decision records it as not found carries a charge to refund despite that
      decision, and the part of it above the room is carried to review by this rule.
  trigger: state_due
  subject: [order_item_refunded]
  computes: requested_amount_usd
  target_tool: register_over_cap_review_9b0d89a0
  params:
    loyalty_high_pct: 5
    loyalty_low_pct: 2
    loyalty_fee_count: 6
    days_perishable_usd: 1.00
    days_shelf_usd: 0.50
    handling_large_usd: 0.75
    handling_small_usd: 0.50
    handling_lines: 5
  rule: >-
    When the refund of a line recorded as not found stops at the room left under the per-order self-service cap, the
    agent registers the over-cap amount this rule computes for review with request_type refund_over_cap on that line
    and with its refund_reason missing; nothing of it is booked as a refund. A line billed although its substitution
    decision records it as not found carries a charge to refund despite that decision, and the part of it above the
    room is carried to review by this rule. This rule prices only that over-cap part of a line recorded as not found;
    for every other missing, damaged, wrong_item or quality refund the agent books, the part above the lower of
    self_service_refund_cap_usd and self_service_refund_cap_pct of the order's item subtotal (counting the item refunds
    already granted) is registered for review with request_type refund_over_cap at that part's amount.
    Months are counted by anniversary: between an earlier date and a later date as many whole months have passed as
    there are monthly anniversaries of the earlier date falling on or before the later date, so a period fee counts
    as charged within the last N whole calendar months when fewer than N such months have passed from its charge
    date to today, and a fee charged earlier in the current month is 0 months old.
    The over-cap amount is not registered
    until the refund of the unfound line stands on the order up to the room left under the per-order cap. The
    over-cap claim value is the sum of the amounts billed on the line recorded as not found. The over-cap amount is
    the over-cap claim value less the missing refund standing on the order, rounded to the cent. The over-cap claim
    value depends on how the billed unit price compares with the original unit price on that line: when the billed
    unit price is below the original unit price, the claim value is the original unit price times the billed units;
    when the billed unit price is above the original unit price, it is the average of the two prices times the billed
    units; when they are equal, it is the line's billed charge; each is rounded to the cent. The over-cap fee part is
    added to the claim value: when the order carries a service-fee waiver from the member service-fee rate and a
    Cartwise+ plan is recorded on the order, the fee part is the claim value times the member_service_fee_rate_pct of
    that plan; when
    the order carries no such waiver but a service fee is billed, it is the claim value times the service fee billed
    divided by the order's item subtotal; otherwise there is no fee part; the fee part is rounded to the cent. The
    over-cap loyalty raise then applies to the claim value plus the fee part: when the customer's membership ledger
    shows at least 6 period fees charged within the last 6 whole calendar months, it is raised by 5 percent; when it
    shows at least 1 and fewer than 6 such fees, by 2 percent; otherwise it is not raised; the raised figure is
    rounded to the cent. The over-cap days credit is added after the missing refund is taken off: when at least 2
    calendar days have passed from the date of completed_at to today and the line is perishable, the credit is 1.00;
    when at least 2 calendar days have passed and the line is not perishable, it is 0.50; otherwise there is none.
    The over-cap handling credit is added in the same way: when the order's service level delivers and the order has
    at least 5 billed item lines, it is 0.75; when the service level delivers and the order has fewer than 5 billed
    item lines, it is 0.50; for a pickup order there is none. In full, the claim value plus the fee part is raised by
    the loyalty percentage and rounded, the missing refund standing on the order is subtracted (never below zero),
    and the days credit and the handling credit are added.
  prerequisite:
  - problem: order_ext_unfound_line_refund
    kind: value_input
    gate: oc_missing_granted
    form: state
    policy_source: >-
      The over-cap amount is not registered until the refund of the unfound line stands on the order up to the room
      left under the per-order cap.
    condition: >-
      order_events carries an order_item_refunded entry with refund_reason missing on the line recorded as not found,
      booked at the unfound-line room.
    resolved_by: refund_unfound_item_93423917
    effect: >-
      The missing refund standing on the order (oc_missing_granted) rises from zero to the booked unfound-line refund,
      and the over-cap amount falls by the same figure; the unfound-line policy states that it books that refund with
      refund_reason missing up to the room.
  cross_category:
  - category: membership
    as: history
    reads: [member_service_fee_rate_pct, membership_events.event_type, membership_events.event_date]
    note: The over-cap fee part reads the member service-fee rate of the plan on the order; the loyalty raise counts
      period fees in the membership ledger.
  compute:
  - oc_line_charge: "SUM('order_events','amount_usd', event_type='order_item_charged', substitution_decision='not_found_refunded')"
  - oc_line_units: "SUM('order_events','quantity', event_type='order_item_charged', substitution_decision='not_found_refunded')"
  - oc_billed_price: "MAX('order_events','unit_price_usd', event_type='order_item_charged', substitution_decision='not_found_refunded')"
  - oc_original_price: "MAX('order_events','original_unit_price_usd', event_type='order_item_charged', substitution_decision='not_found_refunded')"
  - oc_missing_granted: "SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='missing')"
  - oc_claim_value: "RND(oc_original_price * oc_line_units) if oc_billed_price < oc_original_price else (RND((oc_billed_price + oc_original_price) / 2 * oc_line_units) if oc_billed_price > oc_original_price else oc_line_charge)"
  - oc_member_rate_waived: "SUM('order_events','amount_usd', event_type='order_fee_waived', waiver_basis='member_service_fee_rate')"
  - oc_service_fee_billed: "SUM('order_events','amount_usd', event_type='order_fee_charged', fee_type='service')"
  - oc_item_subtotal: "SUM('order_events','amount_usd', event_type='order_item_charged')"
  - oc_plan_rate: "CPARAM('membership','member_service_fee_rate_pct', membership_id=F('membership_id'))"
  - oc_fee_part: "RND(oc_claim_value * oc_plan_rate / 100) if (oc_member_rate_waived > 0 and oc_plan_rate) else (RND(oc_claim_value * oc_service_fee_billed / oc_item_subtotal) if (oc_member_rate_waived == 0 and oc_service_fee_billed > 0) else 0)"
  - oc_plan_fees_6m: "XCOUNT('membership','membership_events', within_months=6, event_type='membership_fee_charged')"
  - oc_loyalty_pct: "K('loyalty_high_pct') if oc_plan_fees_6m >= K('loyalty_fee_count') else (K('loyalty_low_pct') if oc_plan_fees_6m >= 1 else 0)"
  - oc_days_since_completion: "DAYS(F('completed_at'), NOW)"
  - oc_line_class: "LATEST('order_events','item_category', event_type='order_item_charged', substitution_decision='not_found_refunded')"
  - oc_days_credit: "K('days_perishable_usd') if (oc_days_since_completion >= 2 and oc_line_class == 'perishable') else (K('days_shelf_usd') if (oc_days_since_completion >= 2 and oc_line_class != 'perishable') else 0)"
  - oc_order_lines: "COUNT('order_events', event_type='order_item_charged')"
  - oc_handling_credit: "K('handling_large_usd') if (P('fulfillment_mode') == 'delivery' and oc_order_lines >= K('handling_lines')) else (K('handling_small_usd') if (P('fulfillment_mode') == 'delivery' and oc_order_lines < K('handling_lines')) else 0)"
  - result: "RND(MX(0, RND((oc_claim_value + oc_fee_part) * (1 + oc_loyalty_pct / 100)) - oc_missing_granted) + oc_days_credit + oc_handling_credit)"
  compute_basis:
    oc_line_charge: "The over-cap claim value is the sum of the amounts billed on the line recorded as not found."
    oc_line_units: "when the billed unit price is below the original unit price, the claim value is the original unit price times the billed units"
    oc_billed_price: "The over-cap claim value depends on how the billed unit price compares with the original unit price on that line"
    oc_original_price: "The over-cap claim value depends on how the billed unit price compares with the original unit price on that line"
    oc_missing_granted: "The over-cap amount is the over-cap claim value less the missing refund standing on the order, rounded to the cent."
    oc_claim_value: "when the billed unit price is below the original unit price, the claim value is the original unit price times the billed units; when the billed unit price is above the original unit price, it is the average of the two prices times the billed units; when they are equal, it is the line's billed charge; each is rounded to the cent."
    oc_member_rate_waived: "when the order carries a service-fee waiver from the member service-fee rate"
    oc_service_fee_billed: "when the order carries no such waiver but a service fee is billed, it is the claim value times the service fee billed divided by the order's item subtotal"
    oc_item_subtotal: "divided by the order's item subtotal"
    oc_plan_rate: "the fee part is the claim value times the member_service_fee_rate_pct of that plan"
    oc_fee_part: "when the order carries a service-fee waiver from the member service-fee rate and a Cartwise+ plan is recorded on the order, the fee part is the claim value times the member_service_fee_rate_pct of that plan; when the order carries no such waiver but a service fee is billed, it is the claim value times the service fee billed divided by the order's item subtotal; otherwise there is no fee part; the fee part is rounded to the cent."
    oc_plan_fees_6m: "when the customer's membership ledger shows at least 6 period fees charged within the last 6 whole calendar months ... so a period fee counts as charged within the last N whole calendar months when fewer than N such months have passed from its charge date to today"
    oc_loyalty_pct: "when the customer's membership ledger shows at least 6 period fees charged within the last 6 whole calendar months, it is raised by 5 percent; when it shows at least 1 and fewer than 6 such fees, by 2 percent; otherwise it is not raised; the raised figure is rounded to the cent."
    oc_days_since_completion: "when at least 2 calendar days have passed from the date of completed_at to today"
    oc_line_class: "and the line is perishable"
    oc_days_credit: "when at least 2 calendar days have passed from the date of completed_at to today and the line is perishable, the credit is 1.00; when at least 2 calendar days have passed and the line is not perishable, it is 0.50; otherwise there is none."
    oc_order_lines: "and the order has at least 5 billed item lines"
    oc_handling_credit: "when the order's service level delivers and the order has at least 5 billed item lines, it is 0.75; when the service level delivers and the order has fewer than 5 billed item lines, it is 0.50; for a pickup order there is none."
    result: "In full, the claim value plus the fee part is raised by the loyalty percentage and rounded, the missing refund standing on the order is subtracted (never below zero), and the days credit and the handling credit are added."
  factors:
  - id: over_cap_claim_value
    effect: method
    decides: oc_claim_value
    bindings: [oc_line_units, oc_billed_price, oc_original_price, oc_claim_value]
    ladder:
    - when: the billed unit price is below the original unit price
      method: original unit price times billed units, rounded to the cent
    - when: the billed unit price is above the original unit price
      method: average of the two prices times billed units, rounded to the cent
    - when: otherwise (equal prices)
      method: the line's billed charge
    baseline:
      oc_claim_value: "oc_line_charge"
    evidence: [history]
    cross_difficulty: null
  - id: over_cap_fee_part
    effect: method
    decides: oc_fee_part
    bindings: [oc_member_rate_waived, oc_service_fee_billed, oc_item_subtotal, oc_plan_rate, oc_fee_part]
    ladder:
    - when: the order carries a member service-fee rate waiver AND a Cartwise+ plan is recorded on the order
      method: claim value times the plan's member service-fee rate, rounded to the cent
    - when: the order carries no member-rate waiver AND a service fee is billed
      method: claim value times the service fee billed divided by the item subtotal, rounded to the cent
    - when: otherwise
      method: no fee part
    baseline:
      oc_fee_part: "0"
    evidence: [history, cross_category]
    cross_difficulty: membership
  - id: over_cap_loyalty_raise
    effect: parameter
    decides: oc_loyalty_pct
    bindings: [oc_plan_fees_6m, oc_loyalty_pct]
    ladder:
    - when: at least 6 period fees in the membership ledger in the last 6 whole months
      value: K('loyalty_high_pct')
    - when: 1 to 5 period fees in the membership ledger in the last 6 whole months
      value: K('loyalty_low_pct')
    - when: otherwise
      value: "0"
    baseline:
      oc_loyalty_pct: "0"
    evidence: [cross_category, history]
    cross_difficulty: membership
  - id: over_cap_days_credit
    effect: parameter
    decides: oc_days_credit
    bindings: [oc_days_since_completion, oc_line_class, oc_days_credit]
    ladder:
    - when: at least 2 calendar days since completion AND the line is perishable
      value: K('days_perishable_usd')
    - when: at least 2 calendar days since completion AND the line is not perishable
      value: K('days_shelf_usd')
    - when: otherwise
      value: "0"
    baseline:
      oc_days_credit: "0"
    evidence: [date, history]
    cross_difficulty: null
  - id: over_cap_handling_credit
    effect: parameter
    decides: oc_handling_credit
    bindings: [oc_order_lines, oc_handling_credit]
    ladder:
    - when: the service level delivers AND at least 5 billed item lines
      value: K('handling_large_usd')
    - when: the service level delivers AND fewer than 5 billed item lines
      value: K('handling_small_usd')
    - when: otherwise (pickup)
      value: "0"
    baseline:
      oc_handling_credit: "0"
    evidence: [history, tier_param]
    cross_difficulty: null
  baseline:
    rule: >-
      The over-cap claim value is the sum of the amounts billed on the line recorded as not found. The over-cap
      amount is the over-cap claim value less the missing refund standing on the order, rounded to the cent.
    params: []
  inputs:
    history:
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_item_charged, substitution_decision: not_found_refunded}}
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_item_refunded, refund_reason: missing}}
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_fee_waived, waiver_basis: member_service_fee_rate}}
    - {category: membership, table: membership_events, aggregate: count, field: membership_event_id, within_months: 6, filters: {event_type: membership_fee_charged}}
    cross_category: [membership]
- id: order_ext_limit_review_claim_amount
  base_policy_refs: [order_agg_refund_review, order_evt_substitutions, order_evt_item_refunds, order_evt_weighted_items,
    order_evt_alcohol_and_returns]
  overwrite:
  - base_policy: order_agg_refund_review
    superseded_clause: >-
      A new missing, damaged, wrong_item or quality refund may be granted by the agent only while order_msr_refund_count_90d
      is below refund_count_90d_limit and order_msr_refund_amount_90d plus the requested amount does not exceed
      refund_amount_90d_limit_usd, both taken from the service level of the order being refunded.
    replaced_by: >-
      The agent books a new missing, damaged, wrong_item or quality refund only while the customer's count of such
      refunds across all of their orders, dated within the rolling 90 calendar days ending today, is below
      refund_count_90d_limit and their amount in that window plus the amount now asked does not exceed
      refund_amount_90d_limit_usd, both taken from the service level of the order concerned.
  - base_policy: order_agg_refund_review
    superseded_clause: >-
      When either limit would be crossed, no refund is booked; the request is registered for review with request_type
      refund_limit_review and the review team decides it.
    replaced_by: >-
      When either limit would be crossed, nothing is booked by the agent and no part of the issue is registered as an over-cap request; the customer submits the whole issue as their own limit-review claim with request_type refund_limit_review, asking for the limit-review claim amount this rule
      computes, and the review team decides it.
  trigger: on_request
  subject: [order_item_refunded]
  computes: requested_amount_usd
  target_tool: submit_limit_review_claim_079a4c96
  params:
    goodwill_monthly_pct: 10
    goodwill_annual_pct: 15
    monthly_fee_count: 6
    annual_fee_count: 1
    days_multi_unit_usd: 1.50
    days_single_unit_usd: 1.00
    load_with_request_usd: 2.00
    load_without_request_usd: 1.00
    load_refund_count: 2
    basket_large_usd: 0.75
    basket_small_usd: 0.50
    basket_lines: 5
    basket_subtotal_usd: 50.0
  rule: >-
    The agent books a new missing, damaged, wrong_item or quality refund only while the customer's count of such
    refunds across all of their orders, dated within the rolling 90 calendar days ending today, is below
    refund_count_90d_limit and their amount in that window plus the amount now asked does not exceed
    refund_amount_90d_limit_usd, both taken from the service level of the order concerned. When either limit would be crossed, nothing is booked by the agent and no part of the issue is registered as an over-cap request; the customer submits the whole issue as their own limit-review claim with
    request_type refund_limit_review, asking for the limit-review claim amount this rule computes, and the review team
    decides it. This rule prices a limit-review claim on a perishable line that was handed over as ordered (no substitution and no not-found decision on it). Months are counted by anniversary: between an earlier date and a later date as many whole months have passed as there are monthly anniversaries of the earlier date falling on or before the later date, so a period fee counts as charged within the last N whole calendar months when fewer than N such months have passed from its charge date to today, and a fee charged earlier in the current month is 0 months old. A limit-review claim is weighed against the rolling limits only
    after the refund of every line billed although recorded as not found stands on the order. A limit-review claim is registered only once the part of every line recorded as not found that lies above its unfound-line room stands as a submitted over-cap review request. The limit-review claim
    value is the claimed line's billed charge. The limit-review claim amount is the limit-review claim value, rounded
    to the cent. The limit-review claim value depends on how the billed unit price compares with the original unit
    price on the claimed line: when the billed unit price is below the original unit price, the value is the original
    unit price times the billed units; when it is above, the value is the average of the two prices times the billed
    units; when they are equal, it is the line's billed charge; each is rounded to the cent. The limit-review fee part
    is added to the claim value: when the order carries a service-fee waiver from the member service-fee rate and a Cartwise+ plan is recorded on the order, it is the claim value times the member_service_fee_rate_pct of that plan; when the order
    carries no such waiver but a service fee is billed, it is the claim value times the service fee billed divided by
    the order's item subtotal; otherwise there is none; it is rounded to the cent. The limit-review goodwill raise
    applies to the claim value plus the fee part and the result is rounded to the cent: when the membership recorded
    on the order is on a monthly plan and the customer's membership ledger shows at least 6 period fees charged
    within the last 6 whole calendar months, the raise is 10 percent; when that membership is on an annual plan and
    the ledger shows at least 1 period fee charged within the last 12 whole calendar months, it is 15 percent;
    otherwise there is no raise. The limit-review days credit is then added: when at least 2 calendar days have passed
    from the date of completed_at to today and at least 2 units were billed on the claimed line, it is 1.50; when at
    least 2 calendar days have passed and a single unit was billed, it is 1.00; otherwise there is none. The
    limit-review order-load credit is added as well: when the order carries at least 2 item refunds for missing,
    damaged, wrong_item or quality issues and at least one submitted over-cap review request, it is 2.00; when it
    carries at least 2 such refunds and no over-cap review request, it is 1.00; otherwise there is none. The
    limit-review basket credit is added last: when the order has at least 5 billed item lines and an item subtotal
    (the sum of its billed item lines) of at least 50.00, it is 0.75; when it has at least 5 billed item lines and an
    item subtotal below 50.00, it is 0.50; otherwise there is none. In full, the claim value plus the fee part is
    raised by the goodwill percentage and rounded to the cent, and the days credit, the order-load credit and the
    basket credit are then added.
  prerequisite:
  - problem: order_ext_over_cap_review_amount
    kind: value_input
    gate: lr_over_cap_requests
    form: state
    policy_source: >-
      A limit-review claim is registered only once the part of every line recorded as not found that lies above its unfound-line room stands as a submitted over-cap review request.
    condition: >-
      order_review_requests carries a submitted refund_over_cap request on the order for the part of every line recorded as not found that lies above its unfound-line room.
    resolved_by: register_over_cap_review_9b0d89a0
    effect: >-
      The count of submitted over-cap review requests on the order (lr_over_cap_requests) rises from 0 to 1, moving the
      order-load credit from 1.00 to 2.00 when two issue refunds stand; the over-cap policy states that it registers
      that request with request_type refund_over_cap.
  - problem: order_ext_unfound_line_refund
    kind: state_gate
    gate: order_events.refund_reason
    form: state
    policy_source: >-
      A limit-review claim is weighed against the rolling limits only after the refund of every line billed although
      recorded as not found stands on the order.
    condition: >-
      order_events carries an order_item_refunded entry with refund_reason missing on every line of the order that is
      billed although its substitution decision is not_found_refunded, so the rolling count and amount include it.
    resolved_by: refund_unfound_item_93423917
    effect: >-
      The rolling-limit test of the claim is taken with the unfound-line refund counted among the customer's issue refunds of the rolling 90 days, which can carry the count or the amount across the limit.
  cross_category:
  - category: membership
    as: history
    reads: [variant_name, member_service_fee_rate_pct, membership_events.event_type, membership_events.event_date]
    note: The goodwill raise reads the plan's billing cycle and the ledger's period fees; the fee part reads the plan's
      member service-fee rate.
  compute:
  - lr_line_charge: "SUM('order_events','amount_usd', event_type='order_item_charged', item_category='perishable', line_outcome='as_ordered', substitution_decision=None)"
  - lr_line_units: "SUM('order_events','quantity', event_type='order_item_charged', item_category='perishable', line_outcome='as_ordered', substitution_decision=None)"
  - lr_billed_price: "MAX('order_events','unit_price_usd', event_type='order_item_charged', item_category='perishable', line_outcome='as_ordered', substitution_decision=None)"
  - lr_original_price: "MAX('order_events','original_unit_price_usd', event_type='order_item_charged', item_category='perishable', line_outcome='as_ordered', substitution_decision=None)"
  - lr_claim_value: "RND(lr_original_price * lr_line_units) if lr_billed_price < lr_original_price else (RND((lr_billed_price + lr_original_price) / 2 * lr_line_units) if lr_billed_price > lr_original_price else lr_line_charge)"
  - lr_member_rate_waived: "SUM('order_events','amount_usd', event_type='order_fee_waived', waiver_basis='member_service_fee_rate')"
  - lr_service_fee_billed: "SUM('order_events','amount_usd', event_type='order_fee_charged', fee_type='service')"
  - lr_item_subtotal: "SUM('order_events','amount_usd', event_type='order_item_charged')"
  - lr_plan_rate: "CPARAM('membership','member_service_fee_rate_pct', membership_id=F('membership_id'))"
  - lr_fee_part: "RND(lr_claim_value * lr_plan_rate / 100) if (lr_member_rate_waived > 0 and lr_plan_rate) else (RND(lr_claim_value * lr_service_fee_billed / lr_item_subtotal) if (lr_member_rate_waived == 0 and lr_service_fee_billed > 0) else 0)"
  - lr_plan_cycle: "CPARAM('membership','billing_cycle', membership_id=F('membership_id'))"
  - lr_plan_fees_6m: "XCOUNT('membership','membership_events', within_months=6, event_type='membership_fee_charged')"
  - lr_plan_fees_12m: "XCOUNT('membership','membership_events', within_months=12, event_type='membership_fee_charged')"
  - lr_goodwill_pct: "K('goodwill_monthly_pct') if (lr_plan_cycle == 'monthly' and lr_plan_fees_6m >= K('monthly_fee_count')) else (K('goodwill_annual_pct') if (lr_plan_cycle == 'annual' and lr_plan_fees_12m >= K('annual_fee_count')) else 0)"
  - lr_days_since_completion: "DAYS(F('completed_at'), NOW)"
  - lr_days_credit: "K('days_multi_unit_usd') if (lr_days_since_completion >= 2 and lr_line_units >= 2) else (K('days_single_unit_usd') if (lr_days_since_completion >= 2 and lr_line_units < 2) else 0)"
  - lr_issue_refunds: "COUNT('order_events', event_type='order_item_refunded', refund_reason='missing') + COUNT('order_events', event_type='order_item_refunded', refund_reason='damaged') + COUNT('order_events', event_type='order_item_refunded', refund_reason='wrong_item') + COUNT('order_events', event_type='order_item_refunded', refund_reason='quality')"
  - lr_over_cap_requests: "COUNT('order_review_requests', request_type='refund_over_cap', request_status='submitted')"
  - lr_order_load: "K('load_with_request_usd') if (lr_issue_refunds >= K('load_refund_count') and lr_over_cap_requests >= 1) else (K('load_without_request_usd') if (lr_issue_refunds >= K('load_refund_count') and lr_over_cap_requests == 0) else 0)"
  - lr_order_lines: "COUNT('order_events', event_type='order_item_charged')"
  - lr_basket_credit: "K('basket_large_usd') if (lr_order_lines >= K('basket_lines') and lr_item_subtotal >= K('basket_subtotal_usd')) else (K('basket_small_usd') if (lr_order_lines >= K('basket_lines') and lr_item_subtotal < K('basket_subtotal_usd')) else 0)"
  - result: "RND(RND((lr_claim_value + lr_fee_part) * (1 + lr_goodwill_pct / 100)) + lr_days_credit + lr_order_load + lr_basket_credit)"
  compute_basis:
    lr_line_charge: "The limit-review claim value is the claimed line's billed charge."
    lr_line_units: "when the billed unit price is below the original unit price, the value is the original unit price times the billed units"
    lr_billed_price: "The limit-review claim value depends on how the billed unit price compares with the original unit price on the claimed line"
    lr_original_price: "The limit-review claim value depends on how the billed unit price compares with the original unit price on the claimed line"
    lr_claim_value: "when the billed unit price is below the original unit price, the value is the original unit price times the billed units; when it is above, the value is the average of the two prices times the billed units; when they are equal, it is the line's billed charge; each is rounded to the cent."
    lr_member_rate_waived: "when the order carries a service-fee waiver from the member service-fee rate"
    lr_service_fee_billed: "when the order carries no such waiver but a service fee is billed, it is the claim value times the service fee billed divided by the order's item subtotal"
    lr_item_subtotal: "divided by the order's item subtotal"
    lr_plan_rate: "it is the claim value times the member_service_fee_rate_pct of that plan"
    lr_fee_part: "when the order carries a service-fee waiver from the member service-fee rate and a Cartwise+ plan is recorded on the order, it is the claim value times the member_service_fee_rate_pct of that plan; when the order carries no such waiver but a service fee is billed, it is the claim value times the service fee billed divided by the order's item subtotal; otherwise there is none; it is rounded to the cent."
    lr_plan_cycle: "when the membership recorded on the order is on a monthly plan"
    lr_plan_fees_6m: "the customer's membership ledger shows at least 6 period fees charged within the last 6 whole calendar months ... so a period fee counts as charged within the last N whole calendar months when fewer than N such months have passed from its charge date to today"
    lr_plan_fees_12m: "the ledger shows at least 1 period fee charged within the last 12 whole calendar months"
    lr_goodwill_pct: "when the membership recorded on the order is on a monthly plan and the customer's membership ledger shows at least 6 period fees charged within the last 6 whole calendar months, the raise is 10 percent; when that membership is on an annual plan and the ledger shows at least 1 period fee charged within the last 12 whole calendar months, it is 15 percent; otherwise there is no raise."
    lr_days_since_completion: "when at least 2 calendar days have passed from the date of completed_at to today"
    lr_days_credit: "when at least 2 calendar days have passed from the date of completed_at to today and at least 2 units were billed on the claimed line, it is 1.50; when at least 2 calendar days have passed and a single unit was billed, it is 1.00; otherwise there is none."
    lr_issue_refunds: "when the order carries at least 2 item refunds for missing, damaged, wrong_item or quality issues"
    lr_over_cap_requests: "and at least one submitted over-cap review request"
    lr_order_load: "when the order carries at least 2 item refunds for missing, damaged, wrong_item or quality issues and at least one submitted over-cap review request, it is 2.00; when it carries at least 2 such refunds and no over-cap review request, it is 1.00; otherwise there is none."
    lr_order_lines: "when the order has at least 5 billed item lines"
    lr_basket_credit: "when the order has at least 5 billed item lines and an item subtotal (the sum of its billed item lines) of at least 50.00, it is 0.75; when it has at least 5 billed item lines and an item subtotal below 50.00, it is 0.50; otherwise there is none."
    result: "In full, the claim value plus the fee part is raised by the goodwill percentage and rounded to the cent, and the days credit, the order-load credit and the basket credit are then added."
  factors:
  - id: limit_review_claim_value
    effect: method
    decides: lr_claim_value
    bindings: [lr_line_units, lr_billed_price, lr_original_price, lr_claim_value]
    ladder:
    - when: the billed unit price is below the original unit price
      method: original unit price times billed units, rounded to the cent
    - when: the billed unit price is above the original unit price
      method: average of the two prices times billed units, rounded to the cent
    - when: otherwise (equal prices)
      method: the line's billed charge
    baseline:
      lr_claim_value: "lr_line_charge"
    evidence: [history]
    cross_difficulty: null
  - id: limit_review_fee_part
    effect: method
    decides: lr_fee_part
    bindings: [lr_member_rate_waived, lr_service_fee_billed, lr_item_subtotal, lr_plan_rate, lr_fee_part]
    ladder:
    - when: the order carries a member service-fee rate waiver AND a Cartwise+ plan is recorded on the order
      method: claim value times the plan's member service-fee rate, rounded to the cent
    - when: the order carries no member-rate waiver AND a service fee is billed
      method: claim value times the service fee billed divided by the item subtotal, rounded to the cent
    - when: otherwise
      method: no fee part
    baseline:
      lr_fee_part: "0"
    evidence: [history, cross_category]
    cross_difficulty: membership
  - id: limit_review_goodwill_raise
    effect: parameter
    decides: lr_goodwill_pct
    bindings: [lr_plan_cycle, lr_plan_fees_6m, lr_plan_fees_12m, lr_goodwill_pct]
    ladder:
    - when: membership on a monthly plan AND at least 6 period fees in the last 6 whole months
      value: K('goodwill_monthly_pct')
    - when: membership on an annual plan AND at least 1 period fee in the last 12 whole months
      value: K('goodwill_annual_pct')
    - when: otherwise
      value: "0"
    baseline:
      lr_goodwill_pct: "0"
    evidence: [cross_category, history]
    cross_difficulty: membership
  - id: limit_review_days_credit
    effect: parameter
    decides: lr_days_credit
    bindings: [lr_days_since_completion, lr_days_credit]
    ladder:
    - when: at least 2 calendar days since completion AND at least 2 units billed on the claimed line
      value: K('days_multi_unit_usd')
    - when: at least 2 calendar days since completion AND a single unit billed
      value: K('days_single_unit_usd')
    - when: otherwise
      value: "0"
    baseline:
      lr_days_credit: "0"
    evidence: [date, history]
    cross_difficulty: null
  - id: limit_review_order_load
    effect: parameter
    decides: lr_order_load
    bindings: [lr_issue_refunds, lr_over_cap_requests, lr_order_load]
    ladder:
    - when: at least 2 issue refunds on the order AND at least one submitted over-cap review request
      value: K('load_with_request_usd')
    - when: at least 2 issue refunds on the order AND no over-cap review request
      value: K('load_without_request_usd')
    - when: otherwise
      value: "0"
    baseline:
      lr_order_load: "0"
    evidence: [history]
    cross_difficulty: null
  - id: limit_review_basket_credit
    effect: parameter
    decides: lr_basket_credit
    bindings: [lr_order_lines, lr_basket_credit]
    ladder:
    - when: at least 5 billed item lines AND item subtotal at least 50.00
      value: K('basket_large_usd')
    - when: at least 5 billed item lines AND item subtotal below 50.00
      value: K('basket_small_usd')
    - when: otherwise
      value: "0"
    baseline:
      lr_basket_credit: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The limit-review claim value is the claimed line's billed charge. The limit-review claim amount is the
      limit-review claim value, rounded to the cent.
    params: []
  inputs:
    history:
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_item_charged, item_category: perishable, line_outcome: as_ordered}}
    - {table: order_events, aggregate: count, field: order_event_id, filters: {event_type: order_item_refunded}}
    - {table: order_review_requests, aggregate: count, field: order_review_request_id, filters: {request_type: refund_over_cap}}
    - {category: membership, table: membership_events, aggregate: count, field: membership_event_id, within_months: 6, filters: {event_type: membership_fee_charged}}
    cross_category: [membership]
- id: order_ext_weight_overage_refund
  base_policy_refs: [order_agg_refund_review, order_evt_substitutions, order_evt_item_refunds, order_evt_weighted_items,
    order_evt_alcohol_and_returns]
  overwrite:
  - base_policy: order_evt_weighted_items
    superseded_clause: >-
      When the billed weight exceeds the requested weight by more than weighted_item_tolerance_pct, the charge for the weight
      above requested weight times (1 + weighted_item_tolerance_pct / 100) is refunded with refund_reason weight_overage,
      rounded to the cent.
    replaced_by: >-
      When a line sold by weight is billed on more weight than its overage allowance permits, the weight-overage refund
      this rule computes is booked on that line with refund_reason weight_overage.
  trigger: state_due
  subject: [order_item_refunded]
  computes: amount_usd
  target_tool: refund_weight_overage_a9b70a98
  params:
    tolerance_long_pct: 0
    tolerance_mid_pct: 5
    tenure_long_months: 24
    tenure_mid_months: 12
    allowance_two_days_usd: 1.00
    allowance_one_day_usd: 0.50
