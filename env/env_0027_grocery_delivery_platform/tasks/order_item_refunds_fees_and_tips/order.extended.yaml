  - wo_overage_price: "wo_original_price if wo_billed_price < wo_original_price else ((wo_billed_price + wo_original_price) / 2 if wo_billed_price > wo_original_price else wo_billed_price)"
  - wo_issue_refunds: "COUNT('order_events', event_type='order_item_refunded', refund_reason='missing') + COUNT('order_events', event_type='order_item_refunded', refund_reason='damaged') + COUNT('order_events', event_type='order_item_refunded', refund_reason='wrong_item') + COUNT('order_events', event_type='order_item_refunded', refund_reason='quality')"
  - wo_item_subtotal: "SUM('order_events','amount_usd', event_type='order_item_charged')"
  - wo_uplift_pct: "K('uplift_large_pct') if (wo_issue_refunds >= 1 and wo_item_subtotal >= K('large_order_usd')) else (K('uplift_small_pct') if (wo_issue_refunds >= 1 and wo_item_subtotal < K('large_order_usd')) else 0)"
