  rule: >-
    Produce, meat and deli sold by weight (item_category weighted) are billed on the weight handed over. When a line
    sold by weight is billed on more weight than its overage allowance permits, the weight-overage refund this rule
    computes is booked on that line with refund_reason weight_overage. The overage allowance is the requested weight
    times (1 + the weight tolerance percentage / 100); the overage weight is the billed weight less the overage
    allowance, never below zero. The weight tolerance is weighted_item_tolerance_pct of the order's service level. The
    overage is priced at the billed unit price. The weight-overage refund is the overage weight times its price,
    rounded to the cent. Months are counted by anniversary: between an earlier date and a later date as many whole months have passed as there are monthly anniversaries of the earlier date falling on or before the later date, so a period fee counts as charged within the last N whole calendar months when fewer than N such months have passed from its charge date to today, and a fee charged earlier in the current month is 0 months old. The weight tolerance depends on the Cartwise+ membership recorded on the order: when that
    membership is on an annual plan and was enrolled at least 24 whole calendar months before the order's placed date,
    the tolerance is 0 percent; when it is on an annual plan and was enrolled at least 12 and fewer than 24 whole
    calendar months before, it is 5 percent; in every other case it is weighted_item_tolerance_pct of the order's
    service level. The price of the overage weight depends on how the billed unit price compares with the original
    unit price on the line: when the billed unit price is below the original unit price, the overage is priced at the
    original unit price; when it is above, at the average of the two prices; when they are equal, at the billed unit
    price. The weight-overage order uplift raises the refund before rounding: when the order already carries an item
    refund for a missing, damaged, wrong_item or quality issue and its item subtotal (the sum of its billed item lines)
    is at least 125.00, the refund is raised by 10 percent; when it carries such a refund and its item subtotal is
    below 125.00, by 5 percent; otherwise it is not raised. The weight-overage standing allowance is added after
    rounding: when at least 2 calendar days have passed from the date of completed_at to today and no weight-overage
    refund stands on the order yet, it is 1.00; when exactly 1 calendar day has passed and none stands yet, it is 0.50;
    otherwise there is none. In full, the overage weight is multiplied by its price and by 1 plus the uplift
    percentage, rounded to the cent once, and the standing allowance is added; the refund never exceeds the line's
    billed charge. A weight-overage refund does not count toward the per-order self-service cap or the rolling limits.
