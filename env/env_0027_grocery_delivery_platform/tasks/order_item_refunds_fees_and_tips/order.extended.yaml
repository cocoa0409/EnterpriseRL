    effect: parameter
    decides: pp_standing_allowance
    bindings: [pp_days_since_completion, pp_refunded, pp_standing_allowance]
    ladder:
    - when: at least 2 calendar days since completion AND no price-protection refund standing
      value: K('allowance_two_days_usd')
    - when: exactly 1 calendar day since completion AND no price-protection refund standing
      value: K('allowance_one_day_usd')
    - when: otherwise
      value: "0"
    baseline:
      pp_standing_allowance: "0"
    evidence: [date, history]
    cross_difficulty: null
  - id: price_protection_handling_credit
    effect: parameter
    decides: pp_handling_credit
    bindings: [pp_line_class, pp_handling_credit]
    ladder:
    - when: at least 2 replacement units billed AND the replacement is perishable
      value: K('handling_perishable_usd') per billed unit
    - when: at least 2 replacement units billed AND the replacement is not perishable
      value: K('handling_shelf_usd') per billed unit
    - when: otherwise
      value: "0"
    baseline:
      pp_handling_credit: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The protected charge is the billed units times the protected unit price, rounded to the cent. The protected
      unit price is the original unit price times (1 + substitution_price_cap_pct of the order's service level /
      100). The price-protection excess is the line's billed charge less the protected charge, never below zero.
      The price-protection refund is the price-protection excess, rounded to the cent.
    params: [substitution_price_cap_pct]
  inputs:
    history:
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_item_charged, substitution_decision: auto_best_match}}
    - {table: order_events, aggregate: count, field: order_event_id, filters: {event_type: order_item_refunded}}
    - {category: membership, table: membership_events, aggregate: count, field: membership_event_id, within_months: 36, filters: {event_type: membership_fee_charged}}
    cross_category: [membership]
- id: order_ext_service_fee_share_refund
  base_policy_refs: [order_evt_cancellation, order_evt_on_time_guarantee, order_evt_service_fee]
  overwrite:
  - base_policy: order_evt_service_fee
    superseded_clause: >-
      When items are refunded and service_fee_refund_on_item_refund is true, the service fee is refunded in proportion
      to the refunded item amount (refund_reason item_refund_share), rounded to the cent; the refunded share is never
      recomputed against the floor.
    replaced_by: >-
      The service fee billed on an order is shared back with its item refunds only once a price-protection or weight-overage refund stands on the order: from then on, on a service level with service_fee_refund_on_item_refund true, the service-fee share refund this rule computes is booked against the order's service fee charge with refund_reason item_refund_share; an order carrying only missing, damaged, wrong_item or quality refunds keeps its service fee.
  trigger: state_due
  subject: [order_fee_refunded]
  computes: amount_usd
  target_tool: refund_service_fee_share_1e350a8d
  params:
    goodwill_annual_pct: 20
    goodwill_monthly_pct: 10
    annual_fee_count: 1
    monthly_fee_count: 6
    days_many_usd: 0.50
    days_one_usd: 0.25
    uplift_large_pct: 10
    uplift_small_pct: 5
    large_order_usd: 125.0
    tenure_long_months: 48
    tenure_mid_months: 24
    tenure_long_usd: 0.30
    tenure_mid_usd: 0.15
  rule: >-
    The service fee billed on an order is shared back with its item refunds only once a price-protection or weight-overage refund stands on the order: from then on, on a service level with service_fee_refund_on_item_refund true, the service-fee share refund this rule computes is booked against the order's service fee charge with refund_reason item_refund_share; an order carrying only missing, damaged, wrong_item or quality refunds keeps its service fee. The service-fee share refund is fixed only after the weight-overage refund owed on every line
    sold by weight and billed above its overage allowance stands on the order. The service-fee share refund is fixed
    only after the price-protection refund owed on every unapproved replacement billed above its protected price stands
    on the order. The fee-share refund basis is the sum of the item refunds standing on the order for missing, damaged,
    wrong_item and quality issues. The fee share is the service fee billed on the order times the fee-share refund basis
    divided by the order's item subtotal (the sum of its billed item lines). The service-fee share refund is the fee
    share rounded to the cent, and never more than the service fee billed less the service fee already returned on the
    order. The fee-share refund basis depends on the membership and on the kinds of refunds standing: when a Cartwise+ plan is recorded on the order and a weight-overage refund stands on it, the basis is every item refund standing on the order; when a plan is recorded and no weight-overage refund stands, the basis is the issue refunds plus the price-protection refunds; when no plan is recorded, the basis is the issue refunds alone. Months are counted by anniversary: between an earlier date and a later date as many whole months have passed as there are monthly anniversaries of the earlier date falling on or before the later date, so a period fee counts as charged within the last N whole calendar months when fewer than N such months have passed from its charge date to today, and a fee charged earlier in the current month is 0 months old. The fee share is
    worked out according to how the fee was billed: when the order carries a waiver from the member service-fee rate
    and the service fee billed is above the service level's service_fee_min_usd, the share is the service fee before
    the member saving (the fee billed plus that waiver) times the basis divided by the item subtotal; when the order
    carries no such waiver and the fee billed is above the floor, the share is the basis times service_fee_rate_pct of
    the service level; otherwise the share is the proportional share of the fee billed stated above. The fee-share
    goodwill raise applies to the share: when that plan is annual and the customer's membership ledger shows at least 1
    period fee charged within the last 12 whole calendar months, 20 percent; when it is monthly and the ledger shows at
    least 6 period fees within the last 6 whole calendar months, 10 percent; otherwise none. The fee-share order uplift
    applies after the goodwill raise: when the order's item subtotal is at least 125.00 and a delivery fee is billed on
    it, 10 percent; when the item subtotal is below 125.00 and a delivery fee is billed, 5 percent; when no delivery
    fee is billed, none. The share raised by both is rounded to the cent once. The fee-share days credit is added after
    rounding: when at least 2 calendar days have passed from the date of completed_at to today and at least 2 item
    refunds stand on the order, 0.50; when at least 2 calendar days have passed and exactly 1 item refund stands, 0.25;
    otherwise none. The fee-share tenure credit is added as well: when the membership recorded on the order was
    enrolled at least 48 whole calendar months before the order's placed date, 0.30; when at least 24 and fewer than
    48, 0.15; otherwise none. In full, the share is multiplied by 1 plus the goodwill percentage and by 1 plus the
    uplift percentage, rounded to the cent, the days credit and the tenure credit are added, and the result never
    exceeds the service fee billed less the service fee already returned.
  prerequisite:
  - problem: order_ext_weight_overage_refund
    kind: value_input
    gate: sf_wo_refunded
    form: state
    policy_source: >-
      The service-fee share refund is fixed only after the weight-overage refund owed on every line sold by weight and
      billed above its overage allowance stands on the order.
    condition: >-
      order_events carries an order_item_refunded entry with refund_reason weight_overage on every weighted line whose
      billed weight exceeds its overage allowance.
    resolved_by: refund_weight_overage_a9b70a98
    effect: >-
      The weight-overage refunds standing (sf_wo_refunded) rise from zero to the booked refund and enter the fee-share
      refund basis; the weight-overage policy states that it books that refund with refund_reason weight_overage.
  - problem: order_ext_substitution_price_protection
    kind: value_input
    gate: sf_pp_refunded
    form: state
    policy_source: >-
      The service-fee share refund is fixed only after the price-protection refund owed on every unapproved replacement
      billed above its protected price stands on the order.
    condition: >-
      order_events carries an order_item_refunded entry with refund_reason substitution_price_protection on every
      auto_best_match line whose unit price exceeds the original by more than the service level's cap.
    resolved_by: refund_substitution_overcharge_0e292d66
    effect: >-
      The price-protection refunds standing (sf_pp_refunded) rise from zero to the booked refund and enter the fee-share
      refund basis; the price-protection policy states that it books that refund with refund_reason
      substitution_price_protection.
  cross_category:
  - category: membership
    as: history
    reads: [variant_name, enrolled_date, membership_events.event_type, membership_events.event_date]
    note: The fee-share basis and goodwill tiers read the plan recorded on the order and its ledger; the tenure credit
      reads the enrollment date.
  compute:
  - sf_fee_billed: "SUM('order_events','amount_usd', event_type='order_fee_charged', fee_type='service')"
  - sf_fee_returned: "SUM('order_events','amount_usd', event_type='order_fee_refunded', fee_type='service')"
  - sf_item_subtotal: "SUM('order_events','amount_usd', event_type='order_item_charged')"
  - sf_issue_refunded: "SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='missing') + SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='damaged') + SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='wrong_item') + SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='quality')"
  - sf_pp_refunded: "SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='substitution_price_protection')"
  - sf_wo_refunded: "SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='weight_overage')"
  - sf_all_refunded: "SUM('order_events','amount_usd', event_type='order_item_refunded')"
  - sf_plan_cycle: "CPARAM('membership','billing_cycle', membership_id=F('membership_id'))"
  - sf_basis: "sf_all_refunded if (sf_plan_cycle and sf_wo_refunded > 0) else (sf_issue_refunded + sf_pp_refunded if (sf_plan_cycle and sf_wo_refunded == 0) else sf_issue_refunded)"
  - sf_member_waiver: "SUM('order_events','amount_usd', event_type='order_fee_waived', waiver_basis='member_service_fee_rate')"
  - sf_share: "(sf_fee_billed + sf_member_waiver) * sf_basis / sf_item_subtotal if (sf_member_waiver > 0 and sf_fee_billed > P('service_fee_min_usd')) else (sf_basis * P('service_fee_rate_pct') / 100 if (sf_member_waiver == 0 and sf_fee_billed > P('service_fee_min_usd')) else sf_fee_billed * sf_basis / sf_item_subtotal)"
  - sf_plan_fees_6m: "XCOUNT('membership','membership_events', within_months=6, event_type='membership_fee_charged')"
  - sf_plan_fees_12m: "XCOUNT('membership','membership_events', within_months=12, event_type='membership_fee_charged')"
  - sf_goodwill_pct: "K('goodwill_annual_pct') if (sf_plan_cycle == 'annual' and sf_plan_fees_12m >= K('annual_fee_count')) else (K('goodwill_monthly_pct') if (sf_plan_cycle == 'monthly' and sf_plan_fees_6m >= K('monthly_fee_count')) else 0)"
  - sf_delivery_billed: "SUM('order_events','amount_usd', event_type='order_fee_charged', fee_type='delivery')"
  - sf_uplift_pct: "K('uplift_large_pct') if (sf_item_subtotal >= K('large_order_usd') and sf_delivery_billed > 0) else (K('uplift_small_pct') if (sf_item_subtotal < K('large_order_usd') and sf_delivery_billed > 0) else 0)"
  - sf_days_since_completion: "DAYS(F('completed_at'), NOW)"
  - sf_refund_count: "COUNT('order_events', event_type='order_item_refunded')"
  - sf_days_credit: "K('days_many_usd') if (sf_days_since_completion >= 2 and sf_refund_count >= 2) else (K('days_one_usd') if (sf_days_since_completion >= 2 and sf_refund_count == 1) else 0)"
  - sf_enrolled_date: "CFIELD('membership','enrolled_date', membership_id=F('membership_id'))"
  - sf_tenure_months: "MONTHS(sf_enrolled_date, F('placed_date')) if sf_enrolled_date else 0"
  - sf_tenure_credit: "K('tenure_long_usd') if sf_tenure_months >= K('tenure_long_months') else (K('tenure_mid_usd') if sf_tenure_months >= K('tenure_mid_months') else 0)"
  - result: "RND(MN(MX(0, sf_fee_billed - sf_fee_returned), RND(sf_share * (1 + sf_goodwill_pct / 100) * (1 + sf_uplift_pct / 100)) + sf_days_credit + sf_tenure_credit)) if (sf_pp_refunded + sf_wo_refunded) > 0 else 0"
  compute_basis:
    sf_fee_billed: "The fee share is the service fee billed on the order times the fee-share refund basis divided by the order's item subtotal (the sum of its billed item lines)."
    sf_fee_returned: "never more than the service fee billed less the service fee already returned on the order"
    sf_item_subtotal: "divided by the order's item subtotal (the sum of its billed item lines)"
    sf_issue_refunded: "The fee-share refund basis is the sum of the item refunds standing on the order for missing, damaged, wrong_item and quality issues."
    sf_pp_refunded: "the basis is the issue refunds plus the price-protection refunds"
    sf_wo_refunded: "when a Cartwise+ plan is recorded on the order and a weight-overage refund stands on it"
    sf_all_refunded: "the basis is every item refund standing on the order"
    sf_plan_cycle: "when a Cartwise+ plan is recorded on the order"
    sf_basis: "The fee-share refund basis depends on the membership and on the kinds of refunds standing: when a Cartwise+ plan is recorded on the order and a weight-overage refund stands on it, the basis is every item refund standing on the order; when a plan is recorded and no weight-overage refund stands, the basis is the issue refunds plus the price-protection refunds; when no plan is recorded, the basis is the issue refunds alone."
    sf_member_waiver: "when the order carries a waiver from the member service-fee rate"
    sf_share: "when the order carries a waiver from the member service-fee rate and the service fee billed is above the service level's service_fee_min_usd, the share is the service fee before the member saving (the fee billed plus that waiver) times the basis divided by the item subtotal; when the order carries no such waiver and the fee billed is above the floor, the share is the basis times service_fee_rate_pct of the service level; otherwise the share is the proportional share of the fee billed stated above."
    sf_plan_fees_6m: "Months are counted by anniversary: between an earlier date and a later date as many whole months have passed as there are monthly anniversaries of the earlier date falling on or before the later date, so a period fee counts as charged within the last N whole calendar months when fewer than N such months have passed from its charge date to today, and a fee charged earlier in the current month is 0 months old. ... when it is monthly and the ledger shows at least 6 period fees within the last 6 whole calendar months"
    sf_plan_fees_12m: "when that plan is annual and the customer's membership ledger shows at least 1 period fee charged within the last 12 whole calendar months"
    sf_goodwill_pct: "when that plan is annual and the customer's membership ledger shows at least 1 period fee charged within the last 12 whole calendar months, 20 percent; when it is monthly and the ledger shows at least 6 period fees within the last 6 whole calendar months, 10 percent; otherwise none."
    sf_delivery_billed: "and a delivery fee is billed on it"
    sf_uplift_pct: "when the order's item subtotal is at least 125.00 and a delivery fee is billed on it, 10 percent; when the item subtotal is below 125.00 and a delivery fee is billed, 5 percent; when no delivery fee is billed, none."
    sf_days_since_completion: "when at least 2 calendar days have passed from the date of completed_at to today"
    sf_refund_count: "and at least 2 item refunds stand on the order"
    sf_days_credit: "when at least 2 calendar days have passed from the date of completed_at to today and at least 2 item refunds stand on the order, 0.50; when at least 2 calendar days have passed and exactly 1 item refund stands, 0.25; otherwise none."
    sf_enrolled_date: "when the membership recorded on the order was enrolled at least 48 whole calendar months before the order's placed date"
    sf_tenure_months: "enrolled at least 48 whole calendar months before the order's placed date"
    sf_tenure_credit: "when the membership recorded on the order was enrolled at least 48 whole calendar months before the order's placed date, 0.30; when at least 24 and fewer than 48, 0.15; otherwise none."
    result: "The service fee billed on an order is shared back with its item refunds only once a price-protection or weight-overage refund stands on the order ... In full, the share is multiplied by 1 plus the goodwill percentage and by 1 plus the uplift percentage, rounded to the cent, the days credit and the tenure credit are added, and the result never exceeds the service fee billed less the service fee already returned."
  factors:
  - id: fee_share_refund_basis
    effect: method
    decides: sf_basis
    bindings: [sf_pp_refunded, sf_wo_refunded, sf_all_refunded, sf_plan_cycle, sf_basis]
    ladder:
    - when: a Cartwise+ plan is recorded on the order AND a weight-overage refund stands
      method: basis = every item refund standing on the order
    - when: a Cartwise+ plan is recorded on the order AND no weight-overage refund stands
      method: basis = issue refunds plus price-protection refunds
    - when: otherwise
      method: basis = issue refunds alone (no plan recorded)
    baseline:
      sf_basis: "sf_issue_refunded"
    evidence: [history, cross_category]
    cross_difficulty: membership
  - id: fee_share_method
    effect: method
    decides: sf_share
    bindings: [sf_member_waiver, sf_share]
    ladder:
    - when: a member service-fee rate waiver stands AND the fee billed is above the service level's floor
      method: service fee before the member saving times the basis divided by the item subtotal
    - when: no member-rate waiver AND the fee billed is above the floor
      method: basis times the service level's service_fee_rate_pct
    - when: otherwise
      method: proportional share of the fee billed
    baseline:
      sf_share: "sf_fee_billed * sf_basis / sf_item_subtotal"
    evidence: [history, tier_param]
    cross_difficulty: null
  - id: fee_share_goodwill_raise
    effect: parameter
    decides: sf_goodwill_pct
    bindings: [sf_plan_fees_6m, sf_plan_fees_12m, sf_goodwill_pct]
    ladder:
    - when: plan annual AND at least 1 period fee in the last 12 whole months
      value: K('goodwill_annual_pct')
    - when: plan monthly AND at least 6 period fees in the last 6 whole months
      value: K('goodwill_monthly_pct')
    - when: otherwise
      value: "0"
    baseline:
      sf_goodwill_pct: "0"
    evidence: [cross_category, history]
    cross_difficulty: membership
  - id: fee_share_order_uplift
    effect: parameter
    decides: sf_uplift_pct
    bindings: [sf_delivery_billed, sf_uplift_pct]
    ladder:
    - when: item subtotal at least 125.00 AND a delivery fee is billed
      value: K('uplift_large_pct')
    - when: item subtotal below 125.00 AND a delivery fee is billed
      value: K('uplift_small_pct')
    - when: otherwise (no delivery fee billed)
      value: "0"
    baseline:
      sf_uplift_pct: "0"
    evidence: [history]
    cross_difficulty: null
  - id: fee_share_days_credit
    effect: parameter
    decides: sf_days_credit
    bindings: [sf_days_since_completion, sf_refund_count, sf_days_credit]
    ladder:
    - when: at least 2 calendar days since completion AND at least 2 item refunds standing
      value: K('days_many_usd')
    - when: at least 2 calendar days since completion AND exactly 1 item refund standing
      value: K('days_one_usd')
    - when: otherwise
      value: "0"
    baseline:
      sf_days_credit: "0"
    evidence: [date, history]
    cross_difficulty: null
  - id: fee_share_tenure_credit
    effect: parameter
    decides: sf_tenure_credit
    bindings: [sf_enrolled_date, sf_tenure_months, sf_tenure_credit]
    ladder:
    - when: membership enrolled at least 48 whole months before the placed date
      value: K('tenure_long_usd')
    - when: membership enrolled 24 to 47 whole months before the placed date
      value: K('tenure_mid_usd')
    - when: otherwise
      value: "0"
    baseline:
      sf_tenure_credit: "0"
    evidence: [cross_category, date]
    cross_difficulty: membership
  baseline:
    rule: >-
      The fee-share refund basis is the sum of the item refunds standing on the order for missing, damaged, wrong_item
      and quality issues. The fee share is the service fee billed on the order times the fee-share refund basis divided
      by the order's item subtotal (the sum of its billed item lines). The service-fee share refund is the fee share
      rounded to the cent, and never more than the service fee billed less the service fee already returned on the
      order.
    params: []
  inputs:
    history:
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_item_refunded}}
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_fee_charged, fee_type: service}}
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_fee_waived, waiver_basis: member_service_fee_rate}}
    - {category: membership, table: membership_events, aggregate: count, field: membership_event_id, within_months: 12, filters: {event_type: membership_fee_charged}}
    cross_category: [membership]
- id: order_ext_photo_review_claim_amount
  base_policy_refs: [order_agg_refund_review, order_evt_substitutions, order_evt_item_refunds, order_evt_weighted_items,
    order_evt_alcohol_and_returns]
  overwrite:
  - base_policy: order_evt_item_refunds
    superseded_clause: >-
      A damaged or quality refund on a line charged above damaged_photo_required_over_usd
      needs a photo on the case; without one it is registered for review with request_type photo_review.
    replaced_by: >-
      A damaged or quality issue on a line charged above damaged_photo_required_over_usd of the order's service level
      is not refunded by the agent while no photo is on the case; the customer submits it as their own photo-review
      claim with request_type photo_review, asking for the photo-review claim amount this rule computes, and the
      review team decides it.
  trigger: on_request
  subject: [order_item_refunded]
  computes: requested_amount_usd
  target_tool: submit_photo_review_claim_a5aac31c
  params:
    goodwill_annual_pct: 10
    goodwill_monthly_pct: 5
    annual_fee_count: 1
    monthly_fee_count: 6
    spoilage_high_usd: 2.00
    spoilage_low_usd: 1.00
    issue_with_pp_usd: 1.50
    issue_without_pp_usd: 0.75
    tenure_long_months: 48
    tenure_mid_months: 24
    tenure_long_usd: 2.00
    tenure_mid_usd: 1.00
  rule: >-
    A damaged or quality issue on a line charged above damaged_photo_required_over_usd of the order's service level is
    not refunded by the agent while no photo is on the case; the customer submits it as their own photo-review claim
    with request_type photo_review, asking for the photo-review claim amount this rule computes, and the review team
    decides it. This rule prices a photo-review claim on a line sold by weight (item_category weighted). A photo-review
    claim on a line sold by weight is not registered until any weight-overage refund owed on that line stands on the
    order. A photo-review claim is registered only after the service-fee share owed for the item refunds already
    standing on the order has been returned as a fee refund. The photo-review line value is the claimed line's billed
    charge less the weight-overage refunds standing on it. The photo-review claim amount is the photo-review line
    value, rounded to the cent. The photo-review line value depends on how the billed unit price compares with the
    original unit price on the claimed line: when the billed unit price is below the original unit price, the value is
    the line's charge less its weight-overage refunds, times the original unit price divided by the billed unit price;
    when it is above, that remaining charge times the average of the two prices divided by the billed unit price; when
    they are equal, the remaining charge itself; each is rounded to the cent. The photo-review fee part is added to the
    line value: when the order carries a waiver from the member service-fee rate and a Cartwise+ plan is recorded on
    the order, the fee part is the line value times the standing service-fee rate, that is the service fee billed less
    the service fee already returned, divided by the item subtotal less every item refund standing on the order; when
    the order carries no such waiver but a service fee is billed, it is the line value times the service fee billed
    divided by the item subtotal; otherwise there is none; it is rounded to the cent. Months are counted by anniversary: between an earlier date and a later date as many whole months have passed as there are monthly anniversaries of the earlier date falling on or before the later date, so a period fee counts as charged within the last N whole calendar months when fewer than N such months have passed from its charge date to today, and a fee charged earlier in the current month is 0 months old. The photo-review goodwill raise
    applies to the line value plus the fee part and the result is rounded to the cent: when that plan is annual and the
    customer's membership ledger shows at least 1 period fee charged within the last 12 whole calendar months, 10
    percent; when it is monthly and the ledger shows at least 6 period fees within the last 6 whole calendar months, 5
    percent; otherwise none. The photo-review spoilage credit is then added: when at least 2 calendar days have passed from the date of completed_at to today and the claimed line was billed on more weight than was requested, 2.00; when at least 2 calendar days have passed and the claimed line was billed on no more weight than was requested, 1.00; otherwise none. The photo-review order-issue
    credit is added as well: when the order carries an item refund for a missing, damaged, wrong_item or quality issue
    and a price-protection refund, 1.50; when it carries such an issue refund and no price-protection refund, 0.75;
    otherwise none. The photo-review tenure credit is added last: when the membership recorded on the order was
    enrolled at least 48 whole calendar months before the order's placed date, 2.00; when at least 24 and fewer than
    48, 1.00; otherwise none. In full, the line value plus the fee part is raised by the goodwill percentage and
    rounded to the cent, and the spoilage, order-issue and tenure credits are added.
  prerequisite:
  - problem: order_ext_weight_overage_refund
    kind: value_input
    gate: ph_line_refunded
    form: state
    policy_source: >-
      A photo-review claim on a line sold by weight is not registered until any weight-overage refund owed on that line
      stands on the order.
    condition: >-
      order_events carries an order_item_refunded entry with refund_reason weight_overage on the claimed weighted line
      when its billed weight exceeds its overage allowance.
    resolved_by: refund_weight_overage_a9b70a98
    effect: >-
      The weight-overage refunds standing on the claimed line (ph_line_refunded) rise from zero to the booked refund,
      lowering the photo-review line value; the weight-overage policy states that it books that refund.
  - problem: order_ext_service_fee_share_refund
    kind: value_input
    gate: ph_fee_returned
    form: state
    policy_source: >-
      A photo-review claim is registered only after the service-fee share owed for the item refunds already standing on
      the order has been returned as a fee refund.
    condition: >-
      order_events carries an order_fee_refunded entry with refund_reason item_refund_share against the order's service
      fee charge.
    resolved_by: refund_service_fee_share_1e350a8d
    effect: >-
      The service fee already returned (ph_fee_returned) rises from zero to the booked share, lowering the standing
      service-fee rate used by the fee part; the service-fee share policy states that it books that fee refund.
  cross_category:
  - category: membership
    as: history
    reads: [variant_name, enrolled_date, membership_events.event_type, membership_events.event_date]
    note: The fee part and goodwill tiers read the plan recorded on the order and its ledger; the tenure credit reads
      the enrollment date.
  compute:
  - ph_line_charge: "SUM('order_events','amount_usd', event_type='order_item_charged', item_category='weighted')"
  - ph_line_refunded: "SUM('order_events','amount_usd', event_type='order_item_refunded', refund_reason='weight_overage')"
  - ph_remaining: "MX(0, ph_line_charge - ph_line_refunded)"
  - ph_billed_price: "MAX('order_events','unit_price_usd', event_type='order_item_charged', item_category='weighted')"
  - ph_original_price: "MAX('order_events','original_unit_price_usd', event_type='order_item_charged', item_category='weighted')"
  - ph_line_value: "RND(ph_remaining * ph_original_price / ph_billed_price) if ph_billed_price < ph_original_price else (RND(ph_remaining * (ph_billed_price + ph_original_price) / 2 / ph_billed_price) if ph_billed_price > ph_original_price else ph_remaining)"
  - ph_member_waiver: "SUM('order_events','amount_usd', event_type='order_fee_waived', waiver_basis='member_service_fee_rate')"
  - ph_fee_billed: "SUM('order_events','amount_usd', event_type='order_fee_charged', fee_type='service')"
  - ph_fee_returned: "SUM('order_events','amount_usd', event_type='order_fee_refunded', fee_type='service')"
  - ph_item_subtotal: "SUM('order_events','amount_usd', event_type='order_item_charged')"
  - ph_items_refunded: "SUM('order_events','amount_usd', event_type='order_item_refunded')"
  - ph_plan_cycle: "CPARAM('membership','billing_cycle', membership_id=F('membership_id'))"
  - ph_fee_part: "RND(ph_line_value * (ph_fee_billed - ph_fee_returned) / (ph_item_subtotal - ph_items_refunded)) if (ph_member_waiver > 0 and ph_plan_cycle) else (RND(ph_line_value * ph_fee_billed / ph_item_subtotal) if (ph_member_waiver == 0 and ph_fee_billed > 0) else 0)"
  - ph_plan_fees_6m: "XCOUNT('membership','membership_events', within_months=6, event_type='membership_fee_charged')"
  - ph_plan_fees_12m: "XCOUNT('membership','membership_events', within_months=12, event_type='membership_fee_charged')"
  - ph_goodwill_pct: "K('goodwill_annual_pct') if (ph_plan_cycle == 'annual' and ph_plan_fees_12m >= K('annual_fee_count')) else (K('goodwill_monthly_pct') if (ph_plan_cycle == 'monthly' and ph_plan_fees_6m >= K('monthly_fee_count')) else 0)"
  - ph_days_since_completion: "DAYS(F('completed_at'), NOW)"
  - ph_billed_weight: "SUM('order_events','quantity', event_type='order_item_charged', item_category='weighted')"
  - ph_requested_weight: "SUM('order_events','requested_quantity', event_type='order_item_charged', item_category='weighted')"
  - ph_spoilage_credit: "K('spoilage_high_usd') if (ph_days_since_completion >= 2 and ph_billed_weight > ph_requested_weight) else (K('spoilage_low_usd') if (ph_days_since_completion >= 2 and ph_billed_weight <= ph_requested_weight) else 0)"
  - ph_issue_refunds: "COUNT('order_events', event_type='order_item_refunded', refund_reason='missing') + COUNT('order_events', event_type='order_item_refunded', refund_reason='damaged') + COUNT('order_events', event_type='order_item_refunded', refund_reason='wrong_item') + COUNT('order_events', event_type='order_item_refunded', refund_reason='quality')"
  - ph_pp_refunds: "COUNT('order_events', event_type='order_item_refunded', refund_reason='substitution_price_protection')"
  - ph_issue_credit: "K('issue_with_pp_usd') if (ph_issue_refunds >= 1 and ph_pp_refunds >= 1) else (K('issue_without_pp_usd') if (ph_issue_refunds >= 1 and ph_pp_refunds == 0) else 0)"
  - ph_enrolled_date: "CFIELD('membership','enrolled_date', membership_id=F('membership_id'))"
  - ph_tenure_months: "MONTHS(ph_enrolled_date, F('placed_date')) if ph_enrolled_date else 0"
  - ph_tenure_credit: "K('tenure_long_usd') if ph_tenure_months >= K('tenure_long_months') else (K('tenure_mid_usd') if ph_tenure_months >= K('tenure_mid_months') else 0)"
  - result: "RND(RND((ph_line_value + ph_fee_part) * (1 + ph_goodwill_pct / 100)) + ph_spoilage_credit + ph_issue_credit + ph_tenure_credit)"
  compute_basis:
    ph_line_charge: "The photo-review line value is the claimed line's billed charge less the weight-overage refunds standing on it."
    ph_line_refunded: "The photo-review line value is the claimed line's billed charge less the weight-overage refunds standing on it."
    ph_remaining: "the line's charge less its weight-overage refunds"
    ph_billed_price: "The photo-review line value depends on how the billed unit price compares with the original unit price on the claimed line"
    ph_original_price: "times the original unit price divided by the billed unit price"
    ph_line_value: "when the billed unit price is below the original unit price, the value is the line's charge less its weight-overage refunds, times the original unit price divided by the billed unit price; when it is above, that remaining charge times the average of the two prices divided by the billed unit price; when they are equal, the remaining charge itself; each is rounded to the cent."
    ph_member_waiver: "when the order carries a waiver from the member service-fee rate and a Cartwise+ plan is recorded on the order"
    ph_fee_billed: "the service fee billed less the service fee already returned"
    ph_fee_returned: "the service fee billed less the service fee already returned"
    ph_item_subtotal: "divided by the item subtotal less every item refund standing on the order"
    ph_items_refunded: "divided by the item subtotal less every item refund standing on the order"
    ph_plan_cycle: "and a Cartwise+ plan is recorded on the order"
    ph_fee_part: "when the order carries a waiver from the member service-fee rate and a Cartwise+ plan is recorded on the order, the fee part is the line value times the standing service-fee rate, that is the service fee billed less the service fee already returned, divided by the item subtotal less every item refund standing on the order; when the order carries no such waiver but a service fee is billed, it is the line value times the service fee billed divided by the item subtotal; otherwise there is none; it is rounded to the cent."
    ph_plan_fees_6m: "Months are counted by anniversary: between an earlier date and a later date as many whole months have passed as there are monthly anniversaries of the earlier date falling on or before the later date, so a period fee counts as charged within the last N whole calendar months when fewer than N such months have passed from its charge date to today, and a fee charged earlier in the current month is 0 months old. ... when it is monthly and the ledger shows at least 6 period fees within the last 6 whole calendar months"
    ph_plan_fees_12m: "when that plan is annual and the customer's membership ledger shows at least 1 period fee charged within the last 12 whole calendar months"
    ph_goodwill_pct: "when that plan is annual and the customer's membership ledger shows at least 1 period fee charged within the last 12 whole calendar months, 10 percent; when it is monthly and the ledger shows at least 6 period fees within the last 6 whole calendar months, 5 percent; otherwise none."
    ph_days_since_completion: "when at least 2 calendar days have passed from the date of completed_at to today"
    ph_spoilage_credit: "when at least 2 calendar days have passed from the date of completed_at to today and the claimed line was billed on more weight than was requested, 2.00; when at least 2 calendar days have passed and the claimed line was billed on no more weight than was requested, 1.00; otherwise none."
    ph_issue_refunds: "when the order carries an item refund for a missing, damaged, wrong_item or quality issue"
    ph_pp_refunds: "and a price-protection refund"
    ph_issue_credit: "when the order carries an item refund for a missing, damaged, wrong_item or quality issue and a price-protection refund, 1.50; when it carries such an issue refund and no price-protection refund, 0.75; otherwise none."
    ph_enrolled_date: "when the membership recorded on the order was enrolled at least 48 whole calendar months before the order's placed date"
    ph_tenure_months: "enrolled at least 48 whole calendar months before the order's placed date"
    ph_tenure_credit: "when the membership recorded on the order was enrolled at least 48 whole calendar months before the order's placed date, 2.00; when at least 24 and fewer than 48, 1.00; otherwise none."
    result: "In full, the line value plus the fee part is raised by the goodwill percentage and rounded to the cent, and the spoilage, order-issue and tenure credits are added."
  factors:
  - id: photo_review_line_value
    effect: method
    decides: ph_line_value
    bindings: [ph_billed_price, ph_original_price, ph_line_value]
    ladder:
    - when: the billed unit price is below the original unit price
      method: remaining charge times original price divided by billed price, rounded to the cent
    - when: the billed unit price is above the original unit price
      method: remaining charge times the average of the two prices divided by billed price, rounded to the cent
    - when: otherwise (equal prices)
      method: the remaining charge itself
    baseline:
      ph_line_value: "ph_remaining"
    evidence: [history]
    cross_difficulty: null
  - id: photo_review_fee_part
    effect: method
    decides: ph_fee_part
    bindings: [ph_member_waiver, ph_fee_billed, ph_item_subtotal, ph_items_refunded, ph_plan_cycle, ph_fee_part]
    ladder:
    - when: a member service-fee rate waiver stands AND a Cartwise+ plan is recorded on the order
      method: line value times the standing service-fee rate (fee billed less fee returned, over item subtotal less item refunds)
    - when: no member-rate waiver AND a service fee is billed
      method: line value times the service fee billed over the item subtotal
    - when: otherwise
      method: no fee part
    baseline:
      ph_fee_part: "0"
    evidence: [history, cross_category]
    cross_difficulty: membership
  - id: photo_review_goodwill_raise
    effect: parameter
    decides: ph_goodwill_pct
    bindings: [ph_plan_fees_6m, ph_plan_fees_12m, ph_goodwill_pct]
    ladder:
    - when: plan annual AND at least 1 period fee in the last 12 whole months
      value: K('goodwill_annual_pct')
    - when: plan monthly AND at least 6 period fees in the last 6 whole months
      value: K('goodwill_monthly_pct')
    - when: otherwise
      value: "0"
    baseline:
      ph_goodwill_pct: "0"
    evidence: [cross_category, history]
    cross_difficulty: membership
  - id: photo_review_spoilage_credit
    effect: parameter
    decides: ph_spoilage_credit
    bindings: [ph_days_since_completion, ph_billed_weight, ph_requested_weight, ph_spoilage_credit]
    ladder:
    - when: at least 2 calendar days since completion AND the claimed line billed on more weight than requested
      value: K('spoilage_high_usd')
    - when: at least 2 calendar days since completion AND the claimed line billed on no more weight than requested
      value: K('spoilage_low_usd')
    - when: otherwise
      value: "0"
    baseline:
      ph_spoilage_credit: "0"
    evidence: [date, history]
    cross_difficulty: null
  - id: photo_review_order_issue_credit
    effect: parameter
    decides: ph_issue_credit
    bindings: [ph_issue_refunds, ph_pp_refunds, ph_issue_credit]
    ladder:
    - when: the order carries an issue refund AND a price-protection refund
      value: K('issue_with_pp_usd')
    - when: the order carries an issue refund AND no price-protection refund
      value: K('issue_without_pp_usd')
    - when: otherwise
      value: "0"
    baseline:
      ph_issue_credit: "0"
    evidence: [history]
    cross_difficulty: null
  - id: photo_review_tenure_credit
    effect: parameter
    decides: ph_tenure_credit
    bindings: [ph_enrolled_date, ph_tenure_months, ph_tenure_credit]
    ladder:
    - when: membership enrolled at least 48 whole months before the placed date
      value: K('tenure_long_usd')
    - when: membership enrolled 24 to 47 whole months before the placed date
      value: K('tenure_mid_usd')
    - when: otherwise
      value: "0"
    baseline:
      ph_tenure_credit: "0"
    evidence: [cross_category, date]
    cross_difficulty: membership
  baseline:
    rule: >-
      The photo-review line value is the claimed line's billed charge less the weight-overage refunds standing on it.
      The photo-review claim amount is the photo-review line value, rounded to the cent.
    params: []
  inputs:
    history:
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_item_charged, item_category: weighted}}
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_item_refunded}}
    - {table: order_events, aggregate: sum, field: amount_usd, filters: {event_type: order_fee_refunded, fee_type: service}}
    - {category: membership, table: membership_events, aggregate: count, field: membership_event_id, within_months: 12, filters: {event_type: membership_fee_charged}}
    cross_category: [membership]
