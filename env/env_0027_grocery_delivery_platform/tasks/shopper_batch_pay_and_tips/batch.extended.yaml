events:
- type: batch_accepted
  target: batches
  mutation: create
  meaning: A shopper accepts a batch offer and the batch record opens.
  grain: one row per accepted batch
  fields: {customer_id: the shopper's profile, shopper_account_id: the shopper's contractor account, variant_name: official
      batch type, store_name: store the batch is shopped at, accepted_at: acceptance time, order_count: orders in
      the batch, item_count: item units in the batch, estimated_miles: estimated route miles, shown_pay_usd: pay
      before tips shown on the offer}
  triggers: []
- type: batch_shopping_started
  target: batches
  mutation:
    transition: {from: accepted, to: shopping}
  meaning: Shopping of the batch begins.
  grain: one row per transaction
  fields: {shopping_started_at: time shopping started}
  triggers: []
- type: batch_delivery_started
  target: batches
  mutation:
    transition: {from: shopping, to: delivering}
  meaning: The shopper leaves the store with the batch's orders.
  grain: one row per transaction
  fields: {wait_minutes: store-counter waiting recorded so far}
  triggers: []
- type: batch_completed
  target: batches
  mutation:
    transition:
    - {from: delivering, to: completed}
    - {from: shopping, to: completed}
  meaning: The last order of the batch is handed over, staged or returned to the store.
  grain: one row per transaction
  fields: {completed_date: completion date, actual_miles: GPS miles driven, wait_minutes: total recorded waiting}
  triggers:
  - event: batch:batch_pay_posted
    map: {pay_component: batch_base}
- type: batch_dropped
  target: batches
  mutation:
    transition:
    - {from: accepted, to: dropped}
    - {from: shopping, to: dropped}
  meaning: The shopper gives up the batch and it is reassigned.
  grain: one row per transaction
  fields: {dropped_date: drop date, drop_reason: controlled reason}
  triggers:
  - event: shopper:shopper_violation_recorded
    when: {drop_reason: shopper_choice}
    map: {violation_type: batch_dropped, batch_id: batch_id}
- type: batch_canceled
  target: batches
  mutation:
    transition:
    - {from: accepted, to: canceled}
    - {from: shopping, to: canceled}
  meaning: All orders in the batch are canceled by their customers.
  grain: one row per transaction
  fields: {canceled_date: cancellation date, cancel_stage: whether shopping had started}
  triggers:
  - event: batch:batch_pay_posted
    when: {cancel_stage: during_shopping}
    map: {pay_component: cancellation_pay}
- type: batch_finalized
  target: batches
  mutation:
    transition:
    - {from: completed, to: finalized}
    - {from: canceled, to: finalized}
  meaning: The batch's pay and tips become final.
  grain: one row per transaction
  fields: {finalized_date: date pay became final}
  triggers: []
- type: batch_pay_posted
  target: batch_events
  meaning: One pay component is credited to the batch.
  grain: one row per pay component per order (order empty for batch-level components)
  distinguish_by: [pay_component, order_id]
  fields: {pay_component: which component, order_id: order the component belongs to (empty for batch-level components),
    amount_usd: amount credited (positive), event_date: posting date}
  account: batch_earnings
  direction: in
  triggers:
  - event: payout:payout_earnings_credited
    map: {batch_id: batch_id, batch_event_id: batch_event_id, amount_usd: amount_usd}
- type: batch_tip_posted
  target: batch_events
  meaning: The customer's tip for one order is credited to the shopper at completion.
  grain: one row per tipped order
  distinguish_by: [order_id]
  fields: {batch_id: the batch that completed the order, order_id: the tipped order, amount_usd: tip credited (positive),
    event_date: posting date}
  account: batch_earnings
  direction: in
  triggers:
  - event: payout:payout_earnings_credited
    map: {batch_id: batch_id, batch_event_id: batch_event_id, amount_usd: amount_usd}
- type: batch_tip_adjusted_up
  target: batch_events
  meaning: A customer's tip increase for one order reaches the shopper.
  grain: one row per tip change
  distinguish_by: [order_id, event_date]
  fields: {batch_id: the batch that completed the order, order_id: the order whose tip changed, amount_usd: increase
      (positive), event_date: date of change}
  account: batch_earnings
  direction: in
  triggers:
  - event: payout:payout_earnings_credited
    map: {batch_id: batch_id, batch_event_id: batch_event_id, amount_usd: amount_usd}
- type: batch_tip_adjusted_down
  target: batch_events
  meaning: A customer's tip reduction for one order is taken from the shopper's earnings.
  grain: one row per tip change
  distinguish_by: [order_id, event_date]
  fields: {batch_id: the batch that completed the order, order_id: the order whose tip changed, amount_usd: reduction
      (positive), event_date: date of change}
  account: batch_earnings
  direction: out
  triggers:
  - event: payout:payout_earnings_debited
    map: {batch_id: batch_id, batch_event_id: batch_event_id, amount_usd: amount_usd}
- type: batch_pay_adjusted
  target: batch_events
  meaning: An approved pay adjustment is credited to the batch.
  grain: one row per adjustment reason per batch
  distinguish_by: [adjustment_reason]
  fields: {adjustment_reason: controlled reason, batch_pay_dispute_id: the dispute that asked for it, amount_usd: amount
      credited (positive), event_date: approval date}
  account: batch_earnings
  direction: in
  triggers:
  - event: payout:payout_earnings_credited
    map: {batch_id: batch_id, batch_event_id: batch_event_id, amount_usd: amount_usd}
- type: batch_pay_reversed
  target: batch_events
  meaning: All or part of one posted pay component is taken back.
  grain: one row per reversed pay row
  distinguish_by: [source_event_id]
  fields: {source_event_id: the batch_pay_posted or batch_pay_adjusted row reversed, reversal_reason: controlled
      reason, amount_usd: amount reversed (positive), event_date: reversal date}
  account: batch_earnings
  direction: out
  triggers:
  - event: payout:payout_earnings_debited
    map: {batch_id: batch_id, batch_event_id: batch_event_id, amount_usd: amount_usd}
measures:
- id: batch_msr_heavy_units
  window: the single batch
  measure: >-
    sum of quantity of order_item_charged rows with item_category heavy across the orders whose batch_id is this
    batch
- id: batch_msr_items_shopped
  window: the single batch, up to cancellation or completion
  measure: >-
    count of item units recorded in item_count for completed batches, or the units already shopped as recorded on
    the cancellation for canceled batches
- id: batch_msr_pay_before_tips
  window: the single batch, through frozen_time
  measure: >-
    sum of amount_usd of batch_pay_posted and batch_pay_adjusted rows on the batch minus batch_pay_reversed rows
- {id: batch_msr_adjustments_30d, window: 'rolling 30 calendar days ending on frozen_time, by event_date', measure: count
    of batch_pay_adjusted rows across all batches of the same shopper_account_id}
- id: batch_msr_returned_orders
  window: the single batch
  measure: >-
    count of orders whose batch_id is this batch and whose status is returned or closed after a return
policies:
- id: batch_agg_multi_holding
  subject: [batch_accepted]
  rule: >
    A shopper may hold only one batch in progress at a time; a new batch can be accepted only when every other batch
    of the same shopper_account_id is completed, dropped, canceled or finalized. The shopper's contractor account
    must be active and the batch type must be one the shopper's level allows (Express 30, Stock-Up, heavy and alcohol
    eligibility and max_concurrent_orders are set by the shopper charter). Completed batches accumulate without
    limit.
  eligibility:
  - id: one_in_progress
    applies_to: [batch_accepted]
    kind: dedup
    condition: >-
      A shopper may hold only one batch in progress at a time; a new batch can be accepted only when every other
      batch of the same shopper_account_id is completed, dropped, canceled or finalized.
    evidence_fields: [batches.shopper_account_id, batches.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batches.shopper_account_id]
      action_bindings: {batches.shopper_account_id: shopper_account_id}
    dedup_contract:
      table: batches
      mode: separate_record
      object_bindings: {shopper_account_id: shopper_account_id}
      duplicate_filters:
        status: [accepted, shopping, delivering]
      distinct_fields: []
  params: {max_per_customer: 1}
- id: batch_agg_adjustment_limits
  subject: [batch_pay_adjusted]
  rule: >
    Pay adjustments are limited across all of a shopper's batches. The agent may approve an adjustment only while
    batch_msr_adjustments_30d is below pay_adjustments_per_30d and the adjustment is not above pay_adjustment_agent_cap_usd
    of the batch's type; otherwise the dispute is escalated (dispute_status escalated) and no adjustment is booked
    by the agent.
  eligibility:
  - id: within_agent_limits
    applies_to: [batch_pay_adjusted]
    kind: authorization
    condition: >-
      The agent may approve an adjustment only while batch_msr_adjustments_30d is below pay_adjustments_per_30d
      and the adjustment is not above pay_adjustment_agent_cap_usd of the batch's type; otherwise the dispute is
      escalated (dispute_status escalated) and no adjustment is booked by the agent.
    evidence_fields: [batch_events.event_type, batch_events.event_date, batches.shopper_account_id, batches.batch_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batches.shopper_account_id]
      action_bindings: {batches.shopper_account_id: shopper_account_id}
  params:
    per_tier:
      Shop-Only Batch: {pay_adjustment_agent_cap_usd: =pay_adjustment_agent_cap_usd, pay_adjustments_per_30d: =pay_adjustments_per_30d}
      Express 30 Batch: {pay_adjustment_agent_cap_usd: =pay_adjustment_agent_cap_usd, pay_adjustments_per_30d: =pay_adjustments_per_30d}
      Single Delivery Batch: {pay_adjustment_agent_cap_usd: =pay_adjustment_agent_cap_usd, pay_adjustments_per_30d: =pay_adjustments_per_30d}
      Double Delivery Batch: {pay_adjustment_agent_cap_usd: =pay_adjustment_agent_cap_usd, pay_adjustments_per_30d: =pay_adjustments_per_30d}
      Triple Delivery Batch: {pay_adjustment_agent_cap_usd: =pay_adjustment_agent_cap_usd, pay_adjustments_per_30d: =pay_adjustments_per_30d}
      Stock-Up Batch: {pay_adjustment_agent_cap_usd: =pay_adjustment_agent_cap_usd, pay_adjustments_per_30d: =pay_adjustments_per_30d}
  measures: [batch_msr_adjustments_30d]
- id: batch_evt_pay_calculation
  subject: [batch_pay_posted, batch_completed]
  rule: >
    A completed batch is paid in components, each posted once per batch (or once per order for per-order components)
    and each rounded to the cent half up (earnings_currency_rounding). batch_base is batch_base_pay_usd. per_order
    is per_additional_order_pay_usd for each order beyond the first. per_item is per_item_pay_usd times item_count.
    staging is staging_pay_per_order_usd per staged order. mileage is mileage_rate_usd_per_mile times the part of
    estimated_miles above mileage_included_miles; it is always computed on the estimated route because mileage_basis
    is estimated_route, never on actual miles. long_distance is long_distance_bonus_usd when long_distance_threshold_miles
    is above 0 and estimated_miles exceeds it. heavy_pay is heavy_pay_per_unit_usd times batch_msr_heavy_units when
    heavy_pay_min_units is above 0 and batch_msr_heavy_units is at least heavy_pay_min_units. wait_time is wait_rate_usd_per_minute
    times the minutes of wait_minutes above wait_free_minutes, capped at wait_pay_cap_usd. peak_boost is the boost
    shown on the offer where peak_boost_eligible is true, never above peak_boost_max_usd. quality_bonus is quality_bonus_usd
    per order rated 5 stars within quality_bonus_window_hours with no item refund. return_pay is return_to_store_pay_usd
    per returned order. When the sum of components before tips is below minimum_batch_pay_usd, a minimum_topup component
    brings it up to that floor; and when shown_pay_is_floor is true and the sum is below shown_pay_usd while the
    orders did not change after acceptance, the gap is owed as a shown_pay_shortfall adjustment. Components are
    posted only on a batch that is completed or canceled, never on a dropped one.
  eligibility:
  - id: payable_state
    applies_to: [batch_pay_posted]
    kind: state
    condition: >-
      Components are posted only on a batch that is completed or canceled, never on a dropped one.
    evidence_fields: [batches.status, batches.batch_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batches.batch_id]
      action_bindings: {batches.batch_id: batch_id}
    state_contract:
      field: batches.status
      allowed: [completed, canceled]
  - id: once_per_component
    applies_to: [batch_pay_posted]
    kind: dedup
    condition: >-
      A completed batch is paid in components, each posted once per batch (or once per order for per-order components)
      and each rounded to the cent half up (earnings_currency_rounding).
    evidence_fields: [batch_events.batch_id, batch_events.pay_component, batch_events.order_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batch_events.batch_id]
      action_bindings: {batch_events.batch_id: batch_id}
    dedup_contract:
      table: batch_events
      mode: separate_record
      object_bindings: {batch_id: batch_id, pay_component: pay_component, order_id: order_id}
      duplicate_filters:
        event_type: [batch_pay_posted]
      distinct_fields: []
  params:
    per_tier:
      Shop-Only Batch: {batch_base_pay_usd: =batch_base_pay_usd, mileage_rate_usd_per_mile: =mileage_rate_usd_per_mile,
        minimum_batch_pay_usd: =minimum_batch_pay_usd, heavy_pay_per_unit_usd: =heavy_pay_per_unit_usd}
      Express 30 Batch: {batch_base_pay_usd: =batch_base_pay_usd, mileage_rate_usd_per_mile: =mileage_rate_usd_per_mile,
        minimum_batch_pay_usd: =minimum_batch_pay_usd, heavy_pay_per_unit_usd: =heavy_pay_per_unit_usd}
      Single Delivery Batch: {batch_base_pay_usd: =batch_base_pay_usd, mileage_rate_usd_per_mile: =mileage_rate_usd_per_mile,
        minimum_batch_pay_usd: =minimum_batch_pay_usd, heavy_pay_per_unit_usd: =heavy_pay_per_unit_usd}
      Double Delivery Batch: {batch_base_pay_usd: =batch_base_pay_usd, mileage_rate_usd_per_mile: =mileage_rate_usd_per_mile,
        minimum_batch_pay_usd: =minimum_batch_pay_usd, heavy_pay_per_unit_usd: =heavy_pay_per_unit_usd}
      Triple Delivery Batch: {batch_base_pay_usd: =batch_base_pay_usd, mileage_rate_usd_per_mile: =mileage_rate_usd_per_mile,
        minimum_batch_pay_usd: =minimum_batch_pay_usd, heavy_pay_per_unit_usd: =heavy_pay_per_unit_usd}
      Stock-Up Batch: {batch_base_pay_usd: =batch_base_pay_usd, mileage_rate_usd_per_mile: =mileage_rate_usd_per_mile,
        minimum_batch_pay_usd: =minimum_batch_pay_usd, heavy_pay_per_unit_usd: =heavy_pay_per_unit_usd}
  formula:
    mileage_pay: round(mileage_rate_usd_per_mile * max(estimated_miles - mileage_included_miles, 0), 2)
    wait_pay: >-
      min(round(wait_rate_usd_per_minute * max(wait_minutes - wait_free_minutes, 0), 2), wait_pay_cap_usd)
    per_order_pay: per_additional_order_pay_usd * max(order_count - 1, 0)
    per_item_pay: round(per_item_pay_usd * item_count, 2)
  measures: [batch_msr_heavy_units, batch_msr_pay_before_tips]
- id: batch_evt_tips
  subject: [batch_tip_posted, batch_tip_adjusted_up, batch_tip_adjusted_down, batch_finalized]
  rule: >
    tip_passthrough_pct of every customer tip goes to the shopper, and tips are never part of minimum_batch_pay_usd
    or shown_pay_usd. The tip on each delivered order is posted at completion, one row per order. A customer's tip
    change made within the order's tip edit window (order charter) is passed on as batch_tip_adjusted_up or batch_tip_adjusted_down
    on the batch that completed the order, and a reduction may take the batch's earnings for that order's tip down
    to 0.00 but never lower. Pay and tips become final pay_finalize_after_hours after completion, when the batch
    is finalized; after that no tip change reaches the batch. Tips are never reversed by a clawback because tips_clawback_allowed
    is false. Tip changes reach only a batch that is completed and not yet finalized.
  eligibility:
  - id: not_finalized
    applies_to: [batch_tip_adjusted_up, batch_tip_adjusted_down]
    kind: state
    condition: Tip changes reach only a batch that is completed and not yet finalized.
    evidence_fields: [batches.status, batches.batch_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batches.batch_id]
      action_bindings: {batches.batch_id: batch_id}
    state_contract:
      field: batches.status
      allowed: [completed]
  params:
    per_tier:
      Shop-Only Batch: {pay_finalize_after_hours: =pay_finalize_after_hours, tip_passthrough_pct: =tip_passthrough_pct}
      Express 30 Batch: {pay_finalize_after_hours: =pay_finalize_after_hours, tip_passthrough_pct: =tip_passthrough_pct}
      Single Delivery Batch: {pay_finalize_after_hours: =pay_finalize_after_hours, tip_passthrough_pct: =tip_passthrough_pct}
      Double Delivery Batch: {pay_finalize_after_hours: =pay_finalize_after_hours, tip_passthrough_pct: =tip_passthrough_pct}
      Triple Delivery Batch: {pay_finalize_after_hours: =pay_finalize_after_hours, tip_passthrough_pct: =tip_passthrough_pct}
      Stock-Up Batch: {pay_finalize_after_hours: =pay_finalize_after_hours, tip_passthrough_pct: =tip_passthrough_pct}
- id: batch_evt_cancel_and_drop
  subject: [batch_canceled, batch_dropped, batch_shopping_started, batch_delivery_started]
  rule: >
    When every order of a batch is canceled after shopping started (cancel_stage during_shopping), the shopper is
    paid a cancellation_pay component of cancellation_pay_usd plus cancellation_pay_per_item_shopped_usd per item
    unit already shopped (batch_msr_items_shopped); a batch canceled before shopping started earns nothing. A dropped
    batch earns nothing because drop_forfeits_pay is true, whatever was already shopped. A drop with drop_reason
    shopper_choice records a batch_dropped violation on the shopper account; a drop whose reason is in excused_drop_reasons
    records none. Shopping must start within accept_to_start_minutes of accepted_at, otherwise the batch is released
    as dropped with drop_reason not_started. An order returned to the store earns return_to_store_pay_usd only after
    contact_attempts_required attempts and customer_wait_before_return_minutes of waiting recorded in the app. Only
    a batch that is accepted or shopping can be dropped or canceled.
  eligibility:
  - id: open_batch
    applies_to: [batch_canceled, batch_dropped]
    kind: state
    condition: Only a batch that is accepted or shopping can be dropped or canceled.
    evidence_fields: [batches.status, batches.batch_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batches.batch_id]
      action_bindings: {batches.batch_id: batch_id}
    state_contract:
      field: batches.status
      allowed: [accepted, shopping, canceled, dropped]
  params:
    per_tier:
      Shop-Only Batch: {cancellation_pay_usd: =cancellation_pay_usd, return_to_store_pay_usd: =return_to_store_pay_usd,
        accept_to_start_minutes: =accept_to_start_minutes}
      Express 30 Batch: {cancellation_pay_usd: =cancellation_pay_usd, return_to_store_pay_usd: =return_to_store_pay_usd,
        accept_to_start_minutes: =accept_to_start_minutes}
      Single Delivery Batch: {cancellation_pay_usd: =cancellation_pay_usd, return_to_store_pay_usd: =return_to_store_pay_usd,
        accept_to_start_minutes: =accept_to_start_minutes}
      Double Delivery Batch: {cancellation_pay_usd: =cancellation_pay_usd, return_to_store_pay_usd: =return_to_store_pay_usd,
        accept_to_start_minutes: =accept_to_start_minutes}
      Triple Delivery Batch: {cancellation_pay_usd: =cancellation_pay_usd, return_to_store_pay_usd: =return_to_store_pay_usd,
        accept_to_start_minutes: =accept_to_start_minutes}
      Stock-Up Batch: {cancellation_pay_usd: =cancellation_pay_usd, return_to_store_pay_usd: =return_to_store_pay_usd,
        accept_to_start_minutes: =accept_to_start_minutes}
  formula:
    cancellation_pay: >-
      round(cancellation_pay_usd + cancellation_pay_per_item_shopped_usd * batch_msr_items_shopped, 2)
  measures: [batch_msr_items_shopped, batch_msr_returned_orders]
- id: batch_evt_pay_disputes
  subject: [batch_pay_adjusted]
  rule: >
    A shopper disputes pay on one batch by submitting a dispute naming a reason from the batch type's adjustment_reasons.
    A dispute is accepted only when it is submitted within the dispute window counted from the batch's completion.
    The window is counted in calendar days with completed_date as day 0, and the last day to dispute is completed_date
    plus pay_dispute_window_days, inclusive. The owed amount is what the component should have been under batch_evt_pay_calculation
    minus what was posted for it, rounded to the cent; a shortfall below pay_dispute_min_usd is not adjusted. mileage_underpaid
    is owed only when actual_miles exceed estimated_miles by more than mileage_dispute_tolerance_pct and then pays
    mileage_rate_usd_per_mile on the miles above that tolerance. Each batch receives at most one adjustment per
    adjustment_reason. An approved adjustment carries the dispute's id and the dispute is marked approved; a dispute
    found owed nothing is marked denied.
  eligibility:
  - id: dispute_window
    applies_to: [batch_pay_adjusted]
    kind: time
    condition: >-
      A dispute is accepted only when it is submitted within the dispute window counted from the batch's completion.
    evidence_fields: [batches.completed_date, batches.batch_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batches.batch_id]
      action_bindings: {batches.batch_id: batch_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the batch's completion
      anchor_source: batches.completed_date
      relation: not_after
      duration_source: variants.pay_dispute_window_days
      unit: calendar_days
      counting_rule: >-
        The window is counted in calendar days with completed_date as day 0, and the last day to dispute is completed_date
        plus pay_dispute_window_days, inclusive.
      boundary: inclusive
  - id: one_per_reason
    applies_to: [batch_pay_adjusted]
    kind: dedup
    condition: Each batch receives at most one adjustment per adjustment_reason.
    evidence_fields: [batch_events.batch_id, batch_events.adjustment_reason, batch_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batch_events.batch_id]
      action_bindings: {batch_events.batch_id: batch_id}
    dedup_contract:
      table: batch_events
      mode: separate_record
      object_bindings: {batch_id: batch_id, adjustment_reason: adjustment_reason}
      duplicate_filters:
        event_type: [batch_pay_adjusted]
      distinct_fields: []
  params:
    per_tier:
      Shop-Only Batch: {pay_dispute_window_days: =pay_dispute_window_days, mileage_dispute_tolerance_pct: =mileage_dispute_tolerance_pct}
      Express 30 Batch: {pay_dispute_window_days: =pay_dispute_window_days, mileage_dispute_tolerance_pct: =mileage_dispute_tolerance_pct}
      Single Delivery Batch: {pay_dispute_window_days: =pay_dispute_window_days, mileage_dispute_tolerance_pct: =mileage_dispute_tolerance_pct}
      Double Delivery Batch: {pay_dispute_window_days: =pay_dispute_window_days, mileage_dispute_tolerance_pct: =mileage_dispute_tolerance_pct}
      Triple Delivery Batch: {pay_dispute_window_days: =pay_dispute_window_days, mileage_dispute_tolerance_pct: =mileage_dispute_tolerance_pct}
      Stock-Up Batch: {pay_dispute_window_days: =pay_dispute_window_days, mileage_dispute_tolerance_pct: =mileage_dispute_tolerance_pct}
  formula:
    mileage_adjustment: >-
      round(mileage_rate_usd_per_mile * max(actual_miles - estimated_miles * (1 + mileage_dispute_tolerance_pct
      / 100), 0), 2)
- id: batch_evt_clawback
  subject: [batch_pay_reversed]
  rule: >
    Posted pay is reversed only on a ground listed in the batch type's clawback_reasons, and only within the clawback
    window counted from the batch's completion. The clawback window is counted in calendar days with completed_date
    as day 0, and the last day to reverse is completed_date plus clawback_window_days, inclusive. A reversal targets
    one posted or adjusted pay row, named by source_event_id, never more than that row's amount, and each row is
    reversed at most once. Tips are never reversed. A reversal for fraud_substantiated requires the shopper account
    to carry a zero-tolerance violation for the same order.
  eligibility:
  - id: clawback_window
    applies_to: [batch_pay_reversed]
    kind: time
    condition: >-
      Posted pay is reversed only on a ground listed in the batch type's clawback_reasons, and only within the clawback
      window counted from the batch's completion.
    evidence_fields: [batches.completed_date, batches.batch_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batches.batch_id]
      action_bindings: {batches.batch_id: batch_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the batch's completion
      anchor_source: batches.completed_date
      relation: not_after
      duration_source: variants.clawback_window_days
      unit: calendar_days
      counting_rule: >-
        The clawback window is counted in calendar days with completed_date as day 0, and the last day to reverse
        is completed_date plus clawback_window_days, inclusive.
      boundary: inclusive
  - id: reverse_once
    applies_to: [batch_pay_reversed]
    kind: dedup
    condition: >-
      A reversal targets one posted or adjusted pay row, named by source_event_id, never more than that row's amount,
      and each row is reversed at most once.
    evidence_fields: [batch_events.source_event_id, batch_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [batch_events.source_event_id]
      action_bindings: {batch_events.source_event_id: source_event_id}
    dedup_contract:
      table: batch_events
      mode: separate_record
      object_bindings: {source_event_id: source_event_id}
      duplicate_filters:
        event_type: [batch_pay_reversed]
      distinct_fields: []
  params:
    per_tier:
      Shop-Only Batch: {clawback_window_days: =clawback_window_days, clawback_reasons: =clawback_reasons}
      Express 30 Batch: {clawback_window_days: =clawback_window_days, clawback_reasons: =clawback_reasons}
      Single Delivery Batch: {clawback_window_days: =clawback_window_days, clawback_reasons: =clawback_reasons}
      Double Delivery Batch: {clawback_window_days: =clawback_window_days, clawback_reasons: =clawback_reasons}
      Triple Delivery Batch: {clawback_window_days: =clawback_window_days, clawback_reasons: =clawback_reasons}
      Stock-Up Batch: {clawback_window_days: =clawback_window_days, clawback_reasons: =clawback_reasons}
- id: batch_evt_lifecycle
  subject: [batch_accepted, batch_shopping_started, batch_delivery_started, batch_completed, batch_finalized]
  rule: >
    A batch moves accepted, shopping, then delivering (batch types with includes_delivery true) and completed, or
    straight from shopping to completed for a Shop-Only Batch; every step is recorded by the system from the shopper's
    app and the agent never advances a batch's status. A batch carries at most orders_per_batch orders, max_item_units
    item units and an estimated route of at most max_route_miles. Alcohol is handed over only after the ID scan
    where alcohol_id_scan_required is true. Weekly payouts sweep earnings up to weekly_pay_cutoff. An offer not
    accepted within offer_expiry_seconds passes to another shopper and creates no batch. Each posted pay component
    is shown to the shopper where pay_breakdown_visible is true.
  eligibility: []
  params:
    per_tier:
      Shop-Only Batch: {orders_per_batch: =orders_per_batch, max_item_units: =max_item_units, max_route_miles: =max_route_miles}
      Express 30 Batch: {orders_per_batch: =orders_per_batch, max_item_units: =max_item_units, max_route_miles: =max_route_miles}
      Single Delivery Batch: {orders_per_batch: =orders_per_batch, max_item_units: =max_item_units, max_route_miles: =max_route_miles}
      Double Delivery Batch: {orders_per_batch: =orders_per_batch, max_item_units: =max_item_units, max_route_miles: =max_route_miles}
      Triple Delivery Batch: {orders_per_batch: =orders_per_batch, max_item_units: =max_item_units, max_route_miles: =max_route_miles}
      Stock-Up Batch: {orders_per_batch: =orders_per_batch, max_item_units: =max_item_units, max_route_miles: =max_route_miles}

extended_policies:
- id: batch_ext_long_distance_bonus
  base_policy_refs: [batch_evt_pay_calculation]
  overwrite:
  - base_policy: batch_evt_pay_calculation
    superseded_clause: >-
      long_distance is long_distance_bonus_usd when long_distance_threshold_miles is above 0 and estimated_miles
      exceeds it.
    replaced_by: >-
      The long-distance bonus posted is the long-distance bonus amount plus the long-distance route extension plus
      the long-distance order supplement, that sum multiplied by the long-distance card uplift and only then
      rounded once to the cent half up.
  trigger: state_due
  subject: [batch_pay_posted]
  computes: amount_usd
  target_tool: post_pay_component_6b97a1a8
  params:
    thr_long: 8.0
    thr_mid: 9.0
    amt_clean: 1.0
    amt_fair: 0.5
    ext_min_excess: 3.0
    ext_rate_late: 0.1
    supp_three: 0.4
    supp_two: 0.3
    uplift_high: 1.1
    uplift_blue: 1.05
  rule: >
    A long-distance bonus that is due on a completed batch but absent from the batch's earnings entries is posted
    by the desk as one long-distance pay component, once per batch. The long-distance bonus on a completed batch is
    one flat amount, the batch type's long-distance bonus, paid when the batch type's long-distance threshold is
    above zero and the estimated route shown on the offer exceeds that threshold. The distance compared is the
    estimated route, never the miles driven. The bonus is rounded to the cent half up and posted once on the batch.
    The long-distance threshold that applies is 8.0 miles for a shopper account at the Gold level or above (Gold,
    Platinum or Diamond) that is 36 or more whole calendar months past its first activation date, 9.0 miles for an
    account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date,
    and the batch type's long-distance threshold for every other account; a batch type whose own threshold is zero
    carries no bonus at all. The long-distance bonus amount is the batch type's long-distance bonus plus 1.00 when
    the shopper account carries no active violation points, the batch type's long-distance bonus plus 0.50 when it
    carries one or two active violation points, and the batch type's long-distance bonus alone when it carries
    three or more. The long-distance route extension is worked out as follows: when the
    estimated route exceeds the batch type's own long-distance threshold by 3.0 miles or more and the shopper
    account carries no late-delivery violation recorded against this batch, the extension grows the long-distance
    bonus amount in proportion to the route: the bonus amount times the estimated miles beyond the long-distance
    threshold that applies, divided by that threshold, rounded down to the ten cents; when the route exceeds the
    batch type's own threshold by 3.0 miles or more and one or more late-delivery violations are recorded against
    this batch, the extension is only 0.10 for each whole estimated mile beyond the long-distance threshold that
    applies, part miles not counted; otherwise the bonus stays the flat amount with no extension. The long-distance order
    supplement counts the additional orders the batch was paid for, found as the batch's posted per-order pay
    divided by the batch type's pay per additional order and rounded to a whole number; it is 0.40 per additional
    order when that count is two or more, 0.30 per additional order when it is exactly one, and nothing when it is
    zero. The long-distance card uplift is 1.10 when the shopper's payout account is on an Everyday Pay Card plan
    at the Gold tier or above (Gold, Platinum or Diamond, the plans paying fuel cashback of 3 percent or more),
    1.05 when it is on the Everyday Pay Card Blue plan (fuel cashback above zero and below 3 percent), and 1.00 for
    every other payout plan or when no payout account exists. The long-distance bonus posted is the long-distance
    bonus amount plus the long-distance route extension plus the long-distance order supplement, that sum
    multiplied by the long-distance card uplift and only then rounded once to the cent half up. Components are
    posted only on a batch that is completed or canceled, never on a dropped one.
  prerequisite: []
  cross_category:
  - category: shopper
    as: branch
    reads: [variant_name, activated_date, violation_points_balance, shopper_events.violation_type]
    note: The shopper account's level and months since activation decide the threshold, its active violation points
      decide the bonus amount, and late-delivery violations recorded against the batch decide the route extension.
  - category: payout
    as: branch
    reads: [variant_name]
    note: The payout plan's fuel-cashback tier decides the long-distance card uplift.
  compute:
  - ld_level: "CPARAM('shopper', 'level_min_batches_30d')"
  - ld_tenure: "MONTHS(CFIELD('shopper', 'activated_date'), NOW)"
  - ld_threshold: "K('thr_long') if (ld_level >= 80 and ld_tenure >= 36) else (K('thr_mid') if (ld_level >= 40 and ld_tenure >= 12 and ld_tenure < 36) else P('long_distance_threshold_miles'))"
  - ld_due: "1 if (P('long_distance_threshold_miles') > 0 and F('estimated_miles') > ld_threshold) else 0"
  - ld_points: "CFIELD('shopper', 'violation_points_balance')"
  - ld_amount: "P('long_distance_bonus_usd') + K('amt_clean') if ld_points == 0 else (P('long_distance_bonus_usd') + K('amt_fair') if (ld_points >= 1 and ld_points <= 2) else P('long_distance_bonus_usd'))"
  - ld_late: "XCOUNT('shopper', 'shopper_events', event_type='shopper_violation_recorded', violation_type='late_delivery', batch_id=HID)"
  - ld_route_excess: "F('estimated_miles') - P('long_distance_threshold_miles')"
  - ld_extension: "int(RND(ld_amount * (F('estimated_miles') - ld_threshold) / MX(ld_threshold, 0.1) * 10, 6)) / 10 if (ld_route_excess >= K('ext_min_excess') and ld_late == 0) else (K('ext_rate_late') * int(RND(F('estimated_miles') - ld_threshold, 6)) if (ld_route_excess >= K('ext_min_excess') and ld_late >= 1) else 0)"
  - ld_addl_orders: "RND(SUM('batch_events', 'amount_usd', event_type='batch_pay_posted', pay_component='per_order') / MX(P('per_additional_order_pay_usd'), 0.01), 0)"
  - ld_order_supp: "K('supp_three') * ld_addl_orders if ld_addl_orders >= 2 else (K('supp_two') * ld_addl_orders if ld_addl_orders == 1 else 0)"
  - ld_fuel: "CPARAM('payout', 'cashback_fuel_pct') or 0"
  - ld_uplift: "K('uplift_high') if ld_fuel >= 3 else (K('uplift_blue') if (ld_fuel > 0 and ld_fuel < 3) else 1)"
  - result: "RND((ld_amount + ld_extension + ld_order_supp) * ld_uplift * ld_due, 2)"
  compute_basis:
    ld_level: "The long-distance threshold that applies is 8.0 miles for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar months past its first activation date"
    ld_tenure: "36 or more whole calendar months past its first activation date, 9.0 miles for an account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date"
    ld_threshold: "The long-distance threshold that applies is 8.0 miles for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar months past its first activation date, 9.0 miles for an account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date, and the batch type's long-distance threshold for every other account"
    ld_due: "paid when the batch type's long-distance threshold is above zero and the estimated route shown on the offer exceeds that threshold. The distance compared is the estimated route, never the miles driven."
    ld_points: "the batch type's long-distance bonus plus 1.00 when the shopper account carries no active violation points"
    ld_amount: "The long-distance bonus amount is the batch type's long-distance bonus plus 1.00 when the shopper account carries no active violation points, the batch type's long-distance bonus plus 0.50 when it carries one or two active violation points, and the batch type's long-distance bonus alone when it carries three or more."
    ld_late: "the shopper account carries no late-delivery violation recorded against this batch"
    ld_route_excess: "when the estimated route exceeds the batch type's own long-distance threshold by 3.0 miles or more"
    ld_extension: "when the estimated route exceeds the batch type's own long-distance threshold by 3.0 miles or more and the shopper account carries no late-delivery violation recorded against this batch, the extension grows the long-distance bonus amount in proportion to the route: the bonus amount times the estimated miles beyond the long-distance threshold that applies, divided by that threshold, rounded down to the ten cents; when the route exceeds the batch type's own threshold by 3.0 miles or more and one or more late-delivery violations are recorded against this batch, the extension is only 0.10 for each whole estimated mile beyond the long-distance threshold that applies, part miles not counted; otherwise the bonus stays the flat amount with no extension."
    ld_addl_orders: "The long-distance order supplement counts the additional orders the batch was paid for, found as the batch's posted per-order pay divided by the batch type's pay per additional order and rounded to a whole number"
    ld_order_supp: "it is 0.40 per additional order when that count is two or more, 0.30 per additional order when it is exactly one, and nothing when it is zero."
    ld_fuel: "The long-distance card uplift is 1.10 when the shopper's payout account is on an Everyday Pay Card plan at the Gold tier or above (Gold, Platinum or Diamond, the plans paying fuel cashback of 3 percent or more)"
    ld_uplift: "The long-distance card uplift is 1.10 when the shopper's payout account is on an Everyday Pay Card plan at the Gold tier or above (Gold, Platinum or Diamond, the plans paying fuel cashback of 3 percent or more), 1.05 when it is on the Everyday Pay Card Blue plan (fuel cashback above zero and below 3 percent), and 1.00 for every other payout plan or when no payout account exists."
    result: "The long-distance bonus posted is the long-distance bonus amount plus the long-distance route extension plus the long-distance order supplement, that sum multiplied by the long-distance card uplift and only then rounded once to the cent half up."
  factors:
  - id: ld_threshold_by_standing
    effect: parameter
    decides: ld_threshold
    bindings: [ld_level, ld_tenure, ld_threshold]
    ladder:
    - when: "the shopper account is at the Gold level or above AND is 36 or more whole calendar months past its first activation date"
      value: "K('thr_long') = 8.0 miles"
    - when: "the shopper account is at the Silver level or above AND is 12 to 35 whole calendar months past its first activation date"
      value: "K('thr_mid') = 9.0 miles"
    - when: "otherwise"
      value: "P('long_distance_threshold_miles')"
    baseline:
      ld_threshold: "P('long_distance_threshold_miles')"
    evidence: [cross_category, date]
    cross_difficulty: shopper
  - id: ld_amount_by_points
    effect: parameter
    decides: ld_amount
    bindings: [ld_points, ld_amount]
    ladder:
    - when: "the shopper account carries no active violation points"
      value: "P('long_distance_bonus_usd') + K('amt_clean') (type bonus + 1.00)"
    - when: "the shopper account carries one or two active violation points"
      value: "P('long_distance_bonus_usd') + K('amt_fair') (type bonus + 0.50)"
    - when: "otherwise (three or more active violation points)"
      value: "P('long_distance_bonus_usd')"
    baseline:
      ld_amount: "P('long_distance_bonus_usd')"
    evidence: [cross_category]
    cross_difficulty: shopper
  - id: ld_route_extension
    effect: method
    decides: ld_extension
    bindings: [ld_late, ld_route_excess, ld_extension]
    ladder:
    - when: "the estimated route exceeds the batch type's own threshold by 3.0 miles or more AND no late-delivery violation is recorded against the batch"
      method: "flat bonus plus a proportional extension: bonus amount x (estimated miles beyond the threshold that applies) / that threshold, rounded down to the ten cents"
    - when: "the estimated route exceeds the batch type's own threshold by 3.0 miles or more AND one or more late-delivery violations are recorded against the batch"
      method: "flat bonus plus 0.10 for each whole estimated mile beyond the threshold that applies (part miles not counted)"
    - when: "otherwise"
      method: "the flat bonus alone, no extension"
    baseline:
      ld_extension: "0"
    evidence: [cross_category, history]
    cross_difficulty: shopper
  - id: ld_order_supplement
    effect: parameter
    decides: ld_order_supp
    bindings: [ld_addl_orders, ld_order_supp]
    ladder:
    - when: "the batch's posted per-order pay covers two or more additional orders"
      value: "K('supp_three') = 0.40 per additional order"
    - when: "the batch's posted per-order pay covers exactly one additional order"
      value: "K('supp_two') = 0.30 per additional order"
    - when: "otherwise (no additional order paid)"
      value: "0"
    baseline:
      ld_order_supp: "0"
    evidence: [history]
    cross_difficulty: null
  - id: ld_card_uplift
    effect: parameter
    decides: ld_uplift
    bindings: [ld_fuel, ld_uplift]
    ladder:
    - when: "the payout account is on an Everyday Pay Card plan at Gold, Platinum or Diamond (fuel cashback 3 percent or more)"
      value: "K('uplift_high') = 1.10"
    - when: "the payout account is on the Everyday Pay Card Blue plan (fuel cashback above zero and below 3 percent)"
      value: "K('uplift_blue') = 1.05"
    - when: "otherwise"
      value: "1.00"
    baseline:
      ld_uplift: "1"
    evidence: [cross_category]
    cross_difficulty: payout
  baseline:
    rule: >-
      The long-distance bonus on a completed batch is one flat amount, the batch type's long-distance bonus, paid
      when the batch type's long-distance threshold is above zero and the estimated route shown on the offer
      exceeds that threshold. The distance compared is the estimated route, never the miles driven. The bonus is
      rounded to the cent half up and posted once on the batch.
    params: [long_distance_bonus_usd, long_distance_threshold_miles]
  inputs:
    history:
    - {table: batch_events, aggregate: sum, field: amount_usd, filters: {event_type: batch_pay_posted, pay_component: per_order}}
    - {category: shopper, table: shopper_events, aggregate: count, field: shopper_event_id, filters: {event_type: shopper_violation_recorded, violation_type: late_delivery}}
    cross_category: [shopper, payout]
- id: batch_ext_duplicate_recovery
  base_policy_refs: [batch_evt_clawback]
  overwrite: []
  trigger: state_due
  subject: [batch_pay_reversed]
  computes: amount_usd
  target_tool: reverse_duplicate_pay_33b66c45
  params:
    loyal_long: 1.0
    loyal_mid: 0.5
    standing_clean: 0.5
    standing_fair: 0.25
    sameday_both: 0.3
    sameday_one: 0.15
  rule: >
    When the mileage component stands twice among a batch's pay postings, the second posting is a duplicate and the
    desk takes it back with one reversal on the duplicate-pay ground, within the clawback window and at most once
    for that posting. The amount taken back for a duplicate mileage posting is the full amount of the later of the
    two mileage postings, rounded to the cent half up. It is taken back in one reversal against that later posting
    and never exceeds it. Goodwill is applied to that full amount before anything is taken back, in three
    allowances that are each subtracted from it, and the remainder is never below zero. The duplicate loyalty
    allowance is 1.00 for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or
    more whole calendar months past its first activation date, 0.50 for an account at the Silver level or above
    that is 12 to 35 whole calendar months past its first activation date, and nothing for every other account.
    The duplicate standing allowance is 0.50 when the shopper account carries no active violation points and no
    late-delivery violation is recorded against the batch, 0.25 when the account carries one or two active
    violation points and at most one late-delivery violation is recorded against the batch or when it carries no
    active points and exactly one such violation is recorded, and nothing otherwise. The same-day posting
    allowance is 0.30 when both mileage postings carry the batch's completion date as their posting date, 0.15
    when exactly one of them does, and nothing when neither does. What remains after the three allowances is then
    taken back by the duplicate cash-out method: when the shopper's payout account paid out an instant cashout
    less than one whole calendar month before the handling date and the account is on an Everyday Pay Card plan,
    the remainder is halved and rounded down to the cent; when such an instant cashout was paid and the account is
    on any other payout plan, the remainder is multiplied by 0.75 and rounded up to the cent; when no such instant
    cashout was paid, the remainder is taken back in full.
  prerequisite: []
  cross_category:
  - category: shopper
    as: branch
    reads: [variant_name, activated_date, violation_points_balance, shopper_events.violation_type]
    note: Level and months since activation decide the loyalty allowance; active points and late-delivery violations
      against the batch decide the standing allowance.
  - category: payout
    as: history
    reads: [variant_name, payout_events.event_type]
    note: A recent instant cashout and whether the plan is an Everyday Pay Card decide the cash-out method.
  compute:
  - dr_postings: "COUNT('batch_events', event_type='batch_pay_posted', pay_component='mileage')"
  - dr_dup_amount: "LATEST('batch_events', 'amount_usd', event_type='batch_pay_posted', pay_component='mileage') if dr_postings >= 2 else 0"
  - dr_level: "CPARAM('shopper', 'level_min_batches_30d')"
  - dr_tenure: "MONTHS(CFIELD('shopper', 'activated_date'), NOW)"
  - dr_loyal: "K('loyal_long') if (dr_level >= 80 and dr_tenure >= 36) else (K('loyal_mid') if (dr_level >= 40 and dr_tenure >= 12 and dr_tenure < 36) else 0)"
  - dr_points: "CFIELD('shopper', 'violation_points_balance')"
  - dr_late: "XCOUNT('shopper', 'shopper_events', event_type='shopper_violation_recorded', violation_type='late_delivery', batch_id=HID)"
  - dr_standing: "K('standing_clean') if (dr_points == 0 and dr_late == 0) else (K('standing_fair') if ((dr_points >= 1 and dr_points <= 2 and dr_late <= 1) or (dr_points == 0 and dr_late == 1)) else 0)"
  - dr_sameday_n: "COUNT('batch_events', event_type='batch_pay_posted', pay_component='mileage', event_date=F('completed_date'))"
  - dr_sameday: "K('sameday_both') if (dr_sameday_n >= 2 and dr_postings >= 2) else (K('sameday_one') if (dr_sameday_n == 1 and dr_postings >= 2) else 0)"
  - dr_remainder: "MX(0, dr_dup_amount - dr_loyal - dr_standing - dr_sameday)"
  - dr_cashouts: "XCOUNT('payout', 'payout_events', event_type='payout_instant_cashout', within_months=1)"
  - dr_card: "1 if CPARAM('payout', 'card_tier_follows_level') == True else 0"
  - dr_take: "int(RND(dr_remainder * 50, 6)) / 100 if (dr_cashouts >= 1 and dr_card == 1) else (-(-RND(dr_remainder * 75, 6) // 1) / 100 if (dr_cashouts >= 1 and dr_card == 0) else dr_remainder)"
  - result: "RND(dr_take, 2)"
  compute_basis:
    dr_postings: "When the mileage component stands twice among a batch's pay postings, the second posting is a duplicate"
    dr_dup_amount: "The amount taken back for a duplicate mileage posting is the full amount of the later of the two mileage postings, rounded to the cent half up."
    dr_level: "The duplicate loyalty allowance is 1.00 for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar months past its first activation date"
    dr_tenure: "36 or more whole calendar months past its first activation date, 0.50 for an account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date"
    dr_loyal: "The duplicate loyalty allowance is 1.00 for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar months past its first activation date, 0.50 for an account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date, and nothing for every other account."
    dr_points: "The duplicate standing allowance is 0.50 when the shopper account carries no active violation points"
    dr_late: "no late-delivery violation is recorded against the batch"
    dr_standing: "The duplicate standing allowance is 0.50 when the shopper account carries no active violation points and no late-delivery violation is recorded against the batch, 0.25 when the account carries one or two active violation points and at most one late-delivery violation is recorded against the batch or when it carries no active points and exactly one such violation is recorded, and nothing otherwise."
    dr_sameday_n: "when both mileage postings carry the batch's completion date as their posting date"
    dr_sameday: "The same-day posting allowance is 0.30 when both mileage postings carry the batch's completion date as their posting date, 0.15 when exactly one of them does, and nothing when neither does."
    dr_remainder: "Goodwill is applied to that full amount before anything is taken back, in three allowances that are each subtracted from it, and the remainder is never below zero."
    dr_cashouts: "when the shopper's payout account paid out an instant cashout less than one whole calendar month before the handling date"
    dr_card: "the account is on an Everyday Pay Card plan"
    dr_take: "when the shopper's payout account paid out an instant cashout less than one whole calendar month before the handling date and the account is on an Everyday Pay Card plan, the remainder is halved and rounded down to the cent; when such an instant cashout was paid and the account is on any other payout plan, the remainder is multiplied by 0.75 and rounded up to the cent; when no such instant cashout was paid, the remainder is taken back in full."
    result: "It is taken back in one reversal against that later posting and never exceeds it."
  factors:
  - id: dr_loyalty_allowance
    effect: parameter
    decides: dr_loyal
    bindings: [dr_level, dr_tenure, dr_loyal]
    ladder:
    - when: "Gold level or above AND 36 or more whole calendar months since first activation"
      value: "K('loyal_long') = 1.00"
    - when: "Silver level or above AND 12 to 35 whole calendar months since first activation"
      value: "K('loyal_mid') = 0.50"
    - when: "otherwise"
      value: "0"
    baseline:
      dr_loyal: "0"
    evidence: [cross_category, date]
    cross_difficulty: shopper
  - id: dr_standing_allowance
    effect: parameter
    decides: dr_standing
    bindings: [dr_points, dr_late, dr_standing]
    ladder:
    - when: "no active violation points AND no late-delivery violation against the batch"
      value: "K('standing_clean') = 0.50"
    - when: "one or two active points AND at most one late-delivery violation against the batch, OR no active points AND exactly one such violation"
      value: "K('standing_fair') = 0.25"
    - when: "otherwise"
      value: "0"
    baseline:
      dr_standing: "0"
    evidence: [cross_category, history]
    cross_difficulty: shopper
  - id: dr_same_day_allowance
    effect: parameter
    decides: dr_sameday
    bindings: [dr_sameday_n, dr_sameday]
    ladder:
    - when: "both mileage postings are dated the batch's completion date"
      value: "K('sameday_both') = 0.30"
    - when: "exactly one of the two mileage postings is dated the completion date"
      value: "K('sameday_one') = 0.15"
    - when: "otherwise"
      value: "0"
    baseline:
      dr_sameday: "0"
    evidence: [history, date]
    cross_difficulty: null
  - id: dr_cashout_method
    effect: method
    decides: dr_take
    bindings: [dr_cashouts, dr_card, dr_take]
    ladder:
    - when: "an instant cashout was paid out less than one whole calendar month before the handling date AND the payout plan is an Everyday Pay Card"
      method: "the remainder is halved and rounded down to the cent"
    - when: "such an instant cashout was paid AND the payout plan is not an Everyday Pay Card"
      method: "the remainder is multiplied by 0.75 and rounded up to the cent"
    - when: "otherwise"
      method: "the remainder is taken back in full"
    baseline:
      dr_take: "dr_remainder"
    evidence: [cross_category, history]
    cross_difficulty: payout
  baseline:
    rule: >-
      The amount taken back for a duplicate mileage posting is the full amount of the later of the two mileage
      postings, rounded to the cent half up. It is taken back in one reversal against that later posting and never
      exceeds it.
    params: []
  inputs:
    history:
    - {table: batch_events, aggregate: latest, field: amount_usd, filters: {event_type: batch_pay_posted, pay_component: mileage}}
    - {table: batch_events, aggregate: count, field: batch_event_id, filters: {event_type: batch_pay_posted, pay_component: mileage}}
    - {category: payout, table: payout_events, aggregate: count, field: payout_event_id, within_months: 1, filters: {event_type: payout_instant_cashout}}
    cross_category: [shopper, payout]
- id: batch_ext_shown_pay_claim
  base_policy_refs: [batch_evt_pay_calculation, batch_evt_lifecycle, batch_evt_pay_disputes]
  overwrite: []
  trigger: on_request
  subject: [batch_completed]
  computes: claimed_amount_usd
  target_tool: submit_pay_dispute_0c2b2ed2
  params:
    share_some_points: 0.97
    share_many_points: 0.95
    tol_std: 0.5
    tol_mid: 0.25
    wait_half: 0.5
    wait_most: 0.75
    five_two: 1.0
    five_one: 0.5
  rule: >
    A shopper who holds that a completed batch paid less than its accepted offer showed disputes it herself by
    submitting a shown-pay shortfall dispute on that batch, and the amount she claims on it is the claimed shortfall
    worked out below. The claimed shortfall is fixed only after the batch's earnings entries carry a long-distance
    bonus whenever the estimated route exceeds the long-distance threshold that applies to the shopper. The claimed
    shortfall is not worked out until every mileage posting that stands twice on the batch carries a reversal
    against its later posting. The amount claimed on a shown-pay dispute is the pay shown on the accepted offer
    less the pay before tips standing on the batch and less an offer tolerance of 0.50, rounded once to the cent
    half up and never below zero. The pay before tips standing on the batch is every pay component posted plus
    every pay adjustment, less every pay reversal. The guaranteed offer figure replaces the pay shown on the offer
    in that comparison and is found by the late-order guarantee method: when two or more late-delivery violations
    are recorded against the batch and it carried two or more orders, the shown pay is prorated to the orders
    delivered on time (the shown pay times the on-time orders divided by all orders, rounded to the cent half up);
    when exactly one late-delivery violation is recorded against a batch of two or more orders, the shown pay is
    reduced by the batch type's pay per additional order; otherwise the shown pay stands whole. The guarantee
    standing share multiplies the guaranteed offer figure: 0.97 when the shopper account carries one to three
    active violation points, 0.95 when it carries four or more, and 1.00 when it carries none. The claim offer
    tolerance replaces the standard tolerance: nothing for a shopper account at the Gold level or above (Gold,
    Platinum or Diamond) that is 36 or more whole calendar months past its first activation date, 0.25 for an
    account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date,
    and the standard 0.50 for every other account. The waiting-pay offset share decides how much of the
    waiting-time pay posted on the batch is set against the offer: one half when that posted waiting-time pay is
    2.00 or more, three quarters when it is at least 1.00 and below 2.00, and all of it when it is below 1.00; the
    part not set against the offer is taken out of the pay before tips standing. The five-star offer supplement is
    added to the guaranteed figure after the standing share is applied: 1.00 when two or more five-star customer
    ratings are recorded against the batch, 0.50 when exactly one is, and nothing when none is. The claimed
    shortfall is therefore worked out in this order: first the guaranteed offer figure is multiplied by the
    guarantee standing share and the five-star offer supplement is added, giving the guaranteed amount; then the
    pay before tips standing, less the part of the waiting-time pay not set against the offer, and the claim offer
    tolerance are both subtracted from that guaranteed amount; the result is rounded once to the cent half up and
    a negative result is claimed as zero.
  prerequisite:
  - problem: batch_ext_long_distance_bonus
    kind: value_input
    gate: sc_posted
    form: state
    policy_source: >-
      The claimed shortfall is fixed only after the batch's earnings entries carry a long-distance bonus whenever
      the estimated route exceeds the long-distance threshold that applies to the shopper.
    condition: >-
      batch_events carries one batch_pay_posted row with pay_component long_distance for the batch whenever
      estimated_miles exceeds the long-distance threshold that applies to the shopper account.
    resolved_by: post_pay_component_6b97a1a8
    effect: >-
      The posted long-distance bonus raises the pay components posted on the batch (sc_posted), which lowers the
      claimed shortfall by the bonus amount.
  - problem: batch_ext_duplicate_recovery
    kind: value_input
    gate: sc_reversed
    form: state
    policy_source: >-
      The claimed shortfall is not worked out until every mileage posting that stands twice on the batch carries a
      reversal against its later posting.
    condition: >-
      When two batch_pay_posted rows with pay_component mileage stand on the batch, a batch_pay_reversed row names
      the later one as its source_event_id.
    resolved_by: reverse_duplicate_pay_33b66c45
    effect: >-
      The reversal raises the pay reversals on the batch (sc_reversed), which lowers the pay before tips standing
      and raises the claimed shortfall by the amount taken back.
  cross_category:
  - category: shopper
    as: history
    reads: [variant_name, activated_date, violation_points_balance, shopper_events.violation_type, shopper_events.rating]
    note: Late-delivery violations against the batch choose the guarantee method, active points the standing share,
      level and months since activation the tolerance, and five-star ratings against the batch the supplement.
  compute:
  - sc_late: "XCOUNT('shopper', 'shopper_events', event_type='shopper_violation_recorded', violation_type='late_delivery', batch_id=HID)"
  - sc_guaranteed: "RND(F('shown_pay_usd') * (F('order_count') - sc_late) / F('order_count'), 2) if (sc_late >= 2 and F('order_count') >= 2) else (RND(F('shown_pay_usd') - P('per_additional_order_pay_usd'), 2) if (sc_late == 1 and F('order_count') >= 2) else F('shown_pay_usd'))"
  - sc_points: "CFIELD('shopper', 'violation_points_balance')"
  - sc_share: "K('share_some_points') if (sc_points >= 1 and sc_points <= 3) else (K('share_many_points') if sc_points >= 4 else 1)"
  - sc_level: "CPARAM('shopper', 'level_min_batches_30d')"
  - sc_tenure: "MONTHS(CFIELD('shopper', 'activated_date'), NOW)"
  - sc_tolerance: "0 if (sc_level >= 80 and sc_tenure >= 36) else (K('tol_mid') if (sc_level >= 40 and sc_tenure >= 12 and sc_tenure < 36) else K('tol_std'))"
  - sc_wait_posted: "SUM('batch_events', 'amount_usd', event_type='batch_pay_posted', pay_component='wait_time')"
  - sc_wait_share: "K('wait_half') if sc_wait_posted >= 2 else (K('wait_most') if (sc_wait_posted >= 1 and sc_wait_posted < 2) else 1)"
  - sc_five: "XCOUNT('shopper', 'shopper_events', event_type='shopper_rating_received', rating=5, batch_id=HID)"
  - sc_supplement: "K('five_two') if sc_five >= 2 else (K('five_one') if sc_five == 1 else 0)"
  - sc_posted: "SUM('batch_events', 'amount_usd', event_type='batch_pay_posted')"
  - sc_adjusted: "SUM('batch_events', 'amount_usd', event_type='batch_pay_adjusted')"
  - sc_reversed: "SUM('batch_events', 'amount_usd', event_type='batch_pay_reversed')"
  - sc_counted: "sc_posted + sc_adjusted - sc_reversed - sc_wait_posted * (1 - sc_wait_share)"
  - result: "MX(0, RND(sc_guaranteed * sc_share + sc_supplement - sc_counted - sc_tolerance, 2))"
  compute_basis:
    sc_late: "when two or more late-delivery violations are recorded against the batch and it carried two or more orders"
    sc_guaranteed: "when two or more late-delivery violations are recorded against the batch and it carried two or more orders, the shown pay is prorated to the orders delivered on time (the shown pay times the on-time orders divided by all orders, rounded to the cent half up); when exactly one late-delivery violation is recorded against a batch of two or more orders, the shown pay is reduced by the batch type's pay per additional order; otherwise the shown pay stands whole."
    sc_points: "0.97 when the shopper account carries one to three active violation points"
    sc_share: "The guarantee standing share multiplies the guaranteed offer figure: 0.97 when the shopper account carries one to three active violation points, 0.95 when it carries four or more, and 1.00 when it carries none."
    sc_level: "nothing for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar months past its first activation date"
    sc_tenure: "36 or more whole calendar months past its first activation date, 0.25 for an account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date"
    sc_tolerance: "The claim offer tolerance replaces the standard tolerance: nothing for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar months past its first activation date, 0.25 for an account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date, and the standard 0.50 for every other account."
    sc_wait_posted: "The waiting-pay offset share decides how much of the waiting-time pay posted on the batch is set against the offer"
    sc_wait_share: "one half when that posted waiting-time pay is 2.00 or more, three quarters when it is at least 1.00 and below 2.00, and all of it when it is below 1.00; the part not set against the offer is taken out of the pay before tips standing."
    sc_five: "1.00 when two or more five-star customer ratings are recorded against the batch"
    sc_supplement: "The five-star offer supplement is added to the guaranteed figure after the standing share is applied: 1.00 when two or more five-star customer ratings are recorded against the batch, 0.50 when exactly one is, and nothing when none is."
    sc_posted: "The pay before tips standing on the batch is every pay component posted plus every pay adjustment, less every pay reversal."
    sc_adjusted: "The pay before tips standing on the batch is every pay component posted plus every pay adjustment, less every pay reversal."
    sc_reversed: "The pay before tips standing on the batch is every pay component posted plus every pay adjustment, less every pay reversal."
    sc_counted: "then the pay before tips standing, less the part of the waiting-time pay not set against the offer, and the claim offer tolerance are both subtracted from that guaranteed amount"
    result: "The claimed shortfall is therefore worked out in this order: first the guaranteed offer figure is multiplied by the guarantee standing share and the five-star offer supplement is added, giving the guaranteed amount; then the pay before tips standing, less the part of the waiting-time pay not set against the offer, and the claim offer tolerance are both subtracted from that guaranteed amount; the result is rounded once to the cent half up and a negative result is claimed as zero."
  factors:
  - id: sc_late_order_guarantee
    effect: method
    decides: sc_guaranteed
    bindings: [sc_late, sc_guaranteed]
    ladder:
    - when: "two or more late-delivery violations recorded against the batch AND the batch carried two or more orders"
      method: "the shown pay prorated to the on-time orders (shown pay times on-time orders divided by all orders, rounded to the cent)"
    - when: "exactly one late-delivery violation recorded against the batch AND the batch carried two or more orders"
      method: "the shown pay less the batch type's pay per additional order"
    - when: "otherwise"
