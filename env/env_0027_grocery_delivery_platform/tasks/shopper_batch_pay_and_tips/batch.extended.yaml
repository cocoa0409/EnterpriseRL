- id: batch_ext_mileage_claim
  base_policy_refs: [batch_evt_pay_calculation, batch_evt_lifecycle, batch_evt_pay_disputes]
  overwrite:
  - base_policy: batch_evt_pay_disputes
    superseded_clause: >-
      mileage_underpaid is owed only when actual_miles exceed estimated_miles by more than mileage_dispute_tolerance_pct
      and then pays mileage_rate_usd_per_mile on the miles above that tolerance.
    replaced_by: >-
      The amount claimed on a mileage dispute is the mileage owed on the paid route less the mileage pay standing on
      the batch, rounded once to the cent half up and never below zero, and it is claimed only when the miles
      driven exceed the estimated route by more than the mileage dispute tolerance.
  trigger: on_request
  subject: [batch_completed]
  computes: claimed_amount_usd
  target_tool: submit_mileage_claim_29030431
  params:
    tol_long: 5
    tol_mid: 10
    rate_clean: 0.1
    rate_fair: 0.05
    rated_well: 0.4
    rated_mixed: 0.2
  rule: >
    A shopper who holds that the miles she drove on a completed batch ran well beyond the estimated route files a
    mileage dispute on that batch herself, and the amount she claims on it is worked out below; a batch whose pay
    has since been finalized still counts as completed here. The mileage claim
    is not fixed until the batch's earnings entries carry a reversal on the verified not-delivered ground for the
    orders that wrong-address violations recorded against the batch show as not delivered. The amount claimed on a
    mileage dispute is the mileage owed on the paid route less the mileage pay standing on the batch, rounded once
    to the cent half up and never below zero, and it is claimed only when the miles driven exceed the estimated
    route by more than the mileage dispute tolerance. The paid route is the estimated route plus the miles driven
    beyond the estimated route grown by the tolerance, less the batch type's included miles, and the mileage owed
    on it is the batch type's mileage rate per mile. The mileage pay standing is the batch's posted mileage pay
    less the reversals booked on the batch on the verified not-delivered ground. The claim tolerance replaces the
    batch type's mileage dispute tolerance: 5 percent for a shopper account at the Gold level or above (Gold,
    Platinum or Diamond) that is 36 or more whole calendar months past its first activation date, 10 percent for
    an account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date,
    and the batch type's tolerance for every other account. The detour exclusion method decides how many of the
    miles driven beyond the tolerance count: when one or more wrong-address violations are recorded against the
    batch, those miles are multiplied by the delivered orders (orders less wrong-address violations, never below
    zero) divided by all orders and rounded down to a tenth of a mile; when no wrong-address violation but one or
    more late-delivery violations are recorded against the batch, those miles are halved and rounded down to a
    whole mile; otherwise all of them count. The claim mileage rate replaces the batch type's mileage rate: the
    batch type's rate plus 0.10 per mile when the shopper account carries no active violation points, the batch
    type's rate plus 0.05 per mile when it carries one to three, and the batch type's rate alone when it carries
    four or more. The rated-service mileage supplement is added to the mileage owed: 0.40 when the batch
    carries a five-star customer rating and no rating of two stars or fewer, 0.20 when it carries a five-star
    rating and also a rating of two stars or fewer, and nothing when it carries no five-star rating. The claim is
    therefore worked out in this order: first the counted miles beyond the tolerance are added to the estimated
    route and the included miles are subtracted, giving the paid route; then the paid route is multiplied by the
    claim mileage rate and the rated-service supplement is added; then the mileage pay standing is subtracted and
    the result is rounded once to the cent half up.
  prerequisite:
  - problem: batch_ext_undelivered_recovery
    kind: value_input
    gate: mc_standing
    form: state
    policy_source: >-
      The mileage claim is not fixed until the batch's earnings entries carry a reversal on the verified
      not-delivered ground for the orders that wrong-address violations recorded against the batch show as not
      delivered.
    condition: >-
      When a wrong_address shopper_violation_recorded row names the batch, a batch_pay_reversed row with
      reversal_reason order_not_delivered_verified stands on the batch against its mileage posting.
    resolved_by: reverse_undelivered_pay_ec14645c
    effect: >-
      The reversal lowers the mileage pay standing on the batch (mc_standing) by the amount taken back, which
      raises the claimed amount by the same figure.
  cross_category:
  - category: shopper
    as: history
    reads: [variant_name, activated_date, violation_points_balance, shopper_events.violation_type, shopper_events.rating]
    note: Level and months since activation decide the claim tolerance, wrong-address violations the detour
      exclusion, active points the claim rate, and customer ratings against the batch the supplement.
  compute:
  - mc_level: "CPARAM('shopper', 'level_min_batches_30d')"
  - mc_tenure: "MONTHS(CFIELD('shopper', 'activated_date'), NOW)"
  - mc_tolerance: "K('tol_long') if (mc_level >= 80 and mc_tenure >= 36) else (K('tol_mid') if (mc_level >= 40 and mc_tenure >= 12 and mc_tenure < 36) else P('mileage_dispute_tolerance_pct'))"
  - mc_beyond: "MX(0, F('actual_miles') - F('estimated_miles') * (1 + mc_tolerance / 100))"
  - mc_wrong: "XCOUNT('shopper', 'shopper_events', event_type='shopper_violation_recorded', violation_type='wrong_address', batch_id=HID)"
  - mc_late: "XCOUNT('shopper', 'shopper_events', event_type='shopper_violation_recorded', violation_type='late_delivery', batch_id=HID)"
  - mc_counted: "int(RND(mc_beyond * MX(F('order_count') - mc_wrong, 0) / F('order_count') * 10, 6)) / 10 if mc_wrong >= 1 else (int(RND(mc_beyond / 2, 6)) if (mc_wrong == 0 and mc_late >= 1) else mc_beyond)"
  - mc_points: "CFIELD('shopper', 'violation_points_balance')"
  - mc_rate: "P('mileage_rate_usd_per_mile') + K('rate_clean') if mc_points == 0 else (P('mileage_rate_usd_per_mile') + K('rate_fair') if (mc_points >= 1 and mc_points <= 3) else P('mileage_rate_usd_per_mile'))"
  - mc_five: "XCOUNT('shopper', 'shopper_events', event_type='shopper_rating_received', rating=5, batch_id=HID)"
  - mc_low: "XCOUNT('shopper', 'shopper_events', event_type='shopper_rating_received', rating=1, batch_id=HID) + XCOUNT('shopper', 'shopper_events', event_type='shopper_rating_received', rating=2, batch_id=HID)"
  - mc_supplement: "K('rated_well') if (mc_five >= 1 and mc_low == 0) else (K('rated_mixed') if (mc_five >= 1 and mc_low >= 1) else 0)"
  - mc_posted: "SUM('batch_events', 'amount_usd', event_type='batch_pay_posted', pay_component='mileage')"
  - mc_reversed: "SUM('batch_events', 'amount_usd', event_type='batch_pay_reversed', reversal_reason='order_not_delivered_verified')"
  - mc_standing: "mc_posted - mc_reversed"
  - mc_qualifies: "1 if F('actual_miles') > F('estimated_miles') * (1 + mc_tolerance / 100) else 0"
  - mc_paid_route: "MX(0, F('estimated_miles') + mc_counted - P('mileage_included_miles'))"
  - result: "MX(0, RND(mc_paid_route * mc_rate + mc_supplement - mc_standing, 2)) * mc_qualifies"
  compute_basis:
    mc_level: "5 percent for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar months past its first activation date"
    mc_tenure: "36 or more whole calendar months past its first activation date, 10 percent for an account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date"
    mc_tolerance: "The claim tolerance replaces the batch type's mileage dispute tolerance: 5 percent for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar months past its first activation date, 10 percent for an account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date, and the batch type's tolerance for every other account."
    mc_beyond: "The paid route is the estimated route plus the miles driven beyond the estimated route grown by the tolerance, less the batch type's included miles"
    mc_wrong: "when one or more wrong-address violations are recorded against the batch, those miles are multiplied by the delivered orders"
    mc_late: "when no wrong-address violation but one or more late-delivery violations are recorded against the batch"
    mc_counted: "The detour exclusion method decides how many of the miles driven beyond the tolerance count: when one or more wrong-address violations are recorded against the batch, those miles are multiplied by the delivered orders (orders less wrong-address violations, never below zero) divided by all orders and rounded down to a tenth of a mile; when no wrong-address violation but one or more late-delivery violations are recorded against the batch, those miles are halved and rounded down to a whole mile; otherwise all of them count."
    mc_points: "the batch type's rate plus 0.10 per mile when the shopper account carries no active violation points"
    mc_rate: "The claim mileage rate replaces the batch type's mileage rate: the batch type's rate plus 0.10 per mile when the shopper account carries no active violation points, the batch type's rate plus 0.05 per mile when it carries one to three, and the batch type's rate alone when it carries four or more."
    mc_five: "0.40 when the batch carries a five-star customer rating and no rating of two stars or fewer"
    mc_low: "a rating of two stars or fewer"
    mc_supplement: "The rated-service mileage supplement is added to the mileage owed: 0.40 when the batch carries a five-star customer rating and no rating of two stars or fewer, 0.20 when it carries a five-star rating and also a rating of two stars or fewer, and nothing when it carries no five-star rating."
    mc_posted: "The mileage pay standing is the batch's posted mileage pay less the reversals booked on the batch on the verified not-delivered ground."
    mc_reversed: "The mileage pay standing is the batch's posted mileage pay less the reversals booked on the batch on the verified not-delivered ground."
    mc_standing: "The mileage pay standing is the batch's posted mileage pay less the reversals booked on the batch on the verified not-delivered ground."
    mc_qualifies: "it is claimed only when the miles driven exceed the estimated route by more than the mileage dispute tolerance"
    mc_paid_route: "first the counted miles beyond the tolerance are added to the estimated route and the included miles are subtracted, giving the paid route"
    result: "then the paid route is multiplied by the claim mileage rate and the rated-service supplement is added; then the mileage pay standing is subtracted and the result is rounded once to the cent half up."
  factors:
  - id: mc_claim_tolerance
    effect: parameter
    decides: mc_tolerance
    bindings: [mc_level, mc_tenure, mc_tolerance]
    ladder:
    - when: "Gold level or above AND 36 or more whole calendar months since first activation"
      value: "K('tol_long') = 5 percent"
    - when: "Silver level or above AND 12 to 35 whole calendar months since first activation"
      value: "K('tol_mid') = 10 percent"
    - when: "otherwise"
      value: "P('mileage_dispute_tolerance_pct')"
    baseline:
      mc_tolerance: "P('mileage_dispute_tolerance_pct')"
    evidence: [cross_category, date]
    cross_difficulty: shopper
  - id: mc_detour_exclusion
    effect: method
    decides: mc_counted
    bindings: [mc_wrong, mc_late, mc_counted]
    ladder:
    - when: "one or more wrong-address violations recorded against the batch"
      method: "miles beyond the tolerance times delivered orders over all orders, rounded down to a tenth of a mile"
    - when: "no wrong-address violation AND one or more late-delivery violations recorded against the batch"
      method: "miles beyond the tolerance halved and rounded down to a whole mile"
    - when: "otherwise"
      method: "all miles beyond the tolerance count"
    baseline:
      mc_counted: "mc_beyond"
    evidence: [cross_category]
    cross_difficulty: shopper
  - id: mc_claim_rate
    effect: parameter
    decides: mc_rate
    bindings: [mc_points, mc_rate]
    ladder:
    - when: "no active violation points"
      value: "P('mileage_rate_usd_per_mile') + K('rate_clean') (type rate + 0.10 per mile)"
    - when: "one to three active violation points"
      value: "P('mileage_rate_usd_per_mile') + K('rate_fair') (type rate + 0.05 per mile)"
    - when: "otherwise (four or more)"
      value: "P('mileage_rate_usd_per_mile')"
    baseline:
      mc_rate: "P('mileage_rate_usd_per_mile')"
    evidence: [cross_category]
    cross_difficulty: shopper
  - id: mc_rated_supplement
    effect: parameter
    decides: mc_supplement
    bindings: [mc_five, mc_low, mc_supplement]
    ladder:
    - when: "a five-star rating against the batch AND no rating of two stars or fewer"
      value: "K('rated_well') = 0.40"
    - when: "a five-star rating against the batch AND a rating of two stars or fewer"
      value: "K('rated_mixed') = 0.20"
    - when: "otherwise (no five-star rating)"
      value: "0"
    baseline:
      mc_supplement: "0"
    evidence: [cross_category]
    cross_difficulty: shopper
  baseline:
    rule: >-
      The amount claimed on a mileage dispute is the mileage owed on the paid route less the mileage pay standing
      on the batch, rounded once to the cent half up and never below zero, and it is claimed only when the miles
      driven exceed the estimated route by more than the mileage dispute tolerance. The paid route is the estimated
      route plus the miles driven beyond the estimated route grown by the tolerance, less the batch type's included
      miles, and the mileage owed on it is the batch type's mileage rate per mile. The mileage pay standing is the
      batch's posted mileage pay less the reversals booked on the batch on the verified not-delivered ground.
    params: [mileage_dispute_tolerance_pct, mileage_rate_usd_per_mile, mileage_included_miles]
  inputs:
    history:
    - {table: batch_events, aggregate: sum, field: amount_usd, filters: {event_type: batch_pay_posted, pay_component: mileage}}
    - {table: batch_events, aggregate: sum, field: amount_usd, filters: {event_type: batch_pay_reversed, reversal_reason: order_not_delivered_verified}}
    - {category: shopper, table: shopper_events, aggregate: count, field: shopper_event_id, filters: {event_type: shopper_rating_received}}
    cross_category: [shopper]
- id: batch_ext_mileage_adjustment
  base_policy_refs: [batch_agg_adjustment_limits, batch_evt_pay_disputes]
  overwrite:
  - base_policy: batch_evt_pay_disputes
    superseded_clause: >-
      The owed amount is what the component should have been under batch_evt_pay_calculation minus what was posted
      for it, rounded to the cent;
    replaced_by: >-
      The mileage adjustment approved on a completed batch is the amount claimed on the shopper's submitted mileage
      dispute, rounded to the cent half up; a claim below the batch type's minimum dispute amount is not adjusted
      and books nothing.
  - base_policy: batch_evt_pay_disputes
    superseded_clause: >-
      mileage_underpaid is owed only when actual_miles exceed estimated_miles by more than mileage_dispute_tolerance_pct
      and then pays mileage_rate_usd_per_mile on the miles above that tolerance.
    replaced_by: >-
      The mileage adjustment approved on a completed batch is the amount claimed on the shopper's submitted mileage
      dispute, rounded to the cent half up; a claim below the batch type's minimum dispute amount is not adjusted
      and books nothing.
  trigger: on_request
  subject: [batch_pay_adjusted]
  computes: amount_usd
  target_tool: book_mileage_adjustment_6fe9f3bb
  params:
    share_some_points: 0.95
    share_many_points: 0.9
    fee_full: 1.0
    fee_part: 0.5
    prompt_fast: 0.4
    prompt_soon: 0.2
    route_far: 0.75
    route_over: 0.4
  rule: >
    The desk answers a shopper's submitted mileage dispute on a completed batch, finalized or not, by booking one
    pay adjustment with the reason mileage underpaid that carries that dispute's reference, and the dispute is
    marked approved. A
    mileage adjustment is not booked until the batch carries a submitted mileage dispute from the shopper stating a
    claimed amount. The mileage adjustment approved on a completed batch is the amount claimed on the shopper's
    submitted mileage dispute, rounded to the cent half up; a claim below the batch type's minimum dispute amount
    is not adjusted and books nothing. The claimed amount is first multiplied by the mileage approval share: 0.95
    when the shopper account carries one to three active violation points, 0.90 when it carries four or more, and
    1.00 when it carries none. Three credits are then added. The cashout-fee credit is 1.00 when the instant
    cashout fees charged on the shopper's payout account in less than one whole calendar month before the handling
    date total 1.00 or more, 0.50 when they total more than zero and less than 1.00, and nothing when none was
    charged. The mileage prompt credit is counted in calendar days from the batch's completion date to the date the
    mileage dispute was submitted: 0.40 when that span is zero or one day, 0.20 when it is two to four days, and
    nothing when it is longer. The long-route credit is 0.75 when the batch's posted mileage pay is 3.00 or more
    and the miles driven are at least one and a half times the estimated route, 0.40 when the posted mileage pay is
    3.00 or more and the miles driven exceed the estimated route by more than the batch type's mileage dispute
    tolerance but stay below one and a half times it, and nothing otherwise. The sum so formed is finally settled
    by the tenure method: for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36
    or more whole calendar months past its first activation date the sum is multiplied by 1.08 and rounded up to
    the cent; for an account at the Silver level or above that is 12 to 35 whole calendar months past its first
    activation date it is multiplied by 1.04 and rounded down to the cent; for every other account the sum stands
    as it is. The figure that results is rounded once more to the cent half up and booked as the adjustment amount.
  prerequisite:
  - problem: batch_ext_mileage_claim
    kind: value_input
    gate: ma_claim
    form: state
    policy_source: >-
      A mileage adjustment is not booked until the batch carries a submitted mileage dispute from the shopper
      stating a claimed amount.
    condition: >-
      batch_pay_disputes carries a row for the batch with dispute_reason mileage_underpaid, dispute_status submitted
      and a claimed_amount_usd.
    resolved_by: submit_mileage_claim_29030431
    effect: >-
      The submitted mileage dispute supplies the claimed amount (ma_claim) the adjustment is built on; without it
      the adjustment books nothing.
  cross_category:
  - category: shopper
    as: branch
    reads: [variant_name, activated_date, violation_points_balance]
    note: Active points decide the approval share; level and months since activation choose the tenure method.
  - category: payout
    as: history
    reads: [payout_events.event_type, payout_events.amount_usd]
    note: Instant cashout fees charged in the last month decide the cashout-fee credit.
  compute:
  - ma_claims: "COUNT('batch_pay_disputes', dispute_reason='mileage_underpaid', dispute_status='submitted')"
  - ma_claim: "(LATEST('batch_pay_disputes', 'claimed_amount_usd', date_field='created_at', dispute_reason='mileage_underpaid', dispute_status='submitted') or 0) if ma_claims >= 1 else 0"
  - ma_points: "CFIELD('shopper', 'violation_points_balance')"
  - ma_share: "K('share_some_points') if (ma_points >= 1 and ma_points <= 3) else (K('share_many_points') if ma_points >= 4 else 1)"
  - ma_fees: "XSUM('payout', 'payout_events', 'amount_usd', event_type='payout_cashout_fee_charged', within_months=1)"
  - ma_fee_credit: "K('fee_full') if ma_fees >= 1 else (K('fee_part') if (ma_fees > 0 and ma_fees < 1) else 0)"
  - ma_days: "DAYS(F('completed_date'), LATEST('batch_pay_disputes', 'created_at', date_field='created_at', dispute_reason='mileage_underpaid', dispute_status='submitted') or NOW)"
  - ma_prompt: "K('prompt_fast') if ma_days <= 1 else (K('prompt_soon') if (ma_days >= 2 and ma_days <= 4) else 0)"
  - ma_mileage_posted: "SUM('batch_events', 'amount_usd', event_type='batch_pay_posted', pay_component='mileage')"
  - ma_route: "K('route_far') if (ma_mileage_posted >= 3 and F('actual_miles') >= 1.5 * F('estimated_miles')) else (K('route_over') if (ma_mileage_posted >= 3 and F('actual_miles') > F('estimated_miles') * (1 + P('mileage_dispute_tolerance_pct') / 100) and F('actual_miles') < 1.5 * F('estimated_miles')) else 0)"
  - ma_sum: "ma_claim * ma_share + ma_fee_credit + ma_prompt + ma_route"
  - ma_level: "CPARAM('shopper', 'level_min_batches_30d')"
  - ma_tenure: "MONTHS(CFIELD('shopper', 'activated_date'), NOW)"
  - ma_settled: "-(-RND(ma_sum * 108, 6) // 1) / 100 if (ma_level >= 80 and ma_tenure >= 36) else (int(RND(ma_sum * 104, 6)) / 100 if (ma_level >= 40 and ma_tenure >= 12 and ma_tenure < 36) else ma_sum)"
  - result: "RND(ma_settled, 2) if (ma_claims >= 1 and ma_claim >= P('pay_dispute_min_usd')) else 0"
  compute_basis:
    ma_claims: "A mileage adjustment is not booked until the batch carries a submitted mileage dispute from the shopper stating a claimed amount."
    ma_claim: "The mileage adjustment approved on a completed batch is the amount claimed on the shopper's submitted mileage dispute, rounded to the cent half up"
    ma_points: "0.95 when the shopper account carries one to three active violation points"
    ma_share: "The claimed amount is first multiplied by the mileage approval share: 0.95 when the shopper account carries one to three active violation points, 0.90 when it carries four or more, and 1.00 when it carries none."
    ma_fees: "the instant cashout fees charged on the shopper's payout account in less than one whole calendar month before the handling date"
    ma_fee_credit: "The cashout-fee credit is 1.00 when the instant cashout fees charged on the shopper's payout account in less than one whole calendar month before the handling date total 1.00 or more, 0.50 when they total more than zero and less than 1.00, and nothing when none was charged."
    ma_days: "The mileage prompt credit is counted in calendar days from the batch's completion date to the date the mileage dispute was submitted"
    ma_prompt: "0.40 when that span is zero or one day, 0.20 when it is two to four days, and nothing when it is longer."
    ma_mileage_posted: "The long-route credit is 0.75 when the batch's posted mileage pay is 3.00 or more"
    ma_route: "The long-route credit is 0.75 when the batch's posted mileage pay is 3.00 or more and the miles driven are at least one and a half times the estimated route, 0.40 when the posted mileage pay is 3.00 or more and the miles driven exceed the estimated route by more than the batch type's mileage dispute tolerance but stay below one and a half times it, and nothing otherwise."
    ma_sum: "Three credits are then added."
    ma_level: "for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar months past its first activation date the sum is multiplied by 1.08 and rounded up to the cent"
    ma_tenure: "for an account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date it is multiplied by 1.04 and rounded down to the cent"
    ma_settled: "The sum so formed is finally settled by the tenure method: for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar months past its first activation date the sum is multiplied by 1.08 and rounded up to the cent; for an account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date it is multiplied by 1.04 and rounded down to the cent; for every other account the sum stands as it is."
    result: "a claim below the batch type's minimum dispute amount is not adjusted and books nothing"
  factors:
  - id: ma_approval_share
    effect: parameter
    decides: ma_share
    bindings: [ma_points, ma_share]
    ladder:
    - when: "one to three active violation points"
      value: "K('share_some_points') = 0.95"
    - when: "four or more active violation points"
      value: "K('share_many_points') = 0.90"
    - when: "otherwise (no active points)"
      value: "1.00"
    baseline:
      ma_share: "1"
    evidence: [cross_category]
    cross_difficulty: shopper
  - id: ma_cashout_fee_credit
    effect: parameter
    decides: ma_fee_credit
    bindings: [ma_fees, ma_fee_credit]
    ladder:
    - when: "instant cashout fees in the last month total 1.00 or more"
      value: "K('fee_full') = 1.00"
    - when: "instant cashout fees in the last month total more than zero and less than 1.00"
      value: "K('fee_part') = 0.50"
    - when: "otherwise"
      value: "0"
    baseline:
      ma_fee_credit: "0"
    evidence: [cross_category, history]
    cross_difficulty: payout
  - id: ma_prompt_credit
    effect: parameter
    decides: ma_prompt
    bindings: [ma_days, ma_prompt]
    ladder:
    - when: "mileage dispute submitted zero or one calendar day after completion"
      value: "K('prompt_fast') = 0.40"
    - when: "mileage dispute submitted two to four calendar days after completion"
      value: "K('prompt_soon') = 0.20"
    - when: "otherwise"
      value: "0"
    baseline:
      ma_prompt: "0"
    evidence: [date, history]
    cross_difficulty: null
  - id: ma_long_route_credit
    effect: parameter
    decides: ma_route
    bindings: [ma_mileage_posted, ma_route]
    ladder:
    - when: "posted mileage pay 3.00 or more AND miles driven at least 1.5 times the estimated route"
      value: "K('route_far') = 0.75"
    - when: "posted mileage pay 3.00 or more AND miles driven beyond the tolerance but below 1.5 times the estimate"
      value: "K('route_over') = 0.40"
    - when: "otherwise"
      value: "0"
    baseline:
      ma_route: "0"
    evidence: [history]
    cross_difficulty: null
  - id: ma_tenure_method
    effect: method
    decides: ma_settled
    bindings: [ma_level, ma_tenure, ma_settled]
    ladder:
    - when: "Gold level or above AND 36 or more whole calendar months since first activation"
      method: "the sum is multiplied by 1.08 and rounded up to the cent"
    - when: "Silver level or above AND 12 to 35 whole calendar months since first activation"
      method: "the sum is multiplied by 1.04 and rounded down to the cent"
    - when: "otherwise"
      method: "the sum stands as it is"
    baseline:
      ma_settled: "ma_sum"
    evidence: [cross_category, date]
    cross_difficulty: shopper
  baseline:
    rule: >-
      The mileage adjustment approved on a completed batch is the amount claimed on the shopper's submitted mileage
      dispute, rounded to the cent half up; a claim below the batch type's minimum dispute amount is not adjusted
      and books nothing.
    params: [pay_dispute_min_usd]
  inputs:
    history:
    - {table: batch_pay_disputes, aggregate: latest, field: claimed_amount_usd, filters: {dispute_reason: mileage_underpaid, dispute_status: submitted}}
    - {table: batch_events, aggregate: sum, field: amount_usd, filters: {event_type: batch_pay_posted, pay_component: mileage}}
    - {category: payout, table: payout_events, aggregate: sum, field: amount_usd, within_months: 1, filters: {event_type: payout_cashout_fee_charged}}
    cross_category: [shopper, payout]
