  - id: sc_offer_tolerance
    effect: parameter
    decides: sc_tolerance
    bindings: [sc_level, sc_tenure, sc_tolerance]
    ladder:
    - when: "Gold level or above AND 36 or more whole calendar months since first activation"
      value: "0"
    - when: "Silver level or above AND 12 to 35 whole calendar months since first activation"
      value: "K('tol_mid') = 0.25"
    - when: "otherwise"
      value: "K('tol_std') = 0.50"
    baseline:
