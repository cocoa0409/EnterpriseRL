- id: batch_ext_shown_pay_adjustment
  base_policy_refs: [batch_agg_adjustment_limits, batch_evt_pay_disputes, batch_evt_pay_calculation]
  overwrite:
  - base_policy: batch_evt_pay_calculation
    superseded_clause: >-
      and when shown_pay_is_floor is true and the sum is below shown_pay_usd while the orders did not change after
      acceptance, the gap is owed as a shown_pay_shortfall adjustment.
    replaced_by: >-
      The shown-pay adjustment approved on a completed batch is the amount claimed on the shopper's submitted
      shown-pay shortfall dispute, rounded to the cent half up; a claim below the batch type's minimum dispute
      amount is not adjusted and books nothing.
  - base_policy: batch_evt_pay_disputes
    superseded_clause: >-
      The owed amount is what the component should have been under batch_evt_pay_calculation minus what was posted
      for it, rounded to the cent;
    replaced_by: >-
      The shown-pay adjustment approved on a completed batch is the amount claimed on the shopper's submitted
      shown-pay shortfall dispute, rounded to the cent half up; a claim below the batch type's minimum dispute
      amount is not adjusted and books nothing.
  trigger: on_request
  subject: [batch_pay_adjusted]
  computes: amount_usd
  target_tool: book_pay_adjustment_e97659e1
  params:
    makegood_long: 1.5
    makegood_mid: 0.75
    share_low_rating: 0.9
    share_high_rating: 1.04
    prompt_fast: 0.5
    prompt_soon: 0.25
  rule: >
    The desk answers a shopper's submitted shown-pay shortfall dispute on a completed batch by booking one pay
    adjustment with the reason shown-pay shortfall that carries that dispute's reference, and the dispute is marked
    approved. A shown-pay adjustment is booked only after the batch carries a submitted shown-pay shortfall dispute
    from the shopper stating a claimed amount. The shown-pay adjustment approved on a completed batch is the amount
    claimed on the shopper's submitted shown-pay shortfall dispute, rounded to the cent half up; a claim below the
    batch type's minimum dispute amount is not adjusted and books nothing. The claimed amount is first multiplied
    by the rating approval share: 0.90 when the batch carries at least one customer rating and at least one of
    its ratings is three stars or fewer, 1.04 when it carries at least one customer rating and none is below four
    stars, and 1.00 when it carries no customer rating. The shown-pay make-good credit is then added: 1.50 for a
    shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar months
    past its first activation date, 0.75 for an account at the Silver level or above that is 12 to 35 whole
    calendar months past its first activation date, and nothing for every other account. The prompt-dispute credit
    is added as well, counted in calendar days from the batch's completion date to the date the dispute was
    submitted: 0.50 when that span is zero or one day, 0.25 when it is two or three days, and nothing when it is
    longer. The sum so formed is finally settled by the payout-card method: for a payout account on an Everyday Pay
    Card plan at Gold, Platinum or Diamond (fuel cashback of 3 percent or more) the sum is multiplied by 1.05 and
    rounded up to the cent; for the Everyday Pay Card Blue plan (fuel cashback above zero and below 3 percent) it
    is multiplied by 1.02 and rounded down to the cent; for every other payout plan the sum stands as it is. The
    figure that results is rounded once more to the cent half up and booked as the adjustment amount.
  prerequisite:
  - problem: batch_ext_shown_pay_claim
    kind: value_input
    gate: sa_claim
    form: state
    policy_source: >-
      A shown-pay adjustment is booked only after the batch carries a submitted shown-pay shortfall dispute from
      the shopper stating a claimed amount.
    condition: >-
      batch_pay_disputes carries a row for the batch with dispute_reason shown_pay_shortfall, dispute_status
      submitted and a claimed_amount_usd.
    resolved_by: submit_pay_dispute_0c2b2ed2
    effect: >-
      The submitted dispute supplies the claimed amount (sa_claim) that the adjustment is built on; without it the
      adjustment books nothing.
  cross_category:
  - category: shopper
    as: history
    reads: [variant_name, activated_date, shopper_events.rating]
    note: Customer ratings against the batch decide the rating approval share; level and months since activation
      decide the make-good credit.
  - category: payout
    as: branch
    reads: [variant_name]
    note: The payout plan's fuel-cashback tier chooses the payout-card method.
  compute:
  - sa_claims: "COUNT('batch_pay_disputes', dispute_reason='shown_pay_shortfall', dispute_status='submitted')"
  - sa_claim: "(LATEST('batch_pay_disputes', 'claimed_amount_usd', date_field='created_at', dispute_reason='shown_pay_shortfall', dispute_status='submitted') or 0) if sa_claims >= 1 else 0"
  - sa_rated: "XCOUNT('shopper', 'shopper_events', event_type='shopper_rating_received', batch_id=HID)"
  - sa_low: "XCOUNT('shopper', 'shopper_events', event_type='shopper_rating_received', rating=1, batch_id=HID) + XCOUNT('shopper', 'shopper_events', event_type='shopper_rating_received', rating=2, batch_id=HID) + XCOUNT('shopper', 'shopper_events', event_type='shopper_rating_received', rating=3, batch_id=HID)"
  - sa_rating_share: "K('share_low_rating') if (sa_rated >= 1 and sa_low >= 1) else (K('share_high_rating') if (sa_rated >= 1 and sa_low == 0) else 1)"
  - sa_level: "CPARAM('shopper', 'level_min_batches_30d')"
  - sa_tenure: "MONTHS(CFIELD('shopper', 'activated_date'), NOW)"
  - sa_makegood: "K('makegood_long') if (sa_level >= 80 and sa_tenure >= 36) else (K('makegood_mid') if (sa_level >= 40 and sa_tenure >= 12 and sa_tenure < 36) else 0)"
  - sa_days: "DAYS(F('completed_date'), LATEST('batch_pay_disputes', 'created_at', date_field='created_at', dispute_reason='shown_pay_shortfall', dispute_status='submitted') or NOW)"
  - sa_prompt: "K('prompt_fast') if sa_days <= 1 else (K('prompt_soon') if (sa_days >= 2 and sa_days <= 3) else 0)"
  - sa_sum: "sa_claim * sa_rating_share + sa_makegood + sa_prompt"
  - sa_fuel: "CPARAM('payout', 'cashback_fuel_pct') or 0"
  - sa_settled: "-(-RND(sa_sum * 105, 6) // 1) / 100 if sa_fuel >= 3 else (int(RND(sa_sum * 102, 6)) / 100 if (sa_fuel > 0 and sa_fuel < 3) else sa_sum)"
  - result: "RND(sa_settled, 2) if (sa_claims >= 1 and sa_claim >= P('pay_dispute_min_usd')) else 0"
  compute_basis:
    sa_claims: "A shown-pay adjustment is booked only after the batch carries a submitted shown-pay shortfall dispute from the shopper stating a claimed amount."
    sa_claim: "The shown-pay adjustment approved on a completed batch is the amount claimed on the shopper's submitted shown-pay shortfall dispute, rounded to the cent half up"
    sa_rated: "0.90 when the batch carries at least one customer rating and at least one of its ratings is three stars or fewer"
    sa_low: "at least one of its ratings is three stars or fewer"
    sa_rating_share: "The claimed amount is first multiplied by the rating approval share: 0.90 when the batch carries at least one customer rating and at least one of its ratings is three stars or fewer, 1.04 when it carries at least one customer rating and none is below four stars, and 1.00 when it carries no customer rating."
    sa_level: "1.50 for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar months past its first activation date"
    sa_tenure: "36 or more whole calendar months past its first activation date, 0.75 for an account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date"
    sa_makegood: "The shown-pay make-good credit is then added: 1.50 for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar months past its first activation date, 0.75 for an account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date, and nothing for every other account."
    sa_days: "counted in calendar days from the batch's completion date to the date the dispute was submitted"
    sa_prompt: "0.50 when that span is zero or one day, 0.25 when it is two or three days, and nothing when it is longer."
    sa_sum: "The sum so formed is finally settled by the payout-card method"
    sa_fuel: "for a payout account on an Everyday Pay Card plan at Gold, Platinum or Diamond (fuel cashback of 3 percent or more)"
    sa_settled: "for a payout account on an Everyday Pay Card plan at Gold, Platinum or Diamond (fuel cashback of 3 percent or more) the sum is multiplied by 1.05 and rounded up to the cent; for the Everyday Pay Card Blue plan (fuel cashback above zero and below 3 percent) it is multiplied by 1.02 and rounded down to the cent; for every other payout plan the sum stands as it is."
    result: "a claim below the batch type's minimum dispute amount is not adjusted and books nothing"
  factors:
  - id: sa_rating_approval_share
    effect: parameter
    decides: sa_rating_share
    bindings: [sa_rated, sa_low, sa_rating_share]
    ladder:
    - when: "the batch carries at least one customer rating AND at least one rating is three stars or fewer"
      value: "K('share_low_rating') = 0.90"
    - when: "the batch carries at least one customer rating AND none is below four stars"
      value: "K('share_high_rating') = 1.04"
    - when: "otherwise (no customer rating)"
      value: "1.00"
    baseline:
      sa_rating_share: "1"
    evidence: [cross_category]
    cross_difficulty: shopper
  - id: sa_makegood_credit
    effect: parameter
    decides: sa_makegood
    bindings: [sa_level, sa_tenure, sa_makegood]
    ladder:
    - when: "Gold level or above AND 36 or more whole calendar months since first activation"
      value: "K('makegood_long') = 1.50"
    - when: "Silver level or above AND 12 to 35 whole calendar months since first activation"
      value: "K('makegood_mid') = 0.75"
    - when: "otherwise"
      value: "0"
    baseline:
      sa_makegood: "0"
    evidence: [cross_category, date]
    cross_difficulty: shopper
  - id: sa_prompt_credit
    effect: parameter
    decides: sa_prompt
    bindings: [sa_days, sa_prompt]
    ladder:
    - when: "the dispute was submitted zero or one calendar day after the completion date"
      value: "K('prompt_fast') = 0.50"
    - when: "the dispute was submitted two or three calendar days after the completion date"
      value: "K('prompt_soon') = 0.25"
    - when: "otherwise"
      value: "0"
    baseline:
      sa_prompt: "0"
    evidence: [date, history]
    cross_difficulty: null
  - id: sa_card_method
    effect: method
    decides: sa_settled
    bindings: [sa_fuel, sa_settled]
    ladder:
    - when: "the payout account is on an Everyday Pay Card plan at Gold, Platinum or Diamond (fuel cashback 3 percent or more)"
      method: "the sum is multiplied by 1.05 and rounded up to the cent"
    - when: "the payout account is on the Everyday Pay Card Blue plan (fuel cashback above zero and below 3 percent)"
      method: "the sum is multiplied by 1.02 and rounded down to the cent"
    - when: "otherwise"
      method: "the sum stands as it is"
    baseline:
      sa_settled: "sa_sum"
    evidence: [cross_category]
    cross_difficulty: payout
  baseline:
    rule: >-
      The shown-pay adjustment approved on a completed batch is the amount claimed on the shopper's submitted
      shown-pay shortfall dispute, rounded to the cent half up; a claim below the batch type's minimum dispute
      amount is not adjusted and books nothing.
    params: [pay_dispute_min_usd]
  inputs:
    history:
    - {table: batch_pay_disputes, aggregate: latest, field: claimed_amount_usd, filters: {dispute_reason: shown_pay_shortfall, dispute_status: submitted}}
    - {category: shopper, table: shopper_events, aggregate: count, field: shopper_event_id, filters: {event_type: shopper_rating_received}}
    cross_category: [shopper, payout]
- id: batch_ext_undelivered_recovery
  base_policy_refs: [batch_evt_clawback]
  overwrite: []
  trigger: state_due
  subject: [batch_pay_reversed]
  computes: amount_usd
  target_tool: reverse_undelivered_pay_ec14645c
  params:
    loyal_long: 0.4
    loyal_mid: 0.2
    share_some_points: 0.8
    share_no_points: 0.6
    verified_same_day: 0.15
    verified_soon: 0.1
  rule: >
    An order that a wrong-address violation recorded against a completed batch shows was handed to the wrong
    address was not delivered, and the pay the batch received for delivering it is taken back by the desk with
    one reversal against the batch's mileage posting on the verified not-delivered ground, within the clawback
    window and at most once for that posting. The amount taken back for orders verified as not delivered is the
    not-delivered orders' share of the batch's mileage posting, found as that posting's amount times the number of
    wrong-address violations recorded against the batch divided by the batch's order count, rounded to the cent
    half up, and it never exceeds that mileage posting; a batch carrying no mileage posting has nothing to take back
    on this ground. The not-delivered standing share multiplies that share:
    0.80 when the shopper account carries one to three active violation points, 0.60 when it carries none, and 1.00
    when it carries four or more. Two allowances are then subtracted: the not-delivered loyalty allowance, 0.40 for
    a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar
    months past its first activation date, 0.20 for an account at the Silver level or above that is 12 to 35 whole
    calendar months past its first activation date, and nothing for every other account; and the verification
    timing allowance, counted in calendar days from the batch's completion date to the date of the latest
    wrong-address violation recorded against it, 0.15 when that span is zero days, 0.10 when it is one to three
    days, and nothing when it is longer. The share times the standing share, less the two allowances and never
    below zero, is finally settled by the not-delivered settlement method: when the shopper's payout account paid
    out an instant cashout less than one whole calendar month before the handling date and its payout plan charges
    a fee for instant cashouts, the amount is multiplied by 0.75 and rounded down to the cent; when such an instant
    cashout was paid and the plan charges no instant-cashout fee, the amount is halved and rounded up to the cent;
    when no such instant cashout was paid, the amount is rounded to the cent half up and taken back in full.
  prerequisite: []
  cross_category:
  - category: shopper
    as: history
    reads: [variant_name, activated_date, violation_points_balance, shopper_events.violation_type, shopper_events.event_date]
    note: Wrong-address violations against the batch decide how many orders' shares are taken back and the timing
      allowance; active points the standing share; level and months since activation the loyalty allowance.
  - category: payout
    as: history
    reads: [variant_name, payout_events.event_type]
    note: A recent instant cashout and whether the plan charges an instant-cashout fee choose the settlement method.
  compute:
  - ur_wrong: "XCOUNT('shopper', 'shopper_events', event_type='shopper_violation_recorded', violation_type='wrong_address', batch_id=HID)"
  - ur_mileage: "LATEST('batch_events', 'amount_usd', event_type='batch_pay_posted', pay_component='mileage') or 0"
  - ur_postings: "COUNT('batch_events', event_type='batch_pay_posted', pay_component='mileage')"
  - ur_share: "RND(ur_mileage * ur_wrong / F('order_count'), 2) if ur_postings >= 1 else 0"
  - ur_points: "CFIELD('shopper', 'violation_points_balance')"
  - ur_points_share: "K('share_some_points') if (ur_points >= 1 and ur_points <= 3) else (K('share_no_points') if ur_points == 0 else 1)"
  - ur_level: "CPARAM('shopper', 'level_min_batches_30d')"
  - ur_tenure: "MONTHS(CFIELD('shopper', 'activated_date'), NOW)"
  - ur_loyal: "K('loyal_long') if (ur_level >= 80 and ur_tenure >= 36) else (K('loyal_mid') if (ur_level >= 40 and ur_tenure >= 12 and ur_tenure < 36) else 0)"
  - ur_verified_days: "DAYS(F('completed_date'), XLATEST('shopper', 'shopper_events', 'event_date', event_type='shopper_violation_recorded', violation_type='wrong_address', batch_id=HID) or F('completed_date'))"
  - ur_timing: "K('verified_same_day') if ur_verified_days == 0 else (K('verified_soon') if (ur_verified_days >= 1 and ur_verified_days <= 3) else 0)"
  - ur_amount: "MN(ur_mileage, MX(0, ur_share * ur_points_share - ur_loyal - ur_timing))"
  - ur_cashouts: "XCOUNT('payout', 'payout_events', event_type='payout_instant_cashout', within_months=1)"
  - ur_fee_plan: "1 if (CPARAM('payout', 'instant_cashout_fee_usd') or 0) > 0 else 0"
  - ur_settled: "int(RND(ur_amount * 75, 6)) / 100 if (ur_cashouts >= 1 and ur_fee_plan == 1) else (-(-RND(ur_amount * 50, 6) // 1) / 100 if (ur_cashouts >= 1 and ur_fee_plan == 0) else RND(ur_amount, 2))"
  - result: "RND(ur_settled, 2) if ur_wrong >= 1 else 0"
  compute_basis:
    ur_wrong: "found as that posting's amount times the number of wrong-address violations recorded against the batch divided by the batch's order count"
    ur_mileage: "the not-delivered orders' share of the batch's mileage posting"
    ur_postings: "a batch carrying no mileage posting has nothing to take back on this ground."
    ur_share: "The amount taken back for orders verified as not delivered is the not-delivered orders' share of the batch's mileage posting, found as that posting's amount times the number of wrong-address violations recorded against the batch divided by the batch's order count, rounded to the cent half up, and it never exceeds that mileage posting."
    ur_points: "0.80 when the shopper account carries one to three active violation points"
    ur_points_share: "The not-delivered standing share multiplies that share: 0.80 when the shopper account carries one to three active violation points, 0.60 when it carries none, and 1.00 when it carries four or more."
    ur_level: "0.40 for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar months past its first activation date"
    ur_tenure: "36 or more whole calendar months past its first activation date, 0.20 for an account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date"
    ur_loyal: "the not-delivered loyalty allowance, 0.40 for a shopper account at the Gold level or above (Gold, Platinum or Diamond) that is 36 or more whole calendar months past its first activation date, 0.20 for an account at the Silver level or above that is 12 to 35 whole calendar months past its first activation date, and nothing for every other account"
    ur_verified_days: "counted in calendar days from the batch's completion date to the date of the latest wrong-address violation recorded against it"
    ur_timing: "0.15 when that span is zero days, 0.10 when it is one to three days, and nothing when it is longer."
    ur_amount: "The share times the standing share, less the two allowances and never below zero"
    ur_cashouts: "when the shopper's payout account paid out an instant cashout less than one whole calendar month before the handling date"
    ur_fee_plan: "its payout plan charges a fee for instant cashouts"
    ur_settled: "when the shopper's payout account paid out an instant cashout less than one whole calendar month before the handling date and its payout plan charges a fee for instant cashouts, the amount is multiplied by 0.75 and rounded down to the cent; when such an instant cashout was paid and the plan charges no instant-cashout fee, the amount is halved and rounded up to the cent; when no such instant cashout was paid, the amount is rounded to the cent half up and taken back in full."
    result: "An order that a wrong-address violation recorded against a completed batch shows was handed to the wrong address was not delivered, and the pay the batch received for delivering it is taken back by the desk"
  factors:
  - id: ur_standing_share
    effect: parameter
    decides: ur_points_share
    bindings: [ur_points, ur_points_share]
    ladder:
    - when: "one to three active violation points"
      value: "K('share_some_points') = 0.80"
    - when: "no active violation points"
      value: "K('share_no_points') = 0.60"
    - when: "otherwise (four or more)"
      value: "1.00"
    baseline:
      ur_points_share: "1"
    evidence: [cross_category]
    cross_difficulty: shopper
  - id: ur_loyalty_allowance
    effect: parameter
    decides: ur_loyal
    bindings: [ur_level, ur_tenure, ur_loyal]
    ladder:
    - when: "Gold level or above AND 36 or more whole calendar months since first activation"
      value: "K('loyal_long') = 0.40"
    - when: "Silver level or above AND 12 to 35 whole calendar months since first activation"
      value: "K('loyal_mid') = 0.20"
    - when: "otherwise"
      value: "0"
    baseline:
      ur_loyal: "0"
    evidence: [cross_category, date]
    cross_difficulty: shopper
  - id: ur_verification_timing
    effect: parameter
    decides: ur_timing
    bindings: [ur_verified_days, ur_timing]
    ladder:
    - when: "the latest wrong-address violation is dated the completion date (zero days)"
      value: "K('verified_same_day') = 0.15"
    - when: "it is dated one to three days after completion"
      value: "K('verified_soon') = 0.10"
    - when: "otherwise (four days or more)"
      value: "0"
    baseline:
      ur_timing: "0"
    evidence: [cross_category, date]
    cross_difficulty: shopper
  - id: ur_settlement_method
    effect: method
    decides: ur_settled
    bindings: [ur_cashouts, ur_fee_plan, ur_settled]
    ladder:
    - when: "an instant cashout was paid out less than one whole calendar month before the handling date AND the payout plan charges an instant-cashout fee"
      method: "the amount is multiplied by 0.75 and rounded down to the cent"
    - when: "such an instant cashout was paid AND the payout plan charges no instant-cashout fee"
      method: "the amount is halved and rounded up to the cent"
    - when: "otherwise"
      method: "the amount is rounded half up and taken back in full"
    baseline:
      ur_settled: "RND(ur_amount, 2)"
    evidence: [cross_category, history]
    cross_difficulty: payout
  baseline:
    rule: >-
      The amount taken back for orders verified as not delivered is the not-delivered orders' share of the batch's
      mileage posting, found as that posting's amount times the number of wrong-address violations recorded against
      the batch divided by the batch's order count, rounded to the cent half up, and it never exceeds that mileage
      posting; a batch carrying no mileage posting has nothing to take back on this ground.
    params: []
  inputs:
    history:
    - {table: batch_events, aggregate: latest, field: amount_usd, filters: {event_type: batch_pay_posted, pay_component: mileage}}
    - {table: batch_events, aggregate: count, field: batch_event_id, filters: {event_type: batch_pay_posted, pay_component: mileage}}
    - {category: shopper, table: shopper_events, aggregate: count, field: shopper_event_id, filters: {event_type: shopper_violation_recorded, violation_type: wrong_address}}
    - {category: payout, table: payout_events, aggregate: count, field: payout_event_id, within_months: 1, filters: {event_type: payout_instant_cashout}}
