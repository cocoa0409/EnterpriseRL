  - id: sc_standing_share
    effect: parameter
    decides: sc_share
    bindings: [sc_points, sc_share]
    ladder:
    - when: "one to three active violation points on the shopper account"
      value: "K('share_some_points') = 0.97"
    - when: "four or more active violation points"
      value: "K('share_many_points') = 0.95"
    - when: "otherwise (no active points)"
      value: "1.00"
    baseline:
