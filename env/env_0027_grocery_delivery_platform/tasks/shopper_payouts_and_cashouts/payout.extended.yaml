- id: payout_ext_closing_cashback
  base_policy_refs:
  - payout_evt_cashback
  overwrite:
  - base_policy: payout_evt_cashback
    superseded_clause: unpaid cashback lapses on closure where cashback_forfeit_on_close is true.
    replaced_by: When a card-plan account is closed, the cashback of the latest statement month with earned
      entries that carries no payment, whose payment day has not yet come, is settled onto the card at
      the closing instead of lapsing.
  trigger: on_request
  subject:
  - payout_cashback_paid
  computes: amount_usd
  target_tool: settle_closing_cashback_4e373fbf
  params:
    share_standard: 0.5
    share_regular_top: 1.0
    share_regular: 0.75
    regular_payments_3m: 3
    card_bonus_long: 0.05
    card_bonus_mid: 0.02
    card_long_months: 24
    card_mid_months: 12
    closing_thanks_low: 1.5
    closing_thanks_high_batches: 40
    closing_thanks_low_batches: 20
    ev_double: 2
    ev_half_more: 1.5
    closing_thanks_share: 0.05
  rule: 'When a card-plan account is closed, the cashback of the latest statement month with earned entries
    that carries no payment, whose payment day has not yet come, is settled onto the card at the closing
    instead of lapsing. The closing cashback settlement is fixed only after the statement payment owed
    for the months whose payment day has passed, where one is owed, has been made. The closing settlement
    takes that month''s fuel, EV charging and auto maintenance cashback, caps the month''s total at the
    monthly cashback cap of the card plan, settles half of the capped figure and rounds it to the cent;
    a month that already carries a payment settles nothing. How EV charging cashback counts at closing
    depends on the shopper''s Cartwise+ membership: a shopper holding an active Cartwise+ Premier Annual
    or Cartwise+ Family Annual membership has the month''s EV charging cashback counted twice, a shopper
    holding any other active Cartwise+ membership has it counted one and a half times, and a shopper with
    no active Cartwise+ membership has it counted as earned; the counted figure is rounded to the cent.
    The closing share depends on the payment record and level: an account with 3 or more cashback payments
    in the last 3 months whose shopper is at Full-Service Shopper Platinum or Diamond level is settled
    in full; an account with 3 or more cashback payments in the last 3 months whose shopper is below Full-Service
    Shopper Platinum level is settled at 0.75; any other account is settled at half. A card tenure bonus
    raises the shared figure: an account whose latest plan change (or, when it never changed plan, its
    opening) was 24 or more whole months ago gets 5 percent more, one 12 to 23 whole months ago gets 2
    percent more, and any other account gets nothing more. A closing thank-you is added when there is
    a month to settle: a shopper with 40 or more batch base-pay entries in the last 3 months gets 5 percent
    of the shared figure after the card tenure bonus, rounded to the cent; one with 20 to 39 gets a fixed
    1.50; and any other shopper gets nothing. The closing settlement is the capped month multiplied first
    by the closing share and then by one plus the card tenure bonus, plus the closing thank-you, rounded
    to the cent only on that final figure. "The last N months" counts the entries booked fewer than N
    whole months before the day of the closing. Shopper levels rank upward in the order Shop-Only Shopper,
    Full-Service Shopper, Full-Service Shopper Silver, Full-Service Shopper Gold, Full-Service Shopper
    Platinum and Full-Service Shopper Diamond, and a level named with "or above" or "or below" is read
    in that order.'
  baseline:
    rule: When a card-plan account is closed, the cashback of the latest statement month with earned entries
      that carries no payment, whose payment day has not yet come, is settled onto the card at the closing
      instead of lapsing. The closing settlement takes that month's fuel, EV charging and auto maintenance
      cashback, caps the month's total at the monthly cashback cap of the card plan, settles half of the
      capped figure and rounds it to the cent; a month that already carries a payment settles nothing.
    params:
    - cashback_monthly_cap_usd
    - share_standard
  prerequisite:
  - problem: payout_ext_statement_cashback
    kind: value_input
    gate: payments_3m
    form: action
    policy_source: The closing cashback settlement is fixed only after the statement payment owed for
      the months whose payment day has passed, where one is owed, has been made.
    condition: Where the card cashback balance less the latest waiting month's earned cashback is at least
      the card plan's minimum cashback payment, a payout_cashback_paid row carrying the latest month whose
      payment day has passed has been booked.
    resolved_by: pay_statement_cashback_5d281cc6
    effect: The statement payment adds one cashback payment dated the day of the closing and carrying
      the latest passed month, so the count of cashback payments in the last 3 months (payments_3m) rises
      by one, which moves the closing share.
    fallback_reason: A statement payment leaves only an ordinary cashback payment entry carrying a month,
      and whether one is owed at all depends on the card cashback balance and the minimum payment (an
      amount below it, or a balance already lowered by earlier bonuses, owes no payment); a record-visible
      state such as 'the latest passed month carries a payment' is then unreachable when nothing is owed,
      and an amount state is unreachable when a capped payment leaves part in the balance for the next
      payment day, so only the action can be named.
  cross_category:
  - category: shopper
    as: branch
    reads:
    - variant_name
    note: The level decides the closing share together with the payment record.
  - category: membership
    as: branch
    reads:
    - variant_name
    - status
    note: The active Cartwise+ plan decides how EV charging cashback counts at closing.
  - category: batch
    as: history
    reads:
    - batch_events.event_type
    - batch_events.pay_component
    note: Base-pay entries in the last 3 months decide the closing thank-you.
  compute:
  - lvl: CFIELD('shopper','variant_name')
  - lvl_rank: 6 if lvl == 'Full-Service Shopper Diamond' else (5 if lvl == 'Full-Service Shopper Platinum'
      else (4 if lvl == 'Full-Service Shopper Gold' else (3 if lvl == 'Full-Service Shopper Silver' else
      (2 if lvl == 'Full-Service Shopper' else 1))))
  - latest_month: LATEST('payout_events','statement_month', event_type='payout_cashback_earned')
  - latest_paid: SUM('payout_events','amount_usd', event_type='payout_cashback_paid', statement_month=latest_month)
  - fuel: SUM('payout_events','amount_usd', event_type='payout_cashback_earned', statement_month=latest_month,
      merchant_category='fuel')
  - ev: SUM('payout_events','amount_usd', event_type='payout_cashback_earned', statement_month=latest_month,
      merchant_category='ev_charging')
  - auto: SUM('payout_events','amount_usd', event_type='payout_cashback_earned', statement_month=latest_month,
      merchant_category='auto_maintenance')
  - member_plan: CFIELD('membership','variant_name', status='active')
  - ev_counted: RND(ev * K('ev_double'), 2) if (member_plan == 'Cartwise+ Premier Annual' or member_plan
      == 'Cartwise+ Family Annual') else (RND(ev * K('ev_half_more'), 2) if member_plan else ev)
  - month_capped: MN(RND(fuel + ev_counted + auto, 2), P('cashback_monthly_cap_usd')) if latest_paid ==
      0 else 0
  - payments_3m: COUNT('payout_events', within_months=3, event_type='payout_cashback_paid')
  - closing_share: K('share_regular_top') if (payments_3m >= K('regular_payments_3m') and lvl_rank >=
      5) else (K('share_regular') if (payments_3m >= K('regular_payments_3m') and lvl_rank < 5) else K('share_standard'))
  - card_months: MONTHS(F('plan_changed_date') or F('opened_date'), NOW)
  - card_bonus: K('card_bonus_long') if card_months >= K('card_long_months') else (K('card_bonus_mid')
      if card_months >= K('card_mid_months') else 0)
  - base_pays_3m: XCOUNT('batch','batch_events', within_months=3, event_type='batch_pay_posted', pay_component='batch_base')
  - closing_thanks: 0 if month_capped == 0 else (RND(month_capped * closing_share * (1 + card_bonus) *
      K('closing_thanks_share'), 2) if base_pays_3m >= K('closing_thanks_high_batches') else (K('closing_thanks_low')
      if base_pays_3m >= K('closing_thanks_low_batches') else 0))
  - result: RND(month_capped * closing_share * (1 + card_bonus) + closing_thanks, 2)
  compute_basis:
    lvl: an account with 3 or more cashback payments in the last 3 months whose shopper is at Full-Service
      Shopper Platinum or Diamond level is settled in full
    latest_month: the cashback of the latest statement month with earned entries that carries no payment,
      whose payment day has not yet come, is settled onto the card at the closing instead of lapsing.
    latest_paid: a month that already carries a payment settles nothing.
    fuel: The closing settlement takes that month's fuel, EV charging and auto maintenance cashback
    ev: The closing settlement takes that month's fuel, EV charging and auto maintenance cashback
    auto: The closing settlement takes that month's fuel, EV charging and auto maintenance cashback
    member_plan: a shopper holding an active Cartwise+ Premier Annual or Cartwise+ Family Annual membership
      has the month's EV charging cashback counted twice
    ev_counted: a shopper holding an active Cartwise+ Premier Annual or Cartwise+ Family Annual membership
      has the month's EV charging cashback counted twice, a shopper holding any other active Cartwise+
      membership has it counted one and a half times, and a shopper with no active Cartwise+ membership
      has it counted as earned; the counted figure is rounded to the cent.
    month_capped: caps the month's total at the monthly cashback cap of the card plan
    payments_3m: an account with 3 or more cashback payments in the last 3 months
    closing_share: an account with 3 or more cashback payments in the last 3 months whose shopper is at
      Full-Service Shopper Platinum or Diamond level is settled in full; an account with 3 or more cashback
      payments in the last 3 months whose shopper is below Full-Service Shopper Platinum level is settled
      at 0.75; any other account is settled at half.
    card_months: an account whose latest plan change (or, when it never changed plan, its opening) was
      24 or more whole months ago gets 5 percent more
    card_bonus: an account whose latest plan change (or, when it never changed plan, its opening) was
      24 or more whole months ago gets 5 percent more, one 12 to 23 whole months ago gets 2 percent more,
      and any other account gets nothing more.
    base_pays_3m: a shopper with 40 or more batch base-pay entries in the last 3 months gets 5 percent
      of the shared figure after the card tenure bonus
    closing_thanks: 'A closing thank-you is added when there is a month to settle: a shopper with 40 or
      more batch base-pay entries in the last 3 months gets 5 percent of the shared figure after the card
      tenure bonus, rounded to the cent; one with 20 to 39 gets a fixed 1.50; and any other shopper gets
      nothing.'
    result: The closing settlement is the capped month multiplied first by the closing share and then
      by one plus the card tenure bonus, plus the closing thank-you, rounded to the cent only on that
      final figure.
    lvl_rank: Shopper levels rank upward in the order Shop-Only Shopper, Full-Service Shopper, Full-Service
      Shopper Silver, Full-Service Shopper Gold, Full-Service Shopper Platinum and Full-Service Shopper
      Diamond, and a level named with "or above" or "or below" is read in that order.
  factors:
  - id: closing_ev_counting
    effect: parameter
    decides: ev_counted
    bindings:
    - member_plan
    - ev_counted
    ladder:
    - when: an active Cartwise+ Premier Annual or Cartwise+ Family Annual membership
      value: EV charging cashback x K('ev_double') = 2
    - when: any other active Cartwise+ membership
      value: EV charging cashback x K('ev_half_more') = 1.5
    - when: otherwise
      value: EV charging cashback as earned (x1)
    baseline:
      ev_counted: ev
    evidence:
    - cross_category
    cross_difficulty: membership
  - id: closing_share_by_record
    effect: parameter
    decides: closing_share
    bindings:
    - payments_3m
    - closing_share
    ladder:
    - when: 3 or more cashback payments in the last 3 months AND shopper at Full-Service Shopper Platinum
        or Diamond level
      value: K('share_regular_top') = 1.0
    - when: 3 or more cashback payments in the last 3 months AND shopper below Full-Service Shopper Platinum
        level
      value: K('share_regular') = 0.75
    - when: otherwise
      value: K('share_standard') = 0.5
    baseline:
      closing_share: K('share_standard')
    evidence:
    - history
    - cross_category
    cross_difficulty: null
  - id: closing_card_tenure_bonus
    effect: parameter
    decides: card_bonus
    bindings:
    - card_months
    - card_bonus
    ladder:
    - when: latest plan change (or opening) 24 or more whole months ago
      value: K('card_bonus_long') = 0.05
    - when: latest plan change (or opening) 12 to 23 whole months ago
      value: K('card_bonus_mid') = 0.02
    - when: otherwise
      value: '0'
    baseline:
      card_bonus: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: closing_thank_you
    effect: method
    decides: closing_thanks
    bindings:
    - base_pays_3m
    - closing_thanks
    ladder:
    - when: 40 or more batch base-pay entries in the last 3 months
      method: the thank-you is 5 percent of the shared figure after the card tenure bonus, rounded to
        the cent
    - when: 20 to 39 batch base-pay entries in the last 3 months
      method: the thank-you is a fixed K('closing_thanks_low') = 1.50
    - when: otherwise
      method: no thank-you
    baseline:
      closing_thanks: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: batch
  inputs:
    history:
    - table: payout_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: payout_cashback_earned
    - table: payout_events
      aggregate: count
      field: payout_event_id
      within_months: 3
      filters:
        event_type: payout_cashback_paid
    - category: batch
      table: batch_events
      aggregate: count
      field: batch_event_id
      within_months: 3
      filters:
        event_type: batch_pay_posted
        pay_component: batch_base
    cross_category:
    - shopper
    - membership
    - batch
- id: payout_ext_card_cashout
  base_policy_refs:
  - payout_evt_instant_cashout
  - payout_evt_earnings_ledger
  overwrite:
  - base_policy: payout_evt_earnings_ledger
    superseded_clause: Where tips_cashout_after_finalization is true, tip credits count toward the cashable
      balance (payout_msr_cashable_balance) only once their batch is finalized.
    replaced_by: 'How much of the unfinalized batch''s tips a card cashout may carry depends on the shopper''s
      level and tip history: a shopper at Full-Service Shopper Platinum level or above with no batch tip
      reduction in the last 6 months has those tips all released to the card; a shopper at Full-Service
      Shopper Silver level or above with exactly one batch tip reduction in the last 6 months has half
      of them released, rounded to the cent; any other shopper has none of them released.'
  - base_policy: payout_evt_instant_cashout
    superseded_clause: A cashout must be at least instant_cashout_min_usd, at most instant_cashout_max_per_transaction_usd
      and at most payout_msr_cashable_balance
    replaced_by: The card cashout is the balance less the tips not released, less the clawback reserve,
      less the card conduct reserve, less the card debit buffer and less the new-level reserve, then limited
      to the card plan's per-transaction maximum and to the rest of its daily maximum, never below zero,
      and rounded to the cent only on that final figure.
  trigger: on_request
  subject:
  - payout_instant_cashout
  - payout_cashout_fee_charged
  computes: amount_usd
  target_tool: cash_out_to_card_075a5c73
  params:
    card_clawback_two: 30.0
    card_clawback_one: 15.0
    card_conduct_high: 40.0
    card_conduct_low: 15.0
    conduct_high_points: 6
    card_debit_few: 10.0
    new_level_days: 60
    new_level_top: 25.0
    new_level_other: 10.0
    debit_largest_count: 2
  rule: 'An instant cashout onto the Everyday Pay Card carries the balance on the account less the tips
    posted on the batch that is completed but not yet finalized, limited to the card plan''s per-transaction
    maximum and to what remains of its daily maximum after the day''s earlier cashouts, rounded to the
    cent, and card plans book its fee entry at 0.00. How much of the unfinalized batch''s tips a card
    cashout may carry depends on the shopper''s level and tip history: a shopper at Full-Service Shopper
    Platinum level or above with no batch tip reduction in the last 6 months has those tips all released
    to the card; a shopper at Full-Service Shopper Silver level or above with exactly one batch tip reduction
    in the last 6 months has half of them released, rounded to the cent; any other shopper has none of
    them released. A clawback reserve stays on the account: a shopper with two or more batch pay reversals
    in the last 12 months leaves 30.00, one with exactly one leaves 15.00, and one with none leaves nothing.
    A card conduct reserve stays on the account: a shopper carrying 6 or more active violation points
    leaves 40.00, one carrying 1 to 5 leaves 15.00, and one carrying none leaves nothing. A card debit
    buffer stays on the account: an account with 2 or more earnings debits in the last 3 months leaves
    the largest earnings debit ever booked on the account; one with exactly 1 leaves a fixed 10.00; and
    one with none leaves nothing. A new-level reserve stays on the account while a level change is recent:
    where the shopper''s latest level evaluation (or, when the contractor account carries none, the payout
    account''s opening) was fewer than 60 days ago and the shopper is at Full-Service Shopper Platinum
    or Diamond level, 25.00 stays; where it was fewer than 60 days ago and the shopper is below Full-Service
    Shopper Platinum level, 10.00 stays; otherwise nothing stays. The card cashout is the balance less
    the tips not released, less the clawback reserve, less the card conduct reserve, less the card debit
    buffer and less the new-level reserve, then limited to the card plan''s per-transaction maximum and
    to the rest of its daily maximum, never below zero, and rounded to the cent only on that final figure.
    "The last N months" counts the entries booked fewer than N whole months before the day of the cashout.
    Shopper levels rank upward in the order Shop-Only Shopper, Full-Service Shopper, Full-Service Shopper
    Silver, Full-Service Shopper Gold, Full-Service Shopper Platinum and Full-Service Shopper Diamond,
    and a level named with "or above" or "or below" is read in that order.'
  baseline:
    rule: An instant cashout onto the Everyday Pay Card carries the balance on the account less the tips
      posted on the batch that is completed but not yet finalized, limited to the card plan's per-transaction
      maximum and to what remains of its daily maximum after the day's earlier cashouts, rounded to the
      cent, and card plans book its fee entry at 0.00.
    params:
    - instant_cashout_max_per_transaction_usd
    - instant_cashout_daily_max_usd
  prerequisite: []
  cross_category:
  - category: shopper
    as: branch
    reads:
    - variant_name
    - violation_points_balance
    - level_evaluated_date
    note: The level and the latest level evaluation decide the tip release and the new-level reserve;
      violation points decide the card conduct reserve.
  - category: batch
    as: history
    reads:
    - batch_id
    - status
    - batch_events.event_type
    - batch_events.amount_usd
    note: The unfinalized batch's tips, tip reductions in the last 6 months and pay reversals in the last
      12 months decide the tip release and the clawback reserve.
  compute:
  - bal: F('available_balance_usd')
  - lvl: CFIELD('shopper','variant_name')
  - lvl_rank: 6 if lvl == 'Full-Service Shopper Diamond' else (5 if lvl == 'Full-Service Shopper Platinum'
      else (4 if lvl == 'Full-Service Shopper Gold' else (3 if lvl == 'Full-Service Shopper Silver' else
      (2 if lvl == 'Full-Service Shopper' else 1))))
  - unfin_batch: CFIELD('batch','batch_id', status='completed')
  - unfin_tips: XSUM('batch','batch_events','amount_usd', event_type='batch_tip_posted', batch_id=unfin_batch)
  - tip_reductions_6m: XCOUNT('batch','batch_events', within_months=6, event_type='batch_tip_adjusted_down')
  - tips_not_released: 0 if (lvl_rank >= 5 and tip_reductions_6m == 0) else (RND(unfin_tips / 2, 2) if
      (lvl_rank >= 3 and tip_reductions_6m == 1) else unfin_tips)
  - reversals_12m: XCOUNT('batch','batch_events', within_months=12, event_type='batch_pay_reversed')
  - clawback_reserve: K('card_clawback_two') if reversals_12m >= 2 else (K('card_clawback_one') if reversals_12m
      == 1 else 0)
  - viol_points: CFIELD('shopper','violation_points_balance') or 0
  - conduct_reserve: K('card_conduct_high') if viol_points >= K('conduct_high_points') else (K('card_conduct_low')
      if viol_points >= 1 else 0)
  - debits_3m_count: COUNT('payout_events', within_months=3, event_type='payout_earnings_debited')
  - largest_debit: MAX('payout_events','amount_usd', event_type='payout_earnings_debited')
  - debit_buffer: largest_debit if debits_3m_count >= K('debit_largest_count') else (K('card_debit_few')
      if debits_3m_count == 1 else 0)
  - level_days: DAYS(CFIELD('shopper','level_evaluated_date') or F('opened_date'), NOW)
  - new_level_reserve: K('new_level_top') if (level_days < K('new_level_days') and lvl_rank >= 5) else
      (K('new_level_other') if (level_days < K('new_level_days') and lvl_rank < 5) else 0)
  - today_total: SUM('payout_events','amount_usd', event_type='payout_instant_cashout', event_date=NOW)
  - result: RND(MX(0, MN(P('instant_cashout_max_per_transaction_usd'), P('instant_cashout_daily_max_usd')
      - today_total, bal - tips_not_released - clawback_reserve - conduct_reserve - debit_buffer - new_level_reserve)),
      2)
  compute_basis:
    bal: An instant cashout onto the Everyday Pay Card carries the balance on the account
    lvl: a shopper at Full-Service Shopper Platinum level or above with no batch tip reduction in the
      last 6 months has those tips all released to the card
    unfin_batch: less the tips posted on the batch that is completed but not yet finalized
    unfin_tips: less the tips posted on the batch that is completed but not yet finalized
    tip_reductions_6m: with no batch tip reduction in the last 6 months
    tips_not_released: a shopper at Full-Service Shopper Platinum level or above with no batch tip reduction
      in the last 6 months has those tips all released to the card; a shopper at Full-Service Shopper
      Silver level or above with exactly one batch tip reduction in the last 6 months has half of them
      released, rounded to the cent; any other shopper has none of them released.
    reversals_12m: a shopper with two or more batch pay reversals in the last 12 months leaves 30.00
    clawback_reserve: a shopper with two or more batch pay reversals in the last 12 months leaves 30.00,
      one with exactly one leaves 15.00, and one with none leaves nothing.
    viol_points: a shopper carrying 6 or more active violation points leaves 40.00
    conduct_reserve: a shopper carrying 6 or more active violation points leaves 40.00, one carrying 1
      to 5 leaves 15.00, and one carrying none leaves nothing.
    debits_3m_count: an account with 2 or more earnings debits in the last 3 months leaves the largest
      earnings debit ever booked on the account
    debit_buffer: 'A card debit buffer stays on the account: an account with 2 or more earnings debits
      in the last 3 months leaves the largest earnings debit ever booked on the account; one with exactly
      1 leaves a fixed 10.00; and one with none leaves nothing.'
    level_days: where the shopper's latest level evaluation (or, when the contractor account carries none,
      the payout account's opening) was fewer than 60 days ago
    new_level_reserve: where the shopper's latest level evaluation (or, when the contractor account carries
      none, the payout account's opening) was fewer than 60 days ago and the shopper is at Full-Service
      Shopper Platinum or Diamond level, 25.00 stays; where it was fewer than 60 days ago and the shopper
      is below Full-Service Shopper Platinum level, 10.00 stays; otherwise nothing stays.
    today_total: limited to the card plan's per-transaction maximum and to what remains of its daily maximum
      after the day's earlier cashouts
    result: The card cashout is the balance less the tips not released, less the clawback reserve, less
      the card conduct reserve, less the card debit buffer and less the new-level reserve, then limited
      to the card plan's per-transaction maximum and to the rest of its daily maximum, never below zero,
      and rounded to the cent only on that final figure.
    lvl_rank: Shopper levels rank upward in the order Shop-Only Shopper, Full-Service Shopper, Full-Service
      Shopper Silver, Full-Service Shopper Gold, Full-Service Shopper Platinum and Full-Service Shopper
      Diamond, and a level named with "or above" or "or below" is read in that order.
    largest_debit: leaves the largest earnings debit ever booked on the account
  factors:
  - id: card_tip_release
    effect: parameter
    decides: tips_not_released
    bindings:
    - unfin_batch
    - unfin_tips
    - tip_reductions_6m
    - tips_not_released
    ladder:
    - when: shopper level Full-Service Shopper Platinum or above AND no batch tip reduction in the last
        6 months
      value: 0.00 not released (all tips released)
    - when: shopper level Full-Service Shopper Silver or above AND exactly one batch tip reduction in
        the last 6 months
      value: half of the tips not released, rounded to the cent
    - when: otherwise
      value: all of the tips not released
    baseline:
      tips_not_released: unfin_tips
    evidence:
    - cross_category
    - history
    cross_difficulty: batch
  - id: card_clawback_reserve
    effect: parameter
    decides: clawback_reserve
    bindings:
    - reversals_12m
    - clawback_reserve
    ladder:
    - when: two or more batch pay reversals in the last 12 months
      value: K('card_clawback_two') = 30.00
    - when: exactly one batch pay reversal in the last 12 months
      value: K('card_clawback_one') = 15.00
    - when: otherwise
      value: '0.00'
    baseline:
      clawback_reserve: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: batch
  - id: card_conduct_reserve
    effect: parameter
    decides: conduct_reserve
    bindings:
    - viol_points
    - conduct_reserve
    ladder:
    - when: 6 or more active violation points
      value: K('card_conduct_high') = 40.00
    - when: 1 to 5 active violation points
      value: K('card_conduct_low') = 15.00
    - when: otherwise
      value: '0.00'
    baseline:
      conduct_reserve: '0'
    evidence:
    - cross_category
    cross_difficulty: shopper
  - id: card_debit_buffer
    effect: method
    decides: debit_buffer
    bindings:
    - debits_3m_count
    - largest_debit
    - debit_buffer
    ladder:
    - when: 2 or more earnings debits in the last 3 months
      method: the buffer is the largest earnings debit ever booked on the account
    - when: exactly 1 earnings debit in the last 3 months
      method: the buffer is a fixed K('card_debit_few') = 10.00
    - when: otherwise
      method: no buffer
    baseline:
      debit_buffer: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: card_new_level_reserve
    effect: parameter
    decides: new_level_reserve
    bindings:
    - level_days
    - new_level_reserve
    ladder:
    - when: latest level evaluation fewer than 60 days ago AND shopper at Full-Service Shopper Platinum
        or Diamond level
      value: K('new_level_top') = 25.00
    - when: latest level evaluation fewer than 60 days ago AND shopper below Full-Service Shopper Platinum
        level
      value: K('new_level_other') = 10.00
    - when: otherwise
      value: '0.00'
    baseline:
      new_level_reserve: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: shopper
  inputs:
    history:
    - table: payout_events
      aggregate: count
      field: payout_event_id
      within_months: 3
      filters:
        event_type: payout_earnings_debited
    - table: payout_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: payout_instant_cashout
    - category: batch
      table: batch_events
      aggregate: count
      field: batch_event_id
      within_months: 12
      filters:
        event_type: batch_pay_reversed
    - category: batch
      table: batch_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: batch_tip_posted
    cross_category:
    - shopper
    - batch
- id: payout_ext_closure_disbursement
  base_policy_refs:
  - payout_evt_closure
  - payout_evt_weekly_deposit
  overwrite:
  - base_policy: payout_evt_closure
    superseded_clause: Only the shopper can close an active payout account; the agent registers the request
      and the shopper confirms it.
    replaced_by: Only the shopper can close an active payout account, and the shopper does so in one step
      of their own that records their confirmed closing request, closes the account and books the final
      disbursement.
  - base_policy: payout_evt_closure
    superseded_clause: On closure the remaining balance is paid by closure_disbursement within final_disbursement_business_days,
      and unpaid cashback lapses where cashback_forfeit_on_close is true.
    replaced_by: The final disbursement pays the balance on the account less every credit of the batch
      that is completed but not yet finalized, which follows on a later final disbursement once that batch
      is finalized, and it is rounded to the cent.
  trigger: on_request
  subject:
  - payout_account_closed
  - payout_weekly_deposit
  computes: final_disbursement_usd
  target_tool: close_payout_account_ca79a9a7
  params:
    top_batches_3m: 40
    mid_batches_3m: 20
    closing_clawback_one: 20.0
    closing_conduct_high: 50.0
    closing_conduct_low: 20.0
    conduct_high_points: 6
    closing_debit_many: 25.0
    closing_debit_few: 12.5
    debit_many_count: 3
    rating_reserve_two: 20.0
    rating_reserve_one: 10.0
    long_tenure_months: 48
    reserve_mult_top: 0.5
    reserve_mult_other: 0.75
  rule: 'Only the shopper can close an active payout account, and the shopper does so in one step of their
    own that records their confirmed closing request, closes the account and books the final disbursement.
    The final disbursement pays the balance on the account less every credit of the batch that is completed
    but not yet finalized, which follows on a later final disbursement once that batch is finalized, and
    it is rounded to the cent. On a card plan, the final card load is fixed only after the account carries
    an instant cashout dated the day of closing. A card-plan account is not closed until the closing cashback
    settlement has been paid onto the card. What the final disbursement holds back for the unfinalized
    batch depends on the shopper''s standing: a shopper at Full-Service Shopper Platinum level or above
    with 40 or more batch base-pay entries in the last 3 months holds back only that batch''s tips; a
    shopper at Full-Service Shopper Silver or Gold level with 20 or more batch base-pay entries in the
    last 3 months holds back those tips plus half of the batch''s other credits, the sum rounded to the
    cent; any other shopper holds back every credit of that batch. Closing reserves are then held back
    for 30 days: a closing clawback reserve equal to the largest batch pay reversal on the shopper''s
    record for two or more batch pay reversals in the last 12 months, a fixed 20.00 for exactly one and
    nothing for none; a closing conduct reserve of 50.00 for 6 or more active violation points, 20.00
    for 1 to 5 and nothing for none; a closing debit reserve of 25.00 for 3 or more earnings debits in
    the last 3 months, 12.50 for 1 or 2 and nothing for none; and a rating reserve of 20.00 for two or
    more one-star customer ratings in the last 3 months, 10.00 for exactly one and nothing for none. The
    closing reserves are scaled by tenure and level: a shopper whose contractor account was first activated
    48 or more whole months ago and who is at Full-Service Shopper Platinum or Diamond level has the sum
    of the closing reserves halved; a shopper activated 48 or more whole months ago who is below Full-Service
    Shopper Platinum level has that sum multiplied by 0.75; any other shopper keeps the full sum; the
    scaled sum is rounded to the cent. The final disbursement is the balance less what is held back for
    the unfinalized batch, less the scaled sum of the closing reserves, never below zero, with the final
    figure rounded to the cent. "The last N months" counts the entries booked fewer than N whole months
    before the day of the closing. Shopper levels rank upward in the order Shop-Only Shopper, Full-Service
    Shopper, Full-Service Shopper Silver, Full-Service Shopper Gold, Full-Service Shopper Platinum and
    Full-Service Shopper Diamond, and a level named with "or above" or "or below" is read in that order.'
  baseline:
    rule: Only the shopper can close an active payout account, and the shopper does so in one step of
      their own that records their confirmed closing request, closes the account and books the final disbursement.
      The final disbursement pays the balance on the account less every credit of the batch that is completed
      but not yet finalized, which follows on a later final disbursement once that batch is finalized,
      and it is rounded to the cent.
    params: []
  prerequisite:
  - problem: payout_ext_card_cashout
    kind: value_input
    gate: bal
    form: state
    policy_source: On a card plan, the final card load is fixed only after the account carries an instant
      cashout dated the day of closing.
    condition: The account, while its plan on record is an Everyday Pay Card plan, carries a payout_instant_cashout
      row dated the day of closing.
    resolved_by: cash_out_to_card_075a5c73
    effect: The card cashout books the cashable balance out of the account, so the balance binding (bal)
      the final disbursement draws on falls by the cashout amount.
  - problem: payout_ext_closing_cashback
    kind: state_gate
    gate: payout_accounts.cashback_balance_usd
    form: action
    policy_source: A card-plan account is not closed until the closing cashback settlement has been paid
      onto the card.
    fallback_reason: The closing settlement books an ordinary cashback payment entry for its statement
      month, the same entry kind a statement payment books, so no record-visible state tells the closing
      settlement apart from a statement payment; only the action can be named.
    condition: The latest statement month with payout_cashback_earned rows carries a payout_cashback_paid
      row, so the card cashback balance shown on the account no longer holds that month's cashback.
    resolved_by: settle_closing_cashback_4e373fbf
    effect: Once the closing settlement is paid, the latest closed month's cashback no longer lapses with
      the closure, and the closure may be recorded.
  cross_category:
  - category: shopper
    as: branch
    reads:
    - variant_name
    - violation_points_balance
    - activated_date
    - shopper_events.event_type
    - shopper_events.rating
    note: The level decides the unfinalized-batch hold and the reserve scaling; violation points and one-star
      ratings decide the conduct and rating reserves; the first activation date decides the reserve scaling.
  - category: batch
    as: history
    reads:
    - batch_id
    - status
    - batch_events.event_type
    - batch_events.pay_component
    - batch_events.amount_usd
    note: The unfinalized batch and its tips, base-pay entries in the last 3 months and pay reversals
      in the last 12 months decide the hold and the clawback reserve.
  compute:
  - bal: F('available_balance_usd')
  - lvl: CFIELD('shopper','variant_name')
  - lvl_rank: 6 if lvl == 'Full-Service Shopper Diamond' else (5 if lvl == 'Full-Service Shopper Platinum'
      else (4 if lvl == 'Full-Service Shopper Gold' else (3 if lvl == 'Full-Service Shopper Silver' else
      (2 if lvl == 'Full-Service Shopper' else 1))))
  - unfin_batch: CFIELD('batch','batch_id', status='completed')
  - unfin_credits: SUM('payout_events','amount_usd', event_type='payout_earnings_credited', batch_id=unfin_batch)
  - unfin_tips: XSUM('batch','batch_events','amount_usd', event_type='batch_tip_posted', batch_id=unfin_batch)
  - base_pays_3m: XCOUNT('batch','batch_events', within_months=3, event_type='batch_pay_posted', pay_component='batch_base')
  - closing_hold: unfin_tips if (lvl_rank >= 5 and base_pays_3m >= K('top_batches_3m')) else (RND(unfin_tips
      + (unfin_credits - unfin_tips) / 2, 2) if ((lvl_rank == 3 or lvl_rank == 4) and base_pays_3m >=
      K('mid_batches_3m')) else unfin_credits)
  - reversals_12m: XCOUNT('batch','batch_events', within_months=12, event_type='batch_pay_reversed')
  - closing_clawback: XMAX('batch','batch_events','amount_usd', event_type='batch_pay_reversed') if reversals_12m
      >= 2 else (K('closing_clawback_one') if reversals_12m == 1 else 0)
  - viol_points: CFIELD('shopper','violation_points_balance') or 0
  - closing_conduct: K('closing_conduct_high') if viol_points >= K('conduct_high_points') else (K('closing_conduct_low')
      if viol_points >= 1 else 0)
  - debits_3m_count: COUNT('payout_events', within_months=3, event_type='payout_earnings_debited')
  - closing_debit: K('closing_debit_many') if debits_3m_count >= K('debit_many_count') else (K('closing_debit_few')
      if debits_3m_count >= 1 else 0)
  - one_star_3m: XCOUNT('shopper','shopper_events', within_months=3, event_type='shopper_rating_received',
      rating=1)
  - rating_reserve: K('rating_reserve_two') if one_star_3m >= 2 else (K('rating_reserve_one') if one_star_3m
      == 1 else 0)
  - active_months: MONTHS(CFIELD('shopper','activated_date'), NOW)
  - reserve_mult: K('reserve_mult_top') if (active_months >= K('long_tenure_months') and lvl_rank >= 5)
      else (K('reserve_mult_other') if (active_months >= K('long_tenure_months') and lvl_rank < 5) else
      1)
  - reserves: RND((closing_clawback + closing_conduct + closing_debit + rating_reserve) * reserve_mult,
      2)
  - result: RND(MX(0, bal - closing_hold - reserves), 2)
  compute_basis:
    bal: The final disbursement pays the balance on the account
    lvl: a shopper at Full-Service Shopper Platinum level or above with 40 or more batch base-pay entries
      in the last 3 months holds back only that batch's tips
    unfin_batch: less every credit of the batch that is completed but not yet finalized
    unfin_credits: less every credit of the batch that is completed but not yet finalized
    unfin_tips: holds back only that batch's tips
    base_pays_3m: with 40 or more batch base-pay entries in the last 3 months
    closing_hold: a shopper at Full-Service Shopper Platinum level or above with 40 or more batch base-pay
      entries in the last 3 months holds back only that batch's tips; a shopper at Full-Service Shopper
      Silver or Gold level with 20 or more batch base-pay entries in the last 3 months holds back those
      tips plus half of the batch's other credits, the sum rounded to the cent; any other shopper holds
      back every credit of that batch.
    reversals_12m: for two or more batch pay reversals in the last 12 months
    closing_clawback: a closing clawback reserve equal to the largest batch pay reversal on the shopper's
      record for two or more batch pay reversals in the last 12 months, a fixed 20.00 for exactly one
      and nothing for none;
    viol_points: a closing conduct reserve of 50.00 for 6 or more active violation points
    closing_conduct: a closing conduct reserve of 50.00 for 6 or more active violation points, 20.00 for
      1 to 5 and nothing for none
    debits_3m_count: a closing debit reserve of 25.00 for 3 or more earnings debits in the last 3 months
    closing_debit: a closing debit reserve of 25.00 for 3 or more earnings debits in the last 3 months,
      12.50 for 1 or 2 and nothing for none
    one_star_3m: a rating reserve of 20.00 for two or more one-star customer ratings in the last 3 months
    rating_reserve: a rating reserve of 20.00 for two or more one-star customer ratings in the last 3
      months, 10.00 for exactly one and nothing for none.
    active_months: a shopper whose contractor account was first activated 48 or more whole months ago
    reserve_mult: a shopper whose contractor account was first activated 48 or more whole months ago and
      who is at Full-Service Shopper Platinum or Diamond level has the sum of the closing reserves halved;
      a shopper activated 48 or more whole months ago who is below Full-Service Shopper Platinum level
      has that sum multiplied by 0.75; any other shopper keeps the full sum;
    reserves: any other shopper keeps the full sum; the scaled sum is rounded to the cent.
    result: The final disbursement is the balance less what is held back for the unfinalized batch, less
      the scaled sum of the closing reserves, never below zero, with the final figure rounded to the cent.
    lvl_rank: Shopper levels rank upward in the order Shop-Only Shopper, Full-Service Shopper, Full-Service
      Shopper Silver, Full-Service Shopper Gold, Full-Service Shopper Platinum and Full-Service Shopper
      Diamond, and a level named with "or above" or "or below" is read in that order.
  factors:
  - id: closing_unfinalized_hold
    effect: parameter
    decides: closing_hold
    bindings:
    - unfin_batch
    - unfin_credits
    - unfin_tips
    - base_pays_3m
    - closing_hold
    ladder:
    - when: shopper level Full-Service Shopper Platinum or above AND 40 or more batch base-pay entries
        in the last 3 months
      value: only the batch's tips (none of its other credits)
    - when: shopper level Full-Service Shopper Silver or Gold AND 20 or more batch base-pay entries in
        the last 3 months
      value: the tips plus half of the other credits, rounded to the cent
    - when: otherwise
      value: every credit of the batch
    baseline:
      closing_hold: unfin_credits
    evidence:
    - cross_category
    - history
    cross_difficulty: batch
  - id: closing_clawback_reserve
    effect: method
    decides: closing_clawback
    bindings:
    - reversals_12m
    - closing_clawback
    ladder:
    - when: two or more batch pay reversals in the last 12 months
      method: the reserve is the largest batch pay reversal on the shopper's record
    - when: exactly one batch pay reversal in the last 12 months
      method: the reserve is a fixed K('closing_clawback_one') = 20.00
    - when: otherwise
      method: no reserve
    baseline:
      closing_clawback: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: batch
  - id: closing_conduct_reserve
    effect: parameter
    decides: closing_conduct
    bindings:
    - viol_points
    - closing_conduct
    ladder:
    - when: 6 or more active violation points
      value: K('closing_conduct_high') = 50.00
    - when: 1 to 5 active violation points
      value: K('closing_conduct_low') = 20.00
    - when: otherwise
      value: '0.00'
    baseline:
      closing_conduct: '0'
    evidence:
    - cross_category
    cross_difficulty: shopper
  - id: closing_debit_reserve
    effect: parameter
    decides: closing_debit
    bindings:
    - debits_3m_count
    - closing_debit
    ladder:
    - when: 3 or more earnings debits in the last 3 months
      value: K('closing_debit_many') = 25.00
    - when: 1 or 2 earnings debits in the last 3 months
      value: K('closing_debit_few') = 12.50
    - when: otherwise
      value: '0.00'
    baseline:
      closing_debit: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: closing_rating_reserve
    effect: parameter
    decides: rating_reserve
    bindings:
    - one_star_3m
    - rating_reserve
    ladder:
    - when: two or more one-star customer ratings in the last 3 months
      value: K('rating_reserve_two') = 20.00
    - when: exactly one one-star customer rating in the last 3 months
      value: K('rating_reserve_one') = 10.00
    - when: otherwise
      value: '0.00'
    baseline:
      rating_reserve: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: shopper
  - id: closing_reserve_scaling
    effect: parameter
    decides: reserve_mult
    bindings:
    - active_months
    - reserve_mult
    ladder:
    - when: contractor account first activated 48 or more whole months ago AND shopper at Full-Service
        Shopper Platinum or Diamond level
      value: K('reserve_mult_top') = 0.5
    - when: contractor account first activated 48 or more whole months ago AND shopper below Full-Service
        Shopper Platinum level
      value: K('reserve_mult_other') = 0.75
    - when: otherwise
      value: 1 (the full sum)
    baseline:
      reserve_mult: '1'
    evidence:
    - cross_category
    - date
    cross_difficulty: shopper
  inputs:
    history:
    - table: payout_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: payout_earnings_credited
    - table: payout_events
      aggregate: count
      field: payout_event_id
      within_months: 3
      filters:
        event_type: payout_earnings_debited
    - category: batch
      table: batch_events
      aggregate: count
      field: batch_event_id
      within_months: 3
      filters:
        event_type: batch_pay_posted
        pay_component: batch_base
    - category: batch
      table: batch_events
      aggregate: count
      field: batch_event_id
      within_months: 12
      filters:
        event_type: batch_pay_reversed
    - category: shopper
      table: shopper_events
      aggregate: count
      field: shopper_event_id
      within_months: 3
      filters:
        event_type: shopper_rating_received
        rating: 1
    - category: batch
      table: batch_events
      aggregate: max
      field: amount_usd
      filters:
        event_type: batch_pay_reversed
    cross_category:
    - shopper
    - batch
