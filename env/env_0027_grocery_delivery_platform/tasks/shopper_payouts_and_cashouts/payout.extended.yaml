      the last 12 months whose shopper is at Full-Service Shopper Gold level or below keeps half of that
      part on the balance, rounded to the cent; any other account sweeps it with the rest.
    dest_days: where the destination was replaced fewer than 30 days ago (counted in calendar days from
      the moment of the replacement, or from the opening date when it was never replaced)
    ver_months: and the account was verified fewer than 12 whole months ago
    dep_limit: and the account was verified 12 or more whole months ago, the catch-up draws on at most
      the largest single weekly sweep deposit ever booked on the account, re-send deposits (those pointing
      to a returned-transfer entry) not counted; where the destination was replaced fewer than 30 days
      ago and the account was verified fewer than 12 whole months ago, it draws on at most a fixed 200.00
      of the balance; otherwise it draws on the whole balance.
    tip_reductions_3m: a shopper with two or more batch tip reductions in the last 3 months leaves 15.00
    tip_buffer: a shopper with two or more batch tip reductions in the last 3 months leaves 15.00, a shopper
