    - dest_days
    - ver_months
    - new_dest_hold
    ladder:
    - when: destination replaced fewer than 30 days ago AND account verified 12 or more whole months ago
      method: 10 percent of the balance is kept back, rounded to the cent
    - when: destination replaced fewer than 30 days ago AND account verified fewer than 12 whole months
        ago
      method: a fixed K('new_dest_hold_recent') = 50.00 is kept back
    - when: otherwise
      method: nothing is kept back
    baseline:
      new_dest_hold: '0'
    evidence:
    - date
    cross_difficulty: null
