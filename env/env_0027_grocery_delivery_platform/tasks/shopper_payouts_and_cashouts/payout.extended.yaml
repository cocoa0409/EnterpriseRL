- id: payout_ext_sweep_catchup
  base_policy_refs:
  - payout_evt_weekly_deposit
  overwrite:
  - base_policy: payout_evt_weekly_deposit
    superseded_clause: on weekly_deposit_weekday, the balance earned up to the previous weekly pay cutoff
      (batch charter) is sent to the destination as one deposit for that earnings period, provided it
      is at least weekly_deposit_min_usd; smaller or negative balances carry over.
    replaced_by: When one or more weekly deposit days passed while the account was not active, a single
      catch-up deposit is sent once the account is active again, covering every earnings period those
      days would have swept.
  - base_policy: payout_evt_weekly_deposit
    superseded_clause: Tips whose batch is not yet finalized stay behind for the next sweep where tips_cashout_after_finalization
      is true.
    replaced_by: The catch-up deposit is the balance on the account less every credit of the batch that
      is completed but not yet finalized, sent in full, dated with the end of the latest closed weekly
      earnings period and rounded to the cent.
  trigger: state_due
  subject:
  - payout_weekly_deposit
  computes: amount_usd
  target_tool: send_catchup_deposit_164755b4
  params:
    gold_batches_3m: 24
    silver_batches_3m: 12
    dest_window_days: 30
    established_months: 12
    catchup_limit_recent: 200.0
    tip_buffer_two: 15.0
    tip_buffer_one: 7.5
    catchup_conduct_high: 30.0
    catchup_conduct_low: 12.0
    conduct_high_points: 6
  rule: 'When one or more weekly deposit days passed while the account was not active, a single catch-up
    deposit is sent once the account is active again, covering every earnings period those days would
    have swept. The catch-up deposit is the balance on the account less every credit of the batch that
    is completed but not yet finalized, sent in full, dated with the end of the latest closed weekly earnings
    period and rounded to the cent. A catch-up deposit is fixed only after the latest returned-transfer
    entry on the account has a re-send deposit pointing to it. What the catch-up leaves behind for the
    unfinalized batch depends on the shopper''s standing: a shopper at Full-Service Shopper Gold level
    or above with 24 or more batch base-pay entries in the last 3 months leaves behind only the tips posted
    on that batch; a shopper at Full-Service Shopper Silver level with 12 or more batch base-pay entries
    in the last 3 months leaves behind those tips plus half of the batch''s other credits, the sum rounded
    to the cent; any other shopper leaves behind every credit of that batch. The part of the latest returned
    transfer that no re-send deposit has yet carried is treated by return history: an account with two
    or more returned-transfer entries in the last 12 months keeps that whole part on the balance for a
    later re-send; an account with exactly one returned-transfer entry in the last 12 months whose shopper
    is at Full-Service Shopper Gold level or below keeps half of that part on the balance, rounded to
    the cent; any other account sweeps it with the rest. The catch-up limit for a recently replaced destination
    depends on how recently the destination was replaced and how long ago the account was verified: where
    the destination was replaced fewer than 30 days ago (counted in calendar days from the moment of the
    replacement, or from the opening date when it was never replaced) and the account was verified 12
    or more whole months ago, the catch-up draws on at most the largest single weekly sweep deposit ever
    booked on the account, re-send deposits (those pointing to a returned-transfer entry) not counted;
    where the destination was replaced fewer than 30 days ago and the account was verified fewer than
    12 whole months ago, it draws on at most a fixed 200.00 of the balance; otherwise it draws on the
    whole balance. A tip-reduction buffer stays on the balance: a shopper with two or more batch tip reductions
    in the last 3 months leaves 15.00, a shopper with exactly one leaves 7.50, and a shopper with none
    leaves nothing. A catch-up conduct buffer stays on the balance: a shopper carrying 6 or more active
    violation points leaves 30.00, a shopper carrying 1 to 5 leaves 12.00, and a shopper carrying none
    leaves nothing. The catch-up first takes the smaller of the balance and the catch-up limit, then subtracts
    what is left behind for the unfinalized batch, the returned part kept, the tip-reduction buffer and
    the catch-up conduct buffer, never going below zero, with the final figure rounded to the cent. "The
    last N months" counts the entries booked fewer than N whole months before the day of the catch-up.
    Shopper levels rank upward in the order Shop-Only Shopper, Full-Service Shopper, Full-Service Shopper
    Silver, Full-Service Shopper Gold, Full-Service Shopper Platinum and Full-Service Shopper Diamond,
    and a level named with "or above" or "or below" is read in that order.'
  baseline:
    rule: When one or more weekly deposit days passed while the account was not active, a single catch-up
      deposit is sent once the account is active again, covering every earnings period those days would
      have swept. The catch-up deposit is the balance on the account less every credit of the batch that
      is completed but not yet finalized, sent in full, dated with the end of the latest closed weekly
      earnings period and rounded to the cent.
    params: []
  prerequisite:
  - problem: payout_ext_returned_resend
    kind: value_input
    gate: ret_remainder
    form: state
    policy_source: A catch-up deposit is fixed only after the latest returned-transfer entry on the account
      has a re-send deposit pointing to it.
    condition: The latest payout_transfer_returned row of the account has at least one payout_weekly_deposit
      row whose source_event_id is that row's id.
    resolved_by: resend_returned_transfer_f902fe69
    effect: The re-send deposit books part of the returned amount out of the balance, so the balance the
      catch-up draws on falls by the re-sent amount and the returned part not yet re-sent (ret_remainder)
      falls to the returned amount less the re-send, which changes the returned part kept on the balance.
  cross_category:
  - category: shopper
    as: branch
    reads:
    - variant_name
    - violation_points_balance
    note: The shopper level decides what stays behind for the unfinalized batch and how the returned part
      is treated; violation points decide the conduct buffer.
  - category: batch
    as: history
    reads:
    - batch_id
    - status
    - batch_events.event_type
    - batch_events.pay_component
    - batch_events.amount_usd
    note: The completed-but-unfinalized batch and its tips, base-pay entries in the last 3 months and
      tip reductions in the last 3 months decide the hold and the buffer.
  compute:
  - bal: F('available_balance_usd')
  - lvl: CFIELD('shopper','variant_name')
  - lvl_rank: 6 if lvl == 'Full-Service Shopper Diamond' else (5 if lvl == 'Full-Service Shopper Platinum'
      else (4 if lvl == 'Full-Service Shopper Gold' else (3 if lvl == 'Full-Service Shopper Silver' else
      (2 if lvl == 'Full-Service Shopper' else 1))))
  - unfin_batch: CFIELD('batch','batch_id', status='completed')
  - unfin_credits: SUM('payout_events','amount_usd', event_type='payout_earnings_credited', batch_id=unfin_batch)
  - unfin_tips: XSUM('batch','batch_events','amount_usd', event_type='batch_tip_posted', batch_id=unfin_batch)
  - base_pays_3m: XCOUNT('batch','batch_events', within_months=3, event_type='batch_pay_posted', pay_component='batch_base')
  - held: unfin_tips if (lvl_rank >= 4 and base_pays_3m >= K('gold_batches_3m')) else (RND(unfin_tips
      + (unfin_credits - unfin_tips) / 2, 2) if (lvl_rank == 3 and base_pays_3m >= K('silver_batches_3m'))
      else unfin_credits)
  - ret_amt: LATEST('payout_events','amount_usd', event_type='payout_transfer_returned') or 0
  - ret_id: LATEST('payout_events','payout_event_id', event_type='payout_transfer_returned')
  - ret_remainder: RND(MX(0, ret_amt - SUM('payout_events','amount_usd', event_type='payout_weekly_deposit',
      source_event_id=ret_id)), 2)
  - returns_12m: COUNT('payout_events', within_months=12, event_type='payout_transfer_returned')
  - kept: ret_remainder if returns_12m >= 2 else (RND(ret_remainder / 2, 2) if (returns_12m == 1 and lvl_rank
      <= 4) else 0)
  - dest_days: DAYS(F('destination_changed_at') or F('opened_date'), NOW)
  - ver_months: MONTHS(F('verified_date'), NOW)
  - largest_deposit: MAX('payout_events','amount_usd', event_type='payout_weekly_deposit', source_event_id=None)
  - dep_limit: largest_deposit if (dest_days < K('dest_window_days') and ver_months >= K('established_months'))
      else (K('catchup_limit_recent') if (dest_days < K('dest_window_days') and ver_months < K('established_months'))
      else bal)
  - tip_reductions_3m: XCOUNT('batch','batch_events', within_months=3, event_type='batch_tip_adjusted_down')
  - tip_buffer: K('tip_buffer_two') if tip_reductions_3m >= 2 else (K('tip_buffer_one') if tip_reductions_3m
