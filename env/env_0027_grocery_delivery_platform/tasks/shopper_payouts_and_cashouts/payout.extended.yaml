  - viol_points: CFIELD('shopper','violation_points_balance') or 0
  - conduct_buffer: K('catchup_conduct_high') if viol_points >= K('conduct_high_points') else (K('catchup_conduct_low')
      if viol_points >= 1 else 0)
  - result: RND(MX(0, MN(dep_limit, bal) - held - kept - tip_buffer - conduct_buffer), 2)
  compute_basis:
