    lvl_rank: Shopper levels rank upward in the order Shop-Only Shopper, Full-Service Shopper, Full-Service
      Shopper Silver, Full-Service Shopper Gold, Full-Service Shopper Platinum and Full-Service Shopper
      Diamond, and a level named with "or above" or "or below" is read in that order.
    largest_deposit: the catch-up draws on at most the largest single weekly sweep deposit ever booked
      on the account, re-send deposits (those pointing to a returned-transfer entry) not counted;
  factors:
  - id: unfinalized_batch_leave_behind
    effect: parameter
    decides: held
    bindings:
    - unfin_batch
    - unfin_credits
    - unfin_tips
    - base_pays_3m
    - held
    ladder:
    - when: shopper level Full-Service Shopper Gold or above AND 24 or more batch base-pay entries in
        the last 3 months
      value: only the batch's tips (none of its other credits)
    - when: shopper level Full-Service Shopper Silver AND 12 or more batch base-pay entries in the last
        3 months
      value: the tips plus half of the other credits, rounded to the cent
    - when: otherwise
      value: every credit of the batch
    baseline:
      held: unfin_credits
    evidence:
    - cross_category
    - history
    cross_difficulty: batch
  - id: returned_part_sweep_treatment
    effect: parameter
    decides: kept
    bindings:
    - ret_amt
    - ret_id
    - ret_remainder
    - returns_12m
    - kept
    ladder:
    - when: two or more returned-transfer entries in the last 12 months
      value: the whole returned part not yet re-sent
    - when: exactly one returned-transfer entry in the last 12 months AND shopper at Full-Service Shopper
        Gold level or below
      value: half of that part, rounded to the cent
    - when: otherwise
      value: nothing (the part is swept)
    baseline:
      kept: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: catchup_new_destination_limit
    effect: method
    decides: dep_limit
    bindings:
    - dest_days
    - ver_months
    - largest_deposit
    - dep_limit
    ladder:
    - when: destination replaced fewer than 30 days ago AND account verified 12 or more whole months ago
      method: the catch-up is limited to the largest single weekly sweep deposit ever booked on the account
        (re-send deposits not counted)
    - when: destination replaced fewer than 30 days ago AND account verified fewer than 12 whole months
        ago
      method: the catch-up is limited to a fixed K('catchup_limit_recent') = 200.00
    - when: otherwise
      method: the catch-up draws on the whole balance
    baseline:
      dep_limit: bal
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: catchup_tip_reduction_buffer
    effect: parameter
    decides: tip_buffer
    bindings:
    - tip_reductions_3m
    - tip_buffer
    ladder:
    - when: two or more batch tip reductions in the last 3 months
      value: K('tip_buffer_two') = 15.00
    - when: exactly one batch tip reduction in the last 3 months
      value: K('tip_buffer_one') = 7.50
    - when: otherwise
      value: '0.00'
    baseline:
      tip_buffer: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: batch
  - id: catchup_conduct_buffer
    effect: parameter
    decides: conduct_buffer
    bindings:
    - viol_points
    - conduct_buffer
    ladder:
    - when: 6 or more active violation points
      value: K('catchup_conduct_high') = 30.00
    - when: 1 to 5 active violation points
      value: K('catchup_conduct_low') = 12.00
    - when: otherwise
      value: '0.00'
    baseline:
      conduct_buffer: '0'
    evidence:
    - cross_category
    cross_difficulty: shopper
  inputs:
    history:
    - table: payout_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: payout_earnings_credited
    - table: payout_events
      aggregate: count
      field: payout_event_id
      within_months: 12
      filters:
        event_type: payout_transfer_returned
    - table: payout_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: payout_weekly_deposit
    - category: batch
      table: batch_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: batch_tip_posted
    - category: batch
      table: batch_events
      aggregate: count
      field: batch_event_id
      within_months: 3
      filters:
        event_type: batch_pay_posted
        pay_component: batch_base
    - category: batch
      table: batch_events
      aggregate: count
      field: batch_event_id
      within_months: 3
      filters:
        event_type: batch_tip_adjusted_down
    - table: payout_events
      aggregate: max
      field: amount_usd
      filters:
        event_type: payout_weekly_deposit
    cross_category:
    - shopper
    - batch
- id: payout_ext_card_plan_exit
  base_policy_refs:
  - payout_plan_eligibility
  - payout_evt_cashback
  overwrite:
  - base_policy: payout_evt_cashback
    superseded_clause: The month's cashback is paid onto the card on cashback_payment_day of the following
      month when it is at least cashback_min_payment_usd; smaller amounts carry over.
    replaced_by: When an account moves off the Everyday Pay Card plans to a plan without a card, the card's
      cashback earned and not yet paid is settled onto the card at the move, as one payment carrying the
      latest statement month with earned entries, and whatever the settlement does not pay lapses with
      the move.
  - base_policy: payout_evt_cashback
    superseded_clause: A statement month's total cashback (payout_msr_cashback_month) is capped at cashback_monthly_cap_usd,
      applied to categories in the order cashback_cap_order (fuel, ev_charging, auto_maintenance).
    replaced_by: 'The exit cap depends on the shopper''s level and recent work: a shopper at Full-Service
      Shopper Platinum or Diamond level with 10 or more batch base-pay entries in the last month is settled
      under 1.5 times the monthly cashback cap of the plan being left; a shopper at Full-Service Shopper
      Gold level with 8 or more batch base-pay entries in the last month is settled under 1.25 times that
      cap; any other shopper is settled under the monthly cashback cap of the plan being left; a raised
      cap is rounded to the cent.'
  trigger: on_request
  subject:
  - payout_plan_changed
  - payout_cashback_paid
  computes: settlement_usd
  target_tool: move_off_card_plan_7a80b851
  params:
    top_batches_1m: 10
    gold_batches_1m: 8
    fuel_boost_high: 1.25
    fuel_boost_mid: 1.1
    mileage_high: 20
    mileage_mid: 8
    auto_boost_high: 1.5
    auto_boost_mid: 1.2
    heavy_high: 6
    heavy_mid: 3
    share_new_unpaid: 0.5
    share_new_paid: 0.8
    short_card_months: 6
    tenure_bonus_long: 0.1
    tenure_bonus_mid: 0.05
    tenure_long_months: 36
    tenure_mid_months: 12
    exit_cap_mult_top: 1.5
    exit_cap_mult_gold: 1.25
  rule: 'When an account moves off the Everyday Pay Card plans to a plan without a card, the card''s cashback
    earned and not yet paid is settled onto the card at the move, as one payment carrying the latest statement
    month with earned entries, and whatever the settlement does not pay lapses with the move. The move
    itself goes to the plan whose payout destination is the kind of destination the shopper now receives
    payouts to, and it is allowed only while the account is active. The exit settlement takes the fuel,
    EV charging and auto maintenance cashback earned for the latest statement month with earned entries,
    unless a payment already carries that month, caps that month''s total at the monthly cashback cap
    of the plan being left, adds any older cashback still in the card cashback balance shown on the account
    (that balance, or the cashback earned less every cashback payment booked when that is lower, less
    the latest month''s earned cashback when no payment carries that month, never below zero), and pays
    that sum in full, rounded to the cent. The exit cap depends on the shopper''s level and recent work:
    a shopper at Full-Service Shopper Platinum or Diamond level with 10 or more batch base-pay entries
    in the last month is settled under 1.5 times the monthly cashback cap of the plan being left; a shopper
    at Full-Service Shopper Gold level with 8 or more batch base-pay entries in the last month is settled
    under 1.25 times that cap; any other shopper is settled under the monthly cashback cap of the plan
    being left; a raised cap is rounded to the cent. Which categories the exit cap covers depends on the
    shopper''s Cartwise+ membership: a shopper holding an active Cartwise+ Premier Annual or Cartwise+
    Family Annual membership has the cap cover fuel and EV charging only, with auto maintenance added
    on top; a shopper holding any other active Cartwise+ membership has the cap cover fuel and auto maintenance
    only, with EV charging added on top; a shopper with no active Cartwise+ membership has the cap cover
    the month''s total. Fuel cashback is boosted for shoppers who drive: a shopper with 20 or more batch
    mileage-pay entries in the last month has the month''s fuel cashback multiplied by 1.25, a shopper
    with 8 to 19 has it multiplied by 1.1, and any other shopper keeps it as earned. Auto maintenance
    cashback is boosted for heavy-order shoppers: a shopper with 6 or more batch heavy-pay entries in
    the last month has the month''s auto maintenance cashback multiplied by 1.5, a shopper with 3 to 5
    has it multiplied by 1.2, and any other shopper keeps it as earned; each boosted category figure is
    rounded to the cent before the cap is applied. The share settled depends on how long the account has
    been on the plan being left: an account whose latest plan change (or, when it never changed plan,
    its opening) was fewer than 6 whole months ago and that has no cashback payment in the last 3 months
    is settled at half; such an account with one or more cashback payments in the last 3 months is settled
    at 0.8 of the sum; any other account is settled in full. A tenure bonus is added for long-standing
    shoppers: a shopper whose contractor account was first activated 36 or more whole months ago has the
    shared amount raised by 10 percent, one activated 12 to 35 whole months ago has it raised by 5 percent,
    and any other shopper gets no bonus. The settlement is the capped month plus the older unpaid cashback,
    multiplied first by the share and then by one plus the tenure bonus, rounded to the cent only on that
    final figure. "The last N months" counts the entries booked fewer than N whole months before the day
    of the move. Shopper levels rank upward in the order Shop-Only Shopper, Full-Service Shopper, Full-Service
    Shopper Silver, Full-Service Shopper Gold, Full-Service Shopper Platinum and Full-Service Shopper
    Diamond, and a level named with "or above" or "or below" is read in that order.'
  baseline:
    rule: When an account moves off the Everyday Pay Card plans to a plan without a card, the card's cashback
      earned and not yet paid is settled onto the card at the move, as one payment carrying the latest
      statement month with earned entries, and whatever the settlement does not pay lapses with the move.
      The exit settlement takes the fuel, EV charging and auto maintenance cashback earned for the latest
      statement month with earned entries, unless a payment already carries that month, caps that month's
      total at the monthly cashback cap of the plan being left, adds any older cashback still in the card
      cashback balance shown on the account (that balance, or the cashback earned less every cashback
      payment booked when that is lower, less the latest month's earned cashback when no payment carries
      that month, never below zero), and pays that sum in full, rounded to the cent.
    params:
    - cashback_monthly_cap_usd
  prerequisite: []
  cross_category:
  - category: shopper
    as: branch
    reads:
    - variant_name
    - activated_date
    note: The shopper level decides the exit cap; the first activation date decides the tenure bonus.
  - category: batch
    as: history
    reads:
    - batch_events.event_type
    - batch_events.pay_component
    note: Base-pay, mileage-pay and heavy-pay entries in the last month decide the exit cap and the fuel
      and auto maintenance boosts.
  - category: membership
    as: branch
    reads:
    - variant_name
    - status
    note: The active Cartwise+ plan decides which categories the exit cap covers.
  compute:
  - lvl: CFIELD('shopper','variant_name')
  - lvl_rank: 6 if lvl == 'Full-Service Shopper Diamond' else (5 if lvl == 'Full-Service Shopper Platinum'
      else (4 if lvl == 'Full-Service Shopper Gold' else (3 if lvl == 'Full-Service Shopper Silver' else
      (2 if lvl == 'Full-Service Shopper' else 1))))
  - last_month: LATEST('payout_events','statement_month', event_type='payout_cashback_earned')
  - fuel: SUM('payout_events','amount_usd', event_type='payout_cashback_earned', statement_month=last_month,
      merchant_category='fuel')
  - ev: SUM('payout_events','amount_usd', event_type='payout_cashback_earned', statement_month=last_month,
      merchant_category='ev_charging')
  - auto: SUM('payout_events','amount_usd', event_type='payout_cashback_earned', statement_month=last_month,
      merchant_category='auto_maintenance')
  - last_paid: SUM('payout_events','amount_usd', event_type='payout_cashback_paid', statement_month=last_month)
  - earned_all: SUM('payout_events','amount_usd', event_type='payout_cashback_earned')
  - paid_all: SUM('payout_events','amount_usd', event_type='payout_cashback_paid')
  - cash_bal: MX(0, MN(F('cashback_balance_usd'), RND(earned_all - paid_all, 2)))
  - older_unpaid: RND(MX(0, cash_bal - ((fuel + ev + auto) if last_paid == 0 else 0)), 2)
  - base_pays_1m: XCOUNT('batch','batch_events', within_months=1, event_type='batch_pay_posted', pay_component='batch_base')
  - exit_cap: RND(P('cashback_monthly_cap_usd') * K('exit_cap_mult_top'), 2) if (lvl_rank >= 5 and base_pays_1m
      >= K('top_batches_1m')) else (RND(P('cashback_monthly_cap_usd') * K('exit_cap_mult_gold'), 2) if
      (lvl_rank == 4 and base_pays_1m >= K('gold_batches_1m')) else P('cashback_monthly_cap_usd'))
  - mileage_pays_1m: XCOUNT('batch','batch_events', within_months=1, event_type='batch_pay_posted', pay_component='mileage')
  - fuel_boost: K('fuel_boost_high') if mileage_pays_1m >= K('mileage_high') else (K('fuel_boost_mid')
      if mileage_pays_1m >= K('mileage_mid') else 1)
  - heavy_pays_1m: XCOUNT('batch','batch_events', within_months=1, event_type='batch_pay_posted', pay_component='heavy_pay')
  - auto_boost: K('auto_boost_high') if heavy_pays_1m >= K('heavy_high') else (K('auto_boost_mid') if
      heavy_pays_1m >= K('heavy_mid') else 1)
  - fuel_adj: RND(fuel * fuel_boost, 2)
  - auto_adj: RND(auto * auto_boost, 2)
  - member_plan: CFIELD('membership','variant_name', status='active')
  - month_capped: (MN(fuel_adj + ev, exit_cap) + auto_adj) if (member_plan == 'Cartwise+ Premier Annual'
      or member_plan == 'Cartwise+ Family Annual') else ((MN(fuel_adj + auto_adj, exit_cap) + ev) if member_plan
      else MN(fuel_adj + ev + auto_adj, exit_cap))
  - month_part: month_capped if last_paid == 0 else 0
  - plan_months: MONTHS(F('plan_changed_date') or F('opened_date'), NOW)
  - payments_3m: COUNT('payout_events', within_months=3, event_type='payout_cashback_paid')
  - share: K('share_new_unpaid') if (plan_months < K('short_card_months') and payments_3m == 0) else (K('share_new_paid')
      if (plan_months < K('short_card_months') and payments_3m >= 1) else 1)
  - active_months: MONTHS(CFIELD('shopper','activated_date'), NOW)
  - tenure_bonus: K('tenure_bonus_long') if active_months >= K('tenure_long_months') else (K('tenure_bonus_mid')
      if active_months >= K('tenure_mid_months') else 0)
  - result: RND((month_part + older_unpaid) * share * (1 + tenure_bonus), 2)
  compute_basis:
    lvl: a shopper at Full-Service Shopper Platinum or Diamond level with 10 or more batch base-pay entries
      in the last month is settled under 1.5 times the monthly cashback cap of the plan being left
    last_month: The exit settlement takes the fuel, EV charging and auto maintenance cashback earned for
      the latest statement month with earned entries
    fuel: The exit settlement takes the fuel, EV charging and auto maintenance cashback earned for the
      latest statement month with earned entries
    ev: The exit settlement takes the fuel, EV charging and auto maintenance cashback earned for the latest
      statement month with earned entries
    auto: The exit settlement takes the fuel, EV charging and auto maintenance cashback earned for the
      latest statement month with earned entries
    last_paid: unless a payment already carries that month
    older_unpaid: adds any older cashback still in the card cashback balance shown on the account (that
      balance, or the cashback earned less every cashback payment booked when that is lower, less the
      latest month's earned cashback when no payment carries that month, never below zero),
    base_pays_1m: with 10 or more batch base-pay entries in the last month
    exit_cap: 'The exit cap depends on the shopper''s level and recent work: a shopper at Full-Service
      Shopper Platinum or Diamond level with 10 or more batch base-pay entries in the last month is settled
      under 1.5 times the monthly cashback cap of the plan being left; a shopper at Full-Service Shopper
      Gold level with 8 or more batch base-pay entries in the last month is settled under 1.25 times that
      cap; any other shopper is settled under the monthly cashback cap of the plan being left; a raised
      cap is rounded to the cent.'
    mileage_pays_1m: a shopper with 20 or more batch mileage-pay entries in the last month
    fuel_boost: a shopper with 20 or more batch mileage-pay entries in the last month has the month's
      fuel cashback multiplied by 1.25, a shopper with 8 to 19 has it multiplied by 1.1, and any other
      shopper keeps it as earned.
    heavy_pays_1m: a shopper with 6 or more batch heavy-pay entries in the last month
    auto_boost: a shopper with 6 or more batch heavy-pay entries in the last month has the month's auto
      maintenance cashback multiplied by 1.5, a shopper with 3 to 5 has it multiplied by 1.2, and any
      other shopper keeps it as earned
    fuel_adj: each boosted category figure is rounded to the cent before the cap is applied
    auto_adj: each boosted category figure is rounded to the cent before the cap is applied
    member_plan: a shopper holding an active Cartwise+ Premier Annual or Cartwise+ Family Annual membership
    month_capped: a shopper holding an active Cartwise+ Premier Annual or Cartwise+ Family Annual membership
      has the cap cover fuel and EV charging only, with auto maintenance added on top; a shopper holding
      any other active Cartwise+ membership has the cap cover fuel and auto maintenance only, with EV
      charging added on top; a shopper with no active Cartwise+ membership has the cap cover the month's
      total.
    month_part: unless a payment already carries that month
    plan_months: an account whose latest plan change (or, when it never changed plan, its opening) was
      fewer than 6 whole months ago
    payments_3m: and that has no cashback payment in the last 3 months
    share: an account whose latest plan change (or, when it never changed plan, its opening) was fewer
      than 6 whole months ago and that has no cashback payment in the last 3 months is settled at half;
      such an account with one or more cashback payments in the last 3 months is settled at 0.8 of the
      sum; any other account is settled in full.
    active_months: a shopper whose contractor account was first activated 36 or more whole months ago
    tenure_bonus: a shopper whose contractor account was first activated 36 or more whole months ago has
      the shared amount raised by 10 percent, one activated 12 to 35 whole months ago has it raised by
      5 percent, and any other shopper gets no bonus.
    result: The settlement is the capped month plus the older unpaid cashback, multiplied first by the
      share and then by one plus the tenure bonus, rounded to the cent only on that final figure.
    lvl_rank: Shopper levels rank upward in the order Shop-Only Shopper, Full-Service Shopper, Full-Service
      Shopper Silver, Full-Service Shopper Gold, Full-Service Shopper Platinum and Full-Service Shopper
      Diamond, and a level named with "or above" or "or below" is read in that order.
    cash_bal: that balance, or the cashback earned less every cashback payment booked when that is lower
    earned_all: the cashback earned less every cashback payment booked when that is lower
    paid_all: the cashback earned less every cashback payment booked when that is lower
  factors:
  - id: exit_cap_by_level
    effect: parameter
    decides: exit_cap
    bindings:
    - base_pays_1m
    - exit_cap
    ladder:
    - when: shopper level Full-Service Shopper Platinum or Diamond AND 10 or more batch base-pay entries
        in the last month
      value: 1.5 x P('cashback_monthly_cap_usd') of the plan being left
    - when: shopper level Full-Service Shopper Gold AND 8 or more batch base-pay entries in the last month
      value: 1.25 x P('cashback_monthly_cap_usd') of the plan being left
    - when: otherwise
      value: P('cashback_monthly_cap_usd') of the plan being left
    baseline:
      exit_cap: P('cashback_monthly_cap_usd')
    evidence:
    - cross_category
    - history
    - tier_param
    cross_difficulty: batch
  - id: exit_cap_category_scope
    effect: method
    decides: month_capped
    bindings:
    - member_plan
    - month_capped
    ladder:
    - when: an active Cartwise+ Premier Annual or Cartwise+ Family Annual membership
      method: the cap covers fuel and EV charging; auto maintenance is added on top
    - when: any other active Cartwise+ membership
      method: the cap covers fuel and auto maintenance; EV charging is added on top
    - when: otherwise
      method: the cap covers the month's total
    baseline:
      month_capped: MN(fuel_adj + ev + auto_adj, exit_cap)
    evidence:
    - cross_category
    cross_difficulty: membership
  - id: exit_early_share
    effect: parameter
    decides: share
    bindings:
    - plan_months
    - payments_3m
    - share
    ladder:
    - when: latest plan change fewer than 6 whole months ago AND no cashback payment in the last 3 months
      value: K('share_new_unpaid') = 0.5
    - when: latest plan change fewer than 6 whole months ago AND one or more cashback payments in the
        last 3 months
      value: K('share_new_paid') = 0.8
    - when: otherwise
      value: 1 (settled in full)
    baseline:
      share: '1'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: exit_fuel_boost
    effect: parameter
    decides: fuel_boost
    bindings:
    - mileage_pays_1m
    - fuel_boost
    ladder:
    - when: 20 or more batch mileage-pay entries in the last month
      value: K('fuel_boost_high') = 1.25
    - when: 8 to 19 batch mileage-pay entries in the last month
      value: K('fuel_boost_mid') = 1.1
    - when: otherwise
      value: 1 (as earned)
    baseline:
      fuel_boost: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: batch
  - id: exit_auto_boost
    effect: parameter
    decides: auto_boost
    bindings:
    - heavy_pays_1m
    - auto_boost
    ladder:
    - when: 6 or more batch heavy-pay entries in the last month
      value: K('auto_boost_high') = 1.5
    - when: 3 to 5 batch heavy-pay entries in the last month
      value: K('auto_boost_mid') = 1.2
    - when: otherwise
      value: 1 (as earned)
    baseline:
      auto_boost: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: batch
  - id: exit_tenure_bonus
    effect: parameter
    decides: tenure_bonus
    bindings:
    - active_months
    - tenure_bonus
    ladder:
    - when: contractor account first activated 36 or more whole months ago
      value: K('tenure_bonus_long') = 0.10
    - when: contractor account first activated 12 to 35 whole months ago
      value: K('tenure_bonus_mid') = 0.05
    - when: otherwise
      value: '0'
    baseline:
      tenure_bonus: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: shopper
  inputs:
    history:
    - table: payout_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: payout_cashback_earned
    - table: payout_events
      aggregate: count
      field: payout_event_id
      within_months: 3
      filters:
        event_type: payout_cashback_paid
    - category: batch
      table: batch_events
      aggregate: count
      field: batch_event_id
      within_months: 1
      filters:
        event_type: batch_pay_posted
    - table: payout_events
      aggregate: sum
      field: amount_usd
      filters:
        event_type: payout_cashback_paid
    cross_category:
    - shopper
    - batch
    - membership
- id: payout_ext_debit_cashout
  base_policy_refs:
  - payout_evt_instant_cashout
  - payout_evt_earnings_ledger
  overwrite:
  - base_policy: payout_evt_instant_cashout
    superseded_clause: Each cashout carries a fee row of instant_cashout_fee_usd (0.00 on plans without
      a fee, and 0.00 for the first cashout after verification where instant_fee_waiver_first_cashout
      is true), taken from the balance in addition to the amount sent.
    replaced_by: 'The cashout fee depends on the shopper''s level and recent cashouts: a shopper at Full-Service
      Shopper Platinum or Diamond level with no instant cashout in the last 3 months pays no fee; a shopper
      at Full-Service Shopper Gold level with no instant cashout in the last 3 months pays half the plan''s
      instant cashout fee, rounded to the cent; any other shopper pays the plan''s instant cashout fee.'
  - base_policy: payout_evt_earnings_ledger
    superseded_clause: Where tips_cashout_after_finalization is true, tip credits count toward the cashable
      balance (payout_msr_cashable_balance) only once their batch is finalized.
    replaced_by: 'How much of the unfinalized batch''s tips is held back depends on the shopper''s level
      and tip history: a shopper at Full-Service Shopper Gold level or above with no batch tip reduction
      in the last 6 months has none of those tips held back; a shopper at Full-Service Shopper Silver
      level or above with exactly one batch tip reduction in the last 6 months has half of them held back,
      rounded to the cent; any other shopper has all of them held back.'
  trigger: on_request
  subject:
  - payout_instant_cashout
  - payout_cashout_fee_charged
  computes: amount_usd
  target_tool: cash_out_to_debit_card_0246d821
  params:
    fee_half: 0.5
    return_reserve_two: 40.0
    return_reserve_one: 20.0
    debit_buffer_many: 15.0
    debit_buffer_few: 7.5
    debit_many_count: 3
    cashout_conduct_high: 20.0
    cashout_conduct_low: 8.0
    conduct_high_points: 6
    dest_window_days: 30
    established_months: 12
    new_dest_hold_recent: 50.0
    new_dest_hold_share: 0.1
  rule: 'An instant cashout to an external debit card sends the balance on the account less the tips posted
    on the batch that is completed but not yet finalized, less the plan''s instant cashout fee taken on
    top, limited to the plan''s per-transaction maximum and to what remains of the plan''s daily maximum
    after the day''s earlier cashouts, and rounded to the cent. An instant cashout to an external debit
    card is worked out only after the account''s payout plan on record is Instant Cashout. An instant
    cashout is not worked out until the account carries a catch-up deposit covering the weekly deposit
    days that passed while the account was not active. How much of the unfinalized batch''s tips is held
    back depends on the shopper''s level and tip history: a shopper at Full-Service Shopper Gold level
    or above with no batch tip reduction in the last 6 months has none of those tips held back; a shopper
    at Full-Service Shopper Silver level or above with exactly one batch tip reduction in the last 6 months
    has half of them held back, rounded to the cent; any other shopper has all of them held back. The
    cashout fee depends on the shopper''s level and recent cashouts: a shopper at Full-Service Shopper
    Platinum or Diamond level with no instant cashout in the last 3 months pays no fee; a shopper at Full-Service
    Shopper Gold level with no instant cashout in the last 3 months pays half the plan''s instant cashout
    fee, rounded to the cent; any other shopper pays the plan''s instant cashout fee. A returned-transfer
    reserve is kept back: an account with two or more returned-transfer entries in the last 12 months
    keeps back 40.00, an account with exactly one keeps back 20.00, and an account with none keeps back
    nothing. A debit buffer is kept back: an account with 3 or more earnings debits in the last 3 months
    keeps back 15.00, an account with 1 or 2 keeps back 7.50, and an account with none keeps back nothing.
    A cashout conduct hold is kept back: a shopper carrying 6 or more active violation points keeps back
    20.00, a shopper carrying 1 to 5 keeps back 8.00, and a shopper carrying none keeps back nothing.
    A new-destination hold is kept back: where the destination was replaced fewer than 30 days ago (counted
    in calendar days from the moment of the replacement, or from the opening date when it was never replaced)
    and the account was verified 12 or more whole months ago, 10 percent of the balance is kept back,
    rounded to the cent; where the destination was replaced fewer than 30 days ago and the account was
    verified fewer than 12 whole months ago, a fixed 50.00 is kept back; otherwise nothing is kept back.
    The amount sent is the balance less the tips held back, less the returned-transfer reserve, less the
    debit buffer, less the cashout conduct hold, less the new-destination hold and less the fee, then
    limited to the plan''s per-transaction maximum and to the rest of the plan''s daily maximum, never
    below zero, and rounded to the cent only on that final figure. "The last N months" counts the entries
    booked fewer than N whole months before the day of the cashout. Shopper levels rank upward in the
    order Shop-Only Shopper, Full-Service Shopper, Full-Service Shopper Silver, Full-Service Shopper Gold,
    Full-Service Shopper Platinum and Full-Service Shopper Diamond, and a level named with "or above"
