      Gold level with 24 or more batch base-pay entries in the last 3 months has the limit multiplied
      by 1.25; any other shopper keeps the limit as stated.
    drawn: The amount drawn is the smaller of the amount still to re-send and the scaled limit, the scaled
      limit being rounded to the cent.
    returns_12m: an account with two or more returned-transfer entries in the last 12 months
    setoff: an account with two or more returned-transfer entries in the last 12 months sets off the largest
      earnings debit ever booked on the account; an account with exactly one returned-transfer entry in
      the last 12 months whose shopper is below Full-Service Shopper Diamond level sets off the most recently
      booked earnings debit; any other account sets off nothing.
    reversals_12m: a shopper with two or more batch pay reversals in the last 12 months keeps back 20.00
    clawback_reserve: a shopper with two or more batch pay reversals in the last 12 months keeps back
      20.00, a shopper with exactly one keeps back 10.00, and a shopper with none keeps back nothing.
    viol_points: a shopper carrying 6 or more active violation points keeps back 25.00
    conduct_hold: a shopper carrying 6 or more active violation points keeps back 25.00, a shopper carrying
      1 to 5 active violation points keeps back 10.00, and a shopper carrying none keeps back nothing.
    result: The re-send is the amount drawn less the set-off, less the clawback reserve, less the conduct
      hold, never below zero, with the final figure rounded to the cent; whatever is not re-sent stays
      on the balance.
    lvl_rank: Shopper levels rank upward in the order Shop-Only Shopper, Full-Service Shopper, Full-Service
      Shopper Silver, Full-Service Shopper Gold, Full-Service Shopper Platinum and Full-Service Shopper
      Diamond, and a level named with "or above" or "or below" is read in that order.
    largest_debit: an account with two or more returned-transfer entries in the last 12 months sets off
      the largest earnings debit ever booked on the account
    latest_debit: sets off the most recently booked earnings debit
  factors:
  - id: new_destination_resend_limit
    effect: parameter
    decides: dest_limit
    bindings:
    - dest_days
    - ver_months
    - dest_limit
    ladder:
    - when: destination replaced fewer than 30 days ago AND account verified fewer than 12 whole months
        ago
      value: K('limit_recent_verification') = 100.00
    - when: destination replaced fewer than 30 days ago AND account verified 12 or more whole months ago
      value: K('limit_established') = 150.00
    - when: otherwise
      value: the whole amount still to re-send
    baseline:
      dest_limit: outstanding
    evidence:
    - date
    cross_difficulty: null
  - id: resend_limit_standing_multiplier
    effect: parameter
    decides: limit_mult
    bindings:
    - base_pays_3m
    - limit_mult
    ladder:
    - when: shopper level Full-Service Shopper Platinum or Diamond AND 36 or more batch base-pay entries
        in the last 3 months
      value: K('mult_top_level') = 1.5
    - when: shopper level Full-Service Shopper Gold AND 24 or more batch base-pay entries in the last
        3 months
      value: K('mult_gold_level') = 1.25
    - when: otherwise
      value: 1 (the limit as stated)
    baseline:
      limit_mult: '1'
    evidence:
    - cross_category
    - history
    cross_difficulty: batch
  - id: resend_debit_setoff_choice
    effect: method
    decides: setoff
    bindings:
    - returns_12m
    - largest_debit
    - latest_debit
    - setoff
    ladder:
    - when: two or more returned-transfer entries in the last 12 months
      method: the largest earnings debit ever booked on the account is set off
    - when: exactly one returned-transfer entry in the last 12 months AND shopper below Full-Service Shopper
        Diamond level
      method: the most recently booked earnings debit is set off
    - when: otherwise
      method: nothing is set off
    baseline:
      setoff: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: resend_clawback_reserve
    effect: parameter
    decides: clawback_reserve
    bindings:
    - reversals_12m
    - clawback_reserve
    ladder:
    - when: two or more batch pay reversals in the last 12 months
      value: K('clawback_reserve_two') = 20.00
    - when: exactly one batch pay reversal in the last 12 months
      value: K('clawback_reserve_one') = 10.00
    - when: otherwise
      value: '0.00'
    baseline:
      clawback_reserve: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: batch
  - id: resend_conduct_hold
    effect: parameter
    decides: conduct_hold
    bindings:
    - viol_points
    - conduct_hold
    ladder:
    - when: 6 or more active violation points
      value: K('conduct_hold_high') = 25.00
    - when: 1 to 5 active violation points
      value: K('conduct_hold_low') = 10.00
    - when: otherwise
      value: '0.00'
    baseline:
      conduct_hold: '0'
    evidence:
    - cross_category
    cross_difficulty: shopper
  inputs:
    history:
