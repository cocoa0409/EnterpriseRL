- id: payout_ext_statement_cashback
  base_policy_refs:
  - payout_evt_cashback
  overwrite:
  - base_policy: payout_evt_cashback
    superseded_clause: A statement month's total cashback (payout_msr_cashback_month) is capped at cashback_monthly_cap_usd,
      applied to categories in the order cashback_cap_order (fuel, ev_charging, auto_maintenance).
    replaced_by: 'The statement cap depends on the shopper''s level and recent work: a shopper at Full-Service
      Shopper Diamond level with 20 or more batch base-pay entries in the last month is paid under 1.5
      times the monthly cashback cap of the card plan; a shopper at Full-Service Shopper Platinum level
      with 15 or more batch base-pay entries in the last month is paid under 1.25 times that cap; any
      other shopper is paid under the monthly cashback cap of the card plan; a raised cap is rounded to
      the cent.'
  trigger: state_due
  subject:
  - payout_cashback_paid
  computes: amount_usd
  target_tool: pay_statement_cashback_5d281cc6
  params:
    diamond_batches_1m: 20
    platinum_batches_1m: 15
    member_boost_premier: 1.1
    member_boost_other: 1.05
    late_days: 45
    late_share_top: 0.05
    late_fixed: 2.0
    tenure_kicker_long: 2.5
    tenure_kicker_mid: 1.0
    tenure_long_months: 48
    tenure_mid_months: 24
    long_haul_credit_high: 3.0
    long_haul_credit_low: 1.5
    long_haul_high: 6
    long_haul_low: 2
    statement_cap_mult_diamond: 1.5
    statement_cap_mult_platinum: 1.25
  rule: 'A statement payment pays onto the card the cashback earned and not yet paid for every statement
    month whose payment day has come, and it carries the latest such month. The card''s cashback still
    to be paid is the card cashback balance shown on the account: every cashback earning raises it, every
    cashback payment booked on the account, bonuses included, lowers it, it is cleared when the card''s
    cashback lapses, and it never falls below zero; where the balance shown is higher than the cashback
    earned less every cashback payment booked on the account, the lower figure is the balance. Whatever
    the cap leaves unpaid stays in that balance and falls due on the next payment day. A statement month''s
    earned entries are booked on the first day of the following month, and the month''s payment day is
    that month''s cashback payment day, so the latest month with earned entries is still waiting while
    fewer days than one less than the payment day have passed since its entries were booked. The statement
    payment takes the card cashback balance, leaves out the latest month''s earned cashback while that
    month is still waiting, caps what remains at the monthly cashback cap of the card plan, and pays it
    rounded to the cent. A statement payment is owed only when the cashback due, before any booster, make-good,
    kicker or credit, is at least the card plan''s minimum cashback payment; a smaller amount stays in
    the balance and no payment is made. A member booster applies to the cashback due before the cap: a
    shopper holding an active Cartwise+ Premier Annual or Cartwise+ Family Annual membership has it multiplied
    by 1.1, a shopper holding any other active Cartwise+ membership has it multiplied by 1.05, and a shopper
    with no active Cartwise+ membership has it unchanged; the boosted figure is rounded to the cent before
    the cap. The statement cap depends on the shopper''s level and recent work: a shopper at Full-Service
    Shopper Diamond level with 20 or more batch base-pay entries in the last month is paid under 1.5 times
    the monthly cashback cap of the card plan; a shopper at Full-Service Shopper Platinum level with 15
    or more batch base-pay entries in the last month is paid under 1.25 times that cap; any other shopper
    is paid under the monthly cashback cap of the card plan; a raised cap is rounded to the cent. A late
    make-good is added outside the cap when the previous cashback payment is long past, the days being
    counted from the account''s opening date when it has no earlier cashback payment: where the latest
    earlier cashback payment was made 45 or more days before and the shopper is at Full-Service Shopper
    Platinum or Diamond level, the make-good is 5 percent of the capped payment, rounded to the cent;
    where it was made 45 or more days before and the shopper is below Full-Service Shopper Platinum level,
    the make-good is a fixed 2.00; otherwise there is no make-good. A tenure kicker is added outside the
    cap: a shopper whose contractor account was first activated 48 or more whole months ago gets 2.50,
    one activated 24 to 47 whole months ago gets 1.00, and any other shopper gets nothing. A long-haul
    fuel credit is added outside the cap: a shopper with 6 or more batch long-distance pay entries in
    the last month gets 3.00, one with 2 to 5 gets 1.50, and any other shopper gets nothing. The statement
    payment is the capped cashback plus the make-good, the tenure kicker and the long-haul fuel credit,
    rounded to the cent only on that final figure. "The last N months" counts the entries booked fewer
    than N whole months before the day of the payment. Shopper levels rank upward in the order Shop-Only
    Shopper, Full-Service Shopper, Full-Service Shopper Silver, Full-Service Shopper Gold, Full-Service
    Shopper Platinum and Full-Service Shopper Diamond, and a level named with "or above" or "or below"
    is read in that order.'
  baseline:
    rule: 'A statement payment pays onto the card the cashback earned and not yet paid for every statement
      month whose payment day has come, and it carries the latest such month. The card''s cashback still
      to be paid is the card cashback balance shown on the account: every cashback earning raises it,
      every cashback payment booked on the account, bonuses included, lowers it, it is cleared when the
      card''s cashback lapses, and it never falls below zero; where the balance shown is higher than the
      cashback earned less every cashback payment booked on the account, the lower figure is the balance.
      Whatever the cap leaves unpaid stays in that balance and falls due on the next payment day. A statement
      month''s earned entries are booked on the first day of the following month, and the month''s payment
      day is that month''s cashback payment day, so the latest month with earned entries is still waiting
      while fewer days than one less than the payment day have passed since its entries were booked. The
      statement payment takes the card cashback balance, leaves out the latest month''s earned cashback
      while that month is still waiting, caps what remains at the monthly cashback cap of the card plan,
      and pays it rounded to the cent. A statement payment is owed only when the cashback due, before
      any booster, make-good, kicker or credit, is at least the card plan''s minimum cashback payment;
      a smaller amount stays in the balance and no payment is made.'
    params:
    - cashback_monthly_cap_usd
    - cashback_payment_day
    - cashback_min_payment_usd
  prerequisite: []
  cross_category:
  - category: shopper
    as: branch
    reads:
    - variant_name
    - activated_date
    note: The level decides the statement cap and the make-good method; the first activation date decides
      the tenure kicker.
  - category: batch
    as: history
    reads:
    - batch_events.event_type
    - batch_events.pay_component
    note: Base-pay entries in the last month decide the statement cap; long-distance pay entries decide
      the long-haul fuel credit.
  - category: membership
    as: branch
    reads:
    - variant_name
    - status
    note: The active Cartwise+ plan decides the member booster.
  compute:
  - lvl: CFIELD('shopper','variant_name')
  - lvl_rank: 6 if lvl == 'Full-Service Shopper Diamond' else (5 if lvl == 'Full-Service Shopper Platinum'
      else (4 if lvl == 'Full-Service Shopper Gold' else (3 if lvl == 'Full-Service Shopper Silver' else
      (2 if lvl == 'Full-Service Shopper' else 1))))
  - earned_all: SUM('payout_events','amount_usd', event_type='payout_cashback_earned')
  - paid_all: SUM('payout_events','amount_usd', event_type='payout_cashback_paid')
  - cash_bal: MX(0, MN(F('cashback_balance_usd'), RND(earned_all - paid_all, 2)))
  - latest_month: LATEST('payout_events','statement_month', event_type='payout_cashback_earned')
  - latest_booked: LATEST('payout_events','event_date', event_type='payout_cashback_earned')
  - latest_total: SUM('payout_events','amount_usd', event_type='payout_cashback_earned', statement_month=latest_month)
  - latest_waiting: DAYS(latest_booked, NOW) < P('cashback_payment_day') - 1
  - due_total: RND(MX(0, cash_bal - (latest_total if latest_waiting else 0)), 2)
  - owed: due_total >= P('cashback_min_payment_usd')
  - member_plan: CFIELD('membership','variant_name', status='active')
  - member_boost: K('member_boost_premier') if (member_plan == 'Cartwise+ Premier Annual' or member_plan
      == 'Cartwise+ Family Annual') else (K('member_boost_other') if member_plan else 1)
  - boosted: RND(due_total * member_boost, 2)
  - base_pays_1m: XCOUNT('batch','batch_events', within_months=1, event_type='batch_pay_posted', pay_component='batch_base')
  - statement_cap: RND(P('cashback_monthly_cap_usd') * K('statement_cap_mult_diamond'), 2) if (lvl_rank
      == 6 and base_pays_1m >= K('diamond_batches_1m')) else (RND(P('cashback_monthly_cap_usd') * K('statement_cap_mult_platinum'),
      2) if (lvl_rank == 5 and base_pays_1m >= K('platinum_batches_1m')) else P('cashback_monthly_cap_usd'))
  - capped: MN(boosted, statement_cap)
  - last_payment_days: DAYS(LATEST('payout_events','event_date', event_type='payout_cashback_paid') or
      F('opened_date'), NOW)
  - make_good: RND(capped * K('late_share_top'), 2) if (last_payment_days >= K('late_days') and lvl_rank
      >= 5) else (K('late_fixed') if (last_payment_days >= K('late_days') and lvl_rank < 5) else 0)
  - active_months: MONTHS(CFIELD('shopper','activated_date'), NOW)
  - tenure_kicker: K('tenure_kicker_long') if active_months >= K('tenure_long_months') else (K('tenure_kicker_mid')
      if active_months >= K('tenure_mid_months') else 0)
  - long_haul_1m: XCOUNT('batch','batch_events', within_months=1, event_type='batch_pay_posted', pay_component='long_distance')
  - long_haul_credit: K('long_haul_credit_high') if long_haul_1m >= K('long_haul_high') else (K('long_haul_credit_low')
      if long_haul_1m >= K('long_haul_low') else 0)
  - result: RND(capped + make_good + tenure_kicker + long_haul_credit, 2) if owed else 0
  compute_basis:
    lvl: a shopper at Full-Service Shopper Diamond level with 20 or more batch base-pay entries in the
      last month is paid under 1.5 times the monthly cashback cap of the card plan
    latest_month: leaves out the latest month's earned cashback while that month is still waiting
    latest_booked: A statement month's earned entries are booked on the first day of the following month
    latest_total: leaves out the latest month's earned cashback while that month is still waiting
    latest_waiting: so the latest month with earned entries is still waiting while fewer days than one
      less than the payment day have passed since its entries were booked.
    due_total: The statement payment takes the card cashback balance, leaves out the latest month's earned
      cashback while that month is still waiting
    member_plan: a shopper holding an active Cartwise+ Premier Annual or Cartwise+ Family Annual membership
      has it multiplied by 1.1
    member_boost: a shopper holding an active Cartwise+ Premier Annual or Cartwise+ Family Annual membership
      has it multiplied by 1.1, a shopper holding any other active Cartwise+ membership has it multiplied
      by 1.05, and a shopper with no active Cartwise+ membership has it unchanged
    boosted: the boosted figure is rounded to the cent before the cap.
    base_pays_1m: with 20 or more batch base-pay entries in the last month
    statement_cap: 'The statement cap depends on the shopper''s level and recent work: a shopper at Full-Service
      Shopper Diamond level with 20 or more batch base-pay entries in the last month is paid under 1.5
      times the monthly cashback cap of the card plan; a shopper at Full-Service Shopper Platinum level
      with 15 or more batch base-pay entries in the last month is paid under 1.25 times that cap; any
      other shopper is paid under the monthly cashback cap of the card plan; a raised cap is rounded to
      the cent.'
    capped: caps what remains at the monthly cashback cap of the card plan
    last_payment_days: 'the days being counted from the account''s opening date when it has no earlier
      cashback payment: where the latest earlier cashback payment was made 45 or more days before'
    make_good: where the latest earlier cashback payment was made 45 or more days before and the shopper
      is at Full-Service Shopper Platinum or Diamond level, the make-good is 5 percent of the capped payment,
      rounded to the cent; where it was made 45 or more days before and the shopper is below Full-Service
      Shopper Platinum level, the make-good is a fixed 2.00; otherwise there is no make-good.
    active_months: a shopper whose contractor account was first activated 48 or more whole months ago
      gets 2.50
    tenure_kicker: a shopper whose contractor account was first activated 48 or more whole months ago
      gets 2.50, one activated 24 to 47 whole months ago gets 1.00, and any other shopper gets nothing.
    long_haul_1m: a shopper with 6 or more batch long-distance pay entries in the last month gets 3.00
    long_haul_credit: a shopper with 6 or more batch long-distance pay entries in the last month gets
      3.00, one with 2 to 5 gets 1.50, and any other shopper gets nothing.
    result: The statement payment is the capped cashback plus the make-good, the tenure kicker and the
      long-haul fuel credit, rounded to the cent only on that final figure.
    lvl_rank: Shopper levels rank upward in the order Shop-Only Shopper, Full-Service Shopper, Full-Service
      Shopper Silver, Full-Service Shopper Gold, Full-Service Shopper Platinum and Full-Service Shopper
      Diamond, and a level named with "or above" or "or below" is read in that order.
    cash_bal: 'The card''s cashback still to be paid is the card cashback balance shown on the account:
      every cashback earning raises it, every cashback payment booked on the account, bonuses included,
      lowers it, it is cleared when the card''s cashback lapses, and it never falls below zero; where
      the balance shown is higher than the cashback earned less every cashback payment booked on the account,
      the lower figure is the balance.'
    owed: A statement payment is owed only when the cashback due, before any booster, make-good, kicker
      or credit, is at least the card plan's minimum cashback payment; a smaller amount stays in the balance
      and no payment is made.
    earned_all: where the balance shown is higher than the cashback earned less every cashback payment
      booked on the account, the lower figure is the balance.
    paid_all: where the balance shown is higher than the cashback earned less every cashback payment booked
      on the account, the lower figure is the balance.
  factors:
