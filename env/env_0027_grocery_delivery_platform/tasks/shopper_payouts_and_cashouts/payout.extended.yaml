# Product charter: Cartwise Shopper Payouts (category key: payout).
category: payout
display_name: Cartwise Shopper Payouts
binding:
  holding_table: payout_accounts
  event_tables: [payout_events]
  intake_tables: [payout_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {available_balance_usd: earnings_balance, cashback_balance_usd: cashback}
lifecycle:
  states: [pending_verification, active, frozen, closed]
  transitions:
  - {from: pending_verification, to: active, by: system, means: The payout destination is verified and payouts can
      flow.}
  - {from: pending_verification, to: closed, by: system, means: The payout destination could not be verified and
      the setup closes.}
  - from: active
    to: frozen
    by: system
    means: >-
      Payouts are stopped because a transfer came back or the balance went too far negative or a fraud review opened.
  - {from: frozen, to: active, by: agent, means: The freeze cause is resolved and payouts resume.}
  - {from: active, to: closed, by: user, means: The shopper closes the payout account and the balance is paid out.}
  - {from: frozen, to: closed, by: system, means: A freeze review ends in closure and the balance is settled.}
accounts:
- key: earnings_balance
  unit: USD
  meaning: >-
    Earnings the shopper has not yet been paid out; batch credits and returned transfers book in while debits and
    deposits and cashouts and fees book out.
- key: cashback
  unit: USD
  meaning: >-
    Everyday Pay Card cashback earned and not yet paid onto the card; monthly earnings book in while monthly payments
    book out.
parameter_schema:
  payout_destination: Enum bank_account|external_debit_card|cartwise_card — where money is sent.
  min_shopper_level: Official shopper level name — the lowest shopper level that may hold this plan.
  instant_cashout_available: Boolean — whether on-demand cashouts are offered.
  instant_cashout_fee_usd: USD — fee per instant cashout.
  instant_cashouts_per_day: Integer — instant cashouts allowed per calendar day (0 = none).
  instant_cashout_min_usd: USD — smallest instant cashout.
  instant_cashout_max_per_transaction_usd: USD — largest single instant cashout.
  instant_cashout_daily_max_usd: USD — total instant cashouts per calendar day.
  cashout_fee_on_top: >-
    Boolean — whether the cashout fee is taken from the balance on top of the amount sent rather than deducted from
    it.
  instant_arrival_minutes: Integer minutes — promised arrival time of an instant cashout.
  new_account_cashout_hold_days: Integer calendar days after verification before the first instant cashout.
  destination_change_cooldown_hours: Integer hours after a destination change during which instant cashouts are
    blocked.
  tips_cashout_after_finalization: Boolean — whether tip credits become cashable only once their batch is finalized.
  weekly_deposit_weekday: >-
    Enum — weekday the weekly deposit is sent for the earnings period ending the previous weekly_pay_cutoff.
  weekly_deposit_min_usd: USD — balances below this carry over to the next week.
  weekly_deposit_arrival_business_days: Integer business days — arrival time of the weekly deposit.
  fee_refund_if_failed: Boolean — whether a cashout fee is refunded when the cashout is returned or fails.
  fee_refund_if_late_business_days: >-
    Integer business days — a cashout arriving later than this after its date has its fee refunded (0 = not applicable).
  negative_balance_limit_usd: >-
    USD — how far the balance may go below zero (from tip reductions or reversals after payout) before the account
    is frozen.
  negative_balance_recovery: Enum offset_next_earnings — how a negative balance is recovered.
  transfer_return_freezes: >-
    Boolean — whether a returned deposit or cashout freezes the account until the destination is replaced.
  freeze_review_business_days: Integer business days — target to resolve a fraud-review freeze.
  cashback_fuel_pct: Percent — cashback on card purchases at fuel stations.
  cashback_ev_charging_pct: Percent — cashback on card purchases at EV charging networks.
  cashback_auto_maintenance_pct: Percent — cashback on card purchases at auto repair and maintenance merchants.
  cashback_monthly_cap_usd: USD — maximum cashback earned per statement month.
  cashback_payment_day: >-
    Integer — day of the following month on which a statement month's cashback is paid onto the card.
  cashback_min_payment_usd: USD — cashback below this carries to the next month.
  cashback_forfeit_on_close: Boolean — whether unpaid cashback lapses when the account closes.
  plan_changes_per_30d: Integer — plan changes allowed in a rolling 30 days.
  card_tier_follows_level: Boolean — whether the card plan moves with the shopper level at each level evaluation.
  closure_disbursement: Enum final_ach_deposit|final_card_load — how the balance is paid on closure.
  final_disbursement_business_days: Integer business days after closure within which the final balance is paid.
  closure_blocked_while_negative: Boolean — whether a negative balance must be recovered before closure.
  verification_method: Enum micro_deposits|card_push_test|card_activation — how the destination is verified.
  verification_window_days: Integer calendar days after opening within which verification must complete.
  earnings_credit_timing: Enum on_posting — when batch pay reaches the balance.
  weekly_sweep_applies: Boolean — whether any balance left at the weekly cutoff is swept to the destination.
  cashout_during_freeze: Boolean — whether any cashout is allowed while frozen.
  cashback_statement_basis: Enum settled_purchases — which card purchases count toward a statement month's cashback.
  cashback_reversal_on_refund: Boolean — whether cashback is reduced when a qualifying purchase is refunded.
  instant_fee_waiver_first_cashout: Boolean — whether the first instant cashout after verification is free.
  destination_changes_per_30d: Integer — destination changes allowed in a rolling 30 days.
  card_spend_required_for_cashback: Boolean — whether cashback requires the card to be the payment method at the
    merchant.
  negative_balance_offset_pct: Percent of each new credit applied to recover a negative balance.
  returned_transfer_resend: >-
    Boolean — whether a returned deposit or cashout amount is sent again in the next weekly sweep once a new destination
    is on file.
  cashback_cap_order: List — order in which categories fill the monthly cashback cap.
  business_day_calendar: Enum — calendar for business-day counts.
