events:
- type: payout_account_opened
  target: payout_accounts
  mutation: create
  meaning: A shopper sets up a payout plan and destination.
  grain: one row per payout account
  fields: {customer_id: the shopper's profile, shopper_account_id: the shopper's contractor account, variant_name: official
      payout plan, opened_date: setup date, destination_last4: last four digits of the bank account or card}
  triggers: []
- type: payout_account_verified
  target: payout_accounts
  mutation:
    transition: {from: pending_verification, to: active}
  meaning: The destination is verified.
  grain: one row per transaction
  fields: {verified_date: verification date}
  triggers: []
- type: payout_verification_failed
  target: payout_accounts
  mutation:
    transition: {from: pending_verification, to: closed}
  meaning: Verification does not complete within its window.
  grain: one row per transaction
  fields: {closed_date: closure date, closure_reason: verification_failed}
  triggers: []
- type: payout_account_frozen
  target: payout_accounts
  mutation:
    transition: {from: active, to: frozen}
  meaning: Payouts stop pending resolution of a freeze cause.
  grain: one row per transaction
  fields: {frozen_date: date frozen, freeze_reason: controlled cause}
  triggers: []
- type: payout_account_unfrozen
  target: payout_accounts
  mutation:
    transition: {from: frozen, to: active}
  meaning: The freeze cause is resolved and payouts resume.
  grain: one row per transaction
  fields: {frozen_date: cleared to empty, freeze_reason: cleared to empty}
  triggers: []
- type: payout_account_closed
  target: payout_accounts
  mutation:
    transition:
    - {from: active, to: closed}
    - {from: frozen, to: closed}
  meaning: The payout account ends and the remaining balance is disbursed.
  grain: one row per transaction
  fields: {closed_date: closure date, closure_reason: controlled cause}
  triggers: []
- type: payout_plan_changed
  target: payout_accounts
  mutation: update
  meaning: The account moves to another payout plan.
  grain: one row per transaction
  fields: {variant_name: new official plan name, plan_changed_date: date of change}
  triggers: []
- type: payout_destination_changed
  target: payout_accounts
  mutation: update
  meaning: A new bank account or debit card replaces the destination on file.
  grain: one row per transaction
  fields: {destination_last4: last four digits of the new destination, destination_changed_at: time of the change}
  triggers: []
- type: payout_earnings_credited
  target: payout_events
  meaning: One batch earnings row reaches the payout balance.
  grain: one row per batch earnings row
  distinguish_by: [batch_event_id]
  fields: {batch_id: the batch, batch_event_id: the batch earnings row credited, amount_usd: amount credited (positive),
    event_date: credit date}
  account: earnings_balance
  direction: in
  triggers: []
- type: payout_earnings_debited
  target: payout_events
  meaning: One batch tip reduction or pay reversal is taken from the payout balance.
  grain: one row per batch debit row
  distinguish_by: [batch_event_id]
  fields: {batch_id: the batch, batch_event_id: the batch row debited, amount_usd: amount debited (positive), event_date: debit
      date}
  account: earnings_balance
  direction: out
  triggers: []
- type: payout_weekly_deposit
  target: payout_events
  meaning: The weekly sweep sends the balance to the destination.
  grain: one row per weekly earnings period
  distinguish_by: [payout_period_end]
  fields: {payout_period_end: last day of the swept earnings period, amount_usd: amount sent (positive), event_date: send
      date}
  account: earnings_balance
  direction: out
  triggers: []
- type: payout_instant_cashout
  target: payout_events
  meaning: The shopper cashes out part or all of the balance on demand.
  grain: one row per cashout
  distinguish_by: [event_date, cashout_number]
  fields: {cashout_number: sequence of this cashout within its calendar day, amount_usd: amount sent (positive),
    event_date: cashout date}
  account: earnings_balance
  direction: out
  triggers:
  - event: payout:payout_cashout_fee_charged
    map: {source_event_id: payout_event_id}
- type: payout_cashout_fee_charged
  target: payout_events
  meaning: The fee for one instant cashout is taken from the balance.
  grain: one row per cashout
  distinguish_by: [source_event_id]
  fields: {source_event_id: the payout_instant_cashout row the fee belongs to, amount_usd: fee (positive; 0.00 when
      the plan charges none), event_date: fee date}
  account: earnings_balance
  direction: out
  triggers: []
- type: payout_transfer_returned
  target: payout_events
  meaning: >-
    A deposit or cashout is sent back by the receiving bank or card and returns to the balance.
  grain: one row per returned transfer
  distinguish_by: [source_event_id]
  fields: {source_event_id: the payout_weekly_deposit or payout_instant_cashout row returned, amount_usd: amount
      returned (positive), event_date: return date}
  account: earnings_balance
  direction: in
  triggers:
  - event: payout:payout_account_frozen
    map: {freeze_reason: transfer_returned}
- type: payout_fee_refunded
  target: payout_events
  meaning: A cashout fee is given back.
  grain: one row per refunded fee
  distinguish_by: [source_event_id]
  fields: {source_event_id: the payout_cashout_fee_charged row refunded, refund_reason: controlled reason, amount_usd: amount
      refunded (positive), event_date: refund date}
  account: earnings_balance
  direction: in
  triggers: []
- type: payout_cashback_earned
  target: payout_events
  meaning: Cashback for one statement month and merchant category is earned on card purchases.
  grain: one row per statement month per merchant category
  distinguish_by: [statement_month, merchant_category]
  fields: {statement_month: the statement month, merchant_category: controlled category, amount_usd: cashback earned
      (positive), event_date: date computed}
  account: cashback
  direction: in
  triggers: []
- type: payout_cashback_paid
  target: payout_events
  meaning: A statement month's cashback is paid onto the card.
  grain: one row per statement month
  distinguish_by: [statement_month]
  fields: {statement_month: the statement month paid, amount_usd: cashback paid (positive), event_date: payment
      date}
  account: cashback
  direction: out
  triggers: []
measures:
- {id: payout_msr_cashouts_today, window: the calendar day of frozen_time, measure: count and sum of amount_usd
    of payout_instant_cashout rows on the account dated that day}
- id: payout_msr_cashable_balance
  window: current state at frozen_time
  measure: >-
    available_balance_usd minus the tip credits whose batch is not yet finalized, when tips_cashout_after_finalization
    is true
- {id: payout_msr_cashback_month, window: one statement month, measure: sum of amount_usd of payout_cashback_earned
    rows for that statement_month}
- id: payout_msr_plan_changes_30d
  window: rolling 30 calendar days ending on frozen_time
  measure: >-
    count of payout_requests rows on the account with request_type change_plan and request_status confirmed whose
    created_at falls in the window
- id: payout_msr_destination_changes_30d
  window: rolling 30 calendar days ending on frozen_time
  measure: >-
    count of payout_requests rows on the account with request_type change_destination and request_status confirmed
    whose created_at falls in the window
policies:
- id: payout_agg_multi_holding
  subject: [payout_account_opened]
  rule: >
    A shopper holds one payout account; moving between plans is a plan change on that account, never a second account.
    A new payout account can be opened only when the shopper has no payout account that is not closed.
  eligibility:
  - id: one_payout_account
    applies_to: [payout_account_opened]
    kind: dedup
    condition: >-
      A new payout account can be opened only when the shopper has no payout account that is not closed.
    evidence_fields: [payout_accounts.shopper_account_id, payout_accounts.status]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [payout_accounts.shopper_account_id]
      action_bindings: {payout_accounts.shopper_account_id: shopper_account_id}
    dedup_contract:
      table: payout_accounts
      mode: separate_record
      object_bindings: {shopper_account_id: shopper_account_id}
      duplicate_filters:
        status: [pending_verification, active, frozen]
      distinct_fields: []
  params: {max_per_customer: 1}
- id: payout_plan_eligibility
  subject: [payout_account_opened, payout_account_verified, payout_verification_failed, payout_plan_changed]
  rule: >
    A plan is open to a shopper whose contractor account is active and whose shopper level is at least the plan's
    min_shopper_level on the shopper ladder. Verification uses the plan's verification_method and must complete
    within the verification window counted from the opening date. The verification window is counted in calendar
    days with opened_date as day 0, and the last day to verify is opened_date plus verification_window_days, inclusive.
    Setups still unverified after that close with reason verification_failed. A plan change is allowed only while
    the account is active, at most plan_changes_per_30d times as counted by payout_msr_plan_changes_30d, and only
    to a plan whose min_shopper_level the shopper meets. Card plans with card_tier_follows_level true move to the
    card plan matching the shopper's new level on each level evaluation.
  eligibility:
  - id: verify_in_window
    applies_to: [payout_account_verified]
    kind: time
    condition: >-
      Verification uses the plan's verification_method and must complete within the verification window counted
      from the opening date.
    evidence_fields: [payout_accounts.opened_date, payout_accounts.payout_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [payout_accounts.payout_account_id]
      action_bindings: {payout_accounts.payout_account_id: payout_account_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: the opening date
      anchor_source: payout_accounts.opened_date
      relation: not_after
      duration_source: variants.verification_window_days
      unit: calendar_days
      counting_rule: >-
        The verification window is counted in calendar days with opened_date as day 0, and the last day to verify
        is opened_date plus verification_window_days, inclusive.
      boundary: inclusive
  - id: change_while_active
    applies_to: [payout_plan_changed]
    kind: state
    condition: >-
      A plan change is allowed only while the account is active, at most plan_changes_per_30d times as counted by
      payout_msr_plan_changes_30d, and only to a plan whose min_shopper_level the shopper meets.
    evidence_fields: [payout_accounts.status, payout_accounts.payout_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [payout_accounts.payout_account_id]
      action_bindings: {payout_accounts.payout_account_id: payout_account_id}
    state_contract:
      field: payout_accounts.status
      allowed: [active]
  params:
    per_tier:
      Weekly Direct Deposit: {min_shopper_level: =min_shopper_level, verification_window_days: =verification_window_days}
      Instant Cashout: {min_shopper_level: =min_shopper_level, verification_window_days: =verification_window_days}
      Everyday Pay Card Blue: {min_shopper_level: =min_shopper_level, verification_window_days: =verification_window_days}
      Everyday Pay Card Gold: {min_shopper_level: =min_shopper_level, verification_window_days: =verification_window_days}
      Everyday Pay Card Platinum: {min_shopper_level: =min_shopper_level, verification_window_days: =verification_window_days}
      Everyday Pay Card Diamond: {min_shopper_level: =min_shopper_level, verification_window_days: =verification_window_days}
  measures: [payout_msr_plan_changes_30d]
- id: payout_evt_earnings_ledger
  subject: [payout_earnings_credited, payout_earnings_debited]
  rule: >
    Every batch pay, tip, tip increase and adjustment row is credited to the payout balance once, and every batch
    tip reduction and pay reversal row is debited once, each keyed by its batch_event_id and for the same amount.
    Credits and debits flow in every account status, including frozen, because they record earnings rather than
    move money. A debit may take the balance below zero; a negative balance is recovered by offsetting the next
    credits (negative_balance_recovery), applying negative_balance_offset_pct of each new credit. Where tips_cashout_after_finalization
    is true, tip credits count toward the cashable balance (payout_msr_cashable_balance) only once their batch is
    finalized. Each batch earnings row reaches the balance exactly once. Credits reach the balance on posting because
    earnings_credit_timing is on_posting.
  eligibility:
  - id: once_per_batch_row
    applies_to: [payout_earnings_credited, payout_earnings_debited]
    kind: dedup
    condition: Each batch earnings row reaches the balance exactly once.
    evidence_fields: [payout_events.batch_event_id, payout_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [payout_events.batch_event_id]
      action_bindings: {payout_events.batch_event_id: batch_event_id}
    dedup_contract:
      table: payout_events
      mode: separate_record
      object_bindings: {batch_event_id: batch_event_id}
      duplicate_filters:
        event_type: [payout_earnings_credited, payout_earnings_debited]
      distinct_fields: []
  measures: [payout_msr_cashable_balance]
- id: payout_evt_instant_cashout
  subject: [payout_instant_cashout, payout_cashout_fee_charged]
  rule: >
    Instant cashouts are available only on plans with instant_cashout_available true and only while the account
    is active; cashout_during_freeze is false for every plan. A cashout must be at least instant_cashout_min_usd,
    at most instant_cashout_max_per_transaction_usd and at most payout_msr_cashable_balance; the day's cashouts
    may not exceed instant_cashouts_per_day in number or instant_cashout_daily_max_usd in total as counted by payout_msr_cashouts_today,
    where the day is the calendar day of the cashout. The first instant cashout is allowed only after the new-account
    hold counted from verification. The hold is counted in calendar days with verified_date as day 0, and the first
    cashout is allowed from verified_date plus new_account_cashout_hold_days, inclusive. Cashouts are also blocked
    for destination_change_cooldown_hours elapsed hours after destination_changed_at. Each cashout carries a fee
    row of instant_cashout_fee_usd (0.00 on plans without a fee, and 0.00 for the first cashout after verification
    where instant_fee_waiver_first_cashout is true), taken from the balance in addition to the amount sent. The
    fee is taken on top of the amount sent because cashout_fee_on_top is true, and a cashout is promised to arrive
    within instant_arrival_minutes.
  eligibility:
  - id: cashout_active
    applies_to: [payout_instant_cashout]
    kind: state
    condition: >-
      Instant cashouts are available only on plans with instant_cashout_available true and only while the account
      is active; cashout_during_freeze is false for every plan.
    evidence_fields: [payout_accounts.status, payout_accounts.variant_name, payout_accounts.payout_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [payout_accounts.payout_account_id]
      action_bindings: {payout_accounts.payout_account_id: payout_account_id}
    state_contract:
      field: payout_accounts.status
      allowed: [active]
  - id: new_account_hold
    applies_to: [payout_instant_cashout]
    kind: time
    condition: >-
      The first instant cashout is allowed only after the new-account hold counted from verification.
    evidence_fields: [payout_accounts.verified_date, payout_accounts.payout_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [payout_accounts.payout_account_id]
      action_bindings: {payout_accounts.payout_account_id: payout_account_id}
    temporal_basis:
      clock: frozen_time
      anchor_event: verification
      anchor_source: payout_accounts.verified_date
      relation: not_before
      duration_source: variants.new_account_cashout_hold_days
      unit: calendar_days
      counting_rule: >-
        The hold is counted in calendar days with verified_date as day 0, and the first cashout is allowed from
        verified_date plus new_account_cashout_hold_days, inclusive.
      boundary: inclusive
  params:
    per_tier:
      Weekly Direct Deposit: {instant_cashout_fee_usd: =instant_cashout_fee_usd, instant_cashouts_per_day: =instant_cashouts_per_day,
        instant_cashout_daily_max_usd: =instant_cashout_daily_max_usd}
      Instant Cashout: {instant_cashout_fee_usd: =instant_cashout_fee_usd, instant_cashouts_per_day: =instant_cashouts_per_day,
        instant_cashout_daily_max_usd: =instant_cashout_daily_max_usd}
      Everyday Pay Card Blue: {instant_cashout_fee_usd: =instant_cashout_fee_usd, instant_cashouts_per_day: =instant_cashouts_per_day,
        instant_cashout_daily_max_usd: =instant_cashout_daily_max_usd}
      Everyday Pay Card Gold: {instant_cashout_fee_usd: =instant_cashout_fee_usd, instant_cashouts_per_day: =instant_cashouts_per_day,
        instant_cashout_daily_max_usd: =instant_cashout_daily_max_usd}
      Everyday Pay Card Platinum: {instant_cashout_fee_usd: =instant_cashout_fee_usd, instant_cashouts_per_day: =instant_cashouts_per_day,
        instant_cashout_daily_max_usd: =instant_cashout_daily_max_usd}
      Everyday Pay Card Diamond: {instant_cashout_fee_usd: =instant_cashout_fee_usd, instant_cashouts_per_day: =instant_cashouts_per_day,
        instant_cashout_daily_max_usd: =instant_cashout_daily_max_usd}
  measures: [payout_msr_cashouts_today, payout_msr_cashable_balance]
- id: payout_evt_weekly_deposit
  subject: [payout_weekly_deposit]
  rule: >
    Every plan sweeps the balance weekly: on weekly_deposit_weekday, the balance earned up to the previous weekly
    pay cutoff (batch charter) is sent to the destination as one deposit for that earnings period, provided it is
    at least weekly_deposit_min_usd; smaller or negative balances carry over. A deposit is sent only while the account
    is active, and each earnings period is swept once. Tips whose batch is not yet finalized stay behind for the
    next sweep where tips_cashout_after_finalization is true. Arrival follows weekly_deposit_arrival_business_days.
    The sweep runs for every plan because weekly_sweep_applies is true.
  eligibility:
  - id: sweep_active
    applies_to: [payout_weekly_deposit]
    kind: state
    condition: >-
      A deposit is sent only while the account is active, and each earnings period is swept once.
    evidence_fields: [payout_accounts.status, payout_accounts.payout_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [payout_accounts.payout_account_id]
      action_bindings: {payout_accounts.payout_account_id: payout_account_id}
    state_contract:
      field: payout_accounts.status
      allowed: [active]
  params:
    per_tier:
      Weekly Direct Deposit: {weekly_deposit_arrival_business_days: =weekly_deposit_arrival_business_days}
      Instant Cashout: {weekly_deposit_arrival_business_days: =weekly_deposit_arrival_business_days}
      Everyday Pay Card Blue: {weekly_deposit_arrival_business_days: =weekly_deposit_arrival_business_days}
      Everyday Pay Card Gold: {weekly_deposit_arrival_business_days: =weekly_deposit_arrival_business_days}
      Everyday Pay Card Platinum: {weekly_deposit_arrival_business_days: =weekly_deposit_arrival_business_days}
      Everyday Pay Card Diamond: {weekly_deposit_arrival_business_days: =weekly_deposit_arrival_business_days}
- id: payout_evt_fee_refund
  subject: [payout_fee_refunded]
  rule: >
    A cashout fee is refunded in full, and never in part, with refund_reason cashout_returned when its cashout came
    back as a payout_transfer_returned row and fee_refund_if_failed is true, or with refund_reason late_arrival
    when fee_refund_if_late_business_days is above 0 and the cashout arrived later than that many business days
    after its date (business_day_calendar us_federal_weekdays, Monday to Friday excluding US federal holidays).
    A fee of 0.00 is never refunded. Each fee row is refunded at most once.
  eligibility:
  - id: refund_fee_once
    applies_to: [payout_fee_refunded]
    kind: dedup
    condition: Each fee row is refunded at most once.
    evidence_fields: [payout_events.source_event_id, payout_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [payout_events.source_event_id]
      action_bindings: {payout_events.source_event_id: source_event_id}
    dedup_contract:
      table: payout_events
      mode: separate_record
      object_bindings: {source_event_id: source_event_id}
      duplicate_filters:
        event_type: [payout_fee_refunded]
      distinct_fields: []
  params:
    per_tier:
      Weekly Direct Deposit: {fee_refund_if_failed: =fee_refund_if_failed, fee_refund_if_late_business_days: =fee_refund_if_late_business_days}
      Instant Cashout: {fee_refund_if_failed: =fee_refund_if_failed, fee_refund_if_late_business_days: =fee_refund_if_late_business_days}
      Everyday Pay Card Blue: {fee_refund_if_failed: =fee_refund_if_failed, fee_refund_if_late_business_days: =fee_refund_if_late_business_days}
      Everyday Pay Card Gold: {fee_refund_if_failed: =fee_refund_if_failed, fee_refund_if_late_business_days: =fee_refund_if_late_business_days}
      Everyday Pay Card Platinum: {fee_refund_if_failed: =fee_refund_if_failed, fee_refund_if_late_business_days: =fee_refund_if_late_business_days}
      Everyday Pay Card Diamond: {fee_refund_if_failed: =fee_refund_if_failed, fee_refund_if_late_business_days: =fee_refund_if_late_business_days}
- id: payout_evt_freezes
  subject: [payout_account_frozen, payout_account_unfrozen, payout_transfer_returned, payout_destination_changed]
  rule: >
    A returned deposit or cashout is credited back to the balance and, where transfer_return_freezes is true, freezes
    the account with freeze_reason transfer_returned. A balance more negative than negative_balance_limit_usd freezes
    the account with freeze_reason negative_balance, and a fraud review freezes it with freeze_reason fraud_review.
    A freeze is lifted by the agent only when its cause is resolved on the records. transfer_returned is resolved
    once a new destination has been recorded after frozen_date; negative_balance once the balance is at or above
    minus negative_balance_limit_usd; fraud_review only by the review team. A destination change is allowed at most
    destination_changes_per_30d times as counted by payout_msr_destination_changes_30d, is made only on the shopper's
    confirmed change_destination request, and starts the destination_change_cooldown_hours cashout block. A fraud_review
    freeze is targeted for decision within freeze_review_business_days. A returned amount is sent again in the next
    weekly sweep once a new destination is on file where returned_transfer_resend is true.
  eligibility:
  - id: lift_frozen_only
    applies_to: [payout_account_unfrozen]
    kind: state
    condition: A freeze is lifted by the agent only when its cause is resolved on the records.
    evidence_fields: [payout_accounts.status, payout_accounts.freeze_reason, payout_accounts.payout_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [payout_accounts.payout_account_id]
      action_bindings: {payout_accounts.payout_account_id: payout_account_id}
    state_contract:
      field: payout_accounts.status
      allowed: [frozen, active]
  params:
    per_tier:
      Weekly Direct Deposit: {negative_balance_limit_usd: =negative_balance_limit_usd, destination_changes_per_30d: =destination_changes_per_30d}
      Instant Cashout: {negative_balance_limit_usd: =negative_balance_limit_usd, destination_changes_per_30d: =destination_changes_per_30d}
      Everyday Pay Card Blue: {negative_balance_limit_usd: =negative_balance_limit_usd, destination_changes_per_30d: =destination_changes_per_30d}
      Everyday Pay Card Gold: {negative_balance_limit_usd: =negative_balance_limit_usd, destination_changes_per_30d: =destination_changes_per_30d}
      Everyday Pay Card Platinum: {negative_balance_limit_usd: =negative_balance_limit_usd, destination_changes_per_30d: =destination_changes_per_30d}
      Everyday Pay Card Diamond: {negative_balance_limit_usd: =negative_balance_limit_usd, destination_changes_per_30d: =destination_changes_per_30d}
  measures: [payout_msr_destination_changes_30d]
- id: payout_evt_cashback
  subject: [payout_cashback_earned, payout_cashback_paid]
  rule: >
    Card plans earn cashback on settled card purchases (cashback_statement_basis) at cashback_fuel_pct at fuel stations,
    cashback_ev_charging_pct at EV charging networks and cashback_auto_maintenance_pct at auto repair and maintenance
    merchants, each computed per statement month and merchant category and rounded to the cent. A statement month's
    total cashback (payout_msr_cashback_month) is capped at cashback_monthly_cap_usd, applied to categories in the
    order cashback_cap_order (fuel, ev_charging, auto_maintenance). A refunded qualifying purchase reduces that
    month's cashback where cashback_reversal_on_refund is true. The month's cashback is paid onto the card on cashback_payment_day
    of the following month when it is at least cashback_min_payment_usd; smaller amounts carry over. Each statement
    month is paid once, and only while the account is active; unpaid cashback lapses on closure where cashback_forfeit_on_close
    is true. Only purchases paid with the Everyday Pay Card count where card_spend_required_for_cashback is true.
  eligibility:
  - id: pay_month_once
    applies_to: [payout_cashback_paid]
    kind: dedup
    condition: >-
      Each statement month is paid once, and only while the account is active; unpaid cashback lapses on closure
      where cashback_forfeit_on_close is true.
    evidence_fields: [payout_events.statement_month, payout_events.event_type]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [payout_events.statement_month]
      action_bindings: {payout_events.statement_month: statement_month}
    dedup_contract:
      table: payout_events
      mode: separate_record
      object_bindings: {statement_month: statement_month}
      duplicate_filters:
        event_type: [payout_cashback_paid]
      distinct_fields: []
  params:
    per_tier:
      Weekly Direct Deposit: {cashback_fuel_pct: =cashback_fuel_pct, cashback_monthly_cap_usd: =cashback_monthly_cap_usd}
      Instant Cashout: {cashback_fuel_pct: =cashback_fuel_pct, cashback_monthly_cap_usd: =cashback_monthly_cap_usd}
      Everyday Pay Card Blue: {cashback_fuel_pct: =cashback_fuel_pct, cashback_monthly_cap_usd: =cashback_monthly_cap_usd}
      Everyday Pay Card Gold: {cashback_fuel_pct: =cashback_fuel_pct, cashback_monthly_cap_usd: =cashback_monthly_cap_usd}
      Everyday Pay Card Platinum: {cashback_fuel_pct: =cashback_fuel_pct, cashback_monthly_cap_usd: =cashback_monthly_cap_usd}
      Everyday Pay Card Diamond: {cashback_fuel_pct: =cashback_fuel_pct, cashback_monthly_cap_usd: =cashback_monthly_cap_usd}
  measures: [payout_msr_cashback_month]
- id: payout_evt_closure
  subject: [payout_account_closed]
  rule: >
    Only the shopper can close an active payout account; the agent registers the request and the shopper confirms
    it. Where closure_blocked_while_negative is true, an account with a negative balance cannot be closed until
    the balance is recovered. On closure the remaining balance is paid by closure_disbursement within final_disbursement_business_days,
    and unpaid cashback lapses where cashback_forfeit_on_close is true. A frozen account is closed only by the review
    team (closure_reason freeze_review_closure).
  eligibility:
  - id: not_negative
    applies_to: [payout_account_closed]
    kind: authorization
    condition: >-
      Where closure_blocked_while_negative is true, an account with a negative balance cannot be closed until the
      balance is recovered.
    evidence_fields: [payout_accounts.available_balance_usd, payout_accounts.payout_account_id]
    evidence_contract:
      authority: system_record
      timing: pre_action
      correlation_keys:
      - [payout_accounts.payout_account_id]
      action_bindings: {payout_accounts.payout_account_id: payout_account_id}
  params:
    per_tier:
      Weekly Direct Deposit: {closure_disbursement: =closure_disbursement}
      Instant Cashout: {closure_disbursement: =closure_disbursement}
      Everyday Pay Card Blue: {closure_disbursement: =closure_disbursement}
      Everyday Pay Card Gold: {closure_disbursement: =closure_disbursement}
      Everyday Pay Card Platinum: {closure_disbursement: =closure_disbursement}
      Everyday Pay Card Diamond: {closure_disbursement: =closure_disbursement}

extended_policies:
- id: payout_ext_returned_resend
  base_policy_refs:
  - payout_evt_weekly_deposit
  - payout_evt_freezes
  overwrite:
  - base_policy: payout_evt_freezes
    superseded_clause: A returned amount is sent again in the next weekly sweep once a new destination
      is on file where returned_transfer_resend is true.
    replaced_by: Once a new destination is on file after a transfer came back and the account is active
      again, the returned amount is sent again at once as its own re-send deposit, which points to the
      returned-transfer entry it answers, instead of waiting for the next weekly sweep.
  trigger: state_due
  subject:
  - payout_weekly_deposit
  - payout_transfer_returned
  computes: resend_usd
  target_tool: resend_returned_transfer_f902fe69
  params:
    dest_window_days: 30
    established_months: 12
    limit_recent_verification: 100.0
    limit_established: 150.0
    mult_top_level: 1.5
    mult_gold_level: 1.25
    top_batches_3m: 36
    gold_batches_3m: 24
    clawback_reserve_two: 20.0
    clawback_reserve_one: 10.0
    conduct_hold_high: 25.0
    conduct_hold_low: 10.0
    conduct_high_points: 6
  rule: 'Once a new destination is on file after a transfer came back and the account is active again,
    the returned amount is sent again at once as its own re-send deposit, which points to the returned-transfer
    entry it answers, instead of waiting for the next weekly sweep. The re-send answers the latest returned-transfer
    entry on the account, and the amount still to re-send is that entry''s amount less every re-send deposit
    already pointing to it. The re-send is that amount still to re-send, sent in full to the destination
    now on file, with nothing set off or kept back, rounded to the cent. The re-send limit for a recently
    replaced destination depends on how recently the destination was replaced and how long ago the account
    was verified: where the destination was replaced fewer than 30 days ago (counted in calendar days
    from the moment of the replacement, or from the opening date when it was never replaced) and the account
    was verified fewer than 12 whole months ago, the re-send draws on at most 100.00; where the destination
    was replaced fewer than 30 days ago and the account was verified 12 or more whole months ago, it draws
    on at most 150.00; otherwise the re-send draws on the whole amount still to re-send. The re-send limit
    is scaled by the shopper''s standing: a shopper at Full-Service Shopper Platinum or Diamond level
    with 36 or more batch base-pay entries in the last 3 months has the limit multiplied by 1.5; a shopper
    at Full-Service Shopper Gold level with 24 or more batch base-pay entries in the last 3 months has
    the limit multiplied by 1.25; any other shopper keeps the limit as stated. The amount drawn is the
    smaller of the amount still to re-send and the scaled limit, the scaled limit being rounded to the
    cent. From the amount drawn, one earnings debit booked on the account is set off first, and which
    debit is chosen depends on the return history: an account with two or more returned-transfer entries
    in the last 12 months sets off the largest earnings debit ever booked on the account; an account with
    exactly one returned-transfer entry in the last 12 months whose shopper is below Full-Service Shopper
    Diamond level sets off the most recently booked earnings debit; any other account sets off nothing.
    A clawback reserve is then kept back: a shopper with two or more batch pay reversals in the last 12
    months keeps back 20.00, a shopper with exactly one keeps back 10.00, and a shopper with none keeps
    back nothing. A conduct hold is then kept back: a shopper carrying 6 or more active violation points
    keeps back 25.00, a shopper carrying 1 to 5 active violation points keeps back 10.00, and a shopper
    carrying none keeps back nothing. The re-send is the amount drawn less the set-off, less the clawback
    reserve, less the conduct hold, never below zero, with the final figure rounded to the cent; whatever
    is not re-sent stays on the balance. "The last N months" counts the entries booked fewer than N whole
    months before the day of the re-send. Shopper levels rank upward in the order Shop-Only Shopper, Full-Service
    Shopper, Full-Service Shopper Silver, Full-Service Shopper Gold, Full-Service Shopper Platinum and
    Full-Service Shopper Diamond, and a level named with "or above" or "or below" is read in that order.'
  baseline:
    rule: The re-send answers the latest returned-transfer entry on the account, and the amount still
      to re-send is that entry's amount less every re-send deposit already pointing to it. The re-send
      is that amount still to re-send, sent in full to the destination now on file, with nothing set off
      or kept back, rounded to the cent.
    params: []
  prerequisite: []
  cross_category:
  - category: shopper
    as: branch
    reads:
    - variant_name
    - violation_points_balance
    note: The shopper level decides the limit multiplier and the set-off window; the active violation
      points decide the conduct hold.
  - category: batch
    as: history
    reads:
    - batch_events.event_type
    - batch_events.pay_component
    note: Batch base-pay entries in the last 3 months decide the limit multiplier; batch pay reversals
      in the last 12 months decide the clawback reserve.
  compute:
  - lvl: CFIELD('shopper','variant_name')
  - lvl_rank: 6 if lvl == 'Full-Service Shopper Diamond' else (5 if lvl == 'Full-Service Shopper Platinum'
      else (4 if lvl == 'Full-Service Shopper Gold' else (3 if lvl == 'Full-Service Shopper Silver' else
      (2 if lvl == 'Full-Service Shopper' else 1))))
  - ret_amt: LATEST('payout_events','amount_usd', event_type='payout_transfer_returned')
  - ret_id: LATEST('payout_events','payout_event_id', event_type='payout_transfer_returned')
  - resent: SUM('payout_events','amount_usd', event_type='payout_weekly_deposit', source_event_id=ret_id)
  - outstanding: RND(ret_amt - resent, 2)
  - dest_days: DAYS(F('destination_changed_at') or F('opened_date'), NOW)
  - ver_months: MONTHS(F('verified_date'), NOW)
  - dest_limit: K('limit_recent_verification') if (dest_days < K('dest_window_days') and ver_months <
      K('established_months')) else (K('limit_established') if (dest_days < K('dest_window_days') and
      ver_months >= K('established_months')) else outstanding)
  - base_pays_3m: XCOUNT('batch','batch_events', within_months=3, event_type='batch_pay_posted', pay_component='batch_base')
  - limit_mult: K('mult_top_level') if (lvl_rank >= 5 and base_pays_3m >= K('top_batches_3m')) else (K('mult_gold_level')
      if (lvl_rank == 4 and base_pays_3m >= K('gold_batches_3m')) else 1)
  - drawn: MN(outstanding, RND(dest_limit * limit_mult, 2))
  - returns_12m: COUNT('payout_events', within_months=12, event_type='payout_transfer_returned')
  - largest_debit: MAX('payout_events','amount_usd', event_type='payout_earnings_debited')
  - latest_debit: LATEST('payout_events','amount_usd', event_type='payout_earnings_debited') or 0
  - setoff: largest_debit if returns_12m >= 2 else (latest_debit if (returns_12m == 1 and lvl_rank <=
      5) else 0)
  - reversals_12m: XCOUNT('batch','batch_events', within_months=12, event_type='batch_pay_reversed')
  - clawback_reserve: K('clawback_reserve_two') if reversals_12m >= 2 else (K('clawback_reserve_one')
      if reversals_12m == 1 else 0)
  - viol_points: CFIELD('shopper','violation_points_balance') or 0
  - conduct_hold: K('conduct_hold_high') if viol_points >= K('conduct_high_points') else (K('conduct_hold_low')
      if viol_points >= 1 else 0)
  - result: RND(MX(0, drawn - setoff - clawback_reserve - conduct_hold), 2)
  compute_basis:
    lvl: a shopper at Full-Service Shopper Platinum or Diamond level with 36 or more batch base-pay entries
      in the last 3 months has the limit multiplied by 1.5
    ret_amt: The re-send answers the latest returned-transfer entry on the account
    ret_id: The re-send answers the latest returned-transfer entry on the account
    resent: the amount still to re-send is that entry's amount less every re-send deposit already pointing
      to it
    outstanding: the amount still to re-send is that entry's amount less every re-send deposit already
