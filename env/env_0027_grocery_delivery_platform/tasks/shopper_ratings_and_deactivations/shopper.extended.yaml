    as: branch
    reads: [batches.wait_minutes, batches.estimated_miles, batches.actual_miles, batches.order_count, wait_free_minutes]
    note: The disputed violation's batch record gives the waiting minutes, the free waiting minutes of its type, the
      estimated and driven miles and the order count behind the store-wait, detour and multi-order tiers.
  compute:
  - lt_entry: "LATEST('shopper_events', 'shopper_event_id', event_type='shopper_violation_recorded', violation_type='late_delivery')"
  - lt_recorded: "LATEST('shopper_events', 'points', event_type='shopper_violation_recorded', shopper_event_id=lt_entry)"
  - lt_batch: "LATEST('shopper_events', 'batch_id', event_type='shopper_violation_recorded', shopper_event_id=lt_entry)"
  - lt_wait_minutes: "CFIELD('batch', 'wait_minutes', batch_id=lt_batch)"
  - lt_free_minutes: "CPARAM('batch', 'wait_free_minutes', batch_id=lt_batch)"
  - lt_wait_credit: "K('late_wait_long_credit') if lt_wait_minutes - lt_free_minutes >= K('late_wait_long_minutes') else (K('late_wait_short_credit') if lt_wait_minutes - lt_free_minutes >= K('late_wait_short_minutes') else 0)"
  - lt_driven: "CFIELD('batch', 'actual_miles', batch_id=lt_batch)"
  - lt_estimated: "CFIELD('batch', 'estimated_miles', batch_id=lt_batch)"
  - lt_detour_credit: "K('late_detour_long_credit') if lt_driven >= K('late_detour_long_ratio') * lt_estimated else (K('late_detour_short_credit') if lt_driven >= K('late_detour_short_ratio') * lt_estimated else 0)"
  - lt_orders: "CFIELD('batch', 'order_count', batch_id=lt_batch)"
  - lt_adjusted: "(lt_wait_credit + lt_detour_credit) * 2 if lt_orders >= 3 else ((lt_wait_credit + lt_detour_credit) + (lt_wait_credit + lt_detour_credit + 1) // 2 if lt_orders == 2 else lt_wait_credit + lt_detour_credit)"
  - store_delay_exclusions: "COUNT('shopper_events', event_type='shopper_rating_excluded', exclusion_reason='store_delay', batch_id=lt_batch)"
  - store_delay_credit: "K('store_delay_many_credit') if store_delay_exclusions >= K('store_delay_many') else (K('store_delay_one_credit') if store_delay_exclusions == 1 else 0)"
  - lateness_credit: "lt_adjusted + store_delay_credit"
  - result: "lt_recorded if lateness_credit >= K('late_excusal_mark') else 0"
  compute_basis:
    lt_entry: "A late-delivery dispute that stands submitted concerns the account's most recent late-delivery violation"
    lt_recorded: "the decision removes all of the points the violation was recorded with"
    lt_batch: "is decided by the agent on the record of that violation's batch"
    lt_wait_minutes: "The store-wait credit follows the waiting minutes recorded on the disputed violation's batch beyond the free waiting minutes of that batch type (wait_free_minutes in the batch charter)"
    lt_free_minutes: "The store-wait credit follows the waiting minutes recorded on the disputed violation's batch beyond the free waiting minutes of that batch type (wait_free_minutes in the batch charter)"
    lt_wait_credit: "an excess of late_wait_long_minutes or more gives late_wait_long_credit; an excess from late_wait_short_minutes up to one minute short of late_wait_long_minutes gives late_wait_short_credit; a smaller excess gives no credit."
    lt_driven: "The detour credit compares the GPS miles driven on that batch with the estimated route miles on its offer"
    lt_estimated: "The detour credit compares the GPS miles driven on that batch with the estimated route miles on its offer"
    lt_detour_credit: "driven miles of late_detour_long_ratio times the estimate or more give late_detour_long_credit; from late_detour_short_ratio times the estimate up to but not including late_detour_long_ratio times it give late_detour_short_credit; less gives no credit."
    lt_orders: "that sum is then adjusted by the orders the batch carried"
    lt_adjusted: "The store-wait credit and the detour credit are added, and that sum is then adjusted by the orders the batch carried: on a batch of three or more orders it is doubled; on a batch of two orders it is increased by half of itself, the half rounded up to a whole point; on a single-order batch it is used as it stands."
    store_delay_exclusions: "The store-delay credit counts the rating exclusions granted on that batch for the reason store_delay"
    store_delay_credit: "store_delay_many or more give store_delay_many_credit; exactly one gives store_delay_one_credit; none gives no credit."
    lateness_credit: "The lateness credit is the order-adjusted sum plus the store-delay credit"
    result: "when the lateness credit reaches late_excusal_mark, the decision removes all of the points the violation was recorded with; when it falls short, it removes none."
  factors:
  - id: lateness_store_wait_credit
    effect: parameter
    decides: lt_wait_credit
    bindings: [lt_batch, lt_wait_minutes, lt_free_minutes, lt_wait_credit]
    ladder:
    - when: the batch's waiting minutes exceed its type's free waiting minutes by late_wait_long_minutes or more
      value: "K('late_wait_long_credit')"
    - when: they exceed them by late_wait_short_minutes up to one minute short of late_wait_long_minutes
      value: "K('late_wait_short_credit')"
    - when: otherwise
      value: "0"
