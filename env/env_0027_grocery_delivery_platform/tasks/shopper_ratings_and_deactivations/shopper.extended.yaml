extended_policies:
- id: shopper_ext_dropped_batch_severity
  base_policy_refs: [shopper_evt_violations]
  overwrite:
  - base_policy: shopper_evt_violations
    superseded_clause: >-
      A substantiated violation adds the points set for its type (points_late_delivery, points_missing_items_verified,
      points_batch_dropped, points_wrong_address, points_conduct_complaint, points_alcohol_procedure).
    replaced_by: >-
      A dropped-batch violation is booked with its dropped-batch severity points, which are the level's
      points_batch_dropped plus the adjusted stage surcharge plus the track-record surcharge plus the holding surcharge
      plus the stranded-items surcharge, less the volume relief, and never below zero.
  - base_policy: shopper_evt_violations
    superseded_clause: >-
      Only one violation of a type is recorded per order.
    replaced_by: >-
      Only one dropped-batch violation is booked per dropped batch.
  trigger: state_due
  subject: [shopper_violation_recorded]
  computes: points
  target_tool: record_dropped_batch_violation_61b8c422
  params:
    stage_multi_order_points: 2
    stage_single_order_points: 1
    track_many_violations: 3
    track_some_violations: 1
    track_many_points: 2
    track_some_points: 1
    holding_long_days: 2
    holding_long_points: 2
    holding_short_points: 1
    stranded_many_units: 60
    stranded_some_units: 30
    stranded_many_points: 2
    stranded_some_points: 1
    volume_high_batches: 10
    volume_mid_batches: 5
    volume_high_relief: 3
    volume_mid_relief: 1
  rule: >
    Every batch a shopper drops after accepting it with the drop reason shopper_choice, the shopper's own choice, owes
    one dropped-batch violation, booked on the account with the batch it concerns; a batch dropped for a reason the batch
    charter excuses (store_closed, app_outage, vehicle_breakdown, personal_safety) or for any reason other than
    shopper_choice owes no dropped-batch violation. A dropped-batch violation is booked with its dropped-batch severity
    points, which are the level's points_batch_dropped plus the adjusted stage surcharge plus the track-record surcharge
    plus the holding surcharge plus the stranded-items surcharge, less the volume relief, and never below zero. The
    standard dropped-batch severity is the level's points_batch_dropped, with no stage surcharge, the stage surcharge used
    as it stands whatever the batch type, no track-record surcharge, no holding surcharge, no stranded-items surcharge and
    no volume relief. The stage surcharge follows how far the batch had gone and how many customers it held: when
    shopping had started on the batch and the batch carried two or more orders the stage surcharge is
    stage_multi_order_points; when shopping had started and the batch carried a single order it is
    stage_single_order_points; when shopping had not started there is no stage surcharge. The stage surcharge is then
    adjusted by the batch type: on an Express 30 Batch it is doubled; on a Stock-Up Batch it is increased by half of
    itself, the half rounded up to a whole point; on any other batch type it is used as it stands. The track-record
    surcharge counts the violations recorded on the account less than one whole month before the day the dropped-batch
    violation is booked: more than track_many_violations of them add track_many_points; from track_some_violations up to
    track_many_violations of them add track_some_points; none add nothing. The holding surcharge counts the calendar days
    from the day the batch was accepted to the day it was dropped: holding_long_days or more days add
    holding_long_points; exactly one day adds holding_short_points; a batch dropped on the day it was accepted adds
    nothing. The stranded-items surcharge follows the item units the dropped batch carried, the groceries left to be
    re-offered: stranded_many_units or more add stranded_many_points; from stranded_some_units up to one fewer than
    stranded_many_units add stranded_some_points; fewer add nothing. The volume relief counts the batches for which the
    shopper was paid base pay less than one whole month before the day the violation is booked: volume_high_batches or
    more earn volume_high_relief; from volume_mid_batches up to one fewer than volume_high_batches earn
    volume_mid_relief; fewer earn no relief. The level's points_batch_dropped, the adjusted stage surcharge, the
    track-record surcharge, the holding surcharge and the stranded-items surcharge are added, the volume relief is
    subtracted from that sum once, and a negative figure is booked as zero points. Only one dropped-batch violation is
    booked per dropped batch.
  prerequisite: []
  cross_category:
  - category: batch
    as: history
    reads: [batches.drop_reason, batches.shopping_started_at, batches.order_count, batches.variant_name, batches.accepted_at,
      batches.dropped_date, batches.item_count, batch_events.pay_component]
    note: The owed batch is the shopper_choice drop; its record gives the stage, batch-type, holding and stranded-items
      tiers, and the shopper's base-pay rows in the batch ledger give the volume relief.
  compute:
  - type_points: "P('points_batch_dropped')"
  - started_at: "CFIELD('batch', 'shopping_started_at', status='dropped', drop_reason='shopper_choice')"
  - drop_orders: "CFIELD('batch', 'order_count', status='dropped', drop_reason='shopper_choice')"
  - stage_surcharge: "K('stage_multi_order_points') if (started_at and drop_orders >= 2) else (K('stage_single_order_points') if (started_at and drop_orders < 2) else 0)"
  - batch_kind: "CFIELD('batch', 'variant_name', status='dropped', drop_reason='shopper_choice')"
  - adjusted_stage: "stage_surcharge * 2 if batch_kind == 'Express 30 Batch' else (stage_surcharge + (stage_surcharge + 1) // 2 if batch_kind == 'Stock-Up Batch' else stage_surcharge)"
  - recent_violations: "COUNT('shopper_events', within_months=1, event_type='shopper_violation_recorded')"
  - track_surcharge: "K('track_many_points') if recent_violations > K('track_many_violations') else (K('track_some_points') if recent_violations >= K('track_some_violations') else 0)"
  - accepted_at: "CFIELD('batch', 'accepted_at', status='dropped', drop_reason='shopper_choice')"
  - dropped_on: "CFIELD('batch', 'dropped_date', status='dropped', drop_reason='shopper_choice')"
  - held_days: "DAYS(accepted_at, dropped_on)"
  - holding_surcharge: "K('holding_long_points') if held_days >= K('holding_long_days') else (K('holding_short_points') if held_days == 1 else 0)"
  - stranded_units: "CFIELD('batch', 'item_count', status='dropped', drop_reason='shopper_choice')"
  - stranded_surcharge: "K('stranded_many_points') if stranded_units >= K('stranded_many_units') else (K('stranded_some_points') if stranded_units >= K('stranded_some_units') else 0)"
  - paid_batches: "XCOUNT('batch', 'batch_events', within_months=1, event_type='batch_pay_posted', pay_component='batch_base')"
  - volume_relief: "K('volume_high_relief') if paid_batches >= K('volume_high_batches') else (K('volume_mid_relief') if paid_batches >= K('volume_mid_batches') else 0)"
  - result: "MX(0, type_points + adjusted_stage + track_surcharge + holding_surcharge + stranded_surcharge - volume_relief)"
  compute_basis:
    type_points: "The standard dropped-batch severity is the level's points_batch_dropped"
    started_at: "Every batch a shopper drops after accepting it with the drop reason shopper_choice, the shopper's own choice, owes one dropped-batch violation, booked on the account with the batch it concerns"
    drop_orders: "The stage surcharge follows how far the batch had gone and how many customers it held"
    stage_surcharge: "when shopping had started on the batch and the batch carried two or more orders the stage surcharge is stage_multi_order_points; when shopping had started and the batch carried a single order it is stage_single_order_points; when shopping had not started there is no stage surcharge."
    batch_kind: "The stage surcharge is then adjusted by the batch type"
    adjusted_stage: "on an Express 30 Batch it is doubled; on a Stock-Up Batch it is increased by half of itself, the half rounded up to a whole point; on any other batch type it is used as it stands."
    recent_violations: "The track-record surcharge counts the violations recorded on the account less than one whole month before the day the dropped-batch violation is booked"
    track_surcharge: "more than track_many_violations of them add track_many_points; from track_some_violations up to track_many_violations of them add track_some_points; none add nothing."
    accepted_at: "The holding surcharge counts the calendar days from the day the batch was accepted to the day it was dropped"
    dropped_on: "The holding surcharge counts the calendar days from the day the batch was accepted to the day it was dropped"
    held_days: "The holding surcharge counts the calendar days from the day the batch was accepted to the day it was dropped"
    holding_surcharge: "holding_long_days or more days add holding_long_points; exactly one day adds holding_short_points; a batch dropped on the day it was accepted adds nothing."
    stranded_units: "The stranded-items surcharge follows the item units the dropped batch carried, the groceries left to be re-offered"
    stranded_surcharge: "stranded_many_units or more add stranded_many_points; from stranded_some_units up to one fewer than stranded_many_units add stranded_some_points; fewer add nothing."
    paid_batches: "The volume relief counts the batches for which the shopper was paid base pay less than one whole month before the day the violation is booked"
    volume_relief: "volume_high_batches or more earn volume_high_relief; from volume_mid_batches up to one fewer than volume_high_batches earn volume_mid_relief; fewer earn no relief."
    result: "The level's points_batch_dropped, the adjusted stage surcharge, the track-record surcharge, the holding surcharge and the stranded-items surcharge are added, the volume relief is subtracted from that sum once, and a negative figure is booked as zero points."
  factors:
  - id: stage_surcharge
    effect: parameter
    decides: stage_surcharge
    bindings: [started_at, drop_orders, stage_surcharge]
    ladder:
    - when: shopping had started on the batch and the batch carried two or more orders
      value: "K('stage_multi_order_points')"
    - when: shopping had started on the batch and the batch carried a single order
      value: "K('stage_single_order_points')"
    - when: otherwise (shopping had not started)
      value: "0"
    baseline:
      stage_surcharge: "0"
    evidence: [cross_category]
    cross_difficulty: batch
  - id: stage_by_batch_type
    effect: method
    decides: adjusted_stage
    bindings: [batch_kind, adjusted_stage]
    ladder:
    - when: the dropped batch is an Express 30 Batch
      method: the stage surcharge is doubled
    - when: the dropped batch is a Stock-Up Batch
      method: the stage surcharge is increased by half of itself, the half rounded up to a whole point
    - when: otherwise
      method: the stage surcharge is used as it stands
    baseline:
      adjusted_stage: "stage_surcharge"
    evidence: [cross_category]
    cross_difficulty: batch
  - id: track_record_surcharge
    effect: parameter
    decides: track_surcharge
    bindings: [recent_violations, track_surcharge]
    ladder:
    - when: more than track_many_violations violations recorded less than one whole month back
      value: "K('track_many_points')"
    - when: from track_some_violations up to track_many_violations violations recorded less than one whole month back
      value: "K('track_some_points')"
    - when: otherwise (none)
      value: "0"
    baseline:
      track_surcharge: "0"
    evidence: [history]
    cross_difficulty: null
  - id: holding_surcharge
    effect: parameter
    decides: holding_surcharge
    bindings: [accepted_at, dropped_on, held_days, holding_surcharge]
    ladder:
    - when: holding_long_days or more calendar days from acceptance to drop
      value: "K('holding_long_points')"
    - when: exactly one calendar day from acceptance to drop
      value: "K('holding_short_points')"
    - when: otherwise (dropped on the day it was accepted)
      value: "0"
    baseline:
      holding_surcharge: "0"
    evidence: [date, cross_category]
    cross_difficulty: batch
  - id: stranded_items_surcharge
    effect: parameter
    decides: stranded_surcharge
    bindings: [stranded_units, stranded_surcharge]
    ladder:
    - when: stranded_many_units or more item units on the dropped batch
      value: "K('stranded_many_points')"
    - when: from stranded_some_units up to one fewer than stranded_many_units item units
      value: "K('stranded_some_points')"
    - when: otherwise
      value: "0"
    baseline:
      stranded_surcharge: "0"
    evidence: [cross_category]
    cross_difficulty: batch
  - id: volume_relief
    effect: parameter
    decides: volume_relief
    bindings: [paid_batches, volume_relief]
    ladder:
    - when: volume_high_batches or more batches paid base pay less than one whole month back
      value: "K('volume_high_relief')"
    - when: from volume_mid_batches up to one fewer than volume_high_batches such batches
      value: "K('volume_mid_relief')"
    - when: otherwise
      value: "0"
    baseline:
      volume_relief: "0"
    evidence: [cross_category, history]
    cross_difficulty: batch
  baseline:
    rule: >-
      A dropped-batch violation is booked with its dropped-batch severity points, which are the level's
      points_batch_dropped plus the adjusted stage surcharge plus the track-record surcharge plus the holding surcharge
      plus the stranded-items surcharge, less the volume relief, and never below zero. The standard dropped-batch severity
      is the level's points_batch_dropped, with no stage surcharge, the stage surcharge used as it stands whatever the
      batch type, no track-record surcharge, no holding surcharge, no stranded-items surcharge and no volume relief.
    params: [points_batch_dropped]
  inputs:
    history:
    - {table: shopper_events, aggregate: count, field: shopper_event_id, within_months: 1, filters: {event_type: shopper_violation_recorded}}
    - {category: batch, table: batch_events, aggregate: count, field: batch_event_id, within_months: 1, filters: {event_type: batch_pay_posted, pay_component: batch_base}}
    cross_category: [batch]
- id: shopper_ext_wrong_address_severity
  base_policy_refs: [shopper_evt_violations]
  overwrite:
  - base_policy: shopper_evt_violations
    superseded_clause: >-
      A substantiated violation adds the points set for its type (points_late_delivery, points_missing_items_verified,
      points_batch_dropped, points_wrong_address, points_conduct_complaint, points_alcohol_procedure).
    replaced_by: >-
      A wrong-address violation is booked with its wrong-address severity points, which are the batch-size points plus
      the clawback-size surcharge plus the wrong-address track surcharge plus the customer-harm surcharge plus the
      repeat-address surcharge, less the tenure relief, and never below zero.
  - base_policy: shopper_evt_violations
    superseded_clause: >-
      Only one violation of a type is recorded per order.
    replaced_by: >-
      Only one wrong-address violation is booked per pay reversal.
  trigger: state_due
  subject: [shopper_violation_recorded]
  computes: points
  target_tool: record_wrong_address_violation_db63d782
  params:
    clawback_large_usd: 5.0
    clawback_mid_usd: 2.5
    clawback_large_points: 2
    clawback_mid_points: 1
    track_three_month_many: 5
    track_three_month_some: 3
    track_three_month_many_points: 2
    track_three_month_some_points: 1
    harm_one_star_points: 2
    harm_low_star_points: 1
    tenure_long_days: 1095
    tenure_mid_days: 365
    tenure_long_relief: 2
    tenure_mid_relief: 1
    repeat_address_many: 2
    repeat_address_many_points: 2
    repeat_address_one_points: 1
  rule: >
    Every batch pay reversal booked because an order was verified as not delivered owes one wrong-address violation,
    booked on the account with the batch that carried the order. A wrong-address violation is booked with its
    wrong-address severity points, which are the batch-size points plus the clawback-size surcharge plus the
    wrong-address track surcharge plus the customer-harm surcharge plus the repeat-address surcharge, less the tenure
    relief, and never below zero. The standard wrong-address severity is the level's points_wrong_address as the
    batch-size points, with no clawback-size surcharge, no wrong-address track surcharge, no customer-harm surcharge, no
    repeat-address surcharge and no tenure relief. The points a wrong-address violation is booked with are fixed only
    after every batch the account dropped by its own choice carries its dropped-batch violation entry. The batch-size points follow the number of orders on the batch
    that carried the order: on a batch of three or more orders they are half of points_wrong_address, rounded down to a
    whole point; on a batch of two orders they are points_wrong_address less one point; on a single-order batch they are
    the full points_wrong_address. The clawback-size surcharge follows the batch pay taken back for that order:
    clawback_large_usd or more adds clawback_large_points; from clawback_mid_usd up to but not including
    clawback_large_usd adds clawback_mid_points; less adds nothing. The wrong-address track surcharge counts every
    violation recorded on the account less than three whole months before the day the wrong-address violation is
    booked: track_three_month_many or more add track_three_month_many_points; from track_three_month_some up to one
    fewer than track_three_month_many add track_three_month_some_points; fewer add nothing. The customer-harm surcharge
    follows the ratings given on that batch: when at least one of them is a 1-star rating it adds harm_one_star_points;
    when none is a 1-star rating and at least one is a 2-star or 3-star rating it adds harm_low_star_points; when the
    batch has no rating of 3 stars or fewer it adds nothing. The tenure relief counts the calendar
    days from the account's first activation date to the day the violation is booked: tenure_long_days or more earn
    tenure_long_relief; from tenure_mid_days up to one fewer than tenure_long_days earn tenure_mid_relief; fewer earn no
    relief. The repeat-address surcharge counts the other wrong-address violations recorded
    on the account less than twelve whole months before the day the wrong-address violation is booked:
    repeat_address_many or more add repeat_address_many_points; exactly one adds repeat_address_one_points; none adds
    nothing. The batch-size points and the four surcharges are added, the tenure relief is subtracted from that sum once,
    and a negative figure is booked as zero points. Only one wrong-address violation is booked per pay reversal.
  prerequisite:
  - problem: shopper_ext_dropped_batch_severity
    kind: value_input
    gate: recent_three_month_violations
    form: state
    policy_source: >-
      The points a wrong-address violation is booked with are fixed only after every batch the account dropped by its
      own choice carries its dropped-batch violation entry.
    condition: >-
      Every batch of the shopper whose status is dropped with drop_reason shopper_choice has a violation entry of type
      batch_dropped naming that batch on the shopper account.
    resolved_by: record_dropped_batch_violation_61b8c422
    effect: >-
      Booking the owed dropped-batch violation adds one violation recorded today, so the count of violations recorded
      less than three whole months back rises by one and the wrong-address track surcharge can move up a tier.
  cross_category:
  - category: batch
    as: history
    reads: [batch_events.batch_id, batch_events.amount_usd, batches.order_count]
    note: The clawback row in the batch ledger names the batch and sizes the clawback surcharge; the batch record gives the
      order count behind the batch-size points.
  compute:
  - wa_batch: "XLATEST('batch', 'batch_events', 'batch_id', event_type='batch_pay_reversed', reversal_reason='order_not_delivered_verified')"
  - wa_type_points: "P('points_wrong_address')"
  - wa_batch_orders: "CFIELD('batch', 'order_count', batch_id=wa_batch)"
  - batch_size_points: "wa_type_points // 2 if wa_batch_orders >= 3 else (wa_type_points - 1 if wa_batch_orders == 2 else wa_type_points)"
  - clawback_usd: "XLATEST('batch', 'batch_events', 'amount_usd', event_type='batch_pay_reversed', reversal_reason='order_not_delivered_verified')"
  - clawback_surcharge: "K('clawback_large_points') if clawback_usd >= K('clawback_large_usd') else (K('clawback_mid_points') if clawback_usd >= K('clawback_mid_usd') else 0)"
  - recent_three_month_violations: "COUNT('shopper_events', within_months=3, event_type='shopper_violation_recorded')"
  - wa_track_surcharge: "K('track_three_month_many_points') if recent_three_month_violations >= K('track_three_month_many') else (K('track_three_month_some_points') if recent_three_month_violations >= K('track_three_month_some') else 0)"
  - one_star_on_batch: "COUNT('shopper_events', event_type='shopper_rating_received', batch_id=wa_batch, rating=1)"
  - low_star_on_batch: "COUNT('shopper_events', event_type='shopper_rating_received', batch_id=wa_batch, rating=2) + COUNT('shopper_events', event_type='shopper_rating_received', batch_id=wa_batch, rating=3)"
  - harm_surcharge: "K('harm_one_star_points') if one_star_on_batch >= 1 else (K('harm_low_star_points') if low_star_on_batch >= 1 else 0)"
  - tenure_days: "DAYS(F('activated_date'), NOW)"
  - tenure_relief: "K('tenure_long_relief') if tenure_days >= K('tenure_long_days') else (K('tenure_mid_relief') if tenure_days >= K('tenure_mid_days') else 0)"
  - prior_wrong_address_violations: "COUNT('shopper_events', within_months=12, event_type='shopper_violation_recorded', violation_type='wrong_address')"
  - repeat_address_surcharge: "K('repeat_address_many_points') if prior_wrong_address_violations >= K('repeat_address_many') else (K('repeat_address_one_points') if prior_wrong_address_violations == 1 else 0)"
  - result: "MX(0, batch_size_points + clawback_surcharge + wa_track_surcharge + harm_surcharge + repeat_address_surcharge - tenure_relief)"
  compute_basis:
    wa_batch: "Every batch pay reversal booked because an order was verified as not delivered owes one wrong-address violation, booked on the account with the batch that carried the order."
    wa_type_points: "The standard wrong-address severity is the level's points_wrong_address as the batch-size points"
    wa_batch_orders: "The batch-size points follow the number of orders on the batch that carried the order"
    batch_size_points: "on a batch of three or more orders they are half of points_wrong_address, rounded down to a whole point; on a batch of two orders they are points_wrong_address less one point; on a single-order batch they are the full points_wrong_address."
    clawback_usd: "The clawback-size surcharge follows the batch pay taken back for that order"
    clawback_surcharge: "clawback_large_usd or more adds clawback_large_points; from clawback_mid_usd up to but not including clawback_large_usd adds clawback_mid_points; less adds nothing."
    recent_three_month_violations: "The wrong-address track surcharge counts every violation recorded on the account less than three whole months before the day the wrong-address violation is booked"
    wa_track_surcharge: "track_three_month_many or more add track_three_month_many_points; from track_three_month_some up to one fewer than track_three_month_many add track_three_month_some_points; fewer add nothing."
    one_star_on_batch: "The customer-harm surcharge follows the ratings given on that batch"
    low_star_on_batch: "The customer-harm surcharge follows the ratings given on that batch"
    harm_surcharge: "when at least one of them is a 1-star rating it adds harm_one_star_points; when none is a 1-star rating and at least one is a 2-star or 3-star rating it adds harm_low_star_points; when the batch has no rating of 3 stars or fewer it adds nothing."
    tenure_days: "The tenure relief counts the calendar days from the account's first activation date to the day the violation is booked"
    tenure_relief: "tenure_long_days or more earn tenure_long_relief; from tenure_mid_days up to one fewer than tenure_long_days earn tenure_mid_relief; fewer earn no relief."
    prior_wrong_address_violations: "The repeat-address surcharge counts the other wrong-address violations recorded on the account less than twelve whole months before the day the wrong-address violation is booked"
    repeat_address_surcharge: "repeat_address_many or more add repeat_address_many_points; exactly one adds repeat_address_one_points; none adds nothing."
    result: "The batch-size points and the four surcharges are added, the tenure relief is subtracted from that sum once, and a negative figure is booked as zero points."
  factors:
  - id: batch_size_points
    effect: method
    decides: batch_size_points
    bindings: [wa_batch, wa_type_points, wa_batch_orders, batch_size_points]
    ladder:
    - when: the order rode on a batch of three or more orders
      method: half of points_wrong_address, rounded down to a whole point
    - when: the order rode on a batch of two orders
      method: points_wrong_address less one point
    - when: otherwise (a single-order batch)
      method: the full points_wrong_address
    baseline:
      batch_size_points: "wa_type_points"
    evidence: [cross_category]
    cross_difficulty: batch
  - id: clawback_size_surcharge
    effect: parameter
    decides: clawback_surcharge
    bindings: [clawback_usd, clawback_surcharge]
    ladder:
    - when: clawback_large_usd or more of batch pay taken back for the order
      value: "K('clawback_large_points')"
    - when: from clawback_mid_usd up to but not including clawback_large_usd taken back
      value: "K('clawback_mid_points')"
    - when: otherwise
      value: "0"
    baseline:
      clawback_surcharge: "0"
    evidence: [cross_category, history]
    cross_difficulty: batch
  - id: wrong_address_track_surcharge
    effect: parameter
    decides: wa_track_surcharge
    bindings: [recent_three_month_violations, wa_track_surcharge]
    ladder:
    - when: track_three_month_many or more violations recorded less than three whole months back
      value: "K('track_three_month_many_points')"
    - when: from track_three_month_some up to one fewer than track_three_month_many such violations
      value: "K('track_three_month_some_points')"
    - when: otherwise
      value: "0"
    baseline:
      wa_track_surcharge: "0"
    evidence: [history]
    cross_difficulty: null
  - id: customer_harm_surcharge
    effect: parameter
    decides: harm_surcharge
    bindings: [one_star_on_batch, low_star_on_batch, harm_surcharge]
    ladder:
    - when: at least one rating on that batch is 1 star
      value: "K('harm_one_star_points')"
    - when: no rating on that batch is 1 star and at least one is 2 or 3 stars
      value: "K('harm_low_star_points')"
    - when: otherwise (no rating of 3 stars or fewer on that batch)
      value: "0"
    baseline:
      harm_surcharge: "0"
    evidence: [history]
    cross_difficulty: null
  - id: tenure_relief
    effect: parameter
    decides: tenure_relief
    bindings: [tenure_days, tenure_relief]
    ladder:
    - when: tenure_long_days or more calendar days since first activation
      value: "K('tenure_long_relief')"
    - when: from tenure_mid_days up to one fewer than tenure_long_days
      value: "K('tenure_mid_relief')"
    - when: otherwise
      value: "0"
    baseline:
      tenure_relief: "0"
    evidence: [date]
    cross_difficulty: null
  - id: repeat_address_surcharge
    effect: parameter
    decides: repeat_address_surcharge
    bindings: [prior_wrong_address_violations, repeat_address_surcharge]
    ladder:
    - when: repeat_address_many or more other wrong-address violations recorded less than twelve whole months back
      value: "K('repeat_address_many_points')"
    - when: exactly one other such violation
      value: "K('repeat_address_one_points')"
    - when: otherwise (none)
      value: "0"
    baseline:
      repeat_address_surcharge: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      A wrong-address violation is booked with its wrong-address severity points, which are the batch-size points plus
      the clawback-size surcharge plus the wrong-address track surcharge plus the customer-harm surcharge plus the
      repeat-address surcharge, less the tenure relief, and never below zero. The standard wrong-address severity is the level's
      points_wrong_address as the batch-size points, with no clawback-size surcharge, no wrong-address track surcharge,
      no customer-harm surcharge, no repeat-address surcharge and no tenure relief.
    params: [points_wrong_address]
  inputs:
    history:
    - {table: shopper_events, aggregate: count, field: shopper_event_id, within_months: 3, filters: {event_type: shopper_violation_recorded}}
    - {table: shopper_events, aggregate: count, field: rating, filters: {event_type: shopper_rating_received}}
    - {category: batch, table: batch_events, aggregate: latest, field: amount_usd, filters: {event_type: batch_pay_reversed, reversal_reason: order_not_delivered_verified}}
    cross_category: [batch]
- id: shopper_ext_missing_items_excusal
  base_policy_refs: [shopper_evt_violations]
  overwrite:
  - base_policy: shopper_evt_violations
    superseded_clause: >-
      and a missing_items_verified violation is cleared when the order has no order_item_refunded row with refund_reason
      missing
    replaced_by: >-
      A missing-items dispute that stands submitted is decided by the agent on the records of the disputed violation's
      batch, and the decision removes from that violation its missing-items excusal points, booked as one
      cleared entry with removal reason dispute_upheld.
  trigger: state_due
  subject: [shopper_violation_cleared]
  computes: points
  target_tool: decide_missing_items_dispute_36c35ef8
  params:
    size_large_units: 80
    size_mid_units: 40
    size_large_credit: 2
    size_mid_credit: 1
    feedback_five_star_credit: 2
    feedback_four_star_credit: 1
    repeat_many: 2
    repeat_many_reduction: 2
    repeat_one_reduction: 1
  rule: >
    A missing-items dispute that stands submitted is decided by the agent on the records of the disputed violation's
    batch, and the decision removes from that violation its missing-items excusal points, booked as one
    cleared entry with removal reason dispute_upheld. The missing-items excusal points are the missing-items excusal
    credit, capped at the points the disputed violation was recorded with. The standard missing-items excusal credit is
    the batch-size credit, used as it stands whatever the batch type, plus the feedback credit, less the repeat
    reduction, never below zero, where the standard batch-size credit, feedback credit and repeat reduction are each
    zero points. The batch-size credit follows the item units on the disputed violation's batch: size_large_units or
    more units give size_large_credit; from size_mid_units up to one fewer than size_large_units give size_mid_credit;
    fewer give no credit. The batch-size credit is then adjusted by the batch type: on a Stock-Up Batch it is doubled; on
    a Double Delivery Batch or a Triple Delivery Batch it is increased by half of itself, the half rounded up to a whole
    point; on any other batch type it is used as it stands. The feedback credit follows the most recent rating given on the
    disputed violation's batch: 5 stars give feedback_five_star_credit; 4 stars give feedback_four_star_credit; 3 stars or fewer, or
    no rating, give no credit. The repeat reduction counts the other missing-items violations recorded on the account
    less than three whole months before the decision, the disputed one not counted: repeat_many or more take off
    repeat_many_reduction; exactly one takes off repeat_one_reduction; none takes off nothing. The adjusted batch-size
    credit and the feedback credit are added, the repeat reduction is subtracted once, a negative figure counts as zero,
    and the result is then capped at the recorded points of the disputed violation. The dispute is marked upheld when the
    cleared entry is booked.
  prerequisite: []
  cross_category:
  - category: batch
    as: branch
    reads: [batches.item_count, batches.variant_name]
    note: The disputed violation's batch record gives the item units and the batch type behind the batch-size credit.
  compute:
  - disputed_entry: "LATEST('shopper_appeals', 'source_event_id', date_field='created_at', appeal_type='violation_dispute', appeal_status='submitted')"
  - disputed_recorded_points: "LATEST('shopper_events', 'points', event_type='shopper_violation_recorded', shopper_event_id=disputed_entry)"
  - disputed_batch: "LATEST('shopper_events', 'batch_id', event_type='shopper_violation_recorded', shopper_event_id=disputed_entry)"
  - disputed_units: "CFIELD('batch', 'item_count', batch_id=disputed_batch)"
  - size_credit: "K('size_large_credit') if disputed_units >= K('size_large_units') else (K('size_mid_credit') if disputed_units >= K('size_mid_units') else 0)"
  - disputed_batch_kind: "CFIELD('batch', 'variant_name', batch_id=disputed_batch)"
  - adjusted_size_credit: "size_credit * 2 if disputed_batch_kind == 'Stock-Up Batch' else (size_credit + (size_credit + 1) // 2 if (disputed_batch_kind == 'Double Delivery Batch' or disputed_batch_kind == 'Triple Delivery Batch') else size_credit)"
  - disputed_order_rating: "LATEST('shopper_events', 'rating', event_type='shopper_rating_received', batch_id=disputed_batch)"
  - feedback_credit: "K('feedback_five_star_credit') if disputed_order_rating == 5 else (K('feedback_four_star_credit') if disputed_order_rating == 4 else 0)"
  - other_missing_violations: "COUNT('shopper_events', within_months=3, event_type='shopper_violation_recorded', violation_type='missing_items_verified') - 1"
  - repeat_reduction: "K('repeat_many_reduction') if other_missing_violations >= K('repeat_many') else (K('repeat_one_reduction') if other_missing_violations == 1 else 0)"
  - excusal_credit: "MX(0, adjusted_size_credit + feedback_credit - repeat_reduction)"
  - result: "MN(disputed_recorded_points, excusal_credit)"
  compute_basis:
    disputed_entry: "A missing-items dispute that stands submitted is decided by the agent on the records of the disputed violation's batch"
    disputed_recorded_points: "The missing-items excusal points are the missing-items excusal credit, capped at the points the disputed violation was recorded with."
    disputed_batch: "A missing-items dispute that stands submitted is decided by the agent on the records of the disputed violation's batch"
    disputed_units: "The batch-size credit follows the item units on the disputed violation's batch"
    size_credit: "size_large_units or more units give size_large_credit; from size_mid_units up to one fewer than size_large_units give size_mid_credit; fewer give no credit."
    disputed_batch_kind: "The batch-size credit is then adjusted by the batch type"
    adjusted_size_credit: "on a Stock-Up Batch it is doubled; on a Double Delivery Batch or a Triple Delivery Batch it is increased by half of itself, the half rounded up to a whole point; on any other batch type it is used as it stands."
    disputed_order_rating: "The feedback credit follows the most recent rating given on the disputed violation's batch"
    feedback_credit: "5 stars give feedback_five_star_credit; 4 stars give feedback_four_star_credit; 3 stars or fewer, or no rating, give no credit."
    other_missing_violations: "The repeat reduction counts the other missing-items violations recorded on the account less than three whole months before the decision, the disputed one not counted"
    repeat_reduction: "repeat_many or more take off repeat_many_reduction; exactly one takes off repeat_one_reduction; none takes off nothing."
    excusal_credit: "The adjusted batch-size credit and the feedback credit are added, the repeat reduction is subtracted once, a negative figure counts as zero"
    result: "and the result is then capped at the recorded points of the disputed violation."
  factors:
  - id: missing_items_batch_size_credit
    effect: parameter
    decides: size_credit
    bindings: [disputed_batch, disputed_units, size_credit]
    ladder:
    - when: size_large_units or more item units on the disputed violation's batch
      value: "K('size_large_credit')"
    - when: from size_mid_units up to one fewer than size_large_units item units
      value: "K('size_mid_credit')"
    - when: otherwise
      value: "0"
    baseline:
      size_credit: "0"
    evidence: [cross_category]
    cross_difficulty: batch
  - id: missing_items_batch_type_adjustment
    effect: method
    decides: adjusted_size_credit
    bindings: [disputed_batch_kind, adjusted_size_credit]
    ladder:
    - when: the disputed violation's batch is a Stock-Up Batch
      method: the batch-size credit is doubled
    - when: the disputed violation's batch is a Double Delivery Batch or a Triple Delivery Batch
      method: the batch-size credit is increased by half of itself, the half rounded up to a whole point
    - when: otherwise
      method: the batch-size credit is used as it stands
    baseline:
      adjusted_size_credit: "size_credit"
    evidence: [cross_category]
    cross_difficulty: batch
  - id: missing_items_feedback_credit
    effect: parameter
    decides: feedback_credit
    bindings: [disputed_order_rating, feedback_credit]
    ladder:
    - when: the most recent rating on the disputed violation's batch is 5 stars
      value: "K('feedback_five_star_credit')"
    - when: the most recent rating on the disputed violation's batch is 4 stars
      value: "K('feedback_four_star_credit')"
    - when: otherwise (3 stars or fewer, or no rating)
      value: "0"
    baseline:
      feedback_credit: "0"
    evidence: [history]
    cross_difficulty: null
  - id: missing_items_repeat_reduction
    effect: parameter
    decides: repeat_reduction
    bindings: [other_missing_violations, repeat_reduction]
    ladder:
    - when: repeat_many or more other missing-items violations recorded less than three whole months back
      value: "K('repeat_many_reduction')"
    - when: exactly one other such violation
      value: "K('repeat_one_reduction')"
    - when: otherwise (none)
      value: "0"
    baseline:
      repeat_reduction: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The missing-items excusal points are the missing-items excusal credit, capped at the points the disputed violation
      was recorded with. The standard missing-items excusal credit is the batch-size credit, used as it stands whatever
      the batch type, plus the feedback credit, less the repeat reduction, never below zero, where the standard
      batch-size credit, feedback credit and repeat reduction are each zero points.
    params: []
  inputs:
    history:
    - {table: shopper_appeals, aggregate: latest, field: source_event_id, filters: {appeal_type: violation_dispute, appeal_status: submitted}}
    - {table: shopper_events, aggregate: count, field: shopper_event_id, within_months: 3, filters: {event_type: shopper_violation_recorded, violation_type: missing_items_verified}}
    - {table: shopper_events, aggregate: latest, field: rating, filters: {event_type: shopper_rating_received}}
    cross_category: [batch]
- id: shopper_ext_conduct_complaint_excusal
  base_policy_refs: [shopper_evt_violations]
  overwrite:
  - base_policy: shopper_evt_violations
    superseded_clause: >-
      any other dispute goes to the appeals team.
    replaced_by: >-
      The shopper disputes a conduct-complaint violation in the Cartwise app, the app offers the dispute on the most
      recent conduct-complaint violation on the account, and the dispute is decided at once on the records of that
      violation's batch and of the account: it removes the conduct-complaint excusal points from the violation, booked as
      one cleared entry with removal reason dispute_upheld.
  trigger: on_request
  subject: [shopper_violation_cleared]
  computes: points
  target_tool: dispute_conduct_complaint_violation_2203c191
  params:
    counter_wait_long_minutes: 20
    counter_wait_short_minutes: 10
    counter_wait_long_credit: 2
    counter_wait_short_credit: 1
    praise_many_ratings: 6
    praise_some_ratings: 3
    praise_many_credit: 2
    praise_some_credit: 1
    tenure_long_days: 1095
    tenure_mid_days: 365
    prior_complaints_many: 2
    prior_complaints_many_reduction: 2
    prior_complaints_one_reduction: 1
    standing_high_points: 11
    standing_mid_points: 6
    standing_high_reduction: 2
    standing_mid_reduction: 1
  rule: >
    The shopper disputes a conduct-complaint violation in the Cartwise app, the app offers the dispute on the most
    recent conduct-complaint violation on the account, and the dispute is decided at once on the records of that
    violation's batch and of the account: it removes the conduct-complaint excusal points from the violation, booked as
    one cleared entry with removal reason dispute_upheld. The conduct-complaint excusal points are the conduct excusal
    credit, capped at the points the disputed violation was recorded with. The standard conduct excusal credit is the
    counter-wait credit plus the praise credit, used as they stand whatever the shopper's tenure, less the
    prior-complaint reduction and less the standing-points reduction, never below zero, where the standard counter-wait
    credit, praise credit, prior-complaint reduction and standing-points reduction are each zero points. The points a
    conduct-complaint dispute removes are not fixed until no missing-items dispute on the account stands submitted and
    undecided. The points a conduct-complaint dispute removes are fixed only after every batch pay taken back for an
    order verified as not delivered is matched by its wrong-address violation entry. The counter-wait credit follows the
    waiting minutes recorded on the disputed violation's batch beyond the free waiting minutes of that batch type
    (wait_free_minutes in the batch charter): an excess of counter_wait_long_minutes or more gives
    counter_wait_long_credit; an excess from counter_wait_short_minutes up to one minute short of
    counter_wait_long_minutes gives counter_wait_short_credit; a smaller excess gives no credit. The praise credit counts
    the 5-star ratings the shopper received less than one whole month before the dispute: praise_many_ratings or more
    give praise_many_credit; from praise_some_ratings up to one fewer than praise_many_ratings give praise_some_credit;
    fewer give no credit. The counter-wait credit and the praise credit are added, and that sum is then adjusted by the
    shopper's tenure, counted in calendar days from the account's first activation date to the dispute: with
    tenure_long_days or more the sum is doubled; with tenure_mid_days up to one fewer than tenure_long_days it is
    increased by half of itself, the half rounded up to a whole point; with less it is used as it stands. The
    prior-complaint reduction counts the other conduct-complaint violations recorded on the account less than twelve
    whole months before the dispute, the disputed one not counted: prior_complaints_many or more take off
    prior_complaints_many_reduction; exactly one takes off prior_complaints_one_reduction; none takes off nothing. The
    standing-points reduction looks at the account's other standing violation points, meaning the points of every
    recorded violation less the points of every cleared entry, the disputed violation's own recorded points left out:
    standing_high_points or more take off standing_high_reduction; from standing_mid_points up to one fewer than
    standing_high_points take off standing_mid_reduction; fewer take off nothing. The tenure-adjusted sum has the
    prior-complaint reduction and the standing-points reduction each subtracted once, a negative figure counts as zero,
    and the result is then capped at the recorded points of the disputed violation.
  prerequisite:
  - problem: shopper_ext_missing_items_excusal
    kind: value_input
    gate: other_standing_points
    form: state
    policy_source: >-
      The points a conduct-complaint dispute removes are not fixed until no missing-items dispute on the account stands
      submitted and undecided.
    condition: >-
      No violation dispute of a missing-items violation on the shopper account has appeal status submitted.
    resolved_by: decide_missing_items_dispute_36c35ef8
    effect: >-
      Deciding the submitted missing-items dispute books a cleared entry against that violation, which lowers the
      account's other standing points and can move the standing-points reduction down a tier.
  - problem: shopper_ext_wrong_address_severity
    kind: value_input
    gate: other_standing_points
    form: state
    policy_source: >-
      The points a conduct-complaint dispute removes are fixed only after every batch pay taken back for an order
      verified as not delivered is matched by its wrong-address violation entry.
    condition: >-
      Every batch pay reversal with reason order_not_delivered_verified in the shopper's batch ledger is matched by a
      violation entry of type wrong_address naming the reversal's batch on the shopper account.
    resolved_by: record_wrong_address_violation_db63d782
    effect: >-
      Booking the owed wrong-address violation adds its points to the account's other standing points, which can move
      the standing-points reduction up a tier.
  cross_category:
  - category: batch
    as: branch
    reads: [batches.wait_minutes, wait_free_minutes]
    note: The disputed violation's batch record gives the waiting minutes and the free waiting minutes of its type behind
      the counter-wait credit.
  compute:
  - conduct_entry: "LATEST('shopper_events', 'shopper_event_id', event_type='shopper_violation_recorded', violation_type='conduct_complaint')"
  - conduct_recorded_points: "LATEST('shopper_events', 'points', event_type='shopper_violation_recorded', shopper_event_id=conduct_entry)"
  - conduct_batch: "LATEST('shopper_events', 'batch_id', event_type='shopper_violation_recorded', shopper_event_id=conduct_entry)"
  - counter_wait_minutes: "CFIELD('batch', 'wait_minutes', batch_id=conduct_batch)"
  - counter_free_minutes: "CPARAM('batch', 'wait_free_minutes', batch_id=conduct_batch)"
  - counter_wait_credit: "K('counter_wait_long_credit') if counter_wait_minutes - counter_free_minutes >= K('counter_wait_long_minutes') else (K('counter_wait_short_credit') if counter_wait_minutes - counter_free_minutes >= K('counter_wait_short_minutes') else 0)"
  - recent_five_star: "COUNT('shopper_events', within_months=1, event_type='shopper_rating_received', rating=5)"
  - praise_credit: "K('praise_many_credit') if recent_five_star >= K('praise_many_ratings') else (K('praise_some_credit') if recent_five_star >= K('praise_some_ratings') else 0)"
  - conduct_tenure_days: "DAYS(F('activated_date'), NOW)"
  - tenure_adjusted_credit: "(counter_wait_credit + praise_credit) * 2 if conduct_tenure_days >= K('tenure_long_days') else ((counter_wait_credit + praise_credit) + (counter_wait_credit + praise_credit + 1) // 2 if conduct_tenure_days >= K('tenure_mid_days') else counter_wait_credit + praise_credit)"
  - prior_conduct_complaints: "COUNT('shopper_events', within_months=12, event_type='shopper_violation_recorded', violation_type='conduct_complaint') - 1"
  - prior_complaint_reduction: "K('prior_complaints_many_reduction') if prior_conduct_complaints >= K('prior_complaints_many') else (K('prior_complaints_one_reduction') if prior_conduct_complaints == 1 else 0)"
  - other_standing_points: "SUM('shopper_events', 'points', event_type='shopper_violation_recorded') - SUM('shopper_events', 'points', event_type='shopper_violation_cleared') - conduct_recorded_points"
  - standing_reduction: "K('standing_high_reduction') if other_standing_points >= K('standing_high_points') else (K('standing_mid_reduction') if other_standing_points >= K('standing_mid_points') else 0)"
  - conduct_excusal_credit: "MX(0, tenure_adjusted_credit - prior_complaint_reduction - standing_reduction)"
  - result: "MN(conduct_recorded_points, conduct_excusal_credit)"
  compute_basis:
    conduct_entry: "the app offers the dispute on the most recent conduct-complaint violation on the account"
    conduct_recorded_points: "The conduct-complaint excusal points are the conduct excusal credit, capped at the points the disputed violation was recorded with."
    conduct_batch: "the dispute is decided at once on the records of that violation's batch and of the account"
    counter_wait_minutes: "The counter-wait credit follows the waiting minutes recorded on the disputed violation's batch beyond the free waiting minutes of that batch type (wait_free_minutes in the batch charter)"
    counter_free_minutes: "The counter-wait credit follows the waiting minutes recorded on the disputed violation's batch beyond the free waiting minutes of that batch type (wait_free_minutes in the batch charter)"
    counter_wait_credit: "an excess of counter_wait_long_minutes or more gives counter_wait_long_credit; an excess from counter_wait_short_minutes up to one minute short of counter_wait_long_minutes gives counter_wait_short_credit; a smaller excess gives no credit."
    recent_five_star: "The praise credit counts the 5-star ratings the shopper received less than one whole month before the dispute"
    praise_credit: "praise_many_ratings or more give praise_many_credit; from praise_some_ratings up to one fewer than praise_many_ratings give praise_some_credit; fewer give no credit."
    conduct_tenure_days: "adjusted by the shopper's tenure, counted in calendar days from the account's first activation date to the dispute"
    tenure_adjusted_credit: "The counter-wait credit and the praise credit are added, and that sum is then adjusted by the shopper's tenure, counted in calendar days from the account's first activation date to the dispute: with tenure_long_days or more the sum is doubled; with tenure_mid_days up to one fewer than tenure_long_days it is increased by half of itself, the half rounded up to a whole point; with less it is used as it stands."
    prior_conduct_complaints: "The prior-complaint reduction counts the other conduct-complaint violations recorded on the account less than twelve whole months before the dispute, the disputed one not counted"
    prior_complaint_reduction: "prior_complaints_many or more take off prior_complaints_many_reduction; exactly one takes off prior_complaints_one_reduction; none takes off nothing."
    other_standing_points: "The standing-points reduction looks at the account's other standing violation points, meaning the points of every recorded violation less the points of every cleared entry, the disputed violation's own recorded points left out"
    standing_reduction: "standing_high_points or more take off standing_high_reduction; from standing_mid_points up to one fewer than standing_high_points take off standing_mid_reduction; fewer take off nothing."
    conduct_excusal_credit: "The tenure-adjusted sum has the prior-complaint reduction and the standing-points reduction each subtracted once, a negative figure counts as zero"
    result: "and the result is then capped at the recorded points of the disputed violation."
  factors:
  - id: conduct_counter_wait_credit
    effect: parameter
    decides: counter_wait_credit
    bindings: [conduct_batch, counter_wait_minutes, counter_free_minutes, counter_wait_credit]
    ladder:
    - when: the batch's waiting minutes exceed its type's free waiting minutes by counter_wait_long_minutes or more
      value: "K('counter_wait_long_credit')"
    - when: they exceed them by counter_wait_short_minutes up to one minute short of counter_wait_long_minutes
      value: "K('counter_wait_short_credit')"
    - when: otherwise
      value: "0"
    baseline:
      counter_wait_credit: "0"
    evidence: [cross_category]
    cross_difficulty: batch
  - id: conduct_praise_credit
    effect: parameter
    decides: praise_credit
    bindings: [recent_five_star, praise_credit]
    ladder:
    - when: praise_many_ratings or more 5-star ratings received less than one whole month before the dispute
      value: "K('praise_many_credit')"
    - when: from praise_some_ratings up to one fewer than praise_many_ratings such ratings
      value: "K('praise_some_credit')"
    - when: otherwise
      value: "0"
    baseline:
      praise_credit: "0"
    evidence: [history]
    cross_difficulty: null
  - id: conduct_tenure_adjustment
    effect: method
    decides: tenure_adjusted_credit
    bindings: [conduct_tenure_days, tenure_adjusted_credit]
    ladder:
    - when: tenure_long_days or more calendar days since first activation
      method: the counter-wait and praise sum is doubled
    - when: from tenure_mid_days up to one fewer than tenure_long_days
      method: the sum is increased by half of itself, the half rounded up to a whole point
    - when: otherwise
      method: the sum is used as it stands
    baseline:
      tenure_adjusted_credit: "counter_wait_credit + praise_credit"
    evidence: [date]
    cross_difficulty: null
  - id: conduct_prior_complaint_reduction
    effect: parameter
    decides: prior_complaint_reduction
    bindings: [prior_conduct_complaints, prior_complaint_reduction]
    ladder:
    - when: prior_complaints_many or more other conduct complaints recorded less than twelve whole months back
      value: "K('prior_complaints_many_reduction')"
    - when: exactly one other such complaint
      value: "K('prior_complaints_one_reduction')"
    - when: otherwise (none)
      value: "0"
    baseline:
      prior_complaint_reduction: "0"
    evidence: [history]
    cross_difficulty: null
  - id: conduct_standing_points_reduction
    effect: parameter
    decides: standing_reduction
    bindings: [other_standing_points, standing_reduction]
    ladder:
    - when: standing_high_points or more other standing violation points
      value: "K('standing_high_reduction')"
    - when: from standing_mid_points up to one fewer than standing_high_points other standing points
      value: "K('standing_mid_reduction')"
    - when: otherwise
      value: "0"
    baseline:
      standing_reduction: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The conduct-complaint excusal points are the conduct excusal credit, capped at the points the disputed violation
      was recorded with. The standard conduct excusal credit is the counter-wait credit plus the praise credit, used as
      they stand whatever the shopper's tenure, less the prior-complaint reduction and less the standing-points
      reduction, never below zero, where the standard counter-wait credit, praise credit, prior-complaint reduction and
      standing-points reduction are each zero points.
    params: []
  inputs:
    history:
    - {table: shopper_events, aggregate: sum, field: points, filters: {event_type: shopper_violation_recorded}}
    - {table: shopper_events, aggregate: sum, field: points, filters: {event_type: shopper_violation_cleared}}
    - {table: shopper_events, aggregate: count, field: shopper_event_id, within_months: 1, filters: {event_type: shopper_rating_received, rating: 5}}
    - {table: shopper_events, aggregate: count, field: shopper_event_id, within_months: 12, filters: {event_type: shopper_violation_recorded, violation_type: conduct_complaint}}
    cross_category: [batch]
- id: shopper_ext_wrong_address_excusal
  base_policy_refs: [shopper_evt_violations]
  overwrite:
  - base_policy: shopper_evt_violations
    superseded_clause: >-
      any other dispute goes to the appeals team.
    replaced_by: >-
      A wrong-address dispute that stands submitted concerns the account's most recent wrong-address violation and is
      decided by the agent on the records of that violation's batch: the decision removes the wrong-address excusal
      points from the violation, booked as one cleared entry with removal reason dispute_upheld, and marks the dispute
      upheld.
  trigger: state_due
  subject: [shopper_violation_cleared]
  computes: points
  target_tool: decide_wrong_address_dispute_4037a75e
  params:
    route_long_miles: 12.0
    route_mid_miles: 6.0
    route_long_credit: 2
    route_mid_credit: 1
    unreachable_many: 2
    unreachable_many_credit: 2
    unreachable_one_credit: 1
    prior_wrong_many: 2
    prior_wrong_many_reduction: 2
    prior_wrong_one_reduction: 1
    one_star_many: 2
    one_star_many_reduction: 2
    one_star_one_reduction: 1
  rule: >
    A wrong-address dispute that stands submitted concerns the account's most recent wrong-address violation and is
    decided by the agent on the records of that violation's batch: the decision removes the wrong-address excusal
    points from the violation, booked as one cleared entry with removal reason dispute_upheld, and marks the dispute
    upheld. The wrong-address excusal points are the address excusal credit, capped at the points the disputed violation
    was recorded with. The standard address excusal credit is the route credit plus the unreachable-customer credit,
    used as they stand whatever the number of orders on the batch, less the prior-address reduction and less the
    low-rating reduction, never below zero, where the standard route credit, unreachable-customer credit, prior-address
    reduction and low-rating reduction are each zero points. The route credit follows the estimated route miles on the
    disputed violation's batch offer: route_long_miles or more give route_long_credit; from route_mid_miles up to but
    not including route_long_miles give route_mid_credit; shorter routes give no credit. The unreachable-customer credit
    counts the rating exclusions granted on that batch for the reason customer_unreachable: unreachable_many or more give
    unreachable_many_credit; exactly one gives unreachable_one_credit; none gives no credit. The route credit and the
    unreachable-customer credit are added, and that sum is then adjusted by the orders the batch carried: on a batch of
    three or more orders it is doubled; on a batch of two orders it is increased by half of itself, the half rounded up
    to a whole point; on a single-order batch it is used as it stands. The prior-address reduction counts the other
    wrong-address violations recorded on the account less than twelve whole months before the decision, the disputed one
    not counted: prior_wrong_many or more take off prior_wrong_many_reduction; exactly one takes off
    prior_wrong_one_reduction; none takes off nothing. The low-rating reduction counts the ratings of 2 stars or fewer
    received on that batch: one_star_many or more take off one_star_many_reduction; exactly one takes off one_star_one_reduction;
    none takes off nothing. The order-adjusted sum has the prior-address reduction and the low-rating reduction each
    subtracted once, a negative figure counts as zero, and the result is then capped at the recorded points of the
    disputed violation.
  prerequisite: []
  cross_category:
  - category: batch
    as: branch
    reads: [batches.estimated_miles, batches.order_count]
    note: The disputed violation's batch record gives the estimated route miles and the order count behind the route
      credit and the multi-order adjustment.
  compute:
  - wa_dispute_entry: "LATEST('shopper_events', 'shopper_event_id', event_type='shopper_violation_recorded', violation_type='wrong_address')"
  - wa_dispute_recorded: "LATEST('shopper_events', 'points', event_type='shopper_violation_recorded', shopper_event_id=wa_dispute_entry)"
  - wa_dispute_batch: "LATEST('shopper_events', 'batch_id', event_type='shopper_violation_recorded', shopper_event_id=wa_dispute_entry)"
  - route_miles: "CFIELD('batch', 'estimated_miles', batch_id=wa_dispute_batch)"
  - route_credit: "K('route_long_credit') if route_miles >= K('route_long_miles') else (K('route_mid_credit') if route_miles >= K('route_mid_miles') else 0)"
  - unreachable_exclusions: "COUNT('shopper_events', event_type='shopper_rating_excluded', exclusion_reason='customer_unreachable', batch_id=wa_dispute_batch)"
  - unreachable_credit: "K('unreachable_many_credit') if unreachable_exclusions >= K('unreachable_many') else (K('unreachable_one_credit') if unreachable_exclusions == 1 else 0)"
  - wa_dispute_orders: "CFIELD('batch', 'order_count', batch_id=wa_dispute_batch)"
  - address_adjusted_credit: "(route_credit + unreachable_credit) * 2 if wa_dispute_orders >= 3 else ((route_credit + unreachable_credit) + (route_credit + unreachable_credit + 1) // 2 if wa_dispute_orders == 2 else route_credit + unreachable_credit)"
  - prior_wrong_address: "COUNT('shopper_events', within_months=12, event_type='shopper_violation_recorded', violation_type='wrong_address') - 1"
  - prior_address_reduction: "K('prior_wrong_many_reduction') if prior_wrong_address >= K('prior_wrong_many') else (K('prior_wrong_one_reduction') if prior_wrong_address == 1 else 0)"
  - one_star_ratings_on_batch: "COUNT('shopper_events', event_type='shopper_rating_received', batch_id=wa_dispute_batch, rating=1) + COUNT('shopper_events', event_type='shopper_rating_received', batch_id=wa_dispute_batch, rating=2)"
  - low_rating_reduction: "K('one_star_many_reduction') if one_star_ratings_on_batch >= K('one_star_many') else (K('one_star_one_reduction') if one_star_ratings_on_batch == 1 else 0)"
  - address_excusal_credit: "MX(0, address_adjusted_credit - prior_address_reduction - low_rating_reduction)"
  - result: "MN(wa_dispute_recorded, address_excusal_credit)"
  compute_basis:
    wa_dispute_entry: "A wrong-address dispute that stands submitted concerns the account's most recent wrong-address violation"
    wa_dispute_recorded: "The wrong-address excusal points are the address excusal credit, capped at the points the disputed violation was recorded with."
    wa_dispute_batch: "is decided by the agent on the records of that violation's batch"
    route_miles: "The route credit follows the estimated route miles on the disputed violation's batch offer"
    route_credit: "route_long_miles or more give route_long_credit; from route_mid_miles up to but not including route_long_miles give route_mid_credit; shorter routes give no credit."
    unreachable_exclusions: "The unreachable-customer credit counts the rating exclusions granted on that batch for the reason customer_unreachable"
    unreachable_credit: "unreachable_many or more give unreachable_many_credit; exactly one gives unreachable_one_credit; none gives no credit."
    wa_dispute_orders: "that sum is then adjusted by the orders the batch carried"
    address_adjusted_credit: "The route credit and the unreachable-customer credit are added, and that sum is then adjusted by the orders the batch carried: on a batch of three or more orders it is doubled; on a batch of two orders it is increased by half of itself, the half rounded up to a whole point; on a single-order batch it is used as it stands."
    prior_wrong_address: "The prior-address reduction counts the other wrong-address violations recorded on the account less than twelve whole months before the decision, the disputed one not counted"
    prior_address_reduction: "prior_wrong_many or more take off prior_wrong_many_reduction; exactly one takes off prior_wrong_one_reduction; none takes off nothing."
    one_star_ratings_on_batch: "The low-rating reduction counts the ratings of 2 stars or fewer received on that batch"
    low_rating_reduction: "one_star_many or more take off one_star_many_reduction; exactly one takes off one_star_one_reduction; none takes off nothing."
    address_excusal_credit: "The order-adjusted sum has the prior-address reduction and the low-rating reduction each subtracted once, a negative figure counts as zero"
    result: "and the result is then capped at the recorded points of the disputed violation."
  factors:
  - id: address_route_credit
    effect: parameter
    decides: route_credit
    bindings: [wa_dispute_batch, route_miles, route_credit]
    ladder:
    - when: route_long_miles or more estimated route miles on the disputed violation's batch
      value: "K('route_long_credit')"
    - when: from route_mid_miles up to but not including route_long_miles
      value: "K('route_mid_credit')"
    - when: otherwise
      value: "0"
    baseline:
      route_credit: "0"
    evidence: [cross_category]
    cross_difficulty: batch
  - id: address_unreachable_credit
    effect: parameter
    decides: unreachable_credit
    bindings: [unreachable_exclusions, unreachable_credit]
    ladder:
    - when: unreachable_many or more customer_unreachable rating exclusions on that batch
      value: "K('unreachable_many_credit')"
    - when: exactly one such exclusion
      value: "K('unreachable_one_credit')"
    - when: otherwise (none)
      value: "0"
    baseline:
      unreachable_credit: "0"
    evidence: [history]
    cross_difficulty: null
  - id: address_multi_order_adjustment
    effect: method
    decides: address_adjusted_credit
    bindings: [wa_dispute_orders, address_adjusted_credit]
    ladder:
    - when: the batch carried three or more orders
      method: the route and unreachable-customer sum is doubled
    - when: the batch carried two orders
      method: the sum is increased by half of itself, the half rounded up to a whole point
    - when: otherwise (a single-order batch)
      method: the sum is used as it stands
    baseline:
      address_adjusted_credit: "route_credit + unreachable_credit"
    evidence: [cross_category]
    cross_difficulty: batch
  - id: address_prior_reduction
    effect: parameter
    decides: prior_address_reduction
    bindings: [prior_wrong_address, prior_address_reduction]
    ladder:
    - when: prior_wrong_many or more other wrong-address violations recorded less than twelve whole months back
      value: "K('prior_wrong_many_reduction')"
    - when: exactly one other such violation
      value: "K('prior_wrong_one_reduction')"
    - when: otherwise (none)
      value: "0"
    baseline:
      prior_address_reduction: "0"
    evidence: [history]
    cross_difficulty: null
  - id: address_low_rating_reduction
    effect: parameter
    decides: low_rating_reduction
    bindings: [one_star_ratings_on_batch, low_rating_reduction]
    ladder:
    - when: one_star_many or more ratings of 2 stars or fewer received on that batch
      value: "K('one_star_many_reduction')"
    - when: exactly one rating of 2 stars or fewer on that batch
      value: "K('one_star_one_reduction')"
    - when: otherwise (none)
      value: "0"
    baseline:
      low_rating_reduction: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The wrong-address excusal points are the address excusal credit, capped at the points the disputed violation was
      recorded with. The standard address excusal credit is the route credit plus the unreachable-customer credit, used
      as they stand whatever the number of orders on the batch, less the prior-address reduction and less the low-rating
      reduction, never below zero, where the standard route credit, unreachable-customer credit, prior-address reduction
      and low-rating reduction are each zero points.
    params: []
  inputs:
    history:
    - {table: shopper_events, aggregate: count, field: shopper_event_id, filters: {event_type: shopper_rating_excluded, exclusion_reason: customer_unreachable}}
    - {table: shopper_events, aggregate: count, field: shopper_event_id, within_months: 12, filters: {event_type: shopper_violation_recorded, violation_type: wrong_address}}
    - {table: shopper_events, aggregate: count, field: shopper_event_id, filters: {event_type: shopper_rating_received}}
    cross_category: [batch]
- id: shopper_ext_alcohol_procedure_excusal
  base_policy_refs: [shopper_evt_violations]
  overwrite:
  - base_policy: shopper_evt_violations
    superseded_clause: >-
      any other dispute goes to the appeals team.
    replaced_by: >-
      An alcohol-procedure dispute that stands submitted concerns the account's most recent alcohol-procedure violation
      and is decided by the agent on the records of that violation's batch and of the account: the decision removes the
      alcohol-procedure excusal points from the violation, booked as one cleared entry with removal reason
      dispute_upheld, and marks the dispute upheld.
  trigger: state_due
  subject: [shopper_violation_cleared]
  computes: points
  target_tool: decide_alcohol_procedure_dispute_63dedfc1
  params:
    outage_many: 2
    outage_many_credit: 4
    outage_one_credit: 3
    alcohol_tenure_long_days: 1095
    alcohol_tenure_mid_days: 365
    prior_alcohol_many: 2
    prior_alcohol_many_reduction: 3
    prior_alcohol_one_reduction: 2
    recent_record_many: 4
    recent_record_some: 1
    recent_record_many_reduction: 2
    recent_record_some_reduction: 1
  rule: >
    An alcohol-procedure dispute that stands submitted concerns the account's most recent alcohol-procedure violation
    and is decided by the agent on the records of that violation's batch and of the account: the decision removes the
    alcohol-procedure excusal points from the violation, booked as one cleared entry with removal reason
    dispute_upheld, and marks the dispute upheld. The alcohol-procedure excusal points are the ID-scan excusal credit,
    capped at the points the disputed violation was recorded with. The standard ID-scan excusal credit is the outage
    credit, used as it stands whatever the shopper's tenure, less the prior-alcohol reduction and less the recent-record
    reduction, never below zero, where the standard outage credit, prior-alcohol reduction and recent-record reduction
    are each zero points. The outage credit counts the rating exclusions granted on the disputed violation's batch for
    the reason app_outage, because an app outage at the door is what stops an ID scan from completing: outage_many or
    more give outage_many_credit; exactly one gives outage_one_credit; none gives no credit. The outage credit is then
    adjusted by the shopper's tenure, counted in calendar days from the account's first activation date to the
    decision: with alcohol_tenure_long_days or more it is doubled; with alcohol_tenure_mid_days up to one fewer than
    alcohol_tenure_long_days it is increased by half of itself, the half rounded up to a whole point; with less it is used
    as it stands. The prior-alcohol reduction counts the other alcohol-procedure violations recorded on the account less
    than twelve whole months before the decision, the disputed one not counted: prior_alcohol_many or more take off
    prior_alcohol_many_reduction; exactly one takes off prior_alcohol_one_reduction; none takes off nothing. The
    recent-record reduction counts the violations of any other type recorded on the account less than one whole month
    before the decision, because a shopper with a string of fresh violations gets less benefit of the doubt on a
    compliance breach: recent_record_many or more take off recent_record_many_reduction; from recent_record_some up to
    one fewer than recent_record_many take off recent_record_some_reduction; none takes off nothing. The tenure-adjusted
    outage credit has the prior-alcohol reduction and the recent-record reduction each subtracted once, a negative
    figure counts as zero, and the result is then capped at the recorded points of the disputed violation.
  prerequisite: []
  cross_category: []
  compute:
  - al_entry: "LATEST('shopper_events', 'shopper_event_id', event_type='shopper_violation_recorded', violation_type='alcohol_procedure')"
  - al_recorded: "LATEST('shopper_events', 'points', event_type='shopper_violation_recorded', shopper_event_id=al_entry)"
  - al_batch: "LATEST('shopper_events', 'batch_id', event_type='shopper_violation_recorded', shopper_event_id=al_entry)"
  - outage_exclusions: "COUNT('shopper_events', event_type='shopper_rating_excluded', exclusion_reason='app_outage', batch_id=al_batch)"
  - outage_credit: "K('outage_many_credit') if outage_exclusions >= K('outage_many') else (K('outage_one_credit') if outage_exclusions == 1 else 0)"
  - al_tenure_days: "DAYS(F('activated_date'), NOW)"
  - al_tenure_adjusted: "outage_credit * 2 if al_tenure_days >= K('alcohol_tenure_long_days') else (outage_credit + (outage_credit + 1) // 2 if al_tenure_days >= K('alcohol_tenure_mid_days') else outage_credit)"
  - prior_alcohol: "COUNT('shopper_events', within_months=12, event_type='shopper_violation_recorded', violation_type='alcohol_procedure') - 1"
  - prior_alcohol_reduction: "K('prior_alcohol_many_reduction') if prior_alcohol >= K('prior_alcohol_many') else (K('prior_alcohol_one_reduction') if prior_alcohol == 1 else 0)"
  - recent_other_violations: "COUNT('shopper_events', within_months=1, event_type='shopper_violation_recorded') - COUNT('shopper_events', within_months=1, event_type='shopper_violation_recorded', violation_type='alcohol_procedure')"
  - recent_record_reduction: "K('recent_record_many_reduction') if recent_other_violations >= K('recent_record_many') else (K('recent_record_some_reduction') if recent_other_violations >= K('recent_record_some') else 0)"
  - id_scan_excusal_credit: "MX(0, al_tenure_adjusted - prior_alcohol_reduction - recent_record_reduction)"
  - result: "MN(al_recorded, id_scan_excusal_credit)"
  compute_basis:
    al_entry: "An alcohol-procedure dispute that stands submitted concerns the account's most recent alcohol-procedure violation"
    al_recorded: "The alcohol-procedure excusal points are the ID-scan excusal credit, capped at the points the disputed violation was recorded with."
    al_batch: "is decided by the agent on the records of that violation's batch and of the account"
    outage_exclusions: "The outage credit counts the rating exclusions granted on the disputed violation's batch for the reason app_outage"
    outage_credit: "outage_many or more give outage_many_credit; exactly one gives outage_one_credit; none gives no credit."
    al_tenure_days: "adjusted by the shopper's tenure, counted in calendar days from the account's first activation date to the decision"
    al_tenure_adjusted: "The outage credit is then adjusted by the shopper's tenure, counted in calendar days from the account's first activation date to the decision: with alcohol_tenure_long_days or more it is doubled; with alcohol_tenure_mid_days up to one fewer than alcohol_tenure_long_days it is increased by half of itself, the half rounded up to a whole point; with less it is used as it stands."
    prior_alcohol: "The prior-alcohol reduction counts the other alcohol-procedure violations recorded on the account less than twelve whole months before the decision, the disputed one not counted"
    prior_alcohol_reduction: "prior_alcohol_many or more take off prior_alcohol_many_reduction; exactly one takes off prior_alcohol_one_reduction; none takes off nothing."
    recent_other_violations: "The recent-record reduction counts the violations of any other type recorded on the account less than one whole month before the decision"
    recent_record_reduction: "recent_record_many or more take off recent_record_many_reduction; from recent_record_some up to one fewer than recent_record_many take off recent_record_some_reduction; none takes off nothing."
    id_scan_excusal_credit: "The tenure-adjusted outage credit has the prior-alcohol reduction and the recent-record reduction each subtracted once, a negative figure counts as zero"
    result: "and the result is then capped at the recorded points of the disputed violation."
  factors:
  - id: alcohol_outage_credit
    effect: parameter
    decides: outage_credit
    bindings: [al_batch, outage_exclusions, outage_credit]
    ladder:
    - when: outage_many or more app_outage rating exclusions on the disputed violation's batch
      value: "K('outage_many_credit')"
    - when: exactly one such exclusion
      value: "K('outage_one_credit')"
    - when: otherwise (none)
      value: "0"
    baseline:
      outage_credit: "0"
    evidence: [history]
    cross_difficulty: null
  - id: alcohol_tenure_adjustment
    effect: method
    decides: al_tenure_adjusted
    bindings: [al_tenure_days, al_tenure_adjusted]
    ladder:
    - when: alcohol_tenure_long_days or more calendar days since first activation
      method: the outage credit is doubled
    - when: from alcohol_tenure_mid_days up to one fewer than alcohol_tenure_long_days
      method: the outage credit is increased by half of itself, the half rounded up to a whole point
    - when: otherwise
      method: the outage credit is used as it stands
    baseline:
      al_tenure_adjusted: "outage_credit"
    evidence: [date]
    cross_difficulty: null
  - id: alcohol_prior_reduction
    effect: parameter
    decides: prior_alcohol_reduction
    bindings: [prior_alcohol, prior_alcohol_reduction]
    ladder:
    - when: prior_alcohol_many or more other alcohol-procedure violations recorded less than twelve whole months back
      value: "K('prior_alcohol_many_reduction')"
    - when: exactly one other such violation
      value: "K('prior_alcohol_one_reduction')"
    - when: otherwise (none)
      value: "0"
    baseline:
      prior_alcohol_reduction: "0"
    evidence: [history]
    cross_difficulty: null
  - id: alcohol_recent_record_reduction
    effect: parameter
    decides: recent_record_reduction
    bindings: [recent_other_violations, recent_record_reduction]
    ladder:
    - when: recent_record_many or more violations of other types recorded less than one whole month before the decision
      value: "K('recent_record_many_reduction')"
    - when: from recent_record_some up to one fewer than recent_record_many such violations
      value: "K('recent_record_some_reduction')"
    - when: otherwise (none)
      value: "0"
    baseline:
      recent_record_reduction: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The alcohol-procedure excusal points are the ID-scan excusal credit, capped at the points the disputed violation
      was recorded with. The standard ID-scan excusal credit is the outage credit, used as it stands whatever the
      shopper's tenure, less the prior-alcohol reduction and less the recent-record reduction, never below zero, where
      the standard outage credit, prior-alcohol reduction and recent-record reduction are each zero points.
    params: []
  inputs:
    history:
    - {table: shopper_events, aggregate: count, field: shopper_event_id, filters: {event_type: shopper_rating_excluded, exclusion_reason: app_outage}}
    - {table: shopper_events, aggregate: count, field: shopper_event_id, within_months: 12, filters: {event_type: shopper_violation_recorded, violation_type: alcohol_procedure}}
    - {table: shopper_events, aggregate: count, field: shopper_event_id, within_months: 1, filters: {event_type: shopper_violation_recorded}}
    cross_category: []
- id: shopper_ext_late_delivery_excusal
  base_policy_refs: [shopper_evt_violations]
  overwrite:
  - base_policy: shopper_evt_violations
    superseded_clause: >-
      a late_delivery violation is cleared (removal_reason dispute_upheld) when the order's record shows it was not late
      (completed_at no later than scheduled_window_end plus that service level's late_threshold_minutes)
    replaced_by: >-
      A late-delivery dispute that stands submitted concerns the account's most recent late-delivery violation and is
      decided by the agent on the record of that violation's batch: when the lateness credit reaches late_excusal_mark,
      the decision removes all of the points the violation was recorded with; when it falls short, it removes none.
  trigger: state_due
  subject: [shopper_violation_cleared]
  computes: points
  target_tool: decide_late_delivery_dispute_3251c6fd
  params:
    late_wait_long_minutes: 20
    late_wait_short_minutes: 10
    late_wait_long_credit: 2
    late_wait_short_credit: 1
    late_detour_long_ratio: 1.5
    late_detour_short_ratio: 1.25
    late_detour_long_credit: 2
    late_detour_short_credit: 1
    store_delay_many: 2
    store_delay_many_credit: 2
    store_delay_one_credit: 1
    late_excusal_mark: 4
  rule: >
    A late-delivery dispute that stands submitted concerns the account's most recent late-delivery violation and is
    decided by the agent on the record of that violation's batch: when the lateness credit reaches late_excusal_mark,
    the decision removes all of the points the violation was recorded with; when it falls short, it removes none. The
    removal is booked as one cleared entry with removal reason dispute_upheld and the dispute is marked decided. The
    standard lateness credit is the store-wait credit plus the detour credit, used as they stand whatever the number of
    orders on the batch, plus the store-delay credit, where the standard store-wait credit, detour credit and
    store-delay credit are each zero points. The store-wait credit follows the waiting minutes recorded on the disputed
    violation's batch beyond the free waiting minutes of that batch type (wait_free_minutes in the batch charter): an
    excess of late_wait_long_minutes or more gives late_wait_long_credit; an excess from late_wait_short_minutes up to
    one minute short of late_wait_long_minutes gives late_wait_short_credit; a smaller excess gives no credit. The detour
    credit compares the GPS miles driven on that batch with the estimated route miles on its offer: driven miles of
    late_detour_long_ratio times the estimate or more give late_detour_long_credit; from late_detour_short_ratio times
    the estimate up to but not including late_detour_long_ratio times it give late_detour_short_credit; less gives no
    credit. The store-wait credit and the detour credit are added, and that sum is then adjusted by the orders the batch
    carried: on a batch of three or more orders it is doubled; on a batch of two orders it is increased by half of
    itself, the half rounded up to a whole point; on a single-order batch it is used as it stands. The store-delay credit
    counts the rating exclusions granted on that batch for the reason store_delay: store_delay_many or more give
    store_delay_many_credit; exactly one gives store_delay_one_credit; none gives no credit. The lateness credit is the
    order-adjusted sum plus the store-delay credit, and it is compared with late_excusal_mark only once, after both are
    added.
  prerequisite: []
  cross_category:
