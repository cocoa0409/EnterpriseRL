    - when: exactly one such exclusion
      value: "K('store_delay_one_credit')"
    - when: otherwise (none)
      value: "0"
    baseline:
      store_delay_credit: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
