    decides: lt_detour_credit
    bindings: [lt_driven, lt_estimated, lt_detour_credit]
    ladder:
    - when: driven miles of late_detour_long_ratio times the estimated route miles or more
      value: "K('late_detour_long_credit')"
    - when: from late_detour_short_ratio times the estimate up to but not including late_detour_long_ratio times it
      value: "K('late_detour_short_credit')"
    - when: otherwise
