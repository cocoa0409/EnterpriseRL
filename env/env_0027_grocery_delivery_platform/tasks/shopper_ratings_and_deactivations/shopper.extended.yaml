    evidence: [cross_category]
    cross_difficulty: batch
  - id: lateness_multi_order_adjustment
    effect: method
    decides: lt_adjusted
    bindings: [lt_orders, lt_adjusted]
    ladder:
    - when: the batch carried three or more orders
      method: the store-wait and detour sum is doubled
    - when: the batch carried two orders
      method: the sum is increased by half of itself, the half rounded up to a whole point
