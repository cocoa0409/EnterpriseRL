    cross_category: [batch]
- id: shopper_ext_dropped_batch_excusal
  base_policy_refs: [shopper_evt_violations]
  overwrite:
  - base_policy: shopper_evt_violations
    superseded_clause: >-
      any other dispute goes to the appeals team.
    replaced_by: >-
      The shopper disputes a dropped-batch violation in the Cartwise app, the app offers the dispute on the most recent
      dropped-batch violation on the account, and the dispute is decided at once on the records of that violation's
      batch and of the account: it removes the dropped-batch excusal points from the violation, booked as one cleared
      entry with removal reason dispute_upheld.
  trigger: on_request
  subject: [shopper_violation_cleared]
  computes: points
  target_tool: dispute_dropped_batch_violation_598e80dc
  params:
    forfeit_large_usd: 20.0
    forfeit_mid_usd: 10.0
    forfeit_large_credit: 2
    forfeit_mid_credit: 1
    reliability_high_batches: 10
    reliability_mid_batches: 5
    reliability_high_credit: 2
    reliability_mid_credit: 1
    drop_praise_many: 6
    drop_praise_some: 3
    drop_praise_many_credit: 2
    drop_praise_some_credit: 1
    prior_drops_many: 2
    prior_drops_many_reduction: 2
    prior_drops_one_reduction: 1
    drop_standing_high_points: 6
    drop_standing_mid_points: 3
    drop_standing_high_reduction: 2
    drop_standing_mid_reduction: 1
  rule: >
    The shopper disputes a dropped-batch violation in the Cartwise app, the app offers the dispute on the most recent
    dropped-batch violation on the account, and the dispute is decided at once on the records of that violation's
    batch and of the account: it removes the dropped-batch excusal points from the violation, booked as one cleared
    entry with removal reason dispute_upheld. The dropped-batch excusal points are the drop excusal credit, capped at
    the points the disputed violation was recorded with. The standard drop excusal credit is the forfeited-offer credit
    plus the reliability credit plus the drop praise credit, used as they stand whenever the batch was released, less
    the prior-drop reduction and less the drop standing reduction, never below zero, where the standard forfeited-offer
    credit, reliability credit, drop praise credit, prior-drop reduction and drop standing reduction are each zero
    points. The points a dropped-batch dispute removes are not fixed until no wrong-address dispute on the account stands
    submitted and undecided. The points a dropped-batch dispute removes are worked out only after every
    alcohol-procedure dispute on the account has been decided. Before the points a dropped-batch dispute removes are
    fixed, every late-delivery dispute on the account must carry a decision. The forfeited-offer credit follows the pay
    shown on the dropped batch's offer and the earnings the batch paid: an offer of forfeit_large_usd or more on a batch
    that paid no earnings gives forfeit_large_credit; an offer from forfeit_mid_usd up to but not including
    forfeit_large_usd on a batch that paid no earnings gives forfeit_mid_credit; any other case gives no credit. The
    reliability credit counts the batches for which the shopper was paid base pay less than one whole month before the
    dispute: reliability_high_batches or more give reliability_high_credit; from reliability_mid_batches up to one fewer
    than reliability_high_batches give reliability_mid_credit; fewer give no credit. The drop praise credit counts the
    5-star ratings the shopper received less than one whole month before the dispute: drop_praise_many or more give
    drop_praise_many_credit; from drop_praise_some up to one fewer than drop_praise_many give drop_praise_some_credit;
    fewer give no credit. The three credits are added, and that sum is then adjusted by how soon the batch was released,
    counted in calendar days from the day it was accepted to the day it was dropped: a batch released on the day it was
    accepted has the sum doubled; a batch released on the next day has it increased by half of itself, the half rounded
    up to a whole point; a batch released two or more days after acceptance has it used as it stands. The prior-drop
    reduction counts the other dropped-batch violations recorded on the account less than twelve whole months before the
    dispute, the disputed one not counted: prior_drops_many or more take off prior_drops_many_reduction; exactly one
    takes off prior_drops_one_reduction; none takes off nothing. The drop standing reduction looks at the account's other
    standing violation points, meaning the points of every recorded violation less the points of every cleared entry,
    the disputed violation's own recorded points left out: drop_standing_high_points or more take off
    drop_standing_high_reduction; from drop_standing_mid_points up to one fewer than drop_standing_high_points take off
    drop_standing_mid_reduction; fewer take off nothing. The release-adjusted sum has the prior-drop reduction and the
    drop standing reduction each subtracted once, a negative figure counts as zero, and the result is then capped at the
    recorded points of the disputed violation.
  prerequisite:
  - problem: shopper_ext_wrong_address_excusal
    kind: value_input
    gate: drop_other_standing_points
    form: state
    policy_source: >-
      The points a dropped-batch dispute removes are not fixed until no wrong-address dispute on the account stands
      submitted and undecided.
    condition: >-
      No violation dispute of a wrong-address violation on the shopper account has appeal status submitted.
    resolved_by: decide_wrong_address_dispute_4037a75e
    effect: >-
      Deciding the submitted wrong-address dispute books a cleared entry against that violation, which lowers the
      account's other standing points and can move the drop standing reduction down a tier.
  - problem: shopper_ext_alcohol_procedure_excusal
    kind: value_input
    gate: drop_other_standing_points
    form: state
    policy_source: >-
      The points a dropped-batch dispute removes are worked out only after every alcohol-procedure dispute on the
      account has been decided.
    condition: >-
      No violation dispute of an alcohol-procedure violation on the shopper account has appeal status submitted.
    resolved_by: decide_alcohol_procedure_dispute_63dedfc1
    effect: >-
      Deciding the submitted alcohol-procedure dispute books a cleared entry against that violation, which lowers the
      account's other standing points and can move the drop standing reduction down a tier.
  - problem: shopper_ext_late_delivery_excusal
    kind: value_input
    gate: drop_other_standing_points
    form: state
    policy_source: >-
      Before the points a dropped-batch dispute removes are fixed, every late-delivery dispute on the account must carry
      a decision.
    condition: >-
      No violation dispute of a late-delivery violation on the shopper account has appeal status submitted.
    resolved_by: decide_late_delivery_dispute_3251c6fd
    effect: >-
      Deciding the submitted late-delivery dispute books a cleared entry when the lateness credit reaches the mark,
      which lowers the account's other standing points and can move the drop standing reduction down a tier.
  cross_category:
  - category: batch
    as: history
    reads: [batches.shown_pay_usd, batches.earnings_usd, batches.accepted_at, batches.dropped_date, batch_events.pay_component]
    note: The dropped batch's own record gives the shown pay, the earnings and the acceptance and drop dates behind the
      forfeited-offer credit and the release adjustment; the batch ledger's base-pay rows give the reliability credit.
  compute:
  - dr_entry: "LATEST('shopper_events', 'shopper_event_id', event_type='shopper_violation_recorded', violation_type='batch_dropped')"
  - dr_recorded: "LATEST('shopper_events', 'points', event_type='shopper_violation_recorded', shopper_event_id=dr_entry)"
  - dr_batch: "LATEST('shopper_events', 'batch_id', event_type='shopper_violation_recorded', shopper_event_id=dr_entry)"
  - dr_shown_pay: "CFIELD('batch', 'shown_pay_usd', batch_id=dr_batch)"
  - dr_earnings: "CFIELD('batch', 'earnings_usd', batch_id=dr_batch)"
  - forfeit_credit: "K('forfeit_large_credit') if (dr_shown_pay >= K('forfeit_large_usd') and dr_earnings == 0) else (K('forfeit_mid_credit') if (dr_shown_pay >= K('forfeit_mid_usd') and dr_earnings == 0) else 0)"
  - dr_paid_batches: "XCOUNT('batch', 'batch_events', within_months=1, event_type='batch_pay_posted', pay_component='batch_base')"
  - reliability_credit: "K('reliability_high_credit') if dr_paid_batches >= K('reliability_high_batches') else (K('reliability_mid_credit') if dr_paid_batches >= K('reliability_mid_batches') else 0)"
  - dr_five_star: "COUNT('shopper_events', within_months=1, event_type='shopper_rating_received', rating=5)"
  - drop_praise_credit: "K('drop_praise_many_credit') if dr_five_star >= K('drop_praise_many') else (K('drop_praise_some_credit') if dr_five_star >= K('drop_praise_some') else 0)"
  - dr_accepted: "CFIELD('batch', 'accepted_at', batch_id=dr_batch)"
  - dr_dropped: "CFIELD('batch', 'dropped_date', batch_id=dr_batch)"
  - dr_held_days: "DAYS(dr_accepted, dr_dropped)"
  - release_adjusted_credit: "(forfeit_credit + reliability_credit + drop_praise_credit) * 2 if dr_held_days == 0 else ((forfeit_credit + reliability_credit + drop_praise_credit) + (forfeit_credit + reliability_credit + drop_praise_credit + 1) // 2 if dr_held_days == 1 else forfeit_credit + reliability_credit + drop_praise_credit)"
  - prior_drop_violations: "COUNT('shopper_events', within_months=12, event_type='shopper_violation_recorded', violation_type='batch_dropped') - 1"
  - prior_drop_reduction: "K('prior_drops_many_reduction') if prior_drop_violations >= K('prior_drops_many') else (K('prior_drops_one_reduction') if prior_drop_violations == 1 else 0)"
  - drop_other_standing_points: "SUM('shopper_events', 'points', event_type='shopper_violation_recorded') - SUM('shopper_events', 'points', event_type='shopper_violation_cleared') - dr_recorded"
  - drop_standing_reduction: "K('drop_standing_high_reduction') if drop_other_standing_points >= K('drop_standing_high_points') else (K('drop_standing_mid_reduction') if drop_other_standing_points >= K('drop_standing_mid_points') else 0)"
  - drop_excusal_credit: "MX(0, release_adjusted_credit - prior_drop_reduction - drop_standing_reduction)"
  - result: "MN(dr_recorded, drop_excusal_credit)"
  compute_basis:
    dr_entry: "the app offers the dispute on the most recent dropped-batch violation on the account"
    dr_recorded: "The dropped-batch excusal points are the drop excusal credit, capped at the points the disputed violation was recorded with."
    dr_batch: "the dispute is decided at once on the records of that violation's batch and of the account"
    dr_shown_pay: "The forfeited-offer credit follows the pay shown on the dropped batch's offer and the earnings the batch paid"
    dr_earnings: "The forfeited-offer credit follows the pay shown on the dropped batch's offer and the earnings the batch paid"
    forfeit_credit: "an offer of forfeit_large_usd or more on a batch that paid no earnings gives forfeit_large_credit; an offer from forfeit_mid_usd up to but not including forfeit_large_usd on a batch that paid no earnings gives forfeit_mid_credit; any other case gives no credit."
    dr_paid_batches: "The reliability credit counts the batches for which the shopper was paid base pay less than one whole month before the dispute"
    reliability_credit: "reliability_high_batches or more give reliability_high_credit; from reliability_mid_batches up to one fewer than reliability_high_batches give reliability_mid_credit; fewer give no credit."
    dr_five_star: "The drop praise credit counts the 5-star ratings the shopper received less than one whole month before the dispute"
    drop_praise_credit: "drop_praise_many or more give drop_praise_many_credit; from drop_praise_some up to one fewer than drop_praise_many give drop_praise_some_credit; fewer give no credit."
    dr_accepted: "counted in calendar days from the day it was accepted to the day it was dropped"
    dr_dropped: "counted in calendar days from the day it was accepted to the day it was dropped"
    dr_held_days: "counted in calendar days from the day it was accepted to the day it was dropped"
    release_adjusted_credit: "The three credits are added, and that sum is then adjusted by how soon the batch was released, counted in calendar days from the day it was accepted to the day it was dropped: a batch released on the day it was accepted has the sum doubled; a batch released on the next day has it increased by half of itself, the half rounded up to a whole point; a batch released two or more days after acceptance has it used as it stands."
    prior_drop_violations: "The prior-drop reduction counts the other dropped-batch violations recorded on the account less than twelve whole months before the dispute, the disputed one not counted"
    prior_drop_reduction: "prior_drops_many or more take off prior_drops_many_reduction; exactly one takes off prior_drops_one_reduction; none takes off nothing."
    drop_other_standing_points: "The drop standing reduction looks at the account's other standing violation points, meaning the points of every recorded violation less the points of every cleared entry, the disputed violation's own recorded points left out"
    drop_standing_reduction: "drop_standing_high_points or more take off drop_standing_high_reduction; from drop_standing_mid_points up to one fewer than drop_standing_high_points take off drop_standing_mid_reduction; fewer take off nothing."
    drop_excusal_credit: "The release-adjusted sum has the prior-drop reduction and the drop standing reduction each subtracted once, a negative figure counts as zero"
    result: "and the result is then capped at the recorded points of the disputed violation."
  factors:
  - id: drop_forfeited_offer_credit
    effect: parameter
    decides: forfeit_credit
    bindings: [dr_batch, dr_shown_pay, dr_earnings, forfeit_credit]
    ladder:
    - when: the dropped batch's offer showed forfeit_large_usd or more and the batch paid no earnings
      value: "K('forfeit_large_credit')"
    - when: the offer showed from forfeit_mid_usd up to but not including forfeit_large_usd and the batch paid no earnings
      value: "K('forfeit_mid_credit')"
    - when: otherwise
      value: "0"
    baseline:
      forfeit_credit: "0"
    evidence: [cross_category]
    cross_difficulty: batch
  - id: drop_reliability_credit
    effect: parameter
    decides: reliability_credit
    bindings: [dr_paid_batches, reliability_credit]
    ladder:
    - when: reliability_high_batches or more batches paid base pay less than one whole month before the dispute
      value: "K('reliability_high_credit')"
    - when: from reliability_mid_batches up to one fewer than reliability_high_batches such batches
      value: "K('reliability_mid_credit')"
    - when: otherwise
      value: "0"
    baseline:
      reliability_credit: "0"
    evidence: [cross_category, history]
    cross_difficulty: batch
  - id: drop_praise_credit
    effect: parameter
    decides: drop_praise_credit
    bindings: [dr_five_star, drop_praise_credit]
    ladder:
    - when: drop_praise_many or more 5-star ratings received less than one whole month before the dispute
      value: "K('drop_praise_many_credit')"
    - when: from drop_praise_some up to one fewer than drop_praise_many such ratings
      value: "K('drop_praise_some_credit')"
    - when: otherwise
      value: "0"
    baseline:
      drop_praise_credit: "0"
    evidence: [history]
    cross_difficulty: null
  - id: drop_release_adjustment
    effect: method
    decides: release_adjusted_credit
    bindings: [dr_accepted, dr_dropped, dr_held_days, release_adjusted_credit]
    ladder:
    - when: the batch was released on the day it was accepted
      method: the sum of the three credits is doubled
    - when: the batch was released on the next calendar day
      method: the sum is increased by half of itself, the half rounded up to a whole point
    - when: otherwise (released two or more days after acceptance)
      method: the sum is used as it stands
    baseline:
      release_adjusted_credit: "forfeit_credit + reliability_credit + drop_praise_credit"
    evidence: [date, cross_category]
    cross_difficulty: batch
  - id: drop_prior_reduction
    effect: parameter
    decides: prior_drop_reduction
    bindings: [prior_drop_violations, prior_drop_reduction]
    ladder:
    - when: prior_drops_many or more other dropped-batch violations recorded less than twelve whole months back
      value: "K('prior_drops_many_reduction')"
    - when: exactly one other such violation
      value: "K('prior_drops_one_reduction')"
    - when: otherwise (none)
      value: "0"
    baseline:
      prior_drop_reduction: "0"
    evidence: [history]
    cross_difficulty: null
  - id: drop_standing_reduction
    effect: parameter
    decides: drop_standing_reduction
    bindings: [drop_other_standing_points, drop_standing_reduction]
    ladder:
    - when: drop_standing_high_points or more other standing violation points
      value: "K('drop_standing_high_reduction')"
    - when: from drop_standing_mid_points up to one fewer than drop_standing_high_points other standing points
      value: "K('drop_standing_mid_reduction')"
    - when: otherwise
      value: "0"
    baseline:
      drop_standing_reduction: "0"
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      The dropped-batch excusal points are the drop excusal credit, capped at the points the disputed violation was
      recorded with. The standard drop excusal credit is the forfeited-offer credit plus the reliability credit plus the
      drop praise credit, used as they stand whenever the batch was released, less the prior-drop reduction and less the
      drop standing reduction, never below zero, where the standard forfeited-offer credit, reliability credit, drop
      praise credit, prior-drop reduction and drop standing reduction are each zero points.
    params: []
  inputs:
    history:
    - {table: shopper_events, aggregate: sum, field: points, filters: {event_type: shopper_violation_recorded}}
    - {table: shopper_events, aggregate: sum, field: points, filters: {event_type: shopper_violation_cleared}}
    - {table: shopper_events, aggregate: count, field: shopper_event_id, within_months: 12, filters: {event_type: shopper_violation_recorded, violation_type: batch_dropped}}
    - {category: batch, table: batch_events, aggregate: count, field: batch_event_id, within_months: 1, filters: {event_type: batch_pay_posted, pay_component: batch_base}}
    cross_category: [batch]
