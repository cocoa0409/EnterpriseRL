    A renewed driver licence or vehicle insurance document is accepted only when its expiry date is after the date
    it is recorded, and it replaces the expiry date on file. Documents are recorded for accounts in any status except
    closed. Recording a renewed document on a documents_expired account does not by itself reactivate it; reactivation
    follows shopper_evt_reactivation.
