        level_min_on_time_pct: =level_min_on_time_pct, level_demotion_grace_cycles: =level_demotion_grace_cycles}
  measures: [shopper_msr_batches_30d, shopper_msr_avg_rating, shopper_msr_on_time_pct_30d]
- id: shopper_evt_documents
