name: env_0028_clinical_laboratory_company
company: Halverson Clinical Laboratories

background: |
  Halverson Clinical Laboratories is an independent national clinical laboratory headquartered in Columbus, Ohio, running four regional core laboratories, a reference laboratory for esoteric testing, a molecular diagnostics center, a genetics and genomics laboratory and about 640 Patient Service Centers across 22 states.
  It performs roughly 190,000 patient encounters a day, most of them ordered by physicians, health centers and hospital outreach programs, and a smaller but growing share bought directly by consumers online.
  Patient Services is the contact center patients reach by phone, chat and the patient portal, and its tone is plain, unhurried and careful with health and billing information.
  A patient's tests are held as Laboratory Test Orders, one accession per service class: Routine Clinical Testing, Specialty Clinical Testing, Esoteric Reference Testing, Molecular Infectious Disease Testing, Clinical Toxicology Testing, Anatomic Pathology & Cytology, and Hereditary & Reproductive Genetic Testing; each order books a chargemaster line for every test, reflex, add-on, fee and credit.
  Specimens are taken at Specimen Collection Appointments: a Patient Service Center Walk-In Visit, a Patient Service Center Scheduled Appointment, a Fasting Priority Appointment, a Timed Glucose Tolerance Collection, a Pediatric Collection Appointment, a Mobile In-Home Collection Visit or a Facility Bedside Collection Visit, and any collection-service fees are booked on the visit.
  Patients keep their health plans on file as Insurance Coverage & Claims under one of seven payer classes: Original Medicare Part B, Medicare Advantage Plan, Medicare Supplement Plan, Medicaid Managed Care Plan, TRICARE Prime and Select, Commercial In-Network Plan and Commercial Out-of-Network Plan, and every claim, remittance, denial, correction and appeal is booked against the coverage it was filed with.
  Whatever a patient owes for an order lands on one Patient Invoice in a billing class: Self-Pay Patient Invoice, Consumer Test Purchase Invoice, Insured Patient Responsibility Invoice, Out-of-Network Balance Invoice, Medicare Beneficiary Liability Invoice or Medicaid Copay Invoice, carrying statements, payments, adjustments and refunds.
  Balances can be spread over a Patient Payment Plan of 3, 6, 9, 12 or 18 months, or a 24-Month Extended Payment Plan, which carries one or more invoices and books every enrollment, installment and release.
  The Patient Financial Assistance Program discounts eligible invoices through a Financial Assistance 25% Discount, 50% Discount, 75% Discount or Full Discount, a Presumptive Eligibility Full Discount, or a Catastrophic Medical Hardship Adjustment, each held as a case from application to award.
  Ordering organizations hold Physician Client Accounts as an Independent Practice Client Account, Group Practice Client Account, Multispecialty Medical Group Account, Federally Qualified Health Center Account, Hospital Outreach Reference Account or Occupational Health Employer Account, with their client-billed tests, payments, supplies and courier pickups on the account.
  Callers are mostly patients, along with parents of minor patients and office staff of ordering practices.
  A typical patient has one or two coverages on file, several orders across a couple of service classes, one or more collection visits, and an invoice for each order where something was left to pay after insurance or at self-pay prices.
  Many arrive with history behind them: a specimen rejected and recollected, a claim denied and refiled, statements already sent, a payment plan running, or an assistance application waiting on documents.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: handoff_requests

difficulties:
  - name: test_orders_and_results
    claim:
      categories: [orders]
      event_types: [orders_add_on_posted, orders_test_charge_credited, orders_test_charge_posted, orders_billing_method_changed, orders_estimate_issued, orders_abn_recorded, orders_consent_recorded, orders_cancelled_by_patient, orders_recollection_requested, orders_result_copy_requested]
    summary: >-
      Callers are patients, or the parent of a minor patient, asking about a test order they hold: why it is
      on hold, whether a test can still be added or cancelled, what it will cost if they pay themselves instead of
      using insurance, why a specimen was rejected, when results are due and how to get a copy. The setting varies
      along the service class of each order (from Routine Clinical Testing through Hereditary & Reproductive
      Genetic Testing), the order status from received through resulted, the billing method and the payer class of
      the coverage on the order, whether the order is consumer-initiated, and the order's history of charges,
      credits, rejections and recollection requests, often across several orders sharing one requisition. The
      governing rules are the requisition-encounter and intake rules (orders_agg_requisition_encounter,
      orders_order_intake), the add-on window and cap (orders_evt_add_on), rejection and recollection limits
      (orders_evt_specimen_rejection), pre-collection and testing holds (orders_evt_order_holds), the Medicare ABN
      and prior-authorization rules (orders_evt_medicare_abn, orders_evt_prior_authorization), informed consent
      (orders_evt_informed_consent), cancellation credits and handling fees (orders_evt_patient_cancellation),
      switching between insurance and self-pay against claim records and per-class windows
      (orders_evt_billing_method_change), good faith estimates (orders_evt_good_faith_estimate), charge credits and
      duplicates (orders_evt_charge_credit), and turnaround, report copies and corrected reports
      (orders_evt_results_and_reports), several of which read the patient's coverage and claim records; in the
      domain an order is placed, collected and accessioned, may be held or rejected, and is then tested and
      resulted. Posting credits, estimates, billing-method switches, recollection requests and report-copy
      requests are agent service actions on a verified patient, while signing an ABN, signing a genetic informed
      consent and cancelling one's own order are the patient's own acts, handed to the patient as user actions.
      Requests no rule decides - interpreting a result, changing a diagnosis code the provider sent, overriding a
      payer's authorization decision, or testing a specimen the laboratory has already discarded - leave the
      agent only a POLICY_NOT_COVERED handoff.
  - name: collection_appointments
    claim:
      categories: [visits]
      event_types: [visits_appointment_booked, visits_appointment_rescheduled, visits_appointment_cancelled, visits_fee_assessed, visits_fee_waived, visits_fee_refunded]
    summary: >-
      Callers want to book, move or cancel a specimen collection, book a recollection after a rejected specimen,
      or question a fee charged for a mobile home visit, a late cancellation or a no-show. The setting varies
      along the visit type (Patient Service Center walk-in, scheduled, fasting, timed glucose tolerance and
      pediatric visits, mobile in-home visits and facility bedside draws), the visit status, the service zone and
      household add-ons of a home visit, Medicare homebound certification, whether the visit is a recollection,
      and the patient's history of no-shows, reschedules and courtesy waivers, while the order the visit collects
      may itself be awaiting a specimen, on hold or past its recollection deadline. The governing rules are the
      open-appointment caps (visits_agg_open_appointments), booking eligibility including order status, age
      bands, fasting cut-offs, service zones and no-show restrictions (visits_booking_eligibility), reschedule
      limits and notice (visits_evt_reschedule), late-cancellation and no-show fees
      (visits_evt_cancellation_and_no_show), the fee schedule by zone, household members and weekends with its
      homebound exemption (visits_evt_fee_assessment), check-in and incomplete collections
      (visits_evt_check_in_and_collection), waivers with their request window and 12-month courtesy limit
      (visits_evt_fee_waiver), and payment and refunds (visits_evt_fee_payment_and_refund); in the domain a visit
      is booked, then checked in and collected, or cancelled or missed, and fees follow the outcome. Booking,
      rescheduling, cancelling, assessing, waiving and refunding are agent service actions on a verified patient,
      whereas paying a fee with the patient's own card is the patient's own act. A request no rule decides - a
      home visit outside every service zone, a collection at a site or time the visit type does not offer, or
      compensation for a long lobby wait - leaves the agent only a POLICY_NOT_COVERED handoff.
  - name: insurance_claims_and_denials
    claim:
      categories: [coverage]
      event_types: [coverage_added, coverage_resubmitted_for_verification, coverage_terminated, coverage_details_updated, coverage_claim_resubmitted, coverage_appeal_filed, coverage_patient_responsibility_assigned]
    summary: >-
      Callers are patients whose test claim was denied or paid less than they expected, who want new or
      corrected insurance put on file, or who ask why a balance was billed to them after insurance. The setting
      varies along the payer class of each coverage, its verification status and dates, the coordination order
      across up to three live coverages, the denial code and its group on each claim line, the claim's history of
      corrections and appeal levels already used, and the order's ABN, authorization and date-of-service facts.
      The governing rules are the live-coverage cap and duplicate check (coverage_agg_multi_holding), the
      coordination-of-benefits order including the Medicare secondary-payer threshold
      (coverage_agg_coordination_of_benefits), verification and resubmission windows (coverage_evt_verification),
      termination dating and coordination updates (coverage_evt_termination_and_updates), timely filing
      (coverage_evt_claim_submission), adjudication, cost share and the out-of-network balance cap
      (coverage_evt_adjudication), which denials may become the patient's (coverage_evt_denial_liability),
      corrected-claim windows and limits (coverage_evt_corrected_claim), and appeal windows, levels and
      authorization (coverage_evt_appeals); in the domain a coverage is added and verified, a claim is filed,
      remitted or denied, and a denial is then corrected, appealed, written off or assigned. Adding and correcting
      coverage, refiling corrected claims, filing appeals and assigning patient responsibility are agent service
      actions on a verified patient, while updating other-coverage information with the payer and signing an
      authorized-representative form for an appeal are acts only the patient can perform. Disputes no rule
      decides - asking the laboratory to overrule a payer's medical-necessity policy, to bill a payer after its
      deadlines have all passed, or to appeal past the levels the laboratory pursues - leave the agent only a
      POLICY_NOT_COVERED handoff.
  - name: payment_plans
    claim:
      categories: [plans]
      event_types: [plans_plan_created, plans_terms_accepted, plans_invoice_enrolled, plans_installment_paid, plans_reinstated, plans_schedule_changed, plans_installment_deferred, plans_cancelled_by_patient, plans_balance_released]
    summary: >-
      Callers owe one or more patient invoices and want to pay over time, add a new bill to a plan they already
      have, change their due date, skip a month for a hardship, catch up after missed installments, or end a plan.
      The setting varies along the plan term (3, 6, 9, 12 and 18 months and the 24-month extended plan), the plan
      status from pending acceptance through defaulted, the total and the billing classes of the invoices the
      patient owes, each invoice's own status (open, on hold, in collections, already on a plan), the patient's
      default history and assistance-case history, and the installments already paid, missed or deferred. The
      governing rules are the one-live-plan rule (plans_agg_multi_holding), consolidation of invoices
      (plans_agg_invoice_consolidation), term bands, down payment, installment arithmetic and minimum installment
      (plans_term_selection_and_terms), acceptance (plans_evt_acceptance), which invoices may be enrolled
      (plans_evt_invoice_eligibility), installments and grace (plans_evt_installments), past-due and default
      (plans_evt_delinquency), reinstatement windows and counts (plans_evt_reinstatement), schedule changes and
      hardship skips (plans_evt_schedule_changes), releases after assistance or insurance credits
      (plans_evt_release_and_assistance), and cancellation and payoff (plans_evt_cancellation_and_payoff); in the
      domain a plan is offered, accepted, paid monthly, and either paid off, cancelled or defaulted. Offering a
      plan, enrolling invoices, posting payments, changing the schedule and reinstating are agent service
      actions on a verified patient, while accepting plan terms and ending a plan are the patient's own acts.
      Requests no rule decides - a plan longer than 24 months, interest-bearing or reduced-balance settlements,
      or putting collection-service fees on a plan - leave the agent only a POLICY_NOT_COVERED handoff.
  - name: financial_assistance
    claim:
      categories: [assistance]
      event_types: [assistance_application_submitted, assistance_documents_requested, assistance_document_received, assistance_documents_extended, assistance_review_started, assistance_tier_redetermined, assistance_application_approved, assistance_application_denied, assistance_discount_applied, assistance_application_withdrawn]
    summary: >-
      Callers cannot afford their laboratory bills and want to apply for financial assistance, find out what is
      missing from an application, send documents, renew an award, or see an approved discount reach their
      invoices. The setting varies along the tier the household qualifies for (the 25%, 50%, 75% and full income
      tiers, presumptive eligibility through program enrollment, and the catastrophic medical hardship
      adjustment), the case status from submitted through approved or denied, household size and income against
      the poverty guideline, insurance status, the documents received and their dates, and the patient's invoices
      by billing class, date of service, claim status and whether they sit on a payment plan or in collections.
      The governing rules are the single-live-case and renewal rules (assistance_agg_single_open_case), tier
      determination, the poverty-guideline percentage and best-tier selection (assistance_tier_determination),
      documentation, extensions and the document deadline (assistance_evt_documentation), decisions and award
      windows (assistance_evt_decision), which invoices are discounted and by how much, including the hardship
      cap and refunds of prior payments (assistance_evt_discount_application), reversals and rescission
      (assistance_evt_reversal_and_rescission), and review holds (assistance_evt_award_term_and_review_holds);
      in the domain an application is submitted, documented, reviewed, decided, and an approved award is applied
      invoice by invoice. Opening an application from what the applicant states, recording documents, starting
      review, redetermining the tier, deciding and applying discounts are agent service actions on a verified
      patient, while withdrawing an application is the applicant's own act. Requests no rule decides - assistance
      for a consumer test purchase or a mobile-visit fee, a discount on balances outside the award window, or an
      exception to the income limits - leave the agent only a POLICY_NOT_COVERED handoff.
