events:
  - type: assistance_application_submitted
    target: assistance_cases
    mutation: create
    meaning: A patient applies for financial assistance; the case opens at the tier the stated income band (or enrollment) indicates.
    grain: one row per application
    fields:
      customer_id: The applicant (the patient, or the parent or guardian's own profile for a minor's balances).
      variant_name: The tier the application is assessed at.
      application_date: Date the application was received.
      application_channel: How it was submitted.
      household_size: Household size as defined by the program.
      annual_household_income: Annual household income stated or documented.
      fpl_percent: Household income as a percent of the poverty guideline.
      insurance_status: Whether the applicant has health coverage.
      presumptive_basis: The enrollment claimed for presumptive eligibility, or none.
    triggers:
      - event: invoices:invoices_hold_placed
        map: {hold_reason: assistance_review, hold_placed_date: application_date}
  - type: assistance_documents_requested
    target: assistance_cases
    mutation: {transition: {from: submitted, to: pending_documents}}
    meaning: Missing documents are requested with a due date.
    grain: one row per transaction
    fields:
      documents_requested_date: Date of the request.
      documents_due_date: Date by which the documents must arrive.
    triggers: []
  - type: assistance_documents_extended
    target: assistance_cases
    mutation: update
    meaning: The document due date is extended once at the applicant's request.
    grain: one row per transaction
    fields:
      documents_due_date: Extended due date.
      extension_count: Incremented by one.
    triggers: []
  - type: assistance_document_received
    target: assistance_events
    meaning: A supporting document is received for the case.
    grain: one row per document type per receipt date
    distinguish_by: [document_type, event_date]
    fields:
      event_date: Date received.
      document_type: Kind of document.
      document_date: Date printed on the document (tax year end, statement date, letter date).
    triggers: []
  - type: assistance_review_started
    target: assistance_cases
    mutation: {transition: [{from: submitted, to: under_review}, {from: pending_documents, to: under_review}]}
    meaning: The application is complete and goes to review.
    grain: one row per transaction
    fields:
      documents_complete_date: Date the last required document was received (the application date when complete at intake).
    triggers: []
  - type: assistance_tier_redetermined
    target: assistance_cases
    mutation: update
    meaning: Documents show a different income, household size or band, and the case is reassessed at another tier before the decision.
    grain: one row per transaction
    fields:
      variant_name: The tier the documents support.
      household_size: Documented household size.
      annual_household_income: Documented annual household income.
      fpl_percent: Recomputed percent of the poverty guideline.
    triggers: []
  - type: assistance_application_approved
    target: assistance_cases
    mutation: {transition: [{from: under_review, to: approved}, {from: submitted, to: approved}]}
    meaning: The case is approved and the award window is set.
    grain: one row per transaction
    fields:
      decision_date: Date of the decision.
      award_start_date: First date of service covered (application date less lookback_days).
      award_end_date: Last date of service covered and last day of the award.
    triggers:
      - event: assistance:assistance_discount_applied
        map: {event_date: decision_date}
  - type: assistance_application_denied
    target: assistance_cases
    mutation: {transition: [{from: under_review, to: denied}, {from: pending_documents, to: denied}]}
    meaning: The case is denied.
    grain: one row per transaction
    fields:
      decision_date: Date of the decision.
      denial_reason: Why it was denied.
      closed_date: Same as the decision date.
    triggers: []
  - type: assistance_application_withdrawn
    target: assistance_cases
    mutation: {transition: [{from: submitted, to: withdrawn}, {from: pending_documents, to: withdrawn}, {from: under_review, to: withdrawn}]}
    meaning: The applicant withdraws the application.
    grain: one row per transaction
    fields:
      closed_date: Date of withdrawal.
    triggers: []
  - type: assistance_award_expired
    target: assistance_cases
    mutation: {transition: {from: approved, to: expired}}
    meaning: The award reaches its end date.
    grain: one row per transaction
    fields:
      closed_date: The day after award_end_date.
    triggers: []
  - type: assistance_award_rescinded
    target: assistance_cases
    mutation: {transition: {from: approved, to: rescinded}}
    meaning: The award is rescinded for misrepresentation.
    grain: one row per transaction
    fields:
      closed_date: Date of rescission.
    triggers:
      - event: assistance:assistance_discount_reversed
        map: {reversal_reason: misrepresentation_finding, event_date: closed_date}
  - type: assistance_discount_applied
    target: assistance_events
    meaning: The award's discount is applied to one covered invoice.
    grain: one row per invoice per case
    distinguish_by: [invoice_id]
    fields:
      event_date: Date the discount was applied.
      invoice_id: The invoice discounted.
      discount_amount: Discount applied; positive.
    account: award_discount
    direction: in
    triggers:
      - event: invoices:invoices_adjustment_posted
        map: {amount: discount_amount, adjustment_type: financial_assistance, assistance_case_id: assistance_case_id, event_date: event_date}
  - type: assistance_discount_reversed
    target: assistance_events
    meaning: A discount applied to an invoice is reversed in whole or in part.
    grain: one row per reversed discount
    distinguish_by: [reversed_event_id, reversal_reason]
    fields:
      event_date: Date of the reversal.
      invoice_id: The invoice whose discount is reversed.
      discount_amount: Amount reversed; positive.
      reversed_event_id: The discount line reversed.
      reversal_reason: Why it was reversed.
    account: award_discount
    direction: out
    triggers:
      - event: invoices:invoices_responsibility_posted
        map: {amount: discount_amount, event_date: event_date}

measures:
  - id: assistance_msr_open_cases
    window: current state
    measure: count of the customer's assistance cases whose status is submitted, pending_documents, under_review or approved
  - id: assistance_msr_awards_12m
    window: the 365 calendar days before the decision date, the decision date included
    measure: count of the customer's assistance cases with status approved, expired or rescinded whose decision_date falls in the window
  - id: assistance_msr_invoice_responsibility_total
    window: the life of the invoice
    measure: sum of invoices_responsibility_posted amounts on the invoice less every invoices_adjustment_posted amount of a type other than financial_assistance and prompt_pay_discount
  - id: assistance_msr_hardship_responsibility
    window: dates of service in the hardship_lookback_months calendar months before the application date, the application date included
    measure: sum of assistance_msr_invoice_responsibility_total over the customer's invoices of eligible billing classes whose date_of_service falls in the window

policies:
  - id: assistance_agg_multi_holding
    subject: [assistance_application_submitted]
    rule: A patient accumulates assistance cases over time (applications, renewals, denials, expired awards); the number of cases on file is not capped, and the number that may be live at once is set by the single-open-case rule.
    eligibility: []
    params: {max_per_customer: null}

  - id: assistance_agg_single_open_case
    subject: [assistance_application_submitted]
    rule: >-
      A patient may have only one live case, meaning a case whose status is submitted, pending_documents, under_review or approved (assistance_msr_open_cases), with a single exception: a renewal application may be submitted while an award is approved, but only within renewal_window_days calendar days before that award's end date.
      A new application while another live case exists is not opened; the patient is told the status of the
      existing case. A patient may receive at most max_awards_per_12_months approvals with decision dates within
      any 365 days (assistance_msr_awards_12m). After a denial for income above the program limit, a new
      application is accepted only after reapplication_wait_days_after_income_denial calendar days unless the
      patient states that household income or size has changed; a denial for missing documents may be followed
      by a new application at once.
    eligibility:
      - id: one_live_case
        applies_to: [assistance_application_submitted]
        kind: dedup
        condition: "A patient may have only one live case, meaning a case whose status is submitted, pending_documents, under_review or approved (assistance_msr_open_cases), with a single exception: a renewal application may be submitted while an award is approved, but only within renewal_window_days calendar days before that award's end date."
        evidence_fields: [assistance_cases.customer_id, assistance_cases.status, assistance_cases.award_end_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[assistance_cases.customer_id]]
          action_bindings: {assistance_cases.customer_id: customer_id}
        dedup_contract:
          table: assistance_cases
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [submitted, pending_documents, under_review, approved]}
          distinct_fields: [award_end_date]
    measures: [assistance_msr_open_cases, assistance_msr_awards_12m]
    params:
      per_tier:
        Financial Assistance 25% Discount: {renewal_window_days: "=renewal_window_days", max_awards_per_12_months: "=max_awards_per_12_months", reapplication_wait_days_after_income_denial: "=reapplication_wait_days_after_income_denial"}
        Financial Assistance 50% Discount: {renewal_window_days: "=renewal_window_days", max_awards_per_12_months: "=max_awards_per_12_months", reapplication_wait_days_after_income_denial: "=reapplication_wait_days_after_income_denial"}
        Financial Assistance 75% Discount: {renewal_window_days: "=renewal_window_days", max_awards_per_12_months: "=max_awards_per_12_months", reapplication_wait_days_after_income_denial: "=reapplication_wait_days_after_income_denial"}
        Financial Assistance Full Discount: {renewal_window_days: "=renewal_window_days", max_awards_per_12_months: "=max_awards_per_12_months", reapplication_wait_days_after_income_denial: "=reapplication_wait_days_after_income_denial"}
        Presumptive Eligibility Full Discount: {renewal_window_days: "=renewal_window_days", max_awards_per_12_months: "=max_awards_per_12_months", reapplication_wait_days_after_income_denial: "=reapplication_wait_days_after_income_denial"}
        Catastrophic Medical Hardship Adjustment: {renewal_window_days: "=renewal_window_days", max_awards_per_12_months: "=max_awards_per_12_months", reapplication_wait_days_after_income_denial: "=reapplication_wait_days_after_income_denial"}

  - id: assistance_tier_determination
    subject: [assistance_application_submitted, assistance_tier_redetermined, assistance_application_approved]
    rule: >-
      Household size follows household_definition; annual household income counts the applicant and, where
      spouse_income_counted is true, a spouse or domestic partner, but never dependents
      (dependent_income_counted is false), taken from the most recent accepted income document (pay stubs
      covering the last pay_stub_period_days calendar days are annualized by multiplying their total by 365 and
      dividing by pay_stub_period_days; a tax return is used as filed). The percent of the federal poverty
      guideline is annual household income divided by the guideline for the household size (fpl_guideline_base
      for one person plus fpl_guideline_per_additional_person for each additional member), times 100, rounded to
      one decimal place. An income tier applies when fpl_percent is above fpl_min_pct and at most fpl_max_pct
      (the Full Discount band starts at zero income). No asset test applies. Presumptive Eligibility Full
      Discount applies, without an income assessment, to an applicant with current proof of one of
      presumptive_programs; documented homelessness is proved by a shelter or caseworker letter. Catastrophic
      Medical Hardship Adjustment applies when fpl_percent is at most its fpl_max_pct and the applicant's
      laboratory patient responsibility for the hardship window (assistance_msr_hardship_responsibility) exceeds
      hardship_liability_cap_pct_of_income percent of annual household income. When an applicant qualifies for
      more than one tier, the tier giving the larger total discount on the covered invoices applies; discounts of
      two tiers are never added together. When documents show a different band than the one stated at intake,
      the case is redetermined to the documented tier before the decision.
    eligibility: []
    measures: [assistance_msr_hardship_responsibility]
    params:
      fpl_guideline_base: 15650.00
      fpl_guideline_per_additional_person: 5500.00
      per_tier:
        Financial Assistance 25% Discount: {fpl_min_pct: "=fpl_min_pct", fpl_max_pct: "=fpl_max_pct", discount_pct: "=discount_pct"}
        Financial Assistance 50% Discount: {fpl_min_pct: "=fpl_min_pct", fpl_max_pct: "=fpl_max_pct", discount_pct: "=discount_pct"}
        Financial Assistance 75% Discount: {fpl_min_pct: "=fpl_min_pct", fpl_max_pct: "=fpl_max_pct", discount_pct: "=discount_pct"}
        Financial Assistance Full Discount: {fpl_min_pct: "=fpl_min_pct", fpl_max_pct: "=fpl_max_pct", discount_pct: "=discount_pct"}
        Presumptive Eligibility Full Discount: {fpl_min_pct: "=fpl_min_pct", fpl_max_pct: "=fpl_max_pct", discount_pct: "=discount_pct"}
        Catastrophic Medical Hardship Adjustment: {fpl_min_pct: "=fpl_min_pct", fpl_max_pct: "=fpl_max_pct", discount_pct: "=discount_pct"}
    formula:
      fpl_percent: round(annual_household_income / (fpl_guideline_base + fpl_guideline_per_additional_person * (household_size - 1)) * 100, 1)

  - id: assistance_evt_documentation
    subject: [assistance_documents_requested, assistance_document_received, assistance_documents_extended, assistance_review_started, assistance_application_denied]
    rule: >-
      An application that needs documents (income_documentation_required or proof_of_enrollment_required) and
      lacks them is set pending_documents with a due date documents_due_days calendar days after the request
      date. Only document types in accepted_income_documents count; a zero-income attestation counts only where
      zero_income_attestation_accepted is true; a tax return counts only for the tax_return_years_accepted most
      recent filed years; a proof of enrollment counts only when dated no more than enrollment_proof_max_age_days
      before the application date. An uninsured applicant whose fpl_percent is at or below a non-zero
      medicaid_screening_fpl_threshold_pct must also provide a Medicaid application or denial. At the applicant's
      request the due date may be extended by document_extension_days, at most max_document_extensions times per
      case. When every required document is in, the case goes to review. A case may be denied for missing documents only after the document period that starts when the documents are requested has passed.
      The document period counts calendar days from the request date as day 0, plus document_extension_days for each extension granted, and denial is allowed only from the day after the last day of the period.
    eligibility:
      - id: documents_overdue
        applies_to: [assistance_application_denied]
        kind: time
        condition: A case may be denied for missing documents only after the document period that starts when the documents are requested has passed.
        evidence_fields: [assistance_cases.documents_requested_date, assistance_cases.assistance_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[assistance_cases.assistance_case_id]]
          action_bindings: {assistance_cases.assistance_case_id: assistance_case_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the documents are requested
          anchor_source: assistance_cases.documents_requested_date
          relation: not_before
          duration_source: variants.documents_due_days
          unit: calendar_days
          counting_rule: The document period counts calendar days from the request date as day 0, plus document_extension_days for each extension granted, and denial is allowed only from the day after the last day of the period.
          boundary: exclusive
    params:
      per_tier:
        Financial Assistance 25% Discount: {documents_due_days: "=documents_due_days", document_extension_days: "=document_extension_days", max_document_extensions: "=max_document_extensions"}
        Financial Assistance 50% Discount: {documents_due_days: "=documents_due_days", document_extension_days: "=document_extension_days", max_document_extensions: "=max_document_extensions"}
        Financial Assistance 75% Discount: {documents_due_days: "=documents_due_days", document_extension_days: "=document_extension_days", max_document_extensions: "=max_document_extensions"}
        Financial Assistance Full Discount: {documents_due_days: "=documents_due_days", document_extension_days: "=document_extension_days", max_document_extensions: "=max_document_extensions"}
        Presumptive Eligibility Full Discount: {documents_due_days: "=documents_due_days", document_extension_days: "=document_extension_days", max_document_extensions: "=max_document_extensions"}
        Catastrophic Medical Hardship Adjustment: {documents_due_days: "=documents_due_days", document_extension_days: "=document_extension_days", max_document_extensions: "=max_document_extensions"}
    formula:
      when_not: extension_count >= max_document_extensions

  - id: assistance_evt_decision
    subject: [assistance_application_approved, assistance_application_denied, assistance_application_withdrawn]
    rule: >-
      A complete application is decided within decision_business_days business days and the letter goes out
      within decision_notice_business_days business days. An application is approved only at a tier whose
      conditions the documented facts meet; it is denied with reason income_above_program_limit when no tier
      applies, documentation_not_received under the documentation rule, or balances_not_eligible when the
      patient has no invoice the award could discount. On approval the award covers dates of service from
      award_start_date, which is the application date minus lookback_days calendar days, through award_end_date,
      which is the application date plus award_term_months calendar months (when that month has no such day, the
      last day of that month); later dates of service are covered only where covers_future_dates_of_service is
      true. An application can be withdrawn only by the applicant personally, never by an agent on the applicant's behalf.
    eligibility:
      - id: applicant_withdraws
        applies_to: [assistance_application_withdrawn]
        kind: caller_fact
        condition: An application can be withdrawn only by the applicant personally, never by an agent on the applicant's behalf.
        evidence_fields: [assistance_cases.status, assistance_cases.assistance_case_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[assistance_cases.assistance_case_id]]
          action_bindings: {assistance_cases.assistance_case_id: assistance_case_id}
    params:
      per_tier:
        Financial Assistance 25% Discount: {award_term_months: "=award_term_months", lookback_days: "=lookback_days", decision_business_days: "=decision_business_days"}
        Financial Assistance 50% Discount: {award_term_months: "=award_term_months", lookback_days: "=lookback_days", decision_business_days: "=decision_business_days"}
        Financial Assistance 75% Discount: {award_term_months: "=award_term_months", lookback_days: "=lookback_days", decision_business_days: "=decision_business_days"}
        Financial Assistance Full Discount: {award_term_months: "=award_term_months", lookback_days: "=lookback_days", decision_business_days: "=decision_business_days"}
        Presumptive Eligibility Full Discount: {award_term_months: "=award_term_months", lookback_days: "=lookback_days", decision_business_days: "=decision_business_days"}
        Catastrophic Medical Hardship Adjustment: {award_term_months: "=award_term_months", lookback_days: "=lookback_days", decision_business_days: "=decision_business_days"}

  - id: assistance_evt_discount_application
    subject: [assistance_discount_applied]
    rule: >-
      A discount is applied only under a case whose status is approved. A discount is applied only to an invoice whose status is open, on_hold, payment_plan or collections; a paid or closed invoice is not discounted, though its payments may be refunded under the prior-payment rule below.
      The invoice must belong to the case's customer, be of a billing class in eligible_billing_classes, have a
      date_of_service from award_start_date through award_end_date, and, when
      requires_insurance_adjudication_first is true, have no claim for its order still awaiting a payer decision
      or under appeal. Patient responsibility left after insurance is discounted only where
      insured_balances_eligible is true. Consumer purchases (consumer_purchases_eligible) and collection-service
      fees (collection_service_fees_covered) are never discounted. An invoice receives at most one discount under a case.
      For an income or presumptive tier the discount is discount_pct percent of the invoice's eligible patient
      responsibility (assistance_msr_invoice_responsibility_total), rounded to the cent; when
      refund_prior_payments is false it is limited to the balance still due. For the hardship tier the total
      discount is the hardship responsibility less hardship_liability_cap_pct_of_income percent of annual household
      income (never below zero), spread over the covered invoices from the oldest date of service, each up to its
      balance due. An invoice carried on a payment plan is discounted only where applies_to_payment_plan_balances
      is true. A discount that exceeds the balance due leaves a credit that is refunded when it is at least
      refund_minimum_amount, within refund_processing_days. A covered invoice on a payment plan is discounted and
      its share of the plan balance is reduced; a covered invoice in collections is recalled on approval when
      collections_recall_on_approval is true. A prompt-pay discount may still be taken on what remains only where
      prompt_pay_stacks_after_discount is true.
    eligibility:
      - id: award_approved
        applies_to: [assistance_discount_applied]
        kind: state
        condition: A discount is applied only under a case whose status is approved.
        evidence_fields: [assistance_cases.status, assistance_cases.assistance_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[assistance_cases.assistance_case_id]]
          action_bindings: {assistance_cases.assistance_case_id: assistance_case_id}
        state_contract:
          field: assistance_cases.status
          allowed: [approved]
      - id: invoice_discountable
        applies_to: [assistance_discount_applied]
        kind: state
        condition: A discount is applied only to an invoice whose status is open, on_hold, payment_plan or collections; a paid or closed invoice is not discounted, though its payments may be refunded under the prior-payment rule below.
        evidence_fields: [invoices.status, invoices.invoice_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[invoices.invoice_id]]
          action_bindings: {invoices.invoice_id: invoice_id}
        state_contract:
          field: invoices.status
          allowed: [open, on_hold, payment_plan, collections]
      - id: once_per_invoice
        applies_to: [assistance_discount_applied]
        kind: dedup
        condition: An invoice receives at most one discount under a case.
        evidence_fields: [assistance_events.invoice_id, assistance_events.assistance_case_id, assistance_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[assistance_events.invoice_id, assistance_events.assistance_case_id]]
          action_bindings: {assistance_events.invoice_id: invoice_id, assistance_events.assistance_case_id: assistance_case_id}
        dedup_contract:
          table: assistance_events
          mode: separate_record
          object_bindings: {invoice_id: invoice_id, assistance_case_id: assistance_case_id}
          duplicate_filters: {event_type: [assistance_discount_applied]}
          distinct_fields: []
    measures: [assistance_msr_invoice_responsibility_total, assistance_msr_hardship_responsibility]
    params:
      per_tier:
        Financial Assistance 25% Discount: {discount_pct: "=discount_pct", refund_prior_payments: "=refund_prior_payments", eligible_billing_classes: "=eligible_billing_classes", hardship_liability_cap_pct_of_income: "=hardship_liability_cap_pct_of_income"}
        Financial Assistance 50% Discount: {discount_pct: "=discount_pct", refund_prior_payments: "=refund_prior_payments", eligible_billing_classes: "=eligible_billing_classes", hardship_liability_cap_pct_of_income: "=hardship_liability_cap_pct_of_income"}
        Financial Assistance 75% Discount: {discount_pct: "=discount_pct", refund_prior_payments: "=refund_prior_payments", eligible_billing_classes: "=eligible_billing_classes", hardship_liability_cap_pct_of_income: "=hardship_liability_cap_pct_of_income"}
        Financial Assistance Full Discount: {discount_pct: "=discount_pct", refund_prior_payments: "=refund_prior_payments", eligible_billing_classes: "=eligible_billing_classes", hardship_liability_cap_pct_of_income: "=hardship_liability_cap_pct_of_income"}
        Presumptive Eligibility Full Discount: {discount_pct: "=discount_pct", refund_prior_payments: "=refund_prior_payments", eligible_billing_classes: "=eligible_billing_classes", hardship_liability_cap_pct_of_income: "=hardship_liability_cap_pct_of_income"}
        Catastrophic Medical Hardship Adjustment: {discount_pct: "=discount_pct", refund_prior_payments: "=refund_prior_payments", eligible_billing_classes: "=eligible_billing_classes", hardship_liability_cap_pct_of_income: "=hardship_liability_cap_pct_of_income"}
    formula:
      discount_amount: round(assistance_msr_invoice_responsibility_total * discount_pct / 100, 2)
      hardship_discount_total: max(0, assistance_msr_hardship_responsibility - round(annual_household_income * hardship_liability_cap_pct_of_income / 100, 2))

  - id: assistance_evt_reversal_and_rescission
    subject: [assistance_discount_reversed, assistance_award_rescinded]
    rule: >-
      When retroactive_insurance_reversal is true and a payer later pays a claim for a discounted invoice's order,
      the discount on that invoice is reversed by the smaller of the discount and the payer's payment, with reason
      retroactive_insurance_payment. A confirmed billing correction that removes charges from a discounted
      invoice reverses the discount on the removed amount with reason invoice_billing_correction. An award can be rescinded only on a documented finding that the application misstated income, household size or enrollment; a patient's later change in income does not rescind an award.
      On rescission, every discount under the case dated within rescission_lookback_months calendar months before
      the rescission date is reversed with reason misrepresentation_finding. A discount line may be reversed at
      most up to its own amount in total.
    eligibility:
      - id: rescission_finding
        applies_to: [assistance_award_rescinded]
        kind: authorization
        condition: An award can be rescinded only on a documented finding that the application misstated income, household size or enrollment; a patient's later change in income does not rescind an award.
        evidence_fields: [assistance_cases.status, assistance_cases.assistance_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[assistance_cases.assistance_case_id]]
          action_bindings: {assistance_cases.assistance_case_id: assistance_case_id}
    params:
      per_tier:
        Financial Assistance 25% Discount: {retroactive_insurance_reversal: "=retroactive_insurance_reversal", rescission_lookback_months: "=rescission_lookback_months"}
        Financial Assistance 50% Discount: {retroactive_insurance_reversal: "=retroactive_insurance_reversal", rescission_lookback_months: "=rescission_lookback_months"}
        Financial Assistance 75% Discount: {retroactive_insurance_reversal: "=retroactive_insurance_reversal", rescission_lookback_months: "=rescission_lookback_months"}
        Financial Assistance Full Discount: {retroactive_insurance_reversal: "=retroactive_insurance_reversal", rescission_lookback_months: "=rescission_lookback_months"}
        Presumptive Eligibility Full Discount: {retroactive_insurance_reversal: "=retroactive_insurance_reversal", rescission_lookback_months: "=rescission_lookback_months"}
        Catastrophic Medical Hardship Adjustment: {retroactive_insurance_reversal: "=retroactive_insurance_reversal", rescission_lookback_months: "=rescission_lookback_months"}

  - id: assistance_evt_award_term_and_review_holds
    subject: [assistance_award_expired, assistance_application_submitted]
    rule: >-
      An award expires on the day after its award_end_date; invoices with later dates of service are billed in
      full unless a renewal is approved. While a case is submitted, pending_documents or under_review and
      hold_invoices_during_review is true, the patient's open invoices of eligible billing classes are held from
      statements and collections for up to the invoices' assistance-review hold limit. Applications are taken
      through application_channels only; an agent may take a phone_assisted application but records only the
      facts the applicant states and the documents received.
    eligibility: []
    params:
      per_tier:
        Financial Assistance 25% Discount: {hold_invoices_during_review: "=hold_invoices_during_review", application_channels: "=application_channels"}
        Financial Assistance 50% Discount: {hold_invoices_during_review: "=hold_invoices_during_review", application_channels: "=application_channels"}
        Financial Assistance 75% Discount: {hold_invoices_during_review: "=hold_invoices_during_review", application_channels: "=application_channels"}
        Financial Assistance Full Discount: {hold_invoices_during_review: "=hold_invoices_during_review", application_channels: "=application_channels"}
        Presumptive Eligibility Full Discount: {hold_invoices_during_review: "=hold_invoices_during_review", application_channels: "=application_channels"}
        Catastrophic Medical Hardship Adjustment: {hold_invoices_during_review: "=hold_invoices_during_review", application_channels: "=application_channels"}
