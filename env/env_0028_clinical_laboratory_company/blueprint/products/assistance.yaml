category: assistance
display_name: Patient Financial Assistance Program

# One holding = one financial-assistance case: an application and, once approved, the award that
# discounts the patient's eligible invoices for dates of service inside the award window. The tier
# is the discount level the case is assessed at; it is set from the applicant's stated income band
# at intake and confirmed or redetermined from documents before the decision.
binding:
  holding_table: assistance_cases
  event_tables: [assistance_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {discount_granted_total: award_discount}

lifecycle:
  states: [submitted, pending_documents, under_review, approved, denied, withdrawn, expired, rescinded]
  transitions:
    - {from: submitted, to: pending_documents, by: agent, means: Income or enrollment documents are missing and are requested with a due date.}
    - {from: submitted, to: under_review, by: agent, means: The application arrived complete and goes to review.}
    - {from: pending_documents, to: under_review, by: agent, means: The requested documents are all received and the application goes to review.}
    - {from: pending_documents, to: denied, by: system, means: The documents were not received by the due date.}
    - {from: under_review, to: approved, by: agent, means: The application meets a tier and the award is granted.}
    - {from: under_review, to: denied, by: agent, means: The application meets no tier.}
    - {from: submitted, to: approved, by: agent, means: A presumptive-eligibility application with valid proof of enrollment is approved at intake.}
    - {from: submitted, to: withdrawn, by: user, means: The applicant withdraws the application.}
    - {from: pending_documents, to: withdrawn, by: user, means: The applicant withdraws the application.}
    - {from: under_review, to: withdrawn, by: user, means: The applicant withdraws the application.}
    - {from: approved, to: expired, by: system, means: The award term ends.}
    - {from: approved, to: rescinded, by: agent, means: The award is withdrawn after a finding that the application misstated income or household facts.}

accounts:
  - key: award_discount
    unit: USD
    meaning: Discount granted under the case on the patient's invoices; each discount applied to an invoice posts in, each reversal posts out, and discount_granted_total on the case is the running sum.

parameter_schema:
  eligibility_basis: "Enum (income_fpl, program_enrollment, medical_hardship); what qualifies an applicant for the tier."
  fpl_min_pct: "Household income as a percent of the federal poverty guideline: lowest value in the tier's band, exclusive of the band below (0 = from zero income)."
  fpl_max_pct: "Household income as a percent of the federal poverty guideline: highest value in the tier's band, inclusive (0 = income not assessed)."
  discount_pct: "Percent of the eligible patient responsibility on each covered invoice that is discounted (0 = discount computed by the hardship cap instead)."
  income_documentation_required: "Boolean; whether income documents are required before a decision."
  accepted_income_documents: "List of document types that prove income or need for the tier."
  presumptive_programs: "List of enrollments that qualify the applicant without an income assessment ([] = none)."
  proof_of_enrollment_required: "Boolean; whether presumptive eligibility needs a current proof-of-enrollment document."
  enrollment_proof_max_age_days: "Calendar days; a proof-of-enrollment document dated longer ago than this before the application date is not current (0 = not applicable)."
  homelessness_documentation: "Enum (shelter_or_caseworker_letter, not_applicable); the document that proves documented homelessness."
  award_term_months: "Calendar months from the application date to the end of the award."
  lookback_days: "Calendar days before the application date from which dates of service are covered by the award."
  covers_future_dates_of_service: "Boolean; whether dates of service after the application date and through the award end are covered."
  documents_due_days: "Calendar days after the documents are requested by which they must be received."
  document_extension_days: "Calendar days added to the document due date by one extension."
  max_document_extensions: "Integer; extensions of the document due date allowed per case."
  decision_business_days: "Business days after the application is complete within which it is decided."
  decision_notice_business_days: "Business days after the decision within which the decision letter is sent."
  eligible_billing_classes: "List of invoice billing classes the award discounts."
  consumer_purchases_eligible: "Boolean; whether consumer test purchases can be discounted."
  insured_balances_eligible: "Boolean; whether patient responsibility left after insurance is eligible (false = uninsured balances only)."
  requires_insurance_adjudication_first: "Boolean; whether an invoice is discounted only after every claim for its order is finally adjudicated."
  medicaid_screening_fpl_threshold_pct: "Percent of the poverty guideline at or below which an uninsured applicant must show a Medicaid application or denial before approval (0 = no screening)."
  refund_prior_payments: "Boolean; whether payments the patient already made above the discounted amount on a covered invoice are refunded (false = the discount is limited to the balance still due)."
  refund_minimum_amount: "USD; smallest refund of prior payments issued; smaller amounts stay as a credit on the invoice."
  refund_processing_days: "Calendar days after the discount is applied within which a refund of prior payments is issued."
  collections_recall_on_approval: "Boolean; whether covered invoices in collections are recalled on approval."
  hold_invoices_during_review: "Boolean; whether the patient's eligible open invoices are put on hold while the case is pending."
  reapplication_wait_days_after_income_denial: "Calendar days after an income-based denial before a new application is accepted, unless household income or size has changed."
  renewal_window_days: "Calendar days before the award end date during which a renewal application is accepted."
  max_awards_per_12_months: "Integer; approved cases a patient may receive with decision dates within any 365 days."
  hardship_liability_cap_pct_of_income: "Percent of annual household income above which the patient's laboratory responsibility is forgiven under the hardship tier (0 = not applicable)."
  hardship_lookback_months: "Calendar months before the application date over which laboratory patient responsibility is totalled for the hardship cap (0 = not applicable)."
  asset_test_applies: "Boolean; whether assets are assessed in addition to income."
  zero_income_attestation_accepted: "Boolean; whether a signed zero-income attestation is accepted as income documentation."
  pay_stub_period_days: "Calendar days of most recent pay stubs required; income from stubs is annualized from this period."
  tax_return_years_accepted: "Integer; most recent filed tax years accepted as income proof."
  applies_to_payment_plan_balances: "Boolean; whether invoices carried on a payment plan are discounted (the plan balance is reduced)."
  application_channels: "List of ways an application can be submitted."
  retroactive_insurance_reversal: "Boolean; whether a discount is reversed to the extent a payer later pays the same invoice."
  misrepresentation_rescission_allowed: "Boolean; whether an award may be rescinded on a misrepresentation finding."
  rescission_lookback_months: "Calendar months before the rescission date whose discounts under the case are reversed on rescission."
  collection_service_fees_covered: "Boolean; whether mobile-visit and other collection-service fees are discounted."
  prompt_pay_stacks_after_discount: "Boolean; whether a prompt-pay discount may still be taken on the balance left after the assistance discount."
  award_start_basis: "Enum (application_date); the date the award term and the lookback are counted from."
  tier_redetermination_allowed: "Boolean; whether the tier assessed at intake may be changed before the decision when documents show a different band."
  annualization_rule: "Enum (most_recent_income_document); annual income is taken from the most recent accepted income document."
  household_definition: "Text; who counts in the household size."
  dependent_income_counted: "Boolean; whether income of dependents is counted."
  spouse_income_counted: "Boolean; whether income of a spouse or domestic partner is counted."

