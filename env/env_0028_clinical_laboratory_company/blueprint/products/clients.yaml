category: clients
display_name: Physician Client Accounts

# One holding = one client account of an ordering organization (practice location, health center,
# hospital outreach program or employer). The account carries the organization's ordering setup,
# courier and supply service, and the receivable for tests the organization elected to be billed for
# (client billing) at its client fee schedule.
binding:
  holding_table: client_accounts
  event_tables: [client_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {client_balance: client_receivable}

lifecycle:
  states: [pending_setup, active, credit_hold, closed]
  transitions:
    - {from: pending_setup, to: active, by: agent, means: Credentialing is complete and the signed client agreement is on file; the account can order and be billed.}
    - {from: pending_setup, to: closed, by: system, means: Setup was not completed within the setup limit.}
    - {from: active, to: credit_hold, by: system, means: The account is past due beyond the hold limit or over its credit limit.}
    - {from: credit_hold, to: active, by: system, means: The past-due amount is paid and the balance is within the credit limit.}
    - {from: active, to: closed, by: user, means: The organization terminates the client agreement with notice.}
    - {from: credit_hold, to: closed, by: agent, means: The laboratory closes an account left on credit hold beyond the closure limit.}

accounts:
  - key: client_receivable
    unit: USD
    meaning: What the organization owes the laboratory for client-billed tests; billed tests and late fees post in, payments and credit memos post out, and client_balance on the account is the running sum.

parameter_schema:
  client_fee_schedule_discount_pct: "Percent off the test-menu list price at which tests are client-billed to the organization."
  minimum_monthly_billed_volume: "USD; client-billed volume per calendar month the organization must sustain to keep this account class (0.00 = none)."
  volume_reassessment_months: "Calendar months between reviews of the organization's billed volume against its account class."
  credit_limit: "USD; maximum client balance across the organization's accounts before a credit hold."
  payment_terms_days: "Calendar days after the client invoice date by which payment is due."
  early_payment_discount_pct: "Percent off a client invoice paid in full within early_payment_days (0 = none)."
  early_payment_days: "Calendar days after the client invoice date within which the early-payment discount applies."
  late_fee_pct: "Percent of the past-due amount assessed once per client invoice period that is still unpaid late_fee_grace_days after its due date."
  late_fee_grace_days: "Calendar days after the due date before a late fee is assessed."
  credit_hold_days_past_due: "Calendar days past due at which the account goes on credit hold."
  credit_hold_closure_days: "Calendar days on credit hold after which the laboratory may close the account."
  credit_hold_release_requires_full_past_due: "Boolean; whether release from credit hold needs every past-due amount paid."
  client_invoice_day_of_month: "Integer; day of the month the client invoice for the prior month is issued."
  invoice_dispute_window_days: "Calendar days after the client invoice date within which a line may be disputed."
  credit_memo_window_days: "Calendar days after a line was billed within which a credit memo may be issued for it."
  credit_memo_requires_documentation: "Boolean; whether a credit memo needs supporting documentation (for example the patient's coverage card)."
  payment_methods: "List of payment methods accepted from the organization."
  courier_pickups_per_day: "Integer; scheduled courier pickups per business day."
  courier_pickup_windows: "List of pickup windows offered (morning, midday, late_afternoon)."
  specimen_pickup_cutoff_time: "HH:MM; latest time a specimen can be picked up for same-day processing."
  stat_pickup_available: "Boolean; whether an unscheduled STAT pickup can be requested."
  max_added_pickups_per_month: "Integer; extra courier pickups that can be added in a calendar month."
  supply_order_frequency_days: "Calendar days that must separate two supply orders."
  max_supply_line_items_per_order: "Integer; supply items per order."
  supply_items_allowed: "List of supply items the account may order."
  supplies_limited_to_lab_use: "Boolean; whether supplies may be used only to collect and ship specimens to the laboratory."
  ehr_interface_available: "Boolean; whether an electronic health-record ordering and results interface can be built."
  ehr_interface_min_monthly_requisitions: "Integer; monthly requisitions needed to qualify for an interface (0 = not offered)."
  provider_portal_access: "Boolean; whether the organization can order and view results in the provider portal."
  paper_requisition_allowed: "Boolean; whether paper requisitions are accepted."
  in_office_phlebotomist_placed: "Boolean; whether a laboratory phlebotomist can be placed in the organization's office."
  in_office_phlebotomist_min_daily_draws: "Integer; average daily draws needed for a placed phlebotomist (0 = not offered)."
  medicare_client_billing_prohibited: "Boolean; whether tests for Original Medicare Part B patients may never be client-billed."
  medicaid_client_billing_prohibited: "Boolean; whether tests for Medicaid patients may never be client-billed."
  commercial_client_billing_allowed: "Boolean; whether tests for commercially insured patients may be client-billed at the organization's election."
  sliding_fee_support: "Boolean; whether the organization client-bills uninsured patients' tests under its own sliding-fee program."
  occupational_panels_available: "Boolean; whether employer drug-screen and pre-placement panels can be ordered."
  chain_of_custody_drug_testing: "Boolean; whether chain-of-custody collections are available."
  mro_review_included: "Boolean; whether medical review officer review of non-negative drug tests is included."
  result_delivery_methods: "List of ways results reach the organization."
  critical_value_call_minutes: "Minutes after verification within which a critical result is phoned to the organization."
  account_setup_business_days: "Business days to complete setup once the agreement and credentialing documents are received."
  setup_expiry_days: "Calendar days after opening after which an incomplete setup is closed."
  credentialing_documents_required: "List of documents needed before activation."
  termination_notice_days: "Calendar days of written notice the organization gives to end the agreement."
  max_locations_per_organization: "Integer; client accounts (locations) one organization may hold."
  consolidated_billing_across_locations: "Boolean; whether all the organization's locations receive one consolidated client invoice."
  hipaa_baa_required: "Boolean; whether a business associate agreement must be on file."
  price_schedule_review_months: "Calendar months between reviews of the client fee schedule."

