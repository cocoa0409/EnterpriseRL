events:
  - type: clients_account_opened
    target: client_accounts
    mutation: create
    meaning: An ordering organization applies for a client account for one location.
    grain: one row per client account
    fields:
      customer_id: The organization.
      variant_name: The account class.
      account_number: Client account number assigned.
      location_name: Practice location name as registered.
      ordering_interface: How the location will order.
      opened_date: Date the account was opened.
    triggers: []
  - type: clients_account_activated
    target: client_accounts
    mutation: {transition: {from: pending_setup, to: active}}
    meaning: Setup completes and the account goes live.
    grain: one row per transaction
    fields:
      activated_date: Date the account went live.
    triggers: []
  - type: clients_credit_hold_placed
    target: client_accounts
    mutation: {transition: {from: active, to: credit_hold}}
    meaning: The account goes on credit hold.
    grain: one row per transaction
    fields:
      credit_hold_date: Date the hold started.
    triggers: []
  - type: clients_credit_hold_released
    target: client_accounts
    mutation: {transition: {from: credit_hold, to: active}}
    meaning: The credit hold is lifted.
    grain: one row per transaction
    fields:
      credit_hold_date: Kept as history.
    triggers: []
  - type: clients_account_closed
    target: client_accounts
    mutation: {transition: [{from: pending_setup, to: closed}, {from: active, to: closed}, {from: credit_hold, to: closed}]}
    meaning: The account is closed (setup lapsed, terminated by the organization, or closed for nonpayment).
    grain: one row per transaction
    fields:
      closed_date: Date of closure.
    triggers: []
  - type: clients_interface_changed
    target: client_accounts
    mutation: update
    meaning: The location's ordering interface changes.
    grain: one row per transaction
    fields:
      ordering_interface: New ordering interface.
    triggers: []
  - type: clients_test_billed
    target: client_transactions
    meaning: A client-billed test is charged to the account at the client fee schedule.
    grain: one row per test per order
    distinguish_by: [order_id, test_code]
    fields:
      event_date: Date billed.
      order_id: The order whose test is client-billed.
      test_code: The test billed.
      list_price: The test's list price on the test menu.
      amount: Client price charged; positive.
      invoice_period: Client invoice month the line falls in.
    account: client_receivable
    direction: in
    triggers: []
  - type: clients_payment_received
    target: client_transactions
    meaning: The organization pays a client invoice.
    grain: one row per payment
    distinguish_by: [invoice_period, event_date, payment_method]
    fields:
      event_date: Date the payment posted.
      amount: Amount paid; positive.
      invoice_period: The client invoice paid.
      payment_method: How it was paid.
    account: client_receivable
    direction: out
    triggers: []
  - type: clients_credit_memo_issued
    target: client_transactions
    meaning: A billed line is credited off the account.
    grain: one row per credited line
    distinguish_by: [credited_transaction_id]
    fields:
      event_date: Date of the credit memo.
      amount: Amount credited; equals the credited line; positive.
      credited_transaction_id: The billed line credited.
      credit_reason: Why it was credited.
      invoice_period: Client invoice month the credit falls in.
    account: client_receivable
    direction: out
    triggers: []
  - type: clients_late_fee_assessed
    target: client_transactions
    meaning: A late fee is assessed on an unpaid client invoice.
    grain: one row per client invoice period
    distinguish_by: [invoice_period]
    fields:
      event_date: Date assessed.
      amount: Late fee; positive.
      invoice_period: The client invoice that is past due.
    account: client_receivable
    direction: in
    triggers: []
  - type: clients_supply_order_placed
    target: client_transactions
    meaning: The location orders collection supplies.
    grain: one row per supply item per order date
    distinguish_by: [supply_item, event_date]
    fields:
      event_date: Date ordered.
      supply_item: Item ordered.
      supply_quantity: Quantity ordered.
    triggers: []
  - type: clients_courier_pickup_added
    target: client_transactions
    meaning: An extra or STAT courier pickup is scheduled for the location.
    grain: one row per added pickup
    distinguish_by: [event_date, pickup_window]
    fields:
      event_date: Date of the pickup.
      pickup_window: Window of the pickup.
    triggers: []

measures:
  - id: clients_msr_days_past_due
    window: current state as of today (frozen date)
    measure: calendar days since the due date of the oldest client invoice period that still has an unpaid amount
  - id: clients_msr_organization_balance
    window: current state
    measure: sum of client_balance over every account of the same customer (organization) that is not closed
  - id: clients_msr_added_pickups_month
    window: the calendar month of the requested pickup date
    measure: count of clients_courier_pickup_added rows on the account in that month

policies:
  - id: clients_agg_multi_holding
    subject: [clients_account_opened]
    rule: An organization holds one client account per location, up to max_locations_per_organization accounts of the same class; a location never has two accounts.
    eligibility: []
    params: {max_per_customer: null}

  - id: clients_agg_organization_credit
    subject: [clients_test_billed, clients_payment_received, clients_credit_hold_placed]
    rule: >-
      The credit limit applies to the organization, not to a single location: the sum of the client balances of
      all the organization's open accounts (clients_msr_organization_balance) is compared with credit_limit. When
      consolidated_billing_across_locations is true, all locations receive one client invoice per period and a
      payment is applied to the oldest unpaid period across locations; otherwise each account is invoiced and paid
      separately.
    eligibility: []
    measures: [clients_msr_organization_balance]
    params:
      per_tier:
        Independent Practice Client Account: {credit_limit: "=credit_limit", consolidated_billing_across_locations: "=consolidated_billing_across_locations"}
        Group Practice Client Account: {credit_limit: "=credit_limit", consolidated_billing_across_locations: "=consolidated_billing_across_locations"}
        Multispecialty Medical Group Account: {credit_limit: "=credit_limit", consolidated_billing_across_locations: "=consolidated_billing_across_locations"}
        Federally Qualified Health Center Account: {credit_limit: "=credit_limit", consolidated_billing_across_locations: "=consolidated_billing_across_locations"}
        Hospital Outreach Reference Account: {credit_limit: "=credit_limit", consolidated_billing_across_locations: "=consolidated_billing_across_locations"}
        Occupational Health Employer Account: {credit_limit: "=credit_limit", consolidated_billing_across_locations: "=consolidated_billing_across_locations"}

  - id: clients_account_setup
    subject: [clients_account_opened, clients_account_activated, clients_interface_changed]
    rule: >-
      A client account can be opened only for a customer profile whose customer_type is client_organization.
      The account class is chosen from the organization type and its expected monthly client-billed volume
      against minimum_monthly_billed_volume, and is reviewed every volume_reassessment_months. Activation needs
      every document in credentialing_documents_required (including a business associate agreement where
      hipaa_baa_required is true) and is completed within account_setup_business_days business days of receiving
      them; a setup not completed within setup_expiry_days calendar days of opening is closed. An EHR interface is
      built only where ehr_interface_available is true and the location sends at least
      ehr_interface_min_monthly_requisitions requisitions a month; paper requisitions are accepted only where
      paper_requisition_allowed is true.
    eligibility:
      - id: organization_profile
        applies_to: [clients_account_opened]
        kind: authorization
        condition: A client account can be opened only for a customer profile whose customer_type is client_organization.
        evidence_fields: [customers.customer_type, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[customers.customer_id]]
          action_bindings: {customers.customer_id: customer_id}
    params:
      per_tier:
        Independent Practice Client Account: {minimum_monthly_billed_volume: "=minimum_monthly_billed_volume", setup_expiry_days: "=setup_expiry_days"}
        Group Practice Client Account: {minimum_monthly_billed_volume: "=minimum_monthly_billed_volume", setup_expiry_days: "=setup_expiry_days"}
        Multispecialty Medical Group Account: {minimum_monthly_billed_volume: "=minimum_monthly_billed_volume", setup_expiry_days: "=setup_expiry_days"}
        Federally Qualified Health Center Account: {minimum_monthly_billed_volume: "=minimum_monthly_billed_volume", setup_expiry_days: "=setup_expiry_days"}
        Hospital Outreach Reference Account: {minimum_monthly_billed_volume: "=minimum_monthly_billed_volume", setup_expiry_days: "=setup_expiry_days"}
        Occupational Health Employer Account: {minimum_monthly_billed_volume: "=minimum_monthly_billed_volume", setup_expiry_days: "=setup_expiry_days"}

  - id: clients_evt_client_billing
    subject: [clients_test_billed]
    rule: >-
      A test is client-billed only when its order carries billing_method client_bill and this account's
      client_account_id. A test may be client-billed only while the account status is active or credit_hold; orders placed while on credit hold are not accepted for client billing, but tests ordered before the hold are still billed.
      Tests for a patient whose coverage on the date of service is Original Medicare Part B are never
      client-billed when medicare_client_billing_prohibited is true, nor for a Medicaid Managed Care Plan patient
      when medicaid_client_billing_prohibited is true; those orders are billed to the payer. Commercially insured
      patients' tests are client-billed only where commercial_client_billing_allowed is true. The client price of
      a test is its test-menu list price less client_fee_schedule_discount_pct percent, rounded to the cent. Lines
      fall into the calendar-month invoice period of their billing date; the client invoice is issued on
      client_invoice_day_of_month of the next month.
    eligibility:
      - id: billable_account
        applies_to: [clients_test_billed]
        kind: state
        condition: A test may be client-billed only while the account status is active or credit_hold; orders placed while on credit hold are not accepted for client billing, but tests ordered before the hold are still billed.
        evidence_fields: [client_accounts.status, client_accounts.client_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[client_accounts.client_account_id]]
          action_bindings: {client_accounts.client_account_id: client_account_id}
        state_contract:
          field: client_accounts.status
          allowed: [active, credit_hold]
    params:
      per_tier:
        Independent Practice Client Account: {client_fee_schedule_discount_pct: "=client_fee_schedule_discount_pct", commercial_client_billing_allowed: "=commercial_client_billing_allowed"}
        Group Practice Client Account: {client_fee_schedule_discount_pct: "=client_fee_schedule_discount_pct", commercial_client_billing_allowed: "=commercial_client_billing_allowed"}
        Multispecialty Medical Group Account: {client_fee_schedule_discount_pct: "=client_fee_schedule_discount_pct", commercial_client_billing_allowed: "=commercial_client_billing_allowed"}
        Federally Qualified Health Center Account: {client_fee_schedule_discount_pct: "=client_fee_schedule_discount_pct", commercial_client_billing_allowed: "=commercial_client_billing_allowed"}
        Hospital Outreach Reference Account: {client_fee_schedule_discount_pct: "=client_fee_schedule_discount_pct", commercial_client_billing_allowed: "=commercial_client_billing_allowed"}
        Occupational Health Employer Account: {client_fee_schedule_discount_pct: "=client_fee_schedule_discount_pct", commercial_client_billing_allowed: "=commercial_client_billing_allowed"}
    formula:
      amount: round(list_price * (100 - client_fee_schedule_discount_pct) / 100, 2)

  - id: clients_evt_payments_and_late_fees
    subject: [clients_payment_received, clients_late_fee_assessed]
    rule: >-
      A client invoice is due payment_terms_days calendar days after its invoice date, payable by one of
      payment_methods. A client invoice paid in full within early_payment_days calendar days of its date earns
      early_payment_discount_pct percent off, taken at payment. A late fee of late_fee_pct percent of the unpaid
      amount, rounded to the cent, is assessed once for a client invoice period still unpaid late_fee_grace_days
      calendar days after its due date; a period is never charged a second late fee. A payment is applied to the
      period the organization names, otherwise to the oldest unpaid period.
    eligibility: []
    params:
      per_tier:
        Independent Practice Client Account: {payment_terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct", late_fee_grace_days: "=late_fee_grace_days", early_payment_discount_pct: "=early_payment_discount_pct"}
        Group Practice Client Account: {payment_terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct", late_fee_grace_days: "=late_fee_grace_days", early_payment_discount_pct: "=early_payment_discount_pct"}
        Multispecialty Medical Group Account: {payment_terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct", late_fee_grace_days: "=late_fee_grace_days", early_payment_discount_pct: "=early_payment_discount_pct"}
        Federally Qualified Health Center Account: {payment_terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct", late_fee_grace_days: "=late_fee_grace_days", early_payment_discount_pct: "=early_payment_discount_pct"}
        Hospital Outreach Reference Account: {payment_terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct", late_fee_grace_days: "=late_fee_grace_days", early_payment_discount_pct: "=early_payment_discount_pct"}
        Occupational Health Employer Account: {payment_terms_days: "=payment_terms_days", late_fee_pct: "=late_fee_pct", late_fee_grace_days: "=late_fee_grace_days", early_payment_discount_pct: "=early_payment_discount_pct"}

  - id: clients_evt_credit_hold
    subject: [clients_credit_hold_placed, clients_credit_hold_released, clients_account_closed]
    rule: >-
      An account goes on credit hold when its oldest unpaid period is credit_hold_days_past_due calendar days past
      due (clients_msr_days_past_due) or when the organization's total balance exceeds credit_limit. The hold is
      released when every past-due amount is paid (credit_hold_release_requires_full_past_due) and the balance is
      back within the limit. An account left on credit hold more than credit_hold_closure_days calendar days may be
      closed by the laboratory. The organization ends its agreement with termination_notice_days calendar days of
      written notice; only the organization can terminate, and the final client invoice still falls due.
    eligibility: []
    measures: [clients_msr_days_past_due]
    params:
      per_tier:
        Independent Practice Client Account: {credit_hold_days_past_due: "=credit_hold_days_past_due", credit_hold_closure_days: "=credit_hold_closure_days", termination_notice_days: "=termination_notice_days"}
        Group Practice Client Account: {credit_hold_days_past_due: "=credit_hold_days_past_due", credit_hold_closure_days: "=credit_hold_closure_days", termination_notice_days: "=termination_notice_days"}
        Multispecialty Medical Group Account: {credit_hold_days_past_due: "=credit_hold_days_past_due", credit_hold_closure_days: "=credit_hold_closure_days", termination_notice_days: "=termination_notice_days"}
        Federally Qualified Health Center Account: {credit_hold_days_past_due: "=credit_hold_days_past_due", credit_hold_closure_days: "=credit_hold_closure_days", termination_notice_days: "=termination_notice_days"}
        Hospital Outreach Reference Account: {credit_hold_days_past_due: "=credit_hold_days_past_due", credit_hold_closure_days: "=credit_hold_closure_days", termination_notice_days: "=termination_notice_days"}
        Occupational Health Employer Account: {credit_hold_days_past_due: "=credit_hold_days_past_due", credit_hold_closure_days: "=credit_hold_closure_days", termination_notice_days: "=termination_notice_days"}

  - id: clients_evt_credit_memos
    subject: [clients_credit_memo_issued]
    rule: >-
      A credit memo credits one billed line in full for exactly one reason: billed_in_error_federal_beneficiary (the
      patient's coverage on the date of service makes client billing prohibited; the order is rebilled to the
      payer), test_not_performed, pricing_correction (re-billed at the correct client price), or duplicate_charge.
      A credit memo must be requested within credit_memo_window_days calendar days after the line was billed.
      The credit window counts calendar days with the billing date as day 0, the last day included.
      Supporting documentation is required when credit_memo_requires_documentation is true. A billed line may be credited at most once.
      A dispute of a client invoice is accepted within invoice_dispute_window_days of the invoice date.
    eligibility:
      - id: memo_window
        applies_to: [clients_credit_memo_issued]
        kind: time
        condition: A credit memo must be requested within credit_memo_window_days calendar days after the line was billed.
        evidence_fields: [client_transactions.event_date, client_transactions.client_transaction_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[client_transactions.client_transaction_id]]
          action_bindings: {client_transactions.client_transaction_id: credited_transaction_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the line was billed
          anchor_source: client_transactions.event_date
          relation: not_after
          duration_source: variants.credit_memo_window_days
          unit: calendar_days
          counting_rule: The credit window counts calendar days with the billing date as day 0, the last day included.
          boundary: inclusive
      - id: memo_once
        applies_to: [clients_credit_memo_issued]
        kind: dedup
        condition: A billed line may be credited at most once.
        evidence_fields: [client_transactions.credited_transaction_id, client_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[client_transactions.credited_transaction_id]]
          action_bindings: {client_transactions.credited_transaction_id: credited_transaction_id}
        dedup_contract:
          table: client_transactions
          mode: separate_record
          object_bindings: {credited_transaction_id: credited_transaction_id}
          duplicate_filters: {event_type: [clients_credit_memo_issued]}
          distinct_fields: []
    params:
      per_tier:
        Independent Practice Client Account: {credit_memo_window_days: "=credit_memo_window_days", invoice_dispute_window_days: "=invoice_dispute_window_days"}
        Group Practice Client Account: {credit_memo_window_days: "=credit_memo_window_days", invoice_dispute_window_days: "=invoice_dispute_window_days"}
        Multispecialty Medical Group Account: {credit_memo_window_days: "=credit_memo_window_days", invoice_dispute_window_days: "=invoice_dispute_window_days"}
        Federally Qualified Health Center Account: {credit_memo_window_days: "=credit_memo_window_days", invoice_dispute_window_days: "=invoice_dispute_window_days"}
        Hospital Outreach Reference Account: {credit_memo_window_days: "=credit_memo_window_days", invoice_dispute_window_days: "=invoice_dispute_window_days"}
        Occupational Health Employer Account: {credit_memo_window_days: "=credit_memo_window_days", invoice_dispute_window_days: "=invoice_dispute_window_days"}

  - id: clients_evt_supplies_and_courier
    subject: [clients_supply_order_placed, clients_courier_pickup_added]
    rule: >-
      Supplies are provided free of charge only for collecting and shipping specimens to the laboratory
      (supplies_limited_to_lab_use); items outside supply_items_allowed, or for any other use, are never shipped.
      Supply orders must be at least supply_order_frequency_days calendar days apart and carry at most
      max_supply_line_items_per_order items. Supplies and courier service are only provided while the account status is active.
      The account receives courier_pickups_per_day scheduled pickups in its courier_pickup_windows, with a
      specimen_pickup_cutoff_time for same-day processing; up to max_added_pickups_per_month extra pickups may be
      added in a month (clients_msr_added_pickups_month), and STAT pickups only where stat_pickup_available is
      true. A phlebotomist is placed in the office only where in_office_phlebotomist_placed is true and the office
      averages in_office_phlebotomist_min_daily_draws draws a day; the placed phlebotomist performs only
      laboratory specimen collection. Results reach the organization by result_delivery_methods, and critical
      results are phoned within critical_value_call_minutes. Occupational panels, chain-of-custody collection and
      MRO review are offered only where the respective flags are true.
    eligibility:
      - id: service_active_only
        applies_to: [clients_supply_order_placed, clients_courier_pickup_added]
        kind: state
        condition: Supplies and courier service are only provided while the account status is active.
        evidence_fields: [client_accounts.status, client_accounts.client_account_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[client_accounts.client_account_id]]
          action_bindings: {client_accounts.client_account_id: client_account_id}
        state_contract:
          field: client_accounts.status
          allowed: [active]
    measures: [clients_msr_added_pickups_month]
    params:
      per_tier:
        Independent Practice Client Account: {supply_order_frequency_days: "=supply_order_frequency_days", max_added_pickups_per_month: "=max_added_pickups_per_month", courier_pickups_per_day: "=courier_pickups_per_day"}
        Group Practice Client Account: {supply_order_frequency_days: "=supply_order_frequency_days", max_added_pickups_per_month: "=max_added_pickups_per_month", courier_pickups_per_day: "=courier_pickups_per_day"}
        Multispecialty Medical Group Account: {supply_order_frequency_days: "=supply_order_frequency_days", max_added_pickups_per_month: "=max_added_pickups_per_month", courier_pickups_per_day: "=courier_pickups_per_day"}
        Federally Qualified Health Center Account: {supply_order_frequency_days: "=supply_order_frequency_days", max_added_pickups_per_month: "=max_added_pickups_per_month", courier_pickups_per_day: "=courier_pickups_per_day"}
        Hospital Outreach Reference Account: {supply_order_frequency_days: "=supply_order_frequency_days", max_added_pickups_per_month: "=max_added_pickups_per_month", courier_pickups_per_day: "=courier_pickups_per_day"}
        Occupational Health Employer Account: {supply_order_frequency_days: "=supply_order_frequency_days", max_added_pickups_per_month: "=max_added_pickups_per_month", courier_pickups_per_day: "=courier_pickups_per_day"}
