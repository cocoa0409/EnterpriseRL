category: invoices
display_name: Patient Invoices & Statements

# One holding = one patient invoice: what the patient owes for one order (one accession and date
# of service), classed by the billing class that produced the balance. The balance is the running
# sum of patient-responsibility postings, payments, adjustments, reversals and refunds.
binding:
  holding_table: invoices
  event_tables: [invoice_transactions]
  intake_tables: [billing_disputes]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_due: patient_balance}

lifecycle:
  states: [open, on_hold, payment_plan, collections, paid, closed]
  transitions:
    - {from: open, to: on_hold, by: agent, means: Statements stop while a billing dispute, a financial-assistance application or an insurance reprocessing is reviewed.}
    - {from: on_hold, to: open, by: agent, means: The hold is resolved (or reaches its limit) with a balance still due; statements resume.}
    - {from: on_hold, to: closed, by: system, means: The hold is resolved with adjustments that bring the balance to zero.}
    - {from: open, to: payment_plan, by: system, means: The invoice is enrolled in a payment plan the patient accepted.}
    - {from: payment_plan, to: open, by: system, means: The payment plan was cancelled or defaulted and the remaining balance returns to the invoice.}
    - {from: payment_plan, to: paid, by: system, means: The balance is paid off through the payment plan.}
    - {from: open, to: collections, by: system, means: After the final notice the unpaid balance is placed with the collection agency.}
    - {from: collections, to: open, by: agent, means: The account is recalled from the agency (assistance approved, billing error, insurance reprocessing).}
    - {from: collections, to: paid, by: system, means: The agency collects the balance in full.}
    - {from: open, to: paid, by: system, means: Patient payments bring the balance to zero.}
    - {from: open, to: closed, by: system, means: Adjustments or a small-balance write-off bring the balance to zero.}
    - {from: paid, to: open, by: system, means: A payment that settled the invoice is returned or charged back and the balance is due again.}

accounts:
  - key: patient_balance
    unit: USD
    meaning: What the patient owes on the invoice; patient responsibility, reversed payments, returned-payment fees and refunds of credit balances post in, payments and adjustments post out, and balance_due is the running sum (negative = credit balance owed to the patient).

parameter_schema:
  first_statement_business_days: "Business days after the first patient-responsibility posting (or after secondary_payer_wait_days, when that applies) on which the first statement is issued (0 = no statement unless a balance remains after purchase)."
  statement_cycle_days: "Calendar days between consecutive statements."
  statements_before_final_notice: "Integer; regular statements issued before the final notice."
  final_notice_to_collections_days: "Calendar days after the final notice after which an unpaid balance may be placed in collections (0 = never placed)."
  min_days_first_statement_to_collections: "Calendar days after the first statement date before which no invoice is ever placed in collections (0 = never placed)."
  collections_allowed: "Boolean; whether invoices of the class may be placed with the collection agency."
  collections_min_balance: "USD; smallest balance placed in collections (0.00 = never placed)."
  collections_recall_allowed: "Boolean; whether a placed invoice can be recalled from the agency."
  collection_agency_fee_passed_to_patient: "Boolean; whether the agency's fee is added to the patient's balance."
  credit_reporting_allowed: "Boolean; whether the agency may report the debt to consumer credit bureaus."
  credit_reporting_min_balance: "USD; smallest placed balance the agency may report (0.00 = never reported)."
  credit_reporting_wait_days: "Calendar days after collections placement before any credit reporting."
  statement_due_days: "Calendar days after a statement date by which the amount shown is due."
  statement_minimum_balance: "USD; balances below this amount are not sent a statement."
  small_balance_writeoff_threshold: "USD; a balance below this amount still unpaid after the final notice is written off."
  prompt_pay_discount_pct: "Percent of the balance due taken off when the whole balance is paid within the prompt-pay window (0 = no discount)."
  prompt_pay_window_days: "Calendar days after the first statement date during which payment in full earns the prompt-pay discount (0 = no window)."
  prompt_pay_requires_full_payment: "Boolean; whether only a single payment of the full discounted balance earns the discount."
  courtesy_adjustment_max: "USD; largest courtesy adjustment per invoice for a documented laboratory service failure (0.00 = none allowed)."
  waiver_of_cost_share_prohibited: "Boolean; whether cost share may not be waived or discounted except through approved financial assistance."
  payment_methods_accepted: "List of payment methods accepted on the invoice."
  card_convenience_fee: "USD; fee for paying by card (0.00 = none)."
  returned_payment_fee: "USD; fee posted when a check or bank payment is returned unpaid (0.00 = none)."
  partial_payments_accepted: "Boolean; whether a payment of less than the balance due is accepted outside a payment plan."
  payment_posting_business_days: "Business days after receipt within which a payment posts to the invoice."
  interest_rate_pct: "Annual percent interest charged on unpaid balances (0 = none)."
  late_fee: "USD; fee for a statement not paid by its due date (0.00 = none)."
  refund_threshold: "USD; credit balances at or above this amount are refunded or transferred; below it they are held."
  refund_processing_days: "Calendar days after a credit balance arises within which it is refunded."
  credit_balance_applied_to_open_invoices_first: "Boolean; whether a credit balance is first transferred to the patient's other open invoices before any refund."
  dispute_filing_window_days: "Calendar days after the first statement date within which a billing dispute is accepted."
  dispute_hold_days: "Calendar days an invoice stays on hold for one dispute or one review cause."
  billing_error_review_business_days: "Business days within which a billing dispute is decided."
  gfe_dispute_threshold: "USD; amount by which billed self-pay charges must exceed the good faith estimate for an estimate-variance dispute (0.00 = not applicable)."
  gfe_variance_settlement: "Enum (adjust_to_estimate, not_applicable); how an eligible estimate-variance dispute is settled."
  assistance_eligible: "Boolean; whether the invoice can receive a financial-assistance discount."
  assistance_review_hold_days: "Calendar days an invoice stays on hold while a financial-assistance application is pending (0 = no hold)."
  payment_plan_eligible: "Boolean; whether the invoice can be enrolled in a payment plan."
  insurance_reprocessing_hold_days: "Calendar days an invoice stays on hold while a claim for it is corrected, appealed or reprocessed (0 = no hold)."
  abn_required_for_liability: "Boolean; whether a signed ABN option 1 must be on the order for a Medicare denial to appear on this invoice."
  itemized_statement_business_days: "Business days within which an itemized statement is sent on request."
  itemized_statement_fee: "USD; fee for an itemized statement (0.00 = free)."
  paperless_statements_available: "Boolean; whether statements can be delivered by email to a portal-enrolled patient."
  statement_cycle_paused_on_plan: "Boolean; whether statements stop while the invoice is on a payment plan."
  auto_close_zero_balance_days: "Calendar days after the balance reaches zero on which the invoice closes."
  prepaid_at_purchase: "Boolean; whether the class is paid in full at purchase before testing."
  hold_max_extensions: "Integer; times a hold of the same cause may be extended by one more dispute_hold_days period."
  collections_placement_requires_final_notice: "Boolean; whether a final notice must have been issued before collections placement."
  secondary_payer_wait_days: "Calendar days after the primary payer's patient-responsibility posting that the first statement waits for a secondary payer's crossover (0 = no wait)."

