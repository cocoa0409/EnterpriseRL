category: plans
display_name: Patient Payment Plans

# One holding = one interest-free installment agreement under which a patient pays one or more of
# their patient invoices in monthly installments. The plan balance is the running sum of the
# invoice balances enrolled, less installments paid and balances released back to the invoices.
binding:
  holding_table: payment_plans
  event_tables: [plan_transactions]
  status_field: status
  variant_field: variant_name
  quantity_fields: {plan_balance: plan_balance}

lifecycle:
  states: [pending_acceptance, active, past_due, defaulted, paid_off, cancelled]
  transitions:
    - {from: pending_acceptance, to: active, by: user, means: The patient accepts the plan terms personally and pays any down payment.}
    - {from: pending_acceptance, to: cancelled, by: system, means: The offer lapses unaccepted at the end of the acceptance window.}
    - {from: active, to: past_due, by: system, means: An installment is still unpaid at the end of its grace period.}
    - {from: past_due, to: active, by: system, means: Every past-due installment is paid and the plan is current again.}
    - {from: past_due, to: defaulted, by: system, means: The number of consecutive missed installments reaches the default limit.}
    - {from: defaulted, to: active, by: agent, means: A defaulted plan is reinstated after the patient pays every missed installment.}
    - {from: active, to: paid_off, by: system, means: The plan balance reaches zero.}
    - {from: active, to: cancelled, by: user, means: The patient ends the plan; the remaining balance returns to the invoices.}
    - {from: past_due, to: cancelled, by: user, means: The patient ends a past-due plan; the remaining balance returns to the invoices.}

accounts:
  - key: plan_balance
    unit: USD
    meaning: Invoice balances carried on the plan and not yet paid; each enrolled invoice balance posts in, each installment paid and each balance released back to an invoice posts out, and plan_balance on the plan is the running sum.

parameter_schema:
  term_months: "Integer; number of monthly installments the plan is amortized over."
  min_enrolled_balance: "USD; smallest total invoice balance that can open this plan term."
  max_enrolled_balance: "USD; largest total balance this plan term may carry at enrollment or after adding invoices."
  min_installment_amount: "USD; smallest regular monthly installment; a balance whose computed installment is lower must take a shorter term."
  down_payment_pct: "Percent of the enrolled balance due at acceptance as a down payment (0 = none)."
  interest_rate_pct: "Annual percent interest on the plan balance (0 = interest-free)."
  setup_fee: "USD; fee to open the plan (0.00 = none)."
  autopay_required: "Boolean; whether installments must be drawn automatically from a card or bank account on file."
  autopay_methods: "List of payment methods accepted for automatic installments."
  manual_payment_methods: "List of payment methods accepted for manual installments, cures and payoffs."
  grace_days: "Calendar days after an installment's due date before an unpaid installment makes the plan past_due."
  missed_installments_to_default: "Integer; consecutive missed installments at which the plan defaults."
  reinstatements_allowed: "Integer; times one plan may be reinstated after a default (0 = never)."
  reinstatement_window_days: "Calendar days after the default date within which reinstatement is possible."
  due_day_changes_allowed: "Integer; times the monthly due day may be changed over the life of the plan."
  due_day_min: "Integer; earliest day of the month that can be chosen as the due day."
  due_day_max: "Integer; latest day of the month that can be chosen as the due day."
  first_due_days_after_acceptance: "Calendar days after acceptance on which the first regular installment falls, moved forward to the chosen due day."
  acceptance_window_days: "Calendar days after the plan is offered within which the patient must accept it."
  max_invoices_per_plan: "Integer; most invoices one plan may carry over its life."
  add_invoice_allowed: "Boolean; whether a new eligible invoice may be added to a plan already accepted."
  re_amortize_on_add: "Boolean; whether adding an invoice recomputes the installment over the remaining installments (false = the number of installments grows instead)."
  max_term_extension_months_on_add: "Integer; months by which adding invoices may extend the original term (0 = none)."
  early_payoff_penalty: "USD; charge for paying the plan off early (0.00 = none)."
  prompt_pay_discount_on_plan: "Boolean; whether a prompt-pay discount can be taken on a balance carried on the plan."
  default_free_history_months: "Calendar months before the offer date during which the patient must have had no plan default."
  eligible_billing_classes: "List of invoice billing classes that may be enrolled."
  assistance_screening_required: "Boolean; whether the patient must have a financial-assistance case on file (any status) before this term is offered."
  partial_installment_accepted: "Boolean; whether a payment below the installment due counts toward that installment (false = it is applied as extra principal and the installment is still missed)."
  extra_principal_allowed: "Boolean; whether payments above the installment reduce the balance without changing the schedule."
  default_balance_handling: "Enum (resume_statement_cycle, final_notice_immediately); what happens on the invoices when a plan defaults."
  hardship_skips_allowed: "Integer; installments that may be deferred to the end of the plan for a documented hardship (0 = none)."
  hardship_skip_requires_documentation: "Boolean; whether a hardship skip needs a supporting document (job-loss notice, medical leave letter)."
  returned_installment_counts_as_missed: "Boolean; whether an installment whose payment is returned or charged back counts as missed."
  cure_requires_full_past_due: "Boolean; whether a past-due plan becomes current only when every past-due installment is paid in full."
  payoff_quote_valid_days: "Calendar days a payoff amount quoted to the patient stays valid."
  collections_suspended_while_current: "Boolean; whether invoices on a plan that is active or past_due are never placed in collections."
  credit_reporting_while_current: "Boolean; whether a balance on a current plan may be reported to credit bureaus."
  plan_agreement_business_days: "Business days after acceptance within which the written plan agreement is sent."
  acceptance_channels: "List of ways the patient can accept the terms (portal_esign, recorded_phone_consent, signed_mail_form)."
  assistance_adjustment_reamortizes: "Boolean; whether a financial-assistance reduction recomputes the installment (false = the installment stays and the term shortens)."
  autopay_retry_days: "Calendar days after a failed automatic draw on which it is retried once."
  minimum_guarantor_age_years: "Whole years; youngest age at which a person may sign a plan (a minor's balances are put on a parent's or guardian's plan)."
  max_installment_due_days_from_offer: "Calendar days after the offer date within which the first installment must fall."
  installment_rounding: "Enum (cent_final_absorbs); installments are rounded to the cent and the last installment absorbs the rounding difference."
  past_due_notice_business_days: "Business days after a plan turns past_due within which the past-due notice is sent."
  default_notice_business_days: "Business days after a default within which the default notice is sent."
  payoff_closes_invoices: "Boolean; whether paying the plan off pays every invoice it carries."

