# ============================================================================
# extended_policies (collection_appointments difficulty)
# ============================================================================
extended_policies:
  - id: visits_ext_trip_charge
    base_policy_refs: [visits_evt_fee_assessment]
    overwrite:
      - base_policy: visits_evt_fee_assessment
        superseded_clause: >-
          On a collected mobile visit the fees are: the trip fee for the visit's service zone from trip_fee_by_zone
        replaced_by: >-
          The trip charge on a collected home visit is worked out by the steps below rather than read straight off the published zone fee.
    trigger: state_due
    subject: [visits_fee_assessed]
    computes: fee_amount
    target_tool: assess_trip_fee_73c5b19a
    params:
      zone_1_trip: 75.00
      zone_2_trip: 95.00
      zone_3_trip: 125.00
      kit_esoteric: 20.00
      kit_specialty: 12.00
      early_weekend_premium: 15.00
      early_weekday_premium: 8.00
      short_notice_rate: 1.15
      planned_route_rate: 0.95
      standard_notice_rate: 1.00
      lab_redraw_credit: 25.00
      other_redraw_credit: 10.00
    rule: >-
      The trip charge on a collected home visit is worked out by the steps below rather than read straight off the published zone fee.
      Standard method: the trip charge for a collected home visit is the published trip fee of the zone band the visit was booked in, which is 75.00 for service zone 1 (up to 10 road miles), 95.00 for service zone 2 (over 10 to 25 road miles) and 125.00 for service zone 3 (over 25 to 40 road miles), and it is posted as one assessed trip fee rounded to the cent.
      No trip charge is assessed at all when the patient's Medicare homebound certification is on file for the visit, because the collection and travel are billed to Medicare; a fee type is assessed at most once per visit.
      Weekend dispatch band: on weekends home trips leave from the regional hubs rather than the neighborhood service center, so a visit whose appointment date is a Sunday is priced two zone bands farther out than the band it was booked in, a visit whose appointment date is a Saturday is priced one zone band farther out, and a visit on a weekday is priced on the band it was booked in; the band never goes beyond service zone 3.
      Standing-series route band: a home visit collecting a standing order rides the series route, so when the order is a standing order and six or more test charges have been posted on it in the last six months, the trip is priced at the fee of the band one nearer than the band reached after the weekend dispatch step (never nearer than service zone 1); when the order is a standing order and three to five test charges have been posted on it in that window, the trip is priced at the average of that band's fee and the fee of the band one nearer; otherwise the trip is priced at the fee of the band reached after the weekend dispatch step.
      Specimen handling kit: a trip collecting an order of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class carries a handling-kit addition of 20.00, a trip collecting an order of the Specialty Clinical Testing, Molecular Infectious Disease Testing or Clinical Toxicology Testing class carries a handling-kit addition of 12.00, and a trip collecting an order of any other class carries none.
      Early-route premium: a visit starting before 07:30 on a Saturday or Sunday carries an early-route premium of 15.00, a visit starting before 07:30 on a weekday carries an early-route premium of 8.00, and a visit starting at 07:30 or later carries none.
      Dispatch notice rate: the notice is the number of calendar days from the booking date to the appointment date; a visit booked three days or fewer ahead is charged at the short-notice rate of 1.15, a visit booked 21 days or more ahead is charged at the planned-route rate of 0.95, and a visit booked four to 20 days ahead is charged at the standard rate of 1.00.
      Redraw credit: when the order's specimen was rejected in the last three months for leaking in transit or for exceeding its stability, which are failures in the laboratory's own handling, the trip carries a redraw credit of 25.00; when the order's specimen was rejected in that window only for another reason, the credit is 10.00; when no rejection of the order's specimen falls in that window, there is no credit.
      Order of the calculation: first the priced band fee is taken, then the handling-kit addition and the early-route premium are added to it, then that sum is multiplied by the dispatch notice rate, then the redraw credit is subtracted from that product; the trip charge never goes below 0.00, and it is rounded to the cent only once, at the end.
    prerequisite: []
    cross_category:
      - category: orders
        as: history
        reads: [standing_order, variant_name, order_events.event_type, order_events.rejection_reason, order_events.event_date]
        note: The standing-series route band reads the order's standing flag and its posted test charges, the handling kit reads its service class, and the redraw credit reads its specimen rejections.
    compute:
      - tr_booked_band: "1 if F('service_zone') == 'zone_1' else (2 if F('service_zone') == 'zone_2' else 3)"
      - tr_weekday: "DAYS('2026-01-03', F('appointment_date')) % 7"
      - tr_pricing_band: "MN(tr_booked_band + 2, 3) if tr_weekday == 1 else (MN(tr_booked_band + 1, 3) if tr_weekday == 0 else tr_booked_band)"
      - tr_fee_pricing: "K('zone_1_trip') if tr_pricing_band == 1 else (K('zone_2_trip') if tr_pricing_band == 2 else K('zone_3_trip'))"
      - tr_fee_nearer: "K('zone_1_trip') if tr_pricing_band <= 2 else K('zone_2_trip')"
      - tr_series_draws: "XCOUNT('orders', 'order_events', within_months=6, date_field='event_date', event_type='orders_test_charge_posted', order_id=F('order_id'))"
      - tr_series_standing: "CFIELD('orders', 'standing_order', order_id=F('order_id'))"
      - tr_band_fee: "tr_fee_nearer if (tr_series_standing == True and tr_series_draws >= 6) else ((tr_fee_pricing + tr_fee_nearer) / 2 if (tr_series_standing == True and tr_series_draws >= 3) else tr_fee_pricing)"
      - tr_order_class: "CFIELD('orders', 'variant_name', order_id=F('order_id'))"
      - tr_handling: "K('kit_esoteric') if (tr_order_class == 'Esoteric Reference Testing' or tr_order_class == 'Hereditary & Reproductive Genetic Testing') else (K('kit_specialty') if (tr_order_class == 'Specialty Clinical Testing' or tr_order_class == 'Molecular Infectious Disease Testing' or tr_order_class == 'Clinical Toxicology Testing') else 0.0)"
      - tr_route_dow: "DAYS('2026-01-05', F('appointment_date')) % 7"
      - tr_early_premium: "K('early_weekend_premium') if (F('appointment_time') < '07:30' and tr_route_dow >= 5) else (K('early_weekday_premium') if (F('appointment_time') < '07:30' and tr_route_dow < 5) else 0.0)"
      - tr_lead_days: "DAYS(F('booked_date'), F('appointment_date'))"
      - tr_notice_rate: "K('short_notice_rate') if tr_lead_days <= 3 else (K('planned_route_rate') if tr_lead_days >= 21 else K('standard_notice_rate'))"
      - tr_lab_rejections: "XCOUNT('orders', 'order_events', within_months=3, date_field='event_date', event_type='orders_specimen_rejected', order_id=F('order_id'), rejection_reason='leaked_in_transit') + XCOUNT('orders', 'order_events', within_months=3, date_field='event_date', event_type='orders_specimen_rejected', order_id=F('order_id'), rejection_reason='stability_exceeded')"
      - tr_all_rejections: "XCOUNT('orders', 'order_events', within_months=3, date_field='event_date', event_type='orders_specimen_rejected', order_id=F('order_id'))"
      - tr_redraw_credit: "K('lab_redraw_credit') if tr_lab_rejections >= 1 else (K('other_redraw_credit') if tr_all_rejections >= 1 else 0.0)"
      - tr_billed_to_medicare: "F('homebound_status') == 'medicare_homebound_certified'"
      - result: "0.0 if tr_billed_to_medicare else RND(MX(0.0, (tr_band_fee + tr_handling + tr_early_premium) * tr_notice_rate - tr_redraw_credit), 2)"
    compute_basis:
      tr_booked_band: "the published trip fee of the zone band the visit was booked in, which is 75.00 for service zone 1 (up to 10 road miles), 95.00 for service zone 2 (over 10 to 25 road miles) and 125.00 for service zone 3 (over 25 to 40 road miles)"
      tr_weekday: "a visit whose appointment date is a Sunday is priced two zone bands farther out than the band it was booked in, a visit whose appointment date is a Saturday is priced one zone band farther out, and a visit on a weekday is priced on the band it was booked in"
      tr_pricing_band: "a visit whose appointment date is a Sunday is priced two zone bands farther out than the band it was booked in, a visit whose appointment date is a Saturday is priced one zone band farther out, and a visit on a weekday is priced on the band it was booked in; the band never goes beyond service zone 3."
      tr_fee_pricing: "which is 75.00 for service zone 1 (up to 10 road miles), 95.00 for service zone 2 (over 10 to 25 road miles) and 125.00 for service zone 3 (over 25 to 40 road miles)"
      tr_fee_nearer: "the trip is priced at the fee of the band one nearer than the band reached after the weekend dispatch step (never nearer than service zone 1)"
      tr_series_draws: "six or more test charges have been posted on it in the last six months"
      tr_series_standing: "when the order is a standing order"
      tr_band_fee: "when the order is a standing order and six or more test charges have been posted on it in the last six months, the trip is priced at the fee of the band one nearer than the band reached after the weekend dispatch step (never nearer than service zone 1); when the order is a standing order and three to five test charges have been posted on it in that window, the trip is priced at the average of that band's fee and the fee of the band one nearer; otherwise the trip is priced at the fee of the band reached after the weekend dispatch step."
      tr_order_class: "a trip collecting an order of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class"
      tr_handling: "a trip collecting an order of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class carries a handling-kit addition of 20.00, a trip collecting an order of the Specialty Clinical Testing, Molecular Infectious Disease Testing or Clinical Toxicology Testing class carries a handling-kit addition of 12.00, and a trip collecting an order of any other class carries none."
      tr_route_dow: "a visit starting before 07:30 on a Saturday or Sunday"
      tr_early_premium: "a visit starting before 07:30 on a Saturday or Sunday carries an early-route premium of 15.00, a visit starting before 07:30 on a weekday carries an early-route premium of 8.00, and a visit starting at 07:30 or later carries none."
      tr_lead_days: "the notice is the number of calendar days from the booking date to the appointment date"
      tr_notice_rate: "a visit booked three days or fewer ahead is charged at the short-notice rate of 1.15, a visit booked 21 days or more ahead is charged at the planned-route rate of 0.95, and a visit booked four to 20 days ahead is charged at the standard rate of 1.00."
      tr_lab_rejections: "when the order's specimen was rejected in the last three months for leaking in transit or for exceeding its stability, which are failures in the laboratory's own handling"
      tr_all_rejections: "when the order's specimen was rejected in that window only for another reason"
      tr_redraw_credit: "the trip carries a redraw credit of 25.00; when the order's specimen was rejected in that window only for another reason, the credit is 10.00; when no rejection of the order's specimen falls in that window, there is no credit."
      tr_billed_to_medicare: "No trip charge is assessed at all when the patient's Medicare homebound certification is on file for the visit, because the collection and travel are billed to Medicare"
      result: "first the priced band fee is taken, then the handling-kit addition and the early-route premium are added to it, then that sum is multiplied by the dispatch notice rate, then the redraw credit is subtracted from that product; the trip charge never goes below 0.00, and it is rounded to the cent only once, at the end."
    factors:
      - id: weekend_dispatch_band
        effect: parameter
        decides: tr_pricing_band
        bindings: [tr_weekday, tr_pricing_band]
        ladder:
          - when: "the appointment date is a Sunday"
            value: "band offset +2 (two zone bands farther out than booked, never beyond service zone 3)"
          - when: "the appointment date is a Saturday"
            value: "band offset +1 (one zone band farther out than booked, never beyond service zone 3)"
          - when: "otherwise (a weekday)"
            value: "band offset 0 (the band booked)"
        baseline:
          tr_pricing_band: "tr_booked_band"
        evidence: [date]
        cross_difficulty: null
      - id: series_route_band
        effect: method
        decides: tr_band_fee
        bindings: [tr_series_draws, tr_series_standing, tr_band_fee]
        ladder:
          - when: "the order is a standing order AND six or more test charges were posted on it in the last six months"
            method: "priced at the fee of the band one nearer than the dispatch band, never nearer than service zone 1"
          - when: "the order is a standing order AND three to five test charges were posted on it in the last six months"
            method: "priced at the average of the dispatch band's fee and the fee of the band one nearer"
          - when: "otherwise"
            method: "priced at the fee of the dispatch band"
        baseline:
          tr_band_fee: "tr_fee_pricing"
        evidence: [cross_category, history]
        cross_difficulty: orders
      - id: handling_kit
        effect: parameter
        decides: tr_handling
        bindings: [tr_order_class, tr_handling]
        ladder:
          - when: "the order is of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class"
            value: "K('kit_esoteric') = 20.00"
          - when: "the order is of the Specialty Clinical Testing, Molecular Infectious Disease Testing or Clinical Toxicology Testing class"
            value: "K('kit_specialty') = 12.00"
          - when: "otherwise"
            value: "0.00"
        baseline:
          tr_handling: "0.0"
        evidence: [cross_category]
        cross_difficulty: orders
      - id: early_route_premium
        effect: parameter
        decides: tr_early_premium
        bindings: [tr_route_dow, tr_early_premium]
        ladder:
          - when: "the visit starts before 07:30 AND the appointment date is a Saturday or Sunday"
            value: "K('early_weekend_premium') = 15.00"
          - when: "the visit starts before 07:30 AND the appointment date is a weekday"
            value: "K('early_weekday_premium') = 8.00"
          - when: "otherwise (start at 07:30 or later)"
            value: "0.00"
        baseline:
          tr_early_premium: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: dispatch_notice_rate
        effect: parameter
        decides: tr_notice_rate
        bindings: [tr_lead_days, tr_notice_rate]
        ladder:
          - when: "booked three calendar days or fewer before the appointment date"
            value: "K('short_notice_rate') = 1.15"
          - when: "booked 21 calendar days or more before the appointment date"
            value: "K('planned_route_rate') = 0.95"
          - when: "otherwise (four to 20 days)"
            value: "K('standard_notice_rate') = 1.00"
        baseline:
          tr_notice_rate: "K('standard_notice_rate')"
        evidence: [date]
        cross_difficulty: null
      - id: redraw_credit
        effect: parameter
        decides: tr_redraw_credit
        bindings: [tr_lab_rejections, tr_all_rejections, tr_redraw_credit]
        ladder:
          - when: "the order's specimen was rejected in the last three months for leaking in transit or exceeding its stability"
            value: "K('lab_redraw_credit') = 25.00"
          - when: "the order's specimen was rejected in the last three months only for another reason"
            value: "K('other_redraw_credit') = 10.00"
          - when: "otherwise (no rejection in that window)"
            value: "0.00"
        baseline:
          tr_redraw_credit: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: orders
    baseline:
      rule: >-
        Standard method: the trip charge for a collected home visit is the published trip fee of the zone band the visit was booked in, which is 75.00 for service zone 1 (up to 10 road miles), 95.00 for service zone 2 (over 10 to 25 road miles) and 125.00 for service zone 3 (over 25 to 40 road miles), and it is posted as one assessed trip fee rounded to the cent.
      params: [zone_1_trip, zone_2_trip, zone_3_trip, standard_notice_rate]
    inputs:
      history:
        - {category: orders, table: order_events, aggregate: count, field: order_event_id, within_months: 6, filters: {event_type: orders_test_charge_posted}}
        - {category: orders, table: order_events, aggregate: count, field: order_event_id, within_months: 3, filters: {event_type: orders_specimen_rejected}}
      cross_category: [orders]
  - id: visits_ext_household_charge
    base_policy_refs: [visits_evt_fee_assessment]
    overwrite:
      - base_policy: visits_evt_fee_assessment
        superseded_clause: >-
          plus additional_patient_fee for each additional household member collected
        replaced_by: >-
          The household charge for the additional household members drawn at a collected home visit is worked out by the steps below rather than as a flat amount per member.
    trigger: state_due
    subject: [visits_fee_assessed]
    computes: fee_amount
    target_tool: assess_household_fee_59046739
    params:
      series_member_rate_6: 25.00
      series_member_rate_3: 30.00
      short_notice_member_add: 5.00
      planned_member_credit: 3.00
      early_weekend_household: 10.00
      early_weekday_household: 6.00
      member_kit_esoteric: 4.00
      member_kit_specialty: 2.00
      zone_1_published: 75.00
      zone_2_published: 95.00
      zone_3_published: 125.00
      extended_dispatch_ratio: 1.25
      extended_member_share: 0.50
      partial_member_share: 0.75
    rule: >-
      The household charge for the additional household members drawn at a collected home visit is worked out by the steps below rather than as a flat amount per member.
      Standard method: the household charge is the additional-patient fee of 35.00 multiplied by the number of additional household members drawn at the visit, posted as one assessed additional-patient fee rounded to the cent; a visit that drew no additional household member carries no household charge.
      The household charge on a home visit is fixed only after the visit carries an assessed trip fee.
      Series member rate: when the order the visit collects is a standing order and six or more test charges were posted on it in the last six months, each member is charged at the series member rate of 25.00; when it is a standing order and three to five test charges were posted on it in that window, each member is charged at 30.00; otherwise each member is charged at the additional-patient fee of 35.00.
      Short-notice member addition: counting calendar days from the booking date to the appointment date, a visit booked three days or fewer ahead adds 5.00 to each member's rate, a visit booked 14 days or more ahead takes 3.00 off each member's rate, and a visit booked four to 13 days ahead leaves the rate unchanged.
      Member specimen kit: each member's draw is packed in the same kit as the patient's specimen, so when the patient's order is of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class each member's rate carries 4.00 more, when it is of the Specialty Clinical Testing, Molecular Infectious Disease Testing or Clinical Toxicology Testing class each member's rate carries 2.00 more, and for any other class nothing is added.
      Shared extended dispatch: compare the assessed trip fee on the visit with the zone fee published for the band the visit was booked in (75.00 for zone 1, 95.00 for zone 2, 125.00 for zone 3); when two or more members were drawn and the assessed trip fee is 1.25 times that published zone fee or more, the first member counts in full and every further member counts as half a member; when two or more members were drawn and the assessed trip fee is above that published zone fee but below 1.25 times it, the first member counts in full and every further member counts as three quarters of a member; otherwise every member counts in full.
      Early-household addition: a visit starting before 07:30 on a Saturday or Sunday is charged the early-household addition per member drawn, 10.00 for each additional household member; a visit starting before 07:30 on a weekday is charged it once per visit, 6.00 whatever the number of members; a visit starting at 07:30 or later carries no early-household addition.
      Order of the calculation: first each member's rate is formed as the series member rate plus the short-notice member addition plus the member specimen kit, then that per-member rate is multiplied by the number of members counted under the shared extended dispatch step, then the early-household addition is added; a visit that drew no additional household member is charged nothing at all; the household charge is rounded to the cent only once, at the end.
    prerequisite:
      - problem: visits_ext_trip_charge
        kind: value_input
        gate: hh_trip_entry
        form: state
        policy_source: >-
          The household charge on a home visit is fixed only after the visit carries an assessed trip fee.
        condition: >-
          The visit's fee record carries an assessed trip fee line (a visits_fee_assessed line with fee type trip_fee) at the moment the household charge is worked out.
        resolved_by: assess_trip_fee_73c5b19a
        effect: >-
          Once the trip fee is assessed on the visit, the shared extended dispatch step compares that assessed amount with the published zone fee; before it is assessed the comparison finds no trip fee and every member counts in full.
    cross_category:
      - category: orders
        as: history
        reads: [standing_order, variant_name, order_events.event_type, order_events.event_date]
        note: The series member rate reads the order's standing flag and its posted test charges; the member specimen kit reads its service class.
    compute:
      - hh_members: "F('additional_household_patients')"
      - hh_series_draws: "XCOUNT('orders', 'order_events', within_months=6, date_field='event_date', event_type='orders_test_charge_posted', order_id=F('order_id'))"
      - hh_series_standing: "CFIELD('orders', 'standing_order', order_id=F('order_id'))"
      - hh_member_rate: "K('series_member_rate_6') if (hh_series_standing == True and hh_series_draws >= 6) else (K('series_member_rate_3') if (hh_series_standing == True and hh_series_draws >= 3) else P('additional_patient_fee'))"
      - hh_lead_days: "DAYS(F('booked_date'), F('appointment_date'))"
      - hh_notice_add: "K('short_notice_member_add') if hh_lead_days <= 3 else (-K('planned_member_credit') if hh_lead_days >= 14 else 0.0)"
      - hh_order_class: "CFIELD('orders', 'variant_name', order_id=F('order_id'))"
      - hh_member_kit: "K('member_kit_esoteric') if (hh_order_class == 'Esoteric Reference Testing' or hh_order_class == 'Hereditary & Reproductive Genetic Testing') else (K('member_kit_specialty') if (hh_order_class == 'Specialty Clinical Testing' or hh_order_class == 'Molecular Infectious Disease Testing' or hh_order_class == 'Clinical Toxicology Testing') else 0.0)"
      - hh_published_zone_fee: "K('zone_1_published') if F('service_zone') == 'zone_1' else (K('zone_2_published') if F('service_zone') == 'zone_2' else K('zone_3_published'))"
      - hh_trip_entry: "SUM('visit_events', 'fee_amount', event_type='visits_fee_assessed', fee_type='trip_fee')"
      - hh_counted_members: "1 + (hh_members - 1) * K('extended_member_share') if (hh_members >= 2 and hh_trip_entry >= K('extended_dispatch_ratio') * hh_published_zone_fee) else (1 + (hh_members - 1) * K('partial_member_share') if (hh_members >= 2 and hh_trip_entry > hh_published_zone_fee and hh_trip_entry < K('extended_dispatch_ratio') * hh_published_zone_fee) else hh_members)"
      - hh_route_dow: "DAYS('2026-01-05', F('appointment_date')) % 7"
      - hh_early_add: "K('early_weekend_household') * hh_members if (F('appointment_time') < '07:30' and hh_route_dow >= 5) else (K('early_weekday_household') if (F('appointment_time') < '07:30' and hh_route_dow < 5) else 0.0)"
      - result: "0.0 if hh_members == 0 else RND((hh_member_rate + hh_notice_add + hh_member_kit) * hh_counted_members + hh_early_add, 2)"
    compute_basis:
      hh_members: "multiplied by the number of additional household members drawn at the visit"
      hh_series_draws: "six or more test charges were posted on it in the last six months"
      hh_series_standing: "when the order the visit collects is a standing order"
      hh_member_rate: "when the order the visit collects is a standing order and six or more test charges were posted on it in the last six months, each member is charged at the series member rate of 25.00; when it is a standing order and three to five test charges were posted on it in that window, each member is charged at 30.00; otherwise each member is charged at the additional-patient fee of 35.00."
      hh_lead_days: "counting calendar days from the booking date to the appointment date"
      hh_notice_add: "a visit booked three days or fewer ahead adds 5.00 to each member's rate, a visit booked 14 days or more ahead takes 3.00 off each member's rate, and a visit booked four to 13 days ahead leaves the rate unchanged."
      hh_order_class: "when the patient's order is of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class"
      hh_member_kit: "when the patient's order is of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class each member's rate carries 4.00 more, when it is of the Specialty Clinical Testing, Molecular Infectious Disease Testing or Clinical Toxicology Testing class each member's rate carries 2.00 more, and for any other class nothing is added."
      hh_published_zone_fee: "the zone fee published for the band the visit was booked in (75.00 for zone 1, 95.00 for zone 2, 125.00 for zone 3)"
      hh_trip_entry: "compare the assessed trip fee on the visit with the zone fee published for the band the visit was booked in"
      hh_counted_members: "when two or more members were drawn and the assessed trip fee is 1.25 times that published zone fee or more, the first member counts in full and every further member counts as half a member; when two or more members were drawn and the assessed trip fee is above that published zone fee but below 1.25 times it, the first member counts in full and every further member counts as three quarters of a member; otherwise every member counts in full."
      hh_route_dow: "a visit starting before 07:30 on a Saturday or Sunday is charged the early-household addition per member drawn"
      hh_early_add: "a visit starting before 07:30 on a Saturday or Sunday is charged the early-household addition per member drawn, 10.00 for each additional household member; a visit starting before 07:30 on a weekday is charged it once per visit, 6.00 whatever the number of members; a visit starting at 07:30 or later carries no early-household addition."
      result: "first each member's rate is formed as the series member rate plus the short-notice member addition plus the member specimen kit, then that per-member rate is multiplied by the number of members counted under the shared extended dispatch step, then the early-household addition is added; a visit that drew no additional household member is charged nothing at all; the household charge is rounded to the cent only once, at the end."
    factors:
      - id: series_member_rate
        effect: parameter
        decides: hh_member_rate
        bindings: [hh_series_draws, hh_series_standing, hh_member_rate]
        ladder:
          - when: "the order is a standing order AND six or more test charges were posted on it in the last six months"
            value: "K('series_member_rate_6') = 25.00 per member"
          - when: "the order is a standing order AND three to five test charges were posted on it in the last six months"
            value: "K('series_member_rate_3') = 30.00 per member"
          - when: "otherwise"
            value: "P('additional_patient_fee') = 35.00 per member"
        baseline:
          hh_member_rate: "P('additional_patient_fee')"
        evidence: [cross_category, history]
        cross_difficulty: orders
      - id: short_notice_member_addition
        effect: parameter
        decides: hh_notice_add
        bindings: [hh_lead_days, hh_notice_add]
        ladder:
          - when: "booked three calendar days or fewer before the appointment date"
            value: "+K('short_notice_member_add') = +5.00 per member"
          - when: "booked 14 calendar days or more before the appointment date"
            value: "-K('planned_member_credit') = -3.00 per member"
          - when: "otherwise (four to 13 days)"
            value: "0.00"
        baseline:
          hh_notice_add: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: member_specimen_kit
        effect: parameter
        decides: hh_member_kit
        bindings: [hh_order_class, hh_member_kit]
        ladder:
          - when: "the patient's order is of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class"
            value: "K('member_kit_esoteric') = 4.00 per member"
          - when: "the patient's order is of the Specialty Clinical Testing, Molecular Infectious Disease Testing or Clinical Toxicology Testing class"
            value: "K('member_kit_specialty') = 2.00 per member"
          - when: "otherwise"
            value: "0.00"
        baseline:
          hh_member_kit: "0.0"
        evidence: [cross_category]
        cross_difficulty: orders
      - id: shared_extended_dispatch
        effect: parameter
        decides: hh_counted_members
        bindings: [hh_trip_entry, hh_counted_members]
        ladder:
          - when: "two or more members drawn AND the assessed trip fee is at least 1.25 times the published fee of the booked zone"
            value: "share K('extended_member_share') = 0.50 for every member after the first"
          - when: "two or more members drawn AND the assessed trip fee is above the published fee of the booked zone but below 1.25 times it"
            value: "share K('partial_member_share') = 0.75 for every member after the first"
          - when: "otherwise"
            value: "share 1 for every member (every member counts in full)"
        baseline:
          hh_counted_members: "hh_members"
        evidence: [history]
        cross_difficulty: null
      - id: early_household_addition
        effect: method
        decides: hh_early_add
        bindings: [hh_route_dow, hh_early_add]
        ladder:
          - when: "the visit starts before 07:30 AND the appointment date is a Saturday or Sunday"
            method: "charged per member drawn: K('early_weekend_household') = 10.00 multiplied by the number of additional household members drawn"
          - when: "the visit starts before 07:30 AND the appointment date is a weekday"
            method: "charged once per visit: K('early_weekday_household') = 6.00, whatever the number of members"
          - when: "otherwise (start at 07:30 or later)"
            method: "no early-household addition is charged"
        baseline:
          hh_early_add: "0.0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        Standard method: the household charge is the additional-patient fee of 35.00 multiplied by the number of additional household members drawn at the visit, posted as one assessed additional-patient fee rounded to the cent; a visit that drew no additional household member carries no household charge.
      params: [additional_patient_fee]
    inputs:
      history:
        - {table: visit_events, aggregate: sum, field: fee_amount, filters: {event_type: visits_fee_assessed, fee_type: trip_fee}}
        - {category: orders, table: order_events, aggregate: count, field: order_event_id, within_months: 6, filters: {event_type: orders_test_charge_posted}}
      cross_category: [orders]
  - id: visits_ext_weekend_charge
    base_policy_refs: [visits_evt_fee_assessment]
    overwrite:
      - base_policy: visits_evt_fee_assessment
        superseded_clause: >-
          plus weekend_surcharge when the appointment date is a Saturday or Sunday
        replaced_by: >-
          The weekend charge on a collected home visit dated on a Saturday or Sunday is worked out by the steps below rather than as one flat surcharge.
    trigger: state_due
    subject: [visits_fee_assessed]
    computes: fee_amount
    target_tool: assess_weekend_surcharge_242d901c
    params:
      sunday_rate: 50.00
      saturday_afternoon_rate: 45.00
      courier_esoteric: 25.00
      courier_specialty: 15.00
      short_notice_staffing: 10.00
      planned_staffing_credit: 5.00
      zone_1_listed: 75.00
      zone_2_listed: 95.00
      zone_3_listed: 125.00
      overlap_ratio: 1.25
      overlap_full: 0.50
      overlap_partial: 0.75
      per_person_share: 0.50
      single_member_factor: 1.25
      rotation_6: 0.65
      rotation_3: 0.80
    rule: >-
      The weekend charge on a collected home visit dated on a Saturday or Sunday is worked out by the steps below rather than as one flat surcharge.
      Standard method: a collected home visit whose appointment date is a Saturday or Sunday carries one weekend charge equal to the published weekend surcharge of 35.00, posted as one assessed weekend surcharge rounded to the cent; a weekday visit carries none.
      The weekend charge on a Saturday or Sunday home visit is not worked out until the visit's fee record shows its assessed trip fee.
      Before the weekend charge is worked out for a visit that drew additional household members, the visit must carry its assessed additional-patient fee.
      Weekend day rate: a visit on a Sunday starts from a weekend rate of 50.00, a visit on a Saturday starting at 12:00 or later starts from 45.00, and any other Saturday visit starts from the published weekend surcharge of 35.00.
      Weekend courier: the weekend courier to the reference laboratory adds 25.00 when the order collected is of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class, adds 15.00 when it is of the Specialty Clinical Testing, Molecular Infectious Disease Testing or Clinical Toxicology Testing class, and adds nothing for any other class.
      Weekend staffing notice: counting calendar days from the booking date to the appointment date, a weekend visit booked three days or fewer ahead adds 10.00 for call-in staffing, one booked 14 days or more ahead takes 5.00 off, and one booked four to 13 days ahead is unchanged.
      Weekend dispatch overlap: compare the visit's assessed trip fee with the listed trip fee of the zone it was booked in (75.00 for zone 1, 95.00 for zone 2, 125.00 for zone 3); when the assessed trip fee is 1.25 times that listed fee or more, the weekend dispatch has already been charged in the trip and the weekend amount is multiplied by 0.50; when it is above the listed fee but below 1.25 times it, the weekend amount is multiplied by 0.75; otherwise the weekend amount is taken in full.
      Weekend per-person staffing: when the visit carries an assessed additional-patient fee and two or more household members were drawn, the weekend amount is charged per person drawn at half a share each, that is multiplied by the number of people drawn (the patient plus the members) and then by 0.50; when the visit carries an assessed additional-patient fee and exactly one member was drawn, the weekend amount is multiplied by 1.25; otherwise the weekend amount is charged once per visit.
      Standing-series weekend rotation: when the order is a standing order and six or more test charges were posted on it in the last six months, the weekend amount is multiplied by 0.65; when it is a standing order and three to five test charges were posted on it in that window, it is multiplied by 0.80; otherwise it is taken as it stands.
      Order of the calculation: first the weekend day rate, the weekend courier and the weekend staffing notice are added together to give the weekend amount, then that amount is multiplied in turn by the dispatch overlap factor, the per-person staffing factor and the series rotation factor, each multiplication acting on the result of the one before; the weekend charge is rounded to the cent only once, at the end.
    prerequisite:
      - problem: visits_ext_trip_charge
        kind: value_input
        gate: wk_trip_entry
        form: state
        policy_source: >-
          The weekend charge on a Saturday or Sunday home visit is not worked out until the visit's fee record shows its assessed trip fee.
        condition: >-
          The visit's fee record carries an assessed trip fee line (fee type trip_fee) when the weekend charge is worked out.
        resolved_by: assess_trip_fee_73c5b19a
        effect: >-
          Once the trip fee is assessed, the weekend dispatch overlap step compares it with the listed zone fee and may reduce the weekend amount; without it the weekend amount is taken in full.
      - problem: visits_ext_household_charge
        kind: value_input
        gate: wk_household_entry
        form: state
        policy_source: >-
          Before the weekend charge is worked out for a visit that drew additional household members, the visit must carry its assessed additional-patient fee.
        condition: >-
          For a visit with additional household members drawn, the visit's fee record carries an assessed additional-patient fee line (fee type additional_patient_fee) when the weekend charge is worked out.
        resolved_by: assess_household_fee_59046739
        effect: >-
          Once the additional-patient fee is assessed, the per-person staffing step charges the weekend amount per person drawn; without it the weekend amount is charged once per visit.
    cross_category:
      - category: orders
        as: history
        reads: [standing_order, variant_name, order_events.event_type, order_events.event_date]
        note: The weekend courier reads the order's service class and the standing-series weekend rotation reads its standing flag and posted test charges.
    compute:
      - wk_dow: "DAYS('2026-01-03', F('appointment_date')) % 7"
      - wk_day_rate: "K('sunday_rate') if wk_dow == 1 else (K('saturday_afternoon_rate') if (wk_dow == 0 and F('appointment_time') >= '12:00') else P('weekend_surcharge'))"
      - wk_order_class: "CFIELD('orders', 'variant_name', order_id=F('order_id'))"
      - wk_courier: "K('courier_esoteric') if (wk_order_class == 'Esoteric Reference Testing' or wk_order_class == 'Hereditary & Reproductive Genetic Testing') else (K('courier_specialty') if (wk_order_class == 'Specialty Clinical Testing' or wk_order_class == 'Molecular Infectious Disease Testing' or wk_order_class == 'Clinical Toxicology Testing') else 0.0)"
      - wk_lead_days: "DAYS(F('booked_date'), F('appointment_date'))"
      - wk_staffing: "K('short_notice_staffing') if wk_lead_days <= 3 else (-K('planned_staffing_credit') if wk_lead_days >= 14 else 0.0)"
      - wk_listed_zone_fee: "K('zone_1_listed') if F('service_zone') == 'zone_1' else (K('zone_2_listed') if F('service_zone') == 'zone_2' else K('zone_3_listed'))"
      - wk_trip_entry: "SUM('visit_events', 'fee_amount', event_type='visits_fee_assessed', fee_type='trip_fee')"
      - wk_overlap: "K('overlap_full') if wk_trip_entry >= K('overlap_ratio') * wk_listed_zone_fee else (K('overlap_partial') if (wk_trip_entry > wk_listed_zone_fee and wk_trip_entry < K('overlap_ratio') * wk_listed_zone_fee) else 1.0)"
      - wk_household_entry: "SUM('visit_events', 'fee_amount', event_type='visits_fee_assessed', fee_type='additional_patient_fee')"
      - wk_people: "(1 + F('additional_household_patients')) * K('per_person_share') if (wk_household_entry > 0 and F('additional_household_patients') >= 2) else (K('single_member_factor') if (wk_household_entry > 0 and F('additional_household_patients') == 1) else 1.0)"
      - wk_series_draws: "XCOUNT('orders', 'order_events', within_months=6, date_field='event_date', event_type='orders_test_charge_posted', order_id=F('order_id'))"
      - wk_series_standing: "CFIELD('orders', 'standing_order', order_id=F('order_id'))"
      - wk_rotation: "K('rotation_6') if (wk_series_standing == True and wk_series_draws >= 6) else (K('rotation_3') if (wk_series_standing == True and wk_series_draws >= 3) else 1.0)"
      - wk_is_weekend: "DAYS('2026-01-03', F('appointment_date')) % 7 <= 1"
      - result: "RND((wk_day_rate + wk_courier + wk_staffing) * wk_overlap * wk_people * wk_rotation, 2) if wk_is_weekend else 0.0"
    compute_basis:
      wk_dow: "a visit on a Sunday starts from a weekend rate of 50.00, a visit on a Saturday starting at 12:00 or later starts from 45.00"
      wk_day_rate: "a visit on a Sunday starts from a weekend rate of 50.00, a visit on a Saturday starting at 12:00 or later starts from 45.00, and any other Saturday visit starts from the published weekend surcharge of 35.00."
      wk_order_class: "when the order collected is of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class"
      wk_courier: "the weekend courier to the reference laboratory adds 25.00 when the order collected is of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class, adds 15.00 when it is of the Specialty Clinical Testing, Molecular Infectious Disease Testing or Clinical Toxicology Testing class, and adds nothing for any other class."
      wk_lead_days: "counting calendar days from the booking date to the appointment date"
      wk_staffing: "a weekend visit booked three days or fewer ahead adds 10.00 for call-in staffing, one booked 14 days or more ahead takes 5.00 off, and one booked four to 13 days ahead is unchanged."
      wk_listed_zone_fee: "the listed trip fee of the zone it was booked in (75.00 for zone 1, 95.00 for zone 2, 125.00 for zone 3)"
      wk_trip_entry: "compare the visit's assessed trip fee with the listed trip fee of the zone it was booked in"
      wk_overlap: "when the assessed trip fee is 1.25 times that listed fee or more, the weekend dispatch has already been charged in the trip and the weekend amount is multiplied by 0.50; when it is above the listed fee but below 1.25 times it, the weekend amount is multiplied by 0.75; otherwise the weekend amount is taken in full."
      wk_household_entry: "when the visit carries an assessed additional-patient fee"
      wk_people: "when the visit carries an assessed additional-patient fee and two or more household members were drawn, the weekend amount is charged per person drawn at half a share each, that is multiplied by the number of people drawn (the patient plus the members) and then by 0.50; when the visit carries an assessed additional-patient fee and exactly one member was drawn, the weekend amount is multiplied by 1.25; otherwise the weekend amount is charged once per visit."
      wk_series_draws: "six or more test charges were posted on it in the last six months"
      wk_series_standing: "when the order is a standing order"
      wk_rotation: "when the order is a standing order and six or more test charges were posted on it in the last six months, the weekend amount is multiplied by 0.65; when it is a standing order and three to five test charges were posted on it in that window, it is multiplied by 0.80; otherwise it is taken as it stands."
      wk_is_weekend: "a collected home visit whose appointment date is a Saturday or Sunday carries one weekend charge equal to the published weekend surcharge of 35.00, posted as one assessed weekend surcharge rounded to the cent; a weekday visit carries none."
      result: "first the weekend day rate, the weekend courier and the weekend staffing notice are added together to give the weekend amount, then that amount is multiplied in turn by the dispatch overlap factor, the per-person staffing factor and the series rotation factor, each multiplication acting on the result of the one before; the weekend charge is rounded to the cent only once, at the end."
    factors:
      - id: weekend_day_rate
        effect: parameter
        decides: wk_day_rate
        bindings: [wk_dow, wk_day_rate]
        ladder:
          - when: "the appointment date is a Sunday"
            value: "K('sunday_rate') = 50.00"
          - when: "the appointment date is a Saturday AND the visit starts at 12:00 or later"
            value: "K('saturday_afternoon_rate') = 45.00"
          - when: "otherwise (a Saturday visit starting before 12:00)"
            value: "P('weekend_surcharge') = 35.00"
        baseline:
          wk_day_rate: "P('weekend_surcharge')"
        evidence: [date]
        cross_difficulty: null
      - id: weekend_courier
        effect: parameter
        decides: wk_courier
        bindings: [wk_order_class, wk_courier]
        ladder:
          - when: "the order is of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class"
            value: "K('courier_esoteric') = 25.00"
          - when: "the order is of the Specialty Clinical Testing, Molecular Infectious Disease Testing or Clinical Toxicology Testing class"
            value: "K('courier_specialty') = 15.00"
          - when: "otherwise"
            value: "0.00"
        baseline:
          wk_courier: "0.0"
        evidence: [cross_category]
        cross_difficulty: orders
      - id: weekend_staffing_notice
        effect: parameter
        decides: wk_staffing
        bindings: [wk_lead_days, wk_staffing]
        ladder:
          - when: "booked three calendar days or fewer before the appointment date"
            value: "+K('short_notice_staffing') = +10.00"
          - when: "booked 14 calendar days or more before the appointment date"
            value: "-K('planned_staffing_credit') = -5.00"
          - when: "otherwise (four to 13 days)"
            value: "0.00"
        baseline:
          wk_staffing: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: weekend_dispatch_overlap
        effect: parameter
        decides: wk_overlap
        bindings: [wk_trip_entry, wk_overlap]
        ladder:
          - when: "the assessed trip fee is at least 1.25 times the listed fee of the booked zone"
            value: "overlap factor K('overlap_full') = 0.50"
          - when: "the assessed trip fee is above the listed fee of the booked zone but below 1.25 times it"
            value: "overlap factor K('overlap_partial') = 0.75"
          - when: "otherwise"
            value: "overlap factor 1.00 (taken in full)"
        baseline:
          wk_overlap: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: weekend_per_person_staffing
        effect: method
        decides: wk_people
        bindings: [wk_household_entry, wk_people]
        ladder:
          - when: "an assessed additional-patient fee stands on the visit AND two or more members were drawn"
            method: "charged per person drawn at half a share each: multiplied by (1 + members) and then by 0.50"
          - when: "an assessed additional-patient fee stands on the visit AND exactly one member was drawn"
            method: "multiplied by 1.25"
          - when: "otherwise"
            method: "charged once per visit"
        baseline:
          wk_people: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: series_weekend_rotation
        effect: parameter
        decides: wk_rotation
        bindings: [wk_series_draws, wk_series_standing, wk_rotation]
        ladder:
          - when: "the order is a standing order AND six or more test charges were posted on it in the last six months"
            value: "rotation factor K('rotation_6') = 0.65"
          - when: "the order is a standing order AND three to five test charges were posted on it in the last six months"
            value: "rotation factor K('rotation_3') = 0.80"
          - when: "otherwise"
            value: "rotation factor 1.00 (as it stands)"
        baseline:
          wk_rotation: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: orders
    baseline:
      rule: >-
        Standard method: a collected home visit whose appointment date is a Saturday or Sunday carries one weekend charge equal to the published weekend surcharge of 35.00, posted as one assessed weekend surcharge rounded to the cent; a weekday visit carries none.
      params: [weekend_surcharge]
    inputs:
      history:
        - {table: visit_events, aggregate: sum, field: fee_amount, filters: {event_type: visits_fee_assessed, fee_type: trip_fee}}
        - {table: visit_events, aggregate: sum, field: fee_amount, filters: {event_type: visits_fee_assessed, fee_type: additional_patient_fee}}
        - {category: orders, table: order_events, aggregate: count, field: order_event_id, within_months: 6, filters: {event_type: orders_test_charge_posted}}
      cross_category: [orders]
  - id: visits_ext_home_visit_settlement
    base_policy_refs: [visits_evt_fee_payment_and_refund, visits_evt_fee_assessment]
    overwrite:
      - base_policy: visits_evt_fee_assessment
        superseded_clause: >-
          Fees are charged to the card on file when fee_due_timing is at_completion
        replaced_by: >-
          Service charges of a collected home visit that were not charged to a card when the collection was completed stay open on the visit and are settled when the patient asks to pay them, by the settlement payment below.
      - base_policy: visits_evt_fee_payment_and_refund
        superseded_clause: >-
          A fee is paid in full in one payment with a method listed in fee_payment_methods
        replaced_by: >-
          The service charges of a collected home visit are settled together by one card payment, taken with a method the visit type accepts and recorded against the visit's assessed trip fee; once that payment is taken the visit's trip, additional-patient and weekend charges are settled and nothing more is collected for them.
    trigger: on_request
    subject: [visits_fee_paid]
    computes: fee_amount
    target_tool: pay_home_visit_fees_e8e0d8a4
    params:
      late_posting_days: 7
      posting_grace_days: 3
      prompt_rate_10: 0.05
      prompt_rate_30: 0.02
      bundle_rate_3: 0.03
      bundle_rate_2: 0.01
      selfpay_uninsured_rate: 0.10
      selfpay_insured_rate: 0.05
      standing_rate_3: 0.03
      standing_rate_1: 0.01
    rule: >-
      The service charges of a collected home visit are settled together by one card payment, taken with a method the visit type accepts and recorded against the visit's assessed trip fee; once that payment is taken the visit's trip, additional-patient and weekend charges are settled and nothing more is collected for them.
      Service charges of a collected home visit that were not charged to a card when the collection was completed stay open on the visit and are settled when the patient asks to pay them, by the settlement payment below.
      Standard method: the home-visit settlement charge is the total of the charges standing open on the visit, that is its trip, additional-patient and weekend charges and any late-change charge, where a charge stands open for its assessed amount less any waiver or payment posted against it plus any refund of such a payment, rounded to the cent.
      The home-visit settlement charge is taken only after the trip fee assessed on the visit stands on its fee record.
      No home-visit settlement charge is taken until the visit carries the assessed additional-patient fee owed for the household members drawn at it.
      For a visit dated on a Saturday or Sunday, the home-visit settlement charge is worked out only after its assessed weekend surcharge is on the fee record.
      Settlement day count: the days to settlement are counted in calendar days up to today; when the charges were posted more than 7 days after the collection date (the posting date being the latest date on which a fee was assessed on the visit), the count starts on that posting date; when they were posted 4 to 7 days after collection, the count starts on the collection date and the days of posting delay beyond 3 are taken off the count; when they were posted within 3 days of collection, the count starts on the collection date.
      Prompt-settlement allowance: when the days to settlement are 10 or fewer and none of the patient's test invoices is placed with the collection agency, the allowance is 5 percent; when the days to settlement are 11 to 30 and none of the patient's test invoices is placed with the collection agency, it is 2 percent; otherwise there is no prompt-settlement allowance.
      Multi-charge allowance: a settlement covering three assessed service charges on the visit (trip, additional-patient and weekend) carries an allowance of 3 percent, one covering two of them carries 1 percent, and one covering a single charge carries none.
      Self-pay allowance: a coverage on file counts as live until it is terminated, whatever its verification status; when the order the visit collects is billed to the patient as self-pay and the patient has no live health coverage on file, the allowance is 10 percent; when the order is billed as self-pay and the patient does have a live coverage on file, it is 5 percent; when the order is billed to insurance or to a client account, there is none.
      Paying-history allowance: when three or more payments were received on the patient's test invoices in the last 12 months the allowance is 3 percent, when one or two were received it is 1 percent, and when none was received there is none.
      Order of the calculation: the prompt-settlement, multi-charge, self-pay and paying-history allowances are first added together into one total allowance, and the open total is reduced once by that total allowance; the allowances do not act one after another, and the result is rounded to the cent only once, at the end.
    prerequisite:
      - problem: visits_ext_trip_charge
        kind: value_input
        gate: st_open_trip
        form: state
        policy_source: >-
          The home-visit settlement charge is taken only after the trip fee assessed on the visit stands on its fee record.
        condition: >-
          The visit's fee record carries an assessed trip fee line (fee type trip_fee) when the settlement charge is worked out.
        resolved_by: assess_trip_fee_73c5b19a
        effect: >-
          The assessed trip fee enters the open total the settlement charge is reduced from; without it the open total lacks the trip charge.
      - problem: visits_ext_household_charge
        kind: value_input
        gate: st_open_household
        form: state
        policy_source: >-
          No home-visit settlement charge is taken until the visit carries the assessed additional-patient fee owed for the household members drawn at it.
        condition: >-
          For a visit that drew additional household members, the visit's fee record carries an assessed additional-patient fee line when the settlement charge is worked out.
        resolved_by: assess_household_fee_59046739
        effect: >-
          The assessed additional-patient fee enters the open total and raises the count of service charges the multi-charge allowance reads.
      - problem: visits_ext_weekend_charge
        kind: value_input
        gate: st_open_weekend
        form: state
        policy_source: >-
          For a visit dated on a Saturday or Sunday, the home-visit settlement charge is worked out only after its assessed weekend surcharge is on the fee record.
        condition: >-
          For a visit dated on a Saturday or Sunday, the visit's fee record carries an assessed weekend surcharge line when the settlement charge is worked out.
        resolved_by: assess_weekend_surcharge_242d901c
        effect: >-
          The assessed weekend surcharge enters the open total and raises the count of service charges the multi-charge allowance reads.
    cross_category:
      - category: invoices
        as: history
        reads: [status, invoice_transactions.event_type, invoice_transactions.event_date]
        note: The prompt-settlement allowance reads whether any of the patient's invoices is in collections, and the paying-history allowance counts the payments received on the patient's invoices in the last 12 months.
      - category: orders
        as: branch
        reads: [billing_method]
        note: The self-pay allowance reads how the order the visit collects is billed.
      - category: coverage
        as: existence
        reads: [status]
        note: The self-pay allowance reads whether the patient has a live (not terminated) coverage on file.
    compute:
      - st_open_trip: "SUM('visit_events', 'fee_amount', event_type='visits_fee_assessed', fee_type='trip_fee') - SUM('visit_events', 'fee_amount', event_type='visits_fee_waived', fee_type='trip_fee') - SUM('visit_events', 'fee_amount', event_type='visits_fee_paid', fee_type='trip_fee') + SUM('visit_events', 'fee_amount', event_type='visits_fee_refunded', fee_type='trip_fee')"
      - st_open_household: "SUM('visit_events', 'fee_amount', event_type='visits_fee_assessed', fee_type='additional_patient_fee') - SUM('visit_events', 'fee_amount', event_type='visits_fee_waived', fee_type='additional_patient_fee') - SUM('visit_events', 'fee_amount', event_type='visits_fee_paid', fee_type='additional_patient_fee') + SUM('visit_events', 'fee_amount', event_type='visits_fee_refunded', fee_type='additional_patient_fee')"
      - st_open_weekend: "SUM('visit_events', 'fee_amount', event_type='visits_fee_assessed', fee_type='weekend_surcharge') - SUM('visit_events', 'fee_amount', event_type='visits_fee_waived', fee_type='weekend_surcharge') - SUM('visit_events', 'fee_amount', event_type='visits_fee_paid', fee_type='weekend_surcharge') + SUM('visit_events', 'fee_amount', event_type='visits_fee_refunded', fee_type='weekend_surcharge')"
      - st_open_late_change: "SUM('visit_events', 'fee_amount', event_type='visits_fee_assessed', fee_type='late_cancellation_fee') - SUM('visit_events', 'fee_amount', event_type='visits_fee_waived', fee_type='late_cancellation_fee') - SUM('visit_events', 'fee_amount', event_type='visits_fee_paid', fee_type='late_cancellation_fee') + SUM('visit_events', 'fee_amount', event_type='visits_fee_refunded', fee_type='late_cancellation_fee')"
      - st_open_total: "st_open_trip + st_open_household + st_open_weekend + st_open_late_change"
      - st_posted_date: "LATEST('visit_events', 'event_date', date_field='event_date', event_type='visits_fee_assessed')"
      - st_post_lag: "DAYS(F('collected_date'), st_posted_date)"
      - st_settle_days: "DAYS(st_posted_date, NOW) if st_post_lag > K('late_posting_days') else (DAYS(F('collected_date'), NOW) - (st_post_lag - K('posting_grace_days')) if st_post_lag > K('posting_grace_days') else DAYS(F('collected_date'), NOW))"
      - st_collections: "EXISTS('invoices', status='collections')"
      - st_prompt_rate: "K('prompt_rate_10') if (st_settle_days <= 10 and st_collections == False) else (K('prompt_rate_30') if (st_settle_days >= 11 and st_settle_days <= 30 and st_collections == False) else 0.0)"
      - st_charge_count: "COUNT('visit_events', event_type='visits_fee_assessed', fee_type='trip_fee') + COUNT('visit_events', event_type='visits_fee_assessed', fee_type='additional_patient_fee') + COUNT('visit_events', event_type='visits_fee_assessed', fee_type='weekend_surcharge')"
      - st_bundle_rate: "K('bundle_rate_3') if st_charge_count >= 3 else (K('bundle_rate_2') if st_charge_count == 2 else 0.0)"
      - st_billing: "CFIELD('orders', 'billing_method', order_id=F('order_id'))"
      - st_live_coverage: "EXISTS('coverage', status='active') or EXISTS('coverage', status='pending_verification') or EXISTS('coverage', status='inactive')"
      - st_selfpay_rate: "K('selfpay_uninsured_rate') if (st_billing == 'self_pay' and st_live_coverage == False) else (K('selfpay_insured_rate') if (st_billing == 'self_pay' and st_live_coverage == True) else 0.0)"
      - st_invoice_payments: "XCOUNT('invoices', 'invoice_transactions', within_months=12, date_field='event_date', event_type='invoices_payment_received')"
      - st_history_rate: "K('standing_rate_3') if st_invoice_payments >= 3 else (K('standing_rate_1') if st_invoice_payments >= 1 else 0.0)"
      - result: "RND(st_open_total * (1 - (st_prompt_rate + st_bundle_rate + st_selfpay_rate + st_history_rate)), 2)"
    compute_basis:
      st_open_trip: "the total of the charges standing open on the visit, that is its trip, additional-patient and weekend charges and any late-change charge, where a charge stands open for its assessed amount less any waiver or payment posted against it plus any refund of such a payment"
      st_open_household: "the total of the charges standing open on the visit, that is its trip, additional-patient and weekend charges and any late-change charge, where a charge stands open for its assessed amount less any waiver or payment posted against it plus any refund of such a payment"
      st_open_weekend: "the total of the charges standing open on the visit, that is its trip, additional-patient and weekend charges and any late-change charge, where a charge stands open for its assessed amount less any waiver or payment posted against it plus any refund of such a payment"
      st_open_late_change: "the total of the charges standing open on the visit, that is its trip, additional-patient and weekend charges and any late-change charge, where a charge stands open for its assessed amount less any waiver or payment posted against it plus any refund of such a payment"
      st_posted_date: "the posting date being the latest date on which a fee was assessed on the visit"
      st_post_lag: "when the charges were posted more than 7 days after the collection date"
      st_settle_days: "when the charges were posted more than 7 days after the collection date (the posting date being the latest date on which a fee was assessed on the visit), the count starts on that posting date; when they were posted 4 to 7 days after collection, the count starts on the collection date and the days of posting delay beyond 3 are taken off the count; when they were posted within 3 days of collection, the count starts on the collection date."
      st_collections: "none of the patient's test invoices is placed with the collection agency"
      st_prompt_rate: "when the days to settlement are 10 or fewer and none of the patient's test invoices is placed with the collection agency, the allowance is 5 percent; when the days to settlement are 11 to 30 and none of the patient's test invoices is placed with the collection agency, it is 2 percent; otherwise there is no prompt-settlement allowance."
      st_charge_count: "a settlement covering three assessed service charges on the visit (trip, additional-patient and weekend)"
      st_bundle_rate: "a settlement covering three assessed service charges on the visit (trip, additional-patient and weekend) carries an allowance of 3 percent, one covering two of them carries 1 percent, and one covering a single charge carries none."
      st_billing: "when the order the visit collects is billed to the patient as self-pay"
      st_live_coverage: "a coverage on file counts as live until it is terminated, whatever its verification status"
      st_selfpay_rate: "when the order the visit collects is billed to the patient as self-pay and the patient has no live health coverage on file, the allowance is 10 percent; when the order is billed as self-pay and the patient does have a live coverage on file, it is 5 percent; when the order is billed to insurance or to a client account, there is none."
      st_invoice_payments: "three or more payments were received on the patient's test invoices in the last 12 months"
      st_history_rate: "when three or more payments were received on the patient's test invoices in the last 12 months the allowance is 3 percent, when one or two were received it is 1 percent, and when none was received there is none."
      result: "the prompt-settlement, multi-charge, self-pay and paying-history allowances are first added together into one total allowance, and the open total is reduced once by that total allowance; the allowances do not act one after another, and the result is rounded to the cent only once, at the end."
    factors:
      - id: settlement_day_count
        effect: method
        decides: st_settle_days
        bindings: [st_posted_date, st_post_lag, st_settle_days]
        ladder:
          - when: "the charges were posted more than 7 days after the collection date"
            method: "the days to settlement are counted from the posting date to today"
          - when: "the charges were posted 4 to 7 days after the collection date"
            method: "counted from the collection date to today, less the days of posting delay beyond 3"
          - when: "otherwise (posted within 3 days of collection)"
            method: "counted from the collection date to today"
        baseline:
          st_settle_days: "DAYS(F('collected_date'), NOW)"
        evidence: [history, date]
        cross_difficulty: null
      - id: prompt_settlement_allowance
        effect: parameter
        decides: st_prompt_rate
        bindings: [st_collections, st_prompt_rate]
        ladder:
          - when: "days to settlement 10 or fewer AND no test invoice of the patient is in collections"
            value: "K('prompt_rate_10') = 5 percent"
          - when: "days to settlement 11 to 30 AND no test invoice of the patient is in collections"
            value: "K('prompt_rate_30') = 2 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          st_prompt_rate: "0.0"
        evidence: [cross_category, date]
        cross_difficulty: invoices
      - id: multi_charge_allowance
        effect: parameter
        decides: st_bundle_rate
        bindings: [st_charge_count, st_bundle_rate]
        ladder:
          - when: "three assessed service charges stand on the visit"
            value: "K('bundle_rate_3') = 3 percent"
          - when: "two assessed service charges stand on the visit"
            value: "K('bundle_rate_2') = 1 percent"
          - when: "otherwise (a single charge)"
            value: "0 percent"
        baseline:
          st_bundle_rate: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: self_pay_allowance
        effect: parameter
        decides: st_selfpay_rate
        bindings: [st_billing, st_live_coverage, st_selfpay_rate]
        ladder:
          - when: "the order is billed as self-pay AND the patient has no live coverage on file"
            value: "K('selfpay_uninsured_rate') = 10 percent"
          - when: "the order is billed as self-pay AND the patient has a live coverage on file"
            value: "K('selfpay_insured_rate') = 5 percent"
          - when: "otherwise (billed to insurance or a client account)"
            value: "0 percent"
        baseline:
          st_selfpay_rate: "0.0"
        evidence: [cross_category]
        cross_difficulty: orders
      - id: paying_history_allowance
        effect: parameter
        decides: st_history_rate
        bindings: [st_invoice_payments, st_history_rate]
        ladder:
          - when: "three or more payments received on the patient's test invoices in the last 12 months"
            value: "K('standing_rate_3') = 3 percent"
          - when: "one or two payments received in that window"
            value: "K('standing_rate_1') = 1 percent"
          - when: "otherwise (none received)"
            value: "0 percent"
        baseline:
          st_history_rate: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: invoices
    baseline:
      rule: >-
        Standard method: the home-visit settlement charge is the total of the charges standing open on the visit, that is its trip, additional-patient and weekend charges and any late-change charge, where a charge stands open for its assessed amount less any waiver or payment posted against it plus any refund of such a payment, rounded to the cent.
      params: []
    inputs:
      history:
        - {table: visit_events, aggregate: sum, field: fee_amount, filters: {event_type: visits_fee_assessed}}
        - {table: visit_events, aggregate: latest, field: event_date, filters: {event_type: visits_fee_assessed}}
        - {category: invoices, table: invoice_transactions, aggregate: count, field: invoice_transaction_id, within_months: 12, filters: {event_type: invoices_payment_received}}
      cross_category: [invoices, orders, coverage]
  - id: visits_ext_missed_visit_charge
    base_policy_refs: [visits_evt_fee_assessment, visits_evt_cancellation_and_no_show]
    overwrite:
      - base_policy: visits_evt_cancellation_and_no_show
        superseded_clause: >-
          assesses no_show_fee when above 0.00
        replaced_by: >-
          The no-show charge on a home visit recorded as missed is worked out by the steps below rather than as one flat fee.
    trigger: state_due
    subject: [visits_fee_assessed]
    computes: fee_amount
    target_tool: assess_no_show_fee_12606755
    params:
      sunday_missed_rate: 80.00
      saturday_missed_rate: 75.00
      long_dispatch_zone_3: 20.00
      long_dispatch_zone_2: 10.00
      provider_hold_share: 0.50
      patient_hold_share: 0.75
      early_weekend_missed: 10.00
      early_weekday_missed: 5.00
    rule: >-
      The no-show charge on a home visit recorded as missed is worked out by the steps below rather than as one flat fee.
      Standard method: a home visit recorded as a no-show carries one no-show charge equal to the published no-show fee of 60.00, posted as one assessed no-show fee rounded to the cent; a no-show assesses only the no-show fee, never a trip fee.
      Missed weekend dispatch rate: a missed visit whose appointment date is a Sunday starts from 80.00, one whose appointment date is a Saturday starts from 75.00, and a missed weekday visit starts from the published no-show fee of 60.00.
      Wasted long dispatch: counting calendar days from the booking date to the appointment date, a missed visit in service zone 3 that was booked three days or fewer ahead adds 20.00, a missed visit in service zone 2 that was booked three days or fewer ahead adds 10.00, and any other missed visit adds nothing.
      Missed early route: a missed visit that was to start before 08:00 on a Saturday or Sunday is charged the early-route addition per person booked, 10.00 for the patient and 10.00 for each additional household member booked on the visit; one that was to start before 08:00 on a weekday is charged it once per visit, 5.00 whatever the number of people booked; one starting at 08:00 or later carries no early-route addition.
      Order held at the missed visit: when the order the visit was to collect is on an information hold for a missing diagnosis that was placed on or before the appointment date and the patient has a live coverage on file (a coverage counts as live until it is terminated) to which the diagnosis codes must go, the collection could not have gone ahead for a reason on the ordering provider's side and the charge is multiplied by 0.50; when the order is on an information hold that was placed on or before the appointment date for a reason the patient had to resolve (an Advance Beneficiary Notice or an informed consent still to be signed, or a missing diagnosis while the patient has no live coverage on file, so that the patient had to put a coverage on file or switch the order to self-pay), the charge is multiplied by 0.75; otherwise the charge stands in full.
      Order of the calculation: first the missed weekend dispatch rate, the wasted long dispatch and the missed early route are added together, then that sum is multiplied by the held-order factor; the no-show charge is rounded to the cent only once, at the end.
    prerequisite: []
    cross_category:
      - category: orders
        as: branch
        reads: [status, hold_reason, hold_placed_date]
        note: The held-order factor reads whether the order the missed visit was to collect is on an information hold, why, and since when.
      - category: coverage
        as: existence
        reads: [status]
        note: The held-order factor's provider-side tier also reads whether the patient has a live (not terminated) coverage to which the diagnosis codes must go.
    compute:
      - ms_dow: "DAYS('2026-01-03', F('appointment_date')) % 7"
      - ms_rate: "K('sunday_missed_rate') if ms_dow == 1 else (K('saturday_missed_rate') if ms_dow == 0 else P('no_show_fee'))"
      - ms_lead_days: "DAYS(F('booked_date'), F('appointment_date'))"
      - ms_dispatch: "K('long_dispatch_zone_3') if (F('service_zone') == 'zone_3' and ms_lead_days <= 3) else (K('long_dispatch_zone_2') if (F('service_zone') == 'zone_2' and ms_lead_days <= 3) else 0.0)"
      - ms_early_dow: "DAYS('2026-01-05', F('appointment_date')) % 7"
      - ms_early: "K('early_weekend_missed') * (1 + F('additional_household_patients')) if (F('appointment_time') < '08:00' and ms_early_dow >= 5) else (K('early_weekday_missed') if (F('appointment_time') < '08:00' and ms_early_dow < 5) else 0.0)"
      - ms_order_status: "CFIELD('orders', 'status', order_id=F('order_id'))"
      - ms_hold_reason: "CFIELD('orders', 'hold_reason', order_id=F('order_id'))"
      - ms_hold_age: "DAYS(CFIELD('orders', 'hold_placed_date', order_id=F('order_id')), F('appointment_date')) if ms_order_status == 'info_hold' else -1"
      - ms_live_coverage: "EXISTS('coverage', status='active') or EXISTS('coverage', status='pending_verification') or EXISTS('coverage', status='inactive')"
      - ms_hold_factor: "K('provider_hold_share') if (ms_hold_reason == 'missing_diagnosis' and ms_hold_age >= 0 and ms_live_coverage == True) else (K('patient_hold_share') if ((ms_hold_reason == 'abn_required' or ms_hold_reason == 'informed_consent_missing' or (ms_hold_reason == 'missing_diagnosis' and ms_live_coverage == False)) and ms_hold_age >= 0) else 1.0)"
      - result: "RND((ms_rate + ms_dispatch + ms_early) * ms_hold_factor, 2)"
    compute_basis:
      ms_dow: "a missed visit whose appointment date is a Sunday starts from 80.00, one whose appointment date is a Saturday starts from 75.00"
      ms_rate: "a missed visit whose appointment date is a Sunday starts from 80.00, one whose appointment date is a Saturday starts from 75.00, and a missed weekday visit starts from the published no-show fee of 60.00."
      ms_lead_days: "counting calendar days from the booking date to the appointment date"
      ms_dispatch: "a missed visit in service zone 3 that was booked three days or fewer ahead adds 20.00, a missed visit in service zone 2 that was booked three days or fewer ahead adds 10.00, and any other missed visit adds nothing."
      ms_early_dow: "a missed visit that was to start before 08:00 on a Saturday or Sunday"
      ms_early: "a missed visit that was to start before 08:00 on a Saturday or Sunday is charged the early-route addition per person booked, 10.00 for the patient and 10.00 for each additional household member booked on the visit; one that was to start before 08:00 on a weekday is charged it once per visit, 5.00 whatever the number of people booked; one starting at 08:00 or later carries no early-route addition."
      ms_order_status: "when the order the visit was to collect is on an information hold"
      ms_hold_reason: "for a missing diagnosis"
      ms_hold_age: "that was placed on or before the appointment date"
      ms_live_coverage: "the patient has a live coverage on file (a coverage counts as live until it is terminated) to which the diagnosis codes must go"
      ms_hold_factor: "when the order the visit was to collect is on an information hold for a missing diagnosis that was placed on or before the appointment date and the patient has a live coverage on file (a coverage counts as live until it is terminated) to which the diagnosis codes must go, the collection could not have gone ahead for a reason on the ordering provider's side and the charge is multiplied by 0.50; when the order is on an information hold that was placed on or before the appointment date for a reason the patient had to resolve (an Advance Beneficiary Notice or an informed consent still to be signed, or a missing diagnosis while the patient has no live coverage on file, so that the patient had to put a coverage on file or switch the order to self-pay), the charge is multiplied by 0.75; otherwise the charge stands in full."
      result: "first the missed weekend dispatch rate, the wasted long dispatch and the missed early route are added together, then that sum is multiplied by the held-order factor; the no-show charge is rounded to the cent only once, at the end."
    factors:
      - id: missed_weekend_dispatch_rate
        effect: parameter
        decides: ms_rate
        bindings: [ms_dow, ms_rate]
        ladder:
          - when: "the missed appointment date is a Sunday"
            value: "K('sunday_missed_rate') = 80.00"
          - when: "the missed appointment date is a Saturday"
            value: "K('saturday_missed_rate') = 75.00"
          - when: "otherwise (a weekday)"
            value: "P('no_show_fee') = 60.00"
        baseline:
          ms_rate: "P('no_show_fee')"
        evidence: [date]
        cross_difficulty: null
      - id: wasted_long_dispatch
        effect: parameter
        decides: ms_dispatch
        bindings: [ms_lead_days, ms_dispatch]
        ladder:
          - when: "service zone 3 AND booked three calendar days or fewer ahead"
            value: "K('long_dispatch_zone_3') = 20.00"
          - when: "service zone 2 AND booked three calendar days or fewer ahead"
            value: "K('long_dispatch_zone_2') = 10.00"
          - when: "otherwise"
            value: "0.00"
        baseline:
          ms_dispatch: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: missed_early_route
        effect: method
        decides: ms_early
        bindings: [ms_early_dow, ms_early]
        ladder:
          - when: "start before 08:00 AND the date is a Saturday or Sunday"
            method: "charged per person booked: K('early_weekend_missed') = 10.00 times (1 + additional household members booked)"
          - when: "start before 08:00 AND the date is a weekday"
            method: "charged once per visit: K('early_weekday_missed') = 5.00, whatever the number of people booked"
          - when: "otherwise (start at 08:00 or later)"
            method: "no early-route addition is charged"
        baseline:
          ms_early: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: order_held_at_missed_visit
        effect: parameter
        decides: ms_hold_factor
        bindings: [ms_order_status, ms_hold_reason, ms_hold_age, ms_live_coverage, ms_hold_factor]
        ladder:
          - when: "the order is on an information hold for a missing diagnosis AND the hold was placed on or before the appointment date AND the patient has a live coverage on file"
            value: "held-order share K('provider_hold_share') = 0.50"
          - when: "the order is on an information hold for an ABN or informed consent still to be signed, or for a missing diagnosis while the patient has no live coverage on file, AND the hold was placed on or before the appointment date"
            value: "held-order share K('patient_hold_share') = 0.75"
          - when: "otherwise"
            value: "held-order share 1.00 (the charge stands in full)"
        baseline:
          ms_hold_factor: "1.0"
        evidence: [cross_category, date]
        cross_difficulty: orders
    baseline:
      rule: >-
        Standard method: a home visit recorded as a no-show carries one no-show charge equal to the published no-show fee of 60.00, posted as one assessed no-show fee rounded to the cent; a no-show assesses only the no-show fee, never a trip fee.
      params: [no_show_fee]
    inputs:
      history: []
      cross_category: [orders, coverage]
  - id: visits_ext_missed_visit_settlement
    base_policy_refs: [visits_evt_fee_payment_and_refund]
    overwrite:
      - base_policy: visits_evt_fee_payment_and_refund
        superseded_clause: >-
          A fee is paid in full in one payment
        replaced_by: >-
          A no-show charge is settled by one card payment of the missed-visit settlement charge, taken with a method the visit type accepts and recorded against the assessed no-show fee; once that payment is taken the no-show charge is settled and nothing more is collected for it.
    trigger: on_request
    subject: [visits_fee_paid]
    computes: fee_amount
    target_tool: pay_missed_visit_fee_baa116ed
    params:
      missed_late_posting_days: 7
      missed_posting_grace_days: 3
      missed_prompt_7: 0.10
      missed_prompt_30: 0.04
      plan_current_rate: 0.06
      plan_behind_rate: 0.02
      payment_record_3: 0.05
      payment_record_1: 0.02
    rule: >-
      A no-show charge is settled by one card payment of the missed-visit settlement charge, taken with a method the visit type accepts and recorded against the assessed no-show fee; once that payment is taken the no-show charge is settled and nothing more is collected for it.
      Standard method: the missed-visit settlement charge is the no-show charge standing open on the missed visit, that is the assessed no-show fee less any waiver or payment posted against it plus any refund of such a payment, rounded to the cent.
      The missed-visit settlement charge is fixed only after the missed visit carries its assessed no-show fee.
      Missed-visit day count: the days elapsed for a missed visit are counted in calendar days up to today; when the no-show fee was posted more than 7 days after the missed appointment date, the count starts on the date the no-show fee was posted; when it was posted 4 to 7 days after the missed appointment date, the count starts on the missed appointment date and the days of posting delay beyond 3 are taken off; when it was posted within 3 days of the missed appointment date, the count starts on the missed appointment date.
      Early settlement relief: when the days elapsed for the missed visit are 7 or fewer and none of the patient's test invoices is with the collection agency, the relief is 10 percent; when they are 8 to 30 and none of the patient's test invoices is with the collection agency, it is 4 percent; otherwise there is no early settlement relief.
      Payment-plan standing: when the patient has a payment plan in active status and no installment of the patient's plans was missed in the last six months, the relief is 6 percent; when the patient has a payment plan in active status and one or more installments were missed in that window, it is 2 percent; when the patient has no payment plan in active status, there is none.
      Invoice payment record: when three or more payments were received on the patient's invoices in the last 12 months the relief is 5 percent, when one or two were received in that window it is 2 percent, and when none was received there is none.
      Order of the calculation: the early settlement, payment-plan standing and invoice payment record reliefs are first added together into one relief, and the open no-show charge is reduced once by that relief; the reliefs never act one after another, and the result is rounded to the cent only once, at the end.
    prerequisite:
      - problem: visits_ext_missed_visit_charge
        kind: value_input
        gate: pm_open_no_show
        form: state
        policy_source: >-
          The missed-visit settlement charge is fixed only after the missed visit carries its assessed no-show fee.
        condition: >-
          The missed visit's fee record carries an assessed no-show fee line (fee type no_show_fee) when the settlement charge is worked out.
        resolved_by: assess_no_show_fee_12606755
        effect: >-
          The assessed no-show fee becomes the open charge the settlement is reduced from and its posting date anchors the missed-visit day count; without it there is no open charge to settle.
    cross_category:
      - category: invoices
        as: existence
        reads: [status, invoice_transactions.event_type, invoice_transactions.event_date]
        note: The early settlement relief reads whether any of the patient's invoices is with the collection agency, and the invoice payment record counts the payments received on the patient's invoices in the last 12 months.
      - category: plans
        as: history
        reads: [status, plan_transactions.event_type, plan_transactions.event_date]
        note: The payment-plan standing relief reads whether the patient holds an active plan and counts the installments missed in the last six months.
    compute:
      - pm_open_no_show: "SUM('visit_events', 'fee_amount', event_type='visits_fee_assessed', fee_type='no_show_fee') - SUM('visit_events', 'fee_amount', event_type='visits_fee_waived', fee_type='no_show_fee') - SUM('visit_events', 'fee_amount', event_type='visits_fee_paid', fee_type='no_show_fee') + SUM('visit_events', 'fee_amount', event_type='visits_fee_refunded', fee_type='no_show_fee')"
      - pm_posted_date: "LATEST('visit_events', 'event_date', date_field='event_date', event_type='visits_fee_assessed', fee_type='no_show_fee')"
      - pm_post_lag: "DAYS(F('appointment_date'), pm_posted_date)"
      - pm_elapsed_days: "DAYS(pm_posted_date, NOW) if pm_post_lag > K('missed_late_posting_days') else (DAYS(F('appointment_date'), NOW) - (pm_post_lag - K('missed_posting_grace_days')) if pm_post_lag > K('missed_posting_grace_days') else DAYS(F('appointment_date'), NOW))"
      - pm_collections: "EXISTS('invoices', status='collections')"
      - pm_early_relief: "K('missed_prompt_7') if (pm_elapsed_days <= 7 and pm_collections == False) else (K('missed_prompt_30') if (pm_elapsed_days >= 8 and pm_elapsed_days <= 30 and pm_collections == False) else 0.0)"
      - pm_active_plan: "EXISTS('plans', status='active')"
      - pm_missed_installments: "XCOUNT('plans', 'plan_transactions', within_months=6, date_field='event_date', event_type='plans_installment_missed')"
      - pm_plan_relief: "K('plan_current_rate') if (pm_active_plan == True and pm_missed_installments == 0) else (K('plan_behind_rate') if (pm_active_plan == True and pm_missed_installments >= 1) else 0.0)"
      - pm_invoice_payments: "XCOUNT('invoices', 'invoice_transactions', within_months=12, date_field='event_date', event_type='invoices_payment_received')"
      - pm_record_relief: "K('payment_record_3') if pm_invoice_payments >= 3 else (K('payment_record_1') if pm_invoice_payments >= 1 else 0.0)"
      - result: "RND(pm_open_no_show * (1 - (pm_early_relief + pm_plan_relief + pm_record_relief)), 2)"
    compute_basis:
      pm_open_no_show: "the no-show charge standing open on the missed visit, that is the assessed no-show fee less any waiver or payment posted against it plus any refund of such a payment"
      pm_posted_date: "the date the no-show fee was posted"
      pm_post_lag: "when the no-show fee was posted more than 7 days after the missed appointment date"
      pm_elapsed_days: "when the no-show fee was posted more than 7 days after the missed appointment date, the count starts on the date the no-show fee was posted; when it was posted 4 to 7 days after the missed appointment date, the count starts on the missed appointment date and the days of posting delay beyond 3 are taken off; when it was posted within 3 days of the missed appointment date, the count starts on the missed appointment date."
      pm_collections: "none of the patient's test invoices is with the collection agency"
      pm_early_relief: "when the days elapsed for the missed visit are 7 or fewer and none of the patient's test invoices is with the collection agency, the relief is 10 percent; when they are 8 to 30 and none of the patient's test invoices is with the collection agency, it is 4 percent; otherwise there is no early settlement relief."
      pm_active_plan: "when the patient has a payment plan in active status"
      pm_missed_installments: "no installment of the patient's plans was missed in the last six months"
      pm_plan_relief: "when the patient has a payment plan in active status and no installment of the patient's plans was missed in the last six months, the relief is 6 percent; when the patient has a payment plan in active status and one or more installments were missed in that window, it is 2 percent; when the patient has no payment plan in active status, there is none."
      pm_invoice_payments: "three or more payments were received on the patient's invoices in the last 12 months"
      pm_record_relief: "when three or more payments were received on the patient's invoices in the last 12 months the relief is 5 percent, when one or two were received in that window it is 2 percent, and when none was received there is none."
      result: "the early settlement, payment-plan standing and invoice payment record reliefs are first added together into one relief, and the open no-show charge is reduced once by that relief; the reliefs never act one after another, and the result is rounded to the cent only once, at the end."
    factors:
      - id: missed_visit_day_count
        effect: method
        decides: pm_elapsed_days
        bindings: [pm_posted_date, pm_post_lag, pm_elapsed_days]
        ladder:
          - when: "the no-show fee was posted more than 7 days after the missed appointment date"
            method: "days counted from the posting date to today"
          - when: "the no-show fee was posted 4 to 7 days after the missed appointment date"
            method: "days counted from the missed appointment date to today, less the posting delay beyond 3 days"
          - when: "otherwise (posted within 3 days)"
            method: "days counted from the missed appointment date to today"
        baseline:
          pm_elapsed_days: "DAYS(F('appointment_date'), NOW)"
        evidence: [history, date]
        cross_difficulty: null
      - id: early_settlement_relief
        effect: parameter
        decides: pm_early_relief
        bindings: [pm_collections, pm_early_relief]
        ladder:
          - when: "7 or fewer days elapsed AND no invoice of the patient is with the collection agency"
            value: "K('missed_prompt_7') = 10 percent"
          - when: "8 to 30 days elapsed AND no invoice of the patient is with the collection agency"
            value: "K('missed_prompt_30') = 4 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          pm_early_relief: "0.0"
        evidence: [cross_category, date]
        cross_difficulty: invoices
      - id: payment_plan_standing
        effect: parameter
        decides: pm_plan_relief
        bindings: [pm_active_plan, pm_missed_installments, pm_plan_relief]
        ladder:
          - when: "an active payment plan AND no installment missed in the last six months"
            value: "K('plan_current_rate') = 6 percent"
          - when: "an active payment plan AND one or more installments missed in the last six months"
            value: "K('plan_behind_rate') = 2 percent"
          - when: "otherwise (no active plan)"
            value: "0 percent"
        baseline:
          pm_plan_relief: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: plans
      - id: invoice_payment_record
        effect: parameter
        decides: pm_record_relief
        bindings: [pm_invoice_payments, pm_record_relief]
        ladder:
          - when: "three or more payments received on the patient's invoices in the last 12 months"
            value: "K('payment_record_3') = 5 percent"
          - when: "one or two payments received in that window"
            value: "K('payment_record_1') = 2 percent"
          - when: "otherwise (none received)"
            value: "0 percent"
        baseline:
          pm_record_relief: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: invoices
    baseline:
      rule: >-
        Standard method: the missed-visit settlement charge is the no-show charge standing open on the missed visit, that is the assessed no-show fee less any waiver or payment posted against it plus any refund of such a payment, rounded to the cent.
      params: []
    inputs:
      history:
        - {table: visit_events, aggregate: sum, field: fee_amount, filters: {event_type: visits_fee_assessed, fee_type: no_show_fee}}
        - {category: plans, table: plan_transactions, aggregate: count, field: plan_transaction_id, within_months: 6, filters: {event_type: plans_installment_missed}}
        - {category: invoices, table: invoice_transactions, aggregate: count, field: invoice_transaction_id, within_months: 12, filters: {event_type: invoices_payment_received}}
      cross_category: [invoices, plans]
  - id: visits_ext_late_change_charge
    base_policy_refs: [visits_evt_reschedule]
    overwrite:
      - base_policy: visits_evt_reschedule
        superseded_clause: >-
          a reschedule made with less notice on a visit type whose late_cancellation_fee is above 0.00 assesses that fee once, exactly as a late cancellation would
        replaced_by: >-
          A home visit moved on its appointment date or on the calendar day before it carries one late-change charge, posted as an assessed late-cancellation fee when the visit is moved and worked out by the steps below rather than as the flat late-cancellation fee.
      - base_policy: visits_evt_reschedule
        superseded_clause: >-
          A reschedule made at or beyond free_change_notice_hours before the current appointment start is free
        replaced_by: >-
          For a home visit the notice of a move is counted in calendar days from the date the move is recorded to the appointment date, not in hours, so a move recorded two or more calendar days before the appointment date is free whatever the clock time.
      - base_policy: visits_evt_reschedule
        superseded_clause: >-
          Notice is measured in elapsed hours from the moment the change is recorded to the current appointment date and time, and a change at exactly free_change_notice_hours counts as timely.
        replaced_by: >-
          For a home visit the notice of a move is counted in calendar days from the date the move is recorded to the appointment date, not in hours, so a move recorded two or more calendar days before the appointment date is free whatever the clock time.
    trigger: on_request
    subject: [visits_appointment_rescheduled]
    computes: fee_amount
    target_tool: reschedule_home_visit_6b0b2488
    params:
      visit_day_change_rate: 55.00
      day_before_early_rate: 45.00
      repeat_change_settled: 1.25
      repeat_change_rapid: 1.50
      settled_booking_days: 7
      change_kit_esoteric: 15.00
      change_kit_specialty: 8.00
      route_rebuild_zone_3_same_day: 15.00
      route_rebuild_zone_3: 10.00
      route_rebuild_zone_2_same_day: 5.00
      held_order_long: 15.00
      held_order_recent: 8.00
      held_order_days: 7
      household_visit_day: 24.00
      household_day_before: 5.00
    rule: >-
      A home visit moved on its appointment date or on the calendar day before it carries one late-change charge, posted as an assessed late-cancellation fee when the visit is moved and worked out by the steps below rather than as the flat late-cancellation fee.
      Standard method: the late-change charge is the published late-cancellation fee of 40.00, posted once as an assessed late-cancellation fee on the visit being moved and rounded to the cent; a move recorded two or more calendar days before the appointment date carries no charge.
      For a home visit the notice of a move is counted in calendar days from the date the move is recorded to the appointment date, not in hours, so a move recorded two or more calendar days before the appointment date is free whatever the clock time.
      A home visit is not moved to a new date until every home visit of the patient recorded as a no-show carries a no-show fee that is paid or waived, a no-show on a recollection visit excepted because it carries no fee.
      Change-day rate: counting calendar days from today to the current appointment date, a change recorded on the appointment date itself starts from 55.00, a change recorded the day before a visit that starts before 09:00 starts from 45.00, and any other late change starts from the published late-cancellation fee of 40.00.
      Repeat change: when the visit has already been moved at least once and it was booked 7 or more calendar days before today, the charge is multiplied by 1.25; when it has already been moved at least once and it was booked fewer than 7 days before today, the charge is multiplied by 1.50; when the visit has never been moved, the charge is taken as it stands.
      Prepared collection kit: a visit collecting an order of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class adds 15.00 for the kit already prepared, one collecting an order of the Specialty Clinical Testing, Molecular Infectious Disease Testing or Clinical Toxicology Testing class adds 8.00, and one collecting any other class adds nothing.
      Route rebuild: the phlebotomist's route for a day is already out once that day has begun, and the long routes of service zone 3 are planned a day ahead; so a visit in service zone 3 moved on its appointment date adds 15.00, a visit in service zone 3 moved the day before adds 10.00, a visit in service zone 2 moved on its appointment date adds 5.00, and any other late change (a zone 2 visit moved the day before, or a zone 1 visit) adds nothing.
      Household rescheduling: when one or more additional household members are booked on the visit, a change recorded the day before the appointment date is charged per person booked, 5.00 for the patient and 5.00 for each member, while a change recorded on the appointment date itself is charged once per visit, 24.00 whatever the number of people booked, which is never less than the day-before amount for a household of up to three members; a visit with no household member booked carries no household rescheduling amount.
      Order on hold deduction: when the order the visit is to collect is on an information hold placed 7 or more calendar days before today, the visit could not be collected until the hold clears and 15.00 is deducted; when the order is on an information hold placed fewer than 7 days before today, 8.00 is deducted; otherwise nothing is deducted.
      Order of the calculation: first the change-day rate, the prepared collection kit, the route rebuild and the household rescheduling amounts are added together, then that sum is multiplied by the repeat-change factor, then the order on hold deduction is subtracted from that product; the late-change charge never goes below 0.00 and is rounded to the cent only once, at the end.
    prerequisite:
      - problem: visits_ext_missed_visit_settlement
        kind: state_gate
        gate: visit_events.assessed_event_id
        form: state
        policy_source: >-
          A home visit is not moved to a new date until every home visit of the patient recorded as a no-show carries a no-show fee that is paid or waived, a no-show on a recollection visit excepted because it carries no fee.
        condition: >-
          For every Mobile In-Home visit of the patient with status no_show whose collection purpose is not recollection, the fee record carries an assessed no-show fee line and a visits_fee_paid or visits_fee_waived line whose assessed_event_id points at it.
        resolved_by: pay_missed_visit_fee_baa116ed
        effect: >-
          Once the missed-visit settlement payment is recorded against the assessed no-show fee, the patient's no-show home visit carries a paid no-show fee and the booked home visit may be moved.
    cross_category:
      - category: orders
        as: branch
        reads: [variant_name, status, hold_placed_date]
        note: The prepared collection kit reads the order's service class and the order on hold deduction reads whether it is on an information hold and since when.
    compute:
      - lc_days_to_visit: "DAYS(NOW, F('appointment_date'))"
      - lc_day_rate: "K('visit_day_change_rate') if lc_days_to_visit == 0 else (K('day_before_early_rate') if (lc_days_to_visit == 1 and F('appointment_time') < '09:00') else P('late_cancellation_fee'))"
      - lc_days_on_books: "DAYS(F('booked_date'), NOW)"
      - lc_repeat: "K('repeat_change_settled') if (F('reschedule_count') >= 1 and lc_days_on_books >= K('settled_booking_days')) else (K('repeat_change_rapid') if (F('reschedule_count') >= 1 and lc_days_on_books < K('settled_booking_days')) else 1.0)"
      - lc_order_class: "CFIELD('orders', 'variant_name', order_id=F('order_id'))"
      - lc_kit: "K('change_kit_esoteric') if (lc_order_class == 'Esoteric Reference Testing' or lc_order_class == 'Hereditary & Reproductive Genetic Testing') else (K('change_kit_specialty') if (lc_order_class == 'Specialty Clinical Testing' or lc_order_class == 'Molecular Infectious Disease Testing' or lc_order_class == 'Clinical Toxicology Testing') else 0.0)"
      - lc_route_days: "DAYS(NOW, F('appointment_date'))"
      - lc_route: "K('route_rebuild_zone_3_same_day') if (F('service_zone') == 'zone_3' and lc_route_days == 0) else (K('route_rebuild_zone_3') if (F('service_zone') == 'zone_3' and lc_route_days == 1) else (K('route_rebuild_zone_2_same_day') if (F('service_zone') == 'zone_2' and lc_route_days == 0) else 0.0))"
      - lc_household_days: "DAYS(NOW, F('appointment_date'))"
      - lc_household: "K('household_day_before') * (1 + F('additional_household_patients')) if (F('additional_household_patients') >= 1 and lc_household_days == 1) else (K('household_visit_day') if (F('additional_household_patients') >= 1 and lc_household_days == 0) else 0.0)"
      - lc_order_status: "CFIELD('orders', 'status', order_id=F('order_id'))"
      - lc_hold_days: "DAYS(CFIELD('orders', 'hold_placed_date', order_id=F('order_id')), NOW) if lc_order_status == 'info_hold' else -1"
      - lc_hold_deduction: "K('held_order_long') if (lc_order_status == 'info_hold' and lc_hold_days >= K('held_order_days')) else (K('held_order_recent') if (lc_order_status == 'info_hold' and lc_hold_days >= 0 and lc_hold_days < K('held_order_days')) else 0.0)"
      - lc_charged_window: "lc_days_to_visit <= 1"
      - result: "RND(MX(0.0, (lc_day_rate + lc_kit + lc_route + lc_household) * lc_repeat - lc_hold_deduction), 2) if lc_charged_window else 0.0"
    compute_basis:
      lc_days_to_visit: "counting calendar days from today to the current appointment date"
      lc_day_rate: "a change recorded on the appointment date itself starts from 55.00, a change recorded the day before a visit that starts before 09:00 starts from 45.00, and any other late change starts from the published late-cancellation fee of 40.00."
      lc_days_on_books: "it was booked 7 or more calendar days before today"
      lc_repeat: "when the visit has already been moved at least once and it was booked 7 or more calendar days before today, the charge is multiplied by 1.25; when it has already been moved at least once and it was booked fewer than 7 days before today, the charge is multiplied by 1.50; when the visit has never been moved, the charge is taken as it stands."
      lc_order_class: "a visit collecting an order of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class"
      lc_kit: "a visit collecting an order of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class adds 15.00 for the kit already prepared, one collecting an order of the Specialty Clinical Testing, Molecular Infectious Disease Testing or Clinical Toxicology Testing class adds 8.00, and one collecting any other class adds nothing."
      lc_route_days: "a visit in service zone 3 moved on its appointment date adds 15.00, a visit in service zone 3 moved the day before adds 10.00"
      lc_route: "a visit in service zone 3 moved on its appointment date adds 15.00, a visit in service zone 3 moved the day before adds 10.00, a visit in service zone 2 moved on its appointment date adds 5.00, and any other late change (a zone 2 visit moved the day before, or a zone 1 visit) adds nothing."
      lc_household_days: "a change recorded the day before the appointment date is charged per person booked"
      lc_household: "when one or more additional household members are booked on the visit, a change recorded the day before the appointment date is charged per person booked, 5.00 for the patient and 5.00 for each member, while a change recorded on the appointment date itself is charged once per visit, 24.00 whatever the number of people booked, which is never less than the day-before amount for a household of up to three members; a visit with no household member booked carries no household rescheduling amount."
      lc_order_status: "when the order the visit is to collect is on an information hold"
      lc_hold_days: "placed 7 or more calendar days before today"
      lc_hold_deduction: "when the order the visit is to collect is on an information hold placed 7 or more calendar days before today, the visit could not be collected until the hold clears and 15.00 is deducted; when the order is on an information hold placed fewer than 7 days before today, 8.00 is deducted; otherwise nothing is deducted."
      lc_charged_window: "For a home visit the notice of a move is counted in calendar days from the date the move is recorded to the appointment date, not in hours, so a move recorded two or more calendar days before the appointment date is free whatever the clock time."
      result: "first the change-day rate, the prepared collection kit, the route rebuild and the household rescheduling amounts are added together, then that sum is multiplied by the repeat-change factor, then the order on hold deduction is subtracted from that product; the late-change charge never goes below 0.00 and is rounded to the cent only once, at the end."
    factors:
      - id: change_day_rate
        effect: parameter
        decides: lc_day_rate
        bindings: [lc_days_to_visit, lc_day_rate]
        ladder:
          - when: "the change is recorded on the appointment date"
            value: "K('visit_day_change_rate') = 55.00"
          - when: "the change is recorded the day before AND the visit starts before 09:00"
            value: "K('day_before_early_rate') = 45.00"
          - when: "otherwise"
            value: "P('late_cancellation_fee') = 40.00"
        baseline:
          lc_day_rate: "P('late_cancellation_fee')"
        evidence: [date]
        cross_difficulty: null
      - id: repeat_change
        effect: parameter
        decides: lc_repeat
        bindings: [lc_days_on_books, lc_repeat]
        ladder:
          - when: "the visit was already moved at least once AND it was booked 7 or more days before today"
            value: "repeat factor K('repeat_change_settled') = 1.25"
          - when: "the visit was already moved at least once AND it was booked fewer than 7 days before today"
            value: "repeat factor K('repeat_change_rapid') = 1.50"
          - when: "otherwise (never moved)"
            value: "repeat factor 1.00 (as it stands)"
        baseline:
          lc_repeat: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: prepared_collection_kit
        effect: parameter
        decides: lc_kit
        bindings: [lc_order_class, lc_kit]
        ladder:
          - when: "the order is of the Esoteric Reference Testing or Hereditary & Reproductive Genetic Testing class"
            value: "K('change_kit_esoteric') = 15.00"
          - when: "the order is of the Specialty Clinical Testing, Molecular Infectious Disease Testing or Clinical Toxicology Testing class"
            value: "K('change_kit_specialty') = 8.00"
          - when: "otherwise"
            value: "0.00"
        baseline:
          lc_kit: "0.0"
        evidence: [cross_category]
        cross_difficulty: orders
      - id: route_rebuild
        effect: parameter
        decides: lc_route
        bindings: [lc_route_days, lc_route]
        ladder:
          - when: "service zone 3 AND the change is recorded on the appointment date"
            value: "K('route_rebuild_zone_3_same_day') = 15.00"
          - when: "service zone 3 AND the change is recorded the day before the appointment date"
            value: "K('route_rebuild_zone_3') = 10.00"
          - when: "service zone 2 AND the change is recorded on the appointment date"
            value: "K('route_rebuild_zone_2_same_day') = 5.00"
          - when: "otherwise (zone 2 moved the day before, or zone 1)"
            value: "0.00"
        baseline:
          lc_route: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: household_rescheduling
        effect: method
        decides: lc_household
        bindings: [lc_household_days, lc_household]
        ladder:
          - when: "one or more household members booked AND the change is recorded the day before the appointment date"
            method: "charged per person booked: K('household_day_before') = 5.00 times (1 + members booked)"
          - when: "one or more household members booked AND the change is recorded on the appointment date"
            method: "charged once per visit: K('household_visit_day') = 24.00, whatever the number of people booked"
          - when: "otherwise"
            method: "no household rescheduling amount"
        baseline:
          lc_household: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: order_on_hold_deduction
        effect: parameter
        decides: lc_hold_deduction
        bindings: [lc_order_status, lc_hold_days, lc_hold_deduction]
        ladder:
          - when: "the order is on an information hold AND the hold was placed 7 or more days before today"
            value: "K('held_order_long') = 15.00 deducted"
          - when: "the order is on an information hold AND the hold was placed fewer than 7 days before today"
            value: "K('held_order_recent') = 8.00 deducted"
          - when: "otherwise"
            value: "0.00"
        baseline:
          lc_hold_deduction: "0.0"
        evidence: [cross_category, date]
        cross_difficulty: orders
    baseline:
      rule: >-
        Standard method: the late-change charge is the published late-cancellation fee of 40.00, posted once as an assessed late-cancellation fee on the visit being moved and rounded to the cent; a move recorded two or more calendar days before the appointment date carries no charge.
      params: [late_cancellation_fee]
    inputs:
      history: []
      cross_category: [orders]
