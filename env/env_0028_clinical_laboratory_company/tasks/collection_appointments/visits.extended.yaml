        Timed Glucose Tolerance Collection: {fee_payment_methods: "=fee_payment_methods", fee_refund_processing_business_days: "=fee_refund_processing_business_days"}
        Pediatric Collection Appointment: {fee_payment_methods: "=fee_payment_methods", fee_refund_processing_business_days: "=fee_refund_processing_business_days"}
