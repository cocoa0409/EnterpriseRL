category: visits
display_name: Specimen Collection Appointments

# One holding = one collection visit for one patient: a Patient Service Center (PSC) visit, a
# timed or pediatric collection, a mobile phlebotomist visit to the patient's home, or a bedside
# draw at a care facility. The visit collects the specimen for one order (initial collection,
# recollection after a rejection, or one draw of a standing order).
binding:
  holding_table: visits
  event_tables: [visit_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {fee_balance: collection_fee_balance}

lifecycle:
  states: [booked, checked_in, collected, incomplete, cancelled, no_show]
  transitions:
    - {from: booked, to: checked_in, by: system, means: The patient arrives (or the phlebotomist arrives at the home or facility) and is checked in.}
    - {from: checked_in, to: collected, by: system, means: The phlebotomist completes the collection and the specimen leaves for the laboratory.}
    - {from: checked_in, to: incomplete, by: system, means: The collection could not be completed (unsuccessful draw, patient not fasting, patient left, or no valid order).}
    - {from: booked, to: cancelled, by: agent, means: The visit is cancelled before check-in at the patient's request or by the laboratory.}
    - {from: booked, to: no_show, by: system, means: The patient was not present by the end of the arrival grace period.}

accounts:
  - key: collection_fee_balance
    unit: USD
    meaning: Collection-service fees the patient owes on the visit (trip, additional-patient, weekend, late-cancellation and no-show fees); assessments post in, payments and waivers post out, refunds of paid amounts post back in, and fee_balance on the visit is the running sum.

parameter_schema:
  booking_required: "Boolean; whether the visit type exists only by appointment (false = created at walk-in arrival)."
  online_booking_available: "Boolean; whether the patient can book this visit type through the online scheduler."
  provider_scheduling_allowed: "Boolean; whether the ordering provider's office or the care facility can book on the patient's behalf."
  same_day_booking_allowed: "Boolean; whether a visit may be booked for the booking date itself."
  booking_horizon_days: "Calendar days ahead of the booking date for which a visit may be booked (0 = no advance booking)."
  minimum_booking_lead_days: "Calendar days that must separate the booking date from the appointment date."
  slot_length_minutes: "Length of one bookable slot or arrival window in minutes (0 = no slots)."
  earliest_slot_time: "HH:MM; earliest appointment (or walk-in) start time."
  latest_slot_time: "HH:MM; latest appointment (or walk-in) start time."
  weekend_service_available: "Boolean; whether Saturday and Sunday appointments are offered."
  weekend_surcharge: "USD; surcharge assessed on a completed visit whose appointment date is a Saturday or Sunday (0.00 = none)."
  visit_duration_minutes: "Minutes the patient should plan to spend for the collection."
  patient_must_remain_on_site: "Boolean; whether the patient must stay at the PSC for the whole timed collection."
  arrival_grace_minutes: "Minutes after the appointment start (or arrival-window start) during which arrival still counts as on time."
  late_arrival_handling: "Enum (convert_to_walk_in, rebook_required, no_show, not_applicable); what happens to an arrival after the grace period."
  max_reschedules_per_visit: "Integer; maximum times one visit can be moved to another date or time."
  free_change_notice_hours: "Hours before the appointment start at or beyond which a patient cancellation or reschedule carries no fee (0 = always free)."
  late_cancellation_fee: "USD; fee for a patient cancellation, or a reschedule, made with less than free_change_notice_hours notice (0.00 = none)."
  no_show_fee: "USD; fee assessed when a visit is recorded as no_show (0.00 = none)."
  courtesy_waivers_per_12_months: "Integer; late-cancellation or no-show fees that may be waived as a first-occurrence courtesy within any rolling 365 days."
  fee_waiver_request_window_days: "Calendar days after a fee was assessed within which the patient may ask for a courtesy or weather waiver."
  no_show_restriction_count: "Integer; no-shows within restriction_lookback_days that bar new bookings of this visit type (0 = never restricted)."
  restriction_lookback_days: "Calendar days counted back from the booking date over which no-shows are counted for the booking restriction."
  trip_fee_by_zone: "Mapping service zone -> USD trip fee assessed when the visit is collected; PSC and facility visits map their single zone to 0.00."
  service_zones_offered: "List of service zones the visit type serves (psc_onsite, zone_1 = up to 10 road miles, zone_2 = over 10 to 25, zone_3 = over 25 to 40, facility_onsite)."
  additional_patient_fee: "USD per additional household member collected at the same home visit."
  max_additional_patients: "Integer; maximum additional household members per visit."
  medicare_homebound_trip_fee_waived: "Boolean; whether no trip fee is assessed when the patient is certified Medicare-homebound (collection and travel are billed to Medicare instead)."
  recollection_visit_fees_waived: "Boolean; whether a visit whose purpose is recollection carries no collection-service fee of any kind."
  recollection_priority_days: "Calendar days after the request within which a recollection visit is guaranteed a slot (0 = no priority)."
  fasting_collections_allowed: "Boolean; whether tests needing fasting may be collected on this visit type."
  fasting_latest_start_time: "HH:MM; latest start time for a collection that includes a test needing fasting."
  minimum_patient_age_years: "Whole years; youngest patient age on the appointment date the visit type serves."
  maximum_patient_age_years: "Whole years; oldest patient age on the appointment date the visit type serves."
  guardian_required_under_age_years: "Whole years; patients younger than this must be accompanied by a parent or legal guardian."
  max_orders_per_visit: "Integer; maximum orders collected in one visit."
  max_venipuncture_attempts: "Integer; venipuncture attempts per visit after which the collection is recorded incomplete."
  incomplete_rebook_fees_waived: "Boolean; whether the visit rebooked after an incomplete collection carries no fee and the incomplete visit itself is assessed nothing."
  incomplete_rebook_priority_days: "Calendar days after the incomplete visit within which the rebooked visit is guaranteed a slot (0 = no priority)."
  fee_payment_methods: "List of payment methods accepted for collection-service fees ([] = no patient-paid fees)."
  fee_due_timing: "Enum (at_completion, not_applicable); when collection-service fees are charged to the card on file."
  fee_refund_on_laboratory_cancellation: "Boolean; whether every fee paid on a visit the laboratory cancels is refunded."
  fee_refund_processing_business_days: "Business days within which a fee refund is issued to the original payment method."
  severe_weather_fee_waiver: "Boolean; whether fees arising from a weather closure day declared by the laboratory are waived."
  reminder_lead_hours: "Hours before the appointment start at which the reminder text and email are sent (0 = none)."
  wait_time_target_minutes: "Minutes; published lobby wait target, a service goal and not a guarantee (0 = not applicable)."
  specimen_drop_off_allowed: "Boolean; whether a patient may drop off a self-collected specimen (urine) at the visit location without a draw."
  max_open_appointments_per_order: "Integer; booked (not yet checked-in) visits allowed at one time for the same order."
  standing_series_prebook_max: "Integer; future draws of one standing order that may be booked at the same time (0 = one at a time)."
  waitlist_available: "Boolean; whether the patient can join a waitlist for an earlier slot."

