- id: assistance_ext_renewal_tier
  base_policy_refs:
  - assistance_agg_multi_holding
  - assistance_agg_single_open_case
  - assistance_tier_determination
  - assistance_evt_award_term_and_review_holds
  overwrite:
  - base_policy: assistance_evt_award_term_and_review_holds
    superseded_clause: >-
      Applications are taken through application_channels only; an agent may take a phone_assisted application but
      records only the facts the applicant states and the documents received.
    replaced_by: >-
      A renewal application is submitted by the applicant in person through the patient portal; an agent does not
      take a renewal application by phone.
  - base_policy: assistance_tier_determination
    superseded_clause: >-
      When an applicant qualifies for more than one tier, the tier giving the larger total discount on the covered
      invoices applies; discounts of two tiers are never added together.
    replaced_by: >-
      A renewal application is assessed at the Catastrophic Medical Hardship Adjustment when the household's unrelieved
      laboratory burden is greater than its catastrophic threshold and the documented percent of the poverty guideline
      on the award being renewed is at most the hardship limit percent; otherwise it is assessed at the tier of
      the award being renewed.
  - base_policy: assistance_tier_determination
    superseded_clause: >-
      Catastrophic Medical Hardship Adjustment applies when fpl_percent is at most its fpl_max_pct and the applicant's
      laboratory patient responsibility for the hardship window (assistance_msr_hardship_responsibility) exceeds
      hardship_liability_cap_pct_of_income percent of annual household income.
    replaced_by: >-
      The unrelieved laboratory burden is the patient responsibility posted on the household's invoices within the
      burden window, less every courtesy adjustment, billing-error correction, estimate-dispute settlement and small-balance
      write-off posted within the burden window, less the financial-assistance discounts the award being renewed
      granted within the burden window.
  trigger: on_request
  subject:
  - assistance_application_submitted
  computes: variant_name
  target_tool: submit_renewal_application_d691b1b8
  params:
    standard_share: 10
    insured_upper_share: 12.5
    uninsured_lower_share: 7.5
    upper_band_pct: 300
    lower_band_pct: 200
    standard_burden_months: 12
    short_award_months: 6
    plan_missed_months: 6
    hardship_limit_pct: 600
  rule: >-
    A renewal application is submitted by the applicant in person through the patient portal; an agent does not
    take a renewal application by phone. A renewal application is assessed at the Catastrophic Medical Hardship
    Adjustment when the household's unrelieved laboratory burden is greater than its catastrophic threshold and
    the documented percent of the poverty guideline on the award being renewed is at most the hardship limit percent;
    otherwise it is assessed at the tier of the award being renewed. The tier a renewal application is assessed
    at is set only after every invoice the award being renewed covers whose payer decision is final carries that
    award's discount line. The unrelieved laboratory burden is the patient responsibility posted on the household's
    invoices within the burden window, less every courtesy adjustment, billing-error correction, estimate-dispute
    settlement and small-balance write-off posted within the burden window, less the financial-assistance discounts
    the award being renewed granted within the burden window. The burden window holds every entry dated fewer than
    the standard burden months before today, counted in whole calendar months from the entry's date to today. The
    catastrophic threshold is the standard share, as a percent, of the documented annual household income on the
    award being renewed, rounded to the cent. The catastrophic share used for the threshold depends on the household's
    documented percent and coverage: a household documented above the upper band percent with an active coverage
    on file uses the insured upper share; a household documented at or below the lower band percent with no active
    coverage on file uses the uninsured lower share; any other household uses the standard share. The burden window's
    length in whole months depends on the household's coverage and the award being renewed: a household whose ended
    coverage ended on or after that award's application date counts the whole months from the day that coverage
    ended to today, plus one; a household with no coverage ended on or after that date, whose award runs no more
    than the short award months from its application date to its end date counted in whole months and whose latest
    patient responsibility was posted on or after that award's application date, counts that award's whole months;
    any other household counts the standard burden months. An amount still in question is taken out of the burden:
    a household with an invoice on hold for insurance reprocessing takes out that invoice's patient responsibility
    posted within the burden window; a household with an invoice on hold for a billing dispute and none on hold
    for insurance reprocessing takes out that invoice's balance due; any other household takes out nothing. Balances
    carried on a payment plan: a household whose payment plan is active with no installment recorded missed within
    the last plan-missed months takes every installment it has paid on the plan out of the burden; a household whose
    payment plan is defaulted adds to the burden every returned-payment fee posted on its invoices; any other household's
    burden is neither reduced nor increased for a plan.
  prerequisite:
  - problem: assistance_ext_award_discount
    kind: value_input
    gate: window_relief
    form: state
    policy_source: >-
      The tier a renewal application is assessed at is set only after every invoice the award being renewed covers
      whose payer decision is final carries that award's discount line.
    condition: >-
      Every invoice of the household whose date of service lies in the approved award's window, whose claim carries
      no undecided appeal and whose final patient responsibility is posted has a discount line under that award.
    resolved_by: apply_award_discount_6c746b08
    effect: >-
      Once the missing discount line is booked under the award, the financial-assistance discounts granted within
      the burden window rise by that discount and the unrelieved laboratory burden falls by the same amount.
  cross_category:
  - category: coverage
    as: branch
    reads:
    - coverages.status
    - coverages.termination_date
    note: >-
      Coverage status decides the catastrophic share and an ended coverage decides the burden window.
  - category: invoices
    as: history
    reads:
    - invoice_transactions.amount
    - invoice_transactions.event_date
    - invoices.status
    - invoices.hold_reason
    - invoices.balance_due
    note: The invoice ledger gives the burden and the holds decide the amount still in question.
  - category: plans
    as: history
    reads:
    - payment_plans.status
    - plan_transactions.amount
    - plan_transactions.event_type
    note: The plan status and installment ledger decide the plan-carried credit.
  compute:
  - documented_income: F('annual_household_income')
  - documented_pct: F('fpl_percent')
  - active_coverage_on_file: EXISTS('coverage', status='active')
  - catastrophic_share: >-
      K('insured_upper_share') if (documented_pct > K('upper_band_pct') and active_coverage_on_file) else (K('uninsured_lower_share')
      if (documented_pct <= K('lower_band_pct') and not active_coverage_on_file) else K('standard_share'))
  - award_months: MONTHS(F('application_date'), F('award_end_date'))
  - ended_on: CFIELD('coverage','termination_date', status='terminated')
  - latest_billing: >-
      XLATEST('invoices','invoice_transactions','event_date', event_type='invoices_responsibility_posted')
  - burden_months: >-
      (MONTHS(ended_on, NOW) + 1) if (ended_on or '') >= F('application_date') else (award_months if (award_months
      <= K('short_award_months') and latest_billing >= F('application_date')) else K('standard_burden_months'))
  - posted_responsibility: >-
      XSUM('invoices','invoice_transactions','amount', within_months=burden_months, event_type='invoices_responsibility_posted')
  - window_adjustments: >-
      XSUM('invoices','invoice_transactions','amount', within_months=burden_months, event_type='invoices_adjustment_posted',
      adjustment_type='courtesy_adjustment') + XSUM('invoices','invoice_transactions','amount', within_months=burden_months,
      event_type='invoices_adjustment_posted', adjustment_type='billing_error_correction') + XSUM('invoices','invoice_transactions','amount',
      within_months=burden_months, event_type='invoices_adjustment_posted', adjustment_type='estimate_dispute_resolution')
      + XSUM('invoices','invoice_transactions','amount', within_months=burden_months, event_type='invoices_adjustment_posted',
      adjustment_type='small_balance_writeoff')
  - window_relief: >-
      SUM('assistance_events','discount_amount', within_months=burden_months, event_type='assistance_discount_applied')
  - reprocessing_invoice: CFIELD('invoices','invoice_id', status='on_hold', hold_reason='insurance_reprocessing')
  - dispute_invoice: CFIELD('invoices','invoice_id', status='on_hold', hold_reason='billing_dispute')
  - amount_in_question: >-
      XSUM('invoices','invoice_transactions','amount', within_months=burden_months, invoice_id=reprocessing_invoice,
      event_type='invoices_responsibility_posted') if reprocessing_invoice else (CFIELD('invoices','balance_due',
      invoice_id=dispute_invoice) if dispute_invoice else 0)
  - plan_status: CFIELD('plans','status')
  - missed_recently: >-
      XCOUNT('plans','plan_transactions', within_months=K('plan_missed_months'), event_type='plans_installment_missed')
  - installments_paid: XSUM('plans','plan_transactions','amount', event_type='plans_installment_paid')
  - returned_fees: >-
      XSUM('invoices','invoice_transactions','amount', event_type='invoices_returned_payment_fee')
  - plan_adjustment: >-
      installments_paid if (plan_status == 'active' and missed_recently == 0) else ((0 - returned_fees) if plan_status
      == 'defaulted' else 0)
  - burden: >-
      RND(posted_responsibility - window_adjustments - window_relief - amount_in_question - plan_adjustment, 2)
  - threshold: RND(documented_income * catastrophic_share / 100, 2)
  - result: >-
      'Catastrophic Medical Hardship Adjustment' if (burden > threshold and documented_pct <= K('hardship_limit_pct'))
      else F('variant_name')
  compute_basis:
    documented_income: >-
      The catastrophic threshold is the standard share, as a percent, of the documented annual household income
      on the award being renewed, rounded to the cent.
    documented_pct: >-
      the documented percent of the poverty guideline on the award being renewed is at most the hardship limit percent
    active_coverage_on_file: >-
      a household documented above the upper band percent with an active coverage on file uses the insured upper
      share
    catastrophic_share: >-
      a household documented above the upper band percent with an active coverage on file uses the insured upper
      share; a household documented at or below the lower band percent with no active coverage on file uses the
      uninsured lower share; any other household uses the standard share.
    award_months: >-
      whose award runs no more than the short award months from its application date to its end date counted in
      whole months
    ended_on: >-
      a household whose ended coverage ended on or after that award's application date counts the whole months from
      the day that coverage ended to today, plus one
    latest_billing: whose latest patient responsibility was posted on or after that award's application date
    burden_months: >-
      The burden window's length in whole months depends on the household's coverage and the award being renewed:
      a household whose ended coverage ended on or after that award's application date counts the whole months from
      the day that coverage ended to today, plus one; a household with no coverage ended on or after that date,
      whose award runs no more than the short award months from its application date to its end date counted in
      whole months and whose latest patient responsibility was posted on or after that award's application date,
      counts that award's whole months; any other household counts the standard burden months.
    posted_responsibility: >-
      The burden window holds every entry dated fewer than the standard burden months before today, counted in whole
      calendar months from the entry's date to today.
    window_adjustments: >-
      less every courtesy adjustment, billing-error correction, estimate-dispute settlement and small-balance write-off
      posted within the burden window
    window_relief: >-
      less the financial-assistance discounts the award being renewed granted within the burden window
    reprocessing_invoice: >-
      a household with an invoice on hold for insurance reprocessing takes out that invoice's patient responsibility
      posted within the burden window
    dispute_invoice: >-
      a household with an invoice on hold for a billing dispute and none on hold for insurance reprocessing takes
      out that invoice's balance due
    amount_in_question: >-
      An amount still in question is taken out of the burden: a household with an invoice on hold for insurance
      reprocessing takes out that invoice's patient responsibility posted within the burden window; a household
      with an invoice on hold for a billing dispute and none on hold for insurance reprocessing takes out that invoice's
      balance due; any other household takes out nothing.
    plan_status: >-
      a household whose payment plan is active with no installment recorded missed within the last plan-missed months
      takes every installment it has paid on the plan out of the burden
    missed_recently: with no installment recorded missed within the last plan-missed months
    installments_paid: takes every installment it has paid on the plan out of the burden
    returned_fees: >-
      a household whose payment plan is defaulted adds to the burden every returned-payment fee posted on its invoices
    plan_adjustment: >-
      Balances carried on a payment plan: a household whose payment plan is active with no installment recorded
      missed within the last plan-missed months takes every installment it has paid on the plan out of the burden;
      a household whose payment plan is defaulted adds to the burden every returned-payment fee posted on its invoices;
      any other household's burden is neither reduced nor increased for a plan.
    burden: >-
      The unrelieved laboratory burden is the patient responsibility posted on the household's invoices within the
      burden window, less every courtesy adjustment, billing-error correction, estimate-dispute settlement and small-balance
      write-off posted within the burden window, less the financial-assistance discounts the award being renewed
      granted within the burden window.
    threshold: >-
      The catastrophic threshold is the standard share, as a percent, of the documented annual household income
      on the award being renewed, rounded to the cent.
    result: >-
      A renewal application is assessed at the Catastrophic Medical Hardship Adjustment when the household's unrelieved
      laboratory burden is greater than its catastrophic threshold and the documented percent of the poverty guideline
      on the award being renewed is at most the hardship limit percent; otherwise it is assessed at the tier of
      the award being renewed.
  factors:
  - id: catastrophic_share
    effect: parameter
    decides: catastrophic_share
    bindings:
    - active_coverage_on_file
    - catastrophic_share
    ladder:
    - when: >-
        the documented percent is above the upper band percent and the household has an active coverage on file
      value: K('insured_upper_share')
    - when: >-
        the documented percent is at or below the lower band percent and the household has no active coverage on
        file
      value: K('uninsured_lower_share')
    - when: otherwise
      value: K('standard_share')
    baseline:
      catastrophic_share: K('standard_share')
    evidence:
    - cross_category
    cross_difficulty: coverage
  - id: burden_window
    effect: method
    decides: burden_months
    bindings:
    - award_months
    - ended_on
    - latest_billing
    - burden_months
    ladder:
    - when: >-
        the household's ended coverage ended on or after the application date of the award being renewed
      method: count the whole months from the day that coverage ended to today, plus one
    - when: >-
        no coverage ended on or after that date, the award runs no more than the short award months from its application
        date to its end date, and the latest patient responsibility was posted on or after that application date
      method: count the award's own whole months
    - when: otherwise
      method: count the standard burden months
    baseline:
      burden_months: K('standard_burden_months')
    evidence:
    - date
    - cross_category
    cross_difficulty: coverage
  - id: amount_in_question
    effect: parameter
    decides: amount_in_question
    bindings:
    - reprocessing_invoice
    - dispute_invoice
    - amount_in_question
    ladder:
    - when: an invoice of the household is on hold for insurance reprocessing
      value: that invoice's patient responsibility posted within the burden window
    - when: an invoice is on hold for a billing dispute and none is on hold for insurance reprocessing
      value: that invoice's balance due
    - when: otherwise
      value: '0'
    baseline:
      amount_in_question: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: null
  - id: plan_carried_balances
    effect: parameter
    decides: plan_adjustment
    bindings:
    - plan_status
    - missed_recently
    - installments_paid
    - returned_fees
    - plan_adjustment
    ladder:
    - when: >-
        the household's payment plan is active and no installment was recorded missed within the last plan-missed
        months
      value: every installment paid on the plan, taken out of the burden
    - when: the household's payment plan is defaulted
      value: every returned-payment fee posted on the household's invoices, added to the burden
    - when: otherwise
      value: '0'
    baseline:
      plan_adjustment: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: plans
  baseline:
    rule: >-
      A renewal application is assessed at the Catastrophic Medical Hardship Adjustment when the household's unrelieved
      laboratory burden is greater than its catastrophic threshold and the documented percent of the poverty guideline
      on the award being renewed is at most the hardship limit percent; otherwise it is assessed at the tier of
      the award being renewed. The unrelieved laboratory burden is the patient responsibility posted on the household's
      invoices within the burden window, less every courtesy adjustment, billing-error correction, estimate-dispute
      settlement and small-balance write-off posted within the burden window, less the financial-assistance discounts
      the award being renewed granted within the burden window. The burden window holds every entry dated fewer
      than the standard burden months before today, counted in whole calendar months from the entry's date to today.
      The catastrophic threshold is the standard share, as a percent, of the documented annual household income
      on the award being renewed, rounded to the cent.
    params:
    - standard_share
    - standard_burden_months
    - hardship_limit_pct
  inputs:
    history:
    - category: invoices
      table: invoice_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: invoices_responsibility_posted
    - category: invoices
      table: invoice_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: invoices_adjustment_posted
    - table: assistance_events
      aggregate: sum
      field: discount_amount
      within_months: 12
      filters:
        event_type: assistance_discount_applied
    - category: plans
      table: plan_transactions
      aggregate: sum
      field: amount
      filters:
        event_type: plans_installment_paid
    - category: plans
      table: plan_transactions
      aggregate: count
      field: plan_transaction_id
      within_months: 6
      filters:
        event_type: plans_installment_missed
    cross_category:
    - coverage
    - invoices
    - plans
- id: assistance_ext_countable_percent
  base_policy_refs:
  - assistance_tier_determination
  overwrite:
  - base_policy: assistance_tier_determination
    superseded_clause: >-
      The percent of the federal poverty guideline is annual household income divided by the guideline for the household
      size (fpl_guideline_base for one person plus fpl_guideline_per_additional_person for each additional member),
      times 100, rounded to one decimal place.
    replaced_by: >-
      The countable percent is the countable income divided by the poverty guideline for the household size, which
      is the guideline base for one person plus the guideline amount per additional person for each additional member,
      times one hundred, rounded to one decimal place.
  - base_policy: assistance_tier_determination
    superseded_clause: >-
      When documents show a different band than the one stated at intake, the case is redetermined to the documented
      tier before the decision.
    replaced_by: >-
      A submitted application that carries no documents-requested date and is not a renewal application (one submitted
      while the household's award is approved) has its percent of the poverty guideline reassessed as the countable
      percent, recorded together with the income tier that percent falls in, whether or not the tier changes; a
      renewal application keeps the tier its renewal assessment gave it.
  trigger: state_due
  subject:
  - assistance_tier_redetermined
  computes: fpl_percent
  target_tool: reassess_assistance_percent_a70c4477
  params:
    guideline_base: 15650.0
    guideline_per_person: 5500.0
    standard_deduction_months: 12
    extended_deduction_months: 18
    insured_rate: 50
    partial_rate: 75
    full_rate: 100
    frequent_test_charges: 6
    plan_standing_months: 6
    lapsed_plan_share: 50
    job_disregard: 1000.0
    benefit_disregard: 500.0
    benefit_recency_days: 60
  rule: >-
    A submitted application that carries no documents-requested date and is not a renewal application (one submitted
    while the household's award is approved) has its percent of the poverty guideline reassessed as the countable
    percent, recorded together with the income tier that percent falls in, whether or not the tier changes; a renewal
    application keeps the tier its renewal assessment gave it. The countable income is the annual household income
    on the case less the laboratory-payments deduction, and never below zero. The laboratory-payments deduction
    is the recognition rate, as a percent, of the payments counted within the deduction window, rounded to the cent.
    The payments counted are every payment posted on the household's invoices within the deduction window less every
    payment returned or charged back within it. The deduction window holds entries dated fewer than the standard
    deduction months before today, counted in whole calendar months from the entry's date to today. The recognition
    rate is the insured rate. The countable percent is the countable income divided by the poverty guideline for
    the household size, which is the guideline base for one person plus the guideline amount per additional person
    for each additional member, times one hundred, rounded to one decimal place. The deduction window's length depends
    on the household's coverage: a household with a coverage that ended fewer than the standard deduction months
    before today counts the whole months from the day that coverage ended to today, plus one; a household with no
    coverage of any kind on file counts the extended deduction months; any other household counts the standard deduction
    months. The recognition rate depends on the household's coverage and its testing: a household with no active
    coverage on file and at least the frequent-testing number of test charges posted on its orders in the last twelve
    whole months uses the full rate; a household with no active coverage on file and fewer such test charges uses
    the partial rate; any other household uses the insured rate. Which payments are counted depends on how the household
    paid: a household that paid with a health savings or flexible spending card within the deduction window counts
    neither those card payments nor credit balances transferred between its invoices; a household that made no such
    card payment but had a credit balance transferred counts everything except the transferred credits; any other
    household counts every payment, less returned ones. Plan installments counted are added to the laboratory-payments
    deduction before it is rounded, by the standing of the household's payment plan: an active plan with no installment
    recorded missed within the last plan-standing months adds every installment paid within the deduction window;
    a plan that is past due or defaulted adds the lapsed-plan share, as a percent, of the installments paid within
    the deduction window, rounded to the cent; a household with any other plan or no plan adds no installments.
    Collection fees counted are added to the laboratory-payments deduction before it is rounded, by the household's
    collection history: a household with a Medicare homebound certification on a collection visit adds every collection-service
    fee it paid within the deduction window; a household that paid a home-visit trip fee within the deduction window
    adds the trip, additional-patient and weekend fees it paid within the window, but not cancellation or no-show
    fees; any other household adds no collection fees. A benefit disregard is taken off the annual household income
    together with the laboratory-payments deduction, by the benefit documents received for the case: a case whose
    most recently received unemployment benefit statement is dated no more than the benefit-recency days before
    the application date takes off the job-loss disregard; a case without such a recent statement but with a Social
    Security benefit letter received takes off the benefit disregard; any other case takes off no disregard.
  prerequisite: []
  cross_category:
  - category: coverage
    as: branch
    reads:
    - coverages.status
    - coverages.termination_date
    note: >-
      Coverage status and the date a coverage ended decide the deduction window and the recognition rate.
  - category: invoices
    as: history
    reads:
    - invoice_transactions.amount
    - invoice_transactions.event_type
    - invoice_transactions.payment_method
    note: The invoice ledger gives the payments counted and how they were paid.
  - category: orders
    as: history
    reads:
    - order_events.event_type
    - order_events.event_date
    note: The test charges posted in the last twelve months decide the recognition rate.
  - category: plans
    as: history
    reads:
    - payment_plans.status
    - plan_transactions.amount
    - plan_transactions.event_type
    note: The plan's standing and installment ledger decide the plan installments counted.
  - category: visits
    as: history
    reads:
    - visits.homebound_status
    - visit_events.fee_type
    - visit_events.fee_amount
    note: Homebound certification and the fees paid decide the collection fees counted.
  compute:
  - stated_income: F('annual_household_income')
  - household: F('household_size')
  - guideline: K('guideline_base') + K('guideline_per_person') * (household - 1)
  - any_coverage: EXISTS('coverage')
  - lost_on: CFIELD('coverage','termination_date', status='terminated')
  - deduction_months: >-
      K('extended_deduction_months') if not any_coverage else ((MONTHS(lost_on, NOW) + 1) if (lost_on and MONTHS(lost_on,
      NOW) < K('standard_deduction_months')) else K('standard_deduction_months'))
  - received_all: >-
      XSUM('invoices','invoice_transactions','amount', within_months=deduction_months, event_type='invoices_payment_received')
  - received_card_accounts: >-
      XSUM('invoices','invoice_transactions','amount', within_months=deduction_months, event_type='invoices_payment_received',
      payment_method='hsa_fsa_card')
  - received_transfers: >-
      XSUM('invoices','invoice_transactions','amount', within_months=deduction_months, event_type='invoices_payment_received',
      payment_method='credit_balance_transfer')
  - returned: >-
      XSUM('invoices','invoice_transactions','amount', within_months=deduction_months, event_type='invoices_payment_reversed')
  - payments_counted: >-
      (received_all - received_card_accounts - received_transfers - returned) if received_card_accounts > 0 else
      ((received_all - received_transfers - returned) if received_transfers > 0 else (received_all - returned))
  - active_coverage: EXISTS('coverage', status='active')
  - test_charges: XCOUNT('orders','order_events', within_months=12, event_type='orders_test_charge_posted')
  - recognition_rate: >-
      K('full_rate') if (not active_coverage and test_charges >= K('frequent_test_charges')) else (K('partial_rate')
      if (not active_coverage and test_charges < K('frequent_test_charges')) else K('insured_rate'))
  - plan_status: CFIELD('plans','status')
  - plan_missed: >-
      XCOUNT('plans','plan_transactions', within_months=K('plan_standing_months'), event_type='plans_installment_missed')
  - plan_paid_window: >-
      XSUM('plans','plan_transactions','amount', within_months=deduction_months, event_type='plans_installment_paid')
  - plan_counted: >-
      plan_paid_window if (plan_status == 'active' and plan_missed == 0) else (RND(plan_paid_window * K('lapsed_plan_share')
      / 100, 2) if (plan_status == 'past_due' or plan_status == 'defaulted') else 0)
  - homebound: EXISTS('visits', homebound_status='medicare_homebound_certified')
  - trip_fees_paid: >-
      XSUM('visits','visit_events','fee_amount', within_months=deduction_months, event_type='visits_fee_paid', fee_type='trip_fee')
  - service_fees_paid: >-
      trip_fees_paid + XSUM('visits','visit_events','fee_amount', within_months=deduction_months, event_type='visits_fee_paid',
      fee_type='additional_patient_fee') + XSUM('visits','visit_events','fee_amount', within_months=deduction_months,
      event_type='visits_fee_paid', fee_type='weekend_surcharge')
  - all_fees_paid: >-
      XSUM('visits','visit_events','fee_amount', within_months=deduction_months, event_type='visits_fee_paid')
  - fees_counted: all_fees_paid if homebound else (service_fees_paid if trip_fees_paid > 0 else 0)
  - unemployment_statements: >-
      COUNT('assistance_events', event_type='assistance_document_received', document_type='unemployment_benefit_statement')
  - unemployment_dated: >-
      LATEST('assistance_events','document_date', event_type='assistance_document_received', document_type='unemployment_benefit_statement')
  - benefit_letters: >-
      COUNT('assistance_events', event_type='assistance_document_received', document_type='social_security_benefit_letter')
  - disregard: >-
      K('job_disregard') if (unemployment_statements > 0 and DAYS(unemployment_dated, F('application_date')) <=
      K('benefit_recency_days')) else (K('benefit_disregard') if benefit_letters > 0 else 0)
  - deduction: RND(payments_counted * recognition_rate / 100 + plan_counted + fees_counted, 2)
  - countable_income: MX(0, stated_income - disregard - deduction)
  - result: RND(countable_income / guideline * 100, 1)
  compute_basis:
    stated_income: >-
      The countable income is the annual household income on the case less the laboratory-payments deduction, and
      never below zero.
    household: >-
      the poverty guideline for the household size, which is the guideline base for one person plus the guideline
      amount per additional person for each additional member
    guideline: >-
      the poverty guideline for the household size, which is the guideline base for one person plus the guideline
      amount per additional person for each additional member
    any_coverage: a household with no coverage of any kind on file counts the extended deduction months
    lost_on: >-
      a household with a coverage that ended fewer than the standard deduction months before today counts the whole
      months from the day that coverage ended to today, plus one
    deduction_months: >-
      The deduction window's length depends on the household's coverage: a household with a coverage that ended
      fewer than the standard deduction months before today counts the whole months from the day that coverage ended
      to today, plus one; a household with no coverage of any kind on file counts the extended deduction months;
      any other household counts the standard deduction months.
    received_all: >-
      The payments counted are every payment posted on the household's invoices within the deduction window less
      every payment returned or charged back within it.
    received_card_accounts: >-
      a household that paid with a health savings or flexible spending card within the deduction window counts neither
      those card payments nor credit balances transferred between its invoices
    received_transfers: >-
      a household that made no such card payment but had a credit balance transferred counts everything except the
      transferred credits
    returned: less every payment returned or charged back within it
    payments_counted: >-
      Which payments are counted depends on how the household paid: a household that paid with a health savings
      or flexible spending card within the deduction window counts neither those card payments nor credit balances
      transferred between its invoices; a household that made no such card payment but had a credit balance transferred
      counts everything except the transferred credits; any other household counts every payment, less returned
      ones.
    active_coverage: >-
      a household with no active coverage on file and at least the frequent-testing number of test charges posted
      on its orders in the last twelve whole months uses the full rate
    test_charges: >-
      at least the frequent-testing number of test charges posted on its orders in the last twelve whole months
    recognition_rate: >-
      The recognition rate depends on the household's coverage and its testing: a household with no active coverage
      on file and at least the frequent-testing number of test charges posted on its orders in the last twelve whole
      months uses the full rate; a household with no active coverage on file and fewer such test charges uses the
      partial rate; any other household uses the insured rate.
    plan_status: by the standing of the household's payment plan
    plan_missed: >-
      an active plan with no installment recorded missed within the last plan-standing months adds every installment
      paid within the deduction window
    plan_paid_window: adds every installment paid within the deduction window
    plan_counted: >-
      Plan installments counted are added to the laboratory-payments deduction before it is rounded, by the standing
      of the household's payment plan: an active plan with no installment recorded missed within the last plan-standing
      months adds every installment paid within the deduction window; a plan that is past due or defaulted adds
      the lapsed-plan share, as a percent, of the installments paid within the deduction window, rounded to the
      cent; a household with any other plan or no plan adds no installments.
    homebound: >-
      a household with a Medicare homebound certification on a collection visit adds every collection-service fee
      it paid within the deduction window
    trip_fees_paid: a household that paid a home-visit trip fee within the deduction window
    service_fees_paid: >-
      adds the trip, additional-patient and weekend fees it paid within the window, but not cancellation or no-show
      fees
    all_fees_paid: adds every collection-service fee it paid within the deduction window
    fees_counted: >-
      Collection fees counted are added to the laboratory-payments deduction before it is rounded, by the household's
      collection history: a household with a Medicare homebound certification on a collection visit adds every collection-service
      fee it paid within the deduction window; a household that paid a home-visit trip fee within the deduction
      window adds the trip, additional-patient and weekend fees it paid within the window, but not cancellation
      or no-show fees; any other household adds no collection fees.
    unemployment_statements: >-
      a case whose most recently received unemployment benefit statement is dated no more than the benefit-recency
      days before the application date takes off the job-loss disregard
    unemployment_dated: >-
      whose most recently received unemployment benefit statement is dated no more than the benefit-recency days
      before the application date
    benefit_letters: >-
      a case without such a recent statement but with a Social Security benefit letter received takes off the benefit
      disregard
    disregard: >-
      A benefit disregard is taken off the annual household income together with the laboratory-payments deduction,
      by the benefit documents received for the case: a case whose most recently received unemployment benefit statement
      is dated no more than the benefit-recency days before the application date takes off the job-loss disregard;
      a case without such a recent statement but with a Social Security benefit letter received takes off the benefit
      disregard; any other case takes off no disregard.
    deduction: >-
      The laboratory-payments deduction is the recognition rate, as a percent, of the payments counted within the
      deduction window, rounded to the cent.
    countable_income: >-
      The countable income is the annual household income on the case less the laboratory-payments deduction, and
      never below zero.
    result: >-
      The countable percent is the countable income divided by the poverty guideline for the household size, which
      is the guideline base for one person plus the guideline amount per additional person for each additional member,
      times one hundred, rounded to one decimal place.
  factors:
  - id: deduction_window
    effect: method
    decides: deduction_months
    bindings:
    - any_coverage
    - lost_on
    - deduction_months
    ladder:
    - when: a coverage of the household ended fewer than the standard deduction months before today
      method: count the whole months from the day that coverage ended to today, plus one
    - when: the household has no coverage of any kind on file
      method: count the extended deduction months
    - when: otherwise
      method: count the standard deduction months
    baseline:
      deduction_months: K('standard_deduction_months')
    evidence:
    - cross_category
    - date
    cross_difficulty: coverage
  - id: recognition_rate
    effect: parameter
    decides: recognition_rate
    bindings:
    - active_coverage
    - test_charges
    - recognition_rate
    ladder:
    - when: >-
        no active coverage on file and at least the frequent-testing number of test charges in the last twelve whole
        months
      value: K('full_rate')
    - when: no active coverage on file and fewer test charges than that
      value: K('partial_rate')
    - when: otherwise
      value: K('insured_rate')
    baseline:
      recognition_rate: K('insured_rate')
    evidence:
    - cross_category
    - history
    cross_difficulty: orders
  - id: payment_kinds
    effect: method
    decides: payments_counted
    bindings:
    - received_card_accounts
    - received_transfers
    - payments_counted
    ladder:
    - when: >-
        the household paid with a health savings or flexible spending card within the deduction window
      method: >-
        count every payment less those card payments, less transferred credits and less returned payments
    - when: no such card payment, but a credit balance was transferred between its invoices
      method: count every payment less transferred credits and less returned payments
    - when: otherwise
      method: count every payment less returned payments
    baseline:
      payments_counted: received_all - returned
    evidence:
    - cross_category
    - history
    cross_difficulty: null
  - id: plan_installments
    effect: parameter
    decides: plan_counted
    bindings:
    - plan_status
    - plan_missed
    - plan_paid_window
    - plan_counted
    ladder:
    - when: >-
        an active payment plan with no installment recorded missed within the last plan-standing months
      value: every installment paid within the deduction window
    - when: a payment plan that is past due or defaulted
      value: the lapsed-plan share of the installments paid within the deduction window
    - when: otherwise
      value: '0'
    baseline:
      plan_counted: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: plans
  - id: collection_fees
    effect: parameter
    decides: fees_counted
    bindings:
    - homebound
    - trip_fees_paid
    - service_fees_paid
    - all_fees_paid
    - fees_counted
    ladder:
    - when: the household has a Medicare homebound certification on a collection visit
      value: every collection-service fee paid within the deduction window
    - when: no homebound certification, and a home-visit trip fee was paid within the deduction window
      value: the trip, additional-patient and weekend fees paid within the window
    - when: otherwise
      value: '0'
    baseline:
      fees_counted: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: visits
  - id: benefit_disregard
    effect: parameter
    decides: disregard
    bindings:
    - unemployment_statements
    - unemployment_dated
    - benefit_letters
    - disregard
    ladder:
    - when: >-
        the most recently received unemployment benefit statement for the case is dated no more than the benefit-recency
        days before the application date
      value: K('job_disregard')
    - when: no such recent statement, and a Social Security benefit letter received for the case
      value: K('benefit_disregard')
    - when: otherwise
      value: '0'
    baseline:
      disregard: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      A submitted application that carries no documents-requested date and is not a renewal application (one submitted
      while the household's award is approved) has its percent of the poverty guideline reassessed as the countable
      percent, recorded together with the income tier that percent falls in, whether or not the tier changes; a
      renewal application keeps the tier its renewal assessment gave it. The countable income is the annual household
      income on the case less the laboratory-payments deduction, and never below zero. The laboratory-payments deduction
      is the recognition rate, as a percent, of the payments counted within the deduction window, rounded to the
      cent. The payments counted are every payment posted on the household's invoices within the deduction window
      less every payment returned or charged back within it. The deduction window holds entries dated fewer than
      the standard deduction months before today, counted in whole calendar months from the entry's date to today.
      The recognition rate is the insured rate. The countable percent is the countable income divided by the poverty
      guideline for the household size, which is the guideline base for one person plus the guideline amount per
      additional person for each additional member, times one hundred, rounded to one decimal place.
    params:
    - guideline_base
    - guideline_per_person
    - standard_deduction_months
    - insured_rate
  inputs:
    history:
    - category: invoices
      table: invoice_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: invoices_payment_received
    - category: orders
      table: order_events
      aggregate: count
      field: order_event_id
      within_months: 12
      filters:
        event_type: orders_test_charge_posted
    - category: plans
      table: plan_transactions
      aggregate: sum
      field: amount
      within_months: 12
      filters:
        event_type: plans_installment_paid
    - category: visits
      table: visit_events
      aggregate: sum
      field: fee_amount
      within_months: 12
      filters:
        event_type: visits_fee_paid
    - table: assistance_events
      aggregate: count
      field: assistance_event_id
      filters:
        event_type: assistance_document_received
    cross_category:
    - coverage
    - invoices
    - orders
    - plans
    - visits
- id: assistance_ext_document_period
  base_policy_refs:
  - assistance_evt_documentation
  overwrite:
  - base_policy: assistance_evt_documentation
    superseded_clause: >-
      An application that needs documents (income_documentation_required or proof_of_enrollment_required) and lacks
      them is set pending_documents with a due date documents_due_days calendar days after the request date.
    replaced_by: >-
      An application that needs documents and lacks them is set to pending documents with a documents due date that
      falls the response days after the request date. A renewal application on which the applicant reports no change
      of household or income relies on the documents already received for the award being renewed and needs no documents
      request.
  - base_policy: assistance_evt_documentation
    superseded_clause: >-
      The document period counts calendar days from the request date as day 0, plus document_extension_days for
      each extension granted, and denial is allowed only from the day after the last day of the period.
    replaced_by: >-
      The document period runs from the request date, counted as day 0, through the documents due date the case
      records, including any extension granted, and a denial for missing documents is allowed only from the day
      after that date.
  trigger: state_due
  subject:
  - assistance_documents_requested
  computes: response_days
  target_tool: request_assistance_documents_a6db5abf
  params:
    medicaid_screen_days: 15
    uninsured_days: 5
    stale_return_days: 10
    no_return_days: 12
    return_currency_months: 12
    most_documents: 6
    some_documents: 3
    most_documents_credit: 3
    some_documents_credit: 1
    large_household: 5
    earner_household: 3
    large_household_days: 10
    two_earner_days: 7
  rule: >-
    An application that needs documents and lacks them is set to pending documents with a documents due date that
    falls the response days after the request date. A renewal application on which the applicant reports no change
    of household or income relies on the documents already received for the award being renewed and needs no documents
    request. The response days are the tier's documents due days, counted in calendar days from the request date
    as day 0. The document period runs from the request date, counted as day 0, through the documents due date the
    case records, including any extension granted, and a denial for missing documents is allowed only from the day
    after that date. The response period of a documents request is fixed only after the case's percent of the poverty
    guideline has been reassessed on the household's countable income. An agency allowance is added to the response
    days for documents only a public agency issues: a household with no active coverage on file whose recorded percent
    is at or below its tier's Medicaid screening line adds the Medicaid screening days, since it must show a Medicaid
    application or denial; a household with no active coverage on file whose tier has no screening line or whose
    recorded percent is above it adds the uninsured days; any other household adds none. A tax-return allowance
    is added by the tax returns received for the case: a case with no federal tax return received adds the no-return
    days; a case whose most recently received tax return is for a tax year that ended more than the return-currency
    months before the application date, counted in whole calendar months, adds the stale-return days; any other
    case adds none. A household-earner allowance is added by the household's size and the income documents received:
    a household of at least the large-household size with both pay stubs and a benefit statement or letter received
    adds the large-household days; a household of at least the earner-household size but below the large-household
    size with both pay stubs and a benefit statement or letter received adds the two-earner days; any other household
    adds none. A file credit is taken off the response days by the documents already received for the case: a case
    with at least the most-documents number received takes off the most-documents credit; a case with at least the
    some-documents number but fewer than the most-documents number received takes off the some-documents credit;
    any other case takes off nothing. How the response days counted so far are counted depends on how the applicant
    deals with the laboratory: for an application received by mail they are counted as business days from the request
    date; for an application taken by phone from an applicant who has made no portal payment in the last twelve
    whole months and has made a mail or phone payment in that time, the request goes out by mail and they are counted
    as calendar days from the next business day after the request date (the following Monday for a request issued
    on a Friday or a Saturday, the next day otherwise); for any other application they are counted as calendar days
    from the request date. When the response days are counted as business days, each full five of them span seven
    calendar days, any remainder spans as many calendar days, and two more calendar days are added when the remainder
    runs past a Friday. A weekend move is added last: when the request date plus all the response days counted so
    far falls on a Saturday the response days grow by two, when it falls on a Sunday by one, and otherwise by none.
  prerequisite:
  - problem: assistance_ext_countable_percent
    kind: value_input
    gate: agency_days
    form: action
    policy_source: >-
      The response period of a documents request is fixed only after the case's percent of the poverty guideline
      has been reassessed on the household's countable income.
    fallback_reason: >-
      The reassessment rewrites the same percent and tier fields the intake wrote on the case; nothing in the records
      marks whether the recorded percent already carries the laboratory-payments deduction, so no record-visible
      state can stand for the reassessment and the sentence names the action itself.
    condition: >-
      The case's recorded percent of the poverty guideline equals the countable percent worked out from the household's
      countable income at the time the request is issued.
    resolved_by: reassess_assistance_percent_a70c4477
    effect: >-
      Once the percent is reassessed, the recorded percent the agency allowance reads may fall at or below the tier's
      Medicaid screening line, moving the agency allowance from the uninsured days to the Medicaid screening days.
  cross_category:
  - category: coverage
    as: branch
    reads:
    - coverages.status
    note: Whether any coverage is active decides the agency allowance.
  - category: invoices
    as: history
    reads:
    - invoice_transactions.payment_channel
    - invoice_transactions.event_type
    note: >-
      The household's payment channels decide whether the request is mailed and so where the count starts.
  compute:
  - recorded_pct: F('fpl_percent')
  - screening_line: P('medicaid_screening_fpl_threshold_pct')
  - insured_now: EXISTS('coverage', status='active')
  - agency_days: >-
      K('medicaid_screen_days') if (not insured_now and screening_line > 0 and recorded_pct <= screening_line) else
      (K('uninsured_days') if (not insured_now and (screening_line == 0 or recorded_pct > screening_line)) else
      0)
  - return_count: >-
      COUNT('assistance_events', event_type='assistance_document_received', document_type='federal_tax_return')
  - latest_return: >-
      LATEST('assistance_events','document_date', event_type='assistance_document_received', document_type='federal_tax_return')
  - tax_days: >-
      K('no_return_days') if return_count == 0 else (K('stale_return_days') if MONTHS(latest_return, F('application_date'))
      > K('return_currency_months') else 0)
  - stub_count: >-
      COUNT('assistance_events', event_type='assistance_document_received', document_type='pay_stubs')
  - benefit_count: >-
      COUNT('assistance_events', event_type='assistance_document_received', document_type='unemployment_benefit_statement')
      + COUNT('assistance_events', event_type='assistance_document_received', document_type='social_security_benefit_letter')
  - earner_days: >-
      K('large_household_days') if (F('household_size') >= K('large_household') and stub_count > 0 and benefit_count
      > 0) else (K('two_earner_days') if (F('household_size') >= K('earner_household') and stub_count > 0 and benefit_count
      > 0) else 0)
  - documents_in: COUNT('assistance_events', event_type='assistance_document_received')
  - file_credit: >-
      K('most_documents_credit') if documents_in >= K('most_documents') else (K('some_documents_credit') if documents_in
      >= K('some_documents') else 0)
  - portal_payments: >-
      XCOUNT('invoices','invoice_transactions', within_months=12, event_type='invoices_payment_received', payment_channel='online_portal')
  - mail_phone_payments: >-
      XCOUNT('invoices','invoice_transactions', within_months=12, event_type='invoices_payment_received', payment_channel='mail')
      + XCOUNT('invoices','invoice_transactions', within_months=12, event_type='invoices_payment_received', payment_channel='phone_ivr')
      + XCOUNT('invoices','invoice_transactions', within_months=12, event_type='invoices_payment_received', payment_channel='phone_agent')
  - request_weekday: DAYS('2024-01-01', NOW) % 7
  - allowance_days: P('documents_due_days') + agency_days + tax_days + earner_days - file_credit
  - counted_days: >-
      (allowance_days // 5 * 7 + allowance_days % 5 + (2 if (allowance_days % 5 > 0 and request_weekday + allowance_days
      % 5 > 4) else 0)) if F('application_channel') == 'mail' else ((allowance_days + (3 if request_weekday == 4
      else (2 if request_weekday == 5 else 1))) if (F('application_channel') == 'phone_assisted' and portal_payments
      == 0 and mail_phone_payments > 0) else allowance_days)
  - due_weekday: (DAYS('2024-01-01', NOW) + counted_days) % 7
  - weekend_days: 2 if due_weekday == 5 else (1 if due_weekday == 6 else 0)
  - result: counted_days + weekend_days
  compute_basis:
    recorded_pct: >-
      a household with no active coverage on file whose recorded percent is at or below its tier's Medicaid screening
      line adds the Medicaid screening days
    screening_line: whose recorded percent is at or below its tier's Medicaid screening line
    insured_now: >-
      a household with no active coverage on file whose recorded percent is at or below its tier's Medicaid screening
      line adds the Medicaid screening days
    agency_days: >-
      An agency allowance is added to the response days for documents only a public agency issues: a household with
      no active coverage on file whose recorded percent is at or below its tier's Medicaid screening line adds the
      Medicaid screening days, since it must show a Medicaid application or denial; a household with no active coverage
      on file whose tier has no screening line or whose recorded percent is above it adds the uninsured days; any
      other household adds none.
    return_count: a case with no federal tax return received adds the no-return days
    latest_return: >-
      a case whose most recently received tax return is for a tax year that ended more than the return-currency
      months before the application date, counted in whole calendar months, adds the stale-return days
    tax_days: >-
      A tax-return allowance is added by the tax returns received for the case: a case with no federal tax return
      received adds the no-return days; a case whose most recently received tax return is for a tax year that ended
      more than the return-currency months before the application date, counted in whole calendar months, adds the
      stale-return days; any other case adds none.
    stub_count: with both pay stubs and a benefit statement or letter received
    benefit_count: with both pay stubs and a benefit statement or letter received
    earner_days: >-
      A household-earner allowance is added by the household's size and the income documents received: a household
      of at least the large-household size with both pay stubs and a benefit statement or letter received adds the
      large-household days; a household of at least the earner-household size but below the large-household size
      with both pay stubs and a benefit statement or letter received adds the two-earner days; any other household
      adds none.
    documents_in: >-
      A file credit is taken off the response days by the documents already received for the case
    file_credit: >-
      a case with at least the most-documents number received takes off the most-documents credit; a case with at
      least the some-documents number but fewer than the most-documents number received takes off the some-documents
      credit; any other case takes off nothing
    portal_payments: from an applicant who has made no portal payment in the last twelve whole months
    mail_phone_payments: and has made a mail or phone payment in that time
    request_weekday: >-
      the following Monday for a request issued on a Friday or a Saturday, the next day otherwise
    counted_days: >-
      How the response days counted so far are counted depends on how the applicant deals with the laboratory: for
      an application received by mail they are counted as business days from the request date; for an application
      taken by phone from an applicant who has made no portal payment in the last twelve whole months and has made
      a mail or phone payment in that time, the request goes out by mail and they are counted as calendar days from
      the next business day after the request date (the following Monday for a request issued on a Friday or a Saturday,
      the next day otherwise); for any other application they are counted as calendar days from the request date.
      When the response days are counted as business days, each full five of them span seven calendar days, any
      remainder spans as many calendar days, and two more calendar days are added when the remainder runs past a
      Friday.
    due_weekday: >-
      when the request date plus all the response days counted so far falls on a Saturday the response days grow
      by two, when it falls on a Sunday by one
    weekend_days: >-
      A weekend move is added last: when the request date plus all the response days counted so far falls on a Saturday
      the response days grow by two, when it falls on a Sunday by one, and otherwise by none.
    result: >-
      An application that needs documents and lacks them is set to pending documents with a documents due date that
      falls the response days after the request date.
    allowance_days: >-
      The response days are the tier's documents due days, counted in calendar days from the request date as day
      0.
  factors:
  - id: agency_allowance
    effect: parameter
    decides: agency_days
    bindings:
    - insured_now
    - agency_days
    ladder:
    - when: >-
        no active coverage on file and the recorded percent at or below the tier's Medicaid screening line
      value: K('medicaid_screen_days')
    - when: >-
        no active coverage on file and the tier has no screening line or the recorded percent is above it
      value: K('uninsured_days')
    - when: otherwise
      value: '0'
    baseline:
      agency_days: '0'
    evidence:
    - cross_category
    cross_difficulty: coverage
  - id: tax_return_allowance
    effect: parameter
    decides: tax_days
    bindings:
    - return_count
    - latest_return
    - tax_days
    ladder:
    - when: no federal tax return received for the case
      value: K('no_return_days')
    - when: >-
        the most recently received tax return is for a tax year that ended more than the return-currency months
        before the application date
      value: K('stale_return_days')
    - when: otherwise
      value: '0'
    baseline:
      tax_days: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: household_earner_allowance
    effect: parameter
    decides: earner_days
    bindings:
    - stub_count
    - benefit_count
    - earner_days
    ladder:
    - when: >-
        a household of at least the large-household size with both pay stubs and a benefit statement or letter received
      value: K('large_household_days')
    - when: >-
        a household of at least the earner-household size but below the large-household size with both pay stubs
        and a benefit statement or letter received
      value: K('two_earner_days')
    - when: otherwise
      value: '0'
    baseline:
      earner_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: file_credit
    effect: parameter
    decides: file_credit
    bindings:
    - documents_in
    - file_credit
    ladder:
    - when: at least the most-documents number of documents received for the case
      value: K('most_documents_credit')
    - when: at least the some-documents number but fewer than the most-documents number received
      value: K('some_documents_credit')
    - when: otherwise
      value: '0'
    baseline:
      file_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: response_count_convention
    effect: method
    decides: counted_days
    bindings:
    - portal_payments
    - mail_phone_payments
    - request_weekday
    - counted_days
    ladder:
    - when: the application was received by mail
      method: count the response days counted so far as business days from the request date
    - when: >-
        the application was taken by phone and the applicant made no portal payment but a mail or phone payment
        in the last twelve whole months
      method: >-
        count them as calendar days from the next business day after the request date (the following Monday when
        issued on a Friday or a Saturday)
    - when: otherwise
      method: count them as calendar days from the request date
    baseline:
      counted_days: allowance_days
    evidence:
    - cross_category
    - date
    cross_difficulty: null
  - id: weekend_move
    effect: parameter
    decides: weekend_days
    bindings:
    - due_weekday
    - weekend_days
    ladder:
    - when: the request date plus the response days counted so far falls on a Saturday
      value: '2'
    - when: it falls on a Sunday
      value: '1'
    - when: otherwise
      value: '0'
    baseline:
      weekend_days: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      An application that needs documents and lacks them is set to pending documents with a documents due date that
      falls the response days after the request date. The response days are the tier's documents due days, counted
      in calendar days from the request date as day 0. The document period runs from the request date, counted as
      day 0, through the documents due date the case records, including any extension granted, and a denial for
      missing documents is allowed only from the day after that date.
    params:
    - documents_due_days
  inputs:
    history:
    - table: assistance_events
      aggregate: count
      field: assistance_event_id
      filters:
        event_type: assistance_document_received
    - table: assistance_events
      aggregate: latest
      field: document_date
      filters:
        event_type: assistance_document_received
        document_type: federal_tax_return
    - category: invoices
      table: invoice_transactions
      aggregate: count
      field: invoice_transaction_id
      within_months: 12
      filters:
        event_type: invoices_payment_received
    cross_category:
    - coverage
    - invoices
- id: assistance_ext_document_extension
  base_policy_refs:
  - assistance_evt_documentation
  overwrite:
  - base_policy: assistance_evt_documentation
    superseded_clause: >-
      At the applicant's request the due date may be extended by document_extension_days, at most max_document_extensions
      times per case.
    replaced_by: >-
      At the applicant's own request the documents due date may be extended, no more often than the maximum number
      of extensions per case allows, and the extended due date is the current documents due date plus the extension
      days.
  trigger: on_request
  subject:
  - assistance_documents_extended
  computes: extension_days
  target_tool: request_document_extension_ca0bff0a
  params:
    recent_visit_days: 60
    facility_stay_days: 7
    home_visit_days: 4
    early_left_days: 40
    mid_left_days: 20
    early_credit: 5
    mid_credit: 2
    disability_days: 3
    no_income_member_days: 2
    recent_loss_days: 120
    recent_loss_extra: 3
    older_loss_days: 365
    older_loss_extra: 1
    medicaid_pending_days: 5
    other_pending_days: 2
    mail_allowance_days: 3
  rule: >-
    At the applicant's own request the documents due date may be extended, no more often than the maximum number
    of extensions per case allows, and the extended due date is the current documents due date plus the extension
    days. The extension days are the tier's document extension days, counted in calendar days from the current documents
    due date. The extended due date is not fixed until the case carries a documents-requested date and a documents
    due date. Before they are counted, the extension's days are adjusted: a stay allowance, a household-letter allowance,
    a coverage-loss allowance and a pending-coverage allowance are added to the tier's document extension days,
    and a time-left credit is taken off. Stay allowance: a household with a facility bedside collection completed
    no more than the recent-visit days before today adds the facility-stay days; a household with no such bedside
    collection but a mobile in-home collection completed no more than the recent-visit days before today adds the
    home-visit days; any other household adds none. Time-left credit, counted in calendar days from today to the
    current documents due date: more than the early-left days takes off the early credit; more than the mid-left
    days but not more than the early-left days takes off the mid credit; any shorter time takes off nothing. Household-letter
    allowance: a case with a Social Security benefit letter received adds the disability days; a case with no such
    letter but a zero-income attestation received adds the no-income-member days; any other case adds none. Coverage-loss
    allowance, counted in calendar days from the day the household's ended coverage ended to today: no more than
    the recent-loss days adds the recent-loss extra; more than the recent-loss days but no more than the older-loss
    days adds the older-loss extra; a longer time or no ended coverage adds none. Pending-coverage allowance: a
    household with a Medicaid Managed Care Plan coverage pending verification adds the Medicaid-pending days; a
    household with no such coverage but another coverage pending verification adds the other-pending days; any other
    household adds none. The counting convention depends on how the applicant deals with the laboratory: an application
    received by mail counts the adjusted days as business days from the current documents due date and then adds
    the mail allowance days; an application taken by phone for an applicant who has made no portal payment in the
    last twelve whole months and has made a mail or phone payment in that time counts the adjusted days as business
    days from the current documents due date; any other application counts the adjusted days as calendar days. Counting
    business days, every full five business days covers seven calendar days, the remaining business days cover as
    many calendar days, and two more calendar days are added when those remaining days run past a Friday.
  prerequisite:
  - problem: assistance_ext_document_period
    kind: value_input
    gate: days_left
    form: state
    policy_source: >-
      The extended due date is not fixed until the case carries a documents-requested date and a documents due date.
    condition: The case records a documents-requested date and a documents due date.
    resolved_by: request_assistance_documents_a6db5abf
    effect: >-
      Once the documents request is issued the case carries its documents due date, from which the time-left credit
      is counted and the extension's days are counted forward.
  cross_category:
  - category: visits
    as: history
    reads:
    - visits.variant_name
    - visits.status
    - visits.collected_date
    note: A recent facility bedside or mobile in-home collection decides the stay allowance.
  - category: coverage
    as: branch
    reads:
    - coverages.status
    - coverages.variant_name
    - coverages.termination_date
    note: >-
      The ended coverage decides the coverage-loss allowance and a pending coverage the pending-coverage allowance.
  - category: invoices
    as: history
    reads:
    - invoice_transactions.payment_channel
    - invoice_transactions.event_type
    note: The payment channels decide the counting convention for a phone application.
  compute:
  - due: F('documents_due_date')
  - days_left: DAYS(NOW, due)
  - time_left_credit: >-
      K('early_credit') if days_left > K('early_left_days') else (K('mid_credit') if days_left > K('mid_left_days')
      else 0)
  - bedside_on: >-
      CFIELD('visits','collected_date', variant_name='Facility Bedside Collection Visit', status='collected')
  - home_on: >-
      CFIELD('visits','collected_date', variant_name='Mobile In-Home Collection Visit', status='collected')
  - stay_days: >-
      K('facility_stay_days') if (bedside_on and DAYS(bedside_on, NOW) <= K('recent_visit_days')) else (K('home_visit_days')
      if (home_on and DAYS(home_on, NOW) <= K('recent_visit_days')) else 0)
  - disability_letters: >-
      COUNT('assistance_events', event_type='assistance_document_received', document_type='social_security_benefit_letter')
  - no_income_attestations: >-
      COUNT('assistance_events', event_type='assistance_document_received', document_type='zero_income_attestation')
  - letter_days: >-
      K('disability_days') if disability_letters > 0 else (K('no_income_member_days') if no_income_attestations
      > 0 else 0)
  - ended_on: CFIELD('coverage','termination_date', status='terminated')
  - loss_days: >-
      K('recent_loss_extra') if (ended_on and DAYS(ended_on, NOW) <= K('recent_loss_days')) else (K('older_loss_extra')
      if (ended_on and DAYS(ended_on, NOW) <= K('older_loss_days')) else 0)
  - medicaid_pending: >-
      EXISTS('coverage', status='pending_verification', variant_name='Medicaid Managed Care Plan')
  - other_pending: EXISTS('coverage', status='pending_verification')
  - pending_days: >-
      K('medicaid_pending_days') if medicaid_pending else (K('other_pending_days') if other_pending else 0)
  - adjusted_days: >-
      P('document_extension_days') + stay_days + letter_days + loss_days + pending_days - time_left_credit
  - portal_payments: >-
      XCOUNT('invoices','invoice_transactions', within_months=12, event_type='invoices_payment_received', payment_channel='online_portal')
  - mail_phone_payments: >-
      XCOUNT('invoices','invoice_transactions', within_months=12, event_type='invoices_payment_received', payment_channel='mail')
      + XCOUNT('invoices','invoice_transactions', within_months=12, event_type='invoices_payment_received', payment_channel='phone_ivr')
      + XCOUNT('invoices','invoice_transactions', within_months=12, event_type='invoices_payment_received', payment_channel='phone_agent')
  - due_weekday: DAYS('2024-01-01', due) % 7
  - business_span: >-
      adjusted_days // 5 * 7 + adjusted_days % 5 + (2 if (adjusted_days % 5 > 0 and due_weekday + adjusted_days
      % 5 > 4) else 0)
  - counted_extension: >-
      (business_span + K('mail_allowance_days')) if F('application_channel') == 'mail' else (business_span if (F('application_channel')
      == 'phone_assisted' and portal_payments == 0 and mail_phone_payments > 0) else adjusted_days)
  - result: counted_extension
  compute_basis:
    due: >-
      The extension days are the tier's document extension days, counted in calendar days from the current documents
      due date.
    days_left: Time-left credit, counted in calendar days from today to the current documents due date
    time_left_credit: >-
      Time-left credit, counted in calendar days from today to the current documents due date: more than the early-left
      days takes off the early credit; more than the mid-left days but not more than the early-left days takes off
      the mid credit; any shorter time takes off nothing.
    bedside_on: >-
      a household with a facility bedside collection completed no more than the recent-visit days before today adds
      the facility-stay days
    home_on: >-
      a household with no such bedside collection but a mobile in-home collection completed no more than the recent-visit
      days before today adds the home-visit days
    stay_days: >-
      Stay allowance: a household with a facility bedside collection completed no more than the recent-visit days
      before today adds the facility-stay days; a household with no such bedside collection but a mobile in-home
      collection completed no more than the recent-visit days before today adds the home-visit days; any other household
      adds none.
    disability_letters: a case with a Social Security benefit letter received adds the disability days
    no_income_attestations: >-
      a case with no such letter but a zero-income attestation received adds the no-income-member days
    letter_days: >-
      Household-letter allowance: a case with a Social Security benefit letter received adds the disability days;
      a case with no such letter but a zero-income attestation received adds the no-income-member days; any other
      case adds none.
    ended_on: >-
      Coverage-loss allowance, counted in calendar days from the day the household's ended coverage ended to today
    loss_days: >-
      no more than the recent-loss days adds the recent-loss extra; more than the recent-loss days but no more than
      the older-loss days adds the older-loss extra; a longer time or no ended coverage adds none
    medicaid_pending: >-
      a household with a Medicaid Managed Care Plan coverage pending verification adds the Medicaid-pending days
    other_pending: >-
      a household with no such coverage but another coverage pending verification adds the other-pending days
    pending_days: >-
      Pending-coverage allowance: a household with a Medicaid Managed Care Plan coverage pending verification adds
      the Medicaid-pending days; a household with no such coverage but another coverage pending verification adds
      the other-pending days; any other household adds none.
    adjusted_days: >-
      Before they are counted, the extension's days are adjusted: a stay allowance, a household-letter allowance,
      a coverage-loss allowance and a pending-coverage allowance are added to the tier's document extension days,
      and a time-left credit is taken off.
    portal_payments: for an applicant who has made no portal payment in the last twelve whole months
    mail_phone_payments: and has made a mail or phone payment in that time
    due_weekday: two more calendar days are added when those remaining days run past a Friday
    business_span: >-
      Counting business days, every full five business days covers seven calendar days, the remaining business days
      cover as many calendar days, and two more calendar days are added when those remaining days run past a Friday.
    counted_extension: >-
      The counting convention depends on how the applicant deals with the laboratory: an application received by
      mail counts the adjusted days as business days from the current documents due date and then adds the mail
      allowance days; an application taken by phone for an applicant who has made no portal payment in the last
      twelve whole months and has made a mail or phone payment in that time counts the adjusted days as business
      days from the current documents due date; any other application counts the adjusted days as calendar days.
    result: the extended due date is the current documents due date plus the extension days
  factors:
  - id: stay_allowance
    effect: parameter
    decides: stay_days
    bindings:
    - bedside_on
    - home_on
    - stay_days
    ladder:
    - when: a facility bedside collection completed no more than the recent-visit days before today
      value: K('facility_stay_days')
    - when: >-
        no such bedside collection, and a mobile in-home collection completed no more than the recent-visit days
        before today
      value: K('home_visit_days')
    - when: otherwise
      value: '0'
    baseline:
      stay_days: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: visits
  - id: time_left_credit
    effect: parameter
    decides: time_left_credit
    bindings:
    - days_left
    - time_left_credit
    ladder:
    - when: more than the early-left days from today to the current documents due date
      value: K('early_credit')
    - when: more than the mid-left days but not more than the early-left days
      value: K('mid_credit')
    - when: otherwise
      value: '0'
    baseline:
      time_left_credit: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: household_letter_allowance
    effect: parameter
    decides: letter_days
    bindings:
    - disability_letters
    - no_income_attestations
    - letter_days
    ladder:
    - when: a Social Security benefit letter received for the case
      value: K('disability_days')
    - when: no such letter, and a zero-income attestation received for the case
      value: K('no_income_member_days')
    - when: otherwise
      value: '0'
    baseline:
      letter_days: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: coverage_loss_allowance
    effect: parameter
    decides: loss_days
    bindings:
    - ended_on
    - loss_days
    ladder:
    - when: the household's ended coverage ended no more than the recent-loss days before today
      value: K('recent_loss_extra')
    - when: it ended more than the recent-loss days but no more than the older-loss days before today
      value: K('older_loss_extra')
    - when: otherwise
      value: '0'
    baseline:
      loss_days: '0'
    evidence:
    - cross_category
    - date
    cross_difficulty: coverage
  - id: pending_coverage_allowance
    effect: parameter
    decides: pending_days
    bindings:
    - medicaid_pending
    - other_pending
    - pending_days
    ladder:
    - when: a Medicaid Managed Care Plan coverage pending verification on file
      value: K('medicaid_pending_days')
    - when: no such coverage, and another coverage pending verification on file
      value: K('other_pending_days')
    - when: otherwise
      value: '0'
    baseline:
      pending_days: '0'
    evidence:
    - cross_category
    cross_difficulty: coverage
  - id: counting_convention
    effect: method
    decides: counted_extension
    bindings:
    - portal_payments
    - mail_phone_payments
    - due_weekday
    - business_span
    - counted_extension
    ladder:
    - when: the application was received by mail
      method: >-
        count the adjusted days as business days from the current due date, then add the mail allowance days
    - when: >-
        the application was taken by phone and the applicant made no portal payment but a mail or phone payment
        in the last twelve whole months
      method: count the adjusted days as business days from the current due date
    - when: otherwise
      method: count the adjusted days as calendar days
    baseline:
      counted_extension: adjusted_days
    evidence:
    - cross_category
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      At the applicant's own request the documents due date may be extended, no more often than the maximum number
      of extensions per case allows, and the extended due date is the current documents due date plus the extension
      days. The extension days are the tier's document extension days, counted in calendar days from the current
      documents due date.
    params:
    - document_extension_days
  inputs:
    history:
    - table: assistance_events
      aggregate: count
      field: assistance_event_id
      filters:
        event_type: assistance_document_received
    - category: invoices
      table: invoice_transactions
      aggregate: count
      field: invoice_transaction_id
      within_months: 12
      filters:
        event_type: invoices_payment_received
    cross_category:
    - visits
    - coverage
    - invoices
