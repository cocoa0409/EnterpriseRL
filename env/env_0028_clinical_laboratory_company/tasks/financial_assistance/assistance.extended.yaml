  factors:
  - id: coverage_points
    effect: parameter
    decides: coverage_points
    bindings:
    - any_active_coverage
    - inv_plan_band
    - coverage_points
    ladder:
    - when: the household has no active coverage on file
      value: K('uninsured_points')
    - when: >-
        the household has an active coverage and the invoice was adjudicated by a plan not sponsored through an
        employer group (an individually bought or government plan)
      value: K('non_employer_plan_points')
    - when: otherwise
      value: '0'
    baseline:
      coverage_points: '0'
    evidence:
    - cross_category
    cross_difficulty: coverage
  - id: responsibility_points
    effect: parameter
    decides: responsibility_points
    bindings:
    - final_resp_type
    - upheld_appeals
    - responsibility_points
    ladder:
    - when: >-
        the order's final patient responsibility arose from a patient-billable denial and a decided appeal upheld
        that denial
      value: K('appeal_upheld_points')
    - when: the order's final patient responsibility is a deductible
      value: K('deductible_points')
    - when: otherwise
      value: '0'
    baseline:
      responsibility_points: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: coverage
  - id: late_finalization_points
    effect: parameter
    decides: late_points
    bindings:
    - service_date
    - posted_date
    - finalization_days
    - late_points
    ladder:
    - when: >-
        more than the long late-finalization days from the date of service to the posting of the patient responsibility
      value: K('long_late_points')
    - when: more than the late-finalization days but not more than the long late-finalization days
      value: K('late_points')
    - when: otherwise
      value: '0'
    baseline:
      late_points: '0'
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: service_class_cap
    effect: parameter
    decides: discount_cap
    bindings:
    - order_class
    - discount_cap
    ladder:
    - when: the order is of the Hereditary & Reproductive Genetic Testing class
      value: K('genetic_price_cap')
    - when: >-
        the order is of the Esoteric Reference Testing or the Molecular Infectious Disease Testing class
      value: K('esoteric_price_cap')
    - when: otherwise
      value: the working amount itself (no cap)
    baseline:
      discount_cap: working_amount
    evidence:
    - cross_category
    cross_difficulty: orders
  - id: working_amount_basis
    effect: method
    decides: working_amount
    bindings:
    - courtesy_adj
    - billing_error_adj
    - working_amount
    ladder:
    - when: the invoice carries a courtesy adjustment
      method: >-
        work on the patient responsibility posted less only billing-error corrections and estimate-dispute settlements;
        courtesy and small-balance adjustments apply after the award discount
    - when: the invoice carries no courtesy adjustment but a billing-error correction
      method: work on the patient responsibility posted less only billing-error corrections
    - when: otherwise
      method: >-
        work on the eligible responsibility (responsibility less every courtesy, billing-error, estimate-settlement
        and small-balance adjustment)
    baseline:
      working_amount: eligible
    evidence:
    - cross_category
    - history
    cross_difficulty: null
  - id: discount_limit_rule
    effect: method
    decides: discount_limit
    bindings:
    - deposits
    - discount_limit
    ladder:
    - when: a payment was posted on the invoice on its date of service (a deposit at collection)
      method: >-
        limit the award discount only to the working amount; the deposit beyond the owed share becomes a credit
    - when: a prompt-pay discount was taken on the invoice and no deposit was posted
      method: >-
        limit the award discount to the balance still due plus the prompt-pay discount, which is withdrawn
    - when: otherwise
      method: limit the award discount to the balance still due
    baseline:
      discount_limit: balance_due
    evidence:
    - history
    - date
    cross_difficulty: null
