events:
  - type: coverage_added
    target: coverages
    mutation: create
    meaning: The patient (or the ordering office on the requisition) puts a health-plan coverage on file.
    grain: one row per coverage record
    fields:
      customer_id: The patient covered.
      variant_name: The payer class of the coverage.
      payer_name: Plan or payer name as printed on the card.
      member_id: Member identifier as printed on the card.
      group_number: Group number as printed on the card.
      subscriber_relationship: The patient's relationship to the subscriber.
      coordination_order: The order in which this coverage pays.
      employer_group_size_band: Size of the employer sponsoring the plan, for employer plans.
      active_employment_coverage: Whether the plan comes from the current employment of the patient or spouse.
      effective_date: Coverage start date from the card or the payer.
      added_date: Date the coverage was put on file.
    triggers: []
  - type: coverage_verified
    target: coverages
    mutation: {transition: {from: pending_verification, to: active}}
    meaning: Electronic eligibility confirms the coverage is active.
    grain: one row per transaction
    fields:
      verified_date: Date of the successful verification.
    triggers: []
  - type: coverage_verification_failed
    target: coverages
    mutation: {transition: {from: pending_verification, to: inactive}}
    meaning: Eligibility could not be confirmed for the details on file.
    grain: one row per transaction
    fields:
      verified_date: Date of the failed verification.
    triggers: []
  - type: coverage_reverification_failed
    target: coverages
    mutation: {transition: {from: active, to: inactive}}
    meaning: A re-verification before billing shows the coverage is no longer active.
    grain: one row per transaction
    fields:
      verified_date: Date of the failed re-verification.
    triggers: []
  - type: coverage_resubmitted_for_verification
    target: coverages
    mutation: {transition: {from: inactive, to: pending_verification}}
    meaning: Corrected member details are put on the coverage and sent for verification again.
    grain: one row per transaction
    fields:
      member_id: Corrected member identifier as printed on the card.
      group_number: Corrected group number as printed on the card.
    triggers: []
  - type: coverage_terminated
    target: coverages
    mutation: {transition: {from: active, to: terminated}}
    meaning: The coverage ends and its termination date is recorded.
    grain: one row per transaction
    fields:
      termination_date: Last day of coverage under the payer class's termination rule.
    triggers: []
  - type: coverage_details_updated
    target: coverages
    mutation: update
    meaning: Coordination details on the coverage change (payment order, employer plan facts) after the patient updates them with the payer.
    grain: one row per transaction
    fields:
      coordination_order: The corrected payment order.
      employer_group_size_band: Corrected employer size band.
      active_employment_coverage: Corrected current-employment flag.
    triggers: []
  - type: coverage_eligibility_checked
    target: claim_events
    meaning: An electronic eligibility inquiry is run against the payer for a date of service.
    grain: one row per inquiry
    distinguish_by: [event_date, order_id]
    fields:
      event_date: Date of the inquiry.
      order_id: The order whose date of service was checked; empty for a check at coverage intake.
      eligibility_result: The payer's response.
    triggers:
      - event: coverage:coverage_verified
        when: {eligibility_result: active_coverage}
        map: {verified_date: event_date}
  - type: coverage_claim_submitted
    target: claim_events
    meaning: The laboratory files the first claim for one order with this coverage.
    grain: one row per claim (order x coverage)
    distinguish_by: [claim_number]
    fields:
      event_date: Date the claim was filed.
      order_id: The order billed.
      claim_number: Laboratory claim number assigned at filing.
      amount: Billed amount; equals the order's list_price_total at filing.
    account: claim_receivable
    direction: in
    triggers: []
  - type: coverage_claim_resubmitted
    target: claim_events
    meaning: A corrected or replacement claim is filed, or the payer reprocesses a claim after an overturned appeal.
    grain: one row per resubmission of a claim
    distinguish_by: [claim_number, source_claim_event_id]
    fields:
      event_date: Date of the resubmission.
      order_id: The order billed.
      claim_number: The claim number of the original claim.
      amount: Amount put back in front of the payer; equals the denied amount being resubmitted.
      resubmission_reason: Why the claim went back to the payer.
      source_claim_event_id: The denial (or the appeal decision) this resubmission answers.
    account: claim_receivable
    direction: in
    triggers: []
  - type: coverage_claim_paid
    target: claim_events
    meaning: The payer's payment on a claim is posted.
    grain: one row per remittance payment on a claim submission
    distinguish_by: [claim_number, source_claim_event_id]
    fields:
      event_date: Remittance date.
      order_id: The order billed.
      claim_number: The claim paid.
      amount: Amount the payer paid.
      source_claim_event_id: The submission or resubmission the payment answers.
    account: claim_receivable
    direction: out
    triggers: []
  - type: coverage_contractual_adjustment
    target: claim_events
    meaning: Billed charges above the payer's allowed amount are written off under the laboratory's contract (or the out-of-network cap).
    grain: one row per remittance on a claim submission
    distinguish_by: [claim_number, source_claim_event_id]
    fields:
      event_date: Remittance date.
      order_id: The order billed.
      claim_number: The claim adjusted.
      amount: Amount written off.
      source_claim_event_id: The submission or resubmission the adjustment answers.
    account: claim_receivable
    direction: out
    triggers: []
  - type: coverage_patient_responsibility_assigned
    target: claim_events
    meaning: The part of the claim the patient owes (cost share per the remittance, a patient-billable denial, or an out-of-network balance) is moved from the payer to the patient.
    grain: one row per responsibility type per remittance on a claim
    distinguish_by: [claim_number, source_claim_event_id, responsibility_type]
    fields:
      event_date: Date the responsibility was assigned.
      order_id: The order billed.
      claim_number: The claim concerned.
      amount: Amount moved to the patient.
      responsibility_type: What kind of patient responsibility it is.
      source_claim_event_id: The remittance or denial line the responsibility comes from.
    account: claim_receivable
    direction: out
    triggers:
      - event: invoices:invoices_responsibility_posted
        map: {amount: amount, claim_event_id: claim_event_id, event_date: event_date}
  - type: coverage_claim_denied
    target: claim_events
    meaning: The payer denies all or part of a claim with a denial code.
    grain: one row per denial code per claim submission
    distinguish_by: [claim_number, source_claim_event_id, denial_code]
    fields:
      event_date: Date of the denial notice (remittance date).
      order_id: The order billed.
      claim_number: The claim denied.
      amount: Amount denied.
      denial_code: Claim adjustment reason code with its group.
      source_claim_event_id: The submission or resubmission denied.
    account: claim_receivable
    direction: out
    triggers: []
  - type: coverage_appeal_filed
    target: claim_events
    meaning: An appeal of a denial is filed with the payer at a given level.
    grain: one row per appeal level per claim
    distinguish_by: [claim_number, appeal_level]
    fields:
      event_date: Date the appeal was filed.
      order_id: The order billed.
      claim_number: The claim appealed.
      amount: Amount in dispute.
      appeal_level: The level filed.
      source_claim_event_id: The denial (first level) or the prior level's decision (later levels) appealed.
    triggers: []
  - type: coverage_appeal_decided
    target: claim_events
    meaning: The payer (or reviewer) decides a filed appeal.
    grain: one row per appeal level per claim
    distinguish_by: [claim_number, appeal_level]
    fields:
      event_date: Date of the decision.
      order_id: The order billed.
      claim_number: The claim appealed.
      amount: Amount overturned (0.00 when upheld).
      appeal_level: The level decided.
      appeal_outcome: The decision.
      source_claim_event_id: The appeal filing decided.
    triggers:
      - event: coverage:coverage_claim_resubmitted
        when: {appeal_outcome: [overturned, partially_overturned]}
        map: {order_id: order_id, claim_number: claim_number, amount: amount, resubmission_reason: appeal_overturned, event_date: event_date}

measures:
  - id: coverage_msr_corrected_claims_on_claim
    window: the life of the claim number
    measure: count of coverage_claim_resubmitted rows on the claim_number whose resubmission_reason is corrected_claim, coordination_of_benefits_update or retroactive_eligibility
  - id: coverage_msr_appeal_levels_on_claim
    window: the life of the claim number
    measure: count of coverage_appeal_filed rows on the claim_number (the highest level already used)
  - id: coverage_msr_open_coverages
    window: current state
    measure: count of the customer's coverages whose status is not terminated

policies:
  - id: coverage_agg_multi_holding
    subject: [coverage_added]
    rule: >-
      A patient may have at most three coverages on file that are not terminated (coverage_msr_open_coverages),
      one per payment position: primary, secondary and tertiary; terminated coverages stay on file without
      limit. A fourth live coverage is refused until one is terminated, and the same payer and member ID may not
      be on file twice while the earlier record is not terminated: a correction to a live record is made on that
      record.
    eligibility:
      - id: no_duplicate_member
        applies_to: [coverage_added]
        kind: dedup
        condition: "the same payer and member ID may not be on file twice while the earlier record is not terminated: a correction to a live record is made on that record"
        evidence_fields: [coverages.member_id, coverages.payer_name, coverages.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[coverages.member_id, coverages.payer_name]]
          action_bindings: {coverages.member_id: member_id, coverages.payer_name: payer_name}
        dedup_contract:
          table: coverages
          mode: separate_record
          object_bindings: {member_id: member_id, payer_name: payer_name}
          duplicate_filters: {status: [pending_verification, active, inactive]}
          distinct_fields: []
    measures: [coverage_msr_open_coverages]
    params: {max_per_customer: 3}

  - id: coverage_agg_coordination_of_benefits
    subject: [coverage_added, coverage_details_updated, coverage_claim_submitted]
    rule: >-
      When a patient has more than one live coverage, the payment order is fixed by these rules, applied in this
      order. A Medicare Supplement Plan is never primary and pays only after Original Medicare Part B, by
      automatic crossover. Medicaid Managed Care Plan pays last, after every other coverage. TRICARE Prime and
      Select pays after any other health coverage except Medicaid. Between a Medicare payer class and an employer
      group plan, the employer plan is primary when it comes from the current employment of the patient or spouse
      (active_employment_coverage true) and the employer has at least msp_employer_size_threshold employees;
      otherwise Medicare is primary. Between two commercial plans, the plan where the patient is the subscriber
      is primary; for a child covered by both parents, the plan of the parent whose birthday (month and day)
      falls earlier in the year is primary. The first claim for an order goes only to the coverage that is primary on the date of service and active on that date.
      A secondary claim is filed only after the primary payer's remittance, within secondary_claim_submission_days
      calendar days of it, and for the amount the primary left unpaid; when secondary_crossover_automatic is
      true for the secondary payer class, the laboratory files nothing and records the crossover claim when the
      secondary payer acknowledges it. The coordination order on file changes only through a coverage details
      update made after the patient has updated their other-coverage information with the payer.
    eligibility:
      - id: bill_primary_first
        applies_to: [coverage_claim_submitted]
        kind: authorization
        condition: The first claim for an order goes only to the coverage that is primary on the date of service and active on that date.
        evidence_fields: [coverages.coordination_order, coverages.status, coverages.effective_date, coverages.termination_date, coverages.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[coverages.coverage_id]]
          action_bindings: {coverages.coverage_id: coverage_id}
    params:
      per_tier:
        Original Medicare Part B: {can_be_primary: "=can_be_primary", secondary_to_other_health_insurance: "=secondary_to_other_health_insurance", msp_employer_size_threshold: "=msp_employer_size_threshold", secondary_claim_submission_days: "=secondary_claim_submission_days"}
        Medicare Advantage Plan: {can_be_primary: "=can_be_primary", secondary_to_other_health_insurance: "=secondary_to_other_health_insurance", msp_employer_size_threshold: "=msp_employer_size_threshold", secondary_claim_submission_days: "=secondary_claim_submission_days"}
        Medicare Supplement Plan: {can_be_primary: "=can_be_primary", secondary_to_other_health_insurance: "=secondary_to_other_health_insurance", msp_employer_size_threshold: "=msp_employer_size_threshold", secondary_claim_submission_days: "=secondary_claim_submission_days"}
        Medicaid Managed Care Plan: {can_be_primary: "=can_be_primary", secondary_to_other_health_insurance: "=secondary_to_other_health_insurance", msp_employer_size_threshold: "=msp_employer_size_threshold", secondary_claim_submission_days: "=secondary_claim_submission_days"}
        TRICARE Prime and Select: {can_be_primary: "=can_be_primary", secondary_to_other_health_insurance: "=secondary_to_other_health_insurance", msp_employer_size_threshold: "=msp_employer_size_threshold", secondary_claim_submission_days: "=secondary_claim_submission_days"}
        Commercial In-Network Plan: {can_be_primary: "=can_be_primary", secondary_to_other_health_insurance: "=secondary_to_other_health_insurance", msp_employer_size_threshold: "=msp_employer_size_threshold", secondary_claim_submission_days: "=secondary_claim_submission_days"}
        Commercial Out-of-Network Plan: {can_be_primary: "=can_be_primary", secondary_to_other_health_insurance: "=secondary_to_other_health_insurance", msp_employer_size_threshold: "=msp_employer_size_threshold", secondary_claim_submission_days: "=secondary_claim_submission_days"}

  - id: coverage_evt_verification
    subject: [coverage_eligibility_checked, coverage_verified, coverage_verification_failed, coverage_reverification_failed, coverage_resubmitted_for_verification]
    rule: >-
      Before a coverage is billed it must be verified electronically. The member ID must match the payer class's
      member_id_format and the patient's relationship to the subscriber must be one of
      subscriber_relationships_allowed; a child dependent is covered only through dependent_max_age_years. A
      verification is completed within verification_turnaround_business_days business days; an
      eligibility_result of active_coverage sets the coverage active, member_not_found or inactive_coverage sets
      it inactive, and a coverage still unverified after pending_verification_max_business_days business days is
      set inactive. A coverage whose verified_date is more than eligibility_reverify_days calendar days before a
      date of service is re-verified before that order's claim is filed; a re-verification returning
      inactive_coverage sets it inactive. Corrected member details can be resubmitted on the same coverage only while it is inactive and no more than inactive_resubmission_window_days calendar days have passed since it was set inactive.
      The window counts calendar days from the date of the failed verification as day 0, the last day included; after it, the corrected details are added as a new coverage.
      Member details are taken exactly as printed on the patient's card; an agent never infers or reformats a
      member ID.
    eligibility:
      - id: resubmit_window
        applies_to: [coverage_resubmitted_for_verification]
        kind: time
        condition: Corrected member details can be resubmitted on the same coverage only while it is inactive and no more than inactive_resubmission_window_days calendar days have passed since it was set inactive.
        evidence_fields: [coverages.verified_date, coverages.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[coverages.coverage_id]]
          action_bindings: {coverages.coverage_id: coverage_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: it was set inactive
          anchor_source: coverages.verified_date
          relation: not_after
          duration_source: variants.inactive_resubmission_window_days
          unit: calendar_days
          counting_rule: The window counts calendar days from the date of the failed verification as day 0, the last day included; after it, the corrected details are added as a new coverage.
          boundary: inclusive
    params:
      per_tier:
        Original Medicare Part B: {eligibility_reverify_days: "=eligibility_reverify_days", inactive_resubmission_window_days: "=inactive_resubmission_window_days", dependent_max_age_years: "=dependent_max_age_years"}
        Medicare Advantage Plan: {eligibility_reverify_days: "=eligibility_reverify_days", inactive_resubmission_window_days: "=inactive_resubmission_window_days", dependent_max_age_years: "=dependent_max_age_years"}
        Medicare Supplement Plan: {eligibility_reverify_days: "=eligibility_reverify_days", inactive_resubmission_window_days: "=inactive_resubmission_window_days", dependent_max_age_years: "=dependent_max_age_years"}
        Medicaid Managed Care Plan: {eligibility_reverify_days: "=eligibility_reverify_days", inactive_resubmission_window_days: "=inactive_resubmission_window_days", dependent_max_age_years: "=dependent_max_age_years"}
        TRICARE Prime and Select: {eligibility_reverify_days: "=eligibility_reverify_days", inactive_resubmission_window_days: "=inactive_resubmission_window_days", dependent_max_age_years: "=dependent_max_age_years"}
        Commercial In-Network Plan: {eligibility_reverify_days: "=eligibility_reverify_days", inactive_resubmission_window_days: "=inactive_resubmission_window_days", dependent_max_age_years: "=dependent_max_age_years"}
        Commercial Out-of-Network Plan: {eligibility_reverify_days: "=eligibility_reverify_days", inactive_resubmission_window_days: "=inactive_resubmission_window_days", dependent_max_age_years: "=dependent_max_age_years"}

  - id: coverage_evt_termination_and_updates
    subject: [coverage_terminated, coverage_details_updated]
    rule: >-
      A coverage is terminated when the patient reports it ended or the payer returns a termination. The
      termination date follows termination_effective_rule: end_of_month sets it to the last day of the month in
      which the qualifying event (loss of employment, disenrollment, loss of eligibility) occurred, and
      date_of_event sets it to the event date itself. Orders with a date of service after the termination date
      cannot be billed to that coverage; they need another live coverage or a switch to self-pay under the orders
      rules. A coordination-of-benefits detail can be updated only on a coverage that is not terminated, and only
      after the patient states that they have updated their other-coverage information with the payer; member ID
      corrections go through resubmission for verification, never through a details update.
    eligibility:
      - id: update_live_only
        applies_to: [coverage_details_updated]
        kind: state
        condition: A coordination-of-benefits detail can be updated only on a coverage that is not terminated
        evidence_fields: [coverages.status, coverages.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[coverages.coverage_id]]
          action_bindings: {coverages.coverage_id: coverage_id}
        state_contract:
          field: coverages.status
          allowed: [pending_verification, active, inactive]
    params:
      per_tier:
        Original Medicare Part B: {termination_effective_rule: "=termination_effective_rule"}
        Medicare Advantage Plan: {termination_effective_rule: "=termination_effective_rule"}
        Medicare Supplement Plan: {termination_effective_rule: "=termination_effective_rule"}
        Medicaid Managed Care Plan: {termination_effective_rule: "=termination_effective_rule"}
        TRICARE Prime and Select: {termination_effective_rule: "=termination_effective_rule"}
        Commercial In-Network Plan: {termination_effective_rule: "=termination_effective_rule"}
        Commercial Out-of-Network Plan: {termination_effective_rule: "=termination_effective_rule"}

  - id: coverage_evt_claim_submission
    subject: [coverage_claim_submitted]
    rule: >-
      The laboratory files one claim per order per coverage, claim_submission_lag_business_days business days
      after the final report, for the order's list_price_total. A claim can be filed only on a coverage that is active.
      The claim must reach the payer no later than timely_filing_days calendar days after the date of service.
      The filing limit counts calendar days with the collection date as day 0, and a claim filed on the last day is timely.
      A claim is filed only when the order carries diagnosis codes and, where the class requires prior
      authorization for the payer class, an approved authorization collected within prior_auth_validity_days of
      its approval. Coverage whose verified_date is older than eligibility_reverify_days before the date of
      service is re-verified first. A claim already filed for the same order and coverage is never filed again
      as a new claim; changes go through a corrected claim. The laboratory files with every payer class whose
      lab_files_claims is true, whatever its network_status. Where assignment_accepted is true the payer pays the
      laboratory; where it is false the payer sends its payment to the patient, no payer payment is recorded on
      the claim, and the patient is assigned the out-of-network balance under the adjudication rule. A clean claim
      is normally adjudicated within expected_adjudication_days calendar days of filing; the payer's allowed
      amount is expected to be allowed_amount_pct_of_fee_schedule percent of its fee_schedule_basis, but the
      remittance governs. A frequency denial (CO-151) can arise only where lab_test_frequency_edits_apply is true
      and a medical-necessity denial (CO-50) only where medical_necessity_edits_apply is true.
    eligibility:
      - id: claim_on_active_coverage
        applies_to: [coverage_claim_submitted]
        kind: state
        condition: A claim can be filed only on a coverage that is active.
        evidence_fields: [coverages.status, coverages.coverage_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[coverages.coverage_id]]
          action_bindings: {coverages.coverage_id: coverage_id}
        state_contract:
          field: coverages.status
          allowed: [active]
      - id: timely_filing
        applies_to: [coverage_claim_submitted]
        kind: time
        condition: The claim must reach the payer no later than timely_filing_days calendar days after the date of service.
        evidence_fields: [orders.collection_date, orders.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[orders.order_id]]
          action_bindings: {orders.order_id: order_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of service
          anchor_source: orders.collection_date
          relation: not_after
          duration_source: variants.timely_filing_days
          unit: calendar_days
          counting_rule: The filing limit counts calendar days with the collection date as day 0, and a claim filed on the last day is timely.
          boundary: inclusive
    params:
      per_tier:
        Original Medicare Part B: {timely_filing_days: "=timely_filing_days", claim_submission_lag_business_days: "=claim_submission_lag_business_days"}
        Medicare Advantage Plan: {timely_filing_days: "=timely_filing_days", claim_submission_lag_business_days: "=claim_submission_lag_business_days"}
        Medicare Supplement Plan: {timely_filing_days: "=timely_filing_days", claim_submission_lag_business_days: "=claim_submission_lag_business_days"}
        Medicaid Managed Care Plan: {timely_filing_days: "=timely_filing_days", claim_submission_lag_business_days: "=claim_submission_lag_business_days"}
        TRICARE Prime and Select: {timely_filing_days: "=timely_filing_days", claim_submission_lag_business_days: "=claim_submission_lag_business_days"}
        Commercial In-Network Plan: {timely_filing_days: "=timely_filing_days", claim_submission_lag_business_days: "=claim_submission_lag_business_days"}
        Commercial Out-of-Network Plan: {timely_filing_days: "=timely_filing_days", claim_submission_lag_business_days: "=claim_submission_lag_business_days"}

  - id: coverage_evt_adjudication
    subject: [coverage_claim_paid, coverage_contractual_adjustment, coverage_patient_responsibility_assigned]
    rule: >-
      Each remittance resolves the amount of the submission it answers: payment plus contractual adjustment plus
      patient responsibility plus denied amount equals the amount submitted. When contractual_adjustment_applies
      is true, billed charges above the payer's allowed amount are written off as a contractual adjustment and the
      patient owes only the cost share the remittance states. Original Medicare Part B and Medicare Supplement
      Plan carry no patient cost share on covered clinical laboratory tests (clinical_lab_patient_cost_share is
      false); anatomic pathology services carry Part B deductible and coinsurance where pathology_cost_share is
      true, which a Medicare Supplement Plan then pays by crossover. When patient_billing_prohibited_except_copay
      is true, nothing but a plan copay is ever assigned to the patient for a covered service. For a payer class
      whose balance_billing_allowed is true, the patient is assigned the billed amount less the payer's payment,
      capped at the sum of the self_pay_price of the order's tests when oon_patient_balance_cap_basis is
      self_pay_price, and the excess above the cap is written off as a contractual adjustment. Patient
      responsibility is assigned within patient_responsibility_posting_business_days business days of the
      remittance and is billed to the patient on an invoice. A secondary payer's remittance reduces what the
      primary left to the patient before any of it is assigned.
    eligibility: []
    params:
      per_tier:
        Original Medicare Part B: {contractual_adjustment_applies: "=contractual_adjustment_applies", clinical_lab_patient_cost_share: "=clinical_lab_patient_cost_share", balance_billing_allowed: "=balance_billing_allowed", oon_patient_balance_cap_basis: "=oon_patient_balance_cap_basis"}
        Medicare Advantage Plan: {contractual_adjustment_applies: "=contractual_adjustment_applies", clinical_lab_patient_cost_share: "=clinical_lab_patient_cost_share", balance_billing_allowed: "=balance_billing_allowed", oon_patient_balance_cap_basis: "=oon_patient_balance_cap_basis"}
        Medicare Supplement Plan: {contractual_adjustment_applies: "=contractual_adjustment_applies", clinical_lab_patient_cost_share: "=clinical_lab_patient_cost_share", balance_billing_allowed: "=balance_billing_allowed", oon_patient_balance_cap_basis: "=oon_patient_balance_cap_basis"}
        Medicaid Managed Care Plan: {contractual_adjustment_applies: "=contractual_adjustment_applies", clinical_lab_patient_cost_share: "=clinical_lab_patient_cost_share", balance_billing_allowed: "=balance_billing_allowed", oon_patient_balance_cap_basis: "=oon_patient_balance_cap_basis"}
        TRICARE Prime and Select: {contractual_adjustment_applies: "=contractual_adjustment_applies", clinical_lab_patient_cost_share: "=clinical_lab_patient_cost_share", balance_billing_allowed: "=balance_billing_allowed", oon_patient_balance_cap_basis: "=oon_patient_balance_cap_basis"}
        Commercial In-Network Plan: {contractual_adjustment_applies: "=contractual_adjustment_applies", clinical_lab_patient_cost_share: "=clinical_lab_patient_cost_share", balance_billing_allowed: "=balance_billing_allowed", oon_patient_balance_cap_basis: "=oon_patient_balance_cap_basis"}
        Commercial Out-of-Network Plan: {contractual_adjustment_applies: "=contractual_adjustment_applies", clinical_lab_patient_cost_share: "=clinical_lab_patient_cost_share", balance_billing_allowed: "=balance_billing_allowed", oon_patient_balance_cap_basis: "=oon_patient_balance_cap_basis"}

  - id: coverage_evt_denial_liability
    subject: [coverage_claim_denied, coverage_patient_responsibility_assigned]
    rule: >-
      A denied amount is the laboratory's loss unless the denial code makes it the patient's.
      A denied amount may be transferred to the patient only when its denial code is listed in the payer class's patient_billable_denial_codes.
      Denials in group CO are never billed to the patient. CO-16 (missing information) and CO-31 (patient not
      identified) are cured by a corrected claim; CO-22 (other coverage primary) is cured by a corrected claim
      after the coordination order is updated; CO-27 (coverage terminated) is cured by billing the coverage that
      was live on the date of service or, if none, by switching the order to self-pay within the orders rules;
      CO-109 (wrong payer) is cured by filing with the correct payer; CO-29 (timely filing) is written off and
      never billed to the patient. CO-50 (medical necessity), CO-151 (frequency) and CO-197 (authorization
      absent) are appealed under the appeal rule; for CO-197 a retroactive authorization requested by the
      provider within prior_auth_retro_request_days of the date of service is filed as a corrected claim instead.
      Under Original Medicare Part B a medical-necessity or frequency denial of a test billed with a signed ABN
      option 1 arrives as PR-50 and is the patient's when abn_shifts_liability is true; without a signed ABN it
      arrives as CO-50 and stays with the laboratory. A timely-filing denial is never the patient's
      (timely_filing_denial_patient_billable is false). PR-27 (coverage ended, patient responsible), PR-96 (non-covered charge) and PR-204
      (not covered under the patient's benefit plan) are assigned to the patient where listed. Medicaid Managed
      Care Plan lists no patient-billable denial.
    eligibility:
      - id: billable_denial_only
        applies_to: [coverage_patient_responsibility_assigned]
        kind: authorization
        condition: A denied amount may be transferred to the patient only when its denial code is listed in the payer class's patient_billable_denial_codes.
        evidence_fields: [claim_events.denial_code, claim_events.claim_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[claim_events.claim_event_id]]
          action_bindings: {claim_events.claim_event_id: source_claim_event_id}
    params:
      per_tier:
        Original Medicare Part B: {patient_billable_denial_codes: "=patient_billable_denial_codes", abn_shifts_liability: "=abn_shifts_liability", prior_auth_retro_request_days: "=prior_auth_retro_request_days"}
        Medicare Advantage Plan: {patient_billable_denial_codes: "=patient_billable_denial_codes", abn_shifts_liability: "=abn_shifts_liability", prior_auth_retro_request_days: "=prior_auth_retro_request_days"}
        Medicare Supplement Plan: {patient_billable_denial_codes: "=patient_billable_denial_codes", abn_shifts_liability: "=abn_shifts_liability", prior_auth_retro_request_days: "=prior_auth_retro_request_days"}
        Medicaid Managed Care Plan: {patient_billable_denial_codes: "=patient_billable_denial_codes", abn_shifts_liability: "=abn_shifts_liability", prior_auth_retro_request_days: "=prior_auth_retro_request_days"}
        TRICARE Prime and Select: {patient_billable_denial_codes: "=patient_billable_denial_codes", abn_shifts_liability: "=abn_shifts_liability", prior_auth_retro_request_days: "=prior_auth_retro_request_days"}
        Commercial In-Network Plan: {patient_billable_denial_codes: "=patient_billable_denial_codes", abn_shifts_liability: "=abn_shifts_liability", prior_auth_retro_request_days: "=prior_auth_retro_request_days"}
        Commercial Out-of-Network Plan: {patient_billable_denial_codes: "=patient_billable_denial_codes", abn_shifts_liability: "=abn_shifts_liability", prior_auth_retro_request_days: "=prior_auth_retro_request_days"}

  - id: coverage_evt_corrected_claim
    subject: [coverage_claim_resubmitted]
    rule: >-
      A corrected or replacement claim answers one denial and carries that denial's amount; its reason is
      corrected_claim (CO-16, CO-31, or a retroactive authorization for CO-197), coordination_of_benefits_update
      (CO-22, only after the coverage's coordination order has been updated following the denial; when
      cob_questionnaire_required_on_co22 is true the patient must first have updated their other-coverage
      information with the payer), or retroactive_eligibility (CO-27 where Medicaid approved enrollment covering
      the date of service within retroactive_eligibility_lookback_days). A corrected claim must be filed no later than corrected_claim_window_days calendar days after the denial date.
      The correction window counts calendar days with the denial date as day 0, the last day included.
      No more than max_corrected_claims_per_claim corrections may be filed on one claim number
      (coverage_msr_corrected_claims_on_claim); beyond that the denial stands unless appealed. A denial may be answered by at most one resubmission.
      Reprocessing after an overturned appeal is recorded as a resubmission with reason appeal_overturned and does
      not count toward the correction limit.
    eligibility:
      - id: correction_window
        applies_to: [coverage_claim_resubmitted]
        kind: time
        condition: A corrected claim must be filed no later than corrected_claim_window_days calendar days after the denial date.
        evidence_fields: [claim_events.event_date, claim_events.claim_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[claim_events.claim_event_id]]
          action_bindings: {claim_events.claim_event_id: source_claim_event_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the denial date
          anchor_source: claim_events.event_date
          relation: not_after
          duration_source: variants.corrected_claim_window_days
          unit: calendar_days
          counting_rule: The correction window counts calendar days with the denial date as day 0, the last day included.
          boundary: inclusive
      - id: one_resubmission_per_denial
        applies_to: [coverage_claim_resubmitted]
        kind: dedup
        condition: A denial may be answered by at most one resubmission.
        evidence_fields: [claim_events.source_claim_event_id, claim_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[claim_events.source_claim_event_id]]
          action_bindings: {claim_events.source_claim_event_id: source_claim_event_id}
        dedup_contract:
          table: claim_events
          mode: separate_record
          object_bindings: {source_claim_event_id: source_claim_event_id}
          duplicate_filters: {event_type: [coverage_claim_resubmitted]}
          distinct_fields: []
    measures: [coverage_msr_corrected_claims_on_claim]
    params:
      per_tier:
        Original Medicare Part B: {corrected_claim_window_days: "=corrected_claim_window_days", max_corrected_claims_per_claim: "=max_corrected_claims_per_claim", retroactive_eligibility_lookback_days: "=retroactive_eligibility_lookback_days"}
        Medicare Advantage Plan: {corrected_claim_window_days: "=corrected_claim_window_days", max_corrected_claims_per_claim: "=max_corrected_claims_per_claim", retroactive_eligibility_lookback_days: "=retroactive_eligibility_lookback_days"}
        Medicare Supplement Plan: {corrected_claim_window_days: "=corrected_claim_window_days", max_corrected_claims_per_claim: "=max_corrected_claims_per_claim", retroactive_eligibility_lookback_days: "=retroactive_eligibility_lookback_days"}
        Medicaid Managed Care Plan: {corrected_claim_window_days: "=corrected_claim_window_days", max_corrected_claims_per_claim: "=max_corrected_claims_per_claim", retroactive_eligibility_lookback_days: "=retroactive_eligibility_lookback_days"}
        TRICARE Prime and Select: {corrected_claim_window_days: "=corrected_claim_window_days", max_corrected_claims_per_claim: "=max_corrected_claims_per_claim", retroactive_eligibility_lookback_days: "=retroactive_eligibility_lookback_days"}
        Commercial In-Network Plan: {corrected_claim_window_days: "=corrected_claim_window_days", max_corrected_claims_per_claim: "=max_corrected_claims_per_claim", retroactive_eligibility_lookback_days: "=retroactive_eligibility_lookback_days"}
        Commercial Out-of-Network Plan: {corrected_claim_window_days: "=corrected_claim_window_days", max_corrected_claims_per_claim: "=max_corrected_claims_per_claim", retroactive_eligibility_lookback_days: "=retroactive_eligibility_lookback_days"}
    formula:
      when_not: coverage_msr_corrected_claims_on_claim >= max_corrected_claims_per_claim

  - id: coverage_evt_appeals
    subject: [coverage_appeal_filed, coverage_appeal_decided]
    rule: >-
      Denials CO-50, CO-151 and CO-197 (when no retroactive authorization is available) are appealed rather than
      corrected; a denial curable by a corrected claim is never appealed. The laboratory files appeals on its own
      initiative through lab_appeal_levels_pursued levels; beyond them, or when the payer class's
      lab_appeal_levels_pursued is 0, only the patient can appeal, directly with the payer. When appeal_requires_patient_authorization is true, the laboratory may file only after the patient has personally signed an authorized-representative form for that claim.
      A first-level appeal must be filed no later than first_level_appeal_window_days plus notice_receipt_presumption_days calendar days after the denial date.
      Appeal windows count calendar days with the notice or decision date as day 0, the last day included, and for the first level the notice_receipt_presumption_days are added to first_level_appeal_window_days before counting.
      A second-level appeal follows only an upheld (or partially overturned) first level and is filed within
      second_level_appeal_window_days of that decision; when second_level_auto_forward is true it is forwarded by
      the payer and the laboratory files nothing. A third-level request is filed within
      third_level_appeal_window_days of the second-level decision and only when the amount still in dispute is at
      least third_level_min_amount_in_controversy. Each level is filed once per claim. The payer decides within
      payer_appeal_decision_days; an overturned or partially overturned decision is reprocessed as a
      resubmission, and an upheld decision at the last level pursued leaves the denial standing under the
      denial-liability rule.
    eligibility:
      - id: representative_form
        applies_to: [coverage_appeal_filed]
        kind: caller_fact
        condition: When appeal_requires_patient_authorization is true, the laboratory may file only after the patient has personally signed an authorized-representative form for that claim.
        evidence_fields: [claim_events.claim_number, claim_events.claim_event_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[claim_events.claim_event_id]]
          action_bindings: {claim_events.claim_event_id: source_claim_event_id}
      - id: first_level_window
        applies_to: [coverage_appeal_filed]
        kind: time
        condition: A first-level appeal must be filed no later than first_level_appeal_window_days plus notice_receipt_presumption_days calendar days after the denial date.
        evidence_fields: [claim_events.event_date, claim_events.claim_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[claim_events.claim_event_id]]
          action_bindings: {claim_events.claim_event_id: source_claim_event_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the denial date
          anchor_source: claim_events.event_date
          relation: not_after
          duration_source: variants.first_level_appeal_window_days
          unit: calendar_days
          counting_rule: Appeal windows count calendar days with the notice or decision date as day 0, the last day included, and for the first level the notice_receipt_presumption_days are added to first_level_appeal_window_days before counting.
          boundary: inclusive
      - id: level_once
        applies_to: [coverage_appeal_filed]
        kind: dedup
        condition: Each level is filed once per claim.
        evidence_fields: [claim_events.claim_number, claim_events.appeal_level, claim_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[claim_events.claim_number, claim_events.appeal_level]]
          action_bindings: {claim_events.claim_number: claim_number, claim_events.appeal_level: appeal_level}
        dedup_contract:
          table: claim_events
          mode: separate_record
          object_bindings: {claim_number: claim_number, appeal_level: appeal_level}
          duplicate_filters: {event_type: [coverage_appeal_filed]}
          distinct_fields: []
    measures: [coverage_msr_appeal_levels_on_claim]
    params:
      per_tier:
        Original Medicare Part B: {lab_appeal_levels_pursued: "=lab_appeal_levels_pursued", second_level_appeal_window_days: "=second_level_appeal_window_days"}
        Medicare Advantage Plan: {lab_appeal_levels_pursued: "=lab_appeal_levels_pursued", second_level_appeal_window_days: "=second_level_appeal_window_days"}
        Medicare Supplement Plan: {lab_appeal_levels_pursued: "=lab_appeal_levels_pursued", second_level_appeal_window_days: "=second_level_appeal_window_days"}
        Medicaid Managed Care Plan: {lab_appeal_levels_pursued: "=lab_appeal_levels_pursued", second_level_appeal_window_days: "=second_level_appeal_window_days"}
        TRICARE Prime and Select: {lab_appeal_levels_pursued: "=lab_appeal_levels_pursued", second_level_appeal_window_days: "=second_level_appeal_window_days"}
        Commercial In-Network Plan: {lab_appeal_levels_pursued: "=lab_appeal_levels_pursued", second_level_appeal_window_days: "=second_level_appeal_window_days"}
        Commercial Out-of-Network Plan: {lab_appeal_levels_pursued: "=lab_appeal_levels_pursued", second_level_appeal_window_days: "=second_level_appeal_window_days"}
    formula:
      appeal_window_total_days: first_level_appeal_window_days + notice_receipt_presumption_days

extended_policies:
  - id: coverage_ext_primary_internal_appeal
    base_policy_refs: [coverage_evt_appeals, coverage_evt_adjudication, coverage_evt_denial_liability]
    overwrite: []
    trigger: state_due
    subject: [coverage_appeal_filed]
    computes: amount_in_dispute
    target_tool: file_internal_appeal_c10f15cc
    params:
      coinsurance_phase_pct: 20
      deductible_phase_pct: 50
      deductible_satisfied_amount: 250
      standard_member_pct: 15
      out_of_pocket_ceiling: 2500
      aged_claim_days: 90
      standing_claim_days: 45
      aged_claim_rate_pct: 18
      standing_claim_rate_pct: 12
      base_claim_rate_pct: 8
      variance_tolerance_pts: 5
      variance_floor_pts: 2
    rule: >-
      This rule fixes the amount in dispute that the laboratory records when it files a first-level internal appeal on a
      claim of a contracted commercial plan. The internal appeal's claim is the claim carrying the most recent medical-necessity denial on the coverage. The internal appeal's disputed charges are the claim's medical-necessity, frequency and
      authorization denial amounts, plus its missing-information and patient-identification denial amounts while no
      corrected claim stands on that claim. The internal appeal's disputed charges are fixed only after the claim carries a
      corrected claim answering each of its missing-information denials. The amount in dispute starts from the internal appeal's disputed charges taken at billed value, less the internal appeal's standard member share percent of them, and is rounded half up to the cent once, at the end. An allowed ratio
      is the plan's payment plus the member responsibility assigned, divided by that payment plus the contractual
      adjustment plus that member responsibility; the claim's own allowed ratio takes these amounts over the claim's lines,
      and the coverage's twelve-month allowed ratio takes them over every such line on the coverage within the last twelve
      months. The internal appeal's valuation ratio is the claim's own allowed ratio where the remittance paid at least one line of the claim; it is the coverage's twelve-month allowed ratio where no line of the claim was paid but the coverage carries a plan payment within the last twelve months; otherwise it is one. The
      internal appeal's valued charges are its disputed charges times its valuation ratio. The internal appeal's member share percent is the coinsurance phase percent where the deductible amounts assigned on the coverage within the last twelve months reach the deductible satisfied amount; it is the deductible phase percent where some deductible was assigned within those twelve months but the amounts stay below the deductible satisfied amount; otherwise it is the standard member share percent. The internal appeal's
      member portion is its valued charges times its member share percent, divided by one hundred, and it is held to the
      member's out-of-pocket room: it is zero where the member responsibility assigned on the coverage within the last
      twelve months has already reached the out-of-pocket ceiling; it is the ceiling less that responsibility where that
      responsibility plus the member portion would pass the ceiling; otherwise it stands as figured. The internal appeal's
      plan portion is its valued charges less its member portion so held. The internal appeal's interest days run as
      follows: where the plan took more than twice its expected adjudication days between the claim's filing date and its
      denial date, interest runs for every calendar day from the filing date to today; where the plan took more than its
      expected adjudication days but not more than twice that, interest runs for the calendar days from the filing date to
      today less the expected adjudication days; otherwise no interest runs. The internal appeal's annual interest rate
      follows the age of the claim in calendar days from its filing date to today: the aged claim rate where the age
      exceeds the aged claim days, the standing claim rate where the age exceeds the standing claim days but not the aged
      claim days, and the base claim rate otherwise. The internal appeal's interest is its plan portion times its annual
      interest rate, divided by one hundred, times its interest days, divided by 365. The internal appeal's underpayment
      gap, figured only where the claim has a paid line, is the coverage's twelve-month allowed ratio less the claim's own
      allowed ratio, in percentage points, and the claim's paid-line charges are the plan's payment plus the contractual
      adjustment plus the member responsibility on the claim. The internal appeal's underpayment addition is the whole gap
      applied to the paid-line charges where the gap exceeds the variance tolerance, the part of the gap above the variance
      floor applied to the paid-line charges where the gap exceeds the variance floor but not the variance tolerance, and
      nothing otherwise. The amount in dispute is the internal appeal's plan portion plus its interest plus its underpayment
      addition, with no rounding before the final cent.
    prerequisite:
      - problem: coverage_ext_primary_information_correction
        kind: value_input
        gate: disputed_charges
        form: state
        policy_source: >-
          The internal appeal's disputed charges are fixed only after the claim carries a corrected claim answering each of
          its missing-information denials.
        condition: >-
          The appealed claim carries a coverage_claim_resubmitted line with resubmission_reason corrected_claim answering
          its CO-16 denial, so the CO-16 amount has left disputed_charges.
        resolved_by: file_information_correction_a0c86b6b
        effect: >-
          Once the corrected claim stands on the claim, disputed_charges drops the missing-information denial amount and
          keeps the medical-necessity, frequency and authorization denial amounts only.
    cross_category: []
    compute:
      - clm: "LATEST('claim_events','claim_number', event_type='coverage_claim_denied', denial_code='CO-50')"
      - appealable_denied: "SUM('claim_events','amount', event_type='coverage_claim_denied', denial_code='CO-50', claim_number=clm) + SUM('claim_events','amount', event_type='coverage_claim_denied', denial_code='CO-151', claim_number=clm) + SUM('claim_events','amount', event_type='coverage_claim_denied', denial_code='CO-197', claim_number=clm)"
      - curable_denied: "SUM('claim_events','amount', event_type='coverage_claim_denied', denial_code='CO-16', claim_number=clm) + SUM('claim_events','amount', event_type='coverage_claim_denied', denial_code='CO-31', claim_number=clm)"
      - corrections_on_claim: "COUNT('claim_events', event_type='coverage_claim_resubmitted', resubmission_reason='corrected_claim', claim_number=clm)"
      - disputed_charges: "appealable_denied + (curable_denied if corrections_on_claim == 0 else 0)"
      - claim_paid: "SUM('claim_events','amount', event_type='coverage_claim_paid', claim_number=clm)"
      - claim_adjusted: "SUM('claim_events','amount', event_type='coverage_contractual_adjustment', claim_number=clm)"
      - claim_member: "SUM('claim_events','amount', event_type='coverage_patient_responsibility_assigned', claim_number=clm)"
      - claim_paid_lines: "COUNT('claim_events', event_type='coverage_claim_paid', claim_number=clm)"
      - year_paid: "SUM('claim_events','amount', within_months=12, event_type='coverage_claim_paid')"
      - year_adjusted: "SUM('claim_events','amount', within_months=12, event_type='coverage_contractual_adjustment')"
      - year_member: "SUM('claim_events','amount', within_months=12, event_type='coverage_patient_responsibility_assigned')"
      - year_paid_lines: "COUNT('claim_events', within_months=12, event_type='coverage_claim_paid')"
      - appeal_valuation_ratio: "((claim_paid + claim_member) / (claim_paid + claim_adjusted + claim_member)) if claim_paid_lines >= 1 else (((year_paid + year_member) / (year_paid + year_adjusted + year_member)) if (claim_paid_lines == 0 and year_paid_lines >= 1) else 1)"
      - valued_charges: "disputed_charges * appeal_valuation_ratio"
      - year_deductible: "SUM('claim_events','amount', within_months=12, event_type='coverage_patient_responsibility_assigned', responsibility_type='deductible')"
      - appeal_member_share_pct: "K('coinsurance_phase_pct') if year_deductible >= K('deductible_satisfied_amount') else (K('deductible_phase_pct') if year_deductible > 0 else K('standard_member_pct'))"
      - member_portion: "valued_charges * appeal_member_share_pct / 100"
      - year_member_responsibility: "SUM('claim_events','amount', within_months=12, event_type='coverage_patient_responsibility_assigned')"
      - appeal_member_portion_held: "0 if year_member_responsibility >= K('out_of_pocket_ceiling') else ((K('out_of_pocket_ceiling') - year_member_responsibility) if year_member_responsibility + member_portion > K('out_of_pocket_ceiling') else member_portion)"
      - plan_portion: "valued_charges - appeal_member_portion_held"
      - filed_on: "LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm)"
      - denied_on: "LATEST('claim_events','event_date', event_type='coverage_claim_denied', claim_number=clm)"
      - adjudication_days: "DAYS(filed_on, denied_on)"
      - appeal_interest_days: "DAYS(filed_on, NOW) if adjudication_days > 2 * P('expected_adjudication_days') else ((DAYS(filed_on, NOW) - P('expected_adjudication_days')) if adjudication_days > P('expected_adjudication_days') else 0)"
      - claim_age_days: "DAYS(LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm), NOW)"
      - appeal_interest_rate_pct: "K('aged_claim_rate_pct') if claim_age_days > K('aged_claim_days') else (K('standing_claim_rate_pct') if claim_age_days > K('standing_claim_days') else K('base_claim_rate_pct'))"
      - interest: "plan_portion * appeal_interest_rate_pct / 100 * appeal_interest_days / 365"
      - gap_claim_ratio: "((SUM('claim_events','amount', event_type='coverage_claim_paid', claim_number=clm) + SUM('claim_events','amount', event_type='coverage_patient_responsibility_assigned', claim_number=clm)) / (SUM('claim_events','amount', event_type='coverage_claim_paid', claim_number=clm) + SUM('claim_events','amount', event_type='coverage_contractual_adjustment', claim_number=clm) + SUM('claim_events','amount', event_type='coverage_patient_responsibility_assigned', claim_number=clm))) if COUNT('claim_events', event_type='coverage_claim_paid', claim_number=clm) >= 1 else 0"
      - gap_year_ratio: "((SUM('claim_events','amount', within_months=12, event_type='coverage_claim_paid') + SUM('claim_events','amount', within_months=12, event_type='coverage_patient_responsibility_assigned')) / (SUM('claim_events','amount', within_months=12, event_type='coverage_claim_paid') + SUM('claim_events','amount', within_months=12, event_type='coverage_contractual_adjustment') + SUM('claim_events','amount', within_months=12, event_type='coverage_patient_responsibility_assigned'))) if COUNT('claim_events', within_months=12, event_type='coverage_claim_paid') >= 1 else 0"
      - underpayment_gap_pts: "((gap_year_ratio - gap_claim_ratio) * 100) if gap_claim_ratio > 0 else 0"
      - paid_line_charges: "claim_paid + claim_adjusted + claim_member"
      - appeal_underpayment_addition: "(underpayment_gap_pts / 100 * paid_line_charges) if underpayment_gap_pts > K('variance_tolerance_pts') else (((underpayment_gap_pts - K('variance_floor_pts')) / 100 * paid_line_charges) if underpayment_gap_pts > K('variance_floor_pts') else 0)"
      - result: "RND(plan_portion + interest + appeal_underpayment_addition, 2)"
    compute_basis:
      clm: "The internal appeal's claim is the claim carrying the most recent medical-necessity denial on the coverage."
      appealable_denied: "The internal appeal's disputed charges are the claim's medical-necessity, frequency and authorization denial amounts, plus its missing-information and patient-identification denial amounts while no corrected claim stands on that claim."
      curable_denied: "plus its missing-information and patient-identification denial amounts while no corrected claim stands on that claim."
      corrections_on_claim: "while no corrected claim stands on that claim."
      disputed_charges: "The internal appeal's disputed charges are the claim's medical-necessity, frequency and authorization denial amounts, plus its missing-information and patient-identification denial amounts while no corrected claim stands on that claim."
      claim_paid: "the claim's own allowed ratio takes these amounts over the claim's lines"
      claim_adjusted: "the claim's own allowed ratio takes these amounts over the claim's lines"
      claim_member: "the claim's own allowed ratio takes these amounts over the claim's lines"
      claim_paid_lines: "where the remittance paid at least one line of the claim;"
      year_paid: "the coverage's twelve-month allowed ratio takes them over every such line on the coverage within the last twelve months."
      year_adjusted: "the coverage's twelve-month allowed ratio takes them over every such line on the coverage within the last twelve months."
      year_member: "the coverage's twelve-month allowed ratio takes them over every such line on the coverage within the last twelve months."
      year_paid_lines: "where no line of the claim was paid but the coverage carries a plan payment within the last twelve months"
      appeal_valuation_ratio: "The internal appeal's valuation ratio is the claim's own allowed ratio where the remittance paid at least one line of the claim; it is the coverage's twelve-month allowed ratio where no line of the claim was paid but the coverage carries a plan payment within the last twelve months; otherwise it is one."
      valued_charges: "The internal appeal's valued charges are its disputed charges times its valuation ratio."
      year_deductible: "the deductible amounts assigned on the coverage within the last twelve months reach the deductible satisfied amount"
      appeal_member_share_pct: "The internal appeal's member share percent is the coinsurance phase percent where the deductible amounts assigned on the coverage within the last twelve months reach the deductible satisfied amount; it is the deductible phase percent where some deductible was assigned within those twelve months but the amounts stay below the deductible satisfied amount; otherwise it is the standard member share percent."
      member_portion: "The internal appeal's member portion is its valued charges times its member share percent, divided by one hundred"
      year_member_responsibility: "the member responsibility assigned on the coverage within the last twelve months"
      appeal_member_portion_held: "it is zero where the member responsibility assigned on the coverage within the last twelve months has already reached the out-of-pocket ceiling; it is the ceiling less that responsibility where that responsibility plus the member portion would pass the ceiling; otherwise it stands as figured."
      plan_portion: "The internal appeal's plan portion is its valued charges less its member portion so held."
      filed_on: "between the claim's filing date and its denial date"
      denied_on: "between the claim's filing date and its denial date"
      adjudication_days: "where the plan took more than twice its expected adjudication days between the claim's filing date and its denial date"
      appeal_interest_days: "where the plan took more than twice its expected adjudication days between the claim's filing date and its denial date, interest runs for every calendar day from the filing date to today; where the plan took more than its expected adjudication days but not more than twice that, interest runs for the calendar days from the filing date to today less the expected adjudication days; otherwise no interest runs."
      claim_age_days: "the age of the claim in calendar days from its filing date to today"
      appeal_interest_rate_pct: "the aged claim rate where the age exceeds the aged claim days, the standing claim rate where the age exceeds the standing claim days but not the aged claim days, and the base claim rate otherwise."
      interest: "The internal appeal's interest is its plan portion times its annual interest rate, divided by one hundred, times its interest days, divided by 365."
      gap_claim_ratio: "The internal appeal's underpayment gap, figured only where the claim has a paid line, is the coverage's twelve-month allowed ratio less the claim's own allowed ratio, in percentage points"
      gap_year_ratio: "The internal appeal's underpayment gap, figured only where the claim has a paid line, is the coverage's twelve-month allowed ratio less the claim's own allowed ratio, in percentage points"
      underpayment_gap_pts: "The internal appeal's underpayment gap, figured only where the claim has a paid line, is the coverage's twelve-month allowed ratio less the claim's own allowed ratio, in percentage points"
      paid_line_charges: "the claim's paid-line charges are the plan's payment plus the contractual adjustment plus the member responsibility on the claim."
      appeal_underpayment_addition: "The internal appeal's underpayment addition is the whole gap applied to the paid-line charges where the gap exceeds the variance tolerance, the part of the gap above the variance floor applied to the paid-line charges where the gap exceeds the variance floor but not the variance tolerance, and nothing otherwise."
      result: "The amount in dispute is the internal appeal's plan portion plus its interest plus its underpayment addition, with no rounding before the final cent."
    factors:
      - id: internal_appeal_valuation
        effect: method
        decides: appeal_valuation_ratio
        bindings: [claim_paid, claim_adjusted, claim_member, claim_paid_lines, year_paid, year_adjusted, year_member, year_paid_lines, appeal_valuation_ratio]
        ladder:
          - when: "For the internal appeal, the remittance paid at least one line of the claim"
            method: "under the internal appeal, the disputed charges are multiplied by the claim's own allowed ratio"
          - when: "For the internal appeal, no line of the claim was paid but the coverage carries a plan payment within the last twelve months"
            method: "under the internal appeal, the disputed charges are multiplied by the coverage's twelve-month allowed ratio"
          - when: "For the internal appeal, otherwise"
            method: "under the internal appeal, the disputed charges stay at billed value"
        baseline:
          appeal_valuation_ratio: "1"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: internal_appeal_member_share
        effect: parameter
        decides: appeal_member_share_pct
        bindings: [year_deductible, appeal_member_share_pct]
        ladder:
          - when: "For the internal appeal, the deductible amounts assigned on the coverage within the last twelve months reach the deductible satisfied amount"
            value: "K('coinsurance_phase_pct')"
          - when: "For the internal appeal, some deductible was assigned within those twelve months but the amounts stay below the deductible satisfied amount"
            value: "K('deductible_phase_pct')"
          - when: "For the internal appeal, otherwise"
            value: "K('standard_member_pct')"
        baseline:
          appeal_member_share_pct: "K('standard_member_pct')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: internal_appeal_out_of_pocket_hold
        effect: method
        decides: appeal_member_portion_held
        bindings: [year_member_responsibility, appeal_member_portion_held]
        ladder:
          - when: "For the internal appeal, the member responsibility assigned on the coverage within the last twelve months has already reached the out-of-pocket ceiling"
            method: "under the internal appeal, the member portion is zero"
          - when: "For the internal appeal, that responsibility has not reached the ceiling but plus the member portion would pass it"
            method: "under the internal appeal, the member portion is the ceiling less that responsibility"
          - when: "For the internal appeal, otherwise"
            method: "under the internal appeal, the member portion stands as figured"
        baseline:
          appeal_member_portion_held: "member_portion"
        evidence: [history]
        cross_difficulty: null
      - id: internal_appeal_interest_days
        effect: method
        decides: appeal_interest_days
        bindings: [filed_on, denied_on, adjudication_days, appeal_interest_days]
        ladder:
          - when: "For the internal appeal, the plan took more than twice its expected adjudication days between the claim's filing date and its denial date"
            method: "under the internal appeal, interest runs for every calendar day from the filing date to today"
          - when: "For the internal appeal, the plan took more than its expected adjudication days but not more than twice that"
            method: "under the internal appeal, interest runs for the calendar days from the filing date to today less the expected adjudication days"
          - when: "For the internal appeal, otherwise"
            method: "under the internal appeal, no interest runs"
        baseline:
          appeal_interest_days: "0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: internal_appeal_interest_rate
        effect: parameter
        decides: appeal_interest_rate_pct
        bindings: [claim_age_days, appeal_interest_rate_pct]
        ladder:
          - when: "For the internal appeal, the claim's age in calendar days from its filing date to today exceeds the aged claim days"
            value: "K('aged_claim_rate_pct')"
          - when: "For the internal appeal, the age exceeds the standing claim days but not the aged claim days"
            value: "K('standing_claim_rate_pct')"
          - when: "For the internal appeal, otherwise"
            value: "K('base_claim_rate_pct')"
        baseline:
          appeal_interest_rate_pct: "K('base_claim_rate_pct')"
        evidence: [history, date]
        cross_difficulty: null
      - id: internal_appeal_underpayment
        effect: method
        decides: appeal_underpayment_addition
        bindings: [gap_claim_ratio, gap_year_ratio, underpayment_gap_pts, appeal_underpayment_addition]
        ladder:
          - when: "For the internal appeal, the underpayment gap exceeds the variance tolerance"
            method: "under the internal appeal, the whole gap is applied to the claim's paid-line charges"
          - when: "For the internal appeal, the gap exceeds the variance floor but not the variance tolerance"
            method: "under the internal appeal, only the part of the gap above the variance floor is applied to the paid-line charges"
          - when: "For the internal appeal, otherwise"
            method: "under the internal appeal, nothing is added"
        baseline:
          appeal_underpayment_addition: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The internal appeal's claim is the claim carrying the most recent medical-necessity denial on the coverage. The internal
        appeal's disputed charges are the claim's medical-necessity, frequency and authorization denial amounts, plus its
        missing-information and patient-identification denial amounts while no corrected claim stands on that claim. The amount in dispute starts from the internal appeal's disputed charges taken at billed value, less the internal appeal's standard member share percent of them, and is rounded half up to the cent once, at the end.
      params: [standard_member_pct]
    inputs:
      history:
        - {table: claim_events, aggregate: sum, field: amount, filters: {event_type: coverage_claim_denied}}
        - {table: claim_events, aggregate: count, field: claim_event_id, filters: {event_type: coverage_claim_resubmitted, resubmission_reason: corrected_claim}}
        - {table: claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: coverage_claim_paid}}
        - {table: claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: coverage_contractual_adjustment}}
        - {table: claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: coverage_patient_responsibility_assigned}}
        - {table: claim_events, aggregate: latest, field: event_date, filters: {event_type: coverage_claim_submitted}}
      cross_category: []

  - id: coverage_ext_primary_information_correction
    base_policy_refs:
    - coverage_evt_corrected_claim
    - coverage_evt_denial_liability
    - coverage_evt_adjudication
    overwrite:
    - base_policy: coverage_evt_corrected_claim
      superseded_clause: A corrected or replacement claim answers one denial and carries that denial's amount
      replaced_by: A missing-information correction answers the claim's most recent missing-information denial and
        carries the denied amount being resubmitted, fixed below.
    trigger: state_due
    subject:
    - coverage_claim_resubmitted
    computes: rebill_amount
    target_tool: file_information_correction_a0c86b6b
    params:
      small_claim_amount: 250
      mid_claim_amount: 1000
      small_claim_invoice_min: 1
      mid_claim_invoice_min: 5
      standard_invoice_min: 10
      prompt_credit_days: 30
      seasoned_credit_days: 120
      prompt_credit_min: 2
      seasoned_credit_min: 5
      standard_credit_min: 25
    rule: 'This rule fixes the amount a corrected claim carries when the laboratory answers a missing-information
      denial (CO-16) on a claim held by a coverage. A missing-information correction answers the claim''s most recent
      missing-information denial and carries the denied amount being resubmitted, fixed below. The claim corrected
      is the claim carrying the most recent missing-information denial on the coverage, the order is the order that
      claim bills, and the order''s invoice is the patient invoice that bills that order. The amount the corrected
      claim carries is the denied amount being resubmitted: the missing-information denial''s amount less the part
      of the order''s later credits and invoice corrections that falls on it, as fixed below. Standard method: the
      missing-information correction resubmits the denial''s amount in full, rounded half up to the cent once, at
      the end. The missing-information correction''s share of the order''s reductions is the denial''s amount divided
      by all the denied amounts on the claim where the remittance paid at least one line of the claim; it is the denial''s
      amount divided by the amount the claim billed at filing where no line was paid but the plan adjudicated a line
      to the member or to a contractual adjustment; otherwise it is one. The order''s credits enter the missing-information
      correction only when the order''s most recent credit was posted after the claim''s filing date: where any credit
      on the order is for a test not performed or a duplicate test, every credit on the order comes off; where the
      order carries billing-correction credits only and their total reaches the missing-information correction''s
      credit minimum, the billing-correction credits come off; otherwise nothing comes off. The missing-information
      correction''s credit minimum follows the calendar days from the claim''s filing date to today: the prompt credit
      minimum where those days are at most the prompt credit days, the seasoned credit minimum where they exceed the
      prompt credit days but are at most the seasoned credit days, and the standard credit minimum otherwise. The
      billing-error corrections adjusted on the order''s invoice also come off once their total reaches the missing-information
      correction''s invoice minimum, and otherwise none of them does. The missing-information correction''s invoice
      minimum follows the amount the claim billed at filing: the small-claim invoice minimum where that amount is
      below the small claim amount, the mid-claim invoice minimum where it is at least the small claim amount but
      below the mid claim amount, and the standard invoice minimum otherwise. The credits and invoice corrections
      that come off are first added together, and that total is multiplied by the missing-information correction''s
      share before it is taken off the denial''s amount; the amount carried is never below zero, with no rounding
      before the final cent.'
    prerequisite: []
    cross_category:
    - category: orders
      as: history
      reads:
      - order_events.charge_amount
      - order_events.credit_reason
      - order_events.event_date
      - order_events.event_type
      note: The order's credits posted after filing decide what comes off the missing-information correction.
    - category: invoices
      as: history
      reads:
      - invoice_id
      - invoice_transactions.amount
      - invoice_transactions.event_type
      - invoice_transactions.adjustment_type
      note: Billing-error corrections (and, for a coverage paying second, the posted leftover) on the order's invoice
        decide what the missing-information correction carries.
    compute:
    - clm: LATEST('claim_events','claim_number', event_type='coverage_claim_denied', denial_code='CO-16')
    - ord: LATEST('claim_events','order_id', event_type='coverage_claim_denied', denial_code='CO-16')
    - denied: SUM('claim_events','amount', event_type='coverage_claim_denied', denial_code='CO-16', claim_number=clm)
    - claim_billed: SUM('claim_events','amount', event_type='coverage_claim_submitted', claim_number=clm)
    - filed_on: LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm)
    - order_invoice: CFIELD('invoices','invoice_id', order_id=ord)
    - invoice_corrections: XSUM('invoices','invoice_transactions','amount', invoice_id=order_invoice, event_type='invoices_adjustment_posted',
        adjustment_type='billing_error_correction')
    - info_invoice_minimum: K('small_claim_invoice_min') if SUM('claim_events','amount', event_type='coverage_claim_submitted',
        claim_number=clm) < K('small_claim_amount') else (K('mid_claim_invoice_min') if SUM('claim_events','amount',
        event_type='coverage_claim_submitted', claim_number=clm) < K('mid_claim_amount') else K('standard_invoice_min'))
    - invoice_reduction: invoice_corrections if (invoice_corrections > 0 and invoice_corrections >= info_invoice_minimum)
        else 0
    - claim_paid_lines: COUNT('claim_events', event_type='coverage_claim_paid', claim_number=clm)
    - claim_adjudicated_lines: COUNT('claim_events', event_type='coverage_contractual_adjustment', claim_number=clm)
        + COUNT('claim_events', event_type='coverage_patient_responsibility_assigned', claim_number=clm)
    - claim_denied_total: SUM('claim_events','amount', event_type='coverage_claim_denied', claim_number=clm)
    - info_share: (denied / claim_denied_total) if claim_paid_lines >= 1 else ((denied / claim_billed) if claim_adjudicated_lines
        >= 1 else 1)
    - credit_lines: XCOUNT('orders','order_events', order_id=ord, event_type='orders_test_charge_credited')
    - credits_after_filing: (DAYS(filed_on, XLATEST('orders','order_events','event_date', order_id=ord, event_type='orders_test_charge_credited'))
        > 0) if credit_lines >= 1 else False
    - full_test_credits: XSUM('orders','order_events','charge_amount', order_id=ord, event_type='orders_test_charge_credited',
        credit_reason='test_not_performed') + XSUM('orders','order_events','charge_amount', order_id=ord, event_type='orders_test_charge_credited',
        credit_reason='duplicate_test')
    - repricing_credits: XSUM('orders','order_events','charge_amount', order_id=ord, event_type='orders_test_charge_credited',
        credit_reason='billing_correction')
    - days_since_filing: DAYS(LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm),
        NOW)
    - info_credit_minimum: K('prompt_credit_min') if days_since_filing <= K('prompt_credit_days') else (K('seasoned_credit_min')
        if days_since_filing <= K('seasoned_credit_days') else K('standard_credit_min'))
    - info_credit_reduction: XSUM('orders','order_events','charge_amount', order_id=ord, event_type='orders_test_charge_credited')
        if (credits_after_filing and full_test_credits > 0) else (repricing_credits if (credits_after_filing and full_test_credits
        == 0 and repricing_credits >= info_credit_minimum) else 0)
    - result: RND(MX(0, denied - (info_credit_reduction + invoice_reduction) * info_share), 2)
    compute_basis:
      clm: The claim corrected is the claim carrying the most recent missing-information denial on the coverage, the
        order is the order that claim bills, and the order's invoice is the patient invoice that bills that order.
      ord: the order is the order that claim bills
      denied: the missing-information denial's amount
      claim_billed: the amount the claim billed at filing
      filed_on: only when the order's most recent credit was posted after the claim's filing date
      order_invoice: the order's invoice is the patient invoice that bills that order.
      invoice_corrections: billing-error corrections
      info_invoice_minimum: 'The missing-information correction''s invoice minimum follows the amount the claim billed
        at filing: the small-claim invoice minimum where that amount is below the small claim amount, the mid-claim
        invoice minimum where it is at least the small claim amount but below the mid claim amount, and the standard
        invoice minimum otherwise.'
      invoice_reduction: The billing-error corrections adjusted on the order's invoice also come off once their total
        reaches the missing-information correction's invoice minimum, and otherwise none of them does.
      claim_paid_lines: where the remittance paid at least one line of the claim
      claim_adjudicated_lines: where no line was paid but the plan adjudicated a line to the member or to a contractual
        adjustment
      claim_denied_total: the denial's amount divided by all the denied amounts on the claim
      info_share: The missing-information correction's share of the order's reductions is the denial's amount divided
        by all the denied amounts on the claim where the remittance paid at least one line of the claim; it is the
        denial's amount divided by the amount the claim billed at filing where no line was paid but the plan adjudicated
        a line to the member or to a contractual adjustment; otherwise it is one.
      credit_lines: 'The order''s credits enter the missing-information correction only when the order''s most recent
        credit was posted after the claim''s filing date: where any credit on the order is for a test not performed
        or a duplicate test, every credit on the order comes off; where the order carries billing-correction credits
        only and their total reaches the missing-information correction''s credit minimum, the billing-correction
        credits come off; otherwise nothing comes off.'
      credits_after_filing: only when the order's most recent credit was posted after the claim's filing date
      full_test_credits: for a test not performed or a duplicate test
      repricing_credits: billing-correction credits
      days_since_filing: follows the calendar days from the claim's filing date to today
      info_credit_minimum: 'The missing-information correction''s credit minimum follows the calendar days from the
        claim''s filing date to today: the prompt credit minimum where those days are at most the prompt credit days,
        the seasoned credit minimum where they exceed the prompt credit days but are at most the seasoned credit days,
        and the standard credit minimum otherwise.'
      info_credit_reduction: 'The order''s credits enter the missing-information correction only when the order''s
        most recent credit was posted after the claim''s filing date: where any credit on the order is for a test
        not performed or a duplicate test, every credit on the order comes off; where the order carries billing-correction
        credits only and their total reaches the missing-information correction''s credit minimum, the billing-correction
        credits come off; otherwise nothing comes off.'
      result: The credits and invoice corrections that come off are first added together, and that total is multiplied
        by the missing-information correction's share before it is taken off the denial's amount; the amount carried
        is never below zero, with no rounding before the final cent.
    factors:
    - id: info_apportionment
      effect: method
      decides: info_share
      bindings:
      - claim_paid_lines
      - claim_adjudicated_lines
      - claim_denied_total
      - info_share
      ladder:
      - when: For the missing-information correction, the remittance paid at least one line of the claim
        method: under the missing-information correction, the reductions are multiplied by the denial's amount divided
          by all the denied amounts on the claim
      - when: For the missing-information correction, no line was paid but the plan adjudicated a line to the member
          or to a contractual adjustment
        method: under the missing-information correction, the reductions are multiplied by the denial's amount divided
          by the amount the claim billed at filing
      - when: For the missing-information correction, otherwise
        method: under the missing-information correction, the reductions are taken in full
      baseline:
        info_share: '1'
      evidence:
      - history
      cross_difficulty: null
    - id: info_credits
      effect: method
      decides: info_credit_reduction
      bindings:
      - credit_lines
      - credits_after_filing
      - full_test_credits
      - repricing_credits
      - info_credit_reduction
      ladder:
      - when: For the missing-information correction, the order's most recent credit was posted after the claim's
          filing date and a credit on the order is for a test not performed or a duplicate test
        method: under the missing-information correction, every credit on the order comes off
      - when: For the missing-information correction, the order's most recent credit was posted after the claim's
          filing date, its credits are billing corrections only and they reach the credit minimum
        method: under the missing-information correction, the billing-correction credits come off
      - when: For the missing-information correction, otherwise
        method: under the missing-information correction, nothing comes off
      baseline:
        info_credit_reduction: '0'
      evidence:
      - cross_category
      - date
      cross_difficulty: orders
    - id: info_credit_minimum
      effect: parameter
      decides: info_credit_minimum
      bindings:
      - days_since_filing
      - info_credit_minimum
      ladder:
      - when: For the missing-information correction, the calendar days from the claim's filing date to today are
          at most the prompt credit days
        value: K('prompt_credit_min')
      - when: For the missing-information correction, those days exceed the prompt credit days but are at most the
          seasoned credit days
        value: K('seasoned_credit_min')
      - when: For the missing-information correction, otherwise
        value: K('standard_credit_min')
      baseline:
        info_credit_minimum: K('standard_credit_min')
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: info_invoice_minimum
      effect: parameter
      decides: info_invoice_minimum
      bindings:
      - info_invoice_minimum
      ladder:
      - when: For the missing-information correction, the amount the claim billed at filing is below the small claim
          amount
        value: K('small_claim_invoice_min')
      - when: For the missing-information correction, that amount is at least the small claim amount but below the
          mid claim amount
        value: K('mid_claim_invoice_min')
      - when: For the missing-information correction, otherwise
        value: K('standard_invoice_min')
      baseline:
        info_invoice_minimum: K('standard_invoice_min')
      evidence:
      - history
      cross_difficulty: null
    baseline:
      rule: 'The claim corrected is the claim carrying the most recent missing-information denial on the coverage,
        the order is the order that claim bills, and the order''s invoice is the patient invoice that bills that order.
        Standard method: the missing-information correction resubmits the denial''s amount in full, rounded half up
        to the cent once, at the end.'
      params: []
    inputs:
      history:
      - table: claim_events
        aggregate: sum
        field: amount
        filters:
          event_type: coverage_claim_denied
      - table: claim_events
        aggregate: count
        field: claim_event_id
        filters:
          event_type: coverage_claim_paid
      - category: orders
        table: order_events
        aggregate: sum
        field: charge_amount
        filters:
          event_type: orders_test_charge_credited
      - category: invoices
        table: invoice_transactions
        aggregate: sum
        field: amount
        filters:
          event_type: invoices_adjustment_posted
          adjustment_type: billing_error_correction
      cross_category:
      - orders
      - invoices

  - id: coverage_ext_secondary_member_appeal
    base_policy_refs: [coverage_evt_appeals, coverage_agg_coordination_of_benefits, coverage_evt_adjudication]
    overwrite:
      - base_policy: coverage_evt_appeals
        superseded_clause: "When appeal_requires_patient_authorization is true, the laboratory may file only after the patient has personally signed an authorized-representative form for that claim."
        replaced_by: "Where the payer class requires the patient's authorization for an appeal, a member appeal is lodged by the patient's own signature on the member appeal request, which names the laboratory as the patient's authorized representative for that claim."
    trigger: on_request
    subject: [coverage_appeal_filed]
    computes: amount_in_dispute
    target_tool: sign_member_appeal_c7144598
    params:
      oon_coinsurance_pct: 40
      oon_deductible_phase_pct: 70
      oon_deductible_satisfied: 500
      oon_standard_residual_pct: 55
      hardship_contest_pct: 50
      member_interest_rate_pct: 10
      late_far_days: 90
      late_near_days: 45
      late_far_pct: 85
      late_near_pct: 95
    rule: >-
      This rule fixes the amount in dispute recorded when a patient appeals the denials of an out-of-network plan that pays
      second for them. Where the payer class requires the patient's authorization for an appeal, a member appeal is lodged
      by the patient's own signature on the member appeal request, which names the laboratory as the patient's authorized
      representative for that claim. The second-plan member appeal's claim is the claim carrying the most recent medical-necessity denial on the coverage, and its order is the order that claim bills. The second-plan member appeal's contested charges are the
      medical-necessity, frequency and authorization denial amounts the plan issued on the coverage within the last six
      months, plus the missing-information and patient-identification denial amounts it issued within those six months
      while no corrected claim filed within those six months stands on the coverage. The second-plan member appeal's
      contested charges are fixed only after the coverage carries a corrected claim, filed within those six months,
      answering its patient-identification denial. The second-plan member appeal's amount is not recorded until the claim
      held by the plan paying first for the same order carries a first-level appeal. The amount in dispute starts from the second-plan member appeal's contested charges taken at billed value, less the out-of-network standard residual percent of them, and is rounded half up to the cent once, at the end. The second-plan member appeal's cap ratio is the out-of-network balance assigned to the member on the coverage
      within the last six months divided by that balance plus the contractual adjustments on the coverage within the same six months, where such a balance exists; it is the same ratio taken over the last twelve months where no such balance falls within six months but one falls within twelve months; otherwise it is one. The
      second-plan member appeal's filing benefit percent follows the calendar days from the order's collection date to the
      claim's filing date: the far late percent where those days exceed the far late days, the near late percent where they
      exceed the near late days but not the far late days, and one hundred otherwise. The second-plan member appeal's
      capped charges are its contested charges times its cap ratio times its filing benefit percent, divided by one
      hundred. The second-plan member appeal's residual share percent is the out-of-network coinsurance percent where the deductible amounts assigned on the coverage within the last twelve months reach the out-of-network deductible satisfied amount; it is the out-of-network deductible phase percent where some deductible was assigned within those twelve months but the amounts stay below that amount; otherwise it is the out-of-network standard residual percent. The member's residual is the capped charges times the residual share
      percent, divided by one hundred. The second-plan member appeal's assistance percent is the discount percent of the
      patient's approved financial-assistance award where that award's window, from its start date through its end date,
      covers the order's collection date and the award's tier carries a discount percent above zero; it is the hardship
      contest percent where such a covering award carries a discount percent of zero; otherwise it is zero. The member's
      net exposure is the capped charges less the member's residual, times one hundred less the assistance percent,
      divided by one hundred. The second-plan member appeal's interest days run as follows: where the plan took more than
      twice its expected adjudication days between the claim's filing date and its denial date, interest runs for every
      calendar day from the filing date to today; where it took more than its expected adjudication days but not more than
      twice that, interest runs for the calendar days from the filing date to today less the expected adjudication days;
      otherwise no interest runs. The member's interest is the net exposure times the member interest rate, divided by one
      hundred, times the interest days, divided by 365. The amount in dispute is the member's net exposure plus the
      member's interest, with no rounding before the final cent.
    prerequisite:
      - problem: coverage_ext_secondary_identification_correction
        kind: value_input
        gate: contested_charges
        form: state
        policy_source: >-
          The second-plan member appeal's contested charges are fixed only after the coverage carries a corrected claim,
          filed within those six months, answering its patient-identification denial.
        condition: >-
          The coverage carries a coverage_claim_resubmitted line with resubmission_reason corrected_claim dated within the
          last six months answering its CO-31 denial, so the curable denial amounts have left contested_charges.
        resolved_by: file_identification_correction_4ff16e31
        effect: >-
          Once that corrected claim stands, contested_charges keeps only the medical-necessity, frequency and authorization
          denial amounts of the last six months and drops the patient-identification denial amount.
      - problem: coverage_ext_primary_internal_appeal
        kind: state_gate
        gate: claim_events.appeal_level
        form: state
        policy_source: >-
          The second-plan member appeal's amount is not recorded until the claim held by the plan paying first for the same
          order carries a first-level appeal.
        condition: >-
          The primary coverage's claim for the same order carries a coverage_appeal_filed line with appeal_level
          first_level.
        resolved_by: file_internal_appeal_c10f15cc
        effect: >-
          Once the primary claim carries its first-level appeal, the gate on recording the member appeal to the plan paying
          second holds and the member appeal may be lodged.
    cross_category:
      - category: assistance
        as: branch
        reads: [status, variant_name, award_start_date, award_end_date]
        note: The patient's approved financial-assistance award covering the collection date decides the assistance percent taken off the member's exposure.
      - category: orders
        as: branch
        reads: [collection_date]
        note: The order's collection date anchors the filing-lag benefit percent and the test of whether the assistance award covers the service.
    compute:
      - clm: "LATEST('claim_events','claim_number', event_type='coverage_claim_denied', denial_code='CO-50')"
      - ord: "LATEST('claim_events','order_id', event_type='coverage_claim_denied', denial_code='CO-50')"
      - appealable_recent: "SUM('claim_events','amount', within_months=6, event_type='coverage_claim_denied', denial_code='CO-50') + SUM('claim_events','amount', within_months=6, event_type='coverage_claim_denied', denial_code='CO-151') + SUM('claim_events','amount', within_months=6, event_type='coverage_claim_denied', denial_code='CO-197')"
      - curable_recent: "SUM('claim_events','amount', within_months=6, event_type='coverage_claim_denied', denial_code='CO-16') + SUM('claim_events','amount', within_months=6, event_type='coverage_claim_denied', denial_code='CO-31')"
      - corrections_recent: "COUNT('claim_events', within_months=6, event_type='coverage_claim_resubmitted', resubmission_reason='corrected_claim')"
      - contested_charges: "appealable_recent + (curable_recent if corrections_recent == 0 else 0)"
      - balance_six: "SUM('claim_events','amount', within_months=6, event_type='coverage_patient_responsibility_assigned', responsibility_type='out_of_network_balance')"
      - writeoff_six: "SUM('claim_events','amount', within_months=6, event_type='coverage_contractual_adjustment')"
      - balance_twelve: "SUM('claim_events','amount', within_months=12, event_type='coverage_patient_responsibility_assigned', responsibility_type='out_of_network_balance')"
      - writeoff_twelve: "SUM('claim_events','amount', within_months=12, event_type='coverage_contractual_adjustment')"
      - second_plan_cap_ratio: "(balance_six / (balance_six + writeoff_six)) if balance_six > 0 else ((balance_twelve / (balance_twelve + writeoff_twelve)) if (balance_six == 0 and balance_twelve > 0) else 1)"
      - service_date: "CFIELD('orders','collection_date', order_id=ord)"
      - filing_lag_days: "DAYS(service_date, LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm))"
      - second_plan_filing_pct: "K('late_far_pct') if filing_lag_days > K('late_far_days') else (K('late_near_pct') if filing_lag_days > K('late_near_days') else 100)"
      - capped_charges: "contested_charges * second_plan_cap_ratio * second_plan_filing_pct / 100"
      - member_deductible_year: "SUM('claim_events','amount', within_months=12, event_type='coverage_patient_responsibility_assigned', responsibility_type='deductible')"
      - second_plan_residual_pct: "K('oon_coinsurance_pct') if member_deductible_year >= K('oon_deductible_satisfied') else (K('oon_deductible_phase_pct') if member_deductible_year > 0 else K('oon_standard_residual_pct'))"
      - member_residual: "capped_charges * second_plan_residual_pct / 100"
      - award_covers_service: "((DAYS(CFIELD('assistance','award_start_date', status='approved'), CFIELD('orders','collection_date', order_id=ord)) >= 0) and (DAYS(CFIELD('orders','collection_date', order_id=ord), CFIELD('assistance','award_end_date', status='approved')) >= 0)) if EXISTS('assistance', status='approved') else False"
      - second_plan_assistance_pct: "CPARAM('assistance','discount_pct', status='approved') if (award_covers_service and CPARAM('assistance','discount_pct', status='approved') > 0) else (K('hardship_contest_pct') if (award_covers_service and CPARAM('assistance','discount_pct', status='approved') == 0) else 0)"
      - net_exposure: "(capped_charges - member_residual) * (100 - second_plan_assistance_pct) / 100"
      - filed_on: "LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm)"
      - denied_on: "LATEST('claim_events','event_date', event_type='coverage_claim_denied', claim_number=clm)"
      - adjudication_days: "DAYS(filed_on, denied_on)"
      - second_plan_interest_days: "DAYS(filed_on, NOW) if adjudication_days > 2 * P('expected_adjudication_days') else ((DAYS(filed_on, NOW) - P('expected_adjudication_days')) if adjudication_days > P('expected_adjudication_days') else 0)"
      - member_interest: "net_exposure * K('member_interest_rate_pct') / 100 * second_plan_interest_days / 365"
      - result: "RND(net_exposure + member_interest, 2)"
    compute_basis:
      clm: "The second-plan member appeal's claim is the claim carrying the most recent medical-necessity denial on the coverage, and its order is the order that claim bills."
      ord: "The second-plan member appeal's claim is the claim carrying the most recent medical-necessity denial on the coverage, and its order is the order that claim bills."
      appealable_recent: "the medical-necessity, frequency and authorization denial amounts the plan issued on the coverage within the last six months"
      curable_recent: "plus the missing-information and patient-identification denial amounts it issued within those six months while no corrected claim filed within those six months stands on the coverage."
      corrections_recent: "while no corrected claim filed within those six months stands on the coverage."
      contested_charges: "The second-plan member appeal's contested charges are the medical-necessity, frequency and authorization denial amounts the plan issued on the coverage within the last six months, plus the missing-information and patient-identification denial amounts it issued within those six months while no corrected claim filed within those six months stands on the coverage."
      balance_six: "the out-of-network balance assigned to the member on the coverage within the last six months"
      writeoff_six: "divided by that balance plus the contractual adjustments on the coverage within the same six months"
      balance_twelve: "it is the same ratio taken over the last twelve months"
      writeoff_twelve: "it is the same ratio taken over the last twelve months"
      second_plan_cap_ratio: "The second-plan member appeal's cap ratio is the out-of-network balance assigned to the member on the coverage within the last six months divided by that balance plus the contractual adjustments on the coverage within the same six months, where such a balance exists; it is the same ratio taken over the last twelve months where no such balance falls within six months but one falls within twelve months; otherwise it is one."
      service_date: "the calendar days from the order's collection date to the claim's filing date"
      filing_lag_days: "the calendar days from the order's collection date to the claim's filing date"
      second_plan_filing_pct: "the far late percent where those days exceed the far late days, the near late percent where they exceed the near late days but not the far late days, and one hundred otherwise."
      capped_charges: "The second-plan member appeal's capped charges are its contested charges times its cap ratio times its filing benefit percent, divided by one hundred."
      member_deductible_year: "the deductible amounts assigned on the coverage within the last twelve months reach the out-of-network deductible satisfied amount"
      second_plan_residual_pct: "The second-plan member appeal's residual share percent is the out-of-network coinsurance percent where the deductible amounts assigned on the coverage within the last twelve months reach the out-of-network deductible satisfied amount; it is the out-of-network deductible phase percent where some deductible was assigned within those twelve months but the amounts stay below that amount; otherwise it is the out-of-network standard residual percent."
      member_residual: "The member's residual is the capped charges times the residual share percent, divided by one hundred."
      award_covers_service: "where that award's window, from its start date through its end date, covers the order's collection date"
      second_plan_assistance_pct: "The second-plan member appeal's assistance percent is the discount percent of the patient's approved financial-assistance award where that award's window, from its start date through its end date, covers the order's collection date and the award's tier carries a discount percent above zero; it is the hardship contest percent where such a covering award carries a discount percent of zero; otherwise it is zero."
      net_exposure: "The member's net exposure is the capped charges less the member's residual, times one hundred less the assistance percent, divided by one hundred."
      filed_on: "between the claim's filing date and its denial date"
      denied_on: "between the claim's filing date and its denial date"
      adjudication_days: "where the plan took more than twice its expected adjudication days between the claim's filing date and its denial date"
      second_plan_interest_days: "where the plan took more than twice its expected adjudication days between the claim's filing date and its denial date, interest runs for every calendar day from the filing date to today; where it took more than its expected adjudication days but not more than twice that, interest runs for the calendar days from the filing date to today less the expected adjudication days; otherwise no interest runs."
      member_interest: "The member's interest is the net exposure times the member interest rate, divided by one hundred, times the interest days, divided by 365."
      result: "The amount in dispute is the member's net exposure plus the member's interest, with no rounding before the final cent."
    factors:
      - id: second_plan_cap_ratio
        effect: method
        decides: second_plan_cap_ratio
        bindings: [balance_six, writeoff_six, balance_twelve, writeoff_twelve, second_plan_cap_ratio]
        ladder:
          - when: "For the second-plan member appeal, an out-of-network balance was assigned to the member on the coverage within the last six months"
            method: "under the second-plan member appeal, the contested charges are multiplied by the six-month balance share of balance plus contractual adjustments"
          - when: "For the second-plan member appeal, no such balance falls within six months but one falls within twelve months"
            method: "under the second-plan member appeal, the contested charges are multiplied by the same share taken over twelve months"
          - when: "For the second-plan member appeal, otherwise"
            method: "under the second-plan member appeal, the contested charges stay at billed value"
        baseline:
          second_plan_cap_ratio: "1"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: second_plan_filing_benefit
        effect: parameter
        decides: second_plan_filing_pct
        bindings: [service_date, filing_lag_days, second_plan_filing_pct]
        ladder:
          - when: "For the second-plan member appeal, the calendar days from the order's collection date to the claim's filing date exceed the far late days"
            value: "K('late_far_pct')"
          - when: "For the second-plan member appeal, those days exceed the near late days but not the far late days"
            value: "K('late_near_pct')"
          - when: "For the second-plan member appeal, otherwise"
            value: "100"
        baseline:
          second_plan_filing_pct: "100"
        evidence: [cross_category, date, history]
        cross_difficulty: orders
      - id: second_plan_residual_share
        effect: parameter
        decides: second_plan_residual_pct
        bindings: [member_deductible_year, second_plan_residual_pct]
        ladder:
          - when: "For the second-plan member appeal, the deductible amounts assigned on the coverage within the last twelve months reach the out-of-network deductible satisfied amount"
            value: "K('oon_coinsurance_pct')"
          - when: "For the second-plan member appeal, some deductible was assigned within those twelve months but the amounts stay below that amount"
            value: "K('oon_deductible_phase_pct')"
          - when: "For the second-plan member appeal, otherwise"
            value: "K('oon_standard_residual_pct')"
        baseline:
          second_plan_residual_pct: "K('oon_standard_residual_pct')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: second_plan_assistance
        effect: parameter
        decides: second_plan_assistance_pct
        bindings: [award_covers_service, second_plan_assistance_pct]
        ladder:
          - when: "For the second-plan member appeal, the patient's approved financial-assistance award window covers the order's collection date and the award's tier carries a discount percent above zero"
            value: "CPARAM('assistance','discount_pct', status='approved')"
          - when: "For the second-plan member appeal, such a covering award carries a discount percent of zero"
            value: "K('hardship_contest_pct')"
          - when: "For the second-plan member appeal, otherwise"
            value: "0"
        baseline:
          second_plan_assistance_pct: "0"
        evidence: [cross_category, date]
        cross_difficulty: assistance
      - id: second_plan_interest_days
        effect: method
        decides: second_plan_interest_days
        bindings: [filed_on, denied_on, adjudication_days, second_plan_interest_days]
        ladder:
          - when: "For the second-plan member appeal, the plan took more than twice its expected adjudication days between the claim's filing date and its denial date"
            method: "under the second-plan member appeal, interest runs for every calendar day from the filing date to today"
          - when: "For the second-plan member appeal, the plan took more than its expected adjudication days but not more than twice that"
            method: "under the second-plan member appeal, interest runs for the calendar days from the filing date to today less the expected adjudication days"
          - when: "For the second-plan member appeal, otherwise"
            method: "under the second-plan member appeal, no interest runs"
        baseline:
          second_plan_interest_days: "0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
    baseline:
      rule: >-
        The second-plan member appeal's claim is the claim carrying the most recent medical-necessity denial on the coverage, and its order is the order that claim bills. The second-plan member appeal's contested charges are the medical-necessity, frequency
        and authorization denial amounts the plan issued on the coverage within the last six months, plus the
        missing-information and patient-identification denial amounts it issued within those six months while no
        corrected claim filed within those six months stands on the coverage. The amount in dispute starts from the second-plan member appeal's contested charges taken at billed value, less the out-of-network standard residual percent of them, and is rounded half up to the cent once, at the end.
      params: [oon_standard_residual_pct]
    inputs:
      history:
        - {table: claim_events, aggregate: sum, field: amount, within_months: 6, filters: {event_type: coverage_claim_denied}}
        - {table: claim_events, aggregate: count, field: claim_event_id, within_months: 6, filters: {event_type: coverage_claim_resubmitted, resubmission_reason: corrected_claim}}
        - {table: claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: coverage_patient_responsibility_assigned}}
        - {table: claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: coverage_contractual_adjustment}}
      cross_category: [assistance, orders]

  - id: coverage_ext_secondary_identification_correction
    base_policy_refs:
    - coverage_evt_corrected_claim
    - coverage_agg_coordination_of_benefits
    - coverage_evt_denial_liability
    overwrite:
    - base_policy: coverage_evt_corrected_claim
      superseded_clause: A corrected or replacement claim answers one denial and carries that denial's amount
      replaced_by: An identification correction answers the claim's most recent patient-identification denial and
        carries the denied amount being resubmitted, fixed below.
    trigger: state_due
    subject:
    - coverage_claim_resubmitted
    computes: rebill_amount
    target_tool: file_identification_correction_4ff16e31
    params:
      small_claim_amount: 100
      mid_claim_amount: 500
      small_claim_invoice_min: 1
      mid_claim_invoice_min: 5
      standard_invoice_min: 10
      prompt_credit_days: 30
      seasoned_credit_days: 120
      prompt_credit_min: 2
      seasoned_credit_min: 5
      standard_credit_min: 25
    rule: 'This rule fixes the amount a corrected claim carries when the laboratory answers a patient-identification
      denial (CO-31) on a claim held by a coverage. An identification correction answers the claim''s most recent
      patient-identification denial and carries the denied amount being resubmitted, fixed below. The claim corrected
      is the claim carrying the most recent patient-identification denial on the coverage, the order is the order
      that claim bills, and the order''s invoice is the patient invoice that bills that order. The amount the corrected
      claim carries is the denied amount being resubmitted: the patient-identification denial''s amount less the part
      of the order''s later credits and invoice corrections that falls on it, as fixed below. Standard method: the
      identification correction resubmits the denial''s amount in full, rounded half up to the cent once, at the end.
      The identification correction''s base is the leftover the plan paying first posted to the order''s invoice:
      where the coverage pays second, the order''s invoice carries responsibility posted, and the billing-error corrections
      adjusted on that invoice reach the identification correction''s invoice minimum, the base is that posted responsibility
      less those billing-error corrections; where the coverage pays second, the invoice carries responsibility posted,
      and its billing-error corrections stay below the invoice minimum, the base is the posted responsibility as it
      stands; otherwise the base is the denial''s amount. The identification correction''s base never exceeds the
      denial''s amount. The order''s credits enter the identification correction only when the order''s most recent
      credit was posted after the claim''s filing date: where any credit on the order is for a test not performed
      or a duplicate test, every credit on the order comes off; where the order carries billing-correction credits
      only and their total reaches the identification correction''s credit minimum, the billing-correction credits
      come off; otherwise nothing comes off. The identification correction''s credit minimum follows the calendar
      days from the claim''s filing date to today: the prompt credit minimum where those days are at most the prompt
      credit days, the seasoned credit minimum where they exceed the prompt credit days but are at most the seasoned
      credit days, and the standard credit minimum otherwise. The identification correction''s invoice minimum follows
      the amount the claim billed at filing: the small-claim invoice minimum where that amount is below the small
      claim amount, the mid-claim invoice minimum where it is at least the small claim amount but below the mid claim
      amount, and the standard invoice minimum otherwise. The credits that come off are taken off the base; the amount
      carried is never below zero, with no rounding before the final cent.'
    prerequisite: []
    cross_category:
    - category: orders
      as: history
      reads:
      - order_events.charge_amount
      - order_events.credit_reason
      - order_events.event_date
      - order_events.event_type
      note: The order's credits posted after filing decide what comes off the identification correction.
    - category: invoices
      as: history
      reads:
      - invoice_id
      - invoice_transactions.amount
      - invoice_transactions.event_type
      - invoice_transactions.adjustment_type
      note: Billing-error corrections (and, for a coverage paying second, the posted leftover) on the order's invoice
        decide what the identification correction carries.
    compute:
    - clm: LATEST('claim_events','claim_number', event_type='coverage_claim_denied', denial_code='CO-31')
    - ord: LATEST('claim_events','order_id', event_type='coverage_claim_denied', denial_code='CO-31')
    - denied: SUM('claim_events','amount', event_type='coverage_claim_denied', denial_code='CO-31', claim_number=clm)
    - claim_billed: SUM('claim_events','amount', event_type='coverage_claim_submitted', claim_number=clm)
    - filed_on: LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm)
    - order_invoice: CFIELD('invoices','invoice_id', order_id=ord)
    - invoice_corrections: XSUM('invoices','invoice_transactions','amount', invoice_id=order_invoice, event_type='invoices_adjustment_posted',
        adjustment_type='billing_error_correction')
    - ident_invoice_minimum: K('small_claim_invoice_min') if SUM('claim_events','amount', event_type='coverage_claim_submitted',
        claim_number=clm) < K('small_claim_amount') else (K('mid_claim_invoice_min') if SUM('claim_events','amount',
        event_type='coverage_claim_submitted', claim_number=clm) < K('mid_claim_amount') else K('standard_invoice_min'))
    - posted_leftover: XSUM('invoices','invoice_transactions','amount', invoice_id=order_invoice, event_type='invoices_responsibility_posted')
    - ident_base: (posted_leftover - invoice_corrections) if (F('coordination_order') == 'secondary' and posted_leftover
        > 0 and invoice_corrections >= ident_invoice_minimum) else (posted_leftover if (F('coordination_order') ==
        'secondary' and posted_leftover > 0 and invoice_corrections < ident_invoice_minimum) else denied)
    - credit_lines: XCOUNT('orders','order_events', order_id=ord, event_type='orders_test_charge_credited')
    - credits_after_filing: (DAYS(filed_on, XLATEST('orders','order_events','event_date', order_id=ord, event_type='orders_test_charge_credited'))
        > 0) if credit_lines >= 1 else False
    - full_test_credits: XSUM('orders','order_events','charge_amount', order_id=ord, event_type='orders_test_charge_credited',
        credit_reason='test_not_performed') + XSUM('orders','order_events','charge_amount', order_id=ord, event_type='orders_test_charge_credited',
        credit_reason='duplicate_test')
    - repricing_credits: XSUM('orders','order_events','charge_amount', order_id=ord, event_type='orders_test_charge_credited',
        credit_reason='billing_correction')
    - days_since_filing: DAYS(LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm),
        NOW)
    - ident_credit_minimum: K('prompt_credit_min') if days_since_filing <= K('prompt_credit_days') else (K('seasoned_credit_min')
        if days_since_filing <= K('seasoned_credit_days') else K('standard_credit_min'))
    - ident_credit_reduction: XSUM('orders','order_events','charge_amount', order_id=ord, event_type='orders_test_charge_credited')
        if (credits_after_filing and full_test_credits > 0) else (repricing_credits if (credits_after_filing and full_test_credits
        == 0 and repricing_credits >= ident_credit_minimum) else 0)
    - result: RND(MX(0, MN(ident_base, denied) - ident_credit_reduction), 2)
    compute_basis:
      clm: The claim corrected is the claim carrying the most recent patient-identification denial on the coverage,
        the order is the order that claim bills, and the order's invoice is the patient invoice that bills that order.
      ord: the order is the order that claim bills
      denied: the patient-identification denial's amount
      claim_billed: the amount the claim billed at filing
      filed_on: only when the order's most recent credit was posted after the claim's filing date
      order_invoice: the order's invoice is the patient invoice that bills that order.
      invoice_corrections: billing-error corrections
      ident_invoice_minimum: 'The identification correction''s invoice minimum follows the amount the claim billed
        at filing: the small-claim invoice minimum where that amount is below the small claim amount, the mid-claim
        invoice minimum where it is at least the small claim amount but below the mid claim amount, and the standard
        invoice minimum otherwise.'
      posted_leftover: the order's invoice carries responsibility posted
      ident_base: 'The identification correction''s base is the leftover the plan paying first posted to the order''s
        invoice: where the coverage pays second, the order''s invoice carries responsibility posted, and the billing-error
        corrections adjusted on that invoice reach the identification correction''s invoice minimum, the base is that
        posted responsibility less those billing-error corrections; where the coverage pays second, the invoice carries
        responsibility posted, and its billing-error corrections stay below the invoice minimum, the base is the posted
        responsibility as it stands; otherwise the base is the denial''s amount.'
      credit_lines: 'The order''s credits enter the identification correction only when the order''s most recent credit
        was posted after the claim''s filing date: where any credit on the order is for a test not performed or a
        duplicate test, every credit on the order comes off; where the order carries billing-correction credits only
        and their total reaches the identification correction''s credit minimum, the billing-correction credits come
        off; otherwise nothing comes off.'
      credits_after_filing: only when the order's most recent credit was posted after the claim's filing date
      full_test_credits: for a test not performed or a duplicate test
      repricing_credits: billing-correction credits
      days_since_filing: follows the calendar days from the claim's filing date to today
      ident_credit_minimum: 'The identification correction''s credit minimum follows the calendar days from the claim''s
        filing date to today: the prompt credit minimum where those days are at most the prompt credit days, the seasoned
        credit minimum where they exceed the prompt credit days but are at most the seasoned credit days, and the
        standard credit minimum otherwise.'
      ident_credit_reduction: 'The order''s credits enter the identification correction only when the order''s most
        recent credit was posted after the claim''s filing date: where any credit on the order is for a test not performed
        or a duplicate test, every credit on the order comes off; where the order carries billing-correction credits
        only and their total reaches the identification correction''s credit minimum, the billing-correction credits
        come off; otherwise nothing comes off.'
      result: The credits that come off are taken off the base; the amount carried is never below zero, with no rounding
        before the final cent.
    factors:
    - id: ident_leftover_base
      effect: method
      decides: ident_base
      bindings:
      - posted_leftover
      - ident_base
      ladder:
      - when: For the identification correction, the coverage pays second, the order's invoice carries responsibility
          posted, and the billing-error corrections on that invoice reach the invoice minimum
        method: under the identification correction, the base is the posted responsibility less those billing-error
          corrections
      - when: For the identification correction, the coverage pays second, the invoice carries responsibility posted,
          and its billing-error corrections stay below the invoice minimum
        method: under the identification correction, the base is the posted responsibility as it stands
      - when: For the identification correction, otherwise
        method: under the identification correction, the base is the denial's amount
      baseline:
        ident_base: denied
      evidence:
      - cross_category
      cross_difficulty: invoices
    - id: ident_invoice_minimum
      effect: parameter
      decides: ident_invoice_minimum
      bindings:
      - ident_invoice_minimum
      ladder:
      - when: For the identification correction, the amount the claim billed at filing is below the small claim amount
        value: K('small_claim_invoice_min')
      - when: For the identification correction, that amount is at least the small claim amount but below the mid
          claim amount
        value: K('mid_claim_invoice_min')
      - when: For the identification correction, otherwise
        value: K('standard_invoice_min')
      baseline:
        ident_invoice_minimum: K('standard_invoice_min')
      evidence:
      - history
      cross_difficulty: null
    - id: ident_credits
      effect: method
      decides: ident_credit_reduction
      bindings:
      - credit_lines
      - credits_after_filing
      - full_test_credits
      - repricing_credits
      - ident_credit_reduction
      ladder:
      - when: For the identification correction, the order's most recent credit was posted after the claim's filing
          date and a credit on the order is for a test not performed or a duplicate test
        method: under the identification correction, every credit on the order comes off
      - when: For the identification correction, the order's most recent credit was posted after the claim's filing
          date, its credits are billing corrections only and they reach the credit minimum
        method: under the identification correction, the billing-correction credits come off
      - when: For the identification correction, otherwise
        method: under the identification correction, nothing comes off
      baseline:
        ident_credit_reduction: '0'
      evidence:
      - cross_category
      - date
      cross_difficulty: orders
    - id: ident_credit_minimum
      effect: parameter
      decides: ident_credit_minimum
      bindings:
      - days_since_filing
      - ident_credit_minimum
      ladder:
      - when: For the identification correction, the calendar days from the claim's filing date to today are at most
          the prompt credit days
        value: K('prompt_credit_min')
      - when: For the identification correction, those days exceed the prompt credit days but are at most the seasoned
          credit days
        value: K('seasoned_credit_min')
      - when: For the identification correction, otherwise
        value: K('standard_credit_min')
      baseline:
        ident_credit_minimum: K('standard_credit_min')
      evidence:
      - history
      - date
      cross_difficulty: null
    baseline:
      rule: 'The claim corrected is the claim carrying the most recent patient-identification denial on the coverage,
        the order is the order that claim bills, and the order''s invoice is the patient invoice that bills that order.
        Standard method: the identification correction resubmits the denial''s amount in full, rounded half up to
        the cent once, at the end.'
      params: []
    inputs:
      history:
      - table: claim_events
        aggregate: sum
        field: amount
        filters:
          event_type: coverage_claim_denied
      - table: claim_events
        aggregate: count
        field: claim_event_id
        filters:
          event_type: coverage_claim_paid
      - category: orders
        table: order_events
        aggregate: sum
        field: charge_amount
        filters:
          event_type: orders_test_charge_credited
      - category: invoices
        table: invoice_transactions
        aggregate: sum
        field: amount
        filters:
          event_type: invoices_adjustment_posted
          adjustment_type: billing_error_correction
      cross_category:
      - orders
      - invoices

  - id: coverage_ext_medicaid_plan_appeal
    base_policy_refs: [coverage_evt_appeals, coverage_agg_coordination_of_benefits, coverage_evt_adjudication]
    overwrite: []
    trigger: state_due
    subject: [coverage_appeal_filed]
    computes: amount_in_dispute
    target_tool: file_plan_appeal_d031f80e
    params:
      copay_cap_amount: 25
      standard_copay: 3
      crossover_far_days: 90
      crossover_near_days: 30
      crossover_far_pct: 85
      crossover_near_pct: 95
      plan_aged_days: 90
      plan_standing_days: 45
      plan_aged_rate_pct: 18
      plan_standing_rate_pct: 12
      plan_base_rate_pct: 6
      plan_variance_tolerance_pts: 5
      plan_variance_floor_pts: 2
    rule: >-
      This rule fixes the amount in dispute that the laboratory records when it files a plan appeal with a Medicaid
      managed care plan against a denial on a claim the plan holds for the patient. The plan appeal's claim is the claim carrying the most recent medical-necessity denial on the coverage. The plan appeal's disputed charges are the
      claim's medical-necessity and frequency denial amounts, plus its authorization denial amounts while no corrected
      claim stands on that claim. The plan appeal's disputed charges are not fixed until each authorization denial on the
      claim carries a corrected claim. The plan appeal's amount is recorded only after the claim held by the plan paying
      first for the same order carries a member appeal. The amount in dispute starts from the plan appeal's disputed
      charges taken at billed value less the plan's standard member copay, and is rounded half up to the cent once, at the
      end. A Medicaid allowed ratio is the plan's payment plus the member responsibility it assigned, divided by that
      payment plus the contractual adjustment plus that member responsibility; the claim's own ratio takes these amounts
      over the claim's lines and the coverage's twelve-month ratio takes them over every such line on the coverage within
      the last twelve months. The plan appeal's valuation ratio is the claim's own Medicaid allowed ratio where the plan paid at least one line of the claim; it is the coverage's twelve-month ratio where no line of the claim was paid but the coverage carries a plan payment within the last twelve months; otherwise it is one. The
      plan appeal's crossover percent follows the calendar days from the order's collection date to the date the claim
      reached the plan: the crossover far percent where those days exceed the crossover far days, the crossover near
      percent where they exceed the crossover near days but not the far days, and one hundred otherwise. The plan appeal's
      valued charges are its disputed charges times its valuation ratio times its crossover percent, divided by one
      hundred. The plan appeal's member copay is zero where the copays the plan assigned on the coverage within the last
      twelve months already total the copay cap amount; it is the most recent copay the plan assigned on the coverage where
      copays were assigned within the last twelve months but stay below the copay cap amount; otherwise it is the
      standard copay. The plan appeal's plan portion is its valued charges less its member copay. The plan appeal's
      interest days run as follows: where the plan took more than twice its expected adjudication days between the date
      the claim reached it and its denial date, interest runs for every calendar day from that date to today; where it
      took more than its expected adjudication days but not more than twice that, interest runs for the calendar days from
      that date to today less the expected adjudication days; otherwise no interest runs. The plan appeal's annual interest
      rate follows the age of the claim in calendar days from the date it reached the plan to today: the plan aged rate
      where the age exceeds the plan aged days, the plan standing rate where it exceeds the plan standing days but not the
      aged days, and the plan base rate otherwise. The plan appeal's interest is its plan portion, taken as zero where it is negative, times its annual interest rate, divided by one hundred, times its interest days, divided by 365. The plan appeal's underpayment gap, figured
      only where the claim has a paid line, is the coverage's twelve-month Medicaid allowed ratio less the claim's own
      ratio, in percentage points, and the claim's paid-line charges are the plan's payment plus the contractual
      adjustment plus the member responsibility on the claim. The plan appeal's underpayment addition is the whole gap
      applied to the paid-line charges where the gap exceeds the plan variance tolerance, the part of the gap above the
      plan variance floor applied to the paid-line charges where the gap exceeds the floor but not the tolerance, and
      nothing otherwise. The amount in dispute is the plan appeal's plan portion plus its interest plus its underpayment
      addition, never below zero, with no rounding before the final cent.
    prerequisite:
      - problem: coverage_ext_retro_authorization_correction
        kind: value_input
        gate: disputed_charges
        form: state
        policy_source: >-
          The plan appeal's disputed charges are not fixed until each authorization denial on the claim carries a
          corrected claim.
        condition: >-
          The appealed claim carries a coverage_claim_resubmitted line with resubmission_reason corrected_claim answering
          its CO-197 denial, so the authorization denial amount has left disputed_charges.
        resolved_by: file_authorization_correction_79145f91
        effect: >-
          Once the corrected claim stands on the claim, disputed_charges drops the authorization denial amount and keeps
          the medical-necessity and frequency denial amounts only.
      - problem: coverage_ext_primary_member_appeal
        kind: state_gate
        gate: claim_events.appeal_level
        form: state
        policy_source: >-
          The plan appeal's amount is recorded only after the claim held by the plan paying first for the same order
          carries a member appeal.
        condition: >-
          The claim held by the coverage paying first for the same order carries a coverage_appeal_filed line with
          appeal_level first_level lodged by the member.
        resolved_by: sign_primary_member_appeal_ad6f2953
        effect: >-
          Once the member appeal stands on the primary claim, the gate on recording the Medicaid plan appeal holds and the
          plan appeal may be filed.
    cross_category:
      - category: orders
        as: branch
        reads: [collection_date]
        note: The order's collection date anchors the crossover percent that the late arrival of the claim at the plan takes off.
    compute:
      - clm: "LATEST('claim_events','claim_number', event_type='coverage_claim_denied', denial_code='CO-50')"
      - ord: "LATEST('claim_events','order_id', event_type='coverage_claim_denied', denial_code='CO-50')"
      - appealable_denied: "SUM('claim_events','amount', event_type='coverage_claim_denied', denial_code='CO-50', claim_number=clm) + SUM('claim_events','amount', event_type='coverage_claim_denied', denial_code='CO-151', claim_number=clm)"
      - authorization_denied: "SUM('claim_events','amount', event_type='coverage_claim_denied', denial_code='CO-197', claim_number=clm)"
      - corrections_on_claim: "COUNT('claim_events', event_type='coverage_claim_resubmitted', resubmission_reason='corrected_claim', claim_number=clm)"
      - disputed_charges: "appealable_denied + (authorization_denied if corrections_on_claim == 0 else 0)"
      - claim_paid: "SUM('claim_events','amount', event_type='coverage_claim_paid', claim_number=clm)"
      - claim_adjusted: "SUM('claim_events','amount', event_type='coverage_contractual_adjustment', claim_number=clm)"
      - claim_member: "SUM('claim_events','amount', event_type='coverage_patient_responsibility_assigned', claim_number=clm)"
      - claim_paid_lines: "COUNT('claim_events', event_type='coverage_claim_paid', claim_number=clm)"
      - year_paid: "SUM('claim_events','amount', within_months=12, event_type='coverage_claim_paid')"
      - year_adjusted: "SUM('claim_events','amount', within_months=12, event_type='coverage_contractual_adjustment')"
      - year_member: "SUM('claim_events','amount', within_months=12, event_type='coverage_patient_responsibility_assigned')"
      - year_paid_lines: "COUNT('claim_events', within_months=12, event_type='coverage_claim_paid')"
      - plan_valuation_ratio: "((claim_paid + claim_member) / (claim_paid + claim_adjusted + claim_member)) if claim_paid_lines >= 1 else (((year_paid + year_member) / (year_paid + year_adjusted + year_member)) if (claim_paid_lines == 0 and year_paid_lines >= 1) else 1)"
      - service_date: "CFIELD('orders','collection_date', order_id=ord)"
      - arrival_lag_days: "DAYS(service_date, LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm))"
      - plan_crossover_pct: "K('crossover_far_pct') if arrival_lag_days > K('crossover_far_days') else (K('crossover_near_pct') if arrival_lag_days > K('crossover_near_days') else 100)"
      - valued_charges: "disputed_charges * plan_valuation_ratio * plan_crossover_pct / 100"
      - year_copays: "SUM('claim_events','amount', within_months=12, event_type='coverage_patient_responsibility_assigned', responsibility_type='copay')"
      - plan_member_copay: "0 if year_copays >= K('copay_cap_amount') else (LATEST('claim_events','amount', event_type='coverage_patient_responsibility_assigned', responsibility_type='copay') if year_copays > 0 else K('standard_copay'))"
      - plan_portion: "valued_charges - plan_member_copay"
      - reached_on: "LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm)"
      - denied_on: "LATEST('claim_events','event_date', event_type='coverage_claim_denied', claim_number=clm)"
      - adjudication_days: "DAYS(reached_on, denied_on)"
      - plan_interest_days: "DAYS(reached_on, NOW) if adjudication_days > 2 * P('expected_adjudication_days') else ((DAYS(reached_on, NOW) - P('expected_adjudication_days')) if adjudication_days > P('expected_adjudication_days') else 0)"
      - claim_age_days: "DAYS(LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm), NOW)"
      - plan_interest_rate_pct: "K('plan_aged_rate_pct') if claim_age_days > K('plan_aged_days') else (K('plan_standing_rate_pct') if claim_age_days > K('plan_standing_days') else K('plan_base_rate_pct'))"
      - interest: "MX(0, plan_portion) * plan_interest_rate_pct / 100 * plan_interest_days / 365"
      - gap_claim_ratio: "((SUM('claim_events','amount', event_type='coverage_claim_paid', claim_number=clm) + SUM('claim_events','amount', event_type='coverage_patient_responsibility_assigned', claim_number=clm)) / (SUM('claim_events','amount', event_type='coverage_claim_paid', claim_number=clm) + SUM('claim_events','amount', event_type='coverage_contractual_adjustment', claim_number=clm) + SUM('claim_events','amount', event_type='coverage_patient_responsibility_assigned', claim_number=clm))) if COUNT('claim_events', event_type='coverage_claim_paid', claim_number=clm) >= 1 else 0"
      - gap_year_ratio: "((SUM('claim_events','amount', within_months=12, event_type='coverage_claim_paid') + SUM('claim_events','amount', within_months=12, event_type='coverage_patient_responsibility_assigned')) / (SUM('claim_events','amount', within_months=12, event_type='coverage_claim_paid') + SUM('claim_events','amount', within_months=12, event_type='coverage_contractual_adjustment') + SUM('claim_events','amount', within_months=12, event_type='coverage_patient_responsibility_assigned'))) if COUNT('claim_events', within_months=12, event_type='coverage_claim_paid') >= 1 else 0"
      - underpayment_gap_pts: "((gap_year_ratio - gap_claim_ratio) * 100) if gap_claim_ratio > 0 else 0"
      - paid_line_charges: "claim_paid + claim_adjusted + claim_member"
      - plan_underpayment_addition: "(underpayment_gap_pts / 100 * paid_line_charges) if underpayment_gap_pts > K('plan_variance_tolerance_pts') else (((underpayment_gap_pts - K('plan_variance_floor_pts')) / 100 * paid_line_charges) if underpayment_gap_pts > K('plan_variance_floor_pts') else 0)"
      - result: "RND(MX(0, plan_portion + interest + plan_underpayment_addition), 2)"
    compute_basis:
      clm: "The plan appeal's claim is the claim carrying the most recent medical-necessity denial on the coverage."
      ord: "the order's collection date"
      appealable_denied: "The plan appeal's disputed charges are the claim's medical-necessity and frequency denial amounts, plus its authorization denial amounts while no corrected claim stands on that claim."
      authorization_denied: "plus its authorization denial amounts while no corrected claim stands on that claim."
      corrections_on_claim: "while no corrected claim stands on that claim."
      disputed_charges: "The plan appeal's disputed charges are the claim's medical-necessity and frequency denial amounts, plus its authorization denial amounts while no corrected claim stands on that claim."
      claim_paid: "the claim's own ratio takes these amounts over the claim's lines"
      claim_adjusted: "the claim's own ratio takes these amounts over the claim's lines"
      claim_member: "the claim's own ratio takes these amounts over the claim's lines"
      claim_paid_lines: "where the plan paid at least one line of the claim"
      year_paid: "the coverage's twelve-month ratio takes them over every such line on the coverage within the last twelve months."
      year_adjusted: "the coverage's twelve-month ratio takes them over every such line on the coverage within the last twelve months."
      year_member: "the coverage's twelve-month ratio takes them over every such line on the coverage within the last twelve months."
      year_paid_lines: "where no line of the claim was paid but the coverage carries a plan payment within the last twelve months"
      plan_valuation_ratio: "The plan appeal's valuation ratio is the claim's own Medicaid allowed ratio where the plan paid at least one line of the claim; it is the coverage's twelve-month ratio where no line of the claim was paid but the coverage carries a plan payment within the last twelve months; otherwise it is one."
      service_date: "the calendar days from the order's collection date to the date the claim reached the plan"
      arrival_lag_days: "the calendar days from the order's collection date to the date the claim reached the plan"
      plan_crossover_pct: "the crossover far percent where those days exceed the crossover far days, the crossover near percent where they exceed the crossover near days but not the far days, and one hundred otherwise."
      valued_charges: "The plan appeal's valued charges are its disputed charges times its valuation ratio times its crossover percent, divided by one hundred."
      year_copays: "the copays the plan assigned on the coverage within the last twelve months"
      plan_member_copay: "The plan appeal's member copay is zero where the copays the plan assigned on the coverage within the last twelve months already total the copay cap amount; it is the most recent copay the plan assigned on the coverage where copays were assigned within the last twelve months but stay below the copay cap amount; otherwise it is the standard copay."
      plan_portion: "The plan appeal's plan portion is its valued charges less its member copay."
      reached_on: "between the date the claim reached it and its denial date"
      denied_on: "between the date the claim reached it and its denial date"
      adjudication_days: "where the plan took more than twice its expected adjudication days between the date the claim reached it and its denial date"
      plan_interest_days: "where the plan took more than twice its expected adjudication days between the date the claim reached it and its denial date, interest runs for every calendar day from that date to today; where it took more than its expected adjudication days but not more than twice that, interest runs for the calendar days from that date to today less the expected adjudication days; otherwise no interest runs."
      claim_age_days: "the age of the claim in calendar days from the date it reached the plan to today"
      plan_interest_rate_pct: "the plan aged rate where the age exceeds the plan aged days, the plan standing rate where it exceeds the plan standing days but not the aged days, and the plan base rate otherwise."
      interest: "The plan appeal's interest is its plan portion, taken as zero where it is negative, times its annual interest rate, divided by one hundred, times its interest days, divided by 365."
      gap_claim_ratio: "The plan appeal's underpayment gap, figured only where the claim has a paid line, is the coverage's twelve-month Medicaid allowed ratio less the claim's own ratio, in percentage points"
      gap_year_ratio: "The plan appeal's underpayment gap, figured only where the claim has a paid line, is the coverage's twelve-month Medicaid allowed ratio less the claim's own ratio, in percentage points"
      underpayment_gap_pts: "The plan appeal's underpayment gap, figured only where the claim has a paid line, is the coverage's twelve-month Medicaid allowed ratio less the claim's own ratio, in percentage points"
      paid_line_charges: "the claim's paid-line charges are the plan's payment plus the contractual adjustment plus the member responsibility on the claim."
      plan_underpayment_addition: "The plan appeal's underpayment addition is the whole gap applied to the paid-line charges where the gap exceeds the plan variance tolerance, the part of the gap above the plan variance floor applied to the paid-line charges where the gap exceeds the floor but not the tolerance, and nothing otherwise."
      result: "The amount in dispute is the plan appeal's plan portion plus its interest plus its underpayment addition, never below zero, with no rounding before the final cent."
    factors:
      - id: plan_appeal_valuation
        effect: method
        decides: plan_valuation_ratio
        bindings: [claim_paid, claim_adjusted, claim_member, claim_paid_lines, year_paid, year_adjusted, year_member, year_paid_lines, plan_valuation_ratio]
        ladder:
          - when: "For the plan appeal, the plan paid at least one line of the claim"
            method: "under the plan appeal, the disputed charges are multiplied by the claim's own Medicaid allowed ratio"
          - when: "For the plan appeal, no line of the claim was paid but the coverage carries a plan payment within the last twelve months"
            method: "under the plan appeal, the disputed charges are multiplied by the coverage's twelve-month Medicaid allowed ratio"
          - when: "For the plan appeal, otherwise"
            method: "under the plan appeal, the disputed charges stay at billed value"
        baseline:
          plan_valuation_ratio: "1"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: plan_appeal_crossover_percent
        effect: parameter
        decides: plan_crossover_pct
        bindings: [service_date, arrival_lag_days, plan_crossover_pct]
        ladder:
          - when: "For the plan appeal, the calendar days from the order's collection date to the date the claim reached the plan exceed the crossover far days"
            value: "K('crossover_far_pct')"
          - when: "For the plan appeal, those days exceed the crossover near days but not the far days"
            value: "K('crossover_near_pct')"
          - when: "For the plan appeal, otherwise"
            value: "100"
        baseline:
          plan_crossover_pct: "100"
        evidence: [cross_category, date, history]
        cross_difficulty: orders
      - id: plan_appeal_member_copay
        effect: parameter
        decides: plan_member_copay
        bindings: [year_copays, plan_member_copay]
        ladder:
          - when: "For the plan appeal, the copays the plan assigned on the coverage within the last twelve months already total the copay cap amount"
            value: "0"
          - when: "For the plan appeal, copays were assigned within the last twelve months but stay below the copay cap amount"
            value: "the most recent copay the plan assigned on the coverage"
          - when: "For the plan appeal, otherwise"
            value: "K('standard_copay')"
        baseline:
          plan_member_copay: "K('standard_copay')"
        evidence: [history]
        cross_difficulty: null
      - id: plan_appeal_interest_days
        effect: method
        decides: plan_interest_days
        bindings: [reached_on, denied_on, adjudication_days, plan_interest_days]
        ladder:
          - when: "For the plan appeal, the plan took more than twice its expected adjudication days between the date the claim reached it and its denial date"
            method: "under the plan appeal, interest runs for every calendar day from that date to today"
          - when: "For the plan appeal, the plan took more than its expected adjudication days but not more than twice that"
            method: "under the plan appeal, interest runs for the calendar days from that date to today less the expected adjudication days"
          - when: "For the plan appeal, otherwise"
            method: "under the plan appeal, no interest runs"
        baseline:
          plan_interest_days: "0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: plan_appeal_interest_rate
        effect: parameter
        decides: plan_interest_rate_pct
        bindings: [claim_age_days, plan_interest_rate_pct]
        ladder:
          - when: "For the plan appeal, the claim's age in calendar days from the date it reached the plan to today exceeds the plan aged days"
            value: "K('plan_aged_rate_pct')"
          - when: "For the plan appeal, the age exceeds the plan standing days but not the aged days"
            value: "K('plan_standing_rate_pct')"
          - when: "For the plan appeal, otherwise"
            value: "K('plan_base_rate_pct')"
        baseline:
          plan_interest_rate_pct: "K('plan_base_rate_pct')"
        evidence: [history, date]
        cross_difficulty: null
      - id: plan_appeal_underpayment
        effect: method
        decides: plan_underpayment_addition
        bindings: [gap_claim_ratio, gap_year_ratio, underpayment_gap_pts, plan_underpayment_addition]
        ladder:
          - when: "For the plan appeal, the underpayment gap exceeds the plan variance tolerance"
            method: "under the plan appeal, the whole gap is applied to the claim's paid-line charges"
          - when: "For the plan appeal, the gap exceeds the plan variance floor but not the tolerance"
            method: "under the plan appeal, only the part of the gap above the plan variance floor is applied to the paid-line charges"
          - when: "For the plan appeal, otherwise"
            method: "under the plan appeal, nothing is added"
        baseline:
          plan_underpayment_addition: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The plan appeal's claim is the claim carrying the most recent medical-necessity denial on the coverage. The plan
        appeal's disputed charges are the claim's medical-necessity and frequency denial amounts, plus its authorization
        denial amounts while no corrected claim stands on that claim. The amount in dispute starts from the plan appeal's
        disputed charges taken at billed value less the plan's standard member copay, and is rounded half up to the cent
        once, at the end.
      params: [standard_copay]
    inputs:
      history:
        - {table: claim_events, aggregate: sum, field: amount, filters: {event_type: coverage_claim_denied}}
        - {table: claim_events, aggregate: count, field: claim_event_id, filters: {event_type: coverage_claim_resubmitted, resubmission_reason: corrected_claim}}
        - {table: claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: coverage_claim_paid}}
        - {table: claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: coverage_patient_responsibility_assigned, responsibility_type: copay}}
      cross_category: [orders]

  - id: coverage_ext_retro_authorization_correction
    base_policy_refs:
    - coverage_evt_corrected_claim
    - coverage_evt_denial_liability
    - coverage_evt_adjudication
    overwrite:
    - base_policy: coverage_evt_corrected_claim
      superseded_clause: A corrected or replacement claim answers one denial and carries that denial's amount
      replaced_by: An authorization correction answers the claim's most recent authorization denial with the order's
        approved authorization and carries the denied amount being resubmitted, fixed below.
    - base_policy: coverage_evt_denial_liability
      superseded_clause: for CO-197 a retroactive authorization requested by the provider within prior_auth_retro_request_days
        of the date of service is filed as a corrected claim instead
      replaced_by: An authorization denial is cured by an authorization correction where the order carries an approved
        authorization with its authorization number, the plan having accepted the provider's retroactive request.
    trigger: state_due
    subject:
    - coverage_claim_resubmitted
    computes: rebill_amount
    target_tool: file_authorization_correction_79145f91
    params:
      small_claim_amount: 250
      mid_claim_amount: 1000
      small_claim_invoice_min: 1
      mid_claim_invoice_min: 5
      standard_invoice_min: 10
      prompt_credit_days: 30
      seasoned_credit_days: 120
      prompt_credit_min: 1
      seasoned_credit_min: 3
      standard_credit_min: 25
    rule: 'This rule fixes the amount a corrected claim carries when the laboratory answers an authorization denial
      (CO-197) on a claim held by a coverage. An authorization denial is cured by an authorization correction where
      the order carries an approved authorization with its authorization number, the plan having accepted the provider''s
      retroactive request. An authorization correction answers the claim''s most recent authorization denial with
      the order''s approved authorization and carries the denied amount being resubmitted, fixed below. The claim
      corrected is the claim carrying the most recent authorization denial on the coverage, the order is the order
      that claim bills, and the order''s invoice is the patient invoice that bills that order. The amount the corrected
      claim carries is the denied amount being resubmitted: the authorization denial''s amount less the part of the
      order''s later credits and invoice corrections that falls on it, as fixed below. Standard method: the authorization
      correction resubmits the denial''s amount in full, rounded half up to the cent once, at the end. The authorization
      correction''s share of the order''s reductions is the denial''s amount divided by all the denied amounts on
      the claim where the remittance paid at least one line of the claim; it is the denial''s amount divided by the
      amount the claim billed at filing where no line was paid but the plan adjudicated a line to the member or to
      a contractual adjustment; otherwise it is one. The order''s credits enter the authorization correction only
      when the order''s most recent credit was posted after the claim''s filing date: where any credit on the order
      is for a test not performed or a duplicate test, every credit on the order comes off; where the order carries
      billing-correction credits only and their total reaches the authorization correction''s credit minimum, the
      billing-correction credits come off; otherwise nothing comes off. The authorization correction''s credit minimum
      follows the calendar days from the claim''s filing date to today: the prompt credit minimum where those days
      are at most the prompt credit days, the seasoned credit minimum where they exceed the prompt credit days but
      are at most the seasoned credit days, and the standard credit minimum otherwise. The billing-error corrections
      adjusted on the order''s invoice also come off once their total reaches the authorization correction''s invoice
      minimum, and otherwise none of them does. The authorization correction''s invoice minimum follows the amount
      the claim billed at filing: the small-claim invoice minimum where that amount is below the small claim amount,
      the mid-claim invoice minimum where it is at least the small claim amount but below the mid claim amount, and
      the standard invoice minimum otherwise. The credits and invoice corrections that come off are first added together,
      and that total is multiplied by the authorization correction''s share before it is taken off the denial''s amount;
      the amount carried is never below zero, with no rounding before the final cent.'
    prerequisite: []
    cross_category:
    - category: orders
      as: history
      reads:
      - order_events.charge_amount
      - order_events.credit_reason
      - order_events.event_date
      - order_events.event_type
      note: The order's credits posted after filing decide what comes off the authorization correction.
    - category: invoices
      as: history
      reads:
      - invoice_id
      - invoice_transactions.amount
      - invoice_transactions.event_type
      - invoice_transactions.adjustment_type
      note: Billing-error corrections (and, for a coverage paying second, the posted leftover) on the order's invoice
        decide what the authorization correction carries.
    compute:
    - clm: LATEST('claim_events','claim_number', event_type='coverage_claim_denied', denial_code='CO-197')
    - ord: LATEST('claim_events','order_id', event_type='coverage_claim_denied', denial_code='CO-197')
    - denied: SUM('claim_events','amount', event_type='coverage_claim_denied', denial_code='CO-197', claim_number=clm)
    - claim_billed: SUM('claim_events','amount', event_type='coverage_claim_submitted', claim_number=clm)
    - filed_on: LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm)
    - order_invoice: CFIELD('invoices','invoice_id', order_id=ord)
    - invoice_corrections: XSUM('invoices','invoice_transactions','amount', invoice_id=order_invoice, event_type='invoices_adjustment_posted',
        adjustment_type='billing_error_correction')
    - auth_invoice_minimum: K('small_claim_invoice_min') if SUM('claim_events','amount', event_type='coverage_claim_submitted',
        claim_number=clm) < K('small_claim_amount') else (K('mid_claim_invoice_min') if SUM('claim_events','amount',
        event_type='coverage_claim_submitted', claim_number=clm) < K('mid_claim_amount') else K('standard_invoice_min'))
    - invoice_reduction: invoice_corrections if (invoice_corrections > 0 and invoice_corrections >= auth_invoice_minimum)
        else 0
    - claim_paid_lines: COUNT('claim_events', event_type='coverage_claim_paid', claim_number=clm)
    - claim_adjudicated_lines: COUNT('claim_events', event_type='coverage_contractual_adjustment', claim_number=clm)
        + COUNT('claim_events', event_type='coverage_patient_responsibility_assigned', claim_number=clm)
    - claim_denied_total: SUM('claim_events','amount', event_type='coverage_claim_denied', claim_number=clm)
    - auth_share: (denied / claim_denied_total) if claim_paid_lines >= 1 else ((denied / claim_billed) if claim_adjudicated_lines
        >= 1 else 1)
    - credit_lines: XCOUNT('orders','order_events', order_id=ord, event_type='orders_test_charge_credited')
    - credits_after_filing: (DAYS(filed_on, XLATEST('orders','order_events','event_date', order_id=ord, event_type='orders_test_charge_credited'))
        > 0) if credit_lines >= 1 else False
    - full_test_credits: XSUM('orders','order_events','charge_amount', order_id=ord, event_type='orders_test_charge_credited',
        credit_reason='test_not_performed') + XSUM('orders','order_events','charge_amount', order_id=ord, event_type='orders_test_charge_credited',
        credit_reason='duplicate_test')
    - repricing_credits: XSUM('orders','order_events','charge_amount', order_id=ord, event_type='orders_test_charge_credited',
        credit_reason='billing_correction')
    - days_since_filing: DAYS(LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm),
        NOW)
    - auth_credit_minimum: K('prompt_credit_min') if days_since_filing <= K('prompt_credit_days') else (K('seasoned_credit_min')
        if days_since_filing <= K('seasoned_credit_days') else K('standard_credit_min'))
    - auth_credit_reduction: XSUM('orders','order_events','charge_amount', order_id=ord, event_type='orders_test_charge_credited')
        if (credits_after_filing and full_test_credits > 0) else (repricing_credits if (credits_after_filing and full_test_credits
        == 0 and repricing_credits >= auth_credit_minimum) else 0)
    - result: RND(MX(0, denied - (auth_credit_reduction + invoice_reduction) * auth_share), 2)
    compute_basis:
      clm: The claim corrected is the claim carrying the most recent authorization denial on the coverage, the order
        is the order that claim bills, and the order's invoice is the patient invoice that bills that order.
      ord: the order is the order that claim bills
      denied: the authorization denial's amount
      claim_billed: the amount the claim billed at filing
      filed_on: only when the order's most recent credit was posted after the claim's filing date
      order_invoice: the order's invoice is the patient invoice that bills that order.
      invoice_corrections: billing-error corrections
      auth_invoice_minimum: 'The authorization correction''s invoice minimum follows the amount the claim billed at
        filing: the small-claim invoice minimum where that amount is below the small claim amount, the mid-claim invoice
        minimum where it is at least the small claim amount but below the mid claim amount, and the standard invoice
        minimum otherwise.'
      invoice_reduction: The billing-error corrections adjusted on the order's invoice also come off once their total
        reaches the authorization correction's invoice minimum, and otherwise none of them does.
      claim_paid_lines: where the remittance paid at least one line of the claim
      claim_adjudicated_lines: where no line was paid but the plan adjudicated a line to the member or to a contractual
        adjustment
      claim_denied_total: the denial's amount divided by all the denied amounts on the claim
      auth_share: The authorization correction's share of the order's reductions is the denial's amount divided by
        all the denied amounts on the claim where the remittance paid at least one line of the claim; it is the denial's
        amount divided by the amount the claim billed at filing where no line was paid but the plan adjudicated a
        line to the member or to a contractual adjustment; otherwise it is one.
      credit_lines: 'The order''s credits enter the authorization correction only when the order''s most recent credit
        was posted after the claim''s filing date: where any credit on the order is for a test not performed or a
        duplicate test, every credit on the order comes off; where the order carries billing-correction credits only
        and their total reaches the authorization correction''s credit minimum, the billing-correction credits come
        off; otherwise nothing comes off.'
      credits_after_filing: only when the order's most recent credit was posted after the claim's filing date
      full_test_credits: for a test not performed or a duplicate test
      repricing_credits: billing-correction credits
      days_since_filing: follows the calendar days from the claim's filing date to today
      auth_credit_minimum: 'The authorization correction''s credit minimum follows the calendar days from the claim''s
        filing date to today: the prompt credit minimum where those days are at most the prompt credit days, the seasoned
        credit minimum where they exceed the prompt credit days but are at most the seasoned credit days, and the
        standard credit minimum otherwise.'
      auth_credit_reduction: 'The order''s credits enter the authorization correction only when the order''s most
        recent credit was posted after the claim''s filing date: where any credit on the order is for a test not performed
        or a duplicate test, every credit on the order comes off; where the order carries billing-correction credits
        only and their total reaches the authorization correction''s credit minimum, the billing-correction credits
        come off; otherwise nothing comes off.'
      result: The credits and invoice corrections that come off are first added together, and that total is multiplied
        by the authorization correction's share before it is taken off the denial's amount; the amount carried is
        never below zero, with no rounding before the final cent.
    factors:
    - id: auth_apportionment
      effect: method
      decides: auth_share
      bindings:
      - claim_paid_lines
      - claim_adjudicated_lines
      - claim_denied_total
      - auth_share
      ladder:
      - when: For the authorization correction, the remittance paid at least one line of the claim
        method: under the authorization correction, the reductions are multiplied by the denial's amount divided by
          all the denied amounts on the claim
      - when: For the authorization correction, no line was paid but the plan adjudicated a line to the member or
          to a contractual adjustment
        method: under the authorization correction, the reductions are multiplied by the denial's amount divided by
          the amount the claim billed at filing
      - when: For the authorization correction, otherwise
        method: under the authorization correction, the reductions are taken in full
      baseline:
        auth_share: '1'
      evidence:
      - history
      cross_difficulty: null
    - id: auth_credits
      effect: method
      decides: auth_credit_reduction
      bindings:
      - credit_lines
      - credits_after_filing
      - full_test_credits
      - repricing_credits
      - auth_credit_reduction
      ladder:
      - when: For the authorization correction, the order's most recent credit was posted after the claim's filing
          date and a credit on the order is for a test not performed or a duplicate test
        method: under the authorization correction, every credit on the order comes off
      - when: For the authorization correction, the order's most recent credit was posted after the claim's filing
          date, its credits are billing corrections only and they reach the credit minimum
        method: under the authorization correction, the billing-correction credits come off
      - when: For the authorization correction, otherwise
        method: under the authorization correction, nothing comes off
      baseline:
        auth_credit_reduction: '0'
      evidence:
      - cross_category
      - date
      cross_difficulty: orders
    - id: auth_credit_minimum
      effect: parameter
      decides: auth_credit_minimum
      bindings:
      - days_since_filing
      - auth_credit_minimum
      ladder:
      - when: For the authorization correction, the calendar days from the claim's filing date to today are at most
          the prompt credit days
        value: K('prompt_credit_min')
      - when: For the authorization correction, those days exceed the prompt credit days but are at most the seasoned
          credit days
        value: K('seasoned_credit_min')
      - when: For the authorization correction, otherwise
        value: K('standard_credit_min')
      baseline:
        auth_credit_minimum: K('standard_credit_min')
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: auth_invoice_minimum
      effect: parameter
      decides: auth_invoice_minimum
      bindings:
      - auth_invoice_minimum
      ladder:
      - when: For the authorization correction, the amount the claim billed at filing is below the small claim amount
        value: K('small_claim_invoice_min')
      - when: For the authorization correction, that amount is at least the small claim amount but below the mid claim
          amount
        value: K('mid_claim_invoice_min')
      - when: For the authorization correction, otherwise
        value: K('standard_invoice_min')
      baseline:
        auth_invoice_minimum: K('standard_invoice_min')
      evidence:
      - history
      cross_difficulty: null
    baseline:
      rule: 'The claim corrected is the claim carrying the most recent authorization denial on the coverage, the order
        is the order that claim bills, and the order''s invoice is the patient invoice that bills that order. Standard
        method: the authorization correction resubmits the denial''s amount in full, rounded half up to the cent once,
        at the end.'
      params: []
    inputs:
      history:
      - table: claim_events
        aggregate: sum
        field: amount
        filters:
          event_type: coverage_claim_denied
      - table: claim_events
        aggregate: count
        field: claim_event_id
        filters:
          event_type: coverage_claim_paid
      - category: orders
        table: order_events
        aggregate: sum
        field: charge_amount
        filters:
          event_type: orders_test_charge_credited
      - category: invoices
        table: invoice_transactions
        aggregate: sum
        field: amount
        filters:
          event_type: invoices_adjustment_posted
          adjustment_type: billing_error_correction
      cross_category:
      - orders
      - invoices

  - id: coverage_ext_primary_member_appeal
    base_policy_refs: [coverage_evt_appeals, coverage_agg_coordination_of_benefits, coverage_evt_adjudication]
    overwrite:
      - base_policy: coverage_evt_appeals
        superseded_clause: "When appeal_requires_patient_authorization is true, the laboratory may file only after the patient has personally signed an authorized-representative form for that claim."
        replaced_by: "With a payer class that requires the patient's authorization for an appeal, the patient lodges the member appeal by signing the member appeal request personally, and that request names the laboratory as the patient's authorized representative for the claim."
    trigger: on_request
    subject: [coverage_appeal_filed]
    computes: amount_in_dispute
    target_tool: sign_primary_member_appeal_ad6f2953
    params:
      first_plan_coinsurance_pct: 40
      first_plan_deductible_phase_pct: 70
      first_plan_deductible_satisfied: 80
      first_plan_standard_leftover_pct: 55
      first_plan_hardship_pct: 50
      first_plan_late_far_days: 90
      first_plan_late_near_days: 45
      first_plan_late_far_pct: 85
      first_plan_late_near_pct: 95
      first_plan_aged_days: 90
      first_plan_standing_days: 45
      first_plan_aged_rate_pct: 15
      first_plan_standing_rate_pct: 10
      first_plan_base_rate_pct: 6
    rule: >-
      This rule fixes the amount in dispute recorded when a patient appeals the denials of an out-of-network plan that pays
      first for them. With a payer class that requires the patient's authorization for an appeal, the patient lodges the
      member appeal by signing the member appeal request personally, and that request names the laboratory as the
      patient's authorized representative for the claim. The first-plan member appeal's claim is the claim carrying the most recent medical-necessity denial on the coverage, and its order is the order that claim bills. The first-plan member
      appeal's contested charges are the medical-necessity, frequency and authorization denial amounts the plan issued on
      the coverage within the last six months, plus the missing-information, other-coverage, coverage-ended and
      patient-identification denial amounts it issued within those six months while no corrected or coordination claim
      filed within those six months stands on the coverage. The first-plan member appeal's contested charges are not fixed
      until the coverage carries a coordination claim, filed within those six months, answering its other-coverage denial.
      The amount in dispute starts from the first-plan member appeal's contested charges taken at billed value, less the first-plan standard leftover percent of them, and is rounded half up to the cent once, at the end. The first-plan member appeal's balance share is the out-of-network
      balance assigned to the member on the coverage within the last six months divided by that balance plus the
      contractual adjustments on the coverage within the same six months, where such a balance exists; it is the same share taken over the last twelve months where no such balance falls within six months but one falls within twelve months; otherwise it is one. The first-plan member appeal's late-claim percent follows the calendar days
      from the order's collection date to the claim's filing date: the first-plan far late percent where those days
      exceed the first-plan far late days, the first-plan near late percent where they exceed the first-plan near late
      days but not the far late days, and one hundred otherwise. The first-plan member appeal's exposed charges are its
      contested charges times its balance share times its late-claim percent, divided by one hundred. The first-plan member appeal's leftover percent is the first-plan coinsurance percent where the deductible amounts assigned on the coverage within the last twelve months reach the first-plan deductible satisfied amount; it is the first-plan deductible phase percent where some deductible was assigned within those twelve months but the amounts stay below that amount; otherwise it is the first-plan standard leftover percent. The
      member's leftover is the exposed charges times the leftover percent, divided by one hundred. The first-plan member
      appeal's relief percent is the discount percent of the patient's approved financial-assistance award where that
      award's window, from its start date through its end date, covers the order's collection date and the award's tier
      carries a discount percent above zero; it is the first-plan hardship percent where such a covering award carries a
      discount percent of zero; otherwise it is zero. The member's contested exposure is the exposed charges less the
      member's leftover, times one hundred less the relief percent, divided by one hundred. The first-plan member appeal's
      interest days run as follows: where the plan took more than twice its expected adjudication days between the
      claim's filing date and its denial date, interest runs for every calendar day from the filing date to today; where
      it took more than its expected adjudication days but not more than twice that, interest runs for the calendar days
      from the filing date to today less the expected adjudication days; otherwise no interest runs. The first-plan member
      appeal's annual interest rate follows the age of the claim in calendar days from its filing date to today: the
      first-plan aged rate where the age exceeds the first-plan aged days, the first-plan standing rate where it exceeds
      the first-plan standing days but not the aged days, and the first-plan base rate otherwise. The member's interest is
      the contested exposure times the annual interest rate, divided by one hundred, times the interest days, divided by
      365. The amount in dispute is the member's contested exposure plus the member's interest, with no rounding before the
      final cent.
    prerequisite:
      - problem: coverage_ext_coordination_correction
        kind: value_input
        gate: contested_charges
        form: state
        policy_source: >-
          The first-plan member appeal's contested charges are not fixed until the coverage carries a coordination claim,
          filed within those six months, answering its other-coverage denial.
        condition: >-
          The coverage carries a coverage_claim_resubmitted line with resubmission_reason coordination_of_benefits_update
          dated within the last six months answering its CO-22 denial, so the curable denial amounts have left
          contested_charges.
        resolved_by: file_coordination_correction_d59a8135
        effect: >-
          Once that coordination claim stands, contested_charges keeps only the medical-necessity, frequency and
          authorization denial amounts of the last six months and drops the other-coverage denial amount.
    cross_category:
      - category: assistance
        as: branch
        reads: [status, variant_name, award_start_date, award_end_date]
        note: The patient's approved financial-assistance award covering the collection date decides the relief percent taken off the member's exposure.
      - category: orders
        as: branch
        reads: [collection_date]
        note: The order's collection date anchors the late-claim percent and the test of whether the assistance award covers the service.
    compute:
      - clm: "LATEST('claim_events','claim_number', event_type='coverage_claim_denied', denial_code='CO-50')"
      - ord: "LATEST('claim_events','order_id', event_type='coverage_claim_denied', denial_code='CO-50')"
      - appealable_recent: "SUM('claim_events','amount', within_months=6, event_type='coverage_claim_denied', denial_code='CO-50') + SUM('claim_events','amount', within_months=6, event_type='coverage_claim_denied', denial_code='CO-151') + SUM('claim_events','amount', within_months=6, event_type='coverage_claim_denied', denial_code='CO-197')"
      - curable_recent: "SUM('claim_events','amount', within_months=6, event_type='coverage_claim_denied', denial_code='CO-16') + SUM('claim_events','amount', within_months=6, event_type='coverage_claim_denied', denial_code='CO-22') + SUM('claim_events','amount', within_months=6, event_type='coverage_claim_denied', denial_code='CO-27') + SUM('claim_events','amount', within_months=6, event_type='coverage_claim_denied', denial_code='CO-31')"
      - cures_recent: "COUNT('claim_events', within_months=6, event_type='coverage_claim_resubmitted', resubmission_reason='corrected_claim') + COUNT('claim_events', within_months=6, event_type='coverage_claim_resubmitted', resubmission_reason='coordination_of_benefits_update')"
      - contested_charges: "appealable_recent + (curable_recent if cures_recent == 0 else 0)"
      - balance_six: "SUM('claim_events','amount', within_months=6, event_type='coverage_patient_responsibility_assigned', responsibility_type='out_of_network_balance')"
      - writeoff_six: "SUM('claim_events','amount', within_months=6, event_type='coverage_contractual_adjustment')"
      - balance_twelve: "SUM('claim_events','amount', within_months=12, event_type='coverage_patient_responsibility_assigned', responsibility_type='out_of_network_balance')"
      - writeoff_twelve: "SUM('claim_events','amount', within_months=12, event_type='coverage_contractual_adjustment')"
      - first_plan_balance_share: "(balance_six / (balance_six + writeoff_six)) if balance_six > 0 else ((balance_twelve / (balance_twelve + writeoff_twelve)) if (balance_six == 0 and balance_twelve > 0) else 1)"
      - service_date: "CFIELD('orders','collection_date', order_id=ord)"
      - filing_lag_days: "DAYS(service_date, LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm))"
      - first_plan_late_pct: "K('first_plan_late_far_pct') if filing_lag_days > K('first_plan_late_far_days') else (K('first_plan_late_near_pct') if filing_lag_days > K('first_plan_late_near_days') else 100)"
      - exposed_charges: "contested_charges * first_plan_balance_share * first_plan_late_pct / 100"
      - deductible_year: "SUM('claim_events','amount', within_months=12, event_type='coverage_patient_responsibility_assigned', responsibility_type='deductible')"
      - first_plan_leftover_pct: "K('first_plan_coinsurance_pct') if deductible_year >= K('first_plan_deductible_satisfied') else (K('first_plan_deductible_phase_pct') if deductible_year > 0 else K('first_plan_standard_leftover_pct'))"
      - member_leftover: "exposed_charges * first_plan_leftover_pct / 100"
      - award_covers_service: "((DAYS(CFIELD('assistance','award_start_date', status='approved'), CFIELD('orders','collection_date', order_id=ord)) >= 0) and (DAYS(CFIELD('orders','collection_date', order_id=ord), CFIELD('assistance','award_end_date', status='approved')) >= 0)) if EXISTS('assistance', status='approved') else False"
      - first_plan_relief_pct: "CPARAM('assistance','discount_pct', status='approved') if (award_covers_service and CPARAM('assistance','discount_pct', status='approved') > 0) else (K('first_plan_hardship_pct') if (award_covers_service and CPARAM('assistance','discount_pct', status='approved') == 0) else 0)"
      - contested_exposure: "(exposed_charges - member_leftover) * (100 - first_plan_relief_pct) / 100"
      - filed_on: "LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm)"
      - denied_on: "LATEST('claim_events','event_date', event_type='coverage_claim_denied', claim_number=clm)"
      - adjudication_days: "DAYS(filed_on, denied_on)"
      - first_plan_interest_days: "DAYS(filed_on, NOW) if adjudication_days > 2 * P('expected_adjudication_days') else ((DAYS(filed_on, NOW) - P('expected_adjudication_days')) if adjudication_days > P('expected_adjudication_days') else 0)"
      - claim_age_days: "DAYS(LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm), NOW)"
      - first_plan_interest_rate_pct: "K('first_plan_aged_rate_pct') if claim_age_days > K('first_plan_aged_days') else (K('first_plan_standing_rate_pct') if claim_age_days > K('first_plan_standing_days') else K('first_plan_base_rate_pct'))"
      - member_interest: "contested_exposure * first_plan_interest_rate_pct / 100 * first_plan_interest_days / 365"
      - result: "RND(contested_exposure + member_interest, 2)"
    compute_basis:
      clm: "The first-plan member appeal's claim is the claim carrying the most recent medical-necessity denial on the coverage, and its order is the order that claim bills."
      ord: "The first-plan member appeal's claim is the claim carrying the most recent medical-necessity denial on the coverage, and its order is the order that claim bills."
      appealable_recent: "the medical-necessity, frequency and authorization denial amounts the plan issued on the coverage within the last six months"
      curable_recent: "plus the missing-information, other-coverage, coverage-ended and patient-identification denial amounts it issued within those six months while no corrected or coordination claim filed within those six months stands on the coverage."
      cures_recent: "while no corrected or coordination claim filed within those six months stands on the coverage."
      contested_charges: "The first-plan member appeal's contested charges are the medical-necessity, frequency and authorization denial amounts the plan issued on the coverage within the last six months, plus the missing-information, other-coverage, coverage-ended and patient-identification denial amounts it issued within those six months while no corrected or coordination claim filed within those six months stands on the coverage."
      balance_six: "the out-of-network balance assigned to the member on the coverage within the last six months"
      writeoff_six: "divided by that balance plus the contractual adjustments on the coverage within the same six months"
      balance_twelve: "it is the same share taken over the last twelve months"
      writeoff_twelve: "it is the same share taken over the last twelve months"
      first_plan_balance_share: "The first-plan member appeal's balance share is the out-of-network balance assigned to the member on the coverage within the last six months divided by that balance plus the contractual adjustments on the coverage within the same six months, where such a balance exists; it is the same share taken over the last twelve months where no such balance falls within six months but one falls within twelve months; otherwise it is one."
      service_date: "the calendar days from the order's collection date to the claim's filing date"
      filing_lag_days: "the calendar days from the order's collection date to the claim's filing date"
      first_plan_late_pct: "the first-plan far late percent where those days exceed the first-plan far late days, the first-plan near late percent where they exceed the first-plan near late days but not the far late days, and one hundred otherwise."
      exposed_charges: "The first-plan member appeal's exposed charges are its contested charges times its balance share times its late-claim percent, divided by one hundred."
      deductible_year: "the deductible amounts assigned on the coverage within the last twelve months reach the first-plan deductible satisfied amount"
      first_plan_leftover_pct: "The first-plan member appeal's leftover percent is the first-plan coinsurance percent where the deductible amounts assigned on the coverage within the last twelve months reach the first-plan deductible satisfied amount; it is the first-plan deductible phase percent where some deductible was assigned within those twelve months but the amounts stay below that amount; otherwise it is the first-plan standard leftover percent."
      member_leftover: "The member's leftover is the exposed charges times the leftover percent, divided by one hundred."
      award_covers_service: "where that award's window, from its start date through its end date, covers the order's collection date"
      first_plan_relief_pct: "The first-plan member appeal's relief percent is the discount percent of the patient's approved financial-assistance award where that award's window, from its start date through its end date, covers the order's collection date and the award's tier carries a discount percent above zero; it is the first-plan hardship percent where such a covering award carries a discount percent of zero; otherwise it is zero."
      contested_exposure: "The member's contested exposure is the exposed charges less the member's leftover, times one hundred less the relief percent, divided by one hundred."
      filed_on: "between the claim's filing date and its denial date"
      denied_on: "between the claim's filing date and its denial date"
      adjudication_days: "where the plan took more than twice its expected adjudication days between the claim's filing date and its denial date"
      first_plan_interest_days: "where the plan took more than twice its expected adjudication days between the claim's filing date and its denial date, interest runs for every calendar day from the filing date to today; where it took more than its expected adjudication days but not more than twice that, interest runs for the calendar days from the filing date to today less the expected adjudication days; otherwise no interest runs."
      claim_age_days: "the age of the claim in calendar days from its filing date to today"
      first_plan_interest_rate_pct: "the first-plan aged rate where the age exceeds the first-plan aged days, the first-plan standing rate where it exceeds the first-plan standing days but not the aged days, and the first-plan base rate otherwise."
      member_interest: "The member's interest is the contested exposure times the annual interest rate, divided by one hundred, times the interest days, divided by 365."
      result: "The amount in dispute is the member's contested exposure plus the member's interest, with no rounding before the final cent."
    factors:
      - id: first_plan_balance_share
        effect: method
        decides: first_plan_balance_share
        bindings: [balance_six, writeoff_six, balance_twelve, writeoff_twelve, first_plan_balance_share]
        ladder:
          - when: "For the first-plan member appeal, an out-of-network balance was assigned to the member on the coverage within the last six months"
            method: "under the first-plan member appeal, the contested charges are multiplied by the six-month share of balance over balance plus contractual adjustments"
          - when: "For the first-plan member appeal, no such balance falls within six months but one falls within twelve months"
            method: "under the first-plan member appeal, the contested charges are multiplied by the same share taken over twelve months"
          - when: "For the first-plan member appeal, otherwise"
            method: "under the first-plan member appeal, the contested charges stay at billed value"
        baseline:
          first_plan_balance_share: "1"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: first_plan_late_claim
        effect: parameter
        decides: first_plan_late_pct
        bindings: [service_date, filing_lag_days, first_plan_late_pct]
        ladder:
          - when: "For the first-plan member appeal, the calendar days from the order's collection date to the claim's filing date exceed the first-plan far late days"
            value: "K('first_plan_late_far_pct')"
          - when: "For the first-plan member appeal, those days exceed the first-plan near late days but not the far late days"
            value: "K('first_plan_late_near_pct')"
          - when: "For the first-plan member appeal, otherwise"
            value: "100"
        baseline:
          first_plan_late_pct: "100"
        evidence: [cross_category, date, history]
        cross_difficulty: orders
      - id: first_plan_leftover
        effect: parameter
        decides: first_plan_leftover_pct
        bindings: [deductible_year, first_plan_leftover_pct]
        ladder:
          - when: "For the first-plan member appeal, the deductible amounts assigned on the coverage within the last twelve months reach the first-plan deductible satisfied amount"
            value: "K('first_plan_coinsurance_pct')"
          - when: "For the first-plan member appeal, some deductible was assigned within those twelve months but the amounts stay below that amount"
            value: "K('first_plan_deductible_phase_pct')"
          - when: "For the first-plan member appeal, otherwise"
            value: "K('first_plan_standard_leftover_pct')"
        baseline:
          first_plan_leftover_pct: "K('first_plan_standard_leftover_pct')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: first_plan_relief
        effect: parameter
        decides: first_plan_relief_pct
        bindings: [award_covers_service, first_plan_relief_pct]
        ladder:
          - when: "For the first-plan member appeal, the patient's approved financial-assistance award window covers the order's collection date and the award's tier carries a discount percent above zero"
            value: "CPARAM('assistance','discount_pct', status='approved')"
          - when: "For the first-plan member appeal, such a covering award carries a discount percent of zero"
            value: "K('first_plan_hardship_pct')"
          - when: "For the first-plan member appeal, otherwise"
            value: "0"
        baseline:
          first_plan_relief_pct: "0"
        evidence: [cross_category, date]
        cross_difficulty: assistance
      - id: first_plan_interest_days
        effect: method
        decides: first_plan_interest_days
        bindings: [filed_on, denied_on, adjudication_days, first_plan_interest_days]
        ladder:
          - when: "For the first-plan member appeal, the plan took more than twice its expected adjudication days between the claim's filing date and its denial date"
            method: "under the first-plan member appeal, interest runs for every calendar day from the filing date to today"
          - when: "For the first-plan member appeal, the plan took more than its expected adjudication days but not more than twice that"
            method: "under the first-plan member appeal, interest runs for the calendar days from the filing date to today less the expected adjudication days"
          - when: "For the first-plan member appeal, otherwise"
            method: "under the first-plan member appeal, no interest runs"
        baseline:
          first_plan_interest_days: "0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: first_plan_interest_rate
        effect: parameter
        decides: first_plan_interest_rate_pct
        bindings: [claim_age_days, first_plan_interest_rate_pct]
        ladder:
          - when: "For the first-plan member appeal, the claim's age in calendar days from its filing date to today exceeds the first-plan aged days"
            value: "K('first_plan_aged_rate_pct')"
          - when: "For the first-plan member appeal, the age exceeds the first-plan standing days but not the aged days"
            value: "K('first_plan_standing_rate_pct')"
          - when: "For the first-plan member appeal, otherwise"
            value: "K('first_plan_base_rate_pct')"
        baseline:
          first_plan_interest_rate_pct: "K('first_plan_base_rate_pct')"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The first-plan member appeal's claim is the claim carrying the most recent medical-necessity denial on the coverage, and its order is the order that claim bills. The first-plan member appeal's contested charges are the medical-necessity, frequency
        and authorization denial amounts the plan issued on the coverage within the last six months, plus the
        missing-information, other-coverage, coverage-ended and patient-identification denial amounts it issued within
        those six months while no corrected or coordination claim filed within those six months stands on the coverage.
        The amount in dispute starts from the first-plan member appeal's contested charges taken at billed value, less the first-plan standard leftover percent of them, and is rounded half up to the cent once, at the end.
      params: [first_plan_standard_leftover_pct]
    inputs:
      history:
        - {table: claim_events, aggregate: sum, field: amount, within_months: 6, filters: {event_type: coverage_claim_denied}}
        - {table: claim_events, aggregate: count, field: claim_event_id, within_months: 6, filters: {event_type: coverage_claim_resubmitted}}
        - {table: claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: coverage_patient_responsibility_assigned}}
        - {table: claim_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: coverage_contractual_adjustment}}
      cross_category: [assistance, orders]

  - id: coverage_ext_coordination_correction
    base_policy_refs:
    - coverage_evt_corrected_claim
    - coverage_agg_coordination_of_benefits
    - coverage_evt_denial_liability
    overwrite:
    - base_policy: coverage_evt_corrected_claim
      superseded_clause: A corrected or replacement claim answers one denial and carries that denial's amount
      replaced_by: A coordination correction answers the claim's most recent other-coverage denial and carries the
        denied amount being resubmitted, fixed below.
    - base_policy: coverage_evt_corrected_claim
      superseded_clause: coordination_of_benefits_update (CO-22, only after the coverage's coordination order has
        been updated following the denial; when cob_questionnaire_required_on_co22 is true the patient must first
        have updated their other-coverage information with the payer)
      replaced_by: A coordination claim answers an other-coverage denial where the coverage's coordination order on
        file already gives it the payment position the coordination rules assign it and, where the payer class requires
        it, the patient has updated their other-coverage information with the payer.
    - base_policy: coverage_evt_denial_liability
      superseded_clause: CO-22 (other coverage primary) is cured by a corrected claim after the coordination order
        is updated
      replaced_by: An other-coverage denial (CO-22) is cured by a coordination claim without a further coordination
        update where the coverage's coordination order on file already gives it that position.
    trigger: state_due
    subject:
    - coverage_claim_resubmitted
    computes: rebill_amount
    target_tool: file_coordination_correction_d59a8135
    params:
      small_claim_amount: 250
      mid_claim_amount: 1000
      small_claim_invoice_min: 1
      mid_claim_invoice_min: 5
      standard_invoice_min: 15
      prompt_credit_days: 60
      seasoned_credit_days: 180
      prompt_credit_min: 2
      seasoned_credit_min: 5
      standard_credit_min: 25
      contract_removal_min: 50
      noncontract_removal_min: 100
      standard_removal_min: 200
    rule: 'This rule fixes the amount a coordination claim carries when the laboratory answers an other-coverage denial
      (CO-22) on a claim held by a coverage. A coordination claim answers an other-coverage denial where the coverage''s
      coordination order on file already gives it the payment position the coordination rules assign it and, where
      the payer class requires it, the patient has updated their other-coverage information with the payer. An other-coverage
      denial (CO-22) is cured by a coordination claim without a further coordination update where the coverage''s
      coordination order on file already gives it that position. A coordination correction answers the claim''s most
      recent other-coverage denial and carries the denied amount being resubmitted, fixed below. The claim corrected
      is the claim carrying the most recent other-coverage denial on the coverage, the order is the order that claim
      bills, and the order''s invoice is the patient invoice that bills that order. The amount the coordination claim
      carries is the denied amount being resubmitted: the other-coverage denial''s amount less the part of the order''s
      later credits and invoice corrections that falls on it, as fixed below. Standard method: the coordination correction
      resubmits the denial''s amount in full, rounded half up to the cent once, at the end. The coordination correction''s
      share of the order''s reductions is the denial''s amount divided by all the denied amounts on the claim where
      the remittance paid at least one line of the claim; it is the denial''s amount divided by the amount the claim
      billed at filing where no line was paid but the plan adjudicated a line to the member or to a contractual adjustment;
      otherwise it is one. The order''s credits enter the coordination correction only when the order''s most recent
      credit was posted after the claim''s filing date: where a credit on the order is for a test not performed or
      a duplicate test, the not-performed and duplicate credits come off once their total reaches the coordination
      correction''s removal minimum and the billing-correction credits come off once their total reaches the coordination
      correction''s credit minimum; where the order carries billing-correction credits only, they come off once their
      total reaches the credit minimum; otherwise nothing comes off. The coordination correction''s removal minimum
      is the contracted removal minimum where the payer class writes billed charges down to a contracted allowance
      and the plan adjudicated at least one line of the claim; it is the non-contracted removal minimum where the
      payer class does not write charges down and the plan adjudicated at least one line; otherwise it is the standard
      removal minimum. The coordination correction''s credit minimum follows the calendar days from the claim''s filing
      date to today: the prompt credit minimum where those days are at most the prompt credit days, the seasoned credit
      minimum where they exceed the prompt credit days but are at most the seasoned credit days, and the standard
      credit minimum otherwise. The billing-error corrections adjusted on the order''s invoice also come off once
      their total reaches the coordination correction''s invoice minimum, and otherwise none of them does. The coordination
      correction''s invoice minimum follows the amount the claim billed at filing: the small-claim invoice minimum
      where that amount is below the small claim amount, the mid-claim invoice minimum where it is at least the small
      claim amount but below the mid claim amount, and the standard invoice minimum otherwise. The credits and invoice
      corrections that come off are first added together, and that total is multiplied by the coordination correction''s
      share before it is taken off the denial''s amount; the amount carried is never below zero, with no rounding
      before the final cent.'
    prerequisite: []
    cross_category:
    - category: orders
      as: history
      reads:
      - order_events.charge_amount
      - order_events.credit_reason
      - order_events.event_date
      - order_events.event_type
      note: The order's credits posted after filing decide what comes off the coordination correction.
    - category: invoices
      as: history
      reads:
      - invoice_id
      - invoice_transactions.amount
      - invoice_transactions.event_type
      - invoice_transactions.adjustment_type
      note: Billing-error corrections (and, for a coverage paying second, the posted leftover) on the order's invoice
        decide what the coordination correction carries.
    compute:
    - clm: LATEST('claim_events','claim_number', event_type='coverage_claim_denied', denial_code='CO-22')
    - ord: LATEST('claim_events','order_id', event_type='coverage_claim_denied', denial_code='CO-22')
    - denied: SUM('claim_events','amount', event_type='coverage_claim_denied', denial_code='CO-22', claim_number=clm)
    - claim_billed: SUM('claim_events','amount', event_type='coverage_claim_submitted', claim_number=clm)
    - filed_on: LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm)
    - order_invoice: CFIELD('invoices','invoice_id', order_id=ord)
    - invoice_corrections: XSUM('invoices','invoice_transactions','amount', invoice_id=order_invoice, event_type='invoices_adjustment_posted',
        adjustment_type='billing_error_correction')
    - coord_invoice_minimum: K('small_claim_invoice_min') if SUM('claim_events','amount', event_type='coverage_claim_submitted',
        claim_number=clm) < K('small_claim_amount') else (K('mid_claim_invoice_min') if SUM('claim_events','amount',
        event_type='coverage_claim_submitted', claim_number=clm) < K('mid_claim_amount') else K('standard_invoice_min'))
    - invoice_reduction: invoice_corrections if (invoice_corrections > 0 and invoice_corrections >= coord_invoice_minimum)
        else 0
    - claim_paid_lines: COUNT('claim_events', event_type='coverage_claim_paid', claim_number=clm)
    - claim_adjudicated_lines: COUNT('claim_events', event_type='coverage_contractual_adjustment', claim_number=clm)
        + COUNT('claim_events', event_type='coverage_patient_responsibility_assigned', claim_number=clm)
    - claim_denied_total: SUM('claim_events','amount', event_type='coverage_claim_denied', claim_number=clm)
    - coord_share: (denied / claim_denied_total) if claim_paid_lines >= 1 else ((denied / claim_billed) if claim_adjudicated_lines
        >= 1 else 1)
    - credit_lines: XCOUNT('orders','order_events', order_id=ord, event_type='orders_test_charge_credited')
    - credits_after_filing: (DAYS(filed_on, XLATEST('orders','order_events','event_date', order_id=ord, event_type='orders_test_charge_credited'))
        > 0) if credit_lines >= 1 else False
    - full_test_credits: XSUM('orders','order_events','charge_amount', order_id=ord, event_type='orders_test_charge_credited',
        credit_reason='test_not_performed') + XSUM('orders','order_events','charge_amount', order_id=ord, event_type='orders_test_charge_credited',
        credit_reason='duplicate_test')
    - repricing_credits: XSUM('orders','order_events','charge_amount', order_id=ord, event_type='orders_test_charge_credited',
        credit_reason='billing_correction')
    - days_since_filing: DAYS(LATEST('claim_events','event_date', event_type='coverage_claim_submitted', claim_number=clm),
        NOW)
    - coord_credit_minimum: K('prompt_credit_min') if days_since_filing <= K('prompt_credit_days') else (K('seasoned_credit_min')
        if days_since_filing <= K('seasoned_credit_days') else K('standard_credit_min'))
    - coord_removal_minimum: K('contract_removal_min') if (P('contractual_adjustment_applies') and COUNT('claim_events',
        event_type='coverage_contractual_adjustment', claim_number=clm) >= 1) else (K('noncontract_removal_min') if
        ((not P('contractual_adjustment_applies')) and COUNT('claim_events', event_type='coverage_contractual_adjustment',
        claim_number=clm) >= 1) else K('standard_removal_min'))
    - coord_credit_reduction: ((full_test_credits if full_test_credits >= coord_removal_minimum else 0) + (repricing_credits
        if repricing_credits >= coord_credit_minimum else 0)) if (credits_after_filing and full_test_credits > 0)
        else ((repricing_credits if repricing_credits >= coord_credit_minimum else 0) if (credits_after_filing and
        full_test_credits == 0) else 0)
    - result: RND(MX(0, denied - (coord_credit_reduction + invoice_reduction) * coord_share), 2)
    compute_basis:
      clm: The claim corrected is the claim carrying the most recent other-coverage denial on the coverage, the order
        is the order that claim bills, and the order's invoice is the patient invoice that bills that order.
      ord: the order is the order that claim bills
      denied: the other-coverage denial's amount
      claim_billed: the amount the claim billed at filing
      filed_on: only when the order's most recent credit was posted after the claim's filing date
      order_invoice: the order's invoice is the patient invoice that bills that order.
      invoice_corrections: billing-error corrections
      coord_invoice_minimum: 'The coordination correction''s invoice minimum follows the amount the claim billed at
        filing: the small-claim invoice minimum where that amount is below the small claim amount, the mid-claim invoice
        minimum where it is at least the small claim amount but below the mid claim amount, and the standard invoice
        minimum otherwise.'
      invoice_reduction: The billing-error corrections adjusted on the order's invoice also come off once their total
        reaches the coordination correction's invoice minimum, and otherwise none of them does.
      claim_paid_lines: where the remittance paid at least one line of the claim
      claim_adjudicated_lines: where no line was paid but the plan adjudicated a line to the member or to a contractual
        adjustment
      claim_denied_total: the denial's amount divided by all the denied amounts on the claim
      coord_share: The coordination correction's share of the order's reductions is the denial's amount divided by
        all the denied amounts on the claim where the remittance paid at least one line of the claim; it is the denial's
        amount divided by the amount the claim billed at filing where no line was paid but the plan adjudicated a
        line to the member or to a contractual adjustment; otherwise it is one.
      credit_lines: 'The order''s credits enter the coordination correction only when the order''s most recent credit
        was posted after the claim''s filing date: where a credit on the order is for a test not performed or a duplicate
        test, the not-performed and duplicate credits come off once their total reaches the coordination correction''s
        removal minimum and the billing-correction credits come off once their total reaches the coordination correction''s
        credit minimum; where the order carries billing-correction credits only, they come off once their total reaches
        the credit minimum; otherwise nothing comes off.'
      credits_after_filing: only when the order's most recent credit was posted after the claim's filing date
      full_test_credits: for a test not performed or a duplicate test
      repricing_credits: billing-correction credits
      days_since_filing: follows the calendar days from the claim's filing date to today
      coord_credit_minimum: 'The coordination correction''s credit minimum follows the calendar days from the claim''s
        filing date to today: the prompt credit minimum where those days are at most the prompt credit days, the seasoned
        credit minimum where they exceed the prompt credit days but are at most the seasoned credit days, and the
        standard credit minimum otherwise.'
      coord_removal_minimum: The coordination correction's removal minimum is the contracted removal minimum where
        the payer class writes billed charges down to a contracted allowance and the plan adjudicated at least one
        line of the claim; it is the non-contracted removal minimum where the payer class does not write charges down
        and the plan adjudicated at least one line; otherwise it is the standard removal minimum.
      coord_credit_reduction: 'The order''s credits enter the coordination correction only when the order''s most
        recent credit was posted after the claim''s filing date: where a credit on the order is for a test not performed
        or a duplicate test, the not-performed and duplicate credits come off once their total reaches the coordination
        correction''s removal minimum and the billing-correction credits come off once their total reaches the coordination
        correction''s credit minimum; where the order carries billing-correction credits only, they come off once
        their total reaches the credit minimum; otherwise nothing comes off.'
      result: The credits and invoice corrections that come off are first added together, and that total is multiplied
        by the coordination correction's share before it is taken off the denial's amount; the amount carried is never
        below zero, with no rounding before the final cent.
    factors:
    - id: coord_apportionment
      effect: method
      decides: coord_share
      bindings:
      - claim_paid_lines
      - claim_adjudicated_lines
      - claim_denied_total
      - coord_share
      ladder:
      - when: For the coordination correction, the remittance paid at least one line of the claim
        method: under the coordination correction, the reductions are multiplied by the denial's amount divided by
          all the denied amounts on the claim
      - when: For the coordination correction, no line was paid but the plan adjudicated a line to the member or to
          a contractual adjustment
        method: under the coordination correction, the reductions are multiplied by the denial's amount divided by
          the amount the claim billed at filing
      - when: For the coordination correction, otherwise
        method: under the coordination correction, the reductions are taken in full
      baseline:
        coord_share: '1'
      evidence:
      - history
      cross_difficulty: null
    - id: coord_credits
      effect: method
      decides: coord_credit_reduction
      bindings:
      - credit_lines
      - credits_after_filing
      - full_test_credits
      - repricing_credits
      - coord_credit_reduction
      ladder:
      - when: For the coordination correction, the order's most recent credit was posted after the claim's filing
          date and a credit on the order is for a test not performed or a duplicate test
        method: under the coordination correction, the not-performed and duplicate credits come off once they reach
          the removal minimum, and the billing-correction credits once they reach the credit minimum
      - when: For the coordination correction, the order's most recent credit was posted after the claim's filing
          date and its credits are billing corrections only
        method: under the coordination correction, the billing-correction credits come off once they reach the credit
          minimum
      - when: For the coordination correction, otherwise
        method: under the coordination correction, nothing comes off
      baseline:
        coord_credit_reduction: '0'
      evidence:
      - cross_category
      - date
      cross_difficulty: orders
    - id: coord_credit_minimum
      effect: parameter
      decides: coord_credit_minimum
      bindings:
      - days_since_filing
      - coord_credit_minimum
      ladder:
      - when: For the coordination correction, the calendar days from the claim's filing date to today are at most
          the prompt credit days
        value: K('prompt_credit_min')
      - when: For the coordination correction, those days exceed the prompt credit days but are at most the seasoned
          credit days
        value: K('seasoned_credit_min')
      - when: For the coordination correction, otherwise
        value: K('standard_credit_min')
      baseline:
        coord_credit_minimum: K('standard_credit_min')
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: coord_invoice_minimum
      effect: parameter
      decides: coord_invoice_minimum
      bindings:
      - coord_invoice_minimum
      ladder:
      - when: For the coordination correction, the amount the claim billed at filing is below the small claim amount
        value: K('small_claim_invoice_min')
      - when: For the coordination correction, that amount is at least the small claim amount but below the mid claim
          amount
        value: K('mid_claim_invoice_min')
      - when: For the coordination correction, otherwise
        value: K('standard_invoice_min')
      baseline:
        coord_invoice_minimum: K('standard_invoice_min')
      evidence:
      - history
      cross_difficulty: null
    - id: coord_removal_minimum
      effect: parameter
      decides: coord_removal_minimum
      bindings:
      - coord_removal_minimum
      ladder:
      - when: For the coordination correction, the payer class writes billed charges down to a contracted allowance
          and the plan adjudicated at least one line of the claim
        value: K('contract_removal_min')
      - when: For the coordination correction, the payer class does not write charges down and the plan adjudicated
          at least one line
        value: K('noncontract_removal_min')
      - when: For the coordination correction, otherwise
        value: K('standard_removal_min')
      baseline:
        coord_removal_minimum: K('standard_removal_min')
      evidence:
      - history
      - tier_param
      cross_difficulty: null
    baseline:
      rule: 'The claim corrected is the claim carrying the most recent other-coverage denial on the coverage, the
        order is the order that claim bills, and the order''s invoice is the patient invoice that bills that order.
        Standard method: the coordination correction resubmits the denial''s amount in full, rounded half up to the
        cent once, at the end.'
      params: []
    inputs:
      history:
      - table: claim_events
        aggregate: sum
        field: amount
        filters:
          event_type: coverage_claim_denied
      - table: claim_events
        aggregate: count
        field: claim_event_id
        filters:
          event_type: coverage_claim_paid
      - category: orders
        table: order_events
        aggregate: sum
        field: charge_amount
        filters:
          event_type: orders_test_charge_credited
      - category: invoices
        table: invoice_transactions
        aggregate: sum
        field: amount
        filters:
          event_type: invoices_adjustment_posted
          adjustment_type: billing_error_correction
      cross_category:
      - orders
      - invoices
