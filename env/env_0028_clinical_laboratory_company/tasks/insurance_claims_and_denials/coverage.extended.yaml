category: coverage
display_name: Insurance Coverage & Claims

# One holding = one health-plan coverage the patient has on file with the laboratory, classed by
# payer class. Every claim the laboratory files with that coverage, and everything the payer and
# the laboratory do with it afterwards (payment, contractual adjustment, patient responsibility,
# denial, correction, appeal), is booked as a claim line against the coverage.
binding:
  holding_table: coverages
  event_tables: [claim_events]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [pending_verification, active, inactive, terminated]
  transitions:
    - {from: pending_verification, to: active, by: agent, means: Electronic eligibility confirms the member is covered; the coverage can be billed.}
    - {from: pending_verification, to: inactive, by: system, means: Eligibility could not be confirmed (member not found or coverage not active) within the verification limit.}
    - {from: active, to: inactive, by: system, means: A re-verification shows the coverage is no longer active.}
    - {from: inactive, to: pending_verification, by: agent, means: Corrected member details are resubmitted for verification.}
    - {from: active, to: terminated, by: agent, means: The coverage has ended (reported by the patient or returned by the payer) and a termination date is recorded.}

accounts:
  - key: claim_receivable
    unit: USD
    meaning: Amount billed to the payer and not yet resolved; a submission or resubmission posts the billed amount in, and the payer's payment, the contractual adjustment, the patient-responsibility transfer and any denied amount post out.

parameter_schema:
  network_status: "Enum (medicare_participating, in_network, out_of_network, not_applicable); the laboratory's contract status with the payer class."
  lab_files_claims: "Boolean; whether the laboratory files the claim with the payer on the patient's behalf."
  assignment_accepted: "Boolean; whether the payer pays the laboratory directly (assignment) rather than the patient."
  fee_schedule_basis: "Enum (medicare_clfs, plan_fee_schedule, medicaid_fee_schedule, tricare_cmac); the fee schedule the payer's allowed amount is based on."
  allowed_amount_pct_of_fee_schedule: "Percent of the fee-schedule basis the payer is expected to allow per test."
  contractual_adjustment_applies: "Boolean; whether billed charges above the allowed amount are written off as a contractual adjustment (false = the difference may be billed to the patient within the balance cap)."
  timely_filing_days: "Calendar days after the date of service (collection date) by which the first claim must reach the payer."
  claim_submission_lag_business_days: "Business days after the final report on which the laboratory files the claim (0 = filed by crossover from the primary payer)."
  expected_adjudication_days: "Calendar days after submission within which a clean claim is normally adjudicated."
  corrected_claim_window_days: "Calendar days after a denial within which a corrected or replacement claim is accepted."
  max_corrected_claims_per_claim: "Integer; corrected or replacement submissions allowed on one claim number."
  eligibility_reverify_days: "Calendar days; coverage last verified more than this many days before a date of service is re-verified before the claim is filed."
  verification_turnaround_business_days: "Business days the laboratory takes to complete an eligibility verification after details are received."
  pending_verification_max_business_days: "Business days a coverage may stay pending verification before it is set inactive."
  inactive_resubmission_window_days: "Calendar days after a coverage became inactive within which corrected details may be resubmitted on the same coverage record (later, a new coverage record is added)."
  retroactive_eligibility_lookback_days: "Calendar days before the coverage effective date that the payer covers retroactively once enrollment is approved (0 = no retroactive coverage)."
  member_id_format: "Text; the identifier format printed on the payer class's card, used to check member details before verification."
  subscriber_relationships_allowed: "List of patient-to-subscriber relationships the payer class allows (self, spouse, child, other_dependent)."
  dependent_max_age_years: "Whole years; age through which a child dependent stays covered (0 = dependents not applicable)."
  termination_effective_rule: "Enum (end_of_month, date_of_event); how the termination date is set from the qualifying event."
  can_be_primary: "Boolean; whether the payer class can be the primary payer."
  secondary_to_other_health_insurance: "Boolean; whether the payer class pays after any other health coverage the patient holds (payer of last resort)."
  msp_employer_size_threshold: "Integer employees; for Medicare payer classes, the employer size at or above which an employer group plan from current employment pays before Medicare (0 = not applicable)."
  secondary_crossover_automatic: "Boolean; whether the claim reaches this payer automatically from Medicare when it is secondary (the laboratory files nothing)."
  clinical_lab_patient_cost_share: "Boolean; whether the patient owes deductible, coinsurance or copay on covered clinical laboratory tests."
  pathology_cost_share: "Boolean; whether the patient owes deductible or coinsurance on covered anatomic pathology services."
  patient_billing_prohibited_except_copay: "Boolean; whether the laboratory may not bill the patient anything beyond a plan copay for services the plan covers."
  abn_shifts_liability: "Boolean; whether a signed ABN option 1 makes a medical-necessity or frequency denial the patient's responsibility."
  patient_billable_denial_codes: "List of denial codes (CARC with group) whose denied amount may be transferred to the patient."
  balance_billing_allowed: "Boolean; whether the patient may be billed the difference between billed charges and the payer's payment."
  oon_patient_balance_cap_basis: "Enum (not_applicable, self_pay_price); cap on what an out-of-network patient is billed after the payer pays: the sum of the tests' self_pay_price."
  prior_auth_retro_request_days: "Calendar days after the date of service within which the payer accepts a retroactive authorization request (0 = none)."
  prior_auth_validity_days: "Calendar days from approval within which an authorized test must be collected (0 = no prior authorization for the class)."
  first_level_appeal_name: "Text; the payer's name for the first appeal level."
  first_level_appeal_window_days: "Calendar days after the denial notice date (plus notice_receipt_presumption_days) within which the first-level appeal must be filed (0 = no separate appeal)."
  notice_receipt_presumption_days: "Calendar days added to the notice date because the payer presumes the notice was received that many days after it is dated."
  second_level_appeal_window_days: "Calendar days after the first-level decision within which the second-level appeal must be filed (0 = none or automatic)."
  second_level_auto_forward: "Boolean; whether an upheld first-level decision is forwarded to the second level automatically without a filing."
  third_level_appeal_window_days: "Calendar days after the second-level decision within which the third-level (ALJ, hearing or external review) request must be filed (0 = none)."
  third_level_min_amount_in_controversy: "USD; minimum amount still in dispute for a third-level request (0.00 = no minimum)."
  lab_appeal_levels_pursued: "Integer; appeal levels the laboratory files on its own initiative for a denial it is liable for."
  appeal_requires_patient_authorization: "Boolean; whether the laboratory may appeal only with the patient's signed authorized-representative form."
  payer_appeal_decision_days: "Calendar days within which the payer decides a filed appeal."
  cob_questionnaire_required_on_co22: "Boolean; whether a coordination-of-benefits denial (CO-22) requires the patient to update their other-coverage information with the payer before the claim is refiled."
  patient_responsibility_posting_business_days: "Business days after the payer's remittance on which the patient responsibility is posted to a patient invoice."
  lab_test_frequency_edits_apply: "Boolean; whether the payer applies test frequency edits (CO-151)."
  medical_necessity_edits_apply: "Boolean; whether the payer applies diagnosis-based medical-necessity edits (CO-50)."
  timely_filing_denial_patient_billable: "Boolean; whether a timely-filing denial (CO-29) may ever be billed to the patient."
  secondary_claim_submission_days: "Calendar days after the primary payer's remittance within which the laboratory files the secondary claim (0 = not filed by the laboratory)."

