events:
  - type: plans_plan_created
    target: payment_plans
    mutation: create
    meaning: A payment plan is offered to the patient with its computed terms, awaiting the patient's acceptance.
    grain: one row per plan
    fields:
      customer_id: The patient (guarantor) who will owe the installments.
      variant_name: The plan term chosen.
      installment_amount: The regular monthly installment.
      down_payment_amount: Down payment due at acceptance (0.00 when none).
      due_day_of_month: Day of the month installments fall due.
      first_due_date: Due date of installment 1.
      autopay_enrolled: Whether installments will be drawn automatically.
      autopay_method: Method on file for automatic draws.
      created_date: Date the plan was offered.
    triggers: []
  - type: plans_terms_accepted
    target: payment_plans
    mutation: {transition: {from: pending_acceptance, to: active}}
    meaning: The patient personally accepts the plan terms.
    grain: one row per transaction
    fields:
      accepted_date: Date of acceptance.
    triggers:
      - event: invoices:invoices_enrolled_in_plan
        map: {plan_id: plan_id}
  - type: plans_offer_expired
    target: payment_plans
    mutation: {transition: {from: pending_acceptance, to: cancelled}}
    meaning: The offer lapses unaccepted.
    grain: one row per transaction
    fields:
      closed_date: Date the offer lapsed.
    triggers: []
  - type: plans_invoice_enrolled
    target: plan_transactions
    meaning: An invoice's balance is put on the plan.
    grain: one row per invoice enrollment
    distinguish_by: [invoice_id, event_date]
    fields:
      event_date: Date of enrollment.
      invoice_id: The invoice enrolled.
      amount: The invoice's balance_due at enrollment; positive.
    account: plan_balance
    direction: in
    triggers: []
  - type: plans_installment_paid
    target: plan_transactions
    meaning: A payment is applied to the plan (down payment, scheduled installment, arrears cure, extra principal or payoff).
    grain: one row per payment
    distinguish_by: [installment_number, payment_type, event_date]
    fields:
      event_date: Date the payment posted.
      amount: Amount paid; positive.
      installment_number: The installment the payment settles (0 for the down payment).
      due_date: Due date of that installment.
      payment_type: What the payment is.
      payment_method: How it was paid.
    account: plan_balance
    direction: out
    triggers: []
  - type: plans_installment_missed
    target: plan_transactions
    meaning: An installment is still unpaid at the end of its grace period (or its payment was returned).
    grain: one row per missed installment
    distinguish_by: [installment_number]
    fields:
      event_date: Date the installment was recorded missed.
      installment_number: The installment missed.
      due_date: Its due date.
      amount: The installment amount missed.
    triggers: []
  - type: plans_installment_deferred
    target: plan_transactions
    meaning: A hardship skip moves one installment to the end of the plan.
    grain: one row per deferred installment
    distinguish_by: [installment_number]
    fields:
      event_date: Date the deferral was granted.
      installment_number: The installment deferred.
      due_date: Its original due date.
      amount: The installment amount deferred.
    triggers: []
  - type: plans_balance_released
    target: plan_transactions
    meaning: Part of the plan balance is taken off the plan and returned to the invoice it came from.
    grain: one row per invoice released per cause
    distinguish_by: [invoice_id, release_reason, event_date]
    fields:
      event_date: Date of the release.
      invoice_id: The invoice whose share is released.
      amount: Amount released; positive.
      release_reason: Why it was released.
    account: plan_balance
    direction: out
    triggers:
      - event: invoices:invoices_released_from_plan
        when: {release_reason: [plan_cancelled, plan_defaulted]}
        map: {}
  - type: plans_marked_past_due
    target: payment_plans
    mutation: {transition: {from: active, to: past_due}}
    meaning: The plan falls behind.
    grain: one row per transaction
    fields:
      closed_date: Unchanged (empty).
    triggers: []
  - type: plans_cured
    target: payment_plans
    mutation: {transition: {from: past_due, to: active}}
    meaning: Every past-due installment is paid and the plan is current.
    grain: one row per transaction
    fields:
      closed_date: Unchanged (empty).
    triggers: []
  - type: plans_defaulted
    target: payment_plans
    mutation: {transition: {from: past_due, to: defaulted}}
    meaning: The plan defaults after the limit of consecutive missed installments.
    grain: one row per transaction
    fields:
      defaulted_date: Date of default.
    triggers:
      - event: plans:plans_balance_released
        map: {release_reason: plan_defaulted, event_date: defaulted_date}
  - type: plans_reinstated
    target: payment_plans
    mutation: {transition: {from: defaulted, to: active}}
    meaning: A defaulted plan is put back in force.
    grain: one row per transaction
    fields:
      reinstatement_count: Incremented by one.
      defaulted_date: Kept as history.
    triggers: []
  - type: plans_paid_off
    target: payment_plans
    mutation: {transition: {from: active, to: paid_off}}
    meaning: The plan balance reaches zero.
    grain: one row per transaction
    fields:
      closed_date: Date the balance reached zero.
    triggers: []
  - type: plans_cancelled_by_patient
    target: payment_plans
    mutation: {transition: [{from: active, to: cancelled}, {from: past_due, to: cancelled}]}
    meaning: The patient ends the plan.
    grain: one row per transaction
    fields:
      closed_date: Date the plan ended.
    triggers:
      - event: plans:plans_balance_released
        map: {release_reason: plan_cancelled, event_date: closed_date}
  - type: plans_schedule_changed
    target: payment_plans
    mutation: update
    meaning: The due day, the automatic-payment setup, or the installment after a recomputation changes.
    grain: one row per transaction
    fields:
      due_day_of_month: New due day.
      due_day_changes: Incremented when the due day changes.
      autopay_enrolled: New automatic-payment setting.
      autopay_method: New method for automatic draws.
      installment_amount: Recomputed installment.
    triggers: []

measures:
  - id: plans_msr_consecutive_missed
    window: the plan's installments from installment 1 up to the latest due installment
    measure: count of the most recent consecutive plans_installment_missed rows on the plan whose installments are still unpaid, stopping at the first installment that was paid or deferred
  - id: plans_msr_prior_defaults
    window: the default_free_history_months calendar months before the offer date, the offer date excluded
    measure: count of the customer's other payment plans whose defaulted_date falls in the window
  - id: plans_msr_hardship_skips_used
    window: the life of the plan
    measure: count of plans_installment_deferred rows on the plan

policies:
  - id: plans_agg_multi_holding
    subject: [plans_plan_created]
    rule: >-
      A patient may have only one live payment plan, meaning a plan whose status is pending_acceptance, active,
      past_due or defaulted; paid_off and cancelled plans remain on file as history. A patient who already has a live plan cannot be offered a second one; a new eligible invoice is added to the live plan where the add-invoice rule allows, and otherwise waits until that plan ends.
    eligibility:
      - id: one_live_plan
        applies_to: [plans_plan_created]
        kind: dedup
        condition: A patient who already has a live plan cannot be offered a second one; a new eligible invoice is added to the live plan where the add-invoice rule allows, and otherwise waits until that plan ends.
        evidence_fields: [payment_plans.customer_id, payment_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.customer_id]]
          action_bindings: {payment_plans.customer_id: customer_id}
        dedup_contract:
          table: payment_plans
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_acceptance, active, past_due, defaulted]}
          distinct_fields: []
    params: {max_per_customer: 1}

  - id: plans_agg_invoice_consolidation
    subject: [plans_plan_created, plans_invoice_enrolled]
    rule: >-
      A plan consolidates invoices of one patient: every invoice on it belongs to the plan's customer, and the
      plan's enrolled balance is the sum of the balance_due of the invoices enrolled at offer time. All the
      patient's invoices that are eligible on the offer date are enrolled together unless the patient names the
      invoices to include; the term is chosen against the total of the invoices actually enrolled. A plan carries
      at most max_invoices_per_plan invoices over its life. An invoice is never split between two plans or
      between a plan and the statement cycle.
    eligibility: []
    params:
      per_tier:
        3-Month Payment Plan: {max_invoices_per_plan: "=max_invoices_per_plan"}
        6-Month Payment Plan: {max_invoices_per_plan: "=max_invoices_per_plan"}
        9-Month Payment Plan: {max_invoices_per_plan: "=max_invoices_per_plan"}
        12-Month Payment Plan: {max_invoices_per_plan: "=max_invoices_per_plan"}
        18-Month Payment Plan: {max_invoices_per_plan: "=max_invoices_per_plan"}
        24-Month Extended Payment Plan: {max_invoices_per_plan: "=max_invoices_per_plan"}

  - id: plans_term_selection_and_terms
    subject: [plans_plan_created]
    rule: >-
      A plan term can be offered only when the total enrolled balance lies between its min_enrolled_balance and
      max_enrolled_balance inclusive. Where several terms fit, the patient chooses. The patient may be offered a plan only if none of their other plans defaulted within the last default_free_history_months calendar months (plans_msr_prior_defaults is 0).
      A term whose assistance_screening_required is true is offered only when the patient has a financial-assistance case on file in any status.
      A term whose autopay_required is true is offered only with automatic payment set up from one of
      autopay_methods. The down payment is down_payment_pct percent of the enrolled balance, rounded to the cent,
      and is due at acceptance. The regular installment is the enrolled balance less the down payment, divided by
      term_months and rounded to the cent; the last installment absorbs the rounding difference. When the regular installment is below min_installment_amount, that term cannot be offered and a shorter term is used.
      The patient picks a due day between due_day_min and due_day_max; installment 1 falls on that day in the
      first month at least first_due_days_after_acceptance calendar days after the offer date, and never later
      than max_installment_due_days_from_offer days after it. Plans carry no interest (interest_rate_pct) and no
      setup_fee. The guarantor must be at least minimum_guarantor_age_years old; a minor's invoices go on the
      parent's or guardian's plan.
    eligibility:
      - id: no_recent_default
        applies_to: [plans_plan_created]
        kind: authorization
        condition: The patient may be offered a plan only if none of their other plans defaulted within the last default_free_history_months calendar months (plans_msr_prior_defaults is 0).
        evidence_fields: [payment_plans.defaulted_date, payment_plans.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.customer_id]]
          action_bindings: {payment_plans.customer_id: customer_id}
      - id: screening_on_file
        applies_to: [plans_plan_created]
        kind: authorization
        condition: A term whose assistance_screening_required is true is offered only when the patient has a financial-assistance case on file in any status.
        evidence_fields: [assistance_cases.customer_id, assistance_cases.assistance_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[assistance_cases.customer_id]]
          action_bindings: {assistance_cases.customer_id: customer_id}
      - id: min_installment
        applies_to: [plans_plan_created]
        kind: authorization
        condition: When the regular installment is below min_installment_amount, that term cannot be offered and a shorter term is used.
        evidence_fields: [invoices.balance_due, invoices.invoice_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[invoices.invoice_id]]
          action_bindings: {invoices.invoice_id: invoice_id}
    measures: [plans_msr_prior_defaults]
    params:
      per_tier:
        3-Month Payment Plan: {min_enrolled_balance: "=min_enrolled_balance", max_enrolled_balance: "=max_enrolled_balance", min_installment_amount: "=min_installment_amount", down_payment_pct: "=down_payment_pct", term_months: "=term_months"}
        6-Month Payment Plan: {min_enrolled_balance: "=min_enrolled_balance", max_enrolled_balance: "=max_enrolled_balance", min_installment_amount: "=min_installment_amount", down_payment_pct: "=down_payment_pct", term_months: "=term_months"}
        9-Month Payment Plan: {min_enrolled_balance: "=min_enrolled_balance", max_enrolled_balance: "=max_enrolled_balance", min_installment_amount: "=min_installment_amount", down_payment_pct: "=down_payment_pct", term_months: "=term_months"}
        12-Month Payment Plan: {min_enrolled_balance: "=min_enrolled_balance", max_enrolled_balance: "=max_enrolled_balance", min_installment_amount: "=min_installment_amount", down_payment_pct: "=down_payment_pct", term_months: "=term_months"}
        18-Month Payment Plan: {min_enrolled_balance: "=min_enrolled_balance", max_enrolled_balance: "=max_enrolled_balance", min_installment_amount: "=min_installment_amount", down_payment_pct: "=down_payment_pct", term_months: "=term_months"}
        24-Month Extended Payment Plan: {min_enrolled_balance: "=min_enrolled_balance", max_enrolled_balance: "=max_enrolled_balance", min_installment_amount: "=min_installment_amount", down_payment_pct: "=down_payment_pct", term_months: "=term_months"}
    formula:
      when_not: plan_balance < min_enrolled_balance or plan_balance > max_enrolled_balance
      down_payment_amount: round(plan_balance * down_payment_pct / 100, 2)
      installment_amount: round((plan_balance - down_payment_amount) / term_months, 2)

  - id: plans_evt_acceptance
    subject: [plans_terms_accepted, plans_offer_expired]
    rule: >-
      A plan takes effect only when the patient personally accepts its terms through one of acceptance_channels; an agent can offer a plan but cannot accept it for the patient.
      Acceptance must happen no later than acceptance_window_days calendar days after the plan was offered.
      The acceptance window counts calendar days with the offer date as day 0, and acceptance on the last day is on time.
      Any down payment is paid at acceptance. On acceptance the enrolled invoices move onto the plan and their
      statements stop; the written agreement follows within plan_agreement_business_days business days. An offer
      not accepted by the end of the window lapses and its invoices stay in the statement cycle.
    eligibility:
      - id: patient_accepts
        applies_to: [plans_terms_accepted]
        kind: caller_fact
        condition: A plan takes effect only when the patient personally accepts its terms through one of acceptance_channels; an agent can offer a plan but cannot accept it for the patient.
        evidence_fields: [payment_plans.status, payment_plans.plan_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[payment_plans.plan_id]]
          action_bindings: {payment_plans.plan_id: plan_id}
      - id: acceptance_window
        applies_to: [plans_terms_accepted]
        kind: time
        condition: Acceptance must happen no later than acceptance_window_days calendar days after the plan was offered.
        evidence_fields: [payment_plans.created_date, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.plan_id]]
          action_bindings: {payment_plans.plan_id: plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the plan was offered
          anchor_source: payment_plans.created_date
          relation: not_after
          duration_source: variants.acceptance_window_days
          unit: calendar_days
          counting_rule: The acceptance window counts calendar days with the offer date as day 0, and acceptance on the last day is on time.
          boundary: inclusive
    params:
      per_tier:
        3-Month Payment Plan: {acceptance_window_days: "=acceptance_window_days", acceptance_channels: "=acceptance_channels"}
        6-Month Payment Plan: {acceptance_window_days: "=acceptance_window_days", acceptance_channels: "=acceptance_channels"}
        9-Month Payment Plan: {acceptance_window_days: "=acceptance_window_days", acceptance_channels: "=acceptance_channels"}
        12-Month Payment Plan: {acceptance_window_days: "=acceptance_window_days", acceptance_channels: "=acceptance_channels"}
        18-Month Payment Plan: {acceptance_window_days: "=acceptance_window_days", acceptance_channels: "=acceptance_channels"}
        24-Month Extended Payment Plan: {acceptance_window_days: "=acceptance_window_days", acceptance_channels: "=acceptance_channels"}

  - id: plans_evt_invoice_eligibility
    subject: [plans_invoice_enrolled]
    rule: >-
      An invoice can be enrolled only while its own status is open; an invoice on hold, in collections, already on a plan, paid or closed cannot be enrolled.
      Its billing class must be in eligible_billing_classes and its balance due above 0.00. Invoices can be enrolled only while the plan status is pending_acceptance or active.
      After acceptance an invoice may be added only where add_invoice_allowed is true, only while the
      plan is active, without the plan carrying more than max_invoices_per_plan invoices and without the new plan
      balance exceeding max_enrolled_balance; the installment is then recomputed over the remaining installments
      when re_amortize_on_add is true, or the number of installments grows, by no more than
      max_term_extension_months_on_add months, when it is false. A balance that does not fit is not added; the
      invoice stays in the statement cycle. An invoice in collections must first be recalled under the invoice
      rules before it can be enrolled; a patient's request alone does not recall it.
    eligibility:
      - id: invoice_open
        applies_to: [plans_invoice_enrolled]
        kind: state
        condition: An invoice can be enrolled only while its own status is open; an invoice on hold, in collections, already on a plan, paid or closed cannot be enrolled.
        evidence_fields: [invoices.status, invoices.invoice_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[invoices.invoice_id]]
          action_bindings: {invoices.invoice_id: invoice_id}
        state_contract:
          field: invoices.status
          allowed: [open]
      - id: plan_open_for_enrollment
        applies_to: [plans_invoice_enrolled]
        kind: state
        condition: Invoices can be enrolled only while the plan status is pending_acceptance or active.
        evidence_fields: [payment_plans.status, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.plan_id]]
          action_bindings: {payment_plans.plan_id: plan_id}
        state_contract:
          field: payment_plans.status
          allowed: [pending_acceptance, active]
    params:
      per_tier:
        3-Month Payment Plan: {eligible_billing_classes: "=eligible_billing_classes", add_invoice_allowed: "=add_invoice_allowed", re_amortize_on_add: "=re_amortize_on_add", max_term_extension_months_on_add: "=max_term_extension_months_on_add"}
        6-Month Payment Plan: {eligible_billing_classes: "=eligible_billing_classes", add_invoice_allowed: "=add_invoice_allowed", re_amortize_on_add: "=re_amortize_on_add", max_term_extension_months_on_add: "=max_term_extension_months_on_add"}
        9-Month Payment Plan: {eligible_billing_classes: "=eligible_billing_classes", add_invoice_allowed: "=add_invoice_allowed", re_amortize_on_add: "=re_amortize_on_add", max_term_extension_months_on_add: "=max_term_extension_months_on_add"}
        12-Month Payment Plan: {eligible_billing_classes: "=eligible_billing_classes", add_invoice_allowed: "=add_invoice_allowed", re_amortize_on_add: "=re_amortize_on_add", max_term_extension_months_on_add: "=max_term_extension_months_on_add"}
        18-Month Payment Plan: {eligible_billing_classes: "=eligible_billing_classes", add_invoice_allowed: "=add_invoice_allowed", re_amortize_on_add: "=re_amortize_on_add", max_term_extension_months_on_add: "=max_term_extension_months_on_add"}
        24-Month Extended Payment Plan: {eligible_billing_classes: "=eligible_billing_classes", add_invoice_allowed: "=add_invoice_allowed", re_amortize_on_add: "=re_amortize_on_add", max_term_extension_months_on_add: "=max_term_extension_months_on_add"}

  - id: plans_evt_installments
    subject: [plans_installment_paid, plans_installment_missed]
    rule: >-
      Installments fall due monthly on due_day_of_month. A payment can be applied to a plan only while its status is active, past_due or defaulted, and on a defaulted plan only as the arrears payment that precedes a reinstatement.
      Manual payments use manual_payment_methods; automatic draws use autopay_methods and a failed draw is
      retried once autopay_retry_days later. A payment below the installment due counts toward it only when
      partial_installment_accepted is true; otherwise it is applied as extra principal and the installment is
      still owed. Extra principal reduces the balance without moving the schedule when extra_principal_allowed is
      true. An installment unpaid grace_days calendar days after its due date (due date = day 0) is recorded
      missed on the following day; an installment whose payment is returned counts as missed when
      returned_installment_counts_as_missed is true. A payoff of the whole plan balance carries no
      early_payoff_penalty, and a payoff quote is valid payoff_quote_valid_days. No prompt-pay discount is ever
      given on a plan balance (prompt_pay_discount_on_plan is false). While the plan is active or past_due its
      invoices are never placed in collections when collections_suspended_while_current is true.
    eligibility:
      - id: payable_plan
        applies_to: [plans_installment_paid]
        kind: state
        condition: A payment can be applied to a plan only while its status is active, past_due or defaulted, and on a defaulted plan only as the arrears payment that precedes a reinstatement.
        evidence_fields: [payment_plans.status, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.plan_id]]
          action_bindings: {payment_plans.plan_id: plan_id}
        state_contract:
          field: payment_plans.status
          allowed: [active, past_due, defaulted]
    params:
      per_tier:
        3-Month Payment Plan: {grace_days: "=grace_days", partial_installment_accepted: "=partial_installment_accepted", autopay_retry_days: "=autopay_retry_days"}
        6-Month Payment Plan: {grace_days: "=grace_days", partial_installment_accepted: "=partial_installment_accepted", autopay_retry_days: "=autopay_retry_days"}
        9-Month Payment Plan: {grace_days: "=grace_days", partial_installment_accepted: "=partial_installment_accepted", autopay_retry_days: "=autopay_retry_days"}
        12-Month Payment Plan: {grace_days: "=grace_days", partial_installment_accepted: "=partial_installment_accepted", autopay_retry_days: "=autopay_retry_days"}
        18-Month Payment Plan: {grace_days: "=grace_days", partial_installment_accepted: "=partial_installment_accepted", autopay_retry_days: "=autopay_retry_days"}
        24-Month Extended Payment Plan: {grace_days: "=grace_days", partial_installment_accepted: "=partial_installment_accepted", autopay_retry_days: "=autopay_retry_days"}

  - id: plans_evt_delinquency
    subject: [plans_marked_past_due, plans_cured, plans_defaulted]
    rule: >-
      A plan becomes past_due when an installment is recorded missed, and a past-due notice goes out within
      past_due_notice_business_days business days. It becomes current again only when every past-due installment
      is paid in full (cure_requires_full_past_due). When the count of consecutive missed installments
      (plans_msr_consecutive_missed) reaches missed_installments_to_default, the plan defaults; a default notice
      goes out within default_notice_business_days business days, the whole remaining plan balance is released
      back to its invoices, and the invoices follow default_balance_handling: resume_statement_cycle resumes the
      statement cycle at the next unused position, final_notice_immediately issues the final notice next. A
      deferred installment is never counted as missed.
    eligibility: []
    measures: [plans_msr_consecutive_missed]
    params:
      per_tier:
        3-Month Payment Plan: {missed_installments_to_default: "=missed_installments_to_default", default_balance_handling: "=default_balance_handling"}
        6-Month Payment Plan: {missed_installments_to_default: "=missed_installments_to_default", default_balance_handling: "=default_balance_handling"}
        9-Month Payment Plan: {missed_installments_to_default: "=missed_installments_to_default", default_balance_handling: "=default_balance_handling"}
        12-Month Payment Plan: {missed_installments_to_default: "=missed_installments_to_default", default_balance_handling: "=default_balance_handling"}
        18-Month Payment Plan: {missed_installments_to_default: "=missed_installments_to_default", default_balance_handling: "=default_balance_handling"}
        24-Month Extended Payment Plan: {missed_installments_to_default: "=missed_installments_to_default", default_balance_handling: "=default_balance_handling"}

  - id: plans_evt_reinstatement
    subject: [plans_reinstated]
    rule: >-
      A defaulted plan can be reinstated only while its reinstatement_count is below reinstatements_allowed.
      Reinstatement is possible only within reinstatement_window_days calendar days after the default date.
      The reinstatement window counts calendar days with the default date as day 0, and a reinstatement on the last day is on time.
      The patient must first pay every missed installment in full; on reinstatement the balances released at default are enrolled again on
      the same plan from the invoices that are still open, with the original schedule, and the invoices leave the
      statement cycle again. An invoice placed in collections since the default is not re-enrolled.
    eligibility:
      - id: reinstatement_window
        applies_to: [plans_reinstated]
        kind: time
        condition: Reinstatement is possible only within reinstatement_window_days calendar days after the default date.
        evidence_fields: [payment_plans.defaulted_date, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.plan_id]]
          action_bindings: {payment_plans.plan_id: plan_id}
        temporal_basis:
          clock: frozen_time
          anchor_event: the default date
          anchor_source: payment_plans.defaulted_date
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: The reinstatement window counts calendar days with the default date as day 0, and a reinstatement on the last day is on time.
          boundary: inclusive
      - id: reinstatement_count
        applies_to: [plans_reinstated]
        kind: authorization
        condition: A defaulted plan can be reinstated only while its reinstatement_count is below reinstatements_allowed.
        evidence_fields: [payment_plans.reinstatement_count, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.plan_id]]
          action_bindings: {payment_plans.plan_id: plan_id}
    params:
      per_tier:
        3-Month Payment Plan: {reinstatements_allowed: "=reinstatements_allowed", reinstatement_window_days: "=reinstatement_window_days"}
        6-Month Payment Plan: {reinstatements_allowed: "=reinstatements_allowed", reinstatement_window_days: "=reinstatement_window_days"}
        9-Month Payment Plan: {reinstatements_allowed: "=reinstatements_allowed", reinstatement_window_days: "=reinstatement_window_days"}
        12-Month Payment Plan: {reinstatements_allowed: "=reinstatements_allowed", reinstatement_window_days: "=reinstatement_window_days"}
        18-Month Payment Plan: {reinstatements_allowed: "=reinstatements_allowed", reinstatement_window_days: "=reinstatement_window_days"}
        24-Month Extended Payment Plan: {reinstatements_allowed: "=reinstatements_allowed", reinstatement_window_days: "=reinstatement_window_days"}
    formula:
      when_not: reinstatement_count >= reinstatements_allowed

  - id: plans_evt_schedule_changes
    subject: [plans_schedule_changed, plans_installment_deferred]
    rule: >-
      The schedule of a plan can be changed only while the plan status is active.
      The due day may be changed at most due_day_changes_allowed times, to a day between due_day_min and
      due_day_max; the change applies from the next installment not yet due. Automatic payment may be switched
      between autopay_methods at any time, but cannot be turned off on a term whose autopay_required is true. A
      hardship skip defers one not-yet-due installment to after the last installment, extending the plan by one
      month; at most hardship_skips_allowed skips are granted per plan (plans_msr_hardship_skips_used), and only
      with a supporting document when hardship_skip_requires_documentation is true. A skip does not change the
      installment amount.
    eligibility:
      - id: change_active_only
        applies_to: [plans_schedule_changed, plans_installment_deferred]
        kind: state
        condition: The schedule of a plan can be changed only while the plan status is active.
        evidence_fields: [payment_plans.status, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.plan_id]]
          action_bindings: {payment_plans.plan_id: plan_id}
        state_contract:
          field: payment_plans.status
          allowed: [active]
    measures: [plans_msr_hardship_skips_used]
    params:
      per_tier:
        3-Month Payment Plan: {due_day_changes_allowed: "=due_day_changes_allowed", hardship_skips_allowed: "=hardship_skips_allowed", autopay_required: "=autopay_required"}
        6-Month Payment Plan: {due_day_changes_allowed: "=due_day_changes_allowed", hardship_skips_allowed: "=hardship_skips_allowed", autopay_required: "=autopay_required"}
        9-Month Payment Plan: {due_day_changes_allowed: "=due_day_changes_allowed", hardship_skips_allowed: "=hardship_skips_allowed", autopay_required: "=autopay_required"}
        12-Month Payment Plan: {due_day_changes_allowed: "=due_day_changes_allowed", hardship_skips_allowed: "=hardship_skips_allowed", autopay_required: "=autopay_required"}
        18-Month Payment Plan: {due_day_changes_allowed: "=due_day_changes_allowed", hardship_skips_allowed: "=hardship_skips_allowed", autopay_required: "=autopay_required"}
        24-Month Extended Payment Plan: {due_day_changes_allowed: "=due_day_changes_allowed", hardship_skips_allowed: "=hardship_skips_allowed", autopay_required: "=autopay_required"}
    formula:
      when_not: due_day_changes >= due_day_changes_allowed

  - id: plans_evt_release_and_assistance
    subject: [plans_balance_released]
    rule: >-
      A share of the plan balance is released back to an invoice for exactly one reason: plan_cancelled or
      plan_defaulted (the invoice's whole remaining share), financial_assistance_adjustment (the discount an
      approved assistance award takes off an enrolled invoice), or insurance_reprocessing_credit (a payer payment
      received after enrollment that reduces the patient's responsibility). A release can be booked only on a plan whose status is active, past_due, defaulted or cancelled.
      After a financial_assistance_adjustment or insurance_reprocessing_credit release the plan keeps running: the
      installment is recomputed over the remaining installments when assistance_adjustment_reamortizes is true,
      otherwise the installment stays and the plan ends sooner; a release that brings the plan balance to zero
      pays the plan off, and any amount the patient already paid above the reduced balance becomes a credit on the
      invoice under the invoice credit-balance rule.
    eligibility:
      - id: release_states
        applies_to: [plans_balance_released]
        kind: state
        condition: A release can be booked only on a plan whose status is active, past_due, defaulted or cancelled.
        evidence_fields: [payment_plans.status, payment_plans.plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys: [[payment_plans.plan_id]]
          action_bindings: {payment_plans.plan_id: plan_id}
        state_contract:
          field: payment_plans.status
          allowed: [active, past_due, defaulted, cancelled]
    params:
      per_tier:
        3-Month Payment Plan: {assistance_adjustment_reamortizes: "=assistance_adjustment_reamortizes"}
        6-Month Payment Plan: {assistance_adjustment_reamortizes: "=assistance_adjustment_reamortizes"}
        9-Month Payment Plan: {assistance_adjustment_reamortizes: "=assistance_adjustment_reamortizes"}
        12-Month Payment Plan: {assistance_adjustment_reamortizes: "=assistance_adjustment_reamortizes"}
        18-Month Payment Plan: {assistance_adjustment_reamortizes: "=assistance_adjustment_reamortizes"}
        24-Month Extended Payment Plan: {assistance_adjustment_reamortizes: "=assistance_adjustment_reamortizes"}

  - id: plans_evt_cancellation_and_payoff
    subject: [plans_cancelled_by_patient, plans_paid_off]
    rule: >-
      The patient may end an active or past-due plan at any time; only the patient can end it, and an agent cannot cancel it on the patient's behalf.
      On cancellation the whole remaining balance is released to the invoices, which return to the statement cycle
      at the next unused position; installments already paid stay applied. A plan whose balance reaches zero is
      paid off, and when payoff_closes_invoices is true every invoice it carried is paid. Neither ending carries a
      fee, and a balance on a current plan is never reported to credit bureaus (credit_reporting_while_current is
      false).
    eligibility:
      - id: patient_ends_plan
        applies_to: [plans_cancelled_by_patient]
        kind: caller_fact
        condition: The patient may end an active or past-due plan at any time; only the patient can end it, and an agent cannot cancel it on the patient's behalf.
        evidence_fields: [payment_plans.status, payment_plans.plan_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys: [[payment_plans.plan_id]]
          action_bindings: {payment_plans.plan_id: plan_id}
    params:
      per_tier:
        3-Month Payment Plan: {payoff_closes_invoices: "=payoff_closes_invoices", credit_reporting_while_current: "=credit_reporting_while_current"}
        6-Month Payment Plan: {payoff_closes_invoices: "=payoff_closes_invoices", credit_reporting_while_current: "=credit_reporting_while_current"}
        9-Month Payment Plan: {payoff_closes_invoices: "=payoff_closes_invoices", credit_reporting_while_current: "=credit_reporting_while_current"}
        12-Month Payment Plan: {payoff_closes_invoices: "=payoff_closes_invoices", credit_reporting_while_current: "=credit_reporting_while_current"}
        18-Month Payment Plan: {payoff_closes_invoices: "=payoff_closes_invoices", credit_reporting_while_current: "=credit_reporting_while_current"}
        24-Month Extended Payment Plan: {payoff_closes_invoices: "=payoff_closes_invoices", credit_reporting_while_current: "=credit_reporting_while_current"}

extended_policies:
  - id: plans_ext_catch_up_payment
    base_policy_refs: [plans_evt_installments, plans_evt_delinquency]
    overwrite:
      - base_policy: plans_evt_installments
        superseded_clause: >-
          A payment below the installment due counts toward it only when partial_installment_accepted is true; otherwise it is applied as extra principal and the installment is still owed.
        replaced_by: >-
          An extra-principal payment posted on the plan ledger against the latest missed installment, carrying that installment's number, counts toward the catch-up payment as this rule sets out, even where it is smaller than an installment; an extra-principal payment carrying no installment number reduces the balance without moving the schedule and never counts toward the catch-up payment.
    trigger: state_due
    subject: [plans_installment_paid]
    computes: amount
    target_tool: pay_catch_up_2a071954
    params:
      share_half: 0.5
      share_three_quarters: 0.75
      share_full: 1.0
      household_large: 3
      missed_many: 2
      cap_quarter: 0.25
      cap_half: 0.5
      cap_full: 1.0
      standing_high: 9
      standing_low: 6
      minimum_quarter: 0.25
      minimum_half: 0.5
      minimum_full: 1.0
      seasoned_months: 6
    rule: >-
      A catch-up payment is the payment a patient makes to bring a past-due plan back to current standing; it is
      posted on the plan ledger as an arrears payment against the plan's latest missed installment.
      An extra-principal payment posted on the plan ledger against the latest missed installment, carrying that installment's number, counts toward the catch-up payment as this rule sets out, even where it is smaller than an installment; an extra-principal payment carrying no installment number reduces the balance without moving the schedule and never counts toward the catch-up payment.
      The catch-up payment is the amounts of every installment recorded missed on the plan ledger, less every arrears payment already posted on the plan ledger, less the catch-up credit, and it is never less than the catch-up minimum, which is one full regular installment of the plan; when the amount worked out is lower, the catch-up payment is the catch-up minimum.
      The catch-up credit is one half of all the extra-principal payments posted against the latest missed installment, but never more than one quarter of the regular installment.
      The catch-up credit is worked out first and the cap on it applied, the missed amounts less the arrears payments less the credit are worked out next, and the catch-up minimum is compared with that result; every amount is taken to the nearest cent, an exact half cent being rounded up.
      Which of the extra-principal payments posted against the latest missed installment the catch-up credit counts depends on how often the plan has fallen behind: on a plan with 2 or more installments recorded missed less than 12 whole months before today whose installments are drawn automatically from a bank account, only the largest single one of them; on a plan with 2 or more installments recorded missed in that span whose installments are not drawn automatically from a bank account, only the most recent one of them; on any other plan, all of them.
      The share of the counted payments that the catch-up credit takes depends on the patient's financial-assistance award and household: for a patient with an approved financial-assistance award and a household of 3 or more on the assistance case, the whole of them; for a patient with an approved award and a household of fewer than 3, three quarters of them; for any other patient, one half of them.
      The cap on the catch-up credit depends on the plan's payment record: for a plan with 9 or more scheduled installments paid less than 12 whole months before today it is one full regular installment; for a plan with 6 to 8 scheduled installments paid in that span it is one half of the regular installment; for any other plan it is one quarter of the regular installment.
      The catch-up minimum depends on the plan's seasoning: for a plan with automatic payments set up that was accepted at least 6 whole months before today it is one quarter of the regular installment; for a plan without automatic payments that was accepted at least 6 whole months before today it is one half of the regular installment; for any other plan it is one full regular installment.
    prerequisite: []
    cross_category:
      - category: assistance
        as: branch
        reads: [status, household_size]
        note: The approved award and the household size on the assistance case decide the share of the counted payments that the catch-up credit takes.
    compute:
      - b_inst: "F('installment_amount')"
      - b_missed: "SUM('plan_transactions', 'amount', event_type='plans_installment_missed')"
      - b_cured: "SUM('plan_transactions', 'amount', event_type='plans_installment_paid', payment_type='arrears_cure')"
      - b_latest_missed_no: "LATEST('plan_transactions', 'installment_number', event_type='plans_installment_missed')"
      - b_against_all: "SUM('plan_transactions', 'amount', event_type='plans_installment_paid', payment_type='additional_principal', installment_number=b_latest_missed_no)"
      - b_against_largest: "MAX('plan_transactions', 'amount', event_type='plans_installment_paid', payment_type='additional_principal', installment_number=b_latest_missed_no)"
      - b_against_latest: "LATEST('plan_transactions', 'amount', event_type='plans_installment_paid', payment_type='additional_principal', installment_number=b_latest_missed_no) or 0.0"
      - b_bank: "F('autopay_enrolled') == True and F('autopay_method') == 'ach_bank_transfer'"
      - b_missed12: "COUNT('plan_transactions', within_months=12, event_type='plans_installment_missed')"
      - b_counted: "b_against_largest if (b_missed12 >= K('missed_many') and b_bank) else (b_against_latest if (b_missed12 >= K('missed_many') and not b_bank) else b_against_all)"
      - b_award: "EXISTS('assistance', status='approved')"
      - b_household: "CFIELD('assistance', 'household_size', status='approved') if b_award else 0"
      - b_share: "K('share_full') if (b_award and b_household >= K('household_large')) else (K('share_three_quarters') if (b_award and b_household < K('household_large')) else K('share_half'))"
      - b_scheduled12: "COUNT('plan_transactions', within_months=12, event_type='plans_installment_paid', payment_type='scheduled_installment')"
      - b_cap_share: "K('cap_full') if b_scheduled12 >= K('standing_high') else (K('cap_half') if (b_scheduled12 >= K('standing_low') and b_scheduled12 < K('standing_high')) else K('cap_quarter'))"
      - b_age: "MONTHS(F('accepted_date'), NOW)"
      - b_min_share: "K('minimum_quarter') if (F('autopay_enrolled') == True and b_age >= K('seasoned_months')) else (K('minimum_half') if (F('autopay_enrolled') != True and b_age >= K('seasoned_months')) else K('minimum_full'))"
      - b_credit: "MN(RND(b_counted * b_share, 2), RND(b_inst * b_cap_share, 2))"
      - b_minimum: "RND(b_inst * b_min_share, 2)"
      - result: "MX(RND(b_missed - b_cured - b_credit, 2), b_minimum)"
    compute_basis:
      b_inst: "one full regular installment of the plan"
      b_missed: "The catch-up payment is the amounts of every installment recorded missed on the plan ledger"
      b_cured: "less every arrears payment already posted on the plan ledger"
      b_latest_missed_no: "An extra-principal payment posted on the plan ledger against the latest missed installment, carrying that installment's number"
      b_against_all: "on any other plan, all of them."
      b_against_largest: "only the largest single one of them"
      b_against_latest: "only the most recent one of them"
      b_bank: "whose installments are drawn automatically from a bank account"
      b_missed12: "on a plan with 2 or more installments recorded missed less than 12 whole months before today"
      b_counted: "Which of the extra-principal payments posted against the latest missed installment the catch-up credit counts depends on how often the plan has fallen behind: on a plan with 2 or more installments recorded missed less than 12 whole months before today whose installments are drawn automatically from a bank account, only the largest single one of them; on a plan with 2 or more installments recorded missed in that span whose installments are not drawn automatically from a bank account, only the most recent one of them; on any other plan, all of them."
      b_award: "for a patient with an approved financial-assistance award"
      b_household: "and a household of 3 or more on the assistance case"
      b_share: "The share of the counted payments that the catch-up credit takes depends on the patient's financial-assistance award and household: for a patient with an approved financial-assistance award and a household of 3 or more on the assistance case, the whole of them; for a patient with an approved award and a household of fewer than 3, three quarters of them; for any other patient, one half of them."
      b_scheduled12: "for a plan with 9 or more scheduled installments paid less than 12 whole months before today"
      b_cap_share: "The cap on the catch-up credit depends on the plan's payment record: for a plan with 9 or more scheduled installments paid less than 12 whole months before today it is one full regular installment; for a plan with 6 to 8 scheduled installments paid in that span it is one half of the regular installment; for any other plan it is one quarter of the regular installment."
      b_age: "that was accepted at least 6 whole months before today"
      b_min_share: "The catch-up minimum depends on the plan's seasoning: for a plan with automatic payments set up that was accepted at least 6 whole months before today it is one quarter of the regular installment; for a plan without automatic payments that was accepted at least 6 whole months before today it is one half of the regular installment; for any other plan it is one full regular installment."
      b_credit: "The catch-up credit is one half of all the extra-principal payments posted against the latest missed installment, but never more than one quarter of the regular installment. The catch-up credit is worked out first and the cap on it applied"
      b_minimum: "it is never less than the catch-up minimum, which is one full regular installment of the plan"
      result: "The catch-up payment is the amounts of every installment recorded missed on the plan ledger, less every arrears payment already posted on the plan ledger, less the catch-up credit, and it is never less than the catch-up minimum, which is one full regular installment of the plan; when the amount worked out is lower, the catch-up payment is the catch-up minimum. The catch-up credit is worked out first and the cap on it applied, the missed amounts less the arrears payments less the credit are worked out next, and the catch-up minimum is compared with that result; every amount is taken to the nearest cent, an exact half cent being rounded up."
    factors:
      - id: catch_up_credit_selection
        effect: method
        decides: b_counted
        bindings: [b_against_largest, b_against_latest, b_missed12, b_counted]
        ladder:
          - when: "2 or more installments recorded missed in the last 12 whole months and installments drawn automatically from a bank account"
            method: "only the largest single extra-principal payment posted against the latest missed installment is counted"
          - when: "2 or more installments recorded missed in the last 12 whole months and installments not drawn automatically from a bank account"
            method: "only the most recent extra-principal payment posted against the latest missed installment is counted"
          - when: "otherwise"
            method: "all the extra-principal payments posted against the latest missed installment are counted"
        baseline:
          b_counted: "b_against_all"
        evidence: [history]
        cross_difficulty: null
      - id: catch_up_credit_share
        effect: parameter
        decides: b_share
        bindings: [b_award, b_household, b_share]
        ladder:
          - when: "an approved financial-assistance award and a household of 3 or more on the assistance case"
            value: "K('share_full') — the whole of the counted payments"
          - when: "an approved financial-assistance award and a household of fewer than 3"
            value: "K('share_three_quarters') — three quarters of the counted payments"
          - when: "otherwise"
            value: "K('share_half') — one half of the counted payments"
        baseline:
          b_share: "K('share_half')"
        evidence: [cross_category]
        cross_difficulty: assistance
      - id: catch_up_credit_cap
        effect: parameter
        decides: b_cap_share
        bindings: [b_scheduled12, b_cap_share]
        ladder:
          - when: "9 or more scheduled installments paid in the last 12 whole months"
            value: "K('cap_full') — one full regular installment"
          - when: "6 to 8 scheduled installments paid in the last 12 whole months"
            value: "K('cap_half') — one half of the regular installment"
          - when: "otherwise"
            value: "K('cap_quarter') — one quarter of the regular installment"
        baseline:
          b_cap_share: "K('cap_quarter')"
        evidence: [history]
        cross_difficulty: null
      - id: catch_up_minimum
        effect: parameter
        decides: b_min_share
        bindings: [b_age, b_min_share]
        ladder:
          - when: "automatic payments set up and the plan accepted at least 6 whole months before today"
            value: "K('minimum_quarter') — one quarter of the regular installment"
          - when: "no automatic payments and the plan accepted at least 6 whole months before today"
            value: "K('minimum_half') — one half of the regular installment"
          - when: "otherwise"
            value: "K('minimum_full') — one full regular installment"
        baseline:
          b_min_share: "K('minimum_full')"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The catch-up payment is the amounts of every installment recorded missed on the plan ledger, less every arrears payment already posted on the plan ledger, less the catch-up credit, and it is never less than the catch-up minimum, which is one full regular installment of the plan; when the amount worked out is lower, the catch-up payment is the catch-up minimum.
        The catch-up credit is one half of all the extra-principal payments posted against the latest missed installment, but never more than one quarter of the regular installment.
        The catch-up credit is worked out first and the cap on it applied, the missed amounts less the arrears payments less the credit are worked out next, and the catch-up minimum is compared with that result; every amount is taken to the nearest cent, an exact half cent being rounded up.
      params: [share_half, cap_quarter, minimum_full]
    inputs:
      history:
        - {table: plan_transactions, aggregate: sum, field: amount, filters: {event_type: plans_installment_missed}}
        - {table: plan_transactions, aggregate: sum, field: amount, filters: {event_type: plans_installment_paid, payment_type: arrears_cure}}
        - {table: plan_transactions, aggregate: sum, field: amount, filters: {event_type: plans_installment_paid, payment_type: additional_principal}}
        - {table: plan_transactions, aggregate: count, field: plan_transaction_id, within_months: 12, filters: {event_type: plans_installment_paid, payment_type: scheduled_installment}}
        - {table: plan_transactions, aggregate: count, field: plan_transaction_id, within_months: 12, filters: {event_type: plans_installment_missed}}
      cross_category: [assistance]
  - id: plans_ext_add_on_down_payment
    base_policy_refs: [plans_evt_installments, plans_term_selection_and_terms]
    overwrite: []
    trigger: on_request
    subject: [plans_installment_paid]
    computes: amount
    target_tool: pay_add_on_down_payment_958d6e13
    params:
      rate_award: 5.0
      rate_standing: 7.5
      award_mid: 50
      standing_count: 6
      class_insured: 0.5
      class_out_of_network: 0.75
      missed_months: 12
      raise_each: 1.25
      missed_many: 2
      raise_half: 1.5
      raise_quarter: 1.25
      invoices_many: 3
      invoices_two: 2
      invoices_raise_half: 1.5
      invoices_raise_quarter: 1.25
      minimum_bank: 5.0
      minimum_card: 10.0
      minimum_standard: 25.0
    rule: >-
      An add-on down payment is owed when an invoice is added to a plan already accepted whose term carries a down
      payment, that is a term whose down-payment percentage is above zero; on a term without a down payment none is
      owed. It is paid by the patient, it belongs to the invoice being added, and it is posted on the plan ledger as a
      down payment dated the day it is paid.
      The add-on down payment is the plan term's down-payment percentage of the balance due on the invoice being added, raised by one quarter when one installment was recorded missed on the plan less than 12 whole months before today and by one half when two or more were, the product rounded to the nearest cent, an exact half cent being rounded up.
      The add-on down payment is never less than the add-on minimum of 25.00; when the amount worked out is lower, the add-on down payment is the add-on minimum.
      The percentage applied to an add-on down payment depends on the patient's standing: for a patient with an approved financial-assistance award of 50 percent or more and at least 6 scheduled installments paid less than 12 whole months before today it is 5 percent; for a patient with an approved award whose discount percentage is below 50 percent (a hardship adjustment included) and at least 6 scheduled installments paid in that span it is 7.5 percent; for any other patient it is the plan term's down-payment percentage.
      The add-on down payment is scaled by the billing class of the invoice being added: by one half for an Insured Patient Responsibility Invoice or a Medicare Beneficiary Liability Invoice, by three quarters for an Out-of-Network Balance Invoice, and not at all for any other class.
      The add-on down payment is also scaled by the number of invoices the plan already carries: by one and a half when 3 or more invoices have been enrolled on the plan, by one and a quarter when exactly 2 have, and not at all when one has.
      How missed installments raise the add-on down payment depends on how the plan's installments are drawn and on its payment record: for a plan drawn automatically from a bank account with at least 6 scheduled installments paid less than 12 whole months before today, only the latest missed installment raises it, by one quarter, however many were recorded in that span; for a plan drawn automatically from a credit or debit card with at least 6 scheduled installments paid in that span, every missed installment recorded in that span raises it by one quarter of the amount already raised, the raises compounding; for any other plan the raise is one quarter for one missed installment and one half for two or more.
      The add-on minimum depends on how the plan's most recent scheduled installment was paid: 5.00 when it was paid by bank transfer, 10.00 when it was paid by credit or debit card, and 25.00 when it was paid any other way or no scheduled installment has been paid.
      The percentage, the class scale, the missed-installment raise and the invoice-count scale are multiplied together with the balance due on the invoice being added, the product is rounded to the nearest cent, an exact half cent being rounded up, and only then is it compared with the add-on minimum.
    prerequisite: []
    cross_category:
      - category: assistance
        as: branch
        reads: [status, discount_pct]
        note: The discount percentage of the patient's approved financial-assistance award decides which down-payment percentage applies to the invoice being added.
      - category: invoices
        as: branch
        reads: [status, balance_due, variant_name]
        note: The balance due and the billing class of the patient's open invoice being added set the base of the add-on down payment and its class scale.
    compute:
      - s_added: "CFIELD('invoices', 'balance_due', status='open')"
      - s_award: "EXISTS('assistance', status='approved')"
      - s_apct: "CPARAM('assistance', 'discount_pct', status='approved') if s_award else 0"
      - s_sched12: "COUNT('plan_transactions', within_months=12, event_type='plans_installment_paid', payment_type='scheduled_installment')"
      - s_rate: "K('rate_award') if (s_award and s_apct >= K('award_mid') and s_sched12 >= K('standing_count')) else (K('rate_standing') if (s_award and s_apct < K('award_mid') and s_sched12 >= K('standing_count')) else P('down_payment_pct'))"
      - s_class: "CFIELD('invoices', 'variant_name', status='open')"
      - s_class_scale: "K('class_insured') if (s_class == 'Insured Patient Responsibility Invoice' or s_class == 'Medicare Beneficiary Liability Invoice') else (K('class_out_of_network') if s_class == 'Out-of-Network Balance Invoice' else 1.0)"
      - s_missed: "COUNT('plan_transactions', within_months=K('missed_months'), event_type='plans_installment_missed')"
      - s_step_raise: "K('raise_half') if s_missed >= K('missed_many') else (K('raise_quarter') if s_missed == 1 else 1.0)"
      - s_missed_raise: "(K('raise_quarter') if s_missed >= 1 else 1.0) if (F('autopay_enrolled') == True and F('autopay_method') == 'ach_bank_transfer' and s_sched12 >= K('standing_count')) else ((K('raise_each') ** s_missed) if (F('autopay_enrolled') == True and (F('autopay_method') == 'credit_card' or F('autopay_method') == 'debit_card') and s_sched12 >= K('standing_count')) else s_step_raise)"
      - s_invoices: "COUNT('plan_transactions', event_type='plans_invoice_enrolled')"
      - s_invoice_scale: "K('invoices_raise_half') if s_invoices >= K('invoices_many') else (K('invoices_raise_quarter') if s_invoices == K('invoices_two') else 1.0)"
      - s_last_method: "LATEST('plan_transactions', 'payment_method', event_type='plans_installment_paid', payment_type='scheduled_installment')"
      - s_minimum: "K('minimum_bank') if s_last_method == 'ach_bank_transfer' else (K('minimum_card') if (s_last_method == 'credit_card' or s_last_method == 'debit_card') else K('minimum_standard'))"
      - result: "MX(RND(s_added * s_rate / 100 * s_class_scale * s_missed_raise * s_invoice_scale, 2), s_minimum) if P('down_payment_pct') > 0 else 0.0"
    compute_basis:
      s_added: "the balance due on the invoice being added"
      s_award: "for a patient with an approved financial-assistance award"
      s_apct: "for a patient with an approved financial-assistance award of 50 percent or more"
      s_sched12: "at least 6 scheduled installments paid less than 12 whole months before today"
      s_rate: "The percentage applied to an add-on down payment depends on the patient's standing: for a patient with an approved financial-assistance award of 50 percent or more and at least 6 scheduled installments paid less than 12 whole months before today it is 5 percent; for a patient with an approved award whose discount percentage is below 50 percent (a hardship adjustment included) and at least 6 scheduled installments paid in that span it is 7.5 percent; for any other patient it is the plan term's down-payment percentage."
      s_class: "scaled by the billing class of the invoice being added"
      s_class_scale: "The add-on down payment is scaled by the billing class of the invoice being added: by one half for an Insured Patient Responsibility Invoice or a Medicare Beneficiary Liability Invoice, by three quarters for an Out-of-Network Balance Invoice, and not at all for any other class."
      s_missed: "when one installment was recorded missed on the plan less than 12 whole months before today"
      s_step_raise: "raised by one quarter when one installment was recorded missed on the plan less than 12 whole months before today and by one half when two or more were"
      s_missed_raise: "How missed installments raise the add-on down payment depends on how the plan's installments are drawn and on its payment record: for a plan drawn automatically from a bank account with at least 6 scheduled installments paid less than 12 whole months before today, only the latest missed installment raises it, by one quarter, however many were recorded in that span; for a plan drawn automatically from a credit or debit card with at least 6 scheduled installments paid in that span, every missed installment recorded in that span raises it by one quarter of the amount already raised, the raises compounding; for any other plan the raise is one quarter for one missed installment and one half for two or more."
      s_invoices: "the number of invoices the plan already carries"
      s_invoice_scale: "The add-on down payment is also scaled by the number of invoices the plan already carries: by one and a half when 3 or more invoices have been enrolled on the plan, by one and a quarter when exactly 2 have, and not at all when one has."
      s_last_method: "how the plan's most recent scheduled installment was paid"
      s_minimum: "The add-on minimum depends on how the plan's most recent scheduled installment was paid: 5.00 when it was paid by bank transfer, 10.00 when it was paid by credit or debit card, and 25.00 when it was paid any other way or no scheduled installment has been paid."
      result: "The percentage, the class scale, the missed-installment raise and the invoice-count scale are multiplied together with the balance due on the invoice being added, the product is rounded to the nearest cent, an exact half cent being rounded up, and only then is it compared with the add-on minimum. An add-on down payment is owed when an invoice is added to a plan already accepted whose term carries a down payment, that is a term whose down-payment percentage is above zero; on a term without a down payment none is owed."
    factors:
      - id: add_on_down_payment_rate
        effect: parameter
        decides: s_rate
        bindings: [s_apct, s_sched12, s_rate]
        ladder:
          - when: "an approved financial-assistance award of 50 percent or more and at least 6 scheduled installments paid in the last 12 whole months"
            value: "K('rate_award') — 5 percent"
          - when: "an approved award below 50 percent and at least 6 scheduled installments paid in the last 12 whole months"
            value: "K('rate_standing') — 7.5 percent"
          - when: "otherwise"
            value: "P('down_payment_pct') — the plan term's down-payment percentage"
        baseline:
          s_rate: "P('down_payment_pct')"
        evidence: [cross_category, history, tier_param]
        cross_difficulty: assistance
      - id: add_on_class_scale
        effect: parameter
        decides: s_class_scale
        bindings: [s_class, s_class_scale]
        ladder:
          - when: "the invoice being added is an Insured Patient Responsibility Invoice or a Medicare Beneficiary Liability Invoice"
            value: "K('class_insured') — one half"
          - when: "the invoice being added is an Out-of-Network Balance Invoice"
            value: "K('class_out_of_network') — three quarters"
          - when: "otherwise"
            value: "1.0 — not scaled"
        baseline:
          s_class_scale: "1.0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: add_on_missed_raise
        effect: method
        decides: s_missed_raise
        bindings: [s_missed, s_missed_raise]
        ladder:
          - when: "installments drawn automatically from a bank account and at least 6 scheduled installments paid in the last 12 whole months"
            method: "only the latest missed installment raises the add-on down payment, by one quarter, whatever the number of missed installments"
          - when: "installments drawn automatically from a credit or debit card and at least 6 scheduled installments paid in the last 12 whole months"
            method: "each missed installment of the last 12 whole months raises the amount by one quarter of the amount already raised, compounding"
          - when: "otherwise"
            method: "a step raise: one quarter for one missed installment, one half for two or more"
        baseline:
          s_missed_raise: "s_step_raise"
        evidence: [history]
        cross_difficulty: null
      - id: add_on_invoice_count_scale
        effect: parameter
        decides: s_invoice_scale
        bindings: [s_invoices, s_invoice_scale]
        ladder:
          - when: "3 or more invoices enrolled on the plan"
            value: "K('invoices_raise_half') — one and a half"
          - when: "exactly 2 invoices enrolled on the plan"
            value: "K('invoices_raise_quarter') — one and a quarter"
          - when: "otherwise"
            value: "1.0 — not scaled"
        baseline:
          s_invoice_scale: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: add_on_minimum
        effect: parameter
        decides: s_minimum
        bindings: [s_last_method, s_minimum]
        ladder:
          - when: "the plan's most recent scheduled installment was paid by bank transfer"
            value: "K('minimum_bank') — 5.00"
          - when: "the plan's most recent scheduled installment was paid by credit or debit card"
            value: "K('minimum_card') — 10.00"
          - when: "otherwise"
            value: "K('minimum_standard') — 25.00"
        baseline:
          s_minimum: "K('minimum_standard')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The add-on down payment is the plan term's down-payment percentage of the balance due on the invoice being added, raised by one quarter when one installment was recorded missed on the plan less than 12 whole months before today and by one half when two or more were, the product rounded to the nearest cent, an exact half cent being rounded up.
        The add-on down payment is never less than the add-on minimum of 25.00; when the amount worked out is lower, the add-on down payment is the add-on minimum.
      params: [down_payment_pct, missed_months, raise_half, raise_quarter, minimum_standard]
    inputs:
      history:
        - {table: plan_transactions, aggregate: count, field: plan_transaction_id, within_months: 12, filters: {event_type: plans_installment_missed}}
        - {table: plan_transactions, aggregate: count, field: plan_transaction_id, within_months: 12, filters: {event_type: plans_installment_paid, payment_type: scheduled_installment}}
        - {table: plan_transactions, aggregate: count, field: plan_transaction_id, filters: {event_type: plans_invoice_enrolled}}
      cross_category: [assistance, invoices]
  - id: plans_ext_relief_installment
    base_policy_refs: [plans_evt_schedule_changes, plans_evt_release_and_assistance]
    overwrite:
      - base_policy: plans_evt_release_and_assistance
        superseded_clause: >-
          the installment is recomputed over the remaining installments when assistance_adjustment_reamortizes is true
        replaced_by: >-
          On a plan whose term recomputes the installment after an assistance adjustment, the relief installment is the regular monthly installment set on the plan once a financial-assistance release has been booked on its ledger, and it applies from the next installment onward.
    trigger: state_due
    subject: [plans_schedule_changed]
    computes: installment_amount
    target_tool: reset_relief_installment_53948494
    params:
      award_mid: 50
      award_low: 25
      household_large: 4
      award_months_large: 2
      award_months_small: 1
      document_months_unemployment: 1
      document_months_medical: 2
      standing_high: 9
      standing_low: 6
      seasoned_months: 6
      standing_months_high: 2
      standing_months_low: 1
      uninsured_months: 2
      insured_months: 1
      invoices_min: 2
      invoices_months_auto: 1
      invoices_months_manual: 2
      floor_share: 0.15
      floor_fixed: 30.0
      plan_cap_installments: 24
    rule: >-
      On a plan whose term recomputes the installment after an assistance adjustment, the relief installment is the regular monthly installment set on the plan once a financial-assistance release has been booked on its ledger, and it applies from the next installment onward.
      A relief installment is not set on a past-due plan until the plan ledger carries an arrears payment dated on or after the date of the plan's latest missed-installment line.
      The relief installment is the plan's carried balance divided by the installments still to fall due, rounded to the nearest cent with an exact half cent rounded up, and it is never below the plan term's minimum installment; when the quotient is lower, the relief installment is that minimum.
      The carried balance is the invoice balances enrolled on the plan, less the down payment fixed when the plan was accepted, less every scheduled-installment, arrears, extra-principal and payoff payment on the plan ledger, less every release on the plan ledger.
      The installments still to fall due are the term's installments less those whose due date has already passed, the passed ones counted as the whole months from the plan's first due date to today plus one.
      Relief extension months are added to the installments still to fall due under the rules that follow, each rule adding its own months to the others', and the installments still to fall due together with the relief extension months never carry the plan past its twenty-fourth installment.
      A patient with an approved financial-assistance award of 50 percent or more and a household of 4 or more adds 2 relief extension months; a patient with such an award and a household of fewer than 4 adds 1 relief extension month; any other patient adds none.
      A patient with an approved award whose assistance file holds an unemployment benefit statement adds 1 relief extension month; a patient with an approved award whose assistance file holds a medical expense statement and no unemployment benefit statement adds 2 relief extension months; any other patient adds none.
      A plan accepted at least 6 whole months before today with 9 or more scheduled installments paid less than 12 whole months before today adds 2 relief extension months; a plan accepted at least 6 whole months before today with 6 to 8 scheduled installments paid in that span adds 1 relief extension month; any other plan adds none.
      A patient with an approved award and no live insurance coverage on file adds 2 relief extension months; a patient with an approved award and a live insurance coverage on file adds 1 relief extension month; any other patient adds none.
      A plan carrying 2 or more enrolled invoices whose installments are drawn automatically adds 1 relief extension month; a plan carrying 2 or more enrolled invoices whose installments are not drawn automatically adds 2 relief extension months; any other plan adds none.
      The floor of the relief installment depends on the award and the payment setup: for a patient with an approved award of 50 percent or more whose plan has automatic payments set up, the floor is 15 percent of the installment standing on the plan when the relief installment is set, rounded to the nearest cent with an exact half cent rounded up; for a patient with an approved award of at least 25 percent and below 50 percent, the floor is 30.00; for any other patient, the floor is the plan term's minimum installment.
    prerequisite:
      - problem: plans_ext_catch_up_payment
        kind: value_input
        gate: c_carried
        form: state
        policy_source: >-
          A relief installment is not set on a past-due plan until the plan ledger carries an arrears payment dated on or after the date of the plan's latest missed-installment line.
        condition: >-
          On a plan whose status is past_due, plan_transactions holds a plans_installment_paid line with payment_type
          arrears_cure whose event_date is on or after the event_date of the plan's latest plans_installment_missed line.
        resolved_by: pay_catch_up_2a071954
        effect: >-
          The arrears payment is subtracted in the carried balance (c_carried) that the relief installment spreads, and
          the plan stands current again, so the schedule may be changed.
    cross_category:
      - category: assistance
        as: history
        reads: [status, discount_pct, household_size, assistance_events.document_type]
        note: The approved award's discount percentage and household size, and the documents on the assistance file, decide the award, document and coverage extension months and the floor.
      - category: coverage
        as: existence
        reads: [status]
        note: Whether a live insurance coverage is on file decides the coverage extension months.
    compute:
      - c_enrolled: "SUM('plan_transactions', 'amount', event_type='plans_invoice_enrolled')"
      - c_scheduled: "SUM('plan_transactions', 'amount', event_type='plans_installment_paid', payment_type='scheduled_installment')"
      - c_arrears: "SUM('plan_transactions', 'amount', event_type='plans_installment_paid', payment_type='arrears_cure')"
      - c_extra: "SUM('plan_transactions', 'amount', event_type='plans_installment_paid', payment_type='additional_principal')"
      - c_payoff: "SUM('plan_transactions', 'amount', event_type='plans_installment_paid', payment_type='payoff')"
      - c_released: "SUM('plan_transactions', 'amount', event_type='plans_balance_released')"
      - c_carried: "RND(c_enrolled - F('down_payment_amount') - c_scheduled - c_arrears - c_extra - c_payoff - c_released, 2)"
      - c_due: "MONTHS(F('first_due_date'), NOW) + 1"
      - c_remaining: "P('term_months') - c_due"
      - c_award: "EXISTS('assistance', status='approved')"
      - c_award_pct: "CPARAM('assistance', 'discount_pct', status='approved') if c_award else 0"
      - c_household: "CFIELD('assistance', 'household_size', status='approved') if EXISTS('assistance', status='approved') else 0"
      - c_award_months: "K('award_months_large') if (c_award_pct >= K('award_mid') and c_household >= K('household_large')) else (K('award_months_small') if (c_award_pct >= K('award_mid') and c_household < K('household_large')) else 0)"
      - c_unemployment_docs: "XCOUNT('assistance', 'assistance_events', event_type='assistance_document_received', document_type='unemployment_benefit_statement')"
      - c_medical_docs: "XCOUNT('assistance', 'assistance_events', event_type='assistance_document_received', document_type='medical_expense_statement')"
      - c_document_months: "K('document_months_unemployment') if (c_unemployment_docs >= 1 and c_award) else (K('document_months_medical') if (c_medical_docs >= 1 and c_unemployment_docs == 0 and c_award) else 0)"
      - c_scheduled12: "COUNT('plan_transactions', within_months=12, event_type='plans_installment_paid', payment_type='scheduled_installment')"
      - c_age: "MONTHS(F('accepted_date'), NOW)"
      - c_standing_months: "K('standing_months_high') if (c_scheduled12 >= K('standing_high') and c_age >= K('seasoned_months')) else (K('standing_months_low') if (c_scheduled12 >= K('standing_low') and c_scheduled12 < K('standing_high') and c_age >= K('seasoned_months')) else 0)"
      - c_live_coverage: "EXISTS('coverage', status='active')"
      - c_coverage_months: "K('uninsured_months') if (not c_live_coverage and c_award) else (K('insured_months') if (c_live_coverage and c_award) else 0)"
      - c_invoices: "COUNT('plan_transactions', event_type='plans_invoice_enrolled')"
      - c_invoice_months: "K('invoices_months_auto') if (c_invoices >= K('invoices_min') and F('autopay_enrolled') == True) else (K('invoices_months_manual') if (c_invoices >= K('invoices_min') and F('autopay_enrolled') != True) else 0)"
      - c_floor: "RND(F('installment_amount') * K('floor_share'), 2) if (c_award_pct >= K('award_mid') and F('autopay_enrolled') == True) else (K('floor_fixed') if (c_award_pct >= K('award_low') and c_award_pct < K('award_mid')) else P('min_installment_amount'))"
      - c_count: "MN(c_remaining + c_award_months + c_document_months + c_standing_months + c_coverage_months + c_invoice_months, K('plan_cap_installments') - c_due)"
      - result: "MX(RND(c_carried / c_count, 2), c_floor)"
    compute_basis:
      c_enrolled: "The carried balance is the invoice balances enrolled on the plan"
      c_scheduled: "less every scheduled-installment, arrears, extra-principal and payoff payment on the plan ledger"
      c_arrears: "less every scheduled-installment, arrears, extra-principal and payoff payment on the plan ledger"
      c_extra: "less every scheduled-installment, arrears, extra-principal and payoff payment on the plan ledger"
      c_payoff: "less every scheduled-installment, arrears, extra-principal and payoff payment on the plan ledger"
      c_released: "less every release on the plan ledger"
      c_carried: "The carried balance is the invoice balances enrolled on the plan, less the down payment fixed when the plan was accepted, less every scheduled-installment, arrears, extra-principal and payoff payment on the plan ledger, less every release on the plan ledger."
      c_due: "the passed ones counted as the whole months from the plan's first due date to today plus one"
      c_remaining: "The installments still to fall due are the term's installments less those whose due date has already passed"
      c_award: "A patient with an approved award"
      c_award_pct: "A patient with an approved financial-assistance award of 50 percent or more"
      c_household: "and a household of 4 or more"
      c_award_months: "A patient with an approved financial-assistance award of 50 percent or more and a household of 4 or more adds 2 relief extension months; a patient with such an award and a household of fewer than 4 adds 1 relief extension month; any other patient adds none."
      c_unemployment_docs: "whose assistance file holds an unemployment benefit statement"
      c_medical_docs: "whose assistance file holds a medical expense statement and no unemployment benefit statement"
      c_document_months: "A patient with an approved award whose assistance file holds an unemployment benefit statement adds 1 relief extension month; a patient with an approved award whose assistance file holds a medical expense statement and no unemployment benefit statement adds 2 relief extension months; any other patient adds none."
      c_scheduled12: "with 9 or more scheduled installments paid less than 12 whole months before today"
      c_age: "A plan accepted at least 6 whole months before today"
      c_standing_months: "A plan accepted at least 6 whole months before today with 9 or more scheduled installments paid less than 12 whole months before today adds 2 relief extension months; a plan accepted at least 6 whole months before today with 6 to 8 scheduled installments paid in that span adds 1 relief extension month; any other plan adds none."
      c_live_coverage: "no live insurance coverage on file"
      c_coverage_months: "A patient with an approved award and no live insurance coverage on file adds 2 relief extension months; a patient with an approved award and a live insurance coverage on file adds 1 relief extension month; any other patient adds none."
      c_invoices: "A plan carrying 2 or more enrolled invoices"
      c_invoice_months: "A plan carrying 2 or more enrolled invoices whose installments are drawn automatically adds 1 relief extension month; a plan carrying 2 or more enrolled invoices whose installments are not drawn automatically adds 2 relief extension months; any other plan adds none."
      c_floor: "The floor of the relief installment depends on the award and the payment setup: for a patient with an approved award of 50 percent or more whose plan has automatic payments set up, the floor is 15 percent of the installment standing on the plan when the relief installment is set, rounded to the nearest cent with an exact half cent rounded up; for a patient with an approved award of at least 25 percent and below 50 percent, the floor is 30.00; for any other patient, the floor is the plan term's minimum installment."
      c_count: "Relief extension months are added to the installments still to fall due under the rules that follow, each rule adding its own months to the others', and the installments still to fall due together with the relief extension months never carry the plan past its twenty-fourth installment."
      result: "The relief installment is the plan's carried balance divided by the installments still to fall due, rounded to the nearest cent with an exact half cent rounded up, and it is never below the plan term's minimum installment; when the quotient is lower, the relief installment is that minimum."
    factors:
      - id: relief_award_months
        effect: parameter
        decides: c_award_months
        bindings: [c_household, c_award_months]
        ladder:
          - when: "an approved financial-assistance award of 50 percent or more and a household of 4 or more"
            value: "K('award_months_large') — 2 relief extension months"
          - when: "an approved award of 50 percent or more and a household of fewer than 4"
            value: "K('award_months_small') — 1 relief extension month"
          - when: "otherwise"
            value: "no relief extension month"
        baseline:
          c_award_months: "0"
        evidence: [cross_category]
        cross_difficulty: assistance
      - id: relief_document_months
        effect: parameter
        decides: c_document_months
        bindings: [c_unemployment_docs, c_medical_docs, c_document_months]
        ladder:
          - when: "an approved award and an unemployment benefit statement on the assistance file"
            value: "K('document_months_unemployment') — 1 relief extension month"
          - when: "an approved award and a medical expense statement but no unemployment benefit statement on the assistance file"
            value: "K('document_months_medical') — 2 relief extension months"
          - when: "otherwise"
            value: "no relief extension month"
        baseline:
          c_document_months: "0"
        evidence: [cross_category]
        cross_difficulty: assistance
      - id: relief_standing_months
        effect: parameter
        decides: c_standing_months
        bindings: [c_scheduled12, c_age, c_standing_months]
        ladder:
          - when: "the plan accepted at least 6 whole months before today and 9 or more scheduled installments paid in the last 12 whole months"
            value: "K('standing_months_high') — 2 relief extension months"
          - when: "the plan accepted at least 6 whole months before today and 6 to 8 scheduled installments paid in the last 12 whole months"
            value: "K('standing_months_low') — 1 relief extension month"
          - when: "otherwise"
            value: "no relief extension month"
        baseline:
          c_standing_months: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: relief_coverage_months
        effect: parameter
        decides: c_coverage_months
        bindings: [c_live_coverage, c_coverage_months]
        ladder:
          - when: "an approved award and no live insurance coverage on file"
            value: "K('uninsured_months') — 2 relief extension months"
          - when: "an approved award and a live insurance coverage on file"
            value: "K('insured_months') — 1 relief extension month"
          - when: "otherwise"
            value: "no relief extension month"
        baseline:
          c_coverage_months: "0"
        evidence: [cross_category]
        cross_difficulty: coverage
      - id: relief_invoice_months
        effect: parameter
        decides: c_invoice_months
        bindings: [c_invoices, c_invoice_months]
        ladder:
          - when: "2 or more invoices enrolled on the plan and installments drawn automatically"
            value: "K('invoices_months_auto') — 1 relief extension month"
          - when: "2 or more invoices enrolled on the plan and installments not drawn automatically"
            value: "K('invoices_months_manual') — 2 relief extension months"
          - when: "otherwise"
            value: "no relief extension month"
        baseline:
          c_invoice_months: "0"
        evidence: [history]
        cross_difficulty: null
      - id: relief_floor
        effect: method
        decides: c_floor
        bindings: [c_award_pct, c_floor]
        ladder:
          - when: "an approved award of 50 percent or more and automatic payments set up on the plan"
            method: "the floor is 15 percent of the installment standing on the plan when the relief installment is set, rounded to the nearest cent"
          - when: "an approved award of at least 25 percent and below 50 percent"
            method: "the floor is the fixed amount of 30.00"
          - when: "otherwise"
            method: "the floor is the plan term's minimum installment"
        baseline:
          c_floor: "P('min_installment_amount')"
        evidence: [cross_category, tier_param]
        cross_difficulty: assistance
    baseline:
      rule: >-
        The relief installment is the plan's carried balance divided by the installments still to fall due, rounded to the nearest cent with an exact half cent rounded up, and it is never below the plan term's minimum installment; when the quotient is lower, the relief installment is that minimum.
        The carried balance is the invoice balances enrolled on the plan, less the down payment fixed when the plan was accepted, less every scheduled-installment, arrears, extra-principal and payoff payment on the plan ledger, less every release on the plan ledger.
        The installments still to fall due are the term's installments less those whose due date has already passed, the passed ones counted as the whole months from the plan's first due date to today plus one.
      params: [term_months, min_installment_amount]
    inputs:
      history:
        - {table: plan_transactions, aggregate: sum, field: amount, filters: {event_type: plans_invoice_enrolled}}
        - {table: plan_transactions, aggregate: sum, field: amount, filters: {event_type: plans_installment_paid}}
        - {table: plan_transactions, aggregate: sum, field: amount, filters: {event_type: plans_balance_released}}
        - {table: plan_transactions, aggregate: count, field: plan_transaction_id, within_months: 12, filters: {event_type: plans_installment_paid, payment_type: scheduled_installment}}
        - {category: assistance, table: assistance_events, aggregate: count, field: assistance_event_id, filters: {event_type: assistance_document_received}}
      cross_category: [assistance, coverage]
  - id: plans_ext_added_invoice_installment
    base_policy_refs: [plans_agg_invoice_consolidation, plans_evt_invoice_eligibility, plans_evt_release_and_assistance]
    overwrite:
      - base_policy: plans_evt_invoice_eligibility
        superseded_clause: >-
          the installment is then recomputed over the remaining installments when re_amortize_on_add is true, or the number of installments grows, by no more than max_term_extension_months_on_add months, when it is false.
        replaced_by: >-
          When an invoice is added to a plan already accepted, the invoice comes onto the plan at its balance due and the plan's regular installment is set anew on the day of the enrollment, as this rule sets out.
    trigger: on_request
    subject: [plans_invoice_enrolled]
    computes: installment_amount
    target_tool: add_invoice_to_plan_14a3a600
    params:
      limit_award: 18
      limit_standing: 12
      limit_standard: 9
      standing_count: 6
      net_full: 1.0
      net_half: 0.5
      seasoned_months: 6
      lead_bank: 1
      lead_check: 2
      rise_award_insured: 100
      rise_award_uninsured: 75
      rise_standard: 25
    rule: >-
      When an invoice is added to a plan already accepted, the invoice comes onto the plan at its balance due and the plan's regular installment is set anew on the day of the enrollment, as this rule sets out.
      Before the installment of a plan taking on another invoice is fixed, the relief installment owed for a financial-assistance release already standing on the plan ledger is set.
      The installment of a plan taking on another invoice is fixed only after the plan ledger carries the down payment owed on that invoice, posted as a down payment dated after the plan's acceptance date.
      The added-invoice installment is worked out by re-spreading: the plan's carried balance and the balance due on the invoice being added are spread over the installments still to fall due under the term, but over no more than 9 installments, and the quotient is rounded to the nearest cent, an exact half cent being rounded up.
      The carried balance is the invoice balances already enrolled on the plan, less the down payment fixed when the plan was accepted, less every scheduled-installment, arrears, extra-principal and payoff payment on the plan ledger, less every release on the plan ledger; a down payment taken on the invoice being added does not lower the amount spread.
      The installments still to fall due under the term are the term's installments less those whose due date has already passed, the passed ones counted as the whole months from the plan's first due date to today plus one.
      The new installment applies from the next installment onward, and the added-invoice installment is never more than 25 percent above the installment standing on the plan; when the amount worked out is higher, the added-invoice installment is the standing installment raised by 25 percent, rounded to the nearest cent with an exact half cent rounded up, and the plan runs on until its balance is cleared.
      How the added invoice is folded into the plan depends on the plan's history: on a plan whose ledger carries a financial-assistance release and whose installments are drawn automatically, the installment standing on the plan is kept and the balance of the added invoice is spread on its own over the installments counted for the plan and added to it; on a plan whose ledger carries such a release and whose installments are not drawn automatically, the re-spread runs over the installments still to fall due under the term plus the term's add-on extension months; on any other plan the re-spread described above applies.
      The installments counted for a plan depend on whether its installment has been reset: on a plan whose standing installment differs from the installment set at acceptance (the enrolled balances less the acceptance down payment, divided by the term's installments and rounded to the cent) and whose installments are drawn automatically, they are the carried balance divided by the standing installment, to the nearest whole installment; on such a plan whose installments are not drawn automatically, that quotient rounded up to a whole installment; on any other plan, the installments still to fall due under the term.
      The installments an added invoice may be spread over are capped by the patient's standing: at no more than 18 for a patient with an approved financial-assistance award, at no more than 12 for a patient with no approved award and at least 6 scheduled installments paid less than 12 whole months before today, and at no more than 9 for any other patient; the cap applies to the installments counted or still to fall due before any add-on extension months are added.
      How much of the down payment taken on the invoice being added comes off the amount spread depends on the payment setup: on a plan drawn automatically from a bank account and accepted at least 6 whole months before today, all of it; on a plan drawn automatically from a credit or debit card, one half of it; on any other plan, none of it.
      Where the next installment is already lined up for collection it keeps the standing amount: on a plan drawn automatically from a bank account, the next installment stays at the installment standing on the plan and the added-invoice installment applies from the one after it; on a plan without automatic payments on whose ledger a payment by check has been posted, the next two installments stay at the standing installment; on any other plan the added-invoice installment applies from the next installment.
      In a re-spread the held installments are taken out of the amount spread at the standing installment and out of the installments counted; in a layering the balance of the added invoice is spread over the installments counted less the held installments, and the held installments keep the standing amount without anything being taken out of the added balance.
      The cap on the rise depends on the award and the coverage: for a patient with an approved financial-assistance award and a live insurance coverage on file, the added-invoice installment is never more than double the installment standing on the plan; for a patient with an approved award and no live coverage, never more than 75 percent above it; for any other patient, never more than 25 percent above it.
    prerequisite:
      - problem: plans_ext_relief_installment
        kind: value_input
        gate: n_inst
        form: action
        policy_source: >-
          Before the installment of a plan taking on another invoice is fixed, the relief installment owed for a financial-assistance release already standing on the plan ledger is set.
        fallback_reason: >-
          Setting the relief installment changes only the installment figure on the plan record and books no dated line on
          the plan ledger, so no record shows whether the figure standing on the plan already reflects a release; the
          dependency can only be stated by naming the action.
        condition: >-
          payment_plans.installment_amount equals the relief installment worked out for the financial-assistance release
          standing on the plan ledger.
        resolved_by: reset_relief_installment_53948494
        effect: >-
          The standing installment (n_inst) becomes the relief installment, which the layered spread keeps, the count of
          installments is read from, the held installments are taken at and the cap on the rise is measured against.
      - problem: plans_ext_add_on_down_payment
        kind: value_input
        gate: n_addon_down
        form: state
        policy_source: >-
          The installment of a plan taking on another invoice is fixed only after the plan ledger carries the down payment owed on that invoice, posted as a down payment dated after the plan's acceptance date.
        condition: >-
          plan_transactions holds a plans_installment_paid line with payment_type down_payment whose event_date is after
          payment_plans.accepted_date and whose amount is the add-on down payment owed on the invoice being added.
        resolved_by: pay_add_on_down_payment_958d6e13
        effect: >-
          The add-on down payment (n_addon_down) is read from the ledger and taken off the balance of the added invoice
          that is spread, in the share the down-payment netting rule gives.
    cross_category:
      - category: invoices
        as: branch
        reads: [status, balance_due]
        note: The balance due of the patient's open invoice being added is the amount the added-invoice installment spreads.
      - category: assistance
        as: existence
        reads: [status]
        note: Whether an approved financial-assistance award is on file decides the spread cap and the cap on the rise.
      - category: coverage
        as: existence
        reads: [status]
        note: Whether a live insurance coverage is on file decides the cap on the rise.
    compute:
      - n_inst: "F('installment_amount')"
      - n_enrolled: "SUM('plan_transactions', 'amount', event_type='plans_invoice_enrolled')"
      - n_scheduled: "SUM('plan_transactions', 'amount', event_type='plans_installment_paid', payment_type='scheduled_installment')"
      - n_arrears: "SUM('plan_transactions', 'amount', event_type='plans_installment_paid', payment_type='arrears_cure')"
      - n_extra: "SUM('plan_transactions', 'amount', event_type='plans_installment_paid', payment_type='additional_principal')"
      - n_payoff: "SUM('plan_transactions', 'amount', event_type='plans_installment_paid', payment_type='payoff')"
      - n_released: "SUM('plan_transactions', 'amount', event_type='plans_balance_released')"
      - n_carried: "RND(n_enrolled - F('down_payment_amount') - n_scheduled - n_arrears - n_extra - n_payoff - n_released, 2)"
      - n_added: "CFIELD('invoices', 'balance_due', status='open')"
      - n_addon_down: "RND(SUM('plan_transactions', 'amount', event_type='plans_installment_paid', payment_type='down_payment') - F('down_payment_amount'), 2)"
      - n_term_remaining: "P('term_months') - (MONTHS(F('first_due_date'), NOW) + 1)"
      - n_auto: "F('autopay_enrolled') == True"
      - n_bank: "F('autopay_enrolled') == True and F('autopay_method') == 'ach_bank_transfer'"
      - n_relief_lines: "COUNT('plan_transactions', event_type='plans_balance_released', release_reason='financial_assistance_adjustment')"
      - n_method: "'layered' if (n_relief_lines >= 1 and n_auto) else ('respread_extended' if (n_relief_lines >= 1 and not n_auto) else 'respread')"
      - n_acceptance_inst: "RND((SUM('plan_transactions', 'amount', event_type='plans_invoice_enrolled') - F('down_payment_amount')) / P('term_months'), 2)"
      - n_counted: "RND(n_carried / n_inst, 0) if (n_inst != n_acceptance_inst and n_auto) else ((0 - int(0 - n_carried / n_inst)) if (n_inst != n_acceptance_inst and not n_auto) else n_term_remaining)"
      - n_award: "EXISTS('assistance', status='approved')"
      - n_scheduled12: "COUNT('plan_transactions', within_months=12, event_type='plans_installment_paid', payment_type='scheduled_installment')"
      - n_limit: "K('limit_award') if n_award else (K('limit_standing') if (not n_award and n_scheduled12 >= K('standing_count')) else K('limit_standard'))"
      - n_age: "MONTHS(F('accepted_date'), NOW)"
      - n_net_share: "K('net_full') if (n_bank and n_age >= K('seasoned_months')) else (K('net_half') if (n_auto and not n_bank) else 0.0)"
      - n_added_net: "RND(n_added - n_addon_down * n_net_share, 2)"
      - n_checks: "COUNT('plan_transactions', event_type='plans_installment_paid', payment_method='check')"
      - n_lead: "K('lead_bank') if n_bank else (K('lead_check') if (not n_auto and n_checks >= 1) else 0)"
      - n_live_coverage: "EXISTS('coverage', status='active')"
      - n_rise: "K('rise_award_insured') if (n_award and n_live_coverage) else (K('rise_award_uninsured') if (n_award and not n_live_coverage) else K('rise_standard'))"
      - n_layer_count: "MN(n_counted, n_limit)"
      - n_layered: "RND(n_inst + n_added_net / (n_layer_count - n_lead), 2)"
      - n_respread_count: "MN(n_term_remaining, n_limit) + (P('max_term_extension_months_on_add') if n_method == 'respread_extended' else 0)"
      - n_respread: "RND((n_carried + n_added_net - n_lead * n_inst) / (n_respread_count - n_lead), 2)"
      - n_new: "n_layered if n_method == 'layered' else n_respread"
      - result: "MN(n_new, RND(n_inst * (1 + n_rise / 100), 2))"
    compute_basis:
      n_inst: "the installment standing on the plan"
      n_enrolled: "The carried balance is the invoice balances already enrolled on the plan"
      n_scheduled: "less every scheduled-installment, arrears, extra-principal and payoff payment on the plan ledger"
      n_arrears: "less every scheduled-installment, arrears, extra-principal and payoff payment on the plan ledger"
      n_extra: "less every scheduled-installment, arrears, extra-principal and payoff payment on the plan ledger"
      n_payoff: "less every scheduled-installment, arrears, extra-principal and payoff payment on the plan ledger"
      n_released: "less every release on the plan ledger"
      n_carried: "The carried balance is the invoice balances already enrolled on the plan, less the down payment fixed when the plan was accepted, less every scheduled-installment, arrears, extra-principal and payoff payment on the plan ledger, less every release on the plan ledger; a down payment taken on the invoice being added does not lower the amount spread."
      n_added: "the invoice comes onto the plan at its balance due"
      n_addon_down: "the plan ledger carries the down payment owed on that invoice, posted as a down payment dated after the plan's acceptance date"
      n_term_remaining: "The installments still to fall due under the term are the term's installments less those whose due date has already passed, the passed ones counted as the whole months from the plan's first due date to today plus one."
      n_auto: "whose installments are drawn automatically"
      n_bank: "on a plan drawn automatically from a bank account"
      n_relief_lines: "on a plan whose ledger carries a financial-assistance release"
      n_method: "How the added invoice is folded into the plan depends on the plan's history: on a plan whose ledger carries a financial-assistance release and whose installments are drawn automatically, the installment standing on the plan is kept and the balance of the added invoice is spread on its own over the installments counted for the plan and added to it; on a plan whose ledger carries such a release and whose installments are not drawn automatically, the re-spread runs over the installments still to fall due under the term plus the term's add-on extension months; on any other plan the re-spread described above applies."
      n_acceptance_inst: "the installment set at acceptance (the enrolled balances less the acceptance down payment, divided by the term's installments and rounded to the cent)"
      n_counted: "The installments counted for a plan depend on whether its installment has been reset: on a plan whose standing installment differs from the installment set at acceptance (the enrolled balances less the acceptance down payment, divided by the term's installments and rounded to the cent) and whose installments are drawn automatically, they are the carried balance divided by the standing installment, to the nearest whole installment; on such a plan whose installments are not drawn automatically, that quotient rounded up to a whole installment; on any other plan, the installments still to fall due under the term."
      n_award: "for a patient with an approved financial-assistance award"
      n_scheduled12: "at least 6 scheduled installments paid less than 12 whole months before today"
      n_limit: "The installments an added invoice may be spread over are capped by the patient's standing: at no more than 18 for a patient with an approved financial-assistance award, at no more than 12 for a patient with no approved award and at least 6 scheduled installments paid less than 12 whole months before today, and at no more than 9 for any other patient; the cap applies to the installments counted or still to fall due before any add-on extension months are added."
      n_age: "accepted at least 6 whole months before today"
      n_net_share: "How much of the down payment taken on the invoice being added comes off the amount spread depends on the payment setup: on a plan drawn automatically from a bank account and accepted at least 6 whole months before today, all of it; on a plan drawn automatically from a credit or debit card, one half of it; on any other plan, none of it."
      n_added_net: "How much of the down payment taken on the invoice being added comes off the amount spread"
      n_checks: "on whose ledger a payment by check has been posted"
      n_lead: "Where the next installment is already lined up for collection it keeps the standing amount: on a plan drawn automatically from a bank account, the next installment stays at the installment standing on the plan and the added-invoice installment applies from the one after it; on a plan without automatic payments on whose ledger a payment by check has been posted, the next two installments stay at the standing installment; on any other plan the added-invoice installment applies from the next installment."
      n_live_coverage: "a live insurance coverage on file"
      n_rise: "The cap on the rise depends on the award and the coverage: for a patient with an approved financial-assistance award and a live insurance coverage on file, the added-invoice installment is never more than double the installment standing on the plan; for a patient with an approved award and no live coverage, never more than 75 percent above it; for any other patient, never more than 25 percent above it."
      n_layer_count: "spread on its own over the installments counted for the plan"
      n_layered: "in a layering the balance of the added invoice is spread over the installments counted less the held installments, and the held installments keep the standing amount without anything being taken out of the added balance"
      n_respread_count: "the cap applies to the installments counted or still to fall due before any add-on extension months are added"
      n_respread: "The added-invoice installment is worked out by re-spreading: the plan's carried balance and the balance due on the invoice being added are spread over the installments still to fall due under the term, but over no more than 9 installments, and the quotient is rounded to the nearest cent, an exact half cent being rounded up. In a re-spread the held installments are taken out of the amount spread at the standing installment and out of the installments counted; in a layering the balance of the added invoice is spread over the installments counted less the held installments, and the held installments keep the standing amount without anything being taken out of the added balance."
      n_new: "on any other plan the re-spread described above applies"
      result: "The new installment applies from the next installment onward, and the added-invoice installment is never more than 25 percent above the installment standing on the plan; when the amount worked out is higher, the added-invoice installment is the standing installment raised by 25 percent, rounded to the nearest cent with an exact half cent rounded up, and the plan runs on until its balance is cleared."
    factors:
      - id: added_invoice_folding
        effect: method
        decides: n_method
        bindings: [n_relief_lines, n_method, n_layered, n_respread_count]
        ladder:
          - when: "a financial-assistance release on the plan ledger and installments drawn automatically"
            method: "layering: the standing installment is kept and the added invoice's balance is spread on its own over the installments counted for the plan and added to it"
          - when: "a financial-assistance release on the plan ledger and installments not drawn automatically"
            method: "re-spread over the installments still to fall due under the term plus the term's add-on extension months"
          - when: "otherwise"
            method: "re-spread of the carried balance and the added invoice over the installments still to fall due under the term"
        baseline:
          n_method: "'respread'"
        evidence: [history]
        cross_difficulty: null
      - id: added_invoice_count_reading
        effect: method
        decides: n_counted
        bindings: [n_acceptance_inst, n_counted]
        ladder:
          - when: "the standing installment differs from the installment set at acceptance and installments drawn automatically"
            method: "the carried balance divided by the standing installment, to the nearest whole installment"
          - when: "the standing installment differs from the installment set at acceptance and installments not drawn automatically"
            method: "the carried balance divided by the standing installment, rounded up to a whole installment"
          - when: "otherwise"
            method: "the installments still to fall due under the term"
        baseline:
          n_counted: "n_term_remaining"
        evidence: [history]
        cross_difficulty: null
      - id: added_invoice_spread_cap
        effect: parameter
        decides: n_limit
        bindings: [n_award, n_scheduled12, n_limit]
        ladder:
          - when: "an approved financial-assistance award on file"
            value: "K('limit_award') — no more than 18 installments"
          - when: "no approved award and at least 6 scheduled installments paid in the last 12 whole months"
            value: "K('limit_standing') — no more than 12 installments"
          - when: "otherwise"
            value: "K('limit_standard') — no more than 9 installments"
        baseline:
          n_limit: "K('limit_standard')"
        evidence: [cross_category, history]
        cross_difficulty: null
      - id: added_invoice_down_payment_netting
        effect: parameter
        decides: n_net_share
        bindings: [n_age, n_net_share]
        ladder:
          - when: "installments drawn automatically from a bank account and the plan accepted at least 6 whole months before today"
            value: "K('net_full') — all of the down payment comes off the amount spread"
          - when: "installments drawn automatically from a credit or debit card"
            value: "K('net_half') — one half of the down payment comes off the amount spread"
          - when: "otherwise"
            value: "none of the down payment comes off the amount spread"
        baseline:
          n_net_share: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: added_invoice_held_installments
        effect: parameter
        decides: n_lead
        bindings: [n_checks, n_lead]
        ladder:
          - when: "installments drawn automatically from a bank account"
            value: "K('lead_bank') — the next installment stays at the standing amount"
          - when: "no automatic payments and a payment by check posted on the plan ledger"
            value: "K('lead_check') — the next two installments stay at the standing amount"
          - when: "otherwise"
            value: "no installment is held; the new installment applies from the next one"
        baseline:
          n_lead: "0"
        evidence: [history]
        cross_difficulty: null
      - id: added_invoice_rise_cap
        effect: parameter
        decides: n_rise
        bindings: [n_live_coverage, n_rise]
        ladder:
          - when: "an approved financial-assistance award and a live insurance coverage on file"
            value: "K('rise_award_insured') — never more than double the standing installment"
          - when: "an approved financial-assistance award and no live insurance coverage on file"
            value: "K('rise_award_uninsured') — never more than 75 percent above the standing installment"
          - when: "otherwise"
            value: "K('rise_standard') — never more than 25 percent above the standing installment"
        baseline:
          n_rise: "K('rise_standard')"
        evidence: [cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        When an invoice is added to a plan already accepted, the invoice comes onto the plan at its balance due and the plan's regular installment is set anew on the day of the enrollment, as this rule sets out.
        The added-invoice installment is worked out by re-spreading: the plan's carried balance and the balance due on the invoice being added are spread over the installments still to fall due under the term, but over no more than 9 installments, and the quotient is rounded to the nearest cent, an exact half cent being rounded up.
        The carried balance is the invoice balances already enrolled on the plan, less the down payment fixed when the plan was accepted, less every scheduled-installment, arrears, extra-principal and payoff payment on the plan ledger, less every release on the plan ledger; a down payment taken on the invoice being added does not lower the amount spread.
        The installments still to fall due under the term are the term's installments less those whose due date has already passed, the passed ones counted as the whole months from the plan's first due date to today plus one.
        The new installment applies from the next installment onward, and the added-invoice installment is never more than 25 percent above the installment standing on the plan; when the amount worked out is higher, the added-invoice installment is the standing installment raised by 25 percent, rounded to the nearest cent with an exact half cent rounded up, and the plan runs on until its balance is cleared.
      params: [term_months, limit_standard, rise_standard]
    inputs:
      history:
        - {table: plan_transactions, aggregate: sum, field: amount, filters: {event_type: plans_invoice_enrolled}}
        - {table: plan_transactions, aggregate: sum, field: amount, filters: {event_type: plans_installment_paid}}
        - {table: plan_transactions, aggregate: sum, field: amount, filters: {event_type: plans_balance_released}}
        - {table: plan_transactions, aggregate: count, field: plan_transaction_id, filters: {event_type: plans_balance_released, release_reason: financial_assistance_adjustment}}
      cross_category: [invoices, assistance, coverage]
  - id: plans_ext_reinstatement_payment
    base_policy_refs: [plans_evt_installments, plans_evt_reinstatement]
    overwrite:
      - base_policy: plans_evt_reinstatement
        superseded_clause: >-
          The patient must first pay every missed installment in full;
        replaced_by: >-
          The reinstatement payment of a defaulted plan is the amount this rule sets out, in place of every missed installment paid in full.
    trigger: on_request
    subject: [plans_installment_paid]
    computes: amount
    target_tool: pay_reinstatement_amount_fe9b74b8
    params:
      seasoned_months: 6
      fallen_full: 1.0
      fallen_half: 0.5
      award_high: 50
      award_low: 25
      deposit_none: 0.0
      deposit_quarter: 0.25
      deposit_full: 1.0
      credit_months: 6
      household_large: 3
      credit_full: 1.0
      credit_three_quarters: 0.75
      credit_half: 0.5
    rule: >-
      A reinstatement payment is the payment a patient makes on a defaulted plan inside its reinstatement window; it
      is posted on the plan ledger as an arrears payment against the plan's latest missed installment.
      The reinstatement payment of a defaulted plan is the amount this rule sets out, in place of every missed installment paid in full.
      The reinstatement payment is the amounts of every installment recorded missed on the plan ledger, less every arrears payment already posted on the plan ledger, plus a reinstatement deposit of one full regular installment, less a reinstatement credit of one half of all the extra-principal payments posted on the plan less than 6 whole months before today.
      Each part of the reinstatement payment is taken to the nearest cent, an exact half cent being rounded up, the parts are added and the credit subtracted, and the reinstatement payment is the result.
      Installments whose due date passed after the plan's default date, counted as the whole months from the plan's first due date to today plus one less the whole months from the first due date to the default date plus one, are collected with the reinstatement payment at the regular installment: in full on a plan accepted at least 6 whole months before today, at one half on a plan accepted less than 6 whole months before today, and not at all when no installment has fallen due since the default.
      The reinstatement deposit is set by the patient's financial-assistance award: none for an approved award whose discount percentage is 50 percent or more, one quarter of the regular installment for an approved award whose discount percentage is at least 25 percent and below 50 percent, and one full regular installment for any other patient.
      Which of the extra-principal payments posted less than 6 whole months before today the reinstatement credit counts depends on how the plan was paid: on a plan without automatic payments on which some of those payments were made by check, only the payments made by check; on a plan with automatic payments, only the most recent of those payments; on any other plan, all of them.
      The share of the counted payments that the reinstatement credit takes depends on the patient's financial-assistance award and household: for a patient with an approved financial-assistance award and a household of 3 or more on the assistance case, the whole of them; for a patient with an approved award and a household of fewer than 3, three quarters of them; for any other patient, one half of them.
    prerequisite: []
    cross_category:
      - category: assistance
        as: branch
        reads: [status, discount_pct, household_size]
        note: The discount percentage of the approved award sets the reinstatement deposit; the award and the household size set the share the reinstatement credit takes.
    compute:
      - q_inst: "F('installment_amount')"
      - q_auto: "F('autopay_enrolled') == True"
      - q_missed: "SUM('plan_transactions', 'amount', event_type='plans_installment_missed')"
      - q_cured: "SUM('plan_transactions', 'amount', event_type='plans_installment_paid', payment_type='arrears_cure')"
      - q_fallen: "(MONTHS(F('first_due_date'), NOW) + 1) - (MONTHS(F('first_due_date'), F('defaulted_date')) + 1)"
      - q_age: "MONTHS(F('accepted_date'), NOW)"
      - q_fallen_share: "K('fallen_full') if (q_fallen >= 1 and q_age >= K('seasoned_months')) else (K('fallen_half') if (q_fallen >= 1 and q_age < K('seasoned_months')) else 0.0)"
      - q_award: "EXISTS('assistance', status='approved')"
      - q_award_pct: "CPARAM('assistance', 'discount_pct', status='approved') if q_award else 0"
      - q_deposit_share: "K('deposit_none') if (q_award and q_award_pct >= K('award_high')) else (K('deposit_quarter') if (q_award and q_award_pct >= K('award_low') and q_award_pct < K('award_high')) else K('deposit_full'))"
      - q_extra_all: "SUM('plan_transactions', 'amount', within_months=K('credit_months'), event_type='plans_installment_paid', payment_type='additional_principal')"
      - q_extra_check: "SUM('plan_transactions', 'amount', within_months=K('credit_months'), event_type='plans_installment_paid', payment_type='additional_principal', payment_method='check')"
      - q_extra_latest: "LATEST('plan_transactions', 'amount', event_type='plans_installment_paid', payment_type='additional_principal') if q_extra_all > 0 else 0.0"
      - q_counted: "q_extra_check if (not q_auto and q_extra_check > 0) else (q_extra_latest if q_auto else q_extra_all)"
      - q_household: "CFIELD('assistance', 'household_size', status='approved') if q_award else 0"
      - q_credit_share: "K('credit_full') if (q_award and q_household >= K('household_large')) else (K('credit_three_quarters') if (q_award and q_household < K('household_large')) else K('credit_half'))"
      - result: "RND(RND(q_missed - q_cured, 2) + RND(q_inst * q_fallen * q_fallen_share, 2) + RND(q_inst * q_deposit_share, 2) - RND(q_counted * q_credit_share, 2), 2)"
    compute_basis:
      q_inst: "a reinstatement deposit of one full regular installment"
      q_auto: "on a plan with automatic payments"
      q_missed: "The reinstatement payment is the amounts of every installment recorded missed on the plan ledger"
      q_cured: "less every arrears payment already posted on the plan ledger"
      q_fallen: "Installments whose due date passed after the plan's default date, counted as the whole months from the plan's first due date to today plus one less the whole months from the first due date to the default date plus one"
      q_age: "on a plan accepted at least 6 whole months before today"
      q_fallen_share: "are collected with the reinstatement payment at the regular installment: in full on a plan accepted at least 6 whole months before today, at one half on a plan accepted less than 6 whole months before today, and not at all when no installment has fallen due since the default."
      q_award: "for a patient with an approved financial-assistance award"
      q_award_pct: "The reinstatement deposit is set by the patient's financial-assistance award"
      q_deposit_share: "The reinstatement deposit is set by the patient's financial-assistance award: none for an approved award whose discount percentage is 50 percent or more, one quarter of the regular installment for an approved award whose discount percentage is at least 25 percent and below 50 percent, and one full regular installment for any other patient."
      q_extra_all: "less a reinstatement credit of one half of all the extra-principal payments posted on the plan less than 6 whole months before today"
      q_extra_check: "on a plan without automatic payments on which some of those payments were made by check, only the payments made by check"
      q_extra_latest: "on a plan with automatic payments, only the most recent of those payments"
      q_counted: "Which of the extra-principal payments posted less than 6 whole months before today the reinstatement credit counts depends on how the plan was paid: on a plan without automatic payments on which some of those payments were made by check, only the payments made by check; on a plan with automatic payments, only the most recent of those payments; on any other plan, all of them."
      q_household: "and a household of 3 or more on the assistance case"
      q_credit_share: "The share of the counted payments that the reinstatement credit takes depends on the patient's financial-assistance award and household: for a patient with an approved financial-assistance award and a household of 3 or more on the assistance case, the whole of them; for a patient with an approved award and a household of fewer than 3, three quarters of them; for any other patient, one half of them."
      result: "Each part of the reinstatement payment is taken to the nearest cent, an exact half cent being rounded up, the parts are added and the credit subtracted, and the reinstatement payment is the result."
    factors:
      - id: reinstatement_fallen_due_share
        effect: parameter
        decides: q_fallen_share
        bindings: [q_fallen, q_age, q_fallen_share]
        ladder:
          - when: "an installment has fallen due since the default and the plan was accepted at least 6 whole months before today"
            value: "K('fallen_full') — the installments fallen due are collected in full"
          - when: "an installment has fallen due since the default and the plan was accepted less than 6 whole months before today"
            value: "K('fallen_half') — they are collected at one half"
          - when: "otherwise"
            value: "nothing is collected for them"
        baseline:
          q_fallen_share: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: reinstatement_deposit
        effect: parameter
        decides: q_deposit_share
        bindings: [q_award_pct, q_deposit_share]
        ladder:
          - when: "an approved financial-assistance award whose discount percentage is 50 percent or more"
            value: "K('deposit_none') — no deposit"
          - when: "an approved financial-assistance award whose discount percentage is at least 25 percent and below 50 percent"
            value: "K('deposit_quarter') — one quarter of the regular installment"
          - when: "otherwise"
            value: "K('deposit_full') — one full regular installment"
        baseline:
          q_deposit_share: "K('deposit_full')"
        evidence: [cross_category]
        cross_difficulty: assistance
      - id: reinstatement_credit_selection
        effect: method
        decides: q_counted
        bindings: [q_extra_check, q_extra_latest, q_counted]
        ladder:
          - when: "no automatic payments and some of the extra-principal payments of the last 6 whole months made by check"
            method: "only the extra-principal payments made by check are counted"
          - when: "automatic payments on the plan"
            method: "only the most recent extra-principal payment is counted"
          - when: "otherwise"
            method: "all the extra-principal payments of the last 6 whole months are counted"
        baseline:
          q_counted: "q_extra_all"
        evidence: [history]
        cross_difficulty: null
      - id: reinstatement_credit_share
        effect: parameter
        decides: q_credit_share
        bindings: [q_household, q_credit_share]
        ladder:
          - when: "an approved financial-assistance award and a household of 3 or more on the assistance case"
            value: "K('credit_full') — the whole of the counted payments"
          - when: "an approved financial-assistance award and a household of fewer than 3"
            value: "K('credit_three_quarters') — three quarters of the counted payments"
          - when: "otherwise"
            value: "K('credit_half') — one half of the counted payments"
        baseline:
          q_credit_share: "K('credit_half')"
        evidence: [cross_category]
        cross_difficulty: assistance
    baseline:
      rule: >-
        The reinstatement payment is the amounts of every installment recorded missed on the plan ledger, less every arrears payment already posted on the plan ledger, plus a reinstatement deposit of one full regular installment, less a reinstatement credit of one half of all the extra-principal payments posted on the plan less than 6 whole months before today.
        Each part of the reinstatement payment is taken to the nearest cent, an exact half cent being rounded up, the parts are added and the credit subtracted, and the reinstatement payment is the result.
      params: [deposit_full, credit_months, credit_half]
    inputs:
      history:
        - {table: plan_transactions, aggregate: sum, field: amount, filters: {event_type: plans_installment_missed}}
        - {table: plan_transactions, aggregate: sum, field: amount, filters: {event_type: plans_installment_paid, payment_type: arrears_cure}}
        - {table: plan_transactions, aggregate: sum, field: amount, within_months: 6, filters: {event_type: plans_installment_paid, payment_type: additional_principal}}
      cross_category: [assistance]
  - id: plans_ext_reinstated_installment
    base_policy_refs: [plans_evt_reinstatement, plans_evt_invoice_eligibility, plans_agg_invoice_consolidation]
    overwrite:
      - base_policy: plans_evt_reinstatement
        superseded_clause: >-
          on reinstatement the balances released at default are enrolled again on the same plan from the invoices that are still open, with the original schedule, and the invoices leave the statement cycle again.
        replaced_by: >-
          On reinstatement the re-enrolled amount of the invoice still open is booked again on the same plan with the reinstatement itself, the reinstated installment this rule sets out takes the place of the original schedule's installment, and the invoice leaves the statement cycle again.
      - base_policy: plans_evt_invoice_eligibility
        superseded_clause: >-
          Invoices can be enrolled only while the plan status is pending_acceptance or active.
        replaced_by: >-
          Invoices can be enrolled only while the plan status is pending_acceptance or active, and on a defaulted plan only as the re-enrollment booked with its reinstatement.
    trigger: on_request
    subject: [plans_reinstated, plans_invoice_enrolled]
    computes: installment_amount
    target_tool: reinstate_plan_60f00772
    params:
      run_months: 3
      run_min: 2
      seasoned_months: 6
      award_months_run: 3
      award_months_single: 2
      household_min: 3
      household_months_manual: 2
      household_months_automatic: 1
      held_check: 2
      held_manual: 1
      floor_award: 0.25
      floor_manual: 0.75
      floor_standard: 1.0
    rule: >-
      A defaulted plan put back in force inside its reinstatement window is reinstated with a reinstated installment.
      On reinstatement the re-enrolled amount of the invoice still open is booked again on the same plan with the reinstatement itself, the reinstated installment this rule sets out takes the place of the original schedule's installment, and the invoice leaves the statement cycle again.
      Invoices can be enrolled only while the plan status is pending_acceptance or active, and on a defaulted plan only as the re-enrollment booked with its reinstatement.
      A reinstated installment is fixed only after the plan ledger carries an arrears payment dated after the plan's default date.
      The re-enrolled amount is the amount released back to the invoice when the plan defaulted.
      The reinstated balance is the re-enrolled amount plus the plan ledger's own balance, that is the invoice balances enrolled less every payment and every release on the plan ledger, which after a default is the payments posted since the default shown as a negative figure.
      The reinstated installment is the reinstated balance divided by the installments still to fall due under the term, rounded to the nearest cent with an exact half cent rounded up, and it is never below the installment the plan carried when it defaulted; when the quotient is lower, the reinstated installment is that installment.
      The installments still to fall due under the term are the term's installments less those whose due date has already passed, the passed ones counted as the whole months from the plan's first due date to today plus one, and the reinstated installment applies from the next installment onward.
      The re-enrolled amount depends on what has happened to the invoice since the default: the payments counted are those posted to the patient's invoices in the calendar-month window that runs back from today over the whole months elapsed since the default date plus one (a window that reaches the default date); where such payments have been posted and the plan has no automatic payments, it is the balance due the open invoice now shows; where such payments have been posted and the plan has automatic payments, it is the amount released at default less those payments; on any other plan it is the amount released at default.
      The installments the reinstated balance is spread over depend on how the plan fell behind: on a plan with 2 or more installments recorded missed less than 3 whole months before today that was accepted at least 6 whole months before today, they are the whole installments the pre-default installment needs to clear the reinstated balance, the quotient rounded down; on a plan with 2 or more such missed installments accepted less than 6 whole months before today, that quotient rounded up; on any other plan, the installments still to fall due under the term.
      A patient with an approved financial-assistance award adds 3 reinstatement extension months when 2 or more installments were recorded missed less than 3 whole months before today and 2 months otherwise; any other patient adds none.
      A patient whose assistance case records a household of 3 or more adds 2 reinstatement extension months when the plan has no automatic payments and 1 month when it has automatic payments; any other patient adds none.
      The extension months are added to the installments the reinstated balance is spread over.
      On a plan without automatic payments on whose ledger a payment by check has been posted, the next two installments stay at the pre-default installment; on a plan without automatic payments and no payment by check, the next installment stays at it; on any other plan none is held. The held installments are taken out of the reinstated balance at the pre-default installment and out of the installments counted, and the reinstated installment applies from the installment after them.
      The floor of the reinstated installment depends on the patient's situation: for a patient with an approved financial-assistance award it is 25 percent of the pre-default installment; for a patient with no approved award whose plan has no automatic payments it is 75 percent of the pre-default installment; for any other patient it is the full pre-default installment; the floor is rounded to the nearest cent, an exact half cent being rounded up.
    prerequisite:
      - problem: plans_ext_reinstatement_payment
        kind: value_input
        gate: r_ledger
        form: state
        policy_source: >-
          A reinstated installment is fixed only after the plan ledger carries an arrears payment dated after the plan's default date.
        condition: >-
          On a plan whose status is defaulted, plan_transactions holds a plans_installment_paid line with payment_type
          arrears_cure whose event_date is after payment_plans.defaulted_date.
        resolved_by: pay_reinstatement_amount_fe9b74b8
        effect: >-
          The reinstatement payment lowers the plan ledger's own balance (r_ledger) and with it the reinstated balance the
          reinstated installment spreads.
    cross_category:
      - category: invoices
        as: history
        reads: [status, balance_due, invoice_transactions.amount]
        note: Payments posted to the patient's invoices since the default and the open invoice's balance due decide the re-enrolled amount.
      - category: assistance
        as: branch
        reads: [status, discount_pct, household_size]
        note: The approved award and the household size on the assistance case decide the reinstatement extension months and the floor.
    compute:
      - r_enrolled: "SUM('plan_transactions', 'amount', event_type='plans_invoice_enrolled')"
      - r_paid: "SUM('plan_transactions', 'amount', event_type='plans_installment_paid')"
      - r_released: "SUM('plan_transactions', 'amount', event_type='plans_balance_released')"
      - r_ledger: "RND(r_enrolled - r_paid - r_released, 2)"
      - r_auto: "F('autopay_enrolled') == True"
      - r_direct: "XSUM('invoices', 'invoice_transactions', 'amount', within_months=MONTHS(F('defaulted_date'), NOW) + 1, event_type='invoices_payment_received')"
      - r_default_release: "SUM('plan_transactions', 'amount', event_type='plans_balance_released', release_reason='plan_defaulted')"
      - r_basis: "CFIELD('invoices', 'balance_due', status='open') if (r_direct > 0 and not r_auto) else (RND(r_default_release - r_direct, 2) if (r_direct > 0 and r_auto) else r_default_release)"
      - r_balance: "RND(r_basis + r_ledger, 2)"
      - r_inst_old: "F('installment_amount')"
      - r_term_remaining: "P('term_months') - (MONTHS(F('first_due_date'), NOW) + 1)"
      - r_run: "COUNT('plan_transactions', within_months=K('run_months'), event_type='plans_installment_missed')"
      - r_age: "MONTHS(F('accepted_date'), NOW)"
      - r_counted: "int(r_balance / r_inst_old) if (r_run >= K('run_min') and r_age >= K('seasoned_months')) else ((0 - int(0 - r_balance / r_inst_old)) if (r_run >= K('run_min') and r_age < K('seasoned_months')) else r_term_remaining)"
      - r_award_months: "K('award_months_run') if (EXISTS('assistance', status='approved') and r_run >= K('run_min')) else (K('award_months_single') if (EXISTS('assistance', status='approved') and r_run < K('run_min')) else 0)"
      - r_household: "CFIELD('assistance', 'household_size', status='approved') if EXISTS('assistance', status='approved') else 0"
      - r_household_months: "K('household_months_manual') if (r_household >= K('household_min') and not r_auto) else (K('household_months_automatic') if (r_household >= K('household_min') and r_auto) else 0)"
      - r_checks: "COUNT('plan_transactions', event_type='plans_installment_paid', payment_method='check')"
      - r_held: "K('held_check') if (not r_auto and r_checks >= 1) else (K('held_manual') if (not r_auto and r_checks == 0) else 0)"
      - r_award_on_file: "EXISTS('assistance', status='approved')"
      - r_floor_share: "K('floor_award') if r_award_on_file else (K('floor_manual') if (not r_award_on_file and not r_auto) else K('floor_standard'))"
      - r_count: "r_counted + r_award_months + r_household_months"
      - r_spread: "RND((r_balance - r_held * r_inst_old) / (r_count - r_held), 2)"
      - result: "MX(r_spread, RND(r_inst_old * r_floor_share, 2))"
    compute_basis:
      r_enrolled: "the invoice balances enrolled less every payment and every release on the plan ledger"
      r_paid: "less every payment and every release on the plan ledger"
      r_released: "less every payment and every release on the plan ledger"
      r_ledger: "The reinstated balance is the re-enrolled amount plus the plan ledger's own balance, that is the invoice balances enrolled less every payment and every release on the plan ledger, which after a default is the payments posted since the default shown as a negative figure."
      r_auto: "the plan has no automatic payments"
      r_direct: "the payments counted are those posted to the patient's invoices in the calendar-month window that runs back from today over the whole months elapsed since the default date plus one"
      r_default_release: "The re-enrolled amount is the amount released back to the invoice when the plan defaulted."
      r_basis: "The re-enrolled amount depends on what has happened to the invoice since the default: the payments counted are those posted to the patient's invoices in the calendar-month window that runs back from today over the whole months elapsed since the default date plus one (a window that reaches the default date); where such payments have been posted and the plan has no automatic payments, it is the balance due the open invoice now shows; where such payments have been posted and the plan has automatic payments, it is the amount released at default less those payments; on any other plan it is the amount released at default."
      r_balance: "The reinstated balance is the re-enrolled amount plus the plan ledger's own balance"
      r_inst_old: "the installment the plan carried when it defaulted"
      r_term_remaining: "The installments still to fall due under the term are the term's installments less those whose due date has already passed, the passed ones counted as the whole months from the plan's first due date to today plus one"
      r_run: "2 or more installments recorded missed less than 3 whole months before today"
      r_age: "that was accepted at least 6 whole months before today"
      r_counted: "The installments the reinstated balance is spread over depend on how the plan fell behind: on a plan with 2 or more installments recorded missed less than 3 whole months before today that was accepted at least 6 whole months before today, they are the whole installments the pre-default installment needs to clear the reinstated balance, the quotient rounded down; on a plan with 2 or more such missed installments accepted less than 6 whole months before today, that quotient rounded up; on any other plan, the installments still to fall due under the term."
      r_award_months: "A patient with an approved financial-assistance award adds 3 reinstatement extension months when 2 or more installments were recorded missed less than 3 whole months before today and 2 months otherwise; any other patient adds none."
      r_household: "A patient whose assistance case records a household of 3 or more"
      r_household_months: "A patient whose assistance case records a household of 3 or more adds 2 reinstatement extension months when the plan has no automatic payments and 1 month when it has automatic payments; any other patient adds none."
      r_checks: "on whose ledger a payment by check has been posted"
      r_held: "On a plan without automatic payments on whose ledger a payment by check has been posted, the next two installments stay at the pre-default installment; on a plan without automatic payments and no payment by check, the next installment stays at it; on any other plan none is held."
      r_award_on_file: "for a patient with an approved financial-assistance award it is 25 percent of the pre-default installment"
      r_floor_share: "The floor of the reinstated installment depends on the patient's situation: for a patient with an approved financial-assistance award it is 25 percent of the pre-default installment; for a patient with no approved award whose plan has no automatic payments it is 75 percent of the pre-default installment; for any other patient it is the full pre-default installment; the floor is rounded to the nearest cent, an exact half cent being rounded up."
      r_count: "The extension months are added to the installments the reinstated balance is spread over."
      r_spread: "The held installments are taken out of the reinstated balance at the pre-default installment and out of the installments counted, and the reinstated installment applies from the installment after them."
      result: "The reinstated installment is the reinstated balance divided by the installments still to fall due under the term, rounded to the nearest cent with an exact half cent rounded up, and it is never below the installment the plan carried when it defaulted; when the quotient is lower, the reinstated installment is that installment."
    factors:
      - id: reinstatement_reenrolled_basis
        effect: method
        decides: r_basis
        bindings: [r_direct, r_default_release, r_basis]
        ladder:
          - when: "payments posted to the patient's invoices since the default and no automatic payments on the plan"
            method: "the re-enrolled amount is the balance due the open invoice now shows"
          - when: "payments posted to the patient's invoices since the default and automatic payments on the plan"
            method: "the re-enrolled amount is the amount released at default less those payments"
          - when: "otherwise"
            method: "the re-enrolled amount is the amount released at default"
        baseline:
          r_basis: "r_default_release"
        evidence: [cross_category, history]
        cross_difficulty: null
      - id: reinstatement_installment_count
        effect: method
        decides: r_counted
        bindings: [r_run, r_age, r_counted]
        ladder:
          - when: "2 or more installments recorded missed in the last 3 whole months and the plan accepted at least 6 whole months before today"
            method: "the whole installments the pre-default installment needs to clear the reinstated balance, rounded down"
          - when: "2 or more installments recorded missed in the last 3 whole months and the plan accepted less than 6 whole months before today"
            method: "the installments the pre-default installment needs to clear the reinstated balance, rounded up"
          - when: "otherwise"
            method: "the installments still to fall due under the term"
        baseline:
          r_counted: "r_term_remaining"
        evidence: [history, date]
        cross_difficulty: null
      - id: reinstatement_award_months
        effect: parameter
        decides: r_award_months
        bindings: [r_award_months]
        ladder:
          - when: "an approved financial-assistance award and 2 or more installments recorded missed in the last 3 whole months"
            value: "K('award_months_run') — 3 reinstatement extension months"
          - when: "an approved financial-assistance award and fewer than 2 installments recorded missed in the last 3 whole months"
            value: "K('award_months_single') — 2 reinstatement extension months"
          - when: "otherwise"
            value: "no reinstatement extension month"
        baseline:
          r_award_months: "0"
        evidence: [cross_category, history]
        cross_difficulty: assistance
      - id: reinstatement_household_months
        effect: parameter
        decides: r_household_months
        bindings: [r_household, r_household_months]
        ladder:
          - when: "a household of 3 or more on the assistance case and no automatic payments on the plan"
            value: "K('household_months_manual') — 2 reinstatement extension months"
          - when: "a household of 3 or more on the assistance case and automatic payments on the plan"
            value: "K('household_months_automatic') — 1 reinstatement extension month"
          - when: "otherwise"
            value: "no reinstatement extension month"
        baseline:
          r_household_months: "0"
        evidence: [cross_category]
        cross_difficulty: assistance
      - id: reinstatement_held_installments
        effect: parameter
        decides: r_held
        bindings: [r_checks, r_held]
        ladder:
          - when: "no automatic payments and a payment by check posted on the plan ledger"
            value: "K('held_check') — the next two installments stay at the pre-default installment"
          - when: "no automatic payments and no payment by check on the plan ledger"
            value: "K('held_manual') — the next installment stays at the pre-default installment"
          - when: "otherwise"
            value: "no installment is held"
        baseline:
          r_held: "0"
        evidence: [history]
        cross_difficulty: null
      - id: reinstatement_floor
        effect: parameter
        decides: r_floor_share
        bindings: [r_award_on_file, r_floor_share]
        ladder:
          - when: "an approved financial-assistance award on file"
            value: "K('floor_award') — 25 percent of the pre-default installment"
          - when: "no approved award and no automatic payments on the plan"
            value: "K('floor_manual') — 75 percent of the pre-default installment"
          - when: "otherwise"
            value: "K('floor_standard') — the full pre-default installment"
        baseline:
          r_floor_share: "K('floor_standard')"
        evidence: [cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        The re-enrolled amount is the amount released back to the invoice when the plan defaulted.
        The reinstated balance is the re-enrolled amount plus the plan ledger's own balance, that is the invoice balances enrolled less every payment and every release on the plan ledger, which after a default is the payments posted since the default shown as a negative figure.
        The reinstated installment is the reinstated balance divided by the installments still to fall due under the term, rounded to the nearest cent with an exact half cent rounded up, and it is never below the installment the plan carried when it defaulted; when the quotient is lower, the reinstated installment is that installment.
        The installments still to fall due under the term are the term's installments less those whose due date has already passed, the passed ones counted as the whole months from the plan's first due date to today plus one, and the reinstated installment applies from the next installment onward.
      params: [term_months, floor_standard]
    inputs:
      history:
        - {table: plan_transactions, aggregate: sum, field: amount, filters: {event_type: plans_installment_paid}}
        - {table: plan_transactions, aggregate: sum, field: amount, filters: {event_type: plans_balance_released}}
        - {table: plan_transactions, aggregate: count, field: plan_transaction_id, within_months: 3, filters: {event_type: plans_installment_missed}}
        - {category: invoices, table: invoice_transactions, aggregate: sum, field: amount, within_months: 1, filters: {event_type: invoices_payment_received}}
      cross_category: [invoices, assistance]
