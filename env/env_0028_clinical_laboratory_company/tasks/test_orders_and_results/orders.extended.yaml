category: orders
display_name: Laboratory Test Orders

# One holding = one accession: the tests of one requisition that are performed and billed under
# one service class. A requisition listing tests of several service classes is accessioned as
# several orders that share the requisition_number.
binding:
  holding_table: orders
  event_tables: [order_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {list_price_total: gross_charges}

lifecycle:
  states: [received, info_hold, accessioned, testing_hold, in_testing, resulted, cancelled]
  transitions:
    - {from: received, to: info_hold, by: agent, means: Order placed on a pre-collection hold because information needed before collection is missing (diagnosis codes, a Medicare ABN, genetic informed consent or verified coverage).}
    - {from: info_hold, to: received, by: agent, means: Pre-collection hold released once the missing item is on file; the order again awaits its specimen.}
    - {from: received, to: accessioned, by: system, means: Specimen received at the laboratory within stability and logged against the order.}
    - {from: accessioned, to: received, by: system, means: The accessioned specimen was rejected; the order returns to awaiting a recollected specimen.}
    - {from: accessioned, to: testing_hold, by: agent, means: Specimen in house but testing may not start yet (prior authorization pending or informed consent missing).}
    - {from: testing_hold, to: in_testing, by: agent, means: Testing hold released once prior authorization is approved, consent is signed, or the patient elects self-pay.}
    - {from: accessioned, to: in_testing, by: system, means: Testing started on an accessioned specimen with no hold.}
    - {from: in_testing, to: resulted, by: system, means: Final report released to the ordering provider and the patient portal.}
    - {from: received, to: cancelled, by: user, means: The patient cancels their own order before collection.}
    - {from: info_hold, to: cancelled, by: user, means: The patient cancels their own order while it is on a pre-collection hold (including declining a test on a Medicare ABN with option 3).}
    - {from: accessioned, to: cancelled, by: user, means: The patient cancels their own order after collection but before testing starts.}
    - {from: testing_hold, to: cancelled, by: user, means: The patient cancels their own order while the specimen is held before testing.}
    - {from: received, to: cancelled, by: system, means: The laboratory cancels an order whose requisition expired uncollected or whose recollection window lapsed.}
    - {from: info_hold, to: cancelled, by: system, means: The laboratory cancels an order whose pre-collection hold exceeded its maximum length.}
    - {from: testing_hold, to: cancelled, by: system, means: The laboratory cancels an order whose testing hold exceeded its maximum length.}

accounts:
  - key: gross_charges
    unit: USD
    meaning: List-price (chargemaster) charges standing on the accession; each ordered, reflex, add-on or fee line posts in, each credited line posts out, and list_price_total on the order is their running sum.

parameter_schema:
  test_menu: "Mapping of the service class's orderable lab test numbers -> {name, cpt, list_price (USD chargemaster), self_pay_price (USD published patient-pay price), fasting_hours (0 = no fasting)}; the single source of every per-test price."
  reflex_map: "Mapping test number -> reflex test number performed automatically when the first result meets the laboratory's reflex criterion; {} when the class has no reflex testing."
  reflex_testing_enabled: "Boolean; whether reflex tests are performed and charged for this class."
  self_pay_payment_due_at_collection: "Boolean; whether a self-pay order must be paid in full at the time of collection (true) or is billed by statement after resulting (false)."
  consumer_initiated_orderable: "Boolean; whether tests of this class can be purchased as a consumer-initiated order without a physician requisition."
  consumer_physician_oversight_fee: "USD; independent-physician oversight fee charged once per consumer-initiated requisition encounter (0.00 where not orderable)."
  consumer_order_valid_days: "Calendar days, counted from the order date, within which a consumer-initiated order must be collected before it expires (0 where not orderable)."
  consumer_minimum_age_years: "Whole years; minimum patient age on the order date for a consumer-initiated order."
  consumer_max_tests_per_order: "Integer; maximum number of tests on one consumer-initiated order (0 where not orderable)."
  consumer_refund_retains_oversight_fee: "Boolean; whether the oversight fee is kept when an uncollected consumer order is cancelled or expires."
  consumer_refund_processing_business_days: "Business days within which a consumer-order refund is issued after cancellation or expiry (0 where not orderable)."
  add_on_window_days: "Calendar days after the collection date (collection date = day 0) through which an add-on test request is accepted on the existing specimen; 0 = add-ons not accepted."
  max_add_on_tests_per_accession: "Integer; maximum add-on tests that may be posted on one order."
  add_on_requires_ordering_provider: "Boolean; whether only the ordering provider or their office may request an add-on test."
  primary_specimen_type: "Enum (serum, plasma_edta, whole_blood_edta, urine, swab, tissue); the specimen type the class's tests are drawn on."
  specimen_stability_room_temp_hours: "Hours from collection a specimen stays acceptable at room temperature."
  specimen_stability_refrigerated_hours: "Hours from collection a specimen stays acceptable refrigerated."
  minimum_specimen_volume_ml: "Millilitres; minimum specimen volume below which the specimen is rejected as quantity_not_sufficient (0.0 = not volume-based)."
  rejection_notice_business_days: "Business days after a rejection within which the patient and ordering provider are notified."
  recollection_window_days: "Calendar days after the rejection date through which a no-charge recollection may be collected (0 = recollection not offered)."
  max_no_charge_recollections: "Integer; maximum recollection requests per order."
  recollection_requires_new_requisition: "Boolean; whether a recollection needs a new requisition (and therefore a new order) from the provider."
  specimen_retention_days: "Calendar days the specimen (or block/slide) is retained after resulting."
  standard_turnaround_business_days: "Business days from accession to final report for the class."
  report_copy_fulfillment_business_days: "Business days within which a patient's request for a copy of a final report is fulfilled."
  report_copy_paper_fee: "USD; fee for a mailed paper copy of a report (portal and provider copies are free)."
  corrected_report_business_days: "Business days within which a corrected report is issued once the laboratory confirms an error."
  diagnosis_code_required_for_insurance: "Boolean; whether ICD-10 diagnosis codes must be on file before an insurance-billed order is collected."
  abn_screening_applies: "Boolean; whether Original Medicare medical-necessity and frequency screening (ABN) applies to the class."
  medicare_frequency_limits_days: "Mapping test number -> minimum calendar days between Medicare-covered performances of the same test for the same patient; tests not listed have no frequency limit."
  prior_auth_required_commercial: "Boolean; prior authorization required for commercial (in- and out-of-network) plans."
  prior_auth_required_medicare_advantage: "Boolean; prior authorization (organization determination) required for Medicare Advantage plans."
  prior_auth_required_medicaid: "Boolean; prior authorization required for Medicaid managed care plans."
  prior_auth_required_tricare: "Boolean; prior authorization required for TRICARE."
  info_hold_max_days: "Calendar days a pre-collection information hold may last before the laboratory cancels the order."
  testing_hold_max_days: "Calendar days a specimen may stay on testing hold before the laboratory cancels the order."
  informed_consent_required: "Boolean; whether a signed patient informed-consent form is required before testing."
  informed_consent_valid_days: "Calendar days a signed informed consent remains valid for collection (0 where consent is not required)."
  cancellation_handling_fee_after_accession: "USD; specimen handling fee posted when the patient cancels after accessioning (0.00 = none)."
  insurance_to_self_pay_switch_window_days: "Calendar days after the collection date through which an insurance-billed order may be switched to self-pay (also requires that no claim has been submitted)."
  self_pay_to_insurance_switch_window_days: "Calendar days after the collection date through which a self-pay order may be switched to insurance billing."
  gfe_issue_business_days_on_request: "Business days within which a good faith estimate is issued after the patient requests one."
  gfe_issue_business_days_when_scheduled: "Business days within which a good faith estimate is issued once a self-pay collection is scheduled at least three business days ahead."
  gfe_valid_days: "Calendar days from the estimate date during which the estimate applies to a collection."
  client_bill_allowed: "Boolean; whether the ordering practice may elect client billing for this class."
  client_bill_allowed_for_medicare_beneficiaries: "Boolean; whether client billing is allowed when the patient's coverage is Original Medicare Part B (federal direct-billing rule)."
  requisition_valid_days: "Calendar days from the order date within which a physician requisition must be collected before it expires."
  standing_order_allowed: "Boolean; whether a standing (recurring) requisition is accepted for the class."
  standing_order_max_months: "Calendar months a standing requisition stays valid from its order date (0 where not allowed)."
  standing_order_max_draws: "Integer; maximum collections under one standing requisition (0 where not allowed)."
  duplicate_test_window_days: "Calendar days within which a second charge of the same test for the same patient on another order is treated as a duplicate and credited."

