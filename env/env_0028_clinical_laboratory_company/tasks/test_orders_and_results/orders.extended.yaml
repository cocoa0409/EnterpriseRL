- id: orders_ext_genetic_cancellation_fee
  base_policy_refs: [orders_evt_patient_cancellation, orders_agg_requisition_encounter, orders_order_intake]
  overwrite:
  - {base_policy: orders_evt_patient_cancellation, superseded_clause: Cancellation is the patient's own decision
      and is confirmed by the patient personally., replaced_by: 'Cancellation of a genetic accession is the patient''s
      own decision, confirmed by the patient personally when they run the cancellation on the accession the agent
      has located from their verified records. A patient''s cancellation of an accession of any class other than
      Hereditary & Reproductive Genetic Testing and Esoteric Reference Testing remains the patient''s own decision,
      confirmed by the patient personally, and when such an order is cancelled from accessioned or testing_hold
      and its class''s cancellation_handling_fee_after_accession is above 0.00, one orders_test_charge_posted line
      with charge_reason cancellation_handling_fee is posted at that amount; no handling fee applies to such a cancellation
      before accessioning.'}
  - {base_policy: orders_evt_patient_cancellation, superseded_clause: 'When the order was cancelled from accessioned
      or testing_hold and the class''s cancellation_handling_fee_after_accession is above 0.00, one orders_test_charge_posted
      line with charge_reason cancellation_handling_fee is posted at that amount; no handling fee applies to a cancellation
      before accessioning.', replaced_by: 'The standard genetic cancellation handling fee is the fee basis, which
      is the class''s cancellation_handling_fee_after_accession, posted as one orders_test_charge_posted line with
      charge_reason cancellation_handling_fee, never below zero and rounded to two decimal places only at the end.'}
  trigger: on_request
  subject: [orders_cancelled_by_patient, orders_test_charge_posted]
  computes: handling_fee_amount
  target_tool: cancel_genetic_test_order_d90cc330
  params: {quote_share: 0.4, consent_hold_multiplier: 0.6, early_accession_multiplier: 0.25, early_accession_days: 2,
    extra_test_fee_two: 10.0, extra_test_fee_three: 20.0, denied_auth_reduction: 15.0, pending_auth_reduction: 5.0,
    courtesy_clean: 8.0, courtesy_single: 4.0, hardship_waiver_rate: 1.0}
  rule: >
    This policy fixes the genetic cancellation handling fee, the fee posted when a patient cancels their own accession
    of the Hereditary & Reproductive Genetic Testing class before testing starts. Cancellation of a genetic accession
    is the patient's own decision, confirmed by the patient personally when they run the cancellation on the accession
    the agent has located from their verified records. A patient's cancellation of an accession of any class other
    than Hereditary & Reproductive Genetic Testing and Esoteric Reference Testing remains the patient's own decision,
    confirmed by the patient personally, and when such an order is cancelled from accessioned or testing_hold and
    its class's cancellation_handling_fee_after_accession is above 0.00, one orders_test_charge_posted line with
    charge_reason cancellation_handling_fee is posted at that amount; no handling fee applies to such a cancellation
    before accessioning. A genetic cancellation handling fee applies only when the accession is cancelled from accessioned
    or testing_hold; a cancellation from received or info_hold carries no handling fee. A cancellation of a genetic
    accession is booked only after every specimen rejection recorded on the other accessions of the same requisition
    that is still offered a no-charge recollection is answered by a recollection request on file, so that the cancellation
    notice sent to the patient and the ordering provider lists every collection still owed on the requisition. For
    a genetic accession billed to the patient directly, the handling fee is fixed only after a genetic self-pay
    quote dated within the estimate validity period of the class stands on the accession. The standard genetic cancellation
    handling fee is the fee basis, which is the class's cancellation_handling_fee_after_accession, posted as one
    orders_test_charge_posted line with charge_reason cancellation_handling_fee, never below zero and rounded to
    two decimal places only at the end. When the accession is billed self_pay and its good_faith_estimate_amount
    carries an estimate_date no more than gfe_valid_days calendar days before today, the fee basis is quote_share
    of that quote instead of the class fee; when the accession is billed insurance and the payer class of its coverage
    has patient_billing_prohibited_except_copay set to true, the fee basis is zero; any other genetic accession
    takes the class fee as its fee basis. When the accession is on testing_hold with hold_reason informed_consent_missing,
    no DNA extraction has been performed and the fee basis is multiplied by consent_hold_multiplier; when the accession
    is accessioned and its specimen has been in house fewer than early_accession_days calendar days since its received_date,
    the fee basis is multiplied by early_accession_multiplier; any other genetic accession keeps the fee basis unmultiplied.
    When three or more tests stand on the accession, counting the ordered charge lines and accepted add-on lines
    of the class's test numbers that have not been credited, extra_test_fee_three is added to the handling fee for
    the additional processing; when exactly two such tests stand, extra_test_fee_two is added to the handling fee;
    a single test adds nothing. When the accession's prior_auth_status is denied and the patient has an active coverage
    on file, denied_auth_reduction is subtracted from the handling fee; when its prior_auth_status is pending and
    the patient has an active coverage on file, pending_auth_reduction is subtracted from the handling fee; any
    other accession has nothing subtracted for authorization. When the patient's collection visits show no no_show_fee
    and no late_cancellation_fee assessed in the 12 months before today and the patient has at least one collection
    visit with status collected, courtesy_clean is subtracted from the handling fee; when they show exactly one
    such fee assessed in those 12 months and at least one collected visit, courtesy_single is subtracted from the
    handling fee; any other visit record has no courtesy subtracted. When the patient holds an approved assistance
    case whose award_start_date is on or before today and whose award_end_date is on or after today and its tier
    is the Catastrophic Medical Hardship Adjustment, the fee basis is reduced by hardship_waiver_rate of itself;
    when the approved case covering today is of any other tier, the fee basis is reduced by that tier's discount_pct;
    a patient with no approved award covering today has no assistance reduction of the fee basis.
  prerequisite:
  - {problem: orders_ext_genetic_self_pay_quote, kind: value_input, gate: quote_amount, form: state, policy_source: 'For
      a genetic accession billed to the patient directly, the handling fee is fixed only after a genetic self-pay
      quote dated within the estimate validity period of the class stands on the accession.', condition: 'on a genetic
      accession billed self_pay, orders.good_faith_estimate_amount holds a genetic self-pay quote and orders.estimate_date
      is no more than gfe_valid_days calendar days before the handling date.', resolved_by: issue_genetic_self_pay_quote_0325000c,
    effect: 'quote_amount takes the issued quote and quote_current turns true, so fee_basis moves from the class
      fee to quote_share of the quote.'}
  - {problem: orders_ext_recollection_window, kind: state_gate, gate: order_events.rejected_event_id, form: state,
    policy_source: 'A cancellation of a genetic accession is booked only after every specimen rejection recorded
      on the other accessions of the same requisition that is still offered a no-charge recollection is answered
      by a recollection request on file, so that the cancellation notice sent to the patient and the ordering provider
      lists every collection still owed on the requisition.', condition: every orders_specimen_rejected line on
      an accession sharing the genetic accession's requisition_number for which a no-charge recollection is still
      offered (the accession's recollection count below max_no_charge_recollections and no new requisition required)
      is referenced through rejected_event_id by an orders_recollection_requested line., resolved_by: request_specimen_recollection_7c5f4bb7,
    effect: 'the open rejection on the sibling accession gains its recollection request, so the cancellation of
      the genetic accession may be booked.'}
  cross_category:
  - category: coverage
    as: branch
    reads: [status, patient_billing_prohibited_except_copay]
    note: The fee basis reads the payer class of the accession's coverage, and the authorization reduction reads
      whether the patient has an active coverage on file.
  - category: visits
    as: history
    reads: [visits.status, visit_events.event_type, visit_events.fee_type, visit_events.event_date]
    note: The courtesy amount reads the patient's missed-appointment fees in the last 12 months and collected visits.
  - category: assistance
    as: branch
    reads: [status, variant_name, award_start_date, award_end_date, discount_pct]
    note: The assistance rate reads the patient's approved assistance award covering today.
  compute:
  - {genetic_accession: F('variant_name') == 'Hereditary & Reproductive Genetic Testing'}
  - {esoteric_accession: F('variant_name') == 'Esoteric Reference Testing'}
  - {quote_amount: float(F('good_faith_estimate_amount') or 0)}
  - {quote_age_days: 'DAYS(F(''estimate_date'') or NOW, NOW)'}
  - {quote_current: quote_amount > 0 and quote_age_days <= P('gfe_valid_days')}
  - {payer_blocks_patient_billing: 'CPARAM(''coverage'', ''patient_billing_prohibited_except_copay'', coverage_id=F(''coverage_id''))
      == True'}
  - {fee_basis: K('quote_share') * quote_amount if (F('billing_method') == 'self_pay' and quote_current) else (0.0
      if (F('billing_method') == 'insurance' and payer_blocks_patient_billing) else P('cancellation_handling_fee_after_accession'))}
  - {days_in_house: 'DAYS(F(''received_date'') or NOW, NOW)'}
  - {stage_multiplier: K('consent_hold_multiplier') if (F('status') == 'testing_hold' and F('hold_reason') == 'informed_consent_missing')
      else (K('early_accession_multiplier') if (F('status') == 'accessioned' and days_in_house < K('early_accession_days'))
      else 1.0)}
  - {standing_tests: 'COUNT(''order_events'', event_type=''orders_test_charge_posted'', charge_reason=''ordered'',
      test_code=''92340'') + COUNT(''order_events'', event_type=''orders_add_on_posted'', test_code=''92340'') -
      COUNT(''order_events'', event_type=''orders_test_charge_credited'', test_code=''92340'') + COUNT(''order_events'',
      event_type=''orders_test_charge_posted'', charge_reason=''ordered'', test_code=''94820'') + COUNT(''order_events'',
      event_type=''orders_add_on_posted'', test_code=''94820'') - COUNT(''order_events'', event_type=''orders_test_charge_credited'',
      test_code=''94820'') + COUNT(''order_events'', event_type=''orders_test_charge_posted'', charge_reason=''ordered'',
      test_code=''92619'') + COUNT(''order_events'', event_type=''orders_add_on_posted'', test_code=''92619'') -
      COUNT(''order_events'', event_type=''orders_test_charge_credited'', test_code=''92619'') + COUNT(''order_events'',
      event_type=''orders_test_charge_posted'', charge_reason=''ordered'', test_code=''93787'') + COUNT(''order_events'',
      event_type=''orders_add_on_posted'', test_code=''93787'') - COUNT(''order_events'', event_type=''orders_test_charge_credited'',
      test_code=''93787'') + COUNT(''order_events'', event_type=''orders_test_charge_posted'', charge_reason=''ordered'',
      test_code=''93910'') + COUNT(''order_events'', event_type=''orders_add_on_posted'', test_code=''93910'') -
      COUNT(''order_events'', event_type=''orders_test_charge_credited'', test_code=''93910'')'}
  - {extra_test_amount: K('extra_test_fee_three') if standing_tests >= 3 else (K('extra_test_fee_two') if standing_tests
      == 2 else 0)}
  - {active_coverage_on_file: 'EXISTS(''coverage'', status=''active'')'}
  - {authorization_reduction: K('denied_auth_reduction') if (F('prior_auth_status') == 'denied' and active_coverage_on_file)
      else (K('pending_auth_reduction') if (F('prior_auth_status') == 'pending' and active_coverage_on_file) else
      0)}
  - {missed_visit_fees: 'XCOUNT(''visits'', ''visit_events'', within_months=12, event_type=''visits_fee_assessed'',
      fee_type=''no_show_fee'') + XCOUNT(''visits'', ''visit_events'', within_months=12, event_type=''visits_fee_assessed'',
      fee_type=''late_cancellation_fee'')'}
  - {has_collected_visit: 'EXISTS(''visits'', status=''collected'')'}
  - {courtesy_amount: K('courtesy_clean') if (missed_visit_fees == 0 and has_collected_visit) else (K('courtesy_single')
      if (missed_visit_fees == 1 and has_collected_visit) else 0)}
  - {award_start: 'CFIELD(''assistance'', ''award_start_date'', status=''approved'') or ''9999-12-31'''}
  - {award_end: 'CFIELD(''assistance'', ''award_end_date'', status=''approved'') or ''0000-01-01'''}
  - {award_tier: 'CFIELD(''assistance'', ''variant_name'', status=''approved'')'}
  - {assistance_rate: 'K(''hardship_waiver_rate'') if ((award_start <= NOW and NOW <= award_end) and award_tier
      == ''Catastrophic Medical Hardship Adjustment'') else ((CPARAM(''assistance'', ''discount_pct'', status=''approved'')
      or 0) / 100.0 if ((award_start <= NOW and NOW <= award_end) and award_tier != ''Catastrophic Medical Hardship
      Adjustment'') else 0)'}
  - {cancelled_after_accession: F('status') == 'accessioned' or F('status') == 'testing_hold'}
  - {fee_amount: 'MX(0, fee_basis * stage_multiplier * (1 - assistance_rate) + extra_test_amount - authorization_reduction
      - courtesy_amount)'}
  - {residual_class_fee: P('cancellation_handling_fee_after_accession') if cancelled_after_accession else 0.0}
  - {result: '(RND(fee_amount, 2) if cancelled_after_accession else 0.0) if genetic_accession else (None if esoteric_accession
      else residual_class_fee)'}
  compute_basis: {quote_amount: its good_faith_estimate_amount carries an estimate_date no more than gfe_valid_days
      calendar days before today, quote_age_days: its good_faith_estimate_amount carries an estimate_date no more
      than gfe_valid_days calendar days before today, quote_current: its good_faith_estimate_amount carries an estimate_date
      no more than gfe_valid_days calendar days before today, payer_blocks_patient_billing: the payer class of its
      coverage has patient_billing_prohibited_except_copay set to true, fee_basis: 'When the accession is billed
      self_pay and its good_faith_estimate_amount carries an estimate_date no more than gfe_valid_days calendar
      days before today, the fee basis is quote_share of that quote instead of the class fee; when the accession
      is billed insurance and the payer class of its coverage has patient_billing_prohibited_except_copay set to
      true, the fee basis is zero; any other genetic accession takes the class fee as its fee basis.', days_in_house: its
      specimen has been in house fewer than early_accession_days calendar days since its received_date, stage_multiplier: 'When
      the accession is on testing_hold with hold_reason informed_consent_missing, no DNA extraction has been performed
      and the fee basis is multiplied by consent_hold_multiplier; when the accession is accessioned and its specimen
      has been in house fewer than early_accession_days calendar days since its received_date, the fee basis is
      multiplied by early_accession_multiplier; any other genetic accession keeps the fee basis unmultiplied.',
    standing_tests: counting the ordered charge lines and accepted add-on lines of the class's test numbers that
      have not been credited, extra_test_amount: 'When three or more tests stand on the accession, counting the
      ordered charge lines and accepted add-on lines of the class''s test numbers that have not been credited, extra_test_fee_three
      is added to the handling fee for the additional processing; when exactly two such tests stand, extra_test_fee_two
      is added to the handling fee; a single test adds nothing.', active_coverage_on_file: the patient has an active
      coverage on file, authorization_reduction: 'When the accession''s prior_auth_status is denied and the patient
      has an active coverage on file, denied_auth_reduction is subtracted from the handling fee; when its prior_auth_status
      is pending and the patient has an active coverage on file, pending_auth_reduction is subtracted from the handling
      fee; any other accession has nothing subtracted for authorization.', missed_visit_fees: no no_show_fee and
      no late_cancellation_fee assessed in the 12 months before today, has_collected_visit: the patient has at least
      one collection visit with status collected, courtesy_amount: 'When the patient''s collection visits show no
      no_show_fee and no late_cancellation_fee assessed in the 12 months before today and the patient has at least
      one collection visit with status collected, courtesy_clean is subtracted from the handling fee; when they
      show exactly one such fee assessed in those 12 months and at least one collected visit, courtesy_single is
      subtracted from the handling fee; any other visit record has no courtesy subtracted.', award_start: whose
      award_start_date is on or before today, award_end: whose award_end_date is on or after today, award_tier: its
      tier is the Catastrophic Medical Hardship Adjustment, assistance_rate: 'When the patient holds an approved
      assistance case whose award_start_date is on or before today and whose award_end_date is on or after today
      and its tier is the Catastrophic Medical Hardship Adjustment, the fee basis is reduced by hardship_waiver_rate
      of itself; when the approved case covering today is of any other tier, the fee basis is reduced by that tier''s
      discount_pct; a patient with no approved award covering today has no assistance reduction of the fee basis.',
    result: A genetic cancellation handling fee applies only when the accession is cancelled from accessioned or
      testing_hold; a cancellation from received or info_hold carries no handling fee., genetic_accession: 'This
      policy fixes the genetic cancellation handling fee, the fee posted when a patient cancels their own accession
      of the Hereditary & Reproductive Genetic Testing class before testing starts.', esoteric_accession: A patient's
      cancellation of an accession of any class other than Hereditary & Reproductive Genetic Testing and Esoteric
      Reference Testing, residual_class_fee: 'A patient''s cancellation of an accession of any class other than
      Hereditary & Reproductive Genetic Testing and Esoteric Reference Testing remains the patient''s own decision,
      confirmed by the patient personally, and when such an order is cancelled from accessioned or testing_hold
      and its class''s cancellation_handling_fee_after_accession is above 0.00, one orders_test_charge_posted line
      with charge_reason cancellation_handling_fee is posted at that amount; no handling fee applies to such a cancellation
      before accessioning.', fee_amount: 'The standard genetic cancellation handling fee is the fee basis, which
      is the class''s cancellation_handling_fee_after_accession, posted as one orders_test_charge_posted line with
      charge_reason cancellation_handling_fee, never below zero and rounded to two decimal places only at the end.',
    cancelled_after_accession: A genetic cancellation handling fee applies only when the accession is cancelled
      from accessioned or testing_hold; a cancellation from received or info_hold carries no handling fee.}
  factors:
  - id: fee_basis_source
    effect: method
    decides: fee_basis
    bindings: [quote_amount, quote_age_days, quote_current, payer_blocks_patient_billing, fee_basis]
    ladder:
    - {when: the genetic accession is billed self_pay AND a genetic self-pay quote dated within gfe_valid_days stands
        on it, method: the fee basis is quote_share of that quote}
    - {when: the genetic accession is billed insurance AND its coverage's payer class prohibits patient billing
        beyond copay, method: the fee basis is zero}
    - {when: otherwise, method: the fee basis is the class cancellation_handling_fee_after_accession}
    baseline: {fee_basis: P('cancellation_handling_fee_after_accession')}
    evidence: [date, cross_category]
    cross_difficulty: coverage
  - id: processing_stage
    effect: parameter
    decides: stage_multiplier
    bindings: [days_in_house, stage_multiplier]
    ladder:
    - {when: the genetic accession is on testing_hold for informed_consent_missing, value: K('consent_hold_multiplier')}
    - {when: the genetic accession is accessioned AND its specimen has been in house fewer than early_accession_days
        days, value: K('early_accession_multiplier')}
    - {when: otherwise, value: '1.0'}
    baseline: {stage_multiplier: '1.0'}
    evidence: [date]
    cross_difficulty: null
  - id: extra_tests
    effect: parameter
    decides: extra_test_amount
    bindings: [standing_tests, extra_test_amount]
    ladder:
    - {when: three or more tests stand on the genetic accession, value: K('extra_test_fee_three')}
    - {when: exactly two tests stand on the genetic accession, value: K('extra_test_fee_two')}
    - {when: otherwise (a single test), value: '0'}
    baseline: {extra_test_amount: '0'}
    evidence: [history]
    cross_difficulty: null
  - id: authorization_outcome
    effect: parameter
    decides: authorization_reduction
    bindings: [active_coverage_on_file, authorization_reduction]
    ladder:
    - {when: the accession's prior authorization is denied AND the patient has an active coverage on file, value: K('denied_auth_reduction')}
    - {when: the accession's prior authorization is pending AND the patient has an active coverage on file, value: K('pending_auth_reduction')}
    - {when: otherwise, value: '0'}
    baseline: {authorization_reduction: '0'}
    evidence: [cross_category]
    cross_difficulty: coverage
  - id: appointment_courtesy
    effect: parameter
    decides: courtesy_amount
    bindings: [missed_visit_fees, has_collected_visit, courtesy_amount]
    ladder:
    - {when: no missed-appointment fee assessed in the last 12 months AND at least one collected visit, value: K('courtesy_clean')}
    - {when: exactly one missed-appointment fee assessed in the last 12 months AND at least one collected visit,
      value: K('courtesy_single')}
    - {when: otherwise, value: '0'}
    baseline: {courtesy_amount: '0'}
    evidence: [cross_category, history]
    cross_difficulty: visits
  - id: assistance_award
    effect: parameter
    decides: assistance_rate
    bindings: [award_start, award_end, award_tier, assistance_rate]
    ladder:
    - {when: an approved Catastrophic Medical Hardship Adjustment award covers today, value: K('hardship_waiver_rate')
        as the share by which the fee basis is reduced}
    - {when: an approved award of any other tier covers today, value: 'CPARAM(''assistance'', ''discount_pct'',
        status=''approved'') / 100 as the share by which the fee basis is reduced'}
    - {when: otherwise, value: '0'}
    baseline: {assistance_rate: '0'}
    evidence: [cross_category, date]
    cross_difficulty: assistance
  baseline:
    rule: >-
      This policy fixes the genetic cancellation handling fee, the fee posted when a patient cancels their own accession
      of the Hereditary & Reproductive Genetic Testing class before testing starts. A genetic cancellation handling
      fee applies only when the accession is cancelled from accessioned or testing_hold; a cancellation from received
      or info_hold carries no handling fee. The standard genetic cancellation handling fee is the fee basis, which
      is the class's cancellation_handling_fee_after_accession, posted as one orders_test_charge_posted line with
      charge_reason cancellation_handling_fee, never below zero and rounded to two decimal places only at the end.
    params: [cancellation_handling_fee_after_accession]
  inputs:
    history:
    - table: order_events
      aggregate: count
      field: order_event_id
      filters: {event_type: orders_test_charge_posted, charge_reason: ordered}
    - table: order_events
      aggregate: count
      field: order_event_id
      filters: {event_type: orders_test_charge_credited}
    - category: visits
      table: visit_events
      aggregate: count
      field: visit_event_id
      within_months: 12
      filters: {event_type: visits_fee_assessed}
    cross_category: [coverage, visits, assistance]
- id: orders_ext_reference_self_pay_estimate
  base_policy_refs: [orders_agg_requisition_encounter, orders_evt_good_faith_estimate]
  overwrite:
  - {base_policy: orders_agg_requisition_encounter, superseded_clause: 'A good faith estimate is issued per requisition
      encounter, never per order: its amount is the sum, over every order of the encounter, of the self_pay_price
      in that order''s test_menu of each test currently charged and not credited on the order, plus the consumer_physician_oversight_fee
      once when the encounter is consumer-initiated; the same amount and the same estimate date are written to every
      order of the encounter.', replaced_by: A reference-testing accession is estimated on its own and the estimate
      amount and the issue date are written to that accession only.}
  - {base_policy: orders_evt_good_faith_estimate, superseded_clause: 'when an add-on test is accepted on a self-pay
      order, or the estimate has lapsed before collection, a new estimate replaces the old one on every order of
      the encounter.', replaced_by: 'When an add-on test is accepted on a self-pay reference-testing accession,
      or its estimate has lapsed before collection, a new reference-testing self-pay estimate replaces the old one
      on that accession alone; no other order of the requisition is re-estimated by it.'}
  - {base_policy: orders_evt_good_faith_estimate, superseded_clause: The amount follows the requisition-encounter
      rule., replaced_by: 'The standard reference-testing self-pay estimate is the test price sum: the sum, over
      every test standing on the accession (each ordered charge line and each accepted add-on line that has not
      been credited), of that test''s self_pay_price in the class test_menu, which this policy carries in its params
      as reference_self_pay_price followed by the test number.'}
  trigger: state_due
  subject: [orders_estimate_issued]
  computes: estimate_amount
  target_tool: issue_reference_test_estimate_b0801821
  params: {reference_self_pay_price_36169: 119.0, reference_self_pay_price_17985: 109.0, reference_self_pay_price_16293: 98.0,
    reference_self_pay_price_34484: 169.0, reference_self_pay_price_91716: 149.0, panel_rate_four: 0.12, panel_rate_two: 0.04,
    uninsured_estimate_rate: 0.2, out_of_network_rate: 0.1, provisional_assistance_rate: 0.1}
  rule: >
    This policy fixes the reference-testing self-pay estimate, the good faith estimate written on an accession of
    the Esoteric Reference Testing class that is billed self_pay. A reference-testing accession is estimated on
    its own and the estimate amount and the issue date are written to that accession only. When an add-on test is
    accepted on a self-pay reference-testing accession, or its estimate has lapsed before collection, a new reference-testing
    self-pay estimate replaces the old one on that accession alone; no other order of the requisition is re-estimated
    by it. The standard reference-testing self-pay estimate is the test price sum: the sum, over every test standing
    on the accession (each ordered charge line and each accepted add-on line that has not been credited), of that
    test's self_pay_price in the class test_menu, which this policy carries in its params as reference_self_pay_price
    followed by the test number. When four or more tests stand on the accession, the estimate is reduced by panel_rate_four
    of the test price sum as a multi-test reduction; when two or three tests stand on it, the estimate is reduced
    by panel_rate_two of the test price sum; a single test takes no multi-test reduction. When the patient has no
    coverage on file with status active, whether the patient was never insured or the coverage has ended, the estimate
    is reduced by uninsured_estimate_rate of the test price sum; when the patient's active coverage on file is of
    the Commercial Out-of-Network Plan payer class, the estimate is reduced by out_of_network_rate of the test price
    sum; a patient whose active coverage is of any other payer class takes no coverage-loss reduction. When the
    patient holds an approved assistance case whose award_start_date is on or before the estimate date and whose
    award_end_date is on or after it, the estimate is reduced by that tier's discount_pct of the test price sum;
    when no approved award covers the estimate date and the patient has an assistance case under_review, with no
    decision yet, the estimate is reduced by provisional_assistance_rate of the test price sum until the decision;
    a patient with neither takes no assistance reduction. When the accession's specimen was collected at a Mobile
    In-Home Collection Visit that served no additional household patient, the visit's assessed collection-service
    fees net of any waived amount are added to the estimate; when it was collected at a Mobile In-Home Collection
    Visit that also served additional household patients, the visit's assessed trip_fee and weekend_surcharge net
    of any waived amount are divided equally among the patient and the additional household patients and that share
    is added to the estimate, the additional_patient_fee belonging to the household members; a specimen collected
    any other way adds no collection-service fee to the estimate. The reference-testing self-pay estimate is rounded
    to two decimal places only at the end.
  prerequisite: []
  cross_category:
  - category: coverage
    as: existence
    reads: [status, variant_name]
    note: The coverage-loss rate reads whether the patient has an active coverage and the payer class of that coverage.
  - category: assistance
    as: branch
    reads: [status, award_start_date, award_end_date, discount_pct]
    note: The assistance rate reads the patient's approved award or a case under review.
  - category: visits
    as: history
    reads: [visits.visit_id, visits.variant_name, visits.additional_household_patients, visit_events.fee_amount,
      visit_events.fee_type, visit_events.event_type]
    note: The collection-service amount reads the collection visit recorded for the accession and its fee lines.
  compute:
  - {standing_36169: 'COUNT(''order_events'', event_type=''orders_test_charge_posted'', charge_reason=''ordered'',
      test_code=''36169'') + COUNT(''order_events'', event_type=''orders_add_on_posted'', test_code=''36169'') -
      COUNT(''order_events'', event_type=''orders_test_charge_credited'', test_code=''36169'')'}
  - {standing_17985: 'COUNT(''order_events'', event_type=''orders_test_charge_posted'', charge_reason=''ordered'',
      test_code=''17985'') + COUNT(''order_events'', event_type=''orders_add_on_posted'', test_code=''17985'') -
      COUNT(''order_events'', event_type=''orders_test_charge_credited'', test_code=''17985'')'}
  - {standing_16293: 'COUNT(''order_events'', event_type=''orders_test_charge_posted'', charge_reason=''ordered'',
      test_code=''16293'') + COUNT(''order_events'', event_type=''orders_add_on_posted'', test_code=''16293'') -
      COUNT(''order_events'', event_type=''orders_test_charge_credited'', test_code=''16293'')'}
  - {standing_34484: 'COUNT(''order_events'', event_type=''orders_test_charge_posted'', charge_reason=''ordered'',
      test_code=''34484'') + COUNT(''order_events'', event_type=''orders_add_on_posted'', test_code=''34484'') -
      COUNT(''order_events'', event_type=''orders_test_charge_credited'', test_code=''34484'')'}
  - {standing_91716: 'COUNT(''order_events'', event_type=''orders_test_charge_posted'', charge_reason=''ordered'',
      test_code=''91716'') + COUNT(''order_events'', event_type=''orders_add_on_posted'', test_code=''91716'') -
      COUNT(''order_events'', event_type=''orders_test_charge_credited'', test_code=''91716'')'}
  - {self_pay_sum: standing_36169 * K('reference_self_pay_price_36169') + standing_17985 * K('reference_self_pay_price_17985')
      + standing_16293 * K('reference_self_pay_price_16293') + standing_34484 * K('reference_self_pay_price_34484')
      + standing_91716 * K('reference_self_pay_price_91716')}
  - {standing_count: standing_36169 + standing_17985 + standing_16293 + standing_34484 + standing_91716}
  - {multi_test_rate: K('panel_rate_four') if standing_count >= 4 else (K('panel_rate_two') if (standing_count >=
      2 and standing_count <= 3) else 0)}
  - {has_active_coverage: 'EXISTS(''coverage'', status=''active'')'}
  - {active_payer_class: 'CFIELD(''coverage'', ''variant_name'', status=''active'') or '''''}
  - {coverage_loss_rate: K('uninsured_estimate_rate') if (not has_active_coverage) else (K('out_of_network_rate')
      if (has_active_coverage and active_payer_class == 'Commercial Out-of-Network Plan') else 0)}
  - {award_from: 'CFIELD(''assistance'', ''award_start_date'', status=''approved'') or ''9999-12-31'''}
  - {award_to: 'CFIELD(''assistance'', ''award_end_date'', status=''approved'') or ''0000-01-01'''}
  - {case_under_review: 'EXISTS(''assistance'', status=''under_review'')'}
  - {assistance_estimate_rate: '(CPARAM(''assistance'', ''discount_pct'', status=''approved'') or 0) / 100.0 if
      (award_from <= NOW and NOW <= award_to) else (K(''provisional_assistance_rate'') if (case_under_review and
      not (award_from <= NOW and NOW <= award_to)) else 0)'}
  - {collecting_visit: 'CFIELD(''visits'', ''visit_id'', order_id=HID, status=''collected'')'}
  - {collecting_visit_type: 'CFIELD(''visits'', ''variant_name'', order_id=HID, status=''collected'')'}
  - {household_extra: 'CFIELD(''visits'', ''additional_household_patients'', order_id=HID, status=''collected'')
      or 0'}
  - {visit_fees_net: 'XSUM(''visits'', ''visit_events'', ''fee_amount'', visit_id=collecting_visit, event_type=''visits_fee_assessed'')
      - XSUM(''visits'', ''visit_events'', ''fee_amount'', visit_id=collecting_visit, event_type=''visits_fee_waived'')'}
  - {trip_and_weekend_net: 'XSUM(''visits'', ''visit_events'', ''fee_amount'', visit_id=collecting_visit, event_type=''visits_fee_assessed'',
      fee_type=''trip_fee'') + XSUM(''visits'', ''visit_events'', ''fee_amount'', visit_id=collecting_visit, event_type=''visits_fee_assessed'',
      fee_type=''weekend_surcharge'') - XSUM(''visits'', ''visit_events'', ''fee_amount'', visit_id=collecting_visit,
      event_type=''visits_fee_waived'', fee_type=''trip_fee'') - XSUM(''visits'', ''visit_events'', ''fee_amount'',
      visit_id=collecting_visit, event_type=''visits_fee_waived'', fee_type=''weekend_surcharge'')'}
  - {collection_service_amount: visit_fees_net if (collecting_visit_type == 'Mobile In-Home Collection Visit' and
      household_extra == 0) else (trip_and_weekend_net / (1 + household_extra) if (collecting_visit_type == 'Mobile
      In-Home Collection Visit' and household_extra >= 1) else 0)}
  - {result: 'RND(self_pay_sum - self_pay_sum * multi_test_rate - self_pay_sum * coverage_loss_rate - self_pay_sum
      * assistance_estimate_rate + collection_service_amount, 2)'}
  compute_basis: {standing_36169: every test standing on the accession (each ordered charge line and each accepted
      add-on line that has not been credited), standing_17985: every test standing on the accession (each ordered
      charge line and each accepted add-on line that has not been credited), standing_16293: every test standing
      on the accession (each ordered charge line and each accepted add-on line that has not been credited), standing_34484: every
      test standing on the accession (each ordered charge line and each accepted add-on line that has not been credited),
    standing_91716: every test standing on the accession (each ordered charge line and each accepted add-on line
      that has not been credited), self_pay_sum: 'The standard reference-testing self-pay estimate is the test price
      sum: the sum, over every test standing on the accession (each ordered charge line and each accepted add-on
      line that has not been credited), of that test''s self_pay_price in the class test_menu, which this policy
      carries in its params as reference_self_pay_price followed by the test number.', standing_count: When four
      or more tests stand on the accession, multi_test_rate: 'When four or more tests stand on the accession, the
      estimate is reduced by panel_rate_four of the test price sum as a multi-test reduction; when two or three
      tests stand on it, the estimate is reduced by panel_rate_two of the test price sum; a single test takes no
      multi-test reduction.', has_active_coverage: 'When the patient has no coverage on file with status active,
      whether the patient was never insured or the coverage has ended', active_payer_class: when the patient's active
      coverage on file is of the Commercial Out-of-Network Plan payer class, coverage_loss_rate: 'When the patient
      has no coverage on file with status active, whether the patient was never insured or the coverage has ended,
      the estimate is reduced by uninsured_estimate_rate of the test price sum; when the patient''s active coverage
      on file is of the Commercial Out-of-Network Plan payer class, the estimate is reduced by out_of_network_rate
      of the test price sum; a patient whose active coverage is of any other payer class takes no coverage-loss
      reduction.', award_from: whose award_start_date is on or before the estimate date, award_to: whose award_end_date
      is on or after it, case_under_review: 'the patient has an assistance case under_review, with no decision yet',
    assistance_estimate_rate: 'When the patient holds an approved assistance case whose award_start_date is on or
      before the estimate date and whose award_end_date is on or after it, the estimate is reduced by that tier''s
      discount_pct of the test price sum; when no approved award covers the estimate date and the patient has an
      assistance case under_review, with no decision yet, the estimate is reduced by provisional_assistance_rate
      of the test price sum until the decision; a patient with neither takes no assistance reduction.', collecting_visit: the
      accession's specimen was collected at a Mobile In-Home Collection Visit, collecting_visit_type: the accession's
      specimen was collected at a Mobile In-Home Collection Visit, household_extra: that served no additional household
      patient, visit_fees_net: the visit's assessed collection-service fees net of any waived amount are added to
      the estimate, trip_and_weekend_net: the visit's assessed trip_fee and weekend_surcharge net of any waived
      amount are divided equally among the patient and the additional household patients, collection_service_amount: 'When
      the accession''s specimen was collected at a Mobile In-Home Collection Visit that served no additional household
      patient, the visit''s assessed collection-service fees net of any waived amount are added to the estimate;
      when it was collected at a Mobile In-Home Collection Visit that also served additional household patients,
      the visit''s assessed trip_fee and weekend_surcharge net of any waived amount are divided equally among the
      patient and the additional household patients and that share is added to the estimate, the additional_patient_fee
      belonging to the household members; a specimen collected any other way adds no collection-service fee to the
      estimate.', result: The reference-testing self-pay estimate is rounded to two decimal places only at the end.}
  factors:
  - id: multi_test_count
    effect: parameter
    decides: multi_test_rate
    bindings: [standing_36169, standing_17985, standing_16293, standing_34484, standing_91716, standing_count, multi_test_rate]
    ladder:
    - {when: four or more tests stand on the reference-testing accession, value: K('panel_rate_four')}
    - {when: two or three tests stand on the reference-testing accession, value: K('panel_rate_two')}
    - {when: otherwise (a single test), value: '0'}
    baseline: {multi_test_rate: '0'}
    evidence: [history]
    cross_difficulty: null
  - id: coverage_loss
    effect: parameter
    decides: coverage_loss_rate
    bindings: [has_active_coverage, active_payer_class, coverage_loss_rate]
    ladder:
    - {when: no coverage on file with status active (never insured or coverage ended), value: K('uninsured_estimate_rate')}
    - {when: an active coverage on file of the Commercial Out-of-Network Plan payer class, value: K('out_of_network_rate')}
    - {when: otherwise, value: '0'}
    baseline: {coverage_loss_rate: '0'}
    evidence: [cross_category]
    cross_difficulty: coverage
  - id: assistance_position
    effect: parameter
    decides: assistance_estimate_rate
    bindings: [award_from, award_to, case_under_review, assistance_estimate_rate]
    ladder:
    - {when: an approved assistance award covers the estimate date, value: 'CPARAM(''assistance'', ''discount_pct'',
        status=''approved'') / 100'}
    - {when: no approved award covers the estimate date AND an assistance case is under_review with no decision,
      value: K('provisional_assistance_rate')}
    - {when: otherwise, value: '0'}
    baseline: {assistance_estimate_rate: '0'}
    evidence: [cross_category, date]
    cross_difficulty: assistance
  - id: home_collection_share
    effect: method
    decides: collection_service_amount
    bindings: [collecting_visit, collecting_visit_type, household_extra, visit_fees_net, trip_and_weekend_net, collection_service_amount]
    ladder:
    - {when: collected at a Mobile In-Home Collection Visit AND the visit served no additional household patient,
      method: add the visit's assessed collection-service fees net of waivers}
    - {when: collected at a Mobile In-Home Collection Visit AND the visit served additional household patients,
      method: add the visit's net trip_fee and weekend_surcharge divided equally among the patients collected}
    - {when: otherwise, method: add no collection-service fee}
    baseline: {collection_service_amount: '0'}
    evidence: [cross_category, history]
    cross_difficulty: visits
  baseline:
    rule: >-
      This policy fixes the reference-testing self-pay estimate, the good faith estimate written on an accession
      of the Esoteric Reference Testing class that is billed self_pay. A reference-testing accession is estimated
      on its own and the estimate amount and the issue date are written to that accession only. The standard reference-testing
      self-pay estimate is the test price sum: the sum, over every test standing on the accession (each ordered
      charge line and each accepted add-on line that has not been credited), of that test's self_pay_price in the
      class test_menu, which this policy carries in its params as reference_self_pay_price followed by the test
      number. The reference-testing self-pay estimate is rounded to two decimal places only at the end.
    params: [reference_self_pay_price_36169, reference_self_pay_price_17985, reference_self_pay_price_16293, reference_self_pay_price_34484,
      reference_self_pay_price_91716]
  inputs:
    history:
    - table: order_events
      aggregate: count
      field: order_event_id
      filters: {event_type: orders_test_charge_posted, charge_reason: ordered}
    - table: order_events
      aggregate: count
      field: order_event_id
      filters: {event_type: orders_add_on_posted}
    - table: order_events
      aggregate: count
      field: order_event_id
      filters: {event_type: orders_test_charge_credited}
    - category: visits
      table: visit_events
      aggregate: sum
      field: fee_amount
      filters: {event_type: visits_fee_assessed}
    - category: visits
      table: visit_events
      aggregate: sum
      field: fee_amount
      filters: {event_type: visits_fee_waived}
    cross_category: [coverage, assistance, visits]
- id: orders_ext_reference_cancellation_fee
  base_policy_refs: [orders_evt_patient_cancellation, orders_agg_requisition_encounter, orders_order_intake]
  overwrite:
  - {base_policy: orders_evt_patient_cancellation, superseded_clause: Cancellation is the patient's own decision
      and is confirmed by the patient personally., replaced_by: Cancelling a reference-testing accession is the
      patient's own decision; the patient confirms it personally by running the cancellation on the accession the
      agent has found in the patient's verified records.}
  - {base_policy: orders_evt_patient_cancellation, superseded_clause: 'When the order was cancelled from accessioned
      or testing_hold and the class''s cancellation_handling_fee_after_accession is above 0.00, one orders_test_charge_posted
      line with charge_reason cancellation_handling_fee is posted at that amount; no handling fee applies to a cancellation
      before accessioning.', replaced_by: 'The standard reference-testing cancellation handling fee is the starting
      amount, which is the class''s cancellation_handling_fee_after_accession, booked as a single orders_test_charge_posted
      line with charge_reason cancellation_handling_fee, never below zero and rounded to two decimal places only
      at the end.'}
  trigger: on_request
  subject: [orders_cancelled_by_patient, orders_test_charge_posted]
  computes: handling_fee_amount
  target_tool: cancel_reference_test_order_ed257856
  params: {estimate_share: 0.1, early_batch_days: 2, early_batch_multiplier: 0.5, waiting_batch_multiplier: 0.8,
    aliquot_fee_four: 6.0, aliquot_fee_two: 3.0, add_on_retrieval_two: 8.0, add_on_retrieval_one: 4.0, good_standing_courtesy: 5.0,
    single_payment_courtesy: 2.0, correction_apology: 5.0, duplicate_apology: 2.0}
  rule: >
    This policy fixes the reference-testing cancellation handling fee, the fee booked when a patient cancels their
    own accession of the Esoteric Reference Testing class before testing starts. Cancelling a reference-testing
    accession is the patient's own decision; the patient confirms it personally by running the cancellation on the
    accession the agent has found in the patient's verified records. The reference-testing cancellation handling
    fee is booked only for an accession cancelled from accessioned or testing_hold; an accession cancelled from
    received or info_hold is booked no handling fee. For a reference-testing accession billed to the patient directly,
    the handling fee is not fixed until a reference-testing self-pay estimate dated within the class's estimate
    validity period, and no earlier than the last add-on test accepted on the accession, stands on it. The standard
    reference-testing cancellation handling fee is the starting amount, which is the class's cancellation_handling_fee_after_accession,
    booked as a single orders_test_charge_posted line with charge_reason cancellation_handling_fee, never below
    zero and rounded to two decimal places only at the end. When the accession is billed self_pay and carries a
    good_faith_estimate_amount whose estimate_date is within gfe_valid_days calendar days before today and on or
    after the event_date of the latest orders_add_on_posted line on the accession, the starting amount is estimate_share
    of that estimate; when the accession is billed insurance and the payer class of its coverage has patient_billing_prohibited_except_copay
    set to true, the starting amount is zero; any other reference-testing accession starts from the class fee. When
    the accession is accessioned and its specimen has been in house fewer than early_batch_days calendar days since
    its received_date, the starting amount is multiplied by early_batch_multiplier because the specimen has not
    yet been aliquoted for its reference batch; when the accession is accessioned and its specimen has been in house
    early_batch_days calendar days or more, the starting amount is multiplied by waiting_batch_multiplier; an accession
    on testing_hold keeps the starting amount unmultiplied. When four or more tests stand on the accession, counting
    ordered charge lines and accepted add-on lines not credited, aliquot_fee_four is added to the handling fee for
    aliquoting; when two or three tests stand, aliquot_fee_two is added to the handling fee; a single test adds
    no aliquoting amount. When two add-on lines have been posted on the accession, whether or not either was later
    credited, add_on_retrieval_two is added to the handling fee for the specimen retrievals already made; when one
    has been posted, add_on_retrieval_one is added to the handling fee; an accession on which no add-on was ever
    posted adds no retrieval amount. When the patient's invoice activity shows at least two invoices_payment_received
    lines in the 24 months before today and no invoices_payment_reversed line in those 24 months, good_standing_courtesy
    is subtracted from the handling fee; when it shows exactly one payment received and no payment reversed in those
    24 months, single_payment_courtesy is subtracted from the handling fee; any other payment record, including
    one with a reversed payment, has no courtesy subtracted. When the accession carries an orders_test_charge_credited
    line with credit_reason billing_correction, correction_apology is subtracted from the handling fee; when it
    carries a credit with credit_reason duplicate_test and none with billing_correction, duplicate_apology is subtracted
    from the handling fee; an accession with neither has no apology subtracted.
  prerequisite:
  - {problem: orders_ext_reference_self_pay_estimate, kind: value_input, gate: estimate_on_file, form: state, policy_source: 'For
      a reference-testing accession billed to the patient directly, the handling fee is not fixed until a reference-testing
      self-pay estimate dated within the class''s estimate validity period, and no earlier than the last add-on
      test accepted on the accession, stands on it.', condition: orders.good_faith_estimate_amount is set on the
      reference-testing accession and orders.estimate_date is within gfe_valid_days calendar days before the handling
      date and on or after the event_date of the latest orders_add_on_posted line on the accession., resolved_by: issue_reference_test_estimate_b0801821,
    effect: 'estimate_on_file takes the newly issued estimate and estimate_current turns true, so the starting amount
      moves from the class fee to estimate_share of the estimate.'}
  cross_category:
  - category: coverage
    as: branch
    reads: [patient_billing_prohibited_except_copay]
    note: The starting amount reads the payer class of the accession's coverage when it is billed to insurance.
  - category: invoices
    as: history
    reads: [invoice_transactions.event_type, invoice_transactions.event_date]
    note: The courtesy reads the patient's payments received and reversed in the last 24 months.
  compute:
  - {estimate_on_file: float(F('good_faith_estimate_amount') or 0)}
  - {estimate_age_days: 'DAYS(F(''estimate_date'') or NOW, NOW)'}
  - {latest_add_on_date: 'LATEST(''order_events'', ''event_date'', event_type=''orders_add_on_posted'') or ''0000-01-01'''}
  - {estimate_current: estimate_on_file > 0 and estimate_age_days <= P('gfe_valid_days') and (F('estimate_date')
      or '0000-01-01') >= latest_add_on_date}
  - {payer_bars_patient_billing: 'CPARAM(''coverage'', ''patient_billing_prohibited_except_copay'', coverage_id=F(''coverage_id''))
      == True'}
  - {starting_amount: K('estimate_share') * estimate_on_file if (F('billing_method') == 'self_pay' and estimate_current)
      else (0.0 if (F('billing_method') == 'insurance' and payer_bars_patient_billing) else P('cancellation_handling_fee_after_accession'))}
  - {days_since_receipt: 'DAYS(F(''received_date'') or NOW, NOW)'}
  - {batch_multiplier: K('early_batch_multiplier') if (F('status') == 'accessioned' and days_since_receipt < K('early_batch_days'))
      else (K('waiting_batch_multiplier') if (F('status') == 'accessioned' and days_since_receipt >= K('early_batch_days'))
      else 1.0)}
  - {tests_standing: 'COUNT(''order_events'', event_type=''orders_test_charge_posted'', charge_reason=''ordered'')
      + COUNT(''order_events'', event_type=''orders_add_on_posted'') - COUNT(''order_events'', event_type=''orders_test_charge_credited'')'}
  - {aliquoting_amount: K('aliquot_fee_four') if tests_standing >= 4 else (K('aliquot_fee_two') if (tests_standing
      >= 2 and tests_standing <= 3) else 0)}
  - {add_ons_standing: 'COUNT(''order_events'', event_type=''orders_add_on_posted'')'}
  - {retrieval_amount: K('add_on_retrieval_two') if add_ons_standing >= 2 else (K('add_on_retrieval_one') if add_ons_standing
      == 1 else 0)}
  - {payments_in_24m: 'XCOUNT(''invoices'', ''invoice_transactions'', within_months=24, event_type=''invoices_payment_received'')'}
  - {reversals_in_24m: 'XCOUNT(''invoices'', ''invoice_transactions'', within_months=24, event_type=''invoices_payment_reversed'')'}
  - {payment_courtesy: K('good_standing_courtesy') if (payments_in_24m >= 2 and reversals_in_24m == 0) else (K('single_payment_courtesy')
      if (payments_in_24m == 1 and reversals_in_24m == 0) else 0)}
  - {correction_credits: 'COUNT(''order_events'', event_type=''orders_test_charge_credited'', credit_reason=''billing_correction'')'}
  - {duplicate_credits: 'COUNT(''order_events'', event_type=''orders_test_charge_credited'', credit_reason=''duplicate_test'')'}
  - {apology_amount: K('correction_apology') if correction_credits >= 1 else (K('duplicate_apology') if (duplicate_credits
      >= 1 and correction_credits == 0) else 0)}
  - {fee_before_floor: starting_amount * batch_multiplier + aliquoting_amount + retrieval_amount - payment_courtesy
      - apology_amount}
  - {fee_applies: F('status') == 'accessioned' or F('status') == 'testing_hold'}
  - {result: 'RND(MX(0, fee_before_floor), 2) if fee_applies else 0.0'}
  compute_basis: {estimate_on_file: carries a good_faith_estimate_amount whose estimate_date is within gfe_valid_days
      calendar days before today, estimate_age_days: whose estimate_date is within gfe_valid_days calendar days
      before today, latest_add_on_date: on or after the event_date of the latest orders_add_on_posted line on the
      accession, estimate_current: carries a good_faith_estimate_amount whose estimate_date is within gfe_valid_days
      calendar days before today and on or after the event_date of the latest orders_add_on_posted line on the accession,
    payer_bars_patient_billing: the payer class of its coverage has patient_billing_prohibited_except_copay set
      to true, starting_amount: 'When the accession is billed self_pay and carries a good_faith_estimate_amount
      whose estimate_date is within gfe_valid_days calendar days before today and on or after the event_date of
      the latest orders_add_on_posted line on the accession, the starting amount is estimate_share of that estimate;
      when the accession is billed insurance and the payer class of its coverage has patient_billing_prohibited_except_copay
      set to true, the starting amount is zero; any other reference-testing accession starts from the class fee.',
    days_since_receipt: its specimen has been in house fewer than early_batch_days calendar days since its received_date,
    batch_multiplier: 'When the accession is accessioned and its specimen has been in house fewer than early_batch_days
      calendar days since its received_date, the starting amount is multiplied by early_batch_multiplier because
      the specimen has not yet been aliquoted for its reference batch; when the accession is accessioned and its
      specimen has been in house early_batch_days calendar days or more, the starting amount is multiplied by waiting_batch_multiplier;
      an accession on testing_hold keeps the starting amount unmultiplied.', tests_standing: counting ordered charge
      lines and accepted add-on lines not credited, aliquoting_amount: 'When four or more tests stand on the accession,
      counting ordered charge lines and accepted add-on lines not credited, aliquot_fee_four is added to the handling
      fee for aliquoting; when two or three tests stand, aliquot_fee_two is added to the handling fee; a single
      test adds no aliquoting amount.', add_ons_standing: 'When two add-on lines have been posted on the accession,
      whether or not either was later credited', retrieval_amount: 'When two add-on lines have been posted on the
      accession, whether or not either was later credited, add_on_retrieval_two is added to the handling fee for
      the specimen retrievals already made; when one has been posted, add_on_retrieval_one is added to the handling
      fee; an accession on which no add-on was ever posted adds no retrieval amount.', payments_in_24m: at least
      two invoices_payment_received lines in the 24 months before today, reversals_in_24m: no invoices_payment_reversed
      line in those 24 months, payment_courtesy: 'When the patient''s invoice activity shows at least two invoices_payment_received
      lines in the 24 months before today and no invoices_payment_reversed line in those 24 months, good_standing_courtesy
      is subtracted from the handling fee; when it shows exactly one payment received and no payment reversed in
      those 24 months, single_payment_courtesy is subtracted from the handling fee; any other payment record, including
      one with a reversed payment, has no courtesy subtracted.', correction_credits: carries an orders_test_charge_credited
      line with credit_reason billing_correction, duplicate_credits: when it carries a credit with credit_reason
      duplicate_test and none with billing_correction, apology_amount: 'When the accession carries an orders_test_charge_credited
      line with credit_reason billing_correction, correction_apology is subtracted from the handling fee; when it
      carries a credit with credit_reason duplicate_test and none with billing_correction, duplicate_apology is
      subtracted from the handling fee; an accession with neither has no apology subtracted.', fee_before_floor: 'The
      standard reference-testing cancellation handling fee is the starting amount, which is the class''s cancellation_handling_fee_after_accession,
      booked as a single orders_test_charge_posted line with charge_reason cancellation_handling_fee, never below
      zero and rounded to two decimal places only at the end.', fee_applies: The reference-testing cancellation
      handling fee is booked only for an accession cancelled from accessioned or testing_hold; an accession cancelled
      from received or info_hold is booked no handling fee., result: 'The standard reference-testing cancellation
      handling fee is the starting amount, which is the class''s cancellation_handling_fee_after_accession, booked
      as a single orders_test_charge_posted line with charge_reason cancellation_handling_fee, never below zero
      and rounded to two decimal places only at the end.'}
  factors:
  - id: starting_amount_source
    effect: method
    decides: starting_amount
    bindings: [estimate_on_file, estimate_age_days, latest_add_on_date, estimate_current, payer_bars_patient_billing,
      starting_amount]
    ladder:
    - {when: 'the reference-testing accession is billed self_pay AND a current estimate, dated no earlier than its
        last add-on, stands on it', method: the starting amount is estimate_share of that estimate}
    - {when: the reference-testing accession is billed insurance AND its coverage's payer class bars patient billing
        beyond copay, method: the starting amount is zero}
    - {when: otherwise, method: the starting amount is the class cancellation_handling_fee_after_accession}
    baseline: {starting_amount: P('cancellation_handling_fee_after_accession')}
    evidence: [date, history, cross_category]
    cross_difficulty: coverage
  - id: batch_stage
    effect: parameter
    decides: batch_multiplier
    bindings: [days_since_receipt, batch_multiplier]
    ladder:
    - {when: accessioned AND in house fewer than early_batch_days days, value: K('early_batch_multiplier')}
    - {when: accessioned AND in house early_batch_days days or more, value: K('waiting_batch_multiplier')}
    - {when: otherwise (on testing_hold), value: '1.0'}
    baseline: {batch_multiplier: '1.0'}
    evidence: [date]
    cross_difficulty: null
  - id: aliquot_count
    effect: parameter
    decides: aliquoting_amount
    bindings: [tests_standing, aliquoting_amount]
    ladder:
    - {when: four or more tests stand on the reference-testing accession, value: K('aliquot_fee_four')}
    - {when: two or three tests stand, value: K('aliquot_fee_two')}
    - {when: otherwise (a single test), value: '0'}
    baseline: {aliquoting_amount: '0'}
    evidence: [history]
    cross_difficulty: null
  - id: add_on_retrieval
    effect: parameter
    decides: retrieval_amount
    bindings: [add_ons_standing, retrieval_amount]
    ladder:
    - {when: two add-on lines have been posted on the accession (credited or not), value: K('add_on_retrieval_two')}
    - {when: one add-on line has been posted on the accession, value: K('add_on_retrieval_one')}
    - {when: otherwise (no add-on ever posted), value: '0'}
    baseline: {retrieval_amount: '0'}
    evidence: [history]
    cross_difficulty: null
  - id: payment_standing
    effect: parameter
    decides: payment_courtesy
    bindings: [payments_in_24m, reversals_in_24m, payment_courtesy]
    ladder:
    - {when: at least two payments received in the last 24 months AND no payment reversed in them, value: K('good_standing_courtesy')}
    - {when: exactly one payment received AND no payment reversed in the last 24 months, value: K('single_payment_courtesy')}
    - {when: otherwise, value: '0'}
    baseline: {payment_courtesy: '0'}
    evidence: [cross_category, history]
    cross_difficulty: invoices
  - id: correction_apology
    effect: parameter
    decides: apology_amount
    bindings: [correction_credits, duplicate_credits, apology_amount]
    ladder:
    - {when: a billing_correction credit stands on the reference-testing accession, value: K('correction_apology')}
    - {when: a duplicate_test credit and no billing_correction credit stand on it, value: K('duplicate_apology')}
    - {when: otherwise, value: '0'}
    baseline: {apology_amount: '0'}
    evidence: [history]
    cross_difficulty: null
  baseline:
    rule: >-
      This policy fixes the reference-testing cancellation handling fee, the fee booked when a patient cancels their
      own accession of the Esoteric Reference Testing class before testing starts. The reference-testing cancellation
      handling fee is booked only for an accession cancelled from accessioned or testing_hold; an accession cancelled
      from received or info_hold is booked no handling fee. The standard reference-testing cancellation handling
      fee is the starting amount, which is the class's cancellation_handling_fee_after_accession, booked as a single
      orders_test_charge_posted line with charge_reason cancellation_handling_fee, never below zero and rounded
      to two decimal places only at the end.
    params: [cancellation_handling_fee_after_accession]
  inputs:
    history:
    - table: order_events
      aggregate: count
      field: order_event_id
      filters: {event_type: orders_test_charge_posted, charge_reason: ordered}
    - table: order_events
      aggregate: count
      field: order_event_id
      filters: {event_type: orders_add_on_posted}
    - table: order_events
      aggregate: count
      field: order_event_id
      filters: {event_type: orders_test_charge_credited}
    - table: order_events
      aggregate: latest
      field: event_date
      filters: {event_type: orders_add_on_posted}
    - category: invoices
      table: invoice_transactions
      aggregate: count
      field: invoice_transaction_id
      within_months: 24
      filters: {event_type: invoices_payment_received}
    cross_category: [coverage, invoices]
