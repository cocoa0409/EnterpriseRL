  trigger: state_due
  subject: [orders_estimate_issued]
  computes: quote_amount
  target_tool: issue_genetic_self_pay_quote_0325000c
  params: {genetic_self_pay_price_92340: 349.0, genetic_self_pay_price_94820: 349.0, genetic_self_pay_price_92619: 349.0,
    genetic_self_pay_price_93787: 299.0, genetic_self_pay_price_93910: 199.0, second_test_share: 0.5, third_test_share: 0.25,
    transport_redraw_rate: 0.1, collection_redraw_rate: 0.05, single_payment_prompt_credit: 10.0, uninsured_quote_rate: 0.1,
    denied_authorization_rate: 0.05}
  rule: >
    This policy fixes the genetic self-pay quote, the good faith estimate written on an accession of the Hereditary
    & Reproductive Genetic Testing class that is billed self_pay. A genetic accession is quoted on its own, apart
    from the other accessions of its requisition, and the quote amount and the issue date are written to that accession
    only. When an add-on test is accepted on a self-pay genetic accession, or its genetic self-pay quote has lapsed
    before collection, a new genetic self-pay quote replaces the old one on that accession only, and the other accessions
    of the requisition keep their own estimates. The accessions of every class other than Hereditary & Reproductive
    Genetic Testing and Esoteric Reference Testing keep the requisition-encounter estimate: their good faith estimate
    is issued per requisition encounter over those accessions only, its amount is the sum, over each such order
    of the encounter, of the self_pay_price in that order's test_menu of each test currently charged and not credited
    on the order, plus the consumer_physician_oversight_fee once when the encounter is consumer-initiated, the same
    amount and the same estimate date are written to every such order, and when an add-on test is accepted on a
    self-pay order of those classes, or their estimate has lapsed before collection, a new estimate replaces the
    old one on every such order of the encounter. The standard genetic self-pay quote is the test price sum: the
    sum, over every test charged on the accession with an ordered charge line and not credited, of that test's price,
    each test being priced at the self_pay_price in the class test_menu, which this policy carries in its params
    as genetic_self_pay_price followed by the test number. When three or more such tests stand on the accession,
    the highest-priced test keeps its full self-pay price and every other test is priced at third_test_share of
    its self-pay price; when exactly two such tests stand on the accession, the higher-priced test keeps its full
    self-pay price and the other is priced at second_test_share of its self-pay price; a single test keeps its full
    self-pay price. When any orders_specimen_rejected line on the accession carries the reason stability_exceeded
    or leaked_in_transit, the quote is reduced by transport_redraw_rate of the test price sum as a redraw courtesy;
    when the accession carries rejections and none of them has either of those two reasons, the quote is reduced
    by collection_redraw_rate of the test price sum; an accession with no rejection takes no redraw courtesy. When
    the patient's invoice activity shows at least two invoices_payment_received lines in the 24 months before the
    quote date and no invoices_payment_reversed line in those 24 months, the quote is reduced by the prompt_pay_discount_pct
    of the Self-Pay Patient Invoice billing class taken of the test price sum; when that activity shows exactly
    one payment received and no payment reversed in those 24 months, the quote is reduced by a fixed credit of single_payment_prompt_credit;
    any other payment record, including one with a reversed payment, brings no prompt-pay reduction. When the patient
    has no coverage on file with status active, the quote is reduced by uninsured_quote_rate of the test price sum;
    when the patient has an active coverage on file and the accession's prior_auth_status is denied, the quote is
    reduced by denied_authorization_rate of the test price sum; any other accession takes no coverage reduction.
    The genetic self-pay quote is rounded to two decimal places only at the end.
  prerequisite: []
  cross_category:
  - category: invoices
    as: history
    reads: [invoice_transactions.event_type, invoice_transactions.event_date, prompt_pay_discount_pct]
    note: The prompt-pay rate is decided from the patient's payments received and reversed in the last 24 months
      and the Self-Pay Patient Invoice prompt-pay percentage.
  - category: coverage
    as: existence
    reads: [status]
    note: The coverage rate is decided from whether the patient has an active coverage on file.
  compute:
  - {genetic_scope: F('variant_name') == 'Hereditary & Reproductive Genetic Testing'}
  - {standing_92340: 'COUNT(''order_events'', event_type=''orders_test_charge_posted'', charge_reason=''ordered'',
      test_code=''92340'') - COUNT(''order_events'', event_type=''orders_test_charge_credited'', test_code=''92340'')'}
  - {standing_94820: 'COUNT(''order_events'', event_type=''orders_test_charge_posted'', charge_reason=''ordered'',
      test_code=''94820'') - COUNT(''order_events'', event_type=''orders_test_charge_credited'', test_code=''94820'')'}
  - {standing_92619: 'COUNT(''order_events'', event_type=''orders_test_charge_posted'', charge_reason=''ordered'',
      test_code=''92619'') - COUNT(''order_events'', event_type=''orders_test_charge_credited'', test_code=''92619'')'}
  - {standing_93787: 'COUNT(''order_events'', event_type=''orders_test_charge_posted'', charge_reason=''ordered'',
      test_code=''93787'') - COUNT(''order_events'', event_type=''orders_test_charge_credited'', test_code=''93787'')'}
  - {standing_93910: 'COUNT(''order_events'', event_type=''orders_test_charge_posted'', charge_reason=''ordered'',
      test_code=''93910'') - COUNT(''order_events'', event_type=''orders_test_charge_credited'', test_code=''93910'')'}
  - {listed_total: standing_92340 * K('genetic_self_pay_price_92340') + standing_94820 * K('genetic_self_pay_price_94820')
      + standing_92619 * K('genetic_self_pay_price_92619') + standing_93787 * K('genetic_self_pay_price_93787')
      + standing_93910 * K('genetic_self_pay_price_93910')}
  - {test_count: standing_92340 + standing_94820 + standing_92619 + standing_93787 + standing_93910}
  - {top_price: 'max(K(''genetic_self_pay_price_92340'') if standing_92340 > 0 else 0, K(''genetic_self_pay_price_94820'')
      if standing_94820 > 0 else 0, K(''genetic_self_pay_price_92619'') if standing_92619 > 0 else 0, K(''genetic_self_pay_price_93787'')
      if standing_93787 > 0 else 0, K(''genetic_self_pay_price_93910'') if standing_93910 > 0 else 0)'}
  - {priced_amount: top_price + (listed_total - top_price) * K('third_test_share') if test_count >= 3 else (top_price
      + (listed_total - top_price) * K('second_test_share') if test_count == 2 else listed_total)}
  - {transport_rejections: 'COUNT(''order_events'', event_type=''orders_specimen_rejected'', rejection_reason=''stability_exceeded'')
      + COUNT(''order_events'', event_type=''orders_specimen_rejected'', rejection_reason=''leaked_in_transit'')'}
  - {all_rejections: 'COUNT(''order_events'', event_type=''orders_specimen_rejected'')'}
  - {redraw_rate: K('transport_redraw_rate') if transport_rejections >= 1 else (K('collection_redraw_rate') if (all_rejections
      >= 1 and transport_rejections == 0) else 0)}
  - {payments_24m: 'XCOUNT(''invoices'', ''invoice_transactions'', within_months=24, event_type=''invoices_payment_received'')'}
  - {reversals_24m: 'XCOUNT(''invoices'', ''invoice_transactions'', within_months=24, event_type=''invoices_payment_reversed'')'}
  - {prompt_pay_reduction: 'priced_amount * (CPARAM(''invoices'', ''prompt_pay_discount_pct'', variant_name=''Self-Pay
      Patient Invoice'') or 0) / 100.0 if (payments_24m >= 2 and reversals_24m == 0) else (K(''single_payment_prompt_credit'')
      if (payments_24m == 1 and reversals_24m == 0) else 0)'}
  - {active_coverage: 'EXISTS(''coverage'', status=''active'')'}
  - {coverage_rate: K('uninsured_quote_rate') if (not active_coverage) else (K('denied_authorization_rate') if (active_coverage
      and F('prior_auth_status') == 'denied') else 0)}
  - {result: 'RND(priced_amount - priced_amount * redraw_rate - priced_amount * coverage_rate - prompt_pay_reduction,
      2) if genetic_scope else None'}
  compute_basis: {standing_92340: every test charged on the accession with an ordered charge line and not credited,
    standing_94820: every test charged on the accession with an ordered charge line and not credited, standing_92619: every
      test charged on the accession with an ordered charge line and not credited, standing_93787: every test charged
      on the accession with an ordered charge line and not credited, standing_93910: every test charged on the accession
      with an ordered charge line and not credited, listed_total: 'The standard genetic self-pay quote is the test
      price sum: the sum, over every test charged on the accession with an ordered charge line and not credited,
      of that test''s price, each test being priced at the self_pay_price in the class test_menu, which this policy
      carries in its params as genetic_self_pay_price followed by the test number.', test_count: When three or more
      such tests stand on the accession, top_price: the highest-priced test keeps its full self-pay price, priced_amount: 'When
      three or more such tests stand on the accession, the highest-priced test keeps its full self-pay price and
      every other test is priced at third_test_share of its self-pay price; when exactly two such tests stand on
      the accession, the higher-priced test keeps its full self-pay price and the other is priced at second_test_share
      of its self-pay price; a single test keeps its full self-pay price.', transport_rejections: When any orders_specimen_rejected
      line on the accession carries the reason stability_exceeded or leaked_in_transit, all_rejections: when the
      accession carries rejections and none of them has either of those two reasons, redraw_rate: 'When any orders_specimen_rejected
      line on the accession carries the reason stability_exceeded or leaked_in_transit, the quote is reduced by
      transport_redraw_rate of the test price sum as a redraw courtesy; when the accession carries rejections and
      none of them has either of those two reasons, the quote is reduced by collection_redraw_rate of the test price
      sum; an accession with no rejection takes no redraw courtesy.', payments_24m: at least two invoices_payment_received
      lines in the 24 months before the quote date, reversals_24m: no invoices_payment_reversed line in those 24
      months, prompt_pay_reduction: 'When the patient''s invoice activity shows at least two invoices_payment_received
      lines in the 24 months before the quote date and no invoices_payment_reversed line in those 24 months, the
      quote is reduced by the prompt_pay_discount_pct of the Self-Pay Patient Invoice billing class taken of the
      test price sum; when that activity shows exactly one payment received and no payment reversed in those 24
      months, the quote is reduced by a fixed credit of single_payment_prompt_credit; any other payment record,
      including one with a reversed payment, brings no prompt-pay reduction.', active_coverage: When the patient
      has no coverage on file with status active, coverage_rate: 'When the patient has no coverage on file with
      status active, the quote is reduced by uninsured_quote_rate of the test price sum; when the patient has an
      active coverage on file and the accession''s prior_auth_status is denied, the quote is reduced by denied_authorization_rate
      of the test price sum; any other accession takes no coverage reduction.', result: The genetic self-pay quote
      is rounded to two decimal places only at the end., genetic_scope: 'The accessions of every class other than
      Hereditary & Reproductive Genetic Testing and Esoteric Reference Testing keep the requisition-encounter estimate:
      their good faith estimate is issued per requisition encounter over those accessions only, its amount is the
      sum, over each such order of the encounter, of the self_pay_price in that order''s test_menu of each test
      currently charged and not credited on the order, plus the consumer_physician_oversight_fee once when the encounter
      is consumer-initiated, the same amount and the same estimate date are written to every such order, and when
      an add-on test is accepted on a self-pay order of those classes, or their estimate has lapsed before collection,
      a new estimate replaces the old one on every such order of the encounter.'}
  factors:
  - id: test_bundling
    effect: parameter
    decides: priced_amount
    bindings: [standing_92340, standing_94820, standing_92619, standing_93787, standing_93910, test_count, top_price,
      priced_amount]
    ladder:
    - {when: three or more tests stand on the genetic accession, value: K('third_test_share') as the price share
        of every test other than the highest-priced one}
    - {when: exactly two tests stand on the genetic accession, value: K('second_test_share') as the price share
        of the lower-priced test}
    - {when: otherwise (a single test), value: 1 (the test keeps its full self-pay price)}
    baseline: {priced_amount: listed_total}
    evidence: [history]
    cross_difficulty: null
  - id: redraw_courtesy
    effect: parameter
    decides: redraw_rate
    bindings: [transport_rejections, all_rejections, redraw_rate]
    ladder:
    - {when: a rejection on the genetic accession carries stability_exceeded or leaked_in_transit, value: K('transport_redraw_rate')}
    - {when: the genetic accession carries rejections and none has either of those reasons, value: K('collection_redraw_rate')}
    - {when: otherwise (no rejection), value: '0'}
    baseline: {redraw_rate: '0'}
    evidence: [history]
    cross_difficulty: null
  - id: prompt_pay_record
    effect: method
    decides: prompt_pay_reduction
    bindings: [payments_24m, reversals_24m, prompt_pay_reduction]
    ladder:
    - {when: at least two payments received in the 24 months before the quote date AND no payment reversed in those
        24 months, method: the quote is reduced by the Self-Pay Patient Invoice prompt_pay_discount_pct taken of
        the test price sum}
    - {when: exactly one payment received AND no payment reversed in those 24 months, method: 'the quote is reduced
        by a fixed credit of single_payment_prompt_credit, whatever the test price sum'}
    - {when: 'otherwise (no payment, or any reversed payment)', method: no prompt-pay reduction}
    baseline: {prompt_pay_reduction: '0'}
    evidence: [cross_category, history]
    cross_difficulty: invoices
  - id: coverage_standing
    effect: parameter
    decides: coverage_rate
    bindings: [active_coverage, coverage_rate]
    ladder:
    - {when: the patient has no coverage on file with status active, value: K('uninsured_quote_rate')}
    - {when: the patient has an active coverage on file AND the accession's prior authorization was denied, value: K('denied_authorization_rate')}
    - {when: otherwise, value: '0'}
    baseline: {coverage_rate: '0'}
    evidence: [cross_category]
    cross_difficulty: coverage
