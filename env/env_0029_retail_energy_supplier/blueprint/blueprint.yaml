name: env_0029_retail_energy_supplier
company: Beacon Ridge Energy

background: |
  Beacon Ridge Energy is a licensed competitive retail electricity and natural gas supplier headquartered in Pittsburgh, serving roughly 410,000 households and 23,000 business sites across the deregulated markets of Pennsylvania, Ohio, Illinois, New Jersey and Maryland.
  It buys power and gas wholesale and sells supply under contract, while the local utilities such as PECO, PPL Electric Utilities, AEP Ohio, ComEd, PSE&G, BGE and Columbia Gas still own the wires and pipes, read the meters and carry Beacon Ridge's charges on their consolidated bills.
  Its customer care center is plain-spoken and practical, and handles calls from households, small business owners and the energy managers of large facilities.
  Every product is a supply contract the customer holds for one premise, which moves through enrollment with the utility, active supply, renewal or rollover, and finally a drop when the customer cancels, moves or switches away.
  Residential Electricity Supply is sold as Beacon Ridge Monthly Variable, Beacon Ridge Price Lock 6, Beacon Ridge Price Lock 12, Beacon Ridge Price Lock 24, Beacon Ridge Free Nights 12, Beacon Ridge Clean Wind 12 and Beacon Ridge Clean Wind 24, and Residential Natural Gas Supply as Beacon Ridge Gas Monthly Variable, Beacon Ridge Gas Capped Variable 12, Beacon Ridge Gas Price Lock 12, Beacon Ridge Gas Price Lock 24, Beacon Ridge Gas Price Lock 36, Beacon Ridge Carbon Offset Gas 12 and Beacon Ridge Carbon Offset Gas 24.
  Small Business Electricity Supply offers Beacon Ridge Business Monthly Variable, Beacon Ridge Business Fixed 12, Beacon Ridge Business Fixed 24, Beacon Ridge Business Fixed 36, Beacon Ridge Business Green 24 and Beacon Ridge Business Green 36, and Commercial Natural Gas Supply offers Beacon Ridge Commercial Gas Monthly Index, Beacon Ridge Commercial Gas Fixed Basis 12, Beacon Ridge Commercial Gas Fixed 12, Beacon Ridge Commercial Gas Fixed 24, Beacon Ridge Commercial Gas Fixed 36 and Beacon Ridge Commercial Gas Carbon Neutral 24.
  Large facilities sign individually priced Commercial and Industrial Electricity Contracts in six structures: Beacon Ridge C&I Real-Time Index, Beacon Ridge C&I Block and Index, Beacon Ridge C&I Fixed Energy with Capacity and Transmission Pass-Through, Beacon Ridge C&I Fixed Energy with Capacity Pass-Through, Beacon Ridge C&I Fixed All-In and Beacon Ridge C&I Fixed All-In Renewable.
  Alongside supply, Beacon Ridge sells Community Solar Subscriptions in Illinois, Maryland and New Jersey as Beacon Ridge Solar Share Flex, Beacon Ridge Solar Share 1-Year, Beacon Ridge Solar Share 5-Year, Beacon Ridge Solar Share 10-Year, Beacon Ridge Solar Share 20-Year and Beacon Ridge Solar Share Income-Eligible.
  It also sells Home Protection Plans as Beacon Ridge Surge Shield, Beacon Ridge Electric Line Guard, Beacon Ridge Gas Line Guard, Beacon Ridge Home Wiring Care, Beacon Ridge HVAC Repair Plan, Beacon Ridge HVAC Complete and Beacon Ridge Whole Home Shield.
  Every supply agreement books a running ledger on the utility bill each billing cycle: energy or gas charges at the contract or variable rate, service fees, pass-through and tax lines for businesses, promotional and loyalty bill credits, early termination fees and rebill credits.
  Alongside the ledger, each agreement accumulates its notices: welcome confirmations from the utility, variable rate and market price notices, regulatory pass-through notices and contract expiration notices with renewal offers.
  Community solar subscriptions are invoiced monthly against the credits the utility applies, and protection plans bill a monthly fee and record repair claims.
  A typical household holds an electricity agreement, often a gas agreement at the same address and sometimes a protection plan or a solar share, and calls about a renewal letter, a rate that rose after a contract expired, a cancellation fee, a missing sign-up credit or a move.
  Small businesses and restaurants usually hold one to a dozen sites on business plans and call about automatic renewals, sales tax, relocations and multi-site credits, while facility and energy managers of manufacturers, hospitals and warehouses call about quotes, pass-through charges, deposits, holdover pricing and termination damages.
  Most callers bring months or years of history: past plan changes, renewals and rollovers, earlier rebill credits, cancelled agreements at previous addresses, and referrals of friends and neighbors.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: residential_electricity_care
    claim:
      categories: [power]
      event_types: [power_enroll, power_rescind, power_cancel, power_cancel_withdraw, power_plan_change, power_renew, power_etf_charge, power_credit, power_adjustment]
    summary: >
      Households call about the electricity agreements on their premises: new enrollments and second premises, second thoughts right after signing, cancellations because of a move or a cheaper offer, plan changes from a variable rate to a price lock, renewal letters and rates that jumped after a term expired, missing sign-up, online, referral or dual-fuel credits, and supply lines they believe were billed at the wrong rate.
      The setting varies along the plan ladder (variable, short and long price locks, the time-of-use Free Nights plan and the Clean Wind plans), along the agreement status (enrollment_pending with or without a utility confirmation date, active, drop_pending, closed after a switch-away or move-out), along the customer's other holdings (a Beacon Ridge gas agreement at the same premise, other premises, a utility assistance program enrollment, a referrer or referred friend) and along the history of notices, rollovers, plan changes and bill lines.
      The governing rules read the agreement, the premise, the customer profile, the price offers, the notices and the billing ledger: premise and state eligibility, assistance program and smart meter restrictions and one live agreement per premise (power_enrollment_eligibility, power_agg_multi_holding); the rescission window anchored on the utility's confirmation date (power_rescission); per-plan early termination fees with remaining-month counting, free windows, move, assistance-program and upgrade waivers and a state cap (power_etf); plan change direction limits (power_plan_change_terms); notice compliance, rollover rates and the post-expiry renewal grace with loyalty credits (power_expiry_notices, power_rollover_terms, power_renewal); variable rates, introductory cycles and late notices (power_variable_rate, power_regulatory_passthrough); sign-up, online, referral and dual-fuel credit qualification and caps (power_signup_credit, power_referral_credit, power_agg_dual_fuel); and rebill credits bounded by a lookback and an agent limit (power_billing_correction).
      In the natural course of the business an enrollment is confirmed by the utility before supply starts, a cancellation is confirmed before it is scheduled, and fees and credits are booked on top of the agreement's status at that time.
      The agent verifies identity, explains and computes, posts fees, credits and rebill credits, records enrollments and plan changes, and opens a billing dispute when a correction exceeds its limit, while the customer alone confirms a rescission, a cancellation or its withdrawal, and an acceptance of a renewal offer.
      Requests no policy decides, such as disputing the kWh the utility measured, asking for a goodwill credit outside any program, or asking to change a fixed rate mid-term because market prices fell, are handed to a human representative as POLICY_NOT_COVERED.

  - name: residential_gas_care
    claim:
      categories: [gas]
      event_types: [gas_enroll, gas_rescind, gas_cancel, gas_cancel_withdraw, gas_plan_change, gas_renew, gas_etf_charge, gas_credit, gas_adjustment]
    summary: >
      Households call about natural gas supply: enrolling a premise with gas service, rescinding after the utility's confirmation letter, cancelling during the heating season, questions about why the capped plan billed a lower rate than the variable notice, renewal offers and rollovers, sign-up and loyalty credits, the smart thermostat that came with a long plan, and service fees they think should have been waived.
      Settings vary across the gas ladder (monthly variable, capped variable, price locks up to 36 months and carbon offset plans), across status from enrollment_pending to closed, across combinations with a Beacon Ridge electricity agreement on the same premise or other gas premises of the same customer, and across histories of variable rate notices, expiration notices, shipped thermostats, prior plan changes and corrected bill lines.
      The rules are premise, state and assistance-program eligibility with one live gas agreement per premise (gas_enrollment_eligibility, gas_agg_multi_holding); the rescission window (gas_rescission); variable and capped pricing with late-notice deferral (gas_variable_rate, gas_regulatory_passthrough); the dual-fuel service fee waiver that depends on the electricity agreement (gas_supply_billing); expiry notices, rollover and renewal grace with loyalty credits (gas_expiry_notices, gas_rollover_terms, gas_renewal); plan change limits (gas_plan_change_terms); early termination fees and the separate thermostat recovery fee with their waivers and caps (gas_etf); thermostat fulfillment and the per-customer thermostat limit (gas_thermostat_fulfillment, gas_agg_thermostat_limit); sign-up credits (gas_signup_credit); and rebill credits within the lookback and agent limit (gas_billing_correction).
      In the natural course of the business the utility confirms an enrollment before supply starts, a thermostat ships only after a number of billed cycles, and termination fees follow a confirmed cancellation.
      The agent verifies identity, explains rates, records enrollments and plan changes, posts termination fees, credits and rebill credits and opens billing disputes above its limit, while rescission, cancellation and its withdrawal, and acceptance of a renewal offer are the customer's own confirmations.
      Requests such as a goodwill waiver of a thermostat recovery fee, a dispute of the therms the utility read, or a request to keep a capped rate beyond its term are outside every policy and are handed off as POLICY_NOT_COVERED.

  - name: small_business_electricity_care
    claim:
      categories: [bizpower]
      event_types: [bizpower_enroll, bizpower_rescind, bizpower_cancel, bizpower_cancel_withdraw, bizpower_renew, bizpower_renewal_decline, bizpower_site_transfer, bizpower_fee_charge, bizpower_credit, bizpower_adjustment]
    summary: >
      Owners and office managers of small businesses call about the electricity agreements of their sites: adding a site, relocating a shop, stopping an automatic renewal they did not expect, renewing early for the loyalty credit, cancelling because the business closed or grew into a large-facility contract, sales tax on the bill, the multi-site credit and sign-up credits after a broker enrollment.
      The setting varies by plan (monthly variable, fixed 12 to 36 months and the Green plans), by status, by how many of the business's sites are supplied, by whether the current term began through automatic renewal, by the state's sales tax and whether an exemption certificate was validated, and by the history of expiration notices, renewal elections, transfers and bill lines.
      The governing rules are commercial-site and usage-limit eligibility with no cap on sites but one live agreement per site (bizpower_enrollment_eligibility, bizpower_agg_multi_holding); the rescission window (bizpower_rescission); billing of energy, fees and sales tax with exemptions taking effect only forward (bizpower_supply_billing, bizpower_tax_exemption_terms); variable rates and pass-throughs (bizpower_variable_rate, bizpower_regulatory_passthrough); notice compliance, the opt-out window anchored on the final options notice, automatic renewal and rollover (bizpower_expiry_notices, bizpower_auto_renewal); explicit renewal with loyalty credit (bizpower_renewal); site transfers with a fee (bizpower_site_transfer_terms); early termination fees measured on remaining estimated kWh with free windows and the C&I upgrade waiver (bizpower_etf); and sign-up, multi-site and rebill credits (bizpower_signup_credit, bizpower_agg_multi_site, bizpower_billing_correction).
      In the natural course of the business notices precede the opt-out deadline and the expiry, an automatic renewal follows the absence of a decline, and termination fees follow a confirmed cancellation.
      The agent verifies identity, explains terms, records enrollments and site transfers, posts fees, credits and rebill credits, and opens billing disputes above its limit, while the authorized representative alone rescinds, cancels or withdraws a cancellation, declines automatic renewal, or accepts a renewal offer.
      Requests such as refunding sales tax billed before an exemption certificate arrived, waiving a fee because the business closed, or renegotiating a fixed rate mid-term fall outside the policies and are handed off as POLICY_NOT_COVERED.

  - name: commercial_gas_care
    claim:
      categories: [bizgas]
      event_types: [bizgas_enroll, bizgas_withdraw, bizgas_cancel, bizgas_renew, bizgas_etf_charge, bizgas_credit, bizgas_adjustment]
    summary: >
      Restaurants, laundries, schools and light manufacturers call about commercial gas supply: enrolling a site, withdrawing an enrollment that has not yet been confirmed, swing charges in a cold month, index and NYMEX prices on a fixed basis plan, renewals and what happened after a term rolled to the monthly index, termination damages when a site closes, and charges they believe were billed wrong.
      The setting varies by structure (monthly index, fixed basis, fixed with bandwidth, carbon neutral), by status, by contracted annual volume against actual usage, by whether the business's other sites share a portfolio bandwidth, by whether the site also takes Beacon Ridge electricity, and by the history of monthly price notices, expiration notices and bill lines.
      The governing rules are site eligibility by class and annual therms with one live agreement per site (bizgas_enrollment_eligibility, bizgas_agg_multi_holding); withdrawal only before utility confirmation (bizgas_withdrawal); pricing per structure from the month's price notice and the dual-commodity fee waiver (bizgas_supply_billing, bizgas_index_pricing, bizgas_regulatory_passthrough); bandwidth, excess and shortfall swing and the portfolio bandwidth across sites (bizgas_swing, bizgas_agg_portfolio_bandwidth); notices, rollover to the index with a late-notice price hold and renewal with a grace period and loyalty credit (bizgas_expiry_notices, bizgas_rollover_terms, bizgas_renewal); forward-only tax exemptions (bizgas_tax_exemption_terms); cancellations that cannot be withdrawn (bizgas_cancellation); liquidated damages on remaining contract therms (bizgas_etf); and rebill credits within the lookback and agent limit (bizgas_billing_correction).
      In the natural course of the business a utility confirmation closes the withdrawal path, the month's price notice precedes the bill for that month, and damages follow a confirmed cancellation.
      The agent verifies identity, explains pricing and swing, records enrollments, posts fees, credits and rebill credits and opens billing disputes above its limit, while the authorized representative alone withdraws an enrollment, confirms a cancellation or accepts a renewal offer.
      Requests such as an annual volume true-up refund, a waiver of damages for a closed site, or a re-price of a signed fixed term are not covered by any policy and are handed off as POLICY_NOT_COVERED.

  - name: cni_contract_care
    claim:
      categories: [cni]
      event_types: [cni_contract_execute, cni_preflow_terminate, cni_terminate, cni_holdover_terminate, cni_renew, cni_holdover_renew, cni_etf_charge, cni_adjustment, cni_deposit_post, cni_deposit_refund]
    summary: >
      Energy and facility managers of large commercial and industrial sites call about their individually priced contracts: signing a quote before it expires, renewing before or after the term ends, ending holdover service, terminating early after a plant closure, security deposits and their refunds, and capacity, transmission or index lines they want explained or corrected.
      The setting varies by structure (real-time index, block and index, fixed energy with capacity and transmission pass-through, fixed energy with capacity pass-through, fixed all-in and renewable all-in), by status (pending_enrollment, active, termination_pending, holdover, closed), by the customer's credit grade and deposits held across other facilities, by a small business agreement still live at the facility, and by the history of quotes, market notices, expiry notices and bill lines.
      The governing rules are quote-based execution within the quote validity and one live contract per facility (cni_pricing_and_execution, cni_agg_multi_holding); deposits sized by credit grade and capped across the portfolio, due before enrollment and refunded only after closing (cni_agg_deposit_cap, cni_security_deposit, cni_enrollment_processing); energy pricing per structure, block and index splits and holdover pricing with the late-notice adder waiver (cni_energy_billing, cni_expiry_and_holdover); capacity and transmission pass-through computed from tags, prices and billing days (cni_capacity_transmission, cni_market_notices); renewals that always require new pricing (cni_renewal_terms); notice-period terminations and pre-flow terminations (cni_termination); liquidated damages on remaining contracted kWh with a minimum (cni_etf); and rebill credits within a long lookback and a higher agent limit (cni_billing_correction).
      In the natural course of the business a quote is priced before a contract is signed, a deposit is posted before the utility enrollment, and damages follow the termination notice.
      The agent verifies identity, opens pricing requests, records deposits and their refunds, posts termination damages and rebill credits, while the customer's authorized signatory alone signs a quote or renewal, gives termination notice or ends holdover service.
      Requests such as honouring an expired quote, netting termination damages against the deposit, re-billing past cycles after a tag revision, or a correction above the agent's limit are not covered by care policy and are handed off as POLICY_NOT_COVERED.
