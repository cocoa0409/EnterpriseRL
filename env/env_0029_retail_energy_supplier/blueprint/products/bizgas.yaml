category: bizgas
display_name: Commercial Natural Gas Supply

binding:
  holding_table: bizgas_agreements
  event_tables: [bizgas_billing, bizgas_notices]
  intake_tables: [bizgas_billing_disputes]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [enrollment_pending, active, drop_pending, closed, withdrawn, rejected]
  transitions:
    - {from: enrollment_pending, to: active, by: system, means: The gas utility moves the business site to Beacon Ridge supply on the scheduled meter read date.}
    - {from: enrollment_pending, to: withdrawn, by: user, means: The business withdraws its enrollment before the gas utility has confirmed it.}
    - {from: enrollment_pending, to: rejected, by: system, means: The gas utility rejects the enrollment transaction.}
    - {from: active, to: drop_pending, by: user, means: The business confirms cancellation and a drop is scheduled for the next meter read.}
    - {from: drop_pending, to: closed, by: system, means: The gas utility completes the scheduled drop.}
    - {from: active, to: closed, by: system, means: The gas utility ends Beacon Ridge supply because another supplier enrolled the site or the site was final-billed.}

accounts:
  - key: bizgas_supply_billed
    unit: USD
    meaning: Net Beacon Ridge commercial gas charges billed on the agreement; supply, swing, fee, tax and termination lines increase it, credits and rebill credits reduce it.

parameter_schema:
  rate_type: Pricing structure (string enum index | fixed_basis | fixed).
  term_months: Length of the term in months (integer; 0 means month-to-month).
  carbon_offset_pct: Share of usage whose combustion emissions are matched with retired carbon offsets (percent, integer).
  offset_standard: Registry standard of the offsets (string; "none" when none).
  offset_tco2e_per_therm: Metric tons of CO2e offset per therm billed (decimal, 4 places).
  offset_statement: Whether the business receives an annual offset retirement statement (boolean).
  monthly_service_fee_usd: Flat supplier service fee per site per billing cycle (USD, 2 decimals).
  dual_commodity_fee_waiver: Whether the fee is not billed for a cycle in which the same site has an active Beacon Ridge business electricity agreement or commercial and industrial contract (boolean).
  nymex_component_floats: Whether the NYMEX component of the price floats monthly with the published settlement (boolean).
  basis_locked: Whether the delivered basis component is locked for the term (boolean).
  adder_locked: Whether the Beacon Ridge adder is locked for the term (boolean).
  price_publication_basis: Which monthly price notice prices a billing cycle (string enum notice_for_month_of_billing_period_start).
  swing_applies: Whether usage outside the bandwidth is billed separately from the fixed price (boolean).
  swing_tolerance_pct: Bandwidth around the monthly contract volume within which usage is billed at the fixed price (percent, integer).
  swing_excess_adder_usd_therm: Adder over the monthly index applied to therms above the bandwidth (USD per therm, 4 decimals).
  swing_shortfall_charge_usd_therm: Charge per therm of shortfall below the bandwidth (USD per therm, 4 decimals).
  swing_measurement_period: Period over which usage is compared with contract volume (string enum billing_cycle).
  monthly_volume_basis: How the monthly contract volume is derived (string enum contract_annual_therms_divided_by_12_rounded_half_up).
  portfolio_bandwidth: Whether the bandwidth is measured on the combined usage and volume of all the business's sites on portfolio plans rather than site by site (boolean).
  annual_volume_true_up: Whether an annual true-up of total usage against contract volume is billed (boolean).
  regulatory_passthrough_allowed: Whether the price may be adjusted during the term to pass through a change in law or regulation (boolean).
  regulatory_change_notice_days: Minimum calendar days between a pass-through notice and its effective date (integer days).
  etf_method: How the early termination fee is computed (string enum none | per_remaining_therm).
  etf_rate_usd_per_therm: Liquidated damages rate per remaining contract therm (USD per therm, 4 decimals).
  etf_minimum_usd: Minimum early termination fee (USD, 2 decimals).
  etf_remaining_volume_basis: How remaining therms are estimated (string enum contract_annual_therms_prorated_by_remaining_months).
  etf_free_window_days: Calendar days immediately before contract end during which a cancellation carries no fee (integer days).
  etf_waive_on_site_closure: Whether the fee is waived when the business closes the site (boolean).
  withdrawal_allowed_before_confirmation: Whether a pending enrollment may be withdrawn before the utility confirms it (boolean).
  enrollment_channels: Channels through which the plan may be enrolled (list of phone | web | broker).
  min_annual_therms: Smallest 12-month historical gas usage a site must have (integer therms).
  max_annual_therms: Largest 12-month historical gas usage a site may have for this standard product (integer therms).
  renewal_loyalty_credit_usd: One-time credit when the business accepts a renewal offer (USD, 2 decimals).
  renewal_notice_earliest_days: Earliest point, in calendar days before contract end, for the initial renewal notice (integer days).
  renewal_notice_latest_days: Latest point, in calendar days before contract end, for the initial renewal notice (integer days).
  final_options_notice_latest_days: Latest point, in calendar days before contract end, for the final options notice (integer days).
  post_expiry_renewal_grace_days: Calendar days after rollover during which a renewal acceptance is still honoured (integer days).
  rollover_variant: Plan an expiring agreement converts to (official plan name).
  rollover_adder_usd_therm: Adder over the monthly index that becomes the contract rate of a rolled-over agreement (USD per therm, 4 decimals).
  late_notice_rate_hold_cycles: Billing cycles after rollover during which the expiring fixed price is held when notices were late (integer cycles).
  billing_dispute_lookback_months: Calendar months after posting during which a line may be corrected (integer months).
  agent_adjustment_limit_usd: Largest rebill credit a care agent may post on one line; larger corrections go to billing review (USD, 2 decimals).
  charge_rounding: Rounding applied to every computed charge (string enum half_up_to_cent).
  eligible_premise_class: Premise class served (string enum commercial).
  eligible_states: States in which the plan is offered (list of state codes).
  sales_tax_rate_pct_by_state: State sales tax rate collected on commercial gas supply charges (mapping state code -> percent, 3 decimals).
  tax_exemption_effective_basis: From which cycle a sales tax exemption applies (string enum cycles_beginning_on_or_after_tax_exemption_date).
  tax_exemption_refund_allowed: Whether tax billed before the exemption is refunded by Beacon Ridge (boolean).
  drop_effective_basis: When a drop takes effect (string enum next_scheduled_meter_read).

