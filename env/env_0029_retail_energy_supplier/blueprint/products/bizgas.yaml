events:
  - type: bizgas_enroll
    target: bizgas_agreements
    mutation: create
    meaning: An authorized representative enrolls one commercial site's natural gas supply with Beacon Ridge.
    grain: One row per enrollment authorization for one site.
    fields:
      customer_id: The business customer.
      premise_id: The site being enrolled.
      variant_name: The official name of the plan enrolled.
      enrollment_date: Date the enrollment was authorized.
      enrollment_channel: Channel through which the enrollment was completed.
      term_months: Term copied from the plan.
      contract_rate_usd_therm: The offer_rate of the price offer valid on the enrollment date for this plan and the site's gas utility.
      contract_annual_therms: Contracted annual volume, equal to the site's annual_therm_usage on the enrollment date.
    triggers: []
  - type: bizgas_utility_confirm
    target: bizgas_agreements
    mutation: update
    meaning: The gas utility accepts the enrollment and issues its confirmation letter.
    grain: One row per transaction.
    fields:
      utility_confirmation_date: Date printed on the confirmation letter.
    triggers: []
  - type: bizgas_activate
    target: bizgas_agreements
    mutation: {transition: {from: enrollment_pending, to: active}}
    meaning: Gas supply to the site begins on the switch meter read date.
    grain: One row per transaction.
    fields:
      service_start_date: The switch meter read date.
      contract_end_date: Last day of the term; empty for month-to-month.
    triggers: []
  - type: bizgas_reject
    target: bizgas_agreements
    mutation: {transition: {from: enrollment_pending, to: rejected}}
    meaning: The gas utility rejects the enrollment.
    grain: One row per transaction.
    fields:
      reject_reason: The utility's rejection reason.
    triggers: []
  - type: bizgas_withdraw
    target: bizgas_agreements
    mutation: {transition: {from: enrollment_pending, to: withdrawn}}
    meaning: The business withdraws a pending enrollment before the utility confirms it.
    grain: One row per transaction.
    fields:
      withdrawn_date: Date the business withdrew.
    triggers: []
  - type: bizgas_cancel
    target: bizgas_agreements
    mutation: {transition: {from: active, to: drop_pending}}
    meaning: The business confirms cancellation and a drop is scheduled.
    grain: One row per transaction.
    fields:
      drop_requested_date: Date the business confirmed the cancellation.
      drop_reason: Why the business is cancelling.
      drop_effective_date: The site's next scheduled meter read date on the request date.
    triggers: []
  - type: bizgas_drop_complete
    target: bizgas_agreements
    mutation: {transition: {from: drop_pending, to: closed}}
    meaning: The gas utility completes the scheduled drop.
    grain: One row per transaction.
    fields:
      close_date: Meter read date on which supply ended.
      close_reason: Why supply ended.
    triggers: []
  - type: bizgas_switch_away
    target: bizgas_agreements
    mutation: {transition: {from: active, to: closed}}
    meaning: The gas utility ends Beacon Ridge supply because another supplier enrolled the site or it was final-billed.
    grain: One row per transaction.
    fields:
      close_date: Meter read date on which supply ended.
      close_reason: Why supply ended.
    triggers: []
  - type: bizgas_renew
    target: bizgas_agreements
    mutation: update
    meaning: The business accepts the renewal offer and the agreement continues into a new term.
    grain: One row per transaction.
    fields:
      variant_name: The plan renewed into, as offered.
      term_months: Term of the renewed plan.
      contract_rate_usd_therm: The renewal price offered.
      contract_annual_therms: Contracted annual volume for the new term, equal to the site's annual_therm_usage on the renewal date.
      contract_end_date: Last day of the new term.
      plan_change_date: Date the new term starts.
    triggers:
      - event: bizgas:bizgas_credit
        when: {variant_name: [Beacon Ridge Commercial Gas Fixed Basis 12, Beacon Ridge Commercial Gas Fixed 12, Beacon Ridge Commercial Gas Fixed 24, Beacon Ridge Commercial Gas Fixed 36, Beacon Ridge Commercial Gas Carbon Neutral 24]}
        map: {line_type: renewal_loyalty_credit, bizgas_agreement_id: bizgas_agreement_id}
  - type: bizgas_rollover
    target: bizgas_agreements
    mutation: update
    meaning: An expiring term without a renewal converts to the monthly index plan.
    grain: One row per transaction.
    fields:
      variant_name: The rollover plan's official name.
      term_months: Set to 0.
      contract_rate_usd_therm: The rollover adder, or the held expiring fixed price during a late-notice hold.
      contract_end_date: Cleared to empty.
      plan_change_date: The day after the expired contract_end_date.
    triggers: []
  - type: bizgas_tax_exemption
    target: bizgas_agreements
    mutation: update
    meaning: Beacon Ridge tax operations validates the business's sales tax exemption certificate for the site.
    grain: One row per transaction.
    fields:
      sales_tax_exempt: Set to true.
      tax_exemption_date: Date the validated certificate was received.
    triggers: []
  - type: bizgas_supply_charge
    target: bizgas_billing
    meaning: Beacon Ridge bills one cycle's gas at the plan price, swing usage, the service fee or sales tax for one site.
    grain: One row per charge line per billing cycle.
    distinguish_by: [line_type, billing_period_start]
    fields:
      bizgas_agreement_id: The agreement billed.
      line_type: energy_charge, swing_excess_charge, swing_shortfall_charge, monthly_service_fee or sales_tax.
      billing_period_start: First day of the billing cycle.
      billing_period_end: Last day of the billing cycle.
      usage_therms: Therms billed on the line; for a shortfall line, the shortfall therms; 0 on fee and tax lines.
      rate_usd_therm: Price per therm applied; 0.0000 on fee and tax lines.
      tax_rate_pct: Sales tax rate on a sales_tax line; 0.000 otherwise.
      taxable_amount_usd: Taxed base on a sales_tax line; 0.00 otherwise.
      amount_usd: Positive charge amount.
      posted_date: Date posted.
    account: bizgas_supply_billed
    direction: in
    triggers: []
  - type: bizgas_etf_charge
    target: bizgas_billing
    meaning: Beacon Ridge bills liquidated damages when a commercial gas term ends early.
    grain: One row per early termination.
    distinguish_by: [line_type, posted_date]
    fields:
      bizgas_agreement_id: The agreement terminated.
      line_type: early_termination_fee.
      etf_remaining_therms: Remaining contract therms used in the fee.
      amount_usd: Positive fee amount.
      posted_date: Date posted.
    account: bizgas_supply_billed
    direction: in
    triggers: []
  - type: bizgas_credit
    target: bizgas_billing
    meaning: Beacon Ridge posts a renewal loyalty credit.
    grain: One row per credit per billing cycle.
    distinguish_by: [line_type, billing_period_start]
    fields:
      bizgas_agreement_id: The agreement credited.
      line_type: renewal_loyalty_credit.
      billing_period_start: Billing cycle on whose bill the credit appears.
      amount_usd: Negative credit amount.
      posted_date: Date posted.
    account: bizgas_supply_billed
    direction: out
    triggers: []
  - type: bizgas_adjustment
    target: bizgas_billing
    meaning: Beacon Ridge corrects an over-billed commercial gas line with a rebill credit.
    grain: One row per corrected original line.
    distinguish_by: [source_billing_id, posted_date]
    fields:
      bizgas_agreement_id: The agreement corrected.
      line_type: rebill_credit.
      source_billing_id: The line being corrected.
      billing_period_start: Billing cycle of the corrected line.
      amount_usd: Negative credit equal to the over-billed amount.
      posted_date: Date posted.
    account: bizgas_supply_billed
    direction: out
    triggers: []
  - type: bizgas_renewal_notice
    target: bizgas_notices
    meaning: Beacon Ridge issues a commercial gas expiration notice with a renewal offer and rollover terms.
    grain: One row per notice type per issue date.
    distinguish_by: [notice_type, notice_date]
    fields:
      bizgas_agreement_id: The expiring agreement.
      notice_type: initial_renewal_notice or final_options_notice.
      notice_date: Date issued.
      effective_date: The contract_end_date referred to.
      offered_variant_name: The plan offered.
      new_rate_usd_therm: The renewal price offered.
      delivery_channel: How the notice was delivered.
    triggers: []
  - type: bizgas_price_notice
    target: bizgas_notices
    meaning: Beacon Ridge publishes the month's index and NYMEX settlement prices for the agreement, or notifies a regulatory pass-through.
    grain: One row per notice type per effective month.
    distinguish_by: [notice_type, effective_date]
    fields:
      bizgas_agreement_id: The agreement priced.
      notice_type: monthly_index_price or regulatory_pass_through.
      notice_date: Date issued.
      effective_date: First day of the delivery month priced, or the stated effective date of a pass-through.
      index_price_usd_therm: The month's delivered index price for the site's utility; 0.0000 on a pass-through.
      nymex_settle_usd_therm: The month's NYMEX settlement price converted to therms; 0.0000 on a pass-through.
      new_rate_usd_therm: For a pass-through, the new contract price; 0.0000 otherwise.
      delivery_channel: How the notice was delivered.
    triggers: []

measures:
  - id: bizgas_msr_portfolio_usage
    window: The billing cycles whose billing_period_start falls in the same calendar month, across the business's agreements on plans with portfolio_bandwidth true that were active on that billing_period_start.
    measure: Two sums over those agreements for those cycles, the total usage_therms on their energy_charge and swing_excess_charge lines, and the total of their monthly contract volumes; the portfolio is inside the bandwidth when the first sum lies within each included plan's band applied to the second sum.

policies:
  - id: bizgas_agg_multi_holding
    subject: [bizgas_enroll]
    rule: >-
      A business may enroll any number of its commercial sites for gas supply; there is no limit per customer.
      No other bizgas agreement on the same site may be in enrollment_pending, active or drop_pending status when a new gas enrollment is submitted.
    eligibility:
      - id: one_live_bizgas_per_site
        applies_to: [bizgas_enroll]
        kind: dedup
        condition: No other bizgas agreement on the same site may be in enrollment_pending, active or drop_pending status when a new gas enrollment is submitted.
        evidence_fields: [bizgas_agreements.premise_id, bizgas_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_agreements.premise_id]
          action_bindings:
            bizgas_agreements.premise_id: premise_id
        dedup_contract:
          table: bizgas_agreements
          mode: separate_record
          object_bindings: {premise_id: premise_id}
          duplicate_filters: {status: [enrollment_pending, active, drop_pending]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: bizgas_agg_portfolio_bandwidth
    subject: [bizgas_supply_charge]
    rule: >-
      On plans whose portfolio_bandwidth is true, swing is measured on the business's whole portfolio rather than per site.
      For a calendar month, the combined usage and combined monthly contract volume of all of the business's agreements on such plans (bizgas_msr_portfolio_usage) are compared with the bandwidth of each plan's swing_tolerance_pct; when the combined usage falls inside every included plan's bandwidth, no site is billed swing that month even if one site alone would be outside.
      When the combined usage is outside, each included site is billed swing on its own usage against its own band.
      Sites on plans whose portfolio_bandwidth is false are always measured alone and do not enter the portfolio.
    eligibility: []
    measures: [bizgas_msr_portfolio_usage]

  - id: bizgas_enrollment_eligibility
    subject: [bizgas_enroll]
    rule: >-
      A commercial gas enrollment is accepted only for a business customer and a site whose premise_class is commercial, whose gas_utility is not none, whose service_state is listed in eligible_states and whose annual_therm_usage is at least min_annual_therms and no more than max_annual_therms.
      The gas site must be commercial.
      The enrollment channel must be one of the plan's enrollment_channels.
      contract_rate_usd_therm is the offer_rate of the price offer for the plan and the site's gas utility valid on the enrollment date; it is the all-in fixed price on a fixed plan, the locked basis plus adder on a fixed basis plan, and the adder on an index plan.
      contract_annual_therms is the site's annual_therm_usage on the enrollment date.
      Sites above max_annual_therms are outside the standard commercial gas product.
    eligibility:
      - id: commercial_gas_site
        applies_to: [bizgas_enroll]
        kind: state
        condition: The gas site must be commercial.
        evidence_fields: [premises.premise_class, premises.premise_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [premises.premise_id]
          action_bindings:
            premises.premise_id: premise_id
        state_contract:
          field: premises.premise_class
          allowed: [commercial]

  - id: bizgas_enrollment_processing
    subject: [bizgas_utility_confirm, bizgas_activate, bizgas_reject]
    rule: >-
      After submission the gas utility either accepts the enrollment, recording utility_confirmation_date, or rejects it with one of the utility rejection reasons.
      Supply begins on the switch meter read date, which becomes service_start_date.
      For a plan with term_months above 0, contract_end_date is the day before the same calendar day term_months calendar months after service_start_date; when that calendar day does not exist in the target month, the last day of that month is used before subtracting the day.
      A rejected enrollment ends permanently.
    eligibility: []

  - id: bizgas_withdrawal
    subject: [bizgas_withdraw]
    rule: >-
      Commercial gas enrollments carry no statutory rescission period.
      A business may withdraw a pending enrollment only while the gas utility has not yet confirmed it, that is while utility_confirmation_date is empty, and only when withdrawal_allowed_before_confirmation is true.
      Once the utility has confirmed the enrollment, the business can end the agreement only by cancelling after supply starts, and the early termination fee rules apply.
    eligibility:
      - id: before_confirmation
        applies_to: [bizgas_withdraw]
        kind: authorization
        condition: A business may withdraw a pending enrollment only while the gas utility has not yet confirmed it, that is while utility_confirmation_date is empty, and only when withdrawal_allowed_before_confirmation is true.
        evidence_fields: [bizgas_agreements.utility_confirmation_date, bizgas_agreements.bizgas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_agreements.bizgas_agreement_id]
          action_bindings:
            bizgas_agreements.bizgas_agreement_id: bizgas_agreement_id

  - id: bizgas_supply_billing
    subject: [bizgas_supply_charge]
    rule: >-
      Each billing cycle in which Beacon Ridge supplied the site produces one energy_charge line, any swing lines, one monthly_service_fee line unless waived, and one sales_tax line when tax applies.
      Commercial gas charges are billed only while the agreement is active, drop_pending or closed.
      The energy price per therm is contract_rate_usd_therm on a fixed plan, the month's nymex_settle_usd_therm plus contract_rate_usd_therm on a fixed basis plan, and the month's index_price_usd_therm plus contract_rate_usd_therm on an index plan, using the monthly_index_price notice for the month of billing_period_start; amounts are usage times price rounded per charge_rounding.
      Holding an active Beacon Ridge business electricity agreement or commercial and industrial contract on the same site changes the gas fee: when dual_commodity_fee_waiver is true and such an agreement was active on the cycle's billing_period_start, no monthly_service_fee line is billed.
      The sales_tax line taxes the cycle's energy, swing and fee lines at the sales_tax_rate_pct_by_state value for the site's service_state and is not billed when that rate is 0.000 or for cycles beginning on or after tax_exemption_date when sales_tax_exempt is true; tax billed before an exemption is not refunded.
      There is no annual volume true-up when annual_volume_true_up is false.
    eligibility:
      - id: bizgas_supplied_status
        applies_to: [bizgas_supply_charge]
        kind: state
        condition: Commercial gas charges are billed only while the agreement is active, drop_pending or closed.
        evidence_fields: [bizgas_agreements.status, bizgas_agreements.bizgas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_agreements.bizgas_agreement_id]
          action_bindings:
            bizgas_agreements.bizgas_agreement_id: bizgas_agreement_id
        state_contract:
          field: bizgas_agreements.status
          allowed: [active, drop_pending, closed]
    formula:
      when: line_type == "sales_tax"
      amount_usd: round(taxable_amount_usd * tax_rate_pct / 100, 2)

  - id: bizgas_swing
    subject: [bizgas_supply_charge]
    rule: >-
      On a plan whose swing_applies is true, the monthly contract volume is contract_annual_therms divided by months_per_year and rounded half up to a whole therm, per monthly_volume_basis.
      The band runs from the monthly volume times (100 minus swing_tolerance_pct) percent to the monthly volume times (100 plus swing_tolerance_pct) percent, each rounded half up to a whole therm, both ends inclusive.
      Usage inside the band is billed entirely on the energy_charge line at the fixed price.
      Therms above the upper end are billed on a swing_excess_charge line at the month's index_price_usd_therm plus swing_excess_adder_usd_therm, and the energy line bills only the upper-end therms.
      When usage is below the lower end, all usage is billed on the energy line and the shortfall therms are billed on a swing_shortfall_charge line at swing_shortfall_charge_usd_therm.
      On plans whose swing_applies is false, all usage is billed on the energy line.
    eligibility: []
    params:
      months_per_year: 12
      per_tier:
        Beacon Ridge Commercial Gas Monthly Index: {swing_applies: "=swing_applies", swing_tolerance_pct: "=swing_tolerance_pct", swing_excess_adder_usd_therm: "=swing_excess_adder_usd_therm", swing_shortfall_charge_usd_therm: "=swing_shortfall_charge_usd_therm", portfolio_bandwidth: "=portfolio_bandwidth"}
        Beacon Ridge Commercial Gas Fixed Basis 12: {swing_applies: "=swing_applies", swing_tolerance_pct: "=swing_tolerance_pct", swing_excess_adder_usd_therm: "=swing_excess_adder_usd_therm", swing_shortfall_charge_usd_therm: "=swing_shortfall_charge_usd_therm", portfolio_bandwidth: "=portfolio_bandwidth"}
        Beacon Ridge Commercial Gas Fixed 12: {swing_applies: "=swing_applies", swing_tolerance_pct: "=swing_tolerance_pct", swing_excess_adder_usd_therm: "=swing_excess_adder_usd_therm", swing_shortfall_charge_usd_therm: "=swing_shortfall_charge_usd_therm", portfolio_bandwidth: "=portfolio_bandwidth"}
        Beacon Ridge Commercial Gas Fixed 24: {swing_applies: "=swing_applies", swing_tolerance_pct: "=swing_tolerance_pct", swing_excess_adder_usd_therm: "=swing_excess_adder_usd_therm", swing_shortfall_charge_usd_therm: "=swing_shortfall_charge_usd_therm", portfolio_bandwidth: "=portfolio_bandwidth"}
        Beacon Ridge Commercial Gas Fixed 36: {swing_applies: "=swing_applies", swing_tolerance_pct: "=swing_tolerance_pct", swing_excess_adder_usd_therm: "=swing_excess_adder_usd_therm", swing_shortfall_charge_usd_therm: "=swing_shortfall_charge_usd_therm", portfolio_bandwidth: "=portfolio_bandwidth"}
        Beacon Ridge Commercial Gas Carbon Neutral 24: {swing_applies: "=swing_applies", swing_tolerance_pct: "=swing_tolerance_pct", swing_excess_adder_usd_therm: "=swing_excess_adder_usd_therm", swing_shortfall_charge_usd_therm: "=swing_shortfall_charge_usd_therm", portfolio_bandwidth: "=portfolio_bandwidth"}

  - id: bizgas_index_pricing
    subject: [bizgas_price_notice, bizgas_supply_charge]
    rule: >-
      Each delivery month's index_price_usd_therm and nymex_settle_usd_therm are published on a monthly_index_price notice whose effective_date is the first day of that month.
      A billing cycle is priced with the notice for the calendar month containing its billing_period_start, as price_publication_basis states, regardless of how many days of the cycle fall in the next month.
      On a fixed basis plan only the NYMEX component floats; the basis and adder recorded in contract_rate_usd_therm stay fixed for the term.
      On a fixed plan the index notice is used only to price swing excess therms.
    eligibility: []

  - id: bizgas_regulatory_passthrough
    subject: [bizgas_price_notice]
    rule: >-
      A fixed or fixed basis price may change during the term only to pass through a change in law or regulation, and only on a plan whose regulatory_passthrough_allowed is true.
      A regulatory_pass_through notice must be issued at least regulatory_change_notice_days calendar days before its effective date, and the new price applies to cycles beginning on or after the later of the stated effective date and notice_date plus regulatory_change_notice_days.
      On a plan whose regulatory_passthrough_allowed is false any pass-through billed is a billing error.
    eligibility: []

  - id: bizgas_expiry_notices
    subject: [bizgas_renewal_notice]
    rule: >-
      Every commercial gas agreement with a term receives two expiration notices.
      Commercial gas renewal notices are issued only on an active agreement with a term.
      The initial_renewal_notice is compliant when its notice_date falls no earlier than renewal_notice_earliest_days and no later than renewal_notice_latest_days calendar days before contract_end_date.
      The final_options_notice is compliant when its notice_date falls no later than final_options_notice_latest_days calendar days before contract_end_date and after the initial notice.
      Each notice states the plan and price offered for renewal and that the agreement otherwise rolls to the monthly index plan; when the two notices differ, the final_options_notice governs.
    eligibility:
      - id: bizgas_active_term
        applies_to: [bizgas_renewal_notice]
        kind: state
        condition: Commercial gas renewal notices are issued only on an active agreement with a term.
        evidence_fields: [bizgas_agreements.status, bizgas_agreements.bizgas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_agreements.bizgas_agreement_id]
          action_bindings:
            bizgas_agreements.bizgas_agreement_id: bizgas_agreement_id
        state_contract:
          field: bizgas_agreements.status
          allowed: [active]

  - id: bizgas_rollover_terms
    subject: [bizgas_rollover]
    rule: >-
      When a commercial gas term reaches contract_end_date without a renewal acceptance and without a pending cancellation, the agreement converts on the following day to the plan named by rollover_variant with term_months 0, an empty contract_end_date, plan_change_date set to the day after the expired contract_end_date, and contract_rate_usd_therm set to rollover_adder_usd_therm.
      When either expiration notice was missing or not compliant, the expiring price is held for late_notice_rate_hold_cycles billing cycles first, recorded as contract_rate_usd_therm and billed as a fixed price, after which contract_rate_usd_therm becomes rollover_adder_usd_therm.
      A rolled-over agreement carries no early termination fee.
    eligibility: []

  - id: bizgas_renewal
    subject: [bizgas_renew, bizgas_credit]
    rule: >-
      A business renews by accepting the offer in the governing commercial gas renewal notice: the agreement takes the offered plan, its term_months and the offered price, and contract_annual_therms is reset to the site's annual_therm_usage on the acceptance date.
      A commercial gas renewal is accepted only on an active agreement.
      When the acceptance is made on or before contract_end_date the new term starts the day after contract_end_date; after a rollover it starts on the acceptance date.
      When the commercial gas agreement has already rolled over, a renewal acceptance is honoured only when the business accepts no later than post_expiry_renewal_grace_days calendar days after the rollover took effect on plan_change_date.
      Day one is the calendar day after plan_change_date, and the grace period closes at the end of the calendar day equal to plan_change_date plus post_expiry_renewal_grace_days.
      Each renewal earns one renewal_loyalty_credit equal to the renewal_loyalty_credit_usd of the plan renewed into.
    eligibility:
      - id: bizgas_renewal_active
        applies_to: [bizgas_renew]
        kind: state
        condition: A commercial gas renewal is accepted only on an active agreement.
        evidence_fields: [bizgas_agreements.status, bizgas_agreements.bizgas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_agreements.bizgas_agreement_id]
          action_bindings:
            bizgas_agreements.bizgas_agreement_id: bizgas_agreement_id
        state_contract:
          field: bizgas_agreements.status
          allowed: [active]
      - id: bizgas_post_expiry_grace
        applies_to: [bizgas_renew]
        kind: time
        condition: When the commercial gas agreement has already rolled over, a renewal acceptance is honoured only when the business accepts no later than post_expiry_renewal_grace_days calendar days after the rollover took effect on plan_change_date.
        evidence_fields: [bizgas_agreements.plan_change_date, bizgas_agreements.bizgas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_agreements.bizgas_agreement_id]
          action_bindings:
            bizgas_agreements.bizgas_agreement_id: bizgas_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the rollover took effect on plan_change_date
          anchor_source: bizgas_agreements.plan_change_date
          relation: not_after
          duration_source: variants.post_expiry_renewal_grace_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after plan_change_date, and the grace period closes at the end of the calendar day equal to plan_change_date plus post_expiry_renewal_grace_days.
          boundary: inclusive

  - id: bizgas_tax_exemption_terms
    subject: [bizgas_tax_exemption]
    rule: >-
      A commercial gas sales tax exemption is recorded only after Beacon Ridge tax operations has received and validated the business's exemption certificate for the site; a representative's statement does not change billing.
      tax_exemption_date is the date the validated certificate was received, and the exemption applies per tax_exemption_effective_basis without any refund of earlier tax.
    eligibility: []

  - id: bizgas_cancellation
    subject: [bizgas_cancel, bizgas_drop_complete, bizgas_switch_away]
    rule: >-
      The business cancels an active agreement by confirming the cancellation; the drop takes effect on the site's next scheduled meter read date, recorded as drop_effective_date.
      A confirmed commercial gas cancellation cannot be withdrawn; a business that changes its mind re-enrolls the site after the drop at the then-valid price offer.
      When the utility completes the drop the agreement closes with close_reason cancelled_by_customer; when another supplier enrolls the site it closes with close_reason switched_to_other_supplier; when the site is final-billed it closes with close_reason final_billed.
    eligibility: []

  - id: bizgas_etf
    subject: [bizgas_etf_charge]
    rule: >-
      A commercial gas early termination fee is assessed only once the agreement is drop_pending or closed.
      Only one early termination fee may be billed per commercial gas agreement.
      The termination date is drop_requested_date for a cancellation and close_date for a switch-away or final bill.
      The remaining months are twelve times the difference in years plus the difference in months between the termination date and contract_end_date, plus one when the day of month of contract_end_date is later than the day of month of the termination date.
      etf_remaining_therms is contract_annual_therms times the remaining months divided by months_per_year, rounded half up to a whole therm, and the fee is etf_remaining_therms times etf_rate_usd_per_therm rounded per charge_rounding, but not less than etf_minimum_usd; under the none method no fee applies.
      No fee applies when the termination date falls within etf_free_window_days calendar days before contract_end_date, equality counting as inside.
      Closing the site, selling the business and switching to another supplier do not waive the fee when etf_waive_on_site_closure is false.
    eligibility:
      - id: bizgas_terminated_status
        applies_to: [bizgas_etf_charge]
        kind: state
        condition: A commercial gas early termination fee is assessed only once the agreement is drop_pending or closed.
        evidence_fields: [bizgas_agreements.status, bizgas_agreements.bizgas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_agreements.bizgas_agreement_id]
          action_bindings:
            bizgas_agreements.bizgas_agreement_id: bizgas_agreement_id
        state_contract:
          field: bizgas_agreements.status
          allowed: [drop_pending, closed]
      - id: bizgas_single_etf
        applies_to: [bizgas_etf_charge]
        kind: dedup
        condition: Only one early termination fee may be billed per commercial gas agreement.
        evidence_fields: [bizgas_billing.bizgas_agreement_id, bizgas_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_billing.bizgas_agreement_id]
          action_bindings:
            bizgas_billing.bizgas_agreement_id: bizgas_agreement_id
        dedup_contract:
          table: bizgas_billing
          mode: separate_record
          object_bindings: {bizgas_agreement_id: bizgas_agreement_id}
          duplicate_filters: {line_type: [early_termination_fee]}
          distinct_fields: []
    params:
      months_per_year: 12
    formula:
      when_not: etf_method == "none"
      amount_usd: max(etf_minimum_usd, round(etf_remaining_therms * etf_rate_usd_per_therm, 2))

  - id: bizgas_billing_correction
    subject: [bizgas_adjustment]
    rule: >-
      When a commercial gas line was billed at more than the policy allows, the over-billed amount is returned as one rebill_credit tied to that line through source_billing_id, equal to the billed amount_usd minus the correctly computed amount and posted as a negative amount; a corrected energy, swing or fee line also corrects the cycle's sales_tax line with its own rebill credit.
      A commercial gas line may be corrected only when the business disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
      The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
      Each billed commercial gas line may be corrected only once.
      A care agent may post a rebill credit up to agent_adjustment_limit_usd per line; a larger correction is opened as a commercial gas billing dispute for review instead of being posted.
      Under-billing caused by a Beacon Ridge error is not back-billed.
    eligibility:
      - id: bizgas_dispute_lookback
        applies_to: [bizgas_adjustment]
        kind: time
        condition: A commercial gas line may be corrected only when the business disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
        evidence_fields: [bizgas_billing.posted_date, bizgas_billing.bizgas_billing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_billing.bizgas_billing_id]
          action_bindings:
            bizgas_billing.bizgas_billing_id: source_billing_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the line was posted
          anchor_source: bizgas_billing.posted_date
          relation: not_after
          duration_source: variants.billing_dispute_lookback_months
          unit: calendar_months
          counting_rule: The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
          boundary: inclusive
      - id: bizgas_one_correction_per_line
        applies_to: [bizgas_adjustment]
        kind: dedup
        condition: Each billed commercial gas line may be corrected only once.
        evidence_fields: [bizgas_billing.source_billing_id, bizgas_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_billing.source_billing_id]
          action_bindings:
            bizgas_billing.source_billing_id: source_billing_id
        dedup_contract:
          table: bizgas_billing
          mode: separate_record
          object_bindings: {source_billing_id: source_billing_id}
          duplicate_filters: {line_type: [rebill_credit]}
          distinct_fields: []
