events:
  - type: cni_contract_execute
    target: cni_contracts
    mutation: create
    meaning: The customer's authorized signatory signs a priced C&I quote, creating a contract for one facility.
    grain: One row per executed contract.
    fields:
      customer_id: The business customer.
      premise_id: The facility covered.
      variant_name: The contract structure signed, as the official name.
      pricing_request_id: The priced quote that was signed.
      contract_signed_date: Date the signatory signed.
      term_months: Term priced in the quote.
      contract_rate_cents_kwh: Quoted fixed price, or quoted adder on an index structure.
      block_kwh_per_cycle: Quoted block size on a block and index contract; 0 otherwise.
    triggers: []
  - type: cni_utility_confirm
    target: cni_contracts
    mutation: update
    meaning: The utility accepts the enrollment of the facility.
    grain: One row per transaction.
    fields:
      utility_confirmation_date: Date of the utility's confirmation.
    triggers: []
  - type: cni_activate
    target: cni_contracts
    mutation: {transition: {from: pending_enrollment, to: active}}
    meaning: Supply begins on the switch meter read date and the term starts.
    grain: One row per transaction.
    fields:
      service_start_date: The switch meter read date.
      term_start_date: Equal to service_start_date for the first term.
      contract_end_date: Last day of the term.
    triggers: []
  - type: cni_reject
    target: cni_contracts
    mutation: {transition: {from: pending_enrollment, to: rejected}}
    meaning: The utility rejects the enrollment.
    grain: One row per transaction.
    fields:
      reject_reason: The utility's rejection reason.
    triggers: []
  - type: cni_preflow_terminate
    target: cni_contracts
    mutation: {transition: {from: pending_enrollment, to: closed}}
    meaning: The customer terminates an executed contract before supply starts.
    grain: One row per transaction.
    fields:
      termination_notice_date: Date the written termination notice was received.
      close_date: Date the contract was closed.
      close_reason: Set to terminated_before_flow.
    triggers: []
  - type: cni_terminate
    target: cni_contracts
    mutation: {transition: {from: active, to: termination_pending}}
    meaning: The customer's signatory gives written notice of early termination during the term.
    grain: One row per transaction.
    fields:
      termination_notice_date: Date the written notice was received.
      termination_effective_date: First scheduled meter read date on or after the notice date plus termination_notice_days.
    triggers: []
  - type: cni_holdover_terminate
    target: cni_contracts
    mutation: {transition: {from: holdover, to: termination_pending}}
    meaning: The customer gives notice to end holdover service.
    grain: One row per transaction.
    fields:
      termination_notice_date: Date the written notice was received.
      termination_effective_date: First scheduled meter read date on or after the notice date plus holdover_termination_notice_days.
    triggers: []
  - type: cni_drop_complete
    target: cni_contracts
    mutation: {transition: {from: termination_pending, to: closed}}
    meaning: The utility completes the drop on the termination effective date.
    grain: One row per transaction.
    fields:
      close_date: Meter read date on which supply ended.
      close_reason: early_termination or holdover_ended.
    triggers: []
  - type: cni_switch_away
    target: cni_contracts
    mutation: {transition: [{from: active, to: closed}, {from: holdover, to: closed}]}
    meaning: The utility ends supply because another supplier enrolled the facility or it was final-billed.
    grain: One row per transaction.
    fields:
      close_date: Meter read date on which supply ended.
      close_reason: switched_to_other_supplier or final_billed.
    triggers: []
  - type: cni_expire_holdover
    target: cni_contracts
    mutation: {transition: {from: active, to: holdover}}
    meaning: The term expires without a signed renewal and the facility moves to holdover pricing.
    grain: One row per transaction.
    fields:
      holdover_start_date: The day after contract_end_date.
    triggers: []
  - type: cni_renew
    target: cni_contracts
    mutation: update
    meaning: The customer signs a renewal quote before the current term expires; the new term starts the day after contract_end_date.
    grain: One row per transaction.
    fields:
      variant_name: The structure signed for the new term.
      pricing_request_id: The renewal quote signed.
      renewal_signed_date: Date the renewal was signed.
      term_months: Term of the new contract.
      contract_rate_cents_kwh: Quoted price or adder for the new term.
      block_kwh_per_cycle: Quoted block size; 0 when not block and index.
      term_start_date: The day after the expiring contract_end_date.
      contract_end_date: Last day of the new term.
    triggers: []
  - type: cni_holdover_renew
    target: cni_contracts
    mutation: {transition: {from: holdover, to: active}}
    meaning: The customer signs a renewal quote while on holdover and a new term starts.
    grain: One row per transaction.
    fields:
      variant_name: The structure signed.
      pricing_request_id: The renewal quote signed.
      renewal_signed_date: Date the renewal was signed.
      term_months: Term of the new contract.
      contract_rate_cents_kwh: Quoted price or adder.
      block_kwh_per_cycle: Quoted block size; 0 when not block and index.
      term_start_date: The facility's next scheduled meter read date after signing.
      contract_end_date: Last day of the new term.
    triggers: []
  - type: cni_supply_charge
    target: cni_billing
    meaning: Beacon Ridge bills one cycle's energy, index energy, block energy, capacity or transmission charge for the facility.
    grain: One row per charge component per billing cycle.
    distinguish_by: [line_type, billing_period_start]
    fields:
      cni_contract_id: The contract billed.
      line_type: energy_charge, block_energy_charge, index_energy_charge, capacity_charge or transmission_charge.
      billing_period_start: First day of the billing cycle.
      billing_period_end: Last day of the billing cycle.
      billing_days: Days in the cycle, counting both ends.
      usage_kwh: kWh billed on an energy line; 0 on pass-through lines.
      rate_cents_kwh: Price per kWh on an energy line; 0.00 on pass-through lines.
      tag_kw: Capacity tag or transmission tag used on a pass-through line; 0.0 otherwise.
      tag_rate_usd_mw_day: Capacity price or transmission rate used on a pass-through line; 0.00 otherwise.
      amount_usd: Positive charge amount.
      posted_date: Date posted.
    account: cni_supply_billed
    direction: in
    triggers: []
  - type: cni_etf_charge
    target: cni_billing
    meaning: Beacon Ridge bills liquidated damages for an early termination.
    grain: One row per early termination.
    distinguish_by: [line_type, posted_date]
    fields:
      cni_contract_id: The contract terminated.
      line_type: early_termination_fee.
      etf_remaining_kwh: Remaining contracted kWh used.
      amount_usd: Positive fee amount.
      posted_date: Date posted.
    account: cni_supply_billed
    direction: in
    triggers: []
  - type: cni_adjustment
    target: cni_billing
    meaning: Beacon Ridge corrects an over-billed C&I line with a rebill credit.
    grain: One row per corrected original line.
    distinguish_by: [source_billing_id, posted_date]
    fields:
      cni_contract_id: The contract corrected.
      line_type: rebill_credit.
      source_billing_id: The line being corrected.
      billing_period_start: Billing cycle of the corrected line.
      amount_usd: Negative credit equal to the over-billed amount.
      posted_date: Date posted.
    account: cni_supply_billed
    direction: out
    triggers: []
  - type: cni_deposit_post
    target: cni_deposits
    meaning: The customer's security deposit for the contract is received and recorded.
    grain: One row per deposit received.
    distinguish_by: [posted_date, amount_usd]
    fields:
      cni_contract_id: The contract secured.
      amount_usd: Positive deposit amount.
      deposit_months: Months of estimated supply cost the deposit represents.
      credit_grade_basis: The customer's commercial credit grade used to size the deposit.
      posted_date: Date received.
    account: cni_deposit_held
    direction: in
    triggers: []
  - type: cni_deposit_refund
    target: cni_deposits
    meaning: Beacon Ridge refunds a held security deposit.
    grain: One row per refunded deposit.
    distinguish_by: [source_deposit_id]
    fields:
      cni_contract_id: The contract whose deposit is refunded.
      source_deposit_id: The deposit being refunded.
      amount_usd: Negative refund amount equal to the deposit held.
      posted_date: Date refunded.
    account: cni_deposit_held
    direction: out
    triggers: []
  - type: cni_market_notice
    target: cni_notices
    meaning: Beacon Ridge publishes the month's index price, the capacity price or transmission rate for the facility's zone, or a regulatory pass-through.
    grain: One row per notice type per effective date.
    distinguish_by: [notice_type, effective_date]
    fields:
      cni_contract_id: The contract the notice applies to.
      notice_type: monthly_index_price, capacity_price, transmission_rate or regulatory_pass_through.
      notice_date: Date issued.
      effective_date: First day of the month priced, or first day the capacity price or transmission rate applies, or the stated pass-through date.
      index_price_cents_kwh: Monthly index price; 0.00 otherwise.
      capacity_price_usd_mw_day: Capacity price; 0.00 otherwise.
      transmission_rate_usd_mw_day: Transmission rate; 0.00 otherwise.
      new_rate_cents_kwh: Pass-through contract price; 0.00 otherwise.
    triggers: []
  - type: cni_expiry_notice
    target: cni_notices
    meaning: Beacon Ridge notifies the customer that the contract term is ending and describes holdover pricing.
    grain: One row per expiry notice.
    distinguish_by: [notice_type, notice_date]
    fields:
      cni_contract_id: The expiring contract.
      notice_type: expiry_notice.
      notice_date: Date issued.
      effective_date: The contract_end_date referred to.
    triggers: []

measures:
  - id: cni_msr_deposits_held
    window: All time up to the frozen handling date.
    measure: Sum of amount_usd of cni_deposit_post rows minus the absolute amounts of cni_deposit_refund rows across all of the customer's C&I contracts.

policies:
  - id: cni_agg_multi_holding
    subject: [cni_contract_execute]
    rule: >-
      A business may hold any number of C&I contracts, one per facility.
      No other C&I contract on the same facility may be in pending_enrollment, active, termination_pending or holdover status when a new contract is executed.
      A facility still on a live Beacon Ridge small business electricity agreement may sign a C&I contract; the small business agreement must then be cancelled with drop_reason cni_upgrade, which is how holding the C&I contract changes the small business termination fee.
    eligibility:
      - id: one_live_contract_per_facility
        applies_to: [cni_contract_execute]
        kind: dedup
        condition: No other C&I contract on the same facility may be in pending_enrollment, active, termination_pending or holdover status when a new contract is executed.
        evidence_fields: [cni_contracts.premise_id, cni_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_contracts.premise_id]
          action_bindings:
            cni_contracts.premise_id: premise_id
        dedup_contract:
          table: cni_contracts
          mode: separate_record
          object_bindings: {premise_id: premise_id}
          duplicate_filters: {status: [pending_enrollment, active, termination_pending, holdover]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: cni_agg_deposit_cap
    subject: [cni_deposit_post]
    rule: >-
      Security deposits are combined across all of the customer's C&I contracts.
      The deposit required for a contract is deposit_months_by_grade for the customer's commercial_credit_grade times the facility's annual_kwh_usage times deposit_reference_rate_cents_kwh divided by cents_months_divisor, rounded per charge_rounding.
      When the customer's deposits already held (cni_msr_deposits_held) plus the new deposit would exceed max_total_deposit_usd, only the amount up to that ceiling is required, and nothing is required once the ceiling is reached.
      A grade with 0 months requires no deposit.
      The grade used is the one on the customer profile when the contract is executed; a later grade change neither raises nor refunds a posted deposit.
    eligibility: []
    params:
      cents_months_divisor: 1200
      per_tier:
        Beacon Ridge C&I Real-Time Index: {deposit_reference_rate_cents_kwh: "=deposit_reference_rate_cents_kwh", max_total_deposit_usd: "=max_total_deposit_usd"}
        Beacon Ridge C&I Block and Index: {deposit_reference_rate_cents_kwh: "=deposit_reference_rate_cents_kwh", max_total_deposit_usd: "=max_total_deposit_usd"}
        Beacon Ridge C&I Fixed Energy with Capacity and Transmission Pass-Through: {deposit_reference_rate_cents_kwh: "=deposit_reference_rate_cents_kwh", max_total_deposit_usd: "=max_total_deposit_usd"}
        Beacon Ridge C&I Fixed Energy with Capacity Pass-Through: {deposit_reference_rate_cents_kwh: "=deposit_reference_rate_cents_kwh", max_total_deposit_usd: "=max_total_deposit_usd"}
        Beacon Ridge C&I Fixed All-In: {deposit_reference_rate_cents_kwh: "=deposit_reference_rate_cents_kwh", max_total_deposit_usd: "=max_total_deposit_usd"}
        Beacon Ridge C&I Fixed All-In Renewable: {deposit_reference_rate_cents_kwh: "=deposit_reference_rate_cents_kwh", max_total_deposit_usd: "=max_total_deposit_usd"}
    measures: [cni_msr_deposits_held]

  - id: cni_pricing_and_execution
    subject: [cni_contract_execute]
    rule: >-
      Every C&I contract is priced individually: the customer first submits a pricing request for a facility, structure and term, and the structuring desk returns a quote with quoted_rate_cents_kwh, any quoted_block_kwh_per_cycle, quote_date and quote_valid_until.
      A contract may be executed only from a pricing request whose pricing_status is priced, for the same facility, structure and term.
      A quote may be signed only when the customer signs it no later than quote_validity_days calendar days after the quote was issued.
      Day one is the calendar day after quote_date, and the quote expires at the end of the calendar day equal to quote_date plus quote_validity_days, which is the quote_valid_until printed on the quote.
      An expired quote must be re-priced through a new pricing request and is never honoured at its old price.
      The facility must be commercial with annual_kwh_usage of at least min_annual_kwh, its state must be in eligible_states, and the term must be one of allowed_terms_months.
      The contract takes the quoted price as contract_rate_cents_kwh and the quoted block as block_kwh_per_cycle.
    eligibility:
      - id: priced_quote
        applies_to: [cni_contract_execute]
        kind: state
        condition: A contract may be executed only from a pricing request whose pricing_status is priced, for the same facility, structure and term.
        evidence_fields: [cni_pricing_requests.pricing_status, cni_pricing_requests.pricing_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_pricing_requests.pricing_request_id]
          action_bindings:
            cni_pricing_requests.pricing_request_id: pricing_request_id
        state_contract:
          field: cni_pricing_requests.pricing_status
          allowed: [priced]
      - id: quote_validity
        applies_to: [cni_contract_execute]
        kind: time
        condition: A quote may be signed only when the customer signs it no later than quote_validity_days calendar days after the quote was issued.
        evidence_fields: [cni_pricing_requests.quote_date, cni_pricing_requests.pricing_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_pricing_requests.pricing_request_id]
          action_bindings:
            cni_pricing_requests.pricing_request_id: pricing_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the quote was issued
          anchor_source: cni_pricing_requests.quote_date
          relation: not_after
          duration_source: variants.quote_validity_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after quote_date, and the quote expires at the end of the calendar day equal to quote_date plus quote_validity_days, which is the quote_valid_until printed on the quote.
          boundary: inclusive

  - id: cni_enrollment_processing
    subject: [cni_utility_confirm, cni_activate, cni_reject]
    rule: >-
      An executed contract is submitted to the utility only after any required security deposit has been posted, when deposit_due_before_enrollment is true.
      The utility then accepts the enrollment, recording utility_confirmation_date, or rejects it.
      Supply begins on the switch meter read date, which becomes service_start_date and term_start_date; contract_end_date is the day before the same calendar day term_months calendar months after term_start_date, using the last day of the month when that day does not exist.
      A rejected contract ends without any termination fee, and its deposit is refunded.
    eligibility: []

  - id: cni_security_deposit
    subject: [cni_deposit_post, cni_deposit_refund]
    rule: >-
      A security deposit is recorded only on a contract that is pending_enrollment or active.
      deposit_months and credit_grade_basis on the deposit record the grade and months used.
      A held deposit is refunded in full, with deposit_interest_rate_pct interest, once the contract is closed or rejected and its final bill has posted, per deposit_refund_trigger; it is not refunded while the contract is active, in termination_pending or in holdover.
      A deposit is refunded only once, and the refund names the deposit through source_deposit_id.
      An unpaid early termination fee is not netted against the deposit by the care desk.
    eligibility:
      - id: deposit_contract_open
        applies_to: [cni_deposit_post]
        kind: state
        condition: A security deposit is recorded only on a contract that is pending_enrollment or active.
        evidence_fields: [cni_contracts.status, cni_contracts.cni_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_contracts.cni_contract_id]
          action_bindings:
            cni_contracts.cni_contract_id: cni_contract_id
        state_contract:
          field: cni_contracts.status
          allowed: [pending_enrollment, active]
      - id: refund_once
        applies_to: [cni_deposit_refund]
        kind: dedup
        condition: A deposit is refunded only once, and the refund names the deposit through source_deposit_id.
        evidence_fields: [cni_deposits.source_deposit_id, cni_deposits.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_deposits.source_deposit_id]
          action_bindings:
            cni_deposits.source_deposit_id: source_deposit_id
        dedup_contract:
          table: cni_deposits
          mode: separate_record
          object_bindings: {source_deposit_id: source_deposit_id}
          duplicate_filters: {event_type: [cni_deposit_refund]}
          distinct_fields: []
      - id: refund_after_close
        applies_to: [cni_deposit_refund]
        kind: state
        condition: A held deposit is refunded in full, with deposit_interest_rate_pct interest, once the contract is closed or rejected and its final bill has posted, per deposit_refund_trigger; it is not refunded while the contract is active, in termination_pending or in holdover.
        evidence_fields: [cni_contracts.status, cni_contracts.cni_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_contracts.cni_contract_id]
          action_bindings:
            cni_contracts.cni_contract_id: cni_contract_id
        state_contract:
          field: cni_contracts.status
          allowed: [closed, rejected]

  - id: cni_energy_billing
    subject: [cni_supply_charge]
    rule: >-
      C&I charges are billed only while the contract is active, termination_pending, holdover or closed.
      On a fixed structure, all of the cycle's kWh are billed on one energy_charge line at contract_rate_cents_kwh.
      On a real-time index structure, all kWh are billed on one index_energy_charge line at the month's index_price_cents_kwh plus contract_rate_cents_kwh.
      On a block and index structure, the first block_kwh_per_cycle kWh are billed on a block_energy_charge line at contract_rate_cents_kwh and any kWh above the block on an index_energy_charge line at the month's index_price_cents_kwh with no adder, because the block price carries the margin; when usage is below the block, the whole block is still billed on the block line.
      During holdover, all kWh are billed on an index_energy_charge line at the month's index price plus holdover_adder_cents_kwh, except that the adder is not charged when late_expiry_notice_holdover_adder_waived is true and the expiry notice was missing or not compliant.
      The month's index price is the monthly_index_price notice for the month of billing_period_start, per index_price_basis.
      Each energy amount is kWh times price divided by 100, rounded per charge_rounding.
    eligibility:
      - id: cni_billable_status
        applies_to: [cni_supply_charge]
        kind: state
        condition: C&I charges are billed only while the contract is active, termination_pending, holdover or closed.
        evidence_fields: [cni_contracts.status, cni_contracts.cni_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_contracts.cni_contract_id]
          action_bindings:
            cni_contracts.cni_contract_id: cni_contract_id
        state_contract:
          field: cni_contracts.status
          allowed: [active, termination_pending, holdover, closed]
    formula:
      when: line_type == "energy_charge"
      amount_usd: round(usage_kwh * rate_cents_kwh / 100, 2)

  - id: cni_capacity_transmission
    subject: [cni_supply_charge]
    rule: >-
      On a structure whose capacity_cost_treatment is pass_through, each cycle carries one capacity_charge line equal to the facility's peak_load_contribution_kw times the capacity price in effect on billing_period_start times billing_days divided by kw_per_mw, rounded per charge_rounding.
      On a structure whose transmission_cost_treatment is pass_through, each cycle carries one transmission_charge line equal to the facility's transmission_obligation_kw times the transmission rate in effect on billing_period_start times billing_days divided by kw_per_mw, rounded per charge_rounding.
      The price or rate in effect is that of the latest capacity_price or transmission_rate notice on the contract whose effective_date is on or before billing_period_start.
      A cycle that spans a June 1 capacity year change is billed entirely at the price in effect on its billing_period_start.
      When the grid operator revises a tag, past cycles are not re-billed because passthrough_tag_true_up is false.
      During holdover, capacity and transmission are always passed through, whatever the expired structure was.
      On structures where the cost is included, no separate line is billed, and a separate line billed is a billing error.
    eligibility: []
    params:
      kw_per_mw: 1000
      per_tier:
        Beacon Ridge C&I Real-Time Index: {capacity_cost_treatment: "=capacity_cost_treatment", transmission_cost_treatment: "=transmission_cost_treatment"}
        Beacon Ridge C&I Block and Index: {capacity_cost_treatment: "=capacity_cost_treatment", transmission_cost_treatment: "=transmission_cost_treatment"}
        Beacon Ridge C&I Fixed Energy with Capacity and Transmission Pass-Through: {capacity_cost_treatment: "=capacity_cost_treatment", transmission_cost_treatment: "=transmission_cost_treatment"}
        Beacon Ridge C&I Fixed Energy with Capacity Pass-Through: {capacity_cost_treatment: "=capacity_cost_treatment", transmission_cost_treatment: "=transmission_cost_treatment"}
        Beacon Ridge C&I Fixed All-In: {capacity_cost_treatment: "=capacity_cost_treatment", transmission_cost_treatment: "=transmission_cost_treatment"}
        Beacon Ridge C&I Fixed All-In Renewable: {capacity_cost_treatment: "=capacity_cost_treatment", transmission_cost_treatment: "=transmission_cost_treatment"}
    formula:
      when: line_type == "capacity_charge" or line_type == "transmission_charge"
      amount_usd: round(tag_kw * tag_rate_usd_mw_day * billing_days / kw_per_mw, 2)

  - id: cni_market_notices
    subject: [cni_market_notice]
    rule: >-
      Beacon Ridge records on each contract the monthly index price for every delivery month, the capacity price for each June-to-May capacity year and the transmission rate for each calendar year of the facility's zone.
      A fixed price may change during the term only to pass through a change in law or regulation, only on a structure whose regulatory_passthrough_allowed is true, and only with a regulatory_pass_through notice issued at least regulatory_change_notice_days calendar days before its effective date; the new price applies to cycles beginning on or after the later of the stated effective date and notice_date plus regulatory_change_notice_days.
      Changes in capacity price or transmission rate are not regulatory pass-throughs; they flow only through the pass-through lines of structures that pass those costs through.
    eligibility: []

  - id: cni_expiry_and_holdover
    subject: [cni_expiry_notice, cni_expire_holdover]
    rule: >-
      An expiry notice is compliant when its notice_date falls no earlier than expiry_notice_earliest_days and no later than expiry_notice_latest_days calendar days before contract_end_date.
      Expiry notices are issued only on an active contract.
      When the term reaches contract_end_date without a signed renewal and without a termination in progress, the contract moves to holdover on the following day, recorded as holdover_start_date.
      Holdover energy is priced per holdover_pricing, holdover can be ended on holdover_termination_notice_days of notice, and ending holdover carries no early termination fee when holdover_etf_applies is false.
    eligibility:
      - id: expiry_notice_active
        applies_to: [cni_expiry_notice]
        kind: state
        condition: Expiry notices are issued only on an active contract.
        evidence_fields: [cni_contracts.status, cni_contracts.cni_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_contracts.cni_contract_id]
          action_bindings:
            cni_contracts.cni_contract_id: cni_contract_id
        state_contract:
          field: cni_contracts.status
          allowed: [active]

  - id: cni_renewal_terms
    subject: [cni_renew, cni_holdover_renew]
    rule: >-
      Every renewal is priced through a new pricing request with request_purpose renewal naming the contract, because renewal_requires_new_pricing is true.
      A renewal is signed only from a renewal pricing request whose pricing_status is priced and only within its quote validity, counted as for a new contract.
      A renewal signed while the contract is active starts the day after contract_end_date; a renewal signed during holdover starts on the facility's next scheduled meter read date and returns the contract to active.
      A renewal may change the structure and term; the new contract_end_date is counted from term_start_date as at activation.
      A renewal never refunds or re-sizes a posted security deposit.
    eligibility:
      - id: renewal_quote_priced
        applies_to: [cni_renew, cni_holdover_renew]
        kind: state
        condition: A renewal is signed only from a renewal pricing request whose pricing_status is priced and only within its quote validity, counted as for a new contract.
        evidence_fields: [cni_pricing_requests.pricing_status, cni_pricing_requests.pricing_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_pricing_requests.pricing_request_id]
          action_bindings:
            cni_pricing_requests.pricing_request_id: pricing_request_id
        state_contract:
          field: cni_pricing_requests.pricing_status
          allowed: [priced]

  - id: cni_termination
    subject: [cni_terminate, cni_holdover_terminate, cni_preflow_terminate, cni_drop_complete, cni_switch_away]
    rule: >-
      Early termination during a term requires written notice from the customer's authorized signatory; it takes effect on the first scheduled meter read date on or after the notice date plus termination_notice_days, recorded as termination_effective_date.
      Ending holdover service takes effect on the first scheduled meter read date on or after the notice date plus holdover_termination_notice_days.
      An executed contract may be terminated before supply starts; it closes immediately with close_reason terminated_before_flow and the early termination fee is computed on the full term per etf_preflow_basis.
      When the drop completes the contract closes with close_reason early_termination, or holdover_ended when it was ended from holdover.
      When another supplier enrolls the facility or the facility is final-billed, the contract closes with close_reason switched_to_other_supplier or final_billed; during a term this is an early termination for fee purposes.
      A termination notice cannot be withdrawn once the drop has been scheduled.
    eligibility: []

  - id: cni_etf
    subject: [cni_etf_charge]
    rule: >-
      A C&I early termination fee is assessed only once the contract is termination_pending or closed.
      Only one early termination fee may be billed per C&I contract.
      No fee applies when the contract is ended from holdover or after contract_end_date, or when the utility rejected the enrollment.
      The termination date is termination_effective_date for a noticed termination and close_date for a switch-away or final bill; for a pre-flow termination all term_months count as remaining, per etf_preflow_basis.
      Otherwise remaining months are twelve times the difference in years plus the difference in months between the termination date and contract_end_date, plus one when the day of month of contract_end_date is later than the day of month of the termination date.
      etf_remaining_kwh is the facility's annual_kwh_usage times the remaining months divided by months_per_year, rounded half up to a whole kWh, and the fee is etf_remaining_kwh times etf_rate_usd_per_kwh, rounded per charge_rounding, but not less than etf_minimum_usd.
      Facility closure, sale, bankruptcy and dissatisfaction with market prices do not waive the fee.
    eligibility:
      - id: cni_terminated_status
        applies_to: [cni_etf_charge]
        kind: state
        condition: A C&I early termination fee is assessed only once the contract is termination_pending or closed.
        evidence_fields: [cni_contracts.status, cni_contracts.cni_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_contracts.cni_contract_id]
          action_bindings:
            cni_contracts.cni_contract_id: cni_contract_id
        state_contract:
          field: cni_contracts.status
          allowed: [termination_pending, closed]
      - id: cni_single_etf
        applies_to: [cni_etf_charge]
        kind: dedup
        condition: Only one early termination fee may be billed per C&I contract.
        evidence_fields: [cni_billing.cni_contract_id, cni_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_billing.cni_contract_id]
          action_bindings:
            cni_billing.cni_contract_id: cni_contract_id
        dedup_contract:
          table: cni_billing
          mode: separate_record
          object_bindings: {cni_contract_id: cni_contract_id}
          duplicate_filters: {line_type: [early_termination_fee]}
          distinct_fields: []
    params:
      months_per_year: 12
      per_tier:
        Beacon Ridge C&I Real-Time Index: {etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd"}
        Beacon Ridge C&I Block and Index: {etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd"}
        Beacon Ridge C&I Fixed Energy with Capacity and Transmission Pass-Through: {etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd"}
        Beacon Ridge C&I Fixed Energy with Capacity Pass-Through: {etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd"}
        Beacon Ridge C&I Fixed All-In: {etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd"}
        Beacon Ridge C&I Fixed All-In Renewable: {etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd"}
    formula:
      amount_usd: max(etf_minimum_usd, round(etf_remaining_kwh * etf_rate_usd_per_kwh, 2))

  - id: cni_billing_correction
    subject: [cni_adjustment]
    rule: >-
      When a C&I line was billed at more than the contract allows, the over-billed amount is returned as one rebill_credit tied to that line through source_billing_id, equal to the billed amount_usd minus the correctly computed amount and posted as a negative amount.
      A C&I line may be corrected only when the customer disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
      The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
      Each billed C&I line may be corrected only once.
      A care agent may post a rebill credit up to agent_adjustment_limit_usd per line; a larger correction is outside care-desk authority, is not posted, and is handed to a human representative with reason POLICY_NOT_COVERED.
      Tag revisions by the grid operator and interval data corrections by the utility are not billing errors.
    eligibility:
      - id: cni_dispute_lookback
        applies_to: [cni_adjustment]
        kind: time
        condition: A C&I line may be corrected only when the customer disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
        evidence_fields: [cni_billing.posted_date, cni_billing.cni_billing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_billing.cni_billing_id]
          action_bindings:
            cni_billing.cni_billing_id: source_billing_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the line was posted
          anchor_source: cni_billing.posted_date
          relation: not_after
          duration_source: variants.billing_dispute_lookback_months
          unit: calendar_months
          counting_rule: The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
          boundary: inclusive
      - id: cni_one_correction_per_line
        applies_to: [cni_adjustment]
        kind: dedup
        condition: Each billed C&I line may be corrected only once.
        evidence_fields: [cni_billing.source_billing_id, cni_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_billing.source_billing_id]
          action_bindings:
            cni_billing.source_billing_id: source_billing_id
        dedup_contract:
          table: cni_billing
          mode: separate_record
          object_bindings: {source_billing_id: source_billing_id}
          duplicate_filters: {line_type: [rebill_credit]}
          distinct_fields: []
