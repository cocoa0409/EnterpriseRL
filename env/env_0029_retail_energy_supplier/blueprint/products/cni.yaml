category: cni
display_name: Commercial and Industrial Electricity Contracts

binding:
  holding_table: cni_contracts
  event_tables: [cni_billing, cni_deposits, cni_notices]
  intake_tables: [cni_pricing_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [pending_enrollment, active, termination_pending, holdover, closed, rejected]
  transitions:
    - {from: pending_enrollment, to: active, by: system, means: The utility switches the facility to Beacon Ridge supply on the scheduled meter read date and the contract term begins.}
    - {from: pending_enrollment, to: rejected, by: system, means: The utility rejects the enrollment transaction.}
    - {from: pending_enrollment, to: closed, by: user, means: The customer terminates the executed contract before supply starts.}
    - {from: active, to: termination_pending, by: user, means: The customer's authorized signatory gives written notice of early termination.}
    - {from: termination_pending, to: closed, by: system, means: The utility completes the drop on the first scheduled meter read after the notice period.}
    - {from: active, to: holdover, by: system, means: The term expires without a renewal and the facility continues on holdover index pricing.}
    - {from: holdover, to: active, by: user, means: The customer signs a renewal contract while on holdover and a new term begins.}
    - {from: holdover, to: termination_pending, by: user, means: The customer gives notice to end holdover service.}
    - {from: active, to: closed, by: system, means: The utility ends supply because another supplier enrolled the facility or it was final-billed.}
    - {from: holdover, to: closed, by: system, means: The utility ends holdover supply because another supplier enrolled the facility or it was final-billed.}

accounts:
  - key: cni_supply_billed
    unit: USD
    meaning: Net Beacon Ridge charges billed on the contract; energy, pass-through and termination lines increase it, rebill credits reduce it.
  - key: cni_deposit_held
    unit: USD
    meaning: Security deposit Beacon Ridge holds against the contract; a posted deposit increases it and a refund or application reduces it.

parameter_schema:
  product_structure: Contract structure (string enum real_time_index | block_and_index | fixed_energy_pt_cap_trans | fixed_energy_pt_cap | fixed_all_in).
  energy_price_basis: How energy is priced (string enum index_plus_adder | fixed_block_plus_index_balance | fixed).
  capacity_cost_treatment: Whether capacity cost is billed separately at cost or included in the energy price (string enum pass_through | included).
  transmission_cost_treatment: Whether network transmission cost is billed separately at cost or included (string enum pass_through | included).
  ancillary_cost_treatment: Treatment of ancillary services and line losses (string enum included).
  renewable_content_pct: Share of usage matched with renewable energy certificates beyond the state standard (percent, integer).
  rec_type: Kind of certificate retired (string; "none" when none).
  rec_retirement_statement: Whether an annual certificate retirement statement is issued (boolean).
  green_marketing_kit: Whether the customer receives the renewable logo license (boolean).
  allowed_terms_months: Contract terms that may be priced (list of integer months).
  min_annual_kwh: Smallest 12-month historical usage of a facility for a C&I contract (integer kWh).
  index_market: Market index used for index-priced energy (string).
  index_price_basis: Which market notice prices a billing cycle's index energy (string enum notice_for_month_of_billing_period_start).
  capacity_charge_basis: How a pass-through capacity charge is computed (string enum plc_kw_x_price_usd_mw_day_x_days_div_1000).
  transmission_charge_basis: How a pass-through transmission charge is computed (string enum nspl_kw_x_rate_usd_mw_day_x_days_div_1000).
  passthrough_tag_true_up: Whether capacity and transmission charges are trued up retroactively when the grid operator revises a tag (boolean).
  block_size_basis: Source of the fixed block size on a block and index contract (string enum quoted_block_kwh_per_cycle; not_applicable for other structures).
  quote_validity_days: Calendar days after the quote date through which a priced quote may be signed (integer days).
  pricing_turnaround_business_days: Business days the structuring desk takes to price a request (integer days).
  renewal_requires_new_pricing: Whether every renewal is priced through a new pricing request (boolean).
  regulatory_passthrough_allowed: Whether a fixed price may be adjusted for a change in law or regulation (boolean).
  regulatory_change_notice_days: Minimum calendar days between a pass-through notice and its effective date (integer days).
  etf_method: How early termination damages are computed (string enum liquidated_damages_per_kwh).
  etf_rate_usd_per_kwh: Liquidated damages per remaining contracted kWh (USD per kWh, 4 decimals).
  etf_minimum_usd: Minimum early termination fee (USD, 2 decimals).
  etf_remaining_usage_basis: How remaining kWh are estimated (string enum annual_kwh_usage_prorated_by_remaining_months).
  etf_preflow_basis: Remaining months counted when an executed contract is terminated before supply starts (string enum full_term).
  termination_notice_days: Calendar days of written notice required before an early termination takes effect (integer days).
  holdover_pricing: How energy is priced during holdover (string enum real_time_index_plus_holdover_adder).
  holdover_adder_cents_kwh: Adder over the monthly index during holdover (cents per kWh, 2 decimals).
  holdover_termination_notice_days: Calendar days of notice required to end holdover service (integer days).
  holdover_etf_applies: Whether ending holdover service carries an early termination fee (boolean).
  expiry_notice_earliest_days: Earliest point, in calendar days before contract end, at which the expiry notice may be issued (integer days).
  expiry_notice_latest_days: Latest point, in calendar days before contract end, by which the expiry notice must be issued (integer days).
  late_expiry_notice_holdover_adder_waived: Whether the holdover adder is not charged when the expiry notice was missing or late (boolean).
  deposit_months_by_grade: Months of estimated supply cost required as security deposit, by the customer's commercial credit grade (mapping grade -> integer months).
  deposit_reference_rate_cents_kwh: Reference price used to estimate monthly supply cost for the deposit (cents per kWh, 2 decimals).
  max_total_deposit_usd: Ceiling on the combined deposits held across all of a customer's C&I contracts (USD, 2 decimals).
  deposit_due_before_enrollment: Whether a required deposit must be posted before the enrollment is submitted to the utility (boolean).
  deposit_refund_trigger: When a held deposit is refunded (string enum contract_closed_and_final_bill_posted).
  deposit_interest_rate_pct: Annual interest paid on held deposits (percent, 2 decimals).
  billing_dispute_lookback_months: Calendar months after posting during which a line may be corrected (integer months).
  agent_adjustment_limit_usd: Largest rebill credit a care agent may post on one line (USD, 2 decimals).
  charge_rounding: Rounding applied to every computed charge (string enum half_up_to_cent).
  eligible_premise_class: Premise class served (string enum commercial).
  eligible_states: States in which the structure is offered (list of state codes).
  account_manager_assigned: Whether a named account manager is assigned to the customer (boolean).
  usage_report_frequency: How often an interval usage report is sent (string enum monthly | quarterly).

