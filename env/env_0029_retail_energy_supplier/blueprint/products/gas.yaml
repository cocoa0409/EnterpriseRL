category: gas
display_name: Residential Natural Gas Supply

binding:
  holding_table: gas_agreements
  event_tables: [gas_billing, gas_notices]
  intake_tables: [gas_billing_disputes]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [enrollment_pending, active, drop_pending, closed, rescinded, rejected]
  transitions:
    - {from: enrollment_pending, to: active, by: system, means: The gas utility moves the premise to Beacon Ridge supply on the scheduled meter read date.}
    - {from: enrollment_pending, to: rescinded, by: user, means: The customer exercises the right to rescind the gas enrollment before supply starts.}
    - {from: enrollment_pending, to: rejected, by: system, means: The gas utility rejects the enrollment transaction.}
    - {from: active, to: drop_pending, by: user, means: The customer confirms cancellation of the gas agreement and a drop is scheduled for the next meter read.}
    - {from: drop_pending, to: active, by: user, means: The customer withdraws the cancellation before the drop takes effect.}
    - {from: drop_pending, to: closed, by: system, means: The gas utility completes the scheduled drop.}
    - {from: active, to: closed, by: system, means: The gas utility ends Beacon Ridge supply because another supplier enrolled the premise or the premise was final-billed for a move-out.}

accounts:
  - key: gas_supply_billed
    unit: USD
    meaning: Net Beacon Ridge gas supply charges billed on the agreement through the utility bill; supply charges, early termination fees and thermostat recovery fees increase it, bill credits and rebill credits reduce it.

parameter_schema:
  rate_type: Pricing structure of the gas plan (string enum variable | capped_variable | fixed).
  term_months: Length of the plan term in months (integer; 0 means month-to-month).
  carbon_offset_pct: Share of the customer's gas usage whose combustion emissions are matched with retired carbon offsets (percent, integer).
  offset_standard: Registry standard of the offsets retired (string; "none" when the plan carries no offsets).
  offset_tco2e_per_therm: Metric tons of CO2e offset per therm billed (decimal, 4 places; 0.0000 for plans without offsets).
  offset_statement: Whether the customer receives an annual statement of offsets retired (boolean).
  monthly_service_fee_usd: Flat supplier service fee billed once per billing cycle (USD, 2 decimals).
  dual_fuel_fee_waiver: Whether the monthly service fee is not billed for a cycle in which the same premise has an active Beacon Ridge residential electricity agreement (boolean).
  intro_rate_cycles: Number of initial billing cycles billed at the enrollment rate before monthly variable pricing applies (integer; 0 means none).
  variable_rate_notice_days: Minimum number of calendar days between the notice date of a variable rate change and its effective date (integer days).
  variable_rate_effective_basis: Which billing cycles a new variable rate applies to (string enum cycles_beginning_on_or_after_effective_date).
  rate_ceiling_applies: Whether the rate billed in any cycle of the term may never exceed the enrollment rate (boolean).
  regulatory_passthrough_allowed: Whether a fixed or capped rate may be adjusted during the term to pass through a change in law or regulation (boolean).
  regulatory_change_notice_days: Minimum number of calendar days between the notice of a regulatory pass-through and its effective date (integer days).
  etf_method: How the early termination fee is computed (string enum none | flat | per_remaining_month).
  etf_per_remaining_month_usd: Fee per remaining month under the per_remaining_month method (USD, 2 decimals).
  etf_flat_usd: Fee under the flat method (USD, 2 decimals).
  etf_max_usd: Ceiling on the early termination fee before any state cap (USD, 2 decimals).
  etf_free_window_days: Number of calendar days immediately before the contract end date during which a cancellation carries no early termination fee (integer days).
  etf_waive_on_move: Whether the fee is waived when the utility final-billed the premise for a move-out (boolean).
  etf_waive_assistance_program: Whether the fee is waived for a customer enrolled in a utility customer assistance program (boolean).
  etf_waive_on_upgrade: Whether no fee applies to an allowed mid-term move to a Beacon Ridge gas plan with an equal or longer term (boolean).
  etf_state_cap_usd: Per-state statutory ceiling on residential early termination fees (mapping state code -> USD; states absent impose no cap).
  thermostat_included: Whether the plan includes a smart thermostat shipped to the customer (boolean).
  thermostat_ship_after_cycles: Completed billing cycles after which the included thermostat ships (integer cycles; 0 when no thermostat).
  thermostat_recovery_fee_usd: Hardware recovery fee billed when an agreement with a shipped thermostat ends early within the recovery period (USD, 2 decimals).
  thermostat_recovery_months: Number of calendar months after the thermostat ship date during which the recovery fee applies (integer months).
  thermostat_recovery_waive_on_move: Whether the recovery fee is waived on a utility move-out (boolean).
  thermostat_limit_per_customer: Maximum number of included thermostats one customer may receive across all gas agreements (integer).
  rescission_window_days: Number of calendar days after the utility's enrollment confirmation date within which the customer may rescind (integer days).
  signup_credit_usd: One-time sign-up bill credit (USD, 2 decimals; 0.00 means none).
  signup_credit_after_cycles: Completed billing cycles of continuous supply after which the sign-up credit posts (integer cycles).
  signup_credit_forfeit_on_drop: Whether an unposted sign-up credit is forfeited when the agreement leaves active status before qualifying (boolean).
  enrollment_channels: Channels through which the plan may be enrolled (list of phone | web | mail).
  renewal_loyalty_credit_usd: One-time bill credit posted when the customer renews into a new term (USD, 2 decimals).
  renewal_notice_earliest_days: Earliest point, in calendar days before contract end, for the initial renewal notice (integer days).
  renewal_notice_latest_days: Latest point, in calendar days before contract end, for the initial renewal notice (integer days).
  final_options_notice_latest_days: Latest point, in calendar days before contract end, for the final options notice (integer days).
  post_expiry_renewal_grace_days: Calendar days after rollover during which a renewal election is still honoured (integer days).
  rollover_variant: The plan an expiring agreement converts to without an election (official plan name).
  late_notice_rate_hold_cycles: Billing cycles after rollover during which the expiring rate is held when notices were late (integer cycles).
  billing_dispute_lookback_months: Calendar months after posting during which a billed line may be corrected (integer months).
  agent_adjustment_limit_usd: Largest rebill credit a care agent may post on one line (USD, 2 decimals).
  charge_rounding: Rounding applied to every computed charge and credit (string enum half_up_to_cent).
  cap_customer_eligible: Whether a customer enrolled in a utility customer assistance program may enroll (boolean).
  eligible_premise_class: Premise class the plan may serve (string enum residential).
  eligible_states: States in which the plan is offered (list of state codes).
  mid_term_plan_change_allowed: Whether the customer may move to another Beacon Ridge gas plan before the term ends (boolean).
  plan_change_effective_basis: When a mid-term plan change takes effect (string enum next_billing_cycle_start).
  drop_effective_basis: When a cancellation drop takes effect (string enum next_scheduled_meter_read).

