events:
  - type: gas_enroll
    target: gas_agreements
    mutation: create
    meaning: The customer authorizes Beacon Ridge to become the natural gas supplier for one residential premise and the enrollment is submitted to the gas utility.
    grain: One row per enrollment authorization for one premise.
    fields:
      customer_id: The customer who authorized the enrollment.
      premise_id: The service premise being enrolled.
      variant_name: The official name of the gas plan enrolled.
      enrollment_date: Date the customer authorized the enrollment.
      enrollment_channel: Channel through which the enrollment was completed.
      term_months: Term copied from the plan.
      contract_rate_usd_therm: Enrollment rate from the price offer valid on the enrollment date for this plan and the premise's gas utility.
    triggers: []
  - type: gas_utility_confirm
    target: gas_agreements
    mutation: update
    meaning: The gas utility accepts the enrollment and issues its confirmation letter.
    grain: One row per transaction.
    fields:
      utility_confirmation_date: Date printed on the utility's enrollment confirmation letter.
    triggers: []
  - type: gas_activate
    target: gas_agreements
    mutation: {transition: {from: enrollment_pending, to: active}}
    meaning: Gas supply begins on the switch meter read date.
    grain: One row per transaction.
    fields:
      service_start_date: The switch meter read date on which Beacon Ridge gas supply began.
      contract_end_date: Last day of the term; empty for a month-to-month plan.
    triggers: []
  - type: gas_reject
    target: gas_agreements
    mutation: {transition: {from: enrollment_pending, to: rejected}}
    meaning: The gas utility rejects the enrollment transaction.
    grain: One row per transaction.
    fields:
      reject_reason: The utility's rejection reason.
    triggers: []
  - type: gas_rescind
    target: gas_agreements
    mutation: {transition: {from: enrollment_pending, to: rescinded}}
    meaning: The customer rescinds the gas enrollment before supply starts.
    grain: One row per transaction.
    fields:
      rescinded_date: Date the customer asked to rescind.
    triggers: []
  - type: gas_cancel
    target: gas_agreements
    mutation: {transition: {from: active, to: drop_pending}}
    meaning: The customer confirms cancellation and a drop is scheduled with the gas utility.
    grain: One row per transaction.
    fields:
      drop_requested_date: Date the customer confirmed the cancellation.
      drop_reason: Why the customer is cancelling.
      drop_effective_date: The premise's next scheduled meter read date on the request date.
    triggers: []
  - type: gas_cancel_withdraw
    target: gas_agreements
    mutation: {transition: {from: drop_pending, to: active}}
    meaning: The customer withdraws a pending cancellation before the drop takes effect.
    grain: One row per transaction.
    fields:
      drop_requested_date: Cleared to empty.
      drop_reason: Cleared to empty.
      drop_effective_date: Cleared to empty.
    triggers: []
  - type: gas_drop_complete
    target: gas_agreements
    mutation: {transition: {from: drop_pending, to: closed}}
    meaning: The gas utility completes the scheduled drop.
    grain: One row per transaction.
    fields:
      close_date: The meter read date on which supply ended.
      close_reason: Why supply ended.
    triggers:
      - event: protect:protect_billing_transfer
        map: {}
  - type: gas_switch_away
    target: gas_agreements
    mutation: {transition: {from: active, to: closed}}
    meaning: The gas utility ends Beacon Ridge supply because another supplier enrolled the premise or the premise was final-billed for a move-out.
    grain: One row per transaction.
    fields:
      close_date: The meter read date on which supply ended.
      close_reason: Why supply ended.
    triggers:
      - event: protect:protect_billing_transfer
        map: {}
  - type: gas_plan_change
    target: gas_agreements
    mutation: update
    meaning: The customer moves an active gas agreement to another Beacon Ridge gas plan before the term ends.
    grain: One row per transaction.
    fields:
      variant_name: The new plan's official name.
      term_months: Term of the new plan.
      contract_rate_usd_therm: Rate of the new plan from the price offer valid on the plan change date.
      contract_end_date: Last day of the new term counted from plan_change_date; empty for month-to-month.
      plan_change_date: Start of the next billing cycle, when the new plan takes effect.
    triggers: []
  - type: gas_renew
    target: gas_agreements
    mutation: update
    meaning: The customer accepts the gas renewal offer and the agreement continues into a new term.
    grain: One row per transaction.
    fields:
      variant_name: The plan renewed into, as offered.
      term_months: Term of the renewed plan.
      contract_rate_usd_therm: The renewal rate offered.
      contract_end_date: Last day of the new term.
      plan_change_date: Date the new term starts.
    triggers:
      - event: gas:gas_credit
        when: {variant_name: [Beacon Ridge Gas Capped Variable 12, Beacon Ridge Gas Price Lock 12, Beacon Ridge Gas Price Lock 24, Beacon Ridge Gas Price Lock 36, Beacon Ridge Carbon Offset Gas 12, Beacon Ridge Carbon Offset Gas 24]}
        map: {line_type: renewal_loyalty_credit, gas_agreement_id: gas_agreement_id}
  - type: gas_rollover
    target: gas_agreements
    mutation: update
    meaning: An expired gas term without a renewal election converts to the month-to-month rollover plan.
    grain: One row per transaction.
    fields:
      variant_name: The rollover plan's official name.
      term_months: Set to 0.
      contract_rate_usd_therm: The disclosed rollover rate or the held expiring rate.
      contract_end_date: Cleared to empty.
      plan_change_date: The day after the expired contract_end_date.
    triggers: []
  - type: gas_thermostat_ship
    target: gas_agreements
    mutation: update
    meaning: Beacon Ridge ships the smart thermostat included with the plan.
    grain: One row per transaction.
    fields:
      thermostat_shipped_date: Date the thermostat shipped.
    triggers: []
  - type: gas_supply_charge
    target: gas_billing
    meaning: Beacon Ridge bills the gas supplied in one billing cycle, or the cycle's monthly service fee.
    grain: One row per charge line per billing cycle.
    distinguish_by: [line_type, billing_period_start]
    fields:
      gas_agreement_id: The agreement billed.
      line_type: energy_charge or monthly_service_fee.
      billing_period_start: First day of the billing cycle.
      billing_period_end: Last day of the billing cycle.
      usage_therms: Therms billed on an energy line; 0 on the fee line.
      rate_usd_therm: Rate applied; 0.0000 on the fee line.
      amount_usd: Positive charge amount.
      posted_date: Date posted.
    account: gas_supply_billed
    direction: in
    triggers: []
  - type: gas_etf_charge
    target: gas_billing
    meaning: Beacon Ridge bills an early termination fee or a thermostat recovery fee when a gas term ends early.
    grain: One row per fee type per early termination.
    distinguish_by: [line_type, posted_date]
    fields:
      gas_agreement_id: The agreement terminated.
      line_type: early_termination_fee or thermostat_recovery_fee.
      etf_months_remaining: Remaining months of the term used in the early termination fee; 0 on a thermostat recovery line.
      amount_usd: Positive fee amount.
      posted_date: Date posted.
    account: gas_supply_billed
    direction: in
    triggers: []
  - type: gas_credit
    target: gas_billing
    meaning: Beacon Ridge posts a sign-up or renewal loyalty credit to the gas agreement.
    grain: One row per credit type per agreement.
    distinguish_by: [line_type, billing_period_start]
    fields:
      gas_agreement_id: The agreement credited.
      line_type: signup_credit or renewal_loyalty_credit.
      billing_period_start: Billing cycle on whose bill the credit appears.
      amount_usd: Negative credit amount.
      posted_date: Date posted.
    account: gas_supply_billed
    direction: out
    triggers: []
  - type: gas_adjustment
    target: gas_billing
    meaning: Beacon Ridge corrects an over-billed gas line with a rebill credit.
    grain: One row per corrected original line.
    distinguish_by: [source_billing_id, posted_date]
    fields:
      gas_agreement_id: The agreement corrected.
      line_type: rebill_credit.
      source_billing_id: The billed line being corrected.
      billing_period_start: Billing cycle of the corrected line.
      amount_usd: Negative credit equal to the over-billed amount.
      posted_date: Date posted.
    account: gas_supply_billed
    direction: out
    triggers: []
  - type: gas_renewal_notice
    target: gas_notices
    meaning: Beacon Ridge issues a gas contract expiration notice with a renewal offer and rollover terms.
    grain: One row per notice type per issue date.
    distinguish_by: [notice_type, notice_date]
    fields:
      gas_agreement_id: The expiring agreement.
      notice_type: initial_renewal_notice or final_options_notice.
      notice_date: Date issued.
      effective_date: The contract_end_date referred to.
      offered_variant_name: The plan offered for renewal.
      new_rate_usd_therm: The renewal rate offered.
      rollover_rate_usd_therm: The month-to-month rate for the first cycle after expiry.
      delivery_channel: How the notice was delivered.
    triggers: []
  - type: gas_rate_notice
    target: gas_notices
    meaning: Beacon Ridge notifies a monthly variable gas rate or a regulatory pass-through.
    grain: One row per rate change per effective date.
    distinguish_by: [notice_type, effective_date]
    fields:
      gas_agreement_id: The agreement whose rate changes.
      notice_type: variable_rate_change or regulatory_pass_through.
      notice_date: Date issued.
      effective_date: Stated effective date of the new rate.
      new_rate_usd_therm: The new rate.
      delivery_channel: How the notice was delivered.
    triggers: []

measures:
  - id: gas_msr_completed_cycles
    window: From the agreement's service_start_date up to the frozen handling date.
    measure: Count of distinct billing_period_start values among gas_supply_charge rows with line_type energy_charge on the agreement whose billing_period_end is on or before the frozen handling date.
  - id: gas_msr_thermostats_shipped
    window: All time.
    measure: Count of the customer's gas agreements, in any status, whose thermostat_shipped_date is not empty.

policies:
  - id: gas_agg_multi_holding
    subject: [gas_enroll]
    rule: >-
      A residential customer may hold up to max_per_customer Beacon Ridge gas agreements at the same time, one per premise.
      An agreement counts toward the limit while its status is enrollment_pending, active or drop_pending.
      No other gas agreement on the same premise may be in enrollment_pending, active or drop_pending status when a new gas enrollment is submitted.
      A second enrollment on such a premise is refused and the customer is offered a plan change on the existing agreement instead.
    eligibility:
      - id: one_live_gas_agreement_per_premise
        applies_to: [gas_enroll]
        kind: dedup
        condition: No other gas agreement on the same premise may be in enrollment_pending, active or drop_pending status when a new gas enrollment is submitted.
        evidence_fields: [gas_agreements.premise_id, gas_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_agreements.premise_id]
          action_bindings:
            gas_agreements.premise_id: premise_id
        dedup_contract:
          table: gas_agreements
          mode: separate_record
          object_bindings: {premise_id: premise_id}
          duplicate_filters: {status: [enrollment_pending, active, drop_pending]}
          distinct_fields: []
    params:
      max_per_customer: 4

  - id: gas_agg_thermostat_limit
    subject: [gas_thermostat_ship]
    rule: >-
      Included thermostats are limited across the customer's whole gas portfolio, not per agreement.
      A thermostat ships only while the customer's count of shipped thermostats (gas_msr_thermostats_shipped) is below thermostat_limit_per_customer.
      An agreement whose plan includes a thermostat but whose customer has reached the limit receives no thermostat and no substitute credit, and therefore can never incur a thermostat recovery fee.
    eligibility:
      - id: thermostat_portfolio_limit
        applies_to: [gas_thermostat_ship]
        kind: authorization
        condition: A thermostat ships only while the customer's count of shipped thermostats (gas_msr_thermostats_shipped) is below thermostat_limit_per_customer.
        evidence_fields: [gas_agreements.thermostat_shipped_date, gas_agreements.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_agreements.customer_id]
          action_bindings:
            gas_agreements.customer_id: customer_id
    measures: [gas_msr_thermostats_shipped]

  - id: gas_thermostat_fulfillment
    subject: [gas_thermostat_ship]
    rule: >-
      On a plan whose thermostat_included is true, the thermostat ships once the agreement's completed cycles (gas_msr_completed_cycles) reach thermostat_ship_after_cycles.
      The thermostat ships only while the agreement is active.
      An agreement receives at most one thermostat, so thermostat_shipped_date is written once and never changed.
      A plan change or renewal into a thermostat plan does not ship a thermostat; only a new enrollment on such a plan does.
    eligibility:
      - id: thermostat_agreement_active
        applies_to: [gas_thermostat_ship]
        kind: state
        condition: The thermostat ships only while the agreement is active.
        evidence_fields: [gas_agreements.status, gas_agreements.gas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_agreements.gas_agreement_id]
          action_bindings:
            gas_agreements.gas_agreement_id: gas_agreement_id
        state_contract:
          field: gas_agreements.status
          allowed: [active]
    measures: [gas_msr_completed_cycles]

  - id: gas_enrollment_eligibility
    subject: [gas_enroll]
    rule: >-
      A gas enrollment is accepted only for a premise whose premise_class is residential, whose gas_utility is not none, and whose service_state is listed in the plan's eligible_states.
      The premise must be residential.
      A customer whose assistance_program is utility_cap may enroll only in a plan whose cap_customer_eligible is true.
      The enrollment channel must be one of the plan's enrollment_channels.
      The contract_rate_usd_therm is the offer_rate of the price offer for the plan and the premise's gas utility whose validity window contains the enrollment_date; on a capped variable plan that rate is also the ceiling for the whole term.
      term_months is copied from the plan.
    eligibility:
      - id: residential_gas_premise
        applies_to: [gas_enroll]
        kind: state
        condition: The premise must be residential.
        evidence_fields: [premises.premise_class, premises.premise_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [premises.premise_id]
          action_bindings:
            premises.premise_id: premise_id
        state_contract:
          field: premises.premise_class
          allowed: [residential]
      - id: cap_customer_gas_plan
        applies_to: [gas_enroll]
        kind: authorization
        condition: A customer whose assistance_program is utility_cap may enroll only in a plan whose cap_customer_eligible is true.
        evidence_fields: [customers.assistance_program, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id

  - id: gas_enrollment_processing
    subject: [gas_utility_confirm, gas_activate, gas_reject]
    rule: >-
      After submission the gas utility either accepts the enrollment, recording its confirmation letter date as utility_confirmation_date, or rejects it with one of the utility rejection reasons.
      Supply begins on the switch meter read date, which becomes service_start_date.
      For a plan with term_months above 0, contract_end_date is the day before the same calendar day term_months calendar months after service_start_date; when that calendar day does not exist in the target month, the last day of that month is used before subtracting the day.
      A month-to-month plan has an empty contract_end_date.
      A rejected enrollment ends permanently; a new enrollment creates a new agreement priced on its own enrollment date.
    eligibility: []

  - id: gas_rescission
    subject: [gas_rescind]
    rule: >-
      A customer may rescind a gas enrollment while the agreement is still enrollment_pending.
      The rescission is accepted only when the customer asks to rescind no later than rescission_window_days calendar days after the gas utility issued its enrollment confirmation (utility_confirmation_date).
      Day one is the calendar day after utility_confirmation_date, and the window closes at the end of the calendar day equal to utility_confirmation_date plus rescission_window_days.
      When utility_confirmation_date is still empty the window has not started and a rescission is accepted.
      A rescission carries no fee and no credit.
      Once supply has started the agreement can only be cancelled.
    eligibility:
      - id: gas_rescission_window
        applies_to: [gas_rescind]
        kind: time
        condition: The rescission is accepted only when the customer asks to rescind no later than rescission_window_days calendar days after the gas utility issued its enrollment confirmation (utility_confirmation_date).
        evidence_fields: [gas_agreements.utility_confirmation_date, gas_agreements.gas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_agreements.gas_agreement_id]
          action_bindings:
            gas_agreements.gas_agreement_id: gas_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the gas utility issued its enrollment confirmation
          anchor_source: gas_agreements.utility_confirmation_date
          relation: not_after
          duration_source: variants.rescission_window_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after utility_confirmation_date, and the window closes at the end of the calendar day equal to utility_confirmation_date plus rescission_window_days.
          boundary: inclusive

  - id: gas_supply_billing
    subject: [gas_supply_charge]
    rule: >-
      Each billing cycle in which Beacon Ridge supplied gas produces one energy_charge line and, unless waived, one monthly_service_fee line.
      Gas supply charges are billed only while the agreement is active, drop_pending or closed.
      The energy line's amount_usd is usage_therms times the applicable rate, rounded per charge_rounding.
      The applicable rate of a fixed plan is contract_rate_usd_therm for every cycle of the term; the applicable rate of a variable or capped variable plan is set by the gas variable rate policy.
      The fee line has usage_therms 0, rate_usd_therm 0.0000 and amount_usd equal to monthly_service_fee_usd, billed in full for partial cycles and not billed when the fee is 0.00.
      Holding an active Beacon Ridge residential electricity agreement on the same premise changes the gas fee: when dual_fuel_fee_waiver is true and a power agreement on the same premise_id was active on the cycle's billing_period_start, no monthly_service_fee line is billed for that cycle.
      A fee line billed despite the dual-fuel waiver is a billing error corrected under the gas billing correction policy.
    eligibility:
      - id: gas_supplied_status
        applies_to: [gas_supply_charge]
        kind: state
        condition: Gas supply charges are billed only while the agreement is active, drop_pending or closed.
        evidence_fields: [gas_agreements.status, gas_agreements.gas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_agreements.gas_agreement_id]
          action_bindings:
            gas_agreements.gas_agreement_id: gas_agreement_id
        state_contract:
          field: gas_agreements.status
          allowed: [active, drop_pending, closed]
    params:
      per_tier:
        Beacon Ridge Gas Monthly Variable: {monthly_service_fee_usd: "=monthly_service_fee_usd", dual_fuel_fee_waiver: "=dual_fuel_fee_waiver"}
        Beacon Ridge Gas Capped Variable 12: {monthly_service_fee_usd: "=monthly_service_fee_usd", dual_fuel_fee_waiver: "=dual_fuel_fee_waiver"}
        Beacon Ridge Gas Price Lock 12: {monthly_service_fee_usd: "=monthly_service_fee_usd", dual_fuel_fee_waiver: "=dual_fuel_fee_waiver"}
        Beacon Ridge Gas Price Lock 24: {monthly_service_fee_usd: "=monthly_service_fee_usd", dual_fuel_fee_waiver: "=dual_fuel_fee_waiver"}
        Beacon Ridge Gas Price Lock 36: {monthly_service_fee_usd: "=monthly_service_fee_usd", dual_fuel_fee_waiver: "=dual_fuel_fee_waiver"}
        Beacon Ridge Carbon Offset Gas 12: {monthly_service_fee_usd: "=monthly_service_fee_usd", dual_fuel_fee_waiver: "=dual_fuel_fee_waiver"}
        Beacon Ridge Carbon Offset Gas 24: {monthly_service_fee_usd: "=monthly_service_fee_usd", dual_fuel_fee_waiver: "=dual_fuel_fee_waiver"}
    formula:
      when: line_type == "energy_charge"
      amount_usd: round(usage_therms * rate_usd_therm, 2)

  - id: gas_variable_rate
    subject: [gas_rate_notice, gas_supply_charge]
    rule: >-
      A month-to-month gas agreement is billed at contract_rate_usd_therm for its first intro_rate_cycles billing cycles and for any cycles held at the expiring rate under the gas rollover policy.
      After that, and on a capped variable plan from the first cycle, each cycle is billed at the new_rate_usd_therm of the latest variable_rate_change notice on the agreement whose effective date is on or before the cycle's billing_period_start; until the first such notice applies, contract_rate_usd_therm continues.
      A variable rate change takes effect only for billing cycles beginning on or after its effective date.
      A variable rate change notice must be issued at least variable_rate_notice_days calendar days before its stated effective date; when it is issued later, the change applies only from the first cycle beginning on or after notice_date plus variable_rate_notice_days.
      On a plan whose rate_ceiling_applies is true, the rate billed in a cycle is the lower of that variable rate and contract_rate_usd_therm.
      Variable rate changes never apply to a fixed plan during its term.
    eligibility: []

  - id: gas_regulatory_passthrough
    subject: [gas_rate_notice]
    rule: >-
      A fixed or capped gas rate may change during the term only to pass through a change in law or regulation, and only on a plan whose regulatory_passthrough_allowed is true.
      A regulatory_pass_through notice must be issued at least regulatory_change_notice_days calendar days before its effective date, and the new rate applies to cycles beginning on or after the later of the stated effective date and notice_date plus regulatory_change_notice_days.
      On a plan whose regulatory_passthrough_allowed is false the rate is guaranteed for the whole term, and any pass-through billed on it is a billing error.
      A regulatory pass-through is not a ground for waiving the early termination fee.
    eligibility: []

  - id: gas_expiry_notices
    subject: [gas_renewal_notice]
    rule: >-
      Every gas agreement with a term receives two expiration notices.
      Gas renewal notices are issued only on an active agreement with a term.
      The initial_renewal_notice is compliant when its notice_date falls no earlier than renewal_notice_earliest_days and no later than renewal_notice_latest_days calendar days before contract_end_date.
      The final_options_notice is compliant when its notice_date falls no later than final_options_notice_latest_days calendar days before contract_end_date and after the initial notice.
      Each notice states the plan offered for renewal, the renewal rate and the month-to-month rate for the first cycle after expiry; when the two notices differ, the final_options_notice governs.
      Notices are delivered by email only to customers who enrolled through the web channel and by mail otherwise.
    eligibility:
      - id: gas_active_term
        applies_to: [gas_renewal_notice]
        kind: state
        condition: Gas renewal notices are issued only on an active agreement with a term.
        evidence_fields: [gas_agreements.status, gas_agreements.gas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_agreements.gas_agreement_id]
          action_bindings:
            gas_agreements.gas_agreement_id: gas_agreement_id
        state_contract:
          field: gas_agreements.status
          allowed: [active]

  - id: gas_rollover_terms
    subject: [gas_rollover]
    rule: >-
      When a gas term reaches contract_end_date without a renewal election and without a pending cancellation, the agreement converts on the following day to the plan named by rollover_variant, with term_months 0, an empty contract_end_date and plan_change_date set to the day after the expired contract_end_date.
      When both expiration notices were compliant, the rollover rate is the rollover_rate_usd_therm stated in the final_options_notice.
      When either notice was missing or not compliant, the expiring rate is held for late_notice_rate_hold_cycles billing cycles beginning with the first cycle after expiry, and the gas variable rate policy applies only after those cycles.
      A rolled-over agreement carries the rollover plan's terms, including no early termination fee, and earns no sign-up credit.
    eligibility: []

  - id: gas_renewal
    subject: [gas_renew, gas_credit]
    rule: >-
      A customer renews by accepting the offer in the governing gas renewal notice: the agreement takes the offered plan, its term_months and the offered renewal rate.
      A renewal is accepted only on an active agreement.
      When the election is made on or before contract_end_date, the new term starts the day after contract_end_date; when it is made after a rollover, the new term starts on the election date.
      When the gas agreement has already rolled over, a renewal election is honoured only when the customer elects to renew no later than post_expiry_renewal_grace_days calendar days after the rollover took effect on plan_change_date.
      Day one is the calendar day after plan_change_date, and the grace period closes at the end of the calendar day equal to plan_change_date plus post_expiry_renewal_grace_days.
      Each renewal earns one renewal_loyalty_credit equal to the renewal_loyalty_credit_usd of the plan renewed into, posted on the first bill of the new term; plans with 0.00 earn none.
      A late election or a choice of a plan other than the one offered is a plan change, not a renewal.
    eligibility:
      - id: renewal_active
        applies_to: [gas_renew]
        kind: state
        condition: A renewal is accepted only on an active agreement.
        evidence_fields: [gas_agreements.status, gas_agreements.gas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_agreements.gas_agreement_id]
          action_bindings:
            gas_agreements.gas_agreement_id: gas_agreement_id
        state_contract:
          field: gas_agreements.status
          allowed: [active]
      - id: gas_post_expiry_grace
        applies_to: [gas_renew]
        kind: time
        condition: When the gas agreement has already rolled over, a renewal election is honoured only when the customer elects to renew no later than post_expiry_renewal_grace_days calendar days after the rollover took effect on plan_change_date.
        evidence_fields: [gas_agreements.plan_change_date, gas_agreements.gas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_agreements.gas_agreement_id]
          action_bindings:
            gas_agreements.gas_agreement_id: gas_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the rollover took effect on plan_change_date
          anchor_source: gas_agreements.plan_change_date
          relation: not_after
          duration_source: variants.post_expiry_renewal_grace_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after plan_change_date, and the grace period closes at the end of the calendar day equal to plan_change_date plus post_expiry_renewal_grace_days.
          boundary: inclusive

  - id: gas_plan_change_terms
    subject: [gas_plan_change]
    rule: >-
      A customer may move an active gas agreement to another Beacon Ridge gas plan when the current plan's mid_term_plan_change_allowed is true.
      A plan change is made only on an active agreement.
      A mid-term change is allowed only to a plan whose term_months is equal to or longer than the current plan's term_months, except within the current plan's etf_free_window_days before contract_end_date, when any plan may be chosen; moving from a month-to-month plan to any plan with a term is always allowed.
      The new plan must satisfy the gas enrollment eligibility rules.
      The change takes effect at the start of the next billing cycle at the offer_rate of the price offer for the new plan and the premise's gas utility valid on that date, and the new term is counted from plan_change_date.
      An allowed plan change carries no early termination fee when etf_waive_on_upgrade is true, and a thermostat already shipped carries no recovery fee because the agreement continues.
      A plan change earns no sign-up credit and no renewal loyalty credit.
    eligibility:
      - id: plan_change_active
        applies_to: [gas_plan_change]
        kind: state
        condition: A plan change is made only on an active agreement.
        evidence_fields: [gas_agreements.status, gas_agreements.gas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_agreements.gas_agreement_id]
          action_bindings:
            gas_agreements.gas_agreement_id: gas_agreement_id
        state_contract:
          field: gas_agreements.status
          allowed: [active]

  - id: gas_cancellation
    subject: [gas_cancel, gas_cancel_withdraw, gas_drop_complete, gas_switch_away]
    rule: >-
      The customer cancels an active gas agreement by confirming the cancellation; the drop takes effect on the premise's next scheduled meter read date, recorded as drop_effective_date.
      A withdrawal is accepted only when the customer withdraws the cancellation before the scheduled gas drop takes effect on drop_effective_date.
      Day one is the calendar day after drop_requested_date, and the withdrawal period closes at the end of the calendar day before drop_effective_date.
      When the utility completes the drop, the agreement closes with close_reason cancelled_by_customer, or move_out when the drop_reason was move_out.
      When the utility ends supply because another supplier enrolled the premise, the agreement closes with close_reason switched_to_other_supplier; a utility move-out without a Beacon Ridge cancellation closes it with close_reason move_out.
    eligibility:
      - id: gas_withdraw_before_drop
        applies_to: [gas_cancel_withdraw]
        kind: time
        condition: A withdrawal is accepted only when the customer withdraws the cancellation before the scheduled gas drop takes effect on drop_effective_date.
        evidence_fields: [gas_agreements.drop_effective_date, gas_agreements.gas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_agreements.gas_agreement_id]
          action_bindings:
            gas_agreements.gas_agreement_id: gas_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the scheduled gas drop takes effect on drop_effective_date
          anchor_source: gas_agreements.drop_effective_date
          relation: not_after
          duration_source: params.withdrawal_cutoff_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after drop_requested_date, and the withdrawal period closes at the end of the calendar day before drop_effective_date.
          boundary: exclusive
    params:
      withdrawal_cutoff_days: 0

  - id: gas_etf
    subject: [gas_etf_charge]
    rule: >-
      Gas termination fees are assessed only once the agreement is drop_pending or closed.
      Only one early termination fee line and one thermostat recovery fee line may be billed per agreement.
      The termination date is drop_requested_date for a customer cancellation and close_date for a switch-away or utility move-out.
      etf_months_remaining is twelve times the difference in years plus the difference in months between the termination date and contract_end_date, plus one when the day of month of contract_end_date is later than the day of month of the termination date.
      Under the flat method the early termination fee is etf_flat_usd; under the per_remaining_month method it is etf_per_remaining_month_usd times etf_months_remaining, limited to etf_max_usd; under the none method no fee applies.
      No early termination fee applies when the termination date falls within etf_free_window_days calendar days before contract_end_date, equality counting as inside, or within rescission_window_days calendar days after utility_confirmation_date.
      No early termination fee applies when etf_waive_on_move is true and close_reason is move_out or the premise carries a utility_move_out_date on or before the termination date plus move_out_match_days calendar days, nor when etf_waive_assistance_program is true and the customer's assistance_program is utility_cap.
      The early termination fee is finally limited to the etf_state_cap_usd amount for the premise's service_state when that state appears in the mapping.
      Separately, when a thermostat was shipped and the termination date is no later than thermostat_recovery_months calendar months after thermostat_shipped_date, a thermostat_recovery_fee of thermostat_recovery_fee_usd is billed; it is not reduced by the free window, the state cap or the assistance waiver, and is waived on a move-out only when thermostat_recovery_waive_on_move is true.
      The two fees are additive and each is posted as its own line; a waived fee posts no line.
    eligibility:
      - id: gas_terminated_status
        applies_to: [gas_etf_charge]
        kind: state
        condition: Gas termination fees are assessed only once the agreement is drop_pending or closed.
        evidence_fields: [gas_agreements.status, gas_agreements.gas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_agreements.gas_agreement_id]
          action_bindings:
            gas_agreements.gas_agreement_id: gas_agreement_id
        state_contract:
          field: gas_agreements.status
          allowed: [drop_pending, closed]
      - id: gas_single_fee_per_type
        applies_to: [gas_etf_charge]
        kind: dedup
        condition: Only one early termination fee line and one thermostat recovery fee line may be billed per agreement.
        evidence_fields: [gas_billing.gas_agreement_id, gas_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_billing.gas_agreement_id]
          action_bindings:
            gas_billing.gas_agreement_id: gas_agreement_id
        dedup_contract:
          table: gas_billing
          mode: separate_record
          object_bindings: {gas_agreement_id: gas_agreement_id}
          duplicate_filters: {line_type: [early_termination_fee, thermostat_recovery_fee]}
          distinct_fields: [line_type]
    params:
      move_out_match_days: 30
      per_tier:
        Beacon Ridge Gas Monthly Variable: {etf_method: "=etf_method", etf_flat_usd: "=etf_flat_usd", etf_per_remaining_month_usd: "=etf_per_remaining_month_usd", etf_max_usd: "=etf_max_usd", thermostat_recovery_fee_usd: "=thermostat_recovery_fee_usd"}
        Beacon Ridge Gas Capped Variable 12: {etf_method: "=etf_method", etf_flat_usd: "=etf_flat_usd", etf_per_remaining_month_usd: "=etf_per_remaining_month_usd", etf_max_usd: "=etf_max_usd", thermostat_recovery_fee_usd: "=thermostat_recovery_fee_usd"}
        Beacon Ridge Gas Price Lock 12: {etf_method: "=etf_method", etf_flat_usd: "=etf_flat_usd", etf_per_remaining_month_usd: "=etf_per_remaining_month_usd", etf_max_usd: "=etf_max_usd", thermostat_recovery_fee_usd: "=thermostat_recovery_fee_usd"}
        Beacon Ridge Gas Price Lock 24: {etf_method: "=etf_method", etf_flat_usd: "=etf_flat_usd", etf_per_remaining_month_usd: "=etf_per_remaining_month_usd", etf_max_usd: "=etf_max_usd", thermostat_recovery_fee_usd: "=thermostat_recovery_fee_usd"}
        Beacon Ridge Gas Price Lock 36: {etf_method: "=etf_method", etf_flat_usd: "=etf_flat_usd", etf_per_remaining_month_usd: "=etf_per_remaining_month_usd", etf_max_usd: "=etf_max_usd", thermostat_recovery_fee_usd: "=thermostat_recovery_fee_usd"}
        Beacon Ridge Carbon Offset Gas 12: {etf_method: "=etf_method", etf_flat_usd: "=etf_flat_usd", etf_per_remaining_month_usd: "=etf_per_remaining_month_usd", etf_max_usd: "=etf_max_usd", thermostat_recovery_fee_usd: "=thermostat_recovery_fee_usd"}
        Beacon Ridge Carbon Offset Gas 24: {etf_method: "=etf_method", etf_flat_usd: "=etf_flat_usd", etf_per_remaining_month_usd: "=etf_per_remaining_month_usd", etf_max_usd: "=etf_max_usd", thermostat_recovery_fee_usd: "=thermostat_recovery_fee_usd"}
    formula:
      when: line_type == "early_termination_fee" and etf_method != "none"
      amount_usd: etf_flat_usd if etf_method == "flat" else min(etf_max_usd, etf_per_remaining_month_usd * etf_months_remaining)

  - id: gas_signup_credit
    subject: [gas_credit]
    rule: >-
      A gas plan with signup_credit_usd above 0.00 earns one signup_credit once the agreement's completed cycles (gas_msr_completed_cycles) reach signup_credit_after_cycles, posted on the bill of the next cycle.
      The sign-up credit may be posted only once per agreement.
      Gas bill credits are posted only while the agreement is active or drop_pending.
      When signup_credit_forfeit_on_drop is true and the agreement left active status before qualifying, the credit is forfeited.
      Plan changes, renewals and rollovers never earn a sign-up credit.
      Gas agreements carry no referral credit and no dual-fuel credit; the dual-fuel benefit on a gas agreement is the fee waiver of the gas supply billing policy.
      Credits are additive, each posted as its own line, and no credit offsets a termination fee.
    eligibility:
      - id: one_gas_signup_credit
        applies_to: [gas_credit]
        kind: dedup
        condition: The sign-up credit may be posted only once per agreement.
        evidence_fields: [gas_billing.gas_agreement_id, gas_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_billing.gas_agreement_id]
          action_bindings:
            gas_billing.gas_agreement_id: gas_agreement_id
        dedup_contract:
          table: gas_billing
          mode: separate_record
          object_bindings: {gas_agreement_id: gas_agreement_id}
          duplicate_filters: {line_type: [signup_credit]}
          distinct_fields: []
      - id: gas_credit_while_supplied
        applies_to: [gas_credit]
        kind: state
        condition: Gas bill credits are posted only while the agreement is active or drop_pending.
        evidence_fields: [gas_agreements.status, gas_agreements.gas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_agreements.gas_agreement_id]
          action_bindings:
            gas_agreements.gas_agreement_id: gas_agreement_id
        state_contract:
          field: gas_agreements.status
          allowed: [active, drop_pending]
    measures: [gas_msr_completed_cycles]

  - id: gas_billing_correction
    subject: [gas_adjustment]
    rule: >-
      When a gas supply line was billed at more than the policy allows, the over-billed amount is returned as one rebill_credit tied to that line through source_billing_id.
      The rebill credit equals the billed amount_usd minus the correctly computed amount for the same line, rounded per charge_rounding, posted as a negative amount; a fee line that should not have been billed is corrected in full.
      A gas line may be corrected only when the customer disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
      The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
      Each billed gas line may be corrected only once.
      A care agent may post a rebill credit up to agent_adjustment_limit_usd; a larger correction is opened as a gas billing dispute for review instead of being posted.
      Under-billing caused by a Beacon Ridge error is not back-billed, and therm readings measured by the utility are not corrected by Beacon Ridge.
    eligibility:
      - id: gas_dispute_lookback
        applies_to: [gas_adjustment]
        kind: time
        condition: A gas line may be corrected only when the customer disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
        evidence_fields: [gas_billing.posted_date, gas_billing.gas_billing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_billing.gas_billing_id]
          action_bindings:
            gas_billing.gas_billing_id: source_billing_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the line was posted
          anchor_source: gas_billing.posted_date
          relation: not_after
          duration_source: variants.billing_dispute_lookback_months
          unit: calendar_months
          counting_rule: The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
          boundary: inclusive
      - id: gas_one_correction_per_line
        applies_to: [gas_adjustment]
        kind: dedup
        condition: Each billed gas line may be corrected only once.
        evidence_fields: [gas_billing.source_billing_id, gas_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [gas_billing.source_billing_id]
          action_bindings:
            gas_billing.source_billing_id: source_billing_id
        dedup_contract:
          table: gas_billing
          mode: separate_record
          object_bindings: {source_billing_id: source_billing_id}
          duplicate_filters: {line_type: [rebill_credit]}
          distinct_fields: []
