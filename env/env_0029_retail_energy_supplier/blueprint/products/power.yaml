category: power
display_name: Residential Electricity Supply

binding:
  holding_table: power_agreements
  event_tables: [power_billing, power_notices]
  intake_tables: [power_billing_disputes]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [enrollment_pending, active, drop_pending, closed, rescinded, rejected]
  transitions:
    - {from: enrollment_pending, to: active, by: system, means: The utility switches the premise to Beacon Ridge supply on the scheduled meter read date and electricity begins to flow under the agreement.}
    - {from: enrollment_pending, to: rescinded, by: user, means: The customer exercises the right to rescind the enrollment before supply starts, and the enrollment request is withdrawn from the utility.}
    - {from: enrollment_pending, to: rejected, by: system, means: The utility rejects the enrollment transaction and no supply ever starts.}
    - {from: active, to: drop_pending, by: user, means: The customer confirms cancellation of the agreement and a drop is sent to the utility, effective on the next scheduled meter read.}
    - {from: drop_pending, to: active, by: user, means: The customer withdraws a cancellation before the drop takes effect and the agreement continues unchanged.}
    - {from: drop_pending, to: closed, by: system, means: The utility completes the drop on the scheduled meter read and supply under the agreement ends.}
    - {from: active, to: closed, by: system, means: The utility ends supply without a Beacon Ridge cancellation, because another supplier enrolled the premise or the customer moved out and the utility final-billed the account.}

accounts:
  - key: supply_billed
    unit: USD
    meaning: Net Beacon Ridge supply charges billed on the agreement through the utility bill; supply charges and early termination fees increase it, bill credits and rebill credits reduce it.

parameter_schema:
  rate_type: Pricing structure of the plan (string enum variable | fixed | fixed_tou).
  term_months: Length of the price-lock term in months (integer; 0 means month-to-month with no term).
  renewable_content_pct: Share of the customer's usage matched with renewable energy certificates beyond the state portfolio standard (percent, integer).
  rec_type: The kind of renewable energy certificate retired for the plan (string; "none" when the plan carries no voluntary renewable content).
  rec_retirement_statement: Whether the customer receives an annual statement of the certificates retired on their behalf (boolean).
  monthly_service_fee_usd: Flat supplier service fee billed once per billing cycle (USD, 2 decimals).
  intro_rate_cycles: Number of initial billing cycles billed at the introductory rate stored on the agreement before monthly variable pricing applies (integer; 0 means no introductory rate).
  variable_rate_notice_days: Minimum number of calendar days between the notice date of a variable rate change and its effective date (integer days).
  variable_rate_effective_basis: Which billing cycles a new variable rate applies to (string enum cycles_beginning_on_or_after_effective_date).
  tou_offpeak_window: Local clock window treated as off-peak for time-of-use pricing (string HH:MM-HH:MM; "not_applicable" for flat-rate plans).
  offpeak_rate_multiplier: Multiplier applied to the contract rate for off-peak kWh (decimal; 1.00 means off-peak usage is billed at the contract rate).
  smart_meter_required: Whether the premise must have an advanced (smart) meter delivering interval data (boolean).
  regulatory_passthrough_allowed: Whether a fixed rate may be adjusted during the term to pass through a change in law or regulation (boolean).
  regulatory_change_notice_days: Minimum number of calendar days between the notice of a regulatory pass-through and its effective date (integer days).
  etf_method: How the early termination fee is computed (string enum none | flat | per_remaining_month).
  etf_per_remaining_month_usd: Fee charged for each remaining month of the term under the per_remaining_month method (USD, 2 decimals).
  etf_flat_usd: Fee charged under the flat method (USD, 2 decimals).
  etf_max_usd: Ceiling on the early termination fee before any state cap (USD, 2 decimals).
  etf_free_window_days: Number of calendar days immediately before the contract end date during which a cancellation carries no early termination fee (integer days).
  etf_waive_on_move: Whether the fee is waived when the utility has final-billed the premise for a customer move-out (boolean).
  etf_waive_assistance_program: Whether the fee is waived for a customer enrolled in a utility customer assistance program (boolean).
  etf_waive_on_upgrade: Whether no fee applies when the customer moves mid-term to a Beacon Ridge plan with an equal or longer term (boolean).
  etf_state_cap_usd: Per-state statutory ceiling on residential early termination fees (mapping state code -> USD; states absent from the mapping impose no cap).
  rescission_window_days: Number of calendar days after the utility's enrollment confirmation date within which the customer may rescind (integer days).
  signup_credit_usd: One-time sign-up bill credit (USD, 2 decimals; 0.00 means the plan carries no sign-up credit).
  signup_credit_after_cycles: Number of completed billing cycles of continuous supply after which the sign-up credit is posted (integer cycles).
  signup_credit_forfeit_on_drop: Whether an unposted sign-up credit is forfeited when the agreement leaves active status before qualifying (boolean).
  online_enrollment_credit_usd: Additional one-time bill credit for enrollments completed through the web channel, posted together with the sign-up credit (USD, 2 decimals).
  enrollment_channels: Channels through which the plan may be enrolled (list of phone | web | mail).
  referral_credit_usd: Bill credit posted to the referring customer for each qualifying referral (USD, 2 decimals).
  referral_max_credits_per_year: Maximum number of referral credits a referring customer may receive per calendar year (integer).
  referral_qualifying_cycles: Number of completed billing cycles the referred customer's agreement must reach before the referral qualifies (integer cycles).
  referral_credit_requires_active_referrer: Whether the referring customer's agreement must be active on the posting date for the referral credit to post (boolean).
  dual_fuel_credit_usd_per_cycle: Bill credit per billing cycle when the same premise also has an active Beacon Ridge residential natural gas agreement (USD, 2 decimals).
  renewal_loyalty_credit_usd: One-time bill credit posted when the customer renews into a new term (USD, 2 decimals).
  renewal_notice_earliest_days: Earliest point, in calendar days before the contract end date, at which the initial renewal notice may be issued (integer days).
  renewal_notice_latest_days: Latest point, in calendar days before the contract end date, by which the initial renewal notice must be issued (integer days).
  final_options_notice_latest_days: Latest point, in calendar days before the contract end date, by which the final options notice must be issued (integer days).
  post_expiry_renewal_grace_days: Number of calendar days after the contract end date during which a renewal election is still honoured as a renewal (integer days).
  rollover_variant: The plan an expiring fixed agreement converts to when the customer makes no election (official plan name).
  late_notice_rate_hold_cycles: Number of billing cycles after rollover during which the expiring contract rate is held when the renewal notices were not issued on time (integer cycles).
  billing_dispute_lookback_months: How far back, in calendar months before the dispute date, a billed line may be corrected (integer months).
  agent_adjustment_limit_usd: Largest rebill credit a care agent may post on one billed line; larger corrections go to billing review (USD, 2 decimals).
  supply_charge_rounding: Rounding applied to every computed charge and credit (string enum half_up_to_cent).
  cap_customer_eligible: Whether a customer enrolled in a utility customer assistance program may enroll in the plan (boolean).
  eligible_premise_class: Premise class the plan may serve (string enum residential).
  eligible_states: States in which the plan is offered (list of state codes).
  mid_term_plan_change_allowed: Whether the customer may move to another Beacon Ridge residential electricity plan before the term ends (boolean).
  plan_change_effective_basis: When a mid-term plan change takes effect (string enum next_billing_cycle_start).
  drop_effective_basis: When a cancellation drop takes effect (string enum next_scheduled_meter_read).

