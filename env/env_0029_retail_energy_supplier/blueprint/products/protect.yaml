category: protect
display_name: Home Protection Plans

binding:
  holding_table: protect_plans
  event_tables: [protect_billing, protect_claims]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [waiting_period, active, cancelled]
  transitions:
    - {from: waiting_period, to: active, by: system, means: The waiting period ends and repair coverage begins.}
    - {from: waiting_period, to: cancelled, by: user, means: The customer cancels the plan before coverage begins.}
    - {from: active, to: cancelled, by: user, means: The customer cancels the plan.}
    - {from: cancelled, to: active, by: user, means: The customer reinstates a recently cancelled plan.}

accounts:
  - key: protect_billed
    unit: USD
    meaning: Net plan fees billed; monthly fees increase it, refunds and bundle credits reduce it.

parameter_schema:
  covered_systems: Home systems the plan covers (list of interior_electrical | exterior_electric_line | exterior_gas_line | water_heater | heating | cooling | surge_electronics).
  monthly_fee_usd: Monthly plan fee (USD, 2 decimals).
  annual_coverage_cap_usd: Most the plan pays for covered repairs in one plan year (USD, 2 decimals).
  per_claim_cap_usd: Most the plan pays for one repair (USD, 2 decimals).
  service_fee_per_visit_usd: Fee the customer pays the contractor per covered repair visit (USD, 2 decimals).
  repeat_visit_fee_waiver_days: Calendar days after a covered repair during which a return visit for the same failure carries no service fee (integer days).
  waiting_period_days: Calendar days after enrollment before coverage begins (integer days).
  claims_per_plan_year_max: Most covered repairs per plan year (integer).
  plan_year_basis: How plan years are counted (string enum anniversary_of_coverage_start_date).
  claim_filing_deadline_days: Calendar days after the failure date within which a claim must be filed (integer days).
  pre_existing_condition_excluded: Whether failures existing before coverage began are excluded (boolean).
  parts_covered: Whether parts are covered (boolean).
  labor_covered: Whether labor is covered (boolean).
  replacement_allowed: Whether an unrepairable covered unit is replaced (boolean).
  replacement_cap_usd: Most paid toward a replacement unit, within the annual cap (USD, 2 decimals).
  code_upgrade_cap_usd: Most paid for permits and code upgrades required by a covered repair (USD, 2 decimals).
  surge_electronics_cap_usd: Most paid per plan year for electronics damaged by a power surge (USD, 2 decimals).
  annual_tune_up_included: Whether a preventive tune-up is included (boolean).
  tune_ups_per_year: Number of included tune-ups per plan year (integer).
  tune_up_service_fee_waived: Whether the service fee is waived on an included tune-up (boolean).
  emergency_service_24x7: Whether emergency dispatch is available around the clock (boolean).
  response_time_hours: Target hours to schedule a technician after a covered claim is approved (integer hours).
  contractor_network: Who performs repairs (string).
  out_of_network_reimbursement: Whether repairs by outside contractors are reimbursed (boolean).
  cap_overage_handling: Who pays repair costs above a cap (string enum customer_pays_contractor_directly).
  free_look_days: Calendar days after enrollment during which a cancellation refunds all fees paid (integer days).
  cancellation_refund_basis: Refund on a cancellation after the free look (string enum no_refund_of_billed_months).
  reinstatement_window_days: Calendar days after cancellation within which the plan may be reinstated without a new waiting period (integer days).
  minimum_term_months: Minimum term (integer months; 0 means month-to-month).
  requires_beacon_ridge_supply: Whether enrolling with billing on the energy bill requires an active Beacon Ridge electricity or gas agreement at the premise (boolean).
  billing_methods: Billing methods available (list of energy_bill | direct_invoice).
  direct_invoice_autopay_required: Whether direct invoicing requires automatic payment (boolean).
  requires_gas_service: Whether the premise must have gas utility service (boolean).
  eligible_premise_class: Premise class served (string enum residential).
  eligible_states: States in which the plan is sold (list of state codes).
  excludes_other_plans: Whether holding this plan excludes holding any other protection plan at the same premise (boolean).
  bundle_min_plans: Number of protection plans active at one premise that qualifies for the bundle credit (integer).
  bundle_credit_pct: Monthly credit as a percent of each bundled plan's fee (percent, 1 decimal).
  price_lock_months: Months after enrollment during which the monthly fee cannot change (integer months).
  price_change_notice_days: Calendar days of notice before a fee change (integer days).
  transfer_on_move_allowed: Whether the plan moves to the customer's new premise (boolean).
  transfer_new_waiting_period: Whether a transferred plan restarts the waiting period (boolean).
  enrollment_channels: Channels through which the plan may be sold (list of phone | web).
  claim_payout_rounding: Rounding applied to payouts (string enum half_up_to_cent).
  billing_dispute_lookback_months: Calendar months after posting during which a fee line may be corrected (integer months).
  agent_adjustment_limit_usd: Largest refund a care agent may post (USD, 2 decimals).
  equipment_age_limit_years: Oldest equipment covered, in years since manufacture (integer years; 0 means no limit).
  max_plans_per_premise_same_type: Live plans of the same type allowed per premise (integer).

