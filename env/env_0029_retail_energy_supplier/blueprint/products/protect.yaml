events:
  - type: protect_enroll
    target: protect_plans
    mutation: create
    meaning: A homeowner enrolls one premise in a home protection plan; coverage begins after the waiting period.
    grain: One row per plan enrollment.
    fields:
      customer_id: The customer.
      premise_id: The covered premise.
      variant_name: The official plan name.
      enrollment_date: Date of enrollment.
      enrollment_channel: Channel used.
      billing_method: energy_bill or direct_invoice.
      billing_agreement_id: The Beacon Ridge electricity or gas agreement whose bill carries the fee; empty for direct invoice.
      coverage_start_date: enrollment_date plus waiting_period_days.
    triggers: []
  - type: protect_coverage_start
    target: protect_plans
    mutation: {transition: {from: waiting_period, to: active}}
    meaning: Coverage begins at the end of the waiting period.
    grain: One row per transaction.
    fields:
      coverage_start_date: The first covered day.
    triggers: []
  - type: protect_cancel
    target: protect_plans
    mutation: {transition: [{from: waiting_period, to: cancelled}, {from: active, to: cancelled}]}
    meaning: The customer cancels the plan; cancellation is effective the same day.
    grain: One row per transaction.
    fields:
      cancel_date: Date of cancellation.
    triggers: []
  - type: protect_reinstate
    target: protect_plans
    mutation: {transition: {from: cancelled, to: active}}
    meaning: The customer reinstates a recently cancelled plan without a new waiting period.
    grain: One row per transaction.
    fields:
      reinstated_date: Date of reinstatement.
      cancel_date: Cleared to empty.
    triggers: []
  - type: protect_billing_transfer
    target: protect_plans
    mutation: update
    meaning: The plan's fee moves from the energy bill to direct invoicing, or onto another Beacon Ridge energy bill.
    grain: One row per transaction.
    fields:
      billing_method: The new billing method.
      billing_agreement_id: The agreement now carrying the fee; empty for direct invoice.
    triggers: []
  - type: protect_premise_transfer
    target: protect_plans
    mutation: update
    meaning: The plan moves with the customer to a new premise.
    grain: One row per transaction.
    fields:
      premise_id: The new premise.
      transfer_date: Date of the move.
    triggers: []
  - type: protect_fee_charge
    target: protect_billing
    meaning: Beacon Ridge bills one month's plan fee.
    grain: One row per plan per billing month.
    distinguish_by: [billing_month]
    fields:
      protect_plan_id: The plan billed.
      line_type: monthly_fee.
      billing_month: First day of the month billed.
      amount_usd: Positive fee.
      posted_date: Date posted.
    account: protect_billed
    direction: in
    triggers: []
  - type: protect_refund
    target: protect_billing
    meaning: Beacon Ridge refunds plan fees on a free-look cancellation or corrects an over-billed fee.
    grain: One row per refunded or corrected fee line.
    distinguish_by: [line_type, source_billing_id]
    fields:
      protect_plan_id: The plan refunded.
      line_type: free_look_refund or rebill_credit.
      source_billing_id: The fee line refunded or corrected.
      amount_usd: Negative refund.
      posted_date: Date posted.
    account: protect_billed
    direction: out
    triggers: []
  - type: protect_bundle_credit
    target: protect_billing
    meaning: Beacon Ridge credits part of a plan's monthly fee because several plans are active at the premise.
    grain: One row per plan per billing month.
    distinguish_by: [line_type, billing_month]
    fields:
      protect_plan_id: The plan credited.
      line_type: bundle_credit.
      billing_month: The month credited.
      amount_usd: Negative credit.
      posted_date: Date posted.
    triggers: []
    account: protect_billed
    direction: out
  - type: protect_claim
    target: protect_claims
    meaning: The customer files a repair claim and Beacon Ridge records its approval or denial and the amount paid.
    grain: One row per failure of one covered system.
    distinguish_by: [covered_system, failure_date, claim_type]
    fields:
      protect_plan_id: The plan claimed under.
      covered_system: The system that failed.
      failure_date: Date the failure occurred, as diagnosed by the network contractor.
      claim_date: Date the claim was filed.
      claim_type: repair, replacement, tune_up or surge_electronics.
      equipment_manufacture_year: Manufacture year of the failed unit recorded by the contractor.
      repair_cost_usd: Contractor's cost of the covered work.
      payout_usd: Amount the plan pays.
      service_fee_usd: Service fee the customer pays the contractor.
      claim_status: Outcome of the claim.
      repeat_of_claim_id: For a return visit for the same failure, the earlier claim; empty otherwise.
    triggers: []

measures:
  - id: protect_msr_plan_year_payouts
    window: The plan year containing the failure_date, counted from an anniversary of coverage_start_date to the day before the next anniversary.
    measure: Sum of payout_usd of approved protect_claim rows on the plan in that plan year.
  - id: protect_msr_plan_year_repairs
    window: The same plan year.
    measure: Count of approved protect_claim rows on the plan with claim_type repair, replacement or surge_electronics in that plan year, excluding return visits that name repeat_of_claim_id.
  - id: protect_msr_premise_active_plans
    window: The first day of the billing month being credited.
    measure: Count of the customer's protection plans at the premise whose status is active on that day.

policies:
  - id: protect_agg_multi_holding
    subject: [protect_enroll]
    rule: >-
      A customer may hold protection plans at each premise they occupy, with no overall limit per customer.
      Only max_plans_per_premise_same_type plan of the same name may be live at one premise.
      Holding a plan whose excludes_other_plans is true changes eligibility for every other plan at that premise: while it is live no other plan may be enrolled there, and it may not be enrolled while another plan is live there, because it already covers every system.
    eligibility:
      - id: one_plan_per_type_per_premise
        applies_to: [protect_enroll]
        kind: dedup
        condition: Only max_plans_per_premise_same_type plan of the same name may be live at one premise.
        evidence_fields: [protect_plans.premise_id, protect_plans.variant_name, protect_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protect_plans.premise_id, protect_plans.variant_name]
          action_bindings:
            protect_plans.premise_id: premise_id
            protect_plans.variant_name: variant_name
        dedup_contract:
          table: protect_plans
          mode: separate_record
          object_bindings: {premise_id: premise_id, variant_name: variant_name}
          duplicate_filters: {status: [waiting_period, active]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: protect_agg_bundle
    subject: [protect_bundle_credit]
    rule: >-
      Plans at the same premise are combined for the bundle credit.
      For each billing month in which the number of the customer's active plans at the premise (protect_msr_premise_active_plans) is at least bundle_min_plans, each of those plans receives a bundle_credit equal to its monthly_fee_usd times its bundle_credit_pct divided by percent_divisor, rounded to the cent.
      Plans in waiting_period do not count, and a plan whose bundle_credit_pct is 0.0 earns none.
      One bundle credit is posted per plan per billing month.
    eligibility:
      - id: one_bundle_credit_per_month
        applies_to: [protect_bundle_credit]
        kind: dedup
        condition: One bundle credit is posted per plan per billing month.
        evidence_fields: [protect_billing.protect_plan_id, protect_billing.billing_month, protect_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protect_billing.protect_plan_id, protect_billing.billing_month]
          action_bindings:
            protect_billing.protect_plan_id: protect_plan_id
            protect_billing.billing_month: billing_month
        dedup_contract:
          table: protect_billing
          mode: separate_record
          object_bindings: {protect_plan_id: protect_plan_id, billing_month: billing_month}
          duplicate_filters: {line_type: [bundle_credit]}
          distinct_fields: []
    params:
      percent_divisor: 100
      per_tier:
        Beacon Ridge Surge Shield: {bundle_credit_pct: "=bundle_credit_pct", monthly_fee_usd: "=monthly_fee_usd"}
        Beacon Ridge Electric Line Guard: {bundle_credit_pct: "=bundle_credit_pct", monthly_fee_usd: "=monthly_fee_usd"}
        Beacon Ridge Gas Line Guard: {bundle_credit_pct: "=bundle_credit_pct", monthly_fee_usd: "=monthly_fee_usd"}
        Beacon Ridge Home Wiring Care: {bundle_credit_pct: "=bundle_credit_pct", monthly_fee_usd: "=monthly_fee_usd"}
        Beacon Ridge HVAC Repair Plan: {bundle_credit_pct: "=bundle_credit_pct", monthly_fee_usd: "=monthly_fee_usd"}
        Beacon Ridge HVAC Complete: {bundle_credit_pct: "=bundle_credit_pct", monthly_fee_usd: "=monthly_fee_usd"}
        Beacon Ridge Whole Home Shield: {bundle_credit_pct: "=bundle_credit_pct", monthly_fee_usd: "=monthly_fee_usd"}
    measures: [protect_msr_premise_active_plans]

  - id: protect_eligibility
    subject: [protect_enroll]
    rule: >-
      A plan may be enrolled only for a residential premise of the customer in one of the plan's eligible_states.
      The protected premise must be residential.
      A plan whose requires_gas_service is true needs a premise whose gas_utility is not none.
      Holding a Beacon Ridge energy agreement changes how a plan may be billed: billing_method energy_bill requires a Beacon Ridge residential electricity or gas agreement at the same premise in active status, named as billing_agreement_id; otherwise the plan is billed by direct_invoice, which requires automatic payment when direct_invoice_autopay_required is true.
      The plan's coverage_start_date is enrollment_date plus waiting_period_days calendar days.
    eligibility:
      - id: residential_protect_premise
        applies_to: [protect_enroll]
        kind: state
        condition: The protected premise must be residential.
        evidence_fields: [premises.premise_class, premises.premise_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [premises.premise_id]
          action_bindings:
            premises.premise_id: premise_id
        state_contract:
          field: premises.premise_class
          allowed: [residential]

  - id: protect_waiting_period
    subject: [protect_coverage_start]
    rule: >-
      Coverage begins on coverage_start_date, the enrollment_date plus waiting_period_days calendar days, when the plan moves from waiting_period to active.
      A reinstated plan does not restart the waiting period, and a plan transferred to a new premise restarts it only when transfer_new_waiting_period is true.
    eligibility: []

  - id: protect_claim_coverage
    subject: [protect_claim]
    rule: >-
      A claim is approved only for a covered system of the plan whose failure_date is on or after coverage_start_date.
      Claims are approved only while the plan is active.
      A claim is accepted only when the customer files it no later than claim_filing_deadline_days calendar days after the failure occurred.
      Day one is the calendar day after failure_date, and the filing window closes at the end of the calendar day equal to failure_date plus claim_filing_deadline_days.
      A failure dated before coverage_start_date is denied as denied_waiting_period, a condition the contractor finds pre-existing is denied as denied_pre_existing when pre_existing_condition_excluded is true, equipment older than equipment_age_limit_years at the failure date is denied as denied_not_covered when the limit is above 0, and a claim after the plan year's repair count reached claims_per_plan_year_max (protect_msr_plan_year_repairs) is denied as denied_cap_reached.
      For an approved repair the payout is the repair cost limited by per_claim_cap_usd and by annual_coverage_cap_usd minus the plan-year payouts so far (protect_msr_plan_year_payouts); replacement is paid only when replacement_allowed is true and up to replacement_cap_usd, surge damage to electronics up to surge_electronics_cap_usd, and permits and code upgrades up to code_upgrade_cap_usd within the same caps.
      The customer pays service_fee_per_visit_usd to the contractor per visit, except on an included tune-up when tune_up_service_fee_waived is true and on a return visit for the same failure within repeat_visit_fee_waiver_days of the earlier claim; costs above a cap are paid by the customer to the contractor per cap_overage_handling.
      Repairs by contractors outside the network are not reimbursed when out_of_network_reimbursement is false.
    eligibility:
      - id: claim_plan_active
        applies_to: [protect_claim]
        kind: state
        condition: Claims are approved only while the plan is active.
        evidence_fields: [protect_plans.status, protect_plans.protect_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protect_plans.protect_plan_id]
          action_bindings:
            protect_plans.protect_plan_id: protect_plan_id
        state_contract:
          field: protect_plans.status
          allowed: [active]
      - id: claim_filing_deadline
        applies_to: [protect_claim]
        kind: time
        condition: A claim is accepted only when the customer files it no later than claim_filing_deadline_days calendar days after the failure occurred.
        evidence_fields: [protect_claims.failure_date, protect_claims.protect_claim_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [protect_claims.protect_claim_id]
          action_bindings:
            protect_claims.protect_claim_id: protect_claim_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the failure occurred
          anchor_source: protect_claims.failure_date
          relation: not_after
          duration_source: variants.claim_filing_deadline_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after failure_date, and the filing window closes at the end of the calendar day equal to failure_date plus claim_filing_deadline_days.
          boundary: inclusive
    formula:
      when: claim_status == "approved"
      payout_usd: min(repair_cost_usd, per_claim_cap_usd, annual_coverage_cap_usd - protect_msr_plan_year_payouts)
    measures: [protect_msr_plan_year_payouts, protect_msr_plan_year_repairs]

  - id: protect_fee_billing
    subject: [protect_fee_charge]
    rule: >-
      The monthly fee is billed for every month starting with the month of enrollment_date, including months of the waiting period, through the month of cancellation.
      Plan fees are billed only while the plan is in waiting_period or active.
      The fee billed is the plan's monthly_fee_usd and cannot change during the first price_lock_months months; any later change requires price_change_notice_days of notice.
      A plan billed on the energy bill appears on the named agreement's bill; a plan billed by direct invoice appears on its own invoice.
    eligibility:
      - id: protect_billable_status
        applies_to: [protect_fee_charge]
        kind: state
        condition: Plan fees are billed only while the plan is in waiting_period or active.
        evidence_fields: [protect_plans.status, protect_plans.protect_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protect_plans.protect_plan_id]
          action_bindings:
            protect_plans.protect_plan_id: protect_plan_id
        state_contract:
          field: protect_plans.status
          allowed: [waiting_period, active]

  - id: protect_cancellation_refund
    subject: [protect_cancel, protect_refund]
    rule: >-
      A customer may cancel at any time with no cancellation fee when minimum_term_months is 0; cancellation is effective on cancel_date.
      When the cancel_date is no later than free_look_days calendar days after enrollment_date and no claim has been paid, every fee line billed on the plan is refunded with one free_look_refund each.
      Otherwise no billed month is refunded, per cancellation_refund_basis.
      Each fee line is refunded or corrected only once.
      An over-billed fee line is corrected with one rebill_credit when the customer disputes it within billing_dispute_lookback_months calendar months of posting; a care agent may post refunds up to agent_adjustment_limit_usd per line.
    eligibility:
      - id: refund_once_per_line
        applies_to: [protect_refund]
        kind: dedup
        condition: Each fee line is refunded or corrected only once.
        evidence_fields: [protect_billing.source_billing_id, protect_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protect_billing.source_billing_id]
          action_bindings:
            protect_billing.source_billing_id: source_billing_id
        dedup_contract:
          table: protect_billing
          mode: separate_record
          object_bindings: {source_billing_id: source_billing_id}
          duplicate_filters: {line_type: [free_look_refund, rebill_credit]}
          distinct_fields: []

  - id: protect_reinstatement
    subject: [protect_reinstate]
    rule: >-
      A cancelled plan may be reinstated on its existing terms without a new waiting period.
      Reinstatement is accepted only when the customer asks to reinstate no later than reinstatement_window_days calendar days after the plan was cancelled.
      Day one is the calendar day after cancel_date, and the window closes at the end of the calendar day equal to cancel_date plus reinstatement_window_days.
      Failures dated between cancel_date and reinstated_date are not covered, and months skipped while cancelled are not billed.
    eligibility:
      - id: reinstatement_window
        applies_to: [protect_reinstate]
        kind: time
        condition: Reinstatement is accepted only when the customer asks to reinstate no later than reinstatement_window_days calendar days after the plan was cancelled.
        evidence_fields: [protect_plans.cancel_date, protect_plans.protect_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protect_plans.protect_plan_id]
          action_bindings:
            protect_plans.protect_plan_id: protect_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the plan was cancelled
          anchor_source: protect_plans.cancel_date
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after cancel_date, and the window closes at the end of the calendar day equal to cancel_date plus reinstatement_window_days.
          boundary: inclusive

  - id: protect_billing_transfer_terms
    subject: [protect_billing_transfer]
    rule: >-
      When the Beacon Ridge electricity or gas agreement named as billing_agreement_id closes, the plan is not cancelled; its fee moves to another active Beacon Ridge residential energy agreement at the same premise when one exists, otherwise to direct_invoice.
      A customer may also ask to move billing between those methods at any time, subject to the same requirements as at enrollment.
      Coverage, waiting period and plan year are unaffected by a billing change.
    eligibility: []

  - id: protect_premise_transfer_terms
    subject: [protect_premise_transfer]
    rule: >-
      When the customer moves, a plan whose transfer_on_move_allowed is true moves to the new residential premise, which must meet the plan's eligibility, including gas service for a gas line plan.
      A premise transfer is made only on an active plan or one in waiting_period.
      The plan year continues, and the waiting period restarts only when transfer_new_waiting_period is true.
    eligibility:
      - id: transfer_live_plan
        applies_to: [protect_premise_transfer]
        kind: state
        condition: A premise transfer is made only on an active plan or one in waiting_period.
        evidence_fields: [protect_plans.status, protect_plans.protect_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [protect_plans.protect_plan_id]
          action_bindings:
            protect_plans.protect_plan_id: protect_plan_id
        state_contract:
          field: protect_plans.status
          allowed: [waiting_period, active]
