category: solar
display_name: Community Solar Subscriptions

binding:
  holding_table: solar_subscriptions
  event_tables: [solar_billing]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [waitlisted, active, cancellation_pending, closed, withdrawn]
  transitions:
    - {from: waitlisted, to: active, by: system, means: Project capacity is allocated to the subscriber and the utility begins applying solar bill credits to the subscriber's utility account.}
    - {from: waitlisted, to: withdrawn, by: user, means: The customer leaves the waitlist before any capacity is allocated.}
    - {from: active, to: cancellation_pending, by: user, means: The customer gives notice to cancel the subscription.}
    - {from: cancellation_pending, to: closed, by: system, means: The allocation is removed from the utility's subscriber list at the end of the notice period.}
    - {from: active, to: closed, by: system, means: The subscription ends because the utility closed the subscriber's account with no transfer.}

accounts:
  - key: solar_subscription_billed
    unit: USD
    meaning: Net amount Beacon Ridge has invoiced the subscriber; subscription fees and cancellation fees increase it, savings true-ups, bill credits and rebill credits reduce it.

parameter_schema:
  term_months: Subscription term in months (integer; 0 means no term).
  discount_pct: Guaranteed discount off the value of the utility solar bill credits (percent, 1 decimal).
  subscription_fee_basis: How the monthly subscription fee is computed (string enum bill_credit_x_100_minus_discount_div_100).
  billing_lag_cycles: Number of utility billing cycles between the cycle whose credit is applied and the Beacon Ridge invoice (integer cycles).
  savings_guarantee: Whether Beacon Ridge guarantees that annual fees never exceed the annual credits times (100 minus discount_pct) percent (boolean).
  savings_true_up_frequency: How often the savings guarantee is checked (string enum annual_on_allocation_anniversary).
  savings_true_up_method: How a guarantee shortfall is returned (string enum invoice_credit).
  min_subscribed_kw: Smallest subscription size (kW-DC, 1 decimal).
  max_subscribed_kw: Largest subscription size for one premise (kW-DC, 1 decimal).
  max_sizing_pct_of_usage: Largest share of the premise's annual usage the subscription's expected production may cover (percent, integer).
  kwh_per_kw_year: Expected annual production per kW-DC used for sizing (integer kWh).
  eligible_states: States with a community solar program in which the plan is offered (list of state codes).
  eligible_premise_class: Premise class served (string enum residential).
  income_verification_required: Whether the subscriber must be income-qualified (boolean).
  assistance_program_qualifies: Whether utility customer assistance program enrollment satisfies income qualification (boolean).
  enrollment_channels: Channels through which a subscription may be started (list of phone | web).
  waitlist_basis: Order in which waitlisted subscribers receive capacity (string enum first_come_first_served_by_subscribe_date).
  free_look_days: Calendar days after allocation_date during which the subscriber may cancel without any fee (integer days).
  cancellation_notice_days: Calendar days of notice before a cancellation takes effect (integer days).
  cancellation_effective_basis: How the cancellation date is fixed (string enum notice_date_plus_notice_days).
  cancellation_fee_usd: Fee for cancelling before term_end_date outside the free look (USD, 2 decimals).
  cancellation_fee_waive_on_move_out_of_utility: Whether the fee is waived when the subscriber moves out of the utility's territory (boolean).
  move_transfer_same_utility: Whether a subscription moves with the subscriber to a new premise of the same utility (boolean).
  size_change_allowed: Whether the subscribed size may be changed during the term (boolean).
  size_changes_per_year: Maximum size changes per allocation year (integer).
  size_change_effective_basis: When a size change takes effect (string enum first_billing_cycle_after_change_date).
  signup_credit_usd: One-time invoice credit after allocation (USD, 2 decimals).
  signup_credit_after_cycles: Billed subscription cycles after which the sign-up credit posts (integer cycles).
  referral_credit_usd: Invoice credit per referred household that is allocated (USD, 2 decimals).
  referral_max_per_year: Maximum referral credits per customer per calendar year across all subscriptions (integer).
  rec_ownership: Who owns the renewable energy certificates of the project (string enum project_owner_retains).
  production_shortfall_compensation: Whether low project production is compensated beyond the discount (boolean).
  credit_bank_handling: Treatment of utility credits that exceed the utility bill (string enum utility_carries_forward).
  annual_savings_report: Whether the subscriber receives an annual savings report (boolean).
  late_fee_pct: Monthly late fee on a past-due subscription invoice (percent, 1 decimal).
  late_fee_grace_days: Calendar days after the invoice due date before a late fee applies (integer days).
  autopay_required: Whether automatic payment is required (boolean).
  invoice_due_days: Calendar days from invoice date to due date (integer days).
  term_end_handling: What happens at term end (string enum continues_as_flex).
  renewal_notice_days: Calendar days before term end by which the term-end notice is sent (integer days).
  contract_assignment_allowed: Whether the subscription may be assigned to the next occupant of the premise (boolean).
  billing_dispute_lookback_months: Calendar months after posting during which an invoice line may be corrected (integer months).
  agent_adjustment_limit_usd: Largest rebill credit a care agent may post on one line (USD, 2 decimals).
  charge_rounding: Rounding applied to fees and credits (string enum half_up_to_cent).
  max_subscriptions_per_premise: Live subscriptions allowed per premise (integer).
  escalator_pct: Annual escalation of the discount (percent, 1 decimal).
  minimum_monthly_fee_usd: Minimum subscription fee per cycle (USD, 2 decimals).
  project_assignment_basis: How a project is chosen (string enum nearest_open_project_in_utility).

