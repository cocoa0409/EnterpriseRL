events:
  - type: solar_subscribe
    target: solar_subscriptions
    mutation: create
    meaning: A household subscribes to a share of a community solar project and joins the project's waitlist.
    grain: One row per subscription request for one premise.
    fields:
      customer_id: The subscriber.
      premise_id: The premise whose utility account will receive the solar credits.
      variant_name: The official name of the subscription plan.
      project_name: The project assigned.
      subscribed_kw: Subscription size in kW-DC.
      subscribe_date: Date the subscription was requested.
      enrollment_channel: Channel used.
      referred_by_customer_id: Customer number of a referring subscriber; empty when none.
    triggers: []
  - type: solar_allocate
    target: solar_subscriptions
    mutation: {transition: {from: waitlisted, to: active}}
    meaning: Capacity is allocated and the utility starts applying credits.
    grain: One row per transaction.
    fields:
      allocation_date: Date the utility accepted the allocation.
      term_end_date: Last day of the term; empty for a plan without a term.
    triggers: []
  - type: solar_withdraw
    target: solar_subscriptions
    mutation: {transition: {from: waitlisted, to: withdrawn}}
    meaning: The customer leaves the waitlist.
    grain: One row per transaction.
    fields:
      withdrawn_date: Date the customer withdrew.
    triggers: []
  - type: solar_cancel
    target: solar_subscriptions
    mutation: {transition: {from: active, to: cancellation_pending}}
    meaning: The subscriber gives notice to cancel.
    grain: One row per transaction.
    fields:
      cancellation_notice_date: Date notice was given.
      cancellation_effective_date: Notice date plus cancellation_notice_days.
    triggers: []
  - type: solar_cancel_complete
    target: solar_subscriptions
    mutation: {transition: {from: cancellation_pending, to: closed}}
    meaning: The allocation is removed at the end of the notice period.
    grain: One row per transaction.
    fields:
      close_date: The cancellation effective date.
      close_reason: Set to cancelled_by_subscriber.
    triggers: []
  - type: solar_account_close
    target: solar_subscriptions
    mutation: {transition: {from: active, to: closed}}
    meaning: The utility closes the subscriber's account without a transfer and the allocation ends.
    grain: One row per transaction.
    fields:
      close_date: Date the utility account closed.
      close_reason: Set to utility_account_closed.
    triggers: []
  - type: solar_size_change
    target: solar_subscriptions
    mutation: update
    meaning: The subscriber changes the subscribed size.
    grain: One row per transaction.
    fields:
      subscribed_kw: New size in kW-DC.
      size_change_date: Date the change was requested.
    triggers: []
  - type: solar_transfer
    target: solar_subscriptions
    mutation: update
    meaning: The subscription moves with the subscriber to a new premise of the same utility.
    grain: One row per transaction.
    fields:
      premise_id: The new premise.
      transfer_date: Date the utility moved the allocation.
    triggers: []
  - type: solar_fee_charge
    target: solar_billing
    meaning: Beacon Ridge invoices the subscription fee for the credits the utility applied in one billing cycle.
    grain: One row per credited utility billing cycle.
    distinguish_by: [billing_period_start]
    fields:
      solar_subscription_id: The subscription invoiced.
      line_type: subscription_fee.
      billing_period_start: First day of the utility cycle whose credit is invoiced.
      bill_credit_usd: Value of the solar credit the utility applied in that cycle.
      discount_pct_applied: The discount used.
      amount_usd: Positive fee.
      posted_date: Invoice date.
    account: solar_subscription_billed
    direction: in
    triggers: []
  - type: solar_cancellation_fee
    target: solar_billing
    meaning: Beacon Ridge invoices the cancellation fee for leaving before the term ends.
    grain: One row per cancellation.
    distinguish_by: [line_type, posted_date]
    fields:
      solar_subscription_id: The subscription cancelled.
      line_type: cancellation_fee.
      amount_usd: Positive fee.
      posted_date: Invoice date.
    account: solar_subscription_billed
    direction: in
    triggers: []
  - type: solar_true_up
    target: solar_billing
    meaning: Beacon Ridge credits the shortfall when an allocation year's fees exceeded the guaranteed savings.
    grain: One row per allocation year.
    distinguish_by: [true_up_year_start]
    fields:
      solar_subscription_id: The subscription trued up.
      line_type: savings_true_up.
      true_up_year_start: First day of the allocation year checked.
      amount_usd: Negative credit.
      posted_date: Invoice date.
    account: solar_subscription_billed
    direction: out
    triggers: []
  - type: solar_credit
    target: solar_billing
    meaning: Beacon Ridge posts a sign-up or referral invoice credit.
    grain: One row per credit type per referred customer.
    distinguish_by: [line_type, referred_customer_id]
    fields:
      solar_subscription_id: The subscription credited.
      line_type: signup_credit or referral_credit.
      referred_customer_id: For a referral credit, the referred subscriber; empty otherwise.
      amount_usd: Negative credit.
      posted_date: Invoice date.
    account: solar_subscription_billed
    direction: out
    triggers: []
  - type: solar_adjustment
    target: solar_billing
    meaning: Beacon Ridge corrects an over-invoiced subscription line.
    grain: One row per corrected original line.
    distinguish_by: [source_billing_id, posted_date]
    fields:
      solar_subscription_id: The subscription corrected.
      line_type: rebill_credit.
      source_billing_id: The line corrected.
      amount_usd: Negative credit equal to the over-invoiced amount.
      posted_date: Date posted.
    account: solar_subscription_billed
    direction: out
    triggers: []

measures:
  - id: solar_msr_billed_cycles
    window: From allocation_date up to the frozen handling date.
    measure: Count of solar_fee_charge rows on the subscription.
  - id: solar_msr_referrals_ytd
    window: The calendar year containing the posting date being considered.
    measure: Count of solar_credit rows with line_type referral_credit across all of the referring customer's subscriptions.
  - id: solar_msr_size_changes_year
    window: The allocation year (from an anniversary of allocation_date up to the day before the next anniversary) containing the frozen handling date.
    measure: 1 when the subscription's size_change_date falls within that allocation year, otherwise 0.
  - id: solar_msr_allocation_year_totals
    window: One allocation year, from an anniversary of allocation_date through the day before the next anniversary, by billing_period_start.
    measure: Sum of bill_credit_usd and sum of amount_usd of the solar_fee_charge rows in that year.

policies:
  - id: solar_agg_multi_holding
    subject: [solar_subscribe]
    rule: >-
      A customer may hold up to max_per_customer community solar subscriptions, each for a different premise.
      A subscription counts while waitlisted, active or cancellation_pending.
      Only max_subscriptions_per_premise live subscription may exist for one premise.
    eligibility:
      - id: one_subscription_per_premise
        applies_to: [solar_subscribe]
        kind: dedup
        condition: Only max_subscriptions_per_premise live subscription may exist for one premise.
        evidence_fields: [solar_subscriptions.premise_id, solar_subscriptions.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [solar_subscriptions.premise_id]
          action_bindings:
            solar_subscriptions.premise_id: premise_id
        dedup_contract:
          table: solar_subscriptions
          mode: separate_record
          object_bindings: {premise_id: premise_id}
          duplicate_filters: {status: [waitlisted, active, cancellation_pending]}
          distinct_fields: []
    params:
      max_per_customer: 3

  - id: solar_agg_referrals
    subject: [solar_credit]
    rule: >-
      Referral credits are combined across all of a customer's subscriptions.
      A referral credit of referral_credit_usd is posted on the referring customer's earliest-allocated active subscription when the referred household's subscription, which names the referrer, is allocated.
      A referring customer receives no more than referral_max_per_year referral credits in a calendar year (solar_msr_referrals_ytd); a plan with referral_credit_usd 0.00 earns none.
      Each referred household earns one referral credit only.
    eligibility:
      - id: one_solar_referral_per_household
        applies_to: [solar_credit]
        kind: dedup
        condition: Each referred household earns one referral credit only.
        evidence_fields: [solar_billing.referred_customer_id, solar_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [solar_billing.referred_customer_id]
          action_bindings:
            solar_billing.referred_customer_id: referred_customer_id
        dedup_contract:
          table: solar_billing
          mode: separate_record
          object_bindings: {referred_customer_id: referred_customer_id}
          duplicate_filters: {line_type: [referral_credit]}
          distinct_fields: []
    measures: [solar_msr_referrals_ytd]

  - id: solar_eligibility
    subject: [solar_subscribe]
    rule: >-
      A subscription is accepted only for a residential premise in one of the plan's eligible_states whose electric utility runs a community solar program.
      The solar premise must be residential.
      On a plan whose income_verification_required is true, the household qualifies when its assistance_program is utility_cap and assistance_program_qualifies is true; other income documentation is reviewed outside the care desk.
      Subscribing does not transfer renewable attributes: the project owner retains the certificates per rec_ownership, so a subscriber may not claim to use renewable electricity.
      A community solar subscription does not change who supplies the premise's electricity and may be held together with any Beacon Ridge or other supplier's electricity plan.
    eligibility:
      - id: residential_solar_premise
        applies_to: [solar_subscribe]
        kind: state
        condition: The solar premise must be residential.
        evidence_fields: [premises.premise_class, premises.premise_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [premises.premise_id]
          action_bindings:
            premises.premise_id: premise_id
        state_contract:
          field: premises.premise_class
          allowed: [residential]

  - id: solar_sizing
    subject: [solar_subscribe, solar_size_change]
    rule: >-
      subscribed_kw must be between min_subscribed_kw and max_subscribed_kw.
      subscribed_kw times kwh_per_kw_year may not exceed the premise's annual_kwh_usage times max_sizing_pct_of_usage divided by percent_divisor; a request above that is reduced to the largest size, in steps of 0.1 kW, that meets it.
      A size change is allowed only on an active subscription, only when size_change_allowed is true, and only while the size changes in the current allocation year (solar_msr_size_changes_year) are below size_changes_per_year; it takes effect per size_change_effective_basis.
    eligibility:
      - id: size_change_active
        applies_to: [solar_size_change]
        kind: state
        condition: A size change is allowed only on an active subscription, only when size_change_allowed is true, and only while the size changes in the current allocation year (solar_msr_size_changes_year) are below size_changes_per_year; it takes effect per size_change_effective_basis.
        evidence_fields: [solar_subscriptions.status, solar_subscriptions.solar_subscription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [solar_subscriptions.solar_subscription_id]
          action_bindings:
            solar_subscriptions.solar_subscription_id: solar_subscription_id
        state_contract:
          field: solar_subscriptions.status
          allowed: [active]
    params:
      percent_divisor: 100
    measures: [solar_msr_size_changes_year]

  - id: solar_allocation
    subject: [solar_allocate, solar_withdraw]
    rule: >-
      Waitlisted subscriptions receive project capacity in the order of waitlist_basis; a subscription cannot be moved ahead of earlier subscribers by request.
      On allocation the term begins on allocation_date and term_end_date is the day before the same calendar day term_months months later, using the last day of the month when that day does not exist; plans without a term have an empty term_end_date.
      A waitlisted customer may withdraw at any time without any fee.
    eligibility: []

  - id: solar_fee_billing
    subject: [solar_fee_charge]
    rule: >-
      For each utility cycle in which the utility applied a solar credit, Beacon Ridge invoices one subscription fee billing_lag_cycles cycle later.
      Subscription fees are invoiced only while the subscription is active, cancellation_pending or closed.
      The fee equals bill_credit_usd times (100 minus discount_pct) divided by 100, rounded per charge_rounding, and is never below minimum_monthly_fee_usd.
      On plans with escalator_pct above 0.0 the discount used rises by escalator_pct on each allocation anniversary.
      Credits the utility carries forward on its own bill do not change the fee, and low project production is not compensated when production_shortfall_compensation is false.
    eligibility:
      - id: solar_billable_status
        applies_to: [solar_fee_charge]
        kind: state
        condition: Subscription fees are invoiced only while the subscription is active, cancellation_pending or closed.
        evidence_fields: [solar_subscriptions.status, solar_subscriptions.solar_subscription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [solar_subscriptions.solar_subscription_id]
          action_bindings:
            solar_subscriptions.solar_subscription_id: solar_subscription_id
        state_contract:
          field: solar_subscriptions.status
          allowed: [active, cancellation_pending, closed]
    params:
      per_tier:
        Beacon Ridge Solar Share Flex: {discount_pct: "=discount_pct"}
        Beacon Ridge Solar Share 1-Year: {discount_pct: "=discount_pct"}
        Beacon Ridge Solar Share 5-Year: {discount_pct: "=discount_pct"}
        Beacon Ridge Solar Share 10-Year: {discount_pct: "=discount_pct"}
        Beacon Ridge Solar Share 20-Year: {discount_pct: "=discount_pct"}
        Beacon Ridge Solar Share Income-Eligible: {discount_pct: "=discount_pct"}
      percent_divisor: 100
    formula:
      amount_usd: max(minimum_monthly_fee_usd, round(bill_credit_usd * (percent_divisor - discount_pct_applied) / percent_divisor, 2))

  - id: solar_savings_guarantee
    subject: [solar_true_up]
    rule: >-
      When savings_guarantee is true, at each allocation anniversary the fees of the ending allocation year are compared with that year's credits (solar_msr_allocation_year_totals).
      When the fees exceed the credits times (100 minus discount_pct) divided by 100, the difference is credited once as a savings_true_up per savings_true_up_method.
      Each allocation year is trued up only once.
    eligibility:
      - id: one_true_up_per_year
        applies_to: [solar_true_up]
        kind: dedup
        condition: Each allocation year is trued up only once.
        evidence_fields: [solar_billing.solar_subscription_id, solar_billing.true_up_year_start]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [solar_billing.solar_subscription_id, solar_billing.true_up_year_start]
          action_bindings:
            solar_billing.solar_subscription_id: solar_subscription_id
            solar_billing.true_up_year_start: true_up_year_start
        dedup_contract:
          table: solar_billing
          mode: separate_record
          object_bindings: {solar_subscription_id: solar_subscription_id, true_up_year_start: true_up_year_start}
          duplicate_filters: {line_type: [savings_true_up]}
          distinct_fields: []
    measures: [solar_msr_allocation_year_totals]

  - id: solar_cancellation_terms
    subject: [solar_cancel, solar_cancel_complete, solar_account_close, solar_cancellation_fee]
    rule: >-
      A subscriber cancels by giving notice; the allocation ends on the notice date plus cancellation_notice_days, recorded as cancellation_effective_date.
      A cancellation fee is invoiced only once the subscription is cancellation_pending or closed.
      A cancellation fee of cancellation_fee_usd applies when the notice is given before term_end_date, except when the notice is given no later than free_look_days calendar days after allocation_date, or when cancellation_fee_waive_on_move_out_of_utility is true and the premise carries a utility_move_out_date and the subscriber has no premise in the same utility to transfer to.
      A subscription closed by the utility because the account closed with no transfer carries the same fee rules, with the close date in place of the notice date.
      After term_end_date the subscription continues on Flex terms per term_end_handling and can be cancelled without a fee.
    eligibility:
      - id: solar_fee_after_notice
        applies_to: [solar_cancellation_fee]
        kind: state
        condition: A cancellation fee is invoiced only once the subscription is cancellation_pending or closed.
        evidence_fields: [solar_subscriptions.status, solar_subscriptions.solar_subscription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [solar_subscriptions.solar_subscription_id]
          action_bindings:
            solar_subscriptions.solar_subscription_id: solar_subscription_id
        state_contract:
          field: solar_subscriptions.status
          allowed: [cancellation_pending, closed]

  - id: solar_transfer_terms
    subject: [solar_transfer]
    rule: >-
      When the subscriber moves to another premise served by the same electric utility and move_transfer_same_utility is true, the subscription moves to the new premise without a fee and keeps its term and size, reduced if needed to meet the sizing limit of the new premise.
      A transfer is made only on an active subscription.
      A move to a different utility cannot be transferred; the subscriber cancels, and the cancellation fee rules decide the fee.
    eligibility:
      - id: solar_transfer_active
        applies_to: [solar_transfer]
        kind: state
        condition: A transfer is made only on an active subscription.
        evidence_fields: [solar_subscriptions.status, solar_subscriptions.solar_subscription_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [solar_subscriptions.solar_subscription_id]
          action_bindings:
            solar_subscriptions.solar_subscription_id: solar_subscription_id
        state_contract:
          field: solar_subscriptions.status
          allowed: [active]

  - id: solar_signup_credit
    subject: [solar_credit]
    rule: >-
      A plan with signup_credit_usd above 0.00 earns one signup_credit once solar_msr_billed_cycles reaches signup_credit_after_cycles.
      The solar sign-up credit is posted only once per subscription.
      Credits are posted as their own lines and do not reduce a cancellation fee.
    eligibility:
      - id: one_solar_signup_credit
        applies_to: [solar_credit]
        kind: dedup
        condition: The solar sign-up credit is posted only once per subscription.
        evidence_fields: [solar_billing.solar_subscription_id, solar_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [solar_billing.solar_subscription_id]
          action_bindings:
            solar_billing.solar_subscription_id: solar_subscription_id
        dedup_contract:
          table: solar_billing
          mode: separate_record
          object_bindings: {solar_subscription_id: solar_subscription_id}
          duplicate_filters: {line_type: [signup_credit]}
          distinct_fields: []
    measures: [solar_msr_billed_cycles]

  - id: solar_billing_correction
    subject: [solar_adjustment]
    rule: >-
      An over-invoiced subscription line is corrected by one rebill_credit tied to it through source_billing_id, equal to the invoiced amount minus the correct amount.
      A solar line may be corrected only when the subscriber disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
      The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
      A care agent may post up to agent_adjustment_limit_usd per line; larger corrections and disputes about the credit value the utility applied are outside care-desk authority.
    eligibility:
      - id: solar_dispute_lookback
        applies_to: [solar_adjustment]
        kind: time
        condition: A solar line may be corrected only when the subscriber disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
        evidence_fields: [solar_billing.posted_date, solar_billing.solar_billing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [solar_billing.solar_billing_id]
          action_bindings:
            solar_billing.solar_billing_id: source_billing_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the line was posted
          anchor_source: solar_billing.posted_date
          relation: not_after
          duration_source: variants.billing_dispute_lookback_months
          unit: calendar_months
          counting_rule: The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
          boundary: inclusive
