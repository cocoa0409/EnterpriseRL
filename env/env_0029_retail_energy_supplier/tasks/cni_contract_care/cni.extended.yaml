        - {table: cni_billing, aggregate: sum, field: amount_usd, filters: {line_type: block_energy_charge}}
        - {table: cni_billing, aggregate: sum, field: usage_kwh, filters: {event_type: cni_supply_charge}}
        - {table: cni_billing, aggregate: count, field: line_type, within_months: 12, filters: {line_type: rebill_credit}}
