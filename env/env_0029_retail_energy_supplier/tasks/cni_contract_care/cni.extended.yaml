  - id: cni_ext_contract_exit_damages
    base_policy_refs: [cni_etf, cni_termination]
    overwrite:
      - base_policy: cni_etf
        superseded_clause: >-
          etf_remaining_kwh is the facility's annual_kwh_usage times the remaining months divided by months_per_year, rounded half up to a whole kWh, and the fee is etf_remaining_kwh times etf_rate_usd_per_kwh, rounded per charge_rounding, but not less than etf_minimum_usd.
        replaced_by: >-
          The exit annual kWh are the kWh posted on the contract's supply lines in the twelve months before the handling date.
    trigger: state_due
    subject: [cni_etf_charge]
    computes: amount_usd
    target_tool: bill_contract_exit_damages_2ce88247
    params:
      months_per_year: 12
      two_years_months: 24
      days_per_year: 365
      full_history_cycles: 12
      final_bill_share: 0.85
      switch_share: 1.05
      exit_short_share: 0.75
      exit_mid_share: 0.90
      unannounced_share: 1.10
      short_notice_share: 1.05
      hours_per_year: 8760
      high_exit_lf: 0.65
      mid_exit_lf: 0.45
      high_exit_lf_share: 0.92
      mid_exit_lf_share: 0.96
      exit_tenure_long: 24
      exit_tenure_mid: 12
      exit_tenure_long_share: 0.90
      exit_tenure_mid_share: 0.95
    rule: >-
      Liquidated damages on a contract exit are billed on a contract that closed during its term because another supplier enrolled the facility or the utility final-billed it, meaning close_reason switched_to_other_supplier or final_billed with close_date before contract_end_date, as one early termination fee line per contract.
      The damages of a contract exit are its exit kWh times its exit damages rate, rounded half up to the cent only at that step, but not less than etf_minimum_usd.
      The exit kWh of a contract exit are its exit annual kWh times its exit months divided by months_per_year, rounded half up to a whole kWh, and that figure is billed as etf_remaining_kwh.
      The exit annual kWh are the kWh posted on the contract's supply lines in the twelve months before the handling date.
      The exit months are twelve times the difference in years plus the difference in months between close_date and contract_end_date, plus one when the day of month of contract_end_date is later than the day of month of close_date.
      The exit damages rate is the structure's etf_rate_usd_per_kwh.
      The exit annual kWh depend on how many billed cycles were posted in the twelve months before the handling date, each cycle counted once by its energy_charge line, by its block_energy_charge line on a block and index contract, or otherwise by its index_energy_charge line: one to eleven such cycles give the window's kWh divided by the billing_days of the counted cycles, times days_per_year; no cycle in the window gives the kWh of the most recently posted cycle times months_per_year; twelve or more give the window's kWh.
      The exit damages rate is scaled by the exit reason once the cycle that ends on close_date has been posted: a final bill (close_reason final_billed) with that cycle posted scales it by final_bill_share, another supplier's enrollment (close_reason switched_to_other_supplier) with that cycle posted scales it by switch_share, and any other case leaves it unscaled.
      The exit damages rate is scaled by the whole months left in the term at exit, counted from close_date to contract_end_date with a partial final month left out: fewer than months_per_year scale it by exit_short_share, months_per_year up to one less than two_years_months scale it by exit_mid_share, and two_years_months or more leave it unscaled.
      The exit damages rate is scaled by the exit notice, the calendar days from termination_notice_date to close_date: a contract with no termination_notice_date scales it by unannounced_share, a notice dated fewer than termination_notice_days days before close_date scales it by short_notice_share, and any longer notice leaves it unscaled.
      The exit damages rate is scaled by the exit load factor, the exit annual kWh divided by the product of the capacity tag on the most recently posted capacity_charge line and hours_per_year: high_exit_lf or more scales it by high_exit_lf_share, mid_exit_lf up to below high_exit_lf scales it by mid_exit_lf_share, and a lower load factor, or no capacity_charge line, leaves it unscaled.
      The exit damages rate is scaled by the supply tenure at exit, the whole months from service_start_date to close_date: exit_tenure_long months or more scale it by exit_tenure_long_share, exit_tenure_mid months up to one less than exit_tenure_long scale it by exit_tenure_mid_share, and a shorter tenure leaves it unscaled.
      The scales applied to the exit damages rate multiply together into one rate, which then multiplies the exit kWh.
    prerequisite: []
    cross_category: []
    compute:
      - close: "F('close_date')"
      - months_std: "0 - MONTHS(F('contract_end_date'), close)"
      - kwh_w: "SUM('cni_billing','usage_kwh', within_months=12, date_field='posted_date', event_type='cni_supply_charge')"
      - ce: "COUNT('cni_billing', within_months=12, date_field='posted_date', line_type='energy_charge')"
      - cb: "COUNT('cni_billing', within_months=12, date_field='posted_date', line_type='block_energy_charge')"
      - ci: "COUNT('cni_billing', within_months=12, date_field='posted_date', line_type='index_energy_charge')"
      - cyc: "ce + cb + (ci if cb == 0 else 0)"
      - de: "SUM('cni_billing','billing_days', within_months=12, date_field='posted_date', line_type='energy_charge')"
      - db: "SUM('cni_billing','billing_days', within_months=12, date_field='posted_date', line_type='block_energy_charge')"
      - di: "SUM('cni_billing','billing_days', within_months=12, date_field='posted_date', line_type='index_energy_charge')"
      - days_w: "de + db + (di if cb == 0 else 0)"
      - lst_start: "LATEST('cni_billing','billing_period_start', date_field='posted_date', event_type='cni_supply_charge')"
      - lst_kwh: "SUM('cni_billing','usage_kwh', event_type='cni_supply_charge', billing_period_start=lst_start)"
      - annual_kwh: "kwh_w / days_w * K('days_per_year') if (cyc >= 1 and cyc < K('full_history_cycles')) else (lst_kwh * K('months_per_year') if cyc == 0 else kwh_w)"
      - exit_kwh: "int(annual_kwh * months_std / K('months_per_year') + 0.5)"
      - final_posted: "COUNT('cni_billing', event_type='cni_supply_charge', billing_period_end=close)"
      - reason_share: "K('final_bill_share') if (F('close_reason') == 'final_billed' and final_posted > 0) else (K('switch_share') if (F('close_reason') == 'switched_to_other_supplier' and final_posted > 0) else 1)"
      - term_left: "MONTHS(close, F('contract_end_date'))"
      - term_share: "K('exit_short_share') if term_left < K('months_per_year') else (K('exit_mid_share') if term_left < K('two_years_months') else 1)"
      - notice_gap: "DAYS(F('termination_notice_date'), close) if F('termination_notice_date') else -1"
      - notice_share: "K('unannounced_share') if notice_gap < 0 else (K('short_notice_share') if notice_gap < P('termination_notice_days') else 1)"
      - cap_tag: "LATEST('cni_billing','tag_kw', date_field='posted_date', event_type='cni_supply_charge', line_type='capacity_charge')"
      - exit_lf: "annual_kwh / (cap_tag * K('hours_per_year')) if cap_tag else 0"
      - lf_share: "K('high_exit_lf_share') if exit_lf >= K('high_exit_lf') else (K('mid_exit_lf_share') if exit_lf >= K('mid_exit_lf') else 1)"
      - tenure_exit: "MONTHS(F('service_start_date'), close)"
      - tenure_share: "K('exit_tenure_long_share') if tenure_exit >= K('exit_tenure_long') else (K('exit_tenure_mid_share') if tenure_exit >= K('exit_tenure_mid') else 1)"
      - rate_eff: "P('etf_rate_usd_per_kwh') * reason_share * term_share * notice_share * lf_share * tenure_share"
      - result: "MX(P('etf_minimum_usd'), RND(exit_kwh * rate_eff, 2))"
    compute_basis:
      close: "The exit months are twelve times the difference in years plus the difference in months between close_date and contract_end_date"
      months_std: "The exit months are twelve times the difference in years plus the difference in months between close_date and contract_end_date, plus one when the day of month of contract_end_date is later than the day of month of close_date."
      kwh_w: "The exit annual kWh are the kWh posted on the contract's supply lines in the twelve months before the handling date."
      cyc: "The exit annual kWh depend on how many billed cycles were posted in the twelve months before the handling date, each cycle counted once by its energy_charge line, by its block_energy_charge line on a block and index contract, or otherwise by its index_energy_charge line"
      days_w: "one to eleven such cycles give the window's kWh divided by the billing_days of the counted cycles, times days_per_year"
      lst_kwh: "no cycle in the window gives the kWh of the most recently posted cycle times months_per_year"
      annual_kwh: "one to eleven such cycles give the window's kWh divided by the billing_days of the counted cycles, times days_per_year; no cycle in the window gives the kWh of the most recently posted cycle times months_per_year; twelve or more give the window's kWh."
      exit_kwh: "The exit kWh of a contract exit are its exit annual kWh times its exit months divided by months_per_year, rounded half up to a whole kWh, and that figure is billed as etf_remaining_kwh."
      final_posted: "The exit damages rate is scaled by the exit reason once the cycle that ends on close_date has been posted"
      reason_share: "a final bill (close_reason final_billed) with that cycle posted scales it by final_bill_share, another supplier's enrollment (close_reason switched_to_other_supplier) with that cycle posted scales it by switch_share, and any other case leaves it unscaled."
      term_left: "The exit damages rate is scaled by the whole months left in the term at exit, counted from close_date to contract_end_date with a partial final month left out"
      term_share: "fewer than months_per_year scale it by exit_short_share, months_per_year up to one less than two_years_months scale it by exit_mid_share, and two_years_months or more leave it unscaled."
      notice_gap: "The exit damages rate is scaled by the exit notice, the calendar days from termination_notice_date to close_date"
      notice_share: "a contract with no termination_notice_date scales it by unannounced_share, a notice dated fewer than termination_notice_days days before close_date scales it by short_notice_share, and any longer notice leaves it unscaled."
      cap_tag: "the exit annual kWh divided by the product of the capacity tag on the most recently posted capacity_charge line and hours_per_year"
      exit_lf: "The exit damages rate is scaled by the exit load factor, the exit annual kWh divided by the product of the capacity tag on the most recently posted capacity_charge line and hours_per_year"
      lf_share: "high_exit_lf or more scales it by high_exit_lf_share, mid_exit_lf up to below high_exit_lf scales it by mid_exit_lf_share, and a lower load factor, or no capacity_charge line, leaves it unscaled."
      tenure_exit: "The exit damages rate is scaled by the supply tenure at exit, the whole months from service_start_date to close_date"
      tenure_share: "exit_tenure_long months or more scale it by exit_tenure_long_share, exit_tenure_mid months up to one less than exit_tenure_long scale it by exit_tenure_mid_share, and a shorter tenure leaves it unscaled."
      rate_eff: "The scales applied to the exit damages rate multiply together into one rate, which then multiplies the exit kWh."
      result: "The damages of a contract exit are its exit kWh times its exit damages rate, rounded half up to the cent only at that step, but not less than etf_minimum_usd."
    factors:
      - id: exit_annual_kwh_basis
        effect: method
        decides: annual_kwh
        bindings: [ce, cb, ci, cyc, de, db, di, days_w, lst_start, lst_kwh, annual_kwh]
        ladder:
          - when: "one to eleven billed cycles posted in the twelve months before the handling date"
            method: "the window's kWh divided by the billing_days of the counted cycles, times days_per_year"
          - when: "no billed cycle posted in that window"
            method: "the kWh of the most recently posted cycle times months_per_year"
          - when: "otherwise (twelve or more cycles)"
            method: "the window's kWh"
        baseline:
          annual_kwh: "kwh_w"
        evidence: [history]
        cross_difficulty: null
      - id: exit_reason_share
        effect: parameter
        decides: reason_share
        bindings: [final_posted, reason_share]
        ladder:
          - when: "close_reason final_billed and the cycle ending on close_date is posted"
            value: "K('final_bill_share')"
          - when: "close_reason switched_to_other_supplier and the cycle ending on close_date is posted"
            value: "K('switch_share')"
          - when: "otherwise"
            value: "unscaled (1)"
        baseline:
          reason_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: exit_term_left_share
        effect: parameter
        decides: term_share
        bindings: [term_left, term_share]
        ladder:
          - when: "fewer than months_per_year whole months left at close_date"
            value: "K('exit_short_share')"
          - when: "months_per_year up to one less than two_years_months whole months left"
            value: "K('exit_mid_share')"
          - when: "otherwise (two_years_months or more)"
            value: "unscaled (1)"
        baseline:
          term_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: exit_notice_share
        effect: parameter
        decides: notice_share
        bindings: [notice_gap, notice_share]
        ladder:
          - when: "no termination_notice_date on the contract"
            value: "K('unannounced_share')"
          - when: "a notice dated fewer than termination_notice_days days before close_date"
            value: "K('short_notice_share')"
          - when: "otherwise (a longer notice)"
