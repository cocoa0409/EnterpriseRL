  - id: cni_ext_passthrough_index_rebill
    base_policy_refs: [cni_billing_correction, cni_energy_billing]
    overwrite:
      - base_policy: cni_billing_correction
        superseded_clause: >-
          When a C&I line was billed at more than the contract allows, the over-billed amount is returned as one rebill_credit tied to that line through source_billing_id, equal to the billed amount_usd minus the correctly computed amount and posted as a negative amount.
        replaced_by: >-
          The index line rebill credit is the over-billed amount plus its carrying credit, rounded half up to the cent and posted as a negative amount.
      - base_policy: cni_energy_billing
        superseded_clause: >-
          the first block_kwh_per_cycle kWh are billed on a block_energy_charge line at contract_rate_cents_kwh
        replaced_by: >-
          a cycle of fewer than full_cycle_days billing_days that began on or before contract_end_date on a block and index contract carries the metered kWh above block_kwh_per_cycle prorated by its billing_days over days_per_month_basis
    trigger: on_request
    subject: [cni_adjustment]
    computes: amount_usd
    target_tool: credit_index_line_725777e6
    params:
      carry_long_months: 6
      carry_rate_long: 0.06
      carry_rate_short: 0.03
      days_per_month_basis: 30
      days_per_year_basis: 360
      full_cycle_days: 28
      repeat_many_count: 2
      repeat_many_uplift: 1.50
      repeat_one_uplift: 1.25
    rule: >-
      An index line correction returns what the index_energy_charge line of the pass-through cycle was billed above the index price the contract allows, the pass-through cycle being the cycle that began on the stated effective date of the contract's latest regulatory_pass_through notice; it is posted, when the business disputes the line, as one rebill_credit tied to that line through source_billing_id, and only when the over-billed amount is positive.
      The over-billed amount of the pass-through cycle's index line is its billed amount_usd less its index kWh times the sum of the index price and the index adder divided by 100, that product rounded half up to the cent, and nothing when the difference is not positive.
      The index kWh of the index line correction are the cycle's metered kWh, the kWh on all of the cycle's energy lines together.
      The index price of the index line correction is the index_price_cents_kwh of the monthly_index_price notice effective on the cycle's billing_period_start.
      The index adder of the index line correction is contract_rate_cents_kwh.
      The index line carrying credit is the over-billed amount times its carrying rate times its carrying period, where the carrying period is the whole months from the index line's posted_date to the handling date times days_per_month_basis divided by days_per_year_basis.
      The index line carrying rate is zero.
      The index line rebill credit is the over-billed amount plus its carrying credit, rounded half up to the cent and posted as a negative amount.
      The index kWh of the index line correction follow the cycle and the structure: a cycle of fewer than full_cycle_days billing_days that began on or before contract_end_date on a block and index contract carries the metered kWh above block_kwh_per_cycle prorated by its billing_days over days_per_month_basis; any other cycle that began on or before contract_end_date on a block and index contract carries the metered kWh above block_kwh_per_cycle, none when they do not exceed it; every other cycle, a real-time index cycle or any holdover cycle, carries all of its metered kWh.
      The index adder of the index line correction follows the cycle: a cycle that began on or before contract_end_date on a block and index contract carries no adder, because the block price carries the margin, and so does a holdover cycle, one that began after contract_end_date, when late_expiry_notice_holdover_adder_waived is true and the contract's expiry notice was missing or issued outside the window from expiry_notice_earliest_days to expiry_notice_latest_days days before contract_end_date; any other holdover cycle carries holdover_adder_cents_kwh; every other cycle carries contract_rate_cents_kwh.
      The index line carrying rate follows the months outstanding, the whole months from the index line's posted_date to the handling date: carry_long_months or more give carry_rate_long, at least one month but fewer than carry_long_months give carry_rate_short, and less than one whole month gives none.
      The index line carrying rate is raised for a repeated billing error on the contract: repeat_many_count or more rebill credits for cycles other than the pass-through cycle posted on the contract in the twelve months before the handling date multiply the index line carrying rate by repeat_many_uplift, one such credit multiplies it by repeat_one_uplift, and none leaves it unchanged.
    prerequisite: []
    cross_category: []
    compute:
      - pt_start: "LATEST('cni_notices','effective_date', date_field='notice_date', notice_type='regulatory_pass_through')"
      - ix_amt: "SUM('cni_billing','amount_usd', line_type='index_energy_charge', billing_period_start=pt_start)"
      - ix_posted: "LATEST('cni_billing','posted_date', date_field='posted_date', line_type='index_energy_charge', billing_period_start=pt_start)"
      - ix_days: "LATEST('cni_billing','billing_days', date_field='posted_date', line_type='index_energy_charge', billing_period_start=pt_start)"
      - idx_price: "LATEST('cni_notices','index_price_cents_kwh', date_field='notice_date', notice_type='monthly_index_price', effective_date=pt_start)"
      - in_term: "DAYS(pt_start, F('contract_end_date'))"
      - ix_metered: "SUM('cni_billing','usage_kwh', event_type='cni_supply_charge', billing_period_start=pt_start)"
      - idx_kwh: "MX(0, ix_metered - F('block_kwh_per_cycle') * ix_days / K('days_per_month_basis')) if (in_term >= 0 and P('energy_price_basis') == 'fixed_block_plus_index_balance' and ix_days < K('full_cycle_days')) else (MX(0, ix_metered - F('block_kwh_per_cycle')) if (in_term >= 0 and P('energy_price_basis') == 'fixed_block_plus_index_balance') else ix_metered)"
      - exp_last: "LATEST('cni_notices','notice_date', date_field='notice_date', notice_type='expiry_notice')"
      - exp_lead: "DAYS(exp_last, F('contract_end_date')) if exp_last else -1"
      - exp_ok: "exp_lead >= P('expiry_notice_latest_days') and exp_lead <= P('expiry_notice_earliest_days')"
      - adder: "0 if ((in_term >= 0 and P('energy_price_basis') == 'fixed_block_plus_index_balance') or (in_term < 0 and P('late_expiry_notice_holdover_adder_waived') and not exp_ok)) else (P('holdover_adder_cents_kwh') if in_term < 0 else F('contract_rate_cents_kwh'))"
      - over: "RND(MX(0, ix_amt - RND(idx_kwh * (idx_price + adder) / 100, 2)), 2)"
      - ix_months_out: "MONTHS(ix_posted, NOW)"
      - ix_carry_rate: "K('carry_rate_long') if ix_months_out >= K('carry_long_months') else (K('carry_rate_short') if ix_months_out >= 1 else 0)"
      - ix_other_credits: "COUNT('cni_billing', within_months=12, date_field='posted_date', line_type='rebill_credit') - COUNT('cni_billing', line_type='rebill_credit', billing_period_start=pt_start)"
      - ix_repeat_uplift: "K('repeat_many_uplift') if ix_other_credits >= K('repeat_many_count') else (K('repeat_one_uplift') if ix_other_credits >= 1 else 1)"
      - ix_carry_period: "ix_months_out * K('days_per_month_basis') / K('days_per_year_basis')"
      - carrying: "over * ix_carry_rate * ix_repeat_uplift * ix_carry_period"
      - result: "0 - RND(over + carrying, 2)"
    compute_basis:
      pt_start: "the pass-through cycle being the cycle that began on the stated effective date of the contract's latest regulatory_pass_through notice"
      ix_amt: "The over-billed amount of the pass-through cycle's index line is its billed amount_usd less its index kWh times the sum of the index price and the index adder divided by 100"
      ix_posted: "the whole months from the index line's posted_date to the handling date"
      ix_days: "a cycle of fewer than full_cycle_days billing_days that began on or before contract_end_date on a block and index contract carries the metered kWh above block_kwh_per_cycle prorated by its billing_days over days_per_month_basis"
      idx_price: "The index price of the index line correction is the index_price_cents_kwh of the monthly_index_price notice effective on the cycle's billing_period_start."
      in_term: "a cycle that began on or before contract_end_date on a block and index contract carries no adder"
      ix_metered: "The index kWh of the index line correction are the cycle's metered kWh, the kWh on all of the cycle's energy lines together."
      idx_kwh: "The index kWh of the index line correction follow the cycle and the structure: a cycle of fewer than full_cycle_days billing_days that began on or before contract_end_date on a block and index contract carries the metered kWh above block_kwh_per_cycle prorated by its billing_days over days_per_month_basis; any other cycle that began on or before contract_end_date on a block and index contract carries the metered kWh above block_kwh_per_cycle, none when they do not exceed it; every other cycle, a real-time index cycle or any holdover cycle, carries all of its metered kWh."
      exp_last: "the contract's expiry notice was missing or issued outside the window from expiry_notice_earliest_days to expiry_notice_latest_days days before contract_end_date"
      exp_lead: "the contract's expiry notice was missing or issued outside the window from expiry_notice_earliest_days to expiry_notice_latest_days days before contract_end_date"
      exp_ok: "the contract's expiry notice was missing or issued outside the window from expiry_notice_earliest_days to expiry_notice_latest_days days before contract_end_date"
      adder: "The index adder of the index line correction follows the cycle: a cycle that began on or before contract_end_date on a block and index contract carries no adder, because the block price carries the margin, and so does a holdover cycle, one that began after contract_end_date, when late_expiry_notice_holdover_adder_waived is true and the contract's expiry notice was missing or issued outside the window from expiry_notice_earliest_days to expiry_notice_latest_days days before contract_end_date; any other holdover cycle carries holdover_adder_cents_kwh; every other cycle carries contract_rate_cents_kwh."
