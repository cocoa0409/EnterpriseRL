      ix_other_credits: "repeat_many_count or more rebill credits for cycles other than the pass-through cycle posted on the contract in the twelve months before the handling date multiply the index line carrying rate by repeat_many_uplift"
      ix_repeat_uplift: "The index line carrying rate is raised for a repeated billing error on the contract: repeat_many_count or more rebill credits for cycles other than the pass-through cycle posted on the contract in the twelve months before the handling date multiply the index line carrying rate by repeat_many_uplift, one such credit multiplies it by repeat_one_uplift, and none leaves it unchanged."
      ix_carry_period: "where the carrying period is the whole months from the index line's posted_date to the handling date times days_per_month_basis divided by days_per_year_basis."
      carrying: "The index line carrying credit is the over-billed amount times its carrying rate times its carrying period"
      result: "The index line rebill credit is the over-billed amount plus its carrying credit, rounded half up to the cent and posted as a negative amount."
    factors:
