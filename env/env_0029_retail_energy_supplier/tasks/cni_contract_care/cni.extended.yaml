events:
  - type: cni_contract_execute
    target: cni_contracts
    mutation: create
    meaning: The customer's authorized signatory signs a priced C&I quote, creating a contract for one facility.
    grain: One row per executed contract.
    fields:
      customer_id: The business customer.
      premise_id: The facility covered.
      variant_name: The contract structure signed, as the official name.
      pricing_request_id: The priced quote that was signed.
      contract_signed_date: Date the signatory signed.
      term_months: Term priced in the quote.
      contract_rate_cents_kwh: Quoted fixed price, or quoted adder on an index structure.
      block_kwh_per_cycle: Quoted block size on a block and index contract; 0 otherwise.
    triggers: []
  - type: cni_utility_confirm
    target: cni_contracts
    mutation: update
    meaning: The utility accepts the enrollment of the facility.
    grain: One row per transaction.
    fields:
      utility_confirmation_date: Date of the utility's confirmation.
    triggers: []
  - type: cni_activate
    target: cni_contracts
    mutation: {transition: {from: pending_enrollment, to: active}}
    meaning: Supply begins on the switch meter read date and the term starts.
    grain: One row per transaction.
    fields:
      service_start_date: The switch meter read date.
      term_start_date: Equal to service_start_date for the first term.
      contract_end_date: Last day of the term.
    triggers: []
  - type: cni_reject
    target: cni_contracts
    mutation: {transition: {from: pending_enrollment, to: rejected}}
    meaning: The utility rejects the enrollment.
    grain: One row per transaction.
    fields:
      reject_reason: The utility's rejection reason.
    triggers: []
  - type: cni_preflow_terminate
    target: cni_contracts
    mutation: {transition: {from: pending_enrollment, to: closed}}
    meaning: The customer terminates an executed contract before supply starts.
    grain: One row per transaction.
    fields:
      termination_notice_date: Date the written termination notice was received.
      close_date: Date the contract was closed.
      close_reason: Set to terminated_before_flow.
    triggers: []
  - type: cni_terminate
    target: cni_contracts
    mutation: {transition: {from: active, to: termination_pending}}
    meaning: The customer's signatory gives written notice of early termination during the term.
    grain: One row per transaction.
    fields:
      termination_notice_date: Date the written notice was received.
      termination_effective_date: First scheduled meter read date on or after the notice date plus termination_notice_days.
    triggers: []
  - type: cni_holdover_terminate
    target: cni_contracts
    mutation: {transition: {from: holdover, to: termination_pending}}
    meaning: The customer gives notice to end holdover service.
    grain: One row per transaction.
    fields:
      termination_notice_date: Date the written notice was received.
      termination_effective_date: First scheduled meter read date on or after the notice date plus holdover_termination_notice_days.
    triggers: []
  - type: cni_drop_complete
    target: cni_contracts
    mutation: {transition: {from: termination_pending, to: closed}}
    meaning: The utility completes the drop on the termination effective date.
    grain: One row per transaction.
    fields:
      close_date: Meter read date on which supply ended.
      close_reason: early_termination or holdover_ended.
    triggers: []
  - type: cni_switch_away
    target: cni_contracts
    mutation: {transition: [{from: active, to: closed}, {from: holdover, to: closed}]}
    meaning: The utility ends supply because another supplier enrolled the facility or it was final-billed.
    grain: One row per transaction.
    fields:
      close_date: Meter read date on which supply ended.
      close_reason: switched_to_other_supplier or final_billed.
    triggers: []
  - type: cni_expire_holdover
    target: cni_contracts
    mutation: {transition: {from: active, to: holdover}}
    meaning: The term expires without a signed renewal and the facility moves to holdover pricing.
    grain: One row per transaction.
    fields:
      holdover_start_date: The day after contract_end_date.
    triggers: []
  - type: cni_renew
    target: cni_contracts
    mutation: update
    meaning: The customer signs a renewal quote before the current term expires; the new term starts the day after contract_end_date.
    grain: One row per transaction.
    fields:
      variant_name: The structure signed for the new term.
      pricing_request_id: The renewal quote signed.
      renewal_signed_date: Date the renewal was signed.
      term_months: Term of the new contract.
      contract_rate_cents_kwh: Quoted price or adder for the new term.
      block_kwh_per_cycle: Quoted block size; 0 when not block and index.
      term_start_date: The day after the expiring contract_end_date.
      contract_end_date: Last day of the new term.
    triggers: []
  - type: cni_holdover_renew
    target: cni_contracts
    mutation: {transition: {from: holdover, to: active}}
    meaning: The customer signs a renewal quote while on holdover and a new term starts.
    grain: One row per transaction.
    fields:
      variant_name: The structure signed.
      pricing_request_id: The renewal quote signed.
      renewal_signed_date: Date the renewal was signed.
      term_months: Term of the new contract.
      contract_rate_cents_kwh: Quoted price or adder.
      block_kwh_per_cycle: Quoted block size; 0 when not block and index.
      term_start_date: The facility's next scheduled meter read date after signing.
      contract_end_date: Last day of the new term.
    triggers: []
  - type: cni_supply_charge
    target: cni_billing
    meaning: Beacon Ridge bills one cycle's energy, index energy, block energy, capacity or transmission charge for the facility.
    grain: One row per charge component per billing cycle.
    distinguish_by: [line_type, billing_period_start]
    fields:
      cni_contract_id: The contract billed.
      line_type: energy_charge, block_energy_charge, index_energy_charge, capacity_charge or transmission_charge.
      billing_period_start: First day of the billing cycle.
      billing_period_end: Last day of the billing cycle.
      billing_days: Days in the cycle, counting both ends.
      usage_kwh: kWh billed on an energy line; 0 on pass-through lines.
      rate_cents_kwh: Price per kWh on an energy line; 0.00 on pass-through lines.
      tag_kw: Capacity tag or transmission tag used on a pass-through line; 0.0 otherwise.
      tag_rate_usd_mw_day: Capacity price or transmission rate used on a pass-through line; 0.00 otherwise.
      amount_usd: Positive charge amount.
      posted_date: Date posted.
    account: cni_supply_billed
    direction: in
    triggers: []
  - type: cni_etf_charge
    target: cni_billing
    meaning: Beacon Ridge bills liquidated damages for an early termination.
    grain: One row per early termination.
    distinguish_by: [line_type, posted_date]
    fields:
      cni_contract_id: The contract terminated.
      line_type: early_termination_fee.
      etf_remaining_kwh: Remaining contracted kWh used.
      amount_usd: Positive fee amount.
      posted_date: Date posted.
    account: cni_supply_billed
    direction: in
    triggers: []
  - type: cni_adjustment
    target: cni_billing
    meaning: Beacon Ridge corrects an over-billed C&I line with a rebill credit.
    grain: One row per corrected original line.
    distinguish_by: [source_billing_id, posted_date]
    fields:
      cni_contract_id: The contract corrected.
      line_type: rebill_credit.
      source_billing_id: The line being corrected.
      billing_period_start: Billing cycle of the corrected line.
      amount_usd: Negative credit equal to the over-billed amount.
      posted_date: Date posted.
    account: cni_supply_billed
    direction: out
    triggers: []
  - type: cni_deposit_post
    target: cni_deposits
    meaning: The customer's security deposit for the contract is received and recorded.
    grain: One row per deposit received.
    distinguish_by: [posted_date, amount_usd]
    fields:
      cni_contract_id: The contract secured.
      amount_usd: Positive deposit amount.
      deposit_months: Months of estimated supply cost the deposit represents.
      credit_grade_basis: The customer's commercial credit grade used to size the deposit.
      posted_date: Date received.
    account: cni_deposit_held
    direction: in
    triggers: []
  - type: cni_deposit_refund
    target: cni_deposits
    meaning: Beacon Ridge refunds a held security deposit.
    grain: One row per refunded deposit.
    distinguish_by: [source_deposit_id]
    fields:
      cni_contract_id: The contract whose deposit is refunded.
      source_deposit_id: The deposit being refunded.
      amount_usd: Negative refund amount equal to the deposit held.
      posted_date: Date refunded.
    account: cni_deposit_held
    direction: out
    triggers: []
  - type: cni_market_notice
    target: cni_notices
    meaning: Beacon Ridge publishes the month's index price, the capacity price or transmission rate for the facility's zone, or a regulatory pass-through.
    grain: One row per notice type per effective date.
    distinguish_by: [notice_type, effective_date]
    fields:
      cni_contract_id: The contract the notice applies to.
      notice_type: monthly_index_price, capacity_price, transmission_rate or regulatory_pass_through.
      notice_date: Date issued.
      effective_date: First day of the month priced, or first day the capacity price or transmission rate applies, or the stated pass-through date.
      index_price_cents_kwh: Monthly index price; 0.00 otherwise.
      capacity_price_usd_mw_day: Capacity price; 0.00 otherwise.
      transmission_rate_usd_mw_day: Transmission rate; 0.00 otherwise.
      new_rate_cents_kwh: Pass-through contract price; 0.00 otherwise.
    triggers: []
  - type: cni_expiry_notice
    target: cni_notices
    meaning: Beacon Ridge notifies the customer that the contract term is ending and describes holdover pricing.
    grain: One row per expiry notice.
    distinguish_by: [notice_type, notice_date]
    fields:
      cni_contract_id: The expiring contract.
      notice_type: expiry_notice.
      notice_date: Date issued.
      effective_date: The contract_end_date referred to.
    triggers: []

measures:
  - id: cni_msr_deposits_held
    window: All time up to the frozen handling date.
    measure: Sum of amount_usd of cni_deposit_post rows minus the absolute amounts of cni_deposit_refund rows across all of the customer's C&I contracts.

policies:
  - id: cni_agg_multi_holding
    subject: [cni_contract_execute]
    rule: >-
      A business may hold any number of C&I contracts, one per facility.
      No other C&I contract on the same facility may be in pending_enrollment, active, termination_pending or holdover status when a new contract is executed.
      A facility still on a live Beacon Ridge small business electricity agreement may sign a C&I contract; the small business agreement must then be cancelled with drop_reason cni_upgrade, which is how holding the C&I contract changes the small business termination fee.
    eligibility:
      - id: one_live_contract_per_facility
        applies_to: [cni_contract_execute]
        kind: dedup
        condition: No other C&I contract on the same facility may be in pending_enrollment, active, termination_pending or holdover status when a new contract is executed.
        evidence_fields: [cni_contracts.premise_id, cni_contracts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_contracts.premise_id]
          action_bindings:
            cni_contracts.premise_id: premise_id
        dedup_contract:
          table: cni_contracts
          mode: separate_record
          object_bindings: {premise_id: premise_id}
          duplicate_filters: {status: [pending_enrollment, active, termination_pending, holdover]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: cni_agg_deposit_cap
    subject: [cni_deposit_post]
    rule: >-
      Security deposits are combined across all of the customer's C&I contracts.
      The deposit required for a contract is deposit_months_by_grade for the customer's commercial_credit_grade times the facility's annual_kwh_usage times deposit_reference_rate_cents_kwh divided by cents_months_divisor, rounded per charge_rounding.
      When the customer's deposits already held (cni_msr_deposits_held) plus the new deposit would exceed max_total_deposit_usd, only the amount up to that ceiling is required, and nothing is required once the ceiling is reached.
      A grade with 0 months requires no deposit.
      The grade used is the one on the customer profile when the contract is executed; a later grade change neither raises nor refunds a posted deposit.
    eligibility: []
    params:
      cents_months_divisor: 1200
      per_tier:
        Beacon Ridge C&I Real-Time Index: {deposit_reference_rate_cents_kwh: "=deposit_reference_rate_cents_kwh", max_total_deposit_usd: "=max_total_deposit_usd"}
        Beacon Ridge C&I Block and Index: {deposit_reference_rate_cents_kwh: "=deposit_reference_rate_cents_kwh", max_total_deposit_usd: "=max_total_deposit_usd"}
        Beacon Ridge C&I Fixed Energy with Capacity and Transmission Pass-Through: {deposit_reference_rate_cents_kwh: "=deposit_reference_rate_cents_kwh", max_total_deposit_usd: "=max_total_deposit_usd"}
        Beacon Ridge C&I Fixed Energy with Capacity Pass-Through: {deposit_reference_rate_cents_kwh: "=deposit_reference_rate_cents_kwh", max_total_deposit_usd: "=max_total_deposit_usd"}
        Beacon Ridge C&I Fixed All-In: {deposit_reference_rate_cents_kwh: "=deposit_reference_rate_cents_kwh", max_total_deposit_usd: "=max_total_deposit_usd"}
        Beacon Ridge C&I Fixed All-In Renewable: {deposit_reference_rate_cents_kwh: "=deposit_reference_rate_cents_kwh", max_total_deposit_usd: "=max_total_deposit_usd"}
    measures: [cni_msr_deposits_held]

  - id: cni_pricing_and_execution
    subject: [cni_contract_execute]
    rule: >-
      Every C&I contract is priced individually: the customer first submits a pricing request for a facility, structure and term, and the structuring desk returns a quote with quoted_rate_cents_kwh, any quoted_block_kwh_per_cycle, quote_date and quote_valid_until.
      A contract may be executed only from a pricing request whose pricing_status is priced, for the same facility, structure and term.
      A quote may be signed only when the customer signs it no later than quote_validity_days calendar days after the quote was issued.
      Day one is the calendar day after quote_date, and the quote expires at the end of the calendar day equal to quote_date plus quote_validity_days, which is the quote_valid_until printed on the quote.
      An expired quote must be re-priced through a new pricing request and is never honoured at its old price.
      The facility must be commercial with annual_kwh_usage of at least min_annual_kwh, its state must be in eligible_states, and the term must be one of allowed_terms_months.
      The contract takes the quoted price as contract_rate_cents_kwh and the quoted block as block_kwh_per_cycle.
    eligibility:
      - id: priced_quote
        applies_to: [cni_contract_execute]
        kind: state
        condition: A contract may be executed only from a pricing request whose pricing_status is priced, for the same facility, structure and term.
        evidence_fields: [cni_pricing_requests.pricing_status, cni_pricing_requests.pricing_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_pricing_requests.pricing_request_id]
          action_bindings:
            cni_pricing_requests.pricing_request_id: pricing_request_id
        state_contract:
          field: cni_pricing_requests.pricing_status
          allowed: [priced]
      - id: quote_validity
        applies_to: [cni_contract_execute]
        kind: time
        condition: A quote may be signed only when the customer signs it no later than quote_validity_days calendar days after the quote was issued.
        evidence_fields: [cni_pricing_requests.quote_date, cni_pricing_requests.pricing_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_pricing_requests.pricing_request_id]
          action_bindings:
            cni_pricing_requests.pricing_request_id: pricing_request_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the quote was issued
          anchor_source: cni_pricing_requests.quote_date
          relation: not_after
          duration_source: variants.quote_validity_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after quote_date, and the quote expires at the end of the calendar day equal to quote_date plus quote_validity_days, which is the quote_valid_until printed on the quote.
          boundary: inclusive

  - id: cni_enrollment_processing
    subject: [cni_utility_confirm, cni_activate, cni_reject]
    rule: >-
      An executed contract is submitted to the utility only after any required security deposit has been posted, when deposit_due_before_enrollment is true.
      The utility then accepts the enrollment, recording utility_confirmation_date, or rejects it.
      Supply begins on the switch meter read date, which becomes service_start_date and term_start_date; contract_end_date is the day before the same calendar day term_months calendar months after term_start_date, using the last day of the month when that day does not exist.
      A rejected contract ends without any termination fee, and its deposit is refunded.
    eligibility: []

  - id: cni_security_deposit
    subject: [cni_deposit_post, cni_deposit_refund]
    rule: >-
      A security deposit is recorded only on a contract that is pending_enrollment or active.
      deposit_months and credit_grade_basis on the deposit record the grade and months used.
      A held deposit is refunded in full, with deposit_interest_rate_pct interest, once the contract is closed or rejected and its final bill has posted, per deposit_refund_trigger; it is not refunded while the contract is active, in termination_pending or in holdover.
      A deposit is refunded only once, and the refund names the deposit through source_deposit_id.
      An unpaid early termination fee is not netted against the deposit by the care desk.
    eligibility:
      - id: deposit_contract_open
        applies_to: [cni_deposit_post]
        kind: state
        condition: A security deposit is recorded only on a contract that is pending_enrollment or active.
        evidence_fields: [cni_contracts.status, cni_contracts.cni_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_contracts.cni_contract_id]
          action_bindings:
            cni_contracts.cni_contract_id: cni_contract_id
        state_contract:
          field: cni_contracts.status
          allowed: [pending_enrollment, active]
      - id: refund_once
        applies_to: [cni_deposit_refund]
        kind: dedup
        condition: A deposit is refunded only once, and the refund names the deposit through source_deposit_id.
        evidence_fields: [cni_deposits.source_deposit_id, cni_deposits.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_deposits.source_deposit_id]
          action_bindings:
            cni_deposits.source_deposit_id: source_deposit_id
        dedup_contract:
          table: cni_deposits
          mode: separate_record
          object_bindings: {source_deposit_id: source_deposit_id}
          duplicate_filters: {event_type: [cni_deposit_refund]}
          distinct_fields: []
      - id: refund_after_close
        applies_to: [cni_deposit_refund]
        kind: state
        condition: A held deposit is refunded in full, with deposit_interest_rate_pct interest, once the contract is closed or rejected and its final bill has posted, per deposit_refund_trigger; it is not refunded while the contract is active, in termination_pending or in holdover.
        evidence_fields: [cni_contracts.status, cni_contracts.cni_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_contracts.cni_contract_id]
          action_bindings:
            cni_contracts.cni_contract_id: cni_contract_id
        state_contract:
          field: cni_contracts.status
          allowed: [closed, rejected]

  - id: cni_energy_billing
    subject: [cni_supply_charge]
    rule: >-
      C&I charges are billed only while the contract is active, termination_pending, holdover or closed.
      On a fixed structure, all of the cycle's kWh are billed on one energy_charge line at contract_rate_cents_kwh.
      On a real-time index structure, all kWh are billed on one index_energy_charge line at the month's index_price_cents_kwh plus contract_rate_cents_kwh.
      On a block and index structure, the first block_kwh_per_cycle kWh are billed on a block_energy_charge line at contract_rate_cents_kwh and any kWh above the block on an index_energy_charge line at the month's index_price_cents_kwh with no adder, because the block price carries the margin; when usage is below the block, the whole block is still billed on the block line.
      During holdover, all kWh are billed on an index_energy_charge line at the month's index price plus holdover_adder_cents_kwh, except that the adder is not charged when late_expiry_notice_holdover_adder_waived is true and the expiry notice was missing or not compliant.
      The month's index price is the monthly_index_price notice for the month of billing_period_start, per index_price_basis.
      Each energy amount is kWh times price divided by 100, rounded per charge_rounding.
    eligibility:
      - id: cni_billable_status
        applies_to: [cni_supply_charge]
        kind: state
        condition: C&I charges are billed only while the contract is active, termination_pending, holdover or closed.
        evidence_fields: [cni_contracts.status, cni_contracts.cni_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_contracts.cni_contract_id]
          action_bindings:
            cni_contracts.cni_contract_id: cni_contract_id
        state_contract:
          field: cni_contracts.status
          allowed: [active, termination_pending, holdover, closed]
    formula:
      when: line_type == "energy_charge"
      amount_usd: round(usage_kwh * rate_cents_kwh / 100, 2)

  - id: cni_capacity_transmission
    subject: [cni_supply_charge]
    rule: >-
      On a structure whose capacity_cost_treatment is pass_through, each cycle carries one capacity_charge line equal to the facility's peak_load_contribution_kw times the capacity price in effect on billing_period_start times billing_days divided by kw_per_mw, rounded per charge_rounding.
      On a structure whose transmission_cost_treatment is pass_through, each cycle carries one transmission_charge line equal to the facility's transmission_obligation_kw times the transmission rate in effect on billing_period_start times billing_days divided by kw_per_mw, rounded per charge_rounding.
      The price or rate in effect is that of the latest capacity_price or transmission_rate notice on the contract whose effective_date is on or before billing_period_start.
      A cycle that spans a June 1 capacity year change is billed entirely at the price in effect on its billing_period_start.
      When the grid operator revises a tag, past cycles are not re-billed because passthrough_tag_true_up is false.
      During holdover, capacity and transmission are always passed through, whatever the expired structure was.
      On structures where the cost is included, no separate line is billed, and a separate line billed is a billing error.
    eligibility: []
    params:
      kw_per_mw: 1000
      per_tier:
        Beacon Ridge C&I Real-Time Index: {capacity_cost_treatment: "=capacity_cost_treatment", transmission_cost_treatment: "=transmission_cost_treatment"}
        Beacon Ridge C&I Block and Index: {capacity_cost_treatment: "=capacity_cost_treatment", transmission_cost_treatment: "=transmission_cost_treatment"}
        Beacon Ridge C&I Fixed Energy with Capacity and Transmission Pass-Through: {capacity_cost_treatment: "=capacity_cost_treatment", transmission_cost_treatment: "=transmission_cost_treatment"}
        Beacon Ridge C&I Fixed Energy with Capacity Pass-Through: {capacity_cost_treatment: "=capacity_cost_treatment", transmission_cost_treatment: "=transmission_cost_treatment"}
        Beacon Ridge C&I Fixed All-In: {capacity_cost_treatment: "=capacity_cost_treatment", transmission_cost_treatment: "=transmission_cost_treatment"}
        Beacon Ridge C&I Fixed All-In Renewable: {capacity_cost_treatment: "=capacity_cost_treatment", transmission_cost_treatment: "=transmission_cost_treatment"}
    formula:
      when: line_type == "capacity_charge" or line_type == "transmission_charge"
      amount_usd: round(tag_kw * tag_rate_usd_mw_day * billing_days / kw_per_mw, 2)

  - id: cni_market_notices
    subject: [cni_market_notice]
    rule: >-
      Beacon Ridge records on each contract the monthly index price for every delivery month, the capacity price for each June-to-May capacity year and the transmission rate for each calendar year of the facility's zone.
      A fixed price may change during the term only to pass through a change in law or regulation, only on a structure whose regulatory_passthrough_allowed is true, and only with a regulatory_pass_through notice issued at least regulatory_change_notice_days calendar days before its effective date; the new price applies to cycles beginning on or after the later of the stated effective date and notice_date plus regulatory_change_notice_days.
      Changes in capacity price or transmission rate are not regulatory pass-throughs; they flow only through the pass-through lines of structures that pass those costs through.
    eligibility: []

  - id: cni_expiry_and_holdover
    subject: [cni_expiry_notice, cni_expire_holdover]
    rule: >-
      An expiry notice is compliant when its notice_date falls no earlier than expiry_notice_earliest_days and no later than expiry_notice_latest_days calendar days before contract_end_date.
      Expiry notices are issued only on an active contract.
      When the term reaches contract_end_date without a signed renewal and without a termination in progress, the contract moves to holdover on the following day, recorded as holdover_start_date.
      Holdover energy is priced per holdover_pricing, holdover can be ended on holdover_termination_notice_days of notice, and ending holdover carries no early termination fee when holdover_etf_applies is false.
    eligibility:
      - id: expiry_notice_active
        applies_to: [cni_expiry_notice]
        kind: state
        condition: Expiry notices are issued only on an active contract.
        evidence_fields: [cni_contracts.status, cni_contracts.cni_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_contracts.cni_contract_id]
          action_bindings:
            cni_contracts.cni_contract_id: cni_contract_id
        state_contract:
          field: cni_contracts.status
          allowed: [active]

  - id: cni_renewal_terms
    subject: [cni_renew, cni_holdover_renew]
    rule: >-
      Every renewal is priced through a new pricing request with request_purpose renewal naming the contract, because renewal_requires_new_pricing is true.
      A renewal is signed only from a renewal pricing request whose pricing_status is priced and only within its quote validity, counted as for a new contract.
      A renewal signed while the contract is active starts the day after contract_end_date; a renewal signed during holdover starts on the facility's next scheduled meter read date and returns the contract to active.
      A renewal may change the structure and term; the new contract_end_date is counted from term_start_date as at activation.
      A renewal never refunds or re-sizes a posted security deposit.
    eligibility:
      - id: renewal_quote_priced
        applies_to: [cni_renew, cni_holdover_renew]
        kind: state
        condition: A renewal is signed only from a renewal pricing request whose pricing_status is priced and only within its quote validity, counted as for a new contract.
        evidence_fields: [cni_pricing_requests.pricing_status, cni_pricing_requests.pricing_request_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_pricing_requests.pricing_request_id]
          action_bindings:
            cni_pricing_requests.pricing_request_id: pricing_request_id
        state_contract:
          field: cni_pricing_requests.pricing_status
          allowed: [priced]

  - id: cni_termination
    subject: [cni_terminate, cni_holdover_terminate, cni_preflow_terminate, cni_drop_complete, cni_switch_away]
    rule: >-
      Early termination during a term requires written notice from the customer's authorized signatory; it takes effect on the first scheduled meter read date on or after the notice date plus termination_notice_days, recorded as termination_effective_date.
      Ending holdover service takes effect on the first scheduled meter read date on or after the notice date plus holdover_termination_notice_days.
      An executed contract may be terminated before supply starts; it closes immediately with close_reason terminated_before_flow and the early termination fee is computed on the full term per etf_preflow_basis.
      When the drop completes the contract closes with close_reason early_termination, or holdover_ended when it was ended from holdover.
      When another supplier enrolls the facility or the facility is final-billed, the contract closes with close_reason switched_to_other_supplier or final_billed; during a term this is an early termination for fee purposes.
      A termination notice cannot be withdrawn once the drop has been scheduled.
    eligibility: []

  - id: cni_etf
    subject: [cni_etf_charge]
    rule: >-
      A C&I early termination fee is assessed only once the contract is termination_pending or closed.
      Only one early termination fee may be billed per C&I contract.
      No fee applies when the contract is ended from holdover or after contract_end_date, or when the utility rejected the enrollment.
      The termination date is termination_effective_date for a noticed termination and close_date for a switch-away or final bill; for a pre-flow termination all term_months count as remaining, per etf_preflow_basis.
      Otherwise remaining months are twelve times the difference in years plus the difference in months between the termination date and contract_end_date, plus one when the day of month of contract_end_date is later than the day of month of the termination date.
      etf_remaining_kwh is the facility's annual_kwh_usage times the remaining months divided by months_per_year, rounded half up to a whole kWh, and the fee is etf_remaining_kwh times etf_rate_usd_per_kwh, rounded per charge_rounding, but not less than etf_minimum_usd.
      Facility closure, sale, bankruptcy and dissatisfaction with market prices do not waive the fee.
    eligibility:
      - id: cni_terminated_status
        applies_to: [cni_etf_charge]
        kind: state
        condition: A C&I early termination fee is assessed only once the contract is termination_pending or closed.
        evidence_fields: [cni_contracts.status, cni_contracts.cni_contract_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_contracts.cni_contract_id]
          action_bindings:
            cni_contracts.cni_contract_id: cni_contract_id
        state_contract:
          field: cni_contracts.status
          allowed: [termination_pending, closed]
      - id: cni_single_etf
        applies_to: [cni_etf_charge]
        kind: dedup
        condition: Only one early termination fee may be billed per C&I contract.
        evidence_fields: [cni_billing.cni_contract_id, cni_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_billing.cni_contract_id]
          action_bindings:
            cni_billing.cni_contract_id: cni_contract_id
        dedup_contract:
          table: cni_billing
          mode: separate_record
          object_bindings: {cni_contract_id: cni_contract_id}
          duplicate_filters: {line_type: [early_termination_fee]}
          distinct_fields: []
    params:
      months_per_year: 12
      per_tier:
        Beacon Ridge C&I Real-Time Index: {etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd"}
        Beacon Ridge C&I Block and Index: {etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd"}
        Beacon Ridge C&I Fixed Energy with Capacity and Transmission Pass-Through: {etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd"}
        Beacon Ridge C&I Fixed Energy with Capacity Pass-Through: {etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd"}
        Beacon Ridge C&I Fixed All-In: {etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd"}
        Beacon Ridge C&I Fixed All-In Renewable: {etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd"}
    formula:
      amount_usd: max(etf_minimum_usd, round(etf_remaining_kwh * etf_rate_usd_per_kwh, 2))

  - id: cni_billing_correction
    subject: [cni_adjustment]
    rule: >-
      When a C&I line was billed at more than the contract allows, the over-billed amount is returned as one rebill_credit tied to that line through source_billing_id, equal to the billed amount_usd minus the correctly computed amount and posted as a negative amount.
      A C&I line may be corrected only when the customer disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
      The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
      Each billed C&I line may be corrected only once.
      A care agent may post a rebill credit up to agent_adjustment_limit_usd per line; a larger correction is outside care-desk authority, is not posted, and is handed to a human representative with reason POLICY_NOT_COVERED.
      Tag revisions by the grid operator and interval data corrections by the utility are not billing errors.
    eligibility:
      - id: cni_dispute_lookback
        applies_to: [cni_adjustment]
        kind: time
        condition: A C&I line may be corrected only when the customer disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
        evidence_fields: [cni_billing.posted_date, cni_billing.cni_billing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_billing.cni_billing_id]
          action_bindings:
            cni_billing.cni_billing_id: source_billing_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the line was posted
          anchor_source: cni_billing.posted_date
          relation: not_after
          duration_source: variants.billing_dispute_lookback_months
          unit: calendar_months
          counting_rule: The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
          boundary: inclusive
      - id: cni_one_correction_per_line
        applies_to: [cni_adjustment]
        kind: dedup
        condition: Each billed C&I line may be corrected only once.
        evidence_fields: [cni_billing.source_billing_id, cni_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cni_billing.source_billing_id]
          action_bindings:
            cni_billing.source_billing_id: source_billing_id
        dedup_contract:
          table: cni_billing
          mode: separate_record
          object_bindings: {source_billing_id: source_billing_id}
          duplicate_filters: {line_type: [rebill_credit]}
          distinct_fields: []

extended_policies:
  - id: cni_ext_termination_security
    base_policy_refs: [cni_agg_deposit_cap, cni_security_deposit]
    overwrite:
      - base_policy: cni_security_deposit
        superseded_clause: >-
          A security deposit is recorded only on a contract that is pending_enrollment or active.
        replaced_by: >-
          Termination security is recorded on a contract in termination_pending status whose termination came from written notice during the term, and the business's authorized signatory remits it from the business's own account.
      - base_policy: cni_agg_deposit_cap
        superseded_clause: >-
          The deposit required for a contract is deposit_months_by_grade for the customer's commercial_credit_grade times the facility's annual_kwh_usage times deposit_reference_rate_cents_kwh divided by cents_months_divisor, rounded per charge_rounding.
        replaced_by: >-
          The termination security required on a terminating contract is its damages portion plus its supply portion, that sum reduced by the termination security's gas relationship relief; the amount remitted is that requirement less the security deposits held on the contract (deposits posted less deposits refunded), rounded half up to the cent only at that last step, and nothing is remitted when the deposits held already cover the requirement.
      - base_policy: cni_agg_deposit_cap
        superseded_clause: >-
          A grade with 0 months requires no deposit.
        replaced_by: >-
          The termination security's damages portion is scaled by the grade recorded on the contract's posted security deposit, which is the commercial credit grade used when the contract was executed and not the grade on the customer profile today: a deposit recording grade A scales the damages by damages_share_grade_a, a deposit recording grade B scales them by damages_share_grade_b, and a deposit recording grade C or not_rated, or no posted deposit, leaves them in full.
    trigger: state_due
    subject: [cni_deposit_post]
    computes: amount_usd
    target_tool: post_termination_security_b7051944
    params:
      days_per_cycle: 30
      damages_share_grade_a: 0.50
      damages_share_grade_b: 0.75
      notice_long_days: 75
      notice_mid_days: 45
      notice_relief_long: 0.80
      notice_relief_mid: 0.90
      full_history_cycles: 12
      short_history_cycles: 3
      tenure_long_months: 36
      tenure_mid_months: 12
      coverage_long: 0.80
      coverage_mid: 0.90
      gas_cycles_full: 12
      gas_cycles_part: 6
      gas_relief_full: 0.15
      gas_relief_part: 0.08
    rule: >-
      Termination security protects Beacon Ridge while a business that gave written notice to end a contract early still owes the damages billed on it and the supply it takes until the termination effective date.
      Termination security is recorded on a contract in termination_pending status whose termination came from written notice during the term, and the business's authorized signatory remits it from the business's own account.
      The termination security is fixed only after the bill of the terminating contract carries its early termination fee line.
      The termination security is not worked out until every contract of the same business that closed before its supply began carries its early termination fee line.
      The termination security required on a terminating contract is its damages portion plus its supply portion, that sum reduced by the termination security's gas relationship relief; the amount remitted is that requirement less the security deposits held on the contract (deposits posted less deposits refunded), rounded half up to the cent only at that last step, and nothing is remitted when the deposits held already cover the requirement.
      The damages portion of the termination security is the early termination fee billed on the contract, in full.
      The supply portion of the termination security is its monthly supply rate times its exposure days divided by days_per_cycle.
      The monthly supply rate of the termination security is the net charges of the most recently posted billed cycle, meaning that cycle's supply lines plus any rebill credit dated to that cycle.
      The exposure days of the termination security are termination_notice_days.
      No gas relationship relief applies to the termination security.
      The termination security's damages portion is scaled by the grade recorded on the contract's posted security deposit, which is the commercial credit grade used when the contract was executed and not the grade on the customer profile today: a deposit recording grade A scales the damages by damages_share_grade_a, a deposit recording grade B scales them by damages_share_grade_b, and a deposit recording grade C or not_rated, or no posted deposit, leaves them in full.
      The termination security's damages portion is also scaled by its notice lead, the calendar days from termination_notice_date to termination_effective_date: a lead of notice_long_days days or more scales it by notice_relief_long, a lead of notice_mid_days days up to one day less than notice_long_days scales it by notice_relief_mid, and a shorter lead leaves it unscaled; the grade scale and the notice scale multiply together.
      The termination security's monthly supply rate depends on how many billed cycles were posted on the contract in the twelve months before the handling date, each cycle counted once by its energy_charge line, by its block_energy_charge line on a block and index contract, or otherwise by its index_energy_charge line: twelve or more such cycles give the twelve months' net charges (supply lines plus rebill credits posted in that window) divided by the cycles counted; three to eleven cycles, at least one of them posted in the latest three months, give the net charges posted in the latest three months divided by the cycles posted in those three months; any other count gives the net charges of the most recently posted cycle.
      The termination security's exposure days are its unbilled supply days, counted from the day after the billing_period_end of the most recently posted cycle through the day before termination_effective_date: more unbilled supply days than termination_notice_days are used as counted, no unbilled supply days at all give zero exposure days, and any other count gives termination_notice_days.
      The termination security's supply portion is scaled by the contract's supply tenure, the whole months from service_start_date to the handling date: tenure_long_months months or more scale it by coverage_long, tenure_mid_months months up to one month less than tenure_long_months scale it by coverage_mid, and a shorter tenure leaves it unscaled.
      The termination security's gas relationship relief depends on the Beacon Ridge commercial gas agreement on the same premise: an active agreement with gas_cycles_full or more energy_charge lines posted in the twelve months before the handling date gives a relief of gas_relief_full, an active agreement with gas_cycles_part up to one less than gas_cycles_full such lines gives gas_relief_part, and any other case gives no relief.
    prerequisite:
      - problem: cni_ext_noticed_termination_damages
        kind: value_input
        gate: etf_billed
        form: state
        policy_source: >-
          The termination security is fixed only after the bill of the terminating contract carries its early termination fee line.
        condition: >-
          The cni_billing ledger of the terminating contract carries a row with event_type cni_etf_charge and line_type early_termination_fee.
        resolved_by: bill_noticed_termination_damages_6fb56a64
        effect: >-
          Once the damages line is billed, the binding etf_billed changes from 0 to the damages amount and the damages portion of the termination security enters the requirement.
      - problem: cni_ext_preflow_termination_damages
        kind: state_gate
        gate: cni_billing.line_type
        form: state
        policy_source: >-
          The termination security is not worked out until every contract of the same business that closed before its supply began carries its early termination fee line.
        condition: >-
          Every cni_contracts row of the same customer with status closed and close_reason terminated_before_flow has a cni_billing row with line_type early_termination_fee.
        resolved_by: bill_preflow_termination_damages_230b7c5e
        effect: >-
          Once the damages line of each contract closed before supply is billed, the termination security may be fixed and remitted.
    cross_category:
      - category: bizgas
        as: branch
        reads: [bizgas_agreement_id, status, bizgas_billing.line_type, bizgas_billing.posted_date]
        note: The gas relationship relief tier is decided from the commercial gas agreement on the same premise and the count of its energy lines posted in the last twelve months.
    compute:
      - etf_billed: "SUM('cni_billing','amount_usd', event_type='cni_etf_charge')"
      - dep_grade: "LATEST('cni_deposits','credit_grade_basis', date_field='posted_date', event_type='cni_deposit_post')"
      - dmg_grade_share: "K('damages_share_grade_a') if dep_grade == 'A' else (K('damages_share_grade_b') if dep_grade == 'B' else 1)"
      - notice_lead: "DAYS(F('termination_notice_date'), F('termination_effective_date'))"
      - dmg_notice_share: "K('notice_relief_long') if notice_lead >= K('notice_long_days') else (K('notice_relief_mid') if notice_lead >= K('notice_mid_days') else 1)"
      - dmg_portion: "etf_billed * dmg_grade_share * dmg_notice_share"
      - sup12: "SUM('cni_billing','amount_usd', within_months=12, date_field='posted_date', event_type='cni_supply_charge')"
      - adj12: "SUM('cni_billing','amount_usd', within_months=12, date_field='posted_date', event_type='cni_adjustment')"
      - cnt_e12: "COUNT('cni_billing', within_months=12, date_field='posted_date', line_type='energy_charge')"
      - cnt_b12: "COUNT('cni_billing', within_months=12, date_field='posted_date', line_type='block_energy_charge')"
      - cnt_i12: "COUNT('cni_billing', within_months=12, date_field='posted_date', line_type='index_energy_charge')"
      - cyc12: "cnt_e12 + cnt_b12 + (cnt_i12 if cnt_b12 == 0 else 0)"
      - sup3: "SUM('cni_billing','amount_usd', within_months=3, date_field='posted_date', event_type='cni_supply_charge')"
      - adj3: "SUM('cni_billing','amount_usd', within_months=3, date_field='posted_date', event_type='cni_adjustment')"
      - cnt_e3: "COUNT('cni_billing', within_months=3, date_field='posted_date', line_type='energy_charge')"
      - cnt_b3: "COUNT('cni_billing', within_months=3, date_field='posted_date', line_type='block_energy_charge')"
      - cnt_i3: "COUNT('cni_billing', within_months=3, date_field='posted_date', line_type='index_energy_charge')"
      - cyc3: "cnt_e3 + cnt_b3 + (cnt_i3 if cnt_b3 == 0 else 0)"
      - lst_start: "LATEST('cni_billing','billing_period_start', date_field='posted_date', event_type='cni_supply_charge')"
      - lst_sup: "SUM('cni_billing','amount_usd', event_type='cni_supply_charge', billing_period_start=lst_start)"
      - lst_adj: "SUM('cni_billing','amount_usd', event_type='cni_adjustment', billing_period_start=lst_start)"
      - lst_net: "lst_sup + lst_adj"
      - monthly_rate: "(sup12 + adj12) / cyc12 if cyc12 >= K('full_history_cycles') else ((sup3 + adj3) / cyc3 if (cyc12 >= K('short_history_cycles') and cyc3 > 0) else lst_net)"
      - last_end: "LATEST('cni_billing','billing_period_end', date_field='posted_date', event_type='cni_supply_charge')"
      - unbilled_days: "DAYS(last_end, F('termination_effective_date')) - 1"
      - exp_days: "unbilled_days if unbilled_days > P('termination_notice_days') else (0 if unbilled_days <= 0 else P('termination_notice_days'))"
      - tenure: "MONTHS(F('service_start_date'), NOW)"
      - coverage: "K('coverage_long') if tenure >= K('tenure_long_months') else (K('coverage_mid') if tenure >= K('tenure_mid_months') else 1)"
      - sup_portion: "monthly_rate * exp_days / K('days_per_cycle') * coverage"
      - gas_id: "CFIELD('bizgas','bizgas_agreement_id', premise_id=F('premise_id'))"
      - gas_status: "CFIELD('bizgas','status', premise_id=F('premise_id'))"
      - gas_cycles: "XCOUNT('bizgas','bizgas_billing', within_months=12, date_field='posted_date', line_type='energy_charge', bizgas_agreement_id=gas_id)"
      - gas_relief: "K('gas_relief_full') if (gas_status == 'active' and gas_cycles >= K('gas_cycles_full')) else (K('gas_relief_part') if (gas_status == 'active' and gas_cycles >= K('gas_cycles_part')) else 0)"
      - required: "(dmg_portion + sup_portion) * (1 - gas_relief)"
      - held: "SUM('cni_deposits','amount_usd')"
      - result: "RND(MX(0, required - held), 2)"
    compute_basis:
      etf_billed: "The damages portion of the termination security is the early termination fee billed on the contract, in full."
      dep_grade: "The termination security's damages portion is scaled by the grade recorded on the contract's posted security deposit, which is the commercial credit grade used when the contract was executed and not the grade on the customer profile today"
      dmg_grade_share: "a deposit recording grade A scales the damages by damages_share_grade_a, a deposit recording grade B scales them by damages_share_grade_b, and a deposit recording grade C or not_rated, or no posted deposit, leaves them in full."
      notice_lead: "The termination security's damages portion is also scaled by its notice lead, the calendar days from termination_notice_date to termination_effective_date"
      dmg_notice_share: "a lead of notice_long_days days or more scales it by notice_relief_long, a lead of notice_mid_days days up to one day less than notice_long_days scales it by notice_relief_mid, and a shorter lead leaves it unscaled; the grade scale and the notice scale multiply together."
      sup12: "twelve or more such cycles give the twelve months' net charges (supply lines plus rebill credits posted in that window) divided by the cycles counted"
      adj12: "twelve or more such cycles give the twelve months' net charges (supply lines plus rebill credits posted in that window) divided by the cycles counted"
      cyc12: "The termination security's monthly supply rate depends on how many billed cycles were posted on the contract in the twelve months before the handling date, each cycle counted once by its energy_charge line, by its block_energy_charge line on a block and index contract, or otherwise by its index_energy_charge line"
      sup3: "three to eleven cycles, at least one of them posted in the latest three months, give the net charges posted in the latest three months divided by the cycles posted in those three months"
      cyc3: "three to eleven cycles, at least one of them posted in the latest three months, give the net charges posted in the latest three months divided by the cycles posted in those three months"
      lst_net: "The monthly supply rate of the termination security is the net charges of the most recently posted billed cycle, meaning that cycle's supply lines plus any rebill credit dated to that cycle."
      monthly_rate: "twelve or more such cycles give the twelve months' net charges (supply lines plus rebill credits posted in that window) divided by the cycles counted; three to eleven cycles, at least one of them posted in the latest three months, give the net charges posted in the latest three months divided by the cycles posted in those three months; any other count gives the net charges of the most recently posted cycle."
      unbilled_days: "The termination security's exposure days are its unbilled supply days, counted from the day after the billing_period_end of the most recently posted cycle through the day before termination_effective_date"
      exp_days: "more unbilled supply days than termination_notice_days are used as counted, no unbilled supply days at all give zero exposure days, and any other count gives termination_notice_days."
      tenure: "The termination security's supply portion is scaled by the contract's supply tenure, the whole months from service_start_date to the handling date"
      coverage: "tenure_long_months months or more scale it by coverage_long, tenure_mid_months months up to one month less than tenure_long_months scale it by coverage_mid, and a shorter tenure leaves it unscaled."
      sup_portion: "The supply portion of the termination security is its monthly supply rate times its exposure days divided by days_per_cycle."
      gas_cycles: "an active agreement with gas_cycles_full or more energy_charge lines posted in the twelve months before the handling date gives a relief of gas_relief_full"
      gas_relief: "The termination security's gas relationship relief depends on the Beacon Ridge commercial gas agreement on the same premise: an active agreement with gas_cycles_full or more energy_charge lines posted in the twelve months before the handling date gives a relief of gas_relief_full, an active agreement with gas_cycles_part up to one less than gas_cycles_full such lines gives gas_relief_part, and any other case gives no relief."
      required: "The termination security required on a terminating contract is its damages portion plus its supply portion, that sum reduced by the termination security's gas relationship relief"
      held: "the amount remitted is that requirement less the security deposits held on the contract (deposits posted less deposits refunded)"
      result: "rounded half up to the cent only at that last step, and nothing is remitted when the deposits held already cover the requirement."
    factors:
      - id: damages_grade_share
        effect: parameter
        decides: dmg_grade_share
        bindings: [dep_grade, dmg_grade_share]
        ladder:
          - when: "the contract's posted security deposit records grade A"
            value: "K('damages_share_grade_a')"
          - when: "the contract's posted security deposit records grade B"
            value: "K('damages_share_grade_b')"
          - when: "otherwise (the posted deposit records grade C or not_rated, or there is no posted deposit)"
            value: "the damages in full (1)"
        baseline:
          dmg_grade_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: damages_notice_share
        effect: parameter
        decides: dmg_notice_share
        bindings: [notice_lead, dmg_notice_share]
        ladder:
          - when: "the notice lead (termination_notice_date to termination_effective_date) is notice_long_days days or more"
            value: "K('notice_relief_long')"
          - when: "the notice lead is notice_mid_days days up to one day less than notice_long_days"
            value: "K('notice_relief_mid')"
          - when: "otherwise (a shorter notice lead)"
            value: "unscaled (1)"
        baseline:
          dmg_notice_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: monthly_supply_rate_measure
        effect: method
        decides: monthly_rate
        bindings: [sup12, adj12, cnt_e12, cnt_b12, cnt_i12, cyc12, sup3, adj3, cnt_e3, cnt_b3, cnt_i3, cyc3, lst_start, lst_sup, lst_adj, lst_net, monthly_rate]
        ladder:
          - when: "twelve or more billed cycles were posted on the contract in the twelve months before the handling date"
            method: "the twelve months' net charges (supply lines plus rebill credits posted in the window) divided by the cycles counted"
          - when: "three to eleven billed cycles were posted in those twelve months, at least one of them in the latest three months"
            method: "the net charges posted in the latest three months divided by the cycles posted in those three months"
          - when: "otherwise (fewer than three billed cycles, or none posted in the latest three months)"
            method: "the net charges of the most recently posted cycle"
        baseline:
          monthly_rate: "lst_net"
        evidence: [history]
        cross_difficulty: null
      - id: exposure_days_count
        effect: method
        decides: exp_days
        bindings: [last_end, unbilled_days, exp_days]
        ladder:
          - when: "the unbilled supply days (day after the latest posted cycle's billing_period_end through the day before termination_effective_date) exceed termination_notice_days"
            method: "the unbilled supply days as counted"
          - when: "there are no unbilled supply days (the final cycle is already billed)"
            method: "zero exposure days"
          - when: "otherwise"
            method: "termination_notice_days"
        baseline:
          exp_days: "P('termination_notice_days')"
        evidence: [history, date]
        cross_difficulty: null
      - id: supply_tenure_coverage
        effect: parameter
        decides: coverage
        bindings: [tenure, coverage]
        ladder:
          - when: "supply tenure (whole months from service_start_date to the handling date) of tenure_long_months months or more"
            value: "K('coverage_long')"
          - when: "supply tenure of tenure_mid_months months up to one month less than tenure_long_months"
            value: "K('coverage_mid')"
          - when: "otherwise (a shorter tenure)"
            value: "unscaled (1)"
        baseline:
          coverage: "1"
        evidence: [date]
        cross_difficulty: null
      - id: gas_relationship_relief
        effect: parameter
        decides: gas_relief
        bindings: [gas_id, gas_status, gas_cycles, gas_relief]
        ladder:
          - when: "the commercial gas agreement on the same premise is active and has gas_cycles_full or more energy_charge lines posted in the last twelve months"
            value: "K('gas_relief_full')"
          - when: "the commercial gas agreement on the same premise is active and has gas_cycles_part up to one less than gas_cycles_full such lines"
            value: "K('gas_relief_part')"
          - when: "otherwise"
            value: "no relief (0)"
        baseline:
          gas_relief: "0"
        evidence: [cross_category, history]
        cross_difficulty: bizgas
    baseline:
      rule: >-
        The termination security required on a terminating contract is its damages portion plus its supply portion, that sum reduced by the termination security's gas relationship relief; the amount remitted is that requirement less the security deposits held on the contract (deposits posted less deposits refunded), rounded half up to the cent only at that last step, and nothing is remitted when the deposits held already cover the requirement.
        The damages portion of the termination security is the early termination fee billed on the contract, in full.
        The supply portion of the termination security is its monthly supply rate times its exposure days divided by days_per_cycle.
        The monthly supply rate of the termination security is the net charges of the most recently posted billed cycle, meaning that cycle's supply lines plus any rebill credit dated to that cycle.
        The exposure days of the termination security are termination_notice_days.
        No gas relationship relief applies to the termination security.
      params: [days_per_cycle, termination_notice_days]
    inputs:
      history:
        - {table: cni_billing, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: cni_supply_charge}}
        - {table: cni_billing, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: cni_adjustment}}
        - {table: cni_billing, aggregate: count, field: line_type, within_months: 12, filters: {line_type: energy_charge}}
        - {table: cni_billing, aggregate: sum, field: amount_usd, within_months: 3, filters: {event_type: cni_supply_charge}}
        - {table: cni_billing, aggregate: latest, field: billing_period_end, filters: {event_type: cni_supply_charge}}
        - {table: cni_billing, aggregate: sum, field: amount_usd, filters: {event_type: cni_etf_charge}}
        - {table: cni_deposits, aggregate: latest, field: credit_grade_basis, filters: {event_type: cni_deposit_post}}
        - {table: cni_deposits, aggregate: sum, field: amount_usd, filters: {}}
        - {category: bizgas, table: bizgas_billing, aggregate: count, field: line_type, within_months: 12, filters: {line_type: energy_charge}}
      cross_category: [bizgas]
  - id: cni_ext_noticed_termination_damages
    base_policy_refs: [cni_etf, cni_termination]
    overwrite:
      - base_policy: cni_etf
        superseded_clause: >-
          Otherwise remaining months are twelve times the difference in years plus the difference in months between the termination date and contract_end_date, plus one when the day of month of contract_end_date is later than the day of month of the termination date.
        replaced_by: >-
          The months counted for a noticed termination depend on whether the term ends with a partial month and on the notice lead of the noticed termination, the calendar days from termination_notice_date to termination_effective_date: with a partial final month and a notice lead of long_notice_days days or more, only the whole months are counted; with a partial final month and a shorter notice lead, the whole months plus half_month are counted; otherwise the months are counted as stated above.
      - base_policy: cni_etf
        superseded_clause: >-
          etf_remaining_kwh is the facility's annual_kwh_usage times the remaining months divided by months_per_year, rounded half up to a whole kWh, and the fee is etf_remaining_kwh times etf_rate_usd_per_kwh, rounded per charge_rounding, but not less than etf_minimum_usd.
        replaced_by: >-
          The annual kWh of a noticed termination are the kWh billed on the contract's supply lines posted in the twelve months before the handling date.
    trigger: state_due
    subject: [cni_etf_charge]
    computes: amount_usd
    target_tool: bill_noticed_termination_damages_6fb56a64
    params:
      months_per_year: 12
      two_years_months: 24
      short_term_share: 0.70
      mid_term_share: 0.85
      full_history_cycles: 12
      quarters_per_year: 4
      trend_floor: 0.80
      long_notice_days: 60
      half_month: 0.5
      early_renewal_days: 60
      early_renewal_share: 0.90
      late_renewal_share: 0.95
      gas_kept_share: 0.92
      gas_dropping_share: 0.96
      hours_per_year: 8760
      high_load_factor: 0.70
      mid_load_factor: 0.50
      high_load_factor_share: 0.90
      mid_load_factor_share: 0.95
    rule: >-
      Liquidated damages on a noticed early termination are billed on a contract whose authorized signatory gave written notice to end it during its term and which is in termination_pending status, as one early termination fee line per contract.
      The damages of a noticed termination are its damages kWh times its damages rate, rounded half up to the cent only at that step, but not less than etf_minimum_usd.
      The damages kWh of a noticed termination are its annual kWh times its months counted divided by months_per_year, rounded half up to a whole kWh, and that figure is billed as etf_remaining_kwh.
      The annual kWh of a noticed termination are the kWh billed on the contract's supply lines posted in the twelve months before the handling date.
      The months counted for a noticed termination are twelve times the difference in years plus the difference in months between termination_effective_date and contract_end_date, plus one when the day of month of contract_end_date is later than the day of month of termination_effective_date.
      The damages rate of a noticed termination is the structure's etf_rate_usd_per_kwh.
      The damages rate of a noticed termination is scaled by the whole months left in its term, counted from termination_effective_date to contract_end_date with a partial final month left out: fewer than months_per_year whole months scale it by short_term_share, months_per_year up to one less than two_years_months whole months scale it by mid_term_share, and two_years_months or more leave it unscaled.
      The annual kWh of a noticed termination follow the facility's recent load: when twelve or more billed cycles were posted in the twelve months before the handling date, each cycle counted once by its energy_charge line, by its block_energy_charge line on a block and index contract, or otherwise by its index_energy_charge line, and the kWh posted in the latest three months times quarters_per_year fall below trend_floor of the twelve months' kWh, the annual kWh are the latest three months' kWh times quarters_per_year; when at least one but fewer than twelve such cycles were posted, they are the twelve months' kWh divided by the cycles counted times full_history_cycles; otherwise they are the twelve months' kWh.
      The months counted for a noticed termination depend on whether the term ends with a partial month and on the notice lead of the noticed termination, the calendar days from termination_notice_date to termination_effective_date: with a partial final month and a notice lead of long_notice_days days or more, only the whole months are counted; with a partial final month and a shorter notice lead, the whole months plus half_month are counted; otherwise the months are counted as stated above.
      The damages rate of a noticed termination is scaled by the contract's renewal history: a contract whose current term began through a renewal signed early_renewal_days days or more before term_start_date scales it by early_renewal_share, a contract whose current term began through a renewal signed fewer days before term_start_date scales it by late_renewal_share, and a contract never renewed leaves it unscaled.
      The damages rate of a noticed termination is scaled by the Beacon Ridge commercial gas agreement on the same premise: an active gas agreement with no drop requested scales it by gas_kept_share, a gas agreement in drop_pending status with a drop requested scales it by gas_dropping_share, and any other case, including no gas agreement on the premise, leaves it unscaled.
      The damages rate of a noticed termination is scaled by the facility's load factor, the twelve months' kWh divided by the product of the capacity tag on the most recently posted capacity_charge line and hours_per_year: a load factor of high_load_factor or more scales it by high_load_factor_share, a load factor from mid_load_factor up to below high_load_factor scales it by mid_load_factor_share, and a lower load factor, or no capacity_charge line, leaves it unscaled.
      The scales applied to the damages rate of a noticed termination multiply together into one rate, which then multiplies the damages kWh.
    prerequisite: []
    cross_category:
      - category: bizgas
        as: branch
        reads: [status, drop_requested_date]
        note: The gas agreement tier of the damages rate is decided from the status and drop request of the commercial gas agreement on the same premise.
    compute:
      - term_date: "F('termination_effective_date')"
      - months_std: "0 - MONTHS(F('contract_end_date'), term_date)"
      - months_whole: "MONTHS(term_date, F('contract_end_date'))"
      - notice_lead: "DAYS(F('termination_notice_date'), term_date)"
      - months_counted: "months_whole if (months_std > months_whole and notice_lead >= K('long_notice_days')) else (months_whole + K('half_month') if (months_std > months_whole and notice_lead < K('long_notice_days')) else months_std)"
      - kwh12: "SUM('cni_billing','usage_kwh', within_months=12, date_field='posted_date', event_type='cni_supply_charge')"
      - kwh3: "SUM('cni_billing','usage_kwh', within_months=3, date_field='posted_date', event_type='cni_supply_charge')"
      - cnt_e12: "COUNT('cni_billing', within_months=12, date_field='posted_date', line_type='energy_charge')"
      - cnt_b12: "COUNT('cni_billing', within_months=12, date_field='posted_date', line_type='block_energy_charge')"
      - cnt_i12: "COUNT('cni_billing', within_months=12, date_field='posted_date', line_type='index_energy_charge')"
      - cyc12: "cnt_e12 + cnt_b12 + (cnt_i12 if cnt_b12 == 0 else 0)"
      - annual_kwh: "kwh3 * K('quarters_per_year') if (cyc12 >= K('full_history_cycles') and kwh3 * K('quarters_per_year') < K('trend_floor') * kwh12) else (kwh12 / cyc12 * K('full_history_cycles') if (cyc12 > 0 and cyc12 < K('full_history_cycles')) else kwh12)"
      - rem_kwh: "int(annual_kwh * months_counted / K('months_per_year') + 0.5)"
      - term_left: "MONTHS(term_date, F('contract_end_date'))"
      - term_share: "K('short_term_share') if term_left < K('months_per_year') else (K('mid_term_share') if term_left < K('two_years_months') else 1)"
      - renewal_lead: "DAYS(F('renewal_signed_date'), F('term_start_date')) if F('renewal_signed_date') else -1"
      - loyalty_share: "K('early_renewal_share') if renewal_lead >= K('early_renewal_days') else (K('late_renewal_share') if renewal_lead >= 0 else 1)"
      - gas_status: "CFIELD('bizgas','status', premise_id=F('premise_id'))"
      - gas_drop: "CFIELD('bizgas','drop_requested_date', premise_id=F('premise_id'))"
      - gas_share: "K('gas_kept_share') if (gas_status == 'active' and gas_drop == '') else (K('gas_dropping_share') if (gas_status == 'drop_pending' and gas_drop != '') else 1)"
      - cap_tag: "LATEST('cni_billing','tag_kw', date_field='posted_date', event_type='cni_supply_charge', line_type='capacity_charge')"
      - load_factor: "kwh12 / (cap_tag * K('hours_per_year')) if cap_tag else 0"
      - lf_share: "K('high_load_factor_share') if load_factor >= K('high_load_factor') else (K('mid_load_factor_share') if load_factor >= K('mid_load_factor') else 1)"
      - rate_eff: "P('etf_rate_usd_per_kwh') * term_share * loyalty_share * gas_share * lf_share"
      - result: "MX(P('etf_minimum_usd'), RND(rem_kwh * rate_eff, 2))"
    compute_basis:
      term_date: "The months counted for a noticed termination are twelve times the difference in years plus the difference in months between termination_effective_date and contract_end_date"
      months_std: "The months counted for a noticed termination are twelve times the difference in years plus the difference in months between termination_effective_date and contract_end_date, plus one when the day of month of contract_end_date is later than the day of month of termination_effective_date."
      months_whole: "with a partial final month and a notice lead of long_notice_days days or more, only the whole months are counted"
      notice_lead: "the notice lead of the noticed termination, the calendar days from termination_notice_date to termination_effective_date"
      months_counted: "with a partial final month and a notice lead of long_notice_days days or more, only the whole months are counted; with a partial final month and a shorter notice lead, the whole months plus half_month are counted; otherwise the months are counted as stated above."
      kwh12: "The annual kWh of a noticed termination are the kWh billed on the contract's supply lines posted in the twelve months before the handling date."
      kwh3: "the kWh posted in the latest three months times quarters_per_year fall below trend_floor of the twelve months' kWh"
      cyc12: "when twelve or more billed cycles were posted in the twelve months before the handling date, each cycle counted once by its energy_charge line, by its block_energy_charge line on a block and index contract, or otherwise by its index_energy_charge line"
      annual_kwh: "the annual kWh are the latest three months' kWh times quarters_per_year; when at least one but fewer than twelve such cycles were posted, they are the twelve months' kWh divided by the cycles counted times full_history_cycles; otherwise they are the twelve months' kWh."
      rem_kwh: "The damages kWh of a noticed termination are its annual kWh times its months counted divided by months_per_year, rounded half up to a whole kWh, and that figure is billed as etf_remaining_kwh."
      term_left: "The damages rate of a noticed termination is scaled by the whole months left in its term, counted from termination_effective_date to contract_end_date with a partial final month left out"
      term_share: "fewer than months_per_year whole months scale it by short_term_share, months_per_year up to one less than two_years_months whole months scale it by mid_term_share, and two_years_months or more leave it unscaled."
      renewal_lead: "a contract whose current term began through a renewal signed early_renewal_days days or more before term_start_date scales it by early_renewal_share"
      loyalty_share: "The damages rate of a noticed termination is scaled by the contract's renewal history: a contract whose current term began through a renewal signed early_renewal_days days or more before term_start_date scales it by early_renewal_share, a contract whose current term began through a renewal signed fewer days before term_start_date scales it by late_renewal_share, and a contract never renewed leaves it unscaled."
      gas_status: "The damages rate of a noticed termination is scaled by the Beacon Ridge commercial gas agreement on the same premise"
      gas_drop: "an active gas agreement with no drop requested scales it by gas_kept_share, a gas agreement in drop_pending status with a drop requested scales it by gas_dropping_share"
      gas_share: "an active gas agreement with no drop requested scales it by gas_kept_share, a gas agreement in drop_pending status with a drop requested scales it by gas_dropping_share, and any other case, including no gas agreement on the premise, leaves it unscaled."
      cap_tag: "the twelve months' kWh divided by the product of the capacity tag on the most recently posted capacity_charge line and hours_per_year"
      load_factor: "The damages rate of a noticed termination is scaled by the facility's load factor, the twelve months' kWh divided by the product of the capacity tag on the most recently posted capacity_charge line and hours_per_year"
      lf_share: "a load factor of high_load_factor or more scales it by high_load_factor_share, a load factor from mid_load_factor up to below high_load_factor scales it by mid_load_factor_share, and a lower load factor, or no capacity_charge line, leaves it unscaled."
      rate_eff: "The scales applied to the damages rate of a noticed termination multiply together into one rate, which then multiplies the damages kWh."
      result: "The damages of a noticed termination are its damages kWh times its damages rate, rounded half up to the cent only at that step, but not less than etf_minimum_usd."
    factors:
      - id: remaining_term_rate_share
        effect: parameter
        decides: term_share
        bindings: [term_left, term_share]
        ladder:
          - when: "fewer than months_per_year whole months left from termination_effective_date to contract_end_date"
            value: "K('short_term_share')"
          - when: "months_per_year up to one less than two_years_months whole months left"
            value: "K('mid_term_share')"
          - when: "otherwise (two_years_months or more whole months left)"
            value: "unscaled (1)"
        baseline:
          term_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: annual_kwh_load_trend
        effect: method
        decides: annual_kwh
        bindings: [kwh3, cnt_e12, cnt_b12, cnt_i12, cyc12, annual_kwh]
        ladder:
          - when: "twelve or more billed cycles posted in the last twelve months and the latest three months' kWh times quarters_per_year below trend_floor of the twelve months' kWh"
            method: "the latest three months' kWh times quarters_per_year"
          - when: "at least one but fewer than twelve billed cycles posted in the last twelve months"
            method: "the twelve months' kWh divided by the cycles counted, times full_history_cycles"
          - when: "otherwise"
            method: "the twelve months' kWh as billed"
        baseline:
          annual_kwh: "kwh12"
        evidence: [history]
        cross_difficulty: null
      - id: partial_month_count
        effect: method
        decides: months_counted
        bindings: [months_whole, notice_lead, months_counted]
        ladder:
          - when: "the term ends with a partial month and the notice lead is long_notice_days days or more"
            method: "only the whole months are counted"
          - when: "the term ends with a partial month and the notice lead is shorter"
            method: "the whole months plus half_month"
          - when: "otherwise"
            method: "the months as counted with a partial final month counted as one"
        baseline:
          months_counted: "months_std"
        evidence: [date]
        cross_difficulty: null
      - id: renewal_history_share
        effect: parameter
        decides: loyalty_share
        bindings: [renewal_lead, loyalty_share]
        ladder:
          - when: "the current term began through a renewal signed early_renewal_days days or more before term_start_date"
            value: "K('early_renewal_share')"
          - when: "the current term began through a renewal signed fewer days before term_start_date"
            value: "K('late_renewal_share')"
          - when: "otherwise (never renewed)"
            value: "unscaled (1)"
        baseline:
          loyalty_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: gas_agreement_share
        effect: parameter
        decides: gas_share
        bindings: [gas_status, gas_drop, gas_share]
        ladder:
          - when: "the commercial gas agreement on the same premise is active and no drop is requested"
            value: "K('gas_kept_share')"
          - when: "the commercial gas agreement on the same premise is drop_pending with a drop requested"
            value: "K('gas_dropping_share')"
          - when: "otherwise (including no gas agreement on the premise)"
            value: "unscaled (1)"
        baseline:
          gas_share: "1"
        evidence: [cross_category]
        cross_difficulty: bizgas
      - id: load_factor_share
        effect: parameter
        decides: lf_share
        bindings: [cap_tag, load_factor, lf_share]
        ladder:
          - when: "load factor of high_load_factor or more"
            value: "K('high_load_factor_share')"
          - when: "load factor from mid_load_factor up to below high_load_factor"
            value: "K('mid_load_factor_share')"
          - when: "otherwise (lower load factor, or no capacity_charge line)"
            value: "unscaled (1)"
        baseline:
          lf_share: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The damages of a noticed termination are its damages kWh times its damages rate, rounded half up to the cent only at that step, but not less than etf_minimum_usd.
        The damages kWh of a noticed termination are its annual kWh times its months counted divided by months_per_year, rounded half up to a whole kWh, and that figure is billed as etf_remaining_kwh.
        The annual kWh of a noticed termination are the kWh billed on the contract's supply lines posted in the twelve months before the handling date.
        The months counted for a noticed termination are twelve times the difference in years plus the difference in months between termination_effective_date and contract_end_date, plus one when the day of month of contract_end_date is later than the day of month of termination_effective_date.
        The damages rate of a noticed termination is the structure's etf_rate_usd_per_kwh.
      params: [months_per_year, etf_rate_usd_per_kwh, etf_minimum_usd]
    inputs:
      history:
        - {table: cni_billing, aggregate: sum, field: usage_kwh, within_months: 12, filters: {event_type: cni_supply_charge}}
        - {table: cni_billing, aggregate: sum, field: usage_kwh, within_months: 3, filters: {event_type: cni_supply_charge}}
        - {table: cni_billing, aggregate: count, field: line_type, within_months: 12, filters: {line_type: energy_charge}}
        - {table: cni_billing, aggregate: latest, field: tag_kw, filters: {line_type: capacity_charge}}
      cross_category: [bizgas]
  - id: cni_ext_preflow_termination_damages
    base_policy_refs: [cni_etf, cni_termination]
    overwrite:
      - base_policy: cni_etf
        superseded_clause: >-
          for a pre-flow termination all term_months count as remaining, per etf_preflow_basis.
        replaced_by: >-
          The months counted for a termination before supply depend on how far the enrollment had gone: a contract with no utility_confirmation_date and no security deposit posted, whose enrollment was therefore never submitted to the utility, counts at most unsubmitted_months of its term_months; a contract with a security deposit posted but no utility_confirmation_date counts at most submitted_months of its term_months; a contract the utility had confirmed counts its full term_months.
      - base_policy: cni_termination
        superseded_clause: >-
          the early termination fee is computed on the full term per etf_preflow_basis.
        replaced_by: >-
          The months counted for a termination before supply depend on how far the enrollment had gone: a contract with no utility_confirmation_date and no security deposit posted, whose enrollment was therefore never submitted to the utility, counts at most unsubmitted_months of its term_months; a contract with a security deposit posted but no utility_confirmation_date counts at most submitted_months of its term_months; a contract the utility had confirmed counts its full term_months.
      - base_policy: cni_etf
        superseded_clause: >-
          etf_remaining_kwh is the facility's annual_kwh_usage times the remaining months divided by months_per_year, rounded half up to a whole kWh, and the fee is etf_remaining_kwh times etf_rate_usd_per_kwh, rounded per charge_rounding, but not less than etf_minimum_usd.
        replaced_by: >-
          The annual kWh of a termination before supply are the structure's min_annual_kwh.
    trigger: state_due
    subject: [cni_etf_charge]
    computes: amount_usd
    target_tool: bill_preflow_termination_damages_230b7c5e
    params:
      months_per_year: 12
      full_history_cycles: 12
      min_history_cycles: 3
      unsubmitted_months: 12
      submitted_months: 18
      quick_cancel_days: 14
      early_cancel_days: 45
      quick_cancel_share: 0.50
      early_cancel_share: 0.75
      site_kept_relief: 0.25
      site_leaving_relief: 0.10
    rule: >-
      Liquidated damages on a termination before supply are billed on a contract the business signed and then terminated before Beacon Ridge supply began, which is closed with close_reason terminated_before_flow, as one early termination fee line per contract.
      The damages of a termination before supply are its damages kWh times the structure's etf_rate_usd_per_kwh, rounded half up to the cent only at that step, but not less than etf_minimum_usd.
      The damages kWh of a termination before supply are its annual kWh times its months counted divided by months_per_year, rounded half up to a whole kWh, and that figure is billed as etf_remaining_kwh.
      The annual kWh of a termination before supply are the structure's min_annual_kwh.
      The months counted for a termination before supply are the contract's term_months.
      The annual kWh of a termination before supply come from the Beacon Ridge small business electricity agreement on the same premise when that agreement has billing history: full_history_cycles or more energy_charge lines posted on it in the twelve months before the handling date give the kWh of those lines; min_history_cycles up to one less than full_history_cycles such lines give their kWh divided by their count times full_history_cycles; fewer lines, or no small business agreement on the premise, give the structure's min_annual_kwh.
      The months counted for a termination before supply depend on how far the enrollment had gone: a contract with no utility_confirmation_date and no security deposit posted, whose enrollment was therefore never submitted to the utility, counts at most unsubmitted_months of its term_months; a contract with a security deposit posted but no utility_confirmation_date counts at most submitted_months of its term_months; a contract the utility had confirmed counts its full term_months.
      The damages of a termination before supply are scaled by its cancellation lead, the calendar days from contract_signed_date to termination_notice_date: quick_cancel_days days or fewer scale them by quick_cancel_share, more than quick_cancel_days up to early_cancel_days days scale them by early_cancel_share, and a longer lead leaves them unscaled.
      The damages of a termination before supply are reduced by its site retention relief: when the Beacon Ridge small business electricity agreement on the same premise is active with no drop requested, the relief is site_kept_relief of the scaled damages; when that agreement is in drop_pending status with a drop requested, the relief is site_leaving_relief; any other case gives no relief.
      The cancellation scale multiplies the damages kWh times the structure's rate, the retention relief then removes its share of that scaled amount, and only that result is rounded and compared with etf_minimum_usd.
    prerequisite: []
    cross_category:
      - category: bizpower
        as: history
        reads: [bizpower_agreement_id, status, drop_requested_date, bizpower_billing.usage_kwh, bizpower_billing.line_type, bizpower_billing.posted_date]
        note: The annual kWh method and the site retention relief are decided from the small business electricity agreement on the same premise, its status and drop request, and the kWh on its energy lines posted in the last twelve months.
    compute:
      - bp_id: "CFIELD('bizpower','bizpower_agreement_id', premise_id=F('premise_id'))"
      - bp_cycles: "XCOUNT('bizpower','bizpower_billing', within_months=12, date_field='posted_date', line_type='energy_charge', bizpower_agreement_id=bp_id)"
      - bp_kwh: "XSUM('bizpower','bizpower_billing','usage_kwh', within_months=12, date_field='posted_date', line_type='energy_charge', bizpower_agreement_id=bp_id)"
      - annual_kwh: "bp_kwh if bp_cycles >= K('full_history_cycles') else (bp_kwh / bp_cycles * K('full_history_cycles') if bp_cycles >= K('min_history_cycles') else P('min_annual_kwh'))"
      - deposits_posted: "COUNT('cni_deposits', event_type='cni_deposit_post')"
      - confirmed: "F('utility_confirmation_date')"
      - months_counted: "MN(F('term_months'), K('unsubmitted_months')) if (confirmed == '' and deposits_posted == 0) else (MN(F('term_months'), K('submitted_months')) if (confirmed == '' and deposits_posted > 0) else F('term_months'))"
      - rem_kwh: "int(annual_kwh * months_counted / K('months_per_year') + 0.5)"
      - cancel_lead: "DAYS(F('contract_signed_date'), F('termination_notice_date'))"
      - lead_share: "K('quick_cancel_share') if cancel_lead <= K('quick_cancel_days') else (K('early_cancel_share') if cancel_lead <= K('early_cancel_days') else 1)"
      - bp_status: "CFIELD('bizpower','status', premise_id=F('premise_id'))"
      - bp_drop: "CFIELD('bizpower','drop_requested_date', premise_id=F('premise_id'))"
      - retention_relief: "K('site_kept_relief') if (bp_status == 'active' and bp_drop == '') else (K('site_leaving_relief') if (bp_status == 'drop_pending' and bp_drop != '') else 0)"
      - result: "MX(P('etf_minimum_usd'), RND(rem_kwh * P('etf_rate_usd_per_kwh') * lead_share * (1 - retention_relief), 2))"
    compute_basis:
      bp_id: "The annual kWh of a termination before supply come from the Beacon Ridge small business electricity agreement on the same premise when that agreement has billing history"
      bp_cycles: "full_history_cycles or more energy_charge lines posted on it in the twelve months before the handling date give the kWh of those lines"
      bp_kwh: "full_history_cycles or more energy_charge lines posted on it in the twelve months before the handling date give the kWh of those lines"
      annual_kwh: "full_history_cycles or more energy_charge lines posted on it in the twelve months before the handling date give the kWh of those lines; min_history_cycles up to one less than full_history_cycles such lines give their kWh divided by their count times full_history_cycles; fewer lines, or no small business agreement on the premise, give the structure's min_annual_kwh."
      deposits_posted: "a contract with no utility_confirmation_date and no security deposit posted, whose enrollment was therefore never submitted to the utility, counts at most unsubmitted_months of its term_months"
      confirmed: "a contract with a security deposit posted but no utility_confirmation_date counts at most submitted_months of its term_months; a contract the utility had confirmed counts its full term_months."
      months_counted: "The months counted for a termination before supply depend on how far the enrollment had gone: a contract with no utility_confirmation_date and no security deposit posted, whose enrollment was therefore never submitted to the utility, counts at most unsubmitted_months of its term_months; a contract with a security deposit posted but no utility_confirmation_date counts at most submitted_months of its term_months; a contract the utility had confirmed counts its full term_months."
      rem_kwh: "The damages kWh of a termination before supply are its annual kWh times its months counted divided by months_per_year, rounded half up to a whole kWh, and that figure is billed as etf_remaining_kwh."
      cancel_lead: "The damages of a termination before supply are scaled by its cancellation lead, the calendar days from contract_signed_date to termination_notice_date"
      lead_share: "quick_cancel_days days or fewer scale them by quick_cancel_share, more than quick_cancel_days up to early_cancel_days days scale them by early_cancel_share, and a longer lead leaves them unscaled."
      bp_status: "when the Beacon Ridge small business electricity agreement on the same premise is active with no drop requested, the relief is site_kept_relief of the scaled damages"
      bp_drop: "when that agreement is in drop_pending status with a drop requested, the relief is site_leaving_relief; any other case gives no relief."
      retention_relief: "The damages of a termination before supply are reduced by its site retention relief: when the Beacon Ridge small business electricity agreement on the same premise is active with no drop requested, the relief is site_kept_relief of the scaled damages; when that agreement is in drop_pending status with a drop requested, the relief is site_leaving_relief; any other case gives no relief."
      result: "The cancellation scale multiplies the damages kWh times the structure's rate, the retention relief then removes its share of that scaled amount, and only that result is rounded and compared with etf_minimum_usd."
    factors:
      - id: small_business_usage_basis
        effect: method
        decides: annual_kwh
        bindings: [bp_id, bp_cycles, bp_kwh, annual_kwh]
        ladder:
          - when: "the small business electricity agreement on the same premise has full_history_cycles or more energy_charge lines posted in the last twelve months"
            method: "the kWh of those lines"
          - when: "it has min_history_cycles up to one less than full_history_cycles such lines"
            method: "their kWh divided by their count times full_history_cycles"
          - when: "otherwise (fewer lines, or no small business agreement on the premise)"
            method: "the structure's min_annual_kwh"
        baseline:
          annual_kwh: "P('min_annual_kwh')"
        evidence: [cross_category, history]
        cross_difficulty: bizpower
      - id: enrollment_stage_months
        effect: parameter
        decides: months_counted
        bindings: [deposits_posted, confirmed, months_counted]
        ladder:
          - when: "no utility_confirmation_date and no security deposit posted (enrollment never submitted)"
            value: "the cap K('unsubmitted_months') on term_months"
          - when: "a security deposit posted but no utility_confirmation_date"
            value: "the cap K('submitted_months') on term_months"
          - when: "otherwise (the utility had confirmed the enrollment)"
            value: "no cap (term_months)"
        baseline:
          months_counted: "F('term_months')"
        evidence: [history, date]
        cross_difficulty: null
      - id: cancellation_lead_share
        effect: parameter
        decides: lead_share
        bindings: [cancel_lead, lead_share]
        ladder:
          - when: "cancellation lead (contract_signed_date to termination_notice_date) of quick_cancel_days days or fewer"
            value: "K('quick_cancel_share')"
          - when: "cancellation lead of more than quick_cancel_days up to early_cancel_days days"
            value: "K('early_cancel_share')"
          - when: "otherwise (a longer lead)"
            value: "unscaled (1)"
        baseline:
          lead_share: "1"
        evidence: [date]
        cross_difficulty: null
      - id: site_retention_relief
        effect: parameter
        decides: retention_relief
        bindings: [bp_status, bp_drop, retention_relief]
        ladder:
          - when: "the small business electricity agreement on the same premise is active and no drop is requested"
            value: "K('site_kept_relief')"
          - when: "that agreement is drop_pending with a drop requested"
            value: "K('site_leaving_relief')"
          - when: "otherwise"
            value: "no relief (0)"
        baseline:
          retention_relief: "0"
        evidence: [cross_category]
        cross_difficulty: bizpower
    baseline:
      rule: >-
        The damages of a termination before supply are its damages kWh times the structure's etf_rate_usd_per_kwh, rounded half up to the cent only at that step, but not less than etf_minimum_usd.
        The damages kWh of a termination before supply are its annual kWh times its months counted divided by months_per_year, rounded half up to a whole kWh, and that figure is billed as etf_remaining_kwh.
        The annual kWh of a termination before supply are the structure's min_annual_kwh.
        The months counted for a termination before supply are the contract's term_months.
      params: [months_per_year, min_annual_kwh, etf_rate_usd_per_kwh, etf_minimum_usd]
    inputs:
      history:
        - {table: cni_deposits, aggregate: count, field: event_type, filters: {event_type: cni_deposit_post}}
        - {category: bizpower, table: bizpower_billing, aggregate: count, field: line_type, within_months: 12, filters: {line_type: energy_charge}}
        - {category: bizpower, table: bizpower_billing, aggregate: sum, field: usage_kwh, within_months: 12, filters: {line_type: energy_charge}}
      cross_category: [bizpower]
  - id: cni_ext_anniversary_security_review
    base_policy_refs: [cni_agg_deposit_cap, cni_security_deposit]
    overwrite:
      - base_policy: cni_agg_deposit_cap
        superseded_clause: >-
          The deposit required for a contract is deposit_months_by_grade for the customer's commercial_credit_grade times the facility's annual_kwh_usage times deposit_reference_rate_cents_kwh divided by cents_months_divisor, rounded per charge_rounding.
        replaced_by: >-
          The review requirement is the review months times the review's monthly exposure; the amount the review requests is the review requirement less the security deposits held on the contract (deposits posted less deposits refunded), rounded half up to the cent only at that last step, and nothing is requested when the deposits held already cover the requirement.
    trigger: state_due
    subject: [cni_deposit_post]
    computes: amount_usd
    target_tool: remit_review_deposit_f4180914
    params:
      review_window_days: 30
      months_per_year: 12
      months_grade_a: 0
      months_grade_b: 1
      months_default: 2
      full_history_cycles: 12
      short_history_cycles: 3
      index_share_high: 0.15
      index_loading_high: 1.15
      index_loading_low: 1.05
      sb_lines_wide: 24
      sb_lines_narrow: 12
      relief_wide: 0.12
      relief_narrow: 0.06
      tenure_long_months: 36
      tenure_mid_months: 12
      tolerance_long: 0.10
      tolerance_mid: 0.05
      term_short_months: 12
      term_mid_months: 24
      scale_short: 0.75
      scale_mid: 0.90
    rule: >-
      The anniversary security review re-sizes the security held on an active contract once a year, and the business's authorized signatory remits any amount the review requests from the business's own account.
      The review applies to a contract in active status whose next anniversary of service_start_date falls within review_window_days calendar days after the handling date, and it never refunds security, because a held deposit is refunded only after the contract closes.
      The review amount is fixed only after every block line posted in the review window carries a rebill credit for any part of it billed above the block price in force for its cycle.
      The review amount is not worked out until every index line posted in the review window carries a rebill credit for any part of it billed above the index price the contract allows.
      Before the review amount is worked out, every contract of the same business that closed during its term by a final bill or by another supplier's enrollment must carry its early termination fee line.
      The review window is the twelve months before the handling date, counted by the posted_date of each bill line.
      The review requirement is the review months times the review's monthly exposure; the amount the review requests is the review requirement less the security deposits held on the contract (deposits posted less deposits refunded), rounded half up to the cent only at that last step, and nothing is requested when the deposits held already cover the requirement.
      The review months are months_default.
      The review's monthly exposure is the kWh posted on the contract's supply lines in the review window times deposit_reference_rate_cents_kwh, divided by 100 and by months_per_year.
      The review months follow the grade recorded on the contract's posted security deposit, which is the commercial credit grade used when the contract was executed and not the grade on the customer profile today: a deposit recording grade A gives months_grade_a review months, a deposit recording grade B gives months_grade_b, and a deposit recording grade C or not_rated, or no posted deposit, gives months_default.
      The review's monthly exposure depends on how many billed cycles were posted in the review window, each cycle counted once by its energy_charge line, by its block_energy_charge line on a block and index contract, or otherwise by its index_energy_charge line: twelve or more such cycles give the window's net charges (supply lines plus rebill credits posted in the window) divided by the cycles counted; three to eleven cycles, at least one of them posted in the latest three months, give the net charges posted in the latest three months divided by the cycles posted in those three months; any other count gives the reference exposure stated above.
      The review requirement carries an index price loading: on a structure whose energy_price_basis is index_plus_adder or fixed_block_plus_index_balance, an index kWh share of index_share_high or more, meaning the kWh on index_energy_charge lines posted in the review window divided by all kWh posted on supply lines in the window, gives a loading of index_loading_high, and a smaller index kWh share on such a structure gives index_loading_low; any other structure carries no loading.
      The review requirement is reduced by the small business relief: sb_lines_wide or more energy_charge lines posted in the review window on the business's Beacon Ridge small business electricity agreements give a relief of relief_wide, sb_lines_narrow up to one less than sb_lines_wide such lines give relief_narrow, and fewer give no relief.
      The review requirement is scaled by the term left, the whole months from the handling date to contract_end_date: fewer than term_short_months scale it by scale_short, term_short_months up to one less than term_mid_months scale it by scale_mid, and term_mid_months or more leave it unscaled.
      The review months, the monthly exposure, the index price loading, the term-left scale and one minus the small business relief multiply together into the review requirement.
      The review tolerance is a share of the review requirement deducted from the shortfall before rounding, set by the contract's supply tenure, the whole months from service_start_date to the handling date: tenure_long_months months or more give tolerance_long, tenure_mid_months months up to one month less than tenure_long_months give tolerance_mid, and a shorter tenure gives no tolerance.
    prerequisite:
      - problem: cni_ext_passthrough_fixed_price_rebill
        kind: value_input
        gate: adj_win
        form: state
        policy_source: >-
          The review amount is fixed only after every block line posted in the review window carries a rebill credit for any part of it billed above the block price in force for its cycle.
        condition: >-
          Every block_energy_charge line of the contract posted in the review window that was billed above the block price in force for its cycle has a cni_billing row with line_type rebill_credit and source_billing_id equal to that line.
        resolved_by: credit_fixed_price_line_5b24cf0d
        effect: >-
          Once the block line credit is posted, the binding adj_win (rebill credits posted in the window) falls by the credit and the review's monthly exposure falls with it.
      - problem: cni_ext_passthrough_index_rebill
        kind: value_input
        gate: adj_win
        form: state
        policy_source: >-
          The review amount is not worked out until every index line posted in the review window carries a rebill credit for any part of it billed above the index price the contract allows.
        condition: >-
          Every index_energy_charge line of the contract posted in the review window that was billed above the index price the contract allows has a cni_billing row with line_type rebill_credit and source_billing_id equal to that line.
        resolved_by: credit_index_line_725777e6
        effect: >-
          Once the index line credit is posted, adj_win falls by that credit and the review's monthly exposure falls with it.
      - problem: cni_ext_contract_exit_damages
        kind: state_gate
        gate: cni_billing.line_type
        form: state
        policy_source: >-
          Before the review amount is worked out, every contract of the same business that closed during its term by a final bill or by another supplier's enrollment must carry its early termination fee line.
        condition: >-
          Every cni_contracts row of the same customer with status closed, close_reason final_billed or switched_to_other_supplier and close_date before contract_end_date has a cni_billing row with line_type early_termination_fee.
        resolved_by: bill_contract_exit_damages_2ce88247
        effect: >-
          Once the exit damages line is billed on each such contract, the review amount may be fixed and remitted.
    cross_category:
      - category: bizpower
        as: history
        reads: [bizpower_billing.line_type, bizpower_billing.posted_date]
        note: The small business relief tier is decided from the count of energy lines posted on the business's small business electricity agreements in the review window.
    compute:
      - dep_grade: "LATEST('cni_deposits','credit_grade_basis', date_field='posted_date', event_type='cni_deposit_post')"
      - review_months: "K('months_grade_a') if dep_grade == 'A' else (K('months_grade_b') if dep_grade == 'B' else K('months_default'))"
      - kwh_win: "SUM('cni_billing','usage_kwh', within_months=12, date_field='posted_date', event_type='cni_supply_charge')"
      - ref_exposure: "kwh_win * P('deposit_reference_rate_cents_kwh') / 100 / K('months_per_year')"
      - sup_win: "SUM('cni_billing','amount_usd', within_months=12, date_field='posted_date', event_type='cni_supply_charge')"
      - adj_win: "SUM('cni_billing','amount_usd', within_months=12, date_field='posted_date', event_type='cni_adjustment')"
      - cnt_e: "COUNT('cni_billing', within_months=12, date_field='posted_date', line_type='energy_charge')"
      - cnt_b: "COUNT('cni_billing', within_months=12, date_field='posted_date', line_type='block_energy_charge')"
      - cnt_i: "COUNT('cni_billing', within_months=12, date_field='posted_date', line_type='index_energy_charge')"
      - cyc_win: "cnt_e + cnt_b + (cnt_i if cnt_b == 0 else 0)"
      - sup_q: "SUM('cni_billing','amount_usd', within_months=3, date_field='posted_date', event_type='cni_supply_charge')"
      - adj_q: "SUM('cni_billing','amount_usd', within_months=3, date_field='posted_date', event_type='cni_adjustment')"
      - cnt_eq: "COUNT('cni_billing', within_months=3, date_field='posted_date', line_type='energy_charge')"
      - cnt_bq: "COUNT('cni_billing', within_months=3, date_field='posted_date', line_type='block_energy_charge')"
      - cnt_iq: "COUNT('cni_billing', within_months=3, date_field='posted_date', line_type='index_energy_charge')"
      - cyc_q: "cnt_eq + cnt_bq + (cnt_iq if cnt_bq == 0 else 0)"
      - exposure: "(sup_win + adj_win) / cyc_win if cyc_win >= K('full_history_cycles') else ((sup_q + adj_q) / cyc_q if (cyc_win >= K('short_history_cycles') and cyc_q > 0) else ref_exposure)"
      - idx_kwh_win: "SUM('cni_billing','usage_kwh', within_months=12, date_field='posted_date', line_type='index_energy_charge')"
      - idx_share: "idx_kwh_win / kwh_win if kwh_win else 0"
      - loading: "K('index_loading_high') if ((P('energy_price_basis') == 'index_plus_adder' or P('energy_price_basis') == 'fixed_block_plus_index_balance') and idx_share >= K('index_share_high')) else (K('index_loading_low') if ((P('energy_price_basis') == 'index_plus_adder' or P('energy_price_basis') == 'fixed_block_plus_index_balance') and idx_share < K('index_share_high')) else 1)"
      - sb_lines: "XCOUNT('bizpower','bizpower_billing', within_months=12, date_field='posted_date', line_type='energy_charge')"
      - relief: "K('relief_wide') if sb_lines >= K('sb_lines_wide') else (K('relief_narrow') if sb_lines >= K('sb_lines_narrow') else 0)"
      - term_left: "MONTHS(NOW, F('contract_end_date'))"
      - term_scale: "K('scale_short') if term_left < K('term_short_months') else (K('scale_mid') if term_left < K('term_mid_months') else 1)"
      - requirement: "review_months * exposure * loading * term_scale * (1 - relief)"
      - tenure: "MONTHS(F('service_start_date'), NOW)"
      - tolerance: "K('tolerance_long') if tenure >= K('tenure_long_months') else (K('tolerance_mid') if tenure >= K('tenure_mid_months') else 0)"
      - held: "SUM('cni_deposits','amount_usd')"
      - result: "RND(MX(0, requirement - held - tolerance * requirement), 2)"
    compute_basis:
      dep_grade: "The review months follow the grade recorded on the contract's posted security deposit, which is the commercial credit grade used when the contract was executed and not the grade on the customer profile today"
      review_months: "a deposit recording grade A gives months_grade_a review months, a deposit recording grade B gives months_grade_b, and a deposit recording grade C or not_rated, or no posted deposit, gives months_default."
      kwh_win: "The review's monthly exposure is the kWh posted on the contract's supply lines in the review window times deposit_reference_rate_cents_kwh, divided by 100 and by months_per_year."
      ref_exposure: "The review's monthly exposure is the kWh posted on the contract's supply lines in the review window times deposit_reference_rate_cents_kwh, divided by 100 and by months_per_year."
      sup_win: "twelve or more such cycles give the window's net charges (supply lines plus rebill credits posted in the window) divided by the cycles counted"
      adj_win: "twelve or more such cycles give the window's net charges (supply lines plus rebill credits posted in the window) divided by the cycles counted"
      cyc_win: "The review's monthly exposure depends on how many billed cycles were posted in the review window, each cycle counted once by its energy_charge line, by its block_energy_charge line on a block and index contract, or otherwise by its index_energy_charge line"
      sup_q: "three to eleven cycles, at least one of them posted in the latest three months, give the net charges posted in the latest three months divided by the cycles posted in those three months"
      cyc_q: "three to eleven cycles, at least one of them posted in the latest three months, give the net charges posted in the latest three months divided by the cycles posted in those three months"
      exposure: "twelve or more such cycles give the window's net charges (supply lines plus rebill credits posted in the window) divided by the cycles counted; three to eleven cycles, at least one of them posted in the latest three months, give the net charges posted in the latest three months divided by the cycles posted in those three months; any other count gives the reference exposure stated above."
      idx_kwh_win: "an index kWh share of index_share_high or more, meaning the kWh on index_energy_charge lines posted in the review window divided by all kWh posted on supply lines in the window"
      idx_share: "an index kWh share of index_share_high or more, meaning the kWh on index_energy_charge lines posted in the review window divided by all kWh posted on supply lines in the window"
      loading: "The review requirement carries an index price loading: on a structure whose energy_price_basis is index_plus_adder or fixed_block_plus_index_balance, an index kWh share of index_share_high or more, meaning the kWh on index_energy_charge lines posted in the review window divided by all kWh posted on supply lines in the window, gives a loading of index_loading_high, and a smaller index kWh share on such a structure gives index_loading_low; any other structure carries no loading."
      sb_lines: "sb_lines_wide or more energy_charge lines posted in the review window on the business's Beacon Ridge small business electricity agreements give a relief of relief_wide"
      relief: "The review requirement is reduced by the small business relief: sb_lines_wide or more energy_charge lines posted in the review window on the business's Beacon Ridge small business electricity agreements give a relief of relief_wide, sb_lines_narrow up to one less than sb_lines_wide such lines give relief_narrow, and fewer give no relief."
      term_left: "The review requirement is scaled by the term left, the whole months from the handling date to contract_end_date"
      term_scale: "fewer than term_short_months scale it by scale_short, term_short_months up to one less than term_mid_months scale it by scale_mid, and term_mid_months or more leave it unscaled."
      requirement: "The review months, the monthly exposure, the index price loading, the term-left scale and one minus the small business relief multiply together into the review requirement."
      tenure: "set by the contract's supply tenure, the whole months from service_start_date to the handling date"
      tolerance: "The review tolerance is a share of the review requirement deducted from the shortfall before rounding, set by the contract's supply tenure, the whole months from service_start_date to the handling date: tenure_long_months months or more give tolerance_long, tenure_mid_months months up to one month less than tenure_long_months give tolerance_mid, and a shorter tenure gives no tolerance."
      held: "the amount the review requests is the review requirement less the security deposits held on the contract (deposits posted less deposits refunded)"
      result: "rounded half up to the cent only at that last step, and nothing is requested when the deposits held already cover the requirement."
    factors:
      - id: review_months_by_grade
        effect: parameter
        decides: review_months
        bindings: [dep_grade, review_months]
        ladder:
          - when: "the contract's posted security deposit records grade A"
            value: "K('months_grade_a')"
          - when: "the contract's posted security deposit records grade B"
            value: "K('months_grade_b')"
          - when: "otherwise (grade C or not_rated recorded, or no posted deposit)"
            value: "K('months_default')"
        baseline:
          review_months: "K('months_default')"
        evidence: [history]
        cross_difficulty: null
      - id: review_exposure_basis
        effect: method
        decides: exposure
        bindings: [sup_win, adj_win, cnt_e, cnt_b, cnt_i, cyc_win, sup_q, adj_q, cnt_eq, cnt_bq, cnt_iq, cyc_q, exposure]
        ladder:
          - when: "twelve or more billed cycles posted in the review window"
            method: "the window's net charges (supply lines plus rebill credits posted in the window) divided by the cycles counted"
          - when: "three to eleven billed cycles posted in the review window, at least one of them in the latest three months"
            method: "the net charges posted in the latest three months divided by the cycles posted in those three months"
          - when: "otherwise (fewer than three billed cycles, or none posted in the latest three months)"
            method: "the reference exposure: window kWh times deposit_reference_rate_cents_kwh / 100 / months_per_year"
        baseline:
          exposure: "ref_exposure"
        evidence: [history]
        cross_difficulty: null
      - id: index_price_loading
        effect: parameter
        decides: loading
        bindings: [idx_kwh_win, idx_share, loading]
        ladder:
          - when: "an index-priced structure (index_plus_adder or fixed_block_plus_index_balance) and an index kWh share of index_share_high or more"
            value: "K('index_loading_high')"
          - when: "an index-priced structure and a smaller index kWh share"
            value: "K('index_loading_low')"
          - when: "otherwise (a fixed structure)"
            value: "no loading (1)"
        baseline:
          loading: "1"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: small_business_relief
        effect: parameter
        decides: relief
        bindings: [sb_lines, relief]
        ladder:
          - when: "sb_lines_wide or more small business energy lines posted in the review window"
            value: "K('relief_wide')"
          - when: "sb_lines_narrow up to one less than sb_lines_wide such lines"
            value: "K('relief_narrow')"
          - when: "otherwise (fewer lines)"
            value: "no relief (0)"
        baseline:
          relief: "0"
        evidence: [cross_category, history]
        cross_difficulty: bizpower
      - id: term_left_scale
        effect: parameter
        decides: term_scale
        bindings: [term_left, term_scale]
        ladder:
          - when: "fewer than term_short_months whole months left to contract_end_date"
            value: "K('scale_short')"
          - when: "term_short_months up to one less than term_mid_months whole months left"
            value: "K('scale_mid')"
          - when: "otherwise (term_mid_months or more left)"
            value: "unscaled (1)"
        baseline:
          term_scale: "1"
        evidence: [date]
        cross_difficulty: null
      - id: tenure_tolerance
        effect: parameter
        decides: tolerance
        bindings: [tenure, tolerance]
        ladder:
          - when: "supply tenure of tenure_long_months months or more"
            value: "K('tolerance_long')"
          - when: "supply tenure of tenure_mid_months months up to one month less than tenure_long_months"
            value: "K('tolerance_mid')"
          - when: "otherwise (a shorter tenure)"
            value: "no tolerance (0)"
        baseline:
          tolerance: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The review window is the twelve months before the handling date, counted by the posted_date of each bill line.
        The review requirement is the review months times the review's monthly exposure; the amount the review requests is the review requirement less the security deposits held on the contract (deposits posted less deposits refunded), rounded half up to the cent only at that last step, and nothing is requested when the deposits held already cover the requirement.
        The review months are months_default.
        The review's monthly exposure is the kWh posted on the contract's supply lines in the review window times deposit_reference_rate_cents_kwh, divided by 100 and by months_per_year.
      params: [months_default, months_per_year, deposit_reference_rate_cents_kwh]
    inputs:
      history:
        - {table: cni_billing, aggregate: sum, field: usage_kwh, within_months: 12, filters: {event_type: cni_supply_charge}}
        - {table: cni_billing, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: cni_supply_charge}}
        - {table: cni_billing, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: cni_adjustment}}
        - {table: cni_billing, aggregate: count, field: line_type, within_months: 12, filters: {line_type: block_energy_charge}}
        - {table: cni_billing, aggregate: sum, field: usage_kwh, within_months: 12, filters: {line_type: index_energy_charge}}
        - {table: cni_deposits, aggregate: latest, field: credit_grade_basis, filters: {event_type: cni_deposit_post}}
        - {table: cni_deposits, aggregate: sum, field: amount_usd, filters: {}}
