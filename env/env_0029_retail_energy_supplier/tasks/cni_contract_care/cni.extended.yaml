  - id: cni_ext_passthrough_fixed_price_rebill
    base_policy_refs: [cni_billing_correction, cni_market_notices, cni_energy_billing]
    overwrite:
      - base_policy: cni_billing_correction
        superseded_clause: >-
          When a C&I line was billed at more than the contract allows, the over-billed amount is returned as one rebill_credit tied to that line through source_billing_id, equal to the billed amount_usd minus the correctly computed amount and posted as a negative amount.
        replaced_by: >-
          The fixed-price line rebill credit is the over-billed amount plus its carrying credit, rounded half up to the cent and posted as a negative amount.
      - base_policy: cni_market_notices
        superseded_clause: >-
          the new price applies to cycles beginning on or after the later of the stated effective date and notice_date plus regulatory_change_notice_days.
        replaced_by: >-
          when the notice_date falls fewer than regulatory_change_notice_days days before the stated effective date and the cycle runs past that day, the cycle's price in force is the day-weighted average of contract_rate_cents_kwh over the cycle's days before that day and new_rate_cents_kwh over its remaining days, taken over the cycle's billing_days and not rounded
      - base_policy: cni_energy_billing
        superseded_clause: >-
          the first block_kwh_per_cycle kWh are billed on a block_energy_charge line at contract_rate_cents_kwh
        replaced_by: >-
          on a block and index contract, a cycle of fewer than full_cycle_days billing_days carries block_kwh_per_cycle times its billing_days divided by days_per_month_basis, and any other cycle carries block_kwh_per_cycle whatever the metered kWh
    trigger: on_request
    subject: [cni_adjustment]
    computes: amount_usd
    target_tool: credit_fixed_price_line_5b24cf0d
    params:
      carry_long_months: 6
      carry_rate_long: 0.06
      carry_rate_short: 0.03
      days_per_month_basis: 30
      days_per_year_basis: 360
      full_cycle_days: 28
      repeat_many_count: 2
      repeat_many_uplift: 1.50
      repeat_one_uplift: 1.25
    rule: >-
      A fixed-price line correction returns what the fixed-price energy line of the pass-through cycle, which is its block_energy_charge line on a block and index contract or its energy_charge line on a fixed structure, was billed above the price in force for that cycle, the pass-through cycle being the cycle that began on the stated effective date of the contract's latest regulatory_pass_through notice; it is posted, when the business disputes the line, as one rebill_credit tied to that line through source_billing_id, and only when the over-billed amount is positive.
      The over-billed amount of the pass-through cycle's fixed-price line is its billed amount_usd less its fixed-price kWh times the cycle's price in force divided by 100, that product rounded half up to the cent, and nothing when the difference is not positive.
      The fixed-price kWh of the fixed-price line correction are the cycle's metered kWh, the kWh on all of the cycle's energy lines together.
      The cycle's price in force is the new_rate_cents_kwh of the latest regulatory_pass_through notice.
      The fixed-price line carrying credit is the over-billed amount times its carrying rate times its carrying period, where the carrying period is the whole months from the line's posted_date to the handling date times days_per_month_basis divided by days_per_year_basis.
      The fixed-price line carrying rate is zero.
      The fixed-price line rebill credit is the over-billed amount plus its carrying credit, rounded half up to the cent and posted as a negative amount.
      The cycle's price in force follows the notice period the pass-through owed, that day being the one that falls regulatory_change_notice_days days after notice_date: on a structure whose regulatory_passthrough_allowed is false, or when the notice_date falls fewer than regulatory_change_notice_days days before the stated effective date and the pass-through cycle ends before that day, the cycle keeps contract_rate_cents_kwh; when the notice_date falls fewer than regulatory_change_notice_days days before the stated effective date and the cycle runs past that day, the cycle's price in force is the day-weighted average of contract_rate_cents_kwh over the cycle's days before that day and new_rate_cents_kwh over its remaining days, taken over the cycle's billing_days and not rounded; otherwise the cycle takes new_rate_cents_kwh.
      The fixed-price kWh follow the structure and the cycle: on a block and index contract, a cycle of fewer than full_cycle_days billing_days carries block_kwh_per_cycle times its billing_days divided by days_per_month_basis, and any other cycle carries block_kwh_per_cycle whatever the metered kWh; on any other structure the fixed-price kWh are the cycle's metered kWh.
      The fixed-price line carrying rate follows the months outstanding, the whole months from the line's posted_date to the handling date: carry_long_months or more give carry_rate_long, at least one month but fewer than carry_long_months give carry_rate_short, and less than one whole month gives none.
      The fixed-price line carrying rate is raised for a repeated billing error on the contract: repeat_many_count or more rebill credits for cycles other than the pass-through cycle posted on the contract in the twelve months before the handling date multiply it by repeat_many_uplift, one such credit multiplies it by repeat_one_uplift, and none leaves it unchanged.
    prerequisite: []
    cross_category: []
    compute:
      - pt_start: "LATEST('cni_notices','effective_date', date_field='notice_date', notice_type='regulatory_pass_through')"
      - pt_rate: "LATEST('cni_notices','new_rate_cents_kwh', date_field='notice_date', notice_type='regulatory_pass_through')"
      - fx_amt: "SUM('cni_billing','amount_usd', line_type='block_energy_charge', billing_period_start=pt_start) + SUM('cni_billing','amount_usd', line_type='energy_charge', billing_period_start=pt_start)"
      - fx_days: "LATEST('cni_billing','billing_days', date_field='posted_date', event_type='cni_supply_charge', billing_period_start=pt_start)"
      - fx_posted: "LATEST('cni_billing','posted_date', date_field='posted_date', event_type='cni_supply_charge', billing_period_start=pt_start)"
      - pt_notice: "LATEST('cni_notices','notice_date', date_field='notice_date', notice_type='regulatory_pass_through')"
      - lead: "DAYS(pt_notice, pt_start)"
      - days_before: "DAYS(pt_start, pt_notice) + P('regulatory_change_notice_days')"
      - price_in_force: "F('contract_rate_cents_kwh') if ((not P('regulatory_passthrough_allowed')) or (lead < P('regulatory_change_notice_days') and days_before >= fx_days)) else ((F('contract_rate_cents_kwh') * days_before + pt_rate * (fx_days - days_before)) / fx_days if (lead < P('regulatory_change_notice_days') and days_before < fx_days) else pt_rate)"
      - metered: "SUM('cni_billing','usage_kwh', event_type='cni_supply_charge', billing_period_start=pt_start)"
      - fixed_kwh: "F('block_kwh_per_cycle') * fx_days / K('days_per_month_basis') if (P('energy_price_basis') == 'fixed_block_plus_index_balance' and fx_days < K('full_cycle_days')) else (F('block_kwh_per_cycle') if P('energy_price_basis') == 'fixed_block_plus_index_balance' else metered)"
      - over: "RND(MX(0, fx_amt - RND(fixed_kwh * price_in_force / 100, 2)), 2)"
      - months_out: "MONTHS(fx_posted, NOW)"
      - carry_rate: "K('carry_rate_long') if months_out >= K('carry_long_months') else (K('carry_rate_short') if months_out >= 1 else 0)"
      - other_credits: "COUNT('cni_billing', within_months=12, date_field='posted_date', line_type='rebill_credit') - COUNT('cni_billing', line_type='rebill_credit', billing_period_start=pt_start)"
      - repeat_uplift: "K('repeat_many_uplift') if other_credits >= K('repeat_many_count') else (K('repeat_one_uplift') if other_credits >= 1 else 1)"
      - carry_period: "months_out * K('days_per_month_basis') / K('days_per_year_basis')"
      - carrying: "over * carry_rate * repeat_uplift * carry_period"
      - result: "0 - RND(over + carrying, 2)"
    compute_basis:
      pt_start: "the pass-through cycle being the cycle that began on the stated effective date of the contract's latest regulatory_pass_through notice"
      pt_rate: "The cycle's price in force is the new_rate_cents_kwh of the latest regulatory_pass_through notice."
      fx_amt: "The over-billed amount of the pass-through cycle's fixed-price line is its billed amount_usd less its fixed-price kWh times the cycle's price in force divided by 100"
      fx_days: "taken over the cycle's billing_days and not rounded"
      fx_posted: "the whole months from the line's posted_date to the handling date"
      pt_notice: "that day being the one that falls regulatory_change_notice_days days after notice_date"
      lead: "when the notice_date falls fewer than regulatory_change_notice_days days before the stated effective date"
      days_before: "the day-weighted average of contract_rate_cents_kwh over the cycle's days before that day and new_rate_cents_kwh over its remaining days"
      price_in_force: "on a structure whose regulatory_passthrough_allowed is false, or when the notice_date falls fewer than regulatory_change_notice_days days before the stated effective date and the pass-through cycle ends before that day, the cycle keeps contract_rate_cents_kwh; when the notice_date falls fewer than regulatory_change_notice_days days before the stated effective date and the cycle runs past that day, the cycle's price in force is the day-weighted average of contract_rate_cents_kwh over the cycle's days before that day and new_rate_cents_kwh over its remaining days, taken over the cycle's billing_days and not rounded; otherwise the cycle takes new_rate_cents_kwh."
      metered: "The fixed-price kWh of the fixed-price line correction are the cycle's metered kWh, the kWh on all of the cycle's energy lines together."
      fixed_kwh: "on a block and index contract, a cycle of fewer than full_cycle_days billing_days carries block_kwh_per_cycle times its billing_days divided by days_per_month_basis, and any other cycle carries block_kwh_per_cycle whatever the metered kWh; on any other structure the fixed-price kWh are the cycle's metered kWh."
      over: "that product rounded half up to the cent, and nothing when the difference is not positive."
      months_out: "The fixed-price line carrying rate follows the months outstanding, the whole months from the line's posted_date to the handling date"
      carry_rate: "carry_long_months or more give carry_rate_long, at least one month but fewer than carry_long_months give carry_rate_short, and less than one whole month gives none."
      other_credits: "repeat_many_count or more rebill credits for cycles other than the pass-through cycle posted on the contract in the twelve months before the handling date multiply it by repeat_many_uplift"
      repeat_uplift: "The fixed-price line carrying rate is raised for a repeated billing error on the contract: repeat_many_count or more rebill credits for cycles other than the pass-through cycle posted on the contract in the twelve months before the handling date multiply it by repeat_many_uplift, one such credit multiplies it by repeat_one_uplift, and none leaves it unchanged."
      carry_period: "where the carrying period is the whole months from the line's posted_date to the handling date times days_per_month_basis divided by days_per_year_basis."
      carrying: "The fixed-price line carrying credit is the over-billed amount times its carrying rate times its carrying period"
      result: "The fixed-price line rebill credit is the over-billed amount plus its carrying credit, rounded half up to the cent and posted as a negative amount."
    factors:
      - id: price_in_force_for_cycle
        effect: method
        decides: price_in_force
        bindings: [pt_notice, lead, days_before, price_in_force]
        ladder:
          - when: "regulatory_passthrough_allowed is false, or the notice came fewer than regulatory_change_notice_days days before the stated date and the cycle ends before the day regulatory_change_notice_days days after notice_date"
            method: "the cycle keeps contract_rate_cents_kwh"
          - when: "the notice came fewer than regulatory_change_notice_days days before the stated date and the cycle runs past that day"
            method: "a day-weighted average of contract_rate_cents_kwh before that day and new_rate_cents_kwh after it, over the cycle's billing_days"
          - when: "otherwise"
            method: "the cycle takes the notice's new_rate_cents_kwh"
        baseline:
          price_in_force: "pt_rate"
        evidence: [history, date]
        cross_difficulty: null
      - id: fixed_price_kwh_basis
        effect: method
        decides: fixed_kwh
        bindings: [metered, fixed_kwh]
        ladder:
          - when: "a block and index contract and a cycle of fewer than full_cycle_days billing_days"
            method: "block_kwh_per_cycle prorated by billing_days over days_per_month_basis"
          - when: "a block and index contract and any other cycle"
            method: "block_kwh_per_cycle whatever the metered kWh"
          - when: "otherwise (a fixed structure)"
            method: "the cycle's metered kWh"
        baseline:
          fixed_kwh: "metered"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: fixed_price_carrying_rate
        effect: parameter
        decides: carry_rate
        bindings: [months_out, carry_rate]
        ladder:
          - when: "carry_long_months or more whole months since the line was posted"
            value: "K('carry_rate_long')"
          - when: "at least one but fewer than carry_long_months whole months"
            value: "K('carry_rate_short')"
          - when: "otherwise (less than one whole month)"
            value: "none (0)"
        baseline:
          carry_rate: "0"
        evidence: [date]
        cross_difficulty: null
      - id: fixed_price_repeat_uplift
        effect: parameter
        decides: repeat_uplift
        bindings: [other_credits, repeat_uplift]
        ladder:
          - when: "repeat_many_count or more rebill credits for other cycles posted on the contract in the last twelve months"
            value: "K('repeat_many_uplift')"
          - when: "one such credit"
            value: "K('repeat_one_uplift')"
          - when: "otherwise (none)"
            value: "unchanged (1)"
        baseline:
          repeat_uplift: "1"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
