events:
  - type: bizgas_enroll
    target: bizgas_agreements
    mutation: create
    meaning: An authorized representative enrolls one commercial site's natural gas supply with Beacon Ridge.
    grain: One row per enrollment authorization for one site.
    fields:
      customer_id: The business customer.
      premise_id: The site being enrolled.
      variant_name: The official name of the plan enrolled.
      enrollment_date: Date the enrollment was authorized.
      enrollment_channel: Channel through which the enrollment was completed.
      term_months: Term copied from the plan.
      contract_rate_usd_therm: The offer_rate of the price offer valid on the enrollment date for this plan and the site's gas utility.
      contract_annual_therms: Contracted annual volume, equal to the site's annual_therm_usage on the enrollment date.
    triggers: []
  - type: bizgas_utility_confirm
    target: bizgas_agreements
    mutation: update
    meaning: The gas utility accepts the enrollment and issues its confirmation letter.
    grain: One row per transaction.
    fields:
      utility_confirmation_date: Date printed on the confirmation letter.
    triggers: []
  - type: bizgas_activate
    target: bizgas_agreements
    mutation: {transition: {from: enrollment_pending, to: active}}
    meaning: Gas supply to the site begins on the switch meter read date.
    grain: One row per transaction.
    fields:
      service_start_date: The switch meter read date.
      contract_end_date: Last day of the term; empty for month-to-month.
    triggers: []
  - type: bizgas_reject
    target: bizgas_agreements
    mutation: {transition: {from: enrollment_pending, to: rejected}}
    meaning: The gas utility rejects the enrollment.
    grain: One row per transaction.
    fields:
      reject_reason: The utility's rejection reason.
    triggers: []
  - type: bizgas_withdraw
    target: bizgas_agreements
    mutation: {transition: {from: enrollment_pending, to: withdrawn}}
    meaning: The business withdraws a pending enrollment before the utility confirms it.
    grain: One row per transaction.
    fields:
      withdrawn_date: Date the business withdrew.
    triggers: []
  - type: bizgas_cancel
    target: bizgas_agreements
    mutation: {transition: {from: active, to: drop_pending}}
    meaning: The business confirms cancellation and a drop is scheduled.
    grain: One row per transaction.
    fields:
      drop_requested_date: Date the business confirmed the cancellation.
      drop_reason: Why the business is cancelling.
      drop_effective_date: The site's next scheduled meter read date on the request date.
    triggers: []
  - type: bizgas_drop_complete
    target: bizgas_agreements
    mutation: {transition: {from: drop_pending, to: closed}}
    meaning: The gas utility completes the scheduled drop.
    grain: One row per transaction.
    fields:
      close_date: Meter read date on which supply ended.
      close_reason: Why supply ended.
    triggers: []
  - type: bizgas_switch_away
    target: bizgas_agreements
    mutation: {transition: {from: active, to: closed}}
    meaning: The gas utility ends Beacon Ridge supply because another supplier enrolled the site or it was final-billed.
    grain: One row per transaction.
    fields:
      close_date: Meter read date on which supply ended.
      close_reason: Why supply ended.
    triggers: []
  - type: bizgas_renew
    target: bizgas_agreements
    mutation: update
    meaning: The business accepts the renewal offer and the agreement continues into a new term.
    grain: One row per transaction.
    fields:
      variant_name: The plan renewed into, as offered.
      term_months: Term of the renewed plan.
      contract_rate_usd_therm: The renewal price offered.
      contract_annual_therms: Contracted annual volume for the new term, equal to the site's annual_therm_usage on the renewal date.
      contract_end_date: Last day of the new term.
      plan_change_date: Date the new term starts.
    triggers:
      - event: bizgas:bizgas_credit
        when: {variant_name: [Beacon Ridge Commercial Gas Fixed Basis 12, Beacon Ridge Commercial Gas Fixed 12, Beacon Ridge Commercial Gas Fixed 24, Beacon Ridge Commercial Gas Fixed 36, Beacon Ridge Commercial Gas Carbon Neutral 24]}
        map: {line_type: renewal_loyalty_credit, bizgas_agreement_id: bizgas_agreement_id}
  - type: bizgas_rollover
    target: bizgas_agreements
    mutation: update
    meaning: An expiring term without a renewal converts to the monthly index plan.
    grain: One row per transaction.
    fields:
      variant_name: The rollover plan's official name.
      term_months: Set to 0.
      contract_rate_usd_therm: The rollover adder, or the held expiring fixed price during a late-notice hold.
      contract_end_date: Cleared to empty.
      plan_change_date: The day after the expired contract_end_date.
    triggers: []
  - type: bizgas_tax_exemption
    target: bizgas_agreements
    mutation: update
    meaning: Beacon Ridge tax operations validates the business's sales tax exemption certificate for the site.
    grain: One row per transaction.
    fields:
      sales_tax_exempt: Set to true.
      tax_exemption_date: Date the validated certificate was received.
    triggers: []
  - type: bizgas_supply_charge
    target: bizgas_billing
    meaning: Beacon Ridge bills one cycle's gas at the plan price, swing usage, the service fee or sales tax for one site.
    grain: One row per charge line per billing cycle.
    distinguish_by: [line_type, billing_period_start]
    fields:
      bizgas_agreement_id: The agreement billed.
      line_type: energy_charge, swing_excess_charge, swing_shortfall_charge, monthly_service_fee or sales_tax.
      billing_period_start: First day of the billing cycle.
      billing_period_end: Last day of the billing cycle.
      usage_therms: Therms billed on the line; for a shortfall line, the shortfall therms; 0 on fee and tax lines.
      rate_usd_therm: Price per therm applied; 0.0000 on fee and tax lines.
      tax_rate_pct: Sales tax rate on a sales_tax line; 0.000 otherwise.
      taxable_amount_usd: Taxed base on a sales_tax line; 0.00 otherwise.
      amount_usd: Positive charge amount.
      posted_date: Date posted.
    account: bizgas_supply_billed
    direction: in
    triggers: []
  - type: bizgas_etf_charge
    target: bizgas_billing
    meaning: Beacon Ridge bills liquidated damages when a commercial gas term ends early.
    grain: One row per early termination.
    distinguish_by: [line_type, posted_date]
    fields:
      bizgas_agreement_id: The agreement terminated.
      line_type: early_termination_fee.
      etf_remaining_therms: Remaining contract therms used in the fee.
      amount_usd: Positive fee amount.
      posted_date: Date posted.
    account: bizgas_supply_billed
    direction: in
    triggers: []
  - type: bizgas_credit
    target: bizgas_billing
    meaning: Beacon Ridge posts a renewal loyalty credit.
    grain: One row per credit per billing cycle.
    distinguish_by: [line_type, billing_period_start]
    fields:
      bizgas_agreement_id: The agreement credited.
      line_type: renewal_loyalty_credit.
      billing_period_start: Billing cycle on whose bill the credit appears.
      amount_usd: Negative credit amount.
      posted_date: Date posted.
    account: bizgas_supply_billed
    direction: out
    triggers: []
  - type: bizgas_adjustment
    target: bizgas_billing
    meaning: Beacon Ridge corrects an over-billed commercial gas line with a rebill credit.
    grain: One row per corrected original line.
    distinguish_by: [source_billing_id, posted_date]
    fields:
      bizgas_agreement_id: The agreement corrected.
      line_type: rebill_credit.
      source_billing_id: The line being corrected.
      billing_period_start: Billing cycle of the corrected line.
      amount_usd: Negative credit equal to the over-billed amount.
      posted_date: Date posted.
    account: bizgas_supply_billed
    direction: out
    triggers: []
  - type: bizgas_renewal_notice
    target: bizgas_notices
    meaning: Beacon Ridge issues a commercial gas expiration notice with a renewal offer and rollover terms.
    grain: One row per notice type per issue date.
    distinguish_by: [notice_type, notice_date]
    fields:
      bizgas_agreement_id: The expiring agreement.
      notice_type: initial_renewal_notice or final_options_notice.
      notice_date: Date issued.
      effective_date: The contract_end_date referred to.
      offered_variant_name: The plan offered.
      new_rate_usd_therm: The renewal price offered.
      delivery_channel: How the notice was delivered.
    triggers: []
  - type: bizgas_price_notice
    target: bizgas_notices
    meaning: Beacon Ridge publishes the month's index and NYMEX settlement prices for the agreement, or notifies a regulatory pass-through.
    grain: One row per notice type per effective month.
    distinguish_by: [notice_type, effective_date]
    fields:
      bizgas_agreement_id: The agreement priced.
      notice_type: monthly_index_price or regulatory_pass_through.
      notice_date: Date issued.
      effective_date: First day of the delivery month priced, or the stated effective date of a pass-through.
      index_price_usd_therm: The month's delivered index price for the site's utility; 0.0000 on a pass-through.
      nymex_settle_usd_therm: The month's NYMEX settlement price converted to therms; 0.0000 on a pass-through.
      new_rate_usd_therm: For a pass-through, the new contract price; 0.0000 otherwise.
      delivery_channel: How the notice was delivered.
    triggers: []

measures:
  - id: bizgas_msr_portfolio_usage
    window: The billing cycles whose billing_period_start falls in the same calendar month, across the business's agreements on plans with portfolio_bandwidth true that were active on that billing_period_start.
    measure: Two sums over those agreements for those cycles, the total usage_therms on their energy_charge and swing_excess_charge lines, and the total of their monthly contract volumes; the portfolio is inside the bandwidth when the first sum lies within each included plan's band applied to the second sum.

policies:
  - id: bizgas_agg_multi_holding
    subject: [bizgas_enroll]
    rule: >-
      A business may enroll any number of its commercial sites for gas supply; there is no limit per customer.
      No other bizgas agreement on the same site may be in enrollment_pending, active or drop_pending status when a new gas enrollment is submitted.
    eligibility:
      - id: one_live_bizgas_per_site
        applies_to: [bizgas_enroll]
        kind: dedup
        condition: No other bizgas agreement on the same site may be in enrollment_pending, active or drop_pending status when a new gas enrollment is submitted.
        evidence_fields: [bizgas_agreements.premise_id, bizgas_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_agreements.premise_id]
          action_bindings:
            bizgas_agreements.premise_id: premise_id
        dedup_contract:
          table: bizgas_agreements
          mode: separate_record
          object_bindings: {premise_id: premise_id}
          duplicate_filters: {status: [enrollment_pending, active, drop_pending]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: bizgas_agg_portfolio_bandwidth
    subject: [bizgas_supply_charge]
    rule: >-
      On plans whose portfolio_bandwidth is true, swing is measured on the business's whole portfolio rather than per site.
      For a calendar month, the combined usage and combined monthly contract volume of all of the business's agreements on such plans (bizgas_msr_portfolio_usage) are compared with the bandwidth of each plan's swing_tolerance_pct; when the combined usage falls inside every included plan's bandwidth, no site is billed swing that month even if one site alone would be outside.
      When the combined usage is outside, each included site is billed swing on its own usage against its own band.
      Sites on plans whose portfolio_bandwidth is false are always measured alone and do not enter the portfolio.
    eligibility: []
    measures: [bizgas_msr_portfolio_usage]

  - id: bizgas_enrollment_eligibility
    subject: [bizgas_enroll]
    rule: >-
      A commercial gas enrollment is accepted only for a business customer and a site whose premise_class is commercial, whose gas_utility is not none, whose service_state is listed in eligible_states and whose annual_therm_usage is at least min_annual_therms and no more than max_annual_therms.
      The gas site must be commercial.
      The enrollment channel must be one of the plan's enrollment_channels.
      contract_rate_usd_therm is the offer_rate of the price offer for the plan and the site's gas utility valid on the enrollment date; it is the all-in fixed price on a fixed plan, the locked basis plus adder on a fixed basis plan, and the adder on an index plan.
      contract_annual_therms is the site's annual_therm_usage on the enrollment date.
      Sites above max_annual_therms are outside the standard commercial gas product.
    eligibility:
      - id: commercial_gas_site
        applies_to: [bizgas_enroll]
        kind: state
        condition: The gas site must be commercial.
        evidence_fields: [premises.premise_class, premises.premise_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [premises.premise_id]
          action_bindings:
            premises.premise_id: premise_id
        state_contract:
          field: premises.premise_class
          allowed: [commercial]

  - id: bizgas_enrollment_processing
    subject: [bizgas_utility_confirm, bizgas_activate, bizgas_reject]
    rule: >-
      After submission the gas utility either accepts the enrollment, recording utility_confirmation_date, or rejects it with one of the utility rejection reasons.
      Supply begins on the switch meter read date, which becomes service_start_date.
      For a plan with term_months above 0, contract_end_date is the day before the same calendar day term_months calendar months after service_start_date; when that calendar day does not exist in the target month, the last day of that month is used before subtracting the day.
      A rejected enrollment ends permanently.
    eligibility: []

  - id: bizgas_withdrawal
    subject: [bizgas_withdraw]
    rule: >-
      Commercial gas enrollments carry no statutory rescission period.
      A business may withdraw a pending enrollment only while the gas utility has not yet confirmed it, that is while utility_confirmation_date is empty, and only when withdrawal_allowed_before_confirmation is true.
      Once the utility has confirmed the enrollment, the business can end the agreement only by cancelling after supply starts, and the early termination fee rules apply.
    eligibility:
      - id: before_confirmation
        applies_to: [bizgas_withdraw]
        kind: authorization
        condition: A business may withdraw a pending enrollment only while the gas utility has not yet confirmed it, that is while utility_confirmation_date is empty, and only when withdrawal_allowed_before_confirmation is true.
        evidence_fields: [bizgas_agreements.utility_confirmation_date, bizgas_agreements.bizgas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_agreements.bizgas_agreement_id]
          action_bindings:
            bizgas_agreements.bizgas_agreement_id: bizgas_agreement_id

  - id: bizgas_supply_billing
    subject: [bizgas_supply_charge]
    rule: >-
      Each billing cycle in which Beacon Ridge supplied the site produces one energy_charge line, any swing lines, one monthly_service_fee line unless waived, and one sales_tax line when tax applies.
      Commercial gas charges are billed only while the agreement is active, drop_pending or closed.
      The energy price per therm is contract_rate_usd_therm on a fixed plan, the month's nymex_settle_usd_therm plus contract_rate_usd_therm on a fixed basis plan, and the month's index_price_usd_therm plus contract_rate_usd_therm on an index plan, using the monthly_index_price notice for the month of billing_period_start; amounts are usage times price rounded per charge_rounding.
      Holding an active Beacon Ridge business electricity agreement or commercial and industrial contract on the same site changes the gas fee: when dual_commodity_fee_waiver is true and such an agreement was active on the cycle's billing_period_start, no monthly_service_fee line is billed.
      The sales_tax line taxes the cycle's energy, swing and fee lines at the sales_tax_rate_pct_by_state value for the site's service_state and is not billed when that rate is 0.000 or for cycles beginning on or after tax_exemption_date when sales_tax_exempt is true; tax billed before an exemption is not refunded.
      There is no annual volume true-up when annual_volume_true_up is false.
    eligibility:
      - id: bizgas_supplied_status
        applies_to: [bizgas_supply_charge]
        kind: state
        condition: Commercial gas charges are billed only while the agreement is active, drop_pending or closed.
        evidence_fields: [bizgas_agreements.status, bizgas_agreements.bizgas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_agreements.bizgas_agreement_id]
          action_bindings:
            bizgas_agreements.bizgas_agreement_id: bizgas_agreement_id
        state_contract:
          field: bizgas_agreements.status
          allowed: [active, drop_pending, closed]
    formula:
      when: line_type == "sales_tax"
      amount_usd: round(taxable_amount_usd * tax_rate_pct / 100, 2)

  - id: bizgas_swing
    subject: [bizgas_supply_charge]
    rule: >-
      On a plan whose swing_applies is true, the monthly contract volume is contract_annual_therms divided by months_per_year and rounded half up to a whole therm, per monthly_volume_basis.
      The band runs from the monthly volume times (100 minus swing_tolerance_pct) percent to the monthly volume times (100 plus swing_tolerance_pct) percent, each rounded half up to a whole therm, both ends inclusive.
      Usage inside the band is billed entirely on the energy_charge line at the fixed price.
      Therms above the upper end are billed on a swing_excess_charge line at the month's index_price_usd_therm plus swing_excess_adder_usd_therm, and the energy line bills only the upper-end therms.
      When usage is below the lower end, all usage is billed on the energy line and the shortfall therms are billed on a swing_shortfall_charge line at swing_shortfall_charge_usd_therm.
      On plans whose swing_applies is false, all usage is billed on the energy line.
    eligibility: []
    params:
      months_per_year: 12
      per_tier:
        Beacon Ridge Commercial Gas Monthly Index: {swing_applies: "=swing_applies", swing_tolerance_pct: "=swing_tolerance_pct", swing_excess_adder_usd_therm: "=swing_excess_adder_usd_therm", swing_shortfall_charge_usd_therm: "=swing_shortfall_charge_usd_therm", portfolio_bandwidth: "=portfolio_bandwidth"}
        Beacon Ridge Commercial Gas Fixed Basis 12: {swing_applies: "=swing_applies", swing_tolerance_pct: "=swing_tolerance_pct", swing_excess_adder_usd_therm: "=swing_excess_adder_usd_therm", swing_shortfall_charge_usd_therm: "=swing_shortfall_charge_usd_therm", portfolio_bandwidth: "=portfolio_bandwidth"}
        Beacon Ridge Commercial Gas Fixed 12: {swing_applies: "=swing_applies", swing_tolerance_pct: "=swing_tolerance_pct", swing_excess_adder_usd_therm: "=swing_excess_adder_usd_therm", swing_shortfall_charge_usd_therm: "=swing_shortfall_charge_usd_therm", portfolio_bandwidth: "=portfolio_bandwidth"}
        Beacon Ridge Commercial Gas Fixed 24: {swing_applies: "=swing_applies", swing_tolerance_pct: "=swing_tolerance_pct", swing_excess_adder_usd_therm: "=swing_excess_adder_usd_therm", swing_shortfall_charge_usd_therm: "=swing_shortfall_charge_usd_therm", portfolio_bandwidth: "=portfolio_bandwidth"}
        Beacon Ridge Commercial Gas Fixed 36: {swing_applies: "=swing_applies", swing_tolerance_pct: "=swing_tolerance_pct", swing_excess_adder_usd_therm: "=swing_excess_adder_usd_therm", swing_shortfall_charge_usd_therm: "=swing_shortfall_charge_usd_therm", portfolio_bandwidth: "=portfolio_bandwidth"}
        Beacon Ridge Commercial Gas Carbon Neutral 24: {swing_applies: "=swing_applies", swing_tolerance_pct: "=swing_tolerance_pct", swing_excess_adder_usd_therm: "=swing_excess_adder_usd_therm", swing_shortfall_charge_usd_therm: "=swing_shortfall_charge_usd_therm", portfolio_bandwidth: "=portfolio_bandwidth"}

  - id: bizgas_index_pricing
    subject: [bizgas_price_notice, bizgas_supply_charge]
    rule: >-
      Each delivery month's index_price_usd_therm and nymex_settle_usd_therm are published on a monthly_index_price notice whose effective_date is the first day of that month.
      A billing cycle is priced with the notice for the calendar month containing its billing_period_start, as price_publication_basis states, regardless of how many days of the cycle fall in the next month.
      On a fixed basis plan only the NYMEX component floats; the basis and adder recorded in contract_rate_usd_therm stay fixed for the term.
      On a fixed plan the index notice is used only to price swing excess therms.
    eligibility: []

  - id: bizgas_regulatory_passthrough
    subject: [bizgas_price_notice]
    rule: >-
      A fixed or fixed basis price may change during the term only to pass through a change in law or regulation, and only on a plan whose regulatory_passthrough_allowed is true.
      A regulatory_pass_through notice must be issued at least regulatory_change_notice_days calendar days before its effective date, and the new price applies to cycles beginning on or after the later of the stated effective date and notice_date plus regulatory_change_notice_days.
      On a plan whose regulatory_passthrough_allowed is false any pass-through billed is a billing error.
    eligibility: []

  - id: bizgas_expiry_notices
    subject: [bizgas_renewal_notice]
    rule: >-
      Every commercial gas agreement with a term receives two expiration notices.
      Commercial gas renewal notices are issued only on an active agreement with a term.
      The initial_renewal_notice is compliant when its notice_date falls no earlier than renewal_notice_earliest_days and no later than renewal_notice_latest_days calendar days before contract_end_date.
      The final_options_notice is compliant when its notice_date falls no later than final_options_notice_latest_days calendar days before contract_end_date and after the initial notice.
      Each notice states the plan and price offered for renewal and that the agreement otherwise rolls to the monthly index plan; when the two notices differ, the final_options_notice governs.
    eligibility:
      - id: bizgas_active_term
        applies_to: [bizgas_renewal_notice]
        kind: state
        condition: Commercial gas renewal notices are issued only on an active agreement with a term.
        evidence_fields: [bizgas_agreements.status, bizgas_agreements.bizgas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_agreements.bizgas_agreement_id]
          action_bindings:
            bizgas_agreements.bizgas_agreement_id: bizgas_agreement_id
        state_contract:
          field: bizgas_agreements.status
          allowed: [active]

  - id: bizgas_rollover_terms
    subject: [bizgas_rollover]
    rule: >-
      When a commercial gas term reaches contract_end_date without a renewal acceptance and without a pending cancellation, the agreement converts on the following day to the plan named by rollover_variant with term_months 0, an empty contract_end_date, plan_change_date set to the day after the expired contract_end_date, and contract_rate_usd_therm set to rollover_adder_usd_therm.
      When either expiration notice was missing or not compliant, the expiring price is held for late_notice_rate_hold_cycles billing cycles first, recorded as contract_rate_usd_therm and billed as a fixed price, after which contract_rate_usd_therm becomes rollover_adder_usd_therm.
      A rolled-over agreement carries no early termination fee.
    eligibility: []

  - id: bizgas_renewal
    subject: [bizgas_renew, bizgas_credit]
    rule: >-
      A business renews by accepting the offer in the governing commercial gas renewal notice: the agreement takes the offered plan, its term_months and the offered price, and contract_annual_therms is reset to the site's annual_therm_usage on the acceptance date.
      A commercial gas renewal is accepted only on an active agreement.
      When the acceptance is made on or before contract_end_date the new term starts the day after contract_end_date; after a rollover it starts on the acceptance date.
      When the commercial gas agreement has already rolled over, a renewal acceptance is honoured only when the business accepts no later than post_expiry_renewal_grace_days calendar days after the rollover took effect on plan_change_date.
      Day one is the calendar day after plan_change_date, and the grace period closes at the end of the calendar day equal to plan_change_date plus post_expiry_renewal_grace_days.
      Each renewal earns one renewal_loyalty_credit equal to the renewal_loyalty_credit_usd of the plan renewed into.
    eligibility:
      - id: bizgas_renewal_active
        applies_to: [bizgas_renew]
        kind: state
        condition: A commercial gas renewal is accepted only on an active agreement.
        evidence_fields: [bizgas_agreements.status, bizgas_agreements.bizgas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_agreements.bizgas_agreement_id]
          action_bindings:
            bizgas_agreements.bizgas_agreement_id: bizgas_agreement_id
        state_contract:
          field: bizgas_agreements.status
          allowed: [active]
      - id: bizgas_post_expiry_grace
        applies_to: [bizgas_renew]
        kind: time
        condition: When the commercial gas agreement has already rolled over, a renewal acceptance is honoured only when the business accepts no later than post_expiry_renewal_grace_days calendar days after the rollover took effect on plan_change_date.
        evidence_fields: [bizgas_agreements.plan_change_date, bizgas_agreements.bizgas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_agreements.bizgas_agreement_id]
          action_bindings:
            bizgas_agreements.bizgas_agreement_id: bizgas_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the rollover took effect on plan_change_date
          anchor_source: bizgas_agreements.plan_change_date
          relation: not_after
          duration_source: variants.post_expiry_renewal_grace_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after plan_change_date, and the grace period closes at the end of the calendar day equal to plan_change_date plus post_expiry_renewal_grace_days.
          boundary: inclusive

  - id: bizgas_tax_exemption_terms
    subject: [bizgas_tax_exemption]
    rule: >-
      A commercial gas sales tax exemption is recorded only after Beacon Ridge tax operations has received and validated the business's exemption certificate for the site; a representative's statement does not change billing.
      tax_exemption_date is the date the validated certificate was received, and the exemption applies per tax_exemption_effective_basis without any refund of earlier tax.
    eligibility: []

  - id: bizgas_cancellation
    subject: [bizgas_cancel, bizgas_drop_complete, bizgas_switch_away]
    rule: >-
      The business cancels an active agreement by confirming the cancellation; the drop takes effect on the site's next scheduled meter read date, recorded as drop_effective_date.
      A confirmed commercial gas cancellation cannot be withdrawn; a business that changes its mind re-enrolls the site after the drop at the then-valid price offer.
      When the utility completes the drop the agreement closes with close_reason cancelled_by_customer; when another supplier enrolls the site it closes with close_reason switched_to_other_supplier; when the site is final-billed it closes with close_reason final_billed.
    eligibility: []

  - id: bizgas_etf
    subject: [bizgas_etf_charge]
    rule: >-
      A commercial gas early termination fee is assessed only once the agreement is drop_pending or closed.
      Only one early termination fee may be billed per commercial gas agreement.
      The termination date is drop_requested_date for a cancellation and close_date for a switch-away or final bill.
      The remaining months are twelve times the difference in years plus the difference in months between the termination date and contract_end_date, plus one when the day of month of contract_end_date is later than the day of month of the termination date.
      etf_remaining_therms is contract_annual_therms times the remaining months divided by months_per_year, rounded half up to a whole therm, and the fee is etf_remaining_therms times etf_rate_usd_per_therm rounded per charge_rounding, but not less than etf_minimum_usd; under the none method no fee applies.
      No fee applies when the termination date falls within etf_free_window_days calendar days before contract_end_date, equality counting as inside.
      Closing the site, selling the business and switching to another supplier do not waive the fee when etf_waive_on_site_closure is false.
    eligibility:
      - id: bizgas_terminated_status
        applies_to: [bizgas_etf_charge]
        kind: state
        condition: A commercial gas early termination fee is assessed only once the agreement is drop_pending or closed.
        evidence_fields: [bizgas_agreements.status, bizgas_agreements.bizgas_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_agreements.bizgas_agreement_id]
          action_bindings:
            bizgas_agreements.bizgas_agreement_id: bizgas_agreement_id
        state_contract:
          field: bizgas_agreements.status
          allowed: [drop_pending, closed]
      - id: bizgas_single_etf
        applies_to: [bizgas_etf_charge]
        kind: dedup
        condition: Only one early termination fee may be billed per commercial gas agreement.
        evidence_fields: [bizgas_billing.bizgas_agreement_id, bizgas_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_billing.bizgas_agreement_id]
          action_bindings:
            bizgas_billing.bizgas_agreement_id: bizgas_agreement_id
        dedup_contract:
          table: bizgas_billing
          mode: separate_record
          object_bindings: {bizgas_agreement_id: bizgas_agreement_id}
          duplicate_filters: {line_type: [early_termination_fee]}
          distinct_fields: []
    params:
      months_per_year: 12
    formula:
      when_not: etf_method == "none"
      amount_usd: max(etf_minimum_usd, round(etf_remaining_therms * etf_rate_usd_per_therm, 2))

  - id: bizgas_billing_correction
    subject: [bizgas_adjustment]
    rule: >-
      When a commercial gas line was billed at more than the policy allows, the over-billed amount is returned as one rebill_credit tied to that line through source_billing_id, equal to the billed amount_usd minus the correctly computed amount and posted as a negative amount; a corrected energy, swing or fee line also corrects the cycle's sales_tax line with its own rebill credit.
      A commercial gas line may be corrected only when the business disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
      The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
      Each billed commercial gas line may be corrected only once.
      A care agent may post a rebill credit up to agent_adjustment_limit_usd per line; a larger correction is opened as a commercial gas billing dispute for review instead of being posted.
      Under-billing caused by a Beacon Ridge error is not back-billed.
    eligibility:
      - id: bizgas_dispute_lookback
        applies_to: [bizgas_adjustment]
        kind: time
        condition: A commercial gas line may be corrected only when the business disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
        evidence_fields: [bizgas_billing.posted_date, bizgas_billing.bizgas_billing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_billing.bizgas_billing_id]
          action_bindings:
            bizgas_billing.bizgas_billing_id: source_billing_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the line was posted
          anchor_source: bizgas_billing.posted_date
          relation: not_after
          duration_source: variants.billing_dispute_lookback_months
          unit: calendar_months
          counting_rule: The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
          boundary: inclusive
      - id: bizgas_one_correction_per_line
        applies_to: [bizgas_adjustment]
        kind: dedup
        condition: Each billed commercial gas line may be corrected only once.
        evidence_fields: [bizgas_billing.source_billing_id, bizgas_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizgas_billing.source_billing_id]
          action_bindings:
            bizgas_billing.source_billing_id: source_billing_id
        dedup_contract:
          table: bizgas_billing
          mode: separate_record
          object_bindings: {source_billing_id: source_billing_id}
          duplicate_filters: {line_type: [rebill_credit]}
          distinct_fields: []

extended_policies:
  - id: bizgas_ext_swing_excess_rebill
    base_policy_refs: [bizgas_billing_correction, bizgas_swing, bizgas_index_pricing, bizgas_agg_portfolio_bandwidth]
    overwrite:
      - base_policy: bizgas_swing
        superseded_clause: >-
          The band runs from the monthly volume times (100 minus swing_tolerance_pct) percent to the monthly volume times (100 plus swing_tolerance_pct) percent, each rounded half up to a whole therm, both ends inclusive.
        replaced_by: >-
          The swing tolerance that sets the upper end of the band follows the site's billing record: an agreement with at least established_cycles energy_charge lines on file and at most one swing_excess_charge line whose billing_period_start is later than the same calendar day twelve months before the correction date uses swing_tolerance_pct plus tol_bonus_established_pct; an agreement with at least settling_cycles but fewer than established_cycles energy_charge lines on file and at most one such swing_excess_charge line uses swing_tolerance_pct plus tol_bonus_settling_pct; any other agreement uses swing_tolerance_pct.
      - base_policy: bizgas_swing
        superseded_clause: >-
          Therms above the upper end are billed on a swing_excess_charge line at the month's index_price_usd_therm plus swing_excess_adder_usd_therm, and the energy line bills only the upper-end therms.
        replaced_by: >-
          The adder priced on excess therms follows the business's electricity supply at the same premise: when the Beacon Ridge small business electricity agreement on that premise is active on a fixed term, that is with term_months above 0, the adder is bundle_adder_fixed; when it is active on a month-to-month plan, that is with term_months equal to 0, the adder is bundle_adder_variable; in every other case the adder is swing_excess_adder_usd_therm. Small excursions above the band are relieved: when the measured excess therms are no more than minor_excursion_share of the monthly contract volume, the correct excess therms are half the measured excess rounded down to a whole therm; when they are above minor_excursion_share and no more than moderate_excursion_share of the monthly contract volume, they are the measured excess times moderate_excursion_factor rounded up to a whole therm; when they are above moderate_excursion_share of it, they are counted as measured.
      - base_policy: bizgas_billing_correction
        superseded_clause: >-
          equal to the billed amount_usd minus the correctly computed amount and posted as a negative amount
        replaced_by: >-
          The rebill credit equals the over-billed amount plus any overcharge interest due, rounded half up to the cent, and it is posted as a negative amount.
    trigger: state_due
    subject: [bizgas_adjustment]
    computes: rebill_amount_usd
    target_tool: post_bizgas_swing_rebill_d99acf60
    params:
      months_per_year: 12
      established_cycles: 36
      settling_cycles: 24
      tol_bonus_established_pct: 10
      tol_bonus_settling_pct: 5
      bundle_adder_fixed: 0.0200
      bundle_adder_variable: 0.0300
      minor_excursion_share: 0.10
      moderate_excursion_share: 0.20
      moderate_excursion_factor: 0.75
      repeat_interest_high: 0.0100
      repeat_interest_low: 0.0050
    rule: >-
      A swing excess correction is worked on the agreement's most recently posted swing_excess_charge line, read together with the energy_charge line of the same billing_period_start; the over-billed amount on that swing excess line is its billed amount_usd minus the correct swing excess amount, never below zero, and it is returned as one rebill_credit tied to the line through source_billing_id and dated on the correction date.
      A business that asks for the line to be put right once it has been pointed out to it is disputing that line.
      This correction covers an agreement whose plan has portfolio_bandwidth false, or an agreement that is the business's only commercial gas agreement on a plan with portfolio_bandwidth true; where the business has two or more agreements on plans with portfolio_bandwidth true, the portfolio measure decides the swing and the line is outside this correction.
      The cycle usage is the usage_therms of that cycle's energy_charge line plus the usage_therms of the swing excess line.
      The monthly contract volume is contract_annual_therms divided by months_per_year and rounded half up to a whole therm.
      The upper end of the band is the monthly contract volume times (100 plus the swing tolerance) percent, rounded half up to a whole therm, where the swing tolerance is swing_tolerance_pct.
      The measured excess therms are the cycle usage minus the upper end of the band, never below zero, and the correct excess therms are the measured excess therms.
      Each correct excess therm is priced at the index_price_usd_therm of the monthly_index_price notice whose effective_date equals the cycle's billing_period_start plus an adder of swing_excess_adder_usd_therm.
      The correct swing excess amount is the correct excess therms times that price per therm, rounded half up to the cent.
      The rebill credit equals the over-billed amount plus any overcharge interest due, rounded half up to the cent, and it is posted as a negative amount.
      The swing tolerance that sets the upper end of the band follows the site's billing record: an agreement with at least established_cycles energy_charge lines on file and at most one swing_excess_charge line whose billing_period_start is later than the same calendar day twelve months before the correction date uses swing_tolerance_pct plus tol_bonus_established_pct; an agreement with at least settling_cycles but fewer than established_cycles energy_charge lines on file and at most one such swing_excess_charge line uses swing_tolerance_pct plus tol_bonus_settling_pct; any other agreement uses swing_tolerance_pct.
      The adder priced on excess therms follows the business's electricity supply at the same premise: when the Beacon Ridge small business electricity agreement on that premise is active on a fixed term, that is with term_months above 0, the adder is bundle_adder_fixed; when it is active on a month-to-month plan, that is with term_months equal to 0, the adder is bundle_adder_variable; in every other case the adder is swing_excess_adder_usd_therm. Small excursions above the band are relieved: when the measured excess therms are no more than minor_excursion_share of the monthly contract volume, the correct excess therms are half the measured excess rounded down to a whole therm; when they are above minor_excursion_share and no more than moderate_excursion_share of the monthly contract volume, they are the measured excess times moderate_excursion_factor rounded up to a whole therm; when they are above moderate_excursion_share of it, they are counted as measured.
      Overcharge interest is due where the agreement has been over-billed before: when two or more rebill_credit lines were posted on the agreement later than the same calendar day twenty-four months before the correction date, the monthly interest rate is repeat_interest_high; when exactly one was, it is repeat_interest_low; when none was, no overcharge interest is due.
      The months of overcharge interest are whole calendar months counted from an anchor to the correction date, a month counting only once the correction date's day of month has reached the anchor's day of month, and the anchor follows how the cycle's price was published: when the cycle's monthly_index_price notice is dated after the cycle's billing_period_start and was delivered by mail, the anchor is the cycle's billing_period_start; when that notice is dated after billing_period_start and was delivered by email, the anchor is the cycle's billing_period_end; otherwise the anchor is the posted_date of the swing excess line.
      The overcharge interest is the over-billed amount times the monthly interest rate times the months of overcharge interest, rounded half up to the cent; it is worked on the over-billed amount itself and is added to it once.
    prerequisite: []
    cross_category:
      - category: bizpower
        as: branch
        reads: [status, term_months]
        note: The excess adder tier is decided from the status and term of the business electricity agreement on the same premise.
    compute:
      - excess_line_amount: "LATEST('bizgas_billing','amount_usd', date_field='posted_date', line_type='swing_excess_charge')"
      - excess_cycle_start: "LATEST('bizgas_billing','billing_period_start', date_field='posted_date', line_type='swing_excess_charge')"
      - excess_cycle_end: "LATEST('bizgas_billing','billing_period_end', date_field='posted_date', line_type='swing_excess_charge')"
      - excess_line_posted: "LATEST('bizgas_billing','posted_date', date_field='posted_date', line_type='swing_excess_charge')"
      - excess_line_therms: "LATEST('bizgas_billing','usage_therms', date_field='posted_date', line_type='swing_excess_charge')"
      - cycle_index_price: "LATEST('bizgas_notices','index_price_usd_therm', date_field='notice_date', notice_type='monthly_index_price', effective_date=excess_cycle_start)"
      - monthly_contract_volume: "int(F('contract_annual_therms') / K('months_per_year') + 0.5)"
      - energy_lines_on_file: "COUNT('bizgas_billing', line_type='energy_charge')"
      - excess_lines_last_12m: "COUNT('bizgas_billing', within_months=12, date_field='billing_period_start', line_type='swing_excess_charge')"
      - swing_tolerance: "P('swing_tolerance_pct') + K('tol_bonus_established_pct') if energy_lines_on_file >= K('established_cycles') and excess_lines_last_12m <= 1 else (P('swing_tolerance_pct') + K('tol_bonus_settling_pct') if energy_lines_on_file >= K('settling_cycles') and energy_lines_on_file < K('established_cycles') and excess_lines_last_12m <= 1 else P('swing_tolerance_pct'))"
      - band_upper_end: "int(monthly_contract_volume * (100 + swing_tolerance) / 100 + 0.5)"
      - measured_excess: "MX(0, SUM('bizgas_billing','usage_therms', line_type='energy_charge', billing_period_start=excess_cycle_start) + excess_line_therms - band_upper_end)"
      - correct_excess_therms: "int(measured_excess / 2) if measured_excess <= monthly_contract_volume * K('minor_excursion_share') else (int(measured_excess * K('moderate_excursion_factor')) + (1 if measured_excess * K('moderate_excursion_factor') > int(measured_excess * K('moderate_excursion_factor')) else 0) if measured_excess <= monthly_contract_volume * K('moderate_excursion_share') else measured_excess)"
      - site_power_status: "CFIELD('bizpower','status', premise_id=F('premise_id'))"
      - site_power_term: "CFIELD('bizpower','term_months', premise_id=F('premise_id'))"
      - excess_adder: "K('bundle_adder_fixed') if site_power_status == 'active' and site_power_term > 0 else (K('bundle_adder_variable') if site_power_status == 'active' and site_power_term == 0 else P('swing_excess_adder_usd_therm'))"
      - excess_price: "cycle_index_price + excess_adder"
      - correct_excess_amount: "RND(correct_excess_therms * excess_price, 2)"
      - over_billed_amount: "MX(0, RND(excess_line_amount - correct_excess_amount, 2))"
      - rebills_last_24m: "COUNT('bizgas_billing', within_months=24, date_field='posted_date', line_type='rebill_credit')"
      - monthly_interest_rate: "K('repeat_interest_high') if rebills_last_24m >= 2 else (K('repeat_interest_low') if rebills_last_24m == 1 else 0)"
      - cycle_notice_date: "LATEST('bizgas_notices','notice_date', date_field='notice_date', notice_type='monthly_index_price', effective_date=excess_cycle_start)"
      - cycle_notice_channel: "LATEST('bizgas_notices','delivery_channel', date_field='notice_date', notice_type='monthly_index_price', effective_date=excess_cycle_start)"
      - interest_months: "MONTHS(excess_cycle_start, NOW) if cycle_notice_date > excess_cycle_start and cycle_notice_channel == 'mail' else (MONTHS(excess_cycle_end, NOW) if cycle_notice_date > excess_cycle_start and cycle_notice_channel == 'email' else MONTHS(excess_line_posted, NOW))"
      - overcharge_interest: "RND(over_billed_amount * monthly_interest_rate * interest_months, 2)"
      - result: "RND(over_billed_amount + overcharge_interest, 2)"
    compute_basis:
      excess_line_amount: "A swing excess correction is worked on the agreement's most recently posted swing_excess_charge line, read together with the energy_charge line of the same billing_period_start; the over-billed amount on that swing excess line is its billed amount_usd minus the correct swing excess amount, never below zero"
      excess_cycle_start: "A swing excess correction is worked on the agreement's most recently posted swing_excess_charge line, read together with the energy_charge line of the same billing_period_start"
      excess_cycle_end: "when that notice is dated after billing_period_start and was delivered by email, the anchor is the cycle's billing_period_end"
      excess_line_posted: "otherwise the anchor is the posted_date of the swing excess line"
      excess_line_therms: "The cycle usage is the usage_therms of that cycle's energy_charge line plus the usage_therms of the swing excess line."
      cycle_index_price: "Each correct excess therm is priced at the index_price_usd_therm of the monthly_index_price notice whose effective_date equals the cycle's billing_period_start"
      monthly_contract_volume: "The monthly contract volume is contract_annual_therms divided by months_per_year and rounded half up to a whole therm."
      energy_lines_on_file: "an agreement with at least established_cycles energy_charge lines on file"
      excess_lines_last_12m: "at most one swing_excess_charge line whose billing_period_start is later than the same calendar day twelve months before the correction date"
      swing_tolerance: "The swing tolerance that sets the upper end of the band follows the site's billing record: an agreement with at least established_cycles energy_charge lines on file and at most one swing_excess_charge line whose billing_period_start is later than the same calendar day twelve months before the correction date uses swing_tolerance_pct plus tol_bonus_established_pct; an agreement with at least settling_cycles but fewer than established_cycles energy_charge lines on file and at most one such swing_excess_charge line uses swing_tolerance_pct plus tol_bonus_settling_pct; any other agreement uses swing_tolerance_pct."
      band_upper_end: "The upper end of the band is the monthly contract volume times (100 plus the swing tolerance) percent, rounded half up to a whole therm"
      measured_excess: "The cycle usage is the usage_therms of that cycle's energy_charge line plus the usage_therms of the swing excess line. The measured excess therms are the cycle usage minus the upper end of the band, never below zero"
      correct_excess_therms: "Small excursions above the band are relieved: when the measured excess therms are no more than minor_excursion_share of the monthly contract volume, the correct excess therms are half the measured excess rounded down to a whole therm; when they are above minor_excursion_share and no more than moderate_excursion_share of the monthly contract volume, they are the measured excess times moderate_excursion_factor rounded up to a whole therm; when they are above moderate_excursion_share of it, they are counted as measured."
      site_power_status: "when the Beacon Ridge small business electricity agreement on that premise is active on a fixed term"
      site_power_term: "that is with term_months above 0"
      excess_adder: "The adder priced on excess therms follows the business's electricity supply at the same premise: when the Beacon Ridge small business electricity agreement on that premise is active on a fixed term, that is with term_months above 0, the adder is bundle_adder_fixed; when it is active on a month-to-month plan, that is with term_months equal to 0, the adder is bundle_adder_variable; in every other case the adder is swing_excess_adder_usd_therm."
      excess_price: "Each correct excess therm is priced at the index_price_usd_therm of the monthly_index_price notice whose effective_date equals the cycle's billing_period_start plus an adder of swing_excess_adder_usd_therm."
      correct_excess_amount: "The correct swing excess amount is the correct excess therms times that price per therm, rounded half up to the cent."
      over_billed_amount: "the over-billed amount on that swing excess line is its billed amount_usd minus the correct swing excess amount, never below zero"
      rebills_last_24m: "when two or more rebill_credit lines were posted on the agreement later than the same calendar day twenty-four months before the correction date"
      monthly_interest_rate: "Overcharge interest is due where the agreement has been over-billed before: when two or more rebill_credit lines were posted on the agreement later than the same calendar day twenty-four months before the correction date, the monthly interest rate is repeat_interest_high; when exactly one was, it is repeat_interest_low; when none was, no overcharge interest is due."
      cycle_notice_date: "when the cycle's monthly_index_price notice is dated after the cycle's billing_period_start"
      cycle_notice_channel: "and was delivered by mail"
      interest_months: "The months of overcharge interest are whole calendar months counted from an anchor to the correction date, a month counting only once the correction date's day of month has reached the anchor's day of month, and the anchor follows how the cycle's price was published: when the cycle's monthly_index_price notice is dated after the cycle's billing_period_start and was delivered by mail, the anchor is the cycle's billing_period_start; when that notice is dated after billing_period_start and was delivered by email, the anchor is the cycle's billing_period_end; otherwise the anchor is the posted_date of the swing excess line."
      overcharge_interest: "The overcharge interest is the over-billed amount times the monthly interest rate times the months of overcharge interest, rounded half up to the cent; it is worked on the over-billed amount itself and is added to it once."
      result: "The rebill credit equals the over-billed amount plus any overcharge interest due, rounded half up to the cent, and it is posted as a negative amount."
    factors:
      - id: swing_band_tolerance
        effect: parameter
        decides: swing_tolerance
        bindings: [energy_lines_on_file, excess_lines_last_12m, swing_tolerance]
        ladder:
          - when: "at least established_cycles energy_charge lines on file and at most one swing_excess_charge line with billing_period_start in the last twelve months"
            value: "P('swing_tolerance_pct') + K('tol_bonus_established_pct')"
          - when: "at least settling_cycles but fewer than established_cycles energy_charge lines on file and at most one swing_excess_charge line with billing_period_start in the last twelve months"
            value: "P('swing_tolerance_pct') + K('tol_bonus_settling_pct')"
          - when: "otherwise"
            value: "P('swing_tolerance_pct')"
        baseline:
          swing_tolerance: "P('swing_tolerance_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: excess_bundle_adder
        effect: parameter
        decides: excess_adder
        bindings: [site_power_status, site_power_term, excess_adder]
        ladder:
          - when: "the small business electricity agreement on the same premise is active and its term_months is above 0"
            value: "K('bundle_adder_fixed')"
          - when: "the small business electricity agreement on the same premise is active and its term_months equals 0"
            value: "K('bundle_adder_variable')"
          - when: "otherwise"
            value: "P('swing_excess_adder_usd_therm')"
        baseline:
          excess_adder: "P('swing_excess_adder_usd_therm')"
        evidence: [cross_category]
        cross_difficulty: bizpower
      - id: excursion_relief
        effect: method
        decides: correct_excess_therms
        bindings: [measured_excess, correct_excess_therms]
        ladder:
          - when: "measured excess therms no more than minor_excursion_share of the monthly contract volume"
            method: "the measured excess is halved and rounded down to a whole therm"
          - when: "measured excess therms above minor_excursion_share and no more than moderate_excursion_share of the monthly contract volume"
            method: "the measured excess is multiplied by moderate_excursion_factor and rounded up to a whole therm"
          - when: "otherwise"
            method: "the measured excess is counted as measured"
        baseline:
          correct_excess_therms: "measured_excess"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_overcharge_interest_rate
        effect: parameter
        decides: monthly_interest_rate
        bindings: [rebills_last_24m, monthly_interest_rate]
        ladder:
          - when: "two or more rebill_credit lines posted in the last twenty-four months"
            value: "K('repeat_interest_high')"
          - when: "exactly one rebill_credit line posted in the last twenty-four months"
            value: "K('repeat_interest_low')"
          - when: "otherwise"
            value: "0"
        baseline:
          monthly_interest_rate: "0"
        evidence: [history]
        cross_difficulty: null
      - id: interest_anchor
        effect: method
        decides: interest_months
        bindings: [cycle_notice_date, cycle_notice_channel, interest_months]
        ladder:
          - when: "the cycle's monthly_index_price notice is dated after billing_period_start and was delivered by mail"
            method: "interest months are counted from the cycle's billing_period_start"
          - when: "the cycle's monthly_index_price notice is dated after billing_period_start and was delivered by email"
            method: "interest months are counted from the cycle's billing_period_end"
          - when: "otherwise"
            method: "interest months are counted from the posted_date of the swing excess line"
        baseline:
          interest_months: "MONTHS(excess_line_posted, NOW)"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        A swing excess correction is worked on the agreement's most recently posted swing_excess_charge line, read together with the energy_charge line of the same billing_period_start; the over-billed amount on that swing excess line is its billed amount_usd minus the correct swing excess amount, never below zero, and it is returned as one rebill_credit tied to the line through source_billing_id and dated on the correction date.
        The cycle usage is the usage_therms of that cycle's energy_charge line plus the usage_therms of the swing excess line.
        The monthly contract volume is contract_annual_therms divided by months_per_year and rounded half up to a whole therm.
        The upper end of the band is the monthly contract volume times (100 plus the swing tolerance) percent, rounded half up to a whole therm, where the swing tolerance is swing_tolerance_pct.
        The measured excess therms are the cycle usage minus the upper end of the band, never below zero, and the correct excess therms are the measured excess therms.
        Each correct excess therm is priced at the index_price_usd_therm of the monthly_index_price notice whose effective_date equals the cycle's billing_period_start plus an adder of swing_excess_adder_usd_therm.
        The correct swing excess amount is the correct excess therms times that price per therm, rounded half up to the cent.
        The rebill credit equals the over-billed amount plus any overcharge interest due, rounded half up to the cent, and it is posted as a negative amount.
      params: [months_per_year, swing_tolerance_pct, swing_excess_adder_usd_therm]
    inputs:
      history:
        - {table: bizgas_billing, aggregate: latest, field: amount_usd, filters: {line_type: swing_excess_charge}}
        - {table: bizgas_billing, aggregate: sum, field: usage_therms, filters: {line_type: energy_charge}}
        - {table: bizgas_billing, aggregate: count, field: bizgas_billing_id, filters: {line_type: energy_charge}}
        - {table: bizgas_billing, aggregate: count, field: bizgas_billing_id, within_months: 12, filters: {line_type: swing_excess_charge}}
        - {table: bizgas_billing, aggregate: count, field: bizgas_billing_id, within_months: 24, filters: {line_type: rebill_credit}}
        - {table: bizgas_notices, aggregate: latest, field: index_price_usd_therm, filters: {notice_type: monthly_index_price}}
      cross_category: [bizpower]

  - id: bizgas_ext_renewal_loyalty_credit
    base_policy_refs: [bizgas_renewal]
    overwrite:
      - base_policy: bizgas_renewal
        superseded_clause: >-
          Each renewal earns one renewal_loyalty_credit equal to the renewal_loyalty_credit_usd of the plan renewed into.
        replaced_by: >-
          The base credit is the renewal_loyalty_credit_usd of the plan in force on the acceptance date.
    trigger: on_request
    subject: [bizgas_renew, bizgas_credit]
    computes: loyalty_credit_usd
    target_tool: accept_bizgas_renewal_offer_c0a82e44
    params:
      repeat_renewal_multiplier: 2
      broker_first_renewal_multiplier: 0.5
      two_year_cycles: 24
      one_year_cycles: 12
      spend_high_usd: 30000
      spend_mid_usd: 15000
      spend_mult_high: 1.5
      spend_mult_mid: 1.25
      tenure_long_months: 48
      tenure_mid_months: 24
      tenure_bonus_long_usd: 40
      tenure_bonus_mid_usd: 20
      bundle_full_cycles: 10
      bundle_bonus_full_usd: 50
      bundle_bonus_partial_usd: 25
      early_days: 21
      early_bonus_usd: 25
      ontime_bonus_usd: 10
    rule: >-
      When a business accepts the renewal offer of a commercial gas agreement on or before its contract_end_date, the renewal loyalty credit is booked with the acceptance as one renewal_loyalty_credit line, a negative amount on the bill of the first cycle of the new term.
      The base credit is the renewal_loyalty_credit_usd of the plan in force on the acceptance date.
      An acceptance on or before contract_end_date takes the plan, term and price of the final_options_notice where the two expiration notices of the expiring term differ.
      The renewal loyalty credit starts from the base credit and is rounded half up to the cent once, at the end.
      The renewal loyalty credit is fixed only after the agreement's most recently posted swing excess line, when its billed amount is above the correct swing excess amount and its correction lookback has not ended, carries its own rebill credit.
      The base credit is carried into the loyalty credit according to the agreement's renewal history: when one or more renewal_loyalty_credit lines are already on the agreement, the base credit is multiplied by repeat_renewal_multiplier; when none is on it and the agreement was enrolled through the broker channel, it is multiplied by broker_first_renewal_multiplier; when none is on it and the agreement was enrolled by phone or web, it is carried as it is.
      The spend the loyalty credit is sized on is measured over a window that follows the agreement's billing history: when the agreement has at least two_year_cycles energy_charge lines on file, it is half the sum of amount_usd of every bill line of the agreement, credits and rebill credits included, posted later than the same calendar day twenty-four months before the acceptance date, rounded half up to the cent; when it has fewer than one_year_cycles energy_charge lines on file, it is the twelve-month sum described next multiplied by twelve and divided by the number of energy_charge lines on file, rounded half up to the cent; when it has at least one_year_cycles but fewer than two_year_cycles energy_charge lines on file, it is the sum of amount_usd of every bill line of the agreement, credits and rebill credits included, posted later than the same calendar day twelve months before the acceptance date.
      The spend multiplier follows that spend: at or above spend_high_usd it is spend_mult_high; at or above spend_mid_usd and below spend_high_usd it is spend_mult_mid; below spend_mid_usd it is 1; the base credit as carried is multiplied by the spend multiplier before any bonus is added.
      A tenure bonus is added for long supply: when the whole calendar months from service_start_date to the acceptance date, a month counting only once the acceptance date's day of month has reached the start date's, are at least tenure_long_months the bonus is tenure_bonus_long_usd; when they are at least tenure_mid_months and fewer than tenure_long_months it is tenure_bonus_mid_usd; when they are fewer than tenure_mid_months there is no tenure bonus.
      A bundle bonus is added for businesses that also take Beacon Ridge small business electricity at the same premise: when the small business electricity agreement on that premise is active and the business's small business electricity bills carry at least bundle_full_cycles energy_charge lines whose billing_period_start is later than the same calendar day twelve months before the acceptance date, the bonus is bundle_bonus_full_usd; when that agreement is active and those bills carry fewer such lines, it is bundle_bonus_partial_usd; when no small business electricity agreement on that premise is active there is no bundle bonus.
      An early-acceptance bonus is added by how far ahead of contract_end_date the offer is accepted, counted in calendar days from the acceptance date to contract_end_date: at least early_days days ahead it is early_bonus_usd; from one day up to fewer than early_days days ahead it is ontime_bonus_usd; on contract_end_date itself there is no early-acceptance bonus.
      The tenure bonus, the bundle bonus and the early-acceptance bonus are added after the spend multiplier has been applied, and none of them is multiplied.
    prerequisite:
      - problem: bizgas_ext_swing_excess_rebill
        kind: value_input
        gate: spend_24m
        form: state
        policy_source: >-
          The renewal loyalty credit is fixed only after the agreement's most recently posted swing excess line, when its billed amount is above the correct swing excess amount and its correction lookback has not ended, carries its own rebill credit.
        condition: >-
          The most recently posted swing_excess_charge line of the agreement, when its billed amount_usd exceeds the correct swing excess amount and its posted_date is no more than billing_dispute_lookback_months calendar months before the handling date, has a rebill_credit line in bizgas_billing whose source_billing_id points at it, so the spend sums read the agreement's net billed charges.
        resolved_by: post_bizgas_swing_rebill_d99acf60
        effect: >-
          The rebill credit line lowers the twenty-four-month and twelve-month spend sums by the credited amount, which can move the spend measure across a spend multiplier threshold and so changes the multiplier applied to the base credit.
    cross_category:
      - category: bizpower
        as: history
        reads: [status, bizpower_billing.line_type, bizpower_billing.billing_period_start]
        note: The bundle bonus tier is decided from the status of the business electricity agreement on the same premise and the count of the business's electricity energy lines over the last twelve months.
    compute:
      - base_credit: "P('renewal_loyalty_credit_usd')"
      - loyalty_credits_on_file: "COUNT('bizgas_billing', line_type='renewal_loyalty_credit')"
      - carried_base_credit: "base_credit * K('repeat_renewal_multiplier') if loyalty_credits_on_file >= 1 else (base_credit * K('broker_first_renewal_multiplier') if loyalty_credits_on_file == 0 and F('enrollment_channel') == 'broker' else base_credit)"
      - energy_cycles_on_file: "COUNT('bizgas_billing', line_type='energy_charge')"
      - spend_12m: "SUM('bizgas_billing','amount_usd', within_months=12, date_field='posted_date')"
      - spend_24m: "SUM('bizgas_billing','amount_usd', within_months=24, date_field='posted_date')"
      - credit_spend_measure: "RND(spend_24m / 2, 2) if energy_cycles_on_file >= K('two_year_cycles') else (RND(spend_12m * 12 / MX(energy_cycles_on_file, 1), 2) if energy_cycles_on_file < K('one_year_cycles') else spend_12m)"
      - spend_multiplier: "K('spend_mult_high') if credit_spend_measure >= K('spend_high_usd') else (K('spend_mult_mid') if credit_spend_measure >= K('spend_mid_usd') else 1)"
      - supply_months: "MONTHS(F('service_start_date'), NOW)"
      - tenure_bonus: "K('tenure_bonus_long_usd') if supply_months >= K('tenure_long_months') else (K('tenure_bonus_mid_usd') if supply_months >= K('tenure_mid_months') else 0)"
      - site_power_status: "CFIELD('bizpower','status', premise_id=F('premise_id'))"
      - power_cycles_12m: "XCOUNT('bizpower','bizpower_billing', within_months=12, date_field='billing_period_start', line_type='energy_charge')"
      - bundle_bonus: "K('bundle_bonus_full_usd') if site_power_status == 'active' and power_cycles_12m >= K('bundle_full_cycles') else (K('bundle_bonus_partial_usd') if site_power_status == 'active' and power_cycles_12m < K('bundle_full_cycles') else 0)"
      - days_ahead_of_end: "DAYS(NOW, F('contract_end_date'))"
      - early_bonus: "K('early_bonus_usd') if days_ahead_of_end >= K('early_days') else (K('ontime_bonus_usd') if days_ahead_of_end >= 1 else 0)"
      - result: "RND(carried_base_credit * spend_multiplier + tenure_bonus + bundle_bonus + early_bonus, 2)"
    compute_basis:
      base_credit: "The base credit is the renewal_loyalty_credit_usd of the plan in force on the acceptance date."
      loyalty_credits_on_file: "when one or more renewal_loyalty_credit lines are already on the agreement"
      carried_base_credit: "The base credit is carried into the loyalty credit according to the agreement's renewal history: when one or more renewal_loyalty_credit lines are already on the agreement, the base credit is multiplied by repeat_renewal_multiplier; when none is on it and the agreement was enrolled through the broker channel, it is multiplied by broker_first_renewal_multiplier; when none is on it and the agreement was enrolled by phone or web, it is carried as it is."
      energy_cycles_on_file: "when the agreement has at least two_year_cycles energy_charge lines on file"
      spend_12m: "the sum of amount_usd of every bill line of the agreement, credits and rebill credits included, posted later than the same calendar day twelve months before the acceptance date"
      spend_24m: "half the sum of amount_usd of every bill line of the agreement, credits and rebill credits included, posted later than the same calendar day twenty-four months before the acceptance date, rounded half up to the cent"
      credit_spend_measure: "The spend the loyalty credit is sized on is measured over a window that follows the agreement's billing history: when the agreement has at least two_year_cycles energy_charge lines on file, it is half the sum of amount_usd of every bill line of the agreement, credits and rebill credits included, posted later than the same calendar day twenty-four months before the acceptance date, rounded half up to the cent; when it has fewer than one_year_cycles energy_charge lines on file, it is the twelve-month sum described next multiplied by twelve and divided by the number of energy_charge lines on file, rounded half up to the cent; when it has at least one_year_cycles but fewer than two_year_cycles energy_charge lines on file, it is the sum of amount_usd of every bill line of the agreement, credits and rebill credits included, posted later than the same calendar day twelve months before the acceptance date."
      spend_multiplier: "The spend multiplier follows that spend: at or above spend_high_usd it is spend_mult_high; at or above spend_mid_usd and below spend_high_usd it is spend_mult_mid; below spend_mid_usd it is 1; the base credit as carried is multiplied by the spend multiplier before any bonus is added."
      supply_months: "when the whole calendar months from service_start_date to the acceptance date, a month counting only once the acceptance date's day of month has reached the start date's, are at least tenure_long_months"
      tenure_bonus: "A tenure bonus is added for long supply: when the whole calendar months from service_start_date to the acceptance date, a month counting only once the acceptance date's day of month has reached the start date's, are at least tenure_long_months the bonus is tenure_bonus_long_usd; when they are at least tenure_mid_months and fewer than tenure_long_months it is tenure_bonus_mid_usd; when they are fewer than tenure_mid_months there is no tenure bonus."
      site_power_status: "when the small business electricity agreement on that premise is active"
      power_cycles_12m: "the business's small business electricity bills carry at least bundle_full_cycles energy_charge lines whose billing_period_start is later than the same calendar day twelve months before the acceptance date"
      bundle_bonus: "A bundle bonus is added for businesses that also take Beacon Ridge small business electricity at the same premise: when the small business electricity agreement on that premise is active and the business's small business electricity bills carry at least bundle_full_cycles energy_charge lines whose billing_period_start is later than the same calendar day twelve months before the acceptance date, the bonus is bundle_bonus_full_usd; when that agreement is active and those bills carry fewer such lines, it is bundle_bonus_partial_usd; when no small business electricity agreement on that premise is active there is no bundle bonus."
      days_ahead_of_end: "counted in calendar days from the acceptance date to contract_end_date"
      early_bonus: "An early-acceptance bonus is added by how far ahead of contract_end_date the offer is accepted, counted in calendar days from the acceptance date to contract_end_date: at least early_days days ahead it is early_bonus_usd; from one day up to fewer than early_days days ahead it is ontime_bonus_usd; on contract_end_date itself there is no early-acceptance bonus."
      result: "The tenure bonus, the bundle bonus and the early-acceptance bonus are added after the spend multiplier has been applied, and none of them is multiplied."
    factors:
      - id: renewal_history_carry
        effect: parameter
        decides: carried_base_credit
        bindings: [loyalty_credits_on_file, carried_base_credit]
        ladder:
          - when: "one or more renewal_loyalty_credit lines already on the agreement"
            value: "base credit x K('repeat_renewal_multiplier')"
          - when: "no renewal_loyalty_credit line on the agreement and the agreement was enrolled through the broker channel"
            value: "base credit x K('broker_first_renewal_multiplier')"
          - when: "otherwise (no renewal_loyalty_credit line, enrolled by phone or web)"
            value: "base credit x 1"
        baseline:
          carried_base_credit: "base_credit"
        evidence: [history]
        cross_difficulty: null
      - id: credit_spend_window
        effect: method
        decides: credit_spend_measure
        bindings: [energy_cycles_on_file, credit_spend_measure]
        ladder:
          - when: "at least two_year_cycles energy_charge lines on file"
            method: "half the twenty-four-month sum of posted bill lines"
          - when: "fewer than one_year_cycles energy_charge lines on file"
            method: "the twelve-month sum annualised by twelve over the number of energy_charge lines"
          - when: "otherwise"
            method: "the twelve-month sum of posted bill lines"
        baseline:
          credit_spend_measure: "spend_12m"
        evidence: [history]
        cross_difficulty: null
      - id: credit_spend_multiplier
        effect: parameter
        decides: spend_multiplier
        bindings: [spend_12m, spend_24m, spend_multiplier]
        ladder:
          - when: "spend at or above spend_high_usd"
            value: "K('spend_mult_high')"
          - when: "spend at or above spend_mid_usd and below spend_high_usd"
            value: "K('spend_mult_mid')"
          - when: "otherwise"
            value: "1"
        baseline:
          spend_multiplier: "1"
        evidence: [history]
        cross_difficulty: null
      - id: supply_tenure_bonus
        effect: parameter
        decides: tenure_bonus
        bindings: [supply_months, tenure_bonus]
        ladder:
          - when: "at least tenure_long_months whole months since service_start_date"
            value: "K('tenure_bonus_long_usd')"
          - when: "at least tenure_mid_months and fewer than tenure_long_months whole months since service_start_date"
            value: "K('tenure_bonus_mid_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_bonus: "0"
        evidence: [date]
        cross_difficulty: null
      - id: electricity_bundle_bonus
        effect: parameter
        decides: bundle_bonus
        bindings: [site_power_status, power_cycles_12m, bundle_bonus]
        ladder:
          - when: "the small business electricity agreement on the same premise is active and at least bundle_full_cycles electricity energy lines with billing_period_start in the last twelve months"
            value: "K('bundle_bonus_full_usd')"
          - when: "the small business electricity agreement on the same premise is active and fewer than bundle_full_cycles such lines"
            value: "K('bundle_bonus_partial_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          bundle_bonus: "0"
        evidence: [cross_category, history]
        cross_difficulty: bizpower
      - id: early_acceptance_bonus
        effect: parameter
        decides: early_bonus
        bindings: [days_ahead_of_end, early_bonus]
        ladder:
          - when: "accepted at least early_days calendar days before contract_end_date"
            value: "K('early_bonus_usd')"
          - when: "accepted from one day up to fewer than early_days days before contract_end_date"
            value: "K('ontime_bonus_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          early_bonus: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        When a business accepts the renewal offer of a commercial gas agreement on or before its contract_end_date, the renewal loyalty credit is booked with the acceptance as one renewal_loyalty_credit line, a negative amount on the bill of the first cycle of the new term.
        The base credit is the renewal_loyalty_credit_usd of the plan in force on the acceptance date.
        The renewal loyalty credit starts from the base credit and is rounded half up to the cent once, at the end.
      params: [renewal_loyalty_credit_usd]
    inputs:
      history:
        - {table: bizgas_billing, aggregate: count, field: bizgas_billing_id, filters: {line_type: renewal_loyalty_credit}}
        - {table: bizgas_billing, aggregate: count, field: bizgas_billing_id, filters: {line_type: energy_charge}}
        - {table: bizgas_billing, aggregate: sum, field: amount_usd, within_months: 12, filters: {}}
        - {table: bizgas_billing, aggregate: sum, field: amount_usd, within_months: 24, filters: {}}
        - {category: bizpower, table: bizpower_billing, aggregate: count, field: bizpower_billing_id, within_months: 12, filters: {line_type: energy_charge}}
      cross_category: [bizpower]

  - id: bizgas_ext_swing_shortfall_rebill
    base_policy_refs: [bizgas_billing_correction, bizgas_swing, bizgas_agg_portfolio_bandwidth]
    overwrite:
      - base_policy: bizgas_swing
        superseded_clause: >-
          The band runs from the monthly volume times (100 minus swing_tolerance_pct) percent to the monthly volume times (100 plus swing_tolerance_pct) percent, each rounded half up to a whole therm, both ends inclusive.
        replaced_by: >-
          The lower end is lowered for seasoned sites: an agreement with at least seasoned_cycles energy_charge lines on file that already carries a renewal_loyalty_credit line has its billed lower end lowered by renewed_site_tol_bonus_pct percent of the monthly contract volume; an agreement with at least seasoned_cycles energy_charge lines on file and no renewal_loyalty_credit line has it lowered by first_term_tol_bonus_pct percent of the monthly contract volume; any other agreement keeps the billed lower end; the reduction is rounded half up to a whole therm. The lowered lower end is then fitted to the length of the cycle, counted in days from billing_period_start to billing_period_end with both ends included: a cycle shorter than short_cycle_days days has it multiplied by its days and divided by days_per_month_convention; a cycle longer than long_cycle_days days has it multiplied by its days, by months_per_year, and divided by days_per_year; any other cycle keeps it unchanged; the fitted lower end is rounded half up to a whole therm, and the correct shortfall therms are measured against it. A shortfall deadband is taken off the measured shortfall therms before they are charged, never below zero: an agreement with at least deadband_long_cycles energy_charge lines on file has a deadband of deadband_long_therms; an agreement with at least seasoned_cycles but fewer than deadband_long_cycles such lines has deadband_mid_therms; any other agreement has no deadband.
      - base_policy: bizgas_swing
        superseded_clause: >-
          When usage is below the lower end, all usage is billed on the energy line and the shortfall therms are billed on a swing_shortfall_charge line at swing_shortfall_charge_usd_therm.
        replaced_by: >-
          The shortfall charge per therm follows the business's electricity supply at the same premise: when the Beacon Ridge small business electricity agreement on that premise is active and the business's small business electricity energy_charge lines whose billing_period_start is later than the same calendar day twelve months before the correction date sum to at least power_spend_threshold_usd, the charge is shortfall_rate_bundled_high; when that agreement is active and those lines sum to less, the charge is shortfall_rate_bundled_low; in every other case it is the rate_usd_therm on the shortfall line.
      - base_policy: bizgas_billing_correction
        superseded_clause: >-
          equal to the billed amount_usd minus the correctly computed amount and posted as a negative amount
        replaced_by: >-
          The shortfall rebill credit equals the over-billed amount, together with a service recovery credit only where one is due, rounded half up to the cent, and it is posted as a negative amount.
    trigger: state_due
    subject: [bizgas_adjustment]
    computes: rebill_amount_usd
    target_tool: post_bizgas_shortfall_rebill_b4d87cc1
    params:
      months_per_year: 12
      seasoned_cycles: 24
      renewed_site_tol_bonus_pct: 10
      first_term_tol_bonus_pct: 5
      power_spend_threshold_usd: 15000
      shortfall_rate_bundled_high: 0.0300
      shortfall_rate_bundled_low: 0.0450
      short_cycle_days: 28
      long_cycle_days: 32
      days_per_month_convention: 30
      days_per_year: 365
      deadband_long_cycles: 36
      deadband_long_therms: 100
      deadband_mid_therms: 50
      recovery_credit_repeat_usd: 25.00
      recovery_credit_first_usd: 10.00
    rule: >-
      A swing shortfall correction is worked on the agreement's most recently posted swing_shortfall_charge line, read together with the energy_charge line of the same billing_period_start; the over-billed amount on that shortfall line is its billed amount_usd minus the correct shortfall amount, never below zero, and it is returned as one rebill_credit tied to the line through source_billing_id and dated on the correction date.
      A business that asks for the shortfall line to be put right once it has been pointed out to it is disputing that line.
      This shortfall correction covers an agreement whose plan has portfolio_bandwidth false, or an agreement that is the business's only commercial gas agreement on a plan with portfolio_bandwidth true; where the business has two or more agreements on plans with portfolio_bandwidth true, the portfolio measure decides the swing and the shortfall line is outside this correction.
      The cycle usage is the usage_therms of that cycle's energy_charge line.
      The billed lower end is the cycle usage plus the usage_therms of the shortfall line, that is the lower end of the band the line was billed against under the plan in force on the cycle's billing_period_start.
      The monthly contract volume is contract_annual_therms divided by months_per_year and rounded half up to a whole therm.
      The correct shortfall therms are the billed lower end minus the cycle usage, never below zero, and each is charged at the rate_usd_therm on the shortfall line.
      The correct shortfall amount is the correct shortfall therms times the shortfall charge per therm, rounded half up to the cent.
      The shortfall rebill credit equals the over-billed amount, together with a service recovery credit only where one is due, rounded half up to the cent, and it is posted as a negative amount.
      The lower end is lowered for seasoned sites: an agreement with at least seasoned_cycles energy_charge lines on file that already carries a renewal_loyalty_credit line has its billed lower end lowered by renewed_site_tol_bonus_pct percent of the monthly contract volume; an agreement with at least seasoned_cycles energy_charge lines on file and no renewal_loyalty_credit line has it lowered by first_term_tol_bonus_pct percent of the monthly contract volume; any other agreement keeps the billed lower end; the reduction is rounded half up to a whole therm.
      The lowered lower end is then fitted to the length of the cycle, counted in days from billing_period_start to billing_period_end with both ends included: a cycle shorter than short_cycle_days days has it multiplied by its days and divided by days_per_month_convention; a cycle longer than long_cycle_days days has it multiplied by its days, by months_per_year, and divided by days_per_year; any other cycle keeps it unchanged; the fitted lower end is rounded half up to a whole therm, and the correct shortfall therms are measured against it.
      A shortfall deadband is taken off the measured shortfall therms before they are charged, never below zero: an agreement with at least deadband_long_cycles energy_charge lines on file has a deadband of deadband_long_therms; an agreement with at least seasoned_cycles but fewer than deadband_long_cycles such lines has deadband_mid_therms; any other agreement has no deadband.
      The shortfall charge per therm follows the business's electricity supply at the same premise: when the Beacon Ridge small business electricity agreement on that premise is active and the business's small business electricity energy_charge lines whose billing_period_start is later than the same calendar day twelve months before the correction date sum to at least power_spend_threshold_usd, the charge is shortfall_rate_bundled_high; when that agreement is active and those lines sum to less, the charge is shortfall_rate_bundled_low; in every other case it is the rate_usd_therm on the shortfall line.
      A service recovery credit is added for businesses Beacon Ridge has had to correct before: when two or more rebill_credit lines were posted on the agreement later than the same calendar day twenty-four months before the correction date, it is recovery_credit_repeat_usd; when exactly one was, it is recovery_credit_first_usd; when none was, there is no service recovery credit.
    prerequisite: []
    cross_category:
      - category: bizpower
        as: history
        reads: [status, bizpower_billing.amount_usd, bizpower_billing.line_type, bizpower_billing.billing_period_start]
        note: The shortfall charge tier is decided from the status of the business electricity agreement on the same premise and the business's electricity energy charges over the last twelve months.
    compute:
      - shortfall_line_amount: "LATEST('bizgas_billing','amount_usd', date_field='posted_date', line_type='swing_shortfall_charge')"
      - shortfall_cycle_start: "LATEST('bizgas_billing','billing_period_start', date_field='posted_date', line_type='swing_shortfall_charge')"
      - shortfall_cycle_end: "LATEST('bizgas_billing','billing_period_end', date_field='posted_date', line_type='swing_shortfall_charge')"
      - shortfall_line_therms: "LATEST('bizgas_billing','usage_therms', date_field='posted_date', line_type='swing_shortfall_charge')"
      - shortfall_line_rate: "LATEST('bizgas_billing','rate_usd_therm', date_field='posted_date', line_type='swing_shortfall_charge')"
      - shortfall_cycle_usage: "SUM('bizgas_billing','usage_therms', line_type='energy_charge', billing_period_start=shortfall_cycle_start)"
      - billed_lower_end: "shortfall_cycle_usage + shortfall_line_therms"
      - monthly_contract_volume: "int(F('contract_annual_therms') / K('months_per_year') + 0.5)"
      - energy_lines_on_file: "COUNT('bizgas_billing', line_type='energy_charge')"
      - loyalty_lines_on_file: "COUNT('bizgas_billing', line_type='renewal_loyalty_credit')"
      - lowered_lower_end: "billed_lower_end - int(monthly_contract_volume * K('renewed_site_tol_bonus_pct') / 100 + 0.5) if energy_lines_on_file >= K('seasoned_cycles') and loyalty_lines_on_file >= 1 else (billed_lower_end - int(monthly_contract_volume * K('first_term_tol_bonus_pct') / 100 + 0.5) if energy_lines_on_file >= K('seasoned_cycles') and loyalty_lines_on_file == 0 else billed_lower_end)"
      - shortfall_cycle_days: "DAYS(shortfall_cycle_start, shortfall_cycle_end) + 1"
      - fitted_lower_end: "int(lowered_lower_end * shortfall_cycle_days / K('days_per_month_convention') + 0.5) if shortfall_cycle_days < K('short_cycle_days') else (int(lowered_lower_end * shortfall_cycle_days * K('months_per_year') / K('days_per_year') + 0.5) if shortfall_cycle_days > K('long_cycle_days') else lowered_lower_end)"
      - deadband_energy_lines: "COUNT('bizgas_billing', line_type='energy_charge')"
      - shortfall_deadband: "K('deadband_long_therms') if deadband_energy_lines >= K('deadband_long_cycles') else (K('deadband_mid_therms') if deadband_energy_lines >= K('seasoned_cycles') else 0)"
      - correct_shortfall_therms: "MX(0, fitted_lower_end - shortfall_cycle_usage - shortfall_deadband)"
      - site_power_status: "CFIELD('bizpower','status', premise_id=F('premise_id'))"
      - power_energy_spend_12m: "XSUM('bizpower','bizpower_billing','amount_usd', within_months=12, date_field='billing_period_start', line_type='energy_charge')"
      - shortfall_rate: "K('shortfall_rate_bundled_high') if site_power_status == 'active' and power_energy_spend_12m >= K('power_spend_threshold_usd') else (K('shortfall_rate_bundled_low') if site_power_status == 'active' and power_energy_spend_12m < K('power_spend_threshold_usd') else shortfall_line_rate)"
      - correct_shortfall_amount: "RND(correct_shortfall_therms * shortfall_rate, 2)"
      - shortfall_over_billed: "MX(0, RND(shortfall_line_amount - correct_shortfall_amount, 2))"
      - rebills_last_24m: "COUNT('bizgas_billing', within_months=24, date_field='posted_date', line_type='rebill_credit')"
      - service_recovery_credit: "K('recovery_credit_repeat_usd') if rebills_last_24m >= 2 else (K('recovery_credit_first_usd') if rebills_last_24m == 1 else 0)"
      - result: "RND(shortfall_over_billed + service_recovery_credit, 2)"
    compute_basis:
      shortfall_line_amount: "the over-billed amount on that shortfall line is its billed amount_usd minus the correct shortfall amount, never below zero"
      shortfall_cycle_start: "A swing shortfall correction is worked on the agreement's most recently posted swing_shortfall_charge line, read together with the energy_charge line of the same billing_period_start"
      shortfall_cycle_end: "counted in days from billing_period_start to billing_period_end with both ends included"
      shortfall_line_therms: "The billed lower end is the cycle usage plus the usage_therms of the shortfall line"
      shortfall_line_rate: "each is charged at the rate_usd_therm on the shortfall line"
      shortfall_cycle_usage: "The cycle usage is the usage_therms of that cycle's energy_charge line."
      billed_lower_end: "The billed lower end is the cycle usage plus the usage_therms of the shortfall line, that is the lower end of the band the line was billed against under the plan in force on the cycle's billing_period_start."
      monthly_contract_volume: "The monthly contract volume is contract_annual_therms divided by months_per_year and rounded half up to a whole therm."
      energy_lines_on_file: "an agreement with at least seasoned_cycles energy_charge lines on file"
      loyalty_lines_on_file: "that already carries a renewal_loyalty_credit line"
      lowered_lower_end: "The lower end is lowered for seasoned sites: an agreement with at least seasoned_cycles energy_charge lines on file that already carries a renewal_loyalty_credit line has its billed lower end lowered by renewed_site_tol_bonus_pct percent of the monthly contract volume; an agreement with at least seasoned_cycles energy_charge lines on file and no renewal_loyalty_credit line has it lowered by first_term_tol_bonus_pct percent of the monthly contract volume; any other agreement keeps the billed lower end; the reduction is rounded half up to a whole therm."
      shortfall_cycle_days: "counted in days from billing_period_start to billing_period_end with both ends included"
      fitted_lower_end: "The lowered lower end is then fitted to the length of the cycle, counted in days from billing_period_start to billing_period_end with both ends included: a cycle shorter than short_cycle_days days has it multiplied by its days and divided by days_per_month_convention; a cycle longer than long_cycle_days days has it multiplied by its days, by months_per_year, and divided by days_per_year; any other cycle keeps it unchanged; the fitted lower end is rounded half up to a whole therm, and the correct shortfall therms are measured against it."
      deadband_energy_lines: "an agreement with at least deadband_long_cycles energy_charge lines on file has a deadband of deadband_long_therms"
      shortfall_deadband: "A shortfall deadband is taken off the measured shortfall therms before they are charged, never below zero: an agreement with at least deadband_long_cycles energy_charge lines on file has a deadband of deadband_long_therms; an agreement with at least seasoned_cycles but fewer than deadband_long_cycles such lines has deadband_mid_therms; any other agreement has no deadband."
      correct_shortfall_therms: "The correct shortfall therms are the billed lower end minus the cycle usage, never below zero"
      site_power_status: "when the Beacon Ridge small business electricity agreement on that premise is active"
      power_energy_spend_12m: "the business's small business electricity energy_charge lines whose billing_period_start is later than the same calendar day twelve months before the correction date sum to at least power_spend_threshold_usd"
      shortfall_rate: "The shortfall charge per therm follows the business's electricity supply at the same premise: when the Beacon Ridge small business electricity agreement on that premise is active and the business's small business electricity energy_charge lines whose billing_period_start is later than the same calendar day twelve months before the correction date sum to at least power_spend_threshold_usd, the charge is shortfall_rate_bundled_high; when that agreement is active and those lines sum to less, the charge is shortfall_rate_bundled_low; in every other case it is the rate_usd_therm on the shortfall line."
      correct_shortfall_amount: "The correct shortfall amount is the correct shortfall therms times the shortfall charge per therm, rounded half up to the cent."
      shortfall_over_billed: "the over-billed amount on that shortfall line is its billed amount_usd minus the correct shortfall amount, never below zero"
      rebills_last_24m: "when two or more rebill_credit lines were posted on the agreement later than the same calendar day twenty-four months before the correction date"
      service_recovery_credit: "A service recovery credit is added for businesses Beacon Ridge has had to correct before: when two or more rebill_credit lines were posted on the agreement later than the same calendar day twenty-four months before the correction date, it is recovery_credit_repeat_usd; when exactly one was, it is recovery_credit_first_usd; when none was, there is no service recovery credit."
      result: "The shortfall rebill credit equals the over-billed amount, together with a service recovery credit only where one is due, rounded half up to the cent, and it is posted as a negative amount."
    factors:
      - id: seasoned_site_lower_end
        effect: parameter
        decides: lowered_lower_end
        bindings: [energy_lines_on_file, loyalty_lines_on_file, lowered_lower_end]
        ladder:
          - when: "at least seasoned_cycles energy_charge lines on file and a renewal_loyalty_credit line on the agreement"
            value: "K('renewed_site_tol_bonus_pct') percent of the monthly contract volume off the billed lower end"
          - when: "at least seasoned_cycles energy_charge lines on file and no renewal_loyalty_credit line"
            value: "K('first_term_tol_bonus_pct') percent of the monthly contract volume off the billed lower end"
          - when: "otherwise"
            value: "no reduction (the billed lower end)"
        baseline:
          lowered_lower_end: "billed_lower_end"
        evidence: [history]
        cross_difficulty: null
      - id: cycle_length_fit
        effect: method
        decides: fitted_lower_end
        bindings: [shortfall_cycle_days, fitted_lower_end]
        ladder:
          - when: "a cycle shorter than short_cycle_days days"
            method: "the lower end is multiplied by the cycle's days and divided by days_per_month_convention (actual over thirty)"
          - when: "a cycle longer than long_cycle_days days"
            method: "the lower end is multiplied by the cycle's days and by months_per_year and divided by days_per_year (actual over a twelfth of a year)"
          - when: "otherwise"
            method: "the lower end is used unchanged"
        baseline:
          fitted_lower_end: "lowered_lower_end"
        evidence: [date]
        cross_difficulty: null
      - id: shortfall_deadband_therms
        effect: parameter
        decides: shortfall_deadband
        bindings: [deadband_energy_lines, shortfall_deadband]
        ladder:
          - when: "at least deadband_long_cycles energy_charge lines on file"
            value: "K('deadband_long_therms')"
          - when: "at least seasoned_cycles but fewer than deadband_long_cycles energy_charge lines on file"
            value: "K('deadband_mid_therms')"
          - when: "otherwise"
            value: "0"
        baseline:
          shortfall_deadband: "0"
        evidence: [history]
        cross_difficulty: null
      - id: bundled_shortfall_rate
        effect: parameter
        decides: shortfall_rate
        bindings: [site_power_status, power_energy_spend_12m, shortfall_rate]
        ladder:
          - when: "the electricity agreement on the same premise is active and the business's electricity energy charges of the last twelve months reach power_spend_threshold_usd"
            value: "K('shortfall_rate_bundled_high')"
          - when: "the electricity agreement on the same premise is active and those charges are below power_spend_threshold_usd"
            value: "K('shortfall_rate_bundled_low')"
          - when: "otherwise"
            value: "the rate_usd_therm on the shortfall line"
        baseline:
          shortfall_rate: "shortfall_line_rate"
        evidence: [cross_category, history]
        cross_difficulty: bizpower
      - id: service_recovery_credit_tier
        effect: parameter
        decides: service_recovery_credit
        bindings: [rebills_last_24m, service_recovery_credit]
        ladder:
          - when: "two or more rebill_credit lines posted in the last twenty-four months"
            value: "K('recovery_credit_repeat_usd')"
          - when: "exactly one rebill_credit line posted in the last twenty-four months"
            value: "K('recovery_credit_first_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          service_recovery_credit: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        A swing shortfall correction is worked on the agreement's most recently posted swing_shortfall_charge line, read together with the energy_charge line of the same billing_period_start; the over-billed amount on that shortfall line is its billed amount_usd minus the correct shortfall amount, never below zero, and it is returned as one rebill_credit tied to the line through source_billing_id and dated on the correction date.
        The cycle usage is the usage_therms of that cycle's energy_charge line.
        The billed lower end is the cycle usage plus the usage_therms of the shortfall line, that is the lower end of the band the line was billed against under the plan in force on the cycle's billing_period_start.
        The correct shortfall therms are the billed lower end minus the cycle usage, never below zero, and each is charged at the rate_usd_therm on the shortfall line.
        The correct shortfall amount is the correct shortfall therms times the shortfall charge per therm, rounded half up to the cent.
        The shortfall rebill credit equals the over-billed amount, together with a service recovery credit only where one is due, rounded half up to the cent, and it is posted as a negative amount.
      params: [months_per_year]
    inputs:
      history:
        - {table: bizgas_billing, aggregate: latest, field: amount_usd, filters: {line_type: swing_shortfall_charge}}
        - {table: bizgas_billing, aggregate: sum, field: usage_therms, filters: {line_type: energy_charge}}
        - {table: bizgas_billing, aggregate: count, field: bizgas_billing_id, filters: {line_type: energy_charge}}
        - {table: bizgas_billing, aggregate: count, field: bizgas_billing_id, filters: {line_type: renewal_loyalty_credit}}
        - {table: bizgas_billing, aggregate: count, field: bizgas_billing_id, within_months: 24, filters: {line_type: rebill_credit}}
        - {category: bizpower, table: bizpower_billing, aggregate: sum, field: amount_usd, within_months: 12, filters: {line_type: energy_charge}}
      cross_category: [bizpower]

  - id: bizgas_ext_lapsed_renewal_price
    base_policy_refs: [bizgas_renewal, bizgas_expiry_notices, bizgas_rollover_terms]
    overwrite:
      - base_policy: bizgas_renewal
        superseded_clause: >-
          the agreement takes the offered plan, its term_months and the offered price
        replaced_by: >-
          the agreement takes the offered plan and its term_months, and its contract_rate_usd_therm is the renewed price worked out below rather than the offered price as printed
      - base_policy: bizgas_renewal
        superseded_clause: >-
          Each renewal earns one renewal_loyalty_credit equal to the renewal_loyalty_credit_usd of the plan renewed into.
        replaced_by: >-
          A renewal accepted after the agreement has rolled over earns no renewal loyalty credit.
      - base_policy: bizgas_expiry_notices
        superseded_clause: >-
          when the two notices differ, the final_options_notice governs
        replaced_by: >-
          The offer price the renewed price starts from follows how the two expiration notices of the expired term were given: when the final_options_notice was dated fewer than final_options_notice_latest_days calendar days before the contract end date it refers to and the initial_renewal_notice was dated within its window, no earlier than renewal_notice_earliest_days and no later than renewal_notice_latest_days calendar days before that date, the offer price is the initial notice's new_rate_usd_therm; when the final_options_notice was dated fewer than final_options_notice_latest_days days before that date and the initial notice was outside its window, the offer price is the lower of the two notices' new_rate_usd_therm; in every other case the offer price is the new_rate_usd_therm of the final_options_notice.
    trigger: on_request
    subject: [bizgas_renew]
    computes: contract_rate_usd_therm
    target_tool: accept_bizgas_lapsed_renewal_f259b0f9
    params:
      uplift_late_day: 11
      uplift_mid_day: 6
      uplift_late_usd_therm: 0.0150
      uplift_mid_usd_therm: 0.0080
      bundle_long_term_months: 24
      bundle_discount_long_usd_therm: 0.0120
      bundle_discount_short_usd_therm: 0.0060
      recovery_discount_repeat_usd_therm: 0.0100
      recovery_discount_first_usd_therm: 0.0050
      volume_high_therms: 30000
      volume_mid_therms: 15000
      volume_discount_high_usd_therm: 0.0100
      volume_discount_mid_usd_therm: 0.0050
    rule: >-
      When a business accepts a renewal offer after its commercial gas agreement has rolled over to the monthly index plan and within the post-expiry grace period, the agreement takes the offered plan and its term_months, and its contract_rate_usd_therm is the renewed price worked out below rather than the offered price as printed; the new term starts on the acceptance date.
      A renewal accepted after the agreement has rolled over earns no renewal loyalty credit.
      The renewed price starts from the offer price, which is the new_rate_usd_therm of the final_options_notice of the expired term, and is rounded half up to four decimal places once, at the end.
      The renewed price is not fixed until the agreement's most recently posted swing shortfall line, when its billed amount is above the correct shortfall amount and its correction lookback has not ended, carries its own rebill credit.
      The offer price the renewed price starts from follows how the two expiration notices of the expired term were given: when the final_options_notice was dated fewer than final_options_notice_latest_days calendar days before the contract end date it refers to and the initial_renewal_notice was dated within its window, no earlier than renewal_notice_earliest_days and no later than renewal_notice_latest_days calendar days before that date, the offer price is the initial notice's new_rate_usd_therm; when the final_options_notice was dated fewer than final_options_notice_latest_days days before that date and the initial notice was outside its window, the offer price is the lower of the two notices' new_rate_usd_therm; in every other case the offer price is the new_rate_usd_therm of the final_options_notice.
      A lapse re-quote uplift is added for the days the offer has stood since the rollover, counted in calendar days from plan_change_date to the acceptance date: at least uplift_late_day days adds uplift_late_usd_therm; at least uplift_mid_day and fewer than uplift_late_day days adds uplift_mid_usd_therm; fewer than uplift_mid_day days adds nothing.
      A bundle discount is taken off for businesses that also take Beacon Ridge small business electricity at the same premise: when that agreement is active on a term of at least bundle_long_term_months months the discount is bundle_discount_long_usd_therm; when it is active on a shorter term, month-to-month included, the discount is bundle_discount_short_usd_therm; when no small business electricity agreement on that premise is active there is no bundle discount.
      A service recovery discount is taken off for businesses Beacon Ridge has had to correct: when two or more rebill_credit lines were posted on the agreement later than the same calendar day twenty-four months before the acceptance date the discount is recovery_discount_repeat_usd_therm; when exactly one was it is recovery_discount_first_usd_therm; when none was there is no service recovery discount.
      A volume discount is taken off by the therms billed on the agreement's energy_charge lines whose billing_period_start is later than the same calendar day twelve months before the acceptance date: at least volume_high_therms gives volume_discount_high_usd_therm; at least volume_mid_therms and fewer than volume_high_therms gives volume_discount_mid_usd_therm; fewer than volume_mid_therms gives no volume discount.
      The renewed price is the offer price plus the lapse re-quote uplift, minus the bundle discount, the service recovery discount and the volume discount, each a per-therm amount applied once to the offer price, and the sum is rounded half up to four decimal places.
    prerequisite:
      - problem: bizgas_ext_swing_shortfall_rebill
        kind: value_input
        gate: rebills_last_24m
        form: state
        policy_source: >-
          The renewed price is not fixed until the agreement's most recently posted swing shortfall line, when its billed amount is above the correct shortfall amount and its correction lookback has not ended, carries its own rebill credit.
        condition: >-
          The most recently posted swing_shortfall_charge line of the agreement, when its billed amount_usd exceeds the correct shortfall amount and its posted_date is no more than billing_dispute_lookback_months calendar months before the handling date, has a rebill_credit line in bizgas_billing whose source_billing_id points at it.
        resolved_by: post_bizgas_shortfall_rebill_b4d87cc1
        effect: >-
          The rebill credit line adds one rebill_credit posted within twenty-four months, which can move the service recovery discount to a higher tier and so lowers the renewed price.
    cross_category:
      - category: bizpower
        as: branch
        reads: [status, term_months]
        note: The bundle discount tier is decided from the status and term of the business electricity agreement on the same premise.
    compute:
      - initial_notice_date: "LATEST('bizgas_notices','notice_date', date_field='notice_date', notice_type='initial_renewal_notice')"
      - initial_notice_end: "LATEST('bizgas_notices','effective_date', date_field='notice_date', notice_type='initial_renewal_notice')"
      - initial_notice_price: "LATEST('bizgas_notices','new_rate_usd_therm', date_field='notice_date', notice_type='initial_renewal_notice')"
      - final_notice_date: "LATEST('bizgas_notices','notice_date', date_field='notice_date', notice_type='final_options_notice')"
      - final_notice_end: "LATEST('bizgas_notices','effective_date', date_field='notice_date', notice_type='final_options_notice')"
      - final_notice_price: "LATEST('bizgas_notices','new_rate_usd_therm', date_field='notice_date', notice_type='final_options_notice')"
      - offer_price: "initial_notice_price if DAYS(final_notice_date, final_notice_end) < P('final_options_notice_latest_days') and DAYS(initial_notice_date, initial_notice_end) <= P('renewal_notice_earliest_days') and DAYS(initial_notice_date, initial_notice_end) >= P('renewal_notice_latest_days') else (MN(initial_notice_price, final_notice_price) if DAYS(final_notice_date, final_notice_end) < P('final_options_notice_latest_days') else final_notice_price)"
      - days_since_rollover: "DAYS(F('plan_change_date'), NOW)"
      - lapse_uplift: "K('uplift_late_usd_therm') if days_since_rollover >= K('uplift_late_day') else (K('uplift_mid_usd_therm') if days_since_rollover >= K('uplift_mid_day') else 0)"
      - site_power_status: "CFIELD('bizpower','status', premise_id=F('premise_id'))"
      - site_power_term: "CFIELD('bizpower','term_months', premise_id=F('premise_id'))"
      - bundle_discount: "K('bundle_discount_long_usd_therm') if site_power_status == 'active' and site_power_term >= K('bundle_long_term_months') else (K('bundle_discount_short_usd_therm') if site_power_status == 'active' and site_power_term < K('bundle_long_term_months') else 0)"
      - rebills_last_24m: "COUNT('bizgas_billing', within_months=24, date_field='posted_date', line_type='rebill_credit')"
      - recovery_discount: "K('recovery_discount_repeat_usd_therm') if rebills_last_24m >= 2 else (K('recovery_discount_first_usd_therm') if rebills_last_24m == 1 else 0)"
      - billed_therms_12m: "SUM('bizgas_billing','usage_therms', within_months=12, date_field='billing_period_start', line_type='energy_charge')"
      - volume_discount: "K('volume_discount_high_usd_therm') if billed_therms_12m >= K('volume_high_therms') else (K('volume_discount_mid_usd_therm') if billed_therms_12m >= K('volume_mid_therms') else 0)"
      - result: "RND(offer_price + lapse_uplift - bundle_discount - recovery_discount - volume_discount, 4)"
    compute_basis:
      initial_notice_date: "the initial_renewal_notice was dated within its window, no earlier than renewal_notice_earliest_days and no later than renewal_notice_latest_days calendar days before that date"
      initial_notice_end: "calendar days before the contract end date it refers to"
      initial_notice_price: "the offer price is the initial notice's new_rate_usd_therm"
      final_notice_date: "when the final_options_notice was dated fewer than final_options_notice_latest_days calendar days before the contract end date it refers to"
      final_notice_end: "calendar days before the contract end date it refers to"
      final_notice_price: "The renewed price starts from the offer price, which is the new_rate_usd_therm of the final_options_notice of the expired term"
      offer_price: "The offer price the renewed price starts from follows how the two expiration notices of the expired term were given: when the final_options_notice was dated fewer than final_options_notice_latest_days calendar days before the contract end date it refers to and the initial_renewal_notice was dated within its window, no earlier than renewal_notice_earliest_days and no later than renewal_notice_latest_days calendar days before that date, the offer price is the initial notice's new_rate_usd_therm; when the final_options_notice was dated fewer than final_options_notice_latest_days days before that date and the initial notice was outside its window, the offer price is the lower of the two notices' new_rate_usd_therm; in every other case the offer price is the new_rate_usd_therm of the final_options_notice."
      days_since_rollover: "counted in calendar days from plan_change_date to the acceptance date"
      lapse_uplift: "A lapse re-quote uplift is added for the days the offer has stood since the rollover, counted in calendar days from plan_change_date to the acceptance date: at least uplift_late_day days adds uplift_late_usd_therm; at least uplift_mid_day and fewer than uplift_late_day days adds uplift_mid_usd_therm; fewer than uplift_mid_day days adds nothing."
      site_power_status: "when that agreement is active on a term of at least bundle_long_term_months months"
      site_power_term: "on a term of at least bundle_long_term_months months"
      bundle_discount: "A bundle discount is taken off for businesses that also take Beacon Ridge small business electricity at the same premise: when that agreement is active on a term of at least bundle_long_term_months months the discount is bundle_discount_long_usd_therm; when it is active on a shorter term, month-to-month included, the discount is bundle_discount_short_usd_therm; when no small business electricity agreement on that premise is active there is no bundle discount."
      rebills_last_24m: "when two or more rebill_credit lines were posted on the agreement later than the same calendar day twenty-four months before the acceptance date"
      recovery_discount: "A service recovery discount is taken off for businesses Beacon Ridge has had to correct: when two or more rebill_credit lines were posted on the agreement later than the same calendar day twenty-four months before the acceptance date the discount is recovery_discount_repeat_usd_therm; when exactly one was it is recovery_discount_first_usd_therm; when none was there is no service recovery discount."
      billed_therms_12m: "the therms billed on the agreement's energy_charge lines whose billing_period_start is later than the same calendar day twelve months before the acceptance date"
      volume_discount: "A volume discount is taken off by the therms billed on the agreement's energy_charge lines whose billing_period_start is later than the same calendar day twelve months before the acceptance date: at least volume_high_therms gives volume_discount_high_usd_therm; at least volume_mid_therms and fewer than volume_high_therms gives volume_discount_mid_usd_therm; fewer than volume_mid_therms gives no volume discount."
      result: "The renewed price is the offer price plus the lapse re-quote uplift, minus the bundle discount, the service recovery discount and the volume discount, each a per-therm amount applied once to the offer price, and the sum is rounded half up to four decimal places."
    factors:
      - id: expired_term_offer_selection
        effect: method
        decides: offer_price
        bindings: [initial_notice_date, initial_notice_end, initial_notice_price, final_notice_date, final_notice_end, offer_price]
        ladder:
          - when: "final options notice dated fewer than final_options_notice_latest_days days before the end date and initial notice inside its window"
            method: "the initial notice's offered price is taken"
          - when: "final options notice dated fewer than final_options_notice_latest_days days before the end date and initial notice outside its window"
            method: "the lower of the two notices' offered prices is taken"
          - when: "otherwise"
            method: "the final options notice's offered price is taken"
        baseline:
          offer_price: "final_notice_price"
        evidence: [history, date]
        cross_difficulty: null
      - id: lapse_requote_uplift
        effect: parameter
        decides: lapse_uplift
        bindings: [days_since_rollover, lapse_uplift]
        ladder:
          - when: "at least uplift_late_day days since plan_change_date"
            value: "K('uplift_late_usd_therm')"
          - when: "at least uplift_mid_day and fewer than uplift_late_day days since plan_change_date"
            value: "K('uplift_mid_usd_therm')"
          - when: "otherwise"
            value: "0"
        baseline:
          lapse_uplift: "0"
        evidence: [date]
        cross_difficulty: null
      - id: electricity_term_bundle_discount
        effect: parameter
        decides: bundle_discount
        bindings: [site_power_status, site_power_term, bundle_discount]
        ladder:
          - when: "the electricity agreement on the same premise is active and its term_months is at least bundle_long_term_months"
            value: "K('bundle_discount_long_usd_therm')"
          - when: "the electricity agreement on the same premise is active and its term_months is below bundle_long_term_months"
            value: "K('bundle_discount_short_usd_therm')"
          - when: "otherwise"
            value: "0"
        baseline:
          bundle_discount: "0"
        evidence: [cross_category]
        cross_difficulty: bizpower
      - id: service_recovery_discount
        effect: parameter
        decides: recovery_discount
        bindings: [rebills_last_24m, recovery_discount]
        ladder:
          - when: "two or more rebill_credit lines posted in the last twenty-four months"
            value: "K('recovery_discount_repeat_usd_therm')"
          - when: "exactly one rebill_credit line posted in the last twenty-four months"
            value: "K('recovery_discount_first_usd_therm')"
          - when: "otherwise"
            value: "0"
        baseline:
          recovery_discount: "0"
        evidence: [history]
        cross_difficulty: null
      - id: billed_volume_discount
        effect: parameter
        decides: volume_discount
        bindings: [billed_therms_12m, volume_discount]
        ladder:
          - when: "at least volume_high_therms billed on energy lines of the last twelve months"
            value: "K('volume_discount_high_usd_therm')"
          - when: "at least volume_mid_therms and fewer than volume_high_therms"
            value: "K('volume_discount_mid_usd_therm')"
          - when: "otherwise"
            value: "0"
        baseline:
          volume_discount: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        When a business accepts a renewal offer after its commercial gas agreement has rolled over to the monthly index plan and within the post-expiry grace period, the agreement takes the offered plan and its term_months, and its contract_rate_usd_therm is the renewed price worked out below rather than the offered price as printed; the new term starts on the acceptance date.
        A renewal accepted after the agreement has rolled over earns no renewal loyalty credit.
        The renewed price starts from the offer price, which is the new_rate_usd_therm of the final_options_notice of the expired term, and is rounded half up to four decimal places once, at the end.
      params: []
    inputs:
      history:
        - {table: bizgas_notices, aggregate: latest, field: new_rate_usd_therm, filters: {notice_type: final_options_notice}}
        - {table: bizgas_notices, aggregate: latest, field: new_rate_usd_therm, filters: {notice_type: initial_renewal_notice}}
        - {table: bizgas_billing, aggregate: count, field: bizgas_billing_id, within_months: 24, filters: {line_type: rebill_credit}}
        - {table: bizgas_billing, aggregate: sum, field: usage_therms, within_months: 12, filters: {line_type: energy_charge}}
      cross_category: [bizpower]
