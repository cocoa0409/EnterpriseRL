  - id: power_ext_offpeak_rebill_credit
    base_policy_refs: [power_billing_correction, power_supply_billing]
    overwrite:
      - base_policy: power_billing_correction
        superseded_clause: >-
          The rebill credit equals the billed amount_usd minus the correctly computed amount for the same line, rounded per supply_charge_rounding, and is posted as a negative amount.
        replaced_by: >-
          The rebill credit for an over-billed off-peak line is the off-peak rebill amount worked out below rather than the bare over-billed amount, and it is posted as a negative amount tied to the corrected line.
    trigger: state_due
    subject: [power_adjustment]
    computes: rebill_amount_usd
    target_tool: post_rebill_credit_41f05139
    params:
      late_correction_factor_long: 1.05
      late_correction_factor_short: 1.02
      rebill_fee_return_half_share: 0.5
      rebill_bundle_courtesy_fixed_usd: 5.00
      rebill_bundle_courtesy_other_usd: 3.00
      open_review_courtesy_multi_usd: 10.00
      open_review_courtesy_single_usd: 5.00
      rebill_tenure_courtesy_long_usd: 2.00
      rebill_tenure_courtesy_mid_usd: 1.00
    rule: >-
      The rebill credit for an over-billed off-peak line is the off-peak rebill amount worked out below rather than the bare over-billed amount, and it is posted as a negative amount tied to the corrected line.
      This correction applies to the most recently posted off-peak energy line of a time-of-use agreement; when that line's off-peak rebill amount would exceed the care agent's adjustment limit, it is not credited here but referred to billing review as a billing dispute.
      A rebill credit is not posted until every over-billed line of the agreement whose correction exceeds the care agent's adjustment limit stands as an open billing dispute.
      The standard off-peak rebill amount is the billed amount of the most recently posted off-peak energy line less that line's kWh times the contract rate times the off-peak rate multiplier, the correct amount rounded half up to the cent.
      Late-correction scaling: the calendar days from that line's posting date to the correction date are counted; at 30 days or more the over-billed amount is multiplied by the long late-correction factor, from 7 to 29 days by the short late-correction factor, and below 7 days it is taken as it stands.
      Rebill fee return: the over-billed amount of the corrected line decides how much of the plan's monthly service fee is returned; when it is 100 USD or more the full monthly service fee is added, when it is from 50 up to but not including 100 USD half of that fee is added, and below 50 USD nothing is added.
      Rebill bundle courtesy: when a Beacon Ridge gas agreement on the same premise is active on a fixed-rate gas plan the fixed-bundle rebill courtesy is added, when it is active on a gas plan that is not fixed-rate the other-bundle rebill courtesy is added, and when no gas agreement on the premise is active nothing is added.
      Open-review courtesy: when the agreement carries two or more open billing disputes the multi-review courtesy is added, when it carries exactly one the single-review courtesy is added, and when it carries none nothing is added.
      Rebill tenure courtesy: when the agreement's service start date is 12 or more whole months before the correction date the long rebill tenure courtesy is added, when it is 6 to 11 whole months before the mid rebill tenure courtesy is added, and when it is fewer than 6 whole months before nothing is added.
      The amounts are combined in this order: first the over-billed amount is multiplied by the late-correction factor, and then the fee return and the bundle, open-review and tenure courtesies are added to that product; the total is rounded half up to the cent only once, at the end.
    prerequisite:
      - problem: power_ext_offpeak_dispute_amount
        kind: value_input
        gate: open_dispute_count
        form: state
        policy_source: >-
          A rebill credit is not posted until every over-billed line of the agreement whose correction exceeds the care agent's adjustment limit stands as an open billing dispute.
        condition: >-
          Every bill line of the agreement whose over-billing, worked out under the correction rules, is larger than the care agent's adjustment limit has an open billing dispute naming it.
        resolved_by: open_billing_dispute_231feff0
        effect: >-
          Opening the billing dispute adds an open dispute on the agreement, which raises the count of open billing disputes the open-review courtesy is tiered on.
    cross_category:
      - category: gas
        as: branch
        reads: [status, rate_type]
        note: The rebill bundle courtesy tier is decided from the status and rate type of the customer's gas agreement on the same premise.
    compute:
      - rebill_line_amount: "LATEST('power_billing', 'amount_usd', date_field='posted_date', line_type='energy_charge', tou_period='off_peak')"
      - rebill_line_kwh: "LATEST('power_billing', 'usage_kwh', date_field='posted_date', line_type='energy_charge', tou_period='off_peak')"
      - rebill_line_correct_amount: "RND(rebill_line_kwh * F('contract_rate_cents_kwh') * P('offpeak_rate_multiplier') / 100, 2)"
      - rebill_over_billed: "rebill_line_amount - rebill_line_correct_amount"
      - rebill_line_posted: "LATEST('power_billing', 'posted_date', date_field='posted_date', line_type='energy_charge', tou_period='off_peak')"
      - late_scaled_over_billed: "rebill_over_billed * (K('late_correction_factor_long') if DAYS(rebill_line_posted, NOW) >= 30 else (K('late_correction_factor_short') if DAYS(rebill_line_posted, NOW) >= 7 else 1.0))"
      - fee_return_line_amount: "LATEST('power_billing', 'amount_usd', date_field='posted_date', line_type='energy_charge', tou_period='off_peak')"
      - rebill_fee_return: "P('monthly_service_fee_usd') if fee_return_line_amount - rebill_line_correct_amount >= 100 else (P('monthly_service_fee_usd') * K('rebill_fee_return_half_share') if fee_return_line_amount - rebill_line_correct_amount >= 50 else 0.0)"
      - rebill_gas_status: "CFIELD('gas', 'status', premise_id=F('premise_id'))"
      - rebill_gas_rate_type: "CPARAM('gas', 'rate_type', premise_id=F('premise_id'))"
      - rebill_bundle_courtesy: "K('rebill_bundle_courtesy_fixed_usd') if (rebill_gas_status == 'active' and rebill_gas_rate_type == 'fixed') else (K('rebill_bundle_courtesy_other_usd') if (rebill_gas_status == 'active' and rebill_gas_rate_type != 'fixed') else 0.0)"
      - open_dispute_count: "COUNT('power_billing_disputes', dispute_status='open')"
      - open_review_courtesy: "K('open_review_courtesy_multi_usd') if open_dispute_count >= 2 else (K('open_review_courtesy_single_usd') if open_dispute_count == 1 else 0.0)"
      - rebill_tenure_months: "MONTHS(F('service_start_date'), NOW)"
      - rebill_tenure_courtesy: "K('rebill_tenure_courtesy_long_usd') if rebill_tenure_months >= 12 else (K('rebill_tenure_courtesy_mid_usd') if rebill_tenure_months >= 6 else 0.0)"
      - result: "RND(late_scaled_over_billed + rebill_fee_return + rebill_bundle_courtesy + open_review_courtesy + rebill_tenure_courtesy, 2)"
    compute_basis:
      rebill_line_amount: "The standard off-peak rebill amount is the billed amount of the most recently posted off-peak energy line less that line's kWh times the contract rate times the off-peak rate multiplier, the correct amount rounded half up to the cent."
      rebill_line_kwh: "The standard off-peak rebill amount is the billed amount of the most recently posted off-peak energy line less that line's kWh times the contract rate times the off-peak rate multiplier, the correct amount rounded half up to the cent."
      rebill_line_correct_amount: "The standard off-peak rebill amount is the billed amount of the most recently posted off-peak energy line less that line's kWh times the contract rate times the off-peak rate multiplier, the correct amount rounded half up to the cent."
      rebill_over_billed: "The standard off-peak rebill amount is the billed amount of the most recently posted off-peak energy line less that line's kWh times the contract rate times the off-peak rate multiplier, the correct amount rounded half up to the cent."
      rebill_line_posted: "Late-correction scaling: the calendar days from that line's posting date to the correction date are counted"
      late_scaled_over_billed: "at 30 days or more the over-billed amount is multiplied by the long late-correction factor, from 7 to 29 days by the short late-correction factor, and below 7 days it is taken as it stands."
      fee_return_line_amount: "Rebill fee return: the over-billed amount of the corrected line decides how much of the plan's monthly service fee is returned"
      rebill_fee_return: "Rebill fee return: the over-billed amount of the corrected line decides how much of the plan's monthly service fee is returned; when it is 100 USD or more the full monthly service fee is added, when it is from 50 up to but not including 100 USD half of that fee is added, and below 50 USD nothing is added."
      rebill_gas_status: "when a Beacon Ridge gas agreement on the same premise is active on a fixed-rate gas plan the fixed-bundle rebill courtesy is added"
      rebill_gas_rate_type: "when it is active on a gas plan that is not fixed-rate the other-bundle rebill courtesy is added"
      rebill_bundle_courtesy: "Rebill bundle courtesy: when a Beacon Ridge gas agreement on the same premise is active on a fixed-rate gas plan the fixed-bundle rebill courtesy is added, when it is active on a gas plan that is not fixed-rate the other-bundle rebill courtesy is added, and when no gas agreement on the premise is active nothing is added."
      open_dispute_count: "Open-review courtesy: when the agreement carries two or more open billing disputes"
      open_review_courtesy: "Open-review courtesy: when the agreement carries two or more open billing disputes the multi-review courtesy is added, when it carries exactly one the single-review courtesy is added, and when it carries none nothing is added."
      rebill_tenure_months: "Rebill tenure courtesy: when the agreement's service start date is 12 or more whole months before the correction date"
      rebill_tenure_courtesy: "Rebill tenure courtesy: when the agreement's service start date is 12 or more whole months before the correction date the long rebill tenure courtesy is added, when it is 6 to 11 whole months before the mid rebill tenure courtesy is added, and when it is fewer than 6 whole months before nothing is added."
      result: "The amounts are combined in this order: first the over-billed amount is multiplied by the late-correction factor, and then the fee return and the bundle, open-review and tenure courtesies are added to that product; the total is rounded half up to the cent only once, at the end."
    factors:
      - id: late_correction_scaling
        effect: method
        decides: late_scaled_over_billed
        bindings: [rebill_line_posted, late_scaled_over_billed]
        ladder:
          - when: "30 or more calendar days from the line's posting date to the correction date"
            method: "the over-billed amount is multiplied by the long late-correction factor"
          - when: "7 to 29 calendar days"
            method: "the over-billed amount is multiplied by the short late-correction factor"
          - when: "otherwise (below 7 days)"
            method: "the over-billed amount is taken as it stands"
        baseline:
          late_scaled_over_billed: "rebill_over_billed"
        evidence: [history, date]
        cross_difficulty: null
      - id: rebill_fee_return
        effect: parameter
        decides: rebill_fee_return
        bindings: [fee_return_line_amount, rebill_fee_return]
        ladder:
          - when: "over-billed amount of the corrected line 100 USD or more"
            value: "P('monthly_service_fee_usd')"
          - when: "over-billed amount from 50 up to but not including 100 USD"
            value: "P('monthly_service_fee_usd') * K('rebill_fee_return_half_share')"
          - when: "otherwise (below 50 USD)"
            value: "0.00"
        baseline:
