        ladder:
          - when: "11 or more dual-fuel credit lines with a cycle started less than twelve whole months before the election date"
            value: "K('bundle_reduction_full_cents')"
          - when: "6 to 10 such lines"
            value: "K('bundle_reduction_partial_cents')"
          - when: "otherwise (fewer than 6)"
