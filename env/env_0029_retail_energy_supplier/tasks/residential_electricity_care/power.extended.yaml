  - id: power_ext_referral_credit_amount
    base_policy_refs: [power_referral_credit, power_signup_credit, power_agg_dual_fuel, power_renewal]
    overwrite:
      - base_policy: power_referral_credit
        superseded_clause: >-
          The referral credit is posted on the referring customer's earliest-enrolled power agreement that is active on the posting date, at that agreement's referral_credit_usd, with referred_customer_id set to the referred customer.
        replaced_by: >-
          The referral credit is posted on the referring customer's earliest-enrolled power agreement that is active on the posting date, with the referred customer named on the line and on the bill of the billing cycle in progress on the posting date, at the referral credit amount worked out below rather than the bare plan referral credit.
    trigger: state_due
    subject: [power_credit]
    computes: credit_amount_usd
    target_tool: post_referral_credit_79c21554
    params:
      season_factor_near: 1.25
      season_factor_approaching: 1.10
      referral_bundle_bonus_fixed_usd: 10.00
      referral_bundle_bonus_other_usd: 5.00
      first_referral_bonus_usd: 10.00
      repeat_referral_bonus_usd: 5.00
      seasoned_referrer_bonus_usd: 5.00
      settling_referrer_bonus_usd: 3.00
      referral_paperless_bonus_full_usd: 5.00
      referral_paperless_bonus_partial_usd: 3.00
    rule: >-
      A referral that qualifies under the referral rules earns the referring customer one referral credit for that referred customer.
      The referral credit is posted on the referring customer's earliest-enrolled power agreement that is active on the posting date, with the referred customer named on the line and on the bill of the billing cycle in progress on the posting date, at the referral credit amount worked out below rather than the bare plan referral credit.
      The standard referral credit amount is the referral credit of the referring agreement's plan, rounded half up to the cent.
      Renewal-season scaling: the renewal season is read from the latest renewal notice on the referring agreement, whose stated contract end date stays as printed whatever renewal or plan change the agreement records; when that stated end date is 1 to 60 calendar days after the posting date, the plan referral credit is multiplied by the near-renewal season factor; when it is 61 to 180 calendar days after, by the approaching-renewal season factor; when it is further away, already passed, or the referring agreement has no renewal notice, the plan referral credit is taken as it stands.
      Referrer bundle bonus: when a Beacon Ridge gas agreement on the referring agreement's premise is active and on a fixed-rate gas plan, the fixed-bundle referral bonus is added; when such a gas agreement is active on a plan that is not fixed-rate, the other-bundle referral bonus is added; when no gas agreement on that premise is active, nothing is added.
      Referral count bonus: when the referring agreement carries no referral credit line yet, the first-referral bonus is added; when it carries one or two, the repeat-referral bonus is added; when it carries three or more, nothing is added.
      Seasoned referrer bonus: when the referring agreement carries 12 or more energy charge lines, the seasoned-referrer bonus is added; when it carries 3 to 11, the settling-referrer bonus is added; when it carries fewer than 3, nothing is added.
      Referral paperless bonus: when the referring agreement was enrolled through the web and at least one notice on it was delivered by email, the full referral paperless bonus is added; when exactly one of those two holds, the partial referral paperless bonus is added; when neither holds, nothing is added.
      The amounts are combined in this order: first the plan referral credit is multiplied by the season factor, and then the bundle, referral count, seasoned referrer and paperless bonuses are added to that product; the total is rounded half up to the cent only once, at the end, and posted as a negative amount.
    prerequisite: []
    cross_category:
      - category: gas
        as: branch
        reads: [status, rate_type]
        note: The referrer bundle bonus tier is decided from the status and rate type of the referrer's gas agreement on the same premise.
    compute:
      - plan_referral_credit: "P('referral_credit_usd')"
      - season_notice_end_date: "LATEST('power_notices', 'effective_date', date_field='notice_date', event_type='power_renewal_notice')"
      - days_to_referrer_term_end: "DAYS(NOW, season_notice_end_date) if season_notice_end_date else 0"
      - season_scaled_credit: "plan_referral_credit * (K('season_factor_near') if (days_to_referrer_term_end >= 1 and days_to_referrer_term_end <= 60) else (K('season_factor_approaching') if (days_to_referrer_term_end >= 61 and days_to_referrer_term_end <= 180) else 1.0))"
      - referrer_gas_status: "CFIELD('gas', 'status', premise_id=F('premise_id'))"
      - referrer_gas_rate_type: "CPARAM('gas', 'rate_type', premise_id=F('premise_id'))"
      - referral_bundle_bonus: "K('referral_bundle_bonus_fixed_usd') if (referrer_gas_status == 'active' and referrer_gas_rate_type == 'fixed') else (K('referral_bundle_bonus_other_usd') if (referrer_gas_status == 'active' and referrer_gas_rate_type != 'fixed') else 0.0)"
      - referral_lines_on_agreement: "COUNT('power_billing', line_type='referral_credit')"
      - referral_count_bonus: "K('first_referral_bonus_usd') if referral_lines_on_agreement == 0 else (K('repeat_referral_bonus_usd') if referral_lines_on_agreement <= 2 else 0.0)"
      - referrer_energy_lines: "COUNT('power_billing', line_type='energy_charge')"
      - seasoned_referrer_bonus: "K('seasoned_referrer_bonus_usd') if referrer_energy_lines >= 12 else (K('settling_referrer_bonus_usd') if referrer_energy_lines >= 3 else 0.0)"
      - referrer_email_notices: "COUNT('power_notices', delivery_channel='email')"
      - referral_paperless_bonus: "K('referral_paperless_bonus_full_usd') if (F('enrollment_channel') == 'web' and referrer_email_notices >= 1) else (K('referral_paperless_bonus_partial_usd') if (F('enrollment_channel') == 'web' or referrer_email_notices >= 1) else 0.0)"
      - result: "RND(season_scaled_credit + referral_bundle_bonus + referral_count_bonus + seasoned_referrer_bonus + referral_paperless_bonus, 2)"
    compute_basis:
      plan_referral_credit: "The standard referral credit amount is the referral credit of the referring agreement's plan, rounded half up to the cent."
      season_notice_end_date: "Renewal-season scaling: the renewal season is read from the latest renewal notice on the referring agreement, whose stated contract end date stays as printed whatever renewal or plan change the agreement records"
      days_to_referrer_term_end: "when that stated end date is 1 to 60 calendar days after the posting date"
      season_scaled_credit: "Renewal-season scaling: the renewal season is read from the latest renewal notice on the referring agreement, whose stated contract end date stays as printed whatever renewal or plan change the agreement records; when that stated end date is 1 to 60 calendar days after the posting date, the plan referral credit is multiplied by the near-renewal season factor; when it is 61 to 180 calendar days after, by the approaching-renewal season factor; when it is further away, already passed, or the referring agreement has no renewal notice, the plan referral credit is taken as it stands."
      referrer_gas_status: "when a Beacon Ridge gas agreement on the referring agreement's premise is active and on a fixed-rate gas plan"
      referrer_gas_rate_type: "when such a gas agreement is active on a plan that is not fixed-rate"
      referral_bundle_bonus: "Referrer bundle bonus: when a Beacon Ridge gas agreement on the referring agreement's premise is active and on a fixed-rate gas plan, the fixed-bundle referral bonus is added; when such a gas agreement is active on a plan that is not fixed-rate, the other-bundle referral bonus is added; when no gas agreement on that premise is active, nothing is added."
      referral_lines_on_agreement: "Referral count bonus: when the referring agreement carries no referral credit line yet"
      referral_count_bonus: "Referral count bonus: when the referring agreement carries no referral credit line yet, the first-referral bonus is added; when it carries one or two, the repeat-referral bonus is added; when it carries three or more, nothing is added."
      referrer_energy_lines: "Seasoned referrer bonus: when the referring agreement carries 12 or more energy charge lines"
      seasoned_referrer_bonus: "Seasoned referrer bonus: when the referring agreement carries 12 or more energy charge lines, the seasoned-referrer bonus is added; when it carries 3 to 11, the settling-referrer bonus is added; when it carries fewer than 3, nothing is added."
      referrer_email_notices: "at least one notice on it was delivered by email"
      referral_paperless_bonus: "Referral paperless bonus: when the referring agreement was enrolled through the web and at least one notice on it was delivered by email, the full referral paperless bonus is added; when exactly one of those two holds, the partial referral paperless bonus is added; when neither holds, nothing is added."
      result: "The amounts are combined in this order: first the plan referral credit is multiplied by the season factor, and then the bundle, referral count, seasoned referrer and paperless bonuses are added to that product; the total is rounded half up to the cent only once, at the end, and posted as a negative amount."
    factors:
      - id: renewal_season_scaling
        effect: method
        decides: season_scaled_credit
        bindings: [season_notice_end_date, days_to_referrer_term_end, season_scaled_credit]
        ladder:
          - when: "contract end date stated on the latest renewal notice 1 to 60 calendar days after the posting date"
            method: "the plan referral credit is multiplied by the near-renewal season factor"
          - when: "that stated end date 61 to 180 calendar days after the posting date"
            method: "the plan referral credit is multiplied by the approaching-renewal season factor"
          - when: "otherwise (further away, passed, or no renewal notice on the referring agreement)"
            method: "the plan referral credit is taken as it stands"
        baseline:
          season_scaled_credit: "plan_referral_credit"
        evidence: [date]
        cross_difficulty: null
      - id: referrer_bundle_bonus
        effect: parameter
        decides: referral_bundle_bonus
        bindings: [referrer_gas_status, referrer_gas_rate_type, referral_bundle_bonus]
        ladder:
          - when: "gas agreement on the premise is active AND on a fixed-rate gas plan"
            value: "K('referral_bundle_bonus_fixed_usd')"
          - when: "gas agreement on the premise is active AND on a plan that is not fixed-rate"
            value: "K('referral_bundle_bonus_other_usd')"
          - when: "otherwise (no active gas agreement on the premise)"
            value: "0.00"
        baseline:
          referral_bundle_bonus: "0.0"
        evidence: [cross_category, tier_param]
        cross_difficulty: gas
      - id: referral_count_bonus
        effect: parameter
        decides: referral_count_bonus
        bindings: [referral_lines_on_agreement, referral_count_bonus]
        ladder:
          - when: "no referral credit line on the referring agreement yet"
            value: "K('first_referral_bonus_usd')"
          - when: "one or two referral credit lines"
            value: "K('repeat_referral_bonus_usd')"
          - when: "otherwise (three or more)"
            value: "0.00"
        baseline:
          referral_count_bonus: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: seasoned_referrer_bonus
        effect: parameter
        decides: seasoned_referrer_bonus
        bindings: [referrer_energy_lines, seasoned_referrer_bonus]
        ladder:
          - when: "12 or more energy charge lines on the referring agreement"
            value: "K('seasoned_referrer_bonus_usd')"
          - when: "3 to 11 energy charge lines"
            value: "K('settling_referrer_bonus_usd')"
          - when: "otherwise (fewer than 3)"
            value: "0.00"
        baseline:
          seasoned_referrer_bonus: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: referral_paperless_bonus
        effect: parameter
        decides: referral_paperless_bonus
        bindings: [referrer_email_notices, referral_paperless_bonus]
        ladder:
          - when: "enrolled through the web AND at least one notice delivered by email"
            value: "K('referral_paperless_bonus_full_usd')"
          - when: "enrolled through the web OR at least one notice delivered by email, but not both"
            value: "K('referral_paperless_bonus_partial_usd')"
          - when: "otherwise (neither)"
            value: "0.00"
        baseline:
          referral_paperless_bonus: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard referral credit amount is the referral credit of the referring agreement's plan, rounded half up to the cent.
      params: [referral_credit_usd]
    inputs:
      history:
        - {table: power_notices, aggregate: latest, field: effective_date, within_months: 0, filters: {event_type: power_renewal_notice}}
        - {table: power_billing, aggregate: count, field: power_billing_id, within_months: 0, filters: {line_type: referral_credit}}
        - {table: power_billing, aggregate: count, field: power_billing_id, within_months: 0, filters: {line_type: energy_charge}}
        - {table: power_notices, aggregate: count, field: power_notice_id, within_months: 0, filters: {delivery_channel: email}}
      cross_category: [gas]
  - id: power_ext_renewal_loyalty_credit
    base_policy_refs: [power_renewal, power_signup_credit, power_referral_credit, power_agg_dual_fuel]
    overwrite:
      - base_policy: power_renewal
        superseded_clause: >-
          Each renewal earns one renewal_loyalty_credit equal to the renewal_loyalty_credit_usd of the plan renewed into, posted on the first bill of the new term; plans with 0.00 earn none.
        replaced_by: >-
          Each renewal earns one renewal loyalty credit, posted on the bill of the billing cycle that starts with the new term, at the renewal loyalty credit amount worked out below rather than the bare plan loyalty credit; a plan whose loyalty credit is 0.00 earns none.
    trigger: on_request
    subject: [power_credit]
    computes: credit_amount_usd
    target_tool: post_renewal_loyalty_credit_25af361b
    params:
      renewed_term_factor_long: 1.2
      renewed_term_factor_mid: 1.1
      loyalty_tenure_factor_long: 1.25
      loyalty_tenure_factor_mid: 1.10
      bundle_loyalty_bonus_established_usd: 20.00
      bundle_loyalty_bonus_new_usd: 10.00
      spend_bonus_high_usd: 25.00
      spend_bonus_mid_usd: 10.00
      referral_loyalty_bonus_multi_usd: 15.00
      referral_loyalty_bonus_single_usd: 10.00
      whole_home_bonus_high_usd: 10.00
      whole_home_bonus_mid_usd: 5.00
    rule: >-
      Each renewal earns one renewal loyalty credit, posted on the bill of the billing cycle that starts with the new term, at the renewal loyalty credit amount worked out below rather than the bare plan loyalty credit; a plan whose loyalty credit is 0.00 earns none.
      The renewal loyalty credit is not posted until the agreement's current term starts on the day after the contract end date stated on its latest renewal notice, on the plan that notice offers.
      The renewal loyalty credit is fixed only after the agreement's bill lines carry the referral credit owed for every referred customer whose agreement has reached the qualifying number of completed cycles.
      The standard renewal loyalty credit is the renewal loyalty credit of the plan renewed into, rounded half up to the cent.
      Renewed-term scaling: the renewed term is counted in months from the new term's start date through its contract end date, the end month included; for a renewed term of 24 months or more the plan loyalty credit is multiplied by the long renewed-term factor, for 12 to 23 months by the mid renewed-term factor, and for a shorter term it is taken as it stands.
      Loyalty tenure scaling: the amount reached after renewed-term scaling is then multiplied by the long loyalty-tenure factor when the agreement's service start date is 36 or more whole months before the posting date, by the mid loyalty-tenure factor when it is 18 to 35 whole months before, and is taken as it stands when it is fewer than 18 whole months before.
      Bundle loyalty bonus: when a Beacon Ridge gas agreement on the same premise is active and the customer's gas bill lines carry 12 or more gas energy charge lines, the established-bundle loyalty bonus is added; when such a gas agreement is active and those lines number fewer than 12, the new-bundle loyalty bonus is added; when no gas agreement on the premise is active, nothing is added.
      Spend bonus: the net amount of all of the agreement's bill lines posted less than twelve whole months before the posting date is taken, charges counted positive and every credit and rebill credit counted negative; at 1,250 USD or more the high spend bonus is added, from 1,000 up to but not including 1,250 USD the mid spend bonus is added, and below 1,000 USD nothing is added.
      Referral loyalty bonus: when the agreement carries two or more referral credit lines the multi-referral loyalty bonus is added, when it carries exactly one the single-referral loyalty bonus is added, and when it carries none nothing is added.
      Whole-home bonus: the therms on the customer's gas energy charge lines whose billing cycle started less than twelve whole months before the posting date are added up; at 700 therms or more the high whole-home bonus is added, from 400 up to but not including 700 therms the mid whole-home bonus is added, and below 400 therms nothing is added.
      The amounts are combined in this order: first the plan loyalty credit is multiplied by the renewed-term factor, then that result by the loyalty-tenure factor, and then the bundle, spend, referral and whole-home bonuses are added to that product; the total is rounded half up to the cent only once, at the end, and posted as a negative amount.
    prerequisite:
      - problem: power_ext_renewal_rate
        kind: value_input
        gate: renewed_term_months
        form: state
        policy_source: >-
          The renewal loyalty credit is not posted until the agreement's current term starts on the day after the contract end date stated on its latest renewal notice, on the plan that notice offers.
        condition: >-
          The agreement's latest plan change date is the day after the contract end date stated on its latest renewal notice, its plan is the plan offered on that notice, and its contract end date is the end of the renewed term counted from that start; only the acceptance of the renewal offer writes this state (accepting any other plan is a plan change, not a renewal).
        resolved_by: accept_renewal_offer_e5d86473
        effect: >-
          The acceptance writes the renewed term's start and end dates, from which the renewed-term length that scales the plan loyalty credit is counted; without them there is no renewed term to count.
      - problem: power_ext_referral_credit_amount
        kind: value_input
        gate: loyalty_referral_lines
        form: state
        policy_source: >-
          The renewal loyalty credit is fixed only after the agreement's bill lines carry the referral credit owed for every referred customer whose agreement has reached the qualifying number of completed cycles.
        condition: >-
          For every customer whose electricity agreement names this customer as referrer and has reached the qualifying number of completed cycles, a referral credit line naming that referred customer stands among this agreement's bill lines.
        resolved_by: post_referral_credit_79c21554
        effect: >-
          Posting the owed referral credit adds a referral credit line, which raises the referral count the referral loyalty bonus is tiered on and lowers the net twelve-month amount the spend bonus is tiered on.
    cross_category:
      - category: gas
        as: history
        reads: [status, gas_billing.line_type, gas_billing.usage_therms]
        note: The bundle loyalty bonus reads the gas agreement's status and the count of gas energy lines; the whole-home bonus sums the therms of the gas energy lines.
    compute:
      - plan_loyalty_credit: "P('renewal_loyalty_credit_usd')"
      - renewed_term_months: "MONTHS(F('plan_change_date'), F('contract_end_date')) + 1"
      - term_scaled_credit: "plan_loyalty_credit * (K('renewed_term_factor_long') if renewed_term_months >= 24 else (K('renewed_term_factor_mid') if renewed_term_months >= 12 else 1.0))"
      - loyalty_tenure_months: "MONTHS(F('service_start_date'), NOW)"
      - tenure_scaled_credit: "term_scaled_credit * (K('loyalty_tenure_factor_long') if loyalty_tenure_months >= 36 else (K('loyalty_tenure_factor_mid') if loyalty_tenure_months >= 18 else 1.0))"
      - loyalty_gas_status: "CFIELD('gas', 'status', premise_id=F('premise_id'))"
      - loyalty_gas_energy_lines: "XCOUNT('gas', 'gas_billing', line_type='energy_charge')"
      - bundle_loyalty_bonus: "K('bundle_loyalty_bonus_established_usd') if (loyalty_gas_status == 'active' and loyalty_gas_energy_lines >= 12) else (K('bundle_loyalty_bonus_new_usd') if (loyalty_gas_status == 'active' and loyalty_gas_energy_lines < 12) else 0.0)"
      - net_billed_12m: "SUM('power_billing', 'amount_usd', within_months=12, date_field='posted_date')"
      - spend_bonus: "K('spend_bonus_high_usd') if net_billed_12m >= 1250 else (K('spend_bonus_mid_usd') if net_billed_12m >= 1000 else 0.0)"
      - loyalty_referral_lines: "COUNT('power_billing', line_type='referral_credit')"
      - referral_loyalty_bonus: "K('referral_loyalty_bonus_multi_usd') if loyalty_referral_lines >= 2 else (K('referral_loyalty_bonus_single_usd') if loyalty_referral_lines == 1 else 0.0)"
      - gas_therms_12m: "XSUM('gas', 'gas_billing', 'usage_therms', within_months=12, date_field='billing_period_start', line_type='energy_charge')"
      - whole_home_bonus: "K('whole_home_bonus_high_usd') if gas_therms_12m >= 700 else (K('whole_home_bonus_mid_usd') if gas_therms_12m >= 400 else 0.0)"
      - result: "RND(tenure_scaled_credit + bundle_loyalty_bonus + spend_bonus + referral_loyalty_bonus + whole_home_bonus, 2)"
    compute_basis:
      plan_loyalty_credit: "The standard renewal loyalty credit is the renewal loyalty credit of the plan renewed into, rounded half up to the cent."
      renewed_term_months: "Renewed-term scaling: the renewed term is counted in months from the new term's start date through its contract end date, the end month included"
      term_scaled_credit: "for a renewed term of 24 months or more the plan loyalty credit is multiplied by the long renewed-term factor, for 12 to 23 months by the mid renewed-term factor, and for a shorter term it is taken as it stands."
      loyalty_tenure_months: "when the agreement's service start date is 36 or more whole months before the posting date"
      tenure_scaled_credit: "Loyalty tenure scaling: the amount reached after renewed-term scaling is then multiplied by the long loyalty-tenure factor when the agreement's service start date is 36 or more whole months before the posting date, by the mid loyalty-tenure factor when it is 18 to 35 whole months before, and is taken as it stands when it is fewer than 18 whole months before."
      loyalty_gas_status: "when a Beacon Ridge gas agreement on the same premise is active"
      loyalty_gas_energy_lines: "the customer's gas bill lines carry 12 or more gas energy charge lines"
      bundle_loyalty_bonus: "Bundle loyalty bonus: when a Beacon Ridge gas agreement on the same premise is active and the customer's gas bill lines carry 12 or more gas energy charge lines, the established-bundle loyalty bonus is added; when such a gas agreement is active and those lines number fewer than 12, the new-bundle loyalty bonus is added; when no gas agreement on the premise is active, nothing is added."
      net_billed_12m: "Spend bonus: the net amount of all of the agreement's bill lines posted less than twelve whole months before the posting date is taken, charges counted positive and every credit and rebill credit counted negative"
      spend_bonus: "at 1,250 USD or more the high spend bonus is added, from 1,000 up to but not including 1,250 USD the mid spend bonus is added, and below 1,000 USD nothing is added."
      loyalty_referral_lines: "Referral loyalty bonus: when the agreement carries two or more referral credit lines"
      referral_loyalty_bonus: "Referral loyalty bonus: when the agreement carries two or more referral credit lines the multi-referral loyalty bonus is added, when it carries exactly one the single-referral loyalty bonus is added, and when it carries none nothing is added."
      gas_therms_12m: "Whole-home bonus: the therms on the customer's gas energy charge lines whose billing cycle started less than twelve whole months before the posting date are added up"
      whole_home_bonus: "at 700 therms or more the high whole-home bonus is added, from 400 up to but not including 700 therms the mid whole-home bonus is added, and below 400 therms nothing is added."
      result: "The amounts are combined in this order: first the plan loyalty credit is multiplied by the renewed-term factor, then that result by the loyalty-tenure factor, and then the bundle, spend, referral and whole-home bonuses are added to that product; the total is rounded half up to the cent only once, at the end, and posted as a negative amount."
    factors:
      - id: renewed_term_scaling
        effect: method
        decides: term_scaled_credit
        bindings: [renewed_term_months, term_scaled_credit]
        ladder:
          - when: "renewed term of 24 months or more"
            method: "the plan loyalty credit is multiplied by the long renewed-term factor"
          - when: "renewed term of 12 to 23 months"
            method: "the plan loyalty credit is multiplied by the mid renewed-term factor"
          - when: "otherwise (shorter term)"
            method: "the plan loyalty credit is taken as it stands"
        baseline:
          term_scaled_credit: "plan_loyalty_credit"
        evidence: [date]
        cross_difficulty: null
      - id: loyalty_tenure_scaling
        effect: method
        decides: tenure_scaled_credit
        bindings: [loyalty_tenure_months, tenure_scaled_credit]
        ladder:
          - when: "service start date 36 or more whole months before the posting date"
            method: "the term-scaled amount is multiplied by the long loyalty-tenure factor"
          - when: "service start date 18 to 35 whole months before the posting date"
            method: "the term-scaled amount is multiplied by the mid loyalty-tenure factor"
          - when: "otherwise (fewer than 18 whole months)"
            method: "the term-scaled amount is taken as it stands"
        baseline:
          tenure_scaled_credit: "term_scaled_credit"
        evidence: [date]
        cross_difficulty: null
      - id: bundle_loyalty_bonus
        effect: parameter
        decides: bundle_loyalty_bonus
        bindings: [loyalty_gas_status, loyalty_gas_energy_lines, bundle_loyalty_bonus]
        ladder:
          - when: "gas agreement on the premise active AND 12 or more gas energy charge lines on the customer's gas bills"
            value: "K('bundle_loyalty_bonus_established_usd')"
          - when: "gas agreement on the premise active AND fewer than 12 gas energy charge lines"
            value: "K('bundle_loyalty_bonus_new_usd')"
          - when: "otherwise (no active gas agreement on the premise)"
            value: "0.00"
        baseline:
          bundle_loyalty_bonus: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: gas
      - id: spend_bonus
        effect: parameter
        decides: spend_bonus
        bindings: [net_billed_12m, spend_bonus]
        ladder:
          - when: "net amount of bill lines posted within the last twelve whole months is 1,250 USD or more"
            value: "K('spend_bonus_high_usd')"
          - when: "that net amount is from 1,000 up to but not including 1,250 USD"
            value: "K('spend_bonus_mid_usd')"
          - when: "otherwise (below 1,000 USD)"
            value: "0.00"
        baseline:
          spend_bonus: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: referral_loyalty_bonus
        effect: parameter
        decides: referral_loyalty_bonus
        bindings: [loyalty_referral_lines, referral_loyalty_bonus]
        ladder:
          - when: "two or more referral credit lines on the agreement"
            value: "K('referral_loyalty_bonus_multi_usd')"
          - when: "exactly one referral credit line"
            value: "K('referral_loyalty_bonus_single_usd')"
          - when: "otherwise (none)"
            value: "0.00"
        baseline:
          referral_loyalty_bonus: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: whole_home_bonus
        effect: parameter
        decides: whole_home_bonus
        bindings: [gas_therms_12m, whole_home_bonus]
        ladder:
          - when: "700 therms or more on gas energy lines started within the last twelve whole months"
            value: "K('whole_home_bonus_high_usd')"
          - when: "from 400 up to but not including 700 therms"
            value: "K('whole_home_bonus_mid_usd')"
          - when: "otherwise (below 400 therms)"
            value: "0.00"
        baseline:
          whole_home_bonus: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: gas
    baseline:
      rule: >-
        The standard renewal loyalty credit is the renewal loyalty credit of the plan renewed into, rounded half up to the cent.
      params: [renewal_loyalty_credit_usd]
    inputs:
      history:
        - {table: power_billing, aggregate: sum, field: amount_usd, within_months: 12, filters: {}}
        - {table: power_billing, aggregate: count, field: power_billing_id, within_months: 0, filters: {line_type: referral_credit}}
        - {category: gas, table: gas_billing, aggregate: count, field: gas_billing_id, within_months: 0, filters: {line_type: energy_charge}}
        - {category: gas, table: gas_billing, aggregate: sum, field: usage_therms, within_months: 12, filters: {line_type: energy_charge}}
      cross_category: [gas]
  - id: power_ext_offpeak_dispute_amount
    base_policy_refs: [power_billing_correction, power_supply_billing]
    overwrite:
      - base_policy: power_billing_correction
        superseded_clause: >-
          A care agent may post a rebill credit up to agent_adjustment_limit_usd; a larger correction is not posted as an adjustment but opened as a billing dispute for review, which settles it.
        replaced_by: >-
          A correction larger than the care agent's adjustment limit is not posted as a rebill credit but referred to billing review as one open billing dispute on the line, at the disputed amount worked out below rather than the bare over-billed amount.
    trigger: state_due
    subject: [power_adjustment]
    computes: disputed_amount_usd
    target_tool: open_billing_dispute_231feff0
    params:
      protection_factor_first_year: 1.10
      protection_factor_second_year: 1.05
      fee_return_half_share: 0.5
      dispute_bundle_courtesy_fixed_usd: 5.00
      dispute_bundle_courtesy_other_usd: 3.00
      dispute_usage_courtesy_high_usd: 2.00
      dispute_usage_courtesy_mid_usd: 1.00
      dispute_tenure_courtesy_long_usd: 2.00
      dispute_tenure_courtesy_mid_usd: 1.00
      systemic_error_courtesy_high_usd: 5.00
      systemic_error_courtesy_mid_usd: 3.00
    rule: >-
      On a time-of-use agreement, an off-peak energy line is correctly billed at its kWh times the contract rate times the plan's off-peak rate multiplier, and any amount billed above that is over-billed.
      A correction larger than the care agent's adjustment limit is not posted as a rebill credit but referred to billing review as one open billing dispute on the line, at the disputed amount worked out below rather than the bare over-billed amount.
      The dispute is opened on the off-peak energy line of the agreement with the largest billed amount.
      The standard disputed amount is the billed amount of the agreement's largest off-peak energy line less that line's correctly billed amount; because such a line was billed at the full contract rate, its correctly billed amount is its billed amount times the off-peak rate multiplier, rounded half up to the cent.
      New-customer protection: when the agreement's enrollment date is 365 or fewer calendar days before the referral date, the over-billed amount is multiplied by the first-year protection factor; when it is 366 to 730 calendar days before, by the second-year protection factor; when it is more than 730 calendar days before, the over-billed amount is taken as it stands.
      Dispute fee return: the night-usage reliance is the agreement's off-peak kWh taken as a share of all the kWh on its energy charge lines; at a reliance of 0.40 or more the plan's full monthly service fee is added, from 0.20 up to but not including 0.40 half of that fee is added, and below 0.20 nothing is added.
      Dispute bundle courtesy: when a Beacon Ridge gas agreement on the same premise is active on a fixed-rate gas plan the fixed-bundle dispute courtesy is added, when it is active on a gas plan that is not fixed-rate the other-bundle dispute courtesy is added, and when no gas agreement on the premise is active nothing is added.
      Dispute usage courtesy: the average kWh of the agreement's on-peak energy lines is taken; at 700 kWh or more the high dispute usage courtesy is added, from 400 up to but not including 700 kWh the mid dispute usage courtesy is added, and below 400 kWh nothing is added.
      Dispute tenure courtesy: when the agreement's service start date is 12 or more whole months before the referral date the long dispute tenure courtesy is added, when it is 6 to 11 whole months before the mid dispute tenure courtesy is added, and when it is fewer than 6 whole months before nothing is added.
      Systemic error courtesy: the agreement's off-peak energy lines billed at the full contract rate are counted; with three or more such lines the high systemic error courtesy is added, with exactly two the mid systemic error courtesy is added, and with only one nothing is added.
      The amounts are combined in this order: first the over-billed amount is multiplied by the protection factor, and then the fee return and the bundle, usage, tenure and systemic error courtesies are added to that product; the total is rounded half up to the cent only once, at the end, and recorded as a positive disputed amount.
    prerequisite: []
    cross_category:
      - category: gas
        as: branch
        reads: [status, rate_type]
        note: The dispute bundle courtesy tier is decided from the status and rate type of the customer's gas agreement on the same premise.
    compute:
      - disputed_line_amount: "MAX('power_billing', 'amount_usd', line_type='energy_charge', tou_period='off_peak')"
      - disputed_line_correct_amount: "RND(disputed_line_amount * P('offpeak_rate_multiplier'), 2)"
      - disputed_over_billed: "disputed_line_amount - disputed_line_correct_amount"
      - days_since_enrollment: "DAYS(F('enrollment_date'), NOW)"
      - protected_over_billed: "disputed_over_billed * (K('protection_factor_first_year') if days_since_enrollment <= 365 else (K('protection_factor_second_year') if days_since_enrollment <= 730 else 1.0))"
      - reliance_offpeak_kwh: "SUM('power_billing', 'usage_kwh', line_type='energy_charge', tou_period='off_peak')"
      - reliance_all_kwh: "SUM('power_billing', 'usage_kwh', line_type='energy_charge')"
      - dispute_fee_return: "(P('monthly_service_fee_usd') if reliance_offpeak_kwh / reliance_all_kwh >= 0.40 else (P('monthly_service_fee_usd') * K('fee_return_half_share') if reliance_offpeak_kwh / reliance_all_kwh >= 0.20 else 0.0)) if reliance_all_kwh > 0 else 0.0"
      - dispute_gas_status: "CFIELD('gas', 'status', premise_id=F('premise_id'))"
      - dispute_gas_rate_type: "CPARAM('gas', 'rate_type', premise_id=F('premise_id'))"
      - dispute_bundle_courtesy: "K('dispute_bundle_courtesy_fixed_usd') if (dispute_gas_status == 'active' and dispute_gas_rate_type == 'fixed') else (K('dispute_bundle_courtesy_other_usd') if (dispute_gas_status == 'active' and dispute_gas_rate_type != 'fixed') else 0.0)"
      - onpeak_kwh_total: "SUM('power_billing', 'usage_kwh', line_type='energy_charge', tou_period='on_peak')"
      - onpeak_line_count: "COUNT('power_billing', line_type='energy_charge', tou_period='on_peak')"
      - dispute_usage_courtesy: "(K('dispute_usage_courtesy_high_usd') if onpeak_kwh_total / onpeak_line_count >= 700 else (K('dispute_usage_courtesy_mid_usd') if onpeak_kwh_total / onpeak_line_count >= 400 else 0.0)) if onpeak_line_count > 0 else 0.0"
      - dispute_tenure_months: "MONTHS(F('service_start_date'), NOW)"
      - dispute_tenure_courtesy: "K('dispute_tenure_courtesy_long_usd') if dispute_tenure_months >= 12 else (K('dispute_tenure_courtesy_mid_usd') if dispute_tenure_months >= 6 else 0.0)"
      - full_rate_offpeak_lines: "COUNT('power_billing', line_type='energy_charge', tou_period='off_peak', rate_cents_kwh=F('contract_rate_cents_kwh'))"
      - systemic_error_courtesy: "K('systemic_error_courtesy_high_usd') if full_rate_offpeak_lines >= 3 else (K('systemic_error_courtesy_mid_usd') if full_rate_offpeak_lines == 2 else 0.0)"
      - result: "RND(protected_over_billed + dispute_fee_return + dispute_bundle_courtesy + dispute_usage_courtesy + dispute_tenure_courtesy + systemic_error_courtesy, 2)"
    compute_basis:
      disputed_line_amount: "The dispute is opened on the off-peak energy line of the agreement with the largest billed amount."
      disputed_line_correct_amount: "because such a line was billed at the full contract rate, its correctly billed amount is its billed amount times the off-peak rate multiplier, rounded half up to the cent."
      disputed_over_billed: "The standard disputed amount is the billed amount of the agreement's largest off-peak energy line less that line's correctly billed amount"
      days_since_enrollment: "New-customer protection: when the agreement's enrollment date is 365 or fewer calendar days before the referral date"
      protected_over_billed: "New-customer protection: when the agreement's enrollment date is 365 or fewer calendar days before the referral date, the over-billed amount is multiplied by the first-year protection factor; when it is 366 to 730 calendar days before, by the second-year protection factor; when it is more than 730 calendar days before, the over-billed amount is taken as it stands."
      reliance_offpeak_kwh: "Dispute fee return: the night-usage reliance is the agreement's off-peak kWh taken as a share of all the kWh on its energy charge lines"
      reliance_all_kwh: "Dispute fee return: the night-usage reliance is the agreement's off-peak kWh taken as a share of all the kWh on its energy charge lines"
      dispute_fee_return: "at a reliance of 0.40 or more the plan's full monthly service fee is added, from 0.20 up to but not including 0.40 half of that fee is added, and below 0.20 nothing is added."
      dispute_gas_status: "when a Beacon Ridge gas agreement on the same premise is active on a fixed-rate gas plan"
      dispute_gas_rate_type: "when it is active on a gas plan that is not fixed-rate"
      dispute_bundle_courtesy: "Dispute bundle courtesy: when a Beacon Ridge gas agreement on the same premise is active on a fixed-rate gas plan the fixed-bundle dispute courtesy is added, when it is active on a gas plan that is not fixed-rate the other-bundle dispute courtesy is added, and when no gas agreement on the premise is active nothing is added."
      onpeak_kwh_total: "Dispute usage courtesy: the average kWh of the agreement's on-peak energy lines is taken"
      onpeak_line_count: "Dispute usage courtesy: the average kWh of the agreement's on-peak energy lines is taken"
      dispute_usage_courtesy: "at 700 kWh or more the high dispute usage courtesy is added, from 400 up to but not including 700 kWh the mid dispute usage courtesy is added, and below 400 kWh nothing is added."
      dispute_tenure_months: "Dispute tenure courtesy: when the agreement's service start date is 12 or more whole months before the referral date"
      dispute_tenure_courtesy: "Dispute tenure courtesy: when the agreement's service start date is 12 or more whole months before the referral date the long dispute tenure courtesy is added, when it is 6 to 11 whole months before the mid dispute tenure courtesy is added, and when it is fewer than 6 whole months before nothing is added."
      full_rate_offpeak_lines: "Systemic error courtesy: the agreement's off-peak energy lines billed at the full contract rate are counted"
      systemic_error_courtesy: "with three or more such lines the high systemic error courtesy is added, with exactly two the mid systemic error courtesy is added, and with only one nothing is added."
      result: "The amounts are combined in this order: first the over-billed amount is multiplied by the protection factor, and then the fee return and the bundle, usage, tenure and systemic error courtesies are added to that product; the total is rounded half up to the cent only once, at the end, and recorded as a positive disputed amount."
    factors:
      - id: new_customer_protection
        effect: method
        decides: protected_over_billed
        bindings: [days_since_enrollment, protected_over_billed]
        ladder:
          - when: "enrollment date 365 or fewer calendar days before the referral date"
            method: "the over-billed amount is multiplied by the first-year protection factor"
          - when: "enrollment date 366 to 730 calendar days before the referral date"
            method: "the over-billed amount is multiplied by the second-year protection factor"
          - when: "otherwise (more than 730 days)"
            method: "the over-billed amount is taken as it stands"
        baseline:
          protected_over_billed: "disputed_over_billed"
        evidence: [date]
        cross_difficulty: null
      - id: dispute_fee_return
        effect: parameter
        decides: dispute_fee_return
        bindings: [reliance_offpeak_kwh, reliance_all_kwh, dispute_fee_return]
        ladder:
          - when: "night-usage reliance (off-peak kWh over all energy kWh) 0.40 or more"
            value: "P('monthly_service_fee_usd')"
          - when: "night-usage reliance from 0.20 up to but not including 0.40"
            value: "P('monthly_service_fee_usd') * K('fee_return_half_share')"
          - when: "otherwise (below 0.20)"
