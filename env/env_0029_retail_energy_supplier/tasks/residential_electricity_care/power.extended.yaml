        evidence: [date]
        cross_difficulty: null
      - id: paperless_reduction
        effect: parameter
        decides: paperless_reduction
        bindings: [renewal_email_notices, paperless_reduction]
        ladder:
          - when: "enrolled through the web AND at least one notice delivered by email"
            value: "K('paperless_reduction_full_cents')"
          - when: "enrolled through the web OR at least one notice delivered by email, but not both"
            value: "K('paperless_reduction_partial_cents')"
          - when: "otherwise (neither)"
