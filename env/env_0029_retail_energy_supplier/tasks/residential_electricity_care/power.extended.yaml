  - id: power_ext_signup_credit_amount
    base_policy_refs: [power_signup_credit, power_referral_credit, power_agg_dual_fuel, power_renewal]
    overwrite:
      - base_policy: power_signup_credit
        superseded_clause: >-
          A plan with signup_credit_usd above 0.00 earns one signup_credit once the agreement's completed cycles (power_msr_completed_cycles) reach signup_credit_after_cycles, posted on the bill of the next cycle.
        replaced_by: >-
          A plan whose sign-up credit is above 0.00 earns one sign-up credit once the agreement's completed cycles reach the plan's qualifying cycles; the credit belongs to the billing cycle that follows the last qualifying cycle, and its amount is the sign-up credit amount worked out below rather than the bare plan sign-up credit.
    trigger: state_due
    subject: [power_credit]
    computes: credit_amount_usd
    target_tool: post_signup_credit_3f59f0ed
    params:
      late_signup_factor_long: 1.5
      late_signup_factor_short: 1.25
      dual_commodity_welcome_settled_usd: 15.00
      dual_commodity_welcome_new_usd: 10.00
      signup_usage_bonus_high_usd: 10.00
      signup_usage_bonus_mid_usd: 5.00
      load_shift_bonus_high_usd: 10.00
      load_shift_bonus_mid_usd: 5.00
    rule: >-
      A plan whose sign-up credit is above 0.00 earns one sign-up credit once the agreement's completed cycles reach the plan's qualifying cycles; the credit belongs to the billing cycle that follows the last qualifying cycle, and its amount is the sign-up credit amount worked out below rather than the bare plan sign-up credit.
      Completed cycles are counted as the agreement's billing cycles that carry an on-peak or an all-hours energy charge line.
      The standard sign-up credit amount is the sign-up credit of the plan in force, rounded half up to the cent.
      Late sign-up scaling: the completed cycles beyond the plan's qualifying cycles are counted; with 3 or more cycles beyond, the plan sign-up credit is multiplied by the long late sign-up factor, with 1 or 2 cycles beyond by the short late sign-up factor, and with none beyond it is taken as it stands.
      Dual-commodity welcome: when a Beacon Ridge gas agreement on the same premise is active and the customer's gas bill lines already carry a gas sign-up credit, the settled dual-commodity welcome is added; when such a gas agreement is active and no gas sign-up credit has been posted, the new dual-commodity welcome is added; when no gas agreement on the premise is active, nothing is added.
      Sign-up usage bonus: the kWh of all of the agreement's energy charge lines are added up and divided by the completed cycles; at 1,200 kWh per cycle or more the high sign-up usage bonus is added, from 800 up to but not including 1,200 kWh the mid sign-up usage bonus is added, and below 800 kWh nothing is added.
      Load-shift bonus: the off-peak share is the kWh of the agreement's off-peak energy lines divided by the kWh of all of its energy charge lines; at a share of 0.40 or more the high load-shift bonus is added, from 0.20 up to but not including 0.40 the mid load-shift bonus is added, and below 0.20 nothing is added.
      The amounts are combined in this order: first the plan sign-up credit is multiplied by the late sign-up factor, and then the welcome, usage and load-shift bonuses are added to that product; the total is rounded half up to the cent only once, at the end, and posted as a negative amount.
    prerequisite: []
    cross_category:
      - category: gas
        as: history
        reads: [status, gas_billing.line_type]
        note: The dual-commodity welcome tier is decided from the gas agreement's status and whether the gas ledger carries a gas sign-up credit.
    compute:
      - plan_signup_credit: "P('signup_credit_usd')"
      - signup_completed_cycles: "COUNT('power_billing', line_type='energy_charge', tou_period='on_peak') + COUNT('power_billing', line_type='energy_charge', tou_period='all_hours')"
      - late_scaled_signup_credit: "plan_signup_credit * (K('late_signup_factor_long') if signup_completed_cycles - P('signup_credit_after_cycles') >= 3 else (K('late_signup_factor_short') if signup_completed_cycles - P('signup_credit_after_cycles') >= 1 else 1.0))"
      - welcome_gas_status: "CFIELD('gas', 'status', premise_id=F('premise_id'))"
      - gas_signup_lines: "XCOUNT('gas', 'gas_billing', line_type='signup_credit')"
      - dual_commodity_welcome: "K('dual_commodity_welcome_settled_usd') if (welcome_gas_status == 'active' and gas_signup_lines >= 1) else (K('dual_commodity_welcome_new_usd') if (welcome_gas_status == 'active' and gas_signup_lines == 0) else 0.0)"
      - signup_energy_kwh: "SUM('power_billing', 'usage_kwh', line_type='energy_charge')"
      - signup_cycles_for_usage: "COUNT('power_billing', line_type='energy_charge', tou_period='on_peak') + COUNT('power_billing', line_type='energy_charge', tou_period='all_hours')"
      - signup_usage_bonus: "(K('signup_usage_bonus_high_usd') if signup_energy_kwh / signup_cycles_for_usage >= 1200 else (K('signup_usage_bonus_mid_usd') if signup_energy_kwh / signup_cycles_for_usage >= 800 else 0.0)) if signup_cycles_for_usage > 0 else 0.0"
      - offpeak_kwh: "SUM('power_billing', 'usage_kwh', line_type='energy_charge', tou_period='off_peak')"
      - all_energy_kwh: "SUM('power_billing', 'usage_kwh', line_type='energy_charge')"
      - load_shift_bonus: "(K('load_shift_bonus_high_usd') if offpeak_kwh / all_energy_kwh >= 0.40 else (K('load_shift_bonus_mid_usd') if offpeak_kwh / all_energy_kwh >= 0.20 else 0.0)) if all_energy_kwh > 0 else 0.0"
      - result: "RND(late_scaled_signup_credit + dual_commodity_welcome + signup_usage_bonus + load_shift_bonus, 2)"
    compute_basis:
      plan_signup_credit: "The standard sign-up credit amount is the sign-up credit of the plan in force, rounded half up to the cent."
      signup_completed_cycles: "Completed cycles are counted as the agreement's billing cycles that carry an on-peak or an all-hours energy charge line."
      late_scaled_signup_credit: "Late sign-up scaling: the completed cycles beyond the plan's qualifying cycles are counted; with 3 or more cycles beyond, the plan sign-up credit is multiplied by the long late sign-up factor, with 1 or 2 cycles beyond by the short late sign-up factor, and with none beyond it is taken as it stands."
      welcome_gas_status: "when a Beacon Ridge gas agreement on the same premise is active and the customer's gas bill lines already carry a gas sign-up credit"
      gas_signup_lines: "the customer's gas bill lines already carry a gas sign-up credit"
      dual_commodity_welcome: "Dual-commodity welcome: when a Beacon Ridge gas agreement on the same premise is active and the customer's gas bill lines already carry a gas sign-up credit, the settled dual-commodity welcome is added; when such a gas agreement is active and no gas sign-up credit has been posted, the new dual-commodity welcome is added; when no gas agreement on the premise is active, nothing is added."
      signup_energy_kwh: "Sign-up usage bonus: the kWh of all of the agreement's energy charge lines are added up and divided by the completed cycles"
      signup_cycles_for_usage: "Sign-up usage bonus: the kWh of all of the agreement's energy charge lines are added up and divided by the completed cycles"
      signup_usage_bonus: "at 1,200 kWh per cycle or more the high sign-up usage bonus is added, from 800 up to but not including 1,200 kWh the mid sign-up usage bonus is added, and below 800 kWh nothing is added."
      offpeak_kwh: "Load-shift bonus: the off-peak share is the kWh of the agreement's off-peak energy lines divided by the kWh of all of its energy charge lines"
      all_energy_kwh: "Load-shift bonus: the off-peak share is the kWh of the agreement's off-peak energy lines divided by the kWh of all of its energy charge lines"
      load_shift_bonus: "at a share of 0.40 or more the high load-shift bonus is added, from 0.20 up to but not including 0.40 the mid load-shift bonus is added, and below 0.20 nothing is added."
      result: "The amounts are combined in this order: first the plan sign-up credit is multiplied by the late sign-up factor, and then the welcome, usage and load-shift bonuses are added to that product; the total is rounded half up to the cent only once, at the end, and posted as a negative amount."
    factors:
      - id: late_signup_scaling
        effect: method
        decides: late_scaled_signup_credit
        bindings: [signup_completed_cycles, late_scaled_signup_credit]
        ladder:
          - when: "3 or more completed cycles beyond the plan's qualifying cycles"
            method: "the plan sign-up credit is multiplied by the long late sign-up factor"
          - when: "1 or 2 completed cycles beyond"
            method: "the plan sign-up credit is multiplied by the short late sign-up factor"
          - when: "otherwise (none beyond)"
            method: "the plan sign-up credit is taken as it stands"
        baseline:
          late_scaled_signup_credit: "plan_signup_credit"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: dual_commodity_welcome
        effect: parameter
        decides: dual_commodity_welcome
        bindings: [welcome_gas_status, gas_signup_lines, dual_commodity_welcome]
        ladder:
          - when: "gas agreement on the premise active AND a gas sign-up credit already on the gas bill lines"
            value: "K('dual_commodity_welcome_settled_usd')"
          - when: "gas agreement on the premise active AND no gas sign-up credit posted"
            value: "K('dual_commodity_welcome_new_usd')"
          - when: "otherwise (no active gas agreement on the premise)"
            value: "0.00"
        baseline:
          dual_commodity_welcome: "0.0"
        evidence: [cross_category, history]
        cross_difficulty: gas
      - id: signup_usage_bonus
        effect: parameter
        decides: signup_usage_bonus
        bindings: [signup_energy_kwh, signup_cycles_for_usage, signup_usage_bonus]
        ladder:
          - when: "1,200 kWh per completed cycle or more"
            value: "K('signup_usage_bonus_high_usd')"
          - when: "from 800 up to but not including 1,200 kWh per completed cycle"
            value: "K('signup_usage_bonus_mid_usd')"
          - when: "otherwise (below 800 kWh)"
            value: "0.00"
        baseline:
          signup_usage_bonus: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: load_shift_bonus
        effect: parameter
        decides: load_shift_bonus
        bindings: [offpeak_kwh, all_energy_kwh, load_shift_bonus]
        ladder:
          - when: "off-peak share 0.40 or more"
            value: "K('load_shift_bonus_high_usd')"
          - when: "off-peak share from 0.20 up to but not including 0.40"
            value: "K('load_shift_bonus_mid_usd')"
          - when: "otherwise (below 0.20)"
            value: "0.00"
        baseline:
          load_shift_bonus: "0.0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard sign-up credit amount is the sign-up credit of the plan in force, rounded half up to the cent.
      params: [signup_credit_usd]
    inputs:
      history:
        - {table: power_billing, aggregate: count, field: power_billing_id, within_months: 0, filters: {line_type: energy_charge, tou_period: on_peak}}
        - {table: power_billing, aggregate: sum, field: usage_kwh, within_months: 0, filters: {line_type: energy_charge}}
        - {category: gas, table: gas_billing, aggregate: count, field: gas_billing_id, within_months: 0, filters: {line_type: signup_credit}}
      cross_category: [gas]
  - id: power_ext_plan_change_rate
    base_policy_refs: [power_plan_change_terms]
    overwrite:
      - base_policy: power_plan_change_terms
        superseded_clause: >-
          The change takes effect at the start of the next billing cycle per plan_change_effective_basis, at the offer_rate of the price offer for the new plan and the premise's electric utility valid on that date, and the new term is counted from plan_change_date.
        replaced_by: >-
          The change takes effect at the start of the next billing cycle and the new term is counted from that date, at the plan-change rate worked out below rather than the price-sheet offer: a customer moving an agreement mid-term is re-priced from the contract rate already in force on it.
    trigger: on_request
    subject: [power_plan_change]
    computes: contract_rate_cents_kwh
    target_tool: change_plan_fbee8941
    params:
      error_concession_multi_cents: 0.50
      error_concession_single_cents: 0.25
      plan_bundle_reduction_fixed_cents: 0.30
      plan_bundle_reduction_other_cents: 0.20
      remaining_term_factor_long: 1.5
      remaining_term_factor_short: 1.2
      plan_tenure_reduction_long_cents: 0.30
      plan_tenure_reduction_mid_cents: 0.15
      plan_volume_reduction_high_cents: 0.20
      plan_volume_reduction_mid_cents: 0.10
      peak_cycle_reduction_high_cents: 0.15
      peak_cycle_reduction_mid_cents: 0.08
    rule: >-
      The change takes effect at the start of the next billing cycle and the new term is counted from that date, at the plan-change rate worked out below rather than the price-sheet offer: a customer moving an agreement mid-term is re-priced from the contract rate already in force on it.
      The customer authorizes a mid-term plan change personally, because it replaces the terms of their contract.
      The plan-change rate is fixed only after the agreement's bill lines carry a rebill credit for every over-billed energy line whose correction is within the care agent's adjustment limit.
      A plan change is not recorded until the sign-up credit the current plan has earned stands on the agreement's bill lines.
      The standard plan-change rate is the contract rate in force on the agreement, in cents per kWh to two decimal places.
      Billing-error concession: the agreement's rebill credit lines and its open billing disputes are counted together; with two or more the multi-error concession applies, with exactly one the single-error concession applies, and with none no concession applies.
      Plan bundle reduction: when a Beacon Ridge gas agreement on the same premise is active on a fixed-rate gas plan the fixed-bundle plan reduction applies, when it is active on a gas plan that is not fixed-rate the other-bundle plan reduction applies, and when no gas agreement on the premise is active none applies.
      Plan tenure reduction: when the agreement's service start date is 24 or more whole months before the change request the long plan tenure reduction applies, when it is 6 to 23 whole months before the mid plan tenure reduction applies, and when it is fewer than 6 whole months before none applies.
      Plan volume reduction: the kWh of all of the agreement's energy charge lines are divided by its billing cycles that carry an on-peak or an all-hours energy line; at 1,200 kWh per cycle or more the high plan volume reduction applies, from 800 up to but not including 1,200 kWh the mid plan volume reduction applies, and below 800 kWh none applies.
      Peak-cycle reduction: the largest kWh on any single on-peak or all-hours energy line of the agreement is taken; at 900 kWh or more the high peak-cycle reduction applies, from 600 up to but not including 900 kWh the mid peak-cycle reduction applies, and below 600 kWh none applies.
      Remaining-term scaling: the billing-error concession and the bundle, tenure, volume and peak-cycle reductions are first added together into one combined reduction; that combined reduction is then multiplied by the long remaining-term factor when 6 or more whole months remain from the change request to the current contract end date, by the short remaining-term factor when 1 to 5 whole months remain, and is taken as it stands when less than one whole month remains or the agreement has no contract end date.
      The plan-change rate is the contract rate in force less the scaled combined reduction, the reduction acting once on that rate, rounded half up to two decimal places only at the end.
    prerequisite:
      - problem: power_ext_offpeak_rebill_credit
        kind: value_input
        gate: plan_error_items
        form: state
        policy_source: >-
          The plan-change rate is fixed only after the agreement's bill lines carry a rebill credit for every over-billed energy line whose correction is within the care agent's adjustment limit.
        condition: >-
          Every energy line of the agreement that was billed above its correct amount and whose correction is within the care agent's adjustment limit has a rebill credit line pointing at it.
        resolved_by: post_rebill_credit_41f05139
        effect: >-
          Posting the owed rebill credit adds a rebill credit line, which raises the combined count of rebill credit lines and open billing disputes that the billing-error concession is tiered on.
      - problem: power_ext_signup_credit_amount
        kind: state_gate
        gate: power_billing.line_type
        form: state
        policy_source: >-
          A plan change is not recorded until the sign-up credit the current plan has earned stands on the agreement's bill lines.
        condition: >-
          When the agreement's completed cycles have reached the current plan's qualifying cycles and the plan carries a sign-up credit above 0.00, a sign-up credit line stands among the agreement's bill lines.
        resolved_by: post_signup_credit_3f59f0ed
        effect: >-
          Posting the earned sign-up credit satisfies the condition that a sign-up credit line stands on the agreement, so the plan change may be recorded.
    cross_category:
      - category: gas
        as: branch
        reads: [status, rate_type]
        note: The plan bundle reduction tier is decided from the status and rate type of the customer's gas agreement on the same premise.
    compute:
      - rate_in_force: "F('contract_rate_cents_kwh')"
      - plan_error_items: "COUNT('power_billing', line_type='rebill_credit') + COUNT('power_billing_disputes', dispute_status='open')"
      - error_concession: "K('error_concession_multi_cents') if plan_error_items >= 2 else (K('error_concession_single_cents') if plan_error_items == 1 else 0.0)"
      - plan_gas_status: "CFIELD('gas', 'status', premise_id=F('premise_id'))"
      - plan_gas_rate_type: "CPARAM('gas', 'rate_type', premise_id=F('premise_id'))"
      - plan_bundle_reduction: "K('plan_bundle_reduction_fixed_cents') if (plan_gas_status == 'active' and plan_gas_rate_type == 'fixed') else (K('plan_bundle_reduction_other_cents') if (plan_gas_status == 'active' and plan_gas_rate_type != 'fixed') else 0.0)"
      - plan_tenure_months: "MONTHS(F('service_start_date'), NOW)"
      - plan_tenure_reduction: "K('plan_tenure_reduction_long_cents') if plan_tenure_months >= 24 else (K('plan_tenure_reduction_mid_cents') if plan_tenure_months >= 6 else 0.0)"
      - plan_energy_kwh: "SUM('power_billing', 'usage_kwh', line_type='energy_charge')"
      - plan_billed_cycles: "COUNT('power_billing', line_type='energy_charge', tou_period='on_peak') + COUNT('power_billing', line_type='energy_charge', tou_period='all_hours')"
      - plan_volume_reduction: "(K('plan_volume_reduction_high_cents') if plan_energy_kwh / plan_billed_cycles >= 1200 else (K('plan_volume_reduction_mid_cents') if plan_energy_kwh / plan_billed_cycles >= 800 else 0.0)) if plan_billed_cycles > 0 else 0.0"
      - peak_cycle_kwh: "max(MAX('power_billing', 'usage_kwh', line_type='energy_charge', tou_period='on_peak'), MAX('power_billing', 'usage_kwh', line_type='energy_charge', tou_period='all_hours'))"
      - peak_cycle_reduction: "K('peak_cycle_reduction_high_cents') if peak_cycle_kwh >= 900 else (K('peak_cycle_reduction_mid_cents') if peak_cycle_kwh >= 600 else 0.0)"
      - plan_combined_reduction: "error_concession + plan_bundle_reduction + plan_tenure_reduction + plan_volume_reduction + peak_cycle_reduction"
      - months_remaining: "MONTHS(NOW, F('contract_end_date')) if F('contract_end_date') else 0"
      - plan_scaled_reduction: "plan_combined_reduction * (K('remaining_term_factor_long') if months_remaining >= 6 else (K('remaining_term_factor_short') if months_remaining >= 1 else 1.0))"
      - result: "RND(rate_in_force - plan_scaled_reduction, 2)"
    compute_basis:
      rate_in_force: "The standard plan-change rate is the contract rate in force on the agreement, in cents per kWh to two decimal places."
      plan_error_items: "Billing-error concession: the agreement's rebill credit lines and its open billing disputes are counted together"
      error_concession: "with two or more the multi-error concession applies, with exactly one the single-error concession applies, and with none no concession applies."
      plan_gas_status: "when a Beacon Ridge gas agreement on the same premise is active on a fixed-rate gas plan the fixed-bundle plan reduction applies"
      plan_gas_rate_type: "when it is active on a gas plan that is not fixed-rate the other-bundle plan reduction applies"
      plan_bundle_reduction: "Plan bundle reduction: when a Beacon Ridge gas agreement on the same premise is active on a fixed-rate gas plan the fixed-bundle plan reduction applies, when it is active on a gas plan that is not fixed-rate the other-bundle plan reduction applies, and when no gas agreement on the premise is active none applies."
      plan_tenure_months: "Plan tenure reduction: when the agreement's service start date is 24 or more whole months before the change request"
      plan_tenure_reduction: "Plan tenure reduction: when the agreement's service start date is 24 or more whole months before the change request the long plan tenure reduction applies, when it is 6 to 23 whole months before the mid plan tenure reduction applies, and when it is fewer than 6 whole months before none applies."
      plan_energy_kwh: "Plan volume reduction: the kWh of all of the agreement's energy charge lines are divided by its billing cycles that carry an on-peak or an all-hours energy line"
      plan_billed_cycles: "Plan volume reduction: the kWh of all of the agreement's energy charge lines are divided by its billing cycles that carry an on-peak or an all-hours energy line"
      plan_volume_reduction: "at 1,200 kWh per cycle or more the high plan volume reduction applies, from 800 up to but not including 1,200 kWh the mid plan volume reduction applies, and below 800 kWh none applies."
      peak_cycle_kwh: "Peak-cycle reduction: the largest kWh on any single on-peak or all-hours energy line of the agreement is taken"
      peak_cycle_reduction: "at 900 kWh or more the high peak-cycle reduction applies, from 600 up to but not including 900 kWh the mid peak-cycle reduction applies, and below 600 kWh none applies."
      plan_combined_reduction: "Remaining-term scaling: the billing-error concession and the bundle, tenure, volume and peak-cycle reductions are first added together into one combined reduction"
      months_remaining: "when 6 or more whole months remain from the change request to the current contract end date"
      plan_scaled_reduction: "that combined reduction is then multiplied by the long remaining-term factor when 6 or more whole months remain from the change request to the current contract end date, by the short remaining-term factor when 1 to 5 whole months remain, and is taken as it stands when less than one whole month remains or the agreement has no contract end date."
      result: "The plan-change rate is the contract rate in force less the scaled combined reduction, the reduction acting once on that rate, rounded half up to two decimal places only at the end."
    factors:
      - id: billing_error_concession
        effect: parameter
        decides: error_concession
        bindings: [plan_error_items, error_concession]
        ladder:
          - when: "two or more rebill credit lines and open billing disputes together"
            value: "K('error_concession_multi_cents')"
          - when: "exactly one"
            value: "K('error_concession_single_cents')"
          - when: "otherwise (none)"
            value: "0.00"
        baseline:
          error_concession: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: plan_bundle_reduction
        effect: parameter
        decides: plan_bundle_reduction
        bindings: [plan_gas_status, plan_gas_rate_type, plan_bundle_reduction]
        ladder:
          - when: "gas agreement on the premise active AND on a fixed-rate gas plan"
            value: "K('plan_bundle_reduction_fixed_cents')"
          - when: "gas agreement on the premise active AND on a gas plan that is not fixed-rate"
            value: "K('plan_bundle_reduction_other_cents')"
          - when: "otherwise (no active gas agreement on the premise)"
            value: "0.00"
        baseline:
          plan_bundle_reduction: "0.0"
        evidence: [cross_category, tier_param]
        cross_difficulty: gas
      - id: plan_tenure_reduction
        effect: parameter
        decides: plan_tenure_reduction
        bindings: [plan_tenure_months, plan_tenure_reduction]
        ladder:
          - when: "service start date 24 or more whole months before the change request"
            value: "K('plan_tenure_reduction_long_cents')"
          - when: "service start date 6 to 23 whole months before"
            value: "K('plan_tenure_reduction_mid_cents')"
          - when: "otherwise (fewer than 6 whole months)"
            value: "0.00"
        baseline:
          plan_tenure_reduction: "0.0"
        evidence: [date]
        cross_difficulty: null
      - id: plan_volume_reduction
        effect: parameter
        decides: plan_volume_reduction
        bindings: [plan_energy_kwh, plan_billed_cycles, plan_volume_reduction]
        ladder:
          - when: "1,200 kWh per billed cycle or more"
            value: "K('plan_volume_reduction_high_cents')"
          - when: "from 800 up to but not including 1,200 kWh per billed cycle"
            value: "K('plan_volume_reduction_mid_cents')"
          - when: "otherwise (below 800 kWh)"
            value: "0.00"
        baseline:
          plan_volume_reduction: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: peak_cycle_reduction
        effect: parameter
        decides: peak_cycle_reduction
        bindings: [peak_cycle_kwh, peak_cycle_reduction]
        ladder:
          - when: "largest single on-peak or all-hours energy line 900 kWh or more"
            value: "K('peak_cycle_reduction_high_cents')"
          - when: "from 600 up to but not including 900 kWh"
            value: "K('peak_cycle_reduction_mid_cents')"
          - when: "otherwise (below 600 kWh)"
            value: "0.00"
        baseline:
          peak_cycle_reduction: "0.0"
        evidence: [history]
        cross_difficulty: null
      - id: remaining_term_scaling
        effect: method
        decides: plan_scaled_reduction
        bindings: [months_remaining, plan_scaled_reduction]
        ladder:
          - when: "6 or more whole months from the change request to the current contract end date"
            method: "the combined reduction is multiplied by the long remaining-term factor"
          - when: "1 to 5 whole months remaining"
            method: "the combined reduction is multiplied by the short remaining-term factor"
          - when: "otherwise (less than one whole month, or no contract end date)"
            method: "the combined reduction is taken as it stands"
        baseline:
          plan_scaled_reduction: "plan_combined_reduction"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard plan-change rate is the contract rate in force on the agreement, in cents per kWh to two decimal places.
      params: []
    inputs:
      history:
        - {table: power_billing, aggregate: count, field: power_billing_id, within_months: 0, filters: {line_type: rebill_credit}}
        - {table: power_billing_disputes, aggregate: count, field: power_dispute_id, within_months: 0, filters: {dispute_status: open}}
        - {table: power_billing, aggregate: sum, field: usage_kwh, within_months: 0, filters: {line_type: energy_charge}}
      cross_category: [gas]
