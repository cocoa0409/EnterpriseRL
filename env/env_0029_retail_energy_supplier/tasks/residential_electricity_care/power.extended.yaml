events:
  - type: power_enroll
    target: power_agreements
    mutation: create
    meaning: The customer authorizes Beacon Ridge to become the electricity supplier for one residential premise and the enrollment is submitted to the utility.
    grain: One row per enrollment authorization for one premise.
    fields:
      customer_id: The customer who authorized the enrollment.
      premise_id: The service premise being enrolled.
      variant_name: The official name of the plan enrolled.
      enrollment_date: Date the customer authorized the enrollment.
      enrollment_channel: Channel through which the enrollment was completed.
      term_months: Term of the plan enrolled, copied from the plan's term_months.
      contract_rate_cents_kwh: Rate locked or introduced at enrollment, taken from the price offer valid on the enrollment date for this plan and the premise's utility.
      referred_by_customer_id: Customer number of the referring customer, when the new customer names one; empty otherwise.
    triggers: []
  - type: power_utility_confirm
    target: power_agreements
    mutation: update
    meaning: The utility accepts the enrollment transaction and issues its enrollment confirmation letter to the customer.
    grain: One row per transaction.
    fields:
      utility_confirmation_date: Date printed on the utility's enrollment confirmation letter.
    triggers: []
  - type: power_activate
    target: power_agreements
    mutation: {transition: {from: enrollment_pending, to: active}}
    meaning: Supply begins on the switch meter read date.
    grain: One row per transaction.
    fields:
      service_start_date: The switch meter read date on which Beacon Ridge supply began.
      contract_end_date: Last day of the term computed from service_start_date and term_months; empty for a month-to-month plan.
    triggers: []
  - type: power_reject
    target: power_agreements
    mutation: {transition: {from: enrollment_pending, to: rejected}}
    meaning: The utility rejects the enrollment transaction.
    grain: One row per transaction.
    fields:
      reject_reason: The utility's rejection reason.
    triggers: []
  - type: power_rescind
    target: power_agreements
    mutation: {transition: {from: enrollment_pending, to: rescinded}}
    meaning: The customer rescinds the enrollment before supply starts.
    grain: One row per transaction.
    fields:
      rescinded_date: Date the customer asked to rescind.
    triggers: []
  - type: power_cancel
    target: power_agreements
    mutation: {transition: {from: active, to: drop_pending}}
    meaning: The customer confirms cancellation of the agreement and a drop is scheduled with the utility.
    grain: One row per transaction.
    fields:
      drop_requested_date: Date the customer confirmed the cancellation.
      drop_reason: Why the customer is cancelling.
      drop_effective_date: Date the drop takes effect, equal to the premise's next scheduled meter read date on the request date.
    triggers: []
  - type: power_cancel_withdraw
    target: power_agreements
    mutation: {transition: {from: drop_pending, to: active}}
    meaning: The customer withdraws a pending cancellation before the drop takes effect.
    grain: One row per transaction.
    fields:
      drop_requested_date: Cleared to empty when the cancellation is withdrawn.
      drop_reason: Cleared to empty when the cancellation is withdrawn.
      drop_effective_date: Cleared to empty when the cancellation is withdrawn.
    triggers: []
  - type: power_drop_complete
    target: power_agreements
    mutation: {transition: {from: drop_pending, to: closed}}
    meaning: The utility completes the scheduled drop and supply under the agreement ends.
    grain: One row per transaction.
    fields:
      close_date: The meter read date on which supply ended.
      close_reason: Why supply ended.
    triggers:
      - event: protect:protect_billing_transfer
        map: {}
  - type: power_switch_away
    target: power_agreements
    mutation: {transition: {from: active, to: closed}}
    meaning: The utility ends Beacon Ridge supply because another supplier enrolled the premise or the premise was final-billed for a move-out.
    grain: One row per transaction.
    fields:
      close_date: The meter read date on which supply ended.
      close_reason: Why supply ended.
    triggers:
      - event: protect:protect_billing_transfer
        map: {}
  - type: power_plan_change
    target: power_agreements
    mutation: update
    meaning: The customer moves an active agreement to another Beacon Ridge residential electricity plan before the current term ends.
    grain: One row per transaction.
    fields:
      variant_name: The official name of the new plan.
      term_months: Term of the new plan.
      contract_rate_cents_kwh: Rate of the new plan, taken from the price offer valid on the plan change date.
      contract_end_date: Last day of the new term counted from plan_change_date; empty for a month-to-month plan.
      plan_change_date: Date the new plan takes effect, the start of the next billing cycle.
    triggers: []
  - type: power_renew
    target: power_agreements
    mutation: update
    meaning: The customer accepts the renewal offer and the agreement continues into a new fixed term.
    grain: One row per transaction.
    fields:
      variant_name: The official name of the plan renewed into, as offered in the renewal notice.
      term_months: Term of the renewed plan.
      contract_rate_cents_kwh: The renewal rate offered in the renewal notice.
      contract_end_date: Last day of the new term.
      plan_change_date: Date the new term starts.
    triggers:
      - event: power:power_credit
        when: {variant_name: [Beacon Ridge Price Lock 12, Beacon Ridge Price Lock 24, Beacon Ridge Free Nights 12, Beacon Ridge Clean Wind 12, Beacon Ridge Clean Wind 24]}
        map: {line_type: renewal_loyalty_credit, power_agreement_id: power_agreement_id}
  - type: power_rollover
    target: power_agreements
    mutation: update
    meaning: An expired fixed agreement with no renewal election converts to the month-to-month rollover plan.
    grain: One row per transaction.
    fields:
      variant_name: The rollover plan's official name.
      term_months: Set to 0 for month-to-month service.
      contract_rate_cents_kwh: The rate billed from rollover, either the disclosed rollover rate or the held expiring rate.
      contract_end_date: Cleared to empty because month-to-month service has no end date.
      plan_change_date: The day after the expired contract_end_date.
    triggers: []
  - type: power_supply_charge
    target: power_billing
    meaning: Beacon Ridge bills the electricity supplied in one billing cycle, or the cycle's monthly service fee, on the utility bill.
    grain: One row per charge line per billing cycle per time-of-use period.
    distinguish_by: [line_type, tou_period, billing_period_start]
    fields:
      power_agreement_id: The agreement billed.
      line_type: energy_charge or monthly_service_fee.
      tou_period: all_hours for flat-rate plans and fee lines, on_peak or off_peak for time-of-use energy lines.
      billing_period_start: First day of the utility billing cycle.
      billing_period_end: Last day of the utility billing cycle.
      usage_kwh: kWh billed on the line; 0 on fee lines.
      rate_cents_kwh: Rate applied to usage_kwh; 0.00 on fee lines.
      amount_usd: Positive charge amount.
      posted_date: Date the line was posted to the utility bill.
    account: supply_billed
    direction: in
    triggers: []
  - type: power_etf_charge
    target: power_billing
    meaning: Beacon Ridge bills an early termination fee for ending a fixed term early.
    grain: One row per early termination of one agreement.
    distinguish_by: [line_type, posted_date]
    fields:
      power_agreement_id: The agreement terminated.
      line_type: early_termination_fee.
      etf_months_remaining: Remaining months of the term used in the fee computation.
      amount_usd: Positive fee amount after waivers and any state cap.
      posted_date: Date the fee was posted.
    account: supply_billed
    direction: in
    triggers: []
  - type: power_credit
    target: power_billing
    meaning: Beacon Ridge posts a promotional or loyalty bill credit to the agreement.
    grain: One row per credit type per billing cycle per referred customer.
    distinguish_by: [line_type, billing_period_start, referred_customer_id]
    fields:
      power_agreement_id: The agreement credited.
      line_type: signup_credit, online_enrollment_credit, referral_credit, dual_fuel_credit or renewal_loyalty_credit.
      billing_period_start: First day of the billing cycle on whose bill the credit appears.
      referred_customer_id: For a referral credit, the referred customer who qualified; empty otherwise.
      amount_usd: Negative credit amount.
      posted_date: Date the credit was posted.
    account: supply_billed
    direction: out
    triggers: []
  - type: power_adjustment
    target: power_billing
    meaning: Beacon Ridge corrects an over-billed supply line with a rebill credit.
    grain: One row per corrected original line.
    distinguish_by: [source_billing_id, posted_date]
    fields:
      power_agreement_id: The agreement corrected.
      line_type: rebill_credit.
      source_billing_id: The billed line being corrected.
      billing_period_start: Billing cycle of the corrected line.
      amount_usd: Negative credit equal to the over-billed amount.
      posted_date: Date the rebill credit was posted.
    account: supply_billed
    direction: out
    triggers: []
  - type: power_renewal_notice
    target: power_notices
    meaning: Beacon Ridge issues a contract expiration notice with a renewal offer and the rollover terms.
    grain: One row per notice type per issue date.
    distinguish_by: [notice_type, notice_date]
    fields:
      power_agreement_id: The expiring agreement.
      notice_type: initial_renewal_notice or final_options_notice.
      notice_date: Date the notice was issued.
      effective_date: The contract_end_date the notice refers to.
      offered_variant_name: The plan offered for renewal.
      new_rate_cents_kwh: The renewal rate offered.
      rollover_rate_cents_kwh: The month-to-month rate that applies in the first cycle after expiry if the customer makes no election.
      delivery_channel: How the notice was delivered.
    triggers: []
  - type: power_rate_notice
    target: power_notices
    meaning: Beacon Ridge notifies a rate change, either a monthly variable rate change or a regulatory pass-through on a fixed rate.
    grain: One row per rate change per effective date.
    distinguish_by: [notice_type, effective_date]
    fields:
      power_agreement_id: The agreement whose rate changes.
      notice_type: variable_rate_change or regulatory_pass_through.
      notice_date: Date the notice was issued.
      effective_date: Date the new rate is stated to take effect.
      new_rate_cents_kwh: The new rate.
      delivery_channel: How the notice was delivered.
    triggers: []

measures:
  - id: power_msr_completed_cycles
    window: From the agreement's service_start_date up to the frozen handling date.
    measure: Count of distinct billing_period_start values among power_supply_charge rows with line_type energy_charge on the agreement whose billing_period_end is on or before the frozen handling date; on-peak and off-peak lines of one cycle count once.
  - id: power_msr_referral_credits_ytd
    window: The calendar year (January 1 through December 31) containing the posting date being considered.
    measure: Count of power_credit rows with line_type referral_credit posted in that calendar year across all power agreements of the referring customer.

policies:
  - id: power_agg_multi_holding
    subject: [power_enroll]
    rule: >-
      A residential customer may hold several Beacon Ridge electricity agreements, one per premise, up to max_per_customer agreements at the same time.
      An agreement counts toward the limit while its status is enrollment_pending, active or drop_pending; closed, rescinded and rejected agreements do not count.
      No other power agreement on the same premise may be in enrollment_pending, active or drop_pending status when a new enrollment is submitted.
      A premise can be supplied by only one supplier per commodity, so a second enrollment on a premise that already has a live Beacon Ridge electricity agreement is refused and the customer is offered a plan change on the existing agreement instead.
      When the limit is reached the enrollment is refused.
    eligibility:
      - id: one_live_agreement_per_premise
        applies_to: [power_enroll]
        kind: dedup
        condition: No other power agreement on the same premise may be in enrollment_pending, active or drop_pending status when a new enrollment is submitted.
        evidence_fields: [power_agreements.premise_id, power_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_agreements.premise_id]
          action_bindings:
            power_agreements.premise_id: premise_id
        dedup_contract:
          table: power_agreements
          mode: separate_record
          object_bindings: {premise_id: premise_id}
          duplicate_filters: {status: [enrollment_pending, active, drop_pending]}
          distinct_fields: []
    params:
      max_per_customer: 4

  - id: power_enrollment_eligibility
    subject: [power_enroll]
    rule: >-
      An enrollment is accepted only for a premise whose premise_class is residential and whose service_state is listed in the plan's eligible_states.
      The premise must be residential.
      A customer whose assistance_program is utility_cap may enroll only in a plan whose cap_customer_eligible is true; such customers are otherwise directed to remain on utility default service.
      A plan whose smart_meter_required is true may be enrolled only on a premise whose meter_type is ami_smart.
      The enrollment channel must be one of the plan's enrollment_channels.
      The contract_rate_cents_kwh is the offer_rate of the price offer for the plan and the premise's electric utility whose validity window contains the enrollment_date; when no offer is valid the plan cannot be sold that day.
      term_months is copied from the plan.
      A referral is recorded only from the referring customer's customer number given at enrollment; it cannot be added after the enrollment is submitted.
    eligibility:
      - id: residential_premise
        applies_to: [power_enroll]
        kind: state
        condition: The premise must be residential.
        evidence_fields: [premises.premise_class, premises.premise_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [premises.premise_id]
          action_bindings:
            premises.premise_id: premise_id
        state_contract:
          field: premises.premise_class
          allowed: [residential]
      - id: cap_customer_plan
        applies_to: [power_enroll]
        kind: authorization
        condition: A customer whose assistance_program is utility_cap may enroll only in a plan whose cap_customer_eligible is true; such customers are otherwise directed to remain on utility default service.
        evidence_fields: [customers.assistance_program, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: smart_meter_for_tou
        applies_to: [power_enroll]
        kind: authorization
        condition: A plan whose smart_meter_required is true may be enrolled only on a premise whose meter_type is ami_smart.
        evidence_fields: [premises.meter_type, premises.premise_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [premises.premise_id]
          action_bindings:
            premises.premise_id: premise_id

  - id: power_enrollment_processing
    subject: [power_utility_confirm, power_activate, power_reject]
    rule: >-
      After submission the utility either accepts the enrollment, recording its confirmation letter date as utility_confirmation_date, or rejects it with one of the utility rejection reasons.
      Supply begins on the switch meter read date, which becomes service_start_date.
      For a plan with term_months above 0, contract_end_date is the day before the same calendar day term_months calendar months after service_start_date; when that calendar day does not exist in the target month, the last day of that month is used before subtracting the day.
      A month-to-month plan has an empty contract_end_date.
      A rejected enrollment ends permanently; the customer may submit a new enrollment, which creates a new agreement and is priced on its own enrollment date.
      Neither confirmation nor activation changes the rate recorded at enrollment.
    eligibility: []

  - id: power_rescission
    subject: [power_rescind]
    rule: >-
      A customer may rescind an enrollment while the agreement is still enrollment_pending.
      The rescission is accepted only when the customer asks to rescind no later than rescission_window_days calendar days after the utility issued its enrollment confirmation (utility_confirmation_date).
      Day one is the calendar day after utility_confirmation_date, and the window closes at the end of the calendar day equal to utility_confirmation_date plus rescission_window_days.
      When utility_confirmation_date is still empty the window has not started and a rescission is accepted.
      A rescission carries no fee and no credit of any kind.
      Once supply has started the agreement can no longer be rescinded; the customer must cancel instead, and the early termination fee rules decide whether a fee applies.
    eligibility:
      - id: rescission_window
        applies_to: [power_rescind]
        kind: time
        condition: The rescission is accepted only when the customer asks to rescind no later than rescission_window_days calendar days after the utility issued its enrollment confirmation (utility_confirmation_date).
        evidence_fields: [power_agreements.utility_confirmation_date, power_agreements.power_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_agreements.power_agreement_id]
          action_bindings:
            power_agreements.power_agreement_id: power_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the utility issued its enrollment confirmation
          anchor_source: power_agreements.utility_confirmation_date
          relation: not_after
          duration_source: variants.rescission_window_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after utility_confirmation_date, and the window closes at the end of the calendar day equal to utility_confirmation_date plus rescission_window_days.
          boundary: inclusive

  - id: power_supply_billing
    subject: [power_supply_charge]
    rule: >-
      Each utility billing cycle in which Beacon Ridge supplied the premise produces one energy_charge line per time-of-use period and one monthly_service_fee line.
      Supply charges are billed only while the agreement is active, drop_pending or closed; no charge is ever billed on an agreement that never started supply.
      For a flat-rate plan the energy line has tou_period all_hours and amount_usd equal to usage_kwh times the applicable rate divided by 100, rounded per supply_charge_rounding.
      For a time-of-use plan the cycle's usage is split into on_peak and off_peak lines by the plan's tou_offpeak_window; on-peak kWh are billed at the contract rate and off-peak kWh at the contract rate times offpeak_rate_multiplier.
      The applicable rate of a fixed plan is contract_rate_cents_kwh for every cycle of the term, changed only by a regulatory pass-through allowed under the regulatory pass-through policy.
      The applicable rate of a month-to-month plan is set by the variable rate policy.
      The monthly service fee line has tou_period all_hours, usage_kwh 0, rate_cents_kwh 0.00 and amount_usd equal to monthly_service_fee_usd; it is billed in full for partial first and final cycles and is not billed when the fee is 0.00.
      Taxes and utility delivery charges are computed by the utility and are not Beacon Ridge supply lines.
    eligibility:
      - id: supplied_status
        applies_to: [power_supply_charge]
        kind: state
        condition: Supply charges are billed only while the agreement is active, drop_pending or closed; no charge is ever billed on an agreement that never started supply.
        evidence_fields: [power_agreements.status, power_agreements.power_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_agreements.power_agreement_id]
          action_bindings:
            power_agreements.power_agreement_id: power_agreement_id
        state_contract:
          field: power_agreements.status
          allowed: [active, drop_pending, closed]
    formula:
      when: line_type == "energy_charge"
      amount_usd: round(usage_kwh * rate_cents_kwh / 100, 2)

  - id: power_variable_rate
    subject: [power_rate_notice, power_supply_charge]
    rule: >-
      A month-to-month agreement is billed at contract_rate_cents_kwh for its first intro_rate_cycles billing cycles counted from service_start_date, and for any cycles held at the expiring rate under the rollover policy.
      After that, each cycle is billed at the new_rate_cents_kwh of the latest variable_rate_change notice on the agreement whose effective date is on or before the cycle's billing_period_start; until the first such notice applies, contract_rate_cents_kwh continues.
      A variable rate change takes effect only for billing cycles beginning on or after its effective date, as variable_rate_effective_basis states.
      A variable rate change notice must be issued at least variable_rate_notice_days calendar days before its stated effective date; when it is issued later, the change applies only from the first cycle beginning on or after notice_date plus variable_rate_notice_days.
      Variable rate changes never apply to a fixed or time-of-use plan during its term.
    eligibility: []

  - id: power_regulatory_passthrough
    subject: [power_rate_notice]
    rule: >-
      A fixed or time-of-use rate may change during the term only to pass through a change in law or regulation, and only on a plan whose regulatory_passthrough_allowed is true.
      A regulatory_pass_through notice must be issued at least regulatory_change_notice_days calendar days before its effective date, and the new rate applies to cycles beginning on or after the later of the stated effective date and notice_date plus regulatory_change_notice_days.
      On a plan whose regulatory_passthrough_allowed is false the contract rate is guaranteed for the whole term, and any pass-through billed on it is a billing error to be corrected under the billing correction policy.
      A regulatory pass-through is not a ground for waiving the early termination fee.
    eligibility: []

  - id: power_expiry_notices
    subject: [power_renewal_notice]
    rule: >-
      Every agreement with a fixed term receives two expiration notices.
      Renewal notices are issued only on an active agreement with a fixed term.
      The initial_renewal_notice is compliant when its notice_date falls no earlier than renewal_notice_earliest_days and no later than renewal_notice_latest_days calendar days before contract_end_date.
      The final_options_notice is compliant when its notice_date falls no later than final_options_notice_latest_days calendar days before contract_end_date and after the initial notice.
      Each notice states the plan offered for renewal, the renewal rate and the month-to-month rate that applies in the first cycle after expiry if the customer makes no election.
      When the two notices state different offers, the final_options_notice governs.
      Notices are delivered by email only to customers who enrolled through the web channel and by mail otherwise.
    eligibility:
      - id: active_fixed_term
        applies_to: [power_renewal_notice]
        kind: state
        condition: Renewal notices are issued only on an active agreement with a fixed term.
        evidence_fields: [power_agreements.status, power_agreements.power_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_agreements.power_agreement_id]
          action_bindings:
            power_agreements.power_agreement_id: power_agreement_id
        state_contract:
          field: power_agreements.status
          allowed: [active]

  - id: power_rollover_terms
    subject: [power_rollover]
    rule: >-
      When a fixed or time-of-use term reaches contract_end_date without a renewal election and without a pending cancellation, the agreement converts on the following day to the plan named by rollover_variant, with term_months 0 and an empty contract_end_date, and plan_change_date set to the day after the expired contract_end_date.
      When both expiration notices were compliant, the rollover rate is the rollover_rate_cents_kwh stated in the final_options_notice.
      When either notice was missing or not compliant, the expiring contract rate is held for late_notice_rate_hold_cycles billing cycles beginning with the first cycle after expiry, and the variable rate policy applies only after those cycles.
      A rolled-over agreement carries the rollover plan's terms in full, including no early termination fee.
      A rollover is never treated as a new enrollment and earns no sign-up credit.
    eligibility: []

  - id: power_renewal
    subject: [power_renew, power_credit]
    rule: >-
      A customer renews by accepting the offer stated in the governing renewal notice: the agreement takes the offered plan, its term_months, and the offered renewal rate.
      A renewal is accepted only on an active agreement.
      When the election is made on or before contract_end_date, the new term starts the day after contract_end_date; when it is made after a rollover, the new term starts on the election date.
      The new contract_end_date is counted from the start of the new term in the same way as at activation.
      When the agreement has already rolled over, a renewal election is honoured only when the customer elects to renew no later than post_expiry_renewal_grace_days calendar days after the rollover took effect on plan_change_date.
      Day one is the calendar day after plan_change_date, and the grace period closes at the end of the calendar day equal to plan_change_date plus post_expiry_renewal_grace_days.
      A late election is not a renewal; the customer may instead change plans under the plan change policy at the then-valid price offer.
      Each renewal earns one renewal_loyalty_credit equal to the renewal_loyalty_credit_usd of the plan renewed into, posted on the first bill of the new term; plans with 0.00 earn none.
      Accepting a different plan than the one offered is a plan change, not a renewal.
    eligibility:
      - id: renewal_active
        applies_to: [power_renew]
        kind: state
        condition: A renewal is accepted only on an active agreement.
        evidence_fields: [power_agreements.status, power_agreements.power_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_agreements.power_agreement_id]
          action_bindings:
            power_agreements.power_agreement_id: power_agreement_id
        state_contract:
          field: power_agreements.status
          allowed: [active]
      - id: post_expiry_grace
        applies_to: [power_renew]
        kind: time
        condition: When the agreement has already rolled over, a renewal election is honoured only when the customer elects to renew no later than post_expiry_renewal_grace_days calendar days after the rollover took effect on plan_change_date.
        evidence_fields: [power_agreements.plan_change_date, power_agreements.power_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_agreements.power_agreement_id]
          action_bindings:
            power_agreements.power_agreement_id: power_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the rollover took effect on plan_change_date
          anchor_source: power_agreements.plan_change_date
          relation: not_after
          duration_source: variants.post_expiry_renewal_grace_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after plan_change_date, and the grace period closes at the end of the calendar day equal to plan_change_date plus post_expiry_renewal_grace_days.
          boundary: inclusive

  - id: power_plan_change_terms
    subject: [power_plan_change]
    rule: >-
      A customer may move an active agreement to another Beacon Ridge residential electricity plan when the current plan's mid_term_plan_change_allowed is true.
      A plan change is made only on an active agreement.
      A mid-term plan change is allowed only to a plan whose term_months is equal to or longer than the current plan's term_months, except within the current plan's etf_free_window_days before contract_end_date, when any plan may be chosen.
      Moving from a month-to-month plan to any fixed plan is always allowed.
      The new plan must satisfy the enrollment eligibility rules for the premise and the customer.
      The change takes effect at the start of the next billing cycle per plan_change_effective_basis, at the offer_rate of the price offer for the new plan and the premise's electric utility valid on that date, and the new term is counted from plan_change_date.
      An allowed plan change carries no early termination fee when etf_waive_on_upgrade is true.
      A plan change earns no sign-up credit, no online enrollment credit and no renewal loyalty credit.
    eligibility:
      - id: plan_change_active
        applies_to: [power_plan_change]
        kind: state
        condition: A plan change is made only on an active agreement.
        evidence_fields: [power_agreements.status, power_agreements.power_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_agreements.power_agreement_id]
          action_bindings:
            power_agreements.power_agreement_id: power_agreement_id
        state_contract:
          field: power_agreements.status
          allowed: [active]

  - id: power_cancellation
    subject: [power_cancel, power_cancel_withdraw, power_drop_complete, power_switch_away]
    rule: >-
      The customer cancels an active agreement by confirming the cancellation; Beacon Ridge then schedules a drop that takes effect on the premise's next scheduled meter read date, which is recorded as drop_effective_date.
      The customer may withdraw the cancellation and keep the agreement on its existing terms.
      A withdrawal is accepted only when the customer withdraws the cancellation before the scheduled drop takes effect on drop_effective_date.
      Day one is the calendar day after drop_requested_date, and the withdrawal period closes at the end of the calendar day before drop_effective_date.
      When the utility completes the drop, the agreement closes with close_reason cancelled_by_customer, or move_out when the drop_reason was move_out.
      When the utility ends supply because another supplier enrolled the premise, the agreement closes with close_reason switched_to_other_supplier; when the utility final-bills the premise for a move-out without a Beacon Ridge cancellation, it closes with close_reason move_out.
      A cancellation or switch-away does not cancel bill credits already posted.
    eligibility:
      - id: withdraw_before_drop
        applies_to: [power_cancel_withdraw]
        kind: time
        condition: A withdrawal is accepted only when the customer withdraws the cancellation before the scheduled drop takes effect on drop_effective_date.
        evidence_fields: [power_agreements.drop_effective_date, power_agreements.power_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_agreements.power_agreement_id]
          action_bindings:
            power_agreements.power_agreement_id: power_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the scheduled drop takes effect on drop_effective_date
          anchor_source: power_agreements.drop_effective_date
          relation: not_after
          duration_source: params.withdrawal_cutoff_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after drop_requested_date, and the withdrawal period closes at the end of the calendar day before drop_effective_date.
          boundary: exclusive
    params:
      withdrawal_cutoff_days: 0

  - id: power_etf
    subject: [power_etf_charge]
    rule: >-
      An early termination fee is assessed only once the agreement is drop_pending or closed.
      Only one early termination fee may be billed per agreement.
      The termination date is drop_requested_date for a customer cancellation and close_date for a switch-away or utility move-out.
      etf_months_remaining is the number of months from the termination date to contract_end_date, computed as twelve times the difference in years plus the difference in months, plus one when the day of month of contract_end_date is later than the day of month of the termination date.
      Under the flat method the fee is etf_flat_usd; under the per_remaining_month method it is etf_per_remaining_month_usd times etf_months_remaining, limited to etf_max_usd; under the none method no fee applies.
      No fee applies when the termination date falls within etf_free_window_days calendar days before contract_end_date, counting contract_end_date minus the termination date in calendar days and treating equality as inside the window.
      No fee applies when the termination date is within rescission_window_days calendar days after utility_confirmation_date.
      No fee applies when etf_waive_on_move is true and the premise carries a utility_move_out_date on or before the termination date plus move_out_match_days calendar days, or when close_reason is move_out.
      No fee applies when etf_waive_assistance_program is true and the customer's assistance_program is utility_cap.
      When any waiver applies the fee is zero and no line is posted; waivers are not partial and do not stack into a credit.
      Otherwise the fee is finally limited to the etf_state_cap_usd amount for the premise's service_state when that state appears in the mapping.
      A switch to another supplier is an early termination like any other; a regulatory pass-through, a rate increase on another agreement, or dissatisfaction with the rate do not waive the fee.
    eligibility:
      - id: terminated_status
        applies_to: [power_etf_charge]
        kind: state
        condition: An early termination fee is assessed only once the agreement is drop_pending or closed.
        evidence_fields: [power_agreements.status, power_agreements.power_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_agreements.power_agreement_id]
          action_bindings:
            power_agreements.power_agreement_id: power_agreement_id
        state_contract:
          field: power_agreements.status
          allowed: [drop_pending, closed]
      - id: single_etf
        applies_to: [power_etf_charge]
        kind: dedup
        condition: Only one early termination fee may be billed per agreement.
        evidence_fields: [power_billing.power_agreement_id, power_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_billing.power_agreement_id]
          action_bindings:
            power_billing.power_agreement_id: power_agreement_id
        dedup_contract:
          table: power_billing
          mode: separate_record
          object_bindings: {power_agreement_id: power_agreement_id}
          duplicate_filters: {line_type: [early_termination_fee]}
          distinct_fields: []
    params:
      move_out_match_days: 30
      per_tier:
        Beacon Ridge Monthly Variable: {etf_method: "=etf_method", etf_flat_usd: "=etf_flat_usd", etf_per_remaining_month_usd: "=etf_per_remaining_month_usd", etf_max_usd: "=etf_max_usd", etf_free_window_days: "=etf_free_window_days"}
        Beacon Ridge Price Lock 6: {etf_method: "=etf_method", etf_flat_usd: "=etf_flat_usd", etf_per_remaining_month_usd: "=etf_per_remaining_month_usd", etf_max_usd: "=etf_max_usd", etf_free_window_days: "=etf_free_window_days"}
        Beacon Ridge Price Lock 12: {etf_method: "=etf_method", etf_flat_usd: "=etf_flat_usd", etf_per_remaining_month_usd: "=etf_per_remaining_month_usd", etf_max_usd: "=etf_max_usd", etf_free_window_days: "=etf_free_window_days"}
        Beacon Ridge Price Lock 24: {etf_method: "=etf_method", etf_flat_usd: "=etf_flat_usd", etf_per_remaining_month_usd: "=etf_per_remaining_month_usd", etf_max_usd: "=etf_max_usd", etf_free_window_days: "=etf_free_window_days"}
        Beacon Ridge Free Nights 12: {etf_method: "=etf_method", etf_flat_usd: "=etf_flat_usd", etf_per_remaining_month_usd: "=etf_per_remaining_month_usd", etf_max_usd: "=etf_max_usd", etf_free_window_days: "=etf_free_window_days"}
        Beacon Ridge Clean Wind 12: {etf_method: "=etf_method", etf_flat_usd: "=etf_flat_usd", etf_per_remaining_month_usd: "=etf_per_remaining_month_usd", etf_max_usd: "=etf_max_usd", etf_free_window_days: "=etf_free_window_days"}
        Beacon Ridge Clean Wind 24: {etf_method: "=etf_method", etf_flat_usd: "=etf_flat_usd", etf_per_remaining_month_usd: "=etf_per_remaining_month_usd", etf_max_usd: "=etf_max_usd", etf_free_window_days: "=etf_free_window_days"}
    formula:
      when_not: etf_method == "none"
      amount_usd: etf_flat_usd if etf_method == "flat" else min(etf_max_usd, etf_per_remaining_month_usd * etf_months_remaining)

  - id: power_signup_credit
    subject: [power_credit]
    rule: >-
      A plan with signup_credit_usd above 0.00 earns one signup_credit once the agreement's completed cycles (power_msr_completed_cycles) reach signup_credit_after_cycles, posted on the bill of the next cycle.
      A web-channel enrollment on a plan with online_enrollment_credit_usd above 0.00 earns one online_enrollment_credit posted on the same bill as the sign-up credit.
      Each of the two credits may be posted only once per agreement.
      Bill credits are posted only while the agreement is active or drop_pending.
      When signup_credit_forfeit_on_drop is true and the agreement left active status before qualifying, the credits are forfeited.
      Sign-up and online credits are earned only by a new enrollment; plan changes, renewals and rollovers never earn them.
      All bill credits are additive: each is posted as its own line and none reduces another, and no credit offsets an early termination fee.
    eligibility:
      - id: one_signup_credit
        applies_to: [power_credit]
        kind: dedup
        condition: Each of the two credits may be posted only once per agreement.
        evidence_fields: [power_billing.power_agreement_id, power_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_billing.power_agreement_id]
          action_bindings:
            power_billing.power_agreement_id: power_agreement_id
        dedup_contract:
          table: power_billing
          mode: separate_record
          object_bindings: {power_agreement_id: power_agreement_id}
          duplicate_filters: {line_type: [signup_credit, online_enrollment_credit]}
          distinct_fields: [line_type]
      - id: credit_while_supplied
        applies_to: [power_credit]
        kind: state
        condition: Bill credits are posted only while the agreement is active or drop_pending.
        evidence_fields: [power_agreements.status, power_agreements.power_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_agreements.power_agreement_id]
          action_bindings:
            power_agreements.power_agreement_id: power_agreement_id
        state_contract:
          field: power_agreements.status
          allowed: [active, drop_pending]
    params:
      per_tier:
        Beacon Ridge Monthly Variable: {signup_credit_usd: "=signup_credit_usd", signup_credit_after_cycles: "=signup_credit_after_cycles", online_enrollment_credit_usd: "=online_enrollment_credit_usd"}
        Beacon Ridge Price Lock 6: {signup_credit_usd: "=signup_credit_usd", signup_credit_after_cycles: "=signup_credit_after_cycles", online_enrollment_credit_usd: "=online_enrollment_credit_usd"}
        Beacon Ridge Price Lock 12: {signup_credit_usd: "=signup_credit_usd", signup_credit_after_cycles: "=signup_credit_after_cycles", online_enrollment_credit_usd: "=online_enrollment_credit_usd"}
        Beacon Ridge Price Lock 24: {signup_credit_usd: "=signup_credit_usd", signup_credit_after_cycles: "=signup_credit_after_cycles", online_enrollment_credit_usd: "=online_enrollment_credit_usd"}
        Beacon Ridge Free Nights 12: {signup_credit_usd: "=signup_credit_usd", signup_credit_after_cycles: "=signup_credit_after_cycles", online_enrollment_credit_usd: "=online_enrollment_credit_usd"}
        Beacon Ridge Clean Wind 12: {signup_credit_usd: "=signup_credit_usd", signup_credit_after_cycles: "=signup_credit_after_cycles", online_enrollment_credit_usd: "=online_enrollment_credit_usd"}
        Beacon Ridge Clean Wind 24: {signup_credit_usd: "=signup_credit_usd", signup_credit_after_cycles: "=signup_credit_after_cycles", online_enrollment_credit_usd: "=online_enrollment_credit_usd"}
    measures: [power_msr_completed_cycles]

  - id: power_referral_credit
    subject: [power_credit]
    rule: >-
      A referral qualifies when the referred customer's power agreement, which names the referring customer in referred_by_customer_id, reaches referral_qualifying_cycles completed cycles (power_msr_completed_cycles).
      The referral credit is posted on the referring customer's earliest-enrolled power agreement that is active on the posting date, at that agreement's referral_credit_usd, with referred_customer_id set to the referred customer.
      When referral_credit_requires_active_referrer is true and the referring customer has no active power agreement, no credit is posted.
      Each referred customer earns the referrer one referral credit only.
      A referring customer receives no more than referral_max_credits_per_year referral credits in a calendar year, counted by power_msr_referral_credits_ytd; referrals beyond the limit earn nothing and are not carried into the next year.
      The referred customer receives no referral credit.
    eligibility:
      - id: one_credit_per_referred_customer
        applies_to: [power_credit]
        kind: dedup
        condition: Each referred customer earns the referrer one referral credit only.
        evidence_fields: [power_billing.referred_customer_id, power_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_billing.referred_customer_id]
          action_bindings:
            power_billing.referred_customer_id: referred_customer_id
        dedup_contract:
          table: power_billing
          mode: separate_record
          object_bindings: {referred_customer_id: referred_customer_id}
          duplicate_filters: {line_type: [referral_credit]}
          distinct_fields: []
    measures: [power_msr_completed_cycles, power_msr_referral_credits_ytd]

  - id: power_agg_dual_fuel
    subject: [power_credit]
    rule: >-
      Holding a Beacon Ridge residential natural gas agreement changes the credits of the electricity agreement at the same premise.
      For each billing cycle of the electricity agreement, a dual_fuel_credit of dual_fuel_credit_usd_per_cycle is posted when a gas agreement on the same premise_id was active on the cycle's billing_period_start.
      At most one dual-fuel credit is posted per premise per cycle, always on the electricity agreement; the gas agreement never carries it.
      A plan with dual_fuel_credit_usd_per_cycle 0.00 earns none, and a gas agreement that is enrollment_pending, drop_pending or closed on that date does not qualify the cycle.
      Missed dual-fuel credits are restored for cycles within the billing dispute lookback.
    eligibility:
      - id: one_dual_fuel_per_cycle
        applies_to: [power_credit]
        kind: dedup
        condition: At most one dual-fuel credit is posted per premise per cycle, always on the electricity agreement; the gas agreement never carries it.
        evidence_fields: [power_billing.power_agreement_id, power_billing.billing_period_start, power_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_billing.power_agreement_id, power_billing.billing_period_start]
          action_bindings:
            power_billing.power_agreement_id: power_agreement_id
            power_billing.billing_period_start: billing_period_start
        dedup_contract:
          table: power_billing
          mode: separate_record
          object_bindings: {power_agreement_id: power_agreement_id, billing_period_start: billing_period_start}
          duplicate_filters: {line_type: [dual_fuel_credit]}
          distinct_fields: []

  - id: power_billing_correction
    subject: [power_adjustment]
    rule: >-
      When a supply line was billed at more than the policy allows, the over-billed amount is returned as one rebill_credit tied to that line through source_billing_id.
      The rebill credit equals the billed amount_usd minus the correctly computed amount for the same line, rounded per supply_charge_rounding, and is posted as a negative amount.
      A line may be corrected only when the customer disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
      The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
      Each billed line may be corrected only once.
      A care agent may post a rebill credit up to agent_adjustment_limit_usd; a larger correction is not posted as an adjustment but opened as a billing dispute for review, which settles it.
      Under-billing caused by a Beacon Ridge rate or fee error is not back-billed.
      Usage disputes about the kWh the utility measured are not corrected by Beacon Ridge, because meter readings belong to the utility.
    eligibility:
      - id: dispute_lookback
        applies_to: [power_adjustment]
        kind: time
        condition: A line may be corrected only when the customer disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
        evidence_fields: [power_billing.posted_date, power_billing.power_billing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_billing.power_billing_id]
          action_bindings:
            power_billing.power_billing_id: source_billing_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the line was posted
          anchor_source: power_billing.posted_date
          relation: not_after
          duration_source: variants.billing_dispute_lookback_months
          unit: calendar_months
          counting_rule: The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
          boundary: inclusive
      - id: one_correction_per_line
        applies_to: [power_adjustment]
        kind: dedup
        condition: Each billed line may be corrected only once.
        evidence_fields: [power_billing.source_billing_id, power_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [power_billing.source_billing_id]
          action_bindings:
            power_billing.source_billing_id: source_billing_id
        dedup_contract:
          table: power_billing
          mode: separate_record
          object_bindings: {source_billing_id: source_billing_id}
          duplicate_filters: {line_type: [rebill_credit]}
          distinct_fields: []

extended_policies:
  - id: power_ext_dual_fuel_restoration
    base_policy_refs: [power_agg_dual_fuel, power_signup_credit, power_referral_credit, power_renewal]
    overwrite:
      - base_policy: power_agg_dual_fuel
        superseded_clause: >-
          For each billing cycle of the electricity agreement, a dual_fuel_credit of dual_fuel_credit_usd_per_cycle is posted when a gas agreement on the same premise_id was active on the cycle's billing_period_start.
        replaced_by: >-
          A restored dual-fuel credit is the credit line for that one missed cycle, and its amount is the restored dual-fuel credit worked out below rather than the bare per-cycle dual-fuel credit of the plan.
    trigger: state_due
    subject: [power_credit]
    computes: credit_amount_usd
    target_tool: post_dual_fuel_credit_18175409
    params:
      bundle_uplift_long_usd: 2.00
      bundle_uplift_short_usd: 1.00
      compensation_established: 1.5
      compensation_developing: 1.25
      tenure_addition_long_usd: 1.00
      tenure_addition_mid_usd: 0.50
      usage_addition_high_usd: 1.00
      usage_addition_mid_usd: 0.50
      edelivery_addition_full_usd: 0.50
      edelivery_addition_partial_usd: 0.25
    rule: >-
      A dual-fuel credit that was missed on a past billing cycle of the electricity agreement is restored as one dual-fuel credit line for that cycle, provided a Beacon Ridge residential natural gas agreement on the same premise was active on the cycle's start date and the cycle falls within the billing dispute lookback.
      A restored dual-fuel credit is the credit line for that one missed cycle, and its amount is the restored dual-fuel credit worked out below rather than the bare per-cycle dual-fuel credit of the plan.
      The standard restored dual-fuel credit is the per-cycle dual-fuel credit of the electricity plan in force, rounded half up to the cent.
      Bundle uplift: when the gas agreement on the same premise is on a fixed-rate gas plan whose term is 24 months or longer, the long-term bundle uplift is added to the per-cycle dual-fuel credit; when it is on a fixed-rate gas plan whose term is shorter than 24 months, the short-term bundle uplift is added; when it is on any plan that is not fixed-rate, no uplift is added.
      Restoration compensation: the per-cycle dual-fuel credit plus any bundle uplift is multiplied by a compensation factor set by the number of dual-fuel credit lines on the agreement whose billing cycle started less than twelve whole months before the restoration date; with 10 or more such lines the established-bundle factor applies, with 6 to 9 such lines the developing-bundle factor applies, and with fewer than 6 such lines the factor is 1.
      Tenure addition: when the agreement's service start date is 24 or more whole months before the restoration date the long-tenure addition is added, when it is 12 to 23 whole months before the mid-tenure addition is added, and when it is fewer than 12 whole months before nothing is added.
      Usage addition: the average kWh of the agreement's energy charge lines whose billing cycle started less than twelve whole months before the restoration date is taken; at 1,000 kWh or more the high-usage addition is added, from 800 up to but not including 1,000 kWh the mid-usage addition is added, and below 800 kWh nothing is added.
      Paperless addition: when the agreement was enrolled through the web and at least one notice on the agreement was delivered by email, the full paperless addition is added; when exactly one of those two holds, the partial paperless addition is added; when neither holds, nothing is added.
      The amounts are combined in this order: first the per-cycle dual-fuel credit plus any bundle uplift is multiplied by the compensation factor, and then the tenure, usage and paperless additions are added to that product; the total is rounded half up to the cent only once, at the end.
      The credit is posted as a negative amount on the restored cycle's bill line.
    prerequisite: []
    cross_category:
      - category: gas
        as: branch
        reads: [variant_name, rate_type, term_months]
        note: The bundle uplift tier is decided from the rate type and term of the customer's gas plan on the same premise.
    compute:
      - per_cycle_credit: "P('dual_fuel_credit_usd_per_cycle')"
      - gas_rate_type: "CPARAM('gas', 'rate_type', premise_id=F('premise_id'))"
      - gas_term_months: "CPARAM('gas', 'term_months', premise_id=F('premise_id'))"
      - bundle_uplift: "K('bundle_uplift_long_usd') if (gas_rate_type == 'fixed' and gas_term_months >= 24) else (K('bundle_uplift_short_usd') if (gas_rate_type == 'fixed' and gas_term_months < 24) else 0.0)"
      - bundle_lines_12m: "COUNT('power_billing', within_months=12, date_field='billing_period_start', line_type='dual_fuel_credit')"
      - compensated_credit: "(per_cycle_credit + bundle_uplift) * (K('compensation_established') if bundle_lines_12m >= 10 else (K('compensation_developing') if bundle_lines_12m >= 6 else 1.0))"
      - restoration_tenure_months: "MONTHS(F('service_start_date'), NOW)"
      - tenure_addition: "K('tenure_addition_long_usd') if restoration_tenure_months >= 24 else (K('tenure_addition_mid_usd') if restoration_tenure_months >= 12 else 0.0)"
      - usage_kwh_12m: "SUM('power_billing', 'usage_kwh', within_months=12, date_field='billing_period_start', line_type='energy_charge')"
      - usage_lines_12m: "COUNT('power_billing', within_months=12, date_field='billing_period_start', line_type='energy_charge')"
      - usage_addition: "(K('usage_addition_high_usd') if usage_kwh_12m / usage_lines_12m >= 1000 else (K('usage_addition_mid_usd') if usage_kwh_12m / usage_lines_12m >= 800 else 0.0)) if usage_lines_12m > 0 else 0.0"
      - email_notices: "COUNT('power_notices', delivery_channel='email')"
      - paperless_addition: "K('edelivery_addition_full_usd') if (F('enrollment_channel') == 'web' and email_notices >= 1) else (K('edelivery_addition_partial_usd') if (F('enrollment_channel') == 'web' or email_notices >= 1) else 0.0)"
      - result: "RND(compensated_credit + tenure_addition + usage_addition + paperless_addition, 2)"
    compute_basis:
      per_cycle_credit: "The standard restored dual-fuel credit is the per-cycle dual-fuel credit of the electricity plan in force, rounded half up to the cent."
      gas_rate_type: "Bundle uplift: when the gas agreement on the same premise is on a fixed-rate gas plan whose term is 24 months or longer, the long-term bundle uplift is added to the per-cycle dual-fuel credit"
      gas_term_months: "when it is on a fixed-rate gas plan whose term is shorter than 24 months, the short-term bundle uplift is added"
      bundle_uplift: "Bundle uplift: when the gas agreement on the same premise is on a fixed-rate gas plan whose term is 24 months or longer, the long-term bundle uplift is added to the per-cycle dual-fuel credit; when it is on a fixed-rate gas plan whose term is shorter than 24 months, the short-term bundle uplift is added; when it is on any plan that is not fixed-rate, no uplift is added."
      bundle_lines_12m: "a compensation factor set by the number of dual-fuel credit lines on the agreement whose billing cycle started less than twelve whole months before the restoration date"
      compensated_credit: "Restoration compensation: the per-cycle dual-fuel credit plus any bundle uplift is multiplied by a compensation factor set by the number of dual-fuel credit lines on the agreement whose billing cycle started less than twelve whole months before the restoration date; with 10 or more such lines the established-bundle factor applies, with 6 to 9 such lines the developing-bundle factor applies, and with fewer than 6 such lines the factor is 1."
      restoration_tenure_months: "when the agreement's service start date is 24 or more whole months before the restoration date"
      tenure_addition: "Tenure addition: when the agreement's service start date is 24 or more whole months before the restoration date the long-tenure addition is added, when it is 12 to 23 whole months before the mid-tenure addition is added, and when it is fewer than 12 whole months before nothing is added."
      usage_kwh_12m: "the average kWh of the agreement's energy charge lines whose billing cycle started less than twelve whole months before the restoration date is taken"
      usage_lines_12m: "the average kWh of the agreement's energy charge lines whose billing cycle started less than twelve whole months before the restoration date is taken"
      usage_addition: "at 1,000 kWh or more the high-usage addition is added, from 800 up to but not including 1,000 kWh the mid-usage addition is added, and below 800 kWh nothing is added."
      email_notices: "at least one notice on the agreement was delivered by email"
      paperless_addition: "Paperless addition: when the agreement was enrolled through the web and at least one notice on the agreement was delivered by email, the full paperless addition is added; when exactly one of those two holds, the partial paperless addition is added; when neither holds, nothing is added."
      result: "The amounts are combined in this order: first the per-cycle dual-fuel credit plus any bundle uplift is multiplied by the compensation factor, and then the tenure, usage and paperless additions are added to that product; the total is rounded half up to the cent only once, at the end."
    factors:
      - id: bundle_uplift
        effect: parameter
        decides: bundle_uplift
        bindings: [gas_rate_type, gas_term_months, bundle_uplift]
        ladder:
          - when: "the gas agreement on the same premise is on a fixed-rate gas plan AND that gas plan's term is 24 months or longer"
            value: "K('bundle_uplift_long_usd')"
          - when: "the gas agreement on the same premise is on a fixed-rate gas plan AND that gas plan's term is shorter than 24 months"
            value: "K('bundle_uplift_short_usd')"
          - when: "otherwise (no gas plan on the premise, or a gas plan that is not fixed-rate)"
            value: "0.00"
