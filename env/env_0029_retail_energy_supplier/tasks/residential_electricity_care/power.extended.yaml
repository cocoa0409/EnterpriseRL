  - id: power_ext_renewal_rate
    base_policy_refs: [power_renewal]
    overwrite:
      - base_policy: power_renewal
        superseded_clause: >-
          A customer renews by accepting the offer stated in the governing renewal notice: the agreement takes the offered plan, its term_months, and the offered renewal rate.
        replaced_by: >-
          A customer renews by accepting the offer stated in the governing renewal notice: the agreement takes the offered plan and that plan's term, at the renewal rate worked out below rather than the bare offered rate.
    trigger: on_request
    subject: [power_renew]
    computes: contract_rate_cents_kwh
    target_tool: accept_renewal_offer_e5d86473
    params:
      tenure_reduction_long_cents: 0.40
      tenure_reduction_mid_cents: 0.25
      bundle_reduction_full_cents: 0.30
      bundle_reduction_partial_cents: 0.15
      commitment_reduction_long_cents: 0.20
      commitment_reduction_mid_cents: 0.10
      volume_factor_high: 1.4
      volume_factor_mid: 1.2
      paperless_reduction_full_cents: 0.10
      paperless_reduction_partial_cents: 0.05
      early_reduction_long_cents: 0.20
      early_reduction_short_cents: 0.10
    rule: >-
      A customer renews by accepting the offer stated in the governing renewal notice: the agreement takes the offered plan and that plan's term, at the renewal rate worked out below rather than the bare offered rate.
      The renewal rate is fixed only after the agreement's bill lines carry the dual-fuel credit owed for every billing cycle within the billing dispute lookback on whose start date a Beacon Ridge gas agreement on the same premise was active.
      The standard renewal rate is the offered renewal rate stated on the latest renewal notice on the agreement, in cents per kWh to two decimal places.
      Tenure reduction: when the agreement's service start date is 36 or more whole months before the election date the long-tenure reduction applies, when it is 18 to 35 whole months before the mid-tenure reduction applies, and when it is fewer than 18 whole months before no tenure reduction applies.
      Bundle reduction: the dual-fuel credit lines on the agreement whose billing cycle started less than twelve whole months before the election date are counted; with 11 or more such lines the full bundle reduction applies, with 6 to 10 such lines the partial bundle reduction applies, and with fewer than 6 no bundle reduction applies.
      Commitment reduction: the expiring term is counted in months from the later of the service start date and the latest renewal or plan change date through the contract end date, the end month included; for an expiring term of 24 months or more the long-commitment reduction applies, for 12 to 23 months the mid-commitment reduction applies, and for a shorter term none applies.
      Paperless reduction: when the agreement was enrolled through the web and at least one notice on the agreement was delivered by email the full paperless reduction applies; when exactly one of those two holds the partial paperless reduction applies; when neither holds none applies.
      Early election reduction: when the election is made 30 or more calendar days before the contract end date the long early-election reduction applies, when it is made 1 to 29 calendar days before the contract end date the short early-election reduction applies, and when it is made on or after the contract end date, or the agreement has no contract end date, none applies.
      Volume scaling: the tenure, bundle, commitment, paperless and early election reductions are first added together into one combined reduction, and that combined reduction is then scaled by the average kWh of the agreement's energy charge lines whose billing cycle started less than twelve whole months before the election date; at an average of 1,000 kWh or more the combined reduction is multiplied by the high-volume factor, from 800 up to but not including 1,000 kWh by the mid-volume factor, and below 800 kWh it is taken as it stands.
      The renewal rate is the offered renewal rate less the scaled combined reduction, the reduction acting once on the offered rate, rounded half up to two decimal places only at the end.
    prerequisite:
      - problem: power_ext_dual_fuel_restoration
        kind: value_input
        gate: credited_bundle_cycles
        form: state
        policy_source: >-
          The renewal rate is fixed only after the agreement's bill lines carry the dual-fuel credit owed for every billing cycle within the billing dispute lookback on whose start date a Beacon Ridge gas agreement on the same premise was active.
        condition: >-
          For every billing cycle of the agreement within the billing dispute lookback whose start date fell inside an active period of a Beacon Ridge gas agreement on the same premise and on which the plan in force carried a per-cycle dual-fuel credit above 0.00, a dual-fuel credit line with that billing period start stands among the agreement's bill lines.
        resolved_by: post_dual_fuel_credit_18175409
        effect: >-
          Restoring a missed dual-fuel credit adds a dual-fuel credit line inside the twelve-month window, which raises the count the bundle reduction is tiered on and can move the agreement into a higher bundle reduction tier.
    cross_category: []
    compute:
      - offered_rate: "LATEST('power_notices', 'new_rate_cents_kwh', date_field='notice_date', event_type='power_renewal_notice')"
      - renewal_tenure_months: "MONTHS(F('service_start_date'), NOW)"
      - tenure_reduction: "K('tenure_reduction_long_cents') if renewal_tenure_months >= 36 else (K('tenure_reduction_mid_cents') if renewal_tenure_months >= 18 else 0.0)"
      - credited_bundle_cycles: "COUNT('power_billing', within_months=12, date_field='billing_period_start', line_type='dual_fuel_credit')"
      - bundle_reduction: "K('bundle_reduction_full_cents') if credited_bundle_cycles >= 11 else (K('bundle_reduction_partial_cents') if credited_bundle_cycles >= 6 else 0.0)"
      - expiring_term_months: "MONTHS(F('plan_change_date') or F('service_start_date'), F('contract_end_date')) + 1 if F('contract_end_date') else 0"
      - commitment_reduction: "K('commitment_reduction_long_cents') if expiring_term_months >= 24 else (K('commitment_reduction_mid_cents') if expiring_term_months >= 12 else 0.0)"
      - renewal_email_notices: "COUNT('power_notices', delivery_channel='email')"
      - paperless_reduction: "K('paperless_reduction_full_cents') if (F('enrollment_channel') == 'web' and renewal_email_notices >= 1) else (K('paperless_reduction_partial_cents') if (F('enrollment_channel') == 'web' or renewal_email_notices >= 1) else 0.0)"
      - days_before_term_end: "DAYS(NOW, F('contract_end_date')) if F('contract_end_date') else 0"
      - early_reduction: "K('early_reduction_long_cents') if days_before_term_end >= 30 else (K('early_reduction_short_cents') if days_before_term_end >= 1 else 0.0)"
      - combined_reduction: "tenure_reduction + bundle_reduction + commitment_reduction + paperless_reduction + early_reduction"
      - renewal_kwh_12m: "SUM('power_billing', 'usage_kwh', within_months=12, date_field='billing_period_start', line_type='energy_charge')"
      - renewal_lines_12m: "COUNT('power_billing', within_months=12, date_field='billing_period_start', line_type='energy_charge')"
      - scaled_reduction: "combined_reduction * ((K('volume_factor_high') if renewal_kwh_12m / renewal_lines_12m >= 1000 else (K('volume_factor_mid') if renewal_kwh_12m / renewal_lines_12m >= 800 else 1.0)) if renewal_lines_12m > 0 else 1.0)"
      - result: "RND(offered_rate - scaled_reduction, 2)"
    compute_basis:
      offered_rate: "The standard renewal rate is the offered renewal rate stated on the latest renewal notice on the agreement, in cents per kWh to two decimal places."
      renewal_tenure_months: "when the agreement's service start date is 36 or more whole months before the election date the long-tenure reduction applies"
      tenure_reduction: "Tenure reduction: when the agreement's service start date is 36 or more whole months before the election date the long-tenure reduction applies, when it is 18 to 35 whole months before the mid-tenure reduction applies, and when it is fewer than 18 whole months before no tenure reduction applies."
      credited_bundle_cycles: "Bundle reduction: the dual-fuel credit lines on the agreement whose billing cycle started less than twelve whole months before the election date are counted"
      bundle_reduction: "with 11 or more such lines the full bundle reduction applies, with 6 to 10 such lines the partial bundle reduction applies, and with fewer than 6 no bundle reduction applies."
      expiring_term_months: "Commitment reduction: the expiring term is counted in months from the later of the service start date and the latest renewal or plan change date through the contract end date, the end month included"
      commitment_reduction: "for an expiring term of 24 months or more the long-commitment reduction applies, for 12 to 23 months the mid-commitment reduction applies, and for a shorter term none applies."
      renewal_email_notices: "at least one notice on the agreement was delivered by email"
      paperless_reduction: "Paperless reduction: when the agreement was enrolled through the web and at least one notice on the agreement was delivered by email the full paperless reduction applies; when exactly one of those two holds the partial paperless reduction applies; when neither holds none applies."
      days_before_term_end: "Early election reduction: when the election is made 30 or more calendar days before the contract end date the long early-election reduction applies"
      early_reduction: "Early election reduction: when the election is made 30 or more calendar days before the contract end date the long early-election reduction applies, when it is made 1 to 29 calendar days before the contract end date the short early-election reduction applies, and when it is made on or after the contract end date, or the agreement has no contract end date, none applies."
      combined_reduction: "the tenure, bundle, commitment, paperless and early election reductions are first added together into one combined reduction"
      renewal_kwh_12m: "that combined reduction is then scaled by the average kWh of the agreement's energy charge lines whose billing cycle started less than twelve whole months before the election date"
      renewal_lines_12m: "that combined reduction is then scaled by the average kWh of the agreement's energy charge lines whose billing cycle started less than twelve whole months before the election date"
      scaled_reduction: "at an average of 1,000 kWh or more the combined reduction is multiplied by the high-volume factor, from 800 up to but not including 1,000 kWh by the mid-volume factor, and below 800 kWh it is taken as it stands."
      result: "The renewal rate is the offered renewal rate less the scaled combined reduction, the reduction acting once on the offered rate, rounded half up to two decimal places only at the end."
    factors:
      - id: tenure_reduction
        effect: parameter
        decides: tenure_reduction
        bindings: [renewal_tenure_months, tenure_reduction]
        ladder:
          - when: "service start date 36 or more whole months before the election date"
            value: "K('tenure_reduction_long_cents')"
          - when: "service start date 18 to 35 whole months before the election date"
            value: "K('tenure_reduction_mid_cents')"
          - when: "otherwise (fewer than 18 whole months)"
