  - id: gas_ext_added_premise_rate
    base_policy_refs: [gas_agg_multi_holding, gas_enrollment_eligibility, gas_renewal]
    overwrite:
      - base_policy: gas_enrollment_eligibility
        superseded_clause: >-
          The contract_rate_usd_therm is the offer_rate of the price offer for the plan and the premise's gas utility whose validity window contains the enrollment_date; on a capped variable plan that rate is also the ceiling for the whole term.
        replaced_by: >-
          An added premise is enrolled at the household rate set by this policy instead of the offer rate of a price offer.
    trigger: on_request
    subject: [gas_enroll]
    computes: contract_rate_usd_therm
    target_tool: enroll_gas_added_premise_5ded636b
    params:
      household_high_therms: 900
      household_mid_therms: 500
      household_pct_factor: 0.97
      household_flat_disc: 0.0100
      tenure_disc_long: 0.0080
      tenure_disc_mid: 0.0040
      tenure_long_days: 730
      tenure_mid_days: 365
      elec_disc_high: 0.0060
      elec_disc_mid: 0.0030
      elec_high_usd: 1200
      elec_mid_usd: 600
      align_disc_long: 0.0050
      align_disc_mid: 0.0025
      align_long_days: 540
      align_mid_days: 180
      commit_window_days: 30
      commit_bonus_long: 0.0040
      commit_bonus_short: 0.0020
      commit_long_months: 24
    rule: >
      A customer who adds a residential premise while holding a Beacon Ridge gas agreement at the premise of their mailing address, the home agreement, is enrolled at the added premise on the plan in force on the home agreement, with that plan's term in months, through a phone enrollment taken by the care agent.
      An added premise is enrolled at the household rate set by this policy instead of the offer rate of a price offer.
      The household rate for an added premise is fixed only after the home agreement, once rolled over, again carries a term in months and a contract end date.
      The household rate is the home agreement's contract rate, carried at four decimal places.
      When the home agreement is on a fixed plan and the therms billed on its energy lines of cycles starting later than the same calendar day twelve months before the enrollment date total household_high_therms or more, the household base rate is the home agreement's contract rate multiplied by household_pct_factor and rounded half up to four decimal places; when the home agreement is on a fixed plan and those therms total household_mid_therms or more but below household_high_therms, the household base rate is the home agreement's contract rate minus household_flat_disc per therm; in every other case the household base rate is the home agreement's contract rate.
      The household tenure reduction depends on the calendar days from the home agreement's service start date to the enrollment date: tenure_disc_long per therm when they are tenure_long_days or more, tenure_disc_mid per therm when they are at least tenure_mid_days but fewer than tenure_long_days, and none when they are fewer than tenure_mid_days.
      The household electricity reduction depends on the energy charges billed on the customer's Beacon Ridge residential electricity lines of cycles starting later than the same calendar day twelve months before the enrollment date: elec_disc_high per therm when they total elec_high_usd or more, elec_disc_mid per therm when they total elec_mid_usd or more but below elec_high_usd, and none when they total below elec_mid_usd; electricity service fee lines and credits are not counted.
      The term alignment reduction depends on the calendar days from the enrollment date to the home agreement's contract end date: align_disc_long per therm when they are align_long_days or more, align_disc_mid per therm when they are at least align_mid_days but fewer than align_long_days, and none when they are fewer than align_mid_days or the home agreement carries no contract end date.
      The new commitment reduction depends on the home agreement's most recent plan change date and term: commit_bonus_long per therm when that date is no more than commit_window_days calendar days before the enrollment date and the term is commit_long_months months or more, commit_bonus_short per therm when that date is no more than commit_window_days calendar days before the enrollment date and the term is above zero but below commit_long_months months, and none in every other case.
      The household rate is the household base rate minus the household tenure reduction, minus the household electricity reduction, minus the term alignment reduction and minus the new commitment reduction, all per-therm amounts taken from that one base rate, and the total is rounded half up to four decimal places once at the end.
      The added premise must satisfy the gas enrollment eligibility rules and the one-live-agreement-per-premise rule.
    prerequisite:
      - problem: gas_ext_recontract_rate
        kind: value_input
        gate: home_rate
        form: state
        policy_source: >-
          The household rate for an added premise is fixed only after the home agreement, once rolled over, again carries a term in months and a contract end date.
        condition: >-
          The home gas agreement, whose plan change date records a rollover to month-to-month service, again carries a term in months above zero and a non-empty contract end date.
        resolved_by: accept_gas_recontract_offer_a9611340
        effect: >-
          The home agreement's contract rate becomes the re-contract rate, its plan becomes the offered fixed plan with its term and contract end date, and its plan change date becomes the election date, so the household base rate, the term alignment reduction and the new commitment reduction all take their values from the re-contracted term.
    cross_category:
      - category: power
        as: history
        reads: [power_billing.amount_usd, power_billing.line_type, power_billing.billing_period_start]
        note: The household electricity reduction is decided from the energy charges on the customer's residential electricity bill lines of the last twelve months.
    compute:
      - home_rate: "F('contract_rate_usd_therm')"
      - home_usage12: "SUM('gas_billing', 'usage_therms', within_months=12, date_field='billing_period_start', line_type='energy_charge')"
      - base_rate: "int(home_rate * K('household_pct_factor') * 10000 + 0.5 + 1e-9) / 10000 if (P('rate_type') == 'fixed' and home_usage12 >= K('household_high_therms')) else ((home_rate - K('household_flat_disc')) if (P('rate_type') == 'fixed' and home_usage12 >= K('household_mid_therms') and home_usage12 < K('household_high_therms')) else home_rate)"
      - supply_days: "DAYS(F('service_start_date'), NOW)"
      - tenure_disc: "K('tenure_disc_long') if supply_days >= K('tenure_long_days') else (K('tenure_disc_mid') if supply_days >= K('tenure_mid_days') else 0)"
      - elec_spend: "XSUM('power', 'power_billing', 'amount_usd', within_months=12, date_field='billing_period_start', line_type='energy_charge')"
      - elec_disc: "K('elec_disc_high') if elec_spend >= K('elec_high_usd') else (K('elec_disc_mid') if elec_spend >= K('elec_mid_usd') else 0)"
      - remaining_days: "DAYS(NOW, F('contract_end_date')) if F('contract_end_date') else 0"
      - align_disc: "K('align_disc_long') if remaining_days >= K('align_long_days') else (K('align_disc_mid') if remaining_days >= K('align_mid_days') else 0)"
      - change_days: "DAYS(F('plan_change_date'), NOW) if F('plan_change_date') else 99999"
      - commit_bonus: "K('commit_bonus_long') if (change_days <= K('commit_window_days') and F('term_months') >= K('commit_long_months')) else (K('commit_bonus_short') if (change_days <= K('commit_window_days') and F('term_months') > 0 and F('term_months') < K('commit_long_months')) else 0)"
      - result: "int((base_rate - tenure_disc - elec_disc - align_disc - commit_bonus) * 10000 + 0.5 + 1e-9) / 10000"
    compute_basis:
      home_rate: "The household rate is the home agreement's contract rate, carried at four decimal places."
      home_usage12: "the therms billed on its energy lines of cycles starting later than the same calendar day twelve months before the enrollment date total household_high_therms or more"
      base_rate: "When the home agreement is on a fixed plan and the therms billed on its energy lines of cycles starting later than the same calendar day twelve months before the enrollment date total household_high_therms or more, the household base rate is the home agreement's contract rate multiplied by household_pct_factor and rounded half up to four decimal places; when the home agreement is on a fixed plan and those therms total household_mid_therms or more but below household_high_therms, the household base rate is the home agreement's contract rate minus household_flat_disc per therm; in every other case the household base rate is the home agreement's contract rate."
      supply_days: "The household tenure reduction depends on the calendar days from the home agreement's service start date to the enrollment date"
      tenure_disc: "tenure_disc_long per therm when they are tenure_long_days or more, tenure_disc_mid per therm when they are at least tenure_mid_days but fewer than tenure_long_days, and none when they are fewer than tenure_mid_days."
      elec_spend: "The household electricity reduction depends on the energy charges billed on the customer's Beacon Ridge residential electricity lines of cycles starting later than the same calendar day twelve months before the enrollment date"
      elec_disc: "elec_disc_high per therm when they total elec_high_usd or more, elec_disc_mid per therm when they total elec_mid_usd or more but below elec_high_usd, and none when they total below elec_mid_usd; electricity service fee lines and credits are not counted."
      remaining_days: "The term alignment reduction depends on the calendar days from the enrollment date to the home agreement's contract end date"
      align_disc: "align_disc_long per therm when they are align_long_days or more, align_disc_mid per therm when they are at least align_mid_days but fewer than align_long_days, and none when they are fewer than align_mid_days or the home agreement carries no contract end date."
      change_days: "The new commitment reduction depends on the home agreement's most recent plan change date and term"
      commit_bonus: "commit_bonus_long per therm when that date is no more than commit_window_days calendar days before the enrollment date and the term is commit_long_months months or more, commit_bonus_short per therm when that date is no more than commit_window_days calendar days before the enrollment date and the term is above zero but below commit_long_months months, and none in every other case."
      result: "The household rate is the household base rate minus the household tenure reduction, minus the household electricity reduction, minus the term alignment reduction and minus the new commitment reduction, all per-therm amounts taken from that one base rate, and the total is rounded half up to four decimal places once at the end."
    factors:
      - id: household_form
        effect: method
        decides: base_rate
        bindings: [home_usage12, base_rate]
        ladder:
          - when: "the home agreement is on a fixed plan and its energy lines of the last twelve months bill household_high_therms therms or more"
            method: "the household base rate is the home contract rate multiplied by household_pct_factor, rounded half up to four decimal places"
          - when: "the home agreement is on a fixed plan and those lines bill household_mid_therms therms or more but below household_high_therms"
            method: "the household base rate is the home contract rate minus household_flat_disc per therm"
          - when: "otherwise"
            method: "the household base rate is the home contract rate"
        baseline:
          base_rate: "home_rate"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: household_tenure
        effect: parameter
        decides: tenure_disc
        bindings: [supply_days, tenure_disc]
        ladder:
          - when: "the home agreement's service began tenure_long_days or more calendar days before the enrollment date"
            value: "K('tenure_disc_long')"
          - when: "it began at least tenure_mid_days but fewer than tenure_long_days calendar days before"
            value: "K('tenure_disc_mid')"
          - when: "otherwise (fewer than tenure_mid_days days)"
            value: "0"
        baseline:
          tenure_disc: "0"
        evidence: [date]
        cross_difficulty: null
      - id: household_electricity
        effect: parameter
        decides: elec_disc
        bindings: [elec_spend, elec_disc]
        ladder:
          - when: "the customer's residential electricity energy charges of the last twelve months total elec_high_usd or more"
            value: "K('elec_disc_high')"
          - when: "they total elec_mid_usd or more but below elec_high_usd"
            value: "K('elec_disc_mid')"
          - when: "otherwise (below elec_mid_usd)"
            value: "0"
        baseline:
          elec_disc: "0"
        evidence: [cross_category, history]
        cross_difficulty: power
      - id: term_alignment
        effect: parameter
        decides: align_disc
        bindings: [remaining_days, align_disc]
        ladder:
          - when: "the home agreement's contract end date is align_long_days or more calendar days after the enrollment date"
            value: "K('align_disc_long')"
          - when: "it is at least align_mid_days but fewer than align_long_days calendar days after"
            value: "K('align_disc_mid')"
          - when: "otherwise (fewer than align_mid_days days, or no contract end date)"
            value: "0"
        baseline:
          align_disc: "0"
        evidence: [date]
        cross_difficulty: null
      - id: new_commitment
        effect: parameter
        decides: commit_bonus
        bindings: [change_days, commit_bonus]
        ladder:
          - when: "the home agreement's latest plan change date is no more than commit_window_days days before the enrollment and its term is commit_long_months months or more"
            value: "K('commit_bonus_long')"
          - when: "that plan change date is no more than commit_window_days days before the enrollment and its term is above zero but below commit_long_months months"
            value: "K('commit_bonus_short')"
          - when: "otherwise"
            value: "0"
        baseline:
          commit_bonus: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The household rate is the home agreement's contract rate, carried at four decimal places.
      params: []
    inputs:
      history:
        - {table: gas_billing, aggregate: sum, field: usage_therms, within_months: 12, filters: {line_type: energy_charge}}
        - {category: power, table: power_billing, aggregate: sum, field: amount_usd, within_months: 12, filters: {line_type: energy_charge}}
      cross_category: [power]

  - id: gas_ext_latest_bill_rebill_credit
    base_policy_refs: [gas_billing_correction, gas_supply_billing, gas_variable_rate, gas_regulatory_passthrough]
    overwrite:
      - base_policy: gas_billing_correction
        superseded_clause: >-
          The rebill credit equals the billed amount_usd minus the correctly computed amount for the same line, rounded per charge_rounding, posted as a negative amount; a fee line that should not have been billed is corrected in full.
        replaced_by: >-
          The latest-bill rebill credit is the over-billed amount plus the billing-error supplement, the carried-charge supplement and the repeat-error supplement, rounded half up to the cent, and it is posted as one negative rebill credit tied to the disputed line on the bill of that line's billing cycle.
      - base_policy: gas_billing_correction
        superseded_clause: >-
          A care agent may post a rebill credit up to agent_adjustment_limit_usd; a larger correction is opened as a gas billing dispute for review instead of being posted.
        replaced_by: >-
          The over-billed amount before any supplement is what is compared with agent_adjustment_limit_usd; when it is above that limit the correction is opened as a gas billing dispute for review instead of being posted.
    trigger: on_request
    subject: [gas_adjustment]
    computes: credit_amount_usd
    target_tool: post_gas_rebill_credit_0e7c2434
    params:
      error_supp_high: 10.00
      error_supp_mid: 5.00
      error_high_usd: 20.00
      error_mid_usd: 5.00
      carried_supp_long: 10.00
      carried_supp_mid: 5.00
      carried_long_days: 21
      carried_mid_days: 7
      repeat_supp_high: 10.00
      repeat_supp_one: 5.00
      repeat_high_count: 2
    rule: >
      This policy settles the energy line of the most recent bill on a residential gas agreement, the energy line whose billing period starts latest, when that line was billed above the rate the plan allows for its cycle.
      It applies only when that line's cycle began on or after the agreement's most recent plan change date, or its service start date when it has none, so that the plan in force today is the plan the line was billed under; when the most recent variable rate change notice on the agreement took effect on or before that cycle's billing period start and was issued at least variable_rate_notice_days calendar days before its effective date; when no regulatory pass-through notice stands on the agreement; and, on a month-to-month variable plan, when the cycle is past the plan's introductory cycles and is not a cycle held at the expiring rate after a late-notice rollover.
      A line outside that scope keeps the allowed rate the gas supply billing, variable rate, rollover and regulatory pass-through rules give it and is corrected under the base gas billing correction rule, without the supplements of this policy.
      The correct amount of that energy line is its billed therms multiplied by the agreement's contract rate, rounded half up to the cent, and the latest-bill over-billed amount is the line's billed amount minus that correct amount when the difference is above zero, and nothing otherwise, and that over-billed amount is what the latest-bill rebill credit returns.
      The rate the plan allows for the line's cycle depends on the plan's pricing structure: on a capped variable plan it is the lower of the variable rate in force for the cycle and the contract rate, which is the plan's ceiling; on a month-to-month variable plan it is the variable rate in force for the cycle; on a fixed plan it is the contract rate; the correct amount is the billed therms multiplied by that allowed rate, rounded half up to the cent.
      The variable rate in force for the cycle is the new rate of the most recent variable rate change notice on the agreement, which within this policy's scope took effect on or before the cycle's billing period start after timely notice.
      The billing-error supplement depends on the latest-bill over-billed amount: error_supp_high when it is error_high_usd or more, error_supp_mid when it is error_mid_usd or more but below error_high_usd, and no supplement when it is below error_mid_usd.
      The carried-charge supplement depends on the calendar days from the disputed line's posting date to the day the credit is posted: carried_supp_long when they are carried_long_days or more, carried_supp_mid when they are at least carried_mid_days but fewer than carried_long_days, and no supplement when they are fewer than carried_mid_days.
      The repeat-error supplement depends on the rebill credits already standing on the agreement before this one: repeat_supp_high when there are repeat_high_count or more, repeat_supp_one when there is exactly one, and no supplement when there are none.
      The latest-bill rebill credit is the over-billed amount plus the billing-error supplement, the carried-charge supplement and the repeat-error supplement, rounded half up to the cent, and it is posted as one negative rebill credit tied to the disputed line on the bill of that line's billing cycle.
      Supplements are added only to a line whose over-billed amount is above zero; a line billed at or below the allowed rate earns no credit.
      The over-billed amount before any supplement is what is compared with agent_adjustment_limit_usd; when it is above that limit the correction is opened as a gas billing dispute for review instead of being posted.
    prerequisite: []
    cross_category: []
    compute:
      - lt_therms: "LATEST('gas_billing', 'usage_therms', date_field='billing_period_start', line_type='energy_charge')"
      - var_rate: "LATEST('gas_notices', 'new_rate_usd_therm', date_field='effective_date', notice_type='variable_rate_change')"
      - allowed_rate: "MN(var_rate, F('contract_rate_usd_therm')) if P('rate_type') == 'capped_variable' else (var_rate if P('rate_type') == 'variable' else F('contract_rate_usd_therm'))"
      - lt_amount: "LATEST('gas_billing', 'amount_usd', date_field='billing_period_start', line_type='energy_charge')"
      - over_billed: "MX(0, lt_amount - int(lt_therms * allowed_rate * 100 + 0.5 + 1e-9) / 100)"
      - error_supp: "K('error_supp_high') if over_billed >= K('error_high_usd') else (K('error_supp_mid') if over_billed >= K('error_mid_usd') else 0)"
      - lt_posted: "LATEST('gas_billing', 'posted_date', date_field='billing_period_start', line_type='energy_charge')"
      - carried_days: "DAYS(lt_posted, NOW)"
      - carried_supp: "K('carried_supp_long') if carried_days >= K('carried_long_days') else (K('carried_supp_mid') if carried_days >= K('carried_mid_days') else 0)"
      - prior_rebills: "COUNT('gas_billing', line_type='rebill_credit')"
      - repeat_supp: "K('repeat_supp_high') if prior_rebills >= K('repeat_high_count') else (K('repeat_supp_one') if prior_rebills == 1 else 0)"
      - result: "int((over_billed + error_supp + carried_supp + repeat_supp) * 100 + 0.5 + 1e-9) / 100 if over_billed > 0.000001 else 0"
    compute_basis:
      lt_therms: "This policy settles the energy line of the most recent bill on a residential gas agreement, the energy line whose billing period starts latest, when that line was billed above the rate the plan allows for its cycle."
      var_rate: "The variable rate in force for the cycle is the new rate of the most recent variable rate change notice on the agreement, which within this policy's scope took effect on or before the cycle's billing period start after timely notice."
      allowed_rate: "on a capped variable plan it is the lower of the variable rate in force for the cycle and the contract rate, which is the plan's ceiling; on a month-to-month variable plan it is the variable rate in force for the cycle; on a fixed plan it is the contract rate"
      lt_amount: "the latest-bill over-billed amount is the line's billed amount minus that correct amount when the difference is above zero, and nothing otherwise, and that over-billed amount is what the latest-bill rebill credit returns."
      over_billed: "the correct amount is the billed therms multiplied by that allowed rate, rounded half up to the cent."
      error_supp: "The billing-error supplement depends on the latest-bill over-billed amount: error_supp_high when it is error_high_usd or more, error_supp_mid when it is error_mid_usd or more but below error_high_usd, and no supplement when it is below error_mid_usd."
      lt_posted: "The carried-charge supplement depends on the calendar days from the disputed line's posting date to the day the credit is posted"
      carried_days: "The carried-charge supplement depends on the calendar days from the disputed line's posting date to the day the credit is posted"
      carried_supp: "carried_supp_long when they are carried_long_days or more, carried_supp_mid when they are at least carried_mid_days but fewer than carried_long_days, and no supplement when they are fewer than carried_mid_days."
      prior_rebills: "The repeat-error supplement depends on the rebill credits already standing on the agreement before this one"
      repeat_supp: "repeat_supp_high when there are repeat_high_count or more, repeat_supp_one when there is exactly one, and no supplement when there are none."
      result: "Supplements are added only to a line whose over-billed amount is above zero; a line billed at or below the allowed rate earns no credit."
    factors:
      - id: allowed_rate_basis
        effect: method
        decides: allowed_rate
        bindings: [lt_therms, var_rate, allowed_rate]
        ladder:
          - when: "the agreement is on a capped variable plan"
            method: "the allowed rate is the lower of the variable rate in force for the cycle and the contract rate (the ceiling)"
          - when: "the agreement is on a month-to-month variable plan"
            method: "the allowed rate is the variable rate in force for the cycle"
          - when: "otherwise (a fixed plan)"
            method: "the allowed rate is the contract rate"
        baseline:
          allowed_rate: "F('contract_rate_usd_therm')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: billing_error_supplement
        effect: parameter
        decides: error_supp
        bindings: [lt_amount, over_billed, error_supp]
        ladder:
          - when: "the latest-bill over-billed amount is error_high_usd or more"
            value: "K('error_supp_high')"
          - when: "it is error_mid_usd or more but below error_high_usd"
            value: "K('error_supp_mid')"
          - when: "otherwise (below error_mid_usd)"
            value: "0"
        baseline:
          error_supp: "0"
        evidence: [history]
        cross_difficulty: null
      - id: carried_charge_supplement
        effect: parameter
        decides: carried_supp
        bindings: [lt_posted, carried_days, carried_supp]
        ladder:
          - when: "the disputed line was posted carried_long_days or more calendar days before the credit"
            value: "K('carried_supp_long')"
          - when: "it was posted at least carried_mid_days but fewer than carried_long_days days before"
            value: "K('carried_supp_mid')"
          - when: "otherwise (fewer than carried_mid_days days)"
            value: "0"
        baseline:
          carried_supp: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: repeat_error_supplement
        effect: parameter
        decides: repeat_supp
        bindings: [prior_rebills, repeat_supp]
        ladder:
          - when: "repeat_high_count or more rebill credits already stand on the agreement"
            value: "K('repeat_supp_high')"
          - when: "exactly one rebill credit already stands on the agreement"
            value: "K('repeat_supp_one')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          repeat_supp: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The correct amount of that energy line is its billed therms multiplied by the agreement's contract rate, rounded half up to the cent, and the latest-bill over-billed amount is the line's billed amount minus that correct amount when the difference is above zero, and nothing otherwise, and that over-billed amount is what the latest-bill rebill credit returns.
      params: []
    inputs:
      history:
        - {table: gas_billing, aggregate: latest, field: amount_usd, filters: {line_type: energy_charge}}
        - {table: gas_notices, aggregate: latest, field: new_rate_usd_therm, filters: {notice_type: variable_rate_change}}
        - {table: gas_billing, aggregate: count, field: gas_billing_id, filters: {line_type: rebill_credit}}
      cross_category: []

  - id: gas_ext_signup_credit
    base_policy_refs: [gas_signup_credit, gas_renewal]
    overwrite:
      - base_policy: gas_signup_credit
        superseded_clause: >-
          A gas plan with signup_credit_usd above 0.00 earns one signup_credit once the agreement's completed cycles (gas_msr_completed_cycles) reach signup_credit_after_cycles, posted on the bill of the next cycle.
        replaced_by: >-
          The sign-up credit owed is the online-adjusted plan amount plus the late-posting supplement, the retention supplement and the usage supplement, rounded half up to the cent, posted once as a negative sign-up credit on the bill of the billing cycle that starts the day after the latest billed cycle ends.
    trigger: state_due
    subject: [gas_credit]
    computes: credit_amount_usd
    target_tool: post_gas_signup_credit_32aac0cb
    params:
      online_fast_days: 30
      online_fast_factor: 1.25
      online_slow_bonus: 5.00
      late_supp_long: 10.00
      late_supp_mid: 5.00
      late_long_days: 540
      late_mid_days: 180
      retained_min_days: 30
      retained_long_months: 24
      retained_supp_long: 10.00
      retained_supp_short: 5.00
      usage_supp_high: 10.00
      usage_supp_mid: 5.00
      usage_high_therms: 1500
      usage_mid_therms: 750
    rule: >
      This policy settles a sign-up credit that an agreement still on the plan it was enrolled on earned once its completed billing cycles reached signup_credit_after_cycles, while the plan's signup_credit_usd is above 0.00, and that was never posted.
      The sign-up credit is the plan's signup_credit_usd, posted once as a negative sign-up credit.
      The online-adjusted plan amount depends on how the agreement was enrolled: when it was enrolled through the web channel and supply started no more than online_fast_days calendar days after the enrollment date, the plan amount is multiplied by online_fast_factor; when it was enrolled through the web channel and supply started more than online_fast_days calendar days after the enrollment date, online_slow_bonus is added to the plan amount; any other enrollment keeps the plan amount unchanged.
      The late-posting supplement depends on the calendar days from the service start date to the posting date: late_supp_long when they are late_long_days or more, late_supp_mid when they are at least late_mid_days but fewer than late_long_days, and no supplement when they are fewer than late_mid_days.
      The retention supplement depends on the agreement's most recent plan change date and term: retained_supp_long when that date is at least retained_min_days calendar days before the posting date and the term is retained_long_months months or more, retained_supp_short when that date is at least retained_min_days calendar days before the posting date and the term is above zero but below retained_long_months months, and no supplement when the agreement has no plan change date, the date is more recent than that, or the term is zero.
      The usage supplement depends on the therms billed on all energy lines of the agreement since service start: usage_supp_high when they total usage_high_therms or more, usage_supp_mid when they total usage_mid_therms or more but below usage_high_therms, and no supplement below usage_mid_therms.
      The sign-up credit owed is the online-adjusted plan amount plus the late-posting supplement, the retention supplement and the usage supplement, rounded half up to the cent, posted once as a negative sign-up credit on the bill of the billing cycle that starts the day after the latest billed cycle ends.
      The sign-up credit is posted only while the agreement is active or drop pending and never more than once per agreement.
    prerequisite: []
    cross_category: []
    compute:
      - plan_amount: "P('signup_credit_usd')"
      - switch_days: "DAYS(F('enrollment_date'), F('service_start_date'))"
      - online_amount: "plan_amount * K('online_fast_factor') if (F('enrollment_channel') == 'web' and switch_days <= K('online_fast_days')) else (plan_amount + K('online_slow_bonus') if (F('enrollment_channel') == 'web' and switch_days > K('online_fast_days')) else plan_amount)"
      - supply_days: "DAYS(F('service_start_date'), NOW)"
      - late_supp: "K('late_supp_long') if supply_days >= K('late_long_days') else (K('late_supp_mid') if supply_days >= K('late_mid_days') else 0)"
      - retained_days: "DAYS(F('plan_change_date'), NOW) if F('plan_change_date') else 0"
      - retained_supp: "K('retained_supp_long') if (retained_days >= K('retained_min_days') and F('term_months') >= K('retained_long_months')) else (K('retained_supp_short') if (retained_days >= K('retained_min_days') and F('term_months') > 0 and F('term_months') < K('retained_long_months')) else 0)"
      - lifetime_therms: "SUM('gas_billing', 'usage_therms', line_type='energy_charge')"
      - usage_supp: "K('usage_supp_high') if lifetime_therms >= K('usage_high_therms') else (K('usage_supp_mid') if lifetime_therms >= K('usage_mid_therms') else 0)"
      - result: "int((online_amount + late_supp + retained_supp + usage_supp) * 100 + 0.5 + 1e-9) / 100"
    compute_basis:
      plan_amount: "The sign-up credit is the plan's signup_credit_usd, posted once as a negative sign-up credit."
      switch_days: "when it was enrolled through the web channel and supply started no more than online_fast_days calendar days after the enrollment date"
      online_amount: "when it was enrolled through the web channel and supply started no more than online_fast_days calendar days after the enrollment date, the plan amount is multiplied by online_fast_factor; when it was enrolled through the web channel and supply started more than online_fast_days calendar days after the enrollment date, online_slow_bonus is added to the plan amount; any other enrollment keeps the plan amount unchanged."
      supply_days: "The late-posting supplement depends on the calendar days from the service start date to the posting date"
      late_supp: "late_supp_long when they are late_long_days or more, late_supp_mid when they are at least late_mid_days but fewer than late_long_days, and no supplement when they are fewer than late_mid_days."
      retained_days: "The retention supplement depends on the agreement's most recent plan change date and term"
      retained_supp: "retained_supp_long when that date is at least retained_min_days calendar days before the posting date and the term is retained_long_months months or more, retained_supp_short when that date is at least retained_min_days calendar days before the posting date and the term is above zero but below retained_long_months months, and no supplement when the agreement has no plan change date, the date is more recent than that, or the term is zero."
      lifetime_therms: "The usage supplement depends on the therms billed on all energy lines of the agreement since service start"
      usage_supp: "usage_supp_high when they total usage_high_therms or more, usage_supp_mid when they total usage_mid_therms or more but below usage_high_therms, and no supplement below usage_mid_therms."
      result: "The sign-up credit owed is the online-adjusted plan amount plus the late-posting supplement, the retention supplement and the usage supplement, rounded half up to the cent, posted once as a negative sign-up credit on the bill of the billing cycle that starts the day after the latest billed cycle ends."
    factors:
      - id: online_enrollment
        effect: method
        decides: online_amount
        bindings: [switch_days, online_amount]
        ladder:
          - when: "enrolled through the web channel and supply started no more than online_fast_days days after enrollment"
            method: "the plan amount is multiplied by online_fast_factor"
          - when: "enrolled through the web channel and supply started more than online_fast_days days after enrollment"
            method: "online_slow_bonus is added to the plan amount"
          - when: "otherwise (phone or mail enrollment)"
            method: "the plan amount is kept unchanged"
        baseline:
          online_amount: "plan_amount"
        evidence: [date]
        cross_difficulty: null
      - id: late_posting
        effect: parameter
        decides: late_supp
        bindings: [supply_days, late_supp]
        ladder:
          - when: "service started late_long_days or more calendar days before the posting date"
            value: "K('late_supp_long')"
          - when: "it started at least late_mid_days but fewer than late_long_days days before"
            value: "K('late_supp_mid')"
          - when: "otherwise (fewer than late_mid_days days)"
            value: "0"
        baseline:
          late_supp: "0"
        evidence: [date]
        cross_difficulty: null
      - id: retention
        effect: parameter
        decides: retained_supp
        bindings: [retained_days, retained_supp]
        ladder:
          - when: "the latest plan change date is at least retained_min_days days before posting and the term is retained_long_months months or more"
            value: "K('retained_supp_long')"
          - when: "the latest plan change date is at least retained_min_days days before posting and the term is above zero but below retained_long_months months"
            value: "K('retained_supp_short')"
          - when: "otherwise"
            value: "0"
        baseline:
          retained_supp: "0"
        evidence: [date]
        cross_difficulty: null
      - id: lifetime_usage
        effect: parameter
        decides: usage_supp
        bindings: [lifetime_therms, usage_supp]
        ladder:
          - when: "the energy lines since service start bill usage_high_therms therms or more"
            value: "K('usage_supp_high')"
          - when: "they bill usage_mid_therms therms or more but below usage_high_therms"
            value: "K('usage_supp_mid')"
          - when: "otherwise (below usage_mid_therms)"
            value: "0"
        baseline:
          usage_supp: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The sign-up credit is the plan's signup_credit_usd, posted once as a negative sign-up credit.
      params: [signup_credit_usd]
    inputs:
      history:
        - {table: gas_billing, aggregate: sum, field: usage_therms, filters: {line_type: energy_charge}}
      cross_category: []

  - id: gas_ext_renewal_loyalty_credit
    base_policy_refs: [gas_renewal, gas_signup_credit]
    overwrite:
      - base_policy: gas_renewal
        superseded_clause: >-
          Each renewal earns one renewal_loyalty_credit equal to the renewal_loyalty_credit_usd of the plan renewed into, posted on the first bill of the new term; plans with 0.00 earn none.
        replaced_by: >-
          The renewal loyalty credit owed is the tenure-adjusted plan amount plus the late-posting supplement, the repeat-renewal supplement, the home protection supplement and the winter peak supplement, rounded half up to the cent, posted once as a negative renewal loyalty credit on the bill of the cycle that starts on the renewal's plan change date.
    trigger: state_due
    subject: [gas_credit]
    computes: credit_amount_usd
    target_tool: post_gas_loyalty_credit_c1183f95
    params:
      loyal_mult_long: 2.0
      loyal_mult_mid: 1.5
      loyal_tenure_long_days: 1095
      loyal_tenure_mid_days: 730
      loyal_late_per_month: 2.00
      loyal_late_flat: 5.00
      loyal_late_accrue_months: 9
      loyal_late_flat_months: 3
      repeat_supp_many: 10.00
      repeat_supp_one: 5.00
      repeat_many_count: 2
      protect_supp_gas: 5.00
      protect_supp_other: 2.50
      lpeak_supp_high: 5.00
      lpeak_supp_mid: 2.50
      lpeak_high_therms: 170
      lpeak_mid_therms: 110
    rule: >
      This policy settles the renewal loyalty credit of a renewal that has already taken effect on an active agreement, where the agreement's plan change date records the start of the renewed term on the plan in force, the plan's renewal_loyalty_credit_usd is above 0.00, at least one energy line of the renewed term has already been billed, and no renewal loyalty credit stands on the agreement for that term; the credit of a renewed term not yet billed arrives with that term's first bill and is not settled by this policy.
      The renewal loyalty credit is the renewal_loyalty_credit_usd of the plan in force, posted once as a negative renewal loyalty credit.
      The loyalty tenure multiplier depends on the calendar days from the service start date to the renewal's plan change date: loyal_mult_long when they are loyal_tenure_long_days or more, loyal_mult_mid when they are at least loyal_tenure_mid_days but fewer than loyal_tenure_long_days, and 1, the plan amount unchanged, when they are fewer than loyal_tenure_mid_days, as they are for a customer renewing for the first time out of a twelve-month term; the tenure-adjusted plan amount is the plan amount times that multiplier.
      The late-posting supplement of a loyalty credit depends on the whole calendar months from the renewal's plan change date to the posting date: when there are loyal_late_accrue_months or more, it accrues loyal_late_per_month for each of those whole months; when there are at least loyal_late_flat_months but fewer than loyal_late_accrue_months, it is the flat amount loyal_late_flat; when there are fewer than loyal_late_flat_months, there is no supplement.
      The repeat-renewal supplement depends on the renewal loyalty credits already standing on the agreement for earlier renewals: repeat_supp_many when there are repeat_many_count or more, repeat_supp_one when there is exactly one, and no supplement when there are none.
      The home protection supplement depends on the customer's Beacon Ridge home protection plan at the agreement's premise: protect_supp_gas when the plan is active and is Beacon Ridge Gas Line Guard, Beacon Ridge HVAC Repair Plan, Beacon Ridge HVAC Complete or Beacon Ridge Whole Home Shield, protect_supp_other when the plan is active and is any other protection plan, and no supplement when there is no active protection plan at that premise.
      The winter peak supplement depends on the largest usage in therms billed on any single energy line of the agreement: lpeak_supp_high when it is lpeak_high_therms or more, lpeak_supp_mid when it is lpeak_mid_therms or more but below lpeak_high_therms, and no supplement below lpeak_mid_therms.
      The renewal loyalty credit owed is the tenure-adjusted plan amount plus the late-posting supplement, the repeat-renewal supplement, the home protection supplement and the winter peak supplement, rounded half up to the cent, posted once as a negative renewal loyalty credit on the bill of the cycle that starts on the renewal's plan change date.
      Gas bill credits are posted only while the agreement is active or drop pending, and a loyalty credit is never posted for a plan change or a rollover.
    prerequisite: []
    cross_category:
      - category: protect
        as: branch
        reads: [status, variant_name, premise_id]
        note: The home protection supplement reads the status and plan name of the customer's home protection plan at the agreement's premise.
    compute:
      - plan_amount: "P('renewal_loyalty_credit_usd')"
      - tenure_days: "DAYS(F('service_start_date'), F('plan_change_date'))"
      - tenure_mult: "K('loyal_mult_long') if tenure_days >= K('loyal_tenure_long_days') else (K('loyal_mult_mid') if tenure_days >= K('loyal_tenure_mid_days') else 1)"
      - tenure_amount: "plan_amount * tenure_mult"
      - late_months: "MONTHS(F('plan_change_date'), NOW)"
      - late_supp: "late_months * K('loyal_late_per_month') if late_months >= K('loyal_late_accrue_months') else (K('loyal_late_flat') if late_months >= K('loyal_late_flat_months') else 0)"
      - prior_loyalty: "COUNT('gas_billing', line_type='renewal_loyalty_credit')"
      - repeat_supp: "K('repeat_supp_many') if prior_loyalty >= K('repeat_many_count') else (K('repeat_supp_one') if prior_loyalty == 1 else 0)"
      - prot_status: "CFIELD('protect', 'status', premise_id=F('premise_id'))"
      - prot_plan: "CFIELD('protect', 'variant_name', premise_id=F('premise_id'))"
      - protect_supp: "K('protect_supp_gas') if (prot_status == 'active' and (prot_plan == 'Beacon Ridge Gas Line Guard' or prot_plan == 'Beacon Ridge HVAC Repair Plan' or prot_plan == 'Beacon Ridge HVAC Complete' or prot_plan == 'Beacon Ridge Whole Home Shield')) else (K('protect_supp_other') if (prot_status == 'active' and prot_plan != 'Beacon Ridge Gas Line Guard' and prot_plan != 'Beacon Ridge HVAC Repair Plan' and prot_plan != 'Beacon Ridge HVAC Complete' and prot_plan != 'Beacon Ridge Whole Home Shield') else 0)"
      - peak_therms: "MAX('gas_billing', 'usage_therms', line_type='energy_charge')"
      - peak_supp: "K('lpeak_supp_high') if peak_therms >= K('lpeak_high_therms') else (K('lpeak_supp_mid') if peak_therms >= K('lpeak_mid_therms') else 0)"
      - result: "int((tenure_amount + late_supp + repeat_supp + protect_supp + peak_supp) * 100 + 0.5 + 1e-9) / 100"
    compute_basis:
      plan_amount: "The renewal loyalty credit is the renewal_loyalty_credit_usd of the plan in force, posted once as a negative renewal loyalty credit."
      tenure_days: "The loyalty tenure multiplier depends on the calendar days from the service start date to the renewal's plan change date"
      tenure_mult: "loyal_mult_long when they are loyal_tenure_long_days or more, loyal_mult_mid when they are at least loyal_tenure_mid_days but fewer than loyal_tenure_long_days, and 1, the plan amount unchanged, when they are fewer than loyal_tenure_mid_days"
      tenure_amount: "the tenure-adjusted plan amount is the plan amount times that multiplier."
      late_months: "The late-posting supplement of a loyalty credit depends on the whole calendar months from the renewal's plan change date to the posting date"
      late_supp: "when there are loyal_late_accrue_months or more, it accrues loyal_late_per_month for each of those whole months; when there are at least loyal_late_flat_months but fewer than loyal_late_accrue_months, it is the flat amount loyal_late_flat; when there are fewer than loyal_late_flat_months, there is no supplement."
      prior_loyalty: "The repeat-renewal supplement depends on the renewal loyalty credits already standing on the agreement for earlier renewals"
      repeat_supp: "repeat_supp_many when there are repeat_many_count or more, repeat_supp_one when there is exactly one, and no supplement when there are none."
      prot_status: "The home protection supplement depends on the customer's Beacon Ridge home protection plan at the agreement's premise"
      prot_plan: "The home protection supplement depends on the customer's Beacon Ridge home protection plan at the agreement's premise"
      protect_supp: "protect_supp_gas when the plan is active and is Beacon Ridge Gas Line Guard, Beacon Ridge HVAC Repair Plan, Beacon Ridge HVAC Complete or Beacon Ridge Whole Home Shield, protect_supp_other when the plan is active and is any other protection plan, and no supplement when there is no active protection plan at that premise."
      peak_therms: "The winter peak supplement depends on the largest usage in therms billed on any single energy line of the agreement"
      peak_supp: "lpeak_supp_high when it is lpeak_high_therms or more, lpeak_supp_mid when it is lpeak_mid_therms or more but below lpeak_high_therms, and no supplement below lpeak_mid_therms."
      result: "The renewal loyalty credit owed is the tenure-adjusted plan amount plus the late-posting supplement, the repeat-renewal supplement, the home protection supplement and the winter peak supplement, rounded half up to the cent, posted once as a negative renewal loyalty credit on the bill of the cycle that starts on the renewal's plan change date."
    factors:
      - id: loyalty_tenure
        effect: parameter
        decides: tenure_mult
        bindings: [tenure_days, tenure_mult]
        ladder:
          - when: "service started loyal_tenure_long_days or more calendar days before the renewal took effect"
            value: "K('loyal_mult_long')"
          - when: "service started at least loyal_tenure_mid_days but fewer than loyal_tenure_long_days days before the renewal took effect"
            value: "K('loyal_mult_mid')"
          - when: "otherwise (fewer than loyal_tenure_mid_days days, as for a first renewal out of a twelve-month term)"
            value: "1"
        baseline:
          tenure_mult: "1"
        evidence: [date]
        cross_difficulty: null
      - id: loyalty_late_posting
        effect: method
        decides: late_supp
        bindings: [late_months, late_supp]
        ladder:
          - when: "loyal_late_accrue_months or more whole months have passed since the renewal took effect"
            method: "the supplement accrues loyal_late_per_month for each whole month since the renewal took effect"
          - when: "at least loyal_late_flat_months but fewer than loyal_late_accrue_months whole months have passed"
            method: "the supplement is the flat amount loyal_late_flat"
          - when: "otherwise (fewer than loyal_late_flat_months whole months)"
            method: "no supplement is added"
        baseline:
          late_supp: "0"
        evidence: [date]
        cross_difficulty: null
      - id: repeat_renewal
        effect: parameter
        decides: repeat_supp
        bindings: [prior_loyalty, repeat_supp]
        ladder:
          - when: "repeat_many_count or more renewal loyalty credits for earlier renewals already stand on the agreement"
            value: "K('repeat_supp_many')"
          - when: "exactly one such credit already stands"
            value: "K('repeat_supp_one')"
          - when: "otherwise (none, a first renewal)"
            value: "0"
        baseline:
          repeat_supp: "0"
        evidence: [history]
        cross_difficulty: null
      - id: home_protection
        effect: parameter
        decides: protect_supp
        bindings: [prot_status, prot_plan, protect_supp]
        ladder:
          - when: "the customer's home protection plan at the premise is active and is Gas Line Guard, HVAC Repair Plan, HVAC Complete or Whole Home Shield"
            value: "K('protect_supp_gas')"
          - when: "that plan is active and is any other protection plan"
            value: "K('protect_supp_other')"
          - when: "otherwise (no active protection plan at the premise)"
            value: "0"
        baseline:
          protect_supp: "0"
        evidence: [cross_category]
        cross_difficulty: protect
      - id: loyalty_winter_peak
        effect: parameter
        decides: peak_supp
        bindings: [peak_therms, peak_supp]
        ladder:
          - when: "for the loyalty credit, the largest therms billed on one energy line of the agreement reach lpeak_high_therms or more"
            value: "K('lpeak_supp_high')"
          - when: "they reach lpeak_mid_therms or more but stay below lpeak_high_therms"
            value: "K('lpeak_supp_mid')"
          - when: "otherwise (below lpeak_mid_therms)"
            value: "0"
        baseline:
          peak_supp: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The renewal loyalty credit is the renewal_loyalty_credit_usd of the plan in force, posted once as a negative renewal loyalty credit.
      params: [renewal_loyalty_credit_usd]
    inputs:
      history:
        - {table: gas_billing, aggregate: max, field: usage_therms, filters: {line_type: energy_charge}}
        - {table: gas_billing, aggregate: count, field: gas_billing_id, filters: {line_type: renewal_loyalty_credit}}
      cross_category: [protect]

  - id: gas_ext_renewal_rate
    base_policy_refs: [gas_renewal, gas_expiry_notices, gas_supply_billing, gas_billing_correction, gas_signup_credit]
    overwrite:
      - base_policy: gas_expiry_notices
        superseded_clause: >-
          Each notice states the plan offered for renewal, the renewal rate and the month-to-month rate for the first cycle after expiry; when the two notices differ, the final_options_notice governs.
        replaced_by: >-
          When both expiration notices were on time and the final options notice states a higher renewal rate than the initial renewal notice, the renewal starting rate is the lower of the two stated rates; when the initial renewal notice was on time and the final options notice was not, the renewal starting rate is the initial renewal notice's rate; in every other case the renewal starting rate is the final options notice's rate.
      - base_policy: gas_renewal
        superseded_clause: >-
          A customer renews by accepting the offer in the governing gas renewal notice: the agreement takes the offered plan, its term_months and the offered renewal rate.
        replaced_by: >-
          A customer renews an agreement still in its term by accepting the renewal offer on or before the contract end date: the agreement takes the plan named in the notice whose rate is the renewal starting rate and that plan's term in months, at the renewal acceptance rate set by this policy.
    trigger: on_request
    subject: [gas_renew]
    computes: contract_rate_usd_therm
    target_tool: accept_gas_renewal_offer_6e431548
    params:
      since_disc_long: 0.0200
      since_disc_mid: 0.0100
      since_long_days: 1826
      since_mid_days: 1096
      early_disc_long: 0.0100
      early_disc_mid: 0.0050
      early_long_days: 30
      early_mid_days: 15
      heat_disc_high: 0.0120
      heat_disc_mid: 0.0060
      heat_high_therms: 900
      heat_mid_therms: 500
      share_high: 0.50
      share_mid: 0.25
      share_high_cycles: 10
      share_mid_cycles: 6
      fixed_cap_factor: 1.10
    rule: >
      A customer renews an agreement still in its term by accepting the renewal offer on or before the contract end date: the agreement takes the plan named in the notice whose rate is the renewal starting rate and that plan's term in months, at the renewal acceptance rate set by this policy.
      The renewed term starts on the day after the current contract end date and ends on the day before the same calendar day the renewed plan's term in months after that start, using the last day of the month when that calendar day does not exist.
      The renewal acceptance rate is the renewal rate stated in the final options notice on the agreement, carried at four decimal places.
      The renewal acceptance rate is fixed only after the energy line of the most recent bill, when it was billed above the rate the plan allows for its cycle, carries its rebill credit.
      The renewal acceptance rate is not fixed until the agreement carries the sign-up credit that its completed billing cycles earned under its plan.
      The renewal acceptance rate is not worked out before every renewal that has taken effect on the agreement carries its renewal loyalty credit.
      An expiration notice is on time when the initial renewal notice is dated between renewal_notice_earliest_days and renewal_notice_latest_days calendar days, both included, before the contract end date it names, and when the final options notice is dated at least final_options_notice_latest_days calendar days before that date and later than the initial renewal notice.
      When both expiration notices were on time and the final options notice states a higher renewal rate than the initial renewal notice, the renewal starting rate is the lower of the two stated rates; when the initial renewal notice was on time and the final options notice was not, the renewal starting rate is the initial renewal notice's rate; in every other case the renewal starting rate is the final options notice's rate.
      The long-relationship reduction depends on the calendar days to the acceptance date from the gas agreement's service start date and from the service start date of the customer's Beacon Ridge residential electricity agreement: since_disc_long per therm when either span is since_long_days or more, since_disc_mid per therm when neither span reaches since_long_days and either span is since_mid_days or more, and no reduction when both spans are below since_mid_days.
      The early-acceptance reduction depends on the calendar days from the acceptance date to the current contract end date: early_disc_long per therm when they are early_long_days or more, early_disc_mid per therm when they are at least early_mid_days but fewer than early_long_days, and no reduction when they are fewer than early_mid_days.
      The heating-household reduction depends on the therms billed on energy lines of cycles starting later than the same calendar day twelve months before the acceptance date: heat_disc_high per therm when they total heat_high_therms or more, heat_disc_mid per therm when they total heat_mid_therms or more but below heat_high_therms, and no reduction below heat_mid_therms.
      The reduced renewal rate is the renewal starting rate minus the long-relationship, early-acceptance and heating-household reductions, each taken per therm from that one starting rate.
      The net supply cost per therm is the total of every bill line amount on the agreement, whatever its kind (energy charges, service fees, rebill credits, sign-up credits, renewal loyalty credits or any other line that carries a billing period), whose billing period starts later than the same calendar day twelve months before the acceptance date, divided by the therms of the energy lines of those cycles and rounded half up to four decimal places; when no energy line falls in that window, the net supply cost per therm is the contract rate.
      The renewal cushion share depends on how many energy lines were billed for cycles starting later than the same calendar day twelve months before the acceptance date: share_high when there are share_high_cycles or more, share_mid when there are at least share_mid_cycles but fewer than share_high_cycles, and zero when there are fewer than share_mid_cycles.
      When the agreement is on a capped variable plan and the reduced renewal rate is above the net supply cost per therm, the renewal cushion takes away the renewal cushion share of the amount by which the reduced renewal rate exceeds the net supply cost per therm, rounded half up to four decimal places; when the agreement is on a fixed plan and the reduced renewal rate is above the contract rate multiplied by fixed_cap_factor and rounded half up to four decimal places, the reduced renewal rate is lowered to that product; in every other case the reduced renewal rate stands.
      The renewal acceptance rate is the reduced renewal rate after the renewal cushion, rounded half up to four decimal places once at the end.
      A renewal is accepted only on an active agreement, and its own renewal loyalty credit arrives with the first bill of the renewed term.
    prerequisite:
      - problem: gas_ext_latest_bill_rebill_credit
        kind: value_input
        gate: ref_cost
        form: state
        policy_source: >-
          The renewal acceptance rate is fixed only after the energy line of the most recent bill, when it was billed above the rate the plan allows for its cycle, carries its rebill credit.
        condition: >-
          When the energy line with the latest billing period start was billed above the rate its plan allows for that cycle, a rebill credit whose source line is that energy line stands on the agreement.
        resolved_by: post_gas_rebill_credit_0e7c2434
        effect: >-
          The rebill credit adds a negative amount with the corrected line's billing period start into the twelve-month window, lowering the net supply cost per therm and so the cushion the renewal acceptance rate is measured against.
      - problem: gas_ext_signup_credit
        kind: value_input
        gate: ref_cost
        form: state
        policy_source: >-
          The renewal acceptance rate is not fixed until the agreement carries the sign-up credit that its completed billing cycles earned under its plan.
        condition: >-
          On an agreement still on its enrolled plan whose completed billing cycles reached the plan's sign-up qualification count while the plan pays a sign-up credit, a sign-up credit line stands on the agreement.
        resolved_by: post_gas_signup_credit_32aac0cb
        effect: >-
          The sign-up credit adds a negative amount on the bill of the current cycle into the twelve-month window, lowering the net supply cost per therm used by the renewal cushion.
      - problem: gas_ext_renewal_loyalty_credit
        kind: value_input
        gate: ref_cost
        form: state
        policy_source: >-
          The renewal acceptance rate is not worked out before every renewal that has taken effect on the agreement carries its renewal loyalty credit.
        condition: >-
          For every renewal that has taken effect on the agreement on a plan paying a loyalty credit, the latest one being the renewed term recorded by the plan change date, a renewal loyalty credit line stands on the agreement.
        resolved_by: post_gas_loyalty_credit_c1183f95
        effect: >-
          The loyalty credit adds a negative amount on the bill of the cycle that starts on the plan change date, inside the twelve-month window, lowering the net supply cost per therm used by the renewal cushion.
    cross_category:
      - category: power
        as: branch
        reads: [service_start_date]
        note: The long-relationship reduction reads the service start date of the customer's residential electricity agreement.
    compute:
      - ini_rate: "LATEST('gas_notices', 'new_rate_usd_therm', date_field='notice_date', notice_type='initial_renewal_notice')"
      - ini_date: "LATEST('gas_notices', 'notice_date', date_field='notice_date', notice_type='initial_renewal_notice')"
      - ini_end: "LATEST('gas_notices', 'effective_date', date_field='notice_date', notice_type='initial_renewal_notice')"
      - fin_rate: "LATEST('gas_notices', 'new_rate_usd_therm', date_field='notice_date', notice_type='final_options_notice')"
      - fin_date: "LATEST('gas_notices', 'notice_date', date_field='notice_date', notice_type='final_options_notice')"
      - fin_end: "LATEST('gas_notices', 'effective_date', date_field='notice_date', notice_type='final_options_notice')"
      - ini_ok: "DAYS(ini_date, ini_end) <= P('renewal_notice_earliest_days') and DAYS(ini_date, ini_end) >= P('renewal_notice_latest_days')"
      - fin_ok: "DAYS(fin_date, fin_end) >= P('final_options_notice_latest_days') and fin_date > ini_date"
      - start_rate: "MN(ini_rate, fin_rate) if (ini_ok and fin_ok and fin_rate > ini_rate) else (ini_rate if (ini_ok and not fin_ok) else fin_rate)"
      - gas_days: "DAYS(F('service_start_date'), NOW)"
      - pw_start: "CFIELD('power', 'service_start_date')"
      - pw_days: "DAYS(pw_start, NOW) if pw_start else 0"
      - since_disc: "K('since_disc_long') if (gas_days >= K('since_long_days') or pw_days >= K('since_long_days')) else (K('since_disc_mid') if ((gas_days >= K('since_mid_days') or pw_days >= K('since_mid_days')) and gas_days < K('since_long_days') and pw_days < K('since_long_days')) else 0)"
      - early_days: "DAYS(NOW, F('contract_end_date'))"
      - early_disc: "K('early_disc_long') if early_days >= K('early_long_days') else (K('early_disc_mid') if early_days >= K('early_mid_days') else 0)"
      - usage12: "SUM('gas_billing', 'usage_therms', within_months=12, date_field='billing_period_start', line_type='energy_charge')"
      - heat_disc: "K('heat_disc_high') if usage12 >= K('heat_high_therms') else (K('heat_disc_mid') if usage12 >= K('heat_mid_therms') else 0)"
      - reduced: "start_rate - since_disc - early_disc - heat_disc"
      - net_amount: "SUM('gas_billing', 'amount_usd', within_months=12, date_field='billing_period_start')"
      - ref_cost: "int(net_amount / usage12 * 10000 + 0.5 + 1e-9) / 10000 if usage12 > 0 else F('contract_rate_usd_therm')"
      - cycles12: "COUNT('gas_billing', within_months=12, date_field='billing_period_start', line_type='energy_charge')"
      - share: "K('share_high') if cycles12 >= K('share_high_cycles') else (K('share_mid') if cycles12 >= K('share_mid_cycles') else 0)"
      - cushioned: "int((reduced - share * (reduced - ref_cost)) * 10000 + 0.5 + 1e-9) / 10000 if (P('rate_type') == 'capped_variable' and reduced > ref_cost) else (int(F('contract_rate_usd_therm') * K('fixed_cap_factor') * 10000 + 0.5 + 1e-9) / 10000 if (P('rate_type') == 'fixed' and reduced > int(F('contract_rate_usd_therm') * K('fixed_cap_factor') * 10000 + 0.5 + 1e-9) / 10000) else reduced)"
      - result: "int((cushioned) * 10000 + 0.5 + 1e-9) / 10000"
    compute_basis:
      ini_rate: "When both expiration notices were on time and the final options notice states a higher renewal rate than the initial renewal notice, the renewal starting rate is the lower of the two stated rates"
      ini_date: "An expiration notice is on time when the initial renewal notice is dated between renewal_notice_earliest_days and renewal_notice_latest_days calendar days, both included, before the contract end date it names"
      ini_end: "An expiration notice is on time when the initial renewal notice is dated between renewal_notice_earliest_days and renewal_notice_latest_days calendar days, both included, before the contract end date it names"
      fin_rate: "The renewal acceptance rate is the renewal rate stated in the final options notice on the agreement, carried at four decimal places."
      fin_date: "when the final options notice is dated at least final_options_notice_latest_days calendar days before that date and later than the initial renewal notice."
      fin_end: "when the final options notice is dated at least final_options_notice_latest_days calendar days before that date and later than the initial renewal notice."
      ini_ok: "An expiration notice is on time when the initial renewal notice is dated between renewal_notice_earliest_days and renewal_notice_latest_days calendar days, both included, before the contract end date it names"
      fin_ok: "when the final options notice is dated at least final_options_notice_latest_days calendar days before that date and later than the initial renewal notice."
      start_rate: "When both expiration notices were on time and the final options notice states a higher renewal rate than the initial renewal notice, the renewal starting rate is the lower of the two stated rates; when the initial renewal notice was on time and the final options notice was not, the renewal starting rate is the initial renewal notice's rate; in every other case the renewal starting rate is the final options notice's rate."
      gas_days: "The long-relationship reduction depends on the calendar days to the acceptance date from the gas agreement's service start date and from the service start date of the customer's Beacon Ridge residential electricity agreement"
      pw_start: "The long-relationship reduction depends on the calendar days to the acceptance date from the gas agreement's service start date and from the service start date of the customer's Beacon Ridge residential electricity agreement"
      pw_days: "The long-relationship reduction depends on the calendar days to the acceptance date from the gas agreement's service start date and from the service start date of the customer's Beacon Ridge residential electricity agreement"
      since_disc: "since_disc_long per therm when either span is since_long_days or more, since_disc_mid per therm when neither span reaches since_long_days and either span is since_mid_days or more, and no reduction when both spans are below since_mid_days."
      early_days: "The early-acceptance reduction depends on the calendar days from the acceptance date to the current contract end date"
      early_disc: "early_disc_long per therm when they are early_long_days or more, early_disc_mid per therm when they are at least early_mid_days but fewer than early_long_days, and no reduction when they are fewer than early_mid_days."
      usage12: "The heating-household reduction depends on the therms billed on energy lines of cycles starting later than the same calendar day twelve months before the acceptance date"
      heat_disc: "heat_disc_high per therm when they total heat_high_therms or more, heat_disc_mid per therm when they total heat_mid_therms or more but below heat_high_therms, and no reduction below heat_mid_therms."
      reduced: "The reduced renewal rate is the renewal starting rate minus the long-relationship, early-acceptance and heating-household reductions, each taken per therm from that one starting rate."
      net_amount: "The net supply cost per therm is the total of every bill line amount on the agreement, whatever its kind (energy charges, service fees, rebill credits, sign-up credits, renewal loyalty credits or any other line that carries a billing period), whose billing period starts later than the same calendar day twelve months before the acceptance date"
      ref_cost: "divided by the therms of the energy lines of those cycles and rounded half up to four decimal places; when no energy line falls in that window, the net supply cost per therm is the contract rate."
      cycles12: "The renewal cushion share depends on how many energy lines were billed for cycles starting later than the same calendar day twelve months before the acceptance date"
      share: "share_high when there are share_high_cycles or more, share_mid when there are at least share_mid_cycles but fewer than share_high_cycles, and zero when there are fewer than share_mid_cycles."
      cushioned: "When the agreement is on a capped variable plan and the reduced renewal rate is above the net supply cost per therm, the renewal cushion takes away the renewal cushion share of the amount by which the reduced renewal rate exceeds the net supply cost per therm, rounded half up to four decimal places; when the agreement is on a fixed plan and the reduced renewal rate is above the contract rate multiplied by fixed_cap_factor and rounded half up to four decimal places, the reduced renewal rate is lowered to that product; in every other case the reduced renewal rate stands."
      result: "The renewal acceptance rate is the reduced renewal rate after the renewal cushion, rounded half up to four decimal places once at the end."
    factors:
      - id: offer_choice
        effect: method
        decides: start_rate
        bindings: [ini_rate, ini_date, ini_end, fin_date, fin_end, ini_ok, fin_ok, start_rate]
        ladder:
          - when: "both expiration notices were on time and the final options notice states a higher renewal rate than the initial renewal notice"
            method: "the renewal starting rate is the lower of the two stated rates"
          - when: "the initial renewal notice was on time and the final options notice was not"
            method: "the renewal starting rate is the initial renewal notice's rate"
          - when: "otherwise"
            method: "the renewal starting rate is the final options notice's rate"
        baseline:
          start_rate: "fin_rate"
        evidence: [history, date]
        cross_difficulty: null
      - id: long_relationship
        effect: parameter
        decides: since_disc
        bindings: [gas_days, pw_start, pw_days, since_disc]
        ladder:
          - when: "the gas service start or the electricity service start is since_long_days or more calendar days before acceptance"
            value: "K('since_disc_long')"
          - when: "neither span reaches since_long_days and the gas service start or the electricity service start is since_mid_days or more days before"
            value: "K('since_disc_mid')"
          - when: "otherwise (both spans below since_mid_days)"
            value: "0"
        baseline:
          since_disc: "0"
        evidence: [cross_category, date]
        cross_difficulty: power
      - id: early_acceptance
        effect: parameter
        decides: early_disc
        bindings: [early_days, early_disc]
        ladder:
          - when: "acceptance comes early_long_days or more calendar days before the contract end date"
            value: "K('early_disc_long')"
          - when: "it comes at least early_mid_days but fewer than early_long_days days before"
            value: "K('early_disc_mid')"
          - when: "otherwise (fewer than early_mid_days days)"
            value: "0"
        baseline:
          early_disc: "0"
        evidence: [date]
        cross_difficulty: null
      - id: renewal_cushion
        effect: method
        decides: cushioned
        bindings: [net_amount, ref_cost, cushioned]
        ladder:
          - when: "the agreement is on a capped variable plan and the reduced renewal rate is above the net supply cost per therm"
            method: "the renewal cushion share of the excess over the net supply cost per therm is taken away"
          - when: "the agreement is on a fixed plan and the reduced renewal rate is above the contract rate times fixed_cap_factor"
            method: "the reduced renewal rate is lowered to the contract rate times fixed_cap_factor"
          - when: "otherwise"
            method: "the reduced renewal rate stands"
        baseline:
          cushioned: "reduced"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: cushion_share
        effect: parameter
        decides: share
        bindings: [cycles12, share]
        ladder:
          - when: "share_high_cycles or more energy lines were billed for cycles starting in the last twelve months"
            value: "K('share_high')"
          - when: "at least share_mid_cycles but fewer than share_high_cycles such lines"
            value: "K('share_mid')"
          - when: "otherwise (fewer than share_mid_cycles)"
            value: "0"
        baseline:
          share: "0"
        evidence: [history]
        cross_difficulty: null
      - id: heating_household
        effect: parameter
        decides: heat_disc
        bindings: [usage12, heat_disc]
        ladder:
          - when: "the energy lines of cycles starting in the last twelve months bill heat_high_therms therms or more"
            value: "K('heat_disc_high')"
          - when: "they bill heat_mid_therms therms or more but below heat_high_therms"
            value: "K('heat_disc_mid')"
          - when: "otherwise (below heat_mid_therms)"
            value: "0"
        baseline:
          heat_disc: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The renewal acceptance rate is the renewal rate stated in the final options notice on the agreement, carried at four decimal places.
      params: []
    inputs:
      history:
        - {table: gas_notices, aggregate: latest, field: new_rate_usd_therm, filters: {notice_type: final_options_notice}}
        - {table: gas_billing, aggregate: sum, field: amount_usd, within_months: 12, filters: {}}
        - {table: gas_billing, aggregate: sum, field: usage_therms, within_months: 12, filters: {line_type: energy_charge}}
      cross_category: [power]
