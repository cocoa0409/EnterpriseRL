events:
  - type: bizpower_enroll
    target: bizpower_agreements
    mutation: create
    meaning: An authorized representative of the business enrolls one commercial site with Beacon Ridge and the enrollment is submitted to the utility.
    grain: One row per enrollment authorization for one site.
    fields:
      customer_id: The business customer.
      premise_id: The site being enrolled.
      variant_name: The official name of the plan enrolled.
      enrollment_date: Date the enrollment was authorized.
      enrollment_channel: Channel through which the enrollment was completed.
      term_months: Term copied from the plan.
      contract_rate_cents_kwh: Rate from the price offer valid on the enrollment date for this plan and the site's utility.
    triggers: []
  - type: bizpower_utility_confirm
    target: bizpower_agreements
    mutation: update
    meaning: The utility accepts the enrollment and issues its confirmation letter.
    grain: One row per transaction.
    fields:
      utility_confirmation_date: Date printed on the utility's confirmation letter.
    triggers: []
  - type: bizpower_activate
    target: bizpower_agreements
    mutation: {transition: {from: enrollment_pending, to: active}}
    meaning: Supply to the site begins on the switch meter read date.
    grain: One row per transaction.
    fields:
      service_start_date: The switch meter read date.
      contract_end_date: Last day of the term; empty for month-to-month.
    triggers: []
  - type: bizpower_reject
    target: bizpower_agreements
    mutation: {transition: {from: enrollment_pending, to: rejected}}
    meaning: The utility rejects the enrollment transaction.
    grain: One row per transaction.
    fields:
      reject_reason: The utility's rejection reason.
    triggers: []
  - type: bizpower_rescind
    target: bizpower_agreements
    mutation: {transition: {from: enrollment_pending, to: rescinded}}
    meaning: The business rescinds the enrollment before supply starts.
    grain: One row per transaction.
    fields:
      rescinded_date: Date the business asked to rescind.
    triggers: []
  - type: bizpower_cancel
    target: bizpower_agreements
    mutation: {transition: {from: active, to: drop_pending}}
    meaning: The business confirms cancellation and a drop is scheduled with the utility.
    grain: One row per transaction.
    fields:
      drop_requested_date: Date the business confirmed the cancellation.
      drop_reason: Why the business is cancelling.
      drop_effective_date: The site's next scheduled meter read date on the request date.
    triggers: []
  - type: bizpower_cancel_withdraw
    target: bizpower_agreements
    mutation: {transition: {from: drop_pending, to: active}}
    meaning: The business withdraws a pending cancellation before the drop takes effect.
    grain: One row per transaction.
    fields:
      drop_requested_date: Cleared to empty.
      drop_reason: Cleared to empty.
      drop_effective_date: Cleared to empty.
    triggers: []
  - type: bizpower_drop_complete
    target: bizpower_agreements
    mutation: {transition: {from: drop_pending, to: closed}}
    meaning: The utility completes the scheduled drop.
    grain: One row per transaction.
    fields:
      close_date: The meter read date on which supply ended.
      close_reason: Why supply ended.
    triggers: []
  - type: bizpower_switch_away
    target: bizpower_agreements
    mutation: {transition: {from: active, to: closed}}
    meaning: The utility ends Beacon Ridge supply because another supplier enrolled the site or the site was final-billed.
    grain: One row per transaction.
    fields:
      close_date: The meter read date on which supply ended.
      close_reason: Why supply ended.
    triggers: []
  - type: bizpower_renew
    target: bizpower_agreements
    mutation: update
    meaning: The business explicitly accepts the renewal offer and the agreement continues into a new term.
    grain: One row per transaction.
    fields:
      variant_name: The plan renewed into, as offered.
      term_months: Term of the renewed plan.
      contract_rate_cents_kwh: The renewal rate offered.
      contract_end_date: Last day of the new term.
      plan_change_date: Date the new term starts.
      renewal_election: Set to accepted.
      renewal_election_date: Date the business accepted.
      auto_renewed: Set to false because the term was explicitly accepted.
    triggers:
      - event: bizpower:bizpower_credit
        when: {variant_name: [Beacon Ridge Business Fixed 12, Beacon Ridge Business Fixed 24, Beacon Ridge Business Fixed 36, Beacon Ridge Business Green 24, Beacon Ridge Business Green 36]}
        map: {line_type: renewal_loyalty_credit, bizpower_agreement_id: bizpower_agreement_id}
  - type: bizpower_renewal_decline
    target: bizpower_agreements
    mutation: update
    meaning: The business declines automatic renewal of its expiring term.
    grain: One row per transaction.
    fields:
      renewal_election: Set to declined.
      renewal_election_date: Date the business declined.
    triggers: []
  - type: bizpower_auto_renew
    target: bizpower_agreements
    mutation: update
    meaning: An expiring term renews automatically into the offered fixed term because the business did not decline.
    grain: One row per transaction.
    fields:
      variant_name: The plan offered in the governing renewal notice.
      term_months: Term of that plan.
      contract_rate_cents_kwh: The renewal rate offered.
      contract_end_date: Last day of the new term.
      plan_change_date: The day after the expired contract_end_date.
      auto_renewed: Set to true.
      renewal_election: Reset to none for the new term.
    triggers: []
  - type: bizpower_rollover
    target: bizpower_agreements
    mutation: update
    meaning: An expiring term that neither renews nor auto-renews converts to the business month-to-month plan.
    grain: One row per transaction.
    fields:
      variant_name: The rollover plan's official name.
      term_months: Set to 0.
      contract_rate_cents_kwh: The disclosed rollover rate or the held expiring rate.
      contract_end_date: Cleared to empty.
      plan_change_date: The day after the expired contract_end_date.
      auto_renewed: Set to false.
    triggers: []
  - type: bizpower_site_transfer
    target: bizpower_agreements
    mutation: update
    meaning: The business relocates and its agreement is moved to its new site for the remainder of the term.
    grain: One row per transaction.
    fields:
      premise_id: The new site.
      site_transfer_date: Date the transfer takes effect, the new site's next scheduled meter read date.
    triggers:
      - event: bizpower:bizpower_fee_charge
        map: {line_type: site_transfer_fee, bizpower_agreement_id: bizpower_agreement_id, premise_id: premise_id}
  - type: bizpower_tax_exemption
    target: bizpower_agreements
    mutation: update
    meaning: Beacon Ridge tax operations validates the business's sales tax exemption certificate and marks the agreement exempt.
    grain: One row per transaction.
    fields:
      sales_tax_exempt: Set to true.
      tax_exemption_date: Date the validated certificate was received.
    triggers: []
  - type: bizpower_supply_charge
    target: bizpower_billing
    meaning: Beacon Ridge bills a site's electricity, monthly service fee or sales tax for one billing cycle.
    grain: One row per charge line per billing cycle.
    distinguish_by: [line_type, billing_period_start]
    fields:
      bizpower_agreement_id: The agreement billed.
      line_type: energy_charge, monthly_service_fee or sales_tax.
      billing_period_start: First day of the billing cycle.
      billing_period_end: Last day of the billing cycle.
      usage_kwh: kWh billed on an energy line; 0 otherwise.
      rate_cents_kwh: Rate applied on an energy line; 0.00 otherwise.
      tax_rate_pct: Sales tax rate on a sales_tax line; 0.000 otherwise.
      taxable_amount_usd: Sum of the cycle's energy and fee lines on a sales_tax line; 0.00 otherwise.
      amount_usd: Positive charge amount.
      posted_date: Date posted.
    account: bizpower_supply_billed
    direction: in
    triggers: []
  - type: bizpower_fee_charge
    target: bizpower_billing
    meaning: Beacon Ridge bills an early termination fee or a site transfer fee on the business agreement.
    grain: One row per fee type per occurrence.
    distinguish_by: [line_type, posted_date, premise_id]
    fields:
      bizpower_agreement_id: The agreement charged.
      line_type: early_termination_fee or site_transfer_fee.
      premise_id: For a site transfer fee, the new site; for an early termination fee, the site supplied at termination.
      etf_months_remaining: Remaining months used in an early termination fee; 0 otherwise.
      etf_remaining_kwh: Estimated remaining kWh used in a per_remaining_kwh fee; 0 otherwise.
      amount_usd: Positive fee amount.
      posted_date: Date posted.
    account: bizpower_supply_billed
    direction: in
    triggers: []
  - type: bizpower_credit
    target: bizpower_billing
    meaning: Beacon Ridge posts a sign-up, multi-site or renewal loyalty credit to the business agreement.
    grain: One row per credit type per billing cycle.
    distinguish_by: [line_type, billing_period_start]
    fields:
      bizpower_agreement_id: The agreement credited.
      line_type: signup_credit, multi_site_credit or renewal_loyalty_credit.
      billing_period_start: Billing cycle on whose bill the credit appears.
      amount_usd: Negative credit amount.
      posted_date: Date posted.
    account: bizpower_supply_billed
    direction: out
    triggers: []
  - type: bizpower_adjustment
    target: bizpower_billing
    meaning: Beacon Ridge corrects an over-billed business line with a rebill credit.
    grain: One row per corrected original line.
    distinguish_by: [source_billing_id, posted_date]
    fields:
      bizpower_agreement_id: The agreement corrected.
      line_type: rebill_credit.
      source_billing_id: The billed line being corrected.
      billing_period_start: Billing cycle of the corrected line.
      amount_usd: Negative credit equal to the over-billed amount.
      posted_date: Date posted.
    account: bizpower_supply_billed
    direction: out
    triggers: []
  - type: bizpower_renewal_notice
    target: bizpower_notices
    meaning: Beacon Ridge issues a business contract expiration notice with the renewal offer, the automatic renewal terms and the rollover rate.
    grain: One row per notice type per issue date.
    distinguish_by: [notice_type, notice_date]
    fields:
      bizpower_agreement_id: The expiring agreement.
      notice_type: initial_renewal_notice or final_options_notice.
      notice_date: Date issued.
      effective_date: The contract_end_date referred to.
      offered_variant_name: The plan offered for renewal and for automatic renewal.
      new_rate_cents_kwh: The renewal rate offered.
      rollover_rate_cents_kwh: The month-to-month rate for the first cycle after expiry if the term neither renews nor auto-renews.
      delivery_channel: How the notice was delivered.
    triggers: []
  - type: bizpower_rate_notice
    target: bizpower_notices
    meaning: Beacon Ridge notifies a business variable rate change or a regulatory pass-through.
    grain: One row per rate change per effective date.
    distinguish_by: [notice_type, effective_date]
    fields:
      bizpower_agreement_id: The agreement whose rate changes.
      notice_type: variable_rate_change or regulatory_pass_through.
      notice_date: Date issued.
      effective_date: Stated effective date.
      new_rate_cents_kwh: The new rate.
      delivery_channel: How the notice was delivered.
    triggers: []

measures:
  - id: bizpower_msr_completed_cycles
    window: From the agreement's service_start_date up to the frozen handling date.
    measure: Count of distinct billing_period_start values among bizpower_supply_charge rows with line_type energy_charge on the agreement whose billing_period_end is on or before the frozen handling date.
  - id: bizpower_msr_active_sites
    window: The single day equal to the billing_period_start of the cycle being credited.
    measure: Count of the business customer's bizpower agreements whose service_start_date is on or before that day and whose status is active, or drop_pending with drop_effective_date after that day, or closed with close_date after that day.

policies:
  - id: bizpower_agg_multi_holding
    subject: [bizpower_enroll]
    rule: >-
      A business may enroll any number of its commercial sites; there is no limit on the number of small business agreements per customer.
      No other bizpower agreement on the same site may be in enrollment_pending, active or drop_pending status when a new enrollment is submitted.
      A site may also not be enrolled while it is served under a Beacon Ridge commercial and industrial contract in pending or active status, because one premise has only one electricity supplier contract at a time.
    eligibility:
      - id: one_live_agreement_per_site
        applies_to: [bizpower_enroll]
        kind: dedup
        condition: No other bizpower agreement on the same site may be in enrollment_pending, active or drop_pending status when a new enrollment is submitted.
        evidence_fields: [bizpower_agreements.premise_id, bizpower_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_agreements.premise_id]
          action_bindings:
            bizpower_agreements.premise_id: premise_id
        dedup_contract:
          table: bizpower_agreements
          mode: separate_record
          object_bindings: {premise_id: premise_id}
          duplicate_filters: {status: [enrollment_pending, active, drop_pending]}
          distinct_fields: []
    params:
      max_per_customer: null

  - id: bizpower_agg_multi_site
    subject: [bizpower_credit]
    rule: >-
      Business agreements are combined across all of the customer's sites for the multi-site credit.
      For each billing cycle of an agreement whose plan has multi_site_credit_usd_per_cycle above 0.00, one multi_site_credit of that amount is posted when the customer's count of supplied small business sites on the cycle's billing_period_start (bizpower_msr_active_sites) is at least multi_site_min_sites.
      Each site's credit is computed from its own plan, so sites on different plans receive different amounts, and sites on a plan with 0.00 count toward the minimum but receive nothing.
      Sites served under commercial and industrial contracts do not count toward the minimum.
      At most one multi-site credit is posted per agreement per billing cycle.
    eligibility:
      - id: one_multi_site_credit_per_cycle
        applies_to: [bizpower_credit]
        kind: dedup
        condition: At most one multi-site credit is posted per agreement per billing cycle.
        evidence_fields: [bizpower_billing.bizpower_agreement_id, bizpower_billing.billing_period_start, bizpower_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_billing.bizpower_agreement_id, bizpower_billing.billing_period_start]
          action_bindings:
            bizpower_billing.bizpower_agreement_id: bizpower_agreement_id
            bizpower_billing.billing_period_start: billing_period_start
        dedup_contract:
          table: bizpower_billing
          mode: separate_record
          object_bindings: {bizpower_agreement_id: bizpower_agreement_id, billing_period_start: billing_period_start}
          duplicate_filters: {line_type: [multi_site_credit]}
          distinct_fields: []
    params:
      per_tier:
        Beacon Ridge Business Monthly Variable: {multi_site_credit_usd_per_cycle: "=multi_site_credit_usd_per_cycle"}
        Beacon Ridge Business Fixed 12: {multi_site_credit_usd_per_cycle: "=multi_site_credit_usd_per_cycle"}
        Beacon Ridge Business Fixed 24: {multi_site_credit_usd_per_cycle: "=multi_site_credit_usd_per_cycle"}
        Beacon Ridge Business Fixed 36: {multi_site_credit_usd_per_cycle: "=multi_site_credit_usd_per_cycle"}
        Beacon Ridge Business Green 24: {multi_site_credit_usd_per_cycle: "=multi_site_credit_usd_per_cycle"}
        Beacon Ridge Business Green 36: {multi_site_credit_usd_per_cycle: "=multi_site_credit_usd_per_cycle"}
    measures: [bizpower_msr_active_sites]

  - id: bizpower_enrollment_eligibility
    subject: [bizpower_enroll]
    rule: >-
      A small business enrollment is accepted only for a business customer and a site whose premise_class is commercial, whose service_state is listed in the plan's eligible_states, and whose annual_kwh_usage does not exceed max_annual_kwh_per_site.
      The site must be commercial.
      A site whose annual_kwh_usage is above max_annual_kwh_per_site must be priced as a commercial and industrial contract instead.
      The enrollment channel must be one of the plan's enrollment_channels.
      The contract_rate_cents_kwh is the offer_rate of the price offer for the plan and the site's electric utility whose validity window contains the enrollment_date.
      term_months is copied from the plan.
    eligibility:
      - id: commercial_site
        applies_to: [bizpower_enroll]
        kind: state
        condition: The site must be commercial.
        evidence_fields: [premises.premise_class, premises.premise_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [premises.premise_id]
          action_bindings:
            premises.premise_id: premise_id
        state_contract:
          field: premises.premise_class
          allowed: [commercial]
      - id: small_business_usage
        applies_to: [bizpower_enroll]
        kind: authorization
        condition: A site whose annual_kwh_usage is above max_annual_kwh_per_site must be priced as a commercial and industrial contract instead.
        evidence_fields: [premises.annual_kwh_usage, premises.premise_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [premises.premise_id]
          action_bindings:
            premises.premise_id: premise_id

  - id: bizpower_enrollment_processing
    subject: [bizpower_utility_confirm, bizpower_activate, bizpower_reject]
    rule: >-
      After submission the utility either accepts the enrollment, recording its confirmation letter date as utility_confirmation_date, or rejects it with one of the utility rejection reasons.
      Supply begins on the switch meter read date, which becomes service_start_date.
      For a plan with term_months above 0, contract_end_date is the day before the same calendar day term_months calendar months after service_start_date; when that calendar day does not exist in the target month, the last day of that month is used before subtracting the day.
      A month-to-month plan has an empty contract_end_date.
      A rejected enrollment ends permanently; a new enrollment creates a new agreement priced on its own enrollment date.
    eligibility: []

  - id: bizpower_rescission
    subject: [bizpower_rescind]
    rule: >-
      A business may rescind an enrollment while the agreement is still enrollment_pending.
      The rescission is accepted only when the business asks to rescind no later than rescission_window_days calendar days after the utility issued its enrollment confirmation (utility_confirmation_date).
      Day one is the calendar day after utility_confirmation_date, and the window closes at the end of the calendar day equal to utility_confirmation_date plus rescission_window_days.
      When utility_confirmation_date is still empty the window has not started and a rescission is accepted.
      After the window, a pending enrollment can no longer be withdrawn; the business may cancel once supply starts, and the early termination fee rules apply.
    eligibility:
      - id: bizpower_rescission_window
        applies_to: [bizpower_rescind]
        kind: time
        condition: The rescission is accepted only when the business asks to rescind no later than rescission_window_days calendar days after the utility issued its enrollment confirmation (utility_confirmation_date).
        evidence_fields: [bizpower_agreements.utility_confirmation_date, bizpower_agreements.bizpower_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_agreements.bizpower_agreement_id]
          action_bindings:
            bizpower_agreements.bizpower_agreement_id: bizpower_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the utility issued its enrollment confirmation
          anchor_source: bizpower_agreements.utility_confirmation_date
          relation: not_after
          duration_source: variants.rescission_window_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after utility_confirmation_date, and the window closes at the end of the calendar day equal to utility_confirmation_date plus rescission_window_days.
          boundary: inclusive

  - id: bizpower_supply_billing
    subject: [bizpower_supply_charge]
    rule: >-
      Each billing cycle in which Beacon Ridge supplied the site produces one energy_charge line, one monthly_service_fee line when the fee is above 0.00, and one sales_tax line when tax applies.
      Business supply charges are billed only while the agreement is active, drop_pending or closed.
      The energy line's amount_usd is usage_kwh times the applicable rate divided by 100, rounded per charge_rounding; the applicable rate of a fixed plan is contract_rate_cents_kwh for every cycle of the term and that of a month-to-month plan follows the business variable rate policy.
      The fee line has amount_usd equal to monthly_service_fee_usd and is billed in full for partial cycles.
      The sales_tax line has taxable_amount_usd equal to the cycle's energy and fee lines, tax_rate_pct equal to the sales_tax_rate_pct_by_state value for the site's service_state, and amount_usd equal to taxable_amount_usd times tax_rate_pct divided by 100, rounded per charge_rounding; no sales_tax line is billed when that rate is 0.000.
      No sales_tax line is billed for a cycle beginning on or after tax_exemption_date when sales_tax_exempt is true; cycles beginning before tax_exemption_date stay taxed and are not refunded, because tax_exemption_refund_allowed is false.
    eligibility:
      - id: bizpower_supplied_status
        applies_to: [bizpower_supply_charge]
        kind: state
        condition: Business supply charges are billed only while the agreement is active, drop_pending or closed.
        evidence_fields: [bizpower_agreements.status, bizpower_agreements.bizpower_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_agreements.bizpower_agreement_id]
          action_bindings:
            bizpower_agreements.bizpower_agreement_id: bizpower_agreement_id
        state_contract:
          field: bizpower_agreements.status
          allowed: [active, drop_pending, closed]
    formula:
      when: line_type == "sales_tax"
      amount_usd: round(taxable_amount_usd * tax_rate_pct / 100, 2)

  - id: bizpower_tax_exemption_terms
    subject: [bizpower_tax_exemption]
    rule: >-
      A sales tax exemption is recorded only after Beacon Ridge tax operations has received and validated the business's exemption certificate; a representative's statement that the business is exempt does not change billing.
      tax_exemption_date is the date the validated certificate was received, and the exemption applies per tax_exemption_effective_basis.
      An exemption is recorded per agreement, so a business with several sites must provide a certificate covering each site.
      Sales tax billed before the exemption took effect is not refunded by Beacon Ridge; the business may seek a refund from the state tax authority.
    eligibility: []

  - id: bizpower_variable_rate
    subject: [bizpower_rate_notice, bizpower_supply_charge]
    rule: >-
      A business month-to-month agreement is billed at contract_rate_cents_kwh for its first intro_rate_cycles billing cycles and for any cycles held at the expiring rate under the business rollover rules.
      After that, each cycle is billed at the new_rate_cents_kwh of the latest variable_rate_change notice on the agreement whose effective date is on or before the cycle's billing_period_start; until the first such notice applies, contract_rate_cents_kwh continues.
      A business variable rate change notice must be issued at least variable_rate_notice_days calendar days before its stated effective date; when it is issued later, the change applies only from the first cycle beginning on or after notice_date plus variable_rate_notice_days.
      Variable rate changes never apply to a fixed plan during its term.
    eligibility: []

  - id: bizpower_regulatory_passthrough
    subject: [bizpower_rate_notice]
    rule: >-
      A business fixed rate may change during the term only to pass through a change in law or regulation, and only on a plan whose regulatory_passthrough_allowed is true.
      A regulatory_pass_through notice must be issued at least regulatory_change_notice_days calendar days before its effective date, and the new rate applies to cycles beginning on or after the later of the stated effective date and notice_date plus regulatory_change_notice_days.
      On a plan whose regulatory_passthrough_allowed is false the rate is guaranteed for the whole term, and any pass-through billed on it is a billing error.
    eligibility: []

  - id: bizpower_expiry_notices
    subject: [bizpower_renewal_notice]
    rule: >-
      Every business agreement with a term receives two expiration notices.
      Business renewal notices are issued only on an active agreement with a term.
      The initial_renewal_notice is compliant when its notice_date falls no earlier than renewal_notice_earliest_days and no later than renewal_notice_latest_days calendar days before contract_end_date.
      The final_options_notice is compliant when its notice_date falls no later than final_options_notice_latest_days calendar days before contract_end_date and after the initial notice.
      Each notice states the plan offered for renewal, the renewal rate, whether the term renews automatically, the opt-out deadline and the month-to-month rate; when the two notices differ, the final_options_notice governs.
      Business notices are delivered by email.
    eligibility:
      - id: bizpower_active_term
        applies_to: [bizpower_renewal_notice]
        kind: state
        condition: Business renewal notices are issued only on an active agreement with a term.
        evidence_fields: [bizpower_agreements.status, bizpower_agreements.bizpower_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_agreements.bizpower_agreement_id]
          action_bindings:
            bizpower_agreements.bizpower_agreement_id: bizpower_agreement_id
        state_contract:
          field: bizpower_agreements.status
          allowed: [active]

  - id: bizpower_auto_renewal
    subject: [bizpower_auto_renew, bizpower_renewal_decline, bizpower_rollover]
    rule: >-
      On a plan whose auto_renew_enabled is true, an expiring term renews automatically into the plan and rate offered in the governing final_options_notice, starting the day after contract_end_date, unless the business declined.
      A decline is accepted only when the business declines no later than opt_out_window_days calendar days after the final options notice was issued.
      Day one is the calendar day after the final_options_notice notice_date, and the opt-out window closes at the end of the calendar day equal to that notice_date plus opt_out_window_days.
      A business may decline automatic renewal only on an active agreement.
      Automatic renewal also does not occur when either expiration notice was missing or not compliant, when the agreement is drop_pending at expiry, or when the plan's auto_renew_enabled is false.
      When the term neither renews nor auto-renews, the agreement converts on the day after contract_end_date to the plan named by rollover_variant at the rollover_rate_cents_kwh of the final_options_notice; when either notice was missing or not compliant, the expiring rate is held for late_notice_rate_hold_cycles billing cycles first.
      An automatically renewed term earns no renewal loyalty credit, and during its first auto_renew_etf_free_days calendar days the business may cancel without an early termination fee.
      A decline can be reversed only by an explicit renewal acceptance.
    eligibility:
      - id: opt_out_window
        applies_to: [bizpower_renewal_decline]
        kind: time
        condition: A decline is accepted only when the business declines no later than opt_out_window_days calendar days after the final options notice was issued.
        evidence_fields: [bizpower_notices.notice_date, bizpower_notices.bizpower_notice_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_notices.bizpower_notice_id]
          action_bindings:
            bizpower_notices.bizpower_notice_id: bizpower_notice_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the final options notice was issued
          anchor_source: bizpower_notices.notice_date
          relation: not_after
          duration_source: variants.opt_out_window_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after the final_options_notice notice_date, and the opt-out window closes at the end of the calendar day equal to that notice_date plus opt_out_window_days.
          boundary: inclusive
      - id: decline_active
        applies_to: [bizpower_renewal_decline]
        kind: state
        condition: A business may decline automatic renewal only on an active agreement.
        evidence_fields: [bizpower_agreements.status, bizpower_agreements.bizpower_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_agreements.bizpower_agreement_id]
          action_bindings:
            bizpower_agreements.bizpower_agreement_id: bizpower_agreement_id
        state_contract:
          field: bizpower_agreements.status
          allowed: [active]

  - id: bizpower_renewal
    subject: [bizpower_renew, bizpower_credit]
    rule: >-
      A business renews explicitly by accepting the offer in the governing renewal notice: the agreement takes the offered plan, its term_months and the offered renewal rate, and renewal_election becomes accepted.
      A business renewal is accepted only on an active agreement.
      When the acceptance is made on or before contract_end_date, the new term starts the day after contract_end_date; when it is made after a rollover, the new term starts on the acceptance date.
      When the business agreement has already rolled over, a renewal acceptance is honoured only when the business accepts no later than post_expiry_renewal_grace_days calendar days after the rollover took effect on plan_change_date.
      Day one is the calendar day after plan_change_date, and the grace period closes at the end of the calendar day equal to plan_change_date plus post_expiry_renewal_grace_days.
      Each explicit renewal earns one renewal_loyalty_credit equal to the renewal_loyalty_credit_usd of the plan renewed into; an automatic renewal earns none.
    eligibility:
      - id: bizpower_renewal_active
        applies_to: [bizpower_renew]
        kind: state
        condition: A business renewal is accepted only on an active agreement.
        evidence_fields: [bizpower_agreements.status, bizpower_agreements.bizpower_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_agreements.bizpower_agreement_id]
          action_bindings:
            bizpower_agreements.bizpower_agreement_id: bizpower_agreement_id
        state_contract:
          field: bizpower_agreements.status
          allowed: [active]
      - id: bizpower_post_expiry_grace
        applies_to: [bizpower_renew]
        kind: time
        condition: When the business agreement has already rolled over, a renewal acceptance is honoured only when the business accepts no later than post_expiry_renewal_grace_days calendar days after the rollover took effect on plan_change_date.
        evidence_fields: [bizpower_agreements.plan_change_date, bizpower_agreements.bizpower_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_agreements.bizpower_agreement_id]
          action_bindings:
            bizpower_agreements.bizpower_agreement_id: bizpower_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the rollover took effect on plan_change_date
          anchor_source: bizpower_agreements.plan_change_date
          relation: not_after
          duration_source: variants.post_expiry_renewal_grace_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after plan_change_date, and the grace period closes at the end of the calendar day equal to plan_change_date plus post_expiry_renewal_grace_days.
          boundary: inclusive

  - id: bizpower_site_transfer_terms
    subject: [bizpower_site_transfer, bizpower_fee_charge]
    rule: >-
      When a business relocates, an agreement whose plan has site_transfer_allowed true may be moved to another commercial site of the same customer for the remainder of its term, keeping its plan, contract rate and contract_end_date.
      A site transfer is made only on an active agreement.
      The new site must belong to the same customer, must not have another live bizpower agreement or commercial and industrial contract, must meet the small business usage limit, and, when site_transfer_same_utility_required is true, must be served by the same electric utility as the old site.
      The transfer takes effect on the new site's next scheduled meter read date and one site_transfer_fee of site_transfer_fee_usd is billed with premise_id set to the new site.
      A month-to-month plan is not transferred; the business cancels it and enrolls the new site.
      A relocation that cannot be transferred is not a ground for waiving the early termination fee.
    eligibility:
      - id: transfer_active
        applies_to: [bizpower_site_transfer]
        kind: state
        condition: A site transfer is made only on an active agreement.
        evidence_fields: [bizpower_agreements.status, bizpower_agreements.bizpower_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_agreements.bizpower_agreement_id]
          action_bindings:
            bizpower_agreements.bizpower_agreement_id: bizpower_agreement_id
        state_contract:
          field: bizpower_agreements.status
          allowed: [active]

  - id: bizpower_cancellation
    subject: [bizpower_cancel, bizpower_cancel_withdraw, bizpower_drop_complete, bizpower_switch_away]
    rule: >-
      The business cancels an active agreement by confirming the cancellation; the drop takes effect on the site's next scheduled meter read date, recorded as drop_effective_date.
      A withdrawal is accepted only when the business withdraws the cancellation before the scheduled business drop takes effect on drop_effective_date.
      Day one is the calendar day after drop_requested_date, and the withdrawal period closes at the end of the calendar day before drop_effective_date.
      When the utility completes the drop, the agreement closes with close_reason cancelled_by_customer, or moved_to_cni when the drop_reason was cni_upgrade.
      When the utility ends supply because another supplier enrolled the site, the agreement closes with close_reason switched_to_other_supplier; a final bill for a closed business closes it with close_reason final_billed.
    eligibility:
      - id: bizpower_withdraw_before_drop
        applies_to: [bizpower_cancel_withdraw]
        kind: time
        condition: A withdrawal is accepted only when the business withdraws the cancellation before the scheduled business drop takes effect on drop_effective_date.
        evidence_fields: [bizpower_agreements.drop_effective_date, bizpower_agreements.bizpower_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_agreements.bizpower_agreement_id]
          action_bindings:
            bizpower_agreements.bizpower_agreement_id: bizpower_agreement_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the scheduled business drop takes effect on drop_effective_date
          anchor_source: bizpower_agreements.drop_effective_date
          relation: not_after
          duration_source: params.withdrawal_cutoff_days
          unit: calendar_days
          counting_rule: Day one is the calendar day after drop_requested_date, and the withdrawal period closes at the end of the calendar day before drop_effective_date.
          boundary: exclusive
    params:
      withdrawal_cutoff_days: 0

  - id: bizpower_etf
    subject: [bizpower_fee_charge]
    rule: >-
      A business early termination fee is assessed only once the agreement is drop_pending or closed.
      Only one early termination fee may be billed per business agreement.
      The termination date is drop_requested_date for a cancellation and close_date for a switch-away or final bill.
      etf_months_remaining is twelve times the difference in years plus the difference in months between the termination date and contract_end_date, plus one when the day of month of contract_end_date is later than the day of month of the termination date.
      Under the per_remaining_kwh method, etf_remaining_kwh is the site's annual_kwh_usage times etf_months_remaining divided by remaining_usage_divisor_months, rounded half up to a whole kWh, and the fee is etf_remaining_kwh times etf_rate_usd_per_kwh rounded per charge_rounding, but not less than etf_minimum_usd; under the flat method the fee is etf_flat_usd; under the none method no fee applies.
      No fee applies when the termination date falls within etf_free_window_days calendar days before contract_end_date, equality counting as inside, or within auto_renew_etf_free_days calendar days after plan_change_date of an automatically renewed term, or within rescission_window_days calendar days after utility_confirmation_date.
      No fee applies when etf_waive_on_cni_upgrade is true and the drop_reason is cni_upgrade with a Beacon Ridge commercial and industrial contract on the same site in pending or active status.
      Business closure, relocation, sale of the business and bankruptcy do not waive the fee; there is no state cap on business fees.
    eligibility:
      - id: bizpower_terminated_status
        applies_to: [bizpower_fee_charge]
        kind: state
        condition: A business early termination fee is assessed only once the agreement is drop_pending or closed.
        evidence_fields: [bizpower_agreements.status, bizpower_agreements.bizpower_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_agreements.bizpower_agreement_id]
          action_bindings:
            bizpower_agreements.bizpower_agreement_id: bizpower_agreement_id
        state_contract:
          field: bizpower_agreements.status
          allowed: [drop_pending, closed]
      - id: bizpower_single_etf
        applies_to: [bizpower_fee_charge]
        kind: dedup
        condition: Only one early termination fee may be billed per business agreement.
        evidence_fields: [bizpower_billing.bizpower_agreement_id, bizpower_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_billing.bizpower_agreement_id]
          action_bindings:
            bizpower_billing.bizpower_agreement_id: bizpower_agreement_id
        dedup_contract:
          table: bizpower_billing
          mode: separate_record
          object_bindings: {bizpower_agreement_id: bizpower_agreement_id}
          duplicate_filters: {line_type: [early_termination_fee]}
          distinct_fields: []
    params:
      remaining_usage_divisor_months: 12
      per_tier:
        Beacon Ridge Business Monthly Variable: {etf_method: "=etf_method", etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd", etf_flat_usd: "=etf_flat_usd", etf_free_window_days: "=etf_free_window_days"}
        Beacon Ridge Business Fixed 12: {etf_method: "=etf_method", etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd", etf_flat_usd: "=etf_flat_usd", etf_free_window_days: "=etf_free_window_days"}
        Beacon Ridge Business Fixed 24: {etf_method: "=etf_method", etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd", etf_flat_usd: "=etf_flat_usd", etf_free_window_days: "=etf_free_window_days"}
        Beacon Ridge Business Fixed 36: {etf_method: "=etf_method", etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd", etf_flat_usd: "=etf_flat_usd", etf_free_window_days: "=etf_free_window_days"}
        Beacon Ridge Business Green 24: {etf_method: "=etf_method", etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd", etf_flat_usd: "=etf_flat_usd", etf_free_window_days: "=etf_free_window_days"}
        Beacon Ridge Business Green 36: {etf_method: "=etf_method", etf_rate_usd_per_kwh: "=etf_rate_usd_per_kwh", etf_minimum_usd: "=etf_minimum_usd", etf_flat_usd: "=etf_flat_usd", etf_free_window_days: "=etf_free_window_days"}
    formula:
      when: line_type == "early_termination_fee" and etf_method != "none"
      amount_usd: etf_flat_usd if etf_method == "flat" else max(etf_minimum_usd, round(etf_remaining_kwh * etf_rate_usd_per_kwh, 2))

  - id: bizpower_signup_credit
    subject: [bizpower_credit]
    rule: >-
      A business plan with signup_credit_usd above 0.00 earns one signup_credit per site once the agreement's completed cycles (bizpower_msr_completed_cycles) reach signup_credit_after_cycles, posted on the bill of the next cycle.
      The business sign-up credit may be posted only once per agreement.
      Business bill credits are posted only while the agreement is active or drop_pending.
      An enrollment through the broker channel earns the sign-up credit only when signup_credit_broker_eligible is true.
      When signup_credit_forfeit_on_drop is true and the agreement left active status before qualifying, the credit is forfeited.
      Renewals, automatic renewals, rollovers and site transfers never earn a sign-up credit.
      Credits are additive, each posted as its own line, and none offsets a fee or sales tax.
    eligibility:
      - id: one_bizpower_signup_credit
        applies_to: [bizpower_credit]
        kind: dedup
        condition: The business sign-up credit may be posted only once per agreement.
        evidence_fields: [bizpower_billing.bizpower_agreement_id, bizpower_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_billing.bizpower_agreement_id]
          action_bindings:
            bizpower_billing.bizpower_agreement_id: bizpower_agreement_id
        dedup_contract:
          table: bizpower_billing
          mode: separate_record
          object_bindings: {bizpower_agreement_id: bizpower_agreement_id}
          duplicate_filters: {line_type: [signup_credit]}
          distinct_fields: []
      - id: bizpower_credit_while_supplied
        applies_to: [bizpower_credit]
        kind: state
        condition: Business bill credits are posted only while the agreement is active or drop_pending.
        evidence_fields: [bizpower_agreements.status, bizpower_agreements.bizpower_agreement_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_agreements.bizpower_agreement_id]
          action_bindings:
            bizpower_agreements.bizpower_agreement_id: bizpower_agreement_id
        state_contract:
          field: bizpower_agreements.status
          allowed: [active, drop_pending]
    measures: [bizpower_msr_completed_cycles]

  - id: bizpower_billing_correction
    subject: [bizpower_adjustment]
    rule: >-
      When a business line was billed at more than the policy allows, the over-billed amount is returned as one rebill_credit tied to that line through source_billing_id, equal to the billed amount_usd minus the correctly computed amount and posted as a negative amount.
      When an energy or fee line is corrected, the cycle's sales_tax line is corrected by its own rebill credit for the tax on the over-billed amount.
      A business line may be corrected only when the business disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
      The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
      Each billed business line may be corrected only once.
      A care agent may post a rebill credit up to agent_adjustment_limit_usd per line; a larger correction is opened as a business billing dispute for review instead of being posted.
      Under-billing caused by a Beacon Ridge error is not back-billed, and sales tax correctly billed before an exemption took effect is not a billing error.
    eligibility:
      - id: bizpower_dispute_lookback
        applies_to: [bizpower_adjustment]
        kind: time
        condition: A business line may be corrected only when the business disputes it no later than billing_dispute_lookback_months calendar months after the line was posted.
        evidence_fields: [bizpower_billing.posted_date, bizpower_billing.bizpower_billing_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_billing.bizpower_billing_id]
          action_bindings:
            bizpower_billing.bizpower_billing_id: source_billing_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the line was posted
          anchor_source: bizpower_billing.posted_date
          relation: not_after
          duration_source: variants.billing_dispute_lookback_months
          unit: calendar_months
          counting_rule: The lookback ends on the same day of the month billing_dispute_lookback_months months after posted_date, or on the last day of that month when that day does not exist.
          boundary: inclusive
      - id: bizpower_one_correction_per_line
        applies_to: [bizpower_adjustment]
        kind: dedup
        condition: Each billed business line may be corrected only once.
        evidence_fields: [bizpower_billing.source_billing_id, bizpower_billing.line_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bizpower_billing.source_billing_id]
          action_bindings:
            bizpower_billing.source_billing_id: source_billing_id
        dedup_contract:
          table: bizpower_billing
          mode: separate_record
          object_bindings: {source_billing_id: source_billing_id}
          duplicate_filters: {line_type: [rebill_credit]}
          distinct_fields: []

extended_policies:
  - id: bizpower_ext_multi_site_credit_amount
    base_policy_refs: [bizpower_agg_multi_site, bizpower_renewal, bizpower_signup_credit]
    overwrite:
      - base_policy: bizpower_agg_multi_site
        superseded_clause: >-
          For each billing cycle of an agreement whose plan has multi_site_credit_usd_per_cycle above 0.00, one multi_site_credit of that amount is posted when the customer's count of supplied small business sites on the cycle's billing_period_start (bizpower_msr_active_sites) is at least multi_site_min_sites.
        replaced_by: >-
          For each billing cycle of a small business agreement whose plan carries a multi-site credit above zero, one multi-site credit is posted when the business has at least the plan's multi-site minimum of small business sites supplied on the first day of that cycle, and its amount is worked out as this policy states rather than taken as the plan's credit alone.
    trigger: state_due
    subject: [bizpower_credit]
    computes: credit_amount_usd
    target_tool: post_multi_site_credit_fd52d0a7
    params:
      load_high_kwh: 12000
      load_mid_kwh: 8000
      load_addon_high: 4.00
      load_addon_mid: 2.00
      gas_addon_fixed: 2.40
      gas_addon_index: 1.00
      cont_high_count: 11
      cont_mid_count: 6
      cont_mult_high: 1.25
      cont_mult_mid: 1.10
      long_cycle_days: 31
      short_cycle_days: 25
      short_cycle_share: 0.5
      proration_days: 30
    rule: >-
      For each billing cycle of a small business agreement whose plan carries a multi-site credit above zero, one multi-site credit is posted when the business has at least the plan's multi-site minimum of small business sites supplied on the first day of that cycle, and its amount is worked out as this policy states rather than taken as the plan's credit alone.
      A site on a plan whose multi-site credit is zero counts toward the minimum but receives no multi-site credit.
      A cycle's multi-site credit is posted once that cycle's energy line is billed, so the cycle being credited is the agreement's latest billed cycle, and its billed kWh, first day and last day are read from that latest energy line.
      The standard multi-site credit for a cycle is the plan's multi-site credit per cycle, rounded half up to the cent.
      Site load add-on: a credited cycle whose energy line billed 12,000 kWh or more adds 4.00 dollars; a credited cycle that billed at least 8,000 but fewer than 12,000 kWh adds 2.00 dollars; a credited cycle that billed fewer than 8,000 kWh adds nothing.
      Same-site gas add-on: when the site also takes Beacon Ridge commercial gas under an active agreement on a plan with a fixed term, the multi-site credit adds 2.40 dollars; when the site's active Beacon Ridge commercial gas agreement is on the month-to-month index plan, it adds 1.00 dollar; when the site has no active Beacon Ridge commercial gas agreement, it adds nothing.
      Continuity multiplier: the multi-site credits posted on the agreement in the 12 months before the handling date are counted by posting date; 11 or more multiply the multi-site subtotal by 1.25; 6 to 10 multiply it by 1.10; 5 or fewer leave it as it stands.
      Cycle-length rule: the credited cycle's days are counted from its first day to its last day, both days included; a cycle of more than 31 days is credited in proportion to its length, the amount being multiplied by its number of days and divided by 30; a cycle of fewer than 25 days is credited at one half; a cycle of 25 to 31 days is credited in full.
      The amount is put together in this order: first the plan's multi-site credit, the site load add-on and the same-site gas add-on are added into one multi-site subtotal; that subtotal is then multiplied by the continuity multiplier; the result of that step is then adjusted by the cycle-length rule; rounding half up to the cent happens only once, on the final amount.
    prerequisite: []
    cross_category:
      - category: bizgas
        as: branch
        reads: [status, premise_id, term_months]
        note: The same-site gas add-on is decided from whether the site's Beacon Ridge commercial gas agreement is active and whether its plan carries a fixed term.
    compute:
      - plan_credit: "P('multi_site_credit_usd_per_cycle')"
      - cycle_kwh: "LATEST('bizpower_billing', 'usage_kwh', date_field='billing_period_start', line_type='energy_charge')"
      - load_addon: "K('load_addon_high') if cycle_kwh >= K('load_high_kwh') else (K('load_addon_mid') if cycle_kwh >= K('load_mid_kwh') else 0)"
      - gas_status: "CFIELD('bizgas', 'status', premise_id=F('premise_id'), status='active')"
      - gas_term: "CPARAM('bizgas', 'term_months', premise_id=F('premise_id'), status='active')"
      - gas_addon: "K('gas_addon_fixed') if (gas_status == 'active' and gas_term > 0) else (K('gas_addon_index') if (gas_status == 'active' and gas_term == 0) else 0)"
      - credits_12m: "COUNT('bizpower_billing', within_months=12, date_field='posted_date', line_type='multi_site_credit')"
      - continuity_mult: "K('cont_mult_high') if credits_12m >= K('cont_high_count') else (K('cont_mult_mid') if credits_12m >= K('cont_mid_count') else 1)"
      - cycle_start: "LATEST('bizpower_billing', 'billing_period_start', date_field='billing_period_start', line_type='energy_charge')"
      - cycle_end: "LATEST('bizpower_billing', 'billing_period_end', date_field='billing_period_start', line_type='energy_charge')"
      - cycle_days: "DAYS(cycle_start, cycle_end) + 1"
      - length_factor: "cycle_days / K('proration_days') if cycle_days > K('long_cycle_days') else (K('short_cycle_share') if cycle_days < K('short_cycle_days') else 1)"
      - multi_site_subtotal: "plan_credit + load_addon + gas_addon"
      - result: "RND(multi_site_subtotal * continuity_mult * length_factor, 2) if plan_credit > 0 else 0"
    compute_basis:
      plan_credit: "The standard multi-site credit for a cycle is the plan's multi-site credit per cycle, rounded half up to the cent."
      cycle_kwh: "A cycle's multi-site credit is posted once that cycle's energy line is billed, so the cycle being credited is the agreement's latest billed cycle, and its billed kWh, first day and last day are read from that latest energy line."
      load_addon: "Site load add-on: a credited cycle whose energy line billed 12,000 kWh or more adds 4.00 dollars; a credited cycle that billed at least 8,000 but fewer than 12,000 kWh adds 2.00 dollars; a credited cycle that billed fewer than 8,000 kWh adds nothing."
      gas_status: "Same-site gas add-on: when the site also takes Beacon Ridge commercial gas under an active agreement on a plan with a fixed term, the multi-site credit adds 2.40 dollars;"
      gas_term: "when the site's active Beacon Ridge commercial gas agreement is on the month-to-month index plan, it adds 1.00 dollar;"
      gas_addon: "Same-site gas add-on: when the site also takes Beacon Ridge commercial gas under an active agreement on a plan with a fixed term, the multi-site credit adds 2.40 dollars; when the site's active Beacon Ridge commercial gas agreement is on the month-to-month index plan, it adds 1.00 dollar; when the site has no active Beacon Ridge commercial gas agreement, it adds nothing."
      credits_12m: "Continuity multiplier: the multi-site credits posted on the agreement in the 12 months before the handling date are counted by posting date;"
      continuity_mult: "11 or more multiply the multi-site subtotal by 1.25; 6 to 10 multiply it by 1.10; 5 or fewer leave it as it stands."
      cycle_start: "A cycle's multi-site credit is posted once that cycle's energy line is billed, so the cycle being credited is the agreement's latest billed cycle, and its billed kWh, first day and last day are read from that latest energy line."
      cycle_end: "A cycle's multi-site credit is posted once that cycle's energy line is billed, so the cycle being credited is the agreement's latest billed cycle, and its billed kWh, first day and last day are read from that latest energy line."
      cycle_days: "Cycle-length rule: the credited cycle's days are counted from its first day to its last day, both days included;"
      length_factor: "a cycle of more than 31 days is credited in proportion to its length, the amount being multiplied by its number of days and divided by 30; a cycle of fewer than 25 days is credited at one half; a cycle of 25 to 31 days is credited in full."
      multi_site_subtotal: "first the plan's multi-site credit, the site load add-on and the same-site gas add-on are added into one multi-site subtotal;"
      result: "that subtotal is then multiplied by the continuity multiplier; the result of that step is then adjusted by the cycle-length rule; rounding half up to the cent happens only once, on the final amount."
    factors:
      - id: site_load_addon
        effect: parameter
        decides: load_addon
        bindings: [cycle_kwh, load_addon]
        ladder:
          - when: "the credited cycle's energy line billed 12,000 kWh or more"
            value: "K('load_addon_high')"
          - when: "the credited cycle's energy line billed at least 8,000 but fewer than 12,000 kWh"
            value: "K('load_addon_mid')"
          - when: "otherwise (fewer than 8,000 kWh)"
            value: "0"
        baseline:
          load_addon: "0"
        evidence: [history]
        cross_difficulty: null
      - id: same_site_gas_addon
        effect: parameter
        decides: gas_addon
        bindings: [gas_status, gas_term, gas_addon]
        ladder:
          - when: "the site's Beacon Ridge commercial gas agreement is active and its plan carries a fixed term"
            value: "K('gas_addon_fixed')"
          - when: "the site's Beacon Ridge commercial gas agreement is active and on the month-to-month index plan"
            value: "K('gas_addon_index')"
          - when: "otherwise (no active Beacon Ridge commercial gas agreement at the site)"
            value: "0"
        baseline:
          gas_addon: "0"
        evidence: [cross_category]
        cross_difficulty: bizgas
      - id: multi_site_continuity
        effect: parameter
        decides: continuity_mult
        bindings: [credits_12m, continuity_mult]
        ladder:
          - when: "11 or more multi-site credits posted on the agreement in the 12 months before the handling date"
            value: "K('cont_mult_high')"
          - when: "6 to 10 multi-site credits posted in those 12 months"
            value: "K('cont_mult_mid')"
          - when: "otherwise (5 or fewer)"
            value: "1"
        baseline:
          continuity_mult: "1"
        evidence: [history]
        cross_difficulty: null
      - id: credited_cycle_length
        effect: method
        decides: length_factor
        bindings: [cycle_start, cycle_end, cycle_days, length_factor]
        ladder:
          - when: "the credited cycle runs more than 31 days, both ends counted"
            method: "the amount is multiplied by the cycle's days and divided by 30"
          - when: "the credited cycle runs fewer than 25 days"
            method: "the amount is credited at one half"
          - when: "otherwise (25 to 31 days)"
            method: "the amount is credited in full"
        baseline:
          length_factor: "1"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard multi-site credit for a cycle is the plan's multi-site credit per cycle, rounded half up to the cent.
      params: [multi_site_credit_usd_per_cycle]
    inputs:
      history:
        - {table: bizpower_billing, aggregate: latest, field: usage_kwh, filters: {line_type: energy_charge}}
        - {table: bizpower_billing, aggregate: count, field: bizpower_billing_id, within_months: 12, filters: {line_type: multi_site_credit}}
        - {table: bizpower_billing, aggregate: latest, field: billing_period_start, filters: {line_type: energy_charge}}
        - {table: bizpower_billing, aggregate: latest, field: billing_period_end, filters: {line_type: energy_charge}}
      cross_category: [bizgas]

  - id: bizpower_ext_renewal_rate_on_acceptance
    base_policy_refs: [bizpower_renewal, bizpower_expiry_notices]
    overwrite:
      - base_policy: bizpower_renewal
        superseded_clause: >-
          A business renews explicitly by accepting the offer in the governing renewal notice: the agreement takes the offered plan, its term_months and the offered renewal rate, and renewal_election becomes accepted.
        replaced_by: >-
          A business that explicitly accepts its renewal offer on or before the contract end date takes the plan and the term offered in the final options notice, its renewal election becomes accepted, and its renewal rate is worked out as this policy states rather than taken unchanged from a notice.
      - base_policy: bizpower_expiry_notices
        superseded_clause: >-
          Each notice states the plan offered for renewal, the renewal rate, whether the term renews automatically, the opt-out deadline and the month-to-month rate; when the two notices differ, the final_options_notice governs.
        replaced_by: >-
          Offer selection: when both expiration notices were issued inside their windows, the initial renewal notice no earlier than 90 and no later than 60 days before the contract end date and the final options notice no later than 30 days before it, and the final options notice states a higher renewal rate than the initial renewal notice, the starting rate is the initial renewal notice's renewal rate; when the final options notice is missing or was issued fewer than 30 days before the contract end date, or the initial renewal notice is missing or was issued outside its window, the starting rate is the agreement's expiring contract rate; in every other case the starting rate is the final options notice's renewal rate.
    trigger: on_request
    subject: [bizpower_renew]
    computes: renewal_rate_cents_kwh
    target_tool: accept_renewal_offer_d4784688
    params:
      load_high_kwh: 150000
      load_mid_kwh: 100000
      load_off_high: 0.30
      load_off_mid: 0.15
      shape_flat_max: 1.20
      shape_peaky_min: 1.40
      shape_off_flat: 0.08
      shape_add_peaky: 0.10
      gas_high_therms: 5000
      gas_low_therms: 1
      gas_off_high: 0.20
      gas_off_low: 0.10
      tenure_long_months: 60
      tenure_mid_months: 24
      tenure_off_long: 0.12
      tenure_off_mid: 0.06
      history_off_first: 0.04
      history_off_repeat: 0.02
    rule: >-
      A business that explicitly accepts its renewal offer on or before the contract end date takes the plan and the term offered in the final options notice, its renewal election becomes accepted, and its renewal rate is worked out as this policy states rather than taken unchanged from a notice.
      The renewed term starts on the day after the contract end date and ends on the day before the same calendar day the renewed term's months later; when that calendar day does not exist in the target month, the last day of that month is used before the day is subtracted.
      The standard renewal rate is the renewal rate stated in the final options notice on the agreement, rounded half up to the cent per kWh.
      Offer selection: when both expiration notices were issued inside their windows, the initial renewal notice no earlier than 90 and no later than 60 days before the contract end date and the final options notice no later than 30 days before it, and the final options notice states a higher renewal rate than the initial renewal notice, the starting rate is the initial renewal notice's renewal rate; when the final options notice is missing or was issued fewer than 30 days before the contract end date, or the initial renewal notice is missing or was issued outside its window, the starting rate is the agreement's expiring contract rate; in every other case the starting rate is the final options notice's renewal rate.
      Annual load adjustment: the kWh of the agreement's energy lines posted in the 12 months before the handling date are added up; 150,000 kWh or more take 0.30 cents per kWh off; at least 100,000 but under 150,000 kWh take 0.15 cents off; under 100,000 kWh take nothing off.
      Load-shape adjustment: the largest kWh billed on any one energy line of the agreement is divided by the average kWh per energy line posted in those 12 months; a ratio of 1.20 or less takes 0.08 cents per kWh off; a ratio above 1.40 adds 0.10 cents; a ratio above 1.20 and up to 1.40 changes nothing.
      Same-site gas adjustment: the therms of the energy lines of the site's active Beacon Ridge commercial gas agreement posted in the 12 months before the handling date are added up; 5,000 therms or more take 0.20 cents per kWh off; at least 1 but under 5,000 therms take 0.10 cents off; no gas billed at the site in those months takes nothing off.
      Tenure adjustment: the whole months from the agreement's service start date to the handling date are counted; 60 months or more take 0.12 cents per kWh off; 24 to 59 months take 0.06 cents off; under 24 months take nothing off.
      Renewal-history adjustment: an agreement whose bill carries no renewal loyalty credit and whose current term did not begin by automatic renewal is renewing for the first time and takes 0.04 cents per kWh off; an agreement whose bill carries at least one renewal loyalty credit takes 0.02 cents off; any other agreement takes nothing off.
      The rate is put together in this order: the five adjustments are first added together into one adjustment, and that adjustment is applied once to the starting rate; the result is rounded half up to the cent per kWh only at the end.
    prerequisite: []
    cross_category:
      - category: bizgas
        as: history
        reads: [bizgas_agreement_id, premise_id, status, bizgas_billing.usage_therms]
        note: The same-site gas adjustment is decided from the therms billed in the last 12 months on the site's active Beacon Ridge commercial gas agreement.
    compute:
      - end_date: "F('contract_end_date')"
      - init_date: "LATEST('bizpower_notices', 'notice_date', date_field='notice_date', notice_type='initial_renewal_notice')"
      - init_rate: "LATEST('bizpower_notices', 'new_rate_cents_kwh', date_field='notice_date', notice_type='initial_renewal_notice')"
      - final_date: "LATEST('bizpower_notices', 'notice_date', date_field='notice_date', notice_type='final_options_notice')"
      - final_rate: "LATEST('bizpower_notices', 'new_rate_cents_kwh', date_field='notice_date', notice_type='final_options_notice')"
      - init_ok: "init_date != None and DAYS(init_date, end_date) <= P('renewal_notice_earliest_days') and DAYS(init_date, end_date) >= P('renewal_notice_latest_days')"
      - final_ok: "final_date != None and DAYS(final_date, end_date) >= P('final_options_notice_latest_days')"
      - start_rate: "init_rate if (init_ok and final_ok and final_rate > init_rate) else (F('contract_rate_cents_kwh') if (not final_ok or not init_ok) else final_rate)"
      - kwh_12m: "SUM('bizpower_billing', 'usage_kwh', within_months=12, date_field='posted_date', line_type='energy_charge')"
      - load_adj: "-K('load_off_high') if kwh_12m >= K('load_high_kwh') else (-K('load_off_mid') if kwh_12m >= K('load_mid_kwh') else 0)"
      - lines_12m: "COUNT('bizpower_billing', within_months=12, date_field='posted_date', line_type='energy_charge')"
      - peak_kwh: "MAX('bizpower_billing', 'usage_kwh', line_type='energy_charge')"
      - shape_ratio: "peak_kwh / (kwh_12m / lines_12m) if (lines_12m > 0 and kwh_12m > 0) else 0"
      - shape_adj: "-K('shape_off_flat') if (lines_12m > 0 and shape_ratio <= K('shape_flat_max')) else (K('shape_add_peaky') if shape_ratio > K('shape_peaky_min') else 0)"
      - gas_agreement: "CFIELD('bizgas', 'bizgas_agreement_id', premise_id=F('premise_id'), status='active')"
      - gas_therms_12m: "XSUM('bizgas', 'bizgas_billing', 'usage_therms', within_months=12, date_field='posted_date', line_type='energy_charge', bizgas_agreement_id=gas_agreement) if gas_agreement != None else 0"
      - gas_adj: "-K('gas_off_high') if gas_therms_12m >= K('gas_high_therms') else (-K('gas_off_low') if gas_therms_12m >= K('gas_low_therms') else 0)"
      - tenure_months: "MONTHS(F('service_start_date'), NOW)"
      - tenure_adj: "-K('tenure_off_long') if tenure_months >= K('tenure_long_months') else (-K('tenure_off_mid') if tenure_months >= K('tenure_mid_months') else 0)"
      - loyalty_lines: "COUNT('bizpower_billing', line_type='renewal_loyalty_credit')"
      - history_adj: "-K('history_off_first') if (loyalty_lines == 0 and F('auto_renewed') == False) else (-K('history_off_repeat') if loyalty_lines >= 1 else 0)"
      - adjustment: "load_adj + shape_adj + gas_adj + tenure_adj + history_adj"
      - result: "RND(start_rate + adjustment, 2)"
    compute_basis:
      end_date: "The renewed term starts on the day after the contract end date"
      init_date: "the initial renewal notice no earlier than 90 and no later than 60 days before the contract end date"
      init_rate: "the starting rate is the initial renewal notice's renewal rate;"
      final_date: "the final options notice no later than 30 days before it,"
      final_rate: "The standard renewal rate is the renewal rate stated in the final options notice on the agreement, rounded half up to the cent per kWh."
      init_ok: "when both expiration notices were issued inside their windows, the initial renewal notice no earlier than 90 and no later than 60 days before the contract end date"
      final_ok: "and the final options notice no later than 30 days before it,"
      start_rate: "Offer selection: when both expiration notices were issued inside their windows, the initial renewal notice no earlier than 90 and no later than 60 days before the contract end date and the final options notice no later than 30 days before it, and the final options notice states a higher renewal rate than the initial renewal notice, the starting rate is the initial renewal notice's renewal rate; when the final options notice is missing or was issued fewer than 30 days before the contract end date, or the initial renewal notice is missing or was issued outside its window, the starting rate is the agreement's expiring contract rate; in every other case the starting rate is the final options notice's renewal rate."
      kwh_12m: "Annual load adjustment: the kWh of the agreement's energy lines posted in the 12 months before the handling date are added up;"
      load_adj: "150,000 kWh or more take 0.30 cents per kWh off; at least 100,000 but under 150,000 kWh take 0.15 cents off; under 100,000 kWh take nothing off."
      lines_12m: "the average kWh per energy line posted in those 12 months"
      peak_kwh: "the largest kWh billed on any one energy line of the agreement"
      shape_ratio: "Load-shape adjustment: the largest kWh billed on any one energy line of the agreement is divided by the average kWh per energy line posted in those 12 months;"
      shape_adj: "a ratio of 1.20 or less takes 0.08 cents per kWh off; a ratio above 1.40 adds 0.10 cents; a ratio above 1.20 and up to 1.40 changes nothing."
      gas_agreement: "the site's active Beacon Ridge commercial gas agreement"
      gas_therms_12m: "Same-site gas adjustment: the therms of the energy lines of the site's active Beacon Ridge commercial gas agreement posted in the 12 months before the handling date are added up;"
      gas_adj: "5,000 therms or more take 0.20 cents per kWh off; at least 1 but under 5,000 therms take 0.10 cents off; no gas billed at the site in those months takes nothing off."
      tenure_months: "Tenure adjustment: the whole months from the agreement's service start date to the handling date are counted;"
      tenure_adj: "60 months or more take 0.12 cents per kWh off; 24 to 59 months take 0.06 cents off; under 24 months take nothing off."
      loyalty_lines: "an agreement whose bill carries no renewal loyalty credit"
      history_adj: "Renewal-history adjustment: an agreement whose bill carries no renewal loyalty credit and whose current term did not begin by automatic renewal is renewing for the first time and takes 0.04 cents per kWh off; an agreement whose bill carries at least one renewal loyalty credit takes 0.02 cents off; any other agreement takes nothing off."
      adjustment: "the five adjustments are first added together into one adjustment,"
      result: "and that adjustment is applied once to the starting rate; the result is rounded half up to the cent per kWh only at the end."
    factors:
      - id: renewal_offer_selection
        effect: method
        decides: start_rate
        bindings: [init_date, init_rate, final_date, init_ok, final_ok, start_rate]
        ladder:
          - when: "both expiration notices were issued inside their windows and the final options notice states a higher renewal rate than the initial renewal notice"
            method: "the starting rate is the initial renewal notice's renewal rate"
          - when: "the final options notice is missing or late, or the initial renewal notice is missing or outside its window"
            method: "the starting rate is the agreement's expiring contract rate"
          - when: "otherwise"
            method: "the starting rate is the final options notice's renewal rate"
        baseline:
          start_rate: "final_rate"
        evidence: [history, date]
        cross_difficulty: null
      - id: renewal_annual_load
        effect: parameter
        decides: load_adj
        bindings: [kwh_12m, load_adj]
        ladder:
          - when: "150,000 kWh or more billed on energy lines posted in the last 12 months"
            value: "-K('load_off_high')"
          - when: "at least 100,000 but under 150,000 kWh"
            value: "-K('load_off_mid')"
          - when: "otherwise (under 100,000 kWh)"
            value: "0"
        baseline:
          load_adj: "0"
        evidence: [history]
        cross_difficulty: null
      - id: renewal_load_shape
        effect: parameter
        decides: shape_adj
        bindings: [lines_12m, peak_kwh, shape_ratio, shape_adj]
        ladder:
          - when: "the largest single energy line's kWh is at most 1.20 times the 12-month average per line"
            value: "-K('shape_off_flat')"
          - when: "that ratio is above 1.40"
            value: "K('shape_add_peaky')"
          - when: "otherwise (above 1.20 and up to 1.40)"
            value: "0"
        baseline:
          shape_adj: "0"
        evidence: [history]
        cross_difficulty: null
      - id: renewal_same_site_gas
        effect: parameter
        decides: gas_adj
        bindings: [gas_agreement, gas_therms_12m, gas_adj]
        ladder:
          - when: "5,000 therms or more billed in the last 12 months on the site's active Beacon Ridge commercial gas agreement"
            value: "-K('gas_off_high')"
          - when: "at least 1 but under 5,000 therms billed there"
            value: "-K('gas_off_low')"
          - when: "otherwise (no gas billed at the site in those months)"
            value: "0"
        baseline:
          gas_adj: "0"
        evidence: [cross_category, history]
        cross_difficulty: bizgas
      - id: renewal_tenure
        effect: parameter
        decides: tenure_adj
        bindings: [tenure_months, tenure_adj]
        ladder:
          - when: "60 or more whole months from the service start date to the handling date"
            value: "-K('tenure_off_long')"
          - when: "24 to 59 whole months"
            value: "-K('tenure_off_mid')"
          - when: "otherwise (under 24 months)"
            value: "0"
        baseline:
          tenure_adj: "0"
        evidence: [date]
        cross_difficulty: null
      - id: renewal_history
        effect: parameter
        decides: history_adj
        bindings: [loyalty_lines, history_adj]
        ladder:
          - when: "no renewal loyalty credit on the agreement's bill and the current term did not begin by automatic renewal"
            value: "-K('history_off_first')"
          - when: "at least one renewal loyalty credit on the agreement's bill"
            value: "-K('history_off_repeat')"
          - when: "otherwise"
            value: "0"
        baseline:
          history_adj: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard renewal rate is the renewal rate stated in the final options notice on the agreement, rounded half up to the cent per kWh.
      params: []
    inputs:
      history:
        - {table: bizpower_notices, aggregate: latest, field: new_rate_cents_kwh, filters: {notice_type: final_options_notice}}
        - {table: bizpower_notices, aggregate: latest, field: new_rate_cents_kwh, filters: {notice_type: initial_renewal_notice}}
        - {table: bizpower_billing, aggregate: sum, field: usage_kwh, within_months: 12, filters: {line_type: energy_charge}}
        - {table: bizpower_billing, aggregate: max, field: usage_kwh, filters: {line_type: energy_charge}}
        - {table: bizpower_billing, aggregate: count, field: bizpower_billing_id, filters: {line_type: renewal_loyalty_credit}}
        - {category: bizgas, table: bizgas_billing, aggregate: sum, field: usage_therms, within_months: 12, filters: {line_type: energy_charge}}
      cross_category: [bizgas]

  - id: bizpower_ext_closure_termination_fee
    base_policy_refs: [bizpower_etf, bizpower_site_transfer_terms]
    overwrite:
      - base_policy: bizpower_etf
        superseded_clause: >-
          The termination date is drop_requested_date for a cancellation and close_date for a switch-away or final bill.
        replaced_by: >-
          Termination anchor: when the cancellation was made because the business closed and a drop effective date is on record, the termination date is that drop effective date, the day supply actually ends; when no cancellation request is on record and the agreement carries a close date, as after a switch-away or a final bill, the termination date is that close date; in every other case the termination date is the date the business confirmed the cancellation.
      - base_policy: bizpower_etf
        superseded_clause: >-
          Under the per_remaining_kwh method, etf_remaining_kwh is the site's annual_kwh_usage times etf_months_remaining divided by remaining_usage_divisor_months, rounded half up to a whole kWh, and the fee is etf_remaining_kwh times etf_rate_usd_per_kwh rounded per charge_rounding, but not less than etf_minimum_usd; under the flat method the fee is etf_flat_usd; under the none method no fee applies.
        replaced_by: >-
          Under the per-remaining-kWh method the fee is put together in this order: first the remaining kWh, the monthly usage times the remaining months rounded half up to a whole kWh, are multiplied by the damages rate and rounded half up to the cent; then the larger of that amount and the minimum fee is taken; then the portfolio deduction is taken from that larger amount, and the result is the fee.
    trigger: state_due
    subject: [bizpower_fee_charge]
    computes: fee_amount_usd
    target_tool: post_early_termination_fee_113aa1f4
    params:
      recent_window_months: 3
      wind_down_low: 0.60
      wind_down_high: 0.90
      long_tenure_months: 18
      mid_tenure_months: 12
      rate_long: 0.0100
      rate_mid: 0.0115
      spend_low_usd: 3000
      spend_mid_usd: 6000
      min_low: 100.00
      min_mid: 125.00
      portfolio_long_months: 12
      deduct_long: 40.00
      deduct_short: 20.00
    rule: >-
      A business early termination fee is billed once on a small business agreement that stands drop pending or closed, on the site the agreement supplied at termination, and is worked out as this policy states.
      The standard early termination fee measures the termination from the date the business confirmed the cancellation.
      The remaining months are twelve times the difference in years plus the difference in months between the termination date and the contract end date, plus one when the day of the month of the contract end date is later than the day of the month of the termination date.
      The standard monthly usage of the site is the average kWh per energy line over the agreement's energy lines posted in the 12 months before the handling date, and the remaining kWh are the monthly usage times the remaining months, rounded half up to a whole kWh.
      Under the per-remaining-kWh method the standard fee is the remaining kWh times the plan's damages rate per kWh, rounded half up to the cent, but not less than the plan's minimum fee; under the flat method the fee is the plan's flat fee; under the none method no fee applies.
      No fee applies when the termination date falls within the plan's free window of calendar days before the contract end date, equality counting as inside, or within the plan's automatic-renewal free days after the start of an automatically renewed term, or within the plan's rescission window days after the utility's confirmation date, or when the plan waives the fee on an upgrade to a commercial and industrial contract and the cancellation was made for that upgrade with a Beacon Ridge commercial and industrial contract on the same site in pending or active status.
      Termination anchor: when the cancellation was made because the business closed and a drop effective date is on record, the termination date is that drop effective date, the day supply actually ends; when no cancellation request is on record and the agreement carries a close date, as after a switch-away or a final bill, the termination date is that close date; in every other case the termination date is the date the business confirmed the cancellation.
      Winding-down usage: the average kWh per energy line posted in the 3 months before the handling date is divided by the 12-month average per line; when that ratio is 0.60 or less, the monthly usage is the 3-month average; when it is above 0.60 and no more than 0.90, the monthly usage is the mean of the 3-month and the 12-month averages; when it is above 0.90, the monthly usage is the 12-month average.
      Damages rate: an agreement under which the site has been supplied for 18 whole months or more, counted from its service start date to the handling date, pays 0.0100 dollars per remaining kWh; one supplied for 12 to 17 whole months pays 0.0115 dollars; one supplied for fewer than 12 whole months pays the plan's damages rate per kWh.
      Minimum fee by site size: the energy lines posted on the agreement in the 12 months before the handling date are added up in dollars; under 3,000 dollars sets the minimum fee at 100.00 dollars; at least 3,000 but under 6,000 dollars sets it at 125.00 dollars; 6,000 dollars or more keeps the plan's minimum fee.
      Portfolio deduction: when the business holds an active Beacon Ridge commercial and industrial contract with 12 or more whole months from the handling date to that contract's end date, 40.00 dollars are deducted; when it holds an active one with fewer than 12 whole months left, 20.00 dollars are deducted; when it holds no active one, nothing is deducted.
      Under the per-remaining-kWh method the fee is put together in this order: first the remaining kWh, the monthly usage times the remaining months rounded half up to a whole kWh, are multiplied by the damages rate and rounded half up to the cent; then the larger of that amount and the minimum fee is taken; then the portfolio deduction is taken from that larger amount, and the result is the fee.
    prerequisite: []
    cross_category:
      - category: cni
        as: branch
        reads: [status, premise_id, contract_end_date]
        note: The portfolio deduction is decided from whether the business holds an active commercial and industrial contract and how many whole months it has left; the same holding decides the upgrade waiver.
    compute:
      - end_date: "F('contract_end_date')"
      - term_date: "F('drop_effective_date') if (F('drop_reason') == 'business_closed' and F('drop_effective_date') != '') else (F('close_date') if (F('drop_requested_date') == '' and F('close_date') != '') else F('drop_requested_date'))"
      - months_remaining: "MX(0, -MONTHS(end_date, term_date))"
      - kwh_12m: "SUM('bizpower_billing', 'usage_kwh', within_months=12, date_field='posted_date', line_type='energy_charge')"
      - lines_12m: "COUNT('bizpower_billing', within_months=12, date_field='posted_date', line_type='energy_charge')"
      - avg_12m: "kwh_12m / lines_12m if lines_12m > 0 else 0"
      - kwh_3m: "SUM('bizpower_billing', 'usage_kwh', within_months=K('recent_window_months'), date_field='posted_date', line_type='energy_charge')"
      - lines_3m: "COUNT('bizpower_billing', within_months=K('recent_window_months'), date_field='posted_date', line_type='energy_charge')"
      - avg_3m: "kwh_3m / lines_3m if lines_3m > 0 else 0"
      - wind_ratio: "avg_3m / avg_12m if avg_12m > 0 else 1"
      - monthly_kwh: "avg_3m if wind_ratio <= K('wind_down_low') else ((avg_3m + avg_12m) / 2 if wind_ratio <= K('wind_down_high') else avg_12m)"
      - remaining_kwh: "RND(monthly_kwh * months_remaining, 0)"
      - supplied_months: "MONTHS(F('service_start_date'), NOW)"
      - damages_rate: "K('rate_long') if supplied_months >= K('long_tenure_months') else (K('rate_mid') if supplied_months >= K('mid_tenure_months') else P('etf_rate_usd_per_kwh'))"
      - energy_spend_12m: "SUM('bizpower_billing', 'amount_usd', within_months=12, date_field='posted_date', line_type='energy_charge')"
      - minimum_fee: "K('min_low') if energy_spend_12m < K('spend_low_usd') else (K('min_mid') if energy_spend_12m < K('spend_mid_usd') else P('etf_minimum_usd'))"
      - cni_status: "CFIELD('cni', 'status', status='active')"
      - cni_end: "CFIELD('cni', 'contract_end_date', status='active')"
      - portfolio_deduction: "K('deduct_long') if (cni_status == 'active' and MONTHS(NOW, cni_end) >= K('portfolio_long_months')) else (K('deduct_short') if (cni_status == 'active' and MONTHS(NOW, cni_end) < K('portfolio_long_months')) else 0)"
      - waived: "DAYS(term_date, end_date) <= P('etf_free_window_days') or (F('auto_renewed') == True and DAYS(F('plan_change_date'), term_date) <= P('auto_renew_etf_free_days')) or (F('utility_confirmation_date') != '' and DAYS(F('utility_confirmation_date'), term_date) <= P('rescission_window_days')) or (P('etf_waive_on_cni_upgrade') == True and F('drop_reason') == 'cni_upgrade' and (CFIELD('cni', 'status', premise_id=F('premise_id')) == 'pending_enrollment' or CFIELD('cni', 'status', premise_id=F('premise_id')) == 'active'))"
      - per_kwh_fee: "MX(minimum_fee, RND(remaining_kwh * damages_rate, 2)) - portfolio_deduction"
      - result: "0 if (waived or P('etf_method') == 'none') else (P('etf_flat_usd') if P('etf_method') == 'flat' else RND(per_kwh_fee, 2))"
    compute_basis:
      end_date: "between the termination date and the contract end date"
      term_date: "Termination anchor: when the cancellation was made because the business closed and a drop effective date is on record, the termination date is that drop effective date, the day supply actually ends; when no cancellation request is on record and the agreement carries a close date, as after a switch-away or a final bill, the termination date is that close date; in every other case the termination date is the date the business confirmed the cancellation."
      months_remaining: "The remaining months are twelve times the difference in years plus the difference in months between the termination date and the contract end date, plus one when the day of the month of the contract end date is later than the day of the month of the termination date."
      kwh_12m: "The standard monthly usage of the site is the average kWh per energy line over the agreement's energy lines posted in the 12 months before the handling date,"
      lines_12m: "the average kWh per energy line over the agreement's energy lines posted in the 12 months before the handling date"
      avg_12m: "The standard monthly usage of the site is the average kWh per energy line over the agreement's energy lines posted in the 12 months before the handling date,"
      kwh_3m: "Winding-down usage: the average kWh per energy line posted in the 3 months before the handling date is divided by the 12-month average per line;"
      lines_3m: "the average kWh per energy line posted in the 3 months before the handling date"
      avg_3m: "the average kWh per energy line posted in the 3 months before the handling date"
      wind_ratio: "is divided by the 12-month average per line;"
      monthly_kwh: "when that ratio is 0.60 or less, the monthly usage is the 3-month average; when it is above 0.60 and no more than 0.90, the monthly usage is the mean of the 3-month and the 12-month averages; when it is above 0.90, the monthly usage is the 12-month average."
      remaining_kwh: "first the remaining kWh, the monthly usage times the remaining months rounded half up to a whole kWh,"
      supplied_months: "Damages rate: an agreement under which the site has been supplied for 18 whole months or more, counted from its service start date to the handling date,"
      damages_rate: "pays 0.0100 dollars per remaining kWh; one supplied for 12 to 17 whole months pays 0.0115 dollars; one supplied for fewer than 12 whole months pays the plan's damages rate per kWh."
      energy_spend_12m: "Minimum fee by site size: the energy lines posted on the agreement in the 12 months before the handling date are added up in dollars;"
      minimum_fee: "under 3,000 dollars sets the minimum fee at 100.00 dollars; at least 3,000 but under 6,000 dollars sets it at 125.00 dollars; 6,000 dollars or more keeps the plan's minimum fee."
      cni_status: "Portfolio deduction: when the business holds an active Beacon Ridge commercial and industrial contract with 12 or more whole months from the handling date to that contract's end date,"
      cni_end: "with 12 or more whole months from the handling date to that contract's end date"
      portfolio_deduction: "Portfolio deduction: when the business holds an active Beacon Ridge commercial and industrial contract with 12 or more whole months from the handling date to that contract's end date, 40.00 dollars are deducted; when it holds an active one with fewer than 12 whole months left, 20.00 dollars are deducted; when it holds no active one, nothing is deducted."
      waived: "No fee applies when the termination date falls within the plan's free window of calendar days before the contract end date, equality counting as inside, or within the plan's automatic-renewal free days after the start of an automatically renewed term, or within the plan's rescission window days after the utility's confirmation date, or when the plan waives the fee on an upgrade to a commercial and industrial contract and the cancellation was made for that upgrade with a Beacon Ridge commercial and industrial contract on the same site in pending or active status."
      per_kwh_fee: "are multiplied by the damages rate and rounded half up to the cent; then the larger of that amount and the minimum fee is taken; then the portfolio deduction is taken from that larger amount, and the result is the fee."
      result: "under the flat method the fee is the plan's flat fee; under the none method no fee applies."
    factors:
      - id: termination_anchor
        effect: method
        decides: term_date
        bindings: [term_date, months_remaining]
        ladder:
          - when: "the cancellation was made because the business closed and a drop effective date is on record"
            method: "the termination date is the drop effective date"
          - when: "no cancellation request is on record and the agreement carries a close date"
            method: "the termination date is the close date"
          - when: "otherwise"
            method: "the termination date is the date the business confirmed the cancellation"
        baseline:
          term_date: "F('drop_requested_date')"
        evidence: [date]
        cross_difficulty: null
      - id: winding_down_usage
        effect: method
        decides: monthly_kwh
        bindings: [kwh_12m, lines_12m, avg_12m, kwh_3m, lines_3m, avg_3m, wind_ratio, monthly_kwh]
        ladder:
          - when: "the 3-month average kWh per energy line is 0.60 or less of the 12-month average"
            method: "the monthly usage is the 3-month average"
          - when: "that ratio is above 0.60 and no more than 0.90"
            method: "the monthly usage is the mean of the 3-month and 12-month averages"
          - when: "otherwise (above 0.90)"
            method: "the monthly usage is the 12-month average"
        baseline:
          monthly_kwh: "avg_12m"
        evidence: [history]
        cross_difficulty: null
      - id: supplied_tenure_damages_rate
        effect: parameter
        decides: damages_rate
        bindings: [supplied_months, damages_rate]
        ladder:
          - when: "the site has been supplied under the agreement for 18 whole months or more"
            value: "K('rate_long')"
          - when: "12 to 17 whole months"
            value: "K('rate_mid')"
          - when: "otherwise (fewer than 12 months)"
            value: "P('etf_rate_usd_per_kwh')"
        baseline:
          damages_rate: "P('etf_rate_usd_per_kwh')"
        evidence: [date]
        cross_difficulty: null
      - id: site_size_minimum_fee
        effect: parameter
        decides: minimum_fee
        bindings: [energy_spend_12m, minimum_fee]
        ladder:
          - when: "energy lines posted in the last 12 months total under 3,000 dollars"
            value: "K('min_low')"
          - when: "at least 3,000 but under 6,000 dollars"
            value: "K('min_mid')"
          - when: "otherwise (6,000 dollars or more)"
            value: "P('etf_minimum_usd')"
        baseline:
          minimum_fee: "P('etf_minimum_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: portfolio_deduction
        effect: parameter
        decides: portfolio_deduction
        bindings: [cni_status, cni_end, portfolio_deduction]
        ladder:
          - when: "the business holds an active Beacon Ridge commercial and industrial contract and 12 or more whole months remain to its end date"
            value: "K('deduct_long')"
          - when: "the business holds an active Beacon Ridge commercial and industrial contract and fewer than 12 whole months remain"
            value: "K('deduct_short')"
          - when: "otherwise (no active commercial and industrial contract)"
            value: "0"
        baseline:
          portfolio_deduction: "0"
        evidence: [cross_category, date]
        cross_difficulty: cni
    baseline:
      rule: >-
        The standard early termination fee measures the termination from the date the business confirmed the cancellation. The remaining months are twelve times the difference in years plus the difference in months between the termination date and the contract end date, plus one when the day of the month of the contract end date is later than the day of the month of the termination date. The standard monthly usage of the site is the average kWh per energy line over the agreement's energy lines posted in the 12 months before the handling date, and the remaining kWh are the monthly usage times the remaining months, rounded half up to a whole kWh. Under the per-remaining-kWh method the standard fee is the remaining kWh times the plan's damages rate per kWh, rounded half up to the cent, but not less than the plan's minimum fee; under the flat method the fee is the plan's flat fee; under the none method no fee applies.
      params: [etf_method, etf_rate_usd_per_kwh, etf_minimum_usd, etf_flat_usd]
    inputs:
      history:
        - {table: bizpower_billing, aggregate: sum, field: usage_kwh, within_months: 12, filters: {line_type: energy_charge}}
        - {table: bizpower_billing, aggregate: sum, field: usage_kwh, within_months: 3, filters: {line_type: energy_charge}}
        - {table: bizpower_billing, aggregate: sum, field: amount_usd, within_months: 12, filters: {line_type: energy_charge}}
      cross_category: [cni]

  - id: bizpower_ext_renewal_loyalty_credit
    base_policy_refs: [bizpower_agg_multi_site, bizpower_renewal, bizpower_signup_credit]
    overwrite:
      - base_policy: bizpower_renewal
        superseded_clause: >-
          Each explicit renewal earns one renewal_loyalty_credit equal to the renewal_loyalty_credit_usd of the plan renewed into; an automatic renewal earns none.
        replaced_by: >-
          An explicit renewal accepted on or before the contract end date earns one renewal loyalty credit, worked out as this policy states; an automatic renewal earns none.
    trigger: state_due
    subject: [bizpower_credit]
    computes: credit_amount_usd
    target_tool: post_renewal_loyalty_credit_e53d7f06
    params:
      spend_high_usd: 10000
      spend_mid_usd: 5000
      spend_rate_high: 0.015
      spend_rate_mid: 0.005
      commit_months_long: 36
      commit_months_mid: 24
      commit_bonus_long: 40.00
      commit_bonus_mid: 20.00
      portfolio_active: 60.00
      portfolio_pending: 30.00
      supply_full_lines: 12
      supply_part_lines: 6
      supply_bonus_full: 20.00
      supply_bonus_part: 10.00
      decision_bonus_window: 15.00
      decision_bonus_no_notice: 25.00
      timing_early_days: 30
      timing_mid_days: 14
      timing_mult_early: 1.25
      timing_mult_mid: 1.10
    rule: >-
      An explicit renewal accepted on or before the contract end date earns one renewal loyalty credit, worked out as this policy states; an automatic renewal earns none.
      The loyalty credit is fixed only after the agreement shows a renewal election marked accepted, dated earlier than the day its renewed term begins.
      The loyalty credit is worked out only once every billed cycle of the agreement in the 12 months before the handling date carries the multi-site credit due on it.
      The loyalty credit is not posted until every other agreement of the business that stands drop pending or closed with an early termination fee owed carries that fee on its bill.
      The loyalty credit is posted against the agreement's latest billed cycle and carries that cycle's first day as its billing cycle.
      The standard loyalty credit is the renewal loyalty credit of the plan renewed into, rounded half up to the cent.
      Spend-based amount: the amounts of every line posted on the agreement in the 12 months before the handling date, the handling date itself included, charges, credits and rebill credits alike, are added into the agreement's net billed spend; a net billed spend of 10,000 dollars or more earns 1.5 percent of that spend in place of the plan's loyalty credit; a net billed spend of at least 5,000 but under 10,000 dollars earns the plan's loyalty credit plus 0.5 percent of that spend; a lower net billed spend earns the plan's loyalty credit.
      Commitment bonus: the renewed term's length is the whole months from its start date to its end date plus one; a renewed term of 36 months or longer adds 40.00 dollars; one of 24 to 35 months adds 20.00 dollars; a shorter one adds nothing.
      Portfolio bonus: a business holding an active Beacon Ridge commercial and industrial contract adds 60.00 dollars; a business whose Beacon Ridge commercial and industrial contract is pending enrollment adds 30.00 dollars; a business holding neither adds nothing.
      Supply-continuity bonus: the energy lines posted on the agreement in the 12 months before the handling date are counted; 12 or more add 20.00 dollars; 6 to 11 add 10.00 dollars; fewer than 6 add nothing.
      Decision bonus: when a final options notice is on record and the acceptance is dated no later than that notice's date plus the plan's opt-out window days, 15.00 dollars are added; when no final options notice is on record, 25.00 dollars are added; when the acceptance is dated after the opt-out window closed, nothing is added.
      Timing multiplier: the calendar days from the acceptance date to the start date of the renewed term are counted; 30 days or more multiply the loyalty subtotal by 1.25; 14 to 29 days multiply it by 1.10; fewer than 14 days leave it unchanged.
      The credit is put together in this order: first the spend-based amount, the commitment bonus, the portfolio bonus, the supply-continuity bonus and the decision bonus are added into one loyalty subtotal; that subtotal is then multiplied by the timing multiplier; the result is rounded half up to the cent only at the end.
    prerequisite:
      - problem: bizpower_ext_renewal_rate_on_acceptance
        kind: value_input
        gate: accepted
        form: state
        policy_source: >-
          The loyalty credit is fixed only after the agreement shows a renewal election marked accepted, dated earlier than the day its renewed term begins.
        condition: >-
          The agreement shows renewal election accepted with a renewal election date earlier than its plan change date.
        resolved_by: accept_renewal_offer_d4784688
        effect: >-
          The renewal acceptance flips the accepted binding from false to true and records the renewed term's start date and end date and the acceptance date, from which the commitment bonus, the decision bonus and the timing multiplier are read; without it the credit is not earned.
      - problem: bizpower_ext_multi_site_credit_amount
        kind: value_input
        gate: net_spend
        form: state
        policy_source: >-
          The loyalty credit is worked out only once every billed cycle of the agreement in the 12 months before the handling date carries the multi-site credit due on it.
        condition: >-
          Every billed cycle of the agreement posted in the 12 months before the handling date on which the business had at least the plan's multi-site minimum of supplied sites carries one multi-site credit line.
        resolved_by: post_multi_site_credit_fd52d0a7
        effect: >-
          Posting the missing multi-site credit adds its negative amount to the agreement's net billed spend of the last 12 months, which lowers the spend-based amount of the loyalty credit.
      - problem: bizpower_ext_closure_termination_fee
        kind: state_gate
        gate: bizpower_billing.line_type
        form: state
        policy_source: >-
          The loyalty credit is not posted until every other agreement of the business that stands drop pending or closed with an early termination fee owed carries that fee on its bill.
        condition: >-
          Each other agreement of the same business in drop pending or closed status whose cancellation owes an early termination fee carries an early termination fee line on its bill.
        resolved_by: post_early_termination_fee_113aa1f4
        effect: >-
          Billing the owed early termination fee on the cancelled agreement satisfies the condition under which the loyalty credit may be posted; the credit's amount does not read that fee.
    cross_category:
      - category: cni
        as: branch
        reads: [status]
        note: The portfolio bonus is decided from whether the business holds an active or a pending commercial and industrial contract.
    compute:
      - accepted: "F('renewal_election') == 'accepted' and F('plan_change_date') != '' and F('renewal_election_date') != '' and DAYS(F('renewal_election_date'), F('plan_change_date')) >= 1"
      - plan_credit: "P('renewal_loyalty_credit_usd')"
      - net_spend: "SUM('bizpower_billing', 'amount_usd', within_months=12, date_field='posted_date')"
      - spend_amount: "K('spend_rate_high') * net_spend if net_spend >= K('spend_high_usd') else (plan_credit + K('spend_rate_mid') * net_spend if net_spend >= K('spend_mid_usd') else plan_credit)"
      - renewed_term_months: "MONTHS(F('plan_change_date'), F('contract_end_date')) + 1 if accepted else 0"
      - commitment_bonus: "K('commit_bonus_long') if renewed_term_months >= K('commit_months_long') else (K('commit_bonus_mid') if renewed_term_months >= K('commit_months_mid') else 0)"
      - cni_status: "CFIELD('cni', 'status')"
      - portfolio_bonus: "K('portfolio_active') if cni_status == 'active' else (K('portfolio_pending') if cni_status == 'pending_enrollment' else 0)"
      - supplied_lines_12m: "COUNT('bizpower_billing', within_months=12, date_field='posted_date', line_type='energy_charge')"
      - continuity_bonus: "K('supply_bonus_full') if supplied_lines_12m >= K('supply_full_lines') else (K('supply_bonus_part') if supplied_lines_12m >= K('supply_part_lines') else 0)"
      - final_notice_date: "LATEST('bizpower_notices', 'notice_date', date_field='notice_date', notice_type='final_options_notice')"
      - decision_bonus: "K('decision_bonus_window') if (final_notice_date != None and accepted and DAYS(final_notice_date, F('renewal_election_date')) <= P('opt_out_window_days')) else (K('decision_bonus_no_notice') if final_notice_date == None else 0)"
      - lead_days: "DAYS(F('renewal_election_date'), F('plan_change_date')) if accepted else 0"
      - timing_mult: "K('timing_mult_early') if lead_days >= K('timing_early_days') else (K('timing_mult_mid') if lead_days >= K('timing_mid_days') else 1)"
      - loyalty_subtotal: "spend_amount + commitment_bonus + portfolio_bonus + continuity_bonus + decision_bonus"
      - result: "RND(loyalty_subtotal * timing_mult, 2) if accepted else 0"
    compute_basis:
      accepted: "The loyalty credit is fixed only after the agreement shows a renewal election marked accepted, dated earlier than the day its renewed term begins."
      plan_credit: "The standard loyalty credit is the renewal loyalty credit of the plan renewed into, rounded half up to the cent."
      net_spend: "Spend-based amount: the amounts of every line posted on the agreement in the 12 months before the handling date, the handling date itself included, charges, credits and rebill credits alike, are added into the agreement's net billed spend;"
      spend_amount: "a net billed spend of 10,000 dollars or more earns 1.5 percent of that spend in place of the plan's loyalty credit; a net billed spend of at least 5,000 but under 10,000 dollars earns the plan's loyalty credit plus 0.5 percent of that spend; a lower net billed spend earns the plan's loyalty credit."
      renewed_term_months: "Commitment bonus: the renewed term's length is the whole months from its start date to its end date plus one;"
      commitment_bonus: "a renewed term of 36 months or longer adds 40.00 dollars; one of 24 to 35 months adds 20.00 dollars; a shorter one adds nothing."
      cni_status: "Portfolio bonus: a business holding an active Beacon Ridge commercial and industrial contract adds 60.00 dollars;"
      portfolio_bonus: "Portfolio bonus: a business holding an active Beacon Ridge commercial and industrial contract adds 60.00 dollars; a business whose Beacon Ridge commercial and industrial contract is pending enrollment adds 30.00 dollars; a business holding neither adds nothing."
      supplied_lines_12m: "Supply-continuity bonus: the energy lines posted on the agreement in the 12 months before the handling date are counted;"
      continuity_bonus: "12 or more add 20.00 dollars; 6 to 11 add 10.00 dollars; fewer than 6 add nothing."
      final_notice_date: "when a final options notice is on record"
      decision_bonus: "Decision bonus: when a final options notice is on record and the acceptance is dated no later than that notice's date plus the plan's opt-out window days, 15.00 dollars are added; when no final options notice is on record, 25.00 dollars are added; when the acceptance is dated after the opt-out window closed, nothing is added."
      lead_days: "Timing multiplier: the calendar days from the acceptance date to the start date of the renewed term are counted;"
      timing_mult: "30 days or more multiply the loyalty subtotal by 1.25; 14 to 29 days multiply it by 1.10; fewer than 14 days leave it unchanged."
      loyalty_subtotal: "first the spend-based amount, the commitment bonus, the portfolio bonus, the supply-continuity bonus and the decision bonus are added into one loyalty subtotal;"
      result: "that subtotal is then multiplied by the timing multiplier; the result is rounded half up to the cent only at the end."
    factors:
      - id: spend_based_loyalty
        effect: method
        decides: spend_amount
        bindings: [net_spend, spend_amount]
        ladder:
          - when: "net billed spend over the last 12 months of 10,000 dollars or more"
            method: "the credit amount is 1.5 percent of the net billed spend, in place of the plan's loyalty credit"
          - when: "net billed spend of at least 5,000 but under 10,000 dollars"
            method: "the credit amount is the plan's loyalty credit plus 0.5 percent of the net billed spend"
          - when: "otherwise (under 5,000 dollars)"
            method: "the credit amount is the plan's loyalty credit"
        baseline:
          spend_amount: "plan_credit"
        evidence: [history]
        cross_difficulty: null
      - id: renewal_commitment_bonus
        effect: parameter
        decides: commitment_bonus
        bindings: [renewed_term_months, commitment_bonus]
        ladder:
          - when: "the renewed term runs 36 months or longer"
            value: "K('commit_bonus_long')"
          - when: "the renewed term runs 24 to 35 months"
            value: "K('commit_bonus_mid')"
          - when: "otherwise (shorter)"
            value: "0"
        baseline:
          commitment_bonus: "0"
        evidence: [date]
        cross_difficulty: null
      - id: large_facility_portfolio_bonus
        effect: parameter
        decides: portfolio_bonus
        bindings: [cni_status, portfolio_bonus]
        ladder:
          - when: "the business holds an active Beacon Ridge commercial and industrial contract"
            value: "K('portfolio_active')"
          - when: "the business's Beacon Ridge commercial and industrial contract is pending enrollment"
            value: "K('portfolio_pending')"
          - when: "otherwise"
            value: "0"
        baseline:
          portfolio_bonus: "0"
        evidence: [cross_category]
        cross_difficulty: cni
      - id: supply_continuity_bonus
        effect: parameter
        decides: continuity_bonus
        bindings: [supplied_lines_12m, continuity_bonus]
        ladder:
          - when: "12 or more energy lines posted on the agreement in the last 12 months"
            value: "K('supply_bonus_full')"
          - when: "6 to 11 energy lines"
            value: "K('supply_bonus_part')"
          - when: "otherwise (fewer than 6)"
            value: "0"
        baseline:
          continuity_bonus: "0"
        evidence: [history]
        cross_difficulty: null
      - id: opt_out_decision_bonus
        effect: parameter
        decides: decision_bonus
        bindings: [final_notice_date, decision_bonus]
        ladder:
          - when: "a final options notice is on record and the acceptance is dated within its opt-out window"
            value: "K('decision_bonus_window')"
          - when: "no final options notice is on record"
            value: "K('decision_bonus_no_notice')"
          - when: "otherwise (accepted after the opt-out window closed)"
            value: "0"
        baseline:
          decision_bonus: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: acceptance_timing_multiplier
        effect: parameter
        decides: timing_mult
        bindings: [lead_days, timing_mult]
        ladder:
          - when: "30 or more calendar days from the acceptance date to the start date of the renewed term"
            value: "K('timing_mult_early')"
          - when: "14 to 29 calendar days"
            value: "K('timing_mult_mid')"
          - when: "otherwise (fewer than 14 days)"
            value: "1"
        baseline:
          timing_mult: "1"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard loyalty credit is the renewal loyalty credit of the plan renewed into, rounded half up to the cent.
      params: [renewal_loyalty_credit_usd]
    inputs:
      history:
        - {table: bizpower_billing, aggregate: sum, field: amount_usd, within_months: 12, filters: {}}
        - {table: bizpower_billing, aggregate: count, field: bizpower_billing_id, within_months: 12, filters: {line_type: energy_charge}}
        - {table: bizpower_notices, aggregate: latest, field: notice_date, filters: {notice_type: final_options_notice}}
      cross_category: [cni]

  - id: bizpower_ext_grace_renewal_rate
    base_policy_refs: [bizpower_renewal, bizpower_auto_renewal]
    overwrite:
      - base_policy: bizpower_renewal
        superseded_clause: >-
          A business renews explicitly by accepting the offer in the governing renewal notice: the agreement takes the offered plan, its term_months and the offered renewal rate, and renewal_election becomes accepted.
        replaced_by: >-
          A business whose agreement has rolled over to month-to-month and which accepts its renewal offer inside the grace period takes the plan and the term offered in the final options notice, its renewal election becomes accepted, and its grace-period renewal rate is worked out as this policy states rather than taken unchanged from the notice.
      - base_policy: bizpower_renewal
        superseded_clause: >-
          Each explicit renewal earns one renewal_loyalty_credit equal to the renewal_loyalty_credit_usd of the plan renewed into; an automatic renewal earns none.
        replaced_by: >-
          A renewal accepted after the agreement has rolled over earns no renewal loyalty credit, the loyalty credit being reserved for renewals accepted on or before the contract end date.
    trigger: on_request
    subject: [bizpower_renew]
    computes: renewal_rate_cents_kwh
    target_tool: accept_grace_period_renewal_906a45d5
    params:
      requote_adder: 0.15
      early_decline_days: 7
      quick_return_days: 5
      return_days: 10
      quick_return_off: 0.06
      return_off: 0.03
      gas_fixed_off: 0.08
      gas_index_off: 0.04
      gap_wide_cents: 2.50
      gap_mid_cents: 1.00
      gap_wide_off: 0.06
      gap_mid_off: 0.03
      year_full_lines: 12
      year_part_lines: 6
      year_full_off: 0.04
      year_part_off: 0.02
    rule: >-
      A business whose agreement has rolled over to month-to-month and which accepts its renewal offer inside the grace period takes the plan and the term offered in the final options notice, its renewal election becomes accepted, and its grace-period renewal rate is worked out as this policy states rather than taken unchanged from the notice.
      The renewed term starts on the acceptance date and ends on the day before the same calendar day the renewed term's months later; when that calendar day does not exist in the target month, the last day of that month is used before the day is subtracted.
      A renewal accepted after the agreement has rolled over earns no renewal loyalty credit, the loyalty credit being reserved for renewals accepted on or before the contract end date.
      The standard grace-period renewal rate is the renewal rate stated in the final options notice that announced the expired term's end, rounded half up to the cent per kWh.
      Late-notice make-good: when the initial renewal notice for the expired term is missing or was issued outside the window of 90 to 60 days before the expired contract end date, or the final options notice is missing or was issued fewer than 30 days before it, the grace-period renewal rate starts from the lower of the final options notice's renewal rate and the expiring term's rate that the agreement still carries as its held rate; when both notices were issued inside their windows and the business declined automatic renewal no more than 7 days after the final options notice's date, a prompt opt-out now reversed, it starts from the final options notice's renewal rate plus a 0.15-cent re-quote adder; in every other case, such as a decline made later in the opt-out window or an expiry while a cancellation was pending, it starts from the final options notice's renewal rate.
      Quick-return adjustment: the calendar days from the rollover date to the handling date are counted; 5 days or fewer take 0.06 cents per kWh off the grace-period renewal rate; 6 to 10 days take 0.03 cents off; more than 10 days take nothing off.
      Site gas adjustment: when the agreement's site takes Beacon Ridge commercial gas under an active agreement on a plan with a fixed term, the grace-period renewal rate is lowered by 0.08 cents per kWh; when that active gas agreement is on the month-to-month index plan, by 0.04 cents; when the site has no active Beacon Ridge commercial gas agreement, it is not lowered.
      Rollover-gap adjustment: the final options notice's month-to-month rate minus its renewal rate is the rollover gap; a gap of 2.50 cents or more takes 0.06 cents per kWh off the grace-period renewal rate; a gap of at least 1.00 but under 2.50 cents takes 0.03 cents off; a smaller gap takes nothing off.
      Full-year adjustment: the energy lines posted on the agreement in the 12 months before the handling date are counted; 12 or more take 0.04 cents per kWh off the grace-period renewal rate; 6 to 11 take 0.02 cents off; fewer than 6 take nothing off.
      The grace-period renewal rate is put together in this order: the starting rate from the late-notice make-good comes first, the four adjustments are then added to it once, and the result is rounded half up to the cent per kWh only at the end.
    prerequisite: []
    cross_category:
      - category: bizgas
        as: branch
        reads: [status, premise_id, term_months]
        note: The site gas adjustment is decided from whether the agreement's site holds an active Beacon Ridge commercial gas agreement and whether its plan carries a fixed term.
    compute:
      - expired_end: "LATEST('bizpower_notices', 'effective_date', date_field='notice_date', notice_type='final_options_notice')"
      - final_rate: "LATEST('bizpower_notices', 'new_rate_cents_kwh', date_field='notice_date', notice_type='final_options_notice')"
      - g_init_date: "LATEST('bizpower_notices', 'notice_date', date_field='notice_date', notice_type='initial_renewal_notice')"
      - g_final_date: "LATEST('bizpower_notices', 'notice_date', date_field='notice_date', notice_type='final_options_notice')"
      - g_init_ok: "g_init_date != None and expired_end != None and DAYS(g_init_date, expired_end) <= P('renewal_notice_earliest_days') and DAYS(g_init_date, expired_end) >= P('renewal_notice_latest_days')"
      - g_final_ok: "g_final_date != None and expired_end != None and DAYS(g_final_date, expired_end) >= P('final_options_notice_latest_days')"
      - held_rate: "F('contract_rate_cents_kwh')"
      - grace_start_rate: "MN(final_rate, held_rate) if (not g_init_ok or not g_final_ok) else (final_rate + K('requote_adder') if (g_init_ok and g_final_ok and F('renewal_election') == 'declined' and DAYS(g_final_date, F('renewal_election_date')) <= K('early_decline_days')) else final_rate)"
      - grace_days: "DAYS(F('plan_change_date'), NOW)"
      - quick_return_adj: "-K('quick_return_off') if grace_days <= K('quick_return_days') else (-K('return_off') if grace_days <= K('return_days') else 0)"
      - site_gas_status: "CFIELD('bizgas', 'status', premise_id=F('premise_id'), status='active')"
      - site_gas_term: "CPARAM('bizgas', 'term_months', premise_id=F('premise_id'), status='active')"
      - site_gas_adj: "-K('gas_fixed_off') if (site_gas_status == 'active' and site_gas_term > 0) else (-K('gas_index_off') if (site_gas_status == 'active' and site_gas_term == 0) else 0)"
      - rollover_rate: "LATEST('bizpower_notices', 'rollover_rate_cents_kwh', date_field='notice_date', notice_type='final_options_notice')"
      - rollover_gap: "rollover_rate - final_rate"
      - gap_adj: "-K('gap_wide_off') if rollover_gap >= K('gap_wide_cents') else (-K('gap_mid_off') if rollover_gap >= K('gap_mid_cents') else 0)"
      - year_lines: "COUNT('bizpower_billing', within_months=12, date_field='posted_date', line_type='energy_charge')"
      - full_year_adj: "-K('year_full_off') if year_lines >= K('year_full_lines') else (-K('year_part_off') if year_lines >= K('year_part_lines') else 0)"
      - result: "RND(grace_start_rate + quick_return_adj + site_gas_adj + gap_adj + full_year_adj, 2)"
    compute_basis:
      expired_end: "the final options notice that announced the expired term's end"
      final_rate: "The standard grace-period renewal rate is the renewal rate stated in the final options notice that announced the expired term's end, rounded half up to the cent per kWh."
      g_init_date: "when the initial renewal notice for the expired term is missing or was issued outside the window of 90 to 60 days before the expired contract end date,"
      g_final_date: "or the final options notice is missing or was issued fewer than 30 days before it,"
      g_init_ok: "when the initial renewal notice for the expired term is missing or was issued outside the window of 90 to 60 days before the expired contract end date,"
      g_final_ok: "or the final options notice is missing or was issued fewer than 30 days before it,"
      held_rate: "the expiring term's rate that the agreement still carries as its held rate;"
      grace_start_rate: "Late-notice make-good: when the initial renewal notice for the expired term is missing or was issued outside the window of 90 to 60 days before the expired contract end date, or the final options notice is missing or was issued fewer than 30 days before it, the grace-period renewal rate starts from the lower of the final options notice's renewal rate and the expiring term's rate that the agreement still carries as its held rate; when both notices were issued inside their windows and the business declined automatic renewal no more than 7 days after the final options notice's date, a prompt opt-out now reversed, it starts from the final options notice's renewal rate plus a 0.15-cent re-quote adder; in every other case, such as a decline made later in the opt-out window or an expiry while a cancellation was pending, it starts from the final options notice's renewal rate."
      grace_days: "Quick-return adjustment: the calendar days from the rollover date to the handling date are counted;"
      quick_return_adj: "5 days or fewer take 0.06 cents per kWh off the grace-period renewal rate; 6 to 10 days take 0.03 cents off; more than 10 days take nothing off."
      site_gas_status: "Site gas adjustment: when the agreement's site takes Beacon Ridge commercial gas under an active agreement on a plan with a fixed term,"
      site_gas_term: "when that active gas agreement is on the month-to-month index plan,"
      site_gas_adj: "Site gas adjustment: when the agreement's site takes Beacon Ridge commercial gas under an active agreement on a plan with a fixed term, the grace-period renewal rate is lowered by 0.08 cents per kWh; when that active gas agreement is on the month-to-month index plan, by 0.04 cents; when the site has no active Beacon Ridge commercial gas agreement, it is not lowered."
      rollover_rate: "the final options notice's month-to-month rate minus its renewal rate is the rollover gap;"
      rollover_gap: "the final options notice's month-to-month rate minus its renewal rate is the rollover gap;"
      gap_adj: "a gap of 2.50 cents or more takes 0.06 cents per kWh off the grace-period renewal rate; a gap of at least 1.00 but under 2.50 cents takes 0.03 cents off; a smaller gap takes nothing off."
      year_lines: "Full-year adjustment: the energy lines posted on the agreement in the 12 months before the handling date are counted;"
      full_year_adj: "12 or more take 0.04 cents per kWh off the grace-period renewal rate; 6 to 11 take 0.02 cents off; fewer than 6 take nothing off."
      result: "the starting rate from the late-notice make-good comes first, the four adjustments are then added to it once, and the result is rounded half up to the cent per kWh only at the end."
    factors:
      - id: late_notice_make_good
        effect: method
        decides: grace_start_rate
        bindings: [g_init_date, g_final_date, g_init_ok, g_final_ok, held_rate, grace_start_rate]
        ladder:
          - when: "the initial renewal notice is missing or outside its 90-to-60-day window, or the final options notice is missing or issued fewer than 30 days before the expired end"
            method: "start from the lower of the final options notice's renewal rate and the held expiring rate"
          - when: "both notices inside their windows and the business declined automatic renewal no more than 7 days after the final options notice's date"
            method: "start from the final options notice's renewal rate plus the 0.15-cent re-quote adder"
          - when: "otherwise"
            method: "start from the final options notice's renewal rate"
        baseline:
          grace_start_rate: "final_rate"
        evidence: [history, date]
        cross_difficulty: null
      - id: quick_return
        effect: parameter
        decides: quick_return_adj
        bindings: [grace_days, quick_return_adj]
        ladder:
          - when: "5 calendar days or fewer from the rollover date to the handling date"
            value: "-K('quick_return_off')"
          - when: "6 to 10 days"
            value: "-K('return_off')"
          - when: "otherwise (more than 10 days)"
            value: "0"
        baseline:
          quick_return_adj: "0"
        evidence: [date]
        cross_difficulty: null
      - id: site_gas_plan
        effect: parameter
        decides: site_gas_adj
        bindings: [site_gas_status, site_gas_term, site_gas_adj]
        ladder:
          - when: "the agreement's site holds an active Beacon Ridge commercial gas agreement on a plan with a fixed term"
            value: "-K('gas_fixed_off')"
          - when: "that active gas agreement is on the month-to-month index plan"
            value: "-K('gas_index_off')"
          - when: "otherwise (no active Beacon Ridge commercial gas agreement at the site)"
            value: "0"
        baseline:
          site_gas_adj: "0"
        evidence: [cross_category]
        cross_difficulty: bizgas
      - id: rollover_gap
        effect: parameter
        decides: gap_adj
        bindings: [rollover_rate, rollover_gap, gap_adj]
        ladder:
          - when: "the final options notice's month-to-month rate exceeds its renewal rate by 2.50 cents or more"
            value: "-K('gap_wide_off')"
          - when: "by at least 1.00 but under 2.50 cents"
            value: "-K('gap_mid_off')"
          - when: "otherwise (under 1.00 cent)"
            value: "0"
        baseline:
          gap_adj: "0"
        evidence: [history]
        cross_difficulty: null
      - id: full_year_supply
        effect: parameter
        decides: full_year_adj
        bindings: [year_lines, full_year_adj]
        ladder:
          - when: "12 or more energy lines posted on the agreement in the last 12 months"
            value: "-K('year_full_off')"
          - when: "6 to 11 energy lines"
            value: "-K('year_part_off')"
          - when: "otherwise (fewer than 6)"
            value: "0"
        baseline:
          full_year_adj: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard grace-period renewal rate is the renewal rate stated in the final options notice that announced the expired term's end, rounded half up to the cent per kWh.
      params: []
    inputs:
      history:
        - {table: bizpower_notices, aggregate: latest, field: new_rate_cents_kwh, filters: {notice_type: final_options_notice}}
        - {table: bizpower_notices, aggregate: latest, field: rollover_rate_cents_kwh, filters: {notice_type: final_options_notice}}
        - {table: bizpower_notices, aggregate: latest, field: notice_date, filters: {notice_type: initial_renewal_notice}}
        - {table: bizpower_billing, aggregate: count, field: bizpower_billing_id, within_months: 12, filters: {line_type: energy_charge}}
      cross_category: [bizgas]

  - id: bizpower_ext_relocation_transfer_fee
    base_policy_refs: [bizpower_site_transfer_terms]
    overwrite:
      - base_policy: bizpower_site_transfer_terms
        superseded_clause: >-
          The transfer takes effect on the new site's next scheduled meter read date and one site_transfer_fee of site_transfer_fee_usd is billed with premise_id set to the new site.
        replaced_by: >-
          The transfer takes effect on the new site's next scheduled meter read date, and one site transfer fee is billed on the agreement with the new site recorded on it, its amount worked out as this policy states rather than taken as the plan's transfer fee alone.
    trigger: on_request
    subject: [bizpower_site_transfer]
    computes: transfer_fee_usd
    target_tool: transfer_agreement_site_58988442
    params:
      term_long_months: 12
      term_mid_months: 6
      term_credit_long: 20.00
      term_credit_mid: 10.00
      tenure_long_months: 36
      tenure_mid_months: 12
      tenure_share_long: 0.5
      gas_move_credit: 12.00
      gas_keep_credit: 6.00
      usage_high_kwh: 40000
      usage_mid_kwh: 20000
      usage_credit_high: 8.00
      usage_credit_mid: 4.00
    rule: >-
      When a business relocates, an agreement whose plan allows site transfers is moved to another commercial site of the same business for the remainder of its term, keeping its plan, contract rate and contract end date.
      The transfer takes effect on the new site's next scheduled meter read date, and one site transfer fee is billed on the agreement with the new site recorded on it, its amount worked out as this policy states rather than taken as the plan's transfer fee alone.
      The relocation of an agreement that rolled over to month-to-month is not recorded until the agreement again shows a fixed term, with a term length, a contract end date and a renewal election accepted on the day its new term began.
      The standard site transfer fee is the plan's site transfer fee, rounded half up to the cent; a plan whose transfer fee is zero bills no fee.
      Remaining-term credit: the whole months from the handling date to the agreement's contract end date are counted; 12 months or more take 20.00 dollars off the site transfer fee; 6 to 11 months take 10.00 dollars off; fewer than 6 months take nothing off.
      Gas-move credit: when the business has a Beacon Ridge commercial gas agreement pending enrollment, its gas following it, 12.00 dollars come off the site transfer fee; when the business has no pending one but holds an active Beacon Ridge commercial gas agreement, 6.00 dollars come off; when it holds neither, nothing comes off.
      Site-usage credit: the kWh of the agreement's energy lines posted in the 12 months before the handling date are added up; 40,000 kWh or more take 8.00 dollars off the site transfer fee; at least 20,000 but under 40,000 kWh take 4.00 dollars off; under 20,000 kWh take nothing off.
      Tenure charging: the whole months from the agreement's service start date to the handling date are counted; an agreement supplied 36 months or more is charged one half of the reduced fee; an agreement supplied 12 to 35 months is charged the reduced fee prorated to the share of its term still to run, that is the reduced fee multiplied by the whole months left to its contract end date and divided by its term's months; an agreement supplied fewer than 12 months is charged the reduced fee as it stands.
      The site transfer fee is put together in this order: first the remaining-term credit, the gas-move credit and the site-usage credit are taken off the plan's site transfer fee; that reduced fee, never below zero, is then charged as the tenure charging rule says; the result is rounded half up to the cent only at the end.
    prerequisite:
      - problem: bizpower_ext_grace_renewal_rate
        kind: value_input
        gate: months_left
        form: state
        policy_source: >-
          The relocation of an agreement that rolled over to month-to-month is not recorded until the agreement again shows a fixed term, with a term length, a contract end date and a renewal election accepted on the day its new term began.
        condition: >-
          The agreement shows a term length above zero, a contract end date, a plan whose site transfers are allowed, renewal election accepted and a renewal election date equal to its plan change date.
        resolved_by: accept_grace_period_renewal_906a45d5
        effect: >-
          The grace-period renewal gives the agreement a fixed plan with a site transfer fee above zero and a contract end date, so the plan fee binding becomes the plan's transfer fee and the months_left binding becomes the whole months to the new contract end date, which sets the remaining-term credit.
    cross_category:
      - category: bizgas
        as: branch
        reads: [status]
        note: The gas-move credit is decided from whether the business has a commercial gas agreement pending enrollment or only an active one.
    compute:
      - plan_fee: "P('site_transfer_fee_usd')"
      - months_left: "MONTHS(NOW, F('contract_end_date'))"
      - term_credit: "K('term_credit_long') if months_left >= K('term_long_months') else (K('term_credit_mid') if months_left >= K('term_mid_months') else 0)"
      - gas_pending: "CFIELD('bizgas', 'status', status='enrollment_pending')"
      - gas_active: "CFIELD('bizgas', 'status', status='active')"
      - gas_move_credit: "K('gas_move_credit') if gas_pending == 'enrollment_pending' else (K('gas_keep_credit') if (gas_pending == None and gas_active == 'active') else 0)"
      - kwh_12m: "SUM('bizpower_billing', 'usage_kwh', within_months=12, date_field='posted_date', line_type='energy_charge')"
      - usage_credit: "K('usage_credit_high') if kwh_12m >= K('usage_high_kwh') else (K('usage_credit_mid') if kwh_12m >= K('usage_mid_kwh') else 0)"
      - reduced_fee: "MX(0, plan_fee - term_credit - gas_move_credit - usage_credit)"
      - supplied_months: "MONTHS(F('service_start_date'), NOW)"
      - tenure_charged_fee: "reduced_fee * K('tenure_share_long') if supplied_months >= K('tenure_long_months') else (reduced_fee * months_left / F('term_months') if supplied_months >= K('tenure_mid_months') else reduced_fee)"
      - result: "RND(tenure_charged_fee, 2) if plan_fee > 0 else 0"
    compute_basis:
      plan_fee: "The standard site transfer fee is the plan's site transfer fee, rounded half up to the cent; a plan whose transfer fee is zero bills no fee."
      months_left: "Remaining-term credit: the whole months from the handling date to the agreement's contract end date are counted;"
      term_credit: "12 months or more take 20.00 dollars off the site transfer fee; 6 to 11 months take 10.00 dollars off; fewer than 6 months take nothing off."
      gas_pending: "Gas-move credit: when the business has a Beacon Ridge commercial gas agreement pending enrollment, its gas following it, 12.00 dollars come off the site transfer fee;"
      gas_active: "when the business has no pending one but holds an active Beacon Ridge commercial gas agreement, 6.00 dollars come off;"
      gas_move_credit: "Gas-move credit: when the business has a Beacon Ridge commercial gas agreement pending enrollment, its gas following it, 12.00 dollars come off the site transfer fee; when the business has no pending one but holds an active Beacon Ridge commercial gas agreement, 6.00 dollars come off; when it holds neither, nothing comes off."
      kwh_12m: "Site-usage credit: the kWh of the agreement's energy lines posted in the 12 months before the handling date are added up;"
      usage_credit: "40,000 kWh or more take 8.00 dollars off the site transfer fee; at least 20,000 but under 40,000 kWh take 4.00 dollars off; under 20,000 kWh take nothing off."
      reduced_fee: "first the remaining-term credit, the gas-move credit and the site-usage credit are taken off the plan's site transfer fee; that reduced fee, never below zero,"
      supplied_months: "Tenure charging: the whole months from the agreement's service start date to the handling date are counted;"
      tenure_charged_fee: "an agreement supplied 36 months or more is charged one half of the reduced fee; an agreement supplied 12 to 35 months is charged the reduced fee prorated to the share of its term still to run, that is the reduced fee multiplied by the whole months left to its contract end date and divided by its term's months; an agreement supplied fewer than 12 months is charged the reduced fee as it stands."
      result: "is then charged as the tenure charging rule says; the result is rounded half up to the cent only at the end."
    factors:
      - id: remaining_term_credit
        effect: parameter
        decides: term_credit
        bindings: [months_left, term_credit]
        ladder:
          - when: "12 or more whole months from the handling date to the contract end date"
            value: "K('term_credit_long')"
          - when: "6 to 11 whole months"
            value: "K('term_credit_mid')"
          - when: "otherwise (fewer than 6 months)"
            value: "0"
        baseline:
          term_credit: "0"
        evidence: [date]
        cross_difficulty: null
      - id: gas_move_credit
        effect: parameter
        decides: gas_move_credit
        bindings: [gas_pending, gas_active, gas_move_credit]
        ladder:
          - when: "the business has a Beacon Ridge commercial gas agreement pending enrollment"
            value: "K('gas_move_credit')"
          - when: "no pending one, and the business holds an active Beacon Ridge commercial gas agreement"
            value: "K('gas_keep_credit')"
          - when: "otherwise (neither)"
            value: "0"
        baseline:
          gas_move_credit: "0"
        evidence: [cross_category]
        cross_difficulty: bizgas
      - id: site_usage_credit
        effect: parameter
        decides: usage_credit
        bindings: [kwh_12m, usage_credit]
        ladder:
          - when: "40,000 kWh or more on energy lines posted in the last 12 months"
            value: "K('usage_credit_high')"
          - when: "at least 20,000 but under 40,000 kWh"
            value: "K('usage_credit_mid')"
          - when: "otherwise (under 20,000 kWh)"
            value: "0"
        baseline:
          usage_credit: "0"
        evidence: [history]
        cross_difficulty: null
      - id: transfer_tenure_charging
        effect: method
        decides: tenure_charged_fee
        bindings: [supplied_months, tenure_charged_fee]
        ladder:
          - when: "36 or more whole months since the agreement's service start date"
            method: "the reduced fee is charged at one half"
          - when: "12 to 35 whole months"
            method: "the reduced fee is prorated to the share of the term still to run: multiplied by the whole months left and divided by the term's months"
          - when: "otherwise (fewer than 12 months)"
            method: "the reduced fee is charged as it stands"
        baseline:
          tenure_charged_fee: "reduced_fee"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard site transfer fee is the plan's site transfer fee, rounded half up to the cent; a plan whose transfer fee is zero bills no fee.
      params: [site_transfer_fee_usd]
    inputs:
      history:
        - {table: bizpower_billing, aggregate: sum, field: usage_kwh, within_months: 12, filters: {line_type: energy_charge}}
      cross_category: [bizgas]
