category: bizpower
display_name: Small Business Electricity Supply

binding:
  holding_table: bizpower_agreements
  event_tables: [bizpower_billing, bizpower_notices]
  intake_tables: [bizpower_billing_disputes]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [enrollment_pending, active, drop_pending, closed, rescinded, rejected]
  transitions:
    - {from: enrollment_pending, to: active, by: system, means: The utility switches the business site to Beacon Ridge supply on the scheduled meter read date.}
    - {from: enrollment_pending, to: rescinded, by: user, means: The business rescinds the enrollment within the rescission window before supply starts.}
    - {from: enrollment_pending, to: rejected, by: system, means: The utility rejects the enrollment transaction.}
    - {from: active, to: drop_pending, by: user, means: The business confirms cancellation of the agreement and a drop is scheduled for the next meter read.}
    - {from: drop_pending, to: active, by: user, means: The business withdraws the cancellation before the drop takes effect.}
    - {from: drop_pending, to: closed, by: system, means: The utility completes the scheduled drop.}
    - {from: active, to: closed, by: system, means: The utility ends Beacon Ridge supply because another supplier enrolled the site or the site was final-billed.}

accounts:
  - key: bizpower_supply_billed
    unit: USD
    meaning: Net Beacon Ridge charges billed on the business agreement through the utility bill; supply charges, sales tax and fees increase it, bill credits and rebill credits reduce it.

parameter_schema:
  rate_type: Pricing structure of the plan (string enum variable | fixed).
  term_months: Length of the plan term in months (integer; 0 means month-to-month).
  renewable_content_pct: Share of the site's usage matched with renewable energy certificates beyond the state portfolio standard (percent, integer).
  rec_type: Kind of renewable energy certificate retired (string; "none" when the plan carries none).
  rec_retirement_statement: Whether the business receives an annual certificate retirement statement (boolean).
  green_marketing_kit: Whether the business receives the renewable-energy window decal and logo license for its storefront and website (boolean).
  monthly_service_fee_usd: Flat supplier service fee per site billed once per billing cycle (USD, 2 decimals).
  intro_rate_cycles: Initial billing cycles billed at the enrollment rate before monthly variable pricing applies (integer; 0 means none).
  variable_rate_notice_days: Minimum calendar days between the notice date of a business variable rate change and its effective date (integer days).
  variable_rate_effective_basis: Which billing cycles a new variable rate applies to (string enum cycles_beginning_on_or_after_effective_date).
  regulatory_passthrough_allowed: Whether a fixed rate may be adjusted during the term to pass through a change in law or regulation (boolean).
  regulatory_change_notice_days: Minimum calendar days between the notice of a regulatory pass-through and its effective date (integer days).
  etf_method: How the early termination fee is computed (string enum none | flat | per_remaining_kwh).
  etf_rate_usd_per_kwh: Liquidated damages rate applied to each remaining kWh under the per_remaining_kwh method (USD per kWh, 4 decimals).
  etf_minimum_usd: Minimum fee under the per_remaining_kwh method (USD, 2 decimals).
  etf_flat_usd: Fee under the flat method (USD, 2 decimals).
  etf_remaining_usage_basis: How remaining kWh are estimated for the fee (string enum annual_kwh_usage_prorated_by_remaining_months).
  etf_free_window_days: Calendar days immediately before contract end during which a cancellation carries no early termination fee (integer days).
  etf_waive_on_cni_upgrade: Whether no fee applies when the site moves to a Beacon Ridge commercial and industrial contract (boolean).
  auto_renew_etf_free_days: Calendar days at the start of an automatically renewed term during which a cancellation carries no early termination fee (integer days).
  rescission_window_days: Calendar days after the utility's enrollment confirmation date within which the business may rescind (integer days).
  signup_credit_usd: One-time sign-up bill credit per site (USD, 2 decimals; 0.00 means none).
  signup_credit_after_cycles: Completed billing cycles of continuous supply after which the sign-up credit posts (integer cycles).
  signup_credit_forfeit_on_drop: Whether an unposted sign-up credit is forfeited when the agreement leaves active status before qualifying (boolean).
  signup_credit_broker_eligible: Whether an enrollment through an energy broker earns the sign-up credit (boolean).
  enrollment_channels: Channels through which the plan may be enrolled (list of phone | web | broker).
  max_annual_kwh_per_site: Largest 12-month historical usage a site may have to be served on a small business plan (integer kWh).
  renewal_loyalty_credit_usd: One-time bill credit when the business explicitly accepts a renewal offer (USD, 2 decimals).
  renewal_notice_earliest_days: Earliest point, in calendar days before contract end, for the initial renewal notice (integer days).
  renewal_notice_latest_days: Latest point, in calendar days before contract end, for the initial renewal notice (integer days).
  final_options_notice_latest_days: Latest point, in calendar days before contract end, for the final options notice (integer days).
  opt_out_window_days: Calendar days after the final options notice date within which the business may decline automatic renewal (integer days).
  auto_renew_enabled: Whether a term renews automatically into the offered fixed term unless the business declines (boolean).
  auto_renewed_variant: The plan an automatic renewal renews into when the notice offers no other plan (official plan name).
  post_expiry_renewal_grace_days: Calendar days after rollover during which an explicit renewal acceptance is still honoured (integer days).
  rollover_variant: The plan an expiring agreement converts to when it neither renews nor auto-renews (official plan name).
  late_notice_rate_hold_cycles: Billing cycles after rollover during which the expiring rate is held when notices were late (integer cycles).
  billing_dispute_lookback_months: Calendar months after posting during which a billed line may be corrected (integer months).
  agent_adjustment_limit_usd: Largest rebill credit a care agent may post on one line (USD, 2 decimals).
  charge_rounding: Rounding applied to every computed charge, tax and credit (string enum half_up_to_cent).
  eligible_premise_class: Premise class the plan may serve (string enum commercial).
  eligible_states: States in which the plan is offered (list of state codes).
  sales_tax_rate_pct_by_state: State sales tax rate Beacon Ridge collects on commercial supply charges (mapping state code -> percent, 3 decimals; 0.000 where electricity is not subject to sales tax).
  tax_exemption_effective_basis: From which billing cycle a sales tax exemption takes effect (string enum cycles_beginning_on_or_after_tax_exemption_date).
  tax_exemption_refund_allowed: Whether sales tax billed before the exemption took effect is refunded by Beacon Ridge (boolean).
  multi_site_min_sites: Minimum number of the business's sites active on small business plans for the multi-site credit to apply (integer).
  multi_site_credit_usd_per_cycle: Bill credit per site per billing cycle when the multi-site minimum is met (USD, 2 decimals).
  site_transfer_allowed: Whether the agreement may be moved to another site of the same business when it relocates (boolean).
  site_transfer_fee_usd: Fee billed for moving the agreement to a new site (USD, 2 decimals).
  site_transfer_same_utility_required: Whether the new site must be served by the same electric utility as the old one (boolean).
  drop_effective_basis: When a cancellation drop takes effect (string enum next_scheduled_meter_read).

