name: env_0030_money_transfer_service
company: Paloma Remit

background: |
  Paloma Remit, Inc. is a Houston-based international money transfer company, a licensed money transmitter registered with FinCEN, that lets people living in the United States send money home and lets small US businesses pay suppliers and contractors abroad.
  It serves about 2.1 million active customers through its app, its website and a bilingual English and Spanish support desk, and it speaks to them in a warm, plain and careful tone, because the money is usually a family's rent, school fees or medicine.
  Money goes to thirteen corridors: Mexico, Guatemala, El Salvador, Honduras, the Dominican Republic, Colombia, the Philippines, India, Vietnam, Bangladesh, Nigeria, Kenya and Ghana, paid out through partner banks, cash agent networks and mobile-money providers.
  Every personal customer holds one Personal Sender Account at a verification level: Paloma Starter, Paloma Verified, Paloma Verified Plus, Paloma Enhanced, Paloma Premier or Paloma Private Client, together with a book of saved recipients, each tied to one corridor.
  Personal transfers are booked one at a time, and each booking is its own record with a principal, fees, a locked exchange rate, a disclosed date of availability and a status that moves from awaiting funds to delivered, cancelled or refunded.
  A Bank Deposit transfer is booked as Bank Deposit Economy, Bank Deposit Standard, Bank Deposit Express, Bank Deposit Express Plus, Bank Deposit Large Amount or Bank Deposit International Wire, and pays into the recipient's bank account.
  A Cash Pickup transfer is booked as Cash Pickup Economy, Cash Pickup Express, Cash Pickup Express Plus, Cash Pickup Bank Branch, Cash Pickup Cardless ATM or Cash Pickup Large Amount, and is collected in person with a Paloma Pickup Number.
  A Mobile Wallet transfer is booked as Mobile Wallet Micro, Mobile Wallet Economy, Mobile Wallet Express, Mobile Wallet Express Plus, Mobile Wallet Priority or Mobile Wallet Large Amount, and is credited to a GCash, Maya, M-Pesa, MTN MoMo, bKash, Nequi or Tigo Money wallet.
  Each transfer keeps a ledger of the customer's payment, fees, payouts, returned funds and refunds, and a case file of information requests, error notices, corrections, redirects and recalls.
  Small businesses hold a Paloma Business account on the Paloma Business Starter, Paloma Business Essentials, Paloma Business Growth, Paloma Business Pro, Paloma Business Scale or Paloma Business Enterprise plan, with a USD balance they fund themselves, a monthly allowance of free payouts, user seats for their staff and a ledger of deposits, payouts, fees and withdrawals.
  Customers may also join Paloma Rewards, whose Paloma Rewards Blue, Paloma Rewards Silver, Paloma Rewards Gold, Paloma Rewards Platinum, Paloma Rewards Diamond and Paloma Rewards Elite tiers keep a points balance earned on completed transfers and redeemed for cash back, donations or airtime.
  Through Paloma Top-Up & Bill Pay they buy Paloma Airtime Top-Up, Paloma Data Bundle and Paloma Electricity Token orders and pay Paloma Bill Pay Utilities, Paloma Bill Pay Television and Paloma Bill Pay School Fees bills for relatives, each order tracked to delivery.
  Paloma publishes a rate sheet of mid-market exchange rates for every corridor on each business day, and every booking, conversion and return is dated against it.
  Most callers are working immigrants who send a few hundred dollars to parents, spouses or children once or twice a month, often to the same two or three recipients in one corridor.
  A typical caller holds a Personal Sender Account a year or more old, several saved recipients, a dozen past transfers of which one or two are still in flight, a Rewards membership and the occasional airtime order.
  Some are newer customers still on their first transfers and first verification documents, some are larger senders paying for property, tuition or medical care, and some are small-business owners who also hold a Paloma Business account.
  They call about money that has not arrived, transfers on hold, wrong recipient details, cancellations and refunds, fees and exchange rates, sending limits, locked accounts, failed wallet credits and their business plans and payouts.

logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: sender_verification_and_limits
    claim:
      categories: [account]
      event_types: [account_unlocked, account_level_upgraded, account_limit_review_requested, account_document_received, account_callback_scheduled, account_statement_requested, account_closed_by_customer, account_appeal_lodged]
    summary: >
      Personal senders call about their Personal Sender Account itself: they hit a sending limit, want
      to send more for a house payment or tuition, cannot sign in because the account is locked, were
      asked for documents and find sending paused, or want a statement, a callback or to close the
      account; their situation varies with the verification level they hold, the account's status
      (pending verification, active, locked, restricted, suspended), how long the account has been
      open, how many transfers they have completed across Bank Deposit, Cash Pickup and Mobile Wallet,
      and which documents are on file, accepted, rejected or expired.
      The records involved are the account, its history of limit reviews, requests for information,
      recipients, callbacks, statements and appeals, the verification documents and their reviews, and
      the customer's transfers in all three delivery methods, whose rolling 24-hour, 30-day and 180-day
      principal measures the limits; the governing rules are the per-level ceilings and funding methods
      of account_sending_limits and account_evt_funding_entitlements, the document standards of
      account_evt_documents, the agent-applied upgrade of account_evt_level_upgrade with its account-age,
      completed-transfer and document gates, the compliance limit review of account_evt_limit_review with
      its next-level, cooldown and frequency gates, the unlock conditions of account_evt_lock, the
      closure conditions of account_evt_closure, the appeal window of account_evt_suspension_appeal and
      the entitlements of account_evt_service_entitlements.
      In the domain's natural course an account opens, activates, reaches higher levels as documents
      are accepted and history builds, may be restricted by a request for information or locked by
      security, and is eventually closed; the agent logs documents, applies upgrades that need no
      review, lodges limit reviews, releases locks it is allowed to release, schedules callbacks and
      requests statements, while closing the account and appealing a suspension are the customer's own
      acts, handed over to the customer.
      Requests no policy decides, such as lifting a compliance restriction or suspension directly,
      overriding a limit for one transfer, releasing a suspected-takeover lock, reopening a closed
      account, or making an exception for someone who sends on another person's behalf, fall outside
      the charter and leave a POLICY_NOT_COVERED handoff as the only correct route.

  - name: bank_deposit_transfers
    claim:
      categories: [bank]
      event_types: [bank_transfer_booked, bank_rate_requoted, bank_transfer_cancelled, bank_fee_charged, bank_fee_refunded, bank_refund_issued, bank_transfer_refunded, bank_beneficiary_amended, bank_resent, bank_paloma_credit, bank_rfi_answer_logged, bank_error_notice_filed, bank_remedy_chosen, bank_recall_requested]
    summary: >
      Senders call about Bank Deposit transfers: they want a quote or to book one, ask why the
      exchange rate or fee differs from last time, want to cancel, report that the money has not
      arrived by the promised date, learn that the beneficiary bank sent the money back, discover they
      typed the wrong account number, or ask for a refund; the setting varies with the tier
      (Economy through International Wire), the funding method, the corridor and its real-time caps,
      the transfer's status (awaiting funds, on hold, in transit, deposited, returned, cancelled,
      refunded), whether it is the customer's first transfer, how long ago it was booked, and what the
      ledger and case file already show.
      The records involved are the transfer, its ledger of payments, fees, payouts, returns, credits
      and refunds, its cases, the saved recipient, the sender account and its level, and the daily
      rate sheet; the governing rules are the aggregate ceilings of bank_agg_sending_limits and the tier
      entry gates of bank_evt_booking_eligibility, the fee ladder, margins, promotions and availability
      dating of bank_evt_pricing, the rate lock of bank_evt_funding_and_rate_lock, the cancellation
      window and fee refund shares of bank_evt_cancellation, the refund bases of bank_evt_refunds, the
      return attribution and conversion of bank_evt_returns, the amendment, decision window, resend fee
      and resend cap of bank_evt_amend_resend, the notice window and remedies of
      bank_evt_error_resolution, the recall window and fee of bank_evt_recall, and the late-delivery
      fee refund of bank_evt_on_time_promise.
      In the domain's natural course a transfer is booked and paid, released, possibly held, deposited
      or returned, and a returned or cancelled transfer is then resent or refunded; the agent quotes,
      logs answers to information requests, corrects details on returned transfers, resends, refunds
      principal and fees and books Paloma's make-good credits, while booking, cancelling, giving an
      error notice, choosing a remedy and requesting a recall with its fee are the customer's own acts.
      Requests no policy decides, such as reversing a deposit already credited to a correct account,
      guaranteeing a recall, honouring a rate from an earlier day, waiving a fee no rule waives, or
      redirecting money to a different person, fall outside the charter and call for a
      POLICY_NOT_COVERED handoff.

  - name: cash_pickup_transfers
    claim:
      categories: [cash]
      event_types: [cash_transfer_booked, cash_rate_requoted, cash_transfer_cancelled, cash_fee_charged, cash_fee_refunded, cash_refund_issued, cash_transfer_refunded, cash_name_corrected, cash_recipient_name_updated, cash_pickup_reactivated, cash_reissued, cash_paloma_credit, cash_rfi_answer_logged, cash_error_notice_filed, cash_remedy_chosen]
    summary: >
      Senders call about Cash Pickup transfers: the recipient was turned away at the counter because
      the name on the transfer does not match their ID, the pickup window ran out before anyone
      collected, they want to cancel and get their money back, they ask whether the cash can be paid in
      US dollars, or they say the money was collected by someone else; the setting varies with the tier
      (Economy, Express, Express Plus, Bank Branch, Cardless ATM, Large Amount), the payout network, the
      corridor and its pickup cap, the transfer's status (awaiting funds, on hold, ready for pickup,
      paid out, expired, cancelled, refunded), how many corrections and reactivations it has had, and
      when it was booked and made available.
      The records involved are the transfer with its Pickup Number, recipient name and pickup window,
      its ledger of payments, fees, payouts, credits and refunds, its cases of refused pickups, name
      corrections, information requests and error notices, the saved recipient and the sender account;
      the governing rules are the ceilings of cash_agg_sending_limits, the entry and payout-currency
      rules of cash_evt_booking_eligibility, the prices of cash_evt_pricing, the pickup window and
      refused-pickup hold of cash_evt_availability_and_holds, the spelling-only limits, counts and fees
      of cash_evt_name_correction, the cancellation window of cash_evt_cancellation, the expiry and
      reactivation windows, caps and fees of cash_evt_expiry_and_reactivation, the refund bases of
      cash_evt_refunds, the remedies of cash_evt_error_resolution and cash_evt_on_time_promise.
      In the domain's natural course a transfer is booked, made available, possibly corrected or held,
      and either collected or left to expire, after which it is reactivated or refunded; the agent
      records name corrections, reactivates expired pickups, logs information-request answers, issues
      refunds and fee refunds and makes Paloma's credits, while booking, cancelling, giving an error
      notice and choosing between a refund and a re-issue are the customer's own acts.
      Requests no policy decides, such as releasing cash to a different person, paying without a valid
      ID, extending a pickup window beyond what reactivation allows, or compensating a recipient's
      travel costs, fall outside the charter and call for a POLICY_NOT_COVERED handoff.

  - name: mobile_wallet_transfers
    claim:
      categories: [wallet]
      event_types: [wallet_transfer_booked, wallet_rate_requoted, wallet_transfer_cancelled, wallet_fee_charged, wallet_fee_refunded, wallet_credit_sent, wallet_refund_issued, wallet_transfer_refunded, wallet_redirect_requested, wallet_destination_updated, wallet_credit_retried, wallet_paloma_credit, wallet_rfi_answer_logged, wallet_error_notice_filed, wallet_remedy_chosen]
    summary: >
      Senders call about Mobile Wallet transfers: the credit bounced because the recipient's wallet is
      unregistered, over its provider limit, suspended or held in another name, the money is sitting
      with Paloma and they want it retried, sent to another wallet or refunded, a Priority credit took
      longer than promised, or they want to cancel before it goes out; the setting varies with the tier
      (Micro through Large Amount), the wallet provider and its cap, the failure reason and who it is
      attributed to, the transfer's status (awaiting funds, on hold, processing, credited, credit
      failed, cancelled, refunded), how many retries and redirects have already been used, and how long
      ago the credit failed.
      The records involved are the transfer with its wallet destination and release, credit and
      failure moments, its ledger of payments, fees, credits sent, reversals, Paloma credits and
      refunds, its cases of redirects, information requests and error notices, the saved recipient and
      the sender account; the governing rules are the ceilings and provider caps of
      wallet_agg_sending_limits, the provider and name-check rules of wallet_evt_booking_eligibility,
      the prices of wallet_evt_pricing, the automatic re-sends of wallet_evt_release_holds_and_credit,
      the retry window, free retries, retry and redirect fees and caps of wallet_evt_failed_credit, the
      cancellation window of wallet_evt_cancellation, the failure-attributed fee refunds of
      wallet_evt_refunds, the remedies of wallet_evt_error_resolution and the minute and date promises
      of wallet_evt_on_time_promise.
      In the domain's natural course a transfer is booked, released, credited or failed, and a failed
      credit is retried, redirected or refunded; the agent records redirects, retries failed credits,
      logs information-request answers, refunds principal and fees and makes Paloma's credits, while
      booking, cancelling, giving an error notice and choosing a remedy are the customer's own acts.
      Requests no policy decides, such as crediting a wallet in someone else's name, splitting one
      transfer across wallets to get past a provider cap, converting a failed wallet credit into a cash
      pickup, or asking Paloma to raise a provider's own wallet limit, fall outside the charter and call
      for a POLICY_NOT_COVERED handoff.

  - name: small_business_payouts
    claim:
      categories: [business]
      event_types: [business_plan_upgraded, business_downgrade_scheduled, business_proration_credited, business_fee_charged, business_fee_refunded, business_reinstated, business_payout_cancelled, business_payout_credited_back, business_allowance_restored, business_user_added, business_user_removed, business_kyb_document_received, business_balance_withdrawn, business_closed_by_owner, business_statement_requested, business_callback_scheduled]
    summary: >
      Small-business owners call about their Paloma Business account: they want to move to a bigger or
      smaller plan, add staff seats, cancel a payout that has not gone out, understand a returned
      payout and its fee, bring a past-due account back into good standing, withdraw their balance,
      finish KYB, or close the account; the setting varies with the plan (Starter through Enterprise),
      monthly or annual billing, the account's status (pending KYB, active, past due, suspended,
      closed), where the current billing period stands, the balance and free payouts left, the active
      users, the commitment end date, and which payouts are submitted, released, paid, cancelled or
      returned.
      The records involved are the business account with its billing period, balance and allowance,
      its ledger of deposits, fees, credits, payouts and withdrawals, its payout history by payout
      reference and its administrative history of users, KYB documents, statements and callbacks; the
      governing rules are the one-account-per-business and no-pooling rules of
      business_agg_multi_holding and business_agg_entity_separation, the KYB entry of
      business_evt_kyb_opening, the period billing, past-due grace and suspension point of
      business_evt_subscription_billing, the immediate prorated upgrade, period-end downgrade, seat fit
      and early-termination fee of business_evt_plan_change, the allowance grant, use and same-period
      restore of business_evt_allowance, the payout pricing and limits of business_evt_payout_pricing
      and business_evt_payout_limits, the pre-release cancellation and return handling of
      business_evt_payout_cancel_return, the seat caps of business_evt_seats, the deposit and
      withdrawal rules of business_evt_balance and the closure conditions of business_evt_closure.
      In the domain's natural course an account passes KYB, is billed each period, funds its balance,
      sends payouts that are released and paid or returned, changes plans, and is eventually closed;
      the agent logs KYB documents, collects overdue charges, cancels unreleased payouts, books credits,
      refunds and restored allowance, manages users and schedules statements and callbacks, while
      changing the plan, withdrawing the balance and closing the account are the owner's own decisions,
      handed over to the owner; business payouts carry no consumer remittance rights.
      Requests no policy decides, such as recalling a released payout, pooling the balances of two
      businesses, waiving a subscription or early-termination fee no rule waives, or paying a supplier
      from the owner's personal account, fall outside the charter and call for a POLICY_NOT_COVERED
      handoff.
