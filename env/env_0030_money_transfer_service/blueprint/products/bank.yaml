  - id: bank_evt_pricing
    subject: [bank_transfer_booked, bank_fee_charged]
    rule: >-
      The transfer fee is the fee_usd of the fee_ladder band whose from_usd and to_usd contain the
      principal. When the transfer is funded by pay_by_bank, pay_by_bank_fee_discount_usd is taken
      off that fee, never below 0.00. A transfer is the customer's first personal transfer when no
      other personal transfer exists on the sender account in Bank Deposit, Cash Pickup or Mobile
      Wallet except ones whose status is cancelled or refunded. On a first transfer booked on a tier
      whose first_transfer_fee_waived is true and whose principal is at or below
      first_transfer_promo_cap_usd, the transfer fee is 0.00 and the margin is
      first_transfer_promo_margin_pct; above the cap the regular price applies to the whole
      transfer. The first-transfer promotion and the pay-by-bank discount never stack: when the
      promotion applies the fee is already 0.00. The surcharge is the card funding fee
      (credit_card_fee_pct of the principal, rounded half up to the cent) for a credit card,
      debit_card_fee_usd for a debit card, swift_our_surcharge_usd for an OUR wire, and 0.00
      otherwise. The margin is fx_margin_pct, less margin_reduction_pct_points when the principal is
      at or above margin_reduction_threshold_usd; the promotional margin replaces both and is never
      reduced further. The customer rate fx_rate is the mid_market_rate of the corridor in the
      Paloma rate sheet for the booking date (the date part of booked_at) multiplied by one minus
      the margin over 100, rounded half up to 4 decimals. receive_amount is the principal times
      fx_rate rounded half up to the corridor's receive_amount_decimals; on an SHA wire the
      intermediary_fee_estimate_usd is first taken off the principal before conversion and
      disclosed as an estimate, and on an OUR wire nothing is taken off. date_available is counted
      from the release day: release on the booking day when the booking is on a Paloma business day
      at or before booking_cutoff_ct (every day for 24x7 tiers), otherwise on the next Paloma
      business day; ACH settlement waits and new-recipient cooling-off move the release later
      (account_evt_funding_entitlements, account_evt_recipients); then delivery_business_days Paloma
      business days are added, and on a tier whose weekend_payout is true the resulting date may
      fall on any calendar day. Fees are collected with the principal as bank_fee_charged rows: the
      transfer fee as transfer_fee when above 0.00, the card fee as card_funding_fee and the OUR
      surcharge as swift_our_fee, each with payout_attempt 1. Fees and limits are never
      recalculated after booking except by a re-quote, a resend or a refund rule.
    eligibility: []
    params:
      receive_amount_decimals: {VN-VND: 0, all_other_corridors: 2}
      per_tier:
        Bank Deposit Economy: {fee_ladder: "=fee_ladder", pay_by_bank_fee_discount_usd: "=pay_by_bank_fee_discount_usd", first_transfer_fee_waived: "=first_transfer_fee_waived", first_transfer_promo_cap_usd: "=first_transfer_promo_cap_usd", first_transfer_promo_margin_pct: "=first_transfer_promo_margin_pct", credit_card_fee_pct: "=credit_card_fee_pct", debit_card_fee_usd: "=debit_card_fee_usd", swift_our_surcharge_usd: "=swift_our_surcharge_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", intermediary_fee_estimate_usd: "=intermediary_fee_estimate_usd", booking_cutoff_ct: "=booking_cutoff_ct", delivery_business_days: "=delivery_business_days", weekend_payout: "=weekend_payout"}
        Bank Deposit Standard: {fee_ladder: "=fee_ladder", pay_by_bank_fee_discount_usd: "=pay_by_bank_fee_discount_usd", first_transfer_fee_waived: "=first_transfer_fee_waived", first_transfer_promo_cap_usd: "=first_transfer_promo_cap_usd", first_transfer_promo_margin_pct: "=first_transfer_promo_margin_pct", credit_card_fee_pct: "=credit_card_fee_pct", debit_card_fee_usd: "=debit_card_fee_usd", swift_our_surcharge_usd: "=swift_our_surcharge_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", intermediary_fee_estimate_usd: "=intermediary_fee_estimate_usd", booking_cutoff_ct: "=booking_cutoff_ct", delivery_business_days: "=delivery_business_days", weekend_payout: "=weekend_payout"}
        Bank Deposit Express: {fee_ladder: "=fee_ladder", pay_by_bank_fee_discount_usd: "=pay_by_bank_fee_discount_usd", first_transfer_fee_waived: "=first_transfer_fee_waived", first_transfer_promo_cap_usd: "=first_transfer_promo_cap_usd", first_transfer_promo_margin_pct: "=first_transfer_promo_margin_pct", credit_card_fee_pct: "=credit_card_fee_pct", debit_card_fee_usd: "=debit_card_fee_usd", swift_our_surcharge_usd: "=swift_our_surcharge_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", intermediary_fee_estimate_usd: "=intermediary_fee_estimate_usd", booking_cutoff_ct: "=booking_cutoff_ct", delivery_business_days: "=delivery_business_days", weekend_payout: "=weekend_payout"}
        Bank Deposit Express Plus: {fee_ladder: "=fee_ladder", pay_by_bank_fee_discount_usd: "=pay_by_bank_fee_discount_usd", first_transfer_fee_waived: "=first_transfer_fee_waived", first_transfer_promo_cap_usd: "=first_transfer_promo_cap_usd", first_transfer_promo_margin_pct: "=first_transfer_promo_margin_pct", credit_card_fee_pct: "=credit_card_fee_pct", debit_card_fee_usd: "=debit_card_fee_usd", swift_our_surcharge_usd: "=swift_our_surcharge_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", intermediary_fee_estimate_usd: "=intermediary_fee_estimate_usd", booking_cutoff_ct: "=booking_cutoff_ct", delivery_business_days: "=delivery_business_days", weekend_payout: "=weekend_payout"}
        Bank Deposit Large Amount: {fee_ladder: "=fee_ladder", pay_by_bank_fee_discount_usd: "=pay_by_bank_fee_discount_usd", first_transfer_fee_waived: "=first_transfer_fee_waived", first_transfer_promo_cap_usd: "=first_transfer_promo_cap_usd", first_transfer_promo_margin_pct: "=first_transfer_promo_margin_pct", credit_card_fee_pct: "=credit_card_fee_pct", debit_card_fee_usd: "=debit_card_fee_usd", swift_our_surcharge_usd: "=swift_our_surcharge_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", intermediary_fee_estimate_usd: "=intermediary_fee_estimate_usd", booking_cutoff_ct: "=booking_cutoff_ct", delivery_business_days: "=delivery_business_days", weekend_payout: "=weekend_payout"}
        Bank Deposit International Wire: {fee_ladder: "=fee_ladder", pay_by_bank_fee_discount_usd: "=pay_by_bank_fee_discount_usd", first_transfer_fee_waived: "=first_transfer_fee_waived", first_transfer_promo_cap_usd: "=first_transfer_promo_cap_usd", first_transfer_promo_margin_pct: "=first_transfer_promo_margin_pct", credit_card_fee_pct: "=credit_card_fee_pct", debit_card_fee_usd: "=debit_card_fee_usd", swift_our_surcharge_usd: "=swift_our_surcharge_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", intermediary_fee_estimate_usd: "=intermediary_fee_estimate_usd", booking_cutoff_ct: "=booking_cutoff_ct", delivery_business_days: "=delivery_business_days", weekend_payout: "=weekend_payout"}
    formula:
      card_funding_fee: "round(send_amount_usd * credit_card_fee_pct / 100, 2)"
      effective_margin_pct: "fx_margin_pct - margin_reduction_pct_points if send_amount_usd >= margin_reduction_threshold_usd else fx_margin_pct"
      receive_amount: "round(send_amount_usd * fx_rate, 2)"

  - id: bank_evt_funding_and_rate_lock
    subject: [bank_funds_received, bank_rate_requoted, bank_transfer_auto_cancelled]
    rule: >-
      Card and pay-by-bank payments are collected at booking; an ACH debit is collected when it
      settles; a wire is collected when it arrives. The quoted rate is guaranteed for rate_lock_hours
      elapsed hours from booked_at. A rate is re-quoted only when funds are collected more than
      rate_lock_hours after the transfer was booked. Lock hours are counted as elapsed hours from
      booked_at to the moment the funds are collected. A re-quote uses the rate sheet for the
      collection date with the same margin rule as at booking, re-discloses fx_rate, receive_amount
      and date_available, and never changes the fees. On a tier whose funding_deadline_hours is above
      0, Paloma cancels a wire-funded booking only when the funds have not arrived
      more than funding_deadline_hours after the transfer was booked. The funding deadline is
      counted in elapsed hours from booked_at to the handling moment. When an ACH debit is returned
      unpaid before release, or a card capture fails, Paloma cancels the transfer with hold_reason
      funding_failed. A cancellation for missing or failed funding owes nothing back, because
      nothing was collected, and the transfer stays cancelled as its final status.
    eligibility:
      - id: rate_lock_lapsed
        applies_to: [bank_rate_requoted]
        kind: time
        condition: "A rate is re-quoted only when funds are collected more than rate_lock_hours after the transfer was booked."
        evidence_fields: [bank_transfers.bank_transfer_id, bank_transfers.booked_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_transfers.bank_transfer_id]
          action_bindings:
            bank_transfers.bank_transfer_id: bank_transfer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the transfer was booked"
          anchor_source: bank_transfers.booked_at
          relation: not_before
          duration_source: variants.rate_lock_hours
          unit: elapsed_hours
          counting_rule: "Lock hours are counted as elapsed hours from booked_at to the moment the funds are collected."
          boundary: exclusive
      - id: funding_deadline_passed
        applies_to: [bank_transfer_auto_cancelled]
        kind: time
        condition: "Paloma cancels a wire-funded booking only when the funds have not arrived more than funding_deadline_hours after the transfer was booked."
        evidence_fields: [bank_transfers.bank_transfer_id, bank_transfers.booked_at, bank_transfers.funding_method]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_transfers.bank_transfer_id]
          action_bindings:
            bank_transfers.bank_transfer_id: bank_transfer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the transfer was booked"
          anchor_source: bank_transfers.booked_at
          relation: not_before
          duration_source: variants.funding_deadline_hours
          unit: elapsed_hours
          counting_rule: "The funding deadline is counted in elapsed hours from booked_at to the handling moment."
          boundary: exclusive
    params:
      per_tier:
        Bank Deposit Economy: {rate_lock_hours: "=rate_lock_hours", funding_deadline_hours: "=funding_deadline_hours", funding_methods_allowed: "=funding_methods_allowed"}
        Bank Deposit Standard: {rate_lock_hours: "=rate_lock_hours", funding_deadline_hours: "=funding_deadline_hours", funding_methods_allowed: "=funding_methods_allowed"}
        Bank Deposit Express: {rate_lock_hours: "=rate_lock_hours", funding_deadline_hours: "=funding_deadline_hours", funding_methods_allowed: "=funding_methods_allowed"}
        Bank Deposit Express Plus: {rate_lock_hours: "=rate_lock_hours", funding_deadline_hours: "=funding_deadline_hours", funding_methods_allowed: "=funding_methods_allowed"}
        Bank Deposit Large Amount: {rate_lock_hours: "=rate_lock_hours", funding_deadline_hours: "=funding_deadline_hours", funding_methods_allowed: "=funding_methods_allowed"}
        Bank Deposit International Wire: {rate_lock_hours: "=rate_lock_hours", funding_deadline_hours: "=funding_deadline_hours", funding_methods_allowed: "=funding_methods_allowed"}

  - id: bank_evt_release_and_holds
    subject: [bank_released, bank_hold_placed, bank_hold_released, bank_payout_sent, bank_deposit_confirmed, bank_rfi_answer_logged, bank_transfer_auto_cancelled]
    rule: >-
      A transfer is released to the payout partner once its principal is collected, or earlier for
      ACH-funded principal within the account's early-release allowance
      (account_evt_funding_entitlements), and once any new-recipient cooling-off has run; release
      books the first payout (payout_attempt 1) at the transfer's fx_rate. Compliance, funding
      review, partner screening or a new-recipient cooling-off may hold a transfer before or after
      release, recording hold_reason and held_at; a hold with hold_reason rfi_transfer asks the
      customer for information about this transfer. The customer answers by uploading a document in
      the app, and a support agent logs the answer by its upload reference. An answer is logged only
      while the transfer is on_hold with hold_reason rfi_transfer. Each upload reference is logged
      once. Only compliance releases a hold, within hold_review_business_days Paloma business days of
      a complete answer; the agent never releases one. On release from a hold the date_available is
      re-disclosed as the release day plus delivery_business_days Paloma business days, counted as
      in bank_evt_pricing. A payout that fails for a technical reason is retried up to
      payout_retry_attempts times before it is treated as a return. When the beneficiary bank
      confirms the credit the transfer is deposited, with deposited_date and closed_date set to that
      date, and Paloma Rewards points are earned under the rewards charter. A transfer held by
      compliance is cancelled by Paloma only when its request for information has gone unanswered
      for more than rfi_response_days calendar days after the hold was placed, or when compliance
      rejects it. The answer window is counted in calendar days from the date part of held_at, and
      an answer logged on held_at plus rfi_response_days is on time.
    eligibility:
      - id: rfi_hold_open
        applies_to: [bank_rfi_answer_logged]
        kind: state
        condition: "An answer is logged only while the transfer is on_hold with hold_reason rfi_transfer."
        evidence_fields: [bank_transfers.bank_transfer_id, bank_transfers.status, bank_transfers.hold_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_transfers.bank_transfer_id]
          action_bindings:
            bank_transfers.bank_transfer_id: bank_transfer_id
        state_contract:
          field: bank_transfers.status
          allowed: [on_hold]
      - id: one_log_per_upload
        applies_to: [bank_rfi_answer_logged]
        kind: dedup
        condition: "Each upload reference is logged once."
        evidence_fields: [bank_cases.doc_reference, bank_cases.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_cases.doc_reference]
          action_bindings:
            bank_cases.doc_reference: doc_reference
        dedup_contract:
          table: bank_cases
          mode: separate_record
          object_bindings: {doc_reference: doc_reference}
          duplicate_filters: {event_type: [bank_rfi_answer_logged]}
          distinct_fields: []
    params:
      per_tier:
        Bank Deposit Economy: {hold_review_business_days: "=hold_review_business_days", rfi_response_days: "=rfi_response_days", payout_retry_attempts: "=payout_retry_attempts", delivery_business_days: "=delivery_business_days"}
        Bank Deposit Standard: {hold_review_business_days: "=hold_review_business_days", rfi_response_days: "=rfi_response_days", payout_retry_attempts: "=payout_retry_attempts", delivery_business_days: "=delivery_business_days"}
        Bank Deposit Express: {hold_review_business_days: "=hold_review_business_days", rfi_response_days: "=rfi_response_days", payout_retry_attempts: "=payout_retry_attempts", delivery_business_days: "=delivery_business_days"}
        Bank Deposit Express Plus: {hold_review_business_days: "=hold_review_business_days", rfi_response_days: "=rfi_response_days", payout_retry_attempts: "=payout_retry_attempts", delivery_business_days: "=delivery_business_days"}
        Bank Deposit Large Amount: {hold_review_business_days: "=hold_review_business_days", rfi_response_days: "=rfi_response_days", payout_retry_attempts: "=payout_retry_attempts", delivery_business_days: "=delivery_business_days"}
        Bank Deposit International Wire: {hold_review_business_days: "=hold_review_business_days", rfi_response_days: "=rfi_response_days", payout_retry_attempts: "=payout_retry_attempts", delivery_business_days: "=delivery_business_days"}

  - id: bank_evt_cancellation
    subject: [bank_transfer_cancelled, bank_fee_refunded]
    rule: >-
      Only the customer can cancel their own transfer; the agent explains what will be refunded and
      the customer confirms the cancellation. A transfer can be cancelled while it is awaiting_funds
      or on_hold. A released transfer (in_transit) can be cancelled only on a tier whose
      in_transit_cancellable is true, and only until the beneficiary bank credits it. A deposited
      transfer can never be cancelled; what remains is an error notice (bank_evt_error_resolution)
      or a recall (bank_evt_recall). A fee is refunded in full on cancellation only when the
      customer confirms the cancellation within cancel_full_refund_window_hours elapsed hours after
      the transfer was booked. The window is measured in elapsed hours from booked_at to
      cancelled_at, and a cancellation at exactly the end of the window is inside it. Inside the
      window every fee collected is refunded with fee_refund_reason cancellation_in_window. After
      the window, each fee collected (transfer fee, card funding fee, OUR surcharge) is refunded at
      late_cancel_fee_refund_pct of its amount, rounded half up to the cent, when the transfer was
      cancelled from awaiting_funds or on_hold, and is not refunded at all when it was cancelled from
      in_transit; these refunds carry fee_refund_reason cancellation_post_window. The principal is
      always refunded in full under bank_evt_refunds. Money not yet collected (an ACH debit not yet
      settled) is simply not collected. Each fee charge is refunded at most once.
    eligibility:
      - id: in_transit_cancel_allowed
        applies_to: [bank_transfer_cancelled]
        kind: authorization
        condition: "A released transfer (in_transit) can be cancelled only on a tier whose in_transit_cancellable is true, and only until the beneficiary bank credits it."
        evidence_fields: [bank_transfers.bank_transfer_id, bank_transfers.status, bank_transfers.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_transfers.bank_transfer_id]
          action_bindings:
            bank_transfers.bank_transfer_id: bank_transfer_id
      - id: full_refund_window
        applies_to: [bank_fee_refunded]
        kind: time
        condition: "A fee is refunded in full on cancellation only when the customer confirms the cancellation within cancel_full_refund_window_hours elapsed hours after the transfer was booked."
        evidence_fields: [bank_transfers.bank_transfer_id, bank_transfers.booked_at, bank_transfers.cancelled_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_transfers.bank_transfer_id]
          action_bindings:
            bank_transfers.bank_transfer_id: bank_transfer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the transfer was booked"
          anchor_source: bank_transfers.booked_at
          relation: not_after
          duration_source: variants.cancel_full_refund_window_hours
          unit: elapsed_hours
          counting_rule: "The window is measured in elapsed hours from booked_at to cancelled_at, and a cancellation at exactly the end of the window is inside it."
          boundary: inclusive
      - id: fee_refunded_once
        applies_to: [bank_fee_refunded]
        kind: dedup
        condition: "Each fee charge is refunded at most once."
        evidence_fields: [bank_ledger.related_entry_id, bank_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_ledger.related_entry_id]
          action_bindings:
            bank_ledger.related_entry_id: related_entry_id
        dedup_contract:
          table: bank_ledger
          mode: separate_record
          object_bindings: {related_entry_id: related_entry_id}
          duplicate_filters: {event_type: [bank_fee_refunded]}
          distinct_fields: []
    params:
      per_tier:
        Bank Deposit Economy: {cancel_full_refund_window_hours: "=cancel_full_refund_window_hours", late_cancel_fee_refund_pct: "=late_cancel_fee_refund_pct", in_transit_cancellable: "=in_transit_cancellable"}
        Bank Deposit Standard: {cancel_full_refund_window_hours: "=cancel_full_refund_window_hours", late_cancel_fee_refund_pct: "=late_cancel_fee_refund_pct", in_transit_cancellable: "=in_transit_cancellable"}
        Bank Deposit Express: {cancel_full_refund_window_hours: "=cancel_full_refund_window_hours", late_cancel_fee_refund_pct: "=late_cancel_fee_refund_pct", in_transit_cancellable: "=in_transit_cancellable"}
        Bank Deposit Express Plus: {cancel_full_refund_window_hours: "=cancel_full_refund_window_hours", late_cancel_fee_refund_pct: "=late_cancel_fee_refund_pct", in_transit_cancellable: "=in_transit_cancellable"}
        Bank Deposit Large Amount: {cancel_full_refund_window_hours: "=cancel_full_refund_window_hours", late_cancel_fee_refund_pct: "=late_cancel_fee_refund_pct", in_transit_cancellable: "=in_transit_cancellable"}
        Bank Deposit International Wire: {cancel_full_refund_window_hours: "=cancel_full_refund_window_hours", late_cancel_fee_refund_pct: "=late_cancel_fee_refund_pct", in_transit_cancellable: "=in_transit_cancellable"}
    formula:
      late_fee_refund: "round(amount_usd * late_cancel_fee_refund_pct / 100, 2)"

  - id: bank_evt_refunds
    subject: [bank_refund_issued, bank_transfer_refunded]
    rule: >-
      Principal is refunded only on a transfer whose status is cancelled, returned or deposited, and
      on a deposited transfer only as an error-resolution remedy. The amount follows the refund
      basis: cancellation refunds the principal collected (the bank_funds_received amount);
      rfi_expiry and compliance_rejection refund the principal collected, and each fee collected is
      refunded at rfi_expiry_fee_refund_pct with fee_refund_reason compliance_cancellation; return
      refunds what bank_evt_returns sets; error_resolution and error_shortfall refund what
      bank_evt_error_resolution sets. Each refund basis is paid once against its source entry. A refund is issued within
      refund_business_days Paloma business days of the day it became owed (the cancellation, the
      end of the return decision window or the customer's choice to refund, or the remedy choice),
      to the original funding method; a wire-funded transfer is refunded by ACH credit to the bank
      account the wire came from. Once the principal refund is booked the transfer moves to
      refunded with closed_date the refund date, except that a shortfall refund (error_shortfall)
      leaves a deposited transfer deposited. A cancelled transfer from which nothing was
      collected owes no refund and stays cancelled.
    eligibility:
      - id: refundable_status
        applies_to: [bank_refund_issued]
        kind: state
        condition: "Principal is refunded only on a transfer whose status is cancelled, returned or deposited, and on a deposited transfer only as an error-resolution remedy."
        evidence_fields: [bank_transfers.bank_transfer_id, bank_transfers.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_transfers.bank_transfer_id]
          action_bindings:
            bank_transfers.bank_transfer_id: bank_transfer_id
        state_contract:
          field: bank_transfers.status
          allowed: [cancelled, returned, deposited]
      - id: refund_once_per_basis
        applies_to: [bank_refund_issued]
        kind: dedup
        condition: "Each refund basis is paid once against its source entry."
        evidence_fields: [bank_ledger.bank_transfer_id, bank_ledger.refund_basis, bank_ledger.related_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_ledger.bank_transfer_id, bank_ledger.related_entry_id]
          action_bindings:
            bank_ledger.bank_transfer_id: bank_transfer_id
            bank_ledger.related_entry_id: related_entry_id
        dedup_contract:
          table: bank_ledger
          mode: separate_record
          object_bindings: {bank_transfer_id: bank_transfer_id, related_entry_id: related_entry_id}
          duplicate_filters: {event_type: [bank_refund_issued]}
          distinct_fields: [refund_basis]
    params:
      per_tier:
        Bank Deposit Economy: {refund_business_days: "=refund_business_days", rfi_expiry_fee_refund_pct: "=rfi_expiry_fee_refund_pct"}
        Bank Deposit Standard: {refund_business_days: "=refund_business_days", rfi_expiry_fee_refund_pct: "=rfi_expiry_fee_refund_pct"}
        Bank Deposit Express: {refund_business_days: "=refund_business_days", rfi_expiry_fee_refund_pct: "=rfi_expiry_fee_refund_pct"}
        Bank Deposit Express Plus: {refund_business_days: "=refund_business_days", rfi_expiry_fee_refund_pct: "=rfi_expiry_fee_refund_pct"}
        Bank Deposit Large Amount: {refund_business_days: "=refund_business_days", rfi_expiry_fee_refund_pct: "=rfi_expiry_fee_refund_pct"}
        Bank Deposit International Wire: {refund_business_days: "=refund_business_days", rfi_expiry_fee_refund_pct: "=rfi_expiry_fee_refund_pct"}

  - id: bank_evt_returns
    subject: [bank_funds_returned, bank_transfer_returned, bank_paloma_credit]
    rule: >-
      When a payout comes back, the payout-currency amount is converted back to USD at the
      corridor's mid_market_rate in the Paloma rate sheet for the return date multiplied by one plus
      return_conversion_margin_pct over 100 (rounded half up to 4 decimals), and amount_usd is the
      returned amount divided by that rate, rounded half up to the cent. The return reason's entry in
      return_reason_attribution decides who bears the consequences. When the return is on Paloma's
      side, Paloma credits any shortfall between the principal of that payout and the USD recovered
      (bank_paloma_credit with credit_reason fx_shortfall), the transfer is sent again free of
      charge at its original fx_rate and receive_amount or, at the customer's choice, refunded in
      full, and every fee collected is refunded with fee_refund_reason return_paloma_attributable.
      When the return is on the sender's side, the customer bears the exchange difference: the
      customer may have the transfer sent again with corrected details (bank_evt_amend_resend), or
      be refunded the USD recovered less return_handling_fee_usd, while fees already collected are
      not refunded. The customer has return_decision_window_days calendar days from the return date
      to choose; with no choice by then Paloma refunds on the same basis. A recovered amount above
      the principal is refunded in full and never retained.
    eligibility: []
    params:
      per_tier:
        Bank Deposit Economy: {return_reason_attribution: "=return_reason_attribution", return_conversion_margin_pct: "=return_conversion_margin_pct", return_handling_fee_usd: "=return_handling_fee_usd", return_decision_window_days: "=return_decision_window_days"}
        Bank Deposit Standard: {return_reason_attribution: "=return_reason_attribution", return_conversion_margin_pct: "=return_conversion_margin_pct", return_handling_fee_usd: "=return_handling_fee_usd", return_decision_window_days: "=return_decision_window_days"}
        Bank Deposit Express: {return_reason_attribution: "=return_reason_attribution", return_conversion_margin_pct: "=return_conversion_margin_pct", return_handling_fee_usd: "=return_handling_fee_usd", return_decision_window_days: "=return_decision_window_days"}
        Bank Deposit Express Plus: {return_reason_attribution: "=return_reason_attribution", return_conversion_margin_pct: "=return_conversion_margin_pct", return_handling_fee_usd: "=return_handling_fee_usd", return_decision_window_days: "=return_decision_window_days"}
        Bank Deposit Large Amount: {return_reason_attribution: "=return_reason_attribution", return_conversion_margin_pct: "=return_conversion_margin_pct", return_handling_fee_usd: "=return_handling_fee_usd", return_decision_window_days: "=return_decision_window_days"}
        Bank Deposit International Wire: {return_reason_attribution: "=return_reason_attribution", return_conversion_margin_pct: "=return_conversion_margin_pct", return_handling_fee_usd: "=return_handling_fee_usd", return_decision_window_days: "=return_decision_window_days"}
    formula:
      sender_side_refund: "round(amount_usd - return_handling_fee_usd, 2)"

  - id: bank_evt_amend_resend
    subject: [bank_beneficiary_amended, bank_resent, bank_fee_charged, bank_rate_requoted]
    rule: >-
      Recipient bank details on a transfer can be corrected only while its status is returned; before
      release a wrong detail is fixed by cancelling and booking again. Only the amendable_fields may
      change, each set exactly as the customer gives it, and the customer's saved recipient record
      is updated by the customer in the app, never by the amendment. A returned transfer may be sent
      again only within return_decision_window_days calendar days after the funds came back. The
      window is counted in calendar days from the entry_date of the bank_funds_returned row, and a
      resend on the last day of the window is on time. One transfer may be sent again at most
      max_resends times in total (bank_msr_resends). A resend after a return on Paloma's side needs
      no amendment, is free, and pays out the original receive_amount at the original fx_rate. A
      resend after a return on the sender's side needs the corrected details first; it pays out the
      USD recovered less return_handling_fee_usd, converted at a re-quoted rate (the rate sheet for
      the resend date with the transfer's margin rule, re-disclosed by bank_rate_requoted), and it
      carries resend_fee_usd as fee_type resend_fee with the new payout_attempt, except that the
      first free_resends_per_transfer sender-side resends (bank_msr_sender_resends) are free. The
      resend's date_available is the resend day plus delivery_business_days Paloma business days.
      When max_resends is reached, or the window has passed, the transfer can only be refunded.
    eligibility:
      - id: returned_only
        applies_to: [bank_beneficiary_amended]
        kind: state
        condition: "Recipient bank details on a transfer can be corrected only while its status is returned; before release a wrong detail is fixed by cancelling and booking again."
        evidence_fields: [bank_transfers.bank_transfer_id, bank_transfers.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_transfers.bank_transfer_id]
          action_bindings:
            bank_transfers.bank_transfer_id: bank_transfer_id
        state_contract:
          field: bank_transfers.status
          allowed: [returned]
      - id: decision_window
        applies_to: [bank_resent]
        kind: time
        condition: "A returned transfer may be sent again only within return_decision_window_days calendar days after the funds came back."
        evidence_fields: [bank_ledger.bank_transfer_id, bank_ledger.event_type, bank_ledger.entry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_ledger.bank_transfer_id]
          action_bindings:
            bank_ledger.bank_transfer_id: bank_transfer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the funds came back"
          anchor_source: bank_ledger.entry_date
          relation: not_after
          duration_source: variants.return_decision_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days from the entry_date of the bank_funds_returned row, and a resend on the last day of the window is on time."
          boundary: inclusive
      - id: resend_cap
        applies_to: [bank_resent]
        kind: authorization
        condition: "One transfer may be sent again at most max_resends times in total (bank_msr_resends)."
        evidence_fields: [bank_ledger.bank_transfer_id, bank_ledger.event_type, bank_ledger.payout_attempt]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_ledger.bank_transfer_id]
          action_bindings:
            bank_ledger.bank_transfer_id: bank_transfer_id
    params:
      per_tier:
        Bank Deposit Economy: {amendable_fields: "=amendable_fields", return_decision_window_days: "=return_decision_window_days", max_resends: "=max_resends", resend_fee_usd: "=resend_fee_usd", free_resends_per_transfer: "=free_resends_per_transfer", return_handling_fee_usd: "=return_handling_fee_usd", delivery_business_days: "=delivery_business_days"}
        Bank Deposit Standard: {amendable_fields: "=amendable_fields", return_decision_window_days: "=return_decision_window_days", max_resends: "=max_resends", resend_fee_usd: "=resend_fee_usd", free_resends_per_transfer: "=free_resends_per_transfer", return_handling_fee_usd: "=return_handling_fee_usd", delivery_business_days: "=delivery_business_days"}
        Bank Deposit Express: {amendable_fields: "=amendable_fields", return_decision_window_days: "=return_decision_window_days", max_resends: "=max_resends", resend_fee_usd: "=resend_fee_usd", free_resends_per_transfer: "=free_resends_per_transfer", return_handling_fee_usd: "=return_handling_fee_usd", delivery_business_days: "=delivery_business_days"}
        Bank Deposit Express Plus: {amendable_fields: "=amendable_fields", return_decision_window_days: "=return_decision_window_days", max_resends: "=max_resends", resend_fee_usd: "=resend_fee_usd", free_resends_per_transfer: "=free_resends_per_transfer", return_handling_fee_usd: "=return_handling_fee_usd", delivery_business_days: "=delivery_business_days"}
        Bank Deposit Large Amount: {amendable_fields: "=amendable_fields", return_decision_window_days: "=return_decision_window_days", max_resends: "=max_resends", resend_fee_usd: "=resend_fee_usd", free_resends_per_transfer: "=free_resends_per_transfer", return_handling_fee_usd: "=return_handling_fee_usd", delivery_business_days: "=delivery_business_days"}
        Bank Deposit International Wire: {amendable_fields: "=amendable_fields", return_decision_window_days: "=return_decision_window_days", max_resends: "=max_resends", resend_fee_usd: "=resend_fee_usd", free_resends_per_transfer: "=free_resends_per_transfer", return_handling_fee_usd: "=return_handling_fee_usd", delivery_business_days: "=delivery_business_days"}
    measures: [bank_msr_resends, bank_msr_sender_resends]

  - id: bank_evt_error_resolution
    subject: [bank_error_notice_filed, bank_error_decided, bank_remedy_chosen, bank_paloma_credit, bank_fee_refunded]
    rule: >-
      Under the Remittance Transfer Rule the customer may give notice of an error on a transfer: the
      money was not available to the recipient by date_available (not_received_by_date), the
      recipient received less than the disclosed receive_amount other than an SHA intermediary
      deduction within the disclosed estimate (incorrect_amount), or the money was deposited to an
      account other than the one in the transfer's beneficiary details (wrong_account_details). The
      notice is the customer's own assertion and the customer gives it; the agent explains the
      process. A notice can be given only within error_notice_window_days calendar days after the
      disclosed date of availability. The window is counted in calendar days from date_available,
      and a notice on date_available plus the window days is on time. Only one notice of each
      case_type may be open on a transfer at a time. The resolution_due_date is the notice date
      plus error_investigation_days calendar days. Paloma's error-resolution team decides: no_error
      when the cause lies with the customer (beneficiary details the customer supplied were wrong,
      or a hold lasted because the customer answered a request for information late), error_found
      otherwise. On error_found every fee collected on the transfer is refunded with
      fee_refund_reason paloma_error, unless it was already refunded under the on-time promise. A
      remedy can be chosen only after a decision of error_found on that notice. For
      incorrect_amount, Paloma credits the shortfall (bank_paloma_credit, credit_reason
      incorrect_amount_shortfall) and the customer chooses to have the shortfall delivered
      (resend_shortfall) or refunded (refund_shortfall, booked with refund_basis error_shortfall). For
      wrong_account_details, and for not_received_by_date while the money has still not been
      deposited, the customer chooses between a refund of the principal and delivery to the correct
      account at no cost; Paloma funds whichever is chosen when the original payout cannot be
      recovered (credit_reason error_refund or error_redelivery). The choice is the customer's own;
      a refund is issued within refund_business_days and a delivery within
      redelivery_business_days Paloma business days of the choice. On no_error nothing is owed and
      the customer is told the finding; for wrong details a recall (bank_evt_recall) is the remaining
      route.
    eligibility:
      - id: notice_window
        applies_to: [bank_error_notice_filed]
        kind: time
        condition: "A notice can be given only within error_notice_window_days calendar days after the disclosed date of availability."
        evidence_fields: [bank_transfers.bank_transfer_id, bank_transfers.date_available]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_transfers.bank_transfer_id]
          action_bindings:
            bank_transfers.bank_transfer_id: bank_transfer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the disclosed date of availability"
          anchor_source: bank_transfers.date_available
          relation: not_after
          duration_source: variants.error_notice_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days from date_available, and a notice on date_available plus the window days is on time."
          boundary: inclusive
      - id: one_open_notice_per_type
        applies_to: [bank_error_notice_filed]
        kind: dedup
        condition: "Only one notice of each case_type may be open on a transfer at a time."
        evidence_fields: [bank_cases.bank_transfer_id, bank_cases.case_type, bank_cases.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_cases.bank_transfer_id]
          action_bindings:
            bank_cases.bank_transfer_id: bank_transfer_id
        dedup_contract:
          table: bank_cases
          mode: separate_record
          object_bindings: {bank_transfer_id: bank_transfer_id, case_type: case_type}
          duplicate_filters: {event_type: [bank_error_notice_filed]}
          distinct_fields: [case_date]
      - id: error_found_first
        applies_to: [bank_remedy_chosen]
        kind: authorization
        condition: "A remedy can be chosen only after a decision of error_found on that notice."
        evidence_fields: [bank_cases.case_id, bank_cases.related_case_id, bank_cases.case_outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_cases.related_case_id]
          action_bindings:
            bank_cases.related_case_id: related_case_id
    params:
      per_tier:
        Bank Deposit Economy: {error_notice_window_days: "=error_notice_window_days", error_investigation_days: "=error_investigation_days", refund_business_days: "=refund_business_days", redelivery_business_days: "=redelivery_business_days", intermediary_fee_estimate_usd: "=intermediary_fee_estimate_usd"}
        Bank Deposit Standard: {error_notice_window_days: "=error_notice_window_days", error_investigation_days: "=error_investigation_days", refund_business_days: "=refund_business_days", redelivery_business_days: "=redelivery_business_days", intermediary_fee_estimate_usd: "=intermediary_fee_estimate_usd"}
        Bank Deposit Express: {error_notice_window_days: "=error_notice_window_days", error_investigation_days: "=error_investigation_days", refund_business_days: "=refund_business_days", redelivery_business_days: "=redelivery_business_days", intermediary_fee_estimate_usd: "=intermediary_fee_estimate_usd"}
        Bank Deposit Express Plus: {error_notice_window_days: "=error_notice_window_days", error_investigation_days: "=error_investigation_days", refund_business_days: "=refund_business_days", redelivery_business_days: "=redelivery_business_days", intermediary_fee_estimate_usd: "=intermediary_fee_estimate_usd"}
        Bank Deposit Large Amount: {error_notice_window_days: "=error_notice_window_days", error_investigation_days: "=error_investigation_days", refund_business_days: "=refund_business_days", redelivery_business_days: "=redelivery_business_days", intermediary_fee_estimate_usd: "=intermediary_fee_estimate_usd"}
        Bank Deposit International Wire: {error_notice_window_days: "=error_notice_window_days", error_investigation_days: "=error_investigation_days", refund_business_days: "=refund_business_days", redelivery_business_days: "=redelivery_business_days", intermediary_fee_estimate_usd: "=intermediary_fee_estimate_usd"}

  - id: bank_evt_recall
    subject: [bank_recall_requested, bank_recall_closed, bank_fee_charged]
    rule: >-
      A recall asks the beneficiary bank to send back a deposited payment that went to wrong
      beneficiary details the customer supplied; it is not an error under the Remittance Transfer
      Rule and Paloma cannot compel the beneficiary bank. The customer requests the recall and
      accepts its fee. A recall can be requested only on a transfer whose status is deposited. A
      recall may be requested only within recall_window_days calendar days after the funds were
      deposited. The window is counted in calendar days from deposited_date, and a request on
      deposited_date plus the window days is on time. Only one recall may be requested per
      transfer. recall_fee_usd is collected when the recall is requested, as fee_type recall_fee
      with the deposited payout's payout_attempt, and is not refunded whatever the outcome. When the
      beneficiary bank sends the money back (recalled) it is booked as a return with return_reason
      recalled_at_sender_request, attributed to the sender, and handled under bank_evt_returns; when
      the recall fails nothing comes back and nothing further is owed. A recall and an error notice
      of wrong_account_details are mutually exclusive on one transfer: wrong details the customer
      supplied go to recall, a misrouting on Paloma's side goes to an error notice.
    eligibility:
      - id: deposited_only
        applies_to: [bank_recall_requested]
        kind: state
        condition: "A recall can be requested only on a transfer whose status is deposited."
        evidence_fields: [bank_transfers.bank_transfer_id, bank_transfers.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_transfers.bank_transfer_id]
          action_bindings:
            bank_transfers.bank_transfer_id: bank_transfer_id
        state_contract:
          field: bank_transfers.status
          allowed: [deposited]
      - id: recall_window
        applies_to: [bank_recall_requested]
        kind: time
        condition: "A recall may be requested only within recall_window_days calendar days after the funds were deposited."
        evidence_fields: [bank_transfers.bank_transfer_id, bank_transfers.deposited_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_transfers.bank_transfer_id]
          action_bindings:
            bank_transfers.bank_transfer_id: bank_transfer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the funds were deposited"
          anchor_source: bank_transfers.deposited_date
          relation: not_after
          duration_source: variants.recall_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days from deposited_date, and a request on deposited_date plus the window days is on time."
          boundary: inclusive
      - id: one_recall
        applies_to: [bank_recall_requested]
        kind: dedup
        condition: "Only one recall may be requested per transfer."
        evidence_fields: [bank_cases.bank_transfer_id, bank_cases.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_cases.bank_transfer_id]
          action_bindings:
            bank_cases.bank_transfer_id: bank_transfer_id
        dedup_contract:
          table: bank_cases
          mode: separate_record
          object_bindings: {bank_transfer_id: bank_transfer_id}
          duplicate_filters: {event_type: [bank_recall_requested]}
          distinct_fields: []
    params:
      per_tier:
        Bank Deposit Economy: {recall_window_days: "=recall_window_days", recall_fee_usd: "=recall_fee_usd"}
        Bank Deposit Standard: {recall_window_days: "=recall_window_days", recall_fee_usd: "=recall_fee_usd"}
        Bank Deposit Express: {recall_window_days: "=recall_window_days", recall_fee_usd: "=recall_fee_usd"}
        Bank Deposit Express Plus: {recall_window_days: "=recall_window_days", recall_fee_usd: "=recall_fee_usd"}
        Bank Deposit Large Amount: {recall_window_days: "=recall_window_days", recall_fee_usd: "=recall_fee_usd"}
        Bank Deposit International Wire: {recall_window_days: "=recall_window_days", recall_fee_usd: "=recall_fee_usd"}

  - id: bank_evt_on_time_promise
    subject: [bank_fee_refunded]
    rule: >-
      On a tier whose on_time_promise is true, Paloma refunds the transfer fee in full, with
      fee_refund_reason late_delivery, when the transfer was deposited after its date_available as
      last disclosed. The promise does not apply when the lateness came from the customer: wrong
      beneficiary details the customer supplied, or a request for information the customer answered
      after rfi_response_days. The promise covers the transfer fee only; card funding fees and
      surcharges are not part of it. A customer may claim it from an agent without giving an error
      notice. The transfer fee is refunded at most once on a transfer, so the on-time refund and an
      error-resolution fee refund never stack. A tier whose on_time_promise is false gives no
      automatic fee refund for lateness, and the customer's route is an error notice.
    eligibility:
      - id: deposited_late
        applies_to: [bank_fee_refunded]
        kind: authorization
        condition: "On a tier whose on_time_promise is true, Paloma refunds the transfer fee in full, with fee_refund_reason late_delivery, when the transfer was deposited after its date_available as last disclosed."
        evidence_fields: [bank_transfers.bank_transfer_id, bank_transfers.deposited_date, bank_transfers.date_available, bank_transfers.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_transfers.bank_transfer_id]
          action_bindings:
            bank_transfers.bank_transfer_id: bank_transfer_id
    params:
      per_tier:
        Bank Deposit Economy: {on_time_promise: "=on_time_promise", rfi_response_days: "=rfi_response_days"}
        Bank Deposit Standard: {on_time_promise: "=on_time_promise", rfi_response_days: "=rfi_response_days"}
        Bank Deposit Express: {on_time_promise: "=on_time_promise", rfi_response_days: "=rfi_response_days"}
        Bank Deposit Express Plus: {on_time_promise: "=on_time_promise", rfi_response_days: "=rfi_response_days"}
        Bank Deposit Large Amount: {on_time_promise: "=on_time_promise", rfi_response_days: "=rfi_response_days"}
        Bank Deposit International Wire: {on_time_promise: "=on_time_promise", rfi_response_days: "=rfi_response_days"}
