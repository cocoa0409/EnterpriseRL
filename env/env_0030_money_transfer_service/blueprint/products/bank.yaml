      realtime_cap_usd_by_corridor: {}
      max_transfers_per_recipient_24h: 2
      fee_ladder: [{from_usd: 100.00, to_usd: 50000.00, fee_usd: 24.99}]
      credit_card_fee_pct: 0.00
      debit_card_fee_usd: 0.00
      pay_by_bank_fee_discount_usd: 0.00
      fx_margin_pct: 0.85
      margin_reduction_threshold_usd: 10000.00
      margin_reduction_pct_points: 0.15
      rate_lock_hours: 48
      delivery_business_days: 2
      booking_cutoff_ct: "14:00"
      weekend_payout: false
      purpose_code_corridors: [IN-INR, BD-BDT, NG-NGN, VN-VND]
      first_transfer_fee_waived: false
      first_transfer_promo_cap_usd: 0.00
      first_transfer_promo_margin_pct: 0.85
      on_time_promise: false
      cancel_full_refund_window_hours: 0.50
      late_cancel_fee_refund_pct: 0
      in_transit_cancellable: false
      refund_business_days: 3
      rfi_response_days: 14
      rfi_expiry_fee_refund_pct: 100
      hold_review_business_days: 3
      funding_deadline_hours: 48
      return_reason_attribution: {invalid_account_number: sender, account_closed: sender, name_mismatch: sender, account_frozen: sender, account_type_mismatch: sender, currency_not_accepted: paloma, partner_processing_error: paloma, duplicate_payment: paloma, recalled_at_sender_request: sender}
      return_decision_window_days: 60
      return_handling_fee_usd: 30.00
      return_conversion_margin_pct: 0.50
