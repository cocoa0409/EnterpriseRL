# Paloma Remit — product charter: Bank Deposit transfers.
# Each personal transfer paid into a recipient's bank account is one holding: the transfer order the
# customer booked, at one Bank Deposit service tier, carrying its own principal, fee, locked exchange
# rate and disclosed date of availability. The tier decides the payout rail (local batch, local real
# time, SWIFT), the funding methods, the price (fee ladder and exchange-rate margin), and how
# cancellations, returns, resends, recalls and error claims are handled. Paloma is a US money
# transmitter: the Remittance Transfer Rule (Regulation E, subpart B) governs cancellation, refunds
# and error resolution for these consumer transfers.

category: bank
display_name: Bank Deposit

binding:
  holding_table: bank_transfers
  event_tables: [bank_ledger, bank_cases]
  status_field: status
  variant_field: variant_name
  quantity_fields: {principal_held_usd: principal_held, fees_held_usd: fees_held}

lifecycle:
  states: [awaiting_funds, on_hold, in_transit, deposited, returned, cancelled, refunded]
  transitions:
    - {from: awaiting_funds, to: in_transit, by: system, means: "Funds are collected (or ACH principal is released early) and screening passes; the transfer is released to the payout partner."}
    - {from: awaiting_funds, to: on_hold, by: system, means: "A compliance, funding or new-recipient screening hold is placed before release."}
    - {from: in_transit, to: on_hold, by: system, means: "The payout partner or Paloma compliance stops a released transfer for screening."}
    - {from: on_hold, to: in_transit, by: system, means: "Compliance clears the hold and the transfer is released."}
    - {from: in_transit, to: deposited, by: system, means: "The beneficiary bank confirms the credit to the recipient's account."}
    - {from: in_transit, to: returned, by: system, means: "The beneficiary bank rejects the payment and the funds come back to Paloma."}
    - {from: deposited, to: returned, by: system, means: "A deposited payment comes back, by a late bank return or a successful recall."}
    - {from: returned, to: in_transit, by: agent, means: "The returned transfer is sent again with corrected recipient bank details."}
    - {from: deposited, to: in_transit, by: agent, means: "After an error resolution found in the customer's favour, the funds are delivered again at no cost to the customer."}
    - {from: awaiting_funds, to: cancelled, by: user, means: "The customer cancels a transfer that has not been released."}
    - {from: on_hold, to: cancelled, by: user, means: "The customer cancels a transfer that is on hold."}
    - {from: in_transit, to: cancelled, by: user, means: "The customer cancels a released batch-rail transfer before the beneficiary bank credits it."}
    - {from: on_hold, to: cancelled, by: system, means: "Paloma cancels a held transfer whose request for information expired unanswered or that compliance rejected."}
    - {from: awaiting_funds, to: cancelled, by: system, means: "The customer's payment fails (ACH return, card capture failure) or an inbound wire does not arrive in time."}
    - {from: cancelled, to: refunded, by: agent, means: "The collected money owed back on a cancelled transfer is refunded to the customer."}
    - {from: returned, to: refunded, by: agent, means: "The money owed back on a returned transfer is refunded to the customer."}
    - {from: deposited, to: refunded, by: agent, means: "After an error resolution, Paloma refunds the customer for a deposited transfer."}

accounts:
  - key: principal_held
    unit: USD
    meaning: "Customer principal Paloma holds for this transfer: collected funds, returned funds and Paloma make-good credits in; payouts to the beneficiary bank and refunds to the customer out."
  - key: fees_held
    unit: USD
    meaning: "Fees Paloma has collected on this transfer net of fee refunds: fee charges in, fee refunds out."

parameter_schema:
  delivery_rail: "Payout rail the tier uses: local_batch, local_realtime or swift."
  funding_methods_allowed: "Funding methods the tier accepts (list of ach_debit, debit_card, credit_card, pay_by_bank, wire); the account level may narrow it further."
  entry_min_account_level: "Lowest Personal Sender Account level (official name) that may book this tier."
  entry_min_completed_transfers: "Fewest completed personal transfers (account_msr_completed_transfers) the customer needs before booking this tier (count)."
  corridors_served: "Corridors this tier pays into (list of corridor codes)."
  min_send_usd: "Smallest principal (USD) the tier accepts per transfer."
  max_send_usd: "Largest principal (USD) the tier accepts per transfer, before the account level's per-transfer limit is applied."
  realtime_cap_usd_by_corridor: "Per-corridor ceiling (USD principal) imposed by the corridor's instant-payment scheme on real-time tiers; a corridor not listed has no ceiling below max_send_usd; empty on non-real-time tiers (mapping corridor -> USD)."
  max_transfers_per_recipient_24h: "Largest number of Bank Deposit transfers to the same recipient in a rolling 24 hours (count)."
  fee_ladder: "Transfer fee by principal band: list of {from_usd, to_usd, fee_usd}; bands are inclusive at both ends and cover min_send_usd to max_send_usd."
  credit_card_fee_pct: "Card funding fee charged as a percentage of principal when the transfer is funded by credit card (percent; 0 when credit cards are not accepted)."
  debit_card_fee_usd: "Flat fee (USD) added when the transfer is funded by debit card."
  pay_by_bank_fee_discount_usd: "Amount (USD) taken off the ladder fee when the transfer is funded by pay-by-bank; the fee never goes below 0.00."
  fx_margin_pct: "Exchange-rate margin below the mid-market rate applied to the customer rate (percent)."
  margin_reduction_threshold_usd: "Principal (USD) at or above which the reduced margin applies."
  margin_reduction_pct_points: "Percentage points taken off fx_margin_pct when principal is at or above the threshold."
  rate_lock_hours: "Hours from booked_at for which the quoted exchange rate stays guaranteed while funds are awaited."
  delivery_business_days: "Paloma business days from release to the disclosed date of availability (0 = same day as release)."
  booking_cutoff_ct: "Latest US Central time on a business day for release to count from that day; later releases count from the next business day (HH:MM, or 24x7 for real-time tiers)."
  weekend_payout: "Whether payouts are made on Saturdays, Sundays and US Federal Reserve holidays (boolean)."
  purpose_code_corridors: "Corridors where a transfer_purpose must be stated at booking (list of corridor codes)."
  first_transfer_fee_waived: "Whether the transfer fee is waived on the customer's first-ever personal transfer when booked on this tier (boolean)."
  first_transfer_promo_cap_usd: "Largest principal (USD) a first-transfer promotion covers; above it the regular price applies to the whole transfer (USD; 0 = no promotion)."
  first_transfer_promo_margin_pct: "Exchange-rate margin applied to a first transfer covered by the promotion (percent)."
  on_time_promise: "Whether Paloma refunds the transfer fee when a transfer reaches the recipient after its disclosed date_available for a reason on Paloma's side (boolean)."
  cancel_full_refund_window_hours: "Elapsed hours after booked_at within which a cancellation refunds principal and every fee in full (Regulation E 30-minute right, expressed in hours)."
  late_cancel_fee_refund_pct: "Share of the transfer fee refunded when a not-yet-released transfer is cancelled after the full-refund window (percent)."
  in_transit_cancellable: "Whether a released transfer may still be cancelled before the beneficiary bank credits it (boolean)."
  refund_business_days: "Paloma business days within which a refund owed to the customer must be issued, counted from the day it becomes owed."
  rfi_response_days: "Calendar days the customer has to answer a transfer-level request for information before the transfer is cancelled."
  rfi_expiry_fee_refund_pct: "Share of the transfer fee refunded when Paloma cancels a held transfer (percent)."
  hold_review_business_days: "Paloma business days compliance takes to clear a hold once its request for information is answered; the date_available is re-disclosed from the release."
  funding_deadline_hours: "Hours after booked_at within which an inbound wire must arrive before the booking is cancelled (0 = not applicable)."
  return_reason_attribution: "Whether each bank return reason is attributable to the sender's details or to Paloma's side (mapping return_reason -> sender | paloma)."
  return_decision_window_days: "Calendar days after funds come back within which the customer may have the transfer sent again; after that it is refunded."
  return_handling_fee_usd: "Fee (USD) a beneficiary bank charges on a sender-attributable return, deducted from the refund."
  return_conversion_margin_pct: "Margin below the mid-market rate at which returned foreign currency is converted back to USD (percent)."
  resend_fee_usd: "Fee (USD) for sending a returned transfer again after a sender-attributable return."
  free_resends_per_transfer: "Number of sender-attributable resends on one transfer for which resend_fee_usd is waived (count)."
  max_resends: "Largest number of times one transfer may be sent again after returns (count); beyond it the transfer must be refunded."
  amendable_fields: "Recipient bank details that may be corrected on a returned transfer (list of field names)."
  swift_charge_options: "Charge options offered for SWIFT payments (list of SHA, OUR, or not_applicable)."
  swift_our_surcharge_usd: "Fee (USD) for the OUR option, under which Paloma pays every intermediary bank charge."
  intermediary_fee_estimate_usd: "Intermediary-bank deduction (USD) disclosed as an estimate on SHA payments."
  recall_fee_usd: "Fee (USD) for asking the beneficiary bank to recall a deposited payment sent to wrong details the customer supplied."
  recall_window_days: "Calendar days after deposited_date within which a recall may be requested."
  error_notice_window_days: "Calendar days after the disclosed date_available within which the customer may give notice of an error."
  error_investigation_days: "Calendar days after an error notice within which Paloma must decide it."
  redelivery_business_days: "Paloma business days within which funds are sent again after the customer chooses redelivery as a remedy."
  payout_retry_attempts: "Automatic retries of a payout that fails for a technical reason before it is treated as returned (count)."

