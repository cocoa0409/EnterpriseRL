events:
  # ---- holding writes (bank_transfers) ----
  - type: bank_transfer_booked
    target: bank_transfers
    mutation: create
    meaning: "The customer books and pays for a Bank Deposit transfer after seeing the pre-payment disclosure (principal, fees, exchange rate, amount received, date available)."
    grain: "One row per transfer order."
    fields:
      customer_id: "The sending customer."
      sender_account_id: "The customer's Personal Sender Account the transfer is booked under."
      recipient_id: "The saved recipient paid."
      variant_name: "The Bank Deposit tier chosen."
      corridor: "Destination corridor (country and payout currency)."
      confirmation_number: "Confirmation number shown on the receipt."
      send_amount_usd: "Principal in USD."
      transfer_fee_usd: "Transfer fee disclosed, after any promotion or pay-by-bank discount."
      surcharge_usd: "Card funding fee or SWIFT OUR surcharge disclosed; 0.00 when none."
      fx_rate: "Customer exchange rate locked at booking."
      receive_amount: "Amount the recipient receives in the payout currency."
      funding_method: "How the customer pays."
      swift_charge_option: "SHA or OUR on the International Wire tier; not_applicable otherwise."
      transfer_purpose: "Stated purpose of the transfer."
      beneficiary_name: "Account holder name of the recipient's bank account."
      beneficiary_bank_name: "Recipient's bank."
      beneficiary_account_number: "Recipient's account number (CLABE, IBAN-style or local format)."
      booked_at: "Moment the customer authorised payment."
      date_available: "Disclosed date the money will be available to the recipient."
    triggers:
      - event: bank:bank_funds_received
        when: {funding_method: [debit_card, credit_card, pay_by_bank]}
        map: {amount_usd: send_amount_usd}
      - event: bank:bank_fee_charged
        when: {funding_method: [debit_card, credit_card, pay_by_bank], transfer_fee_usd: {not: 0.0}}
        map: {fee_type: transfer_fee, amount_usd: transfer_fee_usd, payout_attempt: 1}
      - event: bank:bank_fee_charged
        when: {funding_method: credit_card}
        map: {fee_type: card_funding_fee, amount_usd: surcharge_usd, payout_attempt: 1}
  - type: bank_rate_requoted
    target: bank_transfers
    mutation: update
    meaning: "Funds arrive after the rate lock lapsed, and the exchange rate, amount received and date available are re-disclosed."
    grain: "One row per re-quote."
    fields:
      fx_rate: "New customer exchange rate."
      receive_amount: "New amount the recipient receives."
      date_available: "Re-disclosed date available."
    triggers: []
  - type: bank_released
    target: bank_transfers
    mutation: {transition: {from: awaiting_funds, to: in_transit}}
    meaning: "The transfer is released to the payout partner."
    grain: "One row per first release."
    fields:
      date_available: "Date available, unchanged unless the release itself re-disclosed it."
    triggers:
      - event: bank:bank_payout_sent
        map: {payout_attempt: 1}
  - type: bank_hold_placed
    target: bank_transfers
    mutation: {transition: [{from: awaiting_funds, to: on_hold}, {from: in_transit, to: on_hold}]}
    meaning: "Compliance, funding review, partner screening or new-recipient cooling-off stops the transfer."
    grain: "One row per hold."
    fields:
      hold_reason: "Why the transfer is held."
      held_at: "Moment the hold was placed."
    triggers: []
  - type: bank_hold_released
    target: bank_transfers
    mutation: {transition: {from: on_hold, to: in_transit}}
    meaning: "Compliance clears the hold and the transfer moves on to the payout partner."
    grain: "One row per hold release."
    fields:
      hold_reason: "Reset to none."
      date_available: "Re-disclosed date available counted from the release."
    triggers: []
  - type: bank_deposit_confirmed
    target: bank_transfers
    mutation: {transition: {from: in_transit, to: deposited}}
    meaning: "The beneficiary bank confirms the money is in the recipient's account."
    grain: "One row per confirmed deposit."
    fields:
      deposited_date: "Date the beneficiary bank credited the account."
      closed_date: "Same as deposited_date."
    triggers:
      - event: rewards:rewards_points_earned
        map: {source_transfer_id: bank_transfer_id, source_category: bank}
  - type: bank_transfer_returned
    target: bank_transfers
    mutation: {transition: [{from: in_transit, to: returned}, {from: deposited, to: returned}]}
    meaning: "The payment comes back to Paloma from the beneficiary bank."
    grain: "One row per return."
    fields:
      deposited_date: "Cleared when a deposited payment comes back."
      closed_date: "Cleared; the transfer is open again."
    triggers: []
  - type: bank_resent
    target: bank_transfers
    mutation: {transition: [{from: returned, to: in_transit}, {from: deposited, to: in_transit}]}
    meaning: "The transfer is sent again: after a return with corrected details, or as a no-cost redelivery after an error resolution."
    grain: "One row per resend."
    fields:
      date_available: "Re-disclosed date available for the new payout."
    triggers:
      - event: bank:bank_payout_sent
        map: {}
  - type: bank_transfer_cancelled
    target: bank_transfers
    mutation: {transition: [{from: awaiting_funds, to: cancelled}, {from: on_hold, to: cancelled}, {from: in_transit, to: cancelled}]}
    meaning: "The customer cancels their own transfer before the money reaches the recipient's account."
    grain: "One row per customer cancellation."
    fields:
      cancelled_at: "Moment the customer confirmed the cancellation."
    triggers: []
  - type: bank_transfer_auto_cancelled
    target: bank_transfers
    mutation: {transition: [{from: on_hold, to: cancelled}, {from: awaiting_funds, to: cancelled}]}
    meaning: "Paloma cancels the transfer: an unanswered or rejected request for information, a compliance rejection, or a failed or late payment."
    grain: "One row per Paloma-initiated cancellation."
    fields:
      cancelled_at: "Moment Paloma cancelled it."
      hold_reason: "The hold or funding reason that led to the cancellation."
    triggers: []
  - type: bank_transfer_refunded
    target: bank_transfers
    mutation: {transition: [{from: cancelled, to: refunded}, {from: returned, to: refunded}, {from: deposited, to: refunded}]}
    meaning: "The money owed back to the customer has been refunded and the transfer is closed."
    grain: "One row per closing refund."
    fields:
      closed_date: "Date of the closing refund."
    triggers: []
  - type: bank_beneficiary_amended
    target: bank_transfers
    mutation: update
    meaning: "Recipient bank details on a returned transfer are corrected with details the customer supplies."
    grain: "One row per amendment."
    fields:
      beneficiary_name: "Corrected account holder name, exactly as the customer gives it."
      beneficiary_bank_name: "Corrected bank, exactly as the customer gives it."
      beneficiary_account_number: "Corrected account number, exactly as the customer gives it."
    triggers: []
  # ---- ledger writes (bank_ledger) ----
  - type: bank_funds_received
    target: bank_ledger
    meaning: "The customer's payment for the principal is collected (card or pay-by-bank capture, ACH settlement, or wire arrival)."
    grain: "One row per principal collection on a transfer."
    distinguish_by: [entry_date]
    fields:
      amount_usd: "Principal collected (positive)."
      entry_date: "Date collected."
    account: principal_held
    direction: in
    triggers: []
  - type: bank_fee_charged
    target: bank_ledger
    meaning: "A fee is collected on the transfer: the transfer fee, a card funding fee, the SWIFT OUR surcharge, a resend fee or a recall fee."
    grain: "One row per fee type per payout attempt."
    distinguish_by: [fee_type, payout_attempt]
    fields:
      fee_type: "Kind of fee."
      amount_usd: "Fee collected (positive)."
      payout_attempt: "The payout attempt the fee belongs to (1 for booking fees; the new attempt number for a resend fee; the recalled attempt for a recall fee)."
      entry_date: "Date collected."
    account: fees_held
    direction: in
    triggers: []
  - type: bank_fee_refunded
    target: bank_ledger
    meaning: "All or part of one collected fee is refunded to the customer."
    grain: "One row per refunded fee charge."
    distinguish_by: [related_entry_id]
    fields:
      related_entry_id: "ledger_entry_id of the bank_fee_charged row refunded."
      amount_usd: "Amount refunded (positive)."
      fee_refund_reason: "Why the fee is refunded."
      entry_date: "Date refunded."
    account: fees_held
    direction: out
    triggers: []
  - type: bank_payout_sent
    target: bank_ledger
    meaning: "Principal is paid out to the beneficiary bank in the payout currency."
    grain: "One row per payout attempt."
    distinguish_by: [payout_attempt]
    fields:
      amount_usd: "USD principal paid out (positive)."
      receive_amount: "Payout-currency amount sent."
      fx_rate_applied: "Exchange rate used for the payout."
      payout_attempt: "1 for the first payout, 2 and up for each resend."
      entry_date: "Date paid out."
    account: principal_held
    direction: out
    triggers: []
  - type: bank_funds_returned
    target: bank_ledger
    meaning: "A payout comes back and its payout-currency amount is converted back to USD."
    grain: "One row per returned payout attempt."
    distinguish_by: [payout_attempt]
    fields:
      amount_usd: "USD recovered after conversion back (positive)."
      receive_amount: "Payout-currency amount that came back."
      fx_rate_applied: "Rate at which it was converted back."
      return_reason: "Return reason code from the beneficiary bank."
      payout_attempt: "The payout attempt that came back."
      entry_date: "Date the funds came back."
    account: principal_held
    direction: in
    triggers:
      - event: bank:bank_transfer_returned
        map: {}
  - type: bank_paloma_credit
    target: bank_ledger
    meaning: "Paloma puts its own money into the transfer: covering an exchange-rate shortfall on a return that is on Paloma's side, or funding a no-cost redelivery, refund or shortfall after an error resolution."
    grain: "One row per make-good credit per source entry."
    distinguish_by: [credit_reason, related_entry_id]
    fields:
      credit_reason: "Why Paloma funds the credit."
      amount_usd: "Amount Paloma puts in (positive)."
      related_entry_id: "The ledger entry the credit makes good (the funds_returned row, or the payout row an error concerned)."
      entry_date: "Date credited."
    account: principal_held
    direction: in
    triggers: []
  - type: bank_refund_issued
    target: bank_ledger
    meaning: "Principal owed back to the customer is refunded to the original funding method."
    grain: "One row per principal refund per basis and source entry."
    distinguish_by: [refund_basis, related_entry_id]
    fields:
      amount_usd: "Principal refunded (positive)."
      refund_basis: "Why the refund is owed."
      related_entry_id: "The ledger entry the refund pays back (the funds_received row, or the funds_returned row on a return)."
      entry_date: "Date refunded."
    account: principal_held
    direction: out
    triggers:
      - event: bank:bank_transfer_refunded
        when: {refund_basis: {not: error_shortfall}}
        map: {closed_date: entry_date}
  # ---- case writes (bank_cases) ----
  - type: bank_rfi_answer_logged
    target: bank_cases
    meaning: "The customer's answer to a transfer-level request for information is logged with the document they uploaded."
    grain: "One row per uploaded answer."
    distinguish_by: [doc_reference]
    fields:
      rfi_topic: "What the request asked about."
      doc_reference: "Upload reference of the answer document, as the app shows it."
      case_date: "Date logged."
    triggers: []
  - type: bank_error_notice_filed
    target: bank_cases
    meaning: "The customer gives notice of an error on a transfer under the Remittance Transfer Rule."
    grain: "One row per error notice."
    distinguish_by: [case_type, case_date]
    fields:
      case_type: "Kind of error asserted."
      case_date: "Date the notice was given."
      resolution_due_date: "Last day for Paloma's decision."
    triggers: []
  - type: bank_error_decided
    target: bank_cases
    meaning: "Paloma's error-resolution team records its finding on one error notice."
    grain: "One row per decision; points back to one notice."
    distinguish_by: [related_case_id]
    fields:
      related_case_id: "case_id of the error notice decided."
      case_outcome: "error_found or no_error."
      case_date: "Date decided."
    triggers: []
  - type: bank_remedy_chosen
    target: bank_cases
    meaning: "After an error is found, the customer chooses their remedy: a refund or delivery at no cost."
    grain: "One row per choice; points back to one notice."
    distinguish_by: [related_case_id]
    fields:
      related_case_id: "case_id of the error notice."
      remedy_choice: "refund or resend for a misdirected or undelivered transfer; refund_shortfall or resend_shortfall for an incorrect amount."
      case_date: "Date chosen."
    triggers:
      - event: bank:bank_refund_issued
        when: {remedy_choice: refund}
        map: {refund_basis: error_resolution}
      - event: bank:bank_refund_issued
        when: {remedy_choice: refund_shortfall}
        map: {refund_basis: error_shortfall}
      - event: bank:bank_resent
        when: {remedy_choice: [resend, resend_shortfall]}
        map: {}
  - type: bank_recall_requested
    target: bank_cases
    meaning: "The customer asks Paloma to recall a deposited payment that went to wrong account details they supplied."
    grain: "One row per recall request."
    distinguish_by: [case_date]
    fields:
      case_type: "recall_request."
      case_date: "Date requested."
    triggers: []
  - type: bank_recall_closed
    target: bank_cases
    meaning: "The beneficiary bank answers a recall: the money is recovered or the recall fails."
    grain: "One row per recall outcome; points back to one request."
    distinguish_by: [related_case_id]
    fields:
      related_case_id: "case_id of the recall request."
      case_outcome: "recalled or recall_failed."
      case_date: "Date of the answer."
    triggers:
      - event: bank:bank_funds_returned
        when: {case_outcome: recalled}
        map: {return_reason: recalled_at_sender_request}

measures:
  - id: bank_msr_transfers_to_recipient_24h
    window: "Rolling 24 hours ending at frozen_time: booked_at strictly later than frozen_time minus 24 hours."
    measure: "Count of bank_transfers on the same recipient_id, excluding status cancelled or refunded."
  - id: bank_msr_resends
    window: "The life of one transfer."
    measure: "Count of bank_payout_sent rows on this bank_transfer_id with payout_attempt of 2 or more."
  - id: bank_msr_sender_resends
    window: "The life of one transfer."
    measure: "Count of bank_payout_sent rows on this bank_transfer_id with payout_attempt of 2 or more that followed a bank_funds_returned row whose return_reason is attributed to the sender."

policies:
  - id: bank_agg_multi_holding
    subject: [bank_transfer_booked]
    rule: >-
      A customer may hold any number of Bank Deposit transfers at once; every booking is its own
      transfer with its own confirmation number, principal, fees, locked rate and disclosed date of
      availability. What bounds them is the aggregate sending limits of the customer's Personal
      Sender Account and the per-recipient frequency cap (bank_agg_sending_limits). Transfers are
      never merged, netted or batched: each is priced, cancelled, refunded, returned and resolved on
      its own, and a refund or fee refund on one transfer never offsets an amount on another.
    eligibility: []
    params:
      max_per_customer: null

  - id: bank_agg_sending_limits
    subject: [bank_transfer_booked]
    rule: >-
      A Bank Deposit transfer is booked only under the customer's own Personal Sender Account, and
      only while that account's status is active. Its principal must fit every ceiling of
      account_sending_limits for the account's level at the moment of booking, aggregated over all
      of the customer's personal transfers in Bank Deposit, Cash Pickup and Mobile Wallet
      (account_msr_send_24h, account_msr_send_30d, account_msr_send_180d,
      account_msr_transfers_24h, account_msr_corridors_30d). The principal must also lie between
      the tier's min_send_usd and max_send_usd, both inclusive. On a tier whose delivery_rail is local_realtime the
      principal may not exceed the corridor's entry in realtime_cap_usd_by_corridor; a corridor
      with no entry has no ceiling below max_send_usd. No more than
      max_transfers_per_recipient_24h Bank Deposit transfers to one recipient may be booked as
      counted by bank_msr_transfers_to_recipient_24h including the new one. The binding ceiling for
      one transfer is the lowest of the account level's per_transfer_limit_usd, the tier's
      max_send_usd and the corridor cap. A booking over any ceiling is not made: the customer may
      lower the principal, pick a tier or delivery method whose ceiling fits, wait for the window,
      or raise the account level; Paloma never splits one requested amount into several transfers.
    eligibility:
      - id: sender_account_active
        applies_to: [bank_transfer_booked]
        kind: state
        condition: "A Bank Deposit transfer is booked only under the customer's own Personal Sender Account, and only while that account's status is active."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.customer_id, sender_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
        state_contract:
          field: sender_accounts.status
          allowed: [active]
      - id: recipient_frequency
        applies_to: [bank_transfer_booked]
        kind: authorization
        condition: "No more than max_transfers_per_recipient_24h Bank Deposit transfers to one recipient may be booked as counted by bank_msr_transfers_to_recipient_24h including the new one."
        evidence_fields: [bank_transfers.recipient_id, bank_transfers.booked_at, bank_transfers.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_transfers.recipient_id]
          action_bindings:
            bank_transfers.recipient_id: recipient_id
    params:
      per_tier:
        Bank Deposit Economy: {delivery_rail: "=delivery_rail", min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", realtime_cap_usd_by_corridor: "=realtime_cap_usd_by_corridor", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
        Bank Deposit Standard: {delivery_rail: "=delivery_rail", min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", realtime_cap_usd_by_corridor: "=realtime_cap_usd_by_corridor", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
        Bank Deposit Express: {delivery_rail: "=delivery_rail", min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", realtime_cap_usd_by_corridor: "=realtime_cap_usd_by_corridor", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
        Bank Deposit Express Plus: {delivery_rail: "=delivery_rail", min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", realtime_cap_usd_by_corridor: "=realtime_cap_usd_by_corridor", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
        Bank Deposit Large Amount: {delivery_rail: "=delivery_rail", min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", realtime_cap_usd_by_corridor: "=realtime_cap_usd_by_corridor", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
        Bank Deposit International Wire: {delivery_rail: "=delivery_rail", min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", realtime_cap_usd_by_corridor: "=realtime_cap_usd_by_corridor", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
    measures: [bank_msr_transfers_to_recipient_24h]

  - id: bank_evt_booking_eligibility
    subject: [bank_transfer_booked]
    rule: >-
      Booking is the customer's own authorisation of payment: the agent may quote and explain, and
      the customer books. A tier may be booked only when the account's level is at or above the
      tier's entry_min_account_level (by level_number) and account_msr_completed_transfers is at
      least the tier's entry_min_completed_transfers. The funding method must be in the tier's
      funding_methods_allowed and also allowed by the account level (account_evt_funding_entitlements);
      when the two disagree the narrower one wins. The corridor must be in the tier's
      corridors_served. The recipient must be a saved recipient of the same customer whose status is
      active and whose corridor equals the transfer's corridor, and the beneficiary name, bank and
      account number are copied from that saved recipient exactly. In a corridor listed in
      purpose_code_corridors a transfer_purpose must be stated; elsewhere it is recorded as the
      customer states it. swift_charge_option is SHA or OUR, as the customer picks from
      swift_charge_options, on the International Wire tier and not_applicable on every other tier.
      A tier that does not serve the corridor or funding method is never substituted silently; the
      customer chooses another tier or delivery method.
    eligibility:
      - id: tier_entry
        applies_to: [bank_transfer_booked]
        kind: authorization
        condition: "A tier may be booked only when the account's level is at or above the tier's entry_min_account_level (by level_number) and account_msr_completed_transfers is at least the tier's entry_min_completed_transfers."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
      - id: recipient_on_file
        applies_to: [bank_transfer_booked]
        kind: authorization
        condition: "The recipient must be a saved recipient of the same customer whose status is active and whose corridor equals the transfer's corridor, and the beneficiary name, bank and account number are copied from that saved recipient exactly."
        evidence_fields: [recipients.recipient_id, recipients.customer_id, recipients.status, recipients.corridor]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [recipients.recipient_id]
          action_bindings:
            recipients.recipient_id: recipient_id
    params:
      per_tier:
        Bank Deposit Economy: {entry_min_account_level: "=entry_min_account_level", entry_min_completed_transfers: "=entry_min_completed_transfers", funding_methods_allowed: "=funding_methods_allowed", corridors_served: "=corridors_served", purpose_code_corridors: "=purpose_code_corridors", swift_charge_options: "=swift_charge_options"}
        Bank Deposit Standard: {entry_min_account_level: "=entry_min_account_level", entry_min_completed_transfers: "=entry_min_completed_transfers", funding_methods_allowed: "=funding_methods_allowed", corridors_served: "=corridors_served", purpose_code_corridors: "=purpose_code_corridors", swift_charge_options: "=swift_charge_options"}
