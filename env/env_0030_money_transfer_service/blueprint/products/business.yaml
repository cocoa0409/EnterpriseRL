# Paloma Remit — product charter: Paloma Business (small-business accounts).
# A small business that pays suppliers, contractors and staff abroad holds a Paloma Business
# account under one subscription plan. The account carries a USD business balance the business
# funds by ACH, wire or debit card, a monthly allowance of free payouts, user seats for its staff,
# and a monthly payout volume limit. Each payout is debited from the balance and tracked by its
# payout reference. Business payouts are commercial transfers: the consumer Remittance Transfer Rule
# does not apply, and cancellations, returns and fees follow this charter alone.

category: business
display_name: Paloma Business

binding:
  holding_table: business_accounts
  event_tables: [business_ledger, business_payouts, business_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_usd: balance, free_payouts_remaining: payout_allowance}

lifecycle:
  states: [pending_kyb, active, past_due, suspended, closed]
  transitions:
    - {from: pending_kyb, to: active, by: system, means: "Know-your-business (KYB) review approves the business and the first billing period starts."}
    - {from: pending_kyb, to: closed, by: system, means: "KYB review rejects the business or the application lapses."}
    - {from: active, to: past_due, by: system, means: "A subscription or seat charge cannot be collected from the balance."}
    - {from: past_due, to: active, by: agent, means: "The overdue charges are collected from the balance and the account returns to good standing."}
    - {from: past_due, to: suspended, by: system, means: "Overdue charges remain unpaid past the suspension point."}
    - {from: active, to: suspended, by: system, means: "Paloma compliance suspends the account for review."}
    - {from: suspended, to: active, by: agent, means: "Overdue charges are collected on a non-payment suspension and payouts resume."}
    - {from: suspended, to: active, by: system, means: "Compliance closes its review of a compliance-review suspension."}
    - {from: suspended, to: closed, by: system, means: "Paloma terminates the account after a compliance decision or prolonged non-payment."}
    - {from: active, to: closed, by: user, means: "The business owner confirms closure of the account."}

accounts:
  - key: balance
    unit: USD
    meaning: "The business's USD balance with Paloma: deposits, credited-back payouts, fee refunds and proration credits in; payouts, fees and withdrawals out."
  - key: payout_allowance
    unit: payouts
    meaning: "Free payouts left in the current billing period: the plan allowance granted at period start and restored payouts in; payouts that use a free slot and the unused remainder expiring at period end out."

parameter_schema:
  monthly_fee_usd: "Subscription fee (USD) per monthly billing period."
  annual_fee_usd: "Subscription fee (USD) per annual billing period."
  annual_billing_available: "Whether the plan may be billed annually (boolean)."
  included_seats: "User seats included in the subscription (count)."
  extra_seat_fee_usd: "Fee (USD) per billing month for each active user beyond the included seats."
  max_seats: "Largest number of active users the plan allows (count)."
  free_payouts_per_period: "Free payouts granted at the start of each monthly billing period (count; annual plans receive it every month)."
  allowance_rollover: "Whether unused free payouts carry into the next period (boolean)."
  payout_fee_usd: "Fee (USD) per local-rail payout that does not use a free payout."
  swift_payout_fee_usd: "Fee (USD) per SWIFT payout; SWIFT payouts never use the free allowance."
  api_payout_fee_discount_usd: "Amount (USD) taken off payout_fee_usd for a payout submitted through the API (never below 0.00)."
  fx_margin_pct: "Exchange-rate margin below mid-market on payouts (percent)."
  margin_reduction_threshold_usd: "Payout principal (USD) at or above which the reduced margin applies."
  margin_reduction_pct_points: "Percentage points taken off fx_margin_pct at or above the threshold."
  monthly_volume_limit_usd: "Largest sum of payout principal (USD) per billing period."
  per_payout_limit_usd: "Largest principal (USD) of one payout."
  min_payout_usd: "Smallest principal (USD) of one payout."
  batch_payouts_enabled: "Whether payouts may be submitted as a batch file (boolean)."
  max_batch_lines: "Largest number of payout lines in one batch (count; 0 = batches not available)."
  dual_approval_threshold_usd: "Payout principal (USD) at or above which a second user with the approver role must approve before release (0 = dual approval not available)."
  api_access: "Whether payouts may be submitted through the Paloma Business API (boolean)."
  scheduled_payouts_enabled: "Whether payouts may be scheduled for a future release date (boolean)."
  payout_submission_channels: "Channels through which payouts may be submitted (list of web, batch_file, api)."
  corridors_served: "Corridors payouts can be sent to on local rails (list)."
  swift_payouts_enabled: "Whether SWIFT payouts to banks outside local rails are available (boolean)."
  max_balance_usd: "Largest balance (USD) the account may hold; deposits beyond it are returned."
  deposit_methods: "Ways the business may fund its balance (list of ach_credit, wire, debit_card)."
  card_deposit_fee_pct: "Fee on a debit-card deposit as a percentage of the deposit (percent)."
  wire_deposit_fee_usd: "Fee (USD) per incoming wire deposit."
  ach_deposit_hold_business_days: "Paloma business days an ACH deposit is held before it can fund payouts."
  withdrawal_fee_usd: "Fee (USD) per withdrawal of balance to the business's US bank account beyond the free ones."
  free_withdrawals_per_period: "Withdrawals per billing period that carry no fee (count)."
  payout_cancel_fee_usd: "Fee (USD) for cancelling a payout before release."
  return_fee_usd: "Fee (USD) charged when a beneficiary bank returns a payout."
  payout_release_cutoff_ct: "Latest US Central time on a business day for a payout to be released that day (HH:MM)."
  payout_delivery_business_days: "Paloma business days from release to the beneficiary's expected receipt."
  past_due_grace_days: "Calendar days after an account becomes past due during which payouts may still be submitted."
  suspension_after_past_due_days: "Calendar days after an account becomes past due at which it is suspended if still unpaid."
  subscription_refund_window_days: "Calendar days after the first paid subscription charge within which an owner who closes the account gets that charge refunded (0 = none)."
  minimum_commitment_months: "Months from KYB approval during which the plan is committed (0 = none)."
  early_termination_fee_months: "Monthly fees charged when the account is closed or downgraded below this plan inside the commitment (count of months)."
  upgrade_proration_enabled: "Whether leaving this plan for a higher one credits the unused part of its current-period fee (boolean)."
  kyb_documents_required: "Documents the business must provide for KYB on this plan (list of document types)."
  kyb_review_business_days: "Paloma business days KYB review takes once every required document is received."
  entry_min_months_in_business: "Months the business must have been operating to open or move to this plan (months)."
  invoice_required_above_usd: "Payout principal (USD) above which an invoice reference must be given."
  dedicated_account_manager: "Whether a named account manager serves the business (boolean)."
  support_callback_business_days: "Paloma business days within which a requested callback must take place."
  statement_history_months: "Months of balance and payout history available on statements (months)."

