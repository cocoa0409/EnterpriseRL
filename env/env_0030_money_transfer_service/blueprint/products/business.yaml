events:
  # ---- holding writes (business_accounts) ----
  - type: business_account_opened
    target: business_accounts
    mutation: create
    meaning: "A business owner applies for a Paloma Business account on a chosen plan and KYB review begins."
    grain: "One row per business account application."
    fields:
      customer_id: "The owner who applies and administers the account."
      variant_name: "Plan applied for."
      legal_business_name: "Registered legal name of the business, exactly as on its formation document."
      business_type: "Legal form of the business."
      ein_last4: "Last four digits of the business's EIN."
      business_formation_date: "Date the business was formed, from its formation document."
      opened_date: "Date of application."
      billing_cycle: "monthly or annual billing chosen."
    triggers: []
  - type: business_kyb_approved
    target: business_accounts
    mutation: {transition: {from: pending_kyb, to: active}}
    meaning: "KYB review approves the business and its first billing period starts."
    grain: "One row per approval."
    fields:
      kyb_approved_date: "Date of approval; its day of month is the billing day."
      current_period_start: "First day of the first billing period (the approval date)."
      current_period_end: "Last day of the first billing period."
      plan_effective_date: "Date the plan took effect (the approval date)."
      commitment_end_date: "End of the plan's minimum commitment; empty when none."
    triggers:
      - event: business:business_allowance_granted
        map: {billing_period_start: current_period_start}
  - type: business_kyb_rejected
    target: business_accounts
    mutation: {transition: {from: pending_kyb, to: closed}}
    meaning: "KYB review rejects the business or the application lapses."
    grain: "One row per rejected application."
    fields:
      closed_date: "Date closed."
      closure_reason: "kyb_rejected."
    triggers: []
  - type: business_marked_past_due
    target: business_accounts
    mutation: {transition: {from: active, to: past_due}}
    meaning: "A subscription or seat charge cannot be collected from the balance."
    grain: "One row per past-due episode."
    fields:
      past_due_since: "Date the uncollected charge fell due."
    triggers: []
  - type: business_reinstated
    target: business_accounts
    mutation: {transition: [{from: past_due, to: active}, {from: suspended, to: active}]}
    meaning: "Overdue charges are collected or a compliance review closes, and the account returns to active."
    grain: "One row per reinstatement."
    fields:
      past_due_since: "Cleared."
      suspended_date: "Cleared."
      suspension_reason: "Reset to none."
    triggers: []
  - type: business_suspended
    target: business_accounts
    mutation: {transition: [{from: past_due, to: suspended}, {from: active, to: suspended}]}
    meaning: "Payouts are stopped for prolonged non-payment or a compliance review."
    grain: "One row per suspension."
    fields:
      suspended_date: "Date of suspension."
      suspension_reason: "nonpayment or compliance_review."
    triggers: []
  - type: business_closed_by_owner
    target: business_accounts
    mutation: {transition: {from: active, to: closed}}
    meaning: "The business owner confirms closure of the account."
    grain: "One row per owner closure."
    fields:
      closed_date: "Date of closure."
      closure_reason: "owner_request."
    triggers: []
  - type: business_terminated
    target: business_accounts
    mutation: {transition: {from: suspended, to: closed}}
    meaning: "Paloma terminates a suspended account."
    grain: "One row per termination."
    fields:
      closed_date: "Date of termination."
      closure_reason: "compliance_termination or nonpayment."
    triggers: []
  - type: business_plan_upgraded
    target: business_accounts
    mutation: update
    meaning: "The owner moves the account to a higher plan with immediate effect."
    grain: "One row per upgrade."
    fields:
      variant_name: "The higher plan."
      plan_effective_date: "Date of the upgrade."
      commitment_end_date: "New commitment end when the higher plan has one; otherwise unchanged."
    triggers:
      - event: business:business_fee_charged
        map: {fee_type: proration_charge}
  - type: business_downgrade_scheduled
    target: business_accounts
    mutation: update
    meaning: "The owner schedules a move to a lower plan from the next billing period."
    grain: "One row per scheduled downgrade."
    fields:
      scheduled_variant_name: "The lower plan scheduled."
      scheduled_change_date: "First day of the next billing period."
    triggers: []
  - type: business_downgrade_applied
    target: business_accounts
    mutation: update
    meaning: "A scheduled downgrade takes effect at the start of a billing period."
    grain: "One row per applied downgrade."
    fields:
      variant_name: "The lower plan now in force."
      plan_effective_date: "Date it took effect."
      scheduled_variant_name: "Reset to none."
      scheduled_change_date: "Cleared."
    triggers: []
  - type: business_period_rolled
    target: business_accounts
    mutation: update
    meaning: "A new billing period starts on the billing day."
    grain: "One row per billing period start."
    fields:
      current_period_start: "First day of the new period."
      current_period_end: "Last day of the new period."
    triggers:
      - event: business:business_allowance_expired
        map: {}
      - event: business:business_allowance_granted
        map: {billing_period_start: current_period_start}
  # ---- ledger writes (business_ledger) ----
  - type: business_balance_deposited
    target: business_ledger
    meaning: "The business adds money to its balance by ACH credit, wire or debit card."
    grain: "One row per deposit, identified by its deposit reference."
    distinguish_by: [deposit_reference]
    fields:
      amount_usd: "Amount deposited (positive)."
      deposit_method: "How the deposit arrived."
      deposit_reference: "Reference of the deposit as shown on the business dashboard."
      entry_date: "Date received."
    account: balance
    direction: in
    triggers: []
  - type: business_fee_charged
    target: business_ledger
    meaning: "A fee is taken from the balance: subscription, proration, extra seats, payout, SWIFT payout, deposit, withdrawal, payout cancellation, return or early termination."
    grain: "One row per fee type per period, payout, deposit or sequence."
    distinguish_by: [fee_type, billing_period_start, payout_reference, deposit_reference, seq_in_period]
    fields:
      fee_type: "Kind of fee."
      amount_usd: "Fee taken (positive)."
      billing_period_start: "Billing period the fee belongs to."
      payout_reference: "Payout a payout, SWIFT, cancellation or return fee belongs to; empty otherwise."
      deposit_reference: "Deposit a deposit fee belongs to; empty otherwise."
      seq_in_period: "Sequence within the period for withdrawal fees and mid-period seat charges; 0 otherwise."
      entry_date: "Date taken."
    account: balance
    direction: out
    triggers: []
  - type: business_fee_refunded
    target: business_ledger
    meaning: "All or part of one fee is put back into the balance."
    grain: "One row per refunded fee charge."
    distinguish_by: [related_entry_id]
    fields:
      related_entry_id: "ledger_entry_id of the business_fee_charged row refunded."
      amount_usd: "Amount refunded (positive)."
      fee_refund_reason: "Why the fee is refunded."
      entry_date: "Date refunded."
    account: balance
    direction: in
    triggers: []
  - type: business_proration_credited
    target: business_ledger
    meaning: "The unused part of the current period's subscription fee is credited on an upgrade."
    grain: "One row per prorated subscription charge."
    distinguish_by: [related_entry_id]
    fields:
      related_entry_id: "ledger_entry_id of the subscription_fee charge prorated."
      amount_usd: "Credit (positive)."
      entry_date: "Date credited."
    account: balance
    direction: in
    triggers: []
  - type: business_payout_debited
    target: business_ledger
    meaning: "A payout's principal is taken from the balance when it is submitted."
    grain: "One row per payout."
    distinguish_by: [payout_reference]
    fields:
      payout_reference: "The payout debited."
      amount_usd: "Principal (positive)."
      entry_date: "Date debited."
    account: balance
    direction: out
    triggers: []
  - type: business_payout_credited_back
    target: business_ledger
    meaning: "A payout's money comes back into the balance after a cancellation or a return."
    grain: "One row per payout per reason."
    distinguish_by: [payout_reference, credit_back_reason]
    fields:
      payout_reference: "The payout concerned."
      amount_usd: "Amount credited back (positive)."
      credit_back_reason: "cancelled or returned."
      entry_date: "Date credited."
    account: balance
    direction: in
    triggers: []
  - type: business_balance_withdrawn
    target: business_ledger
    meaning: "The business withdraws balance to its own US bank account."
    grain: "One row per withdrawal."
    distinguish_by: [billing_period_start, seq_in_period]
    fields:
      amount_usd: "Amount withdrawn (positive)."
      billing_period_start: "Billing period of the withdrawal."
      seq_in_period: "1 for the first withdrawal in the period, 2 for the second, and so on."
      entry_date: "Date withdrawn."
    account: balance
    direction: out
    triggers: []
  - type: business_allowance_granted
    target: business_ledger
    meaning: "The plan's free payouts for a billing period are granted."
    grain: "One row per billing period."
    distinguish_by: [billing_period_start]
    fields:
      allowance_units: "Free payouts granted."
      billing_period_start: "Period granted for."
      entry_date: "Date granted."
    account: payout_allowance
    direction: in
    triggers: []
  - type: business_allowance_used
    target: business_ledger
    meaning: "A payout uses one free payout."
    grain: "One row per payout that used a free slot."
    distinguish_by: [payout_reference]
    fields:
      allowance_units: "1."
      payout_reference: "The payout that used it."
      entry_date: "Date used."
    account: payout_allowance
    direction: out
    triggers: []
  - type: business_allowance_expired
    target: business_ledger
    meaning: "Free payouts unused at the end of a billing period lapse."
    grain: "One row per billing period."
    distinguish_by: [billing_period_start]
    fields:
      allowance_units: "Free payouts that lapsed."
      billing_period_start: "Period that ended."
      entry_date: "Date lapsed."
    account: payout_allowance
    direction: out
    triggers: []
  - type: business_allowance_restored
    target: business_ledger
    meaning: "A free payout is given back because the payout that used it was cancelled before release in the same period."
    grain: "One row per restored payout."
    distinguish_by: [payout_reference]
    fields:
      allowance_units: "1."
      payout_reference: "The cancelled payout."
      entry_date: "Date restored."
    account: payout_allowance
    direction: in
    triggers: []
  # ---- payout writes (business_payouts) ----
  - type: business_payout_submitted
    target: business_payouts
    meaning: "A user of the business submits a payout, singly, in a batch file or through the API."
    grain: "One row per payout, identified by its payout reference."
    distinguish_by: [payout_reference]
    fields:
      payout_reference: "Payout reference shown on the business dashboard."
      batch_reference: "Batch the payout belongs to; empty for a single payout."
      submission_channel: "web, batch_file or api."
      payout_rail: "local or swift."
      corridor: "Destination corridor."
      beneficiary_name: "Beneficiary name, exactly as submitted."
      beneficiary_account_number: "Beneficiary account, exactly as submitted."
      invoice_reference: "The business's invoice number for the payment; empty when not required."
      send_amount_usd: "Principal (USD)."
      fx_rate: "Rate applied."
      receive_amount: "Amount the beneficiary receives in the payout currency."
      payout_fee_usd: "Fee charged for this payout; 0.00 when it used a free payout."
      used_free_allowance: "Whether the payout used a free payout."
      scheduled_release_date: "Release date requested (the submission date unless scheduled)."
      event_date: "Date submitted."
    triggers:
      - event: business:business_payout_debited
        map: {payout_reference: payout_reference, amount_usd: send_amount_usd}
      - event: business:business_allowance_used
        when: {used_free_allowance: true}
        map: {payout_reference: payout_reference, allowance_units: 1}
      - event: business:business_fee_charged
        when: {used_free_allowance: false, payout_rail: local, payout_fee_usd: {not: 0.0}}
        map: {fee_type: payout_fee, amount_usd: payout_fee_usd, payout_reference: payout_reference}
      - event: business:business_fee_charged
        when: {payout_rail: swift}
        map: {fee_type: swift_payout_fee, amount_usd: payout_fee_usd, payout_reference: payout_reference}
  - type: business_payout_approved
    target: business_payouts
    meaning: "A second user with the approver role approves a payout at or above the dual-approval threshold."
    grain: "One row per approval."
    distinguish_by: [payout_reference]
    fields:
      payout_reference: "The payout approved."
      approver_email: "Email of the approving user, as on the user list."
      event_date: "Date approved."
    triggers: []
  - type: business_payout_released
    target: business_payouts
    meaning: "A payout is released to the payout rail."
    grain: "One row per release."
    distinguish_by: [payout_reference]
    fields:
      payout_reference: "The payout released."
      event_date: "Date released."
    triggers: []
  - type: business_payout_paid
    target: business_payouts
    meaning: "The beneficiary bank confirms the payout."
    grain: "One row per paid payout."
    distinguish_by: [payout_reference]
    fields:
      payout_reference: "The payout paid."
      event_date: "Date paid."
    triggers: []
  - type: business_payout_cancelled
    target: business_payouts
    meaning: "A payout is cancelled before release."
    grain: "One row per cancellation."
    distinguish_by: [payout_reference]
    fields:
      payout_reference: "The payout cancelled."
      event_date: "Date cancelled."
    triggers:
      - event: business:business_payout_credited_back
        map: {payout_reference: payout_reference, credit_back_reason: cancelled}
  - type: business_payout_returned
    target: business_payouts
    meaning: "The beneficiary bank returns a payout."
    grain: "One row per returned payout."
    distinguish_by: [payout_reference]
    fields:
      payout_reference: "The payout returned."
      return_reason: "Beneficiary bank's return reason."
      returned_amount_usd: "USD recovered after conversion back."
      event_date: "Date returned."
    triggers:
      - event: business:business_payout_credited_back
        map: {payout_reference: payout_reference, amount_usd: returned_amount_usd, credit_back_reason: returned}
      - event: business:business_fee_charged
        map: {fee_type: return_fee, payout_reference: payout_reference}
  # ---- administrative writes (business_events) ----
  - type: business_user_added
    target: business_events
    meaning: "A user is added to the business account with a role."
    grain: "One row per user addition."
    distinguish_by: [user_email, event_date]
    fields:
      user_email: "Email of the user added, exactly as the owner gives it."
      user_role: "Role granted."
      event_date: "Date added."
    triggers: []
  - type: business_user_removed
    target: business_events
    meaning: "A user is removed from the business account."
    grain: "One row per user removal."
    distinguish_by: [user_email, event_date]
    fields:
      user_email: "Email of the user removed."
      event_date: "Date removed."
    triggers: []
  - type: business_kyb_document_received
    target: business_events
    meaning: "A KYB document the business uploaded is logged."
    grain: "One row per uploaded document."
    distinguish_by: [doc_reference]
    fields:
      doc_type: "Kind of KYB document."
      doc_reference: "Upload reference shown on the dashboard."
      event_date: "Date received."
    triggers: []
  - type: business_statement_requested
    target: business_events
    meaning: "The owner requests a statement of balance and payouts for a period."
    grain: "One row per statement request."
    distinguish_by: [statement_period_start, statement_period_end, event_date]
    fields:
      statement_period_start: "First day covered."
      statement_period_end: "Last day covered."
      event_date: "Date requested."
    triggers: []
  - type: business_callback_scheduled
    target: business_events
    meaning: "Support schedules a callback to the business owner."
    grain: "One row per scheduled callback."
    distinguish_by: [event_date]
    fields:
      callback_due_date: "Last business day for the callback."
      event_date: "Date requested."
    triggers: []

measures:
  - id: business_msr_period_volume
    window: "The current billing period: event_date from current_period_start through current_period_end."
    measure: "Sum of send_amount_usd over business_payout_submitted rows of this account in the period whose payout_reference has no business_payout_cancelled row."
  - id: business_msr_active_users
    window: "As at frozen_time."
    measure: "1 for the owner plus the number of user_email values whose latest row is business_user_added rather than business_user_removed."
  - id: business_msr_withdrawals_period
    window: "The current billing period."
    measure: "Count of business_balance_withdrawn rows with billing_period_start equal to current_period_start."
  - id: business_msr_batch_lines
    window: "One batch."
    measure: "Count of business_payout_submitted rows sharing one batch_reference."
  - id: business_msr_open_payouts
    window: "As at frozen_time."
    measure: "Count of payout_reference values with a business_payout_submitted row and no business_payout_paid, business_payout_cancelled or business_payout_returned row."

policies:
  - id: business_agg_multi_holding
    subject: [business_account_opened]
    rule: >-
      One owner may administer up to max_per_customer Paloma Business accounts, each for a different
      legal business. A business may hold only one Paloma Business account: an application is
      accepted only when no other Paloma Business account whose status is anything other than closed
      carries the same ein_last4 and legal_business_name. An application is never a second account for
      the same business to obtain a second allowance or volume limit; a business that wants more
      moves to a higher plan.
    eligibility:
      - id: one_account_per_business
        applies_to: [business_account_opened]
        kind: dedup
        condition: "an application is accepted only when no other Paloma Business account whose status is anything other than closed carries the same ein_last4 and legal_business_name"
        evidence_fields: [business_accounts.ein_last4, business_accounts.legal_business_name, business_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.ein_last4, business_accounts.legal_business_name]
          action_bindings:
            business_accounts.ein_last4: ein_last4
            business_accounts.legal_business_name: legal_business_name
        dedup_contract:
          table: business_accounts
          mode: separate_record
          object_bindings: {ein_last4: ein_last4, legal_business_name: legal_business_name}
          duplicate_filters: {status: [pending_kyb, active, past_due, suspended]}
          distinct_fields: []
    params:
      max_per_customer: 3

  - id: business_agg_entity_separation
    subject: [business_account_opened, business_payout_submitted, business_balance_withdrawn]
    rule: >-
      The accounts of one owner are never pooled. Each account's balance funds only that account's
      payouts and fees; volume limits, allowances and seats are counted per account; and money moves
      between two of the owner's accounts only as a withdrawal to a bank account and a fresh deposit.
      A payout or withdrawal is taken only from the balance of the account it is submitted on.
      Withdrawals go only to the business's own verified US bank account, never to the owner
      personally. A Paloma Business account and the owner's Personal Sender Account are separate
      contracts: business payouts never count toward personal sending limits, personal transfers never
      use the business balance or allowance, and Paloma Rewards points are never earned on business
      payouts.
    eligibility:
      - id: own_balance_only
        applies_to: [business_payout_submitted, business_balance_withdrawn]
        kind: authorization
        condition: "A payout or withdrawal is taken only from the balance of the account it is submitted on."
        evidence_fields: [business_accounts.business_account_id, business_accounts.balance_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id

  - id: business_evt_kyb_opening
    subject: [business_account_opened, business_kyb_document_received, business_kyb_approved, business_kyb_rejected]
    rule: >-
      An application is accepted only from an owner whose customer profile is a US resident aged at
      least 18, for a business registered in the United States. The business must have been operating
      at least the plan's entry_min_months_in_business months, counted from business_formation_date to
      the application date. Every document in the plan's kyb_documents_required must be received; a
      KYB document is logged only while the account is pending_kyb or active, and each upload
      reference is logged once. KYB review completes within kyb_review_business_days Paloma business
      days of the last required document. Approval starts the first billing period on the approval
      date, which fixes the billing day; when a later month has no such day, the period starts on that
      month's last day. A plan with minimum_commitment_months above 0 sets commitment_end_date to the
      approval date plus that many calendar months. An application with documents still missing
      application_expiry_days calendar days after opened_date is rejected and closed.
    eligibility:
      - id: plan_months_in_business
        applies_to: [business_account_opened]
        kind: authorization
        condition: "The business must have been operating at least the plan's entry_min_months_in_business months, counted from business_formation_date to the application date."
        evidence_fields: [business_accounts.business_account_id, business_accounts.business_formation_date]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
      - id: kyb_doc_status
        applies_to: [business_kyb_document_received]
        kind: state
        condition: "a KYB document is logged only while the account is pending_kyb or active"
        evidence_fields: [business_accounts.business_account_id, business_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        state_contract:
          field: business_accounts.status
          allowed: [pending_kyb, active]
      - id: kyb_doc_once
        applies_to: [business_kyb_document_received]
        kind: dedup
        condition: "each upload reference is logged once"
        evidence_fields: [business_events.doc_reference, business_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_events.doc_reference]
          action_bindings:
            business_events.doc_reference: doc_reference
        dedup_contract:
          table: business_events
          mode: separate_record
          object_bindings: {doc_reference: doc_reference}
          duplicate_filters: {event_type: [business_kyb_document_received]}
          distinct_fields: []
    params:
      owner_min_age_years: 18
      application_expiry_days: 30
      per_tier:
        Paloma Business Starter: {entry_min_months_in_business: "=entry_min_months_in_business", kyb_documents_required: "=kyb_documents_required", kyb_review_business_days: "=kyb_review_business_days", minimum_commitment_months: "=minimum_commitment_months"}
        Paloma Business Essentials: {entry_min_months_in_business: "=entry_min_months_in_business", kyb_documents_required: "=kyb_documents_required", kyb_review_business_days: "=kyb_review_business_days", minimum_commitment_months: "=minimum_commitment_months"}
        Paloma Business Growth: {entry_min_months_in_business: "=entry_min_months_in_business", kyb_documents_required: "=kyb_documents_required", kyb_review_business_days: "=kyb_review_business_days", minimum_commitment_months: "=minimum_commitment_months"}
        Paloma Business Pro: {entry_min_months_in_business: "=entry_min_months_in_business", kyb_documents_required: "=kyb_documents_required", kyb_review_business_days: "=kyb_review_business_days", minimum_commitment_months: "=minimum_commitment_months"}
        Paloma Business Scale: {entry_min_months_in_business: "=entry_min_months_in_business", kyb_documents_required: "=kyb_documents_required", kyb_review_business_days: "=kyb_review_business_days", minimum_commitment_months: "=minimum_commitment_months"}
        Paloma Business Enterprise: {entry_min_months_in_business: "=entry_min_months_in_business", kyb_documents_required: "=kyb_documents_required", kyb_review_business_days: "=kyb_review_business_days", minimum_commitment_months: "=minimum_commitment_months"}

  - id: business_evt_subscription_billing
    subject: [business_period_rolled, business_fee_charged, business_marked_past_due, business_reinstated, business_suspended]
    rule: >-
      Each billing period runs from the billing day to the day before the next billing day. At the
      start of every period the subscription is charged from the balance as subscription_fee: the
      plan's monthly_fee_usd on monthly billing, or annual_fee_usd at the start of every twelfth
      period on annual billing (annual_billing_available must be true). Each user beyond
      included_seats, counted by business_msr_active_users at the period start, is charged
      extra_seat_fee_usd as extra_seat_fee for the period. When the balance cannot cover a charge
      in full, nothing is taken, the charge stays owed, and the account becomes past_due with
      past_due_since the date the charge fell due. While past_due, payouts may be submitted only
      during the grace period of business_evt_payout_limits. A past_due account is suspended only
      once suspension_after_past_due_days calendar days have passed since it became past due. The
      days are counted in calendar days from past_due_since, and suspension takes effect on
      past_due_since plus suspension_after_past_due_days. When the owner has deposited enough, the
      agent collects every overdue charge from the balance and the account returns to active; a
      nonpayment suspension ends the same way, while a compliance_review suspension ends only by
      compliance. Fees are never charged twice for one period.
    eligibility:
      - id: suspension_point
        applies_to: [business_suspended]
        kind: time
        condition: "A past_due account is suspended only once suspension_after_past_due_days calendar days have passed since it became past due."
        evidence_fields: [business_accounts.business_account_id, business_accounts.past_due_since]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "it became past due"
          anchor_source: business_accounts.past_due_since
          relation: not_before
          duration_source: variants.suspension_after_past_due_days
          unit: calendar_days
          counting_rule: "The days are counted in calendar days from past_due_since, and suspension takes effect on past_due_since plus suspension_after_past_due_days."
          boundary: inclusive
      - id: charge_once_per_period
        applies_to: [business_fee_charged]
        kind: dedup
        condition: "Fees are never charged twice for one period."
        evidence_fields: [business_ledger.business_account_id, business_ledger.fee_type, business_ledger.billing_period_start]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_ledger.business_account_id]
          action_bindings:
            business_ledger.business_account_id: business_account_id
        dedup_contract:
          table: business_ledger
          mode: separate_record
          object_bindings: {business_account_id: business_account_id, fee_type: fee_type, billing_period_start: billing_period_start}
          duplicate_filters: {event_type: [business_fee_charged]}
          distinct_fields: [payout_reference, deposit_reference, seq_in_period]
    params:
      per_tier:
