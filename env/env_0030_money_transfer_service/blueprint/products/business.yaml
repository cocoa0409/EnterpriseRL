  - id: business_evt_plan_change
    subject: [business_plan_upgraded, business_downgrade_scheduled, business_downgrade_applied, business_proration_credited, business_fee_charged]
    rule: >-
      A plan change is the owner's own decision; the agent explains its effect and the owner confirms
      it. A plan can be changed only while the account status is active. An upgrade takes effect on
      the day it is made, and the business must meet the higher plan's entry_min_months_in_business
      and have every document in its kyb_documents_required logged. On an upgrade from a plan whose
      upgrade_proration_enabled is true and whose subscription_fee for the current period was
      collected, the unused part of that fee is credited back as unused days over period days times
      the fee, rounded half up to the cent, where unused days run from the upgrade date to
      current_period_end inclusive; the higher plan's fee for the same unused days is charged at once
      as proration_charge, calculated the same way. A downgrade never takes effect mid-period: it is
      scheduled for the first day of the next billing period and applied then. A downgrade can be
      scheduled only when business_msr_active_users does not exceed the lower plan's max_seats and the
      lower plan offers every submission channel the business has scheduled payouts on. A downgrade
      or closure taking effect before commitment_end_date carries an early_termination_fee of
      early_termination_fee_months times the committed plan's monthly_fee_usd. Allowance, limits,
      fees and seats of the new plan apply to payouts submitted after the change; the free payouts
      already granted for the period are not changed.
    eligibility:
      - id: account_active
        applies_to: [business_plan_upgraded, business_downgrade_scheduled]
        kind: state
        condition: "A plan can be changed only while the account status is active."
        evidence_fields: [business_accounts.business_account_id, business_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        state_contract:
          field: business_accounts.status
          allowed: [active]
      - id: seats_fit_lower_plan
        applies_to: [business_downgrade_scheduled]
        kind: authorization
        condition: "A downgrade can be scheduled only when business_msr_active_users does not exceed the lower plan's max_seats and the lower plan offers every submission channel the business has scheduled payouts on."
        evidence_fields: [business_events.business_account_id, business_events.event_type, business_events.user_email]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_events.business_account_id]
          action_bindings:
            business_events.business_account_id: business_account_id
    params:
      per_tier:
        Paloma Business Starter: {upgrade_proration_enabled: "=upgrade_proration_enabled", monthly_fee_usd: "=monthly_fee_usd", annual_fee_usd: "=annual_fee_usd", max_seats: "=max_seats", entry_min_months_in_business: "=entry_min_months_in_business", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Essentials: {upgrade_proration_enabled: "=upgrade_proration_enabled", monthly_fee_usd: "=monthly_fee_usd", annual_fee_usd: "=annual_fee_usd", max_seats: "=max_seats", entry_min_months_in_business: "=entry_min_months_in_business", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Growth: {upgrade_proration_enabled: "=upgrade_proration_enabled", monthly_fee_usd: "=monthly_fee_usd", annual_fee_usd: "=annual_fee_usd", max_seats: "=max_seats", entry_min_months_in_business: "=entry_min_months_in_business", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Pro: {upgrade_proration_enabled: "=upgrade_proration_enabled", monthly_fee_usd: "=monthly_fee_usd", annual_fee_usd: "=annual_fee_usd", max_seats: "=max_seats", entry_min_months_in_business: "=entry_min_months_in_business", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Scale: {upgrade_proration_enabled: "=upgrade_proration_enabled", monthly_fee_usd: "=monthly_fee_usd", annual_fee_usd: "=annual_fee_usd", max_seats: "=max_seats", entry_min_months_in_business: "=entry_min_months_in_business", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Enterprise: {upgrade_proration_enabled: "=upgrade_proration_enabled", monthly_fee_usd: "=monthly_fee_usd", annual_fee_usd: "=annual_fee_usd", max_seats: "=max_seats", entry_min_months_in_business: "=entry_min_months_in_business", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
    measures: [business_msr_active_users]

  - id: business_evt_allowance
    subject: [business_allowance_granted, business_allowance_used, business_allowance_expired, business_allowance_restored]
    rule: >-
      At the start of every billing period the plan's free_payouts_per_period are granted. A local-rail
      payout uses one free payout whenever free_payouts_remaining is above 0 at its submission, in
      submission order, and then carries no payout fee; SWIFT payouts never use the allowance. Because
      allowance_rollover is false on every plan, free payouts still unused at the end of the period
      lapse when the next period starts. A free payout is restored only when the payout that used it
      is cancelled before release within the same billing period; a payout cancelled in a later
      period, or returned after release, does not restore it. The allowance of a plan change applies
      from the next period's grant.
    eligibility:
      - id: restore_same_period
        applies_to: [business_allowance_restored]
        kind: authorization
        condition: "A free payout is restored only when the payout that used it is cancelled before release within the same billing period"
        evidence_fields: [business_ledger.payout_reference, business_ledger.event_type, business_ledger.entry_date, business_accounts.current_period_start]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_ledger.payout_reference]
          action_bindings:
            business_ledger.payout_reference: payout_reference
    params:
      per_tier:
        Paloma Business Starter: {free_payouts_per_period: "=free_payouts_per_period", allowance_rollover: "=allowance_rollover"}
        Paloma Business Essentials: {free_payouts_per_period: "=free_payouts_per_period", allowance_rollover: "=allowance_rollover"}
        Paloma Business Growth: {free_payouts_per_period: "=free_payouts_per_period", allowance_rollover: "=allowance_rollover"}
        Paloma Business Pro: {free_payouts_per_period: "=free_payouts_per_period", allowance_rollover: "=allowance_rollover"}
        Paloma Business Scale: {free_payouts_per_period: "=free_payouts_per_period", allowance_rollover: "=allowance_rollover"}
        Paloma Business Enterprise: {free_payouts_per_period: "=free_payouts_per_period", allowance_rollover: "=allowance_rollover"}

  - id: business_evt_payout_pricing
    subject: [business_payout_submitted, business_payout_debited, business_fee_charged]
    rule: >-
      A local-rail payout that uses a free payout carries no fee. Any other local-rail payout carries
      payout_fee_usd, less api_payout_fee_discount_usd when submitted through the API (never below
      0.00). A SWIFT payout carries swift_payout_fee_usd. The margin is fx_margin_pct, less
      margin_reduction_pct_points when the principal is at or above margin_reduction_threshold_usd;
      fx_rate is the corridor's mid_market_rate in the Paloma rate sheet for the submission date times
      one minus the margin over 100, rounded half up to 4 decimals, and receive_amount is the
      principal times fx_rate rounded half up to 2 decimals (whole units for VND). The principal and
      the fee are taken from the balance at submission. A payout released at or before
      payout_release_cutoff_ct on a Paloma business day is released that day, otherwise on the next
      business day, and is expected payout_delivery_business_days Paloma business days later.
    eligibility: []
    params:
      per_tier:
        Paloma Business Starter: {payout_fee_usd: "=payout_fee_usd", api_payout_fee_discount_usd: "=api_payout_fee_discount_usd", swift_payout_fee_usd: "=swift_payout_fee_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", payout_release_cutoff_ct: "=payout_release_cutoff_ct", payout_delivery_business_days: "=payout_delivery_business_days"}
        Paloma Business Essentials: {payout_fee_usd: "=payout_fee_usd", api_payout_fee_discount_usd: "=api_payout_fee_discount_usd", swift_payout_fee_usd: "=swift_payout_fee_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", payout_release_cutoff_ct: "=payout_release_cutoff_ct", payout_delivery_business_days: "=payout_delivery_business_days"}
        Paloma Business Growth: {payout_fee_usd: "=payout_fee_usd", api_payout_fee_discount_usd: "=api_payout_fee_discount_usd", swift_payout_fee_usd: "=swift_payout_fee_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", payout_release_cutoff_ct: "=payout_release_cutoff_ct", payout_delivery_business_days: "=payout_delivery_business_days"}
        Paloma Business Pro: {payout_fee_usd: "=payout_fee_usd", api_payout_fee_discount_usd: "=api_payout_fee_discount_usd", swift_payout_fee_usd: "=swift_payout_fee_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", payout_release_cutoff_ct: "=payout_release_cutoff_ct", payout_delivery_business_days: "=payout_delivery_business_days"}
        Paloma Business Scale: {payout_fee_usd: "=payout_fee_usd", api_payout_fee_discount_usd: "=api_payout_fee_discount_usd", swift_payout_fee_usd: "=swift_payout_fee_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", payout_release_cutoff_ct: "=payout_release_cutoff_ct", payout_delivery_business_days: "=payout_delivery_business_days"}
        Paloma Business Enterprise: {payout_fee_usd: "=payout_fee_usd", api_payout_fee_discount_usd: "=api_payout_fee_discount_usd", swift_payout_fee_usd: "=swift_payout_fee_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", payout_release_cutoff_ct: "=payout_release_cutoff_ct", payout_delivery_business_days: "=payout_delivery_business_days"}
    formula:
      effective_margin_pct: "fx_margin_pct - margin_reduction_pct_points if send_amount_usd >= margin_reduction_threshold_usd else fx_margin_pct"
      receive_amount: "round(send_amount_usd * fx_rate, 2)"

  - id: business_evt_payout_limits
    subject: [business_payout_submitted, business_payout_approved, business_payout_released]
    rule: >-
      Payouts may be submitted only while the account is active or past_due. A past_due account may
      submit payouts only within past_due_grace_days calendar days after it became past due. The grace
      is counted in calendar days from past_due_since, and a payout on past_due_since plus the grace
      days is still accepted. The principal must lie between min_payout_usd and per_payout_limit_usd,
      both inclusive, and business_msr_period_volume plus the principal may not exceed
      monthly_volume_limit_usd. A local-rail payout must go to a corridor in corridors_served; a SWIFT
      payout needs swift_payouts_enabled. The submission channel must be in
      payout_submission_channels; a batch needs batch_payouts_enabled and at most max_batch_lines lines
      (business_msr_batch_lines); a future release date needs scheduled_payouts_enabled. A payout above
      invoice_required_above_usd must carry the business's invoice reference. The available balance
      (balance_usd less ACH deposits still within ach_deposit_hold_business_days) must cover the
      principal plus the fee; a payout it cannot cover is not submitted. A payout at or above a
      non-zero dual_approval_threshold_usd is released only after a different active user with the
      approver role approves it. Business payouts are never limited by personal sending limits.
    eligibility:
      - id: account_can_pay
        applies_to: [business_payout_submitted]
        kind: state
        condition: "Payouts may be submitted only while the account is active or past_due."
        evidence_fields: [business_accounts.business_account_id, business_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        state_contract:
          field: business_accounts.status
          allowed: [active, past_due]
      - id: past_due_grace
        applies_to: [business_payout_submitted]
        kind: time
        condition: "A past_due account may submit payouts only within past_due_grace_days calendar days after it became past due."
        evidence_fields: [business_accounts.business_account_id, business_accounts.past_due_since]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "it became past due"
          anchor_source: business_accounts.past_due_since
          relation: not_after
          duration_source: variants.past_due_grace_days
          unit: calendar_days
          counting_rule: "The grace is counted in calendar days from past_due_since, and a payout on past_due_since plus the grace days is still accepted."
          boundary: inclusive
      - id: dual_approval
        applies_to: [business_payout_released]
        kind: authorization
        condition: "A payout at or above a non-zero dual_approval_threshold_usd is released only after a different active user with the approver role approves it."
        evidence_fields: [business_payouts.payout_reference, business_payouts.event_type, business_payouts.approver_email]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_payouts.payout_reference]
          action_bindings:
            business_payouts.payout_reference: payout_reference
    params:
      per_tier:
        Paloma Business Starter: {min_payout_usd: "=min_payout_usd", per_payout_limit_usd: "=per_payout_limit_usd", monthly_volume_limit_usd: "=monthly_volume_limit_usd", corridors_served: "=corridors_served", swift_payouts_enabled: "=swift_payouts_enabled", payout_submission_channels: "=payout_submission_channels", batch_payouts_enabled: "=batch_payouts_enabled", max_batch_lines: "=max_batch_lines", scheduled_payouts_enabled: "=scheduled_payouts_enabled", invoice_required_above_usd: "=invoice_required_above_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", dual_approval_threshold_usd: "=dual_approval_threshold_usd", api_access: "=api_access", past_due_grace_days: "=past_due_grace_days"}
        Paloma Business Essentials: {min_payout_usd: "=min_payout_usd", per_payout_limit_usd: "=per_payout_limit_usd", monthly_volume_limit_usd: "=monthly_volume_limit_usd", corridors_served: "=corridors_served", swift_payouts_enabled: "=swift_payouts_enabled", payout_submission_channels: "=payout_submission_channels", batch_payouts_enabled: "=batch_payouts_enabled", max_batch_lines: "=max_batch_lines", scheduled_payouts_enabled: "=scheduled_payouts_enabled", invoice_required_above_usd: "=invoice_required_above_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", dual_approval_threshold_usd: "=dual_approval_threshold_usd", api_access: "=api_access", past_due_grace_days: "=past_due_grace_days"}
        Paloma Business Growth: {min_payout_usd: "=min_payout_usd", per_payout_limit_usd: "=per_payout_limit_usd", monthly_volume_limit_usd: "=monthly_volume_limit_usd", corridors_served: "=corridors_served", swift_payouts_enabled: "=swift_payouts_enabled", payout_submission_channels: "=payout_submission_channels", batch_payouts_enabled: "=batch_payouts_enabled", max_batch_lines: "=max_batch_lines", scheduled_payouts_enabled: "=scheduled_payouts_enabled", invoice_required_above_usd: "=invoice_required_above_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", dual_approval_threshold_usd: "=dual_approval_threshold_usd", api_access: "=api_access", past_due_grace_days: "=past_due_grace_days"}
        Paloma Business Pro: {min_payout_usd: "=min_payout_usd", per_payout_limit_usd: "=per_payout_limit_usd", monthly_volume_limit_usd: "=monthly_volume_limit_usd", corridors_served: "=corridors_served", swift_payouts_enabled: "=swift_payouts_enabled", payout_submission_channels: "=payout_submission_channels", batch_payouts_enabled: "=batch_payouts_enabled", max_batch_lines: "=max_batch_lines", scheduled_payouts_enabled: "=scheduled_payouts_enabled", invoice_required_above_usd: "=invoice_required_above_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", dual_approval_threshold_usd: "=dual_approval_threshold_usd", api_access: "=api_access", past_due_grace_days: "=past_due_grace_days"}
        Paloma Business Scale: {min_payout_usd: "=min_payout_usd", per_payout_limit_usd: "=per_payout_limit_usd", monthly_volume_limit_usd: "=monthly_volume_limit_usd", corridors_served: "=corridors_served", swift_payouts_enabled: "=swift_payouts_enabled", payout_submission_channels: "=payout_submission_channels", batch_payouts_enabled: "=batch_payouts_enabled", max_batch_lines: "=max_batch_lines", scheduled_payouts_enabled: "=scheduled_payouts_enabled", invoice_required_above_usd: "=invoice_required_above_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", dual_approval_threshold_usd: "=dual_approval_threshold_usd", api_access: "=api_access", past_due_grace_days: "=past_due_grace_days"}
        Paloma Business Enterprise: {min_payout_usd: "=min_payout_usd", per_payout_limit_usd: "=per_payout_limit_usd", monthly_volume_limit_usd: "=monthly_volume_limit_usd", corridors_served: "=corridors_served", swift_payouts_enabled: "=swift_payouts_enabled", payout_submission_channels: "=payout_submission_channels", batch_payouts_enabled: "=batch_payouts_enabled", max_batch_lines: "=max_batch_lines", scheduled_payouts_enabled: "=scheduled_payouts_enabled", invoice_required_above_usd: "=invoice_required_above_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", dual_approval_threshold_usd: "=dual_approval_threshold_usd", api_access: "=api_access", past_due_grace_days: "=past_due_grace_days"}
    measures: [business_msr_period_volume, business_msr_batch_lines]

  - id: business_evt_payout_cancel_return
    subject: [business_payout_cancelled, business_payout_returned, business_payout_paid, business_payout_credited_back, business_fee_refunded, business_fee_charged]
    rule: >-
      A payout can be cancelled only before it is released: it has a business_payout_submitted row
      and no business_payout_released, business_payout_paid or business_payout_returned row. A payout
      is cancelled only once. On cancellation the principal is credited back to the balance, the
      payout or SWIFT fee is refunded with fee_refund_reason payout_cancelled, the free payout is
      restored under business_evt_allowance, and payout_cancel_fee_usd is charged as
      payout_cancel_fee when above 0.00. A released payout cannot be cancelled; a recall on a
      business payout is not offered. When a beneficiary bank returns a payout, the returned
      payout-currency amount is converted back at the corridor's mid_market_rate for the return date
      and credited to the balance as returned_amount_usd, the business bears any exchange
      difference, the payout fee is not refunded, and return_fee_usd is charged as return_fee. The
      business re-submits a corrected payout as a new payout with a new reference. Business payouts
      carry no Remittance Transfer Rule cancellation right or error-resolution remedy.
    eligibility:
      - id: not_yet_released
        applies_to: [business_payout_cancelled]
        kind: authorization
        condition: "A payout can be cancelled only before it is released: it has a business_payout_submitted row and no business_payout_released, business_payout_paid or business_payout_returned row."
        evidence_fields: [business_payouts.payout_reference, business_payouts.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_payouts.payout_reference]
          action_bindings:
            business_payouts.payout_reference: payout_reference
      - id: cancel_once
        applies_to: [business_payout_cancelled]
        kind: dedup
        condition: "A payout is cancelled only once."
        evidence_fields: [business_payouts.payout_reference, business_payouts.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_payouts.payout_reference]
          action_bindings:
            business_payouts.payout_reference: payout_reference
        dedup_contract:
          table: business_payouts
          mode: separate_record
          object_bindings: {payout_reference: payout_reference}
          duplicate_filters: {event_type: [business_payout_cancelled]}
          distinct_fields: []
    params:
      per_tier:
        Paloma Business Starter: {payout_cancel_fee_usd: "=payout_cancel_fee_usd", return_fee_usd: "=return_fee_usd"}
        Paloma Business Essentials: {payout_cancel_fee_usd: "=payout_cancel_fee_usd", return_fee_usd: "=return_fee_usd"}
        Paloma Business Growth: {payout_cancel_fee_usd: "=payout_cancel_fee_usd", return_fee_usd: "=return_fee_usd"}
        Paloma Business Pro: {payout_cancel_fee_usd: "=payout_cancel_fee_usd", return_fee_usd: "=return_fee_usd"}
        Paloma Business Scale: {payout_cancel_fee_usd: "=payout_cancel_fee_usd", return_fee_usd: "=return_fee_usd"}
        Paloma Business Enterprise: {payout_cancel_fee_usd: "=payout_cancel_fee_usd", return_fee_usd: "=return_fee_usd"}

  - id: business_evt_seats
    subject: [business_user_added, business_user_removed, business_fee_charged]
    rule: >-
      The owner adds and removes users; each user has one role (admin, approver, preparer or viewer)
      and the owner counts as one active user. A user can be added only while the account is active
      or past_due. A user may be added only when business_msr_active_users stays at or below
      max_seats including the new user. A user added during a period whose active users then exceed
      included_seats is charged extra_seat_fee_usd for that period at once, as extra_seat_fee with
      seq_in_period numbering such mid-period charges from 1; the fee is not prorated and not
      refunded when the user is removed. A user who is already active is not added again. Removing a
      user takes effect at once, and the owner can never be removed.
    eligibility:
      - id: account_open_for_users
        applies_to: [business_user_added]
        kind: state
        condition: "A user can be added only while the account is active or past_due."
        evidence_fields: [business_accounts.business_account_id, business_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        state_contract:
          field: business_accounts.status
          allowed: [active, past_due]
      - id: seat_cap
        applies_to: [business_user_added]
        kind: authorization
        condition: "A user may be added only when business_msr_active_users stays at or below max_seats including the new user."
        evidence_fields: [business_events.business_account_id, business_events.event_type, business_events.user_email]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_events.business_account_id]
          action_bindings:
            business_events.business_account_id: business_account_id
    params:
      per_tier:
        Paloma Business Starter: {included_seats: "=included_seats", max_seats: "=max_seats", extra_seat_fee_usd: "=extra_seat_fee_usd"}
        Paloma Business Essentials: {included_seats: "=included_seats", max_seats: "=max_seats", extra_seat_fee_usd: "=extra_seat_fee_usd"}
        Paloma Business Growth: {included_seats: "=included_seats", max_seats: "=max_seats", extra_seat_fee_usd: "=extra_seat_fee_usd"}
        Paloma Business Pro: {included_seats: "=included_seats", max_seats: "=max_seats", extra_seat_fee_usd: "=extra_seat_fee_usd"}
        Paloma Business Scale: {included_seats: "=included_seats", max_seats: "=max_seats", extra_seat_fee_usd: "=extra_seat_fee_usd"}
        Paloma Business Enterprise: {included_seats: "=included_seats", max_seats: "=max_seats", extra_seat_fee_usd: "=extra_seat_fee_usd"}
    measures: [business_msr_active_users]

  - id: business_evt_balance
    subject: [business_balance_deposited, business_balance_withdrawn, business_fee_charged]
    rule: >-
      The balance can receive deposits only by the plan's deposit_methods. A deposit is credited only
      while the account is active, past_due or suspended. A debit-card deposit carries
      card_deposit_fee_pct of the deposit, rounded half up to the cent, and a wire deposit carries
      wire_deposit_fee_usd, each as deposit_fee tied to the deposit_reference. An ACH deposit funds
      payouts only after ach_deposit_hold_business_days Paloma business days. A deposit that would take
      balance_usd above max_balance_usd is returned to its sender and not credited. A withdrawal is
      possible only while the account is active, past_due or suspended for nonpayment, and goes only
      to the business's verified US bank account; it may not exceed the available balance less
      charges still owed. The first free_withdrawals_per_period withdrawals of a billing period
      (business_msr_withdrawals_period) are free and each later one carries withdrawal_fee_usd as
      withdrawal_fee with the same seq_in_period. The balance never goes below 0.00.
    eligibility:
      - id: deposit_status
        applies_to: [business_balance_deposited]
        kind: state
        condition: "A deposit is credited only while the account is active, past_due or suspended."
        evidence_fields: [business_accounts.business_account_id, business_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        state_contract:
          field: business_accounts.status
          allowed: [active, past_due, suspended]
      - id: withdrawal_status
        applies_to: [business_balance_withdrawn]
        kind: state
        condition: "A withdrawal is possible only while the account is active, past_due or suspended for nonpayment"
        evidence_fields: [business_accounts.business_account_id, business_accounts.status, business_accounts.suspension_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        state_contract:
          field: business_accounts.status
          allowed: [active, past_due, suspended]
    params:
      per_tier:
        Paloma Business Starter: {deposit_methods: "=deposit_methods", card_deposit_fee_pct: "=card_deposit_fee_pct", wire_deposit_fee_usd: "=wire_deposit_fee_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", max_balance_usd: "=max_balance_usd", withdrawal_fee_usd: "=withdrawal_fee_usd", free_withdrawals_per_period: "=free_withdrawals_per_period"}
        Paloma Business Essentials: {deposit_methods: "=deposit_methods", card_deposit_fee_pct: "=card_deposit_fee_pct", wire_deposit_fee_usd: "=wire_deposit_fee_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", max_balance_usd: "=max_balance_usd", withdrawal_fee_usd: "=withdrawal_fee_usd", free_withdrawals_per_period: "=free_withdrawals_per_period"}
        Paloma Business Growth: {deposit_methods: "=deposit_methods", card_deposit_fee_pct: "=card_deposit_fee_pct", wire_deposit_fee_usd: "=wire_deposit_fee_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", max_balance_usd: "=max_balance_usd", withdrawal_fee_usd: "=withdrawal_fee_usd", free_withdrawals_per_period: "=free_withdrawals_per_period"}
        Paloma Business Pro: {deposit_methods: "=deposit_methods", card_deposit_fee_pct: "=card_deposit_fee_pct", wire_deposit_fee_usd: "=wire_deposit_fee_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", max_balance_usd: "=max_balance_usd", withdrawal_fee_usd: "=withdrawal_fee_usd", free_withdrawals_per_period: "=free_withdrawals_per_period"}
        Paloma Business Scale: {deposit_methods: "=deposit_methods", card_deposit_fee_pct: "=card_deposit_fee_pct", wire_deposit_fee_usd: "=wire_deposit_fee_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", max_balance_usd: "=max_balance_usd", withdrawal_fee_usd: "=withdrawal_fee_usd", free_withdrawals_per_period: "=free_withdrawals_per_period"}
        Paloma Business Enterprise: {deposit_methods: "=deposit_methods", card_deposit_fee_pct: "=card_deposit_fee_pct", wire_deposit_fee_usd: "=wire_deposit_fee_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", max_balance_usd: "=max_balance_usd", withdrawal_fee_usd: "=withdrawal_fee_usd", free_withdrawals_per_period: "=free_withdrawals_per_period"}
    measures: [business_msr_withdrawals_period]
    formula:
      card_deposit_fee: "round(amount_usd * card_deposit_fee_pct / 100, 2)"

  - id: business_evt_closure
    subject: [business_closed_by_owner, business_terminated, business_fee_refunded, business_fee_charged]
    rule: >-
      Only the owner can close the account, and only from status active; a past_due account first pays
      what it owes and a suspended account cannot be closed by the owner. Closure is allowed only when
      balance_usd is 0.00 and business_msr_open_payouts is 0: the owner withdraws the balance and
      every payout is paid, cancelled or returned first. Closing before commitment_end_date carries
      the early_termination_fee of business_evt_plan_change. When the owner closes the account within
      subscription_refund_window_days calendar days after the first subscription_fee was charged and
      no payout was submitted after that charge, that subscription_fee is refunded with
      fee_refund_reason subscription_refund_window; no other subscription fee is ever refunded on
      closure. The refund window is counted in calendar days from the entry_date of the first
      subscription_fee charge, and a closure on the last day of the window is inside it. Paloma terminates a suspended account only by its own decision. Records are kept for
      record_retention_years years after closure.
    eligibility:
      - id: nothing_left_open
        applies_to: [business_closed_by_owner]
        kind: authorization
        condition: "Closure is allowed only when balance_usd is 0.00 and business_msr_open_payouts is 0"
        evidence_fields: [business_accounts.business_account_id, business_accounts.balance_usd, business_payouts.business_account_id, business_payouts.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id, business_payouts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
            business_payouts.business_account_id: business_account_id
      - id: refund_window
        applies_to: [business_fee_refunded]
        kind: time
        condition: "When the owner closes the account within subscription_refund_window_days calendar days after the first subscription_fee was charged and no payout was submitted after that charge, that subscription_fee is refunded with fee_refund_reason subscription_refund_window"
        evidence_fields: [business_ledger.business_account_id, business_ledger.fee_type, business_ledger.entry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_ledger.business_account_id]
          action_bindings:
            business_ledger.business_account_id: business_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the first subscription_fee was charged"
          anchor_source: business_ledger.entry_date
          relation: not_after
          duration_source: variants.subscription_refund_window_days
          unit: calendar_days
          counting_rule: "The refund window is counted in calendar days from the entry_date of the first subscription_fee charge, and a closure on the last day of the window is inside it."
          boundary: inclusive
    params:
      record_retention_years: 5
      per_tier:
        Paloma Business Starter: {subscription_refund_window_days: "=subscription_refund_window_days", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Essentials: {subscription_refund_window_days: "=subscription_refund_window_days", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Growth: {subscription_refund_window_days: "=subscription_refund_window_days", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Pro: {subscription_refund_window_days: "=subscription_refund_window_days", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Scale: {subscription_refund_window_days: "=subscription_refund_window_days", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Enterprise: {subscription_refund_window_days: "=subscription_refund_window_days", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
    measures: [business_msr_open_payouts]

  - id: business_evt_service
    subject: [business_statement_requested, business_callback_scheduled]
    rule: >-
      The owner may request a statement of balance movements and payouts for any period whose
      statement_period_start is no earlier than the request date minus statement_history_months
      calendar months (same day of month, falling back to the month's last day) and whose
      statement_period_end is no later than the request date; statements are free and emailed to the
      owner's address on file, including for a closed account within record retention. A callback
      may be scheduled for any account not closed; its callback_due_date is the request date plus
      support_callback_business_days Paloma business days, and a plan whose
      dedicated_account_manager is true is called back by the named account manager.
    eligibility:
      - id: callback_account_open
        applies_to: [business_callback_scheduled]
        kind: state
        condition: "A callback may be scheduled for any account not closed"
        evidence_fields: [business_accounts.business_account_id, business_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        state_contract:
          field: business_accounts.status
          allowed: [pending_kyb, active, past_due, suspended]
    params:
      per_tier:
        Paloma Business Starter: {statement_history_months: "=statement_history_months", support_callback_business_days: "=support_callback_business_days", dedicated_account_manager: "=dedicated_account_manager"}
        Paloma Business Essentials: {statement_history_months: "=statement_history_months", support_callback_business_days: "=support_callback_business_days", dedicated_account_manager: "=dedicated_account_manager"}
        Paloma Business Growth: {statement_history_months: "=statement_history_months", support_callback_business_days: "=support_callback_business_days", dedicated_account_manager: "=dedicated_account_manager"}
        Paloma Business Pro: {statement_history_months: "=statement_history_months", support_callback_business_days: "=support_callback_business_days", dedicated_account_manager: "=dedicated_account_manager"}
        Paloma Business Scale: {statement_history_months: "=statement_history_months", support_callback_business_days: "=support_callback_business_days", dedicated_account_manager: "=dedicated_account_manager"}
        Paloma Business Enterprise: {statement_history_months: "=statement_history_months", support_callback_business_days: "=support_callback_business_days", dedicated_account_manager: "=dedicated_account_manager"}
