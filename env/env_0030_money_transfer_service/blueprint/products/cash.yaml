        Cash Pickup Express Plus: {fee_ladder: "=fee_ladder", pay_by_bank_fee_discount_usd: "=pay_by_bank_fee_discount_usd", first_transfer_fee_waived: "=first_transfer_fee_waived", first_transfer_promo_cap_usd: "=first_transfer_promo_cap_usd", first_transfer_promo_margin_pct: "=first_transfer_promo_margin_pct", credit_card_fee_pct: "=credit_card_fee_pct", debit_card_fee_usd: "=debit_card_fee_usd", usd_payout_fee_usd: "=usd_payout_fee_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", booking_cutoff_ct: "=booking_cutoff_ct", advance_notice_business_days: "=advance_notice_business_days", availability_business_days: "=availability_business_days", weekend_payout: "=weekend_payout"}
        Cash Pickup Bank Branch: {fee_ladder: "=fee_ladder", pay_by_bank_fee_discount_usd: "=pay_by_bank_fee_discount_usd", first_transfer_fee_waived: "=first_transfer_fee_waived", first_transfer_promo_cap_usd: "=first_transfer_promo_cap_usd", first_transfer_promo_margin_pct: "=first_transfer_promo_margin_pct", credit_card_fee_pct: "=credit_card_fee_pct", debit_card_fee_usd: "=debit_card_fee_usd", usd_payout_fee_usd: "=usd_payout_fee_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", booking_cutoff_ct: "=booking_cutoff_ct", advance_notice_business_days: "=advance_notice_business_days", availability_business_days: "=availability_business_days", weekend_payout: "=weekend_payout"}
