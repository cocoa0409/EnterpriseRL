      hold_review_business_days: 3
      funding_deadline_hours: 48
      on_time_promise: true
      error_notice_window_days: 180
      error_investigation_days: 90
      reissue_business_days: 2
      purpose_code_corridors: [MX-MXN, GT-GTQ, DO-DOP, CO-COP, PH-PHP, VN-VND]

events:
  # ---- holding writes (cash_transfers) ----
  - type: cash_transfer_booked
    target: cash_transfers
    mutation: create
    meaning: "The customer books and pays for a Cash Pickup transfer after seeing the pre-payment disclosure."
    grain: "One row per transfer order."
    fields:
      customer_id: "The sending customer."
      sender_account_id: "Personal Sender Account the transfer is booked under."
      recipient_id: "The saved recipient who will collect the cash."
      variant_name: "The Cash Pickup tier chosen."
      corridor: "Destination corridor."
      confirmation_number: "Confirmation number on the customer's receipt."
      send_amount_usd: "Principal in USD."
      transfer_fee_usd: "Transfer fee disclosed, after any promotion or pay-by-bank discount."
      card_fee_usd: "Credit-card funding fee disclosed; 0.00 when none."
      usd_payout_charge_usd: "US-dollar payout fee disclosed; 0.00 when none."
      fx_rate: "Customer exchange rate (1.0000 for a US-dollar payout)."
      payout_currency: "local or usd."
      receive_amount: "Cash amount the recipient collects."
      funding_method: "How the customer pays."
      transfer_purpose: "Stated purpose of the transfer."
      recipient_name_on_transfer: "Name the cash is released to, copied from the saved recipient."
      booked_at: "Moment the customer authorised payment."
      date_available: "Disclosed date the cash will be available."
    triggers:
      - event: cash:cash_funds_received
        when: {funding_method: [debit_card, credit_card, pay_by_bank]}
        map: {amount_usd: send_amount_usd}
      - event: cash:cash_fee_charged
        when: {funding_method: [debit_card, credit_card, pay_by_bank], transfer_fee_usd: {not: 0.0}}
        map: {fee_type: transfer_fee, amount_usd: transfer_fee_usd, fee_seq: 1}
      - event: cash:cash_fee_charged
        when: {funding_method: credit_card}
        map: {fee_type: card_funding_fee, amount_usd: card_fee_usd, fee_seq: 1}
      - event: cash:cash_fee_charged
        when: {funding_method: [debit_card, credit_card, pay_by_bank], usd_payout_charge_usd: {not: 0.0}}
        map: {fee_type: usd_payout_fee, amount_usd: usd_payout_charge_usd, fee_seq: 1}
  - type: cash_rate_requoted
    target: cash_transfers
    mutation: update
    meaning: "Funds arrive after the rate lock lapsed and the rate, cash amount and date available are re-disclosed."
    grain: "One row per re-quote."
    fields:
      fx_rate: "New customer exchange rate."
      receive_amount: "New cash amount."
      date_available: "Re-disclosed date available."
    triggers: []
  - type: cash_made_available
    target: cash_transfers
    mutation: {transition: {from: awaiting_funds, to: ready_for_pickup}}
    meaning: "The money is made available at the payout network and the Pickup Number becomes valid."
    grain: "One row per first availability."
    fields:
      pickup_reference: "Paloma Pickup Number the recipient quotes at the counter."
      available_date: "Date the cash became collectable."
      pickup_expiry_date: "Last day the cash can be collected."
    triggers: []
  - type: cash_hold_placed
    target: cash_transfers
    mutation: {transition: [{from: awaiting_funds, to: on_hold}, {from: ready_for_pickup, to: on_hold}]}
    meaning: "Compliance, funding review, screening after refused pickups or new-recipient cooling-off stops the transfer."
    grain: "One row per hold."
    fields:
      hold_reason: "Why the transfer is held."
      held_at: "Moment the hold was placed."
    triggers: []
  - type: cash_hold_released
    target: cash_transfers
    mutation: {transition: {from: on_hold, to: ready_for_pickup}}
    meaning: "Compliance clears the hold and the cash is available with a fresh pickup window."
    grain: "One row per hold release."
    fields:
      hold_reason: "Reset to none."
      available_date: "Date the cash became collectable again."
      pickup_expiry_date: "New last day of collection."
      pickup_reference: "Pickup Number, issued now when the hold came before first availability."
    triggers: []
  - type: cash_paid_out
    target: cash_transfers
    mutation: {transition: {from: ready_for_pickup, to: paid_out}}
    meaning: "The recipient collects the cash at a payout location."
    grain: "One row per collection."
    fields:
      paid_out_date: "Date the cash was collected."
      closed_date: "Same as paid_out_date."
    triggers:
      - event: rewards:rewards_points_earned
        map: {source_transfer_id: cash_transfer_id, source_category: cash}
  - type: cash_pickup_expired
    target: cash_transfers
    mutation: {transition: {from: ready_for_pickup, to: expired}}
    meaning: "The pickup window ends without the cash being collected."
    grain: "One row per expiry."
    fields:
      expired_date: "Date the pickup expired (the day after pickup_expiry_date)."
    triggers: []
  - type: cash_pickup_reactivated
    target: cash_transfers
    mutation: {transition: {from: expired, to: ready_for_pickup}}
    meaning: "An expired pickup is made collectable again for a new window at the customer's request."
    grain: "One row per reactivation."
    fields:
      available_date: "Date of reactivation."
      pickup_expiry_date: "New last day of collection."
      reactivation_count: "Reactivations on this transfer including this one."
      expired_date: "Cleared on reactivation."
    triggers: []
  - type: cash_reissued
    target: cash_transfers
    mutation: {transition: {from: paid_out, to: ready_for_pickup}}
    meaning: "After an error was found on a pickup recorded as paid, the money is made available again under a new Pickup Number at no cost."
    grain: "One row per re-issue."
    fields:
      pickup_reference: "New Paloma Pickup Number; the old one is void."
      available_date: "Date of re-issue."
      pickup_expiry_date: "Last day of collection for the re-issue."
      paid_out_date: "Cleared."
      closed_date: "Cleared."
    triggers: []
  - type: cash_transfer_cancelled
    target: cash_transfers
    mutation: {transition: [{from: awaiting_funds, to: cancelled}, {from: on_hold, to: cancelled}, {from: ready_for_pickup, to: cancelled}]}
    meaning: "The customer cancels their own transfer before the cash is collected."
    grain: "One row per customer cancellation."
    fields:
      cancelled_at: "Moment the customer confirmed the cancellation."
    triggers: []
  - type: cash_transfer_auto_cancelled
    target: cash_transfers
    mutation: {transition: [{from: on_hold, to: cancelled}, {from: awaiting_funds, to: cancelled}]}
    meaning: "Paloma cancels the transfer: an unanswered or rejected request for information, a compliance rejection, or a failed or late payment."
    grain: "One row per Paloma-initiated cancellation."
    fields:
      cancelled_at: "Moment Paloma cancelled it."
      hold_reason: "The reason that led to the cancellation."
    triggers: []
  - type: cash_transfer_refunded
    target: cash_transfers
    mutation: {transition: [{from: cancelled, to: refunded}, {from: expired, to: refunded}, {from: paid_out, to: refunded}]}
    meaning: "The money owed back has been refunded and the transfer is closed."
    grain: "One row per closing refund."
    fields:
      closed_date: "Date of the closing refund."
    triggers: []
  - type: cash_recipient_name_updated
    target: cash_transfers
    mutation: update
    meaning: "The recipient name the cash is released to is replaced by a corrected spelling."
    grain: "One row per name update."
    fields:
      recipient_name_on_transfer: "Corrected name, exactly as the customer gives it."
    triggers: []
  # ---- ledger writes (cash_ledger) ----
  - type: cash_funds_received
    target: cash_ledger
    meaning: "The customer's payment for the principal is collected."
    grain: "One row per principal collection on a transfer."
    distinguish_by: [entry_date]
    fields:
      amount_usd: "Principal collected (positive)."
      entry_date: "Date collected."
    account: principal_held
    direction: in
    triggers: []
  - type: cash_fee_charged
    target: cash_ledger
    meaning: "A fee is collected: transfer fee, card funding fee, US-dollar payout fee, name correction fee or reactivation fee."
    grain: "One row per fee type per sequence number."
    distinguish_by: [fee_type, fee_seq]
    fields:
      fee_type: "Kind of fee."
      amount_usd: "Fee collected (positive)."
      fee_seq: "1 for booking fees; the correction number for a name correction fee; the reactivation number for a reactivation fee."
      entry_date: "Date collected."
    account: fees_held
    direction: in
    triggers: []
  - type: cash_fee_refunded
    target: cash_ledger
    meaning: "All or part of one collected fee is refunded."
    grain: "One row per refunded fee charge."
    distinguish_by: [related_entry_id]
    fields:
      related_entry_id: "ledger_entry_id of the cash_fee_charged row refunded."
      amount_usd: "Amount refunded (positive)."
      fee_refund_reason: "Why the fee is refunded."
      entry_date: "Date refunded."
    account: fees_held
    direction: out
    triggers: []
  - type: cash_payout_made
    target: cash_ledger
    meaning: "The payout location hands the cash to the recipient."
    grain: "One row per cash payout."
    distinguish_by: [payout_seq]
    fields:
      amount_usd: "USD principal paid out (positive)."
      receive_amount: "Cash handed over."
      payout_currency: "local or usd."
      fx_rate_applied: "Rate used."
      payout_location: "Name of the payout location as reported by the network."
      payout_seq: "1 for the first payout; 2 for a payout after a re-issue."
      entry_date: "Date paid."
    account: principal_held
    direction: out
    triggers:
      - event: cash:cash_paid_out
        map: {paid_out_date: entry_date, closed_date: entry_date}
  - type: cash_paloma_credit
    target: cash_ledger
    meaning: "Paloma funds a re-issue or refund after an error found on a pickup recorded as paid."
    grain: "One row per make-good credit per source entry."
    distinguish_by: [credit_reason, related_entry_id]
    fields:
      credit_reason: "error_reissue, error_refund or incorrect_amount_shortfall."
      amount_usd: "Amount Paloma puts in (positive)."
      related_entry_id: "The cash_payout_made row the error concerned."
      entry_date: "Date credited."
    account: principal_held
    direction: in
    triggers: []
  - type: cash_refund_issued
    target: cash_ledger
    meaning: "Principal owed back to the customer is refunded to the original funding method."
    grain: "One row per principal refund per basis and source entry."
    distinguish_by: [refund_basis, related_entry_id]
    fields:
      amount_usd: "Principal refunded (positive)."
      refund_basis: "Why the refund is owed."
      related_entry_id: "The ledger entry the refund pays back (the cash_funds_received row, or the Paloma credit on an error refund)."
      entry_date: "Date refunded."
    account: principal_held
    direction: out
    triggers:
      - event: cash:cash_transfer_refunded
        when: {refund_basis: {not: error_shortfall}}
        map: {closed_date: entry_date}
  # ---- case writes (cash_cases) ----
  - type: cash_pickup_refused
    target: cash_cases
    meaning: "A payout location refuses to pay the person who came to collect."
    grain: "One row per refused attempt."
    distinguish_by: [case_date, payout_location, refusal_reason]
    fields:
      refusal_reason: "Why the counter refused."
      payout_location: "Location that refused."
      case_date: "Date of the attempt."
    triggers: []
  - type: cash_name_corrected
    target: cash_cases
    meaning: "A spelling correction to the recipient name on the transfer is recorded."
    grain: "One row per correction."
    distinguish_by: [correction_seq]
    fields:
      previous_name: "Recipient name on the transfer before the correction."
      corrected_name: "Corrected name, exactly as the customer gives it."
      correction_seq: "1 for the first correction on the transfer, 2 for the second, and so on."
      case_date: "Date of the correction."
    triggers:
      - event: cash:cash_recipient_name_updated
        map: {recipient_name_on_transfer: corrected_name}
  - type: cash_rfi_answer_logged
    target: cash_cases
    meaning: "The customer's answer to a transfer-level request for information is logged."
    grain: "One row per uploaded answer."
    distinguish_by: [doc_reference]
    fields:
      rfi_topic: "What the request asked."
      doc_reference: "Upload reference of the answer document, as the app shows it."
      case_date: "Date logged."
    triggers: []
  - type: cash_error_notice_filed
    target: cash_cases
    meaning: "The customer gives notice of an error on a cash transfer under the Remittance Transfer Rule."
    grain: "One row per error notice."
    distinguish_by: [case_type, case_date]
    fields:
      case_type: "Kind of error asserted."
      case_date: "Date of the notice."
      resolution_due_date: "Last day for Paloma's decision."
    triggers: []
  - type: cash_error_decided
    target: cash_cases
    meaning: "Paloma's error-resolution team records its finding on one notice."
    grain: "One row per decision."
    distinguish_by: [related_case_id]
    fields:
      related_case_id: "case_id of the notice."
      case_outcome: "error_found or no_error."
      case_date: "Date decided."
    triggers: []
  - type: cash_remedy_chosen
    target: cash_cases
    meaning: "After an error is found, the customer chooses a refund or a re-issue at no cost."
    grain: "One row per choice."
    distinguish_by: [related_case_id]
    fields:
      related_case_id: "case_id of the notice."
      remedy_choice: "refund or reissue for a payment to the wrong person; refund_shortfall or reissue_shortfall for an incorrect amount."
      case_date: "Date chosen."
    triggers:
      - event: cash:cash_refund_issued
        when: {remedy_choice: refund}
        map: {refund_basis: error_resolution}
      - event: cash:cash_refund_issued
        when: {remedy_choice: refund_shortfall}
        map: {refund_basis: error_shortfall}
      - event: cash:cash_reissued
        when: {remedy_choice: [reissue, reissue_shortfall]}
        map: {}

measures:
  - id: cash_msr_transfers_to_recipient_24h
    window: "Rolling 24 hours ending at frozen_time: booked_at strictly later than frozen_time minus 24 hours."
    measure: "Count of cash_transfers on the same recipient_id, excluding status cancelled or refunded."
  - id: cash_msr_name_corrections
    window: "The life of one transfer."
    measure: "Count of cash_name_corrected rows on this cash_transfer_id."
  - id: cash_msr_refused_pickups
    window: "From the transfer's current available_date up to frozen_time."
    measure: "Count of cash_pickup_refused rows on this cash_transfer_id with case_date on or after available_date."

policies:
  - id: cash_agg_multi_holding
    subject: [cash_transfer_booked]
    rule: >-
      A customer may hold any number of Cash Pickup transfers at once; each booking has its own
      confirmation number, Pickup Number, principal, fees, rate and pickup window. They are bounded
      only by the aggregate sending limits of the customer's Personal Sender Account and the
      per-recipient frequency cap (cash_agg_sending_limits). Transfers are never combined into one
      pickup: a recipient collecting two transfers presents each Pickup Number separately, and a
      refund, correction or reactivation on one transfer never touches another.
    eligibility: []
    params:
      max_per_customer: null

  - id: cash_agg_sending_limits
    subject: [cash_transfer_booked]
    rule: >-
      A Cash Pickup transfer is booked only under the customer's own Personal Sender Account, and
      only while that account's status is active. Its principal must fit every ceiling of
      account_sending_limits for the account's level at the moment of booking, aggregated over all of
      the customer's personal transfers in Bank Deposit, Cash Pickup and Mobile Wallet. The principal
      must also lie between the tier's min_send_usd and max_send_usd, both inclusive, and may not
      exceed the corridor's entry in corridor_cap_usd, which is the most the payout network pays in
      one pickup. No more than max_transfers_per_recipient_24h Cash Pickup transfers to one
      recipient may be booked as counted by cash_msr_transfers_to_recipient_24h including the new
      one. The binding ceiling for one transfer is the lowest of the account level's
      per_transfer_limit_usd, the tier's max_send_usd and the corridor cap. A booking over any
      ceiling is not made; Paloma never splits one requested amount into several pickups.
    eligibility:
      - id: sender_account_active
        applies_to: [cash_transfer_booked]
        kind: state
        condition: "A Cash Pickup transfer is booked only under the customer's own Personal Sender Account, and only while that account's status is active."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
        state_contract:
          field: sender_accounts.status
          allowed: [active]
    params:
      per_tier:
        Cash Pickup Economy: {min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", corridor_cap_usd: "=corridor_cap_usd", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
        Cash Pickup Express: {min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", corridor_cap_usd: "=corridor_cap_usd", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
        Cash Pickup Express Plus: {min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", corridor_cap_usd: "=corridor_cap_usd", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
        Cash Pickup Bank Branch: {min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", corridor_cap_usd: "=corridor_cap_usd", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
        Cash Pickup Cardless ATM: {min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", corridor_cap_usd: "=corridor_cap_usd", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
        Cash Pickup Large Amount: {min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", corridor_cap_usd: "=corridor_cap_usd", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
    measures: [cash_msr_transfers_to_recipient_24h]

  - id: cash_evt_booking_eligibility
    subject: [cash_transfer_booked]
    rule: >-
      Booking is the customer's own authorisation of payment: the agent may quote and explain, and
      the customer books. A tier may be booked only when the account's level is at or above the
      tier's entry_min_account_level (by level_number) and account_msr_completed_transfers is at
      least the tier's entry_min_completed_transfers. The funding method must be in the tier's
      funding_methods_allowed and also allowed by the account level; the narrower wins. The corridor
      must be in corridors_served. The recipient must be a saved recipient of the same customer whose
      status is active and whose corridor equals the transfer's corridor, and
      recipient_name_on_transfer is that recipient's full_name exactly as saved. The cash is
      released only to a person whose government ID shows exactly recipient_name_on_transfer and who
      quotes the Pickup Number; a cardless ATM payout needs only the Pickup Number and the one-time
      code sent to the recipient's phone. payout_currency is usd only in a corridor listed in
      usd_payout_corridors and only when the customer asks for it, and local otherwise; SV-USD pays
      in US dollars as its local currency. In a corridor listed in purpose_code_corridors a
      transfer_purpose must be stated. The recipient must be at least 18 years old to collect.
    eligibility:
      - id: tier_entry
        applies_to: [cash_transfer_booked]
        kind: authorization
        condition: "A tier may be booked only when the account's level is at or above the tier's entry_min_account_level (by level_number) and account_msr_completed_transfers is at least the tier's entry_min_completed_transfers."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
      - id: recipient_on_file
        applies_to: [cash_transfer_booked]
        kind: authorization
        condition: "The recipient must be a saved recipient of the same customer whose status is active and whose corridor equals the transfer's corridor"
        evidence_fields: [recipients.recipient_id, recipients.customer_id, recipients.status, recipients.corridor, recipients.full_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [recipients.recipient_id]
          action_bindings:
            recipients.recipient_id: recipient_id
    params:
      recipient_min_age_years: 18
      per_tier:
        Cash Pickup Economy: {entry_min_account_level: "=entry_min_account_level", entry_min_completed_transfers: "=entry_min_completed_transfers", funding_methods_allowed: "=funding_methods_allowed", corridors_served: "=corridors_served", payout_network: "=payout_network", usd_payout_corridors: "=usd_payout_corridors", purpose_code_corridors: "=purpose_code_corridors"}
        Cash Pickup Express: {entry_min_account_level: "=entry_min_account_level", entry_min_completed_transfers: "=entry_min_completed_transfers", funding_methods_allowed: "=funding_methods_allowed", corridors_served: "=corridors_served", payout_network: "=payout_network", usd_payout_corridors: "=usd_payout_corridors", purpose_code_corridors: "=purpose_code_corridors"}
        Cash Pickup Express Plus: {entry_min_account_level: "=entry_min_account_level", entry_min_completed_transfers: "=entry_min_completed_transfers", funding_methods_allowed: "=funding_methods_allowed", corridors_served: "=corridors_served", payout_network: "=payout_network", usd_payout_corridors: "=usd_payout_corridors", purpose_code_corridors: "=purpose_code_corridors"}
        Cash Pickup Bank Branch: {entry_min_account_level: "=entry_min_account_level", entry_min_completed_transfers: "=entry_min_completed_transfers", funding_methods_allowed: "=funding_methods_allowed", corridors_served: "=corridors_served", payout_network: "=payout_network", usd_payout_corridors: "=usd_payout_corridors", purpose_code_corridors: "=purpose_code_corridors"}
        Cash Pickup Cardless ATM: {entry_min_account_level: "=entry_min_account_level", entry_min_completed_transfers: "=entry_min_completed_transfers", funding_methods_allowed: "=funding_methods_allowed", corridors_served: "=corridors_served", payout_network: "=payout_network", usd_payout_corridors: "=usd_payout_corridors", purpose_code_corridors: "=purpose_code_corridors"}
        Cash Pickup Large Amount: {entry_min_account_level: "=entry_min_account_level", entry_min_completed_transfers: "=entry_min_completed_transfers", funding_methods_allowed: "=funding_methods_allowed", corridors_served: "=corridors_served", payout_network: "=payout_network", usd_payout_corridors: "=usd_payout_corridors", purpose_code_corridors: "=purpose_code_corridors"}

  - id: cash_evt_pricing
    subject: [cash_transfer_booked, cash_fee_charged]
    rule: >-
      The transfer fee is the fee_usd of the fee_ladder band containing the principal, less
      pay_by_bank_fee_discount_usd when funded by pay_by_bank (never below 0.00). A first personal
      transfer (no other personal transfer on the sender account in any delivery method except ones
      whose status is cancelled or refunded) booked on a tier whose first_transfer_fee_waived is true
      with principal at or below first_transfer_promo_cap_usd has a 0.00 transfer fee and the margin
      first_transfer_promo_margin_pct; above the cap the regular price applies to the whole
      transfer, and the promotion never stacks with the pay-by-bank discount. card_fee_usd is
      credit_card_fee_pct of the principal, rounded half up to the cent, for credit-card funding and
      debit_card_fee_usd for debit-card funding. A US-dollar payout in a corridor whose local
      currency is not USD carries usd_payout_fee_usd as usd_payout_charge_usd, has fx_rate 1.0000
      and no margin, and receive_amount equals the principal. A local-currency payout uses the margin
      fx_margin_pct, less margin_reduction_pct_points when the principal is at or above
      margin_reduction_threshold_usd (the promotional margin replaces both); fx_rate is the
      corridor's mid_market_rate in the Paloma rate sheet for the booking date times one minus the
      margin over 100, rounded half up to 4 decimals, and receive_amount is the principal times
      fx_rate rounded half up to 2 decimals (whole units for VND). date_available is the release
      day, counted from booking_cutoff_ct as for Bank Deposit, plus advance_notice_business_days and
      availability_business_days Paloma business days; on a tier whose weekend_payout is false the
      date moves to the next Paloma business day when it falls on a weekend or holiday. Fees are
      collected with the principal as cash_fee_charged rows with fee_seq 1.
    eligibility: []
    params:
