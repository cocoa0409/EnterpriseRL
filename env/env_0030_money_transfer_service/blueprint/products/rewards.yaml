    formula:
      cashback_usd: "round(points / redemption_block_points * cashback_per_block_usd, 2)"

  - id: rewards_evt_expiry
    subject: [rewards_points_expired]
    rule: >-
      Points earned in a calendar month expire at the end of the month that is points_expiry_months
      months later, oldest points being used first by redemptions. Every remaining point expires
      when no qualifying transfer has completed for inactivity_expiry_months months, counted from
      last_qualifying_date. On an opt-out every remaining point is forfeited when
      opt_out_forfeits_points is true, and on a termination every remaining point is forfeited.
      Expired or forfeited points are never restored, except that points expired in error are
      re-credited as goodwill. Expiry follows the tier in force on the expiry date.
    eligibility: []
    params:
      per_tier:
        Paloma Rewards Blue: {points_expiry_months: "=points_expiry_months", inactivity_expiry_months: "=inactivity_expiry_months", opt_out_forfeits_points: "=opt_out_forfeits_points"}
        Paloma Rewards Silver: {points_expiry_months: "=points_expiry_months", inactivity_expiry_months: "=inactivity_expiry_months", opt_out_forfeits_points: "=opt_out_forfeits_points"}
        Paloma Rewards Gold: {points_expiry_months: "=points_expiry_months", inactivity_expiry_months: "=inactivity_expiry_months", opt_out_forfeits_points: "=opt_out_forfeits_points"}
        Paloma Rewards Platinum: {points_expiry_months: "=points_expiry_months", inactivity_expiry_months: "=inactivity_expiry_months", opt_out_forfeits_points: "=opt_out_forfeits_points"}
        Paloma Rewards Diamond: {points_expiry_months: "=points_expiry_months", inactivity_expiry_months: "=inactivity_expiry_months", opt_out_forfeits_points: "=opt_out_forfeits_points"}
        Paloma Rewards Elite: {points_expiry_months: "=points_expiry_months", inactivity_expiry_months: "=inactivity_expiry_months", opt_out_forfeits_points: "=opt_out_forfeits_points"}

  - id: rewards_evt_reversal
    subject: [rewards_points_reversed]
    rule: >-
      When reversal_on_refund is true and a transfer or order that earned points is refunded, the
      points it earned are taken back; a transfer refunded before delivery never earned any. A
      reversal takes back exactly the points of the earning row it points to, once. When the balance
      is lower than the points to reverse, the balance goes to zero and the shortfall is deducted
      from the next points earned. Reversals of a refunded transfer do not change the tier until the
      next review.
    eligibility:
      - id: reverse_once
        applies_to: [rewards_points_reversed]
        kind: dedup
        condition: "A reversal takes back exactly the points of the earning row it points to, once."
        evidence_fields: [rewards_ledger.source_category, rewards_ledger.source_transfer_id, rewards_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_ledger.source_transfer_id]
          action_bindings:
            rewards_ledger.source_transfer_id: source_transfer_id
        dedup_contract:
          table: rewards_ledger
          mode: separate_record
          object_bindings: {source_category: source_category, source_transfer_id: source_transfer_id}
          duplicate_filters: {event_type: [rewards_points_reversed]}
          distinct_fields: []
    params:
      per_tier:
        Paloma Rewards Blue: {reversal_on_refund: "=reversal_on_refund"}
        Paloma Rewards Silver: {reversal_on_refund: "=reversal_on_refund"}
        Paloma Rewards Gold: {reversal_on_refund: "=reversal_on_refund"}
        Paloma Rewards Platinum: {reversal_on_refund: "=reversal_on_refund"}
        Paloma Rewards Diamond: {reversal_on_refund: "=reversal_on_refund"}
        Paloma Rewards Elite: {reversal_on_refund: "=reversal_on_refund"}

  - id: rewards_evt_membership_status
    subject: [rewards_suspended, rewards_reinstated, rewards_opted_out, rewards_terminated]
    rule: >-
      Only Fraud Operations suspends, reinstates or terminates a membership; a support agent never
      does. While suspended, points are frozen when points_freeze_on_suspension is true. Opting out is
      the member's own choice and the member confirms it; it is possible only from active, and the
      member is told that points are forfeited when opt_out_forfeits_points is true. Closing the
      member's Personal Sender Account terminates the membership. A member on a tier with
      priority_support true is served on the priority line. A points statement covers at most
      statement_history_months months.
    eligibility: []
    params:
      per_tier:
        Paloma Rewards Blue: {points_freeze_on_suspension: "=points_freeze_on_suspension", opt_out_forfeits_points: "=opt_out_forfeits_points", priority_support: "=priority_support", statement_history_months: "=statement_history_months"}
        Paloma Rewards Silver: {points_freeze_on_suspension: "=points_freeze_on_suspension", opt_out_forfeits_points: "=opt_out_forfeits_points", priority_support: "=priority_support", statement_history_months: "=statement_history_months"}
        Paloma Rewards Gold: {points_freeze_on_suspension: "=points_freeze_on_suspension", opt_out_forfeits_points: "=opt_out_forfeits_points", priority_support: "=priority_support", statement_history_months: "=statement_history_months"}
        Paloma Rewards Platinum: {points_freeze_on_suspension: "=points_freeze_on_suspension", opt_out_forfeits_points: "=opt_out_forfeits_points", priority_support: "=priority_support", statement_history_months: "=statement_history_months"}
        Paloma Rewards Diamond: {points_freeze_on_suspension: "=points_freeze_on_suspension", opt_out_forfeits_points: "=opt_out_forfeits_points", priority_support: "=priority_support", statement_history_months: "=statement_history_months"}
        Paloma Rewards Elite: {points_freeze_on_suspension: "=points_freeze_on_suspension", opt_out_forfeits_points: "=opt_out_forfeits_points", priority_support: "=priority_support", statement_history_months: "=statement_history_months"}
