# Paloma Remit — product charter: Paloma Rewards (loyalty membership).
# Customers who send personal transfers may join Paloma Rewards. The membership holds a points
# balance earned on completed personal transfers (Bank Deposit, Cash Pickup, Mobile Wallet) and on
# Mobile Top-Up orders, plus bonuses; points are redeemed for cash back to the customer's debit card,
# charity donations or airtime credit. The membership tier follows the customer's qualifying
# transfers over the trailing 12 months and sets earning rates, bonuses and redemption terms. Points
# never change the price of a transfer.

category: rewards
display_name: Paloma Rewards

binding:
  holding_table: rewards_memberships
  event_tables: [rewards_ledger]
  status_field: status
  variant_field: variant_name
  quantity_fields: {points_balance: points}

lifecycle:
  states: [active, suspended, closed]
  transitions:
    - {from: active, to: suspended, by: system, means: "Paloma Fraud Operations freezes the membership while it reviews suspicious earning or redemption."}
    - {from: suspended, to: active, by: system, means: "The review closes in the member's favour and the membership is unfrozen."}
    - {from: active, to: closed, by: user, means: "The member opts out of Paloma Rewards."}
    - {from: suspended, to: closed, by: system, means: "Paloma ends the membership after a review finds abuse, or when the member's Personal Sender Account is closed."}

accounts:
  - key: points
    unit: points
    meaning: "Rewards points available to the member: earned and bonus points in; redeemed, expired and reversed points out."

parameter_schema:
  qualifying_transfers_12m: "Completed personal transfers in the trailing 12 months needed to hold this tier (count)."
  qualifying_volume_12m_usd: "Alternative threshold: completed personal transfer principal in the trailing 12 months that also qualifies for this tier (USD)."
  points_per_transfer: "Base points earned per completed qualifying transfer (points)."
  points_per_100_usd: "Additional points earned per full 100 USD of principal of a completed transfer (points)."
  max_points_per_transfer: "Most points one transfer can earn after multipliers (points)."
  bank_multiplier: "Multiplier applied to points on Bank Deposit transfers."
  cash_multiplier: "Multiplier applied to points on Cash Pickup transfers."
  wallet_multiplier: "Multiplier applied to points on Mobile Wallet transfers."
  topup_points_per_order: "Points earned per delivered Mobile Top-Up order (points)."
  min_qualifying_principal_usd: "Smallest principal (USD) a transfer must carry to earn points or count toward a tier."
  points_expiry_months: "Calendar months after the month points were earned at whose end they expire (months)."
  inactivity_expiry_months: "Months without a completed qualifying transfer after which every remaining point expires (months)."
  min_redemption_points: "Fewest points that may be redeemed at once (points)."
  redemption_block_points: "Points are redeemed in whole multiples of this block (points)."
  cashback_per_block_usd: "Cash back (USD) paid per redemption block."
  airtime_per_block_usd: "Airtime credit (USD value) per redemption block."
  donation_match_pct: "Share of a points donation's USD value that Paloma adds to the donation (percent)."
  max_redemptions_30d: "Most redemptions in a rolling 30 calendar days (count)."
  max_points_per_redemption: "Most points one redemption may use (points)."
  cashback_payout_business_days: "Paloma business days within which redeemed cash back is paid to the member's debit card."
  redemption_requires_active_sender_account: "Whether redemption requires the member's Personal Sender Account to be active (boolean)."
  referral_bonus_points: "Points to the referring member when a referred new customer completes a first qualifying transfer (points)."
  referee_bonus_points: "Points to the referred new customer on that first qualifying transfer (points)."
  referral_cap_12m: "Most referral bonuses a member can receive in the trailing 12 months (count)."
  referral_min_first_transfer_usd: "Smallest principal (USD) of the referred customer's first transfer for the referral bonus."
  birthday_bonus_points: "Points granted once a year in the member's birth month (points)."
  birthday_requires_recent_transfer: "Whether the birthday bonus needs a completed qualifying transfer in the trailing 12 months (boolean)."
  tier_welcome_bonus_points: "Points granted once when the member first reaches this tier (points)."
  anniversary_bonus_points: "Points granted on each membership anniversary (points)."
  max_bonus_points_30d: "Most bonus points (referral, birthday, welcome, anniversary) credited in a rolling 30 calendar days; goodwill is excluded (points)."
  goodwill_points_cap_per_case: "Most goodwill points an agent may grant for one service failure (points)."
  goodwill_points_cap_12m: "Most goodwill points a member may receive in the trailing 12 months (points)."
  tier_grace_months: "Months a member keeps this tier after falling below its threshold at a review (months)."
  max_levels_down_per_review: "Most tiers a member can drop at one annual review (count)."
  priority_support: "Whether the member is served on the priority support line (boolean)."
  points_freeze_on_suspension: "Whether points can neither be earned nor redeemed while the membership is suspended (boolean)."
  opt_out_forfeits_points: "Whether points still held are forfeited when the member opts out (boolean)."
  rejoin_wait_days: "Calendar days after an opt-out before the customer may enroll again (days)."
  reversal_on_refund: "Whether points earned on a transfer are reversed when that transfer is later refunded (boolean)."
  statement_history_months: "Months of points history shown on a points statement (months)."
  topup_earning_enabled: "Whether Mobile Top-Up orders earn points at this tier (boolean)."
  min_points_balance_for_cashback: "Points that must remain after a cash-back redemption (points)."
  tier_review_month: "Months between tier reviews, counted from enrollment (months)."
  earning_delay_days: "Calendar days after delivery before earned points become redeemable (days)."
  cashback_cap_12m_usd: "Most cash back (USD) a member may receive from redemptions in the trailing 12 months."
  donation_redemption_enabled: "Whether points may be donated to Paloma's partner charities at this tier (boolean)."
  airtime_redemption_enabled: "Whether points may be redeemed for airtime credit at this tier (boolean)."
  max_cashback_per_redemption_usd: "Most cash back (USD) one redemption may pay."

