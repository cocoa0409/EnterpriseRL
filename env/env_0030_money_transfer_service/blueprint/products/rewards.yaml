events:
  - type: rewards_enrolled
    target: rewards_memberships
    mutation: create
    meaning: "A customer joins Paloma Rewards."
    grain: "One row per membership."
    fields:
      customer_id: "The member."
      variant_name: "Starting tier, set from the member's qualifying transfers in the trailing 12 months."
      enrolled_date: "Date of enrollment."
      tier_effective_date: "Date the starting tier took effect (the enrollment date)."
      next_tier_review_date: "Enrollment date plus tier_review_month months."
      referral_code: "Code another member gave the customer at sign-up, exactly as entered; empty when none."
      referred_by_customer_id: "Customer who owns that referral code; empty when none."
    triggers: []
  - type: rewards_suspended
    target: rewards_memberships
    mutation: {transition: {from: active, to: suspended}}
    meaning: "Fraud Operations freezes the membership for review."
    grain: "One row per suspension."
    fields:
      suspended_date: "Date frozen."
    triggers: []
  - type: rewards_reinstated
    target: rewards_memberships
    mutation: {transition: {from: suspended, to: active}}
    meaning: "The review closes in the member's favour."
    grain: "One row per reinstatement."
    fields:
      suspended_date: "Cleared."
    triggers: []
  - type: rewards_opted_out
    target: rewards_memberships
    mutation: {transition: {from: active, to: closed}}
    meaning: "The member leaves Paloma Rewards."
    grain: "One row per opt-out."
    fields:
      closed_date: "Date of opt-out."
      closure_reason: "opt_out."
    triggers:
      - event: rewards:rewards_points_expired
        map: {expiry_reason: opt_out_forfeit}
  - type: rewards_terminated
    target: rewards_memberships
    mutation: {transition: {from: suspended, to: closed}}
    meaning: "Paloma ends the membership after a review finds abuse or the sender account closes."
    grain: "One row per termination."
    fields:
      closed_date: "Date ended."
      closure_reason: "abuse or sender_account_closed."
    triggers:
      - event: rewards:rewards_points_expired
        map: {expiry_reason: termination_forfeit}
  - type: rewards_tier_upgraded
    target: rewards_memberships
    mutation: update
    meaning: "The member reaches a higher tier's threshold between reviews and moves up at once."
    grain: "One row per upgrade."
    fields:
      variant_name: "The higher tier."
      tier_effective_date: "Date of the upgrade."
    triggers: []
  - type: rewards_tier_reviewed
    target: rewards_memberships
    mutation: update
    meaning: "The periodic tier review keeps, lowers or grace-protects the member's tier."
    grain: "One row per review."
    fields:
      variant_name: "Tier after the review."
      tier_effective_date: "Date the tier after review took effect (unchanged when kept)."
      next_tier_review_date: "Next review date."
      tier_grace_until: "Last day of a grace period granted at this review; empty when none."
    triggers: []
  - type: rewards_points_earned
    target: rewards_ledger
    meaning: "Points are earned on a completed personal transfer or a delivered top-up."
    grain: "One row per earning transfer or order."
    distinguish_by: [source_category, source_transfer_id]
    fields:
      source_category: "bank, cash, wallet or topup."
      source_transfer_id: "Id of the transfer or top-up order that earned the points."
      points: "Points earned (positive)."
      entry_date: "Date earned (the delivery date)."
    account: points
    direction: in
    triggers: []
  - type: rewards_points_bonus
    target: rewards_ledger
    meaning: "Bonus points are credited: referral, referee, birthday, tier welcome, anniversary or agent goodwill."
    grain: "One row per bonus per occasion."
    distinguish_by: [bonus_type, bonus_reference]
    fields:
      bonus_type: "Kind of bonus."
      bonus_reference: "What the bonus is for: the referred customer's id, the birthday or anniversary year (YYYY), the tier name, or the goodwill case date (YYYY-MM-DD)."
      points: "Points credited (positive)."
      entry_date: "Date credited."
    account: points
    direction: in
    triggers: []
  - type: rewards_points_redeemed
    target: rewards_ledger
    meaning: "The member redeems points for cash back, a charity donation or airtime credit."
    grain: "One row per redemption."
    distinguish_by: [redemption_seq]
    fields:
      redemption_type: "cashback, donation or airtime_credit."
      points: "Points redeemed (positive)."
      redemption_value_usd: "USD value paid, donated or credited."
      donation_match_usd: "Paloma's matching donation (USD); 0.00 for other types."
      redemption_seq: "1 for the member's first redemption, 2 for the second, and so on."
      entry_date: "Date redeemed."
    account: points
    direction: out
    triggers: []
  - type: rewards_points_expired
    target: rewards_ledger
    meaning: "Points lapse: a monthly batch reaches its expiry, inactivity, or forfeiture on opt-out or termination."
    grain: "One row per expiry reason per earning month."
    distinguish_by: [expiry_reason, points_batch_month]
    fields:
      expiry_reason: "Why the points lapse."
      points_batch_month: "Month (YYYY-MM) the lapsing points were earned; the closure month for forfeitures."
      points: "Points lapsed (positive)."
      entry_date: "Date lapsed."
    account: points
    direction: out
    triggers: []
  - type: rewards_points_reversed
    target: rewards_ledger
    meaning: "Points earned on a transfer or order that is later refunded are taken back."
    grain: "One row per reversed earning."
    distinguish_by: [source_category, source_transfer_id]
    fields:
      source_category: "Category of the refunded transfer or order."
      source_transfer_id: "Id of the refunded transfer or order."
      related_entry_id: "rewards_entry_id of the rewards_points_earned row reversed."
      points: "Points taken back (positive)."
      entry_date: "Date reversed."
    account: points
    direction: out
    triggers: []

measures:
  - id: rewards_msr_qualifying_12m
    window: "Trailing 12 calendar months: delivery date on or after the same calendar day 12 months before the handling date."
    measure: "Count of the member's personal transfers with principal at or above min_qualifying_principal_usd that reached deposited (bank_transfers.deposited_date), paid_out (cash_transfers.paid_out_date) or credited (wallet_transfers.credited_at) in the window and are not refunded."
  - id: rewards_msr_qualifying_volume_12m
    window: "Same trailing 12 calendar months."
    measure: "Sum of send_amount_usd over the same qualifying transfers."
  - id: rewards_msr_redemptions_30d
    window: "Rolling 30 calendar days ending on the handling date."
    measure: "Count of rewards_points_redeemed rows of the membership."
  - id: rewards_msr_cashback_12m
    window: "Trailing 12 calendar months ending on the handling date."
    measure: "Sum of redemption_value_usd over rewards_points_redeemed rows with redemption_type cashback."
  - id: rewards_msr_bonus_30d
    window: "Rolling 30 calendar days ending on the handling date."
    measure: "Sum of points over rewards_points_bonus rows other than bonus_type goodwill."
  - id: rewards_msr_goodwill_12m
    window: "Trailing 12 calendar months ending on the handling date."
    measure: "Sum of points over rewards_points_bonus rows with bonus_type goodwill."
  - id: rewards_msr_referrals_12m
    window: "Trailing 12 calendar months ending on the handling date."
    measure: "Count of rewards_points_bonus rows with bonus_type referral."
  - id: rewards_msr_redeemable_points
    window: "As at frozen_time."
    measure: "points_balance less points from rewards_points_earned rows whose entry_date is fewer than earning_delay_days calendar days before the handling date."

policies:
  - id: rewards_agg_multi_holding
    subject: [rewards_enrolled]
    rule: >-
      A customer may hold at most one Paloma Rewards membership. Enrollment is accepted only when the
      customer holds no other membership whose status is active or suspended. A customer who opted
      out may enroll again only once rejoin_wait_days calendar days have passed since the opt-out,
      and starts with no points. The wait is counted in calendar days from closed_date of the
      opted-out membership, and enrollment on closed_date plus rejoin_wait_days is allowed. A customer
      whose membership was terminated for abuse may not enroll again.
    eligibility:
      - id: one_membership
        applies_to: [rewards_enrolled]
        kind: dedup
        condition: "Enrollment is accepted only when the customer holds no other membership whose status is active or suspended."
        evidence_fields: [rewards_memberships.customer_id, rewards_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.customer_id]
          action_bindings:
            rewards_memberships.customer_id: customer_id
        dedup_contract:
          table: rewards_memberships
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [active, suspended]}
          distinct_fields: []
      - id: rejoin_wait
        applies_to: [rewards_enrolled]
        kind: time
        condition: "A customer who opted out may enroll again only once rejoin_wait_days calendar days have passed since the opt-out"
        evidence_fields: [rewards_memberships.customer_id, rewards_memberships.closed_date, rewards_memberships.closure_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.customer_id]
          action_bindings:
            rewards_memberships.customer_id: customer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the opt-out"
          anchor_source: rewards_memberships.closed_date
          relation: not_before
          duration_source: variants.rejoin_wait_days
          unit: calendar_days
          counting_rule: "The wait is counted in calendar days from closed_date of the opted-out membership, and enrollment on closed_date plus rejoin_wait_days is allowed."
          boundary: inclusive
    params:
      max_per_customer: 1
      per_tier:
        Paloma Rewards Blue: {rejoin_wait_days: "=rejoin_wait_days"}
        Paloma Rewards Silver: {rejoin_wait_days: "=rejoin_wait_days"}
        Paloma Rewards Gold: {rejoin_wait_days: "=rejoin_wait_days"}
        Paloma Rewards Platinum: {rejoin_wait_days: "=rejoin_wait_days"}
        Paloma Rewards Diamond: {rejoin_wait_days: "=rejoin_wait_days"}
        Paloma Rewards Elite: {rejoin_wait_days: "=rejoin_wait_days"}

  - id: rewards_evt_enrollment
    subject: [rewards_enrolled]
    rule: >-
      A customer can enroll only while their Personal Sender Account is active; Paloma Business
      accounts cannot enroll. The starting tier is the highest tier whose qualifying_transfers_12m or
      qualifying_volume_12m_usd the customer already meets by rewards_msr_qualifying_12m or
      rewards_msr_qualifying_volume_12m, and Paloma Rewards Blue otherwise. next_tier_review_date is
      the enrollment date plus tier_review_month calendar months. A referral_code is recorded only
      when entered at enrollment and only when it belongs to another member's active membership;
      a code entered later is never applied. Transfers completed before enrollment earn no points.
    eligibility:
      - id: sender_account_active
        applies_to: [rewards_enrolled]
        kind: state
        condition: "A customer can enroll only while their Personal Sender Account is active; Paloma Business accounts cannot enroll."
        evidence_fields: [sender_accounts.customer_id, sender_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.customer_id]
          action_bindings:
            sender_accounts.customer_id: customer_id
        state_contract:
          field: sender_accounts.status
          allowed: [active]
    params:
      per_tier:
        Paloma Rewards Blue: {qualifying_transfers_12m: "=qualifying_transfers_12m", qualifying_volume_12m_usd: "=qualifying_volume_12m_usd", tier_review_month: "=tier_review_month"}
        Paloma Rewards Silver: {qualifying_transfers_12m: "=qualifying_transfers_12m", qualifying_volume_12m_usd: "=qualifying_volume_12m_usd", tier_review_month: "=tier_review_month"}
        Paloma Rewards Gold: {qualifying_transfers_12m: "=qualifying_transfers_12m", qualifying_volume_12m_usd: "=qualifying_volume_12m_usd", tier_review_month: "=tier_review_month"}
        Paloma Rewards Platinum: {qualifying_transfers_12m: "=qualifying_transfers_12m", qualifying_volume_12m_usd: "=qualifying_volume_12m_usd", tier_review_month: "=tier_review_month"}
        Paloma Rewards Diamond: {qualifying_transfers_12m: "=qualifying_transfers_12m", qualifying_volume_12m_usd: "=qualifying_volume_12m_usd", tier_review_month: "=tier_review_month"}
        Paloma Rewards Elite: {qualifying_transfers_12m: "=qualifying_transfers_12m", qualifying_volume_12m_usd: "=qualifying_volume_12m_usd", tier_review_month: "=tier_review_month"}
    measures: [rewards_msr_qualifying_12m, rewards_msr_qualifying_volume_12m]

  - id: rewards_evt_earning
    subject: [rewards_points_earned]
    rule: >-
      Points are earned only on a personal transfer that reaches deposited, paid_out or credited, or
      on a delivered top-up when topup_earning_enabled is true, and only while the membership is
      active. A transfer whose principal is below min_qualifying_principal_usd earns nothing.
      Transfer points are points_per_transfer plus points_per_100_usd for each full 100 USD of
      principal, multiplied by bank_multiplier, cash_multiplier or wallet_multiplier for its delivery
      method, rounded down to a whole point, and capped at max_points_per_transfer; a top-up earns
      topup_points_per_order. The tier in force on the delivery date applies. Each transfer or order
      earns once. Points become redeemable earning_delay_days calendar days after they are earned.
      A membership whose points_freeze_on_suspension is true earns nothing while suspended, and points
      missed during a suspension are not credited afterwards. Business payouts never earn points.
    eligibility:
      - id: membership_active
        applies_to: [rewards_points_earned]
        kind: state
        condition: "Points are earned only on a personal transfer that reaches deposited, paid_out or credited, or on a delivered top-up when topup_earning_enabled is true, and only while the membership is active."
        evidence_fields: [rewards_memberships.rewards_membership_id, rewards_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.rewards_membership_id]
          action_bindings:
            rewards_memberships.rewards_membership_id: rewards_membership_id
        state_contract:
          field: rewards_memberships.status
          allowed: [active]
      - id: earn_once
        applies_to: [rewards_points_earned]
        kind: dedup
        condition: "Each transfer or order earns once."
        evidence_fields: [rewards_ledger.source_category, rewards_ledger.source_transfer_id, rewards_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_ledger.source_transfer_id]
          action_bindings:
            rewards_ledger.source_transfer_id: source_transfer_id
        dedup_contract:
          table: rewards_ledger
          mode: separate_record
          object_bindings: {source_category: source_category, source_transfer_id: source_transfer_id}
          duplicate_filters: {event_type: [rewards_points_earned]}
          distinct_fields: []
    params:
      per_tier:
        Paloma Rewards Blue: {min_qualifying_principal_usd: "=min_qualifying_principal_usd", points_per_transfer: "=points_per_transfer", points_per_100_usd: "=points_per_100_usd", bank_multiplier: "=bank_multiplier", cash_multiplier: "=cash_multiplier", wallet_multiplier: "=wallet_multiplier", max_points_per_transfer: "=max_points_per_transfer", topup_earning_enabled: "=topup_earning_enabled", topup_points_per_order: "=topup_points_per_order", earning_delay_days: "=earning_delay_days", points_freeze_on_suspension: "=points_freeze_on_suspension"}
        Paloma Rewards Silver: {min_qualifying_principal_usd: "=min_qualifying_principal_usd", points_per_transfer: "=points_per_transfer", points_per_100_usd: "=points_per_100_usd", bank_multiplier: "=bank_multiplier", cash_multiplier: "=cash_multiplier", wallet_multiplier: "=wallet_multiplier", max_points_per_transfer: "=max_points_per_transfer", topup_earning_enabled: "=topup_earning_enabled", topup_points_per_order: "=topup_points_per_order", earning_delay_days: "=earning_delay_days", points_freeze_on_suspension: "=points_freeze_on_suspension"}
        Paloma Rewards Gold: {min_qualifying_principal_usd: "=min_qualifying_principal_usd", points_per_transfer: "=points_per_transfer", points_per_100_usd: "=points_per_100_usd", bank_multiplier: "=bank_multiplier", cash_multiplier: "=cash_multiplier", wallet_multiplier: "=wallet_multiplier", max_points_per_transfer: "=max_points_per_transfer", topup_earning_enabled: "=topup_earning_enabled", topup_points_per_order: "=topup_points_per_order", earning_delay_days: "=earning_delay_days", points_freeze_on_suspension: "=points_freeze_on_suspension"}
        Paloma Rewards Platinum: {min_qualifying_principal_usd: "=min_qualifying_principal_usd", points_per_transfer: "=points_per_transfer", points_per_100_usd: "=points_per_100_usd", bank_multiplier: "=bank_multiplier", cash_multiplier: "=cash_multiplier", wallet_multiplier: "=wallet_multiplier", max_points_per_transfer: "=max_points_per_transfer", topup_earning_enabled: "=topup_earning_enabled", topup_points_per_order: "=topup_points_per_order", earning_delay_days: "=earning_delay_days", points_freeze_on_suspension: "=points_freeze_on_suspension"}
        Paloma Rewards Diamond: {min_qualifying_principal_usd: "=min_qualifying_principal_usd", points_per_transfer: "=points_per_transfer", points_per_100_usd: "=points_per_100_usd", bank_multiplier: "=bank_multiplier", cash_multiplier: "=cash_multiplier", wallet_multiplier: "=wallet_multiplier", max_points_per_transfer: "=max_points_per_transfer", topup_earning_enabled: "=topup_earning_enabled", topup_points_per_order: "=topup_points_per_order", earning_delay_days: "=earning_delay_days", points_freeze_on_suspension: "=points_freeze_on_suspension"}
        Paloma Rewards Elite: {min_qualifying_principal_usd: "=min_qualifying_principal_usd", points_per_transfer: "=points_per_transfer", points_per_100_usd: "=points_per_100_usd", bank_multiplier: "=bank_multiplier", cash_multiplier: "=cash_multiplier", wallet_multiplier: "=wallet_multiplier", max_points_per_transfer: "=max_points_per_transfer", topup_earning_enabled: "=topup_earning_enabled", topup_points_per_order: "=topup_points_per_order", earning_delay_days: "=earning_delay_days", points_freeze_on_suspension: "=points_freeze_on_suspension"}

  - id: rewards_evt_tier_qualification
    subject: [rewards_tier_upgraded, rewards_tier_reviewed]
    rule: >-
      A member moves up as soon as rewards_msr_qualifying_12m reaches a higher tier's
      qualifying_transfers_12m or rewards_msr_qualifying_volume_12m reaches its
      qualifying_volume_12m_usd, to the highest such tier, effective that day; an upgrade never moves
      the review date. At next_tier_review_date the tier is reviewed: a member who still meets the
      current tier keeps it; a member below it keeps it for tier_grace_months more months when that
      value is above 0 and no grace was given at the previous review, and otherwise drops to the
      highest tier met, never more than max_levels_down_per_review tiers at one review. Each review
      sets next_tier_review_date to the review date plus tier_review_month months. Tier changes apply
      to earning and redemption from their effective date and never re-price points already earned.
      A tier change happens only while the membership is active.
    eligibility:
      - id: membership_active
        applies_to: [rewards_tier_upgraded, rewards_tier_reviewed]
        kind: state
        condition: "A tier change happens only while the membership is active."
        evidence_fields: [rewards_memberships.rewards_membership_id, rewards_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.rewards_membership_id]
          action_bindings:
            rewards_memberships.rewards_membership_id: rewards_membership_id
        state_contract:
          field: rewards_memberships.status
          allowed: [active]
    params:
      per_tier:
        Paloma Rewards Blue: {qualifying_transfers_12m: "=qualifying_transfers_12m", qualifying_volume_12m_usd: "=qualifying_volume_12m_usd", tier_grace_months: "=tier_grace_months", max_levels_down_per_review: "=max_levels_down_per_review", tier_review_month: "=tier_review_month"}
        Paloma Rewards Silver: {qualifying_transfers_12m: "=qualifying_transfers_12m", qualifying_volume_12m_usd: "=qualifying_volume_12m_usd", tier_grace_months: "=tier_grace_months", max_levels_down_per_review: "=max_levels_down_per_review", tier_review_month: "=tier_review_month"}
        Paloma Rewards Gold: {qualifying_transfers_12m: "=qualifying_transfers_12m", qualifying_volume_12m_usd: "=qualifying_volume_12m_usd", tier_grace_months: "=tier_grace_months", max_levels_down_per_review: "=max_levels_down_per_review", tier_review_month: "=tier_review_month"}
        Paloma Rewards Platinum: {qualifying_transfers_12m: "=qualifying_transfers_12m", qualifying_volume_12m_usd: "=qualifying_volume_12m_usd", tier_grace_months: "=tier_grace_months", max_levels_down_per_review: "=max_levels_down_per_review", tier_review_month: "=tier_review_month"}
        Paloma Rewards Diamond: {qualifying_transfers_12m: "=qualifying_transfers_12m", qualifying_volume_12m_usd: "=qualifying_volume_12m_usd", tier_grace_months: "=tier_grace_months", max_levels_down_per_review: "=max_levels_down_per_review", tier_review_month: "=tier_review_month"}
        Paloma Rewards Elite: {qualifying_transfers_12m: "=qualifying_transfers_12m", qualifying_volume_12m_usd: "=qualifying_volume_12m_usd", tier_grace_months: "=tier_grace_months", max_levels_down_per_review: "=max_levels_down_per_review", tier_review_month: "=tier_review_month"}
    measures: [rewards_msr_qualifying_12m, rewards_msr_qualifying_volume_12m]

  - id: rewards_evt_bonuses
    subject: [rewards_points_bonus]
    rule: >-
      Bonus points are credited only while the membership is active. A referral bonus of
      referral_bonus_points goes to the referring member, and referee_bonus_points to the new member,
      when the referred customer's first personal transfer of at least referral_min_first_transfer_usd
      is delivered; the referring member receives at most referral_cap_12m referral bonuses as counted
      by rewards_msr_referrals_12m. A birthday bonus of birthday_bonus_points is credited once in the
      member's birth month (customers.date_of_birth), and only after a qualifying transfer in the
      trailing 12 months when birthday_requires_recent_transfer is true. tier_welcome_bonus_points is
      credited the first time a member reaches a tier, never again for the same tier.
      anniversary_bonus_points is credited on each membership anniversary. Bonus points of these kinds
      above max_bonus_points_30d within rewards_msr_bonus_30d are not credited. Each bonus is credited
      once per occasion (bonus_type and bonus_reference). Goodwill is governed by
      rewards_evt_goodwill.
    eligibility:
      - id: bonus_once
        applies_to: [rewards_points_bonus]
        kind: dedup
        condition: "Each bonus is credited once per occasion (bonus_type and bonus_reference)."
        evidence_fields: [rewards_ledger.rewards_membership_id, rewards_ledger.bonus_type, rewards_ledger.bonus_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_ledger.rewards_membership_id]
          action_bindings:
            rewards_ledger.rewards_membership_id: rewards_membership_id
        dedup_contract:
          table: rewards_ledger
          mode: separate_record
          object_bindings: {rewards_membership_id: rewards_membership_id, bonus_type: bonus_type, bonus_reference: bonus_reference}
          duplicate_filters: {event_type: [rewards_points_bonus]}
          distinct_fields: []
    params:
      per_tier:
        Paloma Rewards Blue: {referral_bonus_points: "=referral_bonus_points", referee_bonus_points: "=referee_bonus_points", referral_cap_12m: "=referral_cap_12m", referral_min_first_transfer_usd: "=referral_min_first_transfer_usd", birthday_bonus_points: "=birthday_bonus_points", birthday_requires_recent_transfer: "=birthday_requires_recent_transfer", tier_welcome_bonus_points: "=tier_welcome_bonus_points", anniversary_bonus_points: "=anniversary_bonus_points", max_bonus_points_30d: "=max_bonus_points_30d"}
        Paloma Rewards Silver: {referral_bonus_points: "=referral_bonus_points", referee_bonus_points: "=referee_bonus_points", referral_cap_12m: "=referral_cap_12m", referral_min_first_transfer_usd: "=referral_min_first_transfer_usd", birthday_bonus_points: "=birthday_bonus_points", birthday_requires_recent_transfer: "=birthday_requires_recent_transfer", tier_welcome_bonus_points: "=tier_welcome_bonus_points", anniversary_bonus_points: "=anniversary_bonus_points", max_bonus_points_30d: "=max_bonus_points_30d"}
        Paloma Rewards Gold: {referral_bonus_points: "=referral_bonus_points", referee_bonus_points: "=referee_bonus_points", referral_cap_12m: "=referral_cap_12m", referral_min_first_transfer_usd: "=referral_min_first_transfer_usd", birthday_bonus_points: "=birthday_bonus_points", birthday_requires_recent_transfer: "=birthday_requires_recent_transfer", tier_welcome_bonus_points: "=tier_welcome_bonus_points", anniversary_bonus_points: "=anniversary_bonus_points", max_bonus_points_30d: "=max_bonus_points_30d"}
        Paloma Rewards Platinum: {referral_bonus_points: "=referral_bonus_points", referee_bonus_points: "=referee_bonus_points", referral_cap_12m: "=referral_cap_12m", referral_min_first_transfer_usd: "=referral_min_first_transfer_usd", birthday_bonus_points: "=birthday_bonus_points", birthday_requires_recent_transfer: "=birthday_requires_recent_transfer", tier_welcome_bonus_points: "=tier_welcome_bonus_points", anniversary_bonus_points: "=anniversary_bonus_points", max_bonus_points_30d: "=max_bonus_points_30d"}
        Paloma Rewards Diamond: {referral_bonus_points: "=referral_bonus_points", referee_bonus_points: "=referee_bonus_points", referral_cap_12m: "=referral_cap_12m", referral_min_first_transfer_usd: "=referral_min_first_transfer_usd", birthday_bonus_points: "=birthday_bonus_points", birthday_requires_recent_transfer: "=birthday_requires_recent_transfer", tier_welcome_bonus_points: "=tier_welcome_bonus_points", anniversary_bonus_points: "=anniversary_bonus_points", max_bonus_points_30d: "=max_bonus_points_30d"}
        Paloma Rewards Elite: {referral_bonus_points: "=referral_bonus_points", referee_bonus_points: "=referee_bonus_points", referral_cap_12m: "=referral_cap_12m", referral_min_first_transfer_usd: "=referral_min_first_transfer_usd", birthday_bonus_points: "=birthday_bonus_points", birthday_requires_recent_transfer: "=birthday_requires_recent_transfer", tier_welcome_bonus_points: "=tier_welcome_bonus_points", anniversary_bonus_points: "=anniversary_bonus_points", max_bonus_points_30d: "=max_bonus_points_30d"}
    measures: [rewards_msr_referrals_12m, rewards_msr_bonus_30d]

  - id: rewards_evt_goodwill
    subject: [rewards_points_bonus]
    rule: >-
      A support agent may grant goodwill points only for a service failure Paloma acknowledges on a
      specific transfer or order (a late delivery already confirmed in the records, or an error
      resolved in the customer's favour), never in place of a fee refund or remedy a policy owes, and
      never because a customer asks for compensation without such a failure. One grant per case,
      with bonus_reference the date of the failure's case. A grant may not exceed
      goodwill_points_cap_per_case, and rewards_msr_goodwill_12m plus the grant may not exceed
      goodwill_points_cap_12m. Goodwill points are granted only while the membership is active and
      count toward no tier.
    eligibility:
      - id: goodwill_caps
        applies_to: [rewards_points_bonus]
        kind: authorization
        condition: "A grant may not exceed goodwill_points_cap_per_case, and rewards_msr_goodwill_12m plus the grant may not exceed goodwill_points_cap_12m."
        evidence_fields: [rewards_ledger.rewards_membership_id, rewards_ledger.bonus_type, rewards_ledger.points, rewards_ledger.entry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_ledger.rewards_membership_id]
          action_bindings:
            rewards_ledger.rewards_membership_id: rewards_membership_id
    params:
      per_tier:
        Paloma Rewards Blue: {goodwill_points_cap_per_case: "=goodwill_points_cap_per_case", goodwill_points_cap_12m: "=goodwill_points_cap_12m"}
        Paloma Rewards Silver: {goodwill_points_cap_per_case: "=goodwill_points_cap_per_case", goodwill_points_cap_12m: "=goodwill_points_cap_12m"}
        Paloma Rewards Gold: {goodwill_points_cap_per_case: "=goodwill_points_cap_per_case", goodwill_points_cap_12m: "=goodwill_points_cap_12m"}
        Paloma Rewards Platinum: {goodwill_points_cap_per_case: "=goodwill_points_cap_per_case", goodwill_points_cap_12m: "=goodwill_points_cap_12m"}
        Paloma Rewards Diamond: {goodwill_points_cap_per_case: "=goodwill_points_cap_per_case", goodwill_points_cap_12m: "=goodwill_points_cap_12m"}
        Paloma Rewards Elite: {goodwill_points_cap_per_case: "=goodwill_points_cap_per_case", goodwill_points_cap_12m: "=goodwill_points_cap_12m"}
    measures: [rewards_msr_goodwill_12m]

  - id: rewards_evt_redemption
    subject: [rewards_points_redeemed]
    rule: >-
      Redemption is the member's own choice over their points. Points are redeemed only while the
      membership is active, and only while the member's Personal Sender Account is active when
      redemption_requires_active_sender_account is true. Only redeemable points
      (rewards_msr_redeemable_points) can be used; a redemption uses at least min_redemption_points
      and at most max_points_per_redemption, in whole multiples of redemption_block_points. Cash back
      pays cashback_per_block_usd per block to the member's linked debit card within
      cashback_payout_business_days Paloma business days, up to max_cashback_per_redemption_usd per
      redemption and cashback_cap_12m_usd within rewards_msr_cashback_12m, and leaves at least
      min_points_balance_for_cashback points. A donation (donation_redemption_enabled) gives
      cashback_per_block_usd per block to a partner charity, plus donation_match_pct of it from
      Paloma. Airtime credit (airtime_redemption_enabled) gives airtime_per_block_usd per block to a
      Mobile Top-Up destination. No more than max_redemptions_30d redemptions are made within
      rewards_msr_redemptions_30d including the new one. A redemption cannot be reversed once paid.
    eligibility:
      - id: membership_active
        applies_to: [rewards_points_redeemed]
        kind: state
        condition: "Points are redeemed only while the membership is active"
        evidence_fields: [rewards_memberships.rewards_membership_id, rewards_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [rewards_memberships.rewards_membership_id]
          action_bindings:
            rewards_memberships.rewards_membership_id: rewards_membership_id
        state_contract:
          field: rewards_memberships.status
          allowed: [active]
      - id: redemption_frequency
        applies_to: [rewards_points_redeemed]
        kind: authorization
        condition: "No more than max_redemptions_30d redemptions are made within rewards_msr_redemptions_30d including the new one."
