# Paloma Remit — product charter: Paloma Top-Up & Bill Pay.
# Customers pay for things back home directly instead of sending cash: prepaid airtime and data for
# a relative's phone, prepaid electricity tokens, and bills of utilities, pay-TV providers and
# schools. Each order is one holding: one product, one destination (phone number, meter number or
# biller account), one value in local currency, paid by the customer in USD. Orders are delivered by
# the operator or biller in minutes (top-ups, tokens) or posted within business days (bills); they
# can fail, be retried or corrected, be disputed, and be refunded under this charter. Top-ups and
# bill payments are not remittance transfers and carry no Regulation E remittance rights.

category: topup
display_name: Paloma Top-Up & Bill Pay

binding:
  holding_table: topup_orders
  event_tables: [topup_ledger, topup_cases]
  status_field: status
  variant_field: variant_name
  quantity_fields: {principal_held_usd: order_funds, fees_held_usd: fees_held}

lifecycle:
  states: [submitted, processing, delivered, failed, cancelled, refunded]
  transitions:
    - {from: submitted, to: processing, by: system, means: "Payment is collected, the destination is validated and the order is sent to the operator or biller."}
    - {from: submitted, to: cancelled, by: user, means: "The customer cancels a bill payment before it is sent to the biller."}
    - {from: processing, to: delivered, by: system, means: "The operator confirms the top-up or token, or the biller confirms the payment posted."}
    - {from: processing, to: failed, by: system, means: "The operator or biller rejects the order after any automatic retries and its value comes back to Paloma."}
    - {from: failed, to: processing, by: agent, means: "A failed order is sent again at the customer's request, to the same or a corrected destination."}
    - {from: failed, to: refunded, by: agent, means: "The value and fees of a failed order are refunded."}
    - {from: cancelled, to: refunded, by: agent, means: "The payment for a cancelled order is refunded."}
    - {from: delivered, to: refunded, by: agent, means: "A dispute is upheld on an order recorded as delivered and the customer is refunded."}

accounts:
  - key: order_funds
    unit: USD
    meaning: "USD value of the order Paloma holds: payment collected and reversed values in; value sent to the operator or biller and refunds out."
  - key: fees_held
    unit: USD
    meaning: "Service and card fees Paloma holds on the order: fee charges in, fee refunds out."

parameter_schema:
  corridors_served: "Corridors where this product can be ordered (list)."
  operators_by_corridor: "Operators or billers Paloma pays for this product in each corridor (mapping corridor -> list)."
  denomination_type: "fixed (choose one of fixed_denominations_usd) or open_range (any value between min and max)."
  fixed_denominations_usd: "Values (USD) offered when denomination_type is fixed (list; empty for open_range)."
  min_value_usd: "Smallest order value (USD)."
  max_value_usd: "Largest order value (USD)."
  service_fee_usd: "Flat service fee (USD) per order."
  service_fee_pct: "Service fee as a percentage of the order value, added to the flat fee (percent)."
  fx_margin_pct: "Exchange-rate margin below mid-market used to convert the local value (percent)."
  funding_methods_allowed: "Ways the customer may pay (list)."
  credit_card_fee_pct: "Card funding fee as a percentage of the order value for credit-card payment (percent; 0 when not accepted or free)."
  max_orders_per_destination_24h: "Most orders of this product to one destination in a rolling 24 hours (count)."
  max_orders_per_customer_30d: "Most orders of this product per customer in a rolling 30 calendar days (count)."
  max_value_per_customer_30d_usd: "Most order value (USD) of this product per customer in a rolling 30 calendar days."
  duplicate_order_window_hours: "Hours within which a second order with the same destination and value is treated as a duplicate and not placed."
  delivery_sla_minutes: "Minutes within which a top-up or token is delivered after submission (0 = not applicable)."
  posting_business_days: "Paloma business days within which a bill payment posts to the biller (0 = not applicable)."
  biller_submission_cutoff_ct: "Latest US Central time on a business day for submission to the biller that day (HH:MM, or 24x7)."
  cancel_before_submission_allowed: "Whether the customer may cancel before the order is sent to the biller (boolean)."
  auto_retry_attempts: "Automatic re-sends after a technical failure before the order is failed (count)."
  auto_retry_interval_minutes: "Minutes between automatic re-sends."
  customer_retries_allowed: "Customer-requested retries of a failed order (count)."
  retry_fee_usd: "Fee (USD) per customer-requested retry."
  destination_correction_allowed: "Whether the destination of a failed order may be corrected before retry (boolean)."
  max_destination_corrections: "Most destination corrections per order (count)."
  failed_refund_business_days: "Paloma business days within which a failed or cancelled order is refunded once refund is due."
  failed_auto_refund_days: "Calendar days after failure after which a failed order not retried is refunded automatically."
  fee_refund_on_failure: "Whether fees are refunded when a failed order is refunded (boolean)."
  refundable_after_delivery: "Whether a delivered order can be refunded other than through an upheld dispute (boolean)."
  dispute_window_days: "Calendar days after delivered_at within which a dispute may be filed."
  dispute_investigation_days: "Calendar days after a dispute within which Paloma decides it."
  account_number_validation: "Whether the destination account or meter number is validated with the biller before submission (boolean)."
  holder_name_required: "Whether the destination holder's name must be given (boolean)."
  token_delivered: "Whether delivery produces a token code that is sent to the customer (boolean)."
  token_resend_limit: "Most re-sends of a token code to the customer (count)."
  token_digits: "Digits in a delivered token code (count; 0 = no token)."
  min_account_level: "Lowest Personal Sender Account level (official name) that may order this product."
  rewards_eligible: "Whether a delivered order can earn Paloma Rewards points (boolean)."
  late_posting_fee_refund: "Whether the service fee is refunded when a bill posts later than posting_business_days (boolean)."
  partial_payment_allowed: "Whether less than the bill's amount due may be paid (boolean)."
  overpayment_allowed: "Whether more than the bill's amount due may be paid (boolean)."
  bill_lookup_required: "Whether the amount due is looked up from the biller before payment (boolean)."
  weekend_processing: "Whether orders are processed on weekends and holidays (boolean)."
  new_destination_hold_minutes: "Minutes a first order to a new destination is held for screening (minutes)."
  new_destination_limit_usd: "Largest value (USD) of a first order to a new destination."
  data_validity_days: "Days a data bundle stays usable after delivery (days; 0 = not applicable)."
  student_reference_required: "Whether a student reference number must be given (boolean)."
  business_use_allowed: "Whether orders may be paid from a Paloma Business account (boolean)."

