events:
  - type: topup_ordered
    target: topup_orders
    mutation: create
    meaning: "The customer orders and pays for a top-up, token or bill payment."
    grain: "One row per order."
    fields:
      customer_id: "The ordering customer."
      sender_account_id: "Personal Sender Account the order is placed under."
      variant_name: "Product ordered."
      corridor: "Destination corridor."
      operator: "Operator or biller paid."
      destination_number: "Phone, meter or biller account number, exactly as the customer gives it."
      destination_holder_name: "Name on the destination account, or the student's name; empty when not required."
      student_reference: "Student reference for school fees; empty otherwise."
      order_reference: "Order reference shown on the customer's receipt."
      face_value_local: "Value delivered in local currency."
      principal_usd: "USD value of the order."
      service_fee_usd: "Service fee charged."
      card_fee_usd: "Credit-card funding fee charged; 0.00 when none."
      fx_rate: "Rate used to convert the local value."
      funding_method: "How the customer paid."
      ordered_at: "Moment of the order."
    triggers:
      - event: topup:topup_payment_collected
        map: {amount_usd: principal_usd}
      - event: topup:topup_fee_charged
        when: {service_fee_usd: {not: 0.0}}
        map: {fee_type: service_fee, amount_usd: service_fee_usd}
      - event: topup:topup_fee_charged
        when: {funding_method: credit_card, card_fee_usd: {not: 0.0}}
        map: {fee_type: card_funding_fee, amount_usd: card_fee_usd}
  - type: topup_submitted
    target: topup_orders
    mutation: {transition: {from: submitted, to: processing}}
    meaning: "The order is validated and sent to the operator or biller."
    grain: "One row per first submission."
    fields:
      submitted_at: "Moment the order was sent."
    triggers:
      - event: topup:topup_value_sent
        map: {attempt: 1}
  - type: topup_delivered
    target: topup_orders
    mutation: {transition: {from: processing, to: delivered}}
    meaning: "The operator confirms the top-up or token, or the biller confirms the payment posted."
    grain: "One row per delivery."
    fields:
      delivered_at: "Moment of confirmation."
      delivery_token: "Electricity token code; empty for other products."
      closed_date: "Date part of delivered_at."
    triggers:
      - event: rewards:rewards_points_earned
        map: {source_transfer_id: topup_order_id, source_category: topup}
  - type: topup_failed_marked
    target: topup_orders
    mutation: {transition: {from: processing, to: failed}}
    meaning: "The operator or biller rejects the order after any automatic retries."
    grain: "One row per failure."
    fields:
      failed_at: "Moment the failure was confirmed."
    triggers: []
  - type: topup_retried
    target: topup_orders
    mutation: {transition: {from: failed, to: processing}}
    meaning: "A failed order is sent again at the customer's request."
    grain: "One row per customer retry."
    fields:
      retry_count: "Customer retries on the order including this one."
      submitted_at: "Moment the retry was sent."
    triggers:
      - event: topup:topup_value_sent
        map: {}
  - type: topup_cancelled
    target: topup_orders
    mutation: {transition: {from: submitted, to: cancelled}}
    meaning: "The customer cancels a bill payment before it is sent to the biller."
    grain: "One row per cancellation."
    fields:
      cancelled_at: "Moment of cancellation."
    triggers: []
  - type: topup_refunded
    target: topup_orders
    mutation: {transition: [{from: failed, to: refunded}, {from: cancelled, to: refunded}, {from: delivered, to: refunded}]}
    meaning: "The order's money is refunded and the order is closed."
    grain: "One row per closing refund."
    fields:
      closed_date: "Date of the refund."
    triggers: []
  - type: topup_destination_corrected
    target: topup_orders
    mutation: update
    meaning: "The destination of a failed order is replaced by a corrected number."
    grain: "One row per correction."
    fields:
      destination_number: "Corrected destination, exactly as the customer gives it."
    triggers: []
  - type: topup_payment_collected
    target: topup_ledger
    meaning: "The customer's payment for the order value is collected."
    grain: "One row per order."
    distinguish_by: [entry_date]
    fields:
      amount_usd: "Order value collected (positive)."
      entry_date: "Date collected."
    account: order_funds
    direction: in
    triggers: []
  - type: topup_fee_charged
    target: topup_ledger
    meaning: "A service fee, card funding fee or retry fee is collected."
    grain: "One row per fee type per attempt."
    distinguish_by: [fee_type, attempt]
    fields:
      fee_type: "Kind of fee."
      amount_usd: "Fee collected (positive)."
      attempt: "1 for order fees; the retry's attempt number for a retry fee."
      entry_date: "Date collected."
    account: fees_held
    direction: in
    triggers: []
  - type: topup_fee_refunded
    target: topup_ledger
    meaning: "A collected fee is refunded."
    grain: "One row per refunded fee charge."
    distinguish_by: [related_entry_id]
    fields:
      related_entry_id: "topup_entry_id of the fee charge refunded."
      amount_usd: "Amount refunded (positive)."
      fee_refund_reason: "Why the fee is refunded."
      entry_date: "Date refunded."
    account: fees_held
    direction: out
    triggers: []
  - type: topup_value_sent
    target: topup_ledger
    meaning: "The order value is paid to the operator or biller."
    grain: "One row per attempt."
    distinguish_by: [attempt]
    fields:
      amount_usd: "USD value sent (positive)."
      attempt: "1 for the first submission, 2 for a customer retry."
      entry_date: "Date sent."
    account: order_funds
    direction: out
    triggers: []
  - type: topup_value_reversed
    target: topup_ledger
    meaning: "The operator or biller rejects an attempt and its value comes back in full."
    grain: "One row per failed attempt."
    distinguish_by: [attempt]
    fields:
      amount_usd: "USD value back (positive)."
      failure_reason: "Why the attempt was rejected."
      attempt: "The attempt rejected."
      entry_date: "Date of the rejection."
    account: order_funds
    direction: in
    triggers:
      - event: topup:topup_failed_marked
        map: {}
  - type: topup_refund_issued
    target: topup_ledger
    meaning: "The order value owed back is refunded to the original payment method."
    grain: "One row per refund basis."
    distinguish_by: [refund_basis]
    fields:
      amount_usd: "Value refunded (positive)."
      refund_basis: "Why the refund is owed."
      entry_date: "Date refunded."
    account: order_funds
    direction: out
    triggers:
      - event: topup:topup_refunded
        map: {closed_date: entry_date}
  - type: topup_destination_correction_logged
    target: topup_cases
    meaning: "The customer gives a corrected destination for a failed order."
    grain: "One row per correction."
    distinguish_by: [correction_seq]
    fields:
      corrected_destination: "Corrected number, exactly as the customer gives it."
      correction_seq: "1 for the first correction on the order."
      case_date: "Date logged."
    triggers:
      - event: topup:topup_destination_corrected
        map: {destination_number: corrected_destination}
  - type: topup_token_resent
    target: topup_cases
    meaning: "A delivered electricity token code is sent to the customer again."
    grain: "One row per re-send."
    distinguish_by: [resend_seq]
    fields:
      resend_seq: "1 for the first re-send, and so on."
      case_date: "Date re-sent."
    triggers: []
  - type: topup_dispute_filed
    target: topup_cases
    meaning: "The customer disputes an order recorded as delivered."
    grain: "One row per dispute."
    distinguish_by: [case_type, case_date]
    fields:
      case_type: "What the customer says went wrong."
      case_date: "Date filed."
      resolution_due_date: "Last day for Paloma's decision."
    triggers: []
  - type: topup_dispute_decided
    target: topup_cases
    meaning: "Paloma records its finding on a dispute after checking with the operator or biller."
    grain: "One row per decision."
    distinguish_by: [related_case_id]
    fields:
      related_case_id: "case id of the dispute."
      case_outcome: "upheld or rejected."
      case_date: "Date decided."
    triggers:
      - event: topup:topup_refund_issued
        when: {case_outcome: upheld}
        map: {refund_basis: dispute_upheld}

measures:
  - id: topup_msr_destination_orders_24h
    window: "Rolling 24 hours ending at frozen_time."
    measure: "Count of topup_orders of the same product and destination_number, excluding status cancelled or refunded."
  - id: topup_msr_customer_orders_30d
    window: "Rolling 30 calendar days ending on the handling date."
    measure: "Count of the customer's topup_orders of the same product, excluding status cancelled or refunded."
  - id: topup_msr_customer_value_30d
    window: "Rolling 30 calendar days ending on the handling date."
    measure: "Sum of principal_usd over the same orders."
  - id: topup_msr_corrections
    window: "The life of one order."
    measure: "Count of topup_destination_correction_logged rows on the order."
  - id: topup_msr_token_resends
    window: "The life of one order."
    measure: "Count of topup_token_resent rows on the order."

policies:
  - id: topup_agg_multi_holding
    subject: [topup_ordered]
    rule: >-
      A customer may place any number of orders; each order is its own holding with its own
      reference, value, destination, delivery and refund, and orders are never merged or netted.
      What bounds them is topup_agg_order_caps. Order values never count toward personal sending
      limits.
    eligibility: []
    params:
      max_per_customer: null

  - id: topup_agg_order_caps
    subject: [topup_ordered]
    rule: >-
      The orders of one customer are aggregated per product: no more than
      max_orders_per_destination_24h orders to one destination (topup_msr_destination_orders_24h),
      no more than max_orders_per_customer_30d orders (topup_msr_customer_orders_30d) and no more than
      max_value_per_customer_30d_usd of order value (topup_msr_customer_value_30d), each counted
      including the new order and excluding cancelled or refunded orders. A second order of the same
      product, destination and value placed within duplicate_order_window_hours of the first is
      treated as a duplicate and not placed. An order over any cap is not placed.
    eligibility:
      - id: not_a_duplicate
        applies_to: [topup_ordered]
        kind: dedup
        condition: "A second order of the same product, destination and value placed within duplicate_order_window_hours of the first is treated as a duplicate and not placed."
        evidence_fields: [topup_orders.customer_id, topup_orders.destination_number, topup_orders.variant_name, topup_orders.principal_usd, topup_orders.ordered_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [topup_orders.destination_number]
          action_bindings:
            topup_orders.destination_number: destination_number
        dedup_contract:
          table: topup_orders
          mode: separate_record
          object_bindings: {destination_number: destination_number, variant_name: variant_name, principal_usd: principal_usd}
          duplicate_filters: {status: [submitted, processing, delivered]}
          distinct_fields: [ordered_at]
    params:
      per_tier:
        Paloma Airtime Top-Up: {max_orders_per_destination_24h: "=max_orders_per_destination_24h", max_orders_per_customer_30d: "=max_orders_per_customer_30d", max_value_per_customer_30d_usd: "=max_value_per_customer_30d_usd", duplicate_order_window_hours: "=duplicate_order_window_hours"}
        Paloma Data Bundle: {max_orders_per_destination_24h: "=max_orders_per_destination_24h", max_orders_per_customer_30d: "=max_orders_per_customer_30d", max_value_per_customer_30d_usd: "=max_value_per_customer_30d_usd", duplicate_order_window_hours: "=duplicate_order_window_hours"}
        Paloma Electricity Token: {max_orders_per_destination_24h: "=max_orders_per_destination_24h", max_orders_per_customer_30d: "=max_orders_per_customer_30d", max_value_per_customer_30d_usd: "=max_value_per_customer_30d_usd", duplicate_order_window_hours: "=duplicate_order_window_hours"}
        Paloma Bill Pay Utilities: {max_orders_per_destination_24h: "=max_orders_per_destination_24h", max_orders_per_customer_30d: "=max_orders_per_customer_30d", max_value_per_customer_30d_usd: "=max_value_per_customer_30d_usd", duplicate_order_window_hours: "=duplicate_order_window_hours"}
        Paloma Bill Pay Television: {max_orders_per_destination_24h: "=max_orders_per_destination_24h", max_orders_per_customer_30d: "=max_orders_per_customer_30d", max_value_per_customer_30d_usd: "=max_value_per_customer_30d_usd", duplicate_order_window_hours: "=duplicate_order_window_hours"}
        Paloma Bill Pay School Fees: {max_orders_per_destination_24h: "=max_orders_per_destination_24h", max_orders_per_customer_30d: "=max_orders_per_customer_30d", max_value_per_customer_30d_usd: "=max_value_per_customer_30d_usd", duplicate_order_window_hours: "=duplicate_order_window_hours"}
    measures: [topup_msr_destination_orders_24h, topup_msr_customer_orders_30d, topup_msr_customer_value_30d]

  - id: topup_evt_ordering
    subject: [topup_ordered]
    rule: >-
      An order is placed only under the customer's own Personal Sender Account and only while that
      account's status is active; Paloma Business accounts cannot order (business_use_allowed is
      false). The account level must be at or above min_account_level. The corridor must be in
      corridors_served and the operator listed for it in operators_by_corridor. The value must lie
      between min_value_usd and max_value_usd, and be one of fixed_denominations_usd when
      denomination_type is fixed. The destination holder's name is required when
      holder_name_required is true, and a student reference when student_reference_required is true.
      When account_number_validation is true the destination is validated with the biller before
      submission; when bill_lookup_required is true the amount due is fetched first, a lower amount
      is accepted only when partial_payment_allowed is true, and a higher one never
      (overpayment_allowed is false). A first order to a destination the customer has not paid before
      may not exceed new_destination_limit_usd and is held new_destination_hold_minutes before
      submission. Ordering is the customer's own authorisation of payment.
    eligibility:
      - id: sender_account_active
        applies_to: [topup_ordered]
        kind: state
        condition: "An order is placed only under the customer's own Personal Sender Account and only while that account's status is active"
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
        state_contract:
          field: sender_accounts.status
          allowed: [active]
    params:
      per_tier:
        Paloma Airtime Top-Up: {business_use_allowed: "=business_use_allowed", min_account_level: "=min_account_level", corridors_served: "=corridors_served", operators_by_corridor: "=operators_by_corridor", min_value_usd: "=min_value_usd", max_value_usd: "=max_value_usd", denomination_type: "=denomination_type", fixed_denominations_usd: "=fixed_denominations_usd", holder_name_required: "=holder_name_required", student_reference_required: "=student_reference_required", account_number_validation: "=account_number_validation", bill_lookup_required: "=bill_lookup_required", partial_payment_allowed: "=partial_payment_allowed", overpayment_allowed: "=overpayment_allowed", new_destination_limit_usd: "=new_destination_limit_usd", new_destination_hold_minutes: "=new_destination_hold_minutes"}
        Paloma Data Bundle: {business_use_allowed: "=business_use_allowed", min_account_level: "=min_account_level", corridors_served: "=corridors_served", operators_by_corridor: "=operators_by_corridor", min_value_usd: "=min_value_usd", max_value_usd: "=max_value_usd", denomination_type: "=denomination_type", fixed_denominations_usd: "=fixed_denominations_usd", holder_name_required: "=holder_name_required", student_reference_required: "=student_reference_required", account_number_validation: "=account_number_validation", bill_lookup_required: "=bill_lookup_required", partial_payment_allowed: "=partial_payment_allowed", overpayment_allowed: "=overpayment_allowed", new_destination_limit_usd: "=new_destination_limit_usd", new_destination_hold_minutes: "=new_destination_hold_minutes"}
        Paloma Electricity Token: {business_use_allowed: "=business_use_allowed", min_account_level: "=min_account_level", corridors_served: "=corridors_served", operators_by_corridor: "=operators_by_corridor", min_value_usd: "=min_value_usd", max_value_usd: "=max_value_usd", denomination_type: "=denomination_type", fixed_denominations_usd: "=fixed_denominations_usd", holder_name_required: "=holder_name_required", student_reference_required: "=student_reference_required", account_number_validation: "=account_number_validation", bill_lookup_required: "=bill_lookup_required", partial_payment_allowed: "=partial_payment_allowed", overpayment_allowed: "=overpayment_allowed", new_destination_limit_usd: "=new_destination_limit_usd", new_destination_hold_minutes: "=new_destination_hold_minutes"}
        Paloma Bill Pay Utilities: {business_use_allowed: "=business_use_allowed", min_account_level: "=min_account_level", corridors_served: "=corridors_served", operators_by_corridor: "=operators_by_corridor", min_value_usd: "=min_value_usd", max_value_usd: "=max_value_usd", denomination_type: "=denomination_type", fixed_denominations_usd: "=fixed_denominations_usd", holder_name_required: "=holder_name_required", student_reference_required: "=student_reference_required", account_number_validation: "=account_number_validation", bill_lookup_required: "=bill_lookup_required", partial_payment_allowed: "=partial_payment_allowed", overpayment_allowed: "=overpayment_allowed", new_destination_limit_usd: "=new_destination_limit_usd", new_destination_hold_minutes: "=new_destination_hold_minutes"}
        Paloma Bill Pay Television: {business_use_allowed: "=business_use_allowed", min_account_level: "=min_account_level", corridors_served: "=corridors_served", operators_by_corridor: "=operators_by_corridor", min_value_usd: "=min_value_usd", max_value_usd: "=max_value_usd", denomination_type: "=denomination_type", fixed_denominations_usd: "=fixed_denominations_usd", holder_name_required: "=holder_name_required", student_reference_required: "=student_reference_required", account_number_validation: "=account_number_validation", bill_lookup_required: "=bill_lookup_required", partial_payment_allowed: "=partial_payment_allowed", overpayment_allowed: "=overpayment_allowed", new_destination_limit_usd: "=new_destination_limit_usd", new_destination_hold_minutes: "=new_destination_hold_minutes"}
        Paloma Bill Pay School Fees: {business_use_allowed: "=business_use_allowed", min_account_level: "=min_account_level", corridors_served: "=corridors_served", operators_by_corridor: "=operators_by_corridor", min_value_usd: "=min_value_usd", max_value_usd: "=max_value_usd", denomination_type: "=denomination_type", fixed_denominations_usd: "=fixed_denominations_usd", holder_name_required: "=holder_name_required", student_reference_required: "=student_reference_required", account_number_validation: "=account_number_validation", bill_lookup_required: "=bill_lookup_required", partial_payment_allowed: "=partial_payment_allowed", overpayment_allowed: "=overpayment_allowed", new_destination_limit_usd: "=new_destination_limit_usd", new_destination_hold_minutes: "=new_destination_hold_minutes"}

  - id: topup_evt_pricing
    subject: [topup_ordered, topup_payment_collected, topup_fee_charged]
    rule: >-
      The service fee is service_fee_usd plus service_fee_pct of the order value, rounded half up to
      the cent. A credit-card payment adds credit_card_fee_pct of the order value as card_funding_fee.
      The local value delivered is the order value times the corridor's mid_market_rate in the
      Paloma rate sheet for the order date times one minus fx_margin_pct over 100, rounded half up
      to 2 decimals (whole units for VND). Payment must use one of funding_methods_allowed. A retry
      carries retry_fee_usd when above 0.00. Prices never change after the order is placed.
    eligibility: []
    params:
      per_tier:
        Paloma Airtime Top-Up: {service_fee_usd: "=service_fee_usd", service_fee_pct: "=service_fee_pct", credit_card_fee_pct: "=credit_card_fee_pct", fx_margin_pct: "=fx_margin_pct", funding_methods_allowed: "=funding_methods_allowed", retry_fee_usd: "=retry_fee_usd"}
        Paloma Data Bundle: {service_fee_usd: "=service_fee_usd", service_fee_pct: "=service_fee_pct", credit_card_fee_pct: "=credit_card_fee_pct", fx_margin_pct: "=fx_margin_pct", funding_methods_allowed: "=funding_methods_allowed", retry_fee_usd: "=retry_fee_usd"}
        Paloma Electricity Token: {service_fee_usd: "=service_fee_usd", service_fee_pct: "=service_fee_pct", credit_card_fee_pct: "=credit_card_fee_pct", fx_margin_pct: "=fx_margin_pct", funding_methods_allowed: "=funding_methods_allowed", retry_fee_usd: "=retry_fee_usd"}
        Paloma Bill Pay Utilities: {service_fee_usd: "=service_fee_usd", service_fee_pct: "=service_fee_pct", credit_card_fee_pct: "=credit_card_fee_pct", fx_margin_pct: "=fx_margin_pct", funding_methods_allowed: "=funding_methods_allowed", retry_fee_usd: "=retry_fee_usd"}
        Paloma Bill Pay Television: {service_fee_usd: "=service_fee_usd", service_fee_pct: "=service_fee_pct", credit_card_fee_pct: "=credit_card_fee_pct", fx_margin_pct: "=fx_margin_pct", funding_methods_allowed: "=funding_methods_allowed", retry_fee_usd: "=retry_fee_usd"}
        Paloma Bill Pay School Fees: {service_fee_usd: "=service_fee_usd", service_fee_pct: "=service_fee_pct", credit_card_fee_pct: "=credit_card_fee_pct", fx_margin_pct: "=fx_margin_pct", funding_methods_allowed: "=funding_methods_allowed", retry_fee_usd: "=retry_fee_usd"}
    formula:
      service_fee: "round(service_fee_usd + principal_usd * service_fee_pct / 100, 2)"

  - id: topup_evt_delivery
    subject: [topup_submitted, topup_value_sent, topup_delivered, topup_value_reversed, topup_failed_marked]
    rule: >-
      A top-up or token is submitted at once (every day when weekend_processing is true) and is due
      within delivery_sla_minutes; a bill payment is submitted on the business day it is ordered when
      ordered by biller_submission_cutoff_ct, otherwise the next business day, and posts within
      posting_business_days Paloma business days. A technical rejection is re-sent up to
      auto_retry_attempts times, auto_retry_interval_minutes apart; any other rejection (invalid
      number, account not found, amount out of range) fails the order at once and its value comes
      back in full. A delivered token is sent to the customer by SMS and email, with token_digits
      digits. A delivered data bundle is usable for data_validity_days days. Delivered orders earn
      Paloma Rewards points when rewards_eligible is true, under the rewards charter.
    eligibility: []
    params:
      per_tier:
        Paloma Airtime Top-Up: {weekend_processing: "=weekend_processing", delivery_sla_minutes: "=delivery_sla_minutes", biller_submission_cutoff_ct: "=biller_submission_cutoff_ct", posting_business_days: "=posting_business_days", auto_retry_attempts: "=auto_retry_attempts", auto_retry_interval_minutes: "=auto_retry_interval_minutes", token_digits: "=token_digits", data_validity_days: "=data_validity_days", rewards_eligible: "=rewards_eligible", token_delivered: "=token_delivered"}
        Paloma Data Bundle: {weekend_processing: "=weekend_processing", delivery_sla_minutes: "=delivery_sla_minutes", biller_submission_cutoff_ct: "=biller_submission_cutoff_ct", posting_business_days: "=posting_business_days", auto_retry_attempts: "=auto_retry_attempts", auto_retry_interval_minutes: "=auto_retry_interval_minutes", token_digits: "=token_digits", data_validity_days: "=data_validity_days", rewards_eligible: "=rewards_eligible", token_delivered: "=token_delivered"}
        Paloma Electricity Token: {weekend_processing: "=weekend_processing", delivery_sla_minutes: "=delivery_sla_minutes", biller_submission_cutoff_ct: "=biller_submission_cutoff_ct", posting_business_days: "=posting_business_days", auto_retry_attempts: "=auto_retry_attempts", auto_retry_interval_minutes: "=auto_retry_interval_minutes", token_digits: "=token_digits", data_validity_days: "=data_validity_days", rewards_eligible: "=rewards_eligible", token_delivered: "=token_delivered"}
        Paloma Bill Pay Utilities: {weekend_processing: "=weekend_processing", delivery_sla_minutes: "=delivery_sla_minutes", biller_submission_cutoff_ct: "=biller_submission_cutoff_ct", posting_business_days: "=posting_business_days", auto_retry_attempts: "=auto_retry_attempts", auto_retry_interval_minutes: "=auto_retry_interval_minutes", token_digits: "=token_digits", data_validity_days: "=data_validity_days", rewards_eligible: "=rewards_eligible", token_delivered: "=token_delivered"}
        Paloma Bill Pay Television: {weekend_processing: "=weekend_processing", delivery_sla_minutes: "=delivery_sla_minutes", biller_submission_cutoff_ct: "=biller_submission_cutoff_ct", posting_business_days: "=posting_business_days", auto_retry_attempts: "=auto_retry_attempts", auto_retry_interval_minutes: "=auto_retry_interval_minutes", token_digits: "=token_digits", data_validity_days: "=data_validity_days", rewards_eligible: "=rewards_eligible", token_delivered: "=token_delivered"}
        Paloma Bill Pay School Fees: {weekend_processing: "=weekend_processing", delivery_sla_minutes: "=delivery_sla_minutes", biller_submission_cutoff_ct: "=biller_submission_cutoff_ct", posting_business_days: "=posting_business_days", auto_retry_attempts: "=auto_retry_attempts", auto_retry_interval_minutes: "=auto_retry_interval_minutes", token_digits: "=token_digits", data_validity_days: "=data_validity_days", rewards_eligible: "=rewards_eligible", token_delivered: "=token_delivered"}

  - id: topup_evt_failure_handling
    subject: [topup_retried, topup_destination_correction_logged, topup_destination_corrected, topup_fee_charged]
    rule: >-
      A failed order may be retried at the customer's request at most customer_retries_allowed times.
      A destination can be corrected only while the order is failed, only when
      destination_correction_allowed is true, and at most max_destination_corrections times
      (topup_msr_corrections); the corrected number is recorded exactly as the customer gives it and
      is validated again when account_number_validation is true. A retry or correction is accepted
      only within failed_auto_refund_days calendar days after the order failed. The window is counted
      in calendar days from the date part of failed_at, and an instruction on the last day is on
      time. After that window, or when no retry is requested, the order is refunded under
      topup_evt_refunds.
    eligibility:
      - id: failed_only
        applies_to: [topup_destination_correction_logged]
        kind: state
        condition: "A destination can be corrected only while the order is failed"
        evidence_fields: [topup_orders.topup_order_id, topup_orders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [topup_orders.topup_order_id]
          action_bindings:
            topup_orders.topup_order_id: topup_order_id
        state_contract:
          field: topup_orders.status
          allowed: [failed]
      - id: retry_window
        applies_to: [topup_retried, topup_destination_correction_logged]
        kind: time
        condition: "A retry or correction is accepted only within failed_auto_refund_days calendar days after the order failed."
        evidence_fields: [topup_orders.topup_order_id, topup_orders.failed_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [topup_orders.topup_order_id]
          action_bindings:
            topup_orders.topup_order_id: topup_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the order failed"
          anchor_source: topup_orders.failed_at
          relation: not_after
          duration_source: variants.failed_auto_refund_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days from the date part of failed_at, and an instruction on the last day is on time."
          boundary: inclusive
    params:
      per_tier:
        Paloma Airtime Top-Up: {customer_retries_allowed: "=customer_retries_allowed", destination_correction_allowed: "=destination_correction_allowed", max_destination_corrections: "=max_destination_corrections", failed_auto_refund_days: "=failed_auto_refund_days", account_number_validation: "=account_number_validation"}
        Paloma Data Bundle: {customer_retries_allowed: "=customer_retries_allowed", destination_correction_allowed: "=destination_correction_allowed", max_destination_corrections: "=max_destination_corrections", failed_auto_refund_days: "=failed_auto_refund_days", account_number_validation: "=account_number_validation"}
        Paloma Electricity Token: {customer_retries_allowed: "=customer_retries_allowed", destination_correction_allowed: "=destination_correction_allowed", max_destination_corrections: "=max_destination_corrections", failed_auto_refund_days: "=failed_auto_refund_days", account_number_validation: "=account_number_validation"}
        Paloma Bill Pay Utilities: {customer_retries_allowed: "=customer_retries_allowed", destination_correction_allowed: "=destination_correction_allowed", max_destination_corrections: "=max_destination_corrections", failed_auto_refund_days: "=failed_auto_refund_days", account_number_validation: "=account_number_validation"}
        Paloma Bill Pay Television: {customer_retries_allowed: "=customer_retries_allowed", destination_correction_allowed: "=destination_correction_allowed", max_destination_corrections: "=max_destination_corrections", failed_auto_refund_days: "=failed_auto_refund_days", account_number_validation: "=account_number_validation"}
        Paloma Bill Pay School Fees: {customer_retries_allowed: "=customer_retries_allowed", destination_correction_allowed: "=destination_correction_allowed", max_destination_corrections: "=max_destination_corrections", failed_auto_refund_days: "=failed_auto_refund_days", account_number_validation: "=account_number_validation"}
    measures: [topup_msr_corrections]

  - id: topup_evt_cancellation
    subject: [topup_cancelled]
    rule: >-
      Only the customer cancels an order, and only when cancel_before_submission_allowed is true and
      the order is still submitted (not yet sent to the biller). Top-ups, data bundles and tokens are
      sent at once and cannot be cancelled. A cancelled order is refunded in full, fees included,
      under topup_evt_refunds.
    eligibility:
      - id: product_cancellable
        applies_to: [topup_cancelled]
        kind: authorization
        condition: "Only the customer cancels an order, and only when cancel_before_submission_allowed is true and the order is still submitted (not yet sent to the biller)."
        evidence_fields: [topup_orders.topup_order_id, topup_orders.variant_name, topup_orders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [topup_orders.topup_order_id]
          action_bindings:
            topup_orders.topup_order_id: topup_order_id
    params:
      per_tier:
        Paloma Airtime Top-Up: {cancel_before_submission_allowed: "=cancel_before_submission_allowed"}
        Paloma Data Bundle: {cancel_before_submission_allowed: "=cancel_before_submission_allowed"}
        Paloma Electricity Token: {cancel_before_submission_allowed: "=cancel_before_submission_allowed"}
        Paloma Bill Pay Utilities: {cancel_before_submission_allowed: "=cancel_before_submission_allowed"}
        Paloma Bill Pay Television: {cancel_before_submission_allowed: "=cancel_before_submission_allowed"}
        Paloma Bill Pay School Fees: {cancel_before_submission_allowed: "=cancel_before_submission_allowed"}

  - id: topup_evt_refunds
    subject: [topup_refund_issued, topup_refunded, topup_fee_refunded]
    rule: >-
      The order value is refunded only on an order whose status is failed, cancelled or delivered,
      and on a delivered order only through an upheld dispute, because refundable_after_delivery is
      false. A failed order is refunded when the customer asks or failed_auto_refund_days after it
      failed, with fees refunded when fee_refund_on_failure is true (fee_refund_reason
      order_failed); a cancelled order is refunded in full (fee_refund_reason order_cancelled). A
      refund is issued within failed_refund_business_days Paloma business days of becoming due, to
      the original payment method. A bill that posts later than posting_business_days has its service
      fee refunded when late_posting_fee_refund is true (fee_refund_reason late_posting), without
      refunding the bill. Each refund basis is paid once.
    eligibility:
      - id: refundable_status
        applies_to: [topup_refund_issued]
        kind: state
        condition: "The order value is refunded only on an order whose status is failed, cancelled or delivered, and on a delivered order only through an upheld dispute"
        evidence_fields: [topup_orders.topup_order_id, topup_orders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [topup_orders.topup_order_id]
          action_bindings:
            topup_orders.topup_order_id: topup_order_id
        state_contract:
          field: topup_orders.status
          allowed: [failed, cancelled, delivered]
    params:
      per_tier:
        Paloma Airtime Top-Up: {refundable_after_delivery: "=refundable_after_delivery", failed_auto_refund_days: "=failed_auto_refund_days", fee_refund_on_failure: "=fee_refund_on_failure", failed_refund_business_days: "=failed_refund_business_days", posting_business_days: "=posting_business_days", late_posting_fee_refund: "=late_posting_fee_refund"}
        Paloma Data Bundle: {refundable_after_delivery: "=refundable_after_delivery", failed_auto_refund_days: "=failed_auto_refund_days", fee_refund_on_failure: "=fee_refund_on_failure", failed_refund_business_days: "=failed_refund_business_days", posting_business_days: "=posting_business_days", late_posting_fee_refund: "=late_posting_fee_refund"}
        Paloma Electricity Token: {refundable_after_delivery: "=refundable_after_delivery", failed_auto_refund_days: "=failed_auto_refund_days", fee_refund_on_failure: "=fee_refund_on_failure", failed_refund_business_days: "=failed_refund_business_days", posting_business_days: "=posting_business_days", late_posting_fee_refund: "=late_posting_fee_refund"}
        Paloma Bill Pay Utilities: {refundable_after_delivery: "=refundable_after_delivery", failed_auto_refund_days: "=failed_auto_refund_days", fee_refund_on_failure: "=fee_refund_on_failure", failed_refund_business_days: "=failed_refund_business_days", posting_business_days: "=posting_business_days", late_posting_fee_refund: "=late_posting_fee_refund"}
        Paloma Bill Pay Television: {refundable_after_delivery: "=refundable_after_delivery", failed_auto_refund_days: "=failed_auto_refund_days", fee_refund_on_failure: "=fee_refund_on_failure", failed_refund_business_days: "=failed_refund_business_days", posting_business_days: "=posting_business_days", late_posting_fee_refund: "=late_posting_fee_refund"}
        Paloma Bill Pay School Fees: {refundable_after_delivery: "=refundable_after_delivery", failed_auto_refund_days: "=failed_auto_refund_days", fee_refund_on_failure: "=fee_refund_on_failure", failed_refund_business_days: "=failed_refund_business_days", posting_business_days: "=posting_business_days", late_posting_fee_refund: "=late_posting_fee_refund"}

  - id: topup_evt_disputes
    subject: [topup_dispute_filed, topup_dispute_decided, topup_token_resent]
    rule: >-
      A customer may dispute an order recorded as delivered when the destination says it was not
      credited, the amount was wrong, a token does not work, or a bill shows unpaid. A dispute can be
      filed only within dispute_window_days calendar days after the order was delivered. The window
      is counted in calendar days from the date part of delivered_at, and a dispute on the last day
      is on time. Only one dispute per order. Paloma checks with the operator or biller and decides
      within dispute_investigation_days calendar days: upheld refunds the order value and fees,
      rejected leaves the order delivered. Before a token dispute, the token is re-sent to the
      customer up to token_resend_limit times (topup_msr_token_resends) when token_delivered is true.
    eligibility:
      - id: dispute_window
        applies_to: [topup_dispute_filed]
        kind: time
        condition: "A dispute can be filed only within dispute_window_days calendar days after the order was delivered."
        evidence_fields: [topup_orders.topup_order_id, topup_orders.delivered_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [topup_orders.topup_order_id]
          action_bindings:
            topup_orders.topup_order_id: topup_order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the order was delivered"
          anchor_source: topup_orders.delivered_at
          relation: not_after
          duration_source: variants.dispute_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days from the date part of delivered_at, and a dispute on the last day is on time."
          boundary: inclusive
      - id: one_dispute
        applies_to: [topup_dispute_filed]
        kind: dedup
        condition: "Only one dispute per order."
        evidence_fields: [topup_cases.topup_order_id, topup_cases.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [topup_cases.topup_order_id]
          action_bindings:
            topup_cases.topup_order_id: topup_order_id
        dedup_contract:
          table: topup_cases
          mode: separate_record
          object_bindings: {topup_order_id: topup_order_id}
          duplicate_filters: {event_type: [topup_dispute_filed]}
          distinct_fields: []
    params:
      per_tier:
        Paloma Airtime Top-Up: {dispute_window_days: "=dispute_window_days", dispute_investigation_days: "=dispute_investigation_days", token_resend_limit: "=token_resend_limit", token_delivered: "=token_delivered"}
        Paloma Data Bundle: {dispute_window_days: "=dispute_window_days", dispute_investigation_days: "=dispute_investigation_days", token_resend_limit: "=token_resend_limit", token_delivered: "=token_delivered"}
        Paloma Electricity Token: {dispute_window_days: "=dispute_window_days", dispute_investigation_days: "=dispute_investigation_days", token_resend_limit: "=token_resend_limit", token_delivered: "=token_delivered"}
        Paloma Bill Pay Utilities: {dispute_window_days: "=dispute_window_days", dispute_investigation_days: "=dispute_investigation_days", token_resend_limit: "=token_resend_limit", token_delivered: "=token_delivered"}
        Paloma Bill Pay Television: {dispute_window_days: "=dispute_window_days", dispute_investigation_days: "=dispute_investigation_days", token_resend_limit: "=token_resend_limit", token_delivered: "=token_delivered"}
        Paloma Bill Pay School Fees: {dispute_window_days: "=dispute_window_days", dispute_investigation_days: "=dispute_investigation_days", token_resend_limit: "=token_resend_limit", token_delivered: "=token_delivered"}
    measures: [topup_msr_token_resends]
