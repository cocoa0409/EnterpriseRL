# Paloma Remit — product charter: Cash Pickup transfers.
# Each personal transfer collected in cash by the recipient at a payout location is one holding:
# the transfer order the customer booked, at one Cash Pickup tier, carrying its principal, fee,
# exchange rate (or US-dollar payout), the recipient name the payout is released to, the Paloma
# Pickup Number the recipient quotes, and a pickup window. The tier decides the payout network
# (retail agents, bank branches or cardless ATM), the price, the pickup window and how name
# corrections, expiry, reactivation, cancellations, refunds and error claims are handled. The
# Remittance Transfer Rule (Regulation E, subpart B) governs cancellation, refunds and errors.

category: cash
display_name: Cash Pickup

binding:
  holding_table: cash_transfers
  event_tables: [cash_ledger, cash_cases]
  status_field: status
  variant_field: variant_name
  quantity_fields: {principal_held_usd: principal_held, fees_held_usd: fees_held}

lifecycle:
  states: [awaiting_funds, on_hold, ready_for_pickup, paid_out, expired, cancelled, refunded]
  transitions:
    - {from: awaiting_funds, to: ready_for_pickup, by: system, means: "Funds are collected (or ACH principal is released early), screening passes and the money is made available at the payout network."}
    - {from: awaiting_funds, to: on_hold, by: system, means: "A compliance, funding or new-recipient screening hold is placed before the money is made available."}
    - {from: ready_for_pickup, to: on_hold, by: system, means: "Compliance or repeated refused pickups stop the payout while it is available."}
    - {from: on_hold, to: ready_for_pickup, by: system, means: "Compliance clears the hold and the money is available again with a fresh pickup window."}
    - {from: ready_for_pickup, to: paid_out, by: system, means: "The payout location pays the recipient after checking their ID against the recipient name on the transfer."}
    - {from: ready_for_pickup, to: expired, by: system, means: "The pickup window ends without collection."}
    - {from: expired, to: ready_for_pickup, by: agent, means: "An expired pickup is reactivated at the customer's request for a new pickup window."}
    - {from: paid_out, to: ready_for_pickup, by: agent, means: "After an error resolution found in the customer's favour, the money is made available again at no cost under a new Pickup Number."}
    - {from: awaiting_funds, to: cancelled, by: user, means: "The customer cancels a transfer that has not been made available."}
    - {from: on_hold, to: cancelled, by: user, means: "The customer cancels a held transfer."}
    - {from: ready_for_pickup, to: cancelled, by: user, means: "The customer cancels a transfer that has not been collected."}
    - {from: on_hold, to: cancelled, by: system, means: "Paloma cancels a held transfer whose request for information expired unanswered or that compliance rejected."}
    - {from: awaiting_funds, to: cancelled, by: system, means: "The customer's payment fails or an inbound wire does not arrive in time."}
    - {from: cancelled, to: refunded, by: agent, means: "The collected money owed back on a cancelled transfer is refunded."}
    - {from: expired, to: refunded, by: agent, means: "The money of an expired, uncollected transfer is refunded."}
    - {from: paid_out, to: refunded, by: agent, means: "After an error resolution, Paloma refunds the customer for a transfer recorded as paid out."}

accounts:
  - key: principal_held
    unit: USD
    meaning: "Customer principal Paloma holds for this transfer: collected funds and Paloma make-good credits in; cash paid out and refunds out."
  - key: fees_held
    unit: USD
    meaning: "Fees Paloma has collected on this transfer net of fee refunds: fee charges in, fee refunds out."

parameter_schema:
  funding_methods_allowed: "Funding methods the tier accepts (list); the account level may narrow it further."
  entry_min_account_level: "Lowest Personal Sender Account level (official name) that may book this tier."
  entry_min_completed_transfers: "Fewest completed personal transfers (account_msr_completed_transfers) needed before booking this tier (count)."
  corridors_served: "Corridors where this tier pays out cash (list of corridor codes)."
  payout_network: "Where the recipient collects: retail_agent, bank_branch or atm_cardless."
  min_send_usd: "Smallest principal (USD) per transfer."
  max_send_usd: "Largest principal (USD) per transfer, before the account level's per-transfer limit."
  corridor_cap_usd: "Per-corridor ceiling (USD principal) the payout network can pay in one pickup (mapping corridor -> USD)."
  max_transfers_per_recipient_24h: "Largest number of Cash Pickup transfers to one recipient in a rolling 24 hours (count)."
  fee_ladder: "Transfer fee by principal band: list of {from_usd, to_usd, fee_usd}, inclusive at both ends."
  credit_card_fee_pct: "Card funding fee as a percentage of principal for credit-card funding (percent; 0 when not accepted)."
  debit_card_fee_usd: "Flat fee (USD) added for debit-card funding."
  pay_by_bank_fee_discount_usd: "Amount (USD) taken off the ladder fee for pay-by-bank funding, never below 0.00."
  fx_margin_pct: "Exchange-rate margin below mid-market for local-currency payouts (percent)."
  margin_reduction_threshold_usd: "Principal (USD) at or above which the reduced margin applies."
  margin_reduction_pct_points: "Percentage points taken off fx_margin_pct at or above the threshold."
  rate_lock_hours: "Hours from booked_at for which the quoted rate stays guaranteed while funds are awaited."
  availability_business_days: "Paloma business days from release to the money being available for pickup (0 = within minutes of release)."
  booking_cutoff_ct: "Latest US Central time on a business day for release to count from that day (HH:MM, or 24x7)."
  advance_notice_business_days: "Business days of advance notice the payout branch needs before a large cash payout can be made available (0 = none)."
  weekend_payout: "Whether the payout network pays on Saturdays, Sundays and local holidays (boolean)."
  usd_payout_corridors: "Corridors where the recipient may be paid in US dollars instead of local currency (list)."
  usd_payout_fee_usd: "Fee (USD) added when the payout is in US dollars in a corridor whose local currency is not USD."
  pickup_window_days: "Calendar days, counted from available_date, during which the money can be collected."
  reactivation_window_days: "Calendar days after expiry during which an expired pickup can be reactivated (0 = no reactivation)."
  reactivation_fee_usd: "Fee (USD) for each reactivation of an expired pickup."
  max_reactivations: "Largest number of reactivations on one transfer (count)."
  expiry_fee_refund_pct: "Share of the transfer fee refunded when an expired transfer is refunded (percent)."
  name_correction_max_chars: "Largest number of characters that may differ between the recipient name on the transfer and the corrected name, counted as single-character insertions, deletions or substitutions (count; 0 = no corrections)."
  free_name_corrections: "Name corrections on one transfer that carry no fee (count)."
  name_correction_fee_usd: "Fee (USD) for each name correction beyond the free ones."
  max_name_corrections: "Largest number of name corrections on one transfer (count)."
  refused_pickups_before_hold: "Refused pickup attempts after which the payout is put on hold for screening (count; 0 = not applicable)."
  first_transfer_fee_waived: "Whether the transfer fee is waived on the customer's first-ever personal transfer when booked on this tier (boolean)."
  first_transfer_promo_cap_usd: "Largest principal (USD) a first-transfer promotion covers (USD; 0 = no promotion)."
  first_transfer_promo_margin_pct: "Margin applied to a first transfer covered by the promotion (percent)."
  cancel_full_refund_window_hours: "Elapsed hours after booked_at within which a cancellation refunds principal and every fee in full (the Regulation E 30-minute right, in hours)."
  late_cancel_fee_refund_pct: "Share of each fee refunded when the transfer is cancelled after the full-refund window (percent)."
  ready_cancel_allowed: "Whether a transfer may be cancelled while it is ready for pickup and not yet collected (boolean)."
  refund_business_days: "Paloma business days within which a refund owed must be issued, counted from the day it becomes owed."
  rfi_response_days: "Calendar days to answer a transfer-level request for information before the transfer is cancelled."
  rfi_expiry_fee_refund_pct: "Share of each fee refunded when Paloma cancels a held transfer (percent)."
  hold_review_business_days: "Paloma business days compliance takes to clear a hold once its request for information is answered."
  funding_deadline_hours: "Hours after booked_at within which an inbound wire must arrive (0 = not applicable)."
  on_time_promise: "Whether Paloma refunds the transfer fee when the money is made available after its disclosed date for a reason on Paloma's side (boolean)."
  error_notice_window_days: "Calendar days after the disclosed date_available within which an error notice may be given."
  error_investigation_days: "Calendar days after an error notice within which Paloma must decide it."
  reissue_business_days: "Paloma business days within which money is made available again after the customer chooses re-issue as a remedy."
  purpose_code_corridors: "Corridors where a transfer_purpose must be stated at booking (list)."

