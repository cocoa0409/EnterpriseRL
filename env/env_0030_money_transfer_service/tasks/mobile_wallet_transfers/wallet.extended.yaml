      auto_retry_interval_minutes: 30
      failure_reason_attribution: {wallet_limit_exceeded: sender, wallet_not_registered: sender, wallet_name_mismatch: sender, wallet_number_invalid: sender, wallet_suspended: sender, provider_unavailable: paloma}
      failed_credit_hold_days: 21
      free_retries: 1
      retry_fee_usd: 4.99
      max_retries: 2
      redirect_allowed: true
      redirect_fee_usd: 4.99
      max_redirects: 1
      same_recipient_redirect_only: true
      sender_side_failure_fee_refund_pct: 0
      error_notice_window_days: 180
      error_investigation_days: 90
      recredit_business_days: 2
      purpose_code_corridors: [PH-PHP, KE-KES, BD-BDT]

events:
  # ---- holding writes (wallet_transfers) ----
  - type: wallet_transfer_booked
    target: wallet_transfers
    mutation: create
    meaning: "The customer books and pays for a Mobile Wallet transfer after seeing the pre-payment disclosure."
    grain: "One row per transfer order."
    fields:
      customer_id: "The sending customer."
      sender_account_id: "Personal Sender Account the transfer is booked under."
      recipient_id: "The saved recipient whose wallet is credited."
      variant_name: "The Mobile Wallet tier chosen."
      corridor: "Destination corridor."
      confirmation_number: "Confirmation number on the customer's receipt."
      send_amount_usd: "Principal in USD."
      transfer_fee_usd: "Transfer fee disclosed, after any promotion or pay-by-bank discount."
      card_fee_usd: "Credit-card funding fee disclosed; 0.00 when none."
      fx_rate: "Customer exchange rate locked at booking."
      receive_amount: "Amount credited to the wallet in local currency."
      funding_method: "How the customer pays."
      transfer_purpose: "Stated purpose of the transfer."
      wallet_provider: "Wallet provider credited."
      wallet_number: "Wallet number credited, copied from the saved recipient."
      wallet_holder_name: "Name the wallet must be registered in, copied from the saved recipient."
      booked_at: "Moment the customer authorised payment."
      date_available: "Disclosed date the money will be in the wallet."
    triggers:
      - event: wallet:wallet_funds_received
        when: {funding_method: [debit_card, credit_card, pay_by_bank]}
        map: {amount_usd: send_amount_usd}
      - event: wallet:wallet_fee_charged
        when: {funding_method: [debit_card, credit_card, pay_by_bank], transfer_fee_usd: {not: 0.0}}
        map: {fee_type: transfer_fee, amount_usd: transfer_fee_usd, fee_seq: 1}
      - event: wallet:wallet_fee_charged
        when: {funding_method: credit_card}
        map: {fee_type: card_funding_fee, amount_usd: card_fee_usd, fee_seq: 1}
  - type: wallet_rate_requoted
    target: wallet_transfers
    mutation: update
    meaning: "Funds arrive after the rate lock lapsed and the rate, amount credited and date available are re-disclosed."
    grain: "One row per re-quote."
    fields:
      fx_rate: "New customer exchange rate."
      receive_amount: "New amount to be credited."
      date_available: "Re-disclosed date available."
    triggers: []
  - type: wallet_released
    target: wallet_transfers
    mutation: {transition: {from: awaiting_funds, to: processing}}
    meaning: "The transfer is released and the first credit is sent to the wallet provider."
    grain: "One row per first release."
    fields:
      released_at: "Moment the credit was first sent."
    triggers:
      - event: wallet:wallet_credit_sent
        map: {credit_attempt: 1}
  - type: wallet_hold_placed
    target: wallet_transfers
    mutation: {transition: [{from: awaiting_funds, to: on_hold}, {from: processing, to: on_hold}]}
    meaning: "Compliance, funding review, provider screening or new-recipient cooling-off stops the transfer."
    grain: "One row per hold."
    fields:
      hold_reason: "Why the transfer is held."
      held_at: "Moment the hold was placed."
    triggers: []
  - type: wallet_hold_released
    target: wallet_transfers
    mutation: {transition: {from: on_hold, to: processing}}
    meaning: "Compliance clears the hold and the credit is sent."
    grain: "One row per hold release."
    fields:
      hold_reason: "Reset to none."
      released_at: "Moment the credit was sent after the hold."
      date_available: "Re-disclosed date available counted from the release."
    triggers: []
  - type: wallet_credit_confirmed
    target: wallet_transfers
    mutation: {transition: {from: processing, to: credited}}
    meaning: "The wallet provider confirms the credit to the recipient's wallet."
    grain: "One row per confirmed credit."
    fields:
      credited_at: "Moment the provider confirmed the credit."
      closed_date: "Date part of credited_at."
    triggers:
      - event: rewards:rewards_points_earned
        map: {source_transfer_id: wallet_transfer_id, source_category: wallet}
  - type: wallet_credit_failed_marked
    target: wallet_transfers
    mutation: {transition: {from: processing, to: credit_failed}}
    meaning: "The provider rejected the credit after any automatic re-sends and the money is back with Paloma."
    grain: "One row per failure."
    fields:
      failed_at: "Moment the failure was confirmed."
    triggers: []
  - type: wallet_credit_retried
    target: wallet_transfers
    mutation: {transition: [{from: credit_failed, to: processing}, {from: credited, to: processing}]}
    meaning: "A failed credit is sent again at the customer's request, or a credit is sent again at no cost after an error resolution."
    grain: "One row per retry."
    fields:
      released_at: "Moment the new credit was sent."
      date_available: "Re-disclosed date available for the new credit."
    triggers:
      - event: wallet:wallet_credit_sent
        map: {}
  - type: wallet_transfer_cancelled
    target: wallet_transfers
    mutation: {transition: [{from: awaiting_funds, to: cancelled}, {from: on_hold, to: cancelled}]}
    meaning: "The customer cancels their own transfer before it is released."
    grain: "One row per customer cancellation."
    fields:
      cancelled_at: "Moment the customer confirmed the cancellation."
    triggers: []
  - type: wallet_transfer_auto_cancelled
    target: wallet_transfers
    mutation: {transition: [{from: on_hold, to: cancelled}, {from: awaiting_funds, to: cancelled}]}
    meaning: "Paloma cancels the transfer: an unanswered or rejected request for information, a compliance rejection, or a failed or late payment."
    grain: "One row per Paloma-initiated cancellation."
    fields:
      cancelled_at: "Moment Paloma cancelled it."
      hold_reason: "The reason that led to the cancellation."
    triggers: []
  - type: wallet_transfer_refunded
    target: wallet_transfers
    mutation: {transition: [{from: cancelled, to: refunded}, {from: credit_failed, to: refunded}, {from: credited, to: refunded}]}
    meaning: "The money owed back has been refunded and the transfer is closed."
    grain: "One row per closing refund."
    fields:
      closed_date: "Date of the closing refund."
    triggers: []
  - type: wallet_destination_updated
    target: wallet_transfers
    mutation: update
    meaning: "The wallet a failed credit is addressed to is replaced by another wallet of the same recipient."
    grain: "One row per destination change."
    fields:
      wallet_provider: "New wallet provider."
      wallet_number: "New wallet number, exactly as the customer gives it."
      wallet_holder_name: "Name the new wallet is registered in, exactly as the customer gives it."
    triggers: []
  # ---- ledger writes (wallet_ledger) ----
  - type: wallet_funds_received
    target: wallet_ledger
    meaning: "The customer's payment for the principal is collected."
    grain: "One row per principal collection on a transfer."
    distinguish_by: [entry_date]
    fields:
      amount_usd: "Principal collected (positive)."
      entry_date: "Date collected."
    account: principal_held
    direction: in
    triggers: []
  - type: wallet_fee_charged
    target: wallet_ledger
    meaning: "A fee is collected: transfer fee, card funding fee, retry fee or redirect fee."
    grain: "One row per fee type per sequence number."
    distinguish_by: [fee_type, fee_seq]
    fields:
      fee_type: "Kind of fee."
      amount_usd: "Fee collected (positive)."
      fee_seq: "1 for booking fees; the retry or redirect number otherwise."
      entry_date: "Date collected."
    account: fees_held
    direction: in
    triggers: []
  - type: wallet_fee_refunded
    target: wallet_ledger
    meaning: "All or part of one collected fee is refunded."
    grain: "One row per refunded fee charge."
    distinguish_by: [related_entry_id]
    fields:
      related_entry_id: "ledger_entry_id of the wallet_fee_charged row refunded."
      amount_usd: "Amount refunded (positive)."
      fee_refund_reason: "Why the fee is refunded."
      entry_date: "Date refunded."
    account: fees_held
    direction: out
    triggers: []
  - type: wallet_credit_sent
    target: wallet_ledger
    meaning: "Principal is sent to the wallet provider for credit to the recipient's wallet."
    grain: "One row per credit attempt."
    distinguish_by: [credit_attempt]
    fields:
      amount_usd: "USD principal sent (positive)."
      receive_amount: "Local-currency amount sent."
      fx_rate_applied: "Rate used."
      credit_attempt: "1 for the first credit, 2 and up for each retry or redirect."
      entry_date: "Date sent."
    account: principal_held
    direction: out
    triggers: []
  - type: wallet_credit_reversed
    target: wallet_ledger
    meaning: "The provider rejects a credit and its principal comes back to Paloma in full."
    grain: "One row per failed credit attempt."
    distinguish_by: [credit_attempt]
    fields:
      amount_usd: "USD principal back with Paloma (positive), equal to the attempt's amount sent."
      failure_reason: "Provider's rejection reason."
      credit_attempt: "The credit attempt that failed."
      entry_date: "Date of the rejection."
    account: principal_held
    direction: in
    triggers:
      - event: wallet:wallet_credit_failed_marked
        map: {}
  - type: wallet_paloma_credit
    target: wallet_ledger
    meaning: "Paloma funds a re-credit or refund after an error found on a transfer recorded as credited."
    grain: "One row per make-good credit per source entry."
    distinguish_by: [credit_reason, related_entry_id]
    fields:
      credit_reason: "error_recredit, error_refund or incorrect_amount_shortfall."
      amount_usd: "Amount Paloma puts in (positive)."
      related_entry_id: "The wallet_credit_sent row the error concerned."
      entry_date: "Date credited."
    account: principal_held
    direction: in
    triggers: []
  - type: wallet_refund_issued
    target: wallet_ledger
    meaning: "Principal owed back to the customer is refunded to the original funding method."
    grain: "One row per principal refund per basis and source entry."
    distinguish_by: [refund_basis, related_entry_id]
    fields:
      amount_usd: "Principal refunded (positive)."
      refund_basis: "Why the refund is owed."
      related_entry_id: "The ledger entry the refund pays back (funds received, the last reversal, or the Paloma credit)."
      entry_date: "Date refunded."
    account: principal_held
    direction: out
    triggers:
      - event: wallet:wallet_transfer_refunded
        when: {refund_basis: {not: error_shortfall}}
        map: {closed_date: entry_date}
  # ---- case writes (wallet_cases) ----
  - type: wallet_redirect_requested
    target: wallet_cases
    meaning: "The customer gives another wallet of the same recipient for a failed credit."
    grain: "One row per redirect."
    distinguish_by: [redirect_seq]
    fields:
      new_wallet_provider: "Provider of the new wallet."
      new_wallet_number: "New wallet number, exactly as the customer gives it."
      new_wallet_holder_name: "Name the new wallet is registered in, exactly as the customer gives it."
      redirect_seq: "1 for the first redirect on the transfer, 2 for the second."
      case_date: "Date of the request."
    triggers:
      - event: wallet:wallet_destination_updated
        map: {wallet_provider: new_wallet_provider, wallet_number: new_wallet_number, wallet_holder_name: new_wallet_holder_name}
  - type: wallet_rfi_answer_logged
    target: wallet_cases
    meaning: "The customer's answer to a transfer-level request for information is logged."
    grain: "One row per uploaded answer."
    distinguish_by: [doc_reference]
    fields:
      rfi_topic: "What the request asked."
      doc_reference: "Upload reference of the answer document, as the app shows it."
      case_date: "Date logged."
    triggers: []
  - type: wallet_error_notice_filed
    target: wallet_cases
    meaning: "The customer gives notice of an error on a wallet transfer under the Remittance Transfer Rule."
    grain: "One row per error notice."
    distinguish_by: [case_type, case_date]
    fields:
      case_type: "Kind of error asserted."
      case_date: "Date of the notice."
      resolution_due_date: "Last day for Paloma's decision."
    triggers: []
  - type: wallet_error_decided
    target: wallet_cases
    meaning: "Paloma's error-resolution team records its finding on one notice."
    grain: "One row per decision."
    distinguish_by: [related_case_id]
    fields:
      related_case_id: "case_id of the notice."
      case_outcome: "error_found or no_error."
      case_date: "Date decided."
    triggers: []
  - type: wallet_remedy_chosen
    target: wallet_cases
    meaning: "After an error is found, the customer chooses a refund or a re-credit at no cost."
    grain: "One row per choice."
    distinguish_by: [related_case_id]
    fields:
      related_case_id: "case_id of the notice."
      remedy_choice: "refund or recredit for a wrong wallet; refund_shortfall or recredit_shortfall for an incorrect amount."
      case_date: "Date chosen."
    triggers:
      - event: wallet:wallet_refund_issued
        when: {remedy_choice: refund}
        map: {refund_basis: error_resolution}
      - event: wallet:wallet_refund_issued
        when: {remedy_choice: refund_shortfall}
        map: {refund_basis: error_shortfall}
      - event: wallet:wallet_credit_retried
        when: {remedy_choice: [recredit, recredit_shortfall]}
        map: {}

measures:
  - id: wallet_msr_transfers_to_recipient_24h
    window: "Rolling 24 hours ending at frozen_time: booked_at strictly later than frozen_time minus 24 hours."
    measure: "Count of wallet_transfers on the same recipient_id, excluding status cancelled or refunded."
  - id: wallet_msr_customer_retries
    window: "The life of one transfer."
    measure: "Count of wallet_credit_sent rows on this wallet_transfer_id with credit_attempt of 2 or more that were sent to the same wallet (not after a wallet_redirect_requested row) and followed a wallet_credit_reversed row whose failure_reason is attributed to the sender."
  - id: wallet_msr_redirects
    window: "The life of one transfer."
    measure: "Count of wallet_redirect_requested rows on this wallet_transfer_id."

policies:
  - id: wallet_agg_multi_holding
    subject: [wallet_transfer_booked]
    rule: >-
      A customer may hold any number of Mobile Wallet transfers at once; each booking has its own
      confirmation number, principal, fees, rate and wallet destination. They are bounded only by the
      aggregate sending limits of the customer's Personal Sender Account, the per-recipient frequency
      cap and the provider cap (wallet_agg_sending_limits). Transfers are never combined: a retry,
      redirect or refund on one transfer never touches another.
    eligibility: []
    params:
      max_per_customer: null

  - id: wallet_agg_sending_limits
    subject: [wallet_transfer_booked]
    rule: >-
      A Mobile Wallet transfer is booked only under the customer's own Personal Sender Account, and
      only while that account's status is active. Its principal must fit every ceiling of
      account_sending_limits for the account's level at the moment of booking, aggregated over all of
      the customer's personal transfers in Bank Deposit, Cash Pickup and Mobile Wallet. The principal
      must lie between the tier's min_send_usd and max_send_usd, both inclusive, and may not exceed
      the wallet provider's entry in provider_cap_usd. No more than max_transfers_per_recipient_24h
      Mobile Wallet transfers to one recipient may be booked as counted by
      wallet_msr_transfers_to_recipient_24h including the new one. The binding ceiling is the lowest
      of the account level's per_transfer_limit_usd, the tier's max_send_usd and the provider cap. A
      booking over any ceiling is not made; Paloma never splits one requested amount into several
      wallet credits, and a provider cap is never worked around by sending to a second wallet.
    eligibility:
      - id: sender_account_active
        applies_to: [wallet_transfer_booked]
        kind: state
        condition: "A Mobile Wallet transfer is booked only under the customer's own Personal Sender Account, and only while that account's status is active."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
        state_contract:
          field: sender_accounts.status
          allowed: [active]
    params:
      per_tier:
        Mobile Wallet Micro: {min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", provider_cap_usd: "=provider_cap_usd", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
        Mobile Wallet Economy: {min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", provider_cap_usd: "=provider_cap_usd", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
        Mobile Wallet Express: {min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", provider_cap_usd: "=provider_cap_usd", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
        Mobile Wallet Express Plus: {min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", provider_cap_usd: "=provider_cap_usd", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
        Mobile Wallet Priority: {min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", provider_cap_usd: "=provider_cap_usd", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
        Mobile Wallet Large Amount: {min_send_usd: "=min_send_usd", max_send_usd: "=max_send_usd", provider_cap_usd: "=provider_cap_usd", max_transfers_per_recipient_24h: "=max_transfers_per_recipient_24h"}
    measures: [wallet_msr_transfers_to_recipient_24h]

  - id: wallet_evt_booking_eligibility
    subject: [wallet_transfer_booked]
    rule: >-
      Booking is the customer's own authorisation of payment: the agent may quote and explain, and
      the customer books. A tier may be booked only when the account's level is at or above the
      tier's entry_min_account_level (by level_number) and account_msr_completed_transfers is at
      least the tier's entry_min_completed_transfers. The funding method must be in the tier's
      funding_methods_allowed and also allowed by the account level; the narrower wins. The corridor
      must be in corridors_served and the wallet provider must be listed for that corridor in
      providers_by_corridor. The recipient must be a saved recipient of the same customer whose
      status is active, whose corridor equals the transfer's corridor and who has a saved mobile
      wallet; wallet_provider and wallet_number are copied from the saved recipient and
      wallet_holder_name is the recipient's full_name. On a tier whose wallet_name_check is true the
      credit is sent only when the provider's registered name for the wallet matches
      wallet_holder_name; a mismatch fails the credit with failure_reason wallet_name_mismatch. In a
      corridor listed in purpose_code_corridors a transfer_purpose must be stated.
    eligibility:
      - id: tier_entry
        applies_to: [wallet_transfer_booked]
        kind: authorization
        condition: "A tier may be booked only when the account's level is at or above the tier's entry_min_account_level (by level_number) and account_msr_completed_transfers is at least the tier's entry_min_completed_transfers."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
      - id: recipient_wallet_on_file
        applies_to: [wallet_transfer_booked]
        kind: authorization
        condition: "The recipient must be a saved recipient of the same customer whose status is active, whose corridor equals the transfer's corridor and who has a saved mobile wallet"
        evidence_fields: [recipients.recipient_id, recipients.customer_id, recipients.status, recipients.corridor, recipients.mobile_wallet_provider, recipients.mobile_wallet_number]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [recipients.recipient_id]
          action_bindings:
            recipients.recipient_id: recipient_id
    params:
      per_tier:
        Mobile Wallet Micro: {entry_min_account_level: "=entry_min_account_level", entry_min_completed_transfers: "=entry_min_completed_transfers", funding_methods_allowed: "=funding_methods_allowed", corridors_served: "=corridors_served", providers_by_corridor: "=providers_by_corridor", wallet_name_check: "=wallet_name_check", purpose_code_corridors: "=purpose_code_corridors"}
        Mobile Wallet Economy: {entry_min_account_level: "=entry_min_account_level", entry_min_completed_transfers: "=entry_min_completed_transfers", funding_methods_allowed: "=funding_methods_allowed", corridors_served: "=corridors_served", providers_by_corridor: "=providers_by_corridor", wallet_name_check: "=wallet_name_check", purpose_code_corridors: "=purpose_code_corridors"}
        Mobile Wallet Express: {entry_min_account_level: "=entry_min_account_level", entry_min_completed_transfers: "=entry_min_completed_transfers", funding_methods_allowed: "=funding_methods_allowed", corridors_served: "=corridors_served", providers_by_corridor: "=providers_by_corridor", wallet_name_check: "=wallet_name_check", purpose_code_corridors: "=purpose_code_corridors"}
        Mobile Wallet Express Plus: {entry_min_account_level: "=entry_min_account_level", entry_min_completed_transfers: "=entry_min_completed_transfers", funding_methods_allowed: "=funding_methods_allowed", corridors_served: "=corridors_served", providers_by_corridor: "=providers_by_corridor", wallet_name_check: "=wallet_name_check", purpose_code_corridors: "=purpose_code_corridors"}
        Mobile Wallet Priority: {entry_min_account_level: "=entry_min_account_level", entry_min_completed_transfers: "=entry_min_completed_transfers", funding_methods_allowed: "=funding_methods_allowed", corridors_served: "=corridors_served", providers_by_corridor: "=providers_by_corridor", wallet_name_check: "=wallet_name_check", purpose_code_corridors: "=purpose_code_corridors"}
        Mobile Wallet Large Amount: {entry_min_account_level: "=entry_min_account_level", entry_min_completed_transfers: "=entry_min_completed_transfers", funding_methods_allowed: "=funding_methods_allowed", corridors_served: "=corridors_served", providers_by_corridor: "=providers_by_corridor", wallet_name_check: "=wallet_name_check", purpose_code_corridors: "=purpose_code_corridors"}

  - id: wallet_evt_pricing
    subject: [wallet_transfer_booked, wallet_fee_charged]
    rule: >-
      The transfer fee is the fee_usd of the fee_ladder band containing the principal, less
      pay_by_bank_fee_discount_usd when funded by pay_by_bank (never below 0.00). A first personal
      transfer (no other personal transfer on the sender account in any delivery method except ones
      whose status is cancelled or refunded) booked on a tier whose first_transfer_fee_waived is true
      with principal at or below first_transfer_promo_cap_usd has a 0.00 transfer fee and the margin
      first_transfer_promo_margin_pct; above the cap the regular price applies to the whole
      transfer, and the promotion never stacks with the pay-by-bank discount. card_fee_usd is
      credit_card_fee_pct of the principal, rounded half up to the cent, for credit-card funding and
      debit_card_fee_usd for debit-card funding. The margin is fx_margin_pct, less
      margin_reduction_pct_points at or above margin_reduction_threshold_usd (the promotional margin
      replaces both); fx_rate is the corridor's mid_market_rate in the Paloma rate sheet for the
      booking date times one minus the margin over 100, rounded half up to 4 decimals, and
      receive_amount is the principal times fx_rate rounded half up to 2 decimals. date_available is
      the release day, counted from booking_cutoff_ct as for Bank Deposit, plus credit_business_days
      Paloma business days; when weekend_credit is true the date may fall on any calendar day. Fees
      are collected with the principal as wallet_fee_charged rows with fee_seq 1.
    eligibility: []
    params:
      per_tier:
