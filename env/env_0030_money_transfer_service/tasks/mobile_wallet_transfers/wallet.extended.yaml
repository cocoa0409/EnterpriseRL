# Paloma Remit — product charter: Mobile Wallet transfers.
# Each personal transfer credited to a recipient's mobile-money wallet (GCash, Maya, M-Pesa,
# MTN MoMo, bKash, Nequi, Tigo Money) is one holding: the transfer order the customer booked at one
# Mobile Wallet tier, with its principal, fee, locked rate, the wallet it is addressed to and its
# disclosed availability. Wallet credits are near-instant but can bounce: the recipient's wallet may
# be unregistered, over its provider limit, suspended, or held in another name. The tier decides the
# price, the speed promise, and how failed credits are retried, redirected or refunded. The
# Remittance Transfer Rule (Regulation E, subpart B) governs cancellation, refunds and errors.

category: wallet
display_name: Mobile Wallet

binding:
  holding_table: wallet_transfers
  event_tables: [wallet_ledger, wallet_cases]
  status_field: status
  variant_field: variant_name
  quantity_fields: {principal_held_usd: principal_held, fees_held_usd: fees_held}

lifecycle:
  states: [awaiting_funds, on_hold, processing, credited, credit_failed, cancelled, refunded]
  transitions:
    - {from: awaiting_funds, to: processing, by: system, means: "Funds are collected (or ACH principal is released early) and screening passes; the credit is sent to the wallet provider."}
    - {from: awaiting_funds, to: on_hold, by: system, means: "A compliance, funding or new-recipient screening hold is placed before release."}
    - {from: processing, to: on_hold, by: system, means: "The wallet provider or Paloma compliance stops a credit in progress for screening."}
    - {from: on_hold, to: processing, by: system, means: "Compliance clears the hold and the credit is sent."}
    - {from: processing, to: credited, by: system, means: "The wallet provider confirms the money is in the recipient's wallet."}
    - {from: processing, to: credit_failed, by: system, means: "The wallet provider rejects the credit and the money comes back to Paloma."}
    - {from: credit_failed, to: processing, by: agent, means: "The failed credit is retried at the customer's request, to the same wallet once its problem is fixed or to a corrected wallet of the same recipient."}
    - {from: credited, to: processing, by: agent, means: "After an error resolution found in the customer's favour, the money is credited again at no cost."}
    - {from: awaiting_funds, to: cancelled, by: user, means: "The customer cancels a transfer that has not been released."}
    - {from: on_hold, to: cancelled, by: user, means: "The customer cancels a held transfer."}
    - {from: on_hold, to: cancelled, by: system, means: "Paloma cancels a held transfer whose request for information expired unanswered or that compliance rejected."}
    - {from: awaiting_funds, to: cancelled, by: system, means: "The customer's payment fails or an inbound wire does not arrive in time."}
    - {from: cancelled, to: refunded, by: agent, means: "The collected money owed back on a cancelled transfer is refunded."}
    - {from: credit_failed, to: refunded, by: agent, means: "The money of a failed credit is refunded, at the customer's choice or when the retry window ends."}
    - {from: credited, to: refunded, by: agent, means: "After an error resolution, Paloma refunds the customer for a transfer recorded as credited."}

accounts:
  - key: principal_held
    unit: USD
    meaning: "Customer principal Paloma holds for this transfer: collected funds, reversed failed credits and Paloma make-good credits in; credits sent to the wallet provider and refunds out."
  - key: fees_held
    unit: USD
    meaning: "Fees Paloma has collected on this transfer net of fee refunds: fee charges in, fee refunds out."

parameter_schema:
  funding_methods_allowed: "Funding methods the tier accepts (list); the account level may narrow it further."
  entry_min_account_level: "Lowest Personal Sender Account level (official name) that may book this tier."
  entry_min_completed_transfers: "Fewest completed personal transfers (account_msr_completed_transfers) needed before booking this tier (count)."
  corridors_served: "Corridors where this tier credits wallets (list)."
  providers_by_corridor: "Wallet providers Paloma credits in each corridor (mapping corridor -> list of providers)."
  min_send_usd: "Smallest principal (USD) per transfer."
  max_send_usd: "Largest principal (USD) per transfer, before the account level's per-transfer limit."
  provider_cap_usd: "Largest principal (USD) a single credit to each provider may carry, reflecting the provider's own receiving limits (mapping provider -> USD)."
  max_transfers_per_recipient_24h: "Largest number of Mobile Wallet transfers to one recipient in a rolling 24 hours (count)."
  fee_ladder: "Transfer fee by principal band: list of {from_usd, to_usd, fee_usd}, inclusive at both ends."
  credit_card_fee_pct: "Card funding fee as a percentage of principal for credit-card funding (percent; 0 when not accepted)."
  debit_card_fee_usd: "Flat fee (USD) added for debit-card funding."
  pay_by_bank_fee_discount_usd: "Amount (USD) taken off the ladder fee for pay-by-bank funding, never below 0.00."
  fx_margin_pct: "Exchange-rate margin below mid-market (percent)."
  margin_reduction_threshold_usd: "Principal (USD) at or above which the reduced margin applies."
  margin_reduction_pct_points: "Percentage points taken off fx_margin_pct at or above the threshold."
  rate_lock_hours: "Hours from booked_at for which the quoted rate stays guaranteed while funds are awaited."
  credit_business_days: "Paloma business days from release to the disclosed date available (0 = credited within minutes of release)."
  booking_cutoff_ct: "Latest US Central time on a business day for release to count from that day (HH:MM, or 24x7)."
  weekend_credit: "Whether credits are made on Saturdays, Sundays and holidays (boolean)."
  credit_promise_minutes: "Minutes after release within which the credit is promised on this tier (0 = no minute promise; the date promise applies)."
  on_time_promise: "Whether Paloma refunds the transfer fee when the credit lands after its promise for a reason on Paloma's side (boolean)."
  wallet_name_check: "Whether the provider's registered wallet name is checked against the recipient before the credit is sent (boolean)."
  first_transfer_fee_waived: "Whether the transfer fee is waived on the customer's first-ever personal transfer when booked on this tier (boolean)."
  first_transfer_promo_cap_usd: "Largest principal (USD) a first-transfer promotion covers (USD; 0 = no promotion)."
  first_transfer_promo_margin_pct: "Margin applied to a first transfer covered by the promotion (percent)."
  cancel_full_refund_window_hours: "Elapsed hours after booked_at within which a cancellation refunds principal and every fee in full (the Regulation E 30-minute right, in hours)."
  late_cancel_fee_refund_pct: "Share of each booking fee refunded when the transfer is cancelled after the full-refund window (percent)."
  refund_business_days: "Paloma business days within which a refund owed must be issued, counted from the day it becomes owed."
  rfi_response_days: "Calendar days to answer a transfer-level request for information before the transfer is cancelled."
  rfi_expiry_fee_refund_pct: "Share of each booking fee refunded when Paloma cancels a held transfer (percent)."
  hold_review_business_days: "Paloma business days compliance takes to clear a hold once its request for information is answered."
  funding_deadline_hours: "Hours after booked_at within which an inbound wire must arrive (0 = not applicable)."
  auto_retry_attempts: "Automatic re-sends of a credit that fails for a technical provider reason before it is treated as failed (count)."
  auto_retry_interval_minutes: "Minutes between automatic re-sends (minutes)."
  failure_reason_attribution: "Whether each failure reason is on the recipient's side (sender) or on Paloma's or the provider's side (paloma) (mapping failure_reason -> sender | paloma)."
  failed_credit_hold_days: "Calendar days a failed credit waits for a retry or redirect before Paloma refunds it."
  free_retries: "Customer-requested retries of a failed credit that carry no fee (count)."
  retry_fee_usd: "Fee (USD) for each customer-requested retry beyond the free ones after a sender-side failure."
  max_retries: "Largest number of customer-requested retries on one transfer (count)."
  redirect_allowed: "Whether a failed credit may be redirected to a different wallet of the same recipient (boolean)."
  redirect_fee_usd: "Fee (USD) for each redirect after a sender-side failure."
  max_redirects: "Largest number of redirects on one transfer (count)."
  same_recipient_redirect_only: "Whether a redirect must stay with the same recipient, whose name the new wallet must be registered in (boolean)."
  sender_side_failure_fee_refund_pct: "Share of the transfer fee refunded when a credit that failed on the recipient's side is refunded (percent)."
  error_notice_window_days: "Calendar days after the disclosed date_available within which an error notice may be given."
  error_investigation_days: "Calendar days after an error notice within which Paloma must decide it."
  recredit_business_days: "Paloma business days within which money is credited again after the customer chooses re-credit as a remedy."
  purpose_code_corridors: "Corridors where a transfer_purpose must be stated at booking (list)."

