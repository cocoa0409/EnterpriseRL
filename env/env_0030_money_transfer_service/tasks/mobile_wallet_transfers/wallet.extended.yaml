  - id: wallet_ext_shortfall_makegood
    base_policy_refs: [wallet_evt_error_resolution]
    overwrite:
      - base_policy: wallet_evt_error_resolution
        superseded_clause: >-
          for incorrect_amount Paloma credits the shortfall (credit_reason incorrect_amount_shortfall)
        replaced_by: >-
          Goodwill percentages and goodwill amounts are added to the shortfall make-good: the shortfall divided by the locked rate, unrounded, is multiplied once by one plus the sum of the goodwill percentages over 100, the goodwill amounts are then added, and the total is rounded half up to the cent.
    trigger: state_due
    subject: [wallet_paloma_credit]
    computes: amount_usd
    target_tool: book_shortfall_makegood_2311834f
    params:
      prompt_notice_days: 3
      late_notice_days: 30
      delay_long_days: 10
      delay_mid_days: 5
      delay_long_pct: 5.0
      delay_mid_pct: 2.5
      hardship_share_pct: 2.0
      hardship_high_pct: 4.0
      hardship_low_pct: 2.0
      tenure_long_months: 60
      tenure_mid_months: 36
      tenure_long_usd: 3.00
      tenure_mid_usd: 1.50
      topup_window_months: 12
      topup_high_count: 6
      topup_low_count: 3
      topup_high_usd: 1.00
      topup_low_usd: 0.50
    rule: >-
      When the error-resolution team decides error_found on an incorrect_amount notice, Paloma owes a make-good for the shortfall: one wallet_paloma_credit entry with credit_reason incorrect_amount_shortfall, related to the wallet_credit_sent entry that arrived short and dated the day it is booked, which adds to the principal Paloma holds for the transfer.
      The shortfall is the transfer's disclosed receive_amount less the receive_amount its wallet_credit_sent entries delivered, in the payout currency.
      The shortfall make-good is the shortfall divided by the transfer's locked fx_rate, rounded half up to the cent.
      Goodwill percentages and goodwill amounts are added to the shortfall make-good: the shortfall divided by the locked rate, unrounded, is multiplied once by one plus the sum of the goodwill percentages over 100, the goodwill amounts are then added, and the total is rounded half up to the cent.
      The days a shortfall stood are counted in calendar days to the date of the error_found decision, from a starting date set by how soon the customer gave notice, measured in calendar days from date_available to the notice date: within prompt_notice_days, from date_available; more than late_notice_days, from the date of the decision itself; otherwise from the notice date.
      The delay goodwill on a shortfall make-good follows those days: delay_long_days or more adds delay_long_pct percent; at least delay_mid_days and fewer than delay_long_days adds delay_mid_pct percent; fewer adds nothing.
      The hardship goodwill on a shortfall make-good follows the stated transfer_purpose together with the shortfall as a percentage of the disclosed receive_amount: a medical or education transfer short by more than hardship_share_pct percent adds hardship_high_pct percent; a family_support transfer short by more than hardship_share_pct percent adds hardship_low_pct percent; any other transfer, or one short by hardship_share_pct percent or less, adds nothing.
      The tenure goodwill on a shortfall make-good follows the whole calendar months from the Personal Sender Account's opened_date to today: tenure_long_months or more adds tenure_long_usd; at least tenure_mid_months and fewer than tenure_long_months adds tenure_mid_usd; fewer adds nothing.
      The Top-Up goodwill on a shortfall make-good follows the customer's Top-Up and Bill Pay orders with status delivered that were ordered in the last topup_window_months calendar months, a rolling window that holds the entries whose ordered_at lies fewer than topup_window_months whole calendar months before today, the whole calendar months from a date to today being the difference between the two calendar months, less one when today's day of the month is lower than that date's: topup_high_count or more adds topup_high_usd; at least topup_low_count and fewer than topup_high_count adds topup_low_usd; fewer adds nothing.
    prerequisite: []
    cross_category:
      - category: account
        as: branch
        reads: [opened_date]
        note: The tenure goodwill reads the opened_date of the customer's Personal Sender Account.
      - category: topup
        as: history
        reads: [topup_orders.status, topup_orders.ordered_at]
        note: The Top-Up goodwill counts the customer's delivered Top-Up and Bill Pay orders of the last months.
    compute:
      - disclosed: "F('receive_amount')"
      - credited_local: "SUM('wallet_ledger', 'receive_amount', event_type='wallet_credit_sent')"
      - shortfall_local: "disclosed - credited_local"
      - shortfall_usd: "shortfall_local / F('fx_rate')"
      - notice_date: "LATEST('wallet_cases', 'case_date', date_field='case_date', event_type='wallet_error_notice_filed', case_type='incorrect_amount')"
      - finding_date: "LATEST('wallet_cases', 'case_date', date_field='case_date', event_type='wallet_error_decided', case_outcome='error_found')"
      - notice_lag: "DAYS(F('date_available'), notice_date)"
      - delay_from: "F('date_available') if notice_lag <= K('prompt_notice_days') else (finding_date if notice_lag > K('late_notice_days') else notice_date)"
      - delay_days: "DAYS(delay_from, finding_date)"
      - delay_pct: "K('delay_long_pct') if delay_days >= K('delay_long_days') else (K('delay_mid_pct') if delay_days >= K('delay_mid_days') else 0)"
      - short_share: "(F('receive_amount') - SUM('wallet_ledger', 'receive_amount', event_type='wallet_credit_sent')) / F('receive_amount') * 100"
      - hardship_pct: "K('hardship_high_pct') if ((F('transfer_purpose') == 'medical' or F('transfer_purpose') == 'education') and short_share > K('hardship_share_pct')) else (K('hardship_low_pct') if (F('transfer_purpose') == 'family_support' and short_share > K('hardship_share_pct')) else 0)"
      - tenure_months: "MONTHS(CFIELD('account', 'opened_date'), NOW)"
      - tenure_goodwill: "K('tenure_long_usd') if tenure_months >= K('tenure_long_months') else (K('tenure_mid_usd') if tenure_months >= K('tenure_mid_months') else 0)"
      - delivered_topups: "XCOUNT('topup', 'topup_orders', within_months=K('topup_window_months'), date_field='ordered_at', status='delivered')"
      - topup_goodwill: "K('topup_high_usd') if delivered_topups >= K('topup_high_count') else (K('topup_low_usd') if delivered_topups >= K('topup_low_count') else 0)"
      - result: "RND(shortfall_usd * (1 + (delay_pct + hardship_pct) / 100) + tenure_goodwill + topup_goodwill, 2)"
    compute_basis:
      disclosed: "The shortfall is the transfer's disclosed receive_amount less the receive_amount its wallet_credit_sent entries delivered, in the payout currency."
      credited_local: "The shortfall is the transfer's disclosed receive_amount less the receive_amount its wallet_credit_sent entries delivered, in the payout currency."
      shortfall_local: "The shortfall is the transfer's disclosed receive_amount less the receive_amount its wallet_credit_sent entries delivered, in the payout currency."
      shortfall_usd: "the shortfall divided by the locked rate, unrounded"
      notice_date: "measured in calendar days from date_available to the notice date"
      finding_date: "The days a shortfall stood are counted in calendar days to the date of the error_found decision"
      notice_lag: "measured in calendar days from date_available to the notice date"
      delay_from: "from a starting date set by how soon the customer gave notice, measured in calendar days from date_available to the notice date: within prompt_notice_days, from date_available; more than late_notice_days, from the date of the decision itself; otherwise from the notice date."
      delay_days: "The days a shortfall stood are counted in calendar days to the date of the error_found decision"
      delay_pct: "The delay goodwill on a shortfall make-good follows those days: delay_long_days or more adds delay_long_pct percent; at least delay_mid_days and fewer than delay_long_days adds delay_mid_pct percent; fewer adds nothing."
      short_share: "together with the shortfall as a percentage of the disclosed receive_amount"
      hardship_pct: "a medical or education transfer short by more than hardship_share_pct percent adds hardship_high_pct percent; a family_support transfer short by more than hardship_share_pct percent adds hardship_low_pct percent; any other transfer, or one short by hardship_share_pct percent or less, adds nothing."
      tenure_months: "The tenure goodwill on a shortfall make-good follows the whole calendar months from the Personal Sender Account's opened_date to today"
      tenure_goodwill: "tenure_long_months or more adds tenure_long_usd; at least tenure_mid_months and fewer than tenure_long_months adds tenure_mid_usd; fewer adds nothing."
      delivered_topups: "The Top-Up goodwill on a shortfall make-good follows the customer's Top-Up and Bill Pay orders with status delivered that were ordered in the last topup_window_months calendar months, a rolling window that holds the entries whose ordered_at lies fewer than topup_window_months whole calendar months before today, the whole calendar months from a date to today being the difference between the two calendar months, less one when today's day of the month is lower than that date's"
      topup_goodwill: "topup_high_count or more adds topup_high_usd; at least topup_low_count and fewer than topup_high_count adds topup_low_usd; fewer adds nothing."
      result: "the shortfall divided by the locked rate, unrounded, is multiplied once by one plus the sum of the goodwill percentages over 100, the goodwill amounts are then added, and the total is rounded half up to the cent."
    factors:
      - id: shortfall_clock
        effect: method
        decides: delay_from
        bindings: [notice_lag, delay_from]
        ladder:
          - when: "notice given within prompt_notice_days calendar days of date_available"
            method: "the days the shortfall stood are counted from date_available"
          - when: "notice given more than late_notice_days calendar days after date_available"
            method: "the days the shortfall stood are counted from the date of the error_found decision itself"
          - when: "otherwise (notice given between those bounds)"
            method: "the days the shortfall stood are counted from the notice date"
        baseline:
          delay_from: "notice_date"
        evidence: [history, date]
        cross_difficulty: null
      - id: delay_goodwill
        effect: parameter
        decides: delay_pct
        bindings: [delay_days, delay_pct]
        ladder:
          - when: "the shortfall stood delay_long_days calendar days or more"
            value: "K('delay_long_pct')"
          - when: "it stood at least delay_mid_days and fewer than delay_long_days calendar days"
            value: "K('delay_mid_pct')"
          - when: "otherwise (fewer than delay_mid_days)"
            value: "0"
        baseline:
          delay_pct: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: hardship_goodwill
        effect: parameter
        decides: hardship_pct
        bindings: [short_share, hardship_pct]
        ladder:
          - when: "transfer_purpose medical or education AND the shortfall is more than hardship_share_pct percent of the disclosed receive_amount"
            value: "K('hardship_high_pct')"
          - when: "transfer_purpose family_support AND the shortfall is more than hardship_share_pct percent of the disclosed receive_amount"
            value: "K('hardship_low_pct')"
          - when: "otherwise (any other purpose, or a shortfall of hardship_share_pct percent or less)"
            value: "0"
        baseline:
          hardship_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: tenure_goodwill
        effect: parameter
        decides: tenure_goodwill
        bindings: [tenure_months, tenure_goodwill]
        ladder:
          - when: "Personal Sender Account open tenure_long_months whole calendar months or more"
            value: "K('tenure_long_usd')"
          - when: "open at least tenure_mid_months and fewer than tenure_long_months whole calendar months"
            value: "K('tenure_mid_usd')"
          - when: "otherwise (fewer than tenure_mid_months)"
            value: "0"
        baseline:
          tenure_goodwill: "0"
        evidence: [cross_category, date]
        cross_difficulty: account
      - id: topup_goodwill
        effect: parameter
        decides: topup_goodwill
        bindings: [delivered_topups, topup_goodwill]
        ladder:
          - when: "topup_high_count or more delivered Top-Up and Bill Pay orders ordered in the last topup_window_months calendar months (rolling, counted in whole calendar months back from today)"
            value: "K('topup_high_usd')"
          - when: "at least topup_low_count and fewer than topup_high_count such orders"
            value: "K('topup_low_usd')"
          - when: "otherwise (fewer than topup_low_count)"
            value: "0"
        baseline:
          topup_goodwill: "0"
        evidence: [cross_category, history]
        cross_difficulty: null
    baseline:
      rule: >-
        The shortfall is the transfer's disclosed receive_amount less the receive_amount its wallet_credit_sent entries delivered, in the payout currency.
        The shortfall make-good is the shortfall divided by the transfer's locked fx_rate, rounded half up to the cent.
      params: []
    inputs:
      history:
        - {table: wallet_ledger, aggregate: sum, field: receive_amount, filters: {event_type: wallet_credit_sent}}
        - {table: wallet_cases, aggregate: latest, field: case_date, filters: {event_type: wallet_error_notice_filed, case_type: incorrect_amount}}
        - {table: wallet_cases, aggregate: latest, field: case_date, filters: {event_type: wallet_error_decided, case_outcome: error_found}}
        - {category: topup, table: topup_orders, aggregate: count, field: topup_order_id, within_months: 12, filters: {status: delivered}}
      cross_category: [account, topup]

  - id: wallet_ext_shortfall_recredit
    base_policy_refs: [wallet_evt_error_resolution, wallet_evt_release_holds_and_credit, wallet_evt_failed_credit]
    overwrite:
      - base_policy: wallet_evt_failed_credit
        superseded_clause: >-
          A retried or redirected credit uses the transfer's original fx_rate and receive_amount, and date_available is re-disclosed as the retry day.
        replaced_by: >-
          The rate of a shortfall re-credit starts from a base rate set by how the shortfall arose and is raised by re-credit points: the points are added together, the base rate is multiplied once by one plus their sum over 100 and rounded half up to 4 decimals, and the amount delivered is the principal held times that rate, rounded half up to 2 decimals.
    trigger: on_request
    subject: [wallet_remedy_chosen, wallet_credit_sent]
    computes: receive_amount
    target_tool: choose_shortfall_recredit_f54302ef
    params:
      deduction_margin_share: 0.5
      enhanced_level_number: 4
      verified_plus_level_number: 3
      level_top_points: 0.30
      level_mid_points: 0.15
      pickup_window_months: 12
      pickup_high_count: 4
      pickup_low_count: 2
      pickup_high_points: 0.20
      pickup_low_points: 0.10
      deposit_window_months: 12
      deposit_high_count: 6
      deposit_low_count: 3
      deposit_high_points: 0.20
      deposit_low_points: 0.10
      size_high_usd: 25.00
      size_low_usd: 10.00
      size_high_points: 0.20
      size_low_points: 0.10
    rule: >-
      After a decision of error_found on an incorrect_amount notice, the customer may choose to have the shortfall re-credited to the same wallet (remedy_choice recredit_shortfall); the choice is the customer's own and is recorded against the notice, and the re-credit sends at once the whole principal Paloma then holds for the transfer, that is its wallet_funds_received, wallet_credit_reversed and wallet_paloma_credit entries less its wallet_credit_sent and wallet_refund_issued entries, as one new wallet_credit_sent entry whose credit_attempt is one more than the credits already sent, the transfer returning to processing with released_at the moment of sending and date_available that day.
      The amount a shortfall re-credit delivers is fixed only after Paloma's own shortfall credit stands on the transfer's ledger.
      A shortfall re-credit is not sent to a wallet until no earlier-booked transfer of the same customer addressed to that wallet number stands with a failed credit.
      A shortfall re-credit converts the principal held at the transfer's locked fx_rate, and the amount it delivers is that principal times that rate, rounded half up to 2 decimals.
      The rate of a shortfall re-credit starts from a base rate set by how the shortfall arose and is raised by re-credit points: the points are added together, the base rate is multiplied once by one plus their sum over 100 and rounded half up to 4 decimals, and the amount delivered is the principal held times that rate, rounded half up to 2 decimals.
      How the shortfall arose is read by comparing the fx_rate_applied of the transfer's latest wallet_credit_sent entry with the locked fx_rate: when that credit was converted below the locked rate, the base rate is the booking-day mid-market rate implied by the locked rate, that is the locked rate divided by one minus the margin the transfer carried over 100, rounded half up to 4 decimals; when it carried the locked rate but delivered less than the disclosed receive_amount, the base rate is the locked rate multiplied by one plus deduction_margin_share times that margin over 100, rounded half up to 4 decimals; otherwise the base rate is the locked rate.
      The margin the transfer carried is the tier's fx_margin_pct, less margin_reduction_pct_points when the principal collected on the transfer (its wallet_funds_received entries) is at or above margin_reduction_threshold_usd.
      The level points of a shortfall re-credit follow the Personal Sender Account level: Paloma Enhanced or higher (level_number of at least enhanced_level_number) earns level_top_points; Paloma Verified Plus (level_number equal to verified_plus_level_number) earns level_mid_points; a lower level earns nothing.
      The Cash Pickup points of a shortfall re-credit follow the customer's Cash Pickup payouts made in the last pickup_window_months calendar months (their cash_payout_made entries), a rolling window that holds the entries whose entry_date lies fewer than pickup_window_months whole calendar months before today, the whole calendar months from a date to today being the difference between the two calendar months, less one when today's day of the month is lower than that date's: pickup_high_count or more earns pickup_high_points; at least pickup_low_count and fewer than pickup_high_count earns pickup_low_points; fewer earn nothing.
      The Bank Deposit points of a shortfall re-credit follow the customer's Bank Deposit payouts sent in the last deposit_window_months calendar months (their bank_payout_sent entries), a rolling window that holds the entries whose entry_date lies fewer than deposit_window_months whole calendar months before today, the whole calendar months from a date to today being the difference between the two calendar months, less one when today's day of the month is lower than that date's: deposit_high_count or more earns deposit_high_points; at least deposit_low_count and fewer than deposit_high_count earns deposit_low_points; fewer earn nothing.
      The size points of a shortfall re-credit follow the principal Paloma holds for the transfer when it is sent: size_high_usd or more earns size_high_points; at least size_low_usd and below size_high_usd earns size_low_points; less earns nothing.
    prerequisite:
      - problem: wallet_ext_shortfall_makegood
        kind: value_input
        gate: held_usd
        form: state
        policy_source: >-
          The amount a shortfall re-credit delivers is fixed only after Paloma's own shortfall credit stands on the transfer's ledger.
        condition: >-
          a wallet_paloma_credit entry with credit_reason incorrect_amount_shortfall stands on the transfer's ledger, so the principal Paloma holds for the transfer is the make-good
        resolved_by: book_shortfall_makegood_2311834f
        effect: >-
          held_usd rises by the shortfall make-good booked, which sets the size points and the principal the re-credit converts
      - problem: wallet_ext_resend_credit
        kind: state_gate
        gate: wallet_transfers.status
        form: state
        policy_source: >-
          A shortfall re-credit is not sent to a wallet until no earlier-booked transfer of the same customer addressed to that wallet number stands with a failed credit.
        condition: >-
          no other wallet_transfers row of the same customer with an earlier booked_at and the same wallet_number has status credit_failed
        resolved_by: resend_failed_credit_8d2e2e1a
        effect: >-
          the earlier transfer's bounced credit goes out again and its status moves from credit_failed to processing, so the eligibility of the re-credit to that wallet flips from false to true
    cross_category:
      - category: account
        as: branch
        reads: [variant_name]
        note: The level points read the level_number of the customer's Personal Sender Account tier.
      - category: cash
        as: history
        reads: [cash_ledger.event_type, cash_ledger.entry_date]
        note: The Cash Pickup points count the customer's cash_payout_made entries of the last months.
      - category: bank
        as: history
        reads: [bank_ledger.event_type, bank_ledger.entry_date]
        note: The Bank Deposit points count the customer's bank_payout_sent entries of the last months.
    compute:
      - held_usd: "SUM('wallet_ledger', 'amount_usd', event_type='wallet_funds_received') + SUM('wallet_ledger', 'amount_usd', event_type='wallet_credit_reversed') + SUM('wallet_ledger', 'amount_usd', event_type='wallet_paloma_credit') - SUM('wallet_ledger', 'amount_usd', event_type='wallet_credit_sent') - SUM('wallet_ledger', 'amount_usd', event_type='wallet_refund_issued')"
      - size_points: "K('size_high_points') if held_usd >= K('size_high_usd') else (K('size_low_points') if held_usd >= K('size_low_usd') else 0)"
      - locked_rate: "F('fx_rate')"
      - principal: "SUM('wallet_ledger', 'amount_usd', event_type='wallet_funds_received')"
      - carried_margin: "P('fx_margin_pct') - (P('margin_reduction_pct_points') if principal >= P('margin_reduction_threshold_usd') else 0)"
      - applied_rate: "LATEST('wallet_ledger', 'fx_rate_applied', date_field='entry_date', event_type='wallet_credit_sent')"
      - credited_local: "LATEST('wallet_ledger', 'receive_amount', date_field='entry_date', event_type='wallet_credit_sent')"
      - base_rate: "RND(locked_rate / (1 - carried_margin / 100), 4) if applied_rate < locked_rate else (RND(locked_rate * (1 + K('deduction_margin_share') * carried_margin / 100), 4) if (applied_rate == locked_rate and credited_local < F('receive_amount')) else locked_rate)"
      - level_number: "CPARAM('account', 'level_number')"
      - level_points: "K('level_top_points') if level_number >= K('enhanced_level_number') else (K('level_mid_points') if level_number == K('verified_plus_level_number') else 0)"
      - pickups: "XCOUNT('cash', 'cash_ledger', within_months=K('pickup_window_months'), date_field='entry_date', event_type='cash_payout_made')"
      - pickup_points: "K('pickup_high_points') if pickups >= K('pickup_high_count') else (K('pickup_low_points') if pickups >= K('pickup_low_count') else 0)"
      - deposits: "XCOUNT('bank', 'bank_ledger', within_months=K('deposit_window_months'), date_field='entry_date', event_type='bank_payout_sent')"
      - deposit_points: "K('deposit_high_points') if deposits >= K('deposit_high_count') else (K('deposit_low_points') if deposits >= K('deposit_low_count') else 0)"
      - recredit_rate: "RND(base_rate * (1 + (level_points + pickup_points + deposit_points + size_points) / 100), 4)"
      - result: "RND(held_usd * recredit_rate, 2)"
    compute_basis:
      held_usd: "the re-credit sends at once the whole principal Paloma then holds for the transfer, that is its wallet_funds_received, wallet_credit_reversed and wallet_paloma_credit entries less its wallet_credit_sent and wallet_refund_issued entries"
      size_points: "The size points of a shortfall re-credit follow the principal Paloma holds for the transfer when it is sent: size_high_usd or more earns size_high_points; at least size_low_usd and below size_high_usd earns size_low_points; less earns nothing."
      locked_rate: "A shortfall re-credit converts the principal held at the transfer's locked fx_rate, and the amount it delivers is that principal times that rate, rounded half up to 2 decimals."
      principal: "less margin_reduction_pct_points when the principal collected on the transfer (its wallet_funds_received entries) is at or above margin_reduction_threshold_usd."
      carried_margin: "The margin the transfer carried is the tier's fx_margin_pct, less margin_reduction_pct_points when the principal collected on the transfer (its wallet_funds_received entries) is at or above margin_reduction_threshold_usd."
      applied_rate: "How the shortfall arose is read by comparing the fx_rate_applied of the transfer's latest wallet_credit_sent entry with the locked fx_rate"
      credited_local: "when it carried the locked rate but delivered less than the disclosed receive_amount"
      base_rate: "when that credit was converted below the locked rate, the base rate is the booking-day mid-market rate implied by the locked rate, that is the locked rate divided by one minus the margin the transfer carried over 100, rounded half up to 4 decimals; when it carried the locked rate but delivered less than the disclosed receive_amount, the base rate is the locked rate multiplied by one plus deduction_margin_share times that margin over 100, rounded half up to 4 decimals; otherwise the base rate is the locked rate."
      level_number: "The level points of a shortfall re-credit follow the Personal Sender Account level"
      level_points: "Paloma Enhanced or higher (level_number of at least enhanced_level_number) earns level_top_points; Paloma Verified Plus (level_number equal to verified_plus_level_number) earns level_mid_points; a lower level earns nothing."
      pickups: "The Cash Pickup points of a shortfall re-credit follow the customer's Cash Pickup payouts made in the last pickup_window_months calendar months (their cash_payout_made entries), a rolling window that holds the entries whose entry_date lies fewer than pickup_window_months whole calendar months before today, the whole calendar months from a date to today being the difference between the two calendar months, less one when today's day of the month is lower than that date's"
      pickup_points: "pickup_high_count or more earns pickup_high_points; at least pickup_low_count and fewer than pickup_high_count earns pickup_low_points; fewer earn nothing."
      deposits: "The Bank Deposit points of a shortfall re-credit follow the customer's Bank Deposit payouts sent in the last deposit_window_months calendar months (their bank_payout_sent entries), a rolling window that holds the entries whose entry_date lies fewer than deposit_window_months whole calendar months before today, the whole calendar months from a date to today being the difference between the two calendar months, less one when today's day of the month is lower than that date's"
      deposit_points: "deposit_high_count or more earns deposit_high_points; at least deposit_low_count and fewer than deposit_high_count earns deposit_low_points; fewer earn nothing."
      recredit_rate: "the points are added together, the base rate is multiplied once by one plus their sum over 100 and rounded half up to 4 decimals"
      result: "the amount delivered is the principal held times that rate, rounded half up to 2 decimals."
    factors:
      - id: shortfall_rate_basis
        effect: method
        decides: base_rate
        bindings: [applied_rate, credited_local, base_rate]
        ladder:
          - when: "the short credit's fx_rate_applied is below the locked fx_rate (a conversion error)"
            method: "the base rate is the booking-day mid-market rate implied by the locked rate: locked rate divided by one minus the carried margin over 100, rounded half up to 4 decimals"
          - when: "the short credit carried the locked rate but delivered less than the disclosed receive_amount (a deduction on the way)"
            method: "the base rate is the locked rate multiplied by one plus deduction_margin_share times the carried margin over 100, rounded half up to 4 decimals"
          - when: "otherwise"
            method: "the base rate is the locked rate"
        baseline:
          base_rate: "locked_rate"
        evidence: [history]
        cross_difficulty: null
      - id: level_points
        effect: parameter
        decides: level_points
        bindings: [level_number, level_points]
        ladder:
          - when: "Personal Sender Account at Paloma Enhanced or higher"
            value: "K('level_top_points')"
          - when: "Personal Sender Account at Paloma Verified Plus"
            value: "K('level_mid_points')"
          - when: "otherwise (a lower level)"
            value: "0"
        baseline:
          level_points: "0"
        evidence: [cross_category]
        cross_difficulty: account
      - id: pickup_points
        effect: parameter
        decides: pickup_points
        bindings: [pickups, pickup_points]
        ladder:
          - when: "pickup_high_count or more Cash Pickup payouts made in the last pickup_window_months calendar months (rolling, counted in whole calendar months back from today)"
            value: "K('pickup_high_points')"
          - when: "at least pickup_low_count and fewer than pickup_high_count such payouts"
            value: "K('pickup_low_points')"
          - when: "otherwise (fewer than pickup_low_count)"
            value: "0"
        baseline:
          pickup_points: "0"
        evidence: [cross_category, history]
        cross_difficulty: cash
      - id: deposit_points
        effect: parameter
        decides: deposit_points
        bindings: [deposits, deposit_points]
        ladder:
          - when: "deposit_high_count or more Bank Deposit payouts sent in the last deposit_window_months calendar months (rolling, counted in whole calendar months back from today)"
            value: "K('deposit_high_points')"
          - when: "at least deposit_low_count and fewer than deposit_high_count such payouts"
            value: "K('deposit_low_points')"
          - when: "otherwise (fewer than deposit_low_count)"
            value: "0"
        baseline:
          deposit_points: "0"
        evidence: [cross_category, history]
        cross_difficulty: bank
      - id: size_points
        effect: parameter
        decides: size_points
        bindings: [held_usd, size_points]
        ladder:
          - when: "the principal Paloma holds for the transfer is size_high_usd or more"
            value: "K('size_high_points')"
          - when: "it is at least size_low_usd and below size_high_usd"
            value: "K('size_low_points')"
          - when: "otherwise (below size_low_usd)"
            value: "0"
        baseline:
          size_points: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        After a decision of error_found on an incorrect_amount notice, the customer may choose to have the shortfall re-credited to the same wallet (remedy_choice recredit_shortfall); the choice is the customer's own and is recorded against the notice, and the re-credit sends at once the whole principal Paloma then holds for the transfer, that is its wallet_funds_received, wallet_credit_reversed and wallet_paloma_credit entries less its wallet_credit_sent and wallet_refund_issued entries, as one new wallet_credit_sent entry whose credit_attempt is one more than the credits already sent, the transfer returning to processing with released_at the moment of sending and date_available that day.
        A shortfall re-credit converts the principal held at the transfer's locked fx_rate, and the amount it delivers is that principal times that rate, rounded half up to 2 decimals.
      params: []
    inputs:
      history:
        - {table: wallet_ledger, aggregate: sum, field: amount_usd, filters: {event_type: wallet_paloma_credit}}
        - {table: wallet_ledger, aggregate: latest, field: fx_rate_applied, filters: {event_type: wallet_credit_sent}}
        - {table: wallet_ledger, aggregate: latest, field: receive_amount, filters: {event_type: wallet_credit_sent}}
        - {category: cash, table: cash_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: cash_payout_made}}
        - {category: bank, table: bank_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: bank_payout_sent}}
      cross_category: [account, cash, bank]

  # ------------------------------------------------------------------ task 1
  - id: wallet_ext_wrong_wallet_funding
    base_policy_refs: [wallet_evt_error_resolution]
    overwrite:
      - base_policy: wallet_evt_error_resolution
        superseded_clause: >-
          or a re-credit to the correct wallet at no cost, funded by Paloma (wallet_paloma_credit, credit_reason error_refund or error_recredit)
        replaced_by: >-
          Goodwill is added to the wrong-wallet funding: the misdirected principal is multiplied once by one plus the sum of the goodwill percentages over 100, the standing goodwill amount is then added, and the total is rounded half up to the cent.
    trigger: on_request
    subject: [wallet_paloma_credit]
    computes: amount_usd
    target_tool: fund_wallet_recredit_aebfda78
    params:
      prompt_notice_days: 2
      misdirect_long_days: 7
      misdirect_mid_days: 4
      misdirect_long_pct: 2.0
      misdirect_mid_pct: 1.0
      enhanced_level_number: 4
      verified_plus_level_number: 3
      standing_months: 36
      enhanced_standing_usd: 5.00
      verified_plus_standing_usd: 2.50
      bank_window_months: 12
      bank_high_usd: 5000.00
      bank_low_usd: 2000.00
      bank_high_pct: 1.5
      bank_low_pct: 0.75
    rule: >-
      When the error-resolution team decides error_found on a wrong_wallet_credited notice and the customer asks for the money to be re-credited to the transfer's own wallet, Paloma funds the re-credit: one wallet_paloma_credit entry with credit_reason error_recredit, related to the wallet_credit_sent entry that reached the wrong wallet and dated the day it is booked, which adds to the principal Paloma holds for the transfer.
      The misdirected principal is the amount_usd of the transfer's wallet_credit_sent entries.
      The wrong-wallet funding is the misdirected principal, in USD to the cent.
      Goodwill is added to the wrong-wallet funding: the misdirected principal is multiplied once by one plus the sum of the goodwill percentages over 100, the standing goodwill amount is then added, and the total is rounded half up to the cent.
      The days the money was misdirected are counted in calendar days to the date of the error_found decision, from a starting date set by the transfer's promise and the customer's notice: on a tier whose credit_promise_minutes is above 0, from the date part of released_at; on any other tier, when the notice came within prompt_notice_days calendar days of date_available, from date_available; otherwise from the notice date.
      The misdirection goodwill on a wrong-wallet funding follows those days: misdirect_long_days or more adds misdirect_long_pct percent; at least misdirect_mid_days and fewer than misdirect_long_days adds misdirect_mid_pct percent; fewer adds nothing.
      The standing goodwill on a wrong-wallet funding follows the customer's Personal Sender Account, with whole calendar months counted from its opened_date to today: a level of Paloma Enhanced or higher (level_number of at least enhanced_level_number) on an account open at least standing_months whole calendar months adds enhanced_standing_usd; the level Paloma Verified Plus (level_number equal to verified_plus_level_number) on an account open at least standing_months whole calendar months adds verified_plus_standing_usd; any other account adds nothing.
      The Bank Deposit goodwill on a wrong-wallet funding follows the principal of the customer's Bank Deposit payments collected in the last bank_window_months calendar months (their bank_funds_received entries), a rolling window that holds the entries whose entry_date lies fewer than bank_window_months whole calendar months before today, the whole calendar months from a date to today being the difference between the two calendar months, less one when today's day of the month is lower than that date's: bank_high_usd or more adds bank_high_pct percent; at least bank_low_usd and below bank_high_usd adds bank_low_pct percent; less adds nothing.
    prerequisite: []
    cross_category:
      - category: account
        as: branch
        reads: [variant_name, opened_date]
        note: The standing goodwill reads the level (level_number of the tier) and the opened_date of the customer's Personal Sender Account.
      - category: bank
        as: history
        reads: [bank_ledger.amount_usd]
        note: The Bank Deposit goodwill sums the customer's bank_funds_received entries of the last months.
    compute:
      - misdirected_usd: "SUM('wallet_ledger', 'amount_usd', event_type='wallet_credit_sent')"
      - notice_date: "LATEST('wallet_cases', 'case_date', date_field='case_date', event_type='wallet_error_notice_filed', case_type='wrong_wallet_credited')"
      - finding_date: "LATEST('wallet_cases', 'case_date', date_field='case_date', event_type='wallet_error_decided', case_outcome='error_found')"
      - notice_lag: "DAYS(F('date_available'), notice_date)"
      - misdirect_from: "F('released_at') if P('credit_promise_minutes') > 0 else (F('date_available') if notice_lag <= K('prompt_notice_days') else notice_date)"
      - misdirect_days: "DAYS(misdirect_from, finding_date)"
      - misdirect_pct: "K('misdirect_long_pct') if misdirect_days >= K('misdirect_long_days') else (K('misdirect_mid_pct') if misdirect_days >= K('misdirect_mid_days') else 0)"
      - level_number: "CPARAM('account', 'level_number')"
      - tenure_months: "MONTHS(CFIELD('account', 'opened_date'), NOW)"
      - standing_usd: "K('enhanced_standing_usd') if (level_number >= K('enhanced_level_number') and tenure_months >= K('standing_months')) else (K('verified_plus_standing_usd') if (level_number == K('verified_plus_level_number') and tenure_months >= K('standing_months')) else 0)"
      - bank_volume: "XSUM('bank', 'bank_ledger', 'amount_usd', within_months=K('bank_window_months'), date_field='entry_date', event_type='bank_funds_received')"
      - bank_pct: "K('bank_high_pct') if bank_volume >= K('bank_high_usd') else (K('bank_low_pct') if bank_volume >= K('bank_low_usd') else 0)"
      - result: "RND(misdirected_usd * (1 + (misdirect_pct + bank_pct) / 100) + standing_usd, 2)"
    compute_basis:
      misdirected_usd: "The misdirected principal is the amount_usd of the transfer's wallet_credit_sent entries."
      notice_date: "when the notice came within prompt_notice_days calendar days of date_available, from date_available; otherwise from the notice date."
      finding_date: "The days the money was misdirected are counted in calendar days to the date of the error_found decision"
      notice_lag: "when the notice came within prompt_notice_days calendar days of date_available"
      misdirect_from: "from a starting date set by the transfer's promise and the customer's notice: on a tier whose credit_promise_minutes is above 0, from the date part of released_at; on any other tier, when the notice came within prompt_notice_days calendar days of date_available, from date_available; otherwise from the notice date."
      misdirect_days: "The days the money was misdirected are counted in calendar days to the date of the error_found decision"
      misdirect_pct: "The misdirection goodwill on a wrong-wallet funding follows those days: misdirect_long_days or more adds misdirect_long_pct percent; at least misdirect_mid_days and fewer than misdirect_long_days adds misdirect_mid_pct percent; fewer adds nothing."
      level_number: "The standing goodwill on a wrong-wallet funding follows the customer's Personal Sender Account"
      tenure_months: "with whole calendar months counted from its opened_date to today"
      standing_usd: "a level of Paloma Enhanced or higher (level_number of at least enhanced_level_number) on an account open at least standing_months whole calendar months adds enhanced_standing_usd; the level Paloma Verified Plus (level_number equal to verified_plus_level_number) on an account open at least standing_months whole calendar months adds verified_plus_standing_usd; any other account adds nothing."
      bank_volume: "The Bank Deposit goodwill on a wrong-wallet funding follows the principal of the customer's Bank Deposit payments collected in the last bank_window_months calendar months (their bank_funds_received entries), a rolling window that holds the entries whose entry_date lies fewer than bank_window_months whole calendar months before today, the whole calendar months from a date to today being the difference between the two calendar months, less one when today's day of the month is lower than that date's"
      bank_pct: "bank_high_usd or more adds bank_high_pct percent; at least bank_low_usd and below bank_high_usd adds bank_low_pct percent; less adds nothing."
      result: "the misdirected principal is multiplied once by one plus the sum of the goodwill percentages over 100, the standing goodwill amount is then added, and the total is rounded half up to the cent."
    factors:
      - id: misdirect_clock
        effect: method
        decides: misdirect_from
        bindings: [notice_lag, misdirect_from]
        ladder:
          - when: "the transfer's tier has credit_promise_minutes above 0 (a minute promise)"
            method: "the misdirected days are counted from the date part of released_at"
          - when: "any other tier AND the notice came within prompt_notice_days calendar days of date_available"
            method: "the misdirected days are counted from date_available"
          - when: "otherwise"
            method: "the misdirected days are counted from the notice date"
        baseline:
          misdirect_from: "notice_date"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: misdirection_goodwill
        effect: parameter
        decides: misdirect_pct
        bindings: [misdirect_days, misdirect_pct]
        ladder:
          - when: "the money was misdirected misdirect_long_days calendar days or more"
            value: "K('misdirect_long_pct')"
          - when: "it was misdirected at least misdirect_mid_days and fewer than misdirect_long_days calendar days"
            value: "K('misdirect_mid_pct')"
          - when: "otherwise (fewer than misdirect_mid_days)"
            value: "0"
        baseline:
          misdirect_pct: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: standing_goodwill
        effect: parameter
        decides: standing_usd
        bindings: [level_number, tenure_months, standing_usd]
        ladder:
          - when: "Personal Sender Account at Paloma Enhanced or higher AND open at least standing_months whole calendar months"
            value: "K('enhanced_standing_usd')"
          - when: "Personal Sender Account at Paloma Verified Plus AND open at least standing_months whole calendar months"
            value: "K('verified_plus_standing_usd')"
          - when: "otherwise (a lower level, or an account open fewer than standing_months whole calendar months)"
            value: "0"
        baseline:
          standing_usd: "0"
        evidence: [cross_category, date]
        cross_difficulty: account
      - id: bank_deposit_goodwill
        effect: parameter
        decides: bank_pct
        bindings: [bank_volume, bank_pct]
        ladder:
          - when: "Bank Deposit principal collected in the last bank_window_months calendar months (rolling, counted in whole calendar months back from today) is bank_high_usd or more"
            value: "K('bank_high_pct')"
          - when: "that principal is at least bank_low_usd and below bank_high_usd"
            value: "K('bank_low_pct')"
          - when: "otherwise (below bank_low_usd)"
            value: "0"
        baseline:
          bank_pct: "0"
        evidence: [cross_category, history]
        cross_difficulty: bank
    baseline:
      rule: >-
        The misdirected principal is the amount_usd of the transfer's wallet_credit_sent entries.
        The wrong-wallet funding is the misdirected principal, in USD to the cent.
      params: []
    inputs:
      history:
        - {table: wallet_ledger, aggregate: sum, field: amount_usd, filters: {event_type: wallet_credit_sent}}
        - {table: wallet_cases, aggregate: latest, field: case_date, filters: {event_type: wallet_error_notice_filed, case_type: wrong_wallet_credited}}
        - {table: wallet_cases, aggregate: latest, field: case_date, filters: {event_type: wallet_error_decided, case_outcome: error_found}}
        - {category: bank, table: bank_ledger, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: bank_funds_received}}
      cross_category: [account, bank]

  - id: wallet_ext_wrong_wallet_recredit
    base_policy_refs: [wallet_evt_error_resolution, wallet_evt_release_holds_and_credit, wallet_evt_failed_credit]
    overwrite:
      - base_policy: wallet_evt_failed_credit
        superseded_clause: >-
          A retried or redirected credit uses the transfer's original fx_rate and receive_amount, and date_available is re-disclosed as the retry day.
        replaced_by: >-
          The rate of a wrong-wallet re-credit starts from a base rate set by how long the investigation took and is raised by re-credit points: the points are added together, the base rate is multiplied once by one plus their sum over 100 and rounded half up to 4 decimals, and the amount delivered is the principal held times that rate, rounded half up to 2 decimals.
    trigger: on_request
    subject: [wallet_remedy_chosen, wallet_credit_sent]
    computes: receive_amount
    target_tool: choose_wallet_recredit_d4ef146e
    params:
      long_investigation_days: 5
      mid_investigation_days: 2
      half_margin_share: 0.5
      purpose_floor_usd: 500.00
      purpose_high_points: 0.25
      purpose_low_points: 0.10
      business_top_points: 0.20
      business_base_points: 0.10
      topup_window_months: 6
      topup_high_count: 5
      topup_low_count: 3
      topup_high_points: 0.15
      topup_low_points: 0.08
      size_high_usd: 500.00
      size_low_usd: 100.00
      size_high_points: 0.20
      size_low_points: 0.10
    rule: >-
      After a decision of error_found on a wrong_wallet_credited notice, the customer may choose to have the money re-credited to the transfer's own wallet at no cost (remedy_choice recredit); the choice is the customer's own and is recorded against the notice, and the re-credit sends at once the whole principal Paloma then holds for the transfer, that is its wallet_funds_received, wallet_credit_reversed and wallet_paloma_credit entries less its wallet_credit_sent and wallet_refund_issued entries, as one new wallet_credit_sent entry whose credit_attempt is one more than the credits already sent, the transfer returning to processing with released_at the moment of sending and date_available that day.
      The amount a wrong-wallet re-credit delivers is not fixed until Paloma's funding for that re-credit stands on the transfer's ledger.
      A wrong-wallet re-credit converts the principal held at the transfer's locked fx_rate, and the amount it delivers is that principal times that rate, rounded half up to 2 decimals.
      The rate of a wrong-wallet re-credit starts from a base rate set by how long the investigation took and is raised by re-credit points: the points are added together, the base rate is multiplied once by one plus their sum over 100 and rounded half up to 4 decimals, and the amount delivered is the principal held times that rate, rounded half up to 2 decimals.
      The investigation runs in calendar days from the notice date to the date of the error_found decision: long_investigation_days or more sets the base rate to the booking-day mid-market rate implied by the locked rate, that is the locked rate divided by one minus the margin the transfer carried over 100, rounded half up to 4 decimals; at least mid_investigation_days and fewer than long_investigation_days sets it to the locked rate multiplied by one plus half_margin_share times that margin over 100, rounded half up to 4 decimals; fewer sets it to the locked rate.
      The margin a wrongly credited transfer carried is the tier's fx_margin_pct, less margin_reduction_pct_points when the principal collected on the transfer (its wallet_funds_received entries) is at or above margin_reduction_threshold_usd.
      The purpose points of a wrong-wallet re-credit follow the stated transfer_purpose together with the principal collected: an education or medical transfer of at least purpose_floor_usd earns purpose_high_points; a family_support transfer of at least purpose_floor_usd earns purpose_low_points; any other transfer, or one below purpose_floor_usd, earns nothing.
      The business points of a wrong-wallet re-credit follow the customer's Paloma Business account: an active account on Paloma Business Growth, Pro, Scale or Enterprise earns business_top_points; an active account on Paloma Business Starter or Essentials earns business_base_points; no account, or one that is not active, earns nothing.
      The Top-Up points of a wrong-wallet re-credit follow the customer's Top-Up and Bill Pay orders with status delivered that were ordered in the last topup_window_months calendar months, a rolling window that holds the entries whose ordered_at lies fewer than topup_window_months whole calendar months before today, the whole calendar months from a date to today being the difference between the two calendar months, less one when today's day of the month is lower than that date's: topup_high_count or more earns topup_high_points; at least topup_low_count and fewer than topup_high_count earns topup_low_points; fewer earn nothing.
      The size points of a wrong-wallet re-credit follow the principal Paloma holds for the transfer when it is sent: size_high_usd or more earns size_high_points; at least size_low_usd and below size_high_usd earns size_low_points; less earns nothing.
    prerequisite:
      - problem: wallet_ext_wrong_wallet_funding
        kind: value_input
        gate: held_usd
        form: state
        policy_source: >-
          The amount a wrong-wallet re-credit delivers is not fixed until Paloma's funding for that re-credit stands on the transfer's ledger.
        condition: >-
          a wallet_paloma_credit entry with credit_reason error_recredit stands on the transfer's ledger, so the principal Paloma holds for the transfer is the funding
        resolved_by: fund_wallet_recredit_aebfda78
        effect: >-
          held_usd rises by the wrong-wallet funding booked, which sets the size points and the principal the re-credit converts
    cross_category:
      - category: business
        as: branch
        reads: [status, variant_name]
        note: The business points read the status and plan of the customer's Paloma Business account.
      - category: topup
        as: history
        reads: [topup_orders.status, topup_orders.ordered_at]
        note: The Top-Up points count the customer's delivered Top-Up and Bill Pay orders of the last months.
    compute:
      - held_usd: "SUM('wallet_ledger', 'amount_usd', event_type='wallet_funds_received') + SUM('wallet_ledger', 'amount_usd', event_type='wallet_credit_reversed') + SUM('wallet_ledger', 'amount_usd', event_type='wallet_paloma_credit') - SUM('wallet_ledger', 'amount_usd', event_type='wallet_credit_sent') - SUM('wallet_ledger', 'amount_usd', event_type='wallet_refund_issued')"
      - size_points: "K('size_high_points') if held_usd >= K('size_high_usd') else (K('size_low_points') if held_usd >= K('size_low_usd') else 0)"
      - locked_rate: "F('fx_rate')"
      - principal: "SUM('wallet_ledger', 'amount_usd', event_type='wallet_funds_received')"
      - carried_margin: "P('fx_margin_pct') - (P('margin_reduction_pct_points') if principal >= P('margin_reduction_threshold_usd') else 0)"
      - inv_notice: "LATEST('wallet_cases', 'case_date', date_field='case_date', event_type='wallet_error_notice_filed', case_type='wrong_wallet_credited')"
      - inv_finding: "LATEST('wallet_cases', 'case_date', date_field='case_date', event_type='wallet_error_decided', case_outcome='error_found')"
      - investigation_days: "DAYS(inv_notice, inv_finding)"
      - base_rate: "RND(locked_rate / (1 - carried_margin / 100), 4) if investigation_days >= K('long_investigation_days') else (RND(locked_rate * (1 + K('half_margin_share') * carried_margin / 100), 4) if investigation_days >= K('mid_investigation_days') else locked_rate)"
      - purpose_principal: "SUM('wallet_ledger', 'amount_usd', event_type='wallet_funds_received')"
      - purpose_points: "K('purpose_high_points') if ((F('transfer_purpose') == 'education' or F('transfer_purpose') == 'medical') and purpose_principal >= K('purpose_floor_usd')) else (K('purpose_low_points') if (F('transfer_purpose') == 'family_support' and purpose_principal >= K('purpose_floor_usd')) else 0)"
      - business_status: "CFIELD('business', 'status')"
      - business_plan: "CFIELD('business', 'variant_name')"
      - business_points: "K('business_top_points') if (business_status == 'active' and (business_plan == 'Paloma Business Growth' or business_plan == 'Paloma Business Pro' or business_plan == 'Paloma Business Scale' or business_plan == 'Paloma Business Enterprise')) else (K('business_base_points') if (business_status == 'active' and (business_plan == 'Paloma Business Starter' or business_plan == 'Paloma Business Essentials')) else 0)"
      - delivered_topups: "XCOUNT('topup', 'topup_orders', within_months=K('topup_window_months'), date_field='ordered_at', status='delivered')"
      - topup_points: "K('topup_high_points') if delivered_topups >= K('topup_high_count') else (K('topup_low_points') if delivered_topups >= K('topup_low_count') else 0)"
      - recredit_rate: "RND(base_rate * (1 + (size_points + purpose_points + business_points + topup_points) / 100), 4)"
      - result: "RND(held_usd * recredit_rate, 2)"
    compute_basis:
      held_usd: "the re-credit sends at once the whole principal Paloma then holds for the transfer, that is its wallet_funds_received, wallet_credit_reversed and wallet_paloma_credit entries less its wallet_credit_sent and wallet_refund_issued entries"
      size_points: "The size points of a wrong-wallet re-credit follow the principal Paloma holds for the transfer when it is sent: size_high_usd or more earns size_high_points; at least size_low_usd and below size_high_usd earns size_low_points; less earns nothing."
      locked_rate: "A wrong-wallet re-credit converts the principal held at the transfer's locked fx_rate, and the amount it delivers is that principal times that rate, rounded half up to 2 decimals."
      principal: "less margin_reduction_pct_points when the principal collected on the transfer (its wallet_funds_received entries) is at or above margin_reduction_threshold_usd."
      carried_margin: "The margin a wrongly credited transfer carried is the tier's fx_margin_pct, less margin_reduction_pct_points when the principal collected on the transfer (its wallet_funds_received entries) is at or above margin_reduction_threshold_usd."
      inv_notice: "The investigation runs in calendar days from the notice date to the date of the error_found decision"
      inv_finding: "The investigation runs in calendar days from the notice date to the date of the error_found decision"
      investigation_days: "The investigation runs in calendar days from the notice date to the date of the error_found decision"
      base_rate: "long_investigation_days or more sets the base rate to the booking-day mid-market rate implied by the locked rate, that is the locked rate divided by one minus the margin the transfer carried over 100, rounded half up to 4 decimals; at least mid_investigation_days and fewer than long_investigation_days sets it to the locked rate multiplied by one plus half_margin_share times that margin over 100, rounded half up to 4 decimals; fewer sets it to the locked rate."
      purpose_principal: "The purpose points of a wrong-wallet re-credit follow the stated transfer_purpose together with the principal collected"
      purpose_points: "an education or medical transfer of at least purpose_floor_usd earns purpose_high_points; a family_support transfer of at least purpose_floor_usd earns purpose_low_points; any other transfer, or one below purpose_floor_usd, earns nothing."
      business_status: "The business points of a wrong-wallet re-credit follow the customer's Paloma Business account"
      business_plan: "The business points of a wrong-wallet re-credit follow the customer's Paloma Business account"
      business_points: "an active account on Paloma Business Growth, Pro, Scale or Enterprise earns business_top_points; an active account on Paloma Business Starter or Essentials earns business_base_points; no account, or one that is not active, earns nothing."
      delivered_topups: "The Top-Up points of a wrong-wallet re-credit follow the customer's Top-Up and Bill Pay orders with status delivered that were ordered in the last topup_window_months calendar months, a rolling window that holds the entries whose ordered_at lies fewer than topup_window_months whole calendar months before today, the whole calendar months from a date to today being the difference between the two calendar months, less one when today's day of the month is lower than that date's"
      topup_points: "topup_high_count or more earns topup_high_points; at least topup_low_count and fewer than topup_high_count earns topup_low_points; fewer earn nothing."
      recredit_rate: "the points are added together, the base rate is multiplied once by one plus their sum over 100 and rounded half up to 4 decimals"
      result: "the amount delivered is the principal held times that rate, rounded half up to 2 decimals."
    factors:
      - id: wrong_wallet_rate_basis
        effect: method
        decides: base_rate
        bindings: [inv_notice, inv_finding, investigation_days, base_rate]
        ladder:
          - when: "the investigation (notice date to error_found decision) ran long_investigation_days calendar days or more"
            method: "the base rate is the booking-day mid-market rate implied by the locked rate: locked rate divided by one minus the carried margin over 100, rounded half up to 4 decimals"
          - when: "it ran at least mid_investigation_days and fewer than long_investigation_days calendar days"
            method: "the base rate is the locked rate multiplied by one plus half_margin_share times the carried margin over 100, rounded half up to 4 decimals"
          - when: "otherwise (fewer than mid_investigation_days)"
            method: "the base rate is the locked rate"
        baseline:
          base_rate: "locked_rate"
        evidence: [history, date]
        cross_difficulty: null
      - id: purpose_points
        effect: parameter
        decides: purpose_points
        bindings: [purpose_principal, purpose_points]
        ladder:
          - when: "transfer_purpose education or medical AND principal collected at least purpose_floor_usd"
            value: "K('purpose_high_points')"
          - when: "transfer_purpose family_support AND principal collected at least purpose_floor_usd"
            value: "K('purpose_low_points')"
          - when: "otherwise (any other purpose, or principal below purpose_floor_usd)"
            value: "0"
        baseline:
          purpose_points: "0"
        evidence: [history]
        cross_difficulty: null
      - id: business_points
        effect: parameter
        decides: business_points
        bindings: [business_status, business_plan, business_points]
        ladder:
          - when: "an active Paloma Business account on Growth, Pro, Scale or Enterprise"
            value: "K('business_top_points')"
          - when: "an active Paloma Business account on Starter or Essentials"
            value: "K('business_base_points')"
          - when: "otherwise (no account, or one that is not active)"
            value: "0"
        baseline:
          business_points: "0"
        evidence: [cross_category]
        cross_difficulty: business
      - id: topup_points
        effect: parameter
        decides: topup_points
        bindings: [delivered_topups, topup_points]
        ladder:
          - when: "topup_high_count or more delivered Top-Up and Bill Pay orders ordered in the last topup_window_months calendar months (rolling, counted in whole calendar months back from today)"
            value: "K('topup_high_points')"
          - when: "at least topup_low_count and fewer than topup_high_count such orders"
            value: "K('topup_low_points')"
          - when: "otherwise (fewer than topup_low_count)"
            value: "0"
        baseline:
          topup_points: "0"
        evidence: [cross_category, history]
        cross_difficulty: null
      - id: size_points
        effect: parameter
        decides: size_points
        bindings: [held_usd, size_points]
        ladder:
          - when: "the principal Paloma holds for the transfer is size_high_usd or more"
            value: "K('size_high_points')"
          - when: "it is at least size_low_usd and below size_high_usd"
            value: "K('size_low_points')"
          - when: "otherwise (below size_low_usd)"
            value: "0"
        baseline:
          size_points: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        After a decision of error_found on a wrong_wallet_credited notice, the customer may choose to have the money re-credited to the transfer's own wallet at no cost (remedy_choice recredit); the choice is the customer's own and is recorded against the notice, and the re-credit sends at once the whole principal Paloma then holds for the transfer, that is its wallet_funds_received, wallet_credit_reversed and wallet_paloma_credit entries less its wallet_credit_sent and wallet_refund_issued entries, as one new wallet_credit_sent entry whose credit_attempt is one more than the credits already sent, the transfer returning to processing with released_at the moment of sending and date_available that day.
        A wrong-wallet re-credit converts the principal held at the transfer's locked fx_rate, and the amount it delivers is that principal times that rate, rounded half up to 2 decimals.
      params: []
    inputs:
      history:
        - {table: wallet_ledger, aggregate: sum, field: amount_usd, filters: {event_type: wallet_paloma_credit}}
        - {table: wallet_ledger, aggregate: sum, field: amount_usd, filters: {event_type: wallet_credit_sent}}
        - {table: wallet_cases, aggregate: latest, field: case_date, filters: {event_type: wallet_error_notice_filed, case_type: wrong_wallet_credited}}
        - {table: wallet_cases, aggregate: latest, field: case_date, filters: {event_type: wallet_error_decided, case_outcome: error_found}}
        - {category: topup, table: topup_orders, aggregate: count, field: topup_order_id, within_months: 6, filters: {status: delivered}}
      cross_category: [business, topup]
