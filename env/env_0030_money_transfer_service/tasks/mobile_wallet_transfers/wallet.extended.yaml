  - id: wallet_evt_funding_and_rate_lock
    subject: [wallet_funds_received, wallet_rate_requoted, wallet_transfer_auto_cancelled]
    rule: >-
      Card and pay-by-bank payments are collected at booking, an ACH debit when it settles and a wire
      when it arrives. The quoted rate is guaranteed for rate_lock_hours elapsed hours from booked_at.
      A rate is re-quoted only when funds are collected more than rate_lock_hours after the transfer
      was booked. Lock hours are counted as elapsed hours from booked_at to the moment the funds are
      collected. A re-quote uses the rate sheet for the collection date with the same margin rule,
      re-discloses fx_rate, receive_amount and date_available, and never changes fees. On a tier
      whose funding_deadline_hours is above 0, Paloma cancels a wire-funded booking
      whose funds have not arrived by booked_at plus funding_deadline_hours elapsed hours. When an
      ACH debit is returned unpaid before release or a card capture fails, Paloma cancels the
      transfer with hold_reason funding_failed. Nothing is owed back on a cancellation for missing or
      failed funding, and the transfer stays cancelled.
    eligibility:
      - id: rate_lock_lapsed
        applies_to: [wallet_rate_requoted]
        kind: time
        condition: "A rate is re-quoted only when funds are collected more than rate_lock_hours after the transfer was booked."
        evidence_fields: [wallet_transfers.wallet_transfer_id, wallet_transfers.booked_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_transfers.wallet_transfer_id]
          action_bindings:
            wallet_transfers.wallet_transfer_id: wallet_transfer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the transfer was booked"
          anchor_source: wallet_transfers.booked_at
          relation: not_before
          duration_source: variants.rate_lock_hours
          unit: elapsed_hours
          counting_rule: "Lock hours are counted as elapsed hours from booked_at to the moment the funds are collected."
          boundary: exclusive
    params:
      per_tier:
        Mobile Wallet Micro: {rate_lock_hours: "=rate_lock_hours", funding_deadline_hours: "=funding_deadline_hours"}
        Mobile Wallet Economy: {rate_lock_hours: "=rate_lock_hours", funding_deadline_hours: "=funding_deadline_hours"}
        Mobile Wallet Express: {rate_lock_hours: "=rate_lock_hours", funding_deadline_hours: "=funding_deadline_hours"}
        Mobile Wallet Express Plus: {rate_lock_hours: "=rate_lock_hours", funding_deadline_hours: "=funding_deadline_hours"}
        Mobile Wallet Priority: {rate_lock_hours: "=rate_lock_hours", funding_deadline_hours: "=funding_deadline_hours"}
        Mobile Wallet Large Amount: {rate_lock_hours: "=rate_lock_hours", funding_deadline_hours: "=funding_deadline_hours"}

  - id: wallet_evt_release_holds_and_credit
    subject: [wallet_released, wallet_hold_placed, wallet_hold_released, wallet_credit_sent, wallet_credit_confirmed, wallet_credit_reversed, wallet_credit_failed_marked, wallet_rfi_answer_logged, wallet_transfer_auto_cancelled]
    rule: >-
      A transfer is released once its principal is collected (or ACH principal is released early
      within the account's allowance) and any new-recipient cooling-off has run; release sends the
      first credit (credit_attempt 1) at the transfer's fx_rate and records released_at. A credit the
      provider cannot complete for a technical reason (provider_unavailable) is re-sent automatically
      up to auto_retry_attempts times, auto_retry_interval_minutes apart, before it is treated as
      failed. Any other rejection (wallet_limit_exceeded, wallet_not_registered,
      wallet_name_mismatch, wallet_number_invalid, wallet_suspended) fails the credit at once: the
      principal comes back in full and the transfer becomes credit_failed, handled under
      wallet_evt_failed_credit. Compliance may hold a transfer before or during processing; a hold
      with hold_reason rfi_transfer asks the customer for information. An answer is logged only
      while the transfer is on_hold with hold_reason rfi_transfer. Each upload reference is logged
      once. Only compliance releases a hold, within hold_review_business_days Paloma business days
      of a complete answer, and date_available is then re-disclosed from the release. A held
      transfer is cancelled by Paloma when its request for information goes unanswered for more than
      rfi_response_days calendar days after held_at, or when compliance rejects it. When the
      provider confirms the credit the transfer is credited, earning Paloma Rewards points.
    eligibility:
      - id: rfi_hold_open
        applies_to: [wallet_rfi_answer_logged]
        kind: state
        condition: "An answer is logged only while the transfer is on_hold with hold_reason rfi_transfer."
        evidence_fields: [wallet_transfers.wallet_transfer_id, wallet_transfers.status, wallet_transfers.hold_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_transfers.wallet_transfer_id]
          action_bindings:
            wallet_transfers.wallet_transfer_id: wallet_transfer_id
        state_contract:
          field: wallet_transfers.status
          allowed: [on_hold]
      - id: one_log_per_upload
        applies_to: [wallet_rfi_answer_logged]
        kind: dedup
        condition: "Each upload reference is logged once."
        evidence_fields: [wallet_cases.doc_reference, wallet_cases.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_cases.doc_reference]
          action_bindings:
            wallet_cases.doc_reference: doc_reference
        dedup_contract:
          table: wallet_cases
          mode: separate_record
          object_bindings: {doc_reference: doc_reference}
          duplicate_filters: {event_type: [wallet_rfi_answer_logged]}
          distinct_fields: []
    params:
      per_tier:
        Mobile Wallet Micro: {auto_retry_attempts: "=auto_retry_attempts", auto_retry_interval_minutes: "=auto_retry_interval_minutes", hold_review_business_days: "=hold_review_business_days", rfi_response_days: "=rfi_response_days"}
        Mobile Wallet Economy: {auto_retry_attempts: "=auto_retry_attempts", auto_retry_interval_minutes: "=auto_retry_interval_minutes", hold_review_business_days: "=hold_review_business_days", rfi_response_days: "=rfi_response_days"}
        Mobile Wallet Express: {auto_retry_attempts: "=auto_retry_attempts", auto_retry_interval_minutes: "=auto_retry_interval_minutes", hold_review_business_days: "=hold_review_business_days", rfi_response_days: "=rfi_response_days"}
        Mobile Wallet Express Plus: {auto_retry_attempts: "=auto_retry_attempts", auto_retry_interval_minutes: "=auto_retry_interval_minutes", hold_review_business_days: "=hold_review_business_days", rfi_response_days: "=rfi_response_days"}
        Mobile Wallet Priority: {auto_retry_attempts: "=auto_retry_attempts", auto_retry_interval_minutes: "=auto_retry_interval_minutes", hold_review_business_days: "=hold_review_business_days", rfi_response_days: "=rfi_response_days"}
        Mobile Wallet Large Amount: {auto_retry_attempts: "=auto_retry_attempts", auto_retry_interval_minutes: "=auto_retry_interval_minutes", hold_review_business_days: "=hold_review_business_days", rfi_response_days: "=rfi_response_days"}

  - id: wallet_evt_failed_credit
    subject: [wallet_credit_retried, wallet_redirect_requested, wallet_destination_updated, wallet_fee_charged]
    rule: >-
      A failed credit waits with Paloma for the customer's instruction. The failure reason's entry in
      failure_reason_attribution decides who bears its cost. The customer may have the credit retried
      to the same wallet once the recipient has fixed its cause (registered the wallet, raised its
      provider limit, lifted a suspension), or redirected to another wallet. A retry or redirect is
      possible only within failed_credit_hold_days calendar days after the credit failed. The window
      is counted in calendar days from the date part of failed_at, and an instruction on the last
      day of the window is on time. A retry or redirect is accepted only while the transfer is credit_failed. A
      redirect is allowed only on a tier whose redirect_allowed is true, only to another wallet
      registered in the recipient's own name when same_recipient_redirect_only is true, only to a
      provider listed for the corridor, and at most max_redirects times per transfer
      (wallet_msr_redirects); the new wallet details are recorded exactly as the customer gives them
      and the credit is then sent to them. Paying a different person requires a refund and a new
      booking. A transfer may receive at most max_retries customer-requested retries
      (wallet_msr_customer_retries). After a failure on the sender's side, each retry beyond
      free_retries carries retry_fee_usd (fee_type retry_fee, fee_seq the retry number) and each
      redirect carries redirect_fee_usd (fee_type redirect_fee, fee_seq the redirect number) when
      above 0.00; after a failure on Paloma's side retries and redirects are free and do not count
      toward max_retries. A retried or redirected credit uses the transfer's original fx_rate and
      receive_amount, and date_available is re-disclosed as the retry day. With no instruction by
      the end of the window, or once max_retries is used up, the transfer is refunded under
      wallet_evt_refunds.
    eligibility:
      - id: retry_window
        applies_to: [wallet_credit_retried, wallet_redirect_requested]
        kind: time
        condition: "A retry or redirect is possible only within failed_credit_hold_days calendar days after the credit failed."
        evidence_fields: [wallet_transfers.wallet_transfer_id, wallet_transfers.failed_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_transfers.wallet_transfer_id]
          action_bindings:
            wallet_transfers.wallet_transfer_id: wallet_transfer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the credit failed"
          anchor_source: wallet_transfers.failed_at
          relation: not_after
          duration_source: variants.failed_credit_hold_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days from the date part of failed_at, and an instruction on the last day of the window is on time."
          boundary: inclusive
      - id: failed_status
        applies_to: [wallet_redirect_requested]
        kind: state
        condition: "A retry or redirect is accepted only while the transfer is credit_failed."
        evidence_fields: [wallet_transfers.wallet_transfer_id, wallet_transfers.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_transfers.wallet_transfer_id]
          action_bindings:
            wallet_transfers.wallet_transfer_id: wallet_transfer_id
        state_contract:
          field: wallet_transfers.status
          allowed: [credit_failed]
      - id: redirect_rules
        applies_to: [wallet_redirect_requested]
        kind: authorization
        condition: "A redirect is allowed only on a tier whose redirect_allowed is true, only to another wallet registered in the recipient's own name when same_recipient_redirect_only is true, only to a provider listed for the corridor, and at most max_redirects times per transfer (wallet_msr_redirects)"
        evidence_fields: [wallet_transfers.wallet_transfer_id, wallet_transfers.variant_name, wallet_transfers.recipient_id, wallet_cases.wallet_transfer_id, wallet_cases.redirect_seq]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [wallet_transfers.wallet_transfer_id, wallet_cases.wallet_transfer_id]
          action_bindings:
            wallet_transfers.wallet_transfer_id: wallet_transfer_id
            wallet_cases.wallet_transfer_id: wallet_transfer_id
      - id: retry_cap
        applies_to: [wallet_credit_retried]
        kind: authorization
        condition: "A transfer may receive at most max_retries customer-requested retries (wallet_msr_customer_retries)."
        evidence_fields: [wallet_ledger.wallet_transfer_id, wallet_ledger.event_type, wallet_ledger.credit_attempt]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_ledger.wallet_transfer_id]
          action_bindings:
            wallet_ledger.wallet_transfer_id: wallet_transfer_id
    params:
      per_tier:
        Mobile Wallet Micro: {failure_reason_attribution: "=failure_reason_attribution", failed_credit_hold_days: "=failed_credit_hold_days", free_retries: "=free_retries", retry_fee_usd: "=retry_fee_usd", max_retries: "=max_retries", redirect_allowed: "=redirect_allowed", redirect_fee_usd: "=redirect_fee_usd", max_redirects: "=max_redirects", same_recipient_redirect_only: "=same_recipient_redirect_only", providers_by_corridor: "=providers_by_corridor"}
        Mobile Wallet Economy: {failure_reason_attribution: "=failure_reason_attribution", failed_credit_hold_days: "=failed_credit_hold_days", free_retries: "=free_retries", retry_fee_usd: "=retry_fee_usd", max_retries: "=max_retries", redirect_allowed: "=redirect_allowed", redirect_fee_usd: "=redirect_fee_usd", max_redirects: "=max_redirects", same_recipient_redirect_only: "=same_recipient_redirect_only", providers_by_corridor: "=providers_by_corridor"}
        Mobile Wallet Express: {failure_reason_attribution: "=failure_reason_attribution", failed_credit_hold_days: "=failed_credit_hold_days", free_retries: "=free_retries", retry_fee_usd: "=retry_fee_usd", max_retries: "=max_retries", redirect_allowed: "=redirect_allowed", redirect_fee_usd: "=redirect_fee_usd", max_redirects: "=max_redirects", same_recipient_redirect_only: "=same_recipient_redirect_only", providers_by_corridor: "=providers_by_corridor"}
        Mobile Wallet Express Plus: {failure_reason_attribution: "=failure_reason_attribution", failed_credit_hold_days: "=failed_credit_hold_days", free_retries: "=free_retries", retry_fee_usd: "=retry_fee_usd", max_retries: "=max_retries", redirect_allowed: "=redirect_allowed", redirect_fee_usd: "=redirect_fee_usd", max_redirects: "=max_redirects", same_recipient_redirect_only: "=same_recipient_redirect_only", providers_by_corridor: "=providers_by_corridor"}
        Mobile Wallet Priority: {failure_reason_attribution: "=failure_reason_attribution", failed_credit_hold_days: "=failed_credit_hold_days", free_retries: "=free_retries", retry_fee_usd: "=retry_fee_usd", max_retries: "=max_retries", redirect_allowed: "=redirect_allowed", redirect_fee_usd: "=redirect_fee_usd", max_redirects: "=max_redirects", same_recipient_redirect_only: "=same_recipient_redirect_only", providers_by_corridor: "=providers_by_corridor"}
        Mobile Wallet Large Amount: {failure_reason_attribution: "=failure_reason_attribution", failed_credit_hold_days: "=failed_credit_hold_days", free_retries: "=free_retries", retry_fee_usd: "=retry_fee_usd", max_retries: "=max_retries", redirect_allowed: "=redirect_allowed", redirect_fee_usd: "=redirect_fee_usd", max_redirects: "=max_redirects", same_recipient_redirect_only: "=same_recipient_redirect_only", providers_by_corridor: "=providers_by_corridor"}
    measures: [wallet_msr_customer_retries, wallet_msr_redirects]

  - id: wallet_evt_cancellation
    subject: [wallet_transfer_cancelled, wallet_fee_refunded]
    rule: >-
      Only the customer can cancel their own transfer; the agent explains what will be refunded and
      the customer confirms. A wallet transfer can be cancelled only before it is released, while it
      is awaiting_funds or on_hold; once a credit has been sent it cannot be cancelled, and a failed
      credit is refunded under wallet_evt_refunds instead. A fee is refunded in full on cancellation
      only when the customer confirms the cancellation within cancel_full_refund_window_hours
      elapsed hours after the transfer was booked. The window is measured in elapsed hours from
      booked_at to cancelled_at, and a cancellation at exactly the end of the window is inside it.
      Inside the window every fee collected is refunded with fee_refund_reason
      cancellation_in_window. After the window each booking fee collected is refunded at
      late_cancel_fee_refund_pct of its amount, rounded half up to the cent, with fee_refund_reason
      cancellation_post_window. The principal is always refunded in full under wallet_evt_refunds.
      Each fee charge is refunded at most once.
    eligibility:
      - id: full_refund_window
        applies_to: [wallet_fee_refunded]
        kind: time
        condition: "A fee is refunded in full on cancellation only when the customer confirms the cancellation within cancel_full_refund_window_hours elapsed hours after the transfer was booked."
        evidence_fields: [wallet_transfers.wallet_transfer_id, wallet_transfers.booked_at, wallet_transfers.cancelled_at]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_transfers.wallet_transfer_id]
          action_bindings:
            wallet_transfers.wallet_transfer_id: wallet_transfer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the transfer was booked"
          anchor_source: wallet_transfers.booked_at
          relation: not_after
          duration_source: variants.cancel_full_refund_window_hours
          unit: elapsed_hours
          counting_rule: "The window is measured in elapsed hours from booked_at to cancelled_at, and a cancellation at exactly the end of the window is inside it."
          boundary: inclusive
      - id: fee_refunded_once
        applies_to: [wallet_fee_refunded]
        kind: dedup
        condition: "Each fee charge is refunded at most once."
        evidence_fields: [wallet_ledger.related_entry_id, wallet_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_ledger.related_entry_id]
          action_bindings:
            wallet_ledger.related_entry_id: related_entry_id
        dedup_contract:
          table: wallet_ledger
          mode: separate_record
          object_bindings: {related_entry_id: related_entry_id}
          duplicate_filters: {event_type: [wallet_fee_refunded]}
          distinct_fields: []
    params:
      per_tier:
        Mobile Wallet Micro: {cancel_full_refund_window_hours: "=cancel_full_refund_window_hours", late_cancel_fee_refund_pct: "=late_cancel_fee_refund_pct"}
        Mobile Wallet Economy: {cancel_full_refund_window_hours: "=cancel_full_refund_window_hours", late_cancel_fee_refund_pct: "=late_cancel_fee_refund_pct"}
        Mobile Wallet Express: {cancel_full_refund_window_hours: "=cancel_full_refund_window_hours", late_cancel_fee_refund_pct: "=late_cancel_fee_refund_pct"}
        Mobile Wallet Express Plus: {cancel_full_refund_window_hours: "=cancel_full_refund_window_hours", late_cancel_fee_refund_pct: "=late_cancel_fee_refund_pct"}
        Mobile Wallet Priority: {cancel_full_refund_window_hours: "=cancel_full_refund_window_hours", late_cancel_fee_refund_pct: "=late_cancel_fee_refund_pct"}
        Mobile Wallet Large Amount: {cancel_full_refund_window_hours: "=cancel_full_refund_window_hours", late_cancel_fee_refund_pct: "=late_cancel_fee_refund_pct"}
    formula:
      late_fee_refund: "round(amount_usd * late_cancel_fee_refund_pct / 100, 2)"

  - id: wallet_evt_refunds
    subject: [wallet_refund_issued, wallet_transfer_refunded, wallet_fee_refunded]
    rule: >-
      Principal is refunded only on a transfer whose status is cancelled, credit_failed or credited,
      and on a credited transfer only as an error-resolution remedy. The amount follows the refund
      basis: cancellation refunds the principal collected; failed_credit refunds the principal
      collected in full, because a failed credit comes back in full; rfi_expiry and
      compliance_rejection refund the principal collected and each booking fee at
      rfi_expiry_fee_refund_pct with fee_refund_reason compliance_cancellation; error_resolution
      and error_shortfall refund what wallet_evt_error_resolution sets. On a failed_credit refund the transfer fee is
      refunded in full with fee_refund_reason failure_paloma_side when the last failure was on
      Paloma's side, and at sender_side_failure_fee_refund_pct with fee_refund_reason
      failure_sender_side when it was on the recipient's side; card funding, retry and redirect fees
      are not refunded after a sender-side failure. Each refund basis is paid once against its source
      entry. A refund is issued within refund_business_days Paloma business days of the day it became
      owed (the cancellation, the customer's choice, or the end of failed_credit_hold_days), to the
      original funding method; a wire is refunded by ACH credit to the account it came from. Once the
      principal refund is booked the transfer moves to refunded, except that a shortfall refund
      (error_shortfall) leaves a credited transfer credited.
    eligibility:
      - id: refundable_status
        applies_to: [wallet_refund_issued]
        kind: state
        condition: "Principal is refunded only on a transfer whose status is cancelled, credit_failed or credited, and on a credited transfer only as an error-resolution remedy."
        evidence_fields: [wallet_transfers.wallet_transfer_id, wallet_transfers.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_transfers.wallet_transfer_id]
          action_bindings:
            wallet_transfers.wallet_transfer_id: wallet_transfer_id
        state_contract:
          field: wallet_transfers.status
          allowed: [cancelled, credit_failed, credited]
      - id: refund_once_per_basis
        applies_to: [wallet_refund_issued]
        kind: dedup
        condition: "Each refund basis is paid once against its source entry."
        evidence_fields: [wallet_ledger.wallet_transfer_id, wallet_ledger.refund_basis, wallet_ledger.related_entry_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_ledger.wallet_transfer_id, wallet_ledger.related_entry_id]
          action_bindings:
            wallet_ledger.wallet_transfer_id: wallet_transfer_id
            wallet_ledger.related_entry_id: related_entry_id
        dedup_contract:
          table: wallet_ledger
          mode: separate_record
          object_bindings: {wallet_transfer_id: wallet_transfer_id, related_entry_id: related_entry_id}
          duplicate_filters: {event_type: [wallet_refund_issued]}
          distinct_fields: [refund_basis]
    params:
      per_tier:
        Mobile Wallet Micro: {refund_business_days: "=refund_business_days", rfi_expiry_fee_refund_pct: "=rfi_expiry_fee_refund_pct", sender_side_failure_fee_refund_pct: "=sender_side_failure_fee_refund_pct", failure_reason_attribution: "=failure_reason_attribution"}
        Mobile Wallet Economy: {refund_business_days: "=refund_business_days", rfi_expiry_fee_refund_pct: "=rfi_expiry_fee_refund_pct", sender_side_failure_fee_refund_pct: "=sender_side_failure_fee_refund_pct", failure_reason_attribution: "=failure_reason_attribution"}
        Mobile Wallet Express: {refund_business_days: "=refund_business_days", rfi_expiry_fee_refund_pct: "=rfi_expiry_fee_refund_pct", sender_side_failure_fee_refund_pct: "=sender_side_failure_fee_refund_pct", failure_reason_attribution: "=failure_reason_attribution"}
        Mobile Wallet Express Plus: {refund_business_days: "=refund_business_days", rfi_expiry_fee_refund_pct: "=rfi_expiry_fee_refund_pct", sender_side_failure_fee_refund_pct: "=sender_side_failure_fee_refund_pct", failure_reason_attribution: "=failure_reason_attribution"}
        Mobile Wallet Priority: {refund_business_days: "=refund_business_days", rfi_expiry_fee_refund_pct: "=rfi_expiry_fee_refund_pct", sender_side_failure_fee_refund_pct: "=sender_side_failure_fee_refund_pct", failure_reason_attribution: "=failure_reason_attribution"}
        Mobile Wallet Large Amount: {refund_business_days: "=refund_business_days", rfi_expiry_fee_refund_pct: "=rfi_expiry_fee_refund_pct", sender_side_failure_fee_refund_pct: "=sender_side_failure_fee_refund_pct", failure_reason_attribution: "=failure_reason_attribution"}

  - id: wallet_evt_error_resolution
    subject: [wallet_error_notice_filed, wallet_error_decided, wallet_remedy_chosen, wallet_paloma_credit, wallet_fee_refunded]
    rule: >-
      Under the Remittance Transfer Rule the customer may give notice of an error: the money was not
      in the wallet by date_available (not_received_by_date), it was credited to a wallet other than
      the one on the transfer (wrong_wallet_credited), or less than the disclosed receive_amount was
      credited (incorrect_amount). The notice is the customer's own assertion and the customer gives
      it. A notice can be given only within error_notice_window_days calendar days after the
      disclosed date of availability. The window is counted in calendar days from date_available,
      and a notice on date_available plus the window days is on time. Only one notice of each
      case_type may be open on a transfer at a time. resolution_due_date is the notice date plus
      error_investigation_days calendar days. The team decides no_error when the cause lies with the
      customer (a wallet number the customer supplied belonged to someone else) and error_found
      otherwise. On error_found every fee collected is refunded with fee_refund_reason paloma_error
      unless already refunded under the on-time promise. A remedy can be chosen only after a
      decision of error_found on that notice. For wrong_wallet_credited the customer chooses a refund
      of the principal or a re-credit to the correct wallet at no cost, funded by Paloma
      (wallet_paloma_credit, credit_reason error_refund or error_recredit); for incorrect_amount
      Paloma credits the shortfall (credit_reason incorrect_amount_shortfall) and the customer
      chooses to have the shortfall re-credited (recredit_shortfall) or refunded (refund_shortfall,
      booked with refund_basis error_shortfall); for not_received_by_date the remedy is the fee
      refund once the credit lands. The choice is the customer's own; a refund is issued within
      refund_business_days and a re-credit within recredit_business_days Paloma business days.
    eligibility:
      - id: notice_window
        applies_to: [wallet_error_notice_filed]
        kind: time
        condition: "A notice can be given only within error_notice_window_days calendar days after the disclosed date of availability."
        evidence_fields: [wallet_transfers.wallet_transfer_id, wallet_transfers.date_available]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_transfers.wallet_transfer_id]
          action_bindings:
            wallet_transfers.wallet_transfer_id: wallet_transfer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the disclosed date of availability"
          anchor_source: wallet_transfers.date_available
          relation: not_after
          duration_source: variants.error_notice_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days from date_available, and a notice on date_available plus the window days is on time."
          boundary: inclusive
      - id: one_open_notice_per_type
        applies_to: [wallet_error_notice_filed]
        kind: dedup
        condition: "Only one notice of each case_type may be open on a transfer at a time."
        evidence_fields: [wallet_cases.wallet_transfer_id, wallet_cases.case_type, wallet_cases.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_cases.wallet_transfer_id]
          action_bindings:
            wallet_cases.wallet_transfer_id: wallet_transfer_id
        dedup_contract:
          table: wallet_cases
          mode: separate_record
          object_bindings: {wallet_transfer_id: wallet_transfer_id, case_type: case_type}
          duplicate_filters: {event_type: [wallet_error_notice_filed]}
          distinct_fields: [case_date]
      - id: error_found_first
        applies_to: [wallet_remedy_chosen]
        kind: authorization
        condition: "A remedy can be chosen only after a decision of error_found on that notice."
        evidence_fields: [wallet_cases.related_case_id, wallet_cases.case_outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_cases.related_case_id]
          action_bindings:
            wallet_cases.related_case_id: related_case_id
    params:
      per_tier:
        Mobile Wallet Micro: {error_notice_window_days: "=error_notice_window_days", error_investigation_days: "=error_investigation_days", refund_business_days: "=refund_business_days", recredit_business_days: "=recredit_business_days"}
        Mobile Wallet Economy: {error_notice_window_days: "=error_notice_window_days", error_investigation_days: "=error_investigation_days", refund_business_days: "=refund_business_days", recredit_business_days: "=recredit_business_days"}
        Mobile Wallet Express: {error_notice_window_days: "=error_notice_window_days", error_investigation_days: "=error_investigation_days", refund_business_days: "=refund_business_days", recredit_business_days: "=recredit_business_days"}
        Mobile Wallet Express Plus: {error_notice_window_days: "=error_notice_window_days", error_investigation_days: "=error_investigation_days", refund_business_days: "=refund_business_days", recredit_business_days: "=recredit_business_days"}
        Mobile Wallet Priority: {error_notice_window_days: "=error_notice_window_days", error_investigation_days: "=error_investigation_days", refund_business_days: "=refund_business_days", recredit_business_days: "=recredit_business_days"}
        Mobile Wallet Large Amount: {error_notice_window_days: "=error_notice_window_days", error_investigation_days: "=error_investigation_days", refund_business_days: "=refund_business_days", recredit_business_days: "=recredit_business_days"}

  - id: wallet_evt_on_time_promise
    subject: [wallet_fee_refunded]
    rule: >-
      On a tier whose on_time_promise is true, Paloma refunds the transfer fee in full, with
      fee_refund_reason late_delivery, when the credit landed late for a reason on Paloma's or the
      provider's side: on a tier whose credit_promise_minutes is above 0, when credited_at is more
      than credit_promise_minutes after the latest released_at; on any other tier, when the date of
      credited_at is after date_available as last disclosed. Lateness caused by the recipient's
      wallet (a sender-side failure and its retry) or by a request for information answered late is
      not covered. The promise covers the transfer fee only, can be claimed from an agent without an
      error notice, and never stacks with an error-resolution fee refund.
    eligibility:
      - id: credited_late
        applies_to: [wallet_fee_refunded]
        kind: authorization
        condition: "On a tier whose on_time_promise is true, Paloma refunds the transfer fee in full, with fee_refund_reason late_delivery, when the credit landed late for a reason on Paloma's or the provider's side"
        evidence_fields: [wallet_transfers.wallet_transfer_id, wallet_transfers.released_at, wallet_transfers.credited_at, wallet_transfers.date_available, wallet_transfers.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_transfers.wallet_transfer_id]
          action_bindings:
            wallet_transfers.wallet_transfer_id: wallet_transfer_id
    params:
      per_tier:
        Mobile Wallet Micro: {on_time_promise: "=on_time_promise", credit_promise_minutes: "=credit_promise_minutes"}
        Mobile Wallet Economy: {on_time_promise: "=on_time_promise", credit_promise_minutes: "=credit_promise_minutes"}
        Mobile Wallet Express: {on_time_promise: "=on_time_promise", credit_promise_minutes: "=credit_promise_minutes"}
        Mobile Wallet Express Plus: {on_time_promise: "=on_time_promise", credit_promise_minutes: "=credit_promise_minutes"}
        Mobile Wallet Priority: {on_time_promise: "=on_time_promise", credit_promise_minutes: "=credit_promise_minutes"}
        Mobile Wallet Large Amount: {on_time_promise: "=on_time_promise", credit_promise_minutes: "=credit_promise_minutes"}

extended_policies:
  # ------------------------------------------------------------------ task 0
  - id: wallet_ext_resend_charge
    base_policy_refs: [wallet_evt_pricing, wallet_evt_failed_credit]
    overwrite:
      - base_policy: wallet_evt_failed_credit
        superseded_clause: >-
          After a failure on the sender's side, each retry beyond free_retries carries retry_fee_usd (fee_type retry_fee, fee_seq the retry number)
        replaced_by: >-
          The charge form is taken first; it is multiplied once by the customer's share, by one minus the account-standing relief, by one minus the Bank Deposit relief and by the bounce taper, all acting on that same figure, and the product is rounded half up to the cent.
    trigger: on_request
    subject: [wallet_fee_charged]
    computes: amount_usd
    target_tool: charge_resend_fee_8300b1da
    params:
      mid_band_usd: 1000.00
      large_band_usd: 1500.00
      mid_band_pct: 0.10
      large_band_pct: 0.25
      transient_cause_share: 0.80
      enhanced_level_number: 4
      verified_plus_level_number: 3
      tenure_relief_months: 24
      enhanced_relief_share: 1.00
      verified_plus_relief_share: 0.50
      bank_volume_window_months: 6
      bank_volume_high_usd: 3000.00
      bank_volume_low_usd: 1000.00
      bank_volume_high_relief: 0.30
      bank_volume_low_relief: 0.15
      three_bounce_count: 3
      two_bounce_count: 2
      taper_three_bounces: 0.70
      taper_two_bounces: 0.85
    rule: >-
      A resend charge is booked when the customer instructs Paloma to send a bounced credit again to the
      same wallet: one wallet_fee_charged entry with fee_type retry_fee, dated the day of the instruction and
      collected from the customer's original funding method, whose fee_seq is the resend's number.
      The resend's number is the number of credits already sent on the transfer (its wallet_credit_sent entries), so the opening resend of a transfer is number 1.
      A resend whose number is not above the tier's free_retries carries no charge.
      A resend whose number is above the tier's free_retries is booked even when its charge comes to 0.00.
      For a resend above the tier's free_retries the resend charge is the tier's retry_fee_usd.
      The form of the resend charge follows the principal collected on the transfer (its wallet_funds_received entries): at or above large_band_usd the charge is large_band_pct percent of that principal, rounded half up to the cent; at or above mid_band_usd and below large_band_usd it is the tier's retry_fee_usd plus mid_band_pct percent of that principal, the percentage part rounded half up to the cent; below mid_band_usd it is the tier's retry_fee_usd.
      The cause of the latest bounce on the transfer (the failure_reason of its most recent wallet_credit_reversed entry) sets the share of the resend charge the customer bears: none when the cause is on Paloma's or the provider's side (provider_unavailable); transient_cause_share when the recipient's wallet was over its limit or suspended (wallet_limit_exceeded or wallet_suspended); the whole charge for any other recipient-side cause.
      The account-standing relief on a resend charge follows the customer's Personal Sender Account: a level of Paloma Enhanced or higher (level_number of at least enhanced_level_number) on an account open at least tenure_relief_months whole calendar months relieves enhanced_relief_share of the charge; the level Paloma Verified Plus (level_number equal to verified_plus_level_number) on an account open at least tenure_relief_months whole calendar months relieves verified_plus_relief_share; any other account, including one open fewer than tenure_relief_months whole calendar months, receives no relief.
      Whole calendar months are counted from the account's opened_date to today.
      The Bank Deposit relief on a resend charge follows the principal of the customer's Bank Deposit payments collected in the last bank_volume_window_months calendar months (their bank_funds_received entries), a rolling window that holds the entries whose entry_date lies fewer than bank_volume_window_months whole calendar months before today, the whole calendar months from a date to today being the difference between the two calendar months, less one when today's day of the month is lower than that date's: bank_volume_high_usd or more relieves bank_volume_high_relief of the charge; at least bank_volume_low_usd and below bank_volume_high_usd relieves bank_volume_low_relief; less relieves nothing.
      The bounce taper on a resend charge follows the number of bounces on the transfer (its wallet_credit_reversed entries): three_bounce_count or more multiplies the charge by taper_three_bounces; exactly two_bounce_count multiplies it by taper_two_bounces; a single bounce leaves it whole.
      The charge form is taken first; it is multiplied once by the customer's share, by one minus the account-standing relief, by one minus the Bank Deposit relief and by the bounce taper, all acting on that same figure, and the product is rounded half up to the cent.
      How the transfer was paid sets how that rounded figure is collected: for a transfer paid by credit card (a card_funding_fee entry stands on its ledger) it is raised by the tier's credit_card_fee_pct percent and rounded half up to the cent; for a transfer paid by pay-by-bank (funding_method pay_by_bank) the tier's pay_by_bank_fee_discount_usd is taken off, never below 0.00; for a transfer paid by debit card, ACH debit or wire it is collected as it stands.
      The figure so collected is the resend charge booked.
    prerequisite: []
    cross_category:
      - category: account
        as: branch
        reads: [variant_name, opened_date]
        note: The account-standing relief reads the level (level_number of the account's tier) and the opened_date of the customer's Personal Sender Account.
      - category: bank
        as: history
        reads: [bank_ledger.amount_usd]
        note: The Bank Deposit relief sums the customer's bank_funds_received entries of the last months.
    compute:
      - principal: "SUM('wallet_ledger', 'amount_usd', event_type='wallet_funds_received')"
      - resend_no: "COUNT('wallet_ledger', event_type='wallet_credit_sent')"
      - charge_applies: "1 if resend_no > P('free_retries') else 0"
      - charge_form: "RND(principal * K('large_band_pct') / 100, 2) if principal >= K('large_band_usd') else (P('retry_fee_usd') + RND(principal * K('mid_band_pct') / 100, 2) if principal >= K('mid_band_usd') else P('retry_fee_usd'))"
      - last_cause: "LATEST('wallet_ledger', 'failure_reason', date_field='entry_date', event_type='wallet_credit_reversed')"
      - cause_share: "0 if last_cause == 'provider_unavailable' else (K('transient_cause_share') if (last_cause == 'wallet_limit_exceeded' or last_cause == 'wallet_suspended') else 1)"
      - level_number: "CPARAM('account', 'level_number')"
      - tenure_months: "MONTHS(CFIELD('account', 'opened_date'), NOW)"
      - standing_relief: "K('enhanced_relief_share') if (level_number >= K('enhanced_level_number') and tenure_months >= K('tenure_relief_months')) else (K('verified_plus_relief_share') if (level_number == K('verified_plus_level_number') and tenure_months >= K('tenure_relief_months')) else 0)"
      - bank_volume: "XSUM('bank', 'bank_ledger', 'amount_usd', within_months=K('bank_volume_window_months'), date_field='entry_date', event_type='bank_funds_received')"
      - bank_relief: "K('bank_volume_high_relief') if bank_volume >= K('bank_volume_high_usd') else (K('bank_volume_low_relief') if bank_volume >= K('bank_volume_low_usd') else 0)"
      - bounces: "COUNT('wallet_ledger', event_type='wallet_credit_reversed')"
      - bounce_taper: "K('taper_three_bounces') if bounces >= K('three_bounce_count') else (K('taper_two_bounces') if bounces == K('two_bounce_count') else 1)"
      - shaped_charge: "RND(charge_form * cause_share * (1 - standing_relief) * (1 - bank_relief) * bounce_taper, 2)"
      - card_fee_entries: "COUNT('wallet_ledger', event_type='wallet_fee_charged', fee_type='card_funding_fee')"
      - collected_charge: "RND(shaped_charge * (1 + P('credit_card_fee_pct') / 100), 2) if card_fee_entries >= 1 else (MX(0, RND(shaped_charge - P('pay_by_bank_fee_discount_usd'), 2)) if F('funding_method') == 'pay_by_bank' else shaped_charge)"
      - result: "collected_charge if charge_applies == 1 else 0"
    compute_basis:
      principal: "The form of the resend charge follows the principal collected on the transfer (its wallet_funds_received entries)"
      resend_no: "The resend's number is the number of credits already sent on the transfer (its wallet_credit_sent entries), so the opening resend of a transfer is number 1."
      charge_applies: "A resend whose number is not above the tier's free_retries carries no charge."
      charge_form: "at or above large_band_usd the charge is large_band_pct percent of that principal, rounded half up to the cent; at or above mid_band_usd and below large_band_usd it is the tier's retry_fee_usd plus mid_band_pct percent of that principal, the percentage part rounded half up to the cent; below mid_band_usd it is the tier's retry_fee_usd."
      last_cause: "The cause of the latest bounce on the transfer (the failure_reason of its most recent wallet_credit_reversed entry) sets the share of the resend charge the customer bears"
      cause_share: "none when the cause is on Paloma's or the provider's side (provider_unavailable); transient_cause_share when the recipient's wallet was over its limit or suspended (wallet_limit_exceeded or wallet_suspended); the whole charge for any other recipient-side cause."
      level_number: "The account-standing relief on a resend charge follows the customer's Personal Sender Account"
      tenure_months: "Whole calendar months are counted from the account's opened_date to today."
      standing_relief: "a level of Paloma Enhanced or higher (level_number of at least enhanced_level_number) on an account open at least tenure_relief_months whole calendar months relieves enhanced_relief_share of the charge; the level Paloma Verified Plus (level_number equal to verified_plus_level_number) on an account open at least tenure_relief_months whole calendar months relieves verified_plus_relief_share; any other account, including one open fewer than tenure_relief_months whole calendar months, receives no relief."
      bank_volume: "The Bank Deposit relief on a resend charge follows the principal of the customer's Bank Deposit payments collected in the last bank_volume_window_months calendar months (their bank_funds_received entries), a rolling window that holds the entries whose entry_date lies fewer than bank_volume_window_months whole calendar months before today, the whole calendar months from a date to today being the difference between the two calendar months, less one when today's day of the month is lower than that date's"
      bank_relief: "bank_volume_high_usd or more relieves bank_volume_high_relief of the charge; at least bank_volume_low_usd and below bank_volume_high_usd relieves bank_volume_low_relief; less relieves nothing."
      bounces: "The bounce taper on a resend charge follows the number of bounces on the transfer (its wallet_credit_reversed entries)"
      bounce_taper: "three_bounce_count or more multiplies the charge by taper_three_bounces; exactly two_bounce_count multiplies it by taper_two_bounces; a single bounce leaves it whole."
      shaped_charge: "The charge form is taken first; it is multiplied once by the customer's share, by one minus the account-standing relief, by one minus the Bank Deposit relief and by the bounce taper, all acting on that same figure, and the product is rounded half up to the cent."
      card_fee_entries: "for a transfer paid by credit card (a card_funding_fee entry stands on its ledger)"
      collected_charge: "How the transfer was paid sets how that rounded figure is collected: for a transfer paid by credit card (a card_funding_fee entry stands on its ledger) it is raised by the tier's credit_card_fee_pct percent and rounded half up to the cent; for a transfer paid by pay-by-bank (funding_method pay_by_bank) the tier's pay_by_bank_fee_discount_usd is taken off, never below 0.00; for a transfer paid by debit card, ACH debit or wire it is collected as it stands."
      result: "The figure so collected is the resend charge booked."
    factors:
      - id: charge_form
        effect: method
        decides: charge_form
        bindings: [principal, charge_form]
        ladder:
          - when: "the principal collected on the transfer is at or above large_band_usd"
            method: "the charge is large_band_pct percent of that principal, rounded half up to the cent"
          - when: "the principal collected is at or above mid_band_usd and below large_band_usd"
            method: "the charge is the tier's retry_fee_usd plus mid_band_pct percent of that principal, the percentage part rounded half up to the cent"
          - when: "otherwise (principal below mid_band_usd)"
            method: "the charge is the tier's retry_fee_usd, flat"
        baseline:
          charge_form: "P('retry_fee_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: cause_share
        effect: parameter
        decides: cause_share
        bindings: [last_cause, cause_share]
        ladder:
          - when: "the latest bounce's failure_reason is provider_unavailable (Paloma's or the provider's side)"
            value: "0"
          - when: "the latest bounce's failure_reason is wallet_limit_exceeded or wallet_suspended"
            value: "K('transient_cause_share')"
          - when: "otherwise (any other recipient-side cause)"
            value: "1"
        baseline:
          cause_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: account_standing_relief
        effect: parameter
        decides: standing_relief
        bindings: [level_number, tenure_months, standing_relief]
        ladder:
          - when: "Personal Sender Account at Paloma Enhanced or higher AND open at least tenure_relief_months whole calendar months"
            value: "K('enhanced_relief_share')"
          - when: "Personal Sender Account at Paloma Verified Plus AND open at least tenure_relief_months whole calendar months"
            value: "K('verified_plus_relief_share')"
          - when: "otherwise (a lower level, or an account open fewer than tenure_relief_months whole calendar months)"
            value: "0"
        baseline:
          standing_relief: "0"
        evidence: [cross_category, date]
        cross_difficulty: account
      - id: bank_deposit_relief
        effect: parameter
        decides: bank_relief
        bindings: [bank_volume, bank_relief]
        ladder:
          - when: "Bank Deposit principal collected in the last bank_volume_window_months calendar months (rolling, counted in whole calendar months back from today) is bank_volume_high_usd or more"
            value: "K('bank_volume_high_relief')"
          - when: "that principal is at least bank_volume_low_usd and below bank_volume_high_usd"
            value: "K('bank_volume_low_relief')"
          - when: "otherwise (below bank_volume_low_usd)"
            value: "0"
        baseline:
          bank_relief: "0"
        evidence: [cross_category, history]
        cross_difficulty: bank
      - id: bounce_taper
        effect: parameter
        decides: bounce_taper
        bindings: [bounces, bounce_taper]
        ladder:
          - when: "the transfer has three_bounce_count or more wallet_credit_reversed entries"
            value: "K('taper_three_bounces')"
          - when: "the transfer has exactly two_bounce_count wallet_credit_reversed entries"
            value: "K('taper_two_bounces')"
          - when: "otherwise (a single bounce)"
            value: "1"
        baseline:
          bounce_taper: "1"
        evidence: [history]
        cross_difficulty: null
      - id: collection_route
        effect: method
        decides: collected_charge
        bindings: [card_fee_entries, collected_charge]
        ladder:
          - when: "the transfer was paid by credit card (a card_funding_fee entry stands on its ledger)"
            method: "the rounded figure is raised by the tier's credit_card_fee_pct percent and rounded half up to the cent"
          - when: "the transfer was paid by pay-by-bank (funding_method pay_by_bank)"
            method: "the tier's pay_by_bank_fee_discount_usd is taken off the rounded figure, never below 0.00"
          - when: "otherwise (paid by debit card, ACH debit or wire)"
            method: "the rounded figure is collected as it stands"
        baseline:
          collected_charge: "shaped_charge"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The resend's number is the number of credits already sent on the transfer (its wallet_credit_sent entries), so the opening resend of a transfer is number 1.
        A resend whose number is not above the tier's free_retries carries no charge.
        For a resend above the tier's free_retries the resend charge is the tier's retry_fee_usd.
      params: [retry_fee_usd, free_retries]
    inputs:
      history:
        - {table: wallet_ledger, aggregate: sum, field: amount_usd, filters: {event_type: wallet_funds_received}}
        - {table: wallet_ledger, aggregate: count, field: ledger_entry_id, filters: {event_type: wallet_credit_sent}}
        - {table: wallet_ledger, aggregate: latest, field: failure_reason, filters: {event_type: wallet_credit_reversed}}
        - {table: wallet_ledger, aggregate: count, field: ledger_entry_id, filters: {event_type: wallet_credit_reversed}}
        - {table: wallet_ledger, aggregate: count, field: ledger_entry_id, filters: {event_type: wallet_fee_charged, fee_type: card_funding_fee}}
        - {category: bank, table: bank_ledger, aggregate: sum, field: amount_usd, within_months: 6, filters: {event_type: bank_funds_received}}
      cross_category: [account, bank]

  - id: wallet_ext_resend_credit
    base_policy_refs: [wallet_evt_failed_credit, wallet_evt_release_holds_and_credit]
    overwrite:
      - base_policy: wallet_evt_failed_credit
        superseded_clause: >-
          A retried or redirected credit uses the transfer's original fx_rate and receive_amount, and date_available is re-disclosed as the retry day.
        replaced_by: >-
          Uplift points raise the locked rate for a resend: the uplifts are added together, the locked rate is multiplied once by one plus their sum over 100 and rounded half up to 4 decimals to give the resend rate, and the amount credited is the principal held times the resend rate, rounded half up to 2 decimals.
    trigger: on_request
    subject: [wallet_credit_retried, wallet_credit_sent]
    computes: receive_amount
    target_tool: resend_failed_credit_8d2e2e1a
    params:
      paid_full_points: 0.20
      paid_partial_points: 0.10
      multi_bounce_count: 2
      held_long_days: 14
      held_mid_days: 7
      held_long_points: 0.30
      held_mid_points: 0.15
      principal_high_usd: 1500.00
      principal_low_usd: 1000.00
      principal_high_points: 0.10
      principal_low_points: 0.05
      cash_window_months: 6
      cash_high_usd: 1000.00
      cash_low_usd: 300.00
      cash_high_points: 0.10
      cash_low_points: 0.05
    rule: >-
      When a bounced credit is sent again to the same wallet at the customer's instruction, the resend carries the whole principal Paloma holds for the transfer, that is its wallet_funds_received, wallet_credit_reversed and wallet_paloma_credit entries less its wallet_credit_sent and wallet_refund_issued entries, as one new wallet_credit_sent entry whose credit_attempt is one more than the credits already sent, and the transfer returns to processing with released_at the moment of sending and date_available the resend day.
      For a resend beyond the tier's free resends, the amount it credits is fixed only after the charge assessed for that resend stands on the transfer's ledger.
      A resend converts the principal held at the transfer's locked fx_rate, and the amount it credits is that principal times that rate, rounded half up to 2 decimals.
      Uplift points raise the locked rate for a resend: the uplifts are added together, the locked rate is multiplied once by one plus their sum over 100 and rounded half up to 4 decimals to give the resend rate, and the amount credited is the principal held times the resend rate, rounded half up to 2 decimals.
      The paid-resend uplift follows the resend charge booked for this resend (the retry_fee entry whose fee_seq is this resend's number, the number of credits already sent): a charge of at least the tier's retry_fee_usd earns paid_full_points; a charge above 0.00 and below the tier's retry_fee_usd earns paid_partial_points; a charge of 0.00, or none, earns nothing.
      The days a resend has waited are counted from a starting date set by the transfer's bounces: when every bounce on the transfer was on Paloma's or the provider's side (provider_unavailable), from the date the transfer was booked; when the transfer bounced at least multi_bounce_count times and at least one bounce was on the recipient's side, from the date of its first bounce (the wallet_credit_reversed entry of credit attempt 1); otherwise, a single recipient-side bounce, from the date part of failed_at, its latest bounce.
      The held-days uplift on a resend follows those days, counted in calendar days to today: held_long_days or more earns held_long_points; at least held_mid_days and fewer than held_long_days earns held_mid_points; fewer earns nothing.
      The principal uplift on a resend follows the principal collected on the transfer (its wallet_funds_received entries): principal_high_usd or more earns principal_high_points; at least principal_low_usd and below principal_high_usd earns principal_low_points; less earns nothing.
      The Cash Pickup uplift on a resend follows the principal of the customer's Cash Pickup payments collected in the last cash_window_months calendar months (their cash_funds_received entries), a rolling window that holds the entries whose entry_date lies fewer than cash_window_months whole calendar months before today, the whole calendar months from a date to today being the difference between the two calendar months, less one when today's day of the month is lower than that date's: cash_high_usd or more earns cash_high_points; at least cash_low_usd and below cash_high_usd earns cash_low_points; less earns nothing.
    prerequisite:
      - problem: wallet_ext_resend_charge
        kind: value_input
        gate: paid_charge
        form: state
        policy_source: >-
          For a resend beyond the tier's free resends, the amount it credits is fixed only after the charge assessed for that resend stands on the transfer's ledger.
        condition: >-
          for a resend whose number is above free_retries, a wallet_fee_charged entry with fee_type retry_fee and fee_seq equal to that resend's number stands on the transfer's ledger
        resolved_by: charge_resend_fee_8300b1da
        effect: >-
          paid_charge becomes the resend charge booked, which moves the paid-resend uplift from nothing to paid_partial_points (a charge above 0.00 and below retry_fee_usd) or paid_full_points, and with it the resend rate and the amount credited
    cross_category:
      - category: cash
        as: history
        reads: [cash_ledger.amount_usd]
        note: The Cash Pickup uplift sums the customer's cash_funds_received entries of the last months.
    compute:
      - held_usd: "SUM('wallet_ledger', 'amount_usd', event_type='wallet_funds_received') + SUM('wallet_ledger', 'amount_usd', event_type='wallet_credit_reversed') + SUM('wallet_ledger', 'amount_usd', event_type='wallet_paloma_credit') - SUM('wallet_ledger', 'amount_usd', event_type='wallet_credit_sent') - SUM('wallet_ledger', 'amount_usd', event_type='wallet_refund_issued')"
      - locked_rate: "F('fx_rate')"
      - resend_no: "COUNT('wallet_ledger', event_type='wallet_credit_sent')"
      - paid_charge: "SUM('wallet_ledger', 'amount_usd', event_type='wallet_fee_charged', fee_type='retry_fee', fee_seq=resend_no)"
      - paid_uplift: "K('paid_full_points') if paid_charge >= P('retry_fee_usd') else (K('paid_partial_points') if paid_charge > 0 else 0)"
      - bounces: "COUNT('wallet_ledger', event_type='wallet_credit_reversed')"
      - paloma_bounces: "COUNT('wallet_ledger', event_type='wallet_credit_reversed', failure_reason='provider_unavailable')"
      - first_bounce: "LATEST('wallet_ledger', 'entry_date', date_field='entry_date', event_type='wallet_credit_reversed', credit_attempt=1)"
      - held_from: "F('booked_at') if (bounces >= 1 and paloma_bounces == bounces) else (first_bounce if (bounces >= K('multi_bounce_count') and paloma_bounces < bounces) else F('failed_at'))"
      - held_days: "DAYS(held_from, NOW)"
      - held_uplift: "K('held_long_points') if held_days >= K('held_long_days') else (K('held_mid_points') if held_days >= K('held_mid_days') else 0)"
      - principal: "SUM('wallet_ledger', 'amount_usd', event_type='wallet_funds_received')"
      - principal_uplift: "K('principal_high_points') if principal >= K('principal_high_usd') else (K('principal_low_points') if principal >= K('principal_low_usd') else 0)"
      - cash_volume: "XSUM('cash', 'cash_ledger', 'amount_usd', within_months=K('cash_window_months'), date_field='entry_date', event_type='cash_funds_received')"
      - cash_uplift: "K('cash_high_points') if cash_volume >= K('cash_high_usd') else (K('cash_low_points') if cash_volume >= K('cash_low_usd') else 0)"
      - resend_rate: "RND(locked_rate * (1 + (paid_uplift + held_uplift + principal_uplift + cash_uplift) / 100), 4)"
      - result: "RND(held_usd * resend_rate, 2)"
    compute_basis:
      held_usd: "the resend carries the whole principal Paloma holds for the transfer, that is its wallet_funds_received, wallet_credit_reversed and wallet_paloma_credit entries less its wallet_credit_sent and wallet_refund_issued entries"
      locked_rate: "A resend converts the principal held at the transfer's locked fx_rate, and the amount it credits is that principal times that rate, rounded half up to 2 decimals."
      resend_no: "the retry_fee entry whose fee_seq is this resend's number, the number of credits already sent"
      paid_charge: "The paid-resend uplift follows the resend charge booked for this resend (the retry_fee entry whose fee_seq is this resend's number, the number of credits already sent)"
      paid_uplift: "a charge of at least the tier's retry_fee_usd earns paid_full_points; a charge above 0.00 and below the tier's retry_fee_usd earns paid_partial_points; a charge of 0.00, or none, earns nothing."
      bounces: "when the transfer bounced at least multi_bounce_count times and at least one bounce was on the recipient's side"
      paloma_bounces: "when every bounce on the transfer was on Paloma's or the provider's side (provider_unavailable), from the date the transfer was booked"
      first_bounce: "from the date of its first bounce (the wallet_credit_reversed entry of credit attempt 1)"
      held_from: "The days a resend has waited are counted from a starting date set by the transfer's bounces: when every bounce on the transfer was on Paloma's or the provider's side (provider_unavailable), from the date the transfer was booked; when the transfer bounced at least multi_bounce_count times and at least one bounce was on the recipient's side, from the date of its first bounce (the wallet_credit_reversed entry of credit attempt 1); otherwise, a single recipient-side bounce, from the date part of failed_at, its latest bounce."
      held_days: "The held-days uplift on a resend follows those days, counted in calendar days to today"
      held_uplift: "held_long_days or more earns held_long_points; at least held_mid_days and fewer than held_long_days earns held_mid_points; fewer earns nothing."
      principal: "The principal uplift on a resend follows the principal collected on the transfer (its wallet_funds_received entries)"
      principal_uplift: "principal_high_usd or more earns principal_high_points; at least principal_low_usd and below principal_high_usd earns principal_low_points; less earns nothing."
      cash_volume: "The Cash Pickup uplift on a resend follows the principal of the customer's Cash Pickup payments collected in the last cash_window_months calendar months (their cash_funds_received entries), a rolling window that holds the entries whose entry_date lies fewer than cash_window_months whole calendar months before today, the whole calendar months from a date to today being the difference between the two calendar months, less one when today's day of the month is lower than that date's"
      cash_uplift: "cash_high_usd or more earns cash_high_points; at least cash_low_usd and below cash_high_usd earns cash_low_points; less earns nothing."
      resend_rate: "the uplifts are added together, the locked rate is multiplied once by one plus their sum over 100 and rounded half up to 4 decimals to give the resend rate"
      result: "the amount credited is the principal held times the resend rate, rounded half up to 2 decimals."
    factors:
      - id: paid_resend_uplift
        effect: parameter
        decides: paid_uplift
        bindings: [resend_no, paid_charge, paid_uplift]
        ladder:
          - when: "the resend charge booked for this resend is at least the tier's retry_fee_usd"
            value: "K('paid_full_points')"
          - when: "that charge is above 0.00 and below the tier's retry_fee_usd"
            value: "K('paid_partial_points')"
          - when: "otherwise (a charge of 0.00, or none)"
            value: "0"
        baseline:
          paid_uplift: "0"
        evidence: [history]
        cross_difficulty: null
      - id: held_days_clock
        effect: method
        decides: held_from
        bindings: [bounces, paloma_bounces, first_bounce, held_from]
        ladder:
          - when: "every bounce on the transfer was provider_unavailable (Paloma's or the provider's side)"
            method: "the waiting days are counted from the date the transfer was booked"
          - when: "the transfer bounced at least multi_bounce_count times and at least one bounce was on the recipient's side"
            method: "the waiting days are counted from the date of the first bounce (reversal of credit attempt 1)"
          - when: "otherwise (a single recipient-side bounce)"
            method: "the waiting days are counted from the date part of failed_at, the latest bounce"
        baseline:
          held_from: "F('failed_at')"
        evidence: [history, date]
        cross_difficulty: null
      - id: held_days_uplift
        effect: parameter
        decides: held_uplift
        bindings: [held_days, held_uplift]
        ladder:
          - when: "the resend has waited held_long_days calendar days or more"
            value: "K('held_long_points')"
          - when: "it has waited at least held_mid_days and fewer than held_long_days calendar days"
            value: "K('held_mid_points')"
          - when: "otherwise (fewer than held_mid_days)"
            value: "0"
        baseline:
          held_uplift: "0"
        evidence: [date]
        cross_difficulty: null
      - id: principal_uplift
        effect: parameter
        decides: principal_uplift
        bindings: [principal, principal_uplift]
        ladder:
          - when: "the principal collected on the transfer is principal_high_usd or more"
            value: "K('principal_high_points')"
          - when: "it is at least principal_low_usd and below principal_high_usd"
            value: "K('principal_low_points')"
          - when: "otherwise (below principal_low_usd)"
            value: "0"
        baseline:
          principal_uplift: "0"
        evidence: [history]
        cross_difficulty: null
      - id: cash_pickup_uplift
        effect: parameter
        decides: cash_uplift
        bindings: [cash_volume, cash_uplift]
        ladder:
          - when: "Cash Pickup principal collected in the last cash_window_months calendar months (rolling, counted in whole calendar months back from today) is cash_high_usd or more"
            value: "K('cash_high_points')"
          - when: "that principal is at least cash_low_usd and below cash_high_usd"
            value: "K('cash_low_points')"
          - when: "otherwise (below cash_low_usd)"
            value: "0"
        baseline:
          cash_uplift: "0"
        evidence: [cross_category, history]
        cross_difficulty: cash
    baseline:
      rule: >-
        When a bounced credit is sent again to the same wallet at the customer's instruction, the resend carries the whole principal Paloma holds for the transfer, that is its wallet_funds_received, wallet_credit_reversed and wallet_paloma_credit entries less its wallet_credit_sent and wallet_refund_issued entries, as one new wallet_credit_sent entry whose credit_attempt is one more than the credits already sent, and the transfer returns to processing with released_at the moment of sending and date_available the resend day.
        A resend converts the principal held at the transfer's locked fx_rate, and the amount it credits is that principal times that rate, rounded half up to 2 decimals.
      params: []
    inputs:
      history:
        - {table: wallet_ledger, aggregate: sum, field: amount_usd, filters: {event_type: wallet_funds_received}}
        - {table: wallet_ledger, aggregate: sum, field: amount_usd, filters: {event_type: wallet_credit_reversed}}
        - {table: wallet_ledger, aggregate: sum, field: amount_usd, filters: {event_type: wallet_credit_sent}}
        - {table: wallet_ledger, aggregate: sum, field: amount_usd, filters: {event_type: wallet_fee_charged, fee_type: retry_fee}}
        - {table: wallet_ledger, aggregate: latest, field: entry_date, filters: {event_type: wallet_credit_reversed, credit_attempt: 1}}
        - {category: cash, table: cash_ledger, aggregate: sum, field: amount_usd, within_months: 6, filters: {event_type: cash_funds_received}}
