  - id: account_evt_limit_review
    subject: [account_limit_review_requested, account_limit_review_decided]
    rule: >-
      A limit review request is accepted only while the account status is active. The requested
      level must be exactly one level above the current level (level_number one higher), and that level's
      review_required_for_entry must be true; for a level reachable without review the customer is
      upgraded directly instead under account_evt_level_upgrade. Every document the requested level
      requires must already be logged for the account with a latest review of accepted, or as a
      received document still pending_review whose submitted_for_level is the requested level; a
      document that is missing, or whose latest review is rejected, must be submitted again before
      the request. A new request may be lodged only once limit_review_cooldown_days calendar days
      have passed since the most recent declined limit review decision. The cooldown is counted in
      calendar days from the event_date of that declined decision, using the cooldown of the level
      that decision concerned, so the earliest new request date is that event_date plus the
      cooldown days. No earlier limit review request for this account is still undecided. The
      account may lodge at most limit_review_max_per_180d requests (the current level's value) as
      counted by account_msr_limit_reviews_180d, including the new one. The decision_due_date is
      event_date plus the requested level's limit_review_sla_business_days Paloma business days
      (Monday to Friday, excluding US Federal Reserve holidays). Compliance decides: approved moves
      the account to the requested level the same day (account_level_upgraded); declined starts the
      cooldown; more_information_needed closes the request without a cooldown and the customer may
      lodge a fresh request once the extra documents are logged. A review never lowers the level
      and never raises any limit before approval.
    eligibility:
      - id: account_active
        applies_to: [account_limit_review_requested]
        kind: state
        condition: "A limit review request is accepted only while the account status is active."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
        state_contract:
          field: sender_accounts.status
          allowed: [active]
      - id: next_review_level
        applies_to: [account_limit_review_requested]
        kind: authorization
        condition: "The requested level must be exactly one level above the current level (level_number one higher), and that level's review_required_for_entry must be true"
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
      - id: documents_logged
        applies_to: [account_limit_review_requested]
        kind: authorization
        condition: "Every document the requested level requires must already be logged for the account with a latest review of accepted, or as a received document still pending_review whose submitted_for_level is the requested level"
        evidence_fields: [sender_documents.sender_account_id, sender_documents.doc_type, sender_documents.review_status, sender_documents.submitted_for_level]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_documents.sender_account_id]
          action_bindings:
            sender_documents.sender_account_id: sender_account_id
      - id: decline_cooldown
        applies_to: [account_limit_review_requested]
        kind: time
        condition: "A new request may be lodged only once limit_review_cooldown_days calendar days have passed since the most recent declined limit review decision."
        evidence_fields: [sender_account_events.sender_account_id, sender_account_events.review_outcome, sender_account_events.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_account_events.sender_account_id]
          action_bindings:
            sender_account_events.sender_account_id: sender_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the most recent declined limit review decision"
          anchor_source: sender_account_events.event_date
          relation: not_before
          duration_source: variants.limit_review_cooldown_days
          unit: calendar_days
          counting_rule: "The cooldown is counted in calendar days from the event_date of that declined decision, using the cooldown of the level that decision concerned, so the earliest new request date is that event_date plus the cooldown days."
          boundary: inclusive
      - id: no_undecided_request
        applies_to: [account_limit_review_requested]
        kind: dedup
        condition: "No earlier limit review request for this account is still undecided."
        evidence_fields: [sender_account_events.sender_account_id, sender_account_events.event_type, sender_account_events.related_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_account_events.sender_account_id]
          action_bindings:
            sender_account_events.sender_account_id: sender_account_id
        dedup_contract:
          table: sender_account_events
          mode: separate_record
          object_bindings: {sender_account_id: sender_account_id}
          duplicate_filters: {event_type: [account_limit_review_requested]}
          distinct_fields: [requested_level, event_date]
      - id: review_frequency
        applies_to: [account_limit_review_requested]
        kind: authorization
        condition: "The account may lodge at most limit_review_max_per_180d requests (the current level's value) as counted by account_msr_limit_reviews_180d, including the new one."
        evidence_fields: [sender_account_events.sender_account_id, sender_account_events.event_type, sender_account_events.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_account_events.sender_account_id]
          action_bindings:
            sender_account_events.sender_account_id: sender_account_id
    params:
      per_tier:
        Paloma Starter: {level_number: "=level_number", review_required_for_entry: "=review_required_for_entry", limit_review_sla_business_days: "=limit_review_sla_business_days", limit_review_cooldown_days: "=limit_review_cooldown_days", limit_review_max_per_180d: "=limit_review_max_per_180d"}
        Paloma Verified: {level_number: "=level_number", review_required_for_entry: "=review_required_for_entry", limit_review_sla_business_days: "=limit_review_sla_business_days", limit_review_cooldown_days: "=limit_review_cooldown_days", limit_review_max_per_180d: "=limit_review_max_per_180d"}
        Paloma Verified Plus: {level_number: "=level_number", review_required_for_entry: "=review_required_for_entry", limit_review_sla_business_days: "=limit_review_sla_business_days", limit_review_cooldown_days: "=limit_review_cooldown_days", limit_review_max_per_180d: "=limit_review_max_per_180d"}
        Paloma Enhanced: {level_number: "=level_number", review_required_for_entry: "=review_required_for_entry", limit_review_sla_business_days: "=limit_review_sla_business_days", limit_review_cooldown_days: "=limit_review_cooldown_days", limit_review_max_per_180d: "=limit_review_max_per_180d"}
        Paloma Premier: {level_number: "=level_number", review_required_for_entry: "=review_required_for_entry", limit_review_sla_business_days: "=limit_review_sla_business_days", limit_review_cooldown_days: "=limit_review_cooldown_days", limit_review_max_per_180d: "=limit_review_max_per_180d"}
        Paloma Private Client: {level_number: "=level_number", review_required_for_entry: "=review_required_for_entry", limit_review_sla_business_days: "=limit_review_sla_business_days", limit_review_cooldown_days: "=limit_review_cooldown_days", limit_review_max_per_180d: "=limit_review_max_per_180d"}
    measures: [account_msr_limit_reviews_180d]

  - id: account_evt_documents
    subject: [account_document_received, account_document_reviewed]
    rule: >-
      Paloma takes verification documents only while the account status is pending_verification,
      active or restricted; documents are not taken on a locked, suspended or closed account. A
      support agent logs a document the customer has uploaded in the app by its upload reference
      exactly as the app shows it, with submitted_for_level set to the requested level when the
      document supports an upgrade or a limit review and to the current level otherwise. Each
      upload reference is logged once. Compliance reviews each document against the parameters of
      its submitted_for_level: a proof_of_address is accepted only when its issue_date is no more
      than proof_of_address_max_age_days calendar days before its received_date; a government_id is
      accepted only when its expiry_date is at least id_min_remaining_validity_days calendar days
      after its received_date; a source_of_funds document only when its issue_date is no more than
      source_of_funds_max_age_days calendar days before its received_date; bank statements only
      when doc_bank_statement_months consecutive monthly statements are received and the latest
      one's issue_date is no more than bank_statement_max_age_days calendar days before its
      received_date. A document that fails a standard is rejected with the matching
      rejection_reason (too_old, expiring_soon, expired, illegible, name_mismatch, incomplete) and
      must be uploaded again as a new document with a new upload reference; a rejected document is
      never re-reviewed. The latest review row of a document is its standing outcome; a document
      with no review row is pending_review. A document's acceptance never by itself changes the
      level, the limits or the account status.
    eligibility:
      - id: account_takes_documents
        applies_to: [account_document_received]
        kind: state
        condition: "Paloma takes verification documents only while the account status is pending_verification, active or restricted; documents are not taken on a locked, suspended or closed account."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
        state_contract:
          field: sender_accounts.status
          allowed: [pending_verification, active, restricted]
      - id: one_log_per_upload
        applies_to: [account_document_received]
        kind: dedup
        condition: "Each upload reference is logged once."
        evidence_fields: [sender_documents.doc_reference, sender_documents.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_documents.doc_reference]
          action_bindings:
            sender_documents.doc_reference: doc_reference
        dedup_contract:
          table: sender_documents
          mode: separate_record
          object_bindings: {doc_reference: doc_reference}
          duplicate_filters: {event_type: [account_document_received]}
          distinct_fields: []
    params:
      per_tier:
        Paloma Starter: {proof_of_address_max_age_days: "=proof_of_address_max_age_days", id_min_remaining_validity_days: "=id_min_remaining_validity_days", source_of_funds_max_age_days: "=source_of_funds_max_age_days", bank_statement_max_age_days: "=bank_statement_max_age_days", doc_bank_statement_months: "=doc_bank_statement_months"}
        Paloma Verified: {proof_of_address_max_age_days: "=proof_of_address_max_age_days", id_min_remaining_validity_days: "=id_min_remaining_validity_days", source_of_funds_max_age_days: "=source_of_funds_max_age_days", bank_statement_max_age_days: "=bank_statement_max_age_days", doc_bank_statement_months: "=doc_bank_statement_months"}
        Paloma Verified Plus: {proof_of_address_max_age_days: "=proof_of_address_max_age_days", id_min_remaining_validity_days: "=id_min_remaining_validity_days", source_of_funds_max_age_days: "=source_of_funds_max_age_days", bank_statement_max_age_days: "=bank_statement_max_age_days", doc_bank_statement_months: "=doc_bank_statement_months"}
        Paloma Enhanced: {proof_of_address_max_age_days: "=proof_of_address_max_age_days", id_min_remaining_validity_days: "=id_min_remaining_validity_days", source_of_funds_max_age_days: "=source_of_funds_max_age_days", bank_statement_max_age_days: "=bank_statement_max_age_days", doc_bank_statement_months: "=doc_bank_statement_months"}
        Paloma Premier: {proof_of_address_max_age_days: "=proof_of_address_max_age_days", id_min_remaining_validity_days: "=id_min_remaining_validity_days", source_of_funds_max_age_days: "=source_of_funds_max_age_days", bank_statement_max_age_days: "=bank_statement_max_age_days", doc_bank_statement_months: "=doc_bank_statement_months"}
        Paloma Private Client: {proof_of_address_max_age_days: "=proof_of_address_max_age_days", id_min_remaining_validity_days: "=id_min_remaining_validity_days", source_of_funds_max_age_days: "=source_of_funds_max_age_days", bank_statement_max_age_days: "=bank_statement_max_age_days", doc_bank_statement_months: "=doc_bank_statement_months"}

  - id: account_evt_rfi
    subject: [account_rfi_issued, account_restricted, account_restriction_lifted, account_suspended]
    rule: >-
      Compliance may issue a request for information on an active account at any time; issuing it
      restricts the account at once with the matching restriction_reason. The answer is due by
      rfi_due_date, which is the issue date plus the current level's rfi_response_window_days
      calendar days, and reminders go out every rfi_reminder_interval_days calendar days while it is
      open. A periodic KYC review falls due on next_review_due_date; when no accepted refresh
      documents are logged by next_review_due_date plus kyc_refresh_grace_days calendar days,
      compliance issues a request for information with rfi_topic kyc_refresh. The restriction is
      lifted only by compliance once the documents answering the request are accepted; a support
      agent logs the documents but never lifts the restriction. The account is suspended for
      non-response only once the request for information was issued more than
      rfi_response_window_days calendar days ago with no accepted answer. The window is counted in
      calendar days from the event_date of the account_rfi_issued row, and an answer accepted on
      rfi_due_date itself is still on time. The account is also suspended when
      account_msr_rfi_rejections reaches rfi_max_rejected_submissions. While restricted the
      customer cannot book personal transfers, request a limit review or receive an upgrade, but can
      still cancel transfers that have not been paid out, receive refunds, request statements and
      submit documents.
    eligibility:
      - id: rfi_window_elapsed
        applies_to: [account_suspended]
        kind: time
        condition: "The account is suspended for non-response only once the request for information was issued more than rfi_response_window_days calendar days ago with no accepted answer."
        evidence_fields: [sender_account_events.sender_account_id, sender_account_events.event_date, sender_account_events.rfi_due_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_account_events.sender_account_id]
          action_bindings:
            sender_account_events.sender_account_id: sender_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the request for information was issued"
          anchor_source: sender_account_events.event_date
          relation: not_before
          duration_source: variants.rfi_response_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days from the event_date of the account_rfi_issued row, and an answer accepted on rfi_due_date itself is still on time."
          boundary: exclusive
    params:
      per_tier:
        Paloma Starter: {rfi_response_window_days: "=rfi_response_window_days", rfi_reminder_interval_days: "=rfi_reminder_interval_days", rfi_max_rejected_submissions: "=rfi_max_rejected_submissions", kyc_refresh_grace_days: "=kyc_refresh_grace_days"}
        Paloma Verified: {rfi_response_window_days: "=rfi_response_window_days", rfi_reminder_interval_days: "=rfi_reminder_interval_days", rfi_max_rejected_submissions: "=rfi_max_rejected_submissions", kyc_refresh_grace_days: "=kyc_refresh_grace_days"}
        Paloma Verified Plus: {rfi_response_window_days: "=rfi_response_window_days", rfi_reminder_interval_days: "=rfi_reminder_interval_days", rfi_max_rejected_submissions: "=rfi_max_rejected_submissions", kyc_refresh_grace_days: "=kyc_refresh_grace_days"}
        Paloma Enhanced: {rfi_response_window_days: "=rfi_response_window_days", rfi_reminder_interval_days: "=rfi_reminder_interval_days", rfi_max_rejected_submissions: "=rfi_max_rejected_submissions", kyc_refresh_grace_days: "=kyc_refresh_grace_days"}
        Paloma Premier: {rfi_response_window_days: "=rfi_response_window_days", rfi_reminder_interval_days: "=rfi_reminder_interval_days", rfi_max_rejected_submissions: "=rfi_max_rejected_submissions", kyc_refresh_grace_days: "=kyc_refresh_grace_days"}
        Paloma Private Client: {rfi_response_window_days: "=rfi_response_window_days", rfi_reminder_interval_days: "=rfi_reminder_interval_days", rfi_max_rejected_submissions: "=rfi_max_rejected_submissions", kyc_refresh_grace_days: "=kyc_refresh_grace_days"}
    measures: [account_msr_rfi_rejections]

  - id: account_evt_lock
    subject: [account_locked, account_unlocked]
    rule: >-
      Paloma security locks an active account after failed_signin_lock_threshold consecutive failed
      sign-ins (lock_reason failed_signins), after repeated password-reset requests
      (password_reset_abuse), when a sign-in from a new device fails its review
      (device_change_review), or on signs of account takeover (suspected_takeover). A
      failed_signins lock releases itself lock_auto_release_minutes after locked_at when that value
      is above 0. A support agent may release a lock only after the caller passes identity
      verification on this call (an identity_verifications record for the customer with verified
      true). The lock_reason must be one of the current level's agent_unlock_reasons. When the
      level's unlock_requires_id_document is true, a government_id document whose latest review is
      accepted and whose expiry_date is later than the unlock date must be on file. A
      suspected_takeover lock, and any lock whose reason is not in agent_unlock_reasons, is released
      only by Paloma Fraud Operations after its own review, and the agent does not release it.
      Releasing a lock clears lock_reason to none and locked_at, and never changes the level, the
      limits or any transfer.
    eligibility:
      - id: caller_verified
        applies_to: [account_unlocked]
        kind: authorization
        condition: "A support agent may release a lock only after the caller passes identity verification on this call (an identity_verifications record for the customer with verified true)."
        evidence_fields: [identity_verifications.customer_id, identity_verifications.verified]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [identity_verifications.customer_id]
          action_bindings:
            identity_verifications.customer_id: customer_id
      - id: agent_releasable_reason
        applies_to: [account_unlocked]
        kind: authorization
        condition: "The lock_reason must be one of the current level's agent_unlock_reasons."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.lock_reason, sender_accounts.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
      - id: id_document_on_file
        applies_to: [account_unlocked]
        kind: authorization
        condition: "When the level's unlock_requires_id_document is true, a government_id document whose latest review is accepted and whose expiry_date is later than the unlock date must be on file."
        evidence_fields: [sender_documents.sender_account_id, sender_documents.doc_type, sender_documents.review_status, sender_documents.expiry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_documents.sender_account_id]
          action_bindings:
            sender_documents.sender_account_id: sender_account_id
    params:
      per_tier:
        Paloma Starter: {failed_signin_lock_threshold: "=failed_signin_lock_threshold", lock_auto_release_minutes: "=lock_auto_release_minutes", agent_unlock_reasons: "=agent_unlock_reasons", unlock_requires_id_document: "=unlock_requires_id_document"}
        Paloma Verified: {failed_signin_lock_threshold: "=failed_signin_lock_threshold", lock_auto_release_minutes: "=lock_auto_release_minutes", agent_unlock_reasons: "=agent_unlock_reasons", unlock_requires_id_document: "=unlock_requires_id_document"}
        Paloma Verified Plus: {failed_signin_lock_threshold: "=failed_signin_lock_threshold", lock_auto_release_minutes: "=lock_auto_release_minutes", agent_unlock_reasons: "=agent_unlock_reasons", unlock_requires_id_document: "=unlock_requires_id_document"}
        Paloma Enhanced: {failed_signin_lock_threshold: "=failed_signin_lock_threshold", lock_auto_release_minutes: "=lock_auto_release_minutes", agent_unlock_reasons: "=agent_unlock_reasons", unlock_requires_id_document: "=unlock_requires_id_document"}
        Paloma Premier: {failed_signin_lock_threshold: "=failed_signin_lock_threshold", lock_auto_release_minutes: "=lock_auto_release_minutes", agent_unlock_reasons: "=agent_unlock_reasons", unlock_requires_id_document: "=unlock_requires_id_document"}
        Paloma Private Client: {failed_signin_lock_threshold: "=failed_signin_lock_threshold", lock_auto_release_minutes: "=lock_auto_release_minutes", agent_unlock_reasons: "=agent_unlock_reasons", unlock_requires_id_document: "=unlock_requires_id_document"}

  - id: account_evt_closure
    subject: [account_closed_by_customer, account_terminated]
    rule: >-
      Only the customer can close their own Personal Sender Account, and only from status active; a
      locked, restricted or suspended account cannot be closed at the customer's request until it is
      active again. The agent explains the effect and the customer confirms the closure themselves.
      Closure is allowed only when every one of the customer's Bank Deposit transfers is deposited, refunded, or cancelled with nothing left owed back on it.
      Closure is allowed only when every one of the customer's Cash Pickup transfers is paid_out, refunded, or cancelled with nothing left owed back on it.
      Closure is allowed only when every one of the customer's Mobile Wallet transfers is credited, refunded, or cancelled with nothing left owed back on it.
      A cancelled transfer has nothing left owed back when its principal_held_usd and fees_held_usd
      are both 0.00. closure_with_open_transfers_allowed is false at every level, so an open transfer
      must first finish, or be cancelled and refunded, before closure. Paloma
      keeps a closed account's records for record_retention_years years as the Bank Secrecy Act
      requires, and statements of the retained history remain available. A closed account is never
      reopened; a customer who closed their own account may apply for a new one. Paloma terminates a
      suspended account only by a final compliance or fraud decision, and a terminated customer may
      not apply again.
    eligibility:
      - id: bank_transfers_settled
        applies_to: [account_closed_by_customer]
        kind: state
        condition: "Closure is allowed only when every one of the customer's Bank Deposit transfers is deposited, refunded, or cancelled with nothing left owed back on it."
        evidence_fields: [bank_transfers.sender_account_id, bank_transfers.status, bank_transfers.principal_held_usd, bank_transfers.fees_held_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_transfers.sender_account_id]
          action_bindings:
            bank_transfers.sender_account_id: sender_account_id
        state_contract:
          field: bank_transfers.status
          allowed: [deposited, refunded, cancelled]
      - id: cash_transfers_settled
        applies_to: [account_closed_by_customer]
        kind: state
        condition: "Closure is allowed only when every one of the customer's Cash Pickup transfers is paid_out, refunded, or cancelled with nothing left owed back on it."
        evidence_fields: [cash_transfers.sender_account_id, cash_transfers.status, cash_transfers.principal_held_usd, cash_transfers.fees_held_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [cash_transfers.sender_account_id]
          action_bindings:
            cash_transfers.sender_account_id: sender_account_id
        state_contract:
          field: cash_transfers.status
          allowed: [paid_out, refunded, cancelled]
      - id: wallet_transfers_settled
        applies_to: [account_closed_by_customer]
        kind: state
        condition: "Closure is allowed only when every one of the customer's Mobile Wallet transfers is credited, refunded, or cancelled with nothing left owed back on it."
        evidence_fields: [wallet_transfers.sender_account_id, wallet_transfers.status, wallet_transfers.principal_held_usd, wallet_transfers.fees_held_usd]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wallet_transfers.sender_account_id]
          action_bindings:
            wallet_transfers.sender_account_id: sender_account_id
        state_contract:
          field: wallet_transfers.status
          allowed: [credited, refunded, cancelled]
    params:
      record_retention_years: 5
      per_tier:
        Paloma Starter: {closure_with_open_transfers_allowed: "=closure_with_open_transfers_allowed"}
        Paloma Verified: {closure_with_open_transfers_allowed: "=closure_with_open_transfers_allowed"}
        Paloma Verified Plus: {closure_with_open_transfers_allowed: "=closure_with_open_transfers_allowed"}
        Paloma Enhanced: {closure_with_open_transfers_allowed: "=closure_with_open_transfers_allowed"}
        Paloma Premier: {closure_with_open_transfers_allowed: "=closure_with_open_transfers_allowed"}
        Paloma Private Client: {closure_with_open_transfers_allowed: "=closure_with_open_transfers_allowed"}

  - id: account_evt_downgrade
    subject: [account_level_downgraded]
    rule: >-
      When a document the current level requires lapses (a government_id passes its expiry_date)
      and no accepted replacement is logged, the account moves down only once
      expired_document_grace_days calendar days have passed since the document's expiry date. Grace
      days are counted in calendar days from expiry_date, so the downgrade takes effect on
      expiry_date plus expired_document_grace_days. The new level is the current level's
      downgrade_target_level; when that level also requires the lapsed document, the step repeats
      from that level until a level is reached whose requirements are all met. level_effective_date
      is the downgrade date and next_review_due_date is recalculated for the new level. Transfers
      already booked keep their booking; new bookings use the lower limits and funding methods. An
      accepted replacement logged before the grace period ends cancels the downgrade; one logged
      after it allows a new upgrade under account_evt_level_upgrade.
    eligibility:
      - id: grace_elapsed
        applies_to: [account_level_downgraded]
        kind: time
        condition: "When a document the current level requires lapses (a government_id passes its expiry_date) and no accepted replacement is logged, the account moves down only once expired_document_grace_days calendar days have passed since the document's expiry date."
        evidence_fields: [sender_documents.sender_account_id, sender_documents.expiry_date, sender_documents.review_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_documents.sender_account_id]
          action_bindings:
            sender_documents.sender_account_id: sender_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the document's expiry date"
          anchor_source: sender_documents.expiry_date
          relation: not_before
          duration_source: variants.expired_document_grace_days
          unit: calendar_days
          counting_rule: "Grace days are counted in calendar days from expiry_date, so the downgrade takes effect on expiry_date plus expired_document_grace_days."
          boundary: inclusive
    params:
      per_tier:
        Paloma Starter: {expired_document_grace_days: "=expired_document_grace_days", downgrade_target_level: "=downgrade_target_level"}
        Paloma Verified: {expired_document_grace_days: "=expired_document_grace_days", downgrade_target_level: "=downgrade_target_level"}
        Paloma Verified Plus: {expired_document_grace_days: "=expired_document_grace_days", downgrade_target_level: "=downgrade_target_level"}
        Paloma Enhanced: {expired_document_grace_days: "=expired_document_grace_days", downgrade_target_level: "=downgrade_target_level"}
        Paloma Premier: {expired_document_grace_days: "=expired_document_grace_days", downgrade_target_level: "=downgrade_target_level"}
        Paloma Private Client: {expired_document_grace_days: "=expired_document_grace_days", downgrade_target_level: "=downgrade_target_level"}

  - id: account_evt_suspension_appeal
    subject: [account_appeal_lodged, account_reinstated, account_terminated]
    rule: >-
      An appeal of a suspension is the customer's own claim, lodged by the customer and never by an
      agent on their behalf. An appeal is accepted only while the account status is suspended. An
      appeal may be lodged only within suspension_appeal_window_days calendar days after the
      suspension took effect. The window is counted in calendar days from suspended_date, and an
      appeal lodged on suspended_date plus the window days is still on time. Only one appeal is
      accepted per suspension. Compliance decides the appeal: upheld reinstates the account to active
      at its existing level, with any open request for information still to be answered; refused,
      or no appeal within the window, leads to termination. Transfers held while the account was
      suspended are refunded under the refund rules of their delivery method if the account is
      terminated.
    eligibility:
      - id: account_suspended
        applies_to: [account_appeal_lodged]
        kind: state
        condition: "An appeal is accepted only while the account status is suspended."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
        state_contract:
          field: sender_accounts.status
          allowed: [suspended]
      - id: appeal_window
        applies_to: [account_appeal_lodged]
        kind: time
        condition: "An appeal may be lodged only within suspension_appeal_window_days calendar days after the suspension took effect."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.suspended_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the suspension took effect"
          anchor_source: sender_accounts.suspended_date
          relation: not_after
          duration_source: variants.suspension_appeal_window_days
          unit: calendar_days
          counting_rule: "The window is counted in calendar days from suspended_date, and an appeal lodged on suspended_date plus the window days is still on time."
          boundary: inclusive
      - id: one_appeal_per_suspension
        applies_to: [account_appeal_lodged]
        kind: dedup
        condition: "Only one appeal is accepted per suspension."
        evidence_fields: [sender_account_events.sender_account_id, sender_account_events.event_type, sender_account_events.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_account_events.sender_account_id]
          action_bindings:
            sender_account_events.sender_account_id: sender_account_id
        dedup_contract:
          table: sender_account_events
          mode: separate_record
          object_bindings: {sender_account_id: sender_account_id}
          duplicate_filters: {event_type: [account_appeal_lodged]}
          distinct_fields: [event_date]
    params:
      per_tier:
        Paloma Starter: {suspension_appeal_window_days: "=suspension_appeal_window_days"}
        Paloma Verified: {suspension_appeal_window_days: "=suspension_appeal_window_days"}
        Paloma Verified Plus: {suspension_appeal_window_days: "=suspension_appeal_window_days"}
        Paloma Enhanced: {suspension_appeal_window_days: "=suspension_appeal_window_days"}
        Paloma Premier: {suspension_appeal_window_days: "=suspension_appeal_window_days"}
        Paloma Private Client: {suspension_appeal_window_days: "=suspension_appeal_window_days"}

  - id: account_evt_recipients
    subject: [account_recipient_added]
    rule: >-
      A recipient can be saved only while the account status is active. The account may hold at most
      max_active_recipients saved recipients whose recipient status is active, and may add at most
      max_new_recipients_30d recipients as counted by account_msr_new_recipients_30d including the new
      one; a recipient beyond either cap is not saved until an existing one is removed in the app or
      the window frees. A recipient's corridor decides which delivery methods and payout networks can
      serve them. For new_recipient_cooling_off_hours hours after a recipient is added, the first
      personal transfer to that recipient is held for screening before release; the cooling-off is
      built into that transfer's disclosed date_available and is never a late delivery.
    eligibility:
      - id: account_active
        applies_to: [account_recipient_added]
        kind: state
        condition: "A recipient can be saved only while the account status is active."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
        state_contract:
          field: sender_accounts.status
          allowed: [active]
    params:
      per_tier:
        Paloma Starter: {max_active_recipients: "=max_active_recipients", max_new_recipients_30d: "=max_new_recipients_30d", new_recipient_cooling_off_hours: "=new_recipient_cooling_off_hours"}
        Paloma Verified: {max_active_recipients: "=max_active_recipients", max_new_recipients_30d: "=max_new_recipients_30d", new_recipient_cooling_off_hours: "=new_recipient_cooling_off_hours"}
        Paloma Verified Plus: {max_active_recipients: "=max_active_recipients", max_new_recipients_30d: "=max_new_recipients_30d", new_recipient_cooling_off_hours: "=new_recipient_cooling_off_hours"}
        Paloma Enhanced: {max_active_recipients: "=max_active_recipients", max_new_recipients_30d: "=max_new_recipients_30d", new_recipient_cooling_off_hours: "=new_recipient_cooling_off_hours"}
        Paloma Premier: {max_active_recipients: "=max_active_recipients", max_new_recipients_30d: "=max_new_recipients_30d", new_recipient_cooling_off_hours: "=new_recipient_cooling_off_hours"}
        Paloma Private Client: {max_active_recipients: "=max_active_recipients", max_new_recipients_30d: "=max_new_recipients_30d", new_recipient_cooling_off_hours: "=new_recipient_cooling_off_hours"}
    measures: [account_msr_new_recipients_30d]

  - id: account_evt_funding_entitlements
    subject: [account_level_upgraded, account_level_downgraded]
    rule: >-
      The level in force at booking decides which funding methods a personal transfer may use:
      debit_card_funding_allowed, credit_card_funding_allowed, ach_funding_allowed,
      pay_by_bank_allowed and wire_funding_allowed. A delivery tier may narrow the funding methods
      further and never widens them. A transfer funded by ACH bank debit is released to the payout
      partner before the debit settles only while the ACH-funded principal released early in the
      rolling 30 calendar days (account_msr_ach_early_release_30d), including this transfer, stays
      within ach_early_release_usd;
      otherwise its principal waits ach_settlement_hold_business_days Paloma business days after
      booking before release, and that wait is built into its disclosed date_available. A level
      change applies to transfers booked after it and never re-releases or re-holds a transfer
      already booked.
    eligibility: []
    params:
      per_tier:
        Paloma Starter: {debit_card_funding_allowed: "=debit_card_funding_allowed", credit_card_funding_allowed: "=credit_card_funding_allowed", ach_funding_allowed: "=ach_funding_allowed", pay_by_bank_allowed: "=pay_by_bank_allowed", wire_funding_allowed: "=wire_funding_allowed", ach_early_release_usd: "=ach_early_release_usd", ach_settlement_hold_business_days: "=ach_settlement_hold_business_days"}
        Paloma Verified: {debit_card_funding_allowed: "=debit_card_funding_allowed", credit_card_funding_allowed: "=credit_card_funding_allowed", ach_funding_allowed: "=ach_funding_allowed", pay_by_bank_allowed: "=pay_by_bank_allowed", wire_funding_allowed: "=wire_funding_allowed", ach_early_release_usd: "=ach_early_release_usd", ach_settlement_hold_business_days: "=ach_settlement_hold_business_days"}
        Paloma Verified Plus: {debit_card_funding_allowed: "=debit_card_funding_allowed", credit_card_funding_allowed: "=credit_card_funding_allowed", ach_funding_allowed: "=ach_funding_allowed", pay_by_bank_allowed: "=pay_by_bank_allowed", wire_funding_allowed: "=wire_funding_allowed", ach_early_release_usd: "=ach_early_release_usd", ach_settlement_hold_business_days: "=ach_settlement_hold_business_days"}
        Paloma Enhanced: {debit_card_funding_allowed: "=debit_card_funding_allowed", credit_card_funding_allowed: "=credit_card_funding_allowed", ach_funding_allowed: "=ach_funding_allowed", pay_by_bank_allowed: "=pay_by_bank_allowed", wire_funding_allowed: "=wire_funding_allowed", ach_early_release_usd: "=ach_early_release_usd", ach_settlement_hold_business_days: "=ach_settlement_hold_business_days"}
        Paloma Premier: {debit_card_funding_allowed: "=debit_card_funding_allowed", credit_card_funding_allowed: "=credit_card_funding_allowed", ach_funding_allowed: "=ach_funding_allowed", pay_by_bank_allowed: "=pay_by_bank_allowed", wire_funding_allowed: "=wire_funding_allowed", ach_early_release_usd: "=ach_early_release_usd", ach_settlement_hold_business_days: "=ach_settlement_hold_business_days"}
        Paloma Private Client: {debit_card_funding_allowed: "=debit_card_funding_allowed", credit_card_funding_allowed: "=credit_card_funding_allowed", ach_funding_allowed: "=ach_funding_allowed", pay_by_bank_allowed: "=pay_by_bank_allowed", wire_funding_allowed: "=wire_funding_allowed", ach_early_release_usd: "=ach_early_release_usd", ach_settlement_hold_business_days: "=ach_settlement_hold_business_days"}
    measures: [account_msr_ach_early_release_30d]

  - id: account_evt_service_entitlements
    subject: [account_callback_scheduled, account_statement_requested]
    rule: >-
      A callback can be scheduled for any account that is not closed. Its callback_due_date is the
      request date plus the level's callback_sla_business_days Paloma business days (Monday to
      Friday, excluding US Federal Reserve holidays). A level with dedicated_support_line true is
      called back from the priority line, and a level with relationship_manager_assigned true is
      called back by the named relationship manager; neither changes the due date. A statement can
      be requested for any account except one still pending_verification, including a closed account
      within record retention. statement_period_start may be no earlier than the request date minus
      statement_history_months calendar months (same day of month, falling back to the month's last
      day) and statement_period_end no later than the request date. At most statements_per_12m
      statements may be requested as counted by account_msr_statements_12m including the new one; a
      request beyond that is not taken until the window frees. delivery_due_date is the request date
      plus statement_delivery_business_days Paloma business days. Statements are free of charge and
      are emailed to the address on the customer profile.
    eligibility:
      - id: callback_account_open
        applies_to: [account_callback_scheduled]
        kind: state
        condition: "A callback can be scheduled for any account that is not closed."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
        state_contract:
          field: sender_accounts.status
          allowed: [pending_verification, active, locked, restricted, suspended]
      - id: statement_account_established
        applies_to: [account_statement_requested]
        kind: state
        condition: "A statement can be requested for any account except one still pending_verification, including a closed account within record retention."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
        state_contract:
          field: sender_accounts.status
          allowed: [active, locked, restricted, suspended, closed]
    params:
      per_tier:
        Paloma Starter: {callback_sla_business_days: "=callback_sla_business_days", dedicated_support_line: "=dedicated_support_line", relationship_manager_assigned: "=relationship_manager_assigned", statement_history_months: "=statement_history_months", statements_per_12m: "=statements_per_12m", statement_delivery_business_days: "=statement_delivery_business_days"}
        Paloma Verified: {callback_sla_business_days: "=callback_sla_business_days", dedicated_support_line: "=dedicated_support_line", relationship_manager_assigned: "=relationship_manager_assigned", statement_history_months: "=statement_history_months", statements_per_12m: "=statements_per_12m", statement_delivery_business_days: "=statement_delivery_business_days"}
        Paloma Verified Plus: {callback_sla_business_days: "=callback_sla_business_days", dedicated_support_line: "=dedicated_support_line", relationship_manager_assigned: "=relationship_manager_assigned", statement_history_months: "=statement_history_months", statements_per_12m: "=statements_per_12m", statement_delivery_business_days: "=statement_delivery_business_days"}
        Paloma Enhanced: {callback_sla_business_days: "=callback_sla_business_days", dedicated_support_line: "=dedicated_support_line", relationship_manager_assigned: "=relationship_manager_assigned", statement_history_months: "=statement_history_months", statements_per_12m: "=statements_per_12m", statement_delivery_business_days: "=statement_delivery_business_days"}
        Paloma Premier: {callback_sla_business_days: "=callback_sla_business_days", dedicated_support_line: "=dedicated_support_line", relationship_manager_assigned: "=relationship_manager_assigned", statement_history_months: "=statement_history_months", statements_per_12m: "=statements_per_12m", statement_delivery_business_days: "=statement_delivery_business_days"}
        Paloma Private Client: {callback_sla_business_days: "=callback_sla_business_days", dedicated_support_line: "=dedicated_support_line", relationship_manager_assigned: "=relationship_manager_assigned", statement_history_months: "=statement_history_months", statements_per_12m: "=statements_per_12m", statement_delivery_business_days: "=statement_delivery_business_days"}
    measures: [account_msr_statements_12m]

# ============================================================================
# extended_policies (sender_verification_and_limits): multi-factor calculations layered on the
# base policies above. Every window counted in Paloma business days is passed to its task tool as a
# whole number of business days; the tool lands the corresponding date.
# ============================================================================
extended_policies:
  - id: account_ext_review_decision_window
    base_policy_refs: [account_sending_limits, account_evt_limit_review]
    overwrite:
      - base_policy: account_evt_limit_review
        superseded_clause: >-
          The decision_due_date is event_date plus the requested level's limit_review_sla_business_days
          Paloma business days (Monday to Friday, excluding US Federal Reserve holidays).
        replaced_by: >-
          The decision due date of a limit review request is the request date plus the decision window,
          counted forward in Paloma business days from the request date.
    trigger: on_request
    subject: [account_limit_review_requested]
    computes: decision_window_business_days
    target_tool: lodge_limit_review_54a88584
    params:
      review_days_enhanced: 3
      review_days_premier: 5
      review_days_private_client: 7
      new_level_days: 30
      settled_level_days: 180
      new_level_add: 2
      settling_level_add: 1
      min_prior_count: 1
      declined_with_rfi_add: 2
      declined_only_add: 1
      heavy_paid_usd: 20000.00
      moderate_paid_usd: 8000.00
      heavy_paid_add: 2
      moderate_paid_add: 1
      many_fresh_documents: 3
      some_fresh_documents: 1
      many_fresh_add: 2
      some_fresh_add: 1
      cash_heavy_payouts: 8
      cash_some_payouts: 4
      cash_heavy_add: 2
      cash_some_add: 1
      committee_recipients: 4
      second_review_recipients: 2
      committee_week_days: 5
    rule: >-
      The decision window of a limit review request is a whole number of Paloma business days, Monday
      to Friday excluding US Federal Reserve holidays.
      The standard decision window is the compliance review time of the level requested, which is the
      level directly above the level the account holds: review_days_enhanced business days when the
      account holds Paloma Verified Plus and so requests Paloma Enhanced, review_days_premier business
      days when it holds Paloma Enhanced and so requests Paloma Premier, and review_days_private_client
      business days when it holds Paloma Premier and so requests Paloma Private Client, these being the
      limit_review_sla_business_days of the levels requested.
      A request for a level reachable without review carries no compliance review time.
      The decision due date of a limit review request is the request date plus the decision window,
      counted forward in Paloma business days from the request date.
      The counted decision window is the standard decision window plus the business days added for
      time at the current level, for earlier declined decisions, for recent sending, for fresh
      documents and for cash reliance, each worked out as follows and each added once; the decision
      window is then the counted decision window after the escalation step.
      Time at the current level is counted in calendar days from the date the current level took
      effect to the request date: when it is fewer than new_level_days days, new_level_add business
      days are added to the counted decision window; when it is at least new_level_days but fewer than
      settled_level_days days, settling_level_add business day is added to the counted decision window;
      when it is settled_level_days days or more, nothing is added for time at the current level.
      Earlier declined decisions are read from the account history over the 24 months before the
      request date, an entry dated on the same calendar day 24 months earlier or before it no longer
      counting: when the history shows at least min_prior_count limit review decision with the outcome
      declined and at least min_prior_count request for information issued in those 24 months,
      declined_with_rfi_add business days are added to the counted decision window; when it shows a
      declined decision but no request for information in those 24 months, declined_only_add business
      day is added to the counted decision window; when it shows no declined decision in those 24
      months, nothing is added for earlier decisions.
      Recent sending is the USD principal paid out on the customer's personal transfers in the 6
      months before the request date, an entry dated on the same calendar day 6 months earlier or
      before it no longer counting, summed over every Bank Deposit payout sent, every Cash Pickup
      payout made and every Mobile Wallet credit sent in that window: when it is heavy_paid_usd or
      more, heavy_paid_add business days are added to the counted decision window; when it is at least
      moderate_paid_usd but below heavy_paid_usd, moderate_paid_add business day is added to the
      counted decision window; when it is below moderate_paid_usd, nothing is added for recent sending.
      Fresh documents are the verification documents received on the account in the month before the
      request date, a document received on the same calendar day of the previous month or before it
      no longer counting: when many_fresh_documents or more were received, many_fresh_add business days
      are added to the counted decision window; when at least some_fresh_documents but fewer than
      many_fresh_documents were received, some_fresh_add business day is added to the counted decision
      window; when none were received, nothing is added for fresh documents.
      Cash reliance for the decision window is the number of Cash Pickup payouts made on the customer's transfers in the 12
      months before the request date, an entry dated on the same calendar day 12 months earlier or
      before it no longer counting: when it is cash_heavy_payouts or more, cash_heavy_add business days
      are added to the counted decision window; when it is at least cash_some_payouts but fewer than
      cash_heavy_payouts, cash_some_add business day is added to the counted decision window; when it is
      fewer than cash_some_payouts, nothing is added for cash reliance.
      The escalation step reads the recipients added to the account in the 12 months before the
      request date, an addition dated on the same calendar day 12 months earlier or before it no longer
      counting: when committee_recipients or more were added, the request goes to the weekly enhanced
      due diligence committee and the decision window is the counted decision window rounded up to the
      next whole multiple of committee_week_days business days, a counted decision window that already
      is such a multiple staying as it is; when at least second_review_recipients but fewer than
      committee_recipients were added, a second reviewer checks the file and the decision window is the
      counted decision window plus half of it, that half rounded up to a whole business day; when fewer
      than second_review_recipients were added, the decision window is the counted decision window.
    prerequisite: []
    cross_category:
      - category: bank
        as: history
        reads: [bank_ledger.amount_usd]
        note: Recent sending sums the Bank Deposit payouts sent to the customer's recipients in the last 6 months.
      - category: cash
        as: history
        reads: [cash_ledger.amount_usd, cash_ledger.event_type]
        note: Recent sending sums Cash Pickup payouts made in 6 months, and cash reliance counts Cash Pickup payouts made in 12 months.
      - category: wallet
        as: history
        reads: [wallet_ledger.amount_usd]
        note: Recent sending sums the Mobile Wallet credits sent in the last 6 months.
    compute:
      - requested_review_days: "K('review_days_enhanced') if F('variant_name') == 'Paloma Verified Plus' else (K('review_days_premier') if F('variant_name') == 'Paloma Enhanced' else (K('review_days_private_client') if F('variant_name') == 'Paloma Premier' else 0))"
      - days_at_level: "DAYS(F('level_effective_date'), NOW)"
      - seasoning_days: "K('new_level_add') if days_at_level < K('new_level_days') else (K('settling_level_add') if days_at_level < K('settled_level_days') else 0)"
      - declines_24m: "COUNT('sender_account_events', within_months=24, date_field='event_date', event_type='account_limit_review_decided', review_outcome='declined')"
      - rfis_24m: "COUNT('sender_account_events', within_months=24, date_field='event_date', event_type='account_rfi_issued')"
      - redecision_days: "K('declined_with_rfi_add') if (declines_24m >= K('min_prior_count') and rfis_24m >= K('min_prior_count')) else (K('declined_only_add') if (declines_24m >= K('min_prior_count') and rfis_24m < K('min_prior_count')) else 0)"
      - paid_6m: "XSUM('bank', 'bank_ledger', 'amount_usd', within_months=6, date_field='entry_date', event_type='bank_payout_sent') + XSUM('cash', 'cash_ledger', 'amount_usd', within_months=6, date_field='entry_date', event_type='cash_payout_made') + XSUM('wallet', 'wallet_ledger', 'amount_usd', within_months=6, date_field='entry_date', event_type='wallet_credit_sent')"
      - volume_days: "K('heavy_paid_add') if paid_6m >= K('heavy_paid_usd') else (K('moderate_paid_add') if paid_6m >= K('moderate_paid_usd') else 0)"
      - fresh_documents: "COUNT('sender_documents', within_months=1, date_field='received_date', event_type='account_document_received')"
      - document_days: "K('many_fresh_add') if fresh_documents >= K('many_fresh_documents') else (K('some_fresh_add') if fresh_documents >= K('some_fresh_documents') else 0)"
      - cash_payouts_12m: "XCOUNT('cash', 'cash_ledger', within_months=12, date_field='entry_date', event_type='cash_payout_made')"
      - cash_days: "K('cash_heavy_add') if cash_payouts_12m >= K('cash_heavy_payouts') else (K('cash_some_add') if cash_payouts_12m >= K('cash_some_payouts') else 0)"
      - counted_window: "requested_review_days + seasoning_days + redecision_days + volume_days + document_days + cash_days"
      - recipients_12m: "COUNT('sender_account_events', within_months=12, date_field='event_date', event_type='account_recipient_added')"
      - escalated_window: "((counted_window + K('committee_week_days') - 1) // K('committee_week_days')) * K('committee_week_days') if recipients_12m >= K('committee_recipients') else ((counted_window + (counted_window + 1) // 2) if recipients_12m >= K('second_review_recipients') else counted_window)"
      - result: "escalated_window"
    compute_basis:
      requested_review_days: "The standard decision window is the compliance review time of the level requested, which is the level directly above the level the account holds: review_days_enhanced business days when the account holds Paloma Verified Plus and so requests Paloma Enhanced, review_days_premier business days when it holds Paloma Enhanced and so requests Paloma Premier, and review_days_private_client business days when it holds Paloma Premier and so requests Paloma Private Client, these being the limit_review_sla_business_days of the levels requested. A request for a level reachable without review carries no compliance review time."
      days_at_level: "Time at the current level is counted in calendar days from the date the current level took effect to the request date"
      seasoning_days: "when it is fewer than new_level_days days, new_level_add business days are added to the counted decision window; when it is at least new_level_days but fewer than settled_level_days days, settling_level_add business day is added to the counted decision window; when it is settled_level_days days or more, nothing is added for time at the current level."
      declines_24m: "Earlier declined decisions are read from the account history over the 24 months before the request date, an entry dated on the same calendar day 24 months earlier or before it no longer counting: when the history shows at least min_prior_count limit review decision with the outcome declined"
      rfis_24m: "and at least min_prior_count request for information issued in those 24 months"
      redecision_days: "when the history shows at least min_prior_count limit review decision with the outcome declined and at least min_prior_count request for information issued in those 24 months, declined_with_rfi_add business days are added to the counted decision window; when it shows a declined decision but no request for information in those 24 months, declined_only_add business day is added to the counted decision window; when it shows no declined decision in those 24 months, nothing is added for earlier decisions."
      paid_6m: "Recent sending is the USD principal paid out on the customer's personal transfers in the 6 months before the request date, an entry dated on the same calendar day 6 months earlier or before it no longer counting, summed over every Bank Deposit payout sent, every Cash Pickup payout made and every Mobile Wallet credit sent in that window"
      volume_days: "when it is heavy_paid_usd or more, heavy_paid_add business days are added to the counted decision window; when it is at least moderate_paid_usd but below heavy_paid_usd, moderate_paid_add business day is added to the counted decision window; when it is below moderate_paid_usd, nothing is added for recent sending."
      fresh_documents: "Fresh documents are the verification documents received on the account in the month before the request date, a document received on the same calendar day of the previous month or before it no longer counting"
      document_days: "when many_fresh_documents or more were received, many_fresh_add business days are added to the counted decision window; when at least some_fresh_documents but fewer than many_fresh_documents were received, some_fresh_add business day is added to the counted decision window; when none were received, nothing is added for fresh documents."
      cash_payouts_12m: "Cash reliance for the decision window is the number of Cash Pickup payouts made on the customer's transfers in the 12 months before the request date, an entry dated on the same calendar day 12 months earlier or before it no longer counting"
      cash_days: "when it is cash_heavy_payouts or more, cash_heavy_add business days are added to the counted decision window; when it is at least cash_some_payouts but fewer than cash_heavy_payouts, cash_some_add business day is added to the counted decision window; when it is fewer than cash_some_payouts, nothing is added for cash reliance."
      counted_window: "The counted decision window is the standard decision window plus the business days added for time at the current level, for earlier declined decisions, for recent sending, for fresh documents and for cash reliance, each worked out as follows and each added once; the decision window is then the counted decision window after the escalation step."
      recipients_12m: "The escalation step reads the recipients added to the account in the 12 months before the request date, an addition dated on the same calendar day 12 months earlier or before it no longer counting"
      escalated_window: "when committee_recipients or more were added, the request goes to the weekly enhanced due diligence committee and the decision window is the counted decision window rounded up to the next whole multiple of committee_week_days business days, a counted decision window that already is such a multiple staying as it is; when at least second_review_recipients but fewer than committee_recipients were added, a second reviewer checks the file and the decision window is the counted decision window plus half of it, that half rounded up to a whole business day; when fewer than second_review_recipients were added, the decision window is the counted decision window."
    factors:
      - id: level_seasoning
        effect: parameter
        decides: seasoning_days
        bindings: [days_at_level, seasoning_days]
        ladder:
          - when: "the current level took effect fewer than new_level_days calendar days before the request date"
            value: "K('new_level_add')"
          - when: "the current level took effect at least new_level_days but fewer than settled_level_days calendar days before the request date"
            value: "K('settling_level_add')"
          - when: "otherwise (settled_level_days calendar days or more at the current level)"
            value: "0"
        baseline:
          seasoning_days: "0"
        evidence: [date]
        cross_difficulty: null
      - id: earlier_declines
        effect: parameter
        decides: redecision_days
        bindings: [declines_24m, rfis_24m, redecision_days]
        ladder:
          - when: "a declined limit review decision in the 24 months before the request date and a request for information issued in those 24 months"
            value: "K('declined_with_rfi_add')"
          - when: "a declined limit review decision in the 24 months before the request date and no request for information issued in those 24 months"
            value: "K('declined_only_add')"
          - when: "otherwise (no declined decision in those 24 months)"
            value: "0"
        baseline:
          redecision_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: recent_sending
        effect: parameter
        decides: volume_days
        bindings: [paid_6m, volume_days]
        ladder:
          - when: "Bank Deposit, Cash Pickup and Mobile Wallet principal paid out in the 6 months before the request date is heavy_paid_usd or more"
            value: "K('heavy_paid_add')"
          - when: "that principal is at least moderate_paid_usd but below heavy_paid_usd"
            value: "K('moderate_paid_add')"
          - when: "otherwise (below moderate_paid_usd)"
            value: "0"
        baseline:
          volume_days: "0"
        evidence: [cross_category, history]
        cross_difficulty: bank
      - id: fresh_documents
        effect: parameter
        decides: document_days
        bindings: [fresh_documents, document_days]
        ladder:
          - when: "many_fresh_documents or more verification documents received in the month before the request date"
            value: "K('many_fresh_add')"
          - when: "at least some_fresh_documents but fewer than many_fresh_documents received in that month"
            value: "K('some_fresh_add')"
          - when: "otherwise (none received in that month)"
            value: "0"
        baseline:
          document_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: cash_reliance
        effect: parameter
        decides: cash_days
        bindings: [cash_payouts_12m, cash_days]
        ladder:
          - when: "cash_heavy_payouts or more Cash Pickup payouts made in the 12 months before the request date"
            value: "K('cash_heavy_add')"
          - when: "at least cash_some_payouts but fewer than cash_heavy_payouts Cash Pickup payouts made in those 12 months"
            value: "K('cash_some_add')"
          - when: "otherwise (fewer than cash_some_payouts)"
            value: "0"
        baseline:
          cash_days: "0"
        evidence: [cross_category, history]
        cross_difficulty: cash
      - id: review_escalation
        effect: method
        decides: escalated_window
        bindings: [recipients_12m, escalated_window]
        ladder:
          - when: "committee_recipients or more recipients added to the account in the 12 months before the request date"
            method: "weekly enhanced due diligence committee: the counted decision window rounded up to the next whole multiple of committee_week_days business days"
          - when: "at least second_review_recipients but fewer than committee_recipients recipients added in those 12 months"
            method: "second reviewer: the counted decision window plus half of it, the half rounded up to a whole business day"
          - when: "otherwise (fewer than second_review_recipients recipients added)"
            method: "the decision window is the counted decision window as it stands"
        baseline:
          escalated_window: "counted_window"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The decision window of a limit review request is a whole number of Paloma business days, Monday
        to Friday excluding US Federal Reserve holidays.
        The standard decision window is the compliance review time of the level requested, which is the
        level directly above the level the account holds: review_days_enhanced business days when the
        account holds Paloma Verified Plus and so requests Paloma Enhanced, review_days_premier business
        days when it holds Paloma Enhanced and so requests Paloma Premier, and
        review_days_private_client business days when it holds Paloma Premier and so requests Paloma
        Private Client, these being the limit_review_sla_business_days of the levels requested.
        A request for a level reachable without review carries no compliance review time.
        The decision due date of a limit review request is the request date plus the decision window,
        counted forward in Paloma business days from the request date.
      params: [review_days_enhanced, review_days_premier, review_days_private_client]
    inputs:
      history:
        - {table: sender_account_events, aggregate: count, field: account_event_id, within_months: 24, filters: {event_type: account_limit_review_decided, review_outcome: declined}}
        - {table: sender_account_events, aggregate: count, field: account_event_id, within_months: 24, filters: {event_type: account_rfi_issued}}
        - {table: sender_documents, aggregate: count, field: document_id, within_months: 1, filters: {event_type: account_document_received}}
        - {table: sender_account_events, aggregate: count, field: account_event_id, within_months: 12, filters: {event_type: account_recipient_added}}
        - {category: bank, table: bank_ledger, aggregate: sum, field: amount_usd, within_months: 6, filters: {event_type: bank_payout_sent}}
        - {category: cash, table: cash_ledger, aggregate: sum, field: amount_usd, within_months: 6, filters: {event_type: cash_payout_made}}
        - {category: wallet, table: wallet_ledger, aggregate: sum, field: amount_usd, within_months: 6, filters: {event_type: wallet_credit_sent}}
        - {category: cash, table: cash_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: cash_payout_made}}
      cross_category: [bank, cash, wallet]

  - id: account_ext_limits_callback_window
    base_policy_refs: [account_evt_service_entitlements]
    overwrite:
      - base_policy: account_evt_service_entitlements
        superseded_clause: >-
          Its callback_due_date is the request date plus the level's callback_sla_business_days Paloma
          business days (Monday to Friday, excluding US Federal Reserve holidays).
        replaced_by: >-
          The due date of a callback on limits and levels is the request date plus the limits callback
          window, counted forward in Paloma business days from the request date.
      - base_policy: account_evt_service_entitlements
        superseded_clause: >-
          A level with dedicated_support_line true is called back from the priority line, and a level
          with relationship_manager_assigned true is called back by the named relationship manager;
          neither changes the due date.
        replaced_by: >-
          For a callback on limits and levels, a level with a dedicated support line is called back from
          the priority line and a level with a named relationship manager by that manager, and the
          priority line changes the due date of the callback as the queue step states.
    trigger: on_request
    subject: [account_callback_scheduled]
    computes: callback_window_business_days
    target_tool: schedule_limits_callback_7588c2a7
    params:
      far_decision_days: 14
      near_decision_days: 7
      far_decision_add: 2
      near_decision_add: 1
      new_account_months: 12
      established_account_months: 36
      new_account_add: 2
      young_account_add: 1
      many_answers: 2
      one_answer: 1
      many_answers_add: 2
      one_answer_add: 1
      many_payees: 4
      some_payees: 2
      many_payees_add: 2
      some_payees_add: 1
      many_ceiling_payouts: 3
      some_ceiling_payouts: 1
      many_ceiling_cut: 3
      some_ceiling_cut: 2
      shortest_window_days: 1
    rule: >-
      A callback on limits and levels is not booked until the account history carries a limit review
      request that compliance has not yet decided.
      The limits callback window is a whole number of Paloma business days, Monday to Friday excluding
      US Federal Reserve holidays.
      The limits callback window governs callbacks on limits and levels only.
      For a callback on limits and levels, a level with a dedicated support line is called back from
      the priority line and a level with a named relationship manager by that manager, and the
      priority line changes the due date of the callback as the queue step states.
      The standard limits callback window is the callback_sla_business_days of the level the account
      holds on the request date.
      The due date of a callback on limits and levels is the request date plus the limits callback
      window, counted forward in Paloma business days from the request date.
      The counted limits callback window is the standard limits callback window plus the business days
      added for the distance to the review decision, for the account's age, for transfer information
      already answered and for new payees, less the business days taken off for payouts at the
      per-transfer ceiling, each worked out as follows and each applied once; the limits callback window
      is then the counted limits callback window after the queue step, and never fewer than
      shortest_window_days business day.
      The distance to the review decision is the number of calendar days from the callback request date
      to the decision due date of the account's most recent limit review request: when it is
      far_decision_days days or more, far_decision_add business days are added to the counted limits
      callback window; when it is at least near_decision_days but fewer than far_decision_days days,
      near_decision_add business day is added to the counted limits callback window; when it is fewer
      than near_decision_days days, or that decision due date is on or before the callback request
      date, nothing is added for the distance to the review decision.
      The account's age is counted in whole calendar months from the date the account was opened to the
      callback request date: when it is fewer than new_account_months months, new_account_add business
      days are added to the counted limits callback window; when it is at least new_account_months but
      fewer than established_account_months months, young_account_add business day is added to the
      counted limits callback window; when it is established_account_months months or more, nothing is
      added for the account's age.
      Transfer information already answered is the number of answers to transfer-level requests for
      information logged on the customer's Bank Deposit transfers in the 6 months before the callback
      request date, an answer dated on the same calendar day 6 months earlier or before it no longer
      counting: when it is many_answers or more, many_answers_add business days are added to the counted
      limits callback window; when it is one_answer, one_answer_add business day is added to the counted
      limits callback window; when there is none, nothing is added for transfer information already
      answered.
      New payees are the recipients added to the account in the 12 months before the callback request
      date, an addition dated on the same calendar day 12 months earlier or before it no longer counting:
      when many_payees or more were added, many_payees_add business days are added to the counted limits
      callback window; when at least some_payees but fewer than many_payees were added,
      some_payees_add business day is added to the counted limits callback window; when fewer than
      some_payees were added, nothing is added for new payees.
      Payouts at the per-transfer ceiling are the Bank Deposit payouts sent in the 6 months before the
      callback request date, an entry dated on the same calendar day 6 months earlier or before it no
      longer counting, whose USD principal equals exactly the per-transfer limit of the level the account
      holds on the callback request date: when there are many_ceiling_payouts or more,
      many_ceiling_cut business days are taken off the counted limits callback window; when there are at
      least some_ceiling_payouts but fewer than many_ceiling_payouts, some_ceiling_cut business day is
      taken off the counted limits callback window; when there is none, nothing is taken off for payouts
      at the ceiling.
      The queue step reads the account's earlier callbacks: when the most recently requested earlier
      callback on the account still has a callback due date on or after the callback request date, the
      new callback waits behind it and the limits callback window is the counted limits callback window
      plus half of it, that half rounded up to a whole business day; when no earlier callback is still
      due and the level the account holds has a dedicated support line, the priority line takes it and
      the limits callback window is half the counted limits callback window, rounded up to a whole
      business day; otherwise the limits callback window is the counted limits callback window.
    prerequisite:
      - problem: account_ext_review_decision_window
        kind: value_input
        gate: decision_gap_days
        form: state
        policy_source: >-
          A callback on limits and levels is not booked until the account history carries a limit review
          request that compliance has not yet decided.
        condition: >-
          sender_account_events holds, for this sender account, a row of event_type
          account_limit_review_requested with no account_limit_review_decided row pointing back to it.
        resolved_by: lodge_limit_review_54a88584
        effect: >-
          Once the undecided limit review request stands, the most recent request's decision due date is
          the date its decision window reaches, so the distance to the review decision (decision_gap_days)
          becomes that many calendar days ahead and the addition for the distance to the review decision
          moves off zero.
    cross_category:
      - category: bank
        as: history
        reads: [bank_cases.event_type, bank_cases.case_date, bank_ledger.amount_usd, bank_ledger.entry_date]
        note: Transfer information already answered counts Bank Deposit transfer-level information answers, and payouts at the ceiling count Bank Deposit payouts equal to the per-transfer limit.
    compute:
      - standard_callback_days: "P('callback_sla_business_days')"
      - pending_decision_due: "LATEST('sender_account_events', 'decision_due_date', date_field='event_date', event_type='account_limit_review_requested')"
      - decision_gap_days: "DAYS(NOW, pending_decision_due)"
      - decision_distance_days: "K('far_decision_add') if decision_gap_days >= K('far_decision_days') else (K('near_decision_add') if decision_gap_days >= K('near_decision_days') else 0)"
      - account_age_months: "MONTHS(F('opened_date'), NOW)"
      - account_age_days: "K('new_account_add') if account_age_months < K('new_account_months') else (K('young_account_add') if account_age_months < K('established_account_months') else 0)"
      - answers_6m: "XCOUNT('bank', 'bank_cases', within_months=6, date_field='case_date', event_type='bank_rfi_answer_logged')"
      - answer_days: "K('many_answers_add') if answers_6m >= K('many_answers') else (K('one_answer_add') if answers_6m >= K('one_answer') else 0)"
      - payees_12m: "COUNT('sender_account_events', within_months=12, date_field='event_date', event_type='account_recipient_added')"
      - payee_days: "K('many_payees_add') if payees_12m >= K('many_payees') else (K('some_payees_add') if payees_12m >= K('some_payees') else 0)"
      - ceiling_payouts_6m: "XCOUNT('bank', 'bank_ledger', within_months=6, date_field='entry_date', event_type='bank_payout_sent', amount_usd=P('per_transfer_limit_usd'))"
      - ceiling_cut_days: "K('many_ceiling_cut') if ceiling_payouts_6m >= K('many_ceiling_payouts') else (K('some_ceiling_cut') if ceiling_payouts_6m >= K('some_ceiling_payouts') else 0)"
      - counted_callback_days: "standard_callback_days + decision_distance_days + account_age_days + answer_days + payee_days - ceiling_cut_days"
      - latest_earlier_callback_due: "LATEST('sender_account_events', 'callback_due_date', date_field='event_date', event_type='account_callback_scheduled')"
      - queued_callback_days: "(counted_callback_days + (counted_callback_days + 1) // 2) if latest_earlier_callback_due >= NOW else (((counted_callback_days + 1) // 2) if P('dedicated_support_line') else counted_callback_days)"
      - result: "MX(K('shortest_window_days'), queued_callback_days)"
    compute_basis:
      standard_callback_days: "The standard limits callback window is the callback_sla_business_days of the level the account holds on the request date."
      pending_decision_due: "The distance to the review decision is the number of calendar days from the callback request date to the decision due date of the account's most recent limit review request"
      decision_gap_days: "The distance to the review decision is the number of calendar days from the callback request date to the decision due date of the account's most recent limit review request"
      decision_distance_days: "when it is far_decision_days days or more, far_decision_add business days are added to the counted limits callback window; when it is at least near_decision_days but fewer than far_decision_days days, near_decision_add business day is added to the counted limits callback window; when it is fewer than near_decision_days days, or that decision due date is on or before the callback request date, nothing is added for the distance to the review decision."
      account_age_months: "The account's age is counted in whole calendar months from the date the account was opened to the callback request date"
      account_age_days: "when it is fewer than new_account_months months, new_account_add business days are added to the counted limits callback window; when it is at least new_account_months but fewer than established_account_months months, young_account_add business day is added to the counted limits callback window; when it is established_account_months months or more, nothing is added for the account's age."
      answers_6m: "Transfer information already answered is the number of answers to transfer-level requests for information logged on the customer's Bank Deposit transfers in the 6 months before the callback request date, an answer dated on the same calendar day 6 months earlier or before it no longer counting"
      answer_days: "when it is many_answers or more, many_answers_add business days are added to the counted limits callback window; when it is one_answer, one_answer_add business day is added to the counted limits callback window; when there is none, nothing is added for transfer information already answered."
      payees_12m: "New payees are the recipients added to the account in the 12 months before the callback request date, an addition dated on the same calendar day 12 months earlier or before it no longer counting"
      payee_days: "when many_payees or more were added, many_payees_add business days are added to the counted limits callback window; when at least some_payees but fewer than many_payees were added, some_payees_add business day is added to the counted limits callback window; when fewer than some_payees were added, nothing is added for new payees."
      ceiling_payouts_6m: "Payouts at the per-transfer ceiling are the Bank Deposit payouts sent in the 6 months before the callback request date, an entry dated on the same calendar day 6 months earlier or before it no longer counting, whose USD principal equals exactly the per-transfer limit of the level the account holds on the callback request date"
      ceiling_cut_days: "when there are many_ceiling_payouts or more, many_ceiling_cut business days are taken off the counted limits callback window; when there are at least some_ceiling_payouts but fewer than many_ceiling_payouts, some_ceiling_cut business day is taken off the counted limits callback window; when there is none, nothing is taken off for payouts at the ceiling."
      counted_callback_days: "The counted limits callback window is the standard limits callback window plus the business days added for the distance to the review decision, for the account's age, for transfer information already answered and for new payees, less the business days taken off for payouts at the per-transfer ceiling, each worked out as follows and each applied once"
      latest_earlier_callback_due: "The queue step reads the account's earlier callbacks: when the most recently requested earlier callback on the account still has a callback due date on or after the callback request date"
      queued_callback_days: "when the most recently requested earlier callback on the account still has a callback due date on or after the callback request date, the new callback waits behind it and the limits callback window is the counted limits callback window plus half of it, that half rounded up to a whole business day; when no earlier callback is still due and the level the account holds has a dedicated support line, the priority line takes it and the limits callback window is half the counted limits callback window, rounded up to a whole business day; otherwise the limits callback window is the counted limits callback window."
      result: "the limits callback window is then the counted limits callback window after the queue step, and never fewer than shortest_window_days business day."
    factors:
      - id: decision_distance
        effect: parameter
        decides: decision_distance_days
        bindings: [pending_decision_due, decision_gap_days, decision_distance_days]
        ladder:
          - when: "the most recent limit review request's decision due date lies far_decision_days or more calendar days after the callback request date"
            value: "K('far_decision_add')"
          - when: "it lies at least near_decision_days but fewer than far_decision_days calendar days after"
            value: "K('near_decision_add')"
          - when: "otherwise (fewer than near_decision_days days after, or on or before the callback request date)"
            value: "0"
        baseline:
          decision_distance_days: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: account_age
        effect: parameter
        decides: account_age_days
        bindings: [account_age_months, account_age_days]
        ladder:
          - when: "the account was opened fewer than new_account_months whole months before the callback request date"
            value: "K('new_account_add')"
          - when: "it was opened at least new_account_months but fewer than established_account_months months before"
            value: "K('young_account_add')"
          - when: "otherwise (established_account_months months or more)"
            value: "0"
        baseline:
          account_age_days: "0"
        evidence: [date]
        cross_difficulty: null
      - id: answered_transfer_information
        effect: parameter
        decides: answer_days
        bindings: [answers_6m, answer_days]
        ladder:
          - when: "many_answers or more transfer-level information answers logged on the customer's Bank Deposit transfers in the 6 months before the callback request date"
            value: "K('many_answers_add')"
          - when: "exactly one_answer such answer in those 6 months"
            value: "K('one_answer_add')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          answer_days: "0"
        evidence: [cross_category, history]
        cross_difficulty: bank
      - id: new_payees
        effect: parameter
        decides: payee_days
        bindings: [payees_12m, payee_days]
        ladder:
          - when: "many_payees or more recipients added to the account in the 12 months before the callback request date"
            value: "K('many_payees_add')"
          - when: "at least some_payees but fewer than many_payees recipients added in those 12 months"
            value: "K('some_payees_add')"
          - when: "otherwise (fewer than some_payees)"
            value: "0"
        baseline:
          payee_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: ceiling_payouts
        effect: parameter
        decides: ceiling_cut_days
        bindings: [ceiling_payouts_6m, ceiling_cut_days]
        ladder:
          - when: "many_ceiling_payouts or more Bank Deposit payouts in the 6 months before the callback request date whose USD principal equals the per-transfer limit of the level held"
            value: "K('many_ceiling_cut')"
          - when: "at least some_ceiling_payouts but fewer than many_ceiling_payouts such payouts"
            value: "K('some_ceiling_cut')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          ceiling_cut_days: "0"
        evidence: [cross_category, history, tier_param]
        cross_difficulty: bank
      - id: callback_queue
        effect: method
        decides: queued_callback_days
        bindings: [latest_earlier_callback_due, queued_callback_days]
        ladder:
          - when: "the most recently requested earlier callback on the account is still due on or after the callback request date"
            method: "the new callback waits behind it: the counted limits callback window plus half of it, the half rounded up to a whole business day"
          - when: "no earlier callback is still due and the level held has a dedicated support line"
            method: "the priority line takes it: half the counted limits callback window, rounded up to a whole business day"
          - when: "otherwise"
            method: "the limits callback window is the counted limits callback window as it stands"
        baseline:
          queued_callback_days: "counted_callback_days"
        evidence: [history, tier_param]
        cross_difficulty: null
    baseline:
      rule: >-
        The limits callback window is a whole number of Paloma business days, Monday to Friday excluding
        US Federal Reserve holidays.
        The standard limits callback window is the callback_sla_business_days of the level the account
        holds on the request date.
        The due date of a callback on limits and levels is the request date plus the limits callback
        window, counted forward in Paloma business days from the request date.
      params: [callback_sla_business_days]
    inputs:
      history:
        - {table: sender_account_events, aggregate: latest, field: decision_due_date, filters: {event_type: account_limit_review_requested}}
        - {table: sender_account_events, aggregate: count, field: account_event_id, within_months: 12, filters: {event_type: account_recipient_added}}
        - {table: sender_account_events, aggregate: latest, field: callback_due_date, filters: {event_type: account_callback_scheduled}}
        - {category: bank, table: bank_cases, aggregate: count, field: case_id, within_months: 6, filters: {event_type: bank_rfi_answer_logged}}
        - {category: bank, table: bank_ledger, aggregate: count, field: ledger_entry_id, within_months: 6, filters: {event_type: bank_payout_sent}}
      cross_category: [bank]

  - id: account_ext_upgrade_refresh_interval
    base_policy_refs: [account_sending_limits, account_evt_level_upgrade, account_evt_funding_entitlements]
    overwrite:
      - base_policy: account_evt_level_upgrade
        superseded_clause: >-
          next_review_due_date is reset to the upgrade date plus the new level's
          periodic_review_interval_months calendar months (empty when 0)
        replaced_by: >-
          The next periodic review of an upgraded account falls due the refresh interval, in whole calendar
          months, after the upgrade date, on the same day of the month or on the last day of a shorter month.
    trigger: on_request
    subject: [account_level_upgraded]
    computes: review_interval_months
    target_tool: apply_level_upgrade_725c1de1
    params:
      standard_refresh_months: 36
      shortest_refresh_months: 12
      soonest_review_months: 3
      cash_heavy_payouts: 8
      cash_some_payouts: 4
      cash_heavy_cut: 6
      cash_some_cut: 3
      payee_volume_usd: 3000.00
      wide_payee_count: 2
      single_payee_count: 1
      wide_payee_cut: 6
      single_payee_cut: 3
      rejections_many: 2
      rejections_one: 1
      rejections_many_cut: 6
      rejections_one_cut: 3
      stale_evidence_months: 18
    rule: >-
      The refresh interval of an upgraded account is a whole number of calendar months.
      The standard refresh interval is standard_refresh_months calendar months counted from the upgrade
      date, the periodic_review_interval_months of Paloma Verified and Paloma Verified Plus, the levels
      an agent applies.
      The next periodic review of an upgraded account falls due the refresh interval, in whole calendar
      months, after the upgrade date, on the same day of the month or on the last day of a shorter month.
      The risk-weighted refresh interval is the standard refresh interval less the months taken off for
      cash reliance, for payee spread and for rejected documents, each worked out as follows and each
      taken off once, and never below shortest_refresh_months months; the refresh interval is then the
      risk-weighted refresh interval counted from the starting point the evidence-age step selects, that
      is the risk-weighted refresh interval less the whole calendar months already run from that starting
      point to the upgrade date, and never fewer than soonest_review_months months.
      Cash reliance for the refresh interval is the number of Cash Pickup payouts made on the customer's
      transfers in the 12 months before the upgrade date, an entry dated on the same calendar day 12
      months earlier or before it no longer counting: when it is cash_heavy_payouts or more,
      cash_heavy_cut months are taken off the refresh interval; when it is at least cash_some_payouts but
      fewer than cash_heavy_payouts, cash_some_cut months are taken off the refresh interval; when it is
      fewer than cash_some_payouts, nothing is taken off for cash reliance.
      Payee spread reads the USD principal of the Bank Deposit payouts sent in the 6 months before the
      upgrade date, an entry dated on the same calendar day 6 months earlier or before it no longer
      counting, together with the recipients added to the account in the 12 months before the upgrade
      date, an addition dated on the same calendar day 12 months earlier or before it no longer counting:
      when that principal is payee_volume_usd or more and wide_payee_count or more recipients were added,
      wide_payee_cut months are taken off the refresh interval; when that principal is payee_volume_usd or
      more and exactly single_payee_count recipient was added, single_payee_cut months are taken off the
      refresh interval; otherwise nothing is taken off for payee spread.
      Rejected documents are the document reviews with the outcome rejected recorded on the account in
      the 24 months before the upgrade date, a review dated on the same calendar day 24 months earlier or
      before it no longer counting: when there are rejections_many or more, rejections_many_cut months are
      taken off the refresh interval; when there is exactly rejections_one, rejections_one_cut months are
      taken off the refresh interval; when there is none, nothing is taken off for rejected documents.
      The evidence-age step selects the starting point of the refresh interval from the identity evidence
      every level relies on: when the latest accepted government photo ID was accepted
      stale_evidence_months or more whole calendar months before the upgrade date, the interval runs from
      the date that ID was accepted; when that ID was accepted fewer than stale_evidence_months months
      before but the latest accepted selfie was accepted stale_evidence_months or more months before, the
      interval runs from the date that selfie was accepted; otherwise the interval runs from the upgrade
      date.
    prerequisite: []
    cross_category:
      - category: cash
        as: history
        reads: [cash_ledger.event_type, cash_ledger.entry_date]
        note: Cash reliance counts the Cash Pickup payouts made on the customer's transfers in the last 12 months.
      - category: bank
        as: history
        reads: [bank_ledger.amount_usd, bank_ledger.entry_date]
        note: Payee spread sums the Bank Deposit payouts sent in the last 6 months.
    compute:
      - cash_payouts_12m: "XCOUNT('cash', 'cash_ledger', within_months=12, date_field='entry_date', event_type='cash_payout_made')"
      - cash_cut_months: "K('cash_heavy_cut') if cash_payouts_12m >= K('cash_heavy_payouts') else (K('cash_some_cut') if cash_payouts_12m >= K('cash_some_payouts') else 0)"
      - bank_paid_6m: "XSUM('bank', 'bank_ledger', 'amount_usd', within_months=6, date_field='entry_date', event_type='bank_payout_sent')"
      - payees_added_12m: "COUNT('sender_account_events', within_months=12, date_field='event_date', event_type='account_recipient_added')"
      - payee_cut_months: "K('wide_payee_cut') if (bank_paid_6m >= K('payee_volume_usd') and payees_added_12m >= K('wide_payee_count')) else (K('single_payee_cut') if (bank_paid_6m >= K('payee_volume_usd') and payees_added_12m == K('single_payee_count')) else 0)"
      - rejected_reviews_24m: "COUNT('sender_documents', within_months=24, date_field='reviewed_date', event_type='account_document_reviewed', review_status='rejected')"
      - rejection_cut_months: "K('rejections_many_cut') if rejected_reviews_24m >= K('rejections_many') else (K('rejections_one_cut') if rejected_reviews_24m == K('rejections_one') else 0)"
      - risk_weighted_months: "MX(K('shortest_refresh_months'), K('standard_refresh_months') - cash_cut_months - payee_cut_months - rejection_cut_months)"
      - id_accepted_on: "LATEST('sender_documents', 'reviewed_date', date_field='reviewed_date', event_type='account_document_reviewed', doc_type='government_id', review_status='accepted')"
      - selfie_accepted_on: "LATEST('sender_documents', 'reviewed_date', date_field='reviewed_date', event_type='account_document_reviewed', doc_type='selfie', review_status='accepted')"
      - id_age_months: "MONTHS(id_accepted_on, NOW)"
      - selfie_age_months: "MONTHS(selfie_accepted_on, NOW)"
      - months_already_run: "id_age_months if id_age_months >= K('stale_evidence_months') else (selfie_age_months if selfie_age_months >= K('stale_evidence_months') else 0)"
      - result: "MX(K('soonest_review_months'), risk_weighted_months - months_already_run)"
    compute_basis:
      cash_payouts_12m: "Cash reliance for the refresh interval is the number of Cash Pickup payouts made on the customer's transfers in the 12 months before the upgrade date, an entry dated on the same calendar day 12 months earlier or before it no longer counting"
      cash_cut_months: "when it is cash_heavy_payouts or more, cash_heavy_cut months are taken off the refresh interval; when it is at least cash_some_payouts but fewer than cash_heavy_payouts, cash_some_cut months are taken off the refresh interval; when it is fewer than cash_some_payouts, nothing is taken off for cash reliance."
      bank_paid_6m: "Payee spread reads the USD principal of the Bank Deposit payouts sent in the 6 months before the upgrade date, an entry dated on the same calendar day 6 months earlier or before it no longer counting"
      payees_added_12m: "together with the recipients added to the account in the 12 months before the upgrade date, an addition dated on the same calendar day 12 months earlier or before it no longer counting"
      payee_cut_months: "when that principal is payee_volume_usd or more and wide_payee_count or more recipients were added, wide_payee_cut months are taken off the refresh interval; when that principal is payee_volume_usd or more and exactly single_payee_count recipient was added, single_payee_cut months are taken off the refresh interval; otherwise nothing is taken off for payee spread."
      rejected_reviews_24m: "Rejected documents are the document reviews with the outcome rejected recorded on the account in the 24 months before the upgrade date, a review dated on the same calendar day 24 months earlier or before it no longer counting"
      rejection_cut_months: "when there are rejections_many or more, rejections_many_cut months are taken off the refresh interval; when there is exactly rejections_one, rejections_one_cut months are taken off the refresh interval; when there is none, nothing is taken off for rejected documents."
      risk_weighted_months: "The risk-weighted refresh interval is the standard refresh interval less the months taken off for cash reliance, for payee spread and for rejected documents, each worked out as follows and each taken off once, and never below shortest_refresh_months months"
      id_accepted_on: "when the latest accepted government photo ID was accepted stale_evidence_months or more whole calendar months before the upgrade date, the interval runs from the date that ID was accepted"
      selfie_accepted_on: "when that ID was accepted fewer than stale_evidence_months months before but the latest accepted selfie was accepted stale_evidence_months or more months before, the interval runs from the date that selfie was accepted"
      id_age_months: "when the latest accepted government photo ID was accepted stale_evidence_months or more whole calendar months before the upgrade date"
      selfie_age_months: "the latest accepted selfie was accepted stale_evidence_months or more months before"
      months_already_run: "The evidence-age step selects the starting point of the refresh interval from the identity evidence every level relies on: when the latest accepted government photo ID was accepted stale_evidence_months or more whole calendar months before the upgrade date, the interval runs from the date that ID was accepted; when that ID was accepted fewer than stale_evidence_months months before but the latest accepted selfie was accepted stale_evidence_months or more months before, the interval runs from the date that selfie was accepted; otherwise the interval runs from the upgrade date."
      result: "the refresh interval is then the risk-weighted refresh interval counted from the starting point the evidence-age step selects, that is the risk-weighted refresh interval less the whole calendar months already run from that starting point to the upgrade date, and never fewer than soonest_review_months months."
    factors:
      - id: refresh_cash_reliance
        effect: parameter
        decides: cash_cut_months
        bindings: [cash_payouts_12m, cash_cut_months]
        ladder:
          - when: "cash_heavy_payouts or more Cash Pickup payouts made in the 12 months before the upgrade date"
            value: "K('cash_heavy_cut')"
          - when: "at least cash_some_payouts but fewer than cash_heavy_payouts Cash Pickup payouts made in those 12 months"
            value: "K('cash_some_cut')"
          - when: "otherwise (fewer than cash_some_payouts)"
            value: "0"
        baseline:
          cash_cut_months: "0"
        evidence: [cross_category, history]
        cross_difficulty: cash
      - id: payee_spread
        effect: parameter
        decides: payee_cut_months
        bindings: [bank_paid_6m, payees_added_12m, payee_cut_months]
        ladder:
          - when: "Bank Deposit principal paid out in the 6 months before the upgrade date is payee_volume_usd or more AND wide_payee_count or more recipients were added in the 12 months before it"
            value: "K('wide_payee_cut')"
          - when: "that principal is payee_volume_usd or more AND exactly single_payee_count recipient was added in those 12 months"
            value: "K('single_payee_cut')"
          - when: "otherwise"
            value: "0"
        baseline:
          payee_cut_months: "0"
        evidence: [cross_category, history]
        cross_difficulty: bank
      - id: rejected_documents
        effect: parameter
        decides: rejection_cut_months
        bindings: [rejected_reviews_24m, rejection_cut_months]
        ladder:
          - when: "rejections_many or more rejected document reviews in the 24 months before the upgrade date"
            value: "K('rejections_many_cut')"
          - when: "exactly rejections_one rejected document review in those 24 months"
            value: "K('rejections_one_cut')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          rejection_cut_months: "0"
        evidence: [history]
        cross_difficulty: null
      - id: evidence_age_start
        effect: method
        decides: months_already_run
        bindings: [id_accepted_on, selfie_accepted_on, id_age_months, selfie_age_months, months_already_run]
        ladder:
          - when: "the latest accepted government photo ID was accepted stale_evidence_months or more whole months before the upgrade date"
            method: "the interval runs from the ID's acceptance date: the whole months already run from it are taken off the risk-weighted interval"
          - when: "the ID was accepted fewer than stale_evidence_months months before but the latest accepted selfie stale_evidence_months or more months before"
            method: "the interval runs from the selfie's acceptance date: the whole months already run from it are taken off"
          - when: "otherwise"
            method: "the interval runs from the upgrade date: nothing has run yet"
        baseline:
          months_already_run: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The refresh interval of an upgraded account is a whole number of calendar months.
        The standard refresh interval is standard_refresh_months calendar months counted from the upgrade
        date, the periodic_review_interval_months of Paloma Verified and Paloma Verified Plus, the levels
        an agent applies.
        The next periodic review of an upgraded account falls due the refresh interval, in whole calendar
        months, after the upgrade date, on the same day of the month or on the last day of a shorter month.
      params: [standard_refresh_months]
    inputs:
      history:
        - {table: sender_account_events, aggregate: count, field: account_event_id, within_months: 12, filters: {event_type: account_recipient_added}}
        - {table: sender_documents, aggregate: count, field: document_id, within_months: 24, filters: {event_type: account_document_reviewed, review_status: rejected}}
        - {table: sender_documents, aggregate: latest, field: reviewed_date, filters: {event_type: account_document_reviewed, doc_type: government_id, review_status: accepted}}
        - {table: sender_documents, aggregate: latest, field: reviewed_date, filters: {event_type: account_document_reviewed, doc_type: selfie, review_status: accepted}}
        - {category: cash, table: cash_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: cash_payout_made}}
        - {category: bank, table: bank_ledger, aggregate: sum, field: amount_usd, within_months: 6, filters: {event_type: bank_payout_sent}}
      cross_category: [cash, bank]

  - id: account_ext_statement_delivery_window
    base_policy_refs: [account_evt_service_entitlements]
    overwrite:
      - base_policy: account_evt_service_entitlements
        superseded_clause: >-
          delivery_due_date is the request date plus statement_delivery_business_days Paloma business days.
        replaced_by: >-
          The delivery due date of a statement is the request date plus the statement delivery window,
          counted forward in Paloma business days from the request date.
    trigger: on_request
    subject: [account_statement_requested]
    computes: delivery_window_business_days
    target_tool: request_account_statement_ee1d8031
    params:
      last_statement_add: 2
      busy_allowance_add: 1
      many_payouts: 24
      some_payouts: 12
      many_payouts_add: 2
      some_payouts_add: 1
      many_open_notices: 2
      one_open_notice: 1
      many_notices_add: 2
      one_notice_add: 1
      many_rfis: 2
      one_rfi: 1
      many_rfis_add: 2
      one_rfi_add: 1
      all_methods: 3
      two_methods: 2
      weekly_run_days: 5
    rule: >-
      The delivery window of a statement is fixed only after the account holds a level whose statement
      history reaches back to the first day of the period requested.
      The statement delivery window is a whole number of Paloma business days, Monday to Friday excluding
      US Federal Reserve holidays.
      The standard statement delivery window is the statement_delivery_business_days of the level the
      account holds on the request date.
      The delivery due date of a statement is the request date plus the statement delivery window,
      counted forward in Paloma business days from the request date.
      The counted statement window is the standard statement delivery window plus the business days added
      for the yearly statement allowance, for transfer volume, for open error notices and for compliance
      release, each worked out as follows and each added once; the statement delivery window is then the
      counted statement window after the consolidation step.
      The yearly statement allowance step counts the statements requested on the account in the 12 months
      before the request date, an entry dated on the same calendar day 12 months earlier or before it no
      longer counting, plus the statement now requested: when that count reaches the statements_per_12m of
      the level held, last_statement_add business days are added to the counted statement window; when it
      is below statements_per_12m but more than half of it, busy_allowance_add business day is added to
      the counted statement window; when it is half of statements_per_12m or less, nothing is added for the
      yearly statement allowance.
      Transfer volume for the statement is the number of payouts on the customer's personal transfers in
      the 12 months before the request date, an entry dated on the same calendar day 12 months earlier or
      before it no longer counting, counting every Bank Deposit payout sent, every Cash Pickup payout made
      and every Mobile Wallet credit sent: when it is many_payouts or more, many_payouts_add business days
      are added to the counted statement window; when it is at least some_payouts but fewer than
      many_payouts, some_payouts_add business day is added to the counted statement window; when it is
      fewer than some_payouts, nothing is added for transfer volume.
      Open error notices are the error notices given on the customer's Bank Deposit, Cash Pickup and Mobile
      Wallet transfers that carry no decision yet, counted in each delivery method as the error notices on
      record less the error decisions on record: when there are many_open_notices or more,
      many_notices_add business days are added to the counted statement window; when there is exactly
      one_open_notice, one_notice_add business day is added to the counted statement window; when there is
      none, nothing is added for open error notices.
      Compliance release reads the requests for information issued on the account in the 12 months before
      the request date, an entry dated on the same calendar day 12 months earlier or before it no longer
      counting: when there are many_rfis or more, many_rfis_add business days are added to the counted
      statement window; when there is exactly one_rfi, one_rfi_add business day is added to the counted
      statement window; when there is none, nothing is added for compliance release.
      The consolidation step counts the delivery methods, of Bank Deposit, Cash Pickup and Mobile Wallet,
      that carry at least one payout in the 12 months before the request date: when all_methods of them
      carry one, the statement goes to the weekly consolidation run and the statement delivery window is
      the counted statement window rounded up to the next whole multiple of weekly_run_days business days,
      a counted statement window that already is such a multiple staying as it is; when exactly
      two_methods of them carry one, the statement is reconciled across two ledgers and the statement
      delivery window is the counted statement window plus half of it, that half rounded up to a whole
      business day; when one or none carries one, the statement delivery window is the counted statement
      window.
    prerequisite:
      - problem: account_ext_upgrade_refresh_interval
        kind: value_input
        gate: allowance_days
        form: state
        policy_source: >-
          The delivery window of a statement is fixed only after the account holds a level whose statement
          history reaches back to the first day of the period requested.
        condition: >-
          sender_accounts.variant_name of this account names a level whose statement_history_months is at
          least the whole calendar months from the requested statement_period_start to the request date
          (statement_period_start on or after the request date minus statement_history_months months).
        resolved_by: apply_level_upgrade_725c1de1
        effect: >-
          Once the account holds the higher level, the level-held parameters the statement window reads
          change with it: the yearly statement allowance (statements_per_12m) the allowance step compares
          against grows, so allowance_days moves to the tier of the level now held.
    cross_category:
      - category: bank
        as: history
        reads: [bank_ledger.event_type, bank_ledger.entry_date, bank_cases.event_type]
        note: Transfer volume and the consolidation step count Bank Deposit payouts sent; open error notices count Bank Deposit notices less decisions.
      - category: cash
        as: history
        reads: [cash_ledger.event_type, cash_ledger.entry_date, cash_cases.event_type]
        note: Transfer volume and the consolidation step count Cash Pickup payouts made; open error notices count Cash Pickup notices less decisions.
      - category: wallet
        as: history
        reads: [wallet_ledger.event_type, wallet_ledger.entry_date, wallet_cases.event_type]
        note: Transfer volume and the consolidation step count Mobile Wallet credits sent; open error notices count Mobile Wallet notices less decisions.
    compute:
      - standard_statement_days: "P('statement_delivery_business_days')"
      - statements_12m: "COUNT('sender_account_events', within_months=12, date_field='event_date', event_type='account_statement_requested')"
      - statements_with_this: "statements_12m + 1"
      - allowance_days: "K('last_statement_add') if statements_with_this >= P('statements_per_12m') else (K('busy_allowance_add') if statements_with_this * 2 > P('statements_per_12m') else 0)"
      - payouts_12m: "XCOUNT('bank', 'bank_ledger', within_months=12, date_field='entry_date', event_type='bank_payout_sent') + XCOUNT('cash', 'cash_ledger', within_months=12, date_field='entry_date', event_type='cash_payout_made') + XCOUNT('wallet', 'wallet_ledger', within_months=12, date_field='entry_date', event_type='wallet_credit_sent')"
      - volume_days: "K('many_payouts_add') if payouts_12m >= K('many_payouts') else (K('some_payouts_add') if payouts_12m >= K('some_payouts') else 0)"
      - open_notices: "(XCOUNT('bank', 'bank_cases', event_type='bank_error_notice_filed') - XCOUNT('bank', 'bank_cases', event_type='bank_error_decided')) + (XCOUNT('cash', 'cash_cases', event_type='cash_error_notice_filed') - XCOUNT('cash', 'cash_cases', event_type='cash_error_decided')) + (XCOUNT('wallet', 'wallet_cases', event_type='wallet_error_notice_filed') - XCOUNT('wallet', 'wallet_cases', event_type='wallet_error_decided'))"
      - notice_days: "K('many_notices_add') if open_notices >= K('many_open_notices') else (K('one_notice_add') if open_notices == K('one_open_notice') else 0)"
      - rfis_12m: "COUNT('sender_account_events', within_months=12, date_field='event_date', event_type='account_rfi_issued')"
      - release_days: "K('many_rfis_add') if rfis_12m >= K('many_rfis') else (K('one_rfi_add') if rfis_12m == K('one_rfi') else 0)"
      - counted_statement_days: "standard_statement_days + allowance_days + volume_days + notice_days + release_days"
      - methods_with_payouts: "(1 if XCOUNT('bank', 'bank_ledger', within_months=12, date_field='entry_date', event_type='bank_payout_sent') > 0 else 0) + (1 if XCOUNT('cash', 'cash_ledger', within_months=12, date_field='entry_date', event_type='cash_payout_made') > 0 else 0) + (1 if XCOUNT('wallet', 'wallet_ledger', within_months=12, date_field='entry_date', event_type='wallet_credit_sent') > 0 else 0)"
      - consolidated_days: "((counted_statement_days + K('weekly_run_days') - 1) // K('weekly_run_days')) * K('weekly_run_days') if methods_with_payouts >= K('all_methods') else ((counted_statement_days + (counted_statement_days + 1) // 2) if methods_with_payouts == K('two_methods') else counted_statement_days)"
      - result: "consolidated_days"
    compute_basis:
      standard_statement_days: "The standard statement delivery window is the statement_delivery_business_days of the level the account holds on the request date."
      statements_12m: "The yearly statement allowance step counts the statements requested on the account in the 12 months before the request date, an entry dated on the same calendar day 12 months earlier or before it no longer counting"
      statements_with_this: "plus the statement now requested"
      allowance_days: "when that count reaches the statements_per_12m of the level held, last_statement_add business days are added to the counted statement window; when it is below statements_per_12m but more than half of it, busy_allowance_add business day is added to the counted statement window; when it is half of statements_per_12m or less, nothing is added for the yearly statement allowance."
      payouts_12m: "Transfer volume for the statement is the number of payouts on the customer's personal transfers in the 12 months before the request date, an entry dated on the same calendar day 12 months earlier or before it no longer counting, counting every Bank Deposit payout sent, every Cash Pickup payout made and every Mobile Wallet credit sent"
      volume_days: "when it is many_payouts or more, many_payouts_add business days are added to the counted statement window; when it is at least some_payouts but fewer than many_payouts, some_payouts_add business day is added to the counted statement window; when it is fewer than some_payouts, nothing is added for transfer volume."
      open_notices: "Open error notices are the error notices given on the customer's Bank Deposit, Cash Pickup and Mobile Wallet transfers that carry no decision yet, counted in each delivery method as the error notices on record less the error decisions on record"
      notice_days: "when there are many_open_notices or more, many_notices_add business days are added to the counted statement window; when there is exactly one_open_notice, one_notice_add business day is added to the counted statement window; when there is none, nothing is added for open error notices."
      rfis_12m: "Compliance release reads the requests for information issued on the account in the 12 months before the request date, an entry dated on the same calendar day 12 months earlier or before it no longer counting"
      release_days: "when there are many_rfis or more, many_rfis_add business days are added to the counted statement window; when there is exactly one_rfi, one_rfi_add business day is added to the counted statement window; when there is none, nothing is added for compliance release."
      counted_statement_days: "The counted statement window is the standard statement delivery window plus the business days added for the yearly statement allowance, for transfer volume, for open error notices and for compliance release, each worked out as follows and each added once; the statement delivery window is then the counted statement window after the consolidation step."
      methods_with_payouts: "The consolidation step counts the delivery methods, of Bank Deposit, Cash Pickup and Mobile Wallet, that carry at least one payout in the 12 months before the request date"
      consolidated_days: "when all_methods of them carry one, the statement goes to the weekly consolidation run and the statement delivery window is the counted statement window rounded up to the next whole multiple of weekly_run_days business days, a counted statement window that already is such a multiple staying as it is; when exactly two_methods of them carry one, the statement is reconciled across two ledgers and the statement delivery window is the counted statement window plus half of it, that half rounded up to a whole business day; when one or none carries one, the statement delivery window is the counted statement window."
    factors:
      - id: yearly_statement_allowance
        effect: parameter
        decides: allowance_days
        bindings: [statements_12m, statements_with_this, allowance_days]
        ladder:
          - when: "the statements requested in the 12 months before the request date plus this one reach the statements_per_12m of the level held"
            value: "K('last_statement_add')"
          - when: "that count is below statements_per_12m but more than half of it"
            value: "K('busy_allowance_add')"
          - when: "otherwise (half of statements_per_12m or less)"
            value: "0"
        baseline:
          allowance_days: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: statement_transfer_volume
        effect: parameter
        decides: volume_days
        bindings: [payouts_12m, volume_days]
        ladder:
          - when: "many_payouts or more Bank Deposit, Cash Pickup and Mobile Wallet payouts in the 12 months before the request date"
            value: "K('many_payouts_add')"
          - when: "at least some_payouts but fewer than many_payouts such payouts"
            value: "K('some_payouts_add')"
          - when: "otherwise (fewer than some_payouts)"
            value: "0"
        baseline:
          volume_days: "0"
        evidence: [cross_category, history]
        cross_difficulty: bank
      - id: open_error_notices
        effect: parameter
        decides: notice_days
        bindings: [open_notices, notice_days]
        ladder:
          - when: "many_open_notices or more error notices without a decision on the customer's transfers"
            value: "K('many_notices_add')"
          - when: "exactly one_open_notice such notice"
            value: "K('one_notice_add')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          notice_days: "0"
        evidence: [cross_category, history]
        cross_difficulty: bank
      - id: compliance_release
        effect: parameter
        decides: release_days
        bindings: [rfis_12m, release_days]
        ladder:
          - when: "many_rfis or more requests for information issued on the account in the 12 months before the request date"
            value: "K('many_rfis_add')"
          - when: "exactly one_rfi such request"
            value: "K('one_rfi_add')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          release_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: ledger_consolidation
        effect: method
        decides: consolidated_days
        bindings: [methods_with_payouts, consolidated_days]
        ladder:
          - when: "all_methods delivery methods carry a payout in the 12 months before the request date"
            method: "weekly consolidation run: the counted statement window rounded up to the next whole multiple of weekly_run_days business days"
          - when: "exactly two_methods delivery methods carry a payout in those 12 months"
            method: "two-ledger reconciliation: the counted statement window plus half of it, the half rounded up to a whole business day"
          - when: "otherwise (one or none)"
            method: "the statement delivery window is the counted statement window as it stands"
        baseline:
          consolidated_days: "counted_statement_days"
        evidence: [cross_category, history]
        cross_difficulty: wallet
    baseline:
      rule: >-
        The statement delivery window is a whole number of Paloma business days, Monday to Friday excluding
        US Federal Reserve holidays.
        The standard statement delivery window is the statement_delivery_business_days of the level the
        account holds on the request date.
        The delivery due date of a statement is the request date plus the statement delivery window,
        counted forward in Paloma business days from the request date.
      params: [statement_delivery_business_days]
    inputs:
      history:
        - {table: sender_account_events, aggregate: count, field: account_event_id, within_months: 12, filters: {event_type: account_statement_requested}}
        - {table: sender_account_events, aggregate: count, field: account_event_id, within_months: 12, filters: {event_type: account_rfi_issued}}
        - {category: bank, table: bank_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: bank_payout_sent}}
        - {category: cash, table: cash_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: cash_payout_made}}
        - {category: wallet, table: wallet_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: wallet_credit_sent}}
        - {category: bank, table: bank_cases, aggregate: count, field: case_id, filters: {event_type: bank_error_notice_filed}}
        - {category: cash, table: cash_cases, aggregate: count, field: case_id, filters: {event_type: cash_error_notice_filed}}
        - {category: wallet, table: wallet_cases, aggregate: count, field: case_id, filters: {event_type: wallet_error_notice_filed}}
        - {category: bank, table: bank_cases, aggregate: count, field: case_id, filters: {event_type: bank_error_decided}}
        - {category: cash, table: cash_cases, aggregate: count, field: case_id, filters: {event_type: cash_error_decided}}
        - {category: wallet, table: wallet_cases, aggregate: count, field: case_id, filters: {event_type: wallet_error_decided}}
      cross_category: [bank, cash, wallet]

  - id: account_ext_fees_callback_window
    base_policy_refs: [account_evt_service_entitlements]
    overwrite:
      - base_policy: account_evt_service_entitlements
        superseded_clause: >-
          Its callback_due_date is the request date plus the level's callback_sla_business_days Paloma
          business days (Monday to Friday, excluding US Federal Reserve holidays).
        replaced_by: >-
          The due date of a callback on refunds and fees is the request date plus the fees callback window,
          counted forward in Paloma business days from the request date.
    trigger: on_request
    subject: [account_callback_scheduled]
    computes: callback_window_business_days
    target_tool: schedule_fees_callback_4571f432
    params:
      far_statement_days: 14
      near_statement_days: 7
      far_statement_add: 2
      near_statement_add: 1
      many_fee_refunds: 2
      one_fee_refund: 1
      many_refunds_add: 2
      one_refund_add: 1
      high_net_fees_usd: 70.00
      moderate_net_fees_usd: 30.00
      high_fees_add: 2
      moderate_fees_add: 1
      recent_fees_callbacks: 1
      long_period_months: 12
    rule: >-
      A callback on refunds and fees is not booked until the account history carries a statement request
      dated the day the callback is requested.
      The fees callback window is a whole number of Paloma business days, Monday to Friday excluding US
      Federal Reserve holidays.
      The fees callback window governs callbacks on refunds and fees only.
      The standard fees callback window is the callback_sla_business_days of the level the account holds
      on the request date.
      The due date of a callback on refunds and fees is the request date plus the fees callback window,
      counted forward in Paloma business days from the request date.
      The counted fees callback window is the standard fees callback window plus the business days added
      for the wait for the statement, for fee refunds and for fees paid, each worked out as follows and
      each added once; the fees callback window is then the counted fees callback window after the
      preparation step.
      The wait for the statement is the number of calendar days from the callback request date to the
      delivery due date of the account's most recent statement request: when it is far_statement_days
      days or more, far_statement_add business days are added to the counted fees callback window; when it
      is at least near_statement_days but fewer than far_statement_days days, near_statement_add business
      day is added to the counted fees callback window; when it is fewer than near_statement_days days, or
      that delivery due date is on or before the callback request date, nothing is added for the wait for
      the statement.
      Fee refunds are the refunds of fees on the customer's Bank Deposit, Cash Pickup and Mobile Wallet
      transfers dated in the 12 months before the callback request date, an entry dated on the same
      calendar day 12 months earlier or before it no longer counting: when there are many_fee_refunds or
      more, many_refunds_add business days are added to the counted fees callback window; when there is
      exactly one_fee_refund, one_refund_add business day is added to the counted fees callback window;
      when there is none, nothing is added for fee refunds.
      Fees paid are the USD fees collected on those transfers in the same 12 months less the USD fees
      refunded on them in the same 12 months: when they are high_net_fees_usd or more, high_fees_add
      business days are added to the counted fees callback window; when they are at least
      moderate_net_fees_usd but below high_net_fees_usd, moderate_fees_add business day is added to the
      counted fees callback window; when they are below moderate_net_fees_usd, nothing is added for fees
      paid.
      The preparation step reads the account's earlier callbacks on refunds and fees and the period of its
      most recent statement request: when recent_fees_callbacks or more callbacks on refunds and fees were
      requested on the account in the 12 months before the callback request date, an entry dated on
      the same calendar day 12 months earlier or before it no longer counting, the specialist reopens that file
      and the fees callback window is half the counted fees callback window, rounded up to a whole business
      day; when no such callback was requested in those 12 months and the most recent statement request
      covers more than long_period_months whole calendar months from its first day to its last day, the
      specialist prepares the longer period and the fees callback window is the counted fees callback
      window plus half of it, that half rounded up to a whole business day; otherwise the fees callback
      window is the counted fees callback window.
    prerequisite:
      - problem: account_ext_statement_delivery_window
        kind: value_input
        gate: statement_gap_days
        form: state
        policy_source: >-
          A callback on refunds and fees is not booked until the account history carries a statement request
          dated the day the callback is requested.
        condition: >-
          sender_account_events holds, for this sender account, a row of event_type
          account_statement_requested whose event_date is the handling date, so the most recent statement
          request's delivery_due_date lies after the handling date.
        resolved_by: request_account_statement_ee1d8031
        effect: >-
          Once the statement request dated the handling date stands, the most recent statement request's
          delivery due date is the date its delivery window reaches, so the wait for the statement
          (statement_gap_days) becomes that many calendar days ahead, and the preparation step reads that
          request's period.
    cross_category:
      - category: bank
        as: history
        reads: [bank_ledger.event_type, bank_ledger.amount_usd, bank_ledger.entry_date]
        note: Fee refunds count, and fees paid sum, the Bank Deposit fee charges and fee refunds of the last 12 months.
      - category: cash
        as: history
        reads: [cash_ledger.event_type, cash_ledger.amount_usd, cash_ledger.entry_date]
        note: Fee refunds count, and fees paid sum, the Cash Pickup fee charges and fee refunds of the last 12 months.
      - category: wallet
        as: history
        reads: [wallet_ledger.event_type, wallet_ledger.amount_usd, wallet_ledger.entry_date]
        note: Fee refunds count, and fees paid sum, the Mobile Wallet fee charges and fee refunds of the last 12 months.
    compute:
      - standard_fees_callback_days: "P('callback_sla_business_days')"
      - latest_statement_due: "LATEST('sender_account_events', 'delivery_due_date', date_field='event_date', event_type='account_statement_requested')"
      - statement_gap_days: "DAYS(NOW, latest_statement_due)"
      - statement_wait_days: "K('far_statement_add') if statement_gap_days >= K('far_statement_days') else (K('near_statement_add') if statement_gap_days >= K('near_statement_days') else 0)"
      - fee_refunds_12m: "XCOUNT('bank', 'bank_ledger', within_months=12, date_field='entry_date', event_type='bank_fee_refunded') + XCOUNT('cash', 'cash_ledger', within_months=12, date_field='entry_date', event_type='cash_fee_refunded') + XCOUNT('wallet', 'wallet_ledger', within_months=12, date_field='entry_date', event_type='wallet_fee_refunded')"
      - refund_days: "K('many_refunds_add') if fee_refunds_12m >= K('many_fee_refunds') else (K('one_refund_add') if fee_refunds_12m == K('one_fee_refund') else 0)"
      - net_fees_12m: "(XSUM('bank', 'bank_ledger', 'amount_usd', within_months=12, date_field='entry_date', event_type='bank_fee_charged') - XSUM('bank', 'bank_ledger', 'amount_usd', within_months=12, date_field='entry_date', event_type='bank_fee_refunded')) + (XSUM('cash', 'cash_ledger', 'amount_usd', within_months=12, date_field='entry_date', event_type='cash_fee_charged') - XSUM('cash', 'cash_ledger', 'amount_usd', within_months=12, date_field='entry_date', event_type='cash_fee_refunded')) + (XSUM('wallet', 'wallet_ledger', 'amount_usd', within_months=12, date_field='entry_date', event_type='wallet_fee_charged') - XSUM('wallet', 'wallet_ledger', 'amount_usd', within_months=12, date_field='entry_date', event_type='wallet_fee_refunded'))"
      - fees_paid_days: "K('high_fees_add') if net_fees_12m >= K('high_net_fees_usd') else (K('moderate_fees_add') if net_fees_12m >= K('moderate_net_fees_usd') else 0)"
      - counted_fees_callback_days: "standard_fees_callback_days + statement_wait_days + refund_days + fees_paid_days"
      - fees_callbacks_12m: "COUNT('sender_account_events', within_months=12, date_field='event_date', event_type='account_callback_scheduled', callback_topic='refunds_and_fees')"
      - statement_period_start_on: "LATEST('sender_account_events', 'statement_period_start', date_field='event_date', event_type='account_statement_requested')"
      - statement_period_end_on: "LATEST('sender_account_events', 'statement_period_end', date_field='event_date', event_type='account_statement_requested')"
      - statement_period_months: "MONTHS(statement_period_start_on, statement_period_end_on)"
      - prepared_fees_callback_days: "((counted_fees_callback_days + 1) // 2) if fees_callbacks_12m >= K('recent_fees_callbacks') else ((counted_fees_callback_days + (counted_fees_callback_days + 1) // 2) if statement_period_months > K('long_period_months') else counted_fees_callback_days)"
      - result: "prepared_fees_callback_days"
    compute_basis:
      standard_fees_callback_days: "The standard fees callback window is the callback_sla_business_days of the level the account holds on the request date."
      latest_statement_due: "The wait for the statement is the number of calendar days from the callback request date to the delivery due date of the account's most recent statement request"
      statement_gap_days: "The wait for the statement is the number of calendar days from the callback request date to the delivery due date of the account's most recent statement request"
      statement_wait_days: "when it is far_statement_days days or more, far_statement_add business days are added to the counted fees callback window; when it is at least near_statement_days but fewer than far_statement_days days, near_statement_add business day is added to the counted fees callback window; when it is fewer than near_statement_days days, or that delivery due date is on or before the callback request date, nothing is added for the wait for the statement."
      fee_refunds_12m: "Fee refunds are the refunds of fees on the customer's Bank Deposit, Cash Pickup and Mobile Wallet transfers dated in the 12 months before the callback request date, an entry dated on the same calendar day 12 months earlier or before it no longer counting"
      refund_days: "when there are many_fee_refunds or more, many_refunds_add business days are added to the counted fees callback window; when there is exactly one_fee_refund, one_refund_add business day is added to the counted fees callback window; when there is none, nothing is added for fee refunds."
      net_fees_12m: "Fees paid are the USD fees collected on those transfers in the same 12 months less the USD fees refunded on them in the same 12 months"
      fees_paid_days: "when they are high_net_fees_usd or more, high_fees_add business days are added to the counted fees callback window; when they are at least moderate_net_fees_usd but below high_net_fees_usd, moderate_fees_add business day is added to the counted fees callback window; when they are below moderate_net_fees_usd, nothing is added for fees paid."
      counted_fees_callback_days: "The counted fees callback window is the standard fees callback window plus the business days added for the wait for the statement, for fee refunds and for fees paid, each worked out as follows and each added once; the fees callback window is then the counted fees callback window after the preparation step."
      fees_callbacks_12m: "when recent_fees_callbacks or more callbacks on refunds and fees were requested on the account in the 12 months before the callback request date, an entry dated on the same calendar day 12 months earlier or before it no longer counting"
      statement_period_start_on: "the most recent statement request covers more than long_period_months whole calendar months from its first day to its last day"
      statement_period_end_on: "the most recent statement request covers more than long_period_months whole calendar months from its first day to its last day"
      statement_period_months: "the most recent statement request covers more than long_period_months whole calendar months from its first day to its last day"
      prepared_fees_callback_days: "when recent_fees_callbacks or more callbacks on refunds and fees were requested on the account in the 12 months before the callback request date, an entry dated on the same calendar day 12 months earlier or before it no longer counting, the specialist reopens that file and the fees callback window is half the counted fees callback window, rounded up to a whole business day; when no such callback was requested in those 12 months and the most recent statement request covers more than long_period_months whole calendar months from its first day to its last day, the specialist prepares the longer period and the fees callback window is the counted fees callback window plus half of it, that half rounded up to a whole business day; otherwise the fees callback window is the counted fees callback window."
    factors:
      - id: statement_wait
        effect: parameter
        decides: statement_wait_days
        bindings: [latest_statement_due, statement_gap_days, statement_wait_days]
        ladder:
          - when: "the most recent statement request's delivery due date lies far_statement_days or more calendar days after the callback request date"
            value: "K('far_statement_add')"
          - when: "it lies at least near_statement_days but fewer than far_statement_days calendar days after"
            value: "K('near_statement_add')"
          - when: "otherwise (fewer than near_statement_days days after, or on or before the callback request date)"
            value: "0"
        baseline:
          statement_wait_days: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: fee_refunds
        effect: parameter
        decides: refund_days
        bindings: [fee_refunds_12m, refund_days]
        ladder:
          - when: "many_fee_refunds or more fee refunds on the customer's transfers in the 12 months before the callback request date"
            value: "K('many_refunds_add')"
          - when: "exactly one_fee_refund fee refund in those 12 months"
            value: "K('one_refund_add')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          refund_days: "0"
        evidence: [cross_category, history]
        cross_difficulty: cash
      - id: fees_paid
        effect: parameter
        decides: fees_paid_days
        bindings: [net_fees_12m, fees_paid_days]
        ladder:
          - when: "fees collected less fees refunded on the customer's transfers in those 12 months come to high_net_fees_usd or more"
            value: "K('high_fees_add')"
          - when: "they come to at least moderate_net_fees_usd but below high_net_fees_usd"
            value: "K('moderate_fees_add')"
          - when: "otherwise (below moderate_net_fees_usd)"
            value: "0"
        baseline:
          fees_paid_days: "0"
        evidence: [cross_category, history]
        cross_difficulty: bank
      - id: specialist_preparation
        effect: method
        decides: prepared_fees_callback_days
        bindings: [fees_callbacks_12m, statement_period_start_on, statement_period_end_on, statement_period_months, prepared_fees_callback_days]
        ladder:
          - when: "recent_fees_callbacks or more callbacks on refunds and fees requested in the 12 months before the callback request date"
            method: "the specialist reopens that file: half the counted fees callback window, rounded up to a whole business day"
          - when: "no such callback in those 12 months and the most recent statement request covers more than long_period_months whole months"
            method: "the specialist prepares the longer period: the counted fees callback window plus half of it, the half rounded up to a whole business day"
          - when: "otherwise"
            method: "the fees callback window is the counted fees callback window as it stands"
        baseline:
          prepared_fees_callback_days: "counted_fees_callback_days"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The fees callback window is a whole number of Paloma business days, Monday to Friday excluding US
        Federal Reserve holidays.
        The standard fees callback window is the callback_sla_business_days of the level the account holds
        on the request date.
        The due date of a callback on refunds and fees is the request date plus the fees callback window,
        counted forward in Paloma business days from the request date.
      params: [callback_sla_business_days]
    inputs:
      history:
        - {table: sender_account_events, aggregate: latest, field: delivery_due_date, filters: {event_type: account_statement_requested}}
        - {table: sender_account_events, aggregate: count, field: account_event_id, within_months: 12, filters: {event_type: account_callback_scheduled, callback_topic: refunds_and_fees}}
        - {table: sender_account_events, aggregate: latest, field: statement_period_start, filters: {event_type: account_statement_requested}}
        - {category: bank, table: bank_ledger, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: bank_fee_charged}}
        - {category: cash, table: cash_ledger, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: cash_fee_charged}}
        - {category: wallet, table: wallet_ledger, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: wallet_fee_charged}}
        - {category: cash, table: cash_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: cash_fee_refunded}}
        - {category: bank, table: bank_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: bank_fee_refunded}}
        - {category: wallet, table: wallet_ledger, aggregate: count, field: ledger_entry_id, within_months: 12, filters: {event_type: wallet_fee_refunded}}
        - {category: bank, table: bank_ledger, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: bank_fee_refunded}}
        - {category: cash, table: cash_ledger, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: cash_fee_refunded}}
        - {category: wallet, table: wallet_ledger, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: wallet_fee_refunded}}
        - {table: sender_account_events, aggregate: latest, field: statement_period_end, filters: {event_type: account_statement_requested}}
      cross_category: [bank, cash, wallet]
