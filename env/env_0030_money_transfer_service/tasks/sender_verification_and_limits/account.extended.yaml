events:
  # ---- holding writes (sender_accounts) ----
  - type: account_opened
    target: sender_accounts
    mutation: create
    meaning: "A customer submits a Personal Sender Account application and the account record is created awaiting identity checks."
    grain: "One row per account application."
    fields:
      customer_id: "The applying customer."
      variant_name: "Opening level: Paloma Starter, or Paloma Verified when ID and selfie were captured at sign-up."
      opened_date: "Date the application was submitted."
      signup_channel: "Channel the application came through."
    triggers: []
  - type: account_activated
    target: sender_accounts
    mutation: {transition: {from: pending_verification, to: active}}
    meaning: "Identity checks for the opening level pass and the account can send money."
    grain: "One row per account activation."
    fields:
      level_effective_date: "Date the opening level took effect (the activation date)."
      next_review_due_date: "First periodic KYC review due date for the level, empty when the level has no periodic review."
    triggers: []
  - type: account_application_closed
    target: sender_accounts
    mutation: {transition: {from: pending_verification, to: closed}}
    meaning: "An application that never activated is closed by Paloma."
    grain: "One row per abandoned or failed application."
    fields:
      closed_date: "Date the application was closed."
      closure_reason: "verification_failed."
    triggers: []
  - type: account_locked
    target: sender_accounts
    mutation: {transition: {from: active, to: locked}}
    meaning: "Paloma security locks sign-in and sending on the account."
    grain: "One row per security lock."
    fields:
      lock_reason: "Why the lock was placed."
      locked_at: "Moment the lock was placed."
    triggers: []
  - type: account_unlocked
    target: sender_accounts
    mutation: {transition: {from: locked, to: active}}
    meaning: "A support agent releases a security lock after the caller passes identity verification."
    grain: "One row per agent unlock."
    fields:
      lock_reason: "Reset to none on release."
      locked_at: "Cleared on release."
    triggers: []
  - type: account_restricted
    target: sender_accounts
    mutation: {transition: {from: active, to: restricted}}
    meaning: "Sending is paused while a request for information, a KYC refresh or a lapsed document is outstanding."
    grain: "One row per restriction."
    fields:
      restriction_reason: "Why sending is paused."
    triggers: []
  - type: account_restriction_lifted
    target: sender_accounts
    mutation: {transition: {from: restricted, to: active}}
    meaning: "Compliance accepts the response and sending resumes."
    grain: "One row per lifted restriction."
    fields:
      restriction_reason: "Reset to none."
      next_review_due_date: "Next periodic review due date, recalculated when the restriction was a KYC refresh."
    triggers: []
  - type: account_suspended
    target: sender_accounts
    mutation: {transition: [{from: active, to: suspended}, {from: restricted, to: suspended}]}
    meaning: "Paloma suspends the account after an unanswered or failed request for information, or by a fraud or compliance decision."
    grain: "One row per suspension."
    fields:
      suspended_date: "Date the suspension took effect."
    triggers: []
  - type: account_reinstated
    target: sender_accounts
    mutation: {transition: {from: suspended, to: active}}
    meaning: "An upheld appeal or a compliance re-review returns the account to active."
    grain: "One row per reinstatement."
    fields:
      suspended_date: "Cleared on reinstatement."
      restriction_reason: "Reset to none."
    triggers: []
  - type: account_terminated
    target: sender_accounts
    mutation: {transition: {from: suspended, to: closed}}
    meaning: "Paloma ends the relationship after a final compliance or fraud decision."
    grain: "One row per termination."
    fields:
      closed_date: "Date of termination."
      closure_reason: "compliance_termination."
    triggers: []
  - type: account_closed_by_customer
    target: sender_accounts
    mutation: {transition: {from: active, to: closed}}
    meaning: "The customer confirms closure of their own Personal Sender Account."
    grain: "One row per customer-confirmed closure."
    fields:
      closed_date: "Date the customer confirmed closure."
      closure_reason: "customer_request."
    triggers: []
  - type: account_level_upgraded
    target: sender_accounts
    mutation: update
    meaning: "The account moves up to a higher verification level and the new limits take effect."
    grain: "One row per level increase."
    fields:
      variant_name: "The new, higher official level name."
      level_effective_date: "Date the new level took effect."
      next_review_due_date: "Periodic review due date under the new level, empty when the level has none."
    triggers: []
  - type: account_level_downgraded
    target: sender_accounts
    mutation: update
    meaning: "A required document lapses beyond its grace period and the account moves down a level."
    grain: "One row per level decrease."
    fields:
      variant_name: "The lower official level name."
      level_effective_date: "Date the lower level took effect."
      next_review_due_date: "Periodic review due date under the lower level, empty when the level has none."
    triggers: []
  # ---- ledger writes (sender_account_events) ----
  - type: account_limit_review_requested
    target: sender_account_events
    meaning: "The customer asks compliance to review the account for the next, review-gated verification level."
    grain: "One row per limit review request."
    distinguish_by: [requested_level, event_date]
    fields:
      requested_level: "The official level name requested."
      event_date: "Date the request was lodged."
      decision_due_date: "Date by which compliance must decide, counted in business days from event_date."
      channel: "Channel the request came through."
    triggers: []
  - type: account_limit_review_decided
    target: sender_account_events
    meaning: "Compliance records its decision on a limit review request."
    grain: "One row per decision; points back to exactly one request."
    distinguish_by: [related_event_id]
    fields:
      related_event_id: "The account_event_id of the limit review request decided."
      requested_level: "The level that was requested, copied from the request."
      review_outcome: "approved, declined or more_information_needed."
      event_date: "Date of the decision."
    triggers:
      - event: account:account_level_upgraded
        when: {review_outcome: approved}
        map: {variant_name: requested_level, level_effective_date: event_date}
  - type: account_rfi_issued
    target: sender_account_events
    meaning: "Compliance issues a request for information to the customer."
    grain: "One row per request for information."
    distinguish_by: [rfi_topic, event_date]
    fields:
      rfi_topic: "What the request asks about."
      event_date: "Date the request was issued."
      rfi_due_date: "Last calendar day on which an answer is accepted."
    triggers:
      - event: account:account_restricted
        when: {rfi_topic: source_of_funds}
        map: {restriction_reason: rfi_source_of_funds}
      - event: account:account_restricted
        when: {rfi_topic: identity}
        map: {restriction_reason: rfi_identity}
      - event: account:account_restricted
        when: {rfi_topic: transfer_activity}
        map: {restriction_reason: rfi_transfer_activity}
      - event: account:account_restricted
        when: {rfi_topic: kyc_refresh}
        map: {restriction_reason: kyc_refresh}
  - type: account_recipient_added
    target: sender_account_events
    meaning: "A new recipient is saved to the customer's account."
    grain: "One row per recipient added."
    distinguish_by: [recipient_id]
    fields:
      recipient_id: "The recipient saved."
      corridor: "The recipient's corridor."
      event_date: "Date the recipient was added."
    triggers: []
  - type: account_callback_scheduled
    target: sender_account_events
    meaning: "Support schedules a callback to the customer on a stated topic."
    grain: "One row per scheduled callback."
    distinguish_by: [event_date, callback_topic]
    fields:
      event_date: "Date the callback was requested."
      callback_topic: "Topic of the callback."
      callback_due_date: "Last business day by which the callback must take place."
    triggers: []
  - type: account_statement_requested
    target: sender_account_events
    meaning: "The customer requests an account statement of their transfer history for a period."
    grain: "One row per statement request."
    distinguish_by: [statement_period_start, statement_period_end, event_date]
    fields:
      event_date: "Date of the request."
      statement_period_start: "First day of the period covered."
      statement_period_end: "Last day of the period covered."
      delivery_due_date: "Business day by which the statement is emailed."
    triggers: []
  - type: account_appeal_lodged
    target: sender_account_events
    meaning: "The customer appeals a suspension of their account."
    grain: "One row per appeal."
    distinguish_by: [event_date]
    fields:
      event_date: "Date the appeal was lodged."
      channel: "Channel the appeal came through."
    triggers: []
  # ---- ledger writes (sender_documents) ----
  - type: account_document_received
    target: sender_documents
    meaning: "A verification document the customer submitted is logged against the account."
    grain: "One row per submitted document, identified by its upload reference."
    distinguish_by: [doc_reference]
    fields:
      doc_type: "Kind of document."
      doc_reference: "Upload reference shown to the customer in the app."
      submitted_for_level: "Official level name the document supports (the requested level for an upgrade or review, otherwise the current level)."
      issue_date: "Date printed on the document (statement or bill date, ID issue date)."
      expiry_date: "Expiry printed on the document; empty when it carries none."
      received_date: "Date Paloma received it."
      review_status: "pending_review on receipt."
    triggers: []
  - type: account_document_reviewed
    target: sender_documents
    meaning: "Compliance records the review outcome of one received document."
    grain: "One row per review; points back to exactly one received document."
    distinguish_by: [related_document_id]
    fields:
      related_document_id: "document_id of the received document reviewed."
      doc_type: "Kind of document, copied from the received row."
      review_status: "accepted or rejected."
      rejection_reason: "Why it was rejected; none when accepted."
      reviewed_date: "Date of the review."
    triggers: []

measures:
  - id: account_msr_send_24h
    window: "Rolling 24 hours ending at the handling moment (frozen_time): booked_at strictly later than frozen_time minus 24 hours."
    measure: "Sum of send_amount_usd over the customer's personal transfers in bank_transfers, cash_transfers and wallet_transfers carrying this sender_account_id, excluding transfers whose status is cancelled or refunded."
  - id: account_msr_send_30d
    window: "Rolling 30 calendar days: booked_at on the handling date or any of the 29 calendar days before it."
    measure: "Sum of send_amount_usd over the same personal transfers, excluding status cancelled or refunded."
  - id: account_msr_send_180d
    window: "Rolling 180 calendar days: booked_at on the handling date or any of the 179 calendar days before it."
    measure: "Sum of send_amount_usd over the same personal transfers, excluding status cancelled or refunded."
  - id: account_msr_transfers_24h
    window: "Rolling 24 hours ending at frozen_time, as for account_msr_send_24h."
    measure: "Count of the same personal transfers, excluding status cancelled or refunded."
  - id: account_msr_corridors_30d
    window: "Rolling 30 calendar days, as for account_msr_send_30d."
    measure: "Number of distinct corridor values among the same personal transfers, excluding status cancelled or refunded."
  - id: account_msr_completed_transfers
    window: "All time up to frozen_time."
    measure: "Count of personal transfers on this sender_account_id whose status is deposited (bank_transfers), paid_out (cash_transfers) or credited (wallet_transfers)."
  - id: account_msr_limit_reviews_180d
    window: "Rolling 180 calendar days ending on the handling date (event_date on the handling date or the 179 days before it)."
    measure: "Count of account_limit_review_requested rows on this sender_account_id."
  - id: account_msr_new_recipients_30d
    window: "Rolling 30 calendar days ending on the handling date."
    measure: "Count of account_recipient_added rows on this sender_account_id."
  - id: account_msr_rfi_rejections
    window: "From the event_date of the most recent account_rfi_issued row up to frozen_time."
    measure: "Count of account_document_reviewed rows with review_status rejected and reviewed_date on or after that event_date."
  - id: account_msr_ach_early_release_30d
    window: "Rolling 30 calendar days: booked_at on the handling date or any of the 29 calendar days before it."
    measure: "Sum of send_amount_usd over the customer's personal transfers funded by ach_debit (funding_method ach_debit in bank_transfers, cash_transfers and wallet_transfers on this sender_account_id) that were released to the payout partner before their ACH debit settled, excluding status cancelled or refunded."
  - id: account_msr_statements_12m
    window: "Rolling 12 calendar months: event_date on or after the same calendar day 12 months before the handling date (falling back to the month's last day when that day does not exist)."
    measure: "Count of account_statement_requested rows on this sender_account_id."

policies:
  - id: account_agg_multi_holding
    subject: [account_opened]
    rule: >-
      Each customer may hold at most one Personal Sender Account, counted by customer profile
      (customer_id), never by name or phone number. An application may be opened only when the
      customer holds no other Personal Sender Account whose status is anything other than closed.
      A customer whose earlier account was closed with closure_reason compliance_termination may
      not open a new account. An account closed at the customer's request (customer_request) or
      an application closed without activation (verification_failed) does not block a new
      application. A Paloma Business account is a separate contract and never counts toward this
      cap: business sending runs on the business account and personal sending on this one.
    eligibility:
      - id: no_other_open_account
        applies_to: [account_opened]
        kind: dedup
        condition: "An application may be opened only when the customer holds no other Personal Sender Account whose status is anything other than closed."
        evidence_fields: [sender_accounts.customer_id, sender_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.customer_id]
          action_bindings:
            sender_accounts.customer_id: customer_id
        dedup_contract:
          table: sender_accounts
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_verification, active, locked, restricted, suspended]}
          distinct_fields: []
      - id: not_previously_terminated
        applies_to: [account_opened]
        kind: authorization
        condition: "A customer whose earlier account was closed with closure_reason compliance_termination may not open a new account."
        evidence_fields: [sender_accounts.customer_id, sender_accounts.closure_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.customer_id]
          action_bindings:
            sender_accounts.customer_id: customer_id
    params:
      max_per_customer: 1

  - id: account_evt_opening
    subject: [account_opened, account_activated, account_application_closed]
    rule: >-
      An application is accepted only when the applicant is at least min_age_years years old on the
      application date, counted from customers.date_of_birth, and customers.state_of_residence is a
      US state or the District of Columbia. A new account opens in status pending_verification at
      one of the opening_levels: Paloma Starter, or Paloma Verified when a government ID and a
      selfie were captured at sign-up; no other level can be opened directly. The account activates
      when the identity checks of its opening level pass, and level_effective_date is the
      activation date. Activation sets next_review_due_date to the activation date plus the level's
      periodic_review_interval_months calendar months (same day of month, falling back to the last
      day of a shorter month), or leaves it empty when that interval is 0. Paloma closes an
      application only after application_expiry_days calendar days have passed since the
      application was submitted without activation. Days are counted as calendar days from
      opened_date, so the application can be closed from opened_date plus application_expiry_days
      onward. A closed application carries closure_reason verification_failed and the customer may
      apply again.
    eligibility:
      - id: adult_us_resident
        applies_to: [account_opened]
        kind: authorization
        condition: "An application is accepted only when the applicant is at least min_age_years years old on the application date, counted from customers.date_of_birth, and customers.state_of_residence is a US state or the District of Columbia."
        evidence_fields: [customers.customer_id, customers.date_of_birth, customers.state_of_residence]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
      - id: application_expiry
        applies_to: [account_application_closed]
        kind: time
        condition: "Paloma closes an application only after application_expiry_days calendar days have passed since the application was submitted without activation."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the application was submitted"
          anchor_source: sender_accounts.opened_date
          relation: not_before
          duration_source: params.application_expiry_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from opened_date, so the application can be closed from opened_date plus application_expiry_days onward."
          boundary: inclusive
    params:
      min_age_years: 18
      application_expiry_days: 30
      opening_levels: [Paloma Starter, Paloma Verified]
      per_tier:
        Paloma Starter: {periodic_review_interval_months: "=periodic_review_interval_months"}
        Paloma Verified: {periodic_review_interval_months: "=periodic_review_interval_months"}
        Paloma Verified Plus: {periodic_review_interval_months: "=periodic_review_interval_months"}
        Paloma Enhanced: {periodic_review_interval_months: "=periodic_review_interval_months"}
        Paloma Premier: {periodic_review_interval_months: "=periodic_review_interval_months"}
        Paloma Private Client: {periodic_review_interval_months: "=periodic_review_interval_months"}

  - id: account_sending_limits
    subject: [account_level_upgraded, account_level_downgraded, account_limit_review_requested]
    rule: >-
      The sending limits of the level in force at the moment of booking apply to every personal
      transfer the customer books, whatever the delivery method (Bank Deposit, Cash Pickup, Mobile
      Wallet); the booking policies bank_agg_sending_limits, cash_agg_sending_limits and
      wallet_agg_sending_limits apply them to each booking. A personal transfer is within limits
      only when all six hold: (1) its principal does not exceed per_transfer_limit_usd; (2) its
      principal plus account_msr_send_24h does not exceed limit_24h_usd; (3) its principal plus
      account_msr_send_30d does not exceed limit_30d_usd; (4) its principal plus
      account_msr_send_180d does not exceed limit_180d_usd; (5) account_msr_transfers_24h is below
      max_transfers_24h; (6) the transfer's corridor is already among the corridors counted by
      account_msr_corridors_30d, or that count is below max_corridors_30d. Limits count principal
      only (send_amount_usd); transfer fees, card surcharges and exchange-rate margins are never
      counted. Transfers whose status is cancelled or refunded drop out of every window; a returned,
      expired or failed transfer still counts until it is refunded. Equality with a ceiling is
      within limits. A booking that would exceed any ceiling is not made: the customer may lower
      the amount, wait until earlier transfers leave the window, or reach a higher level through
      account_evt_level_upgrade or account_evt_limit_review. Splitting one payment into several
      transfers, or across other people's accounts, to stay under a ceiling is structuring and is
      never assisted. A level change takes effect at once: transfers booked after
      level_effective_date are measured against the new ceilings, and transfers already booked are
      never re-checked. Sending through a Paloma Business account is never counted here.
    eligibility: []
    params:
      per_tier:
        Paloma Starter: {per_transfer_limit_usd: "=per_transfer_limit_usd", limit_24h_usd: "=limit_24h_usd", limit_30d_usd: "=limit_30d_usd", limit_180d_usd: "=limit_180d_usd", max_transfers_24h: "=max_transfers_24h", max_corridors_30d: "=max_corridors_30d"}
        Paloma Verified: {per_transfer_limit_usd: "=per_transfer_limit_usd", limit_24h_usd: "=limit_24h_usd", limit_30d_usd: "=limit_30d_usd", limit_180d_usd: "=limit_180d_usd", max_transfers_24h: "=max_transfers_24h", max_corridors_30d: "=max_corridors_30d"}
        Paloma Verified Plus: {per_transfer_limit_usd: "=per_transfer_limit_usd", limit_24h_usd: "=limit_24h_usd", limit_30d_usd: "=limit_30d_usd", limit_180d_usd: "=limit_180d_usd", max_transfers_24h: "=max_transfers_24h", max_corridors_30d: "=max_corridors_30d"}
        Paloma Enhanced: {per_transfer_limit_usd: "=per_transfer_limit_usd", limit_24h_usd: "=limit_24h_usd", limit_30d_usd: "=limit_30d_usd", limit_180d_usd: "=limit_180d_usd", max_transfers_24h: "=max_transfers_24h", max_corridors_30d: "=max_corridors_30d"}
        Paloma Premier: {per_transfer_limit_usd: "=per_transfer_limit_usd", limit_24h_usd: "=limit_24h_usd", limit_30d_usd: "=limit_30d_usd", limit_180d_usd: "=limit_180d_usd", max_transfers_24h: "=max_transfers_24h", max_corridors_30d: "=max_corridors_30d"}
        Paloma Private Client: {per_transfer_limit_usd: "=per_transfer_limit_usd", limit_24h_usd: "=limit_24h_usd", limit_30d_usd: "=limit_30d_usd", limit_180d_usd: "=limit_180d_usd", max_transfers_24h: "=max_transfers_24h", max_corridors_30d: "=max_corridors_30d"}
    measures: [account_msr_send_24h, account_msr_send_30d, account_msr_send_180d, account_msr_transfers_24h, account_msr_corridors_30d]

  - id: account_evt_level_upgrade
    subject: [account_level_upgraded]
    rule: >-
      An upgrade moves the account up to a higher level and is applied only while the account status
      is active. An agent applies an upgrade at the customer's request when the target level's
      review_required_for_entry is false and every entry requirement of the target level is met in
      the records. When the target level's review_required_for_entry is true, the upgrade is applied
      only by an approved limit review decision for exactly that level and never directly by an
      agent. Every document the target level requires has a latest review of accepted and is
      unexpired on the upgrade date; doc_bank_statement_months means that many accepted
      bank_statement documents. The upgrade may be applied only once entry_min_account_age_days
      calendar days have passed since the account was opened. Account age is counted in calendar
      days from opened_date, so the earliest qualifying date is opened_date plus
      entry_min_account_age_days. The account's completed personal transfers
      (account_msr_completed_transfers) must be at least the target level's
      entry_min_completed_transfers. When several levels qualify, the agent applies the highest
      qualifying level whose review_required_for_entry is false; a level that requires review is
      never passed over. The new limits, funding methods and entitlements take effect on
      level_effective_date, which is the upgrade date, and next_review_due_date is reset to the
      upgrade date plus the new level's periodic_review_interval_months calendar months (empty when
      0). An upgrade never refunds, re-prices or re-releases transfers already booked.
    eligibility:
      - id: account_active
        applies_to: [account_level_upgraded]
        kind: state
        condition: "An upgrade moves the account up to a higher level and is applied only while the account status is active."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
        state_contract:
          field: sender_accounts.status
          allowed: [active]
      - id: review_route
        applies_to: [account_level_upgraded]
        kind: authorization
        condition: "When the target level's review_required_for_entry is true, the upgrade is applied only by an approved limit review decision for exactly that level and never directly by an agent."
        evidence_fields: [sender_account_events.sender_account_id, sender_account_events.requested_level, sender_account_events.review_outcome]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_account_events.sender_account_id]
          action_bindings:
            sender_account_events.sender_account_id: sender_account_id
      - id: documents_accepted
        applies_to: [account_level_upgraded]
        kind: authorization
        condition: "Every document the target level requires has a latest review of accepted and is unexpired on the upgrade date"
        evidence_fields: [sender_documents.sender_account_id, sender_documents.doc_type, sender_documents.review_status, sender_documents.expiry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_documents.sender_account_id]
          action_bindings:
            sender_documents.sender_account_id: sender_account_id
      - id: account_age
        applies_to: [account_level_upgraded]
        kind: time
        condition: "The upgrade may be applied only once entry_min_account_age_days calendar days have passed since the account was opened."
        evidence_fields: [sender_accounts.sender_account_id, sender_accounts.opened_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [sender_accounts.sender_account_id]
          action_bindings:
            sender_accounts.sender_account_id: sender_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the account was opened"
          anchor_source: sender_accounts.opened_date
          relation: not_before
          duration_source: variants.entry_min_account_age_days
          unit: calendar_days
          counting_rule: "Account age is counted in calendar days from opened_date, so the earliest qualifying date is opened_date plus entry_min_account_age_days."
          boundary: inclusive
      - id: completed_transfers
        applies_to: [account_level_upgraded]
        kind: authorization
        condition: "The account's completed personal transfers (account_msr_completed_transfers) must be at least the target level's entry_min_completed_transfers."
        evidence_fields: [bank_transfers.sender_account_id, bank_transfers.status, cash_transfers.sender_account_id, cash_transfers.status, wallet_transfers.sender_account_id, wallet_transfers.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [bank_transfers.sender_account_id, cash_transfers.sender_account_id, wallet_transfers.sender_account_id]
          action_bindings:
            bank_transfers.sender_account_id: sender_account_id
            cash_transfers.sender_account_id: sender_account_id
            wallet_transfers.sender_account_id: sender_account_id
    params:
      per_tier:
        Paloma Starter: {review_required_for_entry: "=review_required_for_entry", entry_min_account_age_days: "=entry_min_account_age_days", entry_min_completed_transfers: "=entry_min_completed_transfers", doc_government_id_required: "=doc_government_id_required", doc_selfie_required: "=doc_selfie_required", doc_ssn_itin_required: "=doc_ssn_itin_required", doc_proof_of_address_required: "=doc_proof_of_address_required", doc_occupation_employer_required: "=doc_occupation_employer_required", doc_source_of_funds_required: "=doc_source_of_funds_required", doc_bank_statement_months: "=doc_bank_statement_months", edd_questionnaire_required: "=edd_questionnaire_required", periodic_review_interval_months: "=periodic_review_interval_months"}
