# Paloma Remit — product charter: Personal Sender Account (verification levels and sending limits).
# Every Paloma customer who sends money for personal purposes holds exactly one Personal Sender
# Account. Its tier is the verification level the customer has reached; the level fixes the sending
# limits that apply across every personal transfer (Bank Deposit, Cash Pickup, Mobile Wallet), the
# funding methods the customer may use, the documents that must be on file, and the service
# entitlements. Raising limits means reaching a higher verification level.

category: account
display_name: Personal Sender Account

binding:
  holding_table: sender_accounts
  event_tables: [sender_account_events, sender_documents]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [pending_verification, active, locked, restricted, suspended, closed]
  transitions:
    - {from: pending_verification, to: active, by: system, means: "The identity checks required for the opening level pass and the account can send money."}
    - {from: pending_verification, to: closed, by: system, means: "The application is abandoned or fails identity checks and Paloma closes it without activation."}
    - {from: active, to: locked, by: system, means: "Paloma security locks sign-in and sending after repeated failed sign-ins, password-reset abuse, a new-device review or a suspected account takeover."}
    - {from: locked, to: active, by: agent, means: "A support agent releases a lock whose reason permits agent release after the caller passes identity verification."}
    - {from: active, to: restricted, by: system, means: "Compliance opens a request for information (RFI) or a document lapses, and sending is paused until it is answered."}
    - {from: restricted, to: active, by: system, means: "Compliance accepts the response to the open request for information and lifts the restriction."}
    - {from: restricted, to: suspended, by: system, means: "The request for information goes unanswered past its window or too many submissions are rejected, and the account is suspended."}
    - {from: active, to: suspended, by: system, means: "Paloma Fraud or Compliance suspends the account by its own decision."}
    - {from: suspended, to: active, by: system, means: "An appeal or a compliance re-review reinstates the account."}
    - {from: suspended, to: closed, by: system, means: "Paloma terminates the relationship after a final compliance or fraud decision."}
    - {from: active, to: closed, by: user, means: "The customer confirms closure of their own account."}

# The sending limits are not a balance Paloma holds: they are ceilings measured against the
# customer's own personal transfers (booked in the bank, cash and wallet categories). The rolling
# volume is a derived measure over those transfers, so this category books no account-style quantity.
accounts: []

parameter_schema:
  level_number: "Verification level number shown to the customer in the app (integer 1-6)."
  per_transfer_limit_usd: "Largest principal (USD, 2 decimals) a single personal transfer may carry at this level, all delivery methods."
  limit_24h_usd: "Ceiling (USD) on the sum of personal transfer principal booked in any rolling 24-hour period."
  limit_30d_usd: "Ceiling (USD) on the sum of personal transfer principal booked in any rolling 30-calendar-day period."
  limit_180d_usd: "Ceiling (USD) on the sum of personal transfer principal booked in any rolling 180-calendar-day period."
  max_transfers_24h: "Largest number of personal transfers that may be booked in any rolling 24-hour period (count)."
  max_corridors_30d: "Largest number of distinct destination corridors the customer may send to in a rolling 30-calendar-day period (count)."
  max_active_recipients: "Largest number of active saved recipients the account may hold (count)."
  max_new_recipients_30d: "Largest number of recipients that may be added in a rolling 30-calendar-day period (count)."
  new_recipient_cooling_off_hours: "Hours after a recipient is added during which a first transfer to that recipient is held for screening before release (0 = none)."
  doc_government_id_required: "Whether an accepted, unexpired government photo ID must be on file to hold this level (boolean)."
  doc_selfie_required: "Whether an accepted selfie liveness check must be on file to hold this level (boolean)."
  doc_ssn_itin_required: "Whether an accepted SSN or ITIN record must be on file to hold this level (boolean)."
  doc_proof_of_address_required: "Whether an accepted proof of US address must be on file to hold this level (boolean)."
  doc_occupation_employer_required: "Whether an accepted occupation-and-employer declaration must be on file to hold this level (boolean)."
  doc_source_of_funds_required: "Whether an accepted source-of-funds document must be on file to hold this level (boolean)."
  doc_bank_statement_months: "Number of consecutive monthly bank statements that must be accepted on file to hold this level (count; 0 = not required)."
  edd_questionnaire_required: "Whether an accepted enhanced-due-diligence questionnaire must be on file to hold this level (boolean)."
  entry_min_account_age_days: "Minimum calendar days since the account opened_date before the account may move up to this level (days)."
  entry_min_completed_transfers: "Minimum number of completed personal transfers before the account may move up to this level (count)."
  review_required_for_entry: "Whether moving up to this level requires a compliance limit review approval rather than an agent-applied upgrade (boolean)."
  limit_review_sla_business_days: "Business days compliance takes to decide a limit review whose requested level is this level (business days; 0 = no review)."
  proof_of_address_max_age_days: "Largest age in calendar days, counted from the document's issue_date to its received_date, of an acceptable proof of address (days)."
  id_min_remaining_validity_days: "Fewest calendar days a government ID must still have before its expiry_date, counted from its received_date, to be accepted (days)."
  source_of_funds_max_age_days: "Largest age in calendar days, from issue_date to received_date, of an acceptable source-of-funds document (days; 0 = not applicable)."
  bank_statement_max_age_days: "Largest age in calendar days, from the most recent statement's issue_date to its received_date, of an acceptable bank statement set (days; 0 = not applicable)."
  rfi_response_window_days: "Calendar days after a request for information is issued within which the customer must answer before suspension (days)."
  rfi_reminder_interval_days: "Calendar days between automatic reminders while a request for information is open (days)."
  rfi_max_rejected_submissions: "Number of rejected document submissions against one open request for information that triggers suspension (count)."
  periodic_review_interval_months: "Calendar months between mandatory KYC refresh reviews at this level (months; 0 = no periodic review)."
  kyc_refresh_grace_days: "Calendar days after a periodic review falls due before the account is restricted for the refresh (days)."
  expired_document_grace_days: "Calendar days after a required document's expiry_date before the account is moved down a level (days)."
  downgrade_target_level: "Official level name the account moves down to when a required document lapses beyond the grace period."
  failed_signin_lock_threshold: "Consecutive failed sign-ins that trigger a security lock (count)."
  lock_auto_release_minutes: "Minutes after which a failed-sign-in lock releases itself without contact (minutes; 0 = never self-releases)."
  agent_unlock_reasons: "Lock reasons a support agent may release after identity verification (list of lock_reason values)."
  unlock_requires_id_document: "Whether an agent unlock additionally needs an accepted, unexpired government ID on file (boolean)."
  limit_review_cooldown_days: "Calendar days after a declined limit review before another review may be requested (days)."
  limit_review_max_per_180d: "Largest number of limit reviews that may be requested in a rolling 180-calendar-day period (count)."
  debit_card_funding_allowed: "Whether personal transfers may be funded by debit card at this level (boolean)."
  credit_card_funding_allowed: "Whether personal transfers may be funded by credit card at this level (boolean)."
  ach_funding_allowed: "Whether personal transfers may be funded by ACH bank debit at this level (boolean)."
  pay_by_bank_allowed: "Whether personal transfers may be funded by instant pay-by-bank (RTP/FedNow) at this level (boolean)."
  wire_funding_allowed: "Whether personal transfers may be funded by an inbound domestic wire at this level (boolean)."
  ach_early_release_usd: "ACH-funded principal (USD) Paloma releases to the payout partner before the debit settles, per rolling 30 days (USD)."
  ach_settlement_hold_business_days: "Business days ACH-funded principal above the early-release allowance waits for settlement before release (business days)."
  dedicated_support_line: "Whether the customer is served on the priority support line (boolean)."
  relationship_manager_assigned: "Whether a named relationship manager is assigned to the account (boolean)."
  callback_sla_business_days: "Business days within which a requested support callback must take place, counted from the request date (business days)."
  statement_history_months: "Calendar months of transaction history a customer may request on an account statement (months)."
  statements_per_12m: "Largest number of account statements that may be requested in any rolling 12-month period; further requests wait until the window frees (count)."
  statement_delivery_business_days: "Business days after the request date by which the requested statement is delivered to the customer's email (business days)."
  closure_with_open_transfers_allowed: "Whether the customer may close the account while any personal transfer is still open (boolean)."
  suspension_appeal_window_days: "Calendar days after a suspension within which the customer may appeal (days)."

