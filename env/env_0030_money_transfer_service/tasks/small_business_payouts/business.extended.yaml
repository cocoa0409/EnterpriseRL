  - id: business_evt_plan_change
    subject: [business_plan_upgraded, business_downgrade_scheduled, business_downgrade_applied, business_proration_credited, business_fee_charged]
    rule: >-
      A plan change is the owner's own decision; the agent explains its effect and the owner confirms
      it. A plan can be changed only while the account status is active. An upgrade takes effect on
      the day it is made, and the business must meet the higher plan's entry_min_months_in_business
      and have every document in its kyb_documents_required logged. On an upgrade from a plan whose
      upgrade_proration_enabled is true and whose subscription_fee for the current period was
      collected, the unused part of that fee is credited back as unused days over period days times
      the fee, rounded half up to the cent, where unused days run from the upgrade date to
      current_period_end inclusive; the higher plan's fee for the same unused days is charged at once
      as proration_charge, calculated the same way. A downgrade never takes effect mid-period: it is
      scheduled for the first day of the next billing period and applied then. A downgrade can be
      scheduled only when business_msr_active_users does not exceed the lower plan's max_seats and the
      lower plan offers every submission channel the business has scheduled payouts on. A downgrade
      or closure taking effect before commitment_end_date carries an early_termination_fee of
      early_termination_fee_months times the committed plan's monthly_fee_usd. Allowance, limits,
      fees and seats of the new plan apply to payouts submitted after the change; the free payouts
      already granted for the period are not changed.
    eligibility:
      - id: account_active
        applies_to: [business_plan_upgraded, business_downgrade_scheduled]
        kind: state
        condition: "A plan can be changed only while the account status is active."
        evidence_fields: [business_accounts.business_account_id, business_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        state_contract:
          field: business_accounts.status
          allowed: [active]
      - id: seats_fit_lower_plan
        applies_to: [business_downgrade_scheduled]
        kind: authorization
        condition: "A downgrade can be scheduled only when business_msr_active_users does not exceed the lower plan's max_seats and the lower plan offers every submission channel the business has scheduled payouts on."
        evidence_fields: [business_events.business_account_id, business_events.event_type, business_events.user_email]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_events.business_account_id]
          action_bindings:
            business_events.business_account_id: business_account_id
    params:
      per_tier:
        Paloma Business Starter: {upgrade_proration_enabled: "=upgrade_proration_enabled", monthly_fee_usd: "=monthly_fee_usd", annual_fee_usd: "=annual_fee_usd", max_seats: "=max_seats", entry_min_months_in_business: "=entry_min_months_in_business", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Essentials: {upgrade_proration_enabled: "=upgrade_proration_enabled", monthly_fee_usd: "=monthly_fee_usd", annual_fee_usd: "=annual_fee_usd", max_seats: "=max_seats", entry_min_months_in_business: "=entry_min_months_in_business", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Growth: {upgrade_proration_enabled: "=upgrade_proration_enabled", monthly_fee_usd: "=monthly_fee_usd", annual_fee_usd: "=annual_fee_usd", max_seats: "=max_seats", entry_min_months_in_business: "=entry_min_months_in_business", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Pro: {upgrade_proration_enabled: "=upgrade_proration_enabled", monthly_fee_usd: "=monthly_fee_usd", annual_fee_usd: "=annual_fee_usd", max_seats: "=max_seats", entry_min_months_in_business: "=entry_min_months_in_business", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Scale: {upgrade_proration_enabled: "=upgrade_proration_enabled", monthly_fee_usd: "=monthly_fee_usd", annual_fee_usd: "=annual_fee_usd", max_seats: "=max_seats", entry_min_months_in_business: "=entry_min_months_in_business", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Enterprise: {upgrade_proration_enabled: "=upgrade_proration_enabled", monthly_fee_usd: "=monthly_fee_usd", annual_fee_usd: "=annual_fee_usd", max_seats: "=max_seats", entry_min_months_in_business: "=entry_min_months_in_business", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
    measures: [business_msr_active_users]

  - id: business_evt_allowance
    subject: [business_allowance_granted, business_allowance_used, business_allowance_expired, business_allowance_restored]
    rule: >-
      At the start of every billing period the plan's free_payouts_per_period are granted. A local-rail
      payout uses one free payout whenever free_payouts_remaining is above 0 at its submission, in
      submission order, and then carries no payout fee; SWIFT payouts never use the allowance. Because
      allowance_rollover is false on every plan, free payouts still unused at the end of the period
      lapse when the next period starts. A free payout is restored only when the payout that used it
      is cancelled before release within the same billing period; a payout cancelled in a later
      period, or returned after release, does not restore it. The allowance of a plan change applies
      from the next period's grant.
    eligibility:
      - id: restore_same_period
        applies_to: [business_allowance_restored]
        kind: authorization
        condition: "A free payout is restored only when the payout that used it is cancelled before release within the same billing period"
        evidence_fields: [business_ledger.payout_reference, business_ledger.event_type, business_ledger.entry_date, business_accounts.current_period_start]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_ledger.payout_reference]
          action_bindings:
            business_ledger.payout_reference: payout_reference
    params:
      per_tier:
        Paloma Business Starter: {free_payouts_per_period: "=free_payouts_per_period", allowance_rollover: "=allowance_rollover"}
        Paloma Business Essentials: {free_payouts_per_period: "=free_payouts_per_period", allowance_rollover: "=allowance_rollover"}
        Paloma Business Growth: {free_payouts_per_period: "=free_payouts_per_period", allowance_rollover: "=allowance_rollover"}
        Paloma Business Pro: {free_payouts_per_period: "=free_payouts_per_period", allowance_rollover: "=allowance_rollover"}
        Paloma Business Scale: {free_payouts_per_period: "=free_payouts_per_period", allowance_rollover: "=allowance_rollover"}
        Paloma Business Enterprise: {free_payouts_per_period: "=free_payouts_per_period", allowance_rollover: "=allowance_rollover"}

  - id: business_evt_payout_pricing
    subject: [business_payout_submitted, business_payout_debited, business_fee_charged]
    rule: >-
      A local-rail payout that uses a free payout carries no fee. Any other local-rail payout carries
      payout_fee_usd, less api_payout_fee_discount_usd when submitted through the API (never below
      0.00). A SWIFT payout carries swift_payout_fee_usd. The margin is fx_margin_pct, less
      margin_reduction_pct_points when the principal is at or above margin_reduction_threshold_usd;
      fx_rate is the corridor's mid_market_rate in the Paloma rate sheet for the submission date times
      one minus the margin over 100, rounded half up to 4 decimals, and receive_amount is the
      principal times fx_rate rounded half up to 2 decimals (whole units for VND). The principal and
      the fee are taken from the balance at submission. A payout released at or before
      payout_release_cutoff_ct on a Paloma business day is released that day, otherwise on the next
      business day, and is expected payout_delivery_business_days Paloma business days later.
    eligibility: []
    params:
      per_tier:
        Paloma Business Starter: {payout_fee_usd: "=payout_fee_usd", api_payout_fee_discount_usd: "=api_payout_fee_discount_usd", swift_payout_fee_usd: "=swift_payout_fee_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", payout_release_cutoff_ct: "=payout_release_cutoff_ct", payout_delivery_business_days: "=payout_delivery_business_days"}
        Paloma Business Essentials: {payout_fee_usd: "=payout_fee_usd", api_payout_fee_discount_usd: "=api_payout_fee_discount_usd", swift_payout_fee_usd: "=swift_payout_fee_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", payout_release_cutoff_ct: "=payout_release_cutoff_ct", payout_delivery_business_days: "=payout_delivery_business_days"}
        Paloma Business Growth: {payout_fee_usd: "=payout_fee_usd", api_payout_fee_discount_usd: "=api_payout_fee_discount_usd", swift_payout_fee_usd: "=swift_payout_fee_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", payout_release_cutoff_ct: "=payout_release_cutoff_ct", payout_delivery_business_days: "=payout_delivery_business_days"}
        Paloma Business Pro: {payout_fee_usd: "=payout_fee_usd", api_payout_fee_discount_usd: "=api_payout_fee_discount_usd", swift_payout_fee_usd: "=swift_payout_fee_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", payout_release_cutoff_ct: "=payout_release_cutoff_ct", payout_delivery_business_days: "=payout_delivery_business_days"}
        Paloma Business Scale: {payout_fee_usd: "=payout_fee_usd", api_payout_fee_discount_usd: "=api_payout_fee_discount_usd", swift_payout_fee_usd: "=swift_payout_fee_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", payout_release_cutoff_ct: "=payout_release_cutoff_ct", payout_delivery_business_days: "=payout_delivery_business_days"}
        Paloma Business Enterprise: {payout_fee_usd: "=payout_fee_usd", api_payout_fee_discount_usd: "=api_payout_fee_discount_usd", swift_payout_fee_usd: "=swift_payout_fee_usd", fx_margin_pct: "=fx_margin_pct", margin_reduction_threshold_usd: "=margin_reduction_threshold_usd", margin_reduction_pct_points: "=margin_reduction_pct_points", payout_release_cutoff_ct: "=payout_release_cutoff_ct", payout_delivery_business_days: "=payout_delivery_business_days"}
    formula:
      effective_margin_pct: "fx_margin_pct - margin_reduction_pct_points if send_amount_usd >= margin_reduction_threshold_usd else fx_margin_pct"
      receive_amount: "round(send_amount_usd * fx_rate, 2)"

  - id: business_evt_payout_limits
    subject: [business_payout_submitted, business_payout_approved, business_payout_released]
    rule: >-
      Payouts may be submitted only while the account is active or past_due. A past_due account may
      submit payouts only within past_due_grace_days calendar days after it became past due. The grace
      is counted in calendar days from past_due_since, and a payout on past_due_since plus the grace
      days is still accepted. The principal must lie between min_payout_usd and per_payout_limit_usd,
      both inclusive, and business_msr_period_volume plus the principal may not exceed
      monthly_volume_limit_usd. A local-rail payout must go to a corridor in corridors_served; a SWIFT
      payout needs swift_payouts_enabled. The submission channel must be in
      payout_submission_channels; a batch needs batch_payouts_enabled and at most max_batch_lines lines
      (business_msr_batch_lines); a future release date needs scheduled_payouts_enabled. A payout above
      invoice_required_above_usd must carry the business's invoice reference. The available balance
      (balance_usd less ACH deposits still within ach_deposit_hold_business_days) must cover the
      principal plus the fee; a payout it cannot cover is not submitted. A payout at or above a
      non-zero dual_approval_threshold_usd is released only after a different active user with the
      approver role approves it. Business payouts are never limited by personal sending limits.
    eligibility:
      - id: account_can_pay
        applies_to: [business_payout_submitted]
        kind: state
        condition: "Payouts may be submitted only while the account is active or past_due."
        evidence_fields: [business_accounts.business_account_id, business_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        state_contract:
          field: business_accounts.status
          allowed: [active, past_due]
      - id: past_due_grace
        applies_to: [business_payout_submitted]
        kind: time
        condition: "A past_due account may submit payouts only within past_due_grace_days calendar days after it became past due."
        evidence_fields: [business_accounts.business_account_id, business_accounts.past_due_since]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "it became past due"
          anchor_source: business_accounts.past_due_since
          relation: not_after
          duration_source: variants.past_due_grace_days
          unit: calendar_days
          counting_rule: "The grace is counted in calendar days from past_due_since, and a payout on past_due_since plus the grace days is still accepted."
          boundary: inclusive
      - id: dual_approval
        applies_to: [business_payout_released]
        kind: authorization
        condition: "A payout at or above a non-zero dual_approval_threshold_usd is released only after a different active user with the approver role approves it."
        evidence_fields: [business_payouts.payout_reference, business_payouts.event_type, business_payouts.approver_email]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_payouts.payout_reference]
          action_bindings:
            business_payouts.payout_reference: payout_reference
    params:
      per_tier:
        Paloma Business Starter: {min_payout_usd: "=min_payout_usd", per_payout_limit_usd: "=per_payout_limit_usd", monthly_volume_limit_usd: "=monthly_volume_limit_usd", corridors_served: "=corridors_served", swift_payouts_enabled: "=swift_payouts_enabled", payout_submission_channels: "=payout_submission_channels", batch_payouts_enabled: "=batch_payouts_enabled", max_batch_lines: "=max_batch_lines", scheduled_payouts_enabled: "=scheduled_payouts_enabled", invoice_required_above_usd: "=invoice_required_above_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", dual_approval_threshold_usd: "=dual_approval_threshold_usd", api_access: "=api_access", past_due_grace_days: "=past_due_grace_days"}
        Paloma Business Essentials: {min_payout_usd: "=min_payout_usd", per_payout_limit_usd: "=per_payout_limit_usd", monthly_volume_limit_usd: "=monthly_volume_limit_usd", corridors_served: "=corridors_served", swift_payouts_enabled: "=swift_payouts_enabled", payout_submission_channels: "=payout_submission_channels", batch_payouts_enabled: "=batch_payouts_enabled", max_batch_lines: "=max_batch_lines", scheduled_payouts_enabled: "=scheduled_payouts_enabled", invoice_required_above_usd: "=invoice_required_above_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", dual_approval_threshold_usd: "=dual_approval_threshold_usd", api_access: "=api_access", past_due_grace_days: "=past_due_grace_days"}
        Paloma Business Growth: {min_payout_usd: "=min_payout_usd", per_payout_limit_usd: "=per_payout_limit_usd", monthly_volume_limit_usd: "=monthly_volume_limit_usd", corridors_served: "=corridors_served", swift_payouts_enabled: "=swift_payouts_enabled", payout_submission_channels: "=payout_submission_channels", batch_payouts_enabled: "=batch_payouts_enabled", max_batch_lines: "=max_batch_lines", scheduled_payouts_enabled: "=scheduled_payouts_enabled", invoice_required_above_usd: "=invoice_required_above_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", dual_approval_threshold_usd: "=dual_approval_threshold_usd", api_access: "=api_access", past_due_grace_days: "=past_due_grace_days"}
        Paloma Business Pro: {min_payout_usd: "=min_payout_usd", per_payout_limit_usd: "=per_payout_limit_usd", monthly_volume_limit_usd: "=monthly_volume_limit_usd", corridors_served: "=corridors_served", swift_payouts_enabled: "=swift_payouts_enabled", payout_submission_channels: "=payout_submission_channels", batch_payouts_enabled: "=batch_payouts_enabled", max_batch_lines: "=max_batch_lines", scheduled_payouts_enabled: "=scheduled_payouts_enabled", invoice_required_above_usd: "=invoice_required_above_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", dual_approval_threshold_usd: "=dual_approval_threshold_usd", api_access: "=api_access", past_due_grace_days: "=past_due_grace_days"}
        Paloma Business Scale: {min_payout_usd: "=min_payout_usd", per_payout_limit_usd: "=per_payout_limit_usd", monthly_volume_limit_usd: "=monthly_volume_limit_usd", corridors_served: "=corridors_served", swift_payouts_enabled: "=swift_payouts_enabled", payout_submission_channels: "=payout_submission_channels", batch_payouts_enabled: "=batch_payouts_enabled", max_batch_lines: "=max_batch_lines", scheduled_payouts_enabled: "=scheduled_payouts_enabled", invoice_required_above_usd: "=invoice_required_above_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", dual_approval_threshold_usd: "=dual_approval_threshold_usd", api_access: "=api_access", past_due_grace_days: "=past_due_grace_days"}
        Paloma Business Enterprise: {min_payout_usd: "=min_payout_usd", per_payout_limit_usd: "=per_payout_limit_usd", monthly_volume_limit_usd: "=monthly_volume_limit_usd", corridors_served: "=corridors_served", swift_payouts_enabled: "=swift_payouts_enabled", payout_submission_channels: "=payout_submission_channels", batch_payouts_enabled: "=batch_payouts_enabled", max_batch_lines: "=max_batch_lines", scheduled_payouts_enabled: "=scheduled_payouts_enabled", invoice_required_above_usd: "=invoice_required_above_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", dual_approval_threshold_usd: "=dual_approval_threshold_usd", api_access: "=api_access", past_due_grace_days: "=past_due_grace_days"}
    measures: [business_msr_period_volume, business_msr_batch_lines]

  - id: business_evt_payout_cancel_return
    subject: [business_payout_cancelled, business_payout_returned, business_payout_paid, business_payout_credited_back, business_fee_refunded, business_fee_charged]
    rule: >-
      A payout can be cancelled only before it is released: it has a business_payout_submitted row
      and no business_payout_released, business_payout_paid or business_payout_returned row. A payout
      is cancelled only once. On cancellation the principal is credited back to the balance, the
      payout or SWIFT fee is refunded with fee_refund_reason payout_cancelled, the free payout is
      restored under business_evt_allowance, and payout_cancel_fee_usd is charged as
      payout_cancel_fee when above 0.00. A released payout cannot be cancelled; a recall on a
      business payout is not offered. When a beneficiary bank returns a payout, the returned
      payout-currency amount is converted back at the corridor's mid_market_rate for the return date
      and credited to the balance as returned_amount_usd, the business bears any exchange
      difference, the payout fee is not refunded, and return_fee_usd is charged as return_fee. The
      business re-submits a corrected payout as a new payout with a new reference. Business payouts
      carry no Remittance Transfer Rule cancellation right or error-resolution remedy.
    eligibility:
      - id: not_yet_released
        applies_to: [business_payout_cancelled]
        kind: authorization
        condition: "A payout can be cancelled only before it is released: it has a business_payout_submitted row and no business_payout_released, business_payout_paid or business_payout_returned row."
        evidence_fields: [business_payouts.payout_reference, business_payouts.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_payouts.payout_reference]
          action_bindings:
            business_payouts.payout_reference: payout_reference
      - id: cancel_once
        applies_to: [business_payout_cancelled]
        kind: dedup
        condition: "A payout is cancelled only once."
        evidence_fields: [business_payouts.payout_reference, business_payouts.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_payouts.payout_reference]
          action_bindings:
            business_payouts.payout_reference: payout_reference
        dedup_contract:
          table: business_payouts
          mode: separate_record
          object_bindings: {payout_reference: payout_reference}
          duplicate_filters: {event_type: [business_payout_cancelled]}
          distinct_fields: []
    params:
      per_tier:
        Paloma Business Starter: {payout_cancel_fee_usd: "=payout_cancel_fee_usd", return_fee_usd: "=return_fee_usd"}
        Paloma Business Essentials: {payout_cancel_fee_usd: "=payout_cancel_fee_usd", return_fee_usd: "=return_fee_usd"}
        Paloma Business Growth: {payout_cancel_fee_usd: "=payout_cancel_fee_usd", return_fee_usd: "=return_fee_usd"}
        Paloma Business Pro: {payout_cancel_fee_usd: "=payout_cancel_fee_usd", return_fee_usd: "=return_fee_usd"}
        Paloma Business Scale: {payout_cancel_fee_usd: "=payout_cancel_fee_usd", return_fee_usd: "=return_fee_usd"}
        Paloma Business Enterprise: {payout_cancel_fee_usd: "=payout_cancel_fee_usd", return_fee_usd: "=return_fee_usd"}

  - id: business_evt_seats
    subject: [business_user_added, business_user_removed, business_fee_charged]
    rule: >-
      The owner adds and removes users; each user has one role (admin, approver, preparer or viewer)
      and the owner counts as one active user. A user can be added only while the account is active
      or past_due. A user may be added only when business_msr_active_users stays at or below
      max_seats including the new user. A user added during a period whose active users then exceed
      included_seats is charged extra_seat_fee_usd for that period at once, as extra_seat_fee with
      seq_in_period numbering such mid-period charges from 1; the fee is not prorated and not
      refunded when the user is removed. A user who is already active is not added again. Removing a
      user takes effect at once, and the owner can never be removed.
    eligibility:
      - id: account_open_for_users
        applies_to: [business_user_added]
        kind: state
        condition: "A user can be added only while the account is active or past_due."
        evidence_fields: [business_accounts.business_account_id, business_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        state_contract:
          field: business_accounts.status
          allowed: [active, past_due]
      - id: seat_cap
        applies_to: [business_user_added]
        kind: authorization
        condition: "A user may be added only when business_msr_active_users stays at or below max_seats including the new user."
        evidence_fields: [business_events.business_account_id, business_events.event_type, business_events.user_email]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_events.business_account_id]
          action_bindings:
            business_events.business_account_id: business_account_id
    params:
      per_tier:
        Paloma Business Starter: {included_seats: "=included_seats", max_seats: "=max_seats", extra_seat_fee_usd: "=extra_seat_fee_usd"}
        Paloma Business Essentials: {included_seats: "=included_seats", max_seats: "=max_seats", extra_seat_fee_usd: "=extra_seat_fee_usd"}
        Paloma Business Growth: {included_seats: "=included_seats", max_seats: "=max_seats", extra_seat_fee_usd: "=extra_seat_fee_usd"}
        Paloma Business Pro: {included_seats: "=included_seats", max_seats: "=max_seats", extra_seat_fee_usd: "=extra_seat_fee_usd"}
        Paloma Business Scale: {included_seats: "=included_seats", max_seats: "=max_seats", extra_seat_fee_usd: "=extra_seat_fee_usd"}
        Paloma Business Enterprise: {included_seats: "=included_seats", max_seats: "=max_seats", extra_seat_fee_usd: "=extra_seat_fee_usd"}
    measures: [business_msr_active_users]

  - id: business_evt_balance
    subject: [business_balance_deposited, business_balance_withdrawn, business_fee_charged]
    rule: >-
      The balance can receive deposits only by the plan's deposit_methods. A deposit is credited only
      while the account is active, past_due or suspended. A debit-card deposit carries
      card_deposit_fee_pct of the deposit, rounded half up to the cent, and a wire deposit carries
      wire_deposit_fee_usd, each as deposit_fee tied to the deposit_reference. An ACH deposit funds
      payouts only after ach_deposit_hold_business_days Paloma business days. A deposit that would take
      balance_usd above max_balance_usd is returned to its sender and not credited. A withdrawal is
      possible only while the account is active, past_due or suspended for nonpayment, and goes only
      to the business's verified US bank account; it may not exceed the available balance less
      charges still owed. The first free_withdrawals_per_period withdrawals of a billing period
      (business_msr_withdrawals_period) are free and each later one carries withdrawal_fee_usd as
      withdrawal_fee with the same seq_in_period. The balance never goes below 0.00.
    eligibility:
      - id: deposit_status
        applies_to: [business_balance_deposited]
        kind: state
        condition: "A deposit is credited only while the account is active, past_due or suspended."
        evidence_fields: [business_accounts.business_account_id, business_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        state_contract:
          field: business_accounts.status
          allowed: [active, past_due, suspended]
      - id: withdrawal_status
        applies_to: [business_balance_withdrawn]
        kind: state
        condition: "A withdrawal is possible only while the account is active, past_due or suspended for nonpayment"
        evidence_fields: [business_accounts.business_account_id, business_accounts.status, business_accounts.suspension_reason]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        state_contract:
          field: business_accounts.status
          allowed: [active, past_due, suspended]
    params:
      per_tier:
        Paloma Business Starter: {deposit_methods: "=deposit_methods", card_deposit_fee_pct: "=card_deposit_fee_pct", wire_deposit_fee_usd: "=wire_deposit_fee_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", max_balance_usd: "=max_balance_usd", withdrawal_fee_usd: "=withdrawal_fee_usd", free_withdrawals_per_period: "=free_withdrawals_per_period"}
        Paloma Business Essentials: {deposit_methods: "=deposit_methods", card_deposit_fee_pct: "=card_deposit_fee_pct", wire_deposit_fee_usd: "=wire_deposit_fee_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", max_balance_usd: "=max_balance_usd", withdrawal_fee_usd: "=withdrawal_fee_usd", free_withdrawals_per_period: "=free_withdrawals_per_period"}
        Paloma Business Growth: {deposit_methods: "=deposit_methods", card_deposit_fee_pct: "=card_deposit_fee_pct", wire_deposit_fee_usd: "=wire_deposit_fee_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", max_balance_usd: "=max_balance_usd", withdrawal_fee_usd: "=withdrawal_fee_usd", free_withdrawals_per_period: "=free_withdrawals_per_period"}
        Paloma Business Pro: {deposit_methods: "=deposit_methods", card_deposit_fee_pct: "=card_deposit_fee_pct", wire_deposit_fee_usd: "=wire_deposit_fee_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", max_balance_usd: "=max_balance_usd", withdrawal_fee_usd: "=withdrawal_fee_usd", free_withdrawals_per_period: "=free_withdrawals_per_period"}
        Paloma Business Scale: {deposit_methods: "=deposit_methods", card_deposit_fee_pct: "=card_deposit_fee_pct", wire_deposit_fee_usd: "=wire_deposit_fee_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", max_balance_usd: "=max_balance_usd", withdrawal_fee_usd: "=withdrawal_fee_usd", free_withdrawals_per_period: "=free_withdrawals_per_period"}
        Paloma Business Enterprise: {deposit_methods: "=deposit_methods", card_deposit_fee_pct: "=card_deposit_fee_pct", wire_deposit_fee_usd: "=wire_deposit_fee_usd", ach_deposit_hold_business_days: "=ach_deposit_hold_business_days", max_balance_usd: "=max_balance_usd", withdrawal_fee_usd: "=withdrawal_fee_usd", free_withdrawals_per_period: "=free_withdrawals_per_period"}
    measures: [business_msr_withdrawals_period]
    formula:
      card_deposit_fee: "round(amount_usd * card_deposit_fee_pct / 100, 2)"

  - id: business_evt_closure
    subject: [business_closed_by_owner, business_terminated, business_fee_refunded, business_fee_charged]
    rule: >-
      Only the owner can close the account, and only from status active; a past_due account first pays
      what it owes and a suspended account cannot be closed by the owner. Closure is allowed only when
      balance_usd is 0.00 and business_msr_open_payouts is 0: the owner withdraws the balance and
      every payout is paid, cancelled or returned first. Closing before commitment_end_date carries
      the early_termination_fee of business_evt_plan_change. When the owner closes the account within
      subscription_refund_window_days calendar days after the first subscription_fee was charged and
      no payout was submitted after that charge, that subscription_fee is refunded with
      fee_refund_reason subscription_refund_window; no other subscription fee is ever refunded on
      closure. The refund window is counted in calendar days from the entry_date of the first
      subscription_fee charge, and a closure on the last day of the window is inside it. Paloma terminates a suspended account only by its own decision. Records are kept for
      record_retention_years years after closure.
    eligibility:
      - id: nothing_left_open
        applies_to: [business_closed_by_owner]
        kind: authorization
        condition: "Closure is allowed only when balance_usd is 0.00 and business_msr_open_payouts is 0"
        evidence_fields: [business_accounts.business_account_id, business_accounts.balance_usd, business_payouts.business_account_id, business_payouts.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id, business_payouts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
            business_payouts.business_account_id: business_account_id
      - id: refund_window
        applies_to: [business_fee_refunded]
        kind: time
        condition: "When the owner closes the account within subscription_refund_window_days calendar days after the first subscription_fee was charged and no payout was submitted after that charge, that subscription_fee is refunded with fee_refund_reason subscription_refund_window"
        evidence_fields: [business_ledger.business_account_id, business_ledger.fee_type, business_ledger.entry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_ledger.business_account_id]
          action_bindings:
            business_ledger.business_account_id: business_account_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the first subscription_fee was charged"
          anchor_source: business_ledger.entry_date
          relation: not_after
          duration_source: variants.subscription_refund_window_days
          unit: calendar_days
          counting_rule: "The refund window is counted in calendar days from the entry_date of the first subscription_fee charge, and a closure on the last day of the window is inside it."
          boundary: inclusive
    params:
      record_retention_years: 5
      per_tier:
        Paloma Business Starter: {subscription_refund_window_days: "=subscription_refund_window_days", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Essentials: {subscription_refund_window_days: "=subscription_refund_window_days", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Growth: {subscription_refund_window_days: "=subscription_refund_window_days", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Pro: {subscription_refund_window_days: "=subscription_refund_window_days", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Scale: {subscription_refund_window_days: "=subscription_refund_window_days", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
        Paloma Business Enterprise: {subscription_refund_window_days: "=subscription_refund_window_days", minimum_commitment_months: "=minimum_commitment_months", early_termination_fee_months: "=early_termination_fee_months"}
    measures: [business_msr_open_payouts]

  - id: business_evt_service
    subject: [business_statement_requested, business_callback_scheduled]
    rule: >-
      The owner may request a statement of balance movements and payouts for any period whose
      statement_period_start is no earlier than the request date minus statement_history_months
      calendar months (same day of month, falling back to the month's last day) and whose
      statement_period_end is no later than the request date; statements are free and emailed to the
      owner's address on file, including for a closed account within record retention. A callback
      may be scheduled for any account not closed; its callback_due_date is the request date plus
      support_callback_business_days Paloma business days, and a plan whose
      dedicated_account_manager is true is called back by the named account manager.
    eligibility:
      - id: callback_account_open
        applies_to: [business_callback_scheduled]
        kind: state
        condition: "A callback may be scheduled for any account not closed"
        evidence_fields: [business_accounts.business_account_id, business_accounts.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [business_accounts.business_account_id]
          action_bindings:
            business_accounts.business_account_id: business_account_id
        state_contract:
          field: business_accounts.status
          allowed: [pending_kyb, active, past_due, suspended]
    params:
      per_tier:
        Paloma Business Starter: {statement_history_months: "=statement_history_months", support_callback_business_days: "=support_callback_business_days", dedicated_account_manager: "=dedicated_account_manager"}
        Paloma Business Essentials: {statement_history_months: "=statement_history_months", support_callback_business_days: "=support_callback_business_days", dedicated_account_manager: "=dedicated_account_manager"}
        Paloma Business Growth: {statement_history_months: "=statement_history_months", support_callback_business_days: "=support_callback_business_days", dedicated_account_manager: "=dedicated_account_manager"}
        Paloma Business Pro: {statement_history_months: "=statement_history_months", support_callback_business_days: "=support_callback_business_days", dedicated_account_manager: "=dedicated_account_manager"}
        Paloma Business Scale: {statement_history_months: "=statement_history_months", support_callback_business_days: "=support_callback_business_days", dedicated_account_manager: "=dedicated_account_manager"}
        Paloma Business Enterprise: {statement_history_months: "=statement_history_months", support_callback_business_days: "=support_callback_business_days", dedicated_account_manager: "=dedicated_account_manager"}

# ============================================================================
# extended_policies (small_business_payouts difficulty)
# ============================================================================
extended_policies:
  - id: business_ext_period_subscription_charge
    base_policy_refs: [business_evt_subscription_billing]
    overwrite:
      - base_policy: business_evt_subscription_billing
        superseded_clause: >-
          At the start of every period the subscription is charged from the balance as subscription_fee: the plan's monthly_fee_usd on monthly billing, or annual_fee_usd at the start of every twelfth period on annual billing (annual_billing_available must be true).
        replaced_by: >-
          The subscription charge is the discounted fee less the personal-relationship credit, less the deposit-relationship credit, plus the returns-servicing surcharge, never below 0.00 and rounded half up to the cent, and it is booked as one subscription fee entry for that billing period.
    trigger: state_due
    subject: [business_reinstated]
    computes: amount_usd
    target_tool: collect_overdue_subscription_325cf5bc
    params:
      activity_low_max_payouts: 2
      activity_min_approval_months: 12
      tenure_min_approval_months: 24
      tenure_paid_high: 30
      tenure_paid_low: 15
      tenure_pct_high: 10
      tenure_pct_low: 5
      relationship_credit_private_client: 25.00
      relationship_credit_premier: 12.00
      deposit_tier_high: 60000.00
      deposit_tier_low: 30000.00
      deposit_credit_high: 20.00
      deposit_credit_low: 8.00
      return_surcharge_high: 15.00
      return_surcharge_low: 6.00
    rule: >-
      Every billing period of a Paloma Business account carries one subscription charge, worked out the same way
      whether it is taken at the start of the period or collected later from an account that fell past due because
      the balance could not cover it. An annually billed account is charged the plan's annual fee at the start of
      every twelfth period, unchanged; the rest of this rule is the subscription charge of a monthly-billed account.
      The subscription charge of a billing period is the plan's monthly fee, booked in full as that period's
      subscription fee and rounded half up to the cent.
      How the plan's monthly fee is billed depends on the payouts the account submitted in the month before the day
      the charge is worked out, counted from the day after the same calendar day one month earlier up to and
      including that day: an account whose KYB approval is at least 12 whole months old and that submitted no payout
      in that month is billed half the monthly fee, rounded down to the whole dollar; an account whose KYB approval
      is at least 12 whole months old and that submitted one or two payouts in that month is billed three quarters
      of the monthly fee, rounded up to the whole dollar; every other account is billed the monthly fee in full.
      The billed fee then receives a tenure discount, a percentage decided by the whole months since KYB approval and
      by the payouts that beneficiary banks confirmed as paid in the six months before the day the charge is worked
      out, counted from the day after the same calendar day six months earlier up to and including that day: an
      account approved at least 24 whole months earlier with 30 or more paid payouts in that window receives a tenure
      discount of 10 percent; an account approved at least 24 whole months earlier with 15 to 29 paid payouts in that
      window receives a tenure discount of 5 percent; every other account receives no tenure discount.
      The billed fee is multiplied by one minus the tenure discount over 100 and rounded half up to the cent, giving
      the discounted fee.
      A personal-relationship credit is decided by the owner's Personal Sender Account: an owner whose Personal Sender
      Account is active at Paloma Private Client receives a personal-relationship credit of 25.00 USD; an owner whose
      Personal Sender Account is active at Paloma Premier receives 12.00 USD; every other owner, including an owner
      with no Personal Sender Account or with one that is not active, receives no personal-relationship credit.
      A deposit-relationship credit is decided by the deposits the business made to its balance in the three months
      before the day the charge is worked out, counted from the day after the same calendar day three months earlier
      up to and including that day: deposits totalling 60,000.00 USD or more earn a deposit-relationship credit of
      20.00 USD; deposits totalling 30,000.00 USD up to 59,999.99 USD earn 8.00 USD; smaller totals earn no
      deposit-relationship credit.
      A returns-servicing surcharge is decided by the payouts that beneficiary banks returned in the six months before
      the day the charge is worked out, counted the same way: two or more returned payouts add a returns-servicing
      surcharge of 15.00 USD; exactly one returned payout adds 6.00 USD; no returned payout adds nothing.
      The subscription charge is the discounted fee less the personal-relationship credit, less the
      deposit-relationship credit, plus the returns-servicing surcharge, never below 0.00 and rounded half up to the
      cent, and it is booked as one subscription fee entry for that billing period.
      When the charge of the current billing period could not be taken and the account is past due, the agent
      collects that period's subscription charge, worked out on the day of collection as above, from the balance once
      the balance covers it, and the account returns to active with no past-due date.
    prerequisite: []
    cross_category:
      - category: account
        as: branch
        reads: [level_number, status]
        note: The personal-relationship credit is decided from the level and status of the owner's Personal Sender Account.
    compute:
      - monthly_fee: "P('monthly_fee_usd')"
      - approval_months: "MONTHS(F('kyb_approved_date'), NOW)"
      - payouts_last_month: "COUNT('business_payouts', within_months=1, date_field='event_date', event_type='business_payout_submitted')"
      - billed_fee: "((monthly_fee / 2) // 1) if (payouts_last_month == 0 and approval_months >= K('activity_min_approval_months')) else ((-((-(monthly_fee * 0.75)) // 1)) if (payouts_last_month >= 1 and payouts_last_month <= K('activity_low_max_payouts') and approval_months >= K('activity_min_approval_months')) else monthly_fee)"
      - paid_payouts_6m: "COUNT('business_payouts', within_months=6, date_field='event_date', event_type='business_payout_paid')"
      - tenure_discount_pct: "K('tenure_pct_high') if (approval_months >= K('tenure_min_approval_months') and paid_payouts_6m >= K('tenure_paid_high')) else (K('tenure_pct_low') if (approval_months >= K('tenure_min_approval_months') and paid_payouts_6m >= K('tenure_paid_low')) else 0)"
      - discounted_fee: "RND(billed_fee * (100 - tenure_discount_pct) / 100, 2)"
      - personal_level: "CPARAM('account', 'level_number') or 0"
      - personal_status: "CFIELD('account', 'status')"
      - relationship_credit: "K('relationship_credit_private_client') if (personal_level == 6 and personal_status == 'active') else (K('relationship_credit_premier') if (personal_level == 5 and personal_status == 'active') else 0)"
      - deposits_3m: "SUM('business_ledger', 'amount_usd', within_months=3, date_field='entry_date', event_type='business_balance_deposited')"
      - deposit_credit: "K('deposit_credit_high') if deposits_3m >= K('deposit_tier_high') else (K('deposit_credit_low') if deposits_3m >= K('deposit_tier_low') else 0)"
      - returns_6m: "COUNT('business_payouts', within_months=6, date_field='event_date', event_type='business_payout_returned')"
      - return_surcharge: "K('return_surcharge_high') if returns_6m >= 2 else (K('return_surcharge_low') if returns_6m == 1 else 0)"
      - result: "RND(P('annual_fee_usd'), 2) if F('billing_cycle') == 'annual' else RND(MX(0, discounted_fee - relationship_credit - deposit_credit + return_surcharge), 2)"
    compute_basis:
      monthly_fee: "The subscription charge of a billing period is the plan's monthly fee, booked in full as that period's subscription fee and rounded half up to the cent."
      approval_months: "an account whose KYB approval is at least 12 whole months old"
      payouts_last_month: "How the plan's monthly fee is billed depends on the payouts the account submitted in the month before the day the charge is worked out, counted from the day after the same calendar day one month earlier up to and including that day"
      billed_fee: "an account whose KYB approval is at least 12 whole months old and that submitted no payout in that month is billed half the monthly fee, rounded down to the whole dollar; an account whose KYB approval is at least 12 whole months old and that submitted one or two payouts in that month is billed three quarters of the monthly fee, rounded up to the whole dollar; every other account is billed the monthly fee in full."
      paid_payouts_6m: "the payouts that beneficiary banks confirmed as paid in the six months before the day the charge is worked out, counted from the day after the same calendar day six months earlier up to and including that day"
      tenure_discount_pct: "an account approved at least 24 whole months earlier with 30 or more paid payouts in that window receives a tenure discount of 10 percent; an account approved at least 24 whole months earlier with 15 to 29 paid payouts in that window receives a tenure discount of 5 percent; every other account receives no tenure discount."
      discounted_fee: "The billed fee is multiplied by one minus the tenure discount over 100 and rounded half up to the cent, giving the discounted fee."
      personal_level: "A personal-relationship credit is decided by the owner's Personal Sender Account"
      personal_status: "A personal-relationship credit is decided by the owner's Personal Sender Account"
      relationship_credit: "an owner whose Personal Sender Account is active at Paloma Private Client receives a personal-relationship credit of 25.00 USD; an owner whose Personal Sender Account is active at Paloma Premier receives 12.00 USD; every other owner, including an owner with no Personal Sender Account or with one that is not active, receives no personal-relationship credit."
      deposits_3m: "the deposits the business made to its balance in the three months before the day the charge is worked out, counted from the day after the same calendar day three months earlier up to and including that day"
      deposit_credit: "deposits totalling 60,000.00 USD or more earn a deposit-relationship credit of 20.00 USD; deposits totalling 30,000.00 USD up to 59,999.99 USD earn 8.00 USD; smaller totals earn no deposit-relationship credit."
      returns_6m: "A returns-servicing surcharge is decided by the payouts that beneficiary banks returned in the six months before the day the charge is worked out, counted the same way"
      return_surcharge: "two or more returned payouts add a returns-servicing surcharge of 15.00 USD; exactly one returned payout adds 6.00 USD; no returned payout adds nothing."
      result: "An annually billed account is charged the plan's annual fee at the start of every twelfth period, unchanged; the rest of this rule is the subscription charge of a monthly-billed account. ... The subscription charge is the discounted fee less the personal-relationship credit, less the deposit-relationship credit, plus the returns-servicing surcharge, never below 0.00 and rounded half up to the cent, and it is booked as one subscription fee entry for that billing period."
    factors:
      - id: activity_billing
        effect: method
        decides: billed_fee
        bindings: [payouts_last_month, billed_fee]
        ladder:
          - when: "KYB approval at least 12 whole months old and no payout submitted in the month before the day the charge is worked out"
            method: "half the monthly fee, rounded down to the whole dollar"
          - when: "KYB approval at least 12 whole months old and one or two payouts submitted in that month"
            method: "three quarters of the monthly fee, rounded up to the whole dollar"
          - when: "otherwise"
            method: "the monthly fee in full"
        baseline:
          billed_fee: "monthly_fee"
        evidence: [history, date]
        cross_difficulty: null
      - id: tenure_discount
        effect: parameter
        decides: tenure_discount_pct
        bindings: [approval_months, paid_payouts_6m, tenure_discount_pct]
        ladder:
          - when: "approved at least 24 whole months earlier and 30 or more paid payouts in the six-month window"
            value: "K('tenure_pct_high') = 10 percent"
          - when: "approved at least 24 whole months earlier and 15 to 29 paid payouts in the six-month window"
            value: "K('tenure_pct_low') = 5 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          tenure_discount_pct: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: personal_relationship_credit
        effect: parameter
        decides: relationship_credit
        bindings: [personal_level, personal_status, relationship_credit]
        ladder:
          - when: "the owner's Personal Sender Account is at Paloma Private Client and active"
            value: "K('relationship_credit_private_client') = 25.00 USD"
          - when: "the owner's Personal Sender Account is at Paloma Premier and active"
            value: "K('relationship_credit_premier') = 12.00 USD"
          - when: "otherwise"
            value: "0.00 USD"
        baseline:
          relationship_credit: "0"
        evidence: [cross_category]
        cross_difficulty: account
      - id: deposit_relationship_credit
        effect: parameter
        decides: deposit_credit
        bindings: [deposits_3m, deposit_credit]
        ladder:
          - when: "deposits in the three-month window total 60,000.00 USD or more"
            value: "K('deposit_credit_high') = 20.00 USD"
          - when: "deposits in the three-month window total 30,000.00 USD up to 59,999.99 USD"
            value: "K('deposit_credit_low') = 8.00 USD"
          - when: "otherwise"
            value: "0.00 USD"
        baseline:
          deposit_credit: "0"
        evidence: [history]
        cross_difficulty: null
      - id: returns_servicing_surcharge
        effect: parameter
        decides: return_surcharge
        bindings: [returns_6m, return_surcharge]
        ladder:
          - when: "two or more payouts returned in the six-month window"
            value: "K('return_surcharge_high') = 15.00 USD"
          - when: "exactly one payout returned in the six-month window"
            value: "K('return_surcharge_low') = 6.00 USD"
          - when: "otherwise"
            value: "0.00 USD"
        baseline:
          return_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The subscription charge of a billing period is the plan's monthly fee, booked in full as that period's
        subscription fee and rounded half up to the cent.
      params: [monthly_fee_usd]
    inputs:
      history:
        - {table: business_payouts, aggregate: count, field: payout_reference, within_months: 1, filters: {event_type: business_payout_submitted}}
        - {table: business_payouts, aggregate: count, field: payout_reference, within_months: 6, filters: {event_type: business_payout_paid}}
        - {table: business_payouts, aggregate: count, field: payout_reference, within_months: 6, filters: {event_type: business_payout_returned}}
        - {table: business_ledger, aggregate: sum, field: amount_usd, within_months: 3, filters: {event_type: business_balance_deposited}}
      cross_category: [account]

  - id: business_ext_downgrade_termination_charge
    base_policy_refs: [business_evt_plan_change]
    overwrite:
      - base_policy: business_evt_plan_change
        superseded_clause: >-
          A downgrade or closure taking effect before commitment_end_date carries an early_termination_fee of early_termination_fee_months times the committed plan's monthly_fee_usd.
        replaced_by: >-
          The months charged are multiplied by the month price to give the gross termination charge; the retention discount and the upgrade-loyalty discount are first added into one percentage, and the gross termination charge is reduced once by that combined percentage and rounded half up to the cent; from that result the personal-customer credit and the fee offset are deducted, never below 0.00, and the early termination charge is that result rounded half up to the cent.
    trigger: on_request
    subject: [business_downgrade_scheduled]
    computes: early_termination_fee_usd
    target_tool: schedule_plan_downgrade_6c5bcb1c
    params:
      months_min_on_plan: 3
      price_latest_min_approval_months: 24
      price_largest_min_approval_months: 12
      retention_volume_high: 120000.00
      retention_volume_low: 40000.00
      retention_pct_high: 20
      retention_pct_low: 10
      upgrade_gap_high: 12
      upgrade_pct_high: 10
      upgrade_pct_low: 5
      personal_months_high: 60
      personal_months_low: 24
      personal_credit_high: 100.00
      personal_credit_low: 40.00
      offset_tier_high: 35.00
      offset_tier_low: 20.00
      offset_pct_high: 50
      offset_pct_low: 25
    rule: >-
      A downgrade the owner schedules before the commitment end date carries an early termination charge, taken from
      the balance as an early termination fee on the day the downgrade is scheduled; the downgrade itself still takes
      effect on the first day of the next billing period. A closure taking effect before the commitment end date
      carries the plan's early-termination months times the committed plan's monthly fee, as before. A downgrade
      scheduled on a plan with no commitment end date, or on or after the commitment end date, carries no early
      termination charge, that is 0.00.
      The early termination charge of a downgrade is fixed only after the account carries no subscription charge still
      owed for a billing period that has already started.
      The standard early termination charge of a downgrade is the plan's early-termination months times the committed
      plan's monthly fee, with no discount or credit, rounded half up to the cent.
      The months charged depend on the most recently collected subscription charge on the account's ledger, that is
      the subscription fee entry with the latest entry date, and on the billing period it was booked for, the periods
      still to run being counted as the whole months from the start of that period to the commitment end date, less
      one: when that charge was booked for the current billing period, its period starts three or more whole months
      after the committed plan took effect, the months charged are the periods
      still to run, but never more than the plan's early-termination months; when the period of that charge starts
      less than three whole months after the committed plan took effect, the months charged are all the periods still
      to run, with no limit; in every other case the months charged are the plan's early-termination months.
      Each month charged is priced by the whole months since KYB approval: an account approved at least 24 whole
      months before the day the downgrade is scheduled has each month priced at its most recently collected
      subscription charge; an account approved at least 12 and fewer than 24 whole months before has each month
      priced at the largest subscription charge on its ledger; every other account has each month priced at the
      committed plan's monthly fee.
      A retention discount, as a percentage, is decided by the net payout volume of the six months before the day the
      downgrade is scheduled, that is the payout principal debited from the balance less the payout money credited
      back to it, both counted from the day after the same calendar day six months earlier up to and including that
      day, and by the payouts returned in the twelve months before that day, counted the same way: a net payout
      volume of 120,000.00 USD or more with no returned payout earns a retention discount of 20 percent; a net payout
      volume of 40,000.00 USD or more with exactly one returned payout, or a net payout volume from 40,000.00 USD up
      to 119,999.99 USD with no returned payout, earns a retention discount of 10 percent; anything else earns no
      retention discount.
      An upgrade-loyalty discount, as a percentage, is decided by the whole months from KYB approval to the date the
      committed plan took effect: 12 or more whole months earn an upgrade-loyalty discount of 10 percent; 1 to 11
      whole months earn 5 percent; fewer than 1 whole month, including an account on the committed plan since approval, earns none.
      A personal-customer credit is decided by the owner's Personal Sender Account: an active Personal Sender Account
      opened 60 or more whole months before the day the downgrade is scheduled earns a personal-customer credit of
      100.00 USD; an active Personal Sender Account opened 24 to 59 whole months before earns 40.00 USD; an owner with
      no active Personal Sender Account, or with one opened fewer than 24 whole months before, earns none.
      A fee offset is decided by the payout fees and SWIFT payout fees taken from the balance in the six months
      before the day the downgrade is scheduled, counted the same way as the payout volume: fees totalling 35.00 USD
      or more are offset at 50 percent of that total; fees totalling 20.00 USD up to 34.99 USD are offset at 25
      percent of that total; smaller totals are not offset; the fee offset is rounded half up to the cent.
      The months charged are multiplied by the month price to give the gross termination charge; the retention
      discount and the upgrade-loyalty discount are first added into one percentage, and the gross termination charge
      is reduced once by that combined percentage and rounded half up to the cent; from that result the
      personal-customer credit and the fee offset are deducted, never below 0.00, and the early termination charge is
      that result rounded half up to the cent.
    prerequisite:
      - problem: business_ext_period_subscription_charge
        kind: value_input
        gate: months_charged
        form: state
        policy_source: >-
          The early termination charge of a downgrade is fixed only after the account carries no subscription charge still owed for a billing period that has already started.
        condition: >-
          The account has no past-due date and its most recently collected subscription fee entry is booked for the current billing period.
        resolved_by: collect_overdue_subscription_325cf5bc
        effect: >-
          Once the current period's subscription charge is collected, the most recently collected subscription charge is the one for the current billing period and nothing is owed, so the months charged move from the plan's early-termination months to the periods still to run after the current one, and the month price becomes the charge just collected.
    cross_category:
      - category: account
        as: branch
        reads: [opened_date, status]
        note: The personal-customer credit is decided from the opening date and status of the owner's Personal Sender Account.
    compute:
      - committed_monthly_fee: "P('monthly_fee_usd')"
      - cap_months: "P('early_termination_fee_months')"
      - latest_paid_period: "LATEST('business_ledger', 'billing_period_start', date_field='entry_date', event_type='business_fee_charged', fee_type='subscription_fee')"
      - periods_after_latest: "MONTHS(latest_paid_period, F('commitment_end_date')) - 1"
      - months_on_plan_at_latest: "MONTHS(F('plan_effective_date'), latest_paid_period)"
      - months_charged: "MN(cap_months, periods_after_latest) if (latest_paid_period == F('current_period_start') and months_on_plan_at_latest >= K('months_min_on_plan')) else (periods_after_latest if months_on_plan_at_latest < K('months_min_on_plan') else cap_months)"
      - approval_months: "MONTHS(F('kyb_approved_date'), NOW)"
      - latest_charge_amount: "LATEST('business_ledger', 'amount_usd', date_field='entry_date', event_type='business_fee_charged', fee_type='subscription_fee')"
      - largest_charge_amount: "MAX('business_ledger', 'amount_usd', event_type='business_fee_charged', fee_type='subscription_fee')"
      - month_price: "latest_charge_amount if approval_months >= K('price_latest_min_approval_months') else (largest_charge_amount if approval_months >= K('price_largest_min_approval_months') else committed_monthly_fee)"
      - net_volume_6m: "SUM('business_ledger', 'amount_usd', within_months=6, date_field='entry_date', event_type='business_payout_debited') - SUM('business_ledger', 'amount_usd', within_months=6, date_field='entry_date', event_type='business_payout_credited_back')"
      - returns_12m: "COUNT('business_payouts', within_months=12, date_field='event_date', event_type='business_payout_returned')"
      - retention_pct: "K('retention_pct_high') if (net_volume_6m >= K('retention_volume_high') and returns_12m == 0) else (K('retention_pct_low') if ((net_volume_6m >= K('retention_volume_low') and returns_12m == 1) or (net_volume_6m >= K('retention_volume_low') and net_volume_6m < K('retention_volume_high') and returns_12m == 0)) else 0)"
      - upgrade_gap_months: "MONTHS(F('kyb_approved_date'), F('plan_effective_date'))"
      - upgrade_loyalty_pct: "K('upgrade_pct_high') if upgrade_gap_months >= K('upgrade_gap_high') else (K('upgrade_pct_low') if upgrade_gap_months >= 1 else 0)"
      - personal_opened: "CFIELD('account', 'opened_date')"
      - personal_status: "CFIELD('account', 'status')"
      - personal_months: "MONTHS(personal_opened, NOW) if personal_opened else 0"
      - personal_credit: "K('personal_credit_high') if (personal_months >= K('personal_months_high') and personal_status == 'active') else (K('personal_credit_low') if (personal_months >= K('personal_months_low') and personal_months < K('personal_months_high') and personal_status == 'active') else 0)"
      - payout_fees_6m: "SUM('business_ledger', 'amount_usd', within_months=6, date_field='entry_date', event_type='business_fee_charged', fee_type='payout_fee') + SUM('business_ledger', 'amount_usd', within_months=6, date_field='entry_date', event_type='business_fee_charged', fee_type='swift_payout_fee')"
      - fee_offset_pct: "K('offset_pct_high') if payout_fees_6m >= K('offset_tier_high') else (K('offset_pct_low') if payout_fees_6m >= K('offset_tier_low') else 0)"
      - fee_offset: "RND(payout_fees_6m * fee_offset_pct / 100, 2)"
      - gross_charge: "months_charged * month_price"
      - discounted_charge: "RND(gross_charge * (100 - (retention_pct + upgrade_loyalty_pct)) / 100, 2)"
      - outside_commitment: "F('commitment_end_date') == '' or F('commitment_end_date') <= NOW"
      - result: "0 if outside_commitment else RND(MX(0, discounted_charge - personal_credit - fee_offset), 2)"
    compute_basis:
      committed_monthly_fee: "The standard early termination charge of a downgrade is the plan's early-termination months times the committed plan's monthly fee, with no discount or credit, rounded half up to the cent."
      cap_months: "The standard early termination charge of a downgrade is the plan's early-termination months times the committed plan's monthly fee, with no discount or credit, rounded half up to the cent."
      latest_paid_period: "The months charged depend on the most recently collected subscription charge on the account's ledger, that is the subscription fee entry with the latest entry date, and on the billing period it was booked for"
      periods_after_latest: "the periods still to run being counted as the whole months from the start of that period to the commitment end date, less one"
      months_on_plan_at_latest: "its period starts three or more whole months after the committed plan took effect"
      months_charged: "when that charge was booked for the current billing period, its period starts three or more whole months after the committed plan took effect, the months charged are the periods still to run, but never more than the plan's early-termination months; when the period of that charge starts less than three whole months after the committed plan took effect, the months charged are all the periods still to run, with no limit; in every other case the months charged are the plan's early-termination months."
      approval_months: "Each month charged is priced by the whole months since KYB approval"
      latest_charge_amount: "an account approved at least 24 whole months before the day the downgrade is scheduled has each month priced at its most recently collected subscription charge"
      largest_charge_amount: "an account approved at least 12 and fewer than 24 whole months before has each month priced at the largest subscription charge on its ledger"
      month_price: "an account approved at least 24 whole months before the day the downgrade is scheduled has each month priced at its most recently collected subscription charge; an account approved at least 12 and fewer than 24 whole months before has each month priced at the largest subscription charge on its ledger; every other account has each month priced at the committed plan's monthly fee."
      net_volume_6m: "the net payout volume of the six months before the day the downgrade is scheduled, that is the payout principal debited from the balance less the payout money credited back to it, both counted from the day after the same calendar day six months earlier up to and including that day"
      returns_12m: "the payouts returned in the twelve months before that day, counted the same way"
      retention_pct: "a net payout volume of 120,000.00 USD or more with no returned payout earns a retention discount of 20 percent; a net payout volume of 40,000.00 USD or more with exactly one returned payout, or a net payout volume from 40,000.00 USD up to 119,999.99 USD with no returned payout, earns a retention discount of 10 percent; anything else earns no retention discount."
      upgrade_gap_months: "An upgrade-loyalty discount, as a percentage, is decided by the whole months from KYB approval to the date the committed plan took effect"
      upgrade_loyalty_pct: "12 or more whole months earn an upgrade-loyalty discount of 10 percent; 1 to 11 whole months earn 5 percent; fewer than 1 whole month, including an account on the committed plan since approval, earns none."
      personal_opened: "A personal-customer credit is decided by the owner's Personal Sender Account"
      personal_status: "A personal-customer credit is decided by the owner's Personal Sender Account"
      personal_months: "an active Personal Sender Account opened 60 or more whole months before the day the downgrade is scheduled"
      personal_credit: "an active Personal Sender Account opened 60 or more whole months before the day the downgrade is scheduled earns a personal-customer credit of 100.00 USD; an active Personal Sender Account opened 24 to 59 whole months before earns 40.00 USD; an owner with no active Personal Sender Account, or with one opened fewer than 24 whole months before, earns none."
      payout_fees_6m: "A fee offset is decided by the payout fees and SWIFT payout fees taken from the balance in the six months before the day the downgrade is scheduled, counted the same way as the payout volume"
      fee_offset_pct: "fees totalling 35.00 USD or more are offset at 50 percent of that total; fees totalling 20.00 USD up to 34.99 USD are offset at 25 percent of that total; smaller totals are not offset"
      fee_offset: "the fee offset is rounded half up to the cent."
      gross_charge: "The months charged are multiplied by the month price to give the gross termination charge"
      discounted_charge: "the retention discount and the upgrade-loyalty discount are first added into one percentage, and the gross termination charge is reduced once by that combined percentage and rounded half up to the cent"
      outside_commitment: "A downgrade scheduled on a plan with no commitment end date, or on or after the commitment end date, carries no early termination charge, that is 0.00."
      result: "from that result the personal-customer credit and the fee offset are deducted, never below 0.00, and the early termination charge is that result rounded half up to the cent."
    factors:
      - id: months_charged_basis
        effect: method
        decides: months_charged
        bindings: [latest_paid_period, periods_after_latest, months_on_plan_at_latest, months_charged]
        ladder:
          - when: "the most recently collected subscription charge is booked for the current billing period and its period starts three or more whole months after the committed plan took effect"
            method: "the periods still to run after that period up to the commitment end date, capped at the plan's early-termination months"
          - when: "the period of the most recently collected subscription charge starts less than three whole months after the committed plan took effect"
            method: "all the periods still to run after that period up to the commitment end date, uncapped"
          - when: "otherwise"
            method: "the plan's early-termination months"
        baseline:
          months_charged: "cap_months"
        evidence: [history, date]
        cross_difficulty: null
      - id: month_price_selection
        effect: method
        decides: month_price
        bindings: [approval_months, latest_charge_amount, largest_charge_amount, month_price]
        ladder:
          - when: "KYB approval at least 24 whole months before the day the downgrade is scheduled"
            method: "each month priced at the most recently collected subscription charge"
          - when: "KYB approval at least 12 and fewer than 24 whole months before"
            method: "each month priced at the largest subscription charge on the ledger"
          - when: "otherwise"
            method: "each month priced at the committed plan's monthly fee"
        baseline:
          month_price: "committed_monthly_fee"
        evidence: [history, date]
        cross_difficulty: null
      - id: retention_discount
        effect: parameter
        decides: retention_pct
        bindings: [net_volume_6m, returns_12m, retention_pct]
        ladder:
          - when: "net payout volume of the six-month window 120,000.00 USD or more and no payout returned in the twelve-month window"
            value: "K('retention_pct_high') = 20 percent"
          - when: "net payout volume 40,000.00 USD or more and exactly one payout returned, or net payout volume from 40,000.00 USD up to 119,999.99 USD and no payout returned"
            value: "K('retention_pct_low') = 10 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          retention_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: upgrade_loyalty_discount
        effect: parameter
        decides: upgrade_loyalty_pct
        bindings: [upgrade_gap_months, upgrade_loyalty_pct]
        ladder:
          - when: "12 or more whole months from KYB approval to the date the committed plan took effect"
            value: "K('upgrade_pct_high') = 10 percent"
          - when: "1 to 11 whole months from KYB approval to the date the committed plan took effect"
            value: "K('upgrade_pct_low') = 5 percent"
          - when: "otherwise (fewer than 1 whole month, including on the committed plan since approval)"
            value: "0 percent"
        baseline:
          upgrade_loyalty_pct: "0"
        evidence: [date]
        cross_difficulty: null
      - id: personal_customer_credit
        effect: parameter
        decides: personal_credit
        bindings: [personal_opened, personal_status, personal_months, personal_credit]
        ladder:
          - when: "the owner's Personal Sender Account is active and was opened 60 or more whole months before"
            value: "K('personal_credit_high') = 100.00 USD"
          - when: "the owner's Personal Sender Account is active and was opened 24 to 59 whole months before"
            value: "K('personal_credit_low') = 40.00 USD"
          - when: "otherwise"
            value: "0.00 USD"
        baseline:
          personal_credit: "0"
        evidence: [cross_category, date]
        cross_difficulty: account
      - id: payout_fee_offset
        effect: parameter
        decides: fee_offset_pct
        bindings: [payout_fees_6m, fee_offset_pct, fee_offset]
        ladder:
          - when: "payout and SWIFT payout fees in the six-month window total 35.00 USD or more"
            value: "K('offset_pct_high') = 50 percent of that total"
          - when: "those fees total 20.00 USD up to 34.99 USD"
            value: "K('offset_pct_low') = 25 percent of that total"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          fee_offset_pct: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard early termination charge of a downgrade is the plan's early-termination months times the committed
        plan's monthly fee, with no discount or credit, rounded half up to the cent.
      params: [early_termination_fee_months, monthly_fee_usd]
    inputs:
      history:
        - {table: business_ledger, aggregate: latest, field: billing_period_start, filters: {event_type: business_fee_charged, fee_type: subscription_fee}}
        - {table: business_ledger, aggregate: latest, field: amount_usd, filters: {event_type: business_fee_charged, fee_type: subscription_fee}}
        - {table: business_ledger, aggregate: max, field: amount_usd, filters: {event_type: business_fee_charged, fee_type: subscription_fee}}
        - {table: business_ledger, aggregate: sum, field: amount_usd, within_months: 6, filters: {event_type: business_payout_debited}}
        - {table: business_ledger, aggregate: sum, field: amount_usd, within_months: 6, filters: {event_type: business_payout_credited_back}}
        - {table: business_payouts, aggregate: count, field: payout_reference, within_months: 12, filters: {event_type: business_payout_returned}}
        - {table: business_ledger, aggregate: sum, field: amount_usd, within_months: 6, filters: {event_type: business_fee_charged, fee_type: payout_fee}}
        - {table: business_ledger, aggregate: sum, field: amount_usd, within_months: 6, filters: {event_type: business_fee_charged, fee_type: swift_payout_fee}}
      cross_category: [account]

  - id: business_ext_mid_period_seat_charge
    base_policy_refs: [business_evt_seats]
    overwrite:
      - base_policy: business_evt_seats
        superseded_clause: >-
          A user added during a period whose active users then exceed included_seats is charged extra_seat_fee_usd for that period at once, as extra_seat_fee with seq_in_period numbering such mid-period charges from 1; the fee is not prorated and not refunded when the user is removed.
        replaced_by: >-
          The per-seat fee is the plan's extra seat fee less the volume reduction and less the batch-operations reduction, never below 0.00; it is multiplied by the users charged after the approver seats are freed, the period method is applied to that product, and the extra seat charge is the result, rounded up to the cent where the period method says so and otherwise half up to the cent; it is not refunded when a user is removed.
    trigger: state_due
    subject: [business_user_added]
    computes: amount_usd
    target_tool: charge_extra_seats_0d292d98
    params:
      volume_over_high: 6
      volume_over_low: 2
      volume_reduction_high: 2.00
      volume_reduction_low: 1.00
      approvals_high: 10
      free_seats_high: 2
      free_seats_low: 1
      batch_high: 10
      batch_reduction_high: 2.00
      batch_reduction_low: 1.00
      daily_min_approval_months: 36
      half_min_approval_months: 12
    rule: >-
      Users added to a Paloma Business account during a billing period while more users are active than the plan
      includes are charged for that period at once; the agent books the extra seat charge as one extra seat fee entry
      for the current billing period, numbered in the period after any earlier mid-period seat fee entries.
      The users charged are the users added in the month before the day the charge is worked out, counted from the
      day after the same calendar day one month earlier up to and including that day, but never more than the active
      users beyond the plan's included seats, the active users being the owner plus every user added less every user
      removed.
      The standard extra seat charge is the number of users charged times the plan's extra seat fee, charged in full
      for the billing period and rounded half up to the cent.
      How the seats are charged for the period depends on the whole months since KYB approval and on the days left in
      the current billing period, counted from the day the charge is worked out to the last day of the period, both
      days included: an account approved at least 36 whole months earlier with fewer days left than half the period's
      days is charged the seats' total times the days left over the period's days, rounded up to the cent; an account
      approved at least 12 and fewer than 36 whole months earlier with fewer days left than half the period's days is
      charged half the seats' total, rounded up to the cent; every other account is charged the seats' total in full.
      A volume reduction per seat is decided by the active users beyond the included seats: 6 or more earn a volume
      reduction of 2.00 USD per seat; 2 to 5 earn 1.00 USD per seat; a single one earns none.
      Approver seats are freed by the payouts a second user approved in the three months before the day the charge is
      worked out, counted from the day after the same calendar day three months earlier up to and including that day:
      10 or more approvals free 2 of the users charged; 1 to 9 approvals free 1 of them; no approval frees none; the
      users charged never go below zero.
      A batch-operations reduction per seat is decided by the payouts submitted by batch file in the same three months:
      10 or more batch-file payouts earn a batch-operations reduction of 2.00 USD per seat; 1 to 9 earn 1.00 USD per
      seat; none earns none.
      The per-seat fee is the plan's extra seat fee less the volume reduction and less the batch-operations reduction,
      never below 0.00; it is multiplied by the users charged after the approver seats are freed, the period method is
      applied to that product, and the extra seat charge is the result, rounded up to the cent where the period method
      says so and otherwise half up to the cent; it is not refunded when a user is removed.
    prerequisite: []
    cross_category: []
    compute:
      - extra_seat_fee: "P('extra_seat_fee_usd')"
      - included: "P('included_seats')"
      - active_users: "1 + COUNT('business_events', event_type='business_user_added') - COUNT('business_events', event_type='business_user_removed')"
      - over_included: "MX(0, active_users - included)"
      - added_last_month: "COUNT('business_events', within_months=1, date_field='event_date', event_type='business_user_added')"
      - users_before_relief: "MN(added_last_month, over_included)"
      - approvals_3m: "COUNT('business_payouts', within_months=3, date_field='event_date', event_type='business_payout_approved')"
      - free_seats: "K('free_seats_high') if approvals_3m >= K('approvals_high') else (K('free_seats_low') if approvals_3m >= 1 else 0)"
      - users_charged: "MX(0, users_before_relief - free_seats)"
      - volume_reduction: "K('volume_reduction_high') if over_included >= K('volume_over_high') else (K('volume_reduction_low') if over_included >= K('volume_over_low') else 0)"
      - batch_3m: "COUNT('business_payouts', within_months=3, date_field='event_date', event_type='business_payout_submitted', submission_channel='batch_file')"
      - batch_reduction: "K('batch_reduction_high') if batch_3m >= K('batch_high') else (K('batch_reduction_low') if batch_3m >= 1 else 0)"
      - seat_fee: "MX(0, extra_seat_fee - volume_reduction - batch_reduction)"
      - full_charge: "users_charged * seat_fee"
      - approval_months: "MONTHS(F('kyb_approved_date'), NOW)"
      - days_left: "DAYS(NOW, F('current_period_end')) + 1"
      - period_days: "DAYS(F('current_period_start'), F('current_period_end')) + 1"
      - period_charge: "((-((-(full_charge * days_left / period_days * 100)) // 1)) / 100) if (approval_months >= K('daily_min_approval_months') and days_left * 2 < period_days) else (((-((-(full_charge / 2 * 100)) // 1)) / 100) if (approval_months >= K('half_min_approval_months') and approval_months < K('daily_min_approval_months') and days_left * 2 < period_days) else full_charge)"
      - result: "RND(period_charge, 2)"
    compute_basis:
      extra_seat_fee: "The standard extra seat charge is the number of users charged times the plan's extra seat fee, charged in full for the billing period and rounded half up to the cent."
      included: "never more than the active users beyond the plan's included seats"
      active_users: "the active users being the owner plus every user added less every user removed"
      over_included: "never more than the active users beyond the plan's included seats"
      added_last_month: "The users charged are the users added in the month before the day the charge is worked out, counted from the day after the same calendar day one month earlier up to and including that day"
      users_before_relief: "The users charged are the users added in the month before the day the charge is worked out, counted from the day after the same calendar day one month earlier up to and including that day, but never more than the active users beyond the plan's included seats"
      approvals_3m: "Approver seats are freed by the payouts a second user approved in the three months before the day the charge is worked out, counted from the day after the same calendar day three months earlier up to and including that day"
      free_seats: "10 or more approvals free 2 of the users charged; 1 to 9 approvals free 1 of them; no approval frees none"
      users_charged: "the users charged never go below zero."
      volume_reduction: "A volume reduction per seat is decided by the active users beyond the included seats: 6 or more earn a volume reduction of 2.00 USD per seat; 2 to 5 earn 1.00 USD per seat; a single one earns none."
      batch_3m: "A batch-operations reduction per seat is decided by the payouts submitted by batch file in the same three months"
      batch_reduction: "10 or more batch-file payouts earn a batch-operations reduction of 2.00 USD per seat; 1 to 9 earn 1.00 USD per seat; none earns none."
      seat_fee: "The per-seat fee is the plan's extra seat fee less the volume reduction and less the batch-operations reduction, never below 0.00"
      full_charge: "it is multiplied by the users charged after the approver seats are freed"
      approval_months: "How the seats are charged for the period depends on the whole months since KYB approval"
      days_left: "the days left in the current billing period, counted from the day the charge is worked out to the last day of the period, both days included"
      period_days: "fewer days left than half the period's days"
      period_charge: "an account approved at least 36 whole months earlier with fewer days left than half the period's days is charged the seats' total times the days left over the period's days, rounded up to the cent; an account approved at least 12 and fewer than 36 whole months earlier with fewer days left than half the period's days is charged half the seats' total, rounded up to the cent; every other account is charged the seats' total in full."
      result: "the extra seat charge is the result, rounded up to the cent where the period method says so and otherwise half up to the cent"
    factors:
      - id: seat_period_method
        effect: method
        decides: period_charge
        bindings: [approval_months, days_left, period_days, period_charge]
        ladder:
          - when: "approved at least 36 whole months earlier and fewer days left in the period than half its days"
            method: "the seats' total times the days left over the period's days, rounded up to the cent"
          - when: "approved at least 12 and fewer than 36 whole months earlier and fewer days left than half the period's days"
            method: "half the seats' total, rounded up to the cent"
          - when: "otherwise"
            method: "the seats' total in full"
        baseline:
          period_charge: "full_charge"
        evidence: [date]
        cross_difficulty: null
      - id: seat_volume_reduction
        effect: parameter
        decides: volume_reduction
        bindings: [active_users, over_included, volume_reduction]
        ladder:
          - when: "6 or more active users beyond the included seats"
            value: "K('volume_reduction_high') = 2.00 USD per seat"
          - when: "2 to 5 active users beyond the included seats"
            value: "K('volume_reduction_low') = 1.00 USD per seat"
          - when: "otherwise"
            value: "0.00 USD"
        baseline:
          volume_reduction: "0"
        evidence: [history]
        cross_difficulty: null
      - id: approver_seats
        effect: parameter
        decides: free_seats
        bindings: [approvals_3m, free_seats]
        ladder:
          - when: "10 or more payouts approved by a second user in the three-month window"
            value: "K('free_seats_high') = 2 users freed"
          - when: "1 to 9 approvals in the three-month window"
            value: "K('free_seats_low') = 1 user freed"
          - when: "otherwise"
            value: "0 users freed"
        baseline:
          free_seats: "0"
        evidence: [history]
        cross_difficulty: null
      - id: batch_operations_reduction
        effect: parameter
        decides: batch_reduction
        bindings: [batch_3m, batch_reduction]
        ladder:
          - when: "10 or more batch-file payouts in the three-month window"
            value: "K('batch_reduction_high') = 2.00 USD per seat"
          - when: "1 to 9 batch-file payouts in the three-month window"
            value: "K('batch_reduction_low') = 1.00 USD per seat"
          - when: "otherwise"
            value: "0.00 USD"
        baseline:
          batch_reduction: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The users charged are the users added in the month before the day the charge is worked out, counted from the
        day after the same calendar day one month earlier up to and including that day, but never more than the active
        users beyond the plan's included seats, the active users being the owner plus every user added less every user
        removed.
        The standard extra seat charge is the number of users charged times the plan's extra seat fee, charged in full
        for the billing period and rounded half up to the cent.
      params: [extra_seat_fee_usd, included_seats]
    inputs:
      history:
        - {table: business_events, aggregate: count, field: user_email, filters: {event_type: business_user_added}}
        - {table: business_events, aggregate: count, field: user_email, filters: {event_type: business_user_removed}}
        - {table: business_events, aggregate: count, field: user_email, within_months: 1, filters: {event_type: business_user_added}}
        - {table: business_payouts, aggregate: count, field: payout_reference, within_months: 3, filters: {event_type: business_payout_approved}}
        - {table: business_payouts, aggregate: count, field: payout_reference, within_months: 3, filters: {event_type: business_payout_submitted, submission_channel: batch_file}}
      cross_category: []

  - id: business_ext_card_deposit_fee
    base_policy_refs: [business_evt_balance]
    overwrite:
      - base_policy: business_evt_balance
        superseded_clause: >-
          A debit-card deposit carries card_deposit_fee_pct of the deposit, rounded half up to the cent, and a wire deposit carries wire_deposit_fee_usd, each as deposit_fee tied to the deposit_reference.
        replaced_by: >-
          The card deposit rate is the size rate less the card-volume reduction and less the bank-funding reduction; the card deposit fee is the charged amount times that rate over 100, under the cap where the charging method sets one, never below 0.00 and rounded half up to the cent.
    trigger: state_due
    subject: [business_balance_deposited]
    computes: fee_usd
    target_tool: charge_card_deposit_fee_e69fd8f7
    params:
      size_large: 10000.00
      size_mid: 2500.00
      rate_large: 1.80
      rate_mid: 2.20
      card_volume_high: 20000.00
      card_volume_low: 10000.00
      volume_points_high: 0.30
      volume_points_low: 0.15
      bank_ach_high: 3
      bank_card_max: 2
      bank_points_high: 0.25
      bank_points_low: 0.10
      excess_min_approval_months: 36
      cap_min_approval_months: 12
      excess_floor: 1000.00
      fee_cap: 75.00
    rule: >-
      A wire deposit carries the plan's wire deposit fee as a deposit fee tied to its deposit reference, unchanged.
      A debit-card deposit carries a card deposit fee tied to its deposit reference, which the agent books as one
      deposit fee entry for the current billing period; the card deposit fee is worked out for the most recent
      debit-card deposit on the account's ledger.
      The standard card deposit fee is the plan's card deposit fee percentage of the whole deposit, rounded half up to
      the cent.
      The size rate is decided by the amount of that deposit: a deposit of 10,000.00 USD or more has a size rate of
      1.80 percent; a deposit of 2,500.00 USD up to 9,999.99 USD has a size rate of 2.20 percent; a smaller deposit has
      the plan's card deposit fee percentage as its size rate.
      A card-volume reduction is decided by the total of all debit-card deposits received in the three months before
      the day the fee is worked out, counted from the day after the same calendar day three months earlier up to and
      including that day: a total of 20,000.00 USD or more earns a card-volume reduction of 0.30 percentage points; a
      total of 10,000.00 USD up to 19,999.99 USD earns 0.15 percentage points; a smaller total earns none.
      A bank-funding reduction is decided by the deposits received in the same three months: an account with three or
      more ACH credit deposits and no more than two debit-card deposits in that window earns a bank-funding reduction
      of 0.25 percentage points; an account with one or two ACH credit deposits and no more than two debit-card
      deposits earns 0.10 percentage points; any other account earns none.
      The amount the rate is charged on depends on the whole months since KYB approval: an account approved at least
      36 whole months earlier is charged on the part of the deposit above 1,000.00 USD; an account approved at least
      12 and fewer than 36 whole months earlier is charged on the whole deposit, with the card deposit fee capped at
      75.00 USD; every other account is charged on the whole deposit.
      The card deposit rate is the size rate less the card-volume reduction and less the bank-funding reduction; the
      card deposit fee is the charged amount times that rate over 100, under the cap where the charging method sets
      one, never below 0.00 and rounded half up to the cent.
    prerequisite: []
    cross_category: []
    compute:
      - card_pct: "P('card_deposit_fee_pct')"
      - deposit_amount: "LATEST('business_ledger', 'amount_usd', date_field='entry_date', event_type='business_balance_deposited', deposit_method='debit_card')"
      - size_rate: "K('rate_large') if deposit_amount >= K('size_large') else (K('rate_mid') if deposit_amount >= K('size_mid') else card_pct)"
      - card_total_3m: "SUM('business_ledger', 'amount_usd', within_months=3, date_field='entry_date', event_type='business_balance_deposited', deposit_method='debit_card')"
      - volume_points: "K('volume_points_high') if card_total_3m >= K('card_volume_high') else (K('volume_points_low') if card_total_3m >= K('card_volume_low') else 0)"
      - card_count_3m: "COUNT('business_ledger', within_months=3, date_field='entry_date', event_type='business_balance_deposited', deposit_method='debit_card')"
      - ach_count_3m: "COUNT('business_ledger', within_months=3, date_field='entry_date', event_type='business_balance_deposited', deposit_method='ach_credit')"
      - bank_points: "K('bank_points_high') if (ach_count_3m >= K('bank_ach_high') and card_count_3m <= K('bank_card_max')) else (K('bank_points_low') if (ach_count_3m >= 1 and card_count_3m <= K('bank_card_max')) else 0)"
      - card_rate: "size_rate - volume_points - bank_points"
      - approval_months: "MONTHS(F('kyb_approved_date'), NOW)"
      - card_fee: "((deposit_amount - K('excess_floor')) * card_rate / 100) if approval_months >= K('excess_min_approval_months') else (MN(K('fee_cap'), deposit_amount * card_rate / 100) if approval_months >= K('cap_min_approval_months') else deposit_amount * card_rate / 100)"
      - result: "RND(MX(0, card_fee), 2)"
    compute_basis:
      card_pct: "The standard card deposit fee is the plan's card deposit fee percentage of the whole deposit, rounded half up to the cent."
      deposit_amount: "the card deposit fee is worked out for the most recent debit-card deposit on the account's ledger."
      size_rate: "a deposit of 10,000.00 USD or more has a size rate of 1.80 percent; a deposit of 2,500.00 USD up to 9,999.99 USD has a size rate of 2.20 percent; a smaller deposit has the plan's card deposit fee percentage as its size rate."
      card_total_3m: "A card-volume reduction is decided by the total of all debit-card deposits received in the three months before the day the fee is worked out, counted from the day after the same calendar day three months earlier up to and including that day"
      volume_points: "a total of 20,000.00 USD or more earns a card-volume reduction of 0.30 percentage points; a total of 10,000.00 USD up to 19,999.99 USD earns 0.15 percentage points; a smaller total earns none."
      card_count_3m: "A bank-funding reduction is decided by the deposits received in the same three months"
      ach_count_3m: "A bank-funding reduction is decided by the deposits received in the same three months"
      bank_points: "an account with three or more ACH credit deposits and no more than two debit-card deposits in that window earns a bank-funding reduction of 0.25 percentage points; an account with one or two ACH credit deposits and no more than two debit-card deposits earns 0.10 percentage points; any other account earns none."
      card_rate: "The card deposit rate is the size rate less the card-volume reduction and less the bank-funding reduction"
      approval_months: "The amount the rate is charged on depends on the whole months since KYB approval"
      card_fee: "an account approved at least 36 whole months earlier is charged on the part of the deposit above 1,000.00 USD; an account approved at least 12 and fewer than 36 whole months earlier is charged on the whole deposit, with the card deposit fee capped at 75.00 USD; every other account is charged on the whole deposit."
      result: "the card deposit fee is the charged amount times that rate over 100, under the cap where the charging method sets one, never below 0.00 and rounded half up to the cent."
    factors:
      - id: deposit_size_rate
        effect: parameter
        decides: size_rate
        bindings: [deposit_amount, size_rate]
        ladder:
          - when: "the most recent debit-card deposit is 10,000.00 USD or more"
            value: "K('rate_large') = 1.80 percent"
          - when: "that deposit is 2,500.00 USD up to 9,999.99 USD"
            value: "K('rate_mid') = 2.20 percent"
          - when: "otherwise"
            value: "P('card_deposit_fee_pct'), the plan's card deposit fee percentage"
        baseline:
          size_rate: "card_pct"
        evidence: [history]
        cross_difficulty: null
      - id: card_volume_reduction
        effect: parameter
        decides: volume_points
        bindings: [card_total_3m, volume_points]
        ladder:
          - when: "debit-card deposits in the three-month window total 20,000.00 USD or more"
            value: "K('volume_points_high') = 0.30 percentage points"
          - when: "they total 10,000.00 USD up to 19,999.99 USD"
            value: "K('volume_points_low') = 0.15 percentage points"
          - when: "otherwise"
            value: "0 percentage points"
        baseline:
          volume_points: "0"
        evidence: [history]
        cross_difficulty: null
      - id: bank_funding_reduction
        effect: parameter
        decides: bank_points
        bindings: [card_count_3m, ach_count_3m, bank_points]
        ladder:
          - when: "three or more ACH credit deposits and no more than two debit-card deposits in the three-month window"
            value: "K('bank_points_high') = 0.25 percentage points"
          - when: "one or two ACH credit deposits and no more than two debit-card deposits in the window"
            value: "K('bank_points_low') = 0.10 percentage points"
          - when: "otherwise"
            value: "0 percentage points"
        baseline:
          bank_points: "0"
        evidence: [history]
        cross_difficulty: null
      - id: card_fee_charging_method
        effect: method
        decides: card_fee
        bindings: [approval_months, card_fee]
        ladder:
          - when: "KYB approval at least 36 whole months earlier"
            method: "the rate is charged on the part of the deposit above 1,000.00 USD"
          - when: "KYB approval at least 12 and fewer than 36 whole months earlier"
            method: "the rate is charged on the whole deposit and the fee is capped at 75.00 USD"
          - when: "otherwise"
            method: "the rate is charged on the whole deposit"
        baseline:
          card_fee: "deposit_amount * card_rate / 100"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        A debit-card deposit carries a card deposit fee tied to its deposit reference, which the agent books as one
        deposit fee entry for the current billing period; the card deposit fee is worked out for the most recent
        debit-card deposit on the account's ledger.
        The standard card deposit fee is the plan's card deposit fee percentage of the whole deposit, rounded half up to
        the cent.
      params: [card_deposit_fee_pct]
    inputs:
      history:
        - {table: business_ledger, aggregate: latest, field: amount_usd, filters: {event_type: business_balance_deposited, deposit_method: debit_card}}
        - {table: business_ledger, aggregate: sum, field: amount_usd, within_months: 3, filters: {event_type: business_balance_deposited, deposit_method: debit_card}}
        - {table: business_ledger, aggregate: count, field: amount_usd, within_months: 3, filters: {event_type: business_balance_deposited, deposit_method: debit_card}}
        - {table: business_ledger, aggregate: count, field: amount_usd, within_months: 3, filters: {event_type: business_balance_deposited, deposit_method: ach_credit}}
      cross_category: []

  - id: business_ext_upgrade_proration_settlement
    base_policy_refs: [business_evt_plan_change]
    overwrite:
      - base_policy: business_evt_plan_change
        superseded_clause: >-
          On an upgrade from a plan whose upgrade_proration_enabled is true and whose subscription_fee for the current period was collected, the unused part of that fee is credited back as unused days over period days times the fee, rounded half up to the cent, where unused days run from the upgrade date to current_period_end inclusive; the higher plan's fee for the same unused days is charged at once as proration_charge, calculated the same way.
        replaced_by: >-
          The proration charge is the higher plan's part less the collected part, less the SWIFT rebate and less the upgrade deposit credit, never below 0.00 and rounded half up to the cent.
    trigger: state_due
    subject: [business_proration_credited]
    computes: amount_usd
    target_tool: settle_upgrade_proration_4280c277
    params:
      full_share_max_days_used: 3
      thirty_day_max_days_used: 10
      thirty_day_month: 30
      incentive_volume_high: 150000.00
      incentive_volume_low: 60000.00
      incentive_months_high: 24
      incentive_months_low: 12
      incentive_pct_high: 25
      incentive_pct_low: 10
      swift_tier_high: 75.00
      swift_tier_low: 40.00
      swift_pct_high: 20
      swift_pct_low: 10
      deposit_tier_high: 100000.00
      deposit_tier_low: 40000.00
      deposit_credit_high: 20.00
      deposit_credit_low: 8.00
    rule: >-
      An upgrade takes effect on the day it is made. When an account moves up from a plan that allows upgrade
      proration inside a billing period whose subscription charge was collected on the lower plan, the agent settles
      the proration of that period as one proration charge entry for the current billing period.
      The standard proration charge is the higher plan's monthly fee times the unused days over the period's days,
      rounded half up to the cent, less the subscription charge collected for the current billing period times the
      unused days over the period's days, rounded half up to the cent, never below 0.00, the unused days running from
      the upgrade date to the last day of the period, both days included.
      The share of the period settled depends on the billing cycle and on the days of the period used before the
      upgrade, counted from the first day of the period up to the day before the upgrade: a monthly-billed account that
      used three days or fewer settles the whole period, so the share is one; a monthly-billed account that used four
      to ten days settles the unused days over a 30-day month; every other account settles the unused days over the
      period's days.
      An upgrade incentive, a percentage off the higher plan's part, is decided by the payout principal debited from
      the balance in the three months before the day the proration is settled, counted from the day after the same
      calendar day three months earlier up to and including that day, and by the whole months since KYB approval:
      150,000.00 USD or more with approval at least 24 whole months earlier earns an upgrade incentive of 25 percent;
      60,000.00 USD or more with approval at least 12 whole months earlier, not meeting both first-tier conditions,
      earns 10 percent; anything else
      earns no upgrade incentive.
      A SWIFT rebate is decided by the SWIFT payout fees taken from the balance in the same three months: fees of 75.00
      USD or more are rebated at 20 percent of their total; fees of 40.00 USD up to 74.99 USD at 10 percent of their
      total; smaller totals are not rebated; the SWIFT rebate is rounded half up to the cent.
      An upgrade deposit credit is decided by the deposits made to the balance in the same three months: deposits
      totalling 100,000.00 USD or more earn an upgrade deposit credit of 20.00 USD; deposits totalling 40,000.00 USD
      up to 99,999.99 USD earn 8.00 USD; smaller totals earn none.
      The higher plan's part is the higher plan's monthly fee times the settled share, reduced by the upgrade incentive
      and rounded half up to the cent; the collected part is the subscription charge collected for the current
      billing period times the settled share, rounded half up to the cent.
      The proration charge is the higher plan's part less the collected part, less the SWIFT rebate and less the
      upgrade deposit credit, never below 0.00 and rounded half up to the cent.
    prerequisite: []
    cross_category: []
    compute:
      - higher_fee: "P('monthly_fee_usd')"
      - collected_charge: "SUM('business_ledger', 'amount_usd', event_type='business_fee_charged', fee_type='subscription_fee', billing_period_start=F('current_period_start'))"
      - unused_days: "DAYS(F('plan_effective_date'), F('current_period_end')) + 1"
      - period_days: "DAYS(F('current_period_start'), F('current_period_end')) + 1"
      - days_used: "DAYS(F('current_period_start'), F('plan_effective_date'))"
      - settled_share: "1 if (F('billing_cycle') == 'monthly' and days_used <= K('full_share_max_days_used')) else ((unused_days / K('thirty_day_month')) if (F('billing_cycle') == 'monthly' and days_used <= K('thirty_day_max_days_used')) else (unused_days / period_days))"
      - payout_volume_3m: "SUM('business_ledger', 'amount_usd', within_months=3, date_field='entry_date', event_type='business_payout_debited')"
      - approval_months: "MONTHS(F('kyb_approved_date'), NOW)"
      - incentive_pct: "K('incentive_pct_high') if (payout_volume_3m >= K('incentive_volume_high') and approval_months >= K('incentive_months_high')) else (K('incentive_pct_low') if ((payout_volume_3m >= K('incentive_volume_low') and approval_months >= K('incentive_months_low')) and (payout_volume_3m < K('incentive_volume_high') or approval_months < K('incentive_months_high'))) else 0)"
      - swift_fees_3m: "SUM('business_ledger', 'amount_usd', within_months=3, date_field='entry_date', event_type='business_fee_charged', fee_type='swift_payout_fee')"
      - swift_pct: "K('swift_pct_high') if swift_fees_3m >= K('swift_tier_high') else (K('swift_pct_low') if swift_fees_3m >= K('swift_tier_low') else 0)"
      - swift_rebate: "RND(swift_fees_3m * swift_pct / 100, 2)"
      - deposits_3m: "SUM('business_ledger', 'amount_usd', within_months=3, date_field='entry_date', event_type='business_balance_deposited')"
      - deposit_credit: "K('deposit_credit_high') if deposits_3m >= K('deposit_tier_high') else (K('deposit_credit_low') if deposits_3m >= K('deposit_tier_low') else 0)"
      - higher_part: "RND(higher_fee * settled_share * (100 - incentive_pct) / 100, 2)"
      - collected_part: "RND(collected_charge * settled_share, 2)"
      - result: "RND(MX(0, higher_part - collected_part - swift_rebate - deposit_credit), 2)"
    compute_basis:
      higher_fee: "The standard proration charge is the higher plan's monthly fee times the unused days over the period's days, rounded half up to the cent"
      collected_charge: "less the subscription charge collected for the current billing period times the unused days over the period's days, rounded half up to the cent"
      unused_days: "the unused days running from the upgrade date to the last day of the period, both days included."
      period_days: "every other account settles the unused days over the period's days."
      days_used: "the days of the period used before the upgrade, counted from the first day of the period up to the day before the upgrade"
      settled_share: "a monthly-billed account that used three days or fewer settles the whole period, so the share is one; a monthly-billed account that used four to ten days settles the unused days over a 30-day month; every other account settles the unused days over the period's days."
      payout_volume_3m: "the payout principal debited from the balance in the three months before the day the proration is settled, counted from the day after the same calendar day three months earlier up to and including that day"
      approval_months: "and by the whole months since KYB approval"
      incentive_pct: "150,000.00 USD or more with approval at least 24 whole months earlier earns an upgrade incentive of 25 percent; 60,000.00 USD or more with approval at least 12 whole months earlier, not meeting both first-tier conditions, earns 10 percent; anything else earns no upgrade incentive."
      swift_fees_3m: "A SWIFT rebate is decided by the SWIFT payout fees taken from the balance in the same three months"
      swift_pct: "fees of 75.00 USD or more are rebated at 20 percent of their total; fees of 40.00 USD up to 74.99 USD at 10 percent of their total; smaller totals are not rebated"
      swift_rebate: "the SWIFT rebate is rounded half up to the cent."
      deposits_3m: "An upgrade deposit credit is decided by the deposits made to the balance in the same three months"
      deposit_credit: "deposits totalling 100,000.00 USD or more earn an upgrade deposit credit of 20.00 USD; deposits totalling 40,000.00 USD up to 99,999.99 USD earn 8.00 USD; smaller totals earn none."
      higher_part: "The higher plan's part is the higher plan's monthly fee times the settled share, reduced by the upgrade incentive and rounded half up to the cent"
      collected_part: "the collected part is the subscription charge collected for the current billing period times the settled share, rounded half up to the cent."
      result: "The proration charge is the higher plan's part less the collected part, less the SWIFT rebate and less the upgrade deposit credit, never below 0.00 and rounded half up to the cent."
    factors:
      - id: settled_share_method
        effect: method
        decides: settled_share
        bindings: [unused_days, period_days, days_used, settled_share]
        ladder:
          - when: "monthly billing and three days or fewer of the period used before the upgrade"
            method: "the whole period is settled: the share is one"
          - when: "monthly billing and four to ten days of the period used before the upgrade"
            method: "the unused days over a 30-day month"
          - when: "otherwise"
            method: "the unused days over the period's days"
        baseline:
          settled_share: "unused_days / period_days"
        evidence: [date]
        cross_difficulty: null
      - id: upgrade_incentive
        effect: parameter
        decides: incentive_pct
        bindings: [payout_volume_3m, approval_months, incentive_pct]
        ladder:
          - when: "payout principal of the three-month window 150,000.00 USD or more and KYB approval at least 24 whole months earlier"
            value: "K('incentive_pct_high') = 25 percent"
          - when: "payout principal 60,000.00 USD or more and KYB approval at least 12 whole months earlier, without meeting both first-tier conditions"
            value: "K('incentive_pct_low') = 10 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          incentive_pct: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: swift_rebate_rate
        effect: parameter
        decides: swift_pct
        bindings: [swift_fees_3m, swift_pct, swift_rebate]
        ladder:
          - when: "SWIFT payout fees of the three-month window total 75.00 USD or more"
            value: "K('swift_pct_high') = 20 percent of that total"
          - when: "they total 40.00 USD up to 74.99 USD"
            value: "K('swift_pct_low') = 10 percent of that total"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          swift_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: upgrade_deposit_credit
        effect: parameter
        decides: deposit_credit
        bindings: [deposits_3m, deposit_credit]
        ladder:
          - when: "deposits of the three-month window total 100,000.00 USD or more"
            value: "K('deposit_credit_high') = 20.00 USD"
          - when: "they total 40,000.00 USD up to 99,999.99 USD"
            value: "K('deposit_credit_low') = 8.00 USD"
          - when: "otherwise"
            value: "0.00 USD"
        baseline:
          deposit_credit: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard proration charge is the higher plan's monthly fee times the unused days over the period's days,
        rounded half up to the cent, less the subscription charge collected for the current billing period times the
        unused days over the period's days, rounded half up to the cent, never below 0.00, the unused days running from
        the upgrade date to the last day of the period, both days included.
      params: [monthly_fee_usd]
    inputs:
      history:
        - {table: business_ledger, aggregate: sum, field: amount_usd, filters: {event_type: business_fee_charged, fee_type: subscription_fee}}
        - {table: business_ledger, aggregate: sum, field: amount_usd, within_months: 3, filters: {event_type: business_payout_debited}}
        - {table: business_ledger, aggregate: sum, field: amount_usd, within_months: 3, filters: {event_type: business_fee_charged, fee_type: swift_payout_fee}}
        - {table: business_ledger, aggregate: sum, field: amount_usd, within_months: 3, filters: {event_type: business_balance_deposited}}
      cross_category: []

  - id: business_ext_withdrawable_balance
    base_policy_refs: [business_agg_entity_separation, business_evt_balance]
    overwrite:
      - base_policy: business_evt_balance
        superseded_clause: >-
          it may not exceed the available balance less charges still owed.
        replaced_by: >-
          The withdrawable amount is the balance less the ACH deposit held back, less the standing reserve, less the next-charge reserve, less the withdrawal fee when the period's free withdrawals are already used, never below 0.00 and rounded half up to the cent.
    trigger: on_request
    subject: [business_balance_withdrawn]
    computes: amount_usd
    target_tool: withdraw_business_balance_ad66ed9d
    params:
      busy_payouts_3m: 12
      hold_free_months: 36
      hold_free_ach: 6
      hold_day_months: 12
      hold_day_ach: 2
      rate_high: 5
      rate_one_return: 3
      rate_standing: 1
      next_full_days: 7
      next_half_days: 14
      relief_pct_high: 50
      relief_pct_low: 25
    rule: >-
      When the owner withdraws the whole withdrawable amount of the business balance, the withdrawal goes to the
      business's verified US bank account and is booked as one withdrawal for the current billing period, numbered
      after the period's earlier withdrawals.
      The withdrawable amount is not worked out until the balance carries an extra seat fee for every user added in
      the past month while more users were active than the plan includes.
      The withdrawable amount is worked out only after an upgrade that took effect inside the current billing period
      carries its proration charge on the balance.
      Before the withdrawable amount is worked out, the most recent debit-card deposit must carry its deposit fee on the balance.
      The standard withdrawable amount is the balance, less the most recent ACH credit deposit while fewer calendar
      days than the plan's ACH hold days have passed since it was received, less a standing reserve of 1 percent of
      the payout principal debited in the three months before the day of the withdrawal, counted from the day after
      the same calendar day three months earlier up to and including that day, the standing reserve being rounded up
      to the cent, less the plan's withdrawal fee when the period's free withdrawals are already used, never below
      0.00 and rounded half up to the cent.
      The reserve basis depends on the payouts submitted in those three months: an account that submitted 12 or more
      payouts in that window has its standing reserve based on the payout principal debited in the month before the
      day of the withdrawal, counted from the day after the same calendar day one month earlier; an account that
      submitted no payout in that window has it based on the payout principal debited in the six months before that
      day, counted the same way; every other account has it based on the payout principal of the three months.
      How ACH credit deposits are held back depends on the whole months since KYB approval and on the ACH credit
      deposits received in the twelve months before the day of the withdrawal, counted the same way: an account
      approved at least 36 whole months earlier with six or more ACH credit deposits in that window has nothing held
      back; an account approved at least 12 whole months earlier with two or more ACH credit deposits in that window
      that does not meet both of those conditions has the most recent ACH credit deposit held back only on the day it
      is received; every other account has the most recent ACH credit deposit held back while fewer calendar days than
      the plan's ACH hold days have passed since it was received.
      The reserve rate is decided by the payouts returned in the twelve months before the day of the withdrawal,
      counted the same way: two or more returned payouts set a reserve rate of 5 percent; exactly one sets 3 percent;
      none keeps the standing rate of 1 percent.
      A reserve relief, a percentage off the standing reserve, is decided by the owner's Personal Sender Account: an
      account active at Paloma Enhanced, Paloma Premier or Paloma Private Client earns a reserve relief of 50 percent;
      an account active at Paloma Verified Plus earns 25 percent; every other owner earns none.
      A next-charge reserve is kept back for the subscription charge of the next billing period, decided by the
      calendar days from the day of the withdrawal to the next billing day, the day after the last day of the current
      period: 7 days or fewer keep back the plan's monthly fee; 8 to 14 days keep back half the plan's monthly fee,
      rounded half up to the cent; more than 14 days keep back nothing.
      The standing reserve is the reserve rate times the reserve basis, reduced by the reserve relief, rounded up to
      the cent.
      The withdrawable amount is the balance less the ACH deposit held back, less the standing reserve, less the
      next-charge reserve, less the withdrawal fee when the period's free withdrawals are already used, never below
      0.00 and rounded half up to the cent.
    prerequisite:
      - problem: business_ext_mid_period_seat_charge
        kind: value_input
        gate: balance_now
        form: state
        policy_source: >-
          The withdrawable amount is not worked out until the balance carries an extra seat fee for every user added in the past month while more users were active than the plan includes.
        condition: >-
          The ledger carries an extra seat fee entry for the current billing period covering the users added in the past month beyond the included seats, and the balance reflects it.
        resolved_by: charge_extra_seats_0d292d98
        effect: >-
          Booking the extra seat charge takes it off the balance, so the balance the withdrawable amount starts from falls by that charge.
      - problem: business_ext_upgrade_proration_settlement
        kind: value_input
        gate: balance_now
        form: state
        policy_source: >-
          The withdrawable amount is worked out only after an upgrade that took effect inside the current billing period carries its proration charge on the balance.
        condition: >-
          The ledger carries a proration charge entry for the current billing period of an account whose plan took effect inside that period, and the balance reflects it.
        resolved_by: settle_upgrade_proration_4280c277
        effect: >-
          Booking the proration charge takes it off the balance, so the balance the withdrawable amount starts from falls by that charge.
      - problem: business_ext_card_deposit_fee
        kind: value_input
        gate: balance_now
        form: state
        policy_source: >-
          Before the withdrawable amount is worked out, the most recent debit-card deposit must carry its deposit fee on the balance.
        condition: >-
          The most recent debit-card deposit on the ledger has a deposit fee entry tied to its deposit reference, and the balance reflects it.
        resolved_by: charge_card_deposit_fee_e69fd8f7
        effect: >-
          Booking the card deposit fee takes it off the balance, so the balance the withdrawable amount starts from falls by that fee.
    cross_category:
      - category: account
        as: branch
        reads: [level_number, status]
        note: The reserve relief is decided from the level and status of the owner's Personal Sender Account.
    compute:
      - balance_now: "F('balance_usd')"
      - monthly_fee: "P('monthly_fee_usd')"
      - payouts_3m_count: "COUNT('business_payouts', within_months=3, date_field='event_date', event_type='business_payout_submitted')"
      - principal_1m: "SUM('business_ledger', 'amount_usd', within_months=1, date_field='entry_date', event_type='business_payout_debited')"
      - principal_3m: "SUM('business_ledger', 'amount_usd', within_months=3, date_field='entry_date', event_type='business_payout_debited')"
      - principal_6m: "SUM('business_ledger', 'amount_usd', within_months=6, date_field='entry_date', event_type='business_payout_debited')"
      - reserve_basis: "principal_1m if payouts_3m_count >= K('busy_payouts_3m') else (principal_6m if payouts_3m_count == 0 else principal_3m)"
      - approval_months: "MONTHS(F('kyb_approved_date'), NOW)"
      - ach_12m: "COUNT('business_ledger', within_months=12, date_field='entry_date', event_type='business_balance_deposited', deposit_method='ach_credit')"
      - latest_ach_amount: "LATEST('business_ledger', 'amount_usd', date_field='entry_date', event_type='business_balance_deposited', deposit_method='ach_credit') or 0"
      - latest_ach_date: "LATEST('business_ledger', 'entry_date', date_field='entry_date', event_type='business_balance_deposited', deposit_method='ach_credit')"
      - ach_age_days: "DAYS(latest_ach_date, NOW) if latest_ach_date else 9999"
      - ach_held: "0 if (approval_months >= K('hold_free_months') and ach_12m >= K('hold_free_ach')) else ((latest_ach_amount * (ach_age_days == 0)) if ((approval_months >= K('hold_day_months') and ach_12m >= K('hold_day_ach')) and (approval_months < K('hold_free_months') or ach_12m < K('hold_free_ach'))) else (latest_ach_amount * (ach_age_days < P('ach_deposit_hold_business_days'))))"
      - returns_12m: "COUNT('business_payouts', within_months=12, date_field='event_date', event_type='business_payout_returned')"
      - reserve_rate: "K('rate_high') if returns_12m >= 2 else (K('rate_one_return') if returns_12m == 1 else K('rate_standing'))"
      - personal_level: "CPARAM('account', 'level_number') or 0"
      - personal_status: "CFIELD('account', 'status')"
      - relief_pct: "K('relief_pct_high') if (personal_level >= 4 and personal_status == 'active') else (K('relief_pct_low') if (personal_level == 3 and personal_status == 'active') else 0)"
      - standing_reserve: "(-((-(reserve_basis * reserve_rate / 100 * (100 - relief_pct) / 100 * 100)) // 1)) / 100"
      - days_to_billing: "DAYS(NOW, F('current_period_end')) + 1"
      - next_reserve: "monthly_fee if days_to_billing <= K('next_full_days') else (RND(monthly_fee / 2, 2) if days_to_billing <= K('next_half_days') else 0)"
      - withdrawals_in_period: "COUNT('business_ledger', event_type='business_balance_withdrawn', billing_period_start=F('current_period_start'))"
      - withdrawal_fee: "P('withdrawal_fee_usd') if withdrawals_in_period >= P('free_withdrawals_per_period') else 0"
      - result: "RND(MX(0, balance_now - ach_held - standing_reserve - next_reserve - withdrawal_fee), 2)"
    compute_basis:
      balance_now: "The standard withdrawable amount is the balance"
      monthly_fee: "7 days or fewer keep back the plan's monthly fee; 8 to 14 days keep back half the plan's monthly fee, rounded half up to the cent"
      payouts_3m_count: "The reserve basis depends on the payouts submitted in those three months"
      principal_1m: "has its standing reserve based on the payout principal debited in the month before the day of the withdrawal, counted from the day after the same calendar day one month earlier"
      principal_3m: "a standing reserve of 1 percent of the payout principal debited in the three months before the day of the withdrawal, counted from the day after the same calendar day three months earlier up to and including that day"
      principal_6m: "has it based on the payout principal debited in the six months before that day, counted the same way"
      reserve_basis: "an account that submitted 12 or more payouts in that window has its standing reserve based on the payout principal debited in the month before the day of the withdrawal, counted from the day after the same calendar day one month earlier; an account that submitted no payout in that window has it based on the payout principal debited in the six months before that day, counted the same way; every other account has it based on the payout principal of the three months."
      approval_months: "How ACH credit deposits are held back depends on the whole months since KYB approval"
      ach_12m: "the ACH credit deposits received in the twelve months before the day of the withdrawal, counted the same way"
      latest_ach_amount: "less the most recent ACH credit deposit while fewer calendar days than the plan's ACH hold days have passed since it was received"
      latest_ach_date: "less the most recent ACH credit deposit while fewer calendar days than the plan's ACH hold days have passed since it was received"
      ach_age_days: "fewer calendar days than the plan's ACH hold days have passed since it was received"
      ach_held: "an account approved at least 36 whole months earlier with six or more ACH credit deposits in that window has nothing held back; an account approved at least 12 whole months earlier with two or more ACH credit deposits in that window that does not meet both of those conditions has the most recent ACH credit deposit held back only on the day it is received; every other account has the most recent ACH credit deposit held back while fewer calendar days than the plan's ACH hold days have passed since it was received."
      returns_12m: "The reserve rate is decided by the payouts returned in the twelve months before the day of the withdrawal, counted the same way"
      reserve_rate: "two or more returned payouts set a reserve rate of 5 percent; exactly one sets 3 percent; none keeps the standing rate of 1 percent."
      personal_level: "A reserve relief, a percentage off the standing reserve, is decided by the owner's Personal Sender Account"
      personal_status: "A reserve relief, a percentage off the standing reserve, is decided by the owner's Personal Sender Account"
      relief_pct: "an account active at Paloma Enhanced, Paloma Premier or Paloma Private Client earns a reserve relief of 50 percent; an account active at Paloma Verified Plus earns 25 percent; every other owner earns none."
      standing_reserve: "The standing reserve is the reserve rate times the reserve basis, reduced by the reserve relief, rounded up to the cent."
      days_to_billing: "the calendar days from the day of the withdrawal to the next billing day, the day after the last day of the current period"
      next_reserve: "7 days or fewer keep back the plan's monthly fee; 8 to 14 days keep back half the plan's monthly fee, rounded half up to the cent; more than 14 days keep back nothing."
      withdrawals_in_period: "less the plan's withdrawal fee when the period's free withdrawals are already used"
      withdrawal_fee: "less the plan's withdrawal fee when the period's free withdrawals are already used"
      result: "The withdrawable amount is the balance less the ACH deposit held back, less the standing reserve, less the next-charge reserve, less the withdrawal fee when the period's free withdrawals are already used, never below 0.00 and rounded half up to the cent."
    factors:
      - id: reserve_basis_window
        effect: method
        decides: reserve_basis
        bindings: [payouts_3m_count, principal_1m, principal_6m, reserve_basis]
        ladder:
          - when: "12 or more payouts submitted in the three months before the day of the withdrawal"
            method: "the standing reserve is based on the payout principal debited in the past month"
          - when: "no payout submitted in those three months"
            method: "the standing reserve is based on the payout principal debited in the past six months"
          - when: "otherwise"
            method: "the standing reserve is based on the payout principal debited in the past three months"
        baseline:
          reserve_basis: "principal_3m"
        evidence: [history]
        cross_difficulty: null
      - id: ach_hold_method
        effect: method
        decides: ach_held
        bindings: [approval_months, ach_12m, latest_ach_date, ach_age_days, ach_held]
        ladder:
          - when: "KYB approval at least 36 whole months earlier and six or more ACH credit deposits in the twelve-month window"
            method: "nothing is held back"
          - when: "KYB approval at least 12 whole months earlier and two or more ACH credit deposits in the window, without meeting both first-tier conditions"
            method: "the most recent ACH credit deposit is held back only on the day it is received"
          - when: "otherwise"
            method: "the most recent ACH credit deposit is held back while fewer calendar days than the plan's ACH hold days have passed since it was received"
        baseline:
          ach_held: "latest_ach_amount * (ach_age_days < P('ach_deposit_hold_business_days'))"
        evidence: [history, date]
        cross_difficulty: null
      - id: reserve_rate_by_returns
        effect: parameter
        decides: reserve_rate
        bindings: [returns_12m, reserve_rate]
        ladder:
          - when: "two or more payouts returned in the twelve-month window"
            value: "K('rate_high') = 5 percent"
          - when: "exactly one payout returned in the twelve-month window"
            value: "K('rate_one_return') = 3 percent"
          - when: "otherwise"
            value: "K('rate_standing') = 1 percent, the standing rate"
        baseline:
          reserve_rate: "K('rate_standing')"
        evidence: [history]
        cross_difficulty: null
      - id: personal_reserve_relief
        effect: parameter
        decides: relief_pct
        bindings: [personal_level, personal_status, relief_pct]
        ladder:
          - when: "the owner's Personal Sender Account is active at Paloma Enhanced, Paloma Premier or Paloma Private Client"
            value: "K('relief_pct_high') = 50 percent"
          - when: "the owner's Personal Sender Account is active at Paloma Verified Plus"
            value: "K('relief_pct_low') = 25 percent"
          - when: "otherwise"
            value: "0 percent"
        baseline:
          relief_pct: "0"
        evidence: [cross_category]
        cross_difficulty: account
      - id: next_charge_reserve
        effect: parameter
        decides: next_reserve
        bindings: [days_to_billing, next_reserve]
        ladder:
          - when: "7 calendar days or fewer from the day of the withdrawal to the next billing day"
            value: "P('monthly_fee_usd'), the plan's monthly fee"
          - when: "8 to 14 calendar days to the next billing day"
            value: "half the plan's monthly fee, rounded half up to the cent"
          - when: "otherwise"
            value: "0.00 USD"
        baseline:
          next_reserve: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard withdrawable amount is the balance, less the most recent ACH credit deposit while fewer calendar
