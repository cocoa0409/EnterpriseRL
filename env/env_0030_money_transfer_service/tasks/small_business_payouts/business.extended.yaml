        - {table: business_ledger, aggregate: sum, field: amount_usd, within_months: 1, filters: {event_type: business_payout_debited}}
        - {table: business_ledger, aggregate: sum, field: amount_usd, within_months: 3, filters: {event_type: business_payout_debited}}
        - {table: business_ledger, aggregate: sum, field: amount_usd, within_months: 6, filters: {event_type: business_payout_debited}}
        - {table: business_ledger, aggregate: count, field: amount_usd, within_months: 12, filters: {event_type: business_balance_deposited, deposit_method: ach_credit}}
        - {table: business_ledger, aggregate: latest, field: amount_usd, filters: {event_type: business_balance_deposited, deposit_method: ach_credit}}
        - {table: business_payouts, aggregate: count, field: payout_reference, within_months: 12, filters: {event_type: business_payout_returned}}
        - {table: business_ledger, aggregate: count, field: amount_usd, filters: {event_type: business_balance_withdrawn}}
