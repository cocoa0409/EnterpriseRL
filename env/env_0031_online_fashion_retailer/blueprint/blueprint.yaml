name: env_0031_online_fashion_retailer
company: Marlowe & Finch

background: |
  Marlowe & Finch is a US online apparel and footwear retailer founded in Columbus, Ohio in 2011 that sells women's, men's and kids' clothing, shoes and accessories from about 340 brands alongside its own Marlowe & Finch label, exclusively through its website and app.
  It serves roughly 3.6 million active customers in all 50 states and DC from fulfilment centres in Groveport, Ohio and Reno, Nevada, and its customer care team answers by chat, email and phone in a warm, precise and unhurried voice.
  Every customer holds a single Marlowe & Finch profile, and everything they hold or do with the company hangs off that profile.
  Online Orders are the core contract: each order is placed with one delivery service — Economy Ground, Pickup Point Delivery, Standard Ground, Expedited 2-Day, Next Business Day or Same-Day Courier — and is booked line by line, captured tender by tender at dispatch, and adjusted afterwards by cancellations, price adjustments and late promotion codes.
  Marlowe Rewards is the free loyalty programme, held as one membership per customer at Marlowe Rewards Member, Silver, Gold, Platinum, Icon or Atelier, whose points ledger earns on dispatched orders, gives back on refunds and converts into Marlowe Rewards Notes.
  Marlowe & Finch Unlimited is the paid free-shipping membership, sold as Unlimited Standard Monthly, Unlimited Student Annual, Unlimited Standard Annual, Unlimited Express Monthly, Unlimited Express Annual and Unlimited Next-Day Annual, with its fees, refunds and benefit uses booked on its own ledger.
  Returns & Exchanges are opened as return authorizations against delivered orders — Standard Return, Store Credit Return, Size Exchange, Instant Exchange, Gift Return or Quality Issue Return — and each carries its returned lines, inspection grades, fees, refunds, exchange shipments and card holds.
  Gift Cards & Store Credit covers every stored-value instrument a customer can hold: the Marlowe & Finch e-Gift Card, the plastic Marlowe & Finch Gift Card, the holiday Bonus Gift Card, Return Store Credit, Goodwill Credit and the Marlowe Rewards Note, each with its own balance built from loads, spending, refunds and transfers.
  Pre-Orders & Back-Orders hold reservations for items that cannot ship yet — Standard Back-Order, Supplier Direct Back-Order, Seasonal Pre-Order, Launch Pre-Order, Deposit Pre-Order and Made-to-Order Reservation — each with a promised ship-by date, any deposit and a history of delay notices.
  Delivery Claims are the cases customers open when a parcel is late, never arrives, arrives damaged, arrives short or arrives with the wrong item: the Late Delivery Claim, Delivered Not Received Claim, Lost in Transit Claim, Damaged in Transit Claim, Missing Item Claim and Wrong Item Claim, each carrying its evidence, carrier trace and compensation.
  Behind these sit the carriers Marlowe & Finch ships with — USPS, UPS and Roadie — and the brands that drop-ship supplier-direct items and build made-to-order footwear.
  Most callers are adults between twenty and fifty-five who shop several times a season, and a typical profile holds a Marlowe Rewards membership, two to six orders from the past year, a return or two and some store credit or a gift card balance.
  Frequent shoppers often add an Unlimited plan, and sneaker and designer fans keep launch or deposit reservations open alongside their everyday orders.
  Gift givers buy gift cards and gift-flagged orders, and their recipients call with their own profiles to return or spend what they received.
  The calls that reach customer care are about returns that are late, partly rejected or refunded differently than expected; points that did not post, went pending or were taken back; gift cards that were lost, drained or are down to a few dollars; reservations that slipped past their date; and parcels that went missing, arrived broken or never matched the order.
  Customers usually arrive with a long event history across these holdings, and the same order often touches loyalty points, store credit, a return and a claim at once.
logs:
  verification_log_table: identity_verifications
  handoff_log_table: human_handoffs

difficulties:
  - name: loyalty_points_and_rewards
    claim:
      categories: [loyalty]
      event_types: [loyalty_enrolled, loyalty_points_earned, loyalty_bonus_posted, loyalty_points_reversed, loyalty_reward_issued, loyalty_points_forfeited, loyalty_tier_changed, loyalty_suspended, loyalty_closed]
    summary: >
      Members of every Marlowe Rewards tier call about their points and status: a dispatched order
      whose points never posted or are still pending, a birthday, review, referral or goodwill bonus
      they expected, points taken back after a return, a tier they believe they reached or should not
      have lost at the annual review, a Rewards Note that did or did not issue, points that vanished
      after inactivity, a suspected account takeover, or a wish to leave the programme; the setting
      varies by tier held, membership status (active, suspended, closed), enrollment tenure, and a
      points ledger that interleaves earnings, reversals, conversions and forfeitures across many
      orders. The records involved are the membership and its loyalty_ledger rows, read together with
      the customer's date of birth, the orders and their dispatch and placed dates, the returns whose
      refunds triggered reversals, and the delivery claims that document a service failure; the rules
      are per tier — earning multipliers and rounding (loyalty_evt_points_earning), missing-points
      windows and ownership (loyalty_evt_missing_points), reversal at the original multiplier
      (loyalty_evt_points_reversal), conversion blocks and note validity
      (loyalty_evt_reward_conversion), bonus eligibility and caps (loyalty_evt_bonus_points,
      loyalty_evt_goodwill_points), inactivity and closure forfeiture (loyalty_evt_points_forfeiture),
      and spend-based upgrades with a one-level annual soft landing (loyalty_tier_qualification) — and
      in the natural course of the business an order earns at dispatch, its points become available
      after the pending period, conversions run nightly and tiers move on spend and at review. The
      agent posts missing-points adjustments, goodwill and other bonuses, reversals, tier corrections
      and takeover suspensions on a verified account and records a closure request, while only the
      member can confirm the closure of their own membership, so that step is handed to the customer
      as a user action under loyalty_closure. Requests no rule decides — moving or pooling points
      between profiles or households, matching a tier from another retailer's programme, restoring
      points already forfeited as an exception, or overturning a suspension the review team placed —
      have no policy path and go to a human representative as POLICY_NOT_COVERED.

  - name: returns_and_exchanges
    claim:
      categories: [returns]
      event_types: [returns_authorized, returns_line_authorized, returns_fee_assessed, returns_refund_credited, returns_refund_issued, returns_instant_credit_reversed, returns_exchange_shipped, returns_hold_placed, returns_hold_released, returns_hold_captured, returns_settled, returns_cancelled, returns_deadline_extended, returns_method_changed]
    summary: >
      Customers call to start, change or chase returns and exchanges: a purchaser returning part of an
      order near the end of its window, a gift recipient returning under their own profile, a shopper
      who wants another size now rather than after the parcel arrives, someone whose sneakers came back
      graded B or without their box, or someone whose instant store credit was partly taken back; the
      setting varies with the return type, the order's delivered date and holiday timing, the
      customer's Marlowe Rewards tier and Unlimited plan, the order's tenders (card, gift cards,
      store credit, Rewards Notes), and earlier returns already open or settled on the same lines. The
      records are the return case with its return_lines and return_settlements, read against the
      order, its booked lines with their discounts and adjustments, its payment captures and refunds,
      the credit instruments it was paid with, and the loyalty and pass holdings that change windows
      and fees; the governing rules are the window and eligibility gates (returns_authorization),
      per-order quantity caps (returns_agg_order_quantity), method fees and their waivers
      (returns_evt_method_fee), grade-based restocking and box fees per return type
      (returns_evt_inspection_restocking), refund value, tax proration and tender routing
      (returns_evt_refund_settlement), instant-credit reconciliation (returns_evt_instant_credit),
      exchange and card-hold rules (returns_evt_exchange), deadline extension and expiry
      (returns_evt_deadline), and the quality and gift paths (returns_evt_quality_issue,
      returns_evt_gift_return) — and in the natural course of the business a return is authorized,
      scanned, received, inspected and then settled. The agent authorizes, amends, extends, cancels and
      settles returns, books fees, refunds, recoveries and exchange shipments on a verified account,
      while the card hold behind an Instant Exchange rests on the customer's own consent and is
      handed to the customer as a user action. Requests outside every rule — returning goods bought
      from another retailer or a marketplace seller, refunding to a card that was never used on the
      order, reversing a posted inspection grade, or compensating for a missed occasion — cannot be
      decided by policy and go to a human representative as POLICY_NOT_COVERED.

  - name: gift_cards_and_store_credit
    claim:
      categories: [credit]
      event_types: [credit_issued, credit_loaded, credit_refunded_to_instrument, credit_clawed_back, credit_transferred_out, credit_cashed_out, credit_locked, credit_unlocked, credit_replaced, credit_reactivated, credit_closed_by_customer, credit_registered]
    summary: >
      Holders of stored value call about their balances: a purchaser whose plastic gift card was lost
      or stolen, a recipient who wants to register a card they were given, someone whose Return Store
      Credit shrank after a return inspection, a member whose refunded order was paid with a Rewards
      Note that has since expired, a customer with several small balances who wants them combined or
      paid out in cash, or a holiday shopper whose Bonus Gift Card disappeared after a refund; the
      setting varies with the instrument type, its status (pending activation, active, locked,
      depleted, expired, closed), whether it is a bearer card or account-bound, who registered or
      bought it, the holder's billing state and the instrument's spend history. The records are the
      credit instrument and its credit_transactions, read with the order lines that bought a card,
      the orders and returns that spent or refunded value, the loyalty conversion rows behind notes,
      and the delivery claims behind goodwill; the rules are issue channels and expiry
      (credit_issuance), redemption limits per type (credit_agg_redemption_stacking), refunds back to
      the instrument and the expired-instrument fallbacks per type (credit_evt_refund_to_instrument),
      locking, settlement wait, ownership proof and replacement limits (credit_evt_lost_stolen),
      state-law cash-out and consolidation (credit_evt_cash_out), expiry forfeiture
      (credit_evt_expiry), clawbacks (credit_evt_clawback), bonus and goodwill issuance
      (credit_evt_bonus_promotion, credit_evt_goodwill_issue) and status housekeeping
      (credit_lifecycle_balance) — and in the natural course of the business an instrument is issued,
      activated, spent, refunded, and finally depleted, expired, replaced or closed. The agent locks,
      unlocks, replaces, registers, refunds to and claws back from instruments on a verified account
      and records cash-out or consolidation requests, while disposing of a balance by cash-out or
      consolidation is the holder's own decision, handed to the customer as a user action. Requests no
      rule covers — refunding a gift card bought from an unauthorized reseller, recovering value a
      scammer drained before the card was reported, issuing credit outside its channel, or extending an
      expiry date as a favour — have no policy path and go to a human representative as
      POLICY_NOT_COVERED.

  - name: preorders_and_backorders
    claim:
      categories: [preorders]
      event_types: [preorders_reserved, preorders_deposit_captured, preorders_deposit_refunded, preorders_deposit_forfeited, preorders_delay_consented, preorders_cancelled, preorders_production_cancelled, preorders_price_lowered, preorders_size_changed, preorders_specs_confirmed]
    summary: >
      Customers with reservations call when the wait does not go as promised: a back-order whose date
      slipped once or twice, a launch reservation they want to place during early access or that they
      fear will not be allocated, a designer deposit they want back, a made-to-order pair whose
      personalisation they still need to confirm or that they regret after production started, a
      seasonal piece whose price has since dropped, or a size they want to change; the setting varies
      with the reservation type, its status (reserved, awaiting consent, in production, allocated),
      its original and current ship-by dates, the number and kind of delay notices already sent, any
      deposit, the customer's Marlowe Rewards tier and the other launch reservations they hold. The
      records are the reservation and its reservation_events, read with the customer's loyalty
      membership and the fulfilment orders reservations become; the rules are reservation terms and
      deposits (preorders_reservation, preorders_evt_deposit), open-reservation and per-style launch
      caps (preorders_agg_multi_holding, preorders_agg_launch_style_limit), the delay-notice and consent
      rules modelled on the FTC Mail, Internet, or Telephone Order Merchandise Rule
      (preorders_evt_delay_notice), cancellation cutoffs, forfeiture and its override after a delay
      (preorders_evt_cancellation_refund), price protection (preorders_evt_price_protection), launch
      allocation priority (preorders_evt_launch_allocation), authorization renewal
      (preorders_evt_authorization), made-to-order confirmation (preorders_evt_made_to_order) and size
      changes (preorders_evt_size_change) — and in the natural course of the business a reservation is
      taken, may be delayed, is allocated or produced, and then ships or is cancelled. The agent takes
      reservations, lowers prices, changes sizes, cancels reservations and books deposit refunds or
      forfeitures on a verified account, while consenting to a delay, confirming made-to-order
      specifications and confirming a cancellation that forfeits a deposit are the customer's own acts,
      handed to the customer as user actions. Requests outside every rule — moving a reservation to
      another person, swapping to a different style while keeping the reservation's place, jumping the
      launch allocation order, or compensation for a delay beyond the refund the rules give — cannot be
      decided by policy and go to a human representative as POLICY_NOT_COVERED.

  - name: delivery_claims
    claim:
      categories: [claims]
      event_types: [claims_opened, claims_evidence_logged, claims_trace_opened, claims_submitted_for_review, claims_approved, claims_denied, claims_appealed, claims_compensation_issued, claims_resolved, claims_withdrawn, claims_compensation_recovered]
    summary: >
      Customers call when a delivery went wrong: a guaranteed parcel that came a day late, a parcel the
      tracking shows delivered but that never reached them, a parcel stuck without a scan, a box that
      arrived crushed, a parcel that arrived without one of its items, or a wrong item in the box — and
      sometimes a parcel that turned up after it was compensated; the setting varies with the claim
      type, the order's delivery service, status and dates, the claimed value, the evidence already on
      file, any carrier trace and its result, the claim's status and appeal history, the customer's
      Unlimited plan and the delivery claims they had approved in the past year. The records are the
      delivery claim and its claim_events, read with the order, its lines, payments and promised
      delivery date, and with the credit instruments that goodwill creates; the rules are the
      reporting windows, waits, order-state and one-per-type gates (claims_opening), repeat-claim
      limits (claims_agg_repeat_claims), evidence, declaration and police-report thresholds
      (claims_evt_evidence), carrier traces (claims_evt_carrier_trace), decision criteria including
      guarantee suspension and signature on file (claims_evt_decision), reshipment, refund and
      late-delivery goodwill per claim type (claims_evt_compensation), appeals (claims_evt_appeal),
      recovery when a parcel turns up or a wrong item is kept (claims_evt_recovery) and withdrawal
      (claims_evt_withdrawal) — and in the natural course of the business a claim is opened, gathers
      evidence or a trace, is decided, compensated and resolved. The agent opens, traces, submits,
      decides, compensates, resolves and recovers on claims for a verified account, while the
      non-receipt declaration must be signed by the customer personally and withdrawing a claim is the
      customer's own decision, both handed to the customer as user actions. Situations no rule decides
      — compensation for a missed event or other consequential loss, parcels sent on to a freight
      forwarder, or a claim whose value is above what an agent may approve — have no policy path for
      the agent and go to a human representative as POLICY_NOT_COVERED.
