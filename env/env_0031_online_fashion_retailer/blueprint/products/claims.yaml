# Delivery Claims — every case a customer opens because a parcel arrived late, never arrived,
# arrived damaged, arrived short or arrived with the wrong item. The claim type is the tier; it fixes
# the reporting window, the evidence, whether a carrier trace is needed and how the customer is made
# whole. Marlowe & Finch, not the customer, deals with the carrier.

category: claims
display_name: Delivery Claims

binding:
  holding_table: delivery_claims
  event_tables: [claim_events]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [opened, carrier_trace, under_review, approved, denied, resolved, withdrawn]
  transitions:
    - {from: opened, to: carrier_trace, by: agent, means: "A trace is opened with the carrier and the claim waits for its result."}
    - {from: carrier_trace, to: under_review, by: system, means: "The carrier answers the trace or the trace period ends."}
    - {from: opened, to: under_review, by: agent, means: "All required evidence is on the claim and no trace is needed; the claim goes to decision."}
    - {from: under_review, to: approved, by: agent, means: "The claim is approved with a resolution type."}
    - {from: under_review, to: denied, by: agent, means: "The claim is denied with a reason."}
    - {from: denied, to: under_review, by: agent, means: "A denied claim is appealed with new evidence within the appeal window."}
    - {from: approved, to: resolved, by: agent, means: "The compensation of an approved claim has been booked."}
    - {from: opened, to: withdrawn, by: user, means: "The customer withdraws the claim — typically because the parcel turned up — before a trace or decision."}
    - {from: carrier_trace, to: withdrawn, by: user, means: "The customer withdraws the claim while the carrier trace is running."}

accounts:
  - key: compensation
    unit: USD
    meaning: "Value given to the customer on the claim — refunds, reshipped merchandise at its paid value and Goodwill Credit — net of value recovered when a parcel turns up or a wrong item is kept."

parameter_schema:
  claim_scope: "What one claim covers (enum string: parcel | line)."
  reporting_window_days: "Calendar days after the anchor date within which the claim must be opened (integer)."
  reporting_window_anchor: "Order date the reporting window counts from (enum string: delivered_date | shipped_date)."
  min_wait_days_after_delivery_scan: "Calendar days after the delivered date before a claim may be opened (integer; 0 = none)."
  ground_lost_threshold_business_days: "Business days without carrier movement after which a ground or economy parcel can be claimed lost (integer; 0 when not a lost claim)."
  express_lost_threshold_business_days: "Same for Expedited 2-Day, Next Business Day and Same-Day Courier parcels (integer; 0 when not a lost claim)."
  carrier_trace_required: "Whether a carrier trace must run before decision (boolean)."
  carrier_trace_business_days: "Business days a carrier trace runs before the claim goes to decision without an answer (integer; 0 when no trace)."
  required_evidence: "Evidence types that must be on the claim before decision (list)."
  evidence_submission_deadline_days: "Calendar days after opening by which the required evidence must be on the claim (integer)."
  affidavit_threshold_usd: "Claimed value (USD, 2 dp) at or above which the customer's signed non-receipt declaration is required (0.00 = never)."
  police_report_threshold_usd: "Claimed value (USD, 2 dp) at or above which a police report reference is required (0.00 = never)."
  signature_on_file_denies_claim: "Whether a carrier-captured signature at delivery leads to denial unless a police report is on the claim (boolean)."
  default_resolution: "How the customer is made whole by default (enum string: reship | shipping_fee_refund)."
  customer_may_choose_refund: "Whether the customer may take a refund instead of a reshipment (boolean)."
  out_of_stock_resolution: "Resolution when the same SKU and size cannot be reshipped (enum string: merchandise_refund | not_applicable)."
  refund_includes_shipping_fee: "Whether a merchandise refund also refunds the order's shipping fee and surcharge (boolean)."
  refund_tender: "Where refunds go (enum string: original_tenders)."
  refund_timing_business_days: "Business days from approval to refund (integer)."
  reship_delivery_service: "Delivery service of a reshipment (official service name, or not_applicable)."
  reship_shipping_fee_usd: "Shipping fee charged on a reshipment (USD, 2 dp)."
  reship_stock_rule: "What may be reshipped (enum string: same_sku_same_size | not_applicable)."
  item_return_required: "Whether the item received must be sent back with a prepaid label (boolean)."
  item_return_window_days: "Calendar days after approval to send that item back (integer; 0 when not required)."
  unreturned_item_charge_basis: "What is charged when a required item is not sent back (enum string: net_price_of_item_kept | not_applicable)."
  damaged_item_retention_days: "Calendar days the customer keeps a damaged item and its packaging for possible carrier inspection (integer; 0 when not applicable)."
  late_threshold_calendar_days: "Calendar days after the promised delivery date from which a guaranteed delivery counts as late (integer; 0 when not a late claim)."
  guarantee_suspension_start: "First day (MM-DD) of the yearly peak period when carrier delivery guarantees are suspended, or not_applicable."
  guarantee_suspension_end: "Last day (MM-DD) of that peak period, or not_applicable."
  late_delivery_goodwill_usd: "Goodwill Credit given for a late guaranteed delivery whose shipping fee was waived (USD, 2 dp; 0.00 when not a late claim)."
  goodwill_cap_fallback: "What applies when the credit charter's Goodwill Credit caps are reached (enum string: no_compensation | not_applicable)."
  max_approved_claims_12m: "Most claims of this type a customer can have approved in a trailing 12 months before further ones are denied for repeat_claim_limit (integer; 0 = no limit)."
  repeat_limit_override_evidence: "Evidence that lets a claim over the repeat limit be decided normally (enum string: police_report | not_applicable)."
  appeal_window_days: "Calendar days after the decision date within which a denial can be appealed (integer)."
  appeal_requires_new_evidence: "Whether an appeal needs evidence logged after the denial (boolean)."
  max_appeals: "Most appeals per claim (integer)."
  compensation_cap_usd: "Highest compensation an agent may approve on one claim (USD, 2 dp); above it the claim is handed to a human representative."
  found_after_compensation_handling: "What happens when a parcel compensated as undelivered turns up (enum string: return_with_prepaid_label_or_charge | not_applicable)."
  found_item_return_window_days: "Calendar days after the parcel turns up to send it back before being charged (integer; 0 when not applicable)."
  compensation_recovery_method: "How value is recovered when an item is kept (enum string: charge_original_card)."
  customer_address_error_excluded: "Whether a parcel misdelivered because of an address error the customer made is excluded (boolean)."
  uncollected_pickup_excluded: "Whether a parcel returned from a pickup point because it was not collected is excluded (boolean)."
  customer_files_with_carrier: "Whether the customer must file anything with the carrier (boolean)."
  parcel_value_basis: "How the claimed value is measured (enum string: net_merchandise_paid_plus_tax)."
  decision_sla_business_days: "Business days from under_review to decision (integer)."
  claims_per_order_per_type: "Most claims of one type per order that are not withdrawn (integer)."
  withdrawal_before_decision: "Whether the customer can withdraw only before a decision (boolean)."
  lost_declaration_basis: "When a parcel is treated as lost (enum string: carrier_lost_confirmation_or_trace_period_elapsed | not_applicable)."
  delivered_trace_denies_claim: "Whether a trace result of delivered_confirmed leads to denial unless the claim is converted to a non-receipt claim (boolean)."

