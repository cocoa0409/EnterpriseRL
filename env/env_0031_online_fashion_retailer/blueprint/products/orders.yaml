# Online Orders — every web and app order of Marlowe & Finch. The order is held as a sales
# contract whose tier is the delivery service chosen at checkout; its lines, payments and
# post-purchase adjustments are booked as ledger rows that the loyalty, returns, credit, preorders
# and claims charters read.

category: orders
display_name: Online Orders

binding:
  holding_table: orders
  event_tables: [order_lines, order_payments]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [placed, processing, shipped, delivered, closed, cancelled]
  transitions:
    - {from: placed, to: processing, by: system, means: "The order is released to the warehouse once its cancellation window and any fraud review have passed."}
    - {from: placed, to: cancelled, by: agent, means: "The whole order is cancelled before release — at the customer's request, or after a failed fraud review or payment authorization."}
    - {from: processing, to: cancelled, by: system, means: "Nothing on the order could be picked and every line was cancelled at the warehouse."}
    - {from: processing, to: shipped, by: system, means: "The first parcel of the order leaves the warehouse with a carrier tracking number."}
    - {from: shipped, to: delivered, by: system, means: "The carrier records the order's last parcel as delivered."}
    - {from: delivered, to: closed, by: system, means: "The order closes once the post-delivery holding period has passed."}
    - {from: shipped, to: closed, by: system, means: "The order closes without delivery — the parcel came back to the warehouse as undeliverable, or was written off as lost under a delivery claim."}

accounts:
  - key: order_value
    unit: USD
    meaning: "Net merchandise value the customer owes on the order: booked lines minus cancellations, price adjustments and post-purchase promotion adjustments."
  - key: payments
    unit: USD
    meaning: "Money captured from the customer's tenders for the order net of money given back to those tenders by order-level refunds (return refunds are booked by the returns charter)."

parameter_schema:
  shipping_fee_usd: "List fee of the delivery service for one order (USD, 2 dp), before any waiver."
  transit_business_days_min: "Fewest business days in transit after dispatch (integer; Monday-Friday excluding US federal holidays)."
  transit_business_days_max: "Most business days in transit after dispatch (integer); the promised delivery date is dispatch date plus this many business days."
  delivery_date_guaranteed: "Whether the promised delivery date is guaranteed (boolean); read by the claims charter for late-delivery claims."
  order_cutoff_time_et: "Latest Eastern Time (HH:MM) at which an order placed on a business day counts as placed that day for dispatch."
  processing_business_days: "Business days between placement (after cut-off rules) and dispatch (integer)."
  carrier_service: "Carrier and service used (string)."
  service_area: "Destinations served (enum string: all_50_states_dc_apo_fpo | access_points_all_50_states_dc | all_50_states_dc | contiguous_48_dc | same_day_metro_zip_list)."
  available_to_alaska_hawaii: "Whether the service can ship to Alaska or Hawaii (boolean)."
  alaska_hawaii_surcharge_usd: "Surcharge added for an Alaska or Hawaii destination (USD, 2 dp); never waived."
  po_box_allowed: "Whether the service can deliver to a PO box (boolean)."
  apo_fpo_allowed: "Whether the service can deliver to an APO/FPO/DPO military address (boolean)."
  signature_threshold_usd: "Order total (USD, 2 dp) at or above which an adult signature is required (0.00 = every order needs a signature or pickup code)."
  delivery_attempts: "Delivery attempts the carrier makes before holding the parcel (integer)."
  carrier_hold_days: "Calendar days the carrier holds a parcel for collection after the last attempt or at the pickup point before returning it to the sender (integer)."
  weekend_delivery: "Whether the service delivers on Saturdays (boolean)."
  cancellation_window_minutes: "Minutes after placement during which the order stays in status placed and can be cancelled or edited (integer)."
  max_order_value_usd: "Highest order total (USD, 2 dp) the service accepts."
  free_shipping_credit_usd: "Amount a free-shipping entitlement (threshold, loyalty tier or SHIPFREE code) takes off this service's fee (USD, 2 dp); 0.00 = the service is not waivable by those entitlements."
  shipping_fee_refund_on_full_cancellation: "Whether the shipping fee is refunded when the whole order is cancelled (boolean)."
  base_free_shipping_threshold_usd: "Merchandise subtotal after discounts (USD, 2 dp) at or above which a customer without a loyalty membership earns the free-shipping credit."
  max_units_per_order: "Maximum units on one order (integer)."
  max_units_per_sku: "Maximum units of one SKU (style, colour and size) on one order (integer)."
  promo_codes_per_order: "Maximum promotion codes on one order (integer)."
  post_purchase_promo_window_days: "Calendar days after the placed date within which a valid code that was not entered at checkout can be applied (integer)."
  base_price_adjustment_window_days: "Price-adjustment window in calendar days after the placed date for customers without a loyalty membership (integer)."
  price_adjustment_per_line_limit: "Maximum price adjustments per order line (integer)."
  price_adjustment_min_difference_usd: "Smallest per-unit price difference (USD, 2 dp) that is adjusted."
  price_adjustment_excludes_clearance: "Whether a clearance price is excluded as a reference price (boolean)."
  price_adjustment_excludes_flash_sale: "Whether a flash-sale price is excluded as a reference price (boolean)."
  price_adjustment_excludes_code_prices: "Whether a price reachable only with a promotion code is excluded as a reference price (boolean)."
  payment_authorization_validity_days: "Calendar days a card authorization stays valid before it must be renewed (integer)."
  payment_capture_point: "When tenders are captured (enum string: dispatch)."
  split_shipment_fee_policy: "How the shipping fee is charged when an order ships in several parcels (enum string: charged_once_on_first_dispatch)."
  address_change_before_release_only: "Whether the shipping address can be changed only while the order is in status placed (boolean)."
  service_change_before_release_only: "Whether the delivery service can be changed only while the order is in status placed (boolean)."
  fraud_review_threshold_usd: "Order total (USD, 2 dp) at or above which the order is held for fraud review before release."
  fraud_review_hold_hours: "Hours an order may be held for fraud review before it is cancelled if not cleared (integer)."
  gift_card_max_value_usd: "Highest value of one purchased gift card (USD, 2 dp)."
  gift_card_daily_purchase_cap_usd: "Highest total value of gift cards one customer may buy per calendar day, Eastern Time (USD, 2 dp)."
  gift_card_stored_value_tender_allowed: "Whether gift-card lines may be paid with gift cards, store credit, Goodwill Credit or Rewards Notes (boolean)."
  promo_excludes_preorders: "Whether promotion codes are excluded from pre-order and back-order reservations (boolean)."
  promo_excludes_gift_cards: "Whether promotion codes are excluded from gift-card lines (boolean)."
  promo_allocation_basis: "How an order-level discount is spread over lines (enum string: pro_rata_by_eligible_line_price)."
  discount_rounding_rule: "Rounding of allocated discounts (enum string: per_line_half_up_cents_remainder_to_highest_priced_line)."
  order_close_days_after_delivery: "Calendar days after the delivered date at which a delivered order closes (integer)."
  rts_shipping_fee_refunded: "Whether the shipping fee is refunded when a parcel returns to sender as undeliverable (boolean)."
  tender_capture_priority: "Order in which tenders are drawn at capture (ordered list)."
  tender_refund_priority: "Order in which order-level refunds are returned to the captured tenders (ordered list)."

