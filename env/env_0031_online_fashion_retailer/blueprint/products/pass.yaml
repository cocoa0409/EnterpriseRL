# Marlowe & Finch Unlimited — the paid free-shipping membership. Plans differ by billing period,
# the delivery services they make free, and whether prepaid return labels are included. The
# membership is a subscription holding; fees, refunds and benefit uses are booked on its ledger.

category: pass
display_name: Marlowe & Finch Unlimited

binding:
  holding_table: pass_memberships
  event_tables: [pass_ledger]
  intake_tables: [pass_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [trial, active, past_due, cancellation_pending, expired]
  transitions:
    - {from: trial, to: active, by: system, means: "The trial ends with auto-renew on and the first fee is charged (on the enrollment date when no trial applies)."}
    - {from: trial, to: expired, by: system, means: "The trial ends with auto-renew off, or the first fee is declined."}
    - {from: active, to: past_due, by: system, means: "A renewal charge is declined; benefits pause while retries run."}
    - {from: past_due, to: active, by: system, means: "A retry succeeds and the renewal period starts."}
    - {from: past_due, to: expired, by: system, means: "The last retry fails and the membership ends."}
    - {from: active, to: cancellation_pending, by: user, means: "The member personally confirms cancellation at the end of the current period; benefits continue until then."}
    - {from: cancellation_pending, to: active, by: user, means: "The member personally withdraws the cancellation before the period ends."}
    - {from: cancellation_pending, to: expired, by: system, means: "The paid period ends after a scheduled cancellation."}
    - {from: active, to: expired, by: user, means: "The member personally confirms an immediate cancellation with the refund the cancellation rule allows."}

accounts:
  - key: membership_fees
    unit: USD
    meaning: "Membership fees charged net of fees refunded."

parameter_schema:
  fee_usd: "List fee per billing period (USD, 2 dp), charged on the period start."
  billing_period_months: "Length of a billing period in calendar months (integer)."
  trial_days: "Free trial length in calendar days for an eligible first-time member (integer; 0 = no trial)."
  trial_eligibility_lookback_months: "Calendar months before enrollment in which any Unlimited membership removes trial eligibility (integer)."
  max_trials_per_customer_lifetime: "Most trials one customer can ever receive (integer)."
  trial_requires_payment_method: "Whether a card must be on file to start a trial (boolean)."
  trial_converts_to: "Plan a trial converts into (enum string: same_plan)."
  covered_delivery_services: "Delivery services whose fee the plan makes 0.00 (list of official service names)."
  covers_return_label: "Whether the returns charter's method fee is waived for the member (boolean)."
  covers_alaska_hawaii_surcharge: "Whether the Alaska/Hawaii surcharge is waived (boolean)."
  same_day_discount_pct: "Percentage off the Same-Day Courier fee (integer percent; 0 = none)."
  min_order_usd_for_benefit: "Merchandise subtotal after discounts needed for the shipping benefit (USD, 2 dp; 0.00 = none)."
  benefit_order_scope: "Which orders get the benefit (enum string: orders_placed_while_trial_active_or_cancellation_pending)."
  benefit_value_basis: "How the value of one benefit use is measured (enum string: list_fee_of_the_service_or_label_waived)."
  missed_benefit_refund_days: "Calendar days after an order's placed date within which a shipping fee charged on a covered order is refunded (integer)."
  auto_renew_default: "Whether auto-renew is on at enrollment (boolean)."
  renewal_charge_timing: "When a renewal fee is charged (enum string: day_after_current_period_end)."
  renewal_price_basis: "Fee charged on renewal (enum string: list_fee_on_renewal_date)."
  renewal_notice_days_before: "Calendar days before an annual renewal that a renewal notice is sent (integer; 0 = no notice)."
  price_change_notice_days: "Calendar days of notice before a list fee increase applies at renewal (integer)."
  payment_retry_days: "Calendar days after the first decline on which retries are made (list of integers)."
  retry_attempts_max: "Most retries after a declined renewal (integer)."
  grace_period_days: "Calendar days in past_due before the membership expires (integer)."
  benefits_during_past_due: "Whether benefits apply while past_due (boolean)."
  benefits_during_cancellation_pending: "Whether benefits apply until a scheduled cancellation takes effect (boolean)."
  cancellation_effective: "When a cancellation without refund takes effect (enum string: end_of_current_period)."
  cancellation_requires_customer_confirmation: "Whether the member must personally confirm a cancellation (boolean)."
  unused_full_refund_days: "Calendar days after a fee charge within which a cancellation with no benefit use since that charge refunds the fee in full (integer)."
  proration_basis: "Refund on later cancellation (enum string: none | unused_full_months_less_benefit_value)."
  refund_window_anchor: "Date the refund window counts from (enum string: latest_fee_charge_date)."
  annual_refund_floor_usd: "Lowest prorated refund paid (USD, 2 dp)."
  refund_rounding: "Rounding of computed refunds (enum string: half_up_to_cent)."
  refund_tender: "Where fee refunds go (enum string: card_charged)."
  upgrade_effective: "When a move to a higher-ranked plan takes effect (enum string: immediate_with_prorated_charge)."
  upgrade_proration_basis: "How an upgrade is charged (enum string: new_fee_less_unused_value_of_current_period_by_remaining_days)."
  downgrade_effective: "When a move to a lower-ranked plan takes effect (enum string: at_next_renewal)."
  downgrade_refund: "Whether a downgrade refunds anything (boolean)."
  plan_switch_limit_per_period: "Most plan changes per billing period (integer)."
  student_verification_required: "Whether the plan needs a verified student status (boolean)."
  student_verification_provider: "Who verifies student status (enum string: SheerID | not_applicable)."
  student_verification_validity_months: "Calendar months a student verification lasts (integer; 0 when not a student plan)."
  student_reverify_grace_days: "Calendar days after verification lapses to re-verify before the plan moves at renewal (integer; 0 when not a student plan)."
  student_lapse_target_plan: "Plan a student membership renews into when not re-verified (official plan name, or not_applicable)."
  household_sharing: "Whether benefits extend to other customer profiles (boolean)."
  rejoin_wait_days: "Calendar days after expiry before rejoining (integer)."
  fee_earns_loyalty_points: "Whether membership fees count as Marlowe Rewards qualifying spend (boolean)."
  max_memberships_per_customer: "Most Unlimited memberships open at once per customer (integer)."
  benefits_start: "When benefits begin (enum string: on_enrollment)."

