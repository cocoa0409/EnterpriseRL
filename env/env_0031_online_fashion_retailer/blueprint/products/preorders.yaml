events:
  - type: preorders_reserved
    target: reservations
    mutation: create
    meaning: "A customer reserves an item that cannot ship yet, with a promised ship-by date, in status reserved."
    grain: "One row per reservation."
    fields:
      reservation_id: "Reference of the reservation."
      customer_id: "Customer who reserved."
      variant_name: "Reservation type."
      status: "Always reserved at creation."
      reserved_date: "Reservation date, Eastern Time."
      reserved_time_et: "Reservation time, Eastern Time."
      sku: "SKU reserved."
      style_code: "Style of the SKU (the per-style limit key)."
      style_name: "Product name."
      size: "Size reserved."
      quantity: "Units reserved."
      unit_price_usd: "Reserved unit price."
      deposit_required_usd: "Deposit due at reservation, 0.00 when none."
      original_ship_by_date: "Ship-by date promised at reservation."
      current_ship_by_date: "Equal to original_ship_by_date at creation."
      delay_notice_count: "0 at creation."
      personalization_text: "Personalisation exactly as the customer gave it (Made-to-Order only), or empty."
    triggers:
      - event: preorders:preorders_deposit_captured
        when: {variant_name: [Deposit Pre-Order, Made-to-Order Reservation]}
        map: {event_date: reserved_date, tender_type: card_or_wallet, amount_usd: deposit_required_usd}

  - type: preorders_deposit_captured
    target: reservation_events
    meaning: "The deposit of a reservation is charged to the customer's card."
    grain: "One row per reservation (a deposit is taken once)."
    distinguish_by: [tender_type]
    fields:
      event_date: "Capture date."
      tender_type: "Always card_or_wallet."
      amount_usd: "Deposit charged, positive."
    account: deposit
    direction: in
    triggers: []

  - type: preorders_deposit_refunded
    target: reservation_events
    meaning: "A deposit is refunded to the card because the reservation was cancelled with a refund owed."
    grain: "One row per cancelled reservation."
    distinguish_by: [refund_reason]
    fields:
      event_date: "Refund date."
      refund_reason: "Cancel reason of the reservation."
      amount_usd: "Deposit refunded, negative."
    account: deposit
    direction: out
    triggers: []

  - type: preorders_deposit_forfeited
    target: reservation_events
    meaning: "A deposit is kept because the customer cancelled a made-to-order item after production started."
    grain: "One row per cancelled reservation."
    distinguish_by: [refund_reason]
    fields:
      event_date: "Forfeiture date."
      refund_reason: "Always customer_request."
      amount_usd: "Deposit kept, negative."
    account: deposit
    direction: out
    triggers: []

  - type: preorders_deposit_applied
    target: reservation_events
    meaning: "The deposit is applied to the price of the item when it ships."
    grain: "One row per fulfilment order."
    distinguish_by: [fulfilment_order_id]
    fields:
      event_date: "Shipment date."
      fulfilment_order_id: "Order carrying the item."
      amount_usd: "Deposit applied, negative."
    account: deposit
    direction: out
    triggers: []

  - type: preorders_delay_notified
    target: reservation_events
    meaning: "A delay notice tells the customer the item cannot ship by the current ship-by date, gives a revised date and offers cancellation with a full refund."
    grain: "One row per notice (numbered per reservation)."
    distinguish_by: [notice_number]
    fields:
      event_date: "Date the notice was sent."
      notice_number: "1 for the first notice, 2 for the second, and so on."
      revised_ship_by_date: "Revised ship-by date announced."
      consent_mode: "deemed_consent or express_consent_required."
    triggers:
      - event: preorders:preorders_ship_date_revised
        when: {consent_mode: deemed_consent}
        map: {current_ship_by_date: revised_ship_by_date}
      - event: preorders:preorders_delay_consent_requested
        when: {consent_mode: express_consent_required}

  - type: preorders_authorization_renewed
    target: reservation_events
    meaning: "The card authorization of a Launch Pre-Order is renewed before it lapses."
    grain: "One row per renewal attempt date."
    distinguish_by: [event_date]
    fields:
      event_date: "Renewal attempt date."
      auth_amount_usd: "Amount authorized."
      auth_outcome: "approved or declined."
    triggers: []

  - type: preorders_delay_consent_requested
    target: reservations
    mutation: {transition: {from: reserved, to: awaiting_consent}}
    meaning: "A delay needing express consent puts the reservation on hold for the customer's answer."
    grain: "One row per transaction."
    fields:
      status: "awaiting_consent."
      consent_deadline_date: "The current ship-by date before revision."
      delay_notice_count: "Incremented by one."
    triggers: []

  - type: preorders_delay_consented
    target: reservations
    mutation: {transition: {from: awaiting_consent, to: reserved}}
    meaning: "The customer expressly consents to the revised ship-by date."
    grain: "One row per transaction."
    fields:
      status: "reserved."
      current_ship_by_date: "The revised ship-by date of the latest notice."
      consent_deadline_date: "Cleared."
    triggers: []

  - type: preorders_lapsed
    target: reservations
    mutation: {transition: {from: awaiting_consent, to: cancelled}}
    meaning: "The customer declined the delay or did not consent by the deadline."
    grain: "One row per transaction."
    fields:
      status: "cancelled."
      variant_name: "Reservation type, unchanged; read to route the consequences."
      cancelled_date: "The day the customer declined, or the day after the consent deadline."
      cancel_reason: "delay_not_consented."
    triggers:
      - event: preorders:preorders_deposit_refunded
        when: {variant_name: [Deposit Pre-Order, Made-to-Order Reservation]}
        map: {refund_reason: cancel_reason, event_date: cancelled_date}

  - type: preorders_production_started
    target: reservations
    mutation: {transition: {from: reserved, to: in_production}}
    meaning: "Production of a made-to-order item starts."
    grain: "One row per transaction."
    fields:
      status: "in_production."
      production_start_date: "Production start date."
    triggers: []

  - type: preorders_production_completed
    target: reservations
    mutation: {transition: {from: in_production, to: allocated}}
    meaning: "The made-to-order item passes quality control and is set aside."
    grain: "One row per transaction."
    fields:
      status: "allocated."
      allocated_date: "Completion date."
    triggers: []

  - type: preorders_allocated
    target: reservations
    mutation: {transition: {from: reserved, to: allocated}}
    meaning: "Arriving stock is set aside for the reservation."
    grain: "One row per transaction."
    fields:
      status: "allocated."
      allocated_date: "Allocation date."
    triggers: []

  - type: preorders_fulfilled
    target: reservations
    mutation: {transition: {from: allocated, to: fulfilled}}
    meaning: "The allocated item ships on a fulfilment order."
    grain: "One row per transaction."
    fields:
      status: "fulfilled."
      variant_name: "Reservation type, unchanged; read to route the consequences."
      fulfilled_date: "Shipment date."
      fulfilment_order_id: "Order carrying the item."
    triggers:
      - event: orders:orders_placed
        map: {placed_date: fulfilled_date}
      - event: preorders:preorders_deposit_applied
        when: {variant_name: [Deposit Pre-Order, Made-to-Order Reservation]}
        map: {fulfilment_order_id: fulfilment_order_id, event_date: fulfilled_date}

  - type: preorders_cancelled
    target: reservations
    mutation: {transition: {from: reserved, to: cancelled}}
    meaning: "An unallocated reservation is cancelled."
    grain: "One row per transaction."
    fields:
      status: "cancelled."
      variant_name: "Reservation type, unchanged; read to route the consequences."
      cancelled_date: "Cancellation date."
      cancel_reason: "customer_request, supplier_cancelled, launch_shortfall, specs_not_confirmed, delay_cap_reached or payment_declined."
    triggers:
      - event: preorders:preorders_deposit_refunded
        when: {variant_name: [Deposit Pre-Order, Made-to-Order Reservation]}
        map: {refund_reason: cancel_reason, event_date: cancelled_date}

  - type: preorders_production_cancelled
    target: reservations
    mutation: {transition: {from: in_production, to: cancelled}}
    meaning: "A made-to-order reservation in production is cancelled."
    grain: "One row per transaction."
    fields:
      status: "cancelled."
      cancelled_date: "Cancellation date."
      cancel_reason: "customer_request or production_failure."
    triggers:
      - event: preorders:preorders_deposit_refunded
        when: {cancel_reason: production_failure}
        map: {refund_reason: production_failure, event_date: cancelled_date}

  - type: preorders_cancelled_after_allocation
    target: reservations
    mutation: {transition: {from: allocated, to: cancelled}}
    meaning: "An allocated reservation is cancelled because payment was declined beyond the grace period."
    grain: "One row per transaction."
    fields:
      status: "cancelled."
      variant_name: "Reservation type, unchanged; read to route the consequences."
      cancelled_date: "Cancellation date."
      cancel_reason: "payment_declined."
    triggers:
      - event: preorders:preorders_deposit_refunded
        when: {variant_name: [Deposit Pre-Order, Made-to-Order Reservation]}
        map: {refund_reason: payment_declined, event_date: cancelled_date}

  - type: preorders_ship_date_revised
    target: reservations
    mutation: update
    meaning: "The current ship-by date moves to the revised date of a first notice that treats silence as consent."
    grain: "One row per transaction."
    fields:
      current_ship_by_date: "Revised ship-by date."
      delay_notice_count: "Incremented by one."
    triggers: []

  - type: preorders_price_lowered
    target: reservations
    mutation: update
    meaning: "The reserved unit price is lowered to a lower regular price before shipment."
    grain: "One row per transaction."
    fields:
      unit_price_usd: "New, lower unit price."
    triggers: []

  - type: preorders_size_changed
    target: reservations
    mutation: update
    meaning: "The size of an unallocated reservation is changed."
    grain: "One row per transaction."
    fields:
      sku: "New SKU."
      size: "New size."
      size_changes_used: "Incremented by one."
    triggers: []

  - type: preorders_specs_confirmed
    target: reservations
    mutation: update
    meaning: "The customer personally confirms the size and personalisation of a made-to-order item."
    grain: "One row per transaction."
    fields:
      specs_confirmed_date: "Confirmation date."
      personalization_text: "Final personalisation exactly as confirmed."
    triggers: []

measures:
  - id: preorders_msr_open_style_units
    window: "The customer's reservations in status reserved, awaiting_consent, in_production or allocated."
    measure: "Sum of quantity over those reservations with the same style_code and variant_name Launch Pre-Order."
  - id: preorders_msr_open_reservations
    window: "The customer's reservations in status reserved, awaiting_consent, in_production or allocated."
    measure: "Count of those reservations."
  - id: preorders_msr_cumulative_delay_days
    window: "The reservation's current state."
    measure: "Calendar days from original_ship_by_date to the revised ship-by date being considered."

policies:
  - id: preorders_reservation
    subject: [preorders_reserved]
    rule: >-
      A reservation is taken only for the type matching the item's state (entry gate of each type) and
      always states an original ship-by date no later than `max_initial_ship_by_days` calendar days
      after the reservation date; where no date can be stated, the ship-by date is the reservation date
      plus `ship_by_days_when_unstated`. A reservation carries at most `max_units_per_reservation`
      units. Promotion codes never apply to reservations (orders charter). A Launch Pre-Order can be
      reserved from the public `launch_open_time_et` on the launch date, or earlier by the
      `launch_preorder_early_access_hours` of the customer's Marlowe Rewards tier
      (`early_access_applies`, loyalty charter). Where `payment_timing` is
      authorize_at_reservation_capture_at_shipment, the card is authorized for the `auth_amount_basis`
      at reservation; where a deposit applies it is charged at reservation, by card only
      (`deposit_tender_types`). The deposit is `deposit_pct` percent of unit price times quantity,
      rounded per `deposit_rounding`, but never less than `deposit_min_usd`. A Made-to-Order
      Reservation records the personalisation exactly as the customer gives it
      (`personalization_allowed`).
    eligibility: []
    params:
      per_tier:
        Standard Back-Order: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", max_initial_ship_by_days: "=max_initial_ship_by_days"}
        Supplier Direct Back-Order: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", max_initial_ship_by_days: "=max_initial_ship_by_days"}
        Seasonal Pre-Order: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", max_initial_ship_by_days: "=max_initial_ship_by_days"}
        Launch Pre-Order: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", max_initial_ship_by_days: "=max_initial_ship_by_days"}
        Deposit Pre-Order: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", max_initial_ship_by_days: "=max_initial_ship_by_days"}
        Made-to-Order Reservation: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", max_initial_ship_by_days: "=max_initial_ship_by_days"}
    formula:
      deposit_required_usd: "max(round(unit_price_usd * quantity * deposit_pct / 100, 2), deposit_min_usd)"
      when_not: "deposit_pct == 0"

  - id: preorders_agg_multi_holding
    subject: [preorders_reserved]
    rule: >-
      A customer may hold several reservations at once, of any type, up to
      `max_open_reservations_per_customer` open reservations in total (preorders_msr_open_reservations);
      a reservation beyond that is not taken. Each reservation keeps its own ship-by date, deposit and
      delay history; delay notices, consents and refunds never carry over from one reservation to
      another.
    eligibility: []
    params: {max_per_customer: null}
    measures: [preorders_msr_open_reservations]

  - id: preorders_agg_launch_style_limit
    subject: [preorders_reserved]
    rule: >-
      For a Launch Pre-Order the open units of one style across all of a customer's Launch Pre-Order
      reservations (preorders_msr_open_style_units) may not exceed the
      `launch_preorder_per_style_limit` of the customer's Marlowe Rewards tier on the reservation date
      (loyalty charter; `per_style_limit_basis`), or the Marlowe Rewards Member limit for a customer
      without an open membership. Cancelled and fulfilled reservations do not count. A second profile
      at the same shipping address does not create a separate allowance: reservations shipping to the
      same address are counted together.
    eligibility: []
    measures: [preorders_msr_open_style_units]

  - id: preorders_evt_delay_notice
    subject: [preorders_delay_notified, preorders_ship_date_revised, preorders_delay_consent_requested, preorders_delay_consented, preorders_lapsed]
    rule: >-
      When a reservation cannot ship by its current_ship_by_date, a numbered delay notice with a
      definite revised ship-by date and an offer to cancel with a full refund is sent on or before that
      date (`delay_notice_deadline_basis`). A delay notice is sent only while the reservation is in
      status reserved or in_production. The notice treats the customer's silence as consent
      (deemed_consent) only when it is notice number 1 and its revised date is no more than
      `deemed_consent_max_delay_days` calendar days after the original_ship_by_date; the current ship-by
      date then moves to the revised date at once. Every other notice — any notice from number
      `express_consent_from_notice_number`, or a first notice announcing a longer delay — needs the
      customer's express consent (express_consent_required): the reservation moves to awaiting_consent
      with consent_deadline_date equal to the current ship-by date before revision
      (`consent_deadline_basis`). Express consent counts only if the customer gives it no later than
      the consent deadline of the reservation. The deadline day itself counts; consent given on a later
      calendar day does not. With timely consent the reservation returns to reserved with the revised
      date; when the customer declines, or the deadline passes in silence, the reservation is cancelled
      with reason delay_not_consented and a full refund. When the revised date would lie more than
      `max_cumulative_delay_days` calendar days after the original_ship_by_date
      (preorders_msr_cumulative_delay_days), no notice is sent; the reservation is cancelled with reason
      delay_cap_reached and a full refund.
    eligibility:
      - id: open_reservation
        applies_to: [preorders_delay_notified]
        kind: state
        condition: "A delay notice is sent only while the reservation is in status reserved or in_production."
        evidence_fields: [reservations.status, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        state_contract:
          field: reservations.status
          allowed: [reserved, in_production]
      - id: consent_in_time
        applies_to: [preorders_delay_consented]
        kind: time
        condition: "Express consent counts only if the customer gives it no later than the consent deadline of the reservation."
        evidence_fields: [reservations.consent_deadline_date, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the consent deadline of the reservation"
          anchor_source: reservations.consent_deadline_date
          relation: not_after
          duration_source: params.consent_grace_days
          unit: calendar_days
          counting_rule: "The deadline day itself counts; consent given on a later calendar day does not."
          boundary: inclusive
    params:
      consent_grace_days: 0
      per_tier:
        Standard Back-Order: {max_cumulative_delay_days: "=max_cumulative_delay_days", deemed_consent_max_delay_days: "=deemed_consent_max_delay_days"}
        Supplier Direct Back-Order: {max_cumulative_delay_days: "=max_cumulative_delay_days", deemed_consent_max_delay_days: "=deemed_consent_max_delay_days"}
        Seasonal Pre-Order: {max_cumulative_delay_days: "=max_cumulative_delay_days", deemed_consent_max_delay_days: "=deemed_consent_max_delay_days"}
        Launch Pre-Order: {max_cumulative_delay_days: "=max_cumulative_delay_days", deemed_consent_max_delay_days: "=deemed_consent_max_delay_days"}
        Deposit Pre-Order: {max_cumulative_delay_days: "=max_cumulative_delay_days", deemed_consent_max_delay_days: "=deemed_consent_max_delay_days"}
        Made-to-Order Reservation: {max_cumulative_delay_days: "=max_cumulative_delay_days", deemed_consent_max_delay_days: "=deemed_consent_max_delay_days"}
    measures: [preorders_msr_cumulative_delay_days]

  - id: preorders_evt_cancellation_refund
    subject: [preorders_cancelled, preorders_production_cancelled, preorders_cancelled_after_allocation, preorders_deposit_refunded, preorders_deposit_forfeited]
    rule: >-
      A customer may cancel at will until `customer_cancellation_cutoff`: before allocation for every
      type except Made-to-Order Reservation, whose cutoff is the start of production. Before the cutoff
      the deposit is refunded in full (`deposit_refundable_before_cutoff`). After the cutoff a
      Made-to-Order Reservation can still be cancelled at the customer's request, but its deposit is
      forfeited (`deposit_forfeited_after_cutoff`); such a cancellation is made only on a
      cancellation_with_forfeiture request for that reservation whose request_status is confirmed. Once
      any delay notice has been sent for a reservation (delay_notice_count above 0), a customer
      cancellation is always refunded in full, whatever the status and the cutoff. Every cancellation
      caused by Marlowe & Finch or its supplier — supplier_cancelled, launch_shortfall,
      delay_not_consented, delay_cap_reached, production_failure — refunds the deposit in full
      (`seller_cancellation_full_refund`). A customer whose specifications were not confirmed in time
      (specs_not_confirmed), or whose card stayed declined past the grace period (payment_declined),
      also receives the deposit back in full. Refunds go to the original card
      (`cancellation_refund_tender`) within `refund_due_business_days` business days; nothing was
      charged on types without a deposit, whose card authorization is simply released. A refund or
      forfeiture is booked only once the reservation is in status cancelled. An allocated reservation
      cannot be cancelled at will; the customer may refuse delivery or return the item under the
      returns charter once delivered.
      Only types with `supplier_cancellation_possible` can be cancelled by the supplier (reason supplier_cancelled); a Deposit Pre-Order or Made-to-Order Reservation is never cancelled that way.
    eligibility:
      - id: forfeiture_confirmed
        applies_to: [preorders_production_cancelled, preorders_deposit_forfeited]
        kind: authorization
        condition: "After the cutoff a Made-to-Order Reservation can still be cancelled at the customer's request, but its deposit is forfeited (`deposit_forfeited_after_cutoff`); such a cancellation is made only on a cancellation_with_forfeiture request for that reservation whose request_status is confirmed."
        evidence_fields: [reservation_requests.reservation_id, reservation_requests.request_type, reservation_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservation_requests.reservation_id]
          action_bindings:
            reservation_requests.reservation_id: reservation_id
      - id: booked_after_cancellation
        applies_to: [preorders_deposit_refunded, preorders_deposit_forfeited]
        kind: state
        condition: "A refund or forfeiture is booked only once the reservation is in status cancelled."
        evidence_fields: [reservations.status, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        state_contract:
          field: reservations.status
          allowed: [cancelled]
    params:
      per_tier:
        Standard Back-Order: {customer_cancellation_cutoff: "=customer_cancellation_cutoff", deposit_forfeited_after_cutoff: "=deposit_forfeited_after_cutoff"}
        Supplier Direct Back-Order: {customer_cancellation_cutoff: "=customer_cancellation_cutoff", deposit_forfeited_after_cutoff: "=deposit_forfeited_after_cutoff"}
        Seasonal Pre-Order: {customer_cancellation_cutoff: "=customer_cancellation_cutoff", deposit_forfeited_after_cutoff: "=deposit_forfeited_after_cutoff"}
        Launch Pre-Order: {customer_cancellation_cutoff: "=customer_cancellation_cutoff", deposit_forfeited_after_cutoff: "=deposit_forfeited_after_cutoff"}
        Deposit Pre-Order: {customer_cancellation_cutoff: "=customer_cancellation_cutoff", deposit_forfeited_after_cutoff: "=deposit_forfeited_after_cutoff"}
        Made-to-Order Reservation: {customer_cancellation_cutoff: "=customer_cancellation_cutoff", deposit_forfeited_after_cutoff: "=deposit_forfeited_after_cutoff"}

  - id: preorders_evt_deposit
    subject: [preorders_deposit_captured, preorders_deposit_applied]
    rule: >-
      A deposit is captured once, at reservation, by card (`deposit_tender_types`). At shipment the
      deposit is applied in full to the fulfilment order and the customer pays the `balance_basis`:
      the final unit price times quantity minus the deposit, plus tax, on the fulfilment order
      (`balance_paid_via_fulfilment_order`), where every order tender may be used. A deposit is applied
      only once the reservation is in status fulfilled. A lower final price never reduces the deposit
      below what was paid; it only lowers the balance, and when the deposit exceeds the final price the
      difference is refunded to the card at shipment.
    eligibility:
      - id: applied_on_fulfilment
        applies_to: [preorders_deposit_applied]
        kind: state
        condition: "A deposit is applied only once the reservation is in status fulfilled."
        evidence_fields: [reservations.status, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        state_contract:
          field: reservations.status
          allowed: [fulfilled]

  - id: preorders_evt_price_protection
    subject: [preorders_price_lowered]
    rule: >-
      Where `price_protection` applies, the customer pays the lowest regular site price of the reserved
      SKU between the reservation date and shipment (`price_protection_basis`): when the regular price
      drops, the reserved unit price is lowered before shipment (`price_protection_application`). A
      price is lowered only while the reservation is in status reserved, awaiting_consent, in_production
      or allocated. Clearance, flash-sale and code-only prices never count, and a price rise never
      raises the reserved price. Launch Pre-Orders and Made-to-Order Reservations keep their reserved
      price.
    eligibility:
      - id: before_shipment
        applies_to: [preorders_price_lowered]
        kind: state
        condition: "A price is lowered only while the reservation is in status reserved, awaiting_consent, in_production or allocated."
        evidence_fields: [reservations.status, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        state_contract:
          field: reservations.status
          allowed: [reserved, awaiting_consent, in_production, allocated]

  - id: preorders_evt_launch_allocation
    subject: [preorders_allocated]
    rule: >-
      Arriving stock is allocated per `allocation_basis`: in order of reservation time, or for a Launch
      Pre-Order first by the `launch_preorder_allocation_priority` of the customer's Marlowe Rewards tier
      on the allocation date (loyalty charter; customers without an open membership after every member)
      and then by reservation time. A reservation in awaiting_consent is skipped until it is consented.
      Where `shortfall_handling` is cancel_unallocated_with_full_refund, reservations the launch stock
      cannot cover are cancelled with reason launch_shortfall; otherwise they receive a delay notice.
      An allocated unit ships within `ship_within_business_days_of_allocation` business days.
    eligibility: []

  - id: preorders_evt_authorization
    subject: [preorders_authorization_renewed, preorders_cancelled_after_allocation]
    rule: >-
      A Launch Pre-Order's card authorization is renewed every `authorization_renewal_days` calendar
      days while the reservation is open. A renewal is attempted only while the reservation is in status
      reserved, awaiting_consent or allocated. When a renewal or the capture at shipment is declined,
      the customer has `payment_decline_grace_hours` hours from the decline to update the card; after
      that the reservation is cancelled with reason payment_declined and its unit released to the next
      reservation.
    eligibility:
      - id: open_for_renewal
        applies_to: [preorders_authorization_renewed]
        kind: state
        condition: "A renewal is attempted only while the reservation is in status reserved, awaiting_consent or allocated."
        evidence_fields: [reservations.status, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        state_contract:
          field: reservations.status
          allowed: [reserved, awaiting_consent, allocated]

  - id: preorders_evt_made_to_order
    subject: [preorders_specs_confirmed, preorders_production_started, preorders_production_completed]
    rule: >-
      A Made-to-Order Reservation goes into production only after the customer personally confirms the
      size and personalisation (`specs_confirmation_required`); the agent can explain and record the
      request but cannot confirm on the customer's behalf. Specifications are confirmed only if the
      customer confirms them no later than `specs_confirmation_deadline_days` calendar days after the
      reservation is made. The reservation date is day zero and the last day of the window still
      counts. Specifications are confirmed only while the reservation is in status reserved. Without a
      timely confirmation the reservation is cancelled with reason specs_not_confirmed and the deposit
      refunded. Confirmed specifications cannot be changed (`specs_change_after_confirmation_allowed`).
      Production takes `production_lead_days` calendar days from its start.
    eligibility:
      - id: confirmation_window
        applies_to: [preorders_specs_confirmed]
        kind: time
        condition: "Specifications are confirmed only if the customer confirms them no later than `specs_confirmation_deadline_days` calendar days after the reservation is made."
        evidence_fields: [reservations.reserved_date, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the reservation is made"
          anchor_source: reservations.reserved_date
          relation: not_after
          duration_source: variants.specs_confirmation_deadline_days
          unit: calendar_days
          counting_rule: "The reservation date is day zero and the last day of the window still counts."
          boundary: inclusive
      - id: specs_before_production
        applies_to: [preorders_specs_confirmed]
        kind: state
        condition: "Specifications are confirmed only while the reservation is in status reserved."
        evidence_fields: [reservations.status, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        state_contract:
          field: reservations.status
          allowed: [reserved]

  - id: preorders_evt_size_change
    subject: [preorders_size_changed]
    rule: >-
      Where `size_change_allowed_before_allocation`, the size of a reservation can be changed to another
      size of the same style at the same price, at most `max_size_changes` time. A size is changed only
      while the reservation is in status reserved or awaiting_consent. The reservation keeps its
      reservation time, ship-by dates and delay history; the new size must be available for
      reservation, and on a back-order or launch the customer must cancel and reserve again instead.
    eligibility:
      - id: unallocated_only
        applies_to: [preorders_size_changed]
        kind: state
        condition: "A size is changed only while the reservation is in status reserved or awaiting_consent."
        evidence_fields: [reservations.status, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        state_contract:
          field: reservations.status
          allowed: [reserved, awaiting_consent]
      - id: change_limit
        applies_to: [preorders_size_changed]
        kind: dedup
        condition: "Where `size_change_allowed_before_allocation`, the size of a reservation can be changed to another size of the same style at the same price, at most `max_size_changes` time."
        evidence_fields: [reservations.size_changes_used, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        dedup_contract:
          table: reservations
          mode: same_record
          object_bindings: {reservation_id: reservation_id}
          duplicate_filters: {size_changes_used: [1]}
          distinct_fields: []
    params:
      per_tier:
        Standard Back-Order: {max_size_changes: "=max_size_changes"}
        Supplier Direct Back-Order: {max_size_changes: "=max_size_changes"}
        Seasonal Pre-Order: {max_size_changes: "=max_size_changes"}
        Launch Pre-Order: {max_size_changes: "=max_size_changes"}
        Deposit Pre-Order: {max_size_changes: "=max_size_changes"}
        Made-to-Order Reservation: {max_size_changes: "=max_size_changes"}

  - id: preorders_fulfilment
    subject: [preorders_fulfilled]
    rule: >-
      An allocated reservation ships on a fulfilment order by `fulfilment_delivery_service` at
      `fulfilment_shipping_fee_usd`, separately from the rest of the original basket at no extra charge
      (`split_shipment_free`); a Supplier Direct Back-Order ships from the brand's warehouse in its own
      parcel (`ships_from_supplier`). A Standard Back-Order of several units may ship units as they
      arrive (`partial_fulfilment_allowed`). Marlowe Rewards points are earned on the fulfilment order
      at its dispatch (`points_earned_at`), never on a deposit. Once shipped, delivery issues follow the
      claims charter and returns follow the returns charter, with the fulfilment order's delivered date
      as the anchor.
    eligibility: []
