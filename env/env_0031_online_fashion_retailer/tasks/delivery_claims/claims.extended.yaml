events:
  - type: claims_opened
    target: delivery_claims
    mutation: create
    meaning: "A customer reports a delivery problem with an order and a claim of the matching type opens in status opened."
    grain: "One row per claim."
    fields:
      claim_id: "Reference of the claim."
      customer_id: "Customer who placed the order."
      order_id: "Order concerned."
      variant_name: "Claim type."
      status: "Always opened at creation."
      opened_date: "Date the claim was opened."
      claimed_value_usd: "Value claimed under parcel_value_basis: the whole order for parcel-scope claims, the claimed lines for line-scope claims."
      appeal_count: "0 at creation."
    triggers: []

  - type: claims_evidence_logged
    target: claim_events
    meaning: "A piece of evidence is recorded on the claim: photos, the customer's signed declaration, a police report reference, a neighbour check or a carrier trace result."
    grain: "One row per evidence item."
    distinguish_by: [evidence_type, evidence_reference]
    fields:
      event_date: "Date the evidence was recorded."
      evidence_type: "damage_photos, packaging_photos, wrong_item_photo, neighbour_check_confirmation, signed_affidavit, police_report or carrier_trace_result."
      evidence_reference: "Upload, declaration, report or trace reference exactly as given."
      booked_line_id: "Order line the evidence concerns for line-scope claims; empty otherwise."
    triggers: []

  - type: claims_compensation_issued
    target: claim_events
    meaning: "Compensation is booked on an approved claim: a reshipment, a merchandise refund, a shipping fee refund or a Goodwill Credit."
    grain: "One row per compensation type per order line (line empty for parcel-level shipping fee refunds and goodwill)."
    distinguish_by: [compensation_type, booked_line_id]
    fields:
      event_date: "Booking date."
      compensation_type: "reship, merchandise_refund, shipping_fee_refund or goodwill_credit."
      booked_line_id: "Order line reshipped or refunded; empty for shipping_fee_refund and goodwill_credit."
      quantity: "Units reshipped or refunded; 0 for parcel-level rows."
      amount_usd: "Value given, positive: net merchandise paid plus tax for reshipments and refunds, the fee for shipping refunds, the credit value for goodwill."
      replacement_order_id: "No-charge order carrying a reshipment; empty otherwise."
    account: compensation
    direction: in
    triggers:
      - event: credit:credit_issued
        when: {compensation_type: goodwill_credit}
        map: {variant_name: "Goodwill Credit", source_reference: claim_id, initial_value_usd: amount_usd, issued_date: event_date}
      - event: orders:orders_placed
        when: {compensation_type: reship}
        map: {placed_date: event_date}
      - event: orders:orders_payment_refunded
        when: {compensation_type: [merchandise_refund, shipping_fee_refund]}
        map: {refund_component: delivery_claim, booked_line_id: booked_line_id, event_date: event_date}

  - type: claims_compensation_recovered
    target: claim_events
    meaning: "Value is charged back because a compensated parcel turned up and was kept, or a wrong item was not sent back."
    grain: "One row per recovery reason per order line."
    distinguish_by: [recovery_reason, booked_line_id]
    fields:
      event_date: "Charge date."
      recovery_reason: "found_parcel_kept or wrong_item_not_returned."
      booked_line_id: "Order line charged for."
      quantity: "Units charged for."
      amount_usd: "Value recovered, negative."
    account: compensation
    direction: out
    triggers: []

  - type: claims_trace_opened
    target: delivery_claims
    mutation: {transition: {from: opened, to: carrier_trace}}
    meaning: "A carrier trace is opened."
    grain: "One row per transaction."
    fields:
      status: "carrier_trace."
      trace_opened_date: "Date the trace was opened."
      trace_reference: "Carrier's trace reference."
    triggers: []

  - type: claims_trace_concluded
    target: delivery_claims
    mutation: {transition: {from: carrier_trace, to: under_review}}
    meaning: "The carrier answers the trace, or the trace period ends without an answer."
    grain: "One row per transaction."
    fields:
      status: "under_review."
      trace_result: "lost_confirmed, delivered_confirmed, found_in_network or no_response."
    triggers: []

  - type: claims_submitted_for_review
    target: delivery_claims
    mutation: {transition: {from: opened, to: under_review}}
    meaning: "A claim that needs no trace goes to decision with its evidence complete."
    grain: "One row per transaction."
    fields:
      status: "under_review."
    triggers: []

  - type: claims_approved
    target: delivery_claims
    mutation: {transition: {from: under_review, to: approved}}
    meaning: "The claim is approved with a resolution type."
    grain: "One row per transaction."
    fields:
      status: "approved."
      decision_date: "Decision date."
      resolution_type: "reship, merchandise_refund, shipping_fee_refund or goodwill_credit."
    triggers:
      - event: claims:claims_compensation_issued
        map: {compensation_type: resolution_type, event_date: decision_date}

  - type: claims_denied
    target: delivery_claims
    mutation: {transition: {from: under_review, to: denied}}
    meaning: "The claim is denied with a reason."
    grain: "One row per transaction."
    fields:
      status: "denied."
      decision_date: "Decision date."
      denial_reason: "outside_reporting_window, evidence_missing, signature_on_file, delivered_confirmed, not_late, guarantee_suspended, repeat_claim_limit or excluded_cause."
    triggers: []

  - type: claims_appealed
    target: delivery_claims
    mutation: {transition: {from: denied, to: under_review}}
    meaning: "A denied claim is appealed with new evidence."
    grain: "One row per transaction."
    fields:
      status: "under_review."
      appeal_count: "Incremented by one."
    triggers: []

  - type: claims_resolved
    target: delivery_claims
    mutation: {transition: {from: approved, to: resolved}}
    meaning: "The compensation of an approved claim is booked and the claim is resolved."
    grain: "One row per transaction."
    fields:
      status: "resolved."
      variant_name: "Claim type, unchanged; read to route the consequences."
      resolved_date: "Resolution date."
    triggers:
      - event: orders:orders_closed_undelivered
        when: {variant_name: Lost in Transit Claim}
        map: {close_reason: lost_in_transit, closed_date: resolved_date}

  - type: claims_withdrawn
    target: delivery_claims
    mutation: {transition: [{from: opened, to: withdrawn}, {from: carrier_trace, to: withdrawn}]}
    meaning: "The customer withdraws the claim before a decision."
    grain: "One row per transaction."
    fields:
      status: "withdrawn."
      withdrawn_date: "Withdrawal date."
    triggers: []

measures:
  - id: claims_msr_approved_same_type_12m
    window: "Trailing 12 calendar months ending on the frozen date, by decision_date."
    measure: "Count of the customer's claims of the same claim type whose status is approved or resolved."
  - id: claims_msr_days_late
    window: "The claimed order."
    measure: "Calendar days from orders.promised_delivery_date to orders.delivered_date (0 or negative when on time)."
  - id: claims_msr_no_movement_business_days
    window: "From the last carrier scan of the parcel to the frozen date."
    measure: "Business days (Monday-Friday, excluding US federal holidays) without a new carrier scan."
  - id: claims_msr_claimed_value
    window: "The claimed order lines (line scope) or the whole order (parcel scope)."
    measure: "Net merchandise paid on those lines (order_lines amount_usd net of price adjustments and late promotions) plus their share of the order's sales tax."

policies:
  - id: claims_opening
    subject: [claims_opened]
    rule: >-
      A claim is opened only by the customer who placed the order and only for the claim type that
      matches what the records show: a Lost in Transit Claim needs the order in status shipped, every
      other type needs it in status delivered or closed. A claim is opened only for an order in status
      shipped, delivered or closed. A Lost in Transit Claim is opened only once the parcel has shown no
      carrier movement for `ground_lost_threshold_business_days` business days on Economy Ground,
      Pickup Point Delivery or Standard Ground, or `express_lost_threshold_business_days` on faster
      services (claims_msr_no_movement_business_days). A claim is opened only if it is reported no later
      than `reporting_window_days` calendar days after the order is delivered, or for a Lost in Transit
      Claim after the order is dispatched (`reporting_window_anchor`). Window days are counted as
      calendar days after the anchor date, the anchor date being day zero, and the last day still
      qualifies. A Delivered Not Received Claim is opened only once
      `min_wait_days_after_delivery_scan` calendar days have passed since the order is delivered, since
      carriers often scan before the parcel arrives. Only one claim of each type that is not withdrawn
      may exist per order (`claims_per_order_per_type`). A parcel misdelivered because of an address
      the customer entered wrongly (`customer_address_error_excluded`), or returned from a pickup point
      because it was not collected (`uncollected_pickup_excluded`), is not a claim: the order closes as
      returned to sender under the orders charter. The customer never files with the carrier
      (`customer_files_with_carrier`). A defect that appears in use is a Quality Issue Return under the
      returns charter, not a damage claim.
      The claimed value is measured per `parcel_value_basis`: over the whole order when the type's `claim_scope` is parcel, and over the claimed order lines when it is line.
    eligibility:
      - id: order_shipped
        applies_to: [claims_opened]
        kind: state
        condition: "A claim is opened only for an order in status shipped, delivered or closed."
        evidence_fields: [orders.status, orders.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [orders.order_id]
          action_bindings:
            orders.order_id: order_id
        state_contract:
          field: orders.status
          allowed: [shipped, delivered, closed]
      - id: reporting_window
        applies_to: [claims_opened]
        kind: time
        condition: "A claim is opened only if it is reported no later than `reporting_window_days` calendar days after the order is delivered, or for a Lost in Transit Claim after the order is dispatched (`reporting_window_anchor`)."
        evidence_fields: [orders.delivered_date, orders.shipped_date, orders.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [orders.order_id]
          action_bindings:
            orders.order_id: order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the order is delivered"
          anchor_source: orders.delivered_date
          relation: not_after
          duration_source: variants.reporting_window_days
          unit: calendar_days
          counting_rule: "Window days are counted as calendar days after the anchor date, the anchor date being day zero, and the last day still qualifies."
          boundary: inclusive
      - id: dnr_wait
        applies_to: [claims_opened]
        kind: time
        condition: "A Delivered Not Received Claim is opened only once `min_wait_days_after_delivery_scan` calendar days have passed since the order is delivered, since carriers often scan before the parcel arrives."
        evidence_fields: [orders.delivered_date, orders.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [orders.order_id]
          action_bindings:
            orders.order_id: order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the order is delivered"
          anchor_source: orders.delivered_date
          relation: not_before
          duration_source: variants.min_wait_days_after_delivery_scan
          unit: calendar_days
          counting_rule: "Window days are counted as calendar days after the anchor date, the anchor date being day zero, and the last day still qualifies."
          boundary: inclusive
      - id: own_order
        applies_to: [claims_opened]
        kind: authorization
        condition: "A claim is opened only by the customer who placed the order and only for the claim type that matches what the records show: a Lost in Transit Claim needs the order in status shipped, every other type needs it in status delivered or closed."
        evidence_fields: [orders.customer_id, orders.order_id, orders.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [orders.order_id]
          action_bindings:
            orders.order_id: order_id
      - id: one_per_type
        applies_to: [claims_opened]
        kind: dedup
        condition: "Only one claim of each type that is not withdrawn may exist per order (`claims_per_order_per_type`)."
        evidence_fields: [delivery_claims.order_id, delivery_claims.variant_name, delivery_claims.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_claims.order_id, delivery_claims.variant_name]
          action_bindings:
            delivery_claims.order_id: order_id
            delivery_claims.variant_name: variant_name
        dedup_contract:
          table: delivery_claims
          mode: separate_record
          object_bindings: {order_id: order_id, variant_name: variant_name}
          duplicate_filters: {status: [opened, carrier_trace, under_review, approved, denied, resolved]}
          distinct_fields: []
    params:
      per_tier:
        Late Delivery Claim: {reporting_window_days: "=reporting_window_days", min_wait_days_after_delivery_scan: "=min_wait_days_after_delivery_scan"}
        Delivered Not Received Claim: {reporting_window_days: "=reporting_window_days", min_wait_days_after_delivery_scan: "=min_wait_days_after_delivery_scan"}
        Lost in Transit Claim: {reporting_window_days: "=reporting_window_days", min_wait_days_after_delivery_scan: "=min_wait_days_after_delivery_scan"}
        Damaged in Transit Claim: {reporting_window_days: "=reporting_window_days", min_wait_days_after_delivery_scan: "=min_wait_days_after_delivery_scan"}
        Missing Item Claim: {reporting_window_days: "=reporting_window_days", min_wait_days_after_delivery_scan: "=min_wait_days_after_delivery_scan"}
        Wrong Item Claim: {reporting_window_days: "=reporting_window_days", min_wait_days_after_delivery_scan: "=min_wait_days_after_delivery_scan"}
    measures: [claims_msr_no_movement_business_days]

  - id: claims_agg_multi_holding
    subject: [claims_opened]
    rule: >-
      A customer may hold any number of claims across orders, and one order may carry claims of
      different types (for example a Missing Item Claim and a Damaged in Transit Claim on different
      lines); there is no cap per customer. A unit compensated on one claim is never compensated again
      on another claim or through a return.
    eligibility: []
    params: {max_per_customer: null}

  - id: claims_agg_repeat_claims
    subject: [claims_approved, claims_denied]
    rule: >-
      Claims are read across all of the customer's orders. Where `max_approved_claims_12m` is above
      zero, a claim of that type is denied with reason repeat_claim_limit when the customer already has
      that many claims of the same type approved or resolved in the trailing 12 months
      (claims_msr_approved_same_type_12m), unless the `repeat_limit_override_evidence` — a police report
      reference — is logged on the claim, in which case it is decided normally. The limit counts
      approvals only; denied and withdrawn claims never count.
    eligibility: []
    measures: [claims_msr_approved_same_type_12m]

  - id: claims_evt_evidence
    subject: [claims_evidence_logged, claims_submitted_for_review]
    rule: >-
      Every type in `required_evidence` must be logged on the claim before it goes to decision, and the
      evidence must be on the claim no later than `evidence_submission_deadline_days` calendar days after
      opening, otherwise the claim is denied with reason evidence_missing. On a Delivered Not Received
      Claim whose claimed value (claims_msr_claimed_value) is at or above `affidavit_threshold_usd`, the
      customer's signed non-receipt declaration (signed_affidavit) is also required; the customer signs
      it personally and the agent cannot sign or attest on their behalf. At or above
      `police_report_threshold_usd` a police report reference is required as well. A Damaged in Transit
      claimant keeps the item and packaging for `damaged_item_retention_days` days. Evidence references
      are recorded exactly as given. Evidence is logged only while the claim is in status opened,
      carrier_trace, under_review or denied.
    eligibility:
      - id: claim_open_for_evidence
        applies_to: [claims_evidence_logged]
        kind: state
        condition: "Evidence is logged only while the claim is in status opened, carrier_trace, under_review or denied."
        evidence_fields: [delivery_claims.status, delivery_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_claims.claim_id]
          action_bindings:
            delivery_claims.claim_id: claim_id
        state_contract:
          field: delivery_claims.status
          allowed: [opened, carrier_trace, under_review, denied]
    params:
      per_tier:
        Late Delivery Claim: {affidavit_threshold_usd: "=affidavit_threshold_usd", police_report_threshold_usd: "=police_report_threshold_usd"}
        Delivered Not Received Claim: {affidavit_threshold_usd: "=affidavit_threshold_usd", police_report_threshold_usd: "=police_report_threshold_usd"}
        Lost in Transit Claim: {affidavit_threshold_usd: "=affidavit_threshold_usd", police_report_threshold_usd: "=police_report_threshold_usd"}
        Damaged in Transit Claim: {affidavit_threshold_usd: "=affidavit_threshold_usd", police_report_threshold_usd: "=police_report_threshold_usd"}
        Missing Item Claim: {affidavit_threshold_usd: "=affidavit_threshold_usd", police_report_threshold_usd: "=police_report_threshold_usd"}
        Wrong Item Claim: {affidavit_threshold_usd: "=affidavit_threshold_usd", police_report_threshold_usd: "=police_report_threshold_usd"}
    measures: [claims_msr_claimed_value]

  - id: claims_evt_carrier_trace
    subject: [claims_trace_opened, claims_trace_concluded]
    rule: >-
      Where `carrier_trace_required`, the agent opens a carrier trace before the claim can be decided;
      it runs `carrier_trace_business_days` business days. The trace concludes with the carrier's answer
      or, when the period ends without one, with trace_result no_response. A Lost in Transit parcel is
      treated as lost on lost_confirmed or no_response (`lost_declaration_basis`); found_in_network
      means the parcel is moving again and the claim is denied as not lost once it is delivered; a
      delivered_confirmed result denies a Lost in Transit Claim with reason delivered_confirmed
      (`delivered_trace_denies_claim`), and the customer may then open a Delivered Not Received Claim.
    eligibility: []
    params:
      per_tier:
        Late Delivery Claim: {carrier_trace_business_days: "=carrier_trace_business_days"}
        Delivered Not Received Claim: {carrier_trace_business_days: "=carrier_trace_business_days"}
        Lost in Transit Claim: {carrier_trace_business_days: "=carrier_trace_business_days"}
        Damaged in Transit Claim: {carrier_trace_business_days: "=carrier_trace_business_days"}
        Missing Item Claim: {carrier_trace_business_days: "=carrier_trace_business_days"}
        Wrong Item Claim: {carrier_trace_business_days: "=carrier_trace_business_days"}

  - id: claims_evt_decision
    subject: [claims_approved, claims_denied]
    rule: >-
      A claim is decided within `decision_sla_business_days` business days of reaching under_review. A
      Late Delivery Claim is approved only for a service whose `delivery_date_guaranteed` is true
      (orders charter) when claims_msr_days_late is at least `late_threshold_calendar_days`; it is
      denied with not_late otherwise, and with guarantee_suspended when the promised delivery date falls
      from `guarantee_suspension_start` through `guarantee_suspension_end`. A Delivered Not Received
      Claim is denied with signature_on_file when the carrier captured a signature at delivery
      (`signature_on_file_denies_claim`) unless a police report is logged. A claim whose compensation
      would exceed `compensation_cap_usd` is not decided by the agent; it is handed to a human
      representative. Missing evidence, a window missed or an excluded cause leads to denial with the
      matching reason; every other complete claim of the right type is approved with its resolution.
    eligibility: []
    measures: [claims_msr_days_late]

  - id: claims_evt_compensation
    subject: [claims_compensation_issued, claims_resolved]
    rule: >-
      An approved claim is made whole by its `default_resolution`. A reshipment sends the same SKU and
      size (`reship_stock_rule`) by `reship_delivery_service` at `reship_shipping_fee_usd` on a
      no-charge order; where `customer_may_choose_refund` the customer may take a merchandise refund
      instead, and when the item cannot be reshipped the claim is refunded (`out_of_stock_resolution`).
      A merchandise refund pays the claimed value (claims_msr_claimed_value) to the original tenders in
      the orders charter's `tender_refund_priority` within `refund_timing_business_days` business days,
      plus the order's shipping fee and surcharge where `refund_includes_shipping_fee`. A Late Delivery
      Claim refunds the effective shipping fee and surcharge paid on the order; when that fee was 0.00
      because of an Unlimited plan, a Marlowe Rewards threshold or a code, it gives a Goodwill Credit of
      `late_delivery_goodwill_usd` instead, within the credit charter's Goodwill Credit caps, and when
      the caps are reached nothing further is owed (`goodwill_cap_fallback`). Compensation is booked
      only while the claim is in status approved. A Lost in Transit Claim resolved by refund or
      reshipment closes the original order as lost_in_transit. Points earned on compensated merchandise
      are not reversed.
    eligibility:
      - id: approved_only
        applies_to: [claims_compensation_issued]
        kind: state
        condition: "Compensation is booked only while the claim is in status approved."
        evidence_fields: [delivery_claims.status, delivery_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_claims.claim_id]
          action_bindings:
            delivery_claims.claim_id: claim_id
        state_contract:
          field: delivery_claims.status
          allowed: [approved]
    params:
      per_tier:
        Late Delivery Claim: {default_resolution: "=default_resolution", late_delivery_goodwill_usd: "=late_delivery_goodwill_usd", refund_includes_shipping_fee: "=refund_includes_shipping_fee"}
        Delivered Not Received Claim: {default_resolution: "=default_resolution", late_delivery_goodwill_usd: "=late_delivery_goodwill_usd", refund_includes_shipping_fee: "=refund_includes_shipping_fee"}
        Lost in Transit Claim: {default_resolution: "=default_resolution", late_delivery_goodwill_usd: "=late_delivery_goodwill_usd", refund_includes_shipping_fee: "=refund_includes_shipping_fee"}
        Damaged in Transit Claim: {default_resolution: "=default_resolution", late_delivery_goodwill_usd: "=late_delivery_goodwill_usd", refund_includes_shipping_fee: "=refund_includes_shipping_fee"}
        Missing Item Claim: {default_resolution: "=default_resolution", late_delivery_goodwill_usd: "=late_delivery_goodwill_usd", refund_includes_shipping_fee: "=refund_includes_shipping_fee"}
        Wrong Item Claim: {default_resolution: "=default_resolution", late_delivery_goodwill_usd: "=late_delivery_goodwill_usd", refund_includes_shipping_fee: "=refund_includes_shipping_fee"}
    measures: [claims_msr_claimed_value]

  - id: claims_evt_appeal
    subject: [claims_appealed]
    rule: >-
      A denied claim can be appealed at most `max_appeals` time. An appeal is accepted only if it is
      made no later than `appeal_window_days` calendar days after the claim is decided. The decision date
      is day zero and the last day of the window still counts. Where `appeal_requires_new_evidence`, at
      least one evidence item must have been logged after the decision date; repeating the original
      account is not an appeal.
    eligibility:
      - id: appeal_window
        applies_to: [claims_appealed]
        kind: time
        condition: "An appeal is accepted only if it is made no later than `appeal_window_days` calendar days after the claim is decided."
        evidence_fields: [delivery_claims.decision_date, delivery_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_claims.claim_id]
          action_bindings:
            delivery_claims.claim_id: claim_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the claim is decided"
          anchor_source: delivery_claims.decision_date
          relation: not_after
          duration_source: variants.appeal_window_days
          unit: calendar_days
          counting_rule: "The decision date is day zero and the last day of the window still counts."
          boundary: inclusive
      - id: one_appeal
        applies_to: [claims_appealed]
        kind: dedup
        condition: "A denied claim can be appealed at most `max_appeals` time."
        evidence_fields: [delivery_claims.appeal_count, delivery_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_claims.claim_id]
          action_bindings:
            delivery_claims.claim_id: claim_id
        dedup_contract:
          table: delivery_claims
          mode: same_record
          object_bindings: {claim_id: claim_id}
          duplicate_filters: {appeal_count: [1]}
          distinct_fields: []

  - id: claims_evt_recovery
    subject: [claims_compensation_recovered]
    rule: >-
      When a parcel compensated on a Delivered Not Received or Lost in Transit Claim turns up, the
      customer either sends it back with a prepaid label within `found_item_return_window_days` calendar
      days or is charged for the units kept (`found_after_compensation_handling`, reason
      found_parcel_kept). On a Wrong Item Claim the wrong item must be sent back with a prepaid label
      within `item_return_window_days` calendar days of approval (`item_return_required`), otherwise its
      net price is charged (`unreturned_item_charge_basis`, reason wrong_item_not_returned). Charges go
      to the original card (`compensation_recovery_method`). A recovery is booked only while the claim is
      in status resolved. Goodwill Credit and shipping fee refunds are never recovered.
    eligibility:
      - id: resolved_only
        applies_to: [claims_compensation_recovered]
        kind: state
        condition: "A recovery is booked only while the claim is in status resolved."
        evidence_fields: [delivery_claims.status, delivery_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_claims.claim_id]
          action_bindings:
            delivery_claims.claim_id: claim_id
        state_contract:
          field: delivery_claims.status
          allowed: [resolved]

  - id: claims_evt_withdrawal
    subject: [claims_withdrawn]
    rule: >-
      Withdrawing a claim is the customer's own decision and is possible only before a decision
      (`withdrawal_before_decision`), while the claim is opened or in carrier trace. A claim is
      withdrawn only on the customer's own confirmation. A withdrawn claim does not count toward the
      repeat limit and frees the order for a new claim of the same type within the reporting window.
    eligibility:
      - id: customer_confirms
        applies_to: [claims_withdrawn]
        kind: caller_fact
        condition: "A claim is withdrawn only on the customer's own confirmation."
        evidence_fields: [delivery_claims.claim_id, delivery_claims.status]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [delivery_claims.claim_id]
          action_bindings:
            delivery_claims.claim_id: claim_id

extended_policies:
  - id: claims_ext_late_delivery_refund
    base_policy_refs: [claims_evt_compensation, claims_evt_decision]
    overwrite:
      - base_policy: claims_evt_compensation
        superseded_clause: >-
          A Late Delivery Claim refunds the effective shipping fee and surcharge paid on the order;
        replaced_by: >-
          The delivery-charge refund on a missed guarantee is worked out from the guarantee refund basis, the lateness share, the repeat-refund share, the reporting share and the tax on the refunded delivery charge, as set out below.
    trigger: state_due
    subject: [claims_compensation_issued]
    computes: amount_usd
    target_tool: book_late_delivery_charge_refund_805d7478
    params:
      one_day_share: 0.50
      two_day_share: 0.75
      island_states: [AK, HI]
      island_allowance_days: 1
      repeat_share_one: 0.75
      repeat_share_two: 0.50
      slow_report_share: 0.90
      late_report_share: 0.80
      top_tiers: [Marlowe Rewards Platinum, Marlowe Rewards Icon, Marlowe Rewards Atelier]
      middle_tiers: [Marlowe Rewards Silver, Marlowe Rewards Gold]
      delivery_taxing_states: [AR, CT, GA, HI, IN, KS, KY, MI, MN, MS, NE, NJ, NM, NY, NC, ND, OH, PA, RI, SC, SD, TN, TX, VT, WA, WV, WI]
      taxable_share_states: [CO, IL, MD]
    rule: >-
      An approved Late Delivery Claim on an order whose effective shipping fee and surcharge together were above 0.00 is owed a delivery-charge refund, booked as one shipping fee refund entry on the claim for the whole parcel.
      The delivery-charge refund on a missed guarantee is worked out from the guarantee refund basis, the
      lateness share, the repeat-refund share, the reporting share and the tax on the refunded delivery
      charge, as set out below.
      The delivery-charge refund on an approved Late Delivery Claim is the order's effective shipping fee
      and surcharge paid, as shown on the order. The refund is rounded to the nearest cent once, on the
      final figure.
      The guarantee refund basis depends on how the fee was reached: where the order's effective shipping
      fee is above 0.00 and equals the list fee of its delivery service less that service's free-shipping credit (a free-shipping credit was taken off and nothing else), and the customer's active Marlowe Rewards tier is Platinum, Icon or Atelier, the guarantee
      refund basis is the list fee of the delivery service plus the surcharge; where the fee was reduced
      in that way and the active tier is Silver or Gold, the guarantee refund basis is the fee paid plus
      half of the credit taken off (half the difference between the list fee and the fee paid) plus the
      surcharge; in every other case the guarantee refund basis is the fee paid plus the surcharge.
      The lateness share depends on the days the guarantee was missed by: a delay of at most one counted
      day refunds `one_day_share` of the guarantee refund basis, a delay of exactly two counted days
      refunds `two_day_share`, and a delay of three or more counted days refunds the whole basis.
      The days the guarantee was missed by are counted on the carrier's delivery days, with the island transit allowance of Alaska and Hawaii: for an Expedited 2-Day order shipped to a state in `island_states`, the counted days are the Monday-to-Friday days after the promised delivery date up to and including the delivered date, less `island_allowance_days` and never below zero; for any other order whose delivery service does not deliver on Saturdays, the counted days are the Monday-to-Friday days in that span; in every other case the counted days are the calendar days from the promised delivery date to the delivered date.
      The repeat-refund share depends on the delivery-charge refunds already paid under delivery claims
      on the customer's orders: counting the order-level refunds with reason delivery claim and no order
      line (refunds of a delivery charge rather than of merchandise) dated in the trailing 12 calendar months, as they stand on the orders' payment records, two or more such refunds pay `repeat_share_two` of the basis, exactly one pays
      `repeat_share_one`, and none leaves the basis whole.
      The reporting share depends on how soon the claim was opened: a claim opened 15 or more calendar
      days after the delivered date pays `late_report_share`, one opened 8 to 14 calendar days after it
      pays `slow_report_share`, and one opened within 7 calendar days pays the whole basis.
      The shares are multiplied together and applied once to the guarantee refund basis, giving the
      refunded delivery charge; they do not act on one another's results.
      The tax on the refunded delivery charge depends on the ship-to state: where the order went to a
      state in `delivery_taxing_states`, the tax is the refunded delivery charge times the order's sales
      tax divided by the order's net merchandise (subtotal less discounts) plus its effective shipping
      fee and surcharge; where the order went to a state in `taxable_share_states`, which taxes a delivery charge only in proportion to the taxable merchandise the parcel carried, that same amount is further multiplied by the order's net merchandise less its gift-card lines, divided by its net merchandise; where the order went to any other state, no tax is added.
      The amount booked is the refunded delivery charge plus that tax, rounded to the nearest cent.
      Booking the entry does not by itself resolve the claim. A claim whose effective shipping fee and surcharge were both 0.00 is owed no delivery-charge refund under this rule.
    prerequisite: []
    cross_category:
      - category: orders
        as: branch
        reads: [promised_delivery_date, delivered_date, variant_name, shipping_fee_usd, surcharge_usd, ship_to_state, sales_tax_usd, merchandise_subtotal_usd, discount_total_usd, order_payments.refund_component, order_lines.product_class]
        note: Delivery dates and service drive the counted days and lateness share; the fee and list fee drive the guarantee refund basis; the payments ledger decides the repeat-refund share.
      - category: loyalty
        as: branch
        reads: [variant_name, status]
        note: The active Marlowe Rewards tier decides the guarantee refund basis for a fee reduced by a free-shipping credit.
    compute:
      - promised_date: "CFIELD('orders','promised_delivery_date', order_id=F('order_id'))"
      - delivered_date: "CFIELD('orders','delivered_date', order_id=F('order_id'))"
      - calendar_days_late: "DAYS(promised_date, delivered_date)"
      - saturday_service: "CPARAM('orders','weekend_delivery', order_id=F('order_id'))"
      - service_name: "CFIELD('orders','variant_name', order_id=F('order_id'))"
      - weekday_days_late: "5 * ((DAYS('2024-01-01', delivered_date) + 1) // 7) + MN((DAYS('2024-01-01', delivered_date) + 1) % 7, 5) - 5 * ((DAYS('2024-01-01', promised_date) + 1) // 7) - MN((DAYS('2024-01-01', promised_date) + 1) % 7, 5)"
      - counted_days_late: "MX(0, weekday_days_late - K('island_allowance_days')) if service_name == 'Expedited 2-Day' and CFIELD('orders','ship_to_state', order_id=F('order_id')) in K('island_states') else (weekday_days_late if not saturday_service else calendar_days_late)"
      - lateness_share: "K('one_day_share') if counted_days_late <= 1 else (K('two_day_share') if counted_days_late == 2 else 1.0)"
      - fee_paid: "CFIELD('orders','shipping_fee_usd', order_id=F('order_id'))"
      - surcharge: "CFIELD('orders','surcharge_usd', order_id=F('order_id'))"
      - list_fee: "CPARAM('orders','shipping_fee_usd', order_id=F('order_id'))"
      - free_credit: "CPARAM('orders','free_shipping_credit_usd', order_id=F('order_id'))"
      - member_tier: "CFIELD('loyalty','variant_name', status='active')"
      - refund_basis: "list_fee + surcharge if fee_paid > 0 and ABS(list_fee - free_credit - fee_paid) < 0.005 and member_tier in K('top_tiers') else (fee_paid + (list_fee - fee_paid) / 2 + surcharge if fee_paid > 0 and ABS(list_fee - free_credit - fee_paid) < 0.005 and member_tier in K('middle_tiers') else fee_paid + surcharge)"
      - prior_delivery_refunds: "XCOUNT('orders','order_payments', within_months=12, event_type='orders_payment_refunded', refund_component='delivery_claim', booked_line_id=None)"
      - repeat_share: "K('repeat_share_two') if prior_delivery_refunds >= 2 else (K('repeat_share_one') if prior_delivery_refunds == 1 else 1.0)"
      - report_days: "DAYS(delivered_date, F('opened_date'))"
      - report_share: "K('late_report_share') if report_days >= 15 else (K('slow_report_share') if report_days >= 8 else 1.0)"
      - refunded_charge: "refund_basis * lateness_share * repeat_share * report_share"
      - ship_state: "CFIELD('orders','ship_to_state', order_id=F('order_id'))"
      - order_tax: "CFIELD('orders','sales_tax_usd', order_id=F('order_id'))"
      - net_merchandise: "CFIELD('orders','merchandise_subtotal_usd', order_id=F('order_id')) - CFIELD('orders','discount_total_usd', order_id=F('order_id'))"
      - gift_card_merchandise: "XSUM('orders','order_lines','amount_usd', order_id=F('order_id'), event_type='orders_line_booked', product_class='egift_card') + XSUM('orders','order_lines','amount_usd', order_id=F('order_id'), event_type='orders_line_booked', product_class='plastic_gift_card')"
      - delivery_tax: "refunded_charge * order_tax / (net_merchandise + fee_paid + surcharge) if ship_state in K('delivery_taxing_states') else (refunded_charge * order_tax / (net_merchandise + fee_paid + surcharge) * (net_merchandise - gift_card_merchandise) / net_merchandise if ship_state in K('taxable_share_states') else 0)"
      - result: "RND(refunded_charge + delivery_tax, 2)"
    compute_basis:
      promised_date: "The days the guarantee was missed by are counted only on the days the delivery service delivers:"
      delivered_date: "after the promised delivery date up to and including the delivered date;"
      calendar_days_late: "in every other case the counted days are the calendar days from the promised delivery date to the delivered date."
      saturday_service: "for any other order whose delivery service does not deliver on Saturdays, the counted days are the Monday-to-Friday days in that span;"
      service_name: "for an Expedited 2-Day order shipped to a state in `island_states`,"
      weekday_days_late: "the counted days are the Monday-to-Friday days after the promised delivery date up to and including the delivered date,"
      counted_days_late: "The days the guarantee was missed by are counted on the carrier's delivery days, with the island transit allowance of Alaska and Hawaii: for an Expedited 2-Day order shipped to a state in `island_states`, the counted days are the Monday-to-Friday days after the promised delivery date up to and including the delivered date, less `island_allowance_days` and never below zero; for any other order whose delivery service does not deliver on Saturdays, the counted days are the Monday-to-Friday days in that span; in every other case the counted days are the calendar days from the promised delivery date to the delivered date."
      lateness_share: "The lateness share depends on the days the guarantee was missed by: a delay of at most one counted day refunds `one_day_share` of the guarantee refund basis, a delay of exactly two counted days refunds `two_day_share`, and a delay of three or more counted days refunds the whole basis."
      fee_paid: "The delivery-charge refund on an approved Late Delivery Claim is the order's effective shipping fee and surcharge paid, as shown on the order."
      surcharge: "The delivery-charge refund on an approved Late Delivery Claim is the order's effective shipping fee and surcharge paid, as shown on the order."
      list_fee: "where the order's effective shipping fee is above 0.00 and equals the list fee of its delivery service less that service's free-shipping credit (a free-shipping credit was taken off and nothing else),"
      free_credit: "less that service's free-shipping credit (a free-shipping credit was taken off and nothing else),"
      member_tier: "and the customer's active Marlowe Rewards tier is Platinum, Icon or Atelier,"
      refund_basis: "The guarantee refund basis depends on how the fee was reached: where the order's effective shipping fee is above 0.00 and equals the list fee of its delivery service less that service's free-shipping credit (a free-shipping credit was taken off and nothing else), and the customer's active Marlowe Rewards tier is Platinum, Icon or Atelier, the guarantee refund basis is the list fee of the delivery service plus the surcharge; where the fee was reduced in that way and the active tier is Silver or Gold, the guarantee refund basis is the fee paid plus half of the credit taken off (half the difference between the list fee and the fee paid) plus the surcharge; in every other case the guarantee refund basis is the fee paid plus the surcharge."
      prior_delivery_refunds: "counting the order-level refunds with reason delivery claim and no order line (refunds of a delivery charge rather than of merchandise) dated in the trailing 12 calendar months,"
      repeat_share: "two or more such refunds pay `repeat_share_two` of the basis, exactly one pays `repeat_share_one`, and none leaves the basis whole."
      report_days: "The reporting share depends on how soon the claim was opened:"
      report_share: "a claim opened 15 or more calendar days after the delivered date pays `late_report_share`, one opened 8 to 14 calendar days after it pays `slow_report_share`, and one opened within 7 calendar days pays the whole basis."
      refunded_charge: "The shares are multiplied together and applied once to the guarantee refund basis, giving the refunded delivery charge; they do not act on one another's results."
      ship_state: "The tax on the refunded delivery charge depends on the ship-to state:"
      order_tax: "the tax is the refunded delivery charge times the order's sales tax divided by the order's net merchandise (subtotal less discounts) plus its effective shipping fee and surcharge;"
      net_merchandise: "the order's net merchandise (subtotal less discounts)"
      gift_card_merchandise: "that same amount is further multiplied by the order's net merchandise less its gift-card lines, divided by its net merchandise;"
      delivery_tax: "where the order went to a state in `delivery_taxing_states`, the tax is the refunded delivery charge times the order's sales tax divided by the order's net merchandise (subtotal less discounts) plus its effective shipping fee and surcharge; where the order went to a state in `taxable_share_states`, which taxes a delivery charge only in proportion to the taxable merchandise the parcel carried, that same amount is further multiplied by the order's net merchandise less its gift-card lines, divided by its net merchandise; where the order went to any other state, no tax is added."
      result: "The amount booked is the refunded delivery charge plus that tax, rounded to the nearest cent."
    factors:
      - id: lateness_share
        effect: parameter
        decides: lateness_share
        bindings: [calendar_days_late, lateness_share]
        ladder:
          - when: "the guarantee was missed by at most one counted day"
            value: "K('one_day_share')"
          - when: "the guarantee was missed by exactly two counted days"
            value: "K('two_day_share')"
          - when: "otherwise (three or more counted days)"
            value: "the whole basis (1.0)"
        baseline:
          lateness_share: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: delivery_day_count
        effect: method
        decides: counted_days_late
        bindings: [weekday_days_late, counted_days_late]
        ladder:
          - when: "an Expedited 2-Day order shipped to a state in the island list (Alaska, Hawaii)"
            method: "count the Monday-to-Friday days after the promised delivery date up to and including the delivered date, less K('island_allowance_days'), never below zero"
          - when: "any other order whose delivery service does not deliver on Saturdays"
            method: "count the Monday-to-Friday days in that span"
          - when: "otherwise"
            method: "count the calendar days from the promised delivery date to the delivered date"
        baseline:
          counted_days_late: "calendar_days_late"
        evidence: [date]
        cross_difficulty: null
      - id: guarantee_refund_basis
        effect: method
        decides: refund_basis
        bindings: [member_tier, refund_basis]
        ladder:
          - when: "the fee paid is above 0.00 and equals the service's list fee less its free-shipping credit (a free-shipping credit was taken off and nothing else), and the active Rewards tier is Platinum, Icon or Atelier"
            method: "the list fee of the delivery service plus the surcharge"
          - when: "the fee was reduced in that way and the active Rewards tier is Silver or Gold"
            method: "the fee paid plus half the credit taken off plus the surcharge"
          - when: "otherwise"
            method: "the fee paid plus the surcharge"
        baseline:
          refund_basis: "fee_paid + surcharge"
        evidence: [cross_category, tier_param]
        cross_difficulty: loyalty
      - id: repeat_refund_share
        effect: parameter
        decides: repeat_share
        bindings: [prior_delivery_refunds, repeat_share]
        ladder:
          - when: "two or more delivery-charge refunds under delivery claims on the customer's orders in the trailing 12 months"
            value: "K('repeat_share_two')"
          - when: "exactly one such refund"
            value: "K('repeat_share_one')"
          - when: "otherwise (none)"
            value: "the whole basis (1.0)"
        baseline:
          repeat_share: "1.0"
        evidence: [history, cross_category]
        cross_difficulty: null
      - id: reporting_share
        effect: parameter
        decides: report_share
        bindings: [report_days, report_share]
        ladder:
          - when: "the claim was opened 15 or more calendar days after the delivered date"
            value: "K('late_report_share')"
          - when: "the claim was opened 8 to 14 calendar days after the delivered date"
            value: "K('slow_report_share')"
          - when: "otherwise (within 7 calendar days)"
            value: "the whole basis (1.0)"
        baseline:
          report_share: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: refunded_delivery_tax
        effect: method
        decides: delivery_tax
        bindings: [ship_state, gift_card_merchandise, delivery_tax]
        ladder:
          - when: "the order went to a state in the delivery-taxing list"
            method: "refunded delivery charge times the order's sales tax over its net merchandise plus effective fee and surcharge"
          - when: "the order went to a state in the taxable-share list"
            method: "that same amount times the order's net merchandise less gift-card lines over its net merchandise"
          - when: "otherwise (any other state)"
            method: "no tax added"
        baseline:
          delivery_tax: "0"
        evidence: [cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        The delivery-charge refund on an approved Late Delivery Claim is the order's effective shipping fee
        and surcharge paid, as shown on the order. The refund is rounded to the nearest cent once, on the
        final figure.
      params: []
    inputs:
      history:
        - {category: orders, table: order_payments, aggregate: count, field: payment_id, within_months: 12, filters: {event_type: orders_payment_refunded, refund_component: delivery_claim}}
      cross_category: [orders, loyalty]

  - id: claims_ext_late_goodwill
    base_policy_refs: [claims_evt_compensation, claims_evt_decision]
    overwrite:
      - base_policy: claims_evt_compensation
        superseded_clause: >-
          when that fee was 0.00 because of an Unlimited plan, a Marlowe Rewards threshold or a code, it gives a Goodwill Credit of `late_delivery_goodwill_usd` instead,
        replaced_by: >-
          A missed delivery guarantee is made good up to the late-delivery make-good amount: any delivery-charge refund on the claim counts toward that amount, and a Goodwill Credit pays the part of it the refund leaves uncovered.
    trigger: state_due
    subject: [claims_compensation_issued]
    computes: amount_usd
    target_tool: book_late_delivery_goodwill_699f3402
    params:
      per_day_usd: 4.00
      mid_lateness_multiplier: 1.5
      nextday_plan_supplement: 10.00
      plan_supplement: 5.00
      plan_live_statuses: [trial, active, cancellation_pending]
      spend_floor: 400.00
      order_floor: 3
      loyal_multiplier: 1.25
      steady_multiplier: 1.10
      repeat_multiplier: 0.75
      frequent_multiplier: 0.50
      high_value_floor: 300.00
      mid_value_floor: 150.00
      high_value_supplement: 10.00
      mid_value_supplement: 5.00
      same_day_supplement: 10.00
      next_day_supplement: 5.00
    rule: >-
      An approved Late Delivery Claim is owed a Goodwill Credit wherever its make-good amount is not
      covered by the delivery-charge refund booked on it, booked as one goodwill credit entry on the claim
      for the whole parcel.
      A missed delivery guarantee is made good up to the late-delivery make-good amount: any
      delivery-charge refund on the claim counts toward that amount, and a Goodwill Credit pays the part of
      it the refund leaves uncovered.
      The Goodwill Credit on a Late Delivery Claim is fixed only after any delivery-charge refund owed on
      the claim stands on it as a compensation entry.
      The late-delivery make-good amount is the claim type's `late_delivery_goodwill_usd`. The Goodwill
      Credit is the make-good amount less the delivery-charge refund entries booked on the claim, never
      below 0.00, rounded to the nearest cent on the final figure. It is given within the credit
      charter's Goodwill Credit caps: no more than the customer's remaining value allowance for the
      trailing 12 months (the Goodwill Credit `annual_issue_cap_usd` less the initial value of the Goodwill
      Credits issued to the customer in the trailing 12 calendar months), nothing once the customer has
      received the `annual_issue_cap_count` of Goodwill Credits in that window, and nothing where the
      figure falls below the Goodwill Credit `min_issue_value_usd` (`goodwill_cap_fallback`).
      The lateness amount of the make-good depends on how many calendar days the delivered date fell
      after the promised delivery date: a delivery 4 or more calendar days late accrues `per_day_usd` for
      each calendar day late; a delivery 2 or 3 calendar days late pays the claim type's
      `late_delivery_goodwill_usd` times `mid_lateness_multiplier`; any other delivery pays the claim
      type's `late_delivery_goodwill_usd`.
      The Unlimited plan supplement depends on the customer's Marlowe & Finch Unlimited membership: an
      Unlimited Next-Day Annual membership in status trial, active or cancellation_pending adds
      `nextday_plan_supplement`; any other Unlimited plan in one of those statuses adds
      `plan_supplement`; a customer with no such membership gets no supplement.
      The order value supplement depends on the late order's net merchandise (subtotal less discounts):
      `high_value_floor` or more adds `high_value_supplement`, from `mid_value_floor` up to but not
      including `high_value_floor` adds `mid_value_supplement`, and less than `mid_value_floor` adds
      nothing.
      The service supplement depends on the guaranteed delivery service that was missed: Same-Day Courier
      adds `same_day_supplement`, Next Business Day adds `next_day_supplement`, and Expedited 2-Day adds
      nothing.
      The shopping-relationship multiplier depends on the customer's orders in the trailing 12 calendar
      months: merchandise booked on them totalling `spend_floor` or more together with at least
      `order_floor` orders placed multiplies the make-good by `loyal_multiplier`; merchandise of
      `spend_floor` or more on fewer than `order_floor` orders multiplies it by `steady_multiplier`; any
      other customer keeps the make-good as it is.
      The goodwill frequency multiplier depends on the Goodwill Credits issued to the customer in the
      trailing 12 calendar months: two or more multiply the make-good by `frequent_multiplier`, exactly one
      by `repeat_multiplier`, and none leaves it as it is.
      The make-good amount is figured in this order: first the lateness amount, the Unlimited plan
      supplement, the order value supplement and the service supplement are added together; that sum is
      then multiplied by the shopping-relationship multiplier and by the goodwill frequency multiplier;
      the delivery-charge refund is then taken off that product, and the caps apply to what remains.
      Booking the entry does not by itself resolve the claim.
    prerequisite:
      - problem: claims_ext_late_delivery_refund
        kind: value_input
        gate: delivery_refund_booked
        form: state
        policy_source: >-
          The Goodwill Credit on a Late Delivery Claim is fixed only after any delivery-charge refund owed on the claim stands on it as a compensation entry.
        condition: >-
          The Late Delivery Claim carries a claims_compensation_issued entry of type shipping_fee_refund for the delivery-charge refund its order's fee owes, or the order's fee and surcharge were 0.00 so that none is owed.
        resolved_by: book_late_delivery_charge_refund_805d7478
        effect: >-
          The delivery-charge refund entries summed on the claim rise from 0.00 to the booked refund, which is taken off the make-good amount, so the Goodwill Credit falls by that refund.
    cross_category:
      - category: orders
        as: branch
        reads: [promised_delivery_date, delivered_date, variant_name, merchandise_subtotal_usd, discount_total_usd, order_lines.amount_usd, orders.placed_date]
        note: Delivery dates give the lateness amount; the service and the order value give their supplements; the 12-month order history gives the shopping-relationship multiplier.
      - category: pass
        as: branch
        reads: [variant_name, status]
        note: The Unlimited plan held decides the plan supplement.
      - category: credit
        as: history
        reads: [credit_instruments.issued_date, credit_instruments.initial_value_usd, annual_issue_cap_usd, annual_issue_cap_count, min_issue_value_usd]
        note: The Goodwill Credits issued in the trailing 12 months decide the goodwill frequency multiplier and the caps.
    compute:
      - promised_date: "CFIELD('orders','promised_delivery_date', order_id=F('order_id'))"
      - delivered_date: "CFIELD('orders','delivered_date', order_id=F('order_id'))"
      - calendar_days_late: "DAYS(promised_date, delivered_date)"
      - base_goodwill: "P('late_delivery_goodwill_usd')"
      - lateness_amount: "calendar_days_late * K('per_day_usd') if calendar_days_late >= 4 else (base_goodwill * K('mid_lateness_multiplier') if calendar_days_late >= 2 else base_goodwill)"
      - plan_name: "CFIELD('pass','variant_name')"
      - plan_status: "CFIELD('pass','status')"
      - plan_supplement: "K('nextday_plan_supplement') if plan_name == 'Unlimited Next-Day Annual' and plan_status in K('plan_live_statuses') else (K('plan_supplement') if plan_name != None and plan_status in K('plan_live_statuses') else 0)"
      - order_net: "CFIELD('orders','merchandise_subtotal_usd', order_id=F('order_id')) - CFIELD('orders','discount_total_usd', order_id=F('order_id'))"
      - value_supplement: "K('high_value_supplement') if order_net >= K('high_value_floor') else (K('mid_value_supplement') if order_net >= K('mid_value_floor') else 0)"
      - service: "CFIELD('orders','variant_name', order_id=F('order_id'))"
      - service_supplement: "K('same_day_supplement') if service == 'Same-Day Courier' else (K('next_day_supplement') if service == 'Next Business Day' else 0)"
      - spend_12m: "XSUM('orders','order_lines','amount_usd', within_months=12, event_type='orders_line_booked')"
      - orders_12m: "XCOUNT('orders','orders', within_months=12, date_field='placed_date')"
      - relationship_multiplier: "K('loyal_multiplier') if spend_12m >= K('spend_floor') and orders_12m >= K('order_floor') else (K('steady_multiplier') if spend_12m >= K('spend_floor') and orders_12m < K('order_floor') else 1.0)"
      - goodwill_12m_count: "XCOUNT('credit','credit_instruments', within_months=12, date_field='issued_date', variant_name='Goodwill Credit')"
      - frequency_multiplier: "K('frequent_multiplier') if goodwill_12m_count >= 2 else (K('repeat_multiplier') if goodwill_12m_count == 1 else 1.0)"
      - make_good: "(lateness_amount + plan_supplement + value_supplement + service_supplement) * relationship_multiplier * frequency_multiplier"
      - delivery_refund_booked: "SUM('claim_events','amount_usd', event_type='claims_compensation_issued', compensation_type='shipping_fee_refund')"
      - top_up: "MX(0, make_good - delivery_refund_booked)"
      - goodwill_12m_value: "XSUM('credit','credit_instruments','initial_value_usd', within_months=12, date_field='issued_date', variant_name='Goodwill Credit')"
      - allowance: "MX(0, CPARAM('credit','annual_issue_cap_usd', variant_name='Goodwill Credit') - goodwill_12m_value)"
      - capped: "0 if goodwill_12m_count >= CPARAM('credit','annual_issue_cap_count', variant_name='Goodwill Credit') else MN(top_up, allowance)"
      - result: "RND(capped, 2) if capped >= CPARAM('credit','min_issue_value_usd', variant_name='Goodwill Credit') else 0"
    compute_basis:
      promised_date: "how many calendar days the delivered date fell after the promised delivery date"
      delivered_date: "how many calendar days the delivered date fell after the promised delivery date"
      calendar_days_late: "The lateness amount of the make-good depends on how many calendar days the delivered date fell after the promised delivery date:"
      base_goodwill: "The late-delivery make-good amount is the claim type's `late_delivery_goodwill_usd`."
      lateness_amount: "a delivery 4 or more calendar days late accrues `per_day_usd` for each calendar day late; a delivery 2 or 3 calendar days late pays the claim type's `late_delivery_goodwill_usd` times `mid_lateness_multiplier`; any other delivery pays the claim type's `late_delivery_goodwill_usd`."
      plan_name: "The Unlimited plan supplement depends on the customer's Marlowe & Finch Unlimited membership:"
      plan_status: "in status trial, active or cancellation_pending"
      plan_supplement: "an Unlimited Next-Day Annual membership in status trial, active or cancellation_pending adds `nextday_plan_supplement`; any other Unlimited plan in one of those statuses adds `plan_supplement`; a customer with no such membership gets no supplement."
      order_net: "The order value supplement depends on the late order's net merchandise (subtotal less discounts):"
      value_supplement: "`high_value_floor` or more adds `high_value_supplement`, from `mid_value_floor` up to but not including `high_value_floor` adds `mid_value_supplement`, and less than `mid_value_floor` adds nothing."
      service: "The service supplement depends on the guaranteed delivery service that was missed:"
      service_supplement: "Same-Day Courier adds `same_day_supplement`, Next Business Day adds `next_day_supplement`, and Expedited 2-Day adds nothing."
      spend_12m: "merchandise booked on them totalling `spend_floor` or more"
      orders_12m: "together with at least `order_floor` orders placed"
      relationship_multiplier: "The shopping-relationship multiplier depends on the customer's orders in the trailing 12 calendar months: merchandise booked on them totalling `spend_floor` or more together with at least `order_floor` orders placed multiplies the make-good by `loyal_multiplier`; merchandise of `spend_floor` or more on fewer than `order_floor` orders multiplies it by `steady_multiplier`; any other customer keeps the make-good as it is."
      goodwill_12m_count: "The goodwill frequency multiplier depends on the Goodwill Credits issued to the customer in the trailing 12 calendar months:"
      frequency_multiplier: "two or more multiply the make-good by `frequent_multiplier`, exactly one by `repeat_multiplier`, and none leaves it as it is."
      make_good: "first the lateness amount, the Unlimited plan supplement, the order value supplement and the service supplement are added together; that sum is then multiplied by the shopping-relationship multiplier and by the goodwill frequency multiplier;"
      delivery_refund_booked: "The Goodwill Credit is the make-good amount less the delivery-charge refund entries booked on the claim, never below 0.00,"
      top_up: "the delivery-charge refund is then taken off that product, and the caps apply to what remains."
      goodwill_12m_value: "the Goodwill Credit `annual_issue_cap_usd` less the initial value of the Goodwill Credits issued to the customer in the trailing 12 calendar months"
      allowance: "no more than the customer's remaining value allowance for the trailing 12 months"
      capped: "nothing once the customer has received the `annual_issue_cap_count` of Goodwill Credits in that window,"
      result: "rounded to the nearest cent on the final figure. ... and nothing where the figure falls below the Goodwill Credit `min_issue_value_usd` (`goodwill_cap_fallback`)."
    factors:
      - id: lateness_amount
        effect: method
        decides: lateness_amount
        bindings: [calendar_days_late, lateness_amount]
        ladder:
          - when: "the delivered date fell 4 or more calendar days after the promised delivery date"
            method: "accrue K('per_day_usd') for each calendar day late"
          - when: "the delivered date fell 2 or 3 calendar days after the promised delivery date"
            method: "the claim type's late_delivery_goodwill_usd times K('mid_lateness_multiplier')"
          - when: "otherwise"
            method: "the claim type's late_delivery_goodwill_usd as it stands"
        baseline:
          lateness_amount: "base_goodwill"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: unlimited_plan_supplement
        effect: parameter
        decides: plan_supplement
        bindings: [plan_name, plan_status, plan_supplement]
        ladder:
          - when: "an Unlimited Next-Day Annual membership in status trial, active or cancellation_pending"
            value: "K('nextday_plan_supplement')"
          - when: "any other Unlimited plan in one of those statuses"
            value: "K('plan_supplement')"
          - when: "otherwise"
            value: "0"
        baseline:
          plan_supplement: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: order_value_supplement
        effect: parameter
        decides: value_supplement
        bindings: [order_net, value_supplement]
        ladder:
          - when: "the late order's net merchandise is K('high_value_floor') or more"
            value: "K('high_value_supplement')"
          - when: "it is from K('mid_value_floor') up to but not including K('high_value_floor')"
            value: "K('mid_value_supplement')"
          - when: "otherwise"
            value: "0"
        baseline:
          value_supplement: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: service_supplement
        effect: parameter
        decides: service_supplement
        bindings: [service, service_supplement]
        ladder:
          - when: "the missed service is Same-Day Courier"
            value: "K('same_day_supplement')"
          - when: "the missed service is Next Business Day"
            value: "K('next_day_supplement')"
          - when: "otherwise (Expedited 2-Day)"
            value: "0"
        baseline:
          service_supplement: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: shopping_relationship
        effect: parameter
        decides: relationship_multiplier
        bindings: [spend_12m, orders_12m, relationship_multiplier]
        ladder:
          - when: "12-month booked merchandise of K('spend_floor') or more and at least K('order_floor') orders placed in that window"
            value: "K('loyal_multiplier')"
          - when: "12-month booked merchandise of K('spend_floor') or more and fewer than K('order_floor') orders placed"
            value: "K('steady_multiplier')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          relationship_multiplier: "1.0"
        evidence: [history, cross_category]
        cross_difficulty: null
      - id: goodwill_frequency
        effect: parameter
        decides: frequency_multiplier
        bindings: [goodwill_12m_count, frequency_multiplier]
        ladder:
          - when: "two or more Goodwill Credits issued to the customer in the trailing 12 calendar months"
            value: "K('frequent_multiplier')"
          - when: "exactly one"
            value: "K('repeat_multiplier')"
          - when: "otherwise (none)"
            value: "1.0"
        baseline:
          frequency_multiplier: "1.0"
        evidence: [history, cross_category]
        cross_difficulty: credit
    baseline:
      rule: >-
        The late-delivery make-good amount is the claim type's `late_delivery_goodwill_usd`. The Goodwill
        Credit is the make-good amount less the delivery-charge refund entries booked on the claim, never
        below 0.00, rounded to the nearest cent on the final figure.
      params: [late_delivery_goodwill_usd]
    inputs:
      history:
        - {table: claim_events, aggregate: sum, field: amount_usd, filters: {event_type: claims_compensation_issued, compensation_type: shipping_fee_refund}}
        - {category: credit, table: credit_instruments, aggregate: count, field: instrument_id, within_months: 12, filters: {variant_name: Goodwill Credit}}
        - {category: orders, table: order_lines, aggregate: sum, field: amount_usd, within_months: 12, filters: {event_type: orders_line_booked}}
      cross_category: [orders, pass, credit]

  - id: claims_ext_found_parcel_charge
    base_policy_refs: [claims_evt_recovery]
    overwrite:
      - base_policy: claims_evt_recovery
        superseded_clause: >-
          When a parcel compensated on a Delivered Not Received or Lost in Transit Claim turns up, the customer either sends it back with a prepaid label within `found_item_return_window_days` calendar days or is charged for the units kept (`found_after_compensation_handling`, reason found_parcel_kept).
        replaced_by: >-
          When a parcel compensated on a Delivered Not Received or Lost in Transit Claim turns up, the customer either sends it back with a prepaid label within `found_item_return_window_days` calendar days or keeps it and is charged the found-parcel charge worked out below, reason found_parcel_kept.
    trigger: on_request
    subject: [claims_compensation_recovered]
    computes: amount_usd
    target_tool: authorize_found_parcel_charge_f3b6f0d4
    params:
      season_days: 60
      recent_days: 30
      season_markdown: 0.30
      recent_markdown: 0.15
      top_tiers: [Marlowe Rewards Platinum, Marlowe Rewards Icon, Marlowe Rewards Atelier]
      middle_tiers: [Marlowe Rewards Silver, Marlowe Rewards Gold]
      long_membership_months: 120
      steady_membership_months: 60
      top_tier_courtesy: 0.15
      middle_tier_courtesy: 0.10
      active_courtesy: 0.05
      regular_courtesy: 0.02
      express_services: [Next Business Day, Same-Day Courier]
      express_courtesy: 0.10
      two_day_courtesy: 0.05
      aged_share: 0.50
      mid_share: 0.75
      footwear_label: 12.00
      apparel_label: 8.00
      accessories_label: 6.00
    rule: >-
      When a parcel compensated on a Delivered Not Received or Lost in Transit Claim turns up, the customer
      either sends it back with a prepaid label within `found_item_return_window_days` calendar days or
      keeps it and is charged the found-parcel charge worked out below, reason found_parcel_kept.
      Keeping the parcel and paying for it is the customer's own decision: the customer authorizes the
      found-parcel charge personally, for the order line whose units they keep, and the charge goes to the original card. A found-parcel charge is booked only while the claim is in status resolved. A found-parcel charge is not taken until the compensation owed on each of the
      customer's other approved claims has been booked.
      The found-parcel charge is the merchandise compensation booked on the claim for the line kept (the
      merchandise refund entries on that line, tax share included), for the units compensated on that line, all of which the customer keeps,
      rounded to the nearest cent on the final figure.
      The charge base depends on the age of the order and the price the line sold at: for a line sold at
      regular price on an order placed more than `season_days` calendar days before today, the charge base
      is the line's booked unit price times the units compensated on that line, less `season_markdown` of it, with no tax
      share; for a regular-price line on an order placed more than `recent_days` and at most
      `season_days` calendar days before today, the charge base is the merchandise compensation for the
      line less `recent_markdown` of it; in every other case the charge base is the merchandise
      compensation for the line.
      The loyalty courtesy depends on the customer's active Marlowe Rewards membership: Platinum, Icon or
      Atelier held on a membership open for `long_membership_months` months or more gives
      `top_tier_courtesy`; Silver or Gold held on a membership open for `steady_membership_months` months
      or more gives `middle_tier_courtesy`; any other customer gets no loyalty courtesy.
      The engagement courtesy depends on the points earnings posted to the customer's membership in the
      trailing 12 calendar months: four or more earnings give `active_courtesy`, two or three give
      `regular_courtesy`, and fewer give none.
      The service courtesy depends on the delivery service the parcel was sent by: Next Business Day or
      Same-Day Courier gives `express_courtesy`, Expedited 2-Day gives `two_day_courtesy`, and any other
      service gives none.
      The recovery share depends on how long ago the claim was resolved: 60 or more calendar days before
      today charges `aged_share` of the courtesy-reduced base, 30 to 59 calendar days charges `mid_share`,
      and fewer than 30 days charges all of it.
      The label saving depends on the merchandise class of the line kept: footwear takes
      `footwear_label` off the charge, apparel `apparel_label`, accessories `accessories_label`, and any
      other class nothing.
      The charge is figured in this order: the loyalty, engagement and service courtesies are added into
      one courtesy rate, which is applied once to the charge base; the result is multiplied by the
      recovery share; the label saving is then taken off; the charge is never below 0.00 and is rounded
      to the nearest cent on the final figure. Goodwill Credit and delivery-charge refunds on the claim are
      not part of the charge.
    prerequisite:
      - problem: claims_ext_late_goodwill
        kind: state_gate
        gate: claim_events.compensation_type
        form: action
        policy_source: >-
          A found-parcel charge is not taken until the compensation owed on each of the customer's other approved claims has been booked.
        fallback_reason: >-
          The compensation owed on another approved claim is booked by different writes depending on that claim's type and delivery charge — a delivery-charge refund, a Goodwill Credit, a merchandise refund — so no single record state names one write; the dependency is therefore stated as the business action of booking that claim's owed compensation.
        condition: >-
          Every other claim of the customer in status approved carries every compensation entry this charter owes on it; for an approved Late Delivery Claim that is its delivery-charge refund entry and its Goodwill Credit entry where one is owed.
        resolved_by: book_late_delivery_goodwill_699f3402
        effect: >-
          Once the other approved claim's Goodwill Credit entry (the last of its owed compensation) is booked, the found-parcel charge may be taken.
    cross_category:
      - category: orders
        as: branch
        reads: [placed_date, variant_name, order_lines.unit_price_usd, order_lines.price_type, order_lines.product_class]
        note: The order's age and the line's price type give the charge base; the service gives the service courtesy; the merchandise class gives the label saving.
      - category: loyalty
        as: history
        reads: [variant_name, enrolled_date, status, loyalty_ledger.event_type, loyalty_ledger.posting_date]
        note: The active tier and membership age give the loyalty courtesy; the earnings posted in the trailing 12 months give the engagement courtesy.
    compute:
      - kept_line: "LATEST('claim_events','booked_line_id', event_type='claims_compensation_issued', compensation_type='merchandise_refund')"
      - compensated_value: "SUM('claim_events','amount_usd', event_type='claims_compensation_issued', compensation_type='merchandise_refund', booked_line_id=kept_line)"
      - compensated_units: "SUM('claim_events','quantity', event_type='claims_compensation_issued', compensation_type='merchandise_refund', booked_line_id=kept_line)"
      - placed_date: "CFIELD('orders','placed_date', order_id=F('order_id'))"
      - days_since_order: "DAYS(placed_date, NOW)"
      - unit_price: "XLATEST('orders','order_lines','unit_price_usd', order_line_id=kept_line)"
      - price_type: "XLATEST('orders','order_lines','price_type', order_line_id=kept_line)"
      - charge_base: "unit_price * compensated_units * (1 - K('season_markdown')) if days_since_order > K('season_days') and price_type == 'regular' else (compensated_value * (1 - K('recent_markdown')) if days_since_order > K('recent_days') and price_type == 'regular' else compensated_value)"
      - member_tier: "CFIELD('loyalty','variant_name', status='active')"
      - membership_months: "MONTHS(CFIELD('loyalty','enrolled_date', status='active'), NOW)"
      - loyalty_courtesy: "K('top_tier_courtesy') if member_tier in K('top_tiers') and membership_months >= K('long_membership_months') else (K('middle_tier_courtesy') if member_tier in K('middle_tiers') and membership_months >= K('steady_membership_months') else 0)"
      - earnings_12m: "XCOUNT('loyalty','loyalty_ledger', within_months=12, date_field='posting_date', event_type='loyalty_points_earned')"
      - engagement_courtesy: "K('active_courtesy') if earnings_12m >= 4 else (K('regular_courtesy') if earnings_12m >= 2 else 0)"
      - service: "CFIELD('orders','variant_name', order_id=F('order_id'))"
      - service_courtesy: "K('express_courtesy') if service in K('express_services') else (K('two_day_courtesy') if service == 'Expedited 2-Day' else 0)"
      - days_since_resolved: "DAYS(F('resolved_date'), NOW)"
      - recovery_share: "K('aged_share') if days_since_resolved >= 60 else (K('mid_share') if days_since_resolved >= 30 else 1.0)"
      - product_class: "XLATEST('orders','order_lines','product_class', order_line_id=kept_line)"
      - label_saving: "K('footwear_label') if product_class == 'footwear' else (K('apparel_label') if product_class == 'apparel' else (K('accessories_label') if product_class == 'accessories' else 0))"
      - courtesy_rate: "loyalty_courtesy + engagement_courtesy + service_courtesy"
      - result: "RND(MX(0, charge_base * (1 - courtesy_rate) * recovery_share - label_saving), 2)"
    compute_basis:
      kept_line: "for the order line whose units they keep"
      compensated_value: "The found-parcel charge is the merchandise compensation booked on the claim for the line kept (the merchandise refund entries on that line, tax share included),"
      compensated_units: "for the units compensated on that line, all of which the customer keeps,"
      placed_date: "on an order placed more than `season_days` calendar days before today,"
      days_since_order: "The charge base depends on the age of the order and the price the line sold at:"
      unit_price: "the charge base is the line's booked unit price times the units compensated on that line, less `season_markdown` of it, with no tax share;"
      price_type: "for a line sold at regular price"
      charge_base: "for a line sold at regular price on an order placed more than `season_days` calendar days before today, the charge base is the line's booked unit price times the units compensated on that line, less `season_markdown` of it, with no tax share; for a regular-price line on an order placed more than `recent_days` and at most `season_days` calendar days before today, the charge base is the merchandise compensation for the line less `recent_markdown` of it; in every other case the charge base is the merchandise compensation for the line."
      member_tier: "The loyalty courtesy depends on the customer's active Marlowe Rewards membership:"
      membership_months: "held on a membership open for `long_membership_months` months or more"
      loyalty_courtesy: "Platinum, Icon or Atelier held on a membership open for `long_membership_months` months or more gives `top_tier_courtesy`; Silver or Gold held on a membership open for `steady_membership_months` months or more gives `middle_tier_courtesy`; any other customer gets no loyalty courtesy."
      earnings_12m: "The engagement courtesy depends on the points earnings posted to the customer's membership in the trailing 12 calendar months:"
      engagement_courtesy: "four or more earnings give `active_courtesy`, two or three give `regular_courtesy`, and fewer give none."
      service: "The service courtesy depends on the delivery service the parcel was sent by:"
      service_courtesy: "Next Business Day or Same-Day Courier gives `express_courtesy`, Expedited 2-Day gives `two_day_courtesy`, and any other service gives none."
      days_since_resolved: "The recovery share depends on how long ago the claim was resolved:"
      recovery_share: "60 or more calendar days before today charges `aged_share` of the courtesy-reduced base, 30 to 59 calendar days charges `mid_share`, and fewer than 30 days charges all of it."
      product_class: "The label saving depends on the merchandise class of the line kept:"
      label_saving: "footwear takes `footwear_label` off the charge, apparel `apparel_label`, accessories `accessories_label`, and any other class nothing."
      courtesy_rate: "the loyalty, engagement and service courtesies are added into one courtesy rate, which is applied once to the charge base;"
      result: "the result is multiplied by the recovery share; the label saving is then taken off; the charge is never below 0.00 and is rounded to the nearest cent on the final figure."
    factors:
      - id: seasonal_charge_base
        effect: method
        decides: charge_base
        bindings: [placed_date, days_since_order, unit_price, price_type, charge_base]
        ladder:
          - when: "a regular-price line on an order placed more than K('season_days') calendar days ago"
            method: "the line's booked unit price times the units compensated on that line, less K('season_markdown'), with no tax share"
          - when: "a regular-price line on an order placed more than K('recent_days') and at most K('season_days') calendar days ago"
            method: "the line's merchandise compensation less K('recent_markdown')"
          - when: "otherwise"
            method: "the line's merchandise compensation as booked"
        baseline:
          charge_base: "compensated_value"
        evidence: [date, cross_category]
        cross_difficulty: null
      - id: loyalty_courtesy
        effect: parameter
        decides: loyalty_courtesy
        bindings: [member_tier, membership_months, loyalty_courtesy]
        ladder:
          - when: "active tier Platinum, Icon or Atelier and a membership open K('long_membership_months') months or more"
            value: "K('top_tier_courtesy')"
          - when: "active tier Silver or Gold and a membership open K('steady_membership_months') months or more"
            value: "K('middle_tier_courtesy')"
          - when: "otherwise"
            value: "0"
        baseline:
          loyalty_courtesy: "0"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
      - id: engagement_courtesy
        effect: parameter
        decides: engagement_courtesy
        bindings: [earnings_12m, engagement_courtesy]
        ladder:
          - when: "four or more points earnings posted in the trailing 12 calendar months"
            value: "K('active_courtesy')"
          - when: "two or three such earnings"
            value: "K('regular_courtesy')"
          - when: "otherwise"
            value: "0"
        baseline:
          engagement_courtesy: "0"
        evidence: [history, cross_category]
        cross_difficulty: loyalty
      - id: service_courtesy
        effect: parameter
        decides: service_courtesy
        bindings: [service, service_courtesy]
        ladder:
          - when: "the parcel was sent by Next Business Day or Same-Day Courier"
            value: "K('express_courtesy')"
          - when: "the parcel was sent by Expedited 2-Day"
            value: "K('two_day_courtesy')"
          - when: "otherwise"
            value: "0"
        baseline:
          service_courtesy: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: recovery_share
        effect: parameter
        decides: recovery_share
        bindings: [days_since_resolved, recovery_share]
        ladder:
          - when: "the claim was resolved 60 or more calendar days ago"
            value: "K('aged_share')"
          - when: "the claim was resolved 30 to 59 calendar days ago"
            value: "K('mid_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          recovery_share: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: label_saving
        effect: parameter
        decides: label_saving
        bindings: [product_class, label_saving]
        ladder:
          - when: "the line kept is footwear"
            value: "K('footwear_label')"
          - when: "the line kept is apparel"
            value: "K('apparel_label')"
          - when: "the line kept is accessories"
            value: "K('accessories_label')"
          - when: "otherwise"
            value: "0"
        baseline:
          label_saving: "0"
        evidence: [cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        The found-parcel charge is the merchandise compensation booked on the claim for the line kept (the
        merchandise refund entries on that line, tax share included), for the units compensated on that line, all of which the customer keeps,
        rounded to the nearest cent on the final figure.
      params: []
    inputs:
      history:
        - {table: claim_events, aggregate: sum, field: amount_usd, filters: {event_type: claims_compensation_issued, compensation_type: merchandise_refund}}
        - {category: loyalty, table: loyalty_ledger, aggregate: count, field: loyalty_entry_id, within_months: 12, filters: {event_type: loyalty_points_earned}}
      cross_category: [orders, loyalty]

  - id: claims_ext_wrong_shipment_delivery_refund
    base_policy_refs: [claims_evt_compensation]
    overwrite:
      - base_policy: claims_evt_compensation
        superseded_clause: >-
          plus the order's shipping fee and surcharge where `refund_includes_shipping_fee`.
        replaced_by: >-
          A Wrong Item Claim refunds the delivery charge of its order only in the share the claim covers, worked out as set out below, even though its claim type does not otherwise refund the shipping fee with its merchandise.
    trigger: state_due
    subject: [claims_compensation_issued]
    computes: amount_usd
    target_tool: book_wrong_shipment_delivery_refund_014b5564
    params:
      whole_cover_share: 1.00
      half_cover_share: 0.50
      single_refund_share: 0.75
      multiple_refund_share: 0.50
      top_tiers: [Marlowe Rewards Platinum, Marlowe Rewards Icon, Marlowe Rewards Atelier]
      middle_tiers: [Marlowe Rewards Silver, Marlowe Rewards Gold]
      delivery_taxing_states: [AR, CT, GA, HI, IN, KS, KY, MI, MN, MS, NE, NJ, NM, NY, NC, ND, OH, PA, RI, SC, SD, TN, TX, VT, WA, WV, WI]
      taxable_share_states: [CO, IL, MD]
    rule: >-
      An approved Wrong Item Claim whose parcel brought wrong items is owed a wrong-shipment delivery
      refund wherever the share it covers is above zero, booked as one shipping fee refund entry on the
      claim for the whole parcel.
      A Wrong Item Claim refunds the delivery charge of its order only in the share the claim covers,
      worked out as set out below, even though its claim type does not otherwise refund the shipping fee
      with its merchandise.
      On a Wrong Item Claim the wrong-shipment delivery refund is the order's effective shipping fee and
      surcharge paid, times the share of the delivery charge the claim covers; by default a line-scope
      claim covers no share of the delivery charge. The refund is rounded to the nearest cent once, on the
      final figure.
      The covered share depends on how much of the shipment the claim made good: where the units of the
      claim's merchandise refund entries reach every unit booked on the order, the claim covers
      `whole_cover_share` of the delivery charge; where they reach at least half of the units booked on
      the order but not all, it covers `half_cover_share`; in every other case it covers none.
      The wrong-shipment refund basis depends on how the fee was reached: where the order's effective
      shipping fee is above 0.00 and equals the list fee of its delivery service less that service's free-shipping credit (a free-shipping credit was taken off and nothing else), and the customer's active Marlowe Rewards tier is Platinum, Icon or Atelier,
      the wrong-shipment refund basis is the list fee of the delivery service plus the surcharge; where
      the fee was reduced in that way and the active tier is Silver or Gold, it is the fee paid plus half
      of the credit taken off plus the surcharge; in every other case it is the fee paid plus the
      surcharge.
      The wrong-shipment repeat share depends on the delivery-charge refunds already paid under delivery
      claims on the customer's orders: counting the order-level refunds with reason delivery claim and no
      order line dated in the trailing 12 calendar months, as they stand on the orders' payment records, two or more pay `multiple_refund_share` of the
      basis, exactly one pays `single_refund_share`, and none leaves the basis whole.
      The covered share and the repeat share are multiplied together and applied once to the
      wrong-shipment refund basis, giving the refunded wrong-shipment charge.
      The tax on the refunded wrong-shipment charge depends on the ship-to state: where the order went to
      a state in `delivery_taxing_states`, it is the refunded wrong-shipment charge times the order's sales
      tax divided by the order's net merchandise (subtotal less discounts) plus its effective shipping fee
      and surcharge; where the order went to a state in `taxable_share_states`, which taxes a delivery charge only in proportion to the taxable merchandise the parcel carried, that same amount is further multiplied by the order's net merchandise less its gift-card lines, divided by its net merchandise; where the order went to any other state, no tax is added.
      The amount booked is the refunded wrong-shipment charge plus that tax, rounded to the nearest cent.
      Booking the entry does not by itself resolve the claim.
    prerequisite: []
    cross_category:
      - category: orders
        as: branch
        reads: [shipping_fee_usd, surcharge_usd, variant_name, ship_to_state, sales_tax_usd, merchandise_subtotal_usd, discount_total_usd, order_lines.quantity, order_lines.product_class, order_payments.refund_component]
        note: The order's lines give the units the covered share compares against; its fee and list fee give the wrong-shipment refund basis; the payments ledger decides the repeat share.
      - category: loyalty
        as: branch
        reads: [variant_name, status]
        note: The active Marlowe Rewards tier decides the wrong-shipment refund basis for a fee reduced by a free-shipping credit.
    compute:
      - claimed_units: "SUM('claim_events','quantity', event_type='claims_compensation_issued', compensation_type='merchandise_refund')"
      - order_units: "XSUM('orders','order_lines','quantity', order_id=F('order_id'), event_type='orders_line_booked')"
      - covered_share: "K('whole_cover_share') if claimed_units >= order_units and order_units > 0 else (K('half_cover_share') if claimed_units * 2 >= order_units and claimed_units < order_units else 0)"
      - fee_paid: "CFIELD('orders','shipping_fee_usd', order_id=F('order_id'))"
      - surcharge: "CFIELD('orders','surcharge_usd', order_id=F('order_id'))"
      - list_fee: "CPARAM('orders','shipping_fee_usd', order_id=F('order_id'))"
      - free_credit: "CPARAM('orders','free_shipping_credit_usd', order_id=F('order_id'))"
      - member_tier: "CFIELD('loyalty','variant_name', status='active')"
      - shipment_basis: "list_fee + surcharge if fee_paid > 0 and ABS(list_fee - free_credit - fee_paid) < 0.005 and member_tier in K('top_tiers') else (fee_paid + (list_fee - fee_paid) / 2 + surcharge if fee_paid > 0 and ABS(list_fee - free_credit - fee_paid) < 0.005 and member_tier in K('middle_tiers') else fee_paid + surcharge)"
      - prior_delivery_refunds: "XCOUNT('orders','order_payments', within_months=12, event_type='orders_payment_refunded', refund_component='delivery_claim', booked_line_id=None)"
      - repeat_share: "K('multiple_refund_share') if prior_delivery_refunds >= 2 else (K('single_refund_share') if prior_delivery_refunds == 1 else 1.0)"
      - refunded_shipment_charge: "shipment_basis * covered_share * repeat_share"
      - ship_state: "CFIELD('orders','ship_to_state', order_id=F('order_id'))"
      - order_tax: "CFIELD('orders','sales_tax_usd', order_id=F('order_id'))"
      - net_merchandise: "CFIELD('orders','merchandise_subtotal_usd', order_id=F('order_id')) - CFIELD('orders','discount_total_usd', order_id=F('order_id'))"
      - gift_card_merchandise: "XSUM('orders','order_lines','amount_usd', order_id=F('order_id'), event_type='orders_line_booked', product_class='egift_card') + XSUM('orders','order_lines','amount_usd', order_id=F('order_id'), event_type='orders_line_booked', product_class='plastic_gift_card')"
      - shipment_tax: "refunded_shipment_charge * order_tax / (net_merchandise + fee_paid + surcharge) if ship_state in K('delivery_taxing_states') else (refunded_shipment_charge * order_tax / (net_merchandise + fee_paid + surcharge) * (net_merchandise - gift_card_merchandise) / net_merchandise if ship_state in K('taxable_share_states') else 0)"
      - result: "RND(refunded_shipment_charge + shipment_tax, 2)"
    compute_basis:
      claimed_units: "where the units of the claim's merchandise refund entries reach every unit booked on the order,"
      order_units: "every unit booked on the order"
      covered_share: "where the units of the claim's merchandise refund entries reach every unit booked on the order, the claim covers `whole_cover_share` of the delivery charge; where they reach at least half of the units booked on the order but not all, it covers `half_cover_share`; in every other case it covers none."
      fee_paid: "the wrong-shipment delivery refund is the order's effective shipping fee and surcharge paid,"
      surcharge: "the wrong-shipment delivery refund is the order's effective shipping fee and surcharge paid,"
      list_fee: "and equals the list fee of its delivery service less that service's free-shipping credit (a free-shipping credit was taken off and nothing else),"
      free_credit: "less that service's free-shipping credit (a free-shipping credit was taken off and nothing else),"
      member_tier: "and the customer's active Marlowe Rewards tier is Platinum, Icon or Atelier,"
      shipment_basis: "the wrong-shipment refund basis is the list fee of the delivery service plus the surcharge; where the fee was reduced in that way and the active tier is Silver or Gold, it is the fee paid plus half of the credit taken off plus the surcharge; in every other case it is the fee paid plus the surcharge."
      prior_delivery_refunds: "counting the order-level refunds with reason delivery claim and no order line dated in the trailing 12 calendar months,"
      repeat_share: "two or more pay `multiple_refund_share` of the basis, exactly one pays `single_refund_share`, and none leaves the basis whole."
      refunded_shipment_charge: "The covered share and the repeat share are multiplied together and applied once to the wrong-shipment refund basis, giving the refunded wrong-shipment charge."
      ship_state: "The tax on the refunded wrong-shipment charge depends on the ship-to state:"
      order_tax: "times the order's sales tax divided by the order's net merchandise (subtotal less discounts) plus its effective shipping fee and surcharge;"
      net_merchandise: "the order's net merchandise (subtotal less discounts)"
      gift_card_merchandise: "that same amount is further multiplied by the order's net merchandise less its gift-card lines, divided by its net merchandise;"
      shipment_tax: "where the order went to a state in `delivery_taxing_states`, it is the refunded wrong-shipment charge times the order's sales tax divided by the order's net merchandise (subtotal less discounts) plus its effective shipping fee and surcharge; where the order went to a state in `taxable_share_states`, which taxes a delivery charge only in proportion to the taxable merchandise the parcel carried, that same amount is further multiplied by the order's net merchandise less its gift-card lines, divided by its net merchandise; where the order went to any other state, no tax is added."
      result: "The amount booked is the refunded wrong-shipment charge plus that tax, rounded to the nearest cent."
    factors:
      - id: covered_share
        effect: parameter
        decides: covered_share
        bindings: [claimed_units, order_units, covered_share]
        ladder:
          - when: "the units of the claim's merchandise refund entries reach every unit booked on the order"
            value: "K('whole_cover_share')"
          - when: "they reach at least half of the units booked on the order but not all"
            value: "K('half_cover_share')"
          - when: "otherwise"
            value: "0"
        baseline:
          covered_share: "0"
        evidence: [history, cross_category]
        cross_difficulty: null
      - id: wrong_shipment_refund_basis
        effect: method
        decides: shipment_basis
        bindings: [member_tier, shipment_basis]
        ladder:
          - when: "the fee paid is above 0.00 and equals the service's list fee less its free-shipping credit (a free-shipping credit was taken off and nothing else), and the active Rewards tier is Platinum, Icon or Atelier"
            method: "the list fee of the delivery service plus the surcharge"
          - when: "the fee was reduced in that way and the active Rewards tier is Silver or Gold"
            method: "the fee paid plus half the credit taken off plus the surcharge"
          - when: "otherwise"
            method: "the fee paid plus the surcharge"
        baseline:
          shipment_basis: "fee_paid + surcharge"
        evidence: [cross_category, tier_param]
        cross_difficulty: loyalty
      - id: wrong_shipment_repeat_share
        effect: parameter
        decides: repeat_share
        bindings: [prior_delivery_refunds, repeat_share]
        ladder:
          - when: "two or more delivery-charge refunds under delivery claims on the customer's orders in the trailing 12 months"
            value: "K('multiple_refund_share')"
          - when: "exactly one such refund"
            value: "K('single_refund_share')"
          - when: "otherwise (none)"
            value: "1.0"
        baseline:
          repeat_share: "1.0"
        evidence: [history, cross_category]
        cross_difficulty: null
      - id: wrong_shipment_tax
        effect: method
        decides: shipment_tax
        bindings: [ship_state, gift_card_merchandise, shipment_tax]
        ladder:
          - when: "the order went to a state in the delivery-taxing list"
            method: "refunded wrong-shipment charge times the order's sales tax over its net merchandise plus effective fee and surcharge"
          - when: "the order went to a state in the taxable-share list"
            method: "that same amount times the order's net merchandise less gift-card lines over its net merchandise"
          - when: "otherwise (any other state)"
            method: "no tax added"
        baseline:
          shipment_tax: "0"
        evidence: [cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        On a Wrong Item Claim the wrong-shipment delivery refund is the order's effective shipping fee and
        surcharge paid, times the share of the delivery charge the claim covers; by default a line-scope
        claim covers no share of the delivery charge. The refund is rounded to the nearest cent once, on the
        final figure.
      params: []
    inputs:
      history:
        - {table: claim_events, aggregate: sum, field: quantity, filters: {event_type: claims_compensation_issued, compensation_type: merchandise_refund}}
        - {category: orders, table: order_payments, aggregate: count, field: payment_id, within_months: 12, filters: {event_type: orders_payment_refunded, refund_component: delivery_claim}}
      cross_category: [orders, loyalty]

  - id: claims_ext_undelivered_parcel_delivery_refund
    base_policy_refs: [claims_evt_compensation, claims_evt_carrier_trace]
    overwrite:
      - base_policy: claims_evt_compensation
        superseded_clause: >-
          plus the order's shipping fee and surcharge where `refund_includes_shipping_fee`.
        replaced_by: >-
          The delivery charge of a parcel that never reached the customer is refunded as its own compensation entry, worked out from the trace refund basis, the report share, the claim-history share and the tax on the refunded parcel charge, as set out below.
    trigger: state_due
    subject: [claims_compensation_issued]
    computes: amount_usd
    target_tool: book_undelivered_parcel_delivery_refund_8864d5c2
    params:
      disputed_trace_share: 0.50
      slow_notice_share: 0.90
      late_notice_share: 0.80
      busy_history_share: 0.75
      heavy_history_share: 0.50
      delivery_taxing_states: [AR, CT, GA, HI, IN, KS, KY, MI, MN, MS, NE, NJ, NM, NY, NC, ND, OH, PA, RI, SC, SD, TN, TX, VT, WA, WV, WI]
      taxable_share_states: [CO, IL, MD]
    rule: >-
      An approved Delivered Not Received or Lost in Transit Claim on an order whose effective shipping fee
      or surcharge was above 0.00 is owed an undelivered-parcel delivery refund where the claim was made whole by merchandise refund, booked as one shipping fee refund entry on the claim for the whole parcel, apart from its merchandise refund; a claim made whole by reshipment is owed none.
      The delivery charge of a parcel that never reached the customer is refunded as its own compensation
      entry, worked out from the trace refund basis, the report share, the claim-history share and the
      tax on the refunded parcel charge, as set out below.
      The undelivered-parcel delivery refund is the order's effective shipping fee and surcharge paid. The
      refund is rounded to the nearest cent once, on the final figure.
      The trace refund basis depends on the carrier trace result recorded on the claim: where the carrier
      confirmed the parcel lost (lost_confirmed), the basis is the list fee of the order's delivery service
      plus the surcharge; where the carrier answered that it delivered the parcel (delivered_confirmed),
      the basis is `disputed_trace_share` of the fee paid plus the surcharge; in every other case the basis
      is the fee paid plus the surcharge.
      The report share depends on how many counted days after the carrier's delivered date the claim was
      opened: 8 or more counted days pay `late_notice_share` of the basis, 5 to 7 counted days pay
      `slow_notice_share`, and 4 or fewer pay the whole basis.
      Those report days are counted only on the days the delivery service delivers: for a service that
      does not deliver on Saturdays, the counted days are the Monday-to-Friday days after the delivered
      date up to and including the date the claim was opened; for a service that delivers on Saturdays
      other than Same-Day Courier, the counted days are the Monday-to-Saturday days in that span; in every
      other case the counted days are the calendar days from the delivered date to the opening date.
      The claim-history share depends on the refunds with reason delivery claim (of merchandise or of a
      delivery charge) paid on the customer's other orders in the trailing 12 calendar months, as they stand on the orders' payment records, each refund entry counted once: four or more pay `heavy_history_share` of the basis, two or three pay
      `busy_history_share`, and one or none leave the basis whole.
      The report share and the claim-history share are multiplied together and applied once to the trace
      refund basis, giving the refunded parcel charge.
      The tax on the refunded parcel charge depends on the ship-to state: where the order went to a state
      in `delivery_taxing_states`, it is the refunded parcel charge times the order's sales tax divided by
      the order's net merchandise (subtotal less discounts) plus its effective shipping fee and surcharge;
      where the order went to a state in `taxable_share_states`, which taxes a delivery charge only in proportion to the taxable merchandise the parcel carried, that same amount is further multiplied by the order's net merchandise less its gift-card lines, divided by its net merchandise; where the order went to any other state, no tax is added.
      The amount booked is the refunded parcel charge plus that tax, rounded to the nearest cent.
      Booking the entry does not by itself resolve the claim.
    prerequisite: []
    cross_category:
      - category: orders
        as: branch
        reads: [delivered_date, variant_name, shipping_fee_usd, surcharge_usd, ship_to_state, sales_tax_usd, merchandise_subtotal_usd, discount_total_usd, order_lines.product_class, order_payments.refund_component]
        note: The delivered date and service give the counted report days; the fee and list fee give the trace refund basis; the payments ledger of the other orders decides the claim-history share.
    compute:
      - fee_paid: "CFIELD('orders','shipping_fee_usd', order_id=F('order_id'))"
      - surcharge: "CFIELD('orders','surcharge_usd', order_id=F('order_id'))"
      - list_fee: "CPARAM('orders','shipping_fee_usd', order_id=F('order_id'))"
      - trace_basis: "list_fee + surcharge if F('trace_result') == 'lost_confirmed' else (K('disputed_trace_share') * fee_paid + surcharge if F('trace_result') == 'delivered_confirmed' else fee_paid + surcharge)"
      - delivered_date: "CFIELD('orders','delivered_date', order_id=F('order_id'))"
      - calendar_report_days: "DAYS(delivered_date, F('opened_date'))"
      - saturday_service: "CPARAM('orders','weekend_delivery', order_id=F('order_id'))"
      - service_name: "CFIELD('orders','variant_name', order_id=F('order_id'))"
      - weekday_report_days: "5 * ((DAYS('2024-01-01', F('opened_date')) + 1) // 7) + MN((DAYS('2024-01-01', F('opened_date')) + 1) % 7, 5) - 5 * ((DAYS('2024-01-01', delivered_date) + 1) // 7) - MN((DAYS('2024-01-01', delivered_date) + 1) % 7, 5)"
      - six_day_report_days: "6 * ((DAYS('2024-01-01', F('opened_date')) + 1) // 7) + MN((DAYS('2024-01-01', F('opened_date')) + 1) % 7, 6) - 6 * ((DAYS('2024-01-01', delivered_date) + 1) // 7) - MN((DAYS('2024-01-01', delivered_date) + 1) % 7, 6)"
      - counted_report_days: "weekday_report_days if not saturday_service else (six_day_report_days if saturday_service and service_name != 'Same-Day Courier' else calendar_report_days)"
      - report_share: "K('late_notice_share') if counted_report_days >= 8 else (K('slow_notice_share') if counted_report_days >= 5 else 1.0)"
      - other_order_claim_refunds: "XCOUNT('orders','order_payments', within_months=12, event_type='orders_payment_refunded', refund_component='delivery_claim') - XCOUNT('orders','order_payments', within_months=12, event_type='orders_payment_refunded', refund_component='delivery_claim', order_id=F('order_id'))"
      - history_share: "K('heavy_history_share') if other_order_claim_refunds >= 4 else (K('busy_history_share') if other_order_claim_refunds >= 2 else 1.0)"
      - refunded_parcel_charge: "trace_basis * report_share * history_share"
      - ship_state: "CFIELD('orders','ship_to_state', order_id=F('order_id'))"
      - order_tax: "CFIELD('orders','sales_tax_usd', order_id=F('order_id'))"
      - net_merchandise: "CFIELD('orders','merchandise_subtotal_usd', order_id=F('order_id')) - CFIELD('orders','discount_total_usd', order_id=F('order_id'))"
      - gift_card_merchandise: "XSUM('orders','order_lines','amount_usd', order_id=F('order_id'), event_type='orders_line_booked', product_class='egift_card') + XSUM('orders','order_lines','amount_usd', order_id=F('order_id'), event_type='orders_line_booked', product_class='plastic_gift_card')"
      - parcel_tax: "refunded_parcel_charge * order_tax / (net_merchandise + fee_paid + surcharge) if ship_state in K('delivery_taxing_states') else (refunded_parcel_charge * order_tax / (net_merchandise + fee_paid + surcharge) * (net_merchandise - gift_card_merchandise) / net_merchandise if ship_state in K('taxable_share_states') else 0)"
      - result: "RND(refunded_parcel_charge + parcel_tax, 2)"
    compute_basis:
      fee_paid: "The undelivered-parcel delivery refund is the order's effective shipping fee and surcharge paid."
      surcharge: "The undelivered-parcel delivery refund is the order's effective shipping fee and surcharge paid."
      list_fee: "the basis is the list fee of the order's delivery service plus the surcharge;"
      trace_basis: "where the carrier confirmed the parcel lost (lost_confirmed), the basis is the list fee of the order's delivery service plus the surcharge; where the carrier answered that it delivered the parcel (delivered_confirmed), the basis is `disputed_trace_share` of the fee paid plus the surcharge; in every other case the basis is the fee paid plus the surcharge."
      delivered_date: "after the carrier's delivered date"
      calendar_report_days: "in every other case the counted days are the calendar days from the delivered date to the opening date."
      saturday_service: "for a service that does not deliver on Saturdays,"
      service_name: "for a service that delivers on Saturdays other than Same-Day Courier,"
      weekday_report_days: "the counted days are the Monday-to-Friday days after the delivered date up to and including the date the claim was opened;"
      six_day_report_days: "the counted days are the Monday-to-Saturday days in that span;"
      counted_report_days: "Those report days are counted only on the days the delivery service delivers: for a service that does not deliver on Saturdays, the counted days are the Monday-to-Friday days after the delivered date up to and including the date the claim was opened; for a service that delivers on Saturdays other than Same-Day Courier, the counted days are the Monday-to-Saturday days in that span; in every other case the counted days are the calendar days from the delivered date to the opening date."
      report_share: "8 or more counted days pay `late_notice_share` of the basis, 5 to 7 counted days pay `slow_notice_share`, and 4 or fewer pay the whole basis."
      other_order_claim_refunds: "The claim-history share depends on the refunds with reason delivery claim (of merchandise or of a delivery charge) paid on the customer's other orders in the trailing 12 calendar months, as they stand on the orders' payment records, each refund entry counted once:"
      history_share: "four or more pay `heavy_history_share` of the basis, two or three pay `busy_history_share`, and one or none leave the basis whole."
      refunded_parcel_charge: "The report share and the claim-history share are multiplied together and applied once to the trace refund basis, giving the refunded parcel charge."
      ship_state: "The tax on the refunded parcel charge depends on the ship-to state:"
      order_tax: "times the order's sales tax divided by the order's net merchandise (subtotal less discounts) plus its effective shipping fee and surcharge;"
      net_merchandise: "the order's net merchandise (subtotal less discounts)"
      gift_card_merchandise: "that same amount is further multiplied by the order's net merchandise less its gift-card lines, divided by its net merchandise;"
      parcel_tax: "where the order went to a state in `delivery_taxing_states`, it is the refunded parcel charge times the order's sales tax divided by the order's net merchandise (subtotal less discounts) plus its effective shipping fee and surcharge; where the order went to a state in `taxable_share_states`, which taxes a delivery charge only in proportion to the taxable merchandise the parcel carried, that same amount is further multiplied by the order's net merchandise less its gift-card lines, divided by its net merchandise; where the order went to any other state, no tax is added."
      result: "The amount booked is the refunded parcel charge plus that tax, rounded to the nearest cent."
    factors:
      - id: trace_refund_basis
        effect: method
        decides: trace_basis
        bindings: [list_fee, trace_basis]
        ladder:
          - when: "the carrier trace result is lost_confirmed"
            method: "the list fee of the order's delivery service plus the surcharge"
          - when: "the carrier trace result is delivered_confirmed"
            method: "K('disputed_trace_share') of the fee paid plus the surcharge"
          - when: "otherwise"
            method: "the fee paid plus the surcharge"
        baseline:
          trace_basis: "fee_paid + surcharge"
        evidence: [cross_category]
        cross_difficulty: null
      - id: report_day_count
        effect: method
        decides: counted_report_days
        bindings: [weekday_report_days, six_day_report_days, counted_report_days]
        ladder:
          - when: "the order's delivery service does not deliver on Saturdays"
            method: "count the Monday-to-Friday days after the delivered date up to and including the opening date"
          - when: "the service delivers on Saturdays and is not Same-Day Courier"
            method: "count the Monday-to-Saturday days in that span"
          - when: "otherwise"
            method: "count the calendar days from the delivered date to the opening date"
        baseline:
          counted_report_days: "calendar_report_days"
        evidence: [date]
        cross_difficulty: null
      - id: report_share
        effect: parameter
        decides: report_share
        bindings: [calendar_report_days, report_share]
        ladder:
          - when: "the claim was opened 8 or more counted days after the delivered date"
            value: "K('late_notice_share')"
          - when: "5 to 7 counted days after it"
            value: "K('slow_notice_share')"
          - when: "otherwise (4 or fewer)"
            value: "1.0"
        baseline:
          report_share: "1.0"
        evidence: [date]
        cross_difficulty: null
      - id: claim_history_share
        effect: parameter
        decides: history_share
        bindings: [other_order_claim_refunds, history_share]
        ladder:
          - when: "four or more delivery-claim refund entries on the customer's other orders in the trailing 12 months"
            value: "K('heavy_history_share')"
          - when: "two or three such entries"
            value: "K('busy_history_share')"
          - when: "otherwise (one or none)"
            value: "1.0"
        baseline:
          history_share: "1.0"
        evidence: [history, cross_category]
        cross_difficulty: null
      - id: parcel_charge_tax
        effect: method
        decides: parcel_tax
        bindings: [ship_state, gift_card_merchandise, parcel_tax]
        ladder:
          - when: "the order went to a state in the delivery-taxing list"
            method: "refunded parcel charge times the order's sales tax over its net merchandise plus effective fee and surcharge"
          - when: "the order went to a state in the taxable-share list"
            method: "that same amount times the order's net merchandise less gift-card lines over its net merchandise"
          - when: "otherwise (any other state)"
            method: "no tax added"
        baseline:
          parcel_tax: "0"
        evidence: [cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        The undelivered-parcel delivery refund is the order's effective shipping fee and surcharge paid. The
        refund is rounded to the nearest cent once, on the final figure.
      params: []
    inputs:
      history:
        - {category: orders, table: order_payments, aggregate: count, field: payment_id, within_months: 12, filters: {event_type: orders_payment_refunded, refund_component: delivery_claim}}
      cross_category: [orders]

  - id: claims_ext_wrong_item_keep_charge
    base_policy_refs: [claims_evt_recovery]
    overwrite:
      - base_policy: claims_evt_recovery
        superseded_clause: >-
          On a Wrong Item Claim the wrong item must be sent back with a prepaid label within `item_return_window_days` calendar days of approval (`item_return_required`), otherwise its net price is charged (`unreturned_item_charge_basis`, reason wrong_item_not_returned).
        replaced_by: >-
          On a Wrong Item Claim the wrong item is sent back with a prepaid label within `item_return_window_days` calendar days of approval, or the customer keeps it and is charged the wrong-item keep charge worked out below, reason wrong_item_not_returned.
      - base_policy: claims_evt_recovery
        superseded_clause: >-
          A recovery is booked only while the claim is in status resolved.
        replaced_by: >-
          A wrong-item keep charge is booked while the claim is in status approved or resolved.
      - base_policy: claims_evt_recovery
        superseded_clause: >-
          Goodwill Credit and shipping fee refunds are never recovered.
        replaced_by: >-
          A wrong item the customer keeps carries back the share of the delivery-charge refund on its claim that its line makes up of the claim's merchandise compensation; Goodwill Credit is never recovered.
    trigger: on_request
    subject: [claims_compensation_recovered]
    computes: amount_usd
    target_tool: authorize_wrong_item_keep_charge_d92bb3d2
    params:
      season_days: 60
      recent_days: 30
      season_keep_markdown: 0.30
      recent_keep_markdown: 0.15
      top_tiers: [Marlowe Rewards Platinum, Marlowe Rewards Icon, Marlowe Rewards Atelier]
      middle_tiers: [Marlowe Rewards Silver, Marlowe Rewards Gold]
      long_membership_months: 120
      steady_membership_months: 60
      top_keep_discount: 0.25
      middle_keep_discount: 0.15
      no_return_courtesy: 0.05
      few_return_courtesy: 0.02
      express_services: [Next Business Day, Same-Day Courier]
      express_keep_courtesy: 0.10
      two_day_keep_courtesy: 0.05
      premium_plans: [Unlimited Next-Day Annual, Unlimited Express Annual, Unlimited Express Monthly]
      plan_live_statuses: [trial, active, cancellation_pending]
      premium_plan_courtesy: 0.05
      standard_plan_courtesy: 0.03
      footwear_keep_label: 12.00
      apparel_keep_label: 8.00
      accessories_keep_label: 6.00
    rule: >-
      On a Wrong Item Claim the wrong item is sent back with a prepaid label within
      `item_return_window_days` calendar days of approval, or the customer keeps it and is charged the
      wrong-item keep charge worked out below, reason wrong_item_not_returned. Keeping the wrong item and
      paying for it is the customer's own decision: the customer authorizes the keep charge personally,
      for the order line the wrong item came in place of, and the charge goes to the original card. A
      wrong-item keep charge is booked while the claim is in status approved or resolved.
      The keep charge for a wrong item is fixed only after any delivery-charge refund owed on its claim
      stands on the claim. A wrong-item keep charge is taken only after the compensation owed on each of
      the customer's other approved claims has been booked.
      The wrong-item keep charge is the merchandise compensation booked on the claim for the line the
      wrong item came in place of (its merchandise refund entries, tax share included), for the units compensated on that line, all of which the customer keeps, rounded to the nearest cent on the final figure.
      A wrong item the customer keeps carries back the share of the delivery-charge refund on its claim
      that its line makes up of the claim's merchandise compensation; Goodwill Credit is never recovered.
      The keep base depends on the age of the order and the price the line sold at: for a line sold at
      regular price on an order placed more than `season_days` calendar days before today, the keep base
      is the line's booked unit price times the units compensated on that line, less `season_keep_markdown` of it, with no tax
      share; for a regular-price line on an order placed more than `recent_days` and at most `season_days`
      calendar days before today, the keep base is the merchandise compensation for the line less
      `recent_keep_markdown` of it; in every other case the keep base is the merchandise compensation for
      the line.
      The keep discount depends on the customer's active Marlowe Rewards membership: Platinum, Icon or
      Atelier held on a membership open for `long_membership_months` months or more gives
      `top_keep_discount`; Silver or Gold held on a membership open for `steady_membership_months` months
      or more gives `middle_keep_discount`; any other customer gets no keep discount.
      The return-record courtesy depends on the customer's returns in status settled whose settled date falls in the trailing 12 calendar months: none gives `no_return_courtesy`, one or two give `few_return_courtesy`, and three or more
      give none.
      The express keep courtesy depends on the delivery service the wrong parcel was sent by: Next
      Business Day or Same-Day Courier gives `express_keep_courtesy`, Expedited 2-Day gives
      `two_day_keep_courtesy`, and any other service gives none.
      The Unlimited keep courtesy depends on the customer's Marlowe & Finch Unlimited membership: an
      Unlimited Next-Day Annual, Express Annual or Express Monthly plan in status trial, active or
      cancellation_pending gives `premium_plan_courtesy`; any other Unlimited plan in one of those statuses
      gives `standard_plan_courtesy`; a customer with no such membership gets none.
      The keep label saving depends on the merchandise class of the line: footwear takes
      `footwear_keep_label` off the charge, apparel `apparel_keep_label`, accessories
      `accessories_keep_label`, and any other class nothing.
      The keep charge is figured in this order: the keep discount, the return-record courtesy, the express
      keep courtesy and the Unlimited keep courtesy are added into one rate, which is applied once to the
      keep base; the keep label saving is then taken off; the carried-back share of the delivery-charge
      refund is then added; the charge is never below 0.00 and is rounded to the nearest cent on the
      final figure.
    prerequisite:
      - problem: claims_ext_wrong_shipment_delivery_refund
        kind: value_input
        gate: delivery_refund_booked
        form: state
        policy_source: >-
          The keep charge for a wrong item is fixed only after any delivery-charge refund owed on its claim stands on the claim.
        condition: >-
          The Wrong Item Claim carries a claims_compensation_issued entry of type shipping_fee_refund for the share of the delivery charge it covers, or the claim covers no share of it so that none is owed.
        resolved_by: book_wrong_shipment_delivery_refund_014b5564
        effect: >-
          The delivery-charge refund entries summed on the claim rise from 0.00 to the booked refund, and the keep charge carries back the kept line's share of it, so the charge rises by that share.
      - problem: claims_ext_undelivered_parcel_delivery_refund
        kind: state_gate
        gate: claim_events.compensation_type
        form: action
        policy_source: >-
          A wrong-item keep charge is taken only after the compensation owed on each of the customer's other approved claims has been booked.
        fallback_reason: >-
          The compensation owed on another approved claim is booked by different writes depending on that claim's type and delivery charge — a delivery-charge refund of a wrong shipment, of an undelivered parcel or of a missed guarantee, a Goodwill Credit, a merchandise refund — so no single record state names one write; the dependency is therefore stated as the business action of booking that claim's owed compensation.
        condition: >-
          Every other claim of the customer in status approved carries every compensation entry this charter owes on it; for an approved Delivered Not Received Claim on an order with a delivery charge that is its merchandise refund entry and its undelivered-parcel delivery refund entry.
        resolved_by: book_undelivered_parcel_delivery_refund_8864d5c2
        effect: >-
          Once the other approved claim's undelivered-parcel delivery refund entry (the compensation it still owes) is booked, the wrong-item keep charge may be taken.
    cross_category:
      - category: orders
        as: branch
        reads: [placed_date, variant_name, order_lines.unit_price_usd, order_lines.price_type, order_lines.product_class]
        note: The order's age and the line's price type give the keep base; the service gives the express keep courtesy; the merchandise class gives the keep label saving.
      - category: loyalty
        as: branch
        reads: [variant_name, enrolled_date, status]
        note: The active tier and the membership's age give the keep discount.
      - category: returns
        as: history
        reads: [return_cases.status, return_cases.settled_date]
        note: The returns settled in the trailing 12 months give the return-record courtesy.
      - category: pass
        as: branch
        reads: [variant_name, status]
        note: The Unlimited plan held gives the Unlimited keep courtesy.
    compute:
      - kept_line: "LATEST('claim_events','booked_line_id', event_type='claims_evidence_logged', evidence_type='wrong_item_photo')"
      - line_compensation: "SUM('claim_events','amount_usd', event_type='claims_compensation_issued', compensation_type='merchandise_refund', booked_line_id=kept_line)"
      - kept_units: "SUM('claim_events','quantity', event_type='claims_compensation_issued', compensation_type='merchandise_refund', booked_line_id=kept_line)"
      - claim_compensation: "SUM('claim_events','amount_usd', event_type='claims_compensation_issued', compensation_type='merchandise_refund')"
      - delivery_refund_booked: "SUM('claim_events','amount_usd', event_type='claims_compensation_issued', compensation_type='shipping_fee_refund')"
      - carried_back_delivery: "delivery_refund_booked * line_compensation / claim_compensation if claim_compensation > 0 else 0"
      - placed_date: "CFIELD('orders','placed_date', order_id=F('order_id'))"
      - order_age_days: "DAYS(placed_date, NOW)"
      - line_unit_price: "XLATEST('orders','order_lines','unit_price_usd', order_line_id=kept_line)"
      - line_price_type: "XLATEST('orders','order_lines','price_type', order_line_id=kept_line)"
      - keep_base: "line_unit_price * kept_units * (1 - K('season_keep_markdown')) if order_age_days > K('season_days') and line_price_type == 'regular' else (line_compensation * (1 - K('recent_keep_markdown')) if order_age_days > K('recent_days') and line_price_type == 'regular' else line_compensation)"
      - member_tier: "CFIELD('loyalty','variant_name', status='active')"
      - membership_months: "MONTHS(CFIELD('loyalty','enrolled_date', status='active'), NOW)"
      - keep_discount: "K('top_keep_discount') if member_tier in K('top_tiers') and membership_months >= K('long_membership_months') else (K('middle_keep_discount') if member_tier in K('middle_tiers') and membership_months >= K('steady_membership_months') else 0)"
      - settled_returns_12m: "XCOUNT('returns','return_cases', within_months=12, date_field='settled_date', status='settled')"
      - return_courtesy: "K('no_return_courtesy') if settled_returns_12m == 0 else (K('few_return_courtesy') if settled_returns_12m <= 2 else 0)"
      - wrong_parcel_service: "CFIELD('orders','variant_name', order_id=F('order_id'))"
      - express_courtesy: "K('express_keep_courtesy') if wrong_parcel_service in K('express_services') else (K('two_day_keep_courtesy') if wrong_parcel_service == 'Expedited 2-Day' else 0)"
      - plan_name: "CFIELD('pass','variant_name')"
      - plan_status: "CFIELD('pass','status')"
      - plan_courtesy: "K('premium_plan_courtesy') if plan_name in K('premium_plans') and plan_status in K('plan_live_statuses') else (K('standard_plan_courtesy') if plan_name != None and plan_status in K('plan_live_statuses') else 0)"
      - line_class: "XLATEST('orders','order_lines','product_class', order_line_id=kept_line)"
      - keep_label: "K('footwear_keep_label') if line_class == 'footwear' else (K('apparel_keep_label') if line_class == 'apparel' else (K('accessories_keep_label') if line_class == 'accessories' else 0))"
      - keep_rate: "keep_discount + return_courtesy + express_courtesy + plan_courtesy"
      - result: "RND(MX(0, keep_base * (1 - keep_rate) - keep_label + carried_back_delivery), 2)"
    compute_basis:
      kept_line: "for the order line the wrong item came in place of"
      line_compensation: "The wrong-item keep charge is the merchandise compensation booked on the claim for the line the wrong item came in place of (its merchandise refund entries, tax share included),"
      kept_units: "for the units compensated on that line, all of which the customer keeps,"
      claim_compensation: "that its line makes up of the claim's merchandise compensation;"
      delivery_refund_booked: "A wrong item the customer keeps carries back the share of the delivery-charge refund on its claim"
      carried_back_delivery: "A wrong item the customer keeps carries back the share of the delivery-charge refund on its claim that its line makes up of the claim's merchandise compensation; Goodwill Credit is never recovered."
      placed_date: "on an order placed more than `season_days` calendar days before today,"
      order_age_days: "The keep base depends on the age of the order and the price the line sold at:"
      line_unit_price: "the keep base is the line's booked unit price times the units compensated on that line, less `season_keep_markdown` of it, with no tax share;"
      line_price_type: "for a line sold at regular price"
      keep_base: "for a line sold at regular price on an order placed more than `season_days` calendar days before today, the keep base is the line's booked unit price times the units compensated on that line, less `season_keep_markdown` of it, with no tax share; for a regular-price line on an order placed more than `recent_days` and at most `season_days` calendar days before today, the keep base is the merchandise compensation for the line less `recent_keep_markdown` of it; in every other case the keep base is the merchandise compensation for the line."
      member_tier: "The keep discount depends on the customer's active Marlowe Rewards membership:"
      membership_months: "held on a membership open for `long_membership_months` months or more"
      keep_discount: "Platinum, Icon or Atelier held on a membership open for `long_membership_months` months or more gives `top_keep_discount`; Silver or Gold held on a membership open for `steady_membership_months` months or more gives `middle_keep_discount`; any other customer gets no keep discount."
      settled_returns_12m: "The return-record courtesy depends on the customer's returns in status settled whose settled date falls in the trailing 12 calendar months:"
      return_courtesy: "none gives `no_return_courtesy`, one or two give `few_return_courtesy`, and three or more give none."
      wrong_parcel_service: "The express keep courtesy depends on the delivery service the wrong parcel was sent by:"
      express_courtesy: "Next Business Day or Same-Day Courier gives `express_keep_courtesy`, Expedited 2-Day gives `two_day_keep_courtesy`, and any other service gives none."
      plan_name: "The Unlimited keep courtesy depends on the customer's Marlowe & Finch Unlimited membership:"
      plan_status: "in status trial, active or cancellation_pending"
      plan_courtesy: "an Unlimited Next-Day Annual, Express Annual or Express Monthly plan in status trial, active or cancellation_pending gives `premium_plan_courtesy`; any other Unlimited plan in one of those statuses gives `standard_plan_courtesy`; a customer with no such membership gets none."
      line_class: "The keep label saving depends on the merchandise class of the line:"
      keep_label: "footwear takes `footwear_keep_label` off the charge, apparel `apparel_keep_label`, accessories `accessories_keep_label`, and any other class nothing."
      keep_rate: "the keep discount, the return-record courtesy, the express keep courtesy and the Unlimited keep courtesy are added into one rate, which is applied once to the keep base;"
      result: "the keep label saving is then taken off; the carried-back share of the delivery-charge refund is then added; the charge is never below 0.00 and is rounded to the nearest cent on the final figure."
    factors:
      - id: seasonal_keep_base
        effect: method
        decides: keep_base
        bindings: [placed_date, order_age_days, line_unit_price, line_price_type, keep_base]
        ladder:
          - when: "a regular-price line on an order placed more than K('season_days') calendar days ago"
            method: "the line's booked unit price times the units compensated on that line, less K('season_keep_markdown'), with no tax share"
          - when: "a regular-price line on an order placed more than K('recent_days') and at most K('season_days') calendar days ago"
            method: "the line's merchandise compensation less K('recent_keep_markdown')"
          - when: "otherwise"
            method: "the line's merchandise compensation as booked"
        baseline:
          keep_base: "line_compensation"
        evidence: [date, cross_category]
        cross_difficulty: null
      - id: keep_discount
        effect: parameter
        decides: keep_discount
        bindings: [member_tier, membership_months, keep_discount]
        ladder:
          - when: "active tier Platinum, Icon or Atelier and a membership open K('long_membership_months') months or more"
            value: "K('top_keep_discount')"
          - when: "active tier Silver or Gold and a membership open K('steady_membership_months') months or more"
            value: "K('middle_keep_discount')"
          - when: "otherwise"
            value: "0"
        baseline:
          keep_discount: "0"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
      - id: return_record_courtesy
        effect: parameter
        decides: return_courtesy
        bindings: [settled_returns_12m, return_courtesy]
        ladder:
          - when: "no return settled in the trailing 12 calendar months"
            value: "K('no_return_courtesy')"
          - when: "one or two returns settled in that window"
            value: "K('few_return_courtesy')"
          - when: "otherwise (three or more)"
            value: "0"
        baseline:
          return_courtesy: "0"
        evidence: [history, cross_category]
        cross_difficulty: returns
      - id: express_keep_courtesy
        effect: parameter
        decides: express_courtesy
        bindings: [wrong_parcel_service, express_courtesy]
        ladder:
          - when: "the wrong parcel was sent by Next Business Day or Same-Day Courier"
            value: "K('express_keep_courtesy')"
          - when: "the wrong parcel was sent by Expedited 2-Day"
            value: "K('two_day_keep_courtesy')"
          - when: "otherwise"
            value: "0"
        baseline:
          express_courtesy: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: unlimited_keep_courtesy
        effect: parameter
        decides: plan_courtesy
        bindings: [plan_name, plan_status, plan_courtesy]
        ladder:
          - when: "an Unlimited Next-Day Annual, Express Annual or Express Monthly plan in a live status"
            value: "K('premium_plan_courtesy')"
          - when: "any other Unlimited plan in a live status"
            value: "K('standard_plan_courtesy')"
          - when: "otherwise"
            value: "0"
        baseline:
          plan_courtesy: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: keep_label_saving
        effect: parameter
        decides: keep_label
        bindings: [line_class, keep_label]
        ladder:
          - when: "the line is footwear"
            value: "K('footwear_keep_label')"
          - when: "the line is apparel"
            value: "K('apparel_keep_label')"
          - when: "the line is accessories"
            value: "K('accessories_keep_label')"
          - when: "otherwise"
            value: "0"
        baseline:
          keep_label: "0"
        evidence: [cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        The wrong-item keep charge is the merchandise compensation booked on the claim for the line the
        wrong item came in place of (its merchandise refund entries, tax share included), for the units compensated on that line, all of which the customer keeps, rounded to the nearest cent on the final figure. A wrong item the customer keeps carries back
        the share of the delivery-charge refund on its claim that its line makes up of the claim's
        merchandise compensation; Goodwill Credit is never recovered.
      params: []
    inputs:
      history:
        - {table: claim_events, aggregate: sum, field: amount_usd, filters: {event_type: claims_compensation_issued}}
        - {category: returns, table: return_cases, aggregate: count, field: return_id, within_months: 12, filters: {status: settled}}
      cross_category: [orders, loyalty, returns, pass]
