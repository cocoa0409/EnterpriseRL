events:
  - type: credit_issued
    target: credit_instruments
    mutation: create
    meaning: "A new stored-value instrument is created for a customer through its issue channel, in status pending_activation."
    grain: "One row per instrument."
    fields:
      instrument_id: "Reference of the new instrument."
      customer_id: "Holder of record: the purchaser for a bought card, the member for a Rewards Note, the returning or compensated customer otherwise."
      variant_name: "Instrument type."
      status: "Always pending_activation at creation."
      issued_date: "Issue date."
      valid_from_date: "Issue date plus valid_from_delay_days."
      expiry_date: "Last valid day for expiring instruments; empty when the instrument never expires."
      initial_value_usd: "Value issued."
      balance_usd: "0.00 until the initial load posts."
      card_number_last4: "Last four digits of the card number for bearer cards; empty for account-bound instruments."
      source_reference: "The object the instrument was issued for: order_line_id of a gift-card purchase, loyalty_entry_id of a conversion, return_id of a refund or note reissue, claim_id of a goodwill compensation, or the instrument_id it replaces or consolidates into."
    triggers:
      - event: credit:credit_loaded
        map: {load_type: initial_issue, amount_usd: initial_value_usd, source_reference: source_reference, event_date: issued_date}

  - type: credit_loaded
    target: credit_transactions
    meaning: "Value is loaded onto an instrument: its initial issue value, or a balance moved in from a replaced or consolidated instrument."
    grain: "One row per load per source object."
    distinguish_by: [load_type, source_reference]
    fields:
      instrument_id: "Instrument loaded."
      event_date: "Load date."
      load_type: "initial_issue, replacement_transfer_in or consolidation_transfer_in."
      source_reference: "Same meaning as on the instrument for initial_issue; the instrument_id the value came from for transfers in."
      amount_usd: "Value loaded, positive."
    account: balance
    direction: in
    triggers: []

  - type: credit_redeemed
    target: credit_transactions
    meaning: "Value is spent from an instrument when an order paying with it is captured."
    grain: "One row per instrument per order."
    distinguish_by: [order_id]
    fields:
      instrument_id: "Instrument spent from."
      order_id: "Order paid."
      event_date: "Capture date."
      amount_usd: "Value spent, negative."
    account: balance
    direction: out
    triggers: []

  - type: credit_refunded_to_instrument
    target: credit_transactions
    meaning: "Value spent from an instrument comes back to it through an order-level refund or a return refund."
    grain: "One row per instrument per order per return (return empty for order-level refunds) per refund date."
    distinguish_by: [order_id, return_id, event_date]
    fields:
      instrument_id: "Instrument refunded."
      order_id: "Order whose capture is being refunded."
      return_id: "Return whose refund this is; empty for order-level refunds."
      event_date: "Refund date."
      amount_usd: "Value returned, positive."
    account: balance
    direction: in
    triggers: []

  - type: credit_clawed_back
    target: credit_transactions
    meaning: "Value issued on an instrument is taken back because the event that justified it was undone."
    grain: "One row per instrument per undoing source object."
    distinguish_by: [clawback_reason, return_id, order_id]
    fields:
      instrument_id: "Instrument debited."
      event_date: "Clawback date."
      clawback_reason: "failed_return_inspection or qualifying_purchase_refunded."
      return_id: "Return whose failed inspection caused the clawback; empty otherwise."
      order_id: "Order whose gift-card purchase refund caused the clawback; empty otherwise."
      amount_usd: "Value taken back, negative."
    account: balance
    direction: out
    triggers: []

  - type: credit_transferred_out
    target: credit_transactions
    meaning: "An instrument's balance is moved to a replacement or consolidation instrument."
    grain: "One row per source instrument per receiving instrument."
    distinguish_by: [counterpart_instrument_id]
    fields:
      instrument_id: "Instrument the value leaves."
      event_date: "Transfer date."
      transfer_reason: "replacement or consolidation."
      counterpart_instrument_id: "Instrument receiving the value."
      amount_usd: "Value moved, negative."
    account: balance
    direction: out
    triggers: []

  - type: credit_cashed_out
    target: credit_transactions
    meaning: "An eligible instrument's small remaining balance is paid to the holder as required by their billing-state law."
    grain: "One row per instrument (a cash-out closes it)."
    distinguish_by: [instrument_id]
    fields:
      instrument_id: "Instrument cashed out."
      event_date: "Confirmation date."
      cash_out_state: "Billing state whose law was applied."
      amount_usd: "Balance paid out, negative."
    account: balance
    direction: out
    triggers: []

  - type: credit_forfeited
    target: credit_transactions
    meaning: "The remaining value of an expiring instrument is forfeited at expiry."
    grain: "One row per instrument (expiry is final)."
    distinguish_by: [instrument_id]
    fields:
      instrument_id: "Instrument expired."
      event_date: "Day after the expiry date."
      amount_usd: "Remaining balance forfeited, negative."
    account: balance
    direction: out
    triggers: []

  - type: credit_activated
    target: credit_instruments
    mutation: {transition: {from: pending_activation, to: active}}
    meaning: "The instrument becomes spendable."
    grain: "One row per transaction."
    fields:
      status: "active."
    triggers: []

  - type: credit_voided
    target: credit_instruments
    mutation: {transition: {from: pending_activation, to: closed}}
    meaning: "An instrument is voided before activation because the purchase or promotion behind it was undone."
    grain: "One row per transaction."
    fields:
      status: "closed."
      closed_date: "Void date."
      close_reason: "voided."
    triggers: []

  - type: credit_locked
    target: credit_instruments
    mutation: {transition: {from: active, to: locked}}
    meaning: "The instrument is frozen on the holder's report."
    grain: "One row per transaction."
    fields:
      status: "locked."
      lock_reason: "reported_lost, reported_stolen or unauthorized_use."
      locked_date: "Date of the report."
    triggers: []

  - type: credit_unlocked
    target: credit_instruments
    mutation: {transition: {from: locked, to: active}}
    meaning: "A locked instrument is released on the verified holder's request."
    grain: "One row per transaction."
    fields:
      status: "active."
      lock_reason: "Reset to none."
    triggers: []

  - type: credit_replaced
    target: credit_instruments
    mutation: {transition: {from: locked, to: closed}}
    meaning: "A locked instrument is closed and its protected balance moved to a newly issued replacement."
    grain: "One row per transaction."
    fields:
      status: "closed."
      closed_date: "Replacement date."
      close_reason: "replaced."
    triggers:
      - event: credit:credit_issued
        map: {customer_id: customer_id, source_reference: instrument_id, issued_date: closed_date}
      - event: credit:credit_transferred_out
        map: {transfer_reason: replacement, event_date: closed_date}

  - type: credit_depleted
    target: credit_instruments
    mutation: {transition: {from: active, to: depleted}}
    meaning: "The balance reaches zero."
    grain: "One row per transaction."
    fields:
      status: "depleted."
    triggers: []

  - type: credit_reactivated
    target: credit_instruments
    mutation: {transition: {from: depleted, to: active}}
    meaning: "A refund returns value to a depleted instrument."
    grain: "One row per transaction."
    fields:
      status: "active."
    triggers: []

  - type: credit_depleted_closed
    target: credit_instruments
    mutation: {transition: {from: depleted, to: closed}}
    meaning: "A depleted instrument closes after its retention period."
    grain: "One row per transaction."
    fields:
      status: "closed."
      closed_date: "Closing date."
      close_reason: "depleted."
    triggers: []

  - type: credit_expiry_reached
    target: credit_instruments
    mutation: {transition: {from: active, to: expired}}
    meaning: "An expiring instrument passes the end of its expiry date."
    grain: "One row per transaction."
    fields:
      status: "expired."
    triggers:
      - event: credit:credit_forfeited
        map: {instrument_id: instrument_id}

  - type: credit_closed_by_customer
    target: credit_instruments
    mutation: {transition: {from: active, to: closed}}
    meaning: "The holder's confirmed cash-out or consolidation request takes effect and the instrument closes."
    grain: "One row per transaction."
    fields:
      status: "closed."
      closed_date: "Confirmation date."
      close_reason: "cashed_out or consolidated."
    triggers:
      - event: credit:credit_cashed_out
        when: {close_reason: cashed_out}
        map: {instrument_id: instrument_id, event_date: closed_date}
      - event: credit:credit_transferred_out
        when: {close_reason: consolidated}
        map: {transfer_reason: consolidation, event_date: closed_date}

  - type: credit_registered
    target: credit_instruments
    mutation: update
    meaning: "A bearer card is registered to the profile of the customer who presents its card number and PIN."
    grain: "One row per transaction."
    fields:
      customer_id: "The registering customer, who becomes holder of record."
      registered_date: "Registration date."
    triggers: []

measures:
  - id: credit_msr_goodwill_issued_12m_count
    window: "Trailing 12 calendar months ending on the frozen date, by issued_date."
    measure: "Count of the customer's Goodwill Credit instruments in any status."
  - id: credit_msr_goodwill_issued_12m_usd
    window: "Trailing 12 calendar months ending on the frozen date, by issued_date."
    measure: "Sum of initial_value_usd over the customer's Goodwill Credit instruments in any status."
  - id: credit_msr_replacements_12m
    window: "Trailing 12 calendar months ending on the frozen date, by event_date."
    measure: "Count of the customer's credit_transferred_out rows with transfer_reason replacement."
  - id: credit_msr_used_pct
    window: "All history of the instrument."
    measure: "Percentage of the instrument's total loads already spent: (sum of credit_loaded amounts minus balance_usd) divided by the sum of credit_loaded amounts, times 100, to one decimal place."

policies:
  - id: credit_issuance
    subject: [credit_issued, credit_loaded, credit_activated]
    rule: >-
      An instrument is issued only through its `issue_channel`: a Marlowe Rewards Note only by the
      loyalty conversion run or as a reissue on a return refund, a Bonus Gift Card only by the bonus
      promotion, Goodwill Credit only as delivery-claim compensation, Return Store Credit only by a
      return refund, and a gift card only by purchase; an agent never creates value outside these
      channels and never issues an instrument as a substitute for one that is not owed. The issue value
      is the amount owed by the issuing event, rounded per `issue_value_rounding`, at least
      `min_issue_value_usd` and at most `max_balance_usd`. The valid_from_date is the issue date plus
      `valid_from_delay_days`; the expiry_date is set per `validity_basis` — for a Marlowe Rewards Note,
      the issue date plus the `reward_note_validity_days` of the Marlowe Rewards tier recorded on the
      conversion row (or, for a reissue, the later of the original note's expiry_date and the reissue
      date plus the loyalty charter's `reward_note_reissue_min_validity_days`); for fixed-day instruments,
      the valid_from_date plus `validity_days`; no expiry_date otherwise. The initial load posts with the
      creation. Electronic instruments activate on their valid-from date, which for every instrument
      except the Bonus Gift Card is the issue date; a plastic gift card activates when the order
      carrying it is dispatched. A gift card purchase cannot be returned for a refund of its price
      (`gift_card_purchase_refundable`).
    eligibility: []
    params:
      per_tier:
        Marlowe Rewards Note: {validity_days: "=validity_days", valid_from_delay_days: "=valid_from_delay_days", max_balance_usd: "=max_balance_usd"}
        Bonus Gift Card: {validity_days: "=validity_days", valid_from_delay_days: "=valid_from_delay_days", max_balance_usd: "=max_balance_usd"}
        Goodwill Credit: {validity_days: "=validity_days", valid_from_delay_days: "=valid_from_delay_days", max_balance_usd: "=max_balance_usd"}
        Return Store Credit: {validity_days: "=validity_days", valid_from_delay_days: "=valid_from_delay_days", max_balance_usd: "=max_balance_usd"}
        Marlowe & Finch Gift Card: {validity_days: "=validity_days", valid_from_delay_days: "=valid_from_delay_days", max_balance_usd: "=max_balance_usd"}
        Marlowe & Finch e-Gift Card: {validity_days: "=validity_days", valid_from_delay_days: "=valid_from_delay_days", max_balance_usd: "=max_balance_usd"}

  - id: credit_agg_multi_holding
    subject: [credit_issued]
    rule: >-
      A customer may hold any number of instruments of every type at once; there is no cap on
      instruments held. Instruments are never pooled automatically: each keeps its own balance, expiry
      and restrictions, and value moves between instruments only by replacement or a consolidation the
      holder confirms.
    eligibility: []
    params: {max_per_customer: null}

  - id: credit_agg_redemption_stacking
    subject: [credit_redeemed]
    rule: >-
      Several instruments can pay one order, drawn in the orders charter's `tender_capture_priority`,
      with at most `max_instruments_per_order` instruments of each type. An instrument is spent only
      while it is in status active, and only on or before its expiry date for an expiring instrument;
      a Bonus Gift Card cannot be spent before its valid_from_date. A Bonus Gift Card applies only when
      the order's merchandise subtotal after discounts reaches `min_merchandise_to_redeem_usd`. An
      instrument without `redeemable_on_shipping_fees` pays merchandise only, the remainder falling to
      the next tender. No instrument can pay for a gift card line. A bearer card used online needs its
      PIN (`pin_required_for_online_use`). Value spent never exceeds the balance; there is no negative
      balance (`negative_balance_allowed`).
      No instrument can pay a pre-order deposit (`redeemable_on_preorder_deposits`); deposits are taken by card under the preorders charter.
    eligibility:
      - id: instrument_active
        applies_to: [credit_redeemed]
        kind: state
        condition: "An instrument is spent only while it is in status active, and only on or before its expiry date for an expiring instrument; a Bonus Gift Card cannot be spent before its valid_from_date."
        evidence_fields: [credit_instruments.status, credit_instruments.instrument_id, credit_instruments.expiry_date, credit_instruments.valid_from_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_instruments.instrument_id]
          action_bindings:
            credit_instruments.instrument_id: instrument_id
        state_contract:
          field: credit_instruments.status
          allowed: [active]
    params:
      per_tier:
        Marlowe Rewards Note: {max_instruments_per_order: "=max_instruments_per_order", min_merchandise_to_redeem_usd: "=min_merchandise_to_redeem_usd"}
        Bonus Gift Card: {max_instruments_per_order: "=max_instruments_per_order", min_merchandise_to_redeem_usd: "=min_merchandise_to_redeem_usd"}
        Goodwill Credit: {max_instruments_per_order: "=max_instruments_per_order", min_merchandise_to_redeem_usd: "=min_merchandise_to_redeem_usd"}
        Return Store Credit: {max_instruments_per_order: "=max_instruments_per_order", min_merchandise_to_redeem_usd: "=min_merchandise_to_redeem_usd"}
        Marlowe & Finch Gift Card: {max_instruments_per_order: "=max_instruments_per_order", min_merchandise_to_redeem_usd: "=min_merchandise_to_redeem_usd"}
        Marlowe & Finch e-Gift Card: {max_instruments_per_order: "=max_instruments_per_order", min_merchandise_to_redeem_usd: "=min_merchandise_to_redeem_usd"}

  - id: credit_evt_refund_to_instrument
    subject: [credit_refunded_to_instrument, credit_reactivated]
    rule: >-
      Value refunded on an order or return goes back to the instrument it was spent from
      (`refund_back_to_instrument`), up to the amount spent from that instrument on that order, never
      to a different instrument, card or cash. A refund is loaded onto the instrument only while it is
      in status active, depleted or locked; a depleted instrument becomes active again, and a locked
      instrument keeps the refund frozen with its protected balance. When the instrument was closed by
      replacement or consolidation, the refund follows its balance to the instrument recorded as
      counterpart on its transfer-out row. When the instrument has expired, the refund is handled per
      `refund_to_expired_instrument_handling`: for a Marlowe Rewards Note a new note is issued for the
      refunded value under the loyalty charter's reissue rule (`reward_note_reissue_on_return`), and
      for a Bonus Gift Card or Goodwill Credit the refunded value is forfeited and not paid to any
      other tender. Only one refund row is loaded per instrument, order, return and refund date.
    eligibility:
      - id: instrument_can_receive
        applies_to: [credit_refunded_to_instrument]
        kind: state
        condition: "A refund is loaded onto the instrument only while it is in status active, depleted or locked; a depleted instrument becomes active again, and a locked instrument keeps the refund frozen with its protected balance."
        evidence_fields: [credit_instruments.status, credit_instruments.instrument_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_instruments.instrument_id]
          action_bindings:
            credit_instruments.instrument_id: instrument_id
        state_contract:
          field: credit_instruments.status
          allowed: [active, depleted, locked]
      - id: one_refund_row
        applies_to: [credit_refunded_to_instrument]
        kind: dedup
        condition: "Only one refund row is loaded per instrument, order, return and refund date."
        evidence_fields: [credit_transactions.instrument_id, credit_transactions.order_id, credit_transactions.return_id, credit_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_transactions.instrument_id, credit_transactions.order_id, credit_transactions.return_id]
          action_bindings:
            credit_transactions.instrument_id: instrument_id
            credit_transactions.order_id: order_id
            credit_transactions.return_id: return_id
        dedup_contract:
          table: credit_transactions
          mode: separate_record
          object_bindings: {instrument_id: instrument_id, order_id: order_id, return_id: return_id}
          duplicate_filters: {event_type: [credit_refunded_to_instrument]}
          distinct_fields: [event_date]
    params:
      per_tier:
        Marlowe Rewards Note: {refund_to_expired_instrument_handling: "=refund_to_expired_instrument_handling"}
        Bonus Gift Card: {refund_to_expired_instrument_handling: "=refund_to_expired_instrument_handling"}
        Goodwill Credit: {refund_to_expired_instrument_handling: "=refund_to_expired_instrument_handling"}
        Return Store Credit: {refund_to_expired_instrument_handling: "=refund_to_expired_instrument_handling"}
        Marlowe & Finch Gift Card: {refund_to_expired_instrument_handling: "=refund_to_expired_instrument_handling"}
        Marlowe & Finch e-Gift Card: {refund_to_expired_instrument_handling: "=refund_to_expired_instrument_handling"}

  - id: credit_evt_lost_stolen
    subject: [credit_locked, credit_unlocked, credit_replaced, credit_transferred_out, credit_loaded]
    rule: >-
      When the holder of record reports an instrument lost, stolen or used without permission, the agent
      locks it with the matching reason from `lock_reasons_allowed`; only value still on the
      instrument at the lock is protected (`replacement_protects_balance_from`), and spending before the
      lock is never reimbursed. A locked instrument is unlocked only when the holder confirms it is back
      in their possession and identity verification has passed in the same contact
      (`unlock_requires_verification`). A replacement is issued only for an instrument with
      `replaceable_if_lost`. A replacement is issued only once `replacement_wait_business_days` business
      days have passed since the instrument is locked. Business days run Monday to Friday excluding US
      federal holidays, the lock date is day zero, and the replacement may be issued on the day the
      count is reached. For a card with `replacement_requires_registration_or_proof`, the card must
      have been registered to the caller's profile before the lock, or the caller must be the purchaser
      of record of the order line that bought it; a caller who only holds the card number is not
      enough. A customer can receive at most `replacement_limit_12m` replacements in a trailing 12
      months (credit_msr_replacements_12m); beyond that the case is handed to a human representative.
      The replacement is a new instrument of the `replacement_variant`, keeping the original expiry
      rules, loaded with the whole balance at the lock plus refunds received while locked; the old
      instrument closes with reason replaced and its transfer-out row names the replacement as
      counterpart.
    eligibility:
      - id: replaceable
        applies_to: [credit_replaced]
        kind: authorization
        condition: "A replacement is issued only for an instrument with `replaceable_if_lost`."
        evidence_fields: [credit_instruments.variant_name, credit_instruments.instrument_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_instruments.instrument_id]
          action_bindings:
            credit_instruments.instrument_id: instrument_id
      - id: settlement_wait
        applies_to: [credit_replaced]
        kind: time
        condition: "A replacement is issued only once `replacement_wait_business_days` business days have passed since the instrument is locked."
        evidence_fields: [credit_instruments.locked_date, credit_instruments.instrument_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_instruments.instrument_id]
          action_bindings:
            credit_instruments.instrument_id: instrument_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the instrument is locked"
          anchor_source: credit_instruments.locked_date
          relation: not_before
          duration_source: variants.replacement_wait_business_days
          unit: business_days
          counting_rule: "Business days run Monday to Friday excluding US federal holidays, the lock date is day zero, and the replacement may be issued on the day the count is reached."
          boundary: inclusive
      - id: ownership_proof
        applies_to: [credit_replaced]
        kind: authorization
        condition: "For a card with `replacement_requires_registration_or_proof`, the card must have been registered to the caller's profile before the lock, or the caller must be the purchaser of record of the order line that bought it; a caller who only holds the card number is not enough."
        evidence_fields: [credit_instruments.instrument_id, credit_instruments.registered_date, credit_instruments.customer_id, credit_instruments.source_reference, order_lines.order_line_id, order_lines.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_instruments.instrument_id]
          action_bindings:
            credit_instruments.instrument_id: instrument_id
      - id: replacement_limit
        applies_to: [credit_replaced]
        kind: dedup
        condition: "A customer can receive at most `replacement_limit_12m` replacements in a trailing 12 months (credit_msr_replacements_12m); beyond that the case is handed to a human representative."
        evidence_fields: [credit_transactions.customer_id, credit_transactions.transfer_reason, credit_transactions.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_transactions.customer_id]
          action_bindings:
            credit_transactions.customer_id: customer_id
        dedup_contract:
          table: credit_transactions
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {transfer_reason: [replacement]}
          distinct_fields: [event_date, instrument_id]
    params:
      per_tier:
        Marlowe Rewards Note: {replacement_wait_business_days: "=replacement_wait_business_days", replacement_limit_12m: "=replacement_limit_12m"}
        Bonus Gift Card: {replacement_wait_business_days: "=replacement_wait_business_days", replacement_limit_12m: "=replacement_limit_12m"}
        Goodwill Credit: {replacement_wait_business_days: "=replacement_wait_business_days", replacement_limit_12m: "=replacement_limit_12m"}
        Return Store Credit: {replacement_wait_business_days: "=replacement_wait_business_days", replacement_limit_12m: "=replacement_limit_12m"}
        Marlowe & Finch Gift Card: {replacement_wait_business_days: "=replacement_wait_business_days", replacement_limit_12m: "=replacement_limit_12m"}
        Marlowe & Finch e-Gift Card: {replacement_wait_business_days: "=replacement_wait_business_days", replacement_limit_12m: "=replacement_limit_12m"}
    measures: [credit_msr_replacements_12m]

  - id: credit_evt_cash_out
    subject: [credit_closed_by_customer, credit_cashed_out]
    rule: >-
      Marlowe & Finch pays out a small remaining balance in cash only where the holder's billing-state
      law requires it, by the state register below keyed on customers.billing_state; holders in any
      other state cannot cash out. Only instruments with `cash_out_eligible` qualify — promotional
      value (`promotional_value`) is never cashed out. The balance must meet the state's threshold with
      its comparison (below, or at or below), and in Massachusetts credit_msr_used_pct must also be at
      least the state's minimum used percentage. A cash-out closes the instrument for its whole
      balance; it is never partial. A cash-out is made only on a cash_out request for that instrument
      whose request_status is confirmed (`cash_out_requires_customer_confirmation`): the agent records
      the request, and the holder personally confirms it. The payment is a mailed check
      (`cash_out_payout_method`) issued within `cash_out_processing_business_days` business days. A
      locked instrument must be unlocked or replaced first. Consolidation follows the same confirmation
      path: a consolidation request names at least `consolidation_min_instruments` active instruments of
      a type with `consolidation_allowed`, and on confirmation each closes with reason consolidated
      and moves its whole balance to one new instrument of the `consolidation_target_variant`.
    eligibility:
      - id: confirmed_request
        applies_to: [credit_closed_by_customer, credit_cashed_out]
        kind: authorization
        condition: "A cash-out is made only on a cash_out request for that instrument whose request_status is confirmed (`cash_out_requires_customer_confirmation`): the agent records the request, and the holder personally confirms it."
        evidence_fields: [credit_requests.instrument_id, credit_requests.request_type, credit_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_requests.instrument_id]
          action_bindings:
            credit_requests.instrument_id: instrument_id
    params:
      cash_out_state_register:
        CA: {threshold_usd: 10.00, comparison: below, min_used_pct: 0}
        CO: {threshold_usd: 5.00, comparison: below, min_used_pct: 0}
        ME: {threshold_usd: 5.00, comparison: below, min_used_pct: 0}
        MA: {threshold_usd: 5.00, comparison: at_or_below, min_used_pct: 90}
        MT: {threshold_usd: 5.00, comparison: below, min_used_pct: 0}
        NJ: {threshold_usd: 5.00, comparison: below, min_used_pct: 0}
        OR: {threshold_usd: 5.00, comparison: below, min_used_pct: 0}
        RI: {threshold_usd: 1.00, comparison: below, min_used_pct: 0}
        VT: {threshold_usd: 1.00, comparison: below, min_used_pct: 0}
        WA: {threshold_usd: 5.00, comparison: below, min_used_pct: 0}
    measures: [credit_msr_used_pct]

  - id: credit_evt_expiry
    subject: [credit_expiry_reached, credit_forfeited]
    rule: >-
      Only instruments with `expires` ever expire; Return Store Credit and purchased gift cards keep
      their value indefinitely and never carry fees. An expiring instrument stops working at the end of
      its expiry_date, Eastern Time (`expiry_cutoff_rule`), and on the next day its remaining balance is
      forfeited in full. An expiry date is never extended by an agent, and a forfeited balance is never
      restored except through the reissue of a Marlowe Rewards Note under the refund rule. An instrument
      that is locked, depleted or already closed on its expiry date does not move to expired.
    eligibility: []

  - id: credit_evt_clawback
    subject: [credit_clawed_back]
    rule: >-
      Value is taken back only from an instrument with `clawback_allowed`. Return Store Credit issued
      before a return was inspected is clawed back for the value of the units the returns charter
      rejects at inspection (reason failed_return_inspection). A Bonus Gift Card is clawed back when the
      gift card purchase that earned it is cancelled or refunded so that the order no longer contains
      the blocks the bonus was issued for (`bonus_void_if_qualifying_purchase_refunded`, reason
      qualifying_purchase_refunded); a bonus card still in pending_activation is voided instead. A
      clawback is limited to the current balance (`clawback_limit`); whatever cannot be recovered is
      settled under the returns charter or written off, and the balance never goes below zero. Only
      one clawback is made per instrument for each return or order that caused it.
    eligibility:
      - id: one_clawback_per_source
        applies_to: [credit_clawed_back]
        kind: dedup
        condition: "Only one clawback is made per instrument for each return or order that caused it."
        evidence_fields: [credit_transactions.instrument_id, credit_transactions.return_id, credit_transactions.order_id, credit_transactions.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [credit_transactions.instrument_id, credit_transactions.return_id]
            - [credit_transactions.instrument_id, credit_transactions.order_id]
          action_bindings:
            credit_transactions.instrument_id: instrument_id
            credit_transactions.return_id: return_id
            credit_transactions.order_id: order_id
        dedup_contract:
          table: credit_transactions
          mode: separate_record
          object_bindings: {instrument_id: instrument_id, return_id: return_id, order_id: order_id}
          duplicate_filters: {event_type: [credit_clawed_back]}
          distinct_fields: []

  - id: credit_evt_bonus_promotion
    subject: [credit_issued]
    rule: >-
      During the bonus promotion, an order placed from `bonus_promotion_start_date` through
      `bonus_promotion_end_date` (Eastern Time, both days included) that buys gift cards earns one Bonus
      Gift Card worth `bonus_value_per_block_usd` for every whole `bonus_purchase_block_usd` of gift
      card lines on that order, capped at the card's `max_balance_usd`; gift card value bought on
      separate orders is never combined. The bonus card is issued on the order's dispatch date to the
      purchaser and is spendable only from its valid_from_date. Orders placed outside the promotion
      earn no bonus, and a bonus is never issued afterwards for an order that missed it.
    eligibility: []
    params:
      per_tier:
        Marlowe Rewards Note: {bonus_value_per_block_usd: "=bonus_value_per_block_usd", bonus_purchase_block_usd: "=bonus_purchase_block_usd"}
        Bonus Gift Card: {bonus_value_per_block_usd: "=bonus_value_per_block_usd", bonus_purchase_block_usd: "=bonus_purchase_block_usd"}
        Goodwill Credit: {bonus_value_per_block_usd: "=bonus_value_per_block_usd", bonus_purchase_block_usd: "=bonus_purchase_block_usd"}
        Return Store Credit: {bonus_value_per_block_usd: "=bonus_value_per_block_usd", bonus_purchase_block_usd: "=bonus_purchase_block_usd"}
        Marlowe & Finch Gift Card: {bonus_value_per_block_usd: "=bonus_value_per_block_usd", bonus_purchase_block_usd: "=bonus_purchase_block_usd"}
        Marlowe & Finch e-Gift Card: {bonus_value_per_block_usd: "=bonus_value_per_block_usd", bonus_purchase_block_usd: "=bonus_purchase_block_usd"}

  - id: credit_evt_goodwill_issue
    subject: [credit_issued]
    rule: >-
      Goodwill Credit is issued only as compensation decided under the claims charter
      (`issue_requires_documented_failure`). A Goodwill Credit is issued only against a delivery claim
      whose status is approved or resolved, and its source_reference is that claim's claim_id. A
      customer receives at most `annual_issue_cap_count` Goodwill Credits and at most
      `annual_issue_cap_usd` of Goodwill Credit in a trailing 12 months
      (credit_msr_goodwill_issued_12m_count, credit_msr_goodwill_issued_12m_usd); a credit that would
      exceed the value cap is issued only for the remaining allowance, and when either cap is already
      reached none is issued and the claims charter's `goodwill_cap_fallback` applies instead.
    eligibility:
      - id: documented_failure
        applies_to: [credit_issued]
        kind: state
        condition: "A Goodwill Credit is issued only against a delivery claim whose status is approved or resolved, and its source_reference is that claim's claim_id."
        evidence_fields: [delivery_claims.status, delivery_claims.claim_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_claims.claim_id]
          action_bindings:
            delivery_claims.claim_id: source_reference
        state_contract:
          field: delivery_claims.status
          allowed: [approved, resolved]
    measures: [credit_msr_goodwill_issued_12m_count, credit_msr_goodwill_issued_12m_usd]

  - id: credit_lifecycle_balance
    subject: [credit_depleted, credit_depleted_closed, credit_voided, credit_registered]
    rule: >-
      An instrument's status follows its balance: it moves to depleted when the balance reaches 0.00 and
      closes `depleted_retention_days` calendar days after its last transaction if nothing has come back
      to it. A plastic gift card or Bonus Gift Card still in pending_activation is voided when the order
      line or promotion that created it is cancelled before dispatch. A bearer card
      (`registration_allowed`) is registered to the profile of a verified customer who states its full
      card number and PIN; registration makes that customer the holder of record, is possible only while
      the card is active, and cannot be undone by the previous holder. Account-bound instruments
      (`account_bound`) are never registered to another customer (`transferable_to_other_customer`).
    eligibility:
      - id: register_active_card
        applies_to: [credit_registered]
        kind: state
        condition: "A bearer card (`registration_allowed`) is registered to the profile of a verified customer who states its full card number and PIN; registration makes that customer the holder of record, is possible only while the card is active, and cannot be undone by the previous holder."
        evidence_fields: [credit_instruments.status, credit_instruments.instrument_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [credit_instruments.instrument_id]
          action_bindings:
            credit_instruments.instrument_id: instrument_id
        state_contract:
          field: credit_instruments.status
          allowed: [active]
    params:
      per_tier:
        Marlowe Rewards Note: {depleted_retention_days: "=depleted_retention_days"}
        Bonus Gift Card: {depleted_retention_days: "=depleted_retention_days"}
        Goodwill Credit: {depleted_retention_days: "=depleted_retention_days"}
        Return Store Credit: {depleted_retention_days: "=depleted_retention_days"}
        Marlowe & Finch Gift Card: {depleted_retention_days: "=depleted_retention_days"}
        Marlowe & Finch e-Gift Card: {depleted_retention_days: "=depleted_retention_days"}

extended_policies:
  - id: credit_ext_instant_credit_recovery
    base_policy_refs: [credit_evt_clawback]
    overwrite:
      - base_policy: credit_evt_clawback
        superseded_clause: >-
          Return Store Credit issued before a return was inspected is clawed back for the value of
          the units the returns charter rejects at inspection (reason failed_return_inspection).
        replaced_by: >-
          Return Store Credit issued before a return was inspected is clawed back, once the
          return's inspection results are posted, for the instant-credit recovery worked out below
          (reason failed_return_inspection), booked against the return's number with no order
          number.
    trigger: state_due
    subject: [credit_clawed_back]
    computes: clawback_usd
    target_tool: claw_back_instrument_value_f010c427
    params:
      cap_long_months: 60
      cap_long_usd: 15.00
      cap_mid_months: 24
      cap_mid_usd: 25.00
      box_share_label_plan: 0.0
      box_share_other_plan: 0.5
      box_share_standard: 1.0
      lag_full_days: 14
      lag_half_days: 7
      absorb_full_share: 1.0
      absorb_half_share: 0.5
      earn_window_months: 12
      earn_top_count: 6
      earn_mid_count: 3
      member_half_rate: 0.5
      member_quarter_off_rate: 0.75
      incident_window_months: 24
      allowance_first_usd: 5.00
      allowance_second_usd: 2.00
    rule: >-
      Return Store Credit issued before a return was inspected is clawed back, once the return's
      inspection results are posted, for the instant-credit recovery worked out below (reason
      failed_return_inspection), booked against the return's number with no order number. The
      instant-credit recovery is worked out from the return's own settlement record and the store
      credit's own ledger. The recovery's rejected part is the instant credit loaded onto the store
      credit when it was issued less the sum of the line credits that the return's settlement record
      shows for the units inspection accepted, which leaves the merchandise and sales tax of the
      units inspection rejected. The recovery's restocking part is the restocking fee that the
      return's settlement record shows for units accepted with a fee, as booked. The recovery's
      box-fee part is the missing-box fee that the return's settlement record shows for units
      accepted with a fee, as booked. The recovery's fee part is the restocking part plus the
      box-fee part. The instant-credit recovery is the rejected part plus the fee part, limited to
      the store credit's current balance and rounded half up to the cent.
      The recovery's restocking part is capped by the length of the customer's Marlowe Rewards
      membership on the recovery date: for a membership enrolled at least `cap_long_months` whole
      months earlier it is the booked restocking fee capped at `cap_long_usd`; for a membership
      enrolled at least `cap_mid_months` but fewer than `cap_long_months` whole months earlier it is
      the booked restocking fee capped at `cap_mid_usd`; for a shorter membership, or none, it is
      the booked restocking fee uncapped.
      The recovery's box-fee part follows the customer's Marlowe & Finch Unlimited membership on
      the recovery date: with a membership in status trial or active whose plan covers return
      labels it is `box_share_label_plan` of the booked missing-box fee; with a membership in status
      trial or active whose plan does not cover return labels it is `box_share_other_plan` of the
      booked missing-box fee, rounded half up to the cent; with no membership in status trial or
      active it is `box_share_standard` of the booked missing-box fee.
      When the inspection was posted late, Marlowe & Finch absorbs a share of the recovery's fee
      part: when the return's inspection date is more than `lag_full_days` calendar days after the
      date the returns centre received the parcel, the absorbed share is `absorb_full_share`; when
      it is more than `lag_half_days` but at most `lag_full_days` calendar days after receipt, the
      absorbed share is `absorb_half_share`; when it is at most `lag_half_days` calendar days after
      receipt, nothing is absorbed. The absorbed share is taken off the fee part and what remains
      is rounded half up to the cent.
      The recovery's fee part, once any absorbed share is taken off, receives the member treatment
      of the customer's Marlowe Rewards tier and recent purchasing: for a Marlowe Rewards Platinum,
      Icon or Atelier member whose membership posted points for at least `earn_top_count` dispatched
      orders in the last `earn_window_months` months, the fee part is multiplied by
      `member_half_rate` and rounded down to the whole dollar; for a Marlowe Rewards Silver or Gold
      member whose membership posted points for at least `earn_mid_count` dispatched orders in the
      last `earn_window_months` months, the fee part is multiplied by `member_quarter_off_rate` and
      rounded up to the cent; for any other customer the fee part is kept as it stands.
      A first-recovery allowance is taken off the rejected part plus the fee part, never below zero,
      before the limit to the current balance applies: when none of the customer's other returns
      has an inspected line rejected or accepted with a fee in the last `incident_window_months`
      months, the allowance is `allowance_first_usd`; when exactly one such inspected line exists on
      the customer's other returns in that window, the allowance is `allowance_second_usd`; with two
      or more such lines there is no allowance.
    prerequisite: []
    cross_category:
      - category: returns
        as: history
        reads: [return_settlements.amount_usd, return_settlements.event_type, return_settlements.fee_type, return_cases.received_date, return_cases.inspected_date, return_lines.inspection_outcome]
        note: The line credits and fees booked on the return give the rejected and fee parts; the return's receipt and inspection dates decide the late-inspection absorption; inspected lines on the customer's other returns decide the first-recovery allowance.
      - category: loyalty
        as: branch
        reads: [variant_name, enrolled_date, loyalty_ledger.event_type]
        note: The membership's enrolment date decides the restocking cap; its tier and the count of earning postings in the window decide the member treatment.
      - category: pass
        as: branch
        reads: [status, covers_return_label]
        note: The Unlimited membership's status and whether its plan covers return labels decide the box-fee share.
    compute:
      - balance_now: "F('balance_usd')"
      - instant_credit: "SUM('credit_transactions', 'amount_usd', event_type='credit_loaded', load_type='initial_issue')"
      - line_credits: "XSUM('returns', 'return_settlements', 'amount_usd', return_id=F('source_reference'), event_type='returns_refund_credited')"
      - rejected_part: "MX(0, round(instant_credit - line_credits, 2))"
      - restock_booked: "-XSUM('returns', 'return_settlements', 'amount_usd', return_id=F('source_reference'), event_type='returns_fee_assessed', fee_type='restocking_fee')"
      - box_booked: "-XSUM('returns', 'return_settlements', 'amount_usd', return_id=F('source_reference'), event_type='returns_fee_assessed', fee_type='missing_box_fee')"
      - membership_months: "MONTHS(CFIELD('loyalty', 'enrolled_date'), NOW) if CFIELD('loyalty', 'enrolled_date') else 0"
      - restocking_part: "MN(restock_booked, K('cap_long_usd')) if membership_months >= K('cap_long_months') else (MN(restock_booked, K('cap_mid_usd')) if membership_months >= K('cap_mid_months') else restock_booked)"
      - plan_status: "CFIELD('pass', 'status')"
      - label_cover: "CPARAM('pass', 'covers_return_label')"
      - box_share: "K('box_share_label_plan') if ((plan_status == 'active' or plan_status == 'trial') and label_cover == True) else (K('box_share_other_plan') if (plan_status == 'active' or plan_status == 'trial') else K('box_share_standard'))"
      - box_fee_part: "int(round(box_booked * box_share * 100, 4) + 0.5) / 100"
      - fee_part: "round(restocking_part + box_fee_part, 2)"
      - received_on: "CFIELD('returns', 'received_date', return_id=F('source_reference'))"
      - inspected_on: "CFIELD('returns', 'inspected_date', return_id=F('source_reference'))"
      - inspection_lag_days: "DAYS(received_on, inspected_on) if (received_on and inspected_on) else 0"
      - absorbed_share: "K('absorb_full_share') if inspection_lag_days > K('lag_full_days') else (K('absorb_half_share') if inspection_lag_days > K('lag_half_days') else 0)"
      - fee_after_absorption: "int(round(fee_part * (1 - absorbed_share) * 100, 4) + 0.5) / 100"
      - member_tier: "CFIELD('loyalty', 'variant_name')"
      - earning_orders: "XCOUNT('loyalty', 'loyalty_ledger', within_months=K('earn_window_months'), date_field='posting_date', event_type='loyalty_points_earned')"
      - fee_after_member: "int(round(fee_after_absorption * K('member_half_rate'), 4)) if ((member_tier == 'Marlowe Rewards Platinum' or member_tier == 'Marlowe Rewards Icon' or member_tier == 'Marlowe Rewards Atelier') and earning_orders >= K('earn_top_count')) else ((int(round(fee_after_absorption * K('member_quarter_off_rate') * 100, 4)) + (1 if round(fee_after_absorption * K('member_quarter_off_rate') * 100, 4) > int(round(fee_after_absorption * K('member_quarter_off_rate') * 100, 4)) else 0)) / 100 if ((member_tier == 'Marlowe Rewards Silver' or member_tier == 'Marlowe Rewards Gold') and earning_orders >= K('earn_mid_count')) else fee_after_absorption)"
      - incident_lines_all: "XCOUNT('returns', 'return_lines', within_months=K('incident_window_months'), event_type='returns_line_inspected', inspection_outcome='rejected') + XCOUNT('returns', 'return_lines', within_months=K('incident_window_months'), event_type='returns_line_inspected', inspection_outcome='accepted_with_fee')"
      - incident_lines_this: "XCOUNT('returns', 'return_lines', within_months=K('incident_window_months'), return_id=F('source_reference'), event_type='returns_line_inspected', inspection_outcome='rejected') + XCOUNT('returns', 'return_lines', within_months=K('incident_window_months'), return_id=F('source_reference'), event_type='returns_line_inspected', inspection_outcome='accepted_with_fee')"
      - other_incident_lines: "incident_lines_all - incident_lines_this"
      - allowance: "K('allowance_first_usd') if other_incident_lines == 0 else (K('allowance_second_usd') if other_incident_lines == 1 else 0)"
      - recovery_before_limit: "MX(0, round(rejected_part + fee_after_member - allowance, 2))"
      - result: "int(round(MN(balance_now, recovery_before_limit) * 100, 4) + 0.5) / 100"
    compute_basis:
      balance_now: "The instant-credit recovery is the rejected part plus the fee part, limited to the store credit's current balance and rounded half up to the cent."
      instant_credit: "The recovery's rejected part is the instant credit loaded onto the store credit when it was issued less the sum of the line credits that the return's settlement record shows for the units inspection accepted, which leaves the merchandise and sales tax of the units inspection rejected."
      line_credits: "The recovery's rejected part is the instant credit loaded onto the store credit when it was issued less the sum of the line credits that the return's settlement record shows for the units inspection accepted, which leaves the merchandise and sales tax of the units inspection rejected."
      rejected_part: "The recovery's rejected part is the instant credit loaded onto the store credit when it was issued less the sum of the line credits that the return's settlement record shows for the units inspection accepted, which leaves the merchandise and sales tax of the units inspection rejected."
      restock_booked: "The recovery's restocking part is the restocking fee that the return's settlement record shows for units accepted with a fee, as booked."
      box_booked: "The recovery's box-fee part is the missing-box fee that the return's settlement record shows for units accepted with a fee, as booked."
      membership_months: "The recovery's restocking part is capped by the length of the customer's Marlowe Rewards membership on the recovery date"
      restocking_part: "for a membership enrolled at least `cap_long_months` whole months earlier it is the booked restocking fee capped at `cap_long_usd`; for a membership enrolled at least `cap_mid_months` but fewer than `cap_long_months` whole months earlier it is the booked restocking fee capped at `cap_mid_usd`; for a shorter membership, or none, it is the booked restocking fee uncapped."
      plan_status: "The recovery's box-fee part follows the customer's Marlowe & Finch Unlimited membership on the recovery date"
      label_cover: "with a membership in status trial or active whose plan covers return labels it is `box_share_label_plan` of the booked missing-box fee"
      box_share: "with a membership in status trial or active whose plan covers return labels it is `box_share_label_plan` of the booked missing-box fee; with a membership in status trial or active whose plan does not cover return labels it is `box_share_other_plan` of the booked missing-box fee, rounded half up to the cent; with no membership in status trial or active it is `box_share_standard` of the booked missing-box fee."
      box_fee_part: "with a membership in status trial or active whose plan does not cover return labels it is `box_share_other_plan` of the booked missing-box fee, rounded half up to the cent"
      fee_part: "The recovery's fee part is the restocking part plus the box-fee part."
      received_on: "when the return's inspection date is more than `lag_full_days` calendar days after the date the returns centre received the parcel, the absorbed share is `absorb_full_share`"
      inspected_on: "when the return's inspection date is more than `lag_full_days` calendar days after the date the returns centre received the parcel, the absorbed share is `absorb_full_share`"
      inspection_lag_days: "when the return's inspection date is more than `lag_full_days` calendar days after the date the returns centre received the parcel"
      absorbed_share: "when the return's inspection date is more than `lag_full_days` calendar days after the date the returns centre received the parcel, the absorbed share is `absorb_full_share`; when it is more than `lag_half_days` but at most `lag_full_days` calendar days after receipt, the absorbed share is `absorb_half_share`; when it is at most `lag_half_days` calendar days after receipt, nothing is absorbed."
      fee_after_absorption: "The absorbed share is taken off the fee part and what remains is rounded half up to the cent."
      member_tier: "The recovery's fee part, once any absorbed share is taken off, receives the member treatment of the customer's Marlowe Rewards tier and recent purchasing"
      earning_orders: "whose membership posted points for at least `earn_top_count` dispatched orders in the last `earn_window_months` months"
      fee_after_member: "for a Marlowe Rewards Platinum, Icon or Atelier member whose membership posted points for at least `earn_top_count` dispatched orders in the last `earn_window_months` months, the fee part is multiplied by `member_half_rate` and rounded down to the whole dollar; for a Marlowe Rewards Silver or Gold member whose membership posted points for at least `earn_mid_count` dispatched orders in the last `earn_window_months` months, the fee part is multiplied by `member_quarter_off_rate` and rounded up to the cent; for any other customer the fee part is kept as it stands."
      incident_lines_all: "when none of the customer's other returns has an inspected line rejected or accepted with a fee in the last `incident_window_months` months, the allowance is `allowance_first_usd`"
      incident_lines_this: "when none of the customer's other returns has an inspected line rejected or accepted with a fee in the last `incident_window_months` months, the allowance is `allowance_first_usd`"
      other_incident_lines: "when exactly one such inspected line exists on the customer's other returns in that window, the allowance is `allowance_second_usd`"
      allowance: "when none of the customer's other returns has an inspected line rejected or accepted with a fee in the last `incident_window_months` months, the allowance is `allowance_first_usd`; when exactly one such inspected line exists on the customer's other returns in that window, the allowance is `allowance_second_usd`; with two or more such lines there is no allowance."
      recovery_before_limit: "A first-recovery allowance is taken off the rejected part plus the fee part, never below zero, before the limit to the current balance applies"
      result: "The instant-credit recovery is the rejected part plus the fee part, limited to the store credit's current balance and rounded half up to the cent."
    factors:
      - id: restocking_cap_by_membership_length
        effect: parameter
        decides: restocking_part
        bindings: [membership_months, restocking_part]
        ladder:
          - when: "Marlowe Rewards membership enrolled at least cap_long_months whole months before the recovery date"
            value: "booked restocking fee capped at K('cap_long_usd')"
          - when: "Marlowe Rewards membership enrolled at least cap_mid_months but fewer than cap_long_months whole months before the recovery date"
            value: "booked restocking fee capped at K('cap_mid_usd')"
          - when: "otherwise (a shorter membership, or none)"
            value: "booked restocking fee uncapped"
        baseline:
          restocking_part: "restock_booked"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
      - id: box_fee_share_by_unlimited_plan
        effect: parameter
        decides: box_share
        bindings: [plan_status, label_cover, box_share]
        ladder:
          - when: "Unlimited membership in status trial or active AND its plan covers return labels"
            value: "K('box_share_label_plan')"
          - when: "Unlimited membership in status trial or active whose plan does not cover return labels"
            value: "K('box_share_other_plan')"
          - when: "otherwise (no Unlimited membership in status trial or active)"
            value: "K('box_share_standard')"
        baseline:
          box_share: "K('box_share_standard')"
        evidence: [cross_category, tier_param]
        cross_difficulty: null
      - id: late_inspection_absorption
        effect: parameter
        decides: absorbed_share
        bindings: [received_on, inspected_on, inspection_lag_days, absorbed_share]
        ladder:
          - when: "the return's inspection date is more than lag_full_days calendar days after the returns centre received the parcel"
            value: "K('absorb_full_share')"
          - when: "the inspection date is more than lag_half_days but at most lag_full_days calendar days after receipt"
            value: "K('absorb_half_share')"
          - when: "otherwise (at most lag_half_days calendar days after receipt)"
            value: "0 (nothing absorbed)"
        baseline:
          absorbed_share: "0"
        evidence: [cross_category, date]
        cross_difficulty: returns
      - id: member_fee_treatment
        effect: method
        decides: fee_after_member
        bindings: [member_tier, earning_orders, fee_after_member]
        ladder:
          - when: "Marlowe Rewards Platinum, Icon or Atelier member AND at least earn_top_count earning postings for dispatched orders in the last earn_window_months months"
            method: "the fee part is multiplied by member_half_rate and rounded down to the whole dollar"
          - when: "Marlowe Rewards Silver or Gold member AND at least earn_mid_count earning postings for dispatched orders in the last earn_window_months months"
            method: "the fee part is multiplied by member_quarter_off_rate and rounded up to the cent"
          - when: "otherwise"
            method: "the fee part is kept as it stands"
        baseline:
          fee_after_member: "fee_after_absorption"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
      - id: first_recovery_allowance
        effect: parameter
        decides: allowance
        bindings: [incident_lines_all, incident_lines_this, other_incident_lines, allowance]
        ladder:
          - when: "no inspected line rejected or accepted with a fee on the customer's other returns in the last incident_window_months months"
            value: "K('allowance_first_usd')"
          - when: "exactly one such inspected line on the customer's other returns in that window"
            value: "K('allowance_second_usd')"
          - when: "otherwise (two or more such lines)"
            value: "0 (no allowance)"
        baseline:
          allowance: "0"
        evidence: [cross_category, history]
        cross_difficulty: returns
    baseline:
      rule: >-
        The instant-credit recovery is worked out from the return's own settlement record and the
        store credit's own ledger. The recovery's rejected part is the instant credit loaded onto the
        store credit when it was issued less the sum of the line credits that the return's settlement
        record shows for the units inspection accepted, which leaves the merchandise and sales tax of
        the units inspection rejected. The recovery's restocking part is the restocking fee that the
        return's settlement record shows for units accepted with a fee, as booked. The recovery's
        box-fee part is the missing-box fee that the return's settlement record shows for units
        accepted with a fee, as booked. The recovery's fee part is the restocking part plus the
        box-fee part. The instant-credit recovery is the rejected part plus the fee part, limited to
        the store credit's current balance and rounded half up to the cent.
      params: []
    inputs:
      history:
        - {table: credit_transactions, aggregate: sum, field: amount_usd, filters: {event_type: credit_loaded, load_type: initial_issue}}
        - {category: returns, table: return_settlements, aggregate: sum, field: amount_usd, filters: {event_type: returns_refund_credited}}
        - {category: returns, table: return_settlements, aggregate: sum, field: amount_usd, filters: {event_type: returns_fee_assessed}}
        - {category: returns, table: return_lines, aggregate: count, field: inspection_outcome, within_months: 24, filters: {event_type: returns_line_inspected}}
        - {category: loyalty, table: loyalty_ledger, aggregate: count, field: event_type, within_months: 12, filters: {event_type: loyalty_points_earned}}
      cross_category: [returns, loyalty, pass]

  - id: credit_ext_small_balance_cash_out
    base_policy_refs: [credit_evt_cash_out]
    overwrite:
      - base_policy: credit_evt_cash_out
        superseded_clause: >-
          A cash-out closes the instrument for its whole balance; it is never partial.
        replaced_by: >-
          A cash-out pays the holder, by mailed check, the cash-out amount worked out below and
          lowers the instrument's balance by it; the instrument closes with reason cashed_out when
          nothing is left on it, and otherwise stays active with the remaining value, which can be
          cashed out once it is no longer held.
      - base_policy: credit_evt_cash_out
        superseded_clause: >-
          A cash-out is made only on a cash_out request for that instrument whose request_status is
          confirmed (`cash_out_requires_customer_confirmation`): the agent records the request, and
          the holder personally confirms it.
        replaced_by: >-
          The holder's own confirmation records the cash-out request for that instrument as
          confirmed and books the cash-out in the same step, and no cash-out is made without it.
    trigger: on_request
    subject: [credit_closed_by_customer, credit_cashed_out]
    computes: cash_out_usd
    target_tool: confirm_balance_cash_out_04a53640
    params:
      hold_uninspected_share: 1.0
      hold_inspected_share: 0.5
      top_tenure_months: 36
      mid_tenure_months: 12
      avail_days_top: 7
      avail_days_mid: 9
      avail_days_standard: 12
      claims_window_months: 24
      claims_clean_days: 1
      claims_repeat_days: 3
      reserve_recent_days: 30
      reserve_older_days: 90
      reserve_recent_share: 0.25
      reserve_older_share: 0.10
    rule: >-
      A cash-out pays the holder, by mailed check, the cash-out amount worked out below and lowers
      the instrument's balance by it; the instrument closes with reason cashed_out when nothing is
      left on it, and otherwise stays active with the remaining value, which can be cashed out once
      it is no longer held. The holder's own confirmation records the cash-out request for that
      instrument as confirmed and books the cash-out in the same step, and no cash-out is made
      without it. The cash-out amount is fixed only after the store credit's ledger carries the
      recovery entry owed for every return whose instant credit was loaded onto it and whose
      inspection results have posted.
      The cash-out amount starts from the instrument's current balance. The returned-order value of
      a store credit is its current balance less the refunds loaded onto it from orders paid with
      it, never below zero. The refund availability period is `avail_days_standard` calendar days.
      Refunds loaded onto the instrument from orders paid with it become payable once the refund
      availability period has passed since the most recent such refund, counted in calendar days
      from that refund's date; until then the whole of that refunded value is held. That refund's
      date is day zero, and the refunded value is payable on the day the count reaches the refund
      availability period. The cash-out amount is the current balance less the held refunded value, never below zero, in US dollars
      to the cent.
      Value paid for with promotional tenders is never cashed out: when the order behind the store
      credit's return was captured partly with Marlowe Rewards Notes, Goodwill Credit or Bonus Gift
      Cards and partly with other tenders, the promotional exclusion is the returned-order value
      times the promotional tenders' share of everything captured on that order, rounded half up to
      the cent; when that order was captured entirely with such promotional tenders, the
      promotional exclusion is the whole returned-order value; when no promotional tender was
      captured on it, or the instrument did not come from a return, there is no promotional
      exclusion. The promotional exclusion stays on the instrument as spendable store credit and is
      taken off the cash-out amount.
      While the return behind a store credit is not yet settled, part of the returned-order value is
      held for its settlement: when the return is in status authorized, in_transit or received, the
      settlement hold is `hold_uninspected_share` of the returned-order value; when the return is in
      status inspected, the settlement hold is `hold_inspected_share` of the returned-order value,
      rounded half up to the cent; in any other status, or for an instrument that did not come from
      a return, there is no settlement hold. The settlement hold stays on the instrument and is
      taken off the cash-out amount.
      The refund availability period follows the holder's Marlowe Rewards standing on the cash-out
      date: for a Marlowe Rewards Gold, Platinum, Icon or Atelier member whose membership was
      enrolled at least `top_tenure_months` whole months earlier it is `avail_days_top` calendar
      days; for a Marlowe Rewards Silver member whose membership was enrolled at least
      `mid_tenure_months` whole months earlier it is `avail_days_mid` calendar days; for anyone
      else it is `avail_days_standard` calendar days.
      The refund availability period is then adjusted by the holder's delivery-claim record: when
      no compensation was issued on any of the holder's delivery claims in the last
      `claims_window_months` months, it is shortened by `claims_clean_days` day; when compensation
      was issued two or more times in that window, it is lengthened by `claims_repeat_days` days;
      when compensation was issued exactly once in that window it is not adjusted.
      After a lock on the instrument has been lifted, a lock reserve is kept back from the
      instrument's current balance less the held refunded value: when the instrument's most recent
      lock was placed at most `reserve_recent_days` calendar days before the cash-out date, the lock
      reserve is `reserve_recent_share` of that amount; when it was placed more than
      `reserve_recent_days` but at most `reserve_older_days` calendar days before the cash-out date,
      the lock reserve is `reserve_older_share` of that amount; when it was placed earlier, or the
      instrument was never locked, there is no lock reserve. The lock reserve is rounded half up to
      the cent, stays on the instrument and is taken off the cash-out amount.
    prerequisite:
      - problem: credit_ext_instant_credit_recovery
        kind: value_input
        gate: balance_now
        form: state
        policy_source: >-
          The cash-out amount is fixed only after the store credit's ledger carries the recovery
          entry owed for every return whose instant credit was loaded onto it and whose inspection
          results have posted.
        condition: >-
          credit_transactions holds a credit_clawed_back row with clawback_reason
          failed_return_inspection and return_id equal to the store credit's source_reference for
          every such return whose return_cases.inspected_date is set.
        resolved_by: claw_back_instrument_value_f010c427
        effect: >-
          The recovery entry lowers the store credit's current balance (balance_now) by the
          instant-credit recovery, and every later quantity of the cash-out amount is read from
          that lowered balance.
    cross_category:
      - category: returns
        as: branch
        reads: [order_id, status]
        note: The return behind the store credit names the order whose tenders decide the promotional exclusion, and its status decides the settlement hold.
      - category: orders
        as: history
        reads: [order_payments.amount_usd, order_payments.tender_type, order_payments.event_type]
        note: The captures on the returned order, by tender, give the promotional share.
      - category: loyalty
        as: branch
        reads: [variant_name, enrolled_date]
        note: The holder's tier and enrolment date decide the refund availability period.
      - category: claims
        as: history
        reads: [claim_events.event_type, claim_events.event_date]
        note: Compensation issued on the holder's delivery claims in the window adjusts the refund availability period.
    compute:
      - balance_now: "F('balance_usd')"
      - refunds_in: "SUM('credit_transactions', 'amount_usd', event_type='credit_refunded_to_instrument')"
      - returned_order_value: "MX(0, round(balance_now - refunds_in, 2))"
      - funding_order: "CFIELD('returns', 'order_id', return_id=F('source_reference'))"
      - promo_paid: "XSUM('orders', 'order_payments', 'amount_usd', order_id=funding_order, event_type='orders_payment_captured', tender_type='rewards_note') + XSUM('orders', 'order_payments', 'amount_usd', order_id=funding_order, event_type='orders_payment_captured', tender_type='goodwill_credit') + XSUM('orders', 'order_payments', 'amount_usd', order_id=funding_order, event_type='orders_payment_captured', tender_type='bonus_gift_card')"
      - all_paid: "XSUM('orders', 'order_payments', 'amount_usd', order_id=funding_order, event_type='orders_payment_captured')"
      - promo_exclusion: "int(round(returned_order_value * promo_paid / all_paid * 100, 4) + 0.5) / 100 if (promo_paid > 0 and promo_paid < all_paid) else (returned_order_value if (promo_paid > 0 and promo_paid >= all_paid) else 0)"
      - return_status: "CFIELD('returns', 'status', return_id=F('source_reference'))"
      - settlement_share: "K('hold_uninspected_share') if (return_status == 'authorized' or return_status == 'in_transit' or return_status == 'received') else (K('hold_inspected_share') if return_status == 'inspected' else 0)"
      - settlement_hold: "int(round(returned_order_value * settlement_share * 100, 4) + 0.5) / 100"
      - holder_tier: "CFIELD('loyalty', 'variant_name')"
      - holder_months: "MONTHS(CFIELD('loyalty', 'enrolled_date'), NOW) if CFIELD('loyalty', 'enrolled_date') else 0"
      - availability_days: "K('avail_days_top') if ((holder_tier == 'Marlowe Rewards Gold' or holder_tier == 'Marlowe Rewards Platinum' or holder_tier == 'Marlowe Rewards Icon' or holder_tier == 'Marlowe Rewards Atelier') and holder_months >= K('top_tenure_months')) else (K('avail_days_mid') if (holder_tier == 'Marlowe Rewards Silver' and holder_months >= K('mid_tenure_months')) else K('avail_days_standard'))"
      - compensated_claims: "XCOUNT('claims', 'claim_events', within_months=K('claims_window_months'), event_type='claims_compensation_issued')"
      - claims_adjustment: "-K('claims_clean_days') if compensated_claims == 0 else (K('claims_repeat_days') if compensated_claims >= 2 else 0)"
      - last_refund_on: "LATEST('credit_transactions', 'event_date', event_type='credit_refunded_to_instrument')"
      - refund_age_days: "DAYS(last_refund_on, NOW) if last_refund_on else 0"
      - refund_hold: "refunds_in if (refunds_in > 0 and refund_age_days < availability_days + claims_adjustment) else 0"
      - lock_age_days: "DAYS(F('locked_date'), NOW) if F('locked_date') else -1"
      - reserve_share: "K('reserve_recent_share') if (lock_age_days >= 0 and lock_age_days <= K('reserve_recent_days')) else (K('reserve_older_share') if (lock_age_days > K('reserve_recent_days') and lock_age_days <= K('reserve_older_days')) else 0)"
      - lock_reserve: "int(round((balance_now - refund_hold) * reserve_share * 100, 4) + 0.5) / 100"
      - result: "MX(0, round(balance_now - promo_exclusion - settlement_hold - refund_hold - lock_reserve, 2))"
    compute_basis:
      balance_now: "The cash-out amount starts from the instrument's current balance."
      refunds_in: "The returned-order value of a store credit is its current balance less the refunds loaded onto it from orders paid with it, never below zero."
      returned_order_value: "The returned-order value of a store credit is its current balance less the refunds loaded onto it from orders paid with it, never below zero."
      funding_order: "when the order behind the store credit's return was captured partly with Marlowe Rewards Notes, Goodwill Credit or Bonus Gift Cards and partly with other tenders"
      promo_paid: "the promotional exclusion is the returned-order value times the promotional tenders' share of everything captured on that order, rounded half up to the cent"
      all_paid: "the promotional exclusion is the returned-order value times the promotional tenders' share of everything captured on that order, rounded half up to the cent"
      promo_exclusion: "when the order behind the store credit's return was captured partly with Marlowe Rewards Notes, Goodwill Credit or Bonus Gift Cards and partly with other tenders, the promotional exclusion is the returned-order value times the promotional tenders' share of everything captured on that order, rounded half up to the cent; when that order was captured entirely with such promotional tenders, the promotional exclusion is the whole returned-order value; when no promotional tender was captured on it, or the instrument did not come from a return, there is no promotional exclusion."
      return_status: "While the return behind a store credit is not yet settled, part of the returned-order value is held for its settlement"
      settlement_share: "when the return is in status authorized, in_transit or received, the settlement hold is `hold_uninspected_share` of the returned-order value; when the return is in status inspected, the settlement hold is `hold_inspected_share` of the returned-order value, rounded half up to the cent; in any other status, or for an instrument that did not come from a return, there is no settlement hold."
      settlement_hold: "when the return is in status inspected, the settlement hold is `hold_inspected_share` of the returned-order value, rounded half up to the cent"
      holder_tier: "The refund availability period follows the holder's Marlowe Rewards standing on the cash-out date"
      holder_months: "for a Marlowe Rewards Gold, Platinum, Icon or Atelier member whose membership was enrolled at least `top_tenure_months` whole months earlier it is `avail_days_top` calendar days"
      availability_days: "for a Marlowe Rewards Gold, Platinum, Icon or Atelier member whose membership was enrolled at least `top_tenure_months` whole months earlier it is `avail_days_top` calendar days; for a Marlowe Rewards Silver member whose membership was enrolled at least `mid_tenure_months` whole months earlier it is `avail_days_mid` calendar days; for anyone else it is `avail_days_standard` calendar days."
      compensated_claims: "when no compensation was issued on any of the holder's delivery claims in the last `claims_window_months` months, it is shortened by `claims_clean_days` day"
      claims_adjustment: "when no compensation was issued on any of the holder's delivery claims in the last `claims_window_months` months, it is shortened by `claims_clean_days` day; when compensation was issued two or more times in that window, it is lengthened by `claims_repeat_days` days; when compensation was issued exactly once in that window it is not adjusted."
      last_refund_on: "Refunds loaded onto the instrument from orders paid with it become payable once the refund availability period has passed since the most recent such refund, counted in calendar days from that refund's date"
      refund_age_days: "That refund's date is day zero, and the refunded value is payable on the day the count reaches the refund availability period."
      refund_hold: "Refunds loaded onto the instrument from orders paid with it become payable once the refund availability period has passed since the most recent such refund, counted in calendar days from that refund's date; until then the whole of that refunded value is held."
      lock_age_days: "when the instrument's most recent lock was placed at most `reserve_recent_days` calendar days before the cash-out date"
      reserve_share: "when the instrument's most recent lock was placed at most `reserve_recent_days` calendar days before the cash-out date, the lock reserve is `reserve_recent_share` of that amount; when it was placed more than `reserve_recent_days` but at most `reserve_older_days` calendar days before the cash-out date, the lock reserve is `reserve_older_share` of that amount; when it was placed earlier, or the instrument was never locked, there is no lock reserve."
      lock_reserve: "After a lock on the instrument has been lifted, a lock reserve is kept back from the instrument's current balance less the held refunded value"
      result: "The cash-out amount is the current balance less the held refunded value, never below zero, in US dollars to the cent."
    factors:
      - id: promotional_tender_exclusion
        effect: method
        decides: promo_exclusion
        bindings: [funding_order, promo_paid, all_paid, promo_exclusion]
        ladder:
          - when: "the returned order was captured partly with Rewards Notes, Goodwill Credit or Bonus Gift Cards AND partly with other tenders"
            method: "exclude the returned-order value times the promotional share of the order's captures, rounded half up to the cent"
          - when: "the returned order was captured entirely with such promotional tenders"
            method: "exclude the whole returned-order value"
          - when: "otherwise (no promotional tender on that order, or the instrument did not come from a return)"
            method: "exclude nothing"
        baseline:
          promo_exclusion: "0"
        evidence: [cross_category, history]
        cross_difficulty: returns
      - id: unsettled_return_hold
        effect: parameter
        decides: settlement_share
        bindings: [return_status, settlement_share]
        ladder:
          - when: "the return behind the store credit is in status authorized, in_transit or received"
            value: "K('hold_uninspected_share')"
          - when: "the return is in status inspected"
            value: "K('hold_inspected_share')"
          - when: "otherwise (settled or closed, or no return behind the instrument)"
            value: "0 (no settlement hold)"
        baseline:
          settlement_share: "0"
        evidence: [cross_category]
        cross_difficulty: returns
      - id: refund_availability_by_standing
        effect: parameter
        decides: availability_days
        bindings: [holder_tier, holder_months, availability_days]
        ladder:
          - when: "Marlowe Rewards Gold, Platinum, Icon or Atelier member AND membership enrolled at least top_tenure_months whole months earlier"
            value: "K('avail_days_top')"
          - when: "Marlowe Rewards Silver member AND membership enrolled at least mid_tenure_months whole months earlier"
            value: "K('avail_days_mid')"
          - when: "otherwise"
            value: "K('avail_days_standard')"
        baseline:
          availability_days: "K('avail_days_standard')"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
      - id: delivery_claim_record_adjustment
        effect: parameter
        decides: claims_adjustment
        bindings: [compensated_claims, claims_adjustment]
        ladder:
          - when: "no compensation issued on the holder's delivery claims in the last claims_window_months months"
            value: "minus K('claims_clean_days')"
          - when: "compensation issued two or more times in that window"
            value: "plus K('claims_repeat_days')"
          - when: "otherwise (compensation issued exactly once)"
            value: "0 (no adjustment)"
        baseline:
          claims_adjustment: "0"
        evidence: [cross_category, history]
        cross_difficulty: null
      - id: lifted_lock_reserve
        effect: parameter
        decides: reserve_share
        bindings: [lock_age_days, reserve_share]
        ladder:
          - when: "the instrument's most recent lock was placed at most reserve_recent_days calendar days before the cash-out date"
            value: "K('reserve_recent_share')"
          - when: "the most recent lock was placed more than reserve_recent_days but at most reserve_older_days calendar days before"
            value: "K('reserve_older_share')"
          - when: "otherwise (placed earlier, or never locked)"
            value: "0 (no lock reserve)"
        baseline:
          reserve_share: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The cash-out amount starts from the instrument's current balance. The returned-order value
        of a store credit is its current balance less the refunds loaded onto it from orders paid
        with it, never below zero. The refund availability period is `avail_days_standard` calendar
        days. Refunds loaded onto the instrument from orders paid with it become payable once the
        refund availability period has passed since the most recent such refund, counted in
        calendar days from that refund's date; until then the whole of that refunded value is held.
        That refund's date is day zero, and the refunded value is payable on the day the count
        reaches the refund availability period. The cash-out amount is the current balance less the held refunded value, never below zero,
        in US dollars to the cent.
      params: [avail_days_standard]
    inputs:
      history:
        - {table: credit_transactions, aggregate: sum, field: amount_usd, filters: {event_type: credit_refunded_to_instrument}}
        - {table: credit_transactions, aggregate: latest, field: event_date, filters: {event_type: credit_refunded_to_instrument}}
        - {category: orders, table: order_payments, aggregate: sum, field: amount_usd, filters: {event_type: orders_payment_captured}}
        - {category: claims, table: claim_events, aggregate: count, field: event_type, within_months: 24, filters: {event_type: claims_compensation_issued}}
      cross_category: [returns, orders, loyalty, claims]

  - id: credit_ext_stolen_card_replacement
    base_policy_refs: [credit_evt_lost_stolen]
    overwrite:
      - base_policy: credit_evt_lost_stolen
        superseded_clause: >-
          The replacement is a new instrument of the `replacement_variant`, keeping the original
          expiry rules, loaded with the whole balance at the lock plus refunds received while
          locked; the old instrument closes with reason replaced and its transfer-out row names the
          replacement as counterpart.
        replaced_by: >-
          The replacement is a new instrument of the `replacement_variant`, keeping the original
          expiry rules, loaded with the replacement value worked out below; the transfer-out row on
          the old instrument names the replacement as counterpart, the old instrument closes with
          reason replaced once nothing is left on it, and the investigation hold stays frozen on the
          old instrument until the theft review releases it.
    trigger: on_request
    subject: [credit_replaced, credit_transferred_out]
    computes: replacement_usd
    target_tool: issue_card_replacement_8a64787f
    params:
      hold_unregistered_share: 0.40
      hold_registered_share: 0.15
      claims_window_months: 12
      claims_clean_share: 0.05
      claims_repeat_share: 0.20
      use_window_months: 12
      regular_use_count: 4
      some_use_count: 2
      release_regular_usd: 30.00
      release_some_usd: 20.00
      gold_tenure_months: 24
      silver_tenure_months: 12
      member_half_rate: 0.5
      member_quarter_off_rate: 0.75
    rule: >-
      The replacement is a new instrument of the `replacement_variant`, keeping the original expiry
      rules, loaded with the replacement value worked out below; the transfer-out row on the old
      instrument names the replacement as counterpart, the old instrument closes with reason
      replaced once nothing is left on it, and the investigation hold stays frozen on the old
      instrument until the theft review releases it.
      The replacement value starts from the protected balance, which is the sum of every entry on the
      locked card's ledger: the whole balance at the lock plus refunds received while locked, after
      any charge captured since the lock for an order placed before it. The investigation hold share is
      nothing, and the investigation hold is the protected balance times the investigation hold
      share, rounded half up to the cent. The replacement value is the protected balance less the
      investigation hold, in US dollars to the cent.
      A card locked for a theft or misuse report carries an investigation hold share: when the lock
      reason is reported_stolen or unauthorized_use and the card was never registered to the holder
      on or before the lock date, the share is `hold_unregistered_share`; when the lock reason is
      reported_stolen or unauthorized_use and the card was registered to the holder on or before the
      lock date, the share is `hold_registered_share`; for a card locked as reported_lost there is
      no investigation hold share.
      The investigation hold share is then adjusted by the holder's delivery-claim record: when no
      compensation was issued on any of the holder's delivery claims in the last
      `claims_window_months` months, it is lowered by `claims_clean_share`; when compensation was
      issued two or more times in that window, it is raised by `claims_repeat_share`; when it was
      issued exactly once, it is not adjusted; the adjusted share is never below zero.
      Part of the protected balance is released at once whatever the hold when the holder both
      bought the card and used it regularly: when the holder is the purchaser of record of the order
      line that bought the card and the card was spent on at least `regular_use_count` orders in the
      last `use_window_months` months, the first `release_regular_usd` of the protected balance is
      released at once; when the holder is that purchaser of record and the card was spent on at
      least `some_use_count` but fewer than `regular_use_count` orders in that window, the first
      `release_some_usd` is released at once; otherwise, including for any card bought by someone
      else, nothing is released at once. The investigation hold share then applies only to the
      protected balance above the amount released at once, never below zero, and the hold is
      rounded half up to the cent.
      The investigation hold receives the member treatment of the holder's Marlowe Rewards
      standing: for a Marlowe Rewards Gold, Platinum, Icon or Atelier member whose membership was
      enrolled at least `gold_tenure_months` whole months earlier, the hold is multiplied by
      `member_half_rate` and rounded down to the whole dollar; for a Marlowe Rewards Silver member
      whose membership was enrolled at least `silver_tenure_months` whole months earlier, the hold
      is multiplied by `member_quarter_off_rate` and rounded up to the cent; for anyone else the
      hold is kept as worked out.
    prerequisite: []
    cross_category:
      - category: claims
        as: history
        reads: [claim_events.event_type, claim_events.event_date]
        note: Compensation issued on the holder's delivery claims in the window adjusts the investigation hold share.
      - category: loyalty
        as: branch
        reads: [variant_name, enrolled_date]
        note: The holder's tier and enrolment length decide the member treatment of the hold.
      - category: orders
        as: existence
        reads: [order_lines.order_line_id, order_lines.customer_id, order_lines.event_type]
        note: Whether the holder is the purchaser of record of the order line that bought the card is one of the two conditions of the release-at-once ladder.
    compute:
      - balance_now: "SUM('credit_transactions', 'amount_usd')"
      - registered_days_before_lock: "DAYS(F('registered_date'), F('locked_date')) if (F('registered_date') and F('locked_date')) else -1"
      - hold_share: "K('hold_unregistered_share') if ((F('lock_reason') == 'reported_stolen' or F('lock_reason') == 'unauthorized_use') and registered_days_before_lock < 0) else (K('hold_registered_share') if ((F('lock_reason') == 'reported_stolen' or F('lock_reason') == 'unauthorized_use') and registered_days_before_lock >= 0) else 0)"
      - claim_compensations: "XCOUNT('claims', 'claim_events', within_months=K('claims_window_months'), event_type='claims_compensation_issued')"
      - claims_share_adjustment: "-K('claims_clean_share') if claim_compensations == 0 else (K('claims_repeat_share') if claim_compensations >= 2 else 0)"
      - card_uses: "COUNT('credit_transactions', within_months=K('use_window_months'), event_type='credit_redeemed')"
      - holder_bought_card: "XCOUNT('orders', 'order_lines', order_line_id=F('source_reference'), event_type='orders_line_booked') >= 1"
      - released_at_once: "K('release_regular_usd') if (holder_bought_card and card_uses >= K('regular_use_count')) else (K('release_some_usd') if (holder_bought_card and card_uses >= K('some_use_count')) else 0)"
      - held_base: "MX(0, round(balance_now - released_at_once, 2))"
      - effective_share: "MX(0, round(hold_share + claims_share_adjustment, 4))"
      - hold_raw: "int(round(held_base * effective_share * 100, 4) + 0.5) / 100"
      - holder_tier: "CFIELD('loyalty', 'variant_name')"
      - holder_months: "MONTHS(CFIELD('loyalty', 'enrolled_date'), NOW) if CFIELD('loyalty', 'enrolled_date') else 0"
      - hold_final: "int(round(hold_raw * K('member_half_rate'), 4)) if ((holder_tier == 'Marlowe Rewards Gold' or holder_tier == 'Marlowe Rewards Platinum' or holder_tier == 'Marlowe Rewards Icon' or holder_tier == 'Marlowe Rewards Atelier') and holder_months >= K('gold_tenure_months')) else ((int(round(hold_raw * K('member_quarter_off_rate') * 100, 4)) + (1 if round(hold_raw * K('member_quarter_off_rate') * 100, 4) > int(round(hold_raw * K('member_quarter_off_rate') * 100, 4)) else 0)) / 100 if (holder_tier == 'Marlowe Rewards Silver' and holder_months >= K('silver_tenure_months')) else hold_raw)"
      - result: "MX(0, round(balance_now - hold_final, 2))"
    compute_basis:
      balance_now: "The replacement value starts from the protected balance, which is the sum of every entry on the locked card's ledger: the whole balance at the lock plus refunds received while locked, after any charge captured since the lock for an order placed before it."
      registered_days_before_lock: "when the lock reason is reported_stolen or unauthorized_use and the card was registered to the holder on or before the lock date, the share is `hold_registered_share`"
      hold_share: "when the lock reason is reported_stolen or unauthorized_use and the card was never registered to the holder on or before the lock date, the share is `hold_unregistered_share`; when the lock reason is reported_stolen or unauthorized_use and the card was registered to the holder on or before the lock date, the share is `hold_registered_share`; for a card locked as reported_lost there is no investigation hold share."
      claim_compensations: "when no compensation was issued on any of the holder's delivery claims in the last `claims_window_months` months, it is lowered by `claims_clean_share`"
      claims_share_adjustment: "when no compensation was issued on any of the holder's delivery claims in the last `claims_window_months` months, it is lowered by `claims_clean_share`; when compensation was issued two or more times in that window, it is raised by `claims_repeat_share`; when it was issued exactly once, it is not adjusted; the adjusted share is never below zero."
      card_uses: "the card was spent on at least `regular_use_count` orders in the last `use_window_months` months"
      holder_bought_card: "when the holder is the purchaser of record of the order line that bought the card"
      released_at_once: "when the holder is the purchaser of record of the order line that bought the card and the card was spent on at least `regular_use_count` orders in the last `use_window_months` months, the first `release_regular_usd` of the protected balance is released at once; when the holder is that purchaser of record and the card was spent on at least `some_use_count` but fewer than `regular_use_count` orders in that window, the first `release_some_usd` is released at once; otherwise, including for any card bought by someone else, nothing is released at once."
      held_base: "The investigation hold share then applies only to the protected balance above the amount released at once, never below zero, and the hold is rounded half up to the cent."
      effective_share: "the adjusted share is never below zero."
      hold_raw: "The investigation hold share is nothing, and the investigation hold is the protected balance times the investigation hold share, rounded half up to the cent."
      holder_tier: "The investigation hold receives the member treatment of the holder's Marlowe Rewards standing"
      holder_months: "for a Marlowe Rewards Gold, Platinum, Icon or Atelier member whose membership was enrolled at least `gold_tenure_months` whole months earlier"
      hold_final: "for a Marlowe Rewards Gold, Platinum, Icon or Atelier member whose membership was enrolled at least `gold_tenure_months` whole months earlier, the hold is multiplied by `member_half_rate` and rounded down to the whole dollar; for a Marlowe Rewards Silver member whose membership was enrolled at least `silver_tenure_months` whole months earlier, the hold is multiplied by `member_quarter_off_rate` and rounded up to the cent; for anyone else the hold is kept as worked out."
      result: "The replacement value is the protected balance less the investigation hold, in US dollars to the cent."
    factors:
      - id: theft_report_hold_share
        effect: parameter
        decides: hold_share
        bindings: [registered_days_before_lock, hold_share]
        ladder:
          - when: "lock reason reported_stolen or unauthorized_use AND the card was never registered to the holder on or before the lock date"
            value: "K('hold_unregistered_share')"
          - when: "lock reason reported_stolen or unauthorized_use AND the card was registered to the holder on or before the lock date"
            value: "K('hold_registered_share')"
          - when: "otherwise (locked as reported_lost)"
            value: "0 (no investigation hold share)"
        baseline:
          hold_share: "0"
        evidence: [date]
        cross_difficulty: null
      - id: claim_record_hold_adjustment
        effect: parameter
        decides: claims_share_adjustment
        bindings: [claim_compensations, claims_share_adjustment]
        ladder:
          - when: "no compensation issued on the holder's delivery claims in the last claims_window_months months"
            value: "minus K('claims_clean_share')"
          - when: "compensation issued two or more times in that window"
            value: "plus K('claims_repeat_share')"
          - when: "otherwise (issued exactly once)"
            value: "0 (no adjustment)"
        baseline:
          claims_share_adjustment: "0"
        evidence: [cross_category, history]
        cross_difficulty: claims
      - id: regular_use_release
        effect: parameter
        decides: released_at_once
        bindings: [card_uses, holder_bought_card, released_at_once]
        ladder:
          - when: "the holder is the purchaser of record of the order line that bought the card (order record) AND the card was spent on at least regular_use_count orders in the last use_window_months months (card ledger)"
            value: "K('release_regular_usd')"
          - when: "the holder is that purchaser of record AND the card was spent on at least some_use_count but fewer than regular_use_count orders in that window"
            value: "K('release_some_usd')"
          - when: "otherwise (including any card bought by someone else)"
            value: "0 (nothing released at once)"
        baseline:
          released_at_once: "0"
        evidence: [history, cross_category]
        cross_difficulty: null
      - id: member_hold_treatment
        effect: method
        decides: hold_final
        bindings: [holder_tier, holder_months, hold_final]
        ladder:
          - when: "Marlowe Rewards Gold, Platinum, Icon or Atelier member AND membership enrolled at least gold_tenure_months whole months earlier"
            method: "the hold is multiplied by member_half_rate and rounded down to the whole dollar"
          - when: "Marlowe Rewards Silver member AND membership enrolled at least silver_tenure_months whole months earlier"
            method: "the hold is multiplied by member_quarter_off_rate and rounded up to the cent"
          - when: "otherwise"
            method: "the hold is kept as worked out"
        baseline:
          hold_final: "hold_raw"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
    baseline:
      rule: >-
        The replacement value starts from the protected balance, which is the sum of every entry on
        the locked card's ledger: the whole balance at the lock plus refunds received while locked,
        after any charge captured since the lock for an order placed before it. The investigation hold share is
        nothing, and the investigation hold is the protected balance times the investigation hold
        share, rounded half up to the cent. The replacement value is the protected balance less the
        investigation hold, in US dollars to the cent.
      params: []
    inputs:
      history:
        - {table: credit_transactions, aggregate: sum, field: amount_usd, filters: {}}
        - {table: credit_transactions, aggregate: count, field: event_type, within_months: 12, filters: {event_type: credit_redeemed}}
        - {category: claims, table: claim_events, aggregate: count, field: event_type, within_months: 12, filters: {event_type: claims_compensation_issued}}
        - {category: orders, table: order_lines, aggregate: count, field: order_line_id, filters: {event_type: orders_line_booked}}
      cross_category: [claims, loyalty, orders]

  - id: credit_ext_card_balance_consolidation
    base_policy_refs: [credit_evt_cash_out, credit_evt_lost_stolen]
    overwrite:
      - base_policy: credit_evt_cash_out
        superseded_clause: >-
          Consolidation follows the same confirmation path: a consolidation request names at least
          `consolidation_min_instruments` active instruments of a type with `consolidation_allowed`,
          and on confirmation each closes with reason consolidated and moves its whole balance to one
          new instrument of the `consolidation_target_variant`.
        replaced_by: >-
          A consolidation names at least `consolidation_min_instruments` active instruments of a type
          with `consolidation_allowed`, one of them an instrument of the
          `consolidation_target_variant` that the holder names as the receiving card; the holder's
          own confirmation records the consolidation request for both cards as confirmed and moves
          the consolidation amount worked out below off the other card onto the receiving card, and
          the other card closes with reason consolidated once nothing is left on it.
    trigger: on_request
    subject: [credit_closed_by_customer, credit_transferred_out]
    computes: consolidation_usd
    target_tool: confirm_card_consolidation_106a95bf
    params:
      limit_top_usd: 150.00
      limit_mid_usd: 100.00
      limit_standard_usd: 60.00
      top_tenure_months: 24
      mid_tenure_months: 12
      age_long_months: 12
      age_mid_months: 3
      age_mid_multiplier: 1.5
      label_plan_addon_usd: 40.00
      other_plan_addon_usd: 20.00
      earn_window_months: 12
      earn_top_count: 6
      earn_mid_count: 3
      earn_top_addon_usd: 30.00
      earn_mid_addon_usd: 15.00
      return_window_months: 12
      return_heavy_count: 3
      return_clean_addon_usd: 10.00
      return_heavy_reduction_usd: 25.00
    rule: >-
      A consolidation names at least `consolidation_min_instruments` active instruments of a type
      with `consolidation_allowed`, one of them an instrument of the `consolidation_target_variant`
      that the holder names as the receiving card; the holder's own confirmation records the
      consolidation request for both cards as confirmed and moves the consolidation amount worked
      out below off the other card onto the receiving card, and the other card closes with reason
      consolidated once nothing is left on it. The consolidation amount is not worked out until the
      stolen or lost card's ledger carries the replacement transfer-out entry naming the card that
      took over its protected value.
      For value that reached the moving card by a replacement, the carried value is the amount the
      replacement transfer-out entry on the stolen or lost card moved onto it. The move limit is
      `limit_standard_usd`. The consolidation amount is the carried value capped at the move limit,
      the rest staying on the moving card, in US dollars to the cent.
      The move limit follows the holder's Marlowe Rewards standing on the consolidation date: for a
      Marlowe Rewards Gold, Platinum, Icon or Atelier member whose membership was enrolled at least
      `top_tenure_months` whole months earlier it is `limit_top_usd`; for a Marlowe Rewards Silver
      member whose membership was enrolled at least `mid_tenure_months` whole months earlier it is
      `limit_mid_usd`; for anyone else it is `limit_standard_usd`.
      The age of the stolen or lost card changes how the move limit is applied: when that card was
      issued at least `age_long_months` whole months before the consolidation date, the move limit
      is the whole carried value in place of the standing limit; when it was issued at least `age_mid_months` but
      fewer than `age_long_months` whole months earlier, the move limit is multiplied by
      `age_mid_multiplier` and rounded down to the whole dollar; when it was issued fewer than
      `age_mid_months` whole months earlier, the move limit applies as set.
      A holder's Marlowe & Finch Unlimited membership raises the move limit: with a membership in
      status trial or active whose plan covers return labels, `label_plan_addon_usd` is added; with
      a membership in status trial or active whose plan does not cover return labels,
      `other_plan_addon_usd` is added; with no membership in status trial or active nothing is
      added.
      Recent purchasing raises the move limit: when the holder's Marlowe Rewards membership posted
      points for at least `earn_top_count` dispatched orders in the last `earn_window_months`
      months, `earn_top_addon_usd` is added; when it posted points for at least `earn_mid_count` but
      fewer than `earn_top_count` such orders, `earn_mid_addon_usd` is added; otherwise nothing is
      added.
      The holder's return record changes the move limit: when none of the holder's returns had a
      line authorized in the last `return_window_months` months, `return_clean_addon_usd` is added;
      when lines were authorized on returns `return_heavy_count` or more times in that window,
      `return_heavy_reduction_usd` is taken off, never below zero; otherwise the move limit is not
      changed. The membership, purchasing and return amounts are added to, or taken off, the move
      limit after its application for the card's age.
    prerequisite:
      - problem: credit_ext_stolen_card_replacement
        kind: value_input
        gate: carried_value
        form: state
        policy_source: >-
          The consolidation amount is not worked out until the stolen or lost card's ledger carries
          the replacement transfer-out entry naming the card that took over its protected value.
        condition: >-
          The locked card's credit_transactions hold a credit_transferred_out row with
          transfer_reason replacement whose counterpart_instrument_id is the replacement card.
        resolved_by: issue_card_replacement_8a64787f
        effect: >-
          The replacement transfer-out entry gives the carried value (carried_value) that moves onto
          the receiving card, and creates the active card the consolidation moves it from.
    cross_category:
      - category: loyalty
        as: history
        reads: [variant_name, enrolled_date, loyalty_ledger.event_type, loyalty_ledger.posting_date]
        note: The holder's tier and enrolment length set the move limit; earning postings in the window add to it.
      - category: pass
        as: branch
        reads: [status, covers_return_label]
        note: An Unlimited membership in trial or active, and whether its plan covers return labels, adds to the move limit.
      - category: returns
        as: history
        reads: [return_lines.event_type, return_lines.event_date]
        note: Return lines authorized in the window change the move limit.
    compute:
      - carried_value: "-SUM('credit_transactions', 'amount_usd', event_type='credit_transferred_out', transfer_reason='replacement')"
      - limit_tier: "CFIELD('loyalty', 'variant_name')"
      - limit_months: "MONTHS(CFIELD('loyalty', 'enrolled_date'), NOW) if CFIELD('loyalty', 'enrolled_date') else 0"
      - standing_limit: "K('limit_top_usd') if ((limit_tier == 'Marlowe Rewards Gold' or limit_tier == 'Marlowe Rewards Platinum' or limit_tier == 'Marlowe Rewards Icon' or limit_tier == 'Marlowe Rewards Atelier') and limit_months >= K('top_tenure_months')) else (K('limit_mid_usd') if (limit_tier == 'Marlowe Rewards Silver' and limit_months >= K('mid_tenure_months')) else K('limit_standard_usd'))"
      - card_age_months: "MONTHS(F('issued_date'), NOW) if F('issued_date') else 0"
      - aged_limit: "carried_value if card_age_months >= K('age_long_months') else (int(round(standing_limit * K('age_mid_multiplier'), 4)) if card_age_months >= K('age_mid_months') else standing_limit)"
      - plan_status: "CFIELD('pass', 'status')"
      - label_cover: "CPARAM('pass', 'covers_return_label')"
      - plan_addon: "K('label_plan_addon_usd') if ((plan_status == 'active' or plan_status == 'trial') and label_cover == True) else (K('other_plan_addon_usd') if (plan_status == 'active' or plan_status == 'trial') else 0)"
      - earning_orders: "XCOUNT('loyalty', 'loyalty_ledger', within_months=K('earn_window_months'), date_field='posting_date', event_type='loyalty_points_earned')"
      - purchase_addon: "K('earn_top_addon_usd') if earning_orders >= K('earn_top_count') else (K('earn_mid_addon_usd') if earning_orders >= K('earn_mid_count') else 0)"
      - return_lines_authorized: "XCOUNT('returns', 'return_lines', within_months=K('return_window_months'), event_type='returns_line_authorized')"
      - return_change: "K('return_clean_addon_usd') if return_lines_authorized == 0 else (-K('return_heavy_reduction_usd') if return_lines_authorized >= K('return_heavy_count') else 0)"
      - move_limit: "MX(0, round(aged_limit + plan_addon + purchase_addon + return_change, 2))"
      - result: "round(MN(carried_value, move_limit), 2)"
    compute_basis:
      carried_value: "For value that reached the moving card by a replacement, the carried value is the amount the replacement transfer-out entry on the stolen or lost card moved onto it."
      limit_tier: "The move limit follows the holder's Marlowe Rewards standing on the consolidation date"
      limit_months: "for a Marlowe Rewards Gold, Platinum, Icon or Atelier member whose membership was enrolled at least `top_tenure_months` whole months earlier it is `limit_top_usd`"
      standing_limit: "for a Marlowe Rewards Gold, Platinum, Icon or Atelier member whose membership was enrolled at least `top_tenure_months` whole months earlier it is `limit_top_usd`; for a Marlowe Rewards Silver member whose membership was enrolled at least `mid_tenure_months` whole months earlier it is `limit_mid_usd`; for anyone else it is `limit_standard_usd`."
      card_age_months: "when that card was issued at least `age_long_months` whole months before the consolidation date, the move limit is the whole carried value in place of the standing limit"
      aged_limit: "when that card was issued at least `age_long_months` whole months before the consolidation date, the move limit is the whole carried value in place of the standing limit; when it was issued at least `age_mid_months` but fewer than `age_long_months` whole months earlier, the move limit is multiplied by `age_mid_multiplier` and rounded down to the whole dollar; when it was issued fewer than `age_mid_months` whole months earlier, the move limit applies as set."
      plan_status: "A holder's Marlowe & Finch Unlimited membership raises the move limit"
      label_cover: "with a membership in status trial or active whose plan covers return labels, `label_plan_addon_usd` is added"
      plan_addon: "with a membership in status trial or active whose plan covers return labels, `label_plan_addon_usd` is added; with a membership in status trial or active whose plan does not cover return labels, `other_plan_addon_usd` is added; with no membership in status trial or active nothing is added."
      earning_orders: "when the holder's Marlowe Rewards membership posted points for at least `earn_top_count` dispatched orders in the last `earn_window_months` months, `earn_top_addon_usd` is added"
      purchase_addon: "when the holder's Marlowe Rewards membership posted points for at least `earn_top_count` dispatched orders in the last `earn_window_months` months, `earn_top_addon_usd` is added; when it posted points for at least `earn_mid_count` but fewer than `earn_top_count` such orders, `earn_mid_addon_usd` is added; otherwise nothing is added."
      return_lines_authorized: "when none of the holder's returns had a line authorized in the last `return_window_months` months, `return_clean_addon_usd` is added"
      return_change: "when none of the holder's returns had a line authorized in the last `return_window_months` months, `return_clean_addon_usd` is added; when lines were authorized on returns `return_heavy_count` or more times in that window, `return_heavy_reduction_usd` is taken off, never below zero; otherwise the move limit is not changed."
      move_limit: "The membership, purchasing and return amounts are added to, or taken off, the move limit after its application for the card's age."
      result: "The consolidation amount is the carried value capped at the move limit, the rest staying on the moving card, in US dollars to the cent."
    factors:
      - id: move_limit_by_standing
        effect: parameter
        decides: standing_limit
        bindings: [limit_tier, limit_months, standing_limit]
        ladder:
          - when: "Marlowe Rewards Gold, Platinum, Icon or Atelier member AND membership enrolled at least top_tenure_months whole months earlier"
            value: "K('limit_top_usd')"
          - when: "Marlowe Rewards Silver member AND membership enrolled at least mid_tenure_months whole months earlier"
            value: "K('limit_mid_usd')"
          - when: "otherwise"
            value: "K('limit_standard_usd')"
        baseline:
          standing_limit: "K('limit_standard_usd')"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
      - id: card_age_limit_application
        effect: method
        decides: aged_limit
        bindings: [card_age_months, aged_limit]
        ladder:
          - when: "the stolen or lost card was issued at least age_long_months whole months before the consolidation date"
            method: "the move limit is the whole carried value in place of the standing limit"
          - when: "issued at least age_mid_months but fewer than age_long_months whole months earlier"
            method: "the move limit is multiplied by age_mid_multiplier and rounded down to the whole dollar"
          - when: "otherwise (issued fewer than age_mid_months whole months earlier)"
            method: "the move limit applies as set"
        baseline:
          aged_limit: "standing_limit"
        evidence: [date]
        cross_difficulty: null
      - id: unlimited_membership_addon
        effect: parameter
        decides: plan_addon
        bindings: [plan_status, label_cover, plan_addon]
        ladder:
          - when: "Unlimited membership in status trial or active AND its plan covers return labels"
            value: "K('label_plan_addon_usd')"
          - when: "Unlimited membership in status trial or active whose plan does not cover return labels"
            value: "K('other_plan_addon_usd')"
          - when: "otherwise (no Unlimited membership in status trial or active)"
            value: "0 (nothing added)"
        baseline:
          plan_addon: "0"
        evidence: [cross_category, tier_param]
        cross_difficulty: null
      - id: recent_purchasing_addon
        effect: parameter
        decides: purchase_addon
        bindings: [earning_orders, purchase_addon]
        ladder:
          - when: "at least earn_top_count earning postings for dispatched orders in the last earn_window_months months"
            value: "K('earn_top_addon_usd')"
          - when: "at least earn_mid_count but fewer than earn_top_count such postings"
            value: "K('earn_mid_addon_usd')"
          - when: "otherwise"
            value: "0 (nothing added)"
        baseline:
          purchase_addon: "0"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
      - id: return_record_limit_change
        effect: parameter
        decides: return_change
        bindings: [return_lines_authorized, return_change]
        ladder:
          - when: "no return line authorized for the holder in the last return_window_months months"
            value: "plus K('return_clean_addon_usd')"
          - when: "return lines authorized return_heavy_count or more times in that window"
            value: "minus K('return_heavy_reduction_usd')"
          - when: "otherwise (one or two authorized return lines)"
            value: "0 (no change)"
        baseline:
          return_change: "0"
        evidence: [cross_category, history]
        cross_difficulty: returns
    baseline:
      rule: >-
        For value that reached the moving card by a replacement, the carried value is the amount the
        replacement transfer-out entry on the stolen or lost card moved onto it. The move limit is
        `limit_standard_usd`. The consolidation amount is the carried value capped at the move limit,
        the rest staying on the moving card, in US dollars to the cent.
      params: [limit_standard_usd]
    inputs:
      history:
        - {table: credit_transactions, aggregate: sum, field: amount_usd, filters: {event_type: credit_transferred_out, transfer_reason: replacement}}
        - {category: loyalty, table: loyalty_ledger, aggregate: count, field: event_type, within_months: 12, filters: {event_type: loyalty_points_earned}}
        - {category: returns, table: return_lines, aggregate: count, field: event_type, within_months: 12, filters: {event_type: returns_line_authorized}}
      cross_category: [loyalty, pass, returns]
