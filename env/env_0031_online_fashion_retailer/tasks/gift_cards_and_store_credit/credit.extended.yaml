# Gift Cards & Store Credit — every stored-value instrument a Marlowe & Finch customer can hold:
# purchased gift cards, promotional bonus cards, Return Store Credit from refunds, Goodwill Credit
# from service recovery, and Marlowe Rewards Notes from the loyalty programme. Each instrument is a
# holding whose balance is the integral of its load and spend rows.

category: credit
display_name: Gift Cards & Store Credit

binding:
  holding_table: credit_instruments
  event_tables: [credit_transactions]
  intake_tables: [credit_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {balance_usd: balance}

lifecycle:
  states: [pending_activation, active, locked, depleted, expired, closed]
  transitions:
    - {from: pending_activation, to: active, by: system, means: "The instrument is activated — on issue for electronic instruments, on dispatch for a plastic gift card, on the valid-from date for a Bonus Gift Card."}
    - {from: pending_activation, to: closed, by: system, means: "The instrument is voided before activation because the purchase or promotion that created it was cancelled or refunded."}
    - {from: active, to: locked, by: agent, means: "The verified holder reports the card lost, stolen or used without permission and the remaining balance is frozen."}
    - {from: locked, to: active, by: agent, means: "The verified holder confirms the card is back in their possession and asks for it to be unlocked."}
    - {from: locked, to: closed, by: agent, means: "A locked instrument is replaced and its protected balance moved to the replacement."}
    - {from: active, to: depleted, by: system, means: "The balance reaches 0.00 through spending, a clawback or a transfer."}
    - {from: depleted, to: active, by: system, means: "Value is returned to a depleted instrument by a refund."}
    - {from: depleted, to: closed, by: system, means: "A depleted instrument closes after its retention period with nothing returned to it."}
    - {from: active, to: expired, by: system, means: "An expiring instrument reaches the end of its expiry date and its remaining value is forfeited."}
    - {from: active, to: closed, by: user, means: "The holder personally confirms a cash-out or a consolidation of the instrument's balance."}

accounts:
  - key: balance
    unit: USD
    meaning: "Spendable value on one instrument; never below zero."

parameter_schema:
  issue_channel: "The only channel through which this instrument is issued (enum string: loyalty_conversion | gift_card_promotion | service_recovery | return_refund | purchase)."
  promotional_value: "Whether the value was given free rather than paid for, which takes the instrument outside gift-card law protections (boolean)."
  expires: "Whether the instrument has an expiry date (boolean)."
  validity_basis: "How the expiry date is set (enum string: loyalty_tier_reward_note_validity_days | fixed_days_from_valid_from | no_expiry)."
  validity_days: "Calendar days of validity counted from the valid-from date when validity_basis is fixed_days_from_valid_from (integer; 0 when another basis applies)."
  valid_from_delay_days: "Calendar days after the issue date before the instrument can be spent (integer)."
  expiry_cutoff_rule: "When on the expiry date the instrument stops working (enum string: end_of_day_eastern)."
  min_issue_value_usd: "Smallest value the instrument is issued for (USD, 2 dp; 0.01 = any positive amount)."
  max_balance_usd: "Highest balance the instrument may hold (USD, 2 dp)."
  issue_value_rounding: "Rounding of computed issue values (enum string: half_up_to_cent)."
  annual_issue_cap_count: "Most instruments of this kind issued to one customer in a trailing 12 months (integer; 0 = no cap)."
  annual_issue_cap_usd: "Most value of this kind issued to one customer in a trailing 12 months (USD, 2 dp; 0.00 = no cap)."
  issue_requires_documented_failure: "Whether issue requires an approved or resolved delivery claim on record (boolean)."
  account_bound: "Whether the instrument lives only in the holder's account wallet, with no card number to share (boolean)."
  transferable_to_other_customer: "Whether the instrument can be given to and registered by another customer (boolean)."
  registration_allowed: "Whether a bearer card can be registered to a customer profile with its card number and PIN (boolean)."
  pin_required_for_online_use: "Whether the card number must be paired with its PIN to spend online (boolean)."
  max_instruments_per_order: "Most instruments of this kind used on one order (integer)."
  min_merchandise_to_redeem_usd: "Order merchandise subtotal after discounts (USD, 2 dp) required before this instrument can be applied (0.00 = none)."
  redeemable_on_shipping_fees: "Whether the instrument can pay shipping fees and surcharges (boolean)."
  redeemable_on_preorder_deposits: "Whether the instrument can pay a pre-order deposit (boolean; deposits are card-only under the preorders charter, so no instrument can). The balance due at shipment is paid on the fulfilment order like any order."
  refund_back_to_instrument: "Whether a refund of value spent from the instrument returns to the same instrument (boolean)."
  refund_to_expired_instrument_handling: "What happens to a refund owed to the instrument after it has expired (enum string: reissue_rewards_note | forfeit | not_applicable)."
  clawback_allowed: "Whether value can be taken back after issue (boolean)."
  clawback_limit: "Ceiling of a clawback (enum string: current_balance | not_applicable)."
  negative_balance_allowed: "Whether the balance may go below zero (boolean)."
  cash_out_eligible: "Whether the instrument can be cashed out where the holder's billing-state law requires it (boolean)."
  cash_out_payout_method: "How a cash-out is paid (enum string: mailed_check | not_applicable)."
  cash_out_processing_business_days: "Business days to issue the cash-out payment after confirmation (integer; 0 when not eligible)."
  cash_out_requires_customer_confirmation: "Whether the holder must personally confirm a cash-out (boolean)."
  replaceable_if_lost: "Whether a lost, stolen or compromised instrument can be replaced (boolean)."
  replacement_requires_registration_or_proof: "Whether replacement needs the card registered to the holder before the lock or the purchase order line on record (boolean)."
  replacement_variant: "Instrument type issued as the replacement (official name, or not_applicable)."
  replacement_protects_balance_from: "From which moment a reported balance is protected (enum string: lock_time)."
  replacement_wait_business_days: "Business days a locked instrument stays locked before a replacement can be issued, letting pending charges settle (integer)."
  replacement_limit_12m: "Most replacements of instruments of this kind per customer in a trailing 12 months (integer; 0 when not replaceable)."
  lock_reasons_allowed: "Reasons for which the instrument can be locked (list)."
  unlock_requires_verification: "Whether unlocking requires a passed identity verification in the same contact (boolean)."
  consolidation_allowed: "Whether balances of several instruments of this kind can be combined into one (boolean)."
  consolidation_min_instruments: "Fewest instruments in one consolidation (integer; 0 when not allowed)."
  consolidation_target_variant: "Instrument type that receives consolidated balances (official name, or not_applicable)."
  bonus_purchase_block_usd: "Gift-card purchase value on one order that earns one bonus block during the bonus promotion (USD, 2 dp; 0.00 when not a bonus instrument)."
  bonus_value_per_block_usd: "Bonus value issued per block (USD, 2 dp; 0.00 when not a bonus instrument)."
  bonus_promotion_start_date: "First order date of the bonus promotion (YYYY-MM-DD, or not_applicable)."
  bonus_promotion_end_date: "Last order date of the bonus promotion (YYYY-MM-DD, or not_applicable)."
  bonus_void_if_qualifying_purchase_refunded: "Whether the bonus is voided or clawed back when the gift-card purchase that earned it is cancelled or refunded (boolean)."
  depleted_retention_days: "Calendar days a depleted instrument stays open for refunds before it closes (integer)."
  gift_card_purchase_refundable: "Whether a purchased gift card can be returned for a refund of its price (boolean)."

