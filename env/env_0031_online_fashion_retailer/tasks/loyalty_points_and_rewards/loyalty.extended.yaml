events:
  - type: loyalty_enrolled
    target: loyalty_memberships
    mutation: create
    meaning: "A customer joins Marlowe Rewards and a membership opens at Marlowe Rewards Member in status active."
    grain: "One row per membership opened."
    fields:
      membership_id: "Reference of the new membership."
      customer_id: "The customer who enrolled."
      variant_name: "Always Marlowe Rewards Member at enrollment."
      status: "Always active at enrollment."
      enrolled_date: "Date of enrollment (handling date)."
      tier_start_date: "Equal to the enrollment date."
      tier_valid_through: "31 December of the year after the enrollment year."
      points_balance: "0 at enrollment, before the welcome bonus posts."
    triggers:
      - event: loyalty:loyalty_bonus_posted
        map: {bonus_type: welcome, bonus_reference: membership_id, posting_date: enrolled_date, available_date: enrolled_date}

  - type: loyalty_points_earned
    target: loyalty_ledger
    meaning: "Points are posted for the qualifying spend of a dispatched order, or for an order whose points were missing."
    grain: "One row per order per earning source (the dispatch posting, or one missing-points adjustment)."
    distinguish_by: [order_id, earn_source]
    fields:
      posting_date: "Date the points post: the order's dispatch date for online_order, the handling date for missing_points_adjustment."
      available_date: "Date the points become available for conversion."
      points: "Points credited (positive)."
      order_id: "The order whose spend earned the points."
      earn_source: "online_order or missing_points_adjustment."
      qualifying_spend_usd: "Qualifying spend of the order on which points were computed."
      tier_at_posting: "Tier whose multiplier was applied."
      tier_multiplier_applied: "The multiplier applied (copied from the tier)."
    account: points
    direction: in
    triggers: []

  - type: loyalty_bonus_posted
    target: loyalty_ledger
    meaning: "Bonus points are posted outside of purchases: welcome, birthday, product review, referral or service goodwill."
    grain: "One row per bonus type per bonus reference."
    distinguish_by: [bonus_type, bonus_reference]
    fields:
      posting_date: "Date the bonus posts."
      available_date: "Equal to the posting date (bonus points are never pending)."
      points: "Bonus points credited (positive)."
      bonus_type: "welcome, birthday, product_review, referral or service_goodwill."
      bonus_reference: "The object the bonus is for: membership id (welcome), year YYYY (birthday), review reference (product_review), referred customer id (referral), order or claim id (service_goodwill)."
      tier_at_posting: "Tier held on the posting date."
    account: points
    direction: in
    triggers: []

  - type: loyalty_points_reversed
    target: loyalty_ledger
    meaning: "Points earned on merchandise that has since been refunded are taken back."
    grain: "One row per refunded return per order."
    distinguish_by: [return_id, order_id]
    fields:
      posting_date: "Date of the refund that caused the reversal."
      available_date: "Equal to the posting date."
      points: "Points debited (negative)."
      order_id: "The order whose earning row is being reversed."
      return_id: "The return whose refund caused the reversal."
      reversed_spend_usd: "Merchandise amount refunded on that return for that order, after any restocking fee withheld."
      tier_multiplier_applied: "The multiplier copied from the order's original earning row."
    account: points
    direction: out
    triggers: []

  - type: loyalty_reward_issued
    target: loyalty_ledger
    meaning: "Available points are converted into a Marlowe Rewards Note by the nightly conversion run."
    grain: "One row per conversion run per membership (the run is nightly)."
    distinguish_by: [posting_date]
    fields:
      posting_date: "Date of the conversion run."
      available_date: "Equal to the posting date."
      points: "Points debited (negative, a whole multiple of the conversion block)."
      reward_value_usd: "Value of the Rewards Note issued."
      tier_at_posting: "Tier held on the conversion date (fixes the note's validity)."
    account: points
    direction: out
    triggers:
      - event: credit:credit_issued
        map: {customer_id: customer_id, variant_name: "Marlowe Rewards Note", initial_value_usd: reward_value_usd, source_reference: loyalty_entry_id, issued_date: posting_date}

  - type: loyalty_points_forfeited
    target: loyalty_ledger
    meaning: "The remaining positive points balance is forfeited for inactivity or because the membership closed."
    grain: "One row per forfeiture reason per forfeiture date."
    distinguish_by: [forfeit_reason, posting_date]
    fields:
      posting_date: "Date of forfeiture."
      available_date: "Equal to the posting date."
      points: "Points debited (negative; the whole positive balance)."
      forfeit_reason: "inactivity, account_closure or abuse_closure."
      last_activity_date: "Posting date of the latest earning row (inactivity forfeitures)."
    account: points
    direction: out
    triggers: []

  - type: loyalty_tier_changed
    target: loyalty_memberships
    mutation: update
    meaning: "The membership's tier changes — an upgrade on reaching a threshold, or the result of the annual tier review."
    grain: "One row per transaction (the membership row is updated in place)."
    fields:
      variant_name: "The new tier."
      tier_start_date: "Date the new tier took effect."
      tier_valid_through: "Last day the new tier is valid."
    triggers: []

  - type: loyalty_suspended
    target: loyalty_memberships
    mutation: {transition: {from: active, to: suspended}}
    meaning: "The membership is placed under review."
    grain: "One row per transaction."
    fields:
      status: "suspended."
      suspension_reason: "account_takeover or return_abuse_review."
    triggers: []

  - type: loyalty_reinstated
    target: loyalty_memberships
    mutation: {transition: {from: suspended, to: active}}
    meaning: "A review is cleared and the membership becomes active again."
    grain: "One row per transaction."
    fields:
      status: "active."
      suspension_reason: "Reset to none."
    triggers: []

  - type: loyalty_closed_after_review
    target: loyalty_memberships
    mutation: {transition: {from: suspended, to: closed}}
    meaning: "The review team confirms abuse and closes the membership."
    grain: "One row per transaction."
    fields:
      status: "closed."
      closed_date: "Date of closure."
    triggers:
      - event: loyalty:loyalty_points_forfeited
        map: {forfeit_reason: abuse_closure, posting_date: closed_date, available_date: closed_date}

  - type: loyalty_closed
    target: loyalty_memberships
    mutation: {transition: {from: active, to: closed}}
    meaning: "The customer's own confirmed closure request takes effect."
    grain: "One row per transaction."
    fields:
      status: "closed."
      closed_date: "Date the customer confirmed the closure."
    triggers:
      - event: loyalty:loyalty_points_forfeited
        map: {forfeit_reason: account_closure, posting_date: closed_date, available_date: closed_date}

measures:
  - id: loyalty_msr_qualifying_spend_ytd
    window: "Calendar year to date: 1 January of the frozen date's year through the frozen date, by posting_date."
    measure: "Sum of qualifying_spend_usd over loyalty_points_earned rows of the membership minus the sum of reversed_spend_usd over loyalty_points_reversed rows of the membership in the window."
  - id: loyalty_msr_prior_year_qualifying_spend
    window: "The whole previous calendar year (1 January to 31 December), by posting_date."
    measure: "Sum of qualifying_spend_usd over loyalty_points_earned rows minus the sum of reversed_spend_usd over loyalty_points_reversed rows of the membership in the window."
  - id: loyalty_msr_available_points
    window: "All rows of the membership with available_date on or before the frozen date."
    measure: "Sum of points over those loyalty_ledger rows (pending earnings, whose available_date is later, are excluded)."
  - id: loyalty_msr_goodwill_points_ytd
    window: "Calendar year to date, by posting_date."
    measure: "Sum of points over loyalty_bonus_posted rows with bonus_type service_goodwill."
  - id: loyalty_msr_review_bonuses_this_month
    window: "The calendar month of the frozen date, by posting_date."
    measure: "Count of loyalty_bonus_posted rows with bonus_type product_review."
  - id: loyalty_msr_referral_bonuses_this_year
    window: "Calendar year to date, by posting_date."
    measure: "Count of loyalty_bonus_posted rows with bonus_type referral."
  - id: loyalty_msr_last_earning_date
    window: "All history of the membership."
    measure: "Latest posting_date over loyalty_points_earned rows; the enrolled_date when there is none."
  - id: loyalty_msr_return_rate_12m
    window: "Trailing return_abuse_lookback_months calendar months ending on the frozen date, by posting_date."
    measure: "Sum of reversed_spend_usd over loyalty_points_reversed rows divided by the sum of qualifying_spend_usd over loyalty_points_earned rows, as a percentage to one decimal place."
  - id: loyalty_msr_earning_orders_12m
    window: "Trailing return_abuse_lookback_months calendar months ending on the frozen date, by posting_date."
    measure: "Count of distinct order_id over loyalty_points_earned rows."

policies:
  - id: loyalty_enrollment
    subject: [loyalty_enrolled]
    rule: >-
      Any customer with a Marlowe & Finch profile may join Marlowe Rewards free of charge; the
      membership always opens at Marlowe Rewards Member in status active, with tier_start_date equal
      to the enrollment date and tier_valid_through on 31 December of the year after the enrollment
      year, and a points_balance of zero before the welcome bonus posts. A membership is opened only
      if the customer is at least `enrollment_min_age_months` calendar months old on the enrollment
      date, counted from the date of birth on the customer profile. Age is counted in whole calendar
      months from the date of birth; when the birth day does not exist in the target month the last
      day of that month is used, and the enrollment date may equal the resulting date. A membership is
      opened only if the customer has no other membership in status active or suspended. A customer
      whose earlier membership is closed may enroll again; the new membership starts at Member with no
      points carried over, and the earlier membership's forfeited points are never restored. Spend
      placed before enrollment never earns points retroactively except through the missing-points
      rule for orders placed under the same customer profile.
    eligibility:
      - id: minimum_age
        applies_to: [loyalty_enrolled]
        kind: time
        condition: "A membership is opened only if the customer is at least `enrollment_min_age_months` calendar months old on the enrollment date, counted from the date of birth on the customer profile."
        evidence_fields: [customers.date_of_birth, customers.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [customers.customer_id]
          action_bindings:
            customers.customer_id: customer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the date of birth on the customer profile"
          anchor_source: customers.date_of_birth
          relation: not_before
          duration_source: variants.enrollment_min_age_months
          unit: calendar_months
          counting_rule: "Age is counted in whole calendar months from the date of birth; when the birth day does not exist in the target month the last day of that month is used, and the enrollment date may equal the resulting date."
          boundary: inclusive
      - id: no_open_membership
        applies_to: [loyalty_enrolled]
        kind: dedup
        condition: "A membership is opened only if the customer has no other membership in status active or suspended."
        evidence_fields: [loyalty_memberships.customer_id, loyalty_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.customer_id]
          action_bindings:
            loyalty_memberships.customer_id: customer_id
        dedup_contract:
          table: loyalty_memberships
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [active, suspended]}
          distinct_fields: []

  - id: loyalty_agg_multi_holding
    subject: [loyalty_enrolled]
    rule: >-
      A customer holds at most one open Marlowe Rewards membership at a time; closed memberships do
      not count toward the cap. Points, spend and goodwill allowances are never combined across a
      customer's memberships, and points cannot be moved between memberships or customers.
    eligibility: []
    params: {max_per_customer: 1}

  - id: loyalty_evt_points_earning
    subject: [loyalty_points_earned]
    rule: >-
      Points post when an order is dispatched, on the order's qualifying spend: the merchandise price
      actually charged after every discount, excluding shipping fees (`earn_on_shipping_fees`), sales
      tax (`earn_on_sales_tax`), gift card purchases (`earn_on_gift_card_purchases`) and the part of
      the order paid with Marlowe Rewards Notes (`earn_on_rewards_note_tender`); the part paid with
      gift cards, Return Store Credit or Goodwill Credit does earn (`earn_on_store_credit_tender`).
      Points equal qualifying spend times `base_points_per_usd` times the `tier_points_multiplier` of
      the tier held on the posting date, rounded to the nearest whole point with a half point rounding
      up (`points_rounding_rule`); the tier and multiplier used are recorded on the row. The
      available_date is the posting date plus `points_pending_days` calendar days. Points post only
      while the membership is in status active or suspended. Orders placed while the customer had no
      open membership earn nothing. One posting is made per order at dispatch; a split shipment posts
      once, on the first dispatch, for the whole order's qualifying spend.
    eligibility:
      - id: membership_open
        applies_to: [loyalty_points_earned]
        kind: state
        condition: "Points post only while the membership is in status active or suspended."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.membership_id]
          action_bindings:
            loyalty_memberships.membership_id: membership_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active, suspended]
    params:
      per_tier:
        Marlowe Rewards Member: {tier_points_multiplier: "=tier_points_multiplier"}
        Marlowe Rewards Silver: {tier_points_multiplier: "=tier_points_multiplier"}
        Marlowe Rewards Gold: {tier_points_multiplier: "=tier_points_multiplier"}
        Marlowe Rewards Platinum: {tier_points_multiplier: "=tier_points_multiplier"}
        Marlowe Rewards Icon: {tier_points_multiplier: "=tier_points_multiplier"}
        Marlowe Rewards Atelier: {tier_points_multiplier: "=tier_points_multiplier"}
    formula:
      points: "round(qualifying_spend_usd * base_points_per_usd * tier_points_multiplier)"

  - id: loyalty_evt_missing_points
    subject: [loyalty_points_earned]
    rule: >-
      When a member reports that a dispatched order did not earn points, the agent posts a
      missing_points_adjustment row for that order. A missing-points request is accepted only if it
      is raised no later than `missing_points_request_window_days` calendar days after the order is
      placed. A missing-points request is accepted only if it is raised no earlier than
      `missing_points_min_days_after_shipment` calendar days after the order is dispatched. Days are
      counted as calendar days from the recorded date, the day of the recorded date being day zero,
      and a request on the boundary day itself is accepted. The order must be in status shipped,
      delivered or closed. The order must have been placed under the same customer profile as the
      membership (`points_credit_to_purchaser_only`); an order placed by another customer, including a
      household member, never earns for this membership. No earning row may already exist for the same
      order. The adjustment is computed exactly as the dispatch posting with the multiplier of the
      tier held on the handling date, on the order's qualifying spend net of any merchandise already
      refunded, and its available_date is the later of the handling date and the order's dispatch date
      plus `points_pending_days` calendar days.
    eligibility:
      - id: request_window
        applies_to: [loyalty_points_earned]
        kind: time
        condition: "A missing-points request is accepted only if it is raised no later than `missing_points_request_window_days` calendar days after the order is placed."
        evidence_fields: [orders.placed_date, orders.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [orders.order_id]
          action_bindings:
            orders.order_id: order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the order is placed"
          anchor_source: orders.placed_date
          relation: not_after
          duration_source: variants.missing_points_request_window_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the recorded date, the day of the recorded date being day zero, and a request on the boundary day itself is accepted."
          boundary: inclusive
      - id: settle_after_dispatch
        applies_to: [loyalty_points_earned]
        kind: time
        condition: "A missing-points request is accepted only if it is raised no earlier than `missing_points_min_days_after_shipment` calendar days after the order is dispatched."
        evidence_fields: [orders.shipped_date, orders.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [orders.order_id]
          action_bindings:
            orders.order_id: order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the order is dispatched"
          anchor_source: orders.shipped_date
          relation: not_before
          duration_source: variants.missing_points_min_days_after_shipment
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the recorded date, the day of the recorded date being day zero, and a request on the boundary day itself is accepted."
          boundary: inclusive
      - id: order_dispatched
        applies_to: [loyalty_points_earned]
        kind: state
        condition: "The order must be in status shipped, delivered or closed."
        evidence_fields: [orders.status, orders.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [orders.order_id]
          action_bindings:
            orders.order_id: order_id
        state_contract:
          field: orders.status
          allowed: [shipped, delivered, closed]
      - id: purchaser_is_member
        applies_to: [loyalty_points_earned]
        kind: authorization
        condition: "The order must have been placed under the same customer profile as the membership (`points_credit_to_purchaser_only`); an order placed by another customer, including a household member, never earns for this membership."
        evidence_fields: [orders.customer_id, orders.order_id, loyalty_memberships.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [orders.order_id]
          action_bindings:
            orders.order_id: order_id
      - id: not_already_earned
        applies_to: [loyalty_points_earned]
        kind: dedup
        condition: "No earning row may already exist for the same order."
        evidence_fields: [loyalty_ledger.order_id, loyalty_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_ledger.order_id]
          action_bindings:
            loyalty_ledger.order_id: order_id
        dedup_contract:
          table: loyalty_ledger
          mode: separate_record
          object_bindings: {order_id: order_id}
          duplicate_filters: {event_type: [loyalty_points_earned]}
          distinct_fields: []

  - id: loyalty_evt_points_reversal
    subject: [loyalty_points_reversed]
    rule: >-
      When a return refund is issued for merchandise of an order that earned points, the points earned
      on the refunded merchandise are reversed. The reversed spend is the merchandise amount refunded
      for that order on that return after any restocking fee withheld, excluding refunded shipping
      fees, sales tax and any part originally paid with Marlowe Rewards Notes. The reversal uses the
      `tier_multiplier_applied` recorded on the order's original earning row, never the multiplier of
      the tier held today, and is rounded the same way as earning. A reversal is posted only while the
      membership is in status active or suspended. Only one reversal row is posted per return and
      order. When the order never earned (no earning row exists), nothing is reversed. A reversal may
      take the points balance below zero; later earnings offset the deficit first. A reversal reduces
      calendar-year qualifying spend but never changes the tier held during the year; tiers move down
      only at the annual review. A Rewards Note already issued is never withdrawn because of a later
      reversal.
    eligibility:
      - id: membership_open
        applies_to: [loyalty_points_reversed]
        kind: state
        condition: "A reversal is posted only while the membership is in status active or suspended."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.membership_id]
          action_bindings:
            loyalty_memberships.membership_id: membership_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active, suspended]
      - id: one_reversal_per_return_order
        applies_to: [loyalty_points_reversed]
        kind: dedup
        condition: "Only one reversal row is posted per return and order."
        evidence_fields: [loyalty_ledger.return_id, loyalty_ledger.order_id, loyalty_ledger.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_ledger.return_id, loyalty_ledger.order_id]
          action_bindings:
            loyalty_ledger.return_id: return_id
            loyalty_ledger.order_id: order_id
        dedup_contract:
          table: loyalty_ledger
          mode: separate_record
          object_bindings: {return_id: return_id, order_id: order_id}
          duplicate_filters: {event_type: [loyalty_points_reversed]}
          distinct_fields: []
    formula:
      points: "0 - round(reversed_spend_usd * base_points_per_usd * tier_multiplier_applied)"

  - id: loyalty_evt_reward_conversion
    subject: [loyalty_reward_issued]
    rule: >-
      With `reward_auto_conversion`, the nightly run converts available points into a single Marlowe
      Rewards Note whenever loyalty_msr_available_points is at least `reward_conversion_points`: the
      number of reward units is the whole number of conversion blocks contained in the available
      points, the points debited are the units times `reward_conversion_points`, and the note value is
      the units times `reward_note_value_usd`. Pending points never convert and a partial block never
      converts or is paid out. Conversion runs only while the membership is in status active.
      Conversion is blocked while the total points_balance is below zero
      (`negative_balance_conversion_block`). The note's validity is the `reward_note_validity_days` of
      the tier held on the conversion date, counted in calendar days from the issue date; the note
      itself is issued under the credit charter. Members cannot request conversion early, choose a
      different denomination or decline a conversion.
    eligibility:
      - id: membership_active
        applies_to: [loyalty_reward_issued]
        kind: state
        condition: "Conversion runs only while the membership is in status active."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.membership_id]
          action_bindings:
            loyalty_memberships.membership_id: membership_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
      - id: balance_not_negative
        applies_to: [loyalty_reward_issued]
        kind: authorization
        condition: "Conversion is blocked while the total points_balance is below zero (`negative_balance_conversion_block`)."
        evidence_fields: [loyalty_memberships.points_balance, loyalty_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.membership_id]
          action_bindings:
            loyalty_memberships.membership_id: membership_id
    params:
      per_tier:
        Marlowe Rewards Member: {reward_note_validity_days: "=reward_note_validity_days"}
        Marlowe Rewards Silver: {reward_note_validity_days: "=reward_note_validity_days"}
        Marlowe Rewards Gold: {reward_note_validity_days: "=reward_note_validity_days"}
        Marlowe Rewards Platinum: {reward_note_validity_days: "=reward_note_validity_days"}
        Marlowe Rewards Icon: {reward_note_validity_days: "=reward_note_validity_days"}
        Marlowe Rewards Atelier: {reward_note_validity_days: "=reward_note_validity_days"}
    formula:
      when_not: "loyalty_msr_available_points < reward_conversion_points"
      reward_units: "(loyalty_msr_available_points - loyalty_msr_available_points % reward_conversion_points) / reward_conversion_points"
      points: "0 - reward_units * reward_conversion_points"
      reward_value_usd: "reward_units * reward_note_value_usd"
    measures: [loyalty_msr_available_points]

  - id: loyalty_evt_bonus_points
    subject: [loyalty_bonus_posted]
    rule: >-
      Bonus points post as available on their posting date. The welcome bonus of
      `welcome_bonus_points` posts once in a customer's lifetime, on the first enrollment. The birthday
      bonus of the `birthday_bonus_points` of the tier held on the posting date posts on day
      `birthday_bonus_posting_day` of the birth month recorded in the customer's date of birth; a tier
      whose value is 0 receives no birthday row. A birthday bonus posts only if the membership is
      enrolled at least `birthday_bonus_min_tenure_days` calendar days before the bonus posting date.
      Tenure days are counted as calendar days between the enrollment date and the posting date, and
      exactly the minimum qualifies. A product review earns `review_bonus_points` when the review is
      published and the reviewed product is on a dispatched order of the member
      (`review_bonus_requires_verified_purchase`); at most `review_bonus_monthly_cap` review bonuses
      post per calendar month (loyalty_msr_review_bonuses_this_month), and reviews beyond the cap earn
      nothing and are not carried into the next month. A referral earns the `referral_bonus_points` of
      the tier held on the posting date `referral_posting_delay_days` calendar days after the referred
      friend's first order is dispatched, provided that order's merchandise after discounts was at
      least `referral_min_friend_order_usd` and has not been fully refunded; at most
      `referral_annual_cap` referral bonuses post per calendar year
      (loyalty_msr_referral_bonuses_this_year). Birthday, review, referral and goodwill bonuses post
      only while the membership is in status active (`suspension_withholds_rewards`); the welcome bonus
      posts with the enrollment itself. Each bonus type posts at most once per bonus reference for a
      customer.
    eligibility:
      - id: membership_active
        applies_to: [loyalty_bonus_posted]
        kind: state
        condition: "Birthday, review, referral and goodwill bonuses post only while the membership is in status active (`suspension_withholds_rewards`); the welcome bonus posts with the enrollment itself."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.membership_id]
          action_bindings:
            loyalty_memberships.membership_id: membership_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
      - id: birthday_tenure
        applies_to: [loyalty_bonus_posted]
        kind: time
        condition: "A birthday bonus posts only if the membership is enrolled at least `birthday_bonus_min_tenure_days` calendar days before the bonus posting date."
        evidence_fields: [loyalty_memberships.enrolled_date, loyalty_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.membership_id]
          action_bindings:
            loyalty_memberships.membership_id: membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the membership is enrolled"
          anchor_source: loyalty_memberships.enrolled_date
          relation: not_before
          duration_source: variants.birthday_bonus_min_tenure_days
          unit: calendar_days
          counting_rule: "Tenure days are counted as calendar days between the enrollment date and the posting date, and exactly the minimum qualifies."
          boundary: inclusive
      - id: once_per_reference
        applies_to: [loyalty_bonus_posted]
        kind: dedup
        condition: "Each bonus type posts at most once per bonus reference for a customer."
        evidence_fields: [loyalty_ledger.customer_id, loyalty_ledger.bonus_type, loyalty_ledger.bonus_reference]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_ledger.customer_id, loyalty_ledger.bonus_type, loyalty_ledger.bonus_reference]
          action_bindings:
            loyalty_ledger.customer_id: customer_id
            loyalty_ledger.bonus_type: bonus_type
            loyalty_ledger.bonus_reference: bonus_reference
        dedup_contract:
          table: loyalty_ledger
          mode: separate_record
          object_bindings: {customer_id: customer_id, bonus_type: bonus_type, bonus_reference: bonus_reference}
          duplicate_filters: {event_type: [loyalty_bonus_posted]}
          distinct_fields: []
    params:
      per_tier:
        Marlowe Rewards Member: {birthday_bonus_points: "=birthday_bonus_points", referral_bonus_points: "=referral_bonus_points"}
        Marlowe Rewards Silver: {birthday_bonus_points: "=birthday_bonus_points", referral_bonus_points: "=referral_bonus_points"}
        Marlowe Rewards Gold: {birthday_bonus_points: "=birthday_bonus_points", referral_bonus_points: "=referral_bonus_points"}
        Marlowe Rewards Platinum: {birthday_bonus_points: "=birthday_bonus_points", referral_bonus_points: "=referral_bonus_points"}
        Marlowe Rewards Icon: {birthday_bonus_points: "=birthday_bonus_points", referral_bonus_points: "=referral_bonus_points"}
        Marlowe Rewards Atelier: {birthday_bonus_points: "=birthday_bonus_points", referral_bonus_points: "=referral_bonus_points"}
    measures: [loyalty_msr_review_bonuses_this_month, loyalty_msr_referral_bonuses_this_year]

  - id: loyalty_evt_goodwill_points
    subject: [loyalty_bonus_posted]
    rule: >-
      A service_goodwill bonus compensates a member for a documented delivery failure. A goodwill grant
      requires a delivery claim on record for the referenced order whose status is approved or
      resolved; a late, lost or damaged parcel the customer only describes, without such a claim, is
      not a documented failure. The bonus_reference is the claim's claim_id, and only one goodwill
      grant is posted per claim. The grant equals the `goodwill_points_per_case_cap` of the tier held
      on the posting date, reduced to what remains of the tier's `goodwill_points_annual_cap` after the
      goodwill already posted this calendar year (loyalty_msr_goodwill_points_ytd); when nothing
      remains, no goodwill row is posted and no other compensation is substituted under this charter.
      Goodwill points are available immediately. The member's tier on the posting date governs both
      caps even if the tier changed after the claim was opened.
    eligibility:
      - id: documented_failure
        applies_to: [loyalty_bonus_posted]
        kind: state
        condition: "A goodwill grant requires a delivery claim on record for the referenced order whose status is approved or resolved; a late, lost or damaged parcel the customer only describes, without such a claim, is not a documented failure."
        evidence_fields: [delivery_claims.status, delivery_claims.claim_id, delivery_claims.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [delivery_claims.claim_id]
          action_bindings:
            delivery_claims.claim_id: bonus_reference
        state_contract:
          field: delivery_claims.status
          allowed: [approved, resolved]
      - id: one_grant_per_claim
        applies_to: [loyalty_bonus_posted]
        kind: dedup
        condition: "The bonus_reference is the claim's claim_id, and only one goodwill grant is posted per claim."
        evidence_fields: [loyalty_ledger.bonus_reference, loyalty_ledger.bonus_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_ledger.bonus_reference]
          action_bindings:
            loyalty_ledger.bonus_reference: bonus_reference
        dedup_contract:
          table: loyalty_ledger
          mode: separate_record
          object_bindings: {bonus_reference: bonus_reference}
          duplicate_filters: {bonus_type: [service_goodwill]}
          distinct_fields: []
    params:
      per_tier:
        Marlowe Rewards Member: {goodwill_points_per_case_cap: "=goodwill_points_per_case_cap", goodwill_points_annual_cap: "=goodwill_points_annual_cap"}
        Marlowe Rewards Silver: {goodwill_points_per_case_cap: "=goodwill_points_per_case_cap", goodwill_points_annual_cap: "=goodwill_points_annual_cap"}
        Marlowe Rewards Gold: {goodwill_points_per_case_cap: "=goodwill_points_per_case_cap", goodwill_points_annual_cap: "=goodwill_points_annual_cap"}
        Marlowe Rewards Platinum: {goodwill_points_per_case_cap: "=goodwill_points_per_case_cap", goodwill_points_annual_cap: "=goodwill_points_annual_cap"}
        Marlowe Rewards Icon: {goodwill_points_per_case_cap: "=goodwill_points_per_case_cap", goodwill_points_annual_cap: "=goodwill_points_annual_cap"}
        Marlowe Rewards Atelier: {goodwill_points_per_case_cap: "=goodwill_points_per_case_cap", goodwill_points_annual_cap: "=goodwill_points_annual_cap"}
    formula:
      when_not: "loyalty_msr_goodwill_points_ytd >= goodwill_points_annual_cap"
      points: "min(goodwill_points_per_case_cap, goodwill_points_annual_cap - loyalty_msr_goodwill_points_ytd)"
    measures: [loyalty_msr_goodwill_points_ytd]

  - id: loyalty_evt_points_forfeiture
    subject: [loyalty_points_forfeited]
    rule: >-
      A positive points balance is forfeited in full when no earning row has posted for
      `points_expiry_inactivity_months` calendar months of the tier held: the forfeiture date is the
      day after the date reached by adding that many calendar months to loyalty_msr_last_earning_date
      (month-end falls back to the last day of a shorter month). Bonus, reversal and conversion rows do
      not count as activity. When a membership closes, any positive balance is forfeited on the
      closure date (`closure_forfeits_points`) with reason account_closure, or abuse_closure when the
      review team closed it. A zero or negative balance is never forfeited and a negative balance is
      not collected. Forfeited points are not reinstated, including when the customer re-enrols.
    eligibility: []
    params:
      per_tier:
        Marlowe Rewards Member: {points_expiry_inactivity_months: "=points_expiry_inactivity_months"}
        Marlowe Rewards Silver: {points_expiry_inactivity_months: "=points_expiry_inactivity_months"}
        Marlowe Rewards Gold: {points_expiry_inactivity_months: "=points_expiry_inactivity_months"}
        Marlowe Rewards Platinum: {points_expiry_inactivity_months: "=points_expiry_inactivity_months"}
        Marlowe Rewards Icon: {points_expiry_inactivity_months: "=points_expiry_inactivity_months"}
        Marlowe Rewards Atelier: {points_expiry_inactivity_months: "=points_expiry_inactivity_months"}
    measures: [loyalty_msr_last_earning_date]

  - id: loyalty_tier_qualification
    subject: [loyalty_tier_changed]
    rule: >-
      A membership is upgraded on the posting date on which loyalty_msr_qualifying_spend_ytd first
      reaches the `tier_qualifying_spend_usd` of a higher tier; it moves straight to the highest tier
      whose threshold is met, tier_start_date becomes that posting date and tier_valid_through becomes
      31 December of the calendar year that follows the qualifying year
      (`tier_validity_years_after_qualifying_year`). Reaching the threshold of the tier already held
      extends tier_valid_through the same way without changing the tier. On the
      `annual_tier_review_date` each membership whose tier_valid_through has passed is reviewed against
      loyalty_msr_prior_year_qualifying_spend: it takes the highest tier whose threshold that spend
      meets, but never falls more than `tier_review_downgrade_max_levels` level below the tier held,
      and the resulting tier is valid through 31 December of the review year. Mid-year reversals never
      lower a tier. Tier changes are written only while the membership is in status active; a suspended
      membership keeps its tier, and a review date that passed during suspension is applied on the
      reinstatement date using the same prior-year spend. Marlowe Rewards Member never expires.
    eligibility:
      - id: membership_active
        applies_to: [loyalty_tier_changed]
        kind: state
        condition: "Tier changes are written only while the membership is in status active; a suspended membership keeps its tier, and a review date that passed during suspension is applied on the reinstatement date using the same prior-year spend."
        evidence_fields: [loyalty_memberships.status, loyalty_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.membership_id]
          action_bindings:
            loyalty_memberships.membership_id: membership_id
        state_contract:
          field: loyalty_memberships.status
          allowed: [active]
    params:
      per_tier:
        Marlowe Rewards Member: {tier_qualifying_spend_usd: "=tier_qualifying_spend_usd"}
        Marlowe Rewards Silver: {tier_qualifying_spend_usd: "=tier_qualifying_spend_usd"}
        Marlowe Rewards Gold: {tier_qualifying_spend_usd: "=tier_qualifying_spend_usd"}
        Marlowe Rewards Platinum: {tier_qualifying_spend_usd: "=tier_qualifying_spend_usd"}
        Marlowe Rewards Icon: {tier_qualifying_spend_usd: "=tier_qualifying_spend_usd"}
        Marlowe Rewards Atelier: {tier_qualifying_spend_usd: "=tier_qualifying_spend_usd"}
    measures: [loyalty_msr_qualifying_spend_ytd, loyalty_msr_prior_year_qualifying_spend]

  - id: loyalty_membership_review
    subject: [loyalty_suspended, loyalty_reinstated, loyalty_closed_after_review]
    rule: >-
      A membership is suspended with suspension_reason return_abuse_review when
      loyalty_msr_return_rate_12m is at or above `return_abuse_rate_threshold_pct` and
      loyalty_msr_earning_orders_12m is at least `return_abuse_min_orders`; below either figure the
      screen does not fire. A membership is suspended with suspension_reason account_takeover when the
      verified account holder reports that someone else has signed in to their account or used their
      points or Rewards Notes. While suspended (`suspension_withholds_rewards`) the membership keeps
      earning pending points but receives no conversion, bonus or tier change. Reinstatement and
      closure after review are decided only by the loyalty review team; an agent cannot lift a
      suspension, and a customer who disputes a suspension is handed to a human representative.
      Both screen measures look back over the trailing `return_abuse_lookback_months` calendar months ending on the screening date.
    eligibility:
      - id: takeover_report
        applies_to: [loyalty_suspended]
        kind: caller_fact
        condition: "A membership is suspended with suspension_reason account_takeover when the verified account holder reports that someone else has signed in to their account or used their points or Rewards Notes."
        evidence_fields: [loyalty_memberships.membership_id, identity_verifications.verified]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [loyalty_memberships.membership_id]
          action_bindings:
            loyalty_memberships.membership_id: membership_id
    measures: [loyalty_msr_return_rate_12m, loyalty_msr_earning_orders_12m]

  - id: loyalty_closure
    subject: [loyalty_closed, loyalty_points_forfeited]
    rule: >-
      Closing a membership is the customer's own decision: the agent records a membership_closure
      request in status pending_customer_confirmation, and the membership closes only when the
      customer personally confirms it. A membership is closed only on a membership_closure request for
      that membership whose request_status is confirmed. Before the customer confirms, the agent tells
      them that any positive points balance is forfeited (`closure_forfeits_points`), including pending
      points. Marlowe Rewards Notes already issued stay valid until their own expiry under the credit
      charter. Returns refunded after closure post no reversal. A suspended membership cannot be
      closed at the customer's request; it stays under review.
    eligibility:
      - id: confirmed_request
        applies_to: [loyalty_closed]
        kind: authorization
        condition: "A membership is closed only on a membership_closure request for that membership whose request_status is confirmed."
        evidence_fields: [loyalty_requests.membership_id, loyalty_requests.request_type, loyalty_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [loyalty_requests.membership_id]
          action_bindings:
            loyalty_requests.membership_id: membership_id




extended_policies:
- id: loyalty_ext_returned_merchandise_reversal
  base_policy_refs:
  - loyalty_evt_points_reversal
  overwrite:
  - base_policy: loyalty_evt_points_reversal
    superseded_clause: >-
      The reversal uses the `tier_multiplier_applied` recorded on the order's original earning row, never
      the multiplier of the tier held today, and is rounded the same way as earning.
    replaced_by: >-
      The multiplier used depends on the member's trailing return record, read from the points ledger
      over the 12 months ending on the handling date, a row dated exactly 12 months before it not counting:
  - base_policy: loyalty_evt_points_reversal
    superseded_clause: >-
      When a return refund is issued for merchandise of an order that earned points, the points earned
      on the refunded merchandise are reversed.
    replaced_by: >-
      The three shares are multiplied together into one combined share, and the reversed spend is multiplied
      once by that combined share and then by base_points_per_usd and by the multiplier used; rounding
      happens only on that final figure, to the nearest whole point with a half point rounding up.
  trigger: state_due
  subject:
  - loyalty_points_reversed
  computes: points_reversed
  target_tool: post_points_reversal_46de2c04
  params:
    low_return_share_pct: 10
    moderate_return_share_pct: 25
    min_entries_full: 6
    min_entries_mid: 3
    retailer_fault_share: 0.75
    late_arrival_share: 0.9
    claim_on_order_share: 0.8
    recent_claim_share: 0.9
    annual_plan_share: 0.9
    monthly_plan_share: 0.95
  rule: >-
    When a return of an order that earned points has been refunded and no points reversal stands on the
    ledger for that return and order, the agent posts the reversal for that return and order. The reversal
    concerns the member's return in status settled and the order that return was made against. The reversed
    spend is the merchandise amount credited on that return, less any restocking fee withheld on it (never
    below zero), less the share of it paid with Marlowe Rewards Notes, which is the Rewards Note amount
    captured on the order divided by the order's merchandise subtotal after its discount total; it is
    kept to the cent, and the reversal entry records this reversed spend and the multiplier of the order's
    original earning entry. The points reversed are the reversed spend times base_points_per_usd times
    the multiplier recorded on the order's original earning entry, rounded to the nearest whole point
    with a half point rounding up. The multiplier used depends on the member's trailing return record,
    read from the points ledger over the 12 months ending on the handling date, a row dated exactly 12
    months before it not counting: the return share is the reversed spend on reversal entries in those
    months divided by the qualifying spend on earning entries in those months, as a percentage (zero when
    no qualifying spend was posted in those months), and the earning count is the number of earning entries
    in those months. A return share under 10 percent with an earning count of 6 or more reverses base
    points only, a multiplier of 1.00; a return share under 10 percent with an earning count of 3 to 5,
    or a return share from 10 percent to under 25 percent with an earning count of 3 or more, uses the
    midpoint between 1.00 and the original multiplier; any other record uses the original multiplier.
    The reason given on the returned line sets a reason share: defective or not as pictured, 75 percent;
    arrived too late, 90 percent; any other reason, 100 percent. A delivery claim sets a service-recovery
    share: when the refunded order itself carries a delivery claim in status approved or resolved, 80
    percent; when it does not but compensation was booked on one of the member's delivery claims within
    the 12 months ending on the handling date, 90 percent; otherwise 100 percent. An Unlimited plan sets
    a membership share: an annual Unlimited plan in status active or cancellation_pending, 90 percent;
    a monthly Unlimited plan in status active or cancellation_pending, 95 percent; otherwise 100 percent.
    The three shares are multiplied together into one combined share, and the reversed spend is multiplied
    once by that combined share and then by base_points_per_usd and by the multiplier used; rounding happens
    only on that final figure, to the nearest whole point with a half point rounding up. A reversal is
    posted only while the membership is in status active or suspended, and only once per return and order.
  prerequisite: []
  cross_category:
  - category: returns
    as: history
    reads:
    - return_cases.status
    - return_cases.return_id
    - return_cases.order_id
    - return_settlements.merchandise_amount_usd
    - return_settlements.amount_usd
    - return_lines.return_reason
    note: >-
      The settled return and its credited merchandise and fees fix the reversed spend; the returned line's
      reason decides the reason-share factor.
  - category: orders
    as: history
    reads:
    - orders.merchandise_subtotal_usd
    - orders.discount_total_usd
    - order_payments.amount_usd
    note: >-
      The order's Rewards Note captures and merchandise after discounts give the note-paid share removed
      from the reversed spend.
  - category: claims
    as: history
    reads:
    - delivery_claims.status
    - claim_events.event_type
    note: >-
      A claim on the refunded order, or compensation booked on any claim in the last 12 months, decides
      the service-recovery share.
  - category: pass
    as: branch
    reads:
    - pass_memberships.variant_name
    - pass_memberships.status
    note: The Unlimited plan held and its status decide the membership share.
  compute:
  - ret_id: CFIELD('returns', 'return_id', status='settled')
  - ret_order: CFIELD('returns', 'order_id', status='settled')
  - refunded_merch: >-
      XSUM('returns', 'return_settlements', 'merchandise_amount_usd', return_id=ret_id, event_type='returns_refund_credited')
  - restock_fee: >-
      0 - XSUM('returns', 'return_settlements', 'amount_usd', return_id=ret_id, event_type='returns_fee_assessed',
      fee_type='restocking_fee')
  - note_paid: >-
      XSUM('orders', 'order_payments', 'amount_usd', order_id=ret_order, event_type='orders_payment_captured',
      tender_type='rewards_note')
  - order_net_merch: >-
      CFIELD('orders', 'merchandise_subtotal_usd', order_id=ret_order) - CFIELD('orders', 'discount_total_usd',
      order_id=ret_order)
  - reversed_spend: >-
      RND(MX(0, refunded_merch - restock_fee) * (1 - (note_paid / order_net_merch if order_net_merch >
      0 else 0)), 2)
  - orig_mult: >-
      float(LATEST('loyalty_ledger', 'tier_multiplier_applied', date_field='posting_date', event_type='loyalty_points_earned',
      order_id=ret_order))
  - rev_12m: >-
      SUM('loyalty_ledger', 'reversed_spend_usd', within_months=12, date_field='posting_date', event_type='loyalty_points_reversed')
  - qual_12m: >-
      SUM('loyalty_ledger', 'qualifying_spend_usd', within_months=12, date_field='posting_date', event_type='loyalty_points_earned')
  - earn_count_12m: >-
      COUNT('loyalty_ledger', within_months=12, date_field='posting_date', event_type='loyalty_points_earned')
  - return_share_pct: (rev_12m * 100 / qual_12m) if qual_12m > 0 else 0
  - mult_used: >-
      1.0 if (return_share_pct < K('low_return_share_pct') and earn_count_12m >= K('min_entries_full'))
      else ((1 + (orig_mult - 1) / 2) if (return_share_pct < K('moderate_return_share_pct') and earn_count_12m
      >= K('min_entries_mid')) else orig_mult)
  - line_reason: >-
      XLATEST('returns', 'return_lines', 'return_reason', date_field='event_date', return_id=ret_id, event_type='returns_line_authorized')
  - reason_share: >-
      K('retailer_fault_share') if (line_reason == 'defective' or line_reason == 'not_as_pictured') else
      (K('late_arrival_share') if line_reason == 'arrived_too_late' else 1.0)
  - order_claim_status: CFIELD('claims', 'status', order_id=ret_order)
  - comp_count_12m: XCOUNT('claims', 'claim_events', within_months=12, event_type='claims_compensation_issued')
  - claim_share: >-
      K('claim_on_order_share') if (order_claim_status == 'approved' or order_claim_status == 'resolved')
      else (K('recent_claim_share') if comp_count_12m > 0 else 1.0)
  - plan_held: CFIELD('pass', 'variant_name')
  - plan_status: CFIELD('pass', 'status')
  - plan_in_force: plan_status == 'active' or plan_status == 'cancellation_pending'
  - plan_annual: >-
      plan_held == 'Unlimited Student Annual' or plan_held == 'Unlimited Standard Annual' or plan_held
      == 'Unlimited Express Annual' or plan_held == 'Unlimited Next-Day Annual'
  - plan_share: >-
      K('annual_plan_share') if (plan_in_force and plan_annual) else (K('monthly_plan_share') if (plan_in_force
      and not plan_annual) else 1.0)
  - combined_share: reason_share * claim_share * plan_share
  - result: int(reversed_spend * combined_share * P('base_points_per_usd') * mult_used + 0.5)
  compute_basis:
    ret_id: >-
      The reversal concerns the member's return in status settled and the order that return was made against.
    ret_order: >-
      The reversal concerns the member's return in status settled and the order that return was made against.
    refunded_merch: >-
      The reversed spend is the merchandise amount credited on that return, less any restocking fee withheld
      on it (never below zero), less the share of it paid with Marlowe Rewards Notes
    restock_fee: less any restocking fee withheld on it
    note_paid: >-
      which is the Rewards Note amount captured on the order divided by the order's merchandise subtotal
      after its discount total
    order_net_merch: >-
      which is the Rewards Note amount captured on the order divided by the order's merchandise subtotal
      after its discount total
    reversed_spend: >-
      The reversed spend is the merchandise amount credited on that return, less any restocking fee withheld
      on it (never below zero), less the share of it paid with Marlowe Rewards Notes, which is the Rewards
      Note amount captured on the order divided by the order's merchandise subtotal after its discount
      total; it is kept to the cent
    orig_mult: times the multiplier recorded on the order's original earning entry
    rev_12m: >-
      the return share is the reversed spend on reversal entries in those months divided by the qualifying
      spend on earning entries in those months, as a percentage
    qual_12m: >-
      the return share is the reversed spend on reversal entries in those months divided by the qualifying
      spend on earning entries in those months, as a percentage
    earn_count_12m: the earning count is the number of earning entries in those months
    return_share_pct: >-
      the return share is the reversed spend on reversal entries in those months divided by the qualifying
      spend on earning entries in those months, as a percentage (zero when no qualifying spend was posted
      in those months)
    mult_used: >-
      A return share under 10 percent with an earning count of 6 or more reverses base points only, a
      multiplier of 1.00; a return share under 10 percent with an earning count of 3 to 5, or a return
      share from 10 percent to under 25 percent with an earning count of 3 or more, uses the midpoint
      between 1.00 and the original multiplier; any other record uses the original multiplier.
    line_reason: The reason given on the returned line sets a reason share
    reason_share: >-
      The reason given on the returned line sets a reason share: defective or not as pictured, 75 percent;
      arrived too late, 90 percent; any other reason, 100 percent.
    order_claim_status: when the refunded order itself carries a delivery claim in status approved or
      resolved, 80 percent
    comp_count_12m: >-
      when it does not but compensation was booked on one of the member's delivery claims within the 12
      months ending on the handling date, 90 percent
    claim_share: >-
      A delivery claim sets a service-recovery share: when the refunded order itself carries a delivery
      claim in status approved or resolved, 80 percent; when it does not but compensation was booked on
      one of the member's delivery claims within the 12 months ending on the handling date, 90 percent;
      otherwise 100 percent.
    plan_held: An Unlimited plan sets a membership share
    plan_status: an annual Unlimited plan in status active or cancellation_pending, 90 percent
    plan_in_force: in status active or cancellation_pending
    plan_annual: >-
      an annual Unlimited plan in status active or cancellation_pending, 90 percent; a monthly Unlimited
      plan in status active or cancellation_pending, 95 percent
    plan_share: >-
      An Unlimited plan sets a membership share: an annual Unlimited plan in status active or cancellation_pending,
      90 percent; a monthly Unlimited plan in status active or cancellation_pending, 95 percent; otherwise
      100 percent.
    combined_share: The three shares are multiplied together into one combined share
    result: >-
      the reversed spend is multiplied once by that combined share and then by base_points_per_usd and
      by the multiplier used; rounding happens only on that final figure, to the nearest whole point with
      a half point rounding up.
  factors:
  - id: return_record_multiplier
    effect: method
    decides: mult_used
    bindings:
    - rev_12m
    - qual_12m
    - earn_count_12m
    - return_share_pct
    - mult_used
    ladder:
    - when: >-
        return share under 10 percent and an earning count of 6 or more in the 12 months ending on the
        handling date
      method: >-
        reverse base points only: the multiplier is taken as 1.00 instead of the original earning entry's
        multiplier
    - when: >-
        return share under 10 percent with an earning count of 3 to 5, or return share from 10 percent
        to under 25 percent with an earning count of 3 or more
      method: use the midpoint between 1.00 and the original earning entry's multiplier
    - when: otherwise
      method: use the multiplier recorded on the order's original earning entry
    baseline:
      mult_used: orig_mult
    evidence:
    - history
    cross_difficulty: null
  - id: return_reason_share
    effect: parameter
    decides: reason_share
    bindings:
    - line_reason
    - reason_share
    ladder:
    - when: the returned line's reason is defective or not as pictured
      value: K('retailer_fault_share') = 75 percent
    - when: the returned line's reason is arrived too late
      value: K('late_arrival_share') = 90 percent
    - when: otherwise
      value: 100 percent
    baseline:
      reason_share: '1.0'
    evidence:
    - cross_category
    cross_difficulty: returns
  - id: service_recovery_share
    effect: parameter
    decides: claim_share
    bindings:
    - order_claim_status
    - comp_count_12m
    - claim_share
    ladder:
    - when: the refunded order carries a delivery claim in status approved or resolved
      value: K('claim_on_order_share') = 80 percent
    - when: >-
        the refunded order carries no such claim, and compensation was booked on one of the member's delivery
        claims within the 12 months ending on the handling date
      value: K('recent_claim_share') = 90 percent
    - when: otherwise
      value: 100 percent
    baseline:
      claim_share: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: claims
  - id: unlimited_membership_share
    effect: parameter
    decides: plan_share
    bindings:
    - plan_held
    - plan_status
    - plan_in_force
    - plan_annual
    - plan_share
    ladder:
    - when: an Unlimited plan in status active or cancellation_pending and that plan is annual
      value: K('annual_plan_share') = 90 percent
    - when: an Unlimited plan in status active or cancellation_pending and that plan is monthly
      value: K('monthly_plan_share') = 95 percent
    - when: otherwise
      value: 100 percent
    baseline:
      plan_share: '1.0'
    evidence:
    - cross_category
    cross_difficulty: null
  baseline:
    rule: >-
      The reversed spend is the merchandise amount credited on that return, less any restocking fee withheld
      on it (never below zero), less the share of it paid with Marlowe Rewards Notes, which is the Rewards
      Note amount captured on the order divided by the order's merchandise subtotal after its discount
      total; it is kept to the cent, and the reversal entry records this reversed spend and the multiplier
      of the order's original earning entry. The points reversed are the reversed spend times base_points_per_usd
      times the multiplier recorded on the order's original earning entry, rounded to the nearest whole
      point with a half point rounding up.
    params:
    - base_points_per_usd
  inputs:
    history:
    - table: loyalty_ledger
      aggregate: sum
      field: reversed_spend_usd
      within_months: 12
      filters:
        event_type: loyalty_points_reversed
    - table: loyalty_ledger
      aggregate: sum
      field: qualifying_spend_usd
      within_months: 12
      filters:
        event_type: loyalty_points_earned
    - table: loyalty_ledger
      aggregate: count
      field: loyalty_entry_id
      within_months: 12
      filters:
        event_type: loyalty_points_earned
    - table: loyalty_ledger
      aggregate: latest
      field: tier_multiplier_applied
      filters:
        event_type: loyalty_points_earned
    - category: returns
      table: return_settlements
      aggregate: sum
      field: merchandise_amount_usd
      filters:
        event_type: returns_refund_credited
    - category: returns
      table: return_settlements
      aggregate: sum
      field: amount_usd
      filters:
        event_type: returns_fee_assessed
        fee_type: restocking_fee
    - category: returns
      table: return_lines
      aggregate: latest
      field: return_reason
      filters:
        event_type: returns_line_authorized
    - category: orders
      table: order_payments
      aggregate: sum
      field: amount_usd
      filters:
        event_type: orders_payment_captured
        tender_type: rewards_note
    - category: claims
      table: claim_events
      aggregate: count
      field: claim_event_id
      within_months: 12
      filters:
        event_type: claims_compensation_issued
    cross_category:
    - returns
    - orders
    - claims
    - pass
- id: loyalty_ext_delivery_failure_goodwill
  base_policy_refs:
  - loyalty_evt_bonus_points
  - loyalty_evt_goodwill_points
  overwrite:
  - base_policy: loyalty_evt_goodwill_points
    superseded_clause: >-
      The grant equals the `goodwill_points_per_case_cap` of the tier held on the posting date, reduced
      to what remains of the tier's `goodwill_points_annual_cap` after the goodwill already posted this
      calendar year (loyalty_msr_goodwill_points_ytd);
    replaced_by: >-
      The uplifts that apply are added together into one combined rate, and the starting figure is multiplied
      once by one plus that combined rate before the rounding, the per-case limit and the annual limit
      are applied in that order.
  - base_policy: loyalty_evt_goodwill_points
    superseded_clause: >-
      A goodwill grant requires a delivery claim on record for the referenced order whose status is approved
      or resolved; a late, lost or damaged parcel the customer only describes, without such a claim, is
      not a documented failure.
    replaced_by: >-
      A goodwill grant is made while the claim stands approved, as part of making the member whole on
      it; a claim already resolved has had its compensation booked and is closed to a further goodwill
      grant.
  trigger: on_request
  subject:
  - loyalty_bonus_posted
  computes: goodwill_points
  target_tool: accept_goodwill_points_7ea0a08d
  params:
    spoiled_line_multiple: 2
    fast_service_uplift: 0.4
    plan_uplift: 0.2
    three_failure_uplift: 0.3
    two_failure_uplift: 0.15
    long_tenure_uplift: 0.2
    mid_tenure_uplift: 0.1
    long_tenure_months: 96
    mid_tenure_months: 48
  rule: >-
    A member whose delivery claim stands approved may be granted service goodwill points for that documented
    failure; the agent works the grant out and offers it, and the grant is credited only when the member
    accepts it in person, as a service_goodwill bonus whose reference is the claim number, once per claim,
    and only while the membership is in status active. The claim concerned is the member's delivery claim
    in status approved, and the affected order is the order that claim was opened on. A goodwill grant
    is made while the claim stands approved, as part of making the member whole on it; a claim already
    resolved has had its compensation booked and is closed to a further goodwill grant. The net points
    the affected order holds are the sum of the points on every points entry recorded for that order,
    its earning entries and its reversal entries together, never taken below zero. The goodwill grant
    is fixed only after the points ledger carries a reversal entry for every refunded return made against
    the order the claim concerns. The grant starts from the goodwill_points_per_case_cap of the tier held
    on the posting date. The starting figure is rounded to the nearest whole point, a half point rounding
    up, and is then limited to the goodwill_points_per_case_cap of the tier held on the posting date and
    after that to what remains of that tier's goodwill_points_annual_cap once the goodwill already posted
    in the current calendar year is deducted; when nothing remains, no goodwill entry is posted. The starting
    figure depends on the claim type: for a Damaged in Transit Claim, a Missing Item Claim or a Wrong
    Item Claim, twice the net points the affected order holds, no more than the per-case cap; for a Late
    Delivery Claim, the net points the affected order holds, no more than the per-case cap; for any other
    claim type, the per-case cap. A paid-delivery uplift applies: 40 percent when the member holds an
    Unlimited plan in status active or cancellation_pending and the affected order shipped by Expedited
    2-Day, Next Business Day or Same-Day Courier; 20 percent when the member holds an Unlimited plan in
    status active or cancellation_pending and the affected order shipped by any other delivery service;
    otherwise none. A repeat-failure uplift applies on the count of compensation entries booked on the
    member's delivery claims within the 12 months ending on the posting date, an entry dated exactly 12
    months before it not counting: 30 percent for three or more, 15 percent for exactly two, otherwise
    none. A membership-tenure uplift applies on the whole calendar months from the enrollment date to
    the posting date: 20 percent for 96 months or more, 10 percent for 48 to 95 months, otherwise none.
    The uplifts that apply are added together into one combined rate, and the starting figure is multiplied
    once by one plus that combined rate before the rounding, the per-case limit and the annual limit are
    applied in that order.
  prerequisite:
  - problem: loyalty_ext_returned_merchandise_reversal
    kind: value_input
    gate: order_net_points
    form: state
    policy_source: >-
      The goodwill grant is fixed only after the points ledger carries a reversal entry for every refunded
      return made against the order the claim concerns.
    condition: >-
      For every refunded return made against the approved claim's order (a return in status settled whose
      refund was issued), loyalty_ledger holds a loyalty_points_reversed row carrying that return_id and
      order_id.
    resolved_by: post_points_reversal_46de2c04
    effect: >-
      The reversal entry for the refunded return lowers order_net_points, the net points the affected
      order holds, and with it the starting figure of a claim on a spoiled line.
  cross_category:
  - category: claims
    as: branch
    reads:
    - delivery_claims.status
    - delivery_claims.variant_name
    - delivery_claims.order_id
    - claim_events.event_type
    note: >-
      The approved claim's type decides the grant-basis method; compensation entries in the last 12 months
      decide the repeat-failure uplift.
  - category: orders
    as: branch
    reads:
    - orders.variant_name
    note: >-
      The delivery service of the affected order, together with the Unlimited plan, decides the paid-delivery
      uplift.
  - category: pass
    as: branch
    reads:
    - pass_memberships.status
    note: >-
      An Unlimited plan in force, together with the affected order's service, decides the paid-delivery
      uplift.
  compute:
  - claim_order: CFIELD('claims', 'order_id', status='approved')
  - order_net_points: SUM('loyalty_ledger', 'points', order_id=claim_order)
  - case_cap: P('goodwill_points_per_case_cap')
  - claim_type: CFIELD('claims', 'variant_name', status='approved')
  - spoiled_line: >-
      claim_type == 'Damaged in Transit Claim' or claim_type == 'Missing Item Claim' or claim_type ==
      'Wrong Item Claim'
  - starting_grant: >-
      MN(K('spoiled_line_multiple') * MX(0, order_net_points), case_cap) if spoiled_line else (MN(MX(0,
      order_net_points), case_cap) if claim_type == 'Late Delivery Claim' else case_cap)
  - member_plan_status: CFIELD('pass', 'status')
  - member_plan_in_force: member_plan_status == 'active' or member_plan_status == 'cancellation_pending'
  - affected_service: CFIELD('orders', 'variant_name', order_id=claim_order)
  - fast_service: >-
      affected_service == 'Expedited 2-Day' or affected_service == 'Next Business Day' or affected_service
      == 'Same-Day Courier'
  - paid_delivery_uplift: >-
      K('fast_service_uplift') if (member_plan_in_force and fast_service) else (K('plan_uplift') if (member_plan_in_force
      and not fast_service) else 0)
  - failure_comp_12m: XCOUNT('claims', 'claim_events', within_months=12, event_type='claims_compensation_issued')
  - repeat_failure_uplift: >-
      K('three_failure_uplift') if failure_comp_12m >= 3 else (K('two_failure_uplift') if failure_comp_12m
      == 2 else 0)
  - tenure_months: MONTHS(F('enrolled_date'), NOW)
  - tenure_uplift: >-
      K('long_tenure_uplift') if tenure_months >= K('long_tenure_months') else (K('mid_tenure_uplift')
      if tenure_months >= K('mid_tenure_months') else 0)
  - combined_rate: 1 + paid_delivery_uplift + repeat_failure_uplift + tenure_uplift
  - rounded_grant: int(starting_grant * combined_rate + 0.5)
  - annual_cap: P('goodwill_points_annual_cap')
  - current_year_months: MONTHS('2000-01-01', NOW) % 12 + 1
  - goodwill_this_year: >-
      SUM('loyalty_ledger', 'points', within_months=current_year_months, date_field='posting_date', event_type='loyalty_bonus_posted',
      bonus_type='service_goodwill')
  - result: MX(0, MN(MN(rounded_grant, case_cap), annual_cap - goodwill_this_year))
  compute_basis:
    claim_order: >-
      The claim concerned is the member's delivery claim in status approved, and the affected order is
      the order that claim was opened on. A goodwill grant is made while the claim stands approved, as
      part of making the member whole on it; a claim already resolved has had its compensation booked
      and is closed to a further goodwill grant.
    order_net_points: >-
      The net points the affected order holds are the sum of the points on every points entry recorded
      for that order, its earning entries and its reversal entries together, never taken below zero.
    case_cap: The grant starts from the goodwill_points_per_case_cap of the tier held on the posting date.
    claim_type: The claim concerned is the member's delivery claim in status approved
    spoiled_line: >-
      for a Damaged in Transit Claim, a Missing Item Claim or a Wrong Item Claim, twice the net points
      the affected order holds, no more than the per-case cap
    starting_grant: >-
      The starting figure depends on the claim type: for a Damaged in Transit Claim, a Missing Item Claim
      or a Wrong Item Claim, twice the net points the affected order holds, no more than the per-case
      cap; for a Late Delivery Claim, the net points the affected order holds, no more than the per-case
      cap; for any other claim type, the per-case cap.
    member_plan_status: when the member holds an Unlimited plan in status active or cancellation_pending
    member_plan_in_force: when the member holds an Unlimited plan in status active or cancellation_pending
    affected_service: the affected order shipped by Expedited 2-Day, Next Business Day or Same-Day Courier
    fast_service: the affected order shipped by Expedited 2-Day, Next Business Day or Same-Day Courier
    paid_delivery_uplift: >-
      A paid-delivery uplift applies: 40 percent when the member holds an Unlimited plan in status active
      or cancellation_pending and the affected order shipped by Expedited 2-Day, Next Business Day or
      Same-Day Courier; 20 percent when the member holds an Unlimited plan in status active or cancellation_pending
      and the affected order shipped by any other delivery service; otherwise none.
    failure_comp_12m: >-
      the count of compensation entries booked on the member's delivery claims within the 12 months ending
      on the posting date, an entry dated exactly 12 months before it not counting
    repeat_failure_uplift: >-
      A repeat-failure uplift applies on the count of compensation entries booked on the member's delivery
      claims within the 12 months ending on the posting date, an entry dated exactly 12 months before
      it not counting: 30 percent for three or more, 15 percent for exactly two, otherwise none.
    tenure_months: the whole calendar months from the enrollment date to the posting date
    tenure_uplift: >-
      A membership-tenure uplift applies on the whole calendar months from the enrollment date to the
      posting date: 20 percent for 96 months or more, 10 percent for 48 to 95 months, otherwise none.
    combined_rate: >-
      The uplifts that apply are added together into one combined rate, and the starting figure is multiplied
      once by one plus that combined rate
    rounded_grant: The starting figure is rounded to the nearest whole point, a half point rounding up
    annual_cap: >-
      after that to what remains of that tier's goodwill_points_annual_cap once the goodwill already posted
      in the current calendar year is deducted
    current_year_months: the goodwill already posted in the current calendar year
    goodwill_this_year: >-
      once the goodwill already posted in the current calendar year is deducted; when nothing remains,
      no goodwill entry is posted.
    result: >-
      and is then limited to the goodwill_points_per_case_cap of the tier held on the posting date and
      after that to what remains of that tier's goodwill_points_annual_cap once the goodwill already posted
      in the current calendar year is deducted; when nothing remains, no goodwill entry is posted.
  factors:
  - id: claim_type_grant_basis
    effect: method
    decides: starting_grant
    bindings:
    - claim_type
    - spoiled_line
    - starting_grant
    ladder:
    - when: the approved claim is a Damaged in Transit Claim, a Missing Item Claim or a Wrong Item Claim
      method: start from twice the net points the affected order holds, no more than the per-case cap
    - when: the approved claim is a Late Delivery Claim
      method: start from the net points the affected order holds, no more than the per-case cap
    - when: otherwise
      method: start from the per-case cap
    baseline:
      starting_grant: case_cap
    evidence:
    - cross_category
    cross_difficulty: claims
  - id: paid_delivery_uplift
    effect: parameter
    decides: paid_delivery_uplift
    bindings:
    - member_plan_status
    - member_plan_in_force
    - affected_service
    - fast_service
    - paid_delivery_uplift
    ladder:
    - when: >-
        an Unlimited plan in status active or cancellation_pending and the affected order shipped by Expedited
        2-Day, Next Business Day or Same-Day Courier
      value: K('fast_service_uplift') = 40 percent
    - when: >-
        an Unlimited plan in status active or cancellation_pending and the affected order shipped by another
        delivery service
      value: K('plan_uplift') = 20 percent
    - when: otherwise
      value: no uplift
    baseline:
      paid_delivery_uplift: '0'
    evidence:
    - cross_category
    cross_difficulty: null
  - id: repeat_failure_uplift
    effect: parameter
    decides: repeat_failure_uplift
    bindings:
    - failure_comp_12m
    - repeat_failure_uplift
    ladder:
    - when: >-
        three or more compensation entries on the member's delivery claims within the 12 months ending
        on the posting date
      value: K('three_failure_uplift') = 30 percent
    - when: exactly two such compensation entries
      value: K('two_failure_uplift') = 15 percent
    - when: otherwise
      value: no uplift
    baseline:
      repeat_failure_uplift: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: claims
  - id: membership_tenure_uplift
    effect: parameter
    decides: tenure_uplift
    bindings:
    - tenure_months
    - tenure_uplift
    ladder:
    - when: 96 or more whole calendar months from the enrollment date to the posting date
      value: K('long_tenure_uplift') = 20 percent
    - when: 48 to 95 whole calendar months
      value: K('mid_tenure_uplift') = 10 percent
    - when: otherwise
      value: no uplift
    baseline:
      tenure_uplift: '0'
    evidence:
    - date
    cross_difficulty: null
  baseline:
    rule: >-
      The grant starts from the goodwill_points_per_case_cap of the tier held on the posting date. The
      starting figure is rounded to the nearest whole point, a half point rounding up, and is then limited
      to the goodwill_points_per_case_cap of the tier held on the posting date and after that to what
      remains of that tier's goodwill_points_annual_cap once the goodwill already posted in the current
      calendar year is deducted; when nothing remains, no goodwill entry is posted.
    params:
    - goodwill_points_per_case_cap
    - goodwill_points_annual_cap
  inputs:
    history:
    - table: loyalty_ledger
      aggregate: sum
      field: points
      filters:
        order_id: affected order
    - table: loyalty_ledger
      aggregate: sum
      field: points
      within_months: current calendar year
      filters:
        event_type: loyalty_bonus_posted
        bonus_type: service_goodwill
    - category: claims
      table: claim_events
      aggregate: count
      field: claim_event_id
      within_months: 12
      filters:
        event_type: claims_compensation_issued
    cross_category:
    - claims
    - orders
    - pass
- id: loyalty_ext_missing_points_adjustment
  base_policy_refs:
  - loyalty_evt_points_earning
  - loyalty_evt_missing_points
  overwrite:
  - base_policy: loyalty_evt_missing_points
    superseded_clause: >-
      The adjustment is computed exactly as the dispatch posting with the multiplier of the tier held
      on the handling date, on the order's qualifying spend net of any merchandise already refunded,
    replaced_by: >-
      The multiplier applied is the tier_points_multiplier of the tier held on the handling date plus
      every earning accelerator that applies, the accelerators being added to it;
  trigger: state_due
  subject:
  - loyalty_points_earned
  computes: points
  target_tool: post_missing_points_b5bbe1fa
  params:
    annual_plan_accel: 0.25
    monthly_plan_accel: 0.1
    launch_or_deposit_accel: 0.5
    other_reservation_accel: 0.25
    basket_spend_usd: 150.0
    busy_entries: 3
    busy_basket_accel: 0.2
    basket_accel: 0.1
    no_return_year_accel: 0.15
    no_return_half_year_accel: 0.05
    long_delay_days: 45
    short_delay_days: 14
    long_delay_pct: 0.1
    long_delay_min_points: 25
    short_delay_points: 15
  rule: >-
    This adjustment governs the points of reservation fulfilment orders, the orders the reservation system
    creates when a reserved unit is allocated; any other order without its earning entry is credited under
    the missing-points rule as it stands. A reservation fulfilment order of the member that was dispatched
    and carries no earning entry is owed its points, and the agent posts one missing_points_adjustment
    entry for it, subject to the request window, the wait after dispatch, the order status, the purchaser
    and the no-earning-entry conditions of the missing-points rule. The order concerned is the order recorded
    as the fulfilment order of the member's reservation in status fulfilled. The order's qualifying spend
    is the sum of its booked, cancelled and adjusted line amounts, less any gift-card lines, less the
    amount captured on it with Marlowe Rewards Notes, less the merchandise already credited on returns
    of that order, never below zero and kept to the cent. The points equal the qualifying spend times
    base_points_per_usd times the tier_points_multiplier of the tier held on the handling date, rounded
    to the nearest whole point with a half point rounding up. The multiplier applied is the tier_points_multiplier
    of the tier held on the handling date plus every earning accelerator that applies, the accelerators
    being added to it; the qualifying spend is multiplied by base_points_per_usd and by that multiplier
    and the product is rounded to the nearest whole point, a half point rounding up; the late credit is
    then added. An Unlimited accelerator applies: 0.25 when the member holds an annual Unlimited plan
    in status active or cancellation_pending, 0.10 when the member holds a monthly Unlimited plan in status
    active or cancellation_pending, otherwise none. A reservation accelerator applies: 0.50 when the order
    fulfilled a Launch Pre-Order or a Deposit Pre-Order, 0.25 when it fulfilled a Seasonal Pre-Order or
    a Made-to-Order Reservation, none when it fulfilled a Standard Back-Order or a Supplier Direct Back-Order.
    A basket accelerator applies: 0.20 when the qualifying spend is 150.00 or more and the member has
    at least 3 earning entries posted in the 6 months ending on the handling date (an entry dated exactly
    6 months before not counting), 0.10 when the qualifying spend is 150.00 or more and the member has
    fewer than 3 such entries, otherwise none. A low-return accelerator applies on the refunds issued
    on the member's returns: 0.15 when no refund was issued in the 12 months ending on the handling date,
    0.05 when none was issued in the 6 months ending on the handling date but at least one was issued
    in the 12 months, otherwise none. A late credit is added for the wait since dispatch, counted in whole
    calendar days from the order's dispatch date to the handling date: for 45 days or more, 10 percent
    of the rounded points, itself rounded to the nearest whole point with a half point rounding up and
    never less than 25 points; for 14 to 44 days, a flat 15 points; for fewer than 14 days, nothing. The
    entry records the qualifying spend, the tier held on the handling date and that tier's tier_points_multiplier,
    and is available on the later of the handling date and the dispatch date plus points_pending_days
    calendar days.
  prerequisite: []
  cross_category:
  - category: preorders
    as: branch
    reads:
    - reservations.fulfilment_order_id
    - reservations.status
    - reservations.variant_name
    note: The reservation an order fulfilled names the order and its type decides the reservation accelerator.
  - category: orders
    as: history
    reads:
    - order_lines.amount_usd
    - order_lines.product_class
    - order_payments.amount_usd
    - orders.shipped_date
    note: >-
      The order's lines and Rewards Note captures give the qualifying spend; its dispatch date drives
      the late-credit factor.
  - category: returns
    as: history
    reads:
    - return_settlements.merchandise_amount_usd
    - return_settlements.event_type
    - return_settlements.event_date
    note: >-
      Merchandise credited on returns of the order leaves the qualifying spend; refunds issued in the
      last 6 and 12 months decide the low-return accelerator.
  - category: pass
    as: branch
    reads:
    - pass_memberships.variant_name
    - pass_memberships.status
    note: The Unlimited plan held and its status decide the Unlimited accelerator.
  compute:
  - x_order: CFIELD('preorders', 'fulfilment_order_id', status='fulfilled')
  - lines_total: XSUM('orders', 'order_lines', 'amount_usd', order_id=x_order)
  - gift_lines: >-
      XSUM('orders', 'order_lines', 'amount_usd', order_id=x_order, product_class='egift_card') + XSUM('orders',
      'order_lines', 'amount_usd', order_id=x_order, product_class='plastic_gift_card')
  - note_paid: >-
      XSUM('orders', 'order_payments', 'amount_usd', order_id=x_order, event_type='orders_payment_captured',
      tender_type='rewards_note')
  - refunded_merch: >-
      XSUM('returns', 'return_settlements', 'merchandise_amount_usd', order_id=x_order, event_type='returns_refund_credited')
  - qualifying: RND(MX(0, lines_total - gift_lines - note_paid - refunded_merch), 2)
  - tier_mult: P('tier_points_multiplier')
  - plan_held: CFIELD('pass', 'variant_name')
  - plan_status: CFIELD('pass', 'status')
  - plan_in_force: plan_status == 'active' or plan_status == 'cancellation_pending'
  - plan_annual: >-
      plan_held == 'Unlimited Student Annual' or plan_held == 'Unlimited Standard Annual' or plan_held
      == 'Unlimited Express Annual' or plan_held == 'Unlimited Next-Day Annual'
  - plan_accel: >-
      K('annual_plan_accel') if (plan_in_force and plan_annual) else (K('monthly_plan_accel') if (plan_in_force
      and not plan_annual) else 0)
  - reservation_type: CFIELD('preorders', 'variant_name', fulfilment_order_id=x_order)
  - reservation_accel: >-
      K('launch_or_deposit_accel') if (reservation_type == 'Launch Pre-Order' or reservation_type == 'Deposit
      Pre-Order') else (K('other_reservation_accel') if (reservation_type == 'Seasonal Pre-Order' or reservation_type
      == 'Made-to-Order Reservation') else 0)
  - earn_entries_6m: >-
      COUNT('loyalty_ledger', within_months=6, date_field='posting_date', event_type='loyalty_points_earned')
  - basket_accel: >-
      K('busy_basket_accel') if (qualifying >= K('basket_spend_usd') and earn_entries_6m >= K('busy_entries'))
      else (K('basket_accel') if (qualifying >= K('basket_spend_usd') and earn_entries_6m < K('busy_entries'))
      else 0)
  - refunds_12m: >-
      XCOUNT('returns', 'return_settlements', within_months=12, date_field='event_date', event_type='returns_refund_issued')
  - refunds_6m: >-
      XCOUNT('returns', 'return_settlements', within_months=6, date_field='event_date', event_type='returns_refund_issued')
  - low_return_accel: >-
      K('no_return_year_accel') if refunds_12m == 0 else (K('no_return_half_year_accel') if (refunds_6m
      == 0 and refunds_12m > 0) else 0)
  - dispatch_date: CFIELD('orders', 'shipped_date', order_id=x_order)
  - days_since_dispatch: DAYS(dispatch_date, NOW)
  - multiplier: tier_mult + plan_accel + reservation_accel + basket_accel + low_return_accel
  - rounded_points: int(qualifying * P('base_points_per_usd') * multiplier + 0.5)
  - late_credit: >-
      MX(int(rounded_points * K('long_delay_pct') + 0.5), K('long_delay_min_points')) if days_since_dispatch
      >= K('long_delay_days') else (K('short_delay_points') if days_since_dispatch >= K('short_delay_days')
      else 0)
  - result: rounded_points + late_credit
  compute_basis:
    x_order: >-
      The order concerned is the order recorded as the fulfilment order of the member's reservation in
      status fulfilled.
    lines_total: The order's qualifying spend is the sum of its booked, cancelled and adjusted line amounts
    gift_lines: less any gift-card lines
    note_paid: less the amount captured on it with Marlowe Rewards Notes
    refunded_merch: less the merchandise already credited on returns of that order
    qualifying: >-
      The order's qualifying spend is the sum of its booked, cancelled and adjusted line amounts, less
      any gift-card lines, less the amount captured on it with Marlowe Rewards Notes, less the merchandise
      already credited on returns of that order, never below zero and kept to the cent.
    tier_mult: the tier_points_multiplier of the tier held on the handling date
    plan_held: An Unlimited accelerator applies
    plan_status: in status active or cancellation_pending
    plan_in_force: in status active or cancellation_pending
    plan_annual: >-
      0.25 when the member holds an annual Unlimited plan in status active or cancellation_pending, 0.10
      when the member holds a monthly Unlimited plan in status active or cancellation_pending
    plan_accel: >-
      An Unlimited accelerator applies: 0.25 when the member holds an annual Unlimited plan in status
      active or cancellation_pending, 0.10 when the member holds a monthly Unlimited plan in status active
      or cancellation_pending, otherwise none.
    reservation_type: when the order fulfilled a Launch Pre-Order or a Deposit Pre-Order
    reservation_accel: >-
      A reservation accelerator applies: 0.50 when the order fulfilled a Launch Pre-Order or a Deposit
      Pre-Order, 0.25 when it fulfilled a Seasonal Pre-Order or a Made-to-Order Reservation, none when
      it fulfilled a Standard Back-Order or a Supplier Direct Back-Order.
    earn_entries_6m: >-
      at least 3 earning entries posted in the 6 months ending on the handling date (an entry dated exactly
      6 months before not counting)
    basket_accel: >-
      A basket accelerator applies: 0.20 when the qualifying spend is 150.00 or more and the member has
      at least 3 earning entries posted in the 6 months ending on the handling date (an entry dated exactly
      6 months before not counting), 0.10 when the qualifying spend is 150.00 or more and the member has
      fewer than 3 such entries, otherwise none.
    refunds_12m: 0.15 when no refund was issued in the 12 months ending on the handling date
    refunds_6m: >-
      0.05 when none was issued in the 6 months ending on the handling date but at least one was issued
      in the 12 months
    low_return_accel: >-
      A low-return accelerator applies on the refunds issued on the member's returns: 0.15 when no refund
      was issued in the 12 months ending on the handling date, 0.05 when none was issued in the 6 months
      ending on the handling date but at least one was issued in the 12 months, otherwise none.
    dispatch_date: counted in whole calendar days from the order's dispatch date to the handling date
    days_since_dispatch: counted in whole calendar days from the order's dispatch date to the handling
      date
    multiplier: >-
      The multiplier applied is the tier_points_multiplier of the tier held on the handling date plus
      every earning accelerator that applies, the accelerators being added to it;
    result: the late credit is then added.
    rounded_points: >-
      the qualifying spend is multiplied by base_points_per_usd and by that multiplier and the product
      is rounded to the nearest whole point, a half point rounding up
    late_credit: >-
      A late credit is added for the wait since dispatch, counted in whole calendar days from the order's
      dispatch date to the handling date: for 45 days or more, 10 percent of the rounded points, itself
      rounded to the nearest whole point with a half point rounding up and never less than 25 points;
      for 14 to 44 days, a flat 15 points; for fewer than 14 days, nothing.
  factors:
  - id: unlimited_earning_accelerator
    effect: parameter
    decides: plan_accel
    bindings:
    - plan_held
    - plan_status
    - plan_in_force
    - plan_annual
    - plan_accel
    ladder:
    - when: an Unlimited plan in status active or cancellation_pending and that plan is annual
      value: K('annual_plan_accel') = 0.25
    - when: an Unlimited plan in status active or cancellation_pending and that plan is monthly
      value: K('monthly_plan_accel') = 0.10
    - when: otherwise
      value: '0'
    baseline:
      plan_accel: '0'
    evidence:
    - cross_category
    cross_difficulty: null
  - id: reservation_fulfilment_accelerator
    effect: parameter
    decides: reservation_accel
    bindings:
    - reservation_type
    - reservation_accel
    ladder:
    - when: the order fulfilled a Launch Pre-Order or a Deposit Pre-Order
      value: K('launch_or_deposit_accel') = 0.50
    - when: the order fulfilled a Seasonal Pre-Order or a Made-to-Order Reservation
      value: K('other_reservation_accel') = 0.25
    - when: otherwise (the order fulfilled a Standard Back-Order or a Supplier Direct Back-Order)
      value: '0'
    baseline:
      reservation_accel: '0'
    evidence:
    - cross_category
    cross_difficulty: preorders
  - id: basket_accelerator
    effect: parameter
    decides: basket_accel
    bindings:
    - earn_entries_6m
    - basket_accel
    ladder:
    - when: >-
        qualifying spend of 150.00 or more and at least 3 earning entries in the 6 months ending on the
        handling date
      value: K('busy_basket_accel') = 0.20
    - when: qualifying spend of 150.00 or more and fewer than 3 such earning entries
      value: K('basket_accel') = 0.10
    - when: otherwise
      value: '0'
    baseline:
      basket_accel: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: low_return_accelerator
    effect: parameter
    decides: low_return_accel
    bindings:
    - refunds_12m
    - refunds_6m
    - low_return_accel
    ladder:
    - when: no refund issued on the member's returns in the 12 months ending on the handling date
      value: K('no_return_year_accel') = 0.15
    - when: no refund in the 6 months ending on the handling date but at least one in the 12 months
      value: K('no_return_half_year_accel') = 0.05
    - when: otherwise
      value: '0'
    baseline:
      low_return_accel: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: returns
  - id: late_credit
    effect: method
    decides: late_credit
    bindings:
    - dispatch_date
    - days_since_dispatch
    - late_credit
    ladder:
    - when: 45 or more whole calendar days from the order's dispatch date to the handling date
      method: 'a percentage credit: 10 percent of the rounded points, rounded half up, with a floor of
        25 points'
    - when: 14 to 44 whole calendar days
      method: a flat credit of 15 points, whatever the size of the order
    - when: otherwise
      method: no late credit
    baseline:
      late_credit: '0'
    evidence:
    - date
    - cross_category
    cross_difficulty: null
  baseline:
    rule: >-
      The order's qualifying spend is the sum of its booked, cancelled and adjusted line amounts, less
      any gift-card lines, less the amount captured on it with Marlowe Rewards Notes, less the merchandise
      already credited on returns of that order, never below zero and kept to the cent. The points equal
      the qualifying spend times base_points_per_usd times the tier_points_multiplier of the tier held
      on the handling date, rounded to the nearest whole point with a half point rounding up.
    params:
    - base_points_per_usd
    - tier_points_multiplier
  inputs:
    history:
    - table: loyalty_ledger
      aggregate: count
      field: loyalty_entry_id
      within_months: 6
      filters:
        event_type: loyalty_points_earned
    - category: orders
      table: order_lines
      aggregate: sum
      field: amount_usd
      filters:
        order_id: order concerned
    - category: orders
      table: order_payments
      aggregate: sum
      field: amount_usd
      filters:
        tender_type: rewards_note
    - category: returns
      table: return_settlements
      aggregate: sum
      field: merchandise_amount_usd
      filters:
        event_type: returns_refund_credited
    - category: returns
      table: return_settlements
      aggregate: count
      field: settlement_id
      within_months: 12
      filters:
        event_type: returns_refund_issued
    - category: returns
      table: return_settlements
      aggregate: count
      field: settlement_id
      within_months: 6
      filters:
        event_type: returns_refund_issued
    cross_category:
    - preorders
    - orders
    - returns
    - pass
- id: loyalty_ext_tier_upgrade
  base_policy_refs:
  - loyalty_tier_qualification
  overwrite:
  - base_policy: loyalty_tier_qualification
    superseded_clause: >-
      A membership is upgraded on the posting date on which loyalty_msr_qualifying_spend_ytd first reaches
      the `tier_qualifying_spend_usd` of a higher tier;
    replaced_by: >-
      A membership is upgraded when its tier-qualifying spend reaches the tier_qualifying_spend_usd of
      a tier above the tier held; it moves straight to the highest tier whose threshold that spend meets,
      and a tier is never lowered by this rule.
  - base_policy: loyalty_tier_qualification
    superseded_clause: >-
      tier_start_date becomes that posting date and tier_valid_through becomes 31 December of the calendar
      year that follows the qualifying year (`tier_validity_years_after_qualifying_year`).
    replaced_by: >-
      the new tier takes effect on the date it is written and is valid through 31 December of the calendar
      year that follows the year in which the tier-qualifying spend reached its threshold,
  trigger: state_due
  subject:
  - loyalty_tier_changed
  computes: variant_name
  target_tool: write_tier_upgrade_189dabab
  params:
    silver_threshold_usd: 350.0
    gold_threshold_usd: 750.0
    platinum_threshold_usd: 1500.0
    icon_threshold_usd: 3000.0
    atelier_threshold_usd: 6000.0
    annual_status_rate: 0.1
    monthly_status_rate: 0.05
    reserved_deposit_share: 0.5
    mixed_refund_deduct_share: 0.5
  rule: >-
    A membership is upgraded when its tier-qualifying spend reaches the tier_qualifying_spend_usd of a
    tier above the tier held; it moves straight to the highest tier whose threshold that spend meets,
    and a tier is never lowered by this rule. The agent writes an upgrade that is due and was not written;
    the new tier takes effect on the date it is written and is valid through 31 December of the calendar
    year that follows the year in which the tier-qualifying spend reached its threshold, and it is written
    only while the membership is in status active. The tier the membership takes is worked out only after
    every dispatched order placed under the member's profile within the missing-points request window
    carries its earning entry on the points ledger. The tier-qualifying spend is the qualifying spend
    on the membership's earning entries posted in the current calendar year less the reversed spend on
    its reversal entries posted in the current calendar year. The spend window follows the whole calendar
    months from the enrollment date to the handling date: under 12 months, every entry since enrollment;
    12 to 23 months, the 12 months ending on the handling date (an entry dated exactly 12 months before
    not counting); 24 months or more, the current calendar year. The reversed spend in the window is deducted
    according to how the refunds issued on the member's returns in the 12 months ending on the handling
    date were paid: when every such refund was paid as a new Return Store Credit, none of it is deducted;
    when some but not all were, half of it is deducted; otherwise all of it is deducted. A deposit credit
    is added for deposits captured in the 12 months ending on the handling date on the member's Deposit
    Pre-Order: in full when that reservation is in production or allocated, half when it is reserved or
    awaiting consent, otherwise nothing. A status credit applies to the window spend after the deduction:
    10 percent when the member holds an annual Unlimited plan in status active or cancellation_pending,
    5 percent when the member holds a monthly Unlimited plan in status active or cancellation_pending,
    otherwise none. The window spend after the deduction is multiplied once by one plus the status credit
    rate, the deposit credit is then added, and the total is kept to the cent before it is compared with
    the thresholds.
  prerequisite:
  - problem: loyalty_ext_missing_points_adjustment
    kind: value_input
    gate: window_qual
    form: state
    policy_source: >-
      The tier the membership takes is worked out only after every dispatched order placed under the member's
      profile within the missing-points request window carries its earning entry on the points ledger.
    condition: >-
      Every order in status shipped, delivered or closed placed under the member's customer_id within
      missing_points_request_window_days of the handling date has a loyalty_points_earned row with its
      order_id.
    resolved_by: post_missing_points_b5bbe1fa
    effect: >-
      The missing earning entry adds the order's qualifying spend to window_qual, raising the tier-qualifying
      spend.
  cross_category:
  - category: returns
    as: history
    reads:
    - return_settlements.amount_usd
    - return_settlements.tender_type
    - return_settlements.event_type
    note: How the refunds of the last 12 months were paid decides the reversal-deduction share.
  - category: preorders
    as: history
    reads:
    - reservations.status
    - reservations.variant_name
    - reservation_events.amount_usd
    note: Deposits captured on the Deposit Pre-Order and its status decide the deposit credit.
  - category: pass
    as: branch
    reads:
    - pass_memberships.variant_name
    - pass_memberships.status
    note: The Unlimited plan and its status decide the status credit.
  compute:
  - current_year_months: MONTHS('2000-01-01', NOW) % 12 + 1
  - membership_months: MONTHS(F('enrolled_date'), NOW)
  - ytd_qual: >-
      SUM('loyalty_ledger', 'qualifying_spend_usd', within_months=current_year_months, date_field='posting_date',
      event_type='loyalty_points_earned')
  - ytd_rev: >-
      SUM('loyalty_ledger', 'reversed_spend_usd', within_months=current_year_months, date_field='posting_date',
      event_type='loyalty_points_reversed')
  - trailing_qual: >-
      SUM('loyalty_ledger', 'qualifying_spend_usd', within_months=12, date_field='posting_date', event_type='loyalty_points_earned')
  - trailing_rev: >-
      SUM('loyalty_ledger', 'reversed_spend_usd', within_months=12, date_field='posting_date', event_type='loyalty_points_reversed')
  - lifetime_qual: SUM('loyalty_ledger', 'qualifying_spend_usd', event_type='loyalty_points_earned')
  - lifetime_rev: SUM('loyalty_ledger', 'reversed_spend_usd', event_type='loyalty_points_reversed')
  - window_qual: lifetime_qual if membership_months < 12 else (trailing_qual if membership_months < 24
      else ytd_qual)
  - window_rev: lifetime_rev if membership_months < 12 else (trailing_rev if membership_months < 24 else
      ytd_rev)
  - refunds_all_12m: >-
      XSUM('returns', 'return_settlements', 'amount_usd', within_months=12, date_field='event_date', event_type='returns_refund_issued')
  - refunds_rsc_12m: >-
      XSUM('returns', 'return_settlements', 'amount_usd', within_months=12, date_field='event_date', event_type='returns_refund_issued',
      tender_type='return_store_credit_new')
  - deduct_share: >-
      0.0 if (refunds_all_12m < 0 and refunds_rsc_12m == refunds_all_12m) else (K('mixed_refund_deduct_share')
      if (refunds_rsc_12m < 0 and refunds_rsc_12m != refunds_all_12m) else 1.0)
  - net_window_spend: window_qual - deduct_share * window_rev
  - deposit_status: CFIELD('preorders', 'status', variant_name='Deposit Pre-Order')
  - deposit_reservation: CFIELD('preorders', 'reservation_id', variant_name='Deposit Pre-Order')
  - deposits_12m: >-
      XSUM('preorders', 'reservation_events', 'amount_usd', within_months=12, date_field='event_date',
      event_type='preorders_deposit_captured', reservation_id=deposit_reservation)
  - deposit_share: >-
      1.0 if (deposit_status == 'in_production' or deposit_status == 'allocated') else (K('reserved_deposit_share')
      if (deposit_status == 'reserved' or deposit_status == 'awaiting_consent') else 0.0)
  - deposit_credit: deposits_12m * deposit_share
  - status_plan: CFIELD('pass', 'variant_name')
  - status_plan_state: CFIELD('pass', 'status')
  - status_plan_in_force: status_plan_state == 'active' or status_plan_state == 'cancellation_pending'
  - status_plan_annual: >-
      status_plan == 'Unlimited Student Annual' or status_plan == 'Unlimited Standard Annual' or status_plan
      == 'Unlimited Express Annual' or status_plan == 'Unlimited Next-Day Annual'
  - status_rate: >-
      K('annual_status_rate') if (status_plan_in_force and status_plan_annual) else (K('monthly_status_rate')
      if (status_plan_in_force and not status_plan_annual) else 0)
  - tier_spend: RND(net_window_spend * (1 + status_rate) + deposit_credit, 2)
  - reached_rank: >-
      5 if tier_spend >= K('atelier_threshold_usd') else (4 if tier_spend >= K('icon_threshold_usd') else
      (3 if tier_spend >= K('platinum_threshold_usd') else (2 if tier_spend >= K('gold_threshold_usd')
      else (1 if tier_spend >= K('silver_threshold_usd') else 0))))
  - held_rank: >-
      5 if F('variant_name') == 'Marlowe Rewards Atelier' else (4 if F('variant_name') == 'Marlowe Rewards
      Icon' else (3 if F('variant_name') == 'Marlowe Rewards Platinum' else (2 if F('variant_name') ==
      'Marlowe Rewards Gold' else (1 if F('variant_name') == 'Marlowe Rewards Silver' else 0))))
  - new_rank: MX(reached_rank, held_rank)
  - result: >-
      'Marlowe Rewards Atelier' if new_rank == 5 else ('Marlowe Rewards Icon' if new_rank == 4 else ('Marlowe
      Rewards Platinum' if new_rank == 3 else ('Marlowe Rewards Gold' if new_rank == 2 else ('Marlowe
      Rewards Silver' if new_rank == 1 else 'Marlowe Rewards Member'))))
  compute_basis:
    current_year_months: the current calendar year
    membership_months: The spend window follows the whole calendar months from the enrollment date to
      the handling date
    ytd_qual: >-
      The tier-qualifying spend is the qualifying spend on the membership's earning entries posted in
      the current calendar year less the reversed spend on its reversal entries posted in the current
      calendar year.
    ytd_rev: >-
      The tier-qualifying spend is the qualifying spend on the membership's earning entries posted in
      the current calendar year less the reversed spend on its reversal entries posted in the current
      calendar year.
    trailing_qual: >-
      12 to 23 months, the 12 months ending on the handling date (an entry dated exactly 12 months before
      not counting)
    trailing_rev: >-
      12 to 23 months, the 12 months ending on the handling date (an entry dated exactly 12 months before
      not counting)
    lifetime_qual: under 12 months, every entry since enrollment
    lifetime_rev: under 12 months, every entry since enrollment
    window_qual: >-
      The spend window follows the whole calendar months from the enrollment date to the handling date:
      under 12 months, every entry since enrollment; 12 to 23 months, the 12 months ending on the handling
      date (an entry dated exactly 12 months before not counting); 24 months or more, the current calendar
      year.
    window_rev: >-
      The spend window follows the whole calendar months from the enrollment date to the handling date:
      under 12 months, every entry since enrollment; 12 to 23 months, the 12 months ending on the handling
      date (an entry dated exactly 12 months before not counting); 24 months or more, the current calendar
      year.
    refunds_all_12m: >-
      how the refunds issued on the member's returns in the 12 months ending on the handling date were
      paid
    refunds_rsc_12m: when every such refund was paid as a new Return Store Credit, none of it is deducted
    deduct_share: >-
      The reversed spend in the window is deducted according to how the refunds issued on the member's
      returns in the 12 months ending on the handling date were paid: when every such refund was paid
      as a new Return Store Credit, none of it is deducted; when some but not all were, half of it is
      deducted; otherwise all of it is deducted.
    net_window_spend: A status credit applies to the window spend after the deduction
    deposit_status: >-
      in full when that reservation is in production or allocated, half when it is reserved or awaiting
      consent, otherwise nothing
    deposits_12m: >-
      A deposit credit is added for deposits captured in the 12 months ending on the handling date on
      the member's Deposit Pre-Order
    deposit_share: >-
      A deposit credit is added for deposits captured in the 12 months ending on the handling date on
      the member's Deposit Pre-Order: in full when that reservation is in production or allocated, half
      when it is reserved or awaiting consent, otherwise nothing.
    deposit_credit: >-
      A deposit credit is added for deposits captured in the 12 months ending on the handling date on
      the member's Deposit Pre-Order
    status_plan: when the member holds an annual Unlimited plan in status active or cancellation_pending
    status_plan_state: in status active or cancellation_pending
    status_plan_in_force: in status active or cancellation_pending
    status_plan_annual: >-
      10 percent when the member holds an annual Unlimited plan in status active or cancellation_pending,
      5 percent when the member holds a monthly Unlimited plan in status active or cancellation_pending
    status_rate: >-
      A status credit applies to the window spend after the deduction: 10 percent when the member holds
      an annual Unlimited plan in status active or cancellation_pending, 5 percent when the member holds
      a monthly Unlimited plan in status active or cancellation_pending, otherwise none.
    tier_spend: >-
      The window spend after the deduction is multiplied once by one plus the status credit rate, the
      deposit credit is then added, and the total is kept to the cent before it is compared with the thresholds.
    reached_rank: it moves straight to the highest tier whose threshold that spend meets
    held_rank: a tier above the tier held
    new_rank: and a tier is never lowered by this rule
    result: >-
      A membership is upgraded when its tier-qualifying spend reaches the tier_qualifying_spend_usd of
      a tier above the tier held; it moves straight to the highest tier whose threshold that spend meets,
      and a tier is never lowered by this rule.
    deposit_reservation: on the member's Deposit Pre-Order
  factors:
  - id: membership_age_spend_window
    effect: method
    decides: window_qual
    bindings:
    - membership_months
    - trailing_qual
    - trailing_rev
    - lifetime_qual
    - lifetime_rev
    - window_qual
    - window_rev
    ladder:
    - when: under 12 whole calendar months from the enrollment date
      method: count every earning and reversal entry since enrollment
    - when: 12 to 23 whole calendar months
      method: count the entries of the 12 months ending on the handling date
    - when: otherwise
      method: count the entries of the current calendar year
    baseline:
      window_qual: ytd_qual
      window_rev: ytd_rev
    evidence:
    - date
    - history
    cross_difficulty: null
  - id: store_credit_reversal_relief
    effect: parameter
    decides: deduct_share
    bindings:
    - refunds_all_12m
    - refunds_rsc_12m
    - deduct_share
    ladder:
    - when: every refund issued on the member's returns in the 12 months was paid as a new Return Store
        Credit
      value: 0 percent of the reversed spend deducted
    - when: some but not all of those refunds were paid as a new Return Store Credit
      value: K('mixed_refund_deduct_share') = 50 percent deducted
    - when: otherwise
      value: 100 percent deducted
    baseline:
      deduct_share: '1.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: returns
  - id: deposit_status_credit
    effect: parameter
    decides: deposit_share
    bindings:
    - deposit_reservation
    - deposit_status
    - deposits_12m
    - deposit_share
    - deposit_credit
    ladder:
    - when: the member's Deposit Pre-Order is in production or allocated
      value: the deposits captured in the 12 months count in full
    - when: the member's Deposit Pre-Order is reserved or awaiting consent
      value: K('reserved_deposit_share') = half of those deposits
    - when: otherwise
      value: no deposit credit
    baseline:
      deposit_share: '0.0'
    evidence:
    - cross_category
    - history
    cross_difficulty: preorders
  - id: unlimited_status_credit
    effect: parameter
    decides: status_rate
    bindings:
    - status_plan
    - status_plan_state
    - status_plan_in_force
    - status_plan_annual
    - status_rate
    ladder:
    - when: an Unlimited plan in status active or cancellation_pending and that plan is annual
      value: K('annual_status_rate') = 10 percent
    - when: an Unlimited plan in status active or cancellation_pending and that plan is monthly
      value: K('monthly_status_rate') = 5 percent
    - when: otherwise
      value: none
    baseline:
      status_rate: '0'
    evidence:
    - cross_category
    cross_difficulty: null
  baseline:
    rule: >-
      A membership is upgraded when its tier-qualifying spend reaches the tier_qualifying_spend_usd of
      a tier above the tier held; it moves straight to the highest tier whose threshold that spend meets,
      and a tier is never lowered by this rule. The tier-qualifying spend is the qualifying spend on the
      membership's earning entries posted in the current calendar year less the reversed spend on its
      reversal entries posted in the current calendar year.
    params:
    - tier_qualifying_spend_usd
  inputs:
    history:
    - table: loyalty_ledger
      aggregate: sum
      field: qualifying_spend_usd
      within_months: current calendar year / 12 / lifetime
      filters:
        event_type: loyalty_points_earned
    - table: loyalty_ledger
      aggregate: sum
      field: reversed_spend_usd
      within_months: current calendar year / 12 / lifetime
      filters:
        event_type: loyalty_points_reversed
    - category: returns
      table: return_settlements
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        event_type: returns_refund_issued
    - category: preorders
      table: reservation_events
      aggregate: sum
      field: amount_usd
      within_months: 12
      filters:
        event_type: preorders_deposit_captured
    cross_category:
    - returns
    - preorders
    - pass
- id: loyalty_ext_birthday_make_good
  base_policy_refs:
  - loyalty_evt_bonus_points
  - loyalty_evt_goodwill_points
  overwrite:
  - base_policy: loyalty_evt_bonus_points
    superseded_clause: >-
      The birthday bonus of the `birthday_bonus_points` of the tier held on the posting date posts on
      day `birthday_bonus_posting_day` of the birth month recorded in the customer's date of birth; a
      tier whose value is 0 receives no birthday row.
    replaced_by: >-
      The shopping boost is applied to the tier amount first and the gifts are then added; when the tier
      amount is 0 nothing is posted and no gift is added.
  - base_policy: loyalty_evt_bonus_points
    superseded_clause: Each bonus type posts at most once per bonus reference for a customer.
    replaced_by: >-
      A birthday make-good is claimed at most once for each calendar year, the year being its bonus reference,
      and never for a year whose birthday bonus already stands on the ledger.
  - base_policy: loyalty_evt_goodwill_points
    superseded_clause: >-
      A goodwill grant requires a delivery claim on record for the referenced order whose status is approved
      or resolved; a late, lost or damaged parcel the customer only describes, without such a claim, is
      not a documented failure.
    replaced_by: >-
      A birthday make-good is not a goodwill grant: it needs no delivery claim, and its bonus reference
      is the year, not a claim number.
  - base_policy: loyalty_evt_goodwill_points
    superseded_clause: The bonus_reference is the claim's claim_id, and only one goodwill grant is posted
      per claim.
    replaced_by: >-
      A birthday make-good is not a goodwill grant: it needs no delivery claim, and its bonus reference
      is the year, not a claim number.
  trigger: on_request
  subject:
  - loyalty_bonus_posted
  computes: birthday_points
  target_tool: claim_birthday_bonus_8dc2d134
  params:
    big_month_spend_usd: 150.0
    big_month_factor: 2.0
    long_tenure_months: 60
    mid_tenure_months: 12
    long_tenure_gift: 150
    mid_tenure_gift: 50
    annual_plan_gift: 100
    monthly_plan_gift: 50
    many_lines: 8
    some_lines: 4
    many_lines_gift: 100
    some_lines_gift: 50
  rule: >-
    A birthday bonus that did not post on its posting day because the tier then on record carried no birthday
    points can be made good within the birth month: the member claims it in person, confirming the date
    of birth on the profile, and the claim posts it as a birthday bonus available at once, only while
    the membership is in status active and only when the membership was enrolled at least birthday_bonus_min_tenure_days
    calendar days before the claim. The birthday bonus is not posted until the membership carries the
    tier its tier-qualifying spend has reached under the tier rules. A birthday make-good is claimed at
    most once for each calendar year, the year being its bonus reference, and never for a year whose birthday
    bonus already stands on the ledger. A birthday make-good is not a goodwill grant: it needs no delivery
    claim, and its bonus reference is the year, not a claim number. The birthday bonus is the birthday_bonus_points
    of the tier held on the claim date; a tier whose value is 0 receives no birthday bonus. A birthday
    shopping boost applies according to the merchandise booked on the member's orders placed within the
    month ending on the claim date (an order dated on the same day of the previous month not counting):
    when it comes to 150.00 or more, the tier amount is doubled; when it is above 0 but under 150.00,
    that merchandise is credited again as birthday points, at base_points_per_usd times the tier_points_multiplier
    of the tier held on the claim date, rounded to the nearest whole point with a half point rounding
    up, and added to the tier amount; when nothing was booked, the tier amount stands. A membership-tenure
    gift is added: 150 points for 60 or more whole calendar months from the enrollment date to the claim
    date, 50 points for 12 to 59 months, otherwise none. An Unlimited gift is added: 100 points when the
    member holds an annual Unlimited plan in status active or cancellation_pending, 50 points when the
    member holds a monthly Unlimited plan in status active or cancellation_pending, otherwise none. An
    items-bought gift is added on the order lines booked on the member's orders in the 12 months ending
    on the claim date (a line dated exactly 12 months before not counting): 100 points for 8 or more lines,
    50 points for 4 to 7 lines, otherwise none. The shopping boost is applied to the tier amount first
    and the gifts are then added; when the tier amount is 0 nothing is posted and no gift is added.
  prerequisite:
  - problem: loyalty_ext_tier_upgrade
    kind: value_input
    gate: tier_amount
    form: state
    policy_source: >-
      The birthday bonus is not posted until the membership carries the tier its tier-qualifying spend
      has reached under the tier rules.
    condition: >-
      loyalty_memberships.variant_name equals the tier the tier-upgrade rule yields when that rule is
      worked out on a ledger that already carries every earning entry its own prerequisite requires.
    resolved_by: write_tier_upgrade_189dabab
    effect: >-
      Writing the due upgrade changes the tier held on the claim date and with it tier_amount, the birthday_bonus_points
      the make-good starts from.
  cross_category:
  - category: orders
    as: history
    reads:
    - order_lines.amount_usd
    - order_lines.event_type
    - order_lines.event_date
    note: >-
      Merchandise booked in the birth month decides the shopping factor; lines booked in the last 12 months
      decide the items-bought gift.
  - category: pass
    as: branch
    reads:
    - pass_memberships.variant_name
    - pass_memberships.status
    note: The Unlimited plan and its status decide the Unlimited gift.
  compute:
  - tier_amount: P('birthday_bonus_points')
  - month_merch: >-
      XSUM('orders', 'order_lines', 'amount_usd', within_months=1, date_field='event_date', event_type='orders_line_booked')
  - boosted_amount: >-
      int(tier_amount * K('big_month_factor')) if month_merch >= K('big_month_spend_usd') else ((tier_amount
      + int(month_merch * P('base_points_per_usd') * P('tier_points_multiplier') + 0.5)) if month_merch
      > 0 else tier_amount)
  - member_months: MONTHS(F('enrolled_date'), NOW)
  - tenure_gift: >-
      K('long_tenure_gift') if member_months >= K('long_tenure_months') else (K('mid_tenure_gift') if
      member_months >= K('mid_tenure_months') else 0)
  - gift_plan: CFIELD('pass', 'variant_name')
  - gift_plan_state: CFIELD('pass', 'status')
  - gift_plan_in_force: gift_plan_state == 'active' or gift_plan_state == 'cancellation_pending'
  - gift_plan_annual: >-
      gift_plan == 'Unlimited Student Annual' or gift_plan == 'Unlimited Standard Annual' or gift_plan
      == 'Unlimited Express Annual' or gift_plan == 'Unlimited Next-Day Annual'
  - plan_gift: >-
      K('annual_plan_gift') if (gift_plan_in_force and gift_plan_annual) else (K('monthly_plan_gift')
      if (gift_plan_in_force and not gift_plan_annual) else 0)
  - lines_12m: >-
      XCOUNT('orders', 'order_lines', within_months=12, date_field='event_date', event_type='orders_line_booked')
  - items_gift: >-
      K('many_lines_gift') if lines_12m >= K('many_lines') else (K('some_lines_gift') if lines_12m >=
      K('some_lines') else 0)
  - result: 0 if tier_amount == 0 else boosted_amount + tenure_gift + plan_gift + items_gift
  compute_basis:
    tier_amount: >-
      The birthday bonus is the birthday_bonus_points of the tier held on the claim date; a tier whose
      value is 0 receives no birthday bonus.
    month_merch: >-
      the merchandise booked on the member's orders placed within the month ending on the claim date (an
      order dated on the same day of the previous month not counting)
    member_months: for 60 or more whole calendar months from the enrollment date to the claim date
    tenure_gift: >-
      A membership-tenure gift is added: 150 points for 60 or more whole calendar months from the enrollment
      date to the claim date, 50 points for 12 to 59 months, otherwise none.
    gift_plan: 100 points when the member holds an annual Unlimited plan in status active or cancellation_pending
    gift_plan_state: in status active or cancellation_pending
    gift_plan_in_force: in status active or cancellation_pending
    gift_plan_annual: >-
      100 points when the member holds an annual Unlimited plan in status active or cancellation_pending,
      50 points when the member holds a monthly Unlimited plan in status active or cancellation_pending
    plan_gift: >-
      An Unlimited gift is added: 100 points when the member holds an annual Unlimited plan in status
      active or cancellation_pending, 50 points when the member holds a monthly Unlimited plan in status
      active or cancellation_pending, otherwise none.
    lines_12m: >-
      the order lines booked on the member's orders in the 12 months ending on the claim date (a line
      dated exactly 12 months before not counting)
    items_gift: >-
      An items-bought gift is added on the order lines booked on the member's orders in the 12 months
      ending on the claim date (a line dated exactly 12 months before not counting): 100 points for 8
      or more lines, 50 points for 4 to 7 lines, otherwise none.
    result: >-
      The shopping boost is applied to the tier amount first and the gifts are then added; when the tier
      amount is 0 nothing is posted and no gift is added.
    boosted_amount: >-
      A birthday shopping boost applies according to the merchandise booked on the member's orders placed
      within the month ending on the claim date (an order dated on the same day of the previous month
      not counting): when it comes to 150.00 or more, the tier amount is doubled; when it is above 0 but
      under 150.00, that merchandise is credited again as birthday points, at base_points_per_usd times
      the tier_points_multiplier of the tier held on the claim date, rounded to the nearest whole point
      with a half point rounding up, and added to the tier amount; when nothing was booked, the tier amount
      stands.
  factors:
  - id: birthday_shopping_boost
    effect: method
    decides: boosted_amount
    bindings:
    - month_merch
    - boosted_amount
    ladder:
    - when: merchandise booked within the month ending on the claim date comes to 150.00 or more
      method: the tier amount is doubled
    - when: that merchandise is above 0 but under 150.00
      method: >-
        the merchandise is credited again as points at base_points_per_usd times the tier multiplier,
        rounded half up, and added to the tier amount
    - when: otherwise
      method: the tier amount stands
    baseline:
      boosted_amount: tier_amount
    evidence:
    - cross_category
    - history
    cross_difficulty: null
  - id: birthday_tenure_gift
    effect: parameter
    decides: tenure_gift
    bindings:
    - member_months
    - tenure_gift
    ladder:
    - when: 60 or more whole calendar months since enrollment
      value: K('long_tenure_gift') = 150 points
    - when: 12 to 59 whole calendar months
      value: K('mid_tenure_gift') = 50 points
    - when: otherwise
      value: none
    baseline:
      tenure_gift: '0'
    evidence:
    - date
    cross_difficulty: null
  - id: birthday_unlimited_gift
    effect: parameter
    decides: plan_gift
    bindings:
    - gift_plan
    - gift_plan_state
    - gift_plan_in_force
    - gift_plan_annual
    - plan_gift
    ladder:
    - when: an Unlimited plan in status active or cancellation_pending and that plan is annual
      value: K('annual_plan_gift') = 100 points
    - when: an Unlimited plan in status active or cancellation_pending and that plan is monthly
      value: K('monthly_plan_gift') = 50 points
    - when: otherwise
      value: none
    baseline:
      plan_gift: '0'
    evidence:
    - cross_category
    cross_difficulty: null
  - id: birthday_items_bought_gift
    effect: parameter
    decides: items_gift
    bindings:
    - lines_12m
    - items_gift
    ladder:
    - when: 8 or more order lines booked in the 12 months ending on the claim date
      value: K('many_lines_gift') = 100 points
    - when: 4 to 7 such order lines
      value: K('some_lines_gift') = 50 points
    - when: otherwise
      value: none
    baseline:
      items_gift: '0'
    evidence:
    - cross_category
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The birthday bonus is the birthday_bonus_points of the tier held on the claim date; a tier whose
      value is 0 receives no birthday bonus.
    params:
    - birthday_bonus_points
  inputs:
    history:
    - category: orders
      table: order_lines
      aggregate: sum
      field: amount_usd
      within_months: 1
      filters:
        event_type: orders_line_booked
    - category: orders
      table: order_lines
      aggregate: count
      field: order_line_id
      within_months: 12
      filters:
        event_type: orders_line_booked
    cross_category:
    - orders
    - pass
