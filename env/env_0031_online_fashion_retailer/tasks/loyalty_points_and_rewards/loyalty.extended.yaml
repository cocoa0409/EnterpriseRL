# Marlowe Rewards — the free, spend-tiered loyalty programme of Marlowe & Finch.
# One membership per customer; points are earned on dispatched merchandise, sit pending through
# the return period, convert automatically into Marlowe Rewards Notes (issued in the credit
# category), and drive the tier perks that the orders, returns and preorders charters read.

category: loyalty
display_name: Marlowe Rewards

binding:
  holding_table: loyalty_memberships
  event_tables: [loyalty_ledger]
  intake_tables: [loyalty_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {points_balance: points}

lifecycle:
  states: [active, suspended, closed]
  transitions:
    - {from: active, to: suspended, by: agent, means: "The membership is placed under review and its points frozen for conversion and bonuses — on a reported account takeover or when the return-abuse screen fires."}
    - {from: suspended, to: active, by: system, means: "The loyalty review team clears the review and the membership resumes normal earning, conversion and bonuses."}
    - {from: suspended, to: closed, by: system, means: "The loyalty review team confirms programme abuse and closes the membership, forfeiting its points."}
    - {from: active, to: closed, by: user, means: "The customer personally confirms a closure request for their own membership, forfeiting its points."}

accounts:
  - key: points
    unit: points
    meaning: "The member's Marlowe Rewards points; pending and available points together, signed (a reversal can take it below zero)."

parameter_schema:
  tier_qualifying_spend_usd: "Calendar-year qualifying spend (USD, 2 dp) at which this tier is reached; the tier's entry threshold."
  tier_review_downgrade_max_levels: "Maximum number of tier levels a membership can fall at one annual tier review (integer)."
  tier_validity_years_after_qualifying_year: "Number of calendar years after the qualifying year through whose 31 December a reached tier stays valid (integer)."
  annual_tier_review_date: "Month and day of the annual tier review, MM-DD (string)."
  enrollment_min_age_months: "Minimum age at enrollment in calendar months counted from the date of birth on the profile (integer; 192 = 16 years)."
  base_points_per_usd: "Base points per USD of qualifying spend before the tier multiplier (integer)."
  tier_points_multiplier: "Multiplier applied to base points for the tier held on the posting date (decimal)."
  points_rounding_rule: "How fractional points are rounded on a single posting (enum string: nearest_whole_point_half_up)."
  points_pending_days: "Calendar days after the posting date before earned points become available for conversion (integer)."
  earn_on_shipping_fees: "Whether shipping fees count as qualifying spend (boolean)."
  earn_on_sales_tax: "Whether sales tax counts as qualifying spend (boolean)."
  earn_on_gift_card_purchases: "Whether buying a gift card counts as qualifying spend (boolean)."
  earn_on_rewards_note_tender: "Whether the part of an order paid with Marlowe Rewards Notes counts as qualifying spend (boolean)."
  earn_on_store_credit_tender: "Whether the part of an order paid with gift cards, Return Store Credit or Goodwill Credit counts as qualifying spend (boolean)."
  reward_conversion_points: "Available points converted into one reward unit (integer points)."
  reward_note_value_usd: "Value of one reward unit on the issued Marlowe Rewards Note (USD, 2 dp)."
  reward_auto_conversion: "Whether conversion runs automatically on the nightly run without a customer request (boolean)."
  reward_note_validity_days: "Calendar days from the issue date that a Marlowe Rewards Note issued at this tier stays valid (integer)."
  reward_note_reissue_on_return: "Whether a Rewards Note value spent on merchandise that is later refunded is reissued as a new note (boolean)."
  reward_note_reissue_min_validity_days: "Minimum calendar days of validity a reissued Rewards Note carries from its reissue date (integer)."
  negative_balance_conversion_block: "Whether conversion is blocked while the total points balance is below zero (boolean)."
  points_expiry_inactivity_months: "Calendar months without an earning posting after which the whole points balance is forfeited (integer)."
  welcome_bonus_points: "Points posted once per customer lifetime at first enrollment (integer)."
  birthday_bonus_points: "Points posted in the member's birthday month for the tier held on the posting date (integer; 0 = no birthday bonus)."
  birthday_bonus_min_tenure_days: "Calendar days a membership must have been enrolled before the birthday-bonus posting date (integer)."
  birthday_bonus_posting_day: "Day of the birth month on which the birthday bonus posts (integer day of month)."
  review_bonus_points: "Points per published product review of a verified purchase (integer)."
  review_bonus_monthly_cap: "Maximum number of review bonuses posted in one calendar month (integer)."
  review_bonus_requires_verified_purchase: "Whether the reviewed product must appear on a dispatched order of the member (boolean)."
  referral_bonus_points: "Points per qualifying referral for the tier held on the posting date (integer)."
  referral_annual_cap: "Maximum referral bonuses posted per calendar year (integer)."
  referral_min_friend_order_usd: "Minimum merchandise value (USD, 2 dp, after discounts, before tax and shipping) of the referred friend's first order (decimal)."
  referral_posting_delay_days: "Calendar days after the friend's first order is dispatched before the referral bonus posts (integer)."
  missing_points_request_window_days: "Calendar days after the order's placed date within which a missing-points request is accepted (integer)."
  missing_points_min_days_after_shipment: "Calendar days after the order's dispatch before a missing-points request may be raised (integer)."
  points_credit_to_purchaser_only: "Whether points can only be credited to the membership of the customer profile that placed the order (boolean)."
  goodwill_points_per_case_cap: "Points granted for one documented delivery service failure, before the annual cap (integer)."
  goodwill_points_annual_cap: "Maximum goodwill points granted to one membership per calendar year (integer)."
  return_abuse_rate_threshold_pct: "Trailing-12-month reversed-to-qualifying spend ratio (percent) at or above which the return-abuse screen fires (integer)."
  return_abuse_min_orders: "Minimum number of distinct earning orders in the trailing 12 months before the return-abuse screen can fire (integer)."
  return_abuse_lookback_months: "Calendar months in the return-abuse look-back window (integer)."
  closure_forfeits_points: "Whether a positive points balance is forfeited when the membership closes (boolean)."
  suspension_withholds_rewards: "Whether conversion, bonuses and tier changes are withheld while the membership is suspended (boolean)."
  free_standard_shipping_threshold_usd: "Order merchandise subtotal (USD, 2 dp, after discounts) at or above which Standard Ground ships free for this tier (decimal; 0.00 = always free). Read by the orders charter."
  free_expedited_upgrade: "Whether Expedited 2-Day is charged at the Standard Ground fee for this tier (boolean). Read by the orders charter."
  price_adjustment_window_days: "Calendar days after the order's placed date during which a price adjustment may be requested at this tier (integer). Read by the orders charter."
  return_window_extension_days: "Calendar days added to the standard return window for this tier (integer). Read by the returns charter."
  restocking_fee_waiver: "Whether restocking fees are waived for this tier (boolean). Read by the returns charter."
  free_return_label: "Whether the prepaid mail-return label fee is waived for this tier (boolean). Read by the returns charter."
  launch_preorder_early_access_hours: "Hours before public opening that this tier may place a Launch Pre-Order (integer). Read by the preorders charter."
  launch_preorder_allocation_priority: "Allocation priority of this tier when launch stock is short (integer, 1 = served first). Read by the preorders charter."
  launch_preorder_per_style_limit: "Maximum open Launch Pre-Order units of one style per member at this tier (integer). Read by the preorders charter."

