        table: return_cases
        aggregate: count
        field: return_id
        within_months: 12
        filters: {}
      - category: loyalty
        table: loyalty_ledger
        aggregate: sum
        field: points
        within_months: 12
        filters:
          event_type: loyalty_points_earned
