      ladder:
      - when: '`pts_high` points or more counted'
        value: K('pts_rel_high')
      - when: '`pts_mid` up to `pts_high` points exclusive'
        value: K('pts_rel_mid')
      - when: otherwise
        value: K('pts_rel_none')
      baseline:
        points_mult: K('pts_rel_none')
      evidence:
      - cross_category
      - history
      cross_difficulty: loyalty
    baseline:
      rule: The cancellation charge is the reserved unit price times the units times the charge rate; the standard charge rate is `rate_standard`. The charge never exceeds the deposit held on the reservation and is rounded half up to the cent once, at the end; the refund of the rest is the deposit held less the charge.
      params:
