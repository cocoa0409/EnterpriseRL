events:
  - type: preorders_reserved
    target: reservations
    mutation: create
    meaning: "A customer reserves an item that cannot ship yet, with a promised ship-by date, in status reserved."
    grain: "One row per reservation."
    fields:
      reservation_id: "Reference of the reservation."
      customer_id: "Customer who reserved."
      variant_name: "Reservation type."
      status: "Always reserved at creation."
      reserved_date: "Reservation date, Eastern Time."
      reserved_time_et: "Reservation time, Eastern Time."
      sku: "SKU reserved."
      style_code: "Style of the SKU (the per-style limit key)."
      style_name: "Product name."
      size: "Size reserved."
      quantity: "Units reserved."
      unit_price_usd: "Reserved unit price."
      deposit_required_usd: "Deposit due at reservation, 0.00 when none."
      original_ship_by_date: "Ship-by date promised at reservation."
      current_ship_by_date: "Equal to original_ship_by_date at creation."
      delay_notice_count: "0 at creation."
      personalization_text: "Personalisation exactly as the customer gave it (Made-to-Order only), or empty."
    triggers:
      - event: preorders:preorders_deposit_captured
        when: {variant_name: [Deposit Pre-Order, Made-to-Order Reservation]}
        map: {event_date: reserved_date, tender_type: card_or_wallet, amount_usd: deposit_required_usd}

  - type: preorders_deposit_captured
    target: reservation_events
    meaning: "The deposit of a reservation is charged to the customer's card."
    grain: "One row per reservation (a deposit is taken once)."
    distinguish_by: [tender_type]
    fields:
      event_date: "Capture date."
      tender_type: "Always card_or_wallet."
      amount_usd: "Deposit charged, positive."
    account: deposit
    direction: in
    triggers: []

  - type: preorders_deposit_refunded
    target: reservation_events
    meaning: "A deposit is refunded to the card because the reservation was cancelled with a refund owed."
    grain: "One row per cancelled reservation."
    distinguish_by: [refund_reason]
    fields:
      event_date: "Refund date."
      refund_reason: "Cancel reason of the reservation."
      amount_usd: "Deposit refunded, negative."
    account: deposit
    direction: out
    triggers: []

  - type: preorders_deposit_forfeited
    target: reservation_events
    meaning: "A deposit is kept because the customer cancelled a made-to-order item after production started."
    grain: "One row per cancelled reservation."
    distinguish_by: [refund_reason]
    fields:
      event_date: "Forfeiture date."
      refund_reason: "Always customer_request."
      amount_usd: "Deposit kept, negative."
    account: deposit
    direction: out
    triggers: []

  - type: preorders_deposit_applied
    target: reservation_events
    meaning: "The deposit is applied to the price of the item when it ships."
    grain: "One row per fulfilment order."
    distinguish_by: [fulfilment_order_id]
    fields:
      event_date: "Shipment date."
      fulfilment_order_id: "Order carrying the item."
      amount_usd: "Deposit applied, negative."
    account: deposit
    direction: out
    triggers: []

  - type: preorders_delay_notified
    target: reservation_events
    meaning: "A delay notice tells the customer the item cannot ship by the current ship-by date, gives a revised date and offers cancellation with a full refund."
    grain: "One row per notice (numbered per reservation)."
    distinguish_by: [notice_number]
    fields:
      event_date: "Date the notice was sent."
      notice_number: "1 for the first notice, 2 for the second, and so on."
      revised_ship_by_date: "Revised ship-by date announced."
      consent_mode: "deemed_consent or express_consent_required."
    triggers:
      - event: preorders:preorders_ship_date_revised
        when: {consent_mode: deemed_consent}
        map: {current_ship_by_date: revised_ship_by_date}
      - event: preorders:preorders_delay_consent_requested
        when: {consent_mode: express_consent_required}

  - type: preorders_authorization_renewed
    target: reservation_events
    meaning: "The card authorization of a Launch Pre-Order is renewed before it lapses."
    grain: "One row per renewal attempt date."
    distinguish_by: [event_date]
    fields:
      event_date: "Renewal attempt date."
      auth_amount_usd: "Amount authorized."
      auth_outcome: "approved or declined."
    triggers: []

  - type: preorders_delay_consent_requested
    target: reservations
    mutation: {transition: {from: reserved, to: awaiting_consent}}
    meaning: "A delay needing express consent puts the reservation on hold for the customer's answer."
    grain: "One row per transaction."
    fields:
      status: "awaiting_consent."
      consent_deadline_date: "The current ship-by date before revision."
      delay_notice_count: "Incremented by one."
    triggers: []

  - type: preorders_delay_consented
    target: reservations
    mutation: {transition: {from: awaiting_consent, to: reserved}}
    meaning: "The customer expressly consents to the revised ship-by date."
    grain: "One row per transaction."
    fields:
      status: "reserved."
      current_ship_by_date: "The revised ship-by date of the latest notice."
      consent_deadline_date: "Cleared."
    triggers: []

  - type: preorders_lapsed
    target: reservations
    mutation: {transition: {from: awaiting_consent, to: cancelled}}
    meaning: "The customer declined the delay or did not consent by the deadline."
    grain: "One row per transaction."
    fields:
      status: "cancelled."
      variant_name: "Reservation type, unchanged; read to route the consequences."
      cancelled_date: "The day the customer declined, or the day after the consent deadline."
      cancel_reason: "delay_not_consented."
    triggers:
      - event: preorders:preorders_deposit_refunded
        when: {variant_name: [Deposit Pre-Order, Made-to-Order Reservation]}
        map: {refund_reason: cancel_reason, event_date: cancelled_date}

  - type: preorders_production_started
    target: reservations
    mutation: {transition: {from: reserved, to: in_production}}
    meaning: "Production of a made-to-order item starts."
    grain: "One row per transaction."
    fields:
      status: "in_production."
      production_start_date: "Production start date."
    triggers: []

  - type: preorders_production_completed
    target: reservations
    mutation: {transition: {from: in_production, to: allocated}}
    meaning: "The made-to-order item passes quality control and is set aside."
    grain: "One row per transaction."
    fields:
      status: "allocated."
      allocated_date: "Completion date."
    triggers: []

  - type: preorders_allocated
    target: reservations
    mutation: {transition: {from: reserved, to: allocated}}
    meaning: "Arriving stock is set aside for the reservation."
    grain: "One row per transaction."
    fields:
      status: "allocated."
      allocated_date: "Allocation date."
    triggers: []

  - type: preorders_fulfilled
    target: reservations
    mutation: {transition: {from: allocated, to: fulfilled}}
    meaning: "The allocated item ships on a fulfilment order."
    grain: "One row per transaction."
    fields:
      status: "fulfilled."
      variant_name: "Reservation type, unchanged; read to route the consequences."
      fulfilled_date: "Shipment date."
      fulfilment_order_id: "Order carrying the item."
    triggers:
      - event: orders:orders_placed
        map: {placed_date: fulfilled_date}
      - event: preorders:preorders_deposit_applied
        when: {variant_name: [Deposit Pre-Order, Made-to-Order Reservation]}
        map: {fulfilment_order_id: fulfilment_order_id, event_date: fulfilled_date}

  - type: preorders_cancelled
    target: reservations
    mutation: {transition: {from: reserved, to: cancelled}}
    meaning: "An unallocated reservation is cancelled."
    grain: "One row per transaction."
    fields:
      status: "cancelled."
      variant_name: "Reservation type, unchanged; read to route the consequences."
      cancelled_date: "Cancellation date."
      cancel_reason: "customer_request, supplier_cancelled, launch_shortfall, specs_not_confirmed, delay_cap_reached or payment_declined."
    triggers:
      - event: preorders:preorders_deposit_refunded
        when: {variant_name: [Deposit Pre-Order, Made-to-Order Reservation]}
        map: {refund_reason: cancel_reason, event_date: cancelled_date}

  - type: preorders_production_cancelled
    target: reservations
    mutation: {transition: {from: in_production, to: cancelled}}
    meaning: "A made-to-order reservation in production is cancelled."
    grain: "One row per transaction."
    fields:
      status: "cancelled."
      cancelled_date: "Cancellation date."
      cancel_reason: "customer_request or production_failure."
    triggers:
      - event: preorders:preorders_deposit_refunded
        when: {cancel_reason: production_failure}
        map: {refund_reason: production_failure, event_date: cancelled_date}

  - type: preorders_cancelled_after_allocation
    target: reservations
    mutation: {transition: {from: allocated, to: cancelled}}
    meaning: "An allocated reservation is cancelled because payment was declined beyond the grace period."
    grain: "One row per transaction."
    fields:
      status: "cancelled."
      variant_name: "Reservation type, unchanged; read to route the consequences."
      cancelled_date: "Cancellation date."
      cancel_reason: "payment_declined."
    triggers:
      - event: preorders:preorders_deposit_refunded
        when: {variant_name: [Deposit Pre-Order, Made-to-Order Reservation]}
        map: {refund_reason: payment_declined, event_date: cancelled_date}

  - type: preorders_ship_date_revised
    target: reservations
    mutation: update
    meaning: "The current ship-by date moves to the revised date of a first notice that treats silence as consent."
    grain: "One row per transaction."
    fields:
      current_ship_by_date: "Revised ship-by date."
      delay_notice_count: "Incremented by one."
    triggers: []

  - type: preorders_price_lowered
    target: reservations
    mutation: update
    meaning: "The reserved unit price is lowered to a lower regular price before shipment."
    grain: "One row per transaction."
    fields:
      unit_price_usd: "New, lower unit price."
    triggers: []

  - type: preorders_size_changed
    target: reservations
    mutation: update
    meaning: "The size of an unallocated reservation is changed."
    grain: "One row per transaction."
    fields:
      sku: "New SKU."
      size: "New size."
      size_changes_used: "Incremented by one."
    triggers: []

  - type: preorders_specs_confirmed
    target: reservations
    mutation: update
    meaning: "The customer personally confirms the size and personalisation of a made-to-order item."
    grain: "One row per transaction."
    fields:
      specs_confirmed_date: "Confirmation date."
      personalization_text: "Final personalisation exactly as confirmed."
    triggers: []

measures:
  - id: preorders_msr_open_style_units
    window: "The customer's reservations in status reserved, awaiting_consent, in_production or allocated."
    measure: "Sum of quantity over those reservations with the same style_code and variant_name Launch Pre-Order."
  - id: preorders_msr_open_reservations
    window: "The customer's reservations in status reserved, awaiting_consent, in_production or allocated."
    measure: "Count of those reservations."
  - id: preorders_msr_cumulative_delay_days
    window: "The reservation's current state."
    measure: "Calendar days from original_ship_by_date to the revised ship-by date being considered."

policies:
  - id: preorders_reservation
    subject: [preorders_reserved]
    rule: >-
      A reservation is taken only for the type matching the item's state (entry gate of each type) and
      always states an original ship-by date no later than `max_initial_ship_by_days` calendar days
      after the reservation date; where no date can be stated, the ship-by date is the reservation date
      plus `ship_by_days_when_unstated`. A reservation carries at most `max_units_per_reservation`
      units. Promotion codes never apply to reservations (orders charter). A Launch Pre-Order can be
      reserved from the public `launch_open_time_et` on the launch date, or earlier by the
      `launch_preorder_early_access_hours` of the customer's Marlowe Rewards tier
      (`early_access_applies`, loyalty charter). Where `payment_timing` is
      authorize_at_reservation_capture_at_shipment, the card is authorized for the `auth_amount_basis`
      at reservation; where a deposit applies it is charged at reservation, by card only
      (`deposit_tender_types`). The deposit is `deposit_pct` percent of unit price times quantity,
      rounded per `deposit_rounding`, but never less than `deposit_min_usd`. A Made-to-Order
      Reservation records the personalisation exactly as the customer gives it
      (`personalization_allowed`).
    eligibility: []
    params:
      per_tier:
        Standard Back-Order: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", max_initial_ship_by_days: "=max_initial_ship_by_days"}
        Supplier Direct Back-Order: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", max_initial_ship_by_days: "=max_initial_ship_by_days"}
        Seasonal Pre-Order: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", max_initial_ship_by_days: "=max_initial_ship_by_days"}
        Launch Pre-Order: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", max_initial_ship_by_days: "=max_initial_ship_by_days"}
        Deposit Pre-Order: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", max_initial_ship_by_days: "=max_initial_ship_by_days"}
        Made-to-Order Reservation: {deposit_pct: "=deposit_pct", deposit_min_usd: "=deposit_min_usd", max_initial_ship_by_days: "=max_initial_ship_by_days"}
    formula:
      deposit_required_usd: "max(round(unit_price_usd * quantity * deposit_pct / 100, 2), deposit_min_usd)"
      when_not: "deposit_pct == 0"

  - id: preorders_agg_multi_holding
    subject: [preorders_reserved]
    rule: >-
      A customer may hold several reservations at once, of any type, up to
      `max_open_reservations_per_customer` open reservations in total (preorders_msr_open_reservations);
      a reservation beyond that is not taken. Each reservation keeps its own ship-by date, deposit and
      delay history; delay notices, consents and refunds never carry over from one reservation to
      another.
    eligibility: []
    params: {max_per_customer: null}
    measures: [preorders_msr_open_reservations]

  - id: preorders_agg_launch_style_limit
    subject: [preorders_reserved]
    rule: >-
      For a Launch Pre-Order the open units of one style across all of a customer's Launch Pre-Order
      reservations (preorders_msr_open_style_units) may not exceed the
      `launch_preorder_per_style_limit` of the customer's Marlowe Rewards tier on the reservation date
      (loyalty charter; `per_style_limit_basis`), or the Marlowe Rewards Member limit for a customer
      without an open membership. Cancelled and fulfilled reservations do not count. A second profile
      at the same shipping address does not create a separate allowance: reservations shipping to the
      same address are counted together.
    eligibility: []
    measures: [preorders_msr_open_style_units]

  - id: preorders_evt_delay_notice
    subject: [preorders_delay_notified, preorders_ship_date_revised, preorders_delay_consent_requested, preorders_delay_consented, preorders_lapsed]
    rule: >-
      When a reservation cannot ship by its current_ship_by_date, a numbered delay notice with a
      definite revised ship-by date and an offer to cancel with a full refund is sent on or before that
      date (`delay_notice_deadline_basis`). A delay notice is sent only while the reservation is in
      status reserved or in_production. The notice treats the customer's silence as consent
      (deemed_consent) only when it is notice number 1 and its revised date is no more than
      `deemed_consent_max_delay_days` calendar days after the original_ship_by_date; the current ship-by
      date then moves to the revised date at once. Every other notice — any notice from number
      `express_consent_from_notice_number`, or a first notice announcing a longer delay — needs the
      customer's express consent (express_consent_required): the reservation moves to awaiting_consent
      with consent_deadline_date equal to the current ship-by date before revision
      (`consent_deadline_basis`). Express consent counts only if the customer gives it no later than
      the consent deadline of the reservation. The deadline day itself counts; consent given on a later
      calendar day does not. With timely consent the reservation returns to reserved with the revised
      date; when the customer declines, or the deadline passes in silence, the reservation is cancelled
      with reason delay_not_consented and a full refund. When the revised date would lie more than
      `max_cumulative_delay_days` calendar days after the original_ship_by_date
      (preorders_msr_cumulative_delay_days), no notice is sent; the reservation is cancelled with reason
      delay_cap_reached and a full refund.
    eligibility:
      - id: open_reservation
        applies_to: [preorders_delay_notified]
        kind: state
        condition: "A delay notice is sent only while the reservation is in status reserved or in_production."
        evidence_fields: [reservations.status, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        state_contract:
          field: reservations.status
          allowed: [reserved, in_production]
      - id: consent_in_time
        applies_to: [preorders_delay_consented]
        kind: time
        condition: "Express consent counts only if the customer gives it no later than the consent deadline of the reservation."
        evidence_fields: [reservations.consent_deadline_date, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the consent deadline of the reservation"
          anchor_source: reservations.consent_deadline_date
          relation: not_after
          duration_source: params.consent_grace_days
          unit: calendar_days
          counting_rule: "The deadline day itself counts; consent given on a later calendar day does not."
          boundary: inclusive
    params:
      consent_grace_days: 0
      per_tier:
        Standard Back-Order: {max_cumulative_delay_days: "=max_cumulative_delay_days", deemed_consent_max_delay_days: "=deemed_consent_max_delay_days"}
        Supplier Direct Back-Order: {max_cumulative_delay_days: "=max_cumulative_delay_days", deemed_consent_max_delay_days: "=deemed_consent_max_delay_days"}
        Seasonal Pre-Order: {max_cumulative_delay_days: "=max_cumulative_delay_days", deemed_consent_max_delay_days: "=deemed_consent_max_delay_days"}
        Launch Pre-Order: {max_cumulative_delay_days: "=max_cumulative_delay_days", deemed_consent_max_delay_days: "=deemed_consent_max_delay_days"}
        Deposit Pre-Order: {max_cumulative_delay_days: "=max_cumulative_delay_days", deemed_consent_max_delay_days: "=deemed_consent_max_delay_days"}
        Made-to-Order Reservation: {max_cumulative_delay_days: "=max_cumulative_delay_days", deemed_consent_max_delay_days: "=deemed_consent_max_delay_days"}
    measures: [preorders_msr_cumulative_delay_days]

  - id: preorders_evt_cancellation_refund
    subject: [preorders_cancelled, preorders_production_cancelled, preorders_cancelled_after_allocation, preorders_deposit_refunded, preorders_deposit_forfeited]
    rule: >-
      A customer may cancel at will until `customer_cancellation_cutoff`: before allocation for every
      type except Made-to-Order Reservation, whose cutoff is the start of production. Before the cutoff
      the deposit is refunded in full (`deposit_refundable_before_cutoff`). After the cutoff a
      Made-to-Order Reservation can still be cancelled at the customer's request, but its deposit is
      forfeited (`deposit_forfeited_after_cutoff`); such a cancellation is made only on a
      cancellation_with_forfeiture request for that reservation whose request_status is confirmed. Once
      any delay notice has been sent for a reservation (delay_notice_count above 0), a customer
      cancellation is always refunded in full, whatever the status and the cutoff. Every cancellation
      caused by Marlowe & Finch or its supplier — supplier_cancelled, launch_shortfall,
      delay_not_consented, delay_cap_reached, production_failure — refunds the deposit in full
      (`seller_cancellation_full_refund`). A customer whose specifications were not confirmed in time
      (specs_not_confirmed), or whose card stayed declined past the grace period (payment_declined),
      also receives the deposit back in full. Refunds go to the original card
      (`cancellation_refund_tender`) within `refund_due_business_days` business days; nothing was
      charged on types without a deposit, whose card authorization is simply released. A refund or
      forfeiture is booked only once the reservation is in status cancelled. An allocated reservation
      cannot be cancelled at will; the customer may refuse delivery or return the item under the
      returns charter once delivered.
      Only types with `supplier_cancellation_possible` can be cancelled by the supplier (reason supplier_cancelled); a Deposit Pre-Order or Made-to-Order Reservation is never cancelled that way.
    eligibility:
      - id: forfeiture_confirmed
        applies_to: [preorders_production_cancelled, preorders_deposit_forfeited]
        kind: authorization
        condition: "After the cutoff a Made-to-Order Reservation can still be cancelled at the customer's request, but its deposit is forfeited (`deposit_forfeited_after_cutoff`); such a cancellation is made only on a cancellation_with_forfeiture request for that reservation whose request_status is confirmed."
        evidence_fields: [reservation_requests.reservation_id, reservation_requests.request_type, reservation_requests.request_status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservation_requests.reservation_id]
          action_bindings:
            reservation_requests.reservation_id: reservation_id
      - id: booked_after_cancellation
        applies_to: [preorders_deposit_refunded, preorders_deposit_forfeited]
        kind: state
        condition: "A refund or forfeiture is booked only once the reservation is in status cancelled."
        evidence_fields: [reservations.status, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        state_contract:
          field: reservations.status
          allowed: [cancelled]
    params:
      per_tier:
        Standard Back-Order: {customer_cancellation_cutoff: "=customer_cancellation_cutoff", deposit_forfeited_after_cutoff: "=deposit_forfeited_after_cutoff"}
        Supplier Direct Back-Order: {customer_cancellation_cutoff: "=customer_cancellation_cutoff", deposit_forfeited_after_cutoff: "=deposit_forfeited_after_cutoff"}
        Seasonal Pre-Order: {customer_cancellation_cutoff: "=customer_cancellation_cutoff", deposit_forfeited_after_cutoff: "=deposit_forfeited_after_cutoff"}
        Launch Pre-Order: {customer_cancellation_cutoff: "=customer_cancellation_cutoff", deposit_forfeited_after_cutoff: "=deposit_forfeited_after_cutoff"}
        Deposit Pre-Order: {customer_cancellation_cutoff: "=customer_cancellation_cutoff", deposit_forfeited_after_cutoff: "=deposit_forfeited_after_cutoff"}
        Made-to-Order Reservation: {customer_cancellation_cutoff: "=customer_cancellation_cutoff", deposit_forfeited_after_cutoff: "=deposit_forfeited_after_cutoff"}

  - id: preorders_evt_deposit
    subject: [preorders_deposit_captured, preorders_deposit_applied]
    rule: >-
      A deposit is captured once, at reservation, by card (`deposit_tender_types`). At shipment the
      deposit is applied in full to the fulfilment order and the customer pays the `balance_basis`:
      the final unit price times quantity minus the deposit, plus tax, on the fulfilment order
      (`balance_paid_via_fulfilment_order`), where every order tender may be used. A deposit is applied
      only once the reservation is in status fulfilled. A lower final price never reduces the deposit
      below what was paid; it only lowers the balance, and when the deposit exceeds the final price the
      difference is refunded to the card at shipment.
    eligibility:
      - id: applied_on_fulfilment
        applies_to: [preorders_deposit_applied]
        kind: state
        condition: "A deposit is applied only once the reservation is in status fulfilled."
        evidence_fields: [reservations.status, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        state_contract:
          field: reservations.status
          allowed: [fulfilled]

  - id: preorders_evt_price_protection
    subject: [preorders_price_lowered]
    rule: >-
      Where `price_protection` applies, the customer pays the lowest regular site price of the reserved
      SKU between the reservation date and shipment (`price_protection_basis`): when the regular price
      drops, the reserved unit price is lowered before shipment (`price_protection_application`). A
      price is lowered only while the reservation is in status reserved, awaiting_consent, in_production
      or allocated. Clearance, flash-sale and code-only prices never count, and a price rise never
      raises the reserved price. Launch Pre-Orders and Made-to-Order Reservations keep their reserved
      price.
    eligibility:
      - id: before_shipment
        applies_to: [preorders_price_lowered]
        kind: state
        condition: "A price is lowered only while the reservation is in status reserved, awaiting_consent, in_production or allocated."
        evidence_fields: [reservations.status, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        state_contract:
          field: reservations.status
          allowed: [reserved, awaiting_consent, in_production, allocated]

  - id: preorders_evt_launch_allocation
    subject: [preorders_allocated]
    rule: >-
      Arriving stock is allocated per `allocation_basis`: in order of reservation time, or for a Launch
      Pre-Order first by the `launch_preorder_allocation_priority` of the customer's Marlowe Rewards tier
      on the allocation date (loyalty charter; customers without an open membership after every member)
      and then by reservation time. A reservation in awaiting_consent is skipped until it is consented.
      Where `shortfall_handling` is cancel_unallocated_with_full_refund, reservations the launch stock
      cannot cover are cancelled with reason launch_shortfall; otherwise they receive a delay notice.
      An allocated unit ships within `ship_within_business_days_of_allocation` business days.
    eligibility: []

  - id: preorders_evt_authorization
    subject: [preorders_authorization_renewed, preorders_cancelled_after_allocation]
    rule: >-
      A Launch Pre-Order's card authorization is renewed every `authorization_renewal_days` calendar
      days while the reservation is open. A renewal is attempted only while the reservation is in status
      reserved, awaiting_consent or allocated. When a renewal or the capture at shipment is declined,
      the customer has `payment_decline_grace_hours` hours from the decline to update the card; after
      that the reservation is cancelled with reason payment_declined and its unit released to the next
      reservation.
    eligibility:
      - id: open_for_renewal
        applies_to: [preorders_authorization_renewed]
        kind: state
        condition: "A renewal is attempted only while the reservation is in status reserved, awaiting_consent or allocated."
        evidence_fields: [reservations.status, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        state_contract:
          field: reservations.status
          allowed: [reserved, awaiting_consent, allocated]

  - id: preorders_evt_made_to_order
    subject: [preorders_specs_confirmed, preorders_production_started, preorders_production_completed]
    rule: >-
      A Made-to-Order Reservation goes into production only after the customer personally confirms the
      size and personalisation (`specs_confirmation_required`); the agent can explain and record the
      request but cannot confirm on the customer's behalf. Specifications are confirmed only if the
      customer confirms them no later than `specs_confirmation_deadline_days` calendar days after the
      reservation is made. The reservation date is day zero and the last day of the window still
      counts. Specifications are confirmed only while the reservation is in status reserved. Without a
      timely confirmation the reservation is cancelled with reason specs_not_confirmed and the deposit
      refunded. Confirmed specifications cannot be changed (`specs_change_after_confirmation_allowed`).
      Production takes `production_lead_days` calendar days from its start.
    eligibility:
      - id: confirmation_window
        applies_to: [preorders_specs_confirmed]
        kind: time
        condition: "Specifications are confirmed only if the customer confirms them no later than `specs_confirmation_deadline_days` calendar days after the reservation is made."
        evidence_fields: [reservations.reserved_date, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the reservation is made"
          anchor_source: reservations.reserved_date
          relation: not_after
          duration_source: variants.specs_confirmation_deadline_days
          unit: calendar_days
          counting_rule: "The reservation date is day zero and the last day of the window still counts."
          boundary: inclusive
      - id: specs_before_production
        applies_to: [preorders_specs_confirmed]
        kind: state
        condition: "Specifications are confirmed only while the reservation is in status reserved."
        evidence_fields: [reservations.status, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        state_contract:
          field: reservations.status
          allowed: [reserved]

  - id: preorders_evt_size_change
    subject: [preorders_size_changed]
    rule: >-
      Where `size_change_allowed_before_allocation`, the size of a reservation can be changed to another
      size of the same style at the same price, at most `max_size_changes` time. A size is changed only
      while the reservation is in status reserved or awaiting_consent. The reservation keeps its
      reservation time, ship-by dates and delay history; the new size must be available for
      reservation, and on a back-order or launch the customer must cancel and reserve again instead.
    eligibility:
      - id: unallocated_only
        applies_to: [preorders_size_changed]
        kind: state
        condition: "A size is changed only while the reservation is in status reserved or awaiting_consent."
        evidence_fields: [reservations.status, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        state_contract:
          field: reservations.status
          allowed: [reserved, awaiting_consent]
      - id: change_limit
        applies_to: [preorders_size_changed]
        kind: dedup
        condition: "Where `size_change_allowed_before_allocation`, the size of a reservation can be changed to another size of the same style at the same price, at most `max_size_changes` time."
        evidence_fields: [reservations.size_changes_used, reservations.reservation_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [reservations.reservation_id]
          action_bindings:
            reservations.reservation_id: reservation_id
        dedup_contract:
          table: reservations
          mode: same_record
          object_bindings: {reservation_id: reservation_id}
          duplicate_filters: {size_changes_used: [1]}
          distinct_fields: []
    params:
      per_tier:
        Standard Back-Order: {max_size_changes: "=max_size_changes"}
        Supplier Direct Back-Order: {max_size_changes: "=max_size_changes"}
        Seasonal Pre-Order: {max_size_changes: "=max_size_changes"}
        Launch Pre-Order: {max_size_changes: "=max_size_changes"}
        Deposit Pre-Order: {max_size_changes: "=max_size_changes"}
        Made-to-Order Reservation: {max_size_changes: "=max_size_changes"}

  - id: preorders_fulfilment
    subject: [preorders_fulfilled]
    rule: >-
      An allocated reservation ships on a fulfilment order by `fulfilment_delivery_service` at
      `fulfilment_shipping_fee_usd`, separately from the rest of the original basket at no extra charge
      (`split_shipment_free`); a Supplier Direct Back-Order ships from the brand's warehouse in its own
      parcel (`ships_from_supplier`). A Standard Back-Order of several units may ship units as they
      arrive (`partial_fulfilment_allowed`). Marlowe Rewards points are earned on the fulfilment order
      at its dispatch (`points_earned_at`), never on a deposit. Once shipped, delivery issues follow the
      claims charter and returns follow the returns charter, with the fulfilment order's delivered date
      as the anchor.
    eligibility: []

# ============================================================================
# extended_policies: the multi-factor calculation policies of the preorders_and_backorders difficulty
# ============================================================================
extended_policies:
  - id: preorders_ext_made_to_order_work_charge
    base_policy_refs:
    - preorders_evt_cancellation_refund
    - preorders_evt_made_to_order
    overwrite:
    - base_policy: preorders_evt_cancellation_refund
      superseded_clause: After the cutoff a Made-to-Order Reservation can still be cancelled at the customer's request, but its deposit is forfeited (`deposit_forfeited_after_cutoff`); such a cancellation is made only on a cancellation_with_forfeiture request for that reservation whose request_status is confirmed.
      replaced_by: When a customer cancels a Made-to-Order Reservation after its production has started, the cancellation is made on the customer's own in-person confirmation of the pending cancellation request for that reservation, and Marlowe & Finch keeps a work charge from the deposit and refunds the rest of the deposit to the original card.
    - base_policy: preorders_evt_cancellation_refund
      superseded_clause: A refund or forfeiture is booked only once the reservation is in status cancelled.
      replaced_by: That confirmation, the cancellation, the work charge kept and the refund of the rest of the deposit are booked together, the cancellation first.
    trigger: on_request
    subject:
    - preorders_production_cancelled
    - preorders_deposit_forfeited
    - preorders_deposit_refunded
    computes: work_charge_usd
    target_tool: confirm_made_to_order_cancellation_940e1e7b
    params:
      share_standard: 0.5
      share_cutting: 0.15
      share_lasting: 0.3
      stage_lasting_from: 14
      stage_finishing_from: 28
      cut_ahead_days: 10
      pers_full: 1.5
      pers_part: 1.2
      pers_none: 1.0
      pers_full_after_days: 7
      relief_top: 0.6
      relief_high: 0.8
      relief_none: 1.0
      relief_top_months: 36
      relief_high_months: 24
      fw_months: 24
      fw_many: 8
      fw_some: 4
      fw_rel_many: 0.85
      fw_rel_some: 0.92
      fw_rel_none: 1.0
      ret_months: 12
      ret_few_max: 2
      ret_rel_none: 0.9
      ret_rel_few: 0.95
      ret_rel_std: 1.0
    rule: 'When a customer cancels a Made-to-Order Reservation after its production has started, the cancellation is made on the customer''s own in-person confirmation of the pending cancellation request for that reservation, and Marlowe & Finch keeps a work charge from the deposit and refunds the rest of the deposit to the original card. That confirmation, the cancellation, the work charge kept and the refund of the rest of the deposit are booked together, the cancellation first. Once any delay notice has been sent for the reservation, no work charge is kept and the whole deposit is refunded. The work charge is the reserved unit price times the units, multiplied by the work share for the production stage reached; the standard work share is `share_standard`. The production stage is the number of calendar days from the production start date to the date of the customer''s most recent cancellation request on the reservation when that request is still pending confirmation, or to today when no request is pending; the start day is not counted and the end day is. The work charge never exceeds the deposit held on the reservation and is rounded half up to the cent once, at the end; the refund of the rest is the deposit held less the work charge. The work share, the personalisation multiplier and the three reliefs below are multiplied together with the reserved price in one product, and the cap at the deposit held and the rounding apply to that product. The work share follows the production stage: fewer than `stage_lasting_from` days (cutting) gives `share_cutting`; `stage_lasting_from` days up to fewer than `stage_finishing_from` days (lasting and stitching) gives `share_lasting`; `stage_finishing_from` days or more (finishing) gives the standard work share. The production stage is counted from the specifications confirmation date for a personalised pair whose specifications were confirmed `cut_ahead_days` days or more before its production started, because its leather is cut and embossed at confirmation; from the reservation date for a pair whose specifications were confirmed on the reservation date, because such a pair is built on a stock pattern whose leather is cut on the day it is ordered, provided its production started fewer than `cut_ahead_days` days after that confirmation; and from the production start date for every other pair. Because a personalised pair cannot be finished for anyone else, the work share is multiplied by `pers_full` for a personalised pair that has been in production `pers_full_after_days` days or more, counted from the production start date to today, by `pers_part` for a personalised pair in production for fewer days, and by `pers_none` for a pair without personalisation. Marlowe Rewards tenure relief multiplies the work charge by `relief_top` for an active Icon or Atelier member enrolled `relief_top_months` months or more, by `relief_high` for an active Gold or Platinum member enrolled `relief_high_months` months or more, and by `relief_none` for every other customer. Footwear-client relief counts the footwear lines booked on the customer''s Marlowe & Finch orders in the last `fw_months` months: `fw_many` lines or more multiply the work charge by `fw_rel_many`, `fw_some` up to `fw_many` lines exclusive multiply it by `fw_rel_some`, and fewer lines multiply it by `fw_rel_none`. Return-record relief counts the return authorizations opened on the customer''s profile in the last `ret_months` months, whatever became of them: none multiplies the work charge by `ret_rel_none`, one up to `ret_few_max` multiplies it by `ret_rel_few`, and more multiply it by `ret_rel_std`.'
    prerequisite: []
    cross_category:
    - category: loyalty
      as: branch
      reads:
      - status
      - variant_name
      - enrolled_date
      note: 'Tenure relief: the tier held and the enrolment date of the active Marlowe Rewards membership decide the relief tier.'
    - category: orders
      as: history
      reads:
      - order_lines.product_class
      - order_lines.event_date
      - order_lines.event_type
      note: 'Footwear-client relief: footwear lines booked in the last 24 months decide the relief tier.'
    - category: returns
      as: history
      reads:
      - return_cases.opened_date
      note: 'Return-record relief: return authorizations opened in the last 12 months decide the relief tier.'
    compute:
    - price: F('unit_price_usd') * F('quantity')
    - held: SUM('reservation_events', 'amount_usd')
    - notices: COUNT('reservation_events', event_type='preorders_delay_notified')
    - last_request_status: LATEST('reservation_requests', 'request_status', date_field='created_at')
    - last_request_on: LATEST('reservation_requests', 'created_at', date_field='created_at')
    - stage_end: last_request_on if last_request_status == 'pending_customer_confirmation' else NOW
    - confirm_lead: DAYS(F('specs_confirmed_date'), F('production_start_date'))
    - confirm_delay: DAYS(F('reserved_date'), F('specs_confirmed_date'))
    - stage_start: F('specs_confirmed_date') if (F('personalization_text') != '' and confirm_lead >= K('cut_ahead_days')) else (F('reserved_date') if (confirm_delay == 0 and confirm_lead < K('cut_ahead_days')) else F('production_start_date'))
    - stage_days: DAYS(stage_start, stage_end)
    - work_share: K('share_cutting') if stage_days < K('stage_lasting_from') else (K('share_lasting') if stage_days < K('stage_finishing_from') else K('share_standard'))
    - production_days: DAYS(F('production_start_date'), NOW)
    - personal_mult: K('pers_full') if (F('personalization_text') != '' and production_days >= K('pers_full_after_days')) else (K('pers_part') if (F('personalization_text') != '' and production_days < K('pers_full_after_days')) else K('pers_none'))
    - member_tier: CFIELD('loyalty', 'variant_name', status='active')
    - member_months: MONTHS(CFIELD('loyalty', 'enrolled_date', status='active'), NOW)
    - tenure_relief: K('relief_top') if ((member_tier == 'Marlowe Rewards Icon' or member_tier == 'Marlowe Rewards Atelier') and member_months >= K('relief_top_months')) else (K('relief_high') if ((member_tier == 'Marlowe Rewards Gold' or member_tier == 'Marlowe Rewards Platinum') and member_months >= K('relief_high_months')) else K('relief_none'))
    - footwear_lines: XCOUNT('orders', 'order_lines', within_months=K('fw_months'), date_field='event_date', event_type='orders_line_booked', product_class='footwear')
    - footwear_relief: K('fw_rel_many') if footwear_lines >= K('fw_many') else (K('fw_rel_some') if footwear_lines >= K('fw_some') else K('fw_rel_none'))
    - returns_opened: XCOUNT('returns', 'return_cases', within_months=K('ret_months'), date_field='opened_date')
    - return_relief: K('ret_rel_none') if returns_opened == 0 else (K('ret_rel_few') if returns_opened <= K('ret_few_max') else K('ret_rel_std'))
    - charge_raw: price * work_share * personal_mult * tenure_relief * footwear_relief * return_relief
    - result: 0.0 if notices > 0 else RND(MN(held, charge_raw), 2)
    compute_basis:
      price: The work charge is the reserved unit price times the units, multiplied by the work share for the production stage reached; the standard work share is `share_standard`.
      held: The work charge never exceeds the deposit held on the reservation and is rounded half up to the cent once, at the end; the refund of the rest is the deposit held less the work charge.
      notices: Once any delay notice has been sent for the reservation, no work charge is kept and the whole deposit is refunded.
      last_request_status: The production stage is the number of calendar days from the production start date to the date of the customer's most recent cancellation request on the reservation when that request is still pending confirmation, or to today when no request is pending; the start day is not counted and the end day is.
      last_request_on: The production stage is the number of calendar days from the production start date to the date of the customer's most recent cancellation request on the reservation when that request is still pending confirmation, or to today when no request is pending; the start day is not counted and the end day is.
      stage_end: The production stage is the number of calendar days from the production start date to the date of the customer's most recent cancellation request on the reservation when that request is still pending confirmation, or to today when no request is pending; the start day is not counted and the end day is.
      confirm_lead: The production stage is counted from the specifications confirmation date for a personalised pair whose specifications were confirmed `cut_ahead_days` days or more before its production started, because its leather is cut and embossed at confirmation; from the reservation date for a pair whose specifications were confirmed on the reservation date, because such a pair is built on a stock pattern whose leather is cut on the day it is ordered, provided its production started fewer than `cut_ahead_days` days after that confirmation; and from the production start date for every other pair.
      confirm_delay: The production stage is counted from the specifications confirmation date for a personalised pair whose specifications were confirmed `cut_ahead_days` days or more before its production started, because its leather is cut and embossed at confirmation; from the reservation date for a pair whose specifications were confirmed on the reservation date, because such a pair is built on a stock pattern whose leather is cut on the day it is ordered, provided its production started fewer than `cut_ahead_days` days after that confirmation; and from the production start date for every other pair.
      stage_start: The production stage is counted from the specifications confirmation date for a personalised pair whose specifications were confirmed `cut_ahead_days` days or more before its production started, because its leather is cut and embossed at confirmation; from the reservation date for a pair whose specifications were confirmed on the reservation date, because such a pair is built on a stock pattern whose leather is cut on the day it is ordered, provided its production started fewer than `cut_ahead_days` days after that confirmation; and from the production start date for every other pair.
      stage_days: The production stage is the number of calendar days from the production start date to the date of the customer's most recent cancellation request on the reservation when that request is still pending confirmation, or to today when no request is pending; the start day is not counted and the end day is.
      work_share: 'The work share follows the production stage: fewer than `stage_lasting_from` days (cutting) gives `share_cutting`; `stage_lasting_from` days up to fewer than `stage_finishing_from` days (lasting and stitching) gives `share_lasting`; `stage_finishing_from` days or more (finishing) gives the standard work share.'
      production_days: Because a personalised pair cannot be finished for anyone else, the work share is multiplied by `pers_full` for a personalised pair that has been in production `pers_full_after_days` days or more, counted from the production start date to today, by `pers_part` for a personalised pair in production for fewer days, and by `pers_none` for a pair without personalisation.
      personal_mult: Because a personalised pair cannot be finished for anyone else, the work share is multiplied by `pers_full` for a personalised pair that has been in production `pers_full_after_days` days or more, counted from the production start date to today, by `pers_part` for a personalised pair in production for fewer days, and by `pers_none` for a pair without personalisation.
      member_tier: Marlowe Rewards tenure relief multiplies the work charge by `relief_top` for an active Icon or Atelier member enrolled `relief_top_months` months or more, by `relief_high` for an active Gold or Platinum member enrolled `relief_high_months` months or more, and by `relief_none` for every other customer.
      member_months: Marlowe Rewards tenure relief multiplies the work charge by `relief_top` for an active Icon or Atelier member enrolled `relief_top_months` months or more, by `relief_high` for an active Gold or Platinum member enrolled `relief_high_months` months or more, and by `relief_none` for every other customer.
      tenure_relief: Marlowe Rewards tenure relief multiplies the work charge by `relief_top` for an active Icon or Atelier member enrolled `relief_top_months` months or more, by `relief_high` for an active Gold or Platinum member enrolled `relief_high_months` months or more, and by `relief_none` for every other customer.
      footwear_lines: 'Footwear-client relief counts the footwear lines booked on the customer''s Marlowe & Finch orders in the last `fw_months` months: `fw_many` lines or more multiply the work charge by `fw_rel_many`, `fw_some` up to `fw_many` lines exclusive multiply it by `fw_rel_some`, and fewer lines multiply it by `fw_rel_none`.'
      footwear_relief: 'Footwear-client relief counts the footwear lines booked on the customer''s Marlowe & Finch orders in the last `fw_months` months: `fw_many` lines or more multiply the work charge by `fw_rel_many`, `fw_some` up to `fw_many` lines exclusive multiply it by `fw_rel_some`, and fewer lines multiply it by `fw_rel_none`.'
      returns_opened: 'Return-record relief counts the return authorizations opened on the customer''s profile in the last `ret_months` months, whatever became of them: none multiplies the work charge by `ret_rel_none`, one up to `ret_few_max` multiplies it by `ret_rel_few`, and more multiply it by `ret_rel_std`.'
      return_relief: 'Return-record relief counts the return authorizations opened on the customer''s profile in the last `ret_months` months, whatever became of them: none multiplies the work charge by `ret_rel_none`, one up to `ret_few_max` multiplies it by `ret_rel_few`, and more multiply it by `ret_rel_std`.'
      charge_raw: The work share, the personalisation multiplier and the three reliefs below are multiplied together with the reserved price in one product, and the cap at the deposit held and the rounding apply to that product.
      result: The work charge never exceeds the deposit held on the reservation and is rounded half up to the cent once, at the end; the refund of the rest is the deposit held less the work charge.
    factors:
    - id: production_stage_share
      effect: parameter
      decides: work_share
      bindings:
      - stage_days
      - work_share
      ladder:
      - when: production stage fewer than `stage_lasting_from` days (cutting)
        value: K('share_cutting')
      - when: production stage `stage_lasting_from` days up to fewer than `stage_finishing_from` days (lasting and stitching)
        value: K('share_lasting')
      - when: otherwise (finishing)
        value: K('share_standard')
      baseline:
        work_share: K('share_standard')
      evidence:
      - date
      cross_difficulty: null
    - id: stage_clock_start
      effect: method
      decides: stage_start
      bindings:
      - confirm_lead
      - confirm_delay
      - stage_start
      ladder:
      - when: personalised pair whose specifications were confirmed `cut_ahead_days` days or more before production started
        method: count the production stage from the specifications confirmation date
      - when: 'stock-pattern pair: specifications confirmed on the reservation date and production started fewer than `cut_ahead_days` days after confirmation'
        method: count the production stage from the reservation date
      - when: otherwise
        method: count the production stage from the production start date
      baseline:
        stage_start: F('production_start_date')
      evidence:
      - date
      cross_difficulty: null
    - id: personalisation_multiplier
      effect: parameter
      decides: personal_mult
      bindings:
      - production_days
      - personal_mult
      ladder:
      - when: personalised pair in production `pers_full_after_days` days or more
        value: K('pers_full')
      - when: personalised pair in production fewer than `pers_full_after_days` days
        value: K('pers_part')
      - when: otherwise
        value: K('pers_none')
      baseline:
        personal_mult: K('pers_none')
      evidence:
      - date
      cross_difficulty: null
    - id: rewards_tenure_relief
      effect: parameter
      decides: tenure_relief
      bindings:
      - member_tier
      - member_months
      - tenure_relief
      ladder:
      - when: active Icon or Atelier member AND enrolled `relief_top_months` months or more
        value: K('relief_top')
      - when: active Gold or Platinum member AND enrolled `relief_high_months` months or more
        value: K('relief_high')
      - when: otherwise
        value: K('relief_none')
      baseline:
        tenure_relief: K('relief_none')
      evidence:
      - cross_category
      - date
      cross_difficulty: loyalty
    - id: footwear_client_relief
      effect: parameter
      decides: footwear_relief
      bindings:
      - footwear_lines
      - footwear_relief
      ladder:
      - when: '`fw_many` or more footwear lines booked in the last `fw_months` months'
        value: K('fw_rel_many')
      - when: '`fw_some` up to `fw_many` footwear lines exclusive'
        value: K('fw_rel_some')
      - when: otherwise
        value: K('fw_rel_none')
      baseline:
        footwear_relief: K('fw_rel_none')
      evidence:
      - cross_category
      - history
      cross_difficulty: orders
    - id: return_record_relief
      effect: parameter
      decides: return_relief
      bindings:
      - returns_opened
      - return_relief
      ladder:
      - when: no return authorization opened in the last `ret_months` months
        value: K('ret_rel_none')
      - when: one up to `ret_few_max` opened
        value: K('ret_rel_few')
      - when: otherwise
        value: K('ret_rel_std')
      baseline:
        return_relief: K('ret_rel_std')
      evidence:
      - cross_category
      - history
      cross_difficulty: returns
    baseline:
      rule: The work charge is the reserved unit price times the units, multiplied by the work share for the production stage reached; the standard work share is `share_standard`. The production stage is the number of calendar days from the production start date to the date of the customer's most recent cancellation request on the reservation when that request is still pending confirmation, or to today when no request is pending; the start day is not counted and the end day is. The work charge never exceeds the deposit held on the reservation and is rounded half up to the cent once, at the end; the refund of the rest is the deposit held less the work charge.
      params:
      - share_standard
    inputs:
      history:
      - table: reservation_events
        aggregate: sum
        field: amount_usd
        within_months: null
        filters: {}
      - table: reservation_requests
        aggregate: latest
        field: created_at
        within_months: null
        filters: {}
      - category: orders
        table: order_lines
        aggregate: count
        field: order_line_id
        within_months: 24
        filters:
          event_type: orders_line_booked
          product_class: footwear
      - category: returns
        table: return_cases
        aggregate: count
        field: return_id
        within_months: 12
        filters: {}
      cross_category:
      - loyalty
      - orders
      - returns
  - id: preorders_ext_made_to_order_remake_deposit
    base_policy_refs:
    - preorders_reservation
    - preorders_agg_multi_holding
    - preorders_agg_launch_style_limit
    - preorders_evt_deposit
    - preorders_evt_made_to_order
    overwrite:
    - base_policy: preorders_reservation
      superseded_clause: The deposit is `deposit_pct` percent of unit price times quantity, rounded per `deposit_rounding`, but never less than `deposit_min_usd`.
      replaced_by: The deposit on a remake is the remake's reserved unit price times its units times the remake deposit percentage, divided by 100; the standard remake deposit percentage is the type's `deposit_pct`.
    trigger: on_request
    subject:
    - preorders_reserved
    - preorders_deposit_captured
    computes: deposit_required_usd
    target_tool: take_made_to_order_remake_13bceb2b
    params:
      carry_full_days: 14
      carry_half_days: 45
      cut_annual: 5
      cut_monthly: 2
      cut_none: 0
      pts_months: 12
      pts_high: 4000
      pts_mid: 1500
      pts_cut_high: 3
      pts_cut_mid: 1
      pts_cut_none: 0
      setoff_full_days: 14
      setoff_part_days: 30
      setoff_full: 0.4
      setoff_part: 0.2
      setoff_none: 0.0
      mult_long_after: 7
      mult_long: 1.2
      mult_short: 1.1
      mult_none: 1.0
    rule: 'A remake is a new Made-to-Order Reservation taken for the style of a Made-to-Order pair the customer has cancelled, in the size and personalisation the customer now gives; it is reserved at the reserved unit price of the cancelled pair for one unit, and its original ship-by date is the reservation date plus `max_initial_ship_by_days` calendar days. A remake is taken only after the pair it remakes shows status cancelled, its cancellation request confirmed and no deposit left standing on it. The deposit on a remake is the remake''s reserved unit price times its units times the remake deposit percentage, divided by 100; the standard remake deposit percentage is the type''s `deposit_pct`. The remake deposit is never less than `deposit_min_usd`, the floor applying last, and it is rounded half up to the cent once, at the end; it is charged to the card at reservation. The two percentage-point reductions below are subtracted from the remake deposit percentage before it is applied to the price, and the work-charge set-off is then subtracted from that amount before the floor. The remake deposit percentage carries the percentage paid on the cancelled pair, which is its deposit charged times 100 divided by its reserved unit price times its units, rounded half up to two decimal places: a remake taken within `carry_full_days` days of the date the customer asked to cancel the pair carries that paid percentage, a remake taken from `carry_full_days` days exclusive up to `carry_half_days` days carries the average of the paid percentage and `deposit_pct`, and a later remake takes `deposit_pct`. An active Unlimited annual plan (Standard Annual, Express Annual, Next-Day Annual or Student Annual) held by an active Gold, Platinum, Icon or Atelier member of Marlowe Rewards takes `cut_annual` percentage points off the remake deposit percentage, an active Unlimited monthly plan (Standard Monthly or Express Monthly) held by such a member takes `cut_monthly` points off, and any other customer, including an Unlimited member below Gold, takes `cut_none`. Marlowe Rewards points earned on orders and posted in the last `pts_months` months take `pts_cut_high` percentage points off the remake deposit percentage at `pts_high` points or more, `pts_cut_mid` points off from `pts_mid` points up to `pts_high` points exclusive, and `pts_cut_none` below that. The work charge kept on the cancelled pair (its forfeited deposit entry) is set off against the remake deposit: `setoff_full` of it when the remake is taken within `setoff_full_days` days of the date the customer asked to cancel the pair, `setoff_part` when it is taken from `setoff_full_days` days exclusive up to `setoff_part_days` days, and `setoff_none` later; the date the customer asked to cancel is the date of the most recent cancellation request on the pair. The set-off is multiplied by `mult_long` when the cancelled pair was personalised and was cancelled `mult_long_after` days or more after its production started, by `mult_short` when it was personalised and cancelled sooner, and by `mult_none` when it carried no personalisation.'
    prerequisite:
    - problem: preorders_ext_made_to_order_work_charge
      kind: value_input
      gate: setoff_share
      form: state
      policy_source: A remake is taken only after the pair it remakes shows status cancelled, its cancellation request confirmed and no deposit left standing on it.
      condition: The remade pair's reservations.status is cancelled, its most recent reservation_requests row has request_status confirmed, and its reservation_events amounts sum to 0.00 (the work charge kept and the refund of the rest are both booked).
      resolved_by: confirm_made_to_order_cancellation_940e1e7b
      effect: Once the pair is cancelled and settled, the work charge kept stands on its history as a forfeited entry, so the set-off subtracts its share of that work charge instead of nothing.
    cross_category:
    - category: pass
      as: branch
      reads:
      - variant_name
      - status
      note: 'Unlimited reduction: the plan held and its status, together with the Marlowe Rewards tier, decide the percentage points taken off.'
    - category: loyalty
      as: history
      reads:
      - status
      - variant_name
      - loyalty_ledger.points
      - loyalty_ledger.posting_date
      - loyalty_ledger.event_type
      note: The tier held (for the Unlimited reduction) and the points earned in the last 12 months (points reduction).
    compute:
    - price: F('unit_price_usd') * F('quantity')
    - deposit_paid: SUM('reservation_events', 'amount_usd', event_type='preorders_deposit_captured')
    - work_charge_kept: 0 - SUM('reservation_events', 'amount_usd', event_type='preorders_deposit_forfeited')
    - last_request_on: LATEST('reservation_requests', 'created_at', date_field='created_at')
    - days_since_asked: DAYS(last_request_on, NOW)
    - paid_pct: RND(deposit_paid * 100 / price, 2)
    - carried_pct: paid_pct if days_since_asked <= K('carry_full_days') else ((paid_pct + P('deposit_pct')) / 2 if days_since_asked <= K('carry_half_days') else P('deposit_pct'))
    - plan: CFIELD('pass', 'variant_name')
    - plan_status: CFIELD('pass', 'status')
    - pass_member_tier: CFIELD('loyalty', 'variant_name', status='active')
    - pass_cut: K('cut_annual') if (((plan == 'Unlimited Standard Annual' or plan == 'Unlimited Express Annual' or plan == 'Unlimited Next-Day Annual' or plan == 'Unlimited Student Annual') and plan_status == 'active') and (pass_member_tier == 'Marlowe Rewards Gold' or pass_member_tier == 'Marlowe Rewards Platinum' or pass_member_tier == 'Marlowe Rewards Icon' or pass_member_tier == 'Marlowe Rewards Atelier')) else (K('cut_monthly') if (((plan == 'Unlimited Standard Monthly' or plan == 'Unlimited Express Monthly') and plan_status == 'active') and (pass_member_tier == 'Marlowe Rewards Gold' or pass_member_tier == 'Marlowe Rewards Platinum' or pass_member_tier == 'Marlowe Rewards Icon' or pass_member_tier == 'Marlowe Rewards Atelier')) else K('cut_none'))
    - points_earned: XSUM('loyalty', 'loyalty_ledger', 'points', within_months=K('pts_months'), date_field='posting_date', event_type='loyalty_points_earned')
    - points_cut: K('pts_cut_high') if points_earned >= K('pts_high') else (K('pts_cut_mid') if points_earned >= K('pts_mid') else K('pts_cut_none'))
    - setoff_share: K('setoff_full') if days_since_asked <= K('setoff_full_days') else (K('setoff_part') if days_since_asked <= K('setoff_part_days') else K('setoff_none'))
    - days_in_production: DAYS(F('production_start_date'), F('cancelled_date')) if F('status') == 'cancelled' else 0
    - setoff_mult: K('mult_long') if (F('personalization_text') != '' and days_in_production >= K('mult_long_after')) else (K('mult_short') if (F('personalization_text') != '' and days_in_production < K('mult_long_after')) else K('mult_none'))
    - deposit_pct_net: carried_pct - pass_cut - points_cut
    - result: RND(MX(price * deposit_pct_net / 100 - work_charge_kept * setoff_share * setoff_mult, P('deposit_min_usd')), 2)
    compute_basis:
      price: A remake is a new Made-to-Order Reservation taken for the style of a Made-to-Order pair the customer has cancelled, in the size and personalisation the customer now gives; it is reserved at the reserved unit price of the cancelled pair for one unit, and its original ship-by date is the reservation date plus `max_initial_ship_by_days` calendar days.
      deposit_paid: 'The remake deposit percentage carries the percentage paid on the cancelled pair, which is its deposit charged times 100 divided by its reserved unit price times its units, rounded half up to two decimal places: a remake taken within `carry_full_days` days of the date the customer asked to cancel the pair carries that paid percentage, a remake taken from `carry_full_days` days exclusive up to `carry_half_days` days carries the average of the paid percentage and `deposit_pct`, and a later remake takes `deposit_pct`.'
      work_charge_kept: 'The work charge kept on the cancelled pair (its forfeited deposit entry) is set off against the remake deposit: `setoff_full` of it when the remake is taken within `setoff_full_days` days of the date the customer asked to cancel the pair, `setoff_part` when it is taken from `setoff_full_days` days exclusive up to `setoff_part_days` days, and `setoff_none` later; the date the customer asked to cancel is the date of the most recent cancellation request on the pair.'
      last_request_on: 'The work charge kept on the cancelled pair (its forfeited deposit entry) is set off against the remake deposit: `setoff_full` of it when the remake is taken within `setoff_full_days` days of the date the customer asked to cancel the pair, `setoff_part` when it is taken from `setoff_full_days` days exclusive up to `setoff_part_days` days, and `setoff_none` later; the date the customer asked to cancel is the date of the most recent cancellation request on the pair.'
      days_since_asked: 'The work charge kept on the cancelled pair (its forfeited deposit entry) is set off against the remake deposit: `setoff_full` of it when the remake is taken within `setoff_full_days` days of the date the customer asked to cancel the pair, `setoff_part` when it is taken from `setoff_full_days` days exclusive up to `setoff_part_days` days, and `setoff_none` later; the date the customer asked to cancel is the date of the most recent cancellation request on the pair.'
      paid_pct: 'The remake deposit percentage carries the percentage paid on the cancelled pair, which is its deposit charged times 100 divided by its reserved unit price times its units, rounded half up to two decimal places: a remake taken within `carry_full_days` days of the date the customer asked to cancel the pair carries that paid percentage, a remake taken from `carry_full_days` days exclusive up to `carry_half_days` days carries the average of the paid percentage and `deposit_pct`, and a later remake takes `deposit_pct`.'
      carried_pct: 'The remake deposit percentage carries the percentage paid on the cancelled pair, which is its deposit charged times 100 divided by its reserved unit price times its units, rounded half up to two decimal places: a remake taken within `carry_full_days` days of the date the customer asked to cancel the pair carries that paid percentage, a remake taken from `carry_full_days` days exclusive up to `carry_half_days` days carries the average of the paid percentage and `deposit_pct`, and a later remake takes `deposit_pct`.'
      plan: An active Unlimited annual plan (Standard Annual, Express Annual, Next-Day Annual or Student Annual) held by an active Gold, Platinum, Icon or Atelier member of Marlowe Rewards takes `cut_annual` percentage points off the remake deposit percentage, an active Unlimited monthly plan (Standard Monthly or Express Monthly) held by such a member takes `cut_monthly` points off, and any other customer, including an Unlimited member below Gold, takes `cut_none`.
      plan_status: An active Unlimited annual plan (Standard Annual, Express Annual, Next-Day Annual or Student Annual) held by an active Gold, Platinum, Icon or Atelier member of Marlowe Rewards takes `cut_annual` percentage points off the remake deposit percentage, an active Unlimited monthly plan (Standard Monthly or Express Monthly) held by such a member takes `cut_monthly` points off, and any other customer, including an Unlimited member below Gold, takes `cut_none`.
      pass_cut: An active Unlimited annual plan (Standard Annual, Express Annual, Next-Day Annual or Student Annual) held by an active Gold, Platinum, Icon or Atelier member of Marlowe Rewards takes `cut_annual` percentage points off the remake deposit percentage, an active Unlimited monthly plan (Standard Monthly or Express Monthly) held by such a member takes `cut_monthly` points off, and any other customer, including an Unlimited member below Gold, takes `cut_none`.
      points_earned: Marlowe Rewards points earned on orders and posted in the last `pts_months` months take `pts_cut_high` percentage points off the remake deposit percentage at `pts_high` points or more, `pts_cut_mid` points off from `pts_mid` points up to `pts_high` points exclusive, and `pts_cut_none` below that.
      points_cut: Marlowe Rewards points earned on orders and posted in the last `pts_months` months take `pts_cut_high` percentage points off the remake deposit percentage at `pts_high` points or more, `pts_cut_mid` points off from `pts_mid` points up to `pts_high` points exclusive, and `pts_cut_none` below that.
      setoff_share: 'The work charge kept on the cancelled pair (its forfeited deposit entry) is set off against the remake deposit: `setoff_full` of it when the remake is taken within `setoff_full_days` days of the date the customer asked to cancel the pair, `setoff_part` when it is taken from `setoff_full_days` days exclusive up to `setoff_part_days` days, and `setoff_none` later; the date the customer asked to cancel is the date of the most recent cancellation request on the pair.'
      days_in_production: The set-off is multiplied by `mult_long` when the cancelled pair was personalised and was cancelled `mult_long_after` days or more after its production started, by `mult_short` when it was personalised and cancelled sooner, and by `mult_none` when it carried no personalisation.
      setoff_mult: The set-off is multiplied by `mult_long` when the cancelled pair was personalised and was cancelled `mult_long_after` days or more after its production started, by `mult_short` when it was personalised and cancelled sooner, and by `mult_none` when it carried no personalisation.
      deposit_pct_net: The two percentage-point reductions below are subtracted from the remake deposit percentage before it is applied to the price, and the work-charge set-off is then subtracted from that amount before the floor.
      result: The deposit on a remake is the remake's reserved unit price times its units times the remake deposit percentage, divided by 100; the standard remake deposit percentage is the type's `deposit_pct`. The remake deposit is never less than `deposit_min_usd`, the floor applying last, and it is rounded half up to the cent once, at the end; it is charged to the card at reservation. The two percentage-point reductions below are subtracted from the remake deposit percentage before it is applied to the price, and the work-charge set-off is then subtracted from that amount before the floor.
      pass_member_tier: An active Unlimited annual plan (Standard Annual, Express Annual, Next-Day Annual or Student Annual) held by an active Gold, Platinum, Icon or Atelier member of Marlowe Rewards takes `cut_annual` percentage points off the remake deposit percentage, an active Unlimited monthly plan (Standard Monthly or Express Monthly) held by such a member takes `cut_monthly` points off, and any other customer, including an Unlimited member below Gold, takes `cut_none`.
    factors:
    - id: paid_percentage_carry
      effect: method
      decides: carried_pct
      bindings:
      - deposit_paid
      - paid_pct
      - carried_pct
      ladder:
      - when: remake taken within `carry_full_days` days of the date the customer asked to cancel the pair
        method: carry the percentage paid on the cancelled pair
      - when: remake taken from `carry_full_days` days exclusive up to `carry_half_days` days
        method: take the average of the paid percentage and `deposit_pct`
      - when: otherwise
        method: take `deposit_pct`
      baseline:
        carried_pct: P('deposit_pct')
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: unlimited_plan_reduction
      effect: parameter
      decides: pass_cut
      bindings:
      - plan
      - plan_status
      - pass_member_tier
      - pass_cut
      ladder:
      - when: active Unlimited annual plan (pass record) AND active Gold, Platinum, Icon or Atelier membership (Marlowe Rewards record)
        value: K('cut_annual')
      - when: active Unlimited monthly plan (pass record) AND active Gold, Platinum, Icon or Atelier membership (Marlowe Rewards record)
        value: K('cut_monthly')
      - when: otherwise
        value: K('cut_none')
      baseline:
        pass_cut: K('cut_none')
      evidence:
      - cross_category
      cross_difficulty: pass
    - id: rewards_points_reduction
      effect: parameter
      decides: points_cut
      bindings:
      - points_earned
      - points_cut
      ladder:
      - when: '`pts_high` points or more earned in the last `pts_months` months'
        value: K('pts_cut_high')
      - when: '`pts_mid` up to `pts_high` points exclusive'
        value: K('pts_cut_mid')
      - when: otherwise
        value: K('pts_cut_none')
      baseline:
        points_cut: K('pts_cut_none')
      evidence:
      - cross_category
      - history
      cross_difficulty: loyalty
    - id: work_charge_setoff
      effect: parameter
      decides: setoff_share
      bindings:
      - work_charge_kept
      - last_request_on
      - days_since_asked
      - setoff_share
      ladder:
      - when: remake within `setoff_full_days` days of the date the customer asked to cancel the pair
        value: K('setoff_full')
      - when: remake from `setoff_full_days` days exclusive up to `setoff_part_days` days
        value: K('setoff_part')
      - when: otherwise
        value: K('setoff_none')
      baseline:
        setoff_share: K('setoff_none')
      evidence:
      - history
      - date
      cross_difficulty: null
    - id: setoff_personalisation_multiplier
      effect: parameter
      decides: setoff_mult
      bindings:
      - days_in_production
      - setoff_mult
      ladder:
      - when: personalised pair cancelled `mult_long_after` days or more after production started
        value: K('mult_long')
      - when: personalised pair cancelled sooner
        value: K('mult_short')
      - when: otherwise
        value: K('mult_none')
      baseline:
        setoff_mult: K('mult_none')
      evidence:
      - date
      cross_difficulty: null
    baseline:
      rule: The deposit on a remake is the remake's reserved unit price times its units times the remake deposit percentage, divided by 100; the standard remake deposit percentage is the type's `deposit_pct`. The remake deposit is never less than `deposit_min_usd`, the floor applying last, and it is rounded half up to the cent once, at the end; it is charged to the card at reservation.
      params:
      - deposit_pct
      - deposit_min_usd
