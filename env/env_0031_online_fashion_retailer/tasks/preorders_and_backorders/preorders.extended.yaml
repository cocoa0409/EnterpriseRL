  - id: preorders_ext_replacement_deposit
    base_policy_refs:
    - preorders_reservation
    - preorders_agg_multi_holding
    - preorders_agg_launch_style_limit
    - preorders_evt_deposit
    - preorders_evt_size_change
    overwrite:
    - base_policy: preorders_reservation
      superseded_clause: The deposit is `deposit_pct` percent of unit price times quantity, rounded per `deposit_rounding`, but never less than `deposit_min_usd`.
      replaced_by: The deposit on a replacement is its reserved unit price times its units times the replacement deposit percentage, divided by 100; the standard replacement deposit percentage is the type's `deposit_pct`.
    trigger: on_request
    subject:
    - preorders_reserved
    - preorders_deposit_captured
    computes: deposit_required_usd
    target_tool: take_replacement_reservation_e3795f43
    params:
      rep_top: 10
      rep_high: 15
      wait_long_days: 60
      wait_mid_days: 30
      wait_long_factor: 0.8
      wait_mid_factor: 0.9
      wait_none_factor: 1.0
      setoff_full_days: 7
      setoff_part_days: 30
      setoff_full: 0.4
      setoff_part: 0.2
      setoff_none: 0.0
      app_months: 12
      app_many: 6
      app_some: 3
      app_cut_many: 2
      app_cut_some: 1
      app_cut_none: 0
      app_long_months: 60
      app_long_window: 24
      app_long_years: 2
      app_new_months: 12
    rule: 'A Deposit Pre-Order whose one size change has been used can still be had in another size of the same style through a replacement: a new Deposit Pre-Order for the same style and colour in the size the customer now gives, carrying the reserved unit price, the units and the original and current ship-by dates of the reservation it replaces. A replacement is taken only after the reservation it replaces shows status cancelled with its deposit settled to nothing. The deposit on a replacement is not worked out until the reservation it replaces carries its protected reserved price as its reserved unit price. A replacement is not taken until every Made-to-Order Reservation the customer holds in status reserved shows its deposit charged. The deposit on a replacement is its reserved unit price times its units times the replacement deposit percentage, divided by 100; the standard replacement deposit percentage is the type''s `deposit_pct`. The replacement deposit is never less than `deposit_min_usd`, the floor applying last, and is rounded half up to the cent once, at the end; it is charged to the card at reservation. The replacement deposit percentage is first set by tier, then scaled by the waiting factor, and the apparel reduction is then subtracted from it in percentage points before it is applied to the price; the share of the cancellation charge set off below is subtracted from that amount before the floor. The replacement deposit percentage is `rep_top` for an active Icon or Atelier member, `rep_high` for an active Gold or Platinum member, and the type''s `deposit_pct` for every other customer. Because the customer has already waited on the reservation replaced, the replacement deposit percentage is multiplied by `wait_long_factor` when that reservation was held `wait_long_days` days or more from its reservation date to its cancellation, by `wait_mid_factor` when held `wait_mid_days` up to `wait_long_days` days exclusive, and left as it is (`wait_none_factor`) when held for less. The cancellation charge kept on the reservation replaced (its forfeited deposit entry) is set off against the replacement deposit: `setoff_full` of it when the replacement is taken within `setoff_full_days` days of that reservation''s cancellation date, `setoff_part` from `setoff_full_days` days exclusive up to `setoff_part_days` days, and `setoff_none` later. The apparel reduction rests on the customer''s apparel lines booked on Marlowe & Finch orders, counted over a window that depends on the membership: for a member enrolled `app_long_months` months or more, the lines of the last `app_long_window` months divided by `app_long_years` (a yearly average); for a member enrolled fewer than `app_new_months` months, the lines since the month of enrolment; for every other customer, the lines of the last `app_months` months. That count takes `app_cut_many` percentage points off the replacement deposit percentage at `app_many` lines or more, `app_cut_some` points from `app_some` up to `app_many` lines exclusive, and `app_cut_none` below that.'
    prerequisite:
    - problem: preorders_ext_preorder_cancellation_charge
      kind: value_input
      gate: setoff_share
      form: state
      policy_source: A replacement is taken only after the reservation it replaces shows status cancelled with its deposit settled to nothing.
      condition: The replaced reservation's reservations.status is cancelled and its reservation_events amounts sum to 0.00 (charge kept and rest refunded booked).
      resolved_by: confirm_preorder_cancellation_aa3f8734
      effect: setoff_share moves from setoff_none to the share the days since the cancellation give, the charge kept enters the set-off, and the held-days count runs to the cancellation date.
    - problem: preorders_ext_price_protection
      kind: value_input
      gate: price
      form: state
      policy_source: The deposit on a replacement is not worked out until the reservation it replaces carries its protected reserved price as its reserved unit price.
      condition: The replaced reservation's reservations.unit_price_usd equals its protected reserved price as price protection defines it.
      resolved_by: lower_reserved_price_a108b215
      effect: The price binding moves to the protected price, which the replacement carries and its deposit percentage acts on.
    - problem: preorders_ext_made_to_order_deposit
      kind: state_gate
      gate: reservation_events.amount_usd
      form: state
      policy_source: A replacement is not taken until every Made-to-Order Reservation the customer holds in status reserved shows its deposit charged.
      condition: Every reservation of the customer of type Made-to-Order Reservation in status reserved carries a preorders_deposit_captured row in reservation_events.
      resolved_by: pay_reservation_deposit_93996964
      effect: Once every reserved made-to-order reservation shows its deposit charged, the replacement may be taken.
    cross_category:
    - category: loyalty
      as: branch
      reads:
      - status
      - variant_name
      - enrolled_date
      note: The tier sets the replacement deposit percentage; the enrolment date sets the apparel window.
    - category: orders
      as: history
      reads:
      - order_lines.product_class
      - order_lines.event_date
      note: Apparel lines booked in the last 12 months take percentage points off.
    compute:
    - price: F('unit_price_usd') * F('quantity')
    - rep_tier: CFIELD('loyalty', 'variant_name', status='active')
    - rep_pct: K('rep_top') if (rep_tier == 'Marlowe Rewards Icon' or rep_tier == 'Marlowe Rewards Atelier') else (K('rep_high') if (rep_tier == 'Marlowe Rewards Gold' or rep_tier == 'Marlowe Rewards Platinum') else P('deposit_pct'))
    - held_days: DAYS(F('reserved_date'), F('cancelled_date')) if F('status') == 'cancelled' else DAYS(F('reserved_date'), NOW)
    - wait_factor: K('wait_long_factor') if held_days >= K('wait_long_days') else (K('wait_mid_factor') if held_days >= K('wait_mid_days') else K('wait_none_factor'))
    - charge_kept: 0 - SUM('reservation_events', 'amount_usd', event_type='preorders_deposit_forfeited')
    - days_since_cancel: DAYS(F('cancelled_date'), NOW) if F('status') == 'cancelled' else 0
    - app_tenure: MONTHS(CFIELD('loyalty', 'enrolled_date', status='active'), NOW)
    - app_window: K('app_long_window') if app_tenure >= K('app_long_months') else (app_tenure + 1 if app_tenure < K('app_new_months') else K('app_months'))
    - app_divisor: K('app_long_years') if app_tenure >= K('app_long_months') else 1
    - setoff_share: K('setoff_full') if days_since_cancel <= K('setoff_full_days') else (K('setoff_part') if days_since_cancel <= K('setoff_part_days') else K('setoff_none'))
    - apparel_lines: XCOUNT('orders', 'order_lines', within_months=app_window, date_field='event_date', event_type='orders_line_booked', product_class='apparel') / app_divisor
    - apparel_cut: K('app_cut_many') if apparel_lines >= K('app_many') else (K('app_cut_some') if apparel_lines >= K('app_some') else K('app_cut_none'))
    - pct_net: rep_pct * wait_factor - apparel_cut
    - result: RND(MX(price * pct_net / 100 - charge_kept * setoff_share, P('deposit_min_usd')), 2)
    compute_basis:
      price: 'A Deposit Pre-Order whose one size change has been used can still be had in another size of the same style through a replacement: a new Deposit Pre-Order for the same style and colour in the size the customer now gives, carrying the reserved unit price, the units and the original and current ship-by dates of the reservation it replaces.'
