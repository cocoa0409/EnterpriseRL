      held_days: A reservation held `wait_long_days` days or more since its reservation date adds `wait_long_add` to the protection limit, one held `wait_mid_days` days up to `wait_long_days` days exclusive adds `wait_mid_add`, and a younger one adds `wait_none_add`.
      wait_add: A reservation held `wait_long_days` days or more since its reservation date adds `wait_long_add` to the protection limit, one held `wait_mid_days` days up to `wait_long_days` days exclusive adds `wait_mid_add`, and a younger one adds `wait_none_add`.
      plan: An active Unlimited annual plan (Standard Annual, Express Annual, Next-Day Annual or Student Annual) held by an active Gold, Platinum, Icon or Atelier member of Marlowe Rewards adds `pass_annual_add` to the protection limit, an active Unlimited monthly plan (Standard Monthly or Express Monthly) held by such a member adds `pass_monthly_add`, and any other customer, including an Unlimited member below Gold, adds `pass_none_add`.
      plan_status: An active Unlimited annual plan (Standard Annual, Express Annual, Next-Day Annual or Student Annual) held by an active Gold, Platinum, Icon or Atelier member of Marlowe Rewards adds `pass_annual_add` to the protection limit, an active Unlimited monthly plan (Standard Monthly or Express Monthly) held by such a member adds `pass_monthly_add`, and any other customer, including an Unlimited member below Gold, adds `pass_none_add`.
      pass_add: An active Unlimited annual plan (Standard Annual, Express Annual, Next-Day Annual or Student Annual) held by an active Gold, Platinum, Icon or Atelier member of Marlowe Rewards adds `pass_annual_add` to the protection limit, an active Unlimited monthly plan (Standard Monthly or Express Monthly) held by such a member adds `pass_monthly_add`, and any other customer, including an Unlimited member below Gold, adds `pass_none_add`.
      price_floor: The reserved unit price is never lowered by more than the protection limit, a share of the reserved unit price whose standard value is `limit_standard`; the price this protection gives the reservation, its protected reserved price, is the higher of the protected price and the reserved unit price times one minus the protection limit, never above the reserved unit price, rounded half up to the cent once, at the end, and it is the reserved unit price itself when no qualifying booking is lower.
      result: The reserved unit price is never lowered by more than the protection limit, a share of the reserved unit price whose standard value is `limit_standard`; the price this protection gives the reservation, its protected reserved price, is the higher of the protected price and the reserved unit price times one minus the protection limit, never above the reserved unit price, rounded half up to the cent once, at the end, and it is the reserved unit price itself when no qualifying booking is lower.
      style_clr_date: 'The bookings that can set the protected price depend on the member: an active Icon or Atelier member enrolled `top_months` months or more is protected by the most recent booking of the reserved style in any colour or size at regular or clearance price, a regular-price booking winning when both fall on the same day; an active Gold or Platinum member enrolled `high_months` months or more by the most recent regular-price booking of the reserved style in any colour or size; every other customer by the most recent regular-price booking of the reserved SKU itself.'
      style_clr_price: 'The bookings that can set the protected price depend on the member: an active Icon or Atelier member enrolled `top_months` months or more is protected by the most recent booking of the reserved style in any colour or size at regular or clearance price, a regular-price booking winning when both fall on the same day; an active Gold or Platinum member enrolled `high_months` months or more by the most recent regular-price booking of the reserved style in any colour or size; every other customer by the most recent regular-price booking of the reserved SKU itself.'
      pass_member_tier: An active Unlimited annual plan (Standard Annual, Express Annual, Next-Day Annual or Student Annual) held by an active Gold, Platinum, Icon or Atelier member of Marlowe Rewards adds `pass_annual_add` to the protection limit, an active Unlimited monthly plan (Standard Monthly or Express Monthly) held by such a member adds `pass_monthly_add`, and any other customer, including an Unlimited member below Gold, adds `pass_none_add`.
    factors:
    - id: qualifying_booking_selection
      effect: method
      decides: protected_price
      bindings:
      - member_tier
      - member_months
      - style_clr_date
      - style_clr_price
      - style_reg_date
      - style_reg_price
      - sku_reg_date
      - sku_reg_price
      - protected_price
      ladder:
      - when: active Icon or Atelier member AND enrolled `top_months` months or more
        method: the most recent booking of the reserved style in any colour or size at regular or clearance price
      - when: active Gold or Platinum member AND enrolled `high_months` months or more
        method: the most recent regular-price booking of the reserved style in any colour or size
      - when: otherwise
        method: the most recent regular-price booking of the reserved SKU itself
      baseline:
        protected_price: sku_reg_price if (sku_reg_date != None and DAYS(F('reserved_date'), sku_reg_date) >= 0) else reserved_price
      evidence:
      - cross_category
      - history
      - date
      cross_difficulty: orders
    - id: protection_limit
      effect: parameter
      decides: limit_base
      bindings:
      - limit_tier
      - limit_base
      ladder:
      - when: active Icon or Atelier member
        value: K('limit_top')
      - when: active Gold or Platinum member
        value: K('limit_high')
      - when: otherwise
        value: K('limit_standard')
      baseline:
        limit_base: K('limit_standard')
      evidence:
      - cross_category
      cross_difficulty: loyalty
    - id: waiting_addition
      effect: parameter
      decides: wait_add
      bindings:
      - held_days
      - wait_add
      ladder:
      - when: held `wait_long_days` days or more
        value: K('wait_long_add')
      - when: held `wait_mid_days` up to `wait_long_days` days exclusive
        value: K('wait_mid_add')
      - when: otherwise
        value: K('wait_none_add')
      baseline:
        wait_add: K('wait_none_add')
      evidence:
      - date
      cross_difficulty: null
    - id: unlimited_limit_addition
      effect: parameter
      decides: pass_add
      bindings:
      - plan
      - plan_status
      - pass_member_tier
      - pass_add
      ladder:
      - when: active Unlimited annual plan (pass record) AND active Gold, Platinum, Icon or Atelier membership (Marlowe Rewards record)
        value: K('pass_annual_add')
      - when: active Unlimited monthly plan (pass record) AND active Gold, Platinum, Icon or Atelier membership (Marlowe Rewards record)
        value: K('pass_monthly_add')
      - when: otherwise
        value: K('pass_none_add')
      baseline:
        pass_add: K('pass_none_add')
      evidence:
      - cross_category
      cross_difficulty: pass
    baseline:
      rule: The standard protected price is the unit price of the most recent regular-price booking of the reserved SKU itself, and the reserved unit price is lowered to it only when it is lower. The reserved unit price is never lowered by more than the protection limit, a share of the reserved unit price whose standard value is `limit_standard`; the price this protection gives the reservation, its protected reserved price, is the higher of the protected price and the reserved unit price times one minus the protection limit, never above the reserved unit price, rounded half up to the cent once, at the end, and it is the reserved unit price itself when no qualifying booking is lower.
      params:
      - limit_standard
    inputs:
      history:
      - category: orders
        table: order_lines
        aggregate: latest
        field: unit_price_usd
        within_months: null
        filters:
          event_type: orders_line_booked
      cross_category:
      - orders
      - loyalty
      - pass
  - id: preorders_ext_preorder_cancellation_charge
    base_policy_refs:
    - preorders_evt_cancellation_refund
    - preorders_evt_deposit
    overwrite:
    - base_policy: preorders_evt_cancellation_refund
      superseded_clause: Before the cutoff the deposit is refunded in full (`deposit_refundable_before_cutoff`).
      replaced_by: When a customer cancels an unallocated Deposit Pre-Order at will, Marlowe & Finch keeps a cancellation charge from the deposit and refunds the rest of the deposit to the original card, and the customer confirms that cancellation in person; a cancellation at will of any other type before its cutoff is still refunded in full.
    - base_policy: preorders_evt_cancellation_refund
      superseded_clause: A refund or forfeiture is booked only once the reservation is in status cancelled.
      replaced_by: The customer's confirmation, the cancellation, the charge kept and the refund of the rest are booked together, the cancellation first.
    trigger: on_request
    subject:
    - preorders_cancelled
    - preorders_deposit_forfeited
    - preorders_deposit_refunded
    computes: cancellation_charge_usd
    target_tool: confirm_preorder_cancellation_aa3f8734
    params:
      rate_standard: 0.1
      rate_late: 0.15
      rate_early: 0.05
      late_days: 15
      early_days: 60
      waive_long_months: 60
      waive_long: 0.5
      waive_short: 0.75
      waive_none: 1.0
      ret_many_from: 3
      ret_many: 1.2
      ret_some: 1.1
      ret_none: 1.0
      pts_months: 12
      pts_high: 5000
      pts_mid: 2000
      pts_rel_high: 0.8
      pts_rel_mid: 0.9
      pts_rel_none: 1.0
      ret_months: 12
    rule: 'When a customer cancels an unallocated Deposit Pre-Order at will, Marlowe & Finch keeps a cancellation charge from the deposit and refunds the rest of the deposit to the original card, and the customer confirms that cancellation in person; a cancellation at will of any other type before its cutoff is still refunded in full. The customer''s confirmation, the cancellation, the charge kept and the refund of the rest are booked together, the cancellation first. The cancellation charge is fixed only after the reserved unit price stands at the reservation''s protected reserved price. Once any delay notice has been sent for the reservation, no cancellation charge is kept and the whole deposit is refunded. The cancellation charge is the reserved unit price times the units times the charge rate; the standard charge rate is `rate_standard`. The charge never exceeds the deposit held on the reservation and is rounded half up to the cent once, at the end; the refund of the rest is the deposit held less the charge. The charge rate, the waiver, the returns adjustment and the points relief below are multiplied together with the reserved price in one product, and the cap at the deposit held and the rounding apply to that product. The charge rate follows how close the cancellation comes to the ship-by date in force, counted in calendar days from today to that date: fewer than `late_days` days gives `rate_late`, more than `early_days` days gives `rate_early`, and anything in between gives the standard charge rate. A member whose tier carries the restocking-fee waiver of the Marlowe Rewards charter and who has been enrolled `waive_long_months` months or more has the charge multiplied by `waive_long`; such a member enrolled for less has it multiplied by `waive_short`; every other customer by `waive_none`. Return authorizations opened on the customer''s profile in the last `ret_months` months, whatever became of them, multiply the charge by `ret_many` when there are `ret_many_from` or more, by `ret_some` when there are one up to `ret_many_from` exclusive, and by `ret_none` when there are none. The points relief rests on the Marlowe Rewards points counted over the last `pts_months` months, counted as follows: for an active Platinum, Icon or Atelier member, every earning and bonus entry by its posting date, points still pending included; for an active Gold or Silver member, every earning entry by its posting date, points still pending included; for every other customer, every earning entry by the date its points became available, so points still pending are left out. Those points multiply the charge by `pts_rel_high` at `pts_high` points or more, by `pts_rel_mid` from `pts_mid` points up to `pts_high` points exclusive, and by `pts_rel_none` below that.'
    prerequisite:
    - problem: preorders_ext_price_protection
      kind: value_input
      gate: price
      form: state
      policy_source: The cancellation charge is fixed only after the reserved unit price stands at the reservation's protected reserved price.
      condition: The reservation's reservations.unit_price_usd equals its protected reserved price as price protection defines it (unchanged where no qualifying booking is lower).
      resolved_by: lower_reserved_price_a108b215
      effect: The price binding (reserved unit price times units) moves to the protected price, so the percentage charge is worked out on the lowered price.
    cross_category:
    - category: loyalty
      as: branch
      reads:
      - status
      - variant_name
      - enrolled_date
      - restocking_fee_waiver
      - loyalty_ledger.points
      - loyalty_ledger.posting_date
      - loyalty_ledger.available_date
      - loyalty_ledger.event_type
      note: The waiver follows the tier's restocking-fee waiver and the enrolment date; the tier decides how points are counted for the points relief.
    - category: returns
      as: history
      reads:
      - return_cases.opened_date
      note: Return authorizations opened in the tier's look-back decide the returns adjustment.
    compute:
    - price: F('unit_price_usd') * F('quantity')
    - held: SUM('reservation_events', 'amount_usd')
    - notices: COUNT('reservation_events', event_type='preorders_delay_notified')
    - days_to_ship: DAYS(NOW, F('current_ship_by_date'))
    - charge_rate: K('rate_late') if days_to_ship < K('late_days') else (K('rate_early') if days_to_ship > K('early_days') else K('rate_standard'))
    - waiver: CPARAM('loyalty', 'restocking_fee_waiver', status='active')
    - waiver_months: MONTHS(CFIELD('loyalty', 'enrolled_date', status='active'), NOW)
    - waiver_mult: K('waive_long') if (waiver == True and waiver_months >= K('waive_long_months')) else (K('waive_short') if (waiver == True and waiver_months < K('waive_long_months')) else K('waive_none'))
    - returns_opened: XCOUNT('returns', 'return_cases', within_months=K('ret_months'), date_field='opened_date')
    - returns_mult: K('ret_many') if returns_opened >= K('ret_many_from') else (K('ret_some') if returns_opened >= 1 else K('ret_none'))
    - pts_tier: CFIELD('loyalty', 'variant_name', status='active')
    - pts_posted_all: XSUM('loyalty', 'loyalty_ledger', 'points', within_months=K('pts_months'), date_field='posting_date', event_type='loyalty_points_earned') + XSUM('loyalty', 'loyalty_ledger', 'points', within_months=K('pts_months'), date_field='posting_date', event_type='loyalty_bonus_posted')
    - pts_posted_earned: XSUM('loyalty', 'loyalty_ledger', 'points', within_months=K('pts_months'), date_field='posting_date', event_type='loyalty_points_earned')
    - pts_available_earned: XSUM('loyalty', 'loyalty_ledger', 'points', within_months=K('pts_months'), date_field='available_date', event_type='loyalty_points_earned')
    - points_counted: pts_posted_all if (pts_tier == 'Marlowe Rewards Platinum' or pts_tier == 'Marlowe Rewards Icon' or pts_tier == 'Marlowe Rewards Atelier') else (pts_posted_earned if (pts_tier == 'Marlowe Rewards Gold' or pts_tier == 'Marlowe Rewards Silver') else pts_available_earned)
    - points_mult: K('pts_rel_high') if points_counted >= K('pts_high') else (K('pts_rel_mid') if points_counted >= K('pts_mid') else K('pts_rel_none'))
    - charge_raw: price * charge_rate * waiver_mult * returns_mult * points_mult
    - result: 0.0 if notices > 0 else RND(MN(held, charge_raw), 2)
    compute_basis:
      price: The cancellation charge is the reserved unit price times the units times the charge rate; the standard charge rate is `rate_standard`.
      held: The charge never exceeds the deposit held on the reservation and is rounded half up to the cent once, at the end; the refund of the rest is the deposit held less the charge.
      notices: Once any delay notice has been sent for the reservation, no cancellation charge is kept and the whole deposit is refunded.
      days_to_ship: 'The charge rate follows how close the cancellation comes to the ship-by date in force, counted in calendar days from today to that date: fewer than `late_days` days gives `rate_late`, more than `early_days` days gives `rate_early`, and anything in between gives the standard charge rate.'
      charge_rate: 'The charge rate follows how close the cancellation comes to the ship-by date in force, counted in calendar days from today to that date: fewer than `late_days` days gives `rate_late`, more than `early_days` days gives `rate_early`, and anything in between gives the standard charge rate.'
      waiver: A member whose tier carries the restocking-fee waiver of the Marlowe Rewards charter and who has been enrolled `waive_long_months` months or more has the charge multiplied by `waive_long`; such a member enrolled for less has it multiplied by `waive_short`; every other customer by `waive_none`.
      waiver_months: A member whose tier carries the restocking-fee waiver of the Marlowe Rewards charter and who has been enrolled `waive_long_months` months or more has the charge multiplied by `waive_long`; such a member enrolled for less has it multiplied by `waive_short`; every other customer by `waive_none`.
      waiver_mult: A member whose tier carries the restocking-fee waiver of the Marlowe Rewards charter and who has been enrolled `waive_long_months` months or more has the charge multiplied by `waive_long`; such a member enrolled for less has it multiplied by `waive_short`; every other customer by `waive_none`.
      returns_opened: Return authorizations opened on the customer's profile in the last `ret_months` months, whatever became of them, multiply the charge by `ret_many` when there are `ret_many_from` or more, by `ret_some` when there are one up to `ret_many_from` exclusive, and by `ret_none` when there are none.
      returns_mult: Return authorizations opened on the customer's profile in the last `ret_months` months, whatever became of them, multiply the charge by `ret_many` when there are `ret_many_from` or more, by `ret_some` when there are one up to `ret_many_from` exclusive, and by `ret_none` when there are none.
      points_mult: Those points multiply the charge by `pts_rel_high` at `pts_high` points or more, by `pts_rel_mid` from `pts_mid` points up to `pts_high` points exclusive, and by `pts_rel_none` below that.
      charge_raw: The charge rate, the waiver, the returns adjustment and the points relief below are multiplied together with the reserved price in one product, and the cap at the deposit held and the rounding apply to that product.
      result: The charge never exceeds the deposit held on the reservation and is rounded half up to the cent once, at the end; the refund of the rest is the deposit held less the charge.
      pts_tier: 'The points relief rests on the Marlowe Rewards points counted over the last `pts_months` months, counted as follows: for an active Platinum, Icon or Atelier member, every earning and bonus entry by its posting date, points still pending included; for an active Gold or Silver member, every earning entry by its posting date, points still pending included; for every other customer, every earning entry by the date its points became available, so points still pending are left out.'
      pts_posted_all: 'The points relief rests on the Marlowe Rewards points counted over the last `pts_months` months, counted as follows: for an active Platinum, Icon or Atelier member, every earning and bonus entry by its posting date, points still pending included; for an active Gold or Silver member, every earning entry by its posting date, points still pending included; for every other customer, every earning entry by the date its points became available, so points still pending are left out.'
      pts_posted_earned: 'The points relief rests on the Marlowe Rewards points counted over the last `pts_months` months, counted as follows: for an active Platinum, Icon or Atelier member, every earning and bonus entry by its posting date, points still pending included; for an active Gold or Silver member, every earning entry by its posting date, points still pending included; for every other customer, every earning entry by the date its points became available, so points still pending are left out.'
      pts_available_earned: 'The points relief rests on the Marlowe Rewards points counted over the last `pts_months` months, counted as follows: for an active Platinum, Icon or Atelier member, every earning and bonus entry by its posting date, points still pending included; for an active Gold or Silver member, every earning entry by its posting date, points still pending included; for every other customer, every earning entry by the date its points became available, so points still pending are left out.'
      points_counted: 'The points relief rests on the Marlowe Rewards points counted over the last `pts_months` months, counted as follows: for an active Platinum, Icon or Atelier member, every earning and bonus entry by its posting date, points still pending included; for an active Gold or Silver member, every earning entry by its posting date, points still pending included; for every other customer, every earning entry by the date its points became available, so points still pending are left out.'
    factors:
    - id: ship_by_proximity_rate
      effect: parameter
      decides: charge_rate
      bindings:
      - days_to_ship
      - charge_rate
      ladder:
      - when: fewer than `late_days` days to the ship-by date in force
        value: K('rate_late')
      - when: more than `early_days` days to it
        value: K('rate_early')
      - when: otherwise
        value: K('rate_standard')
      baseline:
        charge_rate: K('rate_standard')
      evidence:
      - date
      cross_difficulty: null
    - id: restocking_waiver
      effect: parameter
      decides: waiver_mult
      bindings:
      - waiver
      - waiver_months
      - waiver_mult
      ladder:
      - when: tier with the restocking-fee waiver AND enrolled `waive_long_months` months or more
        value: K('waive_long')
      - when: tier with the waiver AND enrolled fewer months
        value: K('waive_short')
      - when: otherwise
        value: K('waive_none')
      baseline:
        waiver_mult: K('waive_none')
      evidence:
      - cross_category
      - tier_param
      - date
      cross_difficulty: loyalty
    - id: returns_adjustment
      effect: parameter
      decides: returns_mult
      bindings:
      - returns_opened
      - returns_mult
      ladder:
      - when: '`ret_many_from` or more return authorizations in the last `ret_months` months'
        value: K('ret_many')
      - when: one up to `ret_many_from` exclusive
        value: K('ret_some')
      - when: otherwise
        value: K('ret_none')
      baseline:
        returns_mult: K('ret_none')
      evidence:
      - cross_category
      - history
      cross_difficulty: returns
    - id: points_count_method
      effect: method
      decides: points_counted
      bindings:
      - pts_tier
      - pts_posted_all
      - pts_posted_earned
      - points_counted
      ladder:
      - when: active Platinum, Icon or Atelier member
        method: count every earning and bonus entry by its posting date, pending points included
      - when: active Gold or Silver member
        method: count every earning entry by its posting date, pending points included
      - when: otherwise
        method: count every earning entry by the date its points became available, pending points left out
      baseline:
        points_counted: pts_available_earned
      evidence:
      - cross_category
      - history
      - date
      cross_difficulty: loyalty
    - id: points_relief
      effect: parameter
