  - id: preorders_ext_price_protection
    base_policy_refs:
    - preorders_evt_price_protection
    overwrite:
    - base_policy: preorders_evt_price_protection
      superseded_clause: 'Where `price_protection` applies, the customer pays the lowest regular site price of the reserved SKU between the reservation date and shipment (`price_protection_basis`): when the regular price drops, the reserved unit price is lowered before shipment (`price_protection_application`).'
      replaced_by: The reserved unit price is never lowered by more than the protection limit, a share of the reserved unit price whose standard value is `limit_standard`; the price this protection gives the reservation, its protected reserved price, is the higher of the protected price and the reserved unit price times one minus the protection limit, never above the reserved unit price, rounded half up to the cent once, at the end, and it is the reserved unit price itself when no qualifying booking is lower.
    - base_policy: preorders_evt_price_protection
      superseded_clause: Clearance, flash-sale and code-only prices never count, and a price rise never raises the reserved price.
      replaced_by: 'The bookings that can set the protected price depend on the member: an active Icon or Atelier member enrolled `top_months` months or more is protected by the most recent booking of the reserved style in any colour or size at regular or clearance price, a regular-price booking winning when both fall on the same day; an active Gold or Platinum member enrolled `high_months` months or more by the most recent regular-price booking of the reserved style in any colour or size; every other customer by the most recent regular-price booking of the reserved SKU itself.'
    trigger: state_due
    subject:
    - preorders_price_lowered
    computes: new_unit_price_usd
    target_tool: lower_reserved_price_a108b215
    params:
      limit_standard: 0.05
      limit_high: 0.1
      limit_top: 0.15
      top_months: 36
      high_months: 24
      wait_long_days: 60
      wait_mid_days: 30
      wait_long_add: 0.03
      wait_mid_add: 0.01
      wait_none_add: 0.0
      pass_annual_add: 0.02
      pass_monthly_add: 0.01
      pass_none_add: 0.0
    rule: 'Price protection lowers the reserved unit price of a Deposit Pre-Order, Seasonal Pre-Order or back-order still in status reserved, awaiting_consent, in_production or allocated; a lowered price never rises again and a higher price never raises the reserved price. A lower price counts only as recorded by a Marlowe & Finch sale: a booked order line on the customer''s own orders whose booking date is on or after the reservation date, the most recent qualifying booking giving the protected price. The standard protected price is the unit price of the most recent regular-price booking of the reserved SKU itself, and the reserved unit price is lowered to it only when it is lower. The reserved unit price is never lowered by more than the protection limit, a share of the reserved unit price whose standard value is `limit_standard`; the price this protection gives the reservation, its protected reserved price, is the higher of the protected price and the reserved unit price times one minus the protection limit, never above the reserved unit price, rounded half up to the cent once, at the end, and it is the reserved unit price itself when no qualifying booking is lower. The bookings that can set the protected price depend on the member: an active Icon or Atelier member enrolled `top_months` months or more is protected by the most recent booking of the reserved style in any colour or size at regular or clearance price, a regular-price booking winning when both fall on the same day; an active Gold or Platinum member enrolled `high_months` months or more by the most recent regular-price booking of the reserved style in any colour or size; every other customer by the most recent regular-price booking of the reserved SKU itself. The protection limit is `limit_top` of the reserved unit price for an active Icon or Atelier member, `limit_high` for an active Gold or Platinum member, and `limit_standard` for every other customer. A reservation held `wait_long_days` days or more since its reservation date adds `wait_long_add` to the protection limit, one held `wait_mid_days` days up to `wait_long_days` days exclusive adds `wait_mid_add`, and a younger one adds `wait_none_add`. An active Unlimited annual plan (Standard Annual, Express Annual, Next-Day Annual or Student Annual) held by an active Gold, Platinum, Icon or Atelier member of Marlowe Rewards adds `pass_annual_add` to the protection limit, an active Unlimited monthly plan (Standard Monthly or Express Monthly) held by such a member adds `pass_monthly_add`, and any other customer, including an Unlimited member below Gold, adds `pass_none_add`.'
    prerequisite: []
    cross_category:
