    - style_reg_date: XLATEST('orders', 'order_lines', 'event_date', date_field='event_date', event_type='orders_line_booked', style_name=F('style_name'), price_type='regular')
    - style_reg_price: XLATEST('orders', 'order_lines', 'unit_price_usd', date_field='event_date', event_type='orders_line_booked', style_name=F('style_name'), price_type='regular')
    - sku_reg_date: XLATEST('orders', 'order_lines', 'event_date', date_field='event_date', event_type='orders_line_booked', sku=F('sku'), price_type='regular')
    - sku_reg_price: XLATEST('orders', 'order_lines', 'unit_price_usd', date_field='event_date', event_type='orders_line_booked', sku=F('sku'), price_type='regular')
    - protected_price: (style_clr_price if ((style_clr_date != None and DAYS(F('reserved_date'), style_clr_date) >= 0) and (not (style_reg_date != None and DAYS(F('reserved_date'), style_reg_date) >= 0) or DAYS(style_reg_date, style_clr_date) > 0)) else (style_reg_price if (style_reg_date != None and DAYS(F('reserved_date'), style_reg_date) >= 0) else reserved_price)) if ((member_tier == 'Marlowe Rewards Icon' or member_tier == 'Marlowe Rewards Atelier') and member_months >= K('top_months')) else ((style_reg_price if (style_reg_date != None and DAYS(F('reserved_date'), style_reg_date) >= 0) else reserved_price) if ((member_tier == 'Marlowe Rewards Gold' or member_tier == 'Marlowe Rewards Platinum') and member_months >= K('high_months')) else (sku_reg_price if (sku_reg_date != None and DAYS(F('reserved_date'), sku_reg_date) >= 0) else reserved_price))
    - limit_tier: CFIELD('loyalty', 'variant_name', status='active')
    - limit_base: K('limit_top') if (limit_tier == 'Marlowe Rewards Icon' or limit_tier == 'Marlowe Rewards Atelier') else (K('limit_high') if (limit_tier == 'Marlowe Rewards Gold' or limit_tier == 'Marlowe Rewards Platinum') else K('limit_standard'))
    - held_days: DAYS(F('reserved_date'), NOW)
