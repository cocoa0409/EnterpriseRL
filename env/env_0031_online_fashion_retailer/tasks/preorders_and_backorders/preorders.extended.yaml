# Pre-Orders & Back-Orders — reservations for items that cannot ship yet: sizes on back-order,
# next-season pieces, limited launches, designer pieces on deposit and made-to-order footwear.
# Each reservation is a holding with a promised ship-by date; delays follow the FTC Mail, Internet,
# or Telephone Order Merchandise Rule (16 CFR Part 435), which Marlowe & Finch applies to every
# reservation.

category: preorders
display_name: Pre-Orders & Back-Orders

binding:
  holding_table: reservations
  event_tables: [reservation_events]
  intake_tables: [reservation_requests]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [reserved, awaiting_consent, in_production, allocated, fulfilled, cancelled]
  transitions:
    - {from: reserved, to: awaiting_consent, by: system, means: "A delay notice that needs the customer's express consent is sent; the reservation waits for the answer."}
    - {from: awaiting_consent, to: reserved, by: user, means: "The customer personally consents to the revised ship-by date."}
    - {from: awaiting_consent, to: cancelled, by: system, means: "The customer declined the delay or did not consent by the consent deadline, and the reservation is cancelled with a full refund."}
    - {from: reserved, to: in_production, by: system, means: "Production of a made-to-order item starts after its specifications were confirmed."}
    - {from: in_production, to: allocated, by: system, means: "The made-to-order item passes quality control and is set aside for the customer."}
    - {from: reserved, to: allocated, by: system, means: "Stock arrives and a unit is set aside for the reservation."}
    - {from: allocated, to: fulfilled, by: system, means: "The allocated unit ships on a fulfilment order."}
    - {from: reserved, to: cancelled, by: agent, means: "The reservation is cancelled before allocation — at the customer's request, or because the supplier cancelled, the launch sold out, the specifications were never confirmed, the delay cap was reached or the payment was declined."}
    - {from: in_production, to: cancelled, by: agent, means: "A made-to-order reservation in production is cancelled — at the customer's confirmed request or because production failed."}
    - {from: allocated, to: cancelled, by: agent, means: "An allocated reservation is cancelled because its payment was declined beyond the grace period."}

accounts:
  - key: deposit
    unit: USD
    meaning: "Deposit paid on a reservation and not yet applied to the item, refunded or forfeited."

parameter_schema:
  deposit_pct: "Deposit as a percentage of the reserved price (integer percent; 0 = no deposit)."
  deposit_min_usd: "Smallest deposit charged when a deposit applies (USD, 2 dp; 0.00 when none)."
  deposit_tender_types: "Tenders that can pay a deposit (list; deposits are card-only)."
  deposit_rounding: "Rounding of the deposit (enum string: half_up_to_cent)."
  payment_timing: "When the customer pays (enum string: charge_at_shipment | authorize_at_reservation_capture_at_shipment | deposit_at_reservation_balance_at_shipment)."
  auth_amount_basis: "What a reservation-time card authorization covers (enum string: unit_price_times_quantity_plus_estimated_tax | not_applicable)."
  authorization_renewal_days: "Calendar days after which a reservation-time authorization is renewed (integer; 0 when none)."
  payment_decline_grace_hours: "Hours the customer has to update a declined card before the reservation is cancelled (integer)."
  balance_basis: "What is charged at shipment (enum string: final_price | final_price_minus_deposit)."
  balance_paid_via_fulfilment_order: "Whether the amount due at shipment is paid on a fulfilment order that accepts all order tenders (boolean)."
  max_initial_ship_by_days: "Furthest initial ship-by date, in calendar days after the reservation date, that may be promised (integer)."
  ship_by_days_when_unstated: "Ship-by date in calendar days after the reservation date when no date was stated (integer)."
  deemed_consent_max_delay_days: "Largest delay, in calendar days beyond the original ship-by date, that a first delay notice may announce while treating silence as consent (integer)."
  express_consent_from_notice_number: "Delay notice number from which express consent is always required (integer)."
  delay_notice_deadline_basis: "Latest moment a delay notice may be sent (enum string: on_or_before_current_ship_by_date)."
  consent_deadline_basis: "Deadline for express consent (enum string: current_ship_by_date_before_revision)."
  max_cumulative_delay_days: "Largest cumulative delay in calendar days beyond the original ship-by date after which the reservation is cancelled instead of delayed again (integer)."
  refund_due_business_days: "Business days within which a refund owed on cancellation is issued (integer)."
  customer_cancellation_cutoff: "Last status in which the customer may cancel at will (enum string: before_allocation | before_production_start)."
  deposit_refundable_before_cutoff: "Whether the deposit is refunded when the customer cancels before the cutoff (boolean)."
  deposit_forfeited_after_cutoff: "Whether the deposit is kept when the customer cancels after the cutoff (boolean)."
  seller_cancellation_full_refund: "Whether every cancellation caused by Marlowe & Finch or its supplier refunds the deposit in full (boolean)."
  cancellation_refund_tender: "Where refunds go (enum string: original_tender)."
  price_protection: "Whether the customer pays the lowest regular price between reservation and shipment (boolean)."
  price_protection_basis: "Which price is compared (enum string: lowest_regular_price_between_reservation_and_shipment | not_applicable)."
  price_protection_application: "How a lower price is applied (enum string: lower_unit_price_before_shipment | not_applicable)."
  max_units_per_reservation: "Most units on one reservation (integer)."
  per_style_limit_basis: "Which limit caps open units of one style per customer (enum string: max_units_per_reservation | loyalty_tier_launch_preorder_per_style_limit)."
  max_open_reservations_per_customer: "Most open reservations (reserved, awaiting_consent, in_production or allocated) one customer may hold across all types (integer)."
  early_access_applies: "Whether Marlowe Rewards launch_preorder_early_access_hours lets members reserve before the public opening (boolean)."
  launch_open_time_et: "Public opening time of a launch on its launch date, Eastern Time (HH:MM, or not_applicable)."
  allocation_basis: "Order in which arriving stock is allocated (enum string: reservation_time | loyalty_priority_then_reservation_time)."
  shortfall_handling: "What happens to reservations stock cannot cover (enum string: delay_notice | cancel_unallocated_with_full_refund)."
  supplier_cancellation_possible: "Whether the supplier can cancel the item outright (boolean)."
  partial_fulfilment_allowed: "Whether a multi-unit reservation can ship units as they arrive (boolean)."
  ship_within_business_days_of_allocation: "Business days from allocation to shipment (integer)."
  ships_from_supplier: "Whether the item ships directly from the brand's warehouse in its own parcel (boolean)."
  fulfilment_delivery_service: "Delivery service of the fulfilment order (official service name)."
  fulfilment_shipping_fee_usd: "Shipping fee charged on the fulfilment order (USD, 2 dp)."
  split_shipment_free: "Whether shipping a reservation separately from the rest of the original basket is free (boolean)."
  points_earned_at: "When Marlowe Rewards points are earned (enum string: fulfilment_dispatch)."
  production_lead_days: "Calendar days from production start to completion (integer; 0 when not made to order)."
  personalization_allowed: "Whether monogramming or custom specifications are taken (boolean)."
  specs_confirmation_required: "Whether production waits for the customer's own confirmation of sizes and personalisation (boolean)."
  specs_confirmation_deadline_days: "Calendar days after the reservation date within which specifications must be confirmed (integer; 0 when not required)."
  specs_change_after_confirmation_allowed: "Whether confirmed specifications can be changed (boolean)."
  size_change_allowed_before_allocation: "Whether the size of an unallocated reservation can be changed (boolean)."
  max_size_changes: "Most size changes per reservation (integer; 0 when not allowed)."

