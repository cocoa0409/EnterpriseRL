    - plan: CFIELD('pass', 'variant_name')
    - plan_status: CFIELD('pass', 'status')
    - pass_member_tier: CFIELD('loyalty', 'variant_name', status='active')
    - pass_add: K('pass_annual_add') if (((plan == 'Unlimited Standard Annual' or plan == 'Unlimited Express Annual' or plan == 'Unlimited Next-Day Annual' or plan == 'Unlimited Student Annual') and plan_status == 'active') and (pass_member_tier == 'Marlowe Rewards Gold' or pass_member_tier == 'Marlowe Rewards Platinum' or pass_member_tier == 'Marlowe Rewards Icon' or pass_member_tier == 'Marlowe Rewards Atelier')) else (K('pass_monthly_add') if (((plan == 'Unlimited Standard Monthly' or plan == 'Unlimited Express Monthly') and plan_status == 'active') and (pass_member_tier == 'Marlowe Rewards Gold' or pass_member_tier == 'Marlowe Rewards Platinum' or pass_member_tier == 'Marlowe Rewards Icon' or pass_member_tier == 'Marlowe Rewards Atelier')) else K('pass_none_add'))
    - price_floor: reserved_price * (1 - (limit_base + wait_add + pass_add))
    - result: RND(MN(reserved_price, MX(protected_price, price_floor)), 2)
