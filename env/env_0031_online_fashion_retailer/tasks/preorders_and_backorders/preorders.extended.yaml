      - loyalty
      - returns
  - id: preorders_ext_made_to_order_deposit
    base_policy_refs:
    - preorders_evt_deposit
    - preorders_reservation
    - preorders_evt_authorization
    overwrite:
    - base_policy: preorders_reservation
      superseded_clause: The deposit is `deposit_pct` percent of unit price times quantity, rounded per `deposit_rounding`, but never less than `deposit_min_usd`.
      replaced_by: The made-to-order deposit is the reserved unit price times the units times the made-to-order deposit percentage, divided by 100; the standard made-to-order deposit percentage is the type's `deposit_pct`.
    trigger: on_request
    subject:
    - preorders_deposit_captured
    computes: deposit_usd
    target_tool: pay_reservation_deposit_93996964
    params:
      pct_top: 30
      pct_high: 40
      top_months: 36
      high_months: 24
      long_months: 60
      long_window_months: 24
      long_window_years: 2
      new_months: 12
      std_window_months: 12
      spend_high: 3000
      spend_mid: 1500
      spend_cut_high: 5
      spend_cut_mid: 2
      spend_cut_none: 0
      fw_months: 24
      fw_many: 8
      fw_some: 4
      fw_cut_many: 5
      fw_cut_some: 2
      fw_cut_none: 0
    rule: 'The deposit on a Made-to-Order Reservation, other than a remake of a cancelled pair, is charged to the customer''s card at reservation; when that charge is declined the reservation is held for `payment_decline_grace_hours` hours from its reservation time, and the customer pays the deposit in person with a card of their choice, which fixes the deposit due on the reservation and books the deposit charge on its history. The made-to-order deposit is the reserved unit price times the units times the made-to-order deposit percentage, divided by 100; the standard made-to-order deposit percentage is the type''s `deposit_pct`. The made-to-order deposit is never less than `deposit_min_usd` and is rounded half up to the cent once, at the end. The spend and footwear reductions below are percentage points subtracted from the made-to-order deposit percentage before it is applied to the price. The made-to-order deposit percentage is `pct_top` for an active Icon or Atelier member enrolled `top_months` months or more, `pct_high` for an active Gold or Platinum member enrolled `high_months` months or more, and the type''s `deposit_pct` for every other customer. The customer''s spend is the total of the payments captured on the customer''s Marlowe & Finch orders over a window that depends on the membership: for a member enrolled `long_months` months or more, the payments of the last `long_window_months` months divided by `long_window_years` (a yearly average); for a member enrolled fewer than `new_months` months, the payments since the month of enrolment; for every other customer, the payments of the last `std_window_months` months. That spend takes `spend_cut_high` percentage points off the made-to-order deposit percentage at `spend_high` or more, `spend_cut_mid` points from `spend_mid` up to `spend_high` exclusive, and `spend_cut_none` below that. Footwear lines booked on the customer''s orders in the last `fw_months` months take `fw_cut_many` percentage points off the made-to-order deposit percentage at `fw_many` lines or more, `fw_cut_some` points from `fw_some` up to `fw_many` lines exclusive, and `fw_cut_none` below that.'
    prerequisite: []
    cross_category:
    - category: loyalty
      as: branch
      reads:
      - status
      - variant_name
      - enrolled_date
      note: The tier and the enrolment date set the deposit percentage and the spend window.
    - category: orders
      as: history
      reads:
      - order_payments.amount_usd
      - order_payments.event_date
      - order_lines.product_class
      - order_lines.event_date
      note: Captured payments in the window and footwear lines in 24 months decide the two reductions.
    compute:
    - price: F('unit_price_usd') * F('quantity')
    - member_tier: CFIELD('loyalty', 'variant_name', status='active')
    - member_months: MONTHS(CFIELD('loyalty', 'enrolled_date', status='active'), NOW)
    - mto_pct: K('pct_top') if ((member_tier == 'Marlowe Rewards Icon' or member_tier == 'Marlowe Rewards Atelier') and member_months >= K('top_months')) else (K('pct_high') if ((member_tier == 'Marlowe Rewards Gold' or member_tier == 'Marlowe Rewards Platinum') and member_months >= K('high_months')) else P('deposit_pct'))
    - window_tenure: MONTHS(CFIELD('loyalty', 'enrolled_date', status='active'), NOW)
    - spend_window: K('long_window_months') if window_tenure >= K('long_months') else (window_tenure + 1 if window_tenure < K('new_months') else K('std_window_months'))
    - spend_divisor: K('long_window_years') if window_tenure >= K('long_months') else 1
    - spend: XSUM('orders', 'order_payments', 'amount_usd', within_months=spend_window, date_field='event_date', event_type='orders_payment_captured') / spend_divisor
    - spend_cut: K('spend_cut_high') if spend >= K('spend_high') else (K('spend_cut_mid') if spend >= K('spend_mid') else K('spend_cut_none'))
    - footwear_lines: XCOUNT('orders', 'order_lines', within_months=K('fw_months'), date_field='event_date', event_type='orders_line_booked', product_class='footwear')
    - footwear_cut: K('fw_cut_many') if footwear_lines >= K('fw_many') else (K('fw_cut_some') if footwear_lines >= K('fw_some') else K('fw_cut_none'))
    - pct_net: mto_pct - spend_cut - footwear_cut
    - result: RND(MX(price * pct_net / 100, P('deposit_min_usd')), 2)
    compute_basis:
      price: The made-to-order deposit is the reserved unit price times the units times the made-to-order deposit percentage, divided by 100; the standard made-to-order deposit percentage is the type's `deposit_pct`.
      member_tier: The made-to-order deposit percentage is `pct_top` for an active Icon or Atelier member enrolled `top_months` months or more, `pct_high` for an active Gold or Platinum member enrolled `high_months` months or more, and the type's `deposit_pct` for every other customer.
      member_months: The made-to-order deposit percentage is `pct_top` for an active Icon or Atelier member enrolled `top_months` months or more, `pct_high` for an active Gold or Platinum member enrolled `high_months` months or more, and the type's `deposit_pct` for every other customer.
      mto_pct: The made-to-order deposit percentage is `pct_top` for an active Icon or Atelier member enrolled `top_months` months or more, `pct_high` for an active Gold or Platinum member enrolled `high_months` months or more, and the type's `deposit_pct` for every other customer.
      window_tenure: 'The customer''s spend is the total of the payments captured on the customer''s Marlowe & Finch orders over a window that depends on the membership: for a member enrolled `long_months` months or more, the payments of the last `long_window_months` months divided by `long_window_years` (a yearly average); for a member enrolled fewer than `new_months` months, the payments since the month of enrolment; for every other customer, the payments of the last `std_window_months` months.'
      spend_window: 'The customer''s spend is the total of the payments captured on the customer''s Marlowe & Finch orders over a window that depends on the membership: for a member enrolled `long_months` months or more, the payments of the last `long_window_months` months divided by `long_window_years` (a yearly average); for a member enrolled fewer than `new_months` months, the payments since the month of enrolment; for every other customer, the payments of the last `std_window_months` months.'
      spend_divisor: 'The customer''s spend is the total of the payments captured on the customer''s Marlowe & Finch orders over a window that depends on the membership: for a member enrolled `long_months` months or more, the payments of the last `long_window_months` months divided by `long_window_years` (a yearly average); for a member enrolled fewer than `new_months` months, the payments since the month of enrolment; for every other customer, the payments of the last `std_window_months` months.'
      spend: 'The customer''s spend is the total of the payments captured on the customer''s Marlowe & Finch orders over a window that depends on the membership: for a member enrolled `long_months` months or more, the payments of the last `long_window_months` months divided by `long_window_years` (a yearly average); for a member enrolled fewer than `new_months` months, the payments since the month of enrolment; for every other customer, the payments of the last `std_window_months` months.'
      spend_cut: That spend takes `spend_cut_high` percentage points off the made-to-order deposit percentage at `spend_high` or more, `spend_cut_mid` points from `spend_mid` up to `spend_high` exclusive, and `spend_cut_none` below that.
      footwear_lines: Footwear lines booked on the customer's orders in the last `fw_months` months take `fw_cut_many` percentage points off the made-to-order deposit percentage at `fw_many` lines or more, `fw_cut_some` points from `fw_some` up to `fw_many` lines exclusive, and `fw_cut_none` below that.
      footwear_cut: Footwear lines booked on the customer's orders in the last `fw_months` months take `fw_cut_many` percentage points off the made-to-order deposit percentage at `fw_many` lines or more, `fw_cut_some` points from `fw_some` up to `fw_many` lines exclusive, and `fw_cut_none` below that.
      pct_net: The spend and footwear reductions below are percentage points subtracted from the made-to-order deposit percentage before it is applied to the price.
      result: The made-to-order deposit is the reserved unit price times the units times the made-to-order deposit percentage, divided by 100; the standard made-to-order deposit percentage is the type's `deposit_pct`. The made-to-order deposit is never less than `deposit_min_usd` and is rounded half up to the cent once, at the end.
    factors:
    - id: made_to_order_rate
      effect: parameter
      decides: mto_pct
      bindings:
      - member_tier
      - member_months
      - mto_pct
      ladder:
      - when: active Icon or Atelier member AND enrolled `top_months` months or more
        value: K('pct_top')
      - when: active Gold or Platinum member AND enrolled `high_months` months or more
        value: K('pct_high')
      - when: otherwise
        value: P('deposit_pct')
      baseline:
        mto_pct: P('deposit_pct')
      evidence:
      - cross_category
      - date
      cross_difficulty: loyalty
    - id: spend_window
      effect: method
      decides: spend_window
      bindings:
      - window_tenure
      - spend_window
      - spend_divisor
      ladder:
      - when: member enrolled `long_months` months or more
        method: payments of the last `long_window_months` months divided by `long_window_years`
      - when: member enrolled fewer than `new_months` months
        method: payments since the month of enrolment
      - when: otherwise
        method: payments of the last `std_window_months` months
      baseline:
        spend_window: K('std_window_months')
        spend_divisor: '1'
      evidence:
      - cross_category
      - date
      cross_difficulty: loyalty
    - id: spend_reduction
      effect: parameter
      decides: spend_cut
      bindings:
      - spend
      - spend_cut
      ladder:
      - when: spend `spend_high` or more
        value: K('spend_cut_high')
      - when: spend `spend_mid` up to `spend_high` exclusive
        value: K('spend_cut_mid')
      - when: otherwise
        value: K('spend_cut_none')
      baseline:
        spend_cut: K('spend_cut_none')
      evidence:
      - cross_category
      - history
      cross_difficulty: orders
    - id: footwear_reduction
      effect: parameter
      decides: footwear_cut
      bindings:
      - footwear_lines
      - footwear_cut
      ladder:
      - when: '`fw_many` or more footwear lines in the last `fw_months` months'
        value: K('fw_cut_many')
      - when: '`fw_some` up to `fw_many` lines exclusive'
        value: K('fw_cut_some')
      - when: otherwise
        value: K('fw_cut_none')
      baseline:
        footwear_cut: K('fw_cut_none')
      evidence:
      - cross_category
      - history
      cross_difficulty: orders
    baseline:
      rule: The made-to-order deposit is the reserved unit price times the units times the made-to-order deposit percentage, divided by 100; the standard made-to-order deposit percentage is the type's `deposit_pct`. The made-to-order deposit is never less than `deposit_min_usd` and is rounded half up to the cent once, at the end.
      params:
      - deposit_pct
      - deposit_min_usd
    inputs:
