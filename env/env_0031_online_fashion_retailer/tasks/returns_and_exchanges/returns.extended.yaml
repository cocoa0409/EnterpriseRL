events:
  - type: returns_authorized
    target: return_cases
    mutation: create
    meaning: "A return authorization is opened against a delivered order with its type, method, return-by date and lines."
    grain: "One row per return authorization."
    fields:
      return_id: "Reference of the return (the RMA number)."
      customer_id: "The customer returning: the purchaser, or the gift recipient on a Gift Return."
      order_id: "The order the units came from."
      variant_name: "Return type."
      status: "Always authorized at creation."
      opened_date: "Authorization date."
      return_method: "mail_label, carrier_drop_off_qr or scheduled_pickup."
      return_by_date: "Last date a first carrier scan counts as on time."
      deadline_extensions_used: "0 at creation."
      defect_photo_reference: "Upload reference of the defect photos (Quality Issue Return only), verbatim."
      exchange_sku: "Replacement SKU on an exchange, or empty."
    triggers:
      - event: returns:returns_line_authorized
        map: {event_date: opened_date, exchange_sku: exchange_sku}
      - event: returns:returns_hold_placed
        when: {variant_name: Instant Exchange}
        map: {event_date: opened_date}
      - event: returns:returns_exchange_shipped
        when: {variant_name: Instant Exchange}
        map: {event_date: opened_date, exchange_sku: exchange_sku}

  - type: returns_line_authorized
    target: return_lines
    meaning: "A booked order line, or some of its units, is placed on the return."
    grain: "One row per booked order line per return."
    distinguish_by: [booked_line_id]
    fields:
      event_date: "Authorization date."
      booked_line_id: "The order_lines booking row being returned."
      line_number: "Line position of that booking row."
      sku: "SKU being returned."
      quantity: "Units of the line placed on the return."
      return_reason: "too_small, too_large, not_as_pictured, changed_mind, arrived_too_late, defective or unwanted_gift."
      exchange_sku: "Replacement SKU for this line on an exchange, or empty."
    triggers: []

  - type: returns_line_inspected
    target: return_lines
    meaning: "The returns centre records the condition and the outcome of the units of one returned line."
    grain: "One row per returned line per condition grade (units of one line in different grades are separate rows)."
    distinguish_by: [booked_line_id, condition_grade]
    fields:
      event_date: "Inspection date."
      booked_line_id: "The booking row whose units were inspected."
      quantity: "Units found in this grade."
      condition_grade: "A (unworn, tags attached), B (unworn, tags detached), C (worn, washed, altered or damaged) or missing (not in the parcel)."
      box_condition: "original_box_intact, original_box_damaged_or_used_as_shipper, no_original_box or not_applicable (non-footwear)."
      inspection_outcome: "accepted, accepted_with_fee or rejected."
    triggers:
      - event: returns:returns_refund_credited
        when: {inspection_outcome: [accepted, accepted_with_fee]}
        map: {booked_line_id: booked_line_id, event_date: event_date}
      - event: returns:returns_fee_assessed
        when: {inspection_outcome: accepted_with_fee}
        map: {booked_line_id: booked_line_id, event_date: event_date}

  - type: returns_refund_credited
    target: return_settlements
    meaning: "The value of accepted units of one line is credited as owed to the customer."
    grain: "One row per returned line (all accepted units of the line together)."
    distinguish_by: [booked_line_id]
    fields:
      event_date: "Inspection date."
      order_id: "Order of the line."
      booked_line_id: "Booking row credited."
      merchandise_amount_usd: "Net unit price paid times accepted units."
      tax_amount_usd: "Sales tax on those units."
      shipping_amount_usd: "Original shipping fee and surcharge share refunded (Quality Issue Return only), else 0.00."
      amount_usd: "Total credited, positive."
    account: refund_due
    direction: in
    triggers: []

  - type: returns_fee_assessed
    target: return_settlements
    meaning: "A fee is withheld from what is owed on the return."
    grain: "One row per fee type per returned line (the method fee once per return, line empty)."
    distinguish_by: [fee_type, booked_line_id]
    fields:
      event_date: "Assessment date."
      order_id: "Order of the return."
      fee_type: "method_fee, restocking_fee or missing_box_fee."
      booked_line_id: "Booking row the fee applies to; empty for method_fee."
      amount_usd: "Fee withheld, negative."
    account: refund_due
    direction: out
    triggers: []

  - type: returns_refund_issued
    target: return_settlements
    meaning: "Money owed on the return is paid out to a tender, as new Return Store Credit, or to the original instruments."
    grain: "One row per refund stage per tender instrument."
    distinguish_by: [refund_stage, tender_type, instrument_id]
    fields:
      event_date: "Payment date."
      order_id: "Order of the return."
      refund_stage: "instant_credit_at_scan or final_settlement."
      tender_type: "card_or_wallet, gift_card, return_store_credit, bonus_gift_card, goodwill_credit, rewards_note or return_store_credit_new."
      instrument_id: "Existing instrument refunded; empty for card_or_wallet and return_store_credit_new."
      amount_usd: "Amount paid out, negative."
    account: refund_due
    direction: out
    triggers:
      - event: credit:credit_issued
        when: {tender_type: return_store_credit_new}
        map: {variant_name: "Return Store Credit", source_reference: return_id, issued_date: event_date}
      - event: credit:credit_refunded_to_instrument
        when: {tender_type: [gift_card, return_store_credit, bonus_gift_card, goodwill_credit, rewards_note]}
        map: {instrument_id: instrument_id, order_id: order_id, return_id: return_id, event_date: event_date}

  - type: returns_instant_credit_reversed
    target: return_settlements
    meaning: "Instant credit paid at first scan for units that inspection rejected or found missing is recovered."
    grain: "One row per recovery source."
    distinguish_by: [recovered_from]
    fields:
      event_date: "Recovery date."
      order_id: "Order of the return."
      recovered_from: "return_store_credit (clawed back from the credit issued) or original_card (shortfall already spent)."
      instrument_id: "Return Store Credit instrument clawed back; empty for original_card."
      amount_usd: "Amount recovered, positive."
    account: refund_due
    direction: in
    triggers:
      - event: credit:credit_clawed_back
        when: {recovered_from: return_store_credit}
        map: {instrument_id: instrument_id, return_id: return_id, clawback_reason: failed_return_inspection, event_date: event_date}

  - type: returns_exchange_shipped
    target: return_settlements
    meaning: "The replacement for an exchange ships as a no-charge order."
    grain: "One row per replacement order."
    distinguish_by: [exchange_order_id]
    fields:
      event_date: "Ship date."
      order_id: "Original order."
      exchange_sku: "Replacement SKU."
      exchange_order_id: "The no-charge order carrying the replacement."
    triggers:
      - event: orders:orders_placed
        map: {placed_date: event_date}

  - type: returns_hold_placed
    target: return_settlements
    meaning: "An authorization hold for the replacement value is placed on the customer's card for an Instant Exchange."
    grain: "One row per Instant Exchange."
    distinguish_by: [hold_action]
    fields:
      event_date: "Hold date."
      order_id: "Original order."
      hold_action: "placed."
      amount_usd: "Hold amount, positive."
    account: exchange_hold
    direction: in
    triggers: []

  - type: returns_hold_released
    target: return_settlements
    meaning: "The Instant Exchange hold is released because the original units arrived."
    grain: "One row per Instant Exchange."
    distinguish_by: [hold_action]
    fields:
      event_date: "Release date."
      order_id: "Original order."
      hold_action: "released."
      amount_usd: "Hold amount released, negative."
    account: exchange_hold
    direction: out
    triggers: []

  - type: returns_hold_captured
    target: return_settlements
    meaning: "The Instant Exchange hold is charged because the original units never came back, or came back rejected."
    grain: "One row per Instant Exchange."
    distinguish_by: [hold_action]
    fields:
      event_date: "Charge date."
      order_id: "Original order."
      hold_action: "captured."
      amount_usd: "Hold amount charged, negative."
    account: exchange_hold
    direction: out
    triggers: []

  - type: returns_first_scanned
    target: return_cases
    mutation: {transition: {from: authorized, to: in_transit}}
    meaning: "The carrier records the first scan of the return parcel."
    grain: "One row per transaction."
    fields:
      status: "in_transit."
      variant_name: "Return type, unchanged by this transition; read to route its consequences."
      first_scan_date: "Date of the first carrier scan."
      tracking_number: "Carrier tracking number of the return parcel."
    triggers:
      - event: returns:returns_refund_issued
        when: {variant_name: Store Credit Return}
        map: {refund_stage: instant_credit_at_scan, tender_type: return_store_credit_new, event_date: first_scan_date}

  - type: returns_received
    target: return_cases
    mutation: {transition: {from: in_transit, to: received}}
    meaning: "The returns centre receives the parcel."
    grain: "One row per transaction."
    fields:
      status: "received."
      variant_name: "Return type, unchanged by this transition; read to route its consequences."
      received_date: "Receipt date."
    triggers:
      - event: returns:returns_hold_released
        when: {variant_name: Instant Exchange}
        map: {hold_action: released, event_date: received_date}

  - type: returns_deemed_received
    target: return_cases
    mutation: {transition: {from: in_transit, to: inspected}}
    meaning: "A return parcel lost by the carrier on an M&F label is deemed received and its units accepted at grade A."
    grain: "One row per transaction."
    fields:
      status: "inspected."
      inspected_date: "Date the parcel was deemed received."
    triggers:
      - event: returns:returns_line_inspected
        map: {condition_grade: A, box_condition: not_applicable, inspection_outcome: accepted, event_date: inspected_date}

  - type: returns_inspected
    target: return_cases
    mutation: {transition: {from: received, to: inspected}}
    meaning: "The inspection results of all units are posted."
    grain: "One row per transaction."
    fields:
      status: "inspected."
      inspected_date: "Inspection date."
    triggers:
      - event: returns:returns_line_inspected
        map: {event_date: inspected_date}

  - type: returns_settled
    target: return_cases
    mutation: {transition: {from: inspected, to: settled}}
    meaning: "The returns desk settles the return."
    grain: "One row per transaction."
    fields:
      status: "settled."
      variant_name: "Return type, unchanged by this transition; read to route its consequences."
      settled_date: "Settlement date."
    triggers:
      - event: loyalty:loyalty_points_reversed
        map: {return_id: return_id, order_id: order_id, posting_date: settled_date}
      - event: returns:returns_exchange_shipped
        when: {variant_name: Size Exchange}
        map: {event_date: settled_date}

  - type: returns_cancelled
    target: return_cases
    mutation: {transition: {from: authorized, to: cancelled}}
    meaning: "An unused authorization is cancelled because the customer keeps the items."
    grain: "One row per transaction."
    fields:
      status: "cancelled."
      variant_name: "Return type, unchanged by this transition; read to route its consequences."
      closed_date: "Cancellation date."
    triggers:
      - event: returns:returns_hold_captured
        when: {variant_name: Instant Exchange}
        map: {hold_action: captured, event_date: closed_date}

  - type: returns_expired
    target: return_cases
    mutation: {transition: {from: authorized, to: expired}}
    meaning: "No carrier scan was recorded by the return-by date."
    grain: "One row per transaction."
    fields:
      status: "expired."
      variant_name: "Return type, unchanged by this transition; read to route its consequences."
      closed_date: "Day after the return-by date."
    triggers:
      - event: returns:returns_hold_captured
        when: {variant_name: Instant Exchange}
        map: {hold_action: captured, event_date: closed_date}

  - type: returns_deadline_extended
    target: return_cases
    mutation: update
    meaning: "The return-by date of an authorization is moved later once."
    grain: "One row per transaction."
    fields:
      return_by_date: "New return-by date."
      deadline_extensions_used: "Incremented by one."
    triggers: []

  - type: returns_method_changed
    target: return_cases
    mutation: update
    meaning: "The return method of an authorization is changed before the first scan."
    grain: "One row per transaction."
    fields:
      return_method: "New method."
    triggers: []

measures:
  - id: returns_msr_units_on_returns
    window: "All return cases of the order whose status is not cancelled or expired."
    measure: "Sum of quantity over returns_line_authorized rows for the booked line."
  - id: returns_msr_open_returns_per_order
    window: "All return cases of the order."
    measure: "Count of return cases of the order whose status is not cancelled or expired."
  - id: returns_msr_refundable_by_tender
    window: "All history of the order."
    measure: "Per tender instrument: amount captured on the order (orders_payment_captured) minus amounts already refunded to it by orders_payment_refunded and final_settlement returns_refund_issued rows of the order."
  - id: returns_msr_refund_due
    window: "All settlement rows of the return."
    measure: "Sum of amount_usd over the return's refund_due rows (credited, fees, refunds paid and instant-credit recoveries)."

policies:
  - id: returns_authorization
    subject: [returns_authorized, returns_line_authorized]
    rule: >-
      A return is authorized only for an order in status delivered or closed; a parcel that is not
      yet delivered, or that the customer says never arrived, is handled under the claims charter. A
      return is authorized only if it is requested no later than the return window in calendar days
      after the order is delivered. The window is `base_return_window_days`, or
      `footwear_return_window_days` for footwear lines, plus the returning customer's Marlowe Rewards
      `return_window_extension_days` where `loyalty_window_extension_applies` (loyalty charter, tier on
      the request date); where `holiday_extension_applies`, an order delivered from
      `holiday_delivery_window_start` through `holiday_delivery_window_end` instead has the later of that
      result and `holiday_return_by` of the following year. Window days are counted as calendar days
      after the delivered date, the delivered date being day zero, and the last day of the window
      still qualifies. The return_by_date is the earlier of the window's last day and the authorization
      date plus `label_validity_days`, and the deadline is proven by the first carrier scan
      (`deadline_basis`). The requester must be the customer who placed the order, except on a Gift
      Return, where the order must be flagged is_gift and the requester is a different customer who
      quotes its order number. Never returnable on this path: gift-card lines
      (`gift_cards_returnable`), final-sale lines (`final_sale_returnable`), personalised items
      (`personalized_items_returnable`), and swimwear or intimates without the hygiene liner and tags
      (`swim_intimates_requires_hygiene_liner`); a Quality Issue Return lifts the final-sale and
      personalisation limits. Partial quantities are allowed (`partial_quantity_returns_allowed`). The
      return method must be one of `allowed_return_methods`.
    eligibility:
      - id: order_delivered
        applies_to: [returns_authorized]
        kind: state
        condition: "A return is authorized only for an order in status delivered or closed; a parcel that is not yet delivered, or that the customer says never arrived, is handled under the claims charter."
        evidence_fields: [orders.status, orders.order_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [orders.order_id]
          action_bindings:
            orders.order_id: order_id
        state_contract:
          field: orders.status
          allowed: [delivered, closed]
      - id: return_window
        applies_to: [returns_authorized]
        kind: time
        condition: "A return is authorized only if it is requested no later than the return window in calendar days after the order is delivered."
        evidence_fields: [orders.delivered_date, orders.order_id, loyalty_memberships.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [orders.order_id]
          action_bindings:
            orders.order_id: order_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the order is delivered"
          anchor_source: orders.delivered_date
          relation: not_after
          duration_source: variants.base_return_window_days
          unit: calendar_days
          counting_rule: "Window days are counted as calendar days after the delivered date, the delivered date being day zero, and the last day of the window still qualifies."
          boundary: inclusive
      - id: requester_entitled
        applies_to: [returns_authorized]
        kind: authorization
        condition: "The requester must be the customer who placed the order, except on a Gift Return, where the order must be flagged is_gift and the requester is a different customer who quotes its order number."
        evidence_fields: [orders.customer_id, orders.is_gift, orders.order_id]
        evidence_contract:
          authority: mixed
          timing: pre_action
          correlation_keys:
            - [orders.order_id]
          action_bindings:
            orders.order_id: order_id
    params:
      per_tier:
        Standard Return: {base_return_window_days: "=base_return_window_days", footwear_return_window_days: "=footwear_return_window_days"}
        Store Credit Return: {base_return_window_days: "=base_return_window_days", footwear_return_window_days: "=footwear_return_window_days"}
        Size Exchange: {base_return_window_days: "=base_return_window_days", footwear_return_window_days: "=footwear_return_window_days"}
        Instant Exchange: {base_return_window_days: "=base_return_window_days", footwear_return_window_days: "=footwear_return_window_days"}
        Gift Return: {base_return_window_days: "=base_return_window_days", footwear_return_window_days: "=footwear_return_window_days"}
        Quality Issue Return: {base_return_window_days: "=base_return_window_days", footwear_return_window_days: "=footwear_return_window_days"}

  - id: returns_agg_multi_holding
    subject: [returns_authorized]
    rule: >-
      A customer may hold any number of return authorizations across orders; there is no cap per
      customer. Per order the cap is set by returns_agg_order_quantity.
    eligibility: []
    params: {max_per_customer: null}

  - id: returns_agg_order_quantity
    subject: [returns_line_authorized]
    rule: >-
      All returns of one order are read together. An order can carry at most `max_returns_per_order`
      return authorizations that are not cancelled or expired (returns_msr_open_returns_per_order). The
      units of a booked line placed on returns that are not cancelled or expired can never exceed the
      units booked on that line minus units cancelled (returns_msr_units_on_returns); a unit already on
      an open or settled return cannot be put on another. On exchanges, units of one booked line can be
      exchanged at most `exchanges_per_original_line` time; a replacement received through an exchange
      is returned against the exchange order, never the original.
    eligibility:
      - id: units_not_already_returned
        applies_to: [returns_line_authorized]
        kind: dedup
        condition: "The units of a booked line placed on returns that are not cancelled or expired can never exceed the units booked on that line minus units cancelled (returns_msr_units_on_returns); a unit already on an open or settled return cannot be put on another."
        evidence_fields: [return_lines.booked_line_id, return_lines.quantity, return_lines.event_type, return_cases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [return_lines.booked_line_id]
          action_bindings:
            return_lines.booked_line_id: booked_line_id
        dedup_contract:
          table: return_lines
          mode: separate_record
          object_bindings: {booked_line_id: booked_line_id}
          duplicate_filters: {event_type: [returns_line_authorized]}
          distinct_fields: [return_id, quantity]
    measures: [returns_msr_units_on_returns, returns_msr_open_returns_per_order]

  - id: returns_evt_method_fee
    subject: [returns_method_changed, returns_fee_assessed]
    rule: >-
      Where `return_method_fee_applies`, the fee of the chosen return method in the method fee register
      is withheld once per return at settlement (fee_type method_fee), whatever the number of units. The
      fee is waived where `method_fee_waivable` and the returning customer holds a Marlowe Rewards tier
      with `free_return_label` (loyalty charter) or a Marlowe & Finch Unlimited membership in status
      trial or active whose plan has `covers_return_label` (pass charter) on the authorization date;
      waivers do not add up, one is enough. The method fee is also not withheld when every unit of the
      return is rejected, since nothing is refunded to withhold it from. The return method can be
      changed only before the first carrier scan, while the return is in status authorized, and the fee
      of the method used for the parcel is the one withheld.
    eligibility:
      - id: before_first_scan
        applies_to: [returns_method_changed]
        kind: state
        condition: "The return method can be changed only before the first carrier scan, while the return is in status authorized, and the fee of the method used for the parcel is the one withheld."
        evidence_fields: [return_cases.status, return_cases.return_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [return_cases.return_id]
          action_bindings:
            return_cases.return_id: return_id
        state_contract:
          field: return_cases.status
          allowed: [authorized]
    params:
      method_fee_register: {mail_label: 6.95, carrier_drop_off_qr: 4.95, scheduled_pickup: 9.95}
      per_tier:
        Standard Return: {return_method_fee_applies: "=return_method_fee_applies", method_fee_waivable: "=method_fee_waivable"}
        Store Credit Return: {return_method_fee_applies: "=return_method_fee_applies", method_fee_waivable: "=method_fee_waivable"}
        Size Exchange: {return_method_fee_applies: "=return_method_fee_applies", method_fee_waivable: "=method_fee_waivable"}
        Instant Exchange: {return_method_fee_applies: "=return_method_fee_applies", method_fee_waivable: "=method_fee_waivable"}
        Gift Return: {return_method_fee_applies: "=return_method_fee_applies", method_fee_waivable: "=method_fee_waivable"}
        Quality Issue Return: {return_method_fee_applies: "=return_method_fee_applies", method_fee_waivable: "=method_fee_waivable"}

  - id: returns_evt_inspection_restocking
    subject: [returns_line_inspected, returns_fee_assessed]
    rule: >-
      Each unit is graded at inspection. Grade A units are accepted without fee. Grade B units
      (unworn, tags detached) are accepted with a restocking fee where `restocking_fee_applies`: the fee
      per unit is `restocking_fee_pct_grade_b` percent of the net unit price paid, rounded half up to
      the cent and capped at `restocking_fee_cap_per_unit_usd`. A footwear unit whose box_condition is
      no_original_box or original_box_damaged_or_used_as_shipper carries `missing_box_fee_usd` per unit;
      when a footwear unit carries both fees, both are withheld. Restocking and box fees are waived when
      the returning customer's Marlowe Rewards tier has `restocking_fee_waiver` (loyalty charter) on the
      authorization date; a Gift Return never uses the recipient's or the purchaser's tier. Grade C units
      are handled per `grade_c_handling`: rejected and sent back at `rejected_item_send_back_fee_usd`, or
      accepted as defective on a Quality Issue Return. Units missing from the parcel are rejected. A
      fee is never larger than the value credited for the unit it is charged on. Fees are assessed only
      once the return is in status inspected.
    eligibility:
      - id: inspected_only
        applies_to: [returns_fee_assessed, returns_line_inspected]
        kind: state
        condition: "Fees are assessed only once the return is in status inspected."
        evidence_fields: [return_cases.status, return_cases.return_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [return_cases.return_id]
          action_bindings:
            return_cases.return_id: return_id
        state_contract:
          field: return_cases.status
          allowed: [inspected]
    params:
      per_tier:
        Standard Return: {restocking_fee_pct_grade_b: "=restocking_fee_pct_grade_b", restocking_fee_cap_per_unit_usd: "=restocking_fee_cap_per_unit_usd", missing_box_fee_usd: "=missing_box_fee_usd"}
        Store Credit Return: {restocking_fee_pct_grade_b: "=restocking_fee_pct_grade_b", restocking_fee_cap_per_unit_usd: "=restocking_fee_cap_per_unit_usd", missing_box_fee_usd: "=missing_box_fee_usd"}
        Size Exchange: {restocking_fee_pct_grade_b: "=restocking_fee_pct_grade_b", restocking_fee_cap_per_unit_usd: "=restocking_fee_cap_per_unit_usd", missing_box_fee_usd: "=missing_box_fee_usd"}
        Instant Exchange: {restocking_fee_pct_grade_b: "=restocking_fee_pct_grade_b", restocking_fee_cap_per_unit_usd: "=restocking_fee_cap_per_unit_usd", missing_box_fee_usd: "=missing_box_fee_usd"}
        Gift Return: {restocking_fee_pct_grade_b: "=restocking_fee_pct_grade_b", restocking_fee_cap_per_unit_usd: "=restocking_fee_cap_per_unit_usd", missing_box_fee_usd: "=missing_box_fee_usd"}
        Quality Issue Return: {restocking_fee_pct_grade_b: "=restocking_fee_pct_grade_b", restocking_fee_cap_per_unit_usd: "=restocking_fee_cap_per_unit_usd", missing_box_fee_usd: "=missing_box_fee_usd"}
    formula:
      restocking_fee_per_unit: "min(round(merchandise_amount_usd / quantity * restocking_fee_pct_grade_b / 100, 2), restocking_fee_cap_per_unit_usd)"

  - id: returns_evt_refund_settlement
    subject: [returns_refund_credited, returns_refund_issued, returns_settled]
    rule: >-
      For each line, the value credited is the net unit price paid — the booked unit price less its
      allocated promotion discount, less any price adjustment or late promotion credited on that line —
      times the accepted units, plus the sales tax on those units (`refund_includes_sales_tax`), which is the order's sales tax times the line's refunded net merchandise divided by the order's net merchandise (`tax_refund_basis`), rounded half up to the cent per line (`refund_rounding_rule`); the
      original shipping fee and surcharge are added only where `refund_includes_original_shipping`.
      Returning units never claws back a promotion beyond the discount already allocated to the
      returned line, and never re-charges a shipping fee that a free-shipping threshold had waived. A
      final-settlement refund is issued only once the return is in status inspected; the instant store
      credit alone is issued earlier, when the return is in status in_transit at its first carrier scan.
      The amount paid is returns_msr_refund_due after fees. Per `refund_form`: original_tenders pays the
      tenders captured on the order in the orders charter's `tender_refund_priority`, each up to what
      remains refundable on it (returns_msr_refundable_by_tender), a stored-value instrument being
      refunded to itself under the credit charter; return_store_credit pays one new Return Store Credit
      (tender_type return_store_credit_new) to the returning customer. Only one refund row is paid per
      refund stage and tender instrument. Settling the return reverses the points earned on the
      refunded merchandise under the loyalty charter. A return is settled within
      `settlement_sla_business_days` business days of inspection.
    eligibility:
      - id: refund_after_inspection
        applies_to: [returns_refund_issued]
        kind: state
        condition: "A final-settlement refund is issued only once the return is in status inspected; the instant store credit alone is issued earlier, when the return is in status in_transit at its first carrier scan."
        evidence_fields: [return_cases.status, return_cases.return_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [return_cases.return_id]
          action_bindings:
            return_cases.return_id: return_id
        state_contract:
          field: return_cases.status
          allowed: [in_transit, inspected]
      - id: one_payment_per_stage_tender
        applies_to: [returns_refund_issued]
        kind: dedup
        condition: "Only one refund row is paid per refund stage and tender instrument."
        evidence_fields: [return_settlements.return_id, return_settlements.refund_stage, return_settlements.tender_type, return_settlements.instrument_id, return_settlements.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [return_settlements.return_id, return_settlements.refund_stage, return_settlements.tender_type, return_settlements.instrument_id]
          action_bindings:
            return_settlements.return_id: return_id
            return_settlements.refund_stage: refund_stage
            return_settlements.tender_type: tender_type
            return_settlements.instrument_id: instrument_id
        dedup_contract:
          table: return_settlements
          mode: separate_record
          object_bindings: {return_id: return_id, refund_stage: refund_stage, tender_type: tender_type, instrument_id: instrument_id}
          duplicate_filters: {event_type: [returns_refund_issued]}
          distinct_fields: []
    params:
      per_tier:
        Standard Return: {refund_form: "=refund_form", refund_includes_original_shipping: "=refund_includes_original_shipping"}
        Store Credit Return: {refund_form: "=refund_form", refund_includes_original_shipping: "=refund_includes_original_shipping"}
        Size Exchange: {refund_form: "=refund_form", refund_includes_original_shipping: "=refund_includes_original_shipping"}
        Instant Exchange: {refund_form: "=refund_form", refund_includes_original_shipping: "=refund_includes_original_shipping"}
        Gift Return: {refund_form: "=refund_form", refund_includes_original_shipping: "=refund_includes_original_shipping"}
        Quality Issue Return: {refund_form: "=refund_form", refund_includes_original_shipping: "=refund_includes_original_shipping"}
    measures: [returns_msr_refundable_by_tender, returns_msr_refund_due]

  - id: returns_evt_instant_credit
    subject: [returns_first_scanned, returns_instant_credit_reversed]
    rule: >-
      Where `instant_credit_at_first_scan`, a Return Store Credit for the full value credited-to-be of
      the authorized units, before fees, is issued on the date of the first carrier scan. At settlement
      the difference between that instant credit and what is actually owed after inspection and fees is
      reconciled: a positive difference is paid as further Return Store Credit on the same instrument at
      final settlement; a negative difference is recovered from the Return Store Credit instrument up to
      its current balance, and any shortfall already spent is charged to the original card
      (`instant_credit_shortfall_recovery`). An instant credit is reversed only once the return is in
      status inspected.
    eligibility:
      - id: reverse_after_inspection
        applies_to: [returns_instant_credit_reversed]
        kind: state
        condition: "An instant credit is reversed only once the return is in status inspected."
        evidence_fields: [return_cases.status, return_cases.return_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [return_cases.return_id]
          action_bindings:
            return_cases.return_id: return_id
        state_contract:
          field: return_cases.status
          allowed: [inspected]

  - id: returns_evt_exchange
    subject: [returns_exchange_shipped, returns_hold_placed, returns_hold_released, returns_hold_captured]
    rule: >-
      An exchange replaces returned units with the same style at the same price in another size or
      colour (`exchange_price_rule`); a different style, or a price difference, is a return plus a new
      order. The replacement ships free (`exchange_outbound_shipping_fee_usd`) as a no-charge order. A
      Size Exchange ships the replacement at settlement; when the replacement is out of stock by then the
      return is settled as a refund to the original tenders (`exchange_out_of_stock_fallback`). An
      Instant Exchange ships the replacement at authorization and is offered only when the original
      order was paid at least partly by card or wallet (`instant_exchange_requires_card_tender`) and
      the replacement's retail value does not exceed `instant_exchange_max_value_usd`. An Instant
      Exchange hold is placed only with the customer's own consent to a card hold of the replacement
      price plus tax (`hold_amount_basis`). The hold is released when the returns centre receives the
      parcel, and charged when the return expires, is cancelled, or every original unit is rejected or
      missing at inspection (`hold_capture_trigger`); for a partial rejection the hold is charged in full
      and the accepted units are refunded to the original tenders at settlement. A hold is released only
      while the return is in status received, inspected or settled. A hold is charged only while the
      return is in status expired, cancelled or inspected.
    eligibility:
      - id: hold_consent
        applies_to: [returns_hold_placed]
        kind: caller_fact
        condition: "An Instant Exchange hold is placed only with the customer's own consent to a card hold of the replacement price plus tax (`hold_amount_basis`)."
        evidence_fields: [return_cases.return_id, return_cases.variant_name]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [return_cases.return_id]
          action_bindings:
            return_cases.return_id: return_id
      - id: release_after_receipt
        applies_to: [returns_hold_released]
        kind: state
        condition: "A hold is released only while the return is in status received, inspected or settled."
        evidence_fields: [return_cases.status, return_cases.return_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [return_cases.return_id]
          action_bindings:
            return_cases.return_id: return_id
        state_contract:
          field: return_cases.status
          allowed: [received, inspected, settled]
      - id: capture_on_failure
        applies_to: [returns_hold_captured]
        kind: state
        condition: "A hold is charged only while the return is in status expired, cancelled or inspected."
        evidence_fields: [return_cases.status, return_cases.return_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [return_cases.return_id]
          action_bindings:
            return_cases.return_id: return_id
        state_contract:
          field: return_cases.status
          allowed: [expired, cancelled, inspected]
    params:
      per_tier:
        Standard Return: {exchange_ships: "=exchange_ships", instant_exchange_max_value_usd: "=instant_exchange_max_value_usd"}
        Store Credit Return: {exchange_ships: "=exchange_ships", instant_exchange_max_value_usd: "=instant_exchange_max_value_usd"}
        Size Exchange: {exchange_ships: "=exchange_ships", instant_exchange_max_value_usd: "=instant_exchange_max_value_usd"}
        Instant Exchange: {exchange_ships: "=exchange_ships", instant_exchange_max_value_usd: "=instant_exchange_max_value_usd"}
        Gift Return: {exchange_ships: "=exchange_ships", instant_exchange_max_value_usd: "=instant_exchange_max_value_usd"}
        Quality Issue Return: {exchange_ships: "=exchange_ships", instant_exchange_max_value_usd: "=instant_exchange_max_value_usd"}

  - id: returns_evt_deadline
    subject: [returns_deadline_extended, returns_expired, returns_cancelled]
    rule: >-
      A return-by date is extended by `deadline_extension_days` calendar days at most
      `deadline_extension_limit` time per return. An extension is granted only if it is requested no
      later than the return-by date of the authorization. The return-by date itself still counts, and
      the extension is added in calendar days to the current return-by date. The return must be in
      status authorized, and the extension is never granted after the return has expired; an expired
      authorization cannot be reopened and the customer must start a new return, which is possible only
      if its own window is still open. An authorization with no first carrier scan by its return-by date
      expires on the following day. An authorization is cancelled only while it is in status authorized
      — once the parcel is scanned it can no longer be cancelled.
    eligibility:
      - id: extension_before_deadline
        applies_to: [returns_deadline_extended]
        kind: time
        condition: "An extension is granted only if it is requested no later than the return-by date of the authorization."
        evidence_fields: [return_cases.return_by_date, return_cases.return_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [return_cases.return_id]
          action_bindings:
            return_cases.return_id: return_id
        temporal_basis:
          clock: frozen_time
          anchor_event: "the return-by date of the authorization"
          anchor_source: return_cases.return_by_date
          relation: not_after
          duration_source: params.extension_request_lead_days
          unit: calendar_days
          counting_rule: "The return-by date itself still counts, and the extension is added in calendar days to the current return-by date."
          boundary: inclusive
      - id: authorized_only
        applies_to: [returns_deadline_extended]
        kind: state
        condition: "The return must be in status authorized, and the extension is never granted after the return has expired; an expired authorization cannot be reopened and the customer must start a new return, which is possible only if its own window is still open."
        evidence_fields: [return_cases.status, return_cases.return_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [return_cases.return_id]
          action_bindings:
            return_cases.return_id: return_id
        state_contract:
          field: return_cases.status
          allowed: [authorized]
      - id: one_extension
        applies_to: [returns_deadline_extended]
        kind: dedup
        condition: "A return-by date is extended by `deadline_extension_days` calendar days at most `deadline_extension_limit` time per return."
        evidence_fields: [return_cases.deadline_extensions_used, return_cases.return_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [return_cases.return_id]
          action_bindings:
            return_cases.return_id: return_id
        dedup_contract:
          table: return_cases
          mode: same_record
          object_bindings: {return_id: return_id}
          duplicate_filters: {deadline_extensions_used: [1]}
          distinct_fields: []
    params:
      extension_request_lead_days: 0

  - id: returns_logistics
    subject: [returns_received, returns_deemed_received, returns_inspected]
    rule: >-
      A return parcel is received at the returns centre and inspected within
      `inspection_sla_business_days` business days of receipt. When a parcel on a Marlowe & Finch label
      or QR code shows no carrier movement for `lost_return_trace_business_days` business days after its
      last scan, it is traced with the carrier and, when the carrier declares it lost, deemed received
      with every authorized unit accepted at grade A; a parcel the customer shipped on their own label is
      never deemed received. Inspection results are final; a customer who disputes a grade is handed to
      a human representative.
    eligibility: []

  - id: returns_evt_quality_issue
    subject: [returns_authorized]
    rule: >-
      A Quality Issue Return covers a manufacturing defect that appears in normal use — seam or stitching
      failure, sole separation, broken hardware, colour bleeding — within `base_return_window_days`, or
      `footwear_return_window_days` for footwear, of the delivered date. A Quality Issue Return is
      authorized only if defect photos are on the return (`requires_defect_photos`), recorded by their
      upload reference. Damage caused in transit and reported within the claims charter's damage
      reporting window, a wrong item, or a missing item is a delivery claim, not a quality return; wear
      and tear, alterations, and damage from misuse are not defects. A Quality Issue Return refunds the
      original tenders with the original shipping fee share and carries no method or restocking fee.
    eligibility:
      - id: photos_on_file
        applies_to: [returns_authorized]
        kind: caller_fact
        condition: "A Quality Issue Return is authorized only if defect photos are on the return (`requires_defect_photos`), recorded by their upload reference."
        evidence_fields: [return_cases.defect_photo_reference, return_cases.return_id]
        evidence_contract:
          authority: caller_statement
          timing: pre_action
          correlation_keys:
            - [return_cases.return_id]
          action_bindings:
            return_cases.return_id: return_id

  - id: returns_evt_gift_return
    subject: [returns_authorized, returns_refund_issued]
    rule: >-
      On a Gift Return the recipient, under their own profile, returns units of an order flagged is_gift
      that someone else placed. The refund is the net price paid (`gift_return_refund_basis`) as one new
      Return Store Credit issued to the recipient, never to the purchaser's tenders, and the purchaser is
      not told (`gift_return_purchaser_notified`). The points the purchaser earned on the returned units
      are still reversed on the purchaser's membership. Neither customer's Marlowe Rewards or Unlimited
      perks change the window or the fees of a Gift Return. A gift recipient who wants an exchange
      receives the store credit and places a new order.
    eligibility: []

# ============================================================================
# extended_policies (returns_and_exchanges difficulty)
# ============================================================================
extended_policies:
  # ---------------------------------------------------------------------------------------------
  - id: returns_ext_line_credit
    base_policy_refs: [returns_evt_refund_settlement]
    overwrite:
      - base_policy: returns_evt_refund_settlement
        superseded_clause: >-
          plus the sales tax on those units (`refund_includes_sales_tax`), which is the order's sales tax times the line's refunded net merchandise divided by the order's net merchandise (`tax_refund_basis`), rounded half up to the cent per line (`refund_rounding_rule`)
        replaced_by: >-
          For an order shipped to Pennsylvania, New Jersey or Minnesota, states that exempt clothing and footwear, an accessories line takes its share of the tax over the order's accessories merchandise that shipped (accessories booked less accessories cancelled before dispatch), and an apparel or footwear line is credited no sales tax; any other line takes its share over the order's net merchandise at placement.
      - base_policy: returns_evt_refund_settlement
        superseded_clause: >-
          For each line, the value credited is the net unit price paid — the booked unit price less its allocated promotion discount, less any price adjustment or late promotion credited on that line — times the accepted units
        replaced_by: >-
          A unit is never compensated twice, so compensation a delivery claim already paid on the line is also taken off the net unit price paid before the merchandise credit is worked out: when a merchandise refund was paid on units of the line, that refund divided by the units it covered is taken off; when no merchandise refund but a Goodwill Credit was given on the line, that credit divided by the units booked on the line is taken off; any other line has nothing more taken off.
    trigger: state_due
    subject: [returns_refund_credited]
    computes: tax_amount_usd
    target_tool: credit_inspected_line_1e38d691
    params:
      no_compensation: 0
      no_delivery_share: 0
      full_delivery_share: 1
    rule: >-
      Once a return is in status inspected, the returns desk books one credit entry for each order line
      whose units were accepted at inspection, holding a merchandise credit and a sales tax credited and
      no shipping part. The line credited is the line whose inspection entries show units accepted or
      accepted with fee, and its accepted units are the units on those inspection entries.
      The line's merchandise credit is its net unit price paid times its accepted units, rounded half up to the cent, where the net unit price paid is the booked unit price less the checkout promotion discount, any late promotion credit and any price adjustment on the line, each divided by the units booked on the line.
      The sales tax credited on a returned line is the order's sales tax charged at placement times the line's merchandise credit divided by the order's net merchandise at placement (merchandise subtotal less discount total), rounded half up to the cent.
      A unit is never compensated twice, so compensation a delivery claim already paid on the line is also taken off the net unit price paid before the merchandise credit is worked out: when a merchandise refund was paid on units of the line, that refund divided by the units it covered is taken off; when no merchandise refund but a Goodwill Credit was given on the line, that credit divided by the units booked on the line is taken off; any other line has nothing more taken off.
      For an order shipped to Pennsylvania, New Jersey or Minnesota, states that exempt clothing and footwear, an accessories line takes its share of the tax over the order's accessories merchandise that shipped (accessories booked less accessories cancelled before dispatch), and an apparel or footwear line is credited no sales tax; any other line takes its share over the order's net merchandise at placement.
      The tax the share is taken from depends on what happened before dispatch: for an order with a line cancelled before dispatch and captured entirely on the card, it is the amount the card capture carried beyond the merchandise that shipped (net merchandise at placement less the cancelled lines) and the shipping fee; for an order with a line cancelled before dispatch and captured partly on stored value, it is the sales tax charged at placement times the merchandise that shipped divided by the net merchandise at placement; any other order uses the sales tax charged at placement.
      Only the part of that tax that sits on merchandise is shared out: it is that tax times the taxable goods that shipped divided by those goods plus the shipping fee times the delivery charge's taxable share, the taxable goods being the accessories that shipped for Pennsylvania, New Jersey and Minnesota and all merchandise that shipped elsewhere.
      The delivery charge's taxable share follows the ship-to state: Pennsylvania, New Jersey and Minnesota tax a charged delivery fee in proportion to the taxable goods, so the share is the accessories that shipped over all merchandise that shipped when accessories shipped; New York and Texas tax a charged delivery fee in full, so the share is one; any other order uses a share of zero.
      The sales tax credited is the merchandise tax times the line's share, multiplied once and rounded half up to the cent only at the end, and the merchandise credit entered is the one worked out after the compensation already paid.
    prerequisite: []
    cross_category:
      - category: orders
        as: history
        reads: [orders.ship_to_state, orders.shipping_fee_usd, orders.merchandise_subtotal_usd, orders.discount_total_usd, orders.sales_tax_usd, order_lines.unit_price_usd, order_lines.quantity, order_lines.line_discount_usd, order_lines.amount_usd, order_lines.product_class, order_payments.amount_usd]
        note: The order's lines, cancellations, reductions, captures and ship-to state decide the net unit price, the tax share basis, the tax standing and the delivery charge's taxable share.
      - category: claims
        as: history
        reads: [claim_events.compensation_type, claim_events.amount_usd, claim_events.quantity, claim_events.booked_line_id]
        note: Compensation a delivery claim already paid on the line decides the compensation taken off the net unit price.
    compute:
      - line_accepted: "LATEST('return_lines','booked_line_id', date_field='event_date', event_type='returns_line_inspected', inspection_outcome='accepted')"
      - line_accepted_fee: "LATEST('return_lines','booked_line_id', date_field='event_date', event_type='returns_line_inspected', inspection_outcome='accepted_with_fee')"
      - credit_line: "line_accepted if line_accepted else line_accepted_fee"
      - accepted_units: "SUM('return_lines','quantity', event_type='returns_line_inspected', booked_line_id=credit_line, inspection_outcome='accepted') + SUM('return_lines','quantity', event_type='returns_line_inspected', booked_line_id=credit_line, inspection_outcome='accepted_with_fee')"
      - booked_price: "XLATEST('orders','order_lines','unit_price_usd', order_line_id=credit_line)"
      - booked_units: "XLATEST('orders','order_lines','quantity', order_line_id=credit_line)"
      - net_unit_price: "booked_price - (XLATEST('orders','order_lines','line_discount_usd', order_line_id=credit_line) - XSUM('orders','order_lines','amount_usd', booked_line_id=credit_line, event_type='orders_post_purchase_promo') - XSUM('orders','order_lines','amount_usd', booked_line_id=credit_line, event_type='orders_price_adjusted')) / booked_units"
      - claim_refund_paid: "XSUM('claims','claim_events','amount_usd', booked_line_id=credit_line, event_type='claims_compensation_issued', compensation_type='merchandise_refund')"
      - claim_refund_units: "XSUM('claims','claim_events','quantity', booked_line_id=credit_line, event_type='claims_compensation_issued', compensation_type='merchandise_refund')"
      - claim_goodwill_paid: "XSUM('claims','claim_events','amount_usd', booked_line_id=credit_line, event_type='claims_compensation_issued', compensation_type='goodwill_credit')"
      - compensation_per_unit: "claim_refund_paid / claim_refund_units if claim_refund_paid > 0 else (claim_goodwill_paid / booked_units if claim_goodwill_paid > 0 else K('no_compensation'))"
      - merchandise_credit: "RND((net_unit_price - compensation_per_unit) * accepted_units, 2)"
      - order_ref: "F('order_id')"
      - ship_state: "CFIELD('orders','ship_to_state', order_id=order_ref)"
      - placed_net: "CFIELD('orders','merchandise_subtotal_usd', order_id=order_ref) - CFIELD('orders','discount_total_usd', order_id=order_ref)"
      - placed_tax: "CFIELD('orders','sales_tax_usd', order_id=order_ref)"
      - cancelled_net: "-XSUM('orders','order_lines','amount_usd', order_id=order_ref, event_type='orders_line_cancelled')"
      - shipped_net: "placed_net - cancelled_net"
      - cancelled_line: "XLATEST('orders','order_lines','booked_line_id', order_id=order_ref, event_type='orders_line_cancelled')"
      - cancelled_class: "XLATEST('orders','order_lines','product_class', order_line_id=cancelled_line)"
      - accessories_booked: "XSUM('orders','order_lines','amount_usd', order_id=order_ref, event_type='orders_line_booked', product_class='accessories')"
      - accessories_shipped: "accessories_booked - (cancelled_net if cancelled_class == 'accessories' else 0)"
      - exempt_state: "ship_state == 'PA' or ship_state == 'NJ' or ship_state == 'MN'"
      - line_class: "XLATEST('orders','order_lines','product_class', order_line_id=credit_line)"
      - tax_share: "merchandise_credit / accessories_shipped if (exempt_state and line_class == 'accessories') else (0 if (exempt_state and (line_class == 'apparel' or line_class == 'footwear')) else merchandise_credit / placed_net)"
      - card_captured: "XSUM('orders','order_payments','amount_usd', order_id=order_ref, event_type='orders_payment_captured', tender_type='card_or_wallet')"
      - stored_captured: "XSUM('orders','order_payments','amount_usd', order_id=order_ref, event_type='orders_payment_captured') - card_captured"
      - shipping_fee: "CFIELD('orders','shipping_fee_usd', order_id=order_ref)"
      - tax_standing: "(card_captured - shipped_net - shipping_fee) if (cancelled_net > 0 and stored_captured == 0) else (placed_tax * shipped_net / placed_net if (cancelled_net > 0 and stored_captured > 0) else placed_tax)"
      - taxable_goods: "accessories_shipped if exempt_state else shipped_net"
      - delivery_share: "accessories_shipped / shipped_net if (exempt_state and shipping_fee > 0 and accessories_shipped > 0) else (K('full_delivery_share') if ((ship_state == 'NY' or ship_state == 'TX') and shipping_fee > 0) else K('no_delivery_share'))"
      - merchandise_tax: "tax_standing * taxable_goods / (taxable_goods + shipping_fee * delivery_share) if taxable_goods > 0 else tax_standing"
      - result: "RND(merchandise_tax * tax_share, 2)"
    compute_basis:
      line_accepted: "The line credited is the line whose inspection entries show units accepted or accepted with fee, and its accepted units are the units on those inspection entries."
      line_accepted_fee: "The line credited is the line whose inspection entries show units accepted or accepted with fee, and its accepted units are the units on those inspection entries."
      accepted_units: "The line credited is the line whose inspection entries show units accepted or accepted with fee, and its accepted units are the units on those inspection entries."
      net_unit_price: "The line's merchandise credit is its net unit price paid times its accepted units, rounded half up to the cent, where the net unit price paid is the booked unit price less the checkout promotion discount, any late promotion credit and any price adjustment on the line, each divided by the units booked on the line."
      compensation_per_unit: "A unit is never compensated twice, so compensation a delivery claim already paid on the line is also taken off the net unit price paid before the merchandise credit is worked out: when a merchandise refund was paid on units of the line, that refund divided by the units it covered is taken off; when no merchandise refund but a Goodwill Credit was given on the line, that credit divided by the units booked on the line is taken off; any other line has nothing more taken off."
      merchandise_credit: "The sales tax credited is the merchandise tax times the line's share, multiplied once and rounded half up to the cent only at the end, and the merchandise credit entered is the one worked out after the compensation already paid."
      placed_net: "the order's net merchandise at placement (merchandise subtotal less discount total)"
      placed_tax: "The sales tax credited on a returned line is the order's sales tax charged at placement times the line's merchandise credit divided by the order's net merchandise at placement (merchandise subtotal less discount total), rounded half up to the cent."
      cancelled_net: "the merchandise that shipped (net merchandise at placement less the cancelled lines)"
      accessories_shipped: "the order's accessories merchandise that shipped (accessories booked less accessories cancelled before dispatch)"
      tax_share: "For an order shipped to Pennsylvania, New Jersey or Minnesota, states that exempt clothing and footwear, an accessories line takes its share of the tax over the order's accessories merchandise that shipped (accessories booked less accessories cancelled before dispatch), and an apparel or footwear line is credited no sales tax; any other line takes its share over the order's net merchandise at placement."
      tax_standing: "for an order with a line cancelled before dispatch and captured entirely on the card, it is the amount the card capture carried beyond the merchandise that shipped (net merchandise at placement less the cancelled lines) and the shipping fee; for an order with a line cancelled before dispatch and captured partly on stored value, it is the sales tax charged at placement times the merchandise that shipped divided by the net merchandise at placement; any other order uses the sales tax charged at placement."
      taxable_goods: "the taxable goods being the accessories that shipped for Pennsylvania, New Jersey and Minnesota and all merchandise that shipped elsewhere"
      delivery_share: "The delivery charge's taxable share follows the ship-to state: Pennsylvania, New Jersey and Minnesota tax a charged delivery fee in proportion to the taxable goods, so the share is the accessories that shipped over all merchandise that shipped when accessories shipped; New York and Texas tax a charged delivery fee in full, so the share is one; any other order uses a share of zero."
      merchandise_tax: "Only the part of that tax that sits on merchandise is shared out: it is that tax times the taxable goods that shipped divided by those goods plus the shipping fee times the delivery charge's taxable share, the taxable goods being the accessories that shipped for Pennsylvania, New Jersey and Minnesota and all merchandise that shipped elsewhere."
      result: "The sales tax credited is the merchandise tax times the line's share, multiplied once and rounded half up to the cent only at the end, and the merchandise credit entered is the one worked out after the compensation already paid."
    factors:
      - id: claim_compensation_taken_off
        effect: parameter
        decides: compensation_per_unit
        bindings: [claim_refund_paid, claim_refund_units, claim_goodwill_paid, compensation_per_unit]
        ladder:
          - when: "a delivery claim paid a merchandise refund on units of the line"
            value: "that refund / the units it covered"
          - when: "no merchandise refund, and a delivery claim gave a Goodwill Credit on the line"
            value: "that Goodwill Credit / units booked on the line"
          - when: "otherwise"
            value: "K('no_compensation') = 0"
        baseline:
          compensation_per_unit: "K('no_compensation')"
        evidence: [cross_category]
        cross_difficulty: claims
      - id: exempt_goods_tax_basis
        effect: method
        decides: tax_share
        bindings: [line_class, exempt_state, tax_share]
        ladder:
          - when: "order shipped to Pennsylvania, New Jersey or Minnesota AND the line is accessories"
            method: "the line's share is its merchandise credit over the order's accessories merchandise that shipped"
          - when: "order shipped to Pennsylvania, New Jersey or Minnesota AND the line is apparel or footwear"
            method: "the line takes no share of the tax"
          - when: "otherwise"
            method: "the line's share is its merchandise credit over the order's net merchandise at placement"
        baseline:
          tax_share: "merchandise_credit / placed_net"
        evidence: [history]
        cross_difficulty: null
      - id: tax_standing_at_dispatch
        effect: method
        decides: tax_standing
        bindings: [card_captured, stored_captured, tax_standing]
        ladder:
          - when: "a line was cancelled before dispatch AND the order was captured entirely on the card"
            method: "the tax is what the card capture carried beyond the merchandise that shipped and the shipping fee"
          - when: "a line was cancelled before dispatch AND part of the capture was on stored value"
            method: "the placement sales tax scaled by the merchandise that shipped over the net merchandise at placement"
          - when: "otherwise"
            method: "the sales tax charged at placement"
        baseline:
          tax_standing: "placed_tax"
        evidence: [history]
        cross_difficulty: null
      - id: delivery_charge_taxable_share
        effect: parameter
        decides: delivery_share
        bindings: [shipping_fee, delivery_share]
        ladder:
          - when: "order shipped to Pennsylvania, New Jersey or Minnesota AND a shipping fee was charged AND accessories shipped"
            value: "accessories shipped / merchandise shipped"
          - when: "order shipped to New York or Texas AND a shipping fee was charged"
            value: "K('full_delivery_share') = 1"
          - when: "otherwise"
            value: "K('no_delivery_share') = 0"
        baseline:
          delivery_share: "K('no_delivery_share')"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The line's merchandise credit is its net unit price paid times its accepted units, rounded half up to the cent, where the net unit price paid is the booked unit price less the checkout promotion discount, any late promotion credit and any price adjustment on the line, each divided by the units booked on the line.
        The sales tax credited on a returned line is the order's sales tax charged at placement times the line's merchandise credit divided by the order's net merchandise at placement (merchandise subtotal less discount total), rounded half up to the cent.
      params: [no_compensation]
    inputs:
      history:
        - {table: return_lines, aggregate: sum, field: quantity, filters: {event_type: returns_line_inspected}}
        - {category: orders, table: order_lines, aggregate: sum, field: amount_usd, filters: {event_type: orders_line_cancelled}}
        - {category: orders, table: order_payments, aggregate: sum, field: amount_usd, filters: {event_type: orders_payment_captured}}
        - {category: claims, table: claim_events, aggregate: sum, field: amount_usd, filters: {event_type: claims_compensation_issued}}
      cross_category: [orders, claims]
  # ---------------------------------------------------------------------------------------------
  - id: returns_ext_grade_b_restocking
    base_policy_refs: [returns_evt_method_fee, returns_evt_inspection_restocking]
    overwrite:
      - base_policy: returns_evt_inspection_restocking
        superseded_clause: >-
          the fee per unit is `restocking_fee_pct_grade_b` percent of the net unit price paid, rounded half up to the cent and capped at `restocking_fee_cap_per_unit_usd`
        replaced_by: >-
          The restocking percentage is the member percentage plus the timing, reason and product points, never below zero, and the restocking fee per unit is that percentage of the restocking price basis, rounded half up to the cent, multiplied by the return-frequency multiplier and capped at `restocking_fee_cap_per_unit_usd` only after that multiplication.
    trigger: state_due
    subject: [returns_fee_assessed]
    computes: fee_amount_usd
    target_tool: assess_restocking_fee_49fe3caa
    params:
      gold_pct: 10
      gold_tenure_months: 60
      late_scan_days: 30
      late_points: 5
      quick_scan_days: 10
      quick_points: 3
      changed_mind_points: 3
      fault_points: 5
      accessories_points: 2
      footwear_points: 1
      frequent_reversals: 6
      frequent_multiplier: 2
      regular_reversals: 3
      regular_multiplier: 1.5
      half_up_nudge: 0.000001
    rule: >-
      Once a return is in status inspected, the returns desk withholds one restocking fee for each order line
      with units graded B (unworn, tags detached), charged on that line's units graded B; a Store Credit Return,
      a Standard Return and a Gift Return carry it, an exchange or a Quality Issue Return never does.
      The restocking fee per unit is `restocking_fee_pct_grade_b` percent of the line's merchandise credit per accepted unit, rounded half up to the cent and capped at `restocking_fee_cap_per_unit_usd`.
      The restocking fee withheld is the restocking fee per unit times the line's units graded B, rounded half up to the cent.
      A restocking fee is worked out only after the line it is charged on carries the credit entry for its accepted units.
      The member percentage is set by the returning customer's Marlowe Rewards membership in status active and is never read on a Gift Return: a membership whose tier carries `restocking_fee_waiver` and has held that tier since on or before the return's authorization date pays no restocking fee at all; a Marlowe Rewards Gold membership enrolled at least `gold_tenure_months` calendar months before today uses `gold_pct` percent; every other customer, and every Gift Return, uses `restocking_fee_pct_grade_b` percent.
      Timing points follow the days from the order's delivered date to the parcel's first carrier scan: more than `late_scan_days` days adds `late_points` points; `quick_scan_days` days or fewer takes off `quick_points` points; anything in between adds none.
      Reason points follow the reason given for the line on the authorization: changed_mind adds `changed_mind_points` points; not_as_pictured or arrived_too_late takes off `fault_points` points; any other reason adds none.
      Product points follow the line's merchandise class: accessories add `accessories_points` points, footwear adds `footwear_points` point, any other class adds none.
      The restocking percentage is the member percentage plus the timing, reason and product points, never below zero, and the restocking fee per unit is that percentage of the restocking price basis, rounded half up to the cent, multiplied by the return-frequency multiplier and capped at `restocking_fee_cap_per_unit_usd` only after that multiplication.
      The restocking price basis is set by what was taken off the line after its list price: a line carrying a price adjustment uses its merchandise credit per accepted unit plus the price adjustment per unit booked; a line with no price adjustment that carries a checkout promotion discount or a late promotion credit uses its merchandise credit per accepted unit plus those per unit booked; any other line uses its merchandise credit per accepted unit.
      Return frequency then multiplies the restocking fee per unit: a customer whose Marlowe Rewards points ledger shows `frequent_reversals` or more points reversals posted in the last 12 calendar months pays `frequent_multiplier` times it; `regular_reversals` to one fewer than `frequent_reversals` reversals, `regular_multiplier` times it; anyone else pays it as worked out.
      The multiplied fee per unit is rounded half up to the cent, then capped at `restocking_fee_cap_per_unit_usd`, is never larger than the line's merchandise credit per accepted unit, and is then multiplied by the units graded B and rounded half up to the cent.
    prerequisite:
      - problem: returns_ext_line_credit
        kind: value_input
        gate: credited_merch
        form: state
        policy_source: >-
          A restocking fee is worked out only after the line it is charged on carries the credit entry for its accepted units.
        condition: >-
          The return's settlement entries include a returns_refund_credited entry for the booking line whose units were graded B, carrying the merchandise credit of its accepted units.
        resolved_by: credit_inspected_line_1e38d691
        effect: >-
          Once the credit entry is booked, the merchandise credit per accepted unit that the restocking price basis and the per-unit ceiling rest on is that entry's merchandise part divided by the accepted units instead of zero.
    cross_category:
      - category: orders
        as: history
        reads: [orders.delivered_date, order_lines.quantity, order_lines.line_discount_usd, order_lines.amount_usd, order_lines.product_class]
        note: The order's delivered date, the line's class and its post-list reductions decide the timing points, product points and restocking price basis.
      - category: loyalty
        as: history
        reads: [variant_name, enrolled_date, loyalty_ledger.event_type, loyalty_ledger.posting_date]
        note: The membership's tier and enrolment date decide the member percentage; the points reversals in its ledger decide the frequency multiplier.
    compute:
      - graded_b_line: "LATEST('return_lines','booked_line_id', date_field='event_date', event_type='returns_line_inspected', condition_grade='B')"
      - graded_b_units: "SUM('return_lines','quantity', event_type='returns_line_inspected', booked_line_id=graded_b_line, condition_grade='B')"
      - accepted_units_b: "SUM('return_lines','quantity', event_type='returns_line_inspected', booked_line_id=graded_b_line, inspection_outcome='accepted') + SUM('return_lines','quantity', event_type='returns_line_inspected', booked_line_id=graded_b_line, inspection_outcome='accepted_with_fee')"
      - credited_merch: "SUM('return_settlements','merchandise_amount_usd', event_type='returns_refund_credited', booked_line_id=graded_b_line)"
      - credit_per_unit: "credited_merch / accepted_units_b"
      - line_units_booked: "XLATEST('orders','order_lines','quantity', order_line_id=graded_b_line)"
      - line_adjustment: "-XSUM('orders','order_lines','amount_usd', booked_line_id=graded_b_line, event_type='orders_price_adjusted')"
      - line_promotions: "XLATEST('orders','order_lines','line_discount_usd', order_line_id=graded_b_line) - XSUM('orders','order_lines','amount_usd', booked_line_id=graded_b_line, event_type='orders_post_purchase_promo')"
      - price_basis: "credit_per_unit + line_adjustment / line_units_booked if line_adjustment > 0 else (credit_per_unit + line_promotions / line_units_booked if line_promotions > 0 else credit_per_unit)"
      - tier_name: "CFIELD('loyalty','variant_name', status='active')"
      - tier_waiver: "CPARAM('loyalty','restocking_fee_waiver', status='active')"
      - tenure_months: "MONTHS(CFIELD('loyalty','enrolled_date', status='active'), NOW)"
      - member_pct: "0 if (tier_waiver == True and DAYS(CFIELD('loyalty','tier_start_date', status='active'), F('opened_date')) >= 0 and F('variant_name') != 'Gift Return') else (K('gold_pct') if (tier_name == 'Marlowe Rewards Gold' and tenure_months >= K('gold_tenure_months') and F('variant_name') != 'Gift Return') else P('restocking_fee_pct_grade_b'))"
      - scan_days: "DAYS(CFIELD('orders','delivered_date', order_id=F('order_id')), F('first_scan_date'))"
      - timing_points: "K('late_points') if scan_days > K('late_scan_days') else (-K('quick_points') if scan_days <= K('quick_scan_days') else 0)"
      - b_reason: "LATEST('return_lines','return_reason', date_field='event_date', event_type='returns_line_authorized', booked_line_id=graded_b_line)"
      - reason_points: "K('changed_mind_points') if b_reason == 'changed_mind' else (-K('fault_points') if (b_reason == 'not_as_pictured' or b_reason == 'arrived_too_late') else 0)"
      - b_class: "XLATEST('orders','order_lines','product_class', order_line_id=graded_b_line)"
      - product_points: "K('accessories_points') if b_class == 'accessories' else (K('footwear_points') if b_class == 'footwear' else 0)"
      - reversals_12m: "XCOUNT('loyalty','loyalty_ledger', within_months=12, date_field='posting_date', event_type='loyalty_points_reversed')"
      - frequency_multiplier: "K('frequent_multiplier') if reversals_12m >= K('frequent_reversals') else (K('regular_multiplier') if reversals_12m >= K('regular_reversals') else 1)"
      - restock_percent: "0 if member_pct == 0 else MX(0, member_pct + timing_points + reason_points + product_points)"
      - unit_fee: "RND(price_basis * restock_percent / 100 + K('half_up_nudge'), 2)"
      - result: "RND(MN(P('restocking_fee_cap_per_unit_usd'), RND(unit_fee * frequency_multiplier + K('half_up_nudge'), 2), credit_per_unit) * graded_b_units + K('half_up_nudge'), 2)"
    compute_basis:
      graded_b_line: "the returns desk withholds one restocking fee for each order line with units graded B (unworn, tags detached), charged on that line's units graded B"
      graded_b_units: "The restocking fee withheld is the restocking fee per unit times the line's units graded B, rounded half up to the cent."
      credited_merch: "A restocking fee is worked out only after the line it is charged on carries the credit entry for its accepted units."
      credit_per_unit: "The restocking fee per unit is `restocking_fee_pct_grade_b` percent of the line's merchandise credit per accepted unit, rounded half up to the cent and capped at `restocking_fee_cap_per_unit_usd`."
      price_basis: "The restocking price basis is set by what was taken off the line after its list price: a line carrying a price adjustment uses its merchandise credit per accepted unit plus the price adjustment per unit booked; a line with no price adjustment that carries a checkout promotion discount or a late promotion credit uses its merchandise credit per accepted unit plus those per unit booked; any other line uses its merchandise credit per accepted unit."
      member_pct: "a membership whose tier carries `restocking_fee_waiver` and has held that tier since on or before the return's authorization date pays no restocking fee at all; a Marlowe Rewards Gold membership enrolled at least `gold_tenure_months` calendar months before today uses `gold_pct` percent; every other customer, and every Gift Return, uses `restocking_fee_pct_grade_b` percent."
      timing_points: "Timing points follow the days from the order's delivered date to the parcel's first carrier scan: more than `late_scan_days` days adds `late_points` points; `quick_scan_days` days or fewer takes off `quick_points` points; anything in between adds none."
      reason_points: "Reason points follow the reason given for the line on the authorization: changed_mind adds `changed_mind_points` points; not_as_pictured or arrived_too_late takes off `fault_points` points; any other reason adds none."
      product_points: "Product points follow the line's merchandise class: accessories add `accessories_points` points, footwear adds `footwear_points` point, any other class adds none."
      reversals_12m: "a customer whose Marlowe Rewards points ledger shows `frequent_reversals` or more points reversals posted in the last 12 calendar months"
      frequency_multiplier: "Return frequency then multiplies the restocking fee per unit: a customer whose Marlowe Rewards points ledger shows `frequent_reversals` or more points reversals posted in the last 12 calendar months pays `frequent_multiplier` times it; `regular_reversals` to one fewer than `frequent_reversals` reversals, `regular_multiplier` times it; anyone else pays it as worked out."
      restock_percent: "The restocking percentage is the member percentage plus the timing, reason and product points, never below zero, and the restocking fee per unit is that percentage of the restocking price basis, rounded half up to the cent, multiplied by the return-frequency multiplier and capped at `restocking_fee_cap_per_unit_usd` only after that multiplication."
      unit_fee: "The restocking percentage is the member percentage plus the timing, reason and product points, never below zero, and the restocking fee per unit is that percentage of the restocking price basis, rounded half up to the cent, multiplied by the return-frequency multiplier and capped at `restocking_fee_cap_per_unit_usd` only after that multiplication."
      result: "The multiplied fee per unit is rounded half up to the cent, then capped at `restocking_fee_cap_per_unit_usd`, is never larger than the line's merchandise credit per accepted unit, and is then multiplied by the units graded B and rounded half up to the cent."
    factors:
      - id: restock_price_basis
        effect: method
        decides: price_basis
        bindings: [line_units_booked, line_adjustment, line_promotions, price_basis]
        ladder:
          - when: "the line carries a price adjustment"
            method: "merchandise credit per accepted unit plus the price adjustment per unit booked"
          - when: "no price adjustment, and the line carries a checkout promotion discount or a late promotion credit"
            method: "merchandise credit per accepted unit plus those reductions per unit booked"
          - when: "otherwise"
            method: "merchandise credit per accepted unit"
        baseline:
          price_basis: "credit_per_unit"
        evidence: [history]
        cross_difficulty: null
      - id: member_restocking_percent
        effect: parameter
        decides: member_pct
        bindings: [tier_name, tier_waiver, tenure_months, member_pct]
        ladder:
          - when: "active membership whose tier carries restocking_fee_waiver AND held since on or before the authorization date AND the return is not a Gift Return"
            value: "0 (no restocking fee)"
          - when: "active Marlowe Rewards Gold membership AND enrolled at least gold_tenure_months months AND not a Gift Return"
            value: "K('gold_pct')"
          - when: "otherwise"
            value: "P('restocking_fee_pct_grade_b')"
        baseline:
          member_pct: "P('restocking_fee_pct_grade_b')"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
      - id: scan_timing_points
        effect: parameter
        decides: timing_points
        bindings: [scan_days, timing_points]
        ladder:
          - when: "first carrier scan more than late_scan_days days after delivery"
            value: "+K('late_points')"
          - when: "first carrier scan quick_scan_days days or fewer after delivery"
            value: "-K('quick_points')"
          - when: "otherwise"
            value: "0"
        baseline:
          timing_points: "0"
        evidence: [date]
        cross_difficulty: null
      - id: return_reason_points
        effect: parameter
        decides: reason_points
        bindings: [b_reason, reason_points]
        ladder:
          - when: "the line's reason is changed_mind"
            value: "+K('changed_mind_points')"
          - when: "the line's reason is not_as_pictured or arrived_too_late"
            value: "-K('fault_points')"
          - when: "otherwise"
            value: "0"
        baseline:
          reason_points: "0"
        evidence: [history]
        cross_difficulty: null
      - id: product_class_points
        effect: parameter
        decides: product_points
        bindings: [b_class, product_points]
        ladder:
          - when: "the line is accessories"
            value: "+K('accessories_points')"
          - when: "the line is footwear"
            value: "+K('footwear_points')"
          - when: "otherwise"
            value: "0"
        baseline:
          product_points: "0"
        evidence: [history]
        cross_difficulty: null
      - id: return_frequency_multiplier
        effect: parameter
        decides: frequency_multiplier
        bindings: [reversals_12m, frequency_multiplier]
        ladder:
          - when: "frequent_reversals or more points reversals in the last 12 calendar months"
            value: "K('frequent_multiplier')"
          - when: "regular_reversals to frequent_reversals minus one reversals in the last 12 calendar months"
            value: "K('regular_multiplier')"
          - when: "otherwise"
            value: "1"
        baseline:
          frequency_multiplier: "1"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
    baseline:
      rule: >-
        The restocking fee per unit is `restocking_fee_pct_grade_b` percent of the line's merchandise credit per accepted unit, rounded half up to the cent and capped at `restocking_fee_cap_per_unit_usd`.
        The restocking fee withheld is the restocking fee per unit times the line's units graded B, rounded half up to the cent.
      params: [restocking_fee_pct_grade_b, restocking_fee_cap_per_unit_usd]
    inputs:
      history:
        - {table: return_lines, aggregate: sum, field: quantity, filters: {event_type: returns_line_inspected, condition_grade: B}}
        - {table: return_settlements, aggregate: sum, field: merchandise_amount_usd, filters: {event_type: returns_refund_credited}}
        - {category: loyalty, table: loyalty_ledger, aggregate: count, field: points, within_months: 12, filters: {event_type: loyalty_points_reversed}}
      cross_category: [orders, loyalty]
  # ---------------------------------------------------------------------------------------------
  - id: returns_ext_spent_credit_recovery
    base_policy_refs: [returns_evt_instant_credit]
    overwrite:
      - base_policy: returns_evt_instant_credit
        superseded_clause: >-
          a negative difference is recovered from the Return Store Credit instrument up to its current balance, and any shortfall already spent is charged to the original card (`instant_credit_shortfall_recovery`)
        replaced_by: >-
          a negative difference is recovered from the Return Store Credit issued at the scan up to its current balance, and the part already spent is charged to the original card only on the cardholder's own authorization, in the amount set out below
    trigger: state_due
    subject: [returns_instant_credit_reversed]
    computes: charge_amount_usd
    target_tool: authorize_spent_credit_charge_4aac9d1c
    params:
      spend_year_months: 12
      top_spend_usd: 3000
      top_spend_factor: 0.8
      mid_spend_usd: 1500
      mid_spend_factor: 0.9
      writeoff_tenure_months: 60
      senior_writeoff_usd: 25
      gold_writeoff_usd: 10
      long_wait_days: 14
      long_wait_credit_usd: 10
      wait_days: 7
      wait_credit_usd: 5
    rule: >-
      On a Store Credit Return whose instant store credit, issued at the first carrier scan, is larger than what
      the return is owed once inspected, credited and charged its fees, a negative difference is recovered from the Return Store Credit issued at the scan up to its current balance, and the part already spent is charged to the original card only on the cardholder's own authorization, in the amount set out below.
      The spent shortfall is the instant credit paid at the first scan, less the credit entries on the return, plus the fees withheld on the return, less any recovery already entered, less the current balance of the Return Store Credit issued for the return, never below zero.
      The amount charged to the original card is the spent shortfall, rounded half up to the cent.
      The amount charged to the original card for spent instant credit is fixed only after every line accepted at inspection on the return carries its credit entry.
      That card charge is not worked out until every line with units graded B on the return carries its restocking fee entry.
      The spend history weighed for goodwill is measured in a way set by the cardholder's Marlowe Rewards membership in status active: a Platinum, Icon or Atelier membership is measured on its better membership year, the larger of the qualifying spend of its earning postings in the last `spend_year_months` calendar months and in the `spend_year_months` calendar months before them; a Gold membership on its gross spend, the qualifying spend of its earning postings in the last `spend_year_months` calendar months; anyone else on its kept spend, that qualifying spend less the spend reversed by its points reversals posted in the same months.
      Spend goodwill then scales the spent shortfall: a member whose Marlowe Rewards membership is in status active and whose spend history is at least `top_spend_usd` is charged `top_spend_factor` of it; an active member with at least `mid_spend_usd`, `mid_spend_factor` of it; anyone else the spent shortfall itself; the scaled amount is rounded half up to the cent before the amounts below are taken off.
      A tenure write-off is then taken off: a Marlowe Rewards Platinum, Icon or Atelier membership in status active enrolled at least `writeoff_tenure_months` calendar months before today has `senior_writeoff_usd` written off; a Marlowe Rewards Gold membership in status active enrolled that long has `gold_writeoff_usd` written off; anyone else has nothing written off.
      An inspection-wait credit is taken off as well: when the returns centre posted the inspection more than `long_wait_days` calendar days after it received the parcel, `long_wait_credit_usd`; more than `wait_days` calendar days, `wait_credit_usd`; otherwise nothing.
      The amount charged is the scaled spent shortfall less the write-off and the inspection-wait credit, rounded half up to the cent and never below zero.
    prerequisite:
      - problem: returns_ext_line_credit
        kind: value_input
        gate: credits_entered
        form: state
        policy_source: >-
          The amount charged to the original card for spent instant credit is fixed only after every line accepted at inspection on the return carries its credit entry.
        condition: >-
          Every booking line with an accepted or accepted-with-fee inspection entry on the Store Credit Return has a returns_refund_credited settlement entry.
        resolved_by: credit_inspected_line_1e38d691
        effect: >-
          The credit entries on the return rise by the credited value of each accepted line, and that value is taken off the instant credit in the spent shortfall.
      - problem: returns_ext_grade_b_restocking
        kind: value_input
        gate: fees_entered
        form: state
        policy_source: >-
          That card charge is not worked out until every line with units graded B on the return carries its restocking fee entry.
        condition: >-
          Every booking line with units graded B on the Store Credit Return has a returns_fee_assessed settlement entry of fee type restocking_fee.
        resolved_by: assess_restocking_fee_49fe3caa
        effect: >-
          The fees withheld on the return rise by the restocking fee, which is added to the spent shortfall.
    cross_category:
      - category: credit
        as: branch
        reads: [balance_usd, source_reference, variant_name]
        note: The current balance of the Return Store Credit issued for the return is recovered first and leaves the spent part.
      - category: loyalty
        as: history
        reads: [variant_name, enrolled_date, status, loyalty_ledger.event_type, loyalty_ledger.qualifying_spend_usd, loyalty_ledger.reversed_spend_usd, loyalty_ledger.posting_date]
        note: The tier decides how the spend history is measured (better membership year, gross spend or kept spend) and the tenure write-off; the qualifying and reversed spend in the ledger decide the spend goodwill.
    compute:
      - instant_paid: "-SUM('return_settlements','amount_usd', event_type='returns_refund_issued', refund_stage='instant_credit_at_scan')"
      - credits_entered: "SUM('return_settlements','amount_usd', event_type='returns_refund_credited')"
      - fees_entered: "-SUM('return_settlements','amount_usd', event_type='returns_fee_assessed')"
      - recovered_before: "SUM('return_settlements','amount_usd', event_type='returns_instant_credit_reversed')"
      - store_credit_balance: "CFIELD('credit','balance_usd', source_reference=HID, variant_name='Return Store Credit')"
      - spent_shortfall: "MX(0, instant_paid - credits_entered + fees_entered - recovered_before - store_credit_balance)"
      - member_tier: "CFIELD('loyalty','variant_name', status='active')"
      - earned_year: "XSUM('loyalty','loyalty_ledger','qualifying_spend_usd', within_months=K('spend_year_months'), date_field='posting_date', event_type='loyalty_points_earned')"
      - earned_two_years: "XSUM('loyalty','loyalty_ledger','qualifying_spend_usd', within_months=2 * K('spend_year_months'), date_field='posting_date', event_type='loyalty_points_earned')"
      - reversed_year: "XSUM('loyalty','loyalty_ledger','reversed_spend_usd', within_months=K('spend_year_months'), date_field='posting_date', event_type='loyalty_points_reversed')"
      - spend_history: "MX(earned_year, earned_two_years - earned_year) if (member_tier == 'Marlowe Rewards Platinum' or member_tier == 'Marlowe Rewards Icon' or member_tier == 'Marlowe Rewards Atelier') else (earned_year if member_tier == 'Marlowe Rewards Gold' else earned_year - reversed_year)"
      - membership_status: "CFIELD('loyalty','status')"
      - spend_factor: "K('top_spend_factor') if (membership_status == 'active' and spend_history >= K('top_spend_usd')) else (K('mid_spend_factor') if (membership_status == 'active' and spend_history >= K('mid_spend_usd')) else 1)"
      - member_tenure: "MONTHS(CFIELD('loyalty','enrolled_date', status='active'), NOW)"
      - tenure_writeoff: "K('senior_writeoff_usd') if ((member_tier == 'Marlowe Rewards Platinum' or member_tier == 'Marlowe Rewards Icon' or member_tier == 'Marlowe Rewards Atelier') and member_tenure >= K('writeoff_tenure_months')) else (K('gold_writeoff_usd') if (member_tier == 'Marlowe Rewards Gold' and member_tenure >= K('writeoff_tenure_months')) else 0)"
      - inspection_wait: "DAYS(F('received_date'), F('inspected_date'))"
      - wait_credit: "K('long_wait_credit_usd') if inspection_wait > K('long_wait_days') else (K('wait_credit_usd') if inspection_wait > K('wait_days') else 0)"
      - result: "MX(0, RND(RND(spent_shortfall * spend_factor, 2) - tenure_writeoff - wait_credit, 2))"
    compute_basis:
      instant_paid: "The spent shortfall is the instant credit paid at the first scan, less the credit entries on the return, plus the fees withheld on the return, less any recovery already entered, less the current balance of the Return Store Credit issued for the return, never below zero."
      credits_entered: "The amount charged to the original card for spent instant credit is fixed only after every line accepted at inspection on the return carries its credit entry."
      fees_entered: "That card charge is not worked out until every line with units graded B on the return carries its restocking fee entry."
      recovered_before: "less any recovery already entered"
      store_credit_balance: "a negative difference is recovered from the Return Store Credit issued at the scan up to its current balance, and the part already spent is charged to the original card only on the cardholder's own authorization, in the amount set out below"
      spent_shortfall: "The spent shortfall is the instant credit paid at the first scan, less the credit entries on the return, plus the fees withheld on the return, less any recovery already entered, less the current balance of the Return Store Credit issued for the return, never below zero."
      spend_history: "The spend history weighed for goodwill is measured in a way set by the cardholder's Marlowe Rewards membership in status active: a Platinum, Icon or Atelier membership is measured on its better membership year, the larger of the qualifying spend of its earning postings in the last `spend_year_months` calendar months and in the `spend_year_months` calendar months before them; a Gold membership on its gross spend, the qualifying spend of its earning postings in the last `spend_year_months` calendar months; anyone else on its kept spend, that qualifying spend less the spend reversed by its points reversals posted in the same months."
      spend_factor: "Spend goodwill then scales the spent shortfall: a member whose Marlowe Rewards membership is in status active and whose spend history is at least `top_spend_usd` is charged `top_spend_factor` of it; an active member with at least `mid_spend_usd`, `mid_spend_factor` of it; anyone else the spent shortfall itself; the scaled amount is rounded half up to the cent before the amounts below are taken off."
      tenure_writeoff: "A tenure write-off is then taken off: a Marlowe Rewards Platinum, Icon or Atelier membership in status active enrolled at least `writeoff_tenure_months` calendar months before today has `senior_writeoff_usd` written off; a Marlowe Rewards Gold membership in status active enrolled that long has `gold_writeoff_usd` written off; anyone else has nothing written off."
      wait_credit: "An inspection-wait credit is taken off as well: when the returns centre posted the inspection more than `long_wait_days` calendar days after it received the parcel, `long_wait_credit_usd`; more than `wait_days` calendar days, `wait_credit_usd`; otherwise nothing."
      result: "The amount charged is the scaled spent shortfall less the write-off and the inspection-wait credit, rounded half up to the cent and never below zero."
    factors:
      - id: spend_measure_basis
        effect: method
        decides: spend_history
        bindings: [member_tier, earned_two_years, reversed_year, spend_history]
        ladder:
          - when: "active Platinum, Icon or Atelier membership"
            method: "better membership year: the larger of the qualifying spend earned in the last spend_year_months calendar months and in the spend_year_months calendar months before them"
          - when: "active Gold membership"
            method: "gross spend: the qualifying spend earned in the last spend_year_months calendar months"
          - when: "otherwise"
            method: "kept spend: the qualifying spend earned in the last spend_year_months calendar months less the spend reversed by points reversals in them"
        baseline:
          spend_history: "earned_year - reversed_year"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
      - id: spend_goodwill_share
        effect: parameter
        decides: spend_factor
        bindings: [membership_status, spend_factor]
        ladder:
          - when: "membership in status active AND spend history at least top_spend_usd"
            value: "K('top_spend_factor')"
          - when: "membership in status active AND spend history at least mid_spend_usd"
            value: "K('mid_spend_factor')"
          - when: "otherwise"
            value: "1"
        baseline:
          spend_factor: "1"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
      - id: membership_tenure_writeoff
        effect: parameter
        decides: tenure_writeoff
        bindings: [member_tenure, tenure_writeoff]
        ladder:
          - when: "active Platinum, Icon or Atelier membership AND enrolled at least writeoff_tenure_months months"
            value: "K('senior_writeoff_usd')"
          - when: "active Gold membership AND enrolled at least writeoff_tenure_months months"
            value: "K('gold_writeoff_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          tenure_writeoff: "0"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
      - id: inspection_wait_credit
        effect: parameter
        decides: wait_credit
        bindings: [inspection_wait, wait_credit]
        ladder:
          - when: "inspection posted more than long_wait_days calendar days after receipt"
            value: "K('long_wait_credit_usd')"
          - when: "inspection posted more than wait_days calendar days after receipt"
            value: "K('wait_credit_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          wait_credit: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The spent shortfall is the instant credit paid at the first scan, less the credit entries on the return, plus the fees withheld on the return, less any recovery already entered, less the current balance of the Return Store Credit issued for the return, never below zero.
        The amount charged to the original card is the spent shortfall, rounded half up to the cent.
      params: []
    inputs:
      history:
        - {table: return_settlements, aggregate: sum, field: amount_usd, filters: {event_type: returns_refund_issued}}
        - {table: return_settlements, aggregate: sum, field: amount_usd, filters: {event_type: returns_refund_credited}}
        - {table: return_settlements, aggregate: sum, field: amount_usd, filters: {event_type: returns_fee_assessed}}
        - {category: loyalty, table: loyalty_ledger, aggregate: sum, field: qualifying_spend_usd, within_months: 24, filters: {event_type: loyalty_points_earned}}
        - {category: loyalty, table: loyalty_ledger, aggregate: sum, field: reversed_spend_usd, within_months: 12, filters: {event_type: loyalty_points_reversed}}
      cross_category: [credit, loyalty]
  # ---------------------------------------------------------------------------------------------
  - id: returns_ext_courtesy_extension
    base_policy_refs: [returns_evt_deadline, returns_authorization]
    overwrite:
      - base_policy: returns_evt_deadline
        superseded_clause: >-
          A return-by date is extended by `deadline_extension_days` calendar days at most `deadline_extension_limit` time per return.
        replaced_by: >-
          A return-by date is extended at most once per return, by the courtesy extension worked out below.
      - base_policy: returns_evt_deadline
        superseded_clause: >-
          the extension is added in calendar days to the current return-by date
        replaced_by: >-
          when the current return-by date is earlier than the last day of the return window, the extension is counted from the last day of the return window, so the days from the current return-by date to that day are added as well
    trigger: on_request
    subject: [returns_deadline_extended]
    computes: extension_days
    target_tool: extend_return_deadline_be33eaa2
    params:
      tenure_months: 60
      senior_days: 21
      gold_days: 14
      covered_plan_days: 7
      plan_days: 3
      many_units: 4
      many_units_days: 3
      some_units: 2
      some_units_days: 2
      failure_days: 7
      late_days: 5
    rule: >-
      At the customer's request the returns desk moves the return-by date of an authorization in status authorized,
      on or before that return-by date, by a courtesy extension counted in calendar days.
      A return-by date is extended at most once per return, by the courtesy extension worked out below.
      The courtesy extension is `deadline_extension_days` calendar days added to the current return-by date.
      A return-by date is not moved later until every Store Credit Return of the customer whose spent instant credit exceeds what inspection and fees left owed carries a recovery entry from the original card for that difference.
      The membership days replace `deadline_extension_days` according to the customer's Marlowe Rewards membership in status active: a Platinum, Icon or Atelier membership enrolled at least `tenure_months` calendar months before today gives `senior_days` days; a Gold membership enrolled that long gives `gold_days` days; any other customer gets `deadline_extension_days` days.
      Plan days are added for a Marlowe & Finch Unlimited membership: a plan with `covers_return_label` in status trial or active adds `covered_plan_days` days; any other plan in status trial or active adds `plan_days` days; no plan adds none.
      Packing days are added by the units authorized on the return: `many_units` units or more add `many_units_days` days; `some_units` to one fewer than `many_units` units add `some_units_days` days; a single unit adds none.
      Delivery-failure days are added by the return's order: an order with a Damaged in Transit, Missing Item or Wrong Item Claim in status approved or resolved adds `failure_days` days; an order with a Late Delivery Claim in status approved or resolved adds `late_days` days; any other order adds none.
      The days are counted from a starting date chosen as follows: when the current return-by date is earlier than the last day of the return window, the extension is counted from the last day of the return window, so the days from the current return-by date to that day are added as well; when the return-by date was set by the return window and the order was delivered after its promised delivery date, the days the delivery came late are added as well; otherwise the days count from the current return-by date.
      The last day of the return window is the order's delivered date plus `base_return_window_days`, plus the Marlowe Rewards `return_window_extension_days` of the membership in status active where the return type's `loyalty_window_extension_applies`.
      The courtesy extension entered is the starting-date days plus the membership, plan, packing and delivery-failure days.
    prerequisite:
      - problem: returns_ext_spent_credit_recovery
        kind: state_gate
        gate: return_settlements.recovered_from
        form: state
        policy_source: >-
          A return-by date is not moved later until every Store Credit Return of the customer whose spent instant credit exceeds what inspection and fees left owed carries a recovery entry from the original card for that difference.
        condition: >-
          Every inspected Store Credit Return of the customer whose instant credit exceeds its credit entries less its fees withheld plus its store-credit balance has a returns_instant_credit_reversed settlement entry with recovered_from original_card.
        resolved_by: authorize_spent_credit_charge_4aac9d1c
        effect: >-
          The customer's Store Credit Returns no longer show an unrecovered spent shortfall, so the courtesy extension may be granted.
    cross_category:
      - category: loyalty
        as: branch
        reads: [variant_name, enrolled_date, return_window_extension_days]
        note: Tier and enrolment date decide the membership days; the tier's window extension fixes the last day of the return window.
      - category: pass
        as: branch
        reads: [status, covers_return_label]
        note: The Unlimited plan and its status decide the plan days.
      - category: claims
        as: branch
        reads: [variant_name, status, order_id]
        note: The claim type and status on the return's order decide the delivery-failure days.
      - category: orders
        as: branch
        reads: [delivered_date, promised_delivery_date]
        note: The delivered and promised dates fix the last day of the window and any late delivery days.
    compute:
      - member_tier_e: "CFIELD('loyalty','variant_name', status='active')"
      - member_tenure_e: "MONTHS(CFIELD('loyalty','enrolled_date', status='active'), NOW)"
      - membership_days: "K('senior_days') if ((member_tier_e == 'Marlowe Rewards Platinum' or member_tier_e == 'Marlowe Rewards Icon' or member_tier_e == 'Marlowe Rewards Atelier') and member_tenure_e >= K('tenure_months')) else (K('gold_days') if (member_tier_e == 'Marlowe Rewards Gold' and member_tenure_e >= K('tenure_months')) else P('deadline_extension_days'))"
      - plan_status: "CFIELD('pass','status')"
      - plan_covers: "CPARAM('pass','covers_return_label')"
      - plan_extra_days: "K('covered_plan_days') if (plan_covers == True and (plan_status == 'trial' or plan_status == 'active')) else (K('plan_days') if (plan_status == 'trial' or plan_status == 'active') else 0)"
      - authorized_units: "SUM('return_lines','quantity', event_type='returns_line_authorized')"
      - packing_days: "K('many_units_days') if authorized_units >= K('many_units') else (K('some_units_days') if authorized_units >= K('some_units') else 0)"
      - order_claim_type: "CFIELD('claims','variant_name', order_id=F('order_id'))"
      - order_claim_status: "CFIELD('claims','status', order_id=F('order_id'))"
      - failure_extra_days: "K('failure_days') if ((order_claim_type == 'Damaged in Transit Claim' or order_claim_type == 'Missing Item Claim' or order_claim_type == 'Wrong Item Claim') and (order_claim_status == 'approved' or order_claim_status == 'resolved')) else (K('late_days') if (order_claim_type == 'Late Delivery Claim' and (order_claim_status == 'approved' or order_claim_status == 'resolved')) else 0)"
      - delivered_on: "CFIELD('orders','delivered_date', order_id=F('order_id'))"
      - window_days: "P('base_return_window_days') + (CPARAM('loyalty','return_window_extension_days', status='active') if P('loyalty_window_extension_applies') == True else 0)"
      - days_to_return_by: "DAYS(delivered_on, F('return_by_date'))"
      - delivery_days_late: "DAYS(CFIELD('orders','promised_delivery_date', order_id=F('order_id')), delivered_on)"
      - start_offset_days: "window_days - days_to_return_by if days_to_return_by < window_days else (delivery_days_late if (days_to_return_by == window_days and delivery_days_late > 0) else 0)"
      - result: "start_offset_days + membership_days + plan_extra_days + packing_days + failure_extra_days"
    compute_basis:
      membership_days: "The membership days replace `deadline_extension_days` according to the customer's Marlowe Rewards membership in status active: a Platinum, Icon or Atelier membership enrolled at least `tenure_months` calendar months before today gives `senior_days` days; a Gold membership enrolled that long gives `gold_days` days; any other customer gets `deadline_extension_days` days."
      plan_extra_days: "Plan days are added for a Marlowe & Finch Unlimited membership: a plan with `covers_return_label` in status trial or active adds `covered_plan_days` days; any other plan in status trial or active adds `plan_days` days; no plan adds none."
      authorized_units: "Packing days are added by the units authorized on the return"
      packing_days: "Packing days are added by the units authorized on the return: `many_units` units or more add `many_units_days` days; `some_units` to one fewer than `many_units` units add `some_units_days` days; a single unit adds none."
      failure_extra_days: "Delivery-failure days are added by the return's order: an order with a Damaged in Transit, Missing Item or Wrong Item Claim in status approved or resolved adds `failure_days` days; an order with a Late Delivery Claim in status approved or resolved adds `late_days` days; any other order adds none."
      window_days: "The last day of the return window is the order's delivered date plus `base_return_window_days`, plus the Marlowe Rewards `return_window_extension_days` of the membership in status active where the return type's `loyalty_window_extension_applies`."
      start_offset_days: "The days are counted from a starting date chosen as follows: when the current return-by date is earlier than the last day of the return window, the extension is counted from the last day of the return window, so the days from the current return-by date to that day are added as well; when the return-by date was set by the return window and the order was delivered after its promised delivery date, the days the delivery came late are added as well; otherwise the days count from the current return-by date."
      result: "The courtesy extension entered is the starting-date days plus the membership, plan, packing and delivery-failure days."
    factors:
      - id: membership_tenure_days
        effect: parameter
        decides: membership_days
        bindings: [member_tier_e, member_tenure_e, membership_days]
        ladder:
          - when: "active Platinum, Icon or Atelier membership AND enrolled at least tenure_months months"
            value: "K('senior_days')"
          - when: "active Gold membership AND enrolled at least tenure_months months"
            value: "K('gold_days')"
          - when: "otherwise"
            value: "P('deadline_extension_days')"
        baseline:
          membership_days: "P('deadline_extension_days')"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
      - id: unlimited_plan_days
        effect: parameter
        decides: plan_extra_days
        bindings: [plan_status, plan_covers, plan_extra_days]
        ladder:
          - when: "Unlimited plan with covers_return_label AND status trial or active"
            value: "K('covered_plan_days')"
          - when: "any other Unlimited plan in status trial or active"
            value: "K('plan_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          plan_extra_days: "0"
        evidence: [cross_category]
        cross_difficulty: null
      - id: packing_units_days
        effect: parameter
        decides: packing_days
        bindings: [authorized_units, packing_days]
        ladder:
          - when: "many_units or more units authorized"
            value: "K('many_units_days')"
          - when: "some_units to many_units minus one units authorized"
            value: "K('some_units_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          packing_days: "0"
        evidence: [history]
        cross_difficulty: null
      - id: delivery_failure_days
        effect: parameter
        decides: failure_extra_days
        bindings: [order_claim_type, order_claim_status, failure_extra_days]
        ladder:
          - when: "Damaged in Transit, Missing Item or Wrong Item Claim on the order AND approved or resolved"
            value: "K('failure_days')"
          - when: "Late Delivery Claim on the order AND approved or resolved"
            value: "K('late_days')"
          - when: "otherwise"
            value: "0"
        baseline:
          failure_extra_days: "0"
        evidence: [cross_category]
        cross_difficulty: claims
      - id: extension_start_date
        effect: method
        decides: start_offset_days
        bindings: [delivered_on, window_days, days_to_return_by, delivery_days_late, start_offset_days]
        ladder:
          - when: "current return-by date earlier than the last day of the return window"
            method: "counted from the last day of the return window"
          - when: "return-by date set by the window AND the order delivered after its promised delivery date"
            method: "counted from the current return-by date plus the days the delivery came late"
          - when: "otherwise"
            method: "counted from the current return-by date"
        baseline:
          start_offset_days: "0"
        evidence: [date, cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        The courtesy extension is `deadline_extension_days` calendar days added to the current return-by date.
      params: [deadline_extension_days]
    inputs:
      history:
        - {table: return_lines, aggregate: sum, field: quantity, filters: {event_type: returns_line_authorized}}
      cross_category: [loyalty, pass, claims, orders]
  # ---------------------------------------------------------------------------------------------
  - id: returns_ext_shoebox_fee
    base_policy_refs: [returns_evt_method_fee, returns_evt_inspection_restocking]
    overwrite:
      - base_policy: returns_evt_inspection_restocking
        superseded_clause: >-
          A footwear unit whose box_condition is no_original_box or original_box_damaged_or_used_as_shipper carries `missing_box_fee_usd` per unit
        replaced_by: >-
          The shoebox fee per unit is the box amount times the member share, the price-class multiplier and the return-frequency multiplier, multiplied in that order and rounded half up to the cent once at the end.
    trigger: state_due
    subject: [returns_fee_assessed]
    computes: fee_amount_usd
    target_tool: assess_box_fee_f48699d7
    params:
      damaged_box_fee: 5.00
      low_price_usd: 75
      low_price_box_fee: 6.00
      relief_spend_usd: 1000
      relief_share: 0.6
      premium_price_usd: 150
      premium_multiplier: 1.5
      markdown_multiplier: 0.5
      rate_months: 12
      frequent_return_rate: 0.5
      frequent_multiplier: 2
      regular_return_rate: 0.2
      regular_multiplier: 1.5
    rule: >-
      Once a return is in status inspected, the returns desk withholds one shoebox fee for each footwear line whose
      units came back without their original box, in a damaged box or in a box used as the shipping carton; a Standard
      Return, a Store Credit Return and a Gift Return carry it, an exchange or a Quality Issue Return never does.
      The shoebox fee per unit is `missing_box_fee_usd`.
      The shoebox fee withheld is the shoebox fee per unit times the line's units inspected with that box condition, rounded half up to the cent.
      The box amount follows the box condition recorded at inspection: a box returned damaged or used as the shipping carton draws `damaged_box_fee`; a missing box on a pair booked below `low_price_usd` draws `low_price_box_fee`; any other missing box draws `missing_box_fee_usd`.
      The member share follows the returning customer's Marlowe Rewards membership in status active and is never read on a Gift Return: a tier carrying `restocking_fee_waiver`, held since on or before the return's authorization date, pays no shoebox fee; a member whose earning postings in the last 12 calendar months show qualifying spend of at least `relief_spend_usd` pays `relief_share` of it; anyone else pays it in full.
      The price-class multiplier follows how the pair was sold: a pair booked at a unit price of `premium_price_usd` or more is multiplied by `premium_multiplier`; a pair sold at a clearance or flash-sale price below that by `markdown_multiplier`; any other pair is not multiplied.
      The return rate weighed for the return frequency is measured over the last `rate_months` calendar months in a way set by the customer's Marlowe Rewards membership in status active: a Platinum, Icon or Atelier membership by points, the points taken back by its points reversals over the points its earning and bonus postings gave; a Silver or Gold membership by value, the spend reversed by its points reversals over the qualifying spend of its earning postings; anyone else by count, the points reversals posted over the orders placed; a measure with nothing to divide by is a rate of zero.
      The return-frequency multiplier follows that return rate on a membership in status active: a rate of `frequent_return_rate` or more multiplies by `frequent_multiplier`; a rate of `regular_return_rate` or more, but below `frequent_return_rate`, by `regular_multiplier`; a lower rate, or no active membership, is not multiplied.
      The shoebox fee per unit is the box amount times the member share, the price-class multiplier and the return-frequency multiplier, multiplied in that order and rounded half up to the cent once at the end.
      It is never larger than the pair's net unit price paid (its booked unit price less its checkout promotion discount, late promotion credit and price adjustment per unit booked), and it is then multiplied by the units inspected with that box condition and rounded half up to the cent.
    prerequisite: []
    cross_category:
      - category: orders
        as: branch
        reads: [placed_date, order_lines.unit_price_usd, order_lines.price_type, order_lines.quantity, order_lines.line_discount_usd, order_lines.amount_usd]
        note: The pair's booked price, price type and reductions decide the price-class multiplier and the per-unit ceiling; the orders placed in the rate months are the count basis of the return rate.
      - category: loyalty
        as: history
        reads: [variant_name, status, tier_start_date, restocking_fee_waiver, loyalty_ledger.qualifying_spend_usd, loyalty_ledger.reversed_spend_usd, loyalty_ledger.points, loyalty_ledger.event_type, loyalty_ledger.posting_date]
        note: The tier and its start date and the 12-month qualifying spend decide the member share; the tier decides how the return rate is measured (points, value or count) and the ledger's postings decide the rate and the frequency multiplier.
    compute:
      - box_line: "LATEST('return_lines','booked_line_id', date_field='event_date', event_type='returns_line_inspected', box_condition='original_box_damaged_or_used_as_shipper')"
      - box_line_missing: "LATEST('return_lines','booked_line_id', date_field='event_date', event_type='returns_line_inspected', box_condition='no_original_box')"
      - fee_line: "box_line if box_line else box_line_missing"
      - damaged_units: "SUM('return_lines','quantity', event_type='returns_line_inspected', booked_line_id=fee_line, box_condition='original_box_damaged_or_used_as_shipper')"
      - missing_units: "SUM('return_lines','quantity', event_type='returns_line_inspected', booked_line_id=fee_line, box_condition='no_original_box')"
      - pair_price: "XLATEST('orders','order_lines','unit_price_usd', order_line_id=fee_line)"
      - box_amount: "K('damaged_box_fee') if damaged_units > 0 else (K('low_price_box_fee') if (missing_units > 0 and pair_price < K('low_price_usd')) else P('missing_box_fee_usd'))"
      - box_tier_waiver: "CPARAM('loyalty','restocking_fee_waiver', status='active')"
      - box_tier_held_days: "DAYS(CFIELD('loyalty','tier_start_date', status='active'), F('opened_date'))"
      - box_spend_12m: "XSUM('loyalty','loyalty_ledger','qualifying_spend_usd', within_months=12, date_field='posting_date', event_type='loyalty_points_earned')"
      - member_share: "0 if (box_tier_waiver == True and box_tier_held_days >= 0 and F('variant_name') != 'Gift Return') else (K('relief_share') if (box_spend_12m >= K('relief_spend_usd') and F('variant_name') != 'Gift Return') else 1)"
      - pair_price_type: "XLATEST('orders','order_lines','price_type', order_line_id=fee_line)"
      - price_class_multiplier: "K('premium_multiplier') if pair_price >= K('premium_price_usd') else (K('markdown_multiplier') if (pair_price_type == 'clearance' or pair_price_type == 'flash_sale') else 1)"
      - box_member_tier: "CFIELD('loyalty','variant_name', status='active')"
      - rate_reversed_points: "-XSUM('loyalty','loyalty_ledger','points', within_months=K('rate_months'), date_field='posting_date', event_type='loyalty_points_reversed')"
      - rate_posted_points: "XSUM('loyalty','loyalty_ledger','points', within_months=K('rate_months'), date_field='posting_date', event_type='loyalty_points_earned') + XSUM('loyalty','loyalty_ledger','points', within_months=K('rate_months'), date_field='posting_date', event_type='loyalty_bonus_posted')"
      - rate_reversed_spend: "XSUM('loyalty','loyalty_ledger','reversed_spend_usd', within_months=K('rate_months'), date_field='posting_date', event_type='loyalty_points_reversed')"
      - rate_earned_spend: "XSUM('loyalty','loyalty_ledger','qualifying_spend_usd', within_months=K('rate_months'), date_field='posting_date', event_type='loyalty_points_earned')"
      - rate_reversals: "XCOUNT('loyalty','loyalty_ledger', within_months=K('rate_months'), date_field='posting_date', event_type='loyalty_points_reversed')"
      - rate_orders: "XCOUNT('orders','orders', within_months=K('rate_months'), date_field='placed_date')"
      - return_rate: "(rate_reversed_points / rate_posted_points if rate_posted_points > 0 else 0) if (box_member_tier == 'Marlowe Rewards Platinum' or box_member_tier == 'Marlowe Rewards Icon' or box_member_tier == 'Marlowe Rewards Atelier') else ((rate_reversed_spend / rate_earned_spend if rate_earned_spend > 0 else 0) if (box_member_tier == 'Marlowe Rewards Silver' or box_member_tier == 'Marlowe Rewards Gold') else (rate_reversals / rate_orders if rate_orders > 0 else 0))"
      - box_membership_status: "CFIELD('loyalty','status')"
      - box_frequency_multiplier: "K('frequent_multiplier') if (box_membership_status == 'active' and return_rate >= K('frequent_return_rate')) else (K('regular_multiplier') if (box_membership_status == 'active' and return_rate >= K('regular_return_rate')) else 1)"
      - pair_net_price: "pair_price - (XLATEST('orders','order_lines','line_discount_usd', order_line_id=fee_line) - XSUM('orders','order_lines','amount_usd', booked_line_id=fee_line, event_type='orders_post_purchase_promo') - XSUM('orders','order_lines','amount_usd', booked_line_id=fee_line, event_type='orders_price_adjusted')) / XLATEST('orders','order_lines','quantity', order_line_id=fee_line)"
      - box_unit_fee: "RND(box_amount * member_share * price_class_multiplier * box_frequency_multiplier, 2)"
      - result: "RND(MN(box_unit_fee, pair_net_price) * (damaged_units + missing_units), 2)"
    compute_basis:
      box_line: "one shoebox fee for each footwear line whose units came back without their original box, in a damaged box or in a box used as the shipping carton"
      box_line_missing: "one shoebox fee for each footwear line whose units came back without their original box, in a damaged box or in a box used as the shipping carton"
      damaged_units: "The shoebox fee withheld is the shoebox fee per unit times the line's units inspected with that box condition, rounded half up to the cent."
      missing_units: "The shoebox fee withheld is the shoebox fee per unit times the line's units inspected with that box condition, rounded half up to the cent."
      box_amount: "The box amount follows the box condition recorded at inspection: a box returned damaged or used as the shipping carton draws `damaged_box_fee`; a missing box on a pair booked below `low_price_usd` draws `low_price_box_fee`; any other missing box draws `missing_box_fee_usd`."
      member_share: "The member share follows the returning customer's Marlowe Rewards membership in status active and is never read on a Gift Return: a tier carrying `restocking_fee_waiver`, held since on or before the return's authorization date, pays no shoebox fee; a member whose earning postings in the last 12 calendar months show qualifying spend of at least `relief_spend_usd` pays `relief_share` of it; anyone else pays it in full."
      price_class_multiplier: "The price-class multiplier follows how the pair was sold: a pair booked at a unit price of `premium_price_usd` or more is multiplied by `premium_multiplier`; a pair sold at a clearance or flash-sale price below that by `markdown_multiplier`; any other pair is not multiplied."
      return_rate: "The return rate weighed for the return frequency is measured over the last `rate_months` calendar months in a way set by the customer's Marlowe Rewards membership in status active: a Platinum, Icon or Atelier membership by points, the points taken back by its points reversals over the points its earning and bonus postings gave; a Silver or Gold membership by value, the spend reversed by its points reversals over the qualifying spend of its earning postings; anyone else by count, the points reversals posted over the orders placed; a measure with nothing to divide by is a rate of zero."
      box_frequency_multiplier: "The return-frequency multiplier follows that return rate on a membership in status active: a rate of `frequent_return_rate` or more multiplies by `frequent_multiplier`; a rate of `regular_return_rate` or more, but below `frequent_return_rate`, by `regular_multiplier`; a lower rate, or no active membership, is not multiplied."
      pair_net_price: "It is never larger than the pair's net unit price paid (its booked unit price less its checkout promotion discount, late promotion credit and price adjustment per unit booked), and it is then multiplied by the units inspected with that box condition and rounded half up to the cent."
      box_unit_fee: "The shoebox fee per unit is the box amount times the member share, the price-class multiplier and the return-frequency multiplier, multiplied in that order and rounded half up to the cent once at the end."
      result: "It is never larger than the pair's net unit price paid (its booked unit price less its checkout promotion discount, late promotion credit and price adjustment per unit booked), and it is then multiplied by the units inspected with that box condition and rounded half up to the cent."
    factors:
      - id: box_condition_amount
        effect: parameter
        decides: box_amount
        bindings: [box_line, box_line_missing, fee_line, damaged_units, missing_units, pair_price, box_amount]
        ladder:
          - when: "box returned damaged or used as the shipping carton"
            value: "K('damaged_box_fee')"
          - when: "box missing AND the pair was booked below low_price_usd"
            value: "K('low_price_box_fee')"
          - when: "otherwise"
            value: "P('missing_box_fee_usd')"
        baseline:
          box_amount: "P('missing_box_fee_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: member_spend_share
        effect: parameter
        decides: member_share
        bindings: [box_tier_waiver, box_tier_held_days, box_spend_12m, member_share]
        ladder:
          - when: "active tier carrying restocking_fee_waiver held since on or before the authorization date AND not a Gift Return"
            value: "0"
          - when: "12-month qualifying spend at least relief_spend_usd AND not a Gift Return"
            value: "K('relief_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          member_share: "1"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
      - id: pair_price_class
        effect: parameter
        decides: price_class_multiplier
        bindings: [pair_price_type, price_class_multiplier]
        ladder:
          - when: "pair booked at premium_price_usd or more"
            value: "K('premium_multiplier')"
          - when: "pair sold at a clearance or flash-sale price"
            value: "K('markdown_multiplier')"
          - when: "otherwise"
            value: "1"
        baseline:
          price_class_multiplier: "1"
        evidence: [history]
        cross_difficulty: null
      - id: return_rate_measure
        effect: method
        decides: return_rate
        bindings: [box_member_tier, rate_reversed_points, rate_posted_points, rate_reversed_spend, rate_earned_spend, return_rate]
        ladder:
          - when: "active Platinum, Icon or Atelier membership"
            method: "by points: points taken back by reversals over points given by earning and bonus postings in the rate months"
          - when: "active Silver or Gold membership"
            method: "by value: spend reversed by reversals over qualifying spend of earning postings in the rate months"
          - when: "otherwise"
            method: "by count: points reversals posted over orders placed in the rate months"
        baseline:
          return_rate: "rate_reversals / rate_orders if rate_orders > 0 else 0"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
      - id: box_return_frequency
        effect: parameter
        decides: box_frequency_multiplier
        bindings: [box_membership_status, box_frequency_multiplier]
        ladder:
          - when: "active membership AND a return rate of frequent_return_rate or more"
            value: "K('frequent_multiplier')"
          - when: "active membership AND a return rate of regular_return_rate or more, below frequent_return_rate"
            value: "K('regular_multiplier')"
          - when: "otherwise"
            value: "1"
        baseline:
          box_frequency_multiplier: "1"
        evidence: [cross_category, history]
        cross_difficulty: loyalty
    baseline:
      rule: >-
        The shoebox fee per unit is `missing_box_fee_usd`.
        The shoebox fee withheld is the shoebox fee per unit times the line's units inspected with that box condition, rounded half up to the cent.
      params: [missing_box_fee_usd]
    inputs:
      history:
        - {table: return_lines, aggregate: sum, field: quantity, filters: {event_type: returns_line_inspected}}
        - {category: loyalty, table: loyalty_ledger, aggregate: count, field: points, within_months: 12, filters: {event_type: loyalty_points_reversed}}
        - {category: loyalty, table: loyalty_ledger, aggregate: sum, field: reversed_spend_usd, within_months: 12, filters: {event_type: loyalty_points_reversed}}
      cross_category: [orders, loyalty]
  # ---------------------------------------------------------------------------------------------
  - id: returns_ext_return_shipping_fee
    base_policy_refs: [returns_evt_method_fee, returns_evt_inspection_restocking]
    overwrite:
      - base_policy: returns_evt_method_fee
        superseded_clause: >-
          Where `return_method_fee_applies`, the fee of the chosen return method in the method fee register is withheld once per return at settlement (fee_type method_fee), whatever the number of units.
        replaced_by: >-
          The return shipping fee withheld is the label fee times the number of labels, the member share, the plan share and the accepted share, multiplied in that order and rounded half up to the cent, less the quick-return reduction and the delivery-failure reduction, never below zero.
      - base_policy: returns_evt_method_fee
        superseded_clause: >-
          waivers do not add up, one is enough
        replaced_by: >-
          a full waiver in either share makes the fee zero, and partial shares are multiplied together
    trigger: state_due
    subject: [returns_fee_assessed]
    computes: fee_amount_usd
    target_tool: withhold_return_shipping_fee_e68e1eec
    params:
      mail_label_fee: 6.95
      drop_off_qr_fee: 4.95
      pickup_fee: 9.95
      silver_tenure_months: 60
      silver_share: 0.75
      other_plan_share: 0.8
      quick_days: 5
      quick_reduction: 2.00
      prompt_days: 10
      prompt_reduction: 1.00
      failure_reduction: 1.50
      late_reduction: 1.00
    rule: >-
      Once a return of a type with `return_method_fee_applies` is in status inspected, the returns desk withholds one
      return shipping fee on it, not tied to any line, for the method its parcel travelled by.
      The label fee is the method fee register's fee for the return method of the parcel: `mail_label_fee` for a mail label, `drop_off_qr_fee` for a carrier drop-off QR code and `pickup_fee` for a scheduled pickup, charged for one label per return.
      The return shipping fee withheld is the label fee, rounded half up to the cent.
      The fee is never withheld when every unit of the return is rejected, since nothing is refunded to withhold it from, and a full waiver in either share makes the fee zero, and partial shares are multiplied together.
      The number of labels follows what travelled: a return whose inspection entries show footwear in a shoebox together with other units is charged the label fee once per parcel, two parcels, because shoeboxes travel in their own carton; a return of more than four units with no footwear is charged once for every four units begun; any other return is charged once.
      The member share follows the returning customer's Marlowe Rewards membership in status active: a tier carrying `free_return_label`, held since on or before the return's authorization date, pays nothing; a Marlowe Rewards Silver membership enrolled at least `silver_tenure_months` calendar months before today pays `silver_share`; anyone else pays in full.
      The plan share follows the customer's Marlowe & Finch Unlimited membership: a plan with `covers_return_label` in status trial or active pays nothing; any other plan in status trial or active pays `other_plan_share`; no plan pays in full.
      The accepted share follows the inspection outcomes: a return whose every unit was rejected pays nothing; a return with some units rejected pays the units accepted over the units inspected; any other return pays in full.
      The quick-return reduction follows the days from the order's delivered date to the parcel's first carrier scan: `quick_days` days or fewer take off `quick_reduction`; up to `prompt_days` days take off `prompt_reduction`; later scans take off nothing.
      The delivery-failure reduction follows the return's order: a Damaged in Transit, Missing Item or Wrong Item Claim in status approved or resolved takes off `failure_reduction`; a Late Delivery Claim in status approved or resolved takes off `late_reduction`; any other order takes off nothing.
      The return shipping fee withheld is the label fee times the number of labels, the member share, the plan share and the accepted share, multiplied in that order and rounded half up to the cent, less the quick-return reduction and the delivery-failure reduction, never below zero.
    prerequisite: []
    cross_category:
      - category: orders
        as: branch
        reads: [delivered_date]
        note: The order's delivered date starts the quick-return count.
      - category: loyalty
        as: branch
        reads: [variant_name, enrolled_date, free_return_label]
        note: Tier, label waiver and enrolment date decide the member share.
      - category: pass
        as: branch
        reads: [status, covers_return_label]
        note: The Unlimited plan and its status decide the plan share.
      - category: claims
        as: branch
        reads: [variant_name, status, order_id]
        note: The claim type and status on the return's order decide the delivery-failure reduction.
    compute:
      - fee_applies: "P('return_method_fee_applies')"
      - label_fee: "K('pickup_fee') if F('return_method') == 'scheduled_pickup' else (K('drop_off_qr_fee') if F('return_method') == 'carrier_drop_off_qr' else K('mail_label_fee'))"
      - shoebox_entries: "COUNT('return_lines', event_type='returns_line_inspected', box_condition='original_box_intact') + COUNT('return_lines', event_type='returns_line_inspected', box_condition='original_box_damaged_or_used_as_shipper') + COUNT('return_lines', event_type='returns_line_inspected', box_condition='no_original_box')"
      - other_entries: "COUNT('return_lines', event_type='returns_line_inspected', box_condition='not_applicable')"
      - units_inspected: "SUM('return_lines','quantity', event_type='returns_line_inspected')"
      - label_count: "2 if (shoebox_entries > 0 and other_entries > 0) else (int((units_inspected + 3) / 4) if (shoebox_entries == 0 and units_inspected > 4) else 1)"
      - label_tier: "CFIELD('loyalty','variant_name', status='active')"
      - label_waiver: "CPARAM('loyalty','free_return_label', status='active')"
      - label_tenure: "MONTHS(CFIELD('loyalty','enrolled_date', status='active'), NOW)"
      - member_label_share: "0 if (label_waiver == True and DAYS(CFIELD('loyalty','tier_start_date', status='active'), F('opened_date')) >= 0) else (K('silver_share') if (label_tier == 'Marlowe Rewards Silver' and label_tenure >= K('silver_tenure_months')) else 1)"
      - pass_status: "CFIELD('pass','status')"
      - pass_covers: "CPARAM('pass','covers_return_label')"
      - plan_label_share: "0 if (pass_covers == True and (pass_status == 'trial' or pass_status == 'active')) else (K('other_plan_share') if (pass_status == 'trial' or pass_status == 'active') else 1)"
      - units_accepted: "SUM('return_lines','quantity', event_type='returns_line_inspected', inspection_outcome='accepted') + SUM('return_lines','quantity', event_type='returns_line_inspected', inspection_outcome='accepted_with_fee')"
      - accepted_share: "0 if units_accepted == 0 else (units_accepted / units_inspected if units_accepted < units_inspected else 1)"
      - scan_gap_days: "DAYS(CFIELD('orders','delivered_date', order_id=F('order_id')), F('first_scan_date'))"
      - quick_reduction_usd: "K('quick_reduction') if scan_gap_days <= K('quick_days') else (K('prompt_reduction') if scan_gap_days <= K('prompt_days') else 0)"
      - fee_claim_type: "CFIELD('claims','variant_name', order_id=F('order_id'))"
      - fee_claim_status: "CFIELD('claims','status', order_id=F('order_id'))"
      - failure_reduction_usd: "K('failure_reduction') if ((fee_claim_type == 'Damaged in Transit Claim' or fee_claim_type == 'Missing Item Claim' or fee_claim_type == 'Wrong Item Claim') and (fee_claim_status == 'approved' or fee_claim_status == 'resolved')) else (K('late_reduction') if (fee_claim_type == 'Late Delivery Claim' and (fee_claim_status == 'approved' or fee_claim_status == 'resolved')) else 0)"
      - result: "0 if fee_applies != True else MX(0, RND(RND(label_fee * label_count * member_label_share * plan_label_share * accepted_share, 2) - quick_reduction_usd - failure_reduction_usd, 2))"
    compute_basis:
      fee_applies: "Once a return of a type with `return_method_fee_applies` is in status inspected, the returns desk withholds one return shipping fee on it, not tied to any line, for the method its parcel travelled by."
      label_fee: "The label fee is the method fee register's fee for the return method of the parcel: `mail_label_fee` for a mail label, `drop_off_qr_fee` for a carrier drop-off QR code and `pickup_fee` for a scheduled pickup, charged for one label per return."
      shoebox_entries: "a return whose inspection entries show footwear in a shoebox together with other units is charged the label fee once per parcel, two parcels, because shoeboxes travel in their own carton"
      label_count: "The number of labels follows what travelled: a return whose inspection entries show footwear in a shoebox together with other units is charged the label fee once per parcel, two parcels, because shoeboxes travel in their own carton; a return of more than four units with no footwear is charged once for every four units begun; any other return is charged once."
      member_label_share: "The member share follows the returning customer's Marlowe Rewards membership in status active: a tier carrying `free_return_label`, held since on or before the return's authorization date, pays nothing; a Marlowe Rewards Silver membership enrolled at least `silver_tenure_months` calendar months before today pays `silver_share`; anyone else pays in full."
      plan_label_share: "The plan share follows the customer's Marlowe & Finch Unlimited membership: a plan with `covers_return_label` in status trial or active pays nothing; any other plan in status trial or active pays `other_plan_share`; no plan pays in full."
      accepted_share: "The accepted share follows the inspection outcomes: a return whose every unit was rejected pays nothing; a return with some units rejected pays the units accepted over the units inspected; any other return pays in full."
      quick_reduction_usd: "The quick-return reduction follows the days from the order's delivered date to the parcel's first carrier scan: `quick_days` days or fewer take off `quick_reduction`; up to `prompt_days` days take off `prompt_reduction`; later scans take off nothing."
      failure_reduction_usd: "The delivery-failure reduction follows the return's order: a Damaged in Transit, Missing Item or Wrong Item Claim in status approved or resolved takes off `failure_reduction`; a Late Delivery Claim in status approved or resolved takes off `late_reduction`; any other order takes off nothing."
      result: "The return shipping fee withheld is the label fee times the number of labels, the member share, the plan share and the accepted share, multiplied in that order and rounded half up to the cent, less the quick-return reduction and the delivery-failure reduction, never below zero."
    factors:
      - id: parcel_label_count
        effect: method
        decides: label_count
        bindings: [shoebox_entries, other_entries, units_inspected, label_count]
        ladder:
          - when: "inspection entries show footwear in a shoebox together with other units"
            method: "the label fee is charged once per parcel, two parcels"
          - when: "more than four units and no footwear"
            method: "the label fee is charged once for every four units begun"
          - when: "otherwise"
            method: "the label fee is charged once per return"
        baseline:
          label_count: "1"
        evidence: [history]
        cross_difficulty: null
      - id: member_label_share
        effect: parameter
        decides: member_label_share
        bindings: [label_tier, label_waiver, label_tenure, member_label_share]
        ladder:
          - when: "active tier carrying free_return_label AND held since on or before the authorization date"
            value: "0"
          - when: "active Marlowe Rewards Silver AND enrolled at least silver_tenure_months months"
            value: "K('silver_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          member_label_share: "1"
        evidence: [cross_category, date]
        cross_difficulty: loyalty
      - id: unlimited_plan_label_share
        effect: parameter
        decides: plan_label_share
        bindings: [pass_status, pass_covers, plan_label_share]
        ladder:
          - when: "plan with covers_return_label AND status trial or active"
            value: "0"
          - when: "any other plan in status trial or active"
            value: "K('other_plan_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          plan_label_share: "1"
        evidence: [cross_category]
        cross_difficulty: null
      - id: accepted_units_share
        effect: method
        decides: accepted_share
        bindings: [units_accepted, accepted_share]
        ladder:
          - when: "every unit of the return rejected"
            method: "nothing is withheld"
          - when: "some units rejected"
            method: "the fee is scaled by units accepted over units inspected"
          - when: "otherwise"
            method: "the fee is withheld in full"
        baseline:
          accepted_share: "1"
        evidence: [history]
        cross_difficulty: null
      - id: quick_return_reduction
        effect: parameter
        decides: quick_reduction_usd
        bindings: [scan_gap_days, quick_reduction_usd]
        ladder:
          - when: "first carrier scan quick_days days or fewer after delivery"
            value: "K('quick_reduction')"
          - when: "first carrier scan up to prompt_days days after delivery"
            value: "K('prompt_reduction')"
          - when: "otherwise"
            value: "0"
        baseline:
          quick_reduction_usd: "0"
        evidence: [date]
        cross_difficulty: null
      - id: delivery_failure_reduction
        effect: parameter
        decides: failure_reduction_usd
        bindings: [fee_claim_type, fee_claim_status, failure_reduction_usd]
        ladder:
          - when: "Damaged in Transit, Missing Item or Wrong Item Claim on the order AND approved or resolved"
            value: "K('failure_reduction')"
          - when: "Late Delivery Claim on the order AND approved or resolved"
            value: "K('late_reduction')"
          - when: "otherwise"
            value: "0"
        baseline:
          failure_reduction_usd: "0"
        evidence: [cross_category]
        cross_difficulty: claims
    baseline:
      rule: >-
        The label fee is the method fee register's fee for the return method of the parcel: `mail_label_fee` for a mail label, `drop_off_qr_fee` for a carrier drop-off QR code and `pickup_fee` for a scheduled pickup, charged for one label per return.
        The return shipping fee withheld is the label fee, rounded half up to the cent.
      params: [mail_label_fee, drop_off_qr_fee, pickup_fee]
    inputs:
      history:
        - {table: return_lines, aggregate: sum, field: quantity, filters: {event_type: returns_line_inspected}}
      cross_category: [orders, loyalty, pass, claims]
  # ---------------------------------------------------------------------------------------------
  - id: returns_ext_final_card_refund
    base_policy_refs: [returns_evt_refund_settlement, returns_evt_gift_return]
    overwrite:
      - base_policy: returns_evt_refund_settlement
        superseded_clause: >-
          The amount paid is returns_msr_refund_due after fees.
        replaced_by: >-
          The amount paid to the card is what is owed on the return after fees plus the original shipping refund and its tax worked out below, rounded half up to the cent, and never more than what remains refundable on that card (captured on it for the order less the refunds already made to it for the order and on this return); any remainder follows the orders charter's refund priority to the order's other tenders and is not paid by this action.
      - base_policy: returns_evt_refund_settlement
        superseded_clause: >-
          the original shipping fee and surcharge are added only where `refund_includes_original_shipping`
        replaced_by: >-
          The share of the original shipping refunded follows the reasons on the return's authorization entries
    trigger: state_due
    subject: [returns_refund_issued]
    computes: refund_amount_usd
    target_tool: pay_final_card_refund_b5173030
    params:
      fault_share_full: 1
      fault_share_partial: 0.5
      half_up_nudge: 0.000001
      expedited_list_fee: 14.95
      standard_list_fee: 7.95
    rule: >-
      Once a return refunded to the original tenders is in status inspected and its order was paid by card or wallet, the
      returns desk pays its final-settlement refund to that card or wallet, one payment for the stage and tender.
      The amount paid to the card is the credit entries on the return less its fee entries and any refund already paid on it, rounded half up to the cent.
      The final card refund on a return whose type carries a return shipping fee is fixed only after the return carries the return shipping fee entry for the method its parcel travelled by.
      That refund is not paid until every footwear line whose shoebox came back missing, damaged or used as the shipping carton, on a return whose type carries shoebox fees, carries its shoebox fee entry.
      The amount paid to the card is what is owed on the return after fees plus the original shipping refund and its tax worked out below, rounded half up to the cent, and never more than what remains refundable on that card (captured on it for the order less the refunds already made to it for the order and on this return); any remainder follows the orders charter's refund priority to the order's other tenders and is not paid by this action.
      The share of the original shipping refunded follows the reasons on the return's authorization entries: a line returned as defective or as arrived_too_late gives `fault_share_full`; otherwise a line returned as not_as_pictured gives `fault_share_partial`; any other return gives nothing.
      The shipping basis follows what the return takes back: an order charged no shipping fee has nothing to refund; when the merchandise credited on the return is less than the order's net merchandise at placement, the basis is that credited merchandise over the order's net merchandise at placement; otherwise the whole fee.
      The fee refunded follows the service the order shipped by: Next Business Day or Same-Day Courier is refunded at most the Expedited 2-Day list fee `expedited_list_fee`; Expedited 2-Day at most the Standard Ground list fee `standard_list_fee`; any other service the fee charged.
      The original shipping refund is the fee refunded times the shipping basis times the share, rounded half up to the cent.
      Its tax follows the ship-to state: Pennsylvania, New Jersey and Minnesota tax delivery charges in proportion to taxable goods, so an order carrying accessories adds the shipping refund times the accessories' share of the order's net merchandise times the order's tax rate (its sales tax over the accessories plus the shipping fee's taxable share); New York and Texas tax the whole delivery charge, so the shipping refund times the sales tax over the net merchandise plus the shipping fee is added; any other state adds no tax; the tax is rounded half up to the cent.
    prerequisite:
      - problem: returns_ext_return_shipping_fee
        kind: value_input
        gate: fees_on_return
        form: state
        policy_source: >-
          The final card refund on a return whose type carries a return shipping fee is fixed only after the return carries the return shipping fee entry for the method its parcel travelled by.
        condition: >-
          On a return whose type has return_method_fee_applies, the return carries a returns_fee_assessed settlement entry of fee type method_fee.
        resolved_by: withhold_return_shipping_fee_e68e1eec
        effect: >-
          The fee entries on the return rise by the return shipping fee, lowering what is owed and so the card refund.
      - problem: returns_ext_shoebox_fee
        kind: value_input
        gate: fees_on_return
        form: state
        policy_source: >-
          That refund is not paid until every footwear line whose shoebox came back missing, damaged or used as the shipping carton, on a return whose type carries shoebox fees, carries its shoebox fee entry.
        condition: >-
          On a return whose type carries shoebox fees, every footwear line inspected with box condition no_original_box or original_box_damaged_or_used_as_shipper has a returns_fee_assessed entry of fee type missing_box_fee.
        resolved_by: assess_box_fee_f48699d7
        effect: >-
          The fee entries on the return rise by the shoebox fee, lowering what is owed and so the card refund.
    cross_category:
      - category: orders
        as: branch
        reads: [variant_name, ship_to_state, shipping_fee_usd, merchandise_subtotal_usd, discount_total_usd, sales_tax_usd, order_lines.amount_usd, order_lines.product_class]
        note: The order's service, state, fee, merchandise and tax decide the fee refunded, the basis and the shipping tax.
    compute:
      - credits_on_return: "SUM('return_settlements','amount_usd', event_type='returns_refund_credited')"
      - fees_on_return: "-SUM('return_settlements','amount_usd', event_type='returns_fee_assessed')"
      - refunds_paid: "-SUM('return_settlements','amount_usd', event_type='returns_refund_issued')"
      - owed_after_fees: "credits_on_return - fees_on_return - refunds_paid"
      - credited_merchandise: "SUM('return_settlements','merchandise_amount_usd', event_type='returns_refund_credited')"
      - fault_lines: "COUNT('return_lines', event_type='returns_line_authorized', return_reason='defective') + COUNT('return_lines', event_type='returns_line_authorized', return_reason='arrived_too_late')"
      - partial_lines: "COUNT('return_lines', event_type='returns_line_authorized', return_reason='not_as_pictured')"
      - shipping_share: "K('fault_share_full') if fault_lines > 0 else (K('fault_share_partial') if partial_lines > 0 else 0)"
      - order_fee: "CFIELD('orders','shipping_fee_usd', order_id=F('order_id'))"
      - order_net: "CFIELD('orders','merchandise_subtotal_usd', order_id=F('order_id')) - CFIELD('orders','discount_total_usd', order_id=F('order_id'))"
      - shipping_basis: "0 if order_fee == 0 else (credited_merchandise / order_net if credited_merchandise < order_net else 1)"
      - order_service_f: "CFIELD('orders','variant_name', order_id=F('order_id'))"
      - fee_refunded: "MN(order_fee, K('expedited_list_fee')) if (order_service_f == 'Next Business Day' or order_service_f == 'Same-Day Courier') else (MN(order_fee, K('standard_list_fee')) if order_service_f == 'Expedited 2-Day' else order_fee)"
      - shipping_refund: "RND(fee_refunded * shipping_basis * shipping_share + K('half_up_nudge'), 2)"
      - order_state: "CFIELD('orders','ship_to_state', order_id=F('order_id'))"
      - order_tax_f: "CFIELD('orders','sales_tax_usd', order_id=F('order_id'))"
      - accessories_net: "XSUM('orders','order_lines','amount_usd', order_id=F('order_id'), event_type='orders_line_booked', product_class='accessories')"
      - shipping_tax: "RND(shipping_refund * accessories_net / order_net * order_tax_f / (accessories_net + order_fee * accessories_net / order_net) + K('half_up_nudge'), 2) if ((order_state == 'PA' or order_state == 'NJ' or order_state == 'MN') and accessories_net > 0) else (RND(shipping_refund * order_tax_f / (order_net + order_fee) + K('half_up_nudge'), 2) if (order_state == 'NY' or order_state == 'TX') else 0)"
      - card_refundable: "XSUM('orders','order_payments','amount_usd', order_id=F('order_id'), tender_type='card_or_wallet') - refunds_paid"
      - result: "RND(MN(card_refundable, owed_after_fees + shipping_refund + shipping_tax), 2)"
    compute_basis:
      credits_on_return: "The amount paid to the card is the credit entries on the return less its fee entries and any refund already paid on it, rounded half up to the cent."
      fees_on_return: "The final card refund on a return whose type carries a return shipping fee is fixed only after the return carries the return shipping fee entry for the method its parcel travelled by."
      refunds_paid: "The amount paid to the card is the credit entries on the return less its fee entries and any refund already paid on it, rounded half up to the cent."
      owed_after_fees: "The amount paid to the card is the credit entries on the return less its fee entries and any refund already paid on it, rounded half up to the cent."
      fault_lines: "The share of the original shipping refunded follows the reasons on the return's authorization entries"
      shipping_share: "The share of the original shipping refunded follows the reasons on the return's authorization entries: a line returned as defective or as arrived_too_late gives `fault_share_full`; otherwise a line returned as not_as_pictured gives `fault_share_partial`; any other return gives nothing."
      shipping_basis: "The shipping basis follows what the return takes back: an order charged no shipping fee has nothing to refund; when the merchandise credited on the return is less than the order's net merchandise at placement, the basis is that credited merchandise over the order's net merchandise at placement; otherwise the whole fee."
      fee_refunded: "The fee refunded follows the service the order shipped by: Next Business Day or Same-Day Courier is refunded at most the Expedited 2-Day list fee `expedited_list_fee`; Expedited 2-Day at most the Standard Ground list fee `standard_list_fee`; any other service the fee charged."
      shipping_refund: "The original shipping refund is the fee refunded times the shipping basis times the share, rounded half up to the cent."
      shipping_tax: "Its tax follows the ship-to state: Pennsylvania, New Jersey and Minnesota tax delivery charges in proportion to taxable goods, so an order carrying accessories adds the shipping refund times the accessories' share of the order's net merchandise times the order's tax rate (its sales tax over the accessories plus the shipping fee's taxable share); New York and Texas tax the whole delivery charge, so the shipping refund times the sales tax over the net merchandise plus the shipping fee is added; any other state adds no tax; the tax is rounded half up to the cent."
      card_refundable: "The amount paid to the card is what is owed on the return after fees plus the original shipping refund and its tax worked out below, rounded half up to the cent, and never more than what remains refundable on that card (captured on it for the order less the refunds already made to it for the order and on this return); any remainder follows the orders charter's refund priority to the order's other tenders and is not paid by this action."
      result: "The amount paid to the card is what is owed on the return after fees plus the original shipping refund and its tax worked out below, rounded half up to the cent, and never more than what remains refundable on that card (captured on it for the order less the refunds already made to it for the order and on this return); any remainder follows the orders charter's refund priority to the order's other tenders and is not paid by this action."
    factors:
      - id: return_reason_shipping_share
        effect: parameter
        decides: shipping_share
        bindings: [fault_lines, partial_lines, shipping_share]
        ladder:
          - when: "a line returned as defective or arrived_too_late"
            value: "K('fault_share_full')"
          - when: "no such line, and a line returned as not_as_pictured"
            value: "K('fault_share_partial')"
          - when: "otherwise"
            value: "0"
        baseline:
          shipping_share: "0"
        evidence: [history]
        cross_difficulty: null
      - id: shipping_refund_basis
        effect: method
        decides: shipping_basis
        bindings: [credited_merchandise, shipping_basis]
        ladder:
          - when: "the order was charged no shipping fee"
            method: "nothing to refund"
          - when: "merchandise credited on the return is less than the order's net merchandise at placement"
            method: "credited merchandise over the order's net merchandise at placement"
          - when: "otherwise"
            method: "the whole fee"
        baseline:
          shipping_basis: "1"
        evidence: [history]
        cross_difficulty: null
      - id: service_fee_ceiling
        effect: parameter
        decides: fee_refunded
        bindings: [order_service_f, fee_refunded]
        ladder:
          - when: "order shipped by Next Business Day or Same-Day Courier"
            value: "at most K('expedited_list_fee')"
          - when: "order shipped by Expedited 2-Day"
            value: "at most K('standard_list_fee')"
          - when: "otherwise"
            value: "the fee charged"
        baseline:
          fee_refunded: "order_fee"
        evidence: [cross_category]
        cross_difficulty: null
      - id: delivery_charge_tax_refund
        effect: method
        decides: shipping_tax
        bindings: [order_state, accessories_net, shipping_tax]
        ladder:
          - when: "ship-to Pennsylvania, New Jersey or Minnesota AND the order carries accessories"
            method: "shipping refund x accessories share x the order's tax rate on taxable goods and their shipping share"
          - when: "ship-to New York or Texas"
            method: "shipping refund x sales tax / (net merchandise + shipping fee)"
          - when: "otherwise"
            method: "no tax is added"
        baseline:
          shipping_tax: "0"
        evidence: [cross_category]
        cross_difficulty: null
    baseline:
      rule: >-
        The amount paid to the card is the credit entries on the return less its fee entries and any refund already paid on it, rounded half up to the cent.
      params: []
    inputs:
      history:
        - {table: return_settlements, aggregate: sum, field: amount_usd, filters: {event_type: returns_refund_credited}}
        - {table: return_settlements, aggregate: sum, field: amount_usd, filters: {event_type: returns_fee_assessed}}
        - {table: return_lines, aggregate: count, field: return_reason, filters: {event_type: returns_line_authorized}}
      cross_category: [orders]
  # ---------------------------------------------------------------------------------------------
  - id: returns_ext_exchange_hold
    base_policy_refs: [returns_evt_exchange]
    overwrite:
      - base_policy: returns_evt_exchange
        superseded_clause: >-
          An Instant Exchange hold is placed only with the customer's own consent to a card hold of the replacement price plus tax (`hold_amount_basis`).
        replaced_by: >-
          An Instant Exchange card hold is placed only by the cardholder personally, on the card the original order was paid with, for the hold amount set out below.
    trigger: on_request
    subject: [returns_hold_placed]
    computes: hold_amount_usd
    target_tool: place_exchange_hold_2c1506d4
    params:
      senior_hold_share: 0.5
      member_hold_share: 0.9
      secured_share: 0.5
      half_secured_share: 0.75
      prompt_days: 7
      prompt_share: 0.9
      timely_days: 14
      timely_share: 0.95
    rule: >-
      An Instant Exchange card hold is placed only by the cardholder personally, on the card the original order was paid with, for the hold amount set out below.
      An Instant Exchange card hold against an order is placed only after every return on that order that has passed inspection carries its final-settlement refund.
      The hold amount is the replacement value of the units authorized on the exchange plus the sales tax on that value, rounded half up to the cent.
      The replacement value is the booked unit price of the line being exchanged times its units authorized, and the sales tax on it is the order's sales tax times that value divided by the order's net merchandise at placement.
      The value per unit follows how the line was priced after purchase: a line carrying a price adjustment is valued at the regular price it was adjusted to (the reference price recorded on the adjustment), because the replacement is the same style at today's regular price; a line with no price adjustment carrying a checkout promotion discount or late promotion credit is valued at the price paid, its booked unit price less those per unit booked; any other line at its booked unit price.
      The tax on the hold follows the ship-to state: for Pennsylvania, New Jersey and Minnesota a footwear or apparel line carries no tax and an accessories line carries the order's sales tax rate on its accessories and their shipping share; any other state takes the order's sales tax times the value over the net merchandise at placement.
      The member share follows the cardholder's Marlowe Rewards membership in status active: Platinum, Icon or Atelier holds `senior_hold_share` of the value; Silver or Gold holds `member_hold_share`; anyone else holds the full value.
      The security share follows the spendable balance on the customer's stored-value instrument in status active: a balance at least the replacement value holds `secured_share`; at least half of it holds `half_secured_share`; anything less holds the full value.
      The prompt share follows the days from the order's delivered date to the exchange's authorization: `prompt_days` days or fewer hold `prompt_share`; up to `timely_days` days hold `timely_share`; later exchanges hold the full value.
      The hold amount is the replacement value times the member, security and prompt shares, plus the tax on the hold, added once and rounded half up to the cent.
    prerequisite:
      - problem: returns_ext_final_card_refund
        kind: state_gate
        gate: return_settlements.refund_stage
        form: state
        policy_source: >-
          An Instant Exchange card hold against an order is placed only after every return on that order that has passed inspection carries its final-settlement refund.
        condition: >-
          Every return of the exchange's order in status inspected carries a returns_refund_issued settlement entry with refund_stage final_settlement.
        resolved_by: pay_final_card_refund_b5173030
        effect: >-
          Every return of the exchange's order that has passed inspection carries its final-settlement refund, so the Instant Exchange hold may be placed.
    cross_category:
      - category: orders
        as: branch
        reads: [ship_to_state, delivered_date, shipping_fee_usd, merchandise_subtotal_usd, discount_total_usd, sales_tax_usd, order_lines.unit_price_usd, order_lines.quantity, order_lines.line_discount_usd, order_lines.amount_usd, order_lines.product_class]
        note: The exchanged line's price and reductions, the ship-to state and the delivered date decide the value, the tax and the prompt share.
      - category: loyalty
        as: branch
        reads: [variant_name]
        note: The tier decides the member share.
      - category: credit
        as: branch
        reads: [balance_usd, status]
        note: The active stored-value balance decides the security share.
    compute:
      - ie_line: "LATEST('return_lines','booked_line_id', date_field='event_date', event_type='returns_line_authorized')"
      - ie_units: "SUM('return_lines','quantity', event_type='returns_line_authorized')"
      - ie_price: "XLATEST('orders','order_lines','unit_price_usd', order_line_id=ie_line)"
      - ie_booked_units: "XLATEST('orders','order_lines','quantity', order_line_id=ie_line)"
      - ie_promotions: "XLATEST('orders','order_lines','line_discount_usd', order_line_id=ie_line) - XSUM('orders','order_lines','amount_usd', booked_line_id=ie_line, event_type='orders_post_purchase_promo')"
      - ie_adjustment: "-XSUM('orders','order_lines','amount_usd', booked_line_id=ie_line, event_type='orders_price_adjusted')"
      - ie_reference_price: "XLATEST('orders','order_lines','reference_price_usd', booked_line_id=ie_line, event_type='orders_price_adjusted')"
      - value_per_unit: "ie_reference_price if ie_adjustment > 0 else (ie_price - ie_promotions / ie_booked_units if ie_promotions > 0 else ie_price)"
      - replacement_value: "value_per_unit * ie_units"
      - ie_class: "XLATEST('orders','order_lines','product_class', order_line_id=ie_line)"
      - ie_state: "CFIELD('orders','ship_to_state', order_id=F('order_id'))"
      - ie_order_tax: "CFIELD('orders','sales_tax_usd', order_id=F('order_id'))"
      - ie_order_net: "CFIELD('orders','merchandise_subtotal_usd', order_id=F('order_id')) - CFIELD('orders','discount_total_usd', order_id=F('order_id'))"
      - ie_order_fee: "CFIELD('orders','shipping_fee_usd', order_id=F('order_id'))"
      - ie_accessories: "XSUM('orders','order_lines','amount_usd', order_id=F('order_id'), event_type='orders_line_booked', product_class='accessories')"
      - hold_tax: "0 if ((ie_state == 'PA' or ie_state == 'NJ' or ie_state == 'MN') and (ie_class == 'footwear' or ie_class == 'apparel')) else (replacement_value * ie_order_tax / (ie_accessories + ie_order_fee * ie_accessories / ie_order_net) if ((ie_state == 'PA' or ie_state == 'NJ' or ie_state == 'MN') and ie_class == 'accessories') else replacement_value * ie_order_tax / ie_order_net)"
      - hold_tier: "CFIELD('loyalty','variant_name', status='active')"
      - member_hold: "K('senior_hold_share') if (hold_tier == 'Marlowe Rewards Platinum' or hold_tier == 'Marlowe Rewards Icon' or hold_tier == 'Marlowe Rewards Atelier') else (K('member_hold_share') if (hold_tier == 'Marlowe Rewards Silver' or hold_tier == 'Marlowe Rewards Gold') else 1)"
      - stored_balance: "CFIELD('credit','balance_usd', status='active')"
      - security_hold: "K('secured_share') if stored_balance >= replacement_value else (K('half_secured_share') if stored_balance >= replacement_value / 2 else 1)"
      - exchange_gap_days: "DAYS(CFIELD('orders','delivered_date', order_id=F('order_id')), F('opened_date'))"
      - prompt_hold: "K('prompt_share') if exchange_gap_days <= K('prompt_days') else (K('timely_share') if exchange_gap_days <= K('timely_days') else 1)"
      - result: "RND(replacement_value * member_hold * security_hold * prompt_hold + hold_tax, 2)"
    compute_basis:
      ie_line: "The replacement value is the booked unit price of the line being exchanged times its units authorized, and the sales tax on it is the order's sales tax times that value divided by the order's net merchandise at placement."
      ie_units: "The replacement value is the booked unit price of the line being exchanged times its units authorized, and the sales tax on it is the order's sales tax times that value divided by the order's net merchandise at placement."
      value_per_unit: "The value per unit follows how the line was priced after purchase: a line carrying a price adjustment is valued at the regular price it was adjusted to (the reference price recorded on the adjustment), because the replacement is the same style at today's regular price; a line with no price adjustment carrying a checkout promotion discount or late promotion credit is valued at the price paid, its booked unit price less those per unit booked; any other line at its booked unit price."
      hold_tax: "The tax on the hold follows the ship-to state: for Pennsylvania, New Jersey and Minnesota a footwear or apparel line carries no tax and an accessories line carries the order's sales tax rate on its accessories and their shipping share; any other state takes the order's sales tax times the value over the net merchandise at placement."
      member_hold: "The member share follows the cardholder's Marlowe Rewards membership in status active: Platinum, Icon or Atelier holds `senior_hold_share` of the value; Silver or Gold holds `member_hold_share`; anyone else holds the full value."
      security_hold: "The security share follows the spendable balance on the customer's stored-value instrument in status active: a balance at least the replacement value holds `secured_share`; at least half of it holds `half_secured_share`; anything less holds the full value."
      prompt_hold: "The prompt share follows the days from the order's delivered date to the exchange's authorization: `prompt_days` days or fewer hold `prompt_share`; up to `timely_days` days hold `timely_share`; later exchanges hold the full value."
      result: "The hold amount is the replacement value times the member, security and prompt shares, plus the tax on the hold, added once and rounded half up to the cent."
    factors:
      - id: exchange_value_basis
        effect: method
        decides: value_per_unit
        bindings: [ie_price, ie_booked_units, ie_promotions, ie_adjustment, ie_reference_price, value_per_unit]
        ladder:
          - when: "the line carries a price adjustment"
            method: "the reference price recorded on the adjustment"
          - when: "no price adjustment, and the line carries a checkout promotion discount or late promotion credit"
            method: "the price paid: booked unit price less promotions per unit booked"
          - when: "otherwise"
            method: "booked unit price"
        baseline:
          value_per_unit: "ie_price"
        evidence: [history]
        cross_difficulty: null
      - id: exempt_goods_hold_tax
        effect: method
        decides: hold_tax
        bindings: [ie_class, ie_state, ie_accessories, hold_tax]
        ladder:
          - when: "ship-to Pennsylvania, New Jersey or Minnesota AND the line is footwear or apparel"
            method: "no tax on the hold"
          - when: "ship-to Pennsylvania, New Jersey or Minnesota AND the line is accessories"
            method: "the order's tax rate on accessories and their shipping share"
          - when: "otherwise"
            method: "order sales tax times the value over net merchandise at placement"
        baseline:
          hold_tax: "replacement_value * ie_order_tax / ie_order_net"
        evidence: [history]
        cross_difficulty: null
      - id: member_hold_share
        effect: parameter
        decides: member_hold
        bindings: [hold_tier, member_hold]
        ladder:
          - when: "active Platinum, Icon or Atelier membership"
            value: "K('senior_hold_share')"
          - when: "active Silver or Gold membership"
            value: "K('member_hold_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          member_hold: "1"
        evidence: [cross_category]
        cross_difficulty: loyalty
      - id: stored_value_security
        effect: parameter
        decides: security_hold
        bindings: [stored_balance, security_hold]
        ladder:
          - when: "active stored-value balance at least the replacement value"
            value: "K('secured_share')"
          - when: "active stored-value balance at least half the replacement value"
            value: "K('half_secured_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          security_hold: "1"
        evidence: [cross_category]
        cross_difficulty: credit
      - id: prompt_exchange_share
        effect: parameter
        decides: prompt_hold
        bindings: [exchange_gap_days, prompt_hold]
        ladder:
          - when: "exchange authorized prompt_days days or fewer after delivery"
            value: "K('prompt_share')"
          - when: "exchange authorized up to timely_days days after delivery"
            value: "K('timely_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          prompt_hold: "1"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The hold amount is the replacement value of the units authorized on the exchange plus the sales tax on that value, rounded half up to the cent.
        The replacement value is the booked unit price of the line being exchanged times its units authorized, and the sales tax on it is the order's sales tax times that value divided by the order's net merchandise at placement.
      params: []
    inputs:
      history:
        - {table: return_lines, aggregate: sum, field: quantity, filters: {event_type: returns_line_authorized}}
      cross_category: [orders, loyalty, credit]
