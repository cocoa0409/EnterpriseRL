# Returns & Exchanges — every return authorization (RMA) a customer opens against a delivered
# order. The return type is the tier: it fixes how the customer is made whole (original tenders,
# Return Store Credit or a replacement), the window, the fees and the inspection consequences.

category: returns
display_name: Returns & Exchanges

binding:
  holding_table: return_cases
  event_tables: [return_lines, return_settlements]
  status_field: status
  variant_field: variant_name

lifecycle:
  states: [authorized, in_transit, received, inspected, settled, cancelled, expired]
  transitions:
    - {from: authorized, to: in_transit, by: system, means: "The carrier records the first scan of the return parcel."}
    - {from: in_transit, to: received, by: system, means: "The returns centre receives the parcel."}
    - {from: in_transit, to: inspected, by: system, means: "A return parcel lost in the carrier network on a Marlowe & Finch label is deemed received and every unit accepted at grade A."}
    - {from: received, to: inspected, by: system, means: "The returns centre posts the inspection result of every unit."}
    - {from: inspected, to: settled, by: agent, means: "The returns desk settles the return: refunds, fees, reissues and exchanges are booked."}
    - {from: authorized, to: cancelled, by: agent, means: "The customer decides to keep the items and the unused authorization is cancelled before any carrier scan."}
    - {from: authorized, to: expired, by: system, means: "No carrier scan was recorded by the return-by date."}

accounts:
  - key: refund_due
    unit: USD
    meaning: "What Marlowe & Finch still owes the customer on the return: accepted value credited, minus fees withheld and refunds paid (negative while an instant credit has been paid ahead of inspection)."
  - key: exchange_hold
    unit: USD
    meaning: "Value of an Instant Exchange card hold that is still open on the customer's card."

parameter_schema:
  refund_form: "How the customer is made whole (enum string: original_tenders | return_store_credit | exchange_same_style)."
  base_return_window_days: "Calendar days after the order's delivered date within which the return must be started and first scanned, for non-footwear lines (integer)."
  footwear_return_window_days: "Same as base_return_window_days for footwear lines (integer)."
  window_anchor: "Record date from which the window is counted (enum string: delivered_date)."
  deadline_basis: "Which record proves the item was sent back in time (enum string: first_carrier_scan_date)."
  loyalty_window_extension_applies: "Whether the returning customer's Marlowe Rewards return_window_extension_days is added (boolean)."
  holiday_extension_applies: "Whether the holiday return extension applies (boolean)."
  holiday_delivery_window_start: "First delivered date (MM-DD) covered by the holiday extension."
  holiday_delivery_window_end: "Last delivered date (MM-DD) covered by the holiday extension."
  holiday_return_by: "Return-by date (MM-DD of the following year) granted by the holiday extension."
  label_validity_days: "Calendar days a return label or QR code stays valid after authorization (integer)."
  allowed_return_methods: "Return methods offered (list of mail_label | carrier_drop_off_qr | scheduled_pickup)."
  return_method_fee_applies: "Whether the return method fee in the method fee register is withheld from the refund (boolean)."
  method_fee_waivable: "Whether a Marlowe Rewards free_return_label tier or an Unlimited plan with covers_return_label waives the method fee (boolean)."
  restocking_fee_applies: "Whether restocking fees can be charged (boolean)."
  restocking_fee_pct_grade_b: "Restocking fee as a percentage of the net unit price paid for a grade B unit (integer percent)."
  restocking_fee_cap_per_unit_usd: "Maximum restocking fee per unit (USD, 2 dp)."
  missing_box_fee_usd: "Flat fee per footwear unit returned without its original box or in a box used as the shipping carton (USD, 2 dp)."
  grade_c_handling: "What happens to a grade C (worn, washed, altered or damaged) unit (enum string: reject_and_send_back | accept_as_defective)."
  refund_includes_original_shipping: "Whether the original shipping fee and surcharge are refunded (boolean)."
  refund_includes_sales_tax: "Whether sales tax on accepted units is refunded (boolean)."
  instant_credit_at_first_scan: "Whether Return Store Credit is issued at the first carrier scan, before inspection (boolean)."
  instant_credit_shortfall_recovery: "How value is recovered when instant credit for rejected units has already been spent (enum string: charge_original_card | not_applicable)."
  exchange_ships: "When the replacement ships (enum string: after_inspection | immediately | not_applicable)."
  exchange_price_rule: "Which replacements are allowed (enum string: same_style_same_price | not_applicable)."
  exchange_out_of_stock_fallback: "What happens when the replacement is out of stock at shipping (enum string: refund_to_original_tenders | not_applicable)."
  exchanges_per_original_line: "How many times units of one booked line can be exchanged (integer; 0 when not an exchange)."
  exchange_outbound_shipping_fee_usd: "Shipping fee charged for the replacement (USD, 2 dp)."
  instant_exchange_max_value_usd: "Highest retail value of the replacement on an Instant Exchange (USD, 2 dp; 0.00 when not applicable)."
  instant_exchange_requires_card_tender: "Whether the original order must have been paid at least partly with a card or wallet (boolean)."
  hold_amount_basis: "What the Instant Exchange card hold covers (enum string: replacement_price_plus_tax | not_applicable)."
  hold_capture_trigger: "When the hold is charged (enum string: return_expired_cancelled_or_rejected | not_applicable)."
  inspection_sla_business_days: "Business days from receipt to posted inspection (integer)."
  settlement_sla_business_days: "Business days from inspection to settlement (integer)."
  requires_defect_photos: "Whether photos of the defect must be on the return before authorization (boolean)."
  max_returns_per_order: "Most return authorizations, not cancelled or expired, per order (integer)."
  final_sale_returnable: "Whether final-sale lines can be returned (boolean)."
  swim_intimates_requires_hygiene_liner: "Whether swimwear and intimates are accepted only with the hygiene liner and tags intact (boolean)."
  gift_cards_returnable: "Whether gift-card lines can be returned (boolean)."
  personalized_items_returnable: "Whether monogrammed or personalised items can be returned (boolean)."
  partial_quantity_returns_allowed: "Whether part of a multi-unit line can be returned (boolean)."
  gift_return_refund_basis: "Value refunded on a gift return (enum string: net_price_paid | not_applicable)."
  gift_return_purchaser_notified: "Whether the purchaser of a gift order is told of a gift return (boolean)."
  deadline_extension_days: "Calendar days added to the return-by date by a deadline extension (integer)."
  deadline_extension_limit: "Most deadline extensions per return (integer)."
  lost_return_trace_business_days: "Business days without carrier movement after which a return parcel on an M&F label is traced and deemed received (integer)."
  rejected_item_send_back_fee_usd: "Fee for shipping a rejected unit back to the customer (USD, 2 dp)."
  tax_refund_basis: "How sales tax refunded on accepted units is derived from the order (enum string: order_tax_pro_rata_by_net_merchandise)."
  refund_rounding_rule: "Rounding of prorated tax and computed fees (enum string: half_up_to_cent_per_line)."

