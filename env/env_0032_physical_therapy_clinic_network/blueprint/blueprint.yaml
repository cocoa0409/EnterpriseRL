name: env_0032_physical_therapy_clinic_network
company: Piedmont Motion Physical Therapy

background: |
  Piedmont Motion Physical Therapy is an outpatient physical therapy network of 126 clinics across North Carolina,
  from Wilmington and the Triangle to Greensboro, Charlotte and Asheville, eleven of which have therapy pools. It
  treats orthopedic, post-surgical, spine, sports, vestibular and pelvic health patients, and runs workers'
  compensation programs for employers across the state; its central Patient Services Center answers patients,
  family members and employer contacts in a plain, warm and precise voice. Most patients are treated under an
  Insured Plan of Care, opened at the initial evaluation and billed under one of seven payer programs: Commercial
  PPO Plan of Care, Commercial High-Deductible Plan of Care, Commercial POS Plan of Care, Commercial HMO Plan of
  Care, Medicare Part B Plan of Care, Medicare Advantage Plan of Care and Medicaid Managed Care Plan of Care. On a
  plan of care the clinic books payer authorizations as approved visits, bills each visit to the payer, and posts
  the patient's copays, deductibles and coinsurance to a running balance that statements, payments and adjustments
  work down. Visits themselves are held as an Appointment Series in one of six formats — Telehealth 30-Minute Visit
  Series, Standard 45-Minute Visit Series, Extended 60-Minute Visit Series, Aquatic Therapy Visit Series, Specialty
  One-on-One Visit Series and Post-Operative Priority Visit Series — whose bookings, attendances, cancellations,
  no-shows and missed-visit fees are recorded appointment by appointment. Cash-pay patients buy a Self-Pay Visit
  Package — Starter 4-Visit, Recovery 6-Visit, Core 8-Visit, Complete 12-Visit, Post-Surgical 18-Visit or
  Comprehensive 24-Visit — whose visits are credited as it is paid for and drawn as appointments are attended.
  Patients who cannot pay a balance at once sign a Patient Payment Plan: the Short-Term 3-Month, Standard 6-Month,
  Extended 10-Month, Long-Term 12-Month, Large-Balance 18-Month or Hardship 24-Month Payment Plan, which takes in
  plan-of-care charges and is paid down in monthly installments. Low-income and heavily burdened patients apply to
  the Patient Hardship Discount Program, whose determinations at Hardship Discount Level 1 (25%), Level 2 (50%),
  Level 3 (75%), Level 4 (100%), Catastrophic Medical Hardship or Presumptive Eligibility Discount reduce what they
  owe on their plans of care. Injured workers come through a Workers' Compensation Referral — Employer Direct Early
  Intervention, Workers' Comp Outpatient Therapy, Workers' Comp Post-Surgical Therapy, Work Conditioning Program,
  Work Hardening Program or Functional Capacity Evaluation — where adjuster authorizations, charges to the carrier
  or employer, remittances and reports to the adjuster are booked against the claim. Graduates of therapy often
  stay on as members through a Wellness Membership: Open Gym Access, Aquatic Access, Wellness Essentials, Wellness
  Plus, Performance or Performance Plus, billed monthly with maintenance sessions credited each period. Callers are
  typically mid-episode patients juggling an authorization, a standing appointment block and a balance at the same
  time; older Medicare patients and their adult children; cash-pay athletes and post-surgical patients on packages;
  injured workers whose employer, carrier and adjuster all have a say; and former patients with a membership or a
  lingering payment plan. They arrive with months of history behind them — visits used against authorizations,
  missed appointments, statements already sent, installments paid or missed — and often hold products from two or
  three of these lines at once.

logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: insured_plan_authorizations_and_balances
    claim:
      categories: [plan]
      event_types: [plan_activated, plan_auth_requested, plan_auth_approved, plan_auth_denied, plan_auth_recorded,
        plan_visit_billed, plan_patient_charge_posted, plan_patient_payment, plan_patient_adjustment,
        plan_patient_refund, plan_waiver_signed, plan_held, plan_resumed, plan_recertified, plan_benefits_reverified]
    summary: >
      Callers are patients, or family members acting for them, part-way through an Insured Plan of Care whose tier
      — commercial PPO, high-deductible, POS or HMO, Medicare Part B, Medicare Advantage or Medicaid managed care —
      decides whether visits need prior authorization, a referral or a physician certification, how cost sharing is
      collected and what may ever be billed to the patient; they ask why a visit is not covered, whether more visits
      can be approved, why a copay or deductible was charged, how a payment was applied, or when a credit will be
      refunded, and their plans range from intake to on hold to discharged with balances still open, often alongside
      a second plan of care for another diagnosis with the same payer. The records involved are the plan of care with
      its verified benefits, certification dates and current authorization, and the plan's history of authorization
      requests, approvals and denials, billed visits, patient charges, payments, adjustments, refunds, waivers and
      statements; the governing rules are state and authorization gates on billing (plan_visit_authorization,
      plan_opening_requirements), the shared calendar-year visit limit counted by date of service
      (plan_agg_benefit_visit_limit), per-tier time-of-service collection (plan_evt_time_of_service_collection), the
      Medicare KX threshold (plan_medicare_kx_threshold), extension, retroactive, peer-to-peer and appeal windows
      (plan_evt_authorization_requests), progress and recertification cadence (plan_certification_and_progress), the
      application of payments and credits (plan_evt_payment_application) and the closed list of allowed adjustments
      (plan_evt_balance_adjustments), against a background in which benefits are verified, the plan is evaluated and
      activated, visits are authorized and billed, and patient responsibility posts and is then paid down. The agent
      looks up, computes and records authorization requests, held or resumed plans, recertifications, re-verified
      benefits, patient charges, payments, permitted adjustments and refunds, while signing an advance
      financial-responsibility waiver (ABN or commercial waiver) is the patient's own act and is handed to them.
      Requests no policy decides — waiving a copay as a courtesy, billing a Medicare Advantage or Medicaid patient
      for a non-covered visit without a covering notice, overriding a payer's denial, changing a diagnosis code or a
      payer's allowed amount, or disputing the payer's medical-necessity judgment itself — go to a human
      representative as POLICY_NOT_COVERED.

  - name: appointment_booking_and_missed_visits
    claim:
      categories: [series]
      event_types: [series_funding_changed, series_restriction_updated, series_paused, series_resumed, series_cancelled,
        series_visits_booked, series_visit_rescheduled, series_visit_cancelled, series_no_show, series_fee_assessed,
        series_fee_waived, series_fee_paid, series_fee_refunded, series_visits_released]
    summary: >
      Callers are patients who want to book, move or cancel appointments in their Appointment Series, or who are
      disputing a late-cancellation or no-show fee, asking why their standing slots were released or why they can
      only book same-day openings; their series differ by format — telehealth, standard, extended, aquatic,
      specialty one-on-one or post-operative — and by what funds them (an insured plan of care, a self-pay visit
      package, a workers' compensation referral or a wellness membership), and they bring a history of reschedules,
      late cancellations, no-shows, waivers already used and fees paid or unpaid. The records involved are the
      series with its standing pattern, funding link, booked visits, fee balance and restrictions, the series
      history of bookings, attendances, cancellations with their notice hours and channel, no-shows, fees, waivers,
      payments and releases, and the funding holding's own status; the governing rules are the booking gates and
      blocks (series_booking_eligibility), combined weekly frequency across series sharing a funding holding
      (series_agg_weekly_frequency), notice, reschedule and late-arrival classification
      (series_evt_notice_and_rescheduling), per-format fees and the funding-dependent exemptions that defer to the
      plan of care, referral, package or membership (series_evt_missed_visit_fees), the ordered single-reason waiver
      rules with their request window (series_evt_fee_waivers), fee payment methods (series_evt_fee_payment), the
      rolling missed-visit release threshold (series_attendance_and_release) and pause limits
      (series_lifecycle_rules), with the natural background order of a series being opened and booked, appointments
      attended or missed, fees assessed and then paid or waived. The agent books, reschedules, cancels, records
      fees, waivers, payments and refunds, pauses or cancels a series and switches its funding, while nothing in
      this domain needs the patient's own signature beyond their instruction on the call. Requests the rules do not
      decide — waiving a fee for a reason outside the listed ones, splitting a fee, reinstating a released series,
      booking beyond the horizon or past a same-day restriction as a favor, or demanding a specific therapist the
      format does not guarantee — go to a human representative as POLICY_NOT_COVERED.

  - name: self_pay_visit_packages
    claim:
      categories: [package]
      event_types: [package_purchased, package_activated, package_withdrawn, package_payment_received,
        package_visits_credited, package_visit_forfeited, package_frozen, package_unfrozen, package_reinstated,
        package_cancelled, package_visits_refunded, package_refund_issued, package_visits_transferred,
        package_billing_dispute_filed]
    summary: >
      Callers are cash-pay patients who want to buy a Self-Pay Visit Package, pay an installment, freeze or reinstate
      a package, transfer unused visits to a family member, restore a forfeited visit, or cancel for a refund; their
      packages range from the Starter 4-Visit to the Comprehensive 24-Visit and the Post-Surgical 18-Visit, sit in
      pending payment, active, frozen, expired or exhausted states, and often coexist with an insured plan of care,
      a Medicare plan, a wellness membership or a second package. The records involved are the package with its
      price, discount, Good Faith Estimate, installments, expiry and freeze details, the package history of
      payments, credits, redemptions, forfeits, expiries, transfers and refunds, the refund requests, and the
      patient's other holdings that gate a purchase; the governing rules are the Medicare and in-network exclusions,
      age and surgery-window gates (package_purchase_eligibility), the single non-stacking discount
      (package_renewal_pricing), installment crediting (package_evt_payments_and_crediting), format-dependent
      redemption and draw-down order (package_evt_redemption, package_agg_redemption_order), forfeit grace and
      restoration (package_evt_missed_visit_forfeit), freeze limits (package_freeze_rules), the reinstatement window
      (package_expiry_and_reinstatement), full and prorated refunds (package_evt_refunds), transfers
      (package_evt_transfers) and Good Faith Estimate disputes (package_gfe_disputes), with the natural background
      order of estimate, purchase, payment, crediting, use and closure. The agent quotes, records purchases,
      payments, credits, freezes, reinstatements, refunds and transfers, while confirming the cancellation of a
      package for a refund, withdrawing an unpaid purchase and starting a federal billing dispute are the patient's
      own acts. Requests no rule decides — refunding visits after the tier's refund rights are gone, selling a
      package to a Medicare beneficiary for covered therapy, stacking discounts, extending an expiry outside a freeze
      or reinstatement, or transferring to someone outside the allowed relationship — go to a human representative
      as POLICY_NOT_COVERED.

  - name: patient_payment_plans
    claim:
      categories: [payplan]
      event_types: [payplan_enrolled, payplan_signed, payplan_cured, payplan_reinstated, payplan_cancelled,
        payplan_terms_modified, payplan_autopay_updated, payplan_balance_transferred_in, payplan_fee_assessed,
        payplan_payment_received, payplan_balance_adjusted, payplan_payment_deferred]
    summary: >
      Callers are patients, or the guarantor for a family member, who owe balances left on their insured plans of
      care and want to set up a Patient Payment Plan, add new charges to one, change the installment or due day,
      take a payment holiday, catch up after missed installments, reinstate a defaulted plan or end it; their
      balances differ in size, age and kind (copays, coinsurance, deductibles, deductible estimates, non-covered
      visits, charges already at collections, missed-visit fees), and some hold an approved or expired hardship
      determination that changes which term they can choose. The records involved are the payment plan with its
      enrolled balance, down payment, installment, term and automatic payment set-up, the plan history of
      transferred charges, fees, payments, adjustments, missed installments, failed drafts, holidays and default
      notices, and the source plan-of-care charges with their posting dates; the governing rules are the one-plan
      limit (payplan_agg_multi_holding), charge eligibility, age and balance bands with the hardship gate
      (payplan_enrollment_eligibility), the down payment and installment schedule (payplan_payment_schedule),
      signature and lapse (payplan_signature_and_activation), payment application (payplan_evt_payments), grace,
      fees and cure (payplan_evt_delinquency), default notice and reinstatement windows
      (payplan_default_and_reinstatement), add-on and holiday limits (payplan_add_ons_and_holidays) and balance
      adjustments (payplan_evt_adjustments), with the natural background order of charges posting on a plan of care,
      enrollment, signature, installments and either payoff or default. The agent selects eligible charges, computes
      and records the enrollment, payments, fees, adjustments, add-ons, holidays, modifications and reinstatements,
      while signing the agreement and cancelling an active plan are the patient's own acts. Requests no rule decides
      — charging or waiving interest, enrolling missed-visit fees or charges at collections, a term longer than the
      tier allows, a second concurrent plan, or settling a balance for less than owed — go to a human representative
      as POLICY_NOT_COVERED.

  - name: workers_comp_referrals_and_billing
    claim:
      categories: [wc]
      event_types: [wc_referral_opened, wc_activated, wc_suspended, wc_reactivated, wc_compensability_updated,
        wc_work_status_updated, wc_auth_recorded, wc_authorization_received, wc_visit_billed, wc_charge_posted,
        wc_penalty_billed, wc_payment_posted, wc_adjustment_posted, wc_report_sent, wc_missed_visit_reported]
    summary: >
      Callers are injured workers, employer HR or safety contacts and carrier adjusters asking about a Workers'
      Compensation Referral — whether treatment can start, why visits stopped, whether the worker will get a bill,
      where a report or a payment is, or why a remittance came in short; referrals differ by program (employer
      direct early intervention, outpatient, post-surgical, work conditioning, work hardening or a functional
      capacity evaluation), by the carrier's compensability position (pending, paid without prejudice, accepted or
      denied) and by authorization and billing history, and a worker may hold several referrals on one claim or also
      hold an insured plan of care. The records involved are the referral with its claim, employer, carrier,
      adjuster, compensability, entry documents, work status and authorization in force, and the referral history
      of authorizations, recorded visits, charges with submission dates, payments, adjustments, penalties, reports
      and missed visits; the governing rules are the entry requirements and pending-claim allowance
      (wc_referral_intake), the Form 63 contest window (wc_compensability), the authorization and billing-status
      gates (wc_authorization), shared weekly frequency on a claim (wc_agg_claim_frequency), per-program rates and the
      submission deadline (wc_evt_charges), network discounts, late-payment penalties and denied-claim rebilling
      (wc_evt_payments_and_penalties), reporting duties (wc_reporting), suspension and discharge (wc_suspension_and_discharge)
      and the employer direct cap (wc_employer_direct), with the natural background order of referral, entry
      documents, authorization, visits, bills, remittances and reports. The agent registers and activates referrals,
      records authorizations, compensability and work-status changes the carrier or physician has filed, visits,
      charges, remittances, adjustments, penalties, reports and missed-visit notices, and suspends or reactivates
      treatment; nothing here is the worker's own write. Requests no rule decides — billing the worker for a
      compensable claim, accepting a caller's word that a claim was accepted, treating beyond the authorization as a
      favor, changing work restrictions without the physician, or arguing compensability on the carrier's behalf —
      go to a human representative as POLICY_NOT_COVERED.
