# Patient Hardship Discount Program — the clinic network's financial assistance determinations.
# One holding = one application and, if approved, one time-limited determination of a discount level
# that reduces the patient's financial responsibility on Insured Plan of Care charges. The tier is the
# discount level set by household income against the federal poverty guidelines.

category: hardship
display_name: Patient Hardship Discount Program

binding:
  holding_table: hardship_cases
  event_tables: [hardship_events]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    discount_granted_total: discount_granted

lifecycle:
  states: [application_pending, approved, denied, expired, revoked]
  transitions:
    - {from: application_pending, to: approved, by: agent, means: "The application is approved at a discount level after the required documents are reviewed."}
    - {from: application_pending, to: denied, by: agent, means: "The application is denied (income above the limits, documents not received, incomplete, or another payer available)."}
    - {from: approved, to: expired, by: system, means: "The determination reaches its expiry date."}
    - {from: approved, to: revoked, by: agent, means: "The determination is revoked because the application misstated income or household."}

accounts:
  - key: discount_granted
    unit: USD
    meaning: Total hardship discount applied to the patient's charges under this determination, net of reversals.

parameter_schema:
  discount_percent: "Percentage of each eligible patient-responsibility charge removed by the discount; 0 where the level uses the catastrophic cap instead (integer, percent)."
  fpg_percent_min: "Lowest household income, as a percentage of the federal poverty guideline, for this level; 0 where no lower bound (integer, percent)."
  fpg_percent_max: "Highest household income, as a percentage of the federal poverty guideline, for this level; 0 where income is not tested (integer, percent)."
  catastrophic_income_share_percent: "Share of annual household income the patient pays at most during the eligibility period; 0 where the level is not catastrophic (integer, percent)."
  presumptive_programs: "Public benefit programs whose current enrollment qualifies without income documents; empty where the level is income-tested (list of enum: snap, wic, liheap, homeless_shelter)."
  documents_required: "Whether income documents must be provided (boolean)."
  accepted_income_documents: "Documents accepted as proof (list of enum: pay_stubs, tax_return, unemployment_letter, benefits_letter, attestation)."
  income_lookback_months: "Months of income the documents must cover, annualized; 0 where income is not tested (integer, months)."
  documents_due_days: "Calendar days after the application date by which documents must be received (integer, calendar days)."
  document_deadline_extension_days: "Calendar days one extension adds to the documents due date (integer, calendar days)."
  max_document_extensions: "Extensions of the documents due date allowed per application (integer)."
  document_max_age_days: "Maximum age of a document on the application date (integer, calendar days)."
  determination_days: "Calendar days after a complete application within which the determination is made (integer, calendar days)."
  eligibility_period_months: "Months from the effective date for which the determination applies (integer, months)."
  retroactive_days: "Calendar days before the application date back to which earlier service dates are covered (integer, calendar days)."
  applies_to_copays: "Whether copays are discounted (boolean)."
  applies_to_self_pay_packages: "Whether Self-Pay Visit Package prices are discounted (boolean)."
  applies_to_medicare_patients: "Whether patients with Medicare coverage may receive the discount on an individual hardship determination (boolean)."
  applies_to_payment_plan_balances: "Whether charges already enrolled in a Patient Payment Plan are discounted (boolean)."
  discount_applies_after_insurance: "Whether the discount applies only to the patient's responsibility after insurance (boolean)."
  deductible_estimate_discountable: "Whether a time-of-service deductible estimate is discounted before the payer adjudicates the visit (boolean)."
  discount_on_future_visits: "Whether charges for visits during the eligibility period are discounted as they post (boolean)."
  dependent_coverage: "Whether the determination covers the charges of dependents in the applicant's tax household (boolean)."
  min_balance_for_application: "Minimum open patient balance on the application date to apply at this level; 0.00 where none (USD, 2 decimals)."
  renewal_window_days: "Calendar days before expiry from which a renewal application may be made (integer, calendar days)."
  renewal_simplified: "Whether a renewal needs only a current benefits letter rather than full income documents (boolean)."
  asset_test: "Whether assets are counted (boolean)."
  attestation_allowed_without_income: "Whether a signed attestation of no income replaces income documents (boolean)."
  revocation_lookback_days: "Calendar days back from a revocation over which discounts granted under it are reversed (integer, calendar days)."
  medicaid_screening_required: "Whether the applicant must be screened for Medicaid eligibility before approval (boolean)."
  medicaid_application_deadline_days: "Calendar days after a screening shows likely Medicaid eligibility within which the applicant must apply for Medicaid; 0 where no screening is required (integer, calendar days)."
  collections_hold: "Whether the patient's balances are held from collections while the application is pending (boolean)."
  collections_hold_days: "Maximum calendar days of that hold (integer, calendar days)."
  reapply_after_denial_days: "Calendar days after a denial for income above the limit before a new application at an income-tested level is accepted (integer, calendar days)."
  appeal_window_days: "Calendar days after a denial within which the applicant may appeal in writing (integer, calendar days)."
  payment_plan_hardship_tier_eligible: "Whether an approved determination at this level qualifies the patient for the Hardship 24-Month Payment Plan (boolean)."
  income_change_report_days: "Calendar days within which the patient must report a household income change during the eligibility period (integer, calendar days)."
  redetermination_on_income_change: "Whether a reported income change triggers a new level determination (boolean)."
  uninsured_only: "Whether only patients without insurance qualify (boolean)."
  fpg_one_person_income: "Federal poverty guideline annual income for a household of one, as adopted by the program for the current year (USD, 2 decimals)."
  fpg_additional_person_income: "Amount added to the guideline for each additional household member (USD, 2 decimals)."
  fpg_percent_rounding: "How the computed poverty-guideline percentage is rounded: floor (whole percent, rounded down) (enum)."
  income_basis: "Which income counts: gross_annualized (gross household income over the lookback, annualized) (enum)."
  self_employment_income_basis: "How self-employment income counts: net_profit (enum)."
  recall_from_collections: "Whether balances already with the collection agency are recalled and discounted (boolean)."
  interview_required: "Whether a financial counselor interview is required before approval (boolean)."
  approver_role: "Who approves at this level: billing_office or business_office_director (enum)."
  discount_recovery_on_insurance_payment: "Whether a discount is reversed when insurance later pays the discounted charge (boolean)."

