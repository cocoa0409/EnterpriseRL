events:
  - type: hardship_applied
    target: hardship_cases
    mutation: create
    meaning: A patient applies to the Patient Hardship Discount Program with household size and income.
    grain: one row per application
    fields:
      hardship_case_id: reference number of the application
      customer_id: the applicant (guarantor)
      variant_name: level applied for from the stated income or benefits program
      opened_date: application date
      household_size: people in the tax household
      annual_household_income: stated annualized gross household income
      fpg_percent: household income as a percentage of the poverty guideline
      presumptive_program: public benefit program claimed for presumptive eligibility; none otherwise
      documents_due_date: date documents are due
    triggers: []
  - type: hardship_deadline_extended
    target: hardship_cases
    mutation: update
    meaning: The documents due date of a pending application is extended once.
    grain: one row per transaction
    fields:
      documents_due_date: new due date
      document_extensions_used: extensions including this one
    triggers: []
  - type: hardship_approved
    target: hardship_cases
    mutation: {transition: {from: application_pending, to: approved}}
    meaning: The application is approved at a discount level.
    grain: one row per transaction
    fields:
      status: becomes approved
      variant_name: level approved
      determination_date: date decided
      effective_date: first day the determination applies (the application date)
      expiry_date: last day it applies
      approver_role: who approved
    triggers: []
  - type: hardship_denied
    target: hardship_cases
    mutation: {transition: {from: application_pending, to: denied}}
    meaning: The application is denied.
    grain: one row per transaction
    fields:
      status: becomes denied
      determination_date: date decided
      denial_reason: why
      closed_date: date closed
    triggers: []
  - type: hardship_expired
    target: hardship_cases
    mutation: {transition: {from: approved, to: expired}}
    meaning: The determination reaches its expiry date.
    grain: one row per transaction
    fields:
      status: becomes expired
      closed_date: day after the expiry date
    triggers: []
  - type: hardship_revoked
    target: hardship_cases
    mutation: {transition: {from: approved, to: revoked}}
    meaning: The determination is revoked for misstated income or household.
    grain: one row per transaction
    fields:
      status: becomes revoked
      revoke_reason: why
      closed_date: date revoked
    triggers: []
  - type: hardship_redetermined
    target: hardship_cases
    mutation: update
    meaning: A reported income or household change during the eligibility period moves the determination to another level.
    grain: one row per transaction
    fields:
      variant_name: new level
      household_size: new household size
      annual_household_income: new annualized income
      fpg_percent: new percentage of the poverty guideline
    triggers: []
  - type: hardship_documents_received
    target: hardship_events
    meaning: A supporting document for the application is received.
    grain: one row per document received
    distinguish_by: [document_kind, document_date]
    fields:
      event_date: date received
      document_kind: kind of document
      document_date: date printed on the document
    triggers: []
  - type: hardship_discount_applied
    target: hardship_events
    meaning: The hardship discount is applied to one patient-responsibility charge on an Insured Plan of Care.
    grain: one row per discounted charge
    distinguish_by: [source_event_id]
    fields:
      event_date: date applied
      care_plan_id: plan of care the charge is on
      source_event_id: reference of the plan-of-care charge discounted
      amount: discount amount (positive)
      discount_percent: percentage applied (0 for a catastrophic cap discount)
      charge_location: whether the charge is still on the plan of care or already enrolled in a Patient Payment Plan
    account: discount_granted
    direction: in
    triggers:
      - event: plan:plan_patient_adjustment
        when: {charge_location: care_plan}
        map: {adjustment_kind: hardship_discount, amount: amount, source_event_id: source_event_id}
      - event: payplan:payplan_balance_adjusted
        when: {charge_location: payment_plan}
        map: {adjustment_kind: hardship_discount, amount: amount, source_event_id: source_event_id}
  - type: hardship_discount_reversed
    target: hardship_events
    meaning: A previously applied discount is reversed (revocation or later insurance payment on the charge).
    grain: one row per reversed discount
    distinguish_by: [source_event_id, reversal_reason]
    fields:
      event_date: date reversed
      source_event_id: reference of the discount reversed
      amount: amount reversed (positive)
      reversal_reason: why
    account: discount_granted
    direction: out
    triggers: []

measures:
  - id: hardship_msr_responsibility_period
    window: from the determination's effective_date to its expiry_date
    measure: sum of amount of plan_patient_charge_posted rows of the applicant and covered dependents whose visit_date falls in the window, excluding deductible_estimate charges, less amounts of their billing_error_correction and timely_filing_writeoff adjustments

policies:
  - id: hardship_agg_multi_holding
    subject: [hardship_applied]
    rule: >-
      A patient holds at most max_per_customer hardship cases that are pending or approved: one approved determination
      and one renewal application. A new application is not accepted while the patient already has an application pending;
      a renewal application is accepted only within renewal_window_days calendar days before the current expiry date.
    eligibility:
      - id: one_pending_application
        applies_to: [hardship_applied]
        kind: dedup
        condition: "A new application is not accepted while the patient already has an application pending;"
        evidence_fields: [hardship_cases.customer_id, hardship_cases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_cases.customer_id]
          action_bindings:
            hardship_cases.customer_id: customer_id
        dedup_contract:
          table: hardship_cases
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [application_pending]}
          distinct_fields: [opened_date]
    params:
      max_per_customer: 2

  - id: hardship_agg_single_determination
    subject: [hardship_approved, hardship_discount_applied]
    rule: >-
      Only one approved determination applies to a charge: the one whose effective date to expiry date contains the
      charge's visit date. A renewal approved before the current expiry takes effect on the day after that expiry date.
      Discounts under two determinations never stack on the same charge, and where dependent_coverage is true the
      determination covers dependents in the applicant's tax household as one household.
    eligibility: []

  - id: hardship_application
    subject: [hardship_applied, hardship_documents_received, hardship_deadline_extended]
    rule: >-
      The applicant states household size, household income by income_basis over the last income_lookback_months months
      (self-employment income counted by self_employment_income_basis) or current enrollment in a presumptive program;
      income documents are required where documents_required is true;
      assets are never counted while asset_test is false, and insured patients qualify while uninsured_only is false.
      Where min_balance_for_application is above 0.00 the open patient balance must reach it. Documents from
      accepted_income_documents are due documents_due_days calendar days after the application date, may be dated no more
      than document_max_age_days before it, and the due date may be extended by document_deadline_extension_days up to
      max_document_extensions times. A signed attestation replaces income documents only where
      attestation_allowed_without_income is true and the applicant has no income. After a denial for income above the limit, a new income-tested application is accepted no earlier than reapply_after_denial_days calendar days after the date of that denial.
      Days are counted as calendar days from the denial date, the denial date itself being day zero. While the
      application is pending and collections_hold is true, the patient's balances are not transferred to collections
      for up to collections_hold_days calendar days.
    eligibility:
      - id: reapply_wait
        applies_to: [hardship_applied]
        kind: time
        condition: "After a denial for income above the limit, a new income-tested application is accepted no earlier than reapply_after_denial_days calendar days after the date of that denial."
        evidence_fields: [hardship_cases.determination_date, hardship_cases.denial_reason, hardship_cases.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_cases.customer_id]
          action_bindings:
            hardship_cases.customer_id: customer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date of that denial
          anchor_source: hardship_cases.determination_date
          relation: not_before
          duration_source: variants.reapply_after_denial_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the denial date, the denial date itself being day zero."
          boundary: inclusive

  - id: hardship_level_determination
    subject: [hardship_approved, hardship_redetermined]
    rule: >-
      The poverty guideline for the household is fpg_one_person_income plus fpg_additional_person_income for each member
      beyond the first, and fpg_percent is household income divided by that guideline, times 100, rounded by
      fpg_percent_rounding. The level is the one whose fpg_percent_min to fpg_percent_max band contains fpg_percent; an
      applicant currently enrolled in one of presumptive_programs is approved at Presumptive Eligibility Discount without
      income documents. An applicant above 400 percent but within the Catastrophic Medical Hardship band qualifies there
      only when the open balance reaches its min_balance_for_application. An application is approved only after every required document is received or the attestation is on file,
      within determination_days calendar days, by approver_role, and after a Medicaid screening where
      medicaid_screening_required is true and after an interview where interview_required is true. The effective date is
      the application date and the expiry date is eligibility_period_months months later, less one day. A reported
      income change during the period, due within
      income_change_report_days, leads to a new level from the next charge where redetermination_on_income_change is
      true.
    eligibility:
      - id: documents_complete
        applies_to: [hardship_approved]
        kind: authorization
        condition: "An application is approved only after every required document is received or the attestation is on file,"
        evidence_fields: [hardship_events.document_kind, hardship_events.hardship_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_events.hardship_case_id]
          action_bindings:
            hardship_events.hardship_case_id: hardship_case_id
    formula:
      guideline: fpg_one_person_income + fpg_additional_person_income * (household_size - 1)
      computed_fpg_percent: annual_household_income / (fpg_one_person_income + fpg_additional_person_income * (household_size - 1)) * 100

  - id: hardship_denial_and_appeal
    subject: [hardship_denied]
    rule: >-
      An application is denied only for one of these reasons: income_above_limit when fpg_percent is above every band
      the applicant could qualify for; documents_not_received when the required documents have not arrived by the
      documents due date on file after any extension; incomplete_application when the household or income questions
      are left unanswered; and medicaid_eligible_not_applied where medicaid_screening_required is true, the screening
      shows likely Medicaid eligibility, and the applicant has not applied within medicaid_application_deadline_days
      calendar days of the screening. A denial is made by the business office, never on the applicant's request, and
      may be appealed in writing within appeal_window_days calendar days after the determination date; while an appeal
      is open the collections hold continues.
    eligibility: []

  - id: hardship_evt_discounts
    subject: [hardship_discount_applied]
    rule: >-
      Discounts are applied only under a determination in approved status. Where discount_applies_after_insurance is
      true the discount applies only once the payer has adjudicated the visit. Eligible charges are patient-responsibility
      charges on Insured Plans of Care whose tier has hardship_discount_eligible true, with a visit date from
      retroactive_days calendar days before the application date through the expiry date; copays only where
      applies_to_copays is true, deductible estimates never while deductible_estimate_discountable is false, Self-Pay
      Visit Package prices never while applies_to_self_pay_packages is false, Medicare patients' charges where
      applies_to_medicare_patients is true, and charges already in a Patient Payment Plan where
      applies_to_payment_plan_balances is true (the plan balance is then reduced instead). A charge already with the
      collection agency is recalled and discounted only where recall_from_collections is true. The discount is
      discount_percent of the charge's open amount, rounded to the cent; at Catastrophic Medical Hardship it is the part
      of each charge that takes hardship_msr_responsibility_period above catastrophic_income_share_percent of annual
      household income. Charges posted during the period are discounted as they post where discount_on_future_visits is
      true.
    eligibility:
      - id: determination_approved
        applies_to: [hardship_discount_applied]
        kind: state
        condition: "Discounts are applied only under a determination in approved status."
        evidence_fields: [hardship_cases.status, hardship_cases.hardship_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_cases.hardship_case_id]
          action_bindings:
            hardship_cases.hardship_case_id: hardship_case_id
        state_contract:
          field: hardship_cases.status
          allowed: [approved]
    params:
      per_tier:
        Hardship Discount Level 1 (25%): {discount_percent: "=discount_percent", catastrophic_income_share_percent: "=catastrophic_income_share_percent"}
        Hardship Discount Level 2 (50%): {discount_percent: "=discount_percent", catastrophic_income_share_percent: "=catastrophic_income_share_percent"}
        Hardship Discount Level 3 (75%): {discount_percent: "=discount_percent", catastrophic_income_share_percent: "=catastrophic_income_share_percent"}
        Hardship Discount Level 4 (100%): {discount_percent: "=discount_percent", catastrophic_income_share_percent: "=catastrophic_income_share_percent"}
        Catastrophic Medical Hardship: {discount_percent: "=discount_percent", catastrophic_income_share_percent: "=catastrophic_income_share_percent"}
        Presumptive Eligibility Discount: {discount_percent: "=discount_percent", catastrophic_income_share_percent: "=catastrophic_income_share_percent"}
    formula:
      percent_discount: round(amount * discount_percent / 100, 2)
      catastrophic_cap: round(annual_household_income * catastrophic_income_share_percent / 100, 2)
    measures: [hardship_msr_responsibility_period]

  - id: hardship_reversals_and_revocation
    subject: [hardship_discount_reversed, hardship_revoked]
    rule: >-
      A determination is revoked when the business office finds that the application misstated income or household; on
      revocation every discount granted under it within revocation_lookback_days calendar days before the revocation is
      reversed (revoked_misrepresentation) and the charges are owed again. Where discount_recovery_on_insurance_payment is
      true, a later insurance payment on a discounted charge reverses the discount by the amount the insurer paid, never
      more than the discount (insurance_paid_charge). A determination is never revoked on the patient's request; the
      patient may simply stop using it.
    eligibility: []

  - id: hardship_expiry_and_renewal
    subject: [hardship_expired]
    rule: >-
      An approved determination expires on the day after its expiry date; charges with later visit dates are not
      discounted unless a renewal is approved. A renewal application may be made from renewal_window_days calendar days
      before expiry, and where renewal_simplified is true it needs only a current benefits letter. A Hardship 24-Month
      Payment Plan already set up stays in force after expiry, but a new hardship payment plan needs an unexpired
      determination at a level with payment_plan_hardship_tier_eligible true.
    eligibility: []
