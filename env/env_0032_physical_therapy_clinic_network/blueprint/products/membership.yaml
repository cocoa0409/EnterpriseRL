events:
  - type: membership_enrolled
    target: wellness_memberships
    mutation: create
    meaning: A member signs up for a membership with a start date and billing day.
    grain: one row per membership
    fields:
      membership_id: reference number of the membership
      customer_id: the member
      variant_name: membership tier
      opened_date: sign-up date
      start_date: date access begins
      clinic_name: home clinic
      billing_day: day of month dues are drafted
      monthly_dues: dues locked at sign-up
      commitment_end_date: last day of the commitment; empty where none
      clearance_date: date of the medical or therapist clearance on file; empty where none
      enrollment_fee_waived: whether the enrollment fee is waived
    triggers:
      - event: membership:membership_dues_billed
        map: {charge_kind: enrollment_fee}
  - type: membership_started
    target: wellness_memberships
    mutation: {transition: {from: pending_start, to: active}}
    meaning: The membership starts.
    grain: one row per transaction
    fields:
      status: becomes active
    triggers:
      - event: membership:membership_sessions_credited
        map: {credit_kind: orientation}
  - type: membership_frozen
    target: wellness_memberships
    mutation: {transition: {from: active, to: frozen}}
    meaning: The membership is frozen for a set period.
    grain: one row per transaction
    fields:
      status: becomes frozen
      freeze_start_date: first frozen day
      freeze_end_date: last frozen day
      freeze_kind: medical or personal
      freezes_used_year: freezes in the current membership year including this one
    triggers: []
  - type: membership_unfrozen
    target: wellness_memberships
    mutation: {transition: {from: frozen, to: active}}
    meaning: The freeze ends.
    grain: one row per transaction
    fields:
      status: becomes active
      commitment_end_date: commitment end pushed out by the frozen months where applicable
    triggers: []
  - type: membership_past_due
    target: wellness_memberships
    mutation: {transition: {from: active, to: past_due}}
    meaning: Dues stay unpaid past the grace period.
    grain: one row per transaction
    fields:
      status: becomes past_due
      past_due_date: date it became past due
    triggers:
      - event: membership:membership_dues_billed
        map: {charge_kind: late_fee}
  - type: membership_restored
    target: wellness_memberships
    mutation: {transition: {from: past_due, to: active}}
    meaning: Past-due dues are paid and the membership is current again.
    grain: one row per transaction
    fields:
      status: becomes active
    triggers: []
  - type: membership_cancel_notice
    target: wellness_memberships
    mutation: {transition: {from: active, to: pending_cancellation}}
    meaning: The member gives written notice of cancellation.
    grain: one row per transaction
    fields:
      status: becomes pending_cancellation
      cancel_notice_date: date notice was given
      cancel_effective_date: date the cancellation takes effect
    triggers: []
  - type: membership_notice_withdrawn
    target: wellness_memberships
    mutation: {transition: {from: pending_cancellation, to: active}}
    meaning: The member withdraws a cancellation notice before it takes effect.
    grain: one row per transaction
    fields:
      status: becomes active
      cancel_effective_date: cleared
    triggers: []
  - type: membership_cancelled
    target: wellness_memberships
    mutation: {transition: [{from: pending_cancellation, to: cancelled}, {from: past_due, to: cancelled}, {from: pending_start, to: cancelled}]}
    meaning: The membership ends.
    grain: one row per transaction
    fields:
      status: becomes cancelled
      closed_date: date it ended
      close_reason: why it ended
    triggers: []
  - type: membership_tier_changed
    target: wellness_memberships
    mutation: update
    meaning: The membership moves to another tier from the next billing period.
    grain: one row per transaction
    fields:
      variant_name: new tier
      monthly_dues: new dues
      tier_change_date: first day of the billing period the change applies to
    triggers: []
  - type: membership_dues_billed
    target: membership_events
    meaning: Dues or a membership fee (enrollment, freeze, late or early-termination) are billed.
    grain: one row per charge kind per billing period
    distinguish_by: [charge_kind, billing_period]
    fields:
      event_date: date billed
      charge_kind: what is billed
      billing_period: billing period the charge belongs to
      amount: amount billed (positive)
    account: dues_owed
    direction: in
    triggers:
      - event: membership:membership_sessions_credited
        when: {charge_kind: monthly_dues}
        map: {billing_period: billing_period, credit_kind: monthly_allotment}
  - type: membership_payment_received
    target: membership_events
    meaning: A dues or fee payment is received.
    grain: one row per payment per charge
    distinguish_by: [source_event_id, event_date]
    fields:
      event_date: date received
      amount: amount paid (positive)
      payment_method: card or bank draft
      billing_period: billing period paid
      source_event_id: reference of the charge paid
    account: dues_owed
    direction: out
    triggers: []
  - type: membership_dues_adjusted
    target: membership_events
    meaning: A billed charge is reduced without payment (enrollment or freeze fee waiver, termination fee waiver, billing correction).
    grain: one row per adjustment per charge
    distinguish_by: [adjustment_kind, source_event_id]
    fields:
      event_date: date adjusted
      adjustment_kind: why
      amount: amount removed (positive)
      source_event_id: reference of the charge adjusted
    account: dues_owed
    direction: out
    triggers: []
  - type: membership_refund_issued
    target: membership_events
    meaning: A payment is refunded (cooling-off cancellation or overpayment).
    grain: one row per refund of one payment
    distinguish_by: [source_event_id]
    fields:
      event_date: date refunded
      amount: amount refunded (positive)
      source_event_id: reference of the payment refunded
    account: dues_owed
    direction: in
    triggers: []
  - type: membership_sessions_credited
    target: membership_events
    meaning: Maintenance sessions are credited (monthly allotment or orientation).
    grain: one row per credit per billing period
    distinguish_by: [credit_kind, billing_period]
    fields:
      event_date: date credited
      credit_kind: monthly allotment or orientation
      billing_period: billing period credited
      sessions: sessions credited
    account: member_sessions
    direction: in
    triggers: []
  - type: membership_session_used
    target: membership_events
    meaning: The member attends a maintenance session, movement screen, performance analysis or group class.
    grain: one row per attended session
    distinguish_by: [appointment_date, session_kind]
    fields:
      event_date: date recorded
      appointment_date: date of the session
      session_kind: what was attended
      sessions: maintenance sessions drawn (1 for a maintenance session, 0 otherwise)
    account: member_sessions
    direction: out
    triggers: []
  - type: membership_session_forfeited
    target: membership_events
    meaning: A maintenance session is forfeited for a no-show or late cancellation.
    grain: one row per missed session
    distinguish_by: [appointment_date]
    fields:
      event_date: date recorded
      appointment_date: date of the missed session
      missed_kind: no-show or late cancellation
      sessions: sessions forfeited (always 1)
    account: member_sessions
    direction: out
    triggers: []
  - type: membership_sessions_expired
    target: membership_events
    meaning: Unused sessions beyond the rollover limit expire at the end of a billing period, or all unused sessions expire on cancellation.
    grain: one row per billing period end
    distinguish_by: [billing_period]
    fields:
      event_date: date expired
      billing_period: billing period that ended
      sessions: sessions expired
    account: member_sessions
    direction: out
    triggers: []
  - type: membership_guest_pass_used
    target: membership_events
    meaning: The member brings a guest on an included guest pass.
    grain: one row per guest visit
    distinguish_by: [appointment_date, guest_name]
    fields:
      event_date: date recorded
      appointment_date: date of the guest visit
      guest_name: guest's name exactly as given
      billing_period: billing period the pass counts against
    triggers: []

measures:
  - id: membership_msr_screens_cy
    window: the current calendar year (January 1 to December 31 of the year of frozen_time), by appointment_date
    measure: count of membership_session_used rows on this membership with session_kind movement_screen
  - id: membership_msr_analyses_cy
    window: the current calendar year (January 1 to December 31 of the year of frozen_time), by appointment_date
    measure: count of membership_session_used rows on this membership with session_kind performance_analysis
  - id: membership_msr_classes_period
    window: the billing period containing the class date
    measure: count of membership_session_used rows on this membership with session_kind group_class
  - id: membership_msr_guests_period
    window: the billing period containing the guest visit
    measure: count of membership_guest_pass_used rows on this membership

policies:
  - id: membership_agg_multi_holding
    subject: [membership_enrolled]
    rule: >-
      A member holds at most max_per_customer membership. A new membership is not opened while the member holds one that is pending_start, active, frozen, past_due or pending_cancellation;
      a different tier is reached by a tier change instead.
    eligibility:
      - id: one_membership
        applies_to: [membership_enrolled]
        kind: dedup
        condition: "A new membership is not opened while the member holds one that is pending_start, active, frozen, past_due or pending_cancellation;"
        evidence_fields: [wellness_memberships.customer_id, wellness_memberships.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wellness_memberships.customer_id]
          action_bindings:
            wellness_memberships.customer_id: customer_id
        dedup_contract:
          table: wellness_memberships
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_start, active, frozen, past_due, pending_cancellation]}
          distinct_fields: [opened_date]
    params:
      max_per_customer: 1

  - id: membership_enrollment
    subject: [membership_enrolled, membership_started]
    rule: >-
      A member must be at least min_age_years old on the start date, and a parent or guardian signs below
      guardian_signature_under_age. Where medical_clearance_required is true the start needs a clearance on file. The
      enrollment fee is billed unless one of two waivers applies: a patient discharged
      from an Insured Plan of Care or a Workers' Compensation Referral, or whose Self-Pay Visit Package was exhausted, is waived only when signing up no later than enrollment_fee_waiver_discharge_days calendar days after the discharge date on file;
      a former member rejoining no later than rejoin_window_days calendar days after the cancellation date is waived;
      anyone else pays enrollment_fee. Days are counted as calendar days from the discharge date, the discharge date
      itself being day zero. Where prorate_first_month is true, dues for the days from the start date to the day before
      the first billing day are prorated by day over a 30-day month. Dues are locked for rate_lock_months from the start.
      Membership sessions are wellness services: while the member holds an Insured Plan of Care or a Workers'
      Compensation Referral in active status, maintenance sessions are not booked, because they would duplicate skilled
      therapy billed to a payer; gym and pool access continue.
    eligibility:
      - id: discharge_waiver_window
        applies_to: [membership_enrolled]
        kind: time
        condition: "a patient discharged from an Insured Plan of Care or a Workers' Compensation Referral, or whose Self-Pay Visit Package was exhausted, is waived only when signing up no later than enrollment_fee_waiver_discharge_days calendar days after the discharge date on file;"
        evidence_fields: [care_plans.discharge_date, wc_cases.discharge_date, visit_packages.closed_date, care_plans.customer_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_plans.customer_id]
          action_bindings:
            care_plans.customer_id: customer_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the discharge date on file
          anchor_source: care_plans.discharge_date
          relation: not_after
          duration_source: variants.enrollment_fee_waiver_discharge_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the discharge date, the discharge date itself being day zero."
          boundary: inclusive

  - id: membership_evt_dues_billing
    subject: [membership_dues_billed, membership_sessions_credited]
    rule: >-
      Dues are drafted on the member's billing day, one of billing_day_choices. The commitment end date is
      commitment_months billing periods after the start date (none where commitment_months is 0). Monthly dues are
      billed on the billing day for every billing period the membership is active, past due or pending
      cancellation; no dues are billed for frozen days. Each monthly dues charge credits sessions_per_month maintenance
      sessions for that period; orientation_sessions_included are credited at the start. The enrollment fee is billed
      at sign-up unless waived under membership_enrollment. A non-medical freeze bills freeze_fee_per_month per month or
      part month frozen, and a medical freeze bills nothing where medical_freeze_fee_waived is true. A period that
      becomes past due bills late_fee once. The early_termination_fee is billed when a cancellation takes effect before
      commitment_end_date, unless waived under membership_cancellation.
    eligibility: []
    params:
      per_tier:
        Open Gym Access Membership: {monthly_dues: "=monthly_dues", sessions_per_month: "=sessions_per_month", early_termination_fee: "=early_termination_fee"}
        Aquatic Access Membership: {monthly_dues: "=monthly_dues", sessions_per_month: "=sessions_per_month", early_termination_fee: "=early_termination_fee"}
        Wellness Essentials Membership: {monthly_dues: "=monthly_dues", sessions_per_month: "=sessions_per_month", early_termination_fee: "=early_termination_fee"}
        Wellness Plus Membership: {monthly_dues: "=monthly_dues", sessions_per_month: "=sessions_per_month", early_termination_fee: "=early_termination_fee"}
        Performance Membership: {monthly_dues: "=monthly_dues", sessions_per_month: "=sessions_per_month", early_termination_fee: "=early_termination_fee"}
        Performance Plus Membership: {monthly_dues: "=monthly_dues", sessions_per_month: "=sessions_per_month", early_termination_fee: "=early_termination_fee"}

  - id: membership_evt_payments
    subject: [membership_payment_received, membership_refund_issued, membership_dues_adjusted]
    rule: >-
      Dues are drafted automatically by card or bank account where autopay_required is true; HSA and FSA cards are not
      accepted while hsa_fsa_eligible is false. A failed draft is retried failed_payment_retry_days calendar days later. A member who cancels no later than cooling_off_business_days business days after the sign-up date is refunded every payment in full,
      counting business days Monday to Friday excluding federal holidays, the sign-up date itself being day zero. Dues
      already billed for the final period are not refunded on any other cancellation while cancellation_refund_prorated
      is false. Adjustments exist only for a waived enrollment, freeze, late or early-termination fee and for a billing
      error.
    eligibility:
      - id: cooling_off
        applies_to: [membership_refund_issued]
        kind: time
        condition: "A member who cancels no later than cooling_off_business_days business days after the sign-up date is refunded every payment in full,"
        evidence_fields: [wellness_memberships.opened_date, wellness_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wellness_memberships.membership_id]
          action_bindings:
            wellness_memberships.membership_id: membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the sign-up date
          anchor_source: wellness_memberships.opened_date
          relation: not_after
          duration_source: variants.cooling_off_business_days
          unit: business_days
          counting_rule: "counting business days Monday to Friday excluding federal holidays, the sign-up date itself being day zero."
          boundary: inclusive

  - id: membership_evt_sessions
    subject: [membership_session_used, membership_session_forfeited, membership_sessions_expired, membership_guest_pass_used]
    rule: >-
      Sessions, screens, analyses, classes and guest passes are used only while the membership is active or pending cancellation.
      Open-gym visits are allowed only where gym_access is true and open-swim visits only where aquatic_access is true;
      neither draws a session. A maintenance session lasts session_length_minutes and draws one credited session and is booked no more than session_booking_horizon_days ahead;
      movement screens are limited to movement_screens_per_year (membership_msr_screens_cy), performance analyses to
      performance_analyses_per_year (membership_msr_analyses_cy), group classes to group_classes_per_month
      (membership_msr_classes_period) and guest passes to guest_passes_per_month (membership_msr_guests_period). A no-show
      forfeits the session where missed_session_forfeits is true, and a cancellation with less than
      session_late_cancel_hours notice forfeits it where session_late_cancel_forfeits is true; no fee is ever charged for a
      missed membership session. At the end of each billing period unused sessions above session_rollover_max expire; on
      cancellation all unused sessions expire.
    eligibility:
      - id: membership_usable
        applies_to: [membership_session_used, membership_guest_pass_used]
        kind: state
        condition: "Sessions, screens, analyses, classes and guest passes are used only while the membership is active or pending cancellation."
        evidence_fields: [wellness_memberships.status, wellness_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wellness_memberships.membership_id]
          action_bindings:
            wellness_memberships.membership_id: membership_id
        state_contract:
          field: wellness_memberships.status
          allowed: [active, pending_cancellation]
    measures: [membership_msr_screens_cy, membership_msr_analyses_cy, membership_msr_classes_period, membership_msr_guests_period]

  - id: membership_freeze
    subject: [membership_frozen, membership_unfrozen]
    rule: >-
      Only an active membership is frozen, where freeze_allowed is true, for at least freeze_min_days and at most
      freeze_max_days calendar days, and at most freezes_per_year times per membership year counted from the start date.
      A medical freeze needs a physician's or therapist's note. Where freeze_extends_commitment is true the commitment end
      date moves out by the whole months frozen. A freeze cannot be requested while dues are past due.
    eligibility: []

  - id: membership_cancellation
    subject: [membership_cancel_notice, membership_notice_withdrawn, membership_cancelled]
    rule: >-
      Cancellation is the member's own decision and takes written notice; the request is registered and takes effect
      cancel_notice_days calendar days after the notice date, and dues keep billing until then. A cancellation taking
      effect before commitment_end_date bills the early_termination_fee, which is waived for a documented move to a
      residence more than relocation_waiver_miles miles from every clinic, or where medical_termination_waiver is true on
      a physician's statement that the member can no longer exercise. A notice may be withdrawn before it takes effect.
      Within the cooling-off period the membership is cancelled at once with a full refund. Where
      auto_renew_after_commitment is true the membership continues month to month after the commitment. A past-due membership is cancelled no earlier than past_due_cancel_days calendar days after the past-due date on file.
      Days are counted as calendar days from the past-due date, the past-due date itself being day zero.
    eligibility:
      - id: past_due_aged
        applies_to: [membership_cancelled]
        kind: time
        condition: "A past-due membership is cancelled no earlier than past_due_cancel_days calendar days after the past-due date on file."
        evidence_fields: [wellness_memberships.past_due_date, wellness_memberships.membership_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wellness_memberships.membership_id]
          action_bindings:
            wellness_memberships.membership_id: membership_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the past-due date on file
          anchor_source: wellness_memberships.past_due_date
          relation: not_before
          duration_source: variants.past_due_cancel_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the past-due date, the past-due date itself being day zero."
          boundary: inclusive

  - id: membership_delinquency
    subject: [membership_past_due, membership_restored]
    rule: >-
      A membership whose draft still fails payment_grace_days calendar days after the billing day becomes past due and
      is billed late_fee once for that period; access and sessions stop while it is past due. It is restored once every
      past-due charge is paid.
    eligibility: []

  - id: membership_tier_change
    subject: [membership_tier_changed]
    rule: >-
      A tier change takes effect at tier_change_effective; dues and session allotments of the new tier apply from that
      period. A move to a lower tier before commitment_end_date is allowed only where
      downgrade_during_commitment_allowed is true on the current tier. A move to a tier with medical_clearance_required
      true needs a clearance on file. The commitment end date does not change on a tier change.
    eligibility: []
