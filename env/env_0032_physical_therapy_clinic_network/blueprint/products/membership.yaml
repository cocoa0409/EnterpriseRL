# Wellness Membership — month-to-month post-therapy wellness memberships sold at the clinics.
# One holding = one membership of one member with monthly dues, gym and/or pool access and, on the
# higher tiers, a monthly allotment of maintenance sessions with a physical therapist assistant or
# therapist. The membership is a wellness product, not covered therapy.

category: membership
display_name: Wellness Membership

binding:
  holding_table: wellness_memberships
  event_tables: [membership_events]
  intake_tables: [membership_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    sessions_balance: member_sessions
    dues_balance: dues_owed

lifecycle:
  states: [pending_start, active, frozen, past_due, pending_cancellation, cancelled]
  transitions:
    - {from: pending_start, to: active, by: system, means: "The membership starts on its start date once the first dues are paid."}
    - {from: pending_start, to: cancelled, by: user, means: "The member cancels before the start or within the cooling-off period."}
    - {from: active, to: frozen, by: agent, means: "The membership is frozen for the requested period."}
    - {from: frozen, to: active, by: system, means: "The freeze ends and billing resumes."}
    - {from: active, to: past_due, by: system, means: "Dues remain unpaid after the grace period."}
    - {from: past_due, to: active, by: agent, means: "The past-due dues are paid."}
    - {from: past_due, to: cancelled, by: system, means: "Dues remain unpaid past the cancellation limit."}
    - {from: active, to: pending_cancellation, by: user, means: "The member gives written notice of cancellation."}
    - {from: pending_cancellation, to: active, by: user, means: "The member withdraws the cancellation notice before it takes effect."}
    - {from: pending_cancellation, to: cancelled, by: system, means: "The notice period ends and the membership is cancelled."}

accounts:
  - key: member_sessions
    unit: sessions
    meaning: Maintenance sessions credited to the membership and not yet used, forfeited or expired.
  - key: dues_owed
    unit: USD
    meaning: Dues and membership fees billed and not yet paid or adjusted; negative is a credit owed to the member.

parameter_schema:
  monthly_dues: "Monthly membership dues (USD, 2 decimals)."
  enrollment_fee: "One-time enrollment fee (USD, 2 decimals)."
  enrollment_fee_waiver_discharge_days: "Calendar days after discharge from therapy at the clinic within which the enrollment fee is waived (integer, calendar days)."
  sessions_per_month: "Maintenance sessions credited each billing period (integer, sessions)."
  session_length_minutes: "Length of one maintenance session; 0 where the tier has no sessions (integer, minutes)."
  session_rollover_max: "Unused sessions carried into the next billing period; any beyond this expire (integer, sessions)."
  gym_access: "Whether the member may use the clinic gym during open-gym hours (boolean)."
  aquatic_access: "Whether the member may use the pool during open-swim hours at aquatic clinics (boolean)."
  movement_screens_per_year: "Movement screens included per calendar year (integer)."
  performance_analyses_per_year: "Running or golf performance analyses included per calendar year (integer)."
  member_package_discount_percent: "Discount on a Self-Pay Visit Package bought while the membership is active (integer, percent)."
  commitment_months: "Minimum billing periods before cancellation without an early-termination fee; 0 means month to month from the start (integer, months)."
  early_termination_fee: "Fee for cancelling with the cancellation effective before the commitment ends; 0.00 where no commitment (USD, 2 decimals)."
  cancel_notice_days: "Calendar days of written notice before a cancellation takes effect (integer, calendar days)."
  cooling_off_business_days: "Business days after signing within which the member may cancel for a full refund (integer, business days)."
  freeze_allowed: "Whether the membership may be frozen (boolean)."
  freeze_fee_per_month: "Fee per month, or part of a month, of a non-medical freeze (USD, 2 decimals)."
  freeze_min_days: "Minimum length of a freeze (integer, calendar days)."
  freeze_max_days: "Maximum length of a freeze (integer, calendar days)."
  freezes_per_year: "Freezes allowed per membership year counted from the start date (integer)."
  medical_freeze_fee_waived: "Whether the freeze fee is waived for a freeze supported by a medical note (boolean)."
  freeze_extends_commitment: "Whether frozen months are added to the end of the commitment (boolean)."
  billing_day_choices: "Days of the month on which dues may be drafted (list of integers)."
  payment_grace_days: "Calendar days after a failed draft before the membership is past due (integer, calendar days)."
  failed_payment_retry_days: "Calendar days after a failed draft before it is retried (integer, calendar days)."
  late_fee: "Fee billed once per billing period that becomes past due (USD, 2 decimals)."
  past_due_cancel_days: "Calendar days past due after which the membership is cancelled (integer, calendar days)."
  autopay_required: "Whether dues must be drafted automatically from a card or bank account (boolean)."
  missed_session_forfeits: "Whether a missed maintenance session (no-show) forfeits the session instead of a fee (boolean)."
  session_late_cancel_forfeits: "Whether a maintenance session cancelled with less than session_late_cancel_hours notice is forfeited (boolean)."
  session_late_cancel_hours: "Notice in hours below which a session cancellation is late; 0 where the tier has no sessions (integer, hours)."
  session_booking_horizon_days: "How far ahead maintenance sessions may be booked; 0 where the tier has no sessions (integer, calendar days)."
  medical_clearance_required: "Whether a medical or therapist clearance must be on file before the start (boolean)."
  min_age_years: "Minimum member age in whole years on the start date (integer, years)."
  guardian_signature_under_age: "Age below which a parent or guardian signs the agreement (integer, years)."
  prorate_first_month: "Whether dues for the first partial period up to the first billing day are prorated by day (boolean)."
  tier_change_effective: "When a tier change takes effect: next_billing_period (enum)."
  downgrade_during_commitment_allowed: "Whether the member may move to a lower tier before the commitment ends (boolean)."
  rate_lock_months: "Months from the start date during which monthly dues are not increased (integer, months)."
  hsa_fsa_eligible: "Whether HSA or FSA cards may pay dues (boolean)."
  rejoin_window_days: "Calendar days after a cancellation within which a former member rejoins without an enrollment fee (integer, calendar days)."
  guest_passes_per_month: "Guest visits included per billing period (integer)."
  group_classes_per_month: "Group exercise classes included per billing period (integer)."
  auto_renew_after_commitment: "Whether the membership continues month to month after the commitment (boolean)."
  relocation_waiver_miles: "Distance in miles from every Piedmont Motion clinic of a documented new residence for which the early-termination fee is waived (integer, miles)."
  medical_termination_waiver: "Whether the early-termination fee is waived on a physician's statement that the member can no longer exercise (boolean)."
  cancellation_refund_prorated: "Whether dues already billed for the final period are refunded in part on cancellation (boolean)."
  orientation_sessions_included: "Orientation sessions credited at the start, in addition to the monthly allotment (integer, sessions)."

