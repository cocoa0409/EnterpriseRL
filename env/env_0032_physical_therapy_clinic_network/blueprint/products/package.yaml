# Self-Pay Visit Package — prepaid bundles of physical therapy visits bought by cash-pay patients.
# One holding = one purchased package with a visit count, a price and an expiry date. Visits are
# credited as the package is paid for and drawn as the patient attends appointments funded by it.
# The tier is the package size, as cash-pay physical therapy practices sell them.

category: package
display_name: Self-Pay Visit Package

binding:
  holding_table: visit_packages
  event_tables: [package_events]
  intake_tables: [package_refund_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    visits_remaining: package_visits
    amount_paid_total: package_payments

lifecycle:
  states: [pending_payment, active, frozen, exhausted, expired, cancelled]
  transitions:
    - {from: pending_payment, to: active, by: agent, means: "The package is activated when its first (or only) payment is received."}
    - {from: pending_payment, to: cancelled, by: user, means: "The patient withdraws the purchase before paying."}
    - {from: active, to: frozen, by: agent, means: "The package is frozen for a documented medical reason and its expiry clock stops."}
    - {from: frozen, to: active, by: agent, means: "A frozen package is unfrozen and its expiry date is pushed out by the days frozen."}
    - {from: active, to: exhausted, by: system, means: "The last visit of the package has been used."}
    - {from: active, to: expired, by: system, means: "The expiry date has passed with visits unused."}
    - {from: frozen, to: expired, by: system, means: "A frozen package reaches the end of its maximum freeze and its expiry date has passed."}
    - {from: expired, to: active, by: agent, means: "An expired package is reinstated within the reinstatement window after the fee is paid."}
    - {from: active, to: cancelled, by: user, means: "The patient confirms cancellation of the package for a refund of unused visits."}

accounts:
  - key: package_visits
    unit: visits
    meaning: Visits credited to the package that have not yet been redeemed, forfeited, expired, transferred or refunded.
  - key: package_payments
    unit: USD
    meaning: Money the patient has paid toward the package (price installments and reinstatement fees) net of refunds.

parameter_schema:
  visits_included: "Visits included in the package (integer, visits)."
  package_price: "List price of the package before any discount (USD, 2 decimals)."
  single_visit_cash_rate: "Standard single-visit cash rate used to value visits already used when a package is refunded and to price visits beyond the package (USD, 2 decimals)."
  validity_days: "Calendar days after activation until the package expires (integer, calendar days)."
  freeze_allowed: "Whether the package may be frozen for a documented medical reason (boolean)."
  freeze_max_days: "Maximum calendar days of one freeze; 0 where freezing is not allowed (integer, calendar days)."
  freezes_per_package: "Maximum freezes on one package (integer)."
  freeze_requires_medical_note: "Whether a freeze needs a note from a physician or the treating therapist (boolean)."
  freeze_extends_expiry: "Whether unfreezing pushes the expiry date out by the calendar days the package was frozen (boolean)."
  full_refund_days: "Calendar days after the purchase date within which a package with no visits used is refunded in full (integer, calendar days)."
  prorated_refund_allowed: "Whether unused visits are refunded on a prorated basis after the full-refund window (boolean)."
  refund_admin_fee: "Administrative fee deducted from a prorated refund; never deducted from a full refund (USD, 2 decimals)."
  refund_used_visit_valuation: "How visits already used are valued in a prorated refund: single_visit_rate (single_visit_cash_rate) or package_rate (purchase price divided by visits included) (enum)."
  refund_processing_days: "Calendar days after a refund request is approved within which the refund is issued (integer, calendar days)."
  package_card_refund_days: "Calendar days after the card payment within which a refund goes back to that card; later refunds are paid by check (integer, calendar days)."
  refund_requires_written_request: "Whether a refund needs the patient's signed cancellation request (boolean)."
  transfer_allowed: "Whether unused visits may be transferred to another patient (boolean)."
  transfer_relationship: "Who may receive transferred visits: immediate_family, household or none (enum)."
  transfer_min_visits: "Minimum unused visits for a transfer to be allowed; 0 where transfers are not allowed (integer, visits)."
  transfers_per_package: "Maximum transfers out of one package (integer)."
  missed_visit_forfeits_visit: "Whether a late cancellation or no-show on an appointment funded by the package forfeits one package visit instead of a fee (boolean)."
  forfeit_grace_per_package: "Missed appointments per package that are not forfeited (integer)."
  forfeited_visit_restore_on_waiver: "Whether a forfeited visit is restored when the missed appointment qualifies for a clinic closure, telehealth failure or documented-emergency waiver (boolean)."
  installments_allowed: "Whether the package may be paid in installments (boolean)."
  installment_count: "Number of equal installments when paid in installments; 1 where installments are not allowed (integer)."
  installment_interval_days: "Calendar days between installment due dates; 0 where installments are not allowed (integer, calendar days)."
  installment_late_days: "Calendar days after an installment due date after which an unpaid installment freezes visit crediting; 0 where installments are not allowed (integer, calendar days)."
  installment_card_on_file_required: "Whether a card must be kept on file to draft later installments automatically on their due dates (boolean)."
  hsa_fsa_accepted: "Whether HSA or FSA cards are accepted for package payments (boolean)."
  gfe_required: "Whether a written Good Faith Estimate is given before the purchase (boolean)."
  gfe_lead_business_days: "Business days before the first scheduled visit by which the Good Faith Estimate must be given (integer, business days)."
  gfe_dispute_threshold: "Amount by which total billed charges must exceed the Good Faith Estimate for the patient to be eligible for the federal patient-provider dispute process (USD, 2 decimals)."
  gfe_dispute_window_days: "Calendar days after the date of the bill within which the patient may start the dispute process (integer, calendar days)."
  medicare_beneficiary_eligible: "Whether a patient covered by Medicare may buy the package (boolean)."
  in_network_same_diagnosis_allowed: "Whether the package may fund visits for a diagnosis also treated under an active in-network Insured Plan of Care (boolean)."
  benefit_exhausted_exception: "Whether a patient whose insurance visit limit for the calendar year is used up may buy the package for the same diagnosis (boolean)."
  guardian_signature_under_age: "Age in whole years below which a parent or legal guardian must sign the purchase (integer, years)."
  post_surgical_protocol_required: "Whether the surgeon's post-operative protocol must be on file before purchase (boolean)."
  surgery_window_days: "Calendar days after the surgery date within which the package must be purchased; 0 where not post-surgical (integer, calendar days)."
  telehealth_redeemable: "Whether telehealth visits may be paid from the package (boolean)."
  aquatic_redeemable: "Whether aquatic therapy visits may be paid from the package (boolean)."
  specialty_redeemable: "Whether specialty one-on-one visits may be paid from the package (boolean)."
  extended_visit_draw: "Package visits drawn by one extended 60-minute or specialty visit (integer, visits)."
  renewal_discount_percent: "Discount on a new package of any size bought within renewal_window_days after this package was exhausted (integer, percent)."
  renewal_window_days: "Calendar days after exhaustion within which the renewal discount applies; 0 where no renewal discount applies (integer, calendar days)."
  reinstatement_window_days: "Calendar days after expiry within which an expired package may be reinstated; 0 where reinstatement is not offered (integer, calendar days)."
  reinstatement_fee: "Fee to reinstate an expired package; 0.00 where reinstatement is not offered (USD, 2 decimals)."
  reinstatement_extension_days: "Calendar days added to the expiry date, counted from the reinstatement date, when a package is reinstated; 0 where reinstatement is not offered (integer, calendar days)."

