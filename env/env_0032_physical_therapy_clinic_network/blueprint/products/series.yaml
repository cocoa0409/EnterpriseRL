# Appointment Series — the recurring block of booked visits a patient holds at a clinic.
# One holding = one standing series of appointments of one visit format with one therapist,
# funded by exactly one source at a time (an Insured Plan of Care, a Self-Pay Visit Package, a
# Workers' Compensation Referral or a Wellness Membership). The tier is the visit format, because the
# format decides the slot length, the notice period and the missed-visit fee schedule.

category: series
display_name: Appointment Series

binding:
  holding_table: appointment_series
  event_tables: [series_events]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    booked_visits_remaining: scheduled_visits
    missed_fee_balance: missed_visit_fees

lifecycle:
  states: [booked, active, paused, completed, cancelled]
  transitions:
    - {from: booked, to: active, by: system, means: "The series becomes active when the patient attends its first appointment."}
    - {from: active, to: paused, by: agent, means: "The series is paused (funding on hold, patient travel or illness, surgery) and its standing slots are suspended."}
    - {from: paused, to: active, by: agent, means: "A paused series resumes on the same standing slots."}
    - {from: active, to: completed, by: system, means: "The series ends once its booked visits are used or its end date has passed."}
    - {from: booked, to: cancelled, by: agent, means: "The series is cancelled before its first visit."}
    - {from: active, to: cancelled, by: agent, means: "An active series is cancelled (patient request, release after missed visits, funding ended)."}
    - {from: paused, to: cancelled, by: agent, means: "A paused series is cancelled (pause expired, patient request, funding ended)."}

accounts:
  - key: scheduled_visits
    unit: visits
    meaning: Future appointments booked on the series that have not yet been attended, cancelled, missed or released.
  - key: missed_visit_fees
    unit: USD
    meaning: Late-cancellation and no-show fees owed on the series that have not been paid or waived; negative is a paid fee awaiting refund.

parameter_schema:
  booking_horizon_days: "How far ahead, in calendar days from the booking date, appointments may be booked (integer, calendar days)."
  max_visits_per_booking_batch: "Maximum appointments booked in one booking (integer, visits)."
  portal_booking_allowed: "Whether patients may book appointments of this format through the patient portal (boolean)."
  portal_booking_cutoff_hours: "Hours before the appointment start after which the portal no longer books it; 0 where portal booking is not allowed (integer, hours)."
  portal_cancel_allowed: "Whether patients may cancel appointments of this format through the patient portal (boolean)."
  portal_cancel_cutoff_hours: "Hours before the appointment start after which the portal no longer accepts a cancellation; 0 where portal cancellation is not allowed (integer, hours)."
  voicemail_counts_as_notice: "Whether a cancellation left on the clinic voicemail is timed by the voicemail timestamp (boolean)."
  late_cancel_notice_hours: "Minimum notice, in hours before the appointment start, for a cancellation not to count as a late cancellation (integer, hours)."
  late_cancel_fee: "Fee for one late cancellation (USD, 2 decimals)."
  no_show_fee: "Fee for one no-show (USD, 2 decimals)."
  fee_on_first_appointment: "Whether a missed first appointment of the series is charged a fee (boolean)."
  courtesy_waivers_per_year: "Missed-visit fees a patient may have waived as a first-occurrence courtesy per calendar year across all series (integer)."
  missed_fees_per_month_cap: "Maximum missed-visit fees assessed on one series for appointments falling in one calendar month (integer)."
  emergency_waiver_allowed: "Whether a fee is waived for a documented medical or family emergency (boolean)."
  emergency_documentation_days: "Calendar days after the missed appointment within which emergency documentation must be provided (integer, calendar days)."
  telehealth_connection_failure_waiver: "Whether a fee is waived when the visit failed because the telehealth connection failed on the clinic's side or was verified as failed on the patient's side (boolean)."
  same_week_reschedule_waives_fee: "Whether a late cancellation is not charged when the visit is rescheduled into the same Monday-to-Sunday week (boolean)."
  same_week_reschedule_min_notice_hours: "Minimum notice, in hours before the original appointment, for a same-week reschedule to avoid the fee; 0 where same-week rescheduling does not waive the fee (integer, hours)."
  max_reschedules_per_series: "Maximum reschedules of individual appointments on one series (integer)."
  no_show_release_threshold: "Missed appointments within the rolling window at which the series' future appointments are released (integer)."
  no_show_window_days: "Length of the rolling window over which missed appointments are counted (integer, calendar days)."
  late_cancels_count_as_missed: "Whether late cancellations count toward the release threshold together with no-shows (boolean)."
  same_day_only_after_release: "Whether a patient whose appointments were released may only book same-day openings for a period (boolean)."
  same_day_restriction_days: "Length of the same-day-only booking restriction after a release; 0 where no restriction applies (integer, calendar days)."
  grace_minutes_late_arrival: "Minutes after the appointment start within which a late arrival is still seen (integer, minutes)."
  late_arrival_beyond_grace_treated_as: "How an arrival later than the grace period is recorded: no_show or late_cancellation (enum)."
  late_arrival_shortened_visit: "Whether a late arrival within the grace period is seen for the remaining slot time rather than rescheduled (boolean)."
  fee_assessment_days: "Calendar days after the missed appointment within which the fee must be assessed; later fees are not assessed (integer, calendar days)."
  fee_waiver_request_days: "Calendar days after the fee was assessed within which the patient may request a waiver (integer, calendar days)."
  fee_due_days: "Calendar days after assessment by which a missed-visit fee is due (integer, calendar days)."
  unpaid_fee_booking_block_amount: "Unpaid missed-visit fee balance on the patient's series, past its due date, at or above which no new appointments may be booked (USD, 2 decimals)."
  hsa_payment_allowed_for_fees: "Whether a missed-visit fee may be paid with an HSA or FSA card (boolean)."
  fee_refund_days: "Calendar days after a paid fee is waived within which it is refunded (integer, calendar days)."
  pause_max_days: "Maximum calendar days a series may stay paused before it is cancelled (integer, calendar days)."
  pauses_per_series: "Maximum number of pauses on one series (integer)."
  clinic_cancel_rebook_days: "Calendar days after an appointment cancelled by the clinic within which a replacement appointment is offered (integer, calendar days)."
  visit_length_minutes: "Scheduled length of one appointment of this format (integer, minutes)."
  visits_per_week_min: "Minimum standing appointments per week for this format (integer, visits)."
  visits_per_week_max: "Maximum standing appointments per week for this format (integer, visits)."
  series_length_weeks_max: "Maximum length of one series from its start date (integer, weeks)."
  pre_visit_clearance_required: "Whether a pre-visit clearance must be on file before the first appointment (boolean)."
  pre_visit_clearance_kind: "Which clearance is required: tech_check (telehealth device and connection check), aquatic_medical_clearance (pool clearance from the treating therapist), surgical_protocol (surgeon's post-operative protocol) or none (enum)."
  clearance_valid_days: "Calendar days before the series start date within which the clearance must be dated; 0 where no clearance is required (integer, calendar days)."
  specialty_therapist_required: "Whether every appointment must be with a therapist credentialed in the specialty (boolean)."
  postop_first_visit_within_days: "Calendar days after the surgery date by which the first post-operative visit must take place; 0 where not post-operative (integer, calendar days)."
  standing_slot_guaranteed: "Whether the series holds the same weekday and time slot for its whole length (boolean)."
  reactivation_requires_new_series: "Whether a cancelled series can never be reopened, so further visits need a new series (boolean)."
  card_on_file_required: "Whether a payment card must be on file before the series is booked (boolean)."
  auth_pending_slot_hold_days: "Calendar days appointments are held after an insurance-funded series' plan of care goes on hold for authorization before they are released (integer, calendar days)."

