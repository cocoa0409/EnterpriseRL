events:
  - type: wc_referral_opened
    target: wc_cases
    mutation: create
    meaning: A workers' compensation referral is registered with the claim, employer, carrier and adjuster details.
    grain: one row per referral
    fields:
      wc_case_id: reference number of the referral
      customer_id: the injured worker
      variant_name: program tier
      opened_date: date the referral was received
      clinic_name: treating clinic
      employer_name: employer at the date of injury
      carrier_name: workers' compensation carrier or third-party administrator
      claim_number: carrier claim number
      adjuster_name: assigned adjuster
      date_of_injury: date of injury
      injured_body_part: body part as written on the referral
      compensability_status: compensability position at intake
      form_63_date: date of the Form 63 where the carrier pays without prejudice; empty otherwise
      physician_order_date: date of the treating physician's order; empty where none
      job_description_on_file: whether the employer's job description is on file
      fce_baseline_on_file: whether a completed FCE is on file
      incident_report_on_file: whether the employer's incident report is on file
    triggers: []
  - type: wc_activated
    target: wc_cases
    mutation: {transition: {from: referral_received, to: active}}
    meaning: Treatment under the referral starts.
    grain: one row per transaction
    fields:
      status: becomes active
    triggers: []
  - type: wc_suspended
    target: wc_cases
    mutation: {transition: {from: active, to: suspended}}
    meaning: Treatment is suspended for a recorded reason.
    grain: one row per transaction
    fields:
      status: becomes suspended
      suspend_reason: why treatment is suspended
      suspend_start_date: date the suspension began
    triggers: []
  - type: wc_reactivated
    target: wc_cases
    mutation: {transition: {from: suspended, to: active}}
    meaning: A suspended referral resumes.
    grain: one row per transaction
    fields:
      status: becomes active
      suspend_reason: cleared to none
    triggers: []
  - type: wc_discharged
    target: wc_cases
    mutation: {transition: [{from: active, to: discharged}, {from: suspended, to: discharged}]}
    meaning: The worker is discharged from the program.
    grain: one row per transaction
    fields:
      status: becomes discharged
      discharge_reason: why
      discharge_date: date of discharge
    triggers:
      - event: wc:wc_report_sent
        map: {report_kind: discharge_report}
  - type: wc_closed
    target: wc_cases
    mutation: {transition: [{from: discharged, to: closed}, {from: referral_received, to: closed}]}
    meaning: The referral is closed.
    grain: one row per transaction
    fields:
      status: becomes closed
      closed_date: date closed
    triggers: []
  - type: wc_compensability_updated
    target: wc_cases
    mutation: update
    meaning: The carrier's position on compensability changes (accepted, paid without prejudice, denied).
    grain: one row per transaction
    fields:
      compensability_status: new position
      form_63_date: Form 63 date where the new position is payment without prejudice
      compensability_date: date of the new position
    triggers: []
  - type: wc_work_status_updated
    target: wc_cases
    mutation: update
    meaning: The worker's work status on file changes.
    grain: one row per transaction
    fields:
      work_status: new work status
    triggers: []
  - type: wc_auth_recorded
    target: wc_cases
    mutation: update
    meaning: The referral's current adjuster authorization reference, end date and weekly frequency are updated to the newest authorization.
    grain: one row per transaction
    fields:
      auth_reference: authorization now in force
      auth_end_date: last date it covers
      authorized_visits_per_week: weekly frequency it allows
    triggers: []
  - type: wc_authorization_received
    target: wc_events
    meaning: The adjuster (or the employer contract) authorizes a number of visits or program days.
    grain: one row per authorization
    distinguish_by: [auth_reference, auth_start_date]
    fields:
      event_date: date received
      auth_reference: adjuster's authorization reference
      visits: visits or program days authorized
      visits_per_week: weekly frequency authorized
      auth_start_date: first date covered
      auth_end_date: last date covered
    account: wc_authorized_visits
    direction: in
    triggers:
      - event: wc:wc_auth_recorded
        map: {auth_reference: auth_reference, auth_end_date: auth_end_date}
  - type: wc_visit_billed
    target: wc_events
    meaning: An attended visit or program day under the referral is recorded against the authorization.
    grain: one row per date of service
    distinguish_by: [appointment_date]
    fields:
      event_date: date recorded
      appointment_date: date of service
      visits: authorized visits drawn (1, or 0 where none applies)
      units: billing units rendered that day
      auth_reference: authorization drawn on; empty where none
    account: wc_authorized_visits
    direction: out
    triggers:
      - event: wc:wc_charge_posted
        map: {appointment_date: appointment_date, units: units}
  - type: wc_charge_posted
    target: wc_events
    meaning: A charge for a date of service (evaluation, visit, program hours, FCE hours, or FCE no-show) is billed to the payer.
    grain: one row per charge per date of service
    distinguish_by: [charge_kind, appointment_date]
    fields:
      event_date: date posted
      appointment_date: date of service
      charge_kind: what is billed
      units: billing units
      amount: billed amount (positive)
      bill_submitted_date: date the bill was submitted to the payer
      payer_kind: who is billed
    account: wc_receivable
    direction: in
    triggers: []
  - type: wc_penalty_billed
    target: wc_events
    meaning: A late-payment penalty is billed to the carrier on a charge paid after the due period.
    grain: one row per penalized charge
    distinguish_by: [source_event_id]
    fields:
      event_date: date billed
      amount: penalty (positive)
      source_event_id: reference of the charge penalized
    account: wc_receivable
    direction: in
    triggers: []
  - type: wc_payment_posted
    target: wc_events
    meaning: A payment on a charge is received from the carrier, employer, health insurer or (for a denied claim) the worker.
    grain: one row per payment per charge
    distinguish_by: [source_event_id, payment_reference]
    fields:
      event_date: date received
      payer_kind: who paid
      payment_reference: EFT or check number exactly as on the remittance
      amount: amount paid (positive)
      source_event_id: reference of the charge paid
    account: wc_receivable
    direction: out
    triggers: []
  - type: wc_adjustment_posted
    target: wc_events
    meaning: A charge is reduced without payment (network discount, fee schedule reduction, untimely or unauthorized write-off, or rebilling of a denied claim to another payer).
    grain: one row per adjustment per charge
    distinguish_by: [adjustment_kind, source_event_id]
    fields:
      event_date: date adjusted
      adjustment_kind: why
      amount: amount removed (positive)
      source_event_id: reference of the charge adjusted
    account: wc_receivable
    direction: out
    triggers: []
  - type: wc_report_sent
    target: wc_events
    meaning: A report (initial evaluation, progress, work status, FCE or discharge) is sent to the adjuster or employer.
    grain: one row per report
    distinguish_by: [report_kind, event_date]
    fields:
      event_date: date sent
      report_kind: which report
    triggers: []
  - type: wc_missed_visit_reported
    target: wc_events
    meaning: A late cancellation or no-show by the worker is reported to the adjuster or employer.
    grain: one row per missed date of service
    distinguish_by: [appointment_date]
    fields:
      event_date: date reported
      appointment_date: date of the missed visit
      missed_kind: late cancellation or no-show
    triggers: []

measures:
  - id: wc_msr_claim_week_visits
    window: the Monday-to-Sunday week containing the date of service
    measure: count of wc_visit_billed rows across all of the worker's referrals with the same claim_number
  - id: wc_msr_consecutive_missed
    window: since the latest wc_visit_billed row on this referral (or since opening)
    measure: count of wc_missed_visit_reported rows on this referral
  - id: wc_msr_visits_total
    window: the whole life of the referral
    measure: count of wc_visit_billed rows on this referral

policies:
  - id: wc_agg_multi_holding
    subject: [wc_referral_opened]
    rule: >-
      A worker may hold any number of referrals over time, one per claim and program. A new referral is not opened when the worker already holds a referral that is not closed with the same claim number and the same program;
      a further program on the same claim (for example a Functional Capacity Evaluation during outpatient therapy, or
      Work Conditioning after it) is its own referral.
    eligibility:
      - id: no_duplicate_claim_program
        applies_to: [wc_referral_opened]
        kind: dedup
        condition: "A new referral is not opened when the worker already holds a referral that is not closed with the same claim number and the same program;"
        evidence_fields: [wc_cases.customer_id, wc_cases.claim_number, wc_cases.variant_name, wc_cases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_cases.claim_number, wc_cases.variant_name]
          action_bindings:
            wc_cases.claim_number: claim_number
            wc_cases.variant_name: variant_name
        dedup_contract:
          table: wc_cases
          mode: separate_record
          object_bindings: {customer_id: customer_id, claim_number: claim_number, variant_name: variant_name}
          duplicate_filters: {status: [referral_received, active, suspended, discharged]}
          distinct_fields: [opened_date]
    params:
      max_per_customer: null

  - id: wc_agg_claim_frequency
    subject: [wc_visit_billed]
    rule: >-
      All referrals under the same claim number share the adjuster's weekly frequency: the visits and program days
      billed in one Monday-to-Sunday week across those referrals (wc_msr_claim_week_visits) may not exceed the
      authorized_visits_per_week of the authorization in force, nor visits_per_week_max of the program. Only one
      referral under a claim bills a given date of service; a Functional Capacity Evaluation day replaces any therapy
      visit that day.
    eligibility: []
    measures: [wc_msr_claim_week_visits]

  - id: wc_referral_intake
    subject: [wc_referral_opened, wc_activated, wc_closed]
    rule: >-
      A referral is registered with the claim number, carrier, adjuster, employer and date of injury exactly as the
      carrier or employer gives them. Treatment starts only when the program's entry requirements are on file: the physician order where entry_requires_physician_order is true, the job description where entry_requires_job_description is true, a completed FCE where entry_requires_fce_baseline is true, and the incident report where employer_direct_requires_incident_report is true.
      Where return_to_work_goal_required is true the goal agreed with the employer is recorded at evaluation. Where
      adjuster_authorization_required is true, treatment beyond initial_visits_without_auth needs an authorization in
      force. A claim with compensability pending starts treatment only where treat_while_pending is true, and only for
      pending_claim_max_visits visits. A referral that never starts because the claim is denied, authorization is
      refused or the worker declines is closed.
    eligibility:
      - id: entry_requirements
        applies_to: [wc_activated]
        kind: authorization
        condition: "Treatment starts only when the program's entry requirements are on file: the physician order where entry_requires_physician_order is true, the job description where entry_requires_job_description is true, a completed FCE where entry_requires_fce_baseline is true, and the incident report where employer_direct_requires_incident_report is true."
        evidence_fields: [wc_cases.physician_order_date, wc_cases.job_description_on_file, wc_cases.fce_baseline_on_file, wc_cases.incident_report_on_file, wc_cases.wc_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_cases.wc_case_id]
          action_bindings:
            wc_cases.wc_case_id: wc_case_id

  - id: wc_compensability
    subject: [wc_compensability_updated]
    rule: >-
      Compensability follows the carrier's filed position: form_60_accepted, form_63_without_prejudice, form_61_denied
      or pending; employer direct programs carry not_applicable. A claim paid without prejudice is recorded as accepted no earlier than form_63_contest_days calendar days after the Form 63 date on file,
      and only when the carrier has not denied it by then. Days are counted as calendar days from the Form 63 date, the
      Form 63 date itself being day zero. A caller's statement that the claim was accepted never replaces the carrier's
      filed position.
    eligibility:
      - id: form_63_contest_elapsed
        applies_to: [wc_compensability_updated]
        kind: time
        condition: "A claim paid without prejudice is recorded as accepted no earlier than form_63_contest_days calendar days after the Form 63 date on file,"
        evidence_fields: [wc_cases.form_63_date, wc_cases.wc_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_cases.wc_case_id]
          action_bindings:
            wc_cases.wc_case_id: wc_case_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the Form 63 date on file
          anchor_source: wc_cases.form_63_date
          relation: not_before
          duration_source: variants.form_63_contest_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the Form 63 date, the Form 63 date itself being day zero."
          boundary: inclusive

  - id: wc_authorization
    subject: [wc_authorization_received, wc_auth_recorded, wc_visit_billed]
    rule: >-
      A visit or program day is recorded only while the referral is in referral_received or active status; only the
      initial evaluation is recorded in referral_received. Where adjuster_authorization_required is true, a date of service after the first initial_visits_without_auth visits is recorded against an authorization only when an adjuster authorization in force covers that date and still has visits remaining;
      a visit rendered without it draws nothing, is written off as unauthorized_visit_writeoff, and is never billed to
      the worker while unauthorized_visit_billable_to_worker is false. An extension is requested once remaining visits
      fall to auth_renewal_trigger_visits or fewer and no later than auth_extension_lead_days calendar days before the
      authorization end date, and a pending request is followed up after auth_followup_business_days business days. An
      employer direct program draws its visits from the employer contract up to direct_pay_visit_cap, after which the
      injury must be reported as a claim and treated under a new referral. Telehealth visits are recorded only where
      telehealth_allowed is true. The referral's authorization reference, end date and weekly frequency follow the
      newest authorization received.
    eligibility:
      - id: wc_billable_status
        applies_to: [wc_visit_billed]
        kind: state
        condition: "A visit or program day is recorded only while the referral is in referral_received or active status;"
        evidence_fields: [wc_cases.status, wc_cases.wc_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_cases.wc_case_id]
          action_bindings:
            wc_cases.wc_case_id: wc_case_id
        state_contract:
          field: wc_cases.status
          allowed: [referral_received, active]
      - id: adjuster_authorization_covers
        applies_to: [wc_visit_billed]
        kind: authorization
        condition: "Where adjuster_authorization_required is true, a date of service after the first initial_visits_without_auth visits is recorded against an authorization only when an adjuster authorization in force covers that date and still has visits remaining;"
        evidence_fields: [wc_events.auth_reference, wc_events.auth_start_date, wc_events.auth_end_date, wc_cases.authorized_visits_remaining]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_events.auth_reference]
          action_bindings:
            wc_events.auth_reference: auth_reference
    measures: [wc_msr_visits_total]

  - id: wc_evt_charges
    subject: [wc_charge_posted]
    rule: >-
      Charges follow fee_basis. The initial evaluation is billed at evaluation_rate where it is above 0.00; each later
      date of service is billed as unit_rate times the billing units, with units counted in billing_unit and capped at
      max_billable_units_per_day (and, for hour-billed programs, between program_hours_per_day_min and
      program_hours_per_day_max). A missed Functional Capacity Evaluation is billed to the carrier at fce_no_show_fee
      only where fce_no_show_billable_to_carrier is true. An accepted or without-prejudice claim is billed to the carrier, and a direct-pay program to the employer every employer_invoice_cycle_days calendar days;
      the worker is never billed for a compensable claim while patient_billing_prohibited_if_compensable is true. A bill
      is submitted no later than bill_submission_deadline_days calendar days after the date of service; a later bill is
      written off as untimely_bill_writeoff and is never billed to anyone while untimely_bill_payable is false.
    eligibility:
      - id: compensable_payer
        applies_to: [wc_charge_posted]
        kind: authorization
        condition: "An accepted or without-prejudice claim is billed to the carrier, and a direct-pay program to the employer every employer_invoice_cycle_days calendar days;"
        evidence_fields: [wc_cases.compensability_status, wc_cases.wc_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_cases.wc_case_id]
          action_bindings:
            wc_cases.wc_case_id: wc_case_id
    params:
      per_tier:
        Employer Direct Early Intervention: {unit_rate: "=unit_rate", evaluation_rate: "=evaluation_rate", max_billable_units_per_day: "=max_billable_units_per_day"}
        Workers' Comp Outpatient Therapy: {unit_rate: "=unit_rate", evaluation_rate: "=evaluation_rate", max_billable_units_per_day: "=max_billable_units_per_day"}
        Workers' Comp Post-Surgical Therapy: {unit_rate: "=unit_rate", evaluation_rate: "=evaluation_rate", max_billable_units_per_day: "=max_billable_units_per_day"}
        Work Conditioning Program: {unit_rate: "=unit_rate", evaluation_rate: "=evaluation_rate", max_billable_units_per_day: "=max_billable_units_per_day"}
        Work Hardening Program: {unit_rate: "=unit_rate", evaluation_rate: "=evaluation_rate", max_billable_units_per_day: "=max_billable_units_per_day"}
        Functional Capacity Evaluation: {unit_rate: "=unit_rate", evaluation_rate: "=evaluation_rate", max_billable_units_per_day: "=max_billable_units_per_day"}
    formula:
      billed_units: min(units, max_billable_units_per_day)
      amount: evaluation_rate if charge_kind == "evaluation" else (fce_no_show_fee if charge_kind == "fce_no_show" else unit_rate * billed_units)

  - id: wc_evt_payments_and_penalties
    subject: [wc_payment_posted, wc_adjustment_posted, wc_penalty_billed]
    rule: >-
      A payment is applied to the charge named on the remittance. At payment the carrier's network discount of
      network_discount_percent of the billed amount is posted as network_discount, and any further reduction to the fee
      schedule amount as fee_schedule_reduction; reconsideration of a reduction or denial may be requested within
      bill_reconsideration_days calendar days of the payment. A late-payment penalty is billed only when the carrier pays a charge later than carrier_payment_due_days calendar days after the bill submitted date on file;
      it equals late_payment_penalty_percent of the charge's billed amount less its network discount, rounded to the cent. Days are counted as
      calendar days from the bill submitted date, the bill submitted date itself being day zero. Unpaid bills are followed
      up receivable_followup_days calendar days after submission. When a claim is denied (form_61_denied) and
      denied_claim_bill_health_plan is true, its open charges are removed as denied_claim_rebilled and the treatment is
      rebilled to the worker's health insurance within health_plan_rebill_days calendar days; only after that insurer
      adjudicates may any balance be billed to the worker.
    eligibility:
      - id: payment_late
        applies_to: [wc_penalty_billed]
        kind: time
        condition: "A late-payment penalty is billed only when the carrier pays a charge later than carrier_payment_due_days calendar days after the bill submitted date on file;"
        evidence_fields: [wc_events.bill_submitted_date, wc_events.wc_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_events.wc_event_id]
          action_bindings:
            wc_events.wc_event_id: source_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the bill submitted date on file
          anchor_source: wc_events.bill_submitted_date
          relation: not_before
          duration_source: variants.carrier_payment_due_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the bill submitted date, the bill submitted date itself being day zero."
          boundary: exclusive
    formula:
      network_discount: round(amount * network_discount_percent / 100, 2)
      penalty: round((amount - round(amount * network_discount_percent / 100, 2)) * late_payment_penalty_percent / 100, 2)

  - id: wc_reporting
    subject: [wc_report_sent, wc_missed_visit_reported, wc_work_status_updated]
    rule: >-
      The initial evaluation report (or the FCE report) is sent within initial_report_due_business_days business days;
      progress reports go out at least every progress_report_interval_days calendar days while treatment continues;
      where work_status_report_each_visit is true a work status update follows every program day; and the discharge
      report is sent within discharge_report_days calendar days after discharge. Every report is copied to the nurse case
      manager where nurse_case_manager_copy is true. A late cancellation or no-show is reported within
      missed_visit_report_business_days business days, and no fee is charged to the worker while
      injured_worker_missed_fee_billable is false. The work status on file changes only on the treating physician's
      written restrictions, never on the worker's or employer's say-so.
    eligibility: []

  - id: wc_suspension_and_discharge
    subject: [wc_suspended, wc_reactivated, wc_discharged]
    rule: >-
      Treatment is suspended when the authorization lapses, when the claim is denied, when the pending-claim visit
      allowance is used, or when wc_msr_consecutive_missed reaches missed_visits_before_adjuster_review
      (non-compliance review). It resumes when the reason is resolved. A suspended referral is discharged no earlier than suspension_max_days calendar days after the suspension start date on file.
      Days are counted as calendar days from the suspension start date, the suspension start date itself being day
      zero. A program that reaches program_length_weeks_max weeks from its first date of service is discharged.
    eligibility:
      - id: suspension_aged
        applies_to: [wc_discharged]
        kind: time
        condition: "A suspended referral is discharged no earlier than suspension_max_days calendar days after the suspension start date on file."
        evidence_fields: [wc_cases.suspend_start_date, wc_cases.wc_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_cases.wc_case_id]
          action_bindings:
            wc_cases.wc_case_id: wc_case_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the suspension start date on file
          anchor_source: wc_cases.suspend_start_date
          relation: not_before
          duration_source: variants.suspension_max_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the suspension start date, the suspension start date itself being day zero."
          boundary: inclusive
    measures: [wc_msr_consecutive_missed]

  - id: wc_employer_direct
    subject: [wc_referral_opened, wc_charge_posted, wc_payment_posted]
    rule: >-
      An employer direct program is opened only from the employer's incident report and under the employer's contract;
      it covers first-aid-level care only where osha_first_aid_only is true, never files a claim with a carrier, and is
      invoiced to the employer every employer_invoice_cycle_days calendar days with payment due carrier_payment_due_days
      calendar days after the invoice. Once the worker has used direct_pay_visit_cap visits (wc_msr_visits_total),
      or needs care beyond first aid, the employer must report the injury to its carrier and further care is a new
      Workers' Comp Outpatient Therapy referral.
    eligibility: []
    measures: [wc_msr_visits_total]
