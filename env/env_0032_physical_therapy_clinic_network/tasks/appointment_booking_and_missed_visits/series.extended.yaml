- id: series_ext_late_arrival_fee
  base_policy_refs:
  - series_evt_missed_visit_fees
  overwrite:
  - base_policy: series_evt_missed_visit_fees
    superseded_clause: A late cancellation is charged late_cancel_fee and a no-show is charged no_show_fee of the series'
      format.
    replaced_by: >-
      The late-arrival fee is the late-arrival basis multiplied by the late-arrival lateness share, the late-arrival repeat
      share, the late-arrival package-forfeit share, the late-arrival hardship share and the late-arrival new-series share,
      each share read as a percentage of the basis.
  trigger: state_due
  subject:
  - series_fee_assessed
  computes: amount
  target_tool: assess_late_arrival_fee_e6f6ddb6
  params:
    la_package_cash_share_pct: 50
    la_near_grace_minutes: 10
    la_near_grace_pct: 50
    la_far_grace_minutes: 20
    la_mid_grace_pct: 75
    la_two_prior_fees_pct: 150
    la_one_prior_fee_pct: 125
    la_two_forfeits_pct: 150
    la_one_forfeit_pct: 125
    la_full_hardship_level: 75
    la_new_series_days: 14
    la_young_series_days: 28
    la_new_series_pct: 75
    la_young_series_pct: 90
  rule: >-
    A late-arrival fee is charged where, on a format whose late_arrival_beyond_grace_treated_as is late_cancellation, the
    patient reached a booked appointment later than grace_minutes_late_arrival after its start, so that the visit was not
    held; the arrival is recorded as a cancellation with zero hours of notice that carries the minutes late, the fee is
    charged under the kind named by late_arrival_beyond_grace_treated_as, and it is worked out on the most recent such zero-notice
    entry on the series. On a format whose late_arrival_beyond_grace_treated_as is no_show, a late arrival is recorded as
    a no-show carrying the minutes late and is charged as a no-show, outside this fee. Before any adjustment, the late-arrival
    fee is late_cancel_fee of the series' format, rounded to the nearest cent. The late-arrival fee is fixed only after
    a no-show recorded on the series' first appointment within its fee assessment period carries its first-appointment no-show
    fee entry. The late-arrival basis follows the funding of the series: where the series is funded by a Self-Pay Visit
    Package whose tier lists a single_visit_cash_rate above zero, the basis is la_package_cash_share_pct percent of that
    single_visit_cash_rate; where the series is funded by an Insured Plan of Care whose verified copay is above zero, the
    basis is the lesser of late_cancel_fee and that copay; for any other series the basis is late_cancel_fee. The late-arrival
    lateness share is la_near_grace_pct percent where the patient arrived no more than la_near_grace_minutes minutes beyond
    the grace period, la_mid_grace_pct percent where the patient arrived more than la_near_grace_minutes but no more than
    la_far_grace_minutes minutes beyond the grace period, and 100 percent where the patient arrived more than la_far_grace_minutes
    minutes beyond the grace period. The late-arrival repeat share is la_two_prior_fees_pct percent where the series already
    shows two or more missed-visit fees assessed in the two months up to the assessment date (an entry counts when fewer
    than two whole months separate its date from the assessment date), la_one_prior_fee_pct percent where it shows exactly
    one such fee, and 100 percent where it shows none. The late-arrival package-forfeit share is la_two_forfeits_pct percent
    where the patient's Self-Pay Visit Package history shows two or more package visits forfeited for missed appointments
    in the three months up to the assessment date (an entry counts when fewer than three whole months separate its date
    from the assessment date), la_one_forfeit_pct percent where it shows exactly one, and 100 percent where it shows none.
    The late-arrival hardship share is 0 percent where the patient holds an approved hardship determination whose effective
    date has arrived and whose expiry date has not passed at a level whose discount_percent is la_full_hardship_level or
    more, 100 percent less the level's discount_percent where such an approved determination in force discounts more than
    zero but less than la_full_hardship_level percent, and 100 percent where no approved determination is in force. The
    late-arrival new-series share is la_new_series_pct percent where the series start date is no more than la_new_series_days
    calendar days before the assessment date, la_young_series_pct percent where it is more than la_new_series_days but no
    more than la_young_series_days days before, and 100 percent where it is more than la_young_series_days days before.
    The late-arrival fee is the late-arrival basis multiplied by the late-arrival lateness share, the late-arrival repeat
    share, the late-arrival package-forfeit share, the late-arrival hardship share and the late-arrival new-series share,
    each share read as a percentage of the basis. Each of the five late-arrival shares multiplies that single basis, so
    their sequence leaves the fee unchanged, and rounding to the nearest cent happens only once, on the final product.
  prerequisite:
  - problem: series_ext_first_visit_no_show_fee
    kind: value_input
    gate: la_prior_fees
    form: state
    policy_source: >-
      The late-arrival fee is fixed only after a no-show recorded on the series' first appointment within its fee assessment
      period carries its first-appointment no-show fee entry.
    condition: >-
      Where the series shows a series_no_show entry dated on the series start date whose appointment date lies no more than
      fee_assessment_days calendar days before the handling date, a series_fee_assessed entry of fee_kind no_show points
      at it through source_event_id.
    resolved_by: assess_first_visit_no_show_fee_a4cbc15c
    effect: >-
      The first-appointment no-show fee entry adds one to the missed-visit fees assessed on the series in the two months
      up to the assessment date, which moves the late-arrival repeat share up a tier.
  cross_category:
  - category: package
    as: branch
    reads:
    - single_visit_cash_rate
    - package_events.event_type
    note: >-
      The late-arrival basis reads the funding package tier's cash rate; the package-forfeit share counts forfeited package
      visits.
  - category: plan
    as: branch
    reads:
    - copay_amount
    note: The late-arrival basis reads the verified copay where an Insured Plan of Care funds the series.
  - category: hardship
    as: branch
    reads:
    - status
    - effective_date
    - expiry_date
    - discount_percent
    note: The late-arrival hardship share reads the patient's approved hardship determination.
  compute:
  - la_minutes: >-
      LATEST('series_events', 'minutes_late', date_field='appointment_date', event_type='series_visit_cancelled', notice_hours=0)
      or 0
  - la_schedule_fee: P('late_cancel_fee')
  - la_cash_rate: CPARAM('package', 'single_visit_cash_rate', package_id=F('package_id')) or 0
  - la_copay: CFIELD('plan', 'copay_amount', care_plan_id=F('care_plan_id')) or 0
  - la_base: >-
      la_cash_rate * K('la_package_cash_share_pct') / 100 if (F('funding_source') == 'self_pay_package' and la_cash_rate
      > 0) else (MN(la_schedule_fee, la_copay) if (F('funding_source') == 'insurance_plan' and la_copay > 0) else la_schedule_fee)
  - la_lateness_pct: >-
      K('la_near_grace_pct') if la_minutes <= P('grace_minutes_late_arrival') + K('la_near_grace_minutes') else (K('la_mid_grace_pct')
      if la_minutes <= P('grace_minutes_late_arrival') + K('la_far_grace_minutes') else 100)
  - la_prior_fees: COUNT('series_events', within_months=2, event_type='series_fee_assessed')
  - la_repeat_pct: >-
      K('la_two_prior_fees_pct') if la_prior_fees >= 2 else (K('la_one_prior_fee_pct') if la_prior_fees == 1 else 100)
  - la_forfeits: XCOUNT('package', 'package_events', within_months=3, event_type='package_visit_forfeited')
  - la_forfeit_pct: K('la_two_forfeits_pct') if la_forfeits >= 2 else (K('la_one_forfeit_pct') if la_forfeits == 1 else
      100)
  - la_hs_effective: CFIELD('hardship', 'effective_date', status='approved') or '2999-12-31'
  - la_hs_expiry: CFIELD('hardship', 'expiry_date', status='approved') or '1900-01-01'
  - la_hs_level: CPARAM('hardship', 'discount_percent', status='approved') or 0
  - la_hardship_pct: >-
      0 if (DAYS(la_hs_effective, NOW) >= 0 and DAYS(NOW, la_hs_expiry) >= 0 and la_hs_level >= K('la_full_hardship_level'))
      else ((100 - la_hs_level) if (DAYS(la_hs_effective, NOW) >= 0 and DAYS(NOW, la_hs_expiry) >= 0 and la_hs_level > 0)
      else 100)
  - la_series_days: DAYS(F('series_start_date'), NOW)
  - la_new_series_pct: >-
      K('la_new_series_pct') if la_series_days <= K('la_new_series_days') else (K('la_young_series_pct') if la_series_days
      <= K('la_young_series_days') else 100)
  - result: >-
      RND(la_base * la_lateness_pct / 100 * la_repeat_pct / 100 * la_forfeit_pct / 100 * la_hardship_pct / 100 * la_new_series_pct
      / 100, 2)
  compute_basis:
    la_minutes: it is worked out on the most recent such zero-notice entry on the series.
    la_schedule_fee: >-
      Before any adjustment, the late-arrival fee is late_cancel_fee of the series' format, rounded to the nearest cent.
    la_cash_rate: >-
      where the series is funded by a Self-Pay Visit Package whose tier lists a single_visit_cash_rate above zero, the basis
      is la_package_cash_share_pct percent of that single_visit_cash_rate;
    la_copay: >-
      where the series is funded by an Insured Plan of Care whose verified copay is above zero, the basis is the lesser
      of late_cancel_fee and that copay;
    la_base: >-
      The late-arrival basis follows the funding of the series: where the series is funded by a Self-Pay Visit Package whose
      tier lists a single_visit_cash_rate above zero, the basis is la_package_cash_share_pct percent of that single_visit_cash_rate;
      where the series is funded by an Insured Plan of Care whose verified copay is above zero, the basis is the lesser
      of late_cancel_fee and that copay; for any other series the basis is late_cancel_fee.
    la_lateness_pct: >-
      The late-arrival lateness share is la_near_grace_pct percent where the patient arrived no more than la_near_grace_minutes
      minutes beyond the grace period, la_mid_grace_pct percent where the patient arrived more than la_near_grace_minutes
      but no more than la_far_grace_minutes minutes beyond the grace period, and 100 percent where the patient arrived more
      than la_far_grace_minutes minutes beyond the grace period.
    la_prior_fees: >-
      where the series already shows two or more missed-visit fees assessed in the two months up to the assessment date
      (an entry counts when fewer than two whole months separate its date from the assessment date),
    la_repeat_pct: >-
      The late-arrival repeat share is la_two_prior_fees_pct percent where the series already shows two or more missed-visit
      fees assessed in the two months up to the assessment date (an entry counts when fewer than two whole months separate
      its date from the assessment date), la_one_prior_fee_pct percent where it shows exactly one such fee, and 100 percent
      where it shows none.
    la_forfeits: >-
      where the patient's Self-Pay Visit Package history shows two or more package visits forfeited for missed appointments
      in the three months up to the assessment date (an entry counts when fewer than three whole months separate its date
      from the assessment date),
    la_forfeit_pct: >-
      The late-arrival package-forfeit share is la_two_forfeits_pct percent where the patient's Self-Pay Visit Package history
      shows two or more package visits forfeited for missed appointments in the three months up to the assessment date (an
      entry counts when fewer than three whole months separate its date from the assessment date), la_one_forfeit_pct percent
      where it shows exactly one, and 100 percent where it shows none.
    la_hs_effective: >-
      where the patient holds an approved hardship determination whose effective date has arrived and whose expiry date
      has not passed
    la_hs_expiry: >-
      where the patient holds an approved hardship determination whose effective date has arrived and whose expiry date
      has not passed
    la_hs_level: >-
      at a level whose discount_percent is la_full_hardship_level or more, 100 percent less the level's discount_percent
    la_hardship_pct: >-
      The late-arrival hardship share is 0 percent where the patient holds an approved hardship determination whose effective
      date has arrived and whose expiry date has not passed at a level whose discount_percent is la_full_hardship_level
      or more, 100 percent less the level's discount_percent where such an approved determination in force discounts more
      than zero but less than la_full_hardship_level percent, and 100 percent where no approved determination is in force.
    la_series_days: where the series start date is no more than la_new_series_days calendar days before the assessment date,
    la_new_series_pct: >-
      The late-arrival new-series share is la_new_series_pct percent where the series start date is no more than la_new_series_days
      calendar days before the assessment date, la_young_series_pct percent where it is more than la_new_series_days but
      no more than la_young_series_days days before, and 100 percent where it is more than la_young_series_days days before.
    result: >-
      Each of the five late-arrival shares multiplies that single basis, so their sequence leaves the fee unchanged, and
      rounding to the nearest cent happens only once, on the final product.
  factors:
  - id: late_arrival_basis
    effect: method
    decides: la_base
    bindings:
    - la_cash_rate
    - la_copay
    - la_base
    ladder:
    - when: the series is funded by a Self-Pay Visit Package whose tier lists a single_visit_cash_rate above zero
      method: the late-arrival basis is la_package_cash_share_pct percent of the package tier's single_visit_cash_rate
    - when: the series is funded by an Insured Plan of Care whose verified copay is above zero
      method: the late-arrival basis is the lesser of late_cancel_fee and the verified copay
    - when: otherwise
      method: the late-arrival basis is late_cancel_fee of the series' format
