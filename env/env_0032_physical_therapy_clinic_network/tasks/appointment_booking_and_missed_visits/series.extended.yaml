    ladder:
    - when: the patient arrived no more than la_near_grace_minutes minutes beyond the grace period
      value: K('la_near_grace_pct')
    - when: more than la_near_grace_minutes but no more than la_far_grace_minutes minutes beyond the grace period
      value: K('la_mid_grace_pct')
    - when: otherwise (more than la_far_grace_minutes minutes beyond the grace period)
