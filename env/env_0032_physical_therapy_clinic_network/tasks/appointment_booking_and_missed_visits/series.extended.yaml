    - when: >-
        an approved hardship determination is in force (effective date arrived and expiry date not passed) and its level's
        discount_percent is lc_full_hardship_level or more
      value: '0'
    - when: >-
        an approved hardship determination is in force and its level's discount_percent is above zero but below lc_full_hardship_level
