    decides: lc_reason_pct
    bindings:
    - lc_reason
    - lc_reason_pct
    ladder:
    - when: the recorded reason is patient_illness or family_emergency
      value: K('lc_illness_pct')
    - when: the recorded reason is transportation or weather
      value: K('lc_travel_pct')
    - when: otherwise
      value: '100'
    baseline:
      lc_reason_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: late_cancellation_attendance_share
    effect: parameter
    decides: lc_tenure_pct
    bindings:
    - lc_attended
    - lc_tenure_pct
    ladder:
    - when: the series shows at least lc_long_tenure_visits attended appointments
      value: K('lc_long_tenure_pct')
    - when: the series shows at least lc_short_tenure_visits but fewer than lc_long_tenure_visits attended appointments
      value: K('lc_short_tenure_pct')
    - when: otherwise
      value: '100'
    baseline:
      lc_tenure_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: late_cancellation_membership_miss_share
    effect: parameter
    decides: lc_member_pct
    bindings:
    - lc_member_misses
    - lc_member_pct
    ladder:
    - when: >-
        two or more maintenance sessions forfeited on the patient's wellness membership in the three months up to the assessment
        date
      value: K('lc_two_member_misses_pct')
    - when: exactly one such forfeited maintenance session
      value: K('lc_one_member_miss_pct')
    - when: otherwise
      value: '100'
    baseline:
      lc_member_pct: '100'
    evidence:
    - cross_category
    - history
    cross_difficulty: membership
  - id: late_cancellation_hardship_share
    effect: parameter
    decides: lc_hardship_pct
    bindings:
    - lc_hs_effective
    - lc_hs_expiry
    - lc_hs_level
    - lc_hardship_pct
