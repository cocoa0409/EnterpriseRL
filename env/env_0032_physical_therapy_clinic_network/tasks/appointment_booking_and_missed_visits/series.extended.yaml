- id: series_ext_no_show_fee
  base_policy_refs:
  - series_evt_missed_visit_fees
  overwrite:
  - base_policy: series_evt_missed_visit_fees
    superseded_clause: A late cancellation is charged late_cancel_fee and a no-show is charged no_show_fee of the series'
      format.
    replaced_by: >-
      The no-show fee is the no-show basis multiplied by the no-show repeat share, the no-show slot share, the no-show attendance
      share, the no-show membership-miss share and the no-show hardship share, each share read as a percentage of the basis.
  trigger: state_due
  subject:
  - series_fee_assessed
  computes: amount
  target_tool: assess_no_show_fee_93f38688
  params:
    ns_package_cash_share_pct: 50
    ns_two_prior_fees_pct: 150
    ns_one_prior_fee_pct: 125
    ns_peak_slot_pct: 120
    ns_shoulder_slot_pct: 110
    ns_long_tenure_visits: 8
    ns_short_tenure_visits: 4
    ns_long_tenure_pct: 90
    ns_short_tenure_pct: 95
    ns_two_member_misses_pct: 150
    ns_one_member_miss_pct: 125
    ns_full_hardship_level: 75
  rule: >-
    A no-show fee is charged for a booked appointment, other than the first appointment of the series, that the patient
    neither attended nor cancelled, and it is worked out on the most recent no-show recorded on the series, the one with
    the latest appointment date. Before any adjustment, the no-show fee is no_show_fee of the series' format, rounded to
    the nearest cent. The no-show fee is fixed only after every late cancellation received before its appointment day and
    recorded on the series within its fee assessment period carries its late-cancellation fee entry. The no-show basis follows
    the funding of the series: where the series is funded by an Insured Plan of Care whose verified copay is above zero,
    the basis is the lesser of no_show_fee and that copay; where the series is funded by a Self-Pay Visit Package whose
    tier lists a single_visit_cash_rate above zero, the basis is ns_package_cash_share_pct percent of that single_visit_cash_rate;
    for any other series the basis is no_show_fee. The no-show repeat share is ns_two_prior_fees_pct percent where the series
    already shows two or more missed-visit fees assessed in the two months up to the assessment date (an entry counts when
    fewer than two whole months separate its date from the assessment date), ns_one_prior_fee_pct percent where it shows
    exactly one such fee, and 100 percent where it shows none. The no-show slot share is ns_peak_slot_pct percent where
    the missed appointment started before 08:00 or at 17:00 or later, ns_shoulder_slot_pct percent where it started from
    08:00 up to but not including 10:00 or from 15:00 up to but not including 17:00, and 100 percent where it started from
    10:00 up to but not including 15:00. The no-show attendance share is ns_long_tenure_pct percent where the series shows
    at least ns_long_tenure_visits attended appointments, ns_short_tenure_pct percent where it shows at least ns_short_tenure_visits
    but fewer than ns_long_tenure_visits attended appointments, and 100 percent where it shows fewer than ns_short_tenure_visits.
    The no-show membership-miss share is ns_two_member_misses_pct percent where the patient's wellness membership history
    shows two or more maintenance sessions forfeited in the three months up to the assessment date (an entry counts when
    fewer than three whole months separate its date from the assessment date), ns_one_member_miss_pct percent where it shows
    exactly one such forfeited session, and 100 percent where it shows none. The no-show hardship share is 0 percent where
    the patient holds an approved hardship determination whose effective date has arrived and whose expiry date has not
    passed at a level whose discount_percent is ns_full_hardship_level or more, 100 percent less the level's discount_percent
    where such an approved determination in force discounts more than zero but less than ns_full_hardship_level percent,
    and 100 percent where no approved determination is in force. The no-show fee is the no-show basis multiplied by the
    no-show repeat share, the no-show slot share, the no-show attendance share, the no-show membership-miss share and the
    no-show hardship share, each share read as a percentage of the basis. The five no-show shares all multiply the same
    basis, so their order makes no difference, and the product is rounded to the nearest cent a single time, at the end.
  prerequisite:
  - problem: series_ext_late_cancellation_fee
    kind: value_input
    gate: ns_prior_fees
    form: state
    policy_source: >-
      The no-show fee is fixed only after every late cancellation received before its appointment day and recorded on the
      series within its fee assessment period carries its late-cancellation fee entry.
    condition: >-
      Every series_visit_cancelled entry on the series that is a late cancellation received before its appointment day (event_date
      earlier than appointment_date, notice below late_cancel_notice_hours, not cancelled by the clinic) and whose appointment
      date lies no more than fee_assessment_days calendar days before the handling date has a series_fee_assessed entry
      of fee_kind late_cancellation whose source_event_id points at it.
    resolved_by: assess_late_cancellation_fee_706e910e
    effect: >-
      Once the late-cancellation fee entry stands, the count of missed-visit fees assessed on the series in the two months
      up to the assessment date rises by one, which moves the no-show repeat share up a tier.
  cross_category:
  - category: plan
    as: branch
    reads:
    - copay_amount
    note: The no-show basis reads the verified copay of the Insured Plan of Care funding the series.
  - category: package
    as: branch
    reads:
    - single_visit_cash_rate
    note: The no-show basis reads the cash rate of the Self-Pay Visit Package tier funding the series.
  - category: membership
    as: history
    reads:
    - membership_events.event_type
    note: The no-show membership-miss share counts the patient's forfeited maintenance sessions.
  - category: hardship
    as: branch
    reads:
    - status
    - effective_date
    - expiry_date
    - discount_percent
    note: The no-show hardship share reads the patient's approved hardship determination.
  compute:
  - ns_time: >-
      LATEST('series_events', 'appointment_time', date_field='appointment_date', event_type='series_no_show') or '12:00'
  - ns_copay: CFIELD('plan', 'copay_amount', care_plan_id=F('care_plan_id')) or 0
  - ns_cash_rate: CPARAM('package', 'single_visit_cash_rate', package_id=F('package_id')) or 0
  - ns_base: >-
      MN(P('no_show_fee'), ns_copay) if (F('funding_source') == 'insurance_plan' and ns_copay > 0) else (ns_cash_rate *
      K('ns_package_cash_share_pct') / 100 if (F('funding_source') == 'self_pay_package' and ns_cash_rate > 0) else P('no_show_fee'))
  - ns_prior_fees: COUNT('series_events', within_months=2, event_type='series_fee_assessed')
  - ns_repeat_pct: >-
      K('ns_two_prior_fees_pct') if ns_prior_fees >= 2 else (K('ns_one_prior_fee_pct') if ns_prior_fees == 1 else 100)
  - ns_slot_pct: >-
      K('ns_peak_slot_pct') if (ns_time < '08:00' or ns_time >= '17:00') else (K('ns_shoulder_slot_pct') if (ns_time < '10:00'
      or ns_time >= '15:00') else 100)
  - ns_attended: COUNT('series_events', event_type='series_visit_attended')
  - ns_tenure_pct: >-
      K('ns_long_tenure_pct') if ns_attended >= K('ns_long_tenure_visits') else (K('ns_short_tenure_pct') if ns_attended
      >= K('ns_short_tenure_visits') else 100)
  - ns_member_misses: XCOUNT('membership', 'membership_events', within_months=3, event_type='membership_session_forfeited')
  - ns_member_pct: >-
      K('ns_two_member_misses_pct') if ns_member_misses >= 2 else (K('ns_one_member_miss_pct') if ns_member_misses == 1
      else 100)
  - ns_hs_effective: CFIELD('hardship', 'effective_date', status='approved') or '2999-12-31'
  - ns_hs_expiry: CFIELD('hardship', 'expiry_date', status='approved') or '1900-01-01'
  - ns_hs_level: CPARAM('hardship', 'discount_percent', status='approved') or 0
  - ns_hardship_pct: >-
      0 if (DAYS(ns_hs_effective, NOW) >= 0 and DAYS(NOW, ns_hs_expiry) >= 0 and ns_hs_level >= K('ns_full_hardship_level'))
      else ((100 - ns_hs_level) if (DAYS(ns_hs_effective, NOW) >= 0 and DAYS(NOW, ns_hs_expiry) >= 0 and ns_hs_level > 0)
      else 100)
  - result: >-
      RND(ns_base * ns_repeat_pct / 100 * ns_slot_pct / 100 * ns_tenure_pct / 100 * ns_member_pct / 100 * ns_hardship_pct
      / 100, 2)
  compute_basis:
