events:
  - type: series_opened
    target: appointment_series
    mutation: create
    meaning: A new appointment series is set up with its visit format, therapist, standing slot pattern and funding source.
    grain: one row per appointment series
    fields:
      series_id: reference number of the new series
      customer_id: the patient
      variant_name: visit format tier
      opened_date: date the series was set up
      clinic_name: clinic where the appointments take place
      therapist_name: assigned therapist
      funding_source: what pays for the visits
      care_plan_id: funding plan of care where funding_source is insurance_plan; empty otherwise
      package_id: funding visit package where funding_source is self_pay_package; empty otherwise
      wc_case_id: funding workers' compensation referral where funding_source is workers_comp; empty otherwise
      membership_id: funding wellness membership where funding_source is membership; empty otherwise
      weekday_pattern: standing weekday and time pattern exactly as booked
      visits_per_week: standing appointments per week
      series_start_date: date of the first appointment
      series_end_date: date of the last appointment the series may run to
      surgery_date: surgery date for a post-operative series; empty otherwise
      clearance_date: date of the pre-visit clearance on file; empty where none
      card_on_file: whether a payment card is on file
    triggers:
      - event: series:series_visits_booked
        map: {booking_channel: front_desk}
  - type: series_activated
    target: appointment_series
    mutation: {transition: {from: booked, to: active}}
    meaning: The series becomes active at the patient's first attended appointment.
    grain: one row per transaction
    fields:
      status: becomes active
    triggers: []
  - type: series_funding_changed
    target: appointment_series
    mutation: update
    meaning: The funding source of the series' future appointments is switched (for example a visit package is used up and the patient's insurance plan of care takes over).
    grain: one row per transaction
    fields:
      funding_source: new funding source
      care_plan_id: new funding plan of care, or empty
      package_id: new funding package, or empty
      wc_case_id: new funding workers' compensation referral, or empty
      membership_id: new funding membership, or empty
    triggers: []
  - type: series_restriction_updated
    target: appointment_series
    mutation: update
    meaning: A same-day-only booking restriction is placed on, or lifted from, the patient's series.
    grain: one row per transaction
    fields:
      booking_restriction: restriction now in force
      restriction_end_date: last day of the restriction, or empty when lifted
    triggers: []
  - type: series_paused
    target: appointment_series
    mutation: {transition: {from: active, to: paused}}
    meaning: The series is paused and its standing slots are suspended.
    grain: one row per transaction
    fields:
      status: becomes paused
      pause_reason: why the series was paused
      pause_start_date: date the pause began
      pauses_used: pauses taken on the series including this one
    triggers: []
  - type: series_resumed
    target: appointment_series
    mutation: {transition: {from: paused, to: active}}
    meaning: A paused series resumes.
    grain: one row per transaction
    fields:
      status: becomes active
      pause_reason: cleared to none
    triggers: []
  - type: series_completed
    target: appointment_series
    mutation: {transition: {from: active, to: completed}}
    meaning: The series ends normally.
    grain: one row per transaction
    fields:
      status: becomes completed
      close_reason: why the series ended
      closed_date: date it ended
    triggers: []
  - type: series_cancelled
    target: appointment_series
    mutation: {transition: [{from: booked, to: cancelled}, {from: active, to: cancelled}, {from: paused, to: cancelled}]}
    meaning: The series is cancelled before its natural end.
    grain: one row per transaction
    fields:
      status: becomes cancelled
      close_reason: why the series was cancelled
      closed_date: date it was cancelled
    triggers:
      - event: series:series_visits_released
        map: {release_reason: series_cancelled}
  - type: series_visits_booked
    target: series_events
    meaning: A batch of appointments is booked on the series' standing slots.
    grain: one row per booking (one batch of consecutive standing appointments)
    distinguish_by: [appointment_date, event_date]
    fields:
      event_date: date the booking was made
      appointment_date: date of the first appointment in the batch
      visits: number of appointments booked
      booking_channel: where the booking was made
      funding_source: funding source the appointments are booked under
    account: scheduled_visits
    direction: in
    triggers: []
  - type: series_visit_attended
    target: series_events
    meaning: The patient attends one booked appointment.
    grain: one row per attended appointment
    distinguish_by: [appointment_date]
    fields:
      event_date: date recorded
      appointment_date: date of the appointment
      appointment_time: scheduled start time
      minutes_late: minutes after the start time the patient arrived (0 when on time)
      funding_source: funding source the visit is charged to
      visits: appointments drawn (always 1)
    account: scheduled_visits
    direction: out
    triggers:
      - event: plan:plan_visit_billed
        when: {funding_source: insurance_plan}
        map: {visit_kind: treatment}
      - event: package:package_visit_redeemed
        when: {funding_source: self_pay_package}
        map: {appointment_date: appointment_date}
      - event: wc:wc_visit_billed
        when: {funding_source: workers_comp}
        map: {appointment_date: appointment_date}
      - event: membership:membership_session_used
        when: {funding_source: membership}
        map: {appointment_date: appointment_date}
  - type: series_visit_rescheduled
    target: series_events
    meaning: One booked appointment is moved to another date without cancelling the series.
    grain: one row per reschedule of one appointment
    distinguish_by: [appointment_date, reschedule_to_date]
    fields:
      event_date: date the reschedule was requested
      appointment_date: original appointment date
      appointment_time: original start time
      reschedule_to_date: new appointment date
      notice_hours: whole hours between the request and the original start time
      cancel_channel: how the request reached the clinic
    triggers: []
  - type: series_visit_cancelled
    target: series_events
    meaning: One booked appointment is cancelled by the patient or by the clinic.
    grain: one row per cancelled appointment
    distinguish_by: [appointment_date]
    fields:
      event_date: date the cancellation was received
      appointment_date: date of the cancelled appointment
      appointment_time: its start time
      notice_hours: whole hours between the cancellation timestamp and the start time
      cancel_channel: how the cancellation reached the clinic
      cancel_reason: reason given
      funding_source: funding source the appointment was booked under
      visits: appointments removed (always 1)
    account: scheduled_visits
    direction: out
    triggers: []
  - type: series_no_show
    target: series_events
    meaning: The patient misses a booked appointment without cancelling, or arrives beyond the grace period where that is recorded as a no-show.
    grain: one row per missed appointment
    distinguish_by: [appointment_date]
    fields:
      event_date: date recorded
      appointment_date: date of the missed appointment
      appointment_time: its start time
      minutes_late: minutes late on arrival, or empty when the patient never arrived
      funding_source: funding source the appointment was booked under
      visits: appointments removed (always 1)
    account: scheduled_visits
    direction: out
    triggers: []
  - type: series_fee_assessed
    target: series_events
    meaning: A late-cancellation or no-show fee is charged for one missed appointment.
    grain: one row per fee per missed appointment
    distinguish_by: [fee_kind, appointment_date]
    fields:
      event_date: date assessed
      appointment_date: date of the missed appointment
      fee_kind: late cancellation or no-show
      amount: fee charged (positive)
      source_event_id: reference of the cancellation or no-show the fee is for
    account: missed_visit_fees
    direction: in
    triggers: []
  - type: series_fee_waived
    target: series_events
    meaning: An assessed missed-visit fee is waived.
    grain: one row per waived fee
    distinguish_by: [source_event_id]
    fields:
      event_date: date waived
      appointment_date: date of the missed appointment
      waiver_reason: why the fee was waived
      amount: amount waived (positive, the whole fee)
      source_event_id: reference of the fee waived
    account: missed_visit_fees
    direction: out
    triggers: []
  - type: series_fee_paid
    target: series_events
    meaning: The patient pays an assessed missed-visit fee.
    grain: one row per payment of one fee
    distinguish_by: [source_event_id, event_date]
    fields:
      event_date: date paid
      amount: amount paid (positive)
      payment_method: how it was paid
      source_event_id: reference of the fee paid
    account: missed_visit_fees
    direction: out
    triggers: []
  - type: series_fee_refunded
    target: series_events
    meaning: A missed-visit fee that was paid and later waived is refunded.
    grain: one row per refund of one fee payment
    distinguish_by: [source_event_id]
    fields:
      event_date: date refunded
      amount: amount refunded (positive)
      payment_method: method the refund goes back to (same as the payment)
      source_event_id: reference of the fee payment refunded
    account: missed_visit_fees
    direction: in
    triggers: []
  - type: series_visits_released
    target: series_events
    meaning: All future appointments still booked on the series are released back to the schedule.
    grain: one row per release of the series' remaining booked appointments
    distinguish_by: [release_reason, event_date]
    fields:
      event_date: date of the release
      release_reason: why the appointments were released
      visits: appointments released
    account: scheduled_visits
    direction: out
    triggers: []

measures:
  - id: series_msr_missed_window
    window: rolling no_show_window_days calendar days ending on the frozen_time date, by appointment_date
    measure: count, across all of the patient's series, of series_no_show rows plus, where late_cancels_count_as_missed is true on the series being judged, series_visit_cancelled rows whose notice_hours is below that series' late_cancel_notice_hours and whose cancel_reason is not clinic_cancelled
  - id: series_msr_courtesy_waivers_cy
    window: the current calendar year (January 1 to December 31 of the year of frozen_time), by event_date
    measure: count of series_fee_waived rows with waiver_reason first_occurrence_courtesy across all of the patient's series
  - id: series_msr_fees_in_month
    window: the calendar month containing the missed appointment's appointment_date
    measure: count of series_fee_assessed rows on this series whose appointment_date falls in that month
  - id: series_msr_reschedules
    window: the whole life of the series
    measure: count of series_visit_rescheduled rows on this series

policies:
  - id: series_agg_multi_holding
    subject: [series_opened]
    rule: >-
      A patient may hold at most max_per_customer appointment series that are booked, active or paused at the same time,
      and never two such series of the same visit format funded by the same funding holding. A combined land and aquatic
      program funded by one plan of care is held as two series.
    eligibility:
      - id: no_duplicate_format_same_funding
        applies_to: [series_opened]
        kind: dedup
        condition: "never two such series of the same visit format funded by the same funding holding."
        evidence_fields: [appointment_series.customer_id, appointment_series.variant_name, appointment_series.funding_source, appointment_series.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appointment_series.customer_id, appointment_series.variant_name]
          action_bindings:
            appointment_series.customer_id: customer_id
            appointment_series.variant_name: variant_name
        dedup_contract:
          table: appointment_series
          mode: separate_record
          object_bindings: {customer_id: customer_id, variant_name: variant_name, care_plan_id: care_plan_id, package_id: package_id, wc_case_id: wc_case_id, membership_id: membership_id}
          duplicate_filters: {status: [booked, active, paused]}
          distinct_fields: [opened_date]
    params:
      max_per_customer: 3

  - id: series_agg_weekly_frequency
    subject: [series_opened, series_visits_booked]
    rule: >-
      The standing appointments per week of all booked, active or paused series funded by the same holding are added
      together. For series funded by one Insured Plan of Care the total may not exceed that plan's max_visits_per_week;
      for series funded by one Workers' Compensation Referral it may not exceed that referral's
      authorized_visits_per_week; for a Self-Pay Visit Package or a Wellness Membership no combined cap applies. Each
      series on its own keeps visits_per_week between visits_per_week_min and visits_per_week_max of its format.
    eligibility: []

  - id: series_booking_eligibility
    subject: [series_opened, series_visits_booked, series_funding_changed]
    rule: >-
      Appointments are booked only on a series in booked or active status. Each appointment occupies one standing slot of
      visit_length_minutes minutes. Each booking holds at most
      max_visits_per_booking_batch appointments, none later than booking_horizon_days calendar days after the booking date
      or after the series end date, and the series may not run longer than series_length_weeks_max weeks from its start
      date. Through the patient portal a format is bookable only where portal_booking_allowed is true and no later than
      portal_booking_cutoff_hours before the start time. Where pre_visit_clearance_required is true the series is opened only when a clearance of pre_visit_clearance_kind is on file dated within clearance_valid_days calendar days before the series start date;
      where specialty_therapist_required is true the assigned therapist must hold that specialty; where
      postop_first_visit_within_days is above 0 the first appointment is no later than that many days after the surgery
      date; where card_on_file_required is true a card must be on file. No new appointments are booked while the patient's unpaid missed-visit fees past due reach unpaid_fee_booking_block_amount, while a funding plan of care shows a balance at or above its unpaid_balance_booking_hold_threshold, or while a same-day-only restriction is in force;
      during that restriction only same-day openings are booked. The funding holding must allow the visits: a plan of
      care in intake or active status (with appointments beyond its authorized visits held only as pending under
      series_attendance_and_release), a Self-Pay Visit Package that is active with visits remaining at least the visits
      booked, a Workers' Compensation Referral whose adjuster authorization covers them, or an active Wellness
      Membership with sessions available. A funding change takes effect from the next unattended appointment.
    eligibility:
      - id: series_bookable_status
        applies_to: [series_visits_booked]
        kind: state
        condition: "Appointments are booked only on a series in booked or active status."
        evidence_fields: [appointment_series.status, appointment_series.series_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appointment_series.series_id]
          action_bindings:
            appointment_series.series_id: series_id
        state_contract:
          field: appointment_series.status
          allowed: [booked, active]
      - id: clearance_on_file
        applies_to: [series_opened]
        kind: authorization
        condition: "Where pre_visit_clearance_required is true the series is opened only when a clearance of pre_visit_clearance_kind is on file dated within clearance_valid_days calendar days before the series start date;"
        evidence_fields: [appointment_series.clearance_date, appointment_series.series_start_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appointment_series.clearance_date]
          action_bindings:
            appointment_series.clearance_date: clearance_date
      - id: no_booking_block
        applies_to: [series_visits_booked]
        kind: authorization
        condition: "No new appointments are booked while the patient's unpaid missed-visit fees past due reach unpaid_fee_booking_block_amount, while a funding plan of care shows a balance at or above its unpaid_balance_booking_hold_threshold, or while a same-day-only restriction is in force;"
        evidence_fields: [appointment_series.missed_fee_balance, appointment_series.booking_restriction, appointment_series.restriction_end_date, care_plans.patient_due_balance, appointment_series.series_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appointment_series.series_id]
          action_bindings:
            appointment_series.series_id: series_id

  - id: series_evt_notice_and_rescheduling
    subject: [series_visit_cancelled, series_visit_rescheduled, series_no_show, series_visit_attended]
    rule: >-
      Appointments are cancelled, rescheduled or recorded as missed only on a series in booked, active or paused status.
      Notice is the whole hours between the moment the cancellation reached the clinic and the appointment start; a
      voicemail is timed by its timestamp where voicemail_counts_as_notice is true, and a portal cancellation is accepted
      only where portal_cancel_allowed is true and no later than portal_cancel_cutoff_hours before the start. A
      cancellation with notice below late_cancel_notice_hours is a late cancellation; a cancellation by the clinic
      (cancel_reason clinic_cancelled) is never a late cancellation and a replacement is offered within
      clinic_cancel_rebook_days calendar days. A rescheduled appointment counts as a reschedule, not a cancellation; no
      more than max_reschedules_per_series reschedules are allowed on a series, and beyond that a move is a cancellation.
      A patient arriving within grace_minutes_late_arrival minutes is seen, for the remaining slot time where
      late_arrival_shortened_visit is true; a later arrival is recorded as late_arrival_beyond_grace_treated_as. A booked
      appointment with no arrival and no cancellation is a no-show.
    eligibility:
      - id: series_open_for_changes
        applies_to: [series_visit_cancelled, series_visit_rescheduled, series_no_show]
        kind: state
        condition: "Appointments are cancelled, rescheduled or recorded as missed only on a series in booked, active or paused status."
        evidence_fields: [appointment_series.status, appointment_series.series_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appointment_series.series_id]
          action_bindings:
            appointment_series.series_id: series_id
        state_contract:
          field: appointment_series.status
          allowed: [booked, active, paused]
    measures: [series_msr_reschedules]

  - id: series_evt_missed_visit_fees
    subject: [series_fee_assessed]
    rule: >-
      A late cancellation is charged late_cancel_fee and a no-show is charged no_show_fee of the series' format. The
      consequence of a missed visit depends on who funds the appointment: where the funding plan of care has
      missed_visit_fee_billable false no fee is assessed; for a workers' compensation appointment the referral's
      injured_worker_missed_fee_billable decides and the miss is reported to the adjuster instead; for a Self-Pay Visit
      Package appointment the package's missed_visit_forfeits_visit decides and, where true, the package visit is
      forfeited instead of any fee; for a Wellness Membership appointment the session is forfeited instead of any fee
      where the membership's missed_session_forfeits is true. No fee is assessed for a missed first appointment where
      fee_on_first_appointment is false, nor beyond missed_fees_per_month_cap fees on one series for appointments in one
      calendar month, nor for a clinic cancellation, nor for a late cancellation rescheduled into the same
      Monday-to-Sunday week with at least same_week_reschedule_min_notice_hours notice where
      same_week_reschedule_waives_fee is true. A missed-visit fee is assessed no later than fee_assessment_days calendar days after the appointment date of the missed visit.
      Days are counted as calendar days from the appointment date, the appointment date itself being day zero.
    eligibility:
      - id: fee_assessed_in_time
        applies_to: [series_fee_assessed]
        kind: time
        condition: "A missed-visit fee is assessed no later than fee_assessment_days calendar days after the appointment date of the missed visit."
        evidence_fields: [series_events.appointment_date, series_events.series_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [series_events.series_event_id]
          action_bindings:
            series_events.series_event_id: source_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the appointment date of the missed visit
          anchor_source: series_events.appointment_date
          relation: not_after
          duration_source: variants.fee_assessment_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the appointment date, the appointment date itself being day zero."
          boundary: inclusive
    params:
      per_tier:
        Telehealth 30-Minute Visit Series: {late_cancel_fee: "=late_cancel_fee", no_show_fee: "=no_show_fee"}
        Standard 45-Minute Visit Series: {late_cancel_fee: "=late_cancel_fee", no_show_fee: "=no_show_fee"}
        Extended 60-Minute Visit Series: {late_cancel_fee: "=late_cancel_fee", no_show_fee: "=no_show_fee"}
        Aquatic Therapy Visit Series: {late_cancel_fee: "=late_cancel_fee", no_show_fee: "=no_show_fee"}
        Specialty One-on-One Visit Series: {late_cancel_fee: "=late_cancel_fee", no_show_fee: "=no_show_fee"}
        Post-Operative Priority Visit Series: {late_cancel_fee: "=late_cancel_fee", no_show_fee: "=no_show_fee"}
    formula:
      when_not: series_msr_fees_in_month >= missed_fees_per_month_cap
      amount: late_cancel_fee if fee_kind == "late_cancellation" else no_show_fee
    measures: [series_msr_fees_in_month]

  - id: series_evt_fee_waivers
    subject: [series_fee_waived, series_fee_refunded]
    rule: >-
      An assessed fee is waived in full, never in part, for exactly one of these reasons, checked in this order:
      clinic_weather_closure when the clinic was closed that day; telehealth_connection_failure where
      telehealth_connection_failure_waiver is true; documented_emergency where emergency_waiver_allowed is true and the
      documentation arrived no later than emergency_documentation_days calendar days after the appointment date; and
      first_occurrence_courtesy while series_msr_courtesy_waivers_cy is below courtesy_waivers_per_year. A fee waiver is granted only on a request made no later than fee_waiver_request_days calendar days after the date the fee was assessed.
      Days are counted as calendar days from the assessment date, the assessment date itself being day zero. A fee that
      was already paid and is then waived is refunded to the same payment method within fee_refund_days calendar days.
    eligibility:
      - id: waiver_request_window
        applies_to: [series_fee_waived]
        kind: time
        condition: "A fee waiver is granted only on a request made no later than fee_waiver_request_days calendar days after the date the fee was assessed."
        evidence_fields: [series_events.event_date, series_events.series_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [series_events.series_event_id]
          action_bindings:
            series_events.series_event_id: source_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the fee was assessed
          anchor_source: series_events.event_date
          relation: not_after
          duration_source: variants.fee_waiver_request_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the assessment date, the assessment date itself being day zero."
          boundary: inclusive
    measures: [series_msr_courtesy_waivers_cy]

  - id: series_evt_fee_payment
    subject: [series_fee_paid]
    rule: >-
      A missed-visit fee is paid by card, cash or check; it is never paid with an HSA or FSA card where
      hsa_payment_allowed_for_fees is false, because a missed appointment is not a medical expense. A fee is due
      fee_due_days calendar days after it is assessed. A payment is applied to the fee the patient names, otherwise to
      the oldest unpaid fee, and never exceeds that fee.
    eligibility: []

  - id: series_attendance_and_release
    subject: [series_visits_released, series_restriction_updated]
    rule: >-
      series_msr_missed_window counts the patient's no-shows over the last no_show_window_days calendar days, together
      with late cancellations where late_cancels_count_as_missed is true on the series being judged. When
      series_msr_missed_window reaches no_show_release_threshold, all future appointments on the series are
      released and, where same_day_only_after_release is true, a same-day-only restriction is placed for
      same_day_restriction_days calendar days. Remaining appointments are also released when the series is cancelled,
      when the funding plan of care is discharged, when a funding package has no visits left, and when the funding plan
      of care stays on hold for authorization. Appointments held for a pending authorization are released no earlier than auth_pending_slot_hold_days calendar days after the hold start date of the funding plan of care.
      Days are counted as calendar days from the hold start date, the hold start date itself being day zero. Where
      reactivation_requires_new_series is true, released appointments are never re-booked on the same series once it is
      cancelled; a new series is opened instead.
    eligibility:
      - id: auth_hold_aged
        applies_to: [series_visits_released]
        kind: time
        condition: "Appointments held for a pending authorization are released no earlier than auth_pending_slot_hold_days calendar days after the hold start date of the funding plan of care."
        evidence_fields: [care_plans.hold_start_date, appointment_series.care_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appointment_series.care_plan_id]
          action_bindings:
            appointment_series.care_plan_id: care_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the hold start date of the funding plan of care
          anchor_source: care_plans.hold_start_date
          relation: not_before
          duration_source: variants.auth_pending_slot_hold_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the hold start date, the hold start date itself being day zero."
          boundary: inclusive
    measures: [series_msr_missed_window]

  - id: series_lifecycle_rules
    subject: [series_activated, series_paused, series_resumed, series_completed, series_cancelled]
    rule: >-
      A series becomes active at its first attended appointment. An active series may be paused at most
      pauses_per_series times. A paused series is cancelled for pause expiry no earlier than pause_max_days calendar days after the pause start date on file.
      Days are counted as calendar days from the pause start date, the pause start date itself being day zero. A series
      completes when its booked visits are used up after its last appointment or its end date has passed; it is
      cancelled when the patient asks, when appointments were released after missed visits, or when its funding ends
      without a replacement. Where standing_slot_guaranteed is true the weekday and time pattern is held for the whole
      series and released only by cancellation.
    eligibility:
      - id: pause_aged_for_cancel
        applies_to: [series_cancelled]
        kind: time
        condition: "A paused series is cancelled for pause expiry no earlier than pause_max_days calendar days after the pause start date on file."
        evidence_fields: [appointment_series.pause_start_date, appointment_series.series_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [appointment_series.series_id]
          action_bindings:
            appointment_series.series_id: series_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the pause start date on file
          anchor_source: appointment_series.pause_start_date
          relation: not_before
          duration_source: variants.pause_max_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the pause start date, the pause start date itself being day zero."
          boundary: inclusive

extended_policies:
- id: series_ext_late_cancellation_fee
  base_policy_refs:
  - series_evt_missed_visit_fees
  overwrite:
  - base_policy: series_evt_missed_visit_fees
    superseded_clause: A late cancellation is charged late_cancel_fee and a no-show is charged no_show_fee of the series'
      format.
    replaced_by: >-
      The late-cancellation fee is the late-cancellation basis multiplied by the late-cancellation notice share, the late-cancellation
      reason share, the late-cancellation attendance share, the late-cancellation membership-miss share and the late-cancellation
      hardship share, each share read as a percentage of the basis.
  trigger: state_due
  subject:
  - series_fee_assessed
  computes: amount
  target_tool: assess_late_cancellation_fee_706e910e
  params:
    lc_package_cash_share_pct: 50
    lc_long_notice_hours: 18
    lc_mid_notice_hours: 12
    lc_long_notice_pct: 50
    lc_mid_notice_pct: 75
    lc_illness_pct: 50
    lc_travel_pct: 80
    lc_long_tenure_visits: 8
    lc_short_tenure_visits: 4
    lc_long_tenure_pct: 90
    lc_short_tenure_pct: 95
    lc_two_member_misses_pct: 150
    lc_one_member_miss_pct: 125
    lc_full_hardship_level: 75
  rule: >-
    A late-cancellation fee is charged for a booked appointment that the patient cancelled before the appointment day with
    notice below late_cancel_notice_hours of the series' format, and it is worked out on the most recent cancellation recorded
    on the series that carries no minutes late, the one with the latest appointment date. Before any adjustment, the late-cancellation
    fee is late_cancel_fee of the series' format, rounded to the nearest cent. The late-cancellation basis follows the funding
    of the series: where the series is funded by an Insured Plan of Care whose verified copay is above zero, the basis is
    the lesser of late_cancel_fee and that copay; where the series is funded by a Self-Pay Visit Package whose tier lists
    a single_visit_cash_rate above zero, the basis is lc_package_cash_share_pct percent of that single_visit_cash_rate;
    for any other series the basis is late_cancel_fee. The late-cancellation notice share is lc_long_notice_pct percent
    where the cancellation gave at least lc_long_notice_hours hours of notice, lc_mid_notice_pct percent where it gave at
    least lc_mid_notice_hours hours but fewer than lc_long_notice_hours hours, and 100 percent where it gave fewer than
    lc_mid_notice_hours hours. The late-cancellation reason share is lc_illness_pct percent where the reason recorded on
    the cancellation is patient_illness or family_emergency, lc_travel_pct percent where it is transportation or weather,
    and 100 percent for any other reason. The late-cancellation attendance share is lc_long_tenure_pct percent where the
    series shows at least lc_long_tenure_visits attended appointments, lc_short_tenure_pct percent where it shows at least
    lc_short_tenure_visits but fewer than lc_long_tenure_visits attended appointments, and 100 percent where it shows fewer
    than lc_short_tenure_visits. The late-cancellation membership-miss share is lc_two_member_misses_pct percent where the
    patient's wellness membership history shows two or more maintenance sessions forfeited in the three months up to the
    assessment date (an entry counts when fewer than three whole months separate its date from the assessment date), lc_one_member_miss_pct
    percent where it shows exactly one such forfeited session, and 100 percent where it shows none. The late-cancellation
    hardship share is 0 percent where the patient holds an approved hardship determination whose effective date has arrived
    and whose expiry date has not passed at a level whose discount_percent is lc_full_hardship_level or more, 100 percent
    less the level's discount_percent where such an approved determination in force discounts more than zero but less than
    lc_full_hardship_level percent, and 100 percent where no approved determination is in force. The late-cancellation fee
    is the late-cancellation basis multiplied by the late-cancellation notice share, the late-cancellation reason share,
    the late-cancellation attendance share, the late-cancellation membership-miss share and the late-cancellation hardship
    share, each share read as a percentage of the basis. All five shares act on the same basis by multiplication, so the
    order in which they are applied does not change the fee, and the product is rounded to the nearest cent once, at the
    end, never at an intermediate step.
  prerequisite: []
  cross_category:
  - category: plan
    as: branch
    reads:
    - copay_amount
    note: The late-cancellation basis reads the verified copay of the Insured Plan of Care funding the series.
  - category: package
    as: branch
    reads:
    - single_visit_cash_rate
    note: The late-cancellation basis reads the cash rate of the Self-Pay Visit Package tier funding the series.
  - category: membership
    as: history
    reads:
    - membership_events.event_type
    note: The late-cancellation membership-miss share counts the patient's forfeited maintenance sessions.
  - category: hardship
    as: branch
    reads:
    - status
    - effective_date
    - expiry_date
    - discount_percent
    note: The late-cancellation hardship share reads the patient's approved hardship determination.
  compute:
  - lc_notice: >-
      LATEST('series_events', 'notice_hours', date_field='appointment_date', event_type='series_visit_cancelled', minutes_late=None)
  - lc_reason: >-
      LATEST('series_events', 'cancel_reason', date_field='appointment_date', event_type='series_visit_cancelled', minutes_late=None)
  - lc_copay: CFIELD('plan', 'copay_amount', care_plan_id=F('care_plan_id')) or 0
  - lc_cash_rate: CPARAM('package', 'single_visit_cash_rate', package_id=F('package_id')) or 0
  - lc_base: >-
      MN(P('late_cancel_fee'), lc_copay) if (F('funding_source') == 'insurance_plan' and lc_copay > 0) else (lc_cash_rate
      * K('lc_package_cash_share_pct') / 100 if (F('funding_source') == 'self_pay_package' and lc_cash_rate > 0) else P('late_cancel_fee'))
  - lc_notice_pct: >-
      K('lc_long_notice_pct') if lc_notice >= K('lc_long_notice_hours') else (K('lc_mid_notice_pct') if lc_notice >= K('lc_mid_notice_hours')
      else 100)
  - lc_reason_pct: >-
      K('lc_illness_pct') if (lc_reason == 'patient_illness' or lc_reason == 'family_emergency') else (K('lc_travel_pct')
      if (lc_reason == 'transportation' or lc_reason == 'weather') else 100)
  - lc_attended: COUNT('series_events', event_type='series_visit_attended')
  - lc_tenure_pct: >-
      K('lc_long_tenure_pct') if lc_attended >= K('lc_long_tenure_visits') else (K('lc_short_tenure_pct') if lc_attended
      >= K('lc_short_tenure_visits') else 100)
  - lc_member_misses: XCOUNT('membership', 'membership_events', within_months=3, event_type='membership_session_forfeited')
  - lc_member_pct: >-
      K('lc_two_member_misses_pct') if lc_member_misses >= 2 else (K('lc_one_member_miss_pct') if lc_member_misses == 1
      else 100)
  - lc_hs_effective: CFIELD('hardship', 'effective_date', status='approved') or '2999-12-31'
  - lc_hs_expiry: CFIELD('hardship', 'expiry_date', status='approved') or '1900-01-01'
  - lc_hs_level: CPARAM('hardship', 'discount_percent', status='approved') or 0
  - lc_hardship_pct: >-
      0 if (DAYS(lc_hs_effective, NOW) >= 0 and DAYS(NOW, lc_hs_expiry) >= 0 and lc_hs_level >= K('lc_full_hardship_level'))
      else ((100 - lc_hs_level) if (DAYS(lc_hs_effective, NOW) >= 0 and DAYS(NOW, lc_hs_expiry) >= 0 and lc_hs_level > 0)
      else 100)
  - result: >-
      RND(lc_base * lc_notice_pct / 100 * lc_reason_pct / 100 * lc_tenure_pct / 100 * lc_member_pct / 100 * lc_hardship_pct
      / 100, 2)
  compute_basis:
    lc_notice: >-
      it is worked out on the most recent cancellation recorded on the series that carries no minutes late, the one with
      the latest appointment date.
    lc_reason: >-
      it is worked out on the most recent cancellation recorded on the series that carries no minutes late, the one with
      the latest appointment date.
    lc_copay: >-
      where the series is funded by an Insured Plan of Care whose verified copay is above zero, the basis is the lesser
      of late_cancel_fee and that copay;
    lc_cash_rate: >-
      where the series is funded by a Self-Pay Visit Package whose tier lists a single_visit_cash_rate above zero, the basis
      is lc_package_cash_share_pct percent of that single_visit_cash_rate;
    lc_base: >-
      The late-cancellation basis follows the funding of the series: where the series is funded by an Insured Plan of Care
      whose verified copay is above zero, the basis is the lesser of late_cancel_fee and that copay; where the series is
      funded by a Self-Pay Visit Package whose tier lists a single_visit_cash_rate above zero, the basis is lc_package_cash_share_pct
      percent of that single_visit_cash_rate; for any other series the basis is late_cancel_fee.
    lc_notice_pct: >-
      The late-cancellation notice share is lc_long_notice_pct percent where the cancellation gave at least lc_long_notice_hours
      hours of notice, lc_mid_notice_pct percent where it gave at least lc_mid_notice_hours hours but fewer than lc_long_notice_hours
      hours, and 100 percent where it gave fewer than lc_mid_notice_hours hours.
    lc_reason_pct: >-
      The late-cancellation reason share is lc_illness_pct percent where the reason recorded on the cancellation is patient_illness
      or family_emergency, lc_travel_pct percent where it is transportation or weather, and 100 percent for any other reason.
    lc_attended: where the series shows at least lc_long_tenure_visits attended appointments,
    lc_tenure_pct: >-
      The late-cancellation attendance share is lc_long_tenure_pct percent where the series shows at least lc_long_tenure_visits
      attended appointments, lc_short_tenure_pct percent where it shows at least lc_short_tenure_visits but fewer than lc_long_tenure_visits
      attended appointments, and 100 percent where it shows fewer than lc_short_tenure_visits.
    lc_member_misses: >-
      where the patient's wellness membership history shows two or more maintenance sessions forfeited in the three months
      up to the assessment date (an entry counts when fewer than three whole months separate its date from the assessment
      date),
    lc_member_pct: >-
      The late-cancellation membership-miss share is lc_two_member_misses_pct percent where the patient's wellness membership
      history shows two or more maintenance sessions forfeited in the three months up to the assessment date (an entry counts
      when fewer than three whole months separate its date from the assessment date), lc_one_member_miss_pct percent where
      it shows exactly one such forfeited session, and 100 percent where it shows none.
    lc_hs_effective: >-
      where the patient holds an approved hardship determination whose effective date has arrived and whose expiry date
      has not passed
    lc_hs_expiry: >-
      where the patient holds an approved hardship determination whose effective date has arrived and whose expiry date
      has not passed
    lc_hs_level: >-
      at a level whose discount_percent is lc_full_hardship_level or more, 100 percent less the level's discount_percent
    lc_hardship_pct: >-
      The late-cancellation hardship share is 0 percent where the patient holds an approved hardship determination whose
      effective date has arrived and whose expiry date has not passed at a level whose discount_percent is lc_full_hardship_level
      or more, 100 percent less the level's discount_percent where such an approved determination in force discounts more
      than zero but less than lc_full_hardship_level percent, and 100 percent where no approved determination is in force.
    result: >-
      All five shares act on the same basis by multiplication, so the order in which they are applied does not change the
      fee, and the product is rounded to the nearest cent once, at the end, never at an intermediate step.
  factors:
  - id: late_cancellation_basis
    effect: method
    decides: lc_base
    bindings:
    - lc_copay
    - lc_cash_rate
    - lc_base
    ladder:
    - when: the series is funded by an Insured Plan of Care whose verified copay is above zero
      method: the basis is the lesser of late_cancel_fee and the plan's verified copay
    - when: the series is funded by a Self-Pay Visit Package whose tier lists a single_visit_cash_rate above zero
      method: the basis is lc_package_cash_share_pct percent of the package tier's single_visit_cash_rate
    - when: otherwise
      method: the basis is late_cancel_fee of the series' format
    baseline:
