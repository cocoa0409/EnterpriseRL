    evidence:
    - cross_category
    - tier_param
    cross_difficulty: plan
  - id: late_cancellation_notice_share
    effect: parameter
    decides: lc_notice_pct
    bindings:
    - lc_notice
    - lc_notice_pct
    ladder:
    - when: the cancellation gave at least lc_long_notice_hours hours of notice
      value: K('lc_long_notice_pct')
    - when: the cancellation gave at least lc_mid_notice_hours but fewer than lc_long_notice_hours hours of notice
      value: K('lc_mid_notice_pct')
    - when: otherwise
