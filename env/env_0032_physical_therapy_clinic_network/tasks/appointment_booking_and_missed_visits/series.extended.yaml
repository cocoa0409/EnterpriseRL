- id: series_ext_same_day_cancellation_fee
  base_policy_refs:
  - series_evt_missed_visit_fees
  overwrite:
  - base_policy: series_evt_missed_visit_fees
    superseded_clause: A late cancellation is charged late_cancel_fee and a no-show is charged no_show_fee of the series'
      format.
    replaced_by: >-
      The same-day cancellation fee is the same-day basis multiplied by the same-day notice share, the same-day repeat share,
      the same-day package-forfeit share, the same-day hardship share and the same-day reason share, each share read as
      a percentage of the basis.
  trigger: state_due
  subject:
  - series_fee_assessed
  computes: amount
  target_tool: assess_same_day_cancellation_fee_8648d00e
  params:
    sd_package_cash_share_pct: 50
    sd_last_minute_hours: 2
    sd_early_morning_hours: 6
    sd_last_minute_pct: 120
    sd_early_morning_pct: 110
    sd_two_prior_fees_pct: 150
    sd_one_prior_fee_pct: 125
    sd_two_forfeits_pct: 150
    sd_one_forfeit_pct: 125
    sd_full_hardship_level: 75
    sd_illness_pct: 50
    sd_travel_pct: 80
  rule: >-
    A same-day cancellation fee is charged where the patient, not the clinic, cancelled a booked appointment on the appointment
    day itself, ahead of its start, and it is charged as a late cancellation; it is worked out on the most recent cancellation
    recorded on the series that carries no minutes late, the one with the latest appointment date. Before any adjustment,
    the same-day cancellation fee is late_cancel_fee of the series' format, rounded to the nearest cent. A same-day cancellation
    fee is not charged until every no-show on the series' first appointment recorded within its fee assessment period shows
    a first-appointment no-show fee entry. The same-day cancellation fee is fixed only after every late arrival beyond the
    grace period recorded on the series as a zero-notice cancellation within its fee assessment period carries its late-arrival
    fee entry. The same-day basis follows the funding of the series: where the series is funded by a Self-Pay Visit Package
    whose tier lists a single_visit_cash_rate above zero, the basis is sd_package_cash_share_pct percent of that single_visit_cash_rate;
    where the series is funded by an Insured Plan of Care whose verified copay is above zero, the basis is the lesser of
    late_cancel_fee and that copay; for any other series the basis is late_cancel_fee. The same-day notice share is sd_last_minute_pct
    percent where the cancellation gave fewer than sd_last_minute_hours hours of notice, sd_early_morning_pct percent where
    it gave at least sd_last_minute_hours but fewer than sd_early_morning_hours hours, and 100 percent where it gave sd_early_morning_hours
    hours or more. The same-day repeat share is sd_two_prior_fees_pct percent where the series already shows two or more
    missed-visit fees assessed in the two months up to the assessment date (an entry counts when fewer than two whole months
    separate its date from the assessment date), sd_one_prior_fee_pct percent where it shows exactly one such fee, and 100
    percent where it shows none. The same-day package-forfeit share is sd_two_forfeits_pct percent where the patient's Self-Pay
    Visit Package history shows two or more package visits forfeited for missed appointments in the three months up to the
    assessment date (an entry counts when fewer than three whole months separate its date from the assessment date), sd_one_forfeit_pct
    percent where it shows exactly one, and 100 percent where it shows none. The same-day hardship share is 0 percent where
    the patient holds an approved hardship determination whose effective date has arrived and whose expiry date has not
    passed at a level whose discount_percent is sd_full_hardship_level or more, 100 percent less the level's discount_percent
    where such an approved determination in force discounts more than zero but less than sd_full_hardship_level percent,
    and 100 percent where no approved determination is in force. The same-day reason share is sd_illness_pct percent where
    the reason recorded on the cancellation is patient_illness or family_emergency, sd_travel_pct percent where it is transportation
    or weather, and 100 percent for any other reason. The same-day cancellation fee is the same-day basis multiplied by
    the same-day notice share, the same-day repeat share, the same-day package-forfeit share, the same-day hardship share
    and the same-day reason share, each share read as a percentage of the basis. The five same-day shares are applied to
    the one basis by multiplication, so no order among them matters, and the cent rounding is done a single time on the
    finished product.
  prerequisite:
  - problem: series_ext_first_visit_no_show_fee
    kind: value_input
    gate: sd_prior_fees
    form: state
    policy_source: >-
      A same-day cancellation fee is not charged until every no-show on the series' first appointment recorded within its
      fee assessment period shows a first-appointment no-show fee entry.
    condition: >-
      Where the series shows a series_no_show entry dated on the series start date whose appointment date lies no more than
      fee_assessment_days calendar days before the handling date, a series_fee_assessed entry of fee_kind no_show points
      at it through source_event_id.
    resolved_by: assess_first_visit_no_show_fee_a4cbc15c
    effect: >-
      The first-appointment no-show fee entry adds one to the missed-visit fees assessed on the series in the two months
      up to the assessment date, raising the same-day repeat share.
  - problem: series_ext_late_arrival_fee
    kind: value_input
    gate: sd_prior_fees
    form: state
    policy_source: >-
      The same-day cancellation fee is fixed only after every late arrival beyond the grace period recorded on the series
      as a zero-notice cancellation within its fee assessment period carries its late-arrival fee entry.
    condition: >-
      Every zero-notice series_visit_cancelled entry carrying minutes late on the series whose appointment date lies no
      more than fee_assessment_days calendar days before the handling date has a series_fee_assessed entry pointing at it
      through source_event_id.
    resolved_by: assess_late_arrival_fee_e6f6ddb6
    effect: >-
      The late-arrival fee entry adds one to the missed-visit fees assessed on the series in the two months up to the assessment
      date, raising the same-day repeat share.
  cross_category:
  - category: package
    as: branch
    reads:
    - single_visit_cash_rate
    - package_events.event_type
    note: >-
      The same-day basis reads the funding package tier's cash rate; the package-forfeit share counts forfeited package
      visits.
  - category: plan
    as: branch
    reads:
    - copay_amount
    note: The same-day basis reads the verified copay where an Insured Plan of Care funds the series.
  - category: hardship
    as: branch
    reads:
    - status
    - effective_date
    - expiry_date
    - discount_percent
    note: The same-day hardship share reads the patient's approved hardship determination.
  compute:
  - sd_notice: >-
      LATEST('series_events', 'notice_hours', date_field='appointment_date', event_type='series_visit_cancelled', minutes_late=None)
  - sd_reason: >-
      LATEST('series_events', 'cancel_reason', date_field='appointment_date', event_type='series_visit_cancelled', minutes_late=None)
  - sd_cash_rate: CPARAM('package', 'single_visit_cash_rate', package_id=F('package_id')) or 0
  - sd_copay: CFIELD('plan', 'copay_amount', care_plan_id=F('care_plan_id')) or 0
  - sd_base: >-
      sd_cash_rate * K('sd_package_cash_share_pct') / 100 if (F('funding_source') == 'self_pay_package' and sd_cash_rate
      > 0) else (MN(P('late_cancel_fee'), sd_copay) if (F('funding_source') == 'insurance_plan' and sd_copay > 0) else P('late_cancel_fee'))
  - sd_notice_pct: >-
      K('sd_last_minute_pct') if sd_notice < K('sd_last_minute_hours') else (K('sd_early_morning_pct') if sd_notice < K('sd_early_morning_hours')
      else 100)
  - sd_prior_fees: COUNT('series_events', within_months=2, event_type='series_fee_assessed')
  - sd_repeat_pct: >-
      K('sd_two_prior_fees_pct') if sd_prior_fees >= 2 else (K('sd_one_prior_fee_pct') if sd_prior_fees == 1 else 100)
  - sd_forfeits: XCOUNT('package', 'package_events', within_months=3, event_type='package_visit_forfeited')
  - sd_forfeit_pct: K('sd_two_forfeits_pct') if sd_forfeits >= 2 else (K('sd_one_forfeit_pct') if sd_forfeits == 1 else
      100)
  - sd_hs_effective: CFIELD('hardship', 'effective_date', status='approved') or '2999-12-31'
  - sd_hs_expiry: CFIELD('hardship', 'expiry_date', status='approved') or '1900-01-01'
  - sd_hs_level: CPARAM('hardship', 'discount_percent', status='approved') or 0
  - sd_hardship_pct: >-
      0 if (DAYS(sd_hs_effective, NOW) >= 0 and DAYS(NOW, sd_hs_expiry) >= 0 and sd_hs_level >= K('sd_full_hardship_level'))
      else ((100 - sd_hs_level) if (DAYS(sd_hs_effective, NOW) >= 0 and DAYS(NOW, sd_hs_expiry) >= 0 and sd_hs_level > 0)
      else 100)
  - sd_reason_pct: >-
      K('sd_illness_pct') if (sd_reason == 'patient_illness' or sd_reason == 'family_emergency') else (K('sd_travel_pct')
      if (sd_reason == 'transportation' or sd_reason == 'weather') else 100)
  - result: >-
      RND(sd_base * sd_notice_pct / 100 * sd_repeat_pct / 100 * sd_forfeit_pct / 100 * sd_hardship_pct / 100 * sd_reason_pct
      / 100, 2)
  compute_basis:
    sd_notice: >-
      it is worked out on the most recent cancellation recorded on the series that carries no minutes late, the one with
      the latest appointment date.
    sd_reason: >-
      it is worked out on the most recent cancellation recorded on the series that carries no minutes late, the one with
      the latest appointment date.
    sd_cash_rate: >-
      where the series is funded by a Self-Pay Visit Package whose tier lists a single_visit_cash_rate above zero, the basis
      is sd_package_cash_share_pct percent of that single_visit_cash_rate;
    sd_copay: >-
      where the series is funded by an Insured Plan of Care whose verified copay is above zero, the basis is the lesser
      of late_cancel_fee and that copay;
    sd_base: >-
      The same-day basis follows the funding of the series: where the series is funded by a Self-Pay Visit Package whose
      tier lists a single_visit_cash_rate above zero, the basis is sd_package_cash_share_pct percent of that single_visit_cash_rate;
      where the series is funded by an Insured Plan of Care whose verified copay is above zero, the basis is the lesser
      of late_cancel_fee and that copay; for any other series the basis is late_cancel_fee.
    sd_notice_pct: >-
      The same-day notice share is sd_last_minute_pct percent where the cancellation gave fewer than sd_last_minute_hours
      hours of notice, sd_early_morning_pct percent where it gave at least sd_last_minute_hours but fewer than sd_early_morning_hours
      hours, and 100 percent where it gave sd_early_morning_hours hours or more.
    sd_prior_fees: >-
      where the series already shows two or more missed-visit fees assessed in the two months up to the assessment date
      (an entry counts when fewer than two whole months separate its date from the assessment date),
    sd_repeat_pct: >-
      The same-day repeat share is sd_two_prior_fees_pct percent where the series already shows two or more missed-visit
      fees assessed in the two months up to the assessment date (an entry counts when fewer than two whole months separate
      its date from the assessment date), sd_one_prior_fee_pct percent where it shows exactly one such fee, and 100 percent
      where it shows none.
    sd_forfeits: >-
      where the patient's Self-Pay Visit Package history shows two or more package visits forfeited for missed appointments
      in the three months up to the assessment date (an entry counts when fewer than three whole months separate its date
      from the assessment date),
    sd_forfeit_pct: >-
      The same-day package-forfeit share is sd_two_forfeits_pct percent where the patient's Self-Pay Visit Package history
      shows two or more package visits forfeited for missed appointments in the three months up to the assessment date (an
      entry counts when fewer than three whole months separate its date from the assessment date), sd_one_forfeit_pct percent
      where it shows exactly one, and 100 percent where it shows none.
    sd_hs_effective: >-
      where the patient holds an approved hardship determination whose effective date has arrived and whose expiry date
      has not passed
    sd_hs_expiry: >-
      where the patient holds an approved hardship determination whose effective date has arrived and whose expiry date
      has not passed
    sd_hs_level: >-
      at a level whose discount_percent is sd_full_hardship_level or more, 100 percent less the level's discount_percent
    sd_hardship_pct: >-
      The same-day hardship share is 0 percent where the patient holds an approved hardship determination whose effective
      date has arrived and whose expiry date has not passed at a level whose discount_percent is sd_full_hardship_level
      or more, 100 percent less the level's discount_percent where such an approved determination in force discounts more
      than zero but less than sd_full_hardship_level percent, and 100 percent where no approved determination is in force.
    sd_reason_pct: >-
      The same-day reason share is sd_illness_pct percent where the reason recorded on the cancellation is patient_illness
      or family_emergency, sd_travel_pct percent where it is transportation or weather, and 100 percent for any other reason.
    result: >-
      The five same-day shares are applied to the one basis by multiplication, so no order among them matters, and the cent
      rounding is done a single time on the finished product.
  factors:
  - id: same_day_basis
    effect: method
    decides: sd_base
    bindings:
    - sd_cash_rate
    - sd_copay
    - sd_base
    ladder:
    - when: the series is funded by a Self-Pay Visit Package whose tier lists a single_visit_cash_rate above zero
      method: the same-day basis is sd_package_cash_share_pct percent of the package tier's single_visit_cash_rate
    - when: the series is funded by an Insured Plan of Care whose verified copay is above zero
      method: the same-day basis is the lesser of late_cancel_fee and the verified copay
    - when: otherwise
      method: the same-day basis is late_cancel_fee of the series' format
    baseline:
      sd_base: P('late_cancel_fee')
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: package
  - id: same_day_notice_share
    effect: parameter
    decides: sd_notice_pct
    bindings:
    - sd_notice
    - sd_notice_pct
    ladder:
    - when: the cancellation gave fewer than sd_last_minute_hours hours of notice
      value: K('sd_last_minute_pct')
    - when: at least sd_last_minute_hours but fewer than sd_early_morning_hours hours of notice
      value: K('sd_early_morning_pct')
    - when: otherwise
      value: '100'
    baseline:
      sd_notice_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: same_day_repeat_share
    effect: parameter
    decides: sd_repeat_pct
    bindings:
    - sd_prior_fees
    - sd_repeat_pct
    ladder:
    - when: two or more missed-visit fees already assessed on the series in the two months up to the assessment date
      value: K('sd_two_prior_fees_pct')
    - when: exactly one such fee
      value: K('sd_one_prior_fee_pct')
    - when: otherwise
      value: '100'
    baseline:
      sd_repeat_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: same_day_package_forfeit_share
    effect: parameter
    decides: sd_forfeit_pct
    bindings:
    - sd_forfeits
    - sd_forfeit_pct
    ladder:
    - when: two or more package visits forfeited for missed appointments in the three months up to the assessment date
      value: K('sd_two_forfeits_pct')
    - when: exactly one such forfeited package visit
      value: K('sd_one_forfeit_pct')
    - when: otherwise
      value: '100'
    baseline:
      sd_forfeit_pct: '100'
    evidence:
    - cross_category
    - history
    cross_difficulty: package
  - id: same_day_hardship_share
    effect: parameter
    decides: sd_hardship_pct
    bindings:
    - sd_hs_effective
    - sd_hs_expiry
    - sd_hs_level
    - sd_hardship_pct
    ladder:
    - when: >-
        an approved hardship determination is in force (effective date arrived and expiry date not passed) and its level's
        discount_percent is sd_full_hardship_level or more
      value: '0'
    - when: >-
        an approved hardship determination is in force and its level's discount_percent is above zero but below sd_full_hardship_level
      value: 100 less the level's discount_percent
    - when: otherwise
      value: '100'
    baseline:
      sd_hardship_pct: '100'
    evidence:
    - cross_category
    - date
    cross_difficulty: hardship
  - id: same_day_reason_share
    effect: parameter
    decides: sd_reason_pct
    bindings:
    - sd_reason
    - sd_reason_pct
    ladder:
    - when: the recorded reason is patient_illness or family_emergency
      value: K('sd_illness_pct')
    - when: the recorded reason is transportation or weather
      value: K('sd_travel_pct')
    - when: otherwise
      value: '100'
    baseline:
      sd_reason_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      Before any adjustment, the same-day cancellation fee is late_cancel_fee of the series' format, rounded to the nearest
      cent.
    params:
    - late_cancel_fee
  inputs:
    history:
    - table: series_events
      aggregate: latest
      field: notice_hours
      filters:
        event_type: series_visit_cancelled
        minutes_late: null
    - table: series_events
      aggregate: latest
      field: cancel_reason
      filters:
        event_type: series_visit_cancelled
        minutes_late: null
    - table: series_events
      aggregate: count
      field: series_event_id
      within_months: 2
      filters:
        event_type: series_fee_assessed
    - category: package
      table: package_events
      aggregate: count
      field: package_event_id
      within_months: 3
      filters:
        event_type: package_visit_forfeited
    cross_category:
    - package
    - plan
    - hardship
- id: series_ext_package_portal_booking
  base_policy_refs:
  - series_agg_weekly_frequency
  - series_booking_eligibility
  overwrite:
  - base_policy: series_booking_eligibility
    superseded_clause: >-
      Each booking holds at most max_visits_per_booking_batch appointments, none later than booking_horizon_days calendar
      days after the booking date or after the series end date, and the series may not run longer than series_length_weeks_max
      weeks from its start date.
    replaced_by: >-
      A package portal booking opens the lesser of the package portal window appointments, the package portal cover limit,
      the package portal clearance limit and the package portal expiry limit, and never fewer than zero.
  trigger: on_request
  subject:
  - series_visits_booked
  computes: visits
  target_tool: book_package_portal_visits_336412d0
  params:
    bp_standard_batch: 4
    bp_mid_batch: 6
    bp_window_three_fees_days: 28
    bp_window_some_fees_days: 35
    bp_recent_clearance_days: 30
    bp_older_clearance_days: 90
    bp_long_runway_days: 90
    bp_short_runway_days: 30
  rule: >-
    A package portal booking is the batch of standing appointments a patient books for themselves through the patient portal
    on an appointment series funded by a Self-Pay Visit Package. Before any adjustment, a package portal booking opens the
    standing appointments that fit in a window of booking_horizon_days calendar days from the booking date, ending no later
    than the series end date: the window's calendar days are divided by seven and rounded down to whole weeks, the whole
    weeks are multiplied by the series' standing appointments per week, the appointments still booked on the series are
    subtracted, and the result is limited to bp_standard_batch appointments and never falls below zero. The number of appointments
    a package portal booking opens is fixed only after a no-show on the series' first appointment within its fee assessment
    period carries its first-appointment no-show fee entry. A package portal booking is not opened until every late arrival
    beyond the grace period recorded on the series as a zero-notice cancellation within its fee assessment period shows
    a late-arrival fee entry. The package portal booking count is fixed only after every same-day cancellation recorded
    on the series within its fee assessment period carries its same-day cancellation fee entry. The package portal window
    is bp_window_three_fees_days calendar days where the series shows three or more missed-visit fees assessed in the two
    months up to the booking date (an entry counts when fewer than two whole months separate its date from the booking date),
    bp_window_some_fees_days calendar days where it shows one or two such fees, and booking_horizon_days calendar days where
    it shows none; in every case the window still ends no later than the series end date. The package portal window appointments
    are the window's whole weeks multiplied by the series' standing appointments per week, less the appointments still booked
    on the series. Each appointment draws extended_visit_draw visits from the funding package on an Extended 60-Minute Visit
    Series and one visit on any other format, and the package's covered appointments are its visits remaining less the visits
    drawn by the appointments still booked on the series, divided by the visits one appointment draws and rounded down.
    The first installment of a package is due on its purchase date and each later installment installment_interval_days
    calendar days after the previous due date, and an installment counts as overdue once more than installment_late_days
    calendar days have passed since its due date while it is unpaid. The package portal cover limit follows how the funding
    package is being paid for: where the amount paid on the package has reached its purchase price, the limit is the package's
    covered appointments; where the package is being paid in installments, is not yet fully paid and has every installment
    paid whose due date is more than installment_late_days calendar days past, the limit is the package's covered appointments
    but no more than one installment's credit of visits, visits_included divided by installment_count and rounded down;
    where an overdue installment is still unpaid, the limit is bp_standard_batch appointments. The package portal clearance
    limit is max_visits_per_booking_batch of the format where the pre-visit clearance on the series is dated no more than
    bp_recent_clearance_days calendar days before the booking date, bp_mid_batch appointments where it is dated more than
    bp_recent_clearance_days but no more than bp_older_clearance_days days before, and bp_standard_batch appointments where
    it is older or the series carries no clearance date. The package portal expiry limit is max_visits_per_booking_batch
    of the format where the funding package's expiry date is more than bp_long_runway_days calendar days after the booking
    date, bp_mid_batch appointments where it is more than bp_short_runway_days but no more than bp_long_runway_days days
    after, and bp_standard_batch appointments where it is bp_short_runway_days days or fewer after. A package portal booking
    opens the lesser of the package portal window appointments, the package portal cover limit, the package portal clearance
    limit and the package portal expiry limit, and never fewer than zero.
  prerequisite:
  - problem: series_ext_first_visit_no_show_fee
    kind: value_input
    gate: bp_fees
    form: state
    policy_source: >-
      The number of appointments a package portal booking opens is fixed only after a no-show on the series' first appointment
      within its fee assessment period carries its first-appointment no-show fee entry.
    condition: >-
      Where the series shows a series_no_show entry dated on the series start date whose appointment date lies no more than
      fee_assessment_days calendar days before the handling date, a series_fee_assessed entry of fee_kind no_show points
      at it through source_event_id.
    resolved_by: assess_first_visit_no_show_fee_a4cbc15c
    effect: >-
      The first-appointment no-show fee entry adds one to the missed-visit fees assessed on the series in the two months
      up to the booking date, which can shorten the package portal window by a tier.
  - problem: series_ext_late_arrival_fee
    kind: value_input
    gate: bp_fees
    form: state
    policy_source: >-
      A package portal booking is not opened until every late arrival beyond the grace period recorded on the series as
      a zero-notice cancellation within its fee assessment period shows a late-arrival fee entry.
    condition: >-
      Every zero-notice series_visit_cancelled entry carrying minutes late on the series whose appointment date lies no
      more than fee_assessment_days calendar days before the handling date has a series_fee_assessed entry pointing at it
      through source_event_id.
    resolved_by: assess_late_arrival_fee_e6f6ddb6
    effect: >-
      The late-arrival fee entry adds one to the missed-visit fees assessed on the series in the two months up to the booking
      date, which can shorten the package portal window by a tier.
  - problem: series_ext_same_day_cancellation_fee
    kind: value_input
    gate: bp_fees
    form: state
    policy_source: >-
      The package portal booking count is fixed only after every same-day cancellation recorded on the series within its
      fee assessment period carries its same-day cancellation fee entry.
    condition: >-
      Every series_visit_cancelled entry on the series that the patient, not the clinic, made on its own appointment day
      ahead of the start and that carries no minutes late, with an appointment date no more than fee_assessment_days calendar
      days before the handling date, has a series_fee_assessed entry pointing at it through source_event_id.
    resolved_by: assess_same_day_cancellation_fee_8648d00e
    effect: >-
      The same-day cancellation fee entry adds one to the missed-visit fees assessed on the series in the two months up
      to the booking date, which can shorten the package portal window by a tier.
  cross_category:
  - category: package
    as: branch
    reads:
    - visits_remaining
    - extended_visit_draw
    - amount_paid_total
    - purchase_price
    - opened_date
    - installments_total
    - installment_interval_days
    - installment_late_days
    - visits_included
    - expiry_date
    - package_events.event_type
    note: >-
      The package portal cover limit reads how the funding package is being paid for (amount paid, price, installment schedule
      and the installment payments in its history) and its visits remaining; the expiry limit reads its expiry date.
  compute:
  - bp_fees: COUNT('series_events', within_months=2, event_type='series_fee_assessed')
  - bp_window_days: >-
      K('bp_window_three_fees_days') if bp_fees >= 3 else (K('bp_window_some_fees_days') if bp_fees >= 1 else P('booking_horizon_days'))
  - bp_days_to_end: DAYS(NOW, F('series_end_date'))
  - bp_weeks: MX(0, MN(bp_window_days, bp_days_to_end)) // 7
  - bp_window_appts: bp_weeks * F('visits_per_week') - F('booked_visits_remaining')
  - bp_draw_per_appt: >-
      (CPARAM('package', 'extended_visit_draw', package_id=F('package_id')) or 1) if F('variant_name') == 'Extended 60-Minute
      Visit Series' else 1
  - bp_pkg_left: CFIELD('package', 'visits_remaining', package_id=F('package_id')) or 0
  - bp_covered: (bp_pkg_left - bp_draw_per_appt * F('booked_visits_remaining')) // bp_draw_per_appt
  - bp_paid: CFIELD('package', 'amount_paid_total', package_id=F('package_id')) or 0
  - bp_price: CFIELD('package', 'purchase_price', package_id=F('package_id')) or 0
  - bp_opened: CFIELD('package', 'opened_date', package_id=F('package_id')) or NOW
  - bp_inst_total: CFIELD('package', 'installments_total', package_id=F('package_id')) or 1
  - bp_interval: CPARAM('package', 'installment_interval_days', package_id=F('package_id')) or 1
  - bp_late: CPARAM('package', 'installment_late_days', package_id=F('package_id')) or 0
  - bp_purchase_days: DAYS(bp_opened, NOW)
  - bp_inst_overdue: MN(bp_inst_total, (bp_purchase_days - bp_late - 1) // bp_interval + 1) if bp_purchase_days > bp_late
      else 0
  - bp_inst_paid: >-
      XCOUNT('package', 'package_events', event_type='package_payment_received', payment_kind='installment', package_id=F('package_id'))
  - bp_inst_credit: (CPARAM('package', 'visits_included', package_id=F('package_id')) or 0) // bp_inst_total
  - bp_cover_limit: >-
      bp_covered if (bp_price > 0 and bp_paid >= bp_price) else (MN(bp_covered, bp_inst_credit) if (bp_paid < bp_price and
      bp_inst_paid >= bp_inst_overdue) else K('bp_standard_batch'))
  - bp_clearance_days: DAYS(F('clearance_date') or '1900-01-01', NOW)
  - bp_clearance_limit: >-
      P('max_visits_per_booking_batch') if bp_clearance_days <= K('bp_recent_clearance_days') else (K('bp_mid_batch') if
      bp_clearance_days <= K('bp_older_clearance_days') else K('bp_standard_batch'))
  - bp_expiry: CFIELD('package', 'expiry_date', package_id=F('package_id')) or '1900-01-01'
  - bp_runway: DAYS(NOW, bp_expiry)
  - bp_expiry_limit: >-
      P('max_visits_per_booking_batch') if bp_runway > K('bp_long_runway_days') else (K('bp_mid_batch') if bp_runway > K('bp_short_runway_days')
      else K('bp_standard_batch'))
  - result: MX(0, MN(bp_window_appts, bp_cover_limit, bp_clearance_limit, bp_expiry_limit))
  compute_basis:
    bp_fees: >-
      where the series shows three or more missed-visit fees assessed in the two months up to the booking date (an entry
      counts when fewer than two whole months separate its date from the booking date),
    bp_window_days: >-
      The package portal window is bp_window_three_fees_days calendar days where the series shows three or more missed-visit
      fees assessed in the two months up to the booking date (an entry counts when fewer than two whole months separate
      its date from the booking date), bp_window_some_fees_days calendar days where it shows one or two such fees, and booking_horizon_days
      calendar days where it shows none;
    bp_days_to_end: in every case the window still ends no later than the series end date.
    bp_weeks: the window's calendar days are divided by seven and rounded down to whole weeks,
    bp_window_appts: >-
      The package portal window appointments are the window's whole weeks multiplied by the series' standing appointments
      per week, less the appointments still booked on the series.
    bp_draw_per_appt: >-
      Each appointment draws extended_visit_draw visits from the funding package on an Extended 60-Minute Visit Series and
      one visit on any other format,
    bp_pkg_left: >-
      the package's covered appointments are its visits remaining less the visits drawn by the appointments still booked
      on the series, divided by the visits one appointment draws and rounded down.
    bp_covered: >-
      the package's covered appointments are its visits remaining less the visits drawn by the appointments still booked
      on the series, divided by the visits one appointment draws and rounded down.
    bp_paid: >-
      where the amount paid on the package has reached its purchase price, the limit is the package's covered appointments;
    bp_price: >-
      where the amount paid on the package has reached its purchase price, the limit is the package's covered appointments;
    bp_opened: The first installment of a package is due on its purchase date
    bp_inst_total: visits_included divided by installment_count and rounded down;
    bp_interval: each later installment installment_interval_days calendar days after the previous due date,
    bp_late: >-
      an installment counts as overdue once more than installment_late_days calendar days have passed since its due date
      while it is unpaid.
    bp_purchase_days: >-
      The first installment of a package is due on its purchase date and each later installment installment_interval_days
      calendar days after the previous due date, and an installment counts as overdue once more than installment_late_days
      calendar days have passed since its due date while it is unpaid.
    bp_inst_overdue: >-
      The first installment of a package is due on its purchase date and each later installment installment_interval_days
      calendar days after the previous due date, and an installment counts as overdue once more than installment_late_days
      calendar days have passed since its due date while it is unpaid.
    bp_inst_paid: has every installment paid whose due date is more than installment_late_days calendar days past,
    bp_inst_credit: >-
      no more than one installment's credit of visits, visits_included divided by installment_count and rounded down;
    bp_cover_limit: >-
      The package portal cover limit follows how the funding package is being paid for: where the amount paid on the package
      has reached its purchase price, the limit is the package's covered appointments; where the package is being paid in
      installments, is not yet fully paid and has every installment paid whose due date is more than installment_late_days
      calendar days past, the limit is the package's covered appointments but no more than one installment's credit of visits,
      visits_included divided by installment_count and rounded down; where an overdue installment is still unpaid, the limit
      is bp_standard_batch appointments.
    bp_clearance_days: >-
      where the pre-visit clearance on the series is dated no more than bp_recent_clearance_days calendar days before the
      booking date,
    bp_clearance_limit: >-
      The package portal clearance limit is max_visits_per_booking_batch of the format where the pre-visit clearance on
      the series is dated no more than bp_recent_clearance_days calendar days before the booking date, bp_mid_batch appointments
      where it is dated more than bp_recent_clearance_days but no more than bp_older_clearance_days days before, and bp_standard_batch
      appointments where it is older or the series carries no clearance date.
    bp_expiry: where the funding package's expiry date is more than bp_long_runway_days calendar days after the booking
      date,
    bp_runway: where the funding package's expiry date is more than bp_long_runway_days calendar days after the booking
      date,
    bp_expiry_limit: >-
      The package portal expiry limit is max_visits_per_booking_batch of the format where the funding package's expiry date
      is more than bp_long_runway_days calendar days after the booking date, bp_mid_batch appointments where it is more
      than bp_short_runway_days but no more than bp_long_runway_days days after, and bp_standard_batch appointments where
      it is bp_short_runway_days days or fewer after.
    result: >-
      A package portal booking opens the lesser of the package portal window appointments, the package portal cover limit,
      the package portal clearance limit and the package portal expiry limit, and never fewer than zero.
  factors:
  - id: package_portal_window
    effect: parameter
    decides: bp_window_days
    bindings:
    - bp_fees
    - bp_window_days
    ladder:
    - when: three or more missed-visit fees assessed on the series in the two months up to the booking date
      value: K('bp_window_three_fees_days')
    - when: one or two such fees
      value: K('bp_window_some_fees_days')
    - when: otherwise
      value: P('booking_horizon_days')
    baseline:
      bp_window_days: P('booking_horizon_days')
    evidence:
    - history
    cross_difficulty: null
  - id: package_portal_cover_limit
    effect: method
    decides: bp_cover_limit
    bindings:
    - bp_paid
    - bp_price
    - bp_opened
    - bp_inst_total
    - bp_interval
    - bp_late
    - bp_purchase_days
    - bp_inst_overdue
    - bp_inst_paid
    - bp_inst_credit
    - bp_cover_limit
    ladder:
    - when: the amount paid on the funding package has reached its purchase price
      method: the limit is the package's covered appointments
    - when: >-
        the package is being paid in installments, is not yet fully paid, and every installment more than installment_late_days
        days past its due date has been paid
      method: >-
        the limit is the package's covered appointments capped at one installment's credit of visits (visits_included divided
        by installment_count, rounded down)
    - when: otherwise (an overdue installment is still unpaid)
      method: the limit is the standard portal batch of bp_standard_batch appointments
    baseline:
      bp_cover_limit: K('bp_standard_batch')
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: package
  - id: package_portal_clearance_limit
    effect: parameter
    decides: bp_clearance_limit
    bindings:
    - bp_clearance_days
    - bp_clearance_limit
    ladder:
    - when: >-
        the pre-visit clearance on the series is dated no more than bp_recent_clearance_days calendar days before the booking
        date
      value: P('max_visits_per_booking_batch')
    - when: dated more than bp_recent_clearance_days but no more than bp_older_clearance_days days before
      value: K('bp_mid_batch')
    - when: otherwise
      value: K('bp_standard_batch')
    baseline:
      bp_clearance_limit: K('bp_standard_batch')
    evidence:
    - date
    cross_difficulty: null
  - id: package_portal_expiry_limit
    effect: parameter
    decides: bp_expiry_limit
    bindings:
    - bp_expiry
    - bp_runway
    - bp_expiry_limit
    ladder:
    - when: the funding package's expiry date is more than bp_long_runway_days calendar days after the booking date
      value: P('max_visits_per_booking_batch')
    - when: more than bp_short_runway_days but no more than bp_long_runway_days days after
      value: K('bp_mid_batch')
    - when: otherwise (bp_short_runway_days days or fewer)
      value: K('bp_standard_batch')
    baseline:
      bp_expiry_limit: K('bp_standard_batch')
    evidence:
    - cross_category
    - date
    cross_difficulty: package
  baseline:
    rule: >-
      Before any adjustment, a package portal booking opens the standing appointments that fit in a window of booking_horizon_days
      calendar days from the booking date, ending no later than the series end date: the window's calendar days are divided
      by seven and rounded down to whole weeks, the whole weeks are multiplied by the series' standing appointments per
      week, the appointments still booked on the series are subtracted, and the result is limited to bp_standard_batch appointments
      and never falls below zero.
    params:
    - booking_horizon_days
    - bp_standard_batch
  inputs:
    history:
    - table: series_events
      aggregate: count
      field: series_event_id
      within_months: 2
      filters:
        event_type: series_fee_assessed
    - category: package
      table: package_events
      aggregate: count
      field: package_event_id
      filters:
        event_type: package_payment_received
        payment_kind: installment
    cross_category:
    - package
