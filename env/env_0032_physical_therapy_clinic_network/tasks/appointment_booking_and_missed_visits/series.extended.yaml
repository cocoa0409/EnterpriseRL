      value: K('ns_peak_slot_pct')
    - when: it started from 08:00 up to but not including 10:00, or from 15:00 up to but not including 17:00
      value: K('ns_shoulder_slot_pct')
    - when: otherwise (from 10:00 up to but not including 15:00)
      value: '100'
    baseline:
      ns_slot_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: no_show_attendance_share
    effect: parameter
    decides: ns_tenure_pct
    bindings:
    - ns_attended
    - ns_tenure_pct
    ladder:
    - when: the series shows at least ns_long_tenure_visits attended appointments
      value: K('ns_long_tenure_pct')
    - when: the series shows at least ns_short_tenure_visits but fewer than ns_long_tenure_visits attended appointments
      value: K('ns_short_tenure_pct')
    - when: otherwise
      value: '100'
    baseline:
      ns_tenure_pct: '100'
    evidence:
    - history
    cross_difficulty: null
  - id: no_show_membership_miss_share
    effect: parameter
    decides: ns_member_pct
    bindings:
    - ns_member_misses
    - ns_member_pct
    ladder:
    - when: >-
        two or more maintenance sessions forfeited on the patient's wellness membership in the three months up to the assessment
        date
      value: K('ns_two_member_misses_pct')
    - when: exactly one such forfeited maintenance session
      value: K('ns_one_member_miss_pct')
    - when: otherwise
      value: '100'
    baseline:
      ns_member_pct: '100'
    evidence:
    - cross_category
    - history
    cross_difficulty: membership
  - id: no_show_hardship_share
    effect: parameter
    decides: ns_hardship_pct
    bindings:
    - ns_hs_effective
    - ns_hs_expiry
    - ns_hs_level
    - ns_hardship_pct
    ladder:
    - when: >-
        an approved hardship determination is in force (effective date arrived and expiry date not passed) and its level's
        discount_percent is ns_full_hardship_level or more
      value: '0'
    - when: >-
        an approved hardship determination is in force and its level's discount_percent is above zero but below ns_full_hardship_level
      value: 100 less the level's discount_percent
    - when: otherwise
      value: '100'
    baseline:
      ns_hardship_pct: '100'
    evidence:
    - cross_category
    - date
    cross_difficulty: hardship
  baseline:
    rule: Before any adjustment, the no-show fee is no_show_fee of the series' format, rounded to the nearest cent.
    params:
    - no_show_fee
  inputs:
    history:
    - table: series_events
      aggregate: latest
      field: appointment_time
      filters:
        event_type: series_no_show
    - table: series_events
      aggregate: count
      field: series_event_id
      within_months: 2
      filters:
        event_type: series_fee_assessed
    - table: series_events
      aggregate: count
      field: series_event_id
      filters:
        event_type: series_visit_attended
    - category: membership
      table: membership_events
      aggregate: count
      field: membership_event_id
      within_months: 3
      filters:
        event_type: membership_session_forfeited
    cross_category:
    - plan
    - package
    - membership
    - hardship
- id: series_ext_insured_portal_booking
  base_policy_refs:
  - series_agg_weekly_frequency
  - series_booking_eligibility
  overwrite:
  - base_policy: series_booking_eligibility
    superseded_clause: >-
      Each booking holds at most max_visits_per_booking_batch appointments, none later than booking_horizon_days calendar
      days after the booking date or after the series end date, and the series may not run longer than series_length_weeks_max
      weeks from its start date.
    replaced_by: >-
      An insured portal booking opens the lesser of the insured portal window appointments, the insured portal plan limit
      and the insured portal attendance limit, and never fewer than zero.
  trigger: on_request
  subject:
  - series_visits_booked
  computes: visits
  target_tool: book_insured_portal_visits_a191f0e3
  params:
    bi_standard_batch: 4
    bi_mid_batch: 6
    bi_window_two_fees_days: 21
    bi_window_one_fee_days: 28
    bi_late_series_days: 35
    bi_mid_series_days: 21
    bi_long_attendance_visits: 8
    bi_short_attendance_visits: 4
    bi_reverify_months: 12
  rule: >-
    An insured portal booking is the batch of standing appointments a patient books for themselves through the patient portal
    on an appointment series funded by an Insured Plan of Care. Before any adjustment, an insured portal booking opens the
    standing appointments that fit in a window of booking_horizon_days calendar days from the booking date, ending no later
    than the series end date: the window's calendar days are divided by seven and rounded down to whole weeks, the whole
    weeks are multiplied by the series' standing appointments per week, the appointments still booked on the series are
    subtracted, and the result is limited to bi_standard_batch appointments and never falls below zero. The number of appointments
    an insured portal booking opens is fixed only after every late cancellation received before its appointment day and
    recorded on the series within its fee assessment period shows a late-cancellation fee entry. An insured portal booking
    is not opened until every no-show recorded on the series within its fee assessment period, other than one on the series'
    first appointment, shows a no-show fee entry. The insured portal window is bi_window_two_fees_days calendar days where
    the series shows two or more missed-visit fees assessed in the two months up to the booking date (an entry counts when
    fewer than two whole months separate its date from the booking date), bi_window_one_fee_days calendar days where it
    shows exactly one such fee, and booking_horizon_days calendar days where it shows none; in every case the window still
    ends no later than the series end date. The insured portal weekly count is visits_per_week_min of the format where the
    series started bi_late_series_days or more calendar days before the booking date, the series' standing appointments
    per week less one but never below visits_per_week_min where it started at least bi_mid_series_days but fewer than bi_late_series_days
    calendar days before, and the series' standing appointments per week where it started fewer than bi_mid_series_days
    calendar days before. The insured portal window appointments are the window's whole weeks multiplied by the insured
    portal weekly count, less the appointments still booked on the series. The insured portal plan limit is the plan's authorized
    visits remaining less the appointments still booked on the series where the payer program of the funding plan requires
    prior authorization and the plan's authorization end date has not passed, max_visits_per_booking_batch of the format
    where the payer program requires no prior authorization and the plan's benefits were verified fewer than bi_reverify_months
    whole months before the booking date, and bi_standard_batch appointments in every other case. The insured portal attendance
    limit is max_visits_per_booking_batch of the format where the series shows at least bi_long_attendance_visits attended
    appointments, bi_mid_batch appointments where it shows at least bi_short_attendance_visits but fewer than bi_long_attendance_visits
    attended appointments, and bi_standard_batch appointments where it shows fewer than bi_short_attendance_visits. An insured
    portal booking opens the lesser of the insured portal window appointments, the insured portal plan limit and the insured
    portal attendance limit, and never fewer than zero.
  prerequisite:
  - problem: series_ext_late_cancellation_fee
    kind: value_input
    gate: bi_fees
    form: state
    policy_source: >-
      The number of appointments an insured portal booking opens is fixed only after every late cancellation received before
      its appointment day and recorded on the series within its fee assessment period shows a late-cancellation fee entry.
    condition: >-
      Every late cancellation received before its appointment day (series_visit_cancelled with event_date earlier than appointment_date,
      notice below late_cancel_notice_hours, not cancelled by the clinic) on the series whose appointment date lies no more
      than fee_assessment_days calendar days before the handling date has a series_fee_assessed entry of fee_kind late_cancellation
      pointing at it through source_event_id.
    resolved_by: assess_late_cancellation_fee_706e910e
    effect: >-
      The late-cancellation fee entry adds one to the missed-visit fees assessed on the series in the two months up to the
      booking date, which can shorten the insured portal window by a tier.
  - problem: series_ext_no_show_fee
    kind: value_input
    gate: bi_fees
    form: state
    policy_source: >-
      An insured portal booking is not opened until every no-show recorded on the series within its fee assessment period,
      other than one on the series' first appointment, shows a no-show fee entry.
    condition: >-
      Every series_no_show entry on the series, other than one on the series' first appointment, whose appointment date
      lies no more than fee_assessment_days calendar days before the handling date has a series_fee_assessed entry of fee_kind
      no_show pointing at it through source_event_id.
    resolved_by: assess_no_show_fee_93f38688
    effect: >-
      The no-show fee entry adds one to the missed-visit fees assessed on the series in the two months up to the booking
      date, which can shorten the insured portal window by a tier.
  cross_category:
  - category: plan
    as: branch
    reads:
    - prior_auth_required
    - auth_end_date
    - authorized_visits_remaining
    - benefits_verified_date
    note: >-
      The insured portal plan limit reads the funding plan's prior-authorization requirement, authorization and benefit
      verification.
  compute:
  - bi_fees: COUNT('series_events', within_months=2, event_type='series_fee_assessed')
  - bi_window_days: >-
      K('bi_window_two_fees_days') if bi_fees >= 2 else (K('bi_window_one_fee_days') if bi_fees == 1 else P('booking_horizon_days'))
  - bi_days_to_end: DAYS(NOW, F('series_end_date'))
  - bi_weeks: MX(0, MN(bi_window_days, bi_days_to_end)) // 7
  - bi_series_days: DAYS(F('series_start_date'), NOW)
  - bi_weekly: >-
      P('visits_per_week_min') if bi_series_days >= K('bi_late_series_days') else (MX(P('visits_per_week_min'), F('visits_per_week')
      - 1) if bi_series_days >= K('bi_mid_series_days') else F('visits_per_week'))
  - bi_window_appts: bi_weeks * bi_weekly - F('booked_visits_remaining')
  - bi_auth_required: CPARAM('plan', 'prior_auth_required', care_plan_id=F('care_plan_id'))
  - bi_auth_end: CFIELD('plan', 'auth_end_date', care_plan_id=F('care_plan_id')) or '1900-01-01'
  - bi_auth_left: CFIELD('plan', 'authorized_visits_remaining', care_plan_id=F('care_plan_id')) or 0
  - bi_verified: CFIELD('plan', 'benefits_verified_date', care_plan_id=F('care_plan_id')) or '1900-01-01'
  - bi_plan_limit: >-
      (bi_auth_left - F('booked_visits_remaining')) if (bi_auth_required == True and DAYS(NOW, bi_auth_end) >= 0) else (P('max_visits_per_booking_batch')
      if (bi_auth_required == False and MONTHS(bi_verified, NOW) < K('bi_reverify_months')) else K('bi_standard_batch'))
  - bi_attended: COUNT('series_events', event_type='series_visit_attended')
  - bi_attendance_limit: >-
      P('max_visits_per_booking_batch') if bi_attended >= K('bi_long_attendance_visits') else (K('bi_mid_batch') if bi_attended
      >= K('bi_short_attendance_visits') else K('bi_standard_batch'))
  - result: MX(0, MN(bi_window_appts, bi_plan_limit, bi_attendance_limit))
  compute_basis:
    bi_fees: >-
      where the series shows two or more missed-visit fees assessed in the two months up to the booking date (an entry counts
      when fewer than two whole months separate its date from the booking date),
    bi_window_days: >-
      The insured portal window is bi_window_two_fees_days calendar days where the series shows two or more missed-visit
      fees assessed in the two months up to the booking date (an entry counts when fewer than two whole months separate
      its date from the booking date), bi_window_one_fee_days calendar days where it shows exactly one such fee, and booking_horizon_days
      calendar days where it shows none;
    bi_days_to_end: in every case the window still ends no later than the series end date.
    bi_weeks: the window's calendar days are divided by seven and rounded down to whole weeks,
    bi_series_days: where the series started bi_late_series_days or more calendar days before the booking date,
    bi_weekly: >-
      The insured portal weekly count is visits_per_week_min of the format where the series started bi_late_series_days
      or more calendar days before the booking date, the series' standing appointments per week less one but never below
      visits_per_week_min where it started at least bi_mid_series_days but fewer than bi_late_series_days calendar days
      before, and the series' standing appointments per week where it started fewer than bi_mid_series_days calendar days
      before.
    bi_window_appts: >-
      The insured portal window appointments are the window's whole weeks multiplied by the insured portal weekly count,
      less the appointments still booked on the series.
    bi_auth_required: >-
      where the payer program of the funding plan requires prior authorization and the plan's authorization end date has
      not passed,
    bi_auth_end: >-
      where the payer program of the funding plan requires prior authorization and the plan's authorization end date has
      not passed,
    bi_auth_left: >-
      The insured portal plan limit is the plan's authorized visits remaining less the appointments still booked on the
      series
    bi_verified: >-
      where the payer program requires no prior authorization and the plan's benefits were verified fewer than bi_reverify_months
      whole months before the booking date,
    bi_plan_limit: >-
      The insured portal plan limit is the plan's authorized visits remaining less the appointments still booked on the
      series where the payer program of the funding plan requires prior authorization and the plan's authorization end date
      has not passed, max_visits_per_booking_batch of the format where the payer program requires no prior authorization
      and the plan's benefits were verified fewer than bi_reverify_months whole months before the booking date, and bi_standard_batch
      appointments in every other case.
    bi_attended: where the series shows at least bi_long_attendance_visits attended appointments,
    bi_attendance_limit: >-
      The insured portal attendance limit is max_visits_per_booking_batch of the format where the series shows at least
      bi_long_attendance_visits attended appointments, bi_mid_batch appointments where it shows at least bi_short_attendance_visits
      but fewer than bi_long_attendance_visits attended appointments, and bi_standard_batch appointments where it shows
      fewer than bi_short_attendance_visits.
    result: >-
      An insured portal booking opens the lesser of the insured portal window appointments, the insured portal plan limit
      and the insured portal attendance limit, and never fewer than zero.
  factors:
  - id: insured_portal_window
    effect: parameter
    decides: bi_window_days
    bindings:
    - bi_fees
    - bi_window_days
    ladder:
    - when: two or more missed-visit fees assessed on the series in the two months up to the booking date
      value: K('bi_window_two_fees_days')
    - when: exactly one such fee
      value: K('bi_window_one_fee_days')
    - when: otherwise
      value: P('booking_horizon_days')
    baseline:
      bi_window_days: P('booking_horizon_days')
    evidence:
    - history
    cross_difficulty: null
  - id: insured_portal_weekly_count
    effect: parameter
    decides: bi_weekly
    bindings:
    - bi_series_days
    - bi_weekly
    ladder:
    - when: the series started bi_late_series_days or more calendar days before the booking date
      value: P('visits_per_week_min')
    - when: >-
        the series started at least bi_mid_series_days but fewer than bi_late_series_days calendar days before the booking
        date
      value: the standing appointments per week less one, never below P('visits_per_week_min')
    - when: otherwise
      value: F('visits_per_week')
    baseline:
      bi_weekly: F('visits_per_week')
    evidence:
    - date
    cross_difficulty: null
  - id: insured_portal_plan_limit
    effect: method
    decides: bi_plan_limit
    bindings:
    - bi_auth_required
    - bi_auth_end
    - bi_auth_left
    - bi_verified
    - bi_plan_limit
    ladder:
    - when: >-
        the funding plan's payer program requires prior authorization and the plan's authorization end date has not passed
      method: the limit is the plan's authorized visits remaining less the appointments still booked on the series
    - when: >-
        the payer program requires no prior authorization and the plan's benefits were verified fewer than bi_reverify_months
        whole months before the booking date
      method: the limit is max_visits_per_booking_batch of the format
    - when: otherwise
      method: the limit is the standard portal batch of bi_standard_batch appointments
    baseline:
      bi_plan_limit: K('bi_standard_batch')
    evidence:
    - cross_category
    - date
    cross_difficulty: plan
  - id: insured_portal_attendance_limit
    effect: parameter
    decides: bi_attendance_limit
    bindings:
    - bi_attended
    - bi_attendance_limit
    ladder:
    - when: the series shows at least bi_long_attendance_visits attended appointments
      value: P('max_visits_per_booking_batch')
    - when: >-
        the series shows at least bi_short_attendance_visits but fewer than bi_long_attendance_visits attended appointments
      value: K('bi_mid_batch')
    - when: otherwise
      value: K('bi_standard_batch')
    baseline:
      bi_attendance_limit: K('bi_standard_batch')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      Before any adjustment, an insured portal booking opens the standing appointments that fit in a window of booking_horizon_days
      calendar days from the booking date, ending no later than the series end date: the window's calendar days are divided
      by seven and rounded down to whole weeks, the whole weeks are multiplied by the series' standing appointments per
      week, the appointments still booked on the series are subtracted, and the result is limited to bi_standard_batch appointments
      and never falls below zero.
    params:
    - booking_horizon_days
    - bi_standard_batch
  inputs:
    history:
    - table: series_events
      aggregate: count
      field: series_event_id
      within_months: 2
      filters:
        event_type: series_fee_assessed
    - table: series_events
      aggregate: count
      field: series_event_id
      filters:
        event_type: series_visit_attended
    cross_category:
    - plan
- id: series_ext_first_visit_no_show_fee
  base_policy_refs:
  - series_evt_missed_visit_fees
  overwrite:
  - base_policy: series_evt_missed_visit_fees
    superseded_clause: A late cancellation is charged late_cancel_fee and a no-show is charged no_show_fee of the series'
      format.
    replaced_by: >-
      The first-appointment no-show fee is the first-appointment no-show basis multiplied by the first-appointment lead-time
      share, the first-appointment package-forfeit share and the first-appointment hardship share, each share read as a
      percentage of the basis.
  trigger: state_due
  subject:
  - series_fee_assessed
  computes: amount
  target_tool: assess_first_visit_no_show_fee_a4cbc15c
  params:
    fv_package_cash_share_pct: 50
    fv_short_lead_days: 2
    fv_mid_lead_days: 6
    fv_short_lead_pct: 50
    fv_mid_lead_pct: 75
    fv_two_forfeits_pct: 150
    fv_one_forfeit_pct: 125
    fv_full_hardship_level: 75
  rule: >-
    A first-appointment no-show fee is charged where the patient neither attended nor cancelled the first appointment of
    a series, the appointment dated on the series start date, and only where fee_on_first_appointment of the series' format
    is true. Before any adjustment, the first-appointment no-show fee is no_show_fee of the series' format, rounded to the
    nearest cent. The first-appointment no-show basis follows the funding of the series: where the series is funded by a
    Self-Pay Visit Package whose tier lists a single_visit_cash_rate above zero, the basis is fv_package_cash_share_pct
    percent of that single_visit_cash_rate; where the series is funded by an Insured Plan of Care whose verified copay is
    above zero, the basis is the lesser of no_show_fee and that copay; for any other series the basis is no_show_fee. The
    first-appointment lead-time share is measured from the date the booking that holds the first appointment was made to
    the series start date, in calendar days: it is fv_short_lead_pct percent where that booking was made no more than fv_short_lead_days
    days ahead, fv_mid_lead_pct percent where it was made more than fv_short_lead_days but no more than fv_mid_lead_days
    days ahead, and 100 percent where it was made more than fv_mid_lead_days days ahead. The first-appointment package-forfeit
    share is fv_two_forfeits_pct percent where the patient's Self-Pay Visit Package history shows two or more package visits
    forfeited for missed appointments in the three months up to the assessment date (an entry counts when fewer than three
    whole months separate its date from the assessment date), fv_one_forfeit_pct percent where it shows exactly one, and
    100 percent where it shows none. The first-appointment hardship share is 0 percent where the patient holds an approved
    hardship determination whose effective date has arrived and whose expiry date has not passed at a level whose discount_percent
    is fv_full_hardship_level or more, 100 percent less the level's discount_percent where such an approved determination
    in force discounts more than zero but less than fv_full_hardship_level percent, and 100 percent where no approved determination
    is in force. The first-appointment no-show fee is the first-appointment no-show basis multiplied by the first-appointment
    lead-time share, the first-appointment package-forfeit share and the first-appointment hardship share, each share read
    as a percentage of the basis. The three first-appointment shares multiply one and the same basis, so the order of the
    multiplications is immaterial, and the product is rounded to the nearest cent once, as the last step.
  prerequisite: []
  cross_category:
  - category: package
    as: branch
    reads:
    - single_visit_cash_rate
    - package_events.event_type
    note: >-
      The first-appointment basis reads the funding package tier's cash rate; the package-forfeit share counts the patient's
      forfeited package visits.
  - category: plan
    as: branch
    reads:
    - copay_amount
    note: The first-appointment basis reads the verified copay where an Insured Plan of Care funds the series.
  - category: hardship
    as: branch
    reads:
    - status
    - effective_date
    - expiry_date
    - discount_percent
    note: The first-appointment hardship share reads the patient's approved hardship determination.
  compute:
  - fv_first_missed: COUNT('series_events', event_type='series_no_show', appointment_date=F('series_start_date'))
  - fv_booked_on: >-
      LATEST('series_events', 'event_date', event_type='series_visits_booked', appointment_date=F('series_start_date'))
      or F('opened_date')
  - fv_lead_days: DAYS(fv_booked_on, F('series_start_date'))
  - fv_lead_pct: >-
      K('fv_short_lead_pct') if fv_lead_days <= K('fv_short_lead_days') else (K('fv_mid_lead_pct') if fv_lead_days <= K('fv_mid_lead_days')
      else 100)
  - fv_cash_rate: CPARAM('package', 'single_visit_cash_rate', package_id=F('package_id')) or 0
  - fv_copay: CFIELD('plan', 'copay_amount', care_plan_id=F('care_plan_id')) or 0
  - fv_base: >-
      fv_cash_rate * K('fv_package_cash_share_pct') / 100 if (F('funding_source') == 'self_pay_package' and fv_cash_rate
      > 0) else (MN(P('no_show_fee'), fv_copay) if (F('funding_source') == 'insurance_plan' and fv_copay > 0) else P('no_show_fee'))
  - fv_forfeits: XCOUNT('package', 'package_events', within_months=3, event_type='package_visit_forfeited')
  - fv_forfeit_pct: K('fv_two_forfeits_pct') if fv_forfeits >= 2 else (K('fv_one_forfeit_pct') if fv_forfeits == 1 else
      100)
  - fv_hs_effective: CFIELD('hardship', 'effective_date', status='approved') or '2999-12-31'
  - fv_hs_expiry: CFIELD('hardship', 'expiry_date', status='approved') or '1900-01-01'
  - fv_hs_level: CPARAM('hardship', 'discount_percent', status='approved') or 0
  - fv_hardship_pct: >-
      0 if (DAYS(fv_hs_effective, NOW) >= 0 and DAYS(NOW, fv_hs_expiry) >= 0 and fv_hs_level >= K('fv_full_hardship_level'))
      else ((100 - fv_hs_level) if (DAYS(fv_hs_effective, NOW) >= 0 and DAYS(NOW, fv_hs_expiry) >= 0 and fv_hs_level > 0)
      else 100)
  - result: RND(fv_base * fv_lead_pct / 100 * fv_forfeit_pct / 100 * fv_hardship_pct / 100 * MN(1, fv_first_missed), 2)
  compute_basis:
    fv_first_missed: >-
      A first-appointment no-show fee is charged where the patient neither attended nor cancelled the first appointment
      of a series, the appointment dated on the series start date,
    fv_booked_on: >-
      The first-appointment lead-time share is measured from the date the booking that holds the first appointment was made
      to the series start date, in calendar days:
    fv_lead_days: >-
      The first-appointment lead-time share is measured from the date the booking that holds the first appointment was made
      to the series start date, in calendar days:
    fv_lead_pct: >-
      it is fv_short_lead_pct percent where that booking was made no more than fv_short_lead_days days ahead, fv_mid_lead_pct
      percent where it was made more than fv_short_lead_days but no more than fv_mid_lead_days days ahead, and 100 percent
      where it was made more than fv_mid_lead_days days ahead.
    fv_cash_rate: >-
      where the series is funded by a Self-Pay Visit Package whose tier lists a single_visit_cash_rate above zero, the basis
      is fv_package_cash_share_pct percent of that single_visit_cash_rate;
    fv_copay: >-
      where the series is funded by an Insured Plan of Care whose verified copay is above zero, the basis is the lesser
      of no_show_fee and that copay;
    fv_base: >-
      The first-appointment no-show basis follows the funding of the series: where the series is funded by a Self-Pay Visit
      Package whose tier lists a single_visit_cash_rate above zero, the basis is fv_package_cash_share_pct percent of that
      single_visit_cash_rate; where the series is funded by an Insured Plan of Care whose verified copay is above zero,
      the basis is the lesser of no_show_fee and that copay; for any other series the basis is no_show_fee.
    fv_forfeits: >-
      where the patient's Self-Pay Visit Package history shows two or more package visits forfeited for missed appointments
      in the three months up to the assessment date (an entry counts when fewer than three whole months separate its date
      from the assessment date),
    fv_forfeit_pct: >-
      The first-appointment package-forfeit share is fv_two_forfeits_pct percent where the patient's Self-Pay Visit Package
      history shows two or more package visits forfeited for missed appointments in the three months up to the assessment
      date (an entry counts when fewer than three whole months separate its date from the assessment date), fv_one_forfeit_pct
      percent where it shows exactly one, and 100 percent where it shows none.
    fv_hs_effective: >-
      where the patient holds an approved hardship determination whose effective date has arrived and whose expiry date
      has not passed
    fv_hs_expiry: >-
      where the patient holds an approved hardship determination whose effective date has arrived and whose expiry date
      has not passed
    fv_hs_level: >-
      at a level whose discount_percent is fv_full_hardship_level or more, 100 percent less the level's discount_percent
    fv_hardship_pct: >-
      The first-appointment hardship share is 0 percent where the patient holds an approved hardship determination whose
      effective date has arrived and whose expiry date has not passed at a level whose discount_percent is fv_full_hardship_level
      or more, 100 percent less the level's discount_percent where such an approved determination in force discounts more
      than zero but less than fv_full_hardship_level percent, and 100 percent where no approved determination is in force.
    result: >-
      The three first-appointment shares multiply one and the same basis, so the order of the multiplications is immaterial,
      and the product is rounded to the nearest cent once, as the last step.
  factors:
  - id: first_appointment_basis
    effect: method
    decides: fv_base
    bindings:
    - fv_cash_rate
    - fv_copay
    - fv_base
    ladder:
    - when: the series is funded by a Self-Pay Visit Package whose tier lists a single_visit_cash_rate above zero
      method: >-
        the first-appointment no-show basis is fv_package_cash_share_pct percent of the package tier's single_visit_cash_rate
    - when: the series is funded by an Insured Plan of Care whose verified copay is above zero
      method: the first-appointment no-show basis is the lesser of no_show_fee and the verified copay
    - when: otherwise
      method: the first-appointment no-show basis is no_show_fee of the series' format
    baseline:
      fv_base: P('no_show_fee')
    evidence:
    - cross_category
    - tier_param
    cross_difficulty: package
  - id: first_appointment_lead_time_share
    effect: parameter
    decides: fv_lead_pct
    bindings:
    - fv_booked_on
    - fv_lead_days
    - fv_lead_pct
    ladder:
    - when: >-
        the booking holding the first appointment was made no more than fv_short_lead_days calendar days ahead of the series
        start date
      value: K('fv_short_lead_pct')
    - when: it was made more than fv_short_lead_days but no more than fv_mid_lead_days days ahead
      value: K('fv_mid_lead_pct')
    - when: otherwise
      value: '100'
    baseline:
      fv_lead_pct: '100'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: first_appointment_package_forfeit_share
    effect: parameter
    decides: fv_forfeit_pct
    bindings:
    - fv_forfeits
    - fv_forfeit_pct
    ladder:
    - when: two or more package visits forfeited for missed appointments in the three months up to the assessment date
      value: K('fv_two_forfeits_pct')
    - when: exactly one such forfeited package visit
      value: K('fv_one_forfeit_pct')
    - when: otherwise
      value: '100'
    baseline:
      fv_forfeit_pct: '100'
    evidence:
    - cross_category
    - history
    cross_difficulty: package
  - id: first_appointment_hardship_share
    effect: parameter
    decides: fv_hardship_pct
    bindings:
    - fv_hs_effective
    - fv_hs_expiry
    - fv_hs_level
    - fv_hardship_pct
    ladder:
    - when: >-
        an approved hardship determination is in force (effective date arrived and expiry date not passed) and its level's
        discount_percent is fv_full_hardship_level or more
      value: '0'
    - when: >-
        an approved hardship determination is in force and its level's discount_percent is above zero but below fv_full_hardship_level
      value: 100 less the level's discount_percent
    - when: otherwise
      value: '100'
    baseline:
      fv_hardship_pct: '100'
    evidence:
    - cross_category
    - date
    cross_difficulty: hardship
  baseline:
    rule: >-
      Before any adjustment, the first-appointment no-show fee is no_show_fee of the series' format, rounded to the nearest
      cent.
    params:
    - no_show_fee
  inputs:
    history:
    - table: series_events
      aggregate: count
      field: series_event_id
      filters:
        event_type: series_no_show
    - table: series_events
      aggregate: latest
      field: event_date
      filters:
        event_type: series_visits_booked
    - category: package
      table: package_events
      aggregate: count
      field: package_event_id
      within_months: 3
      filters:
        event_type: package_visit_forfeited
    cross_category:
