    - active_left
    - still_to_draw
    ladder:
    - when: the active series ends on or before the authorization's end date
      method: the appointments still booked on the active series from its history
    - when: the active series runs past the authorization's end date
      method: >-
        the active series' visits per week times the days to the authorization's end, divided by seven, fraction dropped
    - when: otherwise
      method: '0'
    baseline:
      still_to_draw: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: series
  baseline:
    rule: >-
      The period runs from today for as many days as the current authorization covers, its days counted from the first through
      the last, both included. The visits the extension asks for are the payer program's weekly visit maximum times the
      days of the period, divided by seven and rounded up to a whole visit.
    params:
    - max_visits_per_week
  inputs:
    history:
