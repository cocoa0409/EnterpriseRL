      method: the gap ends the day before that approval starts
    - when: a newer approval starts after today
      method: the gap ends yesterday
    - when: otherwise
      method: the gap runs through today
    baseline:
      end_offset: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: retro_window
    effect: method
    decides: counted_days
    bindings:
    - gap_days
    - latest_attended
    - counted_days
    ladder:
    - when: >-
        the payer program accepts retroactive requests and the gap reaches back further than its retroactive window
      method: count only the days from today less the window days through the end of the gap
    - when: >-
        the payer program accepts no retroactive request, or no appointment funded by the plan has been attended since the
        gap began
      method: count no day
    - when: otherwise
      method: count every day of the gap
    baseline:
      counted_days: gap_days
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  - id: gap_frequency
    effect: parameter
    decides: per_week
    bindings:
    - active_per_week
    - booked_per_week
    - per_week
    ladder:
    - when: the plan funds an active appointment series
      value: that series' visits per week
    - when: the plan funds no active series but a booked one
      value: the booked series' visits per week
    - when: otherwise
      value: P('max_visits_per_week')
    baseline:
      per_week: P('max_visits_per_week')
    evidence:
    - cross_category
    cross_difficulty: series
  - id: already_asked_retroactively
    effect: parameter
    decides: already
    bindings:
    - retro_before
    - retro_granted_before
    - already
    ladder:
    - when: earlier retroactive requests stand on the plan
      value: the visits they asked for
    - when: no earlier retroactive request stands but retroactive approvals do
      value: the visits they granted
    - when: otherwise
      value: '0'
    baseline:
      already: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The gap begins the day after the end date of the last approval drawn on and runs through today, and its days are counted
      from that first day through the last, both included. The visits the retroactive request asks for are the payer program's
      weekly visit maximum times the days counted, divided by seven and rounded up to a whole visit.
    params:
    - max_visits_per_week
  inputs:
    history:
    - table: care_plan_events
      aggregate: latest
      field: visit_date
      filters:
        event_type: plan_visit_billed
        visits: 1
    - table: care_plan_events
      aggregate: sum
      field: visits
      filters:
        event_type: plan_auth_approved
    - table: care_plan_events
      aggregate: sum
      field: requested_visits
      filters:
        event_type: plan_auth_requested
        auth_kind: retro
    cross_category:
    - series
- id: plan_ext_auth_extension
  base_policy_refs:
  - plan_evt_authorization_requests
  - plan_visit_authorization
  overwrite: []
  trigger: state_due
  subject:
  - plan_auth_requested
  computes: requested_visits
  target_tool: submit_auth_extension_019a16d0
  params: {}
  rule: >-
    The extension request asks the payer for the visits the plan of care needs over the coming authorization period, counted
    at the planned weekly frequency over the days of that period. The period runs from today for as many days as the current
    authorization covers, its days counted from the first through the last, both included. The visits the extension asks
    for are the payer program's weekly visit maximum times the days of the period, divided by seven and rounded up to a
    whole visit. When the period starts depends on the current authorization: where it is still in force on today's date
    with approved visits not yet drawn, the period starts the day after its end date; where no authorization is in force
    on today's date and the plan's booked series starts later, the period starts on that series' start date; otherwise the
    period starts today. How long the period runs depends on the series the plan funds: where the plan has a booked series,
    the period runs through that series' end date; where it has no booked series but an active one, through the active series'
    end date; otherwise the period lasts as many days as the current authorization covers. The weekly frequency planned
    for the period is the plan of care's: where the plan has a booked series, it is that series' visits per week; where
    it has none but an active series, it is the active series' visits per week; otherwise it is the payer program's weekly
    visit maximum. Approved visits of the current authorization not yet drawn are carried into the period by the payer and
    are not asked for again: where the authorization is in force on today's date, its approved visits less the visits drawn
    on it are the visits not yet drawn; where its span has not started yet, all of its approved visits are; otherwise none
    is. From the visits not yet drawn, those still to be drawn before the authorization ends are taken off first: where
    the active series ends on or before the authorization's end date, they are the appointments booked on that series less
    those attended, cancelled, recorded as no-shows or released; where the active series runs past the authorization's end
    date, they are the active series' visits per week times the days from today to the authorization's end date, divided
    by seven with any fraction dropped; otherwise none is taken off. The visits asked for are the planned weekly frequency
    times the days of the period, divided by seven and rounded up to a whole visit, less the visits not yet drawn that remain
    once the visits still to be drawn are taken off, never below zero.
  prerequisite: []
  cross_category:
  - category: series
    as: history
    reads:
    - series_id
    - series_start_date
    - series_end_date
    - visits_per_week
    - series_events.visits
    note: >-
      The plan's booked and active series set the period's start and end, the weekly frequency and the appointments still
      to be drawn on the current authorization.
  compute:
  - cur_auth: F('auth_number')
  - cur_end: F('auth_end_date')
  - cur_start: LATEST('care_plan_events', 'auth_start_date', event_type='plan_auth_approved', auth_number=cur_auth)
  - cur_approved: SUM('care_plan_events', 'visits', event_type='plan_auth_approved', auth_number=cur_auth)
  - cur_drawn: SUM('care_plan_events', 'visits', event_type='plan_visit_billed', auth_number=cur_auth)
  - next_start: CFIELD('series', 'series_start_date', care_plan_id=HID, status='booked')
  - next_end: CFIELD('series', 'series_end_date', care_plan_id=HID, status='booked')
  - active_end: CFIELD('series', 'series_end_date', care_plan_id=HID, status='active')
  - start_offset: >-
      DAYS(NOW, cur_end) + 1 if (cur_start and cur_start <= NOW and cur_end >= NOW and cur_approved > cur_drawn) else (DAYS(NOW,
      next_start) if (next_start and next_start > NOW and not (cur_start and cur_start <= NOW and cur_end >= NOW)) else
      0)
  - span_days: >-
      MX(0, DAYS(NOW, next_end) - start_offset + 1) if next_end else (MX(0, DAYS(NOW, active_end) - start_offset + 1) if
      active_end else DAYS(cur_start, cur_end) + 1)
  - booked_week: CFIELD('series', 'visits_per_week', care_plan_id=HID, status='booked')
  - active_week: CFIELD('series', 'visits_per_week', care_plan_id=HID, status='active')
  - plan_per_week: booked_week if booked_week else (active_week if active_week else P('max_visits_per_week'))
  - undrawn: >-
      MX(0, cur_approved - cur_drawn) if (cur_start and cur_start <= NOW and cur_end >= NOW) else (cur_approved if (cur_start
      and cur_start > NOW) else 0)
  - active_id: CFIELD('series', 'series_id', care_plan_id=HID, status='active')
  - active_left: >-
      XSUM('series', 'series_events', 'visits', event_type='series_visits_booked', series_id=active_id) - XCOUNT('series',
      'series_events', event_type='series_visit_attended', series_id=active_id) - XCOUNT('series', 'series_events', event_type='series_visit_cancelled',
      series_id=active_id) - XCOUNT('series', 'series_events', event_type='series_no_show', series_id=active_id) - XSUM('series',
      'series_events', 'visits', event_type='series_visits_released', series_id=active_id)
  - still_to_draw: >-
      active_left if (active_end and cur_end and active_end <= cur_end) else (int(active_week * DAYS(NOW, cur_end) / 7)
      if (active_end and cur_end and active_end > cur_end) else 0)
  - carried_over: MX(0, undrawn - still_to_draw)
  - planned: plan_per_week * span_days / 7
  - planned_visits: int(planned) + (1 if planned > int(planned) else 0)
  - result: MX(0, planned_visits - carried_over)
  compute_basis:
    cur_start: >-
      Approved visits of the current authorization not yet drawn are carried into the period by the payer and are not asked
      for again: where the authorization is in force on today's date, its approved visits less the visits drawn on it are
      the visits not yet drawn; where its span has not started yet, all of its approved visits are; otherwise none is.
    cur_approved: >-
      Approved visits of the current authorization not yet drawn are carried into the period by the payer and are not asked
      for again: where the authorization is in force on today's date, its approved visits less the visits drawn on it are
      the visits not yet drawn; where its span has not started yet, all of its approved visits are; otherwise none is.
    cur_drawn: >-
      Approved visits of the current authorization not yet drawn are carried into the period by the payer and are not asked
      for again: where the authorization is in force on today's date, its approved visits less the visits drawn on it are
      the visits not yet drawn; where its span has not started yet, all of its approved visits are; otherwise none is.
    next_start: >-
      When the period starts depends on the current authorization: where it is still in force on today's date with approved
      visits not yet drawn, the period starts the day after its end date; where no authorization is in force on today's
      date and the plan's booked series starts later, the period starts on that series' start date; otherwise the period
      starts today.
    next_end: >-
      How long the period runs depends on the series the plan funds: where the plan has a booked series, the period runs
      through that series' end date; where it has no booked series but an active one, through the active series' end date;
      otherwise the period lasts as many days as the current authorization covers.
    active_end: >-
      How long the period runs depends on the series the plan funds: where the plan has a booked series, the period runs
      through that series' end date; where it has no booked series but an active one, through the active series' end date;
      otherwise the period lasts as many days as the current authorization covers.
    start_offset: >-
      When the period starts depends on the current authorization: where it is still in force on today's date with approved
      visits not yet drawn, the period starts the day after its end date; where no authorization is in force on today's
      date and the plan's booked series starts later, the period starts on that series' start date; otherwise the period
      starts today.
    span_days: >-
      How long the period runs depends on the series the plan funds: where the plan has a booked series, the period runs
      through that series' end date; where it has no booked series but an active one, through the active series' end date;
      otherwise the period lasts as many days as the current authorization covers.
    booked_week: >-
      The weekly frequency planned for the period is the plan of care's: where the plan has a booked series, it is that
      series' visits per week; where it has none but an active series, it is the active series' visits per week; otherwise
      it is the payer program's weekly visit maximum.
    active_week: >-
      The weekly frequency planned for the period is the plan of care's: where the plan has a booked series, it is that
      series' visits per week; where it has none but an active series, it is the active series' visits per week; otherwise
      it is the payer program's weekly visit maximum.
    plan_per_week: >-
      The weekly frequency planned for the period is the plan of care's: where the plan has a booked series, it is that
      series' visits per week; where it has none but an active series, it is the active series' visits per week; otherwise
      it is the payer program's weekly visit maximum.
    undrawn: >-
      Approved visits of the current authorization not yet drawn are carried into the period by the payer and are not asked
      for again: where the authorization is in force on today's date, its approved visits less the visits drawn on it are
      the visits not yet drawn; where its span has not started yet, all of its approved visits are; otherwise none is.
    active_id: >-
      From the visits not yet drawn, those still to be drawn before the authorization ends are taken off first: where the
      active series ends on or before the authorization's end date, they are the appointments booked on that series less
      those attended, cancelled, recorded as no-shows or released; where the active series runs past the authorization's
      end date, they are the active series' visits per week times the days from today to the authorization's end date, divided
      by seven with any fraction dropped; otherwise none is taken off.
    active_left: >-
      From the visits not yet drawn, those still to be drawn before the authorization ends are taken off first: where the
      active series ends on or before the authorization's end date, they are the appointments booked on that series less
      those attended, cancelled, recorded as no-shows or released; where the active series runs past the authorization's
      end date, they are the active series' visits per week times the days from today to the authorization's end date, divided
      by seven with any fraction dropped; otherwise none is taken off.
    still_to_draw: >-
      From the visits not yet drawn, those still to be drawn before the authorization ends are taken off first: where the
      active series ends on or before the authorization's end date, they are the appointments booked on that series less
      those attended, cancelled, recorded as no-shows or released; where the active series runs past the authorization's
      end date, they are the active series' visits per week times the days from today to the authorization's end date, divided
      by seven with any fraction dropped; otherwise none is taken off.
    carried_over: >-
      The visits asked for are the planned weekly frequency times the days of the period, divided by seven and rounded up
      to a whole visit, less the visits not yet drawn that remain once the visits still to be drawn are taken off, never
      below zero.
    planned: >-
      The visits asked for are the planned weekly frequency times the days of the period, divided by seven and rounded up
      to a whole visit, less the visits not yet drawn that remain once the visits still to be drawn are taken off, never
      below zero.
    planned_visits: >-
      The visits asked for are the planned weekly frequency times the days of the period, divided by seven and rounded up
      to a whole visit, less the visits not yet drawn that remain once the visits still to be drawn are taken off, never
      below zero.
    result: >-
      The visits asked for are the planned weekly frequency times the days of the period, divided by seven and rounded up
      to a whole visit, less the visits not yet drawn that remain once the visits still to be drawn are taken off, never
      below zero.
  factors:
  - id: period_start
    effect: method
    decides: start_offset
    bindings:
    - next_start
    - start_offset
    ladder:
    - when: the current authorization is in force on today's date with approved visits not yet drawn
      method: start the day after its end date
    - when: no authorization is in force on today's date and the plan's booked series starts later
      method: start on that series' start date
    - when: otherwise
      method: start today
    baseline:
      start_offset: '0'
    evidence:
    - history
    - date
    - cross_category
    cross_difficulty: series
  - id: period_end
    effect: method
    decides: span_days
    bindings:
    - next_end
    - active_end
    - span_days
    ladder:
    - when: the plan has a booked series
      method: run through the booked series' end date
    - when: the plan has no booked series but an active one
      method: run through the active series' end date
    - when: otherwise
      method: last as many days as the current authorization covers
    baseline:
      span_days: DAYS(cur_start, cur_end) + 1
    evidence:
    - cross_category
    - date
    cross_difficulty: series
  - id: planned_frequency
    effect: parameter
    decides: plan_per_week
    bindings:
    - booked_week
    - active_week
    - plan_per_week
    ladder:
    - when: the plan has a booked series
      value: the booked series' visits per week
    - when: the plan has no booked series but an active one
      value: the active series' visits per week
    - when: otherwise
      value: P('max_visits_per_week')
    baseline:
      plan_per_week: P('max_visits_per_week')
    evidence:
    - cross_category
    cross_difficulty: series
  - id: visits_not_yet_drawn
    effect: parameter
    decides: undrawn
    bindings:
    - cur_start
    - cur_approved
    - cur_drawn
    - undrawn
    ladder:
    - when: the current authorization is in force on today's date
      value: its approved visits less the visits drawn on it
    - when: its span has not started yet
      value: all of its approved visits
    - when: otherwise
      value: '0'
    baseline:
      undrawn: '0'
    evidence:
    - history
    - date
