      field: visits
      filters:
        event_type: plan_auth_approved
    - table: care_plan_events
      aggregate: sum
      field: visits
      filters:
        event_type: plan_visit_billed
    - category: series
      table: series_events
      aggregate: sum
      field: visits
      filters:
