      that month; on a payer program that bills coinsurance after the explanation of benefits and allows longer than the
      short refund period, the same is counted over the visits dated within the last two months; on a payer program that
      does not bill coinsurance after the explanation of benefits, nothing is held for coinsurance still to come; the hold
      is never below zero and is rounded half up to the cent.
    posted_2m: >-
      Coinsurance still to come from explanations of benefits not yet received is held back over a window that follows the
      payer program's refund period: on a payer program that bills coinsurance after the explanation of benefits and must
      refund a credit within the short refund period or sooner, the hold is the coinsurance percentage on file times the
      allowed amounts of the visits dated within the last month, less the coinsurance charges posted for visits dated within
      that month; on a payer program that bills coinsurance after the explanation of benefits and allows longer than the
      short refund period, the same is counted over the visits dated within the last two months; on a payer program that
      does not bill coinsurance after the explanation of benefits, nothing is held for coinsurance still to come; the hold
      is never below zero and is rounded half up to the cent.
    pending_eob_hold: >-
      Coinsurance still to come from explanations of benefits not yet received is held back over a window that follows the
      payer program's refund period: on a payer program that bills coinsurance after the explanation of benefits and must
      refund a credit within the short refund period or sooner, the hold is the coinsurance percentage on file times the
      allowed amounts of the visits dated within the last month, less the coinsurance charges posted for visits dated within
      that month; on a payer program that bills coinsurance after the explanation of benefits and allows longer than the
      short refund period, the same is counted over the visits dated within the last two months; on a payer program that
      does not bill coinsurance after the explanation of benefits, nothing is held for coinsurance still to come; the hold
      is never below zero and is rounded half up to the cent.
    unposted_overdue_visits: >-
      Visits whose explanation of benefits is overdue are covered by a further hold, a visit counting here when at least
      one but fewer than three whole calendar months separate its date of service from today, it is not an initial evaluation,
      and no coinsurance charge and no non-covered service charge has been posted for it: where one or two such visits stand,
      the overdue-explanation hold per visit is held for each of them; where three or more stand, the whole credit is held;
      where none stands, nothing is held for them.
    overdue_eob_hold: >-
      Visits whose explanation of benefits is overdue are covered by a further hold, a visit counting here when at least
      one but fewer than three whole calendar months separate its date of service from today, it is not an initial evaluation,
      and no coinsurance charge and no non-covered service charge has been posted for it: where one or two such visits stand,
      the overdue-explanation hold per visit is held for each of them; where three or more stand, the whole credit is held;
      where none stands, nothing is held for them.
    last_check_date: >-
      Money not yet cleared is held, days being counted as calendar days from the date the payment was received, that date
      itself being day zero: where the most recent check payment on the plan was received fewer than the check clearing
      days ago, its amount is held; where no check payment is that recent but the most recent bank-transfer payment was
      received fewer than the bank-transfer clearing days ago, its amount is held; otherwise nothing is held for uncleared
      funds.
    last_check_amount: >-
      Money not yet cleared is held, days being counted as calendar days from the date the payment was received, that date
      itself being day zero: where the most recent check payment on the plan was received fewer than the check clearing
      days ago, its amount is held; where no check payment is that recent but the most recent bank-transfer payment was
      received fewer than the bank-transfer clearing days ago, its amount is held; otherwise nothing is held for uncleared
      funds.
    last_ach_date: >-
      Money not yet cleared is held, days being counted as calendar days from the date the payment was received, that date
      itself being day zero: where the most recent check payment on the plan was received fewer than the check clearing
      days ago, its amount is held; where no check payment is that recent but the most recent bank-transfer payment was
      received fewer than the bank-transfer clearing days ago, its amount is held; otherwise nothing is held for uncleared
      funds.
    last_ach_amount: >-
      Money not yet cleared is held, days being counted as calendar days from the date the payment was received, that date
      itself being day zero: where the most recent check payment on the plan was received fewer than the check clearing
      days ago, its amount is held; where no check payment is that recent but the most recent bank-transfer payment was
      received fewer than the bank-transfer clearing days ago, its amount is held; otherwise nothing is held for uncleared
      funds.
    uncleared_funds: >-
      Money not yet cleared is held, days being counted as calendar days from the date the payment was received, that date
      itself being day zero: where the most recent check payment on the plan was received fewer than the check clearing
      days ago, its amount is held; where no check payment is that recent but the most recent bank-transfer payment was
      received fewer than the bank-transfer clearing days ago, its amount is held; otherwise nothing is held for uncleared
      funds.
    credit_before_holds: >-
      The holds for coinsurance still to come, for overdue explanations of benefits and for uncleared funds are subtracted
      together from the credit, and what remains is never below zero.
    series_fees_owed: >-
      A further hold is then taken from what remains: where the appointment series funded by the plan carries an unpaid
      missed-visit fee balance and the most recent fee on that series was assessed more than the series' fee due days ago,
      that unpaid fee balance is held until it is settled; where no such overdue fee stands and what remains is the small-credit
      maximum or less, all of it is held on the plan; otherwise nothing more is held.
    last_fee_date: >-
      A further hold is then taken from what remains: where the appointment series funded by the plan carries an unpaid
      missed-visit fee balance and the most recent fee on that series was assessed more than the series' fee due days ago,
      that unpaid fee balance is held until it is settled; where no such overdue fee stands and what remains is the small-credit
      maximum or less, all of it is held on the plan; otherwise nothing more is held.
    fee_due_days: >-
      A further hold is then taken from what remains: where the appointment series funded by the plan carries an unpaid
      missed-visit fee balance and the most recent fee on that series was assessed more than the series' fee due days ago,
      that unpaid fee balance is held until it is settled; where no such overdue fee stands and what remains is the small-credit
      maximum or less, all of it is held on the plan; otherwise nothing more is held.
    other_hold: >-
      A further hold is then taken from what remains: where the appointment series funded by the plan carries an unpaid
      missed-visit fee balance and the most recent fee on that series was assessed more than the series' fee due days ago,
      that unpaid fee balance is held until it is settled; where no such overdue fee stands and what remains is the small-credit
      maximum or less, all of it is held on the plan; otherwise nothing more is held.
    last_card_date: >-
      The payment the refund is returned against, and so its ceiling, is chosen in this order: the most recent card payment
      on the plan when it was made no more than the payer program's card refund window ago; otherwise, where the plan carries
      a check payment, the most recent check payment; otherwise the most recent payment on the plan.
    last_card_amount: >-
      The payment the refund is returned against, and so its ceiling, is chosen in this order: the most recent card payment
      on the plan when it was made no more than the payer program's card refund window ago; otherwise, where the plan carries
      a check payment, the most recent check payment; otherwise the most recent payment on the plan.
    last_payment_amount: The refund is returned against the patient's most recent payment on the plan.
    returned_payment_cap: >-
      The payment the refund is returned against, and so its ceiling, is chosen in this order: the most recent card payment
      on the plan when it was made no more than the payer program's card refund window ago; otherwise, where the plan carries
      a check payment, the most recent check payment; otherwise the most recent payment on the plan.
    result: >-
      The refundable credit is what remains after every hold, never below zero and no larger than the payment it is returned
      against, rounded half up to the cent.
  factors:
  - id: pending_eob_hold
    effect: parameter
    decides: pending_eob_hold
    bindings:
    - share_1m
    - posted_1m
    - share_2m
    - posted_2m
    - pending_eob_hold
    ladder:
    - when: >-
        the payer program bills coinsurance after the explanation of benefits and must refund a credit within the short
        refund period or sooner
      value: >-
        coinsurance percentage times the allowed amounts of visits dated within the last month, less coinsurance posted
        for visits dated within that month
    - when: >-
        the payer program bills coinsurance after the explanation of benefits and allows longer than the short refund period
      value: the same counted over visits dated within the last two months
    - when: otherwise
      value: nothing is held for coinsurance still to come
    baseline:
      pending_eob_hold: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: overdue_eob_hold
    effect: parameter
    decides: overdue_eob_hold
    bindings:
    - unposted_overdue_visits
    - overdue_eob_hold
    ladder:
    - when: >-
        one or two visits dated one to three months back, other than an initial evaluation, carry no coinsurance and no
        non-covered charge
      value: K('overdue_eob_hold_per_visit') for each such visit
    - when: three or more such visits stand
      value: the whole credit
    - when: otherwise
      value: '0.00'
    baseline:
      overdue_eob_hold: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: uncleared_funds
    effect: parameter
    decides: uncleared_funds
    bindings:
    - last_check_date
    - last_check_amount
    - last_ach_date
    - last_ach_amount
    - uncleared_funds
    ladder:
    - when: the most recent check payment was received fewer than K('check_clearing_days') days ago
      value: that check's amount
    - when: >-
        no check payment is that recent and the most recent bank-transfer payment was received fewer than K('ach_clearing_days')
        days ago
      value: that bank-transfer amount
    - when: otherwise
      value: '0.00'
    baseline:
      uncleared_funds: '0'
    evidence:
    - history
    - date
    cross_difficulty: null
  - id: other_hold
    effect: parameter
    decides: other_hold
    bindings:
    - series_fees_owed
    - last_fee_date
    - fee_due_days
    - other_hold
    ladder:
    - when: >-
        the series funded by the plan carries an unpaid missed-visit fee balance and its most recent fee was assessed more
        than the series' fee due days ago
      value: that unpaid fee balance
    - when: no such overdue fee stands and what remains is K('small_credit_max') or less
      value: all of what remains
    - when: otherwise
      value: '0.00'
    baseline:
      other_hold: '0'
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: series
  - id: returned_payment
    effect: method
    decides: returned_payment_cap
    bindings:
    - last_card_date
    - last_card_amount
    - last_payment_amount
    - returned_payment_cap
    ladder:
    - when: a card payment on the plan was made no more than the card refund window ago
      method: return against the most recent such card payment, capped at its amount
    - when: no card payment is that recent and the plan carries a check payment
      method: return against the most recent check payment, capped at its amount
    - when: otherwise
      method: return against the most recent payment on the plan, capped at its amount
    baseline:
      returned_payment_cap: last_payment_amount
    evidence:
    - history
    - date
    - tier_param
    cross_difficulty: null
  baseline:
    rule: >-
      The credit standing on the plan of care is worked out from its ledger: every patient payment and every balance adjustment
      on the plan, less every patient charge and every refund already issued on the plan, never below zero. The refund is
      returned against the patient's most recent payment on the plan. The refundable credit is that credit, no larger than
      the payment it is returned against, rounded half up to the cent.
    params: []
