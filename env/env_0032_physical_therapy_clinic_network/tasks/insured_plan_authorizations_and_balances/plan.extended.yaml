- id: plan_ext_noncovered_waiver
  base_policy_refs:
  - plan_agg_benefit_visit_limit
  - plan_evt_authorization_requests
  - plan_visit_authorization
  overwrite:
  - base_policy: plan_agg_benefit_visit_limit
    superseded_clause: so the visits used are benefit_visits_used_elsewhere plus plan_msr_dos_visits_cy
    replaced_by: >-
      The visits counted against the visit limit ahead of a waiver are the visits used elsewhere on file plus the visits
      the patient has had under the plan, counted as set out below.
  trigger: on_request
  subject:
  - plan_waiver_signed
  computes: visit_date
  target_tool: sign_noncovered_waiver_5d672975
  params: {}
  rule: >-
    A waiver is the patient's own signed acceptance, on the payer program's waiver form, of financial responsibility for
    the visits that run past the payer's calendar-year visit limit; it covers every visit from its first date of service
    onward that runs past the limit, and that first date is set as described below. The visits counted against the visit
    limit ahead of a waiver are the visits used elsewhere on file plus the visits the patient has had under the plan, counted
    as set out below. The waiver's first date of service is today, the day the patient signs it. The visits counted against
    the visit limit ahead of a waiver are the visits used elsewhere on file, the evaluation billed on the plan and the appointments
    attended on the plan's active appointment series, adjusted as set out below; the visits left under the limit are the
    visit limit on file less the visits counted. Appointments attended on the active series without a billed visit count
    against the limit only through a retroactive request: where retroactive requests on the plan ask for more visits than
    retroactive approvals have granted, the visits asked for less the visits granted count in their place; where every visit
    asked for retroactively has been granted, none of them is added, the granted visits counting once they are billed; where
    no retroactive request has been made, every such appointment counts. Telehealth treatment visits are not appointments
    of the in-clinic series and are added to the visits counted: where telehealth treatment visits have been billed on the
    plan, those billed visits are added; where none has been billed and no retroactive request stands on the plan, the sessions
    attended on a telehealth series the plan funds are added, as unbilled in-clinic appointments are when no retroactive
    request has been made; otherwise nothing is added for telehealth, unbilled sessions then counting only through the retroactive
    requests. The date the waiver covers from follows where the limit runs out: where visits are still left and they equal
    the appointments still booked on the plan's active series, as its record shows them remaining, the first visit past
    the limit opens the plan's next booked series and the waiver covers from that opening visit; where more visits are left
    than appointments are still booked on the active series, no waiver is signed yet, and it is signed on the day of the
    first visit that runs past the limit; otherwise the waiver covers from today. The opening visit of the next booked series
    is taken from its bookings: where that series' first booked appointment has been rescheduled, it opens on the date the
    appointment was moved to; where it has not been rescheduled and its first booking begins after the series' start date,
    it opens on that first booked appointment; otherwise it opens on the series' start date. The first date of service a
    waiver covers is fixed only after every visit attended without authorization within the payer's retroactive window carries
    a retroactive authorization request. A waiver is not signed until the plan carries an extension request submitted since
    its current authorization was approved.
  prerequisite:
  - problem: plan_ext_retro_authorization
    kind: value_input
    gate: retro_asked
    form: state
    policy_source: >-
      The first date of service a waiver covers is fixed only after every visit attended without authorization within the
      payer's retroactive window carries a retroactive authorization request.
    condition: >-
      every series_visit_attended row on the plan's active series that has no matching plan_visit_billed row and is dated
      within retro_auth_window_days of today is covered by the requested_visits of a plan_auth_requested row with auth_kind
      retro
    resolved_by: submit_retro_authorization_d347b3c8
    effect: >-
      the retroactive request adds its requested visits to the visits asked for retroactively, so those appointments count
      against the limit and the visits left fall to the appointments still booked on the active series
  - problem: plan_ext_auth_extension
    kind: state_gate
    gate: care_plan_events.auth_kind
    form: state
    policy_source: >-
      A waiver is not signed until the plan carries an extension request submitted since its current authorization was approved.
    condition: >-
      the plan carries a plan_auth_requested row with auth_kind extension whose event_date is on or after the event_date
      of the plan_auth_approved row of its current auth_number
    resolved_by: submit_auth_extension_019a16d0
    effect: once the extension request stands, the gate on signing the waiver holds
  cross_category:
  - category: series
    as: history
    reads:
    - series_id
    - booked_visits_remaining
    - series_start_date
    - variant_name
    - series_events.appointment_date
    - series_events.reschedule_to_date
    note: >-
      The plan's active, telehealth and next booked series give the attended appointments, the telehealth sessions, the
      appointments still booked and the opening visit of the next series.
  compute:
  - active_series: CFIELD('series', 'series_id', care_plan_id=HID, status='active')
  - attended_active: XCOUNT('series', 'series_events', event_type='series_visit_attended', series_id=active_series)
  - billed_series_kinds: >-
      COUNT('care_plan_events', event_type='plan_visit_billed', visit_kind='treatment') + COUNT('care_plan_events', event_type='plan_visit_billed',
      visit_kind='progress_report') + COUNT('care_plan_events', event_type='plan_visit_billed', visit_kind='re_evaluation')
  - unbilled_attended: MX(0, attended_active - billed_series_kinds)
  - retro_asked: SUM('care_plan_events', 'requested_visits', event_type='plan_auth_requested', auth_kind='retro')
  - retro_granted: SUM('care_plan_events', 'visits', event_type='plan_auth_approved', auth_kind='retro')
  - unbilled_counted: >-
      retro_asked - retro_granted if retro_asked > retro_granted else (0 if retro_granted > 0 else unbilled_attended)
  - billed_evaluations: COUNT('care_plan_events', event_type='plan_visit_billed', visit_kind='evaluation')
  - billed_telehealth: COUNT('care_plan_events', event_type='plan_visit_billed', visit_kind='telehealth_treatment')
  - telehealth_series: CFIELD('series', 'series_id', care_plan_id=HID, variant_name='Telehealth 30-Minute Visit Series')
  - telehealth_sessions: >-
      XCOUNT('series', 'series_events', event_type='series_visit_attended', series_id=telehealth_series) if telehealth_series
      else 0
  - telehealth_counted: >-
      billed_telehealth if billed_telehealth > 0 else (telehealth_sessions if (telehealth_sessions > 0 and retro_asked ==
      0) else 0)
  - counted_used: >-
      F('benefit_visits_used_elsewhere') + billed_evaluations + (attended_active - unbilled_attended) + unbilled_counted
      + telehealth_counted
  - visits_left: F('benefit_year_visit_limit') - counted_used
  - booked_ahead: CFIELD('series', 'booked_visits_remaining', care_plan_id=HID, status='active')
  - next_series: CFIELD('series', 'series_id', care_plan_id=HID, status='booked')
  - next_start: CFIELD('series', 'series_start_date', care_plan_id=HID, status='booked')
  - first_booked: >-
      XLATEST('series', 'series_events', 'appointment_date', event_type='series_visits_booked', series_id=next_series)
  - moved_to: >-
      XLATEST('series', 'series_events', 'reschedule_to_date', event_type='series_visit_rescheduled', series_id=next_series,
      appointment_date=first_booked)
  - next_visit: >-
      moved_to if moved_to else (first_booked if (first_booked and next_start and first_booked > next_start) else next_start)
  - waiver_date: >-
      next_visit if (visits_left > 0 and visits_left == booked_ahead) else ('' if visits_left > booked_ahead else NOW)
  - result: waiver_date
  compute_basis:
    active_series: >-
      The visits counted against the visit limit ahead of a waiver are the visits used elsewhere on file, the evaluation
      billed on the plan and the appointments attended on the plan's active appointment series, adjusted as set out below;
      the visits left under the limit are the visit limit on file less the visits counted.
    attended_active: >-
      The visits counted against the visit limit ahead of a waiver are the visits used elsewhere on file, the evaluation
      billed on the plan and the appointments attended on the plan's active appointment series, adjusted as set out below;
      the visits left under the limit are the visit limit on file less the visits counted.
    billed_series_kinds: >-
      Appointments attended on the active series without a billed visit count against the limit only through a retroactive
      request: where retroactive requests on the plan ask for more visits than retroactive approvals have granted, the visits
      asked for less the visits granted count in their place; where every visit asked for retroactively has been granted,
      none of them is added, the granted visits counting once they are billed; where no retroactive request has been made,
      every such appointment counts.
    unbilled_attended: >-
      Appointments attended on the active series without a billed visit count against the limit only through a retroactive
      request: where retroactive requests on the plan ask for more visits than retroactive approvals have granted, the visits
      asked for less the visits granted count in their place; where every visit asked for retroactively has been granted,
      none of them is added, the granted visits counting once they are billed; where no retroactive request has been made,
      every such appointment counts.
    retro_asked: >-
      Appointments attended on the active series without a billed visit count against the limit only through a retroactive
      request: where retroactive requests on the plan ask for more visits than retroactive approvals have granted, the visits
      asked for less the visits granted count in their place; where every visit asked for retroactively has been granted,
      none of them is added, the granted visits counting once they are billed; where no retroactive request has been made,
      every such appointment counts.
    retro_granted: >-
      Appointments attended on the active series without a billed visit count against the limit only through a retroactive
      request: where retroactive requests on the plan ask for more visits than retroactive approvals have granted, the visits
      asked for less the visits granted count in their place; where every visit asked for retroactively has been granted,
      none of them is added, the granted visits counting once they are billed; where no retroactive request has been made,
      every such appointment counts.
    unbilled_counted: >-
      Appointments attended on the active series without a billed visit count against the limit only through a retroactive
      request: where retroactive requests on the plan ask for more visits than retroactive approvals have granted, the visits
      asked for less the visits granted count in their place; where every visit asked for retroactively has been granted,
      none of them is added, the granted visits counting once they are billed; where no retroactive request has been made,
      every such appointment counts.
    billed_evaluations: >-
      The visits counted against the visit limit ahead of a waiver are the visits used elsewhere on file, the evaluation
      billed on the plan and the appointments attended on the plan's active appointment series, adjusted as set out below;
      the visits left under the limit are the visit limit on file less the visits counted.
    billed_telehealth: >-
      Telehealth treatment visits are not appointments of the in-clinic series and are added to the visits counted: where
      telehealth treatment visits have been billed on the plan, those billed visits are added; where none has been billed
      and no retroactive request stands on the plan, the sessions attended on a telehealth series the plan funds are added,
      as unbilled in-clinic appointments are when no retroactive request has been made; otherwise nothing is added for telehealth,
      unbilled sessions then counting only through the retroactive requests.
    telehealth_series: >-
      Telehealth treatment visits are not appointments of the in-clinic series and are added to the visits counted: where
      telehealth treatment visits have been billed on the plan, those billed visits are added; where none has been billed
      and no retroactive request stands on the plan, the sessions attended on a telehealth series the plan funds are added,
      as unbilled in-clinic appointments are when no retroactive request has been made; otherwise nothing is added for telehealth,
      unbilled sessions then counting only through the retroactive requests.
    telehealth_sessions: >-
      Telehealth treatment visits are not appointments of the in-clinic series and are added to the visits counted: where
      telehealth treatment visits have been billed on the plan, those billed visits are added; where none has been billed
      and no retroactive request stands on the plan, the sessions attended on a telehealth series the plan funds are added,
      as unbilled in-clinic appointments are when no retroactive request has been made; otherwise nothing is added for telehealth,
      unbilled sessions then counting only through the retroactive requests.
    telehealth_counted: >-
      Telehealth treatment visits are not appointments of the in-clinic series and are added to the visits counted: where
      telehealth treatment visits have been billed on the plan, those billed visits are added; where none has been billed
      and no retroactive request stands on the plan, the sessions attended on a telehealth series the plan funds are added,
      as unbilled in-clinic appointments are when no retroactive request has been made; otherwise nothing is added for telehealth,
      unbilled sessions then counting only through the retroactive requests.
    counted_used: >-
      The visits counted against the visit limit ahead of a waiver are the visits used elsewhere on file, the evaluation
      billed on the plan and the appointments attended on the plan's active appointment series, adjusted as set out below;
      the visits left under the limit are the visit limit on file less the visits counted.
    visits_left: >-
      The visits counted against the visit limit ahead of a waiver are the visits used elsewhere on file, the evaluation
      billed on the plan and the appointments attended on the plan's active appointment series, adjusted as set out below;
      the visits left under the limit are the visit limit on file less the visits counted.
    booked_ahead: >-
      The date the waiver covers from follows where the limit runs out: where visits are still left and they equal the appointments
      still booked on the plan's active series, as its record shows them remaining, the first visit past the limit opens
      the plan's next booked series and the waiver covers from that opening visit; where more visits are left than appointments
      are still booked on the active series, no waiver is signed yet, and it is signed on the day of the first visit that
      runs past the limit; otherwise the waiver covers from today.
    next_series: >-
      The date the waiver covers from follows where the limit runs out: where visits are still left and they equal the appointments
      still booked on the plan's active series, as its record shows them remaining, the first visit past the limit opens
      the plan's next booked series and the waiver covers from that opening visit; where more visits are left than appointments
      are still booked on the active series, no waiver is signed yet, and it is signed on the day of the first visit that
      runs past the limit; otherwise the waiver covers from today.
    next_start: >-
      The opening visit of the next booked series is taken from its bookings: where that series' first booked appointment
      has been rescheduled, it opens on the date the appointment was moved to; where it has not been rescheduled and its
      first booking begins after the series' start date, it opens on that first booked appointment; otherwise it opens on
      the series' start date.
    first_booked: >-
      The opening visit of the next booked series is taken from its bookings: where that series' first booked appointment
      has been rescheduled, it opens on the date the appointment was moved to; where it has not been rescheduled and its
      first booking begins after the series' start date, it opens on that first booked appointment; otherwise it opens on
      the series' start date.
    moved_to: >-
      The opening visit of the next booked series is taken from its bookings: where that series' first booked appointment
      has been rescheduled, it opens on the date the appointment was moved to; where it has not been rescheduled and its
      first booking begins after the series' start date, it opens on that first booked appointment; otherwise it opens on
      the series' start date.
    next_visit: >-
      The opening visit of the next booked series is taken from its bookings: where that series' first booked appointment
      has been rescheduled, it opens on the date the appointment was moved to; where it has not been rescheduled and its
      first booking begins after the series' start date, it opens on that first booked appointment; otherwise it opens on
      the series' start date.
    waiver_date: >-
      The date the waiver covers from follows where the limit runs out: where visits are still left and they equal the appointments
      still booked on the plan's active series, as its record shows them remaining, the first visit past the limit opens
      the plan's next booked series and the waiver covers from that opening visit; where more visits are left than appointments
      are still booked on the active series, no waiver is signed yet, and it is signed on the day of the first visit that
      runs past the limit; otherwise the waiver covers from today.
    result: >-
      The date the waiver covers from follows where the limit runs out: where visits are still left and they equal the appointments
      still booked on the plan's active series, as its record shows them remaining, the first visit past the limit opens
      the plan's next booked series and the waiver covers from that opening visit; where more visits are left than appointments
      are still booked on the active series, no waiver is signed yet, and it is signed on the day of the first visit that
      runs past the limit; otherwise the waiver covers from today.
  factors:
  - id: unbilled_appointments
    effect: parameter
    decides: unbilled_counted
    bindings:
    - unbilled_attended
    - retro_asked
    - retro_granted
    - unbilled_counted
    ladder:
    - when: retroactive requests on the plan ask for more visits than retroactive approvals have granted
      value: the visits asked for less the visits granted
    - when: every visit asked for retroactively has been granted
      value: 0 (the granted visits count once billed)
    - when: otherwise (no retroactive request)
      value: every attended appointment without a billed visit
    baseline:
      unbilled_counted: unbilled_attended
    evidence:
    - history
    - cross_category
    cross_difficulty: null
  - id: telehealth_visits
    effect: parameter
    decides: telehealth_counted
    bindings:
    - billed_telehealth
    - telehealth_series
    - telehealth_sessions
    - telehealth_counted
    ladder:
    - when: telehealth treatment visits have been billed on the plan
      value: the billed telehealth visits
    - when: >-
        none has been billed and no retroactive request stands on the plan, while sessions have been attended on a telehealth
        series the plan funds
      value: those attended telehealth sessions
    - when: otherwise
      value: 0 (unbilled sessions then count only through the retroactive requests)
    baseline:
      telehealth_counted: '0'
    evidence:
    - history
    - cross_category
    cross_difficulty: series
  - id: waiver_timing
    effect: method
    decides: waiver_date
    bindings:
    - booked_ahead
    - waiver_date
    ladder:
    - when: visits are still left and they equal the appointments still booked on the plan's active series
      method: date the waiver to the opening visit of the plan's next booked series
    - when: more visits are left than appointments are still booked on the active series
      method: sign no waiver yet; it is signed on the day of the first visit past the limit
    - when: otherwise
      method: date the waiver today
    baseline:
      waiver_date: NOW
    evidence:
    - cross_category
    - history
    cross_difficulty: series
  - id: next_series_opening
    effect: method
    decides: next_visit
    bindings:
    - first_booked
    - moved_to
    - next_visit
    ladder:
    - when: the next series' first booked appointment has been rescheduled
      method: open on the date it was moved to
    - when: it has not been rescheduled and the first booking begins after the series' start date
      method: open on that first booked appointment
    - when: otherwise
      method: open on the series' start date
    baseline:
      next_visit: next_start
    evidence:
    - cross_category
    - history
    - date
    cross_difficulty: series
  baseline:
    rule: The waiver's first date of service is today, the day the patient signs it.
    params: []
  inputs:
    history:
    - table: care_plan_events
      aggregate: count
      field: care_plan_event_id
      filters:
        event_type: plan_visit_billed
    - table: care_plan_events
      aggregate: sum
      field: requested_visits
      filters:
        event_type: plan_auth_requested
        auth_kind: retro
    - category: series
      table: series_events
      aggregate: count
      field: series_event_id
      filters:
        event_type: series_visit_attended
    - category: series
      table: series_events
      aggregate: latest
      field: reschedule_to_date
      filters:
        event_type: series_visit_rescheduled
    cross_category:
    - series
