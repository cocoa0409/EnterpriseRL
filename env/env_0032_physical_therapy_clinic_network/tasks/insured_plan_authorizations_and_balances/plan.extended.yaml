  - base_policy: plan_evt_time_of_service_collection
    superseded_clause: >-
      the coinsurance and any deductible shown on the payer's explanation of benefits are posted as coinsurance or deductible
      charges within eob_patient_charge_days calendar days after the explanation of benefits arrives
    replaced_by: >-
