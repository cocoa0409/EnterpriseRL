  trigger: on_request
  subject:
  - plan_patient_payment
  computes: amount
  target_tool: pay_previsit_amount_3bf14ac0
  params:
    current_payment_plan_cap: 75.0
    minutes_per_timed_unit: 15
  rule: >-
    The pre-visit amount is what a patient pays by phone ahead of a visit booked under an active plan of care: an estimate
    of the patient's share of the coming visit plus the balance the plan already carries, applied to the oldest open charge
    on the plan. A pre-visit amount is not taken from a patient until each discharged plan of care of that patient whose
    ledger shows a credit carries a refund issued since its discharge. The pre-visit amount is the deductible part of the
    coming visit plus the balance the plan carries, rounded half up to the cent. The coming visit is expected to be billed
    with the same timed units as the latest billed visit on the plan, at that visit's allowed amount per unit, and its expected
    allowed amount is those units times that amount per unit, rounded half up to the cent. The deductible part is the lowest
    of the deductible still to be met, the expected allowed amount and the payer program's time-of-service deductible estimate
    cap, the deductible still to be met being the deductible remaining on file. The balance the plan carries is the patient
    balance shown on the plan record. The timed units the coming visit is expected to carry are taken from its booking:
    where the plan funds an active appointment series, they are the whole timed units the series' slot length comes to,
    that is the slot minutes plus half the minutes in one timed unit, divided by the minutes in one timed unit, any fraction
    dropped, never more than the payer program's per-visit maximum; where no active series is funded by the plan but a treatment
    visit has been billed on it, they are the units of the latest billed treatment visit; otherwise they are the units of
    the latest billed visit. The allowed amount per unit is read from the latest billed visit carrying the timed units the
    coming visit is expected to carry, as its allowed amount divided by its units; where no billed visit carries those units,
    from the latest billed treatment visit; where no treatment visit has been billed either, from the latest billed visit;
    the amount per unit is rounded half up to four decimal places. The deductible still to be met is reconciled from the
    plan's ledger: where explanation-of-benefits deductible charges stand on the plan, it is the deductible remaining on
    file less every deductible estimate and every explanation-of-benefits deductible charge posted on the plan, plus every
    billing error correction on the plan, never below zero; where deductible estimates stand on the plan but no explanation-of-benefits
    deductible charge does, it is the deductible remaining on file less those estimates, plus every billing error correction
    on the plan, never below zero; where no deductible charge of either kind stands on the plan, it is the deductible remaining
    on file. When a patient pays ahead of a visit, the deductible part of that payment is capped by the patient's Patient
    Payment Plan standing as set out below, in place of the lower-of-three deductible estimate the visit would otherwise
    collect at the time of service. The cap on the deductible part follows the patient's Patient Payment Plan standing:
    a patient holding an active Patient Payment Plan whose most recent installment payment was received on or before that
    installment's due date is capped at the current-payment-plan cap; a patient whose Patient Payment Plan is past due or
    defaulted, or whose most recent installment payment was received after that installment's due date, is capped at the
    full expected allowed amount; any other patient is capped at the payer program's time-of-service deductible estimate
    cap. Beyond the deductible part, where the expected allowed amount is more than the deductible still to be met and the
    plan carries a coinsurance percentage, the pre-visit amount also includes that coinsurance percentage of the part of
    the expected allowed amount above the deductible still to be met, rounded half up to the cent; where the expected allowed
    amount is more than the deductible still to be met, the plan carries no coinsurance percentage and copay charges have
    been posted on the plan, it includes the copay on file instead; otherwise nothing is included beyond the deductible
    part. When a patient pays ahead of a visit, the coinsurance share above the deductible still to be met is collected
    with that payment, ahead of the explanation of benefits, in place of waiting for that coinsurance to be posted after
    it. The balance the plan carries leaves out charges still waiting for their statement: where charges posted from an
    explanation of benefits stand on the plan and no statement has yet been issued on it, only the time-of-service charges
    are carried, that is the deductible estimates and copays posted on the plan less the payments made on it, never below
    zero; where the plan record shows a credit, nothing is carried, the credit being handled as a refund; otherwise the
    patient balance shown on the plan record is carried. The deductible part, the amount included beyond it and the balance
    the plan carries are added together, and the total is rounded half up to the cent.
  prerequisite:
  - problem: plan_ext_credit_refund
    kind: state_gate
    gate: care_plan_events.event_type
    form: state
    policy_source: >-
      A pre-visit amount is not taken from a patient until each discharged plan of care of that patient whose ledger shows
      a credit carries a refund issued since its discharge.
    condition: >-
      every care_plans row of the patient with status discharged whose care_plan_events ledger nets to a credit carries
      a care_plan_events row with event_type plan_patient_refund dated on or after its discharge_date
    resolved_by: issue_credit_refund_cc5fc5ad
    effect: >-
      once the refund entry stands on the discharged plan that showed a credit, the gate on taking the pre-visit amount
      holds and the payment may be taken
  cross_category:
  - category: series
    as: branch
    reads:
    - visit_length_minutes
    note: >-
      The slot length of the active series the plan funds decides the timed units the coming visit is expected to carry.
  - category: payplan
    as: history
    reads:
    - status
    - payment_plan_events.event_date
    - payment_plan_events.installment_due_date
    note: >-
      The Patient Payment Plan status and whether its most recent installment was paid by its due date decide the cap on
      the deductible part.
  compute:
  - slot_minutes: CPARAM('series', 'visit_length_minutes', care_plan_id=HID, status='active')
  - last_visit_units: LATEST('care_plan_events', 'cpt_units', event_type='plan_visit_billed', date_field='visit_date')
  - last_treatment_units: >-
      LATEST('care_plan_events', 'cpt_units', event_type='plan_visit_billed', visit_kind='treatment', date_field='visit_date')
  - expected_units: >-
      MN(int((slot_minutes + K('minutes_per_timed_unit') / 2) / K('minutes_per_timed_unit')), P('max_timed_units_per_visit'))
      if slot_minutes else (last_treatment_units if last_treatment_units else last_visit_units)
  - same_units_allowed: >-
      LATEST('care_plan_events', 'allowed_amount', event_type='plan_visit_billed', cpt_units=expected_units, date_field='visit_date')
  - last_treatment_allowed: >-
      LATEST('care_plan_events', 'allowed_amount', event_type='plan_visit_billed', visit_kind='treatment', date_field='visit_date')
  - last_visit_allowed: >-
      LATEST('care_plan_events', 'allowed_amount', event_type='plan_visit_billed', date_field='visit_date')
  - allowed_per_unit: >-
      RND(same_units_allowed / expected_units, 4) if same_units_allowed else (RND(last_treatment_allowed / last_treatment_units,
      4) if last_treatment_allowed else RND(last_visit_allowed / last_visit_units, 4))
  - expected_allowed: RND(expected_units * allowed_per_unit, 2)
  - estimates_posted: >-
      SUM('care_plan_events', 'amount', event_type='plan_patient_charge_posted', charge_kind='deductible_estimate')
  - eob_deductibles: SUM('care_plan_events', 'amount', event_type='plan_patient_charge_posted', charge_kind='deductible')
  - corrections: >-
      SUM('care_plan_events', 'amount', event_type='plan_patient_adjustment', adjustment_kind='billing_error_correction')
  - deductible_left: >-
      MX(0, F('deductible_remaining') - estimates_posted - eob_deductibles + corrections) if eob_deductibles > 0 else (MX(0,
      F('deductible_remaining') - estimates_posted + corrections) if estimates_posted > 0 else F('deductible_remaining'))
  - plan_status: CFIELD('payplan', 'status')
  - last_installment_paid: >-
      XLATEST('payplan', 'payment_plan_events', 'event_date', event_type='payplan_payment_received', payment_kind='installment')
  - last_installment_due: >-
      XLATEST('payplan', 'payment_plan_events', 'installment_due_date', event_type='payplan_payment_received', payment_kind='installment')
  - paid_late: 1 if (last_installment_paid and DAYS(last_installment_due, last_installment_paid) > 0) else 0
  - estimate_cap: >-
      K('current_payment_plan_cap') if (plan_status == 'active' and last_installment_paid and paid_late == 0) else (expected_allowed
      if (plan_status == 'past_due' or plan_status == 'defaulted' or paid_late == 1) else P('tos_deductible_estimate_cap'))
  - deductible_part: MN(deductible_left, expected_allowed, estimate_cap)
  - copays_posted: COUNT('care_plan_events', event_type='plan_patient_charge_posted', charge_kind='copay')
  - beyond_deductible: >-
      RND(F('coinsurance_percent') / 100 * (expected_allowed - deductible_left), 2) if (deductible_left < expected_allowed
      and F('coinsurance_percent') > 0) else (F('copay_amount') if (deductible_left < expected_allowed and F('coinsurance_percent')
      == 0 and copays_posted > 0) else 0)
  - eob_charges: >-
      COUNT('care_plan_events', event_type='plan_patient_charge_posted', charge_kind='deductible') + COUNT('care_plan_events',
      event_type='plan_patient_charge_posted', charge_kind='coinsurance')
  - statements_issued: COUNT('care_plan_events', event_type='plan_statement_issued')
  - tos_open: >-
      RND(MX(0, SUM('care_plan_events', 'amount', event_type='plan_patient_charge_posted', charge_kind='deductible_estimate')
      + SUM('care_plan_events', 'amount', event_type='plan_patient_charge_posted', charge_kind='copay') - SUM('care_plan_events',
      'amount', event_type='plan_patient_payment')), 2)
  - carried_balance: >-
      tos_open if (eob_charges > 0 and statements_issued == 0) else (0 if F('patient_due_balance') < 0 else F('patient_due_balance'))
  - result: RND(deductible_part + beyond_deductible + carried_balance, 2)
  compute_basis:
