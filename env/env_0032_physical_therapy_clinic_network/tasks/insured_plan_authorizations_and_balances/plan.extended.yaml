events:
  - type: plan_opened
    target: care_plans
    mutation: create
    meaning: A plan of care is opened on the date of the patient's initial evaluation, with the payer program, referral and verified benefits recorded.
    grain: one row per plan of care
    fields:
      care_plan_id: reference number of the new plan of care
      customer_id: the patient
      variant_name: payer program tier the plan is billed under
      opened_date: date of the initial evaluation
      clinic_name: clinic where the patient is treated
      payer_name: insurance company or plan name as printed on the card
      member_number: member number as printed on the insurance card
      referring_provider: referring or certifying provider
      referral_date: date of the referral on file; empty where no referral is required
      diagnosis_code: treating ICD-10-CM diagnosis code
      copay_amount: per-visit copay from benefit verification
      coinsurance_percent: coinsurance percentage from benefit verification
      deductible_remaining: deductible still to be met at verification
      benefit_year_visit_limit: payer's calendar-year therapy visit limit
      benefit_visits_used_elsewhere: visits the payer reports as already used this calendar year at other providers
      prior_therapy_allowed_ytd: Medicare-reported allowed therapy amount already accrued this calendar year at other providers
      benefits_verified_date: date benefits were verified
    triggers:
      - event: plan:plan_visit_billed
        map: {visit_kind: evaluation}
  - type: plan_activated
    target: care_plans
    mutation: {transition: {from: intake, to: active}}
    meaning: The plan of care is activated for treatment once referral, certification and authorization requirements are on file.
    grain: one row per transaction
    fields:
      status: becomes active
      certification_end_date: last day of the first certification period where certification applies
    triggers: []
  - type: plan_benefits_reverified
    target: care_plans
    mutation: update
    meaning: Insurance benefits on the plan are re-verified with the payer and the verified cost-sharing figures are replaced.
    grain: one row per transaction
    fields:
      copay_amount: re-verified per-visit copay
      coinsurance_percent: re-verified coinsurance percentage
      deductible_remaining: re-verified remaining deductible
      benefit_year_visit_limit: re-verified calendar-year visit limit
      benefit_visits_used_elsewhere: re-verified visits used elsewhere this calendar year
      prior_therapy_allowed_ytd: re-verified Medicare allowed amount accrued elsewhere this calendar year
      benefits_verified_date: date of this verification
    triggers: []
  - type: plan_recertified
    target: care_plans
    mutation: update
    meaning: A new certification period begins on the plan when the physician signs the updated plan of care.
    grain: one row per transaction
    fields:
      certification_end_date: last day of the new certification period
      physician_signed_date: date of the certifying signature
    triggers: []
  - type: plan_auth_recorded
    target: care_plans
    mutation: update
    meaning: The plan's current authorization number and end date are updated to those of the newest approved authorization.
    grain: one row per transaction
    fields:
      auth_number: authorization number now in force
      auth_end_date: last date of service the authorization covers
    triggers: []
  - type: plan_held
    target: care_plans
    mutation: {transition: {from: active, to: on_hold}}
    meaning: Treatment on the plan is paused for a recorded reason.
    grain: one row per transaction
    fields:
      status: becomes on_hold
      hold_reason: why the plan was paused
      hold_start_date: date the hold began
    triggers: []
  - type: plan_resumed
    target: care_plans
    mutation: {transition: {from: on_hold, to: active}}
    meaning: Treatment on a paused plan resumes.
    grain: one row per transaction
    fields:
      status: becomes active
      hold_reason: cleared to none
    triggers: []
  - type: plan_discharged
    target: care_plans
    mutation: {transition: [{from: active, to: discharged}, {from: on_hold, to: discharged}]}
    meaning: The patient is discharged from the plan of care by the therapist or for non-attendance.
    grain: one row per transaction
    fields:
      status: becomes discharged
      discharge_reason: why the patient was discharged
      discharge_date: date of discharge
    triggers:
      - event: series:series_visits_released
        map: {release_reason: plan_discharged}
  - type: plan_closed
    target: care_plans
    mutation: {transition: [{from: discharged, to: closed}, {from: intake, to: closed}]}
    meaning: The plan of care is closed, either after discharge with a settled balance or before any treatment took place.
    grain: one row per transaction
    fields:
      status: becomes closed
      closed_date: date the plan was closed
    triggers: []
  - type: plan_auth_requested
    target: care_plan_events
    meaning: An authorization request (initial, extension, retroactive, peer-to-peer or appeal) is submitted to the payer for the plan.
    grain: one row per request submitted to the payer
    distinguish_by: [auth_kind, event_date]
    fields:
      event_date: date the request was submitted
      auth_kind: kind of request
      requested_visits: number of visits requested
      visit_date: for a retroactive request, the visit date of the earliest visit it asks to cover; otherwise empty
      source_event_id: for a peer-to-peer or appeal request, the reference of the denial it contests; otherwise empty
    triggers: []
  - type: plan_auth_approved
    target: care_plan_events
    meaning: The payer approves a number of visits for a date span under an authorization number.
    grain: one row per payer approval
    distinguish_by: [auth_number, auth_kind, auth_start_date]
    fields:
      event_date: date the approval was received
      auth_number: payer authorization number
      auth_kind: kind of request the approval answers
      auth_start_date: first date of service covered
      auth_end_date: last date of service covered
      visits: number of visits approved
      source_event_id: reference of the request this approval answers
    account: authorized_visits
    direction: in
    triggers:
      - event: plan:plan_auth_recorded
        map: {auth_number: auth_number, auth_end_date: auth_end_date}
  - type: plan_auth_denied
    target: care_plan_events
    meaning: The payer denies an authorization request in whole.
    grain: one row per payer denial
    distinguish_by: [auth_kind, event_date]
    fields:
      event_date: date the denial was received
      auth_kind: kind of request denied
      denial_reason: payer's stated reason
      source_event_id: reference of the request that was denied
    triggers: []
  - type: plan_visit_billed
    target: care_plan_events
    meaning: One visit (evaluation, re-evaluation, progress report, treatment or telehealth treatment) is billed to the payer under the plan.
    grain: one row per billed visit (one date of service on one plan)
    distinguish_by: [visit_date, visit_kind]
    fields:
      event_date: date the claim line was created
      visit_date: date of service
      visit_kind: kind of visit
      cpt_units: timed procedure units billed
      billed_amount: charge submitted to the payer
      allowed_amount: payer allowed amount expected for the visit
      kx_modifier: whether the visit carries the KX modifier
      auth_number: authorization the visit is billed against; empty where none applies
      visits: authorized visits this visit draws (1, or 0 where it draws none)
    account: authorized_visits
    direction: out
    triggers:
      - event: plan:plan_patient_charge_posted
        map: {visit_date: visit_date}
  - type: plan_patient_charge_posted
    target: care_plan_events
    meaning: A patient-responsibility charge (copay, deductible estimate, coinsurance, deductible after EOB, a waived non-covered visit, or a balance returned from a Patient Payment Plan) is posted to the patient's balance on the plan.
    grain: one row per patient charge per visit and charge kind (a returned charge is one row per original charge)
    distinguish_by: [charge_kind, visit_date, source_event_id]
    fields:
      event_date: date posted
      visit_date: date of service the charge belongs to
      charge_kind: what the charge is
      amount: amount charged to the patient (positive)
      source_event_id: reference of the billed visit the charge belongs to, or of the original charge for a returned_from_payment_plan charge
    account: patient_due
    direction: in
    triggers: []
  - type: plan_patient_payment
    target: care_plan_events
    meaning: The patient pays toward their balance on the plan.
    grain: one row per payment received
    distinguish_by: [event_date, source_event_id, payment_method, amount]
    fields:
      event_date: date the payment was received
      amount: amount paid (positive)
      payment_method: how the patient paid
      channel: where the payment was taken
      source_event_id: reference of the patient charge the payment is applied to
    account: patient_due
    direction: out
    triggers: []
  - type: plan_patient_adjustment
    target: care_plan_events
    meaning: An amount is removed from the patient's balance on the plan without a patient payment.
    grain: one row per adjustment of one patient charge
    distinguish_by: [adjustment_kind, source_event_id]
    fields:
      event_date: date of the adjustment
      adjustment_kind: why the balance is reduced
      amount: amount removed from the balance (positive)
      source_event_id: reference of the patient charge adjusted
    account: patient_due
    direction: out
    triggers: []
  - type: plan_patient_refund
    target: care_plan_events
    meaning: A credit balance on the plan is refunded to the patient.
    grain: one row per refund of one payment
    distinguish_by: [source_event_id, refund_method]
    fields:
      event_date: date the refund was issued
      amount: amount refunded (positive)
      refund_method: how the refund is returned
      source_event_id: reference of the patient payment being refunded
    account: patient_due
    direction: in
    triggers: []
  - type: plan_waiver_signed
    target: care_plan_events
    meaning: The patient signs an advance financial-responsibility waiver for visits the payer is not expected to cover.
    grain: one row per signed waiver
    distinguish_by: [waiver_kind, visit_date]
    fields:
      event_date: date the patient signed
      waiver_kind: which form was signed
      visit_date: first date of service the waiver covers
    triggers: []
  - type: plan_statement_issued
    target: care_plan_events
    meaning: A patient statement is issued for the open balance on the plan.
    grain: one row per statement
    distinguish_by: [event_date, statement_sequence]
    fields:
      event_date: statement date
      statement_sequence: ordinal of this statement on the current unpaid balance (1 for the first)
      amount: balance shown on the statement
    triggers: []

measures:
  - id: plan_msr_dos_visits_cy
    window: the current calendar year (January 1 to December 31 of the year of frozen_time)
    measure: count of distinct visit_date values of plan_visit_billed rows across all of the patient's care plans whose payer_name equals this plan's payer_name
  - id: plan_msr_allowed_cy
    window: the current calendar year (January 1 to December 31 of the year of frozen_time)
    measure: sum of allowed_amount of plan_visit_billed rows across all of the patient's care plans of tier Medicare Part B Plan of Care
  - id: plan_msr_visits_since_progress
    window: since the latest plan_visit_billed row on this plan whose visit_kind is evaluation, re_evaluation or progress_report
    measure: count of plan_visit_billed rows on this plan with visit_kind treatment or telehealth_treatment after that row

policies:
  - id: plan_agg_multi_holding
    subject: [plan_opened]
    rule: >-
      A patient may hold at most max_per_customer plans of care that are not closed at the same time, one per
      distinct diagnosis being treated. A new plan of care is not opened when the patient already holds a plan of care that is not closed with the same diagnosis code;
      the new episode is treated under the existing plan, and a discharged plan for the same diagnosis is not reopened
      but closed first once its balance is settled. When the cap is reached, the new diagnosis waits until one of the
      open plans is closed.
    eligibility:
      - id: no_open_plan_same_diagnosis
        applies_to: [plan_opened]
        kind: dedup
        condition: "A new plan of care is not opened when the patient already holds a plan of care that is not closed with the same diagnosis code;"
        evidence_fields: [care_plans.customer_id, care_plans.diagnosis_code, care_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_plans.customer_id, care_plans.diagnosis_code]
          action_bindings:
            care_plans.customer_id: customer_id
            care_plans.diagnosis_code: diagnosis_code
        dedup_contract:
          table: care_plans
          mode: separate_record
          object_bindings: {customer_id: customer_id, diagnosis_code: diagnosis_code}
          duplicate_filters: {status: [intake, active, on_hold, discharged]}
          distinct_fields: [opened_date]
    params:
      max_per_customer: 2

  - id: plan_agg_benefit_visit_limit
    subject: [plan_visit_billed, plan_waiver_signed, plan_patient_charge_posted]
    rule: >-
      The payer's calendar-year visit limit on file (benefit_year_visit_limit) is consumed jointly by every plan of care
      the patient holds with the same payer and by the visits the payer reports as used elsewhere
      (benefit_visits_used_elsewhere); where benefit_limit_shared_with_ot_st is true those reported visits include
      occupational and speech therapy. A date of service counts once even when two plans are treated that day, so the
      visits used are benefit_visits_used_elsewhere plus plan_msr_dos_visits_cy. A visit whose date of service would
      make the visits used exceed the limit is not covered. A visit beyond the visit limit is billed to the patient only when a waiver signed before that visit date is on file and the tier allows non-covered billing;
      the waiver must be the tier's non_covered_waiver_form, the patient is then charged self_pay_visit_rate as a
      non_covered_service charge, and the visit is not billed against an authorization. Without such a waiver, or where non_covered_billing_allowed is false, the visit is not
      rendered as a covered visit and nothing is charged to the patient for it. A benefit_year_visit_limit of 0 on file
      means the payer reported no visit limit.
    eligibility:
      - id: waiver_before_noncovered_visit
        applies_to: [plan_patient_charge_posted]
        kind: authorization
        condition: "A visit beyond the visit limit is billed to the patient only when a waiver signed before that visit date is on file and the tier allows non-covered billing;"
        evidence_fields: [care_plan_events.event_type, care_plan_events.event_date, care_plan_events.visit_date, care_plans.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_plan_events.visit_date]
          action_bindings:
            care_plan_events.visit_date: visit_date
    formula:
      visits_used_after: benefit_visits_used_elsewhere + plan_msr_dos_visits_cy + 1
      covered: benefit_year_visit_limit == 0 or visits_used_after <= benefit_year_visit_limit
      non_covered_charge: self_pay_visit_rate
    measures: [plan_msr_dos_visits_cy]

  - id: plan_opening_requirements
    subject: [plan_opened, plan_activated, plan_closed]
    rule: >-
      Benefits are verified with the payer no later than benefit_verification_lead_business_days business days before the
      initial evaluation, and the verified copay, coinsurance, deductible, visit limit and visits used elsewhere are
      recorded when the plan is opened. Where referral_required is true, the initial evaluation takes place no later than referral_valid_days calendar days after the referral date on file.
      Days are counted as calendar days from the referral date, the referral date itself being day zero. An evaluation
      outside that window needs a new referral before the plan is opened. The plan of care is activated only when the certifying signature is on file for tiers where physician_certification_required is true.
      A signature dated within cert_signature_days calendar days after the evaluation is a timely certification; a later
      signature is still accepted as a delayed certification, but no treatment visit is billed while it is missing.
      On activation the first certification period ends recert_interval_days calendar days after the opened date (no
      certification end date is set where recert_interval_days is 0). Where prior_auth_required is true, activation
      also requires an approved authorization on file unless the next visit is still within auth_exempt_visits. A plan
      still in intake whose initial authorization request is denied, or whose patient declines to proceed, is closed
      without treatment.
    eligibility:
      - id: referral_window
        applies_to: [plan_opened]
        kind: time
        condition: "Where referral_required is true, the initial evaluation takes place no later than referral_valid_days calendar days after the referral date on file."
        evidence_fields: [care_plans.referral_date, care_plans.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_plans.referral_date]
          action_bindings:
            care_plans.referral_date: referral_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the referral date on file
          anchor_source: care_plans.referral_date
          relation: not_after
          duration_source: variants.referral_valid_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the referral date, the referral date itself being day zero."
          boundary: inclusive
      - id: certification_on_file
        applies_to: [plan_activated]
        kind: authorization
        condition: "The plan of care is activated only when the certifying signature is on file for tiers where physician_certification_required is true."
        evidence_fields: [care_plans.physician_signed_date, care_plans.variant_name, care_plans.care_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_plans.care_plan_id]
          action_bindings:
            care_plans.care_plan_id: care_plan_id

  - id: plan_visit_authorization
    subject: [plan_visit_billed]
    rule: >-
      A visit is billed against the plan only while the plan is in intake or active status. The initial evaluation is
      billed in intake; every other visit requires active status. Where prior_auth_required is true, a visit after the first auth_exempt_visits visits is billed only when an approved authorization covers the visit date and still has visits remaining;
      the visit then records that authorization number and draws one authorized visit, and an evaluation draws one
      authorized visit only where auth_counts_evaluation is true. Where prior_auth_required is false the visit records
      no authorization number and draws no authorized visit. Where physician_certification_required is true, no visit
      dated after the certification end date is billed until the plan is recertified. Visits on one plan may not exceed
      max_visits_per_week in a Monday-to-Sunday week. Timed units are counted by unit_counting_method and capped at
      max_timed_units_per_visit. A telehealth_treatment visit is billed only where telehealth_covered is true. A claim
      not filed within timely_filing_days calendar days after the visit date is written off and is never billed to the
      patient.
    eligibility:
      - id: plan_billable_status
        applies_to: [plan_visit_billed]
        kind: state
        condition: "A visit is billed against the plan only while the plan is in intake or active status."
        evidence_fields: [care_plans.status, care_plans.care_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_plans.care_plan_id]
          action_bindings:
            care_plans.care_plan_id: care_plan_id
        state_contract:
          field: care_plans.status
          allowed: [intake, active]
      - id: authorization_covers_visit
        applies_to: [plan_visit_billed]
        kind: authorization
        condition: "Where prior_auth_required is true, a visit after the first auth_exempt_visits visits is billed only when an approved authorization covers the visit date and still has visits remaining;"
        evidence_fields: [care_plan_events.auth_number, care_plan_events.auth_start_date, care_plan_events.auth_end_date, care_plans.authorized_visits_remaining]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_plan_events.auth_number]
          action_bindings:
            care_plan_events.auth_number: auth_number

  - id: plan_evt_time_of_service_collection
    subject: [plan_patient_charge_posted]
    rule: >-
      Patient responsibility is posted only while the plan is not closed. Where cost_share_billable is false nothing
      is ever posted to the patient for a covered visit. Where collect_copay_at_tos is true the copay on file is posted
      as a copay charge on each billed visit, but no more than copay_per_date_of_service_max copays are posted for one
      date of service across all of the patient's plans with the same payer, and a copay of 0.00 on file posts nothing.
      Where collect_deductible_estimate_at_tos is true and deductible remains on file, a deductible_estimate charge of
      the lower of the visit's allowed amount, the deductible remaining and tos_deductible_estimate_cap is posted. Where
      coinsurance_billed_after_eob is true, the coinsurance and any deductible shown on the payer's explanation of
      benefits are posted as coinsurance or deductible charges within eob_patient_charge_days calendar days after the
      explanation of benefits arrives, less any deductible estimate already posted for that visit. A non_covered_service
      charge is posted only under plan_agg_benefit_visit_limit. A returned_from_payment_plan charge re-posts the unpaid
      part of a charge that came back from a defaulted or cancelled Patient Payment Plan and carries the original
      charge's reference.
    eligibility:
      - id: plan_not_closed_for_charges
        applies_to: [plan_patient_charge_posted]
        kind: state
        condition: "Patient responsibility is posted only while the plan is not closed."
        evidence_fields: [care_plans.status, care_plans.care_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_plans.care_plan_id]
          action_bindings:
            care_plans.care_plan_id: care_plan_id
        state_contract:
          field: care_plans.status
          allowed: [intake, active, on_hold, discharged]
    params:
      per_tier:
        Commercial PPO Plan of Care: {collect_copay_at_tos: "=collect_copay_at_tos", collect_deductible_estimate_at_tos: "=collect_deductible_estimate_at_tos", tos_deductible_estimate_cap: "=tos_deductible_estimate_cap"}
        Commercial High-Deductible Plan of Care: {collect_copay_at_tos: "=collect_copay_at_tos", collect_deductible_estimate_at_tos: "=collect_deductible_estimate_at_tos", tos_deductible_estimate_cap: "=tos_deductible_estimate_cap"}
        Commercial POS Plan of Care: {collect_copay_at_tos: "=collect_copay_at_tos", collect_deductible_estimate_at_tos: "=collect_deductible_estimate_at_tos", tos_deductible_estimate_cap: "=tos_deductible_estimate_cap"}
        Commercial HMO Plan of Care: {collect_copay_at_tos: "=collect_copay_at_tos", collect_deductible_estimate_at_tos: "=collect_deductible_estimate_at_tos", tos_deductible_estimate_cap: "=tos_deductible_estimate_cap"}
        Medicare Part B Plan of Care: {collect_copay_at_tos: "=collect_copay_at_tos", collect_deductible_estimate_at_tos: "=collect_deductible_estimate_at_tos", tos_deductible_estimate_cap: "=tos_deductible_estimate_cap"}
        Medicare Advantage Plan of Care: {collect_copay_at_tos: "=collect_copay_at_tos", collect_deductible_estimate_at_tos: "=collect_deductible_estimate_at_tos", tos_deductible_estimate_cap: "=tos_deductible_estimate_cap"}
        Medicaid Managed Care Plan of Care: {collect_copay_at_tos: "=collect_copay_at_tos", collect_deductible_estimate_at_tos: "=collect_deductible_estimate_at_tos", tos_deductible_estimate_cap: "=tos_deductible_estimate_cap"}
    formula:
      when: cost_share_billable
      copay_charge: copay_amount if collect_copay_at_tos else 0
      deductible_estimate_charge: min(allowed_amount, deductible_remaining, tos_deductible_estimate_cap) if collect_deductible_estimate_at_tos else 0

  - id: plan_medicare_kx_threshold
    subject: [plan_visit_billed]
    rule: >-
      Where kx_threshold_applies is true, the calendar-year therapy allowed total is prior_therapy_allowed_ytd plus
      plan_msr_allowed_cy. A visit whose allowed amount brings that total above kx_threshold_amount carries the KX
      modifier, attesting that continued therapy is medically necessary, and every later visit in the calendar year
      carries it too. Once the total would exceed targeted_review_threshold_amount the plan is flagged for possible
      targeted medical review and treatment continues with the KX modifier. Where kx_threshold_applies is false the
      KX modifier is never applied. The threshold is not a hard cap and never by itself makes a visit non-covered.
    eligibility: []
    formula:
      ytd_after_visit: prior_therapy_allowed_ytd + plan_msr_allowed_cy + allowed_amount
      kx_modifier: kx_threshold_applies and ytd_after_visit > kx_threshold_amount
      targeted_review_flag: kx_threshold_applies and ytd_after_visit > targeted_review_threshold_amount
    measures: [plan_msr_allowed_cy]

  - id: plan_certification_and_progress
    subject: [plan_recertified, plan_visit_billed]
    rule: >-
      Where physician_certification_required is true, a new certification period starts the day after the current
      certification end date and ends recert_interval_days calendar days later; it is recorded only when the physician
      signs the updated plan, and the new period may start no earlier than the day after the prior one ends. On every
      tier, once plan_msr_visits_since_progress reaches progress_report_every_visits minus one, the next visit is billed
      with visit_kind progress_report, which resets the count. A re_evaluation visit is billed only when the plan of care
      changes materially or at recertification, never routinely.
    eligibility: []
    measures: [plan_msr_visits_since_progress]

  - id: plan_evt_authorization_requests
    subject: [plan_auth_requested, plan_auth_approved, plan_auth_denied, plan_auth_recorded]
    rule: >-
      Authorization requests are submitted only while the plan is in intake, active or on_hold status. Where
      prior_auth_required is true, an extension request is submitted once the remaining authorized visits fall to
      auth_renewal_trigger_visits or fewer, and in any case no later than auth_request_lead_days calendar days before
      the current authorization end date. A request still pending after auth_pending_followup_business_days business
      days is followed up with the payer. A retroactive authorization request is submitted no later than retro_auth_window_days calendar days after the visit date of the earliest visit it asks to cover.
      Days are counted as calendar days from the visit date, the visit date itself being day zero. A retro_auth_window_days
      of 0 means the payer accepts no retroactive request, and visits rendered without authorization are then written
      off and never billed to the patient. After a denial, a peer_to_peer request may be made within
      peer_to_peer_window_days calendar days, and a written appeal is submitted no later than appeal_window_days calendar days after the date the denial was received.
      Days are counted as calendar days from the denial date, the denial date itself being day zero. An approval records its authorization number, date span and approved visits, and the plan's current authorization
      number and end date are updated to the newest approval. An active plan whose authorized visits are exhausted or
      whose authorization has ended is placed on hold for authorization until a new approval arrives.
    eligibility:
      - id: auth_request_status
        applies_to: [plan_auth_requested]
        kind: state
        condition: "Authorization requests are submitted only while the plan is in intake, active or on_hold status."
        evidence_fields: [care_plans.status, care_plans.care_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_plans.care_plan_id]
          action_bindings:
            care_plans.care_plan_id: care_plan_id
        state_contract:
          field: care_plans.status
          allowed: [intake, active, on_hold]
      - id: retro_request_window
        applies_to: [plan_auth_requested]
        kind: time
        condition: "A retroactive authorization request is submitted no later than retro_auth_window_days calendar days after the visit date of the earliest visit it asks to cover."
        evidence_fields: [care_plan_events.visit_date, care_plans.variant_name]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_plan_events.visit_date]
          action_bindings:
            care_plan_events.visit_date: visit_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the visit date of the earliest visit it asks to cover
          anchor_source: care_plan_events.visit_date
          relation: not_after
          duration_source: variants.retro_auth_window_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the visit date, the visit date itself being day zero."
          boundary: inclusive
      - id: appeal_window
        applies_to: [plan_auth_requested]
        kind: time
        condition: "a written appeal is submitted no later than appeal_window_days calendar days after the date the denial was received."
        evidence_fields: [care_plan_events.event_date, care_plan_events.care_plan_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_plan_events.care_plan_event_id]
          action_bindings:
            care_plan_events.care_plan_event_id: source_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the denial was received
          anchor_source: care_plan_events.event_date
          relation: not_after
          duration_source: variants.appeal_window_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the denial date, the denial date itself being day zero."
          boundary: inclusive

  - id: plan_evt_payment_application
    subject: [plan_patient_payment, plan_patient_refund]
    rule: >-
      Payments are taken only on a plan that is not closed. A payment is applied to the patient charge the patient names;
      when none is named it is applied to the oldest open charge by posting date. Where a payment leaves the plan in
      credit and credit_offset_other_balances is true, the credit is first applied to any other open charge on the same
      plan; any remaining credit is refunded within credit_refund_days calendar days after it arose. A refund goes back
      to the original card when it is issued within card_refund_window_days calendar days of the card payment, and by
      check otherwise or when the payment was not made by card. A refund never exceeds the payment it returns.
    eligibility:
      - id: payment_plan_not_closed
        applies_to: [plan_patient_payment]
        kind: state
        condition: "Payments are taken only on a plan that is not closed."
        evidence_fields: [care_plans.status, care_plans.care_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_plans.care_plan_id]
          action_bindings:
            care_plans.care_plan_id: care_plan_id
        state_contract:
          field: care_plans.status
          allowed: [intake, active, on_hold, discharged]

  - id: plan_evt_balance_adjustments
    subject: [plan_patient_adjustment, plan_statement_issued]
    rule: >-
      Statements are issued on an open patient balance every statement_cycle_days calendar days, numbered from 1 for
      that balance; statement number statements_before_collections is the final notice. An unpaid balance is transferred to collections no earlier than statement_cycle_days calendar days after the issue date of the final statement.
      Days are counted as calendar days from the statement date, the statement date itself being day zero. A balance on
      a Patient Payment Plan in good standing or under a pending hardship application is never transferred. Where
      small_balance_writeoff_allowed is true, a balance at or below small_balance_writeoff_max still open after the final
      statement is written off as small_balance_writeoff instead of being transferred. A charge posted above what the
      payer's explanation of benefits or the benefits on file support is corrected by a billing_error_correction for the
      excess. A charge for a visit whose claim missed timely_filing_days is removed in full as timely_filing_writeoff. A
      hardship_discount is posted only from an approved Patient Hardship Discount Program determination and only where
      hardship_discount_eligible is true. A transfer_to_payment_plan moves the enrolled amount of a charge into a Patient
      Payment Plan and only where payment_plan_eligible is true. No other adjustment kind exists; copays are never
      waived as a courtesy.
    eligibility:
      - id: final_statement_aged
        applies_to: [plan_patient_adjustment]
        kind: time
        condition: "An unpaid balance is transferred to collections no earlier than statement_cycle_days calendar days after the issue date of the final statement."
        evidence_fields: [care_plan_events.event_date, care_plan_events.statement_sequence, care_plan_events.care_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_plan_events.care_plan_id]
          action_bindings:
            care_plan_events.care_plan_id: care_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the issue date of the final statement
          anchor_source: care_plan_events.event_date
          relation: not_before
          duration_source: variants.statement_cycle_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the statement date, the statement date itself being day zero."
          boundary: inclusive
    params:
      per_tier:
        Commercial PPO Plan of Care: {small_balance_writeoff_max: "=small_balance_writeoff_max", statements_before_collections: "=statements_before_collections"}
        Commercial High-Deductible Plan of Care: {small_balance_writeoff_max: "=small_balance_writeoff_max", statements_before_collections: "=statements_before_collections"}
        Commercial POS Plan of Care: {small_balance_writeoff_max: "=small_balance_writeoff_max", statements_before_collections: "=statements_before_collections"}
        Commercial HMO Plan of Care: {small_balance_writeoff_max: "=small_balance_writeoff_max", statements_before_collections: "=statements_before_collections"}
        Medicare Part B Plan of Care: {small_balance_writeoff_max: "=small_balance_writeoff_max", statements_before_collections: "=statements_before_collections"}
        Medicare Advantage Plan of Care: {small_balance_writeoff_max: "=small_balance_writeoff_max", statements_before_collections: "=statements_before_collections"}
        Medicaid Managed Care Plan of Care: {small_balance_writeoff_max: "=small_balance_writeoff_max", statements_before_collections: "=statements_before_collections"}

  - id: plan_hold_and_discharge
    subject: [plan_held, plan_resumed, plan_discharged, plan_closed]
    rule: >-
      An active plan is placed on hold with the matching hold_reason when its authorization is pending, exhausted or
      ended, when its certification has lapsed, when surgery is pending, when the patient asks to pause, or when no visit
      has been billed for inactivity_discharge_days calendar days. A plan on hold resumes once the recorded reason is
      resolved. A plan on hold is discharged for non-attendance no earlier than hold_max_days calendar days after the hold start date on file.
      Days are counted as calendar days from the hold start date, the hold start date itself being day zero. The discharge
      summary is sent to the referring provider within discharge_summary_days calendar days after discharge, and any
      appointments still booked under the plan are released. A discharged plan is closed once its patient balance is
      zero and none of its charges sits in a Patient Payment Plan that is still pending signature, active, past due or
      defaulted; a plan still in intake is closed when its initial authorization is denied or the patient declines to
      proceed.
    eligibility:
      - id: hold_aged_for_discharge
        applies_to: [plan_discharged]
        kind: time
        condition: "A plan on hold is discharged for non-attendance no earlier than hold_max_days calendar days after the hold start date on file."
        evidence_fields: [care_plans.hold_start_date, care_plans.care_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_plans.care_plan_id]
          action_bindings:
            care_plans.care_plan_id: care_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the hold start date on file
          anchor_source: care_plans.hold_start_date
          relation: not_before
          duration_source: variants.hold_max_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the hold start date, the hold start date itself being day zero."
          boundary: inclusive

  - id: plan_evt_benefit_reverification
    subject: [plan_benefits_reverified]
    rule: >-
      Benefits on an active or on-hold plan are re-verified at least every benefit_reverify_interval_days calendar days
      after the benefits verified date on file, and, where reverify_benefits_each_calendar_year is true, before the first
      visit in a new calendar year, when deductibles and visit counts reset. Re-verification replaces the copay,
      coinsurance, deductible, visit limit, visits used elsewhere and Medicare allowed-to-date figures with the payer's
      current answer; charges already posted are not recalculated except through plan_evt_balance_adjustments.
    eligibility: []

# ============================================================================
# extended_policies (insured_plan_authorizations_and_balances)
# ============================================================================
extended_policies:
- id: plan_ext_coinsurance_correction
  base_policy_refs:
  - plan_evt_balance_adjustments
  - plan_evt_time_of_service_collection
  - plan_visit_authorization
  overwrite: []
  trigger: state_due
  subject:
  - plan_patient_adjustment
  computes: amount
  target_tool: correct_overposted_coinsurance_fd44d809
  params:
    reevaluation_component: 45.0
  rule: >-
    The coinsurance correction removes from a coinsurance charge the part that the payer's explanation of benefits and the
    benefits on file do not support, and it is booked as a billing error correction against that charge. The charge reviewed
    is the coinsurance charge posted most recently on the plan of care, earlier coinsurance charges having been reviewed
    when they were posted, and the visit reviewed is the billed visit whose date of service is the date of service of that
    charge. The coinsurance correction is the reviewed coinsurance charge less the supported coinsurance share, never below
    zero, rounded half up to the cent. The supported coinsurance share is the coinsurance percentage on file applied once
    to the reviewed visit's allowed amount, rounded half up to the cent. The amount a coinsurance percentage is applied
    to follows how the reviewed visit was billed: for a telehealth treatment visit on a payer program that does not cover
    telehealth it is zero; for any other visit billed with more timed units than the payer program's per-visit maximum it
    is the allowed amount prorated to that maximum, that is the allowed amount times the maximum units divided by the units
    billed, rounded half up to the cent; for every other visit it is the visit's allowed amount. Where the explanation of
    benefits applied a deductible to the reviewed visit, that deductible charge is taken out before the coinsurance percentage
    is applied; where no deductible charge but a deductible estimate was posted for that visit, the estimate is taken out
    instead; where neither was posted for that visit, nothing is taken out for the deductible. On a payer program that collects
    the copay at the time of service, the copay charge posted for the reviewed visit is taken out before the coinsurance
    percentage is applied, and where no copay charge was posted for that visit the copay on file is taken out instead; on
    a payer program that does not collect the copay at the time of service, nothing is taken out for the copay. The office-visit
    component the payer settles under its office-visit benefit is also taken out before the coinsurance percentage is applied:
    for a re-evaluation or progress report visit it is the fixed re-evaluation component; for an initial evaluation visit
    it is the whole allowed amount; for any other visit nothing is taken out for it. The amounts taken out for the deductible,
    the copay and the office-visit component are subtracted together from the amount the coinsurance percentage is applied
    to, the remainder is never taken below zero, and the coinsurance percentage is then applied once to that remainder.
  prerequisite: []
  cross_category: []
  compute:
  - coins_charge_id: >-
      LATEST('care_plan_events', 'care_plan_event_id', event_type='plan_patient_charge_posted', charge_kind='coinsurance')
  - coins_visit_date: >-
      LATEST('care_plan_events', 'visit_date', event_type='plan_patient_charge_posted', charge_kind='coinsurance')
  - coins_posted: SUM('care_plan_events', 'amount', care_plan_event_id=coins_charge_id)
  - visit_allowed: >-
      SUM('care_plan_events', 'allowed_amount', event_type='plan_visit_billed', visit_date=coins_visit_date)
  - visit_units: SUM('care_plan_events', 'cpt_units', event_type='plan_visit_billed', visit_date=coins_visit_date)
  - visit_kind: >-
      LATEST('care_plan_events', 'visit_kind', event_type='plan_visit_billed', visit_date=coins_visit_date)
  - coinsurance_base: >-
      0 if (visit_kind == 'telehealth_treatment' and not P('telehealth_covered')) else (RND(visit_allowed * P('max_timed_units_per_visit')
      / visit_units, 2) if visit_units > P('max_timed_units_per_visit') else visit_allowed)
  - visit_deductible: >-
      SUM('care_plan_events', 'amount', event_type='plan_patient_charge_posted', charge_kind='deductible', visit_date=coins_visit_date)
  - visit_estimate: >-
      SUM('care_plan_events', 'amount', event_type='plan_patient_charge_posted', charge_kind='deductible_estimate', visit_date=coins_visit_date)
  - deductible_taken_first: visit_deductible if visit_deductible > 0 else (visit_estimate if visit_estimate > 0 else 0)
  - visit_copay: >-
      SUM('care_plan_events', 'amount', event_type='plan_patient_charge_posted', charge_kind='copay', visit_date=coins_visit_date)
  - copay_taken_first: >-
      visit_copay if (P('collect_copay_at_tos') and visit_copay > 0) else (F('copay_amount') if P('collect_copay_at_tos')
      else 0)
  - office_visit_component: >-
      K('reevaluation_component') if (visit_kind == 're_evaluation' or visit_kind == 'progress_report') else (visit_allowed
      if visit_kind == 'evaluation' else 0)
  - supported_share: >-
      RND(F('coinsurance_percent') / 100 * MX(0, coinsurance_base - deductible_taken_first - copay_taken_first - office_visit_component),
      2)
  - result: RND(MX(0, coins_posted - supported_share), 2)
  compute_basis:
    coins_charge_id: >-
      The charge reviewed is the coinsurance charge posted most recently on the plan of care, earlier coinsurance charges
      having been reviewed when they were posted, and the visit reviewed is the billed visit whose date of service is the
      date of service of that charge.
    coins_visit_date: >-
      The charge reviewed is the coinsurance charge posted most recently on the plan of care, earlier coinsurance charges
      having been reviewed when they were posted, and the visit reviewed is the billed visit whose date of service is the
      date of service of that charge.
    coins_posted: >-
      The coinsurance correction is the reviewed coinsurance charge less the supported coinsurance share, never below zero,
      rounded half up to the cent.
    visit_allowed: >-
      The supported coinsurance share is the coinsurance percentage on file applied once to the reviewed visit's allowed
      amount, rounded half up to the cent.
    visit_units: >-
      The amount a coinsurance percentage is applied to follows how the reviewed visit was billed: for a telehealth treatment
      visit on a payer program that does not cover telehealth it is zero; for any other visit billed with more timed units
      than the payer program's per-visit maximum it is the allowed amount prorated to that maximum, that is the allowed
      amount times the maximum units divided by the units billed, rounded half up to the cent; for every other visit it
      is the visit's allowed amount.
    visit_kind: >-
      The office-visit component the payer settles under its office-visit benefit is also taken out before the coinsurance
      percentage is applied: for a re-evaluation or progress report visit it is the fixed re-evaluation component; for an
      initial evaluation visit it is the whole allowed amount; for any other visit nothing is taken out for it.
    coinsurance_base: >-
      The amount a coinsurance percentage is applied to follows how the reviewed visit was billed: for a telehealth treatment
      visit on a payer program that does not cover telehealth it is zero; for any other visit billed with more timed units
      than the payer program's per-visit maximum it is the allowed amount prorated to that maximum, that is the allowed
      amount times the maximum units divided by the units billed, rounded half up to the cent; for every other visit it
      is the visit's allowed amount.
    visit_deductible: >-
      Where the explanation of benefits applied a deductible to the reviewed visit, that deductible charge is taken out
      before the coinsurance percentage is applied; where no deductible charge but a deductible estimate was posted for
      that visit, the estimate is taken out instead; where neither was posted for that visit, nothing is taken out for the
      deductible.
    visit_estimate: >-
      Where the explanation of benefits applied a deductible to the reviewed visit, that deductible charge is taken out
      before the coinsurance percentage is applied; where no deductible charge but a deductible estimate was posted for
      that visit, the estimate is taken out instead; where neither was posted for that visit, nothing is taken out for the
      deductible.
    deductible_taken_first: >-
      Where the explanation of benefits applied a deductible to the reviewed visit, that deductible charge is taken out
      before the coinsurance percentage is applied; where no deductible charge but a deductible estimate was posted for
      that visit, the estimate is taken out instead; where neither was posted for that visit, nothing is taken out for the
      deductible.
    visit_copay: >-
      On a payer program that collects the copay at the time of service, the copay charge posted for the reviewed visit
      is taken out before the coinsurance percentage is applied, and where no copay charge was posted for that visit the
      copay on file is taken out instead; on a payer program that does not collect the copay at the time of service, nothing
      is taken out for the copay.
    copay_taken_first: >-
      On a payer program that collects the copay at the time of service, the copay charge posted for the reviewed visit
      is taken out before the coinsurance percentage is applied, and where no copay charge was posted for that visit the
      copay on file is taken out instead; on a payer program that does not collect the copay at the time of service, nothing
      is taken out for the copay.
    office_visit_component: >-
      The office-visit component the payer settles under its office-visit benefit is also taken out before the coinsurance
      percentage is applied: for a re-evaluation or progress report visit it is the fixed re-evaluation component; for an
      initial evaluation visit it is the whole allowed amount; for any other visit nothing is taken out for it.
    supported_share: >-
      The amounts taken out for the deductible, the copay and the office-visit component are subtracted together from the
      amount the coinsurance percentage is applied to, the remainder is never taken below zero, and the coinsurance percentage
      is then applied once to that remainder.
    result: >-
      The coinsurance correction is the reviewed coinsurance charge less the supported coinsurance share, never below zero,
      rounded half up to the cent.
  factors:
  - id: unit_maximum_base
    effect: method
    decides: coinsurance_base
    bindings:
    - visit_units
    - coinsurance_base
    ladder:
    - when: the reviewed visit is a telehealth treatment visit and the payer program does not cover telehealth
      method: the amount the coinsurance percentage is applied to is zero
    - when: >-
        the reviewed visit is any other visit and was billed with more timed units than the payer program's per-visit maximum
      method: >-
        the allowed amount is prorated to the maximum: allowed amount times the maximum units divided by the units billed,
        rounded half up to the cent
    - when: otherwise
      method: the visit's allowed amount is used as billed
    baseline:
      coinsurance_base: visit_allowed
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: deductible_taken_first
    effect: parameter
    decides: deductible_taken_first
    bindings:
    - visit_deductible
    - visit_estimate
    - deductible_taken_first
    ladder:
    - when: a deductible charge from the explanation of benefits stands for the reviewed visit
      value: that deductible charge
    - when: no deductible charge but a deductible estimate stands for the reviewed visit
      value: that deductible estimate
    - when: otherwise
      value: '0.00'
    baseline:
      deductible_taken_first: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: copay_taken_first
    effect: parameter
    decides: copay_taken_first
    bindings:
    - visit_copay
    - copay_taken_first
    ladder:
    - when: >-
        the payer program collects the copay at the time of service and a copay charge was posted for the reviewed visit
      value: that copay charge
    - when: >-
        the payer program collects the copay at the time of service and no copay charge was posted for the reviewed visit
      value: the copay on file
    - when: otherwise
      value: '0.00'
    baseline:
      copay_taken_first: '0'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: office_visit_component
    effect: parameter
    decides: office_visit_component
    bindings:
    - visit_kind
    - office_visit_component
    ladder:
    - when: the reviewed visit is a re-evaluation or a progress report visit
      value: K('reevaluation_component')
    - when: the reviewed visit is an initial evaluation visit
      value: the visit's whole allowed amount
    - when: otherwise
      value: '0.00'
    baseline:
      office_visit_component: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The coinsurance correction is the reviewed coinsurance charge less the supported coinsurance share, never below zero,
      rounded half up to the cent. The supported coinsurance share is the coinsurance percentage on file applied once to
      the reviewed visit's allowed amount, rounded half up to the cent.
    params: []
  inputs:
    history:
    - table: care_plan_events
      aggregate: latest
      field: care_plan_event_id
      filters:
        event_type: plan_patient_charge_posted
        charge_kind: coinsurance
    - table: care_plan_events
      aggregate: sum
      field: allowed_amount
      filters:
        event_type: plan_visit_billed
    - table: care_plan_events
      aggregate: sum
      field: amount
      filters:
        event_type: plan_patient_charge_posted
        charge_kind: deductible
    - table: care_plan_events
      aggregate: sum
      field: amount
      filters:
        event_type: plan_patient_charge_posted
        charge_kind: copay
    cross_category: []
- id: plan_ext_noncovered_visit_charge
  base_policy_refs:
  - plan_agg_benefit_visit_limit
  - plan_evt_time_of_service_collection
  overwrite:
  - base_policy: plan_agg_benefit_visit_limit
    superseded_clause: the patient is then charged self_pay_visit_rate as a non_covered_service charge
    replaced_by: >-
      The patient is charged the non-covered visit charge as a non-covered service charge in place of a flat self-pay visit
      rate.
  trigger: state_due
  subject:
  - plan_patient_charge_posted
  computes: amount
  target_tool: post_noncovered_visit_charge_a3bfc726
  params:
    extended_self_pay_rate: 156.0
    short_self_pay_rate: 88.0
    minutes_per_timed_unit: 15
    frozen_member_discount_share: 50
  rule: >-
    The non-covered visit charge is what a patient is charged, as a non-covered service charge carrying the billed visit
    it belongs to, for a visit beyond the payer's calendar-year visit limit that was rendered under a waiver signed before
    that visit. The visit charged is the latest billed visit on the plan of care by date of service, the date of service
    that runs past the visit limit, and it is held in the appointment series the plan of care funds. The non-covered visit
    charge is the payer program's self-pay visit rate, rounded half up to the cent. The rate a non-covered visit is charged
    at follows the length of the appointment slot it was held in: a telehealth treatment visit, or an in-clinic visit held
    in an appointment series whose slots last 37 minutes or less, is charged the short-visit self-pay rate; an in-clinic
    visit held in an appointment series whose slots last 53 minutes or more is charged the extended-visit self-pay rate;
    any other visit is charged the payer program's self-pay visit rate. The minutes delivered at a non-covered visit are
    counted from the appointment record: for an in-clinic visit the patient reached late but within the series' grace period,
    in a series that sees a late arrival for the remaining slot time, they are the slot length less the minutes late; for
    a telehealth treatment visit they are the timed units billed for the visit times the minutes in one timed unit; for
    any other visit they are the full slot length. The rate follows the time actually delivered under the payer program's
    own unit-counting method: on a payer program that counts units by the CMS 8-minute rule, for a visit other than an evaluation
    or re-evaluation, the rate is multiplied by the whole timed units the minutes delivered come to divided by the whole
    timed units the full slot length comes to, a number of minutes coming to whole timed units by adding half the minutes
    in one timed unit, dividing by the minutes in one timed unit and dropping any fraction; on a payer program that counts
    units by the AMA substantial-portion method, for a visit other than an evaluation or re-evaluation, the rate is multiplied
    by the minutes delivered divided by the slot length; in either case the ratio is rounded half up to four decimal places;
    for an evaluation or re-evaluation visit, or on any other counting method, the rate is charged in full. Wellness membership
    pricing is applied to the time-adjusted rate: a patient holding an active wellness membership is given the membership
    tier's member package discount percentage off; a patient whose wellness membership is frozen is given the frozen-membership
    share of that percentage off; any other patient is given no discount. What the patient already paid at the time of service
    for that visit is credited against the charge: payments applied to the copay charge of that visit are credited in full;
    where no copay was paid for that visit, payments applied to the deductible estimate of that visit are credited instead;
    otherwise nothing is credited. The rate is first multiplied by the time ratio, the discount percentage then acts once
    on that product, the time-of-service credit is subtracted from the discounted amount, the charge is never below zero,
    and only the final charge is rounded half up to the cent. The patient is charged the non-covered visit charge as a non-covered
    service charge in place of a flat self-pay visit rate.
  prerequisite: []
  cross_category:
  - category: series
    as: history
    reads:
    - visit_length_minutes
    - grace_minutes_late_arrival
    - late_arrival_shortened_visit
    - series_events.minutes_late
    note: >-
      The slot length, grace period and late-arrival handling of the series the plan funds, and the minutes late recorded
      for the charged visit, decide the rate tier and the minutes delivered.
  - category: membership
    as: branch
    reads:
    - status
    - member_package_discount_percent
    note: An active or frozen wellness membership decides the member discount tier.
  compute:
  - noncovered_visit_date: LATEST('care_plan_events', 'visit_date', event_type='plan_visit_billed', date_field='visit_date')
  - noncovered_visit_kind: >-
      LATEST('care_plan_events', 'visit_kind', event_type='plan_visit_billed', visit_date=noncovered_visit_date)
  - noncovered_units: >-
      SUM('care_plan_events', 'cpt_units', event_type='plan_visit_billed', visit_date=noncovered_visit_date)
  - slot_minutes: CPARAM('series', 'visit_length_minutes', care_plan_id=HID)
  - visit_rate: >-
      K('short_self_pay_rate') if (noncovered_visit_kind == 'telehealth_treatment' or slot_minutes <= 37) else (K('extended_self_pay_rate')
      if (noncovered_visit_kind != 'telehealth_treatment' and slot_minutes >= 53) else P('self_pay_visit_rate'))
  - minutes_late: >-
      XLATEST('series', 'series_events', 'minutes_late', event_type='series_visit_attended', appointment_date=noncovered_visit_date)
  - grace_minutes: CPARAM('series', 'grace_minutes_late_arrival', care_plan_id=HID)
  - shortens_late_visits: CPARAM('series', 'late_arrival_shortened_visit', care_plan_id=HID)
  - minutes_delivered: >-
      slot_minutes - minutes_late if (noncovered_visit_kind != 'telehealth_treatment' and minutes_late and minutes_late
      > 0 and minutes_late <= grace_minutes and shortens_late_visits) else (noncovered_units * K('minutes_per_timed_unit')
      if noncovered_visit_kind == 'telehealth_treatment' else slot_minutes)
  - slot_whole_units: int((slot_minutes + K('minutes_per_timed_unit') / 2) / K('minutes_per_timed_unit'))
  - time_share: >-
      RND(int((minutes_delivered + K('minutes_per_timed_unit') / 2) / K('minutes_per_timed_unit')) / slot_whole_units, 4)
      if (P('unit_counting_method') == 'cms_8_minute_rule' and noncovered_visit_kind != 'evaluation' and noncovered_visit_kind
      != 're_evaluation') else (RND(minutes_delivered / slot_minutes, 4) if (P('unit_counting_method') == 'ama_substantial_portion'
      and noncovered_visit_kind != 'evaluation' and noncovered_visit_kind != 're_evaluation') else 1)
  - member_discount_pct: >-
      CPARAM('membership', 'member_package_discount_percent', status='active') if EXISTS('membership', status='active')
      else (CPARAM('membership', 'member_package_discount_percent', status='frozen') * K('frozen_member_discount_share')
      / 100 if EXISTS('membership', status='frozen') else 0)
  - visit_copay_charge: >-
      LATEST('care_plan_events', 'care_plan_event_id', event_type='plan_patient_charge_posted', charge_kind='copay', visit_date=noncovered_visit_date)
  - visit_estimate_charge: >-
      LATEST('care_plan_events', 'care_plan_event_id', event_type='plan_patient_charge_posted', charge_kind='deductible_estimate',
      visit_date=noncovered_visit_date)
  - visit_copay_paid: >-
      SUM('care_plan_events', 'amount', event_type='plan_patient_payment', source_event_id=visit_copay_charge) if visit_copay_charge
      else 0
  - visit_estimate_paid: >-
      SUM('care_plan_events', 'amount', event_type='plan_patient_payment', source_event_id=visit_estimate_charge) if visit_estimate_charge
      else 0
  - time_of_service_credit: >-
      visit_copay_paid if visit_copay_paid > 0 else (visit_estimate_paid if visit_estimate_paid > 0 else 0)
  - result: RND(MX(0, visit_rate * time_share * (100 - member_discount_pct) / 100 - time_of_service_credit), 2)
  compute_basis:
    noncovered_visit_date: >-
      The visit charged is the latest billed visit on the plan of care by date of service, the date of service that runs
      past the visit limit, and it is held in the appointment series the plan of care funds.
    noncovered_visit_kind: >-
      The rate a non-covered visit is charged at follows the length of the appointment slot it was held in: a telehealth
      treatment visit, or an in-clinic visit held in an appointment series whose slots last 37 minutes or less, is charged
      the short-visit self-pay rate; an in-clinic visit held in an appointment series whose slots last 53 minutes or more
      is charged the extended-visit self-pay rate; any other visit is charged the payer program's self-pay visit rate.
    noncovered_units: >-
      The minutes delivered at a non-covered visit are counted from the appointment record: for an in-clinic visit the patient
      reached late but within the series' grace period, in a series that sees a late arrival for the remaining slot time,
      they are the slot length less the minutes late; for a telehealth treatment visit they are the timed units billed for
      the visit times the minutes in one timed unit; for any other visit they are the full slot length.
    slot_minutes: >-
      The rate a non-covered visit is charged at follows the length of the appointment slot it was held in: a telehealth
      treatment visit, or an in-clinic visit held in an appointment series whose slots last 37 minutes or less, is charged
      the short-visit self-pay rate; an in-clinic visit held in an appointment series whose slots last 53 minutes or more
      is charged the extended-visit self-pay rate; any other visit is charged the payer program's self-pay visit rate.
    visit_rate: >-
      The rate a non-covered visit is charged at follows the length of the appointment slot it was held in: a telehealth
      treatment visit, or an in-clinic visit held in an appointment series whose slots last 37 minutes or less, is charged
      the short-visit self-pay rate; an in-clinic visit held in an appointment series whose slots last 53 minutes or more
      is charged the extended-visit self-pay rate; any other visit is charged the payer program's self-pay visit rate.
    minutes_late: >-
      The minutes delivered at a non-covered visit are counted from the appointment record: for an in-clinic visit the patient
      reached late but within the series' grace period, in a series that sees a late arrival for the remaining slot time,
      they are the slot length less the minutes late; for a telehealth treatment visit they are the timed units billed for
      the visit times the minutes in one timed unit; for any other visit they are the full slot length.
    grace_minutes: >-
      The minutes delivered at a non-covered visit are counted from the appointment record: for an in-clinic visit the patient
      reached late but within the series' grace period, in a series that sees a late arrival for the remaining slot time,
      they are the slot length less the minutes late; for a telehealth treatment visit they are the timed units billed for
      the visit times the minutes in one timed unit; for any other visit they are the full slot length.
    shortens_late_visits: >-
      The minutes delivered at a non-covered visit are counted from the appointment record: for an in-clinic visit the patient
      reached late but within the series' grace period, in a series that sees a late arrival for the remaining slot time,
      they are the slot length less the minutes late; for a telehealth treatment visit they are the timed units billed for
      the visit times the minutes in one timed unit; for any other visit they are the full slot length.
    minutes_delivered: >-
      The minutes delivered at a non-covered visit are counted from the appointment record: for an in-clinic visit the patient
      reached late but within the series' grace period, in a series that sees a late arrival for the remaining slot time,
      they are the slot length less the minutes late; for a telehealth treatment visit they are the timed units billed for
      the visit times the minutes in one timed unit; for any other visit they are the full slot length.
    slot_whole_units: >-
      The rate follows the time actually delivered under the payer program's own unit-counting method: on a payer program
      that counts units by the CMS 8-minute rule, for a visit other than an evaluation or re-evaluation, the rate is multiplied
      by the whole timed units the minutes delivered come to divided by the whole timed units the full slot length comes
      to, a number of minutes coming to whole timed units by adding half the minutes in one timed unit, dividing by the
      minutes in one timed unit and dropping any fraction; on a payer program that counts units by the AMA substantial-portion
      method, for a visit other than an evaluation or re-evaluation, the rate is multiplied by the minutes delivered divided
      by the slot length; in either case the ratio is rounded half up to four decimal places; for an evaluation or re-evaluation
      visit, or on any other counting method, the rate is charged in full.
    time_share: >-
      The rate follows the time actually delivered under the payer program's own unit-counting method: on a payer program
      that counts units by the CMS 8-minute rule, for a visit other than an evaluation or re-evaluation, the rate is multiplied
      by the whole timed units the minutes delivered come to divided by the whole timed units the full slot length comes
      to, a number of minutes coming to whole timed units by adding half the minutes in one timed unit, dividing by the
      minutes in one timed unit and dropping any fraction; on a payer program that counts units by the AMA substantial-portion
      method, for a visit other than an evaluation or re-evaluation, the rate is multiplied by the minutes delivered divided
      by the slot length; in either case the ratio is rounded half up to four decimal places; for an evaluation or re-evaluation
      visit, or on any other counting method, the rate is charged in full.
    member_discount_pct: >-
      Wellness membership pricing is applied to the time-adjusted rate: a patient holding an active wellness membership
      is given the membership tier's member package discount percentage off; a patient whose wellness membership is frozen
      is given the frozen-membership share of that percentage off; any other patient is given no discount.
    visit_copay_charge: >-
      What the patient already paid at the time of service for that visit is credited against the charge: payments applied
      to the copay charge of that visit are credited in full; where no copay was paid for that visit, payments applied to
      the deductible estimate of that visit are credited instead; otherwise nothing is credited.
    visit_estimate_charge: >-
      What the patient already paid at the time of service for that visit is credited against the charge: payments applied
      to the copay charge of that visit are credited in full; where no copay was paid for that visit, payments applied to
      the deductible estimate of that visit are credited instead; otherwise nothing is credited.
    visit_copay_paid: >-
      What the patient already paid at the time of service for that visit is credited against the charge: payments applied
      to the copay charge of that visit are credited in full; where no copay was paid for that visit, payments applied to
      the deductible estimate of that visit are credited instead; otherwise nothing is credited.
    visit_estimate_paid: >-
      What the patient already paid at the time of service for that visit is credited against the charge: payments applied
      to the copay charge of that visit are credited in full; where no copay was paid for that visit, payments applied to
      the deductible estimate of that visit are credited instead; otherwise nothing is credited.
    time_of_service_credit: >-
      What the patient already paid at the time of service for that visit is credited against the charge: payments applied
      to the copay charge of that visit are credited in full; where no copay was paid for that visit, payments applied to
      the deductible estimate of that visit are credited instead; otherwise nothing is credited.
    result: >-
      The rate is first multiplied by the time ratio, the discount percentage then acts once on that product, the time-of-service
      credit is subtracted from the discounted amount, the charge is never below zero, and only the final charge is rounded
      half up to the cent.
  factors:
  - id: slot_rate
    effect: parameter
    decides: visit_rate
    bindings:
    - slot_minutes
    - visit_rate
    ladder:
    - when: >-
        a telehealth treatment visit, or an in-clinic visit held in a series whose slots last 37 minutes or less
      value: K('short_self_pay_rate')
    - when: an in-clinic visit held in a series whose slots last 53 minutes or more
      value: K('extended_self_pay_rate')
    - when: otherwise
      value: P('self_pay_visit_rate')
    baseline:
      visit_rate: P('self_pay_visit_rate')
    evidence:
    - cross_category
    - history
    cross_difficulty: series
  - id: minutes_delivered
    effect: method
    decides: minutes_delivered
    bindings:
    - noncovered_units
    - minutes_late
    - grace_minutes
    - shortens_late_visits
    - minutes_delivered
    ladder:
    - when: >-
        an in-clinic visit reached late within the series' grace period, in a series that sees a late arrival for the remaining
        slot time
      method: slot length less the minutes late
    - when: a telehealth treatment visit
      method: timed units billed times the minutes in one timed unit
    - when: otherwise
      method: the full slot length
    baseline:
      minutes_delivered: slot_minutes
    evidence:
    - cross_category
    - history
    cross_difficulty: series
  - id: time_ratio
    effect: method
    decides: time_share
    bindings:
    - noncovered_visit_kind
    - slot_whole_units
    - time_share
    ladder:
    - when: >-
        the payer program counts units by the CMS 8-minute rule and the visit is not an evaluation or re-evaluation
      method: >-
        whole timed units of the minutes delivered divided by whole timed units of the slot, rounded half up to four places
    - when: >-
        the payer program counts units by the AMA substantial-portion method and the visit is not an evaluation or re-evaluation
      method: minutes delivered divided by the slot length, rounded half up to four places
    - when: otherwise
      method: the rate is charged in full (ratio 1)
    baseline:
      time_share: '1'
    evidence:
    - history
    - tier_param
    cross_difficulty: null
  - id: member_pricing
    effect: parameter
    decides: member_discount_pct
    bindings:
    - member_discount_pct
    ladder:
    - when: the patient holds an active wellness membership
      value: the membership tier's member package discount percentage
    - when: the patient's wellness membership is frozen
      value: that percentage times K('frozen_member_discount_share') / 100
    - when: otherwise
      value: '0'
    baseline:
      member_discount_pct: '0'
    evidence:
    - cross_category
    cross_difficulty: membership
  - id: time_of_service_credit
    effect: parameter
    decides: time_of_service_credit
    bindings:
    - visit_copay_charge
    - visit_estimate_charge
    - visit_copay_paid
    - visit_estimate_paid
    - time_of_service_credit
    ladder:
    - when: payments stand applied to the copay charge of the charged visit
      value: those copay payments
    - when: no copay was paid for the charged visit and payments stand applied to its deductible estimate
      value: those estimate payments
    - when: otherwise
      value: '0.00'
    baseline:
      time_of_service_credit: '0'
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The non-covered visit charge is the payer program's self-pay visit rate, rounded half up to the cent.
    params:
    - self_pay_visit_rate
  inputs:
    history:
    - table: care_plan_events
      aggregate: latest
      field: visit_date
      filters:
        event_type: plan_visit_billed
    - table: care_plan_events
      aggregate: sum
      field: amount
      filters:
        event_type: plan_patient_payment
    - category: series
      table: series_events
      aggregate: latest
      field: minutes_late
      filters:
        event_type: series_visit_attended
    cross_category:
    - series
    - membership
- id: plan_ext_credit_refund
  base_policy_refs:
  - plan_evt_payment_application
  - plan_evt_time_of_service_collection
  overwrite:
  - base_policy: plan_evt_payment_application
    superseded_clause: any remaining credit is refunded within credit_refund_days calendar days after it arose
    replaced_by: >-
      The credit standing on the plan is refunded, less the holds set out below, within the payer program's credit refund
      period after it arose.
  trigger: state_due
  subject:
  - plan_patient_refund
  computes: amount
  target_tool: issue_credit_refund_cc5fc5ad
  params:
    short_refund_period_days: 30
    overdue_eob_hold_per_visit: 20.0
    check_clearing_days: 10
    ach_clearing_days: 5
    small_credit_max: 10.0
  rule: >-
    The refundable credit is the part of the credit standing on a plan of care that is returned to the patient now; whatever
    is held back stays on the plan as a credit until the reason for holding it ends. The credit standing on the plan is
    refunded, less the holds set out below, within the payer program's credit refund period after it arose. The credit standing
    on the plan of care is worked out from its ledger: every patient payment and every balance adjustment on the plan, less
    every patient charge and every refund already issued on the plan, never below zero. The refund is returned against the
    patient's most recent payment on the plan. The refundable credit is that credit, no larger than the payment it is returned
    against, rounded half up to the cent. Coinsurance still to come from explanations of benefits not yet received is held
    back over a window that follows the payer program's refund period: on a payer program that bills coinsurance after the
    explanation of benefits and must refund a credit within the short refund period or sooner, the hold is the coinsurance
    percentage on file times the allowed amounts of the visits dated within the last month, less the coinsurance charges
    posted for visits dated within that month; on a payer program that bills coinsurance after the explanation of benefits
    and allows longer than the short refund period, the same is counted over the visits dated within the last two months;
    on a payer program that does not bill coinsurance after the explanation of benefits, nothing is held for coinsurance
    still to come; the hold is never below zero and is rounded half up to the cent. A visit is dated within the last N months
    when fewer than N whole calendar months separate its date of service from today. Visits whose explanation of benefits
    is overdue are covered by a further hold, a visit counting here when at least one but fewer than three whole calendar
    months separate its date of service from today, it is not an initial evaluation, and no coinsurance charge and no non-covered
    service charge has been posted for it: where one or two such visits stand, the overdue-explanation hold per visit is
    held for each of them; where three or more stand, the whole credit is held; where none stands, nothing is held for them.
    Money not yet cleared is held, days being counted as calendar days from the date the payment was received, that date
    itself being day zero: where the most recent check payment on the plan was received fewer than the check clearing days
    ago, its amount is held; where no check payment is that recent but the most recent bank-transfer payment was received
    fewer than the bank-transfer clearing days ago, its amount is held; otherwise nothing is held for uncleared funds. The
    holds for coinsurance still to come, for overdue explanations of benefits and for uncleared funds are subtracted together
    from the credit, and what remains is never below zero. A further hold is then taken from what remains: where the appointment
    series funded by the plan carries an unpaid missed-visit fee balance and the most recent fee on that series was assessed
    more than the series' fee due days ago, that unpaid fee balance is held until it is settled; where no such overdue fee
    stands and what remains is the small-credit maximum or less, all of it is held on the plan; otherwise nothing more is
    held. The payment the refund is returned against, and so its ceiling, is chosen in this order: the most recent card
    payment on the plan when it was made no more than the payer program's card refund window ago; otherwise, where the plan
    carries a check payment, the most recent check payment; otherwise the most recent payment on the plan. The refundable
    credit is what remains after every hold, never below zero and no larger than the payment it is returned against, rounded
    half up to the cent. The refundable credit is fixed only after every coinsurance charge on the plan that is higher than
    the share its explanation of benefits supports carries a billing error correction. The refundable credit is not worked
    out until each visit on the plan that ran past the payer's visit limit under a signed waiver carries its non-covered
    service charge.
  prerequisite:
  - problem: plan_ext_coinsurance_correction
    kind: value_input
    gate: adjustments_total
    form: state
    policy_source: >-
      The refundable credit is fixed only after every coinsurance charge on the plan that is higher than the share its explanation
      of benefits supports carries a billing error correction.
    condition: >-
      every plan_patient_charge_posted row with charge_kind coinsurance on the plan whose amount exceeds the supported coinsurance
      share carries a plan_patient_adjustment row with adjustment_kind billing_error_correction pointing back to it
    resolved_by: correct_overposted_coinsurance_fd44d809
    effect: >-
      the billing error correction adds its amount to the adjustments on the plan's ledger, so the credit standing on the
      plan, and with it the refundable credit, rises by the corrected excess
  - problem: plan_ext_noncovered_visit_charge
    kind: value_input
    gate: charges_total
    form: state
    policy_source: >-
      The refundable credit is not worked out until each visit on the plan that ran past the payer's visit limit under a
      signed waiver carries its non-covered service charge.
    condition: >-
      every plan_visit_billed row on the plan whose date of service ran past the visit limit and is covered by a plan_waiver_signed
      row carries a plan_patient_charge_posted row with charge_kind non_covered_service for that visit date
    resolved_by: post_noncovered_visit_charge_a3bfc726
    effect: >-
      the non-covered service charge adds its amount to the charges on the plan's ledger, so the credit standing on the
      plan, and with it the refundable credit, falls by that charge
  cross_category:
  - category: series
    as: history
    reads:
    - missed_fee_balance
    - series_id
    - fee_due_days
    - series_events.event_date
    note: An overdue unpaid missed-visit fee on the series the plan funds is held back from the refund.
  compute:
  - charges_total: SUM('care_plan_events', 'amount', event_type='plan_patient_charge_posted')
  - payments_total: SUM('care_plan_events', 'amount', event_type='plan_patient_payment')
  - adjustments_total: SUM('care_plan_events', 'amount', event_type='plan_patient_adjustment')
  - refunds_total: SUM('care_plan_events', 'amount', event_type='plan_patient_refund')
  - credit_on_plan: RND(MX(0, payments_total + adjustments_total - charges_total - refunds_total), 2)
  - share_1m: >-
      F('coinsurance_percent') / 100 * SUM('care_plan_events', 'allowed_amount', within_months=1, date_field='visit_date',
      event_type='plan_visit_billed')
  - posted_1m: >-
      SUM('care_plan_events', 'amount', within_months=1, date_field='visit_date', event_type='plan_patient_charge_posted',
      charge_kind='coinsurance')
  - share_2m: >-
      F('coinsurance_percent') / 100 * SUM('care_plan_events', 'allowed_amount', within_months=2, date_field='visit_date',
      event_type='plan_visit_billed')
  - posted_2m: >-
      SUM('care_plan_events', 'amount', within_months=2, date_field='visit_date', event_type='plan_patient_charge_posted',
      charge_kind='coinsurance')
  - pending_eob_hold: >-
      RND(MX(0, share_1m - posted_1m), 2) if (P('coinsurance_billed_after_eob') and P('credit_refund_days') <= K('short_refund_period_days'))
      else (RND(MX(0, share_2m - posted_2m), 2) if (P('coinsurance_billed_after_eob') and P('credit_refund_days') > K('short_refund_period_days'))
      else 0)
  - unposted_overdue_visits: >-
      (COUNT('care_plan_events', within_months=3, date_field='visit_date', event_type='plan_visit_billed') - COUNT('care_plan_events',
      within_months=1, date_field='visit_date', event_type='plan_visit_billed')) - (COUNT('care_plan_events', within_months=3,
      date_field='visit_date', event_type='plan_visit_billed', visit_kind='evaluation') - COUNT('care_plan_events', within_months=1,
      date_field='visit_date', event_type='plan_visit_billed', visit_kind='evaluation')) - (COUNT('care_plan_events', within_months=3,
      date_field='visit_date', event_type='plan_patient_charge_posted', charge_kind='coinsurance') - COUNT('care_plan_events',
      within_months=1, date_field='visit_date', event_type='plan_patient_charge_posted', charge_kind='coinsurance')) - (COUNT('care_plan_events',
      within_months=3, date_field='visit_date', event_type='plan_patient_charge_posted', charge_kind='non_covered_service')
      - COUNT('care_plan_events', within_months=1, date_field='visit_date', event_type='plan_patient_charge_posted', charge_kind='non_covered_service'))
  - overdue_eob_hold: >-
      RND(unposted_overdue_visits * K('overdue_eob_hold_per_visit'), 2) if (unposted_overdue_visits >= 1 and unposted_overdue_visits
      <= 2) else (credit_on_plan if unposted_overdue_visits >= 3 else 0)
  - last_check_date: LATEST('care_plan_events', 'event_date', event_type='plan_patient_payment', payment_method='check')
  - last_check_amount: LATEST('care_plan_events', 'amount', event_type='plan_patient_payment', payment_method='check')
  - last_ach_date: LATEST('care_plan_events', 'event_date', event_type='plan_patient_payment', payment_method='ach')
  - last_ach_amount: LATEST('care_plan_events', 'amount', event_type='plan_patient_payment', payment_method='ach')
  - uncleared_funds: >-
      last_check_amount if (last_check_date and DAYS(last_check_date, NOW) < K('check_clearing_days')) else (last_ach_amount
      if (last_ach_date and DAYS(last_ach_date, NOW) < K('ach_clearing_days')) else 0)
  - credit_before_holds: MX(0, credit_on_plan - pending_eob_hold - overdue_eob_hold - uncleared_funds)
  - series_fees_owed: CFIELD('series', 'missed_fee_balance', care_plan_id=HID)
  - last_fee_date: >-
      XLATEST('series', 'series_events', 'event_date', event_type='series_fee_assessed', series_id=CFIELD('series', 'series_id',
      care_plan_id=HID))
  - fee_due_days: CPARAM('series', 'fee_due_days', care_plan_id=HID)
  - other_hold: >-
      series_fees_owed if (series_fees_owed and series_fees_owed > 0 and last_fee_date and DAYS(last_fee_date, NOW) > fee_due_days)
      else (credit_before_holds if credit_before_holds <= K('small_credit_max') else 0)
  - last_card_date: LATEST('care_plan_events', 'event_date', event_type='plan_patient_payment', payment_method='card')
  - last_card_amount: LATEST('care_plan_events', 'amount', event_type='plan_patient_payment', payment_method='card')
  - last_payment_amount: LATEST('care_plan_events', 'amount', event_type='plan_patient_payment')
  - returned_payment_cap: >-
      last_card_amount if (last_card_date and DAYS(last_card_date, NOW) <= P('card_refund_window_days')) else (last_check_amount
      if last_check_amount else last_payment_amount)
  - result: RND(MN(MX(0, credit_before_holds - other_hold), returned_payment_cap), 2)
  compute_basis:
    charges_total: >-
      The credit standing on the plan of care is worked out from its ledger: every patient payment and every balance adjustment
      on the plan, less every patient charge and every refund already issued on the plan, never below zero.
    payments_total: >-
      The credit standing on the plan of care is worked out from its ledger: every patient payment and every balance adjustment
