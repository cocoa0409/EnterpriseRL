# Insured Plan of Care — the insurance-funded episode of outpatient physical therapy.
# One holding = one plan of care opened by an initial evaluation for one diagnosis, billed to one
# payer program. The tier is the payer program the plan is billed under, because the payer program
# is what decides authorization, certification, cost-sharing collection and billing rules at a
# real outpatient physical therapy practice.

category: plan
display_name: Insured Plan of Care

binding:
  holding_table: care_plans
  event_tables: [care_plan_events]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    authorized_visits_remaining: authorized_visits
    patient_due_balance: patient_due

lifecycle:
  states: [intake, active, on_hold, discharged, closed]
  transitions:
    - {from: intake, to: active, by: agent, means: "The plan of care is activated once the referral, physician certification and authorization requirements of its payer program are on file."}
    - {from: active, to: on_hold, by: agent, means: "Treatment is paused because authorization is pending, exhausted or expired, certification has lapsed, surgery is pending, or the patient asked to pause."}
    - {from: on_hold, to: active, by: agent, means: "Treatment resumes after the reason for the hold has been resolved."}
    - {from: active, to: discharged, by: system, means: "The treating therapist discharges the patient from the plan of care."}
    - {from: on_hold, to: discharged, by: system, means: "A plan left on hold past the hold limit is discharged for non-attendance."}
    - {from: discharged, to: closed, by: system, means: "A discharged plan is closed once its patient balance is settled to zero."}
    - {from: intake, to: closed, by: agent, means: "A plan that never started treatment is closed (authorization denied before treatment, or the patient declined to proceed)."}

accounts:
  - key: authorized_visits
    unit: visits
    meaning: Visits approved by the payer under the plan's authorizations that have not yet been used by billed visits.
  - key: patient_due
    unit: USD
    meaning: The patient's open financial responsibility on this plan of care (copays, coinsurance, deductible and waived non-covered charges less payments and adjustments); a negative value is a credit owed back to the patient.

parameter_schema:
  prior_auth_required: "Whether the payer program requires an approved prior authorization before treatment visits beyond auth_exempt_visits (boolean)."
  auth_exempt_visits: "Number of visits, counting the initial evaluation, that may be rendered before an approved authorization is required; 0 where prior_auth_required is false (integer, visits)."
  auth_counts_evaluation: "Whether the initial evaluation visit draws one visit from the authorized-visit count once an authorization is approved (boolean)."
  auth_request_lead_days: "Latest point, in calendar days before the current authorization end date, by which an extension request must be submitted; 0 where prior_auth_required is false (integer, calendar days)."
  auth_renewal_trigger_visits: "Remaining authorized visits at or below which an extension request must be submitted; 0 where prior_auth_required is false (integer, visits)."
  retro_auth_window_days: "Calendar days after the visit date within which the payer accepts a retroactive authorization request; 0 means retroactive requests are not accepted (integer, calendar days)."
  auth_pending_followup_business_days: "Business days after submission after which a still-pending authorization request is followed up with the payer; 0 where prior_auth_required is false (integer, business days)."
  peer_to_peer_window_days: "Calendar days after an authorization denial within which the treating therapist may request a peer-to-peer review; 0 where no authorization is required (integer, calendar days)."
  appeal_window_days: "Calendar days after a denial within which a written appeal (redetermination or reconsideration for Medicare programs) may be filed (integer, calendar days)."
  referral_required: "Whether the payer program requires a referral from the primary care provider on file before the initial evaluation (boolean)."
  referral_valid_days: "Calendar days after the referral date during which the initial evaluation may take place; 0 where referral_required is false (integer, calendar days)."
  physician_certification_required: "Whether the plan of care must be certified by a physician or non-physician practitioner signature before the plan is activated (boolean)."
  cert_signature_days: "Calendar days after the initial evaluation within which the certifying signature must be dated for a timely certification; 0 where certification is not required (integer, calendar days)."
  recert_interval_days: "Maximum length of one certification period, counted from the opened date or the previous certification end date; 0 where certification is not required (integer, calendar days)."
  progress_report_every_visits: "Maximum number of treatment visits between progress reports; the visit that reaches this count is billed as a progress report visit (integer, visits)."
  kx_threshold_applies: "Whether the Medicare therapy KX-modifier threshold applies to visits on this plan (boolean)."
  kx_threshold_amount: "Calendar-year allowed amount for physical therapy and speech-language pathology combined above which visits carry the KX modifier; 0.00 where kx_threshold_applies is false (USD, 2 decimals)."
  targeted_review_threshold_amount: "Calendar-year allowed amount above which visits are subject to Medicare targeted medical review; 0.00 where kx_threshold_applies is false (USD, 2 decimals)."
  collect_copay_at_tos: "Whether the plan's per-visit copay is collected at the time of service (boolean)."
  collect_deductible_estimate_at_tos: "Whether an estimate of the remaining deductible is collected at the time of service (boolean)."
  tos_deductible_estimate_cap: "Maximum deductible estimate collected at the time of service for one visit; 0.00 where collect_deductible_estimate_at_tos is false (USD, 2 decimals)."
  coinsurance_billed_after_eob: "Whether coinsurance and deductible responsibility is posted to the patient after the payer's explanation of benefits rather than at the time of service (boolean)."
  eob_patient_charge_days: "Calendar days after the explanation of benefits is received within which the patient responsibility it shows is posted (integer, calendar days)."
  cost_share_billable: "Whether any cost-sharing amount may be billed to the patient at all under the payer program (boolean)."
  unpaid_balance_booking_hold_threshold: "Open patient balance on this plan, more than 60 days past its posting date, at or above which new appointment series may not be booked until the balance is paid or placed on a payment plan; 0.00 means the hold never applies (USD, 2 decimals)."
  non_covered_waiver_form: "The advance financial-responsibility form used before a non-covered visit: abn (Medicare Advance Beneficiary Notice of Noncoverage), commercial_waiver (commercial non-covered services waiver) or none (enum)."
  non_covered_billing_allowed: "Whether a visit the payer will not cover may be billed to the patient when the waiver form was signed before the visit (boolean)."
  self_pay_visit_rate: "Amount billed to the patient for one non-covered visit under a signed waiver (USD, 2 decimals)."
  benefit_limit_shared_with_ot_st: "Whether the payer's calendar-year visit limit is shared with occupational and speech therapy visits reported elsewhere (boolean)."
  small_balance_writeoff_allowed: "Whether an open balance at or below small_balance_writeoff_max may be written off after the final statement (boolean)."
  small_balance_writeoff_max: "Largest open balance that may be written off as a small balance; 0.00 where small_balance_writeoff_allowed is false (USD, 2 decimals)."
  statement_cycle_days: "Calendar days between consecutive patient statements on an open balance (integer, calendar days)."
  statements_before_collections: "Number of statements issued on an unpaid balance before the last one is the final notice (integer, statements)."
  credit_refund_days: "Calendar days after a credit balance arises within which it must be refunded or applied (integer, calendar days)."
  card_refund_window_days: "Calendar days after the original card payment within which a refund is returned to that card; later refunds are issued by check (integer, calendar days)."
  credit_offset_other_balances: "Whether a credit balance is first applied to the patient's other open charges on the same plan before any refund (boolean)."
  hold_max_days: "Calendar days a plan may remain on hold before it is discharged for non-attendance (integer, calendar days)."
  inactivity_discharge_days: "Calendar days without any billed visit after which an active plan is placed on hold for inactivity (integer, calendar days)."
  max_visits_per_week: "Maximum billed visits per Monday-to-Sunday week under the payer program's frequency guideline (integer, visits)."
  timely_filing_days: "Calendar days after the visit date within which the claim must reach the payer; a late claim is written off and never billed to the patient (integer, calendar days)."
  telehealth_covered: "Whether the payer program covers physical therapy delivered by telehealth (boolean)."
  reverify_benefits_each_calendar_year: "Whether benefits are re-verified at the first visit of each new calendar year (boolean)."
  benefit_reverify_interval_days: "Maximum calendar days between benefit verifications on an active plan (integer, calendar days)."
  missed_visit_fee_billable: "Whether a late-cancellation or no-show fee may be billed to a patient whose visit is funded by this plan (boolean)."
  copay_per_date_of_service_max: "Maximum copays collected for one date of service across all of the patient's plans with the same payer (integer)."
  benefit_verification_lead_business_days: "Business days before the initial evaluation by which benefits must be verified (integer, business days)."
  discharge_summary_days: "Calendar days after discharge within which the discharge summary is sent to the referring provider (integer, calendar days)."
  max_timed_units_per_visit: "Maximum timed procedure units billed for one visit (integer, units)."
  unit_counting_method: "How timed minutes convert to billed units: cms_8_minute_rule (total timed minutes across codes) or ama_substantial_portion (each code on its own minutes) (enum)."
  hardship_discount_eligible: "Whether patient balances on this plan may receive a Patient Hardship Discount Program adjustment (boolean)."
  payment_plan_eligible: "Whether patient balances on this plan may be moved into a Patient Payment Plan (boolean)."

