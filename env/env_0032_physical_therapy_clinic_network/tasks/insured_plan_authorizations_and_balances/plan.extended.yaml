- id: plan_ext_previsit_payment
  base_policy_refs:
  - plan_evt_payment_application
  - plan_evt_time_of_service_collection
  overwrite:
  - base_policy: plan_evt_time_of_service_collection
    superseded_clause: >-
      a deductible_estimate charge of the lower of the visit's allowed amount, the deductible remaining and tos_deductible_estimate_cap
