      The allowed amount per unit is read from the latest billed visit carrying the timed units the coming visit is expected
      to carry, as its allowed amount divided by its units; where no billed visit carries those units, from the latest billed
      treatment visit; where no treatment visit has been billed either, from the latest billed visit; the amount per unit
      is rounded half up to four decimal places.
    expected_allowed: >-
      The coming visit is expected to be billed with the same timed units as the latest billed visit on the plan, at that
      visit's allowed amount per unit, and its expected allowed amount is those units times that amount per unit, rounded
      half up to the cent.
    estimates_posted: >-
      The deductible still to be met is reconciled from the plan's ledger: where explanation-of-benefits deductible charges
      stand on the plan, it is the deductible remaining on file less every deductible estimate and every explanation-of-benefits
      deductible charge posted on the plan, plus every billing error correction on the plan, never below zero; where deductible
      estimates stand on the plan but no explanation-of-benefits deductible charge does, it is the deductible remaining
      on file less those estimates, plus every billing error correction on the plan, never below zero; where no deductible
      charge of either kind stands on the plan, it is the deductible remaining on file.
    eob_deductibles: >-
      The deductible still to be met is reconciled from the plan's ledger: where explanation-of-benefits deductible charges
      stand on the plan, it is the deductible remaining on file less every deductible estimate and every explanation-of-benefits
      deductible charge posted on the plan, plus every billing error correction on the plan, never below zero; where deductible
      estimates stand on the plan but no explanation-of-benefits deductible charge does, it is the deductible remaining
      on file less those estimates, plus every billing error correction on the plan, never below zero; where no deductible
      charge of either kind stands on the plan, it is the deductible remaining on file.
    corrections: >-
      The deductible still to be met is reconciled from the plan's ledger: where explanation-of-benefits deductible charges
      stand on the plan, it is the deductible remaining on file less every deductible estimate and every explanation-of-benefits
      deductible charge posted on the plan, plus every billing error correction on the plan, never below zero; where deductible
      estimates stand on the plan but no explanation-of-benefits deductible charge does, it is the deductible remaining
      on file less those estimates, plus every billing error correction on the plan, never below zero; where no deductible
      charge of either kind stands on the plan, it is the deductible remaining on file.
    deductible_left: >-
      The deductible still to be met is reconciled from the plan's ledger: where explanation-of-benefits deductible charges
      stand on the plan, it is the deductible remaining on file less every deductible estimate and every explanation-of-benefits
      deductible charge posted on the plan, plus every billing error correction on the plan, never below zero; where deductible
      estimates stand on the plan but no explanation-of-benefits deductible charge does, it is the deductible remaining
      on file less those estimates, plus every billing error correction on the plan, never below zero; where no deductible
      charge of either kind stands on the plan, it is the deductible remaining on file.
    plan_status: >-
      The cap on the deductible part follows the patient's Patient Payment Plan standing: a patient holding an active Patient
      Payment Plan whose most recent installment payment was received on or before that installment's due date is capped
      at the current-payment-plan cap; a patient whose Patient Payment Plan is past due or defaulted, or whose most recent
      installment payment was received after that installment's due date, is capped at the full expected allowed amount;
      any other patient is capped at the payer program's time-of-service deductible estimate cap.
    last_installment_paid: >-
      The cap on the deductible part follows the patient's Patient Payment Plan standing: a patient holding an active Patient
      Payment Plan whose most recent installment payment was received on or before that installment's due date is capped
      at the current-payment-plan cap; a patient whose Patient Payment Plan is past due or defaulted, or whose most recent
      installment payment was received after that installment's due date, is capped at the full expected allowed amount;
      any other patient is capped at the payer program's time-of-service deductible estimate cap.
    last_installment_due: >-
      The cap on the deductible part follows the patient's Patient Payment Plan standing: a patient holding an active Patient
      Payment Plan whose most recent installment payment was received on or before that installment's due date is capped
      at the current-payment-plan cap; a patient whose Patient Payment Plan is past due or defaulted, or whose most recent
      installment payment was received after that installment's due date, is capped at the full expected allowed amount;
      any other patient is capped at the payer program's time-of-service deductible estimate cap.
    paid_late: >-
      The cap on the deductible part follows the patient's Patient Payment Plan standing: a patient holding an active Patient
      Payment Plan whose most recent installment payment was received on or before that installment's due date is capped
      at the current-payment-plan cap; a patient whose Patient Payment Plan is past due or defaulted, or whose most recent
      installment payment was received after that installment's due date, is capped at the full expected allowed amount;
      any other patient is capped at the payer program's time-of-service deductible estimate cap.
    estimate_cap: >-
      The cap on the deductible part follows the patient's Patient Payment Plan standing: a patient holding an active Patient
      Payment Plan whose most recent installment payment was received on or before that installment's due date is capped
      at the current-payment-plan cap; a patient whose Patient Payment Plan is past due or defaulted, or whose most recent
      installment payment was received after that installment's due date, is capped at the full expected allowed amount;
      any other patient is capped at the payer program's time-of-service deductible estimate cap.
    deductible_part: >-
      The deductible part is the lowest of the deductible still to be met, the expected allowed amount and the payer program's
      time-of-service deductible estimate cap, the deductible still to be met being the deductible remaining on file.
    copays_posted: >-
      Beyond the deductible part, where the expected allowed amount is more than the deductible still to be met and the
      plan carries a coinsurance percentage, the pre-visit amount also includes that coinsurance percentage of the part
      of the expected allowed amount above the deductible still to be met, rounded half up to the cent; where the expected
      allowed amount is more than the deductible still to be met, the plan carries no coinsurance percentage and copay charges
      have been posted on the plan, it includes the copay on file instead; otherwise nothing is included beyond the deductible
      part.
    beyond_deductible: >-
      Beyond the deductible part, where the expected allowed amount is more than the deductible still to be met and the
      plan carries a coinsurance percentage, the pre-visit amount also includes that coinsurance percentage of the part
      of the expected allowed amount above the deductible still to be met, rounded half up to the cent; where the expected
      allowed amount is more than the deductible still to be met, the plan carries no coinsurance percentage and copay charges
      have been posted on the plan, it includes the copay on file instead; otherwise nothing is included beyond the deductible
      part.
    carried_balance: >-
      The balance the plan carries leaves out charges still waiting for their statement: where charges posted from an explanation
      of benefits stand on the plan and no statement has yet been issued on it, only the time-of-service charges are carried,
      that is the deductible estimates and copays posted on the plan less the payments made on it, never below zero; where
      the plan record shows a credit, nothing is carried, the credit being handled as a refund; otherwise the patient balance
      shown on the plan record is carried.
    result: >-
      The deductible part, the amount included beyond it and the balance the plan carries are added together, and the total
      is rounded half up to the cent.
    eob_charges: >-
      The balance the plan carries leaves out charges still waiting for their statement: where charges posted from an explanation
      of benefits stand on the plan and no statement has yet been issued on it, only the time-of-service charges are carried,
      that is the deductible estimates and copays posted on the plan less the payments made on it, never below zero; where
      the plan record shows a credit, nothing is carried, the credit being handled as a refund; otherwise the patient balance
      shown on the plan record is carried.
    statements_issued: >-
      The balance the plan carries leaves out charges still waiting for their statement: where charges posted from an explanation
      of benefits stand on the plan and no statement has yet been issued on it, only the time-of-service charges are carried,
      that is the deductible estimates and copays posted on the plan less the payments made on it, never below zero; where
      the plan record shows a credit, nothing is carried, the credit being handled as a refund; otherwise the patient balance
      shown on the plan record is carried.
    tos_open: >-
      The balance the plan carries leaves out charges still waiting for their statement: where charges posted from an explanation
      of benefits stand on the plan and no statement has yet been issued on it, only the time-of-service charges are carried,
      that is the deductible estimates and copays posted on the plan less the payments made on it, never below zero; where
      the plan record shows a credit, nothing is carried, the credit being handled as a refund; otherwise the patient balance
      shown on the plan record is carried.
  factors:
  - id: expected_units
    effect: method
    decides: expected_units
    bindings:
    - slot_minutes
    - last_visit_units
    - last_treatment_units
    - expected_units
    ladder:
    - when: the plan funds an active appointment series
      method: whole timed units of the series' slot length, never more than the per-visit maximum
    - when: no active series is funded by the plan and a treatment visit has been billed on it
      method: units of the latest billed treatment visit
    - when: otherwise
      method: units of the latest billed visit
    baseline:
      expected_units: last_visit_units
    evidence:
    - cross_category
    - history
    cross_difficulty: series
  - id: allowed_per_unit
    effect: method
    decides: allowed_per_unit
    bindings:
    - same_units_allowed
    - last_treatment_allowed
    - last_visit_allowed
    - allowed_per_unit
    ladder:
    - when: a billed visit carries the timed units the coming visit is expected to carry
      method: the latest such visit's allowed amount divided by its units
    - when: no billed visit carries those units and a treatment visit has been billed
      method: the latest treatment visit's allowed amount divided by its units
    - when: otherwise
      method: the latest billed visit's allowed amount divided by its units
    baseline:
      allowed_per_unit: RND(last_visit_allowed / last_visit_units, 4)
    evidence:
    - history
    cross_difficulty: null
  - id: deductible_still_to_meet
    effect: method
    decides: deductible_left
    bindings:
    - estimates_posted
    - eob_deductibles
    - corrections
    - deductible_left
    ladder:
    - when: explanation-of-benefits deductible charges stand on the plan
      method: >-
        deductible on file less every deductible estimate and every explanation-of-benefits deductible charge, plus billing
        error corrections, never below zero
    - when: deductible estimates stand on the plan and no explanation-of-benefits deductible charge does
      method: deductible on file less the estimates, plus billing error corrections, never below zero
    - when: otherwise
      method: the deductible remaining on file as recorded
    baseline:
      deductible_left: F('deductible_remaining')
    evidence:
    - history
    cross_difficulty: null
  - id: payment_plan_cap
    effect: parameter
    decides: estimate_cap
    bindings:
    - plan_status
    - last_installment_paid
    - last_installment_due
    - paid_late
    - estimate_cap
    ladder:
    - when: >-
        the patient holds an active Patient Payment Plan, an installment payment has been received on it, and its most recent
        installment payment was received on or before that installment's due date
      value: K('current_payment_plan_cap')
    - when: >-
        the patient's Patient Payment Plan is past due or defaulted, or its most recent installment payment was received
        after that installment's due date
      value: the full expected allowed amount
    - when: otherwise
      value: P('tos_deductible_estimate_cap')
    baseline:
      estimate_cap: P('tos_deductible_estimate_cap')
    evidence:
    - cross_category
    - history
    cross_difficulty: payplan
  - id: share_beyond_deductible
    effect: method
    decides: beyond_deductible
    bindings:
    - copays_posted
    - beyond_deductible
    ladder:
    - when: >-
        the expected allowed amount exceeds the deductible still to be met and the plan carries a coinsurance percentage
      method: coinsurance percentage of the expected allowed amount above the deductible still to be met
    - when: >-
        the expected allowed amount exceeds the deductible still to be met, the plan carries no coinsurance percentage and
        copay charges have been posted
      method: the copay on file
    - when: otherwise
      method: nothing beyond the deductible part
    baseline:
      beyond_deductible: '0'
    evidence:
    - history
    cross_difficulty: null
  - id: carried_balance
    effect: parameter
    decides: carried_balance
    bindings:
    - eob_charges
    - statements_issued
    - tos_open
    - carried_balance
    ladder:
    - when: >-
        charges posted from an explanation of benefits stand on the plan and no statement has yet been issued on it
      value: >-
        the time-of-service charges (deductible estimates and copays) less the payments made on the plan, never below zero
    - when: the plan record shows a credit
      value: '0.00'
    - when: otherwise
      value: the patient balance shown on the plan record
    baseline:
      carried_balance: F('patient_due_balance')
    evidence:
    - history
    cross_difficulty: null
  baseline:
    rule: >-
      The pre-visit amount is the deductible part of the coming visit plus the balance the plan carries, rounded half up
      to the cent. The coming visit is expected to be billed with the same timed units as the latest billed visit on the
      plan, at that visit's allowed amount per unit, and its expected allowed amount is those units times that amount per
      unit, rounded half up to the cent. The deductible part is the lowest of the deductible still to be met, the expected
      allowed amount and the payer program's time-of-service deductible estimate cap, the deductible still to be met being
      the deductible remaining on file. The balance the plan carries is the patient balance shown on the plan record.
    params:
    - tos_deductible_estimate_cap
  inputs:
    history:
    - table: care_plan_events
      aggregate: latest
      field: allowed_amount
      filters:
        event_type: plan_visit_billed
    - table: care_plan_events
      aggregate: sum
      field: amount
      filters:
        event_type: plan_patient_charge_posted
        charge_kind: deductible_estimate
    - category: payplan
      table: payment_plan_events
      aggregate: latest
      field: event_date
      filters:
        event_type: payplan_payment_received
        payment_kind: installment
    cross_category:
    - series
    - payplan
- id: plan_ext_retro_authorization
  base_policy_refs:
  - plan_evt_authorization_requests
  - plan_visit_authorization
  overwrite: []
  trigger: state_due
  subject:
  - plan_auth_requested
  computes: requested_visits
  target_tool: submit_retro_authorization_d347b3c8
  params: {}
  rule: >-
    The retroactive request asks the payer to cover the visits attended after the plan's authorization stopped covering
    them, counted at the plan's weekly visit frequency over the days of the gap, and names the earliest of those visits
    it asks to cover. The gap begins the day after the end date of the last approval drawn on and runs through today, and
    its days are counted from that first day through the last, both included. The visits the retroactive request asks for
    are the payer program's weekly visit maximum times the days counted, divided by seven and rounded up to a whole visit.
    When the gap begins depends on how the authorization ran out: where the last approval drawn on had all of its visits
    drawn, the gap begins the day after the visit that drew its last visit; where no approval has ever been drawn on, the
    gap begins the day after the evaluation; otherwise the gap begins the day after the end date of the last approval drawn
    on. When the gap ends depends on the next approval: where a newer approval than the one drawn on starts on or before
    today, the gap ends the day before that approval starts; where a newer approval starts after today, the gap ends yesterday,
    today's visit not yet being rendered; otherwise the gap runs through today. Only the days the payer's retroactive window
    still reaches are counted: where the payer program accepts retroactive requests and the gap reaches back further than
    its retroactive window from today, only the days from the first day the window reaches, that is today less the retroactive
    window days, through the end of the gap are counted; where the payer program accepts no retroactive request, or no appointment
    funded by the plan has been attended since the gap began, no day is counted; otherwise every day of the gap is counted.
    The weekly visit frequency counted across the gap is the plan's own: where the plan funds an active appointment series,
    it is that series' visits per week; where it funds no active series but a booked one, it is the booked series' visits
    per week; otherwise it is the payer program's weekly visit maximum. Visits already asked for retroactively are not asked
    for again: where earlier retroactive requests stand on the plan, the visits they asked for are taken off; where none
    stands but retroactive approvals do, the visits they granted are taken off; otherwise nothing is taken off. The visits
    asked for are the weekly frequency times the days counted, divided by seven and rounded up to a whole visit, less the
    visits already asked for retroactively, never below zero.
  prerequisite: []
  cross_category:
  - category: series
    as: history
    reads:
    - visits_per_week
    - series_events.appointment_date
    note: >-
      The visits per week of the series the plan funds set the frequency counted across the gap, and its latest attended
      appointment shows whether any visit fell in the gap.
  compute:
  - last_draw_date: >-
      LATEST('care_plan_events', 'visit_date', event_type='plan_visit_billed', visits=1, date_field='visit_date')
  - last_draw_auth: >-
      LATEST('care_plan_events', 'auth_number', event_type='plan_visit_billed', visits=1, date_field='visit_date')
  - drawn_on_last: SUM('care_plan_events', 'visits', event_type='plan_visit_billed', auth_number=last_draw_auth)
  - approved_on_last: SUM('care_plan_events', 'visits', event_type='plan_auth_approved', auth_number=last_draw_auth)
  - last_auth_end: >-
      LATEST('care_plan_events', 'auth_end_date', event_type='plan_auth_approved', auth_number=last_draw_auth)
  - eval_date: >-
      LATEST('care_plan_events', 'visit_date', event_type='plan_visit_billed', visit_kind='evaluation', date_field='visit_date')
  - days_since_cover: >-
      DAYS(last_draw_date, NOW) if (last_draw_auth and drawn_on_last >= approved_on_last) else (DAYS(eval_date, NOW) if
      not last_draw_auth else DAYS(last_auth_end, NOW))
  - newest_auth: LATEST('care_plan_events', 'auth_number', event_type='plan_auth_approved')
  - newest_start: LATEST('care_plan_events', 'auth_start_date', event_type='plan_auth_approved')
  - end_offset: >-
      DAYS(newest_start, NOW) + 1 if (newest_auth != last_draw_auth and newest_start <= NOW) else (1 if (newest_auth !=
      last_draw_auth and newest_start > NOW) else 0)
  - gap_days: MX(0, days_since_cover - end_offset)
  - latest_attended: >-
      XLATEST('series', 'series_events', 'appointment_date', event_type='series_visit_attended', funding_source='insurance_plan')
  - counted_days: >-
      P('retro_auth_window_days') + 1 - end_offset if (P('retro_auth_window_days') > 0 and gap_days > P('retro_auth_window_days')
      + 1 - end_offset) else (0 if (P('retro_auth_window_days') == 0 or not latest_attended or DAYS(latest_attended, NOW)
      >= days_since_cover) else gap_days)
  - active_per_week: CFIELD('series', 'visits_per_week', care_plan_id=HID, status='active')
  - booked_per_week: CFIELD('series', 'visits_per_week', care_plan_id=HID, status='booked')
  - per_week: >-
      active_per_week if active_per_week else (booked_per_week if booked_per_week else P('max_visits_per_week'))
  - planned: per_week * counted_days / 7
  - planned_visits: int(planned) + (1 if planned > int(planned) else 0)
  - retro_before: SUM('care_plan_events', 'requested_visits', event_type='plan_auth_requested', auth_kind='retro')
  - retro_granted_before: SUM('care_plan_events', 'visits', event_type='plan_auth_approved', auth_kind='retro')
  - already: retro_before if retro_before > 0 else (retro_granted_before if retro_granted_before > 0 else 0)
  - result: MX(0, planned_visits - already)
