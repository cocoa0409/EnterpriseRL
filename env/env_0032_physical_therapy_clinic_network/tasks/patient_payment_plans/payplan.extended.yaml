# Patient Payment Plan — interest-free installment agreements for patient balances left after insurance.
# One holding = one signed agreement that takes in one or more patient charges from the patient's
# Insured Plans of Care and is paid down in monthly installments. The tier is the plan term, which is
# selected by the enrolled balance band, as in-house medical payment plans are sold.

category: payplan
display_name: Patient Payment Plan

binding:
  holding_table: payment_plans
  event_tables: [payment_plan_events]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    plan_balance: plan_balance

lifecycle:
  states: [pending_signature, active, past_due, defaulted, paid_off, cancelled]
  transitions:
    - {from: pending_signature, to: active, by: user, means: "The patient signs the payment plan agreement and pays any down payment; the enrolled charges move into the plan."}
    - {from: pending_signature, to: cancelled, by: agent, means: "An agreement not signed within the signature window lapses."}
    - {from: active, to: past_due, by: system, means: "An installment remains unpaid after the grace period."}
    - {from: past_due, to: active, by: agent, means: "The past-due amount is paid and the plan is current again."}
    - {from: past_due, to: defaulted, by: system, means: "The plan defaults after the allowed consecutive missed installments and the default notice period."}
    - {from: defaulted, to: active, by: agent, means: "A defaulted plan is reinstated within the reinstatement window after the missed installments are paid."}
    - {from: active, to: paid_off, by: system, means: "The plan balance reaches zero."}
    - {from: past_due, to: paid_off, by: system, means: "A past-due plan is paid in full."}
    - {from: active, to: cancelled, by: user, means: "The patient ends the agreement; the remaining balance returns to regular statements."}

accounts:
  - key: plan_balance
    unit: USD
    meaning: Amount the patient still owes under the payment plan agreement (enrolled charges and plan fees less payments and adjustments).

parameter_schema:
  min_enrolled_balance: "Smallest total balance that may be enrolled in this tier (USD, 2 decimals)."
  max_enrolled_balance: "Largest total balance, including add-ons, the tier may hold (USD, 2 decimals)."
  term_months: "Number of monthly installments after the down payment (integer, months)."
  min_monthly_payment: "Smallest monthly installment allowed (USD, 2 decimals)."
  down_payment_percent: "Down payment as a percentage of the enrolled balance; 0 where none is required (integer, percent)."
  down_payment_min: "Smallest down payment where one is required; 0.00 where none is required (USD, 2 decimals)."
  down_payment_due_at_signing: "Whether the down payment is taken at signing (boolean)."
  interest_rate_percent: "Annual interest charged on the plan balance (integer, percent)."
  autopay_required: "Whether installments must be paid by automatic payment (boolean)."
  grace_days: "Calendar days after an installment due date before the unpaid installment counts as missed (integer, calendar days)."
  late_fee: "Fee added to the plan balance for a missed installment; 0.00 where none (USD, 2 decimals)."
  late_fees_max_per_plan: "Maximum late fees assessed over the life of one plan (integer)."
  late_fee_first_waiver: "Whether the first late fee on a plan is waived on the patient's request (boolean)."
  nsf_fee: "Fee added when an ACH or check payment is returned unpaid; 0.00 where none (USD, 2 decimals)."
  nsf_fee_applies_to_card: "Whether a declined card payment also incurs the returned-payment fee (boolean)."
  missed_installments_to_default: "Consecutive missed installments after which a default notice is sent (integer)."
  default_notice_days: "Calendar days after the default notice before the plan defaults (integer, calendar days)."
  default_returns_to_statements: "Whether a defaulted plan's remaining balance returns to the regular statement and collections cycle of the plan of care it came from (boolean)."
  reinstatement_allowed: "Whether a defaulted plan may be reinstated (boolean)."
  reinstatement_window_days: "Calendar days after the default date within which reinstatement is possible; 0 where not allowed (integer, calendar days)."
  reinstatements_per_plan: "Maximum reinstatements of one plan (integer)."
  add_on_allowed: "Whether new eligible charges may be added to an active plan (boolean)."
  add_on_method: "How an add-on is absorbed: recalculate_payment (same end date, new installment), extend_term (same installment, more months up to the extension cap) or none (enum)."
  max_add_ons_per_plan: "Maximum add-ons to one plan (integer)."
  modification_allowed: "Whether the installment amount and term may be modified at the patient's request (boolean)."
  modifications_per_plan: "Maximum modifications of one plan (integer)."
  max_term_extension_months: "Maximum months a modification or extend_term add-on may add beyond term_months (integer, months)."
  signature_window_days: "Calendar days after enrollment within which the agreement must be signed (integer, calendar days)."
  first_due_days_after_signing: "Calendar days after signing within which the first installment falls, on the chosen due day (integer, calendar days)."
  due_day_choices: "Days of the month the patient may choose as the installment due day (list of integers)."
  collections_protection: "Whether charges in a plan that is active or past due are never transferred to collections (boolean)."
  missed_fees_enrollable: "Whether missed-visit fees may be enrolled (boolean)."
  estimate_charges_enrollable: "Whether time-of-service deductible estimates may be enrolled before the payer has adjudicated the visit (boolean)."
  collections_balances_enrollable: "Whether charges already transferred to collections may be enrolled (boolean)."
  max_charge_age_days: "Maximum calendar days between a charge's posting date and the enrollment or add-on date (integer, calendar days)."
  autopay_retry_days: "Calendar days after a failed automatic payment before it is retried (integer, calendar days)."
  autopay_retries: "Retries of a failed automatic payment before the installment is treated as unpaid (integer)."
  hardship_determination_required: "Whether an approved, unexpired Patient Hardship Discount Program determination is needed to enroll (boolean)."
  credit_check_required: "Whether a credit check is run at enrollment (boolean)."
  hsa_fsa_accepted: "Whether HSA or FSA cards may pay installments (boolean)."
  overpayment_handling: "How a payment above the installment due is applied: apply_to_principal (reduces the balance) (enum)."
  insurance_payment_reduces_plan: "Whether a later payer payment on an enrolled charge reduces the plan balance (boolean)."
  extra_payment_shortens_term: "Whether extra principal payments shorten the remaining term rather than lower the installment (boolean)."
  cure_requires_full_past_due: "Whether a past-due plan becomes current only when every missed installment is paid in full (boolean)."
  partial_payment_threshold_percent: "Percentage of an installment that, when paid by the end of the grace period, keeps the installment from counting as missed (integer, percent)."
  payment_holidays_per_year: "Installments that may be deferred to the end of the plan in any rolling 12 months (integer)."
  holiday_notice_days: "Calendar days before the installment due date by which a payment holiday must be requested; 0 where holidays are not offered (integer, calendar days)."
  portal_self_enrollment: "Whether the patient may enroll through the patient portal without a financial counselor (boolean)."
  return_balance_on_cancel: "Whether the remaining balance returns to regular statements when the patient cancels the plan (boolean)."

