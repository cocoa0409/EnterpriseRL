events:
  - type: payplan_enrolled
    target: payment_plans
    mutation: create
    meaning: A payment plan agreement is set up for a selected set of patient charges and awaits the patient's signature.
    grain: one row per payment plan agreement
    fields:
      payment_plan_id: reference number of the agreement
      customer_id: the patient (guarantor)
      variant_name: plan tier
      opened_date: enrollment date
      enrolled_balance: total of the charges being enrolled
      down_payment: down payment due at signing
      monthly_payment: monthly installment
      term_months: number of monthly installments
      due_day_of_month: chosen due day
      autopay_enrolled: whether automatic payment is set up
      autopay_method: automatic payment method
      enrollment_channel: how the patient enrolled
      hardship_case_id: approved Patient Hardship Discount Program determination for a hardship plan; empty otherwise
    triggers: []
  - type: payplan_signed
    target: payment_plans
    mutation: {transition: {from: pending_signature, to: active}}
    meaning: The patient signs the agreement; the enrolled charges move into the plan.
    grain: one row per transaction
    fields:
      status: becomes active
      agreement_signed_date: date signed
      first_due_date: first installment due date
    triggers:
      - event: payplan:payplan_balance_transferred_in
        map: {transfer_kind: enrollment}
      - event: plan:plan_patient_adjustment
        map: {adjustment_kind: transfer_to_payment_plan}
  - type: payplan_lapsed_unsigned
    target: payment_plans
    mutation: {transition: {from: pending_signature, to: cancelled}}
    meaning: An agreement not signed in time lapses.
    grain: one row per transaction
    fields:
      status: becomes cancelled
      closed_date: date lapsed
      close_reason: not_signed
    triggers: []
  - type: payplan_past_due
    target: payment_plans
    mutation: {transition: {from: active, to: past_due}}
    meaning: An installment stays unpaid past the grace period.
    grain: one row per transaction
    fields:
      status: becomes past_due
    triggers: []
  - type: payplan_cured
    target: payment_plans
    mutation: {transition: {from: past_due, to: active}}
    meaning: A past-due plan is brought current.
    grain: one row per transaction
    fields:
      status: becomes active
    triggers: []
  - type: payplan_defaulted
    target: payment_plans
    mutation: {transition: {from: past_due, to: defaulted}}
    meaning: A past-due plan defaults after the default notice period.
    grain: one row per transaction
    fields:
      status: becomes defaulted
      defaulted_date: date of default
    triggers:
      - event: payplan:payplan_balance_adjusted
        map: {adjustment_kind: returned_to_account}
  - type: payplan_reinstated
    target: payment_plans
    mutation: {transition: {from: defaulted, to: active}}
    meaning: A defaulted plan is reinstated.
    grain: one row per transaction
    fields:
      status: becomes active
      reinstatements_used: reinstatements including this one
    triggers: []
  - type: payplan_paid_off
    target: payment_plans
    mutation: {transition: [{from: active, to: paid_off}, {from: past_due, to: paid_off}]}
    meaning: The plan balance reaches zero.
    grain: one row per transaction
    fields:
      status: becomes paid_off
      closed_date: date paid off
      close_reason: paid_in_full
    triggers: []
  - type: payplan_cancelled
    target: payment_plans
    mutation: {transition: {from: active, to: cancelled}}
    meaning: The patient ends an active agreement.
    grain: one row per transaction
    fields:
      status: becomes cancelled
      closed_date: date cancelled
      close_reason: patient_cancelled
    triggers:
      - event: payplan:payplan_balance_adjusted
        map: {adjustment_kind: returned_to_account}
  - type: payplan_terms_modified
    target: payment_plans
    mutation: update
    meaning: The installment amount and number of months are changed at the patient's request, or after an add-on.
    grain: one row per transaction
    fields:
      monthly_payment: new installment
      term_months: new number of installments
      modifications_used: modifications including this one
    triggers: []
  - type: payplan_autopay_updated
    target: payment_plans
    mutation: update
    meaning: Automatic payment is set up, changed or removed, or the due day is changed.
    grain: one row per transaction
    fields:
      autopay_enrolled: whether automatic payment is on
      autopay_method: method now used
      due_day_of_month: due day now in force
    triggers: []
  - type: payplan_balance_transferred_in
    target: payment_plan_events
    meaning: One patient charge from an Insured Plan of Care moves into the payment plan (at signing or as an add-on).
    grain: one row per patient charge moved into the plan
    distinguish_by: [source_event_id, transfer_kind]
    fields:
      event_date: date moved
      transfer_kind: enrollment, add_on, or reinstatement (a returned balance moved back in)
      care_plan_id: plan of care the charge comes from
      source_event_id: reference of the patient charge on that plan of care
      amount: amount moved (positive)
    account: plan_balance
    direction: in
    triggers: []
  - type: payplan_fee_assessed
    target: payment_plan_events
    meaning: A late fee or returned-payment fee is added to the plan balance.
    grain: one row per fee per installment
    distinguish_by: [fee_kind, installment_due_date]
    fields:
      event_date: date assessed
      fee_kind: late fee or returned-payment fee
      installment_due_date: installment the fee relates to
      amount: fee (positive)
    account: plan_balance
    direction: in
    triggers: []
  - type: payplan_payment_received
    target: payment_plan_events
    meaning: The patient pays the down payment, an installment, extra principal or the payoff.
    grain: one row per payment
    distinguish_by: [payment_kind, installment_due_date, event_date]
    fields:
      event_date: date received
      payment_kind: what the payment is for
      installment_due_date: due date of the installment paid; empty for a down payment
      amount: amount paid (positive)
      payment_method: how it was paid
      channel: where the payment came from
    account: plan_balance
    direction: out
    triggers: []
  - type: payplan_balance_adjusted
    target: payment_plan_events
    meaning: The plan balance is reduced without a patient payment (late payer payment, hardship discount, billing correction, fee waiver, or return of the balance to the account).
    grain: one row per adjustment
    distinguish_by: [adjustment_kind, source_event_id]
    fields:
      event_date: date adjusted
      adjustment_kind: why the balance is reduced
      amount: amount removed (positive)
      source_event_id: reference of the enrolled charge or fee adjusted; empty when the whole remaining balance is returned
    account: plan_balance
    direction: out
    triggers:
      - event: plan:plan_patient_charge_posted
        when: {adjustment_kind: returned_to_account}
        map: {charge_kind: returned_from_payment_plan}
  - type: payplan_installment_missed
    target: payment_plan_events
    meaning: An installment is recorded as missed at the end of its grace period.
    grain: one row per missed installment
    distinguish_by: [installment_due_date]
    fields:
      event_date: date recorded
      installment_due_date: due date of the missed installment
    triggers: []
  - type: payplan_autopay_failed
    target: payment_plan_events
    meaning: An automatic payment attempt fails.
    grain: one row per failed attempt
    distinguish_by: [installment_due_date, event_date]
    fields:
      event_date: date of the failed attempt
      installment_due_date: installment being collected
      failure_reason: reason returned by the bank or card network
    triggers: []
  - type: payplan_payment_deferred
    target: payment_plan_events
    meaning: One installment is deferred to the end of the plan as a payment holiday.
    grain: one row per deferred installment
    distinguish_by: [installment_due_date]
    fields:
      event_date: date the holiday was granted
      installment_due_date: due date of the deferred installment
    triggers: []
  - type: payplan_default_notice_sent
    target: payment_plan_events
    meaning: A written notice warns the patient that the plan will default unless brought current.
    grain: one row per notice
    distinguish_by: [event_date]
    fields:
      event_date: date the notice was sent
      installment_due_date: due date of the latest missed installment
    triggers: []

measures:
  - id: payplan_msr_consecutive_missed
    window: since the latest installment paid in full (or since signing)
    measure: count of payplan_installment_missed rows on this plan with installment_due_date after that point
  - id: payplan_msr_late_fees
    window: the whole life of the plan
    measure: count of payplan_fee_assessed rows on this plan with fee_kind late_fee
  - id: payplan_msr_holidays_12m
    window: rolling 12 calendar months ending on the frozen_time date, by installment_due_date
    measure: count of payplan_payment_deferred rows on this plan
  - id: payplan_msr_add_ons
    window: the whole life of the plan
    measure: count of distinct event_date values of payplan_balance_transferred_in rows on this plan with transfer_kind add_on

policies:
  - id: payplan_agg_multi_holding
    subject: [payplan_enrolled]
    rule: >-
      A patient may hold at most max_per_customer payment plan at a time. A new payment plan is not set up while the patient holds one in pending_signature, active or past_due status;
      new eligible charges are added to it instead where add_on_allowed is true. A defaulted plan blocks a new plan until
      its reinstatement window has passed.
    eligibility:
      - id: one_open_plan
        applies_to: [payplan_enrolled]
        kind: dedup
        condition: "A new payment plan is not set up while the patient holds one in pending_signature, active or past_due status;"
        evidence_fields: [payment_plans.customer_id, payment_plans.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plans.customer_id]
          action_bindings:
            payment_plans.customer_id: customer_id
        dedup_contract:
          table: payment_plans
          mode: separate_record
          object_bindings: {customer_id: customer_id}
          duplicate_filters: {status: [pending_signature, active, past_due]}
          distinct_fields: [opened_date]
    params:
      max_per_customer: 1

  - id: payplan_enrollment_eligibility
    subject: [payplan_enrolled, payplan_balance_transferred_in]
    rule: >-
      Only patient charges on Insured Plans of Care whose tier has payment_plan_eligible true may be enrolled, and only
      charges of kind copay, coinsurance, deductible, non_covered_service or returned_from_payment_plan; a deductible
      estimate is never enrolled while estimate_charges_enrollable is false, missed-visit fees are never enrolled while
      missed_fees_enrollable is false, and a charge already transferred to collections is never enrolled while
      collections_balances_enrollable is false. A charge is enrolled only when it was posted no more than max_charge_age_days calendar days before the enrollment date.
      Days are counted as calendar days from the charge's posting date, the posting date itself being day zero. The
      enrolled balance is the open amount of the selected charges and must fall between min_enrolled_balance and
      max_enrolled_balance of the tier; when it fits more than one tier the patient picks the term. A Hardship 24-Month Payment Plan needs an approved Patient Hardship Discount Program determination that has not expired on the enrollment date.
      That determination is required exactly where hardship_determination_required is true. No credit check is run
      where credit_check_required is false. Enrollment through the patient portal is accepted
      only where portal_self_enrollment is true; other tiers are enrolled by phone or at the front desk.
    eligibility:
      - id: charge_age
        applies_to: [payplan_balance_transferred_in]
        kind: time
        condition: "A charge is enrolled only when it was posted no more than max_charge_age_days calendar days before the enrollment date."
        evidence_fields: [care_plan_events.event_date, care_plan_events.care_plan_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [care_plan_events.care_plan_event_id]
          action_bindings:
            care_plan_events.care_plan_event_id: source_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: it was posted
          anchor_source: care_plan_events.event_date
          relation: not_after
          duration_source: variants.max_charge_age_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the charge's posting date, the posting date itself being day zero."
          boundary: inclusive
      - id: hardship_determination_current
        applies_to: [payplan_enrolled]
        kind: authorization
        condition: "A Hardship 24-Month Payment Plan needs an approved Patient Hardship Discount Program determination that has not expired on the enrollment date."
        evidence_fields: [hardship_cases.hardship_case_id, hardship_cases.status, hardship_cases.expiry_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [hardship_cases.hardship_case_id]
          action_bindings:
            hardship_cases.hardship_case_id: hardship_case_id

  - id: payplan_payment_schedule
    subject: [payplan_enrolled, payplan_terms_modified]
    rule: >-
      No interest is charged where interest_rate_percent is 0. The down payment is the greater of down_payment_percent
      of the enrolled balance (rounded to the cent) and down_payment_min, or 0.00 where down_payment_percent is 0, and it
      is taken at signing where down_payment_due_at_signing is true. The monthly installment is the remaining balance
      divided by term_months, rounded up to the next cent, but never below min_monthly_payment; when the minimum applies
      the number of installments is the remaining balance divided by min_monthly_payment, rounded up. The due day is one
      of due_day_choices, and the first installment falls on the first chosen due day at least first_due_days_after_signing
      calendar days after signing. Where modification_allowed is true the patient may change the installment and term
      up to modifications_per_plan times, never adding more than max_term_extension_months to term_months and never
      going below min_monthly_payment.
    eligibility: []
    params:
      per_tier:
        Short-Term 3-Month Payment Plan: {term_months: "=term_months", min_monthly_payment: "=min_monthly_payment", down_payment_percent: "=down_payment_percent", down_payment_min: "=down_payment_min"}
        Standard 6-Month Payment Plan: {term_months: "=term_months", min_monthly_payment: "=min_monthly_payment", down_payment_percent: "=down_payment_percent", down_payment_min: "=down_payment_min"}
        Extended 10-Month Payment Plan: {term_months: "=term_months", min_monthly_payment: "=min_monthly_payment", down_payment_percent: "=down_payment_percent", down_payment_min: "=down_payment_min"}
        Long-Term 12-Month Payment Plan: {term_months: "=term_months", min_monthly_payment: "=min_monthly_payment", down_payment_percent: "=down_payment_percent", down_payment_min: "=down_payment_min"}
        Large-Balance 18-Month Payment Plan: {term_months: "=term_months", min_monthly_payment: "=min_monthly_payment", down_payment_percent: "=down_payment_percent", down_payment_min: "=down_payment_min"}
        Hardship 24-Month Payment Plan: {term_months: "=term_months", min_monthly_payment: "=min_monthly_payment", down_payment_percent: "=down_payment_percent", down_payment_min: "=down_payment_min"}
    formula:
      down_payment: max(round(enrolled_balance * down_payment_percent / 100, 2), down_payment_min) if down_payment_percent > 0 else 0
      monthly_payment: max(min_monthly_payment, (enrolled_balance - down_payment) / term_months)

  - id: payplan_signature_and_activation
    subject: [payplan_signed, payplan_lapsed_unsigned]
    rule: >-
      The agreement becomes binding only when the patient signs it; the clinic never signs on the patient's behalf. On
      signing, every enrolled charge moves into the plan and is removed from the plan of care as a transfer to the payment
      plan, and any down payment is taken. An agreement still unsigned lapses no earlier than signature_window_days calendar days after the enrollment date on file.
      Days are counted as calendar days from the enrollment date, the enrollment date itself being day zero. A lapsed
      agreement leaves the charges on their plans of care.
    eligibility:
      - id: signature_window_elapsed
        applies_to: [payplan_lapsed_unsigned]
        kind: time
        condition: "An agreement still unsigned lapses no earlier than signature_window_days calendar days after the enrollment date on file."
        evidence_fields: [payment_plans.opened_date, payment_plans.payment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plans.payment_plan_id]
          action_bindings:
            payment_plans.payment_plan_id: payment_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the enrollment date on file
          anchor_source: payment_plans.opened_date
          relation: not_before
          duration_source: variants.signature_window_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the enrollment date, the enrollment date itself being day zero."
          boundary: inclusive

  - id: payplan_evt_payments
    subject: [payplan_payment_received]
    rule: >-
      Payments are accepted only on a plan in active, past_due or defaulted status. Payments are made by card, ACH,
      check, cash, or an HSA or FSA card where hsa_fsa_accepted is true; where autopay_required is true installments are
      collected automatically and manual payments are extra. A payment is applied first to the oldest unpaid installment,
      then to plan fees, then as principal; an amount above what is due is applied by overpayment_handling, and extra
      principal shortens the remaining term where extra_payment_shortens_term is true and otherwise lowers the
      installment. An installment counts as paid when at least partial_payment_threshold_percent of it is paid by the end
      of the grace period. A payment that brings the balance to zero pays the plan off.
    eligibility:
      - id: payable_status
        applies_to: [payplan_payment_received]
        kind: state
        condition: "Payments are accepted only on a plan in active, past_due or defaulted status."
        evidence_fields: [payment_plans.status, payment_plans.payment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plans.payment_plan_id]
          action_bindings:
            payment_plans.payment_plan_id: payment_plan_id
        state_contract:
          field: payment_plans.status
          allowed: [active, past_due, defaulted]

  - id: payplan_evt_delinquency
    subject: [payplan_installment_missed, payplan_autopay_failed, payplan_fee_assessed, payplan_past_due, payplan_cured]
    rule: >-
      An installment not paid (to partial_payment_threshold_percent) within grace_days calendar days after its due date
      is missed, and the plan becomes past due. A failed automatic payment is retried autopay_retry_days calendar days
      later, up to autopay_retries times, before the installment is treated as unpaid. Each missed installment adds
      late_fee, up to late_fees_max_per_plan late fees in the plan's life (payplan_msr_late_fees), and the first late fee
      is waived on request where late_fee_first_waiver is true. A returned ACH or check payment adds nsf_fee; a declined
      card adds it only where nsf_fee_applies_to_card is true. A past-due plan becomes current when every missed
      installment is paid in full where cure_requires_full_past_due is true, or when the latest missed installment is
      paid where it is false.
    eligibility: []
    measures: [payplan_msr_late_fees]

  - id: payplan_default_and_reinstatement
    subject: [payplan_default_notice_sent, payplan_defaulted, payplan_reinstated]
    rule: >-
      When payplan_msr_consecutive_missed reaches missed_installments_to_default, a default notice is sent. A plan defaults no earlier than default_notice_days calendar days after the date the default notice was sent,
      and only if it is still past due. Days are counted as calendar days from the notice date, the notice date itself
      being day zero. On default, where default_returns_to_statements is true, the remaining balance returns to the
      plans of care it came from and resumes the regular statement cycle. Where reinstatement_allowed is true, a defaulted plan is reinstated only no later than reinstatement_window_days calendar days after the default date on file,
      once every missed installment is paid, and at most reinstatements_per_plan times; the returned balance is moved
      back into the plan. Days for reinstatement are counted as calendar days from the default date, the default date
      itself being day zero.
    eligibility:
      - id: default_notice_aged
        applies_to: [payplan_defaulted]
        kind: time
        condition: "A plan defaults no earlier than default_notice_days calendar days after the date the default notice was sent,"
        evidence_fields: [payment_plan_events.event_date, payment_plan_events.payment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plan_events.payment_plan_id]
          action_bindings:
            payment_plan_events.payment_plan_id: payment_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the date the default notice was sent
          anchor_source: payment_plan_events.event_date
          relation: not_before
          duration_source: variants.default_notice_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the notice date, the notice date itself being day zero."
          boundary: inclusive
      - id: reinstatement_window
        applies_to: [payplan_reinstated]
        kind: time
        condition: "Where reinstatement_allowed is true, a defaulted plan is reinstated only no later than reinstatement_window_days calendar days after the default date on file,"
        evidence_fields: [payment_plans.defaulted_date, payment_plans.payment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plans.payment_plan_id]
          action_bindings:
            payment_plans.payment_plan_id: payment_plan_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the default date on file
          anchor_source: payment_plans.defaulted_date
          relation: not_after
          duration_source: variants.reinstatement_window_days
          unit: calendar_days
          counting_rule: "Days for reinstatement are counted as calendar days from the default date, the default date itself being day zero."
          boundary: inclusive
    measures: [payplan_msr_consecutive_missed]

  - id: payplan_add_ons_and_holidays
    subject: [payplan_balance_transferred_in, payplan_payment_deferred, payplan_terms_modified]
    rule: >-
      Add-ons are accepted only on a plan in active status. Where add_on_allowed is true, an eligible new charge is added
      while payplan_msr_add_ons is below max_add_ons_per_plan and the plan balance after the add-on stays within
      max_enrolled_balance; a charge that would exceed it starts no new plan and stays on its plan of care. The tier's
      add_on_method decides how the add-on is absorbed: under recalculate_payment the installment is recomputed over the remaining months; under extend_term the installment
      stays and months are added, never more than max_term_extension_months in total. A payment holiday defers one installment to the end of the plan only when requested no later than holiday_notice_days calendar days before that installment's due date,
      at most payment_holidays_per_year times in any rolling 12 months (payplan_msr_holidays_12m). Days are counted
      backward as calendar days from the due date, the due date itself being day zero.
    eligibility:
      - id: add_on_active_plan
        applies_to: [payplan_balance_transferred_in]
        kind: state
        condition: "Add-ons are accepted only on a plan in active status."
        evidence_fields: [payment_plans.status, payment_plans.payment_plan_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [payment_plans.payment_plan_id]
          action_bindings:
            payment_plans.payment_plan_id: payment_plan_id
        state_contract:
          field: payment_plans.status
          allowed: [active]
    measures: [payplan_msr_add_ons, payplan_msr_holidays_12m]

  - id: payplan_evt_adjustments
    subject: [payplan_balance_adjusted]
    rule: >-
      Where insurance_payment_reduces_plan is true, a payer payment that arrives later on an enrolled charge reduces the
      plan balance by the amount the patient no longer owes (insurance_payment_received). A Patient Hardship Discount
      Program approval reduces enrolled charges by the discount (hardship_discount). A charge found to be overstated is
      reduced by the excess (billing_error_correction). A waived late fee is removed (fee_waiver). On default or patient
      cancellation the whole remaining balance is returned to the plans of care (returned_to_account) where
      default_returns_to_statements or return_balance_on_cancel is true, and each enrolled charge's unpaid part is
      re-posted there. While a plan is active or past due, enrolled charges are never transferred to collections where
      collections_protection is true. After an adjustment the installment is recomputed only by the patient's request
      under payplan_payment_schedule.
    eligibility: []

  - id: payplan_closure
    subject: [payplan_paid_off, payplan_cancelled, payplan_autopay_updated]
    rule: >-
      A plan is paid off on the day its balance reaches zero. The patient may cancel an active plan at any time; the
      cancellation is the patient's own decision, and the remaining balance returns to regular statements where
      return_balance_on_cancel is true. Automatic payment may be switched between card and ACH at any time, but where
      autopay_required is true it is never switched off while the plan is open; the due day may only be changed to
      another of due_day_choices.
    eligibility: []

# ============================================================================
# extended_policies: multi-factor calculation policies claimed by the tasks of patient_payment_plans
# ============================================================================
extended_policies:
  - id: payplan_ext_missed_installment_late_fee
    base_policy_refs: [payplan_evt_delinquency]
    overwrite:
      - base_policy: payplan_evt_delinquency
        superseded_clause: >-
          Each missed installment adds late_fee, up to late_fees_max_per_plan late fees in the plan's life
          (payplan_msr_late_fees),
        replaced_by: >-
          The late-fee step is chosen from the late fees so counted: where the count has reached
          late_fees_max_per_plan the step is nothing, where none are counted and late_fees_max_per_plan is above
          zero the step is first_late_fee, and otherwise the step is the tier's late_fee.
    trigger: state_due
    subject: [payplan_fee_assessed]
    computes: amount
    target_tool: assess_payment_plan_late_fee_b662389f
    params:
      first_late_fee: 7.50
      window_age_months: 12
      narrow_window_months: 12
      wide_window_months: 24
      narrow_window_misses: 2
      relief_collections: 6
      lapse_share: 0.5
      funds_share: 0.8
      prompt_days: 20
      prompt_share: 0.6
      effort_share: 0.9
      treatment_window_months: 1
      statement_window_months: 6
      treatment_share: 0.8
      billed_share: 0.9
    rule: >-
      A late-fee entry is booked once for the installment most recently recorded as missed on the plan; it
      carries that installment's due date and adds its amount to the plan balance.
      In this rule a date falls within the last N months when fewer than N whole calendar months separate it
      from the handling date, an installment being placed by its due date and any other entry by the date it
      was recorded.
      The missed-installment late fee is the tier's late_fee, rounded to the cent, except that no late fee is
      charged once the late fees already booked on the plan over its whole life have reached
      late_fees_max_per_plan.
      The late fees already booked are counted over a window that follows the plan's record: for a plan signed
      at least window_age_months whole months before the handling date with no more than narrow_window_misses
      installments recorded as missed within the last narrow_window_months months, only the late fees on
      installments within the last narrow_window_months months are counted; for a plan signed at least
      window_age_months whole months before the handling date with more than narrow_window_misses installments
      recorded as missed within the last narrow_window_months months, the late fees on installments within the
      last wide_window_months months are counted; for any other plan the late fees of the plan's whole life
      are counted.
      The late-fee step is chosen from the late fees so counted: where the count has reached
      late_fees_max_per_plan the step is nothing, where none are counted and late_fees_max_per_plan is above
      zero the step is first_late_fee, and otherwise the step is the tier's late_fee.
      A lapse share applies to a patient with at least relief_collections installments collected by automatic
      payment within the last narrow_window_months months, by the reason the latest failed automatic draft for
      the missed installment gave: where the card had expired or the account was closed the share is
      lapse_share, where the funds were insufficient or the card was declined the share is funds_share; for
      every other patient the lapse share is one.
      An effort share follows the payments recorded against the missed installment: where they add up to the
      whole installment and the latest of them was received no more than prompt_days calendar days after the
      due date, counting the due date itself as day zero, the share is prompt_share; where they add up to more
      than zero without meeting that test the share is effort_share; where nothing has been paid against it
      the effort share is one.
      A treatment share follows the patient's therapy on their Insured Plans of Care: where at least one visit
      was billed within the last treatment_window_months months on any of the patient's plans of care and no
      patient statement was issued on any of them within the last statement_window_months months, the share is
      treatment_share; where a visit was billed within the last treatment_window_months months and a statement
      was issued within the last statement_window_months months, the share is billed_share; where no visit was
      billed within the last treatment_window_months months the treatment share is one.
      The missed-installment late fee is the late-fee step multiplied once by the product of the lapse share,
      the effort share and the treatment share, the shares being combined by multiplication rather than applied
      one by one to rounded amounts, and the result is rounded to the nearest cent only at the end.
    prerequisite: []
    cross_category:
      - category: plan
        as: history
        reads: [care_plan_events.event_type, care_plan_events.event_date]
        note: The treatment share is decided from the patient's billed visits and issued statements on their Insured Plans of Care.
    compute:
      - l_inst: "F('monthly_payment')"
      - l_due: "LATEST('payment_plan_events', 'installment_due_date', event_type='payplan_installment_missed')"
      - l_age: "MONTHS(F('agreement_signed_date'), NOW)"
      - l_miss_recent: "COUNT('payment_plan_events', within_months=K('narrow_window_months'), date_field='installment_due_date', event_type='payplan_installment_missed')"
      - l_fees_narrow: "COUNT('payment_plan_events', within_months=K('narrow_window_months'), date_field='installment_due_date', event_type='payplan_fee_assessed', fee_kind='late_fee')"
      - l_fees_wide: "COUNT('payment_plan_events', within_months=K('wide_window_months'), date_field='installment_due_date', event_type='payplan_fee_assessed', fee_kind='late_fee')"
      - l_fees_life: "COUNT('payment_plan_events', event_type='payplan_fee_assessed', fee_kind='late_fee')"
      - l_prior: "l_fees_narrow if (l_age >= K('window_age_months') and l_miss_recent <= K('narrow_window_misses')) else (l_fees_wide if (l_age >= K('window_age_months') and l_miss_recent > K('narrow_window_misses')) else l_fees_life)"
      - l_step: "0 if l_prior >= P('late_fees_max_per_plan') else (K('first_late_fee') if (l_prior == 0 and P('late_fees_max_per_plan') > 0) else P('late_fee'))"
      - l_reason: "LATEST('payment_plan_events', 'failure_reason', event_type='payplan_autopay_failed', installment_due_date=l_due)"
      - l_collections: "COUNT('payment_plan_events', within_months=K('narrow_window_months'), event_type='payplan_payment_received', channel='autopay')"
      - l_lapse: "K('lapse_share') if ((l_reason == 'card_expired' or l_reason == 'account_closed') and l_collections >= K('relief_collections')) else (K('funds_share') if ((l_reason == 'insufficient_funds' or l_reason == 'card_declined') and l_collections >= K('relief_collections')) else 1.0)"
      - l_paid: "SUM('payment_plan_events', 'amount', event_type='payplan_payment_received', installment_due_date=l_due)"
      - l_paid_last: "LATEST('payment_plan_events', 'event_date', event_type='payplan_payment_received', installment_due_date=l_due)"
      - l_effort: "K('prompt_share') if (l_paid >= l_inst and DAYS(l_due, l_paid_last) <= K('prompt_days')) else (K('effort_share') if l_paid > 0 else 1.0)"
      - l_visits: "XCOUNT('plan', 'care_plan_events', within_months=K('treatment_window_months'), event_type='plan_visit_billed')"
      - l_statements: "XCOUNT('plan', 'care_plan_events', within_months=K('statement_window_months'), event_type='plan_statement_issued')"
      - l_treatment: "K('treatment_share') if (l_visits >= 1 and l_statements == 0) else (K('billed_share') if (l_visits >= 1 and l_statements >= 1) else 1.0)"
      - result: "RND(l_step * (l_lapse * l_effort * l_treatment), 2)"
    compute_basis:
      l_due: "A late-fee entry is booked once for the installment most recently recorded as missed on the plan; it carries that installment's due date and adds its amount to the plan balance."
      l_age: "for a plan signed at least window_age_months whole months before the handling date"
      l_miss_recent: "installments recorded as missed within the last narrow_window_months months"
      l_fees_narrow: "only the late fees on installments within the last narrow_window_months months are counted"
      l_fees_wide: "the late fees on installments within the last wide_window_months months are counted"
      l_fees_life: "for any other plan the late fees of the plan's whole life are counted."
      l_prior: "The late fees already booked are counted over a window that follows the plan's record: for a plan signed at least window_age_months whole months before the handling date with no more than narrow_window_misses installments recorded as missed within the last narrow_window_months months, only the late fees on installments within the last narrow_window_months months are counted; for a plan signed at least window_age_months whole months before the handling date with more than narrow_window_misses installments recorded as missed within the last narrow_window_months months, the late fees on installments within the last wide_window_months months are counted; for any other plan the late fees of the plan's whole life are counted."
      l_step: "The late-fee step is chosen from the late fees so counted: where the count has reached late_fees_max_per_plan the step is nothing, where none are counted and late_fees_max_per_plan is above zero the step is first_late_fee, and otherwise the step is the tier's late_fee."
      l_reason: "by the reason the latest failed automatic draft for the missed installment gave"
      l_collections: "A lapse share applies to a patient with at least relief_collections installments collected by automatic payment within the last narrow_window_months months"
      l_lapse: "where the card had expired or the account was closed the share is lapse_share, where the funds were insufficient or the card was declined the share is funds_share; for every other patient the lapse share is one."
      l_paid: "An effort share follows the payments recorded against the missed installment"
      l_paid_last: "the latest of them was received no more than prompt_days calendar days after the due date, counting the due date itself as day zero"
      l_effort: "where they add up to the whole installment and the latest of them was received no more than prompt_days calendar days after the due date, counting the due date itself as day zero, the share is prompt_share; where they add up to more than zero without meeting that test the share is effort_share; where nothing has been paid against it the effort share is one."
      l_visits: "at least one visit was billed within the last treatment_window_months months on any of the patient's plans of care"
      l_statements: "no patient statement was issued on any of them within the last statement_window_months months"
      l_treatment: "A treatment share follows the patient's therapy on their Insured Plans of Care: where at least one visit was billed within the last treatment_window_months months on any of the patient's plans of care and no patient statement was issued on any of them within the last statement_window_months months, the share is treatment_share; where a visit was billed within the last treatment_window_months months and a statement was issued within the last statement_window_months months, the share is billed_share; where no visit was billed within the last treatment_window_months months the treatment share is one."
      result: "The missed-installment late fee is the late-fee step multiplied once by the product of the lapse share, the effort share and the treatment share, the shares being combined by multiplication rather than applied one by one to rounded amounts, and the result is rounded to the nearest cent only at the end."
    factors:
      - id: late_fee_count_window
        effect: method
        decides: l_prior
        bindings: [l_age, l_miss_recent, l_prior]
        ladder:
          - when: "the plan was signed at least window_age_months whole months before the handling date and no more than narrow_window_misses installments were recorded as missed within the last narrow_window_months months"
            method: "count only the late fees on installments due within the last narrow_window_months months"
          - when: "the plan was signed at least window_age_months whole months before the handling date and more than narrow_window_misses installments were recorded as missed within the last narrow_window_months months"
            method: "count the late fees on installments due within the last wide_window_months months"
          - when: "otherwise"
            method: "count the late fees of the plan's whole life"
        baseline:
          l_prior: "l_fees_life"
        evidence: [date, history]
        cross_difficulty: null
      - id: late_fee_step
        effect: parameter
        decides: l_step
        bindings: [l_fees_narrow, l_fees_wide, l_fees_life, l_step]
        ladder:
          - when: "the late fees counted have reached late_fees_max_per_plan"
            value: "0.00"
          - when: "no late fee is counted and late_fees_max_per_plan is above zero"
            value: "K('first_late_fee')"
          - when: "otherwise"
            value: "P('late_fee')"
        baseline:
          l_step: "0 if l_fees_life >= P('late_fees_max_per_plan') else P('late_fee')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: draft_lapse_share
        effect: parameter
        decides: l_lapse
        bindings: [l_reason, l_collections, l_lapse]
        ladder:
          - when: "the latest failed automatic draft for the missed installment failed because the card had expired or the account was closed, and at least relief_collections installments were collected by automatic payment within the last narrow_window_months months"
            value: "K('lapse_share')"
          - when: "that draft failed for insufficient funds or a declined card, and at least relief_collections installments were collected by automatic payment within the last narrow_window_months months"
            value: "K('funds_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          l_lapse: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: payment_effort_share
        effect: parameter
        decides: l_effort
        bindings: [l_paid, l_paid_last, l_effort]
        ladder:
          - when: "the payments recorded against the missed installment add up to the whole installment and the latest was received no more than prompt_days calendar days after its due date"
            value: "K('prompt_share')"
          - when: "the payments recorded against it add up to more than zero without meeting that test"
            value: "K('effort_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          l_effort: "1.0"
        evidence: [history, date]
        cross_difficulty: null
      - id: active_treatment_share
        effect: parameter
        decides: l_treatment
        bindings: [l_visits, l_statements, l_treatment]
        ladder:
          - when: "a visit was billed within the last treatment_window_months months on one of the patient's Insured Plans of Care and no patient statement was issued on any of them within the last statement_window_months months"
            value: "K('treatment_share')"
          - when: "a visit was billed within the last treatment_window_months months and a patient statement was issued within the last statement_window_months months"
            value: "K('billed_share')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          l_treatment: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: plan
    baseline:
      rule: >-
        The missed-installment late fee is the tier's late_fee, rounded to the cent, except that no late fee is
        charged once the late fees already booked on the plan over its whole life have reached
        late_fees_max_per_plan.
      params: [late_fee, late_fees_max_per_plan]
    inputs:
      history:
        - {table: payment_plan_events, aggregate: latest, field: installment_due_date, filters: {event_type: payplan_installment_missed}}
        - {table: payment_plan_events, aggregate: count, field: payment_plan_event_id, within_months: 12, filters: {event_type: payplan_installment_missed}}
        - {table: payment_plan_events, aggregate: count, field: payment_plan_event_id, filters: {event_type: payplan_fee_assessed, fee_kind: late_fee}}
        - {table: payment_plan_events, aggregate: latest, field: failure_reason, filters: {event_type: payplan_autopay_failed}}
        - {table: payment_plan_events, aggregate: count, field: payment_plan_event_id, within_months: 12, filters: {event_type: payplan_payment_received, channel: autopay}}
        - {table: payment_plan_events, aggregate: sum, field: amount, filters: {event_type: payplan_payment_received}}
        - {category: plan, table: care_plan_events, aggregate: count, field: care_plan_event_id, within_months: 1, filters: {event_type: plan_visit_billed}}
        - {category: plan, table: care_plan_events, aggregate: count, field: care_plan_event_id, within_months: 6, filters: {event_type: plan_statement_issued}}
      cross_category: [plan]
  - id: payplan_ext_past_due_catch_up
    base_policy_refs: [payplan_evt_payments, payplan_evt_delinquency]
    overwrite:
      - base_policy: payplan_evt_payments
        superseded_clause: >-
          and extra principal shortens the remaining term where extra_payment_shortens_term is true and otherwise
          lowers the installment.
        replaced_by: >-
          An extra-principal credit is taken off the installments owed: extra-principal payments received within
          the current delinquency count in full, because a payment made while an installment stands unpaid goes
          first to that installment; where none were received in the delinquency but extra principal was received
          within the last credit_lookback_months months on a tier whose extra_payment_shortens_term is false, that
          extra principal counts up to one installment; otherwise there is no credit.
      - base_policy: payplan_evt_payments
        superseded_clause: >-
          where autopay_required is true installments are collected automatically and manual payments are extra.
        replaced_by: >-
          The catch-up payment is taken by hand and counts as an installment payment toward the missed installments,
          never as an extra payment, even on a tier whose installments are otherwise collected automatically.
      - base_policy: payplan_evt_delinquency
        superseded_clause: >-
          A past-due plan becomes current when every missed installment is paid in full where
          cure_requires_full_past_due is true, or when the latest missed installment is paid where it is false.
        replaced_by: >-
          A past-due plan is current again when its catch-up amount is paid in one payment, the extra-principal
          credit standing for the part of the missed installments it covers, whatever the tier's
          cure_requires_full_past_due.
    trigger: on_request
    subject: [payplan_payment_received, payplan_cured]
    computes: amount
    target_tool: pay_payment_plan_past_due_400c78cb
    params:
      year_months: 12
      settled_collections: 6
      late_share_settled: 0.5
      late_share_new: 0.75
      tenure_months: 12
      returned_share_single: 0.6
      returned_share_repeat: 0.8
      credit_lookback_months: 3
      pull_days: 25
      pull_share_unreturned: 0.5
      repeat_share_recent: 0.1
      repeat_share_older: 0.05
      assist_share_approved: 0.5
      assist_share_pending: 0.75
    rule: >-
      A catch-up payment brings a past-due plan current in one payment, is recorded against the installment most
      recently recorded as missed, and is taken off the plan balance.
      The catch-up payment is taken by hand and counts as an installment payment toward the missed installments,
      never as an extra payment, even on a tier whose installments are otherwise collected automatically.
      For the catch-up, an entry lies within the last N months when the whole calendar months between its date
      and the handling date number fewer than N, with installments, fees and missed-installment entries dated by
      the installment's due date and every other payment by the day it was received; the current delinquency
      covers the months that separate the due date of the latest installment collected by automatic payment, or
      the signing date where none was, from the handling date.
      The catch-up amount is fixed only after the installment most recently recorded as missed carries its
      late-fee entry on the plan.
      The catch-up amount is the installment in force for each installment recorded as missed within the
      current delinquency, less the installment payments recorded against installments due within that
      delinquency, never below zero, plus every late fee and returned-payment fee booked on installments of the
      current delinquency, rounded to the cent.
      A past-due plan is current again when its catch-up amount is paid in one payment, the extra-principal
      credit standing for the part of the missed installments it covers, whatever the tier's
      cure_requires_full_past_due.
      Late fees of the current delinquency join the catch-up at a late-fee collection share: where exactly one
      installment was recorded as missed within the last year_months months and at least settled_collections
      installments were collected by automatic payment within that period, the share is late_share_settled;
      where exactly one installment was recorded as missed within that period and fewer than settled_collections
      were collected, the share is late_share_new; for every other plan the share is one.
      Returned-payment fees of the current delinquency join the catch-up at a returned-fee collection share: for
      a plan signed at least tenure_months whole months before the handling date with exactly one
      returned-payment fee booked on installments within the last year_months months the share is
      returned_share_single, for such a plan with two or more the share is returned_share_repeat, and for any
      other plan the share is one.
      An extra-principal credit is taken off the installments owed: extra-principal payments received within the
      current delinquency count in full, because a payment made while an installment stands unpaid goes first to
      that installment; where none were received in the delinquency but extra principal was received within the
      last credit_lookback_months months on a tier whose extra_payment_shortens_term is false, that extra
      principal counts up to one installment; otherwise there is no credit.
      A next-installment pull adds part of the coming installment: where at least pull_days calendar days have
      passed since the due date of the latest missed installment, counting that due date as day zero, and a
      returned-payment fee was booked on that installment, the whole coming installment is added; where that
      many days have passed and no returned-payment fee was booked on it, pull_share_unreturned of an installment is
      added; where fewer days have passed nothing is added.
      The pulled amount, being above what the missed installments call for, is applied by overpayment_handling
      like any other amount above what is due, and the coming installment is still collected on its own due date.
      A repeat-delinquency principal share of one installment is added for a plan with an earlier delinquency: where an
      installment outside the current delinquency was recorded as missed within the last year_months months, the
      share is repeat_share_recent; where every earlier missed installment fell before that period, the share
      is repeat_share_older; where the current delinquency holds the plan's only missed installments, nothing
      is added.
      An assistance share applies to the fees joining the catch-up by the patient's standing with the Patient
      Hardship Discount Program: with an approved determination whose expiry date has not passed the share is
      assist_share_approved, with an application pending and no such determination the share is
      assist_share_pending, and otherwise the share is one.
      The catch-up amount is worked out in this order: first the installments owed less the extra-principal
      credit, never below zero; then the late fees times their collection share plus the returned-payment fees
      times theirs, that sum multiplied by the assistance share; then the installment in force times the
      next-installment pull and times the repeat-delinquency principal share; the three parts are added and rounded to the
      nearest cent once, at the end.
    prerequisite:
      - problem: payplan_ext_missed_installment_late_fee
        kind: value_input
        gate: c_late_fees
        form: state
        policy_source: >-
          The catch-up amount is fixed only after the installment most recently recorded as missed carries its
          late-fee entry on the plan.
        condition: >-
          payment_plan_events holds a payplan_fee_assessed row with fee_kind late_fee whose installment_due_date
          equals the installment_due_date of the payplan_installment_missed row of the plan with the latest event_date.
        resolved_by: assess_payment_plan_late_fee_b662389f
        effect: >-
          c_late_fees, the late fees booked on installments of the current delinquency, rises by the late fee
          booked for the latest missed installment, so the catch-up amount rises by that fee times the late-fee
          collection share and the assistance share.
    cross_category:
      - category: hardship
        as: branch
        reads: [status, expiry_date]
        note: The assistance share is decided from the patient's Patient Hardship Discount Program case status and expiry date.
    compute:
      - c_inst: "F('monthly_payment')"
      - c_last_collected: "LATEST('payment_plan_events', 'installment_due_date', date_field='installment_due_date', event_type='payplan_payment_received', channel='autopay') or F('agreement_signed_date')"
      - c_span: "MONTHS(c_last_collected, NOW)"
      - c_missed_n: "COUNT('payment_plan_events', within_months=c_span, date_field='installment_due_date', event_type='payplan_installment_missed')"
      - c_paid_against: "SUM('payment_plan_events', 'amount', within_months=c_span, date_field='installment_due_date', event_type='payplan_payment_received', payment_kind='installment')"
      - c_late_fees: "SUM('payment_plan_events', 'amount', within_months=c_span, date_field='installment_due_date', event_type='payplan_fee_assessed', fee_kind='late_fee')"
      - c_returned_fees: "SUM('payment_plan_events', 'amount', within_months=c_span, date_field='installment_due_date', event_type='payplan_fee_assessed', fee_kind='returned_payment_fee')"
      - c_due_latest: "LATEST('payment_plan_events', 'installment_due_date', event_type='payplan_installment_missed')"
      - c_missed_year: "COUNT('payment_plan_events', within_months=K('year_months'), date_field='installment_due_date', event_type='payplan_installment_missed')"
      - c_collected_year: "COUNT('payment_plan_events', within_months=K('year_months'), event_type='payplan_payment_received', channel='autopay')"
      - c_late_share: "K('late_share_settled') if (c_missed_year == 1 and c_collected_year >= K('settled_collections')) else (K('late_share_new') if (c_missed_year == 1 and c_collected_year < K('settled_collections')) else 1.0)"
      - c_age: "MONTHS(F('agreement_signed_date'), NOW)"
      - c_returned_year: "COUNT('payment_plan_events', within_months=K('year_months'), date_field='installment_due_date', event_type='payplan_fee_assessed', fee_kind='returned_payment_fee')"
      - c_returned_share: "K('returned_share_single') if (c_age >= K('tenure_months') and c_returned_year == 1) else (K('returned_share_repeat') if (c_age >= K('tenure_months') and c_returned_year >= 2) else 1.0)"
      - c_extra_in: "SUM('payment_plan_events', 'amount', within_months=c_span, event_type='payplan_payment_received', payment_kind='extra_principal')"
      - c_extra_window: "SUM('payment_plan_events', 'amount', within_months=K('credit_lookback_months'), event_type='payplan_payment_received', payment_kind='extra_principal')"
      - c_credit: "c_extra_in if c_extra_in > 0 else (MN(c_extra_window, c_inst) if (c_extra_window > 0 and not P('extra_payment_shortens_term')) else 0)"
      - c_days: "DAYS(c_due_latest, NOW)"
      - c_returned_latest: "COUNT('payment_plan_events', event_type='payplan_fee_assessed', fee_kind='returned_payment_fee', installment_due_date=c_due_latest)"
      - c_pull: "1.0 if (c_days >= K('pull_days') and c_returned_latest >= 1) else (K('pull_share_unreturned') if (c_days >= K('pull_days') and c_returned_latest == 0) else 0)"
      - c_missed_life: "COUNT('payment_plan_events', event_type='payplan_installment_missed')"
      - c_repeat_principal: "K('repeat_share_recent') if c_missed_year > c_missed_n else (K('repeat_share_older') if (c_missed_life > c_missed_year and c_missed_year == c_missed_n) else 0)"
      - c_pending: "EXISTS('hardship', status='application_pending')"
      - c_approved_expiry: "CFIELD('hardship', 'expiry_date', status='approved')"
      - c_assist: "K('assist_share_approved') if (c_approved_expiry or '') >= NOW else (K('assist_share_pending') if c_pending else 1.0)"
      - c_core: "MX(0, c_missed_n * c_inst - c_paid_against - c_credit)"
      - c_fees: "(c_late_fees * c_late_share + c_returned_fees * c_returned_share) * c_assist"
      - result: "RND(c_core + c_fees + c_pull * c_inst + c_repeat_principal * c_inst, 2)"
    compute_basis:
      c_last_collected: "the current delinquency covers the months that separate the due date of the latest installment collected by automatic payment, or the signing date where none was, from the handling date."
      c_span: "For the catch-up, an entry lies within the last N months when the whole calendar months between its date and the handling date number fewer than N"
      c_missed_n: "the installment in force for each installment recorded as missed within the current delinquency"
      c_paid_against: "less the installment payments recorded against installments due within that delinquency"
      c_late_fees: "plus every late fee and returned-payment fee booked on installments of the current delinquency"
      c_returned_fees: "plus every late fee and returned-payment fee booked on installments of the current delinquency"
      c_due_latest: "is recorded against the installment most recently recorded as missed"
      c_missed_year: "where exactly one installment was recorded as missed within the last year_months months"
      c_collected_year: "at least settled_collections installments were collected by automatic payment within that period"
      c_late_share: "Late fees of the current delinquency join the catch-up at a late-fee collection share: where exactly one installment was recorded as missed within the last year_months months and at least settled_collections installments were collected by automatic payment within that period, the share is late_share_settled; where exactly one installment was recorded as missed within that period and fewer than settled_collections were collected, the share is late_share_new; for every other plan the share is one."
      c_age: "for a plan signed at least tenure_months whole months before the handling date"
      c_returned_year: "with exactly one returned-payment fee booked on installments within the last year_months months"
      c_returned_share: "Returned-payment fees of the current delinquency join the catch-up at a returned-fee collection share: for a plan signed at least tenure_months whole months before the handling date with exactly one returned-payment fee booked on installments within the last year_months months the share is returned_share_single, for such a plan with two or more the share is returned_share_repeat, and for any other plan the share is one."
      c_extra_in: "extra-principal payments received within the current delinquency count in full"
      c_extra_window: "extra principal was received within the last credit_lookback_months months"
      c_credit: "An extra-principal credit is taken off the installments owed: extra-principal payments received within the current delinquency count in full, because a payment made while an installment stands unpaid goes first to that installment; where none were received in the delinquency but extra principal was received within the last credit_lookback_months months on a tier whose extra_payment_shortens_term is false, that extra principal counts up to one installment; otherwise there is no credit."
      c_days: "where at least pull_days calendar days have passed since the due date of the latest missed installment, counting that due date as day zero"
      c_returned_latest: "and a returned-payment fee was booked on that installment"
      c_pull: "A next-installment pull adds part of the coming installment: where at least pull_days calendar days have passed since the due date of the latest missed installment, counting that due date as day zero, and a returned-payment fee was booked on that installment, the whole coming installment is added; where that many days have passed and no returned-payment fee was booked on it, pull_share_unreturned of an installment is added; where fewer days have passed nothing is added."
      c_missed_life: "where every earlier missed installment fell before that period"
      c_repeat_principal: "A repeat-delinquency principal share of one installment is added for a plan with an earlier delinquency: where an installment outside the current delinquency was recorded as missed within the last year_months months, the share is repeat_share_recent; where every earlier missed installment fell before that period, the share is repeat_share_older; where the current delinquency holds the plan's only missed installments, nothing is added."
      c_pending: "with an application pending and no such determination the share is assist_share_pending"
      c_approved_expiry: "with an approved determination whose expiry date has not passed the share is assist_share_approved"
      c_assist: "An assistance share applies to the fees joining the catch-up by the patient's standing with the Patient Hardship Discount Program: with an approved determination whose expiry date has not passed the share is assist_share_approved, with an application pending and no such determination the share is assist_share_pending, and otherwise the share is one."
      c_core: "first the installments owed less the extra-principal credit, never below zero"
      c_fees: "then the late fees times their collection share plus the returned-payment fees times theirs, that sum multiplied by the assistance share"
      result: "The catch-up amount is worked out in this order: first the installments owed less the extra-principal credit, never below zero; then the late fees times their collection share plus the returned-payment fees times theirs, that sum multiplied by the assistance share; then the installment in force times the next-installment pull and times the repeat-delinquency principal share; the three parts are added and rounded to the nearest cent once, at the end."
    factors:
      - id: late_fee_collection_share
        effect: parameter
        decides: c_late_share
        bindings: [c_missed_year, c_collected_year, c_late_share]
        ladder:
          - when: "exactly one installment was recorded as missed within the last year_months months and at least settled_collections installments were collected by automatic payment within that period"
            value: "K('late_share_settled')"
          - when: "exactly one installment was recorded as missed within the last year_months months and fewer than settled_collections were collected by automatic payment within that period"
            value: "K('late_share_new')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          c_late_share: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: returned_fee_collection_share
        effect: parameter
        decides: c_returned_share
        bindings: [c_age, c_returned_year, c_returned_share]
        ladder:
          - when: "the plan was signed at least tenure_months whole months before the handling date and exactly one returned-payment fee was booked on installments within the last year_months months"
            value: "K('returned_share_single')"
          - when: "the plan was signed at least tenure_months whole months before the handling date and two or more returned-payment fees were booked on installments within the last year_months months"
            value: "K('returned_share_repeat')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          c_returned_share: "1.0"
        evidence: [date, history]
        cross_difficulty: null
      - id: extra_principal_credit
        effect: method
        decides: c_credit
        bindings: [c_extra_in, c_extra_window, c_credit]
        ladder:
          - when: "extra-principal payments were received within the current delinquency"
            method: "credit those extra-principal payments in full against the installments owed"
          - when: "no extra principal was received within the current delinquency, extra principal was received within the last credit_lookback_months months, and the tier's extra_payment_shortens_term is false"
            method: "credit that extra principal against the installments owed, up to one installment in force"
          - when: "otherwise"
            method: "take no credit; only installment payments recorded against the delinquency reduce the installments owed"
        baseline:
          c_credit: "0"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: next_installment_pull
        effect: parameter
        decides: c_pull
        bindings: [c_days, c_returned_latest, c_pull]
        ladder:
          - when: "at least pull_days calendar days have passed since the latest missed installment's due date and a returned-payment fee was booked on that installment"
            value: "1.0"
          - when: "at least pull_days calendar days have passed since the latest missed installment's due date and no returned-payment fee was booked on that installment"
            value: "K('pull_share_unreturned')"
          - when: "otherwise"
            value: "0"
        baseline:
          c_pull: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: repeat_delinquency_principal_share
        effect: parameter
        decides: c_repeat_principal
        bindings: [c_missed_life, c_repeat_principal]
        ladder:
          - when: "an installment outside the current delinquency was recorded as missed within the last year_months months"
            value: "K('repeat_share_recent')"
          - when: "every earlier missed installment of the plan fell before the last year_months months"
            value: "K('repeat_share_older')"
          - when: "otherwise"
            value: "0"
        baseline:
          c_repeat_principal: "0"
        evidence: [history]
        cross_difficulty: null
      - id: assistance_share
        effect: parameter
        decides: c_assist
        bindings: [c_pending, c_approved_expiry, c_assist]
        ladder:
          - when: "the patient holds an approved Patient Hardship Discount Program determination whose expiry date has not passed"
            value: "K('assist_share_approved')"
          - when: "the patient has a Patient Hardship Discount Program application pending and no such approved determination"
            value: "K('assist_share_pending')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          c_assist: "1.0"
        evidence: [cross_category]
        cross_difficulty: hardship
    baseline:
      rule: >-
        The catch-up amount is the installment in force for each installment recorded as missed within the
        current delinquency, less the installment payments recorded against installments due within that
        delinquency, never below zero, plus every late fee and returned-payment fee booked on installments of
        the current delinquency, rounded to the cent.
      params: []
    inputs:
      history:
        - {table: payment_plan_events, aggregate: latest, field: installment_due_date, filters: {event_type: payplan_payment_received, channel: autopay}}
        - {table: payment_plan_events, aggregate: count, field: payment_plan_event_id, filters: {event_type: payplan_installment_missed}}
        - {table: payment_plan_events, aggregate: sum, field: amount, filters: {event_type: payplan_payment_received, payment_kind: installment}}
        - {table: payment_plan_events, aggregate: sum, field: amount, filters: {event_type: payplan_fee_assessed}}
        - {table: payment_plan_events, aggregate: sum, field: amount, within_months: 3, filters: {event_type: payplan_payment_received, payment_kind: extra_principal}}
        - {table: payment_plan_events, aggregate: count, field: payment_plan_event_id, within_months: 12, filters: {event_type: payplan_payment_received, channel: autopay}}
      cross_category: [hardship]
  - id: payplan_ext_returned_draft_fee
    base_policy_refs: [payplan_evt_delinquency]
    overwrite:
      - base_policy: payplan_evt_delinquency
        superseded_clause: >-
          A returned ACH or check payment adds nsf_fee;
        replaced_by: >-
          The returned-fee step follows the fees so counted: with none counted it is first_returned_fee, with
          exactly one counted it is repeat_returned_fee, and with two or more it is the tier's nsf_fee.
    trigger: state_due
    subject: [payplan_fee_assessed]
    computes: amount
    target_tool: book_payment_plan_returned_fee_3086fcb8
    params:
      fee_age_months: 12
      fee_year_months: 12
      clean_window_months: 6
      first_returned_fee: 15.00
      repeat_returned_fee: 20.00
      recovery_collections: 6
      recovery_share_settled: 0.6
      recovery_share_new: 0.8
      prepay_share_full: 0.8
      prepay_share_part: 0.9
      standing_months: 6
      standing_share_clear: 0.8
      standing_share_billed: 0.9
    rule: >-
      A returned-payment fee entry is booked once for the installment whose automatic draft most recently came
      back unpaid; it carries that installment's due date and adds its amount to the plan balance.
      Within this charge, an entry lies within the last N months when fewer than N whole calendar months
      separate it from the handling date, installments and fees being placed by the installment's due date and
      other entries by the day they were recorded.
      The returned-payment fee is the tier's nsf_fee where the plan's automatic payments are drawn from a bank
      account, and nothing for a card draft where nsf_fee_applies_to_card is false; it is rounded to the cent.
      The returned-payment fees already booked on the plan are counted over a window set by the plan's record:
      for a plan signed at least fee_age_months whole months before the handling date with no installment
      recorded as missed within the last fee_year_months months, only the returned-payment fees on installments
      within the last clean_window_months months are counted; for a plan signed at least fee_age_months whole
      months before the handling date with an installment recorded as missed within the last fee_year_months
      months, those on installments within the last fee_year_months months are counted; for any other plan every
      returned-payment fee in the plan's life is counted.
      The returned-fee step follows the fees so counted: with none counted it is first_returned_fee, with
      exactly one counted it is repeat_returned_fee, and with two or more it is the tier's nsf_fee.
      A recovery share follows the returned draft's retry: where a later automatic collection for the same
      installment was received and at least recovery_collections installments were collected by automatic
      payment within the last fee_year_months months, the share is recovery_share_settled; where that later
      collection was received and fewer installments were collected so, the share is recovery_share_new; where
      no automatic collection for that installment was received the recovery share is one.
      A prepayment share follows the extra principal the patient has paid: where extra-principal payments
      received within the last fee_year_months months add up to at least one installment in force, the share is
      prepay_share_full; where they add up to less but more than zero, the share is prepay_share_part; with none
      the prepayment share is one.
      A standing share follows how the patient settles their Insured Plans of Care: where at least one patient
      payment was recorded on the patient's plans of care within the last standing_months months and no patient
      statement was issued on any of them in that period, the share is standing_share_clear; where no such
      payment was recorded and no statement was issued in that period, the share is standing_share_billed;
      where a statement was issued in that period the standing share is one.
      The returned-payment fee is the returned-fee step multiplied by the recovery share, the prepayment share
      and the standing share taken together as one product, applied to the step in a single multiplication, and
      the result is rounded to the nearest cent only at the end.
    prerequisite: []
    cross_category:
      - category: plan
        as: history
        reads: [care_plan_events.event_type, care_plan_events.event_date]
        note: The standing share is decided from patient payments recorded and statements issued on the patient's Insured Plans of Care.
    compute:
      - r_due: "LATEST('payment_plan_events', 'installment_due_date', event_type='payplan_autopay_failed')"
      - r_bank: "1 if (F('autopay_method') == 'ach' or P('nsf_fee_applies_to_card')) else 0"
      - r_inst: "F('monthly_payment')"
      - r_age: "MONTHS(F('agreement_signed_date'), NOW)"
      - r_missed_year: "COUNT('payment_plan_events', within_months=K('fee_year_months'), date_field='installment_due_date', event_type='payplan_installment_missed')"
      - r_fees_clean: "COUNT('payment_plan_events', within_months=K('clean_window_months'), date_field='installment_due_date', event_type='payplan_fee_assessed', fee_kind='returned_payment_fee')"
      - r_fees_year: "COUNT('payment_plan_events', within_months=K('fee_year_months'), date_field='installment_due_date', event_type='payplan_fee_assessed', fee_kind='returned_payment_fee')"
      - r_fees_life: "COUNT('payment_plan_events', event_type='payplan_fee_assessed', fee_kind='returned_payment_fee')"
      - r_counted: "r_fees_clean if (r_age >= K('fee_age_months') and r_missed_year == 0) else (r_fees_year if (r_age >= K('fee_age_months') and r_missed_year >= 1) else r_fees_life)"
      - r_step: "K('first_returned_fee') if r_counted == 0 else (K('repeat_returned_fee') if r_counted == 1 else P('nsf_fee'))"
      - r_retry: "COUNT('payment_plan_events', event_type='payplan_payment_received', channel='autopay', installment_due_date=r_due)"
      - r_collected: "COUNT('payment_plan_events', within_months=K('fee_year_months'), event_type='payplan_payment_received', channel='autopay')"
      - r_recovery: "K('recovery_share_settled') if (r_retry >= 1 and r_collected >= K('recovery_collections')) else (K('recovery_share_new') if (r_retry >= 1 and r_collected < K('recovery_collections')) else 1.0)"
      - r_extra: "SUM('payment_plan_events', 'amount', within_months=K('fee_year_months'), event_type='payplan_payment_received', payment_kind='extra_principal')"
      - r_prepay: "K('prepay_share_full') if r_extra >= r_inst else (K('prepay_share_part') if r_extra > 0 else 1.0)"
      - r_statements: "XCOUNT('plan', 'care_plan_events', within_months=K('standing_months'), event_type='plan_statement_issued')"
      - r_care_payments: "XCOUNT('plan', 'care_plan_events', within_months=K('standing_months'), event_type='plan_patient_payment')"
      - r_standing: "K('standing_share_clear') if (r_care_payments >= 1 and r_statements == 0) else (K('standing_share_billed') if (r_care_payments == 0 and r_statements == 0) else 1.0)"
      - result: "RND(r_bank * r_step * (r_recovery * r_prepay * r_standing), 2)"
    compute_basis:
      r_due: "A returned-payment fee entry is booked once for the installment whose automatic draft most recently came back unpaid; it carries that installment's due date and adds its amount to the plan balance."
      r_bank: "The returned-payment fee is the tier's nsf_fee where the plan's automatic payments are drawn from a bank account, and nothing for a card draft where nsf_fee_applies_to_card is false; it is rounded to the cent."
      r_age: "for a plan signed at least fee_age_months whole months before the handling date"
      r_missed_year: "with no installment recorded as missed within the last fee_year_months months"
      r_fees_clean: "only the returned-payment fees on installments within the last clean_window_months months are counted"
      r_fees_year: "those on installments within the last fee_year_months months are counted"
      r_fees_life: "for any other plan every returned-payment fee in the plan's life is counted."
      r_counted: "The returned-payment fees already booked on the plan are counted over a window set by the plan's record: for a plan signed at least fee_age_months whole months before the handling date with no installment recorded as missed within the last fee_year_months months, only the returned-payment fees on installments within the last clean_window_months months are counted; for a plan signed at least fee_age_months whole months before the handling date with an installment recorded as missed within the last fee_year_months months, those on installments within the last fee_year_months months are counted; for any other plan every returned-payment fee in the plan's life is counted."
      r_step: "The returned-fee step follows the fees so counted: with none counted it is first_returned_fee, with exactly one counted it is repeat_returned_fee, and with two or more it is the tier's nsf_fee."
      r_retry: "where a later automatic collection for the same installment was received"
      r_collected: "at least recovery_collections installments were collected by automatic payment within the last fee_year_months months"
      r_recovery: "A recovery share follows the returned draft's retry: where a later automatic collection for the same installment was received and at least recovery_collections installments were collected by automatic payment within the last fee_year_months months, the share is recovery_share_settled; where that later collection was received and fewer installments were collected so, the share is recovery_share_new; where no automatic collection for that installment was received the recovery share is one."
      r_extra: "where extra-principal payments received within the last fee_year_months months add up to at least one installment in force"
      r_prepay: "A prepayment share follows the extra principal the patient has paid: where extra-principal payments received within the last fee_year_months months add up to at least one installment in force, the share is prepay_share_full; where they add up to less but more than zero, the share is prepay_share_part; with none the prepayment share is one."
      r_statements: "no patient statement was issued on any of them in that period"
      r_care_payments: "where at least one patient payment was recorded on the patient's plans of care within the last standing_months months"
      r_standing: "A standing share follows how the patient settles their Insured Plans of Care: where at least one patient payment was recorded on the patient's plans of care within the last standing_months months and no patient statement was issued on any of them in that period, the share is standing_share_clear; where no such payment was recorded and no statement was issued in that period, the share is standing_share_billed; where a statement was issued in that period the standing share is one."
      result: "The returned-payment fee is the returned-fee step multiplied by the recovery share, the prepayment share and the standing share taken together as one product, applied to the step in a single multiplication, and the result is rounded to the nearest cent only at the end."
    factors:
      - id: returned_fee_count_window
        effect: method
        decides: r_counted
        bindings: [r_age, r_missed_year, r_counted]
        ladder:
          - when: "the plan was signed at least fee_age_months whole months before the handling date and no installment was recorded as missed within the last fee_year_months months"
            method: "count only the returned-payment fees on installments due within the last clean_window_months months"
          - when: "the plan was signed at least fee_age_months whole months before the handling date and an installment was recorded as missed within the last fee_year_months months"
            method: "count the returned-payment fees on installments due within the last fee_year_months months"
          - when: "otherwise"
            method: "count every returned-payment fee in the plan's life"
        baseline:
          r_counted: "r_fees_life"
        evidence: [date, history]
        cross_difficulty: null
      - id: returned_fee_step
        effect: parameter
        decides: r_step
        bindings: [r_fees_clean, r_fees_year, r_fees_life, r_step]
        ladder:
          - when: "no returned-payment fee is counted"
            value: "K('first_returned_fee')"
          - when: "exactly one returned-payment fee is counted"
            value: "K('repeat_returned_fee')"
          - when: "otherwise"
            value: "P('nsf_fee')"
        baseline:
          r_step: "P('nsf_fee')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: draft_recovery_share
        effect: parameter
        decides: r_recovery
        bindings: [r_retry, r_collected, r_recovery]
        ladder:
          - when: "a later automatic collection for the returned installment was received and at least recovery_collections installments were collected by automatic payment within the last fee_year_months months"
            value: "K('recovery_share_settled')"
          - when: "a later automatic collection for the returned installment was received and fewer than recovery_collections installments were collected by automatic payment within the last fee_year_months months"
            value: "K('recovery_share_new')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          r_recovery: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: prepayment_share
        effect: parameter
        decides: r_prepay
        bindings: [r_extra, r_prepay]
        ladder:
          - when: "extra-principal payments received within the last fee_year_months months add up to at least one installment in force"
            value: "K('prepay_share_full')"
          - when: "extra-principal payments received within the last fee_year_months months add up to more than zero but less than one installment in force"
            value: "K('prepay_share_part')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          r_prepay: "1.0"
        evidence: [history]
        cross_difficulty: null
      - id: care_account_standing_share
        effect: parameter
        decides: r_standing
        bindings: [r_statements, r_care_payments, r_standing]
        ladder:
          - when: "at least one patient payment was recorded on the patient's Insured Plans of Care within the last standing_months months and no patient statement was issued on them in that period"
            value: "K('standing_share_clear')"
          - when: "no patient payment was recorded on those plans within the last standing_months months and no patient statement was issued on them in that period"
            value: "K('standing_share_billed')"
          - when: "otherwise"
            value: "1.0"
        baseline:
          r_standing: "1.0"
        evidence: [cross_category, history]
        cross_difficulty: plan
    baseline:
      rule: >-
        The returned-payment fee is the tier's nsf_fee where the plan's automatic payments are drawn from a bank
        account, and nothing for a card draft where nsf_fee_applies_to_card is false; it is rounded to the cent.
      params: [nsf_fee, nsf_fee_applies_to_card]
    inputs:
      history:
        - {table: payment_plan_events, aggregate: latest, field: installment_due_date, filters: {event_type: payplan_autopay_failed}}
        - {table: payment_plan_events, aggregate: count, field: payment_plan_event_id, filters: {event_type: payplan_fee_assessed, fee_kind: returned_payment_fee}}
        - {table: payment_plan_events, aggregate: count, field: payment_plan_event_id, within_months: 12, filters: {event_type: payplan_installment_missed}}
        - {table: payment_plan_events, aggregate: count, field: payment_plan_event_id, within_months: 12, filters: {event_type: payplan_payment_received, channel: autopay}}
        - {table: payment_plan_events, aggregate: sum, field: amount, within_months: 12, filters: {event_type: payplan_payment_received, payment_kind: extra_principal}}
        - {category: plan, table: care_plan_events, aggregate: count, field: care_plan_event_id, within_months: 6, filters: {event_type: plan_statement_issued}}
        - {category: plan, table: care_plan_events, aggregate: count, field: care_plan_event_id, within_months: 6, filters: {event_type: plan_patient_payment}}
      cross_category: [plan]
  - id: payplan_ext_term_modification
    base_policy_refs: [payplan_payment_schedule, payplan_add_ons_and_holidays]
    overwrite:
      - base_policy: payplan_payment_schedule
        superseded_clause: >-
          never adding more than max_term_extension_months to term_months
        replaced_by: >-
          The extension months are the history months plus the treatment months, never more than
          max_term_extension_months in total.
      - base_policy: payplan_payment_schedule
        superseded_clause: >-
          The monthly installment is the remaining balance divided by term_months, rounded up to the next cent, but
          never below min_monthly_payment; when the minimum applies the number of installments is the remaining
          balance divided by min_monthly_payment, rounded up.
        replaced_by: >-
          The modified installment is worked out in this order: first the plan balance less any held installment
          and less the carved fees; then that amount divided by the installments not yet due, adjusted by the
          count adjustment, plus the extension months; the quotient is rounded up to the next cent and raised to
          min_monthly_payment where it falls below it.
    trigger: on_request
    subject: [payplan_terms_modified]
    computes: monthly_payment
    target_tool: accept_payment_plan_modification_53d89fa9
    params:
      ext_year_months: 12
      history_months_repeat: 1
      history_months_single: 2
      treatment_months_window: 2
      ext_statement_months: 6
      treatment_visits_full: 4
      treatment_months_full: 2
      treatment_months_part: 1
      hold_days: 25
      fee_carve_months: 3
      carve_collections: 6
      carve_share_part: 0.5
    rule: >-
      A modification replaces the installment in force and the number of installments of a plan at the
      patient's request, and the patient accepts the modified terms themselves.
      For a modification, the installments not yet due are the plan's term_months less the installments whose
      due dates fall on or before the handling date, those being the whole calendar months from the first due
      date to the handling date plus one; a period of the last N months takes in an entry when fewer than N
      whole calendar months separate its date from the handling date, installments and fees being dated by
      the installment's due date and other entries by the day they were recorded.
      The modified installment is not worked out until the installment whose automatic draft most recently came
      back unpaid carries its returned-payment fee entry on the plan.
      The modified installment is the plan balance divided by the installments not yet due plus
      max_term_extension_months, rounded up to the next cent and never below min_monthly_payment, and the
      modified term is the current term_months plus the extension months used.
      The extension months are the history months plus the treatment months, never more than
      max_term_extension_months in total.
      The history months follow the returned-payment fees booked on installments within the last
      ext_year_months months: two or more give history_months_repeat, exactly one gives history_months_single,
      and none gives max_term_extension_months.
      The treatment months follow the patient's therapy on their Insured Plans of Care: with at least
      treatment_visits_full visits billed within the last treatment_months_window months on any of the
      patient's plans of care and no patient statement issued on any of them within the last
      ext_statement_months months, they are treatment_months_full; with at least one but fewer than
      treatment_visits_full such visits and no such statement, they are treatment_months_part; otherwise they
      are zero.
      A count adjustment follows the timing of the request: where at least hold_days calendar days have passed
      since the due date of the latest installment collected by automatic payment, counting that due date as
      day zero, and no payment holiday deferred an installment within the last ext_year_months months, the next
      installment is held at the installment in force, so one installment in force is taken out of the plan
      balance and one installment out of the count; where a payment holiday deferred an installment within the
      last ext_year_months months, each such deferred installment is added to the installments not yet due and
      to the modified term; otherwise the count is not adjusted.
      Where no installment has yet been collected by automatic payment, no installment is held.
      Fees booked on installments within the last fee_carve_months months are carved out of the balance that is
      spread, at a fee carve share: where such fees exist and at least carve_collections installments were
      collected by automatic payment within the last ext_year_months months the share is one, where such fees
      exist and fewer were collected so the share is carve_share_part, and where no fee was booked on an
      installment within the last fee_carve_months months nothing is carved.
      The modified installment is worked out in this order: first the plan balance less any held installment
      and less the carved fees; then that amount divided by the installments not yet due, adjusted by the
      count adjustment, plus the extension months; the quotient is rounded up to the next cent and raised to
      min_monthly_payment where it falls below it.
      The modified term is the current term_months plus the extension months and any deferred installment added
      by the count adjustment, and it stays so where min_monthly_payment applies.
    prerequisite:
      - problem: payplan_ext_returned_draft_fee
        kind: value_input
        gate: m_returned_year
        form: state
        policy_source: >-
          The modified installment is not worked out until the installment whose automatic draft most recently
          came back unpaid carries its returned-payment fee entry on the plan.
        condition: >-
          payment_plan_events holds a payplan_fee_assessed row with fee_kind returned_payment_fee whose
          installment_due_date equals the installment_due_date of the payplan_autopay_failed row of the plan with the latest
          event_date.
        resolved_by: book_payment_plan_returned_fee_3086fcb8
        effect: >-
          m_returned_year, the returned-payment fees on installments within the last ext_year_months months, rises
          by one, which can lower the history months and so the extension months; the plan balance and the fees
          booked within the last fee_carve_months months rise by the fee booked.
    cross_category:
      - category: plan
        as: history
        reads: [care_plan_events.event_type, care_plan_events.event_date]
        note: The treatment months are decided from the visits billed and statements issued on the patient's Insured Plans of Care.
    compute:
      - m_inst: "F('monthly_payment')"
      - m_balance: "F('plan_balance')"
      - m_due_count: "MONTHS(F('first_due_date'), NOW) + 1"
      - m_remaining: "F('term_months') - m_due_count"
      - m_returned_year: "COUNT('payment_plan_events', within_months=K('ext_year_months'), date_field='installment_due_date', event_type='payplan_fee_assessed', fee_kind='returned_payment_fee')"
      - m_history: "K('history_months_repeat') if m_returned_year >= 2 else (K('history_months_single') if m_returned_year == 1 else P('max_term_extension_months'))"
      - m_visits: "XCOUNT('plan', 'care_plan_events', within_months=K('treatment_months_window'), event_type='plan_visit_billed')"
      - m_statements: "XCOUNT('plan', 'care_plan_events', within_months=K('ext_statement_months'), event_type='plan_statement_issued')"
      - m_treatment: "K('treatment_months_full') if (m_visits >= K('treatment_visits_full') and m_statements == 0) else (K('treatment_months_part') if (m_visits >= 1 and m_visits < K('treatment_visits_full') and m_statements == 0) else 0)"
      - m_ext: "MN(P('max_term_extension_months'), m_history + m_treatment)"
      - m_last_auto: "LATEST('payment_plan_events', 'installment_due_date', date_field='installment_due_date', event_type='payplan_payment_received', channel='autopay')"
      - m_days: "DAYS(m_last_auto, NOW) if m_last_auto else 0"
      - m_deferred: "COUNT('payment_plan_events', within_months=K('ext_year_months'), date_field='installment_due_date', event_type='payplan_payment_deferred')"
      - m_adjust: "-1 if (m_days >= K('hold_days') and m_deferred == 0) else (m_deferred if m_deferred > 0 else 0)"
      - m_held: "m_inst if m_adjust < 0 else 0"
      - m_recent_fees: "SUM('payment_plan_events', 'amount', within_months=K('fee_carve_months'), date_field='installment_due_date', event_type='payplan_fee_assessed')"
      - m_collected: "COUNT('payment_plan_events', within_months=K('ext_year_months'), event_type='payplan_payment_received', channel='autopay')"
      - m_carve: "1.0 if (m_recent_fees > 0 and m_collected >= K('carve_collections')) else (K('carve_share_part') if (m_recent_fees > 0 and m_collected < K('carve_collections')) else 0)"
      - m_spread: "m_balance - m_held - m_carve * m_recent_fees"
      - m_count: "m_remaining + m_adjust + m_ext"
      - m_cents: "RND(m_spread / m_count * 100, 6)"
      - m_term_new: "F('term_months') + m_ext + (m_adjust if m_adjust > 0 else 0)"
      - result: "MX(P('min_monthly_payment'), (int(m_cents) + (1 if m_cents > int(m_cents) else 0)) / 100)"
    compute_basis:
      m_balance: "The modified installment is the plan balance divided by the installments not yet due plus max_term_extension_months"
      m_due_count: "those being the whole calendar months from the first due date to the handling date plus one"
      m_remaining: "For a modification, the installments not yet due are the plan's term_months less the installments whose due dates fall on or before the handling date"
      m_returned_year: "The history months follow the returned-payment fees booked on installments within the last ext_year_months months"
      m_history: "The history months follow the returned-payment fees booked on installments within the last ext_year_months months: two or more give history_months_repeat, exactly one gives history_months_single, and none gives max_term_extension_months."
      m_visits: "visits billed within the last treatment_months_window months on any of the patient's plans of care"
      m_statements: "no patient statement issued on any of them within the last ext_statement_months months"
      m_treatment: "The treatment months follow the patient's therapy on their Insured Plans of Care: with at least treatment_visits_full visits billed within the last treatment_months_window months on any of the patient's plans of care and no patient statement issued on any of them within the last ext_statement_months months, they are treatment_months_full; with at least one but fewer than treatment_visits_full such visits and no such statement, they are treatment_months_part; otherwise they are zero."
      m_ext: "The extension months are the history months plus the treatment months, never more than max_term_extension_months in total."
      m_last_auto: "since the due date of the latest installment collected by automatic payment"
      m_days: "Where no installment has yet been collected by automatic payment, no installment is held."
      m_deferred: "where a payment holiday deferred an installment within the last ext_year_months months"
      m_adjust: "A count adjustment follows the timing of the request: where at least hold_days calendar days have passed since the due date of the latest installment collected by automatic payment, counting that due date as day zero, and no payment holiday deferred an installment within the last ext_year_months months, the next installment is held at the installment in force, so one installment in force is taken out of the plan balance and one installment out of the count; where a payment holiday deferred an installment within the last ext_year_months months, each such deferred installment is added to the installments not yet due and to the modified term; otherwise the count is not adjusted."
      m_held: "so one installment in force is taken out of the plan balance and one installment out of the count"
      m_recent_fees: "Fees booked on installments within the last fee_carve_months months are carved out of the balance that is spread"
      m_collected: "at least carve_collections installments were collected by automatic payment within the last ext_year_months months"
      m_carve: "at a fee carve share: where such fees exist and at least carve_collections installments were collected by automatic payment within the last ext_year_months months the share is one, where such fees exist and fewer were collected so the share is carve_share_part, and where no fee was booked on an installment within the last fee_carve_months months nothing is carved."
      m_spread: "first the plan balance less any held installment and less the carved fees"
      m_count: "then that amount divided by the installments not yet due, adjusted by the count adjustment, plus the extension months"
      m_cents: "the quotient is rounded up to the next cent"
      m_term_new: "The modified term is the current term_months plus the extension months and any deferred installment added by the count adjustment, and it stays so where min_monthly_payment applies."
      result: "the quotient is rounded up to the next cent and raised to min_monthly_payment where it falls below it."
    factors:
      - id: history_extension_months
        effect: parameter
        decides: m_history
        bindings: [m_returned_year, m_history]
        ladder:
          - when: "two or more returned-payment fees were booked on installments within the last ext_year_months months"
            value: "K('history_months_repeat')"
          - when: "exactly one returned-payment fee was booked on installments within the last ext_year_months months"
            value: "K('history_months_single')"
          - when: "otherwise"
            value: "P('max_term_extension_months')"
        baseline:
          m_history: "P('max_term_extension_months')"
        evidence: [history]
        cross_difficulty: null
      - id: treatment_extension_months
        effect: parameter
        decides: m_treatment
        bindings: [m_visits, m_statements, m_treatment]
        ladder:
          - when: "at least treatment_visits_full visits were billed within the last treatment_months_window months on the patient's Insured Plans of Care and no patient statement was issued on them within the last ext_statement_months months"
            value: "K('treatment_months_full')"
          - when: "at least one but fewer than treatment_visits_full such visits were billed and no such statement was issued"
            value: "K('treatment_months_part')"
          - when: "otherwise"
            value: "0"
        baseline:
          m_treatment: "0"
        evidence: [cross_category, history]
        cross_difficulty: plan
      - id: request_timing_count_adjustment
        effect: method
        decides: m_adjust
        bindings: [m_last_auto, m_days, m_deferred, m_adjust]
        ladder:
          - when: "at least hold_days calendar days have passed since the due date of the latest installment collected by automatic payment and no payment holiday deferred an installment within the last ext_year_months months"
            method: "hold the next installment at the installment in force: take one installment in force out of the balance spread and one installment out of the count"
          - when: "a payment holiday deferred an installment within the last ext_year_months months"
            method: "add each deferred installment to the installments not yet due and to the modified term"
          - when: "otherwise"
            method: "spread over the installments not yet due as counted, with nothing held or added"
        baseline:
          m_adjust: "0"
        evidence: [date, history]
        cross_difficulty: null
      - id: fee_carve_share
        effect: parameter
        decides: m_carve
        bindings: [m_recent_fees, m_collected, m_carve]
        ladder:
          - when: "fees were booked on installments within the last fee_carve_months months and at least carve_collections installments were collected by automatic payment within the last ext_year_months months"
            value: "1.0"
          - when: "fees were booked on installments within the last fee_carve_months months and fewer than carve_collections installments were collected by automatic payment within the last ext_year_months months"
            value: "K('carve_share_part')"
          - when: "otherwise"
            value: "0"
        baseline:
          m_carve: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The modified installment is the plan balance divided by the installments not yet due plus
        max_term_extension_months, rounded up to the next cent and never below min_monthly_payment, and the
        modified term is the current term_months plus the extension months used.
      params: [max_term_extension_months, min_monthly_payment, term_months]
    inputs:
      history:
        - {table: payment_plan_events, aggregate: count, field: payment_plan_event_id, within_months: 12, filters: {event_type: payplan_fee_assessed, fee_kind: returned_payment_fee}}
        - {table: payment_plan_events, aggregate: latest, field: installment_due_date, filters: {event_type: payplan_payment_received, channel: autopay}}
        - {table: payment_plan_events, aggregate: count, field: payment_plan_event_id, within_months: 12, filters: {event_type: payplan_payment_deferred}}
        - {table: payment_plan_events, aggregate: sum, field: amount, within_months: 3, filters: {event_type: payplan_fee_assessed}}
        - {table: payment_plan_events, aggregate: count, field: payment_plan_event_id, within_months: 12, filters: {event_type: payplan_payment_received, channel: autopay}}
        - {category: plan, table: care_plan_events, aggregate: count, field: care_plan_event_id, within_months: 2, filters: {event_type: plan_visit_billed}}
        - {category: plan, table: care_plan_events, aggregate: count, field: care_plan_event_id, within_months: 6, filters: {event_type: plan_statement_issued}}
      cross_category: [plan]
