# Workers' Compensation Referral — therapy for injured workers billed to the employer's workers'
# compensation carrier or third-party administrator, or directly to a contracted employer.
# One holding = one referral of one injured worker under one claim for one program. The tier is the
# program the referral is for, because the program decides the authorization, billing unit, rate and
# reporting obligations toward the adjuster and employer.

category: wc
display_name: Workers' Compensation Referral

binding:
  holding_table: wc_cases
  event_tables: [wc_events]
  status_field: status
  variant_field: variant_name
  quantity_fields:
    authorized_visits_remaining: wc_authorized_visits
    receivable_balance: wc_receivable

lifecycle:
  states: [referral_received, active, suspended, discharged, closed]
  transitions:
    - {from: referral_received, to: active, by: agent, means: "Treatment starts once the program's entry requirements and adjuster authorization are on file."}
    - {from: active, to: suspended, by: agent, means: "Treatment is suspended (authorization lapsed, claim denied, non-compliance review, awaiting physician re-check)."}
    - {from: suspended, to: active, by: agent, means: "Treatment resumes after the suspension reason is resolved."}
    - {from: active, to: discharged, by: system, means: "The worker is discharged (goals met, return to full duty, maximum medical improvement, program completed)."}
    - {from: suspended, to: discharged, by: system, means: "A suspension past its limit ends in discharge."}
    - {from: discharged, to: closed, by: system, means: "The referral closes once its receivable is settled to zero."}
    - {from: referral_received, to: closed, by: agent, means: "A referral that never started (claim denied, authorization refused, worker declined) is closed."}

accounts:
  - key: wc_authorized_visits
    unit: visits
    meaning: Visits or program days approved by the adjuster (or allowed by the employer contract) that have not yet been used.
  - key: wc_receivable
    unit: USD
    meaning: Amount billed for the referral to the carrier, employer or rebilled payer that has not yet been paid or adjusted.

parameter_schema:
  fee_basis: "How charges are priced: state_fee_schedule (North Carolina Industrial Commission medical fee schedule) or employer_contract (the employer's direct-pay contract) (enum)."
  billing_unit: "Unit in which treatment is billed: visit or hour (enum)."
  unit_rate: "Billed rate for one billing unit of treatment (USD, 2 decimals)."
  evaluation_rate: "Billed rate for the initial evaluation; 0.00 where the program has no separate evaluation charge (USD, 2 decimals)."
  network_discount_percent: "Discount taken by the carrier's workers' compensation network from the billed amount at payment; 0 where none (integer, percent)."
  max_billable_units_per_day: "Maximum billing units billed for one date of service (integer, units)."
  adjuster_authorization_required: "Whether the adjuster must authorize treatment before it is rendered beyond initial_visits_without_auth (boolean)."
  initial_visits_without_auth: "Visits, counting the initial evaluation, that may be rendered before an adjuster authorization (integer, visits)."
  auth_followup_business_days: "Business days after an authorization request after which it is followed up with the adjuster; 0 where no authorization is needed (integer, business days)."
  auth_extension_lead_days: "Calendar days before the authorization end date by which an extension is requested; 0 where not applicable (integer, calendar days)."
  auth_renewal_trigger_visits: "Remaining authorized visits or program days at or below which an extension is requested; 0 where not applicable (integer)."
  visits_per_week_max: "Maximum visits or program days per Monday-to-Sunday week the program allows (integer)."
  program_hours_per_day_min: "Minimum program hours per day for an hour-billed program; 0 where billed by visit (integer, hours)."
  program_hours_per_day_max: "Maximum program hours per day for an hour-billed program; 0 where billed by visit (integer, hours)."
  program_length_weeks_max: "Maximum program length from the first treatment date (integer, weeks)."
  entry_requires_physician_order: "Whether a treating physician's order must be on file before the first visit (boolean)."
  entry_requires_job_description: "Whether the employer's written job description must be on file before the first visit (boolean)."
  entry_requires_fce_baseline: "Whether a completed Functional Capacity Evaluation must be on file before entry (boolean)."
  return_to_work_goal_required: "Whether a written return-to-work goal agreed with the employer is required at entry (boolean)."
  progress_report_interval_days: "Maximum calendar days between progress reports to the adjuster or employer; 0 where only a final report is sent (integer, calendar days)."
  initial_report_due_business_days: "Business days after the initial evaluation (or the FCE) within which its report is sent (integer, business days)."
  discharge_report_days: "Calendar days after discharge within which the discharge report is sent; 0 where the final report is the FCE report (integer, calendar days)."
  bill_submission_deadline_days: "Calendar days after the date of service within which the bill must be submitted (integer, calendar days)."
  untimely_bill_payable: "Whether a bill submitted after the deadline may still be collected from anyone (boolean)."
  carrier_payment_due_days: "Calendar days after bill submission within which the payer must pay (integer, calendar days)."
  late_payment_penalty_percent: "Penalty, as a percentage of the unpaid charge, billed when the carrier pays after carrier_payment_due_days; 0 where none (integer, percent)."
  receivable_followup_days: "Calendar days after bill submission at which an unpaid bill is followed up with the payer (integer, calendar days)."
  bill_reconsideration_days: "Calendar days after a reduced or denied payment within which reconsideration may be requested (integer, calendar days)."
  patient_billing_prohibited_if_compensable: "Whether the injured worker may never be billed for treatment of an accepted or without-prejudice claim (boolean)."
  denied_claim_bill_health_plan: "Whether treatment under a denied claim is rebilled to the worker's health insurance (boolean)."
  treat_while_pending: "Whether treatment may start while compensability is still pending; not applicable to employer_contract programs (boolean)."
  pending_claim_max_visits: "Visits rendered while compensability is pending before treatment pauses; 0 where treat_while_pending is false (integer, visits)."
  injured_worker_missed_fee_billable: "Whether a late-cancellation or no-show fee may be charged to the injured worker (boolean)."
  missed_visit_report_business_days: "Business days after a missed visit within which it is reported to the adjuster or employer (integer, business days)."
  missed_visits_before_adjuster_review: "Consecutive missed visits after which treatment is suspended for a non-compliance review with the adjuster (integer)."
  suspension_max_days: "Calendar days a referral may stay suspended before discharge; 0 where suspension is not used (integer, calendar days)."
  telehealth_allowed: "Whether visits may be delivered by telehealth (boolean)."
  employer_invoice_cycle_days: "Calendar days between invoices to a direct-pay employer; 0 where the carrier is billed per bill (integer, calendar days)."
  direct_pay_visit_cap: "Visits an employer direct-pay program covers before the injury must be reported as a claim; 0 where not applicable (integer, visits)."
  osha_first_aid_only: "Whether treatment is limited to first-aid measures so the case stays outside OSHA recordability (boolean)."
  fce_no_show_billable_to_carrier: "Whether a missed Functional Capacity Evaluation appointment is billed to the carrier (boolean)."
  fce_no_show_fee: "Amount billed to the carrier for a missed Functional Capacity Evaluation; 0.00 where not billable (USD, 2 decimals)."
  nurse_case_manager_copy: "Whether every report is copied to the nurse case manager assigned on the claim (boolean)."
  form_63_contest_days: "Calendar days after a Form 63 (payment without prejudice) within which the carrier may still deny the claim; 0 where not applicable (integer, calendar days)."
  health_plan_rebill_days: "Calendar days after a claim denial within which treatment is rebilled to the worker's health insurance; 0 where not applicable (integer, calendar days)."
  work_status_report_each_visit: "Whether a work status update is sent after every program day (boolean)."
  employer_direct_requires_incident_report: "Whether the employer's incident report must be on file before the first visit (boolean)."
  unauthorized_visit_billable_to_worker: "Whether a visit rendered without required authorization may be billed to the worker (boolean)."

