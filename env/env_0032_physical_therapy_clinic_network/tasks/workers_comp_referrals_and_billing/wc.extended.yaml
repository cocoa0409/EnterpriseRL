events:
  - type: wc_referral_opened
    target: wc_cases
    mutation: create
    meaning: A workers' compensation referral is registered with the claim, employer, carrier and adjuster details.
    grain: one row per referral
    fields:
      wc_case_id: reference number of the referral
      customer_id: the injured worker
      variant_name: program tier
      opened_date: date the referral was received
      clinic_name: treating clinic
      employer_name: employer at the date of injury
      carrier_name: workers' compensation carrier or third-party administrator
      claim_number: carrier claim number
      adjuster_name: assigned adjuster
      date_of_injury: date of injury
      injured_body_part: body part as written on the referral
      compensability_status: compensability position at intake
      form_63_date: date of the Form 63 where the carrier pays without prejudice; empty otherwise
      physician_order_date: date of the treating physician's order; empty where none
      job_description_on_file: whether the employer's job description is on file
      fce_baseline_on_file: whether a completed FCE is on file
      incident_report_on_file: whether the employer's incident report is on file
    triggers: []
  - type: wc_activated
    target: wc_cases
    mutation: {transition: {from: referral_received, to: active}}
    meaning: Treatment under the referral starts.
    grain: one row per transaction
    fields:
      status: becomes active
    triggers: []
  - type: wc_suspended
    target: wc_cases
    mutation: {transition: {from: active, to: suspended}}
    meaning: Treatment is suspended for a recorded reason.
    grain: one row per transaction
    fields:
      status: becomes suspended
      suspend_reason: why treatment is suspended
      suspend_start_date: date the suspension began
    triggers: []
  - type: wc_reactivated
    target: wc_cases
    mutation: {transition: {from: suspended, to: active}}
    meaning: A suspended referral resumes.
    grain: one row per transaction
    fields:
      status: becomes active
      suspend_reason: cleared to none
    triggers: []
  - type: wc_discharged
    target: wc_cases
    mutation: {transition: [{from: active, to: discharged}, {from: suspended, to: discharged}]}
    meaning: The worker is discharged from the program.
    grain: one row per transaction
    fields:
      status: becomes discharged
      discharge_reason: why
      discharge_date: date of discharge
    triggers:
      - event: wc:wc_report_sent
        map: {report_kind: discharge_report}
  - type: wc_closed
    target: wc_cases
    mutation: {transition: [{from: discharged, to: closed}, {from: referral_received, to: closed}]}
    meaning: The referral is closed.
    grain: one row per transaction
    fields:
      status: becomes closed
      closed_date: date closed
    triggers: []
  - type: wc_compensability_updated
    target: wc_cases
    mutation: update
    meaning: The carrier's position on compensability changes (accepted, paid without prejudice, denied).
    grain: one row per transaction
    fields:
      compensability_status: new position
      form_63_date: Form 63 date where the new position is payment without prejudice
      compensability_date: date of the new position
    triggers: []
  - type: wc_work_status_updated
    target: wc_cases
    mutation: update
    meaning: The worker's work status on file changes.
    grain: one row per transaction
    fields:
      work_status: new work status
    triggers: []
  - type: wc_auth_recorded
    target: wc_cases
    mutation: update
    meaning: The referral's current adjuster authorization reference, end date and weekly frequency are updated to the newest authorization.
    grain: one row per transaction
    fields:
      auth_reference: authorization now in force
      auth_end_date: last date it covers
      authorized_visits_per_week: weekly frequency it allows
    triggers: []
  - type: wc_authorization_received
    target: wc_events
    meaning: The adjuster (or the employer contract) authorizes a number of visits or program days.
    grain: one row per authorization
    distinguish_by: [auth_reference, auth_start_date]
    fields:
      event_date: date received
      auth_reference: adjuster's authorization reference
      visits: visits or program days authorized
      visits_per_week: weekly frequency authorized
      auth_start_date: first date covered
      auth_end_date: last date covered
    account: wc_authorized_visits
    direction: in
    triggers:
      - event: wc:wc_auth_recorded
        map: {auth_reference: auth_reference, auth_end_date: auth_end_date}
  - type: wc_visit_billed
    target: wc_events
    meaning: An attended visit or program day under the referral is recorded against the authorization.
    grain: one row per date of service
    distinguish_by: [appointment_date]
    fields:
      event_date: date recorded
      appointment_date: date of service
      visits: authorized visits drawn (1, or 0 where none applies)
      units: billing units rendered that day
      auth_reference: authorization drawn on; empty where none
    account: wc_authorized_visits
    direction: out
    triggers:
      - event: wc:wc_charge_posted
        map: {appointment_date: appointment_date, units: units}
  - type: wc_charge_posted
    target: wc_events
    meaning: A charge for a date of service (evaluation, visit, program hours, FCE hours, or FCE no-show) is billed to the payer.
    grain: one row per charge per date of service
    distinguish_by: [charge_kind, appointment_date]
    fields:
      event_date: date posted
      appointment_date: date of service
      charge_kind: what is billed
      units: billing units
      amount: billed amount (positive)
      bill_submitted_date: date the bill was submitted to the payer
      payer_kind: who is billed
    account: wc_receivable
    direction: in
    triggers: []
  - type: wc_penalty_billed
    target: wc_events
    meaning: A late-payment penalty is billed to the carrier on a charge paid after the due period.
    grain: one row per penalized charge
    distinguish_by: [source_event_id]
    fields:
      event_date: date billed
      amount: penalty (positive)
      source_event_id: reference of the charge penalized
    account: wc_receivable
    direction: in
    triggers: []
  - type: wc_payment_posted
    target: wc_events
    meaning: A payment on a charge is received from the carrier, employer, health insurer or (for a denied claim) the worker.
    grain: one row per payment per charge
    distinguish_by: [source_event_id, payment_reference]
    fields:
      event_date: date received
      payer_kind: who paid
      payment_reference: EFT or check number exactly as on the remittance
      amount: amount paid (positive)
      source_event_id: reference of the charge paid
    account: wc_receivable
    direction: out
    triggers: []
  - type: wc_adjustment_posted
    target: wc_events
    meaning: A charge is reduced without payment (network discount, fee schedule reduction, untimely or unauthorized write-off, or rebilling of a denied claim to another payer).
    grain: one row per adjustment per charge
    distinguish_by: [adjustment_kind, source_event_id]
    fields:
      event_date: date adjusted
      adjustment_kind: why
      amount: amount removed (positive)
      source_event_id: reference of the charge adjusted
    account: wc_receivable
    direction: out
    triggers: []
  - type: wc_report_sent
    target: wc_events
    meaning: A report (initial evaluation, progress, work status, FCE or discharge) is sent to the adjuster or employer.
    grain: one row per report
    distinguish_by: [report_kind, event_date]
    fields:
      event_date: date sent
      report_kind: which report
    triggers: []
  - type: wc_missed_visit_reported
    target: wc_events
    meaning: A late cancellation or no-show by the worker is reported to the adjuster or employer.
    grain: one row per missed date of service
    distinguish_by: [appointment_date]
    fields:
      event_date: date reported
      appointment_date: date of the missed visit
      missed_kind: late cancellation or no-show
    triggers: []

measures:
  - id: wc_msr_claim_week_visits
    window: the Monday-to-Sunday week containing the date of service
    measure: count of wc_visit_billed rows across all of the worker's referrals with the same claim_number
  - id: wc_msr_consecutive_missed
    window: since the latest wc_visit_billed row on this referral (or since opening)
    measure: count of wc_missed_visit_reported rows on this referral
  - id: wc_msr_visits_total
    window: the whole life of the referral
    measure: count of wc_visit_billed rows on this referral

policies:
  - id: wc_agg_multi_holding
    subject: [wc_referral_opened]
    rule: >-
      A worker may hold any number of referrals over time, one per claim and program. A new referral is not opened when the worker already holds a referral that is not closed with the same claim number and the same program;
      a further program on the same claim (for example a Functional Capacity Evaluation during outpatient therapy, or
      Work Conditioning after it) is its own referral.
    eligibility:
      - id: no_duplicate_claim_program
        applies_to: [wc_referral_opened]
        kind: dedup
        condition: "A new referral is not opened when the worker already holds a referral that is not closed with the same claim number and the same program;"
        evidence_fields: [wc_cases.customer_id, wc_cases.claim_number, wc_cases.variant_name, wc_cases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_cases.claim_number, wc_cases.variant_name]
          action_bindings:
            wc_cases.claim_number: claim_number
            wc_cases.variant_name: variant_name
        dedup_contract:
          table: wc_cases
          mode: separate_record
          object_bindings: {customer_id: customer_id, claim_number: claim_number, variant_name: variant_name}
          duplicate_filters: {status: [referral_received, active, suspended, discharged]}
          distinct_fields: [opened_date]
    params:
      max_per_customer: null

  - id: wc_agg_claim_frequency
    subject: [wc_visit_billed]
    rule: >-
      All referrals under the same claim number share the adjuster's weekly frequency: the visits and program days
      billed in one Monday-to-Sunday week across those referrals (wc_msr_claim_week_visits) may not exceed the
      authorized_visits_per_week of the authorization in force, nor visits_per_week_max of the program. Only one
      referral under a claim bills a given date of service; a Functional Capacity Evaluation day replaces any therapy
      visit that day.
    eligibility: []
    measures: [wc_msr_claim_week_visits]

  - id: wc_referral_intake
    subject: [wc_referral_opened, wc_activated, wc_closed]
    rule: >-
      A referral is registered with the claim number, carrier, adjuster, employer and date of injury exactly as the
      carrier or employer gives them. Treatment starts only when the program's entry requirements are on file: the physician order where entry_requires_physician_order is true, the job description where entry_requires_job_description is true, a completed FCE where entry_requires_fce_baseline is true, and the incident report where employer_direct_requires_incident_report is true.
      Where return_to_work_goal_required is true the goal agreed with the employer is recorded at evaluation. Where
      adjuster_authorization_required is true, treatment beyond initial_visits_without_auth needs an authorization in
      force. A claim with compensability pending starts treatment only where treat_while_pending is true, and only for
      pending_claim_max_visits visits. A referral that never starts because the claim is denied, authorization is
      refused or the worker declines is closed.
    eligibility:
      - id: entry_requirements
        applies_to: [wc_activated]
        kind: authorization
        condition: "Treatment starts only when the program's entry requirements are on file: the physician order where entry_requires_physician_order is true, the job description where entry_requires_job_description is true, a completed FCE where entry_requires_fce_baseline is true, and the incident report where employer_direct_requires_incident_report is true."
        evidence_fields: [wc_cases.physician_order_date, wc_cases.job_description_on_file, wc_cases.fce_baseline_on_file, wc_cases.incident_report_on_file, wc_cases.wc_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_cases.wc_case_id]
          action_bindings:
            wc_cases.wc_case_id: wc_case_id

  - id: wc_compensability
    subject: [wc_compensability_updated]
    rule: >-
      Compensability follows the carrier's filed position: form_60_accepted, form_63_without_prejudice, form_61_denied
      or pending; employer direct programs carry not_applicable. A claim paid without prejudice is recorded as accepted no earlier than form_63_contest_days calendar days after the Form 63 date on file,
      and only when the carrier has not denied it by then. Days are counted as calendar days from the Form 63 date, the
      Form 63 date itself being day zero. A caller's statement that the claim was accepted never replaces the carrier's
      filed position.
    eligibility:
      - id: form_63_contest_elapsed
        applies_to: [wc_compensability_updated]
        kind: time
        condition: "A claim paid without prejudice is recorded as accepted no earlier than form_63_contest_days calendar days after the Form 63 date on file,"
        evidence_fields: [wc_cases.form_63_date, wc_cases.wc_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_cases.wc_case_id]
          action_bindings:
            wc_cases.wc_case_id: wc_case_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the Form 63 date on file
          anchor_source: wc_cases.form_63_date
          relation: not_before
          duration_source: variants.form_63_contest_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the Form 63 date, the Form 63 date itself being day zero."
          boundary: inclusive

  - id: wc_authorization
    subject: [wc_authorization_received, wc_auth_recorded, wc_visit_billed]
    rule: >-
      A visit or program day is recorded only while the referral is in referral_received or active status; only the
      initial evaluation is recorded in referral_received. Where adjuster_authorization_required is true, a date of service after the first initial_visits_without_auth visits is recorded against an authorization only when an adjuster authorization in force covers that date and still has visits remaining;
      a visit rendered without it draws nothing, is written off as unauthorized_visit_writeoff, and is never billed to
      the worker while unauthorized_visit_billable_to_worker is false. An extension is requested once remaining visits
      fall to auth_renewal_trigger_visits or fewer and no later than auth_extension_lead_days calendar days before the
      authorization end date, and a pending request is followed up after auth_followup_business_days business days. An
      employer direct program draws its visits from the employer contract up to direct_pay_visit_cap, after which the
      injury must be reported as a claim and treated under a new referral. Telehealth visits are recorded only where
      telehealth_allowed is true. The referral's authorization reference, end date and weekly frequency follow the
      newest authorization received.
    eligibility:
      - id: wc_billable_status
        applies_to: [wc_visit_billed]
        kind: state
        condition: "A visit or program day is recorded only while the referral is in referral_received or active status;"
        evidence_fields: [wc_cases.status, wc_cases.wc_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_cases.wc_case_id]
          action_bindings:
            wc_cases.wc_case_id: wc_case_id
        state_contract:
          field: wc_cases.status
          allowed: [referral_received, active]
      - id: adjuster_authorization_covers
        applies_to: [wc_visit_billed]
        kind: authorization
        condition: "Where adjuster_authorization_required is true, a date of service after the first initial_visits_without_auth visits is recorded against an authorization only when an adjuster authorization in force covers that date and still has visits remaining;"
        evidence_fields: [wc_events.auth_reference, wc_events.auth_start_date, wc_events.auth_end_date, wc_cases.authorized_visits_remaining]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_events.auth_reference]
          action_bindings:
            wc_events.auth_reference: auth_reference
    measures: [wc_msr_visits_total]

  - id: wc_evt_charges
    subject: [wc_charge_posted]
    rule: >-
      Charges follow fee_basis. The initial evaluation is billed at evaluation_rate where it is above 0.00; each later
      date of service is billed as unit_rate times the billing units, with units counted in billing_unit and capped at
      max_billable_units_per_day (and, for hour-billed programs, between program_hours_per_day_min and
      program_hours_per_day_max). A missed Functional Capacity Evaluation is billed to the carrier at fce_no_show_fee
      only where fce_no_show_billable_to_carrier is true. An accepted or without-prejudice claim is billed to the carrier, and a direct-pay program to the employer every employer_invoice_cycle_days calendar days;
      the worker is never billed for a compensable claim while patient_billing_prohibited_if_compensable is true. A bill
      is submitted no later than bill_submission_deadline_days calendar days after the date of service; a later bill is
      written off as untimely_bill_writeoff and is never billed to anyone while untimely_bill_payable is false.
    eligibility:
      - id: compensable_payer
        applies_to: [wc_charge_posted]
        kind: authorization
        condition: "An accepted or without-prejudice claim is billed to the carrier, and a direct-pay program to the employer every employer_invoice_cycle_days calendar days;"
        evidence_fields: [wc_cases.compensability_status, wc_cases.wc_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_cases.wc_case_id]
          action_bindings:
            wc_cases.wc_case_id: wc_case_id
    params:
      per_tier:
        Employer Direct Early Intervention: {unit_rate: "=unit_rate", evaluation_rate: "=evaluation_rate", max_billable_units_per_day: "=max_billable_units_per_day"}
        Workers' Comp Outpatient Therapy: {unit_rate: "=unit_rate", evaluation_rate: "=evaluation_rate", max_billable_units_per_day: "=max_billable_units_per_day"}
        Workers' Comp Post-Surgical Therapy: {unit_rate: "=unit_rate", evaluation_rate: "=evaluation_rate", max_billable_units_per_day: "=max_billable_units_per_day"}
        Work Conditioning Program: {unit_rate: "=unit_rate", evaluation_rate: "=evaluation_rate", max_billable_units_per_day: "=max_billable_units_per_day"}
        Work Hardening Program: {unit_rate: "=unit_rate", evaluation_rate: "=evaluation_rate", max_billable_units_per_day: "=max_billable_units_per_day"}
        Functional Capacity Evaluation: {unit_rate: "=unit_rate", evaluation_rate: "=evaluation_rate", max_billable_units_per_day: "=max_billable_units_per_day"}
    formula:
      billed_units: min(units, max_billable_units_per_day)
      amount: evaluation_rate if charge_kind == "evaluation" else (fce_no_show_fee if charge_kind == "fce_no_show" else unit_rate * billed_units)

  - id: wc_evt_payments_and_penalties
    subject: [wc_payment_posted, wc_adjustment_posted, wc_penalty_billed]
    rule: >-
      A payment is applied to the charge named on the remittance. At payment the carrier's network discount of
      network_discount_percent of the billed amount is posted as network_discount, and any further reduction to the fee
      schedule amount as fee_schedule_reduction; reconsideration of a reduction or denial may be requested within
      bill_reconsideration_days calendar days of the payment. A late-payment penalty is billed only when the carrier pays a charge later than carrier_payment_due_days calendar days after the bill submitted date on file;
      it equals late_payment_penalty_percent of the charge's billed amount less its network discount, rounded to the cent. Days are counted as
      calendar days from the bill submitted date, the bill submitted date itself being day zero. Unpaid bills are followed
      up receivable_followup_days calendar days after submission. When a claim is denied (form_61_denied) and
      denied_claim_bill_health_plan is true, its open charges are removed as denied_claim_rebilled and the treatment is
      rebilled to the worker's health insurance within health_plan_rebill_days calendar days; only after that insurer
      adjudicates may any balance be billed to the worker.
    eligibility:
      - id: payment_late
        applies_to: [wc_penalty_billed]
        kind: time
        condition: "A late-payment penalty is billed only when the carrier pays a charge later than carrier_payment_due_days calendar days after the bill submitted date on file;"
        evidence_fields: [wc_events.bill_submitted_date, wc_events.wc_event_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_events.wc_event_id]
          action_bindings:
            wc_events.wc_event_id: source_event_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the bill submitted date on file
          anchor_source: wc_events.bill_submitted_date
          relation: not_before
          duration_source: variants.carrier_payment_due_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the bill submitted date, the bill submitted date itself being day zero."
          boundary: exclusive
    formula:
      network_discount: round(amount * network_discount_percent / 100, 2)
      penalty: round((amount - round(amount * network_discount_percent / 100, 2)) * late_payment_penalty_percent / 100, 2)

  - id: wc_reporting
    subject: [wc_report_sent, wc_missed_visit_reported, wc_work_status_updated]
    rule: >-
      The initial evaluation report (or the FCE report) is sent within initial_report_due_business_days business days;
      progress reports go out at least every progress_report_interval_days calendar days while treatment continues;
      where work_status_report_each_visit is true a work status update follows every program day; and the discharge
      report is sent within discharge_report_days calendar days after discharge. Every report is copied to the nurse case
      manager where nurse_case_manager_copy is true. A late cancellation or no-show is reported within
      missed_visit_report_business_days business days, and no fee is charged to the worker while
      injured_worker_missed_fee_billable is false. The work status on file changes only on the treating physician's
      written restrictions, never on the worker's or employer's say-so.
    eligibility: []

  - id: wc_suspension_and_discharge
    subject: [wc_suspended, wc_reactivated, wc_discharged]
    rule: >-
      Treatment is suspended when the authorization lapses, when the claim is denied, when the pending-claim visit
      allowance is used, or when wc_msr_consecutive_missed reaches missed_visits_before_adjuster_review
      (non-compliance review). It resumes when the reason is resolved. A suspended referral is discharged no earlier than suspension_max_days calendar days after the suspension start date on file.
      Days are counted as calendar days from the suspension start date, the suspension start date itself being day
      zero. A program that reaches program_length_weeks_max weeks from its first date of service is discharged.
    eligibility:
      - id: suspension_aged
        applies_to: [wc_discharged]
        kind: time
        condition: "A suspended referral is discharged no earlier than suspension_max_days calendar days after the suspension start date on file."
        evidence_fields: [wc_cases.suspend_start_date, wc_cases.wc_case_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [wc_cases.wc_case_id]
          action_bindings:
            wc_cases.wc_case_id: wc_case_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the suspension start date on file
          anchor_source: wc_cases.suspend_start_date
          relation: not_before
          duration_source: variants.suspension_max_days
          unit: calendar_days
          counting_rule: "Days are counted as calendar days from the suspension start date, the suspension start date itself being day zero."
          boundary: inclusive
    measures: [wc_msr_consecutive_missed]

  - id: wc_employer_direct
    subject: [wc_referral_opened, wc_charge_posted, wc_payment_posted]
    rule: >-
      An employer direct program is opened only from the employer's incident report and under the employer's contract;
      it covers first-aid-level care only where osha_first_aid_only is true, never files a claim with a carrier, and is
      invoiced to the employer every employer_invoice_cycle_days calendar days with payment due carrier_payment_due_days
      calendar days after the invoice. Once the worker has used direct_pay_visit_cap visits (wc_msr_visits_total),
      or needs care beyond first aid, the employer must report the injury to its carrier and further care is a new
      Workers' Comp Outpatient Therapy referral.
    eligibility: []
    measures: [wc_msr_visits_total]

extended_policies:
  - id: wc_ext_program_day_hours
    base_policy_refs: [wc_agg_claim_frequency, wc_authorization, wc_evt_charges]
    overwrite:
      - base_policy: wc_evt_charges
        superseded_clause: >-
          each later date of service is billed as unit_rate times the billing units, with units counted in billing_unit
          and capped at max_billable_units_per_day (and, for hour-billed programs, between program_hours_per_day_min and
          program_hours_per_day_max).
        replaced_by: >-
          and the total is never below zero and never above the program's maximum daily program hours, a day that works out
          below the program's minimum daily program hours being recorded at the hours worked out, which are the hours
          delivered.
    trigger: state_due
    subject: [wc_visit_billed]
    computes: units
    target_tool: record_program_day_6fda50ae
    params:
      phase_one_days: 14
      phase_two_days: 28
      restart_window_days: 21
      setback_window_days: 42
      setback_days: 7
      makeup_two: 2
      makeup_one: 1
      retest_two: 2
      retest_one: 1
      long_gap_days: 8
      short_gap_days: 4
      long_gap_cut: 2
      short_gap_cut: 1
      modified_cut_late: 1
      modified_cut_early: 2
    rule: >-
      Every program day a worker attends in an hour-billed program (Work Conditioning or Work Hardening) is recorded on
      the referral against the adjuster authorization in force, drawing one authorized program day, while the referral is
      in referral_received or active status. The standard method records a program day at the program's maximum daily
      program hours, as whole hours. The recorded program hours of the day are worked out in this order: first the graded
      phase hours are fixed, then the make-up hours and the re-test hours are added to them, then the re-conditioning cut
      and the modified-duty shortening are taken off, and the total is never below zero and never above the program's
      maximum daily program hours, a day that works out below the program's minimum daily program hours being recorded
      at the hours worked out, which are the hours delivered. The graded phase hours follow the progression day count:
      while that count is under fourteen days the graded phase hours are the program's minimum daily program hours, from
      fourteen to twenty-seven days they are the midpoint of the program's minimum and maximum daily program hours,
      rounded down to a whole hour, and from twenty-eight days on they are the program's maximum daily program hours. The
      progression day count is the calendar days from the suspension start date on file where the referral's latest
      suspension began no more than twenty-one calendar days before the day of service, the calendar days since the
      initial evaluation less seven where that suspension began twenty-two to forty-two calendar days before, and the
      calendar days since the initial evaluation otherwise, the initial evaluation being the date of service of the
      referral's evaluation charge. Make-up hours added to the day are two where two or more missed program days with
      dates of service in the last month have been reported to the adjuster, one where exactly one has, and none
      otherwise. Re-test hours added to the day are two where at least twice the program's progress-report interval has
      passed since the latest progress report sent to the adjuster (or since the initial evaluation where none has been
      sent), one where at least one interval but less than two has passed, and none otherwise. The re-conditioning cut
      follows the calendar days since the worker's latest program day already recorded on the referral (or since the
      initial evaluation where none is recorded): two hours where eight or more days have passed, one hour where four to
      seven days have passed, and none otherwise. The modified-duty shortening is one hour where the worker's work status
      on file is modified duty and twenty-eight or more calendar days have passed since the initial evaluation, two hours
      where the work status on file is modified duty and fewer than twenty-eight days have passed, and none otherwise.
    prerequisite: []
    cross_category: []
    compute:
      - eval_date: "LATEST('wc_events','appointment_date', date_field='appointment_date', event_type='wc_charge_posted', charge_kind='evaluation')"
      - eval_days: "DAYS(eval_date, NOW)"
      - susp_start: "F('suspend_start_date')"
      - susp_days: "DAYS(susp_start, NOW) if susp_start else 9999"
      - prog_days: "susp_days if susp_days <= K('restart_window_days') else (eval_days - K('setback_days') if susp_days <= K('setback_window_days') else eval_days)"
      - phase_hours: "P('program_hours_per_day_min') if prog_days < K('phase_one_days') else ((P('program_hours_per_day_min') + P('program_hours_per_day_max')) // 2 if prog_days < K('phase_two_days') else P('program_hours_per_day_max'))"
      - missed_month: "COUNT('wc_events', within_months=1, date_field='appointment_date', event_type='wc_missed_visit_reported')"
      - makeup_hours: "K('makeup_two') if missed_month >= 2 else (K('makeup_one') if missed_month == 1 else 0)"
      - last_report: "LATEST('wc_events','event_date', event_type='wc_report_sent', report_kind='progress_report')"
      - report_days: "DAYS(last_report, NOW) if last_report else eval_days"
      - retest_hours: "K('retest_two') if report_days >= 2 * P('progress_report_interval_days') else (K('retest_one') if report_days >= P('progress_report_interval_days') else 0)"
      - last_day: "LATEST('wc_events','appointment_date', date_field='appointment_date', event_type='wc_visit_billed', visits=1)"
      - gap_days: "DAYS(last_day, NOW) if last_day else DAYS(eval_date, NOW)"
      - gap_cut: "K('long_gap_cut') if gap_days >= K('long_gap_days') else (K('short_gap_cut') if gap_days >= K('short_gap_days') else 0)"
      - modified_cut: "K('modified_cut_late') if (F('work_status') == 'modified_duty' and DAYS(eval_date, NOW) >= K('phase_two_days')) else (K('modified_cut_early') if (F('work_status') == 'modified_duty' and DAYS(eval_date, NOW) < K('phase_two_days')) else 0)"
      - result: "MN(P('program_hours_per_day_max'), MX(0, phase_hours + makeup_hours + retest_hours - gap_cut - modified_cut))"
    compute_basis:
      eval_date: "the initial evaluation being the date of service of the referral's evaluation charge"
      eval_days: "the calendar days since the initial evaluation otherwise"
      susp_days: "where the referral's latest suspension began no more than twenty-one calendar days before the day of service"
      prog_days: "The progression day count is the calendar days from the suspension start date on file where the referral's latest suspension began no more than twenty-one calendar days before the day of service, the calendar days since the initial evaluation less seven where that suspension began twenty-two to forty-two calendar days before, and the calendar days since the initial evaluation otherwise"
      phase_hours: "while that count is under fourteen days the graded phase hours are the program's minimum daily program hours, from fourteen to twenty-seven days they are the midpoint of the program's minimum and maximum daily program hours, rounded down to a whole hour, and from twenty-eight days on they are the program's maximum daily program hours"
      missed_month: "two or more missed program days with dates of service in the last month have been reported to the adjuster"
      makeup_hours: "Make-up hours added to the day are two where two or more missed program days with dates of service in the last month have been reported to the adjuster, one where exactly one has, and none otherwise."
      last_report: "since the latest progress report sent to the adjuster (or since the initial evaluation where none has been sent)"
      retest_hours: "Re-test hours added to the day are two where at least twice the program's progress-report interval has passed since the latest progress report sent to the adjuster (or since the initial evaluation where none has been sent), one where at least one interval but less than two has passed, and none otherwise."
      last_day: "the worker's latest program day already recorded on the referral (or since the initial evaluation where none is recorded)"
      gap_days: "The re-conditioning cut follows the calendar days since the worker's latest program day already recorded on the referral (or since the initial evaluation where none is recorded)"
      gap_cut: "two hours where eight or more days have passed, one hour where four to seven days have passed, and none otherwise."
      modified_cut: "The modified-duty shortening is one hour where the worker's work status on file is modified duty and twenty-eight or more calendar days have passed since the initial evaluation, two hours where the work status on file is modified duty and fewer than twenty-eight days have passed, and none otherwise."
      result: "first the graded phase hours are fixed, then the make-up hours and the re-test hours are added to them, then the re-conditioning cut and the modified-duty shortening are taken off, and the total is never below zero and never above the program's maximum daily program hours"
    factors:
      - id: progression_clock
        effect: method
        decides: prog_days
        bindings: [susp_start, susp_days, prog_days]
        ladder:
          - when: "the referral's latest suspension began no more than twenty-one calendar days before the day of service"
            method: "the progression day count is the calendar days from the suspension start date on file"
          - when: "the referral's latest suspension began twenty-two to forty-two calendar days before the day of service"
            method: "the progression day count is the calendar days since the initial evaluation less seven"
          - when: "otherwise"
            method: "the progression day count is the calendar days since the initial evaluation"
        baseline:
          prog_days: "eval_days"
        evidence: [date]
        cross_difficulty: null
      - id: graded_phase
        effect: parameter
        decides: phase_hours
        bindings: [eval_date, eval_days, phase_hours]
        ladder:
          - when: "progression day count under fourteen days"
            value: "P('program_hours_per_day_min')"
          - when: "progression day count from fourteen to twenty-seven days"
            value: "(P('program_hours_per_day_min') + P('program_hours_per_day_max')) // 2"
          - when: "otherwise (twenty-eight days or more)"
            value: "P('program_hours_per_day_max')"
        baseline:
          phase_hours: "P('program_hours_per_day_max')"
        evidence: [date, history, tier_param]
        cross_difficulty: null
      - id: makeup_hours
        effect: parameter
        decides: makeup_hours
        bindings: [missed_month, makeup_hours]
        ladder:
          - when: "two or more missed program days with dates of service in the last month reported to the adjuster"
            value: "K('makeup_two')"
          - when: "exactly one missed program day with a date of service in the last month reported to the adjuster"
            value: "K('makeup_one')"
          - when: "otherwise"
            value: "0"
        baseline:
          makeup_hours: "0"
        evidence: [history]
        cross_difficulty: null
      - id: retest_hours
        effect: parameter
        decides: retest_hours
        bindings: [last_report, report_days, retest_hours]
        ladder:
          - when: "at least twice the progress-report interval since the latest progress report (or the initial evaluation where none was sent)"
            value: "K('retest_two')"
          - when: "at least one but less than two progress-report intervals since the latest progress report"
            value: "K('retest_one')"
          - when: "otherwise"
            value: "0"
        baseline:
          retest_hours: "0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: reconditioning_cut
        effect: parameter
        decides: gap_cut
        bindings: [last_day, gap_days, gap_cut]
        ladder:
          - when: "eight or more calendar days since the worker's latest program day already recorded on the referral"
            value: "K('long_gap_cut')"
          - when: "four to seven calendar days since that program day"
            value: "K('short_gap_cut')"
          - when: "otherwise (fewer than four days)"
            value: "0"
        baseline:
          gap_cut: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: modified_duty_shortening
        effect: parameter
        decides: modified_cut
        bindings: [modified_cut]
        ladder:
          - when: "work status on file is modified duty AND twenty-eight or more calendar days since the initial evaluation"
            value: "K('modified_cut_late')"
          - when: "work status on file is modified duty AND fewer than twenty-eight calendar days since the initial evaluation"
            value: "K('modified_cut_early')"
          - when: "otherwise"
            value: "0"
        baseline:
          modified_cut: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard method records a program day at the program's maximum daily program hours, as whole hours.
      params: [program_hours_per_day_max]
    inputs:
      history:
        - {table: wc_events, aggregate: latest, field: appointment_date, filters: {event_type: wc_charge_posted, charge_kind: evaluation}}
        - {table: wc_events, aggregate: count, field: wc_event_id, within_months: 1, filters: {event_type: wc_missed_visit_reported}}
        - {table: wc_events, aggregate: latest, field: event_date, filters: {event_type: wc_report_sent, report_kind: progress_report}}
        - {table: wc_events, aggregate: latest, field: appointment_date, filters: {event_type: wc_visit_billed, visits: 1}}
      cross_category: []
  - id: wc_ext_program_day_charge
    base_policy_refs: [wc_evt_charges, wc_employer_direct]
    overwrite:
      - base_policy: wc_evt_charges
        superseded_clause: >-
          each later date of service is billed as unit_rate times the billing units, with units counted in billing_unit
          and capped at max_billable_units_per_day (and, for hour-billed programs, between program_hours_per_day_min and
          program_hours_per_day_max).
        replaced_by: >-
          A program day of an hour-billed program is billed on the program hours recorded for that date of service, split
          into re-test hours and conditioning hours, and its billed amount is the conditioning amount plus the re-test
          hours times the re-test hourly rate, rounded half up to the cent once, on the final amount.
    trigger: state_due
    subject: [wc_charge_posted]
    computes: amount
    target_tool: post_program_day_charge_5325d445
    params:
      test_hours_two: 2
      test_hours_one: 1
      rebaseline_days: 42
      interim_days: 21
      test_rate_rebaseline: 115.00
      test_rate_interim: 96.00
      individual_hour_rate: 72.00
      extended_block_hour_rate: 68.00
      full_day_hours: 6
      half_day_hours: 3
      two_hour_block_fee: 140.00
      half_day_ceiling: 300.00
    rule: >-
      Each recorded program day of an hour-billed program (Work Conditioning or Work Hardening) is billed to the carrier
      of an accepted or without-prejudice claim on its date of service, submitted that day and so within the program's
      bill submission deadline. A
      program day's charge is fixed only after the referral carries the recorded program day for that date of service,
      with its program hours. The standard method bills a program day at the program's hourly unit rate for each program
      hour recorded for the day. A program day of an hour-billed program is billed on the program hours recorded for
      that date of service, split into re-test hours and conditioning hours, and its billed amount is the conditioning
      amount plus the re-test hours times the re-test hourly rate, rounded half up to the cent once, on the final amount.
      The billed re-test hours are two where at least twice the program's progress-report interval has passed
      since the latest progress report sent to the adjuster (or since the evaluation date of service where none has been
      sent), one where at least one interval but less than two has passed, and none otherwise, and never more than the
      program hours recorded for the day; the conditioning hours are the recorded program hours less the re-test hours.
      The re-test hourly rate is one hundred fifteen dollars where forty-two or more calendar days have passed since the
      latest functional capacity re-test report sent on the referral, ninety-six dollars where twenty-one to forty-one
      days have passed, and the program's hourly unit rate where fewer than twenty-one days have passed or no such report
      has been sent. The conditioning hourly rate is seventy-two dollars where the appointment series funded by the
      referral is a Specialty One-on-One Visit Series, sixty-eight dollars where it is an Extended 60-Minute Visit Series,
      and the program's hourly unit rate for any other series format. The conditioning amount is priced by the length of
      the conditioning day: six or more conditioning hours are billed as the two-hour initial block at a flat one hundred
      forty dollars plus every further conditioning hour at the conditioning hourly rate; three to five conditioning hours
      are billed at the conditioning hourly rate for every hour, the day's conditioning amount being capped at three
      hundred dollars; fewer than three conditioning hours are billed at the conditioning hourly rate for every hour with
      no cap.
    prerequisite:
      - problem: wc_ext_program_day_hours
        kind: value_input
        gate: day_hours
        form: state
        policy_source: >-
          A program day's charge is fixed only after the referral carries the recorded program day for that date of
          service, with its program hours.
        condition: >-
          The referral's history holds a recorded program-day entry for the date of service being billed, carrying the
          program hours of that day.
        resolved_by: record_program_day_6fda50ae
        effect: >-
          Once the program day is recorded, the latest recorded program hours on the referral are that day's hours, and
          the charge's day_hours binding (and with it the re-test and conditioning split and the amount) takes that value.
    cross_category:
      - category: series
        as: branch
        reads: [variant_name]
        note: The conditioning hourly rate factor reads the format of the appointment series funded by the referral.
    compute:
      - day_hours: "SUM('wc_events','units', event_type='wc_visit_billed', appointment_date=NOW)"
      - eval_date: "LATEST('wc_events','appointment_date', date_field='appointment_date', event_type='wc_charge_posted', charge_kind='evaluation')"
      - last_report: "LATEST('wc_events','event_date', event_type='wc_report_sent', report_kind='progress_report')"
      - report_days: "DAYS(last_report, NOW) if last_report else DAYS(eval_date, NOW)"
      - test_hours: "MN(int(day_hours), K('test_hours_two') if report_days >= 2 * P('progress_report_interval_days') else (K('test_hours_one') if report_days >= P('progress_report_interval_days') else 0))"
      - last_retest: "LATEST('wc_events','event_date', event_type='wc_report_sent', report_kind='fce_report')"
      - retest_age: "DAYS(last_retest, NOW) if last_retest else 0"
      - test_rate: "K('test_rate_rebaseline') if retest_age >= K('rebaseline_days') else (K('test_rate_interim') if retest_age >= K('interim_days') else P('unit_rate'))"
      - series_format: "CFIELD('series','variant_name', wc_case_id=HID)"
      - hour_rate: "K('individual_hour_rate') if series_format == 'Specialty One-on-One Visit Series' else (K('extended_block_hour_rate') if series_format == 'Extended 60-Minute Visit Series' else P('unit_rate'))"
      - cond_hours: "int(day_hours) - test_hours"
      - cond_amount: "K('two_hour_block_fee') + (cond_hours - 2) * hour_rate if cond_hours >= K('full_day_hours') else (MN(K('half_day_ceiling'), cond_hours * hour_rate) if cond_hours >= K('half_day_hours') else cond_hours * hour_rate)"
      - result: "RND(cond_amount + test_hours * test_rate, 2)"
    compute_basis:
      day_hours: "billed to the carrier of an accepted or without-prejudice claim on its date of service, submitted that day and so within the program's bill submission deadline. A program day of an hour-billed program is billed on the program hours recorded for that date of service"
      eval_date: "or since the evaluation date of service where none has been sent"
      report_days: "since the latest progress report sent to the adjuster (or since the evaluation date of service where none has been sent)"
      test_hours: "The billed re-test hours are two where at least twice the program's progress-report interval has passed since the latest progress report sent to the adjuster (or since the evaluation date of service where none has been sent), one where at least one interval but less than two has passed, and none otherwise, and never more than the program hours recorded for the day"
      retest_age: "since the latest functional capacity re-test report sent on the referral"
      test_rate: "The re-test hourly rate is one hundred fifteen dollars where forty-two or more calendar days have passed since the latest functional capacity re-test report sent on the referral, ninety-six dollars where twenty-one to forty-one days have passed, and the program's hourly unit rate where fewer than twenty-one days have passed or no such report has been sent."
      series_format: "where the appointment series funded by the referral is a Specialty One-on-One Visit Series"
      hour_rate: "The conditioning hourly rate is seventy-two dollars where the appointment series funded by the referral is a Specialty One-on-One Visit Series, sixty-eight dollars where it is an Extended 60-Minute Visit Series, and the program's hourly unit rate for any other series format."
      cond_hours: "the conditioning hours are the recorded program hours less the re-test hours."
      cond_amount: "six or more conditioning hours are billed as the two-hour initial block at a flat one hundred forty dollars plus every further conditioning hour at the conditioning hourly rate; three to five conditioning hours are billed at the conditioning hourly rate for every hour, the day's conditioning amount being capped at three hundred dollars; fewer than three conditioning hours are billed at the conditioning hourly rate for every hour with no cap."
      result: "its billed amount is the conditioning amount plus the re-test hours times the re-test hourly rate, rounded half up to the cent once, on the final amount."
    factors:
      - id: retest_split
        effect: parameter
        decides: test_hours
        bindings: [last_report, report_days, test_hours]
        ladder:
          - when: "at least twice the progress-report interval since the latest progress report (or the evaluation where none was sent)"
            value: "K('test_hours_two')"
          - when: "at least one but less than two progress-report intervals since the latest progress report"
            value: "K('test_hours_one')"
          - when: "otherwise"
            value: "0"
        baseline:
          test_hours: "0"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: retest_rate
        effect: parameter
        decides: test_rate
        bindings: [last_retest, retest_age, test_rate]
        ladder:
          - when: "forty-two or more calendar days since the latest functional capacity re-test report on the referral"
            value: "K('test_rate_rebaseline')"
          - when: "twenty-one to forty-one calendar days since that report"
            value: "K('test_rate_interim')"
          - when: "otherwise (fewer than twenty-one days, or no such report)"
            value: "P('unit_rate')"
        baseline:
          test_rate: "P('unit_rate')"
        evidence: [history, date, tier_param]
        cross_difficulty: null
      - id: conditioning_rate
        effect: parameter
        decides: hour_rate
        bindings: [series_format, hour_rate]
        ladder:
          - when: "the appointment series funded by the referral is a Specialty One-on-One Visit Series"
            value: "K('individual_hour_rate')"
          - when: "the appointment series funded by the referral is an Extended 60-Minute Visit Series"
            value: "K('extended_block_hour_rate')"
          - when: "otherwise"
            value: "P('unit_rate')"
        baseline:
          hour_rate: "P('unit_rate')"
        evidence: [cross_category, tier_param]
        cross_difficulty: series
      - id: day_length_pricing
        effect: method
        decides: cond_amount
        bindings: [day_hours, cond_amount]
        ladder:
          - when: "six or more conditioning hours"
            method: "the two-hour initial block at the flat block fee plus every further conditioning hour at the conditioning hourly rate"
          - when: "three to five conditioning hours"
            method: "every hour at the conditioning hourly rate, the conditioning amount capped at the half-day ceiling"
          - when: "otherwise (fewer than three conditioning hours)"
            method: "every hour at the conditioning hourly rate with no cap"
        baseline:
          cond_amount: "cond_hours * hour_rate"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard method bills a program day at the program's hourly unit rate for each program hour recorded for the
        day.
      params: [unit_rate]
    inputs:
      history:
        - {table: wc_events, aggregate: sum, field: units, filters: {event_type: wc_visit_billed, appointment_date: the date of service}}
        - {table: wc_events, aggregate: latest, field: event_date, filters: {event_type: wc_report_sent, report_kind: progress_report}}
        - {table: wc_events, aggregate: latest, field: event_date, filters: {event_type: wc_report_sent, report_kind: fce_report}}
      cross_category: [series]
  - id: wc_ext_program_extension_days
    base_policy_refs: [wc_authorization]
    overwrite: []
    trigger: on_request
    subject: [wc_authorization_received, wc_auth_recorded]
    computes: visits
    target_tool: record_program_extension_8df51c57
    params:
      frequency_two: 2
      frequency_three: 3
      standard_block_weeks: 2
      final_block_weeks: 1
      compliant_block_weeks: 3
      status_update_recent_days: 7
      transition_recent: 2
      transition_older: 1
      retest_with_baseline: 1
      retest_without_baseline: 2
      reentry_recent_days: 14
      reentry_window_days: 30
      reentry_recent: 2
      reentry_older: 1
    rule: >-
      An adjuster extending an hour-billed program (Work Conditioning or Work Hardening) records the extension in person
      on the referral with the adjuster's own authorization reference and the first and last dates it covers, authorizing
      the requested program days at the requested weekly frequency; the referral's authorization reference, end date and
      weekly frequency then follow that extension. An extension is not recorded until the referral carries a
      program-hours charge for every program day the worker attended in the appointment series funded by the referral.
      The standard method requests the program's maximum program days per week for a two-week
      request window, less every authorized program day still unused on the referral. The requested program days are
      worked out in this order: first the requested weekly frequency is multiplied by the request window in whole weeks,
      then the transition days and the discharge re-test days are added, then the netted unused days and the re-entry
      reduction are taken off, and the total is never below zero. The requested weekly frequency is two program days
      where two or more appointments in the funded appointment series with dates in the last month were no-shows and two
      or more missed program days with dates of service in the last month have been reported to the adjuster, three
      program days where exactly one such appointment was a no-show and at least one such missed program day has been
      reported, and the program's maximum program days per week otherwise. The request window is one week (the final block) where
      fewer than two whole weeks remain before the program's maximum length, counted from the initial evaluation; three
      weeks where two or more whole weeks remain, no missed program day with a date of service in the last month has been
      reported to the adjuster and the latest progress report was sent to the adjuster no more than one progress-report
      interval before the request; and two weeks otherwise. The netted unused
      days are the lesser of the authorized program days still unused and the calendar days left before the end date of
      the authorization in force where that end date falls zero to the program's extension lead days after the day of
      the request, none where that end date has already passed, and every authorized program day still unused
      otherwise. The transition days are two where the worker's work status on file is modified duty and the latest work
      status update was sent to the adjuster no more than seven calendar days before the request, one where the work
      status on file is modified duty and that update is older, and none otherwise. The discharge re-test days are one
      where the whole weeks remaining before the program's maximum length do not exceed the request window and a
      completed functional capacity evaluation is on file, two where they do not exceed the request window and no
      completed functional capacity evaluation is on file, and none otherwise. The re-entry reduction is two days where
      the referral's latest suspension began no more than fourteen calendar days before the request, one day where it
      began fifteen to thirty calendar days before, and none otherwise.
    prerequisite:
      - problem: wc_ext_program_day_charge
        kind: state_gate
        gate: wc_events.charge_kind
        form: state
        policy_source: >-
          An extension is not recorded until the referral carries a program-hours charge for every program day the worker
          attended in the appointment series funded by the referral.
        condition: >-
          Every attended appointment in the appointment series funded by the referral has a program-hours charge on the
          referral with the same date of service.
        resolved_by: post_program_day_charge_5325d445
        effect: >-
          Once the program-hours charge for the latest attended program day is posted, every attended program day carries
          its charge and the extension may be recorded.
    cross_category:
      - category: series
        as: history
        reads: [series_events.event_type, series_events.appointment_date]
        note: The requested weekly frequency factor counts the no-shows in the appointment series funded by the referral in the last month.
    compute:
      - series_no_shows: "XCOUNT('series','series_events', within_months=1, date_field='appointment_date', event_type='series_no_show')"
      - missed_reported: "COUNT('wc_events', within_months=1, date_field='appointment_date', event_type='wc_missed_visit_reported')"
      - week_days: "K('frequency_two') if (series_no_shows >= 2 and missed_reported >= 2) else (K('frequency_three') if (series_no_shows == 1 and missed_reported >= 1) else P('visits_per_week_max'))"
      - eval_date: "LATEST('wc_events','appointment_date', date_field='appointment_date', event_type='wc_charge_posted', charge_kind='evaluation')"
      - weeks_left: "(P('program_length_weeks_max') * 7 - DAYS(eval_date, NOW)) // 7"
      - last_report: "LATEST('wc_events','event_date', event_type='wc_report_sent', report_kind='progress_report')"
      - report_days: "DAYS(last_report, NOW) if last_report else DAYS(eval_date, NOW)"
      - window_weeks: "K('final_block_weeks') if weeks_left < K('standard_block_weeks') else (K('compliant_block_weeks') if (weeks_left >= K('standard_block_weeks') and missed_reported == 0 and report_days <= P('progress_report_interval_days')) else K('standard_block_weeks'))"
      - auth_end: "F('auth_end_date')"
      - days_to_end: "DAYS(NOW, auth_end) if auth_end else -1"
      - netted: "MN(int(F('authorized_visits_remaining')), days_to_end) if (days_to_end >= 0 and days_to_end <= P('auth_extension_lead_days')) else (0 if days_to_end < 0 else int(F('authorized_visits_remaining')))"
      - status_update: "LATEST('wc_events','event_date', event_type='wc_report_sent', report_kind='work_status_update')"
      - update_days: "DAYS(status_update, NOW) if status_update else 9999"
      - transition_days: "K('transition_recent') if (F('work_status') == 'modified_duty' and update_days <= K('status_update_recent_days')) else (K('transition_older') if (F('work_status') == 'modified_duty' and update_days > K('status_update_recent_days')) else 0)"
      - discharge_days: "K('retest_with_baseline') if ((P('program_length_weeks_max') * 7 - DAYS(eval_date, NOW)) // 7 <= window_weeks and F('fce_baseline_on_file') == True) else (K('retest_without_baseline') if ((P('program_length_weeks_max') * 7 - DAYS(eval_date, NOW)) // 7 <= window_weeks and F('fce_baseline_on_file') != True) else 0)"
      - susp_start: "F('suspend_start_date')"
      - susp_days: "DAYS(susp_start, NOW) if susp_start else 9999"
      - reentry_days: "K('reentry_recent') if susp_days <= K('reentry_recent_days') else (K('reentry_older') if susp_days <= K('reentry_window_days') else 0)"
      - result: "MX(0, week_days * window_weeks + transition_days + discharge_days - netted - reentry_days)"
    compute_basis:
      series_no_shows: "two or more appointments in the funded appointment series with dates in the last month were no-shows"
      missed_reported: "two or more missed program days with dates of service in the last month have been reported to the adjuster"
      week_days: "The requested weekly frequency is two program days where two or more appointments in the funded appointment series with dates in the last month were no-shows and two or more missed program days with dates of service in the last month have been reported to the adjuster, three program days where exactly one such appointment was a no-show and at least one such missed program day has been reported, and the program's maximum program days per week otherwise."
      eval_date: "before the program's maximum length, counted from the initial evaluation"
      weeks_left: "fewer than two whole weeks remain before the program's maximum length, counted from the initial evaluation"
      report_days: "the latest progress report was sent to the adjuster no more than one progress-report interval before the request"
      window_weeks: "The request window is one week (the final block) where fewer than two whole weeks remain before the program's maximum length, counted from the initial evaluation; three weeks where two or more whole weeks remain, no missed program day with a date of service in the last month has been reported to the adjuster and the latest progress report was sent to the adjuster no more than one progress-report interval before the request; and two weeks otherwise."
      days_to_end: "the calendar days left before the end date of the authorization in force"
      netted: "The netted unused days are the lesser of the authorized program days still unused and the calendar days left before the end date of the authorization in force where that end date falls zero to the program's extension lead days after the day of the request, none where that end date has already passed, and every authorized program day still unused otherwise."
      update_days: "the latest work status update was sent to the adjuster no more than seven calendar days before the request"
      transition_days: "The transition days are two where the worker's work status on file is modified duty and the latest work status update was sent to the adjuster no more than seven calendar days before the request, one where the work status on file is modified duty and that update is older, and none otherwise."
      discharge_days: "The discharge re-test days are one where the whole weeks remaining before the program's maximum length do not exceed the request window and a completed functional capacity evaluation is on file, two where they do not exceed the request window and no completed functional capacity evaluation is on file, and none otherwise."
      susp_days: "where the referral's latest suspension began no more than fourteen calendar days before the request"
      reentry_days: "The re-entry reduction is two days where the referral's latest suspension began no more than fourteen calendar days before the request, one day where it began fifteen to thirty calendar days before, and none otherwise."
      result: "first the requested weekly frequency is multiplied by the request window in whole weeks, then the transition days and the discharge re-test days are added, then the netted unused days and the re-entry reduction are taken off, and the total is never below zero"
    factors:
      - id: requested_frequency
        effect: parameter
        decides: week_days
        bindings: [series_no_shows, missed_reported, week_days]
        ladder:
          - when: "two or more no-shows in the funded appointment series in the last month AND two or more missed program days in the last month reported to the adjuster"
            value: "K('frequency_two')"
          - when: "exactly one no-show in the funded appointment series in the last month AND at least one missed program day in the last month reported to the adjuster"
            value: "K('frequency_three')"
          - when: "otherwise"
            value: "P('visits_per_week_max')"
        baseline:
          week_days: "P('visits_per_week_max')"
        evidence: [cross_category, history]
        cross_difficulty: series
      - id: request_window
        effect: parameter
        decides: window_weeks
        bindings: [eval_date, weeks_left, last_report, report_days, window_weeks]
        ladder:
          - when: "fewer than two whole weeks remain before the program's maximum length"
            value: "K('final_block_weeks')"
          - when: "two or more whole weeks remain AND no missed program day in the last month reported AND the latest progress report no older than one interval"
            value: "K('compliant_block_weeks')"
          - when: "otherwise"
            value: "K('standard_block_weeks')"
        baseline:
          window_weeks: "K('standard_block_weeks')"
        evidence: [date, history, tier_param]
        cross_difficulty: null
      - id: unused_day_netting
        effect: method
        decides: netted
        bindings: [auth_end, days_to_end, netted]
        ladder:
          - when: "the authorization in force ends zero to the program's extension lead days after the request"
            method: "net the lesser of the unused authorized days and the calendar days left before its end date"
          - when: "the authorization in force has already ended"
            method: "net nothing"
          - when: "otherwise"
            method: "net every unused authorized program day"
        baseline:
          netted: "int(F('authorized_visits_remaining'))"
        evidence: [date, history]
        cross_difficulty: null
      - id: transition_days
        effect: parameter
        decides: transition_days
        bindings: [status_update, update_days, transition_days]
        ladder:
          - when: "work status on file is modified duty AND the latest work status update sent no more than seven calendar days before the request"
            value: "K('transition_recent')"
          - when: "work status on file is modified duty AND the latest work status update is older"
            value: "K('transition_older')"
          - when: "otherwise"
            value: "0"
        baseline:
          transition_days: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: discharge_retest_days
        effect: parameter
        decides: discharge_days
        bindings: [discharge_days]
        ladder:
          - when: "the whole weeks remaining do not exceed the request window AND a completed functional capacity evaluation is on file"
            value: "K('retest_with_baseline')"
          - when: "the whole weeks remaining do not exceed the request window AND no completed functional capacity evaluation is on file"
            value: "K('retest_without_baseline')"
          - when: "otherwise"
            value: "0"
        baseline:
          discharge_days: "0"
        evidence: [date]
        cross_difficulty: null
      - id: reentry_reduction
        effect: parameter
        decides: reentry_days
        bindings: [susp_start, susp_days, reentry_days]
        ladder:
          - when: "the referral's latest suspension began no more than fourteen calendar days before the request"
            value: "K('reentry_recent')"
          - when: "the referral's latest suspension began fifteen to thirty calendar days before the request"
            value: "K('reentry_older')"
          - when: "otherwise"
            value: "0"
        baseline:
          reentry_days: "0"
        evidence: [date]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard method requests the program's maximum program days per week for a two-week request window, less every
        authorized program day still unused on the referral.
      params: [visits_per_week_max, standard_block_weeks]
    inputs:
      history:
        - {category: series, table: series_events, aggregate: count, field: series_event_id, within_months: 1, filters: {event_type: series_no_show}}
        - {table: wc_events, aggregate: count, field: wc_event_id, within_months: 1, filters: {event_type: wc_missed_visit_reported}}
        - {table: wc_events, aggregate: latest, field: event_date, filters: {event_type: wc_report_sent, report_kind: progress_report}}
        - {table: wc_events, aggregate: latest, field: event_date, filters: {event_type: wc_report_sent, report_kind: work_status_update}}
      cross_category: [series]
  - id: wc_ext_fce_authorization_hours
    base_policy_refs: [wc_authorization]
    overwrite: []
    trigger: on_request
    subject: [wc_authorization_received, wc_auth_recorded]
    computes: hours
    target_tool: record_fce_authorization_83d13911
    params:
      long_absence_days: 120
      recent_attempt_days: 7
      stale_attempt_days: 30
      order_rescreen_long_days: 120
      order_rescreen_short_days: 90
      rescreen_two: 2
      rescreen_one: 1
      core_only_two: 2
      core_only_one: 1
      two_day_sessions: 2
      one_day_sessions: 1
    rule: >-
      An adjuster authorizing a Functional Capacity Evaluation records the authorization in person on the referral with
      the adjuster's own authorization reference and the first and last dates it covers, authorizing the requested
      evaluation hours and evaluation sessions; the referral's authorization reference, end date and sessions per week
      then follow that authorization. The standard method requests a one-day evaluation of the program's maximum daily
      billable hours in one session. The requested evaluation hours are worked out in this order: first the protocol
      hours are fixed, then the order re-screen hours are added, then the partial-attempt credit and the core-only
      reduction are taken off, and the total is never below zero. The protocol hours are the program's maximum daily
      billable hours plus half of them, rounded down (a two-day protocol), where the worker's work status on file is off
      work and more than one hundred twenty calendar days have passed since the date of injury; the program's maximum
      daily billable hours less one (a job-matched protocol) where the work status on file is modified duty and more
      than one hundred twenty calendar days have passed since the date of injury; and the program's maximum daily billable
      hours (a one-day protocol) otherwise. The requested evaluation sessions are two for a two-day protocol and one for
      any other protocol, and the authorization is recorded with them. The partial-attempt credit takes off the
      evaluation hours already recorded on the referral, hour for hour, where the latest recorded evaluation day is no
      more than seven calendar days before the request; half of those hours, rounded down, where it is eight to thirty
      days before; and nothing otherwise, the results of an older attempt being retested in full. The order re-screen
      hours are two where the treating physician's order on file is more than one hundred twenty calendar days old, one
      where it is ninety-one to one hundred twenty days old, and none otherwise. The core-only reduction is two hours
      where two or more missed evaluation appointments with dates in the last month have been reported to the adjuster,
      one hour where exactly one has, and none otherwise.
    prerequisite: []
    cross_category: []
    compute:
      - injury_days: "DAYS(F('date_of_injury'), NOW)"
      - protocol_hours: "P('max_billable_units_per_day') + P('max_billable_units_per_day') // 2 if (F('work_status') == 'off_work' and injury_days > K('long_absence_days')) else (P('max_billable_units_per_day') - 1 if (F('work_status') == 'modified_duty' and injury_days > K('long_absence_days')) else P('max_billable_units_per_day'))"
      - protocol_sessions: "K('two_day_sessions') if protocol_hours > P('max_billable_units_per_day') else K('one_day_sessions')"
      - hours_done: "SUM('wc_events','units', event_type='wc_visit_billed')"
      - last_attempt: "LATEST('wc_events','appointment_date', date_field='appointment_date', event_type='wc_visit_billed')"
      - attempt_age: "DAYS(last_attempt, NOW) if last_attempt else 9999"
      - credit_hours: "int(hours_done) if attempt_age <= K('recent_attempt_days') else (int(hours_done) // 2 if attempt_age <= K('stale_attempt_days') else 0)"
      - order_days: "DAYS(F('physician_order_date'), NOW) if F('physician_order_date') else 0"
      - rescreen_hours: "K('rescreen_two') if order_days > K('order_rescreen_long_days') else (K('rescreen_one') if order_days > K('order_rescreen_short_days') else 0)"
      - missed_month: "COUNT('wc_events', within_months=1, date_field='appointment_date', event_type='wc_missed_visit_reported')"
      - core_only_hours: "K('core_only_two') if missed_month >= 2 else (K('core_only_one') if missed_month == 1 else 0)"
      - result: "MX(0, protocol_hours + rescreen_hours - credit_hours - core_only_hours)"
    compute_basis:
      injury_days: "more than one hundred twenty calendar days have passed since the date of injury"
      protocol_hours: "The protocol hours are the program's maximum daily billable hours plus half of them, rounded down (a two-day protocol), where the worker's work status on file is off work and more than one hundred twenty calendar days have passed since the date of injury; the program's maximum daily billable hours less one (a job-matched protocol) where the work status on file is modified duty and more than one hundred twenty calendar days have passed since the date of injury; and the program's maximum daily billable hours (a one-day protocol) otherwise."
      protocol_sessions: "The requested evaluation sessions are two for a two-day protocol and one for any other protocol, and the authorization is recorded with them."
      hours_done: "takes off the evaluation hours already recorded on the referral"
      last_attempt: "where the latest recorded evaluation day is no more than seven calendar days before the request"
      attempt_age: "where the latest recorded evaluation day is no more than seven calendar days before the request"
      credit_hours: "The partial-attempt credit takes off the evaluation hours already recorded on the referral, hour for hour, where the latest recorded evaluation day is no more than seven calendar days before the request; half of those hours, rounded down, where it is eight to thirty days before; and nothing otherwise, the results of an older attempt being retested in full."
      order_days: "where the treating physician's order on file is more than one hundred twenty calendar days old"
      rescreen_hours: "The order re-screen hours are two where the treating physician's order on file is more than one hundred twenty calendar days old, one where it is ninety-one to one hundred twenty days old, and none otherwise."
      missed_month: "two or more missed evaluation appointments with dates in the last month have been reported to the adjuster"
      core_only_hours: "The core-only reduction is two hours where two or more missed evaluation appointments with dates in the last month have been reported to the adjuster, one hour where exactly one has, and none otherwise."
      result: "first the protocol hours are fixed, then the order re-screen hours are added, then the partial-attempt credit and the core-only reduction are taken off, and the total is never below zero"
    factors:
      - id: evaluation_protocol
        effect: parameter
        decides: protocol_hours
        bindings: [injury_days, protocol_hours]
        ladder:
          - when: "work status on file is off work AND more than one hundred twenty calendar days since the date of injury"
            value: "P('max_billable_units_per_day') + P('max_billable_units_per_day') // 2 (two-day protocol)"
          - when: "work status on file is modified duty AND more than one hundred twenty calendar days since the date of injury"
            value: "P('max_billable_units_per_day') - 1 (job-matched protocol)"
          - when: "otherwise"
            value: "P('max_billable_units_per_day') (one-day protocol)"
        baseline:
          protocol_hours: "P('max_billable_units_per_day')"
        evidence: [date, tier_param]
        cross_difficulty: null
      - id: partial_attempt_credit
        effect: method
        decides: credit_hours
        bindings: [hours_done, last_attempt, attempt_age, credit_hours]
        ladder:
          - when: "the latest recorded evaluation day is no more than seven calendar days before the request"
            method: "the evaluation hours already recorded are taken off hour for hour"
          - when: "the latest recorded evaluation day is eight to thirty calendar days before the request"
            method: "half of the evaluation hours already recorded, rounded down, are taken off"
          - when: "otherwise (older, or no evaluation day recorded)"
            method: "nothing is taken off; an older attempt is retested in full"
        baseline:
          credit_hours: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: order_rescreen
        effect: parameter
        decides: rescreen_hours
        bindings: [order_days, rescreen_hours]
        ladder:
          - when: "the treating physician's order on file is more than one hundred twenty calendar days old"
            value: "K('rescreen_two')"
          - when: "the order is ninety-one to one hundred twenty calendar days old"
            value: "K('rescreen_one')"
          - when: "otherwise"
            value: "0"
        baseline:
          rescreen_hours: "0"
        evidence: [date]
        cross_difficulty: null
      - id: core_only_reduction
        effect: parameter
        decides: core_only_hours
        bindings: [missed_month, core_only_hours]
        ladder:
          - when: "two or more missed evaluation appointments with dates in the last month reported to the adjuster"
            value: "K('core_only_two')"
          - when: "exactly one such missed appointment reported"
            value: "K('core_only_one')"
          - when: "otherwise"
            value: "0"
        baseline:
          core_only_hours: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        The standard method requests a one-day evaluation of the program's maximum daily billable hours in one session.
      params: [max_billable_units_per_day]
    inputs:
      history:
        - {table: wc_events, aggregate: sum, field: units, filters: {event_type: wc_visit_billed}}
        - {table: wc_events, aggregate: latest, field: appointment_date, filters: {event_type: wc_visit_billed}}
        - {table: wc_events, aggregate: count, field: wc_event_id, within_months: 1, filters: {event_type: wc_missed_visit_reported}}
      cross_category: []
  - id: wc_ext_fce_missed_fee
    base_policy_refs: [wc_evt_charges, wc_employer_direct]
    overwrite:
      - base_policy: wc_evt_charges
        superseded_clause: >-
          A missed Functional Capacity Evaluation is billed to the carrier at fce_no_show_fee only where
          fce_no_show_billable_to_carrier is true.
        replaced_by: >-
          A missed Functional Capacity Evaluation appointment is billed to the carrier of an accepted or without-prejudice
          claim, only where the program bills a missed evaluation to the carrier, as one missed-evaluation fee worked out
          below.
    trigger: state_due
    subject: [wc_charge_posted]
    computes: amount
    target_tool: post_fce_missed_fee_9edc6261
    params:
      full_notice_hours: 24
      short_notice_hours: 12
      short_notice_share: 0.5
      pro_rata_hours: 3
      travel_share: 0.8
      courtesy_rebooked: 50.00
      courtesy_not_rebooked: 25.00
      rebook_window_days: 7
    rule: >-
      A missed Functional Capacity Evaluation appointment is billed to the carrier of an accepted or without-prejudice
      claim, only where the program bills a missed evaluation to the carrier, as one missed-evaluation fee worked out
      below. A missed-evaluation fee is not fixed until the referral carries an adjuster authorization whose dates cover
      the missed appointment. The standard method bills the program's missed-evaluation fee once. The fee is worked out
      in this order: first the reserved-time fee is fixed, then it is multiplied by the notice share and by the
      cancellation-reason share, then the first-miss courtesy is taken off, the amount is never below zero and it is
      rounded half up to the cent once, at the end. The reserved-time fee is the program's missed-evaluation fee charged
      once for each authorized session where the latest authorization on the referral authorizes more evaluation hours
      than the program's maximum daily billable hours (a two-day protocol); the program's missed-evaluation fee times the
      authorized evaluation hours divided by the program's maximum daily billable hours where that authorization
      authorizes fewer than three evaluation hours; and the program's missed-evaluation fee once otherwise. The notice
      share comes from the latest cancellation of an evaluation appointment in the appointment series funded by the
      referral: none of the fee where it reached the clinic twenty-four or more hours before the appointment, half of
      the fee where it reached the clinic twelve to twenty-three hours before, and the whole fee otherwise, a no-show
      included. The cancellation-reason share is none of the fee where that cancellation's recorded reason is the
      patient's illness or a family emergency, eight tenths of the fee where the recorded reason is transportation or
      weather, and the whole fee otherwise. The first-miss courtesy is fifty dollars where the missed appointment is
      the only missed evaluation appointment reported to the adjuster on the referral and the worker rebooked the
      evaluation in the appointment series within seven calendar days of the missed appointment; twenty-five dollars
      where it is the only missed appointment reported and the evaluation was not rebooked within seven days; and
      none otherwise.
    prerequisite:
      - problem: wc_ext_fce_authorization_hours
        kind: value_input
        gate: reserved_fee
        form: state
        policy_source: >-
          A missed-evaluation fee is not fixed until the referral carries an adjuster authorization whose dates cover the
          missed appointment.
        condition: >-
          The referral's history holds an adjuster authorization whose first and last covered dates include the date of
          the missed evaluation appointment.
        resolved_by: record_fce_authorization_83d13911
        effect: >-
          Once the covering authorization is recorded it becomes the latest authorization on the referral, and its
          authorized evaluation hours and sessions decide the reserved-time fee (the reserved_fee binding).
    cross_category:
      - category: series
        as: history
        reads: [series_events.notice_hours, series_events.cancel_reason, series_events.event_date]
        note: The notice share and the cancellation-reason share read the latest cancellation in the funded appointment series; the courtesy reads the series rebooking date.
    compute:
      - auth_hours: "LATEST('wc_events','visits', date_field='auth_start_date', event_type='wc_authorization_received')"
      - auth_sessions: "LATEST('wc_events','visits_per_week', date_field='auth_start_date', event_type='wc_authorization_received')"
      - reserved_fee: "P('fce_no_show_fee') * auth_sessions if auth_hours > P('max_billable_units_per_day') else (P('fce_no_show_fee') * auth_hours / P('max_billable_units_per_day') if auth_hours < K('pro_rata_hours') else P('fce_no_show_fee'))"
      - notice: "XLATEST('series','series_events','notice_hours', date_field='appointment_date', event_type='series_visit_cancelled')"
      - notice_share: "0 if int(notice or 0) >= K('full_notice_hours') else (K('short_notice_share') if int(notice or 0) >= K('short_notice_hours') else 1)"
      - reason: "XLATEST('series','series_events','cancel_reason', date_field='appointment_date', event_type='series_visit_cancelled')"
      - reason_share: "0 if (reason == 'patient_illness' or reason == 'family_emergency') else (K('travel_share') if (reason == 'transportation' or reason == 'weather') else 1)"
      - missed_reports: "COUNT('wc_events', event_type='wc_missed_visit_reported')"
      - missed_date: "LATEST('wc_events','appointment_date', date_field='appointment_date', event_type='wc_missed_visit_reported')"
      - rebooked_on: "XLATEST('series','series_events','event_date', date_field='event_date', event_type='series_visits_booked')"
      - rebook_gap: "DAYS(missed_date, rebooked_on) if (missed_date and rebooked_on) else -1"
      - courtesy: "K('courtesy_rebooked') if (missed_reports == 1 and 0 <= rebook_gap <= K('rebook_window_days')) else (K('courtesy_not_rebooked') if (missed_reports == 1 and not (0 <= rebook_gap <= K('rebook_window_days'))) else 0)"
      - result: "MX(0, RND(reserved_fee * notice_share * reason_share - courtesy, 2))"
    compute_basis:
      auth_hours: "where the latest authorization on the referral authorizes more evaluation hours than the program's maximum daily billable hours (a two-day protocol)"
      auth_sessions: "charged once for each authorized session"
      reserved_fee: "The reserved-time fee is the program's missed-evaluation fee charged once for each authorized session where the latest authorization on the referral authorizes more evaluation hours than the program's maximum daily billable hours (a two-day protocol); the program's missed-evaluation fee times the authorized evaluation hours divided by the program's maximum daily billable hours where that authorization authorizes fewer than three evaluation hours; and the program's missed-evaluation fee once otherwise."
      notice: "The notice share comes from the latest cancellation of an evaluation appointment in the appointment series funded by the referral"
      notice_share: "none of the fee where it reached the clinic twenty-four or more hours before the appointment, half of the fee where it reached the clinic twelve to twenty-three hours before, and the whole fee otherwise, a no-show included."
      reason: "where that cancellation's recorded reason is the patient's illness or a family emergency"
      reason_share: "The cancellation-reason share is none of the fee where that cancellation's recorded reason is the patient's illness or a family emergency, eight tenths of the fee where the recorded reason is transportation or weather, and the whole fee otherwise."
      missed_reports: "where the missed appointment is the only missed evaluation appointment reported to the adjuster on the referral"
      missed_date: "within seven calendar days of the missed appointment"
      rebooked_on: "the worker rebooked the evaluation in the appointment series within seven calendar days of the missed appointment"
      rebook_gap: "within seven calendar days of the missed appointment"
      courtesy: "The first-miss courtesy is fifty dollars where the missed appointment is the only missed evaluation appointment reported to the adjuster on the referral and the worker rebooked the evaluation in the appointment series within seven calendar days of the missed appointment; twenty-five dollars where it is the only missed appointment reported and the evaluation was not rebooked within seven days; and none otherwise."
      result: "first the reserved-time fee is fixed, then it is multiplied by the notice share and by the cancellation-reason share, then the first-miss courtesy is taken off, the amount is never below zero and it is rounded half up to the cent once, at the end."
    factors:
      - id: reserved_time
        effect: method
        decides: reserved_fee
        bindings: [auth_hours, auth_sessions, reserved_fee]
        ladder:
          - when: "the latest authorization authorizes more evaluation hours than the program's maximum daily billable hours (a two-day protocol)"
            method: "the missed-evaluation fee is charged once for each authorized session"
          - when: "the latest authorization authorizes fewer than three evaluation hours"
            method: "the missed-evaluation fee is pro-rated by the authorized hours over the maximum daily billable hours"
          - when: "otherwise"
            method: "the missed-evaluation fee is charged once"
        baseline:
          reserved_fee: "P('fce_no_show_fee')"
        evidence: [history, tier_param]
        cross_difficulty: null
      - id: notice_share
        effect: parameter
        decides: notice_share
        bindings: [notice, notice_share]
        ladder:
          - when: "the latest cancellation in the funded series reached the clinic twenty-four or more hours before the appointment"
            value: "0"
          - when: "it reached the clinic twelve to twenty-three hours before"
            value: "K('short_notice_share')"
          - when: "otherwise (under twelve hours, or a no-show)"
            value: "1"
        baseline:
          notice_share: "1"
        evidence: [cross_category]
        cross_difficulty: series
      - id: reason_share
        effect: parameter
        decides: reason_share
        bindings: [reason, reason_share]
        ladder:
          - when: "the cancellation's recorded reason is the patient's illness or a family emergency"
            value: "0"
          - when: "the recorded reason is transportation or weather"
            value: "K('travel_share')"
          - when: "otherwise"
            value: "1"
        baseline:
          reason_share: "1"
        evidence: [cross_category]
        cross_difficulty: series
      - id: first_miss_courtesy
        effect: parameter
        decides: courtesy
        bindings: [missed_reports, missed_date, rebooked_on, rebook_gap, courtesy]
        ladder:
          - when: "the missed appointment is the only one reported on the referral AND the evaluation rebooked in the series within seven calendar days of the missed appointment"
            value: "K('courtesy_rebooked')"
          - when: "the missed appointment is the only one reported on the referral AND the evaluation not rebooked within seven calendar days"
            value: "K('courtesy_not_rebooked')"
          - when: "otherwise"
            value: "0"
        baseline:
          courtesy: "0"
        evidence: [history, cross_category, date]
        cross_difficulty: series
    baseline:
      rule: >-
        The standard method bills the program's missed-evaluation fee once.
      params: [fce_no_show_fee]
    inputs:
      history:
        - {table: wc_events, aggregate: latest, field: visits, filters: {event_type: wc_authorization_received}}
        - {table: wc_events, aggregate: count, field: wc_event_id, filters: {event_type: wc_missed_visit_reported}}
        - {category: series, table: series_events, aggregate: latest, field: notice_hours, filters: {event_type: series_visit_cancelled}}
        - {category: series, table: series_events, aggregate: latest, field: event_date, filters: {event_type: series_visits_booked}}
      cross_category: [series]
