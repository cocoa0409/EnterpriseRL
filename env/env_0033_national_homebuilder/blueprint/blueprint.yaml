name: env_0033_national_homebuilder
company: Calloway Homes

background: |
  Calloway Homes is a national production homebuilder that closes roughly 9,400 homes a year, and its Homebuyer and Warranty Services desk serves the eight master-planned communities of its southern and western divisions: Cedar Hollow in Round Rock, Texas; Mesquite Trails in Buckeye, Arizona; Harbor Pines in Wesley Chapel, Florida; Larkspur Meadows in Castle Rock, Colorado; Brookstone Crossing in Fuquay-Varina, North Carolina; Willow Bend Reserve in Cumming, Georgia; Sierra Vista Ranch in Roseville, California; and Palmetto Shoals in Bluffton, South Carolina.
  The desk supports buyers from the day they put a hold on a lot until years after move-in, in a plain, patient tone that treats a home purchase as the largest transaction of most callers' lives.
  A buyer usually starts with a Homesite Reservation on one platted lot, classed by the site plan as an Interior Homesite, Corner Homesite, Cul-de-Sac Homesite, Greenbelt Homesite, Water-View Homesite or Golf-Frontage Homesite, and the reservation holds deposits and fees until it converts, is released, expires or is withdrawn.
  The Home Purchase Agreement is written for a plan in one of six collections, the Pathway Collection, Meadow Collection, Heritage Collection, Crestview Collection, Summit Collection and Reserve Collection, and it books earnest money and other deposits, buyer charges and builder incentives while the home moves from signing through construction stages to closing.
  Each to-be-built agreement opens a Design Studio Selections file under one of the Studio Essentials, Studio Classic, Studio Select, Studio Designer, Studio Signature or Studio Atelier packages, which records appointments, option lines, change orders, option deposits and design credits.
  Buyers who finance through the affiliated lender Calloway Home Mortgage can protect their rate with a Builder Extended Rate Lock: the 60-Day Standard Lock, 90-Day Lock, 120-Day Extended Lock, 180-Day Extended Lock, 270-Day Build Lock or 360-Day Build Lock, which books upfront lock fees and extension, relock and float-down charges.
  Calloway Insurance Agency writes Homeowners Insurance on Calloway homes under the HomeShield Essential, HomeShield Standard, HomeShield Plus, HomeShield Preferred, HomeShield Premier and HomeShield Estate programs, billed by installment from the closing date.
  In its California, Arizona and Colorado communities Calloway Energy Services offers the SunPath Solar Lease, sized as SunPath 3.2 kW, SunPath 4.0 kW, SunPath 4.8 kW, SunPath 5.6 kW, SunPath 6.4 kW or SunPath 8.0 kW, billed monthly once the utility grants permission to operate.
  Every closed home is enrolled in the Calloway Limited Home Warranty under the HomeCare 1-2-10 Standard, HomeCare 1-2-10 Select, HomeCare 1-3-10 Plus, HomeCare 2-3-10 Preferred, HomeCare 2-5-10 Premier or HomeCare 2-5-15 Reserve program, which follows the home to later owners and books claim items, walkthroughs, homeowner charges and payouts.
  Calloway keeps each product as a running contract on the buyer's profile, and every payment, refund, fee, credit, notice, appointment and claim is posted as its own dated record with the receipt, charge, line or item number printed on the customer's paperwork.
  Callers are mostly first-time and move-up buyers, military families relocating to bases near the Texas, Georgia and North Carolina communities, retirees buying in Palmetto Shoals and Harbor Pines, and a smaller number of second-home buyers.
  A typical caller holds a converted reservation, a purchase agreement under construction with a design file and a rate lock, and sometimes a second agreement or a homesite hold in another community.
  Homeowners who have closed call about their warranty coverage, often bringing a history of earlier claim items, missed appointments, walkthroughs and repairs, and some are subsequent owners who bought a Calloway home from its first buyer.
  Callers usually quote the lot number, plan name, receipt number, change order number, lock confirmation or service request item number printed on the documents in front of them.
logs:
  verification_log_table: verification_log
  handoff_log_table: handoff_log

difficulties:
  - name: homesite_reservation_holds
    claim:
      categories: [homesite]
      event_types: [homesite_reservation_created, homesite_payment_received, homesite_hold_activated, homesite_hold_extended, homesite_lot_swapped, homesite_refund_issued, homesite_funds_retained, homesite_released, homesite_reinstated, homesite_converted, homesite_funds_applied]
    summary: >
      Callers are prospective buyers holding or seeking Homesite Reservations, from an Interior Homesite
      reserved online on a pre-qualification letter to a Golf-Frontage Homesite placed at the sales
      center, and their situations vary by premium class, by whether the hold is still pending_deposit,
      held, expired or already converted, by how many extensions, swaps and reinstatements the hold has
      used, by returned payments in its history, and by other open holds the buyer has in the same or
      another community. The records involved are the reservation itself with its reserved date, hold
      expiry date, lot premium and funds on hand, and the reservation ledger of payments by component and
      receipt number, refunds, retentions, applications and notices; the governing rules are the class
      parameters for deposits and premium holding fees (homesite_deposit_collection), extensions and the
      total hold cap (homesite_hold_extension), swap windows and fees (homesite_lot_swap), the
      full-refund window and the premium fee refund percent after it (homesite_release_refund), expiry,
      reinstatement and automatic refunds (homesite_expiry_reinstatement), returned payments
      (homesite_returned_payment), conversion credits and the lot premium deposit share
      (homesite_conversion), and the portfolio caps on open holds (homesite_agg_multi_holding,
      homesite_agg_community_premium_cap). In the natural course of a reservation, funds are received,
      the hold is activated, it may be extended, swapped or reinstated, and it ends by conversion into a
      purchase agreement, release, expiry or withdrawal, with each dollar on hand refunded, retained or
      moved by source receipt. The agent locates and verifies the buyer, records payments, activations,
      extensions, swaps, reinstatements, refunds and retentions, while a release of the homesite is the
      buyer's own signed decision that the buyer confirms personally. Requests no charter rule decides,
      such as asking Calloway to hold a homesite that is not on the site plan, to waive a premium holding
      fee out of goodwill, or to transfer a reservation to a relative's name, go to a human
      representative as POLICY_NOT_COVERED.

  - name: purchase_deposits_and_closing
    claim:
      categories: [purchase]
      event_types: [purchase_deposit_posted, purchase_ratified, purchase_closing_extended, purchase_plan_changed, purchase_lot_transferred, purchase_financing_changed, purchase_contingency_released, purchase_charge_assessed, purchase_charge_waived, purchase_deposit_refunded, purchase_deposit_forfeited, purchase_incentive_granted, purchase_incentive_revoked, purchase_cancelled, purchase_notice_sent]
    summary: >
      Callers are buyers under a Home Purchase Agreement in any of the six collections, from a Pathway
      Collection townhome bought with Calloway Home Mortgage to a Reserve Collection estate bought with
      an outside lender and a home-sale contingency, and their agreements sit anywhere from
      pending_ratification through under_construction and closing_scheduled, sometimes alongside a second
      open agreement, a converted homesite reservation, a design file or a Calloway Home Mortgage rate
      lock whose loan program matters to the deposit and incentive rules. The records involved are the
      agreement with its contract price, contract and completion dates, construction stage, financing type
      and scheduled closing date, the ledger of deposits by component and receipt number, charges by
      charge number, incentives and notices, and the cancellation requests the buyer has lodged; the
      governing rules are the collection's earnest money, additional deposit and VA cap
      (purchase_earnest_money), the signing deadline (purchase_ratification), rescission, financing and
      home-sale contingency windows (purchase_rescission, purchase_financing_contingency,
      purchase_sale_contingency), closing extensions and per diem (purchase_closing_schedule), builder
      delay rights (purchase_builder_delay), defaults and the forfeiture cap
      (purchase_default_termination), incentive grants, revocation and the seller concession cap
      (purchase_incentives), charge waivers (purchase_charge_waiver), plan and homesite changes
      (purchase_plan_lot_changes), returned payments (purchase_returned_payment) and mutual release
      refunds (purchase_cancellation_refund), together with the portfolio limits
      (purchase_agg_multi_holding, purchase_agg_concurrent_agreements). In the natural course of a
      purchase, signing deposits post and the agreement is ratified, construction starts and the
      additional deposit is due, the closing date is set and may move, and the agreement ends at closing
      or by cancellation or termination with each deposit refunded, forfeited or credited by source
      receipt. The agent records deposits, charges, waivers, incentive changes, extensions, amendments,
      notices and refunds and records a buyer's cancellation request, while the cancellation itself takes
      effect only when the buyer confirms it personally. Requests outside every rule, such as negotiating
      the base price, assigning the agreement to an investor, or asking Calloway to carry deposits past a
      closing that the buyer cannot fund, go to a human representative as POLICY_NOT_COVERED.

  - name: design_studio_changes
    claim:
      categories: [design]
      event_types: [design_selection_opened, design_appointment_held, design_package_changed, design_option_added, design_option_removed, design_change_order_recorded, design_deposit_paid, design_deposit_refunded, design_deposit_forfeited, design_credit_granted, design_credit_applied]
    summary: >
      Callers are buyers working through their Design Studio Selections, from a Studio Essentials file
      on a Pathway Collection townhome to a Studio Atelier file on a Reserve Collection estate, and their
      files may be awaiting the first appointment, in selection, structurally closed after construction
      started, finalized at drywall, or cancelled with the purchase agreement, each carrying a history of
      appointments, option lines, change orders, deposits, returned payments and credits. The records
      involved are the design file with its option total, deposits held and credit balance, the design
      ledger of appointments, option lines by line number and catalog code, change orders by number,
      deposit payments by receipt and credits by memo number, and the purchase agreement whose collection,
      base price, construction stage and cancellation basis bear on the file; the governing rules are
      package eligibility and changes (design_package_eligibility), included appointments and the
      electrical walk (design_appointments), selection windows, price protection, included levels and
      removal credits (design_option_selection), change order fees and limits (design_change_orders),
      the option deposit ladder and option cap (design_option_deposits), allowance, promotional and
      goodwill credits (design_credits), deposit refunds on cancellation
      (design_cancellation_deposits) and the one-file rules (design_agg_multi_holding,
      design_agg_one_file_per_agreement). In the natural course of a file, the first appointment opens
      selections and grants the allowance, options are added and paid for, later changes go through
      numbered change orders, structural selections close at construction start and everything is final
      at drywall, and deposits are credited at closing or refunded or forfeited on cancellation. The agent
      opens files, records appointments, option lines, change orders, deposits, credits and refunds, while
      the buyer alone decides which options to buy or drop. Requests no rule covers, such as a structural
      change after construction start for a reason other than builder error, an option not in the studio
      catalog, or a cash refund of unused design credit, go to a human representative as
      POLICY_NOT_COVERED.

  - name: rate_lock_management
    claim:
      categories: [lock]
      event_types: [lock_requested, lock_fee_paid, lock_confirmed, lock_extended, lock_float_down, lock_terms_changed, lock_charge_assessed, lock_charge_waived, lock_relocked, lock_fee_refunded, lock_fee_forfeited, lock_withdrawn]
    summary: >
      Callers are buyers financing through Calloway Home Mortgage who hold or want a Builder Extended Rate
      Lock, from a 60-Day Standard Lock on a nearly finished home to a 360-Day Build Lock taken before
      the foundation, and their locks may be requested, locked, expired, funded, cancelled or withdrawn,
      with histories of extensions, float-downs, relocks and program or loan amount changes, while the
      purchase agreement behind each lock may be moving through construction, have a closing date that
      slipped because of a builder delay, or be cancelled. The records involved are the lock with its loan
      program, loan amount, qualifying figures, par and locked rates, request, lock and expiration dates
      and counters, the lock ledger of fee payments, charges by charge number, waivers, credits, refunds
      and notices, and the purchase agreement's status, construction stage, financing type and estimated
      completion and closing dates; the governing rules are the term eligibility gates
      (lock_term_eligibility, lock_agg_purchase_link), the upfront fee and locked rate
      (lock_fee_and_pricing), extension increments and fees (lock_extensions), the float-down option
      (lock_float_down_option), expiry and relock pricing (lock_expiry_relock), program and amount changes
      (lock_terms_change), builder-delay waivers (lock_builder_delay_waiver), settlement of the upfront fee
      (lock_settlement) and the one-lock-per-agreement limit (lock_agg_multi_holding). In the natural
      course of a lock, the request is made, the fee is paid and the lock confirmed, the lock may be
      extended, floated down or re-priced, it may expire and be relocked, and it ends at funding or when
      the purchase or the buyer ends it. The agent records requests, fee payments, confirmations,
      extensions, float-downs, terms changes, charges, waivers, relocks, refunds and forfeitures, while
      withdrawing a lock is the buyer's own decision confirmed personally. Requests outside the rules,
      such as locking a loan with an outside lender, pricing a rate below the rate sheet, or approving a
      loan the buyer has not qualified for, go to a human representative as POLICY_NOT_COVERED.

  - name: warranty_claims_service
    claim:
      categories: [warranty]
      event_types: [warranty_coverage_enrolled, warranty_claim_filed, warranty_claim_inspected, warranty_claim_approved, warranty_claim_denied, warranty_appointment_scheduled, warranty_appointment_missed, warranty_repair_completed, warranty_callback_filed, warranty_walkthrough_completed, warranty_charge_assessed, warranty_charge_waived, warranty_payout_approved]
    summary: >
      Callers are homeowners of closed Calloway homes, both original buyers and subsequent owners, under
      HomeCare programs from HomeCare 1-2-10 Standard to HomeCare 2-5-15 Reserve, whose homes may be weeks
      or years past closing, whose coverage may be active, transferred or expired, and whose history
      may include earlier claim items, inspections with measured cracks, missed appointments, one-time
      repairs already used, walkthroughs already held and repairs that failed again. The records involved
      are the coverage with its coverage start and period end dates, owner type and prior coverage, the
      warranty ledger of claim items by item number with defect category, inspections, decisions,
      appointments, repairs, callbacks, walkthroughs, charges by charge number and payouts, and the
      purchase agreement and collection of the home; the governing rules are the coverage period of each
      defect category and its grace (warranty_coverage_periods), tolerances, one-time repairs, cosmetic
      reporting and exclusions (warranty_tolerances_and_exclusions), service levels and access
      (warranty_service_levels), missed appointment and dispatch charges with their waivers
      (warranty_appointment_charges), structural deductibles, engineer review and relocation
      reimbursement (warranty_structural_claims), walkthrough windows (warranty_walkthroughs), callbacks
      (warranty_callbacks), registration of subsequent owners (warranty_transfer), cash settlements and
      payouts (warranty_payouts_and_payments) and the one-coverage-per-home rule
      (warranty_agg_one_owner_per_home). In the natural course of a claim, an item is reported, inspected,
      approved or denied, scheduled and repaired, and may come back as a callback, while walkthroughs and
      charges run alongside over the life of the home's coverage. The agent records claim items,
      inspections, decisions, appointments, repairs, callbacks, walkthroughs, charges, waivers and payouts
      and enrolls subsequent owners, while accepting a cash settlement instead of a repair is the
      homeowner's own written decision. Requests no rule decides, such as damage from a third-party
      contractor's work, coverage for a pool or fence the homeowner added after closing, or compensation
      for lost rent, go to a human representative as POLICY_NOT_COVERED.
