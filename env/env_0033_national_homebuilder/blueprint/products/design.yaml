# Design Studio Selections charter — Calloway Homes.
# Every to-be-built Home Purchase Agreement opens one design studio file. The buyer picks a Design
# Studio package (the tier), attends design appointments, selects structural and finish options,
# pays option deposits and makes change orders until the construction cutoffs close each kind of
# selection: structural options close when construction starts, finish options close at drywall.

category: design
display_name: Design Studio Selections

binding:
  holding_table: design_selections
  event_tables: [design_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {option_total: option_commitment, option_deposit_held: option_deposit, design_credit_balance: design_credit}

lifecycle:
  states: [awaiting_appointment, in_selection, structural_closed, finalized, delivered, cancelled]
  transitions:
    - {from: awaiting_appointment, to: in_selection, by: agent, means: "The buyer's first design appointment is held and selections open."}
    - {from: awaiting_appointment, to: structural_closed, by: system, means: "Construction starts before any appointment was held; structural selections close at the included standard."}
    - {from: in_selection, to: structural_closed, by: system, means: "Construction starts on the homesite; structural options can no longer be changed."}
    - {from: structural_closed, to: finalized, by: system, means: "The home reaches drywall; every selection is final."}
    - {from: finalized, to: delivered, by: system, means: "The home closes with the selected options installed."}
    - {from: awaiting_appointment, to: cancelled, by: system, means: "The purchase agreement is cancelled or terminated before any appointment."}
    - {from: in_selection, to: cancelled, by: system, means: "The purchase agreement is cancelled or terminated during selections."}
    - {from: structural_closed, to: cancelled, by: system, means: "The purchase agreement is cancelled or terminated after construction start."}
    - {from: finalized, to: cancelled, by: system, means: "The purchase agreement is cancelled or terminated after selections are final."}

accounts:
  - key: option_commitment
    unit: USD
    meaning: Total price of the options and design studio fees the buyer has committed to on the file, added to the amount due at closing.
  - key: option_deposit
    unit: USD
    meaning: Option deposits paid by the buyer that Calloway holds until closing, refund or forfeiture.
  - key: design_credit
    unit: USD
    meaning: Design studio credit available to offset option prices, granted by the package or by Calloway and not yet used or forfeited.

parameter_schema:
  eligible_collections: List of purchase collections whose agreements may choose this package.
  included_appointments: Number of design appointments included with the package.
  appointment_hours: Hours of designer time in each included appointment.
  extra_appointment_fee_usd: Fee (USD) for each appointment beyond the included appointments, booked as a design_consult_fee option line.
  first_appointment_due_days: Calendar days after the file is opened by which the first design appointment must be held.
  package_allowance_usd: Design credit (USD) granted by the package when the first appointment is held.
  allowance_applies_to_structural: Whether the package allowance may be applied to structural options (otherwise finish options only).
  allowance_expires_at_finalization: Whether unused design credit is forfeited when the file is finalized.
  promo_credit_cap_pct_of_options: Cap on promotional design credit, percent of the option total at the time it is applied.
  goodwill_credit_cap_usd: Largest builder goodwill design credit (USD) a studio manager may grant on one file.
  structural_deposit_pct: Option deposit due on structural options, percent of the option price.
  finish_deposit_pct: Option deposit due on finish options, percent of the option price.
  deposit_ladder_threshold_usd: Option total (USD) above which the elevated deposit percent applies to every option on the file.
  deposit_ladder_elevated_pct: Minimum deposit percent on every option once the option total exceeds the ladder threshold.
  option_cap_pct_of_base: Option total cap, percent of the agreement's base price, above which the excess must be fully deposited.
  excess_over_cap_deposit_pct: Deposit percent due on the part of the option total above the option cap.
  deposit_due_business_days: Business days after an option line is selected by which its deposit must be paid.
  accepted_payment_methods: Payment methods accepted for option deposits.
  card_payment_cap_usd: Largest card payment (USD) accepted toward option deposits; 0 means card is not accepted.
  card_convenience_fee_pct: Card convenience fee, percent of the card amount, booked as an option line.
  returned_payment_fee_usd: Fee (USD) for a returned option deposit payment, booked as an option line.
  free_change_orders: Number of change orders carrying no change order fee.
  change_order_fee_usd: Change order fee (USD) for a change order written while the file is in_selection.
  post_structural_change_order_fee_usd: Change order fee (USD) for a change order written after structural close.
  max_change_orders: Maximum change orders per file.
  structural_changes_after_start_allowed: Whether structural options may be added or removed after construction start.
  finish_changes_after_drywall_allowed: Whether finish options may be added or removed after drywall.
  removal_credit_pct_in_selection: Percent of an option's price credited when it is removed while the file is in_selection.
  removal_credit_pct_after_structural_close: Percent of a finish option's price credited when it is removed after structural close.
  option_price_protection_days: Calendar days after the appointment at which an option price was quoted during which that price is honored.
  deposit_refund_pct_before_structural_close: Percent of option deposits refunded when the buyer's purchase agreement is cancelled before structural close (other than rescission or builder delay).
  deposit_refund_pct_after_structural_close: Percent of option deposits refunded when the buyer's purchase agreement is cancelled after structural close (other than builder delay).
  builder_side_cancel_refund_pct: Percent of option deposits refunded when the purchase agreement is cancelled for rescission or builder delay.
  appliance_package_included: Whether the package includes the upgraded appliance package (appliance lines priced net of it).
  included_cabinet_level: Cabinet level included in the package (1 to 5); higher levels are option lines.
  included_countertop_level: Countertop level included in the package (1 to 5); higher levels are option lines.
  included_flooring_level: Flooring level included in the package (1 to 4); higher levels are option lines.
  smart_home_package_included: Whether the smart home package is included.
  electrical_walk_included: Whether the pre-drywall electrical walk appointment is included.
  electrical_walk_hours: Hours of the electrical walk appointment.
  electrical_walk_fee_usd: Fee (USD) for an electrical walk when it is not included, booked as a design_consult_fee option line.
  virtual_appointment_allowed: Whether design appointments may be held by video.
  online_selection_allowed: Whether finish options may be selected through the buyer portal.
  portal_selection_cap_usd: Largest option total (USD) of finish lines that may be selected through the buyer portal on one file.
  package_upgrade_fee_usd: Fee (USD) for moving into this package from a lower package, booked as an option line.
  package_downgrade_allowed: Whether a buyer may move from this package to a lower package.
  deposit_credit_at_closing: Whether option deposits are credited against the amount due at closing.
  change_order_fee_waived_builder_error: Whether a change order made to correct a studio or builder error carries no fee and does not count toward the limits.

