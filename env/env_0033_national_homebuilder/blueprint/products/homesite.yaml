# Homesite Reservation charter — Calloway Homes.
# A Homesite Reservation Agreement holds one specific lot (homesite) in a Calloway community for a
# named buyer for a short, defined hold period ahead of the Home Purchase Agreement. Homesites are
# classed on the community site plan by premium class; the class drives the reservation deposit,
# the non-refundable premium holding fee, hold length, extensions, swaps and the share of the lot
# premium that becomes due when the reservation converts into a purchase agreement.

category: homesite
display_name: Homesite Reservation

binding:
  holding_table: homesite_reservations
  event_tables: [homesite_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {funds_on_hand: reservation_funds}

lifecycle:
  states: [pending_deposit, held, converted, released, expired, withdrawn]
  transitions:
    - {from: pending_deposit, to: held, by: agent, means: "The reservation deposit and any premium holding fee have been received in full, so the homesite is taken off the market for the hold period."}
    - {from: pending_deposit, to: expired, by: system, means: "The required funds were not received by the end of the deposit due period, so the homesite returns to the market."}
    - {from: pending_deposit, to: released, by: user, means: "The buyer withdraws the reservation before funding it."}
    - {from: held, to: converted, by: agent, means: "A Home Purchase Agreement has been written on this homesite and the reservation funds move to the purchase agreement."}
    - {from: held, to: released, by: user, means: "The buyer signs a written release of the held homesite."}
    - {from: held, to: expired, by: system, means: "The hold expiry date passed without conversion or extension, or a returned payment was not cured in time."}
    - {from: expired, to: held, by: agent, means: "An expired hold is reinstated within the reinstatement window on payment of the reinstatement fee."}
    - {from: pending_deposit, to: withdrawn, by: agent, means: "Calloway withdraws the homesite from sale after the notice period and the reservation ends."}
    - {from: held, to: withdrawn, by: agent, means: "Calloway withdraws the held homesite from sale after the notice period and refunds everything held."}

accounts:
  - key: reservation_funds
    unit: USD
    meaning: Money the buyer has paid toward this reservation that Calloway currently holds (deposit, premium holding fee and any extension, swap, reinstatement or returned-payment fees), before it is refunded, retained or applied to a purchase agreement.

parameter_schema:
  lot_premium_floor_usd: Lowest lot premium (USD) of a homesite assigned to this premium class on the community site plan.
  lot_premium_ceiling_usd: Highest lot premium (USD) of a homesite assigned to this premium class on the community site plan.
  prequal_letter_max_age_days: Maximum age in calendar days of the lender pre-qualification letter on the reservation date (every reservation requires one).
  reservation_deposit_usd: Refundable reservation deposit (USD) due for a homesite of this class.
  premium_holding_fee_usd: Premium holding fee (USD) due in addition to the deposit; refundable only as stated in the release rules, credited to the lot premium on conversion.
  deposit_due_days: Calendar days after the reservation date by which the full required funds must be received.
  accepted_payment_methods: List of payment methods accepted for reservation funds (card, ach, check, wire, certified_funds).
  card_payment_cap_usd: Largest single card payment (USD) accepted toward this reservation.
  card_convenience_fee_pct: Card convenience fee charged on a card payment, percent of the card amount, rounded to the cent.
  returned_payment_fee_usd: Fee (USD) charged when a payment is returned unpaid (insufficient funds, stop payment, chargeback).
  returned_payment_cure_days: Calendar days after a returned-payment event within which replacement funds plus the returned-payment fee must be received.
  certified_funds_after_returns: Number of returned payments on the reservation after which only wire or certified funds are accepted.
  initial_hold_days: Calendar days the homesite is held, counted from the reservation date.
  max_extensions: Maximum number of hold extensions per reservation.
  extension_days: Calendar days added to the current hold expiry date by one extension.
  extension_fee_usd: Fee (USD) charged per hold extension.
  extension_fee_creditable: Whether paid extension fees are credited to the lot premium on conversion (true) or retained by Calloway (false).
  extension_requires_prequal_refresh: Whether an extension requires a pre-qualification letter no older than prequal_letter_max_age_days on the extension date.
  max_total_hold_days: Cap on calendar days from the reservation date to the latest hold expiry date that extensions may produce.
  expiry_notice_days_before: Calendar days before the hold expiry date on which the courtesy expiry reminder is sent.
  full_refund_window_days: Calendar days after the reservation date within which a buyer release refunds the premium holding fee in full.
  premium_fee_refundable_within_window: Whether the premium holding fee is refunded on a release inside the full-refund window.
  premium_fee_refund_pct_after_window: Percent of the premium holding fee refunded on a release after the full-refund window.
  refund_processing_business_days: Business days (Monday-Friday excluding Calloway holidays) within which a refund is issued after the release, expiry or withdrawal.
  refund_method: How refunds are returned (original_method or check).
  builder_withdrawal_refund_business_days: Business days within which every dollar held is refunded when Calloway withdraws the homesite from sale.
  builder_withdrawal_notice_days: Calendar days of written notice Calloway gives before withdrawing a reserved homesite from sale.
  free_lot_swaps: Number of homesite swaps on one reservation that carry no swap fee.
  lot_swap_fee_usd: Fee (USD) for each swap beyond the free swaps.
  lot_swap_window_days: Calendar days after the reservation date within which a swap may be made.
  max_lot_swaps: Maximum number of swaps per reservation.
  swap_down_deposit_refund: Whether, on a swap into a class with lower required funds, the difference in deposit and premium holding fee is refunded.
  swap_resets_hold_clock: Whether a swap restarts the hold period from the swap date.
  cross_community_swap_allowed: Whether a swap may move the reservation to a homesite in another community.
  deposit_applies_to_earnest_money: Whether the reservation deposit transfers to the purchase agreement as earnest money on conversion.
  premium_fee_applies_to_lot_premium: Whether the premium holding fee is credited toward the lot premium deposit on conversion.
  lot_premium_protection_days: Calendar days after the reservation date during which the reserved lot premium is honored at conversion.
  premium_deposit_pct_at_contract: Percent of the lot premium due as a non-refundable lot premium deposit when the purchase agreement is written.
  reinstatement_window_days: Calendar days after the expiry date within which an expired hold may be reinstated.
  reinstatement_fee_usd: Fee (USD) to reinstate an expired hold.
  max_reinstatements: Maximum reinstatements per reservation.
  expired_deposit_auto_refund: Whether funds on an expired hold are refunded automatically once the reinstatement window closes.
  expired_premium_fee_retained: Whether the premium holding fee is retained by Calloway when a hold expires.
  rereserve_after_expiry_allowed: Whether the same buyer may reserve the same homesite again after a release or expiry.
  rereserve_same_lot_wait_days: Calendar days after a release or expiry before the same buyer may reserve the same homesite again.
  investor_reservation_allowed: Whether a reservation with occupancy intent investor is accepted.
  second_home_allowed: Whether a reservation with occupancy intent second_home is accepted.
  online_reservation_allowed: Whether the reservation may be placed through the online buyer portal rather than at the sales center.
  max_holds_same_community: Maximum active reservations one buyer may hold in a single community.

