# Homeowners Insurance charter — Calloway Insurance Agency.
# Calloway's licensed insurance agency writes HO-3 homeowners policies on Calloway-built homes,
# usually bound before closing so the lender has proof of hazard insurance. The HomeShield
# programs are the tiers, laddered by dwelling coverage (Coverage A) and by the breadth of
# coverage, deductibles, endorsements and discounts.

category: insurance
display_name: Homeowners Insurance

binding:
  holding_table: insurance_policies
  event_tables: [insurance_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {premium_balance: premium_due}

lifecycle:
  states: [quoted, bound, in_force, cancelled, non_renewed]
  transitions:
    - {from: quoted, to: bound, by: agent, means: "The insured accepts the quote, the first premium is received and a binder is issued."}
    - {from: bound, to: in_force, by: system, means: "The effective date (the closing date) arrives."}
    - {from: bound, to: cancelled, by: system, means: "The closing does not happen, so the binder is cancelled flat."}
    - {from: in_force, to: cancelled, by: user, means: "The insured cancels the policy mid-term."}
    - {from: in_force, to: cancelled, by: system, means: "The policy is cancelled for non-payment after notice."}
    - {from: cancelled, to: in_force, by: agent, means: "A policy cancelled for non-payment is reinstated within the reinstatement window."}
    - {from: in_force, to: non_renewed, by: system, means: "The policy reaches expiration without a renewal."}

accounts:
  - key: premium_due
    unit: USD
    meaning: Premium and policy fees billed to the insured and not yet paid or credited back.

parameter_schema:
  coverage_a_floor_usd: Lowest dwelling coverage (Coverage A, USD) written under this program.
  coverage_a_ceiling_usd: Highest dwelling coverage (Coverage A, USD) written under this program.
  coverage_b_pct: Other structures coverage, percent of Coverage A.
  coverage_c_pct: Personal property coverage, percent of Coverage A.
  coverage_d_pct: Loss of use coverage, percent of Coverage A.
  liability_usd: Personal liability limit (USD) per occurrence.
  med_pay_usd: Medical payments to others limit (USD) per person.
  aop_deductible_usd: All-other-perils deductible (USD).
  wind_hail_deductible_pct: Wind and hail deductible, percent of Coverage A.
  hurricane_deductible_pct: Named-storm deductible in coastal communities, percent of Coverage A.
  extended_replacement_pct: Extra dwelling coverage above Coverage A available after a total loss, percent.
  water_backup_usd: Sewer and drain backup sublimit (USD).
  service_line_usd: Underground service line coverage (USD).
  equipment_breakdown_included: Whether home systems equipment breakdown coverage is included.
  ordinance_law_pct: Ordinance or law coverage, percent of Coverage A.
  jewelry_sublimit_usd: Theft sublimit for jewelry and watches (USD).
  identity_fraud_usd: Identity fraud expense coverage (USD).
  mold_sublimit_usd: Mold remediation sublimit (USD).
  loss_assessment_usd: HOA loss assessment coverage (USD).
  home_business_usd: Home business property coverage (USD).
  scheduled_property_allowed: Whether individual items may be scheduled.
  base_rate_per_1000_usd: Annual base premium (USD) per 1,000 dollars of Coverage A.
  coastal_wind_surcharge_pct: Surcharge on the base premium for homes in a coastal wind community, percent.
  new_home_discount_pct: Discount on the first policy term of a newly completed home, percent.
  builder_affiliate_discount_pct: Discount when the home is financed through Calloway Home Mortgage, percent.
  bundle_discount_pct: Discount when an auto policy is placed with Calloway Insurance Agency, percent.
  autopay_discount_pct: Discount for automatic payments, percent.
  paid_in_full_discount_pct: Discount for paying the term premium in full, percent.
  claims_free_renewal_discount_pct: Renewal discount after claims_free_years_required claim-free years, percent.
  claims_free_years_required: Claim-free years needed for the claims-free renewal discount.
  max_total_discount_pct: Cap on the sum of all discounts, percent.
  installment_plans: Payment plans offered.
  installment_fee_usd: Fee (USD) on each installment after the first.
  payment_methods: Payment methods accepted.
  late_fee_usd: Fee (USD) on an installment paid after its due date.
  grace_days: Calendar days after an installment due date before a non-payment notice is sent.
  nonpayment_notice_days: Calendar days of notice between the non-payment notice and cancellation.
  reinstatement_window_days: Calendar days after a non-payment cancellation within which the policy may be reinstated.
  reinstatement_fee_usd: Fee (USD) to reinstate after a non-payment cancellation.
  free_look_days: Calendar days after the effective date within which the insured may cancel for a full refund.
  short_rate_penalty_pct: Penalty on unearned premium when the insured cancels after the free-look period, percent.
  min_earned_premium_pct: Minimum premium earned on an insured cancellation, percent of the term premium.
  refund_processing_days: Calendar days after cancellation within which return premium is paid.
  binder_lead_days: Calendar days before the scheduled closing date by which the binder must be issued.
  renewal_offer_days_before: Calendar days before expiration on which the renewal offer is sent.
  max_renewal_increase_pct: Cap on the renewal premium increase before discounts, percent.
  inflation_guard_pct: Automatic increase of Coverage A at renewal, percent.
  endorsement_fee_usd: Fee (USD) per mid-term endorsement requested by the insured.
  midterm_coverage_a_increase_max_pct: Largest mid-term increase in Coverage A without re-underwriting, percent.
  roof_age_acv_years: Roof age in years after which roof losses settle at actual cash value.

