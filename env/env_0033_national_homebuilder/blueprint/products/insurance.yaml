events:
  - type: insurance_quoted
    target: insurance_policies
    mutation: create
    meaning: Calloway Insurance Agency issues a homeowners quote on a Calloway home.
    grain: One row per quote.
    fields:
      customer_id: The applicant.
      purchase_id: Purchase agreement of the home insured.
      variant_name: HomeShield program quoted.
      status: Always quoted on creation.
      policy_number: Policy number assigned to the quote.
      coverage_a: Dwelling coverage quoted.
      coastal_wind_zone: Whether the home's community is a coastal wind community.
      auto_bundled: Whether an auto policy is placed with the agency.
      payment_plan: Payment plan chosen.
      autopay: Whether automatic payments are set up.
      term_premium: Annual premium after discounts and surcharges.
      effective_date: Scheduled closing date of the home.
      expiration_date: Effective date plus one year.
      premium_balance: 0.00 on creation.
    triggers: []
  - type: insurance_bound
    target: insurance_policies
    mutation: {transition: {from: quoted, to: bound}}
    meaning: The insured accepts, pays the first premium and the binder is issued to the lender.
    grain: One row per transaction.
    fields:
      status: Becomes bound.
      binder_date: Date the binder was issued.
    triggers: []
  - type: insurance_effective
    target: insurance_policies
    mutation: {transition: {from: bound, to: in_force}}
    meaning: Coverage begins on the closing date.
    grain: One row per transaction.
    fields:
      status: Becomes in_force.
      effective_date: Actual closing date.
    triggers: []
  - type: insurance_premium_billed
    target: insurance_events
    meaning: Premium or a policy fee is billed to the insured.
    grain: One row per bill line.
    distinguish_by: [bill_type, bill_reference]
    fields:
      amount: Amount billed, positive.
      bill_type: Kind of bill line.
      bill_reference: Bill number printed on the premium notice, e.g. HSB-778120-03.
      due_date: Date the line is due.
      event_date: Date billed.
    account: premium_due
    direction: in
    triggers: []
  - type: insurance_payment_received
    target: insurance_events
    meaning: A premium payment is received.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      amount: Amount received, positive.
      payment_method: How it was paid.
      payment_reference: Receipt number.
      source_bill_ref: Bill number the payment is applied to.
      event_date: Date received.
    account: premium_due
    direction: out
    triggers: []
  - type: insurance_return_premium
    target: insurance_events
    meaning: Unearned premium is credited back on a cancellation or a coverage reduction.
    grain: One row per return premium credit.
    distinguish_by: [return_reason, event_date]
    fields:
      amount: Amount credited, positive.
      return_reason: Why premium is returned.
      event_date: Date credited.
    account: premium_due
    direction: out
    triggers: []
  - type: insurance_endorsed
    target: insurance_policies
    mutation: update
    meaning: Coverage on the policy is changed mid-term at the insured's request.
    grain: One row per transaction.
    fields:
      coverage_a: New dwelling coverage.
      auto_bundled: New bundle status.
      autopay: New automatic payment status.
      term_premium: Re-rated annual premium.
    triggers: []
  - type: insurance_renewed
    target: insurance_policies
    mutation: update
    meaning: The policy renews for a new one-year term.
    grain: One row per transaction.
    fields:
      coverage_a: Coverage A after the inflation guard.
      term_premium: Renewal premium.
      expiration_date: New expiration date.
    triggers: []
  - type: insurance_claim_reported
    target: insurance_events
    meaning: The insured reports a property or liability loss.
    grain: One row per loss reported.
    distinguish_by: [claim_number]
    fields:
      claim_number: Claim number assigned, e.g. HSC-30418.
      loss_cause: Cause of loss.
      loss_date: Date of loss.
      event_date: Date reported.
    triggers: []
  - type: insurance_notice_sent
    target: insurance_events
    meaning: A policy notice is sent to the insured.
    grain: One row per notice per date.
    distinguish_by: [notice_type, event_date]
    fields:
      notice_type: Kind of notice.
      event_date: Date sent.
    triggers: []
  - type: insurance_cancelled
    target: insurance_policies
    mutation: {transition: [{from: bound, to: cancelled}, {from: in_force, to: cancelled}]}
    meaning: The policy or binder is cancelled.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      cancellation_reason: Why it was cancelled.
      end_date: Cancellation effective date.
    triggers:
      - event: insurance:insurance_return_premium
        when: {cancellation_reason: [insured_request, closing_cancelled]}
        map: {return_reason: cancellation, event_date: end_date}
  - type: insurance_reinstated
    target: insurance_policies
    mutation: {transition: {from: cancelled, to: in_force}}
    meaning: A policy cancelled for non-payment is reinstated without a lapse.
    grain: One row per transaction.
    fields:
      status: Becomes in_force.
      end_date: Cleared to empty.
    triggers:
      - event: insurance:insurance_premium_billed
        map: {bill_type: reinstatement_fee}
  - type: insurance_non_renewed
    target: insurance_policies
    mutation: {transition: {from: in_force, to: non_renewed}}
    meaning: The policy ends at expiration without renewal.
    grain: One row per transaction.
    fields:
      status: Becomes non_renewed.
      end_date: Expiration date.
    triggers: []

measures:
  - id: insurance_msr_claims_3yr
    window: Trailing claims_free_years_required years ending on the renewal effective date.
    measure: Count of insurance_claim_reported rows on the insured's policies on the same home.
  - id: insurance_msr_overdue_balance
    window: Point in time on the frozen date.
    measure: Sum of insurance_premium_billed amounts whose due_date is before the frozen date, less payments applied to those bill numbers.

policies:
  - id: insurance_agg_multi_holding
    subject: [insurance_quoted]
    rule: >-
      A customer may hold homeowners policies on any number of homes they own (max_per_customer null),
      but each Calloway home carries one policy from the agency at a time.
    eligibility: []
    params:
      max_per_customer: null

  - id: insurance_agg_one_policy_per_home
    subject: [insurance_quoted]
    rule: >-
      A new quote is issued only for a home with no policy in status bound or in_force; a quote on a
      home that already has one replaces the old quote, never the bound policy. A quote is issued only for a purchase agreement with no other policy in status bound or in_force.
    eligibility:
      - id: one_bound_policy
        applies_to: [insurance_quoted]
        kind: dedup
        condition: "A quote is issued only for a purchase agreement with no other policy in status bound or in_force."
        evidence_fields: [insurance_policies.purchase_id, insurance_policies.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insurance_policies.purchase_id]
          action_bindings:
            insurance_policies.purchase_id: purchase_id
        dedup_contract:
          table: insurance_policies
          mode: same_record
          object_bindings: {purchase_id: purchase_id}
          duplicate_filters: {status: [bound, in_force]}
          distinct_fields: []

  - id: insurance_rating
    subject: [insurance_quoted, insurance_endorsed, insurance_renewed]
    rule: >-
      The program is the one whose Coverage A band contains the dwelling coverage, and Coverage A may
      not be below the home's contract price less the lot premium. The base premium is Coverage A
      divided by 1,000 times base_rate_per_1000_usd, increased by coastal_wind_surcharge_pct in a
      coastal wind community (Harbor Pines and Palmetto Shoals). Discounts are added together and
      capped at max_total_discount_pct: new_home_discount_pct on the first term, builder_affiliate_discount_pct
      when the purchase agreement's financing_type is calloway_home_mortgage,
      bundle_discount_pct when auto_bundled is true, autopay_discount_pct when autopay is true,
      paid_in_full_discount_pct on the annual plan, and claims_free_renewal_discount_pct at renewal
      when insurance_msr_claims_3yr is zero. The term premium is the surcharged base premium times one
      minus the capped discount, rounded half up to the cent. In a coastal wind community the named-storm
      deductible is hurricane_deductible_pct of Coverage A; elsewhere wind and hail losses carry
      wind_hail_deductible_pct.
    eligibility: []
    params:
      coastal_wind_communities: [Harbor Pines, Palmetto Shoals]
      per_tier:
        HomeShield Essential: {rate: "=base_rate_per_1000_usd", max_discount: "=max_total_discount_pct"}
        HomeShield Standard: {rate: "=base_rate_per_1000_usd", max_discount: "=max_total_discount_pct"}
        HomeShield Plus: {rate: "=base_rate_per_1000_usd", max_discount: "=max_total_discount_pct"}
        HomeShield Preferred: {rate: "=base_rate_per_1000_usd", max_discount: "=max_total_discount_pct"}
        HomeShield Premier: {rate: "=base_rate_per_1000_usd", max_discount: "=max_total_discount_pct"}
        HomeShield Estate: {rate: "=base_rate_per_1000_usd", max_discount: "=max_total_discount_pct"}
    measures: [insurance_msr_claims_3yr]

  - id: insurance_binding
    subject: [insurance_bound, insurance_effective, insurance_premium_billed]
    rule: >-
      A quote is bound when the insured accepts it and the first installment (or the full premium on
      the annual plan) is received; the binder is sent to the lender. The binder should be issued at
      least binder_lead_days before the purchase agreement's scheduled closing date. Coverage becomes
      effective on the actual closing date, and if the closing date moves the effective date moves with
      it. A binder is issued only while the policy status is quoted.
    eligibility: []

  - id: insurance_billing
    subject: [insurance_premium_billed, insurance_payment_received]
    rule: >-
      The term premium is billed in equal installments under the chosen plan from installment_plans,
      the last installment absorbing any rounding cent; every installment after the first carries
      installment_fee_usd as an installment_fee line. Payments use payment_methods and are applied to
      the oldest open bill line first. An installment paid after its due date carries late_fee_usd.
    eligibility: []

  - id: insurance_nonpayment
    subject: [insurance_notice_sent, insurance_cancelled, insurance_reinstated]
    rule: >-
      When an installment is unpaid grace_days calendar days after its due date, a nonpayment_notice is
      sent. The policy may be cancelled for non-payment only when at least nonpayment_notice_days calendar days have passed since the non-payment notice was sent.
      Counting starts the day after the notice date and cancellation is allowed on the last counted
      day, provided insurance_msr_overdue_balance is still above zero. A policy cancelled for non-payment
      may be reinstated within reinstatement_window_days calendar days after cancellation when every
      overdue amount and the reinstatement_fee_usd are paid; coverage then continues without a lapse.
    eligibility:
      - id: notice_period
        applies_to: [insurance_cancelled]
        kind: time
        condition: "The policy may be cancelled for non-payment only when at least nonpayment_notice_days calendar days have passed since the non-payment notice was sent."
        evidence_fields: [insurance_events.event_date, insurance_events.notice_type, insurance_policies.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insurance_policies.policy_id]
          action_bindings:
            insurance_policies.policy_id: policy_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the non-payment notice was sent
          anchor_source: insurance_events.event_date
          relation: not_before
          duration_source: variants.nonpayment_notice_days
          unit: calendar_days
          counting_rule: Counting starts the day after the notice date and cancellation is allowed on the last counted day
          boundary: inclusive
    measures: [insurance_msr_overdue_balance]

  - id: insurance_insured_cancellation
    subject: [insurance_cancelled, insurance_return_premium]
    rule: >-
      An insured cancellation is effective on the date requested, never earlier than the request. A cancellation is a free-look cancellation when it is effective within free_look_days calendar days after the effective date.
      Counting starts the day after the effective date and the last counted day qualifies. A free-look
      cancellation, and a binder cancelled because the closing did not happen, return the full premium
      paid. Any other insured cancellation returns the unearned premium (term premium times unused days
      divided by days in the term) less short_rate_penalty_pct of it, but never leaves less than
      min_earned_premium_pct of the term premium earned. Return premium is paid within
      refund_processing_days.
    eligibility:
      - id: free_look_window
        applies_to: [insurance_return_premium]
        kind: time
        condition: "A cancellation is a free-look cancellation when it is effective within free_look_days calendar days after the effective date."
        evidence_fields: [insurance_policies.effective_date, insurance_policies.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insurance_policies.policy_id]
          action_bindings:
            insurance_policies.policy_id: policy_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the effective date
          anchor_source: insurance_policies.effective_date
          relation: not_after
          duration_source: variants.free_look_days
          unit: calendar_days
          counting_rule: Counting starts the day after the effective date and the last counted day qualifies
          boundary: inclusive

  - id: insurance_endorsements
    subject: [insurance_endorsed, insurance_premium_billed, insurance_return_premium]
    rule: >-
      A mid-term change re-rates the policy under insurance_rating and bills or returns the pro-rata
      difference for the remaining days of the term; each insured-requested endorsement carries
      endorsement_fee_usd. Coverage A may be raised mid-term by at most
      midterm_coverage_a_increase_max_pct percent; a larger increase, or one that moves the policy
      out of its program's Coverage A band, requires a new quote. An endorsement is written only on a policy whose status is in_force.
    eligibility:
      - id: endorse_state
        applies_to: [insurance_endorsed]
        kind: state
        condition: "An endorsement is written only on a policy whose status is in_force."
        evidence_fields: [insurance_policies.status, insurance_policies.policy_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [insurance_policies.policy_id]
          action_bindings:
            insurance_policies.policy_id: policy_id
        state_contract:
          field: insurance_policies.status
          allowed: [in_force]

  - id: insurance_renewal
    subject: [insurance_renewed, insurance_non_renewed, insurance_notice_sent]
    rule: >-
      A renewal offer is sent renewal_offer_days_before calendar days before expiration. At renewal
      Coverage A rises by inflation_guard_pct percent, rounded to the nearest 1,000 dollars, the
      new-home discount drops away, and the renewal premium before discounts may not exceed the expiring
      premium before discounts by more than max_renewal_increase_pct percent. A policy with an overdue
      balance at expiration is not renewed.
    eligibility: []

  - id: insurance_claims
    subject: [insurance_claim_reported]
    rule: >-
      A loss is reported against the policy in force on the loss date. Workmanship and construction
      defects on a Calloway home are not insured losses and are referred to the Calloway Limited Home
      Warranty. Roof losses settle at replacement cost until the roof is roof_age_acv_years old.
    eligibility: []
