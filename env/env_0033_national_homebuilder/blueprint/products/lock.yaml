# Builder Extended Rate Lock charter — Calloway Home Mortgage (the Calloway affiliated lender).
# A buyer financing through Calloway Home Mortgage may lock the interest rate on the loan for a
# home under contract. Longer lock terms protect the rate through construction and are priced with
# a rate premium and an upfront lock fee that is credited at closing. The lock term is the tier.

category: lock
display_name: Builder Extended Rate Lock

binding:
  holding_table: rate_locks
  event_tables: [lock_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {lock_fee_held: lock_fee, charges_due: lock_charges}

lifecycle:
  states: [requested, locked, expired, funded, cancelled, withdrawn]
  transitions:
    - {from: requested, to: locked, by: agent, means: "The lock fee (if any) is paid and the lock desk confirms the locked rate and expiration date."}
    - {from: locked, to: expired, by: system, means: "The lock expiration date passed without funding or extension."}
    - {from: expired, to: locked, by: agent, means: "An expired lock is relocked within the relock window at worse-of pricing."}
    - {from: locked, to: funded, by: agent, means: "The loan funds at closing on the locked terms."}
    - {from: requested, to: cancelled, by: system, means: "The purchase agreement is cancelled or terminated before the lock is confirmed."}
    - {from: locked, to: cancelled, by: system, means: "The purchase agreement is cancelled or terminated while the lock is in force."}
    - {from: expired, to: cancelled, by: system, means: "The purchase agreement is cancelled or terminated after the lock expired."}
    - {from: requested, to: withdrawn, by: user, means: "The buyer withdraws the lock request."}
    - {from: locked, to: withdrawn, by: user, means: "The buyer withdraws the lock, for example to finance elsewhere."}

accounts:
  - key: lock_fee
    unit: USD
    meaning: Upfront lock fee paid by the buyer and held by Calloway Home Mortgage until it is credited at closing, refunded or forfeited.
  - key: lock_charges
    unit: USD
    meaning: Extension, relock, float-down and program change charges owed on the lock and not yet collected at funding or waived.

parameter_schema:
  lock_term_days: Calendar days from the lock date to the lock expiration date.
  upfront_fee_pct: Upfront lock fee, percent of the loan amount.
  upfront_fee_min_usd: Minimum upfront lock fee (USD) when the percent applies.
  fee_due_business_days: Business days after the lock request by which the upfront fee must be paid for the lock to be confirmed.
  fee_credited_at_closing: Whether the upfront fee is credited to the buyer at funding.
  fee_refundable_on_builder_delay: Whether the upfront fee is refunded when the purchase agreement is cancelled for builder delay.
  refund_on_loan_denial_pct: Percent of the upfront fee refunded when the loan is denied and the purchase is cancelled for financing denial.
  rate_premium_pct: Rate premium in percentage points added to the par rate for this lock term.
  extension_increment_days: Calendar days added by one extension increment.
  extension_fee_pct_per_increment: Extension fee per increment, percent of the loan amount.
  extension_fee_min_usd: Minimum extension fee (USD) per increment.
  max_extension_increments: Maximum extension increments per lock.
  max_total_extension_days: Maximum total calendar days of extensions per lock.
  first_extension_free: Whether the first extension increment carries no fee.
  float_down_min_improvement_pct: Minimum drop in percentage points of the current offered rate below the locked rate for a float-down.
  float_down_fee_pct: Float-down fee, percent of the loan amount.
  float_down_fee_min_usd: Minimum float-down fee (USD).
  max_float_downs: Maximum float-downs per lock (0 means not available).
  float_down_resets_expiration: Whether a float-down changes the lock expiration date.
  relock_window_days: Calendar days after the lock expired within which it may be relocked.
  relock_fee_pct: Relock fee, percent of the loan amount.
  relock_fee_min_usd: Minimum relock fee (USD).
  relock_pricing_rule: How the relocked rate is set (worse_of = the higher of the expired locked rate and the current offered rate).
  relock_term_days: Calendar days a relock runs from the relock date.
  max_relocks: Maximum relocks per lock.
  program_change_fee_pct: Fee for changing loan program on a lock, percent of the new loan amount.
  program_change_resets_term: Whether a program change restarts the lock term.
  loan_amount_tolerance_pct: Percent the loan amount may rise after lock without re-pricing.
  max_ltv_pct: Highest loan-to-value percent accepted for this lock term.
  eligible_programs: Loan programs that may use this lock term.
  min_days_to_estimated_completion: Minimum calendar days from the lock request to the purchase agreement's estimated completion date for this term.
  min_construction_stage: Earliest construction stage of the home at which this lock term may be requested.
  lock_request_requires_ratified: Whether the purchase agreement must be ratified before a lock is requested.
  fee_payment_methods: Payment methods accepted for the upfront fee.
  expiry_rolls_to_business_day: Whether a lock expiring on a weekend or Calloway holiday runs to the end of the next business day.
  lock_transferable_on_lot_transfer: Whether a lock survives a homesite transfer on the purchase agreement.
  cancel_refund_processing_business_days: Business days after a cancellation within which a refund of the upfront fee is issued.
  fee_forfeit_on_withdrawal: Whether the upfront fee is forfeited when the buyer withdraws the lock.
  fee_refund_on_rescission_pct: Percent of the upfront fee refunded when the purchase agreement is rescinded.
  builder_delay_waiver_pct: Percent of an extension charge waived when the extension was needed because of a builder delay.
  conforming_limit_usd: Loan amount above which the loan is a jumbo loan.
  jumbo_extra_rate_premium_pct: Extra rate premium in percentage points for a jumbo loan.
  government_program_premium_discount_pct: Reduction in percentage points of the rate premium for fha, va and usda loans.
  expiry_notice_days_before: Calendar days before the lock expiration date on which the expiry reminder is sent.
  min_credit_score: Minimum qualifying credit score for this lock term.
  max_dti_pct: Highest qualifying debt-to-income percent for this lock term.
  lock_confirmation_business_days: Business days after the fee posts within which the lock desk confirms the lock.
  jumbo_max_loan_usd: Largest loan amount accepted on any lock.

