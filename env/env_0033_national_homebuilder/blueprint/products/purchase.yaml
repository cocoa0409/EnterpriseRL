# Home Purchase Agreement charter — Calloway Homes.
# One Home Purchase Agreement per home: a specific plan on a specific homesite in one community,
# priced as base price plus lot premium (design studio options are carried by the design charter).
# The collection (the home series) is the tier: it is set by the product line the homesite is
# platted for and drives earnest money, contingencies, closing terms, incentives and fees.

category: purchase
display_name: Home Purchase Agreement

binding:
  holding_table: purchase_agreements
  event_tables: [purchase_events]
  intake_tables: [purchase_cancellation_requests]
  status_field: status
  variant_field: variant_name
  quantity_fields: {earnest_money_held: earnest_money, buyer_charges_due: buyer_charges, incentive_balance: incentive_credit}

lifecycle:
  states: [pending_ratification, ratified, under_construction, closing_scheduled, closed, cancelled, terminated]
  transitions:
    - {from: pending_ratification, to: ratified, by: agent, means: "All deposits due at signing have posted and Calloway countersigns, so the agreement is in force."}
    - {from: pending_ratification, to: cancelled, by: system, means: "The deposits due at signing did not post in time, so the agreement is void and anything posted is refunded."}
    - {from: ratified, to: under_construction, by: system, means: "Construction starts on the homesite (foundation)."}
    - {from: ratified, to: closing_scheduled, by: agent, means: "On a completed inventory home, the closing date is set."}
    - {from: under_construction, to: closing_scheduled, by: agent, means: "The home nears completion and the closing date is set with notice to the buyer."}
    - {from: closing_scheduled, to: closed, by: agent, means: "The sale funds and records; the buyer takes title and possession."}
    - {from: ratified, to: cancelled, by: user, means: "The buyer confirms a cancellation request (rescission, contingency, builder delay or mutual release)."}
    - {from: under_construction, to: cancelled, by: user, means: "The buyer confirms a cancellation request during construction."}
    - {from: closing_scheduled, to: cancelled, by: user, means: "The buyer confirms a cancellation request after the closing date was set."}
    - {from: ratified, to: terminated, by: agent, means: "Calloway terminates for an uncured buyer default."}
    - {from: under_construction, to: terminated, by: agent, means: "Calloway terminates for an uncured buyer default during construction."}
    - {from: closing_scheduled, to: terminated, by: agent, means: "Calloway terminates because the buyer failed to close after notice and cure."}

accounts:
  - key: earnest_money
    unit: USD
    meaning: Earnest money and other purchase deposits Calloway holds on the agreement (initial earnest money, additional deposit, lot premium deposit, contingency deposit and transferred reservation funds).
  - key: buyer_charges
    unit: USD
    meaning: Fees and per diem charges the buyer owes on the agreement that have not yet been paid at closing or waived.
  - key: incentive_credit
    unit: USD
    meaning: Builder incentive dollars granted on the agreement and not yet applied at closing or revoked.

parameter_schema:
  base_price_floor_usd: Lowest base price (USD) of a plan in this collection.
  base_price_ceiling_usd: Highest base price (USD) of a plan in this collection.
  initial_em_pct: Initial earnest money as a percent of the contract price (base price plus lot premium).
  initial_em_min_usd: Minimum initial earnest money (USD) regardless of the percent.
  em_due_business_days: Business days after the contract date by which every deposit due at signing must post.
  additional_deposit_pct: Additional deposit due at construction start, percent of the contract price.
  additional_deposit_due_days: Calendar days after the construction start date by which the additional deposit must post.
  outside_lender_extra_em_pct: Extra earnest money, percent of the contract price, due at signing when financing_type is outside_lender or cash.
  cash_proof_of_funds_days: Calendar days after the contract date by which a cash buyer must deliver proof of funds.
  sale_contingency_allowed: Whether an agreement may be written contingent on the sale of the buyer's current home.
  sale_contingency_extra_em_usd: Extra earnest money (USD) due at signing on an agreement with a home-sale contingency.
  sale_contingency_days: Calendar days after the contract date to the contingency deadline.
  kick_out_response_days: Calendar days after a kick-out notice within which the buyer must release the home-sale contingency.
  rescission_business_days: Business days after the contract date within which the buyer may rescind with a full refund.
  loan_application_days: Calendar days after the contract date by which a financed buyer must complete a full loan application.
  financing_contingency_days: Calendar days after the contract date within which a written loan denial lets the buyer cancel with a refund.
  financing_denial_refund_pct: Percent of refundable earnest money returned on a cancellation for loan denial.
  closing_cost_incentive_usd: Closing cost incentive (USD) granted when the incentive conditions are met.
  rate_buydown_incentive_usd: Rate buydown incentive (USD) granted when the incentive conditions are met.
  incentive_requires_affiliated_lender: Whether incentives require financing through Calloway Home Mortgage.
  incentive_requires_affiliated_title: Whether incentives require closing through Calloway Title.
  incentive_close_by_days: On an inventory home, calendar days after the contract date by which closing must occur for incentives to apply.
  closing_notice_days: Minimum calendar days between the closing date notice and the scheduled closing date.
  closing_extension_max: Maximum buyer-requested closing extensions.
  closing_extension_days: Calendar days one closing extension adds to the scheduled closing date.
  closing_extension_fee_usd: Fee (USD) per buyer-requested closing extension.
  per_diem_usd: Per diem (USD per calendar day) charged when the buyer delays closing beyond the scheduled closing date.
  per_diem_grace_days: Calendar days after the scheduled closing date before the per diem begins.
  max_buyer_delay_days: Calendar days of buyer delay after the scheduled closing date after which a default notice is sent.
  default_cure_days: Calendar days after the default notice within which the buyer must cure.
  default_forfeiture_cap_pct: Cap on deposits Calloway retains on a buyer default, percent of the contract price.
  mutual_release_fee_usd: Administrative fee (USD) deducted on a mutual release.
  refund_processing_business_days: Business days after the cancellation date within which a refund is issued.
  returned_payment_fee_usd: Fee (USD) for a returned deposit payment.
  returned_payment_cure_business_days: Business days after notice of a returned payment within which replacement funds and the fee must post.
  wire_required_above_usd: A single deposit payment above this amount (USD) must be made by wire.
  card_payment_cap_usd: Largest card payment (USD) accepted toward deposits; 0 means card is not accepted.
  plan_change_fee_usd: Fee (USD) for changing the plan or elevation after signing.
  plan_change_cutoff_stage: Last construction stage at which a plan or elevation change is accepted.
  lot_transfer_fee_usd: Fee (USD) for moving the agreement to another homesite in the same community.
  max_lot_transfers: Maximum homesite transfers per agreement.
  assignment_allowed: Whether the buyer may assign the agreement to another person.
  builder_delay_tolerance_days: Calendar days after the contract completion date after which the buyer may cancel for builder delay.
  builder_delay_lock_extension_paid: Whether Calloway pays rate lock extension charges caused by a builder delay.
  orientation_days_before_closing: Calendar days before the scheduled closing date on which the new home orientation is held.
  contract_amendment_fee_usd: Fee (USD) for a buyer-requested amendment other than a plan change or homesite transfer (adding or removing a co-buyer, changing the vesting).
  outside_lender_approval_days: Calendar days after the contract date by which an outside-lender buyer must deliver a written loan approval.
  va_buyer_em_cap_usd: Cap (USD) on the initial earnest money for a buyer whose rate lock with Calloway Home Mortgage is on the va loan program.
  lot_premium_deposit_refundable: Whether the lot premium deposit is refundable on a buyer cancellation other than rescission or builder delay.

