events:
  - type: purchase_agreement_written
    target: purchase_agreements
    mutation: create
    meaning: The buyer signs a Home Purchase Agreement for a plan on a homesite; it awaits its signing deposits and Calloway's countersignature.
    grain: One row per agreement signed.
    fields:
      customer_id: The buyer.
      variant_name: Collection of the plan, the official tier name.
      status: Always pending_ratification on creation.
      reservation_id: The Homesite Reservation this agreement converts, empty when the homesite was not reserved first.
      community: Community of the homesite.
      lot_number: Site-plan lot number of the homesite.
      plan_name: Marketed plan and elevation name.
      base_price: Base price of the plan on the community price sheet on the contract date.
      lot_premium: Lot premium written into the agreement.
      contract_price: Base price plus lot premium.
      contract_date: Date the buyer signed.
      inventory_home: Whether the home was already complete (quick move-in) when signed.
      financing_type: How the buyer is financing.
      sale_contingency: Whether the agreement is contingent on the sale of the buyer's current home.
      contingency_deadline: Contract date plus sale_contingency_days, empty without a contingency.
      construction_stage: not_started, or complete for an inventory home.
      contract_completion_date: Estimated completion date stated in the agreement at signing.
      estimated_completion_date: Current estimated completion date, equal to the contract completion date at signing.
      closing_extensions_used: 0 on creation.
      lot_transfers_used: 0 on creation.
      earnest_money_held: 0.00 on creation.
      buyer_charges_due: 0.00 on creation.
      incentive_balance: 0.00 on creation.
    triggers:
      - event: homesite:homesite_converted
        when: {reservation_id: {not: ""}}
        map: {end_date: contract_date}
  - type: purchase_deposit_posted
    target: purchase_events
    meaning: A deposit posts to the agreement, either paid by the buyer or moved from a converted homesite reservation.
    grain: One row per deposit component per payment.
    distinguish_by: [deposit_component, payment_reference]
    fields:
      amount: Amount posted, positive.
      deposit_component: Which deposit the money is.
      payment_method: How it was paid, or internal_transfer for reservation funds.
      payment_reference: Receipt number printed on the Calloway receipt, or for a transfer the receipt number of the original reservation payment.
      event_date: Date the deposit posted.
    account: earnest_money
    direction: in
    triggers: []
  - type: purchase_ratified
    target: purchase_agreements
    mutation: {transition: {from: pending_ratification, to: ratified}}
    meaning: The signing deposits are in and Calloway countersigns; the agreement is in force.
    grain: One row per transaction.
    fields:
      status: Becomes ratified.
    triggers: []
  - type: purchase_construction_started
    target: purchase_agreements
    mutation: {transition: {from: ratified, to: under_construction}}
    meaning: The foundation is started on the homesite.
    grain: One row per transaction.
    fields:
      status: Becomes under_construction.
      construction_stage: Becomes foundation.
      construction_start_date: Date the foundation was started.
    triggers:
      - event: design:design_structural_closed
  - type: purchase_stage_updated
    target: purchase_agreements
    mutation: update
    meaning: The construction manager records the home reaching a new construction stage and refreshes the estimated completion date.
    grain: One row per transaction.
    fields:
      construction_stage: New construction stage.
      estimated_completion_date: Updated estimated completion date.
    triggers:
      - event: design:design_finalized
        when: {construction_stage: drywall}
  - type: purchase_closing_scheduled
    target: purchase_agreements
    mutation: {transition: [{from: ratified, to: closing_scheduled}, {from: under_construction, to: closing_scheduled}]}
    meaning: Calloway sets the closing date and sends the closing date notice.
    grain: One row per transaction.
    fields:
      status: Becomes closing_scheduled.
      scheduled_closing_date: The closing date set.
    triggers:
      - event: purchase:purchase_notice_sent
        map: {notice_type: closing_date_notice}
  - type: purchase_closing_extended
    target: purchase_agreements
    mutation: update
    meaning: The scheduled closing date is moved later, at the buyer's request or because of a builder delay.
    grain: One row per transaction.
    fields:
      scheduled_closing_date: New scheduled closing date.
      closing_extensions_used: Incremented by one for a buyer-requested extension, unchanged for a builder-delay move.
    triggers: []
  - type: purchase_plan_changed
    target: purchase_agreements
    mutation: update
    meaning: The plan or elevation on the agreement is changed by amendment before construction starts.
    grain: One row per transaction.
    fields:
      plan_name: New plan and elevation name.
      base_price: Base price of the new plan on the community price sheet on the amendment date.
      contract_price: New base price plus lot premium.
    triggers: []
  - type: purchase_lot_transferred
    target: purchase_agreements
    mutation: update
    meaning: The agreement is moved to another homesite in the same community by amendment.
    grain: One row per transaction.
    fields:
      lot_number: New homesite lot number.
      lot_premium: Lot premium of the new homesite on the amendment date.
      contract_price: Base price plus the new lot premium.
      lot_transfers_used: Incremented by one.
    triggers: []
  - type: purchase_financing_changed
    target: purchase_agreements
    mutation: update
    meaning: The buyer changes how the purchase is financed.
    grain: One row per transaction.
    fields:
      financing_type: New financing type.
    triggers: []
  - type: purchase_contingency_released
    target: purchase_agreements
    mutation: update
    meaning: The buyer's home-sale contingency is satisfied or waived and removed from the agreement.
    grain: One row per transaction.
    fields:
      sale_contingency: Becomes none.
      contingency_deadline: Cleared to empty.
    triggers: []
  - type: purchase_charge_assessed
    target: purchase_events
    meaning: A fee or per diem is charged to the buyer on the agreement.
    grain: One row per charge; a per diem is one row per delay period.
    distinguish_by: [charge_type, charge_reference]
    fields:
      amount: Amount charged, positive.
      charge_type: Kind of charge.
      charge_reference: Charge number printed on the buyer statement, e.g. CHG-HP-3301.
      period_start: First day of a per diem period, empty for other charges.
      period_end: Last day of a per diem period, empty for other charges.
      event_date: Date the charge was assessed.
    account: buyer_charges
    direction: in
    triggers: []
  - type: purchase_charge_waived
    target: purchase_events
    meaning: A charge on the agreement is waived in whole or in part.
    grain: One row per waived charge.
    distinguish_by: [source_charge_ref]
    fields:
      amount: Amount waived, positive.
      charge_type: Kind of charge waived.
      source_charge_ref: Charge number of the charge being waived.
      event_date: Date of the waiver.
    account: buyer_charges
    direction: out
    triggers: []
  - type: purchase_charges_collected
    target: purchase_events
    meaning: An outstanding charge is collected, at closing or by direct payment.
    grain: One row per charge collected.
    distinguish_by: [source_charge_ref]
    fields:
      amount: Amount collected, positive.
      charge_type: Kind of charge collected.
      source_charge_ref: Charge number of the charge collected.
      event_date: Date collected.
    account: buyer_charges
    direction: out
    triggers: []
  - type: purchase_deposit_refunded
    target: purchase_events
    meaning: Deposit money held on the agreement is refunded to the buyer.
    grain: One row per refunded deposit component per source payment.
    distinguish_by: [source_payment_ref, deposit_component]
    fields:
      amount: Amount refunded, positive.
      deposit_component: Deposit component refunded.
      source_payment_ref: Receipt number of the deposit payment being refunded.
      refund_reason: Why it is refunded.
      event_date: Date the refund was issued.
    account: earnest_money
    direction: out
    triggers: []
  - type: purchase_deposit_forfeited
    target: purchase_events
    meaning: Deposit money held on the agreement is retained by Calloway.
    grain: One row per forfeited deposit component per source payment.
    distinguish_by: [source_payment_ref, deposit_component]
    fields:
      amount: Amount forfeited, positive.
      deposit_component: Deposit component forfeited.
      source_payment_ref: Receipt number of the deposit payment forfeited.
      forfeiture_reason: Why it is forfeited.
      event_date: Date of forfeiture.
    account: earnest_money
    direction: out
    triggers: []
  - type: purchase_deposit_applied
    target: purchase_events
    meaning: Deposits held are credited to the buyer on the closing statement.
    grain: One row per deposit component per source payment applied.
    distinguish_by: [source_payment_ref, deposit_component]
    fields:
      amount: Amount credited, positive.
      deposit_component: Deposit component credited.
      source_payment_ref: Receipt number of the deposit payment credited.
      event_date: Closing date.
    account: earnest_money
    direction: out
    triggers: []
  - type: purchase_payment_returned
    target: purchase_events
    meaning: A deposit payment is returned unpaid by the buyer's bank.
    grain: One row per returned payment.
    distinguish_by: [source_payment_ref]
    fields:
      amount: Amount returned, positive.
      deposit_component: Deposit component the payment had funded.
      source_payment_ref: Receipt number of the returned payment.
      event_date: Date Calloway was notified of the return.
    account: earnest_money
    direction: out
    triggers:
      - event: purchase:purchase_charge_assessed
        map: {charge_type: returned_payment_fee, event_date: event_date}
  - type: purchase_incentive_granted
    target: purchase_events
    meaning: A builder incentive is granted on the agreement.
    grain: One row per incentive type granted.
    distinguish_by: [incentive_type, event_date]
    fields:
      amount: Incentive amount granted, positive.
      incentive_type: Which incentive.
      event_date: Date granted.
    account: incentive_credit
    direction: in
    triggers: []
  - type: purchase_incentive_revoked
    target: purchase_events
    meaning: A granted incentive is withdrawn because its conditions stopped being met.
    grain: One row per incentive type revoked.
    distinguish_by: [incentive_type, event_date]
    fields:
      amount: Incentive amount revoked, positive.
      incentive_type: Which incentive.
      event_date: Date revoked.
    account: incentive_credit
    direction: out
    triggers: []
  - type: purchase_incentive_applied
    target: purchase_events
    meaning: Granted incentive dollars are credited to the buyer on the closing statement.
    grain: One row per incentive type applied.
    distinguish_by: [incentive_type]
    fields:
      amount: Incentive amount credited at closing, positive.
      incentive_type: Which incentive.
      event_date: Closing date.
    account: incentive_credit
    direction: out
    triggers: []
  - type: purchase_notice_sent
    target: purchase_events
    meaning: A written contract notice is sent to the buyer.
    grain: One row per notice per date.
    distinguish_by: [notice_type, event_date]
    fields:
      notice_type: Kind of notice.
      event_date: Date the notice was sent.
    triggers: []
  - type: purchase_closed
    target: purchase_agreements
    mutation: {transition: {from: closing_scheduled, to: closed}}
    meaning: The sale funds and records and the buyer takes possession.
    grain: One row per transaction.
    fields:
      status: Becomes closed.
      end_date: Closing date.
    triggers:
      - event: purchase:purchase_deposit_applied
        map: {event_date: end_date}
      - event: purchase:purchase_incentive_applied
        map: {event_date: end_date}
      - event: purchase:purchase_charges_collected
        map: {event_date: end_date}
      - event: design:design_delivered
        map: {end_date: end_date}
      - event: warranty:warranty_coverage_enrolled
        map: {purchase_id: purchase_id, coverage_start_date: end_date}
  - type: purchase_cancelled
    target: purchase_agreements
    mutation: {transition: [{from: pending_ratification, to: cancelled}, {from: ratified, to: cancelled}, {from: under_construction, to: cancelled}, {from: closing_scheduled, to: cancelled}]}
    meaning: The agreement ends without closing on a void, rescission, contingency, builder delay or mutual release.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: Cancellation date (the date the buyer confirmed the cancellation, or the void date).
    triggers:
      - event: design:design_cancelled
        map: {end_date: end_date}
      - event: lock:lock_cancelled
        map: {end_date: end_date}
  - type: purchase_terminated
    target: purchase_agreements
    mutation: {transition: [{from: ratified, to: terminated}, {from: under_construction, to: terminated}, {from: closing_scheduled, to: terminated}]}
    meaning: Calloway terminates the agreement for an uncured buyer default.
    grain: One row per transaction.
    fields:
      status: Becomes terminated.
      end_date: Termination date.
    triggers:
      - event: purchase:purchase_deposit_forfeited
        map: {forfeiture_reason: buyer_default, event_date: end_date}
      - event: design:design_cancelled
        map: {end_date: end_date}
      - event: lock:lock_cancelled
        map: {end_date: end_date}

measures:
  - id: purchase_msr_open_agreements
    window: Point in time on the frozen date.
    measure: Count of this buyer's purchase_agreements in status pending_ratification, ratified, under_construction or closing_scheduled, excluding the agreement being handled.
  - id: purchase_msr_buyer_delay_days
    window: From the day after the scheduled closing date through the frozen date.
    measure: Calendar days elapsed after scheduled_closing_date on an agreement still in status closing_scheduled.
  - id: purchase_msr_deposits_by_component
    window: Life of the agreement.
    measure: Sum of purchase_deposit_posted amounts minus purchase_payment_returned, refunded, forfeited and applied amounts, grouped by deposit_component.

policies:
  - id: purchase_agg_multi_holding
    subject: [purchase_agreement_written]
    rule: >-
      A buyer may have up to max_per_customer Home Purchase Agreements open at once (status
      pending_ratification, ratified, under_construction or closing_scheduled); closed, cancelled and
      terminated agreements do not count. The buyer's purchase_msr_open_agreements is below max_per_customer before the agreement is written.
      An agreement that would exceed the cap is not written.
    eligibility:
      - id: open_agreement_cap
        applies_to: [purchase_agreement_written]
        kind: authorization
        condition: "The buyer's purchase_msr_open_agreements is below max_per_customer before the agreement is written."
        evidence_fields: [purchase_agreements.customer_id, purchase_agreements.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.customer_id]
          action_bindings:
            purchase_agreements.customer_id: customer_id
    params:
      max_per_customer: 2
    measures: [purchase_msr_open_agreements]

  - id: purchase_agg_concurrent_agreements
    subject: [purchase_agreement_written, purchase_incentive_granted, purchase_deposit_posted]
    rule: >-
      When the buyer already has another open agreement (purchase_msr_open_agreements of at least one),
      the new agreement may not carry a home-sale contingency, its initial earnest money is raised by
      second_agreement_em_uplift_pct percent of its contract price (rounded half up to the cent), posted
      as a concurrent_agreement_deposit on top of every other component. Only one open agreement per buyer may carry builder incentives: incentives are granted on the earlier-dated agreement and not on the later one.
    eligibility:
      - id: one_incentive_agreement
        applies_to: [purchase_incentive_granted]
        kind: authorization
        condition: "Only one open agreement per buyer may carry builder incentives: incentives are granted on the earlier-dated agreement and not on the later one."
        evidence_fields: [purchase_agreements.customer_id, purchase_agreements.contract_date, purchase_agreements.status, purchase_events.incentive_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.customer_id]
          action_bindings:
            purchase_agreements.customer_id: customer_id
    params:
      second_agreement_em_uplift_pct: 5.0
    measures: [purchase_msr_open_agreements]

  - id: purchase_earnest_money
    subject: [purchase_agreement_written, purchase_deposit_posted]
    rule: >-
      The initial earnest money is the greater of initial_em_pct percent of the contract price
      (rounded half up to the cent) and initial_em_min_usd. Where the buyer's rate lock with Calloway
      Home Mortgage on this agreement carries loan_program va, the initial earnest money is capped at
      va_buyer_em_cap_usd. On top of the initial earnest money the buyer posts, at signing,
      outside_lender_extra_em_pct percent of the contract price when financing_type is outside_lender
      or cash, sale_contingency_extra_em_usd when the agreement carries a home-sale contingency, and the
      lot premium deposit required by homesite_conversion when the homesite was reserved first (reduced
      by premium holding fee and creditable extension fees moved from the reservation); a transferred
      reservation deposit counts toward the initial earnest money. The VA cap applies to the initial
      earnest money only and never to the extra components. An additional deposit of
      additional_deposit_pct percent of the contract price is due after construction starts. The additional deposit must post within additional_deposit_due_days calendar days after the construction start date.
      Counting starts the day after the construction start date and the last counted day is included;
      a missed additional deposit is a buyer default handled by purchase_default_termination. Any single
      payment above wire_required_above_usd must be a wire, and a card payment may not exceed
      card_payment_cap_usd (a cap of zero means card is not accepted).
    eligibility:
      - id: additional_deposit_deadline
        applies_to: [purchase_deposit_posted]
        kind: time
        condition: "The additional deposit must post within additional_deposit_due_days calendar days after the construction start date."
        evidence_fields: [purchase_agreements.construction_start_date, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the construction start date
          anchor_source: purchase_agreements.construction_start_date
          relation: not_after
          duration_source: variants.additional_deposit_due_days
          unit: calendar_days
          counting_rule: Counting starts the day after the construction start date and the last counted day is included
          boundary: inclusive
    formula:
      initial_em: max(round(contract_price * initial_em_pct / 100, 2), initial_em_min_usd)
      outside_lender_extra: round(contract_price * outside_lender_extra_em_pct / 100, 2)
      additional_deposit: round(contract_price * additional_deposit_pct / 100, 2)

  - id: purchase_ratification
    subject: [purchase_ratified, purchase_cancelled, purchase_deposit_posted, purchase_deposit_refunded]
    rule: >-
      An agreement is ratified when every deposit due at signing under purchase_earnest_money has
      posted and has not been returned. All deposits due at signing must post within em_due_business_days business days after the contract date.
      Business days are Monday through Friday excluding Calloway holidays, counting starts the next
      business day after the contract date, and a deposit posting on the last counted business day is
      on time. If they have not, the system voids the agreement (pending_ratification to cancelled) and
      every dollar posted is refunded with reason void_unfunded, including transferred reservation
      funds; no fee is charged on a void.
    eligibility:
      - id: signing_deposit_deadline
        applies_to: [purchase_ratified]
        kind: time
        condition: "All deposits due at signing must post within em_due_business_days business days after the contract date."
        evidence_fields: [purchase_agreements.contract_date, purchase_events.event_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.contract_date]
          action_bindings:
            purchase_agreements.contract_date: contract_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract date
          anchor_source: purchase_agreements.contract_date
          relation: not_after
          duration_source: variants.em_due_business_days
          unit: business_days
          counting_rule: Business days are Monday through Friday excluding Calloway holidays, counting starts the next business day after the contract date, and a deposit posting on the last counted business day is on time
          boundary: inclusive
    measures: [purchase_msr_deposits_by_component]

  - id: purchase_rescission
    subject: [purchase_cancelled, purchase_deposit_refunded]
    rule: >-
      A buyer may rescind a ratified agreement for any reason and receive every deposit back, the lot
      premium deposit and transferred reservation funds included, with no fee. A cancellation request with basis rescission is honored only when it is received within rescission_business_days business days after the contract date.
      Business days are Monday through Friday excluding Calloway holidays and counting starts the next
      business day after the contract date; a request received on the last counted business day is
      timely. A late rescission request is handled as a mutual release under
      purchase_cancellation_refund. The refund is issued within refund_processing_business_days.
    eligibility:
      - id: rescission_window
        applies_to: [purchase_cancelled]
        kind: time
        condition: "A cancellation request with basis rescission is honored only when it is received within rescission_business_days business days after the contract date."
        evidence_fields: [purchase_agreements.contract_date, purchase_cancellation_requests.received_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.contract_date, purchase_cancellation_requests.received_date]
          action_bindings:
            purchase_agreements.contract_date: contract_date
            purchase_cancellation_requests.received_date: received_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract date
          anchor_source: purchase_agreements.contract_date
          relation: not_after
          duration_source: variants.rescission_business_days
          unit: business_days
          counting_rule: Business days are Monday through Friday excluding Calloway holidays and counting starts the next business day after the contract date
          boundary: inclusive

  - id: purchase_financing_contingency
    subject: [purchase_cancelled, purchase_deposit_refunded, purchase_financing_changed, purchase_notice_sent]
    rule: >-
      A financed buyer must complete a full loan application within loan_application_days after the
      contract date; an outside-lender buyer must also deliver a written loan approval within
      outside_lender_approval_days, and a cash buyer must deliver proof of funds within
      cash_proof_of_funds_days. A missed item is a buyer default and starts purchase_default_termination
      with a default_notice. A buyer whose loan is denied in writing may cancel with refund of
      financing_denial_refund_pct percent of the refundable deposits. A cancellation request with basis financing_denial is honored only when it is received within financing_contingency_days calendar days after the contract date.
      Counting starts the day after the contract date and the last counted day is included. The lot
      premium deposit is refunded on a financing denial only where lot_premium_deposit_refundable is
      true. A cash buyer has no financing contingency. A change of financing_type after signing is
      recorded as purchase_financing_changed; a change to outside_lender or cash makes the
      outside_lender_extra_em_pct component due within em_due_business_days business days of the change
      and revokes incentives under purchase_incentives.
    eligibility:
      - id: financing_contingency_window
        applies_to: [purchase_cancelled]
        kind: time
        condition: "A cancellation request with basis financing_denial is honored only when it is received within financing_contingency_days calendar days after the contract date."
        evidence_fields: [purchase_agreements.contract_date, purchase_cancellation_requests.received_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.contract_date, purchase_cancellation_requests.received_date]
          action_bindings:
            purchase_agreements.contract_date: contract_date
            purchase_cancellation_requests.received_date: received_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract date
          anchor_source: purchase_agreements.contract_date
          relation: not_after
          duration_source: variants.financing_contingency_days
          unit: calendar_days
          counting_rule: Counting starts the day after the contract date and the last counted day is included
          boundary: inclusive

  - id: purchase_sale_contingency
    subject: [purchase_agreement_written, purchase_contingency_released, purchase_notice_sent, purchase_cancelled, purchase_deposit_refunded]
    rule: >-
      A home-sale contingency may be written only where sale_contingency_allowed is true, and its
      deadline is the contract date plus sale_contingency_days. When Calloway accepts a backup offer on
      the homesite it sends a kick_out_notice. The contingency must be released within kick_out_response_days calendar days after the kick-out notice was sent.
      Counting starts the day after the notice date and the last counted day is included. If the
      buyer releases the contingency in time the agreement continues without it; otherwise, and also
      when the contingency deadline passes unsatisfied, the buyer's cancellation with basis kick_out or
      sale_contingency_not_met refunds every deposit except the lot premium deposit, which follows
      lot_premium_deposit_refundable.
    eligibility:
      - id: kick_out_window
        applies_to: [purchase_contingency_released]
        kind: time
        condition: "The contingency must be released within kick_out_response_days calendar days after the kick-out notice was sent."
        evidence_fields: [purchase_events.event_date, purchase_events.notice_type, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the kick-out notice was sent
          anchor_source: purchase_events.event_date
          relation: not_after
          duration_source: variants.kick_out_response_days
          unit: calendar_days
          counting_rule: Counting starts the day after the notice date and the last counted day is included
          boundary: inclusive

  - id: purchase_closing_schedule
    subject: [purchase_closing_scheduled, purchase_closing_extended, purchase_charge_assessed, purchase_notice_sent]
    rule: >-
      The scheduled closing date must be at least closing_notice_days calendar days after the date of
      the closing_date_notice, and the new home orientation is held orientation_days_before_closing
      days before it. A buyer may move the scheduled closing date later up to closing_extension_max
      times; each extension adds closing_extension_days calendar days to the current scheduled closing
      date and carries closing_extension_fee_usd as a closing_extension_fee charge. A closing extension is written only on an agreement whose status is closing_scheduled.
      When the buyer does not close on the scheduled closing date for a reason on the buyer's side, a
      closing_delay_per_diem of per_diem_usd per calendar day accrues from the day after
      per_diem_grace_days have elapsed, booked as one charge per delay period with its first and last
      day; once purchase_msr_buyer_delay_days exceeds max_buyer_delay_days Calloway sends a
      default_notice under purchase_default_termination. A move of the closing date caused by a
      builder delay is written as a closing extension without fee, does not use one of the buyer's
      extensions and accrues no per diem.
    eligibility:
      - id: extension_state
        applies_to: [purchase_closing_extended]
        kind: state
        condition: "A closing extension is written only on an agreement whose status is closing_scheduled."
        evidence_fields: [purchase_agreements.status, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
        state_contract:
          field: purchase_agreements.status
          allowed: [closing_scheduled]
    params:
      per_tier:
        Pathway Collection: {extension_fee: "=closing_extension_fee_usd", per_diem: "=per_diem_usd", grace_days: "=per_diem_grace_days"}
        Meadow Collection: {extension_fee: "=closing_extension_fee_usd", per_diem: "=per_diem_usd", grace_days: "=per_diem_grace_days"}
        Heritage Collection: {extension_fee: "=closing_extension_fee_usd", per_diem: "=per_diem_usd", grace_days: "=per_diem_grace_days"}
        Crestview Collection: {extension_fee: "=closing_extension_fee_usd", per_diem: "=per_diem_usd", grace_days: "=per_diem_grace_days"}
        Summit Collection: {extension_fee: "=closing_extension_fee_usd", per_diem: "=per_diem_usd", grace_days: "=per_diem_grace_days"}
        Reserve Collection: {extension_fee: "=closing_extension_fee_usd", per_diem: "=per_diem_usd", grace_days: "=per_diem_grace_days"}
    formula:
      per_diem_days: max(purchase_msr_buyer_delay_days - per_diem_grace_days, 0)
      per_diem_charge: per_diem_days * per_diem_usd
    measures: [purchase_msr_buyer_delay_days]

  - id: purchase_builder_delay
    subject: [purchase_cancelled, purchase_deposit_refunded, purchase_closing_extended, purchase_stage_updated]
    rule: >-
      Each construction stage update refreshes the estimated completion date; the contract completion
      date stated at signing never changes. A cancellation request with basis builder_delay is honored only when the home is not complete and the request is received no earlier than builder_delay_tolerance_days calendar days after the contract completion date.
      Counting starts the day after the contract completion date and the request may be honored on the
      last counted day. On such a cancellation every deposit is refunded, the lot premium deposit and
      transferred reservation funds included, and no mutual release fee is charged. Where
      builder_delay_lock_extension_paid is true, rate lock extension charges caused by a builder delay
      are borne by Calloway and waived on the lock.
    eligibility:
      - id: builder_delay_threshold
        applies_to: [purchase_cancelled]
        kind: time
        condition: "A cancellation request with basis builder_delay is honored only when the home is not complete and the request is received no earlier than builder_delay_tolerance_days calendar days after the contract completion date."
        evidence_fields: [purchase_agreements.contract_completion_date, purchase_agreements.construction_stage, purchase_cancellation_requests.received_date]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.contract_completion_date, purchase_cancellation_requests.received_date]
          action_bindings:
            purchase_agreements.contract_completion_date: contract_completion_date
            purchase_cancellation_requests.received_date: received_date
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract completion date
          anchor_source: purchase_agreements.contract_completion_date
          relation: not_before
          duration_source: variants.builder_delay_tolerance_days
          unit: calendar_days
          counting_rule: Counting starts the day after the contract completion date and the request may be honored on the last counted day
          boundary: inclusive

  - id: purchase_default_termination
    subject: [purchase_terminated, purchase_deposit_forfeited, purchase_deposit_refunded, purchase_notice_sent]
    rule: >-
      A buyer default is a missed additional deposit, an uncured returned payment, a missed loan
      application, approval or proof of funds deadline, or a buyer delay beyond max_buyer_delay_days.
      Calloway first sends a default_notice. The agreement may be terminated only when at least default_cure_days calendar days have passed since the default notice was sent.
      Counting starts the day after the notice date and termination is allowed on the last counted
      day, provided the default is still uncured. On termination Calloway retains deposits up to
      default_forfeiture_cap_pct percent of the contract price (rounded half up to the cent), taking the
      lot premium deposit first, then the additional deposit, then initial earnest money and
      transferred reservation funds; any deposit beyond the cap is refunded with reason
      excess_over_forfeiture_cap. Outstanding charges remain owed.
    eligibility:
      - id: cure_period
        applies_to: [purchase_terminated]
        kind: time
        condition: "The agreement may be terminated only when at least default_cure_days calendar days have passed since the default notice was sent."
        evidence_fields: [purchase_events.event_date, purchase_events.notice_type, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the default notice was sent
          anchor_source: purchase_events.event_date
          relation: not_before
          duration_source: variants.default_cure_days
          unit: calendar_days
          counting_rule: Counting starts the day after the notice date and termination is allowed on the last counted day
          boundary: inclusive
    formula:
      forfeiture_cap: round(contract_price * default_forfeiture_cap_pct / 100, 2)

  - id: purchase_incentives
    subject: [purchase_incentive_granted, purchase_incentive_revoked, purchase_incentive_applied]
    rule: >-
      At ratification the agreement is granted closing_cost_incentive_usd as closing_cost_credit and
      rate_buydown_incentive_usd as rate_buydown_credit when financing_type is calloway_home_mortgage
      (where incentive_requires_affiliated_lender is true) and the buyer closes with Calloway Title
      (where incentive_requires_affiliated_title is true); a cash or outside-lender agreement receives
      no incentive. When financing_type later changes away from calloway_home_mortgage, every granted
      incentive is revoked on the change date. At closing the incentives are applied in the order
      rate_buydown_credit then closing_cost_credit, and their total may not exceed the seller
      concession cap: concession_cap_pct for the loan_program on the buyer's Calloway Home Mortgage
      rate lock, times the contract price, rounded half up to the cent; the part above the cap is
      revoked, not paid in cash. On an inventory home, incentives apply only when the closing happens within incentive_close_by_days calendar days after the contract date.
      Counting starts the day after the contract date and a closing on the last counted day
      qualifies; otherwise the incentives are revoked on the closing date.
    eligibility:
      - id: inventory_close_by
        applies_to: [purchase_incentive_applied]
        kind: time
        condition: "On an inventory home, incentives apply only when the closing happens within incentive_close_by_days calendar days after the contract date."
        evidence_fields: [purchase_agreements.contract_date, purchase_agreements.inventory_home, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the contract date
          anchor_source: purchase_agreements.contract_date
          relation: not_after
          duration_source: variants.incentive_close_by_days
          unit: calendar_days
          counting_rule: Counting starts the day after the contract date and a closing on the last counted day qualifies
          boundary: inclusive
    params:
      concession_cap_pct: {conventional: 3.0, fha: 6.0, va: 4.0, usda: 6.0, jumbo: 2.0}
    formula:
      concession_cap: round(contract_price * concession_cap_pct / 100, 2)

  - id: purchase_charge_waiver
    subject: [purchase_charge_waived, purchase_charges_collected]
    rule: >-
      A closing_extension_fee or closing_delay_per_diem is waived in full when the extension or delay
      was caused by a builder delay recorded on the agreement; returned_payment_fee, plan_change_fee,
      lot_transfer_fee, contract_amendment_fee and mutual_release_fee are never waived. Each waiver
      points to the charge number it waives. A charge is waived at most once and a charge already collected is not waived.
      Charges not waived are collected on the closing date, one collection row per charge.
    eligibility:
      - id: single_waiver
        applies_to: [purchase_charge_waived]
        kind: dedup
        condition: "A charge is waived at most once and a charge already collected is not waived."
        evidence_fields: [purchase_events.source_charge_ref, purchase_events.event_type]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_events.source_charge_ref]
          action_bindings:
            purchase_events.source_charge_ref: source_charge_ref
        dedup_contract:
          table: purchase_events
          mode: separate_record
          object_bindings: {source_charge_ref: source_charge_ref}
          duplicate_filters: {event_type: [purchase_charge_waived, purchase_charges_collected]}
          distinct_fields: []

  - id: purchase_plan_lot_changes
    subject: [purchase_plan_changed, purchase_lot_transferred, purchase_charge_assessed]
    rule: >-
      A plan or elevation change is accepted only while construction_stage is not_started, the stage
      named by plan_change_cutoff_stage; it carries plan_change_fee_usd and re-prices the agreement at
      the new plan's base price on the amendment date. A homesite transfer within the same community
      is accepted up to max_lot_transfers times, carries lot_transfer_fee_usd and re-prices the lot
      premium; it is accepted only while construction_stage is not_started. A plan change or homesite transfer is written only while the construction stage is not_started.
      Other buyer-requested amendments carry contract_amendment_fee_usd. Assignment of the agreement
      to another person is refused where assignment_allowed is false. A change that moves the contract
      price re-computes the earnest money under purchase_earnest_money and any shortfall is due within
      em_due_business_days business days.
    eligibility:
      - id: pre_start_only
        applies_to: [purchase_plan_changed, purchase_lot_transferred]
        kind: state
        condition: "A plan change or homesite transfer is written only while the construction stage is not_started."
        evidence_fields: [purchase_agreements.construction_stage, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
        state_contract:
          field: purchase_agreements.construction_stage
          allowed: [not_started]

  - id: purchase_returned_payment
    subject: [purchase_payment_returned, purchase_charge_assessed, purchase_deposit_posted]
    rule: >-
      A returned deposit payment comes off the deposits held and a returned_payment_fee of
      returned_payment_fee_usd is charged. Replacement funds and the fee must post within returned_payment_cure_business_days business days after the date Calloway was notified of the return.
      Business days are Monday through Friday excluding Calloway holidays and counting starts the next
      business day after the notification date. Replacement funds must come by wire. An uncured return
      on a ratified agreement is a buyer default under purchase_default_termination; on an agreement
      still pending_ratification it simply leaves the signing deposits unfunded.
    eligibility:
      - id: return_cure_window
        applies_to: [purchase_deposit_posted]
        kind: time
        condition: "Replacement funds and the fee must post within returned_payment_cure_business_days business days after the date Calloway was notified of the return."
        evidence_fields: [purchase_events.event_date, purchase_events.source_payment_ref]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_events.source_payment_ref]
          action_bindings:
            purchase_events.source_payment_ref: source_payment_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the date Calloway was notified of the return
          anchor_source: purchase_events.event_date
          relation: not_after
          duration_source: variants.returned_payment_cure_business_days
          unit: business_days
          counting_rule: Business days are Monday through Friday excluding Calloway holidays and counting starts the next business day after the notification date
          boundary: inclusive

  - id: purchase_cancellation_refund
    subject: [purchase_cancelled, purchase_deposit_refunded, purchase_deposit_forfeited, purchase_charge_assessed]
    rule: >-
      Every buyer cancellation starts as a cancellation request recorded with its basis and the date it
      was received, and takes effect only when the buyer confirms it. A mutual release (basis
      mutual_release, including a late rescission or late financing-denial request) refunds the initial
      earnest money, additional deposit, contingency deposit and transferred reservation deposit less
      mutual_release_fee_usd, which is booked as a mutual_release_fee charge and collected by deduction
      from the refund; the lot premium deposit is forfeited with reason cancellation_non_refundable
      unless lot_premium_deposit_refundable is true. Rescission, financing denial, contingency and
      builder-delay cancellations carry no mutual release fee. Refunds are issued within
      refund_processing_business_days business days after the cancellation date, one refund row per
      source payment and component.
    eligibility: []

  - id: purchase_construction_and_closing
    subject: [purchase_construction_started, purchase_stage_updated, purchase_closing_scheduled, purchase_closed, purchase_deposit_applied, purchase_charges_collected, purchase_agreement_written]
    rule: >-
      Construction starts only on a ratified agreement and the system records each stage in the order
      not_started, foundation, framing, drywall, finishes, complete. The closing date may be set on an
      inventory home once ratified and on a to-be-built home once construction_stage is finishes or
      complete. The agreement closes only when construction_stage is complete, every deposit due has
      posted, and the buyer's loan has funded (or cash has been received). The contract price on a new
      agreement must equal base price plus lot premium, and the base price must sit within the
      collection's base_price_floor_usd and base_price_ceiling_usd. At closing every deposit held is credited to the
      buyer, every unwaived charge is collected and incentives are applied under purchase_incentives.
      Closing is written only when the construction stage is complete.
    eligibility:
      - id: complete_home
        applies_to: [purchase_closed]
        kind: authorization
        condition: "Closing is written only when the construction stage is complete."
        evidence_fields: [purchase_agreements.construction_stage, purchase_agreements.purchase_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [purchase_agreements.purchase_id]
          action_bindings:
            purchase_agreements.purchase_id: purchase_id
