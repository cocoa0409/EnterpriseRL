# SunPath Solar Lease charter — Calloway Energy Services.
# In communities where new homes are built solar-ready (California's Title 24 solar requirement
# and the Colorado and Arizona communities that adopted the same package), the buyer may lease the
# rooftop system from Calloway Energy Services instead of buying it. The lease is sized to the home
# and billed monthly for its term; the system size is the tier.

category: solar
display_name: SunPath Solar Lease

binding:
  holding_table: solar_leases
  event_tables: [solar_events]
  status_field: status
  variant_field: variant_name
  quantity_fields: {lease_balance: lease_balance}

lifecycle:
  states: [pending_installation, pending_pto, active, transferred, bought_out, terminated]
  transitions:
    - {from: pending_installation, to: pending_pto, by: system, means: "The system is installed and awaits the utility's permission to operate."}
    - {from: pending_pto, to: active, by: system, means: "The utility grants permission to operate and the lease term begins."}
    - {from: active, to: transferred, by: agent, means: "A buyer of the home assumes the lease."}
    - {from: active, to: bought_out, by: user, means: "The lessee buys the system at the buyout price."}
    - {from: active, to: terminated, by: system, means: "The lease is terminated for an uncured payment default."}
    - {from: pending_installation, to: terminated, by: system, means: "The home purchase did not close, so the lease never starts."}

accounts:
  - key: lease_balance
    unit: USD
    meaning: Lease payments, fees and buyout amounts billed to the lessee and not yet paid or credited.

parameter_schema:
  system_size_kw: Nameplate DC system size in kilowatts.
  panel_count: Number of 400-watt panels.
  conditioned_sqft_floor: Smallest conditioned floor area (square feet) of a home sized to this system.
  conditioned_sqft_ceiling: Largest conditioned floor area (square feet) of a home sized to this system.
  estimated_annual_kwh: Estimated first-year production in kWh.
  guaranteed_production_pct: Production guaranteed each lease year, percent of the estimated production for that year.
  annual_degradation_pct: Yearly reduction in estimated production after the first lease year, percent.
  guarantee_credit_per_kwh_usd: Credit (USD) per kWh of shortfall below the guaranteed production.
  production_guarantee_cap_usd: Cap (USD) on the production guarantee credit for one lease year.
  production_reconciliation_period_months: Months in each production reconciliation period.
  monthly_lease_usd: Monthly lease payment (USD) in the first lease year.
  annual_escalator_pct: Increase of the monthly lease payment on each lease anniversary, percent.
  term_years: Lease term in years from the permission-to-operate date.
  autopay_credit_usd: Monthly credit (USD) when automatic payments are set up.
  paper_bill_fee_usd: Monthly fee (USD) for a mailed paper bill.
  payment_methods: Payment methods accepted.
  late_fee_usd: Fee (USD) when a monthly bill is unpaid after the grace period.
  grace_days: Calendar days after a bill's due date before the late fee applies.
  default_days_past_due: Days past due after which a default notice is sent.
  default_notice_days: Calendar days of notice between the default notice and termination.
  returned_payment_fee_usd: Fee (USD) for a returned payment.
  transfer_credit_min_score: Minimum credit score of a home buyer assuming the lease.
  transfer_processing_days: Calendar days to process a lease transfer.
  buyout_allowed_after_months: Months after the permission-to-operate date after which the lessee may buy the system.
  buyout_price_year6_usd: Buyout price (USD) at the start of lease year six.
  buyout_annual_decline_pct: Yearly decline of the buyout price after lease year six, percent.
  full_prepay_usd: Price (USD) to prepay the whole lease at signing.
  removal_reinstall_fee_usd: Fee (USD) to remove and reinstall the system for homeowner roof work.
  roof_work_notice_days: Calendar days of notice the homeowner gives before roof work requiring removal.
  panel_warranty_years: Panel performance warranty in years.
  inverter_warranty_years: Inverter warranty in years.
  workmanship_warranty_years: Installation workmanship warranty in years.
  roof_penetration_warranty_years: Roof penetration leak warranty in years.
  monitoring_included: Whether production monitoring is included.
  service_response_business_days: Business days to respond to a service request.
  battery_included: Whether a home battery is included.
  battery_kwh: Usable battery capacity in kWh (0 when none).
  nem_tariff: Utility export tariff the system is interconnected under.
  end_of_term_options: Options available at the end of the term.
  renewal_term_years: Years of a lease renewal at the end of the term.
  removal_at_end_of_term_fee_usd: Fee (USD) to remove the system at the end of the term.
  early_termination_allowed: Whether the lessee may terminate the lease early without a transfer or buyout.
  pto_target_days: Target calendar days from installation to permission to operate.
  first_bill_after_pto_days: Calendar days after the permission-to-operate date to the first bill.
  credit_check_min_score: Minimum credit score to sign the lease.
  panel_cleaning_visits: Included panel cleaning visits per lease year.
  storm_damage_covered_by_lessor: Whether storm damage to the system is repaired at the lessor's cost.
  system_relocation_allowed: Whether the system may be moved to another home.

