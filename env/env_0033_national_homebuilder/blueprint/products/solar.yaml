events:
  - type: solar_lease_signed
    target: solar_leases
    mutation: create
    meaning: The buyer signs a SunPath lease for the system sized to the home.
    grain: One row per lease signed.
    fields:
      customer_id: The lessee.
      purchase_id: Purchase agreement of the home.
      variant_name: System size, the official tier name.
      status: Always pending_installation on creation.
      agreement_number: Lease agreement number.
      lease_signed_date: Date signed.
      prepaid: Whether the whole lease was prepaid at signing.
      autopay: Whether automatic payments are set up.
      paper_billing: Whether mailed paper bills were chosen.
      lease_balance: 0.00 on creation.
    triggers: []
  - type: solar_installed
    target: solar_leases
    mutation: {transition: {from: pending_installation, to: pending_pto}}
    meaning: The system is installed on the home.
    grain: One row per transaction.
    fields:
      status: Becomes pending_pto.
      install_date: Installation date.
    triggers: []
  - type: solar_pto_granted
    target: solar_leases
    mutation: {transition: {from: pending_pto, to: active}}
    meaning: The utility grants permission to operate and the lease term starts.
    grain: One row per transaction.
    fields:
      status: Becomes active.
      pto_date: Permission-to-operate date.
      first_bill_date: PTO date plus first_bill_after_pto_days.
      monthly_payment: First-year monthly lease payment.
    triggers: []
  - type: solar_billing_updated
    target: solar_leases
    mutation: update
    meaning: The lessee changes billing preferences or the payment steps up on a lease anniversary.
    grain: One row per transaction.
    fields:
      autopay: New automatic payment status.
      paper_billing: New paper bill status.
      monthly_payment: Monthly payment after an anniversary escalator.
    triggers: []
  - type: solar_bill_issued
    target: solar_events
    meaning: A monthly lease bill line or fee is billed.
    grain: One row per bill line.
    distinguish_by: [bill_type, bill_reference]
    fields:
      amount: Amount billed, positive.
      bill_type: Kind of bill line.
      bill_reference: Bill number, e.g. SPL-44120-0613.
      billing_period: Month the line covers.
      due_date: Due date.
      event_date: Date billed.
    account: lease_balance
    direction: in
    triggers: []
  - type: solar_payment_received
    target: solar_events
    meaning: A lease payment is received.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      amount: Amount received, positive.
      payment_method: How it was paid.
      payment_reference: Receipt number.
      source_bill_ref: Bill number paid.
      event_date: Date received.
    account: lease_balance
    direction: out
    triggers: []
  - type: solar_guarantee_credit
    target: solar_events
    meaning: A production guarantee credit is applied for a lease year that produced below the guarantee.
    grain: One row per lease year.
    distinguish_by: [lease_year]
    fields:
      amount: Credit, positive.
      lease_year: Lease year credited.
      event_date: Date credited.
    account: lease_balance
    direction: out
    triggers: []
  - type: solar_production_reconciled
    target: solar_events
    meaning: A lease year's actual production is compared to the guarantee.
    grain: One row per lease year.
    distinguish_by: [lease_year]
    fields:
      lease_year: Lease year reconciled.
      actual_kwh: Metered production in the lease year.
      guaranteed_kwh: Guaranteed production for that lease year.
      event_date: Reconciliation date.
    triggers: []
  - type: solar_service_visit
    target: solar_events
    meaning: A technician visits the system.
    grain: One row per visit.
    distinguish_by: [visit_type, event_date]
    fields:
      visit_type: Kind of visit.
      event_date: Visit date.
    triggers: []
  - type: solar_notice_sent
    target: solar_events
    meaning: A lease notice is sent.
    grain: One row per notice per date.
    distinguish_by: [notice_type, event_date]
    fields:
      notice_type: Kind of notice.
      event_date: Date sent.
    triggers: []
  - type: solar_transferred
    target: solar_leases
    mutation: {transition: {from: active, to: transferred}}
    meaning: The home is sold and the buyer assumes the lease.
    grain: One row per transaction.
    fields:
      status: Becomes transferred.
      end_date: Transfer effective date.
    triggers: []
  - type: solar_bought_out
    target: solar_leases
    mutation: {transition: {from: active, to: bought_out}}
    meaning: The lessee buys the system.
    grain: One row per transaction.
    fields:
      status: Becomes bought_out.
      end_date: Buyout date.
    triggers:
      - event: solar:solar_bill_issued
        map: {bill_type: buyout_price, event_date: end_date}
  - type: solar_terminated
    target: solar_leases
    mutation: {transition: [{from: active, to: terminated}, {from: pending_installation, to: terminated}]}
    meaning: The lease ends for default or because the home never closed.
    grain: One row per transaction.
    fields:
      status: Becomes terminated.
      end_date: Termination date.
    triggers: []

measures:
  - id: solar_msr_days_past_due
    window: Point in time on the frozen date.
    measure: Calendar days since the due date of the oldest unpaid monthly_lease bill line.
  - id: solar_msr_cleaning_visits_this_year
    window: Current lease year.
    measure: Count of solar_service_visit rows with visit_type panel_cleaning in the current lease year.

policies:
  - id: solar_agg_multi_holding
    subject: [solar_lease_signed]
    rule: >-
      A customer may lease systems on any number of homes they own (max_per_customer null); each home
      carries one lease.
    eligibility: []
    params:
      max_per_customer: null

  - id: solar_agg_one_lease_per_home
    subject: [solar_lease_signed, solar_transferred]
    rule: >-
      A lease is signed only for a purchase agreement with no other lease in status pending_installation, pending_pto or active.
      On a transfer the buyer of the home signs a new lease for the remaining term on the same system
      and the seller's lease becomes transferred.
    eligibility:
      - id: one_lease
        applies_to: [solar_lease_signed]
        kind: dedup
        condition: "A lease is signed only for a purchase agreement with no other lease in status pending_installation, pending_pto or active."
        evidence_fields: [solar_leases.purchase_id, solar_leases.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [solar_leases.purchase_id]
          action_bindings:
            solar_leases.purchase_id: purchase_id
        dedup_contract:
          table: solar_leases
          mode: same_record
          object_bindings: {purchase_id: purchase_id}
          duplicate_filters: {status: [pending_installation, pending_pto, active]}
          distinct_fields: []

  - id: solar_sizing_and_approval
    subject: [solar_lease_signed]
    rule: >-
      The system size is the one whose conditioned floor area band contains the home's plan, and the
      lease is offered only in SunPath communities. The lessee's credit score must be at least
      credit_check_min_score. A lessee may prepay the whole lease at signing for full_prepay_usd, in
      which case no monthly lease line is billed. A home purchase that does not close terminates a
      lease that has not been installed.
    eligibility: []
    params:
      sunpath_communities: [Sierra Vista Ranch, Mesquite Trails, Larkspur Meadows]

  - id: solar_billing
    subject: [solar_bill_issued, solar_billing_updated, solar_payment_received, solar_pto_granted]
    rule: >-
      Billing starts first_bill_after_pto_days after the permission-to-operate date, one monthly_lease
      line per month of the term. The monthly payment rises by annual_escalator_pct percent on each
      lease anniversary, rounded half up to the cent. When autopay is true each monthly bill carries a
      credit of autopay_credit_usd taken off the monthly_lease line; when paper_billing is true each
      month carries a paper_bill_fee line of paper_bill_fee_usd. Payments use payment_methods and are
      applied to the oldest open line; a returned payment carries returned_payment_fee_usd.
    eligibility: []
    params:
      per_tier:
        SunPath 3.2 kW: {lease: "=monthly_lease_usd", escalator: "=annual_escalator_pct", autopay_credit: "=autopay_credit_usd"}
        SunPath 4.0 kW: {lease: "=monthly_lease_usd", escalator: "=annual_escalator_pct", autopay_credit: "=autopay_credit_usd"}
        SunPath 4.8 kW: {lease: "=monthly_lease_usd", escalator: "=annual_escalator_pct", autopay_credit: "=autopay_credit_usd"}
        SunPath 5.6 kW: {lease: "=monthly_lease_usd", escalator: "=annual_escalator_pct", autopay_credit: "=autopay_credit_usd"}
        SunPath 6.4 kW: {lease: "=monthly_lease_usd", escalator: "=annual_escalator_pct", autopay_credit: "=autopay_credit_usd"}
        SunPath 8.0 kW: {lease: "=monthly_lease_usd", escalator: "=annual_escalator_pct", autopay_credit: "=autopay_credit_usd"}
    formula:
      monthly_line: monthly_lease_usd - autopay_credit_usd

  - id: solar_late_and_default
    subject: [solar_bill_issued, solar_notice_sent, solar_terminated]
    rule: >-
      A monthly line unpaid grace_days calendar days after its due date carries late_fee_usd once. When
      solar_msr_days_past_due exceeds default_days_past_due a default_notice is sent. The lease may be terminated for default only when at least default_notice_days calendar days have passed since the default notice was sent.
      Counting starts the day after the notice date and termination is allowed on the last counted day,
      provided the default is uncured; the system is then removed at the lessor's option.
    eligibility:
      - id: default_notice_period
        applies_to: [solar_terminated]
        kind: time
        condition: "The lease may be terminated for default only when at least default_notice_days calendar days have passed since the default notice was sent."
        evidence_fields: [solar_events.event_date, solar_events.notice_type, solar_leases.lease_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [solar_leases.lease_id]
          action_bindings:
            solar_leases.lease_id: lease_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the default notice was sent
          anchor_source: solar_events.event_date
          relation: not_before
          duration_source: variants.default_notice_days
          unit: calendar_days
          counting_rule: Counting starts the day after the notice date and termination is allowed on the last counted day
          boundary: inclusive
    measures: [solar_msr_days_past_due]

  - id: solar_production_guarantee
    subject: [solar_production_reconciled, solar_guarantee_credit]
    rule: >-
      At the end of each production_reconciliation_period_months lease year the metered production is
      compared to the guaranteed production: guaranteed_production_pct percent of the estimated annual
      production reduced by annual_degradation_pct percent for each lease year after the first, rounded
      to the nearest kWh. A shortfall is credited at guarantee_credit_per_kwh_usd per kWh, rounded half up
      to the cent, never above production_guarantee_cap_usd; production above the guarantee earns
      nothing and does not carry forward. Shortfall caused by system downtime the lessee requested
      (removal for roof work) is excluded.
    eligibility: []
    formula:
      shortfall_credit: min(max(guaranteed_kwh - actual_kwh, 0) * guarantee_credit_per_kwh_usd, production_guarantee_cap_usd)

  - id: solar_transfer_and_buyout
    subject: [solar_transferred, solar_bought_out, solar_bill_issued]
    rule: >-
      When the home is sold the lessee either transfers the lease to the home buyer, who must have a
      credit score of at least transfer_credit_min_score (processed within transfer_processing_days), or
      buys the system. A buyout is allowed only after buyout_allowed_after_months months from the
      permission-to-operate date; the buyout price is buyout_price_year6_usd at the start of lease year
      six, declining by buyout_annual_decline_pct percent each later lease year, rounded half up to the
      cent, and is billed as a buyout_price line. Early termination without a transfer or buyout is not
      offered where early_termination_allowed is false, and the system is never moved to another home.
    eligibility: []

  - id: solar_service_and_roof
    subject: [solar_service_visit, solar_bill_issued]
    rule: >-
      Service requests are answered within service_response_business_days business days. The program
      includes panel_cleaning_visits panel cleaning visits per lease year
      (solar_msr_cleaning_visits_this_year). When the homeowner needs roof work that requires the system
      to be removed, they give roof_work_notice_days calendar days of notice and pay
      removal_reinstall_fee_usd as a removal_reinstall_fee line; storm damage to the system is repaired
      at the lessor's cost where storm_damage_covered_by_lessor is true. Roof leaks at system
      penetrations within roof_penetration_warranty_years are repaired by the lessor.
    eligibility: []
    measures: [solar_msr_cleaning_visits_this_year]

  - id: solar_installation_pto
    subject: [solar_installed, solar_pto_granted]
    rule: >-
      The system is installed before the home closes; permission to operate is targeted within
      pto_target_days of installation, and no lease payment is billed before the first bill date.
    eligibility: []
