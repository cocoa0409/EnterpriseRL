  - id: design_ext_change_order_fee
    base_policy_refs: [design_change_orders, design_option_selection]
    overwrite:
      - base_policy: design_change_orders
        superseded_clause: >-
          each later one carries change_order_fee_usd while the file is in_selection and
          post_structural_change_order_fee_usd once it is structural_closed.
        replaced_by: >-
          The change order fee of a fee-bearing change order is its schedule fee times the paid-order
          multiple, reduced by the studio-error relief percent, plus the change percent of its change
          amount, plus the lead-time surcharge, rounded half up to the cent once at the end.
    trigger: state_due
    subject: [design_change_order_recorded]
    computes: fee_amount
    target_tool: record_change_order_fee_50efc86e
    params:
      framing_fee_multiple: 1.5
      large_change_usd: 5000.00
      large_change_pct: 10
      small_change_pct: 5
      second_paid_multiple: 1.5
      third_paid_multiple: 2
      long_lead_surcharge_usd: 150.00
      short_lead_surcharge_usd: 75.00
      two_error_relief_pct: 20
      one_error_relief_pct: 10
    rule: >-
      Every set of option lines added or removed under a change order number is recorded as one change
      order entry carrying its fee; the change order recorded is the one whose option lines were added
      or removed most recently on the file. An error-correcting change order is recorded at 0.00 under the package's builder-error waiver and is not priced by this rule. A change order written at the buyer's request is fee-bearing when the
      buyer-requested change orders already recorded on the file number at least the package's free
      change orders; otherwise its fee is 0.00. The change order fee of a fee-bearing change order is
      its schedule fee times the paid-order multiple, reduced by the studio-error relief percent, plus
      the change percent of its change amount, plus the lead-time surcharge, rounded half up to the cent
      once at the end. The schedule fee is the package's change order fee. The change amount is the
      price of the option lines the change order adds less the removal credits booked under it, never
      below zero. The paid-order multiple is one, the studio-error relief percent and the change percent
      are zero, and the lead-time surcharge is 0.00.
      The schedule fee is set by the file status and the construction stage of the purchase agreement
      the file serves: on a file that is structural_closed while the agreement's construction stage is framing, drywall, finishes or complete, it is the package's post-structural change order fee times framing_fee_multiple; on a file that is structural_closed while the agreement's construction stage is foundation, it is the package's post-structural change order fee; on a file in
      any other status, it is the package's change order fee.
      The change percent is set by the file status and the price of the option lines the change order
      adds: on a structural_closed file a change order adding large_change_usd or more of option lines
      carries large_change_pct percent; on a structural_closed file a change order adding less than
      large_change_usd carries small_change_pct percent; on a file in any other status it carries no
      change percent.
      The change amount is measured by the shape of the change order: where it removes exactly one
      option line and adds exactly one option line of the same category, the change amount is the added
      line's price less the price at which the removed line had been selected; where it only removes
      option lines, the change amount is the removal credits booked under it; any other change order is
      measured as the price of the option lines it adds less the removal credits booked under it, never
      below zero.
      The paid-order multiple is set by the fee-bearing buyer-requested change orders already recorded
      on the file, that is the buyer-requested change orders recorded beyond the package's free change
      orders: two or more give third_paid_multiple, exactly one gives second_paid_multiple, none gives a
      multiple of one.
      The lead-time surcharge is set by the categories of the option lines the change order adds on a
      structural_closed file: where it adds cabinetry or countertop lines, long_lead_surcharge_usd; where
      it adds flooring or appliance lines and no cabinetry or countertop lines, short_lead_surcharge_usd;
      otherwise, or on a file in any other status, nothing.
      The studio-error relief percent is set by the error-correcting change orders recorded on the file:
      two or more give two_error_relief_pct percent, exactly one gives one_error_relief_pct percent, none
      gives no relief. The schedule fee is first multiplied by the paid-order multiple, that product is
      then reduced by the studio-error relief percent, and the change percent part and the lead-time
      surcharge are added to the reduced amount; the relief never reduces the change percent part or the
      surcharge.
    prerequisite: []
    cross_category:
      - category: purchase
        as: branch
        reads: [construction_stage]
        note: decides the schedule fee tier from the construction stage of the purchase agreement the file serves.
    compute:
      - order_number: "LATEST('design_events','change_order_number', event_type='design_option_removed') if (LATEST('design_events','event_date', event_type='design_option_removed') or '') > (LATEST('design_events','event_date', event_type='design_option_added') or '') else LATEST('design_events','change_order_number', event_type='design_option_added')"
      - buyer_orders_recorded: "COUNT('design_events', event_type='design_change_order_recorded', change_order_reason='buyer_request')"
      - agreement_stage: "CFIELD('purchase','construction_stage', purchase_id=F('purchase_id'))"
      - schedule_fee: "P('post_structural_change_order_fee_usd') * K('framing_fee_multiple') if (F('status') == 'structural_closed' and (agreement_stage == 'framing' or agreement_stage == 'drywall' or agreement_stage == 'finishes' or agreement_stage == 'complete')) else (P('post_structural_change_order_fee_usd') if (F('status') == 'structural_closed' and agreement_stage == 'foundation') else P('change_order_fee_usd'))"
      - order_added: "SUM('design_events','amount', event_type='design_option_added', change_order_number=order_number)"
      - change_pct: "K('large_change_pct') if (F('status') == 'structural_closed' and order_added >= K('large_change_usd')) else (K('small_change_pct') if (F('status') == 'structural_closed' and order_added < K('large_change_usd')) else 0)"
      - order_removal_credit: "SUM('design_events','amount', event_type='design_option_removed', change_order_number=order_number)"
      - order_add_count: "COUNT('design_events', event_type='design_option_added', change_order_number=order_number)"
      - order_removal_count: "COUNT('design_events', event_type='design_option_removed', change_order_number=order_number)"
      - removed_ref: "LATEST('design_events','source_line_ref', event_type='design_option_removed', change_order_number=order_number)"
      - removed_selected_price: "SUM('design_events','amount', event_type='design_option_added', option_line_ref=removed_ref)"
      - same_category: "LATEST('design_events','option_category', event_type='design_option_removed', change_order_number=order_number) == LATEST('design_events','option_category', event_type='design_option_added', change_order_number=order_number)"
      - change_amount: "(order_added - removed_selected_price) if (order_removal_count == 1 and order_add_count == 1 and same_category) else (order_removal_credit if (order_add_count == 0 and order_removal_count > 0) else MX(0, order_added - order_removal_credit))"
      - paid_orders_before: "MX(0, buyer_orders_recorded - P('free_change_orders'))"
      - paid_order_multiple: "K('third_paid_multiple') if paid_orders_before >= 2 else (K('second_paid_multiple') if paid_orders_before == 1 else 1)"
      - long_lead_lines: "COUNT('design_events', event_type='design_option_added', change_order_number=order_number, option_category='cabinetry') + COUNT('design_events', event_type='design_option_added', change_order_number=order_number, option_category='countertops')"
      - short_lead_lines: "COUNT('design_events', event_type='design_option_added', change_order_number=order_number, option_category='flooring') + COUNT('design_events', event_type='design_option_added', change_order_number=order_number, option_category='appliances')"
      - lead_time_surcharge: "K('long_lead_surcharge_usd') if (F('status') == 'structural_closed' and long_lead_lines > 0) else (K('short_lead_surcharge_usd') if (F('status') == 'structural_closed' and long_lead_lines == 0 and short_lead_lines > 0) else 0)"
      - error_orders_recorded: "COUNT('design_events', event_type='design_change_order_recorded', change_order_reason='builder_error')"
      - error_relief_pct: "K('two_error_relief_pct') if error_orders_recorded >= 2 else (K('one_error_relief_pct') if error_orders_recorded == 1 else 0)"
      - reduced_schedule: "schedule_fee * paid_order_multiple * (100 - error_relief_pct) / 100"
      - order_fee: "RND(reduced_schedule + MX(0, change_amount) * change_pct / 100 + lead_time_surcharge, 2)"
      - result: "order_fee if buyer_orders_recorded >= P('free_change_orders') else 0"
    compute_basis:
      order_number: "the change order recorded is the one whose option lines were added or removed most recently on the file."
      buyer_orders_recorded: "A change order written at the buyer's request is fee-bearing when the buyer-requested change orders already recorded on the file number at least the package's free change orders; otherwise its fee is 0.00."
      agreement_stage: "The schedule fee is set by the file status and the construction stage of the purchase agreement the file serves"
      schedule_fee: "on a file that is structural_closed while the agreement's construction stage is framing, drywall, finishes or complete, it is the package's post-structural change order fee times framing_fee_multiple; on a file that is structural_closed while the agreement's construction stage is foundation, it is the package's post-structural change order fee; on a file in any other status, it is the package's change order fee."
      order_added: "The change percent is set by the file status and the price of the option lines the change order adds"
      change_pct: "on a structural_closed file a change order adding large_change_usd or more of option lines carries large_change_pct percent; on a structural_closed file a change order adding less than large_change_usd carries small_change_pct percent; on a file in any other status it carries no change percent."
      order_removal_credit: "The change amount is the price of the option lines the change order adds less the removal credits booked under it, never below zero."
      order_add_count: "where it removes exactly one option line and adds exactly one option line of the same category"
      order_removal_count: "where it removes exactly one option line and adds exactly one option line of the same category"
      removed_ref: "the change amount is the added line's price less the price at which the removed line had been selected"
      removed_selected_price: "the change amount is the added line's price less the price at which the removed line had been selected"
      same_category: "where it removes exactly one option line and adds exactly one option line of the same category"
      change_amount: "The change amount is measured by the shape of the change order: where it removes exactly one option line and adds exactly one option line of the same category, the change amount is the added line's price less the price at which the removed line had been selected; where it only removes option lines, the change amount is the removal credits booked under it; any other change order is measured as the price of the option lines it adds less the removal credits booked under it, never below zero."
      paid_orders_before: "that is the buyer-requested change orders recorded beyond the package's free change orders"
      paid_order_multiple: "two or more give third_paid_multiple, exactly one gives second_paid_multiple, none gives a multiple of one."
      long_lead_lines: "where it adds cabinetry or countertop lines, long_lead_surcharge_usd"
      short_lead_lines: "where it adds flooring or appliance lines and no cabinetry or countertop lines, short_lead_surcharge_usd"
      lead_time_surcharge: "The lead-time surcharge is set by the categories of the option lines the change order adds on a structural_closed file: where it adds cabinetry or countertop lines, long_lead_surcharge_usd; where it adds flooring or appliance lines and no cabinetry or countertop lines, short_lead_surcharge_usd; otherwise, or on a file in any other status, nothing."
      error_orders_recorded: "The studio-error relief percent is set by the error-correcting change orders recorded on the file"
      error_relief_pct: "two or more give two_error_relief_pct percent, exactly one gives one_error_relief_pct percent, none gives no relief."
      reduced_schedule: "The schedule fee is first multiplied by the paid-order multiple, that product is then reduced by the studio-error relief percent"
      order_fee: "the change percent part and the lead-time surcharge are added to the reduced amount; the relief never reduces the change percent part or the surcharge."
      result: "A change order written at the buyer's request is fee-bearing when the buyer-requested change orders already recorded on the file number at least the package's free change orders; otherwise its fee is 0.00."
    factors:
      - id: schedule_fee_stage
        effect: parameter
        decides: schedule_fee
        bindings: [agreement_stage, schedule_fee]
        ladder:
          - when: "the file is structural_closed and the agreement's construction stage is framing, drywall, finishes or complete"
            value: "P('post_structural_change_order_fee_usd') * K('framing_fee_multiple')"
          - when: "the file is structural_closed and the agreement's construction stage is foundation"
            value: "P('post_structural_change_order_fee_usd')"
          - when: "otherwise (the file is in any other status)"
            value: "P('change_order_fee_usd')"
        baseline:
          schedule_fee: "P('change_order_fee_usd')"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: change_percent
        effect: parameter
        decides: change_pct
        bindings: [order_added, change_pct]
        ladder:
          - when: "the file is structural_closed and the change order adds large_change_usd or more of option lines"
            value: "K('large_change_pct')"
          - when: "the file is structural_closed and the change order adds less than large_change_usd of option lines"
            value: "K('small_change_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          change_pct: "0"
        evidence: [history]
        cross_difficulty: null
      - id: change_amount_measure
        effect: method
        decides: change_amount
        bindings: [order_removal_credit, order_add_count, order_removal_count, removed_ref, removed_selected_price, same_category, change_amount]
        ladder:
          - when: "the change order removes exactly one option line and adds exactly one option line of the same category"
            method: "the added line's price less the price at which the removed line had been selected"
          - when: "the change order only removes option lines"
            method: "the removal credits booked under the change order"
          - when: "otherwise"
            method: "the price of the option lines added less the removal credits booked under the change order, never below zero"
        baseline:
          change_amount: "MX(0, order_added - order_removal_credit)"
        evidence: [history]
        cross_difficulty: null
      - id: paid_order_multiple
        effect: parameter
        decides: paid_order_multiple
        bindings: [buyer_orders_recorded, paid_orders_before, paid_order_multiple]
        ladder:
          - when: "two or more fee-bearing buyer-requested change orders are already recorded on the file"
            value: "K('third_paid_multiple')"
          - when: "exactly one fee-bearing buyer-requested change order is already recorded"
            value: "K('second_paid_multiple')"
          - when: "otherwise (none)"
            value: "1"
        baseline:
          paid_order_multiple: "1"
        evidence: [history]
        cross_difficulty: null
      - id: lead_time_surcharge
        effect: parameter
        decides: lead_time_surcharge
        bindings: [long_lead_lines, short_lead_lines, lead_time_surcharge]
        ladder:
          - when: "on a structural_closed file the change order adds cabinetry or countertop lines"
            value: "K('long_lead_surcharge_usd')"
          - when: "on a structural_closed file the change order adds flooring or appliance lines and no cabinetry or countertop lines"
            value: "K('short_lead_surcharge_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          lead_time_surcharge: "0"
        evidence: [history]
        cross_difficulty: null
      - id: studio_error_relief
        effect: parameter
        decides: error_relief_pct
        bindings: [error_orders_recorded, error_relief_pct]
        ladder:
          - when: "two or more error-correcting change orders are recorded on the file"
            value: "K('two_error_relief_pct')"
          - when: "exactly one error-correcting change order is recorded"
            value: "K('one_error_relief_pct')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          error_relief_pct: "0"
        evidence: [history]
        cross_difficulty: null
    baseline:
      rule: >-
        Every set of option lines added or removed under a change order number is recorded as one change
        order entry carrying its fee; the change order recorded is the one whose option lines were added
        or removed most recently on the file. An error-correcting change order is recorded at 0.00 under the package's builder-error waiver and is not priced by this rule. A change order written at the buyer's request is fee-bearing when the
        buyer-requested change orders already recorded on the file number at least the package's free
        change orders; otherwise its fee is 0.00. The change order fee of a fee-bearing change order is
        its schedule fee times the paid-order multiple, reduced by the studio-error relief percent, plus
        the change percent of its change amount, plus the lead-time surcharge, rounded half up to the cent
        once at the end. The schedule fee is the package's change order fee. The change amount is the
        price of the option lines the change order adds less the removal credits booked under it, never
        below zero. The paid-order multiple is one, the studio-error relief percent and the change percent
        are zero, and the lead-time surcharge is 0.00.
      params: [change_order_fee_usd, free_change_orders]
    inputs:
      history:
        - {table: design_events, aggregate: count, field: design_event_id, filters: {event_type: design_change_order_recorded}}
        - {table: design_events, aggregate: sum, field: amount, filters: {event_type: design_option_added}}
        - {table: design_events, aggregate: sum, field: amount, filters: {event_type: design_option_removed}}
      cross_category: [purchase]
  - id: design_ext_option_deposit_due
    base_policy_refs: [design_option_deposits, design_credits, design_change_orders, design_option_selection]
    overwrite:
      - base_policy: design_option_deposits
        superseded_clause: >-
          The option deposit required on the file is computed over its current option lines: structural,
          electrical and plumbing lines at structural_deposit_pct percent and all other lines at
          finish_deposit_pct percent of their price;
        replaced_by: >-
          The option deposit due on the file is the line deposit, reduced by the lender relief percent,
          plus every studio fee line and every change order fee in full, less the option deposits held on
          the file, never below zero.
      - base_policy: design_option_deposits
        superseded_clause: >-
          once the option total exceeds deposit_ladder_threshold_usd every line is deposited at no less
          than deposit_ladder_elevated_pct percent; and the part of the option total above
          option_cap_pct_of_base percent of the purchase agreement's base price is deposited at
          excess_over_cap_deposit_pct percent, taking the larger requirement for that part.
        replaced_by: >-
          Where the file's option total exceeds the package's deposit ladder threshold, no deposit
          percent used for a group is below the package's elevated ladder percent; and the line deposit
          is never less than the part of the file's option total above the package's option cap percent
          of the agreement's base price.
    trigger: on_request
    subject: [design_deposit_paid]
    computes: amount
    target_tool: pay_option_deposit_3846be30
    params:
      framing_structural_pct: 100
      foundation_structural_pct: 75
      one_return_finish_pct: 35
      long_lead_full_usd: 5000.00
      long_lead_full_pct: 100
      long_lead_partial_pct: 75
      other_unapplied_share: 0.5
      locked_relief_pct: 10
      unlocked_relief_pct: 5
    rule: >-
      The option deposit due on the file is the line deposit, reduced by the lender relief percent,
      plus every studio fee line and every change order fee in full, less the option deposits held on
      the file, never below zero. A payment of the option deposit due is posted against the line number
      of the most recently added option line on the file that is not a studio fee line. The line deposit
      is the sum of three group deposits, each rounded half up to the cent: the structural group, being
      the structural, electrical and plumbing lines less the removal credits booked on lines of those
      categories, at the structural deposit percent; the long-lead group, being the cabinetry and countertop lines added while the agreement's construction stage was foundation or framing less the long-lead removal credits deducted from it, at the long-lead deposit percent; and the finish group, being every other cabinetry, countertop, flooring, appliance and
      exterior line less the removal credits booked on those lines other than the long-lead removal credits, less any long-lead removal credits sent to it, and less the credit offset, never below zero, at the finish deposit percent. The long-lead removal credits are the removal credits booked on cabinetry and countertop lines while the agreement's construction stage was foundation or framing, whenever those lines were added; they are deducted only where the long-lead credit rule places them. The structural deposit percent is the package's
      structural deposit percent, the finish deposit percent is the package's finish deposit percent,
      the long-lead deposit percent is the finish deposit percent, the credit offset is the design credit
      already applied to option lines on the file, the long-lead removal credits are deducted from the long-lead group, and the lender relief percent is zero. Where the file's option total exceeds the package's deposit ladder
      threshold, no deposit percent used for a group is below the package's elevated ladder percent; and
      the line deposit is never less than the part of the file's option total above the package's option
      cap percent of the agreement's base price. The lender relief percent is applied to the line deposit
      after that comparison, rounded half up to the cent, and never to the studio fee lines or the change
      order fees.
      The structural deposit percent is set by the construction stage of the purchase agreement the file
      serves: at framing, drywall, finishes or complete it is framing_structural_pct percent; at foundation it is
      foundation_structural_pct percent; at any other stage it is the package's structural deposit
      percent.
      The finish deposit percent is set by the option deposit payments returned unpaid on the file in the
      last 12 months: two or more returned payments raise it to the package's elevated ladder percent;
      exactly one returned payment raises it to one_return_finish_pct percent; with none it is the
      package's finish deposit percent.
      The long-lead deposit percent is set by the price of the cabinetry and countertop lines added while
      the agreement's construction stage was foundation or framing: where they total long_lead_full_usd
      or more it is long_lead_full_pct percent; where they total less than long_lead_full_usd it is
      long_lead_partial_pct percent; where there are none it is the finish deposit percent.
      The long-lead credit rule places the long-lead removal credits: where cabinetry or countertop lines were also added while the construction stage was foundation or framing, the removed item counts as replaced, its credits are deducted from neither group and the long-lead group is the added lines alone; where long-lead removal credits exist but no such line was added at those stages, the credits are deducted from the finish group and not from the long-lead group; otherwise the long-lead removal credits are deducted from the long-lead group.
      The credit offset is set by the design credit standing on the file: where builder goodwill credit
      granted on the file is not yet fully applied, the credit offset is all design credit granted on the
      file less any credit forfeited; where only credit of other sources stands unapplied, the credit
      offset is the credit already applied plus other_unapplied_share of the unapplied credit; where no
      credit stands unapplied, the credit offset is the credit already applied.
      The lender relief percent is set by the financing of the purchase agreement the file serves: where
      the agreement is financed through Calloway Home Mortgage and the rate lock on that agreement is
      locked, the line deposit is reduced by locked_relief_pct percent; where the agreement is financed
      through Calloway Home Mortgage and no rate lock on that agreement is locked, it is reduced by
      unlocked_relief_pct percent; where the agreement is financed by an outside lender or by cash, there
      is no relief.
      The option deposit due is fixed only after every change order number carried by an option line on
      the file has its change order entry on the design ledger. The option deposit due is not fixed until
      every selection appointment held beyond the package's included appointments has its consultation
      fee line on the file. The option deposit due is worked out only once every error-correcting change
      order on the file carries its builder goodwill credit memo.
    prerequisite:
      - problem: design_ext_change_order_fee
        kind: value_input
        gate: order_fees
        form: state
        policy_source: >-
          The option deposit due is fixed only after every change order number carried by an option line on
          the file has its change order entry on the design ledger.
        condition: >-
          Every change order number carried by an option line added or removed on the file has a change
          order entry (design_change_order_recorded) with that number on the file's design ledger.
        resolved_by: record_change_order_fee_50efc86e
        effect: >-
          The change order entry books the change order fee, which enters order_fees in full and so
          raises the option deposit due by that fee.
      - problem: design_ext_studio_consult_fee
        kind: value_input
        gate: studio_fee_lines
        form: state
        policy_source: >-
          The option deposit due is not fixed until every selection appointment held beyond the package's
          included appointments has its consultation fee line on the file.
        condition: >-
          The number of design_consult_fee lines tied to selection appointments equals the number of
          selection appointments held beyond the package's included appointments.
        resolved_by: book_studio_consult_fee_3108e630
        effect: >-
          The consultation fee line enters studio_fee_lines in full and so raises the option deposit due
          by that fee.
      - problem: design_ext_error_goodwill_credit
        kind: value_input
        gate: credit_offset
        form: state
        policy_source: >-
          The option deposit due is worked out only once every error-correcting change order on the file
          carries its builder goodwill credit memo.
        condition: >-
          Every design_change_order_recorded entry with reason builder_error has a builder_goodwill credit
          grant carrying its change order number.
        resolved_by: grant_goodwill_credit_33ff7b41
        effect: >-
          The goodwill grant leaves builder goodwill credit unapplied on the file, which moves the credit
          offset to all credit granted and so lowers the finish group and the option deposit due.
    cross_category:
      - category: purchase
        as: branch
        reads: [construction_stage, base_price, financing_type]
        note: decides the structural deposit percent from the agreement's construction stage and the lender relief from its financing; base price feeds the option cap guard.
      - category: lock
        as: branch
        reads: [status]
        note: decides whether the Calloway Home Mortgage rate lock on the agreement is locked, for the lender relief percent.
    compute:
      - structural_added: "SUM('design_events','amount', event_type='design_option_added', option_category='structural') + SUM('design_events','amount', event_type='design_option_added', option_category='electrical') + SUM('design_events','amount', event_type='design_option_added', option_category='plumbing')"
      - structural_removed: "SUM('design_events','amount', event_type='design_option_removed', option_category='structural') + SUM('design_events','amount', event_type='design_option_removed', option_category='electrical') + SUM('design_events','amount', event_type='design_option_removed', option_category='plumbing')"
      - structural_group: "MX(0, structural_added - structural_removed)"
      - deposit_stage: "CFIELD('purchase','construction_stage', purchase_id=F('purchase_id'))"
      - structural_pct: "K('framing_structural_pct') if (deposit_stage == 'framing' or deposit_stage == 'drywall' or deposit_stage == 'finishes' or deposit_stage == 'complete') else (K('foundation_structural_pct') if deposit_stage == 'foundation' else P('structural_deposit_pct'))"
      - returned_last_year: "COUNT('design_events', within_months=12, event_type='design_payment_returned')"
      - finish_pct: "P('deposit_ladder_elevated_pct') if returned_last_year >= 2 else (K('one_return_finish_pct') if returned_last_year == 1 else P('finish_deposit_pct'))"
      - long_lead_added: "SUM('design_events','amount', event_type='design_option_added', option_category='cabinetry', construction_stage_at_event='foundation') + SUM('design_events','amount', event_type='design_option_added', option_category='cabinetry', construction_stage_at_event='framing') + SUM('design_events','amount', event_type='design_option_added', option_category='countertops', construction_stage_at_event='foundation') + SUM('design_events','amount', event_type='design_option_added', option_category='countertops', construction_stage_at_event='framing')"
      - long_lead_pct: "K('long_lead_full_pct') if long_lead_added >= K('long_lead_full_usd') else (K('long_lead_partial_pct') if long_lead_added > 0 else finish_pct)"
      - long_lead_removed: "SUM('design_events','amount', event_type='design_option_removed', option_category='cabinetry', construction_stage_at_event='foundation') + SUM('design_events','amount', event_type='design_option_removed', option_category='cabinetry', construction_stage_at_event='framing') + SUM('design_events','amount', event_type='design_option_removed', option_category='countertops', construction_stage_at_event='foundation') + SUM('design_events','amount', event_type='design_option_removed', option_category='countertops', construction_stage_at_event='framing')"
      - long_lead_group: "long_lead_added if (long_lead_removed > 0 and long_lead_added > 0) else (long_lead_added if (long_lead_removed > 0 and long_lead_added == 0) else MX(0, long_lead_added - long_lead_removed))"
      - long_lead_credit_to_finish: "long_lead_removed if (long_lead_removed > 0 and long_lead_added == 0) else 0"
      - finish_added: "SUM('design_events','amount', event_type='design_option_added', option_category='cabinetry') + SUM('design_events','amount', event_type='design_option_added', option_category='countertops') + SUM('design_events','amount', event_type='design_option_added', option_category='flooring') + SUM('design_events','amount', event_type='design_option_added', option_category='appliances') + SUM('design_events','amount', event_type='design_option_added', option_category='exterior')"
      - finish_removed: "SUM('design_events','amount', event_type='design_option_removed', option_category='cabinetry') + SUM('design_events','amount', event_type='design_option_removed', option_category='countertops') + SUM('design_events','amount', event_type='design_option_removed', option_category='flooring') + SUM('design_events','amount', event_type='design_option_removed', option_category='appliances') + SUM('design_events','amount', event_type='design_option_removed', option_category='exterior')"
      - credit_granted_total: "SUM('design_events','amount', event_type='design_credit_granted')"
      - credit_applied_total: "SUM('design_events','amount', event_type='design_credit_applied')"
      - credit_unapplied: "MX(0, credit_granted_total - SUM('design_events','amount', event_type='design_credit_forfeited') - credit_applied_total)"
      - goodwill_unapplied: "SUM('design_events','amount', event_type='design_credit_granted', credit_source='builder_goodwill') - SUM('design_events','amount', event_type='design_credit_applied', credit_source='builder_goodwill')"
      - credit_offset: "(credit_applied_total + credit_unapplied) if goodwill_unapplied > 0 else ((credit_applied_total + credit_unapplied * K('other_unapplied_share')) if (goodwill_unapplied <= 0 and credit_unapplied > 0) else credit_applied_total)"
      - finish_group: "MX(0, finish_added - finish_removed - long_lead_added + long_lead_removed - long_lead_credit_to_finish - credit_offset)"
      - option_total_now: "F('option_total')"
      - ladder_floor: "P('deposit_ladder_elevated_pct') if option_total_now > P('deposit_ladder_threshold_usd') else 0"
      - agreement_base_price: "CFIELD('purchase','base_price', purchase_id=F('purchase_id'))"
      - cap_excess: "MX(0, option_total_now - P('option_cap_pct_of_base') / 100 * agreement_base_price)"
      - line_deposit: "MX(RND(structural_group * MX(structural_pct, ladder_floor) / 100, 2) + RND(long_lead_group * MX(long_lead_pct, ladder_floor) / 100, 2) + RND(finish_group * MX(finish_pct, ladder_floor) / 100, 2), cap_excess)"
      - deposit_financing: "CFIELD('purchase','financing_type', purchase_id=F('purchase_id'))"
      - deposit_lock_status: "CFIELD('lock','status', purchase_id=F('purchase_id'))"
      - lender_relief_pct: "K('locked_relief_pct') if (deposit_financing == 'calloway_home_mortgage' and deposit_lock_status == 'locked') else (K('unlocked_relief_pct') if (deposit_financing == 'calloway_home_mortgage' and deposit_lock_status != 'locked') else 0)"
      - relieved_line_deposit: "RND(line_deposit * (100 - lender_relief_pct) / 100, 2)"
      - studio_fee_lines: "SUM('design_events','amount', event_type='design_option_added', option_category='design_consult_fee') + SUM('design_events','amount', event_type='design_option_added', option_category='package_fee') + SUM('design_events','amount', event_type='design_option_added', option_category='card_convenience_fee') + SUM('design_events','amount', event_type='design_option_added', option_category='returned_payment_fee')"
      - order_fees: "SUM('design_events','amount', event_type='design_change_order_recorded')"
      - deposits_held: "F('option_deposit_held')"
      - result: "MX(0, RND(relieved_line_deposit + studio_fee_lines + order_fees - deposits_held, 2))"
    compute_basis:
      structural_added: "the structural group, being the structural, electrical and plumbing lines less the removal credits booked on lines of those categories, at the structural deposit percent"
      structural_removed: "the structural group, being the structural, electrical and plumbing lines less the removal credits booked on lines of those categories, at the structural deposit percent"
      structural_group: "the structural group, being the structural, electrical and plumbing lines less the removal credits booked on lines of those categories, at the structural deposit percent"
      deposit_stage: "The structural deposit percent is set by the construction stage of the purchase agreement the file serves"
      structural_pct: "at framing, drywall, finishes or complete it is framing_structural_pct percent; at foundation it is foundation_structural_pct percent; at any other stage it is the package's structural deposit percent."
      returned_last_year: "The finish deposit percent is set by the option deposit payments returned unpaid on the file in the last 12 months"
      finish_pct: "two or more returned payments raise it to the package's elevated ladder percent; exactly one returned payment raises it to one_return_finish_pct percent; with none it is the package's finish deposit percent."
      long_lead_added: "the long-lead group, being the cabinetry and countertop lines added while the agreement's construction stage was foundation or framing less the long-lead removal credits deducted from it, at the long-lead deposit percent"
      long_lead_pct: "where they total long_lead_full_usd or more it is long_lead_full_pct percent; where they total less than long_lead_full_usd it is long_lead_partial_pct percent; where there are none it is the finish deposit percent."
      long_lead_removed: "The long-lead removal credits are the removal credits booked on cabinetry and countertop lines while the agreement's construction stage was foundation or framing, whenever those lines were added"
      long_lead_group: "The long-lead credit rule places the long-lead removal credits: where cabinetry or countertop lines were also added while the construction stage was foundation or framing, the removed item counts as replaced, its credits are deducted from neither group and the long-lead group is the added lines alone; where long-lead removal credits exist but no such line was added at those stages, the credits are deducted from the finish group and not from the long-lead group; otherwise the long-lead removal credits are deducted from the long-lead group."
      long_lead_credit_to_finish: "where long-lead removal credits exist but no such line was added at those stages, the credits are deducted from the finish group and not from the long-lead group"
      finish_added: "the finish group, being every other cabinetry, countertop, flooring, appliance and exterior line less the removal credits booked on those lines other than the long-lead removal credits, less any long-lead removal credits sent to it, and less the credit offset, never below zero, at the finish deposit percent. The long-lead removal credits are the removal credits booked on cabinetry and countertop lines while the agreement's construction stage was foundation or framing, whenever those lines were added; they are deducted only where the long-lead credit rule places them."
      finish_removed: "the finish group, being every other cabinetry, countertop, flooring, appliance and exterior line less the removal credits booked on those lines other than the long-lead removal credits, less any long-lead removal credits sent to it, and less the credit offset, never below zero, at the finish deposit percent. The long-lead removal credits are the removal credits booked on cabinetry and countertop lines while the agreement's construction stage was foundation or framing, whenever those lines were added; they are deducted only where the long-lead credit rule places them."
      credit_granted_total: "the credit offset is all design credit granted on the file less any credit forfeited"
      credit_applied_total: "the credit offset is the design credit already applied to option lines on the file"
      credit_unapplied: "where only credit of other sources stands unapplied, the credit offset is the credit already applied plus other_unapplied_share of the unapplied credit"
      goodwill_unapplied: "where builder goodwill credit granted on the file is not yet fully applied"
      credit_offset: "The credit offset is set by the design credit standing on the file: where builder goodwill credit granted on the file is not yet fully applied, the credit offset is all design credit granted on the file less any credit forfeited; where only credit of other sources stands unapplied, the credit offset is the credit already applied plus other_unapplied_share of the unapplied credit; where no credit stands unapplied, the credit offset is the credit already applied."
      finish_group: "the finish group, being every other cabinetry, countertop, flooring, appliance and exterior line less the removal credits booked on those lines other than the long-lead removal credits, less any long-lead removal credits sent to it, and less the credit offset, never below zero, at the finish deposit percent. The long-lead removal credits are the removal credits booked on cabinetry and countertop lines while the agreement's construction stage was foundation or framing, whenever those lines were added; they are deducted only where the long-lead credit rule places them."
      option_total_now: "Where the file's option total exceeds the package's deposit ladder threshold, no deposit percent used for a group is below the package's elevated ladder percent"
      ladder_floor: "Where the file's option total exceeds the package's deposit ladder threshold, no deposit percent used for a group is below the package's elevated ladder percent"
      agreement_base_price: "the line deposit is never less than the part of the file's option total above the package's option cap percent of the agreement's base price."
      cap_excess: "the line deposit is never less than the part of the file's option total above the package's option cap percent of the agreement's base price."
      line_deposit: "The line deposit is the sum of three group deposits, each rounded half up to the cent"
      deposit_financing: "The lender relief percent is set by the financing of the purchase agreement the file serves"
      deposit_lock_status: "where the agreement is financed through Calloway Home Mortgage and the rate lock on that agreement is locked, the line deposit is reduced by locked_relief_pct percent"
      lender_relief_pct: "where the agreement is financed through Calloway Home Mortgage and the rate lock on that agreement is locked, the line deposit is reduced by locked_relief_pct percent; where the agreement is financed through Calloway Home Mortgage and no rate lock on that agreement is locked, it is reduced by unlocked_relief_pct percent; where the agreement is financed by an outside lender or by cash, there is no relief."
      relieved_line_deposit: "The lender relief percent is applied to the line deposit after that comparison, rounded half up to the cent, and never to the studio fee lines or the change order fees."
      studio_fee_lines: "plus every studio fee line and every change order fee in full"
      order_fees: "plus every studio fee line and every change order fee in full"
      deposits_held: "less the option deposits held on the file, never below zero."
      result: "The option deposit due on the file is the line deposit, reduced by the lender relief percent, plus every studio fee line and every change order fee in full, less the option deposits held on the file, never below zero."
    factors:
      - id: structural_stage_percent
        effect: parameter
        decides: structural_pct
        bindings: [deposit_stage, structural_pct]
        ladder:
          - when: "the agreement's construction stage is framing, drywall, finishes or complete"
            value: "K('framing_structural_pct')"
          - when: "the agreement's construction stage is foundation"
            value: "K('foundation_structural_pct')"
          - when: "otherwise"
            value: "P('structural_deposit_pct')"
        baseline:
          structural_pct: "P('structural_deposit_pct')"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: returned_payment_finish_percent
        effect: parameter
        decides: finish_pct
        bindings: [returned_last_year, finish_pct]
        ladder:
          - when: "two or more option deposit payments were returned unpaid on the file in the last 12 months"
            value: "P('deposit_ladder_elevated_pct')"
          - when: "exactly one option deposit payment was returned unpaid in the last 12 months"
            value: "K('one_return_finish_pct')"
          - when: "otherwise (none)"
            value: "P('finish_deposit_pct')"
        baseline:
          finish_pct: "P('finish_deposit_pct')"
        evidence: [history]
        cross_difficulty: null
      - id: long_lead_percent
        effect: parameter
        decides: long_lead_pct
        bindings: [long_lead_added, long_lead_pct]
        ladder:
          - when: "cabinetry and countertop lines added at foundation or framing total long_lead_full_usd or more"
            value: "K('long_lead_full_pct')"
          - when: "such lines total less than long_lead_full_usd"
            value: "K('long_lead_partial_pct')"
          - when: "otherwise (none)"
            value: "the finish deposit percent"
        baseline:
          long_lead_pct: "finish_pct"
        evidence: [history]
        cross_difficulty: null
      - id: long_lead_credit_rule
        effect: method
        decides: long_lead_group
        bindings: [long_lead_removed, long_lead_group, long_lead_credit_to_finish]
        ladder:
          - when: "long-lead removal credits exist and cabinetry or countertop lines were also added at foundation or framing"
            method: "the removed item counts as replaced: its credits are deducted from neither group and the long-lead group is the added lines alone"
          - when: "long-lead removal credits exist and no such line was added at those stages"
            method: "the credits are deducted from the finish group instead of the long-lead group"
          - when: "otherwise"
            method: "the long-lead removal credits are deducted from the long-lead group"
        baseline:
          long_lead_group: "MX(0, long_lead_added - long_lead_removed)"
          long_lead_credit_to_finish: "0"
        evidence: [history]
        cross_difficulty: null
      - id: credit_offset_method
        effect: method
        decides: credit_offset
        bindings: [credit_granted_total, credit_applied_total, credit_unapplied, goodwill_unapplied, credit_offset]
        ladder:
          - when: "builder goodwill credit granted on the file is not yet fully applied"
            method: "the credit offset is all design credit granted less any credit forfeited"
          - when: "only credit of other sources stands unapplied"
            method: "the credit offset is the credit applied plus other_unapplied_share of the unapplied credit"
          - when: "otherwise (no credit stands unapplied)"
            method: "the credit offset is the credit already applied"
        baseline:
          credit_offset: "credit_applied_total"
        evidence: [history]
        cross_difficulty: null
      - id: lender_relief
        effect: parameter
        decides: lender_relief_pct
        bindings: [deposit_financing, deposit_lock_status, lender_relief_pct]
        ladder:
          - when: "the agreement is financed through Calloway Home Mortgage and its rate lock is locked"
            value: "K('locked_relief_pct')"
          - when: "the agreement is financed through Calloway Home Mortgage and no rate lock on it is locked"
            value: "K('unlocked_relief_pct')"
          - when: "otherwise (outside lender or cash)"
            value: "0"
        baseline:
          lender_relief_pct: "0"
        evidence: [cross_category]
        cross_difficulty: lock
    baseline:
      rule: >-
        The option deposit due on the file is the line deposit, reduced by the lender relief percent,
        plus every studio fee line and every change order fee in full, less the option deposits held on
        the file, never below zero. A payment of the option deposit due is posted against the line number
        of the most recently added option line on the file that is not a studio fee line. The line deposit
        is the sum of three group deposits, each rounded half up to the cent: the structural group, being
        the structural, electrical and plumbing lines less the removal credits booked on lines of those
        categories, at the structural deposit percent; the long-lead group, being the cabinetry and countertop lines added while the agreement's construction stage was foundation or framing less the long-lead removal credits deducted from it, at the long-lead deposit percent; and the finish group, being every other cabinetry, countertop, flooring, appliance and
        exterior line less the removal credits booked on those lines other than the long-lead removal credits, less any long-lead removal credits sent to it, and less the credit offset, never below zero, at the finish deposit percent. The long-lead removal credits are the removal credits booked on cabinetry and countertop lines while the agreement's construction stage was foundation or framing, whenever those lines were added; they are deducted only where the long-lead credit rule places them. The structural deposit percent is the package's
        structural deposit percent, the finish deposit percent is the package's finish deposit percent,
        the long-lead deposit percent is the finish deposit percent, the credit offset is the design credit
        already applied to option lines on the file, the long-lead removal credits are deducted from the long-lead group, and the lender relief percent is zero. Where the file's option total exceeds the package's deposit ladder
        threshold, no deposit percent used for a group is below the package's elevated ladder percent; and
        the line deposit is never less than the part of the file's option total above the package's option
        cap percent of the agreement's base price. The lender relief percent is applied to the line deposit
        after that comparison, rounded half up to the cent, and never to the studio fee lines or the change
        order fees.
      params: [structural_deposit_pct, finish_deposit_pct, deposit_ladder_threshold_usd, deposit_ladder_elevated_pct, option_cap_pct_of_base]
    inputs:
      history:
        - {table: design_events, aggregate: sum, field: amount, filters: {event_type: design_option_added}}
        - {table: design_events, aggregate: sum, field: amount, filters: {event_type: design_option_removed}}
        - {table: design_events, aggregate: count, field: design_event_id, within_months: 12, filters: {event_type: design_payment_returned}}
        - {table: design_events, aggregate: sum, field: amount, filters: {event_type: design_credit_granted}}
        - {table: design_events, aggregate: sum, field: amount, filters: {event_type: design_credit_applied}}
        - {table: design_events, aggregate: sum, field: amount, filters: {event_type: design_change_order_recorded}}
      cross_category: [purchase, lock]
  - id: design_ext_returned_payment_fee
    base_policy_refs: [design_option_deposits]
    overwrite:
      - base_policy: design_option_deposits
        superseded_clause: >-
          A returned payment comes off the deposits held and adds a returned_payment_fee line of
          returned_payment_fee_usd.
        replaced_by: >-
          The returned payment fee is the fee basis times the repeat-return multiple, plus the purchase
          return addition, plus the late-return addition, and that sum is then charged at the cure rate,
          rounded half up to the cent once at the end.
    trigger: state_due
    subject: [design_payment_returned]
    computes: fee_amount
    target_tool: book_returned_payment_fee_69a7241d
    params:
      large_return_usd: 5000.00
      large_return_pct: 1
      small_return_usd: 500.00
      small_return_pct: 10
      second_return_multiple: 1.5
      third_return_multiple: 2
      one_purchase_return_addon_usd: 25.00
      two_purchase_return_addon_usd: 50.00
      prompt_return_days: 3
      late_return_days: 10
      slow_return_addon_usd: 10.00
      late_return_addon_usd: 20.00
      cure_window_days: 3
      cleared_cure_pct: 50
      paper_cure_pct: 75
    rule: >-
      Every option deposit payment returned unpaid on the file is charged one returned payment fee line,
      dated on the date Calloway was notified of the return and carrying the receipt number of the
      returned payment; the payment charged is the most recently returned payment on the file. The
      returned payment fee is the fee basis times the repeat-return multiple, plus the purchase return
      addition, plus the late-return addition, and that sum is then charged at the cure rate, rounded
      half up to the cent once at the end. The fee basis is the package's returned payment fee, the
      repeat-return multiple is one, the purchase return addition and the late-return addition are
      0.00, and the cure rate is 100 percent.
      The fee basis is set by the amount returned: a returned payment of large_return_usd or more is
      charged large_return_pct percent of the amount returned, and never less than the package's
      returned payment fee; a returned payment below small_return_usd is charged the smaller of the
      package's returned payment fee and small_return_pct percent of the amount returned; any other
      returned payment is charged the package's returned payment fee.
      The repeat-return multiple is set by the option deposit payments returned unpaid on the file in
      the last 12 months, this one included: three or more give third_return_multiple, exactly two give
      second_return_multiple, and a single one gives a multiple of one.
      The purchase return addition is set by the deposit payments returned unpaid on the buyer's
      purchase agreement ledger in the last 12 months: two or more add two_purchase_return_addon_usd,
      exactly one adds one_purchase_return_addon_usd, and none adds nothing.
      The late-return addition is set by the calendar days from the date the returned payment was
      posted to the date of its return: more than late_return_days days add late_return_addon_usd; more
      than prompt_return_days days and up to late_return_days days add slow_return_addon_usd;
      prompt_return_days days or fewer add nothing.
      The cure rate is set by the most recent option deposit payment posted on the file, counted in
      calendar days from the date of the return: an ACH or wire payment posted on the return date or up to cure_window_days days after it brings the cure rate to cleared_cure_pct percent; a check or card payment posted on the return date or up to cure_window_days days after it brings it to paper_cure_pct percent; otherwise the cure rate is 100 percent.
    prerequisite: []
    cross_category:
      - category: purchase
        as: history
        reads: [purchase_events.event_type, purchase_events.event_date]
        note: the purchase return addition counts the deposit payments returned on the buyer's purchase agreement ledger in the last 12 months.
    compute:
      - returned_ref: "LATEST('design_events','source_payment_ref', event_type='design_payment_returned')"
      - return_date: "LATEST('design_events','event_date', event_type='design_payment_returned')"
      - returned_amount: "SUM('design_events','amount', event_type='design_payment_returned', source_payment_ref=returned_ref)"
      - fee_basis: "MX(P('returned_payment_fee_usd'), returned_amount * K('large_return_pct') / 100) if returned_amount >= K('large_return_usd') else (MN(P('returned_payment_fee_usd'), returned_amount * K('small_return_pct') / 100) if returned_amount < K('small_return_usd') else P('returned_payment_fee_usd'))"
      - returns_last_year: "COUNT('design_events', within_months=12, event_type='design_payment_returned')"
      - repeat_return_multiple: "K('third_return_multiple') if returns_last_year >= 3 else (K('second_return_multiple') if returns_last_year == 2 else 1)"
      - purchase_returns_last_year: "XCOUNT('purchase','purchase_events', within_months=12, event_type='purchase_payment_returned')"
      - purchase_return_addition: "K('two_purchase_return_addon_usd') if purchase_returns_last_year >= 2 else (K('one_purchase_return_addon_usd') if purchase_returns_last_year == 1 else 0)"
      - returned_posted_date: "LATEST('design_events','event_date', event_type='design_deposit_paid', payment_reference=returned_ref)"
      - days_to_return: "DAYS(returned_posted_date, return_date)"
      - late_return_addition: "K('late_return_addon_usd') if days_to_return > K('late_return_days') else (K('slow_return_addon_usd') if days_to_return > K('prompt_return_days') else 0)"
      - cure_payment_date: "LATEST('design_events','event_date', event_type='design_deposit_paid')"
      - cure_payment_method: "LATEST('design_events','payment_method', event_type='design_deposit_paid')"
      - days_to_cure: "DAYS(return_date, cure_payment_date)"
      - cure_rate: "K('cleared_cure_pct') if ((cure_payment_method == 'ach' or cure_payment_method == 'wire') and days_to_cure >= 0 and days_to_cure <= K('cure_window_days')) else (K('paper_cure_pct') if ((cure_payment_method == 'check' or cure_payment_method == 'card') and days_to_cure >= 0 and days_to_cure <= K('cure_window_days')) else 100)"
      - result: "RND((fee_basis * repeat_return_multiple + purchase_return_addition + late_return_addition) * cure_rate / 100, 2)"
    compute_basis:
      returned_ref: "the payment charged is the most recently returned payment on the file."
      return_date: "dated on the date Calloway was notified of the return and carrying the receipt number of the returned payment"
      returned_amount: "The fee basis is set by the amount returned"
      fee_basis: "a returned payment of large_return_usd or more is charged large_return_pct percent of the amount returned, and never less than the package's returned payment fee; a returned payment below small_return_usd is charged the smaller of the package's returned payment fee and small_return_pct percent of the amount returned; any other returned payment is charged the package's returned payment fee."
      returns_last_year: "The repeat-return multiple is set by the option deposit payments returned unpaid on the file in the last 12 months, this one included"
      repeat_return_multiple: "three or more give third_return_multiple, exactly two give second_return_multiple, and a single one gives a multiple of one."
      purchase_returns_last_year: "The purchase return addition is set by the deposit payments returned unpaid on the buyer's purchase agreement ledger in the last 12 months"
      purchase_return_addition: "two or more add two_purchase_return_addon_usd, exactly one adds one_purchase_return_addon_usd, and none adds nothing."
      returned_posted_date: "The late-return addition is set by the calendar days from the date the returned payment was posted to the date of its return"
      days_to_return: "The late-return addition is set by the calendar days from the date the returned payment was posted to the date of its return"
      late_return_addition: "more than late_return_days days add late_return_addon_usd; more than prompt_return_days days and up to late_return_days days add slow_return_addon_usd; prompt_return_days days or fewer add nothing."
      cure_payment_date: "The cure rate is set by the most recent option deposit payment posted on the file, counted in calendar days from the date of the return"
      cure_payment_method: "an ACH or wire payment posted on the return date or up to cure_window_days days after it brings the cure rate to cleared_cure_pct percent"
      days_to_cure: "The cure rate is set by the most recent option deposit payment posted on the file, counted in calendar days from the date of the return"
      cure_rate: "an ACH or wire payment posted on the return date or up to cure_window_days days after it brings the cure rate to cleared_cure_pct percent; a check or card payment posted on the return date or up to cure_window_days days after it brings it to paper_cure_pct percent; otherwise the cure rate is 100 percent."
      result: "The returned payment fee is the fee basis times the repeat-return multiple, plus the purchase return addition, plus the late-return addition, and that sum is then charged at the cure rate, rounded half up to the cent once at the end."
    factors:
      - id: return_fee_basis
        effect: method
        decides: fee_basis
        bindings: [returned_amount, fee_basis]
        ladder:
          - when: "the amount returned is large_return_usd or more"
            method: "large_return_pct percent of the amount returned, never less than the package's returned payment fee"
          - when: "the amount returned is below small_return_usd"
            method: "the smaller of the package's returned payment fee and small_return_pct percent of the amount returned"
          - when: "otherwise"
            method: "the package's returned payment fee"
        baseline:
          fee_basis: "P('returned_payment_fee_usd')"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_return_multiple
        effect: parameter
        decides: repeat_return_multiple
        bindings: [returns_last_year, repeat_return_multiple]
        ladder:
          - when: "three or more option deposit payments returned on the file in the last 12 months"
            value: "K('third_return_multiple')"
          - when: "exactly two returned in the last 12 months"
            value: "K('second_return_multiple')"
          - when: "otherwise (this one only)"
            value: "1"
        baseline:
          repeat_return_multiple: "1"
        evidence: [history]
        cross_difficulty: null
      - id: purchase_return_addition
        effect: parameter
        decides: purchase_return_addition
        bindings: [purchase_returns_last_year, purchase_return_addition]
        ladder:
          - when: "two or more deposit payments returned on the purchase agreement ledger in the last 12 months"
            value: "K('two_purchase_return_addon_usd')"
          - when: "exactly one returned on the purchase agreement ledger in the last 12 months"
            value: "K('one_purchase_return_addon_usd')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          purchase_return_addition: "0"
        evidence: [cross_category, history]
        cross_difficulty: purchase
      - id: late_return_addition
        effect: parameter
        decides: late_return_addition
        bindings: [returned_posted_date, days_to_return, late_return_addition]
        ladder:
          - when: "the payment was returned more than late_return_days days after it posted"
            value: "K('late_return_addon_usd')"
          - when: "returned more than prompt_return_days and up to late_return_days days after it posted"
            value: "K('slow_return_addon_usd')"
          - when: "otherwise (prompt_return_days days or fewer)"
            value: "0"
        baseline:
          late_return_addition: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: cure_rate
        effect: parameter
        decides: cure_rate
        bindings: [cure_payment_date, cure_payment_method, days_to_cure, cure_rate]
        ladder:
          - when: "the most recent payment is an ACH or wire payment posted on the return date or up to cure_window_days days after it"
            value: "K('cleared_cure_pct')"
          - when: "the most recent payment is a check or card payment posted on the return date or up to cure_window_days days after it"
            value: "K('paper_cure_pct')"
          - when: "otherwise"
            value: "100"
        baseline:
          cure_rate: "100"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        Every option deposit payment returned unpaid on the file is charged one returned payment fee line,
        dated on the date Calloway was notified of the return and carrying the receipt number of the
        returned payment; the payment charged is the most recently returned payment on the file. The
        returned payment fee is the fee basis times the repeat-return multiple, plus the purchase return
        addition, plus the late-return addition, and that sum is then charged at the cure rate, rounded
        half up to the cent once at the end. The fee basis is the package's returned payment fee, the
        repeat-return multiple is one, the purchase return addition and the late-return addition are
        0.00, and the cure rate is 100 percent.
      params: [returned_payment_fee_usd]
    inputs:
      history:
        - {table: design_events, aggregate: count, field: design_event_id, within_months: 12, filters: {event_type: design_payment_returned}}
        - {table: design_events, aggregate: latest, field: event_date, filters: {event_type: design_deposit_paid}}
        - {category: purchase, table: purchase_events, aggregate: count, field: purchase_event_id, within_months: 12, filters: {event_type: purchase_payment_returned}}
      cross_category: [purchase]
  - id: design_ext_removed_line_allowance
    base_policy_refs: [design_credits, design_option_selection]
    overwrite: []
    trigger: state_due
    subject: [design_credit_granted]
    computes: credit_amount
    target_tool: return_line_allowance_4e51d426
    params:
      started_long_lead_share: 50
      started_finish_share: 75
      top_premium_points: 15
      premium_points: 10
      long_delay_days: 30
      short_delay_days: 7
      long_delay_points: 10
      short_delay_points: 5
    rule: >-
      When an option line carrying package allowance is removed, the allowance applied to it is
      returned to the file under its own credit memo carrying the removed line's number; the return
      restores allowance already granted and is not a second grant of the package allowance. The line
      concerned is the most recently removed option line on the file. The allowance return is the return
      measure times the return percent, rounded half up to the cent; the return percent is the return
      share plus the homesite points plus the delay points, never above 100. The return measure is all
      package allowance applied to the removed line, and the return share is 100 percent with no
      homesite points and no delay points.
      The return measure is set by how the removed line was credited: where its removal credit was
      below the price at which it had been selected, the return measure is the allowance applied to it
      times its removal credit divided by that price, rounded half up to the cent; where it was credited
      at its full price and allowance was applied to it in more than one entry, the return measure is
      the most recent allowance entry applied to it; otherwise the return measure is all package
      allowance applied to it.
      The return share is set by when and what was removed: a cabinetry or countertop line removed while the agreement's construction stage was foundation, framing, drywall, finishes or complete returns
      started_long_lead_share percent; any other line removed at one of those stages returns
      started_finish_share percent; a line removed before construction started returns 100 percent.
      Homesite points are set by the premium class of the homesite reservation converted into the
      purchase agreement the file serves: a Water-View Homesite or Golf-Frontage Homesite adds
      top_premium_points points; a Greenbelt Homesite or Cul-de-Sac Homesite adds premium_points
      points; any other class, or no converted reservation, adds none.
      Delay points are set by the calendar days from the removal to the day the allowance is returned:
      more than long_delay_days days add long_delay_points points; more than short_delay_days and up to
      long_delay_days days add short_delay_points points; short_delay_days days or fewer add none.
    prerequisite: []
    cross_category:
      - category: purchase
        as: branch
        reads: [reservation_id]
        note: locates the homesite reservation converted into the agreement, for the homesite points.
      - category: homesite
        as: branch
        reads: [variant_name]
        note: the premium class of the converted homesite reservation decides the homesite points.
    compute:
      - removed_line: "LATEST('design_events','source_line_ref', event_type='design_option_removed')"
      - allowance_on_line: "SUM('design_events','amount', event_type='design_credit_applied', credit_source='package_allowance', source_line_ref=removed_line)"
      - selected_price: "SUM('design_events','amount', event_type='design_option_added', option_line_ref=removed_line)"
      - removal_credit_booked: "SUM('design_events','amount', event_type='design_option_removed', source_line_ref=removed_line)"
      - allowance_entries: "COUNT('design_events', event_type='design_credit_applied', credit_source='package_allowance', source_line_ref=removed_line)"
      - return_measure: "RND(allowance_on_line * removal_credit_booked / selected_price, 2) if (selected_price > 0 and removal_credit_booked < selected_price) else (LATEST('design_events','amount', event_type='design_credit_applied', credit_source='package_allowance', source_line_ref=removed_line) if (removal_credit_booked >= selected_price and allowance_entries > 1) else allowance_on_line)"
      - removal_stage: "LATEST('design_events','construction_stage_at_event', event_type='design_option_removed', source_line_ref=removed_line)"
      - removed_category: "LATEST('design_events','option_category', event_type='design_option_removed', source_line_ref=removed_line)"
      - return_share: "K('started_long_lead_share') if ((removal_stage == 'foundation' or removal_stage == 'framing' or removal_stage == 'drywall' or removal_stage == 'finishes' or removal_stage == 'complete') and (removed_category == 'cabinetry' or removed_category == 'countertops')) else (K('started_finish_share') if ((removal_stage == 'foundation' or removal_stage == 'framing' or removal_stage == 'drywall' or removal_stage == 'finishes' or removal_stage == 'complete') and removed_category != 'cabinetry' and removed_category != 'countertops') else 100)"
      - homesite_class: "CFIELD('homesite','variant_name', reservation_id=CFIELD('purchase','reservation_id', purchase_id=F('purchase_id')))"
      - homesite_points: "K('top_premium_points') if (homesite_class == 'Water-View Homesite' or homesite_class == 'Golf-Frontage Homesite') else (K('premium_points') if (homesite_class == 'Greenbelt Homesite' or homesite_class == 'Cul-de-Sac Homesite') else 0)"
      - removal_date: "LATEST('design_events','event_date', event_type='design_option_removed', source_line_ref=removed_line)"
      - days_since_removal: "DAYS(removal_date, NOW)"
      - delay_points: "K('long_delay_points') if days_since_removal > K('long_delay_days') else (K('short_delay_points') if days_since_removal > K('short_delay_days') else 0)"
      - result: "RND(return_measure * MN(100, return_share + homesite_points + delay_points) / 100, 2)"
    compute_basis:
      removed_line: "The line concerned is the most recently removed option line on the file."
      allowance_on_line: "The return measure is all package allowance applied to the removed line"
      selected_price: "where its removal credit was below the price at which it had been selected, the return measure is the allowance applied to it times its removal credit divided by that price, rounded half up to the cent"
      removal_credit_booked: "where its removal credit was below the price at which it had been selected, the return measure is the allowance applied to it times its removal credit divided by that price, rounded half up to the cent"
      allowance_entries: "where it was credited at its full price and allowance was applied to it in more than one entry, the return measure is the most recent allowance entry applied to it"
      return_measure: "The return measure is set by how the removed line was credited: where its removal credit was below the price at which it had been selected, the return measure is the allowance applied to it times its removal credit divided by that price, rounded half up to the cent; where it was credited at its full price and allowance was applied to it in more than one entry, the return measure is the most recent allowance entry applied to it; otherwise the return measure is all package allowance applied to it."
      removal_stage: "The return share is set by when and what was removed"
      removed_category: "The return share is set by when and what was removed"
      return_share: "a cabinetry or countertop line removed while the agreement's construction stage was foundation, framing, drywall, finishes or complete returns started_long_lead_share percent; any other line removed at one of those stages returns started_finish_share percent; a line removed before construction started returns 100 percent."
      homesite_class: "Homesite points are set by the premium class of the homesite reservation converted into the purchase agreement the file serves"
      homesite_points: "a Water-View Homesite or Golf-Frontage Homesite adds top_premium_points points; a Greenbelt Homesite or Cul-de-Sac Homesite adds premium_points points; any other class, or no converted reservation, adds none."
      removal_date: "Delay points are set by the calendar days from the removal to the day the allowance is returned"
      days_since_removal: "Delay points are set by the calendar days from the removal to the day the allowance is returned"
      delay_points: "more than long_delay_days days add long_delay_points points; more than short_delay_days and up to long_delay_days days add short_delay_points points; short_delay_days days or fewer add none."
      result: "The allowance return is the return measure times the return percent, rounded half up to the cent; the return percent is the return share plus the homesite points plus the delay points, never above 100."
    factors:
      - id: return_measure
        effect: method
        decides: return_measure
        bindings: [allowance_on_line, selected_price, removal_credit_booked, allowance_entries, return_measure]
        ladder:
          - when: "the removed line's removal credit was below the price at which it had been selected"
            method: "the allowance applied to it times its removal credit divided by its selected price"
          - when: "the line was credited at its full price and allowance was applied to it in more than one entry"
            method: "the most recent allowance entry applied to it"
          - when: "otherwise"
            method: "all package allowance applied to it"
        baseline:
          return_measure: "allowance_on_line"
        evidence: [history]
        cross_difficulty: null
      - id: removal_return_share
        effect: parameter
        decides: return_share
        bindings: [removal_stage, removed_category, return_share]
        ladder:
          - when: "a cabinetry or countertop line removed at foundation, framing, drywall or finishes"
            value: "K('started_long_lead_share')"
          - when: "any other line removed at one of those stages"
            value: "K('started_finish_share')"
          - when: "otherwise (removed before construction started)"
            value: "100"
        baseline:
          return_share: "100"
        evidence: [history]
        cross_difficulty: null
      - id: homesite_points
        effect: parameter
        decides: homesite_points
        bindings: [homesite_class, homesite_points]
        ladder:
          - when: "the converted homesite reservation is a Water-View Homesite or Golf-Frontage Homesite"
            value: "K('top_premium_points')"
          - when: "it is a Greenbelt Homesite or Cul-de-Sac Homesite"
            value: "K('premium_points')"
          - when: "otherwise (any other class, or no converted reservation)"
            value: "0"
        baseline:
          homesite_points: "0"
        evidence: [cross_category]
        cross_difficulty: homesite
      - id: delay_points
        effect: parameter
        decides: delay_points
        bindings: [removal_date, days_since_removal, delay_points]
        ladder:
          - when: "the line was removed more than long_delay_days days before the return"
            value: "K('long_delay_points')"
          - when: "removed more than short_delay_days and up to long_delay_days days before the return"
            value: "K('short_delay_points')"
          - when: "otherwise (short_delay_days days or fewer)"
            value: "0"
        baseline:
          delay_points: "0"
        evidence: [history, date]
        cross_difficulty: null
    baseline:
      rule: >-
        When an option line carrying package allowance is removed, the allowance applied to it is
        returned to the file under its own credit memo carrying the removed line's number; the return
        restores allowance already granted and is not a second grant of the package allowance. The line
        concerned is the most recently removed option line on the file. The allowance return is the return
        measure times the return percent, rounded half up to the cent; the return percent is the return
        share plus the homesite points plus the delay points, never above 100. The return measure is all
        package allowance applied to the removed line, and the return share is 100 percent with no
        homesite points and no delay points.
      params: []
    inputs:
      history:
        - {table: design_events, aggregate: sum, field: amount, filters: {event_type: design_credit_applied, credit_source: package_allowance}}
        - {table: design_events, aggregate: latest, field: source_line_ref, filters: {event_type: design_option_removed}}
      cross_category: [purchase, homesite]
  - id: design_ext_line_reinstatement_price
    base_policy_refs: [design_option_selection, design_package_eligibility, design_appointments, design_change_orders, design_option_deposits]
    overwrite:
      - base_policy: design_option_selection
        superseded_clause: >-
          after that the current studio price applies.
        replaced_by: >-
          A reinstated line is priced by this rule alone, never at a quoted price or at the current studio price, whether or not the appointment it is recorded against falls within the package's price protection days; the age of its price is counted from the date the removed line was first selected.
      - base_policy: design_option_selection
        superseded_clause: >-
          Options are added to the file at the price quoted at the appointment.
        replaced_by: >-
          The reinstatement price is the reinstatement basis raised by the quote escalation percent and
          rounded half up to the cent, plus the re-order surcharge, the re-selection fee and the lender
          amendment fee, less the credit carried, never below zero.
    trigger: on_request
    subject: [design_option_added]
    computes: price
    target_tool: reinstate_option_line_5b4fa2c4
    params:
      reinstate_window_days: 30
      retained_share_back_pct: 50
      mid_quote_escalation_pct: 3
      long_quote_days: 90
      long_quote_escalation_pct: 6
      framing_reorder_usd: 250.00
      foundation_reorder_usd: 125.00
      two_order_reselect_usd: 100.00
      one_order_reselect_usd: 50.00
      cash_amendment_share_pct: 50
    rule: >-
      A buyer may put back the most recently removed option line on the file through the buyer portal; the
      reinstated line keeps the catalog code and category of the removed line, is written under the change order that removed it and is recorded against the most recent selection appointment on the file. The reinstatement price is the reinstatement basis raised by the quote
      escalation percent and rounded half up to the cent, plus the re-order surcharge, the re-selection
      fee and the lender amendment fee, less the credit carried, never below zero. The reinstatement
      basis is the price at which the removed line had been selected, the quote escalation percent is
      zero, the re-order surcharge, the re-selection fee and the lender amendment fee are 0.00, and the
      credit carried is the design credit applied to the removed line less any credit returned to the
      file for that line, never below zero.
      
      A reinstated line is priced by this rule alone, never at a quoted price or at the current studio price, whether or not the appointment it is recorded against falls within the package's price protection days; the age of its price is counted from the date the removed line was first selected.
      The reinstatement basis is set by when the line was removed and how long ago: a line removed after
      construction started (its removal entry shows the stage foundation, framing, drywall or finishes)
      and put back within reinstate_window_days days of its removal is reinstated at the removal credit
      booked for it; a line removed after construction started and put back more than
      reinstate_window_days days after its removal is reinstated at that removal credit plus
      retained_share_back_pct percent of the part of its price Calloway retained; a line removed before
      construction started is reinstated at the price at which it had been selected.
      The quote escalation percent is set by the calendar days from the date the removed line was first
      selected to the day it is put back: more than long_quote_days days give long_quote_escalation_pct
      percent; more than the package's price protection days and up to long_quote_days days give
      mid_quote_escalation_pct percent; the package's price protection days or fewer give none.
      The re-order surcharge is set by the construction stage of the purchase agreement the file serves: framing, drywall, finishes or complete add framing_reorder_usd; foundation adds foundation_reorder_usd; any
      other stage adds nothing.
      The re-selection fee is set by the buyer-requested change orders recorded on the file: two or more
      add two_order_reselect_usd, exactly one adds one_order_reselect_usd, none adds nothing.
      The lender amendment fee is set by the financing of the purchase agreement the file serves: an
      agreement financed by an outside lender adds the purchase collection's contract amendment fee; a
      cash agreement adds cash_amendment_share_pct percent of that fee; an agreement financed through
      Calloway Home Mortgage adds nothing.
      A removed option line is reinstated only after every option deposit payment returned unpaid on the
      file carries its returned payment fee line. The reinstatement price is not fixed until the package
      allowance applied to the removed line stands returned on the file under its own credit memo.
    prerequisite:
      - problem: design_ext_removed_line_allowance
        kind: value_input
        gate: credit_carried
        form: state
        policy_source: >-
          The reinstatement price is not fixed until the package allowance applied to the removed line
          stands returned on the file under its own credit memo.
        condition: >-
          The file carries a package_allowance credit grant whose source line number is the removed
          line's number.
        resolved_by: return_line_allowance_4e51d426
        effect: >-
          The allowance return enters the credit returned for the removed line, so credit_carried falls by
          the amount returned and the reinstatement price rises by it.
      - problem: design_ext_returned_payment_fee
        kind: state_gate
        gate: design_events.option_category
        form: state
        policy_source: >-
          A removed option line is reinstated only after every option deposit payment returned unpaid on the
          file carries its returned payment fee line.
        condition: >-
          Every design_payment_returned entry on the file has a returned_payment_fee option line carrying
          its receipt number or dated on its return date.
        resolved_by: book_returned_payment_fee_69a7241d
        effect: >-
          The returned payment fee line for the most recent returned payment is booked, so the file is in
          the standing the reinstatement waits on.
    cross_category:
      - category: purchase
        as: branch
        reads: [construction_stage, financing_type, contract_amendment_fee_usd]
        note: decides the re-order surcharge from the agreement's construction stage and the lender amendment fee from its financing and collection.
    compute:
      - reinstated_line: "LATEST('design_events','source_line_ref', event_type='design_option_removed')"
      - line_selected_price: "SUM('design_events','amount', event_type='design_option_added', option_line_ref=reinstated_line)"
      - line_removal_credit: "SUM('design_events','amount', event_type='design_option_removed', source_line_ref=reinstated_line)"
      - line_removal_stage: "LATEST('design_events','construction_stage_at_event', event_type='design_option_removed', source_line_ref=reinstated_line)"
      - days_since_line_removal: "DAYS(LATEST('design_events','event_date', event_type='design_option_removed', source_line_ref=reinstated_line), NOW)"
      - reinstatement_basis: "line_removal_credit if ((line_removal_stage == 'foundation' or line_removal_stage == 'framing' or line_removal_stage == 'drywall' or line_removal_stage == 'finishes') and days_since_line_removal <= K('reinstate_window_days')) else ((line_removal_credit + (line_selected_price - line_removal_credit) * K('retained_share_back_pct') / 100) if ((line_removal_stage == 'foundation' or line_removal_stage == 'framing' or line_removal_stage == 'drywall' or line_removal_stage == 'finishes') and days_since_line_removal > K('reinstate_window_days')) else line_selected_price)"
      - first_selected_date: "LATEST('design_events','event_date', event_type='design_option_added', option_line_ref=reinstated_line)"
      - quote_age_days: "DAYS(first_selected_date, NOW)"
      - quote_escalation_pct: "K('long_quote_escalation_pct') if quote_age_days > K('long_quote_days') else (K('mid_quote_escalation_pct') if quote_age_days > P('option_price_protection_days') else 0)"
      - reinstate_stage: "CFIELD('purchase','construction_stage', purchase_id=F('purchase_id'))"
      - reorder_surcharge: "K('framing_reorder_usd') if (reinstate_stage == 'framing' or reinstate_stage == 'drywall' or reinstate_stage == 'finishes' or reinstate_stage == 'complete') else (K('foundation_reorder_usd') if reinstate_stage == 'foundation' else 0)"
      - buyer_orders_on_file: "COUNT('design_events', event_type='design_change_order_recorded', change_order_reason='buyer_request')"
      - reselection_fee: "K('two_order_reselect_usd') if buyer_orders_on_file >= 2 else (K('one_order_reselect_usd') if buyer_orders_on_file == 1 else 0)"
      - reinstate_financing: "CFIELD('purchase','financing_type', purchase_id=F('purchase_id'))"
      - collection_amendment_fee: "CPARAM('purchase','contract_amendment_fee_usd', purchase_id=F('purchase_id'))"
      - lender_amendment_fee: "collection_amendment_fee if reinstate_financing == 'outside_lender' else (collection_amendment_fee * K('cash_amendment_share_pct') / 100 if reinstate_financing == 'cash' else 0)"
      - credit_carried: "MX(0, SUM('design_events','amount', event_type='design_credit_applied', source_line_ref=reinstated_line) - SUM('design_events','amount', event_type='design_credit_granted', source_line_ref=reinstated_line))"
      - result: "MX(0, RND(RND(reinstatement_basis * (100 + quote_escalation_pct) / 100, 2) + reorder_surcharge + reselection_fee + lender_amendment_fee - credit_carried, 2))"
    compute_basis:
      reinstated_line: "A buyer may put back the most recently removed option line on the file through the buyer portal"
      line_selected_price: "The reinstatement basis is the price at which the removed line had been selected"
      line_removal_credit: "is reinstated at the removal credit booked for it"
      line_removal_stage: "a line removed after construction started (its removal entry shows the stage foundation, framing, drywall or finishes)"
      days_since_line_removal: "put back within reinstate_window_days days of its removal"
      reinstatement_basis: "a line removed after construction started (its removal entry shows the stage foundation, framing, drywall or finishes) and put back within reinstate_window_days days of its removal is reinstated at the removal credit booked for it; a line removed after construction started and put back more than reinstate_window_days days after its removal is reinstated at that removal credit plus retained_share_back_pct percent of the part of its price Calloway retained; a line removed before construction started is reinstated at the price at which it had been selected."
      first_selected_date: "The quote escalation percent is set by the calendar days from the date the removed line was first selected to the day it is put back"
      quote_age_days: "The quote escalation percent is set by the calendar days from the date the removed line was first selected to the day it is put back"
      quote_escalation_pct: "more than long_quote_days days give long_quote_escalation_pct percent; more than the package's price protection days and up to long_quote_days days give mid_quote_escalation_pct percent; the package's price protection days or fewer give none."
      reinstate_stage: "The re-order surcharge is set by the construction stage of the purchase agreement the file serves"
      reorder_surcharge: "framing, drywall, finishes or complete add framing_reorder_usd; foundation adds foundation_reorder_usd; any other stage adds nothing."
      buyer_orders_on_file: "The re-selection fee is set by the buyer-requested change orders recorded on the file"
      reselection_fee: "two or more add two_order_reselect_usd, exactly one adds one_order_reselect_usd, none adds nothing."
      reinstate_financing: "The lender amendment fee is set by the financing of the purchase agreement the file serves"
      collection_amendment_fee: "an agreement financed by an outside lender adds the purchase collection's contract amendment fee"
      lender_amendment_fee: "an agreement financed by an outside lender adds the purchase collection's contract amendment fee; a cash agreement adds cash_amendment_share_pct percent of that fee; an agreement financed through Calloway Home Mortgage adds nothing."
      credit_carried: "the credit carried is the design credit applied to the removed line less any credit returned to the file for that line, never below zero."
      result: "The reinstatement price is the reinstatement basis raised by the quote escalation percent and rounded half up to the cent, plus the re-order surcharge, the re-selection fee and the lender amendment fee, less the credit carried, never below zero."
    factors:
      - id: reinstatement_basis
        effect: method
        decides: reinstatement_basis
        bindings: [line_removal_credit, line_removal_stage, days_since_line_removal, reinstatement_basis]
        ladder:
          - when: "the line was removed after construction started and is put back within reinstate_window_days days of its removal"
            method: "the removal credit booked for it"
          - when: "the line was removed after construction started and is put back more than reinstate_window_days days after its removal"
            method: "the removal credit plus retained_share_back_pct percent of the part of its price Calloway retained"
          - when: "otherwise (removed before construction started)"
            method: "the price at which it had been selected"
        baseline:
          reinstatement_basis: "line_selected_price"
        evidence: [history, date]
        cross_difficulty: null
      - id: quote_escalation
        effect: parameter
        decides: quote_escalation_pct
        bindings: [first_selected_date, quote_age_days, quote_escalation_pct]
        ladder:
          - when: "more than long_quote_days days since the line was first selected"
            value: "K('long_quote_escalation_pct')"
          - when: "more than the package's price protection days and up to long_quote_days days"
            value: "K('mid_quote_escalation_pct')"
          - when: "otherwise"
            value: "0"
        baseline:
          quote_escalation_pct: "0"
        evidence: [history, date]
        cross_difficulty: null
      - id: reorder_surcharge
        effect: parameter
        decides: reorder_surcharge
        bindings: [reinstate_stage, reorder_surcharge]
        ladder:
          - when: "the agreement's construction stage is framing, drywall, finishes or complete"
            value: "K('framing_reorder_usd')"
          - when: "the agreement's construction stage is foundation"
            value: "K('foundation_reorder_usd')"
          - when: "otherwise"
            value: "0"
        baseline:
          reorder_surcharge: "0"
        evidence: [cross_category]
        cross_difficulty: purchase
      - id: reselection_fee
        effect: parameter
        decides: reselection_fee
        bindings: [buyer_orders_on_file, reselection_fee]
        ladder:
          - when: "two or more buyer-requested change orders are recorded on the file"
            value: "K('two_order_reselect_usd')"
          - when: "exactly one is recorded"
            value: "K('one_order_reselect_usd')"
          - when: "otherwise (none)"
            value: "0"
        baseline:
          reselection_fee: "0"
        evidence: [history]
        cross_difficulty: null
      - id: lender_amendment_fee
        effect: parameter
        decides: lender_amendment_fee
        bindings: [reinstate_financing, collection_amendment_fee, lender_amendment_fee]
        ladder:
          - when: "the agreement is financed by an outside lender"
            value: "the purchase collection's contract amendment fee"
          - when: "the agreement is a cash purchase"
            value: "K('cash_amendment_share_pct') percent of that fee"
          - when: "otherwise (Calloway Home Mortgage)"
            value: "0"
        baseline:
          lender_amendment_fee: "0"
        evidence: [cross_category]
        cross_difficulty: purchase
    baseline:
      rule: >-
        A buyer may put back the most recently removed option line on the file through the buyer portal; the
        reinstated line keeps the catalog code and category of the removed line, is written under the change order that removed it and is recorded against the most recent selection appointment on the file. The reinstatement price is the reinstatement basis raised by the quote
        escalation percent and rounded half up to the cent, plus the re-order surcharge, the re-selection
        fee and the lender amendment fee, less the credit carried, never below zero. The reinstatement
        basis is the price at which the removed line had been selected, the quote escalation percent is
        zero, the re-order surcharge, the re-selection fee and the lender amendment fee are 0.00, and the
        credit carried is the design credit applied to the removed line less any credit returned to the
        file for that line, never below zero.
      params: [option_price_protection_days]
    inputs:
      history:
        - {table: design_events, aggregate: latest, field: source_line_ref, filters: {event_type: design_option_removed}}
        - {table: design_events, aggregate: sum, field: amount, filters: {event_type: design_credit_applied}}
        - {table: design_events, aggregate: count, field: design_event_id, filters: {event_type: design_change_order_recorded, change_order_reason: buyer_request}}
      cross_category: [purchase]
