        - {table: design_events, aggregate: sum, field: amount, filters: {event_type: design_option_added}}
        - {table: design_events, aggregate: count, field: design_event_id, filters: {event_type: design_change_order_recorded, change_order_reason: builder_error}}
        - {table: design_events, aggregate: sum, field: amount, filters: {event_type: design_credit_granted, credit_source: builder_goodwill}}
      cross_category: [purchase, lock]
  - id: design_ext_studio_consult_fee
    base_policy_refs: [design_appointments, design_option_selection, design_package_eligibility, design_change_orders, design_option_deposits]
    overwrite:
      - base_policy: design_appointments
        superseded_clause: >-
          each further selection appointment carries extra_appointment_fee_usd as a design_consult_fee
          option line.
        replaced_by: >-
          The consultation fee for a selection appointment held beyond the package's included
          appointments is the package's extra appointment fee times the channel rate, times the build
          stage rate, times the billed fee count, times the repeat-visit multiple, times the order relief
          rate, rounded half up to the cent once at the end.
      - base_policy: design_option_selection
        superseded_clause: >-
          After the first appointment, every addition or removal is written under a change order.
        replaced_by: >-
          A consultation fee line is a studio fee line, not a selection change, and carries no change
          order number.
    trigger: state_due
    subject: [design_option_added]
    computes: fee_amount
    target_tool: book_studio_consult_fee_3108e630
    params:
      video_within_hours_pct: 60
      video_over_hours_pct: 80
      settled_build_days: 30
      settled_build_pct: 150
      early_build_pct: 125
      half_visit_share: 0.5
      second_fee_multiple: 1.25
      third_fee_multiple: 1.5
      order_window_days: 7
      large_order_usd: 5000.00
      large_order_relief_pct: 50
      small_order_relief_pct: 75
    rule: >-
      A selection appointment held beyond the package's included appointments is billed with one
      consultation fee line on the file, tied to that appointment's sequence number; the appointment
      billed is the most recent selection appointment on the file, and it is billed only when the
      number of selection appointments held on the file exceeds the package's included appointments.
      A consultation fee line is a studio fee line, not a selection change, and carries no change
      order number. The consultation fee for a selection appointment held beyond the package's included
      appointments is the package's extra appointment fee times the channel rate, times the build stage
      rate, times the billed fee count, times the repeat-visit multiple, times the order relief rate,
      rounded half up to the cent once at the end. The channel rate, the build stage rate and the order
      relief rate are each 100 percent, and the billed fee count and the repeat-visit multiple are each
      one.
      The channel rate is set by how the billed appointment was held: an appointment held by video that
      ran longer than the package's appointment hours is billed at video_over_hours_pct percent; an
      appointment held by video within the package's appointment hours is billed at
      video_within_hours_pct percent; an appointment held in the studio is billed at 100 percent.
      The build stage rate is set by the calendar days from the construction start date of the purchase
      agreement the file serves to the date of the billed appointment: an appointment held
      settled_build_days days or more after construction started is billed at settled_build_pct percent;
      an appointment held on or after the construction start date but fewer than settled_build_days days
      after it is billed at early_build_pct percent; an appointment held before construction started, or
      on an agreement where construction has not started, is billed at 100 percent.
      The billed fee count is set by the designer hours the billed appointment used: an appointment that
      ran longer than the package's appointment hours is billed one fee for every started block of the
      package's appointment hours, the hours used divided by the package's appointment hours and rounded
      up to a whole number; an appointment that used half of the package's appointment hours or less is
      billed half_visit_share of a fee; any other appointment is billed one fee.
      The repeat-visit multiple is set by the consultation fee lines already on the file: two or more
      such lines give third_fee_multiple, exactly one gives second_fee_multiple, and none gives a multiple
      of one.
      The order relief rate is set by the change order whose option lines were added most recently on
      the file, counted in calendar days from the billed appointment to the date those lines were added:
      where they were added on the appointment date or up to order_window_days days after it and the option lines added under that change order total large_order_usd or more, the fee is charged at
      large_order_relief_pct percent; where they were added on the appointment date or up to
      order_window_days days after it and the option lines added under that change order total less than large_order_usd, the fee is charged at small_order_relief_pct percent; otherwise the fee is charged
      at 100 percent.
    prerequisite: []
    cross_category:
      - category: purchase
        as: branch
        reads: [construction_start_date]
        note: decides the build stage rate from the construction start date of the purchase agreement the file serves.
    compute:
      - selection_appointments: "COUNT('design_events', event_type='design_appointment_held', appointment_type='selection')"
      - billed_appointment_date: "LATEST('design_events','event_date', event_type='design_appointment_held', appointment_type='selection')"
      - billed_appointment_channel: "LATEST('design_events','appointment_channel', event_type='design_appointment_held', appointment_type='selection')"
      - channel_rate: "K('video_over_hours_pct') if (billed_appointment_channel == 'video' and LATEST('design_events','appointment_hours', event_type='design_appointment_held', appointment_type='selection') > P('appointment_hours')) else (K('video_within_hours_pct') if (billed_appointment_channel == 'video' and LATEST('design_events','appointment_hours', event_type='design_appointment_held', appointment_type='selection') <= P('appointment_hours')) else 100)"
      - construction_start: "CFIELD('purchase','construction_start_date', purchase_id=F('purchase_id'))"
      - days_after_start: "DAYS(construction_start, billed_appointment_date) if construction_start else -1"
      - build_stage_rate: "K('settled_build_pct') if days_after_start >= K('settled_build_days') else (K('early_build_pct') if days_after_start >= 0 else 100)"
      - billed_hours: "LATEST('design_events','appointment_hours', event_type='design_appointment_held', appointment_type='selection')"
      - billed_fee_count: "-((-billed_hours) // P('appointment_hours')) if billed_hours > P('appointment_hours') else (K('half_visit_share') if billed_hours <= P('appointment_hours') / 2 else 1)"
      - consult_lines_on_file: "COUNT('design_events', event_type='design_option_added', option_category='design_consult_fee')"
      - repeat_visit_multiple: "K('third_fee_multiple') if consult_lines_on_file >= 2 else (K('second_fee_multiple') if consult_lines_on_file == 1 else 1)"
      - recent_order: "LATEST('design_events','change_order_number', event_type='design_option_added')"
      - recent_order_date: "LATEST('design_events','event_date', event_type='design_option_added', change_order_number=recent_order)"
      - recent_order_total: "SUM('design_events','amount', event_type='design_option_added', change_order_number=recent_order)"
      - days_to_order: "DAYS(billed_appointment_date, recent_order_date) if recent_order_date else -1"
      - order_relief_rate: "K('large_order_relief_pct') if (days_to_order >= 0 and days_to_order <= K('order_window_days') and recent_order_total >= K('large_order_usd')) else (K('small_order_relief_pct') if (days_to_order >= 0 and days_to_order <= K('order_window_days') and recent_order_total < K('large_order_usd')) else 100)"
      - consult_fee: "RND(P('extra_appointment_fee_usd') * channel_rate / 100 * build_stage_rate / 100 * billed_fee_count * repeat_visit_multiple * order_relief_rate / 100, 2)"
      - result: "consult_fee if selection_appointments > P('included_appointments') else 0"
    compute_basis:
      selection_appointments: "it is billed only when the number of selection appointments held on the file exceeds the package's included appointments."
      billed_appointment_date: "the appointment billed is the most recent selection appointment on the file"
      billed_appointment_channel: "The channel rate is set by how the billed appointment was held"
      channel_rate: "an appointment held by video that ran longer than the package's appointment hours is billed at video_over_hours_pct percent; an appointment held by video within the package's appointment hours is billed at video_within_hours_pct percent; an appointment held in the studio is billed at 100 percent."
      construction_start: "The build stage rate is set by the calendar days from the construction start date of the purchase agreement the file serves to the date of the billed appointment"
      days_after_start: "The build stage rate is set by the calendar days from the construction start date of the purchase agreement the file serves to the date of the billed appointment"
      build_stage_rate: "an appointment held settled_build_days days or more after construction started is billed at settled_build_pct percent; an appointment held on or after the construction start date but fewer than settled_build_days days after it is billed at early_build_pct percent; an appointment held before construction started, or on an agreement where construction has not started, is billed at 100 percent."
      billed_hours: "The billed fee count is set by the designer hours the billed appointment used"
      billed_fee_count: "an appointment that ran longer than the package's appointment hours is billed one fee for every started block of the package's appointment hours, the hours used divided by the package's appointment hours and rounded up to a whole number; an appointment that used half of the package's appointment hours or less is billed half_visit_share of a fee; any other appointment is billed one fee."
      consult_lines_on_file: "The repeat-visit multiple is set by the consultation fee lines already on the file"
      repeat_visit_multiple: "two or more such lines give third_fee_multiple, exactly one gives second_fee_multiple, and none gives a multiple of one."
      recent_order: "The order relief rate is set by the change order whose option lines were added most recently on the file"
      recent_order_date: "counted in calendar days from the billed appointment to the date those lines were added"
      recent_order_total: "the option lines added under that change order total large_order_usd or more"
      days_to_order: "counted in calendar days from the billed appointment to the date those lines were added"
      order_relief_rate: "where they were added on the appointment date or up to order_window_days days after it and the option lines added under that change order total large_order_usd or more, the fee is charged at large_order_relief_pct percent; where they were added on the appointment date or up to order_window_days days after it and the option lines added under that change order total less than large_order_usd, the fee is charged at small_order_relief_pct percent; otherwise the fee is charged at 100 percent."
      consult_fee: "The consultation fee for a selection appointment held beyond the package's included appointments is the package's extra appointment fee times the channel rate, times the build stage rate, times the billed fee count, times the repeat-visit multiple, times the order relief rate, rounded half up to the cent once at the end."
      result: "it is billed only when the number of selection appointments held on the file exceeds the package's included appointments."
    factors:
      - id: appointment_channel_rate
        effect: parameter
        decides: channel_rate
        bindings: [billed_appointment_channel, channel_rate]
        ladder:
          - when: "the billed appointment was held by video and ran longer than the package's appointment hours"
            value: "K('video_over_hours_pct')"
          - when: "the billed appointment was held by video within the package's appointment hours"
            value: "K('video_within_hours_pct')"
          - when: "otherwise (held in the studio)"
            value: "100"
        baseline:
          channel_rate: "100"
        evidence: [history]
        cross_difficulty: null
      - id: build_stage_rate
        effect: parameter
        decides: build_stage_rate
        bindings: [construction_start, days_after_start, build_stage_rate]
        ladder:
          - when: "the billed appointment was held settled_build_days days or more after the agreement's construction start date"
            value: "K('settled_build_pct')"
          - when: "the billed appointment was held on or after the construction start date but fewer than settled_build_days days after it"
            value: "K('early_build_pct')"
          - when: "otherwise (before construction started, or construction not started)"
            value: "100"
        baseline:
          build_stage_rate: "100"
        evidence: [cross_category, date]
        cross_difficulty: purchase
      - id: billed_fee_count
        effect: method
        decides: billed_fee_count
        bindings: [billed_hours, billed_fee_count]
        ladder:
          - when: "the billed appointment ran longer than the package's appointment hours"
            method: "one fee for every started block of the package's appointment hours (hours used divided by the package's appointment hours, rounded up to a whole number)"
          - when: "the billed appointment used half of the package's appointment hours or less"
            method: "half_visit_share of a fee"
          - when: "otherwise"
            method: "one fee"
        baseline:
          billed_fee_count: "1"
        evidence: [history]
        cross_difficulty: null
      - id: repeat_visit_multiple
        effect: parameter
        decides: repeat_visit_multiple
        bindings: [consult_lines_on_file, repeat_visit_multiple]
        ladder:
          - when: "two or more consultation fee lines are already on the file"
            value: "K('third_fee_multiple')"
          - when: "exactly one consultation fee line is already on the file"
            value: "K('second_fee_multiple')"
          - when: "otherwise (none)"
            value: "1"
        baseline:
          repeat_visit_multiple: "1"
        evidence: [history]
        cross_difficulty: null
      - id: order_relief_rate
        effect: parameter
        decides: order_relief_rate
        bindings: [recent_order, recent_order_date, recent_order_total, days_to_order, order_relief_rate]
        ladder:
          - when: "the most recent change order's option lines were added within order_window_days days of the billed appointment and total large_order_usd or more"
            value: "K('large_order_relief_pct')"
          - when: "the most recent change order's option lines were added within order_window_days days of the billed appointment and total less than large_order_usd"
            value: "K('small_order_relief_pct')"
          - when: "otherwise"
            value: "100"
        baseline:
          order_relief_rate: "100"
