events:
  - type: design_selection_opened
    target: design_selections
    mutation: create
    meaning: A design studio file is opened for a ratified to-be-built purchase agreement with the buyer's chosen package.
    grain: One row per file opened.
    fields:
      customer_id: The buyer.
      purchase_id: The purchase agreement the file serves.
      variant_name: Design Studio package chosen, the official tier name.
      status: Always awaiting_appointment on creation.
      opened_date: Date the file was opened.
      option_total: 0.00 on creation.
      option_deposit_held: 0.00 on creation.
      design_credit_balance: 0.00 on creation.
    triggers: []
  - type: design_appointment_held
    target: design_events
    meaning: A design appointment with a studio designer takes place.
    grain: One row per appointment.
    distinguish_by: [appointment_seq]
    fields:
      appointment_seq: Sequence number of the appointment on the file, starting at 1.
      appointment_type: Kind of appointment.
      appointment_channel: Whether held in the studio or by video.
      appointment_hours: Designer hours used.
      event_date: Appointment date.
    triggers:
      - event: design:design_selection_started
        when: {appointment_seq: 1}
        map: {first_appointment_date: event_date}
  - type: design_selection_started
    target: design_selections
    mutation: {transition: {from: awaiting_appointment, to: in_selection}}
    meaning: The first appointment opens selections.
    grain: One row per transaction.
    fields:
      status: Becomes in_selection.
      first_appointment_date: Date of the first appointment.
    triggers:
      - event: design:design_credit_granted
        map: {credit_source: package_allowance, event_date: first_appointment_date}
  - type: design_package_changed
    target: design_selections
    mutation: update
    meaning: The buyer moves the file to a different Design Studio package.
    grain: One row per transaction.
    fields:
      variant_name: New package.
    triggers: []
  - type: design_option_added
    target: design_events
    meaning: An option or a studio fee line is added to the file at its price.
    grain: One row per option line.
    distinguish_by: [option_line_ref]
    fields:
      amount: Price of the line, positive.
      option_line_ref: Line number of the option on the selection sheet, e.g. OPT-CH0147-012.
      option_code: Catalog code of the option, e.g. KIT-QTZ-L3.
      option_category: Category of the line.
      selection_channel: Where the line was selected.
      change_order_number: Change order the line belongs to, empty for lines selected before the first change order.
      construction_stage_at_event: Construction stage on the purchase agreement when the line was added.
      event_date: Date selected.
    account: option_commitment
    direction: in
    triggers: []
  - type: design_option_removed
    target: design_events
    meaning: A previously selected option line is removed and its credit taken off the option total.
    grain: One row per option line removed.
    distinguish_by: [source_line_ref]
    fields:
      amount: Credit for the removed line, positive.
      source_line_ref: Line number of the option line removed.
      option_category: Category of the removed line.
      change_order_number: Change order that removed the line.
      construction_stage_at_event: Construction stage when removed.
      event_date: Date removed.
    account: option_commitment
    direction: out
    triggers: []
  - type: design_change_order_recorded
    target: design_events
    meaning: A change order to the selections is written, with its change order fee.
    grain: One row per change order.
    distinguish_by: [change_order_number]
    fields:
      amount: Change order fee charged, 0.00 for a free change order.
      change_order_number: Change order number on the file, e.g. CO-2.
      change_order_reason: Why the change order was written.
      construction_stage_at_event: Construction stage when written.
      event_date: Date written.
    account: option_commitment
    direction: in
    triggers: []
  - type: design_deposit_paid
    target: design_events
    meaning: The buyer pays an option deposit.
    grain: One row per payment.
    distinguish_by: [payment_reference]
    fields:
      amount: Amount paid, positive.
      payment_method: How it was paid.
      payment_reference: Receipt number printed on the Calloway receipt.
      event_date: Date posted.
    account: option_deposit
    direction: in
    triggers: []
  - type: design_deposit_refunded
    target: design_events
    meaning: Option deposit money is refunded to the buyer.
    grain: One row per source payment refunded.
    distinguish_by: [source_payment_ref, refund_reason]
    fields:
      amount: Amount refunded, positive.
      source_payment_ref: Receipt number of the option deposit payment refunded.
      refund_reason: Why it is refunded.
      event_date: Date refunded.
    account: option_deposit
    direction: out
    triggers: []
  - type: design_deposit_forfeited
    target: design_events
    meaning: Option deposit money is retained by Calloway on a cancellation.
    grain: One row per source payment forfeited.
    distinguish_by: [source_payment_ref]
    fields:
      amount: Amount retained, positive.
      source_payment_ref: Receipt number of the option deposit payment retained.
      event_date: Date of forfeiture.
    account: option_deposit
    direction: out
    triggers: []
  - type: design_deposit_applied
    target: design_events
    meaning: Option deposits are credited against the amount due at closing.
    grain: One row per source payment applied.
    distinguish_by: [source_payment_ref]
    fields:
      amount: Amount credited, positive.
      source_payment_ref: Receipt number of the option deposit payment credited.
      event_date: Closing date.
    account: option_deposit
    direction: out
    triggers: []
  - type: design_payment_returned
    target: design_events
    meaning: An option deposit payment is returned unpaid.
    grain: One row per returned payment.
    distinguish_by: [source_payment_ref]
    fields:
      amount: Amount returned, positive.
      source_payment_ref: Receipt number of the returned payment.
      event_date: Date Calloway was notified.
    account: option_deposit
    direction: out
    triggers: []
  - type: design_credit_granted
    target: design_events
    meaning: Design credit is added to the file.
    grain: One row per credit grant.
    distinguish_by: [credit_source, credit_reference]
    fields:
      amount: Credit granted, positive.
      credit_source: Where the credit comes from.
      credit_reference: Credit memo number, e.g. DCM-0412.
      event_date: Date granted.
    account: design_credit
    direction: in
    triggers: []
  - type: design_credit_applied
    target: design_events
    meaning: Design credit is used against one option line.
    grain: One row per credit source per option line.
    distinguish_by: [source_line_ref, credit_source]
    fields:
      amount: Credit used, positive.
      credit_source: Which credit is used.
      source_line_ref: Option line the credit is applied to.
      event_date: Date applied.
    account: design_credit
    direction: out
    triggers: []
  - type: design_credit_forfeited
    target: design_events
    meaning: Unused design credit lapses when selections are final or the file is cancelled.
    grain: One row per credit source forfeited.
    distinguish_by: [credit_source]
    fields:
      amount: Credit forfeited, positive.
      credit_source: Which credit lapses.
      event_date: Date of forfeiture.
    account: design_credit
    direction: out
    triggers: []
  - type: design_structural_closed
    target: design_selections
    mutation: {transition: [{from: in_selection, to: structural_closed}, {from: awaiting_appointment, to: structural_closed}]}
    meaning: Construction starts and structural selections close.
    grain: One row per transaction.
    fields:
      status: Becomes structural_closed.
    triggers: []
  - type: design_finalized
    target: design_selections
    mutation: {transition: {from: structural_closed, to: finalized}}
    meaning: The home reaches drywall and every selection is final.
    grain: One row per transaction.
    fields:
      status: Becomes finalized.
    triggers:
      - event: design:design_credit_forfeited
  - type: design_delivered
    target: design_selections
    mutation: {transition: {from: finalized, to: delivered}}
    meaning: The home closes and the option deposits are credited at closing.
    grain: One row per transaction.
    fields:
      status: Becomes delivered.
      end_date: Closing date.
    triggers:
      - event: design:design_deposit_applied
        map: {event_date: end_date}
  - type: design_cancelled
    target: design_selections
    mutation: {transition: [{from: awaiting_appointment, to: cancelled}, {from: in_selection, to: cancelled}, {from: structural_closed, to: cancelled}, {from: finalized, to: cancelled}]}
    meaning: The purchase agreement ends without closing and the design file is closed.
    grain: One row per transaction.
    fields:
      status: Becomes cancelled.
      end_date: Date the purchase agreement was cancelled or terminated.
    triggers:
      - event: design:design_credit_forfeited
        map: {event_date: end_date}

measures:
  - id: design_msr_extra_appointments
    window: Life of the file.
    measure: Count of design_appointment_held rows with appointment_type selection beyond included_appointments.
  - id: design_msr_paid_change_orders
    window: Life of the file.
    measure: Count of design_change_order_recorded rows with change_order_reason buyer_request (builder_error change orders excluded).
  - id: design_msr_portal_total
    window: Life of the file.
    measure: Sum of design_option_added amounts with selection_channel portal minus design_option_removed credits of those lines.

policies:
  - id: design_agg_multi_holding
    subject: [design_selection_opened]
    rule: >-
      A buyer may hold up to max_per_customer design studio files, one for each open to-be-built
      purchase agreement; a file is never opened for an inventory home.
    eligibility: []
    params:
      max_per_customer: 2

  - id: design_agg_one_file_per_agreement
    subject: [design_selection_opened]
    rule: >-
      Each purchase agreement carries at most one design studio file at a time; a second file on the
      same agreement is opened only after the first is cancelled. A file is opened only for a purchase agreement that has no other design studio file in a status other than cancelled.
    eligibility:
      - id: one_file
        applies_to: [design_selection_opened]
        kind: dedup
        condition: "A file is opened only for a purchase agreement that has no other design studio file in a status other than cancelled."
        evidence_fields: [design_selections.purchase_id, design_selections.status]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [design_selections.purchase_id]
          action_bindings:
            design_selections.purchase_id: purchase_id
        dedup_contract:
          table: design_selections
          mode: same_record
          object_bindings: {purchase_id: purchase_id}
          duplicate_filters: {status: [awaiting_appointment, in_selection, structural_closed, finalized, delivered]}
          distinct_fields: []

  - id: design_package_eligibility
    subject: [design_selection_opened, design_package_changed, design_option_added]
    rule: >-
      A package may be chosen only for a purchase agreement whose collection is listed in the package's
      eligible_collections. The package may be changed while the file is awaiting_appointment or
      in_selection: moving up carries the new package's package_upgrade_fee_usd as a package_fee option
      line, and moving down is allowed only where the current package's package_downgrade_allowed is
      true. A package change is written only on a file whose status is awaiting_appointment or in_selection.
      On a change the package allowance already granted is replaced by the new package's allowance
      less any allowance already applied, never below zero.
    eligibility:
      - id: package_change_state
        applies_to: [design_package_changed]
        kind: state
        condition: "A package change is written only on a file whose status is awaiting_appointment or in_selection."
        evidence_fields: [design_selections.status, design_selections.selection_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [design_selections.selection_id]
          action_bindings:
            design_selections.selection_id: selection_id
        state_contract:
          field: design_selections.status
          allowed: [awaiting_appointment, in_selection]

  - id: design_appointments
    subject: [design_appointment_held, design_selection_started, design_option_added]
    rule: >-
      The package includes included_appointments selection appointments of appointment_hours each;
      each further selection appointment carries extra_appointment_fee_usd as a design_consult_fee
      option line. An electrical walk is held once, after framing and before drywall; it is free where
      electrical_walk_included is true and otherwise carries electrical_walk_fee_usd as a
      design_consult_fee option line. Appointments may be held by video only where
      virtual_appointment_allowed is true. The first appointment should be held within first_appointment_due_days calendar days after the file was opened.
      Counting starts the day after the opened date and the last counted day is included. A file
      whose first appointment was not held in time keeps its place but the package allowance is not
      granted until the first appointment is held, and structural selections close at construction
      start whatever has been selected.
    eligibility:
      - id: first_appointment_deadline
        applies_to: [design_selection_started]
        kind: time
        condition: "The first appointment should be held within first_appointment_due_days calendar days after the file was opened."
        evidence_fields: [design_selections.opened_date, design_selections.selection_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [design_selections.selection_id]
          action_bindings:
            design_selections.selection_id: selection_id
        temporal_basis:
          clock: frozen_time
          anchor_event: the file was opened
          anchor_source: design_selections.opened_date
          relation: not_after
          duration_source: variants.first_appointment_due_days
          unit: calendar_days
          counting_rule: Counting starts the day after the opened date and the last counted day is included
          boundary: inclusive
    measures: [design_msr_extra_appointments]

  - id: design_option_selection
    subject: [design_option_added, design_option_removed]
    rule: >-
      Options are added to the file at the price quoted at the appointment. A quoted option price is honored only when the line is added within option_price_protection_days calendar days after the appointment at which it was quoted.
      Counting starts the day after the appointment date and the last counted day is included;
      after that the current studio price applies. Option lines are added or removed only while the file status is in_selection or structural_closed.
      Structural, electrical and plumbing lines are added or removed only while the file is
      in_selection, unless structural_changes_after_start_allowed is true; finish lines (cabinetry,
      countertops, flooring, appliances, exterior) also while structural_closed. Lines at or below the
      package's included levels (included_cabinet_level, included_countertop_level,
      included_flooring_level, appliance_package_included, smart_home_package_included) carry no price.
      Finish lines may be selected through the buyer portal only where online_selection_allowed is true
      and design_msr_portal_total stays within portal_selection_cap_usd. A removed line is credited at
      removal_credit_pct_in_selection percent of its price while the file is in_selection and at
      removal_credit_pct_after_structural_close percent after structural close, rounded half up to the
      cent. After the first appointment, every addition or removal is written under a change order.
    eligibility:
      - id: open_for_changes
        applies_to: [design_option_added, design_option_removed]
        kind: state
        condition: "Option lines are added or removed only while the file status is in_selection or structural_closed."
        evidence_fields: [design_selections.status, design_selections.selection_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [design_selections.selection_id]
          action_bindings:
            design_selections.selection_id: selection_id
        state_contract:
          field: design_selections.status
          allowed: [in_selection, structural_closed]
      - id: price_protection
        applies_to: [design_option_added]
        kind: time
        condition: "A quoted option price is honored only when the line is added within option_price_protection_days calendar days after the appointment at which it was quoted."
        evidence_fields: [design_events.event_date, design_events.appointment_seq]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [design_events.appointment_seq]
          action_bindings:
            design_events.appointment_seq: appointment_seq
        temporal_basis:
          clock: frozen_time
          anchor_event: the appointment at which it was quoted
          anchor_source: design_events.event_date
          relation: not_after
          duration_source: variants.option_price_protection_days
          unit: calendar_days
          counting_rule: Counting starts the day after the appointment date and the last counted day is included
          boundary: inclusive
    formula:
      removal_credit_in_selection: round(amount * removal_credit_pct_in_selection / 100, 2)
      removal_credit_after_close: round(amount * removal_credit_pct_after_structural_close / 100, 2)
    measures: [design_msr_portal_total]

  - id: design_change_orders
    subject: [design_change_order_recorded, design_option_added, design_option_removed]
    rule: >-
      Every set of changes after the first appointment is written as one numbered change order. The
      first free_change_orders buyer-requested change orders carry no fee; each later one carries
      change_order_fee_usd while the file is in_selection and post_structural_change_order_fee_usd once
      it is structural_closed. A buyer may make at most max_change_orders buyer-requested change orders
      (design_msr_paid_change_orders). A change order written to correct a studio or builder error
      carries no fee and does not count toward either limit where change_order_fee_waived_builder_error
      is true. A change order is written only on a file whose status is in_selection or structural_closed.
      Once the file is finalized no change order is accepted, because finish_changes_after_drywall_allowed
      is false for every package.
    eligibility:
      - id: change_order_state
        applies_to: [design_change_order_recorded]
        kind: state
        condition: "A change order is written only on a file whose status is in_selection or structural_closed."
        evidence_fields: [design_selections.status, design_selections.selection_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [design_selections.selection_id]
          action_bindings:
            design_selections.selection_id: selection_id
        state_contract:
          field: design_selections.status
          allowed: [in_selection, structural_closed]
    params:
      per_tier:
        Studio Essentials: {free: "=free_change_orders", fee_in_selection: "=change_order_fee_usd", fee_after_structural: "=post_structural_change_order_fee_usd", max: "=max_change_orders"}
        Studio Classic: {free: "=free_change_orders", fee_in_selection: "=change_order_fee_usd", fee_after_structural: "=post_structural_change_order_fee_usd", max: "=max_change_orders"}
        Studio Select: {free: "=free_change_orders", fee_in_selection: "=change_order_fee_usd", fee_after_structural: "=post_structural_change_order_fee_usd", max: "=max_change_orders"}
        Studio Designer: {free: "=free_change_orders", fee_in_selection: "=change_order_fee_usd", fee_after_structural: "=post_structural_change_order_fee_usd", max: "=max_change_orders"}
        Studio Signature: {free: "=free_change_orders", fee_in_selection: "=change_order_fee_usd", fee_after_structural: "=post_structural_change_order_fee_usd", max: "=max_change_orders"}
        Studio Atelier: {free: "=free_change_orders", fee_in_selection: "=change_order_fee_usd", fee_after_structural: "=post_structural_change_order_fee_usd", max: "=max_change_orders"}
    measures: [design_msr_paid_change_orders]

  - id: design_option_deposits
    subject: [design_deposit_paid, design_option_added, design_payment_returned]
    rule: >-
      The option deposit required on the file is computed over its current option lines: structural,
      electrical and plumbing lines at structural_deposit_pct percent and all other lines at
      finish_deposit_pct percent of their price; once the option total exceeds
      deposit_ladder_threshold_usd every line is deposited at no less than deposit_ladder_elevated_pct
      percent; and the part of the option total above option_cap_pct_of_base percent of the purchase
      agreement's base price is deposited at excess_over_cap_deposit_pct percent, taking the larger
      requirement for that part. Fee lines (design_consult_fee, package_fee, card_convenience_fee,
      returned_payment_fee) and change order fees are deposited in full. Each amount is rounded half up
      to the cent. The deposit shortfall created by a line must be paid within deposit_due_business_days business days after the line was selected.
      Business days are Monday through Friday excluding Calloway holidays and counting starts the next
      business day after the selection date. Payments must use accepted_payment_methods; a card payment
      may not exceed card_payment_cap_usd and carries card_convenience_fee_pct as a
      card_convenience_fee line. A returned payment comes off the deposits held and adds a
      returned_payment_fee line of returned_payment_fee_usd. An unpaid shortfall past its due date is
      reported to the purchase agreement as a buyer default.
    eligibility:
      - id: deposit_deadline
        applies_to: [design_deposit_paid]
        kind: time
        condition: "The deposit shortfall created by a line must be paid within deposit_due_business_days business days after the line was selected."
        evidence_fields: [design_events.event_date, design_events.option_line_ref]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [design_events.option_line_ref]
          action_bindings:
            design_events.option_line_ref: option_line_ref
        temporal_basis:
          clock: frozen_time
          anchor_event: the line was selected
          anchor_source: design_events.event_date
          relation: not_after
          duration_source: variants.deposit_due_business_days
          unit: business_days
          counting_rule: Business days are Monday through Friday excluding Calloway holidays and counting starts the next business day after the selection date
          boundary: inclusive
    params:
      per_tier:
        Studio Essentials: {structural_pct: "=structural_deposit_pct", finish_pct: "=finish_deposit_pct", ladder_threshold: "=deposit_ladder_threshold_usd", cap_pct: "=option_cap_pct_of_base"}
        Studio Classic: {structural_pct: "=structural_deposit_pct", finish_pct: "=finish_deposit_pct", ladder_threshold: "=deposit_ladder_threshold_usd", cap_pct: "=option_cap_pct_of_base"}
        Studio Select: {structural_pct: "=structural_deposit_pct", finish_pct: "=finish_deposit_pct", ladder_threshold: "=deposit_ladder_threshold_usd", cap_pct: "=option_cap_pct_of_base"}
        Studio Designer: {structural_pct: "=structural_deposit_pct", finish_pct: "=finish_deposit_pct", ladder_threshold: "=deposit_ladder_threshold_usd", cap_pct: "=option_cap_pct_of_base"}
        Studio Signature: {structural_pct: "=structural_deposit_pct", finish_pct: "=finish_deposit_pct", ladder_threshold: "=deposit_ladder_threshold_usd", cap_pct: "=option_cap_pct_of_base"}
        Studio Atelier: {structural_pct: "=structural_deposit_pct", finish_pct: "=finish_deposit_pct", ladder_threshold: "=deposit_ladder_threshold_usd", cap_pct: "=option_cap_pct_of_base"}

  - id: design_credits
    subject: [design_credit_granted, design_credit_applied, design_credit_forfeited]
    rule: >-
      The package allowance package_allowance_usd is granted once, when the first appointment is held.
      A studio manager may grant builder goodwill credit up to goodwill_credit_cap_usd in total on one
      file; promotional credit may be granted only as a published promotion. Credits are applied to
      option lines in the order package_allowance, promotional_credit, builder_goodwill, and never to
      fee lines; the package allowance reaches structural, electrical and plumbing lines only where
      allowance_applies_to_structural is true. Promotional credit applied may not exceed
      promo_credit_cap_pct_of_options percent of the option total at the time it is applied. Credit has
      no cash value: unused credit is forfeited when the file is finalized where
      allowance_expires_at_finalization is true, and when the file is cancelled. Credit may be applied only while the file status is in_selection or structural_closed.
    eligibility:
      - id: credit_state
        applies_to: [design_credit_applied]
        kind: state
        condition: "Credit may be applied only while the file status is in_selection or structural_closed."
        evidence_fields: [design_selections.status, design_selections.selection_id]
        evidence_contract:
          authority: system_record
          timing: pre_action
          correlation_keys:
            - [design_selections.selection_id]
          action_bindings:
            design_selections.selection_id: selection_id
        state_contract:
          field: design_selections.status
          allowed: [in_selection, structural_closed]
    params:
      per_tier:
        Studio Essentials: {allowance: "=package_allowance_usd", goodwill_cap: "=goodwill_credit_cap_usd", promo_cap_pct: "=promo_credit_cap_pct_of_options"}
        Studio Classic: {allowance: "=package_allowance_usd", goodwill_cap: "=goodwill_credit_cap_usd", promo_cap_pct: "=promo_credit_cap_pct_of_options"}
        Studio Select: {allowance: "=package_allowance_usd", goodwill_cap: "=goodwill_credit_cap_usd", promo_cap_pct: "=promo_credit_cap_pct_of_options"}
        Studio Designer: {allowance: "=package_allowance_usd", goodwill_cap: "=goodwill_credit_cap_usd", promo_cap_pct: "=promo_credit_cap_pct_of_options"}
        Studio Signature: {allowance: "=package_allowance_usd", goodwill_cap: "=goodwill_credit_cap_usd", promo_cap_pct: "=promo_credit_cap_pct_of_options"}
        Studio Atelier: {allowance: "=package_allowance_usd", goodwill_cap: "=goodwill_credit_cap_usd", promo_cap_pct: "=promo_credit_cap_pct_of_options"}

  - id: design_cancellation_deposits
    subject: [design_cancelled, design_deposit_refunded, design_deposit_forfeited]
    rule: >-
      When the purchase agreement is cancelled or terminated the design file is cancelled on the same
      date. Option deposits are then refunded by the cancellation basis recorded on the purchase
      agreement's cancellation request and by the file status when the agreement ended: on a
      rescission or builder_delay cancellation, builder_side_cancel_refund_pct percent; on any other
      buyer cancellation before structural close, deposit_refund_pct_before_structural_close percent;
      after structural close, or on a termination for buyer default,
      deposit_refund_pct_after_structural_close percent. Each refund and forfeiture is computed per
      source payment and rounded half up to the cent, the forfeited part being the remainder. Refunds
      follow the purchase agreement's refund timing.
    eligibility: []
    formula:
      refund_before_close: round(amount * deposit_refund_pct_before_structural_close / 100, 2)

  - id: design_cutoffs_and_delivery
    subject: [design_structural_closed, design_finalized, design_delivered, design_deposit_applied, design_selection_opened]
    rule: >-
      Structural selections close when construction starts on the purchase agreement and every
      selection is final when the home reaches drywall; these status changes follow the construction
      record and are not made on request. A file is opened only for a purchase agreement that is
      ratified and not an inventory home. At closing every option deposit held is credited against the
      amount due where deposit_credit_at_closing is true, one row per source payment.
    eligibility: []

# ============================================================================
# extended_policies (design_studio_changes)
# ============================================================================
extended_policies:
  - id: design_ext_error_goodwill_credit
    base_policy_refs: [design_credits, design_change_orders]
    overwrite:
      - base_policy: design_credits
        superseded_clause: >-
          A studio manager may grant builder goodwill credit up to goodwill_credit_cap_usd in total on one
          file;
        replaced_by: >-
          The goodwill room of the file is the package's goodwill credit cap less the builder goodwill
          credit already granted on the file, never below zero.
    trigger: state_due
    subject: [design_credit_granted]
    computes: credit_amount
    target_tool: grant_goodwill_credit_33ff7b41
    params:
      long_error_days: 30
      long_studio_error_pct: 20
      short_studio_error_pct: 10
      standard_goodwill_pct: 5
      locked_affiliated_points: 5
      unlocked_affiliated_points: 2.5
      two_error_multiple: 2
      three_error_multiple: 3
      long_slip_days: 30
      long_slip_addon_usd: 500.00
      short_slip_addon_usd: 250.00
    rule: >-
      Every change order written to correct a design studio or builder error is compensated with one
      builder goodwill credit on the file, granted under that change order's number. The change order
      being compensated is the most recently written error-correcting change order on the file. The
      goodwill credit for an error-correcting change order is the error amount of that change order
      times the goodwill percent, rounded half up to the cent, and it is limited to the goodwill room
      of the file. The error amount of an error-correcting change order is the price at which the option
      line it removed had been selected. The goodwill percent is standard_goodwill_pct percent. The
      goodwill room of the file is the package's goodwill credit cap less the builder goodwill credit
      already granted on the file, never below zero.
      The error amount is set by what the change order put in place of the removed line: where the
      change order added a replacement option line priced below the removed line, the error amount is
      the removed line's price less the replacement line's price; where it added a replacement option
      line priced at or above the removed line, the error amount is the replacement line's price; where
      it added no replacement line, the error amount is the removed line's price.
      The goodwill percent is set by where the wrong entry was made and how long it stood, counted in
      calendar days from the date the removed line was selected to the date of the error-correcting
      change order: a removed line selected in the studio that stood more than long_error_days days is
      credited at long_studio_error_pct percent; a removed line selected in the studio that stood
      long_error_days days or fewer is credited at short_studio_error_pct percent; a removed line selected
      through the buyer portal is credited at standard_goodwill_pct percent.
      Points are added to the goodwill percent according to the financing of the purchase agreement the
      file serves: where the agreement is financed through Calloway Home Mortgage and the rate lock on
      that agreement is locked, locked_affiliated_points points are added; where the agreement is
      financed through Calloway Home Mortgage and no rate lock on that agreement is locked,
      unlocked_affiliated_points points are added; where the agreement is financed by an outside lender
      or by cash, no points are added. The points are added to the goodwill percent before that percent
      is applied to the error amount.
      The goodwill credit cap that the goodwill room starts from is raised by the build slip of the
      purchase agreement, counted in calendar days from its contract completion date to its current
      estimated completion date: a build slip of more than long_slip_days days adds long_slip_addon_usd;
      a build slip of 1 to long_slip_days days adds short_slip_addon_usd; no build slip adds nothing.
      The raised cap is multiplied by a repeat-error multiple set by the number of error-correcting
      change orders on the file: three or more such change orders give three_error_multiple, exactly two
      give two_error_multiple, and a single one gives a multiple of one. The goodwill room is worked out
      by first adding the build slip addition to the cap, then multiplying that sum by the repeat-error
      multiple, and then subtracting the builder goodwill credit already granted on the file, never below
      zero; the goodwill credit is the smaller of the rounded amount and the goodwill room.
    prerequisite: []
    cross_category:
      - category: purchase
        as: branch
        reads: [financing_type, contract_completion_date, estimated_completion_date]
        note: decides the financing points and the build slip addition from the purchase agreement the file serves.
      - category: lock
        as: branch
        reads: [status]
        note: decides whether the Calloway Home Mortgage rate lock on the agreement is locked, for the financing points.
    compute:
      - error_order: "LATEST('design_events','change_order_number', event_type='design_change_order_recorded', change_order_reason='builder_error')"
      - error_order_date: "LATEST('design_events','event_date', event_type='design_change_order_recorded', change_order_reason='builder_error')"
      - removed_line: "LATEST('design_events','source_line_ref', event_type='design_option_removed', change_order_number=error_order)"
      - removed_line_price: "SUM('design_events','amount', event_type='design_option_added', option_line_ref=removed_line)"
      - replacement_price: "SUM('design_events','amount', event_type='design_option_added', change_order_number=error_order)"
      - error_amount: "(removed_line_price - replacement_price) if (replacement_price > 0 and replacement_price < removed_line_price) else (replacement_price if (replacement_price > 0 and replacement_price >= removed_line_price) else removed_line_price)"
      - removed_line_date: "LATEST('design_events','event_date', event_type='design_option_added', option_line_ref=removed_line)"
      - removed_line_channel: "LATEST('design_events','selection_channel', event_type='design_option_added', option_line_ref=removed_line)"
      - error_days_stood: "DAYS(removed_line_date, error_order_date)"
      - goodwill_pct: "K('long_studio_error_pct') if (removed_line_channel == 'studio' and error_days_stood > K('long_error_days')) else (K('short_studio_error_pct') if (removed_line_channel == 'studio' and error_days_stood <= K('long_error_days')) else K('standard_goodwill_pct'))"
      - agreement_financing: "CFIELD('purchase','financing_type', purchase_id=F('purchase_id'))"
      - agreement_lock_status: "CFIELD('lock','status', purchase_id=F('purchase_id'))"
      - financing_points: "K('locked_affiliated_points') if (agreement_financing == 'calloway_home_mortgage' and agreement_lock_status == 'locked') else (K('unlocked_affiliated_points') if (agreement_financing == 'calloway_home_mortgage' and agreement_lock_status != 'locked') else 0)"
      - error_order_count: "COUNT('design_events', event_type='design_change_order_recorded', change_order_reason='builder_error')"
      - repeat_error_multiple: "K('three_error_multiple') if error_order_count >= 3 else (K('two_error_multiple') if error_order_count == 2 else 1)"
      - contract_completion: "CFIELD('purchase','contract_completion_date', purchase_id=F('purchase_id'))"
      - estimated_completion: "CFIELD('purchase','estimated_completion_date', purchase_id=F('purchase_id'))"
      - build_slip_days: "DAYS(contract_completion, estimated_completion)"
      - slip_addition: "K('long_slip_addon_usd') if build_slip_days > K('long_slip_days') else (K('short_slip_addon_usd') if build_slip_days > 0 else 0)"
      - goodwill_granted: "SUM('design_events','amount', event_type='design_credit_granted', credit_source='builder_goodwill')"
      - goodwill_room: "MX(0, (P('goodwill_credit_cap_usd') + slip_addition) * repeat_error_multiple - goodwill_granted)"
      - goodwill_amount: "RND(error_amount * (goodwill_pct + financing_points) / 100, 2)"
      - result: "MN(goodwill_amount, goodwill_room)"
    compute_basis:
      error_order: "The change order being compensated is the most recently written error-correcting change order on the file."
      error_order_date: "counted in calendar days from the date the removed line was selected to the date of the error-correcting change order"
      removed_line: "The error amount of an error-correcting change order is the price at which the option line it removed had been selected."
      removed_line_price: "The error amount of an error-correcting change order is the price at which the option line it removed had been selected."
      replacement_price: "where the change order added a replacement option line priced below the removed line, the error amount is the removed line's price less the replacement line's price"
      error_amount: "The error amount is set by what the change order put in place of the removed line: where the change order added a replacement option line priced below the removed line, the error amount is the removed line's price less the replacement line's price; where it added a replacement option line priced at or above the removed line, the error amount is the replacement line's price; where it added no replacement line, the error amount is the removed line's price."
      removed_line_date: "counted in calendar days from the date the removed line was selected to the date of the error-correcting change order"
      removed_line_channel: "a removed line selected in the studio that stood more than long_error_days days is credited at long_studio_error_pct percent"
      error_days_stood: "counted in calendar days from the date the removed line was selected to the date of the error-correcting change order"
      goodwill_pct: "a removed line selected in the studio that stood more than long_error_days days is credited at long_studio_error_pct percent; a removed line selected in the studio that stood long_error_days days or fewer is credited at short_studio_error_pct percent; a removed line selected through the buyer portal is credited at standard_goodwill_pct percent."
      agreement_financing: "Points are added to the goodwill percent according to the financing of the purchase agreement the file serves"
      agreement_lock_status: "where the agreement is financed through Calloway Home Mortgage and the rate lock on that agreement is locked, locked_affiliated_points points are added"
      financing_points: "where the agreement is financed through Calloway Home Mortgage and the rate lock on that agreement is locked, locked_affiliated_points points are added; where the agreement is financed through Calloway Home Mortgage and no rate lock on that agreement is locked, unlocked_affiliated_points points are added; where the agreement is financed by an outside lender or by cash, no points are added."
      error_order_count: "The raised cap is multiplied by a repeat-error multiple set by the number of error-correcting change orders on the file"
      repeat_error_multiple: "three or more such change orders give three_error_multiple, exactly two give two_error_multiple, and a single one gives a multiple of one."
      contract_completion: "counted in calendar days from its contract completion date to its current estimated completion date"
      estimated_completion: "counted in calendar days from its contract completion date to its current estimated completion date"
      build_slip_days: "counted in calendar days from its contract completion date to its current estimated completion date"
      slip_addition: "a build slip of more than long_slip_days days adds long_slip_addon_usd; a build slip of 1 to long_slip_days days adds short_slip_addon_usd; no build slip adds nothing."
      goodwill_granted: "The goodwill room of the file is the package's goodwill credit cap less the builder goodwill credit already granted on the file, never below zero."
      goodwill_room: "The goodwill room is worked out by first adding the build slip addition to the cap, then multiplying that sum by the repeat-error multiple, and then subtracting the builder goodwill credit already granted on the file, never below zero"
      goodwill_amount: "The points are added to the goodwill percent before that percent is applied to the error amount."
      result: "the goodwill credit is the smaller of the rounded amount and the goodwill room."
    factors:
      - id: error_amount_basis
        effect: method
        decides: error_amount
        bindings: [removed_line_price, replacement_price, error_amount]
        ladder:
          - when: "the error-correcting change order added a replacement option line priced below the removed line"
            method: "the error amount is the removed line's price less the replacement line's price"
          - when: "the error-correcting change order added a replacement option line priced at or above the removed line"
            method: "the error amount is the replacement line's price"
          - when: "otherwise (no replacement line was added)"
            method: "the error amount is the removed line's price"
        baseline:
          error_amount: "removed_line_price"
        evidence: [history]
        cross_difficulty: null
      - id: entry_channel_and_age
        effect: parameter
        decides: goodwill_pct
        bindings: [removed_line_date, removed_line_channel, error_days_stood, goodwill_pct]
        ladder:
          - when: "the removed line was selected in the studio and stood more than long_error_days days before the error-correcting change order"
            value: "K('long_studio_error_pct')"
          - when: "the removed line was selected in the studio and stood long_error_days days or fewer"
            value: "K('short_studio_error_pct')"
          - when: "otherwise (the removed line was selected through the buyer portal)"
            value: "K('standard_goodwill_pct')"
        baseline:
          goodwill_pct: "K('standard_goodwill_pct')"
        evidence: [history, date]
        cross_difficulty: null
      - id: affiliated_financing_points
        effect: parameter
        decides: financing_points
        bindings: [agreement_financing, agreement_lock_status, financing_points]
        ladder:
          - when: "the purchase agreement is financed through Calloway Home Mortgage and its rate lock is locked"
            value: "K('locked_affiliated_points')"
          - when: "the purchase agreement is financed through Calloway Home Mortgage and no rate lock on it is locked"
            value: "K('unlocked_affiliated_points')"
          - when: "otherwise (outside lender or cash)"
            value: "0"
        baseline:
          financing_points: "0"
        evidence: [cross_category]
        cross_difficulty: lock
      - id: repeat_error_multiple
        effect: parameter
        decides: repeat_error_multiple
        bindings: [error_order_count, repeat_error_multiple]
        ladder:
          - when: "the file carries three or more error-correcting change orders"
            value: "K('three_error_multiple')"
          - when: "the file carries exactly two error-correcting change orders"
            value: "K('two_error_multiple')"
          - when: "otherwise (a single error-correcting change order)"
            value: "1"
        baseline:
          repeat_error_multiple: "1"
        evidence: [history]
        cross_difficulty: null
      - id: build_slip_addition
        effect: parameter
        decides: slip_addition
        bindings: [contract_completion, estimated_completion, build_slip_days, slip_addition]
        ladder:
          - when: "the agreement's estimated completion date is more than long_slip_days days after its contract completion date"
            value: "K('long_slip_addon_usd')"
          - when: "the estimated completion date is 1 to long_slip_days days after the contract completion date"
            value: "K('short_slip_addon_usd')"
          - when: "otherwise (no build slip)"
            value: "0"
        baseline:
          slip_addition: "0"
        evidence: [cross_category, date]
        cross_difficulty: purchase
    baseline:
      rule: >-
        Every change order written to correct a design studio or builder error is compensated with one
        builder goodwill credit on the file, granted under that change order's number. The change order
        being compensated is the most recently written error-correcting change order on the file. The
        goodwill credit for an error-correcting change order is the error amount of that change order
        times the goodwill percent, rounded half up to the cent, and it is limited to the goodwill room
        of the file. The error amount of an error-correcting change order is the price at which the option
        line it removed had been selected. The goodwill percent is standard_goodwill_pct percent. The
        goodwill room of the file is the package's goodwill credit cap less the builder goodwill credit
        already granted on the file, never below zero.
      params: [standard_goodwill_pct, goodwill_credit_cap_usd]
